answer: |-
  # Q&A Prep Sheet: Procedural Relationalism & Scanlon
  **Talk:** Next Thursday | **Audience:** Moral Phil Working Group
  **Core Thesis:** Reasonable Rejection applies to institutional rule-systems, not isolated acts. Rejection is grounded in structural subordination, not aggregate welfare.

  ### Strategic Concession (Say this in your opening or first reply)
  **Concede:** "I am not claiming this is what Scanlon *wrote* in 1998. I am claiming this is what contractualism *requires* to handle institutional reality without collapsing into absolutism."
  **Why:** This disarms the two Scanlon dissertation writers immediately. If you claim textual fidelity, they will shred you on exegesis. If you claim *development*, they have to engage with the argument.

  ---

  ### 1. The "Individualist Core" Objection (The Scanlonians)
  **Damage Level:** Critical (Threatens the identity of your project)
  **Who:** The two dissertation writers.
  **The Objection:**
  "You're shifting the locus of justification from the individual to the system, but Scanlon's core insight is that justification must be owed *to each individual person* based on their generic reasons. By moving to 'institutional rule-systems,' you're allowing an individual to be overridden by a systemic benefit. Doesn't this violate the 'individualist restriction'? You're effectively saying my burden is acceptable because it serves the stability of the practice, which sounds exactly like the aggregative reasoning Scanlon banned."

  **Two-Minute Reply:**
  "The individualist restriction isn't violated because the *standing* to reject remains individual. I'm not saying 'the system benefits so you must suffer.' I'm saying 'you can reject this rule if it assigns you a status of structural subordination.'
  In standard Scanlonian cases (like Rescue III), we look at the specific act. But in institutional contexts, the 'act' is the adoption of the rule. If a rule systematically sacrifices a specific class of people for the aggregate, *that* is rejectable on individualist grounds—those individuals can say, 'This rule treats me as a means to social stability.'
  However, if the rule distributes burdens randomly or via a fair procedure where no one is structurally subordinate, the individual cannot reasonably reject it simply because they got the short end of the stick this time. The rejection is about the *pattern of relations*, not the *outcome instance*. This preserves the individual's veto power over their status, without giving them a veto over efficient social coordination."

  **Weakest Point:**
  You are relying on a distinction between "outcome instance" and "structural status" that might feel semantic to them. If a rule *predictably* hurts the same person every time (even if not "structurally" defined), your theory might allow it, whereas strict Scanlonians would not. You haven't fully solved the "predictable victim" problem.

  ### 2. The "Smuggled Math" Objection (The Consequentialist)
  **Damage Level:** High (Threatens the necessity of your project)
  **Who:** The hardline consequentialist.
  **The Objection:**
  "Let's be honest. 'Structural subordination' is just a side-constraint on maximization. You're building a threshold deontology. Once you clear the bar of 'no subordination,' you're just letting us aggregate welfare to choose the best rule-system. Why not just admit you're a rule-utilitarian with a human rights constraint? Why dress this up as contractualism?"

  **Two-Minute Reply:**
  "Because the *justification* isn't about the math of the welfare gain. In rule-utilitarianism, if subordinating a group produced enough total welfare, you'd have to do it. In Procedural Relationalism, you can't do it even if the welfare gains are massive, because the *reason* is relational, not aggregative.
  Furthermore, the selection mechanism isn't 'maximize good.' It's 'could this be rejected by someone seeking reasonable agreement?' Sometimes the rule that produces slightly less welfare is the one we must choose because it's the only one that doesn't treat a group as inferiors. The metric isn't 'best outcome,' it's 'mutual recognizability.' The math is secondary to the relationship."

  **Weakest Point:**
  In hard cases, "mutual recognizability" will almost always align with "welfare maximization subject to constraints." The consequentialist will argue your view is extensionally equivalent to constrained maximization, making the contractualist machinery redundant.

  ### 3. The "Democratic Deficit" Objection (The PolSci Scholar)
  **Damage Level:** Medium-High (Threatens feasibility/legitimacy)
  **Who:** The visiting scholar.
  **The Objection:**
  "You're talking about institutional rule-systems and who gets to author them. But you're locating this 'authorship' in a hypothetical moral agreement, not actual democratic procedures. If a rule is non-rejectable in your sense but was imposed without actual consent, does it have legitimacy? Are you saying philosophers can validate institutions that actual citizens might vote down?"

  **Two-Minute Reply:**
  "That's a crucial distinction. Procedural Relationalism sets the *normative boundary conditions* for democratic design, it doesn't replace democracy.
  A rule can be democratically passed but still be reasonably rejectable if it creates structural subordination (e.g., a majority voting to permanently disenfranchise a minority). My framework explains *why* that democratic outcome is illegitimate.
  Conversely, a rule might be non-rejectable in principle but still require actual democratic endorsement to be binding. I'm offering the standard of justification that democratic deliberation *ought* to use, not a substitute for the deliberation itself. It's a check on democratic tyranny, not a replacement for democratic voice."

  **Weakest Point:**
  If the "hypothetical agreement" diverges from actual democratic will too often, your theory looks paternalistic. You need to be careful not to sound like you're saying "Philosophers know the real rules better than voters."

  ### 4. The "Muddy Waters" Objection (The Relational Equality Grads)
  **Damage Level:** Medium (Threatens clarity/alliances)
  **Who:** The grad students.
  **The Objection:**
  "We worry you're stretching 'relational equality' too thin. If you allow aggregation at the institutional level, aren't you risking that economic inequalities get justified as 'efficient rules' that aren't 'structurally subordinate'? You might be giving cover to the very hierarchies relational egalitarians fight."

  **Two-Minute Reply:**
  "I hear that worry. The key is the definition of 'structural subordination.' It's not just inequality; it's inequality that undermines the capacity to relate as equals.
  If an institutional rule creates economic disparities that translate into political domination or social stigma, it is rejectable. My view actually *strengthens* the relational critique by giving it a contractualist enforcement mechanism. It's not enough to say 'this feels unequal.' You have to show 'this rule prevents me from standing as an equal co-author of norms.' That raises the bar for critique, yes, but it makes the critique harder to dismiss as mere envy."

  **Weakest Point:**
  Defining "structural subordination" without being vague is hard. If you can't give a concrete example of a rule that fails your test but passes a utilitarian test, they will think you've diluted the concept.

  ---

  ### The Nightmare Question (Pray nobody asks this)
  **Damage Level:** Fatal (Collapses the theory)
  **The Question:**
  "If the 'reasonable rejection' test at the institutional level is sensitive to the number of people burdened (because widespread burden creates structural subordination), and it allows trade-offs so long as status is respected... how is this distinct from **Prioritarianism** with a sufficientarian constraint? You say it's about 'status,' but if status is determined by the distribution of burdens, haven't you just reinvented distributive justice theory and abandoned the contractualist focus on justification to individuals?"

  **Why this kills you:**
  This combines your roommate's worry (democratic legitimacy/proceduralism) with the Consequentialist's worry (math smuggling). It suggests you haven't created a new category, you've just renamed existing distributive theories.

  **Emergency Reply (Do not panic):**
  "Prioritarianism is concerned with the *weight* of benefits based on welfare levels. My view is concerned with the *terms of interaction* based on standing.
  In Prioritarianism, I can be sacrificed if the gain to the worse-off is high enough. In Procedural Relationalism, I cannot be sacrificed if doing so marks me as a subordinate class, regardless of the welfare gain.
  The distinction is the *currency* of the theory. They count welfare units (weighted); I count valid claims of authority. If the extensional overlap is high, that's an empirical claim, but the normative ground is fundamentally different: one is about 'how much good,' the other is about 'who decides.'"

  **Honest Weakness:**
  If they push on "who decides," you have to admit the "who" is hypothetical. If the hypothetical "who" tracks welfare weights, the distinction collapses. You need to hold the line that *reasons* matter, not just *weights*.

  ---

  ### Final Strategic Note
  **When to pivot:** If the Scanlonians get bogged down in textual exegesis ("But on page 234 Scanlon says..."), pivot immediately to the **PolSci** angle.
  **Say:** "Even if Scanlon didn't intend this, the *problem* of institutional design requires this solution. We can debate the history later, but right now we need a framework that handles policy."
  **Why:** This brings the PolSci scholar and the Relational Equality students onto your side, isolating the Purists as "historians" rather than "problem solvers."
