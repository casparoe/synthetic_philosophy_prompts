          1.  Two Scanlonians (Dissertation writers, strict anti-aggregation view).
          2.  One Hardline Consequentialist (thinks it's hidden math).
          3.  Grad Students (Relational Equality, worried about muddying waters).
          4.  Visiting PolSci Scholar (Democratic Legitimacy/Institutional Design).
      *   **Conflict:** Roommate argues this collapses into democratic legitimacy theory and abandons Scanlon's individualist core.
      *   **Needs:** A Q&A prep sheet. Specific objections based on the audience profiles. Phrased in their vocabulary. Two-minute replies. Honest weakness assessment. One "nightmare question." Advice on concessions.
      *   **Constraints:** No citations/bibliography. Strategic layout.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
