prompt: |-
  okay so me and my roommate got into this huge argument last night about Scanlon and aggregration, and now i'm giving a talk next thursday to the moral phil working group here. the audience is pretty specific: there are two people who basically wrote thier dissertations on Scanlon and think contractualism is strictly anti-aggregative, one hardline consequentialist who always claims we're just smuggling in the math, a couple grad students who work on relational equality and might actually like my angle but worry i'm muddying the waters, plus a visiting scholar from poli sci who cares about democratic legitimacy and will definitely ask about institutional design.

  my thesis is that Scanlon's reasonable rejection principle only looks anti-aggregative because everyone applies it at the wrong level. instead of asking whether one specific burden on one person is rejectable, we should apply it to institutional rule-systems that distribute burdens across populations. i call this procedural relationalism - the idea is that a rule is rejectable not if it hurts someone, but if it establishes a social practice that treats some people's interests as structurally subordinate in the aggregation process. so it's not rule-utilitarianism in disguise because the rejection is grounded in the relational status of being a co-author of shared norms, not in total welfare. but my roommate said this collapses into democratic legitimacy theory and that Scanlon would hate it because it abandons the individualist core.

  i need a prep sheet for the q&a. not generic twitter objections - the ones these specific people will actually raise, in the vocabulary they'd use. order them by how much damage they do. for each one, i want the objection phrased like they'd phrase it, a two-minute reply, and an honest note on where my reply is weakest. also include the question i'm praying nobody asks - probably something about whether this makes contractualism indistinguishable from prioritarianism or democratic proceduralism. don't bother with citations or a bibliography, i just need the strategic layout and maybe a note on what i should concede up front so i don't look defensive.
