  2.  **Deconstruct Whig Historiography:**
      *   *Origin:* Herbert Butterfield (*The Whig Interpretation of History*, 1931).
      *   *Core Commitment:* History as a story of progress toward the present. The present is the standard of truth.
      *   *Mechanism:* Sorting past figures into "men of progress" (anticipating us) and "men of retardation" (obstacles).
      *   *Risk:* Anachronism, ignoring context, simplifying complex debates into binary right/wrong.

  3.  **Analyze the 1854 Broad Street Case (Standard vs. Whig):**
      *   *Standard/Whig Story:* Snow = Genius/Truth. Miasma theorists = Ignorant/False. Pump handle removal = Victory of Science.
      *   *Nuanced/Historical Reality:* Snow's map was persuasive but not definitive proof (correlation $\neq$ causation). Miasma theory was actually quite robust based on available data (smell, sanitation, correlation with filth). The Board of Health (General Board) was actually *more* aligned with miasma but also interested in sanitary reform for other reasons. The pump handle removal was a local, temporary measure, not an immediate paradigm shift.

  4.  **Analyze the Miasma Theorists (The "Losers"):**
      *   *Whig Classification:* Error, superstition, obstacle.
      *   *Historical Coherence:* Miasma wasn't just "bad air." It was a theory linking environmental filth, decomposition, and disease. It justified sanitation (sewers, cleaning). It was empirically grounded in the observation that dirty places had sick people. It was a *public health* success even if a *etiological* failure (in the germ theory sense).
      *   *Obscuration:* Calling it "error" hides that miasma theory drove the Sanitary Movement which actually saved lives by removing waste, even if the mechanism (airborne poison vs. waterborne bug) was debated.

  5.  **Analyze the 1866 East London Outbreak:**
      *   *Context:* Snow died in 1858. The Great Stink was 1858. Bazalgette's sewers were being built.
      *   *The Event:* Cholera returned in East London.
      *   *The Twist:* The area had *new* sewers (sanitary reform) but still got cholera. Why? Because the sewers dumped waste into the Thames, which was the water source (Old Ford reservoir).
      *   *Whig Interpretation:* "See, miasma failed, water theory won."
      *   *Nuanced Interpretation:* The authorities (William Farr, etc.) finally accepted water transmission *specifically* here, but largely because the statistical evidence was overwhelming (Southwark & Vauxhall vs. Lambeth water supply comparison from 1854 was revisited). However, many still held to miasma regarding *how* the water became toxic.
      *   *Policy vs. Theory:* Policy (sewers) shifted *before* theory (germ/water) was fully accepted. They built sewers to stop *smell* (miasma), which inadvertently helped water safety but also created new vectors (Thames contamination). This suggests policy drives on practical/political imperatives (stop the smell/votes) rather than pure theoretical truth.

  6.  **Synthesize: Institutional Reform vs. Theoretical Change:**
      *   Did correct theory drive policy? No. Sanitary reform (miasma-driven) happened *before* germ theory.
      *   Did policy shift while theory lagged? Yes. They built sewers thinking it stopped miasma; it actually helped stop water contamination (eventually), but the 1866 outbreak showed the limits of infrastructure without theoretical precision.
      *   Rational Convergence? It wasn't a straight line. It was messy. Miasma theory was "usefully wrong."

