answer: |-
  hey, this is exactly the right move because the literature tends to reward solving puzzles over solving problems, and you have actual problems to solve regarding AI attribution and pedagogy. You need a spec that forces the theory to earn its keep on those two jobs rather than just winning a debate about Ryle. The first thing I'd ask is that the account distinguishes reliability from luck, which is non-negotiable because if a system outputs correct translations by statistical coincidence or a student guesses the right move, we shouldn't call that knowing-how, and this is where your gradient descent case lives since you need to know if high accuracy on a test set implies competence or just curve-fitting. The next thing I'd ask is that the account accommodates the inarticulate expert, like the chicken-sexer or the face recognizer, which is also non-negotiable because if knowing-how requires the ability to articulate principles, then most human expertise disappears and your AI case becomes trivial since machines never articulate anything anyway. Moving on, you need the theory to handle the pianist with injured hands, where the know-how persists despite the inability to perform, and this is non-negotiable because otherwise we cannot say she retains the skill during recovery, which matters for how we conceptualize the state of a learner during periods of inability. Then there is the brittle beginner who has all the instructions but fails under deviation, and the account must explain why this counts as less than knowing-how even if they succeed sometimes, which is non-negotiable for your teaching job because it defines the gap between memorizing a manual and acquiring a skill. The next requirement is the decay-and-relearning profile you mentioned, where skills fade with disuse but return faster than new learning, and I am marking this as a strong prejudice rather than non-negotiable because while it feels essential to the phenomenology of skill, a theory might survive without explaining the metabolic or neural why of it, though if it ignores this it will feel disconnected from the actual life of learning. I also want the account to distinguish the aging coach from the unable-to-teach athlete, treating knowing-how-to-perform and knowing-how-to-teach as potentially distinct capacities, which is a prejudice because one could argue teaching is just knowing-that plus communication, but your gut says something practical is lost in reduction so I'd flag this as a tension point. Closely related is the transmission requirement, where the theory must explain how demonstration and correction transfer know-how without necessarily transferring propositions, which is non-negotiable for your second job since if teaching is just telling then your intuition that something is lost is correct and the theory is failing. You also need the account to handle granularity, distinguishing cycling from cycling on ice, which is a prejudice because some theories want to generalize skills too much, and you need to know if fine-tuning counts as new know-how or just application. Then there is the complement requirement, accounting for knowing-how-not-to or knowing-how-to-lose, which is a prejudice but important because if know-how is only about productive success it misses the normative shape of expertise. Now regarding the tensions you suspected, you are right that there is a collision course between the pianist case and the decay profile because the pianist case suggests know-how is a stored state that survives inability, which favors an intellectualist or state-based view, while the decay profile suggests know-how is a disposition or ability that weakens like a muscle, which favors a Rylean view, and satisfying both requires a theory that can be a stable state that nonetheless manifests as a degradable disposition. The single requirement that does the most damage to the most popular views is the inarticulate expert case because contemporary epistemology leans heavily toward intellectualism where knowing-how is a species of knowing-that, and forcing them to accommodate expertise that cannot be articulated breaks the reduction unless they posit unconscious propositions which starts to look like a label rather than an explanation. Finally, a Ryle-style anti-intellectualism fares well on the reliability, transmission, and decay requirements since it treats know-how as dispositions built by training, but it crashes hard on the pianist case since it struggles to attribute know-how without the ability to exercise it, whereas the intellectualist reply handles the pianist and the coach easily by positing stored propositions or distinct theoretical knowledge, but it stumbles over the inarticulate expert and the transmission case since it cannot easily explain how non-propositional demonstration installs propositional knowledge without a regress, so you are left choosing whether you prioritize the ontology of the state or the phenomenology of the practice.
