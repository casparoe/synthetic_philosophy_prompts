answer: |-
  ### Glossary: Levels vs. Units
  Before the requirements, you need the distinction your team is arguing about.
  *   **Levels (Zero Point):** Does Ana's "0" mean the same depth of misery as Ben's "0"? If Ana's 0 is "mild annoyance" and Ben's 0 is "homelessness," your **Levels** are misaligned.
  *   **Units (Step Size):** Is the distance from 4→5 the same "amount of improvement" as 8→9? If a 1-point jump for Ana requires $100 but for Ben requires $10,000, your **Units** are misaligned.

  ---

  ### The Requirements List

  **Req 1: Global Level Anchoring**
  *   **Definition:** The system must establish a shared definition of "bottom" (0) and "top" (10) across all users, regardless of their personal reporting scale.
  *   **Failure Case (The Cluster Trap):** You have two clusters: "Gig Workers" and "Corporate Employees." They never interact, so the Pair Probe never connects them. Gig Workers report 3 as "can't pay rent." Corporate Employees report 3 as "bad wifi." Without anchoring, the system sees two "3s" and funds them equally. The Gig Workers starve; the Employees get a windfall for a minor inconvenience.
  *   **Status:** **Non-Negotiable.** Without this, you are not allocating based on need; you are allocating based on reporting culture.

  **Req 2: Unit Normalization (Marginal Utility)**
  *   **Definition:** The system must account for the fact that moving a score from 2→3 might require a different budget amount than moving 8→9.
  *   **Failure Case (The Adapter Trap):** Ana (Adapter) drops to 2 after a crisis, then recovers to 7 over three months. Ben (Straight-liner) drops to 2 and stays there. If you treat a "point" of improvement as equal cost, you might fund Ana's recovery heavily (easy to move) while abandoning Ben (hard to move). Conversely, if you fund based on *current low score*, you fund Ben but stop funding Ana just as she stabilizes, causing her to relapse. You need to know the "cost per point" for each user.
  *   **Status:** **Non-Negotiable.** Ignoring this wastes budget on easy wins while ignoring deep pits.

  **Req 3: Strategic Robustness (Anti-Gaming)**
  *   **Definition:** The allocation logic must not reward users simply for reporting lower numbers without a corresponding change in their actual state (as verified by probes/swaps).
  *   **Failure Case (The Shading Trap):** User research confirms users know Low Score = More Money. If the system takes self-reports at face value, a user with a genuine 7 will learn to report 4. The budget drains to the best liars, not the neediest.
  *   **Status:** **Non-Negotiable.** This is a security constraint, not just fairness.

  **Req 4: The "Recovery" Exception (Adapter Protection)**
  *   **Definition:** The system must distinguish between "recovered need" ( Adapter healed) and "abandoned need" (Straight-liner ignored). It cannot penalize a user for their resilience.
  *   **Failure Case (The Adapter Penalty):** Ana (Adapter) reports a 2, gets funded, recovers to a 7. The system sees a 7 and cuts her funding. But Ana's 7 is "fragile stability"—she needs maintenance funding to stay at 7. Ben (Straight-liner) stays at 2 and gets funded forever. The system systematically defunds the resilient (Adapters) and creates dependency for the non-resilient (Straight-liners), effectively punishing recovery.
  *   **Status:** **Nice-to-Have.** (See Trade-offs below). This is ethically desirable but technically conflicts with "allocating to the worst off."

  **Req 5: Human-Readable Justification**
  *   **Definition:** Any decision to deny or reduce funding must be explainable in one paragraph of plain text without referencing model weights or hidden variables.
  *   **Failure Case (The Legal Trap):** You deny funding to User X. Their lawyer asks why. Your answer: "The pairwise ordinal embedding placed you in the 60th percentile of need, below the cutoff." User X feels cheated because they don't know what that means. Legal flags this as "arbitrary and capricious."
  *   **Status:** **Non-Negotiable.** (Driven by Legal/Compliance).

  **Req 6: Cluster Bridging**
  *   **Definition:** The system must infer comparisons between User Groups that have no direct Pair Probe path between them.
  *   **Failure Case (The Island Trap):** Cluster A (Artists) and Cluster B (Truckers) have no mutual acquaintances. The Pair Probe graph is disconnected. Without bridging, you have two separate budgets. If Artists are generally happier people (higher baseline), Truckers might get all the money even if the *worst-off* Artist is worse off than the *worst-off* Trucker.
  *   **Status:** **Non-Negotiable.** Required for a single shared budget.

  ---

  ### Trade-offs & Incompatibilities

  **1. The "Adapter" vs. "Worst-Off" Conflict**
  *   **Conflict:** Req 2 (Unit Normalization) vs. Req 4 (Adapter Protection).
  *   **The Trade-off:** If you prioritize the **Worst-Off** (Ben, the Straight-liner at 2), you must funnel money to where the score is lowest. This inherently defunds Ana (the Adapter at 7), even if her 7 is fragile. If you protect Ana (Req 4), you are effectively admitting that "Score 7" can sometimes be more deserving than "Score 2."
  *   **Resolution:** You cannot maximize aid to the absolute lowest scores *and* protect adapters simultaneously. You must choose: do we fund *depth* of misery (Ben) or *risk* of relapse (Ana)?

  **2. The "Precision" vs. "Explanation" Conflict**
  *   **Conflict:** Req 1 & 2 (Calibration) vs. Req 5 (Explanation).
  *   **The Trade-off:** To align Levels and Units accurately across thousands of users, you need complex ML models combining Pair Probes, Swap Interviews, and time-series data. These are black boxes. You cannot explain a neural net's weighting of a "Swap Interview" in one paragraph.
  *   **Resolution:** To satisfy Legal (Req 5), you must simplify the model, which reduces the accuracy of your Level/Unit alignment (Req 1 & 2).

  **3. The "Bridge" vs. "Cost" Conflict**
  *   **Conflict:** Req 6 (Cluster Bridging) vs. Budget Constraints.
  *   **The Trade-off:** The only way to bridge disconnected clusters (Artists vs. Truckers) reliably is the "Swap Interview" (asking a Trucker if they'd trade lives with an Artist). But the prompt states these are "occasional and expensive." You cannot run them at scale.
  *   **Resolution:** You must rely on assumptions (e.g., "Everyone's 0 is the same") which introduces error, or spend a massive % of the budget on interviews.

  ---

  ### The Most Exclusionary Requirement

  **Req 1: Global Level Anchoring.**

  **Why:** This requirement kills any method that relies solely on internal data. You cannot mathematically derive a shared "Zero Point" from self-reports alone (Ana's 0 is unknowable relative to Ben's 0 without external data).
  *   It excludes **Method (a)** (No cross-person comparison) immediately.
  *   It excludes **Method (e)** (Coarse bands) unless the bands are externally defined.
  *   It forces you to use the expensive **Swap Interviews** or the **Pair Probes** aggressively.
  *   Most candidate methods fail here because they assume the input data (0-10) is already comparable. This requirement forces you to admit it isn't and build a translation layer.

  ---

  ### Candidate Method Evaluation

  **(a) No cross-person comparison (Pareto/Rotation)**
  *   **Verdict:** **Fails Req 1 (Global Level Anchoring).**
  *   **Why:** You cannot run a single shared budget if you cannot compare need across users. You end up with fiefdoms.
  *   **Pain Point:** Fails the core mission of "splitting a shared budget based on need."

  **(b) Normalize onto one observable proxy (Money/QALYs)**
  *   **Verdict:** **Fails Req 2 (Unit Normalization).**
  *   **Why:** This ignores the subjective report entirely. It assumes $100 fixes everyone's "4" equally. It misses the "Adapter" nuance (some people heal with less money).
  *   **Pain Point:** User research shows self-reports capture things money proxies miss (dignity, isolation). Discarding them wastes your best data.

  **(c) Rate other people's lives (Veil of Ignorance)**
  *   **Verdict:** **Fails Req 3 (Strategic Robustness).**
  *   **Why:** Users will collude. "I'll rate your life as terrible if you rate mine as terrible." It also creates massive cognitive load.
  *   **Pain Point:** High risk of gaming; hard to scale to "few thousand users."

  **(d) Recover cardinal scale from gambles**
  *   **Verdict:** **Fails Req 5 (Human-Readable Justification).**
  *   **Why:** Explaining "Your utility function derived from risk aversion suggests..." is impossible in one paragraph.
  *   **Pain Point:** Legal will block this. It's too complex for the user to contest.

  **(e) Coarse bands (Fine / Struggling / Trouble)**
  *   **Verdict:** **Passes Most (with caveats).**
  *   **Why:** It simplifies the "Unit" problem (steps don't matter, only the bucket). It makes Explanation (Req 5) easy ("You are in the Fine band, threshold is Struggling").
  *   **Pain Point:** Loses granularity. An Adapter recovering from Trouble to Struggling might need more money than someone static in Struggling, but the band treats them the same.
  *   **Best Fit:** This is the only method that satisfies Legal and Engineering constraints simultaneously, provided you accept the loss of precision.

  ---

  ### Recommendation: Which Requirement to Relax?

  **Relax Req 2: Unit Normalization (Precision of Steps).**

  **Specifics:**
  Stop trying to calculate exactly how much money equals "one point of well-being." Instead, adopt **Method (e) (Coarse Bands)** combined with **Req 1 (Level Anchoring)**.

  **What Breaks When You Do This:**
  1.  **Efficiency:** You will over-fund some people in the "Struggling" band and under-fund others in the same band. You accept that a "high Struggling" and "low Struggling" get the same check.
  2.  **Adapter Nuance:** You lose the ability to fine-tune support for Adapters during their recovery curve. They either get the "Struggling" grant or they don't.
  3.  **The Benefit:** You satisfy **Req 5 (Legal)**. You can tell a user: *"Your reports place you in the 'Fine' band. Funding is reserved for the 'Struggling' band based on verified thresholds."* This is defensible.
  4.  **The Cluster Fix:** You use the expensive **Swap Interviews** *only* to calibrate the boundaries between bands across clusters (e.g., ensure a "Struggling" Trucker is comparable to a "Struggling" Artist), rather than trying to calibrate every individual point.

  **Why this is the right call:**
  You are building a monthly operational system, not a philosophical truth engine. The "Levels" (who is at the bottom) must be accurate to avoid moral hazard. The "Units" (exact marginal utility) are too expensive to measure and too hard to explain. Sacrifice precision for defensibility.
