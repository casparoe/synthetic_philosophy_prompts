      *Let's refine these into the specific "Requirements List" format requested, focusing on the specific failure modes mentioned in the prompt.*

      *   *Req 1: The "Zero-Point" Anchor.* (Levels). We need to know what a "0" means for everyone.
      *   *Req 2: The "Step-Size" Anchor.* (Units). We need to know if moving from 4 to 5 is the same "amount of good" as 8 to 9.
