      *   Keeping (3): Autonomy = Transparency + Revisability. (Fine).
      *   Fix: Clarify that Transparency/Revisability in (3) requires *counterfactual independence* or *awareness of manipulation*, which (5) falsely claims is met by mere endorsement.

      *Cost:* The cost is that we can't just ask people "Are you happy?" to judge autonomy. We need to investigate the *causal history* of their preferences. This is epistemically demanding.

  9.  **Constructing the Output:** (Drafting the response based on these thoughts).
