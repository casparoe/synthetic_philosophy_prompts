answer: |-
  The standard Bayesian account hits a wall with old evidence. If evidence $E$ is already known, its probability is 1. By Bayes' theorem, $P(H|E) = P(H) \times P(E|H) / P(E)$. If $P(E)=1$, then $P(E|H)$ is also 1, making the ratio 1. Consequently, learning a hypothesis $H$ that entails already-known $E$ yields no confirmation boost. This contradicts scientific history, where Einstein's General Relativity was strongly confirmed by Mercury's perihelion shift, despite that data being decades old. Standard fixes, like Howson's counterfactual approach, ask us to pretend we didn't know $E$ to calculate confirmation. But this feels like psychological fiction rather than logical reconstruction. The core tension remains: strict conditionalization cannot account for increased confidence in $H$ based on $E$ when $E$ is fixed in the background knowledge. It assumes logical omniscience regarding the implications of background knowledge.

  Your "diachronic calibration drift" framing cuts this knot by denying that $E$ remains static. Old data isn't a raw proposition; it's a measurement output tied to an error model. When we adopt General Relativity, we aren't just conditioning on Mercury's orbit; we're rejecting the Newtonian error structure that originally produced the data point. The likelihood function $P(E|H)$ isn't timeless; it evolves as our understanding of instrument reliability shifts. Under this view, Bayesian updating isn't merely plugging fixed numbers into a theorem. It's a recalibration of the link between theory and observation. We aren't updating on "Mercury's perihelion" simpliciter, but on "Mercury's perihelion interpreted through relativistic metrology." This allows the evidential weight to change without violating conditionalization rules, because the evidential proposition itself has morphed. The problem dissolves because the evidence was never truly "old" in the relevant sense; only the raw signal was old, while its epistemic packaging was new. The likelihood is actually $P(E|H, M_t)$, where $M_t$ is the time-sensitive model. This recognizes that observation is theory-laden not just at the level of hypothesis, but at the level of instrumentation. It treats the measurement process as part of the hypothesis space.

  However, skeptics will argue this just displaces the mystery into prior choice. If the likelihood function shifts based on calibration drift, what governs that shift? You need a higher-order probability distribution over error models themselves. But now we face the old-evidence problem again at the meta-level: why does adopting a new error model confirm $H$? If the choice of error model is itself influenced by knowing $H$, we risk circularity. We might be accused of tuning the likelihoods to guarantee the desired posterior. This framing demands that agents maintain priors over all possible calibration states, which explodes computational complexity and invites subjectivity. Instead of solving the rigidity of $P(E)=1$, it hides the rigidity in the stability of the error models. If those models are also fixed once known, the drift stops, and the problem returns. Ultimately, this move might just be sophisticated bookkeeping, masking the fact that we're changing the rules of the game mid-play to ensure the theory wins. It swaps a logical paradox for a methodological regress where every model update requires its own justification.

  Verdict: Diachronic calibration drift **dissolves** the problem. The standard formulation assumes evidence is atomic and theory-neutral, which is historically false. Data is always theory-laden, specifically regarding measurement theory. By acknowledging that the evidential relation $P(E|H)$ is time-sensitive, we align Bayesianism with actual scientific practice. Yes, it pushes complexity into model selection, but that's where the work happens anyway. The "bookkeeping" charge misses the point: science isn't just updating on data; it's updating on the reliability of data generation. If Bayesianism can't handle shifting likelihoods, it's too rigid for science. This framing saves Bayesianism by making it dynamic enough to handle theory-laden observation, turning a logical paradox into a feature of model-based inference. It admits that we never observe raw nature, only nature through a lens, and sometimes we change the lens.
