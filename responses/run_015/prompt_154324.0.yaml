      *   **Four-Dimensionalism (Perdurance):** The team is a space-time worm. Different temporal parts have different members.
      *   **Social Ontology (Raimo Tuomela, John Searle, Margaret Gilbert):** Groups exist via *collective intentionality*. It's not about physical arrangement; it's about shared goals, rules, and status functions.
      *   **Unrestricted Mereological Composition (Universalism):** Any plurality of objects composes a further object. (This is what the friend attacks with the cafeteria argument).
      *   **Moderate Restrictivism:** Only some pluralities compose objects, based on causal integration or function.

  6.  **Address the "Infinite Teams" Objection:**
      *   This is a classic argument against *Unrestricted Composition*.
      *   However, social groups are usually defined by *function* and *recognition*, not just spatial proximity.
      *   Therefore, a random cluster in a cafeteria doesn't meet the criteria for "team" (shared intentionality, structure).
      *   So, the objection fails against a functionalist view of social groups, even if it holds against pure spatial universalism.

  7.  **Drafting the Explanation (Iterative Process):**
      *   *Introduction:* Frame the debate as a clash between Mereological Essentialism (Friend) and Functionalist/Constitutive Social Ontology (User).
      *   *The Chair Analogy:* Explain why this is category error. Chairs are physical artifacts defined by structure. Teams are social artifacts defined by *status* and *purpose*.
      *   *Persistence Conditions:* Discuss the Ship of Theseus. The friend argues for strict identity. The user argues for continuity. In social ontology, continuity of *structure* (coach, rules, name) often outweighs continuity of *matter* (students).
      *   *The Cafeteria Objection:* Analyze this as an attack on Unrestricted Composition. Explain that social groups require "collective intentionality" (Searle/Tuomela). Random people don't have shared intent, so they don't form a "team."
