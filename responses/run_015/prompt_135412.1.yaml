answer: |-
  The intractability of the Frege–Geach (F-G) problem is not merely a technical failure of semantic theory; it is a symptom of a deeper clash regarding **explanatory priority** in metaethics. The debate persists because expressivists and descriptivists (cognitivists) are not simply disagreeing about the semantic value of moral terms; they are disagreeing about which feature of moral discourse is fundamental and which must be derived.

  Here is a diagnosis of the stalemate, an assessment of what counts as progress, and an evaluation of the relevance of large language models (LLMs) to this philosophical impasse.

  ### 1. Diagnosis: A Clash of Explanatory Priorities

  The disagreement is substantive, but it is often masked by a shared vocabulary of "content," "validity," and "embedding." It is not merely verbal, because both sides agree on the surface phenomena: moral sentences embed in conditionals, participate in valid inferences, and guide action. The divergence lies in which of these phenomena constrains the theory of meaning.

  **The Descriptivist Priority:**
  Descriptivists take **logical form and compositionality** as the primary constraint. They argue that for an argument like *Modus Ponens* to be valid across asserted and unasserted contexts, the embedded clause must possess the same semantic content in both. Since standard logic operates on truth-apt propositions, moral sentences must express propositions (beliefs) to preserve validity. For the descriptivist, the F-G problem is a *reductio* of expressivism: if expressivism cannot account for embedding without equivocation, it is false.

  **The Expressivist Priority:**
  Expressivists take **motivational internalism and the nature of judgment** as the primary constraint. They argue that the distinctive feature of moral judgment is its action-guiding force (a conative state), not its truth-conditions. For the expressivist, the F-G problem is a challenge to *extend* their theory, not a refutation. They argue that descriptivists buy logical simplicity at the cost of misrepresenting the psychology of moral agency.

  **The Source of Intractability:**
  The debate is stuck because successful solutions on one side tend to look like concessions to the other.
  *   If an expressivist develops a semantics that handles embedding perfectly (e.g., by assigning moral sentences truth-conditions), the descriptivist charges that they have collapsed into descriptivism (the "creeping minimalism" objection).
  *   If a descriptivist accounts for motivation (e.g., by positing a necessary connection between belief and desire), the expressivist charges that they have obscured the distinctively normative nature of moral commitment.

  Consequently, the F-G problem is not just about embedding; it is the battleground for **what kind of explanation metaethics owes us.** Is the goal to fit moral language into a naturalistic ontology of facts (descriptivism), or to preserve the distinctiveness of normative commitment within a naturalistic psychology (expressivism)?

  ### 2. Settled vs. Contested Ground

  To navigate this, we must distinguish what metaethicists generally accept from what remains fiercely disputed.

  **Settled Among Specialists:**
  1.  **Surface Grammar:** Moral language behaves syntactically and logically like descriptive language. It embeds in negations, conditionals, and propositional attitude reports without grammatical friction.
  2.  **Validity Intuitions:** Arguments involving moral premises are intuitively valid or invalid in the same ways as descriptive arguments. A theory that renders standard moral inferences invalid is prima facie inadequate.
  3.  **The Embedding Constraint:** Any viable metaethical theory must provide a semantics for unasserted contexts. It is no longer acceptable to claim moral sentences *only* have meaning when asserted.

  **Genuinely Contested:**
  1.  **Quasi-Realist Success:** It is **not** consensus that quasi-realism (e.g., Blackburn, Gibbard) solves the F-G problem.
      *   *The Critique:* Critics argue quasi-realism constructs a logic of attitudes that *mimics* truth-conditional logic but fails to explain *why* the mimicry is valid. If the quasi-realist earns the right to say moral sentences are "true," have they not abandoned expressivism?
      *   *The Defense:* Proponents argue they have redefined "truth" and "validity" in terms of consistency of attitudes, not correspondence to facts.
      *   *Status:* This remains a stalemate over whether the quasi-realist has solved the problem or merely renamed descriptivism.
  2.  **Hybrid Expressivism:** It is **not** settled that hybrid accounts (moral sentences express both belief and attitude) avoid F-G.
      *   *The Problem:* Hybrid theories often assign the logical work to the belief component and the motivational work to the attitude component.
      *   *The Critique:* If the belief component carries the semantic content required for embedding, the expressivist component becomes semantically idle. This risks the "separation problem": the theory explains logic via descriptivism and motivation via expressivism, failing to unify them.
  3.  **The Nature of Content:** There is no agreement on whether "content" must be truth-conditional. Expressivists argue for a notion of content based on **inferential role** or **commitment**, while descriptivists maintain that without truth conditions, there is no content to embed.

  ### 3. What Would Count as Progress?

  Given that formal expressivist logics already exist (e.g., Gibbard's norm-expressivism), further formal results are unlikely to break the stalemate. The mathematics can be made to work; the philosophical interpretation is the bottleneck.

  **1. Conceptual Distinction (Most Promising):**
  Progress would likely come from a meta-semantic shift that decouples **logical validity** from **truth-conditions** without rendering validity mysterious. If philosophers can agree on a robust notion of "validity" that applies to non-cognitive states (e.g., consistency of plans or norms) that is not merely an isomorphism of propositional logic, the F-G problem dissolves. Currently, descriptivists deny this is possible, and expressivists assert it without fully neutralizing the "equivocation" charge.

  **2. Empirical Findings (Least Promising):**
  Cognitive science regarding how humans process embedded moral claims is unlikely to resolve the normative dispute. Even if empirical data showed that humans process "If stealing is wrong..." using the same neural circuitry as "If it is raining...", this would not settle whether the *semantic content* is propositional or attitudinal. The F-G problem is about justification and meaning, not psychological processing speed or localization.

  **3. Meta-Ethical Ecumenism:**
  A form of progress might be the recognition that the dispute is partly verbal regarding the label "truth." If both sides agree that moral sentences function *as if* they are truth-apt for the purposes of logic, but disagree on the metaphysical grounding of that aptness, the F-G problem loses its teeth as a refutation. However, this requires descriptivists to concede that truth-aptitude does not imply robust moral facts, and expressivists to concede that their "truth" is not merely deflationary.

  ### 4. The LLM Parallel: Illumination or Red Herring?

  Your observation that LLMs process embedded moral claims with "full compositional transparency" is astute, but it functions more as a **mirror of the descriptivist intuition** than a resolution of the philosophical problem.

  **Why it Illuminates:**
  LLMs demonstrate that **distributional semantics** handles the F-G problem trivially. In a vector space, the operation for "If P then Q" applies regardless of whether P is "it is raining" or "stealing is wrong." The model does not need to access the *ontological status* of P to process the embedding.
  *   *Philosophical Implication:* This suggests the F-G problem may be an artifact of a specific philosophical picture of meaning (truth-conditional realism) rather than a feature of language use itself. If meaning is use (or vector proximity), embedding is not problematic. This supports the expressivist/quasi-realist intuition that we do not need robust moral facts to explain logical behavior.

  **Why it is a Red Herring:**
  LLMs lack **attitudes**. The expressivist insists that the meaning of "stealing is wrong" is constituted by a conative state (a stance of opposition). An LLM has no stance; it has weights.
  *   *The Missing Piece:* The F-G problem is not just about how sentences combine; it is about how **commitments** combine. When a human asserts "If stealing is wrong, then...", they are managing a web of normative commitments. When an LLM generates the same string, it is predicting token probabilities.
  *   *Replication of Ambiguity:* The LLM replicates the *symptom* (moral language looks descriptive/compositional) without the *disease* (how to ground that in non-cognitive psychology). Therefore, LLM behavior validates the descriptivist claim that moral language *functions* propositionally, but it cannot adjudicate whether that function requires propositional *content* in the philosophical sense.

  **Conclusion for Governance:**
  In your auditing context, the LLM's "transparency" confirms that these systems are architecturally committed to a descriptivist semantics (tokens as proxies for propositions). They will inevitably fail to capture the **attitudinal coherence** you noted, because they are not agents making commitments. They are simulating the *logic* of moral reasoning without the *normativity*.

  The philosophical stalemate remains intractable because it is a dispute over whether normativity can be naturalized without elimination. The LLM shows us how to simulate the former without the latter, which is technically impressive but philosophically neutral. Progress on the F-G problem requires not better models of embedding, but a clearer account of how non-cognitive states can sustain logical relations without collapsing into cognitive ones. Until then, the debate will remain a contest of explanatory priorities.
