      A reclusive patron offers a struggling musician a life-changing grant tonight, contingent solely on the patron's subjective conviction—formed during a private, intense interview—that the musician *sincerely intends* to smash their own prize violin tomorrow morning. The patron values "radical commitment" and wires the money based on the interview alone, leaving town immediately after; they will never know if the violin is actually smashed. Once the money is secured, smashing the violin yields no further reward and destroys a valuable asset, while keeping it costs nothing. The arrangement is strictly confidential, so no reputation is gained or lost based on the outcome, and the patron does not rely on the destruction for any further purpose.

