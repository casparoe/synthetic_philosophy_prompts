      *Let's write it.*

      *(Final Check on Bratman)*: Bratman's specific response to Toxin is nuanced. He argues that intention involves a commitment to act. If you know you won't act, you can't intend. But he also argues that rational agents have a disposition to follow through. I should characterize the "Bratman-style line" as the claim that rationality applies to extended agency, allowing you to intend now because you treat your future self as bound. I will say the case *challenges* this because the future binding lacks normative force without external sanctions.

      *(Final Check on Weakness)*: The bluffing point is crucial. If I can convince the patron without intending, the puzzle dissolves. I need to make sure the scenario implies the patron is *very* good at reading people, but admit this is the weak spot.

      *Revised Scenario for tightness:* Make sure the "no reputation" clause is clear. "Strictly confidential" covers it.

