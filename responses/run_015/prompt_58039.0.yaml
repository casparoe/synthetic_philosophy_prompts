prompt: |-
  As a journalist covering science and ideas, I am fluent in the working vocabulary of epidemiology and causal inference — counterfactual dependence, sufficient-component causes, attributable fractions, confounding. Restate the debate over overdetermination and multi-causal explanation in history in those terms as faithfully as you can, working throughout with the following invented case to fix ideas: an 1880s trading port whose commerce collapses in a single season when a new inland railway diverts freight, the harbour silts badly, and a foreign tariff is imposed, with contemporaries insisting any one of the three would have been enough. Then provide a residue report identifying what translates cleanly, what can be rendered only with distortion, and what has no counterpart in the epidemiological vocabulary, and assess whether the residue points to a limitation of that vocabulary or to an unclarity in the historical notion of a cause. Please answer in British English.
