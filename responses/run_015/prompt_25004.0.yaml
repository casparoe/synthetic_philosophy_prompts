  I appreciate the closure move, it's the standard exit, but I don't think it dissolves the deep tension—it just relocates it. Even if you deny closure so you don't strictly *know* the evidence is misleading, you still have to explain what knowing p licenses you to *do*. If knowledge is supposed to settle inquiry, then knowing p should allow you to disregard counter-evidence; but if you disregard counter-evidence while admitting your knowledge is fallible, you're being dogmatic. If you say you can't disregard it, then knowledge doesn't settle inquiry any better than high confidence belief. Restricting closure saves you from a logical contradiction, sure, but it leaves you with a functional problem: you've severed the link between knowing and being entitled to stop looking. That's not solving the paradox; that's just admitting knowledge doesn't do what we thought it did.
