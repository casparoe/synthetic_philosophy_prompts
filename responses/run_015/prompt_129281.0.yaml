answer: |-
  # INTENTIONALITY TAXONOMY: A DECISION TREE
  **Reading Group Handout**

  **Instructions:** Do not start by picking a label. Start at **Node 1** and answer the concrete questions about Systems A, B, and C. Follow the arrows to find your philosophical position. Once you land on a leaf, read the "Awkward Commitment" to see if you can stomach the consequences.

  ---

  ## THE DECISION TREE

  ### NODE 1: The Eliminativism Check
  **Question:** Do human beings possess genuine beliefs and desires, or are those terms just placeholders for future neuroscience?
  *   **No (Terms are false):** → **LEAF 1: Eliminativism**
  *   **Yes (Terms are real):** → Go to **Node 2**

  ### NODE 2: System A (The Statistical Translator)
  **Scenario:** System A maps inputs to outputs using pure statistics. It has no internal state tracking the world.
  **Question:** Does System A possess any intentionality (meaning) at all?
  *   **Yes (Original):** → **LEAF 2: Panpsychism / Strong AI**
  *   **No / Yes (Derived only):** → Go to **Node 3**

  ### NODE 3: System B (The Designed Two-Bitser)
  **Scenario:** System B has internal registers tracking external conditions, but only because an engineer designed it to do so.
  **Question:** Does System B *understand* what it tracks, or does it merely behave *as if* it understands?
  *   **Understands (Original Meaning):** → **LEAF 3: Computational Functionalism**
  *   **Behaves As If (Derived Meaning):** → **LEAF 4: The Intentional Stance (Dennett-Style)**
  *   **No Meaning (Just Syntax):** → Go to **Node 4**

  ### NODE 4: System B (The Evolved Two-Bitser)
  **Scenario:** We remove the engineer. System B is placed in a simulated ecology and evolves over a million generations to survive.
  **Question:** Does this evolutionary history grant System B *original* intentionality (meaning intrinsic to itself)?
  *   **Yes:** → **LEAF 5: Evolutionary Naturalism**
  *   **No:** → Go to **Node 5**

  ### NODE 5: System C (The Neural Mesh)
  **Scenario:** A synthetic silicon mesh is implanted in a human brain. It is fully integrated into reasoning and emotion. It causes the person to form a new belief.
  **Question:** Is the belief located *only* in the biological tissue, or is the mesh part of the cognitive system holding the belief?
  *   **Only Biological Tissue:** → **LEAF 6: Biological Naturalism (Searle-Style)**
  *   **Mesh + Brain (Shared System):** → **LEAF 7: Extended Mind / Vehicle Externalism**

  ---

  ## THE LEAVES: POSITIONS & COMMITMENTS

  ### LEAF 1: Eliminativism
  *   **Core View:** Folk psychology (beliefs, desires) is a false theory that will be discarded, not reduced.
  *   **Most Awkward Commitment:** "You do not actually believe anything; you only have neural states that look like beliefs from the outside."

  ### LEAF 2: Panpsychism / Strong AI
  *   **Core View:** Intentionality is fundamental to matter or computation, not limited to biology.
  *   **Most Awkward Commitment:** "A simple lookup table (System A) has an inner perspective or meaning just like a human does."

  ### LEAF 3: Computational Functionalism
  *   **Core View:** Mental states are defined by their functional role, not their physical substrate; syntax can generate semantics.
  *   **Most Awkward Commitment:** "A perfect software simulation of a mind is a mind, even if it runs on a computer made of water and buckets."

  ### LEAF 4: The Intentional Stance (Dennett-Style)
  *   **Core View:** All intentionality is derived; there is no magical "original" meaning, only systems complex enough to be predicted by the belief-desire model.
  *   **Most Awkward Commitment:** "There is no real difference between your consciousness and a thermostat's settings, only a massive difference in complexity."

  ### LEAF 5: Evolutionary Naturalism
  *   **Core View:** Original intentionality arises from design history (natural selection), not necessarily biology or consciousness.
  *   **Most Awkward Commitment:** "A robot designed by evolution has genuine beliefs, but a robot designed by an engineer with the exact same code does not."

  ### LEAF 6: Biological Naturalism (Searle-Style)
  *   **Core View:** Original intentionality is a biological feature caused by brains, similar to digestion or photosynthesis.
  *   **Most Awkward Commitment:** "Brains cause minds like livers cause bile, but we have no idea how, and silicon can never do it even if functionally identical."

  ### LEAF 7: Extended Mind / Vehicle Externalism
  *   **Core View:** Cognitive processes are not bound by the skull; tools integrated into reasoning become part of the mind.
  *   **Most Awkward Commitment:** "If you lose your phone or notebook, you have literally lost part of your mind and memory."

  ---

  ## BLIND SPOTS & OVERLAPS
  *Positions this tree cannot cleanly separate.*

  **1. Behaviorism vs. High-Level Functionalism (Node 3)**
  On the specific question of System B, both positions agree the system behaves *as if* it understands. This tree sorts them based on internal states, but if you refuse to talk about internal states at all, you might land in Behaviorism while aiming for Functionalism.

  **2. Dennett-Style vs. Eliminativism (Node 1 & 4)**
  Both deny "original" intentionality in the magical sense. The split relies on whether you think "derived" intentionality is real enough to count. If you think derived intentionality is also an illusion, you slide from Leaf 4 back to Leaf 1.

  **3. Biological Naturalism vs. Internalism (Node 5)**
  If you answer "Only Biological Tissue" at Node 5, you could be a Biological Naturalist (Searle) or a standard Internalist Functionalists who just happens to think silicon doesn't compute the right way. The tree groups them because their practical output on System C is identical.

  **4. Evolutionary Naturalism vs. Biological Naturalism (Node 4)**
  If you think evolution requires biology to work, Leaf 5 collapses into Leaf 6. This tree assumes you might accept digital evolution as valid design history. If you don't, you must backtrack to Leaf 6.
