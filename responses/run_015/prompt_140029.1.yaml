answer: |-
  This is a rich philosophical trap, and you are right to feel that both characters are half-right and half-wrong. Their analogies are tools that illuminate specific facets of the problem while casting others into shadow.

  Here is an audit of the two analogies, the distinction you are remembering, and how to resolve the tension for your protagonist.

  ### 1. Audit of the Critic's Analogy (The Lie)

  **The Mapping:**
  *   **The Speaker:** The Protagonist (via the canvas).
  *   **The Hearer:** The Buyer, the Museum, the Public.
  *   **The False Proposition:** "This object is the one the Old Master touched."
  *   **The Intent:** To secure payment/prestige by inducing belief in that proposition.
  *   **The Harm:** The Hearer acts on false information (pays money, alters art history).

  **Where It Breaks:**
  *   **Noise:** Paint is not language. A painting doesn't state a proposition explicitly; it implies one through context and labeling. (This doesn't matter much; we accept "visual lying" as a concept).
  *   **Matter (The Victim):** The Critic argues that because the original is gone, no one is *actually* deceived about the visual experience. They get the visual experience they paid for. The "lie" is only about the history.
      *   *Why this matters:* If art is purely about *aesthetic experience* (what you see), the Critic is right. There is no victim because the viewer receives the intended aesthetic payload.
      *   *Why this fails:* It assumes the only value of art is visual. It ignores the value of *witness*.

  **Verdict on the Critic:**
  His conclusion (no wrong) survives only if you define art as purely decorative or experiential. It collapses the moment you admit that art is also a historical record. If I buy a lock of Napoleon's hair, and you sell me a lock of your own hair dyled to match, I have been wronged even if the hair looks identical. The value was the *connection*, not the *keratin*.

  ### 2. Audit of the Dealer's Analogy (The Autograph)

  **The Mapping:**
  *   **The Signer:** The Old Master.
  *   **The Signature:** The Physical Canvas/Paint Layers.
  *   **The Photocopy:** The Protagonist's Reconstruction.
  *   **The Chain of Custody:** Provenance (the unbroken history of ownership from the artist to now).

  **Where It Breaks:**
  *   **Noise:** Signatures are small marks of authentication; paintings are the thing being authenticated. (Minor).
  *   **Matter (The Novel/Song Counter-Example):** You noted this yourself. We accept reprints of books. Why? Because literature is **not** like a signature.
      *   *The Distinction:* In literature and music, the "work" is the pattern (the words, the notes). Any instance that matches the pattern is a valid instance of the work. In painting, the "work" is the *history of production*. There is no "score" for a painting.
      *   *Why this matters:* The Dealer treats the painting *only* as a financial asset defined by scarcity. He cannot explain why we care about the original *artistically* if the copy looks better.
      *   *Why this fails:* A photocopy of a signature cannot be *better* than the signature. It is inherently degraded. But your protagonist's paintings might be *better* than the lost originals (cleaner, more vibrant, corrected for the master's bad days). The Autograph analogy cannot accommodate a "superior forgery."

  **Verdict on the Dealer:**
  His conclusion (provenance is everything) explains the *market price*, but it fails to explain *artistic value*. If provenance were the whole story, a ugly scribble by a famous artist would be better than a beautiful reconstruction by a genius conservator. The market says yes; art history says maybe not.

  ### 3. The Distinction You Remembered

  You are recalling the difference between **Autographic** and **Allographic** arts.

  *   **Allographic (Music, Literature, Dance):** The work is defined by a notation (score, text, choreography). If you produce a perfect instance of the notation, you have produced the work. A reprint of *Hamlet* is as much *Hamlet* as the manuscript. A cover of a song is an instance of the song.
  *   **Autographic (Painting, Sculpture, Architecture):** The work is defined by its history of production. There is no notation. The "work" is not just the image; it is the specific event of the artist making that image. Even a molecule-perfect copy made five minutes later is a *different work* (a forgery or a copy), not an instance of the original.

  **Where this leaves Painting:**
  Painting is Autographic. This means the Dealer is ontologically correct: the physical chain matters. However, the Critic is aesthetically correct: the visual experience matters. Your protagonist is trying to force an Autographic art (painting) to behave like an Allographic one (reconstructing from a "score" of mezzotints and inventories).

  ### 4. Applying the Wrinkles

  **Wrinkle 1: She is replacing something that existed.**
  This moves her away from "Forger" (inventing a new fake) toward "Resurrector."
  *   **Effect on Critic:** Strengthens his view. She isn't lying about the *design*, only the *matter*.
  *   **Effect on Dealer:** Weakens his view slightly. She isn't creating a new fake signature; she is restoring a lost one. But without the physical continuity, the Dealer still calls it a photocopy.
  *   **The Break:** This highlights that she is creating a **Clone**.

  **Wrinkle 2: Her version is the better picture.**
  *   **Effect on Critic:** Vindicates him. If the goal of art is beauty, she has succeeded where the master failed.
  *   **Effect on Dealer:** Irrelevant. A clone of a dead dog can be healthier, but it isn't *your* dog. The value is in the shared history, not the health.
  *   **The Break:** This proves that Aesthetic Value and Historical Value are separate currencies. She is trading one for the other.

  ### 5. A Better Analogy for the Novel

  Both the Lie and the Autograph are transactional analogies (about money and truth). You need an ontological analogy (about being and time).

  **The Analogy of the Clone (or The Séance):**
  Imagine a wealthy man hires a scientist to clone his dead wife. The clone looks exactly like her. The scientist, knowing the original had a genetic flaw, corrects it in the clone. The clone is healthier, more vibrant, and "better" than the wife ever was.
  *   **The Critic says:** "She is better than the original. You have your wife back. What is the problem?"
  *   **The Dealer says:** "She is not your wife. She is a new person wearing her face. The chain of consciousness is broken."

  **What is genuinely wrong (if anything)?**
  It is not fraud (The Critic is wrong to dismiss the harm). It is not merely financial (The Dealer is wrong to reduce it to price).
  The wrong is **Category Error.** She is presenting a *Performance* as a *Relic*.

  If she sold these as "Reconstructions," they would be hailed as miraculous feats of scholarship (Allographic). By selling them as "Originals," she claims they are Relics (Autographic).
  The "wrong" is that she is collapsing the distance between *now* and *then*. She is pretending time didn't happen.

  ### 6. What Should Your Protagonist Believe?

  She should not end up believing the Critic (that it's harmless) or the Dealer (that it's worthless without the lie).

  **The Synthesis:**
  She should realize that she is not a Forger, but she is not a Restorer either. She is a **Medium.**
  *   **Restorers** preserve the existing chain.
  *   **Forgers** fake the chain.
  *   **She** has built a *new* chain that pretends to be an *old* one.

  **The Resolution:**
  The "better picture" wrinkle is the key. If her version is better, it proves the Original was never about perfection; it was about *presence*.
  She should realize that by making it "better," she has inadvertently proven it isn't the original. The flaws in the original were part of its history. By smoothing them out (even unintentionally, through her superior skill), she has created a Platonic Ideal of the painting, not the painting itself.

  **Her Final Position:**
  She should conclude that the "Original" is not the object, but the **moment of creation**. She can recreate the object, but she cannot recreate the moment. Therefore, she is selling a beautiful ghost.
  *   **If she confesses:** The market crashes (Dealer is right about price), but the art gains a new category (Critic is right about beauty).
  *   **If she stays silent:** She remains a god, but a lonely one, knowing she is worshipping an idol she built herself.

  **Recommendation for the Third Act:**
  Don't let the debate be settled by who is "right." Let it be settled by what kind of value the world *wants*.
  The experts hail it as a masterpiece *because* they think it's real. If they knew it was a reconstruction, they would call it a "brilliant pastiche." The *object* doesn't change, only the *label*.
  Her realization should be: **The magic isn't in the paint; it's in the belief.**
  She hasn't solved the problem of loss; she has just drugged the grief.

  This leaves her with a choice: Does she want to be the one who healed the wound (by giving them the beauty they lost), or the one who kept the wound open (by admitting the loss is permanent)? That is the emotional core, rather than the philosophical one.
