      *   *Clarity:* Make sure the distinction between the *model* and the *disease* is clear. The colleagues are conflating the map (algorithm) with the territory (pathophysiology).
      *   *Conclusion:* Summarize the danger of the Death analogy (it justifies inaction) and the benefit of the Weather analogy (it justifies preparation).

