      *   **The Conflict:** Two guests (Tobias, a novelist; Ines, a historian) argue about what this trajectory implies about human nature/agency regarding the Holocaust (Goldhagen vs. Browning debate essentially).
      *   **Task:** Adjudicate the exchange move by move (1-6).
      *   **Requirements:**
          *   Rate each move (Clearly Mistaken to Clearly Right).
          *   Justify each rating (1-2 sentences).
