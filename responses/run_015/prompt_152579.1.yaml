  The summary is a fundamental misrepresentation of Goodman's position, as he explicitly rejects the aesthetic transparency thesis and argues that knowledge of a work's history of production is itself an aesthetically relevant property that justifies distinguishing originals from forgeries. Goodman's autographic/allographic distinction is accurately cited as his framework for distinguishing arts like painting, where the history of production defines the work, from arts like music, where notation defines it; however, the essay summary inverts Goodman's actual conclusion regarding forgery. Goodman does not claim that aesthetic properties are exhausted by immediate perception; rather, he contends in *Languages of Art* that knowing a work is a forgery alters the viewer's cognitive engagement and perceptual scrutiny, thereby changing the work's aesthetic properties even if the object looks identical to the original. Consequently, Goodman explicitly validates the aesthetic justification for museums rejecting forgeries, arguing that authenticity matters because the history of creation is constitutive of the aesthetic experience, not merely because of scarcity or institutional prestige. A defender of original-value would agree with Goodman that historical and causal properties enter aesthetic judgment, rejecting the summary's claim that feeling a difference is mere social signaling; instead, Goodman argues that such feelings are rooted in the cognitive recognition that the work's genesis affects its categorization and thus its perception. The conclusion about museum practice does not follow from Goodman's premises because his premises establish that authenticity is an aesthetic category, whereas the summary falsely attributes to him the view that aesthetics is purely perceptual and history is irrelevant to value.
