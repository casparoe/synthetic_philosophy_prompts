      *   *Are they the same worry?* They are related. The pipeline wrinkle attacks the *sensor* (can it see?). The lineage wrinkle attacks the *target* (what is being selected?). They push in the same direction (lowering probability) but are distinct mechanisms. The pipeline wrinkle is more damaging: if the pipeline is blind to the behavior, lineage doesn't matter.

