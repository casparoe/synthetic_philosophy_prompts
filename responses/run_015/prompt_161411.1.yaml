answer: |-
  Begin your session by asking the group whether the badness of human extinction is exhausted by the sum of individual deaths and the welfare lost by those who never exist. If everyone agrees yes, you have isolated the plain aggregative view, but if anyone says no, proceed to the second question, which asks whether this intuition of extra badness is merely a psychological illusion. A yes answer here lands you on the debunking view, while a no answer confirms there is genuine extra badness to be explained. Your third question must distinguish the source of this value by asking whether the extra badness is grounded in how extinction undermines our current valuing activities or in something valuable being lost regardless of anyone's attitudes. If the group says our current valuing is what matters, you move to the fourth question on this branch, asking whether the fact of cessation matters more than the manner of ending. Those who say the fact matters most arrive at the Scheffler-style valuing-dependence view, whereas those who insist the manner of ending is the whole story, like your specific student, land on the archive-or-audience view, which holds that what is destroyed is the community that could carry and interpret what we have made. This split handles the case of a slow voluntary fade to zero fertility versus sudden extinction, as the archive view sees the fade as less destructive if the work is finished and transmitted, while the Scheffler view sees both as equally undermining if the future is empty. If the group says value is independent of our attitudes, your fifth question for this branch should ask whether it matters if we cause the extinction. If they say yes, because extinction constitutes a breach of trust toward a lineage of projects, they hold the custodial view, but if they say no, because humanity matters as a biological kind whether we cause it or an asteroid does, they hold the impersonal view. This handles the caused versus asteroid case cleanly, as the custodial view only triggers on agency. Regarding combinations your questions allow but nobody defends, the tree permits an objective value view that prioritizes manner over fact, but this is likely incoherent because impersonal value typically tracks existence rather than process, making it unattractive to posit objective value that vanishes on a fade but survives an asteroid. You should also flag that the tree cannot really separate the Scheffler and Archive leaves in cases of sudden extinction with thirty years notice, as both condemn the ending, though they diverge on whether replacement by a successor species that inherits our records counts as continuation, which the Archive view accepts while the Impersonal view might reject depending on whether biological humanity is required. Finally, note that the custodial view overlaps with the archive view on the last generation that knows it is last, but differs on whether the breach of trust occurs if the ending is natural rather than caused, which is a distinction your fifth question isolates.
