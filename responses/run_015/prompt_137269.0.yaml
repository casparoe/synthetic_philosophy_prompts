answer: |-
  **Essay Question (25 marks, 45 minutes)**

  **Scenario:** A Local Authority (LA) manages primary school admissions. Families rank six schools. The application form pre-loads a "suggested" list of six, generated by an algorithm trained on the submissions of families with similar postcodes and histories. Families know that admission probabilities depend on how others rank these schools. The LA proposes to treat these rankings as evidence of what families "really value" (e.g., attainment vs. journey time) to decide which schools to expand.

  **(a) Identification (10 marks):** The standard representation theorem assumes choices are made from fixed, exogenous menus. Here, the menu is endogenous (algorithmic) and choices are strategic. Explain why satisfying the Weak Axiom of Revealed Preference (WARP) in this data does not guarantee the existence of a fixed underlying ordering of schools.

  **(b) Normativity (10 marks):** Suppose the data *did* satisfy WARP. The LA claims this ordering measures what families "really value" for policy purposes. Explain why this inference fails, distinguishing between representing choice and measuring well-being.

  **(c) Pragmatism & Diagnosis (5 marks):** A policymaker objects: "Choices are all we have; if we can't observe 'true' values, we must use this data." Reply to this objection. Then, propose a specific change to the admission process that would generate data capable of diagnosing the problem you identified in (a).

  ***

  **Model Answer**

  (a) WARP requires that if X is chosen over Y when both are available, Y is never chosen over X when both are available. This assumes the menu is independent of the chooser. Here, the menu is generated by past choices of similar agents. If the algorithm suppresses popular schools for some users based on predicted behaviour, a parent might rank School A over B not because A is preferred, but because A is suggested and B is hidden. Furthermore, rankings are strategic: a parent may rank a less preferred school higher to increase admission probability. Thus, observed ranking reflects beliefs about constraints and algorithmic logic, not just a fixed ordering. Consistency here rationalizes a strategy, not a preference relation over schools.

  (b) Even if consistent, the recovered ordering represents successful navigation of constraints, not welfare. Welfare economics requires knowing which outcomes improve well-being. If the ordering reflects adaptive preferences (ranking only what is suggested) or strategic gaming (ranking what is achievable), satisfying it does not maximize well-being. The LA wants to expand schools based on intrinsic value (attainment, pastoral care). The revealed ordering measures constrained desire, not intrinsic value. Using it for policy reifies constraints as values.

  (c) The pragmatist objection fails because contaminated choices are not evidence of value. If choices are driven by hidden constraints, using them as data amplifies error rather than solving ignorance. To diagnose this, the LA should randomly vary the "suggested" lists for identical families. If rankings shift significantly when suggestions change, despite identical constraints and intrinsic values, the data reveals algorithmic influence rather than stable preference. This breaks the identification of a fixed ordering.

  ***

  **Marking Scheme**

  1.  **Endogenous Menu (4 marks):** Identifies that WARP assumes exogenous menus; here menus depend on history/algorithm.
      *   *Error:* Treats the pre-loaded list as a fixed opportunity set.
  2.  **Strategic Context (4 marks):** Notes choices reflect probability of admission/algorithm logic, not just value.
      *   *Error:* Confuses strategic ranking (gaming the system) with true preference.
  3.  **Welfare vs. Choice (4 marks):** Distinguishes representing behaviour from measuring well-being for policy.
      *   *Error:* Assumes consistency implies welfare validity.
  4.  **Policy Reification (4 marks):** Argues policy based on this data treats constraints as values (adaptive preferences).
      *   *Error:* Accepts LA's inference that rankings equal intrinsic value.
  5.  **Empirical Test (5 marks):** Proposes randomizing suggestions to test stability of rankings.
      *   *Error:* Proposes vague surveys instead of structural test.

  **A/B Boundary:** A grades hit all five moves with precise logical linkage regarding endogeneity and strategy; B grades miss the strategic/endogenous distinction or propose generic empirical tests without randomization.
