      *   **Core Claim:** David Lewis's analysis of convention (specifically the common knowledge requirement) leads to a dilemma: either it proves too much (no actual conventions exist because humans can't satisfy infinite common knowledge) or it proves nothing (relaxing the requirement leads to vagueness/sorites, undermining the analysis).
      *   **Structure:**
          *   (1) Lewis's definition of convention requires common knowledge (CK).
          *   (2) Lewis's CK requires an infinite hierarchy.
          *   (3) Humans can't satisfy infinite CK (finite minds).
          *   (4) Therefore, no actual conventions exist (Nihilism).
          *   (5) This is absurd (Conventions exist).
          *   (6) Fix: Relax CK to finite mutual belief (MB).
          *   (7) Problem: Sorites paradox (where is the cutoff?).
          *   (8) Dilemma: Arbitrary cutoff or vagueness.
          *   (9) If vague, Lewis's analysis is false (CK wasn't doing the work).
          *   (10) Conclusion: Lewis's analysis fails.

  2.  **Evaluate the Premises against Lewisian Scholarship:**
      *   *Premise (1):* Accurate representation of Lewis (*Convention*, 1969).
      *   *Premise (2):* Accurate representation of Lewis's formal definition of CK.
      *   *Premise (3):* This is the empirical/psychological claim. Is it true that finite creatures *never* satisfy CK? Lewis anticipated this. He argued CK can be generated by "reflexive common indicators" (e.g., public announcements, salient events) without explicit infinite recursion in the mind.
      *   *Premise (4):* Follows from 1-3.
      *   *Premise (5):* Moorean fact. Hard to deny.
      *   *Premise (6):* A natural reaction, but is it the *only* reaction?
      *   *Premise (7):* The Sorites claim. Does relaxing CK necessarily lead to a Sorites problem that destroys the theory?
      *   *Premise (8):* The dilemma (Arbitrary vs. Vague).
      *   *Premise (9):* The claim that vagueness invalidates the analysis. Many philosophical concepts are vague (heap, bald, tall). Does vagueness mean the analysis is *false*?
      *   *Premise (10):* The conclusion.

  3.  **Identify the Weakest Links:**
      *   **Premise (3):** This is the most common objection to Lewis. Lewis explicitly addresses the "finite mind" objection. He argues that CK is not a psychological state of entertaining infinite propositions, but a state generated by a *basis* (a reflexive common indicator). If $A$ indicates to everyone that everyone knows $A$, CK is established without infinite cognitive processing. So, (3) might be false on Lewis's specific technical definition.
      *   **Premise (9):** This is a strong philosophical claim: "If a concept has no sharp boundaries, the analysis is false." This is contentious. Vagueness is pervasive. Lewis might accept vagueness in the application conditions while maintaining the structural analysis is correct.
      *   **Premise (7)/(8):** The Sorites worry. While valid, many concepts admit of degrees. Does "convention" need a sharp boundary to be useful?

  4.  **Formulate the Response Strategy:**
