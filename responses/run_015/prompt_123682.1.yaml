  *(Self-Correction during drafting Case 1)*: If the flood wall protects an industrial zone with low-wage jobs, does it help the least advantaged? Yes, economic stability is a primary good. However, if it protects *only* the zone and not the homes, does it satisfy the Difference Principle? Rawls allows inequality if it benefits the worst off. Keeping jobs for low-wage workers benefits the worst off. *However*, if the wall increases flood risk elsewhere (displacement of risk), that violates the fairness condition. I will structure the checklist to catch risk displacement.

  *(Self-Correction during drafting Case 3)*: The prompt asks for an answer the officer *won't like*. The procedure, being rigid based on the IVS, will mandate the project because the IVS says the beneficiaries (statistical worst-off) outweigh the garden users (invisible to data). This demonstrates the danger of algorithmic Rawlsianism.

