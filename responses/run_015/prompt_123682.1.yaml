          *   *Rawlsian Verdict:* Tricky. If the "least advantaged" are defined by residence, this fails. If defined by employment, it passes. The prompt implies the IVS is the metric. Need to see if the workers fit the IVS. Let's assume the IVS is residence-based for simplicity, or highlight the tension. *Correction:* The prompt says "low-wage jobs." Rawls cares about primary goods. Employment is a primary good. But the *Difference Principle* usually focuses on the baseline of the worst-off. If the wall saves jobs for the poor, it might pass, but if it diverts water to poor residential areas, it fails. Let's make it a "Pass with Conditions" or "Fail" depending on externalities. Let's aim for a nuanced "Pass" but flag the risk of shifting burden. actually, to make it interesting, let's have it *fail* the future test or the shifting burden test.
