  ### The Diagnostic Tree: Questions and Structure

  Below are the nine branch questions that constitute the decision tree. Every student answers **Node 1** and **Node 2**. Based on those responses, they are routed to one of two paths, answering four additional questions to reach a terminal leaf. This ensures the diagnostic is completed in under fifteen minutes while capturing the required distinctions.

  **The Trunk (Answered by all students)**
  *   **Node 1 (Kidney Vendor):** "A financially secure adult sells a kidney to a stranger for £50,000. Is the *seller* doing something morally wrong?" (Yes / No)
  *   **Node 2 (Kidney Purchaser):** "In the same case, is the *buyer* doing something morally wrong by offering cash?" (Yes / No)

  **Branch A (Market Permissive: Node 1 = No, Node 2 = No)**
  *   **Node 3 (Disaster Pricing):** "During a hurricane, an automated system raises bottled water prices to clear the market. No human intends exploitation. Is this pricing mechanism objectionable?" (Yes / No)
  *   **Node 4 (Vote Selling):** "Citizens sell their votes with verifiable receipts. Is vote selling permissible if the buyer votes exactly as the seller would have?" (Yes / No)
  *   **Node 5 (Spillover):** "Does allowing a market for kidneys reduce the willingness of non-sellers to donate for free?" (Yes / No)
  *   **Node 6 (Law vs Morality):** "If an exchange is morally wrongful but consensual, should the law ban it?" (Yes / No) *[Note: Included for consistency, though 'No' is expected in this branch]*

  **Branch B (Market Restrictive: Node 1 = Yes OR Node 2 = Yes)**
  *   **Node 7 (Desperation):** "If the seller were destitute and had no other option, does their consent make the transaction permissible?" (Yes / No)
  *   **Node 8 (Priority Scheme):** "Blood donors receive priority on transplant lists. No money changes hands. Is this morally equivalent to paying donors?" (Yes = Equivalent / No = Distinct)
  *   **Node 9 (Allocation):** "If markets for organs are banned, is a random lottery preferable to a system rewarding altruism?" (Yes = Lottery / No = Reward)
  *   **Node 6 (Law vs Morality):** "If an exchange is morally wrongful but consensual, should the law ban it?" (Yes / No)

  ---

  ### The Answer Space and Positional Mapping

  With nine binary questions, the theoretical answer space contains $2^9 = 512$ distinct combinations. However, the tree structure restricts valid paths: students answer Nodes 1, 2, and 6, plus either {3, 4, 5} or {7, 8, 9}. This reduces the reachable combinations to $2^6 \times 2 = 128$ valid paths.

  In the context of a graduate seminar on markets, the actual positions cluster heavily in specific regions of this space. We can locate the standard theoretical stances as follows:

  1.  **The Unrestricted Market Position:** Nodes 1 & 2 are 'No'. Node 3 (Disaster) is 'No'. Node 4 (Votes) is often 'Yes' or 'No' depending on civic distinctiveness. Node 5 (Spillover) is 'No'. Node 6 (Law) is 'No'.
  2.  **The Regulated Liberal Position:** Nodes 1 & 2 are 'No'. Node 3 is 'Yes' (objection to outcome, not intent). Node 5 is 'Yes' (acknowledges spillover). Node 6 is 'No' (prefers regulation to ban).
  3.  **The Semi-Commodification Position:** Node 1 is 'Yes' (Cash wrong). Node 8 is 'No' (Priority distinct from cash). Node 9 is 'No' (Reward altruism).
  4.  **The Paternalist Position:** Node 1 is 'Yes'. Node 7 is 'No' (Desperation does not cure). Node 6 is 'Yes' (Law should ban).
  5.  **The Corruption/Repugnance Position:** Nodes 1 & 2 are 'Yes'. Node 5 is 'Yes' (Strong spillover). Node 6 is 'Yes'.
  6.  **The Civic Republican Position:** Node 4 (Votes) is 'No' (Inalienable), even if Nodes 1 & 2 are 'No'.

  ---

  ### Unoccupied and Incoherent Combinations

  Within the 128 reachable paths, several combinations are logically unstable or empirically unoccupied in this literature.

  *   **The Incoherent Combination:** Node 1 = Yes (Seller wrong in unpressured case) AND Node 7 = Yes (Desperation makes it permissible).
      *   *Reasoning:* It is conceptually unstable to hold that a voluntary exchange by a secure agent is morally wrongful, but that the same exchange becomes permissible when the agent is coerced by circumstance. Usually, desperation aggravates the wrong for those who object to the sale; it rarely cures it. This combination suggests a confusion between 'wrongful' and 'harmful'.
  *   **The Unattractive Combination:** Node 8 = Yes (Priority equivalent to cash) AND Node 9 = No (Reward altruism).
      *   *Reasoning:* If one believes priority access is morally equivalent to cash payment, consistency demands one either accept both or reject both. Supporting a reward system (Node 9 = No) while admitting it is equivalent to the banned cash market (Node 8 = Yes) implies a fetishisation of the medium of exchange rather than the incentive structure. It is unattractive because it admits the objection is merely about the 'money form' while maintaining the ban.
  *   **The Unexplored Combination:** Node 1 = No (Seller OK) AND Node 2 = Yes (Buyer Wrong).
      *   *Reasoning:* While theoretically possible (focusing on buyer motive), this is rarely occupied as a stable position. Most students who object to the buyer also object to the seller, or they object to neither. Those who admire giving (buyer as recipient) usually do not frame it as the buyer *doing wrong* to offer cash, but rather the *system* being wrong. This specific asymmetry is seldom defended as a principled stance.

  ---

  ### Indistinguishable Leaves

  There are two leaves that this specific set of questions cannot in principle separate, though they represent distinct theoretical commitments:

  *   **The 'Outcome Utilitarian' vs. The 'Process Libertarian':**
      *   Both end up at: Nodes 1 & 2 = No; Node 3 = No; Node 6 = No.
      *   *Distinction Failure:* One student may support the kidney market because it maximises welfare (Utilitarian), another because it respects property rights (Libertarian). Both answer 'No' to moral wrongness and 'No' to legal bans. The tree sorts by *conclusion* on cases, not by *foundational justification*. Without a node asking "Is the right to sell based on welfare or entitlement?", these two remain in the same leaf.

  ---

  ### Path Traces

  To verify the diagnostic discriminates effectively, consider two contrasting answer patterns.

  **Pattern A: The Regulated Market Liberal**
  *   **Node 1 (Kidney Seller):** No (Not wrong).
  *   **Node 2 (Kidney Buyer):** No (Not wrong).
  *   *Route:* Branch A (Market Permissive).
  *   **Node 3 (Disaster Pricing):** Yes (Objectionable due to outcome).
  *   **Node 4 (Vote Selling):** No (Impermissible, civic good).
  *   **Node 5 (Spillover):** Yes (Markets degrade non-market norms).
  *   **Node 6 (Law vs Morality):** No (Law should not ban consensual acts).
  *   **Result:** This student permits markets but fears their externalities and civic erosion. They support regulation, not prohibition.

  **Pattern B: The Moral Paternalist**
  *   **Node 1 (Kidney Seller):** Yes (Wrong).
  *   **Node 2 (Kidney Buyer):** Yes (Wrong).
  *   *Route:* Branch B (Market Restrictive).
  *   **Node 7 (Desperation):** No (Consent does not cure).
  *   **Node 8 (Priority Scheme):** No (Distinct from cash).
  *   **Node 9 (Allocation):** No (Must reward altruism, lottery insufficient).
  *   **Node 6 (Law vs Morality):** Yes (Law should ban).
  *   **Result:** This student objects to the nature of the exchange itself, rejects desperation as a defence, seeks non-market incentives, and demands legal prohibition.

  These patterns land in different leaves because Pattern A rejects legal bans (Node 6) and accepts the seller's agency (Node 1), while Pattern B demands bans and rejects the agency under commodification.

  ---

  ### The Leaves (Final Positions)

  Based on the clustering of the answer space, the tree sorts students into the following six leaves.

  **Leaf 1: The Unrestricted Market Defender**
  *   **Profile:** Nodes 1 & 2 = No. Node 3 = No. Node 6 = No.
  *   **Stance:** Commodification is neutral. Price mechanisms are efficient even in disasters. The law should not enforce moral objections to consensual exchange.
  *   **Distinction:** Separated from Leaf 2 by their view on spillovers and disaster pricing.

  **Leaf 2: The Consequentialist Regulator**
  *   **Profile:** Nodes 1 & 2 = No. Node 3 = Yes. Node 5 = Yes. Node 6 = No.
  *   **Stance:** Markets are permissible but dangerous. Spillovers and desperate outcomes are real harms that require state mitigation, but not prohibition.
  *   **Distinction:** Separated from Leaf 1 by acknowledging objectionable outcomes (Node 3) and corruption effects (Node 5).

  **Leaf 3: The Civic Separatist**
  *   **Profile:** Nodes 1 & 2 = No. Node 4 = No. Node 6 = No.
  *   **Stance:** Economic markets are fine for kidneys and water, but civic goods (votes) are inalienable. The objection attaches to the *kind of good*, not the money form.
  *   **Distinction:** Separated from Leaf 1 and 2 by the vote-selling node (Node 4).

  **Leaf 4: The In-Kind Commodifier**
  *   **Profile:** Node 1 = Yes. Node 8 = No. Node 9 = No.
  *   **Stance:** Cash for organs is wrongful, but non-cash incentives (priority) are distinct and permissible. The objection is to the *money form*, not the incentive structure.
  *   **Distinction:** Separated from Leaf 5 by Node 8 (they see a moral difference between cash and priority).

  **Leaf 5: The Paternalist Prohibitionist**
  *   **Profile:** Node 1 = Yes. Node 7 = No. Node 6 = Yes.
  *   **Stance:** Selling is wrongful even when unpressured. Desperation does not validate consent. The law must ban the exchange to protect agents from themselves.
  *   **Distinction:** Separated from Leaf 6 by Node 6 (they insist on legal bans, not just moral censure).

  **Leaf 6: The Corruption Theorist**
  *   **Profile:** Node 1 = Yes. Node 5 = Yes. Node 6 = Yes.
  *   **Stance:** Markets corrupt the meaning of the good and degrade non-participants (spillover). The objection binds the law because the harm is social, not just individual.
  *   **Distinction:** Separated from Leaf 5 by Node 5 (their primary objection is spillover/corruption, not just individual welfare/desperation).
