answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Law Reform Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Regulation of Consensual Adult Sexual Services

  **Introduction**

  The Law Reform Advisory Committee has reviewed the proposal to criminalize the purchase and sale of consensual sexual services between adults in private indoor settings. This proposal follows a three-year pilot scheme wherein such activities were permitted under strict licensing, health, and safety requirements. Based on the factual record, police advisories, and public consultation, the Committee recommends that the Council **retain the licensing framework while strengthening zoning, nuisance, and advertising controls.** We advise against enacting a criminal prohibition or moving to full decriminalization at this time.

  This recommendation balances the empirical evidence of public safety with the community's legitimate interest in maintaining a shared moral environment, utilizing civil regulation rather than criminal sanctions to manage social order.

  **Factual Context and Safety**

  The evidentiary record regarding the pilot scheme is clear. Inspection reports indicate high compliance with health and safety standards within licensed premises. Crucially, there were no substantiated instances of coercion or trafficking within the licensed sector. Conversely, outreach workers warn that activity outside the licensed sector remains difficult to monitor. The Police Department has taken a neutral position on the morality of the trade but explicitly warned that criminalization would incur significant enforcement costs and likely displace activity into unmonitored, less safe environments.

  Therefore, from a purely harm-reduction perspective, the licensing model has succeeded where criminal prohibition typically fails. Criminalizing an activity that has proven safe under regulation risks driving it underground, thereby increasing the vulnerability of workers and reducing the city's ability to enforce health standards.

  **Principled Justification: Harm and Moral Environment**

  The Council must weigh two competing principled arguments: the prevention of harm to others and the preservation of a shared moral environment.

  Regarding harm, the liberal tradition generally holds that criminal law should only intervene to prevent harm to third parties. The pilot data suggests that compliant, indoor sex work does not generate direct harm to third parties. However, the police warning regarding displacement indicates that criminalization *would* create new harms: increased danger to workers, diversion of police resources from violent crime, and the growth of an unregulated black market. Thus, the "harm principle" argues against criminalization because the cure would be more harmful than the condition.

  Regarding the moral environment, a substantial majority of consultation respondents expressed concern that tolerating paid sex erodes community character and moral cohesion. This is not a trivial concern. A city is not merely a collection of individuals but a community with shared values. The law plays an "expressive function"; it teaches citizens what the community condemns and what it condones. To regulate sex work is to express that it is a legitimate business; to criminalize it is to express that it is a social evil.

  **The Expressive Function and the Limits of Criminal Law**

  We must carefully consider what message the criminal law should convey here. Proponents of criminalization argue that the law must express moral disapproval to maintain the community's ethical fabric. If the state treats sex work as ordinary commerce, it arguably degrades the social understanding of intimacy and human dignity.

  However, the expressive function of criminal law is a blunt instrument. Criminal sanctions are reserved for the most egregious violations of social trust (e.g., violence, theft). Using the criminal law to enforce a specific conception of sexual morality, particularly where no direct victim exists, risks diminishing the moral authority of the criminal code. Furthermore, the expression of "safety and order" achieved through licensing is also a moral good. By retaining licensing, the Council expresses a commitment to the safety and dignity of residents, including workers, without necessarily endorsing the activity as morally ideal. Civil regulation signals that while the activity may be permissible, it is strictly bounded by community standards regarding location and conduct.

  **Addressing the Strongest Argument for Criminalization**

  The strongest consideration favoring the rejected course of criminalization is the argument for moral cohesion. Proponents argue that even if indoor sex work is safe, its visible tolerance normalizes a transaction that many citizens find inherently dehumanizing. They contend that a community cannot remain neutral on such matters without eventually corroding its own values. There is force to this argument; a legal regime does shape social norms over time.

  However, this Committee must confront the practical reality that criminalization is an ineffective tool for preserving moral cohesion in this specific context. History and the police advisory suggest that criminalizing consensual adult conduct does not eliminate the behavior; it merely hides it. A hidden trade does not cease to offend the moral sensibilities of those who discover it, but it does become more dangerous and less accountable. If the goal is to protect the community's character, a regulated zone that keeps the activity discreet, safe, and away from sensitive areas (schools, residences) is more effective than a prohibition that scatters the activity throughout the city. Criminalization sacrifices the tangible safety of residents for a symbolic moral stance that fails to actually remove the practice from the community. We cannot justify exposing workers to violence and taxpayers to high enforcement costs solely to achieve a symbolic expression of disapproval that yields no practical reduction in the activity itself.

  **Recommendation and Next Steps**

  The Committee recommends **Option 2: Retain licensing while strengthening zoning, nuisance, and advertising controls.** This approach acknowledges the safety successes of the pilot while addressing the community's desire for order and moral boundaries through civil, rather than criminal, means.

  **Concrete Next Steps:**
  1.  **Zoning Amendments:** Draft bylaws establishing buffer zones prohibiting licensed premises within 500 meters of schools, places of worship, and residential zones. This addresses the "moral environment" concern by ensuring the trade is not imposed upon unwilling neighborhoods.
  2.  **Advertising Controls:** Prohibit external signage that explicitly identifies the nature of the business, reducing visual impact on the public sphere.
  3.  **Nuisance Provisions:** Strengthen civil penalty structures for licensed premises that generate noise, loitering, or traffic issues, ensuring operators remain accountable to neighbors.

  **Mechanism for Review**
  To ensure this framework remains responsive, the Committee recommends a **Sunset and Review Clause**. The licensing bylaws shall be subject to a mandatory comprehensive review in two years. This review shall assess:
  *   Complaint data from residents in buffer zones.
  *   Public health outcomes for workers.
  *   Enforcement costs incurred by the Police Department.
  *   Evidence of displacement to unlicensed sectors.

  **Conclusion**

  The Council faces a choice between symbolic prohibition and pragmatic regulation. While the desire to uphold a specific moral vision of the community is understandable, the criminal law is too costly and dangerous a tool for this purpose given the evidence. By retaining licensing with stricter civil controls, the Council can protect public safety, respect individual autonomy, and manage the visual and social impact of the trade without driving it into the shadows. This path best serves the long-term welfare and cohesion of the city.

  **End of Memorandum**
