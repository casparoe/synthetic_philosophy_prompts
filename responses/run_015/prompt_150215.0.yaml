          *   2. *Gaps vs. Gluts:* User needs Belnap's 4 values (None, True, False, Both). Friend might be talking about LP (True, False, Both). User is right that they need both.
          *   3. *Locality:* Paraconsistent logic *allows* locality (Relevance Logic). If she says it spreads, she's talking about classical explosion which she claims to reject.
