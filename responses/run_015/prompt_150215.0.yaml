      *   *Intro:* Acknowledge the strength of the user's intuition. The DB analogy is actually a standard way to explain this (Belnap's Four-Valued Logic is basically what the user described).
      *   *Section 1: The Four Translations.* Use SQL pseudo-code and architecture terms.
