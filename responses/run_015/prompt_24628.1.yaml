answer: |-
  **Project Title:** Formalizing the Presumption of Independence as an Overridable Default in Probabilistic Reasoning

  **Research Question**
  Under what conditions does a complexity-penalized model selection framework recover independence as the rational default hypothesis in the absence of specific correlational evidence, and does this derivation remain invariant under reparameterization of the joint space?

  **Problem Statement**
  The heuristic presumption of independence—treating two pieces of evidence as independent unless there is specific reason to believe otherwise—is ubiquitous in informal reasoning, yet its formal justification remains contested. The standard defense relies on the Principle of Maximum Entropy (MaxEnt). Proponents argue that if one fixes the marginal distributions and maximizes entropy over the joint distribution, the unique solution is the product distribution (independence). This treats independence as the state of "maximum ignorance" consistent with known constraints. However, this justification is vulnerable to two critical objections. First, MaxEnt solutions are not invariant to reparameterization; a uniform prior over one set of parameters does not remain uniform under nonlinear transformation, making the "ignorance" claim coordinate-dependent. Second, and more severely, a measure-theoretic analysis suggests that independence is a lower-dimensional manifold within the space of all possible joint distributions. A genuinely uniform prior over the simplex of joint distributions assigns measure zero to the independence subspace. Thus, "presuming nothing" about the joint structure should logically lead to a presumption of dependence, not independence.

  These positions reach opposite conclusions because they implicitly assume what they aim to prove. The MaxEnt argument assumes the marginals are the only fixed constraints, effectively stipulating that no correlational structure exists to begin with. The measure-theoretic argument assumes a flat geometric prior over the joint space, which privileges dependence simply due to volume. Neither explains why the heuristic works pragmatically nor provides a stable formal backbone for independence as an *overridable* default—a rule that holds until defeated by evidence, rather than a static prior belief.

  **Proposed Methodology**
  This project will shift the framework from static prior selection to dynamic model selection. Rather than asking whether the "true" prior favors independence, I will treat independence as a restricted model (fewer parameters) and dependence as a full model (more parameters). The presumption of independence will be formalized as the outcome of a Bayesian Model Comparison or Minimum Description Length (MDL) procedure where the penalty for model complexity outweighs the fit improvement provided by correlational parameters in the limit of sparse data.

  The analysis will proceed in three stages. First, I will construct a binary variable case study where the joint distribution is parameterized by the marginals and a single dependence parameter (e.g., correlation coefficient or odds ratio). Second, I will apply a complexity penalty (such as the Bayesian Information Criterion or a specific hierarchical prior on the dependence parameter) to determine the sample size threshold at which the independent model is preferred over the dependent model. Third, I will test for parameterization invariance by transforming the dependence parameter and checking whether the preference for the independent model holds under the transformed geometry.

  This approach is superior to purely axiomatic treatments of default logic, which stipulate the rule without grounding it in probabilistic semantics, and superior to accumulating puzzle cases, which demonstrate failures of the heuristic without explaining its successes. By grounding the default in complexity costs, the presumption of independence becomes a rational consequence of efficient learning rather than an arbitrary starting point.

  **Success and Failure Conditions**
  A successful result will derive a specific condition—typically involving the ratio of sample size to parameter complexity—under which the independent model maximizes expected utility or posterior probability. Crucially, success requires demonstrating that this condition is robust to reparameterization of the dependence structure. If the preference for independence disappears under a simple change of variables, the formalization fails to capture the heuristic's stability.

  The project will be considered a failure if the complexity penalty required to recover the independence default is shown to be ad hoc—that is, if the penalty must be tuned specifically to force independence rather than emerging from a general principle of coding efficiency or risk minimization. Additionally, if the analysis shows that the "default" flips to dependence under any reasonable uniform prior over the model space, the heuristic may be formally indefensible, which is itself a determinate and valuable negative result.

  **Scope and Tractability**
  This scope is tractable for a term-length project. By restricting the analysis to binary variables and a single dependence parameter, the mathematical overhead remains manageable while preserving the core conflict between MaxEnt and measure-theoretic priors. The computational work involves standard Bayesian integration and optimization techniques. The primary risk is that the invariance check may reveal deep inconsistencies in the model selection framework itself, potentially expanding the scope into foundational questions about geometric priors. However, even such a result would satisfy the project's goal of determining whether the heuristic has a defensible backbone. The work will conclude with a clear determination: either independence is justified as a complexity-driven default under specific conditions, or it is revealed as a cognitively useful but formally arbitrary bias.
