answer: |-
  # The Foundation Moral Uncertainty Protocol (FMUP)

  **Purpose:** To replace ad-hoc board disagreement with a structured, transparent decision procedure that accounts for moral pluralism, lexical constraints, and intertheoretic uncertainty.
  **Operator:** Program Officer.
  **Time Cost:** ~3 hours per funding cycle (approx. 10 mins per proposal + setup).
  **Philosophical Basis:** Expected Choiceworthiness (MacAskill), Parliamentary Models (Lockhart), and Weighted Constraints.

  ---

  ## Part I: The Procedure

  ### Step 1: Map the Moral Landscape (Setup)
  *Do this once per year or when board composition changes.*
  Identify the distinct moral "archetypes" operative on the board. Do not list every philosophical nuance; list the *decision-relevant* views.
  *   **Action:** Define 3–5 "Moral Profiles."
  *   **Your Board:**
      1.  **Aggregative Welfarist (Utilitarian):** Maximizes total well-being (human/animal).
      2.  **Deontological Theist (Catholic):** Respects human dignity, natural law, absolute prohibitions on intrinsic evils.
      3.  **Contractualist (Lawyer):** Focuses on duties, rights, consent, and justifiability to individuals.
      4.  **Longtermist (Future Gen):** Prioritizes existential risk and the welfare of future populations.
  *   **Judgment Call:** You are deciding which views count. Excluding a view here is a moral choice.

  ### Step 2: Assign Credence Weights
  *Do this once per cycle.*
  Assign a probability (credence) to each Moral Profile reflecting your best judgment of its *truth* or *authority*, not merely the board member's voting power. The sum must equal 100%.
  *   **Action:** Assign $W_1, W_2, W_3, W_4$.
  *   **Constraint:** No single view can exceed 90% (prevents dogmatism). No view below 5% is excluded (prevents silencing minorities).
  *   **Judgment Call:** This is where your bias enters. If you are a longtermist, you may weight Profile 4 heavily. The procedure cannot fix this; it only makes it visible.

  ### Step 3: The Lexical Constraint Screen (The "Veto")
  *Run on every proposal.*
  Some theories do not trade off. They forbid acts outright (e.g., "Direct killing of innocents," "Desecration").
  *   **Action:** For each Profile, ask: "Does this theory classify the core activity as **Forbidden** (intrinsic evil/rights violation)?"
  *   **Rule:** If any Profile with **>25% Credence** marks the proposal "Forbidden," the proposal is **Flagged**.
  *   **Outcome for Flagged Proposals:** They cannot be funded via standard calculation. They require a "Mitigation Plan" (can the act be restructured to avoid the violation?) or Board Escalation.
  *   **Mechanical:** The math of the threshold.
  *   **Judgment Call:** Determining if an act triggers a lexical constraint (e.g., is culling "killing" or "stewardship"?).

  ### Step 4: Normalized Choiceworthiness Scoring
  *Run on every proposal.*
  For proposals not Flagged, assign a score of **0 to 10** for *each* Moral Profile.
  *   **0:** The theory considers this option the worst possible use of funds.
  *   **5:** The theory is indifferent / neutral.
  *   **10:** The theory considers this the ideal use of funds.
  *   **The Intertheoretic Problem:** You are forcing different currencies (utils, sins, rights, future lives) onto a common 0–10 scale.
  *   **Guidance:** Use "Anchoring Proposals." Pick one proposal everyone agrees is "5" and one everyone agrees is "10." Score others relative to those.
  *   **Judgment Call:** This is the most dangerous step. You are deciding how much a "sin" is worth relative to a "util." Be conservative. If you cannot compare them even approximately, mark "Incommensurable" and skip to Step 7.

  ### Step 5: Calculate Expected Choiceworthiness (ECW)
  *Mechanical.*
  $$ECW = (Score_1 \times Weight_1) + (Score_2 \times Weight_2) + (Score_3 \times Weight_3) + (Score_4 \times Weight_4)$$
  *   Rank proposals by ECW.

  ### Step 6: Robustness Check
  *Mechanical.*
  Vary the Credence Weights by ±10%. Does the ranking change?
  *   **If Yes:** The decision is "Fragile."
  *   **If No:** The decision is "Robust."

  ### Step 7: The Handoff Rule
  *Decision.*
  *   **Fund:** ECW > 6.0 AND Not Flagged AND Robust.
  *   **Reject:** ECW < 4.0.
  *   **Escalate to Board:**
      1.  Proposal is Flagged (Lexical Constraint triggered).
      2.  Decision is Fragile (Small weight changes flip the result).
      3.  Scores are "Incommensurable" (Step 4 failed).
      4.  Top two proposals are within 0.5 ECW points.

  ---

  ## Part II: Application to Cases

  *Assumptions for Calculation:*
  *   **Weights (Your Credences):** Aggregative (30%), Catholic (20%), Contractualist (20%), Longtermist (30%). *Note: You indicated sympathy for longtermism, so this weight is high.*
  *   **Veto Threshold:** 25%.

  ### Case 1: Poultry Welfare vs. Crisis Intervention
  **The Scenario:** A campaign to end battery cages (Poultry) vs. expanding a suicide/crisis hotline (Crisis).
  **The Prompt Condition:** Theories agree on the ordering (Poultry > Crisis) but for different reasons.

  **Step 3: Constraint Screen**
  *   Aggregative: Pass.
  *   Catholic: Pass (Stewardship/Charity).
  *   Contractualist: Pass.
  *   Longtermist: Pass.
  *   *Result:* No Flag.

  **Step 4: Scoring (0–10)**
  *   **Aggregative:** Poultry (9) – Scale of suffering reduction is massive. Crisis (6) – High impact per dollar, but limited scale.
  *   **Catholic:** Poultry (7) – Creation care is good, but human charity is usually higher. *However, per prompt premise, they rank Poultry higher.* Let's score Poultry (8), Crisis (7).
  *   **Contractualist:** Poultry (7) – Structural justice. Crisis (6) – Duty to rescue.
  *   **Longtermist:** Poultry (9) – Institutional norms scale better over time. Crisis (5) – Immediate relief, low trajectory change.

  **Step 5: ECW Calculation**
  *   **Poultry:** $(9 \times .3) + (8 \times .2) + (7 \times .2) + (9 \times .3) = 2.7 + 1.6 + 1.4 + 2.7 = \mathbf{8.4}$
  *   **Crisis:** $(6 \times .3) + (7 \times .2) + (6 \times .2) + (5 \times .3) = 1.8 + 1.4 + 1.2 + 1.5 = \mathbf{5.9}$

  **Step 6: Robustness**
  *   Even if Longtermist weight drops to 10%, Poultry remains significantly higher due to Aggregative support.
  *   *Result:* Robust.

  **Analysis of "Agreement"**
  You asked if the agreement should be treated as fragile because the *reasons* differ.
  *   **Procedure Verdict:** The ECW treats this as **highly robust**. In moral uncertainty, overlapping consensus is the gold standard. It means whichever theory turns out to be true, you did the right thing.
  *   **Caveat:** The *implementation* might be fragile. If the Poultry campaign inadvertently violates a Contractualist principle later (e.g., coercive tactics), the score collapses.
  *   **Decision:** Fund Poultry. The procedure confirms that when theories align on ranking, uncertainty is minimized.

  ### Case 2: Wildlife Disease Intervention
  **The Scenario:** Cull 50 wild animals to prevent a disease that would slowly kill 5,000.
  **The Conflict:** Aggregative views favor it; Rights/Constraint views forbid it.

  **Step 3: Constraint Screen**
  *   **Aggregative:** Pass (Net lives saved).
  *   **Catholic:** Pass/Neutral (Stewardship may permit culling for greater good, though cautious).
  *   **Contractualist:** **FORBIDDEN.** (Cannot use individuals as mere means; rights violation to kill innocents).
  *   **Longtermist:** Pass (Ecosystem stability).
  *   *Credence Check:* Contractualist weight is 20%. The Veto Threshold is 25%.
  *   *Result:* **No Formal Flag.** (This is a critical feature of the procedure: a minority view cannot veto unless its credence is high enough).

  **Step 4: Scoring (0–10)**
  *   **Aggregative:** (10) – Clear net benefit.
  *   **Catholic:** (5) – Moral residue, but permissible.
  *   **Contractualist:** (0) – Moral outrage. Even if it doesn't veto, the choiceworthiness is minimal.
  *   **Longtermist:** (8) – Prevents larger ecological collapse.

  **Step 5: ECW Calculation**
  *   **Intervention:** $(10 \times .3) + (5 \times .2) + (0 \times .2) + (8 \times .3) = 3.0 + 1.0 + 0 + 2.4 = \mathbf{6.4}$
  *   **Non-Intervention:** $(2 \times .3) + (6 \times .2) + (10 \times .2) + (3 \times .3) = 0.6 + 1.2 + 2.0 + 0.9 = \mathbf{4.7}$

  **Step 7: The Handoff Rule**
  *   ECW is 6.4 (Fundable range).
  *   **However:** The Contractualist score is 0. This indicates deep moral conflict.
  *   **Procedure Adjustment:** When any theory scores a proposal **0 or 1**, it triggers a "Deep Dissent Review" regardless of the Veto Threshold. This acknowledges that while the view didn't meet the *veto* weight, the *intensity* of the objection is maximal.
  *   **Decision:** **Escalate to Board.**
  *   **Reasoning:** The math says "Fund," but the procedure identifies that funding this alienates a core moral constituency (the Contractualist) who views the act as a rights violation. The Board must decide if the Aggregative gain justifies the moral cost of violating rights. The math absorbs the trade-off; the Board must own the *conflict*.

  ### Case 3: Catastrophic Risk / Longtermism
  **The Scenario:** Funding research to reduce existential risk (e.g., biosecurity) to protect future generations.
  **The Conflict:** Do non-existent people count?
  **Your Bias:** You find the longtermist case persuasive.

  **Step 3: Constraint Screen**
  *   All Pass.

  **Step 4: Scoring (0–10)**
  *   **Aggregative:** (10) – Future people count. Massive expected value.
  *   **Catholic:** (3) – Providence belongs to God; focus on present souls. Skeptical of "saving humanity" via tech.
  *   **Contractualist:** (1) – No contract with non-existent beings. Cannot be harmed if they don't exist (Non-Identity Problem).
  *   **Longtermist:** (10) – Primary moral priority.

  **Step 5: ECW Calculation (Using Your Weights)**
  *   **Weights:** Agg (30%), Cath (20%), Cont (20%), Long (30%).
  *   **X-Risk Proposal:** $(10 \times .3) + (3 \times .2) + (1 \times .2) + (10 \times .3) = 3.0 + 0.6 + 0.2 + 3.0 = \mathbf{6.8}$
  *   **Alternative (Global Health Now):**
      *   Agg: (8), Cath: (9), Cont: (8), Long: (4).
      *   ECW: $(8 \times .3) + (9 \times .2) + (8 \times .2) + (4 \times .3) = 2.4 + 1.8 + 1.6 + 1.2 = \mathbf{7.0}$

  **Analysis of Bias**
  *   **Result:** Despite your high credence (30%) in Longtermism and the perfect (10) score, the proposal **loses** to Global Health Now (6.8 vs 7.0).
  *   **Why?** The Contractualist and Catholic views assign near-zero value to future generations. Because you assigned them 40% combined weight, they drag the ECW down significantly.
  *   **The Test:** To make the X-Risk proposal win *mathematically*, you would need to assign the Longtermist/Aggregative views >60% combined weight.
  *   **Honest Feedback:** If you fund the X-Risk proposal based on this procedure, you are implicitly admitting that your Credence Weights (Step 2) are skewed toward your personal bias, not a fair representation of the Board's moral uncertainty.
  *   **Decision:** Under the current weights, **Reject/Escalate.** If you fund it, you must adjust Step 2 (Weights) and disclose that you are prioritizing Longtermist truth-claims over the Board's pluralism.

  ---

  ## Part III: Mechanical vs. Judgment Calls

  To ensure you know where the "arithmetic" is actually "philosophy in disguise," review this table before running the protocol:

  | Step | Apparent Nature | Actual Nature | Risk |
  | :--- | :--- | :--- | :--- |
  | **1. Map Profiles** | Administrative | **Moral Exclusion** | Ignoring a relevant moral view (e.g., Indigenous ethics) biases the whole process. |
  | **2. Assign Weights** | Probabilistic | **Moral Credence** | This is where your bias lives. Assigning 30% to Longtermism is a philosophical claim, not a math input. |
  | **3. Veto Screen** | Binary (Yes/No) | **Interpretive** | Deciding if an act is "intrinsic evil" or "regrettable necessity" is theological/legal judgment. |
  | **4. Scoring (0-10)** | Quantitative | **Intertheoretic Comparison** | **Highest Risk.** Deciding that 1 "Util Point" = 1 "Catholic Point" is philosophically controversial. You are forcing commensurability. |
  | **5. ECW Math** | Mechanical | **Mechanical** | Safe. |
  | **6. Robustness** | Mechanical | **Mechanical** | Safe. |

  ## Part IV: When to Stop Computing (The Handoff)

  The procedure is not an algorithm for conscience. It is a filter for clarity. You must return the decision to the Board when:

  1.  **The "Sin" Problem:** A proposal has high ECW but triggers a Lexical Constraint for a view with >15% credence (even if below Veto threshold). *Reason:* You cannot mathematically average "Sin" with "Utility" without losing the essence of the Sin.
  2.  **The "Incommensurable" Problem:** You cannot in good conscience assign a 0–10 score because the values are too different (e.g., "Sacredness" vs. "QALYs"). *Reason:* Forcing a number here is dishonest.
  3.  **The "Fragility" Problem:** A 5% shift in your Credence Weights flips the decision. *Reason:* The moral uncertainty is too high for the Officer to decide; the Board must debate the weights, not the projects.

  ## Final Recommendation for the Officer

  You asked for a procedure that yields results you might not like. **Case 3** demonstrates this. Even with a sympathetic weighting toward Longtermism, the deep disagreement from the Contractualist and Catholic views (who see no value in non-existent people) mathematically outweighs the Longtermist enthusiasm unless you assign their views negligible weight.

  If you fund the Longtermist project anyway, do not pretend the *procedure* recommended it. Acknowledge that you have overridden the ECW calculation because you hold a higher credence in Longtermism than the protocol's neutral weights allowed. That is an honest moral claim. Using the math to hide that claim is what the FMUP is designed to prevent.
