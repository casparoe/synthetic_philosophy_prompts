      *The "Dreaded Question":* It needs to be about the *moral weight* of the hedge. Why 50/50? Why not 90/10?

  8.  **Final Polish:** Check word counts and formatting. Ensure the "two-minute reply" constraint is respected (roughly 250-300 words spoken at normal pace).

