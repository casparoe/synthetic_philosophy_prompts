answer: |-
  ### Internal Memo: Pre-Mortem & Q&A Prep
  **To:** In-House Philosopher
  **From:** Consultant (Animal Ethics & Normative Uncertainty)
  **Re:** Next Week's Committee Presentation

  You asked me to think this through carefully before writing the sheet. Here is my read on the room's anxiety.

  The surface-level friction is methodological (brain size vs. neuron count). The deep friction is **moral risk**.

  1.  **The Economists** are nervous about *loss of fungibility*. If suffering is high-dimensional ("bandwidth"), can it still be summed across individuals to get a "total welfare" number? They fear you are breaking the calculus that allows them to compare a malaria net to a cage-free campaign.
  2.  **The Welfare Scientists** are nervous about *hubris*. They work hard to validate behavioral proxies for pain in *one* species. You are proposing a metaphysical leap across *all* species based on anatomy. They fear you are dressing up speculation as math.
  3.  **The Neurologist** is nervous about *bad biology*. Absolute brain size is a blunt instrument. She knows that structure matters more than volume (e.g., avian pallium density). She will worry you are ignoring convergent evolution.
  4.  **The Ethicist** is nervous about *regressive values*. To them, "brain size determines moral weight" sounds dangerously like the very cognitive-capacity arguments used to exclude disabled humans. They fear you are smuggling in "intelligence" as a moral criterion under the guise of "phenomenological complexity."
  5.  **The Director** is nervous about *defensibility*. If a donor asks, "Why did you rank a cow higher than a fish?" will the answer be "Because the cow has a bigger brain"? That headline writes itself.

  Your strategy of **normative hedging** (the geometric mean) is the right move philosophically, but it will look like "fudging the numbers" to the economists and "sitting on the fence" to the Director. You must frame the hedge not as indecision, but as *risk management* under uncertainty.

  Here is your prep sheet.

  ***

  ### Q&A Prep Sheet: Affective Bandwidth Proposal

  #### 1. The Bottom Line (Director)
  **Objection:** "Let's cut to the chase. If we adopt this 'bandwidth' metric and your geometric mean, does the top of our grant ranking change this year? If not, why are we introducing this friction?"
  *   **Damage:** High (If the answer is "no," the project dies. If "yes," reputational risk spikes).
  *   **2-Minute Reply:** "It does shift the margins, specifically between high-neuron/low-volume species (like some birds) and high-volume/high-neuron mammals. But the strategic value isn't just this year's ranking. It's future-proofing. Currently, our model implicitly assumes a goldfish and a goat differ only in *duration* or *probability* of sentience. If we are wrong, and the *structure* of suffering matters, we are systematically undervaluing complex mammals. This hedge protects us against that specific model error without fully committing to a controversial biological claim."
  *   **Weakest Point:** You must admit you haven't run the full historical simulation yet. If pressed on exact percentage shifts, you will look unprepared.

  #### 2. The Comparability Challenge (Development Economists)
  **Objection:** "You're talking about 'dimensionality' and 'structure.' DALYs work because we assume a year of healthy life lost is fungible. If suffering has 'bandwidth,' is it still a scalar? Can we actually multiply this by population numbers, or does the math break?"
  *   **Damage:** High (Threatens the core cost-effectiveness model).
  *   **2-Minute Reply:** "That's a precise concern. I am not proposing we stop treating the final output as a scalar for decision-making. We still need to maximize expected value. The 'bandwidth' is an input parameter for intensity, not a change to the aggregation function. Think of it like adjusting for inflation or purchasing power parity. We are simply refining the 'currency' conversion rate between species. The geometric mean ensures the final number remains a single, comparable utility estimate, just one that incorporates uncertainty about the nature of that utility."
  *   **Weakest Point:** If they press on whether 'high-dimensional suffering' is truly commensurable with 'low-dimensional suffering' (the lexical threshold problem), you have no mathematical fix, only a philosophical assertion.

  #### 3. The Empirical Gap (Welfare Scientists)
  **Objection:** "We struggle to validate pain scales within a single breed of chicken. You want to scale this across taxa based on brain weight? There is no behavioral validation for 'affective bandwidth.' This is premature."
  *   **Damage:** Medium (Undermines credibility, but they expect some theory from you).
  *   **2-Minute Reply:** "I agree that behavioral validation is the gold standard, and where we have it, it should dominate. But we are making funding decisions *now*, in the absence of that data. We currently use a 'crude 0–1 intensity' which is essentially a guess. My proposal replaces an *unexamined* guess with an *explicit* proxy. Absolute brain size is imperfect, but it correlates with the neural real estate available for processing negative states. It is better to be explicitly approximate than implicitly arbitrary."
  *   **Weakest Point:** They are right. There is no direct evidence linking brain mass to "worse" suffering. You are relying on a structuralist intuition, not data.

  #### 4. The Biological Proxy (Veterinary Neurologist)
  **Objection:** "Absolute brain size is a terrible proxy. A cow has a bigger brain than a human, but fewer neurons in the pallium. Birds have high density but small volume. If you care about 'machinery,' why not just use neuron counts? Why the geometric mean with size?"
  *   **Damage:** Medium-High (Attacks the mechanism of your proposal).
  *   **2-Minute Reply:** "Neuron count is indeed the leading alternative, and that's why I'm hedging. However, absolute size captures wiring volume and connectivity potential that raw counts might miss—think of it as bandwidth vs. processing speed. We don't know which biological feature tracks phenomenological depth. Since we are under normative and empirical uncertainty, we shouldn't crown one. The geometric mean forces the model to acknowledge that *both* volume and density are plausible candidates for the 'substrate of suffering.'"
  *   **Weakest Point:** You are conflating "connectivity" with "suffering intensity." A larger hard drive doesn't mean the movie playing on it is sadder.

  #### 5. The Moral Hazard (Ethicist)
  **Objection:** "This smells like cognitive capacity bias. If brain size determines intensity, does a human with microcephaly suffer less than a neurotypical human? Are we building speciesism into the algorithm?"
  *   **Damage:** High (The "Extra Steps" accusation).
  *   **2-Minute Reply:** "That is the most important ethical check, and I share the concern. We must distinguish between *cognitive capability* (solving puzzles) and *affective capacity* (depth of feeling). My claim is about the latter. However, to avoid the 'marginal cases' problem, I am restricting this metric to *inter-species* comparison where we lack individual data. We are not scoring individual humans. Furthermore, by hedging with neuron count, we dilute the risk that we are penalizing species with dense, small brains. This is a risk-minimization strategy, not a claim about moral worth based on intelligence."
  *   **Weakest Point:** The distinction between "affective capacity" and "intelligence" is philosophically porous. If neural complexity grounds one, it likely grounds the other.

  #### 6. The Weighting Question (Economists/Ethicist)
  **Objection:** "Why a geometric mean? Why 50/50 weight between brain size and neuron count? That's arbitrary. Why not 90/10?"
  *   **Damage:** Medium (Makes the hedge look like a coin flip).
  *   **2-Minute Reply:** "In decision theory under deep uncertainty, when we lack priors to distinguish between two plausible models (size vs. count), the Principle of Indifference suggests equal weighting. A geometric mean is also more conservative than an arithmetic mean; it penalizes uncertainty. If either metric is zero, the score is zero. It prevents us from over-valuing a species just because one metric is high while the other is low. It's a 'safety first' approach to moral weight."
  *   **Weakest Point:** The Principle of Indifference is controversial in philosophy. A skeptical economist will call it "making up a number."

  #### 7. The Within-Species Variance (Welfare Scientists)
  **Objection:** "Even if this works across species, what about within them? A piglet vs. a sow. Do we score them differently? If so, do we prioritize saving the larger brains?"
  *   **Damage:** Low (Operational detail, but highlights absurdity).
  *   **2-Minute Reply:** "Practically, we cannot score every individual. We use species-averages for grant evaluation. While a sow has a larger brain than a piglet, the difference is negligible compared to the inter-species gaps we are addressing (e.g., fish vs. mammal). We treat the species as the unit of analysis for scoring, while acknowledging individual variance is absorbed into the error term of our intensity estimate."
  *   **Weakest Point:** If they push on prenatal or juvenile animals in interventions (e.g., culling), the model gets weird quickly.

  #### 8. The "Dreaded Question" (Ethicist/Director)
  **Objection:** "If we publish this methodology, and it turns out brain size *doesn't* correlate with suffering depth, have we just wasted resources prioritizing the wrong animals for five years? What is the cost of being wrong?"
  *   **Damage:** Critical (Existential threat to the proposal).
  *   **2-Minute Reply:** "The cost of being wrong with the *current* model is that we assume all sentient suffering is equal in intensity. If the 'bandwidth' view is true, we are currently under-prioritizing complex mammals. If the 'bandwidth' view is false, and we adopt this hedge, we slightly adjust weights but remain within the bounds of sentience-based ethics. The risk of *omission* (ignoring deeper suffering) is morally weightier than the risk of *commission* (adjusting weights based on a plausible proxy). This hedge minimizes expected regret."
  *   **Weakest Point:** This relies on the assumption that "deeper suffering" is the thing we are missing. If the truth is that simpler brains suffer *more* intensely (panic vs. depression), your hedge moves you in the wrong direction.

  ***

  ### Strategic Concessions
  **What to concede up front:**
  1.  **Biological Imperfection:** Explicitly state: "Absolute brain size is a crude proxy. I am not a neuroanatomist, and this is not a biological claim, it is a decision-theoretic hedge."
  2.  **Uncertainty:** Admit: "We do not know if dimensionality increases moral weight. We only know it *might*, and ignoring that possibility is risky."
  3.  **Human Exceptionalism:** Pre-empt the ethicist. "This framework is for non-human animal prioritization where individual cognitive testing is impossible. It is not intended for human moral status."

  ### The Question You Hope Nobody Asks
  **"If a human had the brain size of a cow but the neuron density of a crow, how would you score their suffering relative to a neurotypical human?"**

  *Why:* It forces you to apply your inter-species metric intra-species, collapsing the distinction between "bandwidth" and "capacity," and immediately triggers the disability ethics landmine you are trying to avoid. If you answer honestly, you alienate the ethicist. If you answer evasively, you lose the economists.

  *Preparation:* If asked, pivot to: "Human moral status relies on rights-based frameworks and social contracts that our fund does not apply to non-human animals. Our metric is strictly for *welfare prioritization* in the absence of rights." (It's a dodge, but a necessary firewall).
