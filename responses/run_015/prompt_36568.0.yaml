      *Wait, one more check on the Buddhist objection:* The prompt says he thinks it's "Schopenhauerian pessimism." I need to make sure the reply addresses *pessimism* vs. *liberation*.
      *Check on Logician:* He looks for necessary/sufficient conditions. The definition of "craving" is the weak point.
