      *   **Task:** Draft a Q&A prep sheet with ~8 objections ordered by damage potential, phrased in the specific voices of the audience members, with 2-minute replies, candid notes on weaknesses, concession strategy, and a "killer question" to avoid/pre-empt.
      *   **Tone:** Professional, strategic, academically rigorous, candid about weaknesses.

  2.  **Deconstruct the Thesis (Tranquilism):**
      *   *Core Claim:* Well-being $\propto$ Absence of Craving/Suffering. Positive states (pleasure, satisfaction) add zero value beyond the removal of craving.
      *   *Argument (a):* Hedonic adaptation (pleasure fades, craving persists).
      *   *Argument (b):* Intuitions (Serene Hermit > High-Strung Striver).
      *   *Argument (c):* Distinction from Negative Utilitarianism (Personal welfare vs. Aggregation).

  3.  **Analyze the Audience & Potential Objections:**
      *   *Adaptive Preferences Scholar:* Will attack the "Serene Hermit" as "sour grapes" (adaptive preference). If the hermit *chose* serenity because he couldn't have success, his welfare isn't actually high.
      *   *Buddhist Scholar:* Will attack the reductionism. Tranquility isn't the *end*, it's a basis for compassion/wisdom. Calling it "Schopenhauerian pessimism" implies it's life-denying.
      *   *Logician:* Will attack the definition. What counts as "craving"? Is the desire to *not* crave a craving? (Self-referential paradox).
      *   *Policy/Measurement Colleague:* Will attack the depression case. If a depressed person has no desires (flatness), are they maximally well-off? (The "Happy Pig/Depressed Rock" problem).
      *   *Mainstream Hedonist:* Will attack the asymmetry. Why does pain count but pleasure doesn't? (The "Magic Button" objection).
      *   *Desire-Satisfaction Theorist:* Will attack the global desire aspect. What about desires for others' welfare or objective goods?
