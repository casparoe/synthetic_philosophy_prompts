  Therefore, criticizing the algorithm for "distorting" reality misses the point. There is no neutral, pre-discursive body to return to. The critique should target the *norms* the algorithm enforces. By defining efficiency through specific metrics, the system compels workers to reshape their physicality to match the data profile. It produces a docile subject by making certain capacities valuable and others wasteful.

  So, yes, it produces a new laboring subject, but not one without physical reality. It produces a *datafied* subject whose worth is contingent on algorithmic legibility. The danger isn't misrepresentation, but normalization. The worker must conform to the metric to survive, limiting human potential to fit algorithmic logic. Your analysis should focus on how this production restricts autonomy, rather than claiming the data is factually wrong about a pre-existing truth. Power produces the truth of the body it governs.
