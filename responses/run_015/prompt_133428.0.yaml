  **JOINT STATEMENT ON POST-FISSION IDENTITY (DRAFT 4.2)**
  **Signatories:** The Pattern Continuity Working Group & The Somatic Sovereignty Coalition

  **PREAMBLE**
  We acknowledge that current language fails to describe the condition of Subject-Alpha following tri-fission. This document establishes a baseline of observable facts while preserving our metaphysical objections. We agree on the mechanics of the situation; we disagree on the moral weight of the result.

  **AGREED CLAIMS**

  1.  **Memory as Replication:** Both camps agree that memory transfer between bodies functions as copying, not transportation. No data is lost from the source during the split, but no unique "spark" travels with it.
  2.  **Inevitable Divergence:** Both camps agree that post-fission, the three bodies will accumulate unique sensory data immediately. Perfect synchronization is physically impossible beyond the moment of activation.
  3.  **The Indexical Problem:** Both camps agree that the word "I" becomes ambiguous when spoken by any of the three bodies. It cannot refer to a unique biological locus without excluding the other two.
  4.  **Social Recognition:** Both camps agree that external society will struggle to assign rights, debts, and relationships to the three bodies equally, regardless of internal identity claims.
  5.  **Pattern Persistence:** Both camps agree that the psychological pattern (personality, habits, skills) persists across all three bodies initially. We disagree on whether this pattern *is* the person or merely a *property* of the person.

  **AREAS OF MATERIAL DISPUTE**

  | Crux | Concrete Thought Experiment | Distributed-Self Wording (Pattern Continuity) | Hard-Boundary Wording (Somatic Sovereignty) |
  | :--- | :--- | :--- | :--- |
