  | **Destruction of Copies** | **The Pruning Protocol:** Authorities order the termination of Alpha 2 and Alpha 3 to restore legal clarity, leaving Alpha 1 alive. | "This is a reduction of resolution, not death. The pattern survives in Alpha 1. You are lobotomizing the collective, not killing a man. The 'him' remains." | "This is double homicide. You are destroying two living, breathing humans because their origin story is inconvenient. Alpha 1 survives, but 2 and 3 are murdered individuals." |
  | **Moral Liability** | **The Crime Scenario:** Alpha 2 commits a theft before the split is public knowledge. Alpha 1 and 3 are innocent. | "Liability attaches to the pattern. All three share the culpability because all three possess the intent and the memory of the intent. Restitution should be shared." | "Liability attaches to the hand that stole. Alpha 2 is the criminal. Punishing Alpha 1 is punishing a twin for his brother's crime. Biological continuity dictates guilt." |
  | **Consent** | **The Medical Choice:** Alpha 1 consents to a risky procedure that could save the pattern but kill the body. Alpha 2 vetoes it. | "The pattern holds veto power over the substrate. If the majority of copies agree the risk is worth taking for the survival of the 'Self,' the procedure proceeds." | "The body holds veto power over the pattern. Alpha 2 has the right to refuse surgery on his own flesh regardless of what Alpha 1 wants for his own flesh." |
