answer: |-
  This is an exceptionally precise framing of a debate that often devolves into shouting matches. You have correctly identified that the surface-level disagreement (facts vs. feelings) is a proxy for something deeper. To offer the diagnosis you requested: this is not primarily a verbal confusion, nor is it likely to be resolved by empirical study. It is a **teleological clash disguised as an epistemological one**, underpinned by divergent intuitions about **epistemic trust**.

  Here is the diagnosis of the impasse, followed by a proposal for what constitutes progress.

  ### I. The Diagnosis: A Teleological Mismatch

  Your hypothesis that this is a dispute about the *purpose* of historical knowledge is correct, but it goes further than that. It is a category error regarding the *ontology of the past*.

  **1. The Teleological Clash**
  The Archivalists and the Mnemonic Sovereigntists are not playing the same game, yet they are fighting over the same board.
  *   **The Archivalists** view history as a **forensic discipline**. Its telos (end goal) is *accuracy*. The past is a fixed object that recedes from us; our duty is to approximate it as closely as possible. In this framework, memory is a degraded form of evidence—prone to decay and distortion.
  *   **The Mnemonic Sovereigntists** view history as a **liturgical practice**. Its telos is *continuity*. The past is a living resource that is brought into the present; our duty is to ensure it sustains the community. In this framework, the archive is a degraded form of evidence—prone to the biases of the powerful and blind to interior experience.

  When the Archivalist says, "That didn't happen," they mean "There is no documentary trace." When the Mnemonicist says, "It happened," they mean "This event constitutes our current reality." They are using the verb "to happen" in different tenses: one in the perfective (completed action), the other in the continuous (ongoing effect).

  **2. The Empirical Red Herring**
  You asked if there is a hidden empirical disagreement about social cohesion. It is unlikely that resolving this would end the debate. Even if a study proved definitively that "adopting archival corrections reduces social cohesion by 15%," the Archivalist would argue that truth is a non-negotiable good that outweighs cohesion (the "Socrates in the marketplace" argument), while the Mnemonicist would argue that cohesion is a prerequisite for justice and survival (the "community integrity" argument). The empirical data cannot adjudicate between the *values* of Truth versus Cohesion.

  **3. The Bedrock Intuition: Epistemic Trust**
  The deepest layer, as you hinted, is intuition about belonging. This is a dispute over **who is the privileged witness**.
  *   For the Archivalist, the privileged witness is the **Bureaucrat** (or the Scribe). The assumption is that distance creates objectivity.
  *   For the Mnemonicist, the privileged witness is the **Survivor** (or the Descendant). The assumption is that proximity creates authority.

  This is why the debate feels intractable. It is not just about methods; it is about *who we trust to tell us who we are*. To ask a community to subordinate their memory to the archive of the state that displaced them is not just an epistemic request; it is a demand for political submission. To ask the state to subordinate its records to oral testimony is, for the Archivalist, a demand to abandon the rule of law and objective reality.

  ### II. What Counts as Progress?

  Since this is a clash of incommensurable goods (Accuracy vs. Continuity; Objectivity vs. Justice), a "verdict" that declares one side the winner is impossible without violence to one of the values. Therefore, progress cannot mean **resolution**; it must mean **management**.

  Here are three specific forms of progress, ranked from least to most viable:

  **1. Conceptual Distinction (Low Viability)**
  Simply agreeing that "History" (inquiry) and "Memory" (practice) are different fields.
  *   *Why it fails:* In public life, these fields collide. Schools, courts, and museums cannot maintain a "History Department" and a "Memory Department." A court ruling on land rights cannot say, "Legally the archive wins, but spiritually the memory wins." The stakes are too high for mere semantic separation.

  **2. Empirical Study (Low Viability)**
  Studying the social outcomes of different approaches.
  *   *Why it fails:* As noted above, values trump data. Furthermore, the "harm" of epistemic injustice is often intergenerational and difficult to quantify in the short term, whereas the "harm" of factual error is immediate and visible.

  **3. Agonistic Institutional Design (High Viability)**
  This is the most promising path. Instead of trying to synthesize the narratives into one "true" story, institutions should be designed to **preserve the friction** between the archive and memory.
  *   **The Museum of the Gap:** Rather than a museum that presents a unified narrative, design exhibits that explicitly display the contradiction. *Panel A* presents the state treaty from the archive. *Panel B* presents the oral testimony of the signing. *Panel C* explains *why* they differ (e.g., "The scribe recorded legal terms; the elders recorded relational promises").
  *   **Progress Definition:** Progress here is moving from "Which one is true?" to "What does the existence of this contradiction tell us about power?" The contradiction *becomes* the historical fact.
  *   **Procedural Justice:** In legal or reparative contexts, progress looks like shifting the *burden of proof*. Instead of the community proving the archive wrong, the institution must account for the *silences* in the archive. This is the "archival silence" methodology used in post-colonial historiography (e.g., Michel-Rolph Trouillot).

  ### III. Conclusion: The Impasse is the Point

  To answer your final question: **An honest admission that the impasse is permanent** is actually the most productive starting point, provided it is framed correctly.

  The tension between the Archive and Memory is not a bug in the system of historical understanding; it is a feature of democratic society. The Archive represents the **State's claim to order**; Memory represents the **People's claim to experience**. If one fully subsumes the other, you get either totalitarian bureaucracy (Archive wins) or nationalist myth-making (Memory wins).

  **The Verdict on the Diagnosis:**
  It is a substantive clash about epistemic norms, but only because those norms are serving different moral masters. The Archivalist serves the **Universal** (standards applicable to all); the Mnemonicist serves the **Particular** (justice for *this* group).

  **The Verdict on Progress:**
  Progress is not a conceptual distinction that dissolves the conflict. It is an **institutional design that prevents either side from achieving total hegemony.** We need structures that force the Archive to confess its biases and force Memory to confront its mutations.

  The goal of the historian, in this light, is not to be the judge who settles the case, but the curator who ensures the trial remains open. If your debate with your friend ended with one of you conceding, you would have lost something. The frustration you feel is the friction of two necessary human needs rubbing against each other. The work is not to stop the friction, but to ensure it generates light rather than heat.
