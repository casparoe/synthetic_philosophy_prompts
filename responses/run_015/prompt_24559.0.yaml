answer: |-
  Your intuitions are sharp. You have correctly identified that the "Safe Pareto Improvement" (SPI) program rests on a stack of assumptions, and the higher up the stack you go, the more fragile the program becomes. The gap between the binary theoretical existence of an SPI and its practical selection is not just a detail; it is the primary bottleneck for the program's real-world relevance.

  Given your deadline (3 months) and background (strong game/decision theory, weak logic/mechanism design), you need a map that distinguishes between **foundational validity** (does the math hold?) and **practical viability** (will anyone use it?).

  Here is a prioritized map of the open questions, ranked by **upstream dependency** (if this fails, everything below it collapses), with specific attention to your tractability constraints.

  ### 1. The Equilibrium Correspondence Assumption (The "Hidden Trust" Worry)
  **Rank:** Priority 1 (Foundational)
  **Status:** The "Kill Switch" for the program.

  *   **Why it is upstream:** The core promise of SPI is that it bypasses equilibrium selection (ES). It claims: "For *any* equilibrium played in the modified game, the outcome is better than *any* equilibrium in the base game." However, proofs of SPI often rely on an implicit **correspondence assumption**: that the agents' equilibrium selection in the modified game will "track" or correspond to their selection in the base game in a specific way (e.g., via structural isomorphism). If the modification changes the focal point or the learning dynamics such that agents coordinate on a "bad" equilibrium in the modified game that has no counterpart in the base game, the safety guarantee evaporates. If you cannot justify this correspondence without assuming the very equilibrium selection logic you claim to bypass, the "Safe" in SPI is false advertising.
  *   **Tractability for you:** **Moderate.** You do not need to solve learning dynamics (which would require your weak areas). You can treat the correspondence as a **constraint set**. Model the uncertainty over the mapping between base-game and SPI-game equilibria. Use your game theory background to ask: "Under what structural conditions on the payoff matrices does the correspondence hold robustly, regardless of the selection function?" This turns a logic problem into a comparative statics problem.
  *   **Credibility Dependence:** **Critical.** If the answer is "The correspondence only holds under strong assumptions about agent reasoning," the program loses its main selling point (robustness).
  *   **Evidence to move it:** A successful dissertation contribution here wouldn't be proving the correspondence holds universally (likely impossible), but rather **bounding the risk**. Show that for a specific class of games (e.g., 2x2 coordination games), the probability of the correspondence breaking is below a certain threshold under reasonable priors over selection functions. If you can show the assumption is "usually" safe, the program survives. If you find a generic counterexample, the program needs a major overhaul.

  ### 2. The SPI Selection and Meta-Coordination Problem
  **Rank:** Priority 2 (Practical Viability)
  **Status:** The "Bottleneck" for adoption.

  *   **Why it is upstream:** This addresses your "Binary vs. Realistic" worry. In theory, finding *one* SPI is enough. In practice, there will be a **set** of possible SPIs (different surrogate objectives, different action restrictions). Principals must agree on *which* SPI to implement. If they cannot coordinate on a specific SPI, do they default to the dangerous base game? If so, the existence of SPIs is irrelevant; the problem has just shifted from "selecting an equilibrium in the game" to "selecting an SPI in the meta-game." This is a bargaining problem over the set of safe contracts.
  *   **Tractability for you:** **High.** This is pure game theory and decision theory. You can model the principals as players in a bargaining game where the feasible set is the set of valid SPIs. You can analyze the conditions under which a unique SPI is focal, or the cost of disagreement. This fits your background perfectly and avoids the logic/mechanism design heaviness of Question 1.
  *   **Credibility Dependence:** **High.** Even if SPIs are mathematically safe (Question 1), if principals cannot agree on which one to use without incurring high transaction costs or risk of fallback to conflict, the program has low utility.
  *   **Evidence to move it:** A formal model of **SPI Bargaining**. Show that under specific informational conditions (e.g., common priors vs. private valuations), the principals can converge on a unique SPI with high probability. If you show that the meta-coordination problem is as hard as the original equilibrium selection problem, the program's value proposition drops significantly.

  ### 3. The Normative Criterion (Pareto vs. Individual Safety)
  **Rank:** Priority 3 (Motivation)
  **Status:** The "Incentive" Layer.

  *   **Why it is downstream:** This question matters only if SPIs are safe (Q1) and selectable (Q2). It asks: Why should a principal commit to a Pareto improvement when they might be able to secure a **Safe Individual Improvement (SII)** that benefits them more, even if it harms the other party? The SPI program assumes principals care about the Pareto frontier. In a competitive world, a principal might prefer a "safe for me" strategy that dominates the SPI for their own utility, even if it's not Pareto optimal.
  *   **Tractability for you:** **High.** This is decision theory. You can model the principal's utility function and risk attitudes. Compare the expected utility of proposing an SPI vs. an SII under uncertainty about the other principal's response.
  *   **Credibility Dependence:** **Medium.** If principals are purely selfish and competitive, they won't propose SPIs. However, the Cooperative AI field generally *assumes* we want to build agents that cooperate. This is more about aligning the field's goals than a mathematical flaw in SPI.
  *   **Evidence to move it:** A decision-theoretic argument showing that in high-stakes multipolar scenarios (e.g., AI arms races), the risk of mutual destruction makes SPIs the dominant strategy even for selfish principals (a "shadow of the future" argument).

  ### 4. Missing Upstream: The Commitment Technology Assumption
  **Rank:** Honorable Mention (Implementation Reality)
  **Status:** The "Physical" Constraint.

  *   **Why it matters:** You mentioned "installing surrogate objectives" or "forgoing actions." This assumes the principal can **verifiably bind** the agent to the modified game. If the agent can secretly defect from the SPI instructions (e.g., optimize the true objective while pretending to optimize the surrogate), the SPI fails. This is not a game-theoretic equilibrium problem; it is a **mechanism design/verification** problem.
  *   **Why it's lower priority for you:** You noted weakness in mechanism design. This question quickly becomes about cryptographic commitment, auditability, and agent architecture. While crucial, it is further from your core theoretical strengths than Q1 and Q2.
  *   **Strategic Note:** Acknowledge this in your proposal as an **exogenous assumption**. State clearly: "We assume principals can verifiably commit agents to the modified strategy space." This bounds your scope and protects you from having to solve implementation security.

  ### Strategic Recommendation for Your Proposal

  You are three months out. You cannot solve Question 1 (Foundational Robustness) definitively, as it risks becoming a quagmire of learning dynamics. However, you cannot ignore it, or your committee will flag the "Hidden Trust" worry immediately.

  **The Winning Angle:**
  Propose a dissertation that **tackles Question 2 (SPI Selection) while explicitly modeling the uncertainty from Question 1.**

  1.  **Frame:** "The Viability of Safe Pareto Improvements under Equilibrium Uncertainty."
  2.  **Method:** Treat the Equilibrium Correspondence (Q1) not as a truth to be proven, but as a **probabilistic constraint**. Assume there is some probability $\rho$ that the correspondence holds.
  3.  **Core Work:** Analyze the SPI Selection problem (Q2) *given* $\rho < 1$. How does uncertainty about the safety guarantee affect the bargaining process? Does it cause principals to reject SPIs even when they exist?
  4.  **Why this works:**
      *   It validates your "Binary vs. Realistic" worry (Q2).
      *   It acknowledges the "Hidden Trust" worry (Q1) without requiring you to solve the hard logic/learning proofs.
      *   It uses your strengths (Game Theory/Decision Theory) to model the bargaining and risk.
      *   It produces a clear "Go/No-Go" condition for SPIs: "SPIs are only viable if the probability of correspondence failure is below $X$ AND the bargaining cost is below $Y$."

  This approach allows you to produce a defensible, high-quality theoretical contribution within your timeline, while positioning yourself as someone who understands the foundational risks of the field without getting bogged down in them.
