answer: |-
  1. **The Grenade and the Function of "Wrong"**
  "In the grenade case, you say jumping is obligatory, so not jumping is wrong, yet blameless. But if blame is off the table, what work is the word 'wrong' actually doing? Is it just a way to signal regret, or does it carry a genuine normative demand?"
  *Likely Reply:* "It signals a genuine demand; blame is just the sanction for missing it, not the definition of the demand itself."
  *Follow-Up:* "If the sanction is removed for everyone in that situation, how is that demand distinct from an ideal we aspire to rather than a duty we owe?"

  2. **Guilt and Resentment**
  "Consider the non-donor who keeps both kidneys. On your view, she acts wrongly. Is it fitting for her to feel guilt, or for the recipient to feel resentment, even if she isn't blameworthy? Or must those emotions be mistaken?"
  *Likely Reply:* "Guilt might be fitting as a recognition of the wrong, but resentment is unfair if she met the expectation constraint."
  *Follow-Up:* "If the victim cannot rightfully resent the wrongdoer, isn't the 'wrong' merely a violation of an impersonal rule rather than a harm to a person?"

  3. **Fairness vs. Agent-Centered Prerogative**
  "You say your fairness constraint isn't just Scheffler's agent-centered prerogative—permission to favor oneself—wearing a different hat. Can you name one concrete case where your view permits an omission that a standard supererogationist view would forbid, or vice versa?"
  *Likely Reply:* "The difference shows up in aggregate expectations over a life, not in single isolated cases."
  *Follow-Up:* "Then how do you guide an individual agent facing a specific choice without relying on the very category you're eliminating?"

  4. **Kant and Imperfect Duties** *(Droppable)*
  "Kant offers imperfect duties, like beneficence, which allow latitude in how and when to act. Why isn't that existing category enough to handle the latitude you want, without calling heroic omissions 'wrong'?"
  *Likely Reply:* "Imperfect duties still imply a requirement to adopt the end; I'm saying the requirement itself is bounded by fairness."
  *Follow-Up:* "If the requirement is bounded by fairness, isn't that just a perfect duty with a built-in excuse condition, which is what supererogationists already claim?"

  5. **The Meaning of Praise** *(Droppable)*
  "If the kidney donor merely did her duty, however demanding, does praise become misplaced? Or do we praise people for doing what was wrong to omit? Doesn't that drain praise of its special significance?"
  *Likely Reply:* "We praise the strength of will required to meet the duty, not the performance of something beyond duty."
  *Follow-Up:* "If we praise meeting basic duties, why do we reserve special honor for heroes rather than just calling them 'compliant'?"

  6. **The Mirror-Image Case**
  "Your view allows for acts that are wrong but blameless. Do you accept the symmetric category: acts that are right but blameworthy? Say, fulfilling a duty but with a malicious motive that we'd still criticize?"
  *Likely Reply:* "Yes, motive can be blameworthy even if the act is right; the categories come apart in both directions."
  *Follow-Up:* "If blame and rightness come apart so easily, why insist on binding them together tightly enough to eliminate supererogation in the first place?"

  7. **Legal Compulsion and Enforcement**
  "If omitting kidney donation is morally wrong on your view, does that wrongness license legal compulsion, like Good Samaritan laws? Or do you have a third layer of fairness constraints for the state too?"
  *Likely Reply:* "No, legal enforcement requires a separate threshold of practicality and social stability beyond moral wrongness."
  *Follow-Up:* "If morality demands what the law cannot enforce, isn't 'wrongness' just a label for ideals we shouldn't actually enforce?"

  8. **Source of Wrongness**
  "You aren't a consequentialist, yet you say we're wrong continuously for not maximizing aid. What makes the omission wrong at all if not the outcome? And if you are a consequentialist, why isn't this just a debate about consequentialism?"
  *Likely Reply:* "It's about the value of lives saved, but moderated by what agents can reasonably sustain."
  *Follow-Up:* "If the value dictates the duty, but psychology dictates the blame, haven't you just split the concept of obligation in half?"

  9. **Historical Drift**
  "Acts like teaching your children or pulling a stranger from shallow water used to be listed as saintly, now they're basic duties. Is that your view winning, or is it evidence the category tracks something real that moves with social capacity?"
  *Likely Reply:* "It shows the expectation constraint is dynamic; as capacity rises, the line of blameless omission shifts."
  *Follow-Up:* "If the line shifts with capacity, isn't supererogation just the name for the current horizon of that shifting line?"

  10. **The Verbal Dispute Trap**
  "It's so generous of you to frame this as merely a verbal dispute, because it lets everyone keep their intuitions without changing behavior. But if the only difference is vocabulary, doesn't that concede your view lacks distinct practical force?"
  *Likely Reply:* "No, it changes how we theorize, which changes long-term practice and policy formation."
  *Follow-Up:* "Then can you name a specific policy change your view entails that the supererogationist view forbids?"

  11. **Changing Mind**
  "Finally, what is the strongest thing a supererogationist can say against you, and what would actually get you to give the view up? Is there a case where 'wrong but blameless' simply fails to capture the moral texture?"
  *Likely Reply:* "If they could show a case where blame is fitting but the act was beyond duty, that would falsify my view."
  *Follow-Up:* "Isn't the hero who dies on the grenade exactly that case: beyond duty, yet we blame those who criticize them?"
