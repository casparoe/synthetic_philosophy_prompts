prompt: |-
  You are a professional philosopher and an experienced medical educator with particular expertise in bioethics and the metaphysical questions at the edge of life and death.

  I am a graduate teaching assistant, and next week I have to lead a single fifty-minute seminar for first-year medical students on the definition of death, with the aim of making sense of the contrast between neurological criteria (brain death) and circulatory criteria for determining that a person has died. I do not want you to explain the concept to me. Instead, plan how I should explain it.

  To keep the session concrete and to stop the students from merely memorizing slogans, I want to build the whole session around one detailed case. The case I have in mind is this. A patient has suffered a catastrophic, irreversible brain injury and is being kept on a ventilator. The family decides to withdraw life-sustaining treatment. In the operating room, the ventilator is withdrawn. After the standard interval of several minutes without a pulse or any effort to breathe, a physician declares the patient dead on the basis of the permanent cessation of circulatory and respiratory function. Immediately after this declaration, a surgical team connects the body to a pump that circulates warm, oxygenated blood into the arteries of the abdomen and legs, so that the kidneys and liver stay healthy and can be transplanted. Crucially, before starting the pump, the surgeon clamps the major artery just above the vessels that supply the brain, so that no blood reaches the head. The pump runs for an hour; during that time the abdomen is warm and the abdominal organs are functioning, while the brain receives no blood flow at all. I will refer to this as the abdominal perfusion case.

  Please tell me whether the abdominal perfusion case should carry the entire session, or whether it needs to be modified or replaced. If it is the right case, specify what it must include and what it must lack to serve as the central example. If a different or adjusted case would be better, say so and explain why.

  Then give me the full teaching plan. Set out the exact order in which the ideas must be introduced and explain the dependency structure: why each step must come before or after the others. Identify the misconceptions first-year medical students will predictably bring with them or form during the session — for instance, the assumption that any flowing blood or a warm, pink body means the patient is not dead, or that brain death is just a deep coma or a persistent vegetative state — and indicate the precise point in the sequence at which I should head off each misconception. Provide one question to ask at the end that would show whether the students have genuinely understood the philosophical problem rather than just learned the two sets of criteria. Finally, say what I should openly refuse to explain at this level and explicitly announce that I am leaving it out.

  Before you write, think carefully and brainstorm the relevant conceptual dependencies privately; do not include this brainstorming in your response. Begin your response with a single sentence that states the bottom line of your pedagogical plan, meaning the one decision about framing or sequencing on which the success of the whole session depends, and then give the rest of the plan and the reasoning. Use no preamble, do not restate any part of this request, and include no preface or commentary before that first sentence.
