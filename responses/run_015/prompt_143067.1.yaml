          2.  Case Presentation (10 mins).
          3.  Small Group Discussion/Conflict Identification (15 mins).
          4.  Plenary & Misconception Correction (10 mins).
          5.  Assessment & Closing (5 mins).
      *   *Dependencies:* Must define "death" (concept) before "criteria" (measurement). Must present case before analyzing contradictions. Must address misconceptions during analysis.
