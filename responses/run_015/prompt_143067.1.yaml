  2.  **Evaluate the Case ("Abdominal Perfusion Case"):**
      *   *Description:* Patient with catastrophic brain injury -> Withdrawal of life-sustaining treatment (WLST) in OR -> Circulatory cessation (DCD protocol) -> Declaration of death -> Abdominal perfusion (normothermic regional perfusion, NRP) with clamping of brain vessels -> Organs harvested.
      *   *Strengths:* It directly pits circulatory criteria (used for declaration) against biological integration (abdomen is perfused/functioning) and neurological criteria (brain is excluded/dead). It highlights the "dead donor rule" tension. It forces students to confront *why* we declare death where we do.
      *   *Weaknesses:* It's complex. First-year students might get bogged down in the procedural details of NRP (Normothermic Regional Perfusion) rather than the conceptual issue. It risks conflating *determination* of death with *procurement* protocols.
      *   *Verdict:* It is an excellent case *if* simplified. It captures the core metaphysical tension: Is death the loss of *whole* brain function, or the loss of circulatory/respiratory function, and what happens when technology decouples them? The clamping of the brain vessels is crucial—it ensures the brain is not being perfused, maintaining the neurological standard while violating the intuitive "whole body" standard.
      *   *Modification:* Needs to be presented clearly as a *Donation after Circulatory Death (DCD)* scenario with *Normothermic Regional Perfusion (NRP)*. The key detail is the *timing* of the death declaration relative to the perfusion. The case must emphasize that death is declared *before* the pump starts, based on circulatory criteria, yet biological life (metabolism, perfusion) is restored to part of the body *after* death.
      *   *Decision:* Keep the case, but ensure the "clamping" detail is highlighted as the ethical/metaphysical firewall.

  3.  **Determine the Pedagogical Bottom Line:**
      *   What is the single most important decision? It's the sequencing of the *concept* of death versus the *criteria* for death. Students often confuse the two. The session must establish that criteria are operational proxies for a underlying concept (what death *is*), and the case shows where the proxies diverge.
      *   *Draft Bottom Line:* The success of the session depends on establishing the conceptual distinction between the ontological definition of death and the clinical criteria used to determine it before introducing the case, so that the paradox of the perfused abdomen challenges their understanding of the definition rather than just the procedure.
      *   *Refinement:* Needs to be one sentence. "The success of the session depends on sequencing the distinction between the ontological concept of death and the clinical criteria for determining it before introducing the case, ensuring students see the paradox as a metaphysical conflict rather than a procedural error."

  4.  **Drafting the Teaching Plan:**
