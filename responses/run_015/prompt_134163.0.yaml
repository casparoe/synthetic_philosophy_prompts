  I'm working on a novel and there's this character, a kind of fringe moral philospher, who thinks we've got the whole consciousness-or-bust thing backwards. She argues for what she calls "gradient sentience"—moral status isn't a switch but a dimmer that goes all the way down. A human is near full brightness, an insect is a faint glow, and even a basic thermostat has a technically nonzero value, maybe 0.0001%, because if you accept that any predictive feedback loop counts as the tiniest bit of representational integration, then there's no clean line where it hits absolute zero. She wants to use this to complicate pesticide ethics: if you kill thousands of insects, you're not just wiping out entities with "no status," you're accumulating a lot of very small gradient weights, and in some scenarios that cumulative harm might actually outweigh a single high-gradient choice. Can you write out her argument in full? I want it committed—actually defend gradient sentience, defend the thermostat claim, and show why this makes insecticide decisions messier, not easier. Don't survey every objection and then sit on the fence; take the position and run with it. And please don't load it up with citatons or a bibliography—this is for a fictional philosophical system, but I need it rigorous and not hand-wavy, with the reasoning spelled out clearly.
