      *   **The Core Problem:** Reference class problem. Different valid groupings yield vastly different risk estimates for borderline patients (e.g., 3-4% vs. 8-9% vs. 2%).
      *   **Proposed Solutions:**
          *   Developer: Use the most specific grouping with $N \ge 200$.
          *   Ethics Consult: Report the full range across defensible groupings + structured shared decision-making (SDM) for grouping-sensitive patients.
      *   **The Conflict:** Arbitrary administrative choice vs. delaying benefit for clear beneficiaries.
      *   **Requirements:**
          *   Length: 800 - 1200 words.
          *   Format: Decision Memo.
          *   Content: Recommend a specific course (Authorize, Decline, or Authorize with Conditions), provide reasoning, address strongest counter-argument.
          *   Tone: Definite position, defensible, actionable for voting.

  2.  **Determine the Recommendation:**
      *   *Option A (Unrestricted Use):* Too risky. Ignores the ethical concern about arbitrary classification affecting treatment thresholds.
      *   *Option B (Decline):* Too conservative. Delays benefit for patients who are high risk across *all* models.
      *   *Option C (Authorize with Conditions):* Best balance. Adopts the Ethics Consult's approach (transparency + SDM) but makes it enforceable. This addresses the "arbitrary choice" concern without blocking access for clear cases.
      *   *Decision:* Authorize subject to concrete conditions (transparency of range, SDM requirement for discordant cases, monitoring).

  3.  **Outline the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Recommendation:** Clear statement of the vote needed.
      *   **Background:** Briefly state the tool's purpose and the reference class problem.
      *   **Analysis/Reasoning:**
          *   Why unrestricted use is problematic (arbitrariness, consent).
          *   Why rejection is problematic (withholding benefit).
          *   Why the conditional approach works (epistemic humility, patient autonomy).
      *   **Specific Conditions:** What exactly needs to happen (UI changes, workflow, monitoring).
      *   **Counter-Argument & Rebuttal:** Address the "efficiency/delay" argument.
      *   **Conclusion:** Final call to action.

  4.  **Drafting - Section by Section (incorporating word count constraints):**

