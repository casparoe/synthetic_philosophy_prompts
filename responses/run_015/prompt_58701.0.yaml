      *   *Background:* Keep it tight. Focus on the 62-year-old example to illustrate the variance.
      *   *Rationale:* Focus on the ethical weight of the "reference class problem." It's not just statistical noise; it's a definitional choice that dictates treatment. The developer's rule ($N \ge 200$) is administratively convenient but ethically thin. The Ethics proposal (range + SDM) respects autonomy.
      *   *Conditions:* Need to be enforceable.
          1.  Display range, not single number, for "grouping-sensitive" patients (define this).
          2.  Mandatory SDM documentation for these patients.
