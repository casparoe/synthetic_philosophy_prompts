      *   If you strictly hold C2, you *allow* for wronging in climate cases (since the condition is met). **However**, the philosophical machinery usually accompanying C2 (the "No Worse Off" principle) is what generates the NIP dissolution you explicitly reject in C4.
      *   More dangerously, C2 as phrased ("wrongs... *only if*... necessary condition") implies you *cannot* wrong an existing person by an action that is not necessary for their existence (e.g., punching a passerby). This renders C2 an implausible general theory of wronging.
      *   If C2 is intended only for *creation* contexts, it clashes with C4's claim that we wrong the "modal cohort." C4 implies a wronging relation that survives identity contingency. C2 implies a wronging relation that is tightly bound to existence dependence. The justification for C1 (no subject to deprive) undermines the justification for C4 (subject exists but is contingent).
  *   **Least Costly Revision:** **Modify C2.** Abandon the strict "necessary condition for existence" constraint as a *definition* of wronging. Replace it with a **"Subject-Requirement"**: *An agent wrongs a being only if there is a subject who is harmed.* This preserves C1 (non-creation has no subject) but allows C4 (climate victims are subjects, regardless of identity contingency).
  *   **Sacrifice:** You lose the specific "Causal-Role" explanation for the asymmetry. You must find a different ground for C1 (e.g., the logical impossibility of duties to non-existent entities).

  #### 2. The Asymmetry vs. Selection Reason Tension (C1 vs. C6)
  *   **Severity:** **Moderate (Theoretical Instability)**
  *   **The Conflict:** C1 denies any *pro tanto* reason to create a person with excellent welfare. C6 asserts a reason to select a person with *very high* welfare over one with *moderate* welfare.
      *   The tension lies in the source of the value. If "high welfare" generates a reason to select B over A in C6, why does "high welfare" generate *no* reason to create B over No-Child in C1?
      *   Critics will argue this is ad hoc: you are accepting the value of welfare in selection contexts (C6) but denying it in creation contexts (C1).
  *   **Least Costly Revision:** **Clarify the Meta-Ethics of C6.** Adopt a **"Conditional Reasons"** framework. The reason to select B is conditional on the decision to create. "Given that a child will exist, there is a reason to ensure it is B." This does not imply a reason to create *a* child.
  *   **Sacrifice:** You sacrifice the simplicity of an agent-neutral axiology. You must commit to a view where reasons are agent-relative or conditional on the existence of the beneficiary.

  #### 3. The Climate Obligation vs. Asymmetry (C3 vs. C1)
  *   **Severity:** **Low (Dissolves on Inspection)**
  *   **The Conflict:** C3 asserts strong obligations regarding future people (climate). C1 asserts weak/no obligations regarding future people (procreation).
      *   This looks like a tension: Why care about future climate victims but not future happy children?
      *   **Dissolution:** This dissolves if you distinguish between **harm avoidance** and **benefit conferral**. C3 is about preventing severe harm to those who *will* exist. C1 is about the duty to confer benefits on those who *might* exist. Your package is consistent here provided you maintain that "harming" (C3) and "creating" (C1) are morally distinct categories.
  *   **Least Costly Revision:** None required, provided the Harm/Benefit distinction is rigorously maintained.
  *   **Sacrifice:** None.

