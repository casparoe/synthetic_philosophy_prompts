      The decisive case must be **High Valence, Zero Capture**.
      If she calls that "Bad," Valence wins. If she calls that "Not Bad," Attention wins.
      Given her history (Case iii), Valence is the core.

      *Wait, one nuance on Case (vi):* "Refusal... treated as a question about consent, not as evidence about welfare." This confirms she is *not* a Desire Theorist. She believes welfare is objective relative to the experience, not the desire.
