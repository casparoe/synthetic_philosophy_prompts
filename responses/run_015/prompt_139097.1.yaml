      *   *If she says Not Bad:* Attention is the driver.
      *   *My bet:* She says Bad. Because of the "Relief" principle. If it's unpleasant, stopping it brings relief.

  10. **Final Polish:** Ensure the distinction between "welfare badness" and "functional impairment" is clear. The colleague seems to be a **Hedonic Quality of Consciousness Theorist** (Valence), where attentional capture is a contingent symptom of high negative valence, not the badness itself.

      *(Self-Correction during drafting)*: Wait, look closely at Ardley-Okono again. "Performance... falls to exactly the level of controls in equal-intensity pain." This means the pain *does* disrupt performance. It *does* capture attention (break off mid-sentence). But they feel no unpleasantness.
