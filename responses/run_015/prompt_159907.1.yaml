      *   *Standard:* Compliance is determined by adherence to pre-authorized safety protocols. Violations warrant sanctions regardless of observed outcomes. Observed harms despite adherence warrant remediation and process review, not sanctions.
      *   *Opposing Considerations:* Outcomes are the only unbiased evidence of safety. Process compliance can become ritualistic. By insulating teams from outcome-based judgment, we risk enforcing elaborate rituals that correlate with nothing while real harm occurs.
