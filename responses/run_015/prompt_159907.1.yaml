      *   *Kestrel:* They skipped staged rollout and logging. This is critical. We don't know if harm happened. Sanction: Formal non-compliance finding. Remediation deadline: 30 days. Hold on next deployment until cleared.
      *   *Heron:* They did everything right. Harm happened. This is residual risk. Sanction: None. Requirement: Full incident report and cooperation with learning review.
      *   *Standard:* "Process-Primary with Outcome-Triggered Remediation." Compliance is judged on adherence to pre-authorized protocols. Outcomes determine remediation scope, not compliance status, unless process was breached.
      *   *Losing Side:* The argument is that safety is consequentialist. If people get hurt, the process failed, regardless of paperwork. Ignoring outcomes in compliance judgments decouples accountability from reality.
      *   *Proposal:* The outcome-blinded compliance review prevents moral luck bias. The learning review captures outcome data. Recommendation: Adopt Modified. Modification: The learning review must produce actionable updates to the safety protocol within 60 days of an incident.

