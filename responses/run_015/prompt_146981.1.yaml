      *   **Resilience of the Trap:** Structural vs. Specific.
      *   **Limitations:** Climate, lag time, genuine uncertainty.

  7.  *(Self-Correction during drafting)*: Make sure to emphasize that the "Race" wasn't just catching fish, it was catching *political attention*. The province raced Ottawa to keep subsidies. The industry raced science to keep quotas high. This is a *multi-layered* multipolar trap.

