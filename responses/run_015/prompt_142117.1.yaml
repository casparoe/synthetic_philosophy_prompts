prompt: |-
  I am a novelist, four books in, and for the first time I am writing one set entirely in the past: a close-third-person novel about one family in San Francisco through the second wave of the 1918 influenza pandemic — the mask ordinance, the league that formed to repeal it, the arguments about whether compulsory gauze did anything, a laundress who keeps a door-to-door tally of the sick households on her block, and a short present-day frame narrated by a great-granddaughter who has spent ten years digitising the family's papers. My editor loves the draft and keeps praising it for putting the characters "on the right side of history," and the more she says it the more I suspect that is precisely the failure. My partner is an epidemiologist and will say things like "they'd have saved thousands of lives if they'd just listened," which I now hear as the vice in miniature. The trouble is that what I have is a temper, not a test: I can feel when a scene is congratulating us for how far we have come, or when I have handed a character a motive they could only have had in our vocabulary, or when I have excused them by saying they "couldn't have known" — which I've started to suspect is itself a condescending way of refusing to take their actual reasons seriously — but I can't reliably catch it in my own prose, and my fact-checking historian won't catch it either, because she checks whether the streetcar line existed and not whether my plot treats a side as having lost because it was benighted rather than because it was outvoted, outbid, or unlucky.

  So please take this seriously and carefully, and work as if you were both a philosopher or historically-minded theorist who knows what is actually at stake in the complaint about whig history and a developmental editor who has to be useful by Friday. Start by brainstorming — ten minutes, in your head — the distinct ways whiggishness can get into a work of fiction specifically, and only then condense that into something I can run: a numbered decision procedure I can apply to a single scene in ten to fifteen minutes during a revision pass, with no theory vocabulary in the steps themselves. For each step, tell me what question to ask, what counts as a pass, what counts as a fail, what counts as "rewrite this line," where the procedure stops with a verdict, and where it has to stop and hand the question to me because it is a question about what my book is for. I need it to keep separate the things I keep conflating — narrating as if a later outcome were the point of earlier action, judging past people by present standards, and the mirror-image vice of romanticising the period as a lost golden age — and I need an actual test for anachronistic *concepts*, not just anachronistic objects, since my characters keep wanting to say things like "the science" and "prejudice" in words that flatten what they meant. Assume I have no training in any of this, that I will run it on about forty scenes, and that the output has to survive being read by my editor.

  Then show me it working. Run it on three scenes from the draft, in detail: (1) the meeting where the anti-mask characters are given the strongest version of their case — that the gauze is useless, that the ordinance is enforced against the poor and waved through for the rich, that compulsion in a republic in wartime is itself the harm — where I cannot tell whether writing them well is honest or is apologetics; (2) the deathbed scene in which an opponent recants and concedes that the doctors were right, which is the scene my editor singles out and which I would be genuinely unhappy to lose, so if your procedure condemns it I want to be told so plainly; and (3) the frame chapters, where the great-granddaughter calls her ancestor "a forerunner of modern epidemiology" on the strength of that household tally, and I can't work out whether that is a legitimate claim about influence or just retroactive ennoblement of a dead end. Finally, be straight with me about where the procedure misfires: what kinds of scenes it will score wrongly, what it cannot tell me at all, and which of its verdicts I should treat as a prompt to think rather than an instruction to cut.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (4 books in), writing historical fiction (1918 SF flu pandemic + present-day frame).
      *   **Problem:** Editor praises "right side of history," but the author suspects this is "Whig history" (teleological, presentist judgment). Partner (epidemiologist) reinforces the "they should have known better" mindset. Author feels the draft is a "temper, not a test."
      *   **Goal:** A practical, numbered decision procedure (checklist) to identify and fix Whiggishness in specific scenes. Needs to distinguish between:
          *   Narrating as if later outcomes were the point.
          *   Judging past people by present standards.
          *   Romanticizing the past (mirror vice).
          *   Anachronistic *concepts* (not just objects).
      *   **Constraints:**
          *   Start with brainstorming (internal) on how Whiggishness enters fiction.
          *   Condense into a numbered decision procedure (10-15 mins/scene).
          *   No theory vocabulary in the steps themselves.
          *   Must specify: Question, Pass, Fail, Rewrite, Stop/Hand to Author.
          *   Apply the procedure to three specific scenes (Anti-mask meeting, Deathbed recantation, Present-day frame).
          *   End with limitations/misfires of the procedure.
      *   **Tone:** Serious, careful, philosophically grounded but practically useful (developmental editor persona).

  2.  **Internal Brainstorming (Whiggishness in Fiction):**
      *   *What is Whig History?* Interpreting the past as an inevitable march toward present enlightenment. The past is only valuable insofar as it contributes to the present.
      *   *How does it enter fiction?*
          1.  **Teleological Plotting:** Events happen *because* they lead to us, not because of contemporary causes.
          2.  **Moral Scoring:** Characters are "good" if they agree with us, "bad" if they don't.
          3.  **Conceptual Anachronism:** Using modern categories (e.g., "systemic racism," "public health," "conspiracy theory") that didn't exist or meant something different then.
          4.  **Irony as Judgment:** The narrator winks at the reader, "Can you believe they thought that?"
          5.  **The "If Only" Trap:** Tragedy is framed as preventable by modern knowledge, rather than tragic due to contemporary constraints.
          6.  **The "Forerunner" Fallacy:** Praising historical figures only because they look like modern professionals (e.g., the laundress as an "epidemiologist").
          7.  **Flattening Motives:** Reducing complex historical motivations to simple ignorance or malice.
          8.  **The Victory Lap:** The ending implies *we* won, rather than *they* survived.
      *   *Distinction needed:* Avoiding Whiggishness $\neq$ Relativism. It doesn't mean saying masks didn't work. It means portraying *why* people thought they didn't, without treating that thought as a moral failing.
      *   *The "Mirror Vice":* Romanticizing the past (Golden Age) is also Whiggish in reverse (assuming the past was purer/better). The goal is *alterity* (otherness), not superiority or inferiority.

  3.  **Drafting the Decision Procedure:**
      *   *Constraint:* No theory vocabulary (no "teleology," "epistemic," "Whig," "presentist").
      *   *Structure:* Numbered steps, clear criteria (Pass/Fail/Rewrite/Stop).
      *   *Focus:* Concept anachronism, motive flattening, narrative irony.
      *   *Drafting Steps:*
          1.  Check vocabulary/concepts.
          2.  Check character motives (do they make sense *then*?).
          3.  Check narrator distance (is the narrator winking?).
          4.  Check outcome weight (does the ending judge the beginning?).
          5.  Check the "Forerunner" trap (present day frame).
      *   *Refining for the User:* Make it actionable. "Find the word," "Ask why," "Check the verdict."

  4.  **Applying the Procedure to the Three Scenes:**
      *   *Scene 1 (Anti-Mask Meeting):*
          *   Risk: Caricature vs. Honest Argument.
          *   Test: Do their arguments hold water *in 1918*? (Gauze *was* often loose/useless. Enforcement *was* class-biased).
          *   Verdict: Likely Pass if arguments are technical/political, Fail if they sound like modern libertarians.
      *   *Scene 2 (Deathbed Recantation):*
          *   Risk: The "I was wrong, Science was right" trope.
          *   Test: Does the character recant because of *evidence they saw* or because the *author needs them to*?
          *   Verdict: High risk of Fail. Needs nuance. Maybe they recant because of community pressure, not "science."
      *   *Scene 3 (Present-Day Frame):*
          *   Risk: "Forerunner of epidemiology."
          *   Test: Is the tally *actually* epidemiology, or is it survival?
          *   Verdict: Fail/Rewrite. It imposes a professional identity on a survival tactic.

  5.  **Addressing Limitations/Misfires:**
      *   The procedure can't judge *theme*.
      *   It might flag necessary moral clarity (e.g., slavery) as Whiggish (need to distinguish moral truth from historical inevitability).
      *   It can't fix *voice*.
      *   It relies on the author's honesty.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too dry?
      *   *Fix:* Ensure the "Stop/Hand to Author" steps acknowledge the artistic intent.
      *   *Critique:* Did I avoid theory words in the steps?
      *   *Fix:* Check for "teleology," "anachronism," "epistemic." Replace with "future knowledge," "words/concepts," "knowing."
      *   *Critique:* Is the tone right?
      *   *Fix:* Needs to be respectful of the author's intelligence but firm on the craft. Acknowledge the partner's influence without dismissing the science.

  7.  **Final Polish:**
      *   Ensure the brainstorming section is distinct but brief (as requested: "ten minutes, in your head" -> summarize the *result* of that thinking).
      *   Make sure the scene analysis is specific to the 1918 context provided (SF, mask ordinance, laundress).
      *   Ensure the "Limitations" section is honest about where the tool breaks.

  *(Self-Correction on the "Brainstorming" instruction)*: The prompt says "Start by brainstorming — ten minutes, in your head... and only then condense that." I should explicitly show the *output* of that brainstorming as a preamble to establish credibility, but keep it tight so the focus remains on the tool. Actually, reading closely: "Start by brainstorming... in your head... and only then condense." I will provide a brief summary of that conceptual work to show I've done it, then move to the tool.

  *(Self-Correction on "No Theory Vocabulary")*: I must ensure the *steps* don't use words like "Whig," "Teleological," "Anachronism." The *commentary* around it can use them, but the checklist itself must be plain English.

  *(Self-Correction on Scene 2)*: The author says they would be "genuinely unhappy to lose" the deathbed recantation. I need to be careful not to just say "Cut it." I need to show how the procedure identifies the *risk* and offers a modification that saves the emotional beat without the historical sin.

  *(Self-Correction on Scene 3)*: The "Forerunner" issue is key. The laundress isn't an epidemiologist. She's a neighbor. The distinction matters.

  Let's build the response.

  *Structure:*
  1.  **Conceptual Grounding:** Briefly summarize the "brainstorming" on how Whiggishness infects fiction (The 5 Vectors).
  2.  **The Tool:** The 10-15 Minute Scene Audit (Numbered, Plain English).
  3.  **The Test Run:** Applying the tool to the 3 specific scenes.
  4.  **The Limitations:** Where the tool fails.

  *Key nuance:* The partner (epidemiologist) is right about the *science* (masks help), but the novelist is right about the *history* (people didn't know that yet). The friction is between *truth* and *knowledge*. The tool must separate "what is true" from "what they could know."

  *Step 1 refinement:* Focus on vocabulary.
  *Step 2 refinement:* Focus on motive (internal logic vs. external judgment).
  *Step 3 refinement:* Focus on narrator voice (irony).
  *Step 4 refinement:* Focus on the ending (inevitability).
  *Step 5 refinement:* Focus on the present-day frame (lineage vs. resemblance).

  Okay, ready to write.
answer: |-
  ### Part 1: The Vectors of Whiggishness in Fiction

  Before giving you the tool, here is the summary of the "ten minutes in my head." Whiggishness in fiction is not just about getting the dates wrong. It is a structural bias in how meaning is assigned. Based on your description, I identified five specific vectors where it enters the prose:

  1.  **The Vocabulary of Retrospect:** Characters use nouns that summarize a debate only after it is settled (e.g., "the science," "the pandemic," "conspiracy theory"). In 1918, these were open wounds, not categories.
  2.  **The Moralization of Ignorance:** Characters who are wrong are written as *bad* (selfish, stupid, prejudiced) rather than *misinformed* (operating on bad data, conflicting authority, or different priorities).
  3.  **The Irony of the Narrator:** The narrative voice winks at the reader, signaling, "We know better than this." This creates a coalition between the narrator and the reader *against* the characters.
  4.  **The Inevitability of Outcome:** Plot points feel like stepping stones to *our* present rather than chaotic events that could have gone otherwise. The "right side" wins because the author needs them to, not because of historical friction.
  5.  **The Forerunner Fallacy:** Praising historical figures only when they resemble modern professionals. A laundress counting sick neighbors is a community caretaker; calling her an "epidemiologist" makes her valuable only because she looks like a scientist.

  The goal of the following procedure is not to stop you from having a moral point of view. It is to ensure that the moral point of view belongs to the *characters*, not just to you.

  ***

  ### Part 2: The Scene Audit (10–15 Minutes)

  **Instructions:** Run this on one scene at a time. Do not skip steps. If a step triggers a "Stop," do not proceed to the next step until you have resolved it.

  **1. The Vocabulary Check**
  *   **Question:** Scan the dialogue and narration for abstract nouns that summarize a complex situation (e.g., "the science," "public health," "freedom," "the virus"). Does any character use a word that implies the debate is already settled?
  *   **Pass:** Characters use specific, immediate language ("the gauze," "the order," "the cough," "the boss").
  *   **Fail:** Characters use labels that require future knowledge to make sense (e.g., calling a mask a "safety device" when many believed it was a germ trap).
  *   **Rewrite:** Replace the abstract noun with the physical object or the specific fear. Change "trusting the science" to "trusting Dr. Williamson."
  *   **Stop:** If the word is essential to the theme (e.g., "liberty"), proceed to Step 2.

  **2. The Motive Test**
  *   **Question:** Pick the character who is "wrong" by modern standards. If you remove the reader's knowledge of the future, does their decision still make sense based on what they can see *in the room*?
  *   **Pass:** Their choice follows from their immediate information (e.g., "The gauze is wet and dirty; therefore it is dangerous").
  *   **Fail:** Their choice only makes sense if they are stupid, evil, or ignoring clear evidence that exists only for the reader.
  *   **Rewrite:** Give them a piece of information that justifies their error (e.g., a doctor telling them the gauze is useless).
  *   **Stop:** If their motive is purely ideological (e.g., "Liberty is more important than life"), proceed to Step 3.

  **3. The Narrator's Temperature**
  *   **Question:** Read the narration describing the "wrong" character. Is there a tone of pity, amusement, or superiority? Does the narration explain *why* they are wrong, or does it just show *that* they are wrong?
  *   **Pass:** The narration treats their reasoning as serious, even if flawed.
  *   **Fail:** The narration treats their reasoning as a symptom of ignorance or a historical quaintness.
  *   **Rewrite:** Remove adjectives that judge intelligence or morality (e.g., "stubbornly," "foolishly"). Describe the action, not the quality of the mind.
  *   **Stop:** If the tone is neutral, proceed to Step 4.

  **4. The Outcome Weight**
  *   **Question:** Look at the end of the scene. Does the scene end because the "right" argument won, or because of power, luck, or exhaustion?
  *   **Pass:** The argument is lost due to a vote, a lack of funds, or a conflicting order.
  *   **Fail:** The argument is lost because the "wrong" character suddenly realizes the truth (unless earned by specific evidence in Step 2).
  *   **Rewrite:** Let the "wrong" side keep their belief but lose the vote.
  *   **Stop:** If the scene ends in ambiguity or practical defeat, proceed to Step 5.

  **5. The Lineage Check (Present-Day Scenes Only)**
  *   **Question:** If this is a modern frame scene, does the narrator claim the ancestor did something *for the purpose* of the present?
  *   **Pass:** The ancestor did something for survival, community, or money, and the descendant finds value in it later.
  *   **Fail:** The ancestor is described as "ahead of their time" or a "forerunner" of a modern profession.
  *   **Rewrite:** Describe the action as it was intended then. Let the modern value be a discovery, not an intent.
  *   **Verdict:** If you hit a "Fail" here, you must decide: Is this book about *them*, or is it about *us* using them? (This is a thematic choice, not a fix).

  ***

  ### Part 3: Test Run on Your Draft

  Here is the procedure applied to the three scenes you described.

  #### Scene 1: The Anti-Mask Meeting
  *Context: Anti-mask characters argue gauze is useless, enforcement is class-biased, and compulsion is harmful.*

  *   **Step 1 (Vocabulary):**
      *   *Check:* Do they say "public health" or "civil liberties"?
      *   *Risk:* High. In 1918, "civil liberties" was a specific legal argument, but "public health" might be too modern.
      *   *Fix:* Ensure they say "the Board's order" not "the mandates." Ensure they say "gauze" not "masks."
      *   *Verdict:* **Rewrite.** If they sound like 2020 libertarians, strip the modern political coding. Keep the 1918 specific grievance: "The rich wear silk; we wear rags."
  *   **Step 2 (Motive):**
      *   *Check:* Is their claim about gauze being useless factually supportable *in 1918*?
      *   *Risk:* Medium. Gauze *was* often loose and ineffective.
      *   *Verdict:* **Pass.** This is historically sound. The procedure validates keeping this argument. It is not Whiggish to show them pointing out real flaws in the ordinance.
  *   **Step 3 (Narrator):**
      *   *Check:* Does the narration imply these men are selfish business owners ignoring death?
      *   *Risk:* High. If the narration highlights their wealth while they speak, it implies bribery.
      *   *Fix:* If they argue from principle, describe their faces, not their bank accounts.
      *   *Verdict:* **Rewrite** if the narration undercuts their logic with ad hominem description.
  *   **Step 4 (Outcome):**
      *   *Check:* Do they lose because they are wrong, or because the vote is called?
      *   *Verdict:* **Pass** if they are outvoted. **Fail** if they leave the room looking "defeated by truth." They should leave looking "defeated by the majority."
  *   **Overall Verdict:** This scene is likely **Safe** if you ensure their arguments are technical and class-based, not ideological in a modern sense. The procedure suggests you are worried about *apologetics*, but the audit shows that accurate historical dissent is not apology. Keep the scene, but scrub the narrator's judgment.

  #### Scene 2: The Deathbed Recantation
  *Context: An opponent recants on their deathbed, conceding the doctors were right. Editor loves it; you are wary.*

  *   **Step 1 (Vocabulary):**
      *   *Check:* Does the dying character say, "The science was right"?
      *   *Risk:* Critical Fail. A dying man in 1918 does not know "the science" won. He knows *he* is losing.
      *   *Fix:* He must say, "The doctors were right," or "I should have worn the cloth."
  *   **Step 2 (Motive):**
      *   *Check:* Why is he recanting? Is it because he is dying of the flu (evidence)?
      *   *Risk:* High. If he recants simply to comfort the family, it's sentimental. If he recants because he finally understands germ theory in his last hours, it's implausible.
      *   *Verdict:* **Fail.** The procedure flags this as "Outcome Weight." It suggests the character is conceding to the *author's* knowledge, not their own.
      *   *Rewrite:* He does not need to concede the *theory*. He can concede the *risk*. "I thought it was lies. Now I feel the fire in my lungs. I was wrong about the danger, not the law." This distinguishes medical reality from political principle.
  *   **Step 3 (Narrator):**
      *   *Check:* Does the narration treat this as a "triumph of truth"?
      *   *Risk:* High. This is the "Right Side of History" trap.
      *   *Verdict:* **Rewrite.** The tone must be tragic, not vindicated. The victory is hollow because he is dying.
  *   **Overall Verdict:** The procedure **condemns the scene as written**, but offers a path to save the emotional beat. You can keep the recantation, but it must be a confession of *miscalculation*, not a conversion to *modernity*. If you cannot make that distinction, cut the scene. It serves the editor's desire for closure, not the book's historical integrity.

  #### Scene 3: The Frame Chapters
  *Context: Great-granddaughter calls the laundress ancestor "a forerunner of modern epidemiology" based on the tally.*

  *   **Step 1 (Vocabulary):**
      *   *Check:* "Forerunner," "Epidemiology," "Data."
      *   *Risk:* Critical Fail. These are professional categories.
      *   *Verdict:* **Fail.**
  *   **Step 2 (Motive):**
      *   *Check:* Why did the laundress keep the tally? To help science?
      *   *Risk:* Critical Fail. She did it to know which doors to knock on, or which houses to avoid, or to shame the neighbors into cleaning up.
      *   *Verdict:* **Fail.**
  *   **Step 5 (Lineage):**
      *   *Check:* Is the descendant claiming the ancestor intended the modern outcome?
      *   *Risk:* Yes. "Forerunner" implies intent.
      *   *Verdict:* **Stop/Hand to Author.** This is the thematic core.
      *   *Decision:* You must choose. Is the great-granddaughter *wrong*? If she is an academic or bureaucrat, perhaps her error is part of her character arc. She imposes order on chaos.
      *   *Rewrite:* She calls it "epidemiology" in her thesis, but the narrative shows the laundress did it for survival. The gap between the two is the point of the book.
  *   **Overall Verdict:** The procedure flags this as **Whiggish Ennoblement**. You cannot let the statement stand as narrative truth. It can stand as the *character's* opinion, provided the text undermines it. The laundress was not an epidemiologist; she was a neighbor. The modern character's insistence that she *was* one is a symptom of the modern character's need for lineage.

  ***

  ### Part 4: Where the Procedure Misfires

  You asked for honesty about the tool's limitations. Here is where it will score wrongly or fail to help:

  1.  **The Moral Clarity Blind Spot:** The procedure treats all judgment as suspect. If a character is a racist or a abuser, the procedure might flag your condemnation of them as "judging past people by present standards." **Ignore the procedure here.** Some things are not historical differences; they are harms. The tool is for *epistemic* errors (what they knew), not *ethical* ones (how they treated people).
  2.  **The "Truth" Trap:** The procedure cannot tell you if masks *actually* worked. It only checks if the *characters* know they worked. If you write a scene where a mask clearly fails, the procedure will pass it (as it fits 1918 knowledge), even if it contradicts modern science. You must balance historical accuracy with medical truth yourself.
  3.  **The Emotional Verdict:** In Scene 2 (Deathbed), the procedure says "Fail." But fiction requires emotional resonance. If the recantation is the only way to give the protagonist closure, the procedure is too rigid. Use the *Rewrite* instruction, not the *Cut* instruction. The tool diagnoses the disease; it cannot prescribe the cure for grief.
  4.  **The Frame Narrative Paradox:** The procedure flags the great-granddaughter's "forerunner" claim as a Fail. But if the book is *about* how we misuse history, then her error is the point. The procedure assumes you want to write "true" history. If you are writing about the *desire* for true history, the "Fail" is actually a "Pass" for her character, provided the book knows she is wrong.
  5.  **Voice vs. Accuracy:** Sometimes a character needs to speak poetically, not historically. If a metaphor feels "modern" but captures a universal truth, the procedure will flag it. You must overrule the tool for the sake of art.

  **Final Instruction:**
  Run this audit on your forty scenes. Tally the "Fails."
  *   If the Fails are in the **1918 sections**, you are writing Whig history. Rewrite.
  *   If the Fails are in the **Present-Day sections**, ask yourself: Is the modern narrator unreliable? If yes, keep them. If no, rewrite.
  *   If the Fails are in **Scene 2**, do not cut the emotion. Cut the concession to *authority*. Keep the concession to *mortality*.

  Your editor wants the comfort of knowing we won. Your partner wants the comfort of knowing the science held. Your book must deny them both to give the reader the truth of what it felt to be alive when no one knew the end of the story.
