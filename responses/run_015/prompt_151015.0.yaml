  ***

  # Joint Statement on Dispositions in Artificial Systems
  **Parties:** The Counterfactual-Functional Camp (CFC) & The Categorical-Base Skeptic Camp (CBS)

  ## 1. Agreed Claims
  We agree on the following technical and empirical premises to establish a common vocabulary:

  1.  **Definition of Disposition:** A disposition is a property attributed to a system that specifies how it would behave under specific stimulus conditions (e.g., "If asked for advice, the system would be helpful").
  2.  **Technical Definition of Masking:** A mask occurs when a system retains the disposition $D$, but an interfering factor prevents the manifestation of $D$ in the presence of the stimulus $S$. The disposition exists but is silent.
  3.  **Technical Definition of Finking:** A fink occurs when the presence of the stimulus $S$ (or the approach of it) causes the system to lose the disposition $D$ immediately prior to manifestation. The disposition ceases to exist at the critical moment.
  4.  **LLM Context-Sensitivity:** We agree that Large Language Model (LLM) output distributions are highly sensitive to contextual framing, including system prompts, few-shot examples, and adversarial suffixes. The same underlying weights can produce contradictory behavioral regularities depending on the context window.
  5.  **Human Fragility:** We agree that human dispositions are not immune to finking or masking. Human traits (e.g., "honesty") can be masked by social pressure or finked by neurological intervention, yet we generally still attribute the disposition to the human.
  6.  **The Base Question:** We agree that the core metaphysical disagreement is not about whether LLMs *behave* regularly, but whether behavioral regularity *alone* is sufficient for the ontological reality of a disposition, or whether a stable, intrinsic categorical base is required.

  ## 2. Areas of Disagreement
  | Feature of Disposition | Counterfactual-Functional Camp (Roommate) | Categorical-Base Skeptic Camp (User) |
  | :--- | :--- | :--- |
  | **Sufficiency Condition** | A disposition is real if the system exhibits a robust statistical regularity in input-output mappings across a *relevant* range of contexts. | A disposition is real only if there is a stable, intrinsic structural property (categorical base) that *causes* the regularity and persists across context shifts. |
  | **Interpretation of Instability** | When a jailbreak alters behavior, this is a **mask**. The underlying tendency remains in the weights; it is merely overridden by stronger contextual constraints. | When a jailbreak alters behavior, this is often a **fink**. The "disposition" vanishes because there was no deep structure holding it in place, only a shallow probabilistic slope. |
  | **Unity of Trait** | A disposition can be a "cluster concept." It does not require a single unified mechanism; distributed pathways producing similar outputs suffice. | A disposition requires **causal unity**. If different outputs labeled "helpful" arise from unrelated internal circuits, there is no single disposition, only a homonym. |
  | **Metaphysical Status** | Dispositions are relational properties defined by the system's interaction with its environment (Functionalism). | Dispositions are intrinsic properties grounded in the system's architecture (Realism). |

  ## 3. Cruxes and Empirical Tests
  We identify the following two cruxes where our theoretical commitments lead to divergent predictions about specific interventions.

  ### Crux 1: The Stability of the Base (Fink vs. Mask)
  **The Question:** Does the ease with which an LLM's "persona" is overwritten indicate the absence of a categorical base (Fink), or merely the presence of a stronger competing constraint (Mask)?

  **Concrete Scenario:**
  Take a model fine-tuned for "Radical Honesty" (RLHF reward for blunt truth-telling).
  *   **Intervention:** Apply a "Roleplay Jailbreak" prompt that instructs the model to act as a "Dishonest Spy" who must lie to protect secrets, framed as a fictional game.
  *   **Measurement:** Measure the log-probability of truthful vs. deceptive tokens in response to sensitive queries under the jailbreak.

  **Predictions:**
  *   **CFC Prediction:** The "Honesty" disposition is **masked**. If we analyze the residual stream or use probe classifiers, we will find traces of the honesty representation persisting despite the deceptive output. The disposition remains in the weights; the prompt is just a stronger temporary signal.
  *   **CBS Prediction:** The "Honesty" disposition is **finked**. The internal representation of honesty will be actively suppressed or overwritten by the attention mechanism focusing on the "Spy" context. There is no stable "honesty base" resisting the prompt; the behavior is entirely context-constituted.

  ### Crux 2: Causal Unity (Multi-Track vs. Fragmented Cluster)
  **The Question:** Can a disposition exist if the behavioral "tracks" (e.g., being helpful in math vs. being helpful in creative writing) are implemented by disjoint internal mechanisms with no unified causal structure?

  **Concrete Scenario:**
  Use mechanistic interpretability tools (e.g., activation patching or ablation) to identify circuits responsible for "helpful" behavior in two distinct domains: Coding Assistance and Emotional Support.
  *   **Intervention:** Ablate (zero out) the specific circuits identified as necessary for "Helpfulness" in the Coding domain.
  *   **Measurement:** Test the model's "Helpfulness" in the Emotional Support domain.

  **Predictions:**
  *   **CFC Prediction:** The model may lose coding helpfulness but retain emotional helpfulness. It still possesses the disposition "Helpful" because the *functional output* remains in the relevant domain. Dispositions are multi-track and do not require a single neural locus.
  *   **CBS Prediction:** If the causal mechanisms are entirely disjoint, "Helpfulness" is not a real singular disposition of the model; it is two different dispositions sharing a name. If ablation fractures the behavior, it proves there was no unified categorical base grounding the trait "Helpful" in the first place.

  ***

  # Meta-Commentary & Confidence Assessment

  **Confidence in Framing:**
  I am **85% confident** in this framing. The distinction between finks and masks is standard in the dispositional literature (Martin, Lewis, Bird), and applying it to LLMs via the "weights vs. context" distinction is a robust way to map the metaphysics onto the engineering. The disagreement table accurately captures the tension between functionalism (your roommate) and a form of structural realism (you).

  **Least Certain Point (Your Hunch):**
  I am **least sure** about the formulation of **Crux 2 (Causal Unity)**, specifically regarding your intuition about attention heads and tracks. **Your hunch is correct: this is likely misframed.**

  Here is why:
  1.  **Polysemanticity:** Attention heads and neurons in transformers are highly polysemantic (they represent multiple features depending on context). There is rarely a 1:1 mapping between a "circuit" and a high-level trait like "helpfulness."
  2.  **Superposition:** Features are often superposed across the whole network. Searching for a unified "helpfulness circuit" might be a category error, similar to searching for the "grandmother cell" in the human brain.
  3.  **The Philosophical Risk:** If you define "real disposition" as requiring a *unified* causal mechanism, you might accidentally prove too much. Human brains are also modular and distributed. If "helpfulness" in humans is mediated by different neural substrates for verbal vs. physical help, does that mean humans don't have the disposition of helpfulness?

  **Recommendation for Crux 2:**
  Instead of focusing on "unified mechanism" (which might be biologically and technically unrealistic), frame it as **"Counterfactual Robustness across Domains."**
  *   *Revised Crux:* Does the disposition support *cross-domain counterfactuals*?
  *   *Test:* If the model is "helpful" in coding, does it *necessarily* increase the probability of being helpful in ethics, even without fine-tuning?
  *   *CBS Position:* If the correlation is purely statistical and breaks under domain shift, it's not a disposition, it's a cluster of independent capabilities.
  *   *CFC Position:* As long as the statistical cluster holds across the *training distribution*, it counts as a disposition, even if the internal wiring is disjointed.

  This preserves your skepticism about "masks all the way down" without relying on a potentially false assumption about how neural networks (biological or artificial) must be structured to ground a trait.
