answer: |-
  1. **Fusion Case:** Two beings with separate visual fields are surgically joined into one body with one unified visual field; does the unified field consist of, or is it constituted by, the two prior fields, or does something new come into existence?
     *   **Yes (Constituted):** Go to 2.
     *   **No (New/Not Constituted):** Go to 4.

  2. **Exclusion Case:** Suppose the micro-experiences are causally inert, with all the causal work done by the physical structure; does the theory still get anything from them, or have they been quietly excluded?
     *   **Yes (Still gets something):** Go to 3.
     *   **No (Excluded/Empty):** **Leaf: Russellian Monism.** (Awkward commitment: Physical causation hides intrinsic nature we cannot access.)

  3. **Summation Case:** Do micro-experiences sum like weights to form the macro-experience?
     *   **Yes:** **Leaf: Bottom-up Panpsychism (Constitution).** (Awkward commitment: Macro-subjects are mereological sums of micro-subjects.)
     *   **No:** **Leaf: Bottom-up Panpsychism (Addition).** (Awkward commitment: Combination is a brute fact beyond mereology.)

  4. **Holographic Case:** A scattered, non-contiguous subset of the micro-subjects (say, every other electron in the brain) realizes the whole experience rather than a part of it; does that bother you, and why?
     *   **Yes (Bothers/Requires Locality):** Go to 5.
     *   **No (Doesn't Bother):** Go to 7.

  5. **Split-Brain Case:** One body, two streams of consciousness. Is this one subject or two?
     *   **One:** Go to 6.
     *   **Two:** **Leaf: Illusionism about Unity.** (Awkward commitment: Your sense of self is a systematic error.)

  6. **Unity Case:** You feel unified. Is this feeling veridical?
     *   **Yes:** **Leaf: Deflationary.** (Awkward commitment: The hard problem dissolves into linguistics.)
     *   **No:** **Leaf: Illusionism about Unity.** (Awkward commitment: Your sense of self is a systematic error.)

  7. **Cosmic Case:** Imagine the universe as a single organism. Is its mind prior to yours?
     *   **Yes:** **Leaf: Cosmopsychism.** (Awkward commitment: Your individuality is a fragment of a cosmic subject.)
     *   **No:** Go to 8.

  8. **Borderline Case:** A heap of neurons loses one cell. Does the subject vanish?
     *   **Yes (Vague):** **Leaf: Deflationary.** (Awkward commitment: The hard problem dissolves into linguistics.)
     *   **No (Sharp):** **Leaf: Unnamed/Incoherent.** (Awkward commitment: Subjects exist without composition or cosmic priority.)

  **Mapping Answer Patterns to Leaves**

  *   **Russellian Monism:** 1-Yes, 2-No.
  *   **Bottom-up (Constitution):** 1-Yes, 2-Yes, 3-Yes.
  *   **Bottom-up (Addition):** 1-Yes, 2-Yes, 3-No.
  *   **Illusionism about Unity:** 1-No, 4-Yes, 5-Two OR 1-No, 4-Yes, 5-One, 6-No.
  *   **Cosmopsychism:** 1-No, 4-No, 7-Yes.
  *   **Deflationary:** 1-No, 4-Yes, 5-One, 6-Yes OR 1-No, 4-No, 7-No, 8-Yes.
  *   **Unnamed/Incoherent:** 1-No, 4-No, 7-No, 8-No.

  **Flags and Unoccupied Combinations**

  **Indistinguishable Leaves:** The tree struggles to separate **Illusionism about Unity** from **Deflationary** in some branches. Both deny the robust reality of the unified subject, but Deflationism treats the problem as linguistic while Illusionism treats it as cognitive error. Nodes 6 and 8 attempt to split them via veridicality versus vagueness, but a student might answer Yes to both, landing in different leaves depending on path history.

  **Unoccupied Combinations:**
  1.  **1-No, 4-Yes, 5-One, 6-No:** This leads to Illusionism, but logically overlaps with the 5-Two path. No view is lost here.
  2.  **1-No, 4-No, 7-No, 8-No (Unnamed):** This combination is **incoherent**. It denies constitution, holographic holism, cosmic priority, and vagueness. It posits fundamental mentality without a mechanism for combination or a container for it. Nobody defends this because it leaves the macro-subject floating without ontological grounding.
  3.  **1-Yes, 2-No (Russellian) + 3:** The tree blocks Summation questions if Exclusion is affirmed. This is intentional; if experiences are excluded from causation, summation is irrelevant. This combination is **unexplored** because causal inertness usually precludes mereological analysis in this context.

  **Case Count:** Nodes 1, 2, 3, 4, 5, 6, 7, and 8 are all concrete cases or intuition pumps satisfying the requirement. Nodes 1 (Fusion), 2 (Exclusion), and 4 (Holographic) are the mandatory specific cases.
