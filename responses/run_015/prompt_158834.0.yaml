      *   *Hypothesis 2 (Three Jobs of Supervision):* Training signal vs. Safety evidence vs. Runtime behavior. *Assessment:* This highlights a category error. People argue past each other because they mean different things by "supervision."
      *   *Observation 3 (Three Currencies of Failure):* Shortcut success (right answer, wrong reason), Alien competence (right answer, weird reason), Plausible-chain failure (wrong answer, looks right). *Assessment:* This is a crucial framing. The camps prioritize different failure modes. Process cares about Shortcuts. Outcome cares about Alien Competence. Both ignore Plausible-chain (which is dangerous for long horizons).

