answer: |-
  ### Essay Question

  **Question 1**
  Consider a long-standing social practice $P$. Historically, $P$ was established for reason $R$, but $R$ has since lapsed and is no longer relevant. However, $P$ now produces a valuable unintended consequence $C$ that sustains social order. A reformer understands both the history of $R$ and the current utility of $C$. They propose abolishing $P$ and replacing it with a new institution $P'$ explicitly designed to secure $C$ more efficiently.

  Drawing on Edmund Burke's *Reflections on the Revolution in France* and G.K. Chesterton's "Democracy of the Dead," evaluate this proposal. Does Chesterton's Fence forbid this replacement? Would Burke's appeal to prejudice and inherited institutions yield a different verdict? In your answer, focus specifically on the **epistemic status** of the value contained in $P$. Does the reformer's understanding of $C$ satisfy the conservative demand for knowledge, or does the value of $P$ reside in a form of rationality that outruns the reformer's explicit design? (Approx. 90 minutes)

  ***

  ### Model Answer

  Chesterton's Fence and Burkean conservatism are often conflated as simple injunctions against change, but they rest on divergent epistemic foundations. In the scenario provided, where a reformer understands the unintended consequence $C$ of a practice $P$, Chesterton's principle would likely permit the replacement, whereas Burke's philosophy would forbid it. The distinction lies in whether the value of an institution is reducible to a graspable function or resides in sedimented, tacit wisdom.

  Chesterton's Fence is fundamentally a demand for intelligibility. The maxim states that one should not remove a fence until one knows why it was put there. This is an epistemic condition placed on the *reformer*. If the reformer can identify the reason for the practice, the condition is satisfied. In this scenario, the reformer understands that $P$ secures $C$. Even though $C$ was unintended by the originators, it is now the *known* function of the practice. For Chesterton, the "fence" exists to serve a purpose discoverable by reason. Once the reformer grasps that purpose ($C$), they are epistemically licensed to rebuild the fence ($P'$) to serve that purpose better. Chesterton trusts the individual's capacity to understand the *why* of a tradition; once the *why* is known, the *how* can be altered. Therefore, Chesterton's Fence does not forbid the replacement, provided the reformer's understanding of $C$ is robust.

  Burke, however, offers a deeper skepticism regarding the reformer's capacity to isolate $C$ from the wider web of social relations. For Burke, institutions are not merely functional tools designed to secure specific outcomes; they are repositories of "prejudice"—collective wisdom sedimented over time that outruns individual articulation. The value of $P$ is not exhausted by the explicit consequence $C$. The practice may secure $C$ only because it is intertwined with other habits, emotions, and beliefs that the reformer ignores. To abolish $P$ is to disrupt a complex ecosystem of tacit knowledge. Even if $P'$ is designed to secure $C$, it lacks the historical legitimacy and the "unconscious rationality" that allows $P$ to function without friction. Burke argues that individual reason is too narrow to comprehend the full utility of inherited practices. Thus, the reformer's explicit understanding of $C$ is insufficient; they cannot replicate the distributed rationality embedded in $P$.

  Consequently, the two thinkers diverge on the permissibility of the reform. Chesterton allows the swap because the *reason* for the fence is known to the individual. Burke forbids it because the *rationality* of the fence is collective and partly inarticulate. For Chesterton, tradition is a puzzle to be solved by reason; for Burke, it is an organism to be nurtured. The reformer's error, from a Burkean perspective, is assuming that $C$ is the totality of $P$'s value. By attempting to engineer $P'$, the reformer privileges abstract design over prescriptive inheritance, risking the loss of the very social cohesion $C$ represents.

  In conclusion, while both thinkers caution against rash innovation, only Burke would strictly forbid the replacement of $P$ with $P'$. Chesterton requires the reformer to understand the function; Burke requires the reformer to humble themselves before the mystery of the function's embedding. The reformer satisfies Chesterton but fails Burke.

  ***

  ### Marking Scheme (Total 20 Marks)

  **1. Interpretation of Chesterton's Epistemic Condition (4 marks)**
  *   **Criteria:** Student identifies that Chesterton's Fence is a condition of *intelligibility* for the reformer. If the reformer knows reason $C$, the fence is "understood" and may be moved.
  *   **Common Error:** Students claim Chesterton forbids all change regardless of understanding, treating him as identical to Burke.

  **2. Interpretation of Burke's Concept of Prejudice/Sedimentation (4 marks)**
  *   **Criteria:** Student explains that for Burke, the value of $P$ exceeds the explicit consequence $C$ because it is embedded in a wider web of tacit, collective knowledge.
  *   **Common Error:** Students reduce Burke's view to simple "habit" or "stubbornness" without referencing the epistemic value of inherited wisdom.

  **3. Distinction on the Status of Consequence $C$ (4 marks)**
  *   **Criteria:** Student articulates that for Chesterton, $C$ is the *function* (which can be re-engineered), while for Burke, $C$ is an *emergent property* of the specific historical institution $P$ (which cannot be easily replicated).
  *   **Common Error:** Students treat $C$ as a freestanding variable that can be detached from the institution $P$ in both frameworks.

  **4. Epistemic Distinction: Individual vs. Distributed Reason (4 marks)**
  *   **Criteria:** Student explicitly contrasts Chesterton's trust in individual grasp of reasons with Burke's trust in distributed, trans-generational rationality that outruns single minds.
  *   **Common Error:** Students focus on moral or political outcomes (order vs. liberty) rather than the *epistemic* basis of the disagreement as requested.

  **5. Final Verdict on the Reformer's Proposal (4 marks)**
  *   **Criteria:** Student concludes that Chesterton permits the replacement (condition met) while Burke forbids it (condition unmeetable), summarizing the divergence clearly.
  *   **Common Error:** Students hedge or conclude that both thinkers would give the exact same answer ("don't do it"), failing to separate the views.
