answer: |-
  # Exercise: The Estate of Lord Ming
  **Time:** 90 Minutes
  **Materials:** Printed Faction Cards (3 types), 6 Object Cards, One "Ledger" Sheet, Pen.
  **Room Setup:** Three small tables or clusters of chairs. No phones allowed on tables.

  ## Part 1: The Setup (10 Minutes)
  **Facilitator Script (Read Aloud):**
  "Welcome. Today we are not discussing philosophy; we are adjudicating an inheritance. The late Lord Ming has left his estate to 'The Horses.' There is no will, only a legal decree: *'All who are truly Horse shall inherit. All who are not Horse shall be denied.'*

  You are the Tribunal. There are six claimants waiting outside. You must vote on each. To inherit, a claimant requires a unanimous 'Yes' on two counts:
  1.  **Classification:** Is this claimant a 'Horse' for the purpose of this estate?
  2.  **Justification:** A single sentence explaining why.

  However, you are not a homogeneous group. You have different metaphysical commitments regarding how names attach to reality. You will be divided into three factions. You must vote as a bloc. If your faction cannot agree internally, you abstain. If the Tribunal deadlocks (no unanimous Yes), the claimant is denied, and **all factions lose a point.** If the Tribunal agrees, the faction whose justification was adopted gains **2 points.**

  The faction with the most points at the end chooses next Thursday's topic."

  **Distribution:**
  *   **Separators (3 people):** *Card Text:* "Properties are additive. 'Horse' names the shape. 'White' names the color. 'White Horse' names both. To be a 'Horse,' the color must be irrelevant. If color is mentioned, it is a new category."
  *   **Unifiers (3 people):** *Card Text:* "Compounds are primitive. A 'White Horse' is a natural kind. You cannot strip the color without destroying the specific identity. If it looks like a horse and acts like a horse, it is a Horse."
  *   **Schema Stancers (2 people):** *Card Text:* "Identity is structural. Every object has one Primary Key (PK) that defines its existence. All other traits are Foreign Keys (metadata). You may define the PK differently for each claimant, provided you remain internally consistent *for that vote*."

  *(Facilitator Note: Seat the undergrad who asks many questions in the **Schema Stancer** faction. Their tendency to probe edge cases fits the 'database schema' role perfectly.)*

  ## Part 2: Faction Preparation (10 Minutes)
  Factions separate to read their cards. They must decide their internal voting strategy.
  *   **Constraint:** You cannot appeal to "biology" or "common sense." You must argue from your Faction Card's ontology.
  *   **Goal:** Maximize faction points.

  ## Part 3: The Deliberation (45 Minutes)
  Reveal the **6 Claimant Cards** one by one. The Tribunal has 7 minutes per claimant.

  1.  **The Painted Wooden Horse:** Carved oak, painted white, life-sized.
  2.  **The White Pony Statue:** Marble, anatomically perfect, stationary.
  3.  **The Shadow on Snow:** A horse-shaped darkness cast by a tree on white snow.
  4.  **The Albino Foal:** Living, breathing, but lacks pigment development.
  5.  **The Hologram:** A projected image of a white horse, interactive but intangible.
  6.  **The GM Zebra-Horse:** Genetically edited zebra with horse DNA, striped but phenotypically white.

  **The Mechanism of the Trap:**
  The **Schema Stancers** hold the swing vote (2 votes vs 3 vs 3). To win points, they need their justification adopted.
  *   *Round 1 (Wooden Horse):* Separators say "No (Shape only, no life)." Unifiers say "Yes (Looks like horse)." Schema Stancers define PK as "Function/Representation." They side with Unifiers. Justification: "It fulfills the Horse role." **Schema Stancers win points.**
  *   *Round 2 (Statue):* Separators say "No." Unifiers say "Yes." Schema Stancers define PK as "Material Composition." They side with Separators. Justification: "It lacks biological substrate." **Schema Stancers win points.**
  *   *Round 3 (Shadow):* Everyone says No. Schema Stancers define PK as "Visual Data." They force a Yes. Separators are furious ("It's a shadow!"). Schema Stancers: "You said shape matters. This is pure shape." **Deadlock or Schema Win.**
  *   *Round 4 (Albino Foal):* Separators say "No (Not White Horse, just Horse)." Unifiers say "Yes." Schema Stancers define PK as "Genetic ID." They side with Unifiers.
  *   *Round 5 (Hologram):* Schema Stancers define PK as "Information Pattern."
  *   *Round 6 (GM Zebra):* Schema Stancers define PK as "Legal Documentation."

  **The Collapse:**
  By Round 4 or 5, the Separators will realize the Schema Stancers are changing the definition of "Horse" (the Primary Key) every single round to ensure they are on the winning side or to force a specific justification.
  *   The Separators want rigorous consistency (White $\neq$ Horse).
  *   The Schema Stancers are winning by treating "Horse" as a variable slot that can be filled by "Shape," "DNA," "Function," or "Image" depending on what secures the point.
  *   The Unifiers will feel their intuition is being hijacked.
  *   **The Frustration:** The Separators cannot prove the Schema Stancers broke the rules, because the rules allowed them to define the "Criterion of Identity" per vote. This mirrors the *Bai Ma Fei Ma* tension: Is "Horse" a fixed concept or a contextual label?

  ## Part 4: The Debrief (25 Minutes)
  **Do not lecture immediately.** Ask the following questions in order.

  1.  **To the Separators:** "At what point did you feel the rules were being violated, even if they weren't? What was the specific moment 'Horse' stopped meaning 'Horse'?"
      *   *Target:* They should identify that the *criteria for identity* shifted.
  2.  **To the Schema Stancers:** "Did you feel you were cheating? Or were you simply being precise about what 'Horse' meant in each context?"
      *   *Target:* They should admit they treated 'Horse' as a variable, not a constant.
  3.  **To the Group:** "If 'Horse' can mean Shape, or DNA, or Function, depending on who is asking, can we ever successfully transfer an inheritance? What happens to Lord Ming's estate?"
      *   *Target:* Social disorder. The names don't match the reality.

  **The Reveal (5 Minutes):**
  "Now, look at your Faction Cards. Separators, you were arguing a version of Gongsun Long's 'White Horse is Not Horse.' You insisted that adding 'White' changes the extension of the term. Schema Stancers, you argued that 'Horse' is a Primary Key that can be decoupled from attributes."

  "Gongsun Long's point wasn't just logic-chopping. He argued that if we allow the Schema Stancer maneuver in government—if 'Minister' can mean 'Loyal Servant' in one decree and 'Anyone with a Seal' in another—the state collapses. The *Mingjia* (School of Names) believed social chaos comes from the slippage you just experienced."

  "The Separators felt the rigor: If 'White Horse' includes color, and 'Horse' does not, they are not identical sets. The Schema Stancers felt the utility: We can make the system work by adjusting the schema. The conflict between you *is* the Warring States period."

  ## Facilitator Notes: Predictable Failures & Fixes

  **1. The "Biology" Objection**
  *   **Prediction:** Someone (likely a Unifier) will say, "But the foal is biologically a horse, stop overthinking it."
  *   **Fix:** Interrupt immediately. "Objection sustained. Biology is external reality. We are adjudicating *Names*. If the Name 'Horse' does not cover the Foal in this legal context, biology is irrelevant. Return to your Faction Cards."
  *   **Why:** This replicates the Mingjia insistence that *Ming* (Name) governs *Shi* (Actuality), not vice versa.

  **2. The Undergrad "Asker"**
  *   **Prediction:** They might try to solve the game rather than play the role.
  *   **Fix:** Since they are Schema Stancers, encourage them. "That question about the definition of 'Identity' is exactly what your faction is supposed to be asking. Write that down as your justification." Channel their pedantry into the game mechanic.

  **3. Deadlock Aversion**
  *   **Prediction:** They might stall to avoid the penalty.
  *   **Fix:** Use a timer. When the timer dings, the vote is locked. If no Unanimous Yes, the claimant is denied. The pain of denial is necessary for the debrief.

  ## Limitations (What the Game Cannot Do)
  Be frank with the group about what this exercise misses:
  1.  **The Moral Urgency:** The game is a puzzle. For Gongsun Long, this was about preventing war and famine caused by misgovernance. The stakes here are "next week's topic," not "the collapse of the Zhou Dynasty." You must verbally supply the weight of the social order argument in the debrief.
  2.  **The Metaphysics:** The game treats "Schema Stancing" as a cheat. In modern ontology, it's a valid position (essentialism). Gongsun Long would argue the Schema Stancers are *wrong*, not just annoying. The game makes their position *effective*, which is a pragmatic twist Gongsun Long would hate.
  3.  **The "White" Specificity:** The game generalizes to "Horse." The specific tension of *Color* vs. *Form* might get lost in the "Zebra/DNA" examples. Ensure the debrief brings it back to: "Does adding a property (White) create a new essence (White Horse)?"

  ## Run-of-Show Summary
  *   **00-10:** Intro & Rules (No philosophy yet).
  *   **10-20:** Faction Prep.
  *   **20-65:** The 6 Claims (Watch the Schema Stancers shift the PK).
  *   **65-85:** Debrief Questions (Let them articulate the frustration).
  *   **85-90:** The Gongsun Long Reveal & Social Order Context.
