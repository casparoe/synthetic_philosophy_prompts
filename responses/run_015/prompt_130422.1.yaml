  They claim the bond is but a means to ease,
  That friendship serves but pleasure's fleeting end,
  And beauty's sole design is but to lend
  Yielding mere sensation to moments these.
  That safety is the only thing to please,
  And every virtue they would break and bend
  To calculate the joy it might extend,
  Reducing worth to atomic degrees.

  Yet this dissection cuts the living wrong,
  For intrinsic good lives in the whole alone,
  Not parts summed up as distinct seeds are sown;
  The whole bears worth apart from every song.
  When minds admire the fair, they both belong
  To one complex—or marks the bound analysis has thrown?
