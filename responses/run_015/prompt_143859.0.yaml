          *   Address the Asymmetry: It relies on a hybrid of *Causal Contribution* (weakly) and *Fair Share* (strongly). It treats the debit as a "tax" on participation and the credit as a "mitigation."
          *   *Key Insight:* The theory is actually *Accounting Fictions*. It presupposes a global ledger where $1 = 1tCO2$ anywhere.
      *   **2. Strict Presuppositions vs. Compatible Fits:**
