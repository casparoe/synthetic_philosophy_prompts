  6.  **(Mental Check of the "Strict Presupposition" question):**
      *   Does it *require* linearity? Strictly speaking, if the claim is "carbon neutral," yes. If the claim is "we contributed to mitigation," no. The policy claims "neutral," so it presupposes linearity/additivity.
