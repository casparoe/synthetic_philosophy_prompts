          3.  *Responsibility Discharge:* Payment discharges individual responsibility, ignoring airline/fuel/collective nature.
      *   **Questions to Answer:**
          1.  What is the *implicit theory*? (Difference-making vs. Complicity/Fair Share).
          2.  Is the asymmetry a defect or licensable by a single theory?
          3.  What does the practice *strictly presuppose* vs. what *fits well*? (Additivity/Linearity vs. Thresholds).
          4.  What happens under alternative theories (Strict Difference, No-Difference, Fair-Share)?
          5.  Is the practice *underdetermined* (compatible with multiple conflicting theories)?

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *The Practice:* POS Offsetting.
      *   *The Implicit Theory (Surface Level):* It looks like a "Carbon Accounting" model based on *proportionate responsibility* and *fungibility*. It treats carbon as a substance (mass balance) rather than a causal event.
      *   *Puzzle 1 (Asymmetry):* This is the classic "Average vs. Marginal" problem in economics/ethics. The practice assumes *Proportionate Share* on the debit side (you own a slice of the pie) but *Counterfactual Impact* on the credit side (you bought a new pie elsewhere). This is theoretically unstable.
      *   *Puzzle 2 (Cap + Offset):* This suggests a "Residual Responsibility" or "Budget" view. Offsets handle the *moral cost* or *fair share*, but the Cap handles the *physical limit* or *systemic transition*.
