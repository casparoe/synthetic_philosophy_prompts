answer: |-
  This is an exceptionally sharp dissection of the normative architecture underlying carbon offsetting. You have identified that the practice is not merely technically flawed but theoretically hybrid, stitching together incompatible moral ontologies to produce a administratively convenient output ("carbon neutral").

  To reconstruct the implicit theory, we must look at what the practice *does* rather than what it *says*. It operates as a **moral accounting technology** that relies on a specific metaphysical view of harm: **Carbon Substance Monism.**

  Here is a reconstruction of the implicit theory, an analysis of its strict presuppositions, and a mapping of how alternative theories would dismantle or reshape the policy.

  ### 1. The Implicit Theory: The Global Ledger of Harm

  The practice presupposes a **Substance-Based Liability Model**. In this view, harm is not primarily an event (a causal chain leading to warming) but a substance (tonnes of CO₂e) that enters a global ledger.

  *   **Ontology:** Emissions are treated as discrete, fungible units of "badness" that exist independently of the specific causal mechanism that produced them.
  *   **Responsibility:** Liability is assigned via **proportionate participation** (the debit side) rather than **counterfactual difference-making**. By booking a seat, you appropriate a share of the "substance" emitted by the aircraft.
  *   **Remediation:** Because the substance is fungible, a unit of "goodness" (avoided emission elsewhere) can algebraically cancel a unit of "badness."
  *   **The Goal:** The goal is not to prevent the specific flight's emissions (which have already occurred or are contractually locked in) but to balance the ledger to zero.

  **Addressing Puzzle 1 (The Asymmetry):**
  You ask if the asymmetry between average allocation (debit) and counterfactual accounting (credit) is a defect. Under the *Substance-Based Liability Model*, it is not a defect; it is a feature of **administrative feasibility vs. market integrity.**
  *   **Debit (Average):** Calculating the marginal counterfactual impact of a single passenger on a specific flight is epistemically impossible for a booking tool (would the flight have cancelled? would someone else have taken the seat?). The theory defaults to a **Fair Share** view here: you owe for the share of the collective harm you utilized.
  *   **Credit (Counterfactual):** The offset market requires strict additionality to maintain the *value* of the currency. If credits weren't counterfactual, the "substance" wouldn't be real, and the ledger wouldn't balance.
  *   **The Bridge:** The theory bridges this gap with an **Expected Value** argument. While your specific flight's marginal impact is unknown, the *aggregate* of all passengers matches the fuel burn. Therefore, charging the average is a statistically valid proxy for your liability, which can then be discharged by a verified counterfactual reduction elsewhere.

  ### 2. Strict Presuppositions vs. Compatible Fits

  You ask what the practice strictly presupposes. The claim of "neutralization" carries heavy ontological baggage.

  *   **Strict Presupposition: Linearity and Additivity.**
      For a tonne here to cancel a tonne there, the damage function of climate change must be treated as linear and additive. If the climate system has tipping points (threshold effects), then *location and timing matter*. A tonne emitted now (pushing toward a threshold) is not fungible with a tonne avoided later or elsewhere. If damages are non-linear, the algebraic sum $X - X = 0$ is false; it might be $HighRisk - LowMitigation \neq 0$. The practice *strictly presupposes* linearity to make the claim of "neutrality" logically coherent.
  *   **Strict Presupposition: Fungibility of Moral Responsibility.**
      It presupposes that the moral wrong of emitting is separable from the act of emitting. It assumes the wrong lies in the *net state of the atmosphere*, not in the *act of participation* in a harmful industry.
  *   **Merely Compatible:**
      The idea that this leads to actual net-zero physical impact is merely compatible. The practice could continue even if offsets were known to be ineffective, provided the goal shifted from "neutrality" to "contribution." But the specific claim of *neutralization* requires the presuppositions above.

  ### 3. The Cap + Offset Paradox (Puzzle 2)

  The combination of a hard cap and offsetting seems redundant under the *Substance-Based Liability Model* (if I paid, why cap?). However, it makes sense under a **Two-Track Normative Framework**:

  1.  **Track A (Moral Discharge):** Offsets address the *backward-looking* liability. They clear the moral debt incurred by the act. This allows the institution to say, "We are not morally complicit in net harm."
  2.  **Track B (Forward-Looking Constraint):** The cap addresses the *forward-looking* systemic transition. It acknowledges that offsets are a transitional mechanism, not a permanent license.

  **The Implicit Theory here is "Transition Management."**
  The policy assumes offsets are a **bridge technology** for moral accounting, while the cap is a **structural constraint** on behavior. The cap signals that the practice (flying) is ultimately unsustainable, even if currently "neutralized." It prevents the "Jevons Paradox" of moral licensing (where people fly more because it's offset). The policy implicitly admits that offsets do not solve the *structural* problem, only the *accounting* problem.

  ### 4. Alternative Theories and Policy Implications

  If we replace the implicit *Substance-Based Liability Model* with the theories you suggested, the policy changes drastically.

  | Theory | View on Individual Contribution | View on Offsets | Policy Implication |
  | :--- | :--- | :--- | :--- |
  | **Strict Difference-Making** | Only matters if you change the outcome (marginal impact). | **Incoherent.** Most individual flights have near-zero marginal impact. Buying offsets implies you had an impact to neutralize. | **Abolish POS Offsets.** Focus entirely on institutional procurement changes (e.g., banning flights where trains exist). Offsets are revealed as a fiction. |
  | **No-Difference (Inefficacy)** | Individual acts are causally negligible in collective harm problems (Nefsky-style). | **Symbolic.** Offsets cannot "cancel" harm because the individual didn't "cause" it in a counterfactual sense. | **Relabel as Donations.** Offsets become voluntary contributions to a public good, not a discharge of liability. The Cap becomes the sole regulatory tool. |
  | **Fair-Share / Complicity** | You are responsible for your *share* of the collective harm, regardless of marginal impact. | **Buy-Out.** Offsets are a payment to discharge complicity in an unjust system. | **Keep but Reframe.** Offsets are a "tax" on complicity. The Cap ensures the "share" remains within a just allocation. This fits the current policy best but requires admitting offsets don't erase physical harm. |

  ### 5. Is the Practice Underdetermined?

  **Yes, profoundly.**

  The practice is a **Reflective Equilibrium of Convenience**. It is underdetermined in the sense that it allows stakeholders to project their preferred theory onto the same mechanism:
  *   **The Finance Office** sees a *Carbon Tax* (internalizing external costs).
  *   **The Sustainability Office** sees *Mitigation* (funding green projects).
  *   **The Traveler** sees *Indulgence* (moral licensing to fly without guilt).
  *   **The Administrator** sees *Compliance* (ticking the box for net-zero pledges).

  Because these theories converge on the action "pay $X per tonne," the policy appears robust. However, as you have noted, they diverge on the *justification*.
  *   If the Finance Office's view dominates, the price should reflect the *social cost of carbon* (often higher than offset prices).
  *   If the Sustainability Office's view dominates, the offsets must be high-quality (which increases cost/reduces volume).
  *   If the Traveler's view dominates, the price must be low enough not to deter travel.

  The current policy likely selects the lowest common denominator: cheap offsets that satisfy the accounting requirement without deterring the behavior.

  ### 6. Conclusion for Your Writing

  In your reconstruction, you can argue that the practice relies on a **category error** that is functionally necessary for its operation.

  1.  **It conflates *Accounting* with *Causality*.** It treats the ledger balance as morally equivalent to physical reality.
  2.  **It conflates *Fair Share* with *Difference Making*.** It charges you for a share (average) but lets you pay it off with difference-making (offsets). This is only coherent if we accept that "responsibility" is a currency that can be earned elsewhere, not a stain on the specific act.
  3.  **It is Underdetermined.** The policy is not evidence of a coherent philosophical stance by your department. It is evidence of a **pragmatic compromise** between conflicting normative demands (reduce travel vs. enable research vs. look green).

  **The Verdict:** The practice strictly presupposes that harm is **fungible, additive, and separable from the agent**. If you deny any of those three (e.g., harm is threshold-based, or harm is tied to the act of complicity), the claim of "neutralization" collapses, leaving only a "contribution to mitigation." The coexistence of the Cap suggests the institution secretly knows this: the Cap manages the *physical/structural* risk, while the Offset manages the *moral/reputational* risk.

  For your PhD work, this suggests the "theory" you are reconstructing is not a sincere moral philosophy held by the actors, but an **institutional logic** designed to resolve cognitive dissonance in a carbon-constrained world. It is a ritual of purification that allows the system to continue functioning despite knowing it is theoretically incoherent.
