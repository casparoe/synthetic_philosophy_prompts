answer: |-
  The debate over the demise of institutions like dueling and chattel slavery often hinges on a false dichotomy between "moral sentiment" and "material interest." To resolve this, one must first sharpen the conceptual tools used to analyze honor. Honor is frequently treated as an **internalized normative commitment**—a psychological state wherein an individual feels shame or pride based on a personal moral compass. However, a more robust sociological interpretation treats honor as a **strategic coordination equilibrium**. In this view, honor is not merely a feeling but a social game sustained by reputation costs and the enforcement behavior of third parties. An individual adheres to honor codes not necessarily because they internally value the act, but because deviating triggers punitive sanctions from the community (loss of status, credit, or marriage prospects), making adherence the rational strategy.

  Under this **equilibrium interpretation**, the decline of dueling is not best understood as a sudden surge in private pacifism (moral sentiment) nor as a simple exogenous shock to material interests (e.g., guns becoming too deadly). Rather, it is a restructuring of the payoff matrix driven by the state's monopolization of legitimate violence. In a pre-state or weak-state environment, the "honor game" functions as a necessary enforcement mechanism for contracts and social trust. If a man refuses a duel, third parties withhold recognition (social death), which carries severe material consequences. The payoff matrix favors dueling: the risk of death is outweighed by the certainty of social ruin if one refuses.

  However, when a centralized state successfully monopolizes violence and guarantees property rights and personal security through law, the utility of the honor signal diminishes. The state alters the social cost of withholding recognition. Previously, snubbing a non-duelist was costless for the community; under a strong legal regime, harassment or exclusion may incur legal penalties, or alternatively, the non-duelist no longer requires the community's protection because the state provides it. Consequently, the equilibrium shifts. The cost of dueling (legal prosecution + death) now outweighs the benefit (status), while the cost of refusing (stigma) is buffered by state protection. The practice collapses not because the participants suddenly morally condemned violence, but because the institutional backdrop made the honor-based enforcement of violence redundant and too costly. The "interest" that changed was not an exogenous material factor, but an endogenous social cost recalibrated by institutional change.

  This analysis raises a profound classificatory problem for what we term **moral revolutions**. Consider a scenario where a practice collapses at the level of **first-order compliance** (people stop dueling) while **second-order normative belief** persists (many still regard refusal as dishonorable). How do we classify this shift?

  If we define a revolution as "argument-driven," we imply that moral reasoning changed minds, which then changed behavior. But if the belief persists, the argument seemingly failed. If we define it as "interest-driven," we imply amoral calculation. Yet, if the calculation was driven by a state structure built on normative ideas of order and rights, "interest" is contaminated by morality. If we define it as "honor-driven," we face the paradox that honor dictated the practice's end, even though honor codes ostensibly demanded its continuation.

  The resolution lies in recognizing that under the equilibrium model, the shift is **institutionally-driven**, which is a distinct category often obscured by the sentiment/interest dichotomy. The shift is driven by a change in the *rules of the game* that makes the old normative belief behaviorally inert.

  This brings us to the specific **conceptual mistake** involved in assessing moral progress: the assumption that **the survival of a normative belief necessarily requires the survival of the corresponding practice.** This is a category error conflating *normative validity* (what people think ought to be done) with *behavioral regularity* (what people actually do).

  This mistake distorts assessments of moral reasoning's efficacy in two ways. First, it leads observers to claim that moral reasoning is impotent if behavior changes before belief does. They argue that because gentlemen still *believed* in honor while stopping dueling, the end of dueling was not a moral victory but merely a pragmatic adjustment. This ignores that moral reasoning often operates by designing institutions (like the rule of law) that alter payoffs, forcing behavioral compliance *ahead* of belief adaptation. Second, it obscures the feedback loop between practice and belief. When the practice becomes too costly due to institutional restructuring, the persistence of the belief becomes cognitively dissonant. Over time, the inability to act on the belief erodes the belief itself.

  Therefore, moral reasoning *can* be efficacious independently of immediate internal conversion, but its efficacy is often mediated through institutional restructuring. By changing the payoff matrix (e.g., establishing a legal monopoly on violence), moral reasoning renders the old practice irrational even for those who still normatively endorse it. To insist that a moral revolution requires the prior extinction of the supporting belief is to misunderstand how norms function as equilibria. The practice can die while the belief lingers, and it is precisely in that gap—where institutions force compliance despite lingering sentiment—that we often see the most tangible evidence of moral reasoning successfully reshaping the material and social world.
