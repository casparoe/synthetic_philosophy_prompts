      *Self-Correction on Scenario:* Make sure it emphasizes the *integration* of color with the background, suggesting the "story" is built after the fact.
      *Self-Correction on Defense:* The Cartesian defender argues for a delay (Stalinesque). If we rule out delay (remove the defensive feature), the Cartesian model predicts the experience should have occurred during the saccade (and been suppressed) or not at all. The Multiple Drafts model says the "draft" was written later.
      *Conclusion:* If the buffer is removed, the Cartesian model cannot explain the data. Does it become change blindness? No. Change blindness is omission. This is commission (false attribution). So it remains distinct.

