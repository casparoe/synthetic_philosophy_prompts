              *   Identify the exact structural feature driving disagreement (e.g., central temporal binding vs. absence thereof).
              *   Explain how a Cartesian defender could dissolve the case (e.g., hidden comparator).
              *   Conclusion: Does removing that defensive feature collapse the case into standard change blindness or keep it distinct?
          *   **Formatting:** Begin *immediately* with the scenario paragraph (no preface).

  2.  **Drafting the Scenario:**
      *   *Goal:* Describe Patient X. Intact V1, damaged parietal lobe (integration issue). Saccade task. Flash during saccade. Report says flash happened after landing, color matches background.
