answer: |-
  The procreation asymmetry is one of those philosophical puzzles that feels intuitive until you stare at it too long. The standard view holds that we have a strong moral duty not to bring suffering people into existence, but no corresponding duty to bring happy people into existence. Pain demands avoidance; pleasure does not demand creation. It's a compelling stance, but it relies on a specific assumption about non-existence: that the unborn are moral zeros.

  Consider a niche framing called "potential-person partialism." This view suggests that merely possible people possess a weak form of moral standing. It isn't enough to compel us to create them—we have no strict obligation to populate the world—but it isn't nothing, either. This standing is dormant, like a seed waiting for water. It only activates if the person actually comes to exist.

  If you accept this premise, the usual asymmetry doesn't just crack; it flips. Under potential-person partialism, we end up with stronger reasons to bring happy people into being than to avoid creating suffering ones.

  Here is the logic. In the standard view, non-existence is a void. If you don't create a happy child, no one is deprived, because there is no "one" to feel the loss. But under potential-person partialism, the possible person has a weak claim—a latent interest in becoming actual. When you choose to create a happy person, you aren't just adding pleasure to the universe; you are activating that standing. You are turning a dormant claim into a full-bodied moral agent who can endorse their own existence. That activation generates a surplus of moral value. The happy person exists, their standing activates, and their life becomes a net positive contribution to the moral landscape.

  Now look at the other side: avoiding the creation of a suffering person. In the standard view, this is a major moral victory. In this framing, it is merely a maintenance of dormancy. If you refrain from creating a suffering child, the weak standing of that possible person never activates. There is no moral agent to feel relief, no rights-bearer to claim they were spared. The moral weight of that decision is limited to the absence of a negative, but it produces no positive moral substance.

  This is where the flip happens. The reason to create happy people is strengthened by the *activation* of standing. You are moving a potential moral claim into actuality, creating a being who validates their own existence. The reason to avoid creating suffering people is weakened because it leaves the moral claim dormant. You aren't saving anyone; you are just keeping the ledger blank.

  Think of it like a vote that only counts if cast. A happy person casts a strong "yes" vote that adds to the collective good. A suffering person casts a strong "no" vote that subtracts from it. But the decision not to create anyone leaves the ballot uncast. Under potential-person partialism, the moral system values the casting of the "yes" vote more than it values the preservation of the uncast ballot. The activation of standing creates moral reality; non-creation preserves moral silence.

  Consequently, the pressure shifts. We are no longer paralyzed by the fear of causing harm to those who might exist, because the primary moral good is found in the actualization of standing itself. Creating a happy life fulfills the latent promise of that weak standing. Avoiding a suffering life merely leaves that promise unfulfilled. Since fulfillment carries more moral weight than omission, the scales tip. We have a stronger reason to build the world where standing is activated and valued than to preserve the world where it remains silent.

  This doesn't mean we should create suffering. It means that the moral urgency lies in creation, not restraint. If possible people have even a whisper of standing, then bringing them into a life they will love amplifies that whisper into a voice. Leaving them unborn keeps them silent. In a moral universe that values voices over silence, the reason to create happiness outweighs the reason to avoid the risk of suffering. The asymmetry reverses: existence is the mandate, because existence is where moral standing wakes up.
