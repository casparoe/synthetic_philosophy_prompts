      *   *Why Time isn't enough:* Sunset clauses assume knowledge decays or preferences change uniformly over time. But knowledge can leap. A 50-year lock might hold through a period of stagnation but break right before a scientific/philosophical breakthrough. Time is a proxy for change, but a bad one.
