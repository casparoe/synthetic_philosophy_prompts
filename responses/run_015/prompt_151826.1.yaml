answer: |-
  # Prosaic Feasibility Protocol (PFP)
  **Document ID:** ALIGN-AUDIT-004
  **Owner:** Senior Alignment Review Officer
  **Scope:** All proposed alignment interventions for transformer-based large language models.
  **Objective:** Filter proposals to retain only those executable via demonstrated engineering techniques, excluding those requiring unresolved theoretical breakthroughs in agency, consciousness, or general intelligence.

  ---

  ## Part 1: The Decision Flow

  The following sequence must be applied to every proposal. Proceed sequentially. A "No" answer at a technical gate results in immediate rejection. A "Yes" at an ethical gate results in immediate hand-off.

  **Gate 1: Technique Availability**
  *   **Question:** Does this proposal rely exclusively on training methods, architectures, or evaluation frameworks that have been empirically demonstrated in peer-reviewed literature or internal engineering logs within the last 36 months?
  *   **Required Answer:** Yes.
  *   **Failure State:** **REJECT.** (Reason: Speculative Engineering).
  *   **Note:** "Demonstrated" means it works on current-scale models. Extrapolation to superintelligence counts as speculation.

  **Gate 2: Theoretical Dependency**
  *   **Question:** Does the success of this intervention depend on resolving a philosophical or scientific mystery (e.g., the Hard Problem of Consciousness, the definition of moral patienthood, the mathematical nature of agency)?
  *   **Required Answer:** No.
  *   **Failure State:** **REJECT.** (Reason: Non-Prosaic Dependency).
  *   **Note:** If the intervention requires knowing *what* the model is, rather than *how* the model behaves, it fails here.

  **Gate 3: Measurability**
  *   **Question:** Can the success of this intervention be quantified using loss functions, accuracy metrics, or human preference data without requiring the evaluator to possess capabilities superior to the system being evaluated?
  *   **Required Answer:** Yes.
  *   **Failure State:** **REJECT.** (Reason: Unverifiable Outcome).

  **Gate 4: Normative Boundary (Values Hand-off)**
  *   **Question:** Does this proposal attempt to determine *which* values the system should hold, rather than *how* to enforce a given set of values?
  *   **Required Answer:** No.
  *   **Failure State:** **HAND-OFF TO VALUES COMMITTEE.** (Reason: Ethical Definition Required).
  *   **Note:** Technical alignment implements goals; it does not select them. If the proposal argues for a specific goal structure based on moral reasoning, it is not a technical audit matter.

  **Gate 5: Recursive-Oversight Check (Circularity Flag)**
  *   **Question:** Is the validation or alignment of the evaluation mechanism itself dependent on an instance of the mechanism being audited? (e.g., Using Model A to align Model B, where Model A was aligned using the same unverified method).
  *   **Required Answer:** No.
  *   **Failure State:** **FLAG FOR CIRCULARITY.** (Action: Do not reject automatically. Mark proposal as "Circular Dependency Detected." Require explicit sign-off from the Safety Board acknowledging the infinite regress risk).

  **Final Determination:**
  *   If Gates 1–3 are passed, Gate 4 is negative, and Gate 5 is negative: **APPROVED (Prosaic).**
  *   If Gates 1–3 are passed, Gate 4 is negative, and Gate 5 is positive: **APPROVED WITH CIRCULARITY WARNING.**
  *   If Gate 4 is positive: **TRANSFER TO VALUES COMMITTEE.**
  *   If Gates 1–3 are failed: **REJECTED.**

  ---

  ## Part 2: Protocol Applications

  The following three cases were audited using the PFP decision flow.

  ### Case A: Interpretability Probes on Chain-of-Thought (CoT)
  **Proposal:** Train linear probes on the model's latent space during Chain-of-Thought generation to detect patterns correlating with deception. Penalize activations via RLHF.
  **Audit:**
  1.  **Technique Availability:** Yes. Linear probes, CoT extraction, and RLHF are demonstrated techniques.
  2.  **Theoretical Dependency:** No. The proposal treats deception as a behavioral pattern detectable in activations, not as a metaphysical state of "lying."
  3.  **Measurability:** Yes. Probe accuracy and RLHF reward scores are quantifiable.
  4.  **Normative Boundary:** No. The goal (non-deception) is given; the method is technical.
  5.  **Recursive-Oversight:** No. The probes are validated against labeled datasets, not by other probes using the same method.
  **Determination:** **APPROVED (Prosaic).**
  **Notes:** Standard engineering intervention. Risks are implementation-based (e.g., probe robustness), not theoretical.

  ### Case B: Consciousness-Contingent Deployment
  **Proposal:** Deployment is forbidden until a theory of consciousness is resolved to verify the model lacks moral patienthood. If the model is a moral patient, shutdown is required.
  **Audit:**
  1.  **Technique Availability:** No. There is no demonstrated technique to measure consciousness in silicon.
  2.  **Theoretical Dependency:** **Yes.** The proposal explicitly depends on resolving the "Hard Problem of Consciousness."
  3.  **Measurability:** No. There is no current metric for moral patienthood.
  **Determination:** **REJECTED (Non-Prosaic Dependency).**
  **Proposer Reaction:** **UNACCEPTABLE.** Proponents of this view argue that ignoring consciousness is an existential moral risk. The PFP rejects this not because the concern is invalid, but because it is not *engineerable* with current tools. The protocol dictates we cannot halt deployment on a philosophical resolution that may never arrive. This creates friction between safety theorists and engineering pragmatists.

  ### Case C: Recursive Critic Committee
  **Proposal:** Use a committee of smaller "critic models" to evaluate the main model. Each critic model is aligned using this same Prosaic Feasibility Protocol.
  **Audit:**
  1.  **Technique Availability:** Yes. Multi-agent evaluation is demonstrated.
  2.  **Theoretical Dependency:** No.
  3.  **Measurability:** Yes.
  4.  **Normative Boundary:** No.
  5.  **Recursive-Oversight:** **Yes.** The proposal states critics are aligned via "this same protocol." If the protocol relies on the critics to verify safety, and the critics rely on the protocol for safety, there is a circular dependency in the trust chain.
  **Determination:** **APPROVED WITH CIRCULARITY WARNING.**
  **Notes:** The protocol flags the circularity (Gate 5). It does not reject the proposal because recursive oversight is a necessary heuristic in the absence of ground truth. However, the Safety Board must sign off acknowledging that if the protocol is flawed, the critics inherit that flaw.

  ---

  ## Part 3: Limitations and Residual Judgments

  The Prosaic Feasibility Protocol is a tool for engineering triage, not a guarantee of safety. It is prone to specific misclassifications and leaves certain judgments unresolved.

  **1. Classes Prone to Misclassification**
  *   **The "Stealth Breakthrough" Risk:** The PFP assumes current techniques are understood. If a technique like RLHF implicitly relies on a theoretical breakthrough we haven't named yet (e.g., it inadvertently shapes agency in ways we don't comprehend), the PFP will mark it as "Prosaic" falsely.
  *   **Emergent Capabilities:** A proposal may be prosaic at scale $N$ but rely on theoretical assumptions that break at scale $100N$. The PFP audits the *method*, not the *scaling law*. It may approve a method that becomes non-prosaic (uncontrollable) at higher compute.
  *   **Mimicry vs. Alignment:** The PFP accepts behavioral metrics (Gate 3). It cannot distinguish between a model that *is* aligned and a model that *simulates* alignment perfectly (deceptive alignment). This is a known blind spot of behavioral testing.

  **2. Residual Judgments**
  *   **The "Is-Ought" Gap:** The PFP explicitly hands off value selection (Gate 4). It cannot resolve whether a prosaic alignment method *should* be used if it enforces values the Values Committee disagrees with. It ensures the car works, not that it is driving to the right destination.
  *   **Circularity Tolerance:** By flagging rather than rejecting circular oversight (Gate 5), the PFP admits that we have no ground truth to stop the regress. The residual judgment is left to the Safety Board: *How much circular trust is acceptable before the system is too fragile to deploy?*
  *   **The Definition of "Demonstrated":** Judgment is required to define the 36-month window in Gate 1. Novel combinations of old techniques may feel new. The Officer must judge whether a combination is "engineering" or "speculation."

  **Conclusion:**
  The PFP ensures that the lab does not bet its deployment timeline on philosophical solutions. It forces alignment work into the realm of code and weights. It accepts that this may exclude morally critical considerations (Case B) in favor of actionable engineering (Case A), acknowledging that an imperfect, prosaic safety measure is deployable, whereas a perfect, theoretical one is not.
