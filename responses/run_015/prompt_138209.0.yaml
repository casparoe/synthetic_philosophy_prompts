answer: |-
  ### Preface: A Warning on the Instrument's Calibration

  You have asked for a decision tree built from logical space, using the vocabulary of experimental physics to map philosophical positions on introspection. I can build this instrument, but I must register a significant calibration error in the framing before we proceed.

  **The "Detector" Assumption:** Your specification sheet metaphor assumes that introspection is a *unitary measurement process* with a distinct signal and noise profile. Many of the positions you wish to map (specifically Transparency and Agentialism) deny this premise. They argue that self-knowledge of attitudes is not a matter of *detection* at all, but of *constitution* or *commitment*. To force these views into a tree designed to measure "reliability" and "failure modes" risks categorizing them as "failed detection" theories rather than "non-detection" theories.

  **The "Ground Truth" Problem:** In physics, reliability is determined by calibration against an independent standard. In introspection, there is no independent standard for the first-person case. When we ask "Is the pain really gone or just unattended?" (Case 5), there is no voltmeter for pain. The answers your group gives will not be empirical findings but *pre-theoretical intuitions*. This instrument will not discover the truth; it will sort your group's existing commitments.

  **The Independence Assumption:** The tree assumes the Channels (Gross, Fine, Attitudes) and Failure Modes (Drift, Confabulation, Perturbation) are separable. Some philosophical views hold they are not (e.g., that fine-grained character is constituted by the vocabulary used to report it).

  If you accept that this is a **dialectical sorting tool** rather than a **truth-tracking device**, the instrument below is viable. It is designed to expose where your group's disagreements lie: in the data (the cases) or in the model (the interpretation).

  ***

  ### The Routing Instrument: Introspection Specification Tree

  **Instructions:** Answer the following eight nodes. For binary nodes, choose **Y** (Yes/Positive) or **N** (No/Negative). For ternary nodes, choose **A**, **B**, or **C**. Record your vector (e.g., `Y, N, A...`) and consult the Routing Key.

  #### Section A: Channel Specifications (The Signal)

  **Node 1 [Channel: Gross Presence / Failure: Saturation]**
  *Case 5 (Pain/Absorption):* A subject reports constant pain for years. During a demanding task, they report no pain. Later, they say the pain was "still there but ignored."
  *   **Q:** Is the subject's report during the task **false** (the signal was present but not accessed), or **true** (the signal was functionally absent)?
      *   **Y:** False. The pain signal persisted; access failed. (Indicates Realism about the signal).
      *   **N:** True. The pain experience ceased or was suspended. (Indicates Construction/State-Dependence).

  **Node 2 [Channel: Fine-Grained / Failure: Measurement Perturbation]**
  *Case 1 (Attention/Amplification):* A faint sensation at the edge of attention becomes vivid when attended to.
  *   **Q:** Does the act of attending **alter the state measured** (create/amplify the sensation), or merely **alter the gain** (reveal what was fixed)?
      *   **Y:** Alters the state. (Measurement Perturbation).
      *   **N:** Alters the gain. (Passive Detection).

  **Node 3 [Channel: Standing Attitudes / Failure: Confabulation]**
  *Case 4 (Reasons/Choice):* A subject explains why they chose Item A over Item B. Subsequent evidence suggests the reason is doubtful.
  *   **Q:** Was the subject reporting a **pre-existing causal state** (a belief/desire that caused the choice), or **constructing a rationale** post-hoc?
      *   **Y:** Pre-existing causal state. (Detection Model).
      *   **N:** Constructing a rationale. (Interpretation/Confabulation Model).

  **Node 4 [Channel: Standing Attitudes / Authority Type]**
  *General:* When you say "I believe it will rain," do you have authority because you **observe** your mind, or because you **commit** to the rain?
  *   **Q:** Is first-person authority **epistemic** (I see it better than you), or **constitutive** (My saying it makes it so)?
      *   **Y:** Epistemic. (Observation/Detection).
      *   **N:** Constitutive. (Transparency/Agentialism).

  #### Section B: Failure Mode Specifications (The Noise)

  **Node 5 [Failure: Discriminability / Learning]**
  *Case 3 (Training/Vocabulary):* A wine taster or clinician acquires fine sensory vocabulary and discriminates what they previously could not.
  *   **Q:** Did training improve the **sensory resolution** (discriminability), or merely the **labeling agreement** (criterion)?
      *   **Y:** Improved resolution. (Inner-Sense/Perceptual).
      *   **N:** Improved labeling. (Conceptualist/Linguistic).

  **Node 6 [Failure: Criterion / Feedback]**
  *Case 2 (Biofeedback):* A subject is shown a physiological readout (e.g., skin conductance) and asked to report anxiety again.
  *   **Q:** Does the feedback help the subject **detect the signal more accurately**, or merely **shift their reporting threshold** (e.g., "I guess this counts as anxiety")?
      *   **Y:** Detect more accurately. (Calibration possible).
      *   **N:** Shift threshold. (Criterion bias only).

  **Node 7 [Channel: Gross Presence / Failure: Null Signal]**
  *General:* Can a sincere subject be wrong about whether they are having *any* experience at all (e.g., report pain when there is none)?
  *   **Q:** Is gross phenomenal presence **incorrigible** (immune to error), or **fallible**?
      *   **Y:** Incorrigible. (Cannot misfire).
      *   **N:** Fallible. (Can misfire).

  **Node 8 [Failure: Scope of Confabulation]**
  *General:* If reports of causes (Node 3) are inferences, are reports of *current experience* also inferences?
  *   **Q:** Does the risk of confabulation extend to **phenomenal character** (what it feels like), or is it restricted to **causal explanation**?
      *   **Y:** Extends to character. (Global Pessimism/Interpretation).
      *   **N:** Restricted to causes. (Local Fallibilism).

  ***

  ### Routing Key

  Map your 8-answer vector to the Leaves below. Note that many theoretical positions cluster on specific answer profiles.

  | Leaf | Position Name | Required Vector Profile (Simplified) | Logical Status |
  | :--- | :--- | :--- | :--- |
  | **L1** | **Incorrigibilist** | N1=Y, N7=Y, N4=Y, N3=Y | **Occupied** (Classic Cartesian) |
  | **L2** | **Inner-Sense** | N1=Y, N2=N, N5=Y, N6=Y, N7=N | **Occupied** (Armstrong/Lycan) |
  | **L3** | **Transparency** | N4=N, N3=N, N1=Y | **Occupied** (Evans/Moran) |
  | **L4** | **Self-Interpretation** | N3=N, N8=Y, N1=Y | **Occupied** (Nisbett/Wilson) |
  | **L5** | **Global Pessimist** | N7=N, N8=Y, N1=N | **Occupied** (Schwitzgebel) |
  | **L6** | **Unnamed** | N1=N, N2=Y, N5=N, N7=N | **Unoccupied** (See Note) |
  | **L7** | *Empty Cell* | N1=Y, N2=Y, N5=N, N7=Y | **Incoherent** (See Note) |
  | **L8** | *Empty Cell* | N4=Y, N3=N, N8=N | **Unattractive** (See Note) |

  ***

  ### Leaf Specifications & Commitments

  **L1: Incorrigibilist (The Cartesian Baseline)**
  *   **Commitments:** Gross presence (pain, sensation) is immune to error (N7=Y). Standing attitudes are detected objects (N4=Y).
  *   **Epistemic Marker:** *Highly Contested.* Most contemporary philosophers reject N7=Y.
  *   **Physics Analog:** A perfect null-detector with zero false positives.

  **L2: Inner-Sense (The Perceptual Model)**
  *   **Commitments:** Introspection is a scanner. It is fallible (N7=N) but calibratable (N6=Y). Training improves resolution (N5=Y). Attention reveals rather than creates (N2=N).
  *   **Epistemic Marker:** *Moderately Contested.* Plausible for sensation, less so for belief.
  *   **Physics Analog:** A noisy sensor with a specifiable signal-to-noise ratio that improves with calibration.

  **L3: Transparency / Agentialist (The Non-Detection Model)**
  *   **Commitments:** Authority over attitudes is constitutive, not epistemic (N4=N). We look through the mind to the world. Reports of reasons are often constructions (N3=N).
  *   **Epistemic Marker:** *Dominant in Philosophy of Mind.* Rejects the "Detector" framing entirely for attitudes.
  *   **Physics Analog:** Not a sensor; a control loop. The reading sets the state.

  **L4: Self-Interpretation (The Confabulation Model)**
  *   **Commitments:** Causal reports are inferences from behavior (N3=N). This confabulation risk can extend to experience (N8=Y), but usually, gross presence is safe (N1=Y).
  *   **Epistemic Marker:** *Empirically Supported.* Strong evidence from social psychology (Case 4).
  *   **Physics Analog:** A system that logs output data and reverse-engineers the input cause, often incorrectly.

  **L5: Global Pessimist (The Skeptic)**
  *   **Commitments:** Even gross presence is fallible (N7=N). Absorption can eliminate pain (N1=N). Confabulation is ubiquitous (N8=Y).
  *   **Epistemic Marker:** *Minority but Growing.* Challenges the "givenness" of experience.
  *   **Physics Analog:** A sensor with unknown drift and no reliable null state.

  **L6: Unnamed (The Phenomenal Constructivist)**
  *   **Commitments:** Attention creates the state (N2=Y). Training is just labeling (N5=N). Gross presence is fallible (N7=N). Pain vanishes when unattended (N1=N).
  *   **Status:** *Logically Possible, Unoccupied.* This view holds that fine-grained experience is literally brought into existence by the conceptual act of attending. Few hold this for *gross* pain (N1=N) while denying training effects (N5=N).
  *   **Physics Analog:** The measurement event collapses the wavefunction; without measurement, the property is undefined.

  **L7: Empty Cell (The Incoherent Realist)**
  *   **Profile:** Gross presence is incorrigible (N7=Y), BUT attention alters the state measured (N2=Y).
  *   **Status:** *Incoherent.* If attention alters the state, you cannot claim incorrigibility about the pre-attentive state. You are measuring a moving target with a fixed ruler.
  *   **Physics Analog:** Claiming a voltmeter never lies, while admitting the act of connecting it changes the voltage.

  **L8: Empty Cell (The Epistemic Dualist)**
  *   **Profile:** Attitudes are observed (N4=Y), BUT reports of reasons are not causal (N3=N), AND confabulation doesn't touch experience (N8=N).
  *   **Status:** *Unattractive/Unstable.* If attitudes are observed objects, reports of their causes should be subject to the same detection limits as the objects themselves. Separating the two requires an ad-hoc barrier.
  *   **Physics Analog:** Trusting the sensor's voltage reading but distrusting its logged timestamp, without a mechanical reason for the difference.

  ***

  ### Post-Measurement Critique

  **1. The Independence Assumption:**
  This tree treats Node 1 (Pain/Absorption) and Node 2 (Attention) as independent. A specialist might argue they are the same phenomenon: if attention constitutes the state (Node 2=Y), then absorption removing attention *must* remove the state (Node 1=N). If your group answers N1=Y and N2=Y, they have entered **Leaf L7 (Incoherent)**. This is a feature, not a bug: it forces them to resolve the contradiction.

  **2. The "Detector" Vocabulary Limit:**
  Notice **Leaf L3 (Transparency)**. To fit it into this tree, I had to code "Constitutive Authority" as a "No" on an epistemic question. This inevitably makes Transparency look like a *failure* of detection (N4=N) rather than a *different kind of relation*. A specialist would dispute that Node 4 is even a meaningful question for this position. The instrument forces a square peg (normative authority) into a round hole (epistemic reliability).

  **3. The Calibration Loop:**
  Node 6 (Biofeedback) assumes there is a "true accuracy" to be had. If **Leaf L5 (Global Pessimist)** is correct, the physiological readout is just another data stream subject to interpretation, not a ground truth. The tree assumes third-person data calibrates first-person data. A phenomenologist would reject this calibration hierarchy.

  **Recommendation for the Group:**
  Do not use this tree to find the "correct" leaf. Use it to find where your vectors diverge. If half the group lands in **L2** and half in **L3**, do not argue about the cases. Argue about **Node 4**: Is self-knowledge *seeing* or *deciding*? That is the root distinction; the cases are merely symptoms.
