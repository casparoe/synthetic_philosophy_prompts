answer: |-
  1. **The Examination Question**

  In 2148, the "Meridian Trace" is opened: a complete, authenticated record of a 2031 garrison withdrawal. Nothing is lost or disputed (trace-completeness). Two historians use it. One writes *The Meridian Decision* (a tragedy); the other *Meridian: A Farce of Logistics* (a farce). They agree on every particular fact. A third publishes a paratactic chronology of the whole trace; nobody regards it as history, yet it adds nothing to the trace. A fourth notes both rivals share an unargued framework (nation-state agency; one week).

  Using the concepts of historical objectivity studied in this course, assess whether the disagreement between the tragedy and farce accounts is resolvable. Does the Trace's constraint on emplotment suffice to distinguish history from fiction? Define what "objectivity" could mean here if correspondence to the trace is insufficient. (If relevant, consider whether recovering the past "as it actually happened" is possible when the "actually" concerns form rather than fact.)

  ***

  2. **Model Answer**

  The Meridian case demonstrates that factual accuracy is necessary but insufficient for historical objectivity. Since both historians agree on every particular fact within the Trace, a correspondence theory of objectivity—matching statements to reality—cannot distinguish the tragedy from the farce. Both correspond perfectly to the data. Similarly, impartiality fails as a criterion; both narratives are partial, shaped by generic conventions (tragedy vs. farce) rather than neutral mirroring. If objectivity exists here, it must be procedural or relational.

  We must distinguish three construals of objectivity. First, *ontological objectivity* (the past exists independently) is secured by the Trace but does not dictate the story. Second, *methodological objectivity* (intersubjective reproducibility) is satisfied by both historians; they follow the evidence. Third, *relational objectivity* (Carr) suggests facts become historical only when selected for a purpose. The Meridian disagreement arises here: the selection is identical, but the *significance* assigned differs. The tragedy sees necessity in failure; the farce sees contingency. This is not a dispute about what happened, but about what the happening *means*.

  Is this dispute truth-apt? Yes, but not in the way factual claims are. It is settled not by finding new facts—the Trace is complete—but by explanatory scope and coherence. If the tragedy accounts for the supply network's collapse while the farce ignores it, the tragedy offers a superior explanation, even if both fit the facts. However, the fourth historian's observation complicates this: both rivals accept the nation-state as the agent. If the supply network caused the withdrawal, both narratives might be false because their framework is wrong. Objectivity, therefore, requires reflexivity about the frame, not just the facts.

  Does the Trace's constraint distinguish history from fiction? Yes, but negatively. The Trace excludes emplotments that contradict the data (e.g., a comedy where everyone survives), but it does not determine the correct emplotment. This "constraint without determination" is the residue of objectivity. It prevents history from being fiction, where the author invents facts, but it admits multiple valid narratives.

  To maintain this position, a defender of historical objectivity must give up the claim that there is only one true story of the past. The Rankean ideal of showing the past "as it actually happened" must be revised: we can know the facts as they happened, but not the story as it actually happened, because the past itself possesses no narrative form. Conversely, a White-style sceptic must give up the claim that emplotment is purely arbitrary. The Trace constrains the historian; one cannot legitimately emplot a genocide as a comedy. Evidence exerts a negative pressure on narrative.

  Therefore, objectivity in the Meridian case consists in the disciplined acknowledgment of these constraints. It is not the elimination of perspective, but the rigorous testing of perspectives against the Trace and against alternative frameworks (like the supply network). The paratactic chronologist adds nothing because history requires selection; the rivals add meaning because they select. Objectivity survives not as a mirror of the past, but as a transparent account of how the Trace is transformed into history. It is a commitment to justify the emplotment, knowing the evidence permits several but not all. This preserves the distinction from fiction without promising a single, God's-eye view of the past.

  ***

  3. **Marking Scheme (20 Marks)**

  | Move | Requirement (4 marks) | Failure Mode (0–2 marks) |
  | :--- | :--- | :--- |
  | **1. Diagnosis of the Meridian Problem** | Identifies that the disagreement is not about *facts* (which are agreed) but about *significance/emplotment* (meaning derived from same data). | Treats the disagreement as a factual dispute (e.g., "one must be wrong about the events") or ignores the Trace's completeness. |
  | **2. Differentiation of Objectivity** | Distinguishes at least three construals (e.g., Correspondence, Impartiality, Procedural/Relational) and shows why some fail in this case. | Lists definitions of objectivity without applying them to the case, or conflates factual accuracy with narrative truth. |
  | **3. Verdict on Truth-Aptness** | Argues clearly whether the tragedy/farce dispute is truth-apt (e.g., "yes, regarding explanatory power") and proposes a criterion for settling it. | Claims the dispute is purely subjective ("just opinion") or insists it is factually resolvable despite the Trace's completeness. |
  | **4. Objectivist Concession** | Names specifically what a traditional objectivist must surrender (e.g., the "one true story" or narrative realism). | Vaguely suggests objectivists need to "try harder" or fails to identify a theoretical cost to their position. |
  | **5. Sceptic Concession** | Names specifically what a White-style sceptic must surrender (e.g., the claim that evidence does not constrain emplotment). | Portrays the sceptic as entirely correct or fails to acknowledge the negative constraint exerted by the Trace. |
