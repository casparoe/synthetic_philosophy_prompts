  You should reject **Step 7**.

  Step 7 states: *"Decisions should be responsive to reasons, and influence that works by supplying reasons... is permissible however unequally it is distributed."*

  This is the pivot point where your friend's argument shifts from a plausible description of free speech to an indefensible conclusion about democratic equality. If you break the chain here, you can keep Steps 2 and 3 (money creates a defect), preserve the core of Step 1 (officials should respond to reasons/interests), and still draft rules that condemn your opponent's spending without silencing unions or newspapers.

  ### Why Step 7 Looked Fine
  Step 7 appeals to a powerful liberal intuition: the **Marketplace of Ideas**. It sounds like a defense of the expert, the activist, and the truth-teller. It suggests that if a scientist has better data, or a newspaper has better arguments, they *should* have more influence, regardless of how unequal that influence is. It frames regulation as an attack on the *quality* of public discourse. Since you want officials to respond to "reasons" (Step 1), it seems consistent to allow the best reasons to win, no matter who brings them.

  ### Why Step 7 Breaks
  Step 7 conflates **epistemic authority** (who knows best) with **political authority** (who gets to decide). In a democracy, political authority is rooted in the principle of **Political Equality** (One Person, One Vote), not in the magnitude of resources one can deploy.

  Step 7 assumes that the "distribution of reasons" is organic. But in modern elections, money does not just distribute reasons; it purchases **amplification**. It allows one actor to occupy the informational space of a thousand citizens. When the distribution of influence is determined by capital rather than constituent support, it violates the baseline equality required for the "interests of the people" (Step 1) to be accurately aggregated.

  If you accept Step 7, you concede that a billionaire has a democratic right to drown out the combined voice of ten thousand voters simply because he can afford more airtime. That is not a marketplace of ideas; it is a market *of* ideas, where speech is a commodity.

  ### How Rejecting Step 7 Saves Your Case
  By rejecting Step 7, you replace the friend's "Unrestricted Persuasion" principle with a **"Political Equality"** principle. You can argue:

  > *Influence supplying reasons is permissible, **provided the capacity to influence bears a reasonable relationship to the number of citizens represented.** *

  This allows you to condemn what happened in your race without condemning the newspaper or the union. Here is the distinction you present to the commission:

  1.  **The Self-Funded Opponent (Condemned):** Their 8x spending disparity was not an aggregation of citizen will. It was a deployment of private capital. The "reasons" in their mailers were not amplified because they were better or represented more people; they were amplified because one person had a deep wallet. This violates political equality.
  2.  **The Union Phone Bank (Permitted):** A union's influence is constrained by its membership. It cannot make more calls than it has members to make. Its amplification is **derivative** of citizen will. If it wants more influence, it must persuade more workers to join. This aligns with political equality.
  3.  **The Newspaper Endorsement (Permitted):** A newspaper's influence is constrained by its readership. It cannot force people to read its editorials. Its reach is **organic**, based on the voluntary attention of citizens. While a billionaire could buy a newspaper, the *editorial* influence remains distinct from *campaign expenditure* because it is institutional speech protected to ensure a diversity of viewpoints, whereas campaign spending is transactional advocacy for power.

  ### What This Costs You
  You must concede that your "Responsiveness Principle" (Step 1) is not enough on its own. You cannot just say "officials should listen to reasons." You must add: **"officials should listen to reasons weighted by citizen support, not capital."**

  This shifts your commission's work from defining "corruption" (which implies a quid pro quo, as your friend wants) to defining **"electoral fairness."** You are not regulating speech; you are regulating the *volume knob* on speech to ensure no single private resource can override the collective voice of the constituency.

  ### A Better Test Than the "Swap Test"
  Your friend was right that the "Swap Test" (would the official vote the same if money went to the other side?) fails. It is counterfactual and unknowable.

  Instead, use the **Source of Authority Test**:
  *   **Question:** Does the influence derive from the aggregation of *constituents* (voters, members, readers) or the deployment of *capital* (wealth, assets)?
  *   **Verdict:** Influence derived from constituents is legitimate democratic persuasion. Influence derived from capital, when it exceeds the amplification capacity of the constituents it claims to represent, is illegitimate leverage.

  ### Summary for the Commission
  When you meet next month, do not argue that money is "bribery." Argue that **democracy requires a baseline of equality in the capacity to be heard.**

  *   **Step 7 is false** because unlimited inequality in political communication converts political rights into economic commodities.
  *   **Step 2 and 3 remain true** because money distorts responsiveness away from voter interests toward donor capacity.
  *   **The Remedy** is not to silence unions or papers (whose influence is capped by human organization), but to cap the *expenditure* that allows private wealth to simulate mass support.

  This allows you to draft contribution limits, expenditure caps, or public matching funds (which amplify small donations to match large ones) without running afoul of the legitimate influence of civic organizations. You are protecting the "responsiveness to reasons" (Step 1) by ensuring those reasons come from people, not pockets.
