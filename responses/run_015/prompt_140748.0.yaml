          *   Is the feeling of openness an illusion? From the "view from nowhere" (the block), yes, it's fixed. From the "view from within" (the committee's consciousness moving along the worm), no, it's genuinely experienced as open.
          *   Flagging Illicit Assumptions: Avoid saying "before the deliberation happens." In the block, the deliberation *is* a location. Say "at the earlier end of the committee's worldline."
          *   Map vs. Territory: The "openness" is a feature of the territory (conscious experience), but the "fixedness" is a feature of the geometry. They coexist.
