answer: |-
  This is a profound spot to be in, and it makes complete sense that dating someone deep in evolutionary psychology would trigger this specific kind of vertigo. You're essentially facing the "Darwinian Dilemma" head-on: if our minds are built for survival, why trust them for truth—especially moral truth?

  If we bring Charles Darwin into a modern metaethics seminar, based on his writings (particularly *The Descent of Man*) and his general mode of reasoning, here is where I think he would land.

  **1. On the Debunking Argument: He'd Agree with the Premise, Reject the Conclusion**
  Darwin would likely nod along with the first half of the evolutionary debunking argument. He was explicit that our moral instincts are contingent on our evolutionary history. He famously speculated that if humans had been raised like hive-bees, our moral duties would be entirely different—we would feel it was a sacred duty to kill our unmarried sisters.

  He would concede that our moral intuitions do not track "Platonic" moral truths floating in a non-natural realm. In that specific sense, he would agree that evolution debunks *robust* moral realism (the idea that morality exists independently of sentient beings).

  However, he would likely reject the skeptical conclusion that this undermines *all* normative authority. For Darwin, the fact that something is an adaptation doesn't make it "false"; it makes it functional. He wouldn't see the evolutionary origin of sympathy as a reason to distrust it, but rather as the explanation for why it exists. To Darwin, the "authority" of morality comes from the intensity of the social instinct. When you ignore it, you feel misery; when you follow it, you feel satisfaction. That psychological reality is authoritative enough for a naturalist.

  **2. On Moral Realism: He'd Be a Naturalistic Realist, Not a Platonist**
  Darwin wouldn't lose sleep over the idea that morality isn't "cosmically" real. He would likely argue that moral facts are real in the same way medical facts are real. "Health" isn't a mystical property; it's a state of functioning well for a specific organism. Similarly, "morality" is a state of functioning well for a social organism.

  He would likely view moral truths as facts about what allows human communities to flourish and persist. So, he wouldn't see his account as incompatible with realism, but he would redefine realism. He'd shift the ground from "Does this match the Universe's command?" to "Does this match the requirements of human social flourishing?"

  **3. On the "Cooperation Patterns" Escape Route**
  This is the niche angle you mentioned—the idea that moral facts are just stable patterns in cooperative behavior. I think Darwin would find this incredibly convincing. It aligns perfectly with his view that the "general good" is the ultimate standard.

  He would likely argue that this doesn't water morality down into mere sociology. Instead, it grounds it. If morality is just a set of behavioral patterns that enable complex cooperation, then moral claims are testable hypotheses: *Does this norm increase group cohesion? Does it reduce internal conflict?*

  He would probably push back against the idea that "descriptive" equals "weak." For Darwin, the fact that a moral norm is descriptively necessary for survival gives it immense normative weight. If you want to live in a society (and our instincts compel us to), you *ought* to follow the rules that sustain it. The "ought" is hypothetical but inescapable for beings like us.

  **4. The Risk of Unfalsifiability**
  This is your sharpest point. If morality is just "what works for cooperation," do we risk a tautology where whatever survives is defined as "good"?

  Darwin would be aware of this risk. He believed in moral *progress* (specifically, the expansion of sympathy to include all races, nations, and eventually animals). This suggests he didn't think *any* stable cooperative system was equally good. He seemed to believe that broader sympathy was objectively better than narrower sympathy.

  However, he might struggle to justify *why* broader sympathy is better without appealing to a utilitarian metric of happiness. If a tyrannical society is highly cooperative and stable (like a beehive or a totalitarian state), is it morally good? Darwin would likely say no, because it stifles the individual intellect and social instincts that make us human.

  He would argue his view is falsifiable in the long run: moral systems that rely on cruelty or extreme repression tend to generate internal friction and eventually collapse or cause misery. But he would have to admit that this is a messy, historical falsifiability, not a clean logical one.

  **The Verdict**
  If Darwin were here today, I suspect he would be unfazed by the debunking arguments. He would tell you that looking for a "cosmic" authority for morality is a category error. He would argue that morality is real, authoritative, and binding precisely *because* it is woven into our biological nature.

  He would likely tell you that the feeling of obligation you have is not a trick; it's a feature. The fact that it was selected for doesn't make it a fiction; it makes it a fundamental part of what we are. He would probably advise you not to worry about whether morality tracks something "outside" nature, because for a human being, there is no "outside." We are nature, and our morals are the rules of our own survival and flourishing.

  It's a less comforting view than believing in cosmic justice, but it's a more robust one. It suggests your moral beliefs aren't fragile fictions; they are the operating system of your species.
