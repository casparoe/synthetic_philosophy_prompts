          *   *Major Error:* "This does mean Hume has no room for a work that everyone ignored when it appeared being recognised as great later on." This is factually incorrect regarding Hume's view. Hume explicitly allows for the recovery of lost genius (e.g., his discussion of Ogilby vs. Milton, or the general principle that true judges might be rare or absent in a specific era). The "verdict of the day" isn't the final word; the "verdict of true judges across time" is. If there were no true judges *then*, the verdict wasn't established *then*.
