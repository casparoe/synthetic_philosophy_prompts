      *   *Ledger Distinctions:* Explicitly mention System vs. Controller vs. Memory.
      *   *Honesty:* Acknowledge that without literature, the examiner is guessing on quantum/strong-coupling edge cases.

  7.  **Final Polish:**
      *   Tone: Professional, procedural, authoritative but humble about limits.
      *   Formatting: Clear headers, numbered lists, bold text for emphasis.
      *   Check against prompt: Did I include the ledger? Yes. The bound? Yes. The three cases? Yes. The limitations? Yes.

