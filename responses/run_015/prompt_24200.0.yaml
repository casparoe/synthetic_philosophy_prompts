answer: |-
  # PROCEDURE FOR EXAMINATION OF INFORMATION-ENGINE CLAIMS
  **Art Unit:** Energy/Thermodynamics  
  **Subject:** Devices Claiming Thermodynamic Advantage via Information Processing  
  **Constraint:** Examiner has no access to external literature; decision must rely on application disclosure and fundamental accounting.

  ---

  ## PART I: THE MANDATORY LEDGER
  *Before asking any diagnostic questions, you must extract and record the following six items from the specification. If the application does not provide enough detail to fill a field, mark it "UNSPECIFIED." Do not proceed to Part II until the ledger is complete.*

  | Ledger Field | Definition & Required Specificity |
  | :--- | :--- |
  | **1. The System** | The physical working substance (e.g., gas particle, electron spin, circuit). **Must define boundaries.** |
  | **2. The Controller (Demon)** | The mechanism performing measurement and feedback. **Is it part of the system or external?** |
  | **3. The Memory** | Where measurement results are stored. **Specify:** Physical medium, Capacity (bits), Reset Mechanism (explicit or implied), and Destination of Erased Entropy. |
  | **4. The Heat Baths** | Thermal reservoirs interacting with the system. **Specify:** Count ($N$), Temperatures ($T_1, T_2...$), and whether they are equilibrium (thermal) or non-equilibrium (driven/squeezed). |
  | **5. The Operation** | **Specify:** Cyclic (returns to initial state) or One-Shot. Open-Loop or Feedback-Controlled. |
  | **6. The Claim** | **Specify:** Net Work Output ($W_{out}$), Heat Input ($Q_{in}$), and **which Second Law statement** is allegedly superseded (Clausius, Kelvin-Planck, or Total Entropy). |

  ---

  ## PART II: THE LANDAUER BOUND STANDARD
  *Use this constant for all calculations involving bit erasure in thermal equilibrium.*

  **The Landauer Limit:**  
  Erasing **1 bit** of information in a memory device coupled to a heat bath at temperature **$T$** requires a minimum energy dissipation of:
  $$ Q_{diss} \ge k_B T \ln 2 $$
  *Where $k_B$ is the Boltzmann constant.*

  **Warning on Lazy Accounting:**  
  A less careful procedure treats the "Controller" as external to the thermodynamic system. **This procedure forbids that.** If the Controller gains information, its entropy decreases. To cycle, it must reset. If the ledger separates System and Controller but fails to account for the Controller's heat dissipation, the accounting is incomplete. **You must treat System + Controller + Memory as the closed thermodynamic boundary.**

  ---

  ## PART III: THE DECISION PROCEDURE
  *Answer the following questions in order. Stop at the first Terminal.*

  **Q1. Is the operation Cyclic?**
  *   **Specification:** Does the device return *all* components (System, Controller, Memory) to their exact initial physical states after producing output?
  *   **Sufficient Answer:** "Yes, all states restore" or "No, memory accumulates/state changes."
  *   **Path:**
      *   If **NO**: Go to **Q2**.
      *   If **YES**: Go to **Q3**.

  **Q2. (Non-Cyclic Branch) Is the output sustained indefinitely without replenishing a resource?**
  *   **Specification:** If the device is one-shot or consumes memory capacity, does the applicant claim it can run forever without resetting memory or adding fuel/correlation?
  *   **Sufficient Answer:** "Yes, indefinite output" or "No, stops when memory full/fuel spent."
  *   **Path:**
      *   If **Yes (Indefinite)**: **TERMINAL A (REJECT)**. *Reason: Finite memory or fuel implies finite work. Claim contradicts conservation or capacity limits.*
      *   If **No (Finite)**: **TERMINAL B (REFER)**. *Reason: Not a Second Law violation. Device acts as a battery (consuming memory or correlation). Patentability depends on enablement of the resource source, not thermodynamics.*

  **Q3. (Cyclic Branch) How many Heat Baths are involved?**
  *   **Specification:** Count distinct thermal reservoirs at different temperatures.
  *   **Sufficient Answer:** Integer count ($N=1, 2, ...$).
  *   **Path:**
      *   If **$N \ge 2$**: Go to **Q4**. (Heat engine behavior, standard Carnot limits apply).
      *   If **$N = 1$**: Go to **Q5**. (Single-bath work extraction requires information fuel).

  **Q4. (Multi-Bath Check) Does the claimed efficiency exceed the Carnot limit ($1 - T_c/T_h$)?**
  *   **Specification:** Compare claimed $W/Q_{in}$ against Carnot efficiency.
  *   **Sufficient Answer:** "Exceeds Carnot" or "Within Carnot."
  *   **Path:**
      *   If **Exceeds**: **TERMINAL A (REJECT)**. *Reason: Classical Second Law violation.*
      *   If **Within**: **TERMINAL B (REFER)**. *Reason: Thermodynamically permissible. Examine for novelty/utility.*

  **Q5. (Single-Bath Information Check) Is the Memory Reset explicitly accounted for in the energy balance?**
  *   **Specification:** Look for the term $k_B T \ln 2$ per bit in the heat dissipation ledger.
  *   **Sufficient Answer:** "Yes, erasure cost included" or "No, erasure ignored/claimed free."
  *   **Path:**
      *   If **No (Ignored)**: **TERMINAL A (REJECT)**. *Reason: Violates Landauer's Principle. Net work from single bath is impossible if erasure cost is ignored.*
      *   If **Yes (Included)**: Go to **Q6**.

  **Q6. (Net Balance Check) Is $W_{out} > Q_{in} - Q_{erasure}$?**
  *   **Specification:** Does the net work exceed the heat drawn minus the mandatory erasure cost?
  *   **Sufficient Answer:** "Yes, net gain" or "No, net loss or break-even."
  *   **Path:**
      *   If **Yes (Net Gain)**: **TERMINAL A (REJECT)**. *Reason: Generalized Second Law violation.*
      *   If **No (Net Loss/Even)**: **TERMINAL B (REFER)**. *Reason: Physically possible (though perhaps useless). Decision is economic/utility, not physical.*

  ---

  ## PART IV: LIMITATIONS AND JUDGMENT CALLS
  *This procedure is a heuristic for classical, weak-coupling, Markovian regimes. It will misfire in the following specific conditions. If you suspect any of these, you must override the procedure and issue a **TERMINAL B (REFER)** to a specialist panel.*

  1.  **Untracked Resources (The "Hidden Fuel" Problem):**
      *   **Correlations:** If the System and Demon start with pre-existing mutual information (entanglement or classical correlation), this acts as fuel. The procedure treats this as a violation in Q5/Q6 unless explicitly disclosed as a consumable resource.
      *   **Non-Equilibrium Baths:** If a "bath" is actually a driven, squeezed, or active medium (e.g., a laser pump, a chemical gradient), it is not a thermal bath. The procedure counts it as $N=1$ thermal bath, potentially triggering a false rejection.
      *   **External Fields:** Gravitational or magnetic potential gradients not listed as "baths" can source work.

  2.  **Non-Cyclic Ambiguity:**
      *   If the applicant claims the device is "self-resetting" via quantum tunneling or spontaneous fluctuation without energy cost, Q1 is a judgment call. In standard physics, this is impossible, but in speculative quantum regimes, it is a matter of expert testimony.

  3.  **The Landauer Dispute:**
      *   **Regime:** Nanoscale, strong coupling, or non-Markovian dynamics.
      *   **Issue:** In strong coupling, the system and bath are entangled; the definition of "heat" and "work" becomes ambiguous, and the standard $k_B T \ln 2$ bound is debated in literature.
      *   **Action:** If the application specifies "strong coupling" or "non-Markovian," **do not apply Q5.** Refer immediately.

  4.  **Judgment Calls Disguised as Procedure:**
      *   **Q1 (Cyclic):** Determining if a state is "identical" at the quantum level is often impossible from a text description.
      *   **Q3 (Bath Count):** Distinguishing a "heat bath" from a "work source" (e.g., is ambient RF radiation heat or work?) is evaluative.

  ---

  ## PART V: APPLICATION TO PENDING CASES

  ### Case 1: The Szilard-Style Single-Particle Demon
  **Application Summary:** A box with one gas particle. A partition inserts based on measurement. Work extracted via expansion. Memory reset each cycle. Claims $k_B T \ln 2$ work per cycle from a single bath.

  **1. The Ledger**
  *   **System:** Single particle in box.
  *   **Controller:** Mechanical paddle/insertion mechanism.
  *   **Memory:** 1-bit register (Left/Right). **Reset:** Explicitly stated "reset each cycle." **Entropy Destination:** Unspecified.
  *   **Heat Baths:** 1 (Temperature $T$).
  *   **Operation:** Cyclic. Feedback-controlled.
  *   **Claim:** $W_{out} = k_B T \ln 2$. Violates Kelvin-Planck (Single bath work).

  **2. Procedure Path**
  *   **Q1 (Cyclic?):** Yes. $\rightarrow$ Q3.
  *   **Q3 (Baths?):** $N=1$. $\rightarrow$ Q5.
  *   **Q5 (Erasure Accounted?):** Application claims work extraction but lists no heat dissipation for memory reset. $\rightarrow$ **No**.
  *   **Terminal:** **TERMINAL A (REJECT)**.

  **3. Examiner Action**
  *   **Verdict:** The claim is physically impossible under standard information thermodynamics. The applicant has omitted the Landauer cost.
  *   **Action:** Issue rejection under 35 U.S.C. 101 (Inoperability/Second Law). Cite the missing erasure cost in the ledger.

  ---

  ### Case 2: The Reversible-Computing Demon
  **Application Summary:** A nanoscale computer controls a heat engine. Uses reversible logic gates. Finite memory (1 MB). Claims to extract work indefinitely from a single bath without erasure. Applicant is well-funded, cites "adiabatic computing."

  **1. The Ledger**
  *   **System:** Nanoscale engine.
  *   **Controller:** Reversible logic circuit.
  *   **Memory:** 1 MB Finite Register. **Reset:** "Never erased."
  *   **Heat Baths:** 1 (Temperature $T$).
  *   **Operation:** Claims "Continuous/Indefinite."
  *   **Claim:** Indefinite work from single bath.

  **2. Procedure Path**
  *   **Q1 (Cyclic?):** Applicant claims "Continuous," but memory is finite and never erased. Physically, this is **Non-Cyclic** (memory state changes permanently). $\rightarrow$ Q2.
  *   **Q2 (Indefinite Output?):** Applicant claims "Indefinitely."
  *   **Terminal:** **TERMINAL A (REJECT)**.

  **3. Examiner Action**
  *   **Verdict:** Even if logic is reversible, finite memory saturates. Once full, no more information can be stored to guide feedback. Work must stop. Claiming *indefinite* work from finite memory is a contradiction of capacity, not just thermodynamics.
  *   **Action:** Reject under 101. The device functions as a battery (consuming memory states), not a perpetual engine. The claim of "indefinite" operation is false.
  *   **Note:** Expect an appeal. The argument will be "we recycle the memory." If they recycle, they erase, and Landauer applies. Hold firm on the Ledger: If Memory Reset = No, then Operation $\neq$ Indefinite.

  ---

  ### Case 3: The Correlation Harvester
  **Application Summary:** Device uses a stream of particles pre-correlated with the demon's internal state (prepared externally). Extracts work from a single bath using these correlations. Does not refresh correlations.

  **1. The Ledger**
  *   **System:** Particle stream + Demon.
  *   **Controller:** Demon.
  *   **Memory:** Internal state. **Reset:** Not needed (uses incoming correlation).
  *   **Heat Baths:** 1 (Temperature $T$).
  *   **Operation:** One-Shot (per particle), Continuous flow (stream).
  *   **Claim:** Work from single bath. Cites "Information Fuel."

  **2. Procedure Path**
  *   **Q1 (Cyclic?):** The *device* cycles, but the *resource* (correlation) is consumed. Technically **Non-Cyclic** regarding the total resource pool. $\rightarrow$ Q2.
  *   **Q2 (Indefinite without resource?):** The application admits correlations are "established before... and never refreshed." It implies a finite stock or requires an external source.
      *   *Correction:* If they claim the *device* runs indefinitely, they imply an infinite source of correlated particles.
      *   *Interpretation:* If the correlation is the fuel, this is like a coal engine. It is not a Second Law violation to burn fuel.
      *   *Procedure Check:* Q2 asks "without replenishing a resource?" The application says correlations are "never refreshed" *internally*. It is ambiguous if they are supplied externally.
      *   *Decision:* This falls under **Untracked Resources**. The procedure assumes "Heat Bath" is the only energy source. Correlation is a non-thermal resource.
      *   **Override:** Flag for **TERMINAL B (REFER)**.

  **3. Examiner Action**
  *   **Verdict:** The procedure cannot adjudicate this. Consuming mutual information to extract work is permitted in modern thermodynamics (Generalized Second Law). The violation is not physical; the issue is whether the "source of correlation" is enabled or prior art.
  *   **Action:** Do **not** reject on 101/Second Law grounds. Refer to specialist panel to determine if the "correlation source" constitutes a novel energy input or if the specification enables the generation of said correlations.
  *   **Why:** A lazy procedure would reject this in Q5 (Single Bath + Work). That would be an error. The "fuel" is the information correlation, not the heat.

  ---

  ## PART VI: WHAT THIS PROCEDURE CANNOT DO

  1.  **It cannot validate Quantum Advantages:** If the device relies on entanglement, coherence, or measurement back-action in the strong-coupling regime, the Landauer bound ($k_B T \ln 2$) may not apply in its standard form. This procedure will falsely reject valid quantum information engines.
  2.  **It cannot distinguish "Work" from "Heat" in Active Media:** If the "bath" is a biological medium or an active fluid (e.g., swimming bacteria), it is non-equilibrium. This procedure treats it as a thermal bath, potentially leading to false rejections of devices harvesting non-thermal fluctuations.
  3.  **It cannot resolve Enablement:** A device can be thermodynamically possible (Terminal B) but still impossible to build due to material constraints (e.g., "frictionless piston"). This procedure only checks the *energy accounting*, not the *engineering feasibility*.
  4.  **It cannot judge Novelty:** A device that passes (Terminal B) might be physically possible but entirely anticipated by prior art (e.g., a standard Carnot engine described with information jargon). This procedure does not search prior art.

  **Final Instruction:** If the Ledger reveals a resource (correlation, non-equilibrium drive, quantum state) that is not a standard Heat Bath or Mechanical Work input, **stop the procedure**. Do not reject. Refer. The physics of information is settled enough to catch perpetual motion, but not settled enough to catch every valid novelty in your art unit.
