  9.  **Finalizing the Output Structure:**
      *   Introduction (Context).
      *   The Ledger (Template).
      *   The Landauer Bound (Explicit).
      *   The Decision Procedure (Questions 1-6).
      *   Critique/Limitations (Where it misfires).
      *   Application to Cases 1, 2, 3.
      *   Conclusion (What the procedure cannot do).

