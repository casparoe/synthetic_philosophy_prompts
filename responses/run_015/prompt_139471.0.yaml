answer: |-
  ## Activity Design: "The Liquidity of Belief"

  This is a single, continuous simulation divided into three phases. It treats the students not as test subjects but as market-makers in a thin market. The mechanics are designed to make the *cost* of uncertainty and the *arbitrariness* of convention tangible through token losses and gains, without requiring complex math during play.

  ### Materials
  *   **Two Urns (or opaque boxes):**
      *   **Urn A (Risk):** Clearly labeled. Contains 50 Red chips, 50 Black chips.
      *   **Urn B (Uncertainty):** Clearly labeled. Contains 100 chips (Red/Black composition unknown to all, including you).
  *   **Asset Sheets:** 16 sheets, one per student. Each lists 12 "Contracts."
      *   Contracts 1–4: Pay £100 if a draw from Urn A is Red.
      *   Contracts 5–8: Pay £100 if a draw from Urn B is Red.
      *   Contracts 9–12: Pay £100 if the *Class Median Valuation* (determined in Phase 3) is greater than £50.
  *   **Trading Slips:** Small slips of paper for submitting Bid/Ask prices.
  *   **Whiteboard & Markers.**
  *   **A Deck of Cards:** For the "Signal."
  *   **Token Currency:** Poker chips or printed points (Start each student with 1,000 tokens).
  *   **Prize:** A single tangible reward (e.g., a book or chocolate) for the highest token score.

  ### Rules & Payoff Scheme
  1.  **Market Making:** For each Contract, students must either:
      *   **Make a Market:** Write a **Bid** (max price they'll buy) and an **Ask** (min price they'll sell). The spread (Ask - Bid) must be at least 5 tokens.
      *   **Decline:** Write "NO MARKET."
  2.  **Execution:** The Instructor acts as the counterparty. For each contract, the Instructor flips a coin.
      *   *Heads:* The Instructor **Buys** at the student's Bid.
      *   *Tails:* The Instructor **Sells** at the student's Ask.
      *   *(This randomizes their position so they cannot hedge; they must price the risk itself.)*
  3.  **Resolution:**
      *   **Urn A Contracts:** Resolved by physical draw from Urn A.
      *   **Urn B Contracts:** Resolved by physical draw from Urn B.
      *   **Class Median Contracts:** Resolved by the outcome of Phase 3 (The Convention).
  4.  **Decline Payoff:** If a student writes "NO MARKET," they pay a small "listing fee" of 10 tokens but incur no risk on that contract. (This makes "No Comparison" a strategic choice, not a passive opt-out).

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  #### **00:00 – 00:10: Setup & Endowment**
  *   Distribute tokens (1,000 each) and Asset Sheets.
  *   Display Urn A and Urn B. Verify Urn A's contents publicly. Seal Urn B.
  *   Explain the **Execution Rule** (Instructor flips coin to Buy/Sell).
  *   **Instruction:** "Your goal is to maximize tokens. You must quote a Bid/Ask or Decline for every contract. You have 15 minutes."

  #### **00:10 – 00:25: Phase 1 (The Book of Bets)**
  *   Students fill out sheets.
  *   **Crucial Constraint:** Do not answer questions about the probability of Urn B. If asked, say: "Price it as you see fit."
  *   Collect sheets. Do not resolve anything yet.
  *   *Instructor Note:* While collecting, quickly scan the "Decline" rates on Urn B vs. Urn A.

  #### **00:25 – 00:35: Phase 2 (Risk vs. Uncertainty Resolution)**
  *   **Urn A Resolution:** Draw one chip. It applies to Contracts 1–4. Calculate gains/losses for these contracts immediately on the board.
  *   **Urn B Resolution:** Draw one chip. It applies to Contracts 5–8. Calculate gains/losses.
  *   **Observation:** Ask students to tally their current token counts.
  *   *Silent Moment:* Allow 60 seconds for them to notice the emotional difference between the loss on A (bad luck) and the loss on B (feeling of "unfairness" or "unknown").

  #### **00:35 – 00:50: Phase 3 (The Convention)**
  *   Focus on Contracts 9–12. The payoff condition is: *Value = £100 if Class Median Valuation > £50, else £0.*
  *   **Step 1 (The Void):** Ask students to write down a private "Valuation" for these contracts on a slip of paper. Do not collect yet.
  *   **Step 2 (The Signal):** Draw a card from the deck. Suppose it is the **7 of Hearts**. Write "7" largely on the whiteboard. Say: "This number is randomly generated. It has no mathematical relation to the payoff. But you may find it useful."
  *   **Step 3 (Destabilization):** Erase the "7". Say: "The signal is gone. The market is open."
  *   **Step 4 (The Fix):** Ask students to submit their final Valuation.
  *   **Resolution:** Calculate the Median of the submitted valuations. If Median > 50, Contracts 9–12 pay £100. If not, £0.
  *   **Final Tally:** Students calculate final token scores. Award the prize.

  #### **00:50 – 01:15: The Debrief**
  *   (See script below).

  ---

  ### The Debrief Script (Mapping Activity to Keynes)

  *Do not lecture until this point. Stand by the whiteboard where the '7' was erased.*

  **1. On Probability as Rational Belief (Treatise on Probability)**
  *   **Point to:** Urn A vs. Urn B pricing.
  *   **Say:** "Many of you priced Urn A and Urn B at similar expected values (e.g., £50). Mathematically, you are correct. But look at your spreads. The spreads on Urn B were wider. Why?"
  *   **Keynesian Claim:** Probability is not a property of the world (frequency); it is a relation between evidence and conclusion. The *evidence* for Urn A was complete; for Urn B, it was absent. The price was the same, but the *rationality* of holding that price differed.

  **2. On Uncertainty vs. Risk (General Theory)**
  *   **Point to:** The "Decline" (No Market) options.
  *   **Say:** "Who declined to quote on Urn B? You accepted a sure loss of 10 tokens rather than face the urn. If this were just 'risk,' you would have priced it. You didn't. You treated it as incomparable."
  *   **Keynesian Claim:** Uncertainty is not risk with the numbers rubbed out. It is a state where no numerical comparison is rational. By declining, you admitted that some things cannot be added to a portfolio calculation.

  **3. On The Weight of Evidence**
  *   **Point to:** The spreads on Urn A vs. Urn B.
  *   **Say:** "Two students might both bid £45. But one had a spread of £5, the other £20. The probability was identical; the *weight* of the evidence was not."
  *   **Keynesian Claim:** Confidence is a separate variable from probability. In your models, probability is a scalar. In reality, it is a vector (Probability, Weight). When weight is low, rational agents widen spreads or exit.

  **4. On Conventions (General Theory, Ch. 12)**
  *   **Point to:** The erased '7' on the whiteboard.
  *   **Say:** "Contracts 9–12 had no fundamental value. Their value depended entirely on what you thought *others* would value them at. When I put '7' on the board, did it influence you? When I erased it, did you panic?"
  *   **Keynesian Claim:** When calculation fails (like with Contracts 9–12), we do not freeze. We fall back on convention. We anchor to arbitrary signals (the '7', past prices, news headlines) because we need a focal point to coordinate with others. The convention holds only as long as we believe others will hold it.

  ---

  ### Troubleshooting: Predictable Failures & Non-Lecturing Fixes

  **1. The "Prior Reconstruction" Problem**
  *   **Failure:** Students insist Urn B is 50/50 by Principle of Indifference and price it identically to Urn A with tight spreads.
  *   **Fix:** Do not argue. In the debrief, highlight the *outcome*. If the Urn B draw was extreme (e.g., Red is actually 90%), those with tight spreads lose heavily. Ask: "Did your model account for the possibility that the urn was rigged? No? Then your model assumed knowledge you didn't have."

  **2. The "Arbitrageur"**
  *   **Failure:** A student notices the Instructor's Buy/Sell coin flip is random and tries to hedge by submitting Bid=40, Ask=60 on everything to guarantee a profit if the coin lands their way.
  *   **Fix:** This is actually desirable—it shows they understand market making. In debrief, note: "This student treated the game as a mechanical puzzle. But in the real economy, you cannot always hedge. Phase 3 (The Convention) could not be hedged."

  **3. The "No Comparison" Embarrassment**
  *   **Failure:** Students fear looking "weak" by choosing "Decline," so they price everything.
  *   **Fix:** Frame the "Decline" fee (10 tokens) as a "Liquidity Provision Fee." In the debrief, praise those who declined Urn B. "These students recognized the epistemic limit. That is a virtue, not a failure."

  **4. The "Confident Anchor"**
  *   **Failure:** In Phase 3, one loud student says "Let's all write 60!" and tries to coordinate the room.
  *   **Fix:** Let them try. If they succeed, the convention held. If they fail, the convention broke. In debrief, point to that student: "This is the 'Expert' or 'Guru'. The market followed them not because they were right, but because they were focal. This is how bubbles form."

  ---

  ### Limitations: Where the Simulation Stops

  You must state these explicitly in the final 5 minutes. The activity cannot simulate:

  1.  **Objective Logical Relations (Treatise View):**
      *   *Limitation:* The game treats probability as subjective pricing (Bayesian/Subjective). Keynes in the *Treatise* argued probability is an *objective logical relation* between evidence and hypothesis, independent of human belief.
      *   *What to say:* "In this game, probability was what you were willing to bet. For Keynes in 1921, probability was a logical truth waiting to be discovered, like a math theorem. We simulated the *feeling* of uncertainty, but not the *ontology* of logical probability."

  2.  **Institutional Durability:**
      *   *Limitation:* The convention in Phase 3 lasted 10 minutes. Real conventions (e.g., the gold standard, housing markets) last decades because of laws, norms, and leverage.
      *   *What to say:* "You could walk away from this game with no penalty. In the real economy, you cannot exit the convention without bankrupting yourself. That is why conventions persist longer than rationality suggests."

  3.  **The "Animal Spirits" Drive:**
      *   *Limitation:* Students played for a chocolate bar. They did not feel the visceral urge to act when they had no reason to.
      *   *What to say:* "You calculated. Keynes argued that often we act because of a 'spontaneous urge to action,' not calculation. If you had no prize, you wouldn't have played. In the real world, we invest even when the math says 'No Market'. That is the engine of progress, and the source of crashes."

  ### Why This Works Better Than Ellsberg/Beauty Contest
  *   **Ellsberg** isolates ambiguity but feels like a logic puzzle. By forcing **Bid/Ask spreads**, you force students to quantify their *comfort*, not just their belief.
  *   **Beauty Contest** isolates iterated reasoning. By tying the payoff to a **Median Valuation** preceded by an **Arbitrary Signal**, you shift the focus from "outthinking others" to "coordinating on a focal point," which is the essence of the Keynesian Convention.
  *   **Connected Flow:** The transition from Urn B (Uncertainty) to Contracts 9–12 (Convention) shows the *progression* of economic life: when evidence runs out, convention takes over.
