answer: |-
  **Project Title:** Normative Succession: The Metaphysics of Orphan Reasons

  **Project Overview and Core Question**
  This project investigates the lifecycle of normative demands when the agent who generated them ceases to exist. Standard metaethics asks whether reasons require minds to exist at all. I propose a downstream question: When everyone agrees a reason *did* exist (e.g., a promise, a commission, a treaty), what becomes of it once its author is gone? I call these "orphan reasons."

  The core question is determinate: **Do normative demands survive the extinction of their author as full-strength mandates available to any capable agent, or do they persist only as attenuated demands scaled to the successor's fidelity to the original intent?**

  This is not merely a question of whether reasons are real. It is a question about the *transferability* and *decay* of normative force. If I promise a dead friend to care for their cat, is there a free-floating reason "to care for the cat" that anyone could discharge? Or is the reason bound to *me* specifically, and does it weaken if I outsource the care to someone who doesn't know the friend? The project tests the hypothesis that standard realism is quietly committed to an implausible "accrual picture" (a universe accumulating undischargeable reasons), and offers a "fidelity-scaled" model as a viable third position.

  **Intellectual Merit: Why Standard Camps Do Not Settle This**
  The realism/antirealism dispute is typically framed as "Do reasons exist independent of attitudes?" Both sides have ready-made but unsatisfactory answers to the orphan problem.

  1.  **Standard Realism:** Holds that reasons are facts. If it was a fact that I promised, it remains a fact. However, realism struggles to explain *bindingness* without a subject. If the reason floats free, does it bind everyone? If so, the world accrues infinite normative debris (the "accrual cost"). If it binds no one, it is normatively inert. Realism lacks a mechanism for normative succession.
  2.  **Standard Antirealism:** Holds that reasons depend on current attitudes. When the author dies, the reason vanishes. This contradicts robust legal and ethical intuitions regarding wills, contracts, and historical treaties. It forces us to say executors are acting on *their own* reasons, which erodes the concept of legacy.

  Both camps treat the existence of the reason as binary (on/off). This project argues the status of an orphan reason is *gradient*. It seeks to show that the realism/antirealism debate is insufficient because it lacks a variable for *fidelity*. The project is not a footnote to that dispute; it is a structural critique of how both sides model normative persistence.

  **Methodology and Timeline (Three Months)**
  This is a solo conceptual analysis project. No literature survey is planned; the work proceeds via case construction and model testing.

  *   **Month 1: Case Construction and Stress Testing.**
      I will construct a typology of orphan reasons: legal (wills), interpersonal (deathbed promises), artistic (unfinished manuscripts), and political (treaties with extinct nations). For each, I will devise scenarios where the "heir" diverges from the original intent. *Deliverable:* A matrix of cases where intuitive normative force varies based on fidelity, not just existence.
  *   **Month 2: Modeling the Accrual vs. Fidelity Accounts.**
      I will formalize the "Accrual Picture" (realist commitment) and demonstrate its costs (undischargeable obligations cluttering the ontology). I will then draft the "Fidelity-Scaled" model, defining the mathematical or logical relationship between intent-alignment and reason-strength. *Deliverable:* A working draft of the positive account showing how fidelity acts as a coefficient on normative force.
  *   **Month 3: Integration and Drafting.**
      I will synthesize the negative argument (against accrual) and the positive argument (for fidelity) into a single paper. The focus will be on proving that fidelity-scaling is not just a psychological fact about heirs, but a metaphysical fact about the reasons themselves. *Deliverable:* Complete manuscript ready for submission.

  **Expected Outcomes and Conditions of Failure**
  A successful result is a paper demonstrating that the "Accrual Picture" is too costly for realists to maintain, and that the "Fidelity-Scaled" model resolves the tension without collapsing into antirealism. The paper will argue that reasons can be *real* but *fragile*, surviving only through specific relational channels.

  **Honest Statement of Failure:**
  There are two distinct failure modes. The first is substantive: I may fail to demonstrate that fidelity-scaling is metaphysical rather than psychological. If it turns out that the reason doesn't weaken, but rather the *heir* just feels less motivated, I have not found a new metaphysical position, only a description of motivation.

  The second, and more likely failure, is the one I fear most: **Redescription.** I may conclude that "fidelity-scaled inheritance" is just standard antirealism in disguise—i.e., the living agent generates *new* reasons based on the dead agent's history, rather than inheriting old ones. If I cannot distinguish "inheriting a weakened reason" from "forming a new reason to honor the dead," the project fails to carve out the proposed third position. Three months is sufficient to identify this collapse, even if it is insufficient to solve it. If the collapse occurs, the output will be a rigorous proof that the "orphan reason" category is unstable, which is itself a valuable negative result.

  **Broader Impacts: Why Non-Metaphysicians Should Care**
  While framed as metaethics, the answer dictates how we handle normative authority across time.
  1.  **Legal Theory:** It informs debates on the enforceability of wills and contracts beyond the lifetime of parties. Are we enforcing the dead's rights, or the living's interest in stability?
  2.  **AI Alignment:** As developers die, do AI systems remain bound by their creators' original goals, or do those goals degrade as the system updates? This project offers a framework for "normative decay" in autonomous agents.
  3.  **Intergenerational Justice:** It clarifies obligations to past generations (reparations, treaties) versus future generations. If reasons attenuate without fidelity, historical injustices may require active "maintenance" of the normative claim to remain binding.

  **Feasibility Note**
  A full metaphysics of reasons cannot be completed in three months. However, this project is scoped specifically to the *transition point* of agent death. This slice is narrow enough to be tractable while remaining philosophically decisive. If the fidelity model proves too complex, the project will default to the negative argument against the Accrual Picture, which stands alone as a critique of standard realism.
