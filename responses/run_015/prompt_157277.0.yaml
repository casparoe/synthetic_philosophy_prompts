  # The Wetland Satisficing Protocol (WSP)

  ## 1. Theoretical Foundation and Operational Context
  This procedure operationalises Herbert Simon's concept of bounded rationality for a wildlife conservation officer. The objective is not to find the optimal land-use outcome (maximising), but to identify the first acceptable outcome that meets a predefined aspiration level (satisficing). The officer faces a hard time constraint of two minutes per application and institutional pressure from a review panel to gather exhaustive evidence. To prevent 'maximising drift'—where the officer seeks perfect data to satisfy the panel rather than sufficient data to make a safe decision—this protocol imposes a hard 'Cognitive Budget'.

  ## 2. The Procedure: Ordered Sequence and Cognitive Budget

  **The Cognitive Budget Rule:**
  The officer possesses a total budget of **5 Cognitive Units (CU)** per case. Each information check or comparison against a threshold consumes **1 CU**. Once 5 CU are expended, the search for information must terminate immediately. If the aspiration level has not been met by this point, the default decision is **Rejection** (applying the precautionary principle).

  **The Aspiration Level:**
  An application is deemed 'satisfactory' (Approve) only if it passes all three Critical Thresholds below. Failure on any single threshold results in immediate Rejection.

  **The Checklist (Laminated Card):**

  *   **Start:** Reset Counter to 5 CU.
  *   **Test 1 (Distance):** Is the proposed development >500 metres from the wetland boundary?
      *   *Cost:* 1 CU.
      *   *If No:* **STOP. Reject.** (Remaining CU discarded).
      *   *If Yes:* Deduct 1 CU. Proceed to Test 2.
  *   **Test 2 (Vegetation):** Is the direct vegetation loss <5% of the applicant's plot?
      *   *Cost:* 1 CU.
      *   *If No:* **STOP. Reject.** (Remaining CU discarded).
      *   *If Yes:* Deduct 1 CU. Proceed to Test 3.
  *   **Test 3 (Runoff Risk):** **[JUDGMENT NODE]** Is the surface runoff risk categorised as 'Low' based on visible slope and soil type?
      *   *Cost:* 1 CU.
      *   *If No/Uncertain:* **STOP. Reject.** (Remaining CU discarded).
      *   *If Yes:* Deduct 1 CU. Proceed to Termination Rule.
  *   **Termination Rule:**
      *   If Tests 1, 2, and 3 are passed: **Approve.** (Do not use remaining CU).
      *   If Tests 1, 2, and 3 are passed but CU remains: **Do not check further.** Ignore panel pressure for more data.
      *   If CU reaches 0 before all tests are passed: **Reject.**

  ## 3. Worked Applications

  ### Case A: Clear Approval (Satisficing Achieved)
  **Scenario:** A small shed proposal 600m from the wetland, clearing 2% of vegetation, on flat ground.
  **Execution:**
  1.  **Test 1:** Distance is 600m (>500m). Pass. (CU remaining: 4).
  2.  **Test 2:** Vegetation loss is 2% (<5%). Pass. (CU remaining: 3).
  3.  **Test 3:** Slope is flat, runoff 'Low'. Pass. (CU remaining: 2).
  **Decision:** All thresholds met. **Approve.**
  **Note:** The officer ignores the remaining 2 CU. A maximising officer might use them to check soil pH or noise levels to ensure 'perfect' safety. The satisficing officer stops because the aspiration level is cleared. This protects the time budget for the next case.

  ### Case B: Clear Rejection (Early Termination)
  **Scenario:** A housing extension 200m from the wetland.
  **Execution:**
  1.  **Test 1:** Distance is 200m (<500m). Fail.
  **Decision:** **Reject.**
  **Note:** The officer stops immediately. Tests 2 and 3 are not performed. CU cost is 1. This preserves cognitive resources. The panel cannot demand evidence on vegetation loss because the distance failure is sufficient for rejection under the protocol.

  ### Case C: Panel Pressure and Budget Exhaustion (The Critical Test)
  **Scenario:** A farm store 550m from the wetland, 4% vegetation loss, but on a moderate slope where runoff is ambiguous. The officer has 2 CU remaining after Test 2.
  **Execution:**
  1.  **Test 1:** Pass. (CU remaining: 4).
  2.  **Test 2:** Pass. (CU remaining: 3).
  3.  **Test 3:** **[JUDGMENT NODE]** The slope is moderate. The officer is unsure if runoff is 'Low'.
      *   *Pressure:* The review panel previously criticised a similar case for lacking soil permeability data. The officer feels compelled to dig out soil maps (which would cost 1 CU) or consult a hydrologist (which would exceed time limits).
      *   *Protocol Constraint:* The officer assesses the risk visually. If they declare it 'Uncertain', they must Reject. If they declare it 'Low', they Approve.
      *   *Budget Trap:* If the officer spends 1 CU checking a soil map to be sure, they have 2 CU left. If that map is inconclusive, they might spend another CU checking historical rain data. This is maximising behaviour.
      *   *Enforced Stop:* The protocol dictates that Test 3 is the final aspiration check. If the officer cannot confirm 'Low' runoff within the 1 CU allocated to visual inspection, the threshold is not met.
  **Decision:** Because the officer cannot definitively categorise runoff as 'Low' without exceeding the allocated effort for this test, the aspiration level is not cleared. **Reject.**
  **Justification to Panel:** "The Cognitive Budget was exhausted at the aspiration threshold. Further data gathering violates the bounded rationality protocol designed to maintain system-wide throughput."

  ## 4. Decision Nodes Requiring Human Judgment
  Despite the mechanistic design, human judgment cannot be fully eliminated. These nodes are vulnerable to bias and must be acknowledged:

  1.  **Test 3 (Runoff Risk):** **[JUDGMENT NODE]** Categorising 'Low' risk visually requires experience. One officer's 'Low' is another's 'Moderate'. The checklist cannot quantify slope degrees without a clinometer (which would cost extra CU).
  2.  **Budget Enforcement:** **[JUDGMENT NODE]** The officer must voluntarily refuse the panel's request for more data. This requires psychological discipline to accept 'good enough' over 'defensible perfection'.
  3.  **Threshold Interpretation:** **[JUDGMENT NODE]** Measuring the 500m distance on a rough map involves estimation. If the boundary is unclear, the officer must judge whether to err on the side of caution (Reject) or benefit of the doubt (Approve). The protocol dictates caution, but the human must enact it.

  ## 5. Limitations and Ecological Uncertainty
  This procedure is grounded in the logic of bounded rationality, yet it possesses inherent structural weaknesses regarding aspiration-level adaptation.

  **Static Aspiration Levels:**
  Simon's theory posits that aspiration levels should adapt: if success is too easy, raise the bar; if failure is too frequent, lower it. This laminated checklist is static. If the wetland ecology degrades (e.g., becoming more sensitive to runoff), the 'Low' risk threshold may become unsafe, yet the officer continues to approve cases that meet the old standard. Conversely, if the wetland recovers, the officer may reject safe applications unnecessarily, causing economic waste.

  **The 'Unknown Unknown' Problem:**
  Satisficing works only if the chosen tests correlate with the true goal (conservation). If a new pollutant emerges that is not covered by Distance, Vegetation, or Runoff (e.g., light pollution affecting nocturnal species), the procedure will approve damaging applications because the aspiration level does not account for this variable. The cognitive budget prevents the officer from searching for this new variable once the 5 CU are spent.

  **Institutional Friction:**
  The procedure relies on the panel accepting 'protocol exhaustion' as a valid justification. If the panel prioritises liability avoidance over decision speed, they will punish officers for rejecting cases based on budget limits rather than concrete evidence. This creates a conflict where the rational procedure is institutionally irrational, potentially forcing the officer to abandon satisficing to protect their career.

  **Conclusion on Utility:**
  The WSP is effective for high-volume, low-stakes filtering where consistency and speed outweigh optimal precision. It fails in novel or rapidly changing ecological contexts where the definition of 'acceptable' must shift dynamically.

  The procedure's core limitation is that its static aspiration levels cannot adapt to ecological changes without external revision, rendering the fixed thresholds potentially obsolete over time.
