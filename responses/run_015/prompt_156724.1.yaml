  As the city planner deciding between renewing the conventional stormwater drainage grid (Option A) or installing the new proprietary "Sponge-Cell" permeable pavement system (Option B), you face a budget surplus sufficient to cover only one. Option A yields a verified near-term net benefit of $50,000 in reduced maintenance costs over five years, whereas B costs $50,000 more upfront due to specialized labor. Both systems are locked in by infrastructure lifespan and zoning codes for fifty years, meaning long-run effects on local flood risk and property values will dwarf the initial budget difference by a factor of one hundred. For A, historical data on concrete drainage suggests long-run deviations from baseline are high-variance but symmetric, driven by unpredictable weather patterns that cancel in expectation. For B, the manufacturer provides case studies from twelve municipalities showing massive long-term economic gains, but you know from your audit experience that municipalities where Sponge-Cell failed reverted to concrete quietly and never published data, creating a survivorship bias that renders your mild optimism about B's success evidentially hollow; while the amplification mechanism is certain, the sign of the effect is subject to structural ignorance where your available credence function is not a sharp probability but a wide interval spanning negative to positive values, making the expected value indeterminate rather than zero.

  **Check and Derivation**

  1.  **Long-run Expected-Value Maximization (Unadjusted Credences):** The scenario specifies that the agent holds a "mild optimism" based on the available case studies, implying an unadjusted subjective expectation where $E[B_{long}] > 0$. Since the long-run effects are stipulated to be two orders of magnitude larger than the near-term costs (e.g., $\pm\$5,000,000$ vs. $\$50,000$), this positive long-run expectation dominates the calculation. Option A's long-run effect is symmetric around zero, so $E[A_{long}] = 0$. Consequently, the total expected value of B (near-term loss + large positive long-run expectation) exceeds that of A (near-term gain + zero long-run expectation). **Verdict: B.**

  2.  **Window-Restricted Consequentialism:** This rule counts only effects the agent can forecast with reasonable confidence (the near-term). Option A provides a verified $+\$50,000$ benefit. Option B incurs a verified $-\$50,000$ cost. The long-run effects are excluded as too uncertain. **Verdict: A.**

  3.  **Imprecise-Credence Rule (Maximin):** This rule selects the option with the highest minimum expected utility, attending to the long run by evaluating the worst-case bound of the indeterminate interval. For Option A, the long-run variance is symmetric and bounded by historical weather data, so the worst-case loss is moderate. For Option B, the credence interval spans from large positive to large negative values due to the recognized survivorship bias; the lower bound represents a catastrophic lock-in failure. Since the worst-case loss of B dwarfs the near-term benefit of A, Maximin rejects B. This attends to the long run by weighting its worst-case possibility heavily rather than discarding it. **Verdict: A.**

  **Feature Analysis**
  The single feature doing the work is the **systematic skew in evidence (survivorship bias)** that generates indeterminate credence for Option B. If this feature is removed and B's spread becomes merely symmetric (ordinary uncertainty), the unadjusted expectation for B collapses to zero (canceling out), causing Verdict 1 to shift from B to A (as A's near-term advantage then dominates). Verdict 2 remains A. Verdict 3 remains A, as the imprecise interval collapses to a sharp probability centered on zero, making Maximin converge with EV maximization. All three verdicts would converge on A. A defender of the first verdict (Long-run EV) would argue the case is rigged by treating the agent's recognition of bias as forcing indeterminacy rather than a Bayesian update; they would claim rationality requires assigning a sharp prior (e.g., via the Principle of Indifference) even under ignorance, and that treating the case studies as carrying *no* evidential weight while retaining the risk is an inconsistent veto on positive expected value.

  \answer{long-run EV: B; window-restricted: A; imprecise-credence rule: A}
