      (Writing the response...)
      Hey, I hear you on this. It is incredibly frustrating to feel like you are watching three people argue past each other while pretending they are playing the same game, and honestly, your intuition that you might be watching three different movies under the same title is sharper than most introductory textbooks let on. The stalemate you are experiencing is basically the modern incarnation of the Agrippan Trilemma, and the reason nobody budges is that each position is optimizing for a different constraint on what knowledge is supposed to do. The foundationalist is obsessed with security and stopping the regress because they think justification needs an anchor that isn't vulnerable to error, which is why they cling to perceptual reports, but their failure to explain why those anchors aren't arbitrary suggests they are conflating a psychological feeling of certainty with a logical state of warrant. The coherentist is optimizing for systematic integrity because they think beliefs only have meaning in relation to other beliefs, but their inability to rule out the fairy tale shows they are treating justification as purely internal consistency while ignoring the need for world-contact. The infinitist is optimizing for the logical requirement that every reason must have a reason, but their retreat to in principle availability admits that human cognition cannot actually traverse the structure they propose.

      So when you ask if this is verbal or substantive, the diagnosis is that it is both, but mostly substantive disagreements about function masked by verbal ambiguity about the word justification. If justification means having a secure foundation, the foundationalist wins but loses contact with the world. If justification means having a consistent web, the coherentist wins but loses truth. If justification means having an unending chain of reasons, the infinitist wins but loses cognitive feasibility. Your group is stuck because you are treating these as competing answers to a single question when they are actually competing definitions of what the question should be. The foundationalist cares about the origin of warrant, the coherentist cares about the structure of warrant, and the infinitist cares about the sustainability of warrant. They are not just disagreeing on the answer; they are disagreeing on what counts as a valid move in the game. The hidden empirical claim you spotted about cognitive limits is real, especially for the infinitist, because if justification requires a mind to actually hold the chain, infinitism is dead on arrival for humans, but if justification is a dispositional property of the belief system regardless of whether a human can hold it all at once, then the cognitive load objection misses the mark.

      Regarding that idea about scaffolded epistemic loops in collaborative reasoning, you are right to be skeptical about whether it is a solution or a subject change. That moves the debate from individual epistemology to social epistemology or distributed cognition. It suggests that the chain of justification doesn't need to exist in one head but can be distributed across a community or tools, which solves the cognitive load problem for infinitism and the input problem for coherentism by making the web external. However, many traditional epistemologists would say this changes the subject from what justifies me to what justifies us, which might not help if your course is focused on individual knowledge. It is a real avenue of research, but it admits that the traditional framework of the solitary knower is broken.

      As for what progress would look like, I do not think you will find it in one side finally producing a knockout argument against the others because this debate has been running for centuries without a clear winner. Progress would likely look like a formal model of belief structures that shows how these three modes might actually complement each other rather than exclude each other, perhaps showing that foundational stops are context-dependent rather than absolute. Alternatively, progress could come from an experimental approach in cognitive science that tests how humans actually attribute justification to see if our intuitions match any of these three models, though that risks committing the naturalistic fallacy. The most honest admission, and perhaps the most productive one for your group, is that the framing is broken because it assumes justification must be a single, uniform property. If you can shift the discussion to contextualism, where the standards for justification change depending on the situation, you might find that foundationalism works for everyday claims, coherentism works for theoretical science, and infinitism works for deep philosophical critique. Until then, you are not crazy for feeling like you are in a loop, because the literature itself is often just a sophisticated way of circling the same drain.

