answer: |-
  The game creates the paradox by giving Death access to the Traveller's hidden 'nature' card before predicting, forcing players to experience the instability of choosing against a profile that only exists because of how they choose.

  ### Materials
  *   **Paper:** A4 sheets torn into strips (for predictions, choices, and cards).
  *   **Pens:** One per person.
  *   **Tokens:** 10 per person (coasters, beer mats, or matches).
  *   **The Deck:** 14 slips of paper prepared beforehand: 7 marked "Damascus" (Stay), 7 marked "Aleppo" (Go). Folded so only the holder can see.
  *   **The Board:** A whiteboard or large sheet of paper visible to all.
  *   **Dice:** 2d6 per table (or a phone app).

  ### Setup & Roles
  *   **Pairs:** Split the room into pairs. Sit facing each other.
  *   **Roles:** One is **Death**, one is **Traveller**. Rotate roles after Round 2.
  *   **Currency:** Tokens are "Life Points". Travellers start with 5. Death starts with 0.
  *   **Goal:** Traveller wants to maximize Life Points. Death wants to maximize Accuracy Points (tracked on the board).

  ### The Rounds

  #### Round 1: The sealed fate (20 mins)
  *   **Setup:** Traveller draws a **Nature Card** (Damascus/Aleppo). Keeps it hidden. Death does *not* see it yet.
  *   **Step 1 (Profile):** Traveller shows Nature Card to Death. Death memorizes it. Traveller takes card back.
  *   **Step 2 (Prediction):** Death writes "Stay" or "Go" on a slip, folds it, places it on the table. (Death knows the Nature Card bias).
  *   **Step 3 (Choice):** Traveller writes "Stay" or "Go" on a slip, folds it, places it next to Death's.
  *   **Step 4 (Reveal):** Both open simultaneously.
  *   **Payoffs:**
      *   **Traveller:** +1 Token if Choice ≠ Prediction (Survival). +2 Tokens if Choice == Nature Card (Integrity).
      *   **Death:** +2 Points on Board if Prediction == Choice (Accuracy).
  *   **Board:** Track "Death Accuracy %" (Correct Predictions / Total Rounds).

  #### Round 2: The open book (20 mins)
  *   **Change:** Same rules, but **Step 3 happens before Step 2.**
  *   **Sequence:** Traveller shows Nature Card → Death writes Prediction → **Death reveals Prediction out loud** → Traveller writes Choice.
  *   **Payoffs:** Same as Round 1.
  *   **Intent:** Travellers will see "Stay" and choose "Go" to survive, killing Death's accuracy. This creates the feeling of instability.

  #### Round 3: The randomizer (20 mins)
  *   **Change:** Traveller may pay 3 Tokens to **Delegate**.
  *   **Mechanic:** If Delegated, Traveller rolls 1d6. 1-3 = Stay, 4-6 = Go. This Choice is final.
  *   **Sequence:** Traveller shows Nature Card → Death writes Prediction → Traveller decides to Pay & Roll OR Choose Normally → Reveal.
  *   **Payoffs:** Same as Round 1 (Traveller still gets Integrity points if Roll matches Nature).
  *   **Intent:** Tests if breaking the causal link breaks the prediction.

  #### Round 4: The fallible Death (20 mins)
  *   **Change:** Announce "Death is tired." Accuracy is capped at 80%.
  *   **Mechanic:** If Prediction == Choice, Death rolls 1d10. On a 9 or 10, the prediction counts as **Wrong** anyway (fate glitched).
  *   **Board:** Update the "Death Accuracy %" tally visibly.
  *   **Intent:** Shows where the flip-flopping stops. If accuracy drops, does the Traveller stop trying to outsmart Death?

  ### Minute-by-Minute Timeline (90 mins)
  *   **00-10:** Arrival, drinks, split into pairs. Hand out tokens. **Do not explain the philosophy.** Say: "This is a betting game about prediction. Follow the rules exactly."
  *   **10-30:** **Round 1.** Facilitator walks through steps slowly. Ensure cards are shown then hidden. Calculate scores. Write Round 1 Accuracy on board.
  *   **30-50:** **Round 2.** Swap roles (Death becomes Traveller). Run the "Open Book" variant. Watch the accuracy % drop.
  *   **50-70:** **Round 3.** Keep roles. Introduce the Randomizer option. Ask tables to announce if they paid for the roll.
  *   **70-80:** **Round 4.** Keep roles. Introduce the 80% cap. Run quickly.
  *   **80-90:** **Debrief.** Collect tokens. Put pens down. Talk.

  ### The Board
  *   **Left Side:** "Death's Score" (Total Accuracy Points).
  *   **Right Side:** "Accuracy %" (Running tally: e.g., "Round 1: 85%", "Round 2: 40%").
  *   **Bottom:** "Tokens in Play" (Total Traveller tokens held by room).

  ### Debrief Guide (Mapping Game to Theory)
  *   **When Round 1 Accuracy was high:** "Most of you took the Integrity points. You acted according to your Nature. Death knew your Nature, so Death knew your Choice. This is **Evidential Decision Theory**: your choice is evidence of your type."
  *   **When Round 2 Accuracy crashed:** "You saw the prediction and flipped. You tried to use **Causal Decision Theory**: 'My choice cannot change what is already written.' But if you flip, the prediction *would have been different* had Death known you'd flip. That instability is the paradox."
  *   **When someone used the Randomizer:** "You broke the link between Nature and Choice. Death couldn't predict you anymore. But did it cost too many tokens? Is randomness worth the price?"
  *   **The 'Free Will' Objection:** Address the player who said "I just choose." Ask: "Did you choose against your Nature Card? If yes, you lost Integrity points. If no, Death predicted you. You either lost points or got predicted. Where is the free will that beats the game?"

  ### Failure Modes & Fixes
  *   **Death Cheating (Peeking):** Death looks at the Nature Card during the Choice phase.
      *   *Fix:* Emphasize the "Show then Hide" ritual. If caught, that round is void, Death loses 5 points.
  *   **Collusion:** Pairs agree to split points (Death predicts wrong on purpose so Traveller survives).
      *   *Fix:* Announce a "Grand Prize" for the single highest individual score in the room. This makes everyone compete against everyone, not just their partner.
  *   **Boredom/Confusion:** People forget the payoffs.
      *   *Fix:* Write the Payoff Rules on the Board and leave them there. Point to them every round.
  *   **The "It's Just Luck" Crowd:** They claim the Nature Card is random so the game is meaningless.
      *   *Fix:* Remind them the *Choice* is not random. The card represents *them*. "If the card says Damascus, it means you're the kind of person who stays. The game is about whether you can be someone else."
  *   **Running Over Time:** Rounds drag.
      *   *Fix:* Be a strict timekeeper. Call "Write Prediction" and "Write Choice" with 30-second limits.

  ### What The Game Can't Reproduce (Your Closing Talk)
  This is the bit you must say yourself, because the mechanics can't show it:
  1.  **Logical vs. Causal:** The game simulates prediction via a "Nature Card" (psychological profile). Real Decision Theory argues about whether your choice *logically determines* the prediction, not just correlates with it. The game uses correlation to *feel* like logical necessity.
  2.  **The Single Case:** The game relies on averages (Accuracy %). The paradox bites hardest in a *single* instance where you know the predictor is perfect. The game smooths this out over rounds.
  3.  **Newcomb's Box:** This is "Death in Damascus" (avoiding death), not "Newcomb's Problem" (getting money). The structure is identical, but the stakes feel different. Newcomb's is harder because taking both boxes *causally* gets you more money, even if it proves you're poor. Here, survival is the only goal.
  4.  **The "Why":** The game makes them feel the anxiety of the loop. You need to name it: "You felt unstable because you were trying to be the cause of a fact that was already fixed. That feeling is the boundary between being an agent and being an object."
