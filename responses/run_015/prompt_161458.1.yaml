  ### 8. Verbal vs. Substantive Discomfort

  **Case 4 (Imperceptible Losses):**
  *   **Substantive.** This is a genuine conflict between *Aggregation* (losses add up) and *Non-Aggregation* (no one is harmed). Your principle resolves this by choosing Aggregation (losses add up). The discomfort is the cost of rejecting the "No One Is Harmed" intuition.

  **Case 9 (Concentration):**
  *   **Verbal/Frame.** Your discomfort here is likely due to the phrasing "resources the tenth would have used are redistributed." This frames the 10th person as having a prior claim, making the 9-person outcome look like a "harm" to the 10th. Since the 10th never exists, this is a verbal frame. Substantively, it is identical to Case 6 (Dilution). If you reframe Case 9 as "Choice between a world with 9 gods or 10 mortals," your intuition might align with Case 6.

  **Case 10 (Risk over Existence):**
  *   **Substantive.** This is **Existence Risk Aversion**. It is not verbal. It commits you to the view that the value of existence is concave (diminishing marginal value) or that "nothingness" has a specific weight that makes a 50% chance of it worse than a certainty of a lower-value existence. This is a robust axiological commitment, not a confusion.
