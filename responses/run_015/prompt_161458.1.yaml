  ### 1. Candidate Principle

  I propose replacing your "threshold minus constant" draft with a **Critical-Level View with Negative Lexicality and Supererogatory Creation**. This principle separates the *value* of an outcome from the *obligation* to bring it about, and it treats negative welfare segments as lexically prior to positive aggregates.

  **The Principle:**

  1.  **The Negative Lexicality Clause:** An outcome $A$ is worse than outcome $B$ if any person in $A$ undergoes a stretch of life below welfare level 0, and no person in $B$ does, unless the gain to others in $A$ is sufficiently massive to override this veto (a lexical threshold).
      *   *Motivated by:* Case 3 (Bad Stretch), Case 11 (Risk of Negative).
      *   *Strains against:* Case 4 (Imperceptible Losses), where you are torn between aggregation and non-aggregation.

  2.  **The Critical-Level Sum:** For outcomes where no negative stretches occur, the value of an outcome is the sum of $(W_i - C)$ for all persons $i$, where $W_i$ is lifetime welfare and $C$ is a critical level fixed at 50.
      *   *Motivated by:* Case 5 (Repugnant Conclusion), Case 6 (Equal Totals/Dilution), Case 2 (Barely Worth Living).
      *   *Strains against:* Case 7 (Small Step), Case 9 (Concentration).

  3.  **The Supererogation Clause:** If Outcome $A$ has higher value than Outcome $B$ solely because $A$ contains additional persons with welfare above $C$, then $A$ is *better* than $B$, but choosing $B$ is *permissible*.
      *   *Motivated by:* Case 1 (Adding Flourishing).
      *   *Strains against:* Standard maximizing consequentialism (which would require $A$).

  4.  **The Risk Discount:** When calculating expected value for potential persons, variance involving negative welfare outcomes is penalized heavily; expected welfare is not sufficient if the lower bound dips below 0.
      *   *Motivated by:* Case 10 (Risk over Existence), Case 11 (Risk about Quality).
      *   *Strains against:* Standard Expected Utility Theory.

