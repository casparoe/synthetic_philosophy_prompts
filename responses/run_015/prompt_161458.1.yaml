  ### 7. Verdicts on New Cases

  Based on the **Critical-Level (50) + Negative Lexicality** principle recommended above:

  **(a) Ten at +100 vs. Ten Trillion at +98.**
  *   **Verdict:** **Ten Trillion at +98 is Better.**
  *   **Reasoning:** Both are well above the Critical Level (50). The drop from 100 to 98 is negligible in terms of human capability, but the total value (10T * 48 vs 10 * 50) is astronomically higher.
  *   **Stability:** **Unstable.** This is the "Very Repugnant Conclusion." If you feel discomfort here, it suggests your Critical Level should be higher (closer to 98), or you need a lexical threshold for "Peak Flourishing."

  **(b) 100 people (400 yrs @ 100) vs. 500 people (80 yrs @ 100).**
  *   **Verdict:** **100 people (Long Lives) is Better.**
  *   **Reasoning:** Total life-years and welfare level are identical. Case 6 and 8 establish a preference for fewer subjects when total good is fixed (Anti-Dilution/Anti-Fission).
  *   **Stability:** **Stable.** Consistent with Case 6 and 8.

  **(c) 8 Billion @ 50 (10k gens) vs. 8 Billion @ 50 (3 gens then end).**
  *   **Verdict:** **Long Future is Better, but not Required.**
  *   **Reasoning:** +50 is at the Critical Level. Adding lives at the critical level adds zero value (100-50=50? No, 50-50=0). However, since they are above 0, the Supererogation Clause applies. It is better they exist, but you are not required to ensure it.
  *   **Stability:** **Stable.** Consistent with Case 1.

  **(d) 8 Billion @ 50 vs. 8 Billion @ 49.5 + 1 Billion @ 40.**
  *   **Verdict:** **Status Quo (8 Billion @ 50) is Better.**
  *   **Reasoning:** The existing 8 billion suffer a loss (50 -> 49.5). If 50 is the Critical Level, they drop below it, incurring a negative score. The new 1 billion are at +40 (below Critical Level), contributing negative value (40-50 = -10). Both changes reduce value.
  *   **Stability:** **Stable.** Consistent with Case 2 and Case 4 (losses add up).

