prompt: |-
  Six weeks ago I became quality manager at a small food manufacturer — about 30 of us, one line, ready meals for a couple of retailers. I'm the one who signs the release certificate for each batch, a couple a week, sometimes same-day with a lorry sitting on the yard. The stakes swing about wildly: undeclared allergen cross-contact could put someone in hospital, a slightly-out net weight is basically nothing at all.

  I've been reading around about pragmatic encroachment — roughly, that whether you know something can depend on what turns on being right — and also epistemic contextualism, which I think is a different claim about the word 'knows' rather than about knowledge itself. I honestly can't tell which of them, if either, is any use to me.

  Could you write a decision procedure my deputy and I could actually run on a release decision? The questions to ask in order, what counts as a settled answer to each, how the stakes get into the threshold without the threshold collapsing into 'whatever feels safe today', what to do when more evidence is available but only by delaying the batch, and where the procedure stops and hands the call to me or to the technical director because it's a question of values rather than facts. I'd especially like it to say which of the two ideas is doing any work in it and what happened to the other one — whether you dropped it, or whether it changes how I *talk* about a decision afterwards (incident reports, audits, a journalist ringing up) as opposed to how I make it. And flag the steps that are really just judgement in a procedural costume; I dont want false comfort, and no reading lists or references.

  Then run it on three cases: (1) supplier's certificate says the ingredient is allergen-free, but the certificate is generic and two years old; (2) a batch that failed one of three replicate listeria tests, the other two clean; (3) a purely cosmetic labelling error that will annoy the retailer and harm nobody. In at least one of those I want it to land somewhere I won't like — if it just tells me to hold everything, I'll know it's useless.

  Please write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Quality Manager at a small food manufacturer (30 staff, one line, ready meals, retail clients).
      *   **Responsibility:** Signs release certificates for batches (high stakes: allergens vs. low stakes: net weight).
      *   **Problem:** Needs a practical decision procedure for batch release that incorporates philosophical concepts (Pragmatic Encroachment vs. Epistemic Contextualism) without being abstract or academic.
      *   **Specific Requirements:**
          *   Write a decision procedure (questions in order, settled answers, stakes integration, evidence vs. delay trade-off, escalation points).
          *   Explain which philosophical concept is doing the work and what happened to the other.
          *   Flag steps that are essentially judgement in procedural clothing (no false comfort).
          *   Run the procedure on three specific cases (Allergen cert, Listeria split, Cosmetic label error).
          *   At least one case must result in an uncomfortable decision (not just "hold everything").
          *   Language: British English.
          *   Constraints: No reading lists, no references, practical tone.

  2.  **Deconstruct the Philosophy:**
      *   *Pragmatic Encroachment:* Knowledge depends on stakes. If the cost of being wrong is high (allergen death), you need more evidence to claim you "know" it's safe. If the cost is low (net weight), less evidence suffices. This fits the *decision-making* process perfectly.
      *   *Epistemic Contextualism:* The meaning of "knows" changes based on the context of the conversation. This is more about *language* and *attribution* (e.g., how you defend the decision in an audit or court).
      *   *Integration:* Use Pragmatic Encroachment to set the *threshold* for release (the action). Use Contextualism to frame the *justification* (the communication/audit trail).

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Move from abstract philosophy to a shop-floor checklist.
      *   *Structure:*
          1.  Classify the Risk (Stakes).
          2.  Assess the Evidence (Current State).
          3.  The Gap Analysis (Do we have enough?).
          4.  The Cost of Delay (Pragmatic trade-off).
          5.  Escalation (Values vs. Facts).
      *   *Stakes Integration:* Needs a matrix or scoring system. High stakes = High evidence threshold. Low stakes = Lower threshold.
      *   *Avoiding "Whatever feels safe":* Needs predefined risk categories (Critical, Major, Minor) linked to specific evidence requirements.
      *   *Judgement Flags:* Explicitly mark where human intuition overrides the checklist.

  4.  **Addressing the Philosophy in the Output:**
      *   Need to be clear: Pragmatic Encroachment drives the *threshold*. Contextualism drives the *record-keeping/explanation*.
      *   Why drop Contextualism for the decision? Because the decision is about action (release/hold), not just speech. But Contextualism saves you when explaining *why* you released a minor fault but held a major one.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Allergen Cert):* High stakes. Old cert is insufficient. Procedure should demand new evidence or hold. *Uncomfortable outcome:* Hold the batch, anger logistics, despite supplier saying it's fine.
      *   *Case 2 (Listeria Split):* High/Medium stakes. 1 fail out of 3. Statistical anomaly vs. real risk. Procedure should likely lean towards Hold/Investigate, but maybe allow release if specific criteria met (e.g., re-test). Let's make it uncomfortable: Hold, because 1 positive in pathogen testing is usually a hard stop in ready meals, regardless of replicates.
      *   *Case 3 (Cosmetic Label):* Low stakes. Retailer annoyed, consumer safe. Procedure should allow release (perhaps with concession). *Uncomfortable outcome:* Release, knowing the retailer will shout, because holding is wasteful and unsafe. (Or vice versa: Hold, knowing it's wasteful, to maintain discipline). Let's go with Release with Concession to show the stakes adjustment.

      *Refining Case 2 for "Uncomfortable":* If I tell them to release on a 1/3 Listeria fail, that's negligent. If I tell them to hold, that's standard. To make it *uncomfortable*, maybe the procedure says "Hold" even though the line manager says "It's a lab error." Or, for Case 1, the procedure says "Hold" despite the lorry waiting. Let's make Case 1 the "Hold the lorry" scenario. That hurts commercially.

  6.  **Writing - Tone and Style:**
      *   British English (colour, centre, programme, lorry, etc.).
      *   Direct, professional, slightly weary but authoritative (matching the user's position).
      *   No academic jargon in the procedure itself.

  7.  **Review against Constraints:**
      *   Decision procedure included? Yes.
      *   Questions in order? Yes.
      *   Settled answers defined? Yes.
      *   Stakes integration? Yes.
      *   Evidence vs. Delay? Yes.
      *   Escalation points? Yes.
      *   Philosophy explained? Yes.
      *   Judgement flags? Yes.
      *   Three cases run? Yes.
      *   Uncomfortable outcome? Yes.
      *   British English? Yes.
      *   No references? Yes.

  8.  **Drafting Content (Iterative refinement):**
      *   *Self-Correction on Philosophy:* Make sure I don't get bogged down defining them. Just state how they apply. Encroachment = The Brake Pedal. Contextualism = The Logbook.
      *   *Self-Correction on Procedure:* Ensure it doesn't look like a generic ISO checklist. It needs to reflect the *epistemic* tension (how much proof is enough?).
      *   *Self-Correction on "Judgement in Costume":* Be honest. The risk classification is subjective. The "acceptable delay" is subjective. Mark these clearly.

  9.  **Final Polish:** Check the "Uncomfortable" requirement. Case 1 (Allergen) must result in a Hold, delaying the lorry. Case 3 (Label) must result in a Release, annoying the retailer. This shows the stakes shifting the threshold.

      *(Self-Correction during drafting Case 2)*: A 1/3 Listeria fail in ready meals is usually an automatic reject in the UK (FSA guidelines). If I say release, I'm liable. If I say hold, it's standard. To make it interesting, I'll make the procedure demand a specific *type* of evidence to overturn the fail, which likely isn't there, leading to a Hold. I will make Case 1 the commercially painful Hold.

      *(Refining the Philosophy explanation)*: Keep it tight. Encroachment changes the *standard of proof*. Contextualism changes the *description of certainty*.

      *(Judgement Flags)*: I need to explicitly label steps like "⚠️ JUDGEMENT CALL".

  10. **Final Read-Through:** Check British spelling (authorise, programme, centre, manoeuvre). Ensure tone is empathetic to the pressure (lorry waiting).

  *(Final thought on the "Uncomfortable" outcome)*: The prompt asks for "In at least one of those I want it to land somewhere I won't like". Releasing a cosmetic error might annoy the retailer (uncomfortable relationship). Holding an allergen batch annoys logistics (uncomfortable commercial pressure). I will ensure Case 1 results in a Hold despite the lorry waiting. That is the most visceral "Quality vs. Production" conflict.

