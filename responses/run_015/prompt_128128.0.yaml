answer: |-
  Thanks for sending this over, because it captures exactly the kind of friction that happens when practical prioritization meets metaethical uncertainty, and you are right to feel that the person in that thread was likely conflating several distinct claims that do very different work. It is frustrating when someone blocks a comparison by invoking the apples and oranges slogan and then immediately acknowledges tradeoffs, because admitting a tradeoff is essentially admitting comparability, even if only in the weak sense that choosing one involves sacrificing the other. To give you the messy menu you asked for, we need to disentangle the epistemic claims from the metaphysical ones, and then look at the structural claims about value relations themselves, because the slogan is doing heavy lifting in at least three different registers here.

  The first and most charitable reading is purely epistemic. On this view, there is a fact of the matter about whether AI safety work is better than malaria work, or perhaps even a precise conversion rate between lives saved and existential risk reduced, but we simply lack the knowledge to access it. This is the claim that the variables are too uncertain, the models too fragile, or the values too complex for us to confidently assign a number. This reading is trivial in the sense that everyone agrees uncertainty exists, but it is defensible as a caution against false precision. However, it does not license refusing to put the two careers on one scale; it only licenses putting wide error bars on the scale. If the claim is merely that we cannot know the ratio, then the rational response is to estimate expected value with humility, not to declare the comparison impossible. The contradiction you noticed arises here because if everything is a tradeoff, we are forced to act as if there is a ratio, even if it is a guessed one. So if the person meant only that we cannot know the precise number, their later comment about tradeoffs is consistent, but their refusal to rank is overly strong; they should be saying we cannot rank confidently, not that we cannot rank at all.

  The second reading is metaphysical and concerns incommensurability. This is the claim that there is no common unit of value, no single currency like welfare units or QALYs that can measure both AI safety and malaria prevention. This is often what people mean by apples and oranges. Technically, incommensurability does not entail incomparability. You can have an ordering without a unit. For example, I might know that I prefer chocolate to vanilla without being able to say exactly how many units of pleasure chocolate yields compared to vanilla. So even if there is no common unit, there could still be a fact of the matter that one option is better than the other. This claim is substantive and widely debated. Many consequentialists assume a common currency exists, while value pluralists deny it. However, even if this claim is true, it does not license refusing to rank the options unless you also hold that ranking requires a common unit. Most decision theory only requires an ordinal ranking, not a cardinal measure. So this reading alone does not block the prioritization exercise, it just blocks the precision.

  The third reading is the strong one, which is incomparability. This is the claim that no positive value relation holds between the two options. It is not that one is better, nor that they are equal, nor that we just don't know. It is that the relation is undefined. This is where the fourth relation you mentioned comes in, often discussed by Ruth Chang and Derek Parfit under the label on a par. The idea is that hard choices are hard not because of ignorance, but because the options are incomparable in a way that leaves rational choice underdetermined. This claim is substantive and controversial. It is defensible if you are a value pluralist who thinks different values belong to different spheres that cannot interact normatively. However, this reading faces the small improvement argument you alluded to. If A and B are incomparable, and I make A slightly better to get A+, surely A+ is better than B. But if A+ is better than B, and A is not worse than A+, then by transitivity A should be better than B, which contradicts the starting assumption. To avoid this, the incomparabilist must deny transitivity or deny that small improvements always flip the relation. This leads to the money pump problem you mentioned. If your preferences are non-transitive because of incomparability, a clever agent could trade you A for B, B for A+, and A+ for A plus a small fee, leaving you worse off. Most philosophers working in practical reason think rational choice requires transitivity, so this reading is often seen as threatening rational agency itself. If this claim is true, it does license refusing to put the options on one scale, but at the high cost of making rational choice impossible in those cases. You cannot choose rationally without some comparison, unless you adopt a view like Chang's where the act of choosing creates the reason rather than tracking it. But that is a minority view.

  The fourth reading is lexical priority. This is the claim that one value always trumps the other regardless of magnitude. For example, if existential risk reduction is lexically prior to health improvement, then any amount of AI safety work is better than any amount of malaria work. This is technically a comparison, so the slogan you can't compare is self-underundermining if this is what is meant. It is saying the comparison is trivial because one side always wins. This claim is substantive but usually false in practice. It fails the small improvement test on the other side. Is one hour of AI safety work really better than preventing a million cases of malaria? Most people's intuitions say no. If the lexical priority collapses under large enough numbers on the losing side, then it is not lexical, it is just weighted. If it does not collapse, it leads to absurd conclusions. So this reading is rarely defensible in global prioritization contexts, though it often drives people's intuitions when they feel one cause is sacred and the other secular.

  Now, regarding your pet hypothesis about aggregation and marginal conversion rates emerging over time. This is a fascinating idea that touches on revealed preference theory and pragmatic accounts of value. The claim is that even if there is no metaphysical fact about the conversion rate between AI safety and malaria, the act of making repeated choices forces a conversion rate into existence behaviorally. If you allocate a budget over time, you will eventually reach a margin where you are indifferent between putting the next dollar into AI safety or malaria. At that margin, you have effectively constructed a conversion rate. Is this cheating? It depends on your metaethics. If you are a realist about value, you might say this is just revealing your subjective preferences, not tracking objective value, so it doesn't rescue comparability in the metaphysical sense. But if you are a pragmatist or a constructivist, you might say that value is determined by what we have reason to choose, so the emergence of a marginal rate just is the creation of comparability. It is not cheating; it is how value works in practice.

  Does it matter that the two careers are one person's whole life rather than a split between two strangers? Yes, it matters for the aggregation argument. If it is a single lifetime choice, you do not get repeated marginal adjustments. You choose once. This makes the incomparability worry more potent because you cannot smooth out the decision over time. However, even in a single choice, you are implicitly comparing the lifetime trajectory of one against the other. The aggregation argument suggests that even if single choices are hard, the fact that you live in a world where resources are fungible means that incomparability cannot persist globally. If AI safety and malaria were truly incomparable, you could not rationally choose between funding one or the other in a charitable budget, yet organizations do this constantly. The fact that they can do it suggests that either they are wrong, or incomparability is false, or that comparability emerges at the level of resource allocation even if it is obscure at the level of abstract value. I think the strongest version of your hypothesis is that incomparability is a local phenomenon that washes out under global constraints. This is defensible and not cheating, provided you accept that practical reason is constrained by the need to act consistently over time.

  As for what is settled versus contested, I need to be explicit here because the field is not unified. It is settled among economists and most effective altruism practitioners that comparability is a necessary working assumption. You cannot do cost-effectiveness analysis without it. However, among academic philosophers working in value theory, it is live contested whether incomparability is real. The small improvement argument is widely accepted as a strong challenge to incomparability, but not everyone accepts it as decisive. Some pluralists bite the bullet and accept non-transitivity or deny the small improvement premise. The consensus view, if there is one, is probably that radical incomparability is rare, but that epistemic uncertainty is vast. The claim that there is no fact of the matter is a minority view compared to the view that there is a fact but we cannot know it. Where I am guessing is on the weight of recent work in constructivism; there is a growing sense that value might be more flexible than realists allow, which would support your aggregation hypothesis, but this is not yet the dominant paradigm.

  So to bring this back to the person in the thread, they were likely oscillating between the epistemic claim and the metaphysical claim. When they said you can't compare, they probably felt the metaphysical weight of incommensurability, but when they said everything is a tradeoff, they acknowledged the practical reality of opportunity cost. The slogan was doing work to protect them from the anxiety of making a hard choice under uncertainty, and perhaps to signal virtue by refusing to quantify the unquantifiable. But strictly speaking, if they accept tradeoffs, they accept comparability, even if only ordinal. The only way to hold both lines is to claim that while tradeoffs exist, there is no rational basis for preferring one side over the other, which leaves them with the money pump vulnerability unless they adopt a view where choice is not about tracking value but creating it.

  In sum, the tidy answer is that the slogan is usually false or confused in this context because tradeoffs imply a common currency of opportunity cost. The messy answer is that there are defensible positions where value relations are partial or undefined, but maintaining them requires giving up standard models of rational choice or accepting that rationality allows for non-transitive preferences in hard cases. Your hypothesis about aggregation is one of the best ways to bridge the gap, suggesting that even if value is pluralistic at the foundation, it becomes comparable at the margin of action. This doesn't solve the metaphysical worry for a realist, but it solves the practical problem for an agent who needs to live a life without being money-pumped. I hope this helps you navigate the conversation, because pointing out that admitting tradeoffs commits them to comparability is the strongest lever you have to move the discussion from slogan to substance.
