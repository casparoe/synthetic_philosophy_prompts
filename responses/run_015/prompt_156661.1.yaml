      *   *Refining the "Fatal" Section:* Focus on Hayden White's specific point. It's not just that narratives differ; it's that the *criteria* for choosing them are aesthetic/moral, not empirical. If I choose "Tragedy" because it teaches a moral lesson, that's not model selection; that's art.
