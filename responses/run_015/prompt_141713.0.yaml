      *   I need to create a taxonomy of these claims.
      *   *Level 1: Influence on Performance/Attention.* Language makes certain distinctions salient or easier to process.
      *   *Level 2: Habitual Thought.* Language encourages certain patterns of thinking because they are grammatically obligatory.
      *   *Level 3: Cognitive Tooling.* Language acts as a scaffold for complex reasoning (e.g., exact arithmetic).
      *   *Level 4: Strong Determinism.* Language makes certain concepts *impossible* to entertain.

  3.  **Drafting the Menu of Claims (Iterative Process):**
      *   *Claim A (The Labeling Effect):* Having a word makes discrimination faster/easier. (Platitude/Defensible).
      *   *Claim B (Obligatory Attention):* Grammar forces you to notice things (e.g., gender, evidentiality). (Defensible).
      *   *Claim C (Cognitive Scaffolding):* Language provides tools for tasks that exceed raw cognition (e.g., exact numbers). (Defensible/Nuanced).
      *   *Claim D (Conceptual Availability/Strong Determinism):* If you lack the structure, you lack the concept entirely. (False/Undefensible).

  4.  **Analyzing the Friend's Vashni Claims:**
      *   *Claim 1: Numbers (No "seven").* Friend says: Cannot grasp exact quantity.
          *   Requires: Strong Determinism or Heavy Scaffolding.
