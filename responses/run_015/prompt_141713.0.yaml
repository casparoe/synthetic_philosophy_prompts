answer: |-
  Here is the conceptual map. I will break down "language shapes thought" into four distinct theses, ranked by strength. Then I will apply them to your friend's Vashni claims to see which ones hold water and which sink.

  ### Part 1: The Menu of Claims
  From "Trivial" to "Metaphysically Wild"

  **1. The Labeling Effect (Influence on Memory & Salience)**
  *   **The Claim:** Having a lexical label for a distinction makes it easier to encode, store, and retrieve that distinction. It lowers the cognitive load for discrimination tasks.
  *   **Status:** **Platitude.** Virtually uncontroversial. If I give you a name for a specific shade of teal, you will recognize it faster next time than if I don't. This is about processing efficiency, not conceptual capacity.

  **2. Obligatory Attention (Habitual Thought)**
  *   **The Claim:** Grammatical obligations force speakers to attend to specific aspects of reality every time they speak. If your language requires you to mark the gender of a noun, or the evidential source of a claim (how you know it), you are habitually primed to notice those features more than a speaker who isn't forced to mark them.
  *   **Status:** **Contestable but Defensible.** There is good evidence that grammatical requirements shift attentional patterns. However, "attending to" is not the same as "conceptualizing." You can attend to something without it defining your ontology.

  **3. Cognitive Scaffolding (Tool-Mediated Thought)**
  *   **The Claim:** Language provides external tools that allow the brain to perform computations it cannot easily perform in "raw" cognition. Language acts as a technology for thinking, particularly for recursion, exact arithmetic, or complex hypothetical reasoning. Without the tool, the *operation* is prohibitively difficult or unstable, though not strictly impossible.
  *   **Status:** **Defensible (with nuance).** This is the strongest defensible position. It suggests that while you might *feel* a quantity or a possibility, you cannot manipulate it precisely or hold it in working memory without the linguistic scaffold.

  **4. Strong Determinism (Conceptual Availability)**
  *   **The Claim:** The structure of language constitutes the structure of thought. If a grammatical structure or lexical distinction does not exist, the corresponding concept cannot be entertained. The boundary of language is the boundary of the thinkable.
  *   **Status:** **False.** This is the "prison" view. It conflates the *expression* of a thought with the *existence* of a thought. It is incompatible with evidence of pre-linguistic cognition in infants and non-human animals who lack these linguistic structures but demonstrate the relevant cognitive behaviors.

  ---

  ### Part 2: The Verdict on Vashni
  Your friend's slogan ("you can't think what your language gives you no way to say") is a pure expression of **Strong Determinism (Claim 4)**. Let's see what reading he *needs* for each Vashni feature to make his specific claims true, and whether that reading works.

  **1. The Number Claim**
  *   **Vashni Feature:** No number words past "few/many."
  *   **Friend's Claim:** Speakers cannot grasp that there might have been *exactly seven* of something.
  *   **Reading Required:** **Cognitive Scaffolding (3)** or **Strong Determinism (4).**
  *   **Analysis:**
      *   *Approximate number sense* is innate (present in infants and animals). They can distinguish 7 from 10 easily.
      *   *Exact number concepts* (the integer "7") likely require linguistic scaffolding (Claim 3). Without number words, holding the exact quantity "7" in mind distinct from "8" is cognitively unstable.
      *   *Verdict:* Your friend is half-right but overstates it. They likely cannot *conceptualize exact integers* reliably (Scaffolding), but they can certainly perceive the quantity. If he claims they can't perceive the difference between 7 and 8 objects, he is relying on Strong Determinism (4), which is false. If he claims they can't *reason* about "exactly seven," he is on defensible ground (Scaffolding), provided he admits it's a limitation of precision, not perception.

  **2. The Counterfactual Claim**
  *   **Vashni Feature:** No conditional/counterfactual construction (only actuals).
  *   **Friend's Claim:** Speakers cannot think "if I hadn't missed the bus."
  *   **Reading Required:** **Strong Determinism (4).**
  *   **Analysis:**
      *   Counterfactual reasoning is essential for planning and causal learning. Animals engage in counterfactual-like behavior (e.g., "if I go left, I get food; if I go right, I get shock").
      *   Language allows us to *communicate* and *complexify* counterfactuals, but the basic cognitive machinery for simulating non-actual scenarios is pre-linguistic.
      *   *Verdict:* **False.** Your friend needs the Strong Determinism reading here. Without it, the claim collapses. A Vashni speaker can regret missing the bus. They can imagine a world where they caught it. They just can't *say* it using a specific grammatical marker. Confusing the grammar with the cognition is a category error.

  **3. The Color Claim**
  *   **Vashni Feature:** Single term for Blue/Green.
  *   **Friend's Claim:** Speakers cannot *experience* blue and green as different shades.
  *   **Reading Required:** **Strong Determinism (4)** (specifically regarding phenomenology).
  *   **Analysis:**
      *   Color discrimination is physiological (cone cells in the eye). It happens before language processing.
      *   The *Labeling Effect (1)* suggests they might be slower to distinguish or remember which chip was which.
      *   *Verdict:* **False.** "Cannot experience" is a claim about qualia/perception. Language does not reach down and change the wavelength sensitivity of the retina. He is conflating *categorization* with *perception*. They see the difference; they just group it under one label.

  ---

  ### Part 3: The Diagnosis
  Your friend is hiding behind a slogan that sounds profound but is technically bankrupt.

  *   **His Slogan:** "You can't think what your language gives you no way to say."
  *   **The Reality:** "You can't *say* what your language gives you no way to say."
  *   **The Gap:** He assumes the map is the territory. He is arguing for **Strong Determinism (4)** across all three domains.
  *   **The Problem:** Strong Determinism is the only reading that delivers his dramatic conclusions ("literally cannot grasp," "cannot experience"), and Strong Determinism is the only reading that is demonstrably false.
  *   **The Concession:** If he retreats to **Cognitive Scaffolding (3)** for numbers and **Labeling (1)** for color, he becomes defensible, but his claims become boring. He would have to admit: "Vashni speakers find exact math hard" (true) instead of "They can't grasp seven" (false). He would have to admit: "They distinguish blue/green slower" (true) instead of "They don't experience them as different" (false).

  He wants the dramatic conclusion without accepting the boring premises that lead to it.

  ---

  ### Part 4: Evidence Without Questions
  You asked how we test this without asking "Do you have concept X?" Since Vashni speakers can't tell us, we must use non-linguistic behavioral proxies.

  **1. For Numbers (Exact vs. Approximate)**
  *   **The Match-to-Sample Task:** Show a Vashni speaker a set of 7 nuts. Hide them. Ask them to produce the same amount from a larger pile.
      *   *Prediction:* If they lack the concept, their production will vary wildly (sometimes 6, sometimes 8) following the Weber-Fechner law (ratio-dependent error). If they have the concept, accuracy will be high regardless of ratio.
  *   **The Surprise Paradigm:** Show 7 objects going behind a screen, add 1, remove the screen. If they see 6 or 8, do they look longer (violation of expectation) than if they see 7? This tests innate arithmetic without words.

  **2. For Counterfactuals (Planning & Regret)**
  *   **Contingency Planning:** Set up a task where the obvious path is blocked, but a tool was left at the start that *would have* helped if brought along.
      *   *Test:* Do they show signs of anticipating the blockage in future trials? Do they show frustration (emotional marker of counterfactual "I should have...") when they fail?
      *   *Logic:* You cannot learn from mistakes without simulating a world where you didn't make the mistake. If they learn, they have counterfactuals.
  *   **Causal Intervention:** Give them a machine that works only if two switches are flipped. Break one. Do they understand that *if* it weren't broken, it would work? Test this by seeing if they try to fix the switch rather than abandoning the machine.

  **3. For Color (Perception vs. Categorization)**
  *   **Speeded Discrimination:** Flash a Blue chip, then a Green chip. Ask "Same or Different?" (using a binary gesture, not words).
      *   *Prediction:* They will get it right (Perception intact).
  *   **Memory Delay:** Show a Blue chip. Wait 30 seconds. Show two chips (one the original Blue, one slightly greener). Ask them to pick the original.
      *   *Prediction:* They will perform worse than a speaker with distinct labels (Labeling Effect). This proves language affects *memory*, not *vision*.

  **Summary for your next drink:**
  Tell him he's conflating *computational scaffolding* with *ontological prison*. Language is a tool for thinking, not the engine of thought itself. If Vashni speakers can learn from mistakes, distinguish shades, and estimate quantities, his "Strong Determinism" is dead. If he insists they can't, he owes you a mechanism for how grammar overwrites physiology.
