          *   Causation. PL defines transitions axiomatically ($\langle S, e \rangle \to \langle S', e' \rangle$). Philosophy asks if the arrow $\to$ represents physical causation or just logical succession.
          *   Intervention. PL assumes the transition function holds. Philosophy asks "What if we broke the transition function?" (Counterfactuals).

  6.  **Address Specific Questions (a, b, c):**
      *   *(a) Run vs. Program / Token Identity:* Is this smuggling metaphysics? Yes. In PL, a run is just a sequence of states. In Philosophy, a run is an *event*.
      *   *(b) Counterfactuals in PL:* PL is usually extensional. To state counterfactuals, you need a causal model layer (e.g., structural equation models over the LTS). Does this assume the conclusion? It assumes causation is distinct from correlation/logic.
      *   *(c) PL Toolkit against her:* Observational Equivalence / Full Abstraction. If two systems are contextually indistinguishable, PL says they are the "same." She says they might not be (one might be a lookup table). This is a clash between *extensional* (PL) and *intensional* (Philosophy) views.

