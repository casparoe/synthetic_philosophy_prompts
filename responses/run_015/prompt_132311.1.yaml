      *   *Replication (Case 1):* $N$ independent LTS instances processing same input stream.
      *   *Replay (Case 2):* One trace recorded, played back. No branching, no input handling during replay.
      *   *Dedup/Hash-consing (Case 3):* State sharing. If $S_t^A = S_t^B$, point to same memory. Divergence triggers copy-on-write.
      *   *Memoization/Lookup (Case 4):* Function $f(x)$ replaced by table $T$. No intermediate state transitions, just $O(1)$ lookup.
      *   *Unobserved States (Case 5):* States computed but not part of the observable interface (internal vs. external visibility).
      *   *Causal-Counterfactual:* If state $S_i$ were different, would $S_{i+1}$ be different *because* of the transition function, or just because the table says so? Interventions on the transition function $\delta$.

  4.  **Map Rival Positions:**
      *   *Strong Functionalism (Abstract Computation):* If the trace matches the spec, it counts. (Trace Equivalence).
      *   *Causal/Counterfactual (Friend's View):* Needs Bisimulation + Causal Structure. The transitions must be *active*, not passive.
      *   *Lookup Table Objection:* A giant table is extensionally equivalent but intensionally empty.
