      *   **Goal:** Restate the friend's position in PL/DS terms, compare with rival positions, map philosophical concepts to PL concepts (LTS, bisimulation, traces, etc.), identify the "residue" (what doesn't map), and answer specific questions (a, b, c) about whether the disagreement is substantive or linguistic/conceptual mismatch.
      *   **Constraint:** No paper citations or author name-dropping. Focus on the *shape* of the disagreement.

  2.  **Deconstruct the Friend's Position (Philosophy of Mind):**
      *   *Core Claim:* Moral status depends on *concrete computations* occurring.
      *   *Condition:* States must stand in "causal-counterfactual relations." They must be "doing work," be "intervenable," not just recorded/replayed/deduplicated.
      *   *Substrate Independence:* Abstract computation can be multiply realized, *but* not every encoding/trace/lookup table counts.
