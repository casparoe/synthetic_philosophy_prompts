answer: |-
  Here is the shape of the disagreement, translated into your vocabulary, followed by the residue report and answers to your specific questions.

  ### 1. Restating Her Position in PL/DS Terms

  Your friend is arguing for a **Causal-Process Theory** of moral status, which you can model as a constraint on the *transition relation* of your Labelled Transition System (LTS).

  *   **The Setup:** You have a spec $S$ and an implementation $I$. $I$ produces a trace $T = s_0, s_1, \dots, s_n$.
  *   **Her Claim:** Moral status supervenes not on the existence of the trace $T$ (the sequence of states), nor on the extensional input-output behavior, but on the *mechanism* generating $T$.
  *   **The Constraint:** The transition relation $\to$ must represent **active causal dependence**, not just logical succession or retrieval.
      *   **Case 1 (Replicas):** 1000 independent LTS instances. Each has its own transition function actively computing $s_{i+1}$ from $s_i$. **Verdict:** 1000 minds.
      *   **Case 2 (Replay):** The trace $T$ is stored. The "runtime" just iterates the log. $s_{i+1}$ follows $s_i$ because it is next in the array, not because $\delta(s_i) = s_{i+1}$. **Verdict:** 0 minds (it's a recording).
      *   **Case 3 (Dedup/Hash-consing):** Two replicas share a pointer to state $s_k$. If they diverge later, copy-on-write occurs. **Verdict:** Ambiguous/Reduced. She likely argues that while pointers are shared, the *computation* of the next state must be distinct per replica. If the physical substrate merges, the causal pathways merge.
      *   **Case 4 (Memoization/Lookup):** The "computation" is a table lookup. $s_{i+1}$ is retrieved, not derived. **Verdict:** 0 minds. The counterfactual "if $s_i$ were different, $s_{i+1}$ would change *because* of the transition function" is false; it changes only because the table entry is different.
      *   **Case 5 (Unobserved Intermediates):** States are computed but pruned before output. **Verdict:** Minds exist, but the unobserved states are morally inert (epiphenomenal).

  **In your jargon:** She is claiming that **Trace Equivalence** is insufficient for **Moral Equivalence**. She requires a stronger relation, akin to **Bisimulation** plus a constraint on the *intensionality* of the transition function. The transition function must be *evaluated*, not *satisfied*.

  ### 2. The Rival Positions on the Table

  Here are the four main stances, mapped to your toolkit:

  1.  **Strong Functionalism (The "Compiler" View):**
      *   **Claim:** If the implementation refines the spec (correctness), and the spec is a mind, the implementation is a mind.
      *   **PL Equivalent:** **Refinement / Correctness.** If $I \sqsubseteq S$, then $I$ inherits the properties of $S$.
      *   **Implication:** Cases 1, 2, 3, and 4 are all morally equivalent if they produce the same observable trace. A lookup table is a valid implementation of the function. Optimization (dedup, memoization) preserves moral status.

  2.  **Causal-Structure Realism (Your Friend's View):**
      *   **Claim:** The abstract computation must be *realized* by physical states standing in causal relations.
      *   **PL Equivalent:** **Intensional Equality.** $\lambda x. x + x$ is not the same as $\lambda x. 2 * x$, even if extensionally equal. The *derivation tree* matters, not just the root.
      *   **Implication:** Replay and Lookup Tables fail because the derivation tree is collapsed.

  3.  **The Lookup Table Objection (Complexity/Entropy View):**
      *   **Claim:** A system that merely stores inputs and outputs lacks the internal complexity required for mind.
      *   **PL Equivalent:** **Kolmogorov Complexity / Description Length.** The size of the program vs. the size of the trace. A lookup table for a complex mind is exponentially larger than the generator.
      *   **Implication:** Case 4 is ruled out not because it's not a function, but because the resource bounds make it physically impossible to instantiate for a non-trivial mind.

  4.  **Purely Predictive / Behavioral (The "Black Box" View):**
      *   **Claim:** If you cannot distinguish it from a mind via any intervention, it is a mind.
      *   **PL Equivalent:** **Contextual Equivalence / Full Abstraction.** If $C[M_1] \cong C[M_2]$ for all contexts $C$, then $M_1$ and $M_2$ are identical.
      *   **Implication:** If the lookup table is perfect, it is indistinguishable from the computation. Therefore, it is a mind. Your friend rejects this; she thinks there is a "context" (the metaphysical one) that can distinguish them.

  ### 3. The Mapping and The Residue

  **What maps cleanly:**
  *   **Trace vs. Program (Token vs. Type):** Her distinction between "the program" (the mind spec) and "the run" (the concrete occurrence) maps perfectly to Type/Token. She is arguing that moral status attaches to the *Token* of the execution, not the *Type* of the algorithm.
  *   **Replay vs. Execution:** This maps to **Interpretation vs. Data**. In replay, the states are data. In execution, the states are registers/memory being actively transformed by the ALU.
  *   **Memoization:** This maps to **Extensional vs. Intensional**. A memo table captures the graph of the function (extension). The algorithm captures the procedure (intension).

  **What distorts or breaks:**
  *   **"Doing Work":** In PL, state transition is a logical relation. In physics (and her view), it involves energy, entropy, and causal force. You treat $\to$ as a logical implication; she treats $\to$ as a physical push.
  *   **Intervention:** In PL, we define interventions formally (e.g., "set variable $x$ to 5"). She means *physical* intervention. If you change a bit in the lookup table, the output changes. If you change a bit in the running program, the output changes. The *logical* result is the same. She claims the *modal* status is different.

  **The Residue Report:**
  The residue is **Modality and Physicality**.
  Your framework (PL/DS) is deliberately **extensional** and **abstract**. It is designed to prove that implementation details *don't* matter (abstraction barriers). Her framework is **intensional** and **concrete**. She is arguing that implementation details *do* matter (specifically, the causal topology of the hardware).

  *   **Can your vocabulary say "Really Occurs"?** No. In a verified compiler, if the target code refines the source, the computation "occurs" in both. There is no predicate `is_real_execution()` in Hoare Logic or Separation Logic.
  *   **Is this a bug in your framework?** No, it's a feature. You abstract away physics to reason about correctness. She is reasoning *about* the physics (or the metaphysics of the physics).

  ### 4. Addressing Your Specific Questions

  **(a) Does the run-versus-program distinction carry the moral weight, or is she smuggling metaphysics?**
  She is smuggling metaphysics, but it's not necessarily illegitimate smuggling.
  In PL, a "run" is a mathematical object (a sequence of states). In her view, a "run" is a **physical event**.
  *   **The Smuggle:** She uses the PL word "computation" but means "physical process instantiating a computation."
  *   **The Weight:** If you accept physicalism (minds are physical things), then yes, the distinction between a physical process and a static record of that process carries weight. A movie of a fire doesn't burn. A simulation of a storm doesn't get you wet. She is arguing a simulation of a mind doesn't *feel*.
  *   **Verdict:** She is using "computation" to mean "physical causal process satisfying a computational description." If you treat computation as purely abstract (math), her position is incoherent. If you treat it as physical, her position is consistent.

  **(b) Can counterfactual dependence be stated in your framework, or do you need a causal layer?**
  You need to bolt on a causal layer, and yes, that risks assuming her conclusion.
  *   **Standard PL:** Counterfactuals are handled via **parametricity** or **logical relations**. "If input were $x'$, output would be $y'$." This is logical dependence.
  *   **Her Requirement:** She needs **Structural Counterfactuals**. "If the physical state at $t_1$ were different *due to a local intervention*, would the state at $t_2$ change *via the transition function*?"
  *   **The Problem:** In a lookup table, if you change the input, the output changes. Logical dependence holds. She wants to know if the *mechanism* supports the dependence.
  *   **The Bolt-on:** To state this, you need a model of **Intervention** distinct from **Input Variation**. You need to model the transition function $\delta$ as a physical object that can be broken or bypassed.
  *   **Assuming the Conclusion?** If you add a primitive `is_causal(transition)` to your logic, yes, you've assumed her conclusion. But if you add a layer of **Causal Models** (like Structural Equation Models) over your LTS, you can formally distinguish "correlation" (lookup) from "causation" (algorithm). This doesn't assume she's right, but it makes her claim testable *if* you agree on the causal model.

  **(c) Is there anything in your toolkit that cuts against her?**
  Yes: **Full Abstraction and Observational Equivalence.**
  *   **The Argument:** In PL, we strive for languages where contextual equivalence implies behavioral equivalence. We deliberately *ignore* intensional differences (like runtime or memory layout) unless they affect observables.
  *   **The Cut:** If you argue that "Mind" is an observable property (behavior), then her distinctions are irrelevant implementation details. If two systems are bisimilar, they are the same system.
  *   **Her Counter:** She would argue "Mind" is not an observable property of the *output*, but a property of the *process*. This is like arguing that "Security" isn't just about what leaks (observables), but about the internal isolation (process). In security, we care about internal state (non-interference). She is treating consciousness like a **Security Property** (internal isolation/causality) rather than a **Functional Property** (I/O).

  ### 5. Conclusion: Will Upgrading Vocabulary Solve It?

  If you upgrade your vocabulary to include **Causal Models** (interventions on the transition function itself, not just the input) and **Intensional Type Theory** (where $\lambda x. x+x \neq \lambda x. 2*x$), her position becomes **statable**.

  *   **Statable:** "Moral status requires the system to be a causal model where states are nodes and transitions are edges, and the edges must be physically instantiated, not logically implied."
  *   **Checkable?** No. Because you cannot observe "physical instantiation" without already agreeing on what counts as physical instantiation.

  **The Dissolution:**
  The disagreement dissolves only if you agree on the **Ontology of Computation**.
  *   **Your Ontology:** Computation is abstract. Implementation is a refinement. (Math)
  *   **Her Ontology:** Computation is a physical process. Implementation is the *only* thing that exists. (Physics)

  **Summary:** You were talking past each other because you were arguing about **Correctness** (does it match the spec?), and she was arguing about **Instantiation** (is the spec physically enacted?).
  *   Your framework (PL) is designed to make instantiation irrelevant.
  *   Her framework (Philosophy of Mind) is designed to make instantiation the only thing that matters.

  **Advice:** You didn't disagree about the code. You disagreed about whether the code is a map or the territory. She thinks consciousness requires territory. You (implicitly) treat the map as sufficient if it's detailed enough. Neither of you can prove the other wrong without stepping outside your respective formalisms.
