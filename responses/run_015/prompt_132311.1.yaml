      *   *Key Terminology Check:* LTS, Traces, Bisimulation, Observational Equivalence, Full Abstraction, Extensional vs. Intensional, Counterfactuals, Interventions.

      *(Self-Correction during drafting)*: Be careful not to say PL *ignores* causation. Distributed systems care deeply about causality (happens-before). But PL semantics usually treat the transition relation as given, not as a physical causal mechanism. I need to distinguish *logical* causality (implication) from *physical* causality (force/work).
      *Refinement on Dedup:* In case 3, if two replicas share state, is it one mind or two? PL says "optimization." She says "ontological merger."
      *Refinement on Memoization:* Case 4 is the classic "Chinese Nation" or "Lookup Table" argument. PL says $f(x) = f(x)$. She says computing $f$ is different than looking up $f$.

  8.  **Final Polish:** Ensure the distinction between *extensional* (input-output behavior) and *intensional* (how it's computed) is clear, as this is the crux of the disagreement. PL optimizes for extensionality; Philosophy of Mind (in this specific causal guise) demands intensionality.

  9.  **Final Review against constraints:** No papers, no authors. Focus on shape. Use the user's vocabulary.

