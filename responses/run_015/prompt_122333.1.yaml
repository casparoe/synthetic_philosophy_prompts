      *   *Defense:* It captures the intuition of primitive thisness.
      *   *Seminar Context:* Professors bring it up to show the "escape hatch" for Leibnizians. If haecceities count as properties, PII is tautologically true but metaphysically empty. If they don't, PII is substantive but possibly false.

