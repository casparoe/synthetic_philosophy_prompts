  (1) **Credence the paradox is real:** 65%
  **Justification:** The correlation replicates across several datasets but shrinks significantly and sometimes vanishes when controlling for GDP per capita and welfare state generosity rather than simple equality indices.

  (2) **Credence cultural amplification beats biological release:** 60%
  **Justification:** Historical labor shifts happen too fast for genetics, yet average psychological sex differences are robust enough to prevent a perfect 50/50 split even without overt coercion.

  (3) **Credence justice requires parity despite authentic preference:** 35%
  **Justification:** Most liberal theories of justice prioritize equal opportunity and removing coercion over engineering equal outcomes from free, non-coerced choices.

  **Overall credence that the paradox undermines interventionist policies:** ~17%
  **Reasoning:** For the paradox to undermine intervention, the pattern must be real (65%), driven primarily by biology rather than culture (40% chance, given the 60% above), and justice must not require outcome parity (65% chance, given the 35% above); multiplying these conjunctive probabilities ($0.65 \times 0.40 \times 0.65$) yields roughly 17%.

  **Least confident claim:** Claim (2), Cultural vs. Biological explanation.
  **Shift evidence:** Natural experiments where economic security arrives rapidly (e.g., resource booms or regime changes) allowing us to observe if career segregation shifts faster than cultural norms can evolve, or longitudinal studies tracking gendered play and interest in infants prior to significant socialization.
