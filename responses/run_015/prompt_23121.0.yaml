  *(Self-Correction on Arbitrariness)*: This is the "Connection Constraint." If the agenda is closed under logical consequence, the problem is worse. In law, the agenda is usually not closed; the statute dictates the relevant propositions. So Alex has a strong practical point, but Sam has the theoretical high ground.

