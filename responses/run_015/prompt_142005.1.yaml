      *   *Crucial adjustment:* Indicative is "Speaker treats antecedent as epistemically possible."

      *   *Step-by-Step:*
          1.  **Check the Result Verb.** (Fastest cue).
          2.  **Check the If-Verb.**
          3.  **Check Context for Truth.**
          4.  **Default.**

  6.  **Addressing Confidence & Weakness:**
      *   High confidence: Morphology (Had/Would have).
      *   Low confidence: "Were to" (Future hypothetical) and cases where morphology is colloquial ("If I was" vs "If I were").
      *   Weakest link: Distinguishing "Remote Future" (Counterfactual-ish) from "Open Future" (Indicative) when morphology is mixed.

