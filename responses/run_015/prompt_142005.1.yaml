          *   *Correction:* In semantics, "If we were to" is often distinct from "If we had." It's a *future less vivid*. For a binary Indicative/Counterfactual split, this often falls into Counterfactual because of the remoteness marking ("were to", "would"). But the prompt asks about *false antecedent*. The antecedent isn't false yet.
          *   *Decision:* This highlights the weakness. I need to make sure the procedure handles Future Hypotheticals. Usually, "Counterfactual" in corpus linguistics includes "Remote/Hypothetical" (would/were) vs. "Open" (will/do). I will classify this as **Counterfactual/Hypothetical** based on morphology ("were to", "would"), noting the stall point.
      *   (3) "If that's your plan, we're all doomed."
          *   Result: "we're" (Present Indicative).
          *   If-clause: "that's" (Present Indicative).
          *   Context: Speaker implies the plan *is* the plan, or is treating it as a real possibility.
          *   Verdict: Indicative. (It's a speech act conditional or factual).

