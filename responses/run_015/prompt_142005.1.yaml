answer: |-
  Here is a operational procedure designed for speed (30–60s) and reliability, grounded in the semantic distinction between **Epistemic Openness** (Indicative) and **Epistemic Closure/Remoteness** (Counterfactual).

  ### The Procedure: "Epistemic Closure" Checklist

  **Core Rule:** Do not code based on what *actually* happened in the world. Code based on **what the speaker treats as true** at the moment of speaking, signaled by grammar and immediate context.

  **Step 1: Check the Result Clause (The "Then" part)**
  *Look at the verb following the comma.*
  *   **Does it contain "would have," "could have," or "might have" + past participle?**
      *   $\rightarrow$ Tag **Counterfactual**. (Stop).
  *   **Does it contain simple present, past, or future ("is," "did," "will")?**
      *   $\rightarrow$ Tag **Indicative**. (Stop).
  *   **Does it contain "would," "could," or "might" (without "have")?**
      *   $\rightarrow$ **Go to Step 2.** (This is the ambiguous zone).

  **Step 2: Check the "If" Clause Verb**
  *Look at the verb immediately following "if."*
  *   **Does it contain "had" + past participle (e.g., "If we had known")?**
      *   $\rightarrow$ Tag **Counterfactual**. (Stop).
  *   **Does it contain "were to" + verb (e.g., "If we were to go")?**
      *   $\rightarrow$ Tag **Counterfactual**. (This marks the scenario as remote/non-actual).
  *   **Is it simple past or present (e.g., "If he was," "If it is")?**
      *   $\rightarrow$ **Go to Step 3.**

  **Step 3: Check Context for "Factuality"**
  *Read the two lines before and after.*
  *   **Does the text explicitly state the antecedent is FALSE?** (e.g., "We didn't get the budget. If we got the budget...")
      *   $\rightarrow$ Tag **Counterfactual**.
  *   **Does the text explicitly state the antecedent is TRUE?** (e.g., "We got the budget. If we got the budget, it's in the file.")
      *   $\rightarrow$ Tag **Indicative**.
  *   **Is the truth value unknown or treated as an open question?**
      *   $\rightarrow$ **Go to Step 4.**

  **Step 4: The "Live Possibility" Test**
  *Ask: Is the speaker treating this as a real option or a known non-starter?*
  *   **Can you mentally replace "If" with "In the event that"?**
      *   $\rightarrow$ Tag **Indicative**. (Speaker treats it as a live possibility).
  *   **Can you mentally replace "If" with "Since it didn't..."?**
      *   $\rightarrow$ Tag **Counterfactual**. (Speaker treats it as impossible/closed).
  *   **Does it feel like a guess, a threat, or a general rule?**
      *   $\rightarrow$ Tag **Indicative**. (Uncertainty counts as "open").
  *   **If you cannot decide between "Live Possibility" and "Remote Hypothetical":**
      *   $\rightarrow$ Tag **Unclear**. (Do not force it).

  ***

  ### Application to Your Examples

  **(1) "If the provost read the report, she didn't mention it."**
  *   **Step 1 (Result):** "didn't mention" (Simple Past). $\rightarrow$ Suggests **Indicative**.
  *   **Step 2 (If-Verb):** "read" (Simple Past). $\rightarrow$ Ambiguous.
  *   **Step 3 (Context):** Text does not say if she read it. Status unknown.
  *   **Step 4 (Test):** Can we say "In the event that the provost read the report..."? Yes. The speaker is treating her reading it as a possibility that explains the silence.
  *   **Verdict:** **Indicative.**
  *   **Where it stalls:** Nowhere. The simple past in the result clause is a strong anchor.

  **(2) "If we were to raise the fee, we'd need a vote first."**
  *   **Step 1 (Result):** "we'd need" ("Would" + infinitive). $\rightarrow$ Ambiguous (Go to Step 2).
  *   **Step 2 (If-Verb):** "were to raise". $\rightarrow$ **Counterfactual** marker (Remote).
  *   **Step 3 (Context):** Future event. Not factually false yet, but treated as non-actual.
  *   **Step 4 (Test):** Can we say "Since we aren't raising the fee..."? Yes, implies remoteness. Can we say "In the event that..."? Also yes, but "were to" adds a layer of "we probably won't."
  *   **Verdict:** **Counterfactual** (based on morphological remoteness), *but* see confidence notes below.
  *   **Where it stalls:** This violates the strict "antecedent is false" definition because the fee raise hasn't happened yet. It is a *future hypothetical*, not a past counterfactual. Your codebook definition is too narrow for this case.

  **(3) "If that's your plan, we're all doomed."**
  *   **Step 1 (Result):** "we're" (Present). $\rightarrow$ Suggests **Indicative**.
  *   **Step 2 (If-Verb):** "that's" (Present). $\rightarrow$ Suggests **Indicative**.
  *   **Step 3 (Context):** Speaker implies the plan likely *is* the plan, or is treating it as an immediate reality.
  *   **Step 4 (Test):** Can we say "In the event that is your plan"? Yes.
  *   **Verdict:** **Indicative.**
  *   **Where it stalls:** Nowhere. This is a speech-act conditional (biscuit conditional), but functionally operates as indicative in this coding scheme.

  ***

  ### Confidence & Weakness Analysis

  **Step 1: Check Result Clause**
  *   **Confidence:** **90%**.
  *   **Why:** English speakers are very consistent about marking the *consequence* as unreal ("would have") even when they are sloppy about the *if*-clause ("If I was" vs "If I were"). This is your most reliable signal.

  **Step 2: Check "If" Clause Verb**
  *   **Confidence:** **70%**.
  *   **Why:** Colloquial speech messes this up. "If I was" is often used for counterfactuals ("If I was you...") despite being indicative morphology. Rely on Step 1 first.

  **Step 3: Check Context**
  *   **Confidence:** **85%** (if info exists).
  *   **Why:** If the text says "We didn't do X," it overrides grammar. However, most disagreements happen because this info is *missing*, forcing you to Step 4.

  **Step 4: Live Possibility Test**
  *   **Confidence:** **50%**.
  *   **Why:** This is subjective. It relies on your intuition about the speaker's mindset. This is where coder drift happens.

  **The Weakest Link: Future Hypotheticals (Example 2)**
  I am least sure about how your lab wants to handle **Future Remote** conditionals ("If we were to...").
  *   **Semantically:** The antecedent is not *false* (it hasn't happened), so it fails your codebook definition of Counterfactual.
  *   **Morphologically:** It uses "were to/would," which aligns with Counterfactual coding.
  *   **Recommendation:** If you must choose, tag based on **morphology** (Counterfactual) for reliability, but log these as a specific category of disagreement. The definition "antecedent is false" is linguistically inaccurate for future events; it should be "antecedent is treated as non-actual or remote."

  **Final Advice for Disagreements:**
  If you and the second coder split on a token, check **Step 1 (Result Clause)**. If you both agreed on the Result Clause verb type but still disagree, the token is genuinely **Unclear** due to lack of context, not coder sloppiness. Mark it "Unclear" and move on; don't burn adjudication time on Step 4 ambiguities.
