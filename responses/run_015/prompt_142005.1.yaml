      *   *Counterfactual Conditionals:* The speaker treats the antecedent ($P$) as epistemically impossible or known to be false *at the time of utterance*. Form: Often "If $P$ had/were..., then $Q$ would..."
      *   *The Crux:* It's not about morphological marking (was vs. were) or objective truth. It's about the *speaker's epistemic stance* toward the antecedent based *only* on the text provided.
