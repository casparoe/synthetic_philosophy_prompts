answer: |-
  This is a sharp observation that cuts right to the ontological core of archival science. You are identifying what Michel-Rolph Trouillot called "silences in the archive," but you are asking about the *economic and institutional philosophy* that sustains those silences.

  Here is a breakdown of the philosophy buried in that funding pattern, how it interacts with structural views, and what would break if you flipped the criterion.

  ### 1. The Buried Philosophy: "Consequentiality" vs. "Existence"
  The funding model you describe rests on a philosophy of **Consequentiality**. In this view, historical value is not inherent in the existence of a life or an object, but is derived retrospectively from its *causal impact on the macro-narrative*.

  *   **The Metric:** Value = Proximity to Power $\times$ Magnitude of Decision.
  *   **The Agent:** Only those who wield institutional leverage (presidents, generals, CEOs) are considered "full" historical agents. Everyone else is "population" or "context."
  *   **The Ontology:** History is viewed as a sequence of *Events* (wars, treaties, legislation) rather than a continuum of *Conditions* (labor, diet, housing, kinship).

  This is not just bias; it is a specific theory of causality. It presupposes that history flows downward. Therefore, to preserve the "cause," you preserve the top. To preserve the "effect" (the working class) is seen as secondary, because the effect is theoretically deducible from the cause. (e.g., "If we know the President ordered the strike broken, we don't need the workers' diaries to know they were suppressed.")

  ### 2. Can a Relational/Structural View Defend This?
  You asked if a structural view could defend these funding priorities. The answer is **yes, but only a specific kind of structuralism.**

  *   **The Defense:** A structuralist could argue that elite archives represent the "command nodes" of the social structure. If society is a machine, the presidential correspondence is the blueprint and the control panel. Preserving the control panel is the most efficient way to understand how the machine was driven.
  *   **The Limit:** This defense works only if your goal is to understand **Power**, not **Society**.
      *   If history is the study of how power is projected, elite archives are sufficient.
      *   If history is the study of how social relations are lived, elite archives are actively misleading. They show the *intent* of structure without showing the *friction* of structure.

  A relational view that values *interaction* cannot defend this bias. You cannot study the relationship between master and enslaved person by only preserving the master's ledger. You have half the equation. The current funding model assumes the elite record contains the "universal" truth, while the working-class record contains only "particular" anecdotes. That is a philosophical claim, not a logistical one.

  ### 3. The Contradiction with Microhistory
  There is a direct inconsistency between the archival funding model and microhistorical theory.

  *   **Microhistory's Claim:** Studying an "exceptional ordinary" life (like Menocchio the miller) reveals the *boundaries of the possible* for everyone else. It exposes the unwritten rules of the structure by showing what happened when someone bumped up against them.
  *   **The Archive's Reality:** Archives preserve the "exceptional elite" (Washington's letters) but rarely preserve the "exceptional ordinary" unless it was already criminalized or litigated.
  *   **The Conflict:** Microhistory requires a vast sea of mundane records to identify the anomaly. If you only fund the "Great Decision" records, you have drained the sea. You cannot do microhistory in an archive that only keeps macro-history.

  The funding bias makes microhistory methodologically impossible at scale. It forces microhistorians to be scavengers, relying on the scraps left over from the preservation of elite narratives (e.g., a worker's diary found inside a seized estate).

  ### 4. What Breaks if We Flip to "Statistical Representativeness"?
  If you changed the preservation criterion from **Causal Impact** to **Statistical Representativeness of Lived Experience**, several foundational pillars of historical knowledge would break or shift:

  **A. The Narrative of "Change" Collapses**
  Current history is organized around *turning points*. If you prioritize representativeness, you prioritize *stasis*. 90% of lived experience is routine, not revolutionary. An archive based on representativeness would look boring. It would document 50 years of identical breakfasts rather than one day of a revolution. The "story" of history dissolves into the "structure" of history.

  **B. Causality Becomes Diffuse**
  In the elite model, causality is linear (Lincoln signed the order $\rightarrow$ slavery ended). In a representational model, causality is systemic (wages fell + crop prices rose + cultural shift $\rightarrow$ migration). This makes historical explanation much harder to teach and curate. You can't put a "Great Man" plaque on a wall anymore; you need a data visualization.

  **C. The "Sample" Problem**
  To be statistically representative, you need random sampling. Archives currently work on **Provenance** (keeping a collection intact). A representational archive would have to break provenance. It might keep *one* letter from a President (because he is a statistical outlier) and *10,000* letters from clerks. This violates the sacred archival principle of "respect des fonds," which argues that the context of a collection is as important as the content.

  **D. Authority Shifts from Political Science to Anthropology**
  Currently, historians act like political scientists analyzing statecraft. If you flip the criterion, historians become anthropologists of the past. The "knowledge" produced changes from "How was this law made?" to "How was this life endured?"

  ### 5. Philosophical or Bureaucratic Inertia?
  It is **philosophy masquerading as bureaucracy.**

  *   **The Bureaucratic Excuse:** "Elite records are better organized," "There is too much mundane paper to save it all," "Donors care about famous names."
  *   **The Philosophical Reality:** The State funds the memory of the State. National Archives, presidential libraries, and military museums are legitimacy machines. They exist to create a continuous lineage of authority. Preserving the tenement building where a strike started is potentially subversive; preserving the general's tent is patriotic.

  If it were purely inertia, we would see a shift as the cost of digital storage drops. But we don't. We see digitization projects prioritizing the same elite records because the *selection criteria* remain unchanged.

  **Summary:**
  The bias is philosophical. It presupposes that history is the study of **leverage**, not **experience**. It treats the "decider" as the only real subject and the "liver" as the object. Flipping this to representativeness would not just change *what* we save; it would change the definition of history from a narrative of **agency and decision** to a topology of **condition and constraint**. It would break the "Great Man" theory not by arguing against it, but by making the data required to support it unavailable.
