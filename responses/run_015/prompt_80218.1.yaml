  4.  **Identify What's Missing (The "Third Perspective"):**

      *   *Institutional Design:* It's not just "Ban vs. Legalize." There are regulated market models (e.g., state monopsony, Iran model).
      *   *Background Justice:* Both ignore *why* the poor are selling. If background conditions were just, would the sale still be repugnant? (Rawls).
      *   *Semiotics vs. Consequences:* They are talking past each other. Marta talks outcomes (lives saved); Dev talks meaning (what does this say about us?).
      *   *The "Biochemist" Angle:* Homeostasis. Markets are systems. Bodies are systems. What happens when you introduce a market variable into a biological system?

  5.  **Drafting the Response (Iterative Process):**

