prompt: |-
  hey — i'm running a 90-min seminar on philosophy of biology / culture, about 14 grad students, next semester. i want a classroom activty (not a lecture) that makes them feel why the darwinian meme theory of culture runs into trouble specifically over the missing genotype/phenotype split and the fact that cultural transmission is reconstructive rather than replicative. i want you to inject the niche idea that 'mutation' in culture isn't random copying error but systematic bias from cognitive attractor landscapes — so selection is acting on reconstructed outputs, not on discrete replicators.

  design a runnable game with roles: some students are 'ancestors' with a seed practice, others are 'vectors' who observe once, others are 'hosts' who reconstruct from partial cues. include rules, materials (paper, index cards), a payoff/scoring scheme that rewards fidelity but hides fitness pressures (ease of recall, impressiveness), a timeline for the 90 minutes, and a debrief that maps specific game moments to (a) replication failure, (b) selection on outputs, (c) collapse of discrete meme ontology.

  tell me what will predictibly go wrong on first run — i bet people smuggle verbal instructions or invent hidden copying? — and how to handle it. also be honest about which part of the anti-replicator argument (probably the intentionality / representation problem?) the activity can't reproduce and i have to supply.

  participants should come away seeing that cultural evolution can look darwinian without there actually being memes. no bibliographies, no citations, no assigned readings — this needs to work for a model with no web access. keep it in the weeds, not a basic telephone game.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar activity:

  1.  **Analyze the Request:**
      *   **Topic:** Philosophy of Biology/Culture (specifically critiquing Darwinian Meme Theory).
      *   **Core Concepts:** Missing genotype/phenotype split, reconstructive vs. replicative transmission, mutation as systematic bias (cognitive attractors) vs. random copying error, selection on outputs not replicators.
      *   **Format:** 90-minute seminar, ~14 grad students, activity-based (no lecture).
      *   **Activity Design:** Needs roles (Ancestors, Vectors, Hosts), rules, materials, scoring, timeline, debrief.
      *   **Specific Constraint:** "No bibliographies, no citations, no assigned readings." Keep it in the weeds.
      *   **Critical Reflection:** Predict failure modes (cheating, verbal smuggling), acknowledge limitations (intentionality/representation problem).
      *   **Goal:** Students should feel that cultural evolution looks Darwinian *without* actual memes (discrete replicators).

  2.  **Deconstruct the Theoretical Problem:**
      *   *Meme Theory (Dawkins/Blackmore):* Culture evolves via high-fidelity replication of discrete units (memes). Genotype (instruction) $\to$ Phenotype (behavior). Mutation is rare/random.
      *   *Critique (Sperber, Morin, Griesemer):* Culture is reconstructive. There is no "genotype" (internal idea) perfectly encoded into a "phenotype" (external behavior). We infer intent from observation. "Mutation" is often biased by cognitive constraints (attractors).
      *   *The Activity Needs:* To simulate transmission where the "code" isn't passed, only the "output" is observed, and the receiver has to *guess* the rule, introducing systematic bias.

  3.  **Drafting the Activity Concept:**
      *   *Idea:* A "Telephone Game" is too simple. It implies passive degradation. We need *active reconstruction*.
      *   *Mechanism:* Origami? Knot tying? Pattern drawing?
      *   *Selection:* Pattern drawing allows for "fitness" criteria (symmetry, complexity) without needing biological survival.
      *   *Roles:*
          *   Ancestors: Have the "Seed" (a rule or a complex image). Let's make it a *rule* that generates an image, to highlight the genotype/phenotype gap. Actually, better: Give them a *finished artifact* and a *hidden rule*. No, that's too complex.
          *   Let's try this: Ancestors have a "Seed Pattern" (Phenotype) generated by a "Hidden Rule" (Genotype). But wait, the critique says there *is* no Genotype in culture. So the Ancestors should just have a Pattern. The Vectors observe. The Hosts reconstruct.
          *   *Refinement:* To show the *missing* G/P split, the "Ancestors" shouldn't have a rule. They just have a design. The "Vectors" watch them make it. The "Hosts" try to recreate it from the Vector's description or the Vector's attempt.
          *   *Better Refinement for "Reconstructive":*
              *   Gen 0 (Ancestors): Given a complex geometric design (the Phenotype). They must learn to draw it from memory (simulating internalization).
              *   Gen 1 (Vectors): Watch Gen 0 draw it *once*. They cannot ask questions. They must draw it from memory.
              *   Gen 2 (Hosts): Given the Gen 1 drawing *and* a set of "Cognitive Bias Cards" (constraints). They must redraw it.
              *   *Wait, the prompt asks for specific roles:* Ancestors (seed practice), Vectors (observe once), Hosts (reconstruct from partial cues).
              *   *Payoff:* Rewards fidelity but hides fitness pressures (ease of recall, impressiveness).

      *   *The "Cognitive Attractor" Twist:* Instead of random noise, introduce specific constraints that force simplification or regularization (e.g., "Make it symmetrical," "Use only straight lines"). This simulates the "systematic bias" mutation.

  4.  **Developing the Game Mechanics ("The Glyph Protocol"):**
      *   **Materials:** Index cards, pens, opaque folders.
      *   **The Seed:** A complex, slightly irregular geometric glyph.
      *   **Transmission:**
          1.  Ancestors study Seed (30 sec). Put away. Draw it.
          2.  Vectors watch Ancestors draw (no talking). Vectors draw from memory.
          3.  Hosts get Vector's drawing + a "Bias Card" (e.g., "Simplify angles," "Maximize symmetry"). Hosts redraw.
      *   **Scoring:**
          *   Fidelity points (overlay transparency?).
          *   "Fitness" points (does it look 'clean'? did it satisfy the Bias Card?).
      *   **The Trap:** Students will try to verbalize ("It's a triangle with a line"). I need to ban language.

  5.  **Addressing the Prompt's Specific Requirements:**
      *   *Roles:* Ancestors, Vectors, Hosts.
      *   *Missing G/P Split:* The "Seed" is just an image. There is no instruction manual. The "mutation" happens because the Host interprets the image through their Bias Card.
      *   *Reconstructive:* Hosts aren't copying; they are rebuilding based on cues + internal bias.
      *   *Predictable Failures:* Verbal cheating, trying to encode a "rule" that doesn't exist.
      *   *Limitations:* The game can't fully simulate *intentionality* (why they want to copy). I need to note this in the debrief.

  6.  **Structuring the 90 Minutes:**
      *   0-10: Setup & Theory Hook (brief).
      *   10-30: Round 1 (High Fidelity focus).
      *   30-50: Round 2 (Bias/Attractor focus).
      *   50-70: Scoring & Data Visualization.
      *   70-90: Debrief (Mapping to theory).

  7.  **Refining the "Cognitive Attractor" Mechanism:**
      *   If I just give them a card saying "Make it symmetrical," that's too explicit.
      *   Better: Give them a *tool constraint* or a *goal constraint*.
      *   Let's use "Interpretive Lenses." Hosts are told: "You are a member of a tribe that values Symmetry" or "You are a member of a tribe that values Complexity." They must modify the drawing to fit their tribe's aesthetic while trying to keep the original shape. This creates *directed mutation*.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Name:* "The Glyph Transmission Protocol."
      *   *Materials:* 14 packets. Master Glyphs (3 variations). Bias Cards. Transparency sheets (for scoring).
      *   *Rules:* Strict silence. Timed phases.
      *   *Scoring:* Overlay the final on the original. Count intersections? Too mathy. Just peer review + instructor check against "Bias Goals."
      *   *Debrief:* Connect the "Bias Cards" to Cognitive Attractors. Connect the lack of instructions to the missing Genotype.

  9.  **Addressing the "What will go wrong" section:**
      *   Students *will* try to invent a verbal code.
      *   Students *will* treat the drawing as a puzzle to solve (find the rule) rather than a pattern to copy.
      *   *Fix:* Confiscate pens if they write words. Emphasize "No Language."

  10. **Addressing the "Limitations" section:**
      *   The game forces transmission. In real life, people choose *what* to transmit. The "selection" here is artificial (instructor scoring). Real cultural selection is often ecological or social. I need to admit the game simulates *transmission bias* well, but *environmental selection* poorly. Also, the "intentionality" of the Host is constrained by the game rules, whereas in reality, their intent drives the reconstruction.

  11. **Final Polish:**
      *   Ensure tone is appropriate for grad students (rigorous, not patronizing).
      *   Check timing (90 mins is tight).
      *   Make sure the "Missing Genotype" point lands hard. The "Seed" is just ink on paper. There is no DNA equivalent.

  12. **Self-Correction during drafting:**
      *   *Initial thought:* Use origami. *Correction:* Too slow. Drawing is faster.
      *   *Initial thought:* Let them talk. *Correction:* No, language introduces explicit coding (Genotype). Silence forces reconstructive inference.
      *   *Initial thought:* One long chain. *Correction:* Branching is better for "population" feel. 14 students. 2 Ancestors, 4 Vectors, 8 Hosts. Two lineages. Allows comparison.

  13. **Finalizing the Debrief Questions:**
      *   Where did the "rule" break?
      *   Did errors look random? (No, they looked like simplifications).
      *   Was there a "Meme"? (No, just a shifting image).

  14. **Review against constraints:**
      *   No citations? Check.
      *   No web access? Check.
      *   Specific roles? Check.
      *   Predictable failures? Check.

