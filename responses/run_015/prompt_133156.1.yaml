answer: |-
  # Activity: The Glyph Transmission Protocol

  **Goal:** Demonstrate that cultural evolution can exhibit selection and drift without discrete replicators (memes), driven instead by reconstructive inference and cognitive biases (attractors).
  **Time:** 90 Minutes
  **Participants:** 14 Grad Students
  **Materials:** Index cards (3x5), pens (black & red), opaque folders, transparency sheets (or tracing paper), timer, whiteboard.

  ---

  ## 1. Setup & Roles (0:00 – 0:10)

  Divide the room into **Two Lineages** (Lineage A and Lineage B), 7 students each.
  Assign roles within each lineage:
  *   **2 Ancestors:** (1 per lineage). They hold the "Seed."
  *   **4 Vectors:** (2 per lineage). They observe the Ancestors.
  *   **8 Hosts:** (4 per lineage). They reconstruct the final output.

  **The Seed (Genotype Illusion):**
  Prepare two "Master Glyphs" on index cards. These should be complex geometric figures (e.g., a hexagon with internal lines that *almost* form a star but miss by 5 degrees; asymmetrical shading).
  *   *Crucial:* There is **no rule** written on the card. Just the image. This simulates the absence of a biological genotype. There is no code, only the phenotype.

  **The Constraint:**
  **Absolute Silence.** No verbal instructions. No writing words on the cards (only drawing). If a student speaks, their lineage loses 50% of their "Fitness Score."

  ---

  ## 2. The Transmission Rounds (0:10 – 0:45)

  ### Round 1: The Replication Trap (15 mins)
  *   **Phase 1 (Ancestors):** Give Ancestors the Master Glyph. They have 2 minutes to memorize it. Collect the Master. They must draw it from memory on a fresh card.
  *   **Phase 2 (Vectors):** Vectors stand behind Ancestors. Ancestors draw their version. Vectors watch the *hand movement* and the *emerging shape*. They have 30 seconds to observe. Ancestors cover their drawing. Vectors must draw from memory.
  *   **Phase 3 (Hosts):** Hosts receive the Vector's drawing. They have 2 minutes to copy it.
  *   **Scoring:** Overlay the Host's final drawing on the original Master Glyph (using transparency).
      *   **Fidelity Points:** 1 point for every matching intersection/vertex.
      *   **Fitness Points:** 5 bonus points if the drawing is "clean" (no scribbles, confident lines).

  *Instructor Note:* In Round 1, do not give Hosts any special instructions. Let them try to be photocopiers.

  ### Round 2: The Attractor Bias (20 mins)
  *   Reset the lineages. Use a new Master Glyph (similar complexity, different shape).
  *   **Phase 1 & 2:** Same as Round 1 (Ancestor $\to$ Vector).
  *   **Phase 3 (Hosts - The Twist):** Hand each Host a **Bias Card** face down. They flip it only when they begin drawing.
      *   *Bias Card Examples:* "Your tribe values Symmetry. Adjust the image to be more symmetrical." / "Your tribe values Complexity. Add nodes to intersections." / "Your tribe values Economy. Use fewer lines."
      *   **Rule:** Hosts must still recognize the original shape, *but* they are rewarded for satisfying their Bias Card.
  *   **Scoring:**
      *   **Fidelity Points:** Same as Round 1.
      *   **Attractor Points:** 10 points if the Bias Card instruction is clearly visible in the final output.

  ---

  ## 3. Data Visualization & Scoring (0:45 – 0:60)

  Pin all drawings on the whiteboard in two chains (A and B) for both rounds.
  *   **Calculate Scores:** Have students tally the Fidelity vs. Attractor points.
  *   **Visual Analysis:** Ask students to trace the "mutation" path with red pen on the whiteboard (connecting specific features that changed).
  *   **Key Observation:** In Round 1, errors should look like "degradation" (shaky lines, missing details). In Round 2, errors should look like "regularization" (angles becoming 90 degrees, asymmetry becoming symmetry).

  ---

  ## 4. The Debrief: Mapping to Theory (0:60 – 0:90)

  Do not lecture. Use the Socratic method to map the game experience to the philosophical concepts. Write these three headers on the board:

  ### A. Replication Failure (The Missing Genotype)
  *   **Ask:** "In Round 1, did anyone feel like they were copying a *rule*?"
  *   **Point:** In biology, DNA is the genotype (instruction). Here, you only had the phenotype (the drawing). There was no 'code' to copy.
  *   **Theoretical Hit:** Meme theory assumes culture has a genotype (an idea/instruction) that is encoded into behavior. This game shows there is only behavior observing behavior. The "instruction" had to be *inferred*, not copied. When inference fails, replication fails.

  ### B. Selection on Outputs (Not Replicators)
  *   **Ask:** "In Round 2, which drawings survived better? The accurate ones or the symmetrical ones?"
  *   **Point:** If the "Attractor Points" outweighed "Fidelity Points," the population evolved toward symmetry, even if it lost fidelity to the ancestor.
  *   **Theoretical Hit:** Selection isn't acting on a "meme" (a discrete unit of info). It's acting on the *public output* filtered through cognitive biases. The "mutation" wasn't random noise; it was a systematic pull toward a cognitive attractor (symmetry/simplicity).

  ### C. Collapse of Discrete Ontology
  *   **Ask:** "Can you point to the exact moment the 'meme' changed?"
  *   **Point:** Probably not. It drifted gradually.
  *   **Theoretical Hit:** If you can't identify the discrete unit that persisted, the "meme" ontology collapses. What persisted was the *causal chain of reconstruction*, not a thing.

  ---

  ## 5. Predictable Failure Modes & Mitigation

  **1. The "Verbal Smuggle"**
  *   **What happens:** Ancestors will try to whisper ("It's a triangle inside a circle") or write text codes on the back of cards.
  *   **Why:** They are trained to think communication requires language (encoding).
  *   **Fix:** Confiscate the card immediately. Deduct lineage fitness. Explain: "In cultural transmission of practices (like tool making or ritual), you often don't have the words. You only have the action."

  **2. The "Rule Hunter"**
  *   **What happens:** Hosts in Round 1 will ask, "What is this *for*?" or try to find a geometric rule that doesn't exist.
  *   **Why:** Humans are causal reasoners. We hate raw data; we want the algorithm.
  *   **Fix:** Allow this during the game. Use it in the debrief. "You invented a genotype because your brain couldn't handle the lack of one. That is exactly the cognitive attractor at work."

  **3. The "Perfectionist"**
  *   **What happens:** A Vector spends 5 minutes drawing, breaking the time limit.
  *   **Why:** They treat it as an art task, not a transmission task.
  *   **Fix:** Enforce hard stops. "Culture transmits under time/energy pressure."

  ---

  ## 6. Limitations: What This Activity Cannot Do

  Be honest with the students about where the model breaks. You must supply these points verbally:

  **1. The Intentionality Problem**
  *   **Limitation:** In the game, I *forced* the Hosts to copy. In reality, people choose *what* to attend to.
  *   **The Gap:** The game simulates *transmission bias* well, but not *reception choice*. A true anti-meme account needs to explain why a Host *wanted* to reconstruct the glyph. The game assumes the desire to copy; it doesn't simulate it.

  **2. The Representation Problem**
  *   **Limitation:** The "Bias Cards" were explicit instructions ("Make it symmetrical").
  *   **The Gap:** In real cognitive attractor theory, the bias is internal and unconscious (e.g., our visual cortex prefers symmetry). The game externalized the bias for gameplay mechanics. You need to explain that in reality, the "Bias Card" is inside their skull, not on an index card.

  **3. Ecological Selection**
  *   **Limitation:** Scoring was arbitrary (Instructor's rubric).
  *   **The Gap:** Real cultural selection is often ecological (does this tool cut better?) or social (does this ritual make me look cool?). The game's "fitness" was artificial. Acknowledge that real-world fitness pressures are messier than the point system used here.

  ---

  ## 7. Closing Statement (For Instructor)

  End the seminar with this takeaway:
  *"You just evolved a culture. Did a 'meme' survive? Or did a causal chain of reconstructions, biased by your cognitive constraints, produce a lineage that looks designed? If you can't find the replicator, but you still have evolution, then the 'Selfish Meme' is a metaphor, not a mechanism."*
