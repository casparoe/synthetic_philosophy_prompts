          *   *Problem for Governance:* If emergent laws "govern" (e.g., Navier-Stokes constrains fluid flow) without being fundamental, then "governance" doesn't require fundamental metaphysical glue. It dilutes the Anti-Humean's special status for laws.
          *   *Conclusion on Physics:* Effective laws suggest "lawhood" is a *functional role* played by statements within a model, not a feature of the world-in-itself.
      *   **What Counts as Progress?**
