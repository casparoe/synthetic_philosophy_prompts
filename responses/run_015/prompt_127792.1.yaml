      *(Self-Correction on the "Effective Laws" point)*: I need to be careful. Humeans *can* accommodate effective laws as local best systems. Anti-Humeans can say fundamental laws govern the micro, which necessitates the macro. The point is that *both* struggle to explain why the effective laws feel *autonomous*. I should emphasize the *autonomy* of effective laws as the wedge.

