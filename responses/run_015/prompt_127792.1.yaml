      *   **Diagnosis 2: The Direction of Fit (The "Factual" Feel):** Why does it feel factual? Because they disagree on the *order of explanation* for counterfactuals. If I strike this match, would it light? Humean: Yes, because all similar matches lit. Anti-Humean: Yes, because a law *makes* it light. This is a structural disagreement, not just semantic.
      *   **The Condensed Matter Intervention (The Core Contribution):**
