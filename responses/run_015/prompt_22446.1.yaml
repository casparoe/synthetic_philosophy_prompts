answer: |-
  The slogan "MDL is just practical Solomonoff induction" is a useful pedagogical bridge, but as you suspect, it is technically misleading if taken literally. It conflates a **theoretical limit** (Solomonoff) with a **constrained optimization framework** (MDL).

  While both frameworks rely on the same core intuition—that compression equals understanding—they diverge fundamentally in scope, computability, and guarantees. For a software engineer, the best analogy is this: **Solomonoff Induction is the specification for an ideal, unbounded search algorithm; MDL is the implementation with hardcoded limits and specific data structures.**

  Below is a detailed comparison addressing your three specific points, followed by a concrete example of divergence.

  ---

  ### 1. Formal Definitions

  To compare them precisely, we must define the objective functions.

  **Solomonoff Induction (SI)**
  SI defines a universal prior probability distribution over binary strings. Let $U$ be a fixed, prefix-free Universal Turing Machine. The Solomonoff prior $M(x)$ for a string $x$ is the probability that $U$ outputs a string starting with $x$ when fed random binary input.
  $$ M(x) = \sum_{p : U(p) = x*} 2^{-|p|} $$
  Here, the sum is over **all** programs $p$ that produce $x$ (or a string starting with $x$). $|p|$ is the length in bits. This is a weighted sum over the entire space of computable hypotheses. Prediction is done via conditional probability: $P(y|x) = M(xy) / M(x)$.

  **Minimum Description Length (MDL)**
  MDL is a model selection criterion. Given a dataset $D$ and a pre-specified model class (hypothesis space) $\mathcal{M}$, MDL selects the model $H \in \mathcal{M}$ that minimizes the total description length:
  $$ L_{total}(D, H) = L(H) + L(D | H) $$
  *   $L(H)$: The code length required to describe the model (complexity penalty).
  *   $L(D | H)$: The code length required to describe the data given the model (negative log-likelihood).
  Crucially, the minimization is restricted to $H \in \mathcal{M}$. $\mathcal{M}$ is typically a parametric family (e.g., polynomials of degree $k$, neural nets with fixed architecture).

  ---

  ### 2. Detailed Comparison

  #### (1) The Choice of Universal Machine vs. Coding Language

  **Solomonoff:** The choice of $U$ is theoretically arbitrary but practically significant.
  The **Invariance Theorem** states that for any two UTMs $U_1$ and $U_2$, the resulting priors $M_1$ and $M_2$ differ by at most a multiplicative constant: $M_1(x) \leq c \cdot M_2(x)$.
  *   **Implication:** Asymptotically (as data $n \to \infty$), the choice of $U$ does not matter. The constant $c$ is "washed out."
  *   **The Catch:** For finite data (which is all we ever have), $c$ can be astronomically large. If $U_1$ has the "truth" hard-coded into its transition table and $U_2$ does not, $U_1$ will predict perfectly immediately, while $U_2$ may require massive data to catch up. SI treats the choice of $U$ as a necessary evil that becomes irrelevant in the limit.

  **MDL:** The choice of coding language is a **design feature**, not a bug.
  In MDL, $L(H)$ is not derived from a universal machine; it is constructed by the engineer. You choose a prior distribution over parameters which translates to a code length (e.g., using a Gaussian prior implies a specific quadratic penalty).
  *   **Implication:** This choice encodes **domain knowledge**. If you choose a code length that penalizes high-frequency oscillations heavily, you are explicitly stating a bias against overfitting noise.
  *   **Divergence:** In SI, the "bias" is fixed by the arbitrary choice of $U$. In MDL, the "bias" is the explicit modeling assumption. MDL admits that we cannot be universal, so we optimize for the problems we expect to see. SI claims universality but hides the bias inside $U$.

  **Verdict:** These are different problems. SI asks, "What is the optimal inference machine regardless of content?" MDL asks, "Given what we know about this specific domain, how should we encode hypotheses?"

  #### (2) Uncomputability vs. Computability

  **Solomonoff:** Uncomputable due to the Halting Problem.
  To calculate $M(x)$, you must sum over *all* programs. You cannot know which programs halt. You can approximate $M(x)$ from below by running programs for longer and longer time steps (Levin Search), but you never know when you have found the shortest program.
  *   **Conceptual Loss:** SI is a **regulative ideal**. It defines what perfect induction *would* look like if computation were free. It guarantees convergence to the true distribution $\mu$ if $\mu$ is computable.

  **MDL:** Computable by restriction.
  MDL makes the problem computable by restricting the search space $\mathcal{M}$ and defining $L(H)$ such that it is easily calculable (e.g., BIC, AIC, or specific prefix codes).
  *   **Conceptual Loss:** You lose the guarantee of finding the *true* generator. You only guarantee finding the *best approximation within $\mathcal{M}$*.
  *   **Why it matters:** If the true data generating process is a cellular automaton (Rule 110) and your MDL model class $\mathcal{M}$ is "Gaussian Mixture Models," MDL will converge to the Gaussian that best approximates the cellular automaton output. It will never identify the cellular automaton. SI, theoretically, would eventually assign high probability to the program implementing Rule 110.

  **Verdict:** This is a conceptual difference, not just practical. SI is a theory of **truth recovery** (given enough time). MDL is a theory of **approximation risk management**. MDL sacrifices the ability to represent "surprising" truths outside the model class for the ability to actually return an answer.

  #### (3) Universality and Dominance

  **Solomonoff:** The Dominance Theorem.
  $M(x)$ dominates any computable semimeasure $\mu$. There exists a constant $c_\mu$ such that for all $x$:
  $$ M(x) \geq c_\mu \cdot \mu(x) $$
  This ensures that the cumulative prediction error of SI is bounded by the Kolmogorov complexity of the true distribution. SI is **universal**; it works for *any* computable environment.

  **MDL:** No Global Dominance.
  MDL does not dominate all computable measures. It only possesses **consistency** properties relative to its model class.
  *   If the truth $\in \mathcal{M}$: MDL converges to the truth.
  *   If the truth $\notin \mathcal{M}$: MDL converges to the model in $\mathcal{M}$ with minimum KL-divergence to the truth.
  *   **Status:** MDL is not a standalone theory of induction in the same sense as SI. It is a **heuristic framework for statistical inference**. It relies on the user to supply the "universality" by expanding $\mathcal{M}$ or choosing flexible codes.

  **Verdict:** The claim that MDL is "computable Solomonoff" implies MDL inherits SI's universality. It does not. MDL inherits SI's *philosophy* (Occam's Razor via code length) but not its *mathematical guarantees*.

  ---

  ### 3. Concrete Divergence: When They Pick Different Models

  To see why the difference matters, consider a scenario involving **structural complexity**.

  **The Setup:**
  Imagine a dataset $D$ generated by a simple program $P_{true}$ that is structurally "weird" relative to standard statistical models.
  *   $P_{true}$: A program of length 1,000 bits that generates a sequence with a subtle, non-linear recursive pattern (e.g., digits of $\pi$).
  *   Model Class $\mathcal{M}$ for MDL: Polynomials of degree $k$.
  *   Coding Scheme for MDL: Standard float encoding for coefficients.

  **The Conflict:**
  1.  **Solomonoff Induction:**
      *   SI considers *all* programs.
      *   It finds $P_{true}$ (length 1,000).
      *   It also considers a polynomial approximation $P_{poly}$ that fits the data points perfectly. To fit $N$ points of $\pi$ exactly, the polynomial degree must be high, requiring many coefficients. The code length for $P_{poly}$ might be 10,000 bits (to store all coefficients).
      *   **Decision:** SI prefers $P_{true}$ (1,000 bits) over $P_{poly}$ (10,000 bits). It predicts the next digit of $\pi$ correctly.

  2.  **MDL:**
      *   MDL is restricted to $\mathcal{M}$ (Polynomials). It **cannot** see $P_{true}$. $P_{true}$ is not in the hypothesis space.
      *   It compares a degree-5 polynomial vs. a degree-50 polynomial.
      *   The degree-50 polynomial fits the training data better (lower $L(D|H)$) but costs more to describe (higher $L(H)$).
      *   **Decision:** MDL picks the optimal polynomial within $\mathcal{M}$. It will likely underfit the recursive structure because polynomials are the wrong *type* of description for $\pi$. It predicts the next value based on curve extrapolation, which will fail.

  **The "Practical" Counter-Argument:**
  A proponent of MDL would say: "But you can't run SI. It's useless."
  This is true. However, this highlights that MDL is not "SI with a timeout." It is "SI with a **type constraint**."
  *   SI fails because of **resource limits** (time/halting).
  *   MDL fails because of **representation limits** (model class).

  If you expand the MDL model class to include "Python programs up to length 2000," you have moved closer to SI. But now you face the SI problem: how do you compute $L(D|H)$ for a general program? (You have to run it). How do you prevent overfitting on non-halting programs? You now have to introduce timeouts and approximations. You have effectively built a **bounded Solomonoff Inducer**, not standard parametric MDL.

  ### Summary Table

  | Feature | Solomonoff Induction | Minimum Description Length |
  | :--- | :--- | :--- |
  | **Hypothesis Space** | All computable programs (Turing Complete). | Pre-specified model class (e.g., Parametric). |
  | **Prior** | Fixed by Universal Turing Machine ($2^{-|p|}$). | Designed by engineer (e.g., Gaussian, BIC). |
  | **Computability** | Uncomputable (Halting Problem). | Computable (by design). |
  | **Guarantee** | Converges to truth for *any* computable distribution. | Converges to truth *only if* truth $\in$ Model Class. |
  | **Role of Bias** | Hidden in choice of $U$ (asymptotically irrelevant). | Explicit in choice of Code/Model (critically important). |
  | **Primary Goal** | Theoretical definition of optimal intelligence. | Practical model selection and regularization. |

  ### Conclusion

  The claim "MDL is practical Solomonoff induction" is **false** if interpreted as "MDL implements Solomonoff induction with approximations."

  It is **true** only in the sense that "MDL is an engineering discipline inspired by the philosophical insights of Solomonoff induction."

  *   **Solomonoff** tells us that *ideal* induction is compression over all computable hypotheses.
  *   **MDL** tells us that *feasible* induction is compression over *selected* hypotheses, where the selection criteria must be tuned to the domain.

  For a software engineer, the distinction is vital: **SI warns you that your model class is a bottleneck; MDL gives you the tools to optimize within that bottleneck.** If you treat MDL as merely "computable SI," you may overlook the fact that your model class restrictions are the primary source of error, not just the computational approximation of the code lengths.
