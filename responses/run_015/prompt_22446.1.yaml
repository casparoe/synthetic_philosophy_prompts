      *   *Minimum Description Length (MDL):* Practical framework. Rissanen. Two-part code (Model + Data|Model). Restricted model classes (usually). Computable (by design). No strict dominance theorem over *all* computable measures, but has consistency properties within the chosen class.
      *   *Kolmogorov Complexity ($K(x)$):* Length of shortest program producing $x$. SI is essentially a Bayesian mixture over $K(x)$. MDL approximates $K(x)$ using specific encoders.
      *   *Connection:* MDL is often motivated by SI/Kolmogorov, but it imposes constraints to make it workable. The slogan "MDL is practical SI" is *partially* true but hides the restriction to specific model classes and the lack of true universality.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's skepticism. The slogan is a useful heuristic but technically imprecise. Set the stage: SI is the theoretical limit, MDL is a constrained engineering approximation.

      *   **Formal Definitions:**
          *   *Solomonoff:* Need to define the discrete semimeasure $M(x)$. Emphasize the sum over *all* programs $p$ such that $U(p) = x*$. Mention the prefix-free requirement (Kraft's inequality).
          *   *MDL:* Define the two-part code length $L(H) + L(D|H)$. Emphasize that $H$ comes from a pre-specified model class $\mathcal{M}$. It's an optimization problem: $\min_{H \in \mathcal{M}}$.

      *   **Point 1: The Reference Machine / Coding Language:**
          *   *SI:* Invariance Theorem. Changing $U$ changes $M(x)$ by at most a multiplicative constant ($2^{c}$). Asymptotically irrelevant for prediction, but the constant can be huge for finite data.
          *   *MDL:* The choice of code (e.g., Huffman, Arithmetic, specific parametric prior) is *not* invariant in the same way. It reflects prior knowledge. In MDL, the "language" choice is a *feature* (encoding domain knowledge), whereas in SI, the UTM choice is a *bug* (theoretical arbitrariness) that gets washed out asymptotically.
          *   *Key Distinction:* SI assumes a "true" universal prior exists (up to constant). MDL admits the code choice *is* the prior and matters significantly for finite $N$.

      *   **Point 2: Computability:**
          *   *SI:* Halting problem. You can't sum over all programs. It's a limit concept.
          *   *MDL:* Restricted search space. We *can* compute it.
          *   *Conceptual Loss:* SI captures *any* computable regularity. MDL only captures regularities expressible in the chosen model class $\mathcal{M}$. If the truth is outside $\mathcal{M}$, MDL fails (bias). SI converges to the truth (if computable).
          *   *Example:* If truth is a specific cellular automaton rule, and MDL model class is "linear regression," MDL fails. SI (theoretically) finds it.

      *   **Point 3: Universality and Dominance:**
          *   *SI:* Dominance Theorem: $M(x) \geq c \cdot \mu(x)$ for any computable semimeasure $\mu$. This guarantees convergence to the true distribution.
          *   *MDL:* No such global dominance. It has *consistency* properties (if truth $\in \mathcal{M}$, MDL converges). But if truth $\notin \mathcal{M}$, no guarantee.
          *   *Implication:* SI is a theory of *universal* induction. MDL is a theory of *model selection* within a scope.

