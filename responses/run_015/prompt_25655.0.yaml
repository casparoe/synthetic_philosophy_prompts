answer: |-
  This is a remarkably coherent set of intuitions, even if they feel contradictory on the surface. You are not confused; you are navigating the exact tension that occupies modern political philosophy (specifically the debate between *cosmopolitanism* and *statism*).

  Your intuitions are actually more consistent than you give them credit for. You aren't reacting to "nationality" as a magical bond; you are reacting to **specific types of relationships and roles.**

  Here is a breakdown of the principle that captures your views, the framing issue you're missing, and the one verdict you should scrutinize.

  ### 1. The Unifying Principle: "Contextual Associative Obligations"

  You don't believe in special claims based on *nationality* per se. You believe in special claims based on **shared cooperative schemes, proximity of agency, and historical complicity.**

  If we map your cases to this principle, the contradictions dissolve:

  *   **The Pond (Case 1):** This is about **efficacy and proximity.** You aren't saving the child because they are a compatriot; you are saving them because you are the *only agent present* who can act. You have no shared scheme with the overseas child, so you default to universal equality (the coin flip).
  *   **The Dialysis (Case 2):** This is about **institutional role.** You view the government not as a global charity, but as the administrative arm of a specific cooperative scheme (the social contract) to which you contribute. You feel a duty to maintain the integrity of *your* shared project.
  *   **The Immigrant (Case 3):** This confirms you don't care about legal nationality. You care about **social membership.** The immigrant is part of the "shared cooperative scheme" (works, pays taxes, lives here). The absentee citizen is not. Your intuition aligns with the "all affected" principle.
  *   **The War (Case 4):** This is about **universal morality overriding associative duty.** Shared schemes do not grant permission to violate universal rights.
  *   **The History (Case 5):** This is about **rectificatory justice.** This isn't about "loving your country"; it's about **complicity.** You have a special duty because you are a *beneficiary of a harm*, not because you share a flag.
  *   **The Friend (Case 6):** This is the **baseline for associative duty.** Special obligations exist, but they are not absolute. They can be overridden by urgent basic needs (homelessness vs. saving money).

  **The Principle:** *We have universal duties to all humans, but we acquire stronger, specific duties when we participate in shared coercive institutions (the state), benefit from historical injustices, or occupy roles of immediate efficacy. However, these special duties cannot justify violating universal human rights or ignoring catastrophic suffering.*

  ### 2. The Framing Problem: Individual vs. Institutional Agency

  You suspected you might be smuggling in assumptions. You are, but it's a common one: **You are conflating individual morality with institutional morality.**

  *   **Case 1 (Pond)** is an *individual* moral dilemma.
  *   **Case 2 (Dialysis)** is an *institutional* policy dilemma.

  Many philosophers argue that states *should* prioritize their citizens (Case 2) precisely so that individuals *don't* have to carry the burden of global inequality alone (Case 1). The logic is: "My government takes care of me, so I am free to be a cosmopolitan individual. If my government abandoned me, I would be forced into tribalism."

  However, your intuition in Case 2 creates friction with Case 1. If you believe all lives are equal (Case 1), why does the government get to value 100 domestic lives over 1,000 foreign lives?
  *   **The Statist Defense:** The government is the agent of *us*, not *them*. It has a fiduciary duty to its shareholders (citizens).
  *   **The Cosmopolitan Critique:** Governments are moral agents too. If they can save 1,000 for the price of 100, they should.

  **The Fix:** Recognize that your intuition in Case 2 might be a heuristic for "democratic self-determination." You want *your* community to decide its fate. But if the decision is purely utilitarian (lives saved), the 10:1 ratio is where the intuition strains.

  ### 3. The Suspect Verdict: The Dialysis Case (Case 2)

  You asked which verdict you should be most suspicious of. It is **Case 2 (100 domestic lives vs. 1,000 foreign lives).**

  Here is why:
  In Case 6 (Friend vs. Stranger), you admitted that special obligations are **defeasible by serious need.** If the stranger becomes *homeless* (catastrophic harm) and the friend just saves *money* (inconvenience), you help the stranger.

  In Case 2, the "need" is death. 1,000 people die vs. 100 people die. That is a catastrophic disparity.
  *   If you accept that special obligations to friends are overridden by the stranger's homelessness, **consistency demands** that special obligations to compatriots be overridden by the foreigner's death at a 10:1 ratio.
  *   To hold Case 2 and Case 6 simultaneously is difficult. You are saying friendship duties break under weight of severe need, but citizenship duties hold even when the cost is 10x lives.

  **Why you feel this way:** You likely feel that if your government doesn't prioritize you, the social contract breaks. But philosophically, this is the hardest position to defend against a utilitarian or cosmopolitan critique.

  ### 4. Refining the "Compatriot" Concept

  Your intuition in Case 3 (Immigrant > Absentee Citizen) is the most philosophically robust. It suggests you should stop thinking about **"Compatriots"** and start thinking about **"Co-participants."**

  *   **Nationality** is a legal status.
  *   **Membership** is a social reality.

  Your gut correctly identifies that moral claims arise from *membership* (contribution, presence, reliance), not *nationality* (passports). This aligns with political theorist Joseph Carens' argument that "social membership" creates a claim to citizenship, not the other way around.

  ### Summary Advice

  1.  **Trust the "Complicity" Intuition (Case 5):** This is distinct from nationalism. It is a duty of repair. Keep this separate from "love of country."
  2.  **Trust the "Membership" Intuition (Case 3):** Legal status is less morally relevant than actual participation in society.
  3.  **Scrutinize the "State Priority" Intuition (Case 2):** Ask yourself: *Is the 10:1 ratio the breaking point?* If it were 100 vs. 101, you'd pick domestic. If it were 100 vs. 1,000,000, would you still pick domestic? Finding your "breakpoint" will tell you how much moral weight nationality actually has for you.
  4.  **Accept the Individual/State Split:** It is permissible to believe *you* (individual) should be cosmopolitan, while *your state* (institution) has a primary duty to maintain the welfare of the community that authorized it. This resolves the tension between Case 1 and Case 2 for many people.

  You aren't confused; you are a **Cosmopolitan who acknowledges Special Remedial Duties.** You believe everyone matters equally, *except* where we have specifically harmed them (colonialism) or where we are bound by a specific cooperative project (the state), provided those projects don't violate basic human rights (war). That is a very defensible, mature ethical position.
