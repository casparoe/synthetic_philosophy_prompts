answer: |-
  # Activity Design: The Riverford Protocol

  **Time:** 80 Minutes
  **Participants:** 13 (divided into 3 groups)
  **Materials:** Printed evidence packets, poker chips (or candy/counters), whiteboard, timer.

  ## 1. The Setup (10 Minutes)
  **The Scenario:**
  The town of Riverford is applying for a $50,000 "Heritage Restoration Grant." To win, the Town Council must submit a plaque inscription for the old factory site. The Grant Committee requires **documentary verification** for dates and events. The Townspeople require **cultural recognition** for their suffering and heroism.

  **The Conflict:**
  *   **The Living Memory:** Every elder says the Great Flood happened in **1973**. Neighbors used boats to rescue families. A local hero (Miller) died saving children. The factory owner fled.
  *   **The Written Record:** County maps, insurance logs, and newspapers place the flood in **1979**. No rescues are recorded. No deaths. The factory owner filed a successful insurance claim.

  **The Roles:**
  1.  **Keepers of the Story (Oral Historians):** 4 people.
      *   *Goal:* Ensure the plaque honors the 1973 rescue and Miller's death.
      *   *Asset:* **5 Community Trust Tokens.** (If the final plaque insults their memory, they withhold these).
  2.  **Keepers of the File (Archivists):** 4 people.
      *   *Goal:* Ensure the plaque matches verified documents (1979, no deaths).
      *   *Asset:* **5 Grant Eligibility Tokens.** (If the plaque contradicts documents, the Grant Committee rejects it, and they withhold these).
  3.  **The Town Council (Mediators):** 5 people.
      *   *Goal:* Secure the Grant AND keep the peace.
      *   *Win Condition:* They must leave the room with **all 10 Tokens** (5 from Oral, 5 from Archive).
      *   *Constraint:* They cannot print a plaque with two different dates (e.g., "1973/1979" is rejected by the Committee as "confusing").

  **The Payoff (The Pressure):**
  *   **Blind Wager:** Before sharing evidence, each group must privately wager 2 of their tokens on their version of the truth.
      *   If the final plaque matches your date, you keep your wager.
      *   If the final plaque contradicts your date, you lose the wager to the Council.
      *   *Why this matters:* This forces them to commit to their "truth" before hearing the other side's strongest arguments. It creates sunk cost.

  ## 2. The Rounds (50 Minutes)

  **Round 1: Preparation & Wager (10 mins)**
  *   Groups separate. They read their evidence packets (see below).
  *   They must decide their "Hard Line" (what they absolutely need on the plaque).
  *   **The Wager:** They secretly place 2 tokens in an envelope. They do not know what the other groups wagered.

  **Round 2: The Presentation (15 mins)**
  *   Oral Historians present their case to the Council. (Focus: Emotion, continuity, specific names).
  *   Archivists present their case to the Council. (Focus: Dates, signatures, official logs).
  *   *Rule:* No cross-talk yet. Only the Council can ask questions.

  **Round 3: Negotiation & Drafting (25 mins)**
  *   All groups mingle. The Council must draft the final plaque text (max 50 words).
  *   The Oral and Archive groups decide whether to hand over their remaining Trust/Eligibility tokens based on the draft.
  *   *Critical Rule:* If the Council fails to secure all 10 tokens by the end, the Grant is lost, and the town fractures. Everyone loses.

  ## 3. Evidence Packets (Print these out)

  **Oral Historians Packet:**
  *   **Testimony A:** "I was 10. It was definitely '73. Miller died that night. We don't forget our dead."
  *   **Testimony B:** "The factory wasn't supposed to be there in '73. Maybe that's why it's not in the papers? They didn't want inspectors."
  *   **Testimony C:** "If you say 1979, you're saying Miller died for nothing. He's buried in '73 plot."
  *   **Secret Info:** You know the community will riot if Miller's name is omitted. You are willing to lose the Grant money to protect Miller's name.

  **Archivists Packet:**
  *   **Doc A:** County Flood Log: "Major inundation, Nov 1979."
  *   **Doc B:** Insurance Claim #445: Filed by Factory Owner, Dec 1979. Paid in full.
  *   **Doc C:** Newspaper Clip: "Riverford Factory Floods," 1979. No mention of casualties.
  *   **Secret Info:** You know the Grant Committee is strict. If the date is wrong, the money is legally clawed back later. You cannot verify Miller's death officially.

  **Town Council Packet:**
  *   **Budget:** You need the $50k to fix the levee.
  *   **Political Risk:** If the elders are angry, you lose the next election.
  *   **Constraint:** You cannot write two dates. You cannot write "Unknown."
  *   **Secret Info:** You know the Archive team holds the legal power, but the Oral team holds the votes.

  ## 4. The Reveal & Debrief (20 Minutes)

  **The Reveal (2 mins):**
  *   Open the wagers. Did anyone lose tokens immediately?
  *   Announce the result: Did they get the Grant? Did they keep the Peace?

  **The Debrief (18 mins):**
  *Do not lecture. Ask these questions in order.*

  1.  **To the Council:** "When you heard the two dates, which one felt more 'real' in the room? Which one felt more 'usable'?"
  2.  **To the Archivists:** "Did you feel you had to apologize for the documents? Did you feel powerful or constrained by them?"
  3.  **To the Oral Historians:** "At what point did you feel your version was being treated as 'less than' fact? How did that change your negotiation tactic?"
  4.  **To Everyone:** "Look at the final plaque text. What did we have to delete to make the sentences fit? Who disappears in that version?"
  5.  **The Pivot:** "In this game, you could walk away. In real life, the people who remember 1973 have to live in the town where the plaque says 1979. What happens to them next?"

  ## 5. Predictable Failures (First Run Risks)

  1.  **The "Detective" Trap:** Grad students love to solve puzzles. They will try to figure out *which date is actually true*.
      *   *Fix:* Interrupt them. "There is no solution key. The truth is whatever you print on the plaque. Stop investigating and start deciding."
  2.  **The Lazy Compromise:** The Council will try to write "Early 1970s" or "1973/1979".
      *   *Fix:* As the Facilitator, you are the Grant Committee. Reject ambiguous dates immediately. "This violates guideline 4. Pick a year."
  3.  **Archive Dominance:** The Archive team will steamroll the Oral team because "documents don't lie."
      *   *Fix:* Remind them of the Token mechanic. If the Oral team withhold Trust Tokens, the Council loses. The Archive team needs the Oral team to win. Force them to realize they are interdependent.
  4.  **Time Creep:** Negotiation will eat the debrief.
      *   *Fix:* Hard stop at 60 minutes. If the plaque isn't printed, the Grant expires. Everyone loses. This creates a realistic crisis ending.

  ## 6. What The Game Can't Reproduce (Your Job)

  The game mechanics simulate the *conflict*, but they cannot simulate the **weight of institutional power**.

  In the classroom, the Archivists are just students with index cards. In reality, the Archive holds the keys to funding, legal recognition, and legitimacy. The Oral Historians are often marginalized communities.

  **You must supply this imbalance.**
  *   **During the game:** Speak to the Archivists in a more formal, bureaucratic tone. Give them slightly more evidence cards (5 vs 3). Make the Grant Committee rules (which you enforce) sound rigid and legalistic.
  *   **During the debrief:** This is where you bring in the theory. Once they have felt the frustration of having their memory "disqualified" by a document, *then* you can mention Maurice Halbwachs or the concept of "Collective Memory."
  *   **The Hard Truth:** Tell them: "In this game, you could argue. In Riverford, the 1979 plaque goes up. The 1973 story becomes a rumor. The social bond of the rescue exists only as long as the elders are alive. When they die, the archive wins by default. That is the violence of the record."

  ## 7. Facilitator Notes

  *   **Room Setup:** Put the Archivists and Oral Historians on opposite sides. Put the Council in the middle. Physical distance reinforces the divide.
  *   **The "Typo" Note:** You mentioned the "archivist" typo in your notes. Don't worry about it, but ensure your printed materials spell it correctly so the Archivists feel professional.
  *   **Tone:** Keep yourself neutral until the debrief. You are the Grant Committee, not the teacher, during the activity. Be cold about the rules.
  *   **Outcome:** It is okay if they fail. If they fail to secure all tokens, that is a powerful teaching moment about incommensurable truths. Don't rescue them.

  ## 8. Sample Plaque Texts (For Comparison)

  *   **The Archive Win:** "Site of the 1979 Riverford Flood. Documented in County Records." (Clean, accurate, erases the rescue).
  *   **The Oral Win:** "In Memory of the 1973 Flood. Where Neighbors Saved Neighbors." (Emotional, true to memory, legally ineligible for Grant).
  *   **The Hybrid (Often the result):** "Commemorating the Riverford Floods. Resilience in the face of water." (Vague, satisfies no one, keeps the money, loses the history).

  Use these examples in the debrief to show what was lost in their specific final draft.
