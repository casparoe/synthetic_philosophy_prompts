  *Refining the "Modality" point:* Static analysis proves "In all possible worlds where this code compiles..." TA wants "In all possible worlds where *anything* exists..." The scope of the quantifier is the issue.

  *Refining the "Uniqueness" point:* Haskell vs. OCaml. Both compile. Both valid. If TA says "Only Kant's categories work," it's like saying "Only Haskell's type system allows for IO." That's empirically false in CS.

