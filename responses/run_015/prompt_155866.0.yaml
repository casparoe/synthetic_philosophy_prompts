      *   *Deterrence $\rightarrow$ C (Sanction her):* Deterrence is about signaling to *others* that rules matter. If she refuses visibly, and we don't sanction, the conditionality regime collapses. This is the standard "tough" line.
      *   *Paternalism $\rightarrow$ B (Make her work, don't sanction):* Paternalism is "for her own good." Work/activity prevents skill atrophy and depression. So, keep the requirement (benefit of activity). But, sanctioning her (cutting income) harms her well-being, undermining the paternalistic goal. So, enforce the activity but protect the income.

      *   *Feasibility Check:* Can Reciprocity really lead to A? Yes, if the "Contribution Good" is negligible compared to her past contributions, making the demand unfair. Can Paternalism really lead to B? Yes, if the activity helps but the poverty hurts more. Can Deterrence really lead to C? Yes, that's its natural home.
      *   *Potential Conflict:* Reciprocity usually demands compliance. I need to frame the *specific refusal* as justified under reciprocity (e.g., the demand is outside the scope of the insurance contract) while the *act* of working is still good for her (Paternalism) and the *rule* must be upheld for others (Deterrence).
      *   *Refinement:* The claimant needs a strong contribution history to make Reciprocity lean towards A. She needs to be refusing something useful but low-status to make Paternalism lean towards B (keep her active). The refusal needs to be public to make Deterrence lean towards C.

