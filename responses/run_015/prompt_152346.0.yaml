answer: |-
  This is a sharp setup. You've correctly identified that your advisor's verdict on the Lorenz system (deterministic but open) already rejects the naive Laplacean view that *ontological determinism entails predictive closure*. Her position is clearly epistemic or effective, not purely ontological.

  Here is the breakdown of how she will likely react, the underdetermined principles at play, and the tie-breaker case you need.

  ### 1. Likely Verdict on the Shadow Lattice
  **She will call it: Open.**

  **Reasoning:** Her verdict on the Lorenz system is the tell. She treats "predictive closure" as requiring *effective access* to the future state, not just the existence of a unique future. In the Lorenz case, the barrier is physical/measure-theoretic (infinite precision required due to SDIC). In your Shadow Lattice, the barrier is logical (Turing undecidability).
  Since she already conceded that deterministic dynamics aren't sufficient (via Lorenz), she will likely concede that computable dynamics aren't sufficient either if the *readout* is undecidable. To her, a "prediction" implies a procedure an agent can execute; if the procedure requires solving the Halting Problem, no prediction is possible, regardless of the system's ontological status.

  **Closest Analog:** **The Lorenz Weather System.**
  Both are cases where the "laws" are fixed and deterministic, but the *mapping* from initial conditions to the specific future observable is inaccessible to the predictor. Lorenz is inaccessible due to instability (amplification of error); the Lattice is inaccessible due to undecidability (logical depth). Both result in the same epistemic outcome: Open.

  ### 2. The Two Underdetermined Rules
  Your advisor's four verdicts are consistent with at least two distinct principles. These principles agree on her four cases but **split** on your Shadow Lattice.

  **Rule A: The Effective Computability Principle (ECP)**
  *   **Definition:** A system is predictively closed only if there exists a computable function that maps finite-precision initial conditions to the future observable within finite time.
  *   **Fits Her Record:**
      *   Oscillator: Computable (Closed).
      *   Quantum: Non-computable probabilities (Open).
      *   Reflexive: Function changes/undefined (Open).
      *   Lorenz: Requires infinite precision for arbitrary time (effectively non-computable) (Open).
  *   **Verdict on Lattice:** **Open.** (The macro-observable encodes the Halting Problem, which is non-computable).

  **Rule B: The Dynamical Stability Principle (DSP)**
  *   **Definition:** A system is predictively closed only if the dynamics are deterministic and exhibit no Sensitive Dependence on Initial Conditions (SDIC) *at the level of the equations of motion*.
  *   **Fits Her Record:**
      *   Oscillator: Stable (Closed).
      *   Quantum: Indeterministic (Open).
      *   Reflexive: Laws shift/Unstable (Open).
      *   Lorenz: Chaotic/SDIC (Open).
  *   **Verdict on Lattice:** **Closed.** (You specified "no chaos" and "local rules are computable." The uncomputability arises from the *definition of the observable*, not the dynamical evolution of the state itself. The trajectories do not diverge exponentially; the barrier is semantic, not dynamical).

  **The Conflict:** If she adheres to **ECP**, your Lattice is Open. If she adheres to **DSP**, your Lattice is Closed. This is where your meeting will hinge.

  ### 3. The Tie-Breaker Case
  To lock down which principle she actually holds (without waiting for her reaction to the Lattice), propose this case during the discussion. It separates Dynamical Stability from Computability in the opposite direction of the Lattice.

  **The Case: "The Chaotic Conservation"**
  *   **System:** A standard chaotic system (e.g., Lorenz Attractor or Double Pendulum).
  *   **Dynamics:** Deterministic, but with high SDIC (Chaotic).
  *   **Observable/Prediction:** A coarse-grained conservation law. E.g., *"Will the total energy of the system remain within bounds $[E_{min}, E_{max}]$ for all time $t$?"*
  *   **Properties:**
      *   **Dynamical Status:** Unstable (Chaotic).
      *   **Computational Status:** Trivial/Computable (The answer is known via the Hamiltonian/constraints, regardless of the trajectory).

  **How it locks down the principle:**
  *   **If she says Closed:** She follows **ECP** (Effective Computability). She cares about whether the *answer* can be known, not whether the *trajectory* is stable. This supports your argument that the Shadow Lattice should be judged on computability, not dynamics.
  *   **If she says Open:** She follows **DSP** (Dynamical Stability). She cares about the *nature of the trajectories*. If the dynamics are chaotic, it's open, even if we happen to know the answer to this specific question. This suggests she might call your Shadow Lattice **Closed** (if she views the Lattice as dynamically stable) or **Open** for different reasons than you expect.

  ### Strategic Advice for the Meeting
  Frame the Shadow Lattice not as a counterexample to her verdicts, but as a stress test for the *boundary* between the Lorenz case and the Oscillator case.
  *   **Argument:** "In Lorenz, the barrier is *precision* (we can't measure well enough). In the Lattice, the barrier is *logic* (we can't compute well enough). If Lorenz is Open because we can't access the state, shouldn't the Lattice be Open because we can't compute the state?"
  *   **Trap to Avoid:** Don't let her dismiss the Lattice as "unphysical." She might argue that a system encoding the Halting Problem cannot exist in a finite physical universe. If she goes there, pivot to the **Chaotic Conservation** case, which is undeniably physical, to isolate the principle.

  This setup shows you understand the nuance between ontic determinism and epistemic predictability, which is exactly what a PhD advisor wants to see. Good luck.
