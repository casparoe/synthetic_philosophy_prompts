answer: |-
  Here is the breakdown of your friend's decision architecture, the verdict on the new case, and the experimental design to finally pin her down.

  ### 1. The Verdict on the Predictive Letter
  **She refuses.**

  She does not wire the hundred dollars.

  **Why:**
  Her behavior is consistent with a **Complexity-Prior / Evidence-Scaling Rule** (Candidate 2), not a hard Utility Bound (Candidate 1).

  The smoking gun in her track record is the **Existential Risk (X-Risk)** donation.
  *   **The Contradiction:** She claimed the numbers "stopped mattering around a billion" regarding the Mugger. Yet, she funds X-Risk mitigation. X-Risk work is valuable *only* if you count the lives of future generations, which number in the trillions or quadrillions (or vastly more if space colonization occurs). If she had a hard utility cap at one billion lives, the difference between saving 1 billion people and saving $10^{40}$ people would be negligible to her. The fact that she prioritizes X-Risk over Bednets (which save lives *now* with higher certainty) proves she is **not** capping the utility of the outcome.
  *   **The Real Filter:** She is capping the *credibility of the claim*.
      *   **Mugger/Button:** Claim is "Magic/Unknown Mechanism." Prior probability is infinitesimal. No amount of stake size increases the probability.
      *   **X-Risk:** Claim is "Physics/Engineering/Sociology." Prior probability is low ($10^{-4}$), but grounded in causal models.
      *   **The Letter:** Claim is "Precognition + Multiverse Leverage." The evidence provided (lottery prediction, likelihood ratio $10^7$) proves *information access*, but it does not prove *causal leverage* over $10^{40}$ beings. To affect $10^{40}$ beings requires control over simulations or multiverses. The prior on "Random letter sender controls a multiverse" is likely far lower than $10^{-7}$ (probably closer to $10^{-20}$ or less). The evidence does not scale with the complexity of the claim.

  She refuses because the **evidence provided ($10^7$) is insufficient to overcome the complexity penalty of the claim ($10^{40}$ leverage).**

  ### 2. Autopsy of the Four Rules

  Here is how her past verdicts score against your candidate rules:

  | Rule | Mugger (Magic) | Button (No Story) | X-Risk (Science) | Letter (Prediction) | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Bounded Utility** (Stakes cap out) | **Refuse** (Fits) | **Refuse** (Fits) | **Refuse** (Contradicts*) | **Refuse** (Fits) | **Dead** |
  | **2. Evidence-Scaling** (Complexity Prior) | **Refuse** (Fits) | **Refuse** (Fits) | **Accept** (Fits) | **Refuse** (Fits) | **Alive** |
  | **3. Threat Heuristic** (No threat = Pay) | **Refuse** (Contradicts) | **Refuse** (Contradicts) | **Accept** (Fits) | **Accept** (Fits) | **Dead** |
  | **4. Policy Rule** (Long-run loss) | **Refuse** (Fits) | **Refuse** (Fits) | **Accept** (Fits**) | **Refuse** (Fits) | **Plausible** |

  *\*Note on Rule 1:* As analyzed above, her X-Risk funding kills this rule. She only acts as if utility is bounded when the *epistemic grounding* is weak.
  *\*\*Note on Rule 4:* This is the main competitor. However, Rule 4 is usually a heuristic proxy for Rule 2. We expect "long-run loss" from muggers *because* the priors are low. The Letter is a one-off anomaly, not a policy class. If she were a pure Rule 4 follower, a verified one-off anomaly might trigger acceptance. Rule 2 is the more fundamental engine.

  ### 3. Evaluating Your Proposed Experiment

  **Your Proposal:** Same stakes ($10^{40}$), but the mechanism is physically inspectable and the outcome is checkable afterward.

  **Does it split the rules?**
  **Yes.** This is a strong test, specifically for killing Rule 1 (Bounded Utility).

  *   **If she Accepts:** It confirms **Rule 2 (Evidence-Scaling)**. The evidence (inspection) has finally become strong enough to match the complexity of the claim. It proves her refusal on the Letter was due to lack of evidence, not the size of the stakes.
  *   **If she Refuses:** It keeps **Rule 1 (Bounded Utility)** alive. It suggests that even with perfect evidence, she does not believe $10^{40}$ lives *can* be valued or affected, or that her utility function genuinely saturates.

  **Critique:**
  It is a good experiment, but "physically inspectable mechanism for $10^{40}$ lives" is conceptually difficult. If the mechanism is in our universe, it cannot affect $10^{40}$ lives (there aren't that many atoms). She might refuse simply because the inspection reveals the claim is physically impossible, not because of her decision rule. You risk confounding *physical impossibility* with *decision theory*.

  ### 4. The Cleaner Experiment

  To cleanly separate **Bounded Utility** (Rule 1) from **Evidence-Scaling** (Rule 2), you need to hold the **Evidence Constant** and vary the **Stakes**.

  **The "Modest vs. Grand Miracle" Test:**

  Present her with two versions of the **Predictive Letter** case (same lottery evidence, same $10^7$ likelihood ratio):

  *   **Case A (Modest):** "Wire $100. We will prevent **1 million** deaths (e.g., by funding a verified vaccine rollout in a war zone via anonymous proxies)."
  *   **Case B (Grand):** "Wire $100. We will prevent **$10^{40}$** deaths (via the unexplained mechanism)."

  **The Predictions:**

  *   **Rule 1 (Bounded Utility):** She should **Refuse Both** (or be indifferent). If the number "stops mattering around a billion," then 1 million and $10^{40}$ are both in the "noise" or "capped" region relative to the cost/uncertainty. *Correction:* Actually, if she is a bounded utilitarian, she might Accept Case A (1 million is within the bound) and Refuse Case B (if the bound is low). But given her X-Risk stance, she likely values 1 million lives.
      *   *Refinement:* If she has a hard cap at 1 billion, she treats 1 million and $10^{40}$ as linearly comparable. If she accepts A, she *must* accept B unless the probability drops. But the probability is fixed by the letter.
      *   *Better Prediction for Rule 1:* If she truly has a cap, the jump from 1 million to $10^{40}$ shouldn't change her mind *if* she already accepts the evidence. But the real test is below.

  *   **Rule 2 (Evidence-Scaling):** She should **Accept Case A** and **Refuse Case B**.
      *   **Why:** The evidence ($10^7$ odds of honesty) is sufficient to justify acting on a claim of 1 million lives (complexity is low; rich anonymous donors exist). The evidence is *insufficient* to justify a claim of $10^{40}$ lives (complexity is huge; requires multiverse access).
      *   **The Split:** This isolates the "Number stopped mattering" comment. Did the number stop mattering because of a **Utility Cap** (Rule 1), or because **Large Numbers require More Evidence** (Rule 2)?

  **Why this is better than your proposal:**
  Your proposal (Inspectable Mechanism) maxes out the evidence. If she refuses, you don't know if it's because she caps utility or because she thinks $10^{40}$ impact is physically impossible even with a machine.
  By keeping the evidence fixed (the Letter) and changing the stakes, you test whether the **size of the claim itself** triggers the rejection.
  *   If she says "1 million is believable, $10^{40}$ is not," she admits the number matters, but only when grounded. (Rule 2 wins).
  *   If she says "I don't trust either because I can't verify the outcome," she is a Skeptic (Rule 4).
  *   If she says "1 million is worth it, $10^{40}$ is *also* worth it," she is a pure EV maximizer (Rule 2, but with high tolerance).
  *   If she says "1 million is worth it, $10^{40}$ is *suspiciously* too big," she confirms the Complexity Prior.

  **Recommendation:**
  Run the **Modest vs. Grand Miracle** test first. It's cheaper (no need to invent a fake inspectable machine) and directly probes her comment about the numbers "stopping mattering." If she accepts the Modest Letter but refuses the Grand Letter, you have confirmed she is an **Evidence-Scaler**, and her "bounded utility" comment was just imprecise language for "complexity penalty."

  If you want to kill the Bounded Utility rule definitively, *then* use your Inspectable Mechanism case. If she accepts the Inspectable $10^{40}$ case, Bounded Utility is dead. If she refuses it, Bounded Utility is the only rule left standing. But start with the Letter variants; it's the cleaner cut.
