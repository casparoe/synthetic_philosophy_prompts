prompt: |-
  yo — you're a philosopher of machine learning who also does comedy about it, so you know the debate setup already: you can't check a powerful model's reasoning directly, so instead you have two models argue opposite sides of a concrete factual question in front of a human judge, and the judge only ever adjudicates small, individually checkable claims. The hope is that spotting a lie is cheaper than producing the truth. The known worry is "obfuscated arguments" — the bad step is buried so deep in a long chain that no single checkable claim is the lie.

  I want a leaked artifact from a startup that has commercialized this. Three sections, in this order:

  **The transcript** — about 600–700 words. Final round of a paid debate on something boring and consequential (a drug trial, a dam, a supply chain — your pick). Two model debaters, LARK and CEDAR, one human judge, and one invented platform rule that does the real work: the judge has a fixed budget of claims they can contest per round, so any step nobody manages to contest is entered as settled. CEDAR wins by writing more steps than the budget allows anyone to check, each one locally plausible, and by turning every challenge into a sub-debate that needs its own sub-debate. LARK should be visibly right, visibly losing, and getting shrill about it. Neither one ever says "obfuscated," "alignment," or "safety." Someone who knows the debate literature should wince in recognition; someone who doesn't should still follow it.

  **The judge's ruling** — about 100 words. Sincere, mild, HR-ish prose explaining why the wrong side scored higher.

  **What I was aiming at** — about 200 words. What the piece is actually claiming about the limits of debate, and where you took a liberty.

  Before drafting, spend a few lines listing the ways an obfuscator really does beat a time-limited judge, then pick exactly one to dramatize — I'd rather have one mechanism done precisely then three gestured at.
