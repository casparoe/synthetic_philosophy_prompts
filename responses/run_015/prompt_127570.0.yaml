prompt: |-
  hey — I need something by thursday lab meeting and I'm hoping you can just draft the whole thing.

  Backstory: our lab runs a joint seminar with the theory/philosophy group down the hall, and two of the senior people have been going at it for over a year now. Marcus is a systems/computational neuroscientist; Ines works on dynamical and embodied approaches and is very anti-'the brain is a computer'. The rest of us have stopped learning anything from it, so the chair said: do an adversarial collaboration and produce a joint statement. Can you draft the document I'd put in front of them?

  Roughly where each of them stands (I've tried to be fair; correct me in the doc if I've made one of them weaker than they are):

  Marcus: chunks of nervous tissue literally perform computations over representational states; when a model's variables map onto cell types and its operations onto causal interactions in the circuit, we're not just redescribing the tissue, we've found real structure; the decades of predictive success of computational neuroscience is evidence for that (inference to the best explanation); and there's a fact of the matter about which computation a given circuit implements, once you get the criterion of implementation right.

  Ines: what's in the skull is a high-dimensional dynamical system continuously coupled to a body and an environment; singling out some of its states as 'representations' and some of its transitions as 'computational steps' is a modeling decision constrained by what we want to predict and control, not a discovery about the tissue; the dynamical/ecological descriptions are at least as good and arguably get the time-course and the body-looping right in a way that input-output function talk doesn't; there's no privileged 'the' computation a piece of cortex implements.

  Things they've already both conceded (go ahead and add more, but only ones both would really sign, not cheerleading):
  - the brain is not a von Neumann machine: no stored program, no central clock, no clean CPU/RAM split, no error-corrected digital code. Whatever 'is a computer' means here, it doesn't mean that.
  - there's a serious triviality worry: with enough gerrymandering of the mapping you can arguably read any computation off any physical system (rocks, stomachs, the weather). Both agree a criterion of implementation has to block this.
  - a lot of neural signaling doesn't look obviously computational at all: dendritic plateau potentials, gap-junction coupling, volume transmission of neuromodulators, astrocytic calcium waves, ephaptic effects, stochastic vesicle release, one neuron sitting in several assemblies at once.
  - computational models and dynamical models are both useful. The fight is about what that usefulness shows.
  - whether some machine could be conscious is a different question from whether the brain computes, and neither view settles it by itself.

  What I want in the document:

  1. A numbered agreed-claims section — things both can sign that aren't vacuous, phrased so a hostile reader couldn't call them filler.
  2. A disagreements table with columns: the issue / the formulation Marcus would sign / the formulation Ines would sign / verbal or substantive, and why. At least six rows. If you can't produce a version of a view that its own holder would actually sign, say that in the row instead of fudging it — I'd rather know where the collaboration breaks than get something smooth.
  3. A cruxes section: the sub-questions where settling them would actually move at least one side. My guesses at the big ones: (a) is there a criterion that separates systems that compute from systems we merely find it convenient to describe computationally, and does that criterion over-block or under-block; (b) where does implementation end and 'background conditions the computation presupposes' begin — I think this is the one that actually bites, given the weird-physiology list above; (c) can one piece of tissue implement many computations at once, and if so is that a problem for Marcus or just a fact about multiple descriptions; (d) do representations get their content from causal role right now or from selection/learning history.
  4. For each crux, a test or case both would accept as bearing on it, with each side's prediction written down in advance, including how big a difference would have to count. Concretely, I'd like at least these three: (i) a lesion/intervention-transfer test — a mechanistic model with parts mapped to cell types versus a black-box dynamical fit that matches the recorded activity just as well, then both are made to predict the same never-seen optogenetic suppressions and novel stimulus families; (ii) a porting test — take a computation Marcus says he's identified in a circuit and implement it on totally different hardware, and ask what would have to happen for each side to say the original and the port are doing the same thing; (iii) a slow substrate-replacement case — neurons swapped one at a time for devices that reproduce each cell's input-output transformation and its plasticity rule — where each says the computation (as opposed to the behaviour, as opposed to anything about experience) survives to what point, and why.
  5. A small joint audit table: for retina, cerebellum, cerebral cortex, basal ganglia, the neuromodulatory systems, a spinal central pattern generator, and glia — does that subsystem compute, not compute, or only under a specified criterion? Mark the rows where they genuinely differ; I suspect there are fewer than they think.
  6. A ruling on two criteria I made up, which I'll put to them: (A) an etiological one — a system computes only if there's a counterfactually robust map from its physical states to abstract states that the system was selected, developed, trained or designed to maintain (this is meant to let the retina in and keep the stomach out); (B) a compression one — a system computes only if the shortest description that still lets you predict the system's behaviour under new interventions has to posit content-like states and formal transitions, so that if a purely dynamical description is equally short and generalizes equally well, there's no computation there. For each: what would Marcus accept, what would Ines accept, what's wrong with it, and is there a third criterion both could live with.
  7. A short section on which of their disputes are really only about the word 'computation' (mathematical mapping sense versus causal-mechanistic sense versus explanatory-role sense) and which survive once the word is fixed.
  8. Finally, one paragraph from each side saying what they'd count as evidence against their own position.

  Please don't turn this into a verdict about who's right — I need both of them to be able to put their names on it, and if you think some part is genuinely unbridgeable just say which part and leave it. No references or citations needed, we just need it self-contained; where a test needs a real experiment, describe the setup and the predictions rather than pointing at papers. Also add a couple of typos? no — I mean, don't worry about polish, just don't make it sound like a review article.
