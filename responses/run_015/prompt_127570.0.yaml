answer: |-
  **DRAFT FOR DISCUSSION — JOINT SEMINAR COLLABORATION**
  **Subject:** Framework for Adversarial Collaboration on Computational vs. Dynamical Descriptions
  **Parties:** Marcus (Computational/Representational), Ines (Dynamical/Embodied)
  **Date:** [Current Date]
  **Status:** Preliminary Consensus & Mapping of Disagreements

  ### 1. Agreed Claims (Joint Statement)

  Both parties endorse the following propositions. These are intended to be non-vacuous constraints on any future model or theory proposed by either side.

  1.  **Non-Von Neumann Architecture:** The brain does not operate via a stored-program architecture with a central clock, distinct CPU/RAM separation, or error-corrected digital code. Any claim that the brain "is a computer" must not imply these architectural features.
  2.  **The Triviality Constraint:** Pancomputationalism is unacceptable. There must be a criterion of implementation that distinguishes systems that genuinely compute from physical systems (e.g., rocks, weather) where a computational description is merely possible via gerrymandered mapping. Both parties agree current criteria are insufficient.
  3.  **Physiological Complexity:** A significant portion of neural signaling (dendritic plateaus, gap junctions, volume transmission, astrocytic waves, ephaptic effects, stochastic release) does not resemble standard digital logic or simple spike-counting. Models ignoring these mechanisms are acknowledged as incomplete approximations.
  4.  **Utility vs. Ontology:** Both computational models (variables mapped to cell types) and dynamical models (state-space trajectories) possess predictive utility. The parties disagree on whether this utility entails the discovery of ontological structure (Marcus) or reflects pragmatic modeling choices (Ines).
  5.  **Orthogonality of Consciousness:** The question of whether the brain computes is distinct from the question of whether the brain (or a machine) is conscious. Neither position settles the hard problem of consciousness by itself.
  6.  **Embodiment:** Neural activity is continuously coupled to body dynamics and environmental structure. Even if internal states are representational (Marcus), they are constrained by this coupling. Even if the system is purely dynamical (Ines), the skull boundary is not a hard stop for causal analysis.

  ### 2. Map of Disagreements

  | Issue | Marcus's Formulation | Ines's Formulation | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- |
  | **1. Status of Representations** | Representational states are real physical structures identified by their causal role in the circuit. | "Representations" are useful fictions imposed by the modeler to track task-relevant variables. | **Substantive.** Disagree on whether content is intrinsic or ascribed. |
  | **2. Privileged Description** | There is a fact of the matter about which computation a circuit implements, given the correct implementation criterion. | There is no privileged computation; different descriptions highlight different affordances for control/prediction. | **Substantive.** Disagree on realism vs. instrumentalism. |
  | **3. System Boundaries** | The computational system is primarily the neural circuit; body/environment are inputs/outputs. | The cognitive system includes the body and environment; skull-boundary cuts causal loops arbitrarily. | **Substantive.** Affects where we look for mechanisms. |
  | **4. Explanation of Success** | Predictive success of computational models is inference to the best explanation (the model works because it matches structure). | Predictive success shows empirical adequacy, not structural identity (the model works because it captures dynamics). | **Substantive.** Core philosophical divergence. |
  | **5. Multiple Realizability** | The same computation can be implemented in different substrates (silicon, wetware) if the causal map holds. | Changing the substrate changes the dynamics; if dynamics change, it is not the "same" process. | **Mixed.** Depends on definition of "same process." |
  | **6. The Triviality Solution** | Solution lies in physical constraints (causal powers, modularity) inherent to the system. | Solution lies in pragmatic constraints (interests of the observer, control goals). | **Substantive.** Internal vs. External criteria. |

  *Note on Row 5:* Marcus argues this is a feature of computation; Ines argues this is a bug of the computational description. We could not agree on a shared formulation here without one side conceding their core position.

  ### 3. Cruxes (Sub-questions for Resolution)

  To move forward, we identify four specific sub-questions where empirical or formal progress could shift confidence.

  *   **Crux A (Implementation Criterion):** Is there a criterion that separates computing systems from non-computing systems that does not over-block (exclude clear cases like retina) or under-block (include rocks)?
  *   **Crux B (Background Conditions):** Where does the implementation of a computation end and the "background physics" begin? (Specifically regarding the weird physiology list in Claim 3).
  *   **Crux C (Multiple Descriptions):** Can one piece of tissue implement multiple distinct computations simultaneously? If yes, is this a problem for computational realism (Marcus) or just a fact about description levels (Ines)?
  *   **Crux D (Content Grounding):** Do neural states get their content from their current causal role (Marcus) or from selection/learning history (Ines)?

  ### 4. Proposed Tests and Cases

  For each Crux, we propose a thought experiment or experimental setup where our predictions diverge.

  **Test (i): Lesion/Intervention-Transfer**
  *   **Setup:** Build two models of a specific circuit (e.g., oculomotor integrator). Model M is mechanistic/computational (parts mapped to cell types). Model D is black-box dynamical (fits activity trajectories). Both fit existing data equally well.
  *   **Intervention:** Apply novel optogenetic suppressions to specific cell types and introduce novel stimulus families not in the training set.
  *   **Marcus's Prediction:** Model M will generalize better because it captures the causal structure. Model D will fail on out-of-distribution interventions.
  *   **Ines's Prediction:** Model D will match or exceed M on temporal dynamics and body-coupled tasks. Model M will fail because it ignores non-computational physiology (e.g., ephaptic effects) that matters under perturbation.
  *   **Threshold:** A consistent >15% difference in predictive accuracy on novel interventions counts as evidence for the winning framework.

  **Test (ii): The Porting Test**
  *   **Setup:** Take a computation Marcus identifies in a circuit (e.g., pattern separation in dentate gyrus). Implement the exact input-output function and plasticity rule on non-biological hardware (digital or analog silicon).
  *   **Question:** Are the original and the port doing the "same thing"?
  *   **Marcus's Condition:** Yes, if the causal map between abstract variables and physical states is preserved and the function is robust.
  *   **Ines's Condition:** No, unless the temporal dynamics, noise structure, and energy constraints of the port match the biological substrate closely enough to preserve the coupling with the body.
  *   **Threshold:** If the port behaves identically on all behavioral tasks but fails on metabolic or timing constraints, Ines counts this as a failure of "sameness"; Marcus counts it as success.

  **Test (iii): Slow Substrate Replacement (Ship of Theseus)**
  *   **Setup:** Hypothetical case. Neurons are swapped one at a time for devices that reproduce the cell's I/O transformation and plasticity rule exactly, but lack biological dynamics (e.g., no dendritic spikes, different time constants).
  *   **Question:** At what point does the "computation" cease to exist?
  *   **Marcus:** The computation survives as long as the functional map and plasticity rules are maintained, regardless of substrate speed or material.
  *   **Ines:** The computation dissolves immediately or gradually as the dynamical coupling changes. If the time constants shift, the interaction with the body changes, so the cognitive process is different.
  *   **Threshold:** Marcus predicts behavioral equivalence implies computational equivalence. Ines predicts behavioral equivalence is insufficient if the internal trajectory through state space diverges.

  ### 5. Joint Audit Table (Subsystem Status)

  We assessed specific subsystems to see if they "compute." We mark rows where we genuinely differ on the label or the criterion.

  | Subsystem | Marcus's Verdict | Ines's Verdict | Agreement? |
  | :--- | :--- | :--- | :--- |
  | **Retina** | Yes (Edge detection, coding). | Yes (Peripheral transducer, clear I/O). | **Agree** |
  | **Cerebellum** | Yes (Error correction, forward model). | Mixed (Dynamical tuner, but "model" is misleading). | **Disagree** |
  | **Cerebral Cortex** | Yes (Hierarchical inference). | No (High-dimensional reservoir, coupled dynamics). | **Disagree** |
  | **Basal Ganglia** | Yes (Action selection algorithm). | Yes (Dynamical gating mechanism). | **Agree on function, Disagree on label** |
  | **Neuromodulators** | No (Parameters/Gain control). | No (Contextual coupling signals). | **Agree** |
  | **Spinal CPG** | Yes (Oscillator circuit). | Yes (Dynamical attractor). | **Agree** |
  | **Glia** | No (Support/modulation). | No (Part of the medium, not the computation). | **Agree** |

  *Note:* The biggest divergence is on the Cortex and Cerebellum. We agree on peripheral/reflective systems (Retina, CPG) and modulatory systems.

  ### 6. Ruling on Proposed Criteria

  We evaluated two criteria proposed by the lab chair to see if they can serve as a shared standard.

  **Criterion (A): The Etiological Criterion**
  *Definition:* A system computes only if there is a counterfactually robust map from physical to abstract states that the system was selected, developed, trained, or designed to maintain.
  *   **Marcus:** Accepts with reservation. Worries this excludes novel computations learned online that weren't "selected for."
  *   **Ines:** Accepts. Fits well with embodied evolution and development.
  *   **Problem:** Hard to apply to individual learning events vs. evolutionary history.
  *   **Joint Status:** Useful for filtering "accidental" computations (rocks), but too restrictive for online learning.

  **Criterion (B): The Compression Criterion**
  *Definition:* A system computes only if the shortest description that predicts behavior under intervention *requires* positing content-like states. If a purely dynamical description is equally short and generalizes equally well, there is no computation.
  *   **Marcus:** Rejects. Makes computation observer-relative (depends on the language of the describer).
  *   **Ines:** Accepts. Makes the ontological claim manageable.
  *   **Problem:** "Shortest description" is language-dependent.
  *   **Joint Status:** Unbridgeable. Marcus sees this as instrumentalism; Ines sees it as honesty.

  **Proposed Third Criterion: Interventional Stability**
  *Definition:* A system computes if there exists a mapping that remains stable under a wide range of physical interventions that do not disrupt the system's goal-directed behavior.
  *   **Marcus:** Accepts (aligns with causal structure).
  *   **Ines:** Accepts (aligns with robust dynamical attractors).
  *   **Joint Status:** **Provisional Agreement.** We will use this to evaluate models in Test (i).

  ### 7. Verbal vs. Substantive Disputes

  We acknowledge that some friction arises from differing definitions of "computation."

  *   **Verbal:** If "computation" means *any* mathematical mapping from physical states to abstract states, Ines agrees the brain computes, but finds the claim trivial. Marcus agrees this definition is too weak. If we fix the definition to "causal implementation of algorithmic structure," the disagreement remains.
  *   **Verbal:** If "representation" means "correlation with environmental variable," both agree representations exist. Marcus means "content-bearing state used by downstream mechanisms." Ines means "modeler's label."
  *   **Substantive:** Once terms are fixed, the dispute survives regarding **ontological commitment**. Marcus believes the computational structure exists independently of the observer. Ines believes the computational structure is imposed by the observer to facilitate control. This is not a verbal dispute; it is a metaphysical one with empirical consequences (see Test (i)).

  ### 8. Falsification Conditions

  **Marcus:**
  "I would count my position as significantly undermined if mechanistic computational models consistently fail to predict the outcomes of novel structural interventions (optogenetics/lesions) in cases where purely dynamical black-box models succeed, specifically when the dynamical models utilize variables that cannot be mapped to distinct causal mechanisms in the circuit. If the 'structure' I claim exists doesn't help me intervene better than the 'dynamics' Ines describes, the structure is likely not there."

  **Ines:**
  "I would count my position as significantly undermined if a specific computational description consistently predicts intervention outcomes better than dynamical models *and* if that description can be shown to map uniquely to physical structure without relying on observer-relative pragmatic choices. Specifically, if we find a 'code' in the cortex that survives substrate changes (Test ii) and explains behavior better than state-space trajectories, I would concede that computation is more than a descriptive lens."

  ***

  **Next Steps:**
  1.  Select one subsystem from the Audit Table (likely Cortex or Cerebellum) for Test (i).
  2.  Define the "Interventional Stability" metric formally.
  3.  Circulate to the theory group for comment before the next seminar.

  **Signatures:**

  ____________________ (Marcus)

  ____________________ (Ines)
