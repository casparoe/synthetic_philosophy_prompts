answer: |-
  ### Phase 1: The Messy Brainstorm

  *Initial dump of constraints, intuitions, and empirical facts. Some contradict others.*

  *   **Snapshot problem:** Can't just count animals today. Need to integrate over time.
  *   **r/K selection:** Need to handle high-turnover (insects, mice) vs low-turnover (elephants) differently? Or is suffering per unit time the same?
  *   **The "Bounce Back":** If we cull or destroy habitat, does $N$ return to $K$? If yes, short-term pain for long-term nothing?
  *   **Sign of welfare:** Is a wild life $>0$ or $<0$? If we don't know, can the theory output a decision?
  *   **Existing vs. Possible:** Killing a deer is different from preventing a fawn. One has a subject, one doesn't.
  *   **Replaceability:** If a chick dies and another is hatched, is the universe morally neutral? Only if the lives are identical.
  *   **Death quality:** Starvation vs. predation vs. quick cull. Does the *mode* of death count separately from the lost future?
  *   **Taxonomic line:** Do nematodes count? If yes, numbers explode. If no, why?
  *   **Ecosystem value:** Does the woodland have value independent of the animals? (User seems to want to bracket this, focus on sentient welfare).
  *   **Transition costs:** The suffering *during* the habitat loss. Can this be amortized?
  *   **Discounting:** Do future animals matter less? If not, infinite future suffering swamps everything.
  *   **Density dependence:** Mortality isn't random; it's a function of $N/K$. Theory must model this function.
  *   **Regime shifts:** Ecosystems can flip states (woodland -> scrub). Different $K$, different welfare profiles.
  *   **Uncertainty:** We don't know the welfare function. Theory must handle deep uncertainty without collapsing.
  *   **Aggregation:** Sum total? Average? Prioritize the worst off?
  *   **Symmetry:** Is pain just negative pleasure? Or is pain lexically worse (negative utilitarianism)?
  *   **Identity:** The specific animals born in Scenario A are not the same as in Scenario B (Non-Identity Problem).
  *   **Compensatory Mortality:** If you save 100 from starvation, do 100 die of predation later?
  *   **Moral Status:** Do wild animals have the same status as domestic? (Predation context matters).

  ---

  ### Phase 2: Pruning and Merging

  *Consolidating the brainstorm into coherent structural requirements.*

  1.  **Merge "Snapshot," "Bounce Back," "Regime Shifts," and "Density Dependence"** into a single **Dynamic Equilibrium Requirement**. The theory must model populations as flows, not stocks, accounting for carrying capacity ($K$) and stability landscapes.
  2.  **Merge "Existing vs. Possible," "Identity," and "Replaceability"** into an **Existence & Substitution Requirement**. This handles the non-identity problem and the moral weight of preventing births vs. killing.
  3.  **Merge "Sign of Welfare," "Aggregation," "Symmetry," and "Taxonomic Line"** into a **Welfare Valuation Requirement**. This forces the theory to specify how welfare is measured, summed, and signed.
  4.  **Merge "Transition Costs" and "Discounting"** into a **Temporal Integration Requirement**. How do we weigh immediate harm against long-term steady states?
  5.  **Drop "Ecosystem Value"** as a non-negotiable. The user's prompt focuses on sentient welfare ("net welfare of an ecosystem" in terms of animal lives). Intrinsic ecosystem value is a competing framework, not a spec requirement for *this* calculation.
  6.  **Drop "Uncertainty"** as a standalone. It's a constraint on *applying* the theory, not the theory itself. However, the theory must be *robust* to uncertainty.
  7.  **Refine "Death Quality."** This belongs under Welfare Valuation, but needs a specific note on whether death is a welfare event or just a termination.

  ---

  ### Phase 3: The Final Spec

  Here is the specification for any account claiming to evaluate the net welfare impact of habitat change on wild populations. I have categorized each requirement as **Non-Negotiable** (the account fails logically or empirically without it) or **Contested** (depends on ethical premises like Total vs. Average view).

  #### 1. The Dynamic Equilibrium Requirement
  **Specification:** The account must model population welfare as an integral over time ($\int W(t) dt$), not a snapshot ($W_t$). It must explicitly account for carrying capacity ($K$), density-dependent mortality rates, and the possibility of alternative stable states (regime shifts). It must distinguish between a temporary population dip and a permanent reduction in $K$.
  *   **Motivating Consideration:** Ecological systems are homeostatic. A theory that evaluates a habitat based on the number of animals alive today ignores the compensatory birth/death rates that will restore the population to $K$ within $n$ generations. If the theory cannot distinguish between a woodland regime (high $K$, high juvenile mortality) and a degraded scrub regime (lower $K$, different mortality profile), it is ecologically illiterate.
  *   **Status:** **Non-Negotiable.** (Contradicts basic population biology).

  #### 2. The Existence Asymmetry Requirement
  **Specification:** The account must distinguish between harms inflicted on *existing* subjects (displacement, starvation during transition) and the welfare status of *potential* subjects (offspring never conceived due to lower $K$). It must state clearly whether preventing the existence of a net-negative life is a moral gain, a neutral act, or impossible to evaluate.
  *   **Motivating Consideration:** This addresses the Non-Identity Problem. The animals alive after habitat destruction are not the same individuals as those alive before (different conceptions). If the theory nets out "lives not lived" against "lives lived," it risks justifying horrific transitions for the sake of preventing future births. If it ignores potential lives entirely, it cannot support the "habitat destruction reduces suffering" argument.
  *   **Status:** **Contested.** (This is the fault line between Person-Affecting Views and Total/Impersonal Views).

  #### 3. The Welfare Sign & Aggregation Requirement
  **Specification:** The account must define the welfare function $W$ such that it allows for negative values. It must specify the aggregation rule (Sum vs. Average vs. Prioritarian) and explicitly state whether intense suffering can be "cancelled out" by mild pleasure (symmetry) or if suffering has lexical priority (asymmetry).
  *   **Motivating Consideration:** The core argument rests on the empirical claim that wild lives are net negative ($W < 0$). A theory that assumes $W \geq 0$ by definition (e.g., "life is always a gift") is question-begging. Furthermore, because $r$-selected species produce huge numbers of short-lived offspring, a Sum view might demand massive population reduction, while an Average view might prefer high-turnover if the average moment is positive.
  *   **Status:** **Non-Negotiable** (Must allow negative values) / **Contested** (Aggregation rule).

  #### 4. The Transition Cost Separation
  **Specification:** The account must calculate the welfare cost of the *transition* (the animals currently alive who suffer due to the intervention) separately from the *steady-state* change. It must not allow future steady-state gains to automatically justify unlimited transition suffering without a discount rate or a side-constraint.
  *   **Motivating Consideration:** This prevents "utility monster" scenarios where we inflict certain, intense suffering on a current generation to prevent speculative suffering for future generations. It forces the proponent of habitat destruction to admit they are harming existing animals to prevent potential ones.
  *   **Status:** **Non-Negotiable.** (Required to keep the moral problem tractable and distinct from pure abstract calculus).

  #### 5. The Replaceability & Death Quality Constraint
  **Specification:** The account must state whether the death of an individual is morally neutralized if a "replacement" individual with equivalent expected welfare takes its niche. It must also specify whether the *process* of dying (predation vs. starvation vs. quick cull) carries independent negative weight separate from the truncation of future welfare.
  *   **Motivating Consideration:** In ecology, individuals are often treated as interchangeable units of biomass. In ethics, they are not. If the theory treats them as interchangeable, it aligns with ecology but violates individual integrity. If it treats death as a distinct harm, it complicates the "prevention is better" argument (since prevention avoids death, but destruction causes it).
  *   **Status:** **Contested.** (Deep conflict between economic/ecological modeling and deontological/rights-based ethics).

  #### 6. The Taxonomic Sentience Threshold
  **Specification:** The account must define the lower bound of moral consideration. It cannot simply say "all animals." It must provide a principled reason for including/excluding taxa (e.g., vertebrates only, mammals only, all nociceptors).
  *   **Motivating Consideration:** Insect and nematode biomass dwarfs vertebrate biomass. If they count, the welfare calculus is dominated by invertebrates. If they don't, the theory needs a justification that isn't just "they are small." Ignoring this makes the calculation empirically void.
  *   **Status:** **Non-Negotiable.** (Without a boundary, the numbers are undefined).

  ---

  ### Phase 4: The Tensions and The "Killer"

  #### The Impossibility Result: Which pair of desiderata cannot be jointly satisfied?

  **The Pair:** **The Existence Asymmetry Requirement (2)** and **The Dynamic Equilibrium Requirement (1).**

  **The Reasoning:**
  This is the structural trap of the "habitat destruction reduces suffering" argument.
  *   To claim habitat destruction reduces suffering, you must rely on **Dynamic Equilibrium (1)**: You argue that lowering $K$ permanently prevents billions of future lives from existing. This requires counting *potential* lives (Total/Impersonal View).
  *   However, if you count potential lives to justify the destruction, you violate the **Existence Asymmetry (2)** constraint held by most intuitive moral frameworks (Person-Affecting View), which say you cannot benefit someone by bringing them into existence, nor harm them by keeping them out of it.
  *   If you adhere strictly to Existence Asymmetry (only existing animals matter), then lowering $K$ does *not* reduce suffering in the moral ledger, because the animals that aren't born aren't "saved"—they simply aren't. The only thing that matters is the transition harm to existing animals.
  *   If you adhere strictly to Dynamic Equilibrium (counting all potential lives in the integral), you are forced into the **Repugnant Conclusion**: You must also accept that creating a massive population of lives that are *barely* worth living is better than a smaller population of very happy lives.
  *   **The Conflict:** You cannot consistently hold that "preventing a net-negative life is a moral good" (needed for the habitat argument) without also accepting "creating a net-positive life is a moral good" (which leads to overpopulation imperatives). If you try to have it both ways (asymmetric value for existence), the math of the Dynamic Equilibrium requirement breaks, because you are integrating a function that changes definition based on whether the subject exists.

  #### The "Killer" Requirement: Which single requirement knocks out the most accounts?

  **The Requirement:** **The Transition Cost Separation (4).**

  **The Reasoning:**
  Most philosophical arguments about wild animal suffering (on both sides) are conducted in a vacuum.
  *   **The "Preservationist" Account:** Usually fails here because they argue "habitat is good" based on the value of the *existing* animals, but ignore that preserving the habitat condemns future generations to the high-mortality $r$-selected equilibrium. They focus on the snapshot of today's animals and ignore the Dynamic Equilibrium.
  *   **The "Interventionist" Account (Destruction/Culling):** Usually fails here because they argue "destruction is good" based on the long-term steady state (fewer births), but gloss over the massive, concentrated suffering inflicted on the *current* population during the transition (starvation, displacement, exposure).
  *   **Why it knocks them out:** When you force the account to separate the transition cost from the steady-state benefit, the "destruction" argument often becomes untenable unless you apply a very high discount rate to the suffering of existing animals. Conversely, the "preservation" argument becomes untenable unless you admit you are prioritizing existing animals over future ones arbitrarily.
  *   This requirement forces the proponent to admit that **there is no cost-free solution.** It exposes that the debate is not actually about "net welfare" in the abstract, but about **who pays the price:** the animals alive now (transition) or the animals alive later (steady state). Most accounts try to hide this trade-off; this spec forces it into the open.

  ### Summary Table

  | Requirement | Core Question | Status | Why it Matters |
  | :--- | :--- | :--- | :--- |
  | **1. Dynamic Equilibrium** | Are we counting stocks or flows? | Non-Negotiable | Prevents snapshot errors; accounts for $K$ and bounce-back. |
  | **2. Existence Asymmetry** | Do unborn animals count? | Contested | Determines if preventing birth is a "gain." |
  | **3. Welfare Sign** | Can life be net negative? | Non-Negotiable | Essential for the "suffering" hypothesis to function. |
  | **4. Transition Separation** | Do we net out immediate harm? | Non-Negotiable | Prevents justifying cruelty now for abstract gains later. |
  | **5. Replaceability** | Are individuals interchangeable? | Contested | Conflicts between ecological modeling and individual ethics. |
  | **6. Sentience Threshold** | Where is the moral line? | Non-Negotiable | Determines if invertebrates dominate the calculation. |

  This spec should allow you to evaluate any claim about habitat and welfare without getting bogged down in the immediate "is it good or bad" fight. If a theory cannot satisfy the Non-Negotiables, it is empirically false. If it cannot resolve the Contested items, it is ethically incomplete.
