  I'm writing a novel and one of my characters — Ines — has a stroke that leaves her consciousness updating only in discrete snapshots, maybe four a second: she never experiences any passage from one frame to the next, just a stutter of stills, like a flipbook being thumbed too slowly. I want that to do real work and not just be a quirky medical detail, so Ive been reading Aristotle and this bit of the Physics (book VI, where hes arguing that a magnitude can't be made of indivisibles) has me stuck:

  So it will be possible for a thing to have completed a walk without ever walking: for on this assumption it has completed a walk over a particular distance without walking over that distance. Since, then, everything must be either at rest or in motion, and O is therefore at rest in each of the sections A, B, and G, it follows that a thing can be continuously at rest and at the same time in motion: for, as we saw, O is in motion over the whole ABG and at rest in any part (and consequently in the whole) of it.

  Can you walk me through whats actually being said here? Mainly I want to know what the absurdity is supposed to be — that you'd finish a walk without ever having walked, or that resting and moving collapse into the same thing, or something else entirely — and then whether Ines's frame-locked experience is really an instance of it, or whether Aristotle would say shes simply at rest in each frame while genuinely moving over the walk as a whole. And does any of this connect to Zeno's dichotomy puzzle, or is that a separate worry?

  Give me exactly five numbered points, one or two sentences each, no intro and no sign-off.
