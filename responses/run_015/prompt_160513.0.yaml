answer: |-
  ### 1. The list

  **Operational Determinacy** (Non-negotiable): A constitutional draftsperson requires a rule that yields a definitive list without requiring discretionary judgment at the point of enrollment. If the criterion demands assessing the *degree* of impact per legislative bill, it fails. The roll must be compileable by a clerk, not a philosopher.

  **Factual Robustness** (Non-negotiable): The criterion must function under ordinary uncertainty. In the **Long-Run Decision** case, causal chains (e.g., specific emissions to specific flooding) are disputed. A criterion requiring settled science excludes voters before the vote happens. The rule must rely on proxies, not proofs.

  **Binary Output** (Non-negotiable): Adjudication: This is not prejudice; it is administrative necessity. Electoral rolls are boolean structures. The **Gradient Proposal** is normatively interesting but institutionally distinct from voting rights. You can weight influence within a chamber, but membership must be binary to define the denominator for a "majority."

  **Non-Circular Application** (Non-negotiable): Adjudication: This is genuine, not a scruple. A constitution precedes the demos it creates. If only the demos can decide membership, the constitution cannot start. A drafter must apply the rule *ex ante*. The criterion cannot presuppose the authority it seeks to constitute.

  **Burden-Right Reciprocity** (Preference): Driven by the **Associated Region**. If federal law binds and taxes, exclusion looks like domination. This pushes for inclusion but conflicts with stability. It is a strong normative pull but often sacrificed for administrative clarity in federations.

  **Polity Exclusivity** (Preference): Addresses the **Gradient Proposal**. While multiple memberships are possible, a primary polity is needed for accountability. Multiple full votes fragment responsibility. This is a preference for stability over perfect moral mapping of intersecting jurisdictions.

  **Temporal Stability** (Preference): Membership cannot fluctuate with every legislative agenda. The roll must persist across election cycles. A criterion that changes the electorate based on the bill being voted on destroys the concept of a standing legislature.

  **Normative Floor** (Up for grabs): The rule shouldn't violate basic human rights (e.g., excluding based on race), but beyond that, democratic theory disagrees on what counts as unjust exclusion. This is contingent on the broader moral theory accompanying the constitutional draft.

  ### 2. Where the list eats itself

  The list creates a trilemma. **Operational Determinacy** clashes with **Factual Robustness** in the **Long-Run Decision** case. To be determinate, you need clear boundaries (citizenship); to be robust regarding effects, you need fluid boundaries (affectedness). You cannot have both. Secondly, **Binary Output** contradicts the normative intuition behind the **Gradient Proposal**. If impact is graded, binary inclusion misrepresents moral reality, yet administrative feasibility demands it. Finally, **Non-Circular Application** conflicts with democratic legitimacy. If a drafter sets the boundary, the demos is not self-constituting. The list is unsatisfiable if you demand perfect normative alignment with perfect operability. You must sacrifice either moral precision or administrative clarity.

  ### 3. The one that does the most damage

  **Factual Robustness** does the most damage. Most criteria rely on counterfactuals: "Who *would* be affected?" or "Who *is* subject?" In the **Long-Run Decision** case, these are empirically unknowable at the time of enrollment. A criterion requiring proof of impact excludes future generations by definition. A criterion ignoring impact excludes them normatively. This requirement forces theories to choose between being wrong about the facts or wrong about the principle. It kills any theory relying on specific causal chains rather than status-based proxies.

  ### 4. Scorecard

  **All-Affected:** Fails **Factual Robustness** and **Binary Output**. Impact is continuous and unknowable (Long-Run), making rolls impossible to compile. It accommodates the **Gradient** normatively but collapses administratively. It cannot be turned into a rule by a draftsperson without arbitrary cutoffs.

  **All-Subjected:** Handles **Associated Region** well (law binds = vote) and offers **Binary Output**. However, it fails **Long-Run** (future generations aren't subject yet) and struggles with **Non-Circular Application** (who defines subjection?). It is operable but morally incomplete regarding future interests.

  **Subject-to-Coercion:** Strong on **Binary Output** and **Operational Determinacy**. Fails **Associated Region** if taxation isn't deemed coercive. Like All-Subjected, it cannot capture future generations without fictionalizing their subjection. It is the most administrable but the least expansive regarding the **Gradient** intuition.
