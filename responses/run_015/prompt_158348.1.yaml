answer: |-
  Can a quantified "dependence budget" derived from sensitivity analysis in probabilistic number theory distinguish robust self-locating arguments from fragile ones, a question tractable in one semester because the Cramér model provides a closed-form calibration case where the independence failure is already proven?

  **Project Title:** The Dependence Budget: Sensitivity Analysis for Independence Assumptions in Self-Locating Reasoning

  **1. The Research Question**
  Heuristic arguments in cosmology and existential risk (Doomsday, Fine-Tuning, Boltzmann Brains) derive their force from likelihood ratios that presume independence across samples or temporal steps. Specifically, they assume that finding oneself with evidence $E$ boosts hypothesis $H$ by a factor proportional to the inverse of the sample space size, contingent on the assumption that the sampling mechanism is independent of the hypothesis truth value, that evidence pieces are conditionally independent within a hypothesis, and that the conclusion is robust to small perturbations in these assumptions. The literature treats these independence conditions as binary prerequisites: either the reference class is well-defined and independent, or the argument fails. This project asks a continuous variant of that question: What is the maximum allowable correlation coefficient—or deviation from independent sampling—permitted before the posterior odds ratio collapses or flips? I define this threshold as the "dependence budget." The core objective is to construct a formal metric for this budget and calibrate it against a case where the verdict is known: the Cramér probabilistic model of the primes. Cramér's model assumes primes are distributed independently with probability $1/\ln n$, successfully predicting average gap sizes (the Prime Number Theorem) but famously failing to predict the distribution of primes in short intervals (Maier's Theorem) due to hidden correlations. If the dependence budget tool cannot flag the Cramér heuristic as untrustworthy for short intervals in advance, it possesses no diagnostic value for cosmology.

  **2. Why the Literature Leaves This Open**
  Defenders of self-locating arguments (e.g., proponents of the Self-Sampling Assumption) typically stipulate independence by defining reference classes broadly enough to wash out local correlations, or by treating the observer moment as a random sample from a fixed set. Critics attack the definition of the reference class itself or deny the coherence of the sampling mechanism. Both sides treat independence as a qualitative condition that is either satisfied or violated. Neither side quantifies the *sensitivity* of the conclusion to violations of independence. This binary treatment obscures the possibility that an argument might be technically dependent yet robust, or technically independent yet fragile. By failing to specify the magnitude of correlation required to negate the argument, existing frameworks cannot distinguish between harmless idealizations and fatal flaws. This project moves the debate from "Is the assumption true?" to "How false can the assumption be before the conclusion fails?"

  **3. Methodology and Timeline**
  Standard Bayesian modeling of these arguments typically stops after constructing the likelihood function under idealized independence. This project beats that approach by adding a second-order sensitivity analysis. I will not merely model the argument; I will model the *error term* introduced by dependence.

  *   **Month 1: Formalizing the Budget.** I will define the dependence budget $\Delta$ for a generic likelihood ratio argument. Using total variation distance or a correlation bound $\rho$, I will derive the function $f(\rho)$ such that if the actual correlation exceeds $\rho_{crit}$, the Bayes factor drops below 1. This involves decomposing the user's three independence conditions (sampling mechanism, conditional evidence, robustness) into a unified statistical constraint on the joint probability distribution.
  *   **Month 2: Calibration on Number Theory.** I will apply this metric to the Cramér model. I will reconstruct the heuristic derivation of the Prime Number Theorem via independent trials and calculate the dependence budget required to sustain it. Then, I will introduce the known correlations responsible for Maier's Theorem (related to sieve methods and prime k-tuples) and demonstrate that the actual correlation in short intervals exceeds the budget derived in Month 1. This validates the tool: it correctly identifies a heuristic that works globally but fails locally.
  *   **Month 3: Application to Cosmology.** I will apply the calibrated budget to the Boltzmann Brain problem. Here, the "samples" are observer moments. I will estimate the degree of correlation required between observer moments (via physical causal chains or logical dependencies) to violate the independence budget. This requires translating metaphysical claims about indexicality into statistical constraints on the sampling distribution.
  *   **Month 4: Synthesis and Writing.** I will compare the "cost" of independence in the number theory case versus the cosmology case. If the cosmological argument requires a stricter independence budget than the Cramér model (which we know fails locally), the argument is epistemically unstable.

  **4. Possible Findings and Deciding Considerations**
  The project will succeed if I can demonstrate a disparity between the dependence budget of the Cramér model and that of standard self-locating arguments.
  *   *Finding A:* The Boltzmann Brain argument requires a dependence budget orders of magnitude smaller (i.e., demands stricter independence) than the Cramér model. Since the Cramér model fails under known physical correlations, the Boltzmann Brain argument is presumptively false.
  *   *Finding B:* The dependence budget is robust for both, suggesting that the failure of Cramér in short intervals is a specific number-theoretic artifact not analogous to cosmological selection effects.
  *   *Finding C:* The budget is incalculable for cosmology because the "correlation" is not statistical but conceptual (indexical uncertainty).
  The deciding consideration will be whether the "correlations" in cosmology can be mapped to the statistical formalism used in the number theory calibration. If the mapping holds, Finding A is the expected outcome, providing a novel defeater for fine-tuning and Boltzmann Brain arguments based on heuristic fragility rather than reference class disputes.

  **5. Risks and Failure Modes**
  The primary risk is category error. The correlations that violate Maier's Theorem are arithmetic and well-defined; the "correlations" between observer moments in cosmology may be metaphysical or indexical, resisting translation into a correlation coefficient $\rho$. If I spend the first month attempting to formalize indexical dependence as statistical correlation without success, the project will stall. Additionally, the technical details of Maier's Theorem involve advanced sieve theory; if the proof relies on properties specific to primes that do not generalize to the abstract probabilistic framework I build in Month 1, the calibration will fail. In that case, the project would blow past the semester attempting to bridge analytic number theory and formal epistemology. To mitigate this, I will restrict the number theory analysis to the probabilistic heuristic derivation itself, rather than the full proof of Maier's Theorem, focusing only on the variance terms that independence assumptions suppress. If the dependence budget cannot be expressed without full number-theoretic machinery, I will pivot to a purely probabilistic calibration case (e.g., Polya Urn schemes) where dependence is tunable, though this would weaken the "real-world" validation of the tool.
