answer: |-
  Your colleague is citing **Good's theorem**, which states that for a rational agent maximizing expected utility, the expected value of free information is non-negative. The argument structure is **Expected Value of Information (EVI)** analysis: you compare the expected utility of acting now versus the expected utility of acting after updating beliefs with new data, minus the cost of acquiring that data. Your colleague claims the acquisition cost is only the week's delay, because the theorem guarantees the information itself cannot reduce expected utility.

  This guarantee rests on three strict assumptions: the agent is perfectly rational, the information does not change the agent's utility function, and the agent retains the freedom to choose any action after learning the information. Your doubts target these assumptions directly.

  **Which worries defeat the principle:**
  1.  **Process Constraint (Defeats):** This violates the "free action" assumption. If an auto-abort rule binds your future self based on the metric, you cannot "ignore" the information. The information transforms from an optional input into a binding constraint with a potential false-positive cost. This structurally breaks the theorem's logic.
  2.  **Human Factor (Defeats):** This violates the "stable utility" assumption. If the data changes the engineer's risk tolerance or discipline (recklessness or paralysis), the information alters the agent's decision-making function, not just their beliefs. In behavioral economics, this is **information aversion**, a contested but widely observed phenomenon where knowledge reduces welfare.
  3.  **Measurement Perturbation (Cost):** This reduces the *quality* of the signal (noise and bias) but does not inherently make the value negative unless the bias is systematically misleading. This is a standard cost to be weighed against the delay, not a theoretical defeater.

  **Settled vs. Contested:**
  *   **Settled:** The mathematical proof of Good's theorem is uncontroversial *given* its axioms. No serious decision theorist disputes the math.
  *   **Contested:** Whether real organizations satisfy the axioms. Mainstream economics assumes rational agents; behavioral economics and organizational theory argue that humans and bureaucracies systematically violate the "stable utility" and "free action" assumptions. There is no consensus on whether "rational ignorance" (refusing information) is ever optimal for bounded agents, though many argue it is pragmatic.
  *   **Extrapolation:** I am extrapolating that a **pre-commitment** (binding yourself to a decision rule before seeing data) can restore the theorem's conditions. While theoretically sound, enforcing this against organizational pressure is politically contested and often fails in practice.

  **Recommendation:**
  Do not run the shadow test unless you can formally waive the auto-abort rule for this specific cutover. The theorem only applies if you retain the discretion to ignore the shadow metrics. If you cannot guarantee that discretion, the information has negative expected value due to the risk of a false-positive abort.

  The two things that would change this verdict are: (1) confirming the replay rig is fully isolated (removing perturbation risk), or (2) obtaining written authorization to override the auto-abort rule based on engineering judgment (restoring free action).

  Verdict: SHADOW-RUN-ONLY-IF-PRECOMMITTED (waive auto-abort rule)
