answer: |-
  *   **Aim-or-Purpose (Volitional) Accounts:** Intending requires the outcome to be the actor's goal or aim.
      *   *Predicts:* Motive should be highly relevant (since aim and motive blur here). Struggles to explain why the bomber is guilty of murder without a desire to kill. Would predict the law should *not* allow oblique intent findings.
  *   **Foresight-plus-Certainty (Cognitive) Accounts:** Intending includes outcomes known to be virtually certain, regardless of desire.
      *   *Predicts:* Fits the oblique intent instruction perfectly. Fits the irrelevance of motive (the mental state is knowledge, not desire). Struggles to explain why the mirror image (foresight of good) is not treated as intentional benefit.
  *   **Moralized or Thick Concepts:** Intentionality attributions depend on the normative status of the outcome; we call it "intentional" when we want to blame, but not when we want to praise.
      *   *Predicts:* Fits the asymmetry between harm and benefit. Fits the oblique intent rule (blame warrants the label). Fits the irrelevance of motive for guilt (bad outcome dominates). Explains why "constructive beneficence" feels conceptually awkward.
  *   **Dispensable/Grading Views:** "Intent" is not a genuine psychological category but a legal label for high culpability; the law grades blame directly and uses intent-talk as a proxy.
      *   *Predicts:* Explains why the law stretches "intent" to cover foresight in harm cases (high blame) but not benefit cases (low/no blame). Explains why motive is irrelevant to guilt (culpability is fixed by the act/foresight) but relevant to sentencing (overall moral picture).

  ### The Presuppositions of Existing Practice

  The existing practice—permitting oblique intent findings while disregarding motive, yet refusing to recognize foreseen benefits as intended—strictly presupposes only that **foresight of virtual certainty is a sufficient condition for legal liability in harm cases, and that the actor's ultimate goals do not negate that liability.**

  It **fits well with** a Cognitive Account (foresight constitutes the mental state) and a Moralized Account (blameworthiness licenses the attribution). However, the practice is **underdetermined** regarding the ontology of intention. The jury instruction permits a finding of intent based on foresight, but it does not dictate whether the jury is discovering a pre-existing psychological fact or applying a normative standard. The instruction says they *may* find intent, not that they *must*. This leaves open whether foresight is being treated as constitutive of intent, or merely as overwhelming evidence from which a purpose is usually inferred, or simply as a trigger for a culpability label.

  ### Foresight, Evidence, or Culpability?

  The practice does not commit the law to the view that intending *just is* acting in the belief that a result will near-certainly obtain. If it did, the concept would be symmetrical. Since the law accepts foresight of harm as intent but rejects foresight of benefit as intent, the legal concept cannot be purely cognitive.

  It can be read as using foresight merely as **evidence** of purpose, but this is strained by the bomber case. The bomber explicitly lacks the purpose to kill; if the jury finds intent, they are not inferring a purpose that exists, they are accepting a legal fiction that equates foresight with purpose.

  The strongest reading, supported by the content of the practice, is that the law is **bypassing intention altogether in favour of a direct judgement of culpability.** The term "intent" is being used as a verdict category for "sufficiently blameworthy state of mind." When the outcome is harm and foresight is certain, culpability is high, so the label "intent" is applied. When the outcome is benefit, culpability is low or negative, so the label is withheld, regardless of the identical cognitive state. The law uses the word "intent" to signal the gravity of the condemnation, not to describe the geometry of the mind.

  ### The Bad/Good Asymmetry and the Knobe Effect

  The asymmetry in legal doctrine mirrors the Knobe effect, where folk attributions of intentionality track the moral valence of the side effect. This should be read as evidence that the doctrine has latched onto a **moralized folk concept**, rather than a performance artifact.

  If the asymmetry were merely a performance artifact (e.g., people are just reluctant to praise), the law could easily override it by stipulating a definition. But the law *has not* overridden it. The fact that jurisdictions consistently adopt oblique intent for harm but never for benefit suggests the legal concept is not autonomous from the folk concept. The law relies on the jury's intuitive grasp of "intentional." If the jury's intuition is moralized, the legal doctrine must be moralized to remain intelligible to the fact-finder. The doctrine does not define a neutral psychological state; it codifies a normative boundary of responsibility. The asymmetry reveals that "intentional action" in this context is a hybrid concept: part cognitive (foresight), part normative (badness).

  ### Workability of Constructive Beneficence

  "Constructive beneficence" would likely prove **unworkable** in practice, not because of legal logic, but because of conceptual friction. If the rule requires fact-finders to acknowledge that the hacker "intended" to save the patients (or even to treat the foresight as equivalent to intent for mitigation), jurors may stubbornly refuse.

  If fact-finders refuse to apply the label "intent" to the foreseen good outcome, despite a legislative command, it would show that the doctrine we already have rests on a **legal construct that merely borrows the word** "intent" rather than a genuine psychological category. It would demonstrate that "intent" in criminal law is not a container that can be filled with any foreseen certainty; it is a verdict term inextricably linked to condemnation. You cannot use a term of condemnation to facilitate mitigation without breaking the concept.

  Conversely, if fact-finders accept the rule without resistance, it would suggest the existing asymmetry was merely a historical accident of legislation, and that "intent" is indeed a neutral cognitive category that the law had previously failed to utilize fully. However, given the deep alignment between the current legal asymmetry and the folk-psychological asymmetry, resistance is the expected outcome. This resistance would confirm that the existing practice of oblique intent is not a discovery about human agency, but a normative tool for assigning blame, which loses its grip when the assignment of blame is removed.
