answer: |-
  The precise flaw in your argument is a **false dilemma** generated by **Step 7**.

  **Diagnosis**
  Step 7 asserts that to distinguish cases of backsliding (Hungary, Poland) from cases of democratic reform (New Deal, German FCC), you *must* add an "external normative filter" based on unobservable states of mind (intent, deliberation). This creates the exhaustive dichotomy in Step 9: either accept all institutional change as backsliding or admit the concept is merely a proxy for partisan judgment.

  This step is incorrect because it ignores a third option: **functional institutionalism**. You can distinguish the New Deal from the Hungarian constitutional overhaul not by reading the minds of the actors (intent), but by evaluating the *direction and magnitude* of the accountability shift relative to a **democratic minimum threshold**. The New Deal shifted accountability from courts to agencies, but arguably *increased* vertical accountability (responsiveness to public need) during a crisis. Hungary's changes reduced both vertical (election competitiveness) and horizontal (checks and balances) accountability. Distinguishing these requires a substantive theory of how institutions function to sustain democracy, not a probe into partisan intent. Step 7 falsely equates "non-formal" criteria with "subjective intent," excluding objective functional analysis.

  **Why Step 7 Looked Plausible**
  This step derives its plausibility from your commitment to **Historical Institutionalism (Step 2)**. HI emphasizes that the *forms* of change (layering, conversion) are analytically distinct from their *outcomes*. Having established that the *forms* are identical across your cases (Step 4 & 6), it is tempting to conclude that the *difference* must lie in the agency behind the change (intent). Furthermore, Step 7 protects your desire for a clean, non-circular definition (Step 1) by isolating the "messy" normative work into a separate filter, preserving the illusion that the core definition is purely procedural.

  **Cost of Rejecting Step 7**
  Rejecting Step 7 allows you to escape the cynical conclusion of Step 9 without abandoning your institutional definition in Step 1. However, it exacts a significant theoretical cost: you must surrender **procedural neutrality**.

  To determine whether an institutional change constitutes a "reduction" in accountability (as required by Step 1), you cannot simply count rules or map formal modes. You must judge the *quality* of the resulting accountability against a substantive benchmark of democratic functioning (e.g., does this change enhance or degrade the electorate's ability to sanction rulers?). This means "backsliding" cannot be defined solely by the *procedure* of change (legal vs. extra-legal, layering vs. displacement); it inevitably relies on a normative theory of what democracy *is* for. You retain the institutional focus, but you lose the claim that the metric is value-free or agnostic regarding the content of the reforms.

  Verdict: step 7, costs procedural neutrality
