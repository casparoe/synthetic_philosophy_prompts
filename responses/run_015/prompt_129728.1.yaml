answer: |-
  The tension you identify between Jaspers' metaphysical guilt and the denazification bureaucracy is not a failure of Jaspers' framework, nor does it prove collective guilt is incoherent. Instead, it reveals that the denazification process was conceptually doomed to appear hollow because it attempted to juridify the metaphysical. Jaspers' taxonomy survives contact with bureaucratic reality intact, but only by exposing the limits of administration: the state can punish crimes and assign political liability, but it cannot adjudicate the human condition. The episode ultimately supports the claim that a nation can be guilty, but strictly in a metaphysical sense that no questionnaire could ever capture.

  To map this disciplinedly, we must look at who bears the guilt, what counts as evidence, and where the bureaucracy hits a wall.

  **Criminal and Political Guilt: The Bureaucracy Works**
  For criminal guilt, the bearer is the individual who violated specific laws. The evidence is factual: signatures on execution orders, witness testimony of atrocities. The administrative machinery (ordinary courts and the initial strict tribunals) could register this. Similarly, political guilt belongs to the citizen as a member of the state. The evidence here is objective: party membership cards, rank in the SA or SS, donations to the party. The *Fragebogen* (questionnaire) was designed for this. It successfully sorted people into Categories I (Major Offenders) through III (Beneficiaries) based on measurable participation. Here, the bureaucracy functioned as intended. It individuated blame based on actionable data. If denazification had stopped here, there would be no tension.

  **Moral Guilt: The Bureaucracy Stumbles**
  Moral guilt belongs to the individual conscience. The evidence is subjective: Did you speak up? Did you help a neighbor? Did you remain silent out of fear or convenience? The tribunals tried to capture this through character witnesses (*Persilscheine*), but this reduced moral integrity to a transactional exchange of affidavits. The administrative machinery could not register the interiority required for moral judgment. It turned conscience into a credential. Here, the theory is not silent, but the process was misguided: it assumed moral standing could be certified by a committee. This created a class of people who were legally "cleared" but morally compromised, sowing the seeds of the hollowness you sensed.

  **Metaphysical Guilt: The Bureaucracy Fails**
  This is the core of your sticking point. Metaphysical guilt belongs to every human being who survived when others were murdered. The evidence is simply survival itself within the polity of the perpetrator. Jaspers argues this guilt is universal among Germans who remained. The administrative machinery *cannot* register this. It has no category for "guilty because you breathed the same air." Consequently, the creation of Category V (Exonerated/*Entlastete*) is a legal fiction regarding metaphysical guilt. If Jaspers is right, there are no exonerated Germans, only those legally unpunished. The bureaucracy *had* to create Category V to rebuild the state, but in doing so, it implicitly denied metaphysical solidarity. The theory is silent on how to administer this, because it cannot be administered. The tension you feel is the sound of a legal system trying to solve a theological problem.

  **The 1951 Amnesty: Political Necessity Overrides Metaphysics**
  The 1951 amnesty laws and the push to reintegrate "Followers" (*Mitläufer*) into civil service confirm this hierarchy. The Cold War demanded a functional West Germany. The state prioritized political stability over metaphysical reckoning. The amnesty did not prove that metaphysical guilt disappeared; it proved that the state lacks the capacity to enforce it. The bureaucracy treated guilt as a finite resource that could be used up via forms and penalties. Jaspers treats it as an infinite existential burden. The amnesty debates were not about truth; they were about manpower. By granting amnesty, the state declared that political utility outweighs metaphysical solidarity.

  **Conclusion on Collective Guilt**
  This episode does not reveal that collective national guilt is incoherent. Rather, it reveals that collective guilt is incoherent *only within a legal framework*. A nation can be guilty, but not in the way a court requires. The denazification process failed not because it individuated blame—that was necessary for justice—but because it claimed that individuation resolved the national condition. By issuing "Exonerated" certificates, the bureaucracy lied about metaphysical guilt. Jaspers' framework survives because it predicts this exact failure: it separates the adjudicable (criminal/political) from the unadjudicable (moral/metaphysical). The hollowness of the process validates Jaspers' insistence that metaphysical guilt must be faced internally, not externally. To expect a form to resolve the guilt of survival is the error, not the theory.

  Verdict: Jaspers survives; collective guilt is metaphysical, not administrative.
