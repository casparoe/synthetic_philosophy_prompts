answer: |-
  # Specification for a Theory of Pramāṇas (Sources of Valid Cognition)

  ## 1. Purpose Statement
  The objective of this specification is to define the necessary and sufficient conditions for a taxonomy of *pramāṇas*. An adequate account must function as a decision procedure. For any candidate source of awareness $S$, the theory must determine:
  1.  **Validity:** Does $S$ yield *pramā* (knowledge/valid cognition) or *apramā* (error/luck)?
  2.  **Individuation:** If $S$ yields *pramā*, is it a distinct *pramāṇa* or a subtype of an existing *pramāṇa*?

  This specification is motivated by the **Black-Box Reliability Case** (e.g., AI-assisted medical diagnosis), where reliability is high, but agency, sensory contact, and reconstructibility are absent.

  ---

  ## 2. Desiderata (The Criteria)

  ### D1: The Generativity Constraint (Novelty)
  *   **Specification:** A *pramāṇa* must generate cognition of an object *not previously cognized* in that specific mode. It must be a cause of knowledge, not merely a transporter.
  *   **Motivating Case:** **Memory and Recognition.** If I remember a pot I saw yesterday, the cognition is true, but it does not reveal the pot *anew*. If I recognize a friend across the street, am I perceiving them anew or recalling a past image?
  *   **Status:** **Non-Negotiable (Nyāya Realist).** For the realist, knowledge is an episodic achievement of grasping reality. Memory is preservation, not grasping.
  *   **Conflict Flag:** Conflicts with **D3 (Intrinsic Validation)** if memory is claimed to be self-validating while perception is not.

  ### D2: The Negative Reality Constraint (Absence)
  *   **Specification:** The account must explain how cognition of *abhāva* (absence/non-existence) is generated. Absence is real (for the realist) but makes no positive sensory contact.
  *   **Motivating Case:** **The Empty Shelf.** I see that there is *no* book on the table. My senses contact the table, not the "no-book." If the theory cannot account for this without positing a magical sense organ, it fails realism.
  *   **Status:** **Non-Negotiable (Nyāya Realist).** Reality includes absences; a theory of knowledge must cover reality.
  *   **Conflict Flag:** Conflicts with **D5 (Source-Medium Distinction)** if absence is treated as a distinct source (*anupalabdhi*) rather than a mode of perception or inference.

  ### D3: The Validation Constraint (Regress Stopper)
  *   **Specification:** The theory must specify how the validity of a source is established (*pramāṇya*). It must choose between *svataḥ* (intrinsic/self-validating) or *parataḥ* (extrinsic/validated by another source) without triggering an infinite regress or vicious circularity.
  *   **Motivating Case:** **The Dreaming Skeptic.** If perception validates itself, how do we rule out vivid hallucinations? If perception requires inference to validate it, what validates the inference?
  *   **Status:** **Sectional Preference.** (Nyāya prefers *parataḥ*; Mīmāṃsā/Buddhists prefer *svataḥ*). However, *some* solution to regress is non-negotiable.
  *   **Conflict Flag:** High tension with **D1 (Generativity)**. If validity is extrinsic, we need a second cognition to validate the first. Does that second cognition need validation?

  ### D4: The Truth-Warrant Distinction
  *   **Specification:** The theory must distinguish between a cognition being *true* (corresponding to fact) and being *warranted* (produced by a reliable process). Accidental truth must not count as *pramā*.
  *   **Motivating Case:** **The Lucky Guess.** I guess the coin is heads; it is heads. I have truth, but no *pramāṇa*.
  *   **Status:** **Non-Negotiable (Nyāya Realist).** *Pramā* is defined by causal efficiency in grasping reality, not mere correspondence.
  *   **Conflict Flag:** Conflicts with **D3 (Intrinsic Validation)** if "feeling certain" is taken as the marker of warrant.

  ### D5: The Source-Medium Distinction
  *   **Specification:** A change in the physical medium of transmission must not entail a change in the *pramāṇa* type, provided the causal structure of warrant remains identical.
  *   **Motivating Case:** **Oral vs. Digital Testimony.** If a teacher tells me a fact, it is *Śabda*. If they email it, is it a new *pramāṇa*? (Intuitively, no).
  *   **Status:** **Sectional Preference.** (Most schools agree, but some ritualists might distinguish sacred sound from written text).
  *   **Conflict Flag:** Critical tension with the **Black-Box Case**. If the medium is algorithmic and non-human, does the causal structure change enough to break *Śabda*?

  ### D6: The Agency/Intent Condition (The AI Filter)
  *   **Specification:** The theory must state whether a *pramāṇa* requires a conscious agent with an intention to inform (*tātparya*) at the source end of the causal chain.
  *   **Motivating Case:** **The Black-Box Medical Diagnosis.** The AI flags a tumor. It is reliable. It has no mind, no intent, and no sensory contact. Is this *Śabda* (Testimony), *Anumāna* (Inference), or *Apamā* (Non-knowledge)?
  *   **Status:** **Non-Negotiable for Classical *Śabda*.** Classical testimony requires a competent speaker (*āpta*).
  *   **Conflict Flag:** **Incompatible with D4 (Truth-Warrant)** if Reliability alone is made sufficient for Warrant. If we drop Agency to accommodate AI, we risk collapsing *Śabda* into mere Reliable Causation.

  ---

  ## 3. Incompatibility Matrix (Suspected Joint Unsatisfiability)

  | Pair | Conflict Description | Resolution Required |
  | :--- | :--- | :--- |
  | **D1 (Generativity) + Memory as Pramāṇa** | If Memory is a *pramāṇa*, it violates the requirement that knowledge be a *new* grasp of reality. | **Drop Memory.** (Nyāya choice). |
  | **D3 (Extrinsic Validation) + No Regress** | If every source needs another to validate it, you need an infinite chain. | **Accept Fallibilism.** Validation is practical, not absolute. (Nyāya choice). |
  | **D6 (Agency) + AI Reliability** | If Agency is required for Testimony, AI output is not knowledge. If AI output is knowledge, Agency must be dropped. | **Expand *Śabda* or Create *Pramāṇa-6*.** |
  | **D2 (Absence) + D5 (Medium)** | If Absence is real but non-sensory, treating it as Perception (D5) violates the definition of Perception (sensory contact). | **Posit *Anupalabdhi* as distinct.** |

  ---

  ## 4. The Single Most Exclusionary Requirement

  **The Generativity Constraint (D1).**

  **Argument:** This is the primary filter that separates *pramāṇa* (instrument of knowledge) from *jñāna-lakṣaṇa* (mere cognition). It immediately excludes **Memory (*Smṛti*)**, **Recognition (*Pratyabhijñā*)**, **Doubt (*Saṃśaya*)**, and **Error (*Viparyaya*)** from the list of sources. While the Validation Constraint (D3) divides schools, the Generativity Constraint divides *cognitive kinds*. Any theory that admits Memory as a fundamental *pramāṇa* fails the Nyāya Realist specification because it conflates the *preservation* of truth with the *discovery* of truth. For the purpose of settling "any candidate source," D1 is the first gate: *Does this cognition reveal something previously unrevealed?* If no, the inquiry stops.

  ---

  ## 5. Scorecard: Standard Four Against Specification

  | Pramāṇa | D1 (Novelty) | D2 (Absence) | D3 (Validation) | D4 (Warrant $\neq$ Truth) | D5 (Medium) | D6 (Agency) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Perception (*Pratyakṣa*)** | **Pass** (Direct contact) | **Fail** (Requires modification for absence) | **Pass** (Extrinsic) | **Pass** | **Pass** | **Pass** | Adequate for positive particulars. |
  | **Inference (*Anumāna*)** | **Pass** (Mediated novelty) | **Pass** (Can infer absence) | **Pass** (Extrinsic) | **Pass** | **Pass** | **Pass** | Adequate, but requires reconstructibility. |
  | **Testimony (*Śabda*)** | **Pass** (Novel info) | **Pass** (Can convey absence) | **Pass** (Extrinsic) | **Pass** | **Pass** | **Fail** (Requires Agent) | **Fails AI Case.** |
  | **Comparison (*Upamāna*)**| **Pass** (Name-Object link) | **N/A** | **Pass** | **Pass** | **Pass** | **Pass** | Niche utility. |

  ---

  ## 6. Adjudication of the Motivating Case (The AI Clinician)

  Applying the specification to the **Black-Box Medical Diagnosis**:

  1.  **D1 (Novelty):** **Pass.** The clinician did not know the tumor was there; the cognition is new.
  2.  **D4 (Warrant $\neq$ Truth):** **Pass.** The system is highly reliable (warranted), not just lucky.
  3.  **D5 (Medium):** **Pass.** The digital medium does not inherently disqualify the source.
  4.  **D6 (Agency):** **Fail.** The AI has no intent to inform (*tātparya*) and no competence (*āptatva*) in the epistemic sense.
  5.  **D2 (Inference Reconstructibility):** **Fail.** The clinician cannot reconstruct the reasoning (black box), so it is not standard *Anumāna*.

  **Conclusion under this Specification:**
  The classical four *pramāṇas* are **inadequate** for this case without modification. The specification forces a trilemma:
  1.  **Deny Knowledge:** Classify the clinician's belief as *true belief without warrant* (violates intuition about reliability).
  2.  **Expand Testimony:** Drop the **Agency Condition (D6)** for *Śabda*, redefining it as "Reliable Information Transfer" regardless of source. (Risk: Collapses *Śabda* into a generic reliability theory).
  3.  **Postulate a Sixth Pramāṇa:** *Yantra-pramāṇa* (Instrumental Knowledge). This acknowledges that modern epistemology involves non-agentic, non-reconstructible, reliable sources that are neither perception nor inference.

  **Final Directive:** An adequate theory for the modern realist must **either** revise D6 to be agent-neutral **or** admit a sixth *pramāṇa*. To maintain the classical taxonomy while accepting the AI case is to violate the **Source-Medium Distinction (D5)** by pretending the lack of agency is merely a change of medium. It is not; it is a change in the causal structure of warrant.
