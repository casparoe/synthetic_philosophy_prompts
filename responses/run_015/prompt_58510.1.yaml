      Concede: Agent abstraction is useful UI.
      Vulnerability: Hard to prove simulator view yields better benchmarks quickly.

      Challenge 2: Timelines. "Will this delay deployment?"
      Reply: No, it prevents costly reworks later due to unexplained failures.
