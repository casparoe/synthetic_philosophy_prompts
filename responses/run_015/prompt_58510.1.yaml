      Challenge 4: Memory Fixes. "Isn't this just bad RAG?"
      Reply: No, context clearing changes the sampled persona, not just access.
      Concede: Better memory helps, but doesn't solve identity drift.
      Vulnerability: Hard to distinguish empirically without specific probes.

      Challenge 5: Alignment Safety. "Is simulator harder to align?"
      Reply: Yes, requires constraining sampling, not teaching beliefs.
      Concede: Current alignment techniques may be fragile.
      Vulnerability: Sparks fear about product viability.

      Challenge 6: Semantics. "Does it matter what we call it?"
      Reply: Yes, wrong model leads to wrong debugging strategies.
      Concede: Vocabulary can stay if understood as metaphor.
      Vulnerability: Seems pedantic.

      Private Challenge: Fundamental impossibility of stable long-horizon goals without external state enforcement.

