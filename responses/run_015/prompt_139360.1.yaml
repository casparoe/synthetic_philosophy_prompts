answer: |-
  ### The Minimal-Pair Case: The "Borrowed Bike"

  **Source Texts (English)**
  *   **Text A:** "Alice borrowed the bike from Bob. She cleaned it."
  *   **Text B:** "Alice borrowed the bike from Bob. He cleaned it."

  **Target Language Feature (Invented: "Linguish")**
  Linguish requires **Possessive-Deictic Pronouns**. When a pronoun refers to an agent interacting with an object, the pronoun must morphologically mark the agent's *normative relationship* to that object at that moment.
  *   **Form 1:** `PRO.OWN` (The agent is the legal owner).
  *   **Form 2:** `PRO.CUST` (The agent is a temporary custodian/borrower).

  **Correct Translations**
  *   **Text A:** "Alice borrowed the bike from Bob. **`SHE.CUST`** cleaned it." (Alice is the borrower).
  *   **Text B:** "Alice borrowed the bike from Bob. **`HE.OWN`** cleaned it." (Bob is the owner).

  ---

  ### System Verdicts

  **1. The Shallow Statistical Translator**
  *   **Output:** Translates "She" as `SHE.GEN` (generic female) and "He" as `HE.GEN` (generic male). It fails to select `.CUST` or `.OWN`.
  *   **Why:** It operates on phrase-level regularities (e.g., "She cleaned" -> `SHE.GEN cleaned`). While it correctly translates "borrowed" in the first sentence, it does not maintain a persistent *situation model* that tags Alice as `CUST` and Bob as `OWN` across the sentence boundary. When it reaches the second sentence, the "borrowed" context is outside its attention window or treated as a bag-of-words feature insufficient to trigger specific pronoun morphology. It sees gender statistics, not role persistence.

  **2. The Grounded-but-Shallow Translator (Embodied AI)**
  *   **Output:** Guesses randomly or defaults to `PRO.OWN` for both (assuming the cleaner is the owner).
  *   **Why:** It has excellent vision. It sees a woman cleaning a bike (Text A) or a man cleaning a bike (Text B). However, **ownership is a normative state, not a physical property.** Vision can detect *holding*, but it cannot detect *borrowing*. A video of Alice taking the bike looks identical whether she is borrowing it, buying it, or stealing it. The fact required to select the pronoun ("Alice is a borrower") is encoded *only* in the lexical choice "borrowed" in the text, not in the perceptual stream. Grounding is idle.

  **3. The Understanding Translator**
  *   **Output:** Correctly selects `SHE.CUST` for Text A and `HE.OWN` for Text B.
  *   **Why:** It constructs a **situation model**. It parses "borrowed... from Bob" to establish a temporary transfer of custody: Alice = `CUST`, Bob = `OWN`. It resolves "She" to Alice and "He" to Bob within that model. It then queries the model for the status of the referent relative to the object ("bike") to select the correct pronoun form. It understands the *implications* of the words, not just their co-occurrence.

  ---

  ### Analysis of the Case

  **Which feature is doing the work?**
  The **Discourse-Persistent Role Tag**.
  The case turns on the system's ability to tag an entity (Alice/Bob) with a semantic role (`OWNER`/`CUSTODIAN`) in Sentence 1 and *retain* that tag to inform morphological selection in Sentence 2. This is the core of Hofstadter's "shallowness": the system fails because it doesn't keep a running model of "who stands in what relation to what."

  **What does the case collapse into if you delete that feature?**
  If you remove the requirement for the pronoun to mark ownership status (i.e., Linguish just uses generic gendered pronouns), the case collapses into a standard translation task where corpus statistics suffice. "She" maps to "Female Pronoun" with 99% accuracy regardless of context. The philosophical pressure vanishes because the "unstated fact" (ownership) no longer gates the grammatical output.

  **The Two Attacks**

  **1. The Statistical Defense**
  *   **The Attack:** "A modern transformer *does* see 'borrowed' and 'Bob' in its context window. In the training corpus, 'borrowed from X... He [verb]' strongly correlates with X being the owner. The system doesn't need a situation model; it just needs longer n-grams."
  *   **Damage:** Moderate. If the training data is massive, the system might learn the *surface pattern* without the *model*.
  *   **Patch:** Make the construction rarer or counter-stereotypical. Example: "Alice borrowed the bike from Bob. He *polished* it." (Maybe Bob polishes his own bike even when lent?). Better: Use a target feature that requires *negation* of the default. "Alice borrowed the bike... He *didn't* clean it." The statistical correlation breaks down in negation, but the situation model holds (Bob is still the owner).

  **2. The Grounding Defense**
  *   **The Attack:** "You claim vision can't see ownership. But 'borrowing' is a physical handover event. A grounded system sees the handover and infers the temporary transfer. Grounding isn't idle; it's the basis of the concept."
  *   **Damage:** Low, but subtle. It confuses *action* with *contract*.
  *   **Patch:** Emphasize that the text describes a *state*, not an event. Change Source to: "Alice **had** the bike from Bob." (Ambiguous). No, stick to "Borrowed." The patch is to note that the *text* is the only input for the translation task. Even if the AI *could* see the world, the translation task is text-in/text-out. If the text says "borrowed" but the video shows a theft, the translator must follow the text. Therefore, the *textual* situation model is the driver, not the perceptual grounding. The "fact" is linguistic/normative, not physical.

  ### Why This Works for Your Talk
  This case isolates **Shallowness** (lack of a persistent model) from **Rootlessness** (lack of a body). It shows that giving the AI a body (Grounding) doesn't fix the problem because the relevant fact (ownership status) is invisible to sensors and exists only in the discourse model. It forces the audience to admit that "understanding" in translation isn't about knowing what a bike looks like, but about tracking who is allowed to do what with it.
