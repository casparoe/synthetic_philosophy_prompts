answer: |-
  Here is a operational procedure based on your constraints, an audit of your house rules, and decisive verdicts on your three cases.

  ### Part 1: The Choir Translation Protocol (CTP)

  This procedure is designed to be run in order. If a draft fails a step, it is returned for revision unless a "Human Override" is triggered.

  **Step 1: The Singability Check (Music Director)**
  *   **Question:** Does the text fit the notes without distorting vowel shapes or cramming syllables?
  *   **Pass:** MD signs off.
  *   **Fail:** Return to translator. No appeal.
  *   **Human Override:** None. If it doesn't sing, it isn't a singing translation.

  **Step 2: The Safety & Ethics Check (Board/Adjudicator)**
  *   **Question:** Does the text contain language that would reasonably cause harm, exclusion, or significant public embarrassment to the organization *today*?
  *   **Pass:** Proceed.
  *   **Fail:** **Hard Stop.** The text must be changed or the song dropped.
  *   **Human Override:** Adjudicator only. This is a values decision, not a factual one.

  **Step 3: The Factual Dispute Resolution (Adjudicator)**
  *   **Question:** Is there a disagreement about what the original word/phrase means (slang, obsolete, regional)?
  *   **Procedure:**
      1.  Consult a standard academic dictionary of the target era (e.g., *Trésor de la langue française* for 1930s).
      2.  If the dictionary offers multiple definitions, choose the **most literal/common** one, not the most poetic.
      3.  If heritage speakers disagree, default to the definition that requires the **least assumption of esoteric knowledge** by a general audience.
  *   **Rationale:** In a community choir, clarity and defensibility trump niche nuance.

  **Step 4: The Core Integrity Check (Adjudicator)**
  *   **Question:** Does the translation preserve the *emotional vector* and the *central metaphor* of the original?
  *   **Pass:** Proceed.
  *   **Fail:** Return to translator.
  *   **Human Override:** Adjudicator may allow a deviation only if the original meaning is **unsingable** (refer to Step 1) AND the deviation is noted in the program.

  **Step 5: The Audience Anchor Check (Adjudicator)**
  *   **Question:** Is there a visible link to the original (cognate, borrowed word, or "ghost rhyme")?
  *   **Pass:** Proceed.
  *   **Fail:** Request minor tweak to include an anchor.
  *   **Human Override:** If adding an anchor breaks Step 1 (Singability), drop the anchor. Singability trumps etymology.

  ---

  ### Part 2: Audit of Your House Rules

  You asked which rules are doing work and which are superstition.

  1.  **Never change season/time of day:** **DROP.**
      *   *Reason:* Unless the season is the *subject* (e.g., a harvest song), changing "night" to "darkness" or "summer" to "warmth" rarely alters the "tune of the thing." This rule creates unnecessary jams for low reward.
  2.  **Never reverse emotional direction:** **KEEP.**
      *   *Reason:* This is the Hofstadter principle. If the song sighs, the translation cannot shout. This preserves the soul of the piece.
  3.  **The Debt Ledger (pay back dropped images):** **MODIFY.**
      *   *Reason:* As you noticed in Case 1, this leads to "jammed" lines. **New Rule:** *Core images must remain in place; peripheral images may be dropped without repayment if keeping them compromises singability.*
  4.  **The Anchor (borrowed word/cognate):** **KEEP.**
      *   *Reason:* This validates the bilingual nature of the concert. It tells the audience, "These texts are connected."
  5.  **Ghost Rhyme:** **KEEP AS OPTIONAL.**
      *   *Reason:* It is a high-skill tool. Do not mandate it, but allow it as a solution when Step 1 (Singability) blocks a standard rhyme.

  ---

  ### Part 3: Verdicts on Current Cases

  Here I apply the Protocol. I am being decisive as requested.

  #### Case 1: The Marguerite/Daisy Pun
  *   **The Issue:** You cannot have the name "Margaret" and the flower "Daisy" in English simultaneously on the long note. Your current draft moves the flower image earlier to pay the "Debt Ledger," and it feels jammed.
  *   **Protocol Application:**
      *   *Step 1 (Singability):* The current draft is "jammed." It fails.
      *   *Step 4 (Integrity):* The pun is the central metaphor. It must be preserved if possible.
      *   *Step 5 (Anchor):* You need a link to the French.
  *   **Verdict:** **Reject the current draft.**
  *   **Solution:** Use the word **"Marguerite"** (pronounced in the English fashion: MAR-guh-ret) in the translation.
      *   *Why:* In English, "marguerite" *is* a type of daisy. It satisfies the Name constraint (it is her name), the Flower constraint (it is a flower), and the Anchor constraint (it is a borrowed French word). It likely fits the vowel constraint better than "Margaret" (which ends in a stopped consonant) depending on your melody, but even if it doesn't, it is the only way to solve the semantic knot without jamming the Debt Ledger.
      *   *Action:* Instruct the translator to keep "Marguerite" in the text. Add a program note: *"Marguerite is both a woman's name and the French word for daisy."*
      *   *Rule Change:* Suspend the "Debt Ledger" rule here. You don't need to pay back the image if you keep the word itself.

  #### Case 2: Resignation vs. Devotion
  *   **The Issue:** The draft changes "I have waited long enough" (resignation/ending) to "and still I'd wait for you" (devotion/continuation). It fits the music and singers love it.
  *   **Protocol Application:**
      *   *Step 4 (Core Integrity):* **FAIL.** This reverses the emotional vector. One is a goodbye; the other is a vow. This violates the Hofstadter "tune of the thing."
  *   **Verdict:** **Reject the draft.** (This is the verdict you expected to lose).
  *   **Reasoning:** A community choir performs *songs*, not just melodies. If you change the meaning this drastically, you are performing a new song inspired by the old one. When the audience reads the original text in the program ("I have waited long enough") and hears the English ("I'd wait for you"), the cognitive dissonance breaks the trust of the bilingual format. The singers' love for the line is irrelevant; they are singing someone else's story.
  *   **Action:** Return to translator. The constraint is the melody's cadence. If "waited long enough" does not fit the long note, you must find a synonym for resignation that does (e.g., "My waiting ends here," "I can wait no more"). Do not buy beauty at the cost of truth.

  #### Case 3: The Period Slur
  *   **The Issue:** A word that rhymes and sings perfectly is historically accurate but now functions as an ethnic slur. Volunteer argues against bowdlerization.
  *   **Protocol Application:**
      *   *Step 2 (Safety & Ethics):* **FAIL.** Hard Stop.
  *   **Verdict:** **Cut the word.**
  *   **Reasoning:** You are a community choir in a mid-sized city, not a historical reenactment society. Your budget is zero, but your social capital is finite. Singing a slur, regardless of historical context, signals to the audience that you prioritize "accuracy" over the safety of marginalized community members. The volunteer's argument about bowdlerization applies to literature read in private; singing is a public, communal act. The harm is immediate and auditory.
  *   **Action:** The translator must find a new rhyme, even if it weakens the stanza. If no suitable rhyme exists, the song should be dropped from the repertoire. There is no budget for "educating the audience" in real-time to neutralize a slur.

  ---

  ### Part 4: Meta-Analysis (Where I Might Be Wrong)

  You asked for transparency on where this procedure is shaky, where a pro would disagree, and where I am unsure.

  **1. Where a Professional Translator Would Overrule Me:**
  *   **Case 2 (Resignation):** A professional lyricist might argue that if the *musical* emotion is soaring and triumphant, a text of resignation creates a mismatch that confuses the audience more than a text of devotion would. They might argue that "singability" (Step 1) should trump "semantic integrity" (Step 4) because the *music* is the primary carrier of emotion in song. I have prioritized the text because your format (Original + Translation) highlights the text. A pro might say the music matters more.
  *   **Case 1 (Marguerite):** A pro might argue that keeping "Marguerite" untranslated is lazy translation. They might strive harder for a creative English solution (e.g., "My Daisy, my dear") rather than relying on a loanword. I prioritized the "Anchor" rule and the semantic knot over pure anglicization.

  **2. Where the Procedure is Disguised Judgment:**
  *   **Step 3 (Factual Disputes):** I told you to default to the "most literal" dictionary definition. This is a judgment call. Sometimes the "slang" meaning is the *only* meaning that makes sense in context. My rule protects you from endless debate, but it risks flattening nuance. You will still have to use your gut when the dictionary is clearly wrong about the usage.
  *   **Step 2 (Safety):** "Reasonably cause harm" is subjective. I have defined it strictly for you to protect the choir, but you are the one who has to stand in front of the Board and defend that definition.

  **3. Where I Am Unsure:**
  *   **The Vowel Constraint:** I do not hear your melody. In Case 1, I assumed "Marguerite" works on the long note. If your melody requires an open "Ah" sound and "Marguerite" forces a closed "Et" sound at the end, my solution fails Step 1. You must verify the vowel shape with your Music Director before enforcing this verdict.
  *   **The "Ghost Rhyme":** I kept this as a tool, but I am unsure if your audience has enough French literacy to hear it. If they don't, it's not a rhyme, it's just a non-rhyme. If you find your audience doesn't catch these, drop the rule.

  **Summary of Orders:**
  1.  **Adopt the Protocol.** Print it. Use it to say "No" so you don't have to.
  2.  **Case 1:** Use "Marguerite." Drop the Debt Ledger repayment.
  3.  **Case 2:** Reject the "Devotion" line. It betrays the source.
  4.  **Case 3:** Cut the slur. No exceptions.

  You are not just moving logistics anymore; you are curating culture. The procedure is your shield. Use it.
