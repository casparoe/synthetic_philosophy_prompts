      *   **Inspiration:** Hofstadter's *Le Ton beau de Marot* (translation as carrying over the "tune/pattern," not just words).
      *   **Current "House Rules":**
          1.  Don't change season/time of day.
          2.  Don't reverse emotional direction for a rhyme.
          3.  "Debt Ledger": Dropped images must be paid back elsewhere.
          4.  "Anchor": At least one borrowed word/cognate visible to the audience.
          5.  "Ghost Rhyme": English rhymes against an untranslated French word.
      *   **Needs:** A concrete *procedure* (questions in order, pass/fail criteria, stop points for human judgment), not theory. Must handle factual disputes about the original. Must evaluate the house rules.
      *   **Specific Cases to Adjudicate:**
          1.  *Marguerite/Daisy:* Name/flower pun on a long note. "Margaret" loses flower, "Daisy" loses name. Current draft moves flower image earlier (feels jammed).
          2.  *Resignation vs. Devotion:* Last line changed from "waited long enough" (resignation) to "still I'd wait for you" (devotion). Fits music better, singers love it, but flips meaning.
          3.  *Period Slur:* Only rhyming/singing word is period-accurate but now sounds like an ethnic slur. Volunteer argues against bowdlerization.
      *   **Tone/Constraints:** Be decisive. Give definite verdicts. Admit uncertainty. Identify which rulings a pro might overrule. Identify where the procedure is actually just disguised judgment. Acknowledge the "verdict you will not like." No "hire a pro" advice.

  2.  **Deconstruct the "Procedure":**

      *   The user wants a workflow. It needs to be linear, like a checklist or a flowchart, but text-based.
      *   It needs to distinguish between *Technical Constraints* (singability), *Factual Constraints* (meaning), and *Ethical/Aesthetic Constraints* (values).
      *   It needs to audit the "House Rules" to see which are useful heuristics and which are superstitions.

  3.  **Audit the House Rules:**

      *   *Season/Time:* Low priority. Unless the season is central to the metaphor (e.g., harvest), changing "night" to "day" rarely breaks a song if the mood fits. *Verdict: Drop or downgrade.*
      *   *Emotional Direction:* High priority. Changing the core message breaks the "tune of the thing." *Verdict: Keep.*
      *   *Debt Ledger:* High cognitive load. Often leads to "jammed" lines (like Case 1). *Verdict: Modify. Allow loss if the core image remains.*
      *   *Anchor:* Good for audience connection. *Verdict: Keep.*
      *   *Ghost Rhyme:* Clever, but risky if the audience doesn't know the French pronunciation. *Verdict: Keep as optional tool.*

  4.  **Develop the Procedure (The "Choir Translation Protocol"):**

      *   *Phase 1: Technical Singability (The Music Director's Veto).* If it doesn't fit, it's out. No debate.
      *   *Phase 2: Factual Accuracy (The "What does it mean?" Check).* Handle disputes here. If the original is ambiguous, default to the most common dictionary definition, not the poetic one.
      *   *Phase 3: Ethical/Safety (The Board's Veto).* Case 3 belongs here.
      *   *Phase 4: Poetic Integrity (The Adjudicator's Call).* This is where the House Rules apply.
      *   *Phase 5: Audience Connection (The Anchor).*

  5.  **Apply Procedure to Case 1 (Marguerite/Daisy):**

      *   *Problem:* Name vs. Flower pun on long note.
      *   *Constraint:* Long note needs open vowel. "Margaret" (2 syllables, ends in consonant) vs. "Daisy" (2 syllables, ends in vowel sound-ish).
      *   *House Rule Check:* Debt Ledger (moving the flower) is causing a "jam."
      *   *Analysis:* The pun is the *core* of the song. If you lose the pun, you lose the song's identity. "Margaret" loses the flower. "Daisy" loses the name.
      *   *Solution:* You can't have both in English. You must prioritize the *address* (it's a person) or the *metaphor*. Since it's a love song/address, the person is primary. But the flower is the punchline.
      *   *Verdict:* Keep "Marguerite" untranslated or use "Margaret" but find a way to make the flower explicit *without* jamming. Actually, the best singing translation often keeps the name if it's singable. But the prompt says the flower image is moved and feels jammed.
      *   *Decision:* The "Debt Ledger" rule is causing the jam. Drop the debt repayment if it compromises flow. Keep "Marguerite" (pronounced English style) or "Margaret." Acknowledge the loss of the pun in program notes.
      *   *Wait, better idea:* Can we use "Marguerite" (English pronunciation)? It keeps the name. Does it imply the flower to an English audience? Yes, "marguerite" is a daisy in English too.
      *   *Verdict:* Use "Marguerite." It satisfies the name, the flower (for those who know), and the vowel constraint better than Margaret.

  6.  **Apply Procedure to Case 2 (Resignation vs. Devotion):**

      *   *Problem:* Meaning flip for beauty/singability.
      *   *House Rule:* "Never reverse emotional direction."
      *   *Analysis:* This is the "tune of the thing" (Hofstadter). If the song is about giving up, making it about devotion changes the genre.
      *   *Verdict:* Reject the draft. It violates the core constraint of translation integrity. The singers' love for it is irrelevant if it lies about the source.
      *   *User's Expectation:* "This is the one I expect to lose." I need to confirm this loss but explain why firmly.

  7.  **Apply Procedure to Case 3 (Period Slur):**

      *   *Problem:* Historical accuracy vs. Modern harm.
      *   *Constraint:* Board approval (embarrassment/harm).
      *   *Analysis:* Community choir context. "Do no harm" trumps "historical fidelity." Singing a slur, even historically accurate, creates a hostile environment.
      *   *Verdict:* Cut it. Find a workaround (change the rhyme, change the line). The volunteer's "bowdlerization" argument fails against the "community safety" constraint.
      *   *User's Expectation:* "Decisive." This is the ethical hard stop.

  8.  **Refine the Procedure & Self-Correction:**

      *   *Critique:* Is this too rigid? The user asked for "where the procedure has to stop and hand the decision to a person." I need to mark those off-ramps.
      *   *Critique:* I need to explicitly state which House Rules to drop.
      *   *Critique:* I need to admit where *I* (the AI) am unsure. (e.g., specific vowel constraints without hearing the melody).
      *   *Critique:* I need to identify which ruling a pro would overrule. (Pros might be more flexible on Case 2 if the "spirit" is kept, but for a community choir, fidelity is safer). Actually, a pro might argue Case 1 can be solved creatively. I need to be careful not to solve it *for* them but give the verdict on the *current draft*.
      *   *Correction on Case 1:* The prompt says the current draft moves the flower image and it feels jammed. The verdict should be on the *draft*, not just the problem. If the draft is jammed, it fails singability.
      *   *Correction on Case 3:* A pro translator might argue for a footnote or context. But in a *singing* context, the ear hears the slur instantly. Context doesn't save it. I will stand firm on cutting it.

  9.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the Hofstadter influence. Validate the "logistics" approach.
      *   **The Protocol:** Step-by-step checklist.
      *   **House Rule Audit:** Which to keep, which to drop.
      *   **Case Verdicts:** Apply the protocol.
      *   **Meta-Commentary:** Where I'm unsure, where a pro would disagree, where it's disguised judgment.

  10. **Final Polish:** Ensure tone is respectful but authoritative ("Be decisive"). Check against all constraints (no "hire a pro," address the specific cases, address the house rules).

      *(Self-Correction during drafting)*: Wait, regarding Case 1. "Marguerite" in English *is* a daisy. If the song is in French, the word is "Marguerite." If the translation keeps "Marguerite," is it a translation? It's a loanword. But the user's "Anchor" rule encourages borrowed words. So keeping "Marguerite" is actually a strong move. It solves the Name/Flower issue perfectly for an English audience who knows flowers, and satisfies the Anchor rule. I will recommend this specific fix.

      *(Self-Correction on Case 2)*: The user says "I expect to lose." I must confirm this loss. The Hofstadter principle ("tune of the thing") supports this. Changing resignation to devotion changes the *music* of the meaning, even if the musical notes fit.

      *(Self-Correction on Case 3)*: This is the ethical hard line. No wiggle room for a community choir.

      *(Refining the Procedure)*: Make sure to include the "Factual Dispute" resolution mechanism the user asked for (e.g., "If two heritage speakers disagree, default to the standard dictionary definition over colloquial nuance for safety").

      *(Refining the "Unsure" section)*: I don't hear the melody. I have to trust the Music Director on singability. I need to state that limitation.

      *(Refining the "Pro Overrule")*: A professional lyricist might argue Case 2 is acceptable if the *effect* on the audience is similar (pathos), even if the semantic meaning shifts. I should note that.

  11. **Final Review against constraints:**
