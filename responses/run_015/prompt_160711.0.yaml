answer: |-
  The conflict isn't confusion; it's mismatched tools. Your birder flatmate sees administrative bloat; your curator sees philosophical nuance. Both are right because a "species concept" is asked to do three incompatible jobs. To be adequate, a concept must meet specific desiderata based on your use cases: (a) naming specimens, (b) protecting populations, and (c) binning sequences.

  **The Genuine Desiderata**
  1.  **Operational Decidability:** Can a working taxonomist apply this to a weird specimen or a bin of seawater reads without observing behavior? This requirement excludes concepts requiring observed mating. It handles the **fossil material** where morphology is all you have and the **metagenomics** case where no organism exists. If you can't decide it, it's not a tool; it's a philosophy.
  2.  **Universal Scope:** Must apply to **asexual rotifers**, **bacteria swapping genes sideways**, and sexual vertebrates alike. This is the hardest lift. It demands a definition that doesn't rely on sex.
  3.  **Conservation Predictivity:** Does membership imply shared fate? In the **conservation case**, splitting one bird into two must double the protection money only if it doubles the evolutionary diversity. If the concept splits **cryptic lineages that look identical** but share an ecological fate, it wastes resources. If it lumps **two bird forms that hybridize freely in captivity but stay distinct where they overlap**, it loses biodiversity.

  **Prejudices vs. Reality**
  The demand that there be a "single real rank in nature" is a prejudice (Platonic essentialism). Nature offers lineages; humans offer ranks. Insisting on a universal rank collapses the distinction between **taxa** (the groups) and **rank** (the level). Similarly, conflating **species** (the product) with **speciation** (the process) causes headaches with **ring-species setups**, where distinct ends are connected by interbreeding intermediates. A concept must also distinguish a **slice of time** from a **lineage through time**; the **engineered yeast strain** that can no longer mate with its parent but sits nested inside it on the tree challenges whether a species is defined by current compatibility or historical lineage.

  **Joint Unsatisfiability**
  Here is the hard truth: No single concept satisfies all three desiderata. Universality kills operationality (genetic universality is hard to measure on a museum skin); Operationality kills predictivity (morphology doesn't always match ecological fate); Predictivity kills universality (ecological niches don't apply to bacteria the same way as birds).

  This isn't a shrug; it's pragmatic pluralism. It commits you to using different concepts for different jobs. Use phylogenetic units for **metagenomics**, biological units for **birding**, and ecological units for **conservation**. Pluralism admits biology is messy without surrendering to relativism.

  **The Knockout Requirement**
  **Universal Scope** does the most work knocking out candidates. It instantly disqualifies the most popular folk concept (Biological Species Concept) because it cannot handle **asexual rotifers** or **fossils**.

  **The Contenders**
  *   **Biological Species Concept (Interbreeding):** Fails Universality (asexuals/fossils). Fails Decidability (can't test mating on seawater reads). Good for distinct sympatric birds.
  *   **Phylogenetic Species Concept (Diagnable Cluster):** Good Decidability (DNA/Morphology). Good Universality. Fails Conservation Predictivity (over-splits minor variants, inflating protection costs).
  *   **Ecological Species Concept (Niche):** Good Predictivity. Fails Decidability (hard to measure niche on a specimen) and Universality (nebulous for bacteria).
  | Concept | Decidability | Universality | Predictivity | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Biological (BSC)** | Low (needs behavior) | Low (no asexuals) | High (isolated units) | Good for birds, bad for rest. |
  | **Phylogenetic (PSC)** | High (DNA/Morph) | High (all life) | Low (over-splits) | Good for naming, risky for law. |
  | **Ecological (ESC)** | Low (needs field data) | Med (niche varies) | High (functional units) | Good for conservation, hard to use. |
  | **General Lineage** | Med (depends on data) | High (process-agnostic) | Med (theory-heavy) | Best framework, needs instantiation. |

  The curator is right: everyone agrees more than headlines suggest. They agree life is a continuum. They fight because they want a single knife to cut that continuum for every purpose. There isn't one.
