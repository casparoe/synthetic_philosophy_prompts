answer: |-
  Dear colleague,

  I hear you loud and clear, and I want to start by validating the frustration you and your committee are facing. It is genuinely difficult to adjudicate internal mental states when all you have are external traces and a forty-minute window to do it. Your Sartrean colleague is theoretically correct in the strictest sense. If we define knowledge as a unified, transparent state of consciousness, then self-deception is indeed an impossibility. You cannot know the truth and not know it simultaneously. However, practical ethics rarely survives contact with strict metaphysics, and for the purposes of a research-integrity committee, collapsing the middle ground is dangerous. If you remove self-deception, you force every case into either innocent mistake or malicious lying. That binary ignores the very human capacity for motivated reasoning, where a person convinces themselves of a truth because the cost of accepting the falsehood is too high. We need that middle category not because it is metaphysically pure, but because it captures a specific kind of culpability where the agent is responsible for their bias but not necessarily for a conscious decision to defraud. The distinction between wilful blindness and self-deception turns on consciousness. Wilful blindness is a conscious strategy. It is the decision to remain ignorant because knowing would be inconvenient. Self-deception is an unconscious strategy. It is the process of coming to believe something false because wanting it to be true shapes how you process evidence. The problem, as you know, is that from the outside, they look identical. Both result in a person asserting a falsehood while claiming they believe it. The difference lies in whether there is evidence that they previously recognized the risk and actively avoided it.

  Given your constraints, you need a procedure that does not require your committee members to become amateur psychoanalysts. They cannot peer into the soul of the accused. They can only weigh the probability of certain mental states based on behavior. So, here is how I would construct the decision procedure for your group. You start by establishing the objective breach. There must be a clear deviation from methodological or ethical standards. If there is no breach, you stop. Once the breach is established, you move to the first question, which asks whether there is direct evidence of conscious knowledge at the time of the act. This means looking for emails, drafts, or witness testimony where the individual acknowledged the falsehood or the violation and proceeded anyway. If you find a smoking gun, such as an email saying I know this data is shaky but let's publish it, you stop and return a verdict of knowing misconduct. If you do not find direct evidence of knowledge, you move to the second question, which is the critical filter for wilful blindness. You must ask whether there is evidence that the individual consciously suspected a problem and took steps to avoid confirming it. This looks like ignoring specific red flags, refusing to run a check that was suggested, or delegating a high-risk task to someone they had reason to distrust. If the evidence shows they saw the risk and looked away, you stop and return wilful blindness. If there is no evidence of conscious avoidance, you move to the third question, which opens the door to self-deception. Here you ask whether the individual had a high-stakes motivation to believe the falsehood and whether their behavior is consistent with motivated reasoning rather than random error. This is where you assess their sincerity in the interview. If they appear sincere, and the error benefits them significantly, and the mistake is complex enough to allow for bias rather than simple negligence, you lean toward self-deception. If the stakes are low or the error is trivial, you default to honest error. The values call happens at that third step. Determining sincerity is not a factual finding; it is a judgment call. Your committee must agree on whether the person's performance in the interview convinces them that the person believes their own story. If the committee cannot agree on sincerity, you cannot assign self-deception. You must default to the harsher option of wilful blindness or the lighter option of honest error depending on your institutional risk tolerance, but ideally, you should note that the evidence is inconclusive.

  Now let us run this procedure on your three cases, and I will be blunt about where the results might sting. In the first case, you have the principal investigator who signed consent forms she admits she never read, relying on a postdoc. Objectively, there is a breach. Consent forms are legal documents, and signing them without reading is a violation of protocol. There is no direct evidence she knew they were flawed, so we bypass knowing misconduct. We move to wilful blindness. Did she consciously suspect a problem and avoid it? The key here is the nature of the task. Reading consent forms is a primary duty of a PI. Delegating it is common, but signing them without review is an active avoidance of the verification step. If she had any prior reason to distrust the postdoc, this is clearly wilful blindness. Even without prior distrust, the act of signing a legal document without reading it can be construed as conscious avoidance of the risk contained within. However, if she has a long history of trust and the postdoc was senior, a committee might argue this is honest error. But under a strict reading of the procedure, signing without reading is an avoidance of knowledge. I suspect this case will land on wilful blindness. This might feel harsh to you, as it imposes a semester's suspension for what feels like administrative delegation. But the procedure forces this because the act of signing without reading is functionally identical to steering around finding out. She chose not to know the content, and that choice carries the risk.

  The second case involves the postdoc who ran forty specifications and reported the one significant result, claiming this is standard practice. There is a breach of methodological integrity. There is no direct evidence he knew it was fraud, so we skip knowing misconduct. We look for wilful blindness. Did he suspect the result was unstable and avoid checking? Trying forty specifications implies he saw thirty-nine failures. That is evidence of conscious awareness of instability. However, if he genuinely believes the fortieth specification is the theoretically correct one, he may not view the others as failures but as incorrect models. This is where the values call enters. If the committee believes his claim that this is what the field does, we move to self-deception. He has a high stake in publication. He is motivated to see the effect as real. His sincerity appears intact. Under the procedure, this lands on self-deception. This is the result I know you will not like. P-hacking is often treated as misconduct or wilful blindness in the literature, and assigning only ethics training feels lenient for manipulating data until it breaks. But I did not bend the procedure to avoid this because without an email or testimony showing he knew the result was false, we cannot prove conscious avoidance. We only have his behavior, which is consistent with a biased researcher who convinced himself the significant result was the true one. If you want this to be wilful blindness, you need evidence that he knew the specification was unjustified. Without that, the procedure protects him from the harsher penalty, and that is the cost of requiring evidence of conscious states.

  The third case is your friend, the professor who plagiarized two paragraphs from a review she cited, claiming cryptomnesia. There is a breach. There is no evidence of knowing misconduct, as she cited the source, which suggests she wasn't trying to hide the origin, just failed to quote it. We look for wilful blindness. Did she suspect she was copying and avoid checking? Unlikely. Cryptomnesia is a known psychological phenomenon where memory sources are confused. We move to self-deception. She has a high stake in her reputation. She insists she remembers writing them. This is consistent with unconscious appropriation driven by the desire to have written something insightful. This lands on self-deception. This feels appropriate for the case, as it acknowledges the violation without assigning malicious intent. It validates the distinction you want to keep. The uncomfortable result is really the second case, where the procedure risks under-punishing a serious methodological violation because the evidence of conscious intent is missing.

  I need to be honest about what this procedure cannot do. It cannot solve the problem of sincerity. If a subject is a skilled liar, they will pass the self-deception check and receive a lighter penalty than a clumsy liar who admits to wilful blindness. It also cannot fully resolve the Sartrean objection. There will always be a gray area where motivated reasoning looks like conscious avoidance. The procedure forces you to make a values call at the point of assessing sincerity, and that is where your committee will still deadlock if they disagree on human nature. Some members will believe anyone who tries forty regressions must know they are cheating. Others will believe researchers often lose themselves in the data. The procedure does not fix that disagreement; it just isolates it to a specific question so you know where the fight is happening. It also cannot account for structural pressure. A postdoc under threat of non-renewal is more likely to self-deceive, but the procedure treats the mental state the same regardless of the pressure that caused it. Finally, it relies on the quality of your interview. If you do not ask the right questions to probe for conscious suspicion, you will default to self-deception too often. You need to ask not just do you believe this is true, but did you ever worry it was false, and what did you do with that worry.

  In the end, keeping the self-deception category is the right call for your code, even if the Sartrean is theoretically tidy. Research integrity is not just about punishing liars; it is about correcting the culture of research. A researcher who self-deceives needs training and supervision to learn how to check their biases. A researcher who is wilfully blind needs suspension to understand that avoidance is not an excuse. Collapsing them removes the tool you need to fix the former without destroying the latter. Just be prepared for the cases where the evidence is thin, and the procedure gives you a verdict that feels too light. That is not a failure of the procedure; it is a reflection of the burden of proof. You are judging minds, not just actions, and sometimes the mind hides even from itself, let alone from a committee with forty minutes on the clock. I hope this helps you break the deadlock.

  Warmly,

  A Colleague
