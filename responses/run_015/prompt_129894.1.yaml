          *   Alternatively, Case (a) gets WB. Suspension for a busy PI who trusted a postdoc? That might be the uncomfortable one.
          *   Let's choose Case (a) as the uncomfortable one. A PI trusting a postdoc is standard delegation. Calling it Wilful Blindness implies she suspected something. If the procedure infers suspicion from the *act* of not reading (constructive knowledge), that pushes it to WB. That might be too harsh.
