  2.  **Deconstruct the Philosophical Problem:**
      *   **The Four Boxes:**
          1.  *Honest Error:* No culpability. Didn't know, shouldn't necessarily have known, or made a mistake without intent.
          2.  *Wilful Blindness (WB):* Suspected wrongdoing, actively avoided confirming it. Culpable. (Legal concept: conscious avoidance).
          3.  *Self-Deception (SD):* Unconsciously motivated belief. Wanting something to be true so badly that one convinces oneself it is true, despite evidence. Culpability is contested (hence the lighter penalty in the code).
          4.  *Knowing Misconduct:* Straight-up lying/fraud. Conscious intent to deceive.
      *   **The Sartrean Objection:** Sartre argues SD is impossible because it requires knowing the truth to hide it from oneself. If you know it, you know it. If you don't, you don't. So it's either lying (knowing) or error (not knowing).
      *   **The Counter-Argument (Philosophy of Mind/Moral Psychology):** Partitioned mind, motivated reasoning, subconscious bias. One can hold conflicting beliefs in different "modules" or suppress evidence without conscious acknowledgment. SD is distinct from WB because WB involves a conscious suspicion ("I better not look"), whereas SD involves a subconscious suppression ("I really believe this is right").
      *   **Evidentiary Constraint:** We only have external behavior (emails, drafts) and self-report (interview). We cannot peek into the brain. Distinguishing SD from WB or Honest Error is notoriously hard from the outside.
      *   **The Goal:** A procedure that works for non-philosophers in 40 minutes. It needs to be operationalizable.

  3.  **Drafting the Brainstorming/Conceptual Grounding (Mental or Scratchpad):**
      *   Need to define SD in a way that distinguishes it from WB. WB = "I suspect X is wrong, so I won't check." SD = "I want X to be right, so I convince myself it is right without acknowledging the doubt."
      *   Key difference: Consciousness of the risk. WB has conscious risk awareness. SD has suppressed risk awareness.
      *   Evidence for WB: Emails showing concern that was dismissed, avoiding specific checks.
      *   Evidence for SD: Pattern of motivated reasoning, ignoring obvious red flags while claiming sincerity, high stakes for the individual (tenure, prestige) driving the bias.
      *   Evidence for Honest Error: Low stakes, no pattern, plausible alternative explanation.
      *   Evidence for Knowing Misconduct: Direct evidence of fabrication, lying about data existence.
      *   The Sartrean point is theoretically strong but practically useless for a committee needing to assign graded culpability. We need a pragmatic distinction.
      *   The procedure must prioritize evidence of *conscious avoidance* vs. *unconscious bias*.
      *   Limitation: We can never be 100% sure about internal states. We are inferring mental states from behavior.

  4.  **Developing the Decision Procedure:**
      *   Needs to be a flow of questions.
      *   Q1: Is there objective falsehood/deviation? (If no, stop).
      *   Q2: Did they know it was false at the time? (Hard to prove). Better: Is there evidence of conscious knowledge? (Emails admitting doubt).
      *   Q3: Is there evidence of conscious suspicion avoided? (WB).
