          *   Or Case (a) comes out as Wilful Blindness because a PI *should* know better, which might feel harsh if she's usually diligent.
          *   Let's go with Case (b) resulting in Self-Deception. This is controversial because p-hacking is often seen as WB. But if he insists sincerity and there's no smoking gun email, SD is the only box between Error and WB.
