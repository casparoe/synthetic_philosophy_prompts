  ### Pre-Answer Planning Sketch

  *   **Vocabulary Mapping:**
      *   *Psi-Ontic:* Map $\psi$ to **T1** (Microstate). Distinct $\psi$ $\to$ disjoint regions in state space.
      *   *Psi-Epistemic:* Map $\psi$ to **T3** (Ensemble/Credence) or **T2** (Coarse-grained/Macrostate). Distinct $\psi$ $\to$ overlapping distributions over T1.
      *   *T4/T5:* T4 mostly vacant for $\psi$. T5 viable for "Nomological" views (law-like).
  *   **Role Split:**
      *   *Dynamical:* T1 (flow) or T5 (law).
      *   *Predictive/Informational:* T3 (ensemble/Bayesian).
      *   *Coherence:* Split is coherent (e.g., Bohm: particles T1, $\psi$ T5/T1 hybrid). Cost: Ontological dualism.
  *   **Collapse Translation:**
      *   *Stochastic:* Physical jump (T1 discontinuity).
      *   *Updating:* Bayesian conditioning (T3).
      *   *User's Worry:* Valid. Conditioning assumes pre-existing value. QM measurement often violates this (Contextuality). This is the "fudge."
  *   **Residue (What breaks):**
      *   *Dimension:* $\psi$ on $3N$-space, apparatus on 3-space.
      *   *Phase:* Interference requires amplitudes, not just probabilities (T3 fails here without negation/contextuality).
      *   *Silent Assumption:* User's vocab assumes **Non-Contextuality** (microstate has definite values for all observables). QM no-go theorems (PBR, Bell, KS) target this.
  *   **Scorecard:**
      *   T1: High (Realism). Evidence: PBR.
      *   T3: Medium (Anti-realism). Evidence: Wigner's Friend.
      *   T2/T5: Lower but viable.
      *   T4: Negligible.

  ***

  ### The Translation

  You have asked me to translate the debate over the quantum state into the language of statistical mechanics and experimental spectroscopy. This is a demanding constraint, but a fruitful one. Your vocabulary is precise where philosophical vocabulary is often slippery. However, as you suspect, there is friction where the quantum formalism resists being mapped onto a classical phase space.

  Here is the restatement of the distinction, the analysis of your role-split, and the report on what remains untranslatable.

  #### 1. The Taxonomy (T1–T5) and the Ontic/Epistemic Distinction

  In the foundations literature, the "sharp" distinction between psi-ontic and psi-epistemic relies on the behavior of probability distributions over a space of underlying physical states (often denoted $\Lambda$). In your vocabulary, $\Lambda$ is the space of **microstates** (T1).

  **Psi-Ontic:**
  This view asserts that the quantum state $\psi$ corresponds to **T1**.
  *   **Translation:** $\psi$ is a complete specification of how the system is, analogous to a point in phase space $(q, p)$.
  *   **The Overlap Condition:** If $\psi$ is T1, then two distinct pure states (e.g., spin-up and spin-down in the same basis) must correspond to disjoint regions of the microstate space. There is no microstate $\lambda$ compatible with both $\psi_{\uparrow}$ and $\psi_{\downarrow}$. The distribution $\mu(\lambda|\psi)$ is a delta function (or effectively so).
  *   **Mapping:** One-to-one onto **T1**.

  **Psi-Epistemic:**
  This view asserts that $\psi$ corresponds to **T3** (primarily) or **T2**.
  *   **Translation:** $\psi$ is a measure over microstates (T3), akin to a Gibbs ensemble, or an incomplete specification (T2), akin to a macrostate defined by temperature and pressure.
  *   **The Overlap Condition:** If $\psi$ is T3/T2, then two distinct pure states can correspond to overlapping distributions over the microstate space. There exists at least one microstate $\lambda$ that is compatible with both $\psi_{\uparrow}$ and $\psi_{\downarrow}$. The difference between the states is not in the physical system itself (the $\lambda$), but in the information or preparation procedure (the distribution $\mu$).
  *   **Mapping:** Primarily **T3**. **T2** is a viable subset (coarse-graining), but T3 captures the Bayesian updating aspect better.

  **Vacant and Wedged Slots:**
  *   **T4 (Fixed Coefficient):** This slot is genuinely vacant for $\psi$ itself. $\psi$ changes with preparation; coupling constants do not. However, some "Nomological" views wedge $\psi$ into **T5**.
  *   **T5 (Structural/Constraint):** This is the "Law-like" view. Here, $\psi$ is not a state of the system but part of the Hamiltonian flow itself—a constraint governing the evolution of T1 items (like particles in Bohmian mechanics). This is a coherent wedge, but it requires separating the "state" from the "law."

  #### 2. The Role-Split and Coherence

  You identified three jobs: Dynamical, Predictive, and Informational. Your suspicion is correct: the psi-ontic/epistemic distinction is often too coarse to register that these jobs might be filled by different categories of thing.

  **The Split Verdict:**
  It is logically coherent to assign different T-categories to different jobs.
  *   **Dynamical Job:** The Schrödinger equation describes a flow. In your vocabulary, this looks like **T1** (Hamiltonian flow of a physical field) or **T5** (a law governing particles).
  *   **Predictive/Informational Job:** The Born rule yields probabilities. In your vocabulary, this looks like **T3** (an ensemble average or credence function).

  **Is this a real option?**
  Yes. This is effectively the stance of **Bohmian Mechanics** (De Broglie-Bohm).
  *   *Dynamical:* The wavefunction is a physical field (T1-ish) or a guiding law (T5) that evolves unitarily.
  *   *Predictive:* The uncertainty is epistemic (T3) because we do not know the exact initial positions of the particles (the true T1 microstates).
  *   *Cost:* The cost is **ontological dualism**. You must accept two distinct kinds of physical existents: the particles (T1) and the wave (T1/T5). You also inherit the "empty wave" problem: parts of the wavefunction evolve into regions of configuration space where no particles exist, yet the wave remains physically real to guide future motion.

  **Translating Collapse:**
  You asked to translate the four main families of collapse using your vocabulary.

  1.  **Genuinely Stochastic Collapse (e.g., GRW):**
      *   *Translation:* A **real physical process** (discontinuous change in T1).
      *   *Fudge:* It violates Hamiltonian flow (reversibility/measure-preserving). It introduces a new fundamental constant (collapse rate) that acts like a T4 parameter but drives T1 changes.
  2.  **Deterministic Guiding (e.g., Bohm):**
      *   *Translation:* No collapse. The apparent collapse is a change in the **effective** wavefunction due to the system entering a specific channel of configuration space.
      *   *Fudge:* It requires the "empty" branches of the wave to remain ontologically real (T1) even if they never influence the particles again.
  3.  **Branching without Collapse (e.g., Everett):**
      *   *Translation:* Pure **Hamiltonian flow** (T1). The "split" is a decoherence-induced coarse-graining (T2) where interference terms become negligible.
      *   *Fudge:* It struggles to recover the Born rule (probabilities) from a deterministic flow without adding a measure over branches that looks suspiciously like T3.
  4.  **Treating Collapse as Updating (e.g., QBism/Epistemic):**
      *   *Translation:* **Conditioning** of a distribution (T3) on new data.
      *   *Fudge:* This addresses your specific worry directly. In your work, conditioning $P(A|B)$ presupposes that $B$ reveals a value that existed (or an event that occurred) independent of the measurement context. In QM, the "outcome" often does not have a pre-existing value in the microstate (due to contextuality). The epistemic translation smuggles in the assumption that the measurement merely reveals a pre-existing property, which the formalism (Kochen-Specker) suggests is false.

  #### 3. The Residue Report

  Here is what cannot be expressed in your vocabulary, or where your vocabulary silently assumes something the quantum debate denies.

  **Item 1: The Dimensionality of the State Space**
  *   *The Defect:* In your vocabulary, a microstate lives in the same space as the apparatus (3 dimensions per particle). The quantum state $\psi$ for $N$ particles lives on a configuration space of $3N$ dimensions (or Hilbert space, which is infinite-dimensional).
  *   *Verdict:* **Defect in Vocabulary.** Your Stat Mech vocabulary assumes the state is defined *on* physical space. QM suggests the fundamental state is defined on a high-dimensional space, and 3D space is a derived or emergent feature. A T1 mapping requires accepting that "physical reality" is $3N$-dimensional, not 3-dimensional.

  **Item 2: Complex Phase and Interference**
  *   *The Defect:* A T3 object (measure over microstates) involves positive real probabilities that add. $\psi$ involves complex amplitudes that interfere. $P(A) + P(B) \neq P(A \cup B)$ in QM due to cross-terms.
  *   *Verdict:* **Defect in the Epistemic Claim.** You cannot reproduce quantum statistics with a classical T3 ensemble over non-contextual T1 microstates without allowing negative probabilities or context-dependent measures. The "phase" is not just a label; it is a dynamical variable with no classical analogue in your Gibbs ensemble vocabulary.

  **Item 3: The Existence of $\Lambda$ (Non-Contextuality)**
  *   *The Defect:* Your vocabulary assumes that a "microstate" (T1) specifies the value of all observables simultaneously (position, momentum, spin components). This is **Non-Contextuality**.
  *   *Verdict:* **Silent Assumption Exposed.** The psi-epistemic view *requires* a space of complete states $\Lambda$ for $\psi$ to be a distribution over. However, no-go theorems (Bell, Kochen-Specker, and specifically **Pusey-Barrett-Rudolph (PBR)** for the ontic/epistemic distinction) suggest that if you assume $\Lambda$ exists and behaves classically (non-contextually), you cannot reproduce QM predictions.
  *   *Correction:* The PBR theorem specifically targets your T2/T3 mapping. It proves that if distinct pure states correspond to overlapping distributions over $\Lambda$ (Epistemic), and $\Lambda$ behaves independently during measurement (pre-existing values), you contradict QM predictions. To save the Epistemic view, you must deny that $\Lambda$ is non-contextual. Your vocabulary has no slot for "Contextual Microstate."

  **Item 4: Preparation vs. Discovery**
  *   *The Defect:* In your work, "preparation" (calibration) selects a subset of systems that already had those properties. In QM, preparation often *creates* the property.
  *   *Verdict:* **Philosophical Claim is Less Clear.** The debate often assumes "preparation" is analogous to "filtering." If preparation is "creation," the T3 (ensemble) view becomes harder to sustain because there is no pre-existing population to form the ensemble over.

