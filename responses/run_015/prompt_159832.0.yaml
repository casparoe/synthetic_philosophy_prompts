  **MEMORANDUM**

  **TO:** Campus Collections Committee
  **FROM:** [Your Name], Student Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Status of *Anthem* and Fundraising Mugs

  **Purpose**
  This memo recommends a course of action regarding the senior sculpture *Anthem*, originally voted into the permanent front-hall collection, shattered in August, and subsequently re-wedged into forty fundraising mugs. A digital scan exists for replication. We must resolve the conflict between the sculptor's request (withdraw mugs, display replica) and the ceramics teacher's position (sell mugs, replica fulfills promise).

  **Analysis of Objecthood and Policy**
  The core dispute is ontological: Is the collection item the specific form created by the artist, or the raw matter itself?

  The ceramics teacher argues that nothing of value was lost because the matter survives in the mugs and the form survives in the scan. On these terms, if *Anthem* is identical to its clay, then the mugs *are* *Anthem*. However, our policy states collection items may not be disposed of without committee approval. If the mugs are the collection item, selling them constitutes disposal and commercialization of collected property without the required vote. We cannot implicitly approve the sale of a collection item by defining it as mere material after the fact.

  Conversely, if *Anthem* was the specific arrangement of clay (the form), the object was destroyed when it shattered. The promise of a "permanent spot" cannot be kept by the original, but a replica offers the closest possible fidelity to the visual commitment. Selling the reclaimed clay as mugs, while standard studio practice for student waste, commodifies the remains of a collected work. This inflicts the "second injury" the sculptor describes, transforming a honored piece into inventory.

  **Consideration of the Counter-Argument**
  The strongest argument against withdrawing the mugs is pedagogical and practical. The ceramics teacher correctly notes that reclaiming clay is fundamental to studio sustainability; treating one piece as sacred disrupts the lesson that material is cyclical. Furthermore, the mugs are already boxed for the winter sale; withdrawing them incurs a financial loss for the program and wastes labor already invested in throwing and firing. There is merit to the view that the school should not bear the cost of preserving a broken object when the material value is recoverable.

  **Precedent**
  Choosing to withdraw the mugs establishes that once an item enters the Collection, it is retired from the standard material cycle. Future breakage of collected items made of reusable materials (clay, scrap metal, digital files) would require us to preserve the matter or form rather than repurposing it for revenue. This raises the bar for acquisition, ensuring we only collect what we are prepared to preserve even through destruction.

  **Recommendation**
  I recommend **Option A**: Withdraw the mugs from the sale and display the 3D-printed replica, clearly labeled as a replica.

  This option honors the spirit of the "permanent spot" promise without falsely claiming the replica is the original. It respects the teacher's ontological claim (that the matter survives) by refusing to sell that matter, thereby avoiding the unauthorized disposal of collection property. It acknowledges the sculptor's dignity while maintaining the visual presence of the work in the hall.

  **Action Plan**
  *   **Responsible Party:** Committee Chair
  *   **Action:** Notify the Ceramics Teacher and Fundraising Coordinator of the decision to withdraw the mugs.
  *   **Deadline:** Thursday, October 26, 5:00 PM (prior to sale catalog finalization).

  Recommendation: \answer{A}
