answer: |-
  # The Stalemate in De Re Modality

  The persistence of the debate between counterpart theory (CT) and transworld identity (TWI) is not a failure of argumentation but a symptom of a deeper structural divide. You are correct that the canonical moves have ceased to advance the dialectic. The reason is that the dispute is not merely about the semantics of modal operators, but about the trade-off between logical strictness and metaphysical parsimony. Below, I evaluate your three hypotheses and address the tie case to diagnose why the standoff remains unresolved.

  ## The Separability Hypothesis

  Your first hypothesis suggests that the metaphysical thesis (world-boundness) is separable from the logical apparatus (the counterpart relation), and that the latter might be mere notation. On a standard reading of David Lewis, these are not separable. World-boundness is motivated by the problem of accidental intrinsics: an object cannot be both bent and straight unless these properties are relativized to worlds. If individuals are transworld, one must accept either that properties are relations to worlds or that objects have incompatible intrinsic properties. Lewis rejects both.

  However, your logical intuition has merit. If one constrains the counterpart relation to be an equivalence relation (reflexive, symmetric, transitive) and ensures uniqueness, the resulting modal logic mimics S5 with transworld identity. *I reconstruct this claim as follows:* the difference becomes verbal if the only divergence lies in the formal constraints on the relation. But the dispute is substantive if there are ordinary modal sentences on which they disagree. They do disagree on sentences involving identity across worlds, such as "I could have been you." For TWI, this is false (strict identity); for CT, it can be true (counterpart relation). Therefore, the dispute is not purely notational. The logical divergence reflects the metaphysical commitment: CT sacrifices the logic of identity to preserve a qualitative metaphysics, while TWI sacrifices qualitative metaphysics to preserve the logic of identity.

  ## Data and Methodological Divergence

  Your second hypothesis posits a disagreement about data. This is accurate and constitutes a significant portion of the stalemate. The transworld theorist, following Kripke, treats first-personal modal intuitions as hard constraints. The claim "I could have done otherwise" is taken literally; if a semantics implies that *I* did not do it (but a counterpart did), the semantics is rejected.

  *It is contested whether* Lewisians view these intuitions as mere reports. On my reconstruction, the Lewisian strategy is error-theoretic regarding the surface grammar of modal discourse. They argue that speakers would not withdraw their assent to "I could have done otherwise" once the counterpart-theoretic paraphrase is explained. The stalemate arises because there is no neutral arbiter for methodological priority. If intuitions are data, TWI wins. If intuitions are phenomena to be explained away in favor of systematic metaphysics, CT wins. Neither side can compel the other to adopt their methodological stance without begging the question. This is not a lack of argument, but a clash of philosophical priorities regarding the authority of pre-theoretic intuition.

  ## The Ideological Core

  Your third hypothesis identifies the ideological disagreement regarding concrete worlds and haecceitism. This is the deepest layer of the dispute. *It is settled among specialists that* TWI typically requires some form of haecceitism—the view that there are primitive thisness facts distinct from qualitative properties—to individuate objects across worlds where qualitative descriptions fail. CT rejects primitive haecceities in favor of qualitative similarity.

  Consequently, the surface dispute about modality is indeed a proxy for the acceptability of haecceitistic facts. The transworld theorist accepts primitive identity as a brute fact; the counterpart theorist finds this ontologically profligate. Because this is a fundamental ontological commitment, no argument internal to modal semantics will resolve it. The debate has not moved because neither side can offer a non-circular justification for their preferred ontology. The TWI theorist argues that haecceitism is necessary for coherence; the CT theorist argues that haecceitism is unintelligible. This is a foundational impasse.

  ## The Tie Case Diagnostic

  To ground this diagnosis, consider the tie case: a world containing two exactly similar candidates for being this podium's counterpart, differing in no qualitative respect, with no haecceity available. One is made of ice; the other is made of wood. Is it true that *this podium could have been made of ice*?

  On the TWI picture, this case is problematic. If worlds are stipulated, we must stipulate which object is *this* podium. But if the candidates are qualitatively indiscernible and there are no haecceities, there is no fact of the matter about which one is identical to the actual podium. *I reconstruct the TWI response as requiring* either a rejection of such worlds (denying the possibility of symmetric duplicates) or an acceptance of indeterminate identity. If identity is strict, one candidate is *it* and the other is not, but without haecceities, we cannot say which. This forces the TWI theorist into a metaphysical corner: they must accept primitive thisness to maintain determinate truth conditions.

  On the CT picture, both candidates are counterparts based on qualitative similarity. The truth condition for "Possibly F" is existential: is there *a* counterpart that is F? Yes, the ice counterpart. Therefore, the sentence is true. However, CT faces a different cost. If we ask "Is it true that I would have been made of ice?", CT cannot answer uniquely. Both outcomes are possible relative to different counterparts. *It is contested whether* this indeterminacy is a bug or a feature. Lewisians accept that de re modality can be indeterminate in tie cases; Kripkeans view this as a failure to capture the specificity of reference.

  Is this case diagnostic? Yes, but only in confirming the original standoff. It reveals that TWI requires haecceitism to handle symmetric worlds, while CT accepts indeterminate truth conditions to avoid it. The tie case does not refute either view; it merely forces each to display its cost. The TWI theorist pays with primitive identity; the CT theorist pays with logical determinacy. Because philosophers differ on which cost is acceptable, the case does not resolve the debate. It functions as a clear display of the trade-off rather than a decisive argument.

  ## Conclusion

  The debate has not moved because it is not a puzzle waiting for a solution, but a choice between incompatible theoretical virtues. Your separability hypothesis is partially correct: the logic follows the metaphysics, but they are not independent. Your data hypothesis identifies the methodological barrier: intuition versus systematization. Your ideology hypothesis identifies the ontological barrier: haecceitism versus qualitative supervenience.

  The tie case confirms that the dispute is substantive, not verbal, because the frameworks deliver different truth conditions in symmetric worlds. However, it is not diagnostic in the sense of favoring one side, because each outcome aligns with the prior commitments of the respective framework. The stalemate persists because the choice between CT and TWI is ultimately a choice between preserving the logic of identity or preserving a qualitative ontology. Until there is a consensus on whether primitive haecceities are intelligible or whether pre-theoretic modal intuitions are incorrigible, the debate will remain exactly where it has been for sixty years.
