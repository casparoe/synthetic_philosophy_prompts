      *   *Correction on Audited Lottery:* The user asks if symmetry breaks. Yes, in law (naked statistical evidence vs. specific evidence). I need to link this to the "Evidence-Responsiveness" requirement.
      *   *Requirement Refinement:* Instead of just "Closure," use "Operational Closure." Institutions need to output a single verdict.
      *   *The "Kill Shot":* It's likely the combination of **Fallibilist Certification** (certifying things that aren't certain) + **Conjunction Responsibility** (being responsible for the conjunction) + **Risk Accumulation** (errors add up). You can't have all three.

  8.  **Final Polish:**
      *   Check tone: Professional, analytical, not deferential but respectful.
      *   Check constraints: Did I mark epistemic standing? Yes. Did I score the strategies? Yes. Did I address the three cases? Yes.
      *   Ensure the distinction between "acceptance for inference" and "public commitment" is clear in the desiderata.

  9.  *(Final check of the "Kill Shot")*: The strongest incompatibility in *institutional* settings is between **Local Reliability** (each claim meets threshold) and **Global Reliability** (the whole output meets threshold). A theory that satisfies Local Reliability (Lockean) fails Global Reliability in complex systems. This is the "Systemic Risk" problem.

