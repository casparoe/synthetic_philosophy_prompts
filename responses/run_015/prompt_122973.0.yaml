answer: |-
  This is a productive pivot. Most formal epistemology treats acceptance as a proxy for individual belief, but your framing treats it as a **speech act with liability**. This moves the problem from the philosophy of mind to the philosophy of social systems and risk management. The "paradoxes" you are circling are often artifacts of demanding individual psychological norms fit institutional functional requirements.

  Below is the specification you requested. I have marked the epistemic standing of each requirement explicitly. Where I am extrapolating from the literature to fit your institutional framing, I note it. Where your framing does argumentative work, I flag it.

  ### Part 1: Specification of Desiderata for Institutional Acceptance

  **1. The Actionability Requirement**
  *   **Definition:** If a body accepts $P$, it must be licensed to act on $P$ as if $P$ were true, without further hedging, within the scope of its mandate.
  *   **Motivation:** A regulator certifying a bridge cannot append "but probably not" to the load limit. A journal publishing a result asserts it as a basis for further research.
  *   **Status:** **Uncontroversial** *given your framing*. In pure epistemology, "pragmatic encroachment" is contested (Purists argue stakes shouldn't affect justification). But for a *certifying body*, actionability is constitutive of the role.
  *   **Negotiability:** Non-negotiable for this project. If the theory doesn't license action, it isn't a theory of *certification*.

  **2. The Local Reliability (Lockean) Requirement**
  *   **Definition:** A claim $P$ is eligible for acceptance only if the evidence for $P$ raises its probability above a high threshold $t$ (e.g., $0.95$ or $0.99$).
  *   **Motivation:** Prevents certifying guesses. Matches the intuition behind the Lottery (each ticket is likely to lose) and the Preface (each claim is well-supported).
  *   **Status:** **Contested.** While the "Lockean Thesis" is standard, many epistemologists (e.g., proponents of Knowledge Norms) argue high probability is insufficient for acceptance/assertion (the "Assertion Puzzle"). However, for *institutional risk*, probability thresholds are the standard currency.
  *   **Negotiability:** Negotiable. Some theories replace probability with "normic support" or "safety."

  **3. The Global Integrity (Conjunction) Requirement**
  *   **Definition:** The body must be able to certify the conjunction of all accepted claims ($P_1 \land P_2 \dots \land P_n$) as a single output, and bear responsibility for that conjunction.
  *   **Motivation:** The Regulator case. You cannot certify "The system is safe" if that is logically equivalent to "Sub-system A is safe AND Sub-system B is safe..." while admitting the conjunction is likely false.
  *   **Status:** **Contested.** Kyburg's solution to the Lottery Paradox explicitly *denies* closure under conjunction for belief. However, institutions *must* output conjunctions (e.g., a safety manual).
  *   **Negotiability:** Non-negotiable for *systems*, though negotiable for *individual belief*. This is where your institutional framing diverges from standard epistemology.

  **4. The Evidence/Probability Distinction Requirement**
  *   **Definition:** Acceptance eligibility must track the *type* of evidence, not just the resulting probability. Statistical frequency alone (Lottery) should not license acceptance where individualized causal evidence (Testimony/Audit) does, even at identical probabilities.
  *   **Motivation:** The Court case (naked statistical evidence vs. specific evidence) and the Audited Lottery. Intuitively, convicting on base rates feels unjust; certifying a component based on a reliability audit feels safer than based on a failure rate of similar components.
  *   **Status:** **Contested but Gaining Traction.** This aligns with "Normic Support" (Smith) or "Proper Function" accounts. Pure Bayesians often reject this, arguing only probability matters.
  *   **Negotiability:** Highly Negotiable. This is the hardest requirement to formalize without smuggling in vague intuitions.

  **5. The Traceability (Audit) Requirement**
  *   **Definition:** Acceptance must be traceable to specific evidence chains for each claim, not derived solely from the reliability of the process generating the claims.
  *   **Motivation:** The Audited Lottery. If I check Ticket 1 and it loses, I know it. If I infer Ticket 1 loses because 999 others will, I don't *know* it in the same way. Institutions need audit trails for liability.
  *   **Status:** **Extrapolation.** This is not a standard epistemic desideratum but is standard in engineering/assurance cases (e.g., ISO standards).
  *   **Negotiability:** Negotiable, but essential for your "regulator" use-case.

  **6. The Stability (Stake-Insensitivity) Requirement**
  *   **Definition:** The epistemic status of a claim (whether it is *justified*) should not vary with the practical stakes of being wrong, though the *decision to assert* might.
  *   **Motivation:** The Adversarial Preface. The author's evidence hasn't changed. If acceptance is truth-directed, stakes shouldn't change justification.
  *   **Status:** **Highly Contested.** This is the core of the "Pragmatic Encroachment" debate. Contextualists and Encroachers say stakes *do* change justification/knowledge. Purists say they do not.
  *   **Negotiability:** **Critical.** Your framing suggests you want Purism (evidence determines acceptance), but your Actionability Requirement suggests Encroachment (stakes determine action). **This is a tension point.**

  ---

  ### Part 2: The Incompatibility (The "Kill Shot")

  You asked for the subset of requirements that cannot be jointly satisfied. In the context of institutional certification, the impossibility result is not the classic Lottery Paradox (Probability + Conjunction + Consistency). It is the **Systemic Risk Trilemma**.

  You cannot jointly satisfy:
  1.  **Local Reliability** (Certify every claim that passes threshold $t$).
  2.  **Global Integrity** (Certify the conjunction of all claims).
  3.  **Risk Accumulation Awareness** (Acknowledge that errors aggregate across independent claims).

  **Why:** If you have 100 independent sub-claims, each at $0.99$ probability (Local Reliability), the probability of their conjunction is $0.99^{100} \approx 0.36$. If you certify the conjunction (Global Integrity), you are certifying a claim that is more likely false than true. If you refuse to certify the conjunction, you fail the Regulator's mandate. If you raise the threshold $t$ to compensate for $n$, you violate the idea that $t$ is fixed by the evidence quality (and eventually $t$ becomes unreachably high).

  **The Single Requirement that Knocks Out the Most Theories:**
  **Global Integrity (Requirement 3).**
  *   **Kills:** Standard Lockeanism (Kyburg), simple Probabilism, and most Contextualist solutions that rely on shifting thresholds locally. They handle the individual claims but cannot account for the *system* output without contradiction.
  *   **Survivors:** Theories that deny the conjunction is the object of acceptance (e.g., "Acceptance is a policy, not a belief") or theories that impose a global risk budget rather than local thresholds (e.g., Bayesian Decision Theory applied to the whole system).

  ---

  ### Part 3: Testing Your Three Cases

  **1. The Distributed Preface**
  *   **Analysis:** This case successfully decouples *individual liability* from *collective output*.
  *   **Verdict:** The paradox arises **only for the Editor**, not the contributors.
      *   *Contributors:* Operate under Local Reliability. They accept their chapter. They are not responsible for the book's truth. No paradox.
      *   *Editor:* Operates under Global Integrity. Must certify the volume. Faces the Trilemma.
  *   **Critique of your framing:** You ask if "aggregate acceptance is the same thing as accepting the aggregate." **No.** This is the crucial distinction your group needs. *Aggregate Acceptance* is a set of independent speech acts $\{A(P), A(Q)\}$. *Accepting the Aggregate* is a single speech act $A(P \land Q)$. Institutions often do the former internally but are legally bound to the latter externally. The paradox lives in the gap between these two.
  *   **Epistemic Standing:** This distinction is well-trodden in social epistemology (List & Pettit), but often ignored in formal epistemology puzzles.

  **2. The Adversarial Preface**
  *   **Analysis:** You use this to argue against stake-sensitivity.
  *   **Verdict:** This case exposes a conflict between **Requirement 1 (Actionability)** and **Requirement 6 (Stability)**.
      *   If acceptance is *purely epistemic* (Stability), the author should not change her mind.
      *   If acceptance is *certification* (Actionability), the reviewer's offer changes the cost of error ($C$). In a decision-theoretic model, Expected Utility = $P \times Benefit - (1-P) \times Cost$. If Cost spikes, you stop asserting, even if $P$ is high.
  *   **Critique of your framing:** You say, "nothing about her evidence has changed, which strikes me as a reason to doubt that stakes-sensitivity is a genuine desideratum." **This is doing unearned argumentative work.** It assumes Acceptance = Belief. If Acceptance = *Warranted Assertion*, stakes *must* matter. A doctor has the same evidence for a diagnosis at 9 AM and 9 PM, but if the stakes of being wrong rise (e.g., surgery scheduled), she should not *assert* the diagnosis without more tests.
      *   *Correction:* The desideratum shouldn't be "Stake-Insensitivity." It should be **"Separation of Evidence and Threshold."** Evidence determines probability; Stakes determine the threshold $t$ required for acceptance. Your case supports this separation, not the insensitivity of the whole process.

  **3. The Audited Lottery**
  *   **Analysis:** This tests the Evidence/Probability Distinction.
  *   **Verdict:** Yes, being able to convert a statistical item into an individually checked item **changes what should be accepted**, even if the error rate is identical.
  *   **Why:** This breaks the symmetry required for the Lottery Paradox. The paradox relies on the tickets being *epistemically indistinguishable*. Once Ticket #1 is audited, it is distinguishable from Ticket #2.
  *   **Implication:** This supports **Requirement 4**. A theory that treats all tickets as symmetric (pure Probabilism) fails here. A theory based on *Normic Support* (where evidence supports $P$ by ruling out abnormal worlds) passes, because an audit rules out the abnormal world where *this* ticket wins, whereas statistics only rule out worlds where *most* tickets win.
  *   **Critique:** This case is robust. It aligns with the "Gatecrasher Paradox" in legal epistemology (Smith). It is not confused.

  ---

  ### Part 4: Strategic Scorecard

  Here is how the main theoretical strategies score against your Institutional Specification.

  | Strategy | Description | Score against Spec | Fatal Flaw in this Context |
  | :--- | :--- | :--- | :--- |
  | **Lockean Threshold** | Accept if $P > t$. | **Fail** | Fails **Global Integrity**. In complex systems (Regulator), local thresholds guarantee global failure. It cannot handle the Preface/Regulator conjunction without inconsistency. |
  | **Contextualism** | Threshold $t$ shifts with context/conversation. | **Mixed** | Handles **Adversarial Preface** well (stakes raise $t$). Fails **Traceability**. If $t$ shifts invisibly, the audit trail is broken. Hard to institutionalize "context" in a written standard. |
  | **Restricting Closure** | Accept $P$, Accept $Q$, but do not accept $P \land Q$. (Kyburg) | **Fail** | Violates **Actionability** for institutions. A regulator cannot issue a permit that says "A is safe, B is safe, but A+B might explode." |
  | **Decision-Theoretic / Risk Budget** | Acceptance is maximizing expected utility over the *whole system*, not claim-by-claim. | **Pass** | Satisfies **Global Integrity** and **Actionability**. Requires abandoning the idea that individual claims have independent "acceptance" statuses. Acceptance becomes a property of the *report*, not the *sentences*. |
  | **Normic Support / Evidence** | Accept if evidence rules out abnormal failure modes (not just high prob). | **Pass** | Handles **Audited Lottery** and **Evidence Distinction**. Struggles with **Global Integrity** unless combined with a risk budget. |

  ### Recommendation for the Reading Group

  Your intuition that the disagreement is "upstream" is correct. You are trying to apply norms designed for **individual belief preservation** to **institutional risk management**.

  1.  **Adopt the "Risk Budget" Model:** For the Regulator/Standards cases, abandon the idea that you "accept" sub-claims individually. You allocate a "probability of failure budget" across the sub-claims. You don't accept "Component A is safe"; you accept "Component A contributes less than $x$ risk." This dissolves the Preface/Lottery tension by making the Conjunction the *only* object of acceptance.
  2.  **Separate Evidence from Threshold:** Accept the lesson of the **Adversarial Preface**. Evidence fixes the probability; Institutional Stakes fix the threshold. Do not demand "Stake-Insensitivity" for acceptance, only for the *evaluation of the evidence*.
  3.  **Discard "Belief":** Stop asking what the certifier *believes*. Ask what the institution is *warranted to assert*. This licenses the distinction between the Distributed Preface contributors (who believe) and the Editor (who asserts).

  **Final Epistemic Note:** The "Risk Budget" approach is standard in engineering (ISO 26262 for automotive safety) but rare in formal epistemology. If your group wants to solve the *philosophical* puzzle, stick to Lockean/Contextualist debates. If you want to solve the *institutional* puzzle (as you specified), you must import decision theory and systems engineering norms, which effectively dissolves the traditional paradoxes by changing the ontology of "acceptance."
