          *   *Status:* Uncontroversial for this specific framing (institutional), though contested in pure epistemology (purism vs. pragmatism).
      *   *Requirement 2: Aggregation Stability.* If an institution accepts $P$ and accepts $Q$, it must be able to accept $P \land Q$ *for the purpose of the final output*, even if internal sub-units don't believe the conjunction. (This targets the Preface/Regulator case).
