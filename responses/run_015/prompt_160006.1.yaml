answer: |-
  Start by rejecting your proposed case of the mid-REM waking versus the post-REM waking because it quietly begs the question against Malcolm. If you present a student waking up mid-REM and reporting a dream, your students will treat that report as a transparent window into a conscious experience that was happening seconds prior. Malcolm's entire point is that the report does not describe a prior experience but constitutes the criterion for saying a dream occurred. Using a case where the report is immediate and vivid reinforces the intuition Malcolm is trying to dismantle, which is that dreaming is a private show happening in the head. You need a case that drives a wedge between the physiological state and the report to force them to choose which one defines the dream. Replace your case with the Forgotten Dream mismatch. Describe a subject who shows perfect REM physiology all night but wakes up and says I dreamt nothing, versus a subject with no REM who wakes up and describes a vivid dream. This forces the class to decide whether the dream was the brain state they missed or the story they told. This case carries the session because every theoretical move can be tested against it. If dreaming is the brain state, the REM subject dreamt. If dreaming is the report, the non-REM subject dreamt. If dreaming is the experience, we have no idea. This keeps the tension alive for forty minutes.

  Your sequence needs to follow the logic of criteria before evidence. Spend the first five minutes surfacing the default intuition that REM equals consciousness. Let the sleep-science students speak here. Then immediately introduce the Forgotten Dream mismatch. Do not let them resolve it yet. Ask them whether the REM subject dreamt. Most will say yes, the brain was active. This is the moment to head off the misconception that REM data obviously settles it. You must stop them here and say that Malcolm agrees the brain was active but denies that this activity counts as dreaming without the report. If you wait until later to clarify this, they will spend twenty minutes arguing neuroscience against a philosopher who says neuroscience is irrelevant to the concept. Once you have established that there is a conflict between the physical evidence and the verbal criterion, introduce Malcolm. Spend minutes ten through twenty on his view. Here you must head off two misconceptions simultaneously. The first is that Malcolm is a skeptic about his own dreams. Students will think he is saying we never know if we dreamt. Correct this by saying he knows he dreamt when he wakes and says so, but he denies that the word refers to a hidden episode during sleep. The second is that this is Descartes demon skepticism. Clarify that Descartes worries about whether the external world is real, while Malcolm worries about whether the grammar of dream talk makes sense. If you do not separate Malcolm from Descartes here, they will treat the whole section as an epistemology seminar rather than philosophy of mind.

  Move to Dennett from minutes twenty to thirty. Use the Forgotten Dream case again. Ask what Dennett says about the REM subject who reports nothing. Dennett says there was no dream because there was no disposition to report. This is where you must head off the misconception that Dennett is saying dreamers invent things on purpose or lie. Students will hear the tape recorded at waking idea and think he means we fabricate stories to please the experimenter. You need to emphasize that for Dennett the construction is unconscious and instantaneous. The experience is not recalled; it is created at the moment of reporting. This is harder for them to grasp than Malcolm, so keep it tied to the case. The REM subject had no dream because the brain did not complete the narrative construction before waking. This leads you to the question of the water and H2O analogy your friend suggested. Do not use this analogy to clarify the disagreement. It buries the dispute. The analogy suggests that dreaming is a natural kind like water that science can identify with a neural state. Malcolm denies dreaming is a natural kind at all. He says it is a concept tied to human behavior and reporting. If you introduce the analogy as a solution, students will think Malcolm is just waiting for better science. Use the analogy only at the very end as a test. Ask them if dreaming is like water. If they say yes, they have sided with a type-identity theory that Malcolm explicitly rejects and Dennett complicates. It belongs in the last five minutes only to show what both authors are arguing against.

  Your closing question at minute thirty-five must separate those who think Malcolm denies experience from those who understand he denies the coherence of the claim. Do not ask if Malcolm thinks we dream. Ask them this. If we built a machine that could translate brain waves into text and printed out a dream story while the subject was still asleep would Malcolm say the subject was dreaming before they woke up. If they say yes they have missed Malcolm. They are treating the machine output as evidence of a hidden experience. Malcolm would say the machine is just producing behavior and the subject is still asleep. The dream only exists when the subject wakes and endorses the report. This question works because it removes the subject's own testimony and replaces it with mechanical testimony. If they understand Malcolm they will see that even mechanical testimony does not prove a prior conscious episode. It shows they grasp that the debate is about what counts as evidence for experience not whether experience happens.

  There are two things you must refuse to go into. First do not let them discuss the neuroscience of REM in detail. If they start arguing about pons activity or acetylcholine levels stop them. Remind them that Malcolm's argument is conceptual. He is willing to concede all the neuroscience and still win his point. If you let them debate the science you validate the idea that science can solve this philosophy problem. Second do not let them drift into general skepticism about memory. This is not about whether memory is reliable. It is about whether the concept of dreaming requires memory. If they start arguing about false memories in general pull them back to the specific case of dream reports.

  I need to flag two uncertainties in this plan regarding the readings. First Dennett's view evolved between his 1976 paper Are Dreams Experiences and his 1991 book Consciousness Explained. The tape recorded at waking analogy is more prominent in the later work. Your students might have the later version in mind. If they press you on whether Dennett thinks there is any phenomenology at all you should check which text your syllabus assigned. Second Malcolm is often read as a strict behaviorist but some scholars argue he allows for a weaker notion of experience. If a student reads a passage where Malcolm seems to concede something about inner states do not override it. Acknowledge that his view is nuanced but stick to the strong reading for the sake of the discussion. These flags matter because if you present Dennett as a pure eliminativist when he is actually a functionalist you might confuse the students when they read the text later. Stick to the criterion argument for Malcolm and the construction argument for Dennett and you will be safe.
