answer: |-
  This is a sharp setup. You've identified the leverage point in the philosophy of history: the *contrast class* determines the *causal field*. Change $Q$, and you change which variables count as signal and which count as noise.

  As a physicist, you know that boundary conditions dictate the solution space. In history, $Q$ sets the boundary conditions. If you treat $Q$ loosely, you get garbage outputs. Your "Shared-Aim Assumption" is the historical equivalent of checking whether your control group is actually subject to the same forces as your experimental group.

  Here is the disciplined mapping you asked for, treating your historical premises as fixed inputs.

  ### 1. The Mapping

  **Case P (Fact):** US Manned Lunar Landing, July 1969.

  #### $Q_1$: The USSR (Why US 1969 rather than USSR?)
  *Implicit Assumption:* Both states were competing for the same trophy.

  | Candidate Difference-Maker | Mechanism | Confidence / Stake |
  | :--- | :--- | :--- |
  | **Political Commitment Density** | US had a singular, public, deadline-driven mandate (Kennedy 1961). USSR had ambivalent, shifting directives until 1964-65. | **High.** I'd stake money here. This is the primary order parameter. |
  | **Organizational Topology** | NASA was a centralized hierarchy with massive budget authority. Soviet program was fragmented across rival OKBs (Korolev vs. Chelomei vs. Glushko). | **High.** This is the structural amplifier of the political will. |
  | **Economic Headroom** | US GDP $\approx$ 2-3x USSR GDP; Apollo peaked at $\sim$4% federal budget. USSR had to balance guns, butter, and space with a smaller base. | **Medium.** Resources matter, but the USSR spent heavily on space elsewhere. This explains *sustainability*, not necessarily the '69 specific. |
  | **Technical Architecture (N1 vs. Saturn)** | Saturn V (proven stages, F-1 engines). N1 (30 engines, cluster complexity, insufficient ground testing). | **Medium-High.** Engineering reality bites eventually, but N1 might have worked with more iterations (time). |
  | **Leadership Continuity** | Webb/Mueller stability vs. Korolev's death (1966) and subsequent infighting. | **Medium.** Contingent, but death is a valid causal variable. |

  #### $Q_2$: The US, but 1979/1981 (Why 1969 rather than a decade later?)
  *Implicit Assumption:* The US capability existed, but the timing was contingent.

  | Candidate Difference-Maker | Mechanism | Confidence / Stake |
  | :--- | :--- | :--- |
  | **Geopolitical Urgency** | Cold War peak (post-Sputnik/Gagarin shock) vs. Détente/Vietnam fatigue. The "enemy" drove the schedule. | **High.** Without the Soviet scare, the budget vanishes. |
  | **Budgetary Window** | 1960s economic growth + willingness to tax vs. 1970s stagflation + taxpayer revolt. | **High.** The fiscal capacity to absorb Apollo-sized burns was unique to that decade. |
  | **Risk Tolerance** | 1960s "push the envelope" culture vs. post-1970s safety/regulatory culture (precursor to Challenger mindset). | **Medium.** Hard to quantify, but the appetite for 3% failure rates dropped. |
  | **Technological Momentum** | Mercury/Gemini pipeline was hot. A 10-year delay risks brain drain and tech stagnation (see Skylab). | **Medium.** Momentum is real but recoverable. |

  #### $Q_3$: Nobody, Ever (Why a landing at all rather than none?)
  *Implicit Assumption:* Manned spaceflight is not an inevitable technological progression.

  | Candidate Difference-Maker | Mechanism | Confidence / Stake |
  | :--- | :--- | :--- |
  | **Existence of ICBMs** | Rocket tech existed solely because of nuclear delivery requirements, not science. | **Very High.** No nukes = no heavy lift. This is the necessary condition. |
  | **Bipolar Hegemony** | Two superpowers needing non-kinetic projection of power. Multipolar or unipolar worlds might not prioritize this specific spectacle. | **High.** The "race" requires a rival. |
  | **Human vs. Robotic Valuation** | 1960s cultural preference for "man conquering nature" vs. modern preference for robotic efficiency. | **Medium.** This is cultural teleology. |

  ---

  ### 2. Aggregation and Survival

  You asked which difference-makers survive the switch in $Q$, and whether they aggregate.

  **Survival:**
  *   **ICBM Base ($Q_3$):** Survives all three. It is a background condition for P itself.
  *   **Organizational Topology ($Q_1$):** Survives $Q_2$ (NASA structure remained), vanishes in $Q_3$ (irrelevant if no one goes).
  *   **Political Commitment ($Q_1$):** *Transforms* in $Q_2$. In $Q_1$, it's "US vs. Them." In $Q_2$, it's "Now vs. Later." It vanishes in $Q_3$.
  *   **Economic Headroom ($Q_1$):** Survives $Q_2$ (US economy still bigger than USSR), irrelevant in $Q_3$.

  **Aggregation Failure:**
  You cannot simply sum these lists to get "The Story of Apollo." The variables are **non-linear and coupled**.
  *   *Example:* The **Organizational Topology** (NASA) was created *by* the **Geopolitical Urgency** ($Q_2$ factor). You can't treat them as independent causes.
  *   *Example:* The **Technical Architecture** (Saturn V) was chosen *because* of the **Political Commitment Density** (LOR was risky but fast; direct ascent was safer but slower).
  *   *Example:* The **Economic Headroom** only mattered because the **Political Will** existed to tax it.

  If you try to aggregate, you commit the fallacy of treating systemic feedback loops as independent linear inputs. The "Story" isn't $A + B + C$; it's a phase transition where $A$ triggers $B$ which locks in $C$.

  ---

  ### 3. The Shared-Aim Assumption and the Needham Parallel

  This is your core hunch: *Contrastive questions collapse if the contrast case wasn't actually trying to achieve P.*

  **Is the hunch right?**
  Yes, but with a nuance. In the Moon Race, the collapse is partial.
  *   **The Collapse:** When you ask "Why US and not USSR?", you imply a symmetric race. If the USSR did not formally approve a manned landing program until the mid-60s (after Kennedy), then for the critical period (1961-1964), $Q$ (USSR) was not actually in the set of "entities trying to land men."
  *   **The Result:** The explanation for "Why US not USSR" shifts from *capability* (engines, money) to *intent* (political will). If the USSR wasn't trying, their failure to land is trivial. It's like asking "Why did the sprinter win rather than the spectator?"
  *   **The Nuance:** The USSR *was* trying to beat the US in *space prestige* (Sputnik, Gagarin). They just didn't select "Manned Landing" as the specific metric until too late. So the question becomes: "Why did the US select Landing as the metric while the USSR selected Firsts/Robotics?" That is a valid question, but it's about **goal selection**, not **goal achievement**.

  **The Needham / Great Divergence Parallel:**
  You asked if the parallel is bogus. It is **structurally sound** but **teleologically dangerous**.
  *   **The Parallel:** "Why Britain industrialized and not China" assumes China *wanted* or *was poised* to industrialize in the 18th century. If China's economic structure was in a high-level equilibrium trap (Elvin) or simply had different aims (stability over growth), then the contrast class is flawed.
  *   **Where it Breaks:** In the Moon Race, we have documentary evidence of the Soviet Politburo's indecision. We know they hesitated. In the Great Divergence, we are inferring the "aim" of a civilization centuries later.
  *   **The Trap:** Both questions suffer from **retrospective teleology**. We know the Moon Landing and Industrialization were "winning" moves. We assume all rational actors were trying to make them. If the USSR viewed robotics as a higher ROI (which they did, successfully), then "Why not USSR?" is a biased question. It assumes Manned Landing was the *only* valid victory condition.
  *   **Verdict:** Your hunch is correct. A significant chunk of "Why not USSR" collapses into "They optimized for a different utility function." If $Q$ optimizes for $U_{robotics}$ and $P$ optimizes for $U_{prestige\_landing}$, explaining why $P \neq Q$ is trivial.

  ### 4. Trust in Contrastive Explanation

  Does this case leave me trusting the tool more or less?

  **More Trust, but with Stricter Controls.**
  Contrastive explanation is the only way to avoid "just-so" stories. Without $Q$, you just list facts about Apollo. With $Q$, you are forced to identify *difference-makers*.
  *   **Where it is Silent:** It is silent on **systemic inevitability**. If $P$ and $Q$ are both subject to the same deep structural force (e.g., "Technological Determinism"), contrastive explanation can't see it because it cancels out in the subtraction. It explains *divergence*, not *convergence* or *drift*.
  *   **Where it is Hard to Apply:** When the contrast class is **counter-normative**. $Q_3$ ("Nobody") is hard because "Nobody" isn't an agent. You have to construct a hypothetical agent or a structural barrier.
  *   **The Physicist's Take:** Think of it like a differential measurement. You are measuring $\Delta = P - Q$. If your instrument (the historical record) has high noise on $Q$ (e.g., Soviet internal decision making), your $\Delta$ has high error bars.
      *   In $Q_1$ (USSR), the error bars on Soviet intent are wide (secret archives, denial).
      *   In $Q_2$ (US Later), the error bars are narrow (we have the US records).
      *   Therefore, explanations for $Q_2$ are epistemologically more secure than $Q_1$, even if $Q_1$ is more popular.

  **Final Diagnosis:**
  Your "Shared-Aim Assumption" is the critical control variable. If you cannot establish that $Q$ was attempting $P$ (or a functional equivalent), the question "Why $P$ rather than $Q$?" is ill-posed. It conflates *failure to achieve* with *choice not to pursue*.

  In the Moon Race, the "Why US not USSR" narrative often conflates the two. The US succeeded in a specific mission profile. The USSR succeeded in a different mix of mission profiles (robotics, stations). The contrastive question only holds if you define the "Race" as "Manned Landing." If you define it as "Space Dominance," the answer changes entirely.

  The tool works, but only if you define the contrast class with the precision of a boundary condition. If $Q$ is fuzzy, the physics of the explanation dissolves.
