prompt: |-
  I run a little monthly reading group — three of us, plus whoever wanders in — and two members have now spent something like a year and a half going round in circles about weakness of will, so I want to force them into an adversarial collaboration and I need the document they should have written by now. One of them (the "temporal" one) thinks the whole topic is basically mislabelled preference reversal: what we call akrasia is a smaller-sooner reward crossing over a larger-later one as it looms, which is exactly what you'd expect from a discount curve with a present-bias parameter, so the only remaining questions are which time-slice's ranking is the normative one and what commitment devices are actually available. The other (the "agential" one) thinks that's a bait and switch: on her view the phenomenon that matters is synchronic — at the very moment of acting the agent still judges A better and does B — and a discounting story can't get any grip there, because it needs the judgment itself to have flipped, and in the case she cares about it definately hasn't. I suspect part of their dispute is verbal (whether "weakness of will" names a diachronic or a synchronic thing, whether it's even one phenomenon, whether "self-control" or "willpower" tracks anything unified) and part of it is real, and I want the document to say which is which.

  What I want from you: something both could put their names on. Start with a numbered section of agreed claims — about what the ordinary phenomenon is, including the folk vocabulary of willpower and resolve; about what a hyperbolic / present-bias model does and doesn't explain; about how much the lab work on delay discounting is even evidence about this rather than about a nearby but different thing; about whether the multiple-selves and commitment-device way of talking settles anything normative or just relocates it. Then a disagreements table: each row one disputed claim, with the temporal side's formulation and the agential side's formulation, each phrased so its own side would accept the wording as fair rather than as a strawman, plus a note on whether the row is substantive or only about words. Then the cruxes — the sub-questions such that settling one would move at least one of them — and for each crux a concrete case, argument, or experiment both would agree bears on it, with each side's prediction written down in advance.

  Two things to build in. First, a case my group hatched that neither of their accounts handles cleanly and that I think is a genuine crux: the agent hasn't changed her judgment, hasn't revised or abandoned her intention, and isn't pulled by anything temporally nearer — she just doesn't start. She sits there, still wanting to do the thing she decided to do, correctly believing she should do it now, and the action doesn't get initiated; when it finally happens it's after some irrelevant trigger, like someone walking into the room. We started calling it stuck akrasia. Second, I'd like at least one crux to be an empirical one you design yourself — I was thinking of experience sampling during real temptation episodes, with people reporting in real time both what they're doing and their current all-things-considered judgment, plus a condition where the tempting option isn't sooner at all, just more available or more cue-salient (both options starting at the same moment) — but use a better design if you've got one, and say what each of them should predict about it and what result would genuinely surprise them.

  Don't adjudicate — the point is that both names could go on it, not that one of them wins. At the end add a short drafter's note: say how confident you are that each side would really sign its own row, and single out the one formulation you're least sure about, the one you think somebody would bounce straight back at you.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A small monthly reading group (3 regulars + guests). Two members have been debating weakness of will (akrasia) for 1.5 years.
      *   **The Parties:**
          *   "Temporal" (T): Views akrasia as preference reversal due to hyperbolic discounting/present bias (diachronic conflict). Focus on commitment devices and normative status of time-slices.
          *   "Agential" (A): Views akrasia as synchronic conflict (judging A better *at the moment* but doing B). Discounting stories fail because the judgment doesn't flip.
      *   **The Goal:** A document both could sign ("Adversarial Collaboration Protocol"). It needs to identify agreed claims, map disagreements (substantive vs. verbal), and identify cruxes (with tests/cases).
      *   **Specific Requirements:**
          1.  Numbered section of Agreed Claims (folk vocabulary, model limits, lab evidence, normative status).
          2.  Disagreements Table (Claim, T formulation, A formulation, Substantive/Verbal).
          3.  Cruxes (Sub-questions, Concrete Case/Experiment, Predictions).
          4.  **Mandatory Inclusion 1:** "Stuck Akrasia" case (no judgment change, no temporal pull, just failure to initiate until external trigger).
          5.  **Mandatory Inclusion 2:** A new empirical crux (Experience Sampling/Real-time judgment vs. action, controlling for temporal proximity).
          6.  **Constraint:** Do not adjudicate. Both names must be able to go on it.
          7.  **Ending:** Drafter's Note (confidence levels, one formulation likely to be rejected).

  2.  **Deconstruct the Philosophical Positions:**
      *   *Temporal (T):* Aligns with Ainslie, Thaler, behavioral econ. Akrasia = intertemporal choice failure. The "self" at $t_1$ wants $X$, the "self" at $t_2$ wants $Y$. The problem is coordination between time-slices.
      *   *Agential (A):* Aligns with Davidson, Stroud, maybe Holton. Akrasia = acting against one's *current* best judgment. If the judgment flips to match the action, it's just a change of mind, not weakness of will. The "will" is a capacity to stick to judgment despite contrary desire.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need common ground. Both agree "weakness of will" is a real *something*. Both agree standard discounting explains *some* behavior. Both agree lab work has limits. Both agree commitment devices don't solve normativity.
      *   *Drafting thought:* Keep it neutral. Acknowledge the folk concept is messy. Acknowledge hyperbolic discounting is a good model for *preference reversal* but maybe not *all* akrasia. Acknowledge that calling time-slices "selves" is metaphorical unless proven otherwise.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to phrase things charitably.
      *   *Row 1: Definition.* T: Akrasia is primarily diachronic inconsistency. A: Akrasia is primarily synchronic inconsistency. (Substantive/Verbal mix).
      *   *Row 2: The Judgment.* T: Judgment often tracks the discounted value (so it flips). A: Judgment stays fixed on the better option (so it doesn't flip). (Substantive).
      *   *Row 3: Explanation.* T: Mechanism is valuation drift over time. A: Mechanism is failure of executive control/volition. (Substantive).
      *   *Row 4: Normativity.* T: Normative question is which self wins. A: Normative question is whether the agent upheld their agency. (Substantive).

  5.  **Drafting - Section 3: Cruxes:**
      *   *Crux 1: The "Stuck Akrasia" Case (Required).*
          *   Scenario: Agent intends X, judges X best, no competing Y offer, just inertia. Triggered by external event.
          *   T Prediction: This isn't akrasia; it's aboulia or executive dysfunction. Or, there *was* a micro-preference shift to "rest" that was hidden.
          *   A Prediction: This is pure akrasia (failure of will without competing desire). Or, this shows the limits of the discounting model.
          *   *Refinement:* T will try to explain it away as a preference for "not acting now." A will claim it proves action isn't just output of highest value.
      *   *Crux 2: The Empirical Design (Required).*
          *   Design: Real-time ESM (Experience Sampling Method). Temptation vs. Duty. Manipulate *salience/availability* rather than *delay*. Both options available *now*.
          *   T Prediction: If delay is equal, choice tracks relative subjective value. If choice deviates, value must have shifted (hidden discounting of effort?).
          *   A Prediction: Agents will report "Duty is better" *at the moment of choosing Temptation*.
          *   *Surprise:* If T finds judgment *never* flips, their model breaks. If A finds judgment *always* flips to match action, her phenomenon vanishes.
      *   *Crux 3: Commitment Devices.*
          *   Scenario: Ulysses contract.
          *   T: Rational strategy for time-inconsistent agents.
          *   A: Evidence that the agent acknowledges a capacity for synchronic failure.

  6.  **Drafting - Drafter's Note:**
      *   Need to assess plausibility of signing.
      *   Most risky formulation: Probably the definition of "judgment" in the Agential column. Temporalists often argue that if you choose it, you *must* have judged it better (or at least wanted it more), so "judgment" is being defined question-beggingly by the Agentialist. I need to flag that.

  7.  **Review and Refine:**
      *   *Tone:* Academic but accessible (reading group level). Precise.
      *   *Check Constraints:* Did I include "Stuck Akrasia"? Yes. Did I include the empirical design? Yes. Is it neutral? Yes.
      *   *Self-Correction on "Stuck Akrasia":* Make sure T doesn't just dismiss it. T needs to offer a *prediction* about how their model interprets it, not just "that's not the phenomenon." T might say "That's a failure of initiation, not valuation." A might say "That's the will failing."
      *   *Self-Correction on Empirical Design:* Ensure the "surprise" condition is clear. If the data shows perfect correlation between judgment and action, A loses. If data shows perfect dissociation, T loses.
      *   *Refining the Disagreements:* Ensure the "Verbal vs. Substantive" column is nuanced. Some might be "Verbal framing of substantive issue."

  8.  **Final Polish:** Check the voice. It should sound like a document written by a neutral third party (the user) but structured for the two debaters. Actually, the prompt asks *me* to write the document they *should have written*. So it's a protocol document.

      *Wait, one nuance:* The prompt asks for "something both could put their names on." This implies the *content* must be agreeable. The Disagreements Table must accurately reflect their disagreement without bias. The Cruxes must be things they agree *would* settle things.

      *Let's check the "Stuck Akrasia" handling:*
      T view: Likely "This is aboulia, not akrasia, OR there is a hidden cost of effort being discounted."
      A view: "This is the core case. Will is required to bridge judgment to action."
      *Crux:* Is "Stuck Akrasia" a subtype of weakness of will or a different category?
      *Decision:* Frame it as a test case for the *necessity* of competing desire.

      *Let's check the Empirical Design:*
      Design: "Simultaneous Availability Protocol."
      T Prediction: Reported judgment will align with choice (post-hoc rationalization or real-time shift).
      A Prediction: Reported judgment will contradict choice at $t_0$.
      *Surprise:* If physiological arousal (craving) predicts choice better than reported judgment.

      *Drafter's Note:* Be honest about the "Judgment" definition. That's the usual sticking point.

  9.  **Final Output Generation** (incorporating all above thoughts into the structured response).
answer: |-
  # PROTOCOL FOR ADVERSARIAL COLLABORATION: THE AKRASIA DISPUTE
  **Draft Version 1.0**  
  **Parties:** "Temporal" (T) / "Agential" (A)  
  **Facilitator:** [Reading Group Host]  
  **Date:** October 2023

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both signatories as the baseline for this collaboration. Disagreement regarding these claims voids the protocol.*

  1.  **Folk Phenomenology:** The ordinary concept of "weakness of will" (akrasia) involves a cluster of features: (a) an agent forms an intention or makes an all-things-considered judgment that $A$ is best; (b) the agent voluntarily performs $B$ instead; (c) the agent experiences this as a failure of self-governance. Both parties agree that any theory must account for why this cluster feels unified to the folk, even if it fractures under analysis.
  2.  **Limits of Discounting Models:** Hyperbolic discounting and present-bias parameters successfully model *preference reversal over time* (diachronic inconsistency). Both parties agree that these models explain why an agent might plan to diet on Monday and eat cake on Tuesday. However, both parties agree that a discount curve alone does not explain the *phenomenology of regret* or the specific normative force of "willpower" unless supplemented by an account of agency.
  3.  **Lab Evidence Scope:** Standard delay-discounting tasks (e.g., "$50 now vs. $100 in a month") measure *choice behavior* under temporal pressure, not necessarily *judgment reversal*. Both parties agree that inferring an agent's normative judgment solely from their choice in these tasks commits the revealed preference fallacy if the goal is to understand akrasia as acting against one's better judgment.
  4.  **Commitment Devices:** Pre-commitment strategies (e.g., Ulysses contracts, blocking software) are effective behavioral interventions for reducing unwanted actions. Both parties agree that the *availability* of commitment devices does not settle the *normative* question of whether the agent was irrational at the moment of action, nor does it resolve whether the agent is one unified self or a sequence of time-slices.
  5.  **Terminological Neutrality:** The term "self" when applied to time-slices (e.g., "the future self") is treated as a theoretical metaphor by both parties until further notice. Neither side assumes personal fission or fusion as a metaphysical premise for this collaboration.

  ## 2. DISAGREEMENTS TABLE
  *Each row isolates a specific point of divergence. Formulations are charitably phrased to ensure each signatory recognizes their own view.*

  | # | Disputed Claim | Temporal (T) Formulation | Agential (A) Formulation | Nature of Dispute |
  | :--- | :--- | :--- | :--- | :--- |
  | **2.1** | **The Locus of Conflict** | Akrasia is fundamentally a **diachronic** coordination failure between time-slices with different utility functions. The "conflict" is between $Self_{t1}$ and $Self_{t2}$. | Akrasia is fundamentally a **synchronic** failure of executive control. The "conflict" is between Judgment and Desire within $Self_{t0}$. | **Substantive** (Ontological location of the failure) |
  | **2.2** | **Status of Judgment at $t_{action}$** | At the moment of action, the agent's evaluative ranking typically **flips** to align with the tempting option (driven by proximity/salience). If it doesn't flip, it isn't standard akrasia. | At the moment of action, the agent's all-things-considered judgment **remains fixed** on the better option. If it flips, it is merely a change of mind, not weakness of will. | **Substantive** (Empirical claim about mental states) |
  | **2.3** | **Role of "Willpower"** | "Willpower" is a folk label for employing **costly commitment strategies** or cognitive reappraisal to alter future discount curves. It tracks resource allocation, not a distinct faculty. | "Willpower" tracks a distinct **capacity to act on judgment** despite contrary motivational force. It is a sui generis executive function, not just strategic pre-commitment. | **Verbal/Substantive Hybrid** (Does the term track a unified capacity?) |
  | **2.4** | **The "Stuck" Case** | Cases where an agent fails to initiate action without a competing desire are **aboulia** or executive dysfunction, distinct from akrasia. Akrasia requires a positive pull toward $B$. | Cases where an agent fails to initiate action despite judging it best are the **purest form** of akrasia. They prove action is not the automatic output of highest value. | **Substantive** (Categorization of the phenomenon) |

  ## 3. CRUXES AND TEST CASES
  *Settling these questions would force at least one party to revise their core model. Both parties agree to accept the outcomes defined below.*

  ### Crux 1: The "Stuck Akrasia" Case (Initiation Failure)
  **The Case:** An agent sits at a desk. She judges she should write ($A$). She judges she should not watch TV ($B$). She does not watch TV. She also does not write. She reports no competing desire to rest, no fear of failure, and no change in judgment. She simply does not move. After 45 minutes, a friend walks in (external trigger), and she immediately begins writing.
  **The Question:** Is this a instance of weakness of will?

  *   **T Prediction:** This is **not akrasia**. It is a failure of initiation mechanics (aboulia) or a hidden, unreported preference for "delaying effort" which was discounted until the social cost of the friend arriving shifted the value.
      *   *Falsification Condition:* If it is demonstrated that no value shift occurred (even hidden effort-costing) and the agent still categorizes this as "I failed to exercise my will," T must concede that akrasia can exist without preference reversal.
  *   **A Prediction:** This **is akrasia** (specifically, volitional failure). It demonstrates that judgment does not causally necessitate action without an act of will. The external trigger supplied the "push" the will failed to generate.
      *   *Falsification Condition:* If it is demonstrated that the agent *did* have a latent preference for "waiting for a cue" that outweighed writing, A must concede this is strategic delay, not volitional failure.

  ### Crux 2: Empirical Design — The Simultaneous Salience Protocol
  **Design:** Experience Sampling Method (ESM) via smartphone app over 14 days.
  *   **Trigger:** Random alerts + self-reported temptation alerts.
  *   **Condition:** Participants report on situations where two options are **temporally simultaneous** (e.g., "Study now" vs. "Scroll phone now"). Both are available immediately.
  *   **Manipulation:** In half the trials, the tempting option is made **more salient** (phone buzzes/visible) while the dutiful option remains static. In the other half, both are equally salient.
  *   **Data Points:** (1) Real-time All-Things-Considered Judgment ("Which is better *right now*?"); (2) Choice made; (3) Confidence in judgment.

  *   **T Prediction:** In the High Salience condition, **Judgment will shift** to align with the Tempting Option *before* the choice is made. The "pull" of salience works by altering the subjective value ranking in real-time. Choice will correlate with reported Judgment > 90% of the time.
      *   *Result that would surprise T:* If participants consistently report "Studying is better *right now*" (Judgment) while choosing to Scroll (Action) in the High Salience condition, specifically citing "I couldn't make myself do the better thing."
  *   **A Prediction:** In the High Salience condition, **Judgment will remain fixed** on the Dutiful Option, but Choice will diverge toward the Tempting Option. Salience affects *motivation*, not *evaluation*.
      *   *Result that would surprise A:* If Judgment tracks Choice perfectly (i.e., whenever they Scroll, they report "Scrolling is better right now"). This would suggest the "better judgment" is a post-hoc confabulation or that akrasia (as defined by synchronic conflict) does not exist in real-time.

  ### Crux 3: The Normativity of Commitment
  **The Case:** An agent uses a software blocker to prevent access to social media during work hours. She expresses relief and satisfaction *during* the blocked period.
  **The Question:** Does this satisfaction vindicate the $Self_{t-1}$ (planner) over the $Self_{t0}$ (actor)?

  *   **T Prediction:** Yes. The satisfaction confirms that the $Self_{t0}$ would have acted against the $Self_{t-1}$'s interests due to discounting. The blocker aligns the time-slices. The normative authority lies with the long-term preference structure.
  *   **A Prediction:** Not necessarily. The satisfaction confirms the agent successfully exercised **agency** by binding themselves. The normative authority lies with the capacity to bind oneself, not the specific preference content. If the agent had successfully used *willpower* instead of software, the normative outcome would be *higher* (virtue), even if the behavioral outcome is identical.
  *   **Settling Condition:** A thought experiment consensus. If the agent *could* have used willpower but chose the blocker for ease, does this diminish the moral/prudential worth of the action?
      *   T says: No (Outcome matters).
      *   A says: Yes (Exercise of capacity matters).
      *   *Agreement:* We agree to treat this as a fundamental normative divergence that cannot be empirically settled, but must be acknowledged as a fork in the road for policy recommendations.

  ## 4. DRAFTER'S NOTE

  **Confidence Assessment:**
  I am 85% confident the **Temporal** side will sign the "Agreed Claims" and their rows in the Disagreements Table. Their model is well-standardized in behavioral economics, and the formulations here allow them to treat "judgment" as a value signal that is permitted to fluctuate.

  I am 70% confident the **Agential** side will sign. The risk lies in **Disagreement Row 2.2 (Status of Judgment at $t_{action}$)**.
  *   **The Risk:** The formulation states: *"At the moment of action, the agent's all-things-considered judgment remains fixed on the better option."*
  *   **Why they might bounce:** A sophisticated Temporalist might argue this is question-begging. They may insist that if the agent *chose* $B$, then by definition their "all-things-considered judgment" (cash value) *must* have shifted to $B$, and that the Agentialist is smuggling in a distinction between "judgment" and "motivation" that doesn't exist in a naturalistic worldview.
  *   **Mitigation:** I have phrased it as a phenomenological claim ("the agent... judges") rather than a metaphysical claim about value. If the Agentialist insists that "judgment" is a distinct cognitive state from "desire," they should accept this. If they define judgment *as* the outcome of the motivational struggle, they will reject it. This is the most likely point of failure for the collaboration.

  **Recommendation:**
  Begin with **Crux 2 (The Empirical Design)**. It is the only element that generates new data rather than recycling old arguments. If the ESM data shows a robust dissociation between real-time judgment and action under salience pressure, the Temporal model requires significant patching. If it shows perfect correlation, the Agential model loses its phenomenon. Both sides should be equally terrified of the results, which suggests the design is fair.
