prompt: |-
  Since I retired from the lab I've been poking around in philosphy books, and now I've got myself into a bit of a row with my neighbour over our shared alleyway. He says he's opting out of the cleaning rota because 'a person is just an individual with rights, full stop,' and he doesn't owe anyone his time unless he signed a contract. I told him that sounds like treating people as little islands that happen to live near each other, which feels wrong—like he's missing that being someone at all depends on being recogised and caught up with others. But then he asked whether I'm saying he literally wouldn't exist without the rota, which I don't mean, and now I'm stuck. Is his 'individual rights first' view the sensible one, or is there a real philosophical mistake in thinking of ourselves as separate in that way?
