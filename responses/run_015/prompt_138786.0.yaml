  I reject step (5) because it assumes an unjustified uniformity between past and present epistemic situations.

  The failure is primarily in the base-rate framing of (2) and (3), but rejecting them only yields agnosticism, whereas rejecting (5) preserves the knowledge claim in (9a). The base-rate argument fails formally because we cannot know the denominator of successful theories (the reference class problem), so we cannot calculate the probability in (2); however, this merely blocks the skeptic's calculation without proving realism. The borrowed-verdict step (7) is the deeper philosophical threat, as it argues that even selective criteria are theory-laden. To save realism, you must argue that current theories are relevantly different from T (rejecting 5), which allows you to accept the historical graveyard (4) without letting it infect current claims.

  Regarding the filters, the manipulation criterion escapes the borrowed-verdict problem better than retention. Retention relies on structural continuity which is judged by the theory itself, but manipulation relies on causal interaction which can be verified independently of the theoretical description of the entity (e.g., spraying electrons works regardless of whether the wave-function description is true). Successful intervention anchors the entity in the causal network of the lab, not just the semantic network of the theory. However, you must accept that "manipulation" is not itself theory-laden in a way that presupposes the entity's existence, which is a contested but defensible position known as Entity Realism.

  Step (5) is salvageable if grounded in robust detection rather than mere predictive success. You are not engaging in special pleading if you can identify specific epistemic virtues present now but absent in T, such as convergent measurement from instrumentally independent principles (e.g., measuring Avogadro's number via Brownian motion, electrolysis, and X-ray diffraction). T relied on a single theoretical framework yielding a prediction; current realism often rests on multiple frameworks yielding the same entity. The claim differs from T's situation not by assertion but by the multiplicity of access routes.

  **Pricing the Options:**

  *   **Rejecting (2):** You commit to an incremental theory of confirmation where evidence need not push probability above 0.5 to be valid. *Cost:* You lose the ability to claim "knowledge" or justified belief in the strong sense, settling for "empirical adequacy" or increased confidence that may still remain below the threshold for truth.
  *   **Rejecting (3):** You commit to the claim that the reference class is unknowable or ill-defined. *Cost:* This blocks the skeptic's argument but leaves you with no positive reason to believe current theories are true; it saves you from skepticism but does not secure realism.
  *   **Rejecting (5):** You commit to identifying specific epistemic discontinuities between past and present science. *Cost:* You bear the burden of proof to demonstrate these differences are relevant to truth and not just rhetorical; you risk the charge of "special pleading" if the differences are merely that T was wrong and we are right.
  *   **Rejecting (7):** You commit to Entity Realism (manipulation is theory-independent). *Cost:* You must defend the view that causal interaction is intelligible without a true theory of the cause, and you may have to surrender realism about the *properties* of the entities, only their existence.
  *   **Rejecting (8):** You commit to the view that justification is possible even if probability is < 0.5 (contextualism). *Cost:* This requires a major overhaul of standard epistemology and may concede too much to the skeptic regarding the likelihood of truth.
