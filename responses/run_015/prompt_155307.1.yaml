answer: |-
  You have identified a structural flaw that is well-known in meta-ethics and philosophy of science, though it rarely gets a single, stable name in the well-being literature. In philosophy of science, this is a species of **explanatory vacuity** arising from **accommodation without prediction**. In argumentation theory, it is a form of **methodological circularity**.

  Since there is no single canonical term that captures the specific *mechanism* you are describing (the retroactive adjustment of inputs to match outputs), I will coin the term **The Calibration Loop**.

  Here is the carving of the concept, its boundaries, and how to distinguish it from legitimate theoretical flexibility.

  ### 1. What The Calibration Loop Is
  The Calibration Loop occurs when a theory's *parameters* (the inputs required to run the theory) are ascribed to the subject based on the *verdicts* (the outputs) the theorist wishes the theory to produce.

  In your examples:
  *   **The Theory:** Well-being = Satisfaction of Desire (or similar subjectivist metric).
  *   **The Input:** What the person desires.
  *   **The Output:** Whether the person is better off in the Machine/Overdub case.
  *   **The Loop:** We determine the Input ("They desired reality" vs. "They desired feeling") solely by looking at the Output we intuitively want ("Refusing the machine is rational" vs. "Taking the machine is rational").

  The theory does not *generate* the verdict; it *mirrors* it. It offers no independent traction. It is not logically circular (the conclusion is not explicitly in the premises), but it is **epistemically circular**: you cannot know the premises (the desires) without already knowing the conclusion (the well-being judgment).

  ### 2. What It Is Not
  You correctly ruled out unfalsifiability and motte-and-bailey. Here are further distinctions to sharpen the edges:

  *   **It is not Logical Circularity:** A logical circle says "P is true because P is true." The Calibration Loop says "P is true because Q is true," but we only know Q is true because we assumed P. It hides the dependence.
  *   **It is not Mere Flexibility:** A theory can be flexible (applying to many cases) without being vacuous. Flexibility becomes the Loop only when the *criteria for application* shift to match the *result of application*.
  *   **It is not the "Different Value" Dodge:** As you noted, that move exiles the intuition to a different category (e.g., "That's morality, not well-being"). The Calibration Loop keeps the intuition inside well-being but rewrites the definition of well-being's components to swallow it.

  ### 3. The Objectivist Comparison
  You asked if an objectivist view that adds items to a list (e.g., "Contact with Reality") has the same problem.

  **It depends on the source of the addition.**

  *   **The Loop Version:** If the objectivist says, "Well-being includes X, Y, and Z," and when confronted with a counter-intuitive case, they simply add "W" to the list *because* the intuition says W is good, they are in the Calibration Loop. They are treating the list as a bucket for intuitions rather than a theory explaining them.
  *   **The Principled Version:** If the objectivist says, "Well-being includes X, Y, and Z because these are the conditions for human flourishing," and then argues that "Contact with Reality" falls under "human flourishing" via an independent argument (e.g., about agency or truth), they have **Independent Traction**.

  The difference is not Subjectivism vs. Objectivism; it is **Principle-Guided vs. Intuition-Guided**. A subjectivist theory escapes the Loop if it specifies desires *independently* of well-being judgments (e.g., "informed desires under ideal conditions" defined by cognitive standards, not value standards). An objectivist theory enters the Loop if its list is just a catalog of current intuitions with no generating principle.

  ### 4. Legitimate Flexibility vs. The Loop
  When is a theory allowed to say, "Of course it predicts that, that's just what the theory says"?

  A theory has **Independent Traction** if you can specify its inputs *before* you know the verdict.
  A theory is in **The Calibration Loop** if you must know the verdict to specify the inputs.

  **The Pre-Registration Test:**
  To tell if a view is doing the Loop, apply this test:
  *Can we fix the description of the subject's mental state (desires, values, attitudes) prior to running the thought experiment?*

  *   **In the Plug-in Case:** If the defender says, "If they want reality, they lose out; if they want feelings, they gain," ask: "How do we know what they want *before* we ask if they are better off?"
      *   If the answer is "We ask them," the theory has traction (but might be wrong about their self-knowledge).
      *   If the answer is "We infer it from whether we think they are better off," it is the Calibration Loop.
  *   **In the Overdub Case:** If the defender says, "You wanted the smooth experience," ask: "Did I want that *before* the machine filtered the struggle, or only after?"
      *   If the desire is ascribed *post-hoc* to justify the lack of regret, it is the Loop.
      *   If the desire was measurable *ante-hoc* (e.g., "I explicitly stated I hate frustration"), the theory has traction (and might correctly predict I prefer the Overdub).

  ### 5. Why This Matters for Your Chapter
  The Calibration Loop is dangerous because it simulates explanation. It makes the theory look like it is handling complex cases, when it is merely categorizing them.

  In your chapter, you can frame the problem not as "Subjectivism is wrong," but as "Subjectivism often collapses into the Calibration Loop unless it constrains desire-ascription."

  *   **The Trap:** Using the subject's *revised* preferences (after the machine) to judge the *value* of the machine.
  *   **The Escape:** Insisting on **Fixed Inputs**. The theory must take the desires/attitudes as fixed data points, not as variables that can be tuned to make the well-being equation balance.

  If the theory cannot tell you whether you are better off without first asking you whether you feel better off (or what you think you want in light of the outcome), it is not a theory of well-being. It is a translation manual for intuitions.

  ### Summary Definition
  **The Calibration Loop:** A methodological failure in normative theory where the parameters required to apply the theory (inputs) are inferred from the intuitive verdicts the theory is supposed to generate (outputs), resulting in **explanatory vacuity**. It is distinguished from legitimate flexibility by the **Pre-Registration Test**: the ability to specify inputs independently of the theoretical verdict.
