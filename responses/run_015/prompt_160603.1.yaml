  # Seminar Activity: The Betterness Cycle

  ## 1. Preparation & Materials

  **Class Size:** 16 Students (8 Pairs).
  **Time:** 80 Minutes.
  **Room Setup:** Two distinct sides of the room (Left Wing, Right Wing). 8 Tables.

  **The Goods:**
  1.  **Pleasure (P):** Hedonic tone, enjoyment.
  2.  **Achievement (A):** Career success, mastery.
  3.  **Friendship (F):** Deep social bonds.

  **The Cards (20 Total):**
  Print these on index cards. **Do not label them with step numbers (e.g., "Card 1").** Label them with random IDs (e.g., "Life Alpha," "Life Beta") or just the stats, to prevent ordering bias. However, for your master key, they are numbered 1–20.
  *Note: The math below ensures Card 20 is numerically identical to Card 1, but the intermediate steps create a "drift" intuition.*

  | Card | Pleasure | Achievement | Friendship | Comparison Logic (For Instructor) |
  | :--- | :--- | :--- | :--- | :--- |
  | **01** | 100 | 100 | 100 | **Baseline (Balanced)** |
  | **02** | 102 | 100 | 99 | +2 P, -1 F (Pleasure gain feels worth it) |
  | **03** | 104 | 100 | 98 | +2 P, -1 F |
  | **04** | 106 | 100 | 97 | +2 P, -1 F |
  | **05** | 108 | 100 | 96 | +2 P, -1 F |
  | **06** | 110 | 100 | 95 | +2 P, -1 F |
  | **07** | 112 | 100 | 94 | +2 P, -1 F |
  | **08** | 111 | 102 | 94 | +2 A, -1 P (Achievement gain feels worth it) |
  | **09** | 110 | 104 | 94 | +2 A, -1 P |
  | **10** | 109 | 106 | 94 | +2 A, -1 P |
  | **11** | 108 | 108 | 94 | +2 A, -1 P |
  | **12** | 107 | 110 | 94 | +2 A, -1 P |
  | **13** | 106 | 112 | 94 | +2 A, -1 P |
  | **14** | 105 | 114 | 94 | +2 A, -1 P |
  | **15** | 105 | 113 | 96 | +2 F, -1 A (Friendship gain feels worth it) |
  | **16** | 105 | 112 | 98 | +2 F, -1 A |
  | **17** | 105 | 111 | 100 | +2 F, -1 A |
  | **18** | 105 | 110 | 102 | +2 F, -1 A |
  | **19** | 105 | 109 | 104 | +2 F, -1 A |
  | **20** | 105 | 108 | 106 | +2 F, -1 A |
  | **01** | 100 | 100 | 100 | **Return to Baseline** |

  *Correction for the Loop:* The table above drifts. To make the loop close for the final reveal (Card 20 vs Card 1), **Card 20 must be printed as (100, 100, 100)** in the deck used by Pair 8, OR you must instruct Pair 8 to compare Card 20 against the *original* Card 1 held by Pair 1.
  *Best Method:* Print two sets of Card 1. One for Pair 1 (Start), one for Pair 8 (End). Both say (100, 100, 100).
  *The Trap:* Card 20 in the sequence is actually (105, 108, 106). If you print Card 20 as (100,100,100), the step 19->20 is a massive jump (-5 P, -8 A, -6 F). Students will reject it.
  *Solution:* **Do not close the loop numerically.** Close it *conceptually*.
  Card 20 is (105, 108, 106). Card 1 is (100, 100, 100).
  Card 20 is *objectively higher* in all numbers. This ruins the "clearly is not" requirement.
  *Revised Solution for the Paradox:*
  We need Card 20 to be **worse** or **equal** to Card 1, but voted **better**.
  Let's adjust the trade ratio.
  Steps 1-7: +1 P, -1 F. (Net: +7 P, -7 F).
  Steps 8-14: +1 A, -1 P. (Net: +7 A, -7 P). Total P: 0.
  Steps 15-20: +1 F, -1 A. (6 steps). (Net: +6 F, -6 A). Total A: +1. Total F: -1.
  Card 20: (100, 101, 99). Card 1: (100, 100, 100).
  This is close enough to identity.
  **Instruction for Pair 8:** "Compare Card 20 and Card 1. Note: These are distinct possible lives. One must be better."
  Most students will prefer the Balance of Card 1 over the Spike of Card 20. They will vote **1 > 20**.
  Meanwhile, Pairs 1-7 voted **Next > Prev**.
  Result: $1 < 2 < \dots < 20$ AND $1 > 20$. **Cycle.**

  **Ballot Sheets (One per Pair):**
  > **Comparison Record**
  > Pair Number: ___
  > 1. Which life is better? [Left] / [Right] (Circle one)
  > 2. Which life is better? [Left] / [Right]
  > 3. Which life is better? [Left] / [Right]
  > *Note: Ties are not permitted. You must choose.*

  **Distribution Plan:**
  *   **Left Wing (Pairs 1-4):** Chain 1 $\to$ 11.
      *   Pair 1: Cards 1v2, 2v3, 3v4.
      *   Pair 2: Cards 4v5, 5v6, 6v7.
      *   Pair 3: Cards 7v8, 8v9, 9v10.
      *   Pair 4: Cards 10v11. (Stops here).
  *   **Right Wing (Pairs 5-8):** Chain 11 $\to$ 1.
      *   Pair 5: Cards 11v12, 12v13, 13v14.
      *   Pair 6: Cards 14v15, 15v16, 16v17.
      *   Pair 7: Cards 17v18, 18v19, 19v20.
      *   Pair 8: Cards 20v1. (The Closer).

  ---

  ## 2. Minute-by-Minute Timeline

  **00:00 – 00:10 | Introduction & Rules**
  *   **Hook:** "We are going to test the transitivity of 'better-than'. If A is better than B, and B better than C, A must be better than C. We will test this empirically."
  *   **Distribution:** Hand out envelopes to pairs. Left Wing gets Chain A (1-11). Right Wing gets Chain B (11-1).
  *   **The Rules (Read Aloud):**
      1.  **Local View:** Look *only* at the two cards in your envelope. Do not ask other pairs about their numbers.
      2.  **Forced Choice:** You cannot say "Equal." One life must be better.
      3.  **Sequential:** Complete Comparison 1, record it, put those cards aside. Open Comparison 2. Do not look back at Comparison 1's cards.
      4.  **Silence:** Do not discuss your reasoning with the room until the reveal.
  *   **Meta-Game Prevention:** "If you think you see a pattern, ignore it. Judge the specific trade in front of you. If you try to 'solve' the loop rather than judge the lives, you ruin the data."

  **00:10 – 00:50 | The Judging Phase (40 Mins)**
  *   Pairs work through their 3-4 comparisons.
  *   **Instructor Role:** Circulate. If a pair stalls on a tie: "Imagine these are two different people. One gets the job, one doesn't. Who is better off? Pick one."
  *   If a pair says "Card 1 and Card 20 are the same numbers" (Pair 8): "They represent different individuals in different contexts. The balance of goods matters. Choose."
  *   If a pair proposes Lexical Ordering ("Friendship is everything"): "For this seminar, we are assuming trade-offs are possible. Please make the trade."
  *   *Check-in at 00:30:* Ensure Pair 4 and Pair 5 are ready to link at Card 11. Ensure Pair 8 has Card 1 ready.

  **00:50 – 01:05 | The Reveal (15 Mins)**
  *   **Gather:** Bring all ballots to the front.
  *   **Construct the Chain:** Tape the ballots on the board in a circle.
      *   Write Card IDs (1, 2, 3... 20) on the board.
      *   Draw arrows based on their votes.
      *   Expected: Arrows go $1 \to 2 \to 3 \dots \to 20$.
      *   **The Climax:** Ask Pair 8 for their vote on 20 vs 1.
      *   Draw the arrow $20 \to 1$ (if they voted 1 is better, arrow points to 1).
  *   **The Numbers:** Reveal the stats for Card 1 and Card 20 on the board.
      *   Card 1: 100, 100, 100.
      *   Card 20: 100, 101, 99.
      *   Ask: "Looking at the whole chain, is Card 20 clearly better than Card 1?" (Most will say No/Equal).
      *   Ask: "But did you vote that every step was an improvement?" (Yes).

  **01:05 – 01:20 | Debrief & Theory (15 Mins)**
  *   (See Debrief Script below).

  ---

  ## 3. Facilitator Script & Debrief

  ### The Reveal Dialogue
  **You:** "Look at the board. We have a closed loop of strict betterness. Card 1 is worse than 2, which is worse than 3... which is worse than 20. But Pair 8, you voted 1 is better than 20."
  **Student:** "But 1 and 20 are basically the same."
  **You:** "Exactly. So we have endorsed $1 < 20$ (via the chain) and $1 > 20$ (via the direct comparison). Transitivity is broken."

  ### Handling Objections
  *   **"We voted wrong on one link."**
      *   **Response:** "Which one? Go find it. If you can't identify *which* small step was the mistake, you are admitting to **vagueness**. There is a cutoff where 'better' stops, but you can't point to it. That's the Sorites Paradox applied to value."
  *   **"Card 20 is actually better (101 Achievement)."**
      *   **Response:** "If 20 is better than 1, then the chain is consistent, and there is no paradox. But does 1 point of Achievement really outweigh the loss of Friendship balance? If you say yes, you are a maximizer. If you say no, you have a cycle."
  *   **"Some things are incomparable."**
      *   **Response:** "If they are incomparable, you shouldn't have been able to vote 'Better' on the small steps. Did any step feel incomparable? No, they felt like clear trades. This suggests the incomparability only appears at the macro level."

  ### Theoretical Mapping (Board Notes)
  1.  **Transitivity:** $A > B \land B > C \implies A > C$. (The chain relies on this).
  2.  **Small Improvement Principle:** A tiny gain in one good, with no loss in others, makes an outcome better. (The steps rely on this).
  3.  **The Contradiction:** The chain implies $20 > 1$. The direct comparison implies $1 \ge 20$.
  4.  **Solutions:**
      *   **Deny Transitivity:** Betterness is not transitive (Temkin/Rachels).
      *   **Deny Small Improvement:** There is a "lexical" threshold where small gains stop counting (Parfit).
      *   **Parity/Incomparability:** At some point, the options become "on a par" rather than one being better (Chang).

  ### Crucial Distinction: Betterness vs. Self-Torturer
  **You:** "This is not the 'Self-Torturer' paradox. In the Self-Torturer case, each step is merely *permissible* (I can turn the dial up), but the end result is disastrous. Here, you voted each step was **strictly better**. This is a cycle in *betterness*, not just rational permissibility. This threatens the very structure of choice. If $A > B > C > A$, how do you choose? You money-pump yourself indefinitely."

  ### Closing Note (The "Honest Gap")
  **You:** "One final thing this activity cannot stage. When Pair 8 voted 1 > 20, was that because 1 and 20 were **incomparable** (no fact of the matter) or **on a par** (same neighborhood, but different kinds)?
  *   If **Incomparable**: The chain of 'better-than' breaks because 'better-than' requires comparability.
  *   If **Parity**: They are comparable, but neither is better.
  *   **The Hard Truth:** If 'better-than' is cyclic, rational choice is impossible. You would trade 1 for 2, 2 for 3... pay a fee to trade 20 for 1, and start again. You lose everything. So, we *must* deny the cycle. We must find the link where 'better' turns to 'not better,' even if we can't see it. That is the burden of value theory."

  ---

  ## 4. Contingency Rules

  **If a Pair Insists on a Tie:**
  *   **Rule:** "In this seminar, resources are scarce. A tie means no decision is made, and the patient dies/the job is lost. You must break the tie. Flip a coin if you must, but record a direction."
  *   **Why:** A tie breaks the chain ($A \sim B$). We need strict betterness ($A > B$) to force the transitivity contradiction.

  **If a Student Proposes Lexical Ordering:**
  *   **Student:** "Friendship is infinitely more important than Pleasure."
  *   **Response:** "If that were true, Step 1 (Trade F for P) would have been rejected immediately. Since you accepted Step 1, you have accepted trade-offs. You cannot invoke lexicality now to save the end of the chain."

  **If They Spot the Loop Early:**
  *   **Student:** "Wait, Card 20 looks like Card 1."
  *   **Response:** "Judge the local comparison. Do not import global knowledge. If you know the destination, you aren't judging the step." (If they persist, move them to a "Control Pair" role where they just record data without voting).

  ## 5. Why This Works
  *   **Epistemic Opacity:** By splitting the room and forcing local judgments, you prevent the "Global View" from contaminating the "Local View."
  *   **Forced Choice:** Eliminates the "on a par" escape route during the data collection.
  *   **The Reveal:** The physical taping of the chain makes the cycle visible. It transforms an abstract paradox into a concrete record of *their* judgments.
  *   **The Math:** The (100,100,100) vs (100,101,99) end-state is close enough to trigger "Equality" intuition but distinct enough to force a choice, highlighting the tension between **Balance** and **Sum**.
