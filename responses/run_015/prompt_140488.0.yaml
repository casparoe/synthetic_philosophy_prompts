prompt: |-
  I run a monthly reading group on interpretability — about 18 people, roughly half ML PhD students and half philosophy grad students, 90 minutes — and we keep going in circles on whether it even makes sense to say a network represents anything, or whether that's just a useful way for us to talk. I want one session where they stop trading slogans and actually run into the disagreement themselves.

  Here's the gimmick I've been toying with, which you should either build the session around or tell me won't work: instead of a real net, use a hand-built artifact small enough that everyone in the room can inspect every internal state — a cardboard machine with colored pegs and a lookup wheel that maps simple drawn inputs to output labels. The catch is that I can pre-load two different readings of the same pegs: one that fits the training cases and also survives being intervened on with new inputs, and one that fits the training cases just as well but falls apart the moment you try to steer the machine with it.

  Design me the runnable version: how to build the artifact, what the two readings are, what each half of the room gets asked to do, a timeline for the 90 minutes, and a debrief that maps the two moments they should hit — the pegs support more than one reading, and yet one reading earns the label and the other doesn't — onto the realism/anti-realism fight, without naming it up front. Also: what will predictably go wrong when I run it, and which feature of the disagreement the activity will flatten out no matter how cleverly I set it up?
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**
      *   **Context:** Monthly reading group on interpretability (18 people, 50% ML PhDs, 50% Philosophy Grads, 90 mins).
      *   **Problem:** Stuck in circles on representational realism vs. instrumentalism (does the network *really* represent things, or is it just useful talk?).
      *   **Goal:** A session where they *experience* the disagreement rather than just talking about it.
      *   **Proposed Gimmick:** A hand-built artifact (cardboard machine, pegs, lookup wheel) small enough to inspect fully.
      *   **Key Mechanic:** Two pre-loaded readings of the same internal state. One survives intervention/generalization (robust), one fits training data but fails intervention (brittle).
      *   **Deliverables:** Build instructions, the two readings, group tasks, timeline, debrief mapping to realism/anti-realism, predicted failures, and limitations of the activity.

  2.  **Evaluate the Gimmick:**
      *   *Will it work?* Yes, but with caveats. The core insight of the "realism vs. instrumentalism" debate in interpretability often hinges on *causal structure* vs. *correlational fit*. A physical machine makes causal structure tangible.
      *   *Risk:* It might be too simple. If the machine is *too* transparent, the "representation" becomes obvious (e.g., "this peg *is* the switch"), killing the ambiguity. The ambiguity needs to come from *how we describe the function of the pegs*, not just what they physically do.
      *   *Refinement:* The "two readings" shouldn't just be "right vs. wrong." They need to be "empirically equivalent on training data, divergent on counterfactuals." This mirrors the philosophical problem of underdetermination.

  3.  **Design the Artifact (The "Peg Machine"):**
      *   *Input:* Needs to be simple. Let's say 4 binary inputs (switches or slots). $2^4 = 16$ possible inputs.
      *   *Internal State:* 3 colored pegs (Red, Blue, Green). Each can be Up/Down. $2^3 = 8$ states.
      *   *Output:* Binary (Light On/Off or Label A/B).
      *   *Mechanism:* A lookup table (the "wheel") maps Input $\to$ Peg Configuration $\to$ Output.
      *   *The Trick:* The Peg Configuration is the "latent space."
      *   *Reading 1 (Realist/Causal):* The pegs encode specific features (e.g., "Input has parity," "Input has majority 1s"). Intervening on pegs changes output predictably.
      *   *Reading 2 (Instrumentalist/Post-hoc):* The pegs are just a hash of the input index. They correlate perfectly with output on training data, but intervening on them breaks the link because they don't capture the *rule*, just the *memory*.

      *Wait, let's make it more concrete.*
      *   Task: Classify 3-bit strings as "Valid" or "Invalid."
      *   Rule: Valid if parity is even (000, 011, 101, 110).
      *   Internal State: 2 bits (Peg A, Peg B).
      *   Training Data: Only 4 examples shown initially (e.g., 000, 011, 101, 110).
      *   *Reading 1 (Feature):* Peg A = Bit 1, Peg B = Parity of Bits 2&3. (Compositional).
      *   *Reading 2 (Lookup):* Peg State = ID of the specific training example. (Memorization).
      *   *Intervention:* Change Peg A. Does Output change according to the rule or according to the specific ID?

      *Actually, let's simplify for a 90-minute workshop.*
