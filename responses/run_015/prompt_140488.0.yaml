      *   **Internal:** 2 Dials (Left/Right).
      *   **Output:** Smile/Frown Card.
      *   **Training Set:** 4 specific combinations.
      *   **The "Readings":**
          1.  *The Feature Story:* Left Dial = "Any Red?", Right Dial = "Majority Blue?".
          2.  *The Index Story:* Left Dial = "Is it Card Set 1 or 2?", Right Dial = "Is it Card Set 3 or 4?".
      *   **The Test:** Intervention. Manually move the dials.
      *   *Feature Story:* Moving "Any Red" to No should turn Smile to Frown (if rule depends on it).
      *   *Index Story:* Moving the dial breaks the mapping because the dial was just an ID, not a cause.

      *Better yet:* Let's use the user's "lookup wheel" idea.
