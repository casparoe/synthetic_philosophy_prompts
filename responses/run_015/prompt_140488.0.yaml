      *   **Internal:** 2 Windows showing colored beads (Red/Blue).
      *   **Output:** A card drawn from a slot (Yes/No).
      *   **Training:** 4 Configurations shown.
      *   **Hidden Mechanism:** Output is Yes if Coin 1 is Heads. Bead 1 = Coin 1. Bead 2 = Coin 2.
      *   **Reading 1 (Modular):** Bead 1 = "Decision Factor." Bead 2 = "Context."
