      *   *Where is the divergence?*
      *   The divergence must be on *counterfactual inputs* that weren't in training, OR on the *meaning of the intervention*.
      *   Ah, the prompt says: "one that fits the training cases and also survives being intervened on... and one that fits the training cases just as well but falls apart the moment you try to steer the machine."
      *   Okay, so the *machine itself* must break under one interpretation.
      *   This implies the "Reading" dictates how we *wire* the intervention.
      *   No, the machine is fixed. The *description* of the intervention changes.
      *   Let's go with **Gerrymandered Features**.
      *   **Machine:** 3 Input Switches. 2 Internal Lights. 1 Output Buzzer.
      *   **Logic:** Buzzer sounds if Switch 1 is ON. (Switch 2 & 3 do nothing).
      *   **Training Data:** We only show cases where Switch 1 matches Switch 2.
          *   000 $\to$ Lights [0,0] $\to$ Off
          *   001 $\to$ Lights [0,0] $\to$ Off
          *   110 $\to$ Lights [1,1] $\to$ On
          *   111 $\to$ Lights [1,1] $\to$ On
      *   **Internal Lights:** Light 1 = Switch 1. Light 2 = Switch 2.
      *   **Reading 1 (True Feature):** Light 1 represents "Trigger." Light 2 represents "Correlated Context."
      *   **Reading 2 (Conflated Feature):** Light 1 represents "System State A." Light 2 represents "System State B." (Where State A implies On, State B is irrelevant).
      *   **Intervention:** Force Light 1 = 1, Light 2 = 0.
      *   **Reading 1:** "We turned on the Trigger." Prediction: Buzzer On.
      *   **Reading 2:** "We put it in State A (Light 1) but removed Context B (Light 2)." If Reading 2 claims State A *requires* Context B to mean "On", then Prediction: Buzzer Off or Undefined.
      *   *This is getting too abstract.* Let's make it physical and immediate.

      *Final Artifact Plan:*
      *   **Box:** "The Oracle."
