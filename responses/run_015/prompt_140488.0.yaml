      *   **Mechanism:** The "Encoder" maps Input to a 2-peg state (Up/Down). The "Decoder" maps 2-peg state to Output (0/1).
      *   **Training Data:** 4 examples.
      *   **Hidden Rule:** XOR of first two bits.
      *   **Peg State:**
          *   *Reading A (Real):* Peg 1 = Bit 1, Peg 2 = Bit 2. (Decoder computes XOR).
          *   *Reading B (Spurious):* Peg 1 = Output Value, Peg 2 = Don't Care. (Decoder just reads Peg 1).
      *   **Wait, if Peg 1 = Output Value, that's trivial.**
      *   Let's try:
          *   **Rule:** Output 1 if Input has odd parity.
