      *   *Moloch:* A poetic personification of misaligned incentives/multipolar traps. Not a technical term, but captures the *systemic* pressure.
      *   *Externalities:* In PD/ToC, the externality is on the *common pool*. In Tournaments, the externality is on the *competitors' probability of winning* (pecuniary externality) or on the *social cost of effort*.

