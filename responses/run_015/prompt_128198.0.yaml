      *   *Rank Tournament / Positional Goods:* Payoff depends on *relative* standing. If everyone spends more, the ranking doesn't change, but costs rise. This is often modeled as an *All-Pay Auction* or a *Rent-Seeking Contest*. Key feature: Constant-sum (or zero-sum) regarding the *prize*, but negative-sum regarding *net utility* due to costs.
      *   *The Economist's Point:* She is correct that many "arms races" are positional. If the goal is "top 10 colleges," building more applicants doesn't create more spots. It just raises the bar. PD solutions (trust, iteration) fail because my gain is your loss.
