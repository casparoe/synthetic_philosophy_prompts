      *   *Refinement:* I need to be careful not to validate the economist's claim too uncritically if it's game-theoretically shaky. Mutual restraint in a tournament *is* Pareto superior to mutual arms racing. The difference is *why* it's hard to achieve. In PD, it's hard because Defect dominates Cooperate. In Tournament, it's hard because Effort dominates Restraint *given the goal is Rank*. The solution in PD is "make Cooperate dominant." The solution in Tournament is "change the goal" or "cap Effort."
