  3.  **Key Philosophical & Technical Distinctions to Address:**

      *   **Grounding vs. Understanding:** Does connecting a word "red" to a wavelength via a camera constitute *understanding* redness, or just reliable transduction? (The Chinese Room argument variant).
      *   **Understanding vs. Sentience (Phenomenology):** A system can have grounded representations without *feeling* like anything to be that system (Qualia).
      *   **Sentience vs. Moral Status:** Even if sentient, does it have interests? Is it a "subject-of-a-life" (Regan)?
