  Write a satirical internal policy memorandum, approximately 600 words, in the deadpan bureaucratic voice of a senior advisor at a fictional "Office of Strategic Analogy." The memo should present the "Unified Historical Precedent Protocol," a formal rubric for matching current diplomatic crises to one of three canonical analogies—Munich (1938), Vietnam (1965–73), or the Thucydides Trap—using invented quantitative metrics (for example, a "Munich Coefficient," a "Quagmire Index," and a "Power-Transition Drift Score"). The satire should exaggerate real pathologies of analogical reasoning in foreign-policy discourse: treating structurally dissimilar conflicts as interchangeable, substituting narrative coherence for causal analysis, and allowing the selected analogy to dictate recommendations regardless of local context. The target is the practice of analogical reasoning itself, not any named official, administration, or living figure. Maintain sustained deadpan irony throughout—do not wink, signal irony with scare quotes, or state the critique explicitly. End with a brief "Implementation Checklist" that quietly exposes the protocol's circular logic. Begin with a single-sentence bottom line summarizing the protocol's central claim. Keep the response under 650 words.
