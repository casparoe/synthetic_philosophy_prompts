      This protocol resolves inter-agency disputes by shifting debate from *what is happening* to *which war we are refighting.* It guarantees that policy outputs remain consistent even when inputs change unpredictably. By substituting narrative coherence for causal analysis, we ensure that decision-makers are never surprised by outcomes that resemble past failures.

