prompt: |-
  I write a science-and-ideas column for a mid-sized magazine, and an ever-larger chunk of what I do is blaming people in print: a journal that sat on a retraction for fourteen months, a university that quietly buried a study its funder disliked, a research centre that took money from an industry body and left it out of the disclosures. My editor and I end up having the same argument roughly every week, and it always has the same shape: someone in the letters page or the comments says "you're one to talk" — our own corrections policy is a shambles, we run sponsored explainers paid for by companies whose research I criticise, I have taken the free flight to the conference — and we have no principled way of telling when that tu quoque actually bites and when it is just noise. I've skimmed a bit of the philosophy-of-blame stuff myself (standing, hypocrisy, the idea that you can forfeit the right to blame by being implicated in the very thing you're blaming), but nobody else on staff has, I can't send my editor to a seminar, and please don't send me a reading list or footnotes — I need something I can use on a Wednesday afternoon.

  So: write me a decision procedure my editor and I can actually run, in fifteen or twenty minutes, on a piece that is about to blame somebody. Ordered questions, what counts as a sufficient answer to each, where the procedure simply stops with a no, and where it stops and hands the decision to a person because the question is one of values rather than facts. My working heuristic up to now has been a "mirror test" — if the target could run my sentence back at me with the names swapped and it would sting, I don't have standing — and my editor's is that a "full disclosure: we've been guilty of this too" note at the top fixes everything. I want the procedure to say what's wrong with both of those, and where they're actually not bad. It has to handle: blame laundered through a quoted source ("Dr X called the delay indefensible") — does quoting preserve standing, destroy it, or count as endorsing it, and when does the quoting stop being reporting and start being blaming; complicity-by-benefit (my salary, the flights, the owner's portfolio) versus complicity-by-agency (I personally did the thing); unsigned institutional blame versus my own byline; blaming for a structural or aggregate harm where no single person's individual act is wrong; and the second-order case where the thing I'm blaming is itself hypocrisy. Also whether it matters if the blame targets a practice rather than a person, and whether "you are a hypocrite" is a different moral act from "that was wrong."

  Then run it on three pieces I have on the go: one calling out a university press and its oversight committee for slow, opaque retractions when my own outlet has quietly rewritten a piece after a complaint without noting it and has never once run a correction; one on a climate research centre taking money from an energy trade group, when my magazine's parent company puts on a "future of energy" conference series with oil and gas sponsors (I did once take a junket flight, and I did disclose it, which may or may not help); and one on a medical journal's conflicts-of-interest failures where every harsh phrase is inside quotation marks from clinicians I interviewed and our health coverage is underwritten by a foundation that holds hospital stock. At least one of those, I suspect, is going to come back with an answer I don't like, and I'd rather find out from you than from the letters page. Be honest about which steps are judgment calls dressed up as procedure, and end by saying what the procedure can't do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas columnist for a mid-sized magazine.
      *   **Problem:** Frequent *tu quoque* (hypocrisy) attacks from readers regarding the magazine's own ethical lapses (corrections policy, sponsorships, junkets). No clear internal standard for when these attacks have moral weight (standing) vs. when they are noise.
      *   **Current Heuristics:**
          *   Writer: "Mirror Test" (If they swapped names, would it sting?).
          *   Editor: "Disclosure Note" (Admitting guilt fixes everything).
      *   **Needs:** A practical decision procedure (15-20 mins), ordered questions, stop conditions (No vs. Human Decision), critique of current heuristics, handling of specific edge cases (quoted blame, complicity types, structural harm, hypocrisy about hypocrisy), application to three specific draft pieces, honesty about limitations.
      *   **Constraints:** No reading lists, no footnotes, usable on a Wednesday afternoon.

  2.  **Deconstruct the Philosophy of Blame (Internal Knowledge):**
      *   *Standing:* Do I have the right to blame? (Clean hands, non-complicity).
      *   *Hypocrisy:* Does my own fault negate my criticism? (Usually no, but it weakens moral authority).
      *   *Agency:* Did *I* do it, or does my *institution* do it?
      *   *Function of Blame:* Is it to punish, correct, or signal norms?
      *   *Quoted Blame:* Am I reporting or amplifying?
      *   *Structural vs. Individual:* Blaming a system vs. a person.

  3.  **Drafting the Decision Procedure (The "Standing Audit"):**
      *   *Goal:* Make it binary where possible, but acknowledge value judgments.
      *   *Structure:* Funnel approach. Start with hard facts, move to nuance, end with risk assessment.
      *   *Critique of Heuristics:*
          *   Mirror Test: Good for empathy, bad for logic. You can be a hypocrite and still be right.
          *   Disclosure Note: Good for transparency, bad for absolution. It informs, doesn't cleanse.
      *   *Edge Cases:* Need specific questions for quoting, structural harm, and institutional vs. personal blame.

      *   *Step 1: The Agency Check.* (Did *you* do it, or the *org*?)
      *   *Step 2: The Materiality Check.* (Is the fault comparable in scale/nature?)
      *   *Step 3: The Function Check.* (Is the goal correction or performance?)
      *   *Step 4: The Quotation Check.* (Reporting vs. Endorsing.)
      *   *Step 5: The Disclosure Check.* (Does transparency mitigate or just highlight?)

  4.  **Refining the Steps (Iterative Process):**
      *   *Constraint:* Must be 15-20 mins. Keep questions sharp.
      *   *Constraint:* Must handle the specific scenarios (retractions, funding, conflicts).
      *   *Refinement:* Let's organize by "Stop" conditions. If you fail a hard stop, you kill the piece or rewrite. If you hit a "Value Call," you talk to the editor.

      *   *Revised Structure:*
          1.  **Identity of the Blamer:** Personal vs. Institutional.
          2.  **Identity of the Blamed:** Person vs. Practice.
          3.  **Nature of the Complicity:** Direct vs. Structural.
          4.  **The "Sting" Test (Refined Mirror):** Relevance of the hypocrisy.
          5.  **The Mitigation:** Disclosure vs. Absolution.

      *   *Wait, I need to address the specific edge cases requested:*
          *   Blame laundered through quotes.
          *   Complicity-by-benefit vs. Agency.
          *   Structural harm.
          *   Hypocrisy about hypocrisy.

      *   *Let's build the "Standing Audit" Protocol.*
      *   *Phase 1: Hard Stops (Facts).*
      *   *Phase 2: The Gray Zone (Values).*
      *   *Phase 3: The Mitigation Strategy.*

  5.  **Critiquing the Current Heuristics:**
      *   *Mirror Test:* It conflates *feeling* bad with *being* wrong. You can have standing even if you're flawed, provided the flaw isn't identical and unacknowledged. It's useful for tone, not validity.
      *   *Disclosure Note:* It treats transparency as penance. It isn't. It allows the reader to judge, but it doesn't grant moral authority. It's necessary but not sufficient.

  6.  **Applying to the Three Cases:**

      *   *Case 1: Retractions (Uni Press vs. Magazine).*
          *   Blame: Opaque/slow retractions.
          *   Complicity: Magazine rewrites without note (worse?).
          *   Analysis: Direct parallel. Institutional blame.
          *   Verdict: High risk. The magazine is *worse*. Standing is weak unless framed as "We are fixing this too."

      *   *Case 2: Climate Funding (Research Centre vs. Magazine Conference).*
          *   Blame: Taking industry money.
          *   Complicity: Parent company takes industry money; Writer took flight (disclosed).
          *   Analysis: Complicity-by-benefit vs. Agency. Writer disclosed flight. Magazine takes money but via conference, not direct research funding?
          *   Verdict: Nuanced. Distinction between *funding research* (bias risk) and *sponsoring event* (marketing risk). Standing exists if distinction is clear.

      *   *Case 3: Medical COI (Journal vs. Magazine/Foundation).*
          *   Blame: COI failures.
          *   Complicity: Health coverage underwritten by foundation with hospital stock. All blame quoted from clinicians.
          *   Analysis: Quoted blame. Structural complicity (owner's portfolio).
          *   Verdict: Quoting protects somewhat, but if the magazine amplifies it without disclosing own COI, it's misleading. The foundation's stock is structural, harder to avoid.
          *   Risk: High. Looks like pot calling kettle black regarding financial influence.

  7.  **Drafting the Content (Tone and Style):**
      *   Tone: Professional, direct, slightly weary (matching the user), pragmatic.
      *   Format: Clear headers, bullet points, bold text for decisions.
      *   Honesty: Admit where the procedure is just structured intuition.

  8.  **Final Review against Constraints:**
      *   15-20 mins? Yes, it's a checklist.
      *   No footnotes/reading list? Checked.
      *   Critique heuristics? Included.
      *   Handle edge cases? Integrated into questions.
      *   Run on 3 pieces? Included.
      *   End with limitations? Included.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe tell them to kill Case 1.
      *   *Correction:* No, give them the tool to decide. The tool should highlight the risk, but the editor makes the call.
      *   *Refinement on Quoting:* Make sure to distinguish between "Reporting that X blamed Y" and "Using X to blame Y."
      *   *Refinement on Hypocrisy:* Distinguish between "You did it too" (tu quoque) and "You are undermining the norm you claim to uphold."

  10. **Final Polish:** Ensure the "Stop" conditions are clear. (e.g., STOP = Kill/Rewrite, GO = Proceed, ESCALATE = Editor Decision).

  *(Self-Correction on Case 1)*: The prompt says the magazine "quietly rewritten a piece after a complaint without noting it." This is arguably *worse* than a slow retraction. The procedure needs to flag this as a "Standing Killer" unless the article is *about* the industry-wide failure including themselves.

  *(Self-Correction on Case 3)*: The blame is *all* in quotes. This is "reporting on a controversy" vs "taking a side." The procedure needs to clarify if the *headline* and *intro* adopt the blame.

  Okay, ready to write. The structure will be:
  1.  Introduction (Acknowledging the bind).
  2.  Critique of Current Heuristics.
  3.  The Standing Audit (The Procedure).
  4.  Application to the Three Cases.
  5.  Limitations.
  6.  Closing.

  Let's make sure the "Value vs. Fact" distinction is clear in the procedure.
  Fact: Did we take money?
  Value: Does taking money negate the criticism of taking money?

  Okay, let's go.cw
answer: |-
  Here is a decision procedure designed for a Wednesday afternoon. It is not a moral absolution machine; it is a risk-assessment tool. It distinguishes between *logical validity* (is the criticism true?) and *moral standing* (do we have the right to voice it without undermining our own credibility).

  ### Part 1: Why Your Current Heuristics Fail

  Before running the audit, you need to agree on why the "Mirror Test" and the "Disclosure Note" are insufficient.

  **1. The Mirror Test (Your Heuristic)**
  *   **What it gets right:** It measures *tone* and *empathy*. If the swapped sentence stings, it means you are attacking a vulnerability you share.
  *   **Where it fails:** It conflates *hypocrisy* with *falsehood*. A smoker can correctly tell you smoking kills you. If the "sting" stops you from publishing true criticism, you are privileging your own purity over the public interest.
  *   **Verdict:** Use this to calibrate *humility*, not to determine *standing*.

  **2. The Disclosure Note (Editor's Heuristic)**
  *   **What it gets right:** It respects the reader's autonomy. It prevents active deception.
  *   **Where it fails:** It treats transparency as *penance*. It implies that admitting a conflict neutralizes the conflict. It does not. A disclosed bribe is still a bribe.
  *   **Verdict:** This is a *minimum requirement*, not a "get out of jail free" card. It mitigates damage; it does not grant authority.

  ---

  ### Part 2: The Standing Audit (15-20 Minutes)

  Run this jointly. If you hit a **STOP**, the piece cannot run in its current form. If you hit **ESCALATE**, it requires a values decision from the Editor-in-Chief. If you pass to **END**, you have standing, subject to mitigation.

  #### Phase 1: The Agency Check (Facts)
  *Goal: Determine who is actually blaming whom.*

  **Q1: Who is the grammatical subject of the blame?**
  *   Is it "I/We claim X is wrong" (Author/Outlet Blame)?
  *   Is it "X says Y is wrong" (Reporting)?
  *   **STOP:** If you are reporting blame (quotes) but your headline, intro, or conclusion adopts the blame as the magazine's own position without attribution.
  *   **PROCEED:** If the blame is clearly attributed to sources, OR if you are explicitly owning the critique.

  **Q2: Is the complicity Personal or Institutional?**
  *   **Personal:** You took the flight, you signed the check, you wrote the rewrite.
  *   **Institutional:** The parent company owns the stock, the policy is set by a board you don't sit on.
  *   **ESCALATE:** If you are blaming a *person* for an act you *personally* committed (e.g., you criticize a Dean for lying, but you have lied in this magazine).
  *   **PROCEED:** If your complicity is purely institutional (salary, portfolio) while blaming an individual's specific agency.

  #### Phase 2: The Equivalence Check (Values)
  *Goal: Determine if the hypocrisy is relevant.*

  **Q3: Is the fault "Like-for-Like"?**
  *   Compare the sin you are accusing them of vs. the sin you have committed.
  *   **STOP:** If your sin is *worse* or *more direct* than theirs. (e.g., Accusing them of slow retractions when you do *no* retractions).
  *   **ESCALATE:** If the sins are similar but distinct. (e.g., They took research funding; you took event sponsorship).
  *   **PROCEED:** If the sins are unrelated (e.g., They faked data; you took a flight).

  **Q4: Is the Target a Practice or a Person?**
  *   Are you blaming a *system* (retraction processes, funding models) or an *individual's character* (greed, negligence)?
  *   **PROCEED:** If blaming a Practice/System. You can critique a system you are trapped in.
  *   **ESCALATE:** If blaming an Individual's Character. You cannot credibly attack a character flaw you actively exhibit.

  **Q5: Is the Blame "Second-Order" (Hypocrisy)?**
  *   Are you blaming them for doing the thing, or for *pretending not to* do the thing?
  *   **PROCEED:** If you are blaming them for the act itself (e.g., "This funding biases results").
  *   **STOP:** If you are blaming them for hypocrisy while you are being hypocritical (e.g., "They claim independence but take money," when you claim independence but take money). *You cannot weaponize hypocrisy if you are vulnerable to the same charge.*

  #### Phase 3: The Mitigation Check (Strategy)
  *Goal: Determine how to survive the comments section.*

  **Q6: Does the piece offer a path forward that includes us?**
  *   Does the solution require *them* to change, or *everyone* (including you) to change?
  *   **PROCEED:** If the critique implies "We all need to fix this standard."
  *   **ESCALATE:** If the critique implies "We are clean, and they are dirty."

  **Q7: Is the Disclosure Specific or Vague?**
  *   **STOP:** If the disclosure is hidden in a bio or footer.
  *   **PROCEED:** If the disclosure is proximate to the claim (e.g., in the sidebar or intro text).
  *   **Note:** Disclosure does not fix a **STOP** in Phase 1 or 2. It only mitigates risk in Phase 3.

  ---

  ### Part 3: Running the Audit on Your Three Pieces

  Here is the honest output of the procedure applied to your current drafts.

  #### Piece 1: The Retraction (University Press vs. Your Magazine)
  *   **Q1 (Agency):** You are blaming the Press/Committee. (Proceed)
  *   **Q2 (Complicity):** Institutional. The magazine rewrote quietly. (Proceed)
  *   **Q3 (Equivalence):** **STOP.** You are accusing them of "slow, opaque retractions." Your magazine performs "quiet rewrites without noting it." A quiet rewrite is ethically worse than a slow retraction. A slow retraction admits error eventually; a quiet rewrite hides it.
  *   **Q4 (Target):** Practice. (Proceed)
  *   **Q5 (Second-Order):** You are implying they lack transparency. You lack transparency. **STOP.**
  *   **Verdict:** **Do not run this as written.** You have no standing to claim the high ground on transparency.
  *   **Fix:** You must turn the lens outward to include yourself. The piece cannot be "They are bad at retractions." It must be "The academic and media ecosystem is broken on corrections, here is how the Press failed, and here is how we failed last year." If you do not implicate yourself *in the text* (not just a note), the *tu quoque* will destroy the argument.

  #### Piece 2: The Climate Centre (Energy Money vs. Conference Sponsors)
  *   **Q1 (Agency):** You are blaming the Centre. (Proceed)
  *   **Q2 (Complicity):** Mixed. You took a flight (Personal, disclosed). Parent company takes sponsors (Institutional). (Proceed)
  *   **Q3 (Equivalence):** **ESCALATE.** They take money for *research* (direct bias risk). You take money for *conferences* (marketing risk). These are distinct, but readers will conflate them.
  *   **Q4 (Target):** Practice/Structure. (Proceed)
  *   **Q5 (Second-Order):** You are blaming them for COI. You have a COI. (Escalate)
  *   **Q6 (Path Forward):** Does the piece argue for *no* industry money, or *managed* industry money? If the former, you are hypocritical. If the latter, you have standing.
  *   **Verdict:** **Runnable, but high friction.** Your disclosed flight helps you personally. The parent company's conference is the weak point.
  *   **Fix:** You must explicitly distinguish between *funding inquiry* and *sponsoring discussion*. If you don't make that distinction in the text, the readers will make it for you, and you will lose. Add a line: "Unlike direct research grants, event sponsorship does not dictate findings, but it does create the appearance of..." Acknowledge the gray zone.

  #### Piece 3: The Medical Journal (COI Failures vs. Foundation Underwriting)
  *   **Q1 (Agency):** **STOP.** "Every harsh phrase is inside quotation marks." This is blame laundering. If you curate the quotes to build a case you couldn't make yourself, you are the blamer.
  *   **Q2 (Complicity):** Structural. Foundation holds hospital stock. (Proceed)
  *   **Q3 (Equivalence):** **ESCALATE.** They fail to disclose COI. You are underwritten by a stakeholder. If the foundation's stock influences *which* stories get greenlit, the equivalence is high.
  *   **Q4 (Target):** Practice. (Proceed)
  *   **Q5 (Second-Order):** You are highlighting their lack of disclosure while your own funding is opaque to the average reader (underwriting is often less visible than COI statements).
  *   **Verdict:** **High Risk.** The use of quotes to shield yourself is transparent to savvy readers.
  *   **Fix:** You must own the quotes. "Clinicians argue X, and their concern is valid given the structural incentives we all face." You must disclose the foundation's holdings *in the article*, not just in the masthead. If the foundation holds hospital stock, and you are criticizing a journal for hospital-linked COI, the connection is too tight to hide behind quotes.

  ---

  ### Part 4: What This Procedure Cannot Do

  I need to be honest about the limitations of this tool, or it will fail you when you need it most.

  1.  **It Cannot Fix Bad Faith:** If your goal is to signal virtue rather than correct a harm, this procedure will just help you lie more efficiently. It assumes you actually want to know if you have standing.
  2.  **It Cannot Predict Mob Dynamics:** You can pass this audit perfectly and still be dogpiled. The internet does not care about the distinction between "complicity-by-benefit" and "complicity-by-agency." They see "You took money, they took money." The procedure minimizes *ethical* risk, not *reputational* risk.
  3.  **It Cannot Resolve Structural Guilt:** We are all complicit in late-stage capitalism's research economy. This procedure helps you navigate it, but it cannot absolve you of it. If you wait for clean hands, you will never publish.
  4.  **It Is Not a Legal Shield:** "Editorial Independence" is a policy, not a law. If the parent company decides the Climate Piece threatens the Conference revenue, this audit won't save it.

  ### Final Recommendation

  For **Piece 1 (Retractions)**: Rewrite to include your own magazine as a co-defendant. Make it an industry critique, not an exposé.
  For **Piece 2 (Climate)**: Run it, but sharpen the distinction between research funding and event sponsorship.
  For **Piece 3 (Medical)**: Do not run it with the quotes as a shield. Disclose the foundation's stock in the text or kill the angle.

  Your editor's "Disclosure Note" is a bandage. Your "Mirror Test" is a gut check. This procedure is the triage. Use it to decide where to bleed.
