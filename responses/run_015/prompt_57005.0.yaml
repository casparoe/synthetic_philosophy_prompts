answer: |-
  You must reject step (5) as simply false and step (2) as setting an impossible standard, while noting step (4) is true but too weak to support the leap to skepticism. Step (5) looked innocent because it exploits the logical possibility of underdetermination (equifinality), but it is empirically false because physical constraints (taphonomy, chemistry, physics) and independent ethnographic data limit the range of compatible selection functions, meaning error does leave marks in the form of inconsistency with auxiliary theories. Step (2) looked innocent because it mimics the statistical requirement to know bias corrections, but it is methodologically untenable because science licenses inference based on modeled and constrained selection functions rather than certain knowledge. Step (4) is true—we do infer the selection function from biased data—but it is too weak to carry the inference to (5) because it ignores that the selection function is also constrained by independent actualistic studies (e.g., experimental decay) rather than derived solely from the artifact assemblage itself.

  The cost of these rejections is the abandonment of certainty in favor of probabilistic warrant and the admission that archaeological inference depends on auxiliary "middle-range" theories that are themselves fallible. The residue of the argument is strong enough to worry an archaeologist: it correctly identifies that naive empiricism is fatal and that every claim about the past relies on a defended model of preservation and discovery, but it does not justify the paralysis of conclusion (9). Your astronomical case is genuinely analogous regarding the necessity of correcting for selection effects, but there is a disanalogy in the source of knowledge about the selection function: in astronomy, the function is primarily instrumental and calibrated *a priori*, whereas in archaeology, it is processual and reconstructed via independent scientific study of decay and deposition. This disanalogy makes archaeology harder and less precise, but it does not leave (9) standing, because taphonomy provides the independent leverage required to break the circularity you feared.
