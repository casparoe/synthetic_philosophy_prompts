      *   *Key Insight:* The condition isn't just "singular," it's "agential." The user needs to distinguish between *numerical singularity* (one person) and *agential unity* (one will).

  3.  **Deconstruct Point 2: Distributed Resentment (Reactive vs. Objective)**
      *   *User's Claim:* Distributed resentment feels reactive (affective, participatory) but lacks the target.
