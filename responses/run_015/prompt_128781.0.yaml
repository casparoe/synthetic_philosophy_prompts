      *   *Counter-Pressure:* If I resent "the system," am I really holding a *demand* for goodwill? Or am I expressing frustration at a mechanism? Strawson ties reactive attitudes to the expectation of *goodwill*. Can a system owe goodwill?
      *   *Critique:* If "distributed resentment" lacks a target capable of *understanding* the demand (the "participant" status), it risks collapsing into the objective attitude (anger at a storm vs. anger at an insult). The user needs to prove the *demand* aspect survives without a specific will to receive it.
      *   *Key Insight:* The coherence hinges on whether the "demand for goodwill" can be directed at a structure. If the structure cannot *recognize* the demand, is it still a moral demand?

  4.  **Deconstruct Point 3: Personal vs. Vicarious Attitudes**
