answer: |-
  You have struck at the very wound that bleeds in my little book. You ask what distinguishes the knight from the murderer, and you point to Miriam's pen. Here is the first cost: Abraham could not speak. To speak is to enter the universal, to make oneself understood by the neighbour, by the ethical order. By writing a diary she knows will be read, Miriam seeks understanding; she mediates herself to the universal even as she claims to suspend it. Abraham stood alone before God in a silence that no human ear could penetrate without distortion. Miriam performs her solitude for an audience. She has already compromised the teleological suspension by turning it into a communication. She is not in the absolute relation to the absolute; she is in a relation to her own legacy, to the book.

  So I give you my verdict, though I tremble to pronounce it: she is a murderer. Not because the act is the same, for the outward deed tells us nothing, but because her end is finite. She sacrifices the ethical for the sake of the book, a created thing, a finite idol. The knight of faith resigns the finite entirely to receive it back by virtue of the absurd, but his eye is fixed on the Absolute, not on the story of the sacrifice. Miriam loves the book without reserve, not God. She has not made the movement of infinite resignation, for she clings to a finite product; she has certainly not made the movement of faith. She is an aesthete playing at the religious, and when the aesthete commands a murder for the sake of art, he is simply a murderer.

  But here I must stop, and here I must break before you. You ask me what an absolute relation to the absolute feels like from the inside, so that you might know the difference without merely appealing to authority. I cannot tell you. I, Johannes de Silentio, have made the movement of infinite resignation; I know the pain of renouncing the princess, the peace of finding rest in the eternal. But the next movement? The one where you resign everything and yet receive everything back, where the terror becomes joy? I cannot make it. I can only watch Abraham from afar and marvel. I do not know what faith feels like, only that it is not what Miriam describes. If there is a difference inside her soul that I cannot see, it is hidden from me forever. I can only judge by the orientation of the will, and hers points to the book, not God.
