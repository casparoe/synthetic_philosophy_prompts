          5.  Final verdict (Don't reopen).
          6.  What to say to the Treasurer.

      *   *Refining the Argument:*
          *   The Treasurer is applying Expected Utility Theory (EUT).
          *   The Committee is applying something closer to Prospect Theory (Kahneman & Tversky) or simply prudent fiduciary management.
          *   The "Donor" argument is crucial. In Year 1, avoiding the 1% chance of zero is a reputational/fiduciary safeguard. In Year 2, both C and D have high chances of zero (89% and 90%). The "safety" argument disappears in Year 2, so the committee maximizes potential gain (100 vs 20). This makes the choices contextually consistent even if mathematically inconsistent under EUT.
