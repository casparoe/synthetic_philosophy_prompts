      *   *Check:* Is it accessible? Need to explain "individuation" clearly for the physicists and "wavefunction" clearly for the philosophers.
      *   *Check:* No citations. Use "Schrödinger's position," "the Advaita tradition," "standard Copenhagen interpretation."

