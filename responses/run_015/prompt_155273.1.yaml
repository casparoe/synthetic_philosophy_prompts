      *   Check vocabulary (e.g., "latent variable," "Fundamental Attribution Error," "functionalist," "ontological commitment").
      *   Ensure the "Must-Land" is clearly flagged.

  9.  **Final Review against Constraints:**
      *   Ordered by damage? Yes (QSH > MP > HH > PH).
      *   Specific vocabulary? Yes.
      *   Concessions included? Yes.
      *   2-minute replies? (Will keep word count tight).
