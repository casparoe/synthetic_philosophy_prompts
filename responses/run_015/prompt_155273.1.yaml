      *   *PH Reply:* Argue it's a "structural individualism." The scaffold is structural; the disposition is the interface.

  6.  **Identifying the "Must-Land" Reply:**
      *   It has to be the QSH reply. They are 8 out of 12 voting members essentially. If they think it's untestable mysticism, the project fails.
