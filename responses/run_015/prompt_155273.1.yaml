      *   *Best Idea:* "Can you name a single Reichsbahn scheduler who was punished for slowing down a deportation train?" If the answer is no, the "scaffolded disposition" implies choice where there was none. If the answer is yes, Goldhagen wins. If the answer is "we don't know," the QSH group pounces.
      *   *Actually, the fatal question is about the mechanism:* "If the 'scaffold' determines the behavior, what explanatory work is the 'disposition' actually doing?" (The Epiphenomenal Charge).
      *   *Let's go with the Counterfactual:* "If you remove the ideology, does the scaffold hold?"
      *   *No, the truly fatal one:* "Is this just a semantic compromise to avoid the moral horror of Goldhagen without the empirical rigor of Browning?" (The "Fence-Sitting" Accusation).
      *   *Wait, the prompt asks for the question I hope nobody asks.*
      *   *Selection:* "Can you identify a specific archival trace that distinguishes 'moral distancing' from 'standard bureaucratic record-keeping'?" This attacks the operationalization directly. If I can't point to the document, the QSH group eats me alive.

  8.  **Refining the Output:**
