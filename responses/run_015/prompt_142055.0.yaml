answer: |-
  You have identified the central tension in practical rationality: the conflict between **Diachronic Rationality** (being a coherent person over time) and **Synchronic Rationality** (being a coherent agent at this specific moment).

  Your current hypothesis ("fine if the world changed, not fine if only you moved") fails because it treats all internal changes as equal. It doesn't distinguish between a *transient urge* (which should be overruled) and a *legitimate value update* (which should be respected).

  Here are two candidate principles that separate your cases cleanly. They divide your list into "Time/Willpower" cases and "Logic/Structure" cases.

  ### Principle 1: The Principle of Diachronic Stewardship
  **Statement:** A past self has authority to bind a future self only when the commitment serves a **stable, long-term interest** of the whole person against a **predictably transient urge** of the local self. Conversely, a future self has authority to override a past self when the past commitment was based on a **transient value** or imposes an **unforeseen welfare cost** on the sequence.

  **The Motivation:** This separates the *Flight* from the *Standing Order*. In both cases, "only you moved." But in the Flight case, January-you was protecting a stable goal (attend conference) from May-you's transient state (laziness/hassle-aversion). In the Charity case, January-you was imposing a permanent tax based on a transient state (piety), harming June-you's welfare without a stable justification.

  **How it rules your cases:**
  *   **Flight (Fine to bind):** Attending the conference is a stable interest. Wanting to back out in May is a transient urge (akrasia). January has authority.
  *   **Standing Order (Fine to cancel):** Giving 10% *forever* is a massive constraint. "Feeling pious" is a transient state. June-you is correcting a value error, not succumbing to weakness.
  *   **Running (Not fine to skip):** Fitness is a stable interest. "Don't feel like it" is a transient urge. Sunday has authority.
  *   **Eating (Fine to change):** There is no stable interest violated. Food preference is inherently local. Present-you has sovereignty.
  *   **Bedtime (Sunday has authority):** Rest is a stable interest for the whole week. "Wanting to stay up" is a transient Wednesday urge. Sunday's plan binds Wednesday.

  **The Verdict You Must Drop:**
  *   **The Bedtime Uncertainty:** You said you "go back and forth" on whether Sunday has authority. This principle forces you to decide: **Sunday wins.** If sleep is a genuine goal, Wednesday's renegotiation is just the same weakness as skipping the run. If you think Wednesday *should* win, you must admit the goal (sleep) wasn't actually stable/important, just a whim of Sunday's.

  ***

  ### Principle 2: The Principle of Constitutive Integrity
  **Statement:** Rationality requires that your choices be **structurally consistent** (transitive) and that your avoidance of information never violate the **constitutive aim** of the activity you are engaged in.

  **The Motivation:** This handles the *Apartments* and the *Researcher*. It distinguishes between ignoring information as a *tool* (Dessert) versus ignoring information as a *sabotage of the purpose* (Research). It also clarifies that logical consistency is a requirement of agency itself, not just a calculation of outcomes.

  **How it rules your cases:**
  *   **Apartments (Irrational):** Preference cycles (A>B>C>A) violate the logical structure of choice. It makes you a "money pump."
  *   **Apartments (Hidden/One-at-a-time):** Still irrational. The irrationality lies in the *structure of your preferences*, not in your knowledge of the cycle. You are still the person who would make those swaps.
  *   **Dessert Menu (Fine):** The aim is "enjoy a meal without regret." Ignoring the menu is an **instrumental** strategy to achieve that aim. It serves the activity.
  *   **Researcher (Wrong):** The aim is "discover truth." Declining a test because of the result is **constitutive** sabotage. It violates the definition of the activity.

  **The Verdict You Must Drop:**
  *   **The Apartment Uncertainty:** You said if the swaps are offered one at a time by different people, you are "much less sure" if it's irrational. This principle forces you to say: **It is still irrational.** Your preferences are intransitive. The fact that you don't *see* the pump doesn't mean you aren't *pumpable*. Rationality requires you to fix the preference cycle, not just avoid seeing it.

  ***

  ### Summary of the Trade-Off

  If you adopt these two principles, you gain a robust framework for almost all your cases, but you lose the comfort of ambiguity in two specific places:

  1.  **Bedtime:** You can no longer say "maybe Wednesday knows best." You must classify the 1am renegotiation as either a legitimate update (in which case Sunday was wrong to set the rule) or akrasia (in which case Sunday was right). Given your regret on Sunday, the principle dictates Sunday's authority was correct and Wednesday violated it.
  2.  **Hidden Swaps:** You can no longer say "it's less irrational if I don't see the cycle." You must accept that holding intransitive preferences is a structural flaw in your agency, regardless of whether the world exposes it.

  **Why this works better than your hypothesis:**
  Your hypothesis ("fine if world changed") couldn't explain why Flight (no world change) was good but Charity (no world change) was bad. These principles explain it by looking at the *nature of the internal change*: was it a transient urge attacking a stable goal (Flight), or a transient value imposing a permanent cost (Charity)? That is the distinction your intuition was tracking but couldn't name.
