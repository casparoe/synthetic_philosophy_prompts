      *   *Time Limit:* 20 minutes is short. The questions need to get straight to the point.
      *   *Half Class Unprepared:* I need to make sure the user summarizes the plot quickly at the start so everyone is on the same page. I should add a tip about that.

  7.  **Self-Correction/Review during drafting:**
