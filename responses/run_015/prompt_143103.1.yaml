  8.  **Final Polish:** Check against the "no reading list" and "no quotes" rules one last time. Ensure the distinction between the *stayers* (utilitarians) and *walkers* (deontologists/intuitionists?) is clear without using too much jargon. (Decided to keep jargon minimal since half the class hasn't read the text and might not be philosophy majors).

