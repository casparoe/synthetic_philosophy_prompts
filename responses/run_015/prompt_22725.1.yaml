answer: |-
  This is a strong, defensible, and intellectually fertile angle for a longform piece. You are effectively pivoting from a **metaphysical** account of supererogation (what *is* the act?) to a **functionalist** or **sociological** account (what *work* does the category do for us?).

  Here is a breakdown of the philosophical viability, the strength of your examples, and the conceptual distinctions you asked for.

  ### 1. Is this framing defensible?
  **Yes.** In analytic ethics, the "standard view" (following J.O. Urmson) defines supererogation negatively: an act is supererogatory if it is good, but not obligatory, and its omission is not blameworthy.

  Your critique—that this definition is "purely negative"—is a known objection in the literature. By arguing that supererogation tracks **social roles and institutional expectations**, you are aligning with a more pragmatic tradition (sometimes associated with role ethics or sociological accounts of morality).

  **The specific claim you are making:** Supererogation is not an intrinsic property of an act (like "causing pleasure"), but a relational property between an agent, an act, and a normative system.
  *   **Why it works:** It explains why the *same act* (running into a fire) changes moral categories depending on *who* does it (civilian vs. firefighter). If supererogation were intrinsic to the act, the actor's job title wouldn't matter. The fact that it does matters proves your point: the category is about the **boundary of duty**, and duties are socially assigned.

  **The risk to watch:** Hardline moral realists might argue you are conflating "what is morally heroic" with "what we *call* heroic." They would say the doctor and the passerby have the same *moral* duty to save a life, even if only the doctor has a *professional* duty.
  *   **Counter-move for your piece:** You can acknowledge this tension. Your argument is stronger if you claim that for the purpose of social coordination and praise, the **enforceable/assigned duty** is what matters, not the abstract moral ideal.

  ### 2. Are the examples (Kidney/Burning Building) weak?
  Actually, these are your strongest assets, specifically because of the **Doctor vs. Passerby** distinction you introduced.

  *   **The Burning Building:** This is excellent because it highlights the **role obligation**.
      *   *Passerby:* Supererogatory (Heroic).
      *   *Firefighter:* Obligatory (Professional Duty).
      *   *Doctor (in ER):* Obligatory (Professional Duty).
      *   *Doctor (off duty, passing by):* This is the interesting edge case. Usually treated as supererogatory, but sometimes morally pressured as obligatory. This nuance supports your point about "background norms."
  *   **The Kidney Donation:** This is slightly riskier but still usable.
      *   *Risk:* Some utilitarian philosophers (like Peter Singer) argue that if you can save a life at minimal cost to yourself, it *is* obligatory. If you use this example, be aware that a segment of your readers (and ethicists) will argue, "No, that should be required."
      *   *Why it still works for you:* It proves your point about **social norms**. Legally and socially, we treat kidney donation as a gift (supererogatory). If we changed the norm to "mandatory conscription of organs," it would cease to be heroic and become compliance. This perfectly illustrates your final sentence: *"If we made everyone a hero, heroism would disappear."*

  **Recommendation:** Lean heavily into the **Firefighter/Doctor vs. Passerby** contrast. It is the cleanest proof that "duty" is a function of social assignment, not just the act itself.

  ### 3. The "In-the-Weeds" Distinctions
  You asked for a cleaner distinction between permissibility, obligation, and credit. Here is the triad you need to keep straight to avoid philosophical muddles:

  1.  **Obligation (The Must):**
      *   *Definition:* You are required to do it. If you don't, you are blameworthy/wrong.
      *   *Example:* A doctor treating a patient in the ER.
  2.  **Permissibility (The May):**
      *   *Definition:* You are allowed to do it, and allowed to skip it. No blame either way.
      *   *Example:* Eating an ice cream cone. (This is merely permissible, not supererogatory).
  3.  **Supererogation (The Should, but Won't Blame):**
      *   *Definition:* It is permissible to skip, but **morally better** to do. Doing it earns **positive credit** (praise), not just the absence of blame.
      *   *Example:* The passerby rushing into the fire.

  **The Mistake to Avoid:**
  Don't imply that *all* non-obligatory good acts are supererogatory.
  *   *Scenario:* I give you a dollar. It's good. It's not required.
  *   *Is it Supererogatory?* Most philosophers say **no**. It's too trivial.
  *   *Your Fix:* Supererogation requires a threshold of **sacrifice** or **significant value**. This ties back to your argument about "expectations." We don't praise trivial good acts because they fall within the baseline of expected decent behavior. Supererogation is reserved for acts that exceed the **baseline of social expectation**.

  ### 4. Suggestions for the Draft
  Your draft is very good, but you can sharpen the philosophical precision without losing the journalistic voice.

  **Current:** "Supererogatory acts are usually described as things that are good to do but not required. The problem is that this definition makes the category sound purely negative..."

  **Critique:** You are right, but you can be more precise. The problem isn't just that it's negative; it's that it ignores the **source** of the requirement.

  **Proposed Tweak:**
  > "Philosophers typically define supererogatory acts as those that are good to do but not required. The problem is that this definition treats the category as a metaphysical leftover: an act is heroic simply because it fails to be obligatory. But in practice, heroism depends on the social and institutional background. A doctor in an emergency room has a duty to act that a passerby does not; the passerby's act looks heroic partly because the hospital system has not assigned them that duty. Supererogation, then, is not just a bin for morally optional good acts. It is a way of tracking where our practices of role, expectation, and praise are doing work. If we made everyone a hero, heroism would disappear—not because the actions became less good, but because the background norm shifted, turning what was once a gift into a bill we expect to be paid."

  ### 5. One Concept to Research: "The Demandingness Objection"
  If you want to add depth to your reporting, look up the **"Demandingness Objection"** in moral philosophy.
  *   **The Concept:** If a moral theory (like Utilitarianism) requires us to maximize good at all times, it leaves no room for supererogation. Everything becomes obligatory.
  *   **The Connection:** Critics argue this makes morality too "demanding" for humans to live by. We *need* a category of supererogation to have a livable life.
  *   **Your Angle:** This supports your thesis. We *maintain* the category of supererogation not just to describe acts, but to protect a sphere of personal freedom. We *choose* not to make kidney donation obligatory because we value bodily autonomy more than the extra lives saved. Heroism exists where we have collectively agreed to stop enforcing duty.

  ### Summary Verdict
  You are not smuggling in a mistake; you are identifying a limitation in the standard definition. Your framing is defensible, provided you distinguish between **trivial optional acts** (eating ice cream) and **sacrificial optional acts** (kidney donation). The doctor/passenger distinction is your "killer app" here—it proves that duty is contextual, not intrinsic. Keep that front and center.
