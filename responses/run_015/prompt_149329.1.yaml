answer: |-
  To engage *Blade Runner* as a text in the metaphysics of vagueness, we must first sharpen the distinction between the two competing frameworks you have identified. Timothy Williamson's epistemicism posits that vague predicates like "is human" or "is bald" possess classical truth conditions; there is a sharp, precise boundary in reality where the predicate switches from true to false. Our inability to locate this boundary is a failure of knowledge, not a feature of the world. Vagueness is ignorance. In contrast, supervaluationism treats vagueness as semantic indeterminacy. There is no single sharp boundary; rather, there is a range of "admissible precisifications." A statement is super-true only if it holds across all admissible ways of making the predicate precise. In borderline cases, there is simply no fact of the matter.

  *Blade Runner* does not merely illustrate these positions; it stages a conflict between them. The narrative architecture begins with an epistemicist assumption and dissolves into a supervaluationist reality, forcing the viewer to confront the moral catastrophe that occurs when a legal system demands epistemic precision in a supervaluationist world.

  Consider the Voight-Kampff (VK) test. In its design and deployment, the test is a purely epistemicist instrument. It operates on the assumption that there is a hidden, sharp boundary between human and replicant, located somewhere in the latency of empathic response. When Deckard administers the test to Rachael in the opening act, the camera lingers on the extreme close-up of the eye, the galvanic skin response, and the fluctuating needle. This visual language suggests a Williamsonian universe: the truth is present, hidden behind the iris, waiting to be uncovered by sufficient measurement. Deckard acts as the epistemic agent, believing that if he can just measure the capillary dilation accurately enough, he will cross the threshold from ignorance to knowledge. The tension in this scene derives from the epistemicist anxiety that the boundary is unknowable, not that it does not exist. When Deckard declares Rachael a replicant, he asserts he has found the line.

  However, the film's narrative trajectory systematically undermines this epistemic confidence, pushing us toward a supervaluationist interpretation of the predicate "human." This shift is dramatized through the destabilization of memory. For the epistemicist, memory is a historical fact that helps locate the boundary. For Rachael, memory is the site of indeterminacy. She possesses memories of a spider outside her window, memories that feel phenomenologically identical to human recollection but are ontologically implanted. Here, the film introduces the problem of admissible precisifications. If "human" is precisified by biological origin, Rachael fails. If "human" is precisified by psychological continuity and emotional depth, Rachael passes. The film refuses to privilege one precisification over the other. Consequently, the statement "Rachael is human" becomes neither super-true nor super-false. It is indeterminate.

  This indeterminacy is not treated as a logical puzzle but as an existential crisis. This is where the philosophical lens illuminates the film's moral urgency. In formal debates about vagueness, the stakes of a borderline case are typically semantic confusion. In *Blade Runner*, the stakes are ontological extermination. To be categorized as a replicant is to be "retired." The tragedy of Rachael is that she lives in the borderland where the predicate is indeterminate, yet the state demands a binary verdict. The film argues that the epistemicist enforcement of a sharp boundary (the law that mandates retirement) is a violence committed against a supervaluationist reality. The VK test attempts to force a super-true/false verdict onto a case that is metaphysically resistant to such classification.

  The ambiguity surrounding Deckard himself serves as the narrative enactment of this supervaluationist gap. Whether Deckard is a replicant is less important than the fact that the film makes the question undecidable. If we adopt an epistemicist reading of Deckard, we must assume Ridley Scott hid a fact we cannot know. But cinematically, the film argues for indeterminacy. Deckard's memories (the unicorn dream), his emotional detachment, and his eventual bonding with Rachael place him in the same semantic field as the replicants he hunts. In the final act, the distinction between hunter and hunted collapses. If "human" is vague, Deckard is a borderline case. The film suggests that in the presence of such vagueness, the moral obligation shifts from categorization to recognition. Roy Batty's death scene is the culmination of this argument.

  Batty's "Tears in Rain" monologue is often read as a claim to humanity. Through the lens of vagueness, it is better read as a transcendence of the category entirely. Batty does not prove he is human; he demonstrates that the category "human" is insufficient to capture the value of his existence. As he dies, the white dove released into the gray sky symbolizes the release of the soul from the binary constraint of the VK test. Batty saves Deckard not because Deckard is human, but because Deckard is a fellow being facing mortality. Here, the supervaluationist picture illuminates the character's choice: Batty acts on a precisification of "personhood" based on shared suffering, whereas the Tyrell Corporation and the police operate on a precisification based on manufacturing origin. The film validates Batty's precisification as morally superior, suggesting that when predicates are vague, we ought to adopt the admissible precisification that maximizes moral inclusion.

  However, we must also recognize where this philosophical reading strains against the grain of the cinematic text. A rigorous supervaluationist account requires that there be no fact of the matter. Yet, *Blade Runner* is a noir thriller, and noir relies on hidden truths, not metaphysical openness. The dramatic ambiguity of Deckard's status may serve the needs of mystery rather than metaphysics. If Deckard is simply a borderline case, the tension of the hunt is diluted; if he is a replicant unaware of his nature (the epistemicist reading of his own identity), the tragedy is sharper. The film sometimes wavers between treating the ambiguity as a profound ontological statement and treating it as a plot device to sustain suspense. Furthermore, the VK test is shown to be fallible, not just in principle but in practice (Rachael didn't know). This suggests an instrumental failure rather than a metaphysical one. If the test is just broken technology, we don't need supervaluationism to explain the error; we just need better engineering. The philosophical reading risks over-determining the text if it ignores the possibility that the film is simply about the failure of technology to measure the soul, rather than the semantic structure of "soul" itself.

  Nevertheless, *Blade Runner* adds something vital to the philosophical debate that formal arguments miss: the phenomenology of the border. Williamson and the supervaluationists argue about truth values in the abstract. The film forces us to feel what it is like to stand on the wrong side of a sharp line that shouldn't exist. When Rachael asks Deckard if he has ever taken the test himself, the camera holds on her face, searching for a reaction that would confirm her suspicion. In that moment, the abstract problem of tolerance principles becomes a visceral fear of non-existence. The film suggests that vagueness is not merely a property of language or knowledge, but a protective buffer for life. To insist on sharp boundaries where there are none is not just a logical error; it is a form of murder.

  Ultimately, *Blade Runner* functions as a critique of epistemicism in the ethical realm. It posits a world where the Williamsonian sharp boundary is enforced by law, but where the lived reality is irreducibly supervaluationist. The "tears in rain" are the residue of experiences that cannot be captured by the binary logic of the VK test. The film concludes that while we may not be able to solve the metaphysical problem of vagueness—we may never know exactly where the human ends and the machine begins—we can choose how we act in the shadow of that uncertainty. The moral imperative is to treat the borderline cases as if they were super-true members of the moral community. In doing so, *Blade Runner* transforms a semantic debate into a soteriology, suggesting that in a vague world, empathy is the only admissible precisification that matters.
