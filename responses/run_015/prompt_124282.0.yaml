answer: |-
  **1. Mises: The Dual Variable Problem**
  Mises argues rational allocation is solving a global constrained optimization LP. Market prices are the dual variables (shadow prices) required to value constraints. Without a market in means of production, duals are undefined; the gradient is zero. You cannot optimize.
  *   **Maps:** Market prices = dual variables; Rationality = computability.
  *   **Distorts:** Reduces economic rationality to mathematical feasibility.
  *   **No Counterpart:** The legal/ethical basis of ownership defining the constraint set.

  **2. Hayek: The Compression Problem**
  Hayek argues prices are a lossy compression algorithm for dispersed local state. They communicate scarcity without transmitting raw data.
  *   **Maps:** Shadow prices signal constraint tightness to edge bidders.
  *   **Distorts:** "Tacit knowledge" becomes "unlogged features."
  *   **No Counterpart:** The claim that data *does not exist* until action is taken.
  *   **Shift vs. Hayek:** Hayek is stronger than distribution shift. Shift implies a stable $P(data)$ that changed. Hayek claims the data generating process is endogenous to the pricing policy.

  **3. Lange: The Dual Decomposition**
  Lange proposes a central planner runs dual decomposition. It announces prices, observes surpluses (constraint violations), and updates prices via gradient ascent.
  *   **Maps:** Planning board = Central optimizer; Iteration = Gradient steps.
  *   **Distorts:** Assumes environment static during convergence.
  *   **No Counterpart:** Political incentives of the planners.
  *   **Off-policy:** Yes, Lange claims you can evaluate counterfactual prices using observed surplus data. Hayek objects that this is invalid off-policy evaluation because the surplus data is contaminated by the previous policy (distribution shift/endogeneity).

  **Residue Report**
  Your hunch is correct. Your framework assumes a fixed objective function (proxy metric) for the quarter. Hayek argues preferences and production possibilities are not fixed parameters but emergent properties of the trading process itself. You optimize *given* preferences; he argues preferences are *discovered* via trade. This is a blind spot in your framework, not vagueness in his. You model behavior conditional on existing inventory. A real economy involves endogenous innovation where supply creates demand.

  Regarding your simulator: Its success supports Lange only because your environment is bounded. In ad tech, the "true objective" (profit) is enforced by an external market. The proxy metric (e.g., click-through rate) is correlated with that external signal. In a full economy, there is no external signal. The planner's proxy (tonnage of steel produced) decouples from the true objective (human welfare). Your simulator learns behavior conditional on existing options; it cannot simulate the creation of new options that render old preferences obsolete. Thus, your success is an artifact of optimizing within a market-defined boundary, not evidence that central planning solves the global problem.

  **The Industry Question**
  Your industry is Lange's mechanism nested inside Mises's boundary. Internal shadow prices work because the firm is an island of calculation surrounded by a sea of market prices that validate the top-level objective (revenue). If the entire economy were one firm, there would be no external profit signal to correct internal shadow prices. They would converge to local optima unrelated to value. Internal planning proves Lange works *only* when the objective function is set by a market Mises described. You are running a planned economy inside a bottle, where the market outside defines the bottle's shape.
