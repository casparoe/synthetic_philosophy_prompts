answer: |-
  Here are ten interview questions designed to navigate the theoretical commitments of the fiduciary model while pressing on its structural vulnerabilities. Each includes a follow-up anticipating her manuscript's defense and a host's note to detect evasion.

  ### 1. The Missing Architecture of Trust
  **Question:** You insist the fiduciary claim is structural, not metaphorical. But in private law, a fiduciary relationship requires a settlor to create the trust, an undertaking to accept the role, ascertainable beneficiaries, and a forum to enforce breaches. The state has no settlor, citizens haven't undertaken to be beneficiaries, and there is no court above the state to enforce its fidelity. If those constitutive mechanisms are absent, what work is the word "fiduciary" actually doing that "just governance" doesn't already do?

  *   **Follow-up:** If you reply that public law creates its own structure, does that mean the state *constitutes* the very trust it is supposed to be bound by? And if so, isn't that like a trustee writing their own trust deed to limit their own power?
  *   **Host's Note:** Listen for whether she admits the analogy breaks down on *enforcement* or tries to pivot to "normative structure" without explaining how it binds.

  ### 2. Redundancy vs. Precision
  **Question:** Let's press on that redundancy worry. If the fiduciary duty just means the state must be loyal, transparent, and non-arbitrary, isn't that simply a restatement of the rule of law or democratic legitimacy? Why should I incur a duty of obedience because you call the relationship "fiduciary" rather than just saying the state has a duty to govern well?

  *   **Follow-up:** You might say fiduciary theory specifies *who* the duty is owed to. But if the beneficiaries are "the public," doesn't that collapse back into the standard utilitarian or common-good accounts you're trying to move past?
  *   **Host's Note:** Watch for a vague appeal to "relationality." Push if she can't name a specific obligation fiduciary theory generates that a "govern well" theory does not.

  ### 3. The Unbundling Proviso and Private Power
  **Question:** Your "unbundling proviso" suggests obligation tracks competent fiduciary performance, not statehood. Does this commit you to saying that if a private protection agency or a corporate enclave administered a territory more loyally and transparently than the incumbent government, citizens would owe *it* compliance instead?

  *   **Follow-up:** If you say yes, aren't you legitimizing a form of neofeudalism where political authority is auctioned to the most efficient administrator? If you say no, doesn't that reveal that territorial sovereignty matters more than your theory admits?
  *   **Host's Note:** She will likely bite the bullet. Listen for whether she tries to smuggle "democratic authorization" back in as a fiduciary requirement.

  ### 4. Territoriality and the Occupying Power
  **Question:** Following on that: imagine a benevolent occupying administration that replaces a corrupt regime and immediately establishes transparent, loyal, non-arbitrary procedures. On your account, does the duty of obedience transfer to the occupier immediately? If not, what feature of the *original* state survives the loss of fiduciary performance?

  *   **Follow-up:** If you argue the occupier lacks standing because they weren't "appointed," aren't you relying on a consent or historical entitlement view you explicitly rejected in your opening move?
  *   **Host's Note:** This traps her between her "unbundling" claim and the intuition that occupation is illegitimate. Watch for waffling on "temporary" vs. "permanent" authority.

  ### 5. The Epistemic Burden of Proportionality
  **Question:** Your "proportionality proviso" says authority is forfeited piecemeal. But to know what I owe, I need to know which domains are just. Given that budget priorities, predictive policing algorithms, and carceral conditions are empirically contested, are you asking ordinary citizens to become auditors of state performance before they can know if they have a duty to comply?

  *   **Follow-up:** If you say citizens rely on "public reason" or proxies, what happens when those proxies disagree? Does the duty to comply vanish until the empirical dispute is settled?
  *   **Host's Note:** If she says "citizens judge for themselves," you have her on the subjectivization hook (see Q6). If she says "experts judge," she's created an epistocratic bottleneck.

  ### 6. Subjectivization and the Anarchist Conclusion
  **Question:** If every citizen is the final judge of whether the state has breached its fiduciary loyalty in a specific domain, doesn't the "duty" to obey collapse into a license to comply only when one independently approves of the law? How is this materially different from the philosophical anarchism you claim to avoid?

  *   **Follow-up:** You might say there are *objective* standards of breach. But in the absence of a supreme enforcer, who applies those objective standards in the moment of decision—the individual or the state?
  *   **Host's Note:** Listen for a distinction between "justified breach" and "arbitrary breach." If she can't explain the constraint on individual judgment, the theory is voluntarist.

  ### 7. The Dimmer Switch and Law's Claim to Settle
  **Question:** Law characteristically claims to settle what must be done regardless of our own assessment. If authority is a "dimmer switch" that brightens or dims based on performance, doesn't that undermine law's ability to coordinate action in precisely those high-conflict cases where we need it most?

  *   **Follow-up:** If the law's authority fluctuates with my assessment of its performance, doesn't it lose its peremptory force? Why treat it as authority rather than just advice weighted by performance?
  *   **Host's Note:** She may argue law's claim is often false. Push back: If the claim is false, is it still *law* in the sense that generates obligation?

  ### 8. Civil Disobedience as Address vs. Strategy
  **Question:** You demote the requirements of publicity, nonviolence, and accepting punishment from duties to mere strategy. But if I disobey secretly, violently, or flee punishment, have I not severed the communicative bond with the community? How can disobedience function as a form of political *address* if it doesn't signal fidelity to the rule of law?

  *   **Follow-up:** If you reply that effectiveness matters more than fidelity, aren't you reducing political resistance to a power struggle rather than a moral appeal to the community's shared principles?
  *   **Host's Note:** Watch for a utilitarian defense of disobedience. The trap is whether her model preserves the *civic* nature of protest.

  ### 9. The Origin of the Fiduciary Standing
  **Question:** We've discussed the maintenance of authority, but what generates the initial standing? In private trusts, the settlor confers authority. In your model, does the state simply *declare* itself a fiduciary, or is this status thrust upon it by the needs of the subjects?

  *   **Follow-up:** If it's thrust upon the state by necessity, aren't we back in the "rescue-based" or "natural duty" accounts you said were insufficient at the start of the conversation?
  *   **Host's Note:** This checks for consistency with her critique of the "standard menu." If the duty arises from need, it looks like rescue. If it arises from declaration, it looks like consent.

  ### 10. Falsifiability and the "Research Program" Dodge
  **Question:** Finally, I want to pin down the stakes. Describe a specific empirical case or a normative scenario where your fiduciary model yields a clearly wrong conclusion—one that would force you to abandon the theory rather than just tweak the "provisos."

  *   **Follow-up:** Please avoid framing the answer as "that's a topic for future research." I'm asking for a failure condition: what would count as evidence that political obligation is *not* fiduciary?
  *   **Host's Note:** If she describes a problem her theory can solve with more work, interrupt. You need a scenario where the theory *fails*, not where it is *incomplete*.
