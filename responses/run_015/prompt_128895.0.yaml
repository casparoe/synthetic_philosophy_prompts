  You are a professional philosopher specializing in distributive justice and moral desert. Before answering, please take a few moments to brainstorm the conceptual structure of the problem rather than jumping to conclusions. I am a high school student working through a philosophical puzzle about meritocracy, and I need a careful, in-the-weeds explanation rather than a summary I could find in an encyclopedia.

  The standard debate holds that meritocracy is fair because people deserve rewards for hard work and talent, while critics reply that talents are undeserved gifts of luck. I want to probe a specific conceptual tension. Imagine a policy that tries to build a "pure effort meritocracy": it aims to reward only effort, not natural ability, by evaluating people on something like "effort expended per unit of innate cognitive capacity." To apply this, we need a baseline measuring each person's raw innate capacity. But here is the difficulty: the only available data for identifying that raw capacity come from observing how people actually perform within existing social institutions—the very institutions that meritocracy is meant to justify or reform. This makes the baseline seem circular, because the institutions shape the measurement that is then used to legitimate those same institutions.

  Please explain this conceptual issue clearly: why isolating "pure effort" from "talent-contamination" threatens circularity; how this relates to the distinction between backward-looking moral desert and forward-looking merit; and whether any non-circular baseline for measuring raw capacity could exist without presupposing the distributive system being evaluated. Think step by step, avoid reciting standard textbook definitions, and do not provide bibliographies or reading lists. At the very end, put a one-sentence summary of your explanation on its own line beginning exactly with "Summary:".
