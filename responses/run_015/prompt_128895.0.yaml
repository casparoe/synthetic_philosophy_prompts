answer: |-
  This is a sophisticated puzzle that cuts to the heart of why implementing true meritocracy is philosophically precarious. To understand why the "pure effort" policy runs into a wall, we have to look closely at the mechanics of how we measure human potential and what we mean when we say someone "deserves" something.

  Let's start by unpacking the formula implicit in your scenario. The policy assumes that human performance can be divided into two distinct components: innate capacity (talent) and willful exertion (effort). In a mathematical sense, you might imagine it as $Performance = Capacity \times Effort$. The goal of the policy is to reward the $Effort$ variable while neutralizing the $Capacity$ variable. To do this, the state must solve for $Effort$ by observing $Performance$ and dividing it by an estimate of $Capacity$.

  Here lies the first conceptual snag: we cannot observe $Capacity$ directly. You cannot open a person's skull and read a number that says " innate cognitive potential: 85." We can only infer capacity by looking at what people achieve. But what people achieve is $Performance$, which is already the product of both capacity and effort. To isolate capacity, we usually look for people who seem to achieve high results with minimal apparent struggle, or we use standardized proxies like reaction-time tests or abstract puzzles.

  This is where the circularity you identified emerges. Any test or metric we use to measure "raw capacity" is itself a product of social design. Consider a test designed to measure "raw logical reasoning." The creators of that test had to decide what counts as logic, what symbols to use, and how much time to allow. These decisions are influenced by the existing educational institutions and cultural values of the society creating the test. If our schools prioritize verbal speed over spatial visualization, the "capacity" test will inevitably measure verbal speed.

  Consequently, when we use that test to establish a baseline for innate capacity, we are using a ruler manufactured by the very system we are trying to judge. If the school system favors students from wealthy backgrounds who have had better nutrition and early stimulation, those students will score higher on the "capacity" baseline. The policy will then interpret their high performance as partly due to high innate capacity, thereby lowering the amount of "effort" credit they receive relative to a disadvantaged student with the same scores. However, because the baseline itself was contaminated by prior social advantages (nutrition, early education), the calculation is skewed. The institution shapes the measurement of capacity, and that measurement is then used to justify the rewards distributed by the institution. We are using the output of the system to validate the fairness of the system.

  This measurement problem forces us to distinguish between two different reasons we might want to reward people: backward-looking moral desert and forward-looking merit.

  Backward-looking moral desert is about what you owe someone because of what they have already done. It is retributive or compensatory in nature. If I say a worker *deserves* a bonus because they sacrificed their weekend to work, I am making a claim about their moral agency and the burden they bore. For this claim to hold, the "effort" must be truly theirs. If their ability to exert effort was itself determined by lucky upbringing (e.g., they have a high "effort tolerance" due to stable parenting), then even the effort is contaminated by luck. But even setting that aside, if we cannot accurately measure their effort relative to their capacity because our capacity baseline is flawed, we cannot know if they truly deserve the reward. We might be rewarding them for luck disguised as effort.

  Forward-looking merit, by contrast, is about incentives. It asks: "If we reward this behavior, will it produce good outcomes for society?" This view doesn't care deeply about whether the talent was luck or whether the effort measurement is perfectly pure. It cares about utility. If rewarding "performance per unit of estimated capacity" incentivizes people to work harder, a forward-looking theorist might support the policy even if the baseline is slightly circular. However, your puzzle targets the *desert* claim. The policy claims to be fair because it gives people what they morally deserve based on their contribution. If the measurement of that contribution is circular, the moral desert claim collapses, even if the forward-looking incentives remain useful.

  So, could there be a non-circular baseline? To escape the circle, we would need a measure of capacity that is completely independent of social institutions. Some might suggest biological measures, like neural processing speed or brain volume. However, these are also influenced by environmental factors like nutrition, exposure to toxins, and early childhood stress, which are themselves distributed by social institutions. A "raw" biological baseline would still reflect prior social luck. Furthermore, even if we found a purely biological metric, it is unclear why *that* specific biological trait should be the definition of "capacity" for economic reward. Choosing neural speed over empathy or creativity is itself a value judgment made by the society distributing the rewards.

  Therefore, any baseline we choose presupposes a view of what humans are for and what kinds of potential matter. Since those views are generated within the social system, we cannot step outside the system to find a neutral vantage point. The attempt to purify meritocracy reveals that "effort" and "capacity" are not natural kinds waiting to be measured, but categories defined by the social structure itself.

  Summary: The attempt to isolate pure effort for moral desert fails because measuring innate capacity requires institutional metrics that are themselves shaped by the social structures they aim to evaluate, creating a circular justification that conflates backward-looking responsibility with forward-looking efficiency.
