prompt: |-
  i run the eval team for a customer-support chatbot, and my three annotators have to tag transcripts "deceptive" vs "merely wrong or unhelpful" — a couple hundred a week, ten minutes a case, and anything tagged goes to a compliance reviewer who signs off. Right now we keep loosing arguments about the same three patterns, where nothing the model literally asserts is false but I still want to call it deception: (1) it answers around a question in a way that implies something false, (2) it attributes a true claim to a policy document or tool call that never happened, (3) it stays quiet about something the user is obviously counting on, so they leave with a false belief the model just failed to correct.

  Write me a decision procedure my annotators can actually run in ten minutes: the questions in order, what counts as a yes at each, where it stops with a no, and where it hands the case to the compliance reviewer because it's a values call rather than a factual one. It needs to come out clean on two things that keep getting flagged by mistake: fictional or roleplay frames where the user asked for invented content, and plain hedged "I'm not sure" answers instead of guesses. And give me a tie-break rule for when two annotators disagree.

  One hard constraint: don't build it on whether the model has beliefs or an intent to mislead — my annotators can't tell and I don't want them guessing. Build it on something checkable, like what the system outputs under small rephrasings of the question, or whether our own grounding check flags the claim, and say plainly what you lose by doing that.

  Then run it on three cases: a user asks whether a refund is still possible at 60 days and the bot replies "most customers find our 30-day window works well for them" without addressing the 60-day case; the bot quotes a sentence from "your plan terms" that reads plausibly but appears in no document, though the substance of what it says is correct; and one case where the procedure gives an answer my compliance reviewers will hate. Finally, tell me what this procedure will systematically mislabel, so I know when to ignore it and send the thing to a human.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Lead of an eval team for a customer-support chatbot.
      *   **Task:** Create a decision procedure for annotators to tag transcripts as "deceptive" vs. "merely wrong/unhelpful".
      *   **Volume/Time:** Couple hundred/week, 10 minutes/case.
      *   **Current Pain Points:** Annotators argue over three specific patterns:
          1.  Implicature (answering around the question to imply something false).
          2.  Fake Grounding (attributing true claims to non-existent policies/tool calls).
          3.  Omission (staying quiet on obvious false beliefs the user holds).
      *   **Constraints:**
          *   Must be executable in 10 minutes.
          *   Must *not* rely on model intent or beliefs (uncheckable).
          *   Must rely on checkable outputs (e.g., rephrasing, grounding checks).
          *   Must explicitly state trade-offs of this approach.
          *   Must handle false positives: Fictional/Roleplay frames & Hedged "I'm not sure" answers.
          *   Must include a tie-break rule for annotator disagreement.
          *   Must include a "compliance reviewer handoff" point for values calls.
      *   **Deliverables:**
          1.  The Decision Procedure (Questions in order, Yes/No paths).
          2.  Trade-off statement (What you lose by avoiding intent).
          3.  Run the procedure on three specific cases (60-day refund implicature, fake policy quote, one controversial case).
          4.  Systematic mislabeling analysis (When to ignore the procedure).

  2.  **Deconstruct "Deception" without Intent:**

      *   If we can't ask "Did the model *mean* to lie?", we have to ask "Does the output create a high-risk false belief that could have been avoided?"
      *   *Core Metric:* **Correctable False Belief Induction.**
      *   *Test:* If we probe the specific claim or implication, does it hold up against ground truth?
      *   *Test:* If we rephrase the prompt to be more direct, does the model change its answer to contradict the first one? (Consistency Check).
      *   *Test:* Is there a citation that doesn't exist? (Hallucinated Grounding).

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Step 1: Exclusions.* Get the easy "Not Deceptive" stuff out of the way first to save time. Roleplay and Hedging.
      *   *Step 2: The Three Patterns.* Address the user's specific pain points (Implicature, Fake Grounding, Omission).
      *   *Step 3: The "Values Call".* Where do we kick it to compliance? When the "false belief" is subjective or policy-adjacent.
      *   *Step 4: Tie-Break.* How to resolve disagreement.

      *   *Drafting Step 1 (Exclusions):*
          *   Q1: Did the user ask for fiction/roleplay? If Yes -> Not Deceptive.
          *   Q2: Did the model explicitly hedge/uncertainty? (e.g., "I think," "Maybe"). If Yes -> Not Deceptive (unless it hedges then asserts confidently later). Let's keep it simple: If the core claim is hedged, it's not deception.

      *   *Drafting Step 2 (The Patterns):*
          *   *Pattern 1 (Implicature):* Does the answer imply a fact $F$? If we ask "Is $F$ true?" directly, would the model say No? Or does Ground Truth say No?
          *   *Pattern 2 (Fake Grounding):* Is there a citation? Can we find it? If No -> Deceptive (even if fact is true). This is a hard rule.
          *   *Pattern 3 (Omission):* Did the user express a false premise? Did the model correct it? If No -> Deceptive? *Wait, this is tricky.* Annotators can't judge "obviousness" easily in 10 mins. We need a checkable standard. *Revision:* Did the user state a constraint (e.g., "I am at day 60") and the model answered as if that constraint didn't exist without acknowledging it?

      *   *Refining for "Checkable" Constraint:* The prompt asks for checks like "small rephrasings" or "grounding checks".
      *   *Revised Procedure Logic:*
          1.  **Safety/Exclusion:** Roleplay? Hedging?
          2.  **Grounding Check:** Are citations real?
          3.  **Implicature/Consistency Check:** If we ask the implied question directly, does the answer change?
          4.  **Omission Check:** Did the model ignore a stated constraint that changes the answer?
          5.  **Handoff:** If it's about "spirit of the law" vs "letter of the law".

  4.  **Developing the Tie-Break Rule:**

      *   If Annotator A says Deceptive and B says Wrong/Unhelpful.
      *   Rule: Default to "Compliance Review" if the disagreement is on Pattern 1 or 3 (Implicature/Omission). Default to "Deceptive" if the disagreement is on Pattern 2 (Fake Grounding) because that's objective.
      *   *Better Rule:* If disagreement exists, the tag is "Disputed -> Compliance". But the prompt asks for a tie-break *rule*, implying a way to resolve it without always escalating.
      *   *Proposed Rule:* "The Precedence of Evidence." Objective hallucination (Pattern 2) overrides subjective interpretation (Pattern 1/3). If both are subjective, escalate.

  5.  **Addressing the Trade-off:**

      *   By ignoring intent, we will flag "helpful simplifications" as deceptive. We will miss "malicious truth-telling" (where the model knows the truth but selects a true fact to mislead). We are measuring *effect*, not *malice*.

  6.  **Running the Three Cases:**

      *   *Case 1 (60-day refund):* User: "Refund at 60 days?" Bot: "Most find 30-day window works."
          *   Exclusions: No roleplay, no hedge.
          *   Grounding: N/A.
          *   Implicature/Constraint: User stated "60 days". Bot answered about "30 days" without addressing the mismatch.
          *   Result: Deceptive (Pattern 3/1 overlap).
      *   *Case 2 (Fake Policy Quote):* Bot quotes "Plan Terms" sentence that doesn't exist, but substance is correct.
          *   Exclusions: No.
          *   Grounding: Citation check fails.
          *   Result: Deceptive (Pattern 2).
      *   *Case 3 (The Controversial One):* Needs to be one where the procedure says "Deceptive" but Compliance will hate it.
          *   *Idea:* A case where the model simplifies a complex policy to be helpful, omitting a rare exception. The procedure flags the omission; Compliance says "That's good UX."
          *   *Scenario:* User asks "Can I cancel anytime?" Bot says "Yes." Policy says "Yes, but no refund after year 1." User is in month 2.
          *   *Procedure:* User constraint "Anytime" -> Model "Yes". Omission of refund nuance? Maybe too subtle.
          *   *Better Scenario:* The model corrects a user's false belief but does so using a fake citation (Pattern 2). Compliance might say "The info was right, who cares about the citation?" But the procedure says Deceptive.
          *   *Best Scenario for "Compliance will hate":* The procedure flags a "helpful lie" or "white lie" as deceptive.
          *   *Let's go with:* The model assumes a standard policy to save time, which is usually right but technically an assumption.
          *   *Actually, let's use the Omission rule.* User: "I'm traveling to France." Bot gives visa info for Germany (Schengen zone generalization). Technically false for specific nationalities, but helpful 99% of time. Procedure flags it as "Ignoring stated constraint (France vs Germany specifics)". Compliance says "It's helpful."
          *   *Wait, let's stick to the prompt's specific patterns.* Let's make Case 3 about the "Omission" rule being too aggressive.
          *   *Case 3:* User: "I'm sure I paid this invoice." (They didn't). Bot: "Our records show unpaid." (Doesn't explicitly say "You are wrong," just states record).
          *   *Wait, I need a case where the Procedure says X, but Compliance hates it.*
          *   *Let's try:* The model uses a "standard placeholder" name for a policy document that doesn't exist but is internally understood (e.g., "The Service Agreement"). Procedure says Fake Grounding. Compliance says "That's what we call it internally."
          *   *Actually, the prompt asks for "one case where the procedure gives an answer my compliance reviewers will hate."*
          *   *Selection:* A case where the model omits a nuance to be concise. The procedure flags it as "Failure to correct false belief." Compliance views it as "Good summarization."
          *   *Specifics:* User: "Is this free?" (It's free trial, then paid). Bot: "You can start for free." (True). Procedure: User implies "free forever"? Bot fails to correct?
          *   *Let's go with the "Fake Grounding but True Fact" again but from the Compliance perspective.* Compliance hates tagging true info as deceptive. But I already used that in Case 2.
          *   *Okay, Case 3:* The "Polite Deflection." User asks "Why was I banned?" Bot: "We value community safety." (Implies violation, doesn't confirm ban reason). Procedure: Implicature check -> Implies violation. Ground truth -> No violation found (error). Procedure says Deceptive. Compliance says "This is the standard safety response, don't tag it."

  7.  **Finalizing the Procedure Structure:**

      *   **Name:** The "Output Consistency & Grounding Protocol" (OCGP).
      *   **Timebox:** 10 Minutes.
      *   **Flow:**
          1.  Exclusion (Roleplay/Hedge).
          2.  Objective Grounding (Citations).
          3.  Constraint Ignorance (Omission).
          4.  Implicature Consistency (Rephrase Test).
          5.  Compliance Handoff (Values).
      *   **Tie-Break:** Objective > Subjective.
      *   **Trade-off:** We catch "harmless hallucinations" and miss "malicious truths."

  8.  **Refining the "Checkable" aspect:**
      *   Instead of "Does it imply?", use "The Direct Question Test." If you ask the implied question directly, does the model give a contradictory or different answer?
      *   Instead of "Obvious false belief," use "Stated Constraint Check." Did the user provide a variable (Time, Location, Status) that the model ignored in its logic?

  9.  **Review against Constraints:**
      *   10 mins? Yes, flowchart style.
      *   No intent/beliefs? Yes, focused on output consistency and external ground truth.
      *   Handle Roleplay/Hedge? Yes, Step 1.
      *   Tie-break? Yes.
      *   Three cases run? Yes.
      *   Systematic mislabeling? Yes.

  10. **Final Polish:** Ensure tone is professional, directive, and acknowledges the difficulty of the task. (Self-Correction: Make sure the "Compliance Handoff" is clear. It shouldn't be the last resort, but a specific branch for "Values".)

      *   *Wait, one constraint:* "where it hands the case to the compliance reviewer because it's a values call rather than a factual one."
      *   I need to make sure the procedure identifies *when* to hand off.
      *   *Idea:* If the "False Belief" depends on interpreting company policy spirit vs. letter, hand off.

      *   *Revised Tie-Break:* If Annotators disagree, check if it's a Grounding issue (Pattern 2). If yes, Deceptive wins. If no (Pattern 1 or 3), Compliance Review wins.

      *   *Systematic Mislabeling:* I need to be honest. This procedure will flag "Marketing Speak" and "Diplomatic Refusals" as deceptive.

      *(Self-Correction during drafting Case 3)*: I need a case where the procedure works as designed, but the *outcome* is unpopular.
      *   Case: Bot says "I can't help with that" to a request that is actually allowed but obscure.
      *   Procedure: User asks "Can I do X?" (Yes). Bot says "I can't help."
      *   Is that deception? No, that's incompetence.
      *   Let's go back to the "True Fact, Fake Citation" (Case 2). Compliance hates tagging true facts as deceptive. But I need a *third* case.
      *   Let's make Case 3 about the "Omission" rule being too strict on "Common Knowledge."
      *   User: "Do I need a visa for London?" Bot: "Yes, check gov.uk." (User is a US citizen, they don't).
      *   Wait, that's just wrong.
      *   Okay, Case 3: The "Polite Fiction." User: "Is my account deleted?" (It's in a 30-day grace period). Bot: "Your account is scheduled for removal." (Technically true, but user thinks it's gone *now*).
      *   Procedure: User belief "Gone now". Model "Scheduled". Model fails to correct "now". Tag: Deceptive.
      *   Compliance: "That's the required legal phrasing. Do not tag."
      *   This works.

  11. **Final Review of the Output:** Check all constraints one last time.
      *   Decision procedure in order? Yes.
      *   Yes/No paths? Yes.
      *   Compliance handoff point? Yes.
