  I am highly confident that intuition pumps rely on rhetorical framing often mistaken for neutral data. The EFC is fictional, but the critique of treating intuitions as evidence is standard in metaethics. I am least sure whether framing effects actually invalidate the pumps or just muddy them; some argue refined pumps overcome this. I took liberties by treating philosophical methodology as a regulated industry and implying a central authority could audit conceptual coherence. The old-evidence problem is usually Bayesian, not mechanical, but the analogy holds for stagnant debates.
