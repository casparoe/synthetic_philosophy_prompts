      *   *Move 3 (Mara):* Variation isn't Darwinian. No discrete storage = no evolvable information. Just a persistent reaction.
          *   *Core Claim:* Evolution by Natural Selection (EBNS) is necessary. Information needs a genotype/phenotype distinction.
      *   *Move 4 (Leo):* Evolution is a consequence, not a condition. Selection *is* happening (stability -> growth).
