answer: |-
  Here is the specification list for a theory of cognitive extension, tailored for the ethical and clinical constraints of a hippocampal memory prosthesis trial.

  ### **The Spec: Requirements for a Usable Theory of Cognitive Extension**

  To adjudicate between the "Amputation" (loss of self/capacity) and "Notebook" (loss of tool) models, the theory must satisfy the following deliverables.

  #### **1. The Truth-Tracking Constraint (Wrinkle 1)**
  *   **Requirement:** The theory must specify whether *accuracy* is a necessary condition for a process to count as "memory," or if *functional role* alone suffices.
  *   **Case/Consideration:** If the device generates plausible but false stories (confabulation) that the patient integrates as their own past, a functionalist theory counts this as extended memory. An ethical/clinical theory cannot. If the device is switched off, do we protect the patient's access to *truth* or their access to *narrative continuity*? If extension requires truth-tracking, the confabulating device is not part of the mind, it is a manipulator.
  *   **Status:** **Non-Negotiable (NN)**. (Clinical consent requires distinguishing between restoring capacity and altering identity via false belief.)

  #### **2. The Plasticity/History Constraint (Wrinkle 2)**
  *   **Requirement:** The theory must account for the *time* required for integration. It must distinguish between a device that works immediately (tool) and one that requires neural recalibration (organ).
  *   **Case/Consideration:** Biological memory relies on synaptic consolidation and systems consolidation. If the prosthesis requires months of training to align with the patient's encoding schemes, removing it early is like removing a cast; removing it late is like removing a limb. A theory that treats coupling as purely synchronic (happening in the moment) cannot capture the risk of withdrawal after long-term plasticity has occurred.
  *   **Status:** **Non-Negotiable (NN)**. (Contradicting established data on neural plasticity renders the theory biologically inert.)

  #### **3. The Trust vs. Reliance Distinction**
  *   **Requirement:** The theory must distinguish between *blind trust* (transparency) and *monitored reliance* (checking).
  *   **Case/Consideration:** We rely on notebooks but usually verify them if stakes are high. We trust biological memory implicitly (until proven wrong). If the patient stops monitoring the device's output and treats it as immediate phenomenology, the device has shifted from tool to organ. The protocol needs a metric for when "checking" stops.
  *   **Status:** **Non-Negotiable (NN)**. (Determines the standard of care for device failure.)

  #### **4. The Process vs. Vehicle Distinction**
  *   **Requirement:** The theory must specify whether extension applies to *storage* (vehicle) or *computation* (process).
  *   **Case/Consideration:** A notebook stores information (vehicle) but the brain does the encoding/retrieving (process). A hippocampal prosthesis performs *encoding and retrieval* (process). If extension only covers vehicles, the device is a tool. If it covers processes, it is closer to tissue.
  *   **Status:** **Camp Taste (CT)**. (Some theories allow vehicle extension only; others allow process extension. The lab must choose which threshold triggers "amputation" status.)

  #### **5. The Cognitive Bloat Constraint**
  *   **Requirement:** The theory must provide a boundary condition that prevents "everything I interact with" from counting as part of my mind.
  *   **Case/Consideration:** If using the device makes it part of the mind, does using the lab computer to analyze the data make the computer part of the mind? If the theory allows unlimited bloat, "switching off" loses all ethical significance because we switch off "parts of our mind" constantly.
  *   **Status:** **Camp Taste (CT)**. (Some accept bloat as the cost of the theory; most find it reductio ad absurdum.)

  #### **6. The Identity Continuity Deliverable**
  *   **Requirement:** The theory must predict whether removal of the extended resource results in a *loss of capacity* or a *loss of self*.
  *   **Case/Consideration:** Losing a notebook reduces efficiency (capacity). Losing a hippocampus reduces the ability to form the self over time (identity). The consent form must warn patients: "You may forget things" (Capacity) vs. "You may not be the same person" (Identity).
  *   **Status:** **Non-Negotiable (NN)**. (This is the primary ethical output required for the protocol.)

  ---

  ### **Handling the Wrinkles**

  *   **Wrinkle 1 (Confabulation):** Addressed by **Requirement 1 (Truth-Tracking)**. A theory that says "functional role is enough" classifies the lying device as extended mind. A theory that says "memory aims at truth" classifies it as an external manipulator. For consent purposes, Requirement 1 forces the theory to take a stand on whether the *content* matters or just the *feeling*.
  *   **Wrinkle 2 (Instant vs. Trained):** Addressed by **Requirement 2 (Plasticity/History)**. A synchronic theory (coupling is all that matters) treats the instant device and the trained device identically. A diachronic theory (history matters) treats the trained device as more integrated. Requirement 2 forces the theory to acknowledge that *time* changes the metaphysical status of the coupling.

  ---

  ### **Incompatibilities: Requirements That Cannot Be Met Together**

  You asked for tensions where satisfying one requirement forces the violation of another. These are the fault lines where your lab group will have to make a choice.

  **1. The Parity Principle (CT) vs. Truth-Tracking (NN)**
  *   **The Conflict:** The Parity Principle (often associated with Clark & Chalmers) states that if a process functions like a cognitive process, it *is* a cognitive process, regardless of substrate. Truth-Tracking (NN) states that for memory, accuracy is constitutive.
  *   **The Clash:** In the case of the confabulating device (Wrinkle 1), the device functions perfectly as memory (retrieval on prompt, emotional weight) but fails truth-tracking.
      *   If you keep **Parity**, you must admit the false memories are part of the mind (risking ethical harm).
      *   If you keep **Truth-Tracking**, you must admit that a functionally identical process is *not* cognitive extension (violating Parity).
  *   **Resolution:** You cannot have a theory that is both strictly functionalist (Parity) and semantically constrained (Truth-Tracking).

  **2. Synchronic Coupling (CT) vs. Plasticity/History (NN)**
  *   **The Conflict:** Many extension theories are synchronic (is the resource available and trusted *now*?). Requirement 2 is diachronic (did the brain rewire *over time*?).
  *   **The Clash:** If the device works the first time you touch it (Wrinkle 2), a Synchronic theory calls it extended mind immediately. The Plasticity constraint says it is merely a tool until neural recalibration occurs.
      *   If you prioritize **Synchronic Coupling**, you ignore the biological reality of integration.
      *   If you prioritize **Plasticity**, you deny extension status to instant-coupling tools, even if they function perfectly.
  *   **Resolution:** You cannot have a theory that is both substrate-neutral/instant and biologically grounded/time-dependent.

  ---

  ### **The Most Exclusionary Requirement**

  **Requirement 2: The Plasticity/History Constraint.**

  **Why:** This requirement excludes the majority of existing philosophical theories of cognitive extension.
  *   **Standard View:** Most theories (e.g., standard Extended Mind, Active Externalism) are **functionalist** and **synchronic**. They argue that if the coupling is right *now*, the extension exists *now*. They treat the brain as a black box that processes inputs/outputs.
  *   **The Exclusion:** Requirement 2 demands the theory look inside the black box at the *mechanism of integration* (synaptic change, calibration time). It demands the theory be **diachronic** (history-dependent).
  *   **Impact:** This rules out almost all "notebook" analogies immediately. A notebook does not require neural plasticity to use. By making plasticity a condition for "amputation" status, you force the theory to align with neuroscience rather than pure philosophy. It filters out any theory that treats the brain as just another information processor indistinguishable from a hard drive.

  **Recommendation for the Protocol:**
  Adopt **Requirement 2 (Plasticity)** and **Requirement 1 (Truth-Tracking)** as your Non-Negotiables. Be prepared to sacrifice the **Parity Principle**. This positions the consent protocol to treat the device as a *tool* initially, transitioning to *tissue* only after verified neural integration and truth-validation, protecting the patient from both premature dependency and unjustified withdrawal.
