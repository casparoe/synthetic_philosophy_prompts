prompt: |-
  Our food co-op (about 400 members) is picking how to elect its board, and we've narrowed it to instant-runoff, approval, and score voting. One guy on the committee — Dave, an ex-physics type — keeps shutting down the strategy-proofness discussion with an analogy: voting rules are like map projections. Mercator keeps shape and wrecks area, equal-area does the reverse, and no flat map keeps everything. Gibbard–Satterthwaite, he says, is just the same point in social choice: every rule distorts somewhere, so there's no "undistorted" option to prefer, and we should drop strategy-proofness as a criterion entirely and decide on simplicity, ballot length, how annoying it is to count by hand, and so on.

  Can you audit that analogy for us? Concretely:

  - Give the correspondence table — what plays the globe, what plays the projection, what plays "area" and "shape," what plays "distortion," and who the map user is. I want to see whether there's anything on the voting side corresponding to the fact that a projection of a *small* region can be made arbitrarily close to exact.
  - Then the breakdowns, split into the ones that actually matter for the decision Dave is trying to make and the ones that are just noise. Things I'm suspicious about, in no particular order: GS is an existence claim (some voter, some profile, gains by lying) and carries no magnitude, whereas map distortion is graded and measurable; map distortion is shared and visible to everyone, while manipulability mostly transfers value from honest voters to well-informed ones and is invisible after the fact; there's no external "correct outcome" for an election to be faithful to, the way there's a globe for a map; and the escapes from GS look categorical rather than gradational (dictatorship, two alternatives, restricted preference domains where something like the median rule is strategy-proof, rules that randomize, cardinal ballots that aren't rankings).
  - One of us read that there's a companion result covering rules that pick the winner by lottery, which would close the randomization escape, and that it also covers schemes where voters report intensities rather than rankings — so approval and score wouldn't dodge it the way Dave thinks. Check whether that's right, and tell us whether it changes anything.
  - Finally: does Dave's conclusion survive once the disanalogies are on the table, or was the analogy carrying it? If it doesn't survive, is there a better analogy for what GS actually tells you — and what would have to be measurable (share of profiles where anyone gains, expected size of the gain, how much a liar needs to know about other people's ballots) for a trade-off picture like his to be legitimate at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** A food co-op (400 members) choosing a board election method (IRV, Approval, Score).
      *   **The Conflict:** A committee member (Dave, ex-physics) argues against prioritizing "strategy-proofness" using a "Map Projection" analogy. He claims Gibbard-Satterthwaite (GS) implies *all* systems distort, so we should ignore strategy and focus on practicalities (counting, simplicity).
      *   **Task 1: Audit the Analogy.** Create a correspondence table (Globe $\to$ ?, Projection $\to$ ?, etc.) and check for the "small region" equivalent.
      *   **Task 2: Identify Breakdowns.** Distinguish between breakdowns that matter for the co-op's decision vs. noise. Address specific suspicions (existence vs. magnitude, visibility, external truth, escapes from GS).
      *   **Task 3: Check Companion Results.** Verify claims about randomization (Gibbard 1977/1978) and cardinal ballots (Approval/Score dodging GS?).
      *   **Task 4: Final Verdict.** Does Dave's conclusion hold? If not, propose a better analogy and define what would need to be measurable to make a trade-off picture legitimate.

  2.  **Task 1: The Correspondence Table (Mapping the Analogy):**

      *   *Globe:* The "True Will of the Electorate" or the "Social Welfare Function" (ideal aggregation). In map terms, it's the objective reality. In voting, it's the tricky part. There isn't really a "true" winner independent of the rule.
      *   *Projection:* The Voting Rule (IRV, Approval, Score).
      *   *Area/Shape:* Voting Criteria (Monotonicity, Condorcet, IIA, Strategy-proofness).
      *   *Distortion:* Violation of criteria (e.g., a voter benefiting from lying).
      *   *Map User:* The Voters / The Co-op Members.
      *   *Small Region:* This is the crux. In maps, a small enough patch is flat. In voting, is there a "small enough" preference profile where GS doesn't apply?
          *   *Analysis:* GS applies to *any* domain with 3+ alternatives and unrestricted preferences. However, if preferences are *restricted* (e.g., single-peaked), strategy-proofness *is* possible (Median Voter Theorem). So, the "small region" equivalent is "restricted preference domains."
          *   *Co-op Context:* Do co-op members have restricted preferences? Maybe, but likely not strictly single-peaked on a multi-dimensional board slate.

  3.  **Task 2: Breakdowns of the Analogy:**

      *   *Existence vs. Magnitude:* GS says manipulation *exists*. It doesn't say how *often* or how *much* it matters. Map distortion is continuous (scale factor). This is a huge difference. Dave treats GS as "all systems are equally broken," but some might be *less* broken in practice.
      *   *Visibility:* Map distortion is on the legend. Voting manipulation is hidden. You don't know if the winner would have changed if someone voted honestly.
      *   *External Truth:* A globe exists. A "correct election outcome" is philosophical (Condorcet winner? Utilitarian sum?). This weakens the "distortion" concept.
      *   *Escapes from GS:*
          *   Dictatorship (Not an option for a co-op).
          *   2 Alternatives (Not an option, usually multiple candidates).
          *   Restricted Domain (Single-peakedness).
          *   Randomization (Social Choice Functions).
          *   Cardinal/Non-ranking (Approval/Score). *Crucial Point:* GS specifically applies to *ordinal* ranking rules. Approval and Score are *cardinal*. Does GS apply to them?
              *   *Correction:* Gibbard (1973) is ordinal. Gibbard (1978) extends to cardinal/randomization.
              *   *Nuance:* Approval/Score are technically strategy-*free* in specific contexts? No, they are manipulable. In Score voting, you often have incentive to "bullet vote" (max/min) rather than score honestly. So they aren't strategy-proof in the strong sense, though the *type* of strategy differs.

  4.  **Task 3: Companion Results (Randomization & Cardinal):**

      *   *Randomization:* Gibbard (1977) "Manipulation of Schemes that Mix Voting with Chance." Yes, even if you pick a lottery, unless it's a dictatorship or binary, it's manipulable.
      *   *Cardinal (Approval/Score):* Gibbard (1978) "Straightforwardness of Game Forms." This is the big one. It extends GS to *any* game form, including cardinal voting.
      *   *Conclusion:* Dave is partially right that Approval/Score aren't magic bullets against *manipulation*, but he's wrong if he implies they are *equally* manipulable or that the *nature* of the manipulation is the same. Score voting often encourages "min-maxing" (strategic voting), whereas honest scoring is possible but risky.
      *   *Does it change anything?* It closes the "loophole" Dave thinks exists, but it also undermines his claim that *because* GS applies to everything, we should ignore it. The *degree* still matters.

  5.  **Task 4: Final Verdict & Better Analogy:**

      *   *Does Dave's conclusion survive?* No. The analogy suggests "all distortions are equal/fatal," but the math says "all distortions exist, but frequency/magnitude vary." Ignoring strategy because it *can* happen is like ignoring seatbelts because accidents *can* happen even with them.
      *   *Better Analogy:* **Security Systems** or **Error Correction**.
          *   No system is unhackable (GS).
          *   Some are harder to hack than others.
          *   You choose based on threat model (how motivated are voters to strategize?) and cost (counting complexity).
      *   *Measurables:* To make a trade-off picture like Dave's legitimate, we need:
          *   Vulnerability frequency (Monte Carlo simulations).
          *   Impact magnitude (How often does strategy change the winner?).
          *   Information requirement (Does a voter need to know everyone else's ballot to strategize?).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, analytical, respectful of Dave's physics background but firm on the social choice theory.
      *   *Structure:* Follow the user's four bullet points exactly.
      *   *Key Technical Check:* Ensure the distinction between Gibbard 1973 (Ordinal) and Gibbard 1978 (General Game Forms) is clear regarding Approval/Score.
      *   *Refining the "Small Region" point:* In maps, local flatness is guaranteed. In voting, local strategy-proofness is *not* guaranteed unless preferences are restricted. This is a critical disanalogy.
      *   *Refining the "External Truth":* Emphasize that "distortion" implies a truth. In voting, the "truth" is normative. This makes the map analogy weak on the *goal*, but strong on the *impossibility*.
      *   *Co-op Specifics:* 400 members is small enough for hand-counting concerns to be real, but large enough for strategy to matter. Board elections are usually multi-winner? The prompt implies "elect its board" (singular or collective?). Usually, board elections are multi-seat. GS applies to single-winner. For multi-winner, it's even more complex. I should note this. *Self-Correction:* The prompt lists IRV, Approval, Score. These are typically single-winner rules (though Approval/Score can be multi-winner). I will assume single-winner for the GS discussion but note the multi-winner complication if relevant. Let's stick to the single-winner GS framework as that's what Dave is citing.

  7.  **Final Polish:** Check against the "noise vs. signal" requirement. Ensure the distinction between *existence* of manipulation and *probability* of manipulation is highlighted as the main flaw in Dave's argument.

  **(Self-Correction during drafting):** Wait, does Score Voting dodge GS?
  *   Gibbard 1973: Ordinal mechanisms.
  *   Gibbard 1978: Any game form.
  *   However, "Strategy-proofness" in cardinal voting is often defined differently. In Score, voting your true utility is a weakly dominant strategy *if* you don't know others' votes? No, actually, in Score, min-maxing is often the dominant strategy in competitive environments. So it *is* manipulable.
  *   But wait, some literature suggests Approval/Score are *less* susceptible to *complex* strategy than IRV. IRV requires knowing the whole distribution. Score often just requires "max the favorite, min the threat."
  *   Dave's claim: "Approval and Score wouldn't dodge it." This is technically correct under Gibbard 1978.
  *   Dave's conclusion: "So drop strategy-proofness as a criterion." This is the non-sequitur. Just because you can't get 100% security doesn't mean you don't compare lock quality.

  8.  **Finalizing the Output Structure:**
