  2.  **Deconstruct the Theoretical Framework:**
      *   **Christopher Browning (*Ordinary Men*):** Focuses on Reserve Police Battalion 101. Argues that ordinary men committed atrocities due to situational factors (peer pressure, conformity, deindividuation, obedience to authority, gradual escalation) rather than inherent ideological hatred or deep character flaws. The key is *situational psychology*.
      *   **Daniel Goldhagen (*Hitler's Willing Executioners*):** Argues that ordinary Germans were "willing executioners" due to a specific, pervasive "eliminationist antisemitism" embedded in German culture. It's not just situation; it's a *cultural cognition* that makes violence acceptable and even desirable against a demonized group. The key is *ideological/cultural predisposition*.
      *   **The Tension:** Is violence a result of the moment (Browning) or a result of a pre-existing cultural/psychological script that gets unlocked (Goldhagen)?

  3.  **Analyze *Lord of the Flies* through this lens:**
      *   **The Beast:** There is no real beast. It is constructed.
          *   *Browning view:* The fear is a situational stressor that leads to group cohesion through shared anxiety.
          *   *Goldhagen view:* The beast represents the demonized "other" necessary for eliminatory violence. The boys *need* the beast to justify the violence. The construction of the beast is the ideological work.
      *   **The Dance/Simon's Death:**
          *   *Browning view:* Hysteria, rhythm, darkness, deindividuation ("Kill the beast! Cut his throat! Spill his blood!"). Ralph and Piggy join in due to peer pressure and the overwhelming momentum of the group.
