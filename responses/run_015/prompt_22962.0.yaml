answer: |-
  Your intuition is correct: there is a fundamental hole in the argument. It is not an engineering hurdle; it is a law of physics.

  Here is the breakdown you need for your piece.

  ### 1. The Hard Stop: The No-Communication Theorem
  The specific principle your friend is running into is the **No-Communication Theorem**. It is a proven mathematical result in quantum information theory. It states that while entangled particles exhibit non-local correlations, one observer cannot use those correlations to transmit information to another observer faster than light.

  ### 2. Where the Argument Breaks
  Your friend's error lies in confusing **correlation** with **signaling**.

  *   **The Sender's Action:** The sender (Alice) can indeed choose to measure in Basis A or Basis B. This does "steer" the global wavefunction.
  *   **The Receiver's Reality:** The receiver (Bob) sees only **local statistics**.
      *   If Alice measures Basis A, Bob's photon collapses into a state compatible with A.
      *   If Alice measures Basis B, Bob's photon collapses into a state compatible with B.
      *   **However:** When Bob measures his photon, his results look like **perfectly random noise (50/50 probability)** in *both* scenarios.

  Bob cannot distinguish whether his photon collapsed due to Alice choosing Basis A or Basis B just by looking at his own data stream. The "signal" is hidden in the *correlation* between their two datasets, which they can only verify by comparing notes via a classical channel (limited by the speed of light).

  **The Technical Hole:** Alice cannot control the *outcome* of her measurement, only the *basis*. Because her outcome is random, she cannot force Bob's photon into a specific deterministic state (like "Definite Up" for 1 and "Definite Down" for 0). She can only force it into a random state within a chosen distribution. Bob, lacking the key to that distribution, sees only randomness.

  ### 3. What about "Quantum Steering"?
  Your friend uses the term "steering." In quantum information, **quantum steering** is a real phenomenon where one party can affect the state of another's system through local measurements. However, steering inequalities are used to *verify* entanglement security, not to transmit bits. It still obeys the No-Communication Theorem. The "steering" is only observable after comparing measurement records classically.

  ### 4. Is there any version that could work?
  **No.** Not within standard quantum mechanics or special relativity.
  *   **Causality:** If FTL communication were possible, it would violate causality (allowing messages to be sent back in time in certain reference frames).
  *   **Quantum Teleportation:** This is often cited in pop science, but it explicitly requires a classical bit stream to complete the transfer, capping the speed at *c*.
  *   **Exotic Physics:** Hypotheses like wormholes or tachyons exist in theoretical math, but there is zero experimental evidence for them, and they generally introduce paradoxes that physics actively seems to prevent (e.g., Chronology Protection Conjecture).

  ### The Takeaway for Your Piece
  Your friend is describing a "superluminal telegraph" that physicists have debated and debunked since the EPR paradox was proposed in 1935. The breakdown isn't in the engineering of the detectors; it's in the statistics. **Entanglement shares randomness, not information.**

  If he could actually do this, he wouldn't be working on a side project; he would be overturning the Standard Model and Special Relativity simultaneously.
