prompt: |-
  I'm a journalist who covers science and ideas, and I'm drafting a feature on whether philosophers should trust intuitions. Before I file, I want my own position audited rather than defended — I suspect it doesn't all hang together, but I can't tell where.

  My commitments, as I currently hold them:

  1. The documented cross-cultural variation in verdicts on standard philosophical cases — Gettier-style cases, reference cases, trolley variants — is substantial enough to undercut armchair intuition as a foundation for philosophical claims.

  2. I discount much of the survey work I cite for (1). The vignettes are translated, comprehension screens are loose, and in the studies that tighten them the gap tends to narrow. My own hobbyhorse is a question-pragmatics confound: respondents are often not reporting their own verdict but guessing what the interviewer wants or what their community would approve of, so that what's being measured is how people read a strange request, not what they believe.

  3. Trained philosophers' intuitions are better evidence than folk intuitions, which is why I keep the standard verdict on Gettier cases.

  4. Empirical facts about what people believe are irrelevant to whether a philosophical claim is true: philosophy is about knowledge, reference, and right action, not about anybody's psychology.

  5. A folk verdict that is stable across cultures and survives reframing earns default trust. Yet the moral view I'm most confident of — that there is no morally significant difference between killing and letting die — is one that large majorities in every population surveyed reject, and I do not treat that as evidence against it.

  Where does this package break? Rank the tensions by severity rather than listing them as equal, say for each what would have to give and what that would cost me, and tell me which pairs only look like they're in tension.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User and Request:**
      *   **User:** Journalist covering science and ideas.
      *   **Task:** Audit their own position on whether philosophers should trust intuitions. They suspect inconsistencies ("doesn't all hang together").
      *   **Goal:** Identify tensions, rank them by severity, explain what would have to give/cost, and distinguish real tensions from apparent ones.
      *   **Tone:** Critical, analytical, precise, respectful but rigorous (like an editor or peer reviewer).

  2.  **Analyze the Commitments:**
      *   **C1:** Cross-cultural variation in verdicts (Gettier, reference, trolley) undercuts *armchair intuition* as a foundation.
      *   **C2:** Discount much of the survey work supporting C1 (translation issues, pragmatics confounds, gaps narrow with controls).
      *   **C3:** Trained philosophers' intuitions > Folk intuitions (justifies keeping Gettier verdict).
      *   **C4:** Empirical facts about belief $\neq$ Truth of philosophical claim (Philosophy $\neq$ Psychology).
      *   **C5:** Stable folk verdicts earn default trust *EXCEPT* when they contradict the user's confident moral view (Killing vs. Letting Die), in which case the folk are ignored.

  3.  **Initial Brainstorming & Mapping Tensions:**

      *   *C1 vs. C2:* C1 says variation is substantial enough to undercut intuition. C2 says the evidence for that variation is shaky/discounted. *Tension:* If the evidence is bad, why is the conclusion strong?
      *   *C1/C2 vs. C3:* C1/C2 suggest folk intuition is unreliable (due to variation or pragmatics). C3 says expert intuition is reliable. *Tension:* Why are experts immune to the pragmatics/variation issues? Is this elitism or justified expertise?
      *   *C3 vs. C4:* C3 relies on *psychological states* (intuitions of experts) as evidence. C4 says psychology is irrelevant to truth. *Tension:* If psychology is irrelevant, why are expert intuitions evidence?
      *   *C5 vs. C4:* C5 says stable folk verdicts earn *default trust* (implying epistemic weight). C4 says belief facts are irrelevant to truth. *Tension:* How can belief confer trust if belief is irrelevant to truth?
      *   *C5 vs. C1/C2/C3:* C5 grants weight to *folk* stability. C1/C2/C3 generally dismiss folk intuition (either due to variation or lack of training). *Tension:* Why trust folk on stability but not on variation?
      *   *C5 (Exception) vs. C5 (Rule):* C5 says stable folk views get trust, *but* the user rejects a stable folk view (Killing vs. Letting Die). *Tension:* This looks like special pleading.

  4.  **Developing the Audit (Drafting the Analysis):**

      *   *Severity 1: The "Expert Exception" vs. "Psychology Irrelevance" (C3 vs. C4).* This is the core methodological contradiction. If philosophy isn't about psychology (C4), then *no* intuitions (expert or folk) should be evidence. Intuitions are psychological states. If C4 holds, C3 must go. If C3 holds, C4 must be softened.
      *   *Severity 2: The "Stable Folk" Double Standard (C5 Rule vs. C5 Exception).* The user grants default trust to stable folk views but explicitly rejects one (Killing/Letting Die) despite its stability. This undermines the principle in C5. It looks like "I trust intuition when it agrees with me."
      *   *Severity 3: The Evidence Gap (C1 vs. C2).* C1 makes a strong claim based on evidence C2 undermines. If the studies are flawed (C2), the claim in C1 is unsupported. This is an evidential tension, not necessarily a philosophical one, but it weakens the position.
      *   *Severity 4: The "Expertise" Defense (C2/C3).* C2 says folk are confused by pragmatics. C3 says experts aren't. But is there evidence for this? Or is it an assumption? This links to C1/C2.

  5.  **Refining the Rankings and "What Gives":**

      *   *Top Tension:* C3 (Expert Intuitions count) vs. C4 (Psychology doesn't count).
          *   *Resolution:* Either admit intuitions are psychological evidence (modify C4) or stop using expert intuitions as evidence (modify C3).
          *   *Cost:* Modifying C4 moves toward naturalism/psychologism. Modifying C3 undermines the defense of Gettier cases.
      *   *Second Tension:* C5 (Stable Folk = Trust) vs. C5 Exception (Killing/Letting Die).
          *   *Resolution:* Either accept the moral view might be wrong (hard) or admit stability doesn't confer trust (modify C5).
          *   *Cost:* Losing the "default trust" heuristic or losing confidence in the moral view.
      *   *Third Tension:* C1 (Variation undercuts) vs. C2 (Evidence is bad).
          *   *Resolution:* Weaken C1.
          *   *Cost:* Can't use experimental philosophy (X-Phi) negative results as a weapon.

  6.  **Identifying "False Tensions":**
      *   *C4 vs. C1?* C1 says intuition is a bad *foundation*. C4 says belief facts don't determine truth. These can coexist if intuition is treated as a heuristic rather than a truth-maker.
      *   *C2 vs. C3?* C2 critiques folk surveys; C3 praises experts. This is consistent *if* expertise mitigates the pragmatics confound. But it needs justification.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the position (it's a "centrist" or "moderate" view common in post-X-Phi debates).
      *   **Ranking:** High, Medium, Low severity.
      *   **Analysis per Tension:** Define the clash, explain why it breaks, suggest what gives, calculate the cost.
      *   **False Tensions:** Clarify where the user is actually consistent.
      *   **Conclusion:** Summary of the "center of gravity" shift needed.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check C5:* The user says "A folk verdict that is stable... earns default trust." Then says "I do not treat [the killing/letting die consensus] as evidence against it." This is a direct contradiction of the *rule* in C5. It's not just a tension; it's a violation of their own stated principle. I need to highlight this sharply.
      *   *Check C3 vs C4:* This is the classic "Metaphilosophical" tension. If intuitions are evidence, psychology matters. If psychology doesn't matter, intuitions aren't evidence. The user wants to have their cake (use expert intuition) and eat it too (deny psychology is relevant). This is the deepest philosophical crack.
      *   *Check C1 vs C2:* This is an empirical consistency issue. If I say "The bridge is out" (C1) but "The reports of the bridge being out are unreliable" (C2), I shouldn't conclude "The bridge is out." I should conclude "I don't know."

  9.  **Final Polish:** Ensure the tone is journalistic/analytical, not preachy. Use the user's numbering. Make sure the "Cost" sections are clear. (Self-correction: Ensure I distinguish between *truth* and *evidence for truth*. C4 says belief facts are irrelevant to *truth*. C3 uses intuitions as *evidence*. This is a subtle distinction. If intuitions are evidence, then psychological facts *are* relevant to justification, even if not to truth conditions directly. I need to be precise here.)

      *Refining C3/C4:* C4 says "Empirical facts about what people believe are irrelevant to whether a philosophical claim is true." This is technically compatible with using beliefs as *evidence* (just like telescope readings don't determine stars exist, but evidence they do). *However*, C3 relies on the *reliability* of the intuition. If C2 says folk intuitions are unreliable due to pragmatics, and C3 says experts are reliable, that's an empirical claim about psychology. So C4's strong wording ("irrelevant") clashes with the reliance on psychological reliability in C3. I will frame this as a tension between *evidential relevance* and *truth conditions*.

      *Wait, looking closer at C5:* "A folk verdict that is stable... earns default trust." vs "I do not treat that [stable rejection] as evidence against it." This is the clearest contradiction. If stable rejection *should* earn trust (or at least count as evidence), ignoring it violates the rule.

      *Let's prioritize:*
      1. C3/C4 (The Metaphilosophical Core): Can you use psychology as evidence while saying psychology is irrelevant?
      2. C5 Internal (The Consistency Check): Do you apply your own heuristic?
      3. C1/C2 (The Empirical Basis): Do you believe your own data critique?

      *False Tensions:* C1 and C4 are actually compatible (Intuitions are bad foundations; Belief facts don't make truth). C2 and C3 are compatible *if* expertise is real.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated, "post-experimental philosophy" position. You are attempting to navigate a middle path between hard-line armchair methodology and radical naturalism. It is a stable position *only if* the distinctions you draw hold up under pressure.

  Currently, they do not. Your package contains one fatal contradiction, one major evidential gap, and one instance of special pleading.

  Here is the audit, ranked by severity.

  ### 1. The Metaphilosophical Contradiction (Severity: Critical)
  **The Clash:** Commitment 3 vs. Commitment 4.
  **The Tension:** You claim empirical facts about belief are irrelevant to philosophical truth (C4), yet you rely on a psychological distinction (trained vs. untrained minds) to validate evidence for those truths (C3).

  If C4 is true—that psychology is irrelevant to truth—then the *source* of an intuition (folk vs. expert) should not matter for its evidential weight, only the logical force of the intuition itself. By asserting that trained philosophers' intuitions are *better evidence* (C3), you are making an empirical claim about the reliability of a specific psychological population. You are treating "philosopher psychology" as a truth-tracking instrument.

  If intuitions are evidence, then facts about how those intuitions are generated (psychology) are relevant to their justification. If psychology is irrelevant (C4), you cannot privilege expert intuitions over folk intuitions without begging the question.

  *   **What has to give:** You must soften C4.
  *   **The Cost:** You move away from a pure conceptual analysis view toward a form of modest naturalism. You must admit that while belief facts don't *make* a claim true, the psychological reliability of the believer is relevant to whether we are *justified* in holding the claim. You cannot maintain that philosophy is wholly distinct from psychology while using psychological expertise as your filter.

  ### 2. The Heuristic Violation (Severity: High)
  **The Clash:** Commitment 5 (Rule) vs. Commitment 5 (Exception).
  **The Tension:** You establish a rule ("stable folk verdict... earns default trust") and immediately violate it with your most confident moral view.

  This is not a philosophical tension; it is an inconsistency in application. If stable cross-cultural rejection of a view counts as evidence *against* it (which "default trust" in the opposite implies), then your confidence in the "no difference between killing and letting die" thesis is undercut. By dismissing the stable folk verdict in this specific instance, you reveal that C5 is not a principle you hold, but a heuristic you apply only when it aligns with your prior conclusions. This undermines the integrity of C1 and C2 as well; it suggests you discount folk intuitions when they disagree with you (Killing/Letting Die) and discount survey methods when they disagree with you (C2), but trust expert intuitions when they agree with you (C3).

  *   **What has to give:** You must either lower your confidence in the killing/letting die view or abandon C5 as a general principle.
  *   **The Cost:** If you abandon C5, you lose the "default trust" safety net. You are left with C1/C2/C3, which makes your position rely entirely on the "expertise" defense. If you lower your confidence in the moral view, you preserve consistency but weaken your journalistic voice on that specific issue.

  ### 3. The Evidential Gap (Severity: Medium)
  **The Clash:** Commitment 1 vs. Commitment 2.
  **The Tension:** You assert a strong conclusion (variation undercuts intuition) based on evidence you admit is flawed (surveys are confounded, gaps narrow).

  C1 is a claim about the *world* (variation is substantial enough to undercut). C2 is a claim about the *data* (the studies measuring this are noisy). If C2 is correct—that comprehension screens tighten the gap and pragmatics confound the results—then C1 is unsupported. You cannot simultaneously argue that the variation is fatal to the method and that the measurement of that variation is unreliable.

  Currently, you are using the *existence* of the X-Phi literature to support C1, while using the *methodological critiques* of that same literature to support your skepticism of the folk (C2). This leaves C1 floating without a anchor.

  *   **What has to give:** C1 must be weakened to a conditional claim.
  *   **The Cost:** You can no longer state as fact that variation undercuts intuition. You must state that *if* the variation holds up under stricter controls, it would undercut intuition. This makes your feature less definitive and more speculative.

  ---

  ### Apparent Tensions (Where you are actually safe)

  **C1/C2 vs. C3 (The Expertise Defense)**
  *   **Why it looks like tension:** You dismiss folk intuitions (C1/C2) but keep expert ones (C3).
  *   **Why it holds:** This is consistent *provided* you solve the C3/C4 tension above. If you admit psychology is relevant to justification (modifying C4), you can argue that training mitigates the pragmatics confounds cited in C2. You can consistently argue that philosophers are better at isolating the semantic content from the pragmatic context. This is an empirical claim, but it is not internally contradictory.

  **C4 vs. C5 (Truth vs. Trust)**
  *   **Why it looks like tension:** C4 says belief is irrelevant to truth; C5 says belief earns trust.
  *   **Why it holds:** "Truth" and "Trust" (justification) are different categories. You can consistently hold that the number of people who believe $X$ does not make $X$ true (C4), while also holding that widespread agreement is a useful heuristic for deciding what to investigate or provisionally accept (C5). The breakdown in C5 (ranked #2 above) is not about this distinction, but about your failure to apply the heuristic consistently.

  ### Summary Recommendation

  Your position breaks at the **metaphilosophical core**. You want the authority of the armchair (C3) without the baggage of psychologism (C4).

  To file this coherently:
  1.  **Reframe C4:** Change "irrelevant to whether a philosophical claim is true" to "not constitutive of truth, but relevant to evidential justification."
  2.  **Harden C5 or Drop It:** Either explain why the killing/letting die case is exempt from the stability rule (e.g., "moral error theory applies here"), or admit that stability is a weak heuristic that you override with theoretical reasoning.
  3.  **Soften C1:** Acknowledge that the "substantial variation" claim is contingent on the methodology improving, per your own C2 critique.

  If you make these adjustments, your position shifts from "Philosophers should trust intuitions, but not folk ones" to "Philosophers should treat intuitions as psychological data points, weighted by expertise, while acknowledging that truth conditions remain distinct." It is a less punchy headline, but it will hang together.
