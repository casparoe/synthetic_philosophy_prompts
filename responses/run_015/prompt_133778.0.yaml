answer: |-
  **HISTORY 485: SEMINAR IN INTELLECTUAL HISTORY**
  **Take-Home Final Examination**

  **Prompt:**

  In *Of Money* and *Of Interest*, David Hume advances a gradualist transmission mechanism wherein an augmentation of the money supply stimulates industry before raising prices, due to the uneven diffusion of specie through the economy. Construct a counterfactual scenario involving a closed, agrarian economy that suddenly issues a large volume of paper notes convertible not into specie, but into claims on anticipated tax revenues—an instrument Hume does not explicitly analyze.

  Apply Hume's framework to this scenario. Your response must: (1) reconstruct Hume's implicit assumptions regarding the velocity of circulation required for the gradualist mechanism to function; (2) determine whether this mechanism survives under the specific conditions of credit-backed issuance; (3) identify the precise point at which nominal magnitudes and real activity diverge in this counterfactual; and (4) evaluate whether this divergence undermines Hume's broader anti-mercantilist argument that national wealth consists in labor and commodities rather than in accumulated paper.

  ***

  **MODEL ANSWER**

  Hume's political economy rests on a dynamic conception of money as a lubricant rather than a store of value. In his gradualist narrative, an influx of money does not immediately alter the price level because the new supply enters through specific channels—typically merchants or manufacturers—before permeating the broader market. This temporal lag allows the initial recipients to expand production, mobilizing idle labor and resources before the increased demand bids up prices universally. Consequently, the real economy expands prior to the nominal adjustment.

  For this mechanism to function, Hume relies on implicit assumptions regarding the velocity of circulation. He presumes that money must change hands repeatedly through productive sectors to awaken "sleeping industry." The velocity is not uniform; it is initially concentrated among those capable of deploying capital into production. If money merely circulates among consumers or hoarders, the stimulus effect is lost, and prices rise without corresponding growth in commodities. Thus, the critical variable is not the quantity of money per se, but the pathway of its diffusion and the velocity with which it activates labor.

  Applying this to the counterfactual of tax-backed paper notes reveals a structural fragility in Hume's model. Unlike an influx of gold, which enters via trade balances and merchant coffers, paper claims on future taxation enter via state expenditure or debt monetization. The recipients of these notes possess immediate liquidity backed by sovereign credit rather than realized commercial profit. Here, the gradualist mechanism likely fails. Because the paper is accepted based on confidence in future tax capacity rather than current commercial success, holders may treat it as immediate wealth without the intermediate step of industrial investment. The velocity of circulation may accelerate too rapidly among consumers rather than producers, bypassing the "waking up" of industry.

  The divergence between nominal and real activity occurs at the moment of issuance. In Hume's specie scenario, real activity rises first because the money represents completed labor (gold) seeking new employment. In the tax-credit scenario, the money represents anticipated state extraction. If the agrarian economy lacks the industrial capacity to expand output quickly, the increased liquidity chases existing commodities immediately. Prices rise nominally before any real stimulus can occur because the paper lacks the intrinsic connection to commercial expansion that specie possesses in Hume's framework. The lag is eliminated; inflation becomes instantaneous while production remains stagnant.

  This divergence significantly undermines Hume's anti-mercantilist argument. Hume contends that national wealth resides in labor and commodities, dismissing the accumulation of precious metals as foolish if it does not stimulate industry. However, if paper credit can inflate nominal values without stimulating labor, it demonstrates that the "sign" of wealth (paper) can detach from the "thing" signified (commodities) more easily than Hume admits. While Hume argues that paper credit is dangerous only when it displaces specie entirely, this counterfactual suggests that even partial issuance based on fiscal claims can create the illusion of wealth without the substance. If prices rise without increased labor, the economy experiences the mercantilist error—valuing the medium over the end—despite operating within a theoretical framework designed to prevent it. Thus, the counterfactual exposes a limitation in Hume's optimism: his gradualist safeguard depends on the money entering through commercial channels, not fiscal ones. When the state bypasses the merchant to inject liquidity, the link between money and labor is severed, validating the mercantilist fear that manipulating the money supply can alter national wealth, albeit destructively.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  **1. Reconstruction of the Gradualist Argument (5 Marks)**
  *   **5 Marks:** Clearly articulates the sequence: money influx -> specific recipients -> industrial stimulation -> general price rise. Emphasizes the temporal lag.
  *   **3-4 Marks:** Describes the sequence but omits the role of specific recipients (merchants/manufacturers).
  *   **0-2 Marks:** Treats Hume as a strict quantity theorist (instant price adjustment) or ignores the temporal lag entirely.

  **2. Isolation of Velocity Assumptions (5 Marks)**
  *   **5 Marks:** Identifies that Hume assumes non-uniform velocity; money must circulate through productive hands to wake idle labor.
  *   **3-4 Marks:** Mentions velocity but treats it as a uniform aggregate variable rather than a structural pathway.
  *   **0-2 Marks:** Confuses velocity with quantity; assumes Hume believes money speed is irrelevant.

  **3. Analysis of Paper-Credit Counterfactual (7 Marks)**
  *   **6-7 Marks:** Correctly identifies that tax-backed notes enter via state channels, bypassing commercial investment incentives. Argues the gradualist mechanism fails because liquidity is not tied to commercial profit.
  *   **3-5 Marks:** Analyzes the paper notes but fails to distinguish between commercial influx (specie) and fiscal influx (tax claims).
  *   **0-2 Marks:** Asserts Hume would reject paper outright without analyzing the transmission mechanism; treats paper as identical to specie.

  **4. Diagnosis of Divergence Point (5 Marks)**
  *   **5 Marks:** Pinpoints divergence at the moment of issuance/acceptance: nominal liquidity rises immediately, but real capacity cannot expand instantly in an agrarian setting.
  *   **3-4 Marks:** Identifies divergence generally (inflation vs. growth) but lacks precision on *when* the break occurs.
  *   **0-2 Marks:** Claims nominal and real activity move in tandem; denies divergence occurs.

  **5. Assessment of Impact on Anti-Mercantilism (3 Marks)**
  *   **3 Marks:** Concludes that the scenario validates mercantilist fears (valuing signs over things) and exposes limits in Hume's defense of labor-based wealth.
  *   **2 Marks:** Argues Hume's anti-mercantilism remains intact despite the divergence.
  *   **0-1 Marks:** Irrelevant conclusion or fails to address the definition of wealth.

  **General Deductions:**
  *   **Use of Unverified Quotations:** -2 Marks per instance.
  *   **Bibliography/Citations Included:** -5 Marks (Strict penalty per prompt instructions).
  *   **Word Count Deviation (>±10%):** -1 Mark.
