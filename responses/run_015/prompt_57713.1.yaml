answer: |-
  You've called me at the right moment. Transitional justice is where legal theory bleeds into moral philosophy, and your list of intuitions is the exact map of that wound. You are struggling because you are trying to hold two competing values in tension: **Legal Certainty** (the state must play by the rules it set) and **Substantive Justice** (some acts are too evil to be shielded by rules).

  You asked me not to give you a textbook tour, but to tell you where you're inconsistent. I will do that. But first, let's look at the tools we have.

  ### Part 1: Three Candidate Principles

  Here are the three standard frameworks we use to solve this, and why each breaks against your specific intuitions.

  **1. Strict Positivism (*Nullum Crimen Sine Lege*)**
  *   **The Principle:** No punishment without a pre-existing written law. The state's word is the only source of legality.
  *   **What it captures:** It perfectly explains your verdicts on #1 (Nuremberg Aggression), #4 (Wartime Judge), #6 (Expired Limitations), and #8 (Harsher Sentencing). It protects reliance on the state's rules.
  *   **What it sacrifices:** It forces you to abandon #2 (Nuremberg Atrocities), #3 (Wall Shooters), and #10 (Marital Rape). Under strict positivism, if the Third Reich or the GDR said "kill them" or "shoot them," and it was written down, it was legal. To punish it retroactively is a violation of legality. If you want to punish the Wall shooters, you cannot be a strict positivist.

  **2. The Pure Natural Law Move ("Extreme Injustice is No Law")**
  *   **The Principle:** Known as the **Radbruch Formula**. If a statute is intolerably unjust, it lacks the nature of law entirely. Therefore, punishing someone for violating "law" that wasn't really law isn't retroactive.
  *   **What it captures:** It saves #2 (Atrocities), #3 (Wall Shooters), and #10 (Marital Rape). It allows you to say the GDR law authorizing shootings was void *ab initio* because it violated higher norms.
  *   **What it sacrifices:** It threatens #1 (Aggression) and #4 (Judge). Why? Because "Aggressive War" is a political category, not necessarily a "natural law" violation in the same visceral way as murder. More dangerously, it makes the line between #3 and #4 very slippery. If the Wartime Judge applied a "trivial" law, was that law "intolerably unjust"? If not, he goes free (which you want). But if the standard is just "injustice," a prosecutor could argue *any* repressive law is intolerable. This principle lacks a threshold mechanism to separate the Wall Shooter from the Radio Judge.

  **3. The Reliance and Notice Principle (Fullerian)**
  *   **The Principle:** Law is a system of guidance. Retroactivity is only forbidden if it defeats a citizen's reasonable reliance on the law's guidance. If the citizen *knew* or *should have known* the act was wrong despite the law, reliance is not reasonable.
  *   **What it captures:** It handles #3 (Shooters knew killing was wrong), #5 (Conscripts didn't have a choice/reliance on survival), and #6 (Expired limitations create vested reliance).
  *   **What it sacrifices:** It struggles with #7 (Tax/Civil). Tax liability often defeats reliance, yet you say it's fine. It also struggles with #1. Did the Nazi leaders *know* aggression was a crime? If the world hadn't codified it, their reliance on sovereignty might have been reasonable.

  ---

  ### Part 2: The Committed Principle

  I am committing you to a modified version of the Radbruch Formula, operationalized for transitional justice. In the literature, this is often referred to as **The Radbruch Formula with a Cognizance Constraint** (drawing on the reasoning of the German Federal Constitutional Court in the *Berlin Wall Guard Cases*).

  It is not enough that the law was unjust. The injustice must be *manifest*, and the actor's culpability must be *personal*.

  **The Principle of Manifest Injustice with Cognizance:**
  Retroactive criminal liability is permissible only if all three clauses are met:

  > **Clause A (The Threshold of Injustice):** The act punished must constitute a violation of a fundamental human right (life, bodily integrity, basic liberty) so severe that it contradicts elementary precepts of justice recognizable across legal systems.
  >
  > **Clause B (The Cognizance Constraint):** At the time of the act, a reasonable person in the defendant's position could have recognized the moral wrongness of the act independent of the regime's statutory authorization.
  >
  > **Clause C (The Reliance Protection):** Retroactive liability is barred if the defendant had a vested reliance interest in the finality of the legal process (e.g., expired statutes of limitation) or if the conduct was merely regulatory/economic rather than a violation of fundamental rights.

  ---

  ### Part 3: Mapping the Principle to Your Cases

  Here is how this principle adjudicates your ten intuitions.

  | Case | Verdict | Motivating Clause | Why it Rules |
  | :--- | :--- | :--- | :--- |
  | **1. Nuremberg Aggression** | **Illegitimate** | **Clause A** | Aggression is a political state crime, not a direct violation of fundamental *individual* human rights recognizable as "murder" at the time. It fails the "manifest" threshold for *individual* criminality without prior statute. |
  | **2. Nuremberg Atrocities** | **Legitimate** | **Clause A & B** | Murder/torture violates fundamental rights (A) and anyone knows it's wrong regardless of statute (B). |
  | **3. Wall Shooters** | **Legitimate** | **Clause A & B** | Right to life/movement is fundamental (A). Shooting an unarmed fugitive is manifestly wrong even if ordered (B). |
  | **4. Wartime Judge** | **Illegitimate** | **Clause A** | Enforcing a ban on foreign radio is regulatory, not a violation of fundamental human rights like life or limb. It fails the Threshold. |
  | **5. Conscript vs. Officer** | **Conscript No / Officer Yes** | **Clause B** | Conscript lacks moral agency/choice (duress); Officer has capacity to recognize the wrong. Cognizance differs by role. |
  | **6. Limitations Period** | **Extend OK / Revive No** | **Clause C** | Active period = no vested reliance. Expired period = vested reliance on finality (C). |
  | **7. Tax / Civil** | **Legitimate** | **Clause C** | These are regulatory/economic, not criminal punishment of fundamental rights. Reliance interests are weaker (C). |
  | **8. Harsher Sentencing** | **Illegitimate** | **Clause B** | Defeats reasonable reliance on the penalty scale existing at the time. |
  | **9. Decriminalization** | **Legitimate** | **N/A** | This is *ex post facto* lenity, which never violates legality principles. |
  | **10. Marital Rape** | **Risky / Illegitimate** | **Clause B** | **See below.** |

  ---

  ### Part 4: The Hard Truths (Where You Are Inconsistent)

  You asked me to tell you when your verdicts are wrong. Here is the diagnosis.

  **1. The #3 vs #4 Distinction (You got this Right, but for the wrong reason)**
  You suspected these were structurally identical. They are not.
  *   **Why you were nervous:** You thought both were "officials applying valid law."
  *   **The Reality:** Clause A separates them. The Wall Shooter violated the **Right to Life**. The Wartime Judge violated a **Regulatory Decree**.
  *   **The Verdict:** Your intuition is correct, but your reasoning ("official applying law") was the problem. It's not about the *role*; it's about the *act*. If the Judge had sentenced someone to death for listening to the radio, Clause A would be met, and he *would* be liable. Since it was trivial, he is not. The principle saves your intuition here.

  **2. The #10 Problem (Marital Rape) — You must abandon this verdict.**
  You lean toward "Legitimate" on prosecuting marital rape from 10 years ago. **My principle forces you to call this Illegitimate.**
  *   **Why:** Clause B (Cognizance). Ten years ago, if the marital exemption was valid law and social consensus accepted it, a "reasonable person" could not have recognized the act as criminal in the same way they recognize murder.
  *   **The Trade-off:** To prosecute #10, you have to argue that moral truth exists independent of social recognition. If you do that, you endanger #1 (Aggression). If you accept #1 (Aggression was not a crime because it wasn't codified), you must accept #10 (Rape was not a crime because the exemption existed).
  *   **My Advice:** Prosecute #10 only if you can prove the "manifest wrongness" was universally acknowledged despite the law (e.g., international treaties ratified then). Otherwise, you are violating the Principle of Legality to achieve moral ends. You cannot have both #1 and #10.

  **3. The #1 Problem (Nuremberg Aggression)**
  You called this "Illegitimate." My principle agrees (Clause A). However, be aware that this makes Nuremberg partially illegitimate. Many legal philosophers argue Aggression *was* criminalized by the Kellogg-Briand Pact. If you accept that, #1 becomes Legitimate. But sticking to your intuition, my principle supports you: Aggression is too political for retroactive *individual* criminalization without clear statute.

  ---

  ### Part 5: Running the Principle on New Cases

  **Case A: Retroactively Criminalizing Profiting from Public Office**
  *   **Scenario:** Businessmen got rich with the old regime's blessing. New gov wants to prosecute.
  *   **Application:** **Illegitimate.**
  *   **Reasoning:** Fails **Clause A**. Profiting, even corruptly, is economic/regulatory. It does not rise to the level of a "fundamental human right violation" (life, liberty, bodily integrity). It also fails **Clause C** (Reliance Protection). They relied on the regime's economic rules. Unless you can frame it as theft of public resources so severe it equates to a rights violation, this is purely retroactive economic regulation. Use civil asset forfeiture (Clause C allows civil), not criminal prosecution.

  **Case B: Retroactively Voiding Pardons Granted by an Outgoing Dictator**
  *   **Scenario:** Dictator pardons his officers. New gov voids the pardons to prosecute.
  *   **Application:** **Illegitimate.**
  *   **Reasoning:** Fails **Clause C**. A pardon creates a vested reliance interest in finality. Voiding it is functionally identical to reviving an expired statute of limitations (Case #6).
  *   **Exception:** Unless the pardon itself was a fraud (not properly issued), the new state must honor the procedural finality granted by the old state, even if the old state was odious. To do otherwise destroys the concept of legal finality for *everyone*, including the new regime.

  ### Summary Name
  This is the **Radbruch Formula with a Cognizance Constraint**.

  **Final Word:**
  You want to punish the Wall Shooter (#3) but not the Radio Judge (#4). My principle allows this based on the *severity of the right violated*, not the validity of the law.
  You want to punish the Marital Rapist (#10) but not the Aggressive War Planner (#1). **You cannot have both.** One relies on "moral truth transcends law" (#10), the other relies on "no crime without statute" (#1). Pick your poison. In transitional justice, I usually advise protecting Legality (#1) over Moral Truth (#10), because the new regime needs the constraint of law more than it needs to correct every past moral wrong.

  Go tell the Commission: Prosecute the killers, spare the bureaucrats, and leave the economic profiteers to civil court. Anything else breaks the rule of law you're trying to build.
