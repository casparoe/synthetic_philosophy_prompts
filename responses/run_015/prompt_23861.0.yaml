prompt: |-
  Analyze the UK's 2016 referendum on EU membership as a test case for the boundary problem in democratic theory: who should have composed the demos for a decision of this kind? The referendum used the ordinary parliamentary franchise -- British, Irish, and qualifying Commonwealth citizens aged 18 and over resident in the UK, plus British citizens who had lived abroad for under fifteen years. Other long-term resident EU nationals could not vote, nor could sixteen- and seventeen-year-olds, though both groups could vote in Scotland's 2014 independence referendum. Gibraltar alone among Britain's overseas territories took part, because it alone lay inside the EU. Apply the all-affected-interests principle and the all-subjected (or coercion) principle in turn: say concretely who each would enfranchise, and where each diverges from the rules actually used and from the other. Then give an honest verdict: does either principle deliver a non-arbitrary answer here, or does the case instead confirm that any procedure for fixing the boundary already presupposes an answer to who belongs -- a circularity no actual electoral design can escape?
reasoning: |-
  Here's a thinking process that leads to the analysis of the UK's 2016 EU referendum as a test case for the boundary problem:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** The UK's 2016 EU Referendum (Brexit).
      *   **Theoretical Lens:** The "Boundary Problem" in democratic theory (who constitutes the *demos*?).
      *   **Specific Task:** Analyze the actual franchise used vs. two normative principles:
          1.  All-Affected-Interests Principle (AAI).
          2.  All-Subjected/Coercion Principle (ASC).
      *   **Requirements:**
          *   Say concretely who each principle would enfranchise.
          *   Identify divergences from actual rules and between the principles.
          *   Give an "honest verdict" on whether either principle solves the arbitrariness/circularity issue.

  2.  **Contextualize the Actual Franchise (The Baseline):**
      *   *Who voted:* UK residents (British, Irish, Commonwealth citizens), 18+, British expats (<15 years).
      *   *Who didn't vote:* EU nationals resident in UK (non-Commonwealth/Irish), 16-17 year olds (except Scotland/Wales devolved elections, but not this referendum), British expats (>15 years), UK citizens in other EU states (unless they returned to vote), Gibraltar (did vote), other Overseas Territories (did not).
      *   *Nature of Decision:* Leaving the European Union (constitutional/international change with domestic impact).

  3.  **Analyze Principle 1: All-Affected-Interests (AAI):**
      *   *Core Idea:* Anyone whose interests are significantly affected by the decision should have a say.
      *   *Application to Brexit:*
          *   *UK Residents:* Obviously affected (economy, law, travel).
          *   *EU Citizens in UK:* Highly affected (residency status, rights). *Divergence:* They were excluded (mostly).
          *   *UK Citizens in EU:* Highly affected (pension, residency, healthcare). *Divergence:* Only those who returned or were <15 years abroad could vote. Many permanent expats excluded.
          *   *Citizens of other EU states:* Affected (trade, security, political balance). *Divergence:* Totally excluded.
          *   *Future Generations/16-17 year olds:* Affected (long-term trajectory). *Divergence:* Excluded (age limit 18).
          *   *Northern Ireland/Irish Citizens:* Affected (border issues). Irish citizens in NI could vote (as residents), but citizens in Republic of Ireland could not.
      *   *Problem:* "Affected" is boundless. A decision by the UK affects the global economy. Does a trader in New York get a vote? The principle lacks a threshold for "significant" affectation.

  4.  **Analyze Principle 2: All-Subjected/Coercion (ASC):**
      *   *Core Idea:* Anyone subject to the binding laws/coercive power resulting from the decision should vote.
      *   *Application to Brexit:*
          *   *UK Residents:* Subject to UK law, which determines the EU relationship.
          *   *EU Citizens in UK:* Subject to UK law regarding their stay. *Divergence:* Excluded.
          *   *UK Citizens in EU:* Subject to EU law (which would change status) and UK law (consular protection). *Divergence:* Mostly excluded.
          *   *Other EU Citizens:* Subject to EU law (which changes if UK leaves). *Divergence:* Excluded.
          *   *16-17 year olds:* Subject to laws passed. *Divergence:* Excluded.
      *   *Nuance:* The referendum was advisory (technically), but politically binding. The *result* subjected people to new legal realities.
      *   *Comparison:* ASC is usually narrower than AAI but broader than the actual franchise regarding resident non-citizens.

  5.  **Compare Divergences:**
      *   *Actual vs. AAI:* Actual is citizenship/residency based. AAI is impact based. AAI would likely include EU nationals in UK, UK expats in EU, potentially other EU nationals.
      *   *Actual vs. ASC:* Actual is citizenship/residency. ASC is subjection to authority. ASC would definitely include resident EU nationals (subject to UK immigration law).
      *   *AAI vs. ASC:* AAI is potentially infinite (economic ripple effects). ASC is bounded by jurisdiction/coercion. AAI includes future generations more naturally; ASC focuses on current legal subjection.

  6.  **The "Honest Verdict" (The Circularities):**
      *   *The Core Philosophical Problem:* To apply AAI or ASC, you first need to decide *what* the decision is and *who* decides the scope of the decision.
      *   *AAI Circularity:* Who decides which interests count? The existing demos? If so, it's circular. If interests are objective, how do we measure them without a prior political framework?
      *   *ASC Circularity:* Who defines the scope of coercion? The state? But the state's boundary is exactly what is being questioned (or in this case, the relationship between states).
      *   *The Brexit Specifics:* The UK government defined the franchise (via Parliament). This was a unilateral decision by the existing *demos* to define itself.
      *   *Conclusion:* Neither principle offers a non-arbitrary, algorithmic solution. They require political judgment, which presupposes a *demos* to make that judgment. The Brexit case confirms the circularity: the boundary was drawn by the very entity whose boundary was theoretically in question (the UK Parliament defining its own mandate to leave a union).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Define the boundary problem and the Brexit context.
      *   *Section 1: The Actual Franchise.* Briefly recap the rules to establish the baseline.
      *   *Section 2: All-Affected-Interests (AAI).* Apply it. Highlight the exclusion of EU nationals and expats. Note the "boundlessness" problem (does it include French farmers?).
      *   *Section 3: All-Subjected (ASC).* Apply it. Focus on legal coercion. Highlight resident EU nationals (subject to UK law).
      *   *Section 4: Comparative Divergences.* Create a clear contrast between the three models (Actual, AAI, ASC).
      *   *Section 5: The Verdict.* Address the circularity. Argue that principles require a meta-decision that only an existing *demos* can make.
      *   *Tone:* Analytical, philosophical, objective, critical.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I mention Gibraltar? Yes, prompt mentions it. Need to ensure I note why (part of EU).
      *   *Check:* Did I mention 16-17 year olds? Yes, prompt highlights Scotland 2014. Need to contrast that.
      *   *Nuance:* The referendum was advisory. Does that change ASC? Technically yes, but practically no. I should acknowledge the advisory nature but treat it as binding for the analysis because it triggered Article 50.
      *   *Circularity:* Make sure to explain *why* it's circular. (e.g., To apply AAI, we need to know the scope of the decision, but the scope is determined by the voters).

  9.  **Final Polish:** Check against the prompt requirements one last time.
      *   Analyze as test case? Yes.
      *   Apply AAI concretely? Yes.
      *   Apply ASC concretely? Yes.
      *   Divergences? Yes.
      *   Honest verdict on circularity? Yes.

  10. (Final Output Generation - similar to the provided good response.)
answer: |-
  The 2016 United Kingdom referendum on European Union membership serves as a potent empirical test case for the "boundary problem" in democratic theory. This problem asks a logically prior question to voting itself: *who constitutes the people (demos) entitled to decide?* In Brexit, the stakes were constitutional and international, yet the franchise was determined unilaterally by the UK Parliament. By analyzing the actual franchise against the **All-Affected-Interests (AAI)** and **All-Subjected (ASC)** principles, we can expose the theoretical tensions and the inevitable circularity in drawing democratic boundaries.

  ### 1. The Baseline: The Actual Franchise
  The European Union Referendum Act 2015 established a franchise based largely on the Westminster parliamentary model.
  *   **Included:** British, Irish, and qualifying Commonwealth citizens resident in the UK (18+); British citizens resident abroad for fewer than 15 years; members of the House of Lords; Gibraltar residents (as part of the EU).
  *   **Excluded:** Other EU nationals resident in the UK (e.g., French, Polish citizens); British citizens resident abroad for more than 15 years; 16- and 17-year-olds (unlike in the 2014 Scottish independence referendum); citizens of other EU member states; residents of other UK Overseas Territories (e.g., Falklands).

  This franchise presupposed that the *demos* was the UK parliamentary electorate, treating the EU withdrawal as a matter of domestic sovereignty rather than a transnational reconstitution.

  ### 2. The All-Affected-Interests Principle (AAI)
  **Theory:** Anyone whose interests are significantly affected by a decision should have a say in making it.

  **Concrete Application to Brexit:**
  *   **UK Residents:** Included (as in actual vote).
  *   **EU Nationals in the UK:** **Included.** Their residency rights, family unity, and economic prospects were directly and profoundly affected.
  *   **UK Expats in the EU:** **Included.** Roughly 1.3 million British citizens living in the EU faced changes to pensions, healthcare, and residency. Under AAI, the 15-year rule is arbitrary; permanent expats are deeply affected.
  *   **Citizens of Other EU States:** **Potentially Included.** A UK exit affected the EU budget, security architecture, and trade balance for all 27 remaining members. A strict AAI application might enfranchise citizens of France or Germany, or at least their representatives.
  *   **16- and 17-Year-Olds:** **Included.** They will live with the consequences of the decision longer than older voters.
  *   **Future Generations:** **Included.** The constitutional trajectory affects those not yet born.

  **Divergence:**
  The AAI principle diverges sharply from the actual rules. It renders the actual franchise **under-inclusive** regarding resident EU nationals and long-term expats, and **over-exclusive** regarding the wider EU citizenry. However, AAI suffers from the "boundlessness" problem: if trade effects count, does a soybean farmer in Brazil affected by UK trade policy get a vote? Without a threshold for "significant" affectation, AAI risks expanding the *demos* to a global scale, rendering decision-making impossible.

  ### 3. The All-Subjected (Coercion) Principle (ASC)
  **Theory:** Anyone subject to the binding coercive power of the laws resulting from the decision should have a say.

  **Concrete Application to Brexit:**
  *   **UK Residents:** **Included.** They are subject to UK law, which would implement the withdrawal.
  *   **EU Nationals in the UK:** **Included.** They are subject to UK immigration and administrative coercion. If the UK government decides their status, they are subjected to that power.
  *   **UK Expats in the EU:** **Ambiguous.** They are subject to EU law (which would change) but not directly to UK domestic coercion. However, they rely on UK consular protection. ASC might include them, but less strongly than AAI.
  *   **Citizens of Other EU States:** **Excluded.** They are subject to EU law, but the UK referendum did not directly coerce them; it coerced the EU institutions, which then coerced their states. The chain of subjection is indirect.
  *   **16- and 17-Year-Olds:** **Included.** They are subject to the criminal and civil law of the state.
  *   **Gibraltar:** **Included.** Subject to UK law and EU law simultaneously.

  **Divergence:**
  ASC diverges from the actual franchise primarily on **resident non-citizens**. The actual vote excluded French or Polish workers in London, yet the outcome subjected them to new UK immigration regimes. ASC argues this is a democratic deficit: one should not be coerced without representation. However, ASC is narrower than AAI; it would likely exclude citizens of other EU states (who are not subject to UK coercion) and might struggle to justify enfranchising expats not subject to direct UK legal enforcement.

  ### 4. Comparative Divergences

  | Feature | Actual Franchise | All-Affected (AAI) | All-Subjected (ASC) |
  | :--- | :--- | :--- | :--- |
  | **Resident EU Nationals** | Excluded (mostly) | **Included** (High impact) | **Included** (Subject to law) |
  | **British Expats (>15 yrs)** | Excluded | **Included** (Life impact) | Ambiguous (Less coercion) |
  | **Other EU Citizens** | Excluded | **Potentially Included** | Excluded (Indirect coercion) |
  | **16-17 Year Olds** | Excluded | **Included** (Future impact) | **Included** (Subject to law) |
  | **Logic** | National Citizenship | Consequentialism | Legal Jurisdiction |

  ### 5. Verdict: The Inescapable Circularity

  Does either principle deliver a non-arbitrary answer? **No.** The Brexit case confirms that any procedure for fixing the boundary already presupposes an answer to who belongs.

  **The Circularity of AAI:**
  To apply the All-Affected-Interests principle, one must first define *which interests count* and *what the scope of the decision is*. Who decides if the economic impact on a French farmer is "significant" enough to warrant a vote? That meta-decision requires a *demos* to make it. In 2016, the UK Parliament decided the scope was "UK residency/citizenship." If we ask the AAI principle to override that, we are asking an abstract theory to perform a political act. Furthermore, if everyone affected votes, the *demos* changes for every single issue (a "fluid demos"), destroying the stability required for a political community to function.

  **The Circularity of ASC:**
  The All-Subjected principle relies on the existence of a coercive legal order. But the Brexit referendum was precisely about *changing* the legal order (leaving the EU jurisdiction). To say EU nationals in the UK should vote because they are subject to UK law presupposes that UK law has the legitimate authority to decide their fate unilaterally. If they had a vote, they would be co-authors of the law, not merely subjects. The principle cannot determine the boundary without assuming the jurisdiction it seeks to legitimize.

  **Conclusion:**
  The 2016 referendum franchise was not derived from first principles of democratic theory; it was a political settlement enacted by the existing sovereign body (Westminster). It treated the EU as a foreign policy matter rather than a constitutional reconfiguration of the *demos* itself.

  This confirms the theoretical suspicion that the boundary problem is **logically prior to democracy and insoluble by democratic means.** You cannot vote on who gets to vote without already having a group to hold the vote. The UK government resolved this circularity not by theory, but by fiat: it assumed the *demos* was the pre-existing parliamentary electorate. While this was legally clear, it was theoretically arbitrary. Neither AAI nor ASC can escape this; they are normative tools for critique, not algorithmic solutions for design. The Brexit referendum demonstrates that in the absence of a transnational *demos* (an EU-wide vote), the boundary will always be drawn by the strongest existing political unit, reinforcing the very sovereignty the vote was meant to interrogate.
