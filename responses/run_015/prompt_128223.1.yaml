answer: |-
  **Exam Question**

  **Course:** Seminar on Rationality and Strategic Reasoning
  **Time Limit:** 75 Minutes
  **Total Marks:** 25

  **Question 1: The Reflective Allocation Problem**

  Consider a scenario involving three agents (A, B, and C) who must divide a non-transferable resource. Each agent faces a binary choice: **Claim** (attempt to seize the majority) or **Yield** (accept an equal third). The payoff structure is such that if all Yield, each receives a high payoff (3). If all Claim, the resource is destroyed, and each receives zero (0). If one Yields while others Claim, the Yielder gets nothing, and the Claimers split the remainder (1.5 each).

  The agents possess structurally identical reasoning capacities (isomorphic cognition). Each can observe the others' *preliminary reasoning steps* (logs of logical derivation) prior to commitment, confirming that all are processing the problem identically. However, there is **no Common Knowledge of Rationality (CKR)**. While A knows B and C reason like A, A does not know that B knows that A knows this, ad infinitum. Final commitments are simultaneous and unobservable until the end.

  **Task:**
  1.  Explain why a superrational agent would recommend **Yield** in this triad, contrasting this with the prediction of standard instrumental rationality (Nash equilibrium).
  2.  Pinpoint exactly how the absence of Common Knowledge of Rationality weakens the superrational argument. Crucially, explain why this epistemic gap destabilizes the *justification* for Yielding without necessarily collapsing the decision back into standard expected-utility reasoning for Claiming.

  ***

  **Model Answer**

  In the Reflective Allocation Problem, standard instrumental rationality predicts universal **Claiming**. In a one-shot interaction without enforceable contracts, Claiming is the dominant strategy; regardless of what others do, attempting to seize the majority yields a higher individual return than Yielding. Consequently, the Nash equilibrium is mutual destruction (0,0,0). Standard rationality treats the other agents' actions as independent environmental variables. My choice cannot causally influence theirs; thus, I must maximize utility against fixed probabilities.

  Superrationality rejects the independence assumption. It posits that because agents are structurally identical, they will not merely *likely* choose the same action, but *must* choose the same action as a matter of logical necessity. If I am superrational, I recognize that my reasoning process is isomorphic to B's and C's. Therefore, I cannot choose Claim while expecting them to Yield. The choice is not between "I Claim/They Yield" and "I Yield/They Claim." The choice is effectively between "All Claim" and "All Yield." Since the payoff for All Yield (3) exceeds All Claim (0), the superrational agent chooses Yield. The decision is not based on altruism, but on the logical correlation of outputs derived from identical algorithms.

  However, the absence of Common Knowledge of Rationality (CKR) introduces a critical fragility. Superrationality typically relies on the assumption that the *method* of reasoning is common knowledge. I must know that you are superrational, and you must know that I know, ensuring that we both trust the logical correlation. In this scenario, agents observe preliminary reasoning steps, establishing first-order knowledge of structural identity. I know we reason alike. But without CKR, I cannot be certain that you trust *my* adherence to superrationality.

  This absence weakens the argument by disrupting the **iterative justification** rather than the first-order choice. At the first level, I decide to Yield because I reason superrationally. But to sustain this, I must believe you will also Yield. You will Yield only if you believe I will Yield. Without CKR, the chain of mutual assurance terminates prematurely. I might reason: "I know we are identical, but does B know that I know this? If B suspects I might doubt the correlation, B might defect to Claim to secure 1.5 rather than risk 0."

  Crucially, this does not automatically collapse the decision back into standard expected-utility reasoning for Claiming. Standard reasoning assumes independence regardless of cognitive symmetry. The superrational agent still acknowledges the logical link; the uncertainty is not about *causality* but about *epistemic depth*. The agent remains in a superrational frame (acknowledging correlation) but faces a higher-order risk that the correlation will be broken by the other's doubt. Thus, the recommendation to Yield remains logically valid based on structural identity, but it loses its *stability* as a self-enforcing equilibrium. The agent is left with a correct logical deduction that is pragmatically vulnerable because the mutual recognition of that deduction is not infinite. The failure is not in the logic of identity, but in the assurance of shared confidence.

  ***

  **Marking Scheme**

  **Total Marks:** 25
  **Grade Boundary:** An **A** (20-25) must demonstrate precise epistemic distinction. A **B** (15-19) identifies the core tension but lacks technical precision regarding common knowledge.

  | Criteria | Required Conceptual Moves | Marks |
  | :--- | :--- | :--- |
  | **1. Superrational Logic** | **Agent-Identification:** Must explain that superrationality relies on *logical correlation* due to structural isomorphism, not causal influence. <br> **Contrast:** Must explicitly state standard rationality treats actions as independent (Nash), leading to Claim/Defect. | 5 |
  | **2. The CKR Gap** | **Symmetric Reasoning vs. Symmetric Beliefs:** Must distinguish between *actually* reasoning alike (given) and *knowing* that others know you reason alike (missing). <br> **Iterative Justification:** Must explain that CKR failure breaks the *recursive assurance* (I know that you know...), not necessarily the first-order observation of similarity. | 10 |
  | **3. Non-Collapse Condition** | **Epistemic Nuance:** Must explain why the argument doesn't revert to standard EU reasoning. The agent still sees the logical link but doubts the *stability* of the other's trust in that link. Standard rationality ignores the link entirely. | 5 |
  | **4. Clarity & Structure** | Argument is coherent, follows the two-part prompt structure, and stays within the scenario constraints. | 5 |

  **Specific Deductions (Errors)**
  *Deduct 5 marks total (from the final score) if either of the following errors occurs:*

  1.  **Conflation Error:** Treating superrationality as **altruism** or moral preference rather than logical correlation/utility maximization. (e.g., "They Yield because they care about the group.")
  2.  **Irrelevance Error:** Treating the missing Common Knowledge as **irrelevant** on the grounds that agents remain individually rational. (e.g., "Since they are identical, CKR doesn't matter; they will still do the same thing.")

  **Grading Notes for Instructors:**
  *   **A Answer:** Explicitly articulates that the failure of CKR disrupts the *recursive mutual assurance* (the "I know that you know" chain). It clarifies that the superrational agent still perceives the logical correlation but fears the *other agent's doubt*.
  *   **B Answer:** Correctly identifies that lack of CKR creates uncertainty/risk but fails to distinguish between the *logical correlation* and the *epistemic assurance*. May vaguely suggest the agents might just "make a mistake" rather than identifying the structural break in iterative knowledge.
  *   **C Answer:** Summarizes Hofstadter or Prisoner's Dilemma without applying the specific "Reflective Allocation" constraints (e.g., ignores the "preliminary steps" detail).
