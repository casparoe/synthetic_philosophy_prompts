          *   *Analysis:* Point-Coincidence is often used to motivate Relationalism or at least to deflate the reality of the manifold. If *only* coincidences are observable (6), does spacetime itself (1) have reality beyond that?
          *   *Compatibility:* One can be a realist about unobservables. But if the *only* justification for LE is observability (6), it leans towards verificationism. Substantivalism usually posits reality beyond immediate observability.
