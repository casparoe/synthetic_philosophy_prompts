  3.  **Evaluate Tensions/Contradictions:**

      *   **Tension 1: (1) Substantivalism vs. (5) Leibniz Equivalence.**
          *   *Classic Hole Argument Logic:* The Hole Argument is traditionally wielded *against* substantivalism. If you are a substantivalist, you typically think manifold points have independent identity. If points have independent identity, diffeomorphisms generate distinct physical situations (violating LE). If you accept LE, you are usually forced into Relationalism or a very specific kind of Sophisticated Substantivalism.
          *   *User's Move:* The user claims (1) Substantivalism *and* (5) LE.
          *   *Analysis:* This is the core "Sophisticated Substantivalism" move (e.g., Saunders, Pooley). It's tenable *if* you redefine substantivalism. However, combined with (2), it changes the flavor.
