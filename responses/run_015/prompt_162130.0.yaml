answer: |-
  Here is the translation, the verdict on your puzzles, the application to your draft, and the tool you asked for.

  ### The Translation: Predictive Processing as Craft

  Forget the biology. Think of your reader's brain as a engine running on **Model Maintenance**.

  **The Generative Model** is the story the reader is writing in their head while they read yours. It is not your text; it is their simulation of your text. It includes who is speaking, where they are, what they want, and what genre of physics (emotional and literal) governs this world.

  **Priors** are the assumptions the reader brings to the first sentence. In a mystery, a prior is "the detective will find the body" or "the narrator knows more than they say." In literary fiction, a prior might be "sentences will be rhythmic" or "emotions will be ambiguous."

  **Prediction Error** is the gap between the reader's Model and your text.
  *   *Good Error:* A plot twist, a strange metaphor, a sudden silence. It spikes attention.
  *   *Bad Error:* A typo, a continuity mistake, a character acting out of established nature without cause. It spikes frustration.
  The brain hates sustained Error. It wants to resolve it.

  **Precision Weighting** is your spotlight. When you describe a thing in detail, you are telling the brain: "Assign high precision to this signal. This matters for the Model." When you skip over a transition, you are saying: "Low precision. Ignore this noise."

  **Active Inference** is the work the reader does to fix Error. They turn the page (seeking new data). They re-read a paragraph (checking old data). They theorize about the killer (updating the Model). If the Error is too high and they cannot fix it, they stop reading (system shutdown).

  **Hierarchical Processing** means there are Models within Models.
  *   *Low Level:* Syntax, grammar, sensory details.
  *   *Mid Level:* Scene goals, character motivations.
  *   *High Level:* Theme, plot resolution, moral argument.
  An error at the High Level (the theme makes no sense) is harder to fix than an error at the Low Level (a typo).

  **Free Energy Minimization** is the efficiency metric. The reader wants to maintain an accurate Model with the least amount of metabolic effort.
  *   *Too little Error:* The book is boring (Model is static, no updates needed).
  *   *Too much Error:* The book is confusing (Model is constantly breaking, too much energy spent repairing).
  *   *The Sweet Spot:* You introduce Error (surprise) only when you provide the means to resolve it (understanding) shortly after.

  ***

  ### The Two Puzzles

  **1. Minimizing Surprise vs. Selling Surprise**
  The theory is not about eliminating surprise; it is about eliminating *unresolved* surprise.
  In your genre, you are selling **High-Precision Prediction Errors**. When you plant a clue or a red herring, you are intentionally breaking the reader's Model. They feel the friction. The pleasure of the mystery genre is not the Error itself; it is the *collapse of the Error* when the solution is revealed.
  At the end of a mystery, the reader's Model snaps into a new shape where all the previous Errors suddenly make sense. The "Free Energy" spent holding those contradictions is refunded with interest.
  *Translation:* You are not minimizing surprise; you are managing the *debt* of surprise. You can borrow heavily in Chapter 1 (high surprise), provided you pay it off with interest in Chapter 20. If you borrow surprise and never pay it off (a random killer, an unexplained magic power), that is unresolvable Error. That is what the brain rejects.

  **2. Falsifiability: Is this just redescription?**
  This is the danger. Predictive Processing is flexible enough to explain anything *after the fact*. If you say "The reader liked this because it updated their model," and "The reader hated this because it confused their model," you have built a theory that cannot fail, which means it cannot help you.
  To make it falsifiable, you must treat **Attention as a Finite Budget**.
  *   *The Test:* If you demand high precision weighting (description, focus, time) on a signal, and that signal does not contribute to a Model Update (plot, character, theme) within a specific window, the theory predicts reader disengagement.
  *   *The Falsification:* If you have a scene that demands high attention but yields no Model Update, and readers *love* it, the theory (as applied here) is wrong. Or, more likely, you missed the Update (perhaps it was emotional, not plot-based).
  *   *Verdict:* It is a redescription *unless* you enforce the budget. If you treat it as "everything matters," it's useless. If you treat it as "everything costs," it's a tool.

  ***

  ### The Draft Applications

  Here is the honest verdict using the translated vocabulary.

  **(1) The Rotting Pears (Chapter 4)**
  *   **The Setup:** Half a page description. High Precision Weighting. You are telling the reader's brain: "Simulate this. This is data."
  *   **The Error:** The pears never return. The Model expects these pears to be a variable in the equation (poison? evidence? metaphor for decay?). They are not used.
  *   **The Verdict:** This is **Unresolved Prediction Error**. Your Debt Rule is correct, but the PP translation adds nuance: It's not just about "owing" the reader; it's about **cognitive drag**. The reader's brain keeps a background process running on "The Pears." It consumes RAM. Even if they don't consciously notice, the efficiency of their Model drops.
  *   **Does PP add anything?** Yes. The Debt Rule says "Pay it or Default." PP asks: "Did you Default *intentionally*?" Sometimes, an unpaid note creates a specific feeling of unease (Kafkaesque). If the unease is the point, keep it. If the unease is accidental noise, cut it.
  *   **Action:** If the pears don't update the Model (plot or character) later, cut the description to low precision (one sentence) so the brain doesn't flag it as important data.

  **(2) The Withheld Age (Chapter 1)**
  *   **The Setup:** Reader builds a Model of the narrator based on voice/vocab. Let's say they assume Adult.
  *   **The Reveal:** "I was eleven." Massive Prediction Error. The Adult Model crashes.
  *   **The Re-reading:** When they go back, they aren't just reading words; they are **re-weighting the Priors**. A sentence like "I felt small" changes from metaphor (emotional) to literal (physical).
  *   **The Verdict:** This is **Controlled Model Collapse**. It works because the new Model (Child Narrator) explains the data *better* than the old Model (Adult Narrator). The "Free Energy" of the confusion is resolved by the reveal.
  *   **Why it works:** The text supported *both* models ambiguously. If the text had contained "I went to first grade" in paragraph 2, the reveal would be a continuity error (Bad Error). Because the text was ambiguous, the reveal is an Update (Good Error).
  *   **Action:** Ensure every sentence in those first three paragraphs is compatible with the Child Model, even if it suggests the Adult Model. If one sentence *only* fits the Adult Model, you have created a continuity error, not a twist.

  **(3) The Beach Drive (The "Nothing Happens" Scene)**
  *   **The Setup:** Woman drives 40 mins. Sits in car. Leaves.
  *   **The Complaint:** Readers call it dead weight.
  *   **The PP Diagnosis:** High Cost (reading time/attention), Low Model Update.
  *   **The Nuance:** In literary mystery, "nothing happens" externally can still mean "high update" internally. Did her Model of herself change? Did her Model of the mystery shift?
  *   **The Verdict:** If she sits in the car and her internal state at the end is the same as the beginning, this is **Entropy**. You are burning the reader's budget for no return. The brain predicts "Scene = Change." If Change = 0, the brain predicts "This book is inefficient."
  *   **Action:** You have two choices.
      1.  *Cut:* Reduce the cost.
      2.  *Load:* Make the internal shift explicit. If she gets out of the car having decided to kill someone, or decided to give up, the Model has updated. The "nothing" was actually "everything." If you can't articulate the shift, the scene is dead.

  ***

  ### The 15-Minute Revision Protocol

  Run this on a scene. Do not overthink. If you can't answer in 30 seconds, mark it "Unknown."

  **Step 1: The Contract (1 Minute)**
  Write down the Reader's Current Model at the start of the scene.
  *   *Who do they think the POV is?*
  *   *What do they think the goal is?*
  *   *What is the emotional temperature?*
  *(This is your Baseline.)*

  **Step 2: The Signal Audit (5 Minutes)**
  Scan the scene. Highlight any noun or verb phrase you have given **High Precision Weighting** to. (Detailed descriptions, repeated words, slow-motion action).
  *   *Test:* For each highlight, ask: "Does this signal update the Model?"
  *   *Pass:* It reveals character, advances plot, or sets a necessary mood constraint.
  *   *Fail:* It is just atmosphere or habit.
  *   *Judgment Call:* Atmosphere is allowed, but it costs budget. If you have three "Fail" highlights, you are overspending.

  **Step 3: The Error Check (5 Minutes)**
  Identify the moment of highest tension or surprise in the scene.
  *   *Test:* Is the Prediction Error resolved *within* the scene or promised for *very soon*?
  *   *Pass:* The reader knows why the surprise happened, or knows where to look for the answer.
  *   *Fail:* The surprise feels random or unconnected.
  *   *Real Test:* If a beta reader said "I was confused here," this is where the Error was unresolvable.

  **Step 4: The Update Verification (4 Minutes)**
  Write down the Reader's Model at the *end* of the scene.
  *   *Compare to Baseline:* What changed?
  *   *If Nothing Changed:* Cut the scene or compress it.
  *   *If Something Changed:* Is it clear? If the change is subtle (literary), ensure the prose weight matches the importance. Don't hide a major Model Update in a low-precision sentence.

  ***

  ### The Residue Report

  **What Carries Over Cleanly:**
  *   **The Debt Rule:** Maps perfectly to Precision Weighting. High description = High expectation of utility.
  *   **Pacing as Budget:** Maps directly to Free Energy. You cannot sustain high tension (high error) without resolution (energy refund).
  *   **The Unreliable Narrator:** This is essentially hacking the reader's Priors. You force them to build a Model on false data, then force an update.

  **What I Had to Bend:**
  *   **Theme:** PP is good at plot and sensory data. It is clunky on "Theme." I had to translate Theme as "High-Level Model Constraints." It works, but it feels less intuitive than "Plot."
  *   **Beauty/Prose:** A beautiful sentence that does nothing for the plot is "inefficient" in PP terms, but essential in literary fiction. I had to classify "Beauty" as a Model Update in itself (an emotional shift). If you treat beauty as noise, you will write sterile prose.

  **What Cannot Be Said in Craft Talk:**
  *   **The Biology of Trust:** PP explains *why* trust breaks (unresolvable error), but it doesn't capture the *emotional relationship* between reader and writer. You can have a technically perfect Model Update that feels cold. PP measures the engine, not the driver.
  *   **The "Uncanny Valley" of Mystery:** Sometimes a clue is *too* perfect. PP says "Clear Signal." Craft says "Obvious." There is a zone where minimizing Error too much kills the pleasure. This theory struggles to quantify the "Goldilocks zone" of ambiguity without relying on your existing intuition.

  **Final Warning:**
  This tool is a scalpel, not a compass. It tells you if a scene is efficient. It does not tell you if it is true. Use it to find the dead weight (the pears, the beach drive). Do not use it to generate the soul of the book. If the math says "cut" but your gut says "this is the heart of the book," trust the gut—but know that you are asking the reader to pay a high tax for it. Make sure they get the revenue later.
