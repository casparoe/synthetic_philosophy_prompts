      *   **The "Rigging" Check:** Is it fair to Clifford? Clifford distinguishes between *belief* and *action*. You can act *as if* without believing. James argues that for trust, the *belief* itself is the causal mechanism. I need to make sure the cases hinge on *belief*, not just action.

