      *   *Case 2 (The "Co-op Buy-in"):* Deciding whether to trust a potential housemate to sign a year lease and manage the utility fund. (High stakes, hard to reverse).
      *   *Wait, the prompt asks for the SAME scenario type but different stakes.* Let's use the Housing Co-op for both, just different commitment levels.
      *   *Scenario:* You are on the selection committee for a new housemate.
      *   *Evidence:* Interview was great, but one reference didn't call back. You feel a "gut vibe" they are trustworthy, but no proof.
      *   *Version 1 (Trivial):* It's a 2-week trial sublet. If they suck, they're out.
      *   *Version 2 (Momentous):* It's a permanent room with a large deposit. If they suck, legal trouble/financial loss.

      *   *Critique of this setup:* Clifford would say "Don't believe they are trustworthy" in *both* cases. You can act cautiously without *believing* they are trustworthy. James would say in Version 1, wait for evidence (not momentous). In Version 2, you *need* to believe they are trustworthy to make the relationship work (self-fulfilling prophecy aspect of trust).
