  4.  **Developing the Analysis:**
      *   **Clifford's Stance:** Evidence is the only moral currency. Stakes are irrelevant to the *ethics of belief* (though relevant to action). Believing without evidence weakens your cognitive discipline.
      *   **James's Stance:** Intellectualism has limits. When evidence is inconclusive, and the decision is Live (appeals to you), Forced (no option to wait), and Momentous (unique/significant), passion decides.
