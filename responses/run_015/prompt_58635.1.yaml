      *   **William James ("The Will to Believe"):** Pragmatism/Voluntarism (in specific contexts). Belief is permissible without sufficient evidence *if* the option is **Live, Forced, and Momentous**. If evidence is inconclusive, our "passional nature" can decide. Stakes *do* matter.

