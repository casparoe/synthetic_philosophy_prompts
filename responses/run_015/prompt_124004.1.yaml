answer: |-
  The tension emerges when a formal axiom posited as a definitional convention, such as the Euclidean metric in physics, becomes empirically entangled to the degree that preserving it requires ad hoc physical modifications, thereby stripping the stipulation of its claimed immunity to factual revision. Conventionalism about stipulation asserts that such axioms are true by virtue of linguistic framework choices and are thus insulated from empirical refutation, whereas holism about confirmation contends that statements face the tribunal of sense experience only as a corporate body. When physical measurements conflict with Euclidean predictions, a conventionalist maintains the axiom by positing universal distorting forces that affect all measuring rods and light rays equally. However, this move transfers the empirical burden to the physical laws, making the retention of the geometric axiom contingent on the simplicity and coherence of the resulting physical theory. Consequently, the axiom ceases to function as a neutral definitional expansion and instead operates as a constraint on empirical theory choice, indistinguishable in practice from a synthetic hypothesis. This conflict does not reduce to simple empiricism because the axiom can still be retained despite recalcitrant data, but doing so reveals that its "analytic" status is merely a pragmatic preference rather than a logical necessity, undermining the foundational distinction between convention and fact.
