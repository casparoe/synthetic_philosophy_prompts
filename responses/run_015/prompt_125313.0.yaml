answer: |-
  Good afternoon.

  Look up at the ridge. In an hour, the final cask goes down. The shaft will be backfilled. The machinery you see behind me will be dismantled, and the ground will be graded. For the engineers and the geologists, this is the end of a construction project. For the families and the farmers here, it is the end of thirty years of noise, of traffic, and of watching strangers walk over your land.

  For the linguists and semioticians in the marquee, however, this is only the beginning. Your work starts when ours stops. You are tasked with speaking to people who do not exist yet, who speak no language we know, in a world we cannot picture.

  I chaired the panel that chose the markers you will see rising from that ridge. For years, we argued about how to say 'danger' without words. We argued about pictograms, about levels of weirdness, about how to make a message that lasts ten thousand years. But somewhere along the way, I became convinced we were asking the wrong question.

  There is a concept in the history of computing regarding machines that reproduce themselves. To do this, the machine carries a description of its own construction. It uses that description in two ways. First, it reads the description to build the offspring. Second, it copies the description without reading it at all, simply handing it over to the new machine. The insight is this: the part of the instruction that survives is exactly the part that is never opened.

  This repository is that unopened tape.

  We have been operating under the assumption that our job is to be understood. We want the future to know exactly what this is, and exactly why they should leave it alone. But meaning is perishable. Language shifts. Culture dissolves. Stone and nickel alloy endure, but they endure precisely because they are dumb matter. They do not carry meaning; they carry mass. Durability and understanding pull in opposite directions. The longer something lasts, the less likely it is to be read correctly.

  So, we stopped trying to ensure accuracy. We started trying to ensure survival.

  We cannot know what the people of ten thousand years from now will think when they stand on this ridge. They might think this is a tomb. They might think it is a temple. They might think it is a curse, or a monument to a king we never were, or a hoax played by their ancestors. We cannot stop them from thinking those things.

  But we can design the earthworks so that it does not matter.

  If they think it is a tomb, they will treat it with reverence and stay away. If they think it is unstable ground, they will avoid building on it. If they think it is cursed, they will not dig. Our goal is not that they know the truth. Our goal is that every plausible misreading still leads to the same behaviour: leave this place alone. We are not optimising for clarity. We are optimising for robustness to error.

  This changes what we say to the people who built this.

  To the workers here: you have spent careers constructing something whose entire value lies in it never being used. You have poured concrete that must not be broken. You have welded seals that must not be opened. In most trades, success is measured by what you produce. Here, success is measured by what remains undisturbed. You are building obscurity. You are building silence. That is a difficult thing to take pride in, because it offers no applause. But look at the ridge. The fact that it will stand, indifferent and unyielding, is the only testimony you need.

  And to the local community, the farmers who have watched this project for thirty years: your suspicion was not an obstacle. It was a load-bearing wall. You asked what happens if we are wrong. You asked what happens if the markers fail, or if the maps are lost. Those questions forced us to abandon the idea that we could control the future with words. We cannot. We are guessing. We are guessing about people we cannot meet, in languages we cannot speak. Your insistence that we might be wrong is the reason we designed for misunderstanding. You kept us honest when it would have been easier to be confident.

  So, what is left to say?

  I cannot tell you that this is safe. Safety is a promise about the future, and I do not own the future.
  I cannot tell you that you will be remembered. Ten thousand years is a long time to hold a name.
  I cannot tell you that the message will be legible. It will not be.

  But I can tell you this: we have built a question mark into the landscape that functions as a wall. We have accepted that we will not be understood, and we have made sure that being misunderstood is survivable.

  In a few minutes, the cask will lower. The shaft will close. The active work ends. The passive work begins. The earth will take over the job of keeping the secret. We have done what we can. We have made a thing that must be forgotten to be successful.

  Thank you.
