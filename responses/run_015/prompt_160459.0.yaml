answer: |-
  Here are the desiderata for a consequentialist decision procedure under cluelessness, adjudicated for necessity, followed by an analysis of their compatibility and a brief evaluation of candidate procedures.

  ### I. The Desiderata

  **1. No Zero-Weighting of Unmeasurable Effects**
  *   **Specification:** The procedure cannot assign zero expected value (or decision-weight) to consequences merely because their sign or magnitude is epistemically inaccessible.
  *   **Case:** Consequentialism is ontologically committed to the goodness of outcomes, not the knowability of them. To zero-weight the unknowable is to abandon consequentialism for a form of epistemic constructivism.
  *   **Status:** **Non-negotiable.** Without this, the procedure dissolves the problem rather than solving it.

  **2. No Quiet Reduction to Near-Term Maximization**
  *   **Specification:** The procedure cannot output the same verdicts as a rule that simply maximizes expected value over the foreseeable horizon (e.g., 100 years), unless the long-run evidence genuinely converges to zero.
  *   **Case:** If the far future dominates in magnitude, a procedure that ignores it to avoid uncertainty is systematically biased against high-stakes interventions. It fails the "dominance" condition of the cluelessness problem.
  *   **Status:** **Non-negotiable.** This distinguishes a *solution* to cluelessness from a *capitulation* to it.

  **3. Grain-Invariance (Individuation Independence)**
  *   **Specification:** Verdicts must not change if an option is described more finely (e.g., "raising a hand" vs. "raising a hand at velocity *v*") or if two options are merged into a disjunctive description.
  *   **Case:** Rational choice should depend on the world-states an option produces, not the linguistic or conceptual grid used to catalogue them. If finer grain multiplies unmeasurable downstream variance, the procedure becomes manipulable by description.
  *   **Status:** **Non-negotiable.** This is a standard consistency requirement for rational choice. However, as you suspect, it is under extreme stress here.

  **4. Near-Term Weight under Sign-Symmetry**
  *   **Specification:** When long-run effects are judged sign-symmetric (expected value ~0 due to equal probability of positive/negative outcomes), the procedure must specify whether near-term reasons break the tie, and by how much.
  *   **Case:** If long-run symmetry results in total indifference, the agent faces paralysis among ordinary options. If near-term reasons count, we need a discount function or lexical priority rule.
  *   **Status:** **Non-negotiable.** Action-guidance requires a tie-breaking mechanism when primary considerations cancel out.

  **5. Anti-Mugging Stability (Tiny Probability/Astronomical Payoff)**
  *   **Specification:** The procedure must have a built-in policy for low-probability, high-impact hypotheses rather than inheriting the agent's raw priors.
  *   **Case:** Under cluelessness, priors over far-future signs are unstable. A procedure that inherits raw priors is vulnerable to "Pascal's Mugging" variants where speculative long-run chains dominate all tangible evidence.
  *   **Status:** **Camp Preference (with a Non-negotiable core).** *That* the procedure must stabilize is non-negotiable; *how* (bounded utility, risk-weighting, probability thresholds) is camp-dependent.

  **6. Graceful Degradation (Permissible Sets)**
  *   **Specification:** As cluelessness deepens, the procedure should return a set of permissible options rather than returning "no verdict" or a single arbitrary choice. It must distinguish "all options are equal" from "comparison is impossible."
  *   **Case:** The agent must act. A verdict of "incomparable" leads to paralysis. A verdict of "permissible set" allows for secondary criteria (e.g., personal preference) to operate within moral bounds.
  *   **Status:** **Non-negotiable.** Feasibility constraint for real-time agents.

  **7. Meta-Decision on Information Gathering**
  *   **Specification:** The procedure must determine whether to invest resources in reducing cluelessness (research/thinking) versus acting on current evidence.
  *   **Case:** Cluelessness is often a function of effort. A static procedure that ignores the value of information is dynamically inconsistent.
  *   **Status:** **Non-negotiable.** Rationality requires optimizing the decision *process*, not just the immediate output.

  ---

  ### II. Incompatibilities and the "Main Work" Requirement

  **The Incompatible Subset**
  You cannot jointly satisfy **{1, 2, 4, 6}** without violating **5** or collapsing into incoherence.
  *   If you respect unmeasurable effects (**1**) and refuse to reduce to the near-term (**2**), the far future dominates the calculation.
  *   If the far future dominates but is sign-symmetric (**4**), the EV is zero.
  *   If the EV is zero, you must rely on near-term tie-breakers to avoid paralysis (**6**).
  *   But relying on near-term tie-breakers when the far future *might* be asymmetric (but unknown) looks suspiciously like **Quiet Reduction (2)**.
  *   Furthermore, if you respect unmeasurable effects (**1**), you are vulnerable to astronomical payoffs (**5**), which destabilizes the near-term tie-breakers.

  **The Primary Exclusionary Requirement**
  You guessed **Grain-Invariance (3)** is the requirement that does the most work in excluding candidate procedures. I argue this is incorrect.

  **Grain-Invariance is a technical hurdle, but *No Quiet Reduction (2)* is the substantive killer.**
  Most candidate procedures (e.g., "maximize expected value given current credences," "follow common sense," "prioritize robust goods") fail because they implicitly treat the unknowable as zero. They satisfy Grain-Invariance easily because they ignore the fine-grained long-run causal chains that make individuation problematic.
  *   **Why Grain-Invariance isn't the main blocker:** We can formalize procedures over state-spaces rather than option-descriptions to mitigate grain issues. The deeper problem is that *any* procedure respecting the dominance of the far future (Req 1 & 2) yields such high variance that action guidance (Req 6) becomes impossible without arbitrarily privileging the near term.
  *   **Why Non-Reductionism (2) does the work:** It forces the procedure to carry the weight of the infinite/unknown. Almost all tractable decision theories fail here because they are designed for environments where consequences are computable. Req 2 rules out 90% of standard decision theories immediately because they are not designed for *epistemic black holes*. The tension isn't how we describe the options (Grain); it's that respecting the options' true causal depth makes them mathematically unmanageable.

  ---

  ### III. Evaluation of Candidate Procedures

  **1. Maximizing EV with a Prior over Signs**
  *   **Performance:** Fails **Req 5** (Anti-Mugging) and **Req 2** (Non-Reductionism).
  *   **Analysis:** If the prior is symmetric, EV is zero, leading to paralysis unless near-term breaks ties (violating **Req 2** if the far future actually dominates). If the prior is sensitive to speculative chains, it succumbs to Mugging. It treats the "unmeasurable" as "measurable via prior," which is epistemically arrogant.

  **2. Deferring to Robust Near-Term Reasons**
  *   **Performance:** Fails **Req 1** (No Zero-Weighting) and **Req 2** (Non-Reductionism).
  *   **Analysis:** This is the "common sense" solution. It satisfies **Grain-Invariance** and **Action Guidance** easily. However, it is not a solution to cluelessness; it is a denial of the premise that the far future matters. It effectively assigns zero weight to the unknowable.

  **3. Hedging Across a Portfolio of Bets**
  *   **Performance:** Satisfies **Req 6** (Graceful Degradation) and **Req 7** (Meta-Decision). Struggles with **Req 3** (Grain) and **Req 2**.
  *   **Analysis:** By treating options as a portfolio (e.g., "do some near-term good, some long-term research"), this approach handles uncertainty well. It returns a permissible set. However, it requires a metric to balance the portfolio, which returns us to the weighting problem. It also risks violating Grain-Invariance if "hedging" is defined by coarse-grained categories.

  ---

  ### IV. Confidence Statement

  **Confidence:** I am **moderately confident** (approx. 75%) in the adjudication of the desiderata and the claim that Non-Reductionism is the primary exclusionary force. The literature on cluelessness (Lenman, Greaves, Ord) suggests the tension between *respecting the far future* and *making a decision* is the central aporia, not merely the description of options.

  **Least Certain Claim:** I am least sure about the **Non-negotiable status of Grain-Invariance (Req 3)** in this specific context. It is possible that under radical cluelessness, *no* rational procedure can be grain-invariant because the causal structure of the world itself is sensitive to micro-individuation in ways that macro-descriptions hide. If grain-invariance is theoretically impossible here, it should be downgraded from a requirement to a regrettable limitation, which would shift the "main work" of exclusion back toward it. However, for a normative chapter, holding it as a requirement is necessary to stress-test the procedures.
