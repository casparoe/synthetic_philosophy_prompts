answer: |-
  **Project Title:** The Audience of Lawhood: Functional Divergence in the Humean/Anti-Humean Debate

  **Project Overview**
  The debate between Humean and Anti-Humean accounts of laws of nature has reached a dialectical stalemate. Both camps implicitly agree on a single scoreboard: a candidate account succeeds if it delivers the correct counterfactuals. Humeans argue the Best System of the global mosaic secures counterfactuals without extra metaphysical furniture; Anti-Humeans argue that without governing relations, laws cannot *make* counterfactuals true. This proposal argues that this stalemate is an artifact of the chosen scoreboard. By focusing exclusively on counterfactual support, both sides conflate three distinct jobs laws are expected to do: (1) underwriting counterfactuals, (2) licensing inductive policy for agents embedded within the world, and (3) explaining why the mosaic is structured as it is.

  This project demonstrates that these three jobs can come apart. I will construct "policy-feedback worlds"—models where regularities hold only so long as inhabitants do not rely on them for prediction. In these worlds, the Humean Best System remains well-defined globally, yet fails to license induction for internal agents. Conversely, Anti-Humean governing relations lack a stable target to govern. The upshot is a shift in the debate: the central question is not merely how laws ground the mosaic, but whether "law" is a notion with an essential audience.

  **The Research Question**
  Does the concept of natural law require a constitutive link to the epistemic perspective of internal agents, or is lawhood solely a function of global metaphysical structure? Specifically: when the utility of a regularity for internal prediction diverges from its status in the global best system or governing structure, which fact determines the presence of a law?

  **Critical Gap: Structural Blind Spots**
  Existing positions do not merely overlook this question; their structural commitments prevent them from asking it.
  *   **Humeanism:** The Best System Analysis is defined from a "God's Eye View" over the completed mosaic. Its criteria (simplicity, strength) are objective features of the total history. Consequently, Humeanism structurally lacks the vocabulary to register when a system is *inaccessible* or *self-defeating* for agents within the mosaic. It treats the usability of laws as a contingent bonus rather than a constitutive constraint.
  *   **Anti-Humeanism:** Governing accounts require laws to be ontologically prior to and productive of the mosaic. In policy-feedback worlds, the mosaic's structure is partially determined by the agents' epistemic state (their predictions). This reflexivity dissolves the direction of fit required for governance. Anti-Humeanism cannot accommodate laws that are sensitive to their own recognition without collapsing into circularity.

  Both positions assume the "view from nowhere" and the "view from within" must coincide. This project shows they do not.

  **Methodology and Timeline**
  The project proceeds in three phases over twelve months, concurrent with two other dissertation chapters.

  *   **Months 1–3 (Model Construction):** Rigorous specification of policy-feedback worlds. I will model scenarios where a regularity $R$ holds iff the frequency of predictions based on $R$ stays below threshold $T$. I will determine the conditions under which the Humean Best System identifies $R$ as a law despite its predictive instability.
  *   **Months 4–7 (Analysis):** Apply the three-job taxonomy to these models.
      *   *Humean Track:* Demonstrate that the Best System delivers counterfactual support (Job 1) and mosaic explanation (Job 3) but fails inductive licensing (Job 2).
      *   *Anti-Humean Track:* Demonstrate that no stable governing relation can be posited without violating the feedback constraint.
  *   **Months 8–10 (Synthesis):** Evaluate the "Audience Thesis." If Job 2 is essential to our concept of law, Humeanism requires revision (incorporating agent-relative simplicity) or rejection. If Job 2 is secondary, we must accept "laws" that are useless to knowers.
  *   **Months 11–12 (Writing):** Drafting the dissertation chapter and a companion article.

  *Note on Formalization:* A secondary thread proposed measuring "counterfactual slack" (the class of mosaics where a law holds and agent behavior remains identical). Given the one-year timeline and the philosophical priority of the argument, I will treat this conceptually rather than formally. Formal modeling risks becoming a project unto itself; the philosophical payoff lies in the divergence of the three jobs, not the metric of the divergence.

  **Why This Approach?**
  *   **Vs. New Intuition Cases:** Standard pump cases (e.g., worlds with one exception) assume the three jobs travel together. They deepen the trench rather than bridging it. Feedback worlds force the jobs apart.
  *   **Vs. Appeals to Physics:** Actual physics assumes stable regularities. Appealing to contemporary science begs the question against the metaphysical possibility of feedback worlds and obscures the conceptual analysis of "law."
  *   **Vs. Explanatory Comparison:** Standard comparisons ask which account explains *more*. This project asks which account explains *for whom*. It shifts the metric from metaphysical economy to functional role.

  **Possible Conclusions**
  1.  **The Deflationary Outcome:** The three jobs are distinct concepts currently masquerading as one. The debate is a category error.
      *   *Defensibility:* To be a successful fellowship outcome, this must show *why* the conflation occurred (e.g., historical accident) and provide a taxonomy for future work.
  2.  **The Pragmatic Turn:** Lawhood is essentially tied to the internal agent's perspective (Job 2 is primary).
      *   *Defensibility:* This requires showing that counterfactual support (Job 1) is derivative of inductive utility, not vice versa.
  3.  **The Metaphysical Priority:** Lawhood is global (Job 1/3 primary); agent utility is secondary.
      *   *Defensibility:* This requires accepting that there can be "laws" that are impossible to use, arguing that our intuition otherwise is anthropocentric bias.

  The most defensible outcome is a qualified Pragmatic Turn: showing that while Humeanism captures the metaphysics of the mosaic, it fails as an account of *nomological* practice unless it incorporates agent-relative constraints.

  **Scope and Risk Management**
  This is a one-year fellowship alongside two other chapters.
  *   **Risk:** The policy-feedback models become too complex to analyze rigorously.
  *   **Mitigation:** I will treat these as philosophical thought experiments constrained by logical consistency, not physical plausibility. I will not simulate the worlds but analyze their logical properties.
  *   **Cutting Scope:** If the Anti-Humean analysis proves intractable (as their position may simply deny the possibility of such worlds), I will focus exclusively on the Humean blind spot. Demonstrating that the dominant Humean framework cannot account for the *usability* of laws is a sufficient contribution for a dissertation chapter. The formal "slack" metric will be dropped entirely if it impedes progress on the three-job taxonomy.

  **Significance**
  This project does not merely add a new move to an existing game; it questions the scoreboard. By isolating the epistemic role of laws from their metaphysical grounding, it offers a path out of the grounding stalemate. It forces metaphysicians of science to confront whether their accounts describe the world as it is, or the world as it is navigable.
