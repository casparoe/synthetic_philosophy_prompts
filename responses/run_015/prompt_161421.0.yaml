      *   **Title:** Needs to be catchy but precise. "The Audience of Lawhood" or "Lawhood for Whom?"
      *   **Project Summary (The Hook):** Start with the stalemate. Introduce the "Three Jobs." Introduce the Policy-Feedback World. State the thesis: The debate conflates metaphysical grounding with functional utility for internal agents.
      *   **The Question:** Needs to be specific. Not "Who is right?" but "Does the functional role of lawhood for internal agents diverge from its metaphysical grounding role, and if so, which dictates the concept?"
      *   **Critique of Existing Positions:**
          *   *Humeanism:* Structural blind spot is the "God's Eye View." The Best System is defined over the *whole* mosaic. It doesn't care if the system is usable by agents *inside* the mosaic. It misses the *epistemic accessibility* constraint as a constitutive feature of lawhood.
          *   *Anti-Humeanism:* Structural blind spot is "Stability." They need laws to be prior to and productive of the mosaic. In feedback worlds, the mosaic reacts to the epistemic state. There is no stable "governer" prior to the governed. They miss the *reflexivity* of law-claims.
      *   **Methodology & Timeline:**
          *   Months 1-2: Lit review (focused on functional roles) + Fleshing out the Feedback World cases.
          *   Months 3-5: Humean analysis (Best System vs. Agent Utility).
          *   Months 6-8: Anti-Humean analysis (Governing vs. Reflexivity).
          *   Months 9-10: Synthesis/Resolution (The "Audience" thesis).
          *   Months 11-12: Writing/Polishing.
          *   *Verdict on Formal Slack:* Cut the heavy formalism. Use it as a conceptual heuristic. It's too risky for the timeline/skillset.
      *   **Why This Approach?**
