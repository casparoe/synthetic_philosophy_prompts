          *   *Defensibility:* To make Option A defensible, show that current theories fail *on their own terms* when these jobs diverge. To make Option B defensible, show that "law" is a kind term like "money" or "promise" (institutional facts).
      *   **Scope:** If too big, cut the Anti-Humean deep dive. Focus on exposing the Humean blind spot (since the feedback world is naturally friendlier to a Humean description but hostile to Humean *utility*). Or, cut the "Three Jobs" taxonomy and focus solely on the Feedback World as the wedge. *Recommendation:* Keep the Three Jobs, cut the Formal Slack.

