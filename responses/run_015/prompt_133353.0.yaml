answer: |-
  ### Specification of Desiderata for an Account of Life

  The following criteria specify the conditions any definition of "alive" must meet to be both biologically tenable and operationally useful for this committee. Each is marked as **Non-Negotiable (NN)** (required for biological coherence or regulatory safety) or **Preference/Artifact (P/A)** (driven by specific philosophical camps or the binary nature of regulation).

  **1. The Verdict Constraint**
  *   **Specification:** The account must assign a binary state (Alive/Not-Alive) to a specific entity at a specific time $t$.
  *   **Motivation:** Regulatory regimes require clear triggers for containment protocols. We cannot issue permits based on "70% alive."
  *   **Test Cases:** The **Tessellate** (diffuse network) and the **Chimera** (hybrid machine). The definition must force a decision on whether the patch or the hybrid is a single living entity or a process/object.
  *   **Status:** **Artifact of Regulatory Purpose.** Biologically, life likely admits of degree (see Distinction 7), but the committee cannot operate on gradients.

  **2. The Metabolic Constraint**
  *   **Specification:** The entity must demonstrate the capacity for free-energy transduction to maintain internal order, distinct from passive equilibrium.
  *   **Motivation:** Distinguishes living systems from static matter or simple replicators.
  *   **Test Cases:** **Fire** (consumes fuel and grows but is not alive) vs. **Dormant Spore** (no current metabolism but is alive). The definition must distinguish exothermic chemical chains from endogenous metabolic maintenance.
  *   **Status:** **Non-Negotiable.** Without energy transduction, there is no agency.

  **3. The Dormancy Constraint**
  *   **Specification:** The account must classify an entity as alive during periods where metabolic activity and replication are temporarily suspended, provided the capacity to resume is intrinsic.
  *   **Motivation:** To prevent regulatory loopholes where hazardous agents are deemed "safe" because they are currently inactive.
  *   **Test Cases:** **Dormant Bacterial Spore** and **Desiccated Tardigrade**. Both are metabolically indistinguishable from complex dust when dry, but must be treated as alive.
  *   **Status:** **Non-Negotiable.**

  **4. The Individuality Constraint**
  *   **Specification:** The account must identify the spatial and functional boundaries of the "unit of life" to determine what exactly is being contained.
  *   **Motivation:** Containment requires knowing *where* the organism ends and the environment begins.
  *   **Test Cases:** **Siphonophore/Fungal Mycelium** (is the individual the zooid/hypha or the colony?) and the **Tessellate** (no individuated units, only a splitting patch).
  *   **Status:** **Non-Negotiable.** Without individuation, containment protocols cannot be scoped.

  **5. The Sterility Constraint**
  *   **Specification:** The capacity for reproduction or evolution must not be a necessary condition for an *individual* to be classified as alive at time $t$.
  *   **Motivation:** Many popular definitions (e.g., NASA's "capable of Darwinian evolution") fail here. An individual's status should not depend on its reproductive future.
  *   **Test Cases:** **Mule** (sterile hybrid) and **Skin Cell in Culture** (cannot form an organism, but is alive).
  *   **Status:** **Non-Negotiable.**

  **6. The Dependency Constraint**
  *   **Specification:** The account must determine if reliance on a host for replication disqualifies an entity from being alive, or merely classifies it as a specific *type* of living thing (parasite).
  *   **Motivation:** To resolve the status of obligate intracellular agents.
  *   **Test Cases:** **Virus** (replicates only in host) vs. **Prion** (misfolded protein, replicates via templating).
  *   **Status:** **Preference of a Particular Camp.** Biologists are split on viruses. For this committee, if it poses a replication risk, it may need to be treated *as if* alive regardless of ontological status.

  **7. The Substrate Constraint**
  *   **Specification:** The definition must not rely on specific chemical constituents (e.g., carbon, DNA) but on functional organization.
  *   **Motivation:** Engineered systems may use alternative chemistries or hardware.
  *   **Test Cases:** **Chimera** (silicon component doing free-energy transduction) and **Computer Worm** (digital replication).
  *   **Status:** **Non-Negotiable (for this Committee).** While biological essentialists prefer carbon chauvinism, an ethics regime for *engineered* systems cannot presuppose biochemistry.

  **8. The Historical Ignorance Constraint**
  *   **Specification:** The classification must be determinable from the entity's current state and structure, without requiring knowledge of its genealogical history or origin.
  *   **Motivation:** Regulators cannot audit the deep past of a novel engineered system.
  *   **Test Cases:** **Tessellate** (did it evolve or just precipitate?) and **Chimera**.
  *   **Status:** **Non-Negotiable.**

  **9. The Categorical Granularity Constraint**
  *   **Specification:** The account must distinguish between: *Alive* (the state), *Organism* (the whole), *Part* (constituent), *Product* (secretion/shedding), *Once-Alive* (dead), *Dormant* (suspended), and *Never-Alive* (abiotic).
  *   **Motivation:** Ethical protections apply to *alive* things; containment applies to *organisms*; hazards may be *products*.
  *   **Test Cases:** **Skin Cell** (Alive/Part), **Prion** (Product/Never-Alive), **Corpse** (Once-Alive), **Fire** (Never-Alive).
  *   **Status:** **Non-Negotiable.**

  ***

  ### Analysis of Constraints

  **1. The Collision: Generalization vs. Sharp Cutoff**
  You are correct that the **Substrate Constraint** (general enough for chemistry we have never seen, e.g., the Tessellate) and the **Verdict Constraint** (sharp yes/no cutoff) cannot be jointly satisfied without arbitrariness.
  *   **Diagnosis:** This is not a defect in the definitional project per se, but a sign that **the committee has been given a purpose no definition can serve.** "Life" is a cluster concept (Wittgensteinian family resemblance) that admits of degree (Distinction 7). By demanding a binary verdict on a continuous phenomenon—especially one extending to hypothetical physics (Tessellate)—the regulatory mandate forces a category error. The definition will either be too narrow (excluding risky novel systems) or too broad (regulating fire-like processes). The committee should anticipate that edge cases will require *ad hoc* legislation rather than definitional ruling.

  **2. The Most Exclusionary Desideratum**
  The **Sterility Constraint** (Desideratum 5) does the most work in excluding otherwise-popular definitions.
  *   **Reasoning:** Most robust theoretical definitions (e.g., the NASA working definition: "a self-sustaining chemical system capable of Darwinian evolution") define life by its *population-level* capacity to evolve. This immediately excludes the **Mule**, the worker ant, and the post-menopausal human from being "alive" in the strict sense, classifying them instead as "vehicles" for genes. To satisfy the committee's need to protect individuals (ethics regime), the definition must decouple *being alive* from *replicating*. This kills almost all evolutionary-biology-centric definitions.

  **3. The Origin Constraint: Genuine or Prejudice?**
  The **Historical Ignorance Constraint** (Desideratum 8) is a **Genuine Constraint**, not academic prejudice.
  *   **Reasoning:** Origin-of-life research seeks to explain how non-life becomes life. If a definition requires "descent from prior life" (biological continuity), it renders the detection of the *first* life or *synthetic* life impossible by fiat. For a regulator, risk is a function of current capacity (metabolism, replication, harm), not ancestry. A dangerous **Tessellate** that spontaneously emerged from a chemical bath poses the same containment risk as one that evolved. Requiring genealogical proof creates an epistemic black box that regulators cannot penetrate.
