answer: |-
  Here is a specification of desiderata for an editorial norm governing the weighting of inside-view and outside-view evidence in science journalism.

  ### The Desiderata

  **1. The Pre-Specification Requirement**
  *   **Status:** Non-Negotiable (NN)
  *   **Motivating Case:** Reference-class shopping. A reporter covers a "breakthrough" in telepathy. If they choose the reference class *all psychology studies*, the base rate of replication is low (outside view says bury it). If they choose *studies by this specific prestigious lab using this specific fMRI protocol*, the base rate might be higher (outside view says run it). Without a rule for selecting the class before seeing the result, the outside view becomes a weaponized justification for any pre-existing editorial instinct.
  *   **Cheating:** Defining the reference class *after* the base rate is known, or defining it so narrowly (e.g., "primate cognition studies published in *Nature* in 2023 by authors named Smith") that it contains only the case at hand, effectively dissolving the outside view.

  **2. The Contamination Correction Requirement**
  *   **Status:** Non-Negotiable (NN)
  *   **Motivating Case:** The selection shadow. The "base rate" of published scientific findings is not the base rate of *truth*; it is the base rate of *publication*, which is already filtered by the same enthusiasm and novelty bias your desk is trying to correct. If you anchor on the replication rate of *published* primate cognition studies, you are anchoring on a distribution contaminated by the very error you seek to avoid.
  *   **Cheating:** Treating the literature's published success rate as a neutral prior. A rule satisfies this only if it explicitly discounts the base rate to account for publication bias (e.g., assuming the true failure rate is $X$% higher than the published failure rate) or admits it cannot correct for it.

  **3. The Specificity Override Requirement**
  *   **Status:** Camp Preference (Inside-View Camp)
  *   **Motivating Case:** Inside-view as heterogeneity evidence. Sometimes the "inside view" isn't just optimism; it's evidence that *this* case does not belong to the average reference class. (e.g., A new statistical method that explicitly corrects for the p-hacking that ruined the previous base rate). If the rule forces you to discount by the class average despite mechanistic evidence that the mechanism of error has been removed, the rule ignores the very information that makes the new study new.
  *   **Cheating:** Dismissing all mechanistic explanations as "theorizing" to force compliance with the base rate, or conversely, accepting any plausible-sounding mechanism as an automatic override without independent verification.

  **4. The Actionability Requirement**
  *   **Status:** Non-Negotiable (NN)
  *   **Motivating Case:** The output gap. A credence of "40% likely true" is useless to an editor. The rule must map epistemic states to editorial actions: Spike, Run-as-reported, or Run-with-hedge. Furthermore, it must account for the fact that the cost of a false positive (retraction, loss of credibility) is not equal to the cost of a false negative (missing a Nobel-worthy discovery).
  *   **Cheating:** Outputting a probability or a "confidence level" without a prescribed editorial action attached to it, leaving the editor to translate the number into a decision ad hoc.

  **5. The Interpretation Gap Requirement (Reception Sensitivity)**
  *   **Status:** Non-Negotiable (NN)
  *   **Motivating Case:** Hedging is read as assertion. Readers scan for the noun and verb, not the adverb. A headline reading "Study Suggests Monkeys *May* Plan Ahead" is often remembered as "Monkeys Plan Ahead." A norm that calibrates the *writer's* confidence but ignores the *reader's* uptake is epistemically vain.
  *   **Cheating:** Satisfying the requirement by adding "may" or "suggests" to the copy while keeping the headline and lead paragraph declarative. The rule must govern the *salience* of the claim, not just the syntax.

  **6. The Computational Tractability Requirement**
  *   **Status:** Non-Negotiable (NN)
  *   **Motivating Case:** Deadline pressure. The decision must be made in under a day without a statistician. A rule that requires a meta-analysis, a calculation of posterior odds, or a deep dive into the lab's history of retractions is a rule that will be ignored when the file is due at 5 PM.
  *   **Cheating:** Proposing a theoretically sound method that requires data access or calculation time unavailable to a general-assignment science desk (e.g., "calculate the prior probability based on the field's false-discovery rate").

  **7. The Auditability Requirement**
  *   **Status:** Non-Negotiable (NN)
  *   **Motivating Case:** Managerial defense. An editor who did not report the story must be able to verify that the rule was followed without re-doing the reporting. If the rule relies on the reporter's "gut feeling" about mechanistic plausibility, it cannot be audited.
  *   **Cheating:** Relying on unstated premises or private knowledge. (e.g., "I discounted the base rate because the method looked robust." An auditor cannot check "looked robust.")

  **8. The Signal Retention Requirement (Discrimination)**
  *   **Status:** Camp Preference (Outside-View Camp)
  *   **Motivating Case:** The silence problem. A rule that licenses nothing is not modest; it is silent. If the norm is too strict, the desk stops covering emerging science entirely, ceding the territory to less scrupulous outlets. The rule must allow for *some* positive findings, even under high uncertainty.
  *   **Cheating:** Setting the threshold for "Run" so high that only replicated consensus science is published, effectively converting a news desk into a textbook publisher.

  **9. The Unprecedented Case Clause**
  *   **Status:** Camp Preference (Inside-View Camp)
  *   **Motivating Case:** The black swan. Some results are genuinely unprecedented (e.g., the first detection of gravitational waves). There is no reference class. An outside-view rule that demands a base rate will force you to spike the most important stories of the decade because they have no distributional history.
  *   **Cheating:** Handling this by permitting "whatever the reporter wants," which collapses the norm entirely. The rule must have a specific fallback procedure for when the reference class is empty.

  ---

  ### Tension Analysis: The Impossible Trinity

  I must inform you that this list contains a triad of requirements that are likely **jointly unsatisfiable** under your stated constraints (one day, no statistician).

  1.  **Contamination Correction** (Requires meta-scientific knowledge of publication bias).
  2.  **Computational Tractability** (Requires a decision in hours with no specialist).
  3.  **Auditability** (Requires explicit, checkable justification).

  **The Conflict:** To correct for contamination (Req 2), you need to know the *true* false-positive rate of the field, not the published one. Estimating that requires statistical expertise or access to unpublished data (violating Tractability). If you simplify it to a heuristic (e.g., "halve the confidence"), you cannot defend why that specific discount was applied to *this* field versus *that* one (violating Auditability). If you make it auditable (e.g., "cite the Ioannidis paper"), you may not have time (violating Tractability).

  **Recommendation:** You will likely have to downgrade **Contamination Correction** from Non-Negotiable to a "Best Effort" preference, or accept that **Auditability** will be limited to checking *whether* a correction was attempted, not *whether it was accurate*.

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding the candidate heuristics people actually reach for is **The Contamination Correction Requirement**.

  Most intuitive heuristics assume the "outside view" data is valid. In science journalism, it is not. The published record is a biased sample. Any heuristic that takes the base rate of "published psychology studies" at face value fails this requirement. This excludes naive anchoring and standard reference-class forecasting immediately, as they treat the available distribution as the true distribution.

  ---

  ### Scorecard of Candidate Heuristics

  | Heuristic | Pre-Spec | Contamination | Specificity | Actionability | Tractability | Auditability | Signal | Unprecedented | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Anchoring & Adjusting** | ❌ | ❌ | ⚠️ | ⚠️ | ✅ | ❌ | ✅ | ⚠️ | **Fail.** Anchor is usually post-hoc; ignores publication bias. |
  | **Reference-Class Forecasting** | ❌ | ❌ | ❌ | ⚠️ | ❌ | ⚠️ | ⚠️ | ❌ | **Fail.** Requires statistical work (Tractability) and suffers from shopping (Pre-Spec). |
  | **Inside-View Gated** | ✅ | ✅ | ✅ | ✅ | ✅ | ⚠️ | ❌ | ✅ | **Fail.** Fails Signal Retention (spikes too much); Auditability relies on "plausibility." |
  | **Precision-Weighted Pooling** | ⚠️ | ⚠️ | ✅ | ❌ | ❌ | ❌ | ✅ | ⚠️ | **Fail.** Impossible under deadline (Tractability); outputs probabilities, not decisions (Actionability). |

  **Key:** ✅ Satisfied | ⚠️ Partially/Conditionally Satisfied | ❌ Failed

  **Summary:** None of the standard heuristics survive the **Contamination Correction** and **Computational Tractability** constraints simultaneously. Your desk policy will need to be a hybrid: a simplified, pre-specified reference class (to satisfy Pre-Spec/Tractability) with a mandatory, fixed discount factor for high-hype fields (to approximate Contamination Correction without requiring new math every time).
