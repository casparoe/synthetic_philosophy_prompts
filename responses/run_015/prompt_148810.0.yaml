answer: |-
  1. The precise question (~150 words)
  Strawson's "Freedom and Resentment" rests on a binary: participant reactive attitudes (interpersonal) vs. the objective attitude (seeing agents as objects to be managed). He claims determinism doesn't force us into the objective stance. But contemporary life is saturated with accountability practices aimed at structures—banks, algorithms, bureaucracies—where no single individual is the target. The literature usually treats this as either misplaced individual anger or purely objective management. This leaves a gap: are these genuine reactive attitudes? If yes, does their existence undermine Strawson's naturalism by showing our practices *are* sensitive to causal determination (since structures feel determined)? Or does it show his binary is too coarse? Current answers stall because they force structural blame into individual boxes. Most compatibilists ignore this because it looks like a problem for collective agency, not free will. That's a mistake. The question is whether accommodating system-directed attitudes forces us to abandon Strawson's compatibilism or if it actually secures it by expanding the scope of participant engagement beyond the interpersonal dyad.

  2. The angle (~150 words)
  Focusing on system-directed attitudes isn't just adding a new category; it's a methodological correction. Standard compatibilism debates get stuck on metaphysical leverage—could the agent have done otherwise? This proposal bypasses that by looking at the phenomenology of blame itself. If we feel indignation toward a bureaucracy, we aren't taking the objective attitude (we aren't just managing them), nor are we targeting a specific soul. By isolating this stance, we test the resilience of Strawson's naturalism. The angle is that the reactive/objective binary is a false dichotomy that hides how responsibility actually functions in complex societies. Recognizing this third space sharpens compatibilism by showing our responsibility practices are robust enough to handle distributed agency without collapsing into fatalism. It moves the debate from metaphysics to social ontology. This avoids the usual stalemate over alternate possibilities.

  3. Month-by-month method (~200 words)
  Months 1-2: Conceptual mapping. I'll delineate "institutional indignation" from standard resentment and the objective attitude. I need to show it has the right phenomenological weight—it's not just frustration, it's moral demand. Months 3-4: Case testing. I'll apply this to hard cases: algorithmic bias, corporate negligence, bureaucratic indifference. The goal is to see if holding the system responsible preserves the participant stance without requiring a metaphysical "group mind." I'll test edge cases where the system is clearly deterministic to see if the attitude persists. Months 5-6: Synthesis and comparison. I'll compare this revised framework against collective responsibility accounts that rely on strong metaphysical unity, like List and Pettit. The work here is to argue that my Strawsonian revision is lighter and more stable because it doesn't need group agents. I'll draft the argument that this expansion protects compatibilism from the "determinism hides in structures" objection. Weekly writing goals to ensure momentum. Mid-point review to check if the distinction holds water against skeptical challenges. I will also consult recent work on structural injustice to ensure I'm not reinventing the wheel, but keeping the focus on the Strawsonian mechanics. I need to make sure the final argument connects back to the core free will debate, not just social theory.

  4. Success vs failure (~100 words)
  Success means proving system-directed attitudes are a distinct third category, not just objective management. If I show these attitudes sustain moral demand without requiring libertarian free will, the proposal succeeds. Failure looks like collapsing back into the binary. If "institutional indignation" turns out to be just frustration (objective) or misplaced individual resentment, the framing fails. I'd have to admit Strawson's original binary was sufficient. Another failure mode is if acknowledging these attitudes actually *helps* the incompatibilist by showing our practices are sensitive to causal structures. I need to avoid that trap.

  5. Scope and delieverable (~100 words)
  Six months is tight but doable for a conceptual paper. The deliverable is a 8,000-word article ready for submission to a journal like Ethics or Philosopher's Imprint. A useful outcome isn't just a paper, but a revised taxonomy for responsibility theorists. It should give compatibilists a tool to handle structural cases without conceding ground to skeptics. I'll also prepare a 2-page summary for non-specialists to show the practical uptake in policy or organizational ethics.
