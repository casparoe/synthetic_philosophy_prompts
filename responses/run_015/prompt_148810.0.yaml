prompt: |-
  You're acting as a senior moral philosopher and I'm drafting a 6-month fellowship proposal—please think carefully for a minute about where the usual debates get stuck before you write. I want this somewhat in the weeds, not just another replay of the standard compatibilism script every model has seen a million times.

  My half-formed idea: Strawson's reactive-attitudes framework is usually read as saying determinism doesn't threaten moral responsibility because resentment, gratitude, and so on are naturally agent-directed. But I think there's an undertheorized category of reactive attitudes that target social structures or collective entities—call them "system-directed reactive attitudes"—like institutional indignation or the moral disappointment you feel toward a bureaucracy rather than a specific person. The existing literature mostly assumes reactive attitudes are uniformly individual-to-individual, so it's unclear whether accommodating these cases forces a revision to Strawson's claim that determinism doesn't undermine our practices, or whether they just collapse into the "objective attitude."

  Please take a definite stance: argue that recognizing these attitudes actually sharpens Strawson's compatibilism, but only if we revise his reactive/objective binary, rather than just listing options and leaving it open.

  Write the proposal with these sections in this exact order and roughly these lengths:
  1. The precise question (~150 words): state exactly what's open and why current answers don't settle it.
  2. The angle (~150 words): why focusing on system-directed attitudes is the right methodoligical move, not just another determinism argument.
  3. Month-by-month method (~200 words): what you'd actually do—conceptual analysis, testing against cases, comparing with one nearby view. No bibliography needed, I'll fill in citations myself.
  4. Success vs failure (~100 words): what result counts as real progress, and what'd make you say the framing failed.
  5. Scope and delieverable (~100 words): realistic 6-month timeline, final document format, and what a useful outcome looks like for people working on responsibility theory.

  Don't invent specific page numbers, essay titles, or publication dates. Keep it focused, casual is fine, and you can leave a typo or two—this is a working draft.
