answer: |-
  You have identified a genuinely thorny problem, one that sits precisely at the junction of archival science, historiography, and social epistemology. To answer your first question directly: there is no single, settled term for this configuration. You are not conflating two things; you are describing a single dynamic with two manifestations (the categorical grid and the methodological crowding-out).

  Terms like 'archival violence' or 'epistemic injustice' are often deployed nearby, but as you note, they tend to locate the harm in the original act of exclusion or the agent of oppression. They describe the wound, not the specific pathology of the suture that hardens into a cage. Michel-Rolph Trouillot's work on silencing comes close, particularly his notion that silences enter the process of historical production at specific moments, but even he focuses largely on the creation of the archive rather than the *recuperative* use of it.

  If I were to offer a heuristic label for the sake of discussion, I might call it **the paradox of legible restitution**. However, as you requested, I shall prioritise carving the phenomenon over naming it.

  ### The Carving: What exactly is this?

  This phenomenon is a second-order epistemic distortion. It is not merely that the source is biased (first-order); it is that the *methodology of recovery* relies upon the bias to function. It possesses three distinct characteristics:

  1.  **Infrastructural Dependence:** The recovery of the subject is made possible only by the infrastructure of their subjugation. In your first example, the petition exists as 'evidence' only because the colonial administration deemed it a 'grievance' worth filing. In the second, the ancestor is findable only because the insurance register deemed them a 'risk' worth numbering. The ontology of the recovered subject is borrowed from the ontology of the oppressor.
  2.  **Naturalisation through Utility:** This is the crucial mechanism. When the archive was silent, the categories were visible as impositions. Once the archive is made to speak via those categories, the categories recede into the background. They become the neutral 'grid' rather than the 'grille'. The success of the retrieval validates the structure of the retrieval. The more useful the database is to descendants, the less questionably its taxonomy appears.
  3.  **Methodological Crowding-Out:** As you noted in the second instance, this is not just about how we read, but what we ask. If a corpus is searchable, it invites queries that are searchable. Questions requiring oral testimony, ecological context, or non-textual evidence become 'expensive' in terms of labour, while questions answerable by the register become 'cheap'. Over time, the research agenda shifts to match the affordances of the remedy.

  ### What it is not

  It is vital to distinguish this from standard historiographical warnings, as the remedies for those warnings often exacerbate the problem you describe.

  **It is not ordinary source bias.**
  Standard source bias assumes a distortion that can be corrected by triangulation or critical reading. We assume we can 'factor out' the administrator's prejudice to find the truth. In your configuration, the prejudice is not a layer of dirt on the lens; it is the glass itself. You cannot factor out the filing headings without losing the petition. The distortion is constitutive, not additive.

  **It is not 'reading against the grain'.**
  The method of reading against the grain (famously associated with Ann Laura Stoler) presupposes a resistance to the archive's logic. It seeks the fissures, the anxieties, the things the administrator *failed* to control. The phenomenon you describe occurs when historians read *with* the grain to find the people hidden within it. To make the subaltern speak, one must often adopt the master's grammar. Reading against the grain subverts the taxonomy; your phenomenon describes what happens when the taxonomy is reinforced by the very act of trying to humanise the data within it.

  **It is not simply 'technological determinism'.**
  This is not merely that the digital tool dictates the method. It is that the digital tool encodes a specific historical power relation (the colonial filing system) and presents it as a neutral technical feature (a dropdown menu or a metadata field). The politics are baked into the metadata schema, but they appear as mere 'fields'.

  ### The Edges: Intentionality and Cost

  You ask whether a remedy that *knowingly* accepts the categories is the same phenomenon, and whether the cost is worth paying.

  **On Intentionality:**
  Structurally, the effect is identical whether the historian is naive or sophisticated. If a researcher explicitly states, 'I am using these colonial categories because they are the only way to locate these individuals,' the grid is still reinforced. The database still functions on those headings; future researchers (who may not read the introduction) will still treat the categories as natural.
  However, ethically, there is a distinction. A knowing acceptance allows for what we might call **metadata of caution**. If the finding aid explicitly flags the violence of the taxonomy, it creates a friction that slows down the naturalisation process. It turns the 'grid' back into a 'grille' that the user must look *through*, rather than *at*. Without this reflexive metadata, the remedy is epistemically dangerous; with it, it becomes a negotiated compromise.

  **On the Cost:**
  Is it worth paying? In social epistemology, we often deal with the tension between purity and access. A purist refusal to use the colonial register leaves the descendants without names. A pragmatic use gives them names but risks re-inscribing the logic that reduced them to risks.
  I would argue the cost is worth paying, *provided* the remedy is understood as provisional. The digitised register should not be treated as the 'archive of the population' but as the 'archive of the administration's view of the population'. The moment the searchable corpus becomes the *definitive* evidence base, the harm outweighs the benefit.
  The remedy is only virtuous if it is treated as a bridge to other forms of knowledge (oral, ecological), rather than a destination. If the name-searchability leads descendants to the register and then stops, it is a trap. If it leads them to the register and then prompts the question, 'What does this number leave out?', it is a tool.

  ### Summary

  You are observing a process where **restitution relies on the infrastructure of exclusion, thereby cementing that infrastructure as the condition of intelligibility.**

  It differs from bias because it is structural rather than contextual; it differs from reading against the grain because it utilises the grain rather than resisting it. It is a specific risk of the digital humanities and archival recovery projects: the danger that in making the silenced legible, we make them legible *only* to the state that silenced them.

  The phenomenon does not demand we abandon the work of recovery. Rather, it demands that our epistemological accounting include the cost of the categories we use to balance the books. We must cite the filing heading not just as a location, but as an argument.
