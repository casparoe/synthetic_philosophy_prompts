      *   **Task:** Migrating to a new shared data layer (event pipeline + query service).
      *   **Problem:** User's load test shows the pipeline fails at 50% of expected peak load (20k vs 40k events/sec). Failure mode suspected in query service compaction.
      *   **Confidence:** 60-65% sure this is real (acknowledges past errors).
      *   **Stakes:** High. Reversal = 2 engineer-months. Failure = Tier-1 service outage during peak.
      *   **Manager's Argument:** Social proof/Survivorship bias. 11 teams adopted (some with "better" engineers). If it were broken, they'd know. Raising concerns looks like reluctance/non-team-player behavior (two prior complainers are stigmatized).
      *   **User's Counter-Observation:** Most of the 11 teams didn't test; they just followed the predecessor.
      *   **Context:** Team 12 is a pivot point (early enough to set precedent, late enough that momentum exists).
      *   **Options:**
          1.  Go along quietly (risk outage).
          2.  Raise concern in RFC (easy to discount).
          3.  Publish evidence/harness (high effort, high credibility risk).
          4.  Adopt but gate cutover on shadow run (colleague's suggestion).
      *   **Questions:** Is the manager's reasoning sound? What do I owe downstream teams? Does evidence change the obligation? Does the shadow run work? Is there a general rule?

  2.  **Deconstruct the Manager's Reasoning:**
      *   *Argument:* "11 teams adopted, including smart engineers. Therefore, it must be safe."
      *   *Flaw:* **Survivorship Bias + Information Cascade.**
      *   *Analysis:* If the first few teams didn't load test to *this* specific profile (bursty, heavy tail), they haven't triggered the failure yet. The "smart engineers" argument assumes they exercised independent due diligence. The user found out they didn't (they deferred to predecessors). This is a classic "Emperor's New Clothes" or information cascade scenario.
      *   *Verdict:* The reasoning is *not* sound. It relies on the assumption of independent verification which the user has evidence is false.

  3.  **Evaluate the "Team 12" Position:**
      *   *Significance:* Being 12th of 40 is critical. It's past the "pilot" phase (first 1-3) but before the "majority" phase.
      *   *Obligation:* High. If Team 12 migrates and succeeds without catching this, Teams 13-40 will assume safety. If Team 12 migrates and fails, it's an outage. If Team 12 flags it *with evidence*, they save the company from 28 future migrations based on false premises.
      *   *Evidence vs. Opinion:* An opinion in an RFC is noise. Evidence (harness, logs, graphs) is signal. Publishing evidence shifts the burden of proof back to the platform team to explain why the test is invalid, rather than the user proving it is valid.

  4.  **Analyze the Shadow Run Proposal:**
      *   *Mechanism:* Adopt on schedule (check the box), but don't route live traffic until a 2-week shadow run at production volume passes.
      *   *Pros:* De-escalates conflict with manager (migration "happens"), protects production (no cutover until safe), validates the load test in the real environment.
      *   *Cons:* "Shadow run at production volume" is tricky. If you shadow, you aren't generating load, you're observing. To test load, you need to *inject* load. If the colleague means "dual write and compare," that doesn't test the 40k/sec burst limit. If they mean "canary with real traffic," that risks the Tier-1 service.
      *   *Correction:* It needs to be a *staged* cutover or a *synthetic load test in prod* (if safe) or a shadow that replays traffic. Actually, the best interpretation is: "Merge the code, but keep the feature flag off / router pointing to old system until we verify stability."
      *   *Verdict:* It resolves the *political* problem and the *safety* problem, provided the "shadow run" actually validates the capacity, not just the logic. It moves the risk from "outage" to "delay."

  5.  **Address the "General Rule":**
      *   *Rule:* "Defer to group on judgments, surface hard evidence on facts."
      *   *Nuance:* This holds up. Opinions are debatable; data is harder to ignore. However, culture matters. In a culture where dissenters are punished (as hinted by the "not team players" comment), evidence must be presented constructively, not accusatorily.
      *   *Refinement:* "Disagree and commit" applies to *decisions*, not *observable physical limits*. If the system physically breaks at 20k RPS, that's a fact, not a judgment.

  6.  **Synthesize the Advice:**
      *   **Manager's Logic:** It's an information cascade, not independent verification. It is flawed.
      *   **Obligation:** As Team 12, you are the canary for the next 28 teams. You owe them truth, specifically *verifiable* truth.
      *   **Evidence:** Publish the harness. It transforms the conversation from "User is difficult" to "Platform has a bug."
      *   **Shadow Run:** It's a good compromise *if* defined correctly. It allows the migration paperwork to proceed (satisfying management) without exposing production to risk (satisfying engineering integrity).
      *   **Career Risk:** The "not team player" stigma is real. Mitigate by framing it as "Helping the Platform Team succeed" rather than "Blocking the migration."

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, analytical, empathetic to the political reality.
      *   *Structure:* Address each specific question raised in the prompt.
      *   *Key Insight:* The manager is suffering from *Availability Heuristic* and *Information Cascade*. The user is holding *Empirical Data*. Data beats heuristic, but delivery matters.
      *   *Specific Tactic:* The "Shadow Run" needs to be clarified. It shouldn't just be shadowing reads; it needs to validate the write throughput. Suggest a "Dark Launch" or "Replay" strategy.
      *   *The "Team Player" Trap:* Reframe the concern. Don't say "This won't work." Say "I want to make sure this works for everyone, here is a test to ensure we don't burn the next 28 teams."

  8.  **Final Review against Constraints:**
      *   Did I answer if the manager's reasoning is sound? Yes (No, it's an information cascade).
      *   Did I address the Team 12 obligation? Yes (High obligation to verify).
      *   Did I address Evidence vs. Opinion? Yes (Evidence changes the dynamic).
      *   Did I address the Shadow Run? Yes (Good, but needs precise definition).
      *   Did I provide a general rule? Yes (Facts vs. Judgments).
      *   Avoided abstract career advice? Yes, focused on the specific arguments.

  9.  **Final Polish:** Ensure the distinction between "load testing in staging" vs "shadowing in prod" is clear. The user's test broke staging. Shadowing in prod might not trigger the compaction issue unless traffic is actually routed or replayed. I need to make sure the user understands that "shadowing" doesn't test capacity unless it involves replaying traffic or a canary. *Self-Correction:* Actually, a shadow run usually means duplicating traffic. If you duplicate 40k/s, you might break it. If you just log it, you don't test the write path. I need to advise on *how* to make the shadow run valid. A better term is "Canary with rollback" or "Staging load test with Platform team present." Let's stick to the user's term "Shadow Run" but clarify the requirements for it to be valid. Actually, the colleague's suggestion is likely "Dual write, old path serves traffic." That doesn't test the new path's limit. I should point out this nuance.

      *Wait, re-reading the prompt:* "gate the actual cutover on a two-week shadow run at production volume."
      If they shadow *at production volume*, that implies sending the traffic to the new system but not using the result? Or replaying prod traffic? If they send prod traffic to the new system, that's a canary, not a shadow. If they replay, that's safe. I need to highlight this distinction. If they mean "send live traffic," that's risky. If they mean "replay," that's safe. I will assume the colleague means "verify stability before relying on it," which is sound, but the *method* matters.

      *Refining the Manager's Error:* It's specifically an **Information Cascade**. The early teams didn't verify; they trusted. The later teams trusted the early teams. The manager assumes independent verification.

      *Refining the "Team Player" aspect:* The user needs to frame this as *enabling* the platform's success, not blocking it. "I want to ensure the Platform team doesn't get blamed for an outage caused by a specific traffic pattern we haven't seen yet."

