answer: |-
  You have not only identified a genuine philosophical problem, you have reconstructed three of the most famous thought experiments in the history of metaphysics. You do not need forgiveness for lacking academic background; your intuition is tracking the technical literature with remarkable precision.

  The short answer is that there is an established name for the "leftover" you are sensing. It is called **haecceity** (pronounced *hek-see-ity*), often modernized as **primitive thisness**.

  However, simply giving you the word would not answer your deeper questions about whether this leftover is real, where it stops, and whether your cases are the same. Below, I will break down the concepts, map your specific scenarios to the established debates, and tell you where the philosophical consensus fractures.

  ### 1. The Core Distinction: Numerical vs. Qualitative Identity

  To understand the "leftover," we must first name the two things you are distinguishing. Philosophers divide identity into two types:

  *   **Qualitative Identity:** Two things are qualitatively identical if they share all the same properties (color, mass, shape, texture). Your iron balls are qualitatively identical.
  *   **Numerical Identity:** This refers to whether two things are actually *one and the same object*. If you have two files, they are numerically distinct (there are two of them) even if they are qualitatively identical.

  Your puzzle is this: If two things are qualitatively identical, what grounds their **numerical distinctness**? What makes File A *File A* and not *File B*?

  ### 2. The Name for the "Leftover": Haecceity

  The term you are looking for is **haecceity**. It comes from the Latin *haecceitas* ("thisness"), coined by the medieval philosopher John Duns Scotus. In contemporary metaphysics, it is often called **primitive thisness**.

  *   **Definition:** Haecceity is a non-qualitative property that makes an individual *that* specific individual. It is the "thisness" of a thing that remains after you have subtracted every describable quality (red, round, heavy, located at x).
  *   **The Haecceitist View:** A philosopher who believes in haecceity (a **haecceitist**) says: "Yes, there is a fact of the matter about which ball is which, even if they are exactly alike. Ball A has the haecceity of A, and Ball B has the haecceity of B."
  *   **The Anti-Haecceitist View:** An opponent (often a **structuralist** or **relationist**) says: "No. Once you have listed all the qualitative facts and relational facts, there is nothing left. To ask 'which is which' is to ask a meaningless question."

  ### 3. Analyzing Your Cases

  You asked which of your cases are the same and which are different. They map onto three distinct debates in metaphysics.

  **Case 1: The Computer Files (Individuation by Location)**
  *   **The Scenario:** Two identical files at different disk addresses.
  *   **The Philosophical Map:** This relies on **spatio-temporal location** as the principle of individuation. In most physical theories, no two objects can occupy the exact same coordinates at the exact same time.
  *   **Is it the same as the balls?** Not exactly. In your file case, the "grid" of the hard drive exists independently of the files. You are assuming space (or the disk structure) is a container that already has distinct "slots."
  *   **The Deeper Problem:** You noticed this pushes the question back: "What makes one address different from another?" If space itself is just a web of relations, two points in empty space might be indistinguishable. If space is a "substance" (a view called **Substantivalism**), then every point in space has its own haecceity. Your file problem reduces to the ball problem if you ask what distinguishes the *locations* themselves.

  **Case 2: The Static Iron Balls (Max Black's Two Spheres)**
  *   **The Scenario:** Two identical balls in an empty universe.
  *   **The Philosophical Map:** This is explicitly **Max Black's Two Spheres** argument (1952). Black used this to attack the **Identity of Indiscernibles**, a principle by Gottfried Wilhelm Leibniz which states that if two things share all properties, they are actually the same thing.
  *   **The Verdict:** Most modern philosophers agree with you and Black: it is logically possible for two things to be qualitatively identical but numerically distinct.
  *   **The Leftover:** In this static case, the "leftover" is simply **numerical diversity**. The fact that there are *two* rather than *one* is the brute fact. Haecceitists say this is because Ball A has "A-ness" and Ball B has "B-ness." Anti-haecceitists say "twoness" is a fact about the *universe*, not a fact about the individual balls.

  **Case 3: The Swapping Balls (Diachronic Haecceitism)**
  *   **The Scenario:** The balls swap places. Did anything happen?
  *   **The Philosophical Map:** This is the strongest test for **haecceitism**.
      *   If you believe **nothing happened**, you are an **anti-haecceitist**. You believe the world is defined by its structure. If the structure at Time 1 is (Ball, Ball) and the structure at Time 2 is (Ball, Ball), the world is identical. The "paths" of the balls don't matter, only the arrangement.
      *   If you believe **something happened** (even if unobservable), you are a **haecceitist**. You believe the history of *this specific individual* matters. Ball A traveling to Spot 2 is a different history than Ball B traveling to Spot 2.
  *   **Your Dilemma:** You mentioned getting two reactions (nothing happened vs. something uncapturable happened). This is exactly the current stalemate in metaphysics. Physics generally side-steps this (quantum mechanics actually suggests the anti-haecceitist view for particles like electrons), but our intuition often sides with the haecceitist.

  **Case 4: The Counting (Cardinality)**
  *   **The Scenario:** Adding a third ball changes only the number.
  *   **The Philosophical Map:** This touches on whether **number** is a real property.
  *   **Is it the same leftover?** Yes. If haecceity exists, counting is just tallying haecceities. If haecceity does *not* exist, counting is measuring the "size" of the structure.
  *   **The Nuance:** In quantum mechanics, indistinguishable particles behave differently regarding counting (Bose-Einstein vs. Fermi-Dirac statistics). This suggests that at the fundamental level, "twoness" might not be composed of "one plus one," but might be a primitive fact about the field.

  ### 4. Where Does It Stop?

  You asked where this concept stops. It stops at the boundary of **brute facts**.

  *   **For the Haecceitist:** It stops at the individual. It is a brute fact that *I* am me and not you. There is no deeper explanation for why I am attached to this specific consciousness or body. It just is.
  *   **For the Anti-Haecceitist:** It stops at the structure. It is a brute fact that the universe has a certain shape or pattern. Asking "which particle is which" is like asking "which dollar bill is which" in a digital bank account. The system tracks the *value* (the structure), not the specific electrons representing the data.

  ### 5. Does the Category Matter?

  You asked if it makes a difference whether the items are objects, places, moments, or people.

  *   **Objects:** This is the standard debate (as above).
  *   **Places:** If you believe space is real (Substantivalism), then points in space have haecceity. If you believe space is just relations between objects (Relationalism), then locations have no identity without objects to mark them. Your file case hinges on this.
  *   **Moments:** This leads to the debate over **Temporal Parts**. Is "You at 5:00 PM" a different object from "You at 5:01 PM"? If yes, they are distinguished by their time-coordinate. If no, you are an "endurantist," and your identity persists through time without needing new haecceity.
  *   **People:** This is the problem of **Personal Identity**. If we cloned you perfectly, would the clone be *you*? Most say no. This suggests humans have a strong intuition of haecceity (a "soul" or "self") that transcends qualitative data.

  ### 6. Summary and Recommendation

  You asked for the nearest established notions and which fits best.

  1.  **The Phenomenon:** The distinction between **Numerical Identity** and **Qualitative Identity**.
  2.  **The "Leftover":** **Haecceity** (or Primitive Thisness).
  3.  **The Debate:** **Haecceitism** (there is a fact of the matter) vs. **Anti-Haecceitism** (the question is empty).
  4.  **The Thought Experiment:** **Max Black's Two Spheres**.

  **Which fits best?**
  Your intuition in the third case (the swapping balls) is the most philosophically significant. The file case is muddied by the hardware structure. The static ball case is a classic counter-example to Leibniz. But the **swapping case** isolates the exact problem of haecceity.

  If you want to read more without wading into academic jargon, look for discussions on **"The Identity of Indiscernibles"** and **"Black's Two Spheres."**

  **A Proposed Definition (if you need one for your walks):**
  Since you asked me to coin a term if nothing fit, I will instead offer you a tightened definition of the existing term, as it fits your description perfectly.

  **Term:** **Haecceitic Residue**
  **Definition:** The putative difference between two numerically distinct entities that persists after all qualitative, relational, and spatio-temporal properties have been accounted for.
  **Borderline Case:** Two electrons in a quantum state. (Physics suggests there is *no* residue here; they are truly indistinguishable in a way iron balls might not be).
  **Outside Case:** Two identical twins. (They are not qualitatively identical; they have different fingerprints, locations, and histories, so no residue is needed to distinguish them).

  **Final Verdict:**
  You are describing **Haecceity**. Your intuition that "something happened" during the swap is the **Haecceitist** position. Your intuition that the question might be empty is the **Anti-Haecceitist** position. Both are defensible, which is why you have received both answers. You have found the boundary where language and logic run up against the brute structure of reality.
