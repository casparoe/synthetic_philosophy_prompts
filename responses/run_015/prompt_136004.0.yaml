  I'm reading Peirce's 1878 essay How to Make Our Ideas Clear and I've got completely stuck on the opening argument. The passage that's driving me mad is this one:

  "A clear idea is defined as one which is so apprehended that it will be recognized wherever it is met with, and so that no other will be mistaken for it. If it fails of this clearness, it is said to be obscure.
  This is rather a neat bit of philosophical terminology; yet, since it is clearness that they were defining, I wish the logicians had made their definition a little more plain. Never to fail to recognize an idea, and under no circumstances to mistake another for it, let it come in how recondite a form it may, would indeed imply such prodigious force and clearness of intellect as is seldom met with in this world. On the other hand, merely to have such an acquaintance with the idea as to have become familiar with it, and to have lost all hesitancy in recognizing it in ordinary cases, hardly seems to deserve the name of clearness of apprehension, since after all it only amounts to a subjective feeling of mastery which may be entirely mistaken. I take it, however, that when the logicians speak of "clearness," they mean nothing more than such a familiarity with an idea, since they regard the quality as but a small merit, which needs to be supplemented by another, which they call distinctness.
  A distinct idea is defined as one which contains nothing which is not clear. This is technical language; by the contents of an idea logicians understand whatever is contained in its definition. So that an idea is distinctly apprehended, according to them, when we can give a precise definition of it, in abstract terms. Here the professional logicians leave the subject; and I would not have troubled the reader with what they have to say, if it were not such a striking example of how they have been slumbering through ages of intellectual activity, listlessly disregarding the enginery of modern thought, and never dreaming of applying its lessons to the improvement of logic. It is easy to show that the doctrine that familiar use and abstract distinctness make the perfection of apprehension has its only true place in philosophies which have long been extinct; and it is now time to formulate the method of attaining to a more perfect clearness of thought, such as we see and admire in the thinkers of our own time.
  When Descartes set about the reconstruction of philosophy, his first step was to (theoretically) permit scepticism and to discard the practice of the schoolmen of looking to authority as the ultimate source of truth. That done, he sought a more natural fountain of true principles, and thought he found it in the human mind; thus passing, in the directest way, from the method of authority to that of apriority, as described in my first paper. Self-consciousness was to furnish us with our fundamental truths, and to decide what was agreeable to reason. But since, evidently, not all ideas are true, he was led to note, as the first condition of infallibility, that they must be clear. The distinction between an idea seeming clear and really being so, never occurred to him. Trusting to introspection, as he did, even for a knowledge of external things, why should he question its testimony in respect to the contents of our own minds? But then, I suppose, seeing men, who seemed to be quite clear and positive, holding opposite opinions upon fundamental principles, he was further led to say that clearness of ideas is not sufficient, but that they need also to be distinct, i.e., to have nothing unclear about them. What he probably meant by this (for he did not explain himself with precision) was, that they must sustain the test of dialectical examination; that they must not only seem clear at the outset, but that discussion must never be able to bring to light points of obscurity connected with them.
  Such was the distinction of Descartes, and one sees that it was precisely on the level of his philosophy. It was somewhat developed by Leibnitz. This great and singular genius was as remarkable for what he failed to see as for what he saw. That a piece of mechanism could not do work perpetually without being fed with power in some form, was a thing perfectly apparent to him; yet he did not understand that the machinery of the mind can only transform knowledge, but never originate it, unless it be fed with facts of observation. He thus missed the most essential point of the Cartesian philosophy, which is, that to accept propositions which seem perfectly evident to us is a thing which, whether it be logical or illogical, we cannot help doing. Instead of regarding the matter in this way, he sought to reduce the first principles of science to two classes, those which cannot be denied without self-contradiction, and those which result from the principle of sufficient reason (of which more anon), and was apparently unaware of the great difference between his position and that of Descartes. So he reverted to the old trivialities of logic; and, above all, abstract definitions played a great part in his philosophy. It was quite natural, therefore, that on observing that the method of Descartes labored under the difficulty that we may seem to ourselves to have clear apprehensions of ideas which in truth are very hazy, no better remedy occurred to him than to require an abstract definition of every important term. Accordingly, in adopting the distinction of clear and distinct notions, he described the latter quality as the clear apprehension of everything contained in the definition; and the books have ever since copied his words. There is no danger that his chimerical scheme will ever again be over-valued. Nothing new can ever be learned by analyzing definitions."

  I definately keep misreading it and don't realise where I'm going wrong, so I'd really love some help getting straight. Here's the mess in my head. I'm trying to use this bit to get a handle on the pragmatist theory of truth, especially the contrast between Peirce and James. My (probably ropey) way in is what I've started calling the "Thirdness Filter": the idea that Descartes and Leibniz are stuck because they treat inquiry as a solitary mind checking its own ideas against abstract definitions, so they never reach the properly general, law-governed, community-wide would-be that Peirce later ties to Thirdness. On that reading, the line about nothing new being learned by analyzing definitions is the hinge: it clears the ground for the pragmatic maxim, where the third grade of clearness is a matter of the conceivable practical effects an object would have, and eventually for Peirce's account of truth as the opinion that would be finally agreed to by the community of investigators. James, by contrast, runs with the practical cash-value side and makes truth more a matter of what is expedient in the way of belief for an individual, which is why Peirce later coined pragmaticism to distance himself.

  But I'm hazy on three things. First, in the passage itself: is Peirce saying Descartes and Leibniz make the same mistake, or does Leibniz make a further, seperate mistake? I can't tell whether the bit about the mind being fed with facts of observation is Peirce siding with Descartes against Leibniz, or whether he's saying Leibniz missed Descartes's real point about the unavoidability of accepting propositions that seem perfectly evident. Second, is my "Thirdness Filter" actually helpful, or does it distort things by reading Peirce's later categories back into an 1878 text? Does his objection to abstract definitions really turn on Firstness, Secondness and Thirdness, or is that an anachronism? Third, given that the passage already mocks a merely subjective feeling of mastery as not real clearness, am I right to hear in it an early dig at the kind of view James ended up with, or is that just anachronistic projection on my part?

  Can you walk me through what Peirce is actually doing in the passage, and then tell me where my Thirdness Filter reading is helpful and where it goes wrong? I'm not after citations or a reading list, just an explanation I can follow, and please keep in mind I'm no expert.
