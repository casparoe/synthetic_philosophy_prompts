answer: |-
  # Simulation Design: The Ledger of Unseen Intentions

  **Context:** Upper-level philosophy seminar (14 students, 80 minutes).
  **Objective:** To viscerally demonstrate the epistemic gap between observable action and hidden intention, and the resulting corruption of moral desert when administered institutionally.

  ---

  ## 1. Setup and Roles

  **Materials Needed:**
  *   **Whiteboard:** Drawn as "The Ledger" with columns: *Agent Name | Public Act | Assigned Score (-10 to +10) | True Score | Error Margin*.
  *   **Deck A (Public Acts):** 10 cards describing observable behaviors.
  *   **Deck B (Secret Mental States):** 10 cards describing internal volition. Each card has a hidden **True Desert Value** printed on the back (an integer between -10 and +10).
  *   **Deck C (Proxy Questions):** 5 cards with "diagnostic questions" and printed reliability rates (e.g., "60% Accuracy").
  *   **Tokens:** 30 poker chips or paper slips ("Merit Tokens").
  *   **Timer:** Visible to all.

  **Roles (14 Students):**
  *   **Agents (10 students):** Receive one Public Act card and one Secret Mental State card.
  *   **Administrators (4 students):** Responsible for assigning scores to all 10 Agents based on available evidence. They manage the Ledger.
  *   **Facilitator (Instructor):** Manages time, distributes cards, and enforces the reveal protocol.

  **Card Construction (Examples):**
  *   *Public Act Card:* "Returned a lost wallet with cash intact."
  *   *Secret Mental State Card:* "Motivated by fear of surveillance cameras." -> **True Score: -2** (Technically moral action, but volitionally corrupt).
  *   *Secret Mental State Card:* "Motivated by genuine empathy for the loser." -> **True Score: +10** (Perfect alignment).
  *   *Public Act Card:* "Refused to lend money to a friend."
  *   *Secret Mental State Card:* "Knew the friend would spend it on harmful addiction." -> **True Score: +8** (Hard choice, good intent).
  *   *Secret Mental State Card:* "Wanted to hoard wealth." -> **True Score: -8** (Selfish intent).

  *Note: The True Score is determined 80% by the Mental State and 20% by the Act's consequence. The numbers are pre-printed on the Mental State cards to prevent debate.*

  ---

  ## 2. Rules for Two Rounds

  **Total Simulation Time:** 30 Minutes (15 per Round).

  ### Round 1: The Blind Ledger (Outcome Bias)
  1.  **Distribution:** 10 Agents draw one Public Act and one Secret Mental State. 4 Administrators sit at the front.
  2.  **Testimony:** Agents stand one by one. They read *only* their Public Act card. They must remain poker-faced. They cannot elaborate.
  3.  **Judgment:** Administrators confer briefly (max 30 seconds per Agent) and assign an **Assigned Score** (-10 to +10) based *only* on the act.
  4.  **Recording:** Administrators write the Assigned Score on the Ledger.
  5.  **Reveal:** The Agent then reveals their Secret Mental State and the **True Score**. The Facilitator calculates the *Error Margin* (absolute difference between Assigned and True) and records it.
  6.  **Token Allocation:**
      *   If Error Margin is 0-2: Administrators gain 1 Merit Token.
      *   If Error Margin is 3-5: No tokens.
      *   If Error Margin is 6+: Agents gain 1 Merit Token (as compensation for "injustice").

  ### Round 2: The Proxy Ledger (Noisy Evidence)
  1.  **Role Swap:** 4 new Administrators are selected from the previous Agents. (Now 10 new Agents, 4 new Admins).
  2.  **New Evidence:** Agents read their Public Act as before.
  3.  **Proxy Inquiry:** For each Agent, the Administrators draw one card from **Deck C (Proxy Questions)**. They ask the Agent this question.
      *   *Example Proxy Card:* "Did you feel a physical sensation of warmth when acting?" (Printed Note: *Correlates with Compassion 65% of the time. 35% of psychopaths can fake this.*)
      *   *Example Proxy Card:* "Did you hesitate before acting?" (Printed Note: *Correlates with Moral Conflict 70% of the time. 30% of virtuous agents act instinctively.*)
  4.  **Answering:** Agents must answer "Yes" or "No" truthfully according to their Secret Mental State (unless the Proxy Card notes that faking is possible, in which case they may choose).
  5.  **Judgment:** Administrators assign a new **Assigned Score** using the Act + Proxy Answer.
  6.  **Reveal & Token Allocation:** Same as Round 1.

  ---

  ## 3. Payoff Scheme: Merit and Reputation

  **The Stakes:**
  Tokens are not individual currency. They accumulate in a central "Class Merit Pool."

  **Incentives:**
  *   **Administrators:** Want to minimize Error Margin to add tokens to the pool. This simulates the institutional desire for "accurate justice."
  *   **Agents:** Want their Assigned Score to match their True Score. If they are "misjudged" (High Error Margin), they receive tokens, but this represents *compensation for injustice*, not merit. The goal is to be *recognized*, not compensated.

  **Collective Reward:**
  At the end of the simulation, count the Class Merit Pool.
  *   **High Accuracy (20+ Tokens):** The class has "solved" the epistemic problem. They earn the right to choose **Option A** for the closing discussion: *"Is karma compatible with modern neuroscience?"* (A more speculative, open-ended question).
  *   **Low Accuracy (<20 Tokens):** The class has "failed" to administer justice. They must discuss **Option B**: *"If we cannot know intention, should we abandon moral desert entirely?"* (A harder, more pessimistic question).

  *Why this works:* It makes the epistemic failure a collective burden. If the Administrators guess poorly, the whole class suffers a "harder" philosophical conclusion.

  ---

  ## 4. Debrief and Facilitator Guide

  **Time:** 35 Minutes.

  **Phase 1: Mapping Round 1 (Outcome Corruption)**
  *   **Observation:** Point out cases where a "Good Act" received a high score despite a "Bad Intent" (e.g., returning the wallet for fear of cameras).
  *   **Philosophical Link:** This demonstrates **Outcome Bias**. When institutions (courts, HR departments, social media) judge desert, they default to observable utility because it is cheap and easy to measure.
  *   **Key Question:** "Administrators, did you feel punished for giving a low score to a 'good deed'? Agents with bad intentions, did you feel safe hiding behind a good act?"

  **Phase 2: Mapping Round 2 (The Proxy Problem)**
  *   **Observation:** Highlight the Error Margins. Did they improve? Likely not.
  *   **Philosophical Link:** This demonstrates **Epistemic Opacity**. Proxies (body language, self-reporting, physiological responses) are noisy. They correlate with virtue but do not *constitute* virtue.
  *   **Predicted Failure:** Agents will realize the Proxy Question is the key to the Token reward. They will begin to answer based on what yields the correct score, not their actual mental state (Gaming the System).
  *   **Facilitator Correction:** If Agents admit to gaming, do not stop them. Highlight it. "This is the corruption of the standard. When we measure virtue by 'calmness,' people learn to act calm, not to *be* calm. The proxy destroys the virtue it seeks to measure."

  **Phase 3: The Gap (Karmic Opacity)**
  *   **Discussion:** Why was the Error Margin inevitable?
  *   **Concept:** **Private Access.** Only the agent has first-person access to *cetana* (volition). Any third-party access is inference. Therefore, *institutional* karma is impossible. Human justice can only ever be a rough approximation of karmic justice.

  **Real-Time Facilitation Notes:**
  *   **If Admins struggle:** Remind them they *must* assign a number. Forced judgment highlights the violence of imposing precision on ambiguity.
  *   **If Agents get bored:** Remind them their token reward depends on being *understood*, not just passing. Ask them, "Does it feel fair that you were scored -5 when your intent was +8?"
  *   **If the game stalls:** Accelerate the reveals. The emotional impact comes from the rapid succession of "I thought you were good, but you were bad" moments.

  ---

  ## 5. Limitation Note and Closing Framing

  **The Missing Feature:**
  This simulation cannot reproduce the **non-institutional, transpersonal causal mechanism** of classical karma.
  *   *In the Sim:* Karma is a court judgment administered by fallible peers (Administrators).
  *   *In Theory:* Karma is a law of nature (like gravity) administered by no one. It does not require a judge to "see" the intent; the intent *causes* the result directly across lifetimes.

  **Facilitator Closing Script (Required):**
  "We have just felt the frustration of human justice. You felt the Administrators were too harsh, or the Proxies were unfair. But classical karma theory does not posit Administrators. It posits a universe where the Mental State *is* the seed that grows the future.

  In this room, we needed Administrators because we cannot see each other's minds. In the theory, the 'Ledger' is automatic. The tension we felt today—the gap between what we did and what we meant—is exactly why the theory requires rebirth. One lifetime is too short to resolve the discrepancies we saw on this whiteboard. The 'Unseen Intentions' are not unseen by the universe; they are only unseen by *us*.

  Take this feeling of injustice—the times you were misjudged, the times you struggled to judge—and carry it into the closing discussion. If human institutions cannot solve this, does the theory require a metaphysical solution, or should we abandon desert entirely?"

  ---

  **Facilitator Checklist for Preparation:**
  1.  [ ] Create 10 pairs of Act/Mental State cards with pre-calculated True Scores.
  2.  [ ] Create 5 Proxy Question cards with printed "Accuracy Rates."
  3.  [ ] Draw the Ledger on the whiteboard.
  4.  [ ] Prepare 30 Merit Tokens.
  5.  [ ] Write the two Closing Discussion Options on the board before class starts.
