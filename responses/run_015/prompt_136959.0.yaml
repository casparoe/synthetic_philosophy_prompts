      *   *Refined Plan:* 4 Teams.
      *   Phase 1: Teams 1 & 3 build. Teams 2 & 4 wait (or prep rules?). No, everyone builds.
      *   Phase 2: Swap. Team 1 reads Team 2's. Team 2 reads Team 1's.
      *   This works. Everyone builds, everyone reads.

      *   *Wait, the "Absent" constraint:* "Each team's panel must be read by someone who... was not in the room when it was drawn."
      *   *Strict interpretation:* This implies an outsider. But I only have 20 participants.
      *   *Workaround:* The "Reader" must turn their back during the "Build" phase? No, too much logistics.
      *   *Workaround 2:* The "Reader" is given the chart *after* the makers have hidden the source data. The "Absent" quality is about the *Data*, not the physical presence. The prompt says "not in the room when it was drawn."
      *   *Strict Constraint Check:* "read by someone who... was not in the room when it was drawn."
