          *   *Best Compromise:* The "Absent Reader" constraint is about *information asymmetry*, not physical absence. I will advise the user that physical absence is logistically deadly for 90 mins. I will design for *Informational Absence* (Reader does not have Source Data). I will note this in the "Limitations" section.
