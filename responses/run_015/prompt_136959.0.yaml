      *   *Solution:* Split the room. 10 Makers, 10 Readers.
      *   *Issue:* Makers don't get to experience the reading failure.
      *   *Solution:* Two Rounds.
          *   Round 1 (30 mins): Half room draws, Half room reads (they were outside? No, can't kick them out).
