answer: |-
  Your "Archipelago argument" is not garbled; it is a precise application of the Law of Large Numbers to decision theory. It shifts the justification for Expected Utility (EU) from logical consistency (Coherence) to instrumental efficacy over time. However, in your specific context—a fund with a ruin threshold—the two arguments diverge significantly.

  **1. Reach and Axioms**
  The Coherence argument is structural. It demonstrates that if you violate probability axioms or transitivity, you are vulnerable to exploitation regardless of your goals. It struggles with the Independence axiom (Allais patterns) unless supplemented with dynamic assumptions about how compound lotteries resolve. It proves you need *a* utility representation, but not necessarily one linear in probabilities.

  The Archipelago argument is aggregative. It reaches further on Independence but presupposes more. By assuming your total good is the *sum* of local goods, it effectively builds linearity (and thus Independence) into the definition of value. It does not derive the utility function; it assumes an additive currency. If you reject Independence because you care about the *distribution* of outcomes (e.g., variance), the Archipelago argument simply stipulates that away by defining "good" as expectation. Coherence is more foundational; Archipelago is more consequentialist but relies on a substantive assumption about additivity.

  **2. Independence from EU**
  The Archipelago argument is essentially EU applied to the grand lottery of the sequence, plus an assumption of additivity. If global utility is the sum of local utilities, and choices are independent, maximizing global EU implies maximizing local EU. The "residue" is the concentration bound: it converts a claim about *expectation* (which might be risky in the short run) into a claim about *probability* (near-certainty in the long run). This is rhetorically powerful for a trustee: "If you deviate, you will almost certainly lose, not just on average." However, it remains a bootstrapping operation. It assumes the agent *should* care about the sum. Coherence similarly presupposes a continuing agent, but it demands consistency of preferences rather than consistency of outcomes.

  **3. The Floor**
  This is the critical failure point for the Archipelago argument. Your floor introduces a non-linear constraint: the value of the fund is not the sum of its parts, because crossing the threshold zeroes out future value. This creates path dependence; the outcome of decision $n$ depends on the capital remaining from decisions $1$ to $n-1$. The trials are not probabilistically independent with respect to your *utility*, even if the market returns are independent.

  The Archipelago argument falls silent here. You cannot define a "local good" that sums to total utility because the marginal utility of capital explodes near the floor. A small loss early on might be negligible, but the same loss near the threshold is catastrophic. The concentration bound fails because the sum is no longer a simple random walk; it is a walk with an absorbing barrier.

  The Coherence argument survives but changes shape. It does not convict the floor of irrationality. It simply says: "Define your utility function to reflect the floor (e.g., a steep drop-off), and then maximize expected utility consistently." It accommodates risk aversion regarding ruin, whereas the standard Archipelago formulation (maximizing sum of local expectations) would encourage excessive risk-taking that ignores the cliff.

  **4. Currency of Comparison**
  The Archipelago presupposition is more demanding. It requires that value be additive across time and states. This begs the question against an agent whose departure from EU stems from a genuine concern with the shape of prospects (e.g., a preference for security over mean return). Coherence requires only a numeraire for the money pump (usually money), but allows the utility of that money to be any shape. For you, the "currency" is not money, but the probability of the fund surviving 25 years. Archipelago assumes money sums to value; Coherence allows you to define value as survival.

  **5. Practical Upshot**
  The arguments diverge on your standing instructions.

  If you follow the **Archipelago argument** literally (maximize expected local good on every decision), you will instruct your successor to treat each choice in isolation. This is dangerous. Near the floor, a positive-expected-value bet might increase the risk of ruin unacceptably. The "small drift" logic fails when the steps are coupled by a survival constraint.

  If you follow the **Coherence argument**, you instruct your successor to maintain a consistent utility function that incorporates the floor. This leads to a different strategy: maximize the expected utility of the *terminal* fund value, not the sum of intermediate gains. This often looks like "caution" in bad months, not because of inconsistency, but because the marginal utility of capital is higher when the fund is low.

  **Recommendation:** Do not tell your successor to "maximize expected utility on each decision." That is the Archipelago trap. Instead, write the instruction in terms of the global objective: "Maximize the probability that the fund remains above [Threshold] for 25 years, subject to providing [Income Level]." This acknowledges that separability fails. Small-stakes caution is permitted—and required—when the fund approaches the floor, not as a violation of EU, but as the correct application of EU to a non-linear utility function. The Coherence argument supports this; the Archipelago argument, as you sketched it, does not.
