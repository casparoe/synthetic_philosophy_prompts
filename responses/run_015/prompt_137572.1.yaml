          2.  **The Constitutive Fact Argument (Strong/Internal):** Some aesthetic properties supervene on non-aesthetic properties. If I know the non-aesthetic facts (structure, history), I know the aesthetic value.
          3.  **The Education/Calibration Argument (Moderate/Internal):** If my taste was built by testimony, denying testimony now is self-undermining.
