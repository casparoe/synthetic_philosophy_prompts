answer: |-
  **To:** University Outcomes Committee & Provost's Office
  **From:** Committee Chair
  **Subject:** Protocol for Indicator Adoption (v1.0)
  **Timeline:** 2 Weeks to Sign-off

  ### Context
  The Provost's office acknowledges Goodhart's Law ("when a measure becomes a target, it ceases to be a good measure") but treats it as a warning label rather than a design constraint. This protocol treats it as an engineering specification. We are adopting the four-way taxonomy of Goodhart effects (Garrabrant/Manheim) to distinguish between statistical noise, distributional shifts, causal errors, and adversarial gaming.

  This checklist is ordered. Failure at Step 1 kills the indicator immediately. Passing Step 5 does not guarantee adoption; it only guarantees technical viability.

  ---

  ### The Indicator Adoption Checklist

  #### 1. Causal Mechanism Test (Causal Goodhart)
  *   **Type:** `[TECHNICAL]`
  *   **The Question:** Does changing this metric *cause* the outcome we care about, or is it merely correlated/confounded?
  *   **Fail Condition:** The metric is a lagging indicator (outcome causes metric) or both are caused by a third variable (e.g., funding) without a direct link.
  *   **Inconclusive Trigger:** If the causal link relies on a chain of >3 assumed dependencies, flag for `[JUDGEMENT]` at Step 5.
  *   **Consensus Status:** **Settled.** Measurement literature agrees that intervening on a proxy without a causal link to the goal yields null results on the goal.
  *   **Failure Mode Caught:** *Causal Goodhart.* (Optimizing the proxy does not move the true objective).

  #### 2. Tail Robustness Test (Extremal Goodhart)
  *   **Type:** `[TECHNICAL]`
  *   **The Question:** Does the correlation between the metric and the outcome hold at the 95th percentile of performance?
  *   **Fail Condition:** The metric saturates (ceiling effect) or inverts (high scores correlate with *lower* quality) at high performance levels.
  *   **Inconclusive Trigger:** If historical data does not extend to the "excellence" threshold we aim for, flag for `[JUDGEMENT]` at Step 5.
  *   **Consensus Status:** **Settled.** Distributions in social systems rarely remain linear at extremes.
  *   **Failure Mode Caught:** *Extremal Goodhart.* (The relationship breaks down when we actually succeed).

  #### 3. Optimization Decay Test (Regressional Goodhart)
  *   **Type:** `[TECHNICAL]`
  *   **The Question:** As we push the metric up by one standard deviation, does the signal-to-noise ratio degrade?
  *   **Fail Condition:** Marginal effort to increase the metric yields diminishing returns on the true outcome (e.g., spending 10x more to move the score 1%).
  *   **Inconclusive Trigger:** If no longitudinal data exists to model diminishing returns, flag for `[JUDGEMENT]` at Step 5.
  *   **Consensus Status:** **Contested.** While regression to the mean is settled, the *rate* of decay in specific academic contexts is empirically disputed.
  *   **Failure Mode Caught:** *Regressional Goodhart.* (The proxy becomes less informative as you select for higher values).

  #### 4. Gaming Surface Test (Adversarial Goodhart)
  *   **Type:** `[TECHNICAL / SOCIOLOGICAL]`
  *   **The Question:** Can a rational actor improve this metric in <6 months without improving the underlying quality?
  *   **Fail Condition:** A known workaround exists (e.g., citation circles, grade inflation) that is cheaper than doing the actual work.
  *   **Inconclusive Trigger:** If the "cost to game" is subjective (e.g., "reputational risk"), flag for `[JUDGEMENT]` at Step 5.
  *   **Consensus Status:** **Settled.** Agents optimize incentives. The *extent* of gaming in specific contexts is contested.
  *   **Failure Mode Caught:** *Adversarial Goodhart.* (People hack the number on purpose).

  #### 5. Normative & Burden Fit (Value Judgement)
  *   **Type:** `[JUDGEMENT]`
  *   **The Question:** Even if valid, do we want a department that optimizes for this? Is the data collection cost worth the insight?
  *   **Fail Condition:** The metric incentivizes behavior that violates our mission (e.g., competition over collaboration) or costs >5% of operational budget to track.
  *   **Inconclusive Trigger:** **Always.** This test has no technical answer. It requires a vote.
  *   **Consensus Status:** **Contested.** This is purely political and cultural. Measurement literature cannot dictate values.
  *   **Failure Mode Caught:** *Value Misalignment.* (We get what we measured, but we hate what we became).

  ---

  ### Application to Candidate Indicators

  #### Candidate 1: Publications Weighted by Journal Prestige
  *   **Step 1 (Causal):** **FAIL.** Publishing in a high-prestige journal does not cause societal impact or knowledge advancement; it correlates with resources and topic popularity. (Causal Goodhart).
  *   **Step 2 (Tail):** **FAIL.** Top journals often reject novel/risky work in favor of incremental safe work (Extremal Goodhart).
  *   **Step 3 (Decay):** **WARN.** Diminishing returns on prestige chasing are high.
  *   **Step 4 (Gaming):** **FAIL.** Citation rings, salami-slicing, and special issue manipulation are well-documented and low-cost. (Adversarial Goodhart).
  *   **Step 5 (Normative):** N/A (Failed earlier).
  *   **Verdict:** **REJECT.**
  *   **Consensus Note:** It is **settled** in scientometrics that journal prestige is a poor proxy for individual article quality, though administration often treats it as settled fact.

  #### Candidate 2: Mean Student Evaluation Scores (SETs)
  *   **Step 1 (Causal):** **FAIL.** High satisfaction scores correlate with grade inflation and reduced rigor, not learning outcomes. (Causal Goodhart).
  *   **Step 2 (Tail):** **FAIL.** Severe ceiling effect; top performers cluster at 5.0, making differentiation impossible. (Extremal Goodhart).
  *   **Step 3 (Decay):** **FAIL.** Effort to raise scores often involves lowering standards.
  *   **Step 4 (Gaming):** **FAIL.** Explicit quid-pro-quo (grades for scores) is easy and common. (Adversarial Goodhart).
  *   **Step 5 (Normative):** N/A.
  *   **Verdict:** **REJECT.**
  *   **Consensus Note:** It is **settled** that SETs contain demographic bias (against women/minorities). Using them for personnel decisions is contested legally but common administratively.

  #### Candidate 3: Peer Classroom-Observation Scheme
  *   **Step 1 (Causal):** **PASS.** Direct observation of teaching is causally linked to teaching quality (it *is* the quality, not a proxy).
  *   **Step 2 (Tail):** **PASS.** Nuanced rubrics can distinguish between "good" and "exceptional" without ceiling effects.
  *   **Step 3 (Decay):** **PASS.** Signal remains strong even at high performance levels.
  *   **Step 4 (Gaming):** **PASS (Conditional).** Harder to game if observations are unannounced and observers are rotated. Cost to game is high (requires performance, not just admin work).
  *   **Step 5 (Normative):** **PASS (Technically) / FAIL (Culturally).**
      *   *Technical Verdict:* **ADOPT.** It passes the four technical Goodhart tests.
      *   *Chair's Note:* I do not like this answer.
  *   **Verdict:** **CONDITIONAL ADOPT.**

  ---

  ### The "Unliked Pass" & Limitations

  **Why I dislike Candidate 3 (Peer Observation):**
  While Peer Observation is the only candidate that survives the technical Goodhart gauntlet, it transforms colleagues into auditors. For a humanist department, this risks eroding the trust required for genuine intellectual collaboration. It passes the *procedure*, but it may fail the *university*. This highlights that a metric can be **valid** (technically sound) but **toxic** (culturally destructive).

  **What This Procedure Cannot Settle:**
  1.  **The Definition of "Quality":** The procedure tests if a metric measures *a* goal, not if it is the *right* goal. (Contested).
  2.  **Resource Trade-offs:** Peer observation is valid but expensive. The procedure flags the cost at Step 5, but cannot decide if the cost is worth it. (Judgement).
  3.  **The "Good Enough" Threshold:** There is no consensus on how much gaming risk is acceptable. (Contested).

  **Consensus vs. Contested Summary:**
  *   **Settled:** All metrics distort (Goodhart's Law). SETs are biased. Journal prestige is a noisy proxy.
  *   **Contested:** Whether qualitative observation can be standardized without losing validity. Whether the cost of preventing gaming outweighs the benefit of the data. Whether "outcomes" in higher education are measurable at all.

  **Recommendation to Provost:**
  Adopt Candidate 3 only if we budget for the cultural mitigation (training observers, limiting frequency). Do not adopt Candidates 1 or 2; the technical failure modes are documented and indefensible. If you require a number for research, use *citation count normalized by field* (not prestige), but acknowledge it fails Step 1 (Causal) and treat it as descriptive, not evaluative.

  **Next Step:** Committee vote on Step 5 for Candidate 3. If we cannot accept the cultural cost, we have no valid teaching metric, and must report "No Metric" to the Board rather than a bad one.
