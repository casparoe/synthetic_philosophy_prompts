answer: |-
  This is a profound question that cuts to the core of historiography and the philosophy of history. You are asking about the **direction of fit** between narrative and reality.

  The difference between "historical kernel wrapped in legend" and "legend that grabbed real debris" is not just a matter of *how much* evidence we have, but **what kind of causal relationship we posit between the event and the text.**

  Here is the breakdown of the epistemic hinge, the criteria that flip the framing, and how it applies to your examples.

  ### 1. The Epistemic Hinge: Causal Priority
  The fundamental conceptual issue is **Causal Priority**.

  *   **The "Kernel" Frame (Euhemerism):** Assumes the **Event caused the Story.**
      *   *Epistemic Logic:* Something happened $\rightarrow$ It was remembered $\rightarrow$ It was embellished over time.
      *   *Role of Archaeology:* To verify the *existence* of the event that generated the narrative.
      *   *Implicit Claim:* The narrative is a degraded photograph of reality. If you clean off the dust (the myth), you see the subject (the history).

  *   **The "Debris" Frame (Cultural Memory):** Assumes the **Story caused the Interpretation of the Event.**
      *   *Epistemic Logic:* A social/ideological need arose $\rightarrow$ The culture looked for past traces to justify it $\rightarrow$ They appropriated real ruins/traces to anchor the story.
      *   *Role of Archaeology:* To explain *why* the story latched onto this specific location or time (e.g., "There were visible ruins here, so they built a myth about them").
      *   *Implicit Claim:* The narrative is a painting that used some real dust for pigment. The dust is real, but the image is not a representation of the dust's origin.

  **The Hinge:** The flip occurs when you determine whether the text is **generative** (born from the event) or **appropriative** (born from a need, using the event as material).

  ### 2. The Criteria That Flip the Framing
  It is rarely a binary switch, but there are three specific criteria that move the needle from "Debris" to "Kernel."

  #### A. Systemic Correspondence vs. Scenic Correspondence
  *   **Debris (Scenic):** The text matches the *physical setting* but not the *political reality*.
      *   *Example:* The *Iliad* describes a city with walls that matches Hisarlik's geography. But it describes a political landscape (Greek coalition vs. Trojan empire) that doesn't match the Late Bronze Age Hittite records (which show fragmented city-states, no pan-Hellenic force).
      *   *Verdict:* If the text only gets the scenery right (ruins, geography) but gets the politics wrong, it's likely **Legend with Debris**. The poet saw the ruins and imagined a war.
  *   **Kernel (Systemic):** The text matches the *structural relationships* independent of the scenery.
      *   *Example:* If Hittite tablets mentioned a specific king of "Wilusa" (Troy) named "Priamos" or "Alexandros" (Paris) in a conflict with "Ahhiyawa" (Achaeans) at the exact moment of the destruction layer.
      *   *Verdict:* If the *names and political alliances* match independent records, it flips toward **Kernel**. Scenery can be guessed; specific diplomatic networks cannot.

  #### B. The Cost of Invention
  *   **Debris:** The details are generic archetypes.
      *   If the story relies on universal tropes (the great flood, the hidden king, the magical sword), the "cost of invention" is low. Any culture could invent this and paste it onto a real site.
      *   *Arthur:* The "Battle of Badon" is vague. The "Sword in the Stone" is mythic. The cost to invent this is low.
  *   **Kernel:** The details are specific, inconvenient, or non-mythic.
      *   If the text includes boring logistical details, specific genealogies that don't serve a theological purpose, or names that have no etymological meaning in the later language, the "cost of invention" is high. Why invent a specific, obscure name unless it was remembered?
      *   *Troy:* The Catalogue of Ships in the *Iliad* lists cities that were largely abandoned by Homer's time (8th C. BCE) but were active in the Bronze Age. Why invent a list of dead cities? This suggests a **Kernel**.

  #### C. Contemporaneity of the Record
  *   **Debris:** The text is written centuries after the fact, with no intermediate chain.
      *   *Exodus:* The biblical text is written nearly a millennium after the supposed event. There are no Egyptian records of a mass slave exodus (which would have been a massive economic/security crisis). The "debris" here is the presence of Semitic peoples in Egypt (which happened), but the *narrative* is likely a foundation myth constructed later to define identity against Babylon/Egypt.
      *   *Arthur:* Gildas (6th C.) mentions a siege at Badon but doesn't name Arthur. Nennius (9th C.) names him. Geoffrey of Monmouth (12th C.) makes him a king. The gap is too wide for a "kernel" to survive without distortion; it is likely a "debris" accumulation around a local warlord.
  *   **Kernel:** There is a chain of transmission or contemporary mention.
      *   *Troy:* We have Hittite texts from the *actual time* (1200 BCE) mentioning conflicts in the Troad. We have the oral tradition (Homer) written down later. The bridge is shorter.

  ### 3. Applying the Flip to Your Examples

  **The Trojan War**
  *   **Current Consensus:** It sits right on the hinge, leaning toward **Kernel**.
  *   **Why:** Because of the Hittite Corroboration. We know "Wilusa" existed. We know "Ahhiyawa" were hostile. We know there was a destruction layer (Troy VIIa).
  *   **The Flip:** It becomes "Legend with Debris" if you argue the *Iliad* itself is history. It becomes "Kernel" if you argue the *Iliad* is a poetic reflection of a century of skirmishes that were recorded in Hittite archives. The "War" wasn't a 10-year siege over a woman (Debris/Myth); it was a series of trade wars over the Dardanelles (Kernel/History).

  **King Arthur**
  *   **Current Consensus:** **Legend with Debris.**
  *   **Why:** The "Debris" is the collapse of Roman Britain and the Saxon migration. There was definitely violence, definitely warlords.
  *   **The Flip:** To flip to "Kernel," you would need a 6th-century inscription naming Arthur as *Dux Bellorum* with a specific battle list that matches archaeological destruction layers of Saxon camps. Without that, Arthur is a "composite hero" (like Hercules) built to personify the British resistance. The real debris is the Saxon graves; the legend is the nationalistic need for a hero.

  **The Exodus**
  *   **Current Consensus:** **Legend with Debris.**
  *   **Why:** The "Debris" is the historical reality of the Hyksos expulsion (Semitic people leaving Egypt) and the presence of Shasu nomads in Canaan.
  *   **The Flip:** To flip to "Kernel," you would need evidence of 2 million people (or even 20,000) wandering Sinai for 40 years. Pottery trails, water cisterns, mass graves. We have none.
  *   **Epistemic Status:** Most historians view this as a "Foundation Myth" constructed in the 7th century BCE (Josiah's reign) to unify Judah. It *grabbed* real debris (memories of smaller groups leaving Egypt, knowledge of Egyptian geography) but the *narrative event* did not happen as described.

  ### 4. Summary: The "Null Hypothesis" of History

  The ultimate epistemic hinge is the **Null Hypothesis**.

  *   **In the "Debris" Frame:** The null hypothesis is that the story is **false/mythic**. The burden of proof is on the archaeologist to show that the story *could not* have been invented without the event. (e.g., "Why would they invent a list of cities that were already ruins?")
  *   **In the "Kernel" Frame:** The null hypothesis is that the story is **true/distorted**. The burden of proof is on the skeptic to show that the event *could not* have happened.

  **The Criteria that Flips the Framing:**
  You flip from "Debris" to "Kernel" only when the text contains **information that was unavailable to the author at the time of writing.**

  *   If Homer describes a Bronze Age helmet type that was not used in the Iron Age (and he couldn't have known it unless the tradition preserved it), that is a **Kernel**.
  *   If the Bible describes a city (Ai) that was destroyed 1,000 years before the supposed conquest, and the author treats it as standing, that is **Debris** (the author is projecting a myth onto a landscape they don't historically understand).

  **Conclusion:**
  Finding a destruction layer at Hisarlik doesn't prove the *Iliad* is history. It proves there was a war.
  *   If you think the *Iliad* is about that war, you hold the **Kernel** view.
  *   If you think the *Iliad* is a poem written 400 years later that *used* the memory of that war to talk about heroism, you hold the **Debris** view.

  The epistemic hinge is whether you treat the text as a **source of data** (Kernel) or a **source of ideology** (Debris). Archaeology can confirm the setting, but only **textual criticism and independent corroboration** can determine the causal direction.
