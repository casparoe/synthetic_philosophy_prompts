answer: |-
  ### Step 1: Brainstorming the Conceptual Landscape

  To locate your observation, we must map the surrounding theoretical territory. The posture you describe sits at a precarious intersection of several established frameworks, borrowing from each but adhering strictly to none.

  1.  **Environmental Determinism (Classic):** This posits that environmental conditions *dictate* social outcomes (e.g., "The heat made them lazy," "The drought caused the revolution").
      *   *Mismatch:* Your examples explicitly retain human choice and institutional variation. The outcome is not mechanically inevitable; the environment merely *sorts* or *reveals* the quality of the response.
  2.  **Possibilism (Vidal de la Blache):** The environment sets limits and offers possibilities, but culture chooses the path.
      *   *Mismatch:* Possibilism is passive. The environment is a stage or a menu. In your examples, the environment is an *active examiner* ("stress-testing," "dissolving," "exposing"). It has a directional vector toward truth or structural integrity.
  3.  **The Vulnerability Paradigm (Disaster Studies):** Pioneered by scholars like Ben Wisner and Kenneth Hewitt, this argues that "there is no such thing as a natural disaster," only natural *hazards* interacting with social *vulnerability*.
      *   *Mismatch:* This is the closest neighbor. However, critical disaster studies usually strive to *de-center* the hazard to focus on the social construction of vulnerability. The historians you cite seem to re-center the hazard as the *agent of revelation*. The volcano doesn't just hit a weak building; it *judges* the building.
  4.  **Actor-Network Theory (ANT) / New Materialism:** Grants "actancy" to non-humans (Latour, Bennett).
      *   *Mismatch:* ANT typically flattens the ontology, treating humans and non-humans as symmetrical actants. Your historians maintain a hierarchy: the non-human tests, the human *responds*. Furthermore, ANT avoids the normative/teleological flavor of "pedagogy" or "diagnosis."
  5.  **Evolutionary Selectionism (Cultural Evolution):** Traits are selected by environmental pressures.
      *   *Mismatch:* This operates on deep time and population levels. Your examples apply selectionist logic to *short-term political events* (a single eruption, a single plague wave) and treat institutions as organisms that pass or fail a specific "test."
  6.  **Natural Experiments (Economic History):** Using exogenous shocks to identify causal effects.
      *   *Mismatch:* This is a methodological tool for identification, not an ontological claim about the shock's *meaning*. A natural economist says, "The volcano allows us to measure the effect of X." Your historians say, "The volcano *revealed the truth* of X."

  **Synthesis of the Landscape:**
  The pattern you identify is not standard determinism, nor is it standard social constructivism. It is a **functionalist** attribution of agency to nature, where nature acts as a **filter** that validates or invalidates social structures based on their internal coherence. It imports the logic of **natural selection** (environment selects traits) into **political history** (climate selects institutions), wrapped in the rhetoric of **diagnosis** (nature as doctor/judge).

  ### Step 2: Assessment and Proposal

  **Is there an established term?**
  No. There is no single canonical term in the philosophy of history or historiography of science that precisely captures this *diagnostic, non-intentional, functionally directive agency*.

  Scholars speak of "triggers," "shocks," "stressors," or "hazards," but these denote mechanical input. When historians describe the 1815 eruption as "exposing structural fragility" in a way that implies the eruption *performed the exposure* as a function, they are employing a rhetorical device that lacks a formal label. It is often hidden under the umbrella of "environmental history" or "resilience theory," but those fields do not necessarily endorse the *normative diagnostic* posture you describe.

  **Proposed Terminology:**
  I propose naming this posture **"Revelatory Selectionism"** (for the causal logic) or, more precisely regarding the agency attribution, **"Diagnostic Agency."**

  For your chapter, I recommend the term **"Diagnostic Naturalism."**

  **Definition:**
  **Diagnostic Naturalism** is an explanatory posture in which non-human forces (climatic, microbial, geological) are attributed a non-intentional but functional capacity to *test, reveal, or validate* the internal coherence of human systems. Unlike mechanical causation, the non-human force is not merely a push; it is a *criterion*. The narrative structure implies that the environment imposes a problem to which there is a "correct" institutional solution, and historical outcomes are evaluated based on whether human actors successfully "read" and adapted to this diagnostic signal.

  ### Step 3: Boundary Conditions

  To ensure this concept is distinct and useful, we must delineate it from adjacent ideas:

  **(a) Versus Ordinary Multicausal Explanation:**
  *   *Multicausal:* "The volcano caused crop failure, which contributed to unrest, alongside tax policy." (Environment is a variable).
  *   *Diagnostic Naturalism:* "The volcano *stripped away* the illusion of Bourbon stability." (Environment is a revealer of truth).
  *   *Distinction:* In multicausal models, the environment adds weight. In Diagnostic Naturalism, the environment adds *clarity*. It removes noise to show the "real" signal of social health.

  **(b) Versus Full-Blown Historical Agency:**
  *   *Full Agency:* "Nature punished the Bourbons for their hubris." (Implies intent/moral judgment by nature).
  *   *Diagnostic Naturalism:* "Nature exposed the Bourbons' fragility." (Implies functional judgment without intent).
  *   *Distinction:* The historian denies nature has a mind, but writes as if nature has a *purpose* (the purpose of testing integrity). It is *teleological without a telos*.

  **(c) Versus Gould-Lewontin Spandrels:**
  *   *Spandrels:* The outcome is a byproduct; the appearance of design is an illusion.
  *   *Diagnostic Naturalism:* The outcome is a *selection*; the appearance of design (resilience) is a verified quality.
  *   *Distinction:* A Spandrel critique would argue that the institution didn't survive because it was "fit," but by luck. Diagnostic Naturalism assumes the survival *proves* the fitness. It treats the historical survivor as the "correct" answer to the environmental equation.

  ### Step 4: Hidden Normative Commitments

  This is the most critical philosophical contribution you can make in your chapter. **Diagnostic Naturalism carries a heavy, often unacknowledged normative load:**

  1.  **The Adaptationist Imperative:** It posits that *resilience* is the primary moral and political good. An institution that collapses under climate stress is implicitly framed as *defective*, rather than perhaps unjust, exploitative, or simply unlucky. It naturalizes political failure.
  2.  **Depoliticization of Crisis:** By framing a crisis as a "test" administered by nature, it shifts focus from *why* the vulnerability existed (e.g., inequality, resource hoarding) to *how* the system failed to adapt. It turns a political critique into a technical management problem.
  3.  **Nature as Arbiter:** It grants nature a position of epistemic privilege. The "truth" of the social order is not found in human discourse or justice, but in its ability to withstand physical shock. This risks a "might makes right" logic where surviving systems are validated simply because they survived.
  4.  **The "Correct" Response:** It implies there is an objectively correct institutional response to a volcanic winter or a plague. This ignores that different responses benefit different groups (e.g., labor scarcity benefited peasants but hurt landlords; "innovation" might mean enclosure).

  ### Step 5: Falsification and Vulnerability

  **What would change my mind?**
  I would conclude that **Diagnostic Naturalism** is not a distinct concept if:
  1.  **Explicit Metaphorical Reduction:** A historian using this language explicitly states in their methodology: "When I say the plague 'dissolved' feudalism, I am using shorthand for 'surviving peasants leveraged labor scarcity to negotiate better terms, which historians have traditionally attributed to the plague.'" If the "diagnostic" language is admitted to be purely pedagogical flourish with no causal weight in the argument, the category dissolves into rhetoric.
  2.  **Symmetrical Vulnerability:** If the analysis demonstrates that the "fragility" revealed was *created* by the specific historical actors (e.g., the Bourbon state *manufactured* the fragility via specific policies) and the volcano was truly random, then the "diagnostic" function belongs to the *historian's analysis*, not the *volcano*. If the historian acknowledges *they* are doing the diagnosing using the volcano as data, rather than the volcano *doing* the diagnosing, then this is just standard **Vulnerability Analysis**, not Diagnostic Naturalism.
  3.  **Correlation without Selection:** If the narrative shows that "successful" adaptations were statistically indistinguishable from random survival (luck), but the historian still frames them as "passing the test," then the concept holds as a *bias*, but not as a valid causal mode.

  **Where is my reasoning vulnerable?**
  1.  **Definition of Agency:** My analysis relies on a distinction between "intentional agency" and "functional agency." A proponent of **Flat Ontology** (e.g., DeLanda, Latour) might argue that *all* agency is distributed and that my distinction is an anthropocentric hang-up. They might argue the volcano *does* have agency, and I am being too conservative.
  2.  **Historian's Intent:** I am inferring the philosophers' commitment from the rhetorical texture of the history. It is possible historians are using this language heuristically without committing to the ontology. If this is merely a "genre convention" of environmental history writing rather than a philosophical stance, my critique might be over-reading.
  3.  **Resilience Theory Overlap:** "Resilience" is a dominant paradigm in social-ecological systems (SES). It explicitly uses "stress-test" language. If Diagnostic Naturalism is simply **Resilience Theory applied to history**, it may not need a new name, but rather a critique of how Resilience Theory is being historicized. (I lean towards the latter, but the *normative* implication in history is distinct from systems engineering).

  ### Conclusion

  You have identified a genuine gap in the taxonomy of historical explanation. The posture is **Diagnostic Naturalism**: the attribution of a revelatory, selectionist function to non-human forces, which serves to validate surviving institutions as "fit" and frame collapse as "fragility."

  It differs from determinism because it allows for human choice; it differs from standard materialism because it grants nature a *judicial* role. It is a form of **secular theodicy**, where suffering (plague, famine) is justified because it reveals the "truth" of the social order.

  **Recommendation for your chapter:**
  Do not just name it; critique the **normative silence** surrounding it. When a historian writes that the Little Ice Age "tested" the state, ask: *Who defined the parameters of the test?* *Why is survival the metric of success?* *Does this framing obscure the violence required to maintain that "resilience"?* By exposing Diagnostic Naturalism, you reveal how environmental history can inadvertently naturalize political power under the guise of studying climate.
