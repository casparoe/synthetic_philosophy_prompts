answer: |-
  Your intuition is sharper than the standard economic metaphor. The "Tragedy of the Commons" (Hardin's pasture) assumes a specific set of conditions: rivalrous resources, lack of communication, and no enforcement. Your fishery example proves that when those conditions change (communication + enforcement), the tragedy vanishes.

  Your verdicts aren't messy; they are consistent around a variable that Hardin ignored: **Power.**

  ### The Principle: Asymmetric Conversion

  The unifying principle across your cases is **Asymmetric Conversion.**

  Blame does not attach to *using* a commons. It attaches to **converting a shared resource into private leverage without sustaining the source.**

  *   **The Fishery:** The boats convert fish into income, but they police the stock. The conversion is symmetric with sustainability. (Verdict: Great)
  *   **The Flu Shot / Emissions:** You convert public safety/stable climate into personal health/industrial output, but you degrade the stock for others. (Verdict: Blameworthy)
  *   **The Drug Company / Library Company:** They convert public investment/labor into private monopoly profits or product stability, without feeding back into the source. (Verdict: Anger/Wrong)
  *   **The Hobbyist / You on Wikipedia:** You convert the resource into personal utility/knowledge. You lack the *capacity* to degrade the stock or monopolize the benefit. (Verdict: Fine)

  Your moral calculus isn't about "free-riding." It's about **capacity-weighted reciprocity.** Your obligation to the commons scales with your ability to deplete it and your ability to profit from it.

  ### The Verdict to Throw Out

  If you want a tidy principle, you have to throw out **The Neighbor.**

  **Why:** The snow-clearing scenario is not a commons problem; it is a **club good** or **social contract** problem.

  A commons involves a *stock* that can be depleted (fish, air, trust, open-source code). A sidewalk is not a stock. The snow is not a resource you are extracting; it is a nuisance you are avoiding. The neighbor isn't depleting a shared resource; they are violating a local norm of reciprocity.

  Keeping this case in your "commons" bucket forces you to rely on "mild annoyance" rather than structural harm. It dilutes your definition. If you remove it, your principle becomes strictly about **resource integrity and power dynamics**, which is much stronger for science writing. The neighbor is just being a jerk; the drug company is being predatory. Those are different categories of wrong.

  ### The Test Case: The AI Company

  **Scenario:** A company trains a model on everything publicly posted online and gives the thing away for free.

  **Applying the Principle:**
  This hinges on the definition of "gives the thing away."

  1.  **If "Free" means Open Weights (True Commons):**
      If they release the model weights and architecture openly, allowing others to run it, fine-tune it, and build upon it, they are acting like **Wikipedia**. They have converted public data into a public tool. They have not retained private leverage.
      *   *Verdict:* **Fine.** (Like the Hobbyist/Wikipedia).

  2.  **If "Free" means Free API (Enclosed Commons):**
      If they retain control of the weights and serve it via an API (even for free today), they are acting like the **Drug Company**.
      *   **Extraction:** They have scraped the cognitive commons (public posts).
      *   **Conversion:** They have built a proprietary asset (the model) that creates dependency.
      *   **Leverage:** "Free" is a loss leader. They gain the data flywheel, the brand dominance, and the switch costs. They centralize the means of cognitive production.
      *   **Sustainability:** They do not compensate the creators of the data, nor do they necessarily sustain the web ecosystem (which may be flooded with AI slop).

  **My Verdict:** **Blameworthy.**

  Even if the product is free, the *infrastructure* is privatized. They are converting the shared cultural record into a private moat. The "free" aspect is a distribution strategy, not a return of value to the source. Unless they are open-sourcing the model itself, they are extracting private leverage from a shared stock without reciprocal sustenance.

  **The Nuance for Your Piece:**
  The flip-flop you feel on this case likely comes from the "free" aspect triggering your "Wikipedia" intuition. But the key difference is **ownership of the means.** Wikipedia is owned by a foundation; the AI model is owned by a company. That ownership is where the asymmetric leverage hides.
