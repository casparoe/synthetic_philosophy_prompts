prompt: |-
  I'm a planning officer for a mid-sized council and we're drowning in applications mixing affordable housing with market-rate units. I want to turn Rawls's veil of ignorance and the difference principle into an actual decision procedue I can run on each proposal — the questions in order, what counts as a sufficient answer, where it stops with a no, and where I have to hand the decision to an elected member because it's values rather than facts. There's a twist: our local framework treats daylight access and walking-distance healthcare as primary goods alongside income, which isn't standard Rawls but it's what I have to work with. It needs to be usable by someone who hasn't touched political philosophy since uni, should flag where it'll misfire, and mustn't ask me for citations or a bibliography. Run it on two cases: a developer wants to replace a derelict canal lock with luxury flats plus 10% "affordable" units, and another wants height exemptions near the hospital for staff housing that'd cast long shadows over existing council estates. Make sure one gives me an answer I'd rather not hear. Write in British English please, and skip any reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Planning Officer, mid-sized council.
      *   **Problem:** Overwhelmed by mixed-tenure applications (affordable vs. market).
      *   **Goal:** Create a practical decision procedure based on Rawls's *Veil of Ignorance* and the *Difference Principle*.
      *   **Specific Constraint/Twist:** Local framework treats *daylight access* and *walking-distance healthcare* as "primary goods" (alongside income).
      *   **Requirements:**
          *   Usable by non-philosophers.
          *   Clear questions in order.
          *   Criteria for sufficient answers.
          *   Stop points (automatic No).
          *   Escalation points (values vs. facts -> Elected Member).
          *   Flag potential misfires/limitations.
          *   No citations/bibliography.
          *   British English.
          *   **Test Cases:**
              1.  Derelict canal lock -> Luxury flats + 10% affordable.
              2.  Height exemption near hospital -> Staff housing + shadows over council estates.
          *   **Outcome:** One case must yield an unwelcome answer.

  2.  **Deconstruct Rawls for Planning:**
      *   *Veil of Ignorance:* Decision-makers shouldn't know their specific place in the outcome (e.g., are they the future resident of the affordable unit or the luxury penthouse? Are they the neighbour losing light?). In planning terms, this means impartiality and focusing on the worst-off position.
      *   *Difference Principle:* Inequalities are only permissible if they benefit the least advantaged members of society.
      *   *Primary Goods:* Rights, liberties, opportunities, income, wealth, and the social bases of self-respect. *Twist:* Add Daylight and Healthcare Access.

  3.  **Drafting the Procedure (The "Rawlsian Planning Filter"):**
      *   *Step 1: Identify the "Least Advantaged".* Who loses out most? (Existing residents, affordable housing applicants, etc.).
      *   *Step 2: The Veil Test.* If I didn't know where I'd end up in this development, would I accept the risk?
      *   *Step 3: The Difference Principle Test.* Does the inequality (luxury vs. affordable, height exemption vs. existing light) actually improve the lot of the worst-off?
      *   *Step 4: Primary Goods Check.* specific focus on the local twist (Daylight/Healthcare).
      *   *Step 5: Escalation.* Where does technical assessment end and political value judgement begin?

  4.  **Refining the Steps for a Planning Officer:**
      *   Need to make it bureaucratic but principled.
      *   *Question 1:* Who is the "Least Advantaged" group affected? (Fact-finding).
      *   *Question 2:* Does the proposal reduce their access to Primary Goods (Income, Daylight, Healthcare)? (Impact Assessment).
      *   *Question 3:* If yes, does the inequality generate a surplus that *directly* compensates or benefits them? (The Difference Principle).
      *   *Question 4:* The Veil Test. Is the burden distributed fairly, or concentrated on those already vulnerable?
      *   *Stop/Go logic:* If Primary Goods are reduced without benefit -> NO. If benefit is speculative -> ESCALATE.

  5.  **Developing the Test Cases:**

      *   *Case A: Canal Lock (Luxury + 10% Affordable).*
          *   Context: Derelict site (brownfield).
          *   Inequality: 90% rich, 10% poor.
          *   Primary Goods: Daylight (maybe ok), Healthcare (neutral), Income (high disparity).
          *   Difference Principle: Does the 10% affordable *need* the 90% luxury to exist? Usually yes (viability). Does it benefit the least advantaged? Yes, provides housing.
          *   Rawlsian Verdict: Likely Pass, *but* 10% might be too low to satisfy "maximin" if policy expects more. Let's make it tricky. If the luxury units hoard the best daylight/view, that's a primary good inequality.
          *   *Decision:* Conditional Yes, but the 10% figure is the friction point.

      *   *Case B: Hospital Staff Housing (Height Exemption + Shadows).*
          *   Context: Height exemption for staff (good cause).
          *   Impact: Shadows over *existing council estates* (the least advantaged).
          *   Primary Goods: Daylight (reduced for worst-off), Healthcare (improved for staff/patients).
          *   Difference Principle: Does the hospital staff housing benefit the council estate residents? Indirectly, maybe better local health services. But the direct loss (light) hits the poor. The gain (staff housing) helps a different group (workers, not necessarily the worst-off residents).
          *   Rawlsian Verdict: This should be the "No" or the "Unwelcome Answer". The worst-off (estate residents) lose a Primary Good (Daylight) to benefit a group that might be better off (hospital staff) or the institution.
          *   *Wait, the prompt asks for one answer I'd "rather not hear".* As a planning officer, rejecting hospital staff housing is politically difficult. Or, approving the luxury flats when you need more affordable housing is the "unwelcome" truth of viability. Let's aim for the Hospital case to be a **No** (because it harms the worst-off directly) which is unwelcome because it blocks staff housing. OR, the Canal case is a **No** because 10% isn't enough to satisfy the Difference Principle if the luxury units monopolize the "good" primary goods (light/view).
          *   *Better angle:* The Canal case is the "Unwelcome Answer". Why? Because the math says the luxury development *subsidises* the affordable. If you apply Rawls strictly, you might have to reject the 10% if it creates a segregated underclass within the block without sufficient benefit. But realistically, the Hospital case is the stronger ethical conflict. Let's make the Hospital case the **No**. It blocks "good" housing for staff because it harms the "worst-off" residents. That's a hard Rawlsian line.
          *   *Actually, let's flip it.* The prompt says "Make sure one gives me an answer I'd rather not hear."
          *   *Scenario 1 (Canal):* Rawls might say "Yes, because without the luxury, no affordable gets built." This is the cynical reality officers know. Not unwelcome.
          *   *Scenario 2 (Hospital):* Rawls might say "No, you cannot take light from the poor to house the workers." This is the unwelcome answer because it blocks healthcare capacity.
          *   *Wait, let's look at the Primary Goods twist.* Daylight is a primary good.
          *   *Case 1:* Luxury get best light, affordable get north-facing. Inequality in primary goods.
          *   *Case 2:* Estate loses light. Hospital staff gain housing.
          *   *Decision:* I will make the **Canal Case** the one that fails. Why? Because 10% is tokenism. Under the Difference Principle, the inequality (90/10 split) must maximize the position of the least advantaged. If policy says 30%, and they offer 10% citing viability, Rawls asks: "Is this the *maximum* possible benefit?" If the officer suspects viability is padded, Rawls demands a No. This is unwelcome because it kills a brownfield regeneration.
          *   *Alternative:* The Hospital case fails. It takes light from the poor (estate) to help the hospital. Rawls prioritizes the existing worst-off (estate) over the new entrants (staff). This is unwelcome because it hurts the NHS.
          *   *Let's go with the Hospital Case failing.* It highlights the tension between "new good" and "existing bad". Taking light from the poor is a direct violation of their Primary Goods.

  6.  **Writing the Procedure:**
      *   Tone: Professional, direct, British Council style.
      *   Structure: The Filter (Steps 1-5), The Escalation Protocol, The Limitations.
      *   Application to cases.

  7.  **Review against Constraints:**
      *   British English? (Check: programme, centre, colour, "council", "planning officer").
      *   No citations? (Check).
      *   Usable by non-philosophers? (Keep jargon minimal, explain "Primary Goods" in context).
      *   Flag misfires? (Yes, need a section on where Rawls breaks down in planning).
      *   One unwelcome answer? (Ensure the Hospital case results in a recommendation for Refusal, which is politically painful).

  8.  **Refining the "Unwelcome Answer":**
      *   If I recommend refusal on the Hospital Staff Housing, that's unwelcome because it hampers healthcare.
      *   If I recommend refusal on the Canal Lock, that's unwelcome because it hampers regeneration.
      *   Let's make the **Canal Lock** the one that passes but feels dirty (10% is accepted because it's better than 0%), OR the **Hospital** one that fails.
      *   *Decision:* The Hospital case will result in a **Refusal**. Why? Because the "Least Advantaged" (Council Estate residents) lose a defined Primary Good (Daylight) to benefit a group that is not necessarily the least advantaged (Hospital Staff). Rawls protects the existing worst-off from being sacrificed for the greater good. This is the hard pill to swallow.

  9.  **Final Polish:**
      *   Ensure the "Veil" question is practical. "If you were randomly assigned to live in the affordable unit *or* the shadowed estate, would you accept this?"
      *   Ensure the "Difference Principle" is about *maximizing* the minimum.
      *   Check the "Primary Goods" definition includes the local twist.

  10. **Self-Correction during drafting:**
      *   *Correction:* Rawls isn't just about "no harm". It's about inequality being justified *only if* it helps the worst off.
      *   *Case 1 (Canal):* Inequality (Luxury vs Affordable). Does the luxury help the affordable? Yes, via cross-subsidy. Is 10% the *maximum* possible affordable? If viability says yes, it passes.
      *   *Case 2 (Hospital):* Inequality (Staff Housing vs Estate Light). Does the height exemption help the Estate residents? No, it harms them. Does it help the worst off in society? Hospital staff are paid; estate residents are on benefits. The loss falls on the poorest. The gain falls on the institution/staff. This violates the Difference Principle.
      *   *Result:* Hospital case = Refusal. This is the unwelcome answer (blocking NHS expansion).

  11. **Final check on "Values vs Facts":**
      *   Facts: Shadow calculations, income brackets, viability reports.
      *   Values: How much light is "enough", is 10% "fair".
      *   Escalation point: When the "benefit" to the worst-off is qualitative rather than quantitative.

  12. **Drafting the Content.** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Rawlsian Planning Filter (RPF)
  **Internal Guidance Note for Development Management**
  **Version 1.0 | Confidential**

  ## Purpose
  This procedure operationalises the council's commitment to distributive justice. It is not a replacement for the Development Plan, but a weighting mechanism for applications where competing interests (market vs. affordable, density vs. amenity) create significant inequality. It is based on two concepts:
  1.  **The Veil of Ignorance:** Would you accept this outcome if you didn't know which unit you would end up in, or which neighbour you would be?
  2.  **The Difference Principle:** Inequalities (in wealth, height, density) are only permitted if they work to the greatest benefit of the least advantaged.

  **Local Definition of Primary Goods:**
  For the purpose of this filter, the following are treated as essential rights that cannot be arbitrarily withdrawn:
  *   Income/Wealth (Affordability).
  *   **Daylight Access (Sunlight/Daylight levels).**
  *   **Walking-Distance Healthcare Access.**

  ---

  ## The Procedure (5 Steps)

  Run these questions in order. If you stop at a "No", the recommendation is Refusal. If you reach Step 5, the decision is delegated to the Planning Committee (Elected Members).

  ### Step 1: Identify the "Least Advantaged" Group
  **Question:** Who stands to lose the most or gain the least from this proposal?
  *   *Look for:* Existing residents on benefits, applicants for social housing, neighbours with existing poor amenity, low-income workers.
  *   **Sufficient Answer:** A specific demographic or geographic group (e.g., "Residents of Block B, Council Estate," or "Future occupants of the 10% affordable units").
  *   **Stop Point:** If you cannot identify who is least advantaged, the application lacks sufficient social impact data. **Request Further Information.**

  ### Step 2: The Primary Goods Audit
  **Question:** Does the proposal reduce the Least Advantaged Group's access to Income, Daylight, or Healthcare compared to the *status quo* or *policy minimum*?
  *   *Look for:* Shadow diagrams, viability reports showing reduced affordable contribution, loss of local clinic access.
  *   **Sufficient Answer:** Quantifiable data (e.g., "No. of hours of sunlight reduced by 20%," "Affordable housing reduced from 30% to 10%").
  *   **Stop Point:** If the answer is **Yes** (goods are reduced), proceed to Step 3. If **No**, the application passes this filter (subject to other policies).

  ### Step 3: The Difference Principle Test
  **Question:** Is this reduction in Primary Goods necessary to generate a surplus that *directly* benefits the Least Advantaged Group?
  *   *Look for:* Cross-subsidy mechanisms. Does the luxury element *have* to exist to fund the affordable? Does the height exemption *have* to exist to fund the staff housing?
  *   **Crucial Distinction:** The benefit must go to the *Least Advantaged*, not the developer, not the council's general fund, and not a different group (e.g., hospital staff) unless they are also the least advantaged.
  *   **Sufficient Answer:** A viability report or business case proving that without the inequality (e.g., extra height), the benefit (e.g., affordable units) would not exist at all.
  *   **Stop Point:** If the inequality benefits a *different* group (e.g., taking light from the poor to house middle-income workers), recommend **Refusal**.

  ### Step 4: The Veil of Ignorance Check
  **Question:** If you were randomly assigned to live in the "worst" unit or be the "worst" affected neighbour, would the overall package still be acceptable?
  *   *Look for:* Segregation of tenure (poor units hidden at the back), "poor doors," or concentration of negative externalities (noise, shadow) on existing social housing.
  *   **Sufficient Answer:** Design evidence that the Least Advantaged receive the *same quality* of Primary Goods (light, aspect, access) as the Most Advantaged.
  *   **Stop Point:** If the design creates a "second class" experience for the affordable/affected group, recommend **Refusal**.

  ### Step 5: The Escalation Point (Values vs. Facts)
  **Question:** Is the benefit to the Least Advantaged quantitative (facts) or qualitative (values)?
  *   *Look for:* "Community benefit," "Regeneration vibe," "Long-term economic growth."
  *   **Procedure:** If the benefit is speculative (e.g., "This luxury tower will regenerate the area eventually"), you cannot decide this.
  *   **Action:** **Refer to Planning Committee.** State clearly: "Officer advice is that the Difference Principle is not met on facts, but the strategic value judgement belongs to Members."

  ---

  ## Known Misfires & Limitations
  *   **The "Viability Black Box":** Developers often claim they *cannot* afford more affordable housing. Rawls assumes good faith. If you suspect viability numbers are padded, this filter will fail. You need independent audit power, which we don't have.
  *   **The "Future Resident" Problem:** Rawls focuses on the worst-off. Sometimes the "worst-off" are future people who need housing, not existing neighbours protecting light. This filter biases towards existing residents.
  *   **The "Primary Good" Conflict:** What if Daylight conflicts with Healthcare? (e.g., housing medical staff requires blocking light). This filter prioritises the *existing* Least Advantaged over the *new* entrants. This may block essential infrastructure.

  ---

  ## Test Run: Two Current Applications

  ### Case A: The Canal Lock Regeneration
  **Proposal:** Demolish derelict lock. Build 100 luxury flats, 10 "affordable" units (10%).
  **Context:** Site is brownfield, no existing residents. Local policy expects 30% affordable.

  **Running the Filter:**
  1.  **Least Advantaged:** Future occupants of the 10 affordable units (low income) vs. Luxury buyers.
  2.  **Primary Goods Audit:** Do the affordable units get less Daylight/Quality? *Yes.* Plans show affordable units are north-facing; luxury gets the canal view and south aspect.
  3.  **Difference Principle:** Is the 90% luxury necessary to fund the 10% affordable? *Viability report says yes.* Without the luxury sales, the scheme yields 0% affordable. So, 10% is better than 0%.
  4.  **Veil Check:** If I didn't know which unit I'd get, would I accept a 90% chance of luxury and 10% chance of a north-facing social unit? *Yes, because the alternative is no housing on a derelict site.*
  5.  **Escalation:** The inequality (10% vs 30% policy) is based on financial facts (viability).

  **RPF Outcome:** **Recommend Approval (with conditions).**
  **Officer Note:** This feels uncomfortable. We are accepting a segregated class system within the block. However, under the Difference Principle, the least advantaged (social tenants) are better off with 10 units than with none. The inequality benefits them directly.

  ---

  ### Case B: Hospital Staff Housing (Height Exemption)
  **Proposal:** 12-storey block for NHS staff (rent below market). Site borders "Oakwood" Council Estate (3-storey).
  **Context:** Hospital needs staff housing. Oakwood Estate residents already suffer from poor daylight due to density.
  **Impact:** New block casts shadow over Oakwood communal gardens for 4 hours/day in winter.

  **Running the Filter:**
  1.  **Least Advantaged:** Oakwood Estate residents (low income, high dependency on local amenity space).
  2.  **Primary Goods Audit:** Does the proposal reduce their access to Primary Goods? *Yes.* Significant loss of Daylight (defined Primary Good). Healthcare access is neutral for them (they aren't the staff).
  3.  **Difference Principle:** Does this loss benefit the Least Advantaged (Oakwood)? *No.* It benefits Hospital Staff (who are paid workers, not necessarily the least advantaged) and the NHS Trust.
      *   *Argument:* "Better staff retention improves local healthcare."
      *   *Counter:* This is speculative (Step 5 territory). The direct loss of light is factual. The gain is indirect.
  4.  **Veil Check:** If I were randomly assigned to be an Oakwood resident or a Nurse, would I accept this? *Maybe.* But Rawls prioritises the *existing* worst-off position. The Oakwood residents are being asked to sacrifice a Primary Good (light) for a group that is likely economically better off than them.
  5.  **Escalation:** N/A. The test fails at Step 3.

  **RPF Outcome:** **Recommend Refusal.**
  **Officer Note:** **This is the answer you won't want to hear.**
  Blocking staff housing near a hospital seems counter-intuitive to public welfare. However, under this specific framework, you cannot strip a Primary Good (Daylight) from the existing poorest residents to benefit a working-class/middle-income group (staff), even if they work in healthcare. The inequality does not maximise the position of the Oakwood residents; it worsens it.

  **Why this misfires:**
  This highlights the limitation of the framework. It protects the *current* poor from the *future* good. It prioritises the rights of existing estate residents over the systemic need for healthcare capacity. If you approve this, you are admitting the Rawlsian Filter is subordinate to Utilitarian needs (greatest good for greatest number). If you refuse, you uphold the Difference Principle but damage local health infrastructure.

  **Action:**
  For Case B, I recommend you take the Refusal recommendation to the Planning Committee but explicitly flag the **Step 5 Escalation**. Argue that the trade-off between "Daylight for the Poor" and "Healthcare Capacity for the Public" is a **Value Judgement**, not a Fact. Let the Elected Members take the political heat for overriding the Difference Principle.

  ---

  ## Summary for the Officer
  *   **Use the Filter** to harden your reasoning on viability and amenity.
  *   **Expect Friction** when "Public Good" (like hospitals) conflicts with "Distributive Justice" (protecting the poorest neighbours).
  *   **Escalate** when the benefit to the poor is speculative. Do not sign off on "trickle-down regeneration" as a fact.
  *   **Remember:** This tool makes you the guardian of the worst-off. It will make you unpopular with developers and sometimes with the public who want "growth" at any cost. Ensure your Committee Chair understands this mandate.
