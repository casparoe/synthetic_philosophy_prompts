answer: |-
  There is no single, universally standardized noun for this specific phenomenon, but there are two existing concepts that, when combined, describe it precisely.

  The rhetorical shape is a **Self-Sealing Argument** (or **Self-Sealing System**).
  The epistemic condition is **Structural Unfalsifiability**.

  Here is the breakdown of why these fit, how they differ from Goodhart's Law, and how your two cases relate.

  ### 1. The Term: "Self-Sealing"
  In rhetoric and philosophy of science, a "self-sealing argument" is one that is immune to refutation because any potential counter-evidence is reinterpreted or rendered inaccessible by the premise of the argument itself.

  Usually, this term is applied to conspiracy theories (e.g., "The lack of evidence proves how well they covered it up"). However, in your context, it is not a conspiracy; it is a **structural feature**. The policy physically destroys the mechanism that would audit the policy.

  *   **Case 1 (Innocence):** The claim is "We don't execute innocents." The evidence against this would be an exonerated executed person. The policy ensures no such person can exist to testify. The system seals itself against the data of its own failure.
  *   **Case 2 (Deterrence):** The claim is "Swift execution deters." The test requires swift execution. The safeguards required to prevent error prevent swiftness. To test the claim, you must dismantle the safeguards, which makes verifying the safety of the test impossible.

  ### 2. The Condition: "Structural Unfalsifiability"
  Karl Popper defined science by **falsifiability**: for a theory to be scientific, there must be a way to prove it wrong. Your examples describe a policy that renders itself **unfalsifiable** not by logic, but by mechanics.

  *   **Why it's not just "Absence of Evidence":** In a standard absence of evidence case, the data is missing due to chance, negligence, or time. In your cases, the data is missing *because of the intervention*. The policy is the cause of the silence.
  *   **Why it's not Goodhart's Law:** Goodhart's Law is about *gaming* a measure ("When a measure becomes a target, it ceases to be a good measure"). In your examples, no one is gaming a metric. The metric (evidence of innocence/deterrence) is being **annihilated**.

  ### 3. Are your two cases the same thing?
  They are two temporal variations of the same structural failure: **Severed Feedback.**

  *   **Case 1 is Retrospective Feedback Destruction.** It destroys the ability to look *backward* and correct errors. In systems theory, this is breaking the "negative feedback loop" that stabilizes a system. By killing the subject, you kill the error signal.
  *   **Case 2 is Prospective Feedback Destruction.** It destroys the ability to look *forward* and validate efficacy. It creates a condition where the only way to test the hypothesis is to create a version of the system that is too dangerous to monitor safely.

  Nassim Taleb has a specific concept for Case 1 called **"Silent Evidence"** (or the "Silent Graveyard"). He argues that history is written by the survivors; we see the death row exonerations (the survivors) but cannot see the executed innocents (the silent evidence). Your insight adds the causal link: the policy *creates* the silence.

  ### A Proposed Definition
  If you need a phrase to use in conversation that marks the edges precisely as you requested, I suggest **"Epistemically Self-Sealing."**

  > **Definition:** A practice is **epistemically self-sealing** when the implementation of the practice inherently destroys, hides, or precludes the generation of the data required to evaluate the practice's safety or efficacy.
  >
  > **Edges:**
  > *   It is distinct from **Goodhart's Law** because the metric is not being gamed; it is being erased.
  > *   It is distinct from standard **Absence of Evidence** because the absence is causally produced by the policy, not merely coincidental.
  > *   It is distinct from **Irreversibility** because the focus is not on the harm itself, but on the loss of the *knowledge* of the harm.

  ### Summary
  Your friend was close with Goodhart's, but you are right to reject it. Goodhart's is about corruption of measurement; this is about **destruction of the subject of measurement.**

  The most accurate existing label is a **Self-Sealing System**, but the most precise description is that the policy creates **Structural Unfalsifiability** through **Evidentiary Destruction.**
