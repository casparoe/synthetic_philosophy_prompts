answer: |-
  This is a precise request for a category-theoretic/semantic mapping of a metaphysical debate. I will treat "Computationalism" as a claim about implementation relations and "Anti-Computationalism" as a claim about the insufficiency of those relations to capture specific semantic properties.

  Here is the translation of the debate into your vocabulary, followed by the analysis of what breaks.

  ---

  ### Part 1: The Translation (Von Neumann Target)

  Assume a classical discrete-state, clocked target architecture $M_{brain}$ (the neural substrate modeled as a finite state machine or Turing equivalent).

  **(a) Cognition is Computation**
  *   **Philosophical Claim:** Mental states are computational states; thinking is processing.
  *   **PL Translation:** There exists a source language $L_{mind}$ (Mentalese) and a compilation relation $\mathcal{C}$ such that for any cognitive task $P \in L_{mind}$, the brain state $S_{brain}$ is a correct implementation of $P$.
  *   **Formalism:** $\exists L_{mind}, \mathcal{C} \cdot \forall P \in L_{mind} \cdot \text{Obs}(\llbracket P \rrbracket_{L_{mind}}) \cong \text{Obs}(\text{Run}(M_{brain}, \mathcal{C}(P)))$.
  *   **Meaning:** Cognition satisfies a correctness theorem relative to a functional specification.

  **(b) The Chinese Room (Syntax $\neq$ Semantics)**
  *   **Philosophical Claim:** Manipulating symbols by rule (syntax) does not generate understanding or aboutness (semantics).
  *   **PL Translation:** Operational equivalence does not imply denotational identity regarding *intentionality*.
  *   **Formalism:** $\text{Bisim}(S_{room}, S_{speaker}) \implies \text{Obs}_{ext}(S_{room}) = \text{Obs}_{ext}(S_{speaker})$, **but** $\text{Denote}_{internal}(S_{room}) \neq \text{Denote}_{internal}(S_{speaker})$.
  *   **Meaning:** You can prove full abstraction with respect to external I/O (the Turing Test), but the internal denotation (the "meaning" of the symbols to the system) is undefined or null for the shuffler. The compilation preserves behavior but erases the *semantic environment* required for the types to mean anything.

  **(c) Triviality / Observer-Relativity (Putnam)**
  *   **Philosophical Claim:** Any physical system can be interpreted as running any program, given a sufficiently gerrymandered mapping.
  *   **PL Translation:** The set of valid encoding functions $E: \text{PhysicalState} \to \text{LogicalState}$ is unconstrained.
  *   **Formalism:** $\forall S_{phys}, \forall P_{logic}, \exists E \cdot \text{Implements}(S_{phys}, P_{logic}, E)$.
  *   **Meaning:** The implementation relation is vacuous because the "type erasure" from physics to logic allows arbitrary bijections. If the compiler can map physical state $t_1$ to logical state $A$ and $t_2$ to $B$ without respecting the transition structure *causally*, then implementation is trivial.

  **(d) The Mechanistic Reply**
  *   **Philosophical Claim:** Computation requires causal organization, not just post-hoc mapping.
  *   **PL Translation:** The encoding $E$ must be a **homomorphism** preserving the transition relation, not just a bijection on traces.
  *   **Formalism:** $\text{Implements}(S, P, E) \iff \forall s_1, s_2 \cdot \text{Trans}_{phys}(s_1, s_2) \implies \text{Trans}_{logic}(E(s_1), E(s_2))$.
  *   **Meaning:** The "compiler" cannot be an external observer's lookup table; it must reflect the substrate's causal topology. The physical transitions must *drive* the logical transitions. This constrains the set of valid $E$ to those that respect the hardware's operational semantics.

  ---

  ### Part 2: The Translation (Analog/Neuromorphic Target)

  Now assume your lab's substrate: continuous-time dynamics, no ISA, state = voltage/charge, computation = trajectory in phase space.

  **(a) Cognition is Computation**
  *   **PL Translation:** Cognition is the satisfaction of a system of differential equations. The "program" is the topology and weight matrix; the "execution" is the trajectory.
  *   **Formalism:** $\text{Behavior}_{mind} \approx \text{Solution}(\dot{x} = f(x, u))$.
  *   **Shift:** "Compilation" becomes "Modeling." The claim is that the physical dynamics are isomorphic to the cognitive dynamics.

  **(b) The Chinese Room**
  *   **PL Translation:** Trajectory matching $\neq$ Intentional Content.
  *   **Formalism:** Even if $\| x_{phys}(t) - x_{model}(t) \| < \epsilon$, the *interpretation* of $x$ as representing "grandmother" or "number 5" is not contained in the ODE.
  *   **Shift:** In analog, there is no "symbol shuffling." The objection becomes: "Matching the voltage curve doesn't explain why the voltage *means* anything." This attacks the link between the continuous state space and the discrete semantic domain.

  **(c) Triviality**
  *   **PL Translation:** Universal Approximation / Curve Fitting.
  *   **Formalism:** For any finite trace $T$, $\exists f(\cdot)$ such that the system produces $T$.
  *   **Shift:** In continuous time, triviality is *harder* to establish for infinite horizons (you can't map a finite state system to an infinite precision trajectory easily), but *easier* for finite windows (any noise looks like a signal if you filter it right). The "encoding" is now a readout function $R(x(t))$. If $R$ is unconstrained, you can read out "Hamlet" from a thermostat.

  **(d) The Mechanistic Reply**
  *   **PL Translation:** Structural Stability and Causal Topology.
  *   **Formalism:** The mapping must preserve the *attractor landscape*, not just a single trajectory.
  *   **Shift:** The constraint isn't just on state transitions (discrete) but on the vector field itself. The "program" is the geometry of the phase space. The reply insists the physical connectivity must match the functional dependency graph of the cognition.

  **Dependency Check:**
  Claim (c) (Triviality) relies heavily on the **Von Neumann** assumption of discrete, separable states. In the analog case, the "encoding" $E$ must be a continuous function respecting topology. You cannot map a discontinuous logical state change to a continuous physical voltage without violating continuity constraints. Thus, (c) is weaker in the analog case; it is harder to claim a rock implements a neural net if the rock's dynamics are linear and the net's are chaotic. **Verdict:** The Triviality argument secretly assumes a digital, state-discretized target where arbitrary bijections are topologically permissible.

  ---

  ### Part 3: The "No-ABI Problem"

  You asked: *Does the lack of a well-defined I/O boundary map to anything, or is it an imported assumption?*

  **The Translation:**
  In PL, a correctness theorem requires an observational equivalence predicate: $\text{Obs}(P) = \text{Obs}(P')$. This presupposes an **ABI** (Application Binary Interface)—a defined set of registers, memory regions, or ports that constitute "observable behavior."
  *   **The Brain:** Has no clear boundary. Is the output the motor neuron spike? The muscle contraction? The resulting behavior in the world? Is the input the retinal photon? The LGN spike? The neuromodulator concentration?
  *   **Philosophical Parallel:** This is the **Input/Output Problem** (discussed by Gualtiero Piccinini and Oron Shagrir). It is also closely related to Quine's **Indeterminacy of Translation**.
  *   **Your Worry:** Does framing this as a "No-ABI" problem import the assumption that implementation *must* be answerable to an external observer?
  *   **Verdict:** **Yes.** By demanding an ABI, you are enforcing an **External Operational Semantics**. You are saying, "The brain computes $F$ relative to environment $E$."
  *   **Philosophical Rejection:** Many philosophers (internalists, phenomenologists) argue that the "computation" of the mind is defined by its *internal* coherence, not its external I/O. They would reject the requirement for an ABI. They argue for a **Denotational Semantics** where the "meaning" is intrinsic to the state, not defined by an external observation predicate.
  *   **Systems Perspective:** From your view, a system without an ABI is a library without a header file. It might do something, but you cannot link against it. You cannot state a refinement relation without defining the boundary. If the brain has no ABI, "The brain computes X" is a type error.

  ---

  ### Part 4: The Residue Report

  Here is the breakdown of what survives the translation and what evaporates.

  | Claim | Translation Status | Notes on Failure / Fudge |
  | :--- | :--- | :--- |
  | **(a) Cognition is Computation** | **Clean** | Maps directly to "Implementation Relation." Requires defining $L_{mind}$, which is undefined, but structurally sound. |
  | **(b) Chinese Room (Understanding)** | **Failed** | **Critical Residue.** PL semantics maps symbols to *mathematical objects* (domains), not *qualia* or *aboutness*. You can model "meaning" as a mapping to a world model, but the *feeling* of meaning (phenomenology) has no operator in your calculus. |
  | **(c) Triviality (Putnam)** | **Clean (Digital)** / **Fudged (Analog)** | In digital semantics, this is "Unconstrained Encoding." In analog, it requires "Arbitrary Readout Functions." The claim weakens significantly if the target is continuous dynamics. |
  | **(d) Mechanistic Reply** | **Clean** | Maps perfectly to "Causal Homomorphism" or "Structure-Preserving Compilation." This is standard hardware verification logic. |
  | **No-ABI Problem** | **Fudged** | Imports the assumption that semantics are **External/Observational**. Rejects **Internal/Denotational** accounts of meaning. |

  #### Detailed Residue Analysis

  **1. The "Understanding" Residue (Claim b)**
  *   **Verdict:** Genuine Residue.
  *   **Analysis:** Your instinct is partially right: it *is* changing the subject if you define semantics mathematically. In PL, if $\llbracket \text{word} \rrbracket = \text{object}$, that *is* the meaning. But the Chinese Room argument targets *phenomenological* meaning (what it is *like* to know the word).
  *   **Engineering View:** This is a "Non-Functional Requirement" that your type system doesn't track. You can verify safety and liveness (behavior), but you cannot verify "satisfaction" (experience).
  *   **Conclusion:** This is not a gap in your vocabulary; it is a gap in the *computational framework itself*. If computation is defined as symbol manipulation (or trajectory generation), "understanding" is an external property attributed by an observer, not an internal state. The debate persists because one side defines semantics operationally (you understand if you act correctly) and the other defines it phenomenologically (you understand if it feels like something). Your vocabulary forces the operational view, so the objection looks like a category error to you. To them, your vocabulary is the category error.

  **2. The "Name the Architecture" Dissolution Strategy**
  *   **Verdict:** Dissolves (c), Ignores (b).
  *   **Analysis:** If everyone is forced to name a target architecture $M$ and an encoding $E$:
      *   **Triviality (c) Dies:** You can no longer say "anything computes anything." You must show the homomorphism holds for the specific $M$ and $E$. Most trivial mappings will fail the causal constraint check.
      *   **Chinese Room (b) Remains:** You can specify $M$ and $E$ perfectly, prove full abstraction, and Searle will still say, "But it doesn't *mean* anything."
      *   **No-ABI (Your Worry) Remains:** Specifying $M$ doesn't specify the boundary. You still need to define what counts as an "input" to $M$.

  **3. The Analog Substrate Insight**
  *   **Verdict:** High Value.
  *   **Analysis:** You suspected some claims rest on architectural assumptions. You are correct.
      *   **Triviality** depends on the ability to discretize state arbitrarily. In a continuous system, the "encoding" function must be continuous. You cannot map a rock (linear thermal dynamics) to a brain (chaotic neural dynamics) without a readout function that does all the work. If the readout function is constrained to be "simple" (e.g., linear probe), the triviality argument collapses.
      *   **Implication:** The "Brain is a Computer" debate is largely a "Brain is a *Digital* Computer" debate. If you shift to "Brain is a Dynamical System," the computationalist claim becomes "Cognition is Dynamics," and the Chinese Room objection loses its grip on "symbol shuffling" (since there are no symbols), only to be replaced by "Why does this voltage trajectory feel like pain?"

  ### Final Verdict

  **Does specifying the target and encoding dissolve the dispute?**
  It dissolves the **Triviality** objection (c) completely. It turns a metaphysical worry into a verification engineering problem. If you can't write the compiler spec, you don't have a computation.

  It does **not** dissolve the **Consciousness** objection (b). That objection is not about the *relation* between system and program; it is about the *intrinsic nature* of the system. In PL terms, it is a demand for a semantics where the denotation includes the *experience* of the evaluation context. Since no such semantics exists (we don't have a `qualia` type), the argument cannot be formalized in your vocabulary.

  **The "No-ABI" Problem:**
  You are not reinventing the wheel; you have rediscovered the **Boundary Problem**. Your framing *does* import an assumption: that cognition is defined by its interface. A philosopher of mind would argue that the "ABI" is internal (the relation between subsystems), not external (the relation to the world). However, from a systems perspective, an internal ABI without an external one is just a closed loop heater—it runs, but it computes nothing *about* anything.

  **Summary for your 1am argument:**
  Tell your roommate: "Computationalism is a claim that there exists a structure-preserving homomorphism from neural dynamics to cognitive functions. The Triviality objection claims the set of homomorphisms is too broad; the Mechanistic reply constrains them via causal topology. This is solvable engineering. The Chinese Room objection claims that even a valid homomorphism lacks 'intentional denotation.' This is not a semantics error; it is a request for a type primitive that does not exist in the formalism. If we switch to analog dynamics, the Triviality objection fails because continuous mappings are constrained, but the Intentionality objection remains because trajectories don't have 'aboutness' any more than voltages do."
