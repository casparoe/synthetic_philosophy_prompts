answer: |-
  I study philosophy of mind. My brother studies behavior. Usually, that means I talk about what he 'feels,' and he gently corrects me at Thanksgiving. So tonight, I'm speaking his language. It's a tricky balance.

  There's a ladder in cognitive science. At the bottom, Darwinian creatures survive. Next, Skinnerian creatures learn from consequences. [Groom] doesn't believe in 'love at first sight.' He believes in selection. Every interaction with [Bride] selected for a kinder version of him. She changed his environment, and he evolved to fit it.

  Then Popperian creatures, who let hypotheses die in their stead. He simulated futures. He ran long-term scenarios before committing. In every viable model of his life, she was the constant variable. Then Gregorian creatures, using cultural tools. They didn't just think alone; they thought together. They built a shared vocabulary where 'home' isn't a place, but a person. They map the world together.

  But today, we climb to the fifth rung. The Austenian creature. This is where words don't describe the world; they change it.

  A wedding vow isn't a report on an inner state. It's not data about a feeling. It's a tool. It's a public act that bolts a new reality into place. When he says 'I promise,' he isn't telling you what's in his skull. He's handing you the leverage to hold him accountable. That is the only love that survives winter. Not a spark, but a structure.

  This is why we are here. We aren't just an audience. We are the machinery. A promise needs witnesses to become real. When things get hard, we don't ask what they 'feel.' We remind them what they said. We hold the tool steady. We are the external hard drive for their commitment.

  For my brother's colleagues, they've established a mutual contingency that maintains itself. To the rest of you: they make each other better, automatically.

  So, [Bride]'s grandma, yes, this is romance. It's the romance of public commitment. And [Groom]'s lab mates, yes, this is rigorous. It's the science of keeping a promise.

  Love isn't something hidden inside you. It's something we build around you. It lives in this room. It lives in us.

  To the Austenian couple: May your speech acts remain true, and may we all be here to uphold them. Thank you. Cheers.
