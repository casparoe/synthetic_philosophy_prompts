answer: |-
  Al-Ghazālī severs the link between observed conjunction and metaphysical necessity, asserting that God alone acts while created things serve merely as habitual occasions.

  First, fire retains status as a *sharṭ* (condition), not an efficient cause. It is not a mere temporal neighbor; it is the specific locus where God *habitually* creates effects. This preserves empirical reliability—fire usually burns cotton—without granting creatures independent power.

  Second, this distinction undermines the philosophers' eternal cosmos. If causation were necessary, an infinite regress of causes would be required, forcing an eternal universe. By denying necessary causation, Al-Ghazālī allows God to create effects directly without prior natural causes, permitting a temporal beginning and miracles that interrupt natural habits.

  Third, the philosophers were vulnerable because they modeled physical causation on logical necessity, akin to a function that must return a specific value given an input. They equated "what happens" with "what must happen." Al-Ghazālī argues this conflates observation with ontology. By insisting God could decouple fire from blackening without contradiction, he demonstrates that natural laws are contingent expressions of divine will, not independent constraints. This protects divine omnipotence from being subordinate to a rigid, eternal causal chain, re-establishing God as the sole true agent rather than a primary gear in a self-sustaining machine.
