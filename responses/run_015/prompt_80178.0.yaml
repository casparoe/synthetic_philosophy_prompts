answer: |-
  # The 30-Minute Concealment Review Protocol

  **Purpose:** To evaluate listener claims of institutional concealment or harm for a public-radio science column.
  **Users:** One retired toxicologist (Subject Matter Expert), one journalist (Process Facilitator).
  **Time Limit:** 30 minutes per claim.
  **Epistemic Stance:** Fallibilist. We aim to minimize false positives (airing falsehoods) while acknowledging the possibility of false negatives (missing a truth). The burden of proof rests on the claimant.

  ---

  ## Part I: Triage and Sorting (5 Minutes)

  Before evaluating evidence, categorize the claim. Different claims require different standards of proof.

  **Step 1: Assign Claim Type**
  *   **Type A (Specific Concealment):** Names specific documents, dates, people, or institutions (e.g., "Company X hid Study Y in 1994").
  *   **Type B (Systemic Incentive):** Alleging structural bias without a coordinating group (e.g., "Funding structures suppress negative results").
  *   **Type C (Global Compromise):** Alleging a whole field is corrupt with no specific evidence (e.g., "All toxicology is bought").

  **Step 2: Apply Evidentiary Standard**
  *   **Type A Standard:** *Preponderance of Evidence.* Requires specific, checkable documentation or credible, on-record testimony.
  *   **Type B Standard:** *Plausibility + Documentation.* Requires evidence of the incentive structure, not evidence of a secret handshake.
  *   **Type C Standard:** *Falsifiability.* If the claim cannot be proven false by any conceivable evidence, it is not a scientific claim.
      *   *Action:* **Park Type C claims immediately.** Do not evaluate truth value. Mark as "Unfalsifiable as stated."
      *   *Reasoning:* A claim that "everyone is in on it" immunizes itself against counter-evidence (any dissenting expert is dismissed as part of the conspiracy). This violates the demarcation criterion of science.

  ---

  ## Part II: Evaluation Checks (15 Minutes)

  ### For Type A: Specific Concealment
  *Run these four checks in order. If any check fails decisively, stop and move to Verdict.*

  **Check 1: Secrecy Capacity (The "Leak" Test)**
  *   **Question:** How many people would need to know to keep this secret, for how long? Does this align with known secrecy capacity in this industry?
  *   **Sufficient Answer:** The number of conspirators is small (e.g., <5), or the timeframe is short, *OR* there is a documented culture of extreme secrecy (e.g., classified defense work) that supports long-term containment.
  *   **Failure Condition:** The claim requires dozens of people (lab techs, admins, regulators) to stay silent for decades in a litigious industry where turnover is high.
  *   **Expert Calibration:** Do not use folk intuition ("people talk"). Use domain knowledge ("In my 31 years, internal memos larger than X size leaked within Y years").
  *   **Judgment Call:** *Threshold of "Too Many."* The Expert must define the number. This is not mechanical.

  **Check 2: Failure Explanation (Hanlon's Razor)**
  *   **Question:** Can the observed harm/delay be explained by incompetence, bureaucracy, negligence, or diffusion of responsibility?
  *   **Sufficient Answer:** The concealment explanation explains specific anomalies (e.g., altered dates, destroyed logs) that negligence cannot.
  *   **Failure Condition:** The observed outcome (delay, missing data) is consistent with standard institutional drag, budget cuts, or bureaucratic error.
  *   **Requirement:** The conspiracy explanation must be *more parsimonious* than the negligence explanation, not just more dramatic.

  **Check 3: Records and Predictions (The Falsifiability Test)**
  *   **Question:** Does the claim generate a concrete prediction? (e.g., "FOIA request Z will show a gap," "Document D exists in Archive E").
  *   **Sufficient Answer:** The claimant points to a specific record trail that can be checked.
  *   **Failure Condition:** The claim relies on "they destroyed everything" or "it's all verbal."
  *   **Action:** If no checkable prediction exists, move to **Parked**.

  **Check 4: Whistleblower Silence (Base Rate Test)**
  *   **Question:** Is the absence of a whistleblower evidence of guilt?
  *   **Rule:** Silence is only evidence of concealment if the base rate of whistleblowing in this domain is *high*.
  *   **Application:** In industries with strong NDAs and blacklisting, silence is expected regardless of guilt. In domains with strong protections and high turnover, silence is suspicious.
  *   **Judgment Call:** *Assessing Base Rates.* The Expert must assess the risk/reward ratio for whistleblowers in this specific sector.

  ### For Type B: Systemic Incentive
  *Run these two checks.*

  **Check 1: Mechanism Verification**
  *   **Question:** Is the incentive structure documented? (e.g., "Publish or perish," industry-funded grants).
  *   **Sufficient Answer:** Peer-reviewed literature or meta-analyses confirm the bias exists (e.g., the "file drawer problem").
  *   **Failure Condition:** The claim asserts an incentive without evidence of its operation.

  **Check 2: Coordination Distinction**
  *   **Question:** Does the claim require active coordination?
  *   **Rule:** If the claim works via individual rational actors responding to incentives, it is **Systemic**, not Conspiracy.
  *   **Action:** Validate the bias, but correct the framing. Do not label it "concealment" if it is "publication bias."

  ---

  ## Part III: Limitations and Judgment Calls (5 Minutes)

  **Explicit Judgment Points:**
  The procedure cannot mechanize the following. The Expert and Journalist must agree here:
  1.  **Source Credibility:** Is the anonymous source likely to exist? (Assess plausibility of their position).
  2.  **Motive Weighting:** Is the motive for concealment (profit, liability) strong enough to override the motive for disclosure (scientific prestige, regulatory compliance)?
  3.  **"Unlikely" Threshold:** At what point does low probability become "dismissal"? (Protocol suggests >90% certainty of alternative explanation for dismissal).

  **Procedure Bias & Asymmetry:**
  *   **Conservative Tilt:** This procedure is designed to prevent false positives (airing a lie). It will produce false negatives (missing a truth).
  *   **Reasoning:** The cost of a false alarm is loss of public trust in the program and science. The cost of a missed concealment is limited to this specific column (the truth may emerge elsewhere).
  *   **Misfire Zone:** The procedure will struggle with "smart" conspiracies that mimic bureaucracy perfectly. It assumes institutions are more often incompetent than evil. If an institution is *competently* evil, this tool may miss it.

  ---

  ## Part IV: Verdict and Rationale (5 Minutes)

  Select one of the following four verdicts. Draft the one-paragraph rationale using the template provided.

  **Verdict Categories:**
  1.  **Supported, Investigate Further:** Evidence meets Type A or B standards. Warrants a deeper look or referral.
  2.  **Plausible, Needs Specific Evidence:** The mechanism is possible, but the specific claim lacks documentation.
  3.  **Likely False, Here Is Why:** Alternative explanations (negligence/error) are significantly more parsimonious; secrecy capacity is exceeded.
  4.  **Parked, Unfalsifiable:** Claim is Type C or lacks checkable predictions.

  **Rationale Template:**
  > "We evaluated the claim that [Summary]. While [Acknowledgement of valid concern/intuition], the claim [Failed Check X / Lacks Evidence Y]. Specifically, [Key Reason: e.g., no documents / systemic bias vs. conspiracy]. Therefore, we cannot endorse this claim as stated."

  ---

  # Case Studies

  ## Case 1: The Buried 1994 Study (Type A)
  **Claim:** Mid-sized chemical company buried internal 1994 liver damage study; state agency knew by 1996; delayed label. Source: Former employee ("they all knew"). No documents. Agency records show slow review.

  **Protocol Run:**
  1.  **Sorting:** Type A (Specific Concealment). Standard: Preponderance of Evidence.
  2.  **Check 1 (Secrecy Capacity):** *Fail.* To bury a study and delay a state label requires coordination between company management, legal, lab staff, and state regulators. Timeframe: 30+ years.
      *   *Expert Input:* In 31 years, internal studies of this magnitude involving multiple agencies rarely stay sealed without a paper trail leak, especially given employee turnover.
  3.  **Check 2 (Failure Explanation):** *Pass (for Alternative).* "Routine, if slow, review" is consistent with bureaucratic underfunding or backlog. Negligence is more parsimonious than coordinated fraud.
  4.  **Check 3 (Records):** *Fail.* Claimant offers no documents, no FOIA targets, no specific names. "They all knew" is hearsay.
  5.  **Check 4 (Silence):** *Neutral/Negative.* No whistleblower in 30 years. In a litigious industry, this is unusual for a fraud of this scale, though NDAs are strong.

  **Verdict:** **Likely False, Here Is Why**

  **Rationale:**
  > "We evaluated the claim that a chemical company buried a 1994 safety study with state agency complicity. While industry concealment of data is historically documented, this specific claim lacks the necessary evidentiary threshold. The allegation requires a multi-decade silence across two institutions without a single document leak or on-record whistleblower, which exceeds typical secrecy capacity in this sector. The observed delay is consistent with documented bureaucratic sluggishness. Without specific records or named sources, we must treat this as an unproven allegation rather than established fact."

  **Note on Intuition Conflict:**
  You suspect the company *did* bury the study because you know companies *can* and *have* buried studies. The procedure diverges from your intuition here because it distinguishes between **Capacity** and **Instantiation**.
  *   **Your Intuition:** "The *capacity* for this crime exists in this industry." (True).
  *   **The Procedure:** "Has the *instantiation* of this crime been demonstrated in this instance?" (False).
  The procedure protects the column from guilt-by-association. To move the verdict, you would need: a named whistleblower willing to speak on record, a specific document reference (e.g., "Study Protocol 94-B"), or a discrepancy in the agency's public log that cannot be explained by backlog.

  ## Case 2: The Compromised Field (Type C)
  **Claim:** Entire field of toxicology is compromised because every lab is industry-funded; no honest researcher will speak up.

  **Protocol Run:**
  1.  **Sorting:** Type C (Global Compromise).
  2.  **Step 2 (Evidentiary Standard):** Falsifiability Check.
      *   *Analysis:* The claim asserts "every laboratory" and "no honest researcher." Any counter-example (an honest researcher) is dismissed by the claim as "part of the compromise."
  3.  **Action:** Park immediately.

  **Verdict:** **Parked, Unfalsifiable**

  **Rationale:**
  > "We evaluated the claim that the entire field of toxicology is compromised by industry funding. This claim is categorized as unfalsifiable because it posits a total systemic corruption that dismisses any counter-evidence as part of the conspiracy. While funding conflicts are a serious ethical concern worthy of discussion, a claim that no honest research exists cannot be tested or verified. We cannot air assertions that preclude the possibility of being proven wrong."

  ## Case 3: The Suppressed Negative Results (Type B)
  **Claim:** Negative results from safety testing are systematically suppressed due to publication and funding incentives. Cites general fact of under-publication.

  **Protocol Run:**
  1.  **Sorting:** Type B (Systemic Incentive). Standard: Plausibility + Documentation.
  2.  **Check 1 (Mechanism):** *Pass.* The "file drawer problem" is well-documented in meta-scientific literature. Journals prefer positive findings; funders prefer clear outcomes.
  3.  **Check 2 (Coordination):** *Pass.* This does not require a secret meeting. It requires individual actors making rational choices within a biased system.
  4.  **Distinction:** This is not a conspiracy; it is a structural bias.

  **Verdict:** **Supported, Investigate Further** (with framing correction)

  **Rationale:**
  > "We evaluated the claim that negative safety results are systematically suppressed. The evidence supports the existence of this phenomenon, known in science as 'publication bias' or the 'file drawer problem.' However, this is driven by structural incentives in publishing and funding rather than a coordinated conspiracy to conceal. We endorse discussing this systemic issue, but we must frame it as a known institutional failure rather than a deliberate plot by specific actors."
