      *   *Case 3 (Systemic Incentive):*
          *   *Input:* Negative results suppressed due to publication/funding norms.
          *   *Procedure Application:*
              *   Sorting: Type (b).
              *   Mechanism: Publication bias is well-documented (file drawer problem).
