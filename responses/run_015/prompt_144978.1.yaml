answer: |-
  The snag hinges on whether morality is a component of life or its total purpose. If it's merely one value among many, the saint is defective because they crowd out art, friendship, and play, becoming a moral monomaniac rather than a whole person. They are too good for their own happiness. However, the deeper issue suggests morality isn't a scalar you can infinitely maximize. It has a saturation point. Once obligations are met, pursuing "more" goodness doesn't add value; it distorts the concept itself, turning virtue into compulsion. The problem isn't that saints sacrifice too much, but that the idea of infinite moral accumulation is conceptually broken. Morality sets boundaries for action, not a leaderboard for worth. Thus, the saint isn't undesirable because they lack hobbies, but because the project of maximizing morality misunderstands that moral value saturates. You cannot be "more than good," only good.
