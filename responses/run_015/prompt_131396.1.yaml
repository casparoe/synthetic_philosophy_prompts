      *(Self-Correction during drafting)*: Make sure I don't sound like I'm saying AI *is* a writer. It's a tool that *writes*. The alignment problem is about the tool's relationship to the user's will. The novelist's relationship to their *own* work is different (internal vs external). I need to clarify that the AI is standing in for the "hand" or the "drafting self," not the "critic self." Actually, the AI is an *externalized drafting self*. That's the key.

