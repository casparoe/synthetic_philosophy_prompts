      *Flagging Uncertainty:* I need to flag that "Value Alignment" in AI is often ethical, whereas here it's aesthetic. Is "Aesthetic Alignment" a subset? Yes, but AI safety cares about *power*. Novels don't have power.

      *Settled vs. Contested:*
