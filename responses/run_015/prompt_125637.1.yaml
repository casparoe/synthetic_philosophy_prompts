answer: |-
  You have identified a real, structural limit of the Debate protocol, and you are right to feel that the standard "honesty via falsification" story doesn't cover it.

  There is no single canonical term like "Gish Gallop" for this specific failure mode, but it is discussed in the AI safety literature under a few overlapping concepts. Below are the nearest existing candidates, why they miss the mark, and then a coined term that carves out the specific shape you are describing.

  ### The Near Misses (Existing Concepts)

  **1. The Decomposition Assumption**
  *   **What it is:** The foundational assumption of Debate (Irving et al., 2018) that complex questions can be broken down into simpler sub-questions until reaching atoms a human can verify.
  *   **Why it misses:** This names the *premise* that is being violated, not the *failure mode* itself. It explains why Debate *should* work, but doesn't name the phenomenon where decomposition succeeds (the atoms are verified) but the reconstruction fails (the conclusion remains ambiguous).

  **2. Falsification Bias / Popperian Limit**
  *   **What it is:** Debate relies on a Popperian model of science: you don't prove truth, you eliminate falsehood. One fatal flaw kills the argument.
  *   **Why it misses:** This captures the logic, but not the texture. Your examples aren't about failing to falsify; they are about the *absence of a fatal flaw*. The "Falsification Bias" explains why the judge looks for a kill-shot; it doesn't name the problem where the target is made of water and offers no purchase for the spear.

  **3. Underdetermination of Theory by Data**
  *   **What it is:** A philosophical concept where the available evidence is insufficient to determine which belief or theory is correct.
  *   **Why it misses:** This is too broad. It applies to science generally. Your scenario is specific to the *adversarial protocol*: the judge has *more* data after the debate than before, yet is no more decisive. The problem isn't lack of data; it's the *incommensurability* of the data points.

  **4. Obfuscation via Complexity**
  *   **What it is:** A known attack where a dishonest debater makes the argument tree so deep the judge gets lost.
  *   **Why it misses:** You explicitly ruled this out. In your scenario, the judge understands every node. The confusion isn't cognitive load; it's evaluative uncertainty.

  ---

  ### The Coinage: "The Aggregation Ceiling"

  Since no existing label captures the specific geometry of "verified atoms, unresolvable synthesis," I propose calling this **The Aggregation Ceiling**.

  **Definition:**
  The **Aggregation Ceiling** is the point in a decomposed argument tree where all leaf nodes (atomic claims) have been successfully verified or hedged, but the function mapping those leaves to the root claim (the final conclusion) is **weighted** rather than **conjunctive**. Because the protocol is optimized for finding boolean falsehoods (conjunctive failure), it cannot resolve disputes about relative importance (weighted aggregation), leaving the judge with resolved facts but an unresolved judgment.

  **The Mechanics of the Failure:**
  *   **Debate's Strength (Conjunctive Logic):** "The bridge is safe IF (A) materials are good AND (B) design is sound AND (C) construction was correct." If the opponent proves $\neg A$, the root is False. The judge knows what to do.
  *   **The Aggregation Ceiling (Weighted Logic):** "The bridge is safe IF (A) materials are *mostly* good + (B) design is *adequate* + (C) construction was *acceptable*." If the opponent proves A is "incomplete" but not "fatal," the math doesn't resolve. The judge must assign weights ($w_A, w_B, w_C$) to the verified facts. Debate provides the facts, but the adversarial process does not provide the weights.

  ### Boundary Cases: Chain-of-Facts vs. Weighted-Judgment

  To know if a question hits the Aggregation Ceiling, check the logical connective between the sub-claims and the conclusion.

  | Feature | **Chain-of-Facts (Debate Works)** | **Weighted-Judgment (Aggregation Ceiling)** |
  | :--- | :--- | :--- |
  | **Logical Structure** | Conjunctive ($A \land B \land C \to D$) | Additive/Compensatory ($w_1A + w_2B + w_3C \to D$) |
  | **Failure Mode** | One lie kills the whole argument. | Many small truths blur the conclusion. |
  | **Debater Strategy** | Hide the one broken link. | Argue the *weight* of the links. |
  | **Judge's Task** | Spot the falsehood. | Assign relative importance. |
  | **Example** | "Did the suspect leave the house?" (Requires verifying camera, logs, witness). | "Is the suspect dangerous?" (Requires weighing history, context, intent). |
  | **Resolution** | Binary (True/False). | Probabilistic/Normative (Safe/Unsafe, Likely/Unlikely). |

  **Your Examples Analyzed:**
  1.  **Bridge Safety:** This is a risk aggregation problem. Incomplete welds + thin margins + normal practice. None are fatal lies; all are risk factors. The debate resolves the *existence* of the risks, but not the *tolerance* for them. That is a policy judgment, not a factual one. **Hits the Ceiling.**
  2.  **Psychology Replication:** This is a signal-to-noise problem. Small methodological quirks accumulate. Debate can verify "they didn't pre-register," but cannot verify "how much that lowers replication probability." **Hits the Ceiling.**

  ### What To Do Instead

  If you identify a question as hitting the Aggregation Ceiling, the Debate protocol is the wrong tool. You are asking for a **judgment**, not a **verification**.

  **1. Shift to Forecasting (Scoring Rules)**
  Don't ask the judge to decide "Safe/Unsafe." Ask the debaters to output a probability ("80% chance of replication"). Train them using proper scoring rules (Brier score) on eventual outcomes. This bypasses the need for the judge to understand the *weighting*; the judge only needs to track who was *calibrated* over time.
  *   *Why it works:* It moves the burden from "understand the weights now" to "who predicted the outcome better later."

  **2. Shift to Red-Teaming / Audit**
  Instead of two debaters arguing, use one model to try to break the system and a human to watch the failure rate.
  *   *Why it works:* In the bridge case, you don't want to debate safety; you want to see if the bridge breaks in simulation. This converts the weighted judgment into a boolean outcome (Break/No Break).

  **3. Deliberative Polling (Cooperative)**
  Adversarial debate optimizes for *persuasion* on the weighting. If the weighting is subjective, persuasion is noise. A cooperative "deliberation" protocol where models jointly produce a risk report with confidence intervals may be superior.
  *   *Why it works:* It removes the incentive to spin the weights and focuses on mapping the uncertainty landscape.

  **4. Accept the Judge's Role**
  Acknowledge that for Aggregation Ceiling questions, the AI is not an oracle of truth but a **information compressor**. The goal of the debate is not to force a correct verdict, but to ensure the human judge's verdict is *informed*. If the judge remains uncertain after the debate, the correct output is "Uncertain," not a forced binary choice.

  ### Summary
  You haven't misunderstood the setup; you've found its boundary. Debate solves **Epistemic Opacity** (I don't know the facts). It does not solve **Evaluative Opacity** (I know the facts, but I don't know what they signify).

  The name for this is **The Aggregation Ceiling**. It occurs when the truth is a weighted sum rather than a logical chain, rendering the "find the lie" mechanic impotent because there are no lies, only trade-offs.
