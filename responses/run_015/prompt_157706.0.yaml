  Here's the logical space for the napkin sketch. I've structured it as a series of concrete yes/no questions your professor can draw as branches. The goal is to get from the root idea to the specific positions without using jargon until the very end (the leaves).

  ### The Napkin Tree: "The Cosmic Ledger"

  **Root Question:** *When bad things happen to good people (or vice versa), is it because the universe is balancing a moral account?*

  *   **NO** → **Leaf 1: Desert-Agnostic Consequentialism**
      *   *Logic:* Outcomes matter, but "desert" is a fiction. Suffering is just bad luck or a tool for future good, not payment for past sins.
  *   **YES** → (Go to Question 2)

  **Question 2:** *Does the debt survive if the person forgets the deed entirely? (e.g., Amnesia or Past Life)*

  *   **NO** → **Leaf 2: Secular Retributivist Analogue**
      *   *Logic:* You can't owe a debt you don't remember incurring. Moral responsibility requires psychological continuity.
      *   *Collapse Condition:* If you believe the "soul" exists independently of memory, this branch collapses into the YES path.
  *   **YES** → (Go to Question 3)

  **Question 3:** *Can the debt be passed to a group (family, nation) that never chose to act together?*

  *   **YES** → (Go to Question 4)
  *   **NO** → (Go to Question 5)

  **Question 4 (Collective Path):** *Did the group explicitly or implicitly consent to share responsibility?*

  *   **NO** → **Leaf 3: Collective Karma Without Consent [EMPTY BRANCH]**
      *   *Diagnosis:* **Incoherent.** If karma is about *moral* desert, it requires agency. A group that never chose to be a moral unit cannot be a moral agent. Punishing them is just violence, not justice.
      *   *Note:* You can keep this leaf in the tree to show the "trap" your friends might fall into.
  *   **YES** → **Leaf 4: Collective Karma with Consent Conditions**
      *   *Logic:* Families or nations can share a ledger, but only if members buy into the collective identity (e.g., citizenship, vows).

  **Question 5 (Individual Path):** *If a virtuous person gets lucky (winning the lottery), does that count as "payment" for their virtue?*

  *   **YES** → **Leaf 5: Loose Balance Karma**
      *   *Logic:* The universe aims for rough equilibrium, not exact precision. Accidental flourishing can satisfy the ledger.
      *   *Unseparable Warning:* This is empirically hard to **seperate** from Strict Individualist Karma (Leaf 6) because we can't measure "virtue" precisely enough to know if the lottery *was* exact payment.
  *   **NO** → (Go to Question 6)

  **Question 6:** *Is this ledger a physical law (like gravity) or a story we tell to make sense of chaos?*

  *   **NO (Story)** → **Leaf 7: Metaphorical/Interpretivist Stance**
      *   *Logic:* The "balance" is a human lens, not a cosmic mechanic. It's true psychologically, not ontologically.
  *   **YES (Law)** → **Leaf 6: Strict Individualist Karma**
      *   *Logic:* The ledger is real, individual, exact, and survives memory loss.

  ***

  ### Diagnostics & "Change My Mind" Notes for the Scene

  Here are the talking points for the professor when her friends push back. This keeps the scene dynamic rather than just a lecture.

  **1. The Memory Trap (Question 2)**
  *   **The Challenge:** A friend argues, "If I don't remember hurting you, how can I owe you?"
  *   **The Counter:** "Imagine you drink away a night and crash a car. You remember nothing the next morning. Do you still owe the repair bill?"
  *   **What Changes My Mind:** If we prove that personal *identity* literally ends when memory ends (no soul, no psychological continuity), then the **Strict Individualist** view collapses. You can't punish a person who doesn't exist anymore. That would force everyone into the **Secular Retributivist** leaf.

  **2. The Empty Branch (Leaf 3)**
  *   **The Challenge:** "But what about original sin? Or generational trauma?"
  *   **The Counter:** "Trauma is real, but is it *justice*? If karma is moral accounting, punishing a baby for a grandfather's war crime is just bad math. It's cruelty without a ledger."
  *   **Why it's Empty:** It violates the definition of *desert*. You can have collective *causality* (grandpa's sin hurts grandma), but not collective *desert* without consent.

  **3. The Unseparable Leaves (Leaf 5 vs. Leaf 6)**
  *   **The Issue:** **Loose Balance** vs. **Strict Individualist**.
  *   **Why:** Since we can't see the "virtue meter," we can't tell if a lottery win was an exact match for holiness (Strict) or just a rough bonus (Loose).
  *   **Scene Tip:** Have one friend point out that these two look identical from the outside. The professor should admit this—it's a feature, not a bug. It means the theory is unfalsifiable.

  **4. The Metaphorical Escape (Leaf 7)**
  *   **The Challenge:** "What if the universe doesn't care?"
  *   **The Counter:** "Then karma is just poetry. It's still useful—it encourages good behavior—but it's not *physics*."
  *   **What Changes My Mind:** If we find a mechanism (e.g., quantum consciousness data storage), the **Metaphorical** leaf collapses into **Strict Individualist**. If we prove consciousness is purely biological and ends at death, the whole tree burns except for **Secular Retributivist** and **Agnostic**.

