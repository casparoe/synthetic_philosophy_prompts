answer: |-
  # The Units of Selection Decision Tree

  **Instructions:** Start at the **Root**. Answer each **Node** based on your intuition about the specific case or claim provided. Follow the **Yes/No** or **A/B** branch until you reach a **Leaf**. Do not look at the Leaf names until the end.

  **Root:** We agree we have a population of entities that vary, interact with their environment, and leave different numbers of descendants.

  ---

  ### Node 1: The Meiotic Drive Case
  **Case:** A "selfish" allele spreads through a population by manipulating meiosis, even though males carrying it are half-sterile (reducing the organism's total offspring).
  **Question:** Is the best explanation that the *gene* is a unit of selection acting *against* the organism, or that the *organism* is suffering a pathology with no distinct "gene-level" agency?
  *   **A (Gene Agency):** The gene is actively out-competing the organism; the gene is a distinct unit of selection. → **Go to Node 2**
  *   **B (Organism Pathology):** It is merely a breakdown of the organism's reproductive machinery; only the organism is the true unit. → **Go to Node 3**

  ### Node 2: The Fundamental Level (Genic Path)
  **Question:** If genes can be units of selection in Node 1, are they the *only* fundamental unit, with all higher levels (organisms, groups) being derivative vehicles?
  *   **Yes:** Only genes are replicators; higher levels are just machinery. → **Leaf: Genic Selectionism**
  *   **No:** Genes are one unit, but higher levels can also be real units depending on context. → **Leaf: Pluralist Realism**

  ### Node 3: The Sterile Worker Case
  **Case:** A sterile worker ant dies defending a colony of close kin.
  **Question:** To explain this, must we track the *identity* of specific genes across different bodies (the queen and the worker), or is it sufficient to track the differential survival/output of the *colonies* as wholes?
  *   **A (Gene Identity):** We must track gene identity across bodies (inclusive fitness). → **Go to Node 4**
  *   **B (Group Output):** We can explain it fully by comparing colony survival rates. → **Go to Node 5**

  ### Node 4: The Equivalence Claim (Kin Path)
  **Question:** If a Kin Selection model and a Group Selection model yield identical mathematical predictions for the worker ant, is the choice between them merely pragmatic (bookkeeping), or does one describe the true causal history?
  *   **A (Bookkeeping):** It is just different ways of partitioning the same variance; causality is shared. → **Leaf: Deflationary Pluralism**
  *   **B (Causal):** One model captures the actual mechanism (gene tracking); the other is a heuristic. → **Leaf: Kin Selection / Inclusive Fitness**

  ### Node 5: The Reproduction Requirement (Group Path)
  **[Required Node]** **Question:** For a collection of entities (like a group or colony) to count as a "unit of selection," must the collection itself produce copies of *itself* (parent group → daughter groups), or is it enough that the collection's composition changes due to the aggregate survival of its members?
  *   **A (Aggregate Enough):** Groups don't need to reproduce; they just need to differ in member output. → **Leaf: Multilevel Selection (MLS1 / Trait-Group)**
  *   **B (Must Reproduce):** A unit must have heredity; groups must make daughter groups. → **Go to Node 6**

  ### Node 6: The Hypothetical Colony Case
  **Case:** A colonial species where next season's germline cells are recruited fresh from whichever cell lineage won a competition *inside* the colony. The colony structure persists, but the germline lineage does not cross colony generations. Colonies with less competitive internal cells make more propagules.
  **Question:** Does this colony count as a reproducing individual, even though its germline lineage is reset every cycle?
  *   **A (Yes, Structure):** The colony reconstructs itself; structural heredity is enough. → **Go to Node 7**
  *   **B (No, Lineage):** Without germline continuity across generations, there is no true group heredity. → **Leaf: Darwinian Individuals (Strict)**

  ### Node 7: The Cancer Case
  **Case:** Cancer cells evolve resistance to treatment inside a body, killing the host.
  **Question:** Is this a distinct evolutionary process happening *within* the higher-level individual, or merely a failure of the higher-level individual to maintain its own integrity?
  *   **A (Distinct Process):** It is selection on cell lineages within the organism; the organism is a hierarchy of competing units. → **Go to Node 8**
  *   **B (Integrity Failure):** It is a breakdown of the organism's unit status; the organism is the only relevant individual. → **Leaf: Multilevel Selection (MLS2 / Groups-as-Individuals)**

  ### Node 8: The Major Transitions Claim
  **Question:** When lower-level units (cells) combine to form a higher unit (organism) that suppresses their competition, does this create a *new kind* of evolutionary individual, or is it just very strong group selection?
  *   **A (New Kind):** It is a transition in individuality; the higher level becomes the primary Darwinian unit. → **Leaf: Major Transitions / Hierarchy View**
  *   **B (Strong Selection):** It is still group selection, just with tight bottlenecks and policing. → **Leaf: Multilevel Selection (MLS2 / Groups-as-Individuals)**

  ### Node 9: The Darwinian Capacity Claim
  **Question:** Should we define a "unit of selection" by its *current* role in a specific case (e.g., cancer cells right now), or by its *capacity* to evolve over long periods (lineage potential)?
  *   **A (Current Role):** If it varies and sorts now, it's a unit. → **Leaf: Multilevel Selection (MLS1 / Trait-Group)** *(Returns here if coming from Node 7/8 path)*
  *   **B (Capacity):** It must have the properties to sustain evolution over time. → **Leaf: Darwinian Populations Approach**

  ### Node 10: The Context Dependence Claim
  **Question:** Is the "correct" unit of selection fixed for a species, or does it shift depending on the trait and timescale being analyzed?
  *   **A (Fixed):** There is a true unit for each lineage. → **(Return to previous Leaf consistent with path)**
  *   **B (Shifts):** The unit changes based on the question asked. → **Leaf: Pluralist Realism** *(If not already taken)*

  ---

  ### The Leaves (Positions)

  1.  **Genic Selectionism:** Genes are the only fundamental replicators; all higher-level talk is shorthand.
  2.  **Kin Selection / Inclusive Fitness:** Altruism is explained by gene identity across bodies; causality is distinct from group bookkeeping.
  3.  **Multilevel Selection (MLS1 / Trait-Group):** Groups affect fitness via aggregate member effects but do not reproduce as units.
  4.  **Multilevel Selection (MLS2 / Groups-as-Individuals):** Groups reproduce and have heredity; they are genuine individuals alongside organisms.
  5.  **Major Transitions / Hierarchy View:** Evolution creates new kinds of individuals by suppressing lower-level selection (e.g., cells → organisms).
  6.  **Darwinian Individuals / Populations:** A unit is defined by its capacity to evolve (variation, heredity, fitness) over time, not just immediate sorting.
  7.  **Deflationary Pluralism:** Kin, group, and gene models are mathematically equivalent bookkeeping; causal distinctions are often illusory.
  8.  **Pluralist Realism:** Multiple levels are equally real, and the relevant unit shifts depending on context/trait.

  ---

  ### Analysis of Logical Space

  #### 1. Unoccupied Answer Combinations
  There are several combinations of answers that the tree treats as incoherent or unstable. If your friend lands here, their position likely needs revision.

  *   **The "Genic Deflationist" (Node 2 Yes + Node 4 A):**
      *   *Combination:* Claiming genes are the *only* fundamental unit (Node 2) but also claiming that kin/group models are just equivalent bookkeeping (Node 4).
      *   *Verdict:* **Incoherent.** If genes are the *only* fundamental unit, then kin selection (gene tracking) is the causal truth, and group selection is a misleading heuristic. You cannot be a Genic Monist and a Deflationist simultaneously. One claims a privileged ontology; the other denies privileged ontologies.
  *   **The "Heredity Structuralist" who denies Cancer Selection (Node 6 A + Node 7 B):**
      *   *Combination:* Claiming a colony with *no* germline continuity is a reproducing unit (Node 6), but cancer cells (which *do* have lineage continuity) are not distinct units of selection (Node 7).
      *   *Verdict:* **Unattractive/Inconsistent.** This position values abstract structural reconstruction over actual cell lineage continuity. It is logically possible but biologically unmotivated; usually, those who accept structural heredity at the group level also accept lineage selection at the somatic level.
  *   **The "Fixed Pluralist" (Node 10 A + Leaf 8):**
      *   *Combination:* Insisting the unit is fixed for a species (Node 10) while landing on Pluralist Realism.
