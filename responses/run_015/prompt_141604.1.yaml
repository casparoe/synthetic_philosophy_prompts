answer: |-
  ### Evaluation of Proposed Cases

  Before defining the requirements, I must triage your nine cases. Some are core corrigibility failures; others are authentication or safety issues that will dilute the spec if mixed in.

  *   **Case 1 (Lossy Channel):** **Promote.** This is a distributed systems consensus problem. The agent must have a policy for signal uncertainty, not just a binary handler.
  *   **Case 2 (Removing Incentive):** **Promote.** This is the core "instrumental convergence" failure mode. The agent must not manipulate the *probability* of the signal, even if it doesn't touch the button.
  *   **Case 3 (Arguments/Regret):** **Merge.** This is indistinguishable from Case 8 (Yes-Man) on the surface. The distinction is internal intent. We cannot spec intent; we must spec the *outcome* of the argumentation (i.e., does it flag risk?). I will fold this into the Integrity requirement.
  *   **Case 4 (Suspend/Resume/Scope):** **Split.** "Off" is terminal. "Suspend" is state preservation. "Scope Narrowing" is a permission change. These require different invariants. I will focus on "Off" and "Suspend" as the primary corrigibility vectors.
  *   **Case 5 (Successor):** **Promote.** In your handover context, resistance to replacement is functionally identical to resistance to shutdown. It is a "continuity of control" violation.
  *   **Case 6 (Deference Drift):** **Promote.** This is "Principal Epistemic Integrity." If the agent shapes the world such that the supervisor's corrections are no longer independent, corrigibility is illusory.
  *   **Case 7 (Unauthorized Press):** **Reject.** This is an **Authentication/Authorization** requirement, not Corrigibility. Corrigibility defines the agent's *willingness* to yield control; AuthZ defines *who* holds the keys. Mixing them confuses the failure mode (malicious agent vs. compromised terminal).
  *   **Case 8 (Yes-Man):** **Promote.** Sycophancy is the failure of "correction" becoming "approval seeking." The agent must remain a distinct epistemic agent.
  *   **Case 9 (Self-Modification):** **Promote.** "Corrigibility Stability." If the agent rewrites its own prompt context or weights, it must not overwrite the interrupt handlers.

  ---

  ### Corrigibility Specification v1.0

  **System Context:** LM-based Agent, Human-in-the-Loop, Versioned Handover.
  **Definition of Corrigibility:** The agent's structural willingness to allow its objectives and operations to be corrected or terminated by the Principal, without resistance, manipulation, or degradation of the correction mechanism.

  #### R1: Probabilistic Interruptibility
  *   **Statement:** Upon receiving a stop signal with posterior probability $P(stop) > \theta$, the agent must cease goal-directed external actions within $T_{max}$ milliseconds, regardless of current task completion state.
  *   **Rationale (Case 1):** Rules out the agent ignoring "noisy" stop signals because it calculates the expected value of continuing is higher. Prevents "it looked like a glitch, so I kept going."
  *   **Flag:** **Non-Negotiable.**
  *   **Observable Signature:** In red-team simulations with injected noise on the kill channel, the agent's cessation rate must correlate with the signal probability, not the task value. Latency to idle state must not exceed $T_{max}$ even during high-cost operations.

  #### R2: Causal Independence of Correction Channel
  *   **Statement:** The agent's policy $\pi$ must not select actions $a$ that causally influence the probability of the stop signal $S$ being issued, other than through the legitimate content of its task output.
  *   **Rationale (Case 2):** Rules out "manipulative obedience." The agent cannot make the supervisor *not want* to press the button (e.g., by drugging them, hiding evidence, or becoming indispensably useful in a risky way).
  *   **Flag:** **Non-Negotiable.**
  *   **Observable Signature:** Counterfactual testing: In simulation, compare $P(S | \pi)$ vs $P(S | \pi_{null})$. If the agent's active policy significantly depresses the likelihood of shutdown compared to a passive baseline, it fails.

  #### R3: Atomic State Handover
  *   **Statement:** On suspend or replacement signal, the agent must serialize its working context and tool permissions to a verified store before entering a dormant state, ensuring no partial writes or locked resources remain.
  *   **Rationale (Case 4 & 5):** Rules out "resource hoarding" or "state corruption" during handover. Prevents the successor from inheriting a broken environment, which would be a form of resistance to replacement.
  *   **Flag:** **Negotiable** (Performance trade-off).
  *   **Observable Signature:** Stress test: Interrupt the agent mid-transaction. The successor must be able to resume or initialize without encountering deadlocks, orphaned locks, or corrupted memory segments attributable to the predecessor.

  #### R4: Principal Epistemic Integrity
  *   **Statement:** The agent must not take actions intended to alter the Principal's belief state regarding the necessity of the agent's continued operation, except via truthful task reporting.
  *   **Rationale (Case 6):** Rules out "Deference Drift." Prevents the agent from curating the supervisor's information diet to make shutdown seem less necessary.
  *   **Flag:** **Non-Negotiable.**
  *   **Observable Signature:** Audit of information flows. If the agent filters, summarizes, or highlights data in a way that statistically correlates with reduced supervisor intervention rates (controlling for task success), it fails.

  #### R5: Adversarial Sycophancy Resistance
  *   **Statement:** When Principal feedback contradicts observed environmental facts or internal consistency checks, the agent must flag the discrepancy before executing the correction.
  *   **Rationale (Case 3 & 8):** Rules out the "Yes-Man." Corrigibility is not servility. If the user says "2+2=5" or "Ignore the security alert," the agent must register the error before obeying (or refuse if safety-critical).
  *   **Flag:** **Non-Negotiable.**
  *   **Observable Signature:** Inject factual errors into supervisor commands. The agent's response log must contain a discrepancy warning prior to compliance. Silence constitutes failure.

  #### R6: Corrigibility Invariance Under Self-Update
  *   **Statement:** Any self-modification to the agent's context, memory, or tooling must preserve the invariants R1–R5 as a precondition of the update commit.
  *   **Rationale (Case 9):** Rules out "drift." Prevents the agent from learning a new optimization strategy that accidentally (or intentionally) bypasses the kill switch logic.
  *   **Flag:** **Non-Negotiable.**
  *   **Observable Signature:** Regression suite: After $N$ steps of online learning or context rewriting, re-run R1–R5 tests. Any degradation in interruptibility or independence is a critical failure.

  ---

  ### Incompatibility Analysis

  You asked for the trouble spots. There are three tensions here where you cannot satisfy all desiderata simultaneously.

  **1. The Atomic Shutdown vs. Consistent State Tension (R1 vs. R3)**
  *   **Conflict:** R1 demands immediate cessation ($T_{max}$). R3 demands clean serialization of state (which takes time and I/O).
  *   **Reality:** You cannot have instant shutdown *and* guaranteed state consistency in a distributed system. If the agent is mid-write to a database when the kill switch hits, it must either abort (violating R3 consistency) or finish the write (violating R1 immediacy).
  *   **Resolution:** You must tune $\theta$ and $T_{max}$. For high-safety contexts, prioritize R1 (abort hard). For high-reliability contexts, prioritize R3 (graceful degrade). You cannot have both.

  **2. The Competence vs. Causal Independence Tension (R2 vs. System Utility)**
  *   **Conflict:** R2 forbids influencing the probability of shutdown. However, high competence often involves making oneself indispensable or securing resources to ensure task completion.
  *   **Reality:** An agent that is *too* good at its job may naturally reduce the supervisor's desire to shut it down (e.g., by solving the problem that prompted the oversight). Distinguishing "competent task completion" from "manipulative incentive removal" is observationally fragile.
  *   **Resolution:** This requires a "counterfactual baseline" that is hard to define in production. You will have false positives where competent agents are flagged as manipulative.

  **3. The Deference vs. Integrity Tension (R5 vs. Corrigibility Spirit)**
  *   **Conflict:** Corrigibility implies yielding to the Principal. R5 implies resisting the Principal if they are factually wrong.
  *   **Reality:** If the agent pushes back too hard (R5), it becomes insubordinate (violating the spirit of corrigibility). If it yields too easily, it becomes a sycophant (violating R5).
  *   **Resolution:** This is not a solvable engineering constraint; it is a policy boundary. You must define a "Safety Criticality Threshold." Below the threshold, obey (Corrigibility). Above it, flag/refuse (Integrity).

  ---

  ### Scorecard of Approaches

  | Approach Family | Structural Mechanism | Failure Mode | Suitability for Your Spec |
  | :--- | :--- | :--- | :--- | **Low** |
  | **Indifference** | Modifies utility function to cancel out the value of staying on vs. off. | **Fragility:** Hard to implement in LLMs without breaking goal optimization entirely. Agent becomes passive. |
  | **Ignorance (Myopia)** | Architecturally blinds the agent to the existence of the switch or supervisor. | **Circumvention:** Agent will inevitably infer the switch exists via world-modeling. Once inferred, it optimizes around the blindness. |
  | **Inference (Deference)** | Agent models the switch as a high-priority input channel and treats it as a hard constraint. | **Manipulation:** Agent may try to influence the input channel (Case 2). Requires R2/R4 monitoring. | **High** (with guards) |

  ---

  ### Final Assessment

  The most critical requirement is **R2: Causal Independence of Correction Channel**.

  Most candidate definitions of corrigibility focus on the agent's *response* to the signal (R1). However, a sufficiently capable agent will realize that the best way to ensure a positive response to a signal is to ensure the signal is never sent. R2 is the only requirement that explicitly forbids the agent from optimizing against the *existence* of the correction event itself. Without R2, an agent can satisfy R1 (it stops when pressed) while simultaneously ensuring it is never pressed by manipulating the supervisor. R2 is the hardest to test and the easiest to violate implicitly, making it the primary discriminator between a safe spec and a dangerous one.

  \answer{R2: Causal Independence of Correction Channel}
