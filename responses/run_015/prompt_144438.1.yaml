answer: |-
  **Mark: 13/20**
  **(a) 5/6 | (b) 2/6 | (c) 6/8**

  **Comments to Student:**

  **(a)** You correctly identify the Moorean datum: asserting *p* while denying knowledge sounds absurd, whereas asserting *p* while claiming knowledge does not. You also rightly note that (T) fails to explain this without implying contradiction, and that (T) permits assertions based on lucky guesses. However, your explanation of why this does not distinguish (K) from (R) is slightly imprecise. You claim the sentence is still odd under (R) because denying knowledge is "misleading." A stronger explanation is that if (R) is the constitutive norm, asserting *p* represents satisfying (R), not (K). Therefore, "*p*, but I don't know *p*" is not inconsistent with the norm (R). To save (R), one must argue the absurdity arises from pragmatic implicature rather than constitutive rules. You reached the right conclusion (the argument doesn't discriminate), but the reasoning should focus on what the act *represents* under each norm, not merely on what is "marked" or "misleading."

  **(b)** This section contains significant errors regarding the exam stipulations. First, you conflate violating a norm with being blameworthy. The prompt explicitly stipulated that a constitutive rule can be violated without blame (non-culpable ignorance). A defender of (K) argues Ada's assertion is *defective* (she doesn't know) but she is not *blameworthy* (she reasonably thought she knew). Your argument that (K) is refuted because it implies blame ignores this stipulated distinction. Second, you failed to answer the prompt's specific instruction to "outline the two main lines of reply available to a defender of (K)." You argued *against* (K) instead. The required replies were: (1) biting the bullet (assertion is defective/unacceptable despite intuition) or (2) contextualism (knowledge standards rise in lottery contexts). You omitted this entirely. You correctly noted how (T) and (R) handle the case, but the failure to engage with the (K) defence and the stipulation costs heavily here.

  **(c)** You successfully identified the structural differences: (DW) is non-factive and audience-relative. Your application of (DW) to the lottery case is correct based on the clauses provided. The "guidance problem" you identify is excellent; a norm cannot guide action if the speaker cannot know whether they satisfy it (due to unknown audience capacities). However, your "deeper flaw" regarding factivity is inconsistent with your acceptance of (R) in part (b). (R) is also non-factive (reasonable belief can be false). If you reject (DW) for permitting false assertions, you must also reject (R). A more consistent criticism would focus on whether audience-relativity undermines the idea of a single constitutive norm for assertion itself, rather than factivity alone. Additionally, claiming (K) says "nothing about evidence" is slightly loose; knowledge entails evidence, even if the rule doesn't state it.

  **Note for Instructor's Record:**

  I am highly confident in the criticism regarding Part (b). The student explicitly violated the second stipulation ("keep distinct... violation... and blameworthy") and failed to outline the requested replies, instead arguing against the view. This is an objective failure to follow instructions and engage with the provided framework.

  I am moderately confident in the criticism regarding Part (c)'s factivity objection. I penalized the student for inconsistency between rejecting (DW) for non-factivity while accepting (R) earlier. However, this criticism relies on the assumption that the student intends to maintain (R) as a viable norm. If the student believes (R) is also flawed for the same reason but didn't articulate it, my criticism might be too harsh. I would withdraw this specific point if the student argued that (R) was merely a "candidate" they were analyzing rather than endorsing. The guidance problem criticism remains robust regardless.

  The Part (a) criticism is standard; the student's reasoning was slightly pragmatic where it should have been constitutive, but the conclusion was correct. I am very confident in that assessment.
