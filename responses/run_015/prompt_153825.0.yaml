  **Project Title:** Carving Joints or Making Tools? The Case of Microplastics

  **Project Summary**
  So this idea started when I was helping my roommate organize her bio notes. We got into a huge argument about whether 'microplastic' counts as a real kind. It's basically a grab bag of polymers that share size and harm potential but not chemical structure. That got me thinking about the bigger picture regarding natural kinds and whether sciences actually carve nature at its joints.

  **Research Question**
  Here is the question I want to ask precisely: if a scientific kind groups entities by practical effect rather than shared internal structure, does that mean its not joint-carving, or does it just show that joint-carving is always relative to an explanatory goal?

  **Background & Problem**
  Usually, people get stuck in this essentialist vs. conventionalist stalemate. Essentialists say if there's no shared microstructure, it's not a real kind. Conventionalists say all kinds are just human inventions. But neither side really explains why 'microplastic' works perfectly fine for ecologists tracking harm, even if chemists hate it. The stalemate doesnt resolve the practical success of the category.

  **Methodology**
  For my aproach, I want to compare chemical taxonomy with ecological taxonomy for the same set of objects. I'll look at how chemists classify polymers versus how ecologists classify microplastics in the wild. I'll trace where the categories overlap and where they diverge to see what work each classification is doing.

  **Timeline & Scope**
  Scope wise, 8 weeks is tight but doable. 
  *   Weeks 1-2: Lit review on natural kinds and the microplastic debate.
  *   Weeks 3-5: Gathering case studies on microplastic classification in chem vs. ecology papers.
  *   Weeks 6-7: Analyzing the divergence and testing the "explanatory goal" hypothesis.
  *   Week 8: Writing up the final paper.

  **Expected Outcomes**
  A useful result would look like a framework showing that joint-carving isnt binary. It's relative to the goal. Failure would be getting bogged down in semantics or proving that one side is just wrong. I want to show both are right in their own context. If I end up just restating the stalemate, that counts as a fail.
