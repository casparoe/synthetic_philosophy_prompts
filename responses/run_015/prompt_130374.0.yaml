answer: |-
  The conflict between **mnemonic sovereignty** and **documentary correction** represents a fundamental tension in the philosophy of history and social ontology: the clash between the *truth of correspondence* (what happened according to evidence) and the *truth of coherence* (what must be believed to sustain a community). To evaluate these theses, we must examine them through the lens of **refractive commemoration**. This phenomenon describes instances where a community's ritual and narrative practices do not merely distort a past event through error, but actively bend its causal and moral significance to serve present social bonds. In cases of refractive commemoration, the "error" is not a bug in the system of memory, but a feature of the system of identity; correcting the fact would not simply update the record, but dismantle the social architecture built upon it.

  ### The Thesis of Documentary Correction: Epistemic Fidelity as Normative Imperative

  The thesis of documentary correction posits that historiographical evidence must always supersede communal remembrance when the two diverge. Its normative foundation is epistemic fidelity: the moral obligation to align belief with reality. From this vantage point, history is an external standard against which memory is measured.

  When confronted with **refractive commemoration**, the documentary correctionist must categorize the phenomenon as a **correctable malfunction**. Because the thesis prioritizes the archival record as the sole arbiter of truth, it cannot grant legitimacy to a divergence, regardless of its social utility. If a community remembers a defeat as a victory to foster resilience, the correctionist views this as a falsehood that undermines rational agency. The potential dissolution of an identity-constituting practice is viewed not as a tragedy, but as a necessary cost of intellectual honesty. The social goods sustained by the "erroneous" remembrance are considered fragile or illegitimate because they are founded on a premise that can be falsified.

  Consequently, documentary correction is structurally compelled to treat all historical divergences as epistemic failures. It lacks the conceptual vocabulary to recognize a divergence as a **constitutive element of legitimate communal identity**. To the correctionist, identity built on factual inaccuracy is inherently unstable and ethically suspect, as it requires the ongoing suppression of evidence. The normative stake here is clear: the right to truth outweighs the right to self-definition. However, this risks a form of ontological violence, where the imposition of archival truth shatters the "ontological security" a community derives from its narrative, potentially leading to alienation or social fragmentation without offering a viable replacement for the lost cohesion.

  ### The Thesis of Mnemonic Sovereignty: Normative Authority of the Living

  In contrast, the thesis of mnemonic sovereignty claims that a community's living collective memory holds normative authority over archival records. This does not necessarily deny the existence of the archive, but it subordinates the archive's *authority* to the community's need for continuity. Here, the validity of a memory is judged by its functional role in sustaining the moral and social life of the group, not solely by its correspondence to past events.

  Mnemonic sovereignty is uniquely equipped to accommodate **refractive commemoration** as a **constitutive element of legitimate identity**. It recognizes that the "truth" of a commemorative practice lies in its capacity to bind the community and orient it toward a moral future. If a ritual restructures the causal significance of a past trauma to enable forgiveness or resilience, mnemonic sovereignty argues that this refracted narrative holds a higher normative claim than the cold data of the archive. The divergence is not an epistemic failure but a pragmatic necessity for social survival.

  However, this accommodation invites the charge of **epistemic relativism**. If collective memory holds authority over evidence, does this imply that the past is whatever the community says it is? A sophisticated defense of mnemonic sovereignty might argue that it is not a claim about *ontology* (what happened) but about *normativity* (what guides us). It allows a community to acknowledge the archival record privately while maintaining the refracted memory publicly for the sake of cohesion. Yet, the risk remains that granting sovereignty to memory creates a shield against accountability. If a community refracts a history of perpetration into a history of victimhood to sustain bonds, mnemonic sovereignty could theoretically validate this moral evasion. The normative stake is the preservation of social goods (cohesion, meaning, resilience) at the potential expense of shared reality.

  ### Assessment: Constitutive Divergence vs. Correctable Malfunction

  The prompt asks which thesis can accommodate the possibility that some historical divergences are constitutive rather than malfunctioning.

  **Documentary Correction** fails this test by definition. Its logical structure requires that any divergence between memory and archive be resolved in favor of the archive. It views the "refractive" quality of commemoration as distortion. Therefore, it cannot treat the divergence as legitimate; it must treat it as a lie to be exposed. In doing so, it risks destroying the social goods that erroneous remembrance sustains. If a community's peace treaty relies on a mutually agreed-upon ambiguity about who started a war, documentary correction demands clarity that might reignite conflict. The correctionist prioritizes the *accuracy of the record* over the *viability of the peace*.

  **Mnemonic Sovereignty** succeeds in accommodating constitutive divergence. It provides a framework where the "error" is reclassified as a "mythos" essential for the "ethos." It recognizes that human communities are not merely data-processing units but meaning-making entities. For these entities, the moral significance of an event often matters more than the forensic details. However, this success comes at the price of flirting with epistemic relativism. By granting normative authority to memory, it suggests that truth is subordinate to social utility.

  ### Normative Stakes: Relativism and Social Goods

  Does granting sovereignty to collective memory entail a form of epistemic relativism about the past?
  It entails a **normative relativism**, if not a strict epistemic one. It suggests that the *authority* of the past is relative to the community that holds it. It does not require claiming that the archive is factually wrong, but that it is normatively silent or secondary regarding the community's self-conception. However, if this sovereignty is absolute, it slides into hard relativism where conflicting communal memories of the same event are deemed equally valid, rendering shared history impossible.

  Does strict documentary correction risk destroying the social goods that erroneous remembrance sustains?
  Yes, significantly. Refractive commemoration often sustains goods like resilience, forgiveness, and solidarity. For example, a marginalized group might remember a founding ancestor as more heroic than the archives support to combat historical erasure and foster pride. Documentary correction, by stripping away the heroic accretion, might restore factual balance but also restore the psychological weight of marginalization. The "social good" here is the capacity to act as a unified agent in the present. If that agency depends on the refraction, correcting the refraction disables the agent.

  ### Conclusion

  The thesis of **documentary correction** is epistemically robust but socially brittle. It treats all divergences as correctable malfunctions, prioritizing the integrity of the record over the integrity of the community. It cannot accommodate refractive commemoration as legitimate, viewing it instead as an obstacle to truth.

  The thesis of **mnemonic sovereignty** is socially resilient but epistemically precarious. It accommodates refractive commemoration as a constitutive element of identity, recognizing that the "truth" of a community lies in its lived continuity, not just its archival accuracy. However, it risks legitimizing delusion and insulating communities from the ethical demands of objective reality.

  Ultimately, the choice between them is not merely about how we know the past, but about what we prioritize for the future: the fidelity of the record or the viability of the bond. A purely correctionist approach risks leaving us with accurate maps of dead worlds; a purely sovereign approach risks navigating the living world with fictional maps. The challenge lies in recognizing refractive commemoration not as a simple error to be purged, nor as an absolute law to be obeyed, but as a signal of where the archival record and the living community have ceased to speak the same moral language.
