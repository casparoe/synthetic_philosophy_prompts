answer: |-
  The basement air was thick enough to chew, a cold soup of wet earth and rust. The bust sat on a plywood board atop a steel table, Grandfather's face rising from a collar of grey mud that never quite hardened. He looked tired, even in clay. His eyes were hollows, but the set of the mouth was specific, a tightness my grandmother had caught forty-five years ago and refused to let go of.

  My aunt stood on the other side of the table, wiping her hands on a rag that was already stiff with dried slip. She wasn't supposed to be down here. The will gave me the object "as it stands in the studio." It gave her the bags of dry mix, the buckets of slurry, the sweepings from the floor. She treated the distinction like a loophole waiting to be pried open.

  "You know she put the ashes in," she said. It wasn't a question.

  "I found the note in the ledger," I said.

  "March 12th. Two days before she died. She called me. Said the probate would hang up on the organic material if it was separate. So I brought the urn. She was too weak to mix it, so I did." My aunt tapped the base of the bust. "It's in the clay now. A lock of hair and the bone dust. Kneaded right into the pedestal. So technically, part of the bust is him. And part of the bust is me, because I mixed it."

  "It's still the bust," I said. My voice sounded flat against the damp walls.

  "Is it?" She picked up the black binder. The ledger. "Look at 1994. The big crack in the left shoulder."

  I opened the book. The pages were laminated against the humidity. The entry was precise: *March 14, 1994. Humidity 88%. Structural failure left deltoid. Removed 450g compromised material. Replaced with Batch 94-B.*

  "Keep going," she said.

  I turned pages. 1998. The nose tip chipped. 2003. The armature rusted, requiring the torso to be lifted off the board, cleaned, and reset. 2011. The entire surface skin scraped back due to mold, re-slippered with fresh stock.

  "We agree on the numbers," my aunt said, leaning in. She smelled of bleach and dry dust. "We agree on the dates. We agree that according to Batch 94-B and everything after, eighty-five percent of the mass currently sitting on this board came from the bins I inherited. The sweepings. The offcuts. The spoil."

  "We agree on the weight," I said. "And the dates."

  "So the thing you inherited doesn't exist," she said. "It's gone. It was used up years ago. What's here is my clay, shaped like your grandfather. You inherited a shape. I inherited the substance."

  "I inherited the face," I said.

  "You inherited a description."

  We stood there for a minute, looking at the same grey lump, reading the same numbers. The facts were identical. The humidity log said 85%. The scale said 14.2 kilos. The ledger said most of it was new. But when I looked at the table, I saw Grandfather. When she looked, she saw inventory.

  The conservation work had to happen before the appraiser came. The clay was sweating, pulling away from the internal wire. I had to replace the surface matter. This wasn't about ownership yet; it was about keeping the thing from slumping into a pancake. I mixed a batch of fresh slip, matching the colour as best I could with the oxides she'd left me.

  Using a rib tool, I scraped away the outer millimetre of the cheek. The old clay came away in wet ribbons, smelling of deep time. I applied the new slip, smoothing it with a sponge. It was a skin graft. The underlying structure held, but the texture changed. Where there had been my grandmother's thumbprints from 1979, now there was my smooth sponge marks from today.

  "It's changing," I said.

  "It's rotting," my aunt corrected. "You're putting my clay on top of your clay. It's just layering the dispute."

  "It's keeping him together."

  "It's keeping the evidence fresh."

  Later, we had to move it to the dry room for the assessment. The armature had seized. To lift the bust without snapping the neck, we had to take it apart. This felt different than the skin. This was bone. I unscrewed the central rod from the base. The torso separated from the head. I held the head in my hands; it was hollow, light, just a shell. The body sat on the board, a headless mound of grey.

  For twenty minutes, Grandfather was in pieces. The head sat on a foam block; the torso waited on the steel. If I walked away then, was it two objects? If I swapped the head onto a different body, would it matter? We screwed it back together, the metal threads groaning. The moment the rod clicked home, the tension returned to the room. The object was whole again, but the seam was visible now, a hairline fracture where the neck met the shoulders.

  "The armature is original," I said. "The wire inside. That's hers. That's 1979."

  "Wire isn't clay," my aunt said. "I inherited the clay. The wire is just a hanger. You can't claim a coat rack is the coat."

  "The wire holds the shape. Without it, it's a pile."

  "Without the clay, it's a skeleton. You have a skeleton. I have the flesh."

  The probate hearing was three days away. The bust sat under a plastic sheet, breathing slowly. The dampness was winning. A new crack had opened near the ear, weeping dark water. I knew I should fix it, but I was afraid to touch the ledger again. Every gram I added was an argument for her. Every gram I left alone was an argument for decay.

  My aunt came down one last time before the hearing. She didn't bring tools. She brought a tape measure. She measured the base, the height, the width of the shoulders. She wrote the numbers in a small notebook, not the ledger.

  "If they rule it's one object," she said, "I want compensation for the material usage. Unjust enrichment."

  "If they rule it's your clay," I said, "then you inherited a bust of your father-in-law made from sweepings. Is that what you want? To own a pile of scrap that looks like him?"

  "I want what's mine."

  "You put his ashes in the base," I said. "You mixed him into the spoil. You made him part of the sweepings."

  She stopped writing. She looked at the base, where the grey clay was slightly darker, stained by the organic matter she'd kneaded in herself. She had tried to secure her claim by contaminating the object, by forcing the dead man into the inventory list.

  "You did that," I said. "You made him into clay."

  "I preserved him," she said, but her hand dropped. She looked at the bust, really looked at it, not as a ledger entry but as a face. For a second, the humidity seemed to drop, the air clearing. She saw the violation. She had taken the remains of a man and worked them into the mud of a dispute, grinding bone into dust to weigh on a scale. She hadn't just claimed the material; she had consumed the subject.

  "I'll see you at the hearing," she said. She turned off the light.

  I stayed in the dark with the bust. The plastic sheet rustled as the clay shifted, settling into the board. It was mostly new mud. It was mostly old wire. It was mostly ash now, too. But in the dark, the shape held. The claim that required grinding a man into dirt to prove a point felt heavier than the claim that just let him sit there, cracking, waiting to be seen. I reached out and touched the cold cheek. It was wet. It didn't matter what it was made of. It mattered that it was still looking at me.

  ***

  **Note on the Debate**

  I am moderately confident that I've represented the core tension fairly, specifically the conflict between *continuity of form* (the narrator's position) and *continuity of material* (the aunt's position). In metaphysical debates regarding identity over time, these are the two dominant intuitions: psychological/spatial continuity versus physical constitutive matter. By avoiding the jargon, I tried to show how these abstract positions manifest in grief and greed.

  The thing I am least sure of is the treatment of the **armature**. In the story, the narrator uses the original wire armature as a anchor for identity ("The wire is original... That's 1979"). In real philosophical discussions of constitution, the internal structure often counts as part of the material constitution. By framing the aunt as dismissing the wire as merely a "coat rack," I may have simplified her materialist stance. A strict materialist might argue the wire is part of the "clay object" complex, and since she owns the clay surrounding it, she owns the composite. I smoothed this over to make the "bone vs. flesh" distinction clearer for the narrative, but it arguably weakens the aunt's philosophical consistency.

  Finally, the **ledger framing** absolutely rigs the story toward the aunt's argument initially. By quantifying the changes (grams, dates, batches), the story forces a materialist accounting that makes the narrator's claim feel like sentimentality. However, the introduction of the **ashes** is the counter-weight. It shifts the debate from metaphysics to ethics. The aunt's claim becomes "worse" not because her metaphysics are wrong, but because her acquisition of the material involved a violation of the deceased (kneading ashes into clay without clear authority). This suggests that in inheritance disputes, the moral weight of *how* the object was treated often overrides the technical question of *what* the object is. I leaned into this to satisfy the constraint about one claim feeling worse, but it does shift the ground from ontology to morality.
