      *   *Aggressive discounting?* -> Yes, of specific mechanisms, not necessarily aggregate trends.
      *   *First principles?* -> Yes, deriving from the definition of calibration and the PMI premise.

      *(Self-Correction during drafting)*: Make sure to explicitly address "long feedback loops." This is crucial because it prevents quick Bayesian updating on the ground truth, making the outside view (PMI) the dominant prior for a longer period.

      *(Refining the "Rationalist" angle)*: A rationalist cares about *winning* (accuracy/utility). If believing a theory is literally true leads to calibration errors, the rationalist must discard that belief, even if the theory is useful. This aligns perfectly with PMI.

