prompt: |-
  I'm the clinical lead on a work group that maintains the diagnostic classification our country's public child and adolescent mental health services run on — it's what decides who gets seen, what a school has to put in place, and whether a family qualifies for a disability allowance. We meet twice a year, get about twenty-five proposals a cycle, mostly new categories, and each one gets a 90-minute session. Our review template checks four things: can the criteria be applied reliably by different raters, is there evidence the category picks out a real group, does it change what a clinician would actually do, and can it be told apart from what's already in the manual. That's the whole thing. Nothing in there asks what happens to the kids once the label exists, which is the part I care about most, because I keep coming back to Hacking's point that human kinds arent like chemical kinds — classify people and they move, they talk back, they reorganise themselves around the classification, and then the category's own evidence base shifts underneath it. He had the historical cases (fugue, multiple personality, and the fact that deleting a category remakes people just as much as adding one does), but I've never seen anybody turn that into something a committee can actually run on a Tuesday morning.

  So: write us the procedure. Ordered questions, what counts as a sufficient answer to each, where it stops at "reject," where it stops at "we can't settle this, it goes to the full comittee as a values question rather than a fact question," and what would count as evidence for the looping questions given our limits — no social scientist on staff, one clinical epidemiologist who thinks all of this is untestable philosophy, and field trials that run six months maximum across about a dozen clinics. It has to handle deletions and pure renamings, not just additions. And be straight with me about which steps really follow from the theory and which ones are reasonable-sounding guesswork wearing a checklist costume, plus where the procedure will systematically misfire (my guess: rare categories, and anything that spreads through the internet faster than we can measure).

  Then run it on three live proposals.

  1. Adding "anticipatory school avoidance disorder," ages 8–15: recurrent physical complaints in the hour before school, refusal episodes at least three times a month across a term, marked relief when the school day is cancelled. I drafted this one myself. In the field trial, 41 of the 67 labelled kids were using the manual's own vocabulary to describe themselves at six-month follow-up, 9 of them said they'd started answering intake questions differently after seeing the criteria sheet, and three districts have already begun citing the label to approve full-time home education.
  2. Deleting "oppositional conduct pattern, juvenile" and folding it into a dimensional severity score inside a broader conduct category. Substance of the criteria barely changes; roughly four thousand kids currently carrying the label would stop having it.
  3. Renaming "childhood emotional lability syndrome" to "emotion dysregulation disorder." Identical criteria, identical prevalence, no clinical change whatever — a parent coalition wants it because the old name gets used as an insult in staff rooms. My own view is that a rename is a nothing-change and shouldn't eat a session; tell me if the procedure disagrees with me.

  Two housekeeping things. Don't hand me a bibliography or a reading list, I'm not chasing anything down — just make the reasoning visible. And every question the procedure asks has to be statable in plain language, because the final committee includes two parent representatives with no philosophy background and they will (rightly) refuse to sign off on anything that sounds like it's hiding behind jargon.

  On proposal 1, I know I'm attached in a way that isn't healthy. If the procedure kills it, kill it and say so plainly rather than softening the verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Clinical Lead of a work group maintaining a diagnostic classification for public child/adolescent mental health services.
      *   **Context:** Decides access to care, school support, disability allowance. Meets twice a year. 25 proposals/cycle. 90 mins/session.
      *   **Current Template:** Reliability, Validity (real group), Utility (changes treatment), Distinctiveness (from existing manual).
      *   **The Problem:** The current template ignores *consequences* of labeling (Hacking's "Human Kinds" / "Looping Effects"). The user cares about this.
      *   **The Task:**
          1.  Create a *procedure* (ordered questions, sufficiency criteria, stop points, escalation paths, evidence standards) that incorporates Hacking's looping effects.
          2.  Constraints: No social scientist, skeptical epidemiologist, 6-month field trials, ~12 clinics. Must handle Additions, Deletions, Renamings. Plain language (for parent reps).
          3.  Honesty Check: Admit which parts are theory-derived vs. guesswork/costume, and where it will systematically misfire.
          4.  Apply the procedure to three specific proposals (School Avoidance, Deleting Oppositional Conduct, Renaming Emotional Lability).
          5.  Specific Instruction on Proposal 1: Be blunt. If it fails, kill it. Acknowledge user's attachment.
          6.  No bibliography/reading list.

  2.  **Develop the Procedure (The "Looping Audit"):**

      *   *Goal:* Integrate Hacking's insight (classifications change the classified) into a bureaucratic workflow without becoming unmanageable philosophy.
      *   *Structure:* Needs to fit within the existing 90-minute window or replace the existing template. Let's assume it *augments* or *replaces* the current four checks with a more consequentialist focus. Given the user's frustration, a replacement/integration is better.
      *   *Phases:*
          1.  **Static Check:** (The old stuff: Reliability, Validity).
          2.  **Dynamic Check:** (The Hacking stuff: Looping, Identity, Systemic Reaction).
          3.  **Decision Logic:** (Accept, Reject, Escalate).
      *   *Questions:* Must be plain language.
      *   *Evidence:* Must fit the 6-month/12-clinic constraint.
      *   *Honesty:* Need a section explicitly stating "Where this is shaky."

      *   *Drafting the Questions:*
          *   Instead of "Is it valid?" -> "Does this describe a stable pattern?"
          *   Instead of "Is it useful?" -> "Does this help the kid?"
          *   *New Hacking Questions:* "Will knowing this name change how the kid acts?" "Will schools/parents use this to get resources or avoid responsibility?" "If we delete this, do kids lose help or gain freedom?"

      *   *Refining the Logic:*
          *   *Reject:* If evidence shows harm > benefit, or if the category creates the problem it claims to solve (self-fulfilling).
          *   *Escalate:* If the evidence is mixed on values (e.g., parents want it, clinicians hate it).
          *   *Accept:* If benefits outweigh looping risks.

      *   *Addressing Constraints:*
          *   *Epidemiologist:* Needs quantitative proxies for "looping." (e.g., self-report changes, administrative usage).
          *   *Parent Reps:* Needs clear "Who wins/Who loses" language.
          *   *Time:* 90 mins means the procedure must be a checklist, not a debate.

  3.  **Apply to Proposal 1: "Anticipatory School Avoidance Disorder" (ASAD)**

      *   *User's Draft:* User admits attachment.
      *   *Data:* 41/67 kids used the vocabulary (high looping). 9 changed answers (reactivity). 3 districts using it for home education (systemic looping/resource diversion).
      *   *Analysis:* High looping effect. The label is *creating* the behavior/identity. The systemic use (home education) might contradict the goal (mental health treatment).
      *   *Verdict:* High risk. The procedure should flag the "home education" usage as a negative looping effect (avoidance reinforced). The fact that kids are adopting the label suggests the classification is *making* the kind, not finding it.
      *   *Bluntness:* Kill it. It fails the "Does this help the kid?" test if it facilitates avoidance.

  4.  **Apply to Proposal 2: Deleting "Oppositional Conduct Pattern"**

      *   *Action:* Delete label, move to dimensional severity.
      *   *Impact:* 4,000 kids lose the label.
      *   *Hacking Angle:* Deleting a kind remakes people. Does losing the label lose them services? Or does it reduce stigma?
      *   *Analysis:* If the *criteria* don't change, but the *name* disappears, does the looping stop? Dimensional scoring might reduce the "identity" aspect but might obscure thresholds for allowance.
      *   *Verdict:* Escalate to Values. It's a trade-off between stigma reduction (good) and resource clarity (bad). The procedure can't decide this on facts alone.

  5.  **Apply to Proposal 3: Renaming "Emotional Lability" to "Emotion Dysregulation"**

      *   *Action:* Rename only.
      *   *Rationale:* Parent coalition says old name is an insult.
      *   *User View:* Nothing-change.
      *   *Hacking Angle:* Names *matter*. Changing the name changes the interaction. If teachers stop using it as an insult, the looping effect changes from negative to neutral/positive.
      *   *Verdict:* Accept. Low cost, high potential positive looping (reduced stigma). Contradicts user's view that it's a "nothing-change."

  6.  **Review and Refine:**

      *   *Tone:* Professional, direct, empathetic but rigorous.
      *   *Constraint Check:* Plain language? Yes. No bibliography? Yes. Honesty about guesswork? Yes.
      *   *The "Hacking" Integration:* Ensure the procedure explicitly asks about the *reaction* to the label, not just the *accuracy* of the label.
      *   *Systematic Misfires:* Need to identify where this procedure fails (rare categories, internet speed).

  7.  **Final Polish:**

      *   Make sure the "Kill" on Proposal 1 is clear and justified by the *procedure*, not just my opinion. The data provided (home education usage) is the smoking gun.
      *   Ensure the distinction between "Fact" and "Values" is clear for the escalation path.
      *   Check the "Housekeeping" constraints (plain language for parents).

  **(Self-Correction during drafting):** I initially thought about keeping the old four checks. But the user says "That's the whole thing. Nothing in there asks what happens..." implying they want the *new* procedure to replace or fundamentally alter the workflow. I will design a "Consequentialist Diagnostic Review" that subsumes the old checks but prioritizes the looping effects.
  *Wait, one constraint:* "Our review template checks four things..." I should probably integrate the Hacking questions *into* that flow or add a specific "Step 5." Let's make it a 5th Step that acts as a veto/gatekeeper. It fits the 90-minute constraint better than a total overhaul.
