  # JOINT STATEMENT ON THE METAPHYSICS AND EPISTEMOLOGY OF KNOWLEDGE-HOW
  **Drafted by the Adversarial Collaboration on Skilled Cognition**
  **Date:** October 2023
  **Signatories:** [Representatives of Contemporary Intellectualism] & [Representatives of Neo-Ryleanism]

  ## PREAMBLE
  This document summarizes the outcome of a structured dialogue between proponents of Intellectualism (the view that knowledge-how is a species of knowledge-that) and Anti-Intellectualism (the view that knowledge-how is a distinct, irreducible capacity). Our goal is not consensus on the ontology of skill, but consensus on the boundaries of the dispute, the data requiring explanation, and the conditions under which the debate might be resolved. We affirm that this is a substantive disagreement regarding cognitive architecture, not merely a terminological stipulation.

  ---

  ## 1. SUBSTANTIVE POINTS OF AGREEMENT
  *Both parties affirm the following claims as accurate descriptions of the dialectical landscape and the phenomena to be explained.*

  1.  **The Distinction between Luck and Skill:** Both sides agree that knowledge-how attributions distinguish successful action grounded in competence from successful action grounded in luck or accident. Any adequate theory must explain the modal robustness of skilled performance (i.e., the ability to succeed across relevant counterfactual situations).
  2.  **The Regress Constraint:** Both sides accept that Gilbert Ryle's Regress Argument establishes a genuine constraint on theory construction. A theory of knowledge-how must explain how knowledge guides action without requiring an infinite chain of prior intellectual operations. Intellectualists and Anti-Intellectualists disagree on the *solution* to the regress, not on the fact that it must be solved.
  3.  **Neurological Dissociation as Data:** Both sides accept case studies of amnesic patients (e.g., H.M., Kent Cochrane) as legitimate data points. These cases demonstrate a dissociation between declarative memory (recall of facts/events) and procedural retention (retention of motor skills). Both sides agree this dissociation requires explanation, though they disagree on whether it proves the independence of knowledge-how from knowledge-that.
  4.  **Linguistic Relevance:** Both sides agree that the linguistic behavior of "knows how" constructions (e.g., embedding under interrogatives, cross-linguistic translations) is evidentially relevant to the metaphysical status of knowledge-how, but neither side commits to the claim that linguistics alone is metaphysically decisive.
  5.  **The Role of Propositions in Learning:** Both sides agree that propositional knowledge (instructions, rules, theories) often plays a causal role in the *acquisition* of complex skills. The disagreement concerns whether propositional knowledge is constitutive of the *possession* of the skill once acquired.
  6.  **Unreflective Expertise:** Both sides agree that expert performance often occurs without conscious, occurrent propositional thought (e.g., "flow" states). Intellectualists must explain how latent propositional knowledge guides action without occurrent reflection; Anti-Intellectualists must explain how mere disposition accounts for the flexibility and intentionality of expert adjustment.

  ---

  ## 2. PRECISE POINTS OF DISAGREEMENT
  *The following table isolates the exact loci of contention. Phrasing has been vetted to ensure accuracy to each position.*

  | Locus of Disagreement | The Intellectualist Position (Stanley/Williamson Line) | The Anti-Intellectualist Position (Ryle/Hawley/Noë Line) |
  | :--- | :--- | :--- |
  | **1. Ontological Category** | Knowledge-how is fundamentally a **propositional attitude**. To know how to $\phi$ is to stand in the knowledge relation to a proposition of the form *$w$ is a way to $\phi$*. | Knowledge-how is fundamentally a **complex disposition/capacity**. To know how to $\phi$ is to possess the reliable ability to $\phi$ when one tries, possibly involving multiple sub-dispositions. |
  | **2. The Practical Mode of Presentation (PMOP)** | The regress is blocked because the proposition is grasped under a **practical mode of presentation**. This mode ensures the knowledge is inherently action-guiding without requiring a further act of contemplation. | The PMOP is an ad hoc theoretical posit that **smuggles the capacity back in**. To say a proposition is grasped "practically" is just to say the agent has the capacity; the propositional label adds no explanatory value. |
  | **3. Necessity of Knowledge-That** | Possessing knowledge-how **necessitates** possessing some relevant knowledge-that (even if implicit/non-occurrent). If all propositional knowledge regarding $\phi$ is destroyed, knowledge-how is destroyed. | Possessing knowledge-how **does not necessitate** possessing relevant knowledge-that. One can retain the capacity to $\phi$ even if all propositional access to ways of $\phi$-ing is lost (e.g., in severe amnesia). |
  | **4. Sufficiency of Knowledge-That** | Possessing the relevant knowledge-that (under a PMOP) is **sufficient** for knowledge-how. If one truly knows *$w$ is a way to $\phi$* practically, one counts as knowing how, even if physical impediments prevent execution. | Possessing knowledge-that is **not sufficient** for knowledge-how. One can know all the theory about $\phi$-ing (the "armchair swimmer") without knowing how to $\phi$. The capacity is an additional requirement. |
  | **5. Cognitive Architecture** | The cognitive systems underlying skill are **representational**. The brain stores information about ways to act in a format that is continuous with declarative memory, differing primarily in access conditions. | The cognitive systems underlying skill are **non-representational** (or distinctively procedural). The brain encodes skills in connection weights or sensorimotor loops that do not map onto truth-evaluable content. |

  ---

  ## 3. CRUX LIST: CONDITIONS FOR THEORY CHANGE
  *These are sub-questions where empirical or argumentative resolution would force at least one side to significantly revise or abandon their position.*

  ### Crux A: The "Pure Procedural" Case
  *   **The Question:** Is it possible to have robust, flexible, intentional skill retention in the total absence of any declarative/propositional memory structure?
  *   **The Test:** A refined neurological paradigm involving patients with global declarative amnesia. The task must require **adaptive flexibility** (not just rote repetition). For example, navigating a virtual maze that changes rules daily, requiring hypothesis testing without conscious recall of previous trials.
  *   **Intellectualist Prediction:** If the patient demonstrates adaptive flexibility, they retain *some* form of implicit propositional knowledge (e.g., "this path works"). If all propositional structure is truly gone, flexibility will vanish, leaving only rigid habit.
  *   **Anti-Intellectualist Prediction:** The patient will demonstrate adaptive flexibility driven by sensorimotor feedback loops alone, proving that intentional adjustment does not require propositional representation.
  *   **Resolution Condition:** If adaptive flexibility is proven to exist without *any* representational content (verified via neuroimaging showing exclusive reliance on basal ganglia/cerebellum with hippocampal suppression), Intellectualism regarding *necessity* is falsified.

  ### Crux B: The Linguistic Ambiguity Test
  *   **The Question:** Is the verb "knows" in "knows how" univocal with the verb "knows" in "knows that"?
  *   **The Test:** Cross-linguistic analysis of languages that do not use interrogative embedding for skill (e.g., languages using distinct verbs for "skill" vs. "fact"). Coupled with developmental psychology: Do children distinguish "knowing how" from "knowing that" before they master interrogative syntax?
  *   **Intellectualist Prediction:** Deep grammatical structure will reveal a hidden interrogative component even in languages where surface syntax differs. Children's distinction is pragmatic, not semantic.
  *   **Anti-Intellectualist Prediction:** Languages with distinct verbs reflect a genuine cognitive distinction. Children acquire skill-concepts prior to propositional concepts, indicating distinct cognitive categories.
  *   **Resolution Condition:** If a language is found where "knows how" cannot be paraphrased by any knowledge-of-a-way construction without loss of meaning, and this is mirrored in non-linguistic cognitive tasks, the Linguistic Argument for Intellectualism fails.

  ### Crux C: The AI/LLM "Disembodied Skill" Case
  *   **The Question:** Can a system possess knowledge-how without the capacity for physical execution?
  *   **The Test:** An LLM or robotic system that can perfectly generate instructions, troubleshoot errors, and explain the *theory* of a physical skill (e.g., swimming, surgery) but lacks the physical embodiment to perform it.
  *   **Intellectualist Prediction:** If the system represents the ways to perform the action under a practical mode (functional equivalent), it possesses a form of knowledge-how (perhaps "derivative" or "theoretical," but still propositional knowledge of a way).
  *   **Anti-Intellectualist Prediction:** The system possesses only knowledge-that. Without the embodied disposition to actually perform the action, the attribution of "knowing how" is category mistake.
  *   **Resolution Condition:** If our intuitive attributions of "know-how" to such systems remain robust despite total lack of embodiment, it supports Intellectualism. If we universally reject "know-how" attributions to disembodied systems that master the theory, it supports Anti-Intellectualism.

  ---

  ## 4. ASSESSMENT OF VERBAL DISPUTE STATUS

  **Verdict:** The dispute is **not merely verbal**, but it is **exacerbated by terminological stretching**.

  **Analysis:**
  1.  **Genuine Ontological Stakes:** The disagreement concerns the fundamental architecture of the mind. If Intellectualism is true, cognitive science should look for propositional structures underlying all skilled action. If Anti-Intellectualism is true, cognitive science should look for distinct procedural systems that do not map onto truth-conditional content. This has divergent implications for AI development, rehabilitation medicine, and education.
  2.  **The Terminological Hazard:** The dispute risks becoming verbal if the definition of "proposition" is stretched.
      *   *Risk for Intellectualism:* If "proposition" is expanded to include any information-bearing state (even non-linguistic, non-conscious sensorimotor mappings), Intellectualism becomes trivially true but loses its connection to *knowledge-that* in the ordinary sense.
      *   *Risk for Anti-Intellectualism:* If "capacity" is expanded to include any state that involves representation, Anti-Intellectualism loses its force against the Intellectualist claim that capacities are guided by representations.
  3.  **Resolution Path:** To maintain substantiveness, Intellectualists must clarify the sense in which a "practical mode of presentation" remains propositional (truth-evaluable) rather than merely functional. Anti-Intellectualists must clarify how capacities account for the *normativity* and *flexibility* of skill without appealing to implicit representations.

  **Signed:**
  *The Adversarial Collaboration on Skilled Cognition*
