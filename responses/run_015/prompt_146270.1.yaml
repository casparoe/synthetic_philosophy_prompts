answer: |-
  This is a sharp observation that cuts right to the epistemological core of archival science and public history. You are identifying a tension between **archival logic** (what is kept) and **historiographical logic** (how we explain the past).

  To answer your central question: The bias is not merely bureaucratic inertia; it is rooted in a specific **philosophy of historical causality**, often termed "consequentialism" or "event-based history." However, this philosophy is increasingly inconsistent with modern social theory, including structuralism and microhistory.

  Here is a breakdown of the philosophy buried in that pattern, how it holds up against structural views, and what breaks if you flip the criterion.

  ### 1. The Philosophy of "Consequentialist Agency"
  The funding priority you describe presupposes a specific definition of **agency**. In the traditional elite-archive model, agency is defined as the **capacity to make decisions that alter the trajectory of the state.**

  *   **The Logic:** History is viewed as a chain of causes and effects. To understand the effect (the current state of the nation), you must study the primary causes (treaties, laws, battles, executive orders).
  *   **The Value Judgment:** A document has historical value proportional to its *proximity to a decision point*. A president's memo is "high value" because it initiated a policy. A worker's diary is "low value" because it records the *consequences* of policy, not the initiation of it.
  *   **The Implication:** This strictly presupposes that only people within formal institutions are proper historical agents. Everyone else is "material" to be acted upon, not "actors" who generate history.

  ### 2. Can a Structural View Defend Elite Priorities?
  You asked if a relational or structural view could defend these funding priorities. Theoretically, yes, but only a very specific, top-heavy version of structuralism.

  *   **The Defense:** If one argues that the State is the dominant structure organizing social relations (a Hegelian or Institutionalist view), then preserving the State's records is preserving the "skeleton" of society. If the skeleton doesn't exist, the flesh has no shape. Therefore, funding the presidential library is funding the primary structural constraint on all other lives.
  *   **The Failure:** This defense collapses under a materialist or sociological structural view. If structures are defined by *relationships of production, reproduction, and daily survival* (as in History from Below), then the tenement is more structurally significant than the mansion. The mansion is an outlier of consumption; the tenement is the node of labor reproduction.
  *   **Verdict:** A consistent structural view actually **undermines** the elite funding priority. It suggests that by preserving only the "command center," we are preserving the *ideology* of the structure, not the *mechanics* of it.

  ### 3. The Microhistorical Contradiction
  You asked if this bias is consistent with microhistory's claim that an exceptional ordinary life exposes social structures better than an exceptional elite. **It is fundamentally inconsistent.**

  *   **Elite Epistemology:** Assumes rules are made at the top and flow down. Therefore, study the makers to understand the rules.
  *   **Microhistorical Epistemology:** Assumes rules exist as a social fabric that constrains everyone. Elites often have the power to *bend* or *break* rules (via exceptions, pardons, wealth). Ordinary people must *navigate* them.
  *   **The Conflict:** By underfunding ordinary records, archives are actively destroying the evidence required for microhistory. They are preserving the "exceptions" (elites who broke the norms) and discarding the "norms" (the ordinary lives that reveal the constraints).
  *   **Result:** The archive systematically biases the historical record toward **voluntarism** (the idea that willpower drives history) rather than **determinism** (the idea that structures constrain will).

  ### 4. Flipping the Criterion: Statistical Representativeness
  If you flipped the preservation criterion to **statistical representativeness of lived experience**, several foundational pillars of historical knowledge would break or shift:

  *   **Narrative Collapse:** Traditional history relies on *narrative arc* (beginning, climax, resolution). Elite records provide this naturally (campaigns, terms of office, wars). Representative records (thousands of similar diaries, tax records, lease agreements) produce **data**, not stories. History would shift from a Humanities discipline (storytelling) toward a Social Science (pattern recognition).
  *   **The Death of the "Turning Point":** If value is based on representativeness, "decisive battles" or "signing ceremonies" become less important than "a typical Tuesday in 1850." The concept of historical "change" shifts from sudden events to slow-moving *mentalités* or material conditions.
  *   **The Problem of the "Average":** Who defines the representative sample? If you preserve the "average" working-class life, you risk erasing the marginalized within the marginalized (the criminal, the destitute, the non-conformist). You might swap an Elite Bias for a **Normativity Bias**, preserving the "respectable poor" while losing the radical or the outcast.
  *   **Volume vs. Curation:** Archives would become unmanageable. Elite history is scalable (one president every 4-8 years). Representative history is exponential. This forces a shift from "preserving everything significant" to "sampling strategies," which feels antithetical to the archival mission of permanent memory.

  ### 5. Philosophy or Bureaucratic Inertia?
  It is a feedback loop between the two.

  *   **Philosophical Origin:** The modern archive was born in the 19th century alongside the Nation-State. Its purpose was to legitimize the State by preserving its continuity. The philosophy *created* the bureaucracy.
  *   **Bureaucratic Inertia:** Once established, the bureaucracy becomes self-perpetuating.
      *   **Donor Class:** Elites have the resources to organize, box, and donate their papers with endowments. Working-class families often lack the storage, time, or legal infrastructure to donate diaries.
      *   **Cataloging Logic:** Archivists catalog by "provenance" and "series." It is easy to series "Department of War Correspondence." It is incredibly difficult to series "5,000 unrelated laborer diaries." The bureaucratic tools are built for institutions, not individuals.
      *   **Usage Demand:** Scholars trained in elite history request elite records, justifying the funding to keep them. It is a circular economy of validation.

  ### Summary
  The bias is **philosophical** in origin (History = State Causality) but **bureaucratic** in maintenance.

  It presupposes that **power is the only valid metric of historical significance.** A relational view cannot consistently defend this, because relations require data on both ends of the connection. Microhistory explicitly rejects this, yet relies on archives built to contradict it.

  If you flip the criterion to representativeness, you break the idea of history as a **story of leaders** and replace it with history as a **reconstruction of systems.** The friction you feel is the friction between a 19th-century archival infrastructure and a 21st-century historiographical conscience.
