  *(Self-Correction Note)*: I need to be careful with the term "structural." In Marxism, the base determines the superstructure. In archives, we preserve the superstructure. I should highlight this inversion. Also, emphasize that "representativeness" creates a different kind of history (social science vs. humanities).

