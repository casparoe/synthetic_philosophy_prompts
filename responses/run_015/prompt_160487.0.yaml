prompt: |-
  Hey, I'm taking a decision theory / philosophy of action seminar this term and I've been going back and forth with a couple of people in my study group about something and nobody's convinced anyone, so I wanted an outside read. We did Parfit's hitchhiker a few weeks back — stranded in the desert, driver will take you to town if you promise to pay, once you're in town paying is pure cost so a straightforwardly rational agent wouldn't, the driver foresees that and leaves you there, so it looks like rationality wants you to be the kind of person who'll later do something that will be irrational at the time. Separately we've been doing this broader rational irrationality theme, but most of the examples on that side were about *belief* rather than action: self-deception, motivated reasoning, pumping yourself up into an overconfident forecast because confidence leaks and other people pick up on it, that kind of thing. What I actually want is a careful comparison of the two families of case, not a summary of either: rational irrationality about what you do vs. rational irrationality about what you believe. My friend Priya says they aren't the same phenomenon at all, because the hitchhiker only needs a funny *disposition* and dispositions are the sort of thing you can have without being irrational at any moment, whereas the belief cases require you to be in a state that's irrational the whole time you're in it — I think she's half right but I can't get the half she's wrong about into focus.

  A few things I specifically want pinned down, and please be disciplined about the mapping rather than gesturing at big conclusions. First: lay out what structural feature the two have in common — I take it something like the agent doing better by being less than perfectly responsive to reasons, or by being predictable/unpredictable in the right way — and then say exactly where they come apart. In particular, is the standard move of evaluating rationality at the level of policies or dispositions rather than individual acts equally available in both? It looks to me like there's a real asymmetry, since you can generally decide to φ but you can't just decide to believe that p, and beliefs are supposed to be constitutively responsive to evidence in a way intentions aren't; I want to know whether that asymmetry is the whole difference or whether there's more to it. Second, here's a case I made up to try to collapse the two, and I want it taken apart: the telepathic hitchhiker, where the driver can't read your intentions at all but reads your *beliefs about what you'll do*, and is right maybe 80% of the time. Now getting rescued seems to require genuinely expecting yourself to pay, i.e. a belief you know is probably false. Does this case generate a problem the original doesn't, or does it just reduce to the original with extra steps? Does the answer change if the driver's accuracy drops low enough that cultivating the disposition stops paying? And a related variant I can't settle: the escrow hitchhiker, where you can pay a third party a fee up front to force payment later, but using it is visible to the driver and makes you look like the sort of person who'd need forcing, which lowers your chance of being picked up. Walk through what rationality actually recommends there and whether the availability of commitment devices changes the original verdict.

  Third, and this is the bit I care most about: which family is the harder case, and why? Give me a verdict with the reasoning exposed, including whether one of the two is arguably not a case of rational irrationality at all but something else — a coordination problem, an issue about which level rationality is assessed at, a case where the irrationality is only apparent — and tell me what would have to be true for the harder case to dissolve. If it helps, we also did the toxin puzzle in week three, and if you think that's a third data point that changes the comparison rather than just another instance of the action side, say so and say why. Please don't just tell me who's written about this, I can look that up later; I want the argument.
