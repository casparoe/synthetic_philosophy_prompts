answer: |-
  This is a fertile intersection. Atticus's injunction to "climb inside another person's skin and walk around in it" is indeed a near-perfect vernacular translation of Adam Smith's concept of sympathy as imaginative projection. For Smith, moral judgment arises when we use our imagination to place ourselves in another's situation, modulating our own emotions to match theirs until we achieve a "concord of sentiments." The "impartial spectator" is the internalized mechanism that checks our biases, allowing us to judge ourselves as we imagine a neutral observer would.

  However, your intuition about "asymmetric sympathy" strikes at the fundamental limitation of Smith's framework when applied to a caste system. Smith writes as if the primary barrier to sympathy is a lack of imagination or information. Lee suggests the barrier is often structural power, which renders the spectator mechanism useless regardless of imaginative effort.

  Here is a reading of the novel through that specific philosophical tension.

  ### 1. Atticus and the Broken Spectator
  Atticus Finch attempts to embody the impartial spectator. He consistently suppresses his own anger (what Smith calls "moderating the passions") to maintain propriety and reason. In the courtroom, he appeals to the jury's inner spectator, asking them to look past their social prejudices and view the evidence as a neutral party would. He operates on the Smithian belief that if the facts are presented clearly enough, the impartial spectator within every juror will activate, and justice will follow.

  This is where Lee exposes the gap in Smith's theory. Smith assumes the spectator is universally accessible—that every moral agent has the capacity to step outside themselves. Lee shows that in 1930s Maycomb, the "impartial spectator" is racially coded. The white jurors cannot become impartial because their social survival depends on partiality. To acquit Tom Robinson would be to violate the social contract of white supremacy, risking their own standing in the community.

  Furthermore, Atticus's own sympathy reveals the limits of asymmetric sympathy. He defends Tom vigorously, but does he truly "climb into Tom's skin"? Or does he project a dignified, noble victimhood onto Tom that serves Atticus's own moral self-conception? Smith argues that sympathy requires a mutual adjustment of sentiments; the person suffering must lower their emotion to a level the observer can enter, and the observer must raise their empathy to meet them. Tom Robinson is denied the agency to participate in this exchange. He is not allowed to be a spectator of Atticus or the court; he is merely the object of their scrutiny. Atticus acts *for* Tom, but he cannot act *with* him in the Smithian sense, because the structure prevents Tom from occupying the position of a moral judge. Atticus succeeds as a man of propriety, but the spectator mechanism fails to produce justice because the system does not recognize the defendant as a fellow spectator.

  ### 2. Scout, Boo Radley, and the Safety of Sympathy
  Scout's arc with Boo Radley is the one place where Smith's model works flawlessly, which ironically highlights its failure elsewhere. For most of the novel, Boo is a monster of Scout's imagination. Her moral education culminates on the Radley porch, when she finally internalizes the impartial spectator. She looks at the neighborhood from Boo's perspective and understands his silence and protection.

  Why does this work where the trial fails? Because the social distance between Scout and Boo is navigable. They are of the same race and class. Boo is an eccentric, not an outcast by law. Scout's sympathy for Boo is "safe"; it costs her nothing to extend it. It confirms her moral growth without threatening the social order.

  This contrast dramatizes a crucial critique of Smith: Sympathy flows easily down gradients of power when the structural risk is low. Scout can imagine being Boo because Boo does not threaten her status. She cannot effectively imagine being Tom Robinson because to do so would require her to imagine herself as a Black man in the dock—a position of total vulnerability that her social reality insulates her from. Lee suggests that Smithian sympathy is often a luxury of the privileged. It is a moral exercise that feels like virtue but doesn't necessarily disrupt hierarchy. Scout learns to be a good person, but she does not learn how to dismantle the machine that convicted Tom.

  ### 3. Vulnerability vs. Imaginative Projection
  This leads to your point about social vulnerability. Smith's theory is largely cognitive and internal. It happens in the mind of the observer. You imagine the pain; you moderate your sentiment; you judge. It is a detached process.

  Lee dramatizes sympathy not as a mental act, but as a physical and social risk. Consider the scene at the jailhouse. Scout diffuses the lynch mob not by appealing to their reason (Atticus's method) but by accidentally invoking a personal connection with Mr. Cunningham. She forces him to see Atticus not as an obstacle, but as a neighbor, and herself as a child. She makes the abstract concrete. But notice the danger: Atticus is physically exposed. He is vulnerable.

  Lee suggests that real moral understanding requires more than the internal calibration Smith describes; it requires exposing oneself to the danger of the other. Atticus's "climb into his skin" advice is cognitive, but his actual moral heroism is somatic—he puts his body in front of the door. Smith's impartial spectator is a safe haven; Lee's morality is a battlefield.

  The novel implies that imaginative projection without social vulnerability is impotent. Atticus can imagine Tom's innocence perfectly, but without the power to change the jury's social reality, that imagination is tragic. Smith assumes that if we feel the right sentiments, right action will follow. Lee shows that you can have the right sentiments (the jury likely knows Tom is innocent) and still commit the wrong act because the social cost of sympathy is too high.

  ### 4. Asymmetric Sympathy and the Unresolved Gap
  Your concept of asymmetric sympathy is the key to the novel's tragedy. Smith presumes a symmetry of humanity: I can feel for you, and you can feel for me, and we meet in the middle. In *To Kill a Mockingbird*, the sympathy is entirely one-way. The white characters (Atticus, Scout, Miss Maudie) expend energy trying to understand the Black experience or the outcast experience, but the Black characters are never granted the space to judge the white characters.

  Calpurnia takes the children to her church, and Scout sees a different side of her, but Calpurnia never gets to stand on Scout's porch and judge the Finch family with equal weight. Tom Robinson testifies, but his testimony is weighed against the word of the Ewells, not on its own merit. The "impartial spectator" is a white construct in this novel.

  Lee does not resolve this. The book ends with Scout understanding Boo, which is a personal victory, but Tom is dead, which is a structural defeat. If Lee were merely illustrating Smith, the book would end with the jury acquitting Tom because Atticus successfully activated their spectators. Instead, Lee shows Smith's framework breaking under the weight of history. The impartial spectator cannot exist in a partial world.

  ### Conclusion for the Group
  For your discussion, you might frame it this way: Atticus teaches Scout a Smithian ethics of imagination, which saves her soul (she becomes a moral person), but it cannot save Tom's life (because the system is immoral).

  Smith's theory relies on the idea that we are all fundamentally alike beneath the surface, waiting to be recognized by the spectator. Lee argues that in a hierarchy, the surface *is* the reality. The "skin" Atticus tells Scout to climb into is not just a metaphor for individual experience; it is a political boundary.

  Lee doesn't necessarily refute Smith, but she historicizes him. She shows that the impartial spectator is a fragile flower that cannot bloom in the shade of systemic dehumanization. Sympathy, in the Smithian sense, requires a baseline of equality to function as justice. Without that equality, sympathy becomes merely pity—a feeling the powerful have for the powerless, which changes nothing. The novel suggests that to truly "walk around in another's skin," you must be willing to let them walk around in yours, and in Maycomb, that exchange is forbidden.
