answer: |-
  **Project Title:** The Borrowed First-Person Plural: Fiction and the Constitution of Collective Memory

  **The Question**
  Acknowledgement of a historical wrong requires a speaker capable of saying "we did this" and an addressee entitled to hear it. In many memory cultures, this subject is absent: the state denies it, the populace disputes it, or the polity has fractured. My project asks: **Can the "borrowed first-person plural" of a fictional narrative constitute the collective subject required for historical acknowledgement, or does it function merely as a surrogate that permits the actual political subject to remain absent?**

  This question admits a determinate negative answer. It is possible that fiction provides only the *phenomenology* of acknowledgement—the feeling that a reckoning has occurred—without the *ontology* of the speaker required to make it binding. If the novel creates a "we" that exists only between the covers of the book, it may satisfy the reader's moral demand while relieving the actual polity of the burden of speech. The project seeks to determine whether the fictional "we" is a bridge to political reality or a moral alibi.

  **The Gap in Available Positions**
  Current theoretical frameworks leave this question open because they assume the very subject whose availability is in doubt. Work on collective responsibility and speech acts typically presupposes an agent capable of bearing responsibility. It analyzes the conditions under which an apology is valid, but it takes the existence of the apologizing "we" as a prerequisite rather than a problem to be solved. When the "we" is fractured or denied, these frameworks have little to say about how such a subject might come into being, other than through explicit political declaration.

  Conversely, descriptive studies of memory cultures focus on what societies commemorate, how they ritualize the past, and what narratives dominate the public sphere. These approaches are excellent at mapping the *content* of memory but remain agnostic regarding the *speaker*. They treat the collective subject as a sociological fact to be observed, not a linguistic or ethical achievement to be forged.

  Both approaches miss the specific operation of fiction. Unlike a verdict or a monument, a novel can stage a first-person plural without anyone in the actual world asserting it. Readers routinely accept this staging as a form of acknowledgement; they feel the weight of the confession without requiring a signature. This phenomenon is untheorized. We lack an account of whether this aesthetic uptake counts as a genuine speech act or a simulation that blocks the real one. My project locates the question precisely here: in the gap between the *representation* of acknowledgement and its *performance* within the medium of the novel.

  **Methodology and Comparative Approach**
  This is not a work of comparative history. I do not aim to adjudicate historical claims or archive the specifics of each memory culture. Instead, I treat the four cases—Germany, Japan, Turkey, and the American South—as variations on a single conceptual variable: the availability of the first-person plural.
  *   **Germany:** The "we" is official and self-accusing.
  *   **Japan:** The "we" is disputed; the same sentence oscillates between confession and slander depending on the speaker.
  *   **Turkey:** The state withholds the "we" entirely; it is kept alive only by families and diasporas without power.
  *   **American South:** The "we" is subnational, racialized, and bound to a defeat, while the addressee is largely absent from the remembering polity.

  A single-case study could not isolate this variable. Only by holding the conceptual demand constant (the need for a speaking "we") across four distinct structural conditions can I test the limits of fiction's capacity to forge that subject.

  Furthermore, this inquiry relies on the novelist's method. I will not merely write *about* this problem; I will write *through* it. Drafting scenes becomes a mode of testing whether a collective speaker can be forged on the page. If I cannot construct a scene where a character speaks for a "we" that feels authentic to the reader without collapsing into propaganda or sentimentality, that failure is data. It suggests that the subject cannot be conjured aesthetically where it is politically absent. This is not a hobby; it is a form of practical inquiry where the resistance of the material (the narrative) tests the viability of the concept.

  **Work Plan (Nine Months)**
  The fellowship period will be divided into three phases, balancing conceptual refinement with the drafting of the novel's third section, which embodies these cases.

  *   **Months 1–3: The Available Subject (Germany & Japan).**
      *   *Focus:* Analyzing cases where the "we" is either established or contested.
      *   *Writing:* Drafting scenes where the narrator attempts to inhabit a national "we." Testing whether the prose can sustain the weight of official acknowledgement without irony.
      *   *Output:* Two chapters of the novel; one working paper on the "Official We."
  *   **Months 4–6: The Withheld and Subnational Subject (Turkey & American South).**
      *   *Focus:* Cases where the "we" is denied or fractured.
      *   *Writing:* Drafting scenes where the "we" is spoken by those without authority (the diaspora, the defeated). Testing if the "borrowed we" feels like theft or restitution.
      *   *Output:* Two chapters of the novel; one working paper on the "Borrowed We."
  *   **Months 7–9: Synthesis and Revision.**
      *   *Focus:* Integrating the philosophical findings into the narrative structure.
      *   *Writing:* Revising the drafted sections to sharpen the philosophical stakes. Composing a concluding essay for the fellowship.
      *   *Output:* Finalized novel section; Fellowship Lecture.

  *Exclusions:* I will undertake no archival research, no interviews, and no survey work. I will not attempt to resolve historical disputes regarding the events themselves (e.g., the death tolls or specific treaty terms). My focus is strictly on the *structure of the speaking subject* in relation to those events.
  *Contingency:* If the project runs large, the concluding essay will be cut. The priority remains the novel section, as the fiction is the primary site of the inquiry.

  **Possible Conclusions and Criteria for Failure**
  The project aims to decide between three genuine alternatives:
  1.  **Constitution:** Fiction *can* constitute the collective subject. The "borrowed we" creates a new ethical space that allows the actual polity to step into the acknowledgement later. (Fiction as vanguard).
  2.  **Surrogacy:** Fiction *cannot* constitute the subject. It provides a surrogate that satisfies the audience's desire for closure, thereby reducing the pressure on the actual polity to speak. (Fiction as alibi).
  3.  **Dependence:** Fiction is neutral. Its capacity to acknowledge depends entirely on the external memory culture's readiness to receive it. (Fiction as amplifier).

  *Considerations for Decision:* The decision will rest on the success of the drafting process. If scenes written from the "withheld" positions (Turkey/South) generate a sense of genuine acknowledgement in test readings without political cover, Conclusion 1 gains weight. If they generate discomfort or are dismissed as "just fiction," Conclusion 2 is more likely.

  *Criteria for Failure:* The project fails if:
  *   The four cases turn out to differ only along familiar political axes (e.g., democracy vs. authoritarianism) without illuminating the specific role of the *speaking subject*.
  *   Fiction turns out to be merely one instance of narrative in general, with no specific stakes attached to the novel form itself.
  *   The question dissolves into an empirical survey of what readers happen to believe, rather than a structural analysis of the speech act.

  **Deliverables and Justification**
  **For the Institute:** I will deliver a public lecture titled "The Borrowed First-Person Plural" and a working paper suitable for publication in an interdisciplinary journal. This contributes to the year's theme by offering a conceptual tool for comparing memory cultures that does not rely on state policy alone.

  **For the Book:** I will complete the third section of my novel, which dramatizes these four memory cultures. This section will not illustrate the theory but embody it, allowing the reader to experience the friction of the "borrowed we."

  **For Practitioners:** There is a practical stake for those who commission monuments, curricula, and commemorations. If Conclusion 2 (Surrogacy) holds, then relying on art to do the work of memory is morally dangerous; it may allow states to fund novels instead of reparations. If Conclusion 1 (Constitution) holds, then art is a necessary infrastructure for political repair.

  **Why a Novelist?**
  A philosopher might analyze the logic of the "we" from the outside, but they cannot test its *livability*. A historian might detail the conflicts, but they cannot stage the speech act without claiming truth-value. Only a novelist can construct a "we" that is simultaneously asserted and disavowed, forcing the reader to confront whether they accept it. The committee should fund this project because it uses the specific cognitive capacities of fiction—its ability to hold contradictory truths in suspension—to solve a problem that declarative prose cannot: how to speak for a "we" that does not yet exist.
