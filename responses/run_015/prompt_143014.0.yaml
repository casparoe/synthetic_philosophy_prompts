  **Instructions:** Don't overthink this. Read the root case, follow the arrows, and see where you land. If you get stuck between two leaves, you're probably doing philosophy right. Also, sorry for any typos, I typed this fast.

  ### ROOT CASE
  **Imagine two societies 600 years apart hit the exact same resource collapse. Do they converge on similar institutional responses, or is every crisis totally particular?**

  *   **A. Totally Particular** → Go to **Leaf 1**
  *   **B. They Converge** → Go to **Question 2**

  ---

  ### QUESTION 2 (If Converge)
  **What drives the convergence?**

  *   **A. Human learning/adaptation accumulates over time.** → Go to **Question 3 (Linear)**
  *   **B. Institutional decay and reset forces a repeat.** → Go to **Question 4 (Cyclical)**

  ---

  ### QUESTION 3 (Linear Side)
  **Does history have a finish line?**

  *   **A. Yes, it aims at an endpoint (Freedom, Communism, Heaven).** → **Leaf 2: Teleological Progressivist**
  *   **B. No, it's open-ended improvement without a final state.** → **Leaf 3: Open-Ended Progressivist**

  ---

  ### QUESTION 4 (Cyclical Side)
  **What is actually repeating?**

  *   **A. Structural Repetition:** Same regime-types rotating (Monarchy → Tyranny → etc.). → **Leaf 4: Polybius**
  *   **B. Energetic Repetition:** Same solidarity-force (*asabiyya*), different institutional shell. → **Leaf 5: Ibn Khaldun**
  *   **C. Civilizational Organism:** The cycle lives inside a discrete culture-body. → Go to **Question 5**
  *   **D. Nested/Polyrhythmic:** Short political loops running inside longer economic ones. → **Leaf 8: Unnamed — Polyrhythmic**

  ---

  ### QUESTION 5 (If Organism)
  **Are these cycles universal patterns or discrete lives?**

  *   **A. Universal Patterns** → (This path is mostly empty/awkward).
  *   **B. Discrete Lives** → Go to **Question 6**

  *(Note: We are skipping Universal Patterns to save space, mostly because it hard to seperate from Linear Open-endedness).*

  ---

  ### QUESTION 6 (If Discrete Lives)
  **How does the organism end?**

  *   **A. Inevitable aging/death (like a plant).** → **Leaf 6: Spengler**
  *   **B. Challenge-and-response failure (suicide, not murder).** → **Leaf 7: Toynbee**

  ---

  ### THE LEAVES (Your Diagnosis)

  **Leaf 1: The Historical Particularist**
  *   **Awkward Commitment:** You have to deny all predictive theory despite evidence of patterns, making history useless for planning.

  **Leaf 2: Teleological Progressivist (e.g., Hegel/Marx)**
  *   **Awkward Commitment:** You must explain why the endpoint keeps getting delayed without admitting the theory is wrong.

  **Leaf 3: Open-Ended Progressivist (e.g., Condorcet/Pinker-adjacent)**
  *   **Awkward Commitment:** You must define 'progress' without sounding naive about violence or technology.

  **Leaf 4: Polybius**
  *   **Awkward Commitment:** Assumes human psychology never changes despite massive technological shifts.

  **Leaf 5: Ibn Khaldun**
  *   **Awkward Commitment:** Requires believing 'solidarity' is a measurable physical force that decays like entropy.

  **Leaf 6: Spengler**
  *   **Awkward Commitment:** Cultures die like plants, so politics is just pointless horticulture.

  **Leaf 7: Toynbee**
  *   **Awkward Commitment:** Civilizations commit suicide, but only if they lose their mojo (hard to seperate from Spengler in practice).

  **Leaf 8: Unnamed — Polyrhythmic**
  *   **Awkward Commitment:** Mathematically possible but historically unexplored; risks being incoherent if the cycles contradict each other.

