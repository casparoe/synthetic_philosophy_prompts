answer: |-
  **1. Determination versus discrimination**
  The contrast is unstable because it sidesteps the sceptic's metaphysical demand rather than answering it. The sceptic grants that you behave differently when presented with 'plus' versus 'quus' scenarios; the objection is that no fact *about you* constitutes this difference as a matter of *meaning* rather than mere causal regularity. When you propose "discrimination," you describe a functional capacity. The sceptic will immediately ask: what fact constitutes this capacity as a meaningful discrimination rather than a blind causal reaction? If you reply that no such fact is needed, you have adopted the sceptical solution (meaning is assertibility) while claiming to offer a fact-based view. If you reply that the robust pattern *is* the fact, you are back to the original problem: what makes *that* pattern the meaning of addition? You cannot refuse the demand for determination while insisting you are providing a fact about the speaker. You are either offering a disguised sceptical solution or begging the question.

  **2. Cross-representational robustness**
  This section claims notation-independence rules out gerrymanders, but this is demonstrably false for the core cases. Quus is defined numerically (switch at 57), not notationally. I can define quus in Roman numerals, binary, or base-10; the rule remains identical across representations. Therefore, cross-representational robustness does not distinguish addition from quus. You admit in §4 that "bplus" (switch at astronomical N) is notation-independent. If notation-independence fails to rule out bplus, it fails to rule out quus, since quus is just bplus with a smaller N. §3 promises to filter out gerrymanders via translation constraints, but numerical gerrymanders survive translation untouched. This section is a detour that creates a false sense of security before §4 undermines it.

  **3. The benign residue**
  This manoeuvre is incoherent because it conflates epistemic and metaphysical claims. You state that where practice cannot discriminate, "there is no norm to violate." This is a metaphysical claim: there is no fact of the matter. But you also claim this is "not meaning-scepticism." If there is no fact of the matter about whether I mean addition or bplus, then there is no fact of the matter about what my words mean in those cases. That *is* scepticism about meaning determinacy. You cannot claim the residue is benign because it affects nothing we say (epistemic) while simultaneously denying there is a norm to violate (metaphysical). If it is merely epistemic, the sceptic wins: we don't know what we mean. If it is metaphysical, you concede the sceptic's main point: meaning is not fully determined by facts about us. You are trying to have a realist theory with anti-realist boundaries, which collapses into the sceptical solution you reject.

  **4. Normative asymmetry**
  The asymmetry is circular. To classify a correction as "changing the subject" rather than "correcting me," you must already know what subject I was talking about. If I write '5' for '57+5', you say I am corrected. If I write '5' consistently thereafter, you say I changed the subject to quus. But what facts determine which description applies? You appeal to the "robust pattern." But identifying the pattern requires interpreting my past acts as meaning addition. If I interpret my past acts as meaning quus, the pattern looks different. Robustness does not tell you how to interpret the past; it only describes consistency once interpreted. You need the norm to identify the robustness as relevant, rather than robustness generating the norm. The asymmetry presupposes the very meaning facts it is supposed to ground.

  **5. Recursion and finitude**
  The recursion has no content for a finite agent. You claim rules must be "recursively robust," surviving tests at every level. But you cannot perform an infinite hierarchy of tests. If you mean "would survive," you rely on counterfactuals. Kripke's objection to dispositionalism applies directly here: what fact constitutes the truth of the claim that you *would* survive the next level of perturbation? If there is no fact about your current state that fixes your future responses, there is no fact that fixes your responses under hypothetical perturbations either. You have relocated the finitude objection inside a hierarchy without solving the gap between finite performance and infinite rule. The hierarchy is either impossible to complete (actual tests) or relies on the very counterfactual facts the sceptic denies (hypothetical tests).

  **6. Editorial advice**
  §3 is the weakest section. It makes a strong claim (notation-independence rules out gerrymanders) that is falsified by numerical gerrymanders like quus. Cut it or demote it to a footnote acknowledging that notational gerrymanders are a subset of the problem. §5 should lead the paper. The normativity objection is the heart of the paradox; addressing how robustness constrains correction is your most original move, even if currently circular. Regarding reframing: the paper is more interesting as an error theory. Argue that the demand for a fact that determines infinite use is incoherent, rather than trying to satisfy it partially with robustness. This aligns better with your §1 refusal and §4 residue claims. Stop trying to save realism about meaning facts; argue that the sceptic's demand for such facts is the error.

  **7. Robustness versus dispositionalism**
  This view is not genuinely distinct from a generous dispositionalism. Dispositionalism says you are disposed to answer correctly. Robustness says you are disposed to answer correctly across contexts. This is just a complex disposition. You face the same two objections. First, the error problem: if you are disposed to make mistakes under distraction, robustness filters these as "perturbations." But what fact distinguishes a perturbation from a genuine application of the rule? You need a norm to distinguish them, which brings you back to circularity. Second, the normativity problem: even if we know you are robustly disposed to add, why *ought* you to follow that disposition? Robustness describes what you *will* do under varied conditions, not what you *should* do. Unless you explain why robustness is normative, you have simply added descriptive complexity to a view that fails on normative grounds. Robustness adds nothing to a dispositional base except extra parameters for the sceptic to attack.
