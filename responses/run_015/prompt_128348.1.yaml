  There was no reason to **hesitate**.
  No shadow cast, no secret **sign**.
  I reached across the table with my **hand**.
  I knew exactly what I **could**.
  I had no wish to act **otherwise**.
  The motive and the movement were all **mine**.

  Or so I told myself: it's **mine**.
  But what if I began to **hesitate**?
  What if I tried to move **otherwise**?
  They watch for any flicker, any **sign**.
  They say within that gap I never **could**.
  They wait to take the steering of my **hand**.

  So I held up my open **hand**.
  To prove the thinking part was **mine**.
  To show the future wasn't fixed, I **could**.
  I planned a small attempt to **hesitate**.
  Just enough to trigger off a **sign**.
  Just enough to see if I'd go **otherwise**.

  I tried to step **otherwise**.
  I froze the muscle in my **hand**.
  That pause became the **sign**.
  The wavering was **mine**.
  The instant I began to **hesitate**.
  The silence broke; I knew it **could**.

  Nothing else **could**.
  I didn't go **otherwise**.
  I wasn't able to **hesitate**.
  Something quiet settled in my **hand**.
  The push to finish felt like **mine**.
  Or was it just a biological **sign**?

  I looked around for another **sign**.
  But nothing else **could**.
  The action stayed **mine**.
  I never went **otherwise**.
  I never stayed my **hand**.
  I never got to **hesitate**.

  I read the **sign**, I never went **otherwise**.
  I **could** have, I **could** not—the thought is **mine**.
  I wanted to **hesitate**, I raised my **hand**.
