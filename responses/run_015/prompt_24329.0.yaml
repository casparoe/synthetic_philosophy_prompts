answer: |-
  Here is the translation of the Identity of Indiscernibles (PII) debate into model-theoretic vocabulary, followed by the residue report you requested.

  ### Part I: The Model-Theoretic Translation

  Let the "world" be a first-order structure $\mathcal{M}$ with domain $M$ and language $\mathcal{L}$.

  **1. Leibniz's Principle (PII)**
  In philosophy, PII states: $\forall x \forall y (\forall P (Px \leftrightarrow Py) \rightarrow x = y)$.
  In model theory, "properties" are typically cashed out as formulas in $\mathcal{L}$.
  *   **Weak PII:** Distinct elements realize distinct complete types over the empty set.
      $$ \forall a, b \in M (a \neq b \rightarrow \text{tp}^{\mathcal{M}}(a/\emptyset) \neq \text{tp}^{\mathcal{M}}(b/\emptyset)) $$
      This asserts that for any distinct $a, b$, there is an $\mathcal{L}$-formula $\phi(x)$ such that $\mathcal{M} \models \phi(a) \land \neg \phi(b)$.
  *   **Strong PII:** Every element is definable without parameters.
      $$ \forall a \in M \exists \phi(x) \in \mathcal{L} \text{ s.t. } \{x \in M : \mathcal{M} \models \phi(x)\} = \{a\} $$
      *(Note: In finite structures, Weak and Strong PII coincide. In infinite structures, Strong implies Weak, but Weak does not imply Strong.)*

  **2. The Triviality Worry**
  If $\mathcal{L}$ contains a constant symbol $\underline{a}$ for every $a \in M$, or if we allow parameters from $M$ in our formulas, then the formula $x = \underline{a}$ distinguishes $a$ from any $b \neq a$.
  *   **Translation:** PII is trivially true if we evaluate types over $M$ (i.e., $\text{tp}(a/M)$).
  *   **Resolution:** PII is only substantive if restricted to $\mathcal{L}$-definability without parameters (types over $\emptyset$). The debate over "which properties count" translates to the choice of the language $\mathcal{L}$.

  **3. Max Black's Two Spheres**
  Black describes a universe $\mathcal{U}$ containing exactly two spheres, $a$ and $b$.
  *   **Structure:** $\mathcal{M} = \{a, b\}$.
  *   **Language:** $\mathcal{L}$ contains predicates for material composition, shape, size, and binary relations for distance.
  *   **Symmetry:** For every predicate $R \in \mathcal{L}$, $R(a) \leftrightarrow R(b)$ and $R(a, b) \leftrightarrow R(b, a)$.
  *   **Model-Theoretic Diagnosis:** There exists a non-trivial automorphism $\sigma \in \text{Aut}(\mathcal{M})$ such that $\sigma(a) = b$ and $\sigma(b) = a$.
  *   **Consequence:** $a$ and $b$ have the same type over $\emptyset$. $\text{tp}(a/\emptyset) = \text{tp}(b/\emptyset)$.
  *   **Verdict:** $\mathcal{M} \models \neg \text{PII}$. The structure is not rigid.

  **4. The Standard Replies**
  *   **Restriction to Natural Properties:** This is a constraint on the language $\mathcal{L}$. Let $\mathcal{L}_{nat} \subset \mathcal{L}_{full}$. The defender of PII argues that while $a$ and $b$ are indiscernible in $\mathcal{L}_{nat}$, the *true* language of the world $\mathcal{L}_{fund}$ must be rich enough to distinguish them. Black argues $\mathcal{L}_{nat}$ is all there is.
  *   **Coordinate Systems:** Introducing a coordinate system amounts to expanding the structure $\mathcal{M}$ to $\mathcal{M}'$ by adding constants or a background grid (e.g., adding a point $o$ such that $dist(o, a) \neq dist(o, b)$).
      *   **Black's Objection:** This changes the model. The question is whether PII holds in $\mathcal{M}$, not in an expansion $\mathcal{M}'$.
      *   **Defender's Objection:** $\mathcal{M}$ is not the full physical reality; $\mathcal{M}'$ is.

  ---

  ### Part II: The Residue Report

  Your hypothesis is largely correct: Black's construction is indeed a model with a non-trivial automorphism group, and PII amounts to a claim that the structure of the world is rigid (or at least that all orbits are singletons). However, the mapping is not lossless.

  #### 1. What Translates Cleanly
  *   **Indiscernibility $\leftrightarrow$ Same Type:** The philosophical notion of "sharing all properties" maps precisely to $\text{tp}(a/\emptyset) = \text{tp}(b/\emptyset)$.
  *   **Symmetry $\leftrightarrow$ Automorphism:** Black's symmetry is exactly the existence of $\sigma \in \text{Aut}(\mathcal{M})$ moving $a$ to $b$.
  *   **Triviality $\leftrightarrow$ Parameters:** The worry that "being identical to $a$" is a property maps cleanly to the distinction between definability over $\emptyset$ versus definability over $M$. PII is the claim that $\mathcal{L}$-definability over $\emptyset$ separates points.
  *   **Black's Counterexample:** This is simply the assertion that there exists a physically possible structure $\mathcal{M}$ where $\text{Aut}(\mathcal{M})$ is non-trivial.

  #### 2. What Translates with Distortion
  *   **"Natural" Properties:** In model theory, a language $\mathcal{L}$ is a formal stipulation. In metaphysics, "natural properties" are supposed to carve reality at its joints, independent of our description. Model theory can model the *restriction* to a sub-language, but it cannot model the *metaphysical privilege* of that sub-language. We can define $\mathcal{L}_{nat}$, but model theory cannot tell us why $\mathcal{L}_{nat}$ is "real" and $\mathcal{L}_{full}$ (which includes haecceities) is "artificial."
  *   **Modality:** Black argues his universe is *possible*. Model theory deals with mathematical existence. To translate "possible," you must move from a single structure $\mathcal{M}$ to a class of structures $\mathbb{K}$ (a theory $T$). Black's claim is $\neg \text{PII}$ is consistent with the theory of physics ($T_{phys} \nvdash \text{PII}$). Leibniz claims $\text{PII}$ is necessary ($T_{phys} \vdash \text{PII}$ or $\text{PII}$ is valid in all metaphysically possible structures). Model theory handles consistency and validity well, but the boundary of "metaphysically possible" is external to the math.
  *   **Relations vs. Monadic:** Leibniz originally focused on monadic properties; PII was later extended to relational properties. In model theory, this is just the difference between a language with only unary predicates and one with $n$-ary predicates. Black wins on monadic, but the debate shifts to whether relational properties (like "being 5m from $a$") are intrinsic. Model theory treats all predicates extensionally; it doesn't capture the philosophical resistance to "impure" relations (relations involving specific individuals).

  #### 3. What Has No Expression in Model Theory
  *   **Haecceity (Thisness):** The philosophical notion that an object has a primitive identity independent of its qualitative properties. In model theory, identity is primitive ($=$), but it is not a *property* definable in the language unless parameters are allowed. The metaphysical claim "there is a fact of the matter which sphere is which, even if no formula distinguishes them" is a claim about the semantics (the map between words and world) that exceeds the syntax of $\mathcal{M}$. It corresponds to a preference for a specific naming of the domain elements that the automorphism group renders irrelevant.
  *   **Grounding:** Why does the structure exist? Model theory assumes the structure. Metaphysics asks if the structure supervenes on the properties or vice versa.
  *   **The "Actual" World:** Model theory describes *a* structure. Metaphysics argues about *the* structure. The move from "PII fails in $\mathcal{M}$" to "PII is false" requires the premise "$\mathcal{M}$ represents the actual world." That premise is not model-theoretic.

  ---

  ### Part III: Specific Addresses

  **1. The Triviality Worry**
  In model theory, this is resolved by distinguishing **definability** from **algebraicity** and restricting the parameter set.
  *   If properties = all subsets of $M$ (Second Order), PII is trivially true (singleton sets exist).
  *   If properties = all formulas with parameters from $M$, PII is trivially true ($x=a$).
  *   **Translation:** The substantive debate is strictly about **$\emptyset$-definability**. The "Triviality Worry" is the observation that PII is vacuous in $\mathcal{L}(M)$. The Leibnizian must argue that the "true" language of the world does not contain names for objects (constants) prior to their individuation.

  **2. Logical Truth vs. Contingent Claim**
  *   **Model Theory:** PII is not a theorem of First-Order Logic. There are structures where it holds (rigid structures) and structures where it fails (structures with non-trivial automorphisms).
  *   **Translation:**
      *   **Leibniz:** Claims PII is valid in the class of "Metaphysically Possible Worlds" ($\mathbb{K}_{meta} \models \text{PII}$).
      *   **Black:** Claims PII is not valid in $\mathbb{K}_{meta}$; specifically, there is a model $\mathcal{M} \in \mathbb{K}_{meta}$ where $\text{Aut}(\mathcal{M}) \neq \{id\}$.
      *   **Contingency:** If one argues PII is true of the *actual* world but not necessary, this translates to: $\mathcal{M}_{actual} \models \text{PII}$, but $\exists \mathcal{M}' \in \mathbb{K}_{phys}$ such that $\mathcal{M}' \models \neg \text{PII}$.

  ---

  ### Part IV: Conclusion — Defect or Vagueness?

  Is the residue a defect of your vocabulary or a sign that the philosophical positions were less clear than they looked?

  **It is both, but primarily the latter.**

  1.  **Philosophical Vagueness:** The debate often stalls because "property" is ambiguous. Model theory forces a disambiguation: Do you mean *definable set*, *subset*, or *intensional concept*? Once you force the choice (e.g., "first-order definable without parameters"), the Black counterexample becomes a trivial calculation about automorphism groups. The fact that philosophers argued for centuries without resolving this suggests they lacked the vocabulary to see that Black's move was simply constructing a non-rigid model.
  2.  **Vocabulary Defect:** However, model theory cannot capture the *normative* or *explanatory* force of "natural properties." It can show you that $\mathcal{L}_{nat}$ fails to distinguish $a$ and $b$, but it cannot tell you whether we *ought* to expand $\mathcal{L}$ to distinguish them. The metaphysical residue is the question: **Is the language fixed by the world, or do we choose the language?**
      *   If the world fixes $\mathcal{L}$, PII is an empirical claim about $\mathcal{L}_{world}$.
      *   If we choose $\mathcal{L}$, PII is a methodological constraint (e.g., "Let us only study rigid structures").

  **Final Verdict:**
  Your suspicion is correct. Black's universe is a structure with a non-trivial automorphism group. PII is the claim that the actual structure is rigid (or that the language is rich enough to break all symmetries). The "residue" is not a failure of model theory to capture the logic, but a failure of the philosophical debate to recognize that it was largely a dispute over **language selection** ($\mathcal{L}$) and **modal scope** (which class of structures counts as possible), rather than a deep mystery about identity itself. The "mystery" persists only so long as one refuses to treat the world as a structure $\mathcal{M}$ and properties as $\mathcal{L}$-formulas.
