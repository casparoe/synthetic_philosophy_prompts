answer: |-
  # Q&A Prep Sheet: The White Horse & Sortal-Indexing

  **Strategy:** Your goal is to convince the Analytics that the sortal-index is a *structural necessity*, not an ontological addition, and convince the Sinologists that this structure is *implicit in the text*, not imposed upon it. Do not fight on their turf; bring them to "aspect-shifting."

  ### Pre-emptive Concessions (Say these early to disarm)
  *   **On Terminology:** "I am not claiming Gongsun Long had a symbol for 'sortal-index.' I am claiming the *logical behavior* of the text requires it to be modeled correctly."
  *   **On Ontology:** "The index is not a new *object* in the domain; it is a parameter of the *context of evaluation*. It costs no ontological extra credit."
  *   **On Translation:** "I agree 'White Horse is not Horse' sounds absurd in English. That is precisely why the standard translation fails to capture the predication breakdown I'm identifying."

  ---

  ### The Objections (Ordered by Damage)

  #### 1. The Quinean Ghost (Analytic Metaphysics)
  **The Question:** "You're introducing a 'sortal-index parameter' to your logic. Quine taught us to be wary of multiplying entities. Is this index a new ontological commitment? If not, why can't we just handle this with restricted quantifiers? It looks like you're buying expressive power with ontological bloat."
  **The Reply:** "Great question. To be clear: the sortal-index is not an object *in* the domain, so it doesn't trigger Quinean commitment. It's a parameter of the *assignment function*, like a world index in modal logic. We don't say possible worlds 'exist' in the same way tables do. I need the index because restricted quantifiers ($\forall x \in H$) assume the restriction is stable. In the *White Horse*, the sortal 'Horse' shifts aspect between the subject and predicate positions. Standard restriction can't capture that shift within a single proposition. My parameter tracks the *mode of presentation*, not a new entity."
  **Weakest Point:** You are relying on an analogy to modal logic which some hardline actualists reject.
  **Time:** ~2 mins.

  #### 2. Textual Violence (Sinology Specialist)
  **The Question:** "This feels like forcing a Warring States rhetorical text into a Fregean straightjacket. The *Bai Ma Lun* is about *zhengming* (rectification of names) in a political-ethical context, not a puzzle about predicate logic. Aren't you stripping the text of its historical function to save a logical paradox?"
  **The Reply:** "I'm not stripping the context; I'm trying to explain *why* the text uses this specific logical form to make its political point. The School of Names argued that if predication breaks down, social order breaks down. By showing that 'White Horse' and 'Horse' operate under different sortal-indices (shape+color vs. shape alone), Gongsun Long is demonstrating that careless predication leads to category errors in governance. The logic *is* the political argument. If we treat it as mere ambiguity, we miss the rigor they were aiming for."
  **Weakest Point:** You are assuming the logical rigor was intentional rather than a byproduct of rhetorical style.
  **Time:** ~2 mins.

  #### 3. The "Ad Hoc" Charge (The One You Fear)
  **The Question:** "Be honest: Did you derive the need for a sortal-index from independent logical problems, or did you invent this parameter specifically to make the *White Horse Dialogue* come out true? If it's the latter, isn't this just a 'save the phenomenon' trick?"
  **The Reply:** "That's the crucial test. I didn't start with the text; I started with the problem of *aspect-shift* in natural language predication, which modern logic struggles with (e.g., 'The morning star is the evening star' vs. cognitive significance). The *White Horse* is the stress test. If the sortal-index helps us model Gongsun Long, it also helps us model contemporary problems with sortal-relative identity. The text isn't the bug; it's the feature that exposed the gap in our current logic."
  **Weakest Point:** If pressed, you might not have a ready example of a *modern* English sentence that *requires* this index without sounding forced.
  **Time:** ~2 mins.

  #### 4. Redundancy (Analytic Logic)
  **The Question:** "Why not just treat 'White Horse' as a compound predicate $W(x) \land H(x)$? Then 'A white horse is not a horse' is simply false, and we move on. Why complicate the logic to preserve a falsehood?"
  **The Reply:** "Because Gongsun Long argues it's *true* that a white horse is not a horse. If we just say he's wrong, we stop learning. My argument is that 'is not' here isn't class exclusion; it's sortal-identity failure. $H(x)$ in the subject position is indexed to 'concrete particular,' but $H(x)$ in the predicate is indexed to 'abstract kind.' Standard conjunction collapses that distinction. We need the index to show *why* the inference fails, not just to stamp it 'false.'"
  **Weakest Point:** You are committing to the text's conclusion being "true" in some sense, which is a hard sell.
  **Time:** ~2 mins.

  #### 5. Anachronism (Sinology Specialist)
  **The Question:** "You're using terms like 'predication' and 'reference' that didn't exist in Classical Chinese. The term *fei* (not/is not) covers negation, identity, and class membership. Aren't you projecting a Western distinction onto a concept that didn't distinguish them?"
  **The Reply:** "I agree *fei* is broader. But that breadth is exactly why the paradox works. The text exploits the slippage between identity and class membership. My sortal-index is a tool to map that slippage formally. I'm not saying they had the tool; I'm saying the text *performs* the operation the tool describes. It's like using calculus to describe a bridge built by intuition—the builders didn't know calculus, but the physics holds."
  **Weakest Point:** The analogy might offend the specialists who view the "intuition" as fundamentally non-mathematical.
  **Time:** ~2 mins.

  #### 6. Metaphysical Status (Analytic Metaphysics)
  **The Question:** "If the index isn't an entity, what determines its value? Is it speaker intention? Social convention? If it's contextual, doesn't that just push the problem back to pragmatics without solving the logical issue?"
  **The Reply:** "It's determined by the sortal constraints of the terms themselves, not just speaker whim. 'Horse' carries a biological sortal; 'White' carries a property sortal. When combined, the compound term shifts the reference aspect. It's not purely pragmatic; it's semantic. The logic needs to track that semantic shift, which is currently invisible in standard predicate syntax."
  **Weakest Point:** Distinguishing "semantic" from "pragmatic" here is notoriously difficult.
  **Time:** ~2 mins.

  #### 7. Explanatory Scope (General)
  **The Question:** "Okay, say you fix the *White Horse*. Does this sortal-index parameter actually do work anywhere else, or is this a solution looking for a problem limited to Classical Chinese?"
  **The Reply:** "It applies to any case where sortal-relative identity is contested. Think of Ship of Theseus puzzles or material constitution ('The statue is not the clay'). We usually solve those with temporal parts or constitution relations. A sortal-index offers a cleaner way to say the reference aspect has shifted without multiplying objects. The *White Horse* is just the cleanest historical example of this universal logical friction."
  **Weakest Point:** You need to be prepared to sketch the "Statue/Clay" formalization quickly if challenged.
  **Time:** ~2 mins.

  ---

  ### Emergency Exit (If you get stuck)
  If an objection corners you on the technical logic:
  *"That's a technical refinement I'm happy to work through. The philosophical core I'm defending is that aspect-shifting is real and the text tracks it. The formalism is the vehicle, not the destination."*

  If an objection corners you on the text:
  *"I am offering a rational reconstruction, not a philological translation. My claim is about the logical structure underlying the rhetoric, not the lexicography."*
