  # SPEAKER PREP SHEET: STRAWSON REVISIONISM & THE PROGNOSTIC STANCE

  ## PART 1: HIGH-DAMAGE OBJECTIONS (ORDERED BY THREAT LEVEL)

  ### 1. The Conceptual Collapse (Moral Philosophers)
  **The Objection:** "You are conflating a *modification* of reactive attitudes with a distinct *category*. Strawson explicitly allows for the suspension or modulation of resentment in professional contexts without abandoning the participant stance. By labeling institutional management a 'third stance,' you are solving a problem Strawson already solved: we can withhold emotional reactivity while maintaining moral regard. Your 'prognostic stance' is just the objective attitude wearing a normative mask."

  **The Reply (90s):**
  "Strawson's binary relies on the presence of interpersonal emotional demands. In the prognostic stance, the demand is not interpersonal but systemic: it is a demand for *calibration*, not apology. When an algorithm flags a patient for risk, the institution does not feel resentment, nor does it treat the patient as a mere object to be fixed like a car. It treats them as a source of data requiring normative justification for intervention. This is not a modulated reactive attitude because the phenomenology of 'holding someone responsible' is entirely absent; yet it is not objective because we still argue about the *fairness* of the prediction. Strawson's modification clause preserves the emotional core; the prognostic stance removes the core but keeps the normative structure. That structural gap requires a new category."

  **Weakest Point:** I am asserting that "fairness" arguments prove normativity without proving *moral* normativity. I need to be careful not to conflate procedural justice with moral accountability.

  ### 2. The Metaphysical Irrelevance (Hard Determinist)
  **The Objection:** "You claim this undermines the compatibilist argument by showing determinism leads to prognosis rather than objectification. But this is sociological, not metaphysical. Whether we resent someone or predict their risk, if determinism is true, neither stance is ultimately justified. You have described a change in *social technology*, not a solution to the *freedom* problem. You are offering a softer cage, not an open door."

  **The Reply (90s):**
  "I agree that this does not prove libertarian free will. My target is not the metaphysics of causation, but the *practical dilemma* compatibilists face. The standard worry is that accepting determinism forces us into the objective stance, eroding moral community. I am arguing that modern determinism-compatible practices (prediction) do not erode the community into objectification, but sustain a normative order without libertarian commitments. The 'soft cage' is precisely the point: it shows we can maintain accountability practices under determinism without the emotional costs of resentment or the moral vacuum of objectification. It solves the *social* problem compatibilism cares about, even if it leaves your *metaphysical* problem untouched."

  **Weakest Point:** I am conceding the metaphysical point too readily. If the hard determinist presses that "social solutions" are irrelevant to "truth," I have no comeback other than pragmatism.

  ### 3. The Bureaucracy Mask (Legal Scholars)
  **The Objection:** "You describe algorithmic risk assessment as carrying 'normative weight.' In law, we see this as liability shifting. When an institution adopts a prognostic stance, they are not seeking moral justification; they are minimizing risk and covering their assets. The 'demands for accountability' you describe are actually demands for compliance. Calling this 'normative' dignifies bureaucracy as morality."

  **The Reply (90s):**
  "Compliance and normativity overlap significantly in institutional contexts. When we challenge a risk score, we do not merely check a box; we appeal to principles of equity and accuracy that transcend the specific rule. If it were purely instrumental, a false positive would be a calculation error. In practice, it is treated as a *wrong* done to the subject, warranting restitution or explanation. This language of 'wrongness' indicates a normative layer that exceeds mere efficiency. I am not claiming bureaucracy is moral perfection, but that the *structure* of the interaction demands moral-like justification, distinguishing it from pure causal management."

  **Weakest Point:** I am relying on the *language* of "wrongness" used by critics of algorithms, not necessarily the internal logic of the institutions themselves. The institution may view it as purely instrumental.

  ### 4. The Category Error (Predictive Processing Philosophers)
  **The Objection:** "In predictive processing, 'prediction' is a sub-personal mechanism for error minimization. You are importing this term into a personal-level moral debate. This creates a false analogy. A brain minimizing surprise is not an institution minimizing risk. By using 'prognostic,' you imply a cognitive architecture where there is only social policy. You are reifying a metaphor."

  **The Reply (90s):**
  "I am not claiming institutions have brains. I am using 'prognostic' to highlight the *temporal orientation* of the stance, which aligns with the predictive turn in cognitive science. Both frameworks prioritize future state management over past-state blame. The value of the term is in signaling a shift from 'why did you do this?' (reactive) to 'what will this system produce?' (prognostic). While the mechanisms differ, the structural logic of preemptive regulation is identical. The terminology bridges the gap between how we model minds and how we model systems, which is essential for a joint colloquium like this."

  **Weakest Point:** The analogy is indeed superficial. If they press that "temporal orientation" is insufficient to define a moral stance, I have to retreat to it being merely a label.

  ***

  ## PART 2: THE "HOPE NOBODY ASKS" OBJECTION

  **The Challenge:** "If the prognostic stance lacks emotional phenomenology (resentment/gratitude), what grounds its *normativity*? Normative force in Strawson's framework derives from our emotional investment in relationships. If you strip the emotion to create this 'intermediate' category, you have stripped the engine that makes normativity real. You are left with a description of *power* (managing populations), not *morality* (engaging agents). You haven't found a third stance; you've found a sophisticated form of control masquerading as ethics."

  **Why this is dangerous:** It attacks the core definition. If normativity requires emotional buy-in (as Strawson argues), a "cold" normative stance is an oxymoron. This validates the Legal Scholars' suspicion (it's just power) and the Moral Philosophers' suspicion (it's not a moral stance).

  **Preparation:** Do not deny the lack of emotion. Argue that *shared vulnerability* to the system replaces interpersonal emotion as the source of normativity. We are all subject to the algorithm; that shared subjection creates the normative demand for fairness.

  ***

  ## PART 3: OPENING REMARKS CONCESSIONS

  *Strategic Note: Make these early (within the first 5 minutes) to disarm specific subgroups before they formulate attacks.*

  ### 1. For the Moral Philosophers (Strawson Orthodoxy)
  **Concession:** "I am not claiming Strawson was wrong about the *human* interactions he described. His binary holds for face-to-face interpersonal relationships. My revision applies specifically to *mediated* institutional interactions he could not have anticipated."
  **Why:** Prevents them from spending 20 minutes quoting *Freedom and Resentment* to prove you misread the original text.

  ### 2. For the Predictive Processing Philosophers
  **Concession:** "I acknowledge that 'prediction' in cognitive science is sub-personal and continuous, whereas my 'prognostic stance' is personal-level and discrete. I am borrowing the *logic* of anticipation, not the mechanism."
  **Why:** Stops them from correcting your technical usage of their field's core terminology.

  ### 3. For the Legal Scholars
  **Concession:** "I agree that current algorithmic systems often fail to meet the normative standards I describe. I am describing the *structure of the claim* we make against these systems, not the current *reality* of their deployment."
  **Why:** Prevents them from listing case studies of algorithmic bias to prove your "normativity" doesn't exist in practice.

  ### 4. For the Hard Determinist
  **Concession:** "This framework does not refute causal determinism. It accepts determinism as a premise and asks how we organize accountability within it."
  **Why:** Prevents them from spending the Q&A trying to prove free will doesn't exist, which you already grant.
