answer: |-
  Here is the spec review. I have stripped the philosophy down to engineering constraints.

  ### Part 1: The Requirements List

  To move money based on these inputs, your normalization method must satisfy the following five requirements.

  **1. Global Connectivity (Non-Negotiable)**
  *   **Definition:** The method must produce a comparable score between User A and User B even if they have no social connection and no probe path exists between them.
  *   **Concrete Failure Case:** Your ML probe works inside clusters (e.g., "Marketing Team" vs. "Warehouse Staff"), but never between them. If you rely only on the probe, you cannot decide whether to fund Marketing or Warehouse. You end up with isolated budget silos where one group gets 90% of funds and the other 10% simply because their internal scales drifted apart, with no mechanism to correct the imbalance.
  *   **Why it exists:** To prevent the system from fragmenting into incommensurate fiefdoms.

  **2. Recovery Neutrality (Non-Negotiable)**
  *   **Definition:** The method must not systematically reduce funding for users who psychologically adapt to permanent hardship ("Adapters") compared to those who do not ("Straight-liners").
  *   **Concrete Failure Case:** Ana and Ben both suffer a permanent disability. Ana's self-report drops to 2, then adapts back to 7 over six months. Ben's drops to 2 and stays at 2. If you fund based on current self-report, Ana gets defunded as she heals psychologically, even though her objective constraints (medical bills, mobility aids) remain identical to Ben's. You effectively tax resilience.
  *   **Why it exists:** To prevent the allocator from punishing users for coping mechanisms they cannot control.

  **3. Gaming Resistance (Non-Negotiable)**
  *   **Definition:** The method must not offer a reliable advantage to users who strategically report lower numbers than their actual state.
  *   **Concrete Failure Case:** User research confirms users know Low Score = More Money. If the system treats a self-reported 3 as objectively "worse" than a 5 without verification, users will permanently report 0. The budget blows out, and genuine crises (actual 0s) get diluted by strategic 0s.
  *   **Why it exists:** To prevent budget insolvency and ensure funds reach actual need rather than strategic skill.

  **4. Actionable Explainability (Non-Negotiable)**
  *   **Definition:** For any denied or reduced allocation, the system must generate a one-paragraph justification that references inputs the user recognizes, without revealing proprietary model weights or comparing them negatively to specific other users.
  *   **Concrete Failure Case:** Legal rejects a decision letter that says, "Your utility coefficient was 0.4 standard deviations below the cluster mean." The user sues, claiming discrimination. The explanation must read like, "Your recent reports indicate improvement relative to your baseline, while other constraints remain fixed," rather than mathematical abstraction.
  *   **Why it exists:** To satisfy legal/compliance constraints and maintain user trust.

  **5. Unit Calibration (Nice-to-Have)**
  *   **Definition:** The method should account for the fact that a 1-point change for Ana might represent a different magnitude of suffering than a 1-point change for Ben (aligning "step sizes," not just "zero points").
  *   **Concrete Failure Case:** Ana's scale is compressed (she only uses 4–8); Ben's is expansive (he uses 0–10). A 1-point drop for Ana is a minor annoyance; for Ben, it's a hospitalization. If you treat the points as equal, you underfund Ben.
  *   **Why it exists:** To improve allocation precision. However, this requires expensive data (Swap Interviews) to calibrate.

  ---

  ### Part 2: Trade-offs and Incompatibilities

  **Which subset of requirements cannot all hold together?**
  **{Recovery Neutrality, Gaming Resistance, Low Data Cost}**
  You cannot perfectly distinguish an "Adapter" (who is healing) from a "Gamer" (who is lying) without expensive external data.
  *   **The Conflict:** To achieve **Recovery Neutrality**, you need to look at the *trajectory* of the self-report (it went down, now it's coming up). To achieve **Gaming Resistance**, you generally need to ignore or heavily discount the self-report because it is incentivized.
  *   **The Break:** If you trust the trajectory to save the Adapters, Gamers will mimic that trajectory (report low, then slowly rise) to maximize long-term payout. If you distrust the trajectory to stop Gamers, you punish Adapters. Resolving this requires the expensive "Swap Interview" or "Pair Probe," violating **Low Data Cost**.

  **Which single requirement excludes the most candidate methods?**
  **Global Connectivity.**
  Most simple normalization methods (like z-scoring within groups) work fine locally but fail completely when there is no data path between clusters. Because your probe data is explicitly clustered with no bridges, any method that relies *solely* on the probe data fails this requirement immediately. It forces you to introduce external assumptions or proxies to bridge the gaps.

  ---

  ### Part 3: Candidate Method Evaluation

  | Method | One-Line Evaluation | Requirement That Hurts Most |
  | :--- | :--- | :--- |
  | **(a) No cross-person comparison** | Fails immediately; creates budget silos between clusters with no way to balance equity. | **Global Connectivity** |
  | **(b) Observable proxy (money/QALYs)** | Ignores internal psychological states; will systematically defund Adapters who report high scores despite low proxy scores. | **Recovery Neutrality** |
  | **(c) Veil of ignorance ratings** | Users will rate based on bias/stereotype rather than reality; impossible to explain why "average rater" decided your life is worth less. | **Actionable Explainability** |
  | **(d) Cardinal scale from gambles** | Mathematically robust for units, but the logic is too complex to generate the required legal paragraph. | **Actionable Explainability** |
  | **(e) Coarse bands (fine/struggling)** | Reduces gaming surface, but too blunt to distinguish between an Adapter recovering and a Straight-liner suffering. | **Recovery Neutrality** |

  ---

  ### Part 4: Recommendation on Relaxation

  **Which requirement should you relax first?**
  Relax **Unit Calibration**.

  **Why?**
  You are building a monthly, reversible allocation system with limited money. You do not need perfect precision; you need stability and fairness.
  *   **The Cost:** You will occasionally overfund someone whose "1 point" is a minor inconvenience and underfund someone whose "1 point" is a crisis.
  *   **The Benefit:** You can use the self-reports directly (adjusted for trajectory) without needing to run expensive "Swap Interviews" for thousands of users to calibrate their individual step sizes.
  *   **What Specifically Breaks:** Precision in marginal cases. You will treat Ana's 1-point drop and Ben's 1-point drop as roughly equivalent. This is technically false (per your setup), but it is the only way to satisfy **Global Connectivity** and **Actionable Explainability** without blowing the budget on **Swap Interviews**. Since the decision is reversible next month, gross errors will be caught by the "Pair Probe" or future Swap Interviews over time, allowing you to patch specific outliers without solving the whole theoretical problem upfront.

  **Do not relax Recovery Neutrality.** If you punish Adapters, you create a permanent incentive for users to *not* cope with trauma, which is an ethical and PR disaster you cannot reverse.
  **Do not relax Actionable Explainability.** Legal will block the launch.
  **Do not relax Global Connectivity.** The system ceases to function as a unified allocator.
