prompt: |-
  hey — I need something like a spec review, except the spec is conceptual and I dont have the vocabulary for it. No philosophy background here (I know the words utilitarianism and Rawls and that's about where it ends), so gloss any jargon, and please don't send me to read anyone — I want the requirements, not the literature.

  Setup. I'm on the eng side of a system that splits a shared monthly budget across a few thousand users. Every user files a weekly self-report number, 0 to 10, for how things are going for them. The numbers are on each user's own scale: I have literally no idea whether Ana's 7 is better or worse than Ben's 3, and I suspect in the general case there's no fact of the matter recoverable from the reports alone.

  Two new-ish data sources, which is why this is coming up now:

  - The ML team shipped a "pair probe": we sample pairs of users, ask a third user who knows both well "who's worse off right now", and we get a noisy ordinal label. About 72% agreement with a held-out heuristic. It only works inside tight clusters of users who actually know each other, so there's no probe path between clusters.
  - We can, occasionally and expensively, run a "swap interview": ask one user whether they'd trade their next month for another user's next month, all things considered.

  Two known failure modes in the self-reports:

  - Some users are what user research calls "adapters": after a permanent bad event their number drops and then climbs back to roughly where it was within a few months. Others ("straight-liners"?) never come back up. I don't want the allocator to systematically defund the adapters just because their readout heals.
  - Users know a low number gets them more budget. Some shading is certain.

  I'm also told there's a distinction I should care about between lining up everyone's zero point (levels) versus lining up everyone's step size (units), and that a lot of the arguing happens there. Assume I know nothing about it.

  What I want from you: the requirements list. What does a method for putting these people onto one comparable scale have to get right to be good enough to actually move money with? For each requirement, give me the concrete case or failure it exists to prevent — ideally a case built out of the setup above, not a textbook one. In particular I want you to cover, at minimum: what to do when the probe can't reach across clusters; what an adapter vs a straight-liner does to the comparison; what happens when the very users you most need comparisons for (the adapters) are also the ones the probe is least reliable on; and what the allocator owes a user by way of explanation when it turns them down — our legal folks want a one-paragraph justification a user could read and not feel cheated by, and I don't know whether that's a real constraint on the theory or just a product preference.

  Then:
  - Mark each requirement non-negotiable vs. nice-to-have vs. "that's just one faction's taste".
  - Tell me which subset of requirements can't all hold together. If there's a genuine tradeoff, that's the most useful thing you can give me.
  - Tell me which single requirement excludes the most candidate methods, and why.

  Here are the candidate methods on the table, described the way they'd actually be built — give each one line against the list, plus the one requirement that hurts it most:

  (a) no cross-person comparison at all: only use each user's own ranking over time, pick splits by Pareto-ish improvements and otherwise something like a rotating dictator.
  (b) normalize onto one observable proxy instead of onto reported experience — money-equivalents, or the health-adjusted-life-year style units that health agencies use to rank treatments.
  (c) ask each user to rate other people's lives as if they didn't know whose life it was going to be, and use the average of those ratings as the common scale.
  (d) recover a full cardinal scale per user from the gambles they'll accept, then line the scales up somehow.
  (e) forget fine-grained scores, just sort everyone into a few coarse bands (fine / struggling / in trouble) and treat comparisons as valid only within a band.

  Last bit: given that this is a monthly, mostly reversible decision with real but limited money behind it — not a one-shot constitutional choice — which requirement should I relax first, and what specifically breaks when I do?
