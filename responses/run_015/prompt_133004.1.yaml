answer: |-
  This is a sharp observation. You have identified a tension between *epistemic humility* (we don't know enough to maximize) and *practical necessity* (we must decide), resolved by a specific procedural architecture. As a chemist, you recognize this as an instrumentation problem: when the signal-to-noise ratio drops below a certain threshold, you do not report a value; you report "below detection limit," or you change the assay.

  Medicine has institutionalized this intuition. Policy and charity have not. Let's reconstruct the implicit theory of rational choice that makes the RCT protocol coherent, address your reading group's objection, and then test the "equipoise rule" against long-termist giving.

  ### 1. The "Learning" Objection: Necessary but Insufficient

  Your reading group is half-right. The RCT is indeed an engine for producing knowledge for *future* patients. If it weren't, it would be hard to justify exposing current patients to uncertainty. However, the "learning justification" does not explain the *constraints* you listed. It explains why we run trials, but not why we run them *this way*.

  *   **Why not trial when we know the answer?** If the goal were purely knowledge maximization, we should run trials even when we are 90% sure Treatment A is better. That 10% uncertainty could be resolved, preventing future errors. But ethics forbid this. This implies a **side-constraint**: the welfare of the *current* subject trumps the epistemic benefit to *future* subjects.
  *   **Why randomize instead of picking the best estimate?** If we are in equipoise (say, 51% chance A is better, 49% B), a strict consequentialist maximizing expected value should assign everyone to A. Randomizing 50/50 deliberately sacrifices expected value in the short term. This implies that **under high uncertainty, point estimates are treated as noise, not signal.**
  *   **Why truncate?** Future knowledge would be improved by tracking 20-year effects. Ignoring them reduces the scientific value of the trial. This implies that **measurement validity trumps theoretical completeness.**

  So, the "learning" justification licenses the trial's existence, but it does not license its specific rules. The rules presuppose a theory of decision-making where the *reliability of the measurement* dictates the *permissibility of the optimization*.

  ### 2. Reconstructing the Implicit Theory

  The RCT protocol operates on an **Instrumentalist Theory of Rational Choice**. It does not assume the agent is choosing based on the "true" value of the world, but based on the "resolvable" value given the instrument (the trial design).

  Here are the three pillars of this implicit theory:

  **A. The Signal-to-Noise Threshold (The Equipoise Rule)**
  In your field, if two concentration readings overlap within their error margins, you do not claim one is higher. You claim "no significant difference." The RCT applies this to choice.
  *   *Standard Consequentialism:* Treats the point estimate as the truth, weighted by probability.
  *   *RCT Theory:* Treats the *confidence interval* as the decision space. If the intervals of Option A and Option B overlap significantly, the "difference" is epistemically indistinguishable from instrument noise. To choose A over B is not to maximize; it is to pretend your instrument has higher resolution than it does. Randomization is the admission that the resolution is insufficient to support a directional choice.

  **B. Truncation as Stabilization (The Endpoint Rule)**
  You asked if untracked effects are treated as zero or unusable. The practice treats them as **variance that swamps the signal.**
  In atmospheric chemistry, if you try to model a system 50 years out, the error propagation renders the output meaningless. Including that output in your current calculation doesn't make it "more complete"; it makes the whole calculation unstable (ill-conditioned).
  The RCT protocol assumes that downstream effects (careers, families) are causally real but *epistemically inaccessible* within the trial's budget and timeline. To include them is to introduce noise that obscures the primary signal (e.g., 90-day mortality). Therefore, rational choice requires **causal truncation** to maintain decision stability. It is not that the value is zero; it is that the *expected value of the information* regarding those effects is negative because it corrupts the decision on the measurable effects.

  **C. The Actionability Threshold (The Stopping Rule)**
  Does early stopping presuppose a sharp point where ignorance becomes irrelevant? No. It presupposes a sharp point where **ignorance becomes ethically costly.**
  The threshold (e.g., $p < 0.001$) is not a truth boundary; it is a cost-benefit switch.
  *   *Before the threshold:* The cost of randomization (denying some patients the potentially better treatment) is outweighed by the value of resolving the uncertainty.
  *   *After the threshold:* The probability that the "losing" arm is actually better is so low that continuing to randomize inflicts net harm.
  This is compatible with the worry that long-run error bars don't shrink. The RCT admits it cannot solve long-run uncertainty. It solves *short-run* uncertainty to a level where action is mandated. It creates a local pocket of certainty in a sea of ignorance.

  ### 3. Strict Presuppositions vs. Compatible Theories

  You asked to distinguish what the practice *strictly presupposes* from what merely *fits nicely*. This is crucial because many philosophical frameworks can retrofit an explanation for RCTs without capturing their engine.

  **Strict Presuppositions (The practice breaks without these):**
  1.  **Epistemic Constraints on Optimization:** You are not permitted to maximize on a variable you cannot measure with sufficient precision. (This contradicts standard EV maximization which says "maximize on your best guess, however noisy").
  2.  **Symmetry of Ignorance:** In equipoise, the uncertainty must be symmetric regarding risk. If we knew Arm A had higher variance (risk of catastrophic failure) even if the mean was the same, we would not randomize. The practice presupposes that "uncertainty" means "no known difference in mean or variance."
  3.  **The Unit of Agency is the Protocol:** The individual clinician is not a rational agent during the trial; the Protocol is. The clinician is forbidden from using their own judgment to override randomization. This presupposes that individual judgment is *less reliable* than the chance procedure under conditions of equipoise.

  **Merely Compatible (Fits, but not required):**
  1.  **Utilitarianism:** You can justify RCTs via rights-based deontology (patients are ends, not means) just as well. The *structure* of the trial is about measurement, not just moral status.
  2.  **Frequentist Statistics:** Bayesian adaptive trials exist. The core practice (equipoise, truncation) works with Bayesian updating too, provided the priors are weak enough to sustain equipoise.
  3.  **Risk Neutrality:** The practice actually presupposes a form of risk *aversion* regarding epistemic error. We prefer a known 50/50 coin flip to a guessed 51/49 optimization.

  ### 4. Applying the "Equipoise Rule" to Long-Termism

  Now, let's take your "equipoise rule"—*when the spread of outcome estimates across live options is smaller than your uncertainty about the estimates themselves, don't maximise, defer to a chance procedure*—and apply it to long-termist giving (e.g., existential risk reduction).

  **What would change?**
  Currently, a long-termist might look at two interventions:
  *   *Intervention A:* Estimated 10,000 lives saved (Error: $\pm$ 9,000).
  *   *Intervention B:* Estimated 8,000 lives saved (Error: $\pm$ 2,000).
  Standard EV maximization picks A (10k > 8k).
  The Equipoise Rule notes the intervals overlap significantly ($1k-19k$ vs $6k-10k$). It suggests the "difference" is noise. It would license splitting funding 50/50, or randomizing which projects get grants.

  **Would it collapse into maximizing?**
  It would collapse into maximizing *if* the error bars were treated as probability distributions and integrated. But the Equipoise Rule treats overlapping error bars as a **zone of incommensurability**. It says "we cannot distinguish these." So it would not collapse; it would enforce **diversification**. It acts as a heuristic against "precision bias"—the tendency to trust a high-variance estimate because the point estimate is large.

  **Would it license unacceptable things?**
  Yes, two specific failures:

  1.  **Paralysis in the Face of Catastrophe:**
      In medicine, if the trial stops, patients get the standard of care. The baseline is "treatment exists." In long-termism, the baseline is often "civilization continues."
      If you have Intervention A (mitigate AI risk) and Intervention B (mitigate bio risk), and you are in equipoise, randomizing is fine.
      But if Option C is "Do Nothing," and you are in equipoise between "Act" and "Do Nothing" (because you are uncertain if your action helps), the Equipoise Rule licenses flipping a coin to decide whether to prevent an existential catastrophe.
      *Medicine avoids this because Clinical Equipoise requires *expert community* uncertainty. The community agrees "doing nothing" is worse. Long-termism lacks a consensus "standard of care."*
      **Correction:** To avoid this, the rule must be: *Randomize only among options that clear a minimum threshold of expected non-catastrophe.*

  2.  **The One-Shot Problem:**
      RCTs work because patients are replaceable. If Patient 1 gets the wrong arm, Patient 2 benefits from the knowledge.
      Long-termist decisions (e.g., locking in a global governance structure) are often **non-repeatable**. There is no "Patient 2."
      If you randomize a one-shot decision, you guarantee a 50% chance of sub-optimal outcomes with no opportunity for learning.
      **Correction:** The Equipoise Rule presupposes **repeatability**. Applied to unique events, it must shift from "randomize" to "hedge." Don't flip a coin; do both (if possible) or pick the option with the tighter error bar (robustness over upside).

  ### 5. Summary of the Implicit Theory

  The RCT practice embodies a **Procedural Rationality under Epistemic Constraint**.

  1.  **Validity > Completeness:** It is better to make a decision on a truncated, high-fidelity metric than on a complete, low-fidelity model. (Truncation).
  2.  **Resolution > Point Estimate:** If your instrument cannot resolve the difference between two options, choosing one is an act of superstition, not rationality. (Randomization).
  3.  **Ethical Cost of Ignorance:** Uncertainty is a resource to be consumed, but only until the cost of consuming it (harming patients) exceeds the value of the information. (Early Stopping).

  Your reading group sees the RCT as a sacrifice of the present for the future. You have correctly identified that it is actually a **discipline of the present**. It refuses to pretend to knowledge it does not have.

  If the charity world adopted this, they would stop funding "moonshots" with huge error bars over "boring" interventions with tight error bars, simply because the moonshot's point estimate was higher. They would diversify portfolios where estimates overlap. And they would admit that for many long-term questions, the instrument is not sensitive enough to support a maximization claim, and the rational choice is to admit ignorance rather than to optimize noise.

  That is a theory of rationality that respects the drift in the instrument. It seems you have found a practice that honors the chemist's intuition: *when the error bars overlap, you don't have a result.*
