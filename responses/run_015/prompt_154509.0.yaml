answer: |-
  Here is a Q&A prep sheet tailored for your Bristol meetup. I've ordered these by the amount of damage they could do to your credibility, starting with the one that keeps game theorists awake at night.

  ### Pre-Talk Math Fix (Do this before you stand up)
  **The Issue:** You mentioned the Temptation payoff (5) drops out of your maths. A game theorist *will* spot this in four seconds.
  **Why:** You assumed that if someone *doesn't* mirror you, they defect anyway. But if they are independent, they might cooperate with some baseline probability. If they might cooperate, Defecting becomes way more attractive (because you get the 5 points), which raises the threshold for $m$ significantly.
  **The Fix:** Don't try to re-derive the whole equation live. Instead, add one slide or sentence: *"For this model, I'm making a simplifying assumption: that if our reasoning isn't linked, we default to the Nash Equilibrium (Defect). If you allow for independent cooperators, the threshold for $m$ goes up, but the logic holds."* This disarms the PhD students by showing you know it's a simplification, not a blind spot.

  ---

  ### The Q&A Prep Sheet

  #### 1. The "You've Ignored the Temptation Payoff" Objection
  **Who:** The Game Theory PhD student.
  **The Question:** "You've set the expected value of Defecting to always be 1 (the Punishment payoff). But if the other person isn't mirroring you, they might still cooperate. If there's even a small chance they cooperate independently, Defecting gives you the Temptation payoff of 5. Doesn't that mean your threshold for $m$ is wrong, and cooperation is actually much harder to justify than you say?"
  *(Gloss: You calculated the winnings for cheating as if the other person always punishes you, but sometimes they don't notice, so cheating is more profitable than you admitted.)*
  **Your Reply:** "That's exactly right, and it's the simplifying assumption I should have been clearer about. I assumed that without a 'mirror' link, players default to standard Nash equilibrium (Defect). If you introduce a baseline probability of independent cooperation, yes, the value of Defecting goes up, and you need a higher $m$ to justify Cooperating. The *threshold* moves, but the *mechanism*—that there is a specific similarity point where cooperation flips to defection—remains valid."
  **Weakness:** You are admitting your central equation was a special case, not a general law.
  **Strategy:** **Concede.** Acknowledge it immediately. It shows intellectual honesty. If you try to defend the math as-is, you lose the economists in the room.

  #### 2. The "Functional Decision Theory Already Did This" Objection
  **Who:** The Software Engineer / Rationalist Blogger fan.
  **The Question:** "This looks a lot like Functional Decision Theory (FDT). In FDT, I decide the output of my algorithm, knowing that other similar algorithms will output the same thing. Isn't your 'mirror coefficient' just a fuzzy version of logical correlation? What does your model add that FDT doesn't already solve?"
  *(Gloss: Isn't this just the same thing the rationalist bloggers already figured out, but with less precise terminology?)*
  **Your Reply:** "FDT is the rigorous, formal version; I'm trying to build the 'pub-friendly' intuition pump. FDT asks 'What does my algorithm output?' which can feel abstract. The mirror coefficient asks 'How much do I trust this specific person to think like me?' It's meant to be a heuristic for real life where we don't have access to each other's source code, just vibes and shared background. It's less powerful, but more applicable when you can't see the code."
  **Weakness:** It admits your model is less powerful than the existing theory.
  **Strategy:** **Dig In (on utility).** Stand firm that your version is for *humans*, FDT is for *agents*. You are selling a tool for estimation, not a new logic.

  #### 3. The "Asymmetric Beliefs" Objection (The Secret Fear)
  **Who:** The Sharp Logic Fan (could be anyone).
  **The Question:** "Your model assumes we both agree on what $m$ is. But what if I think we're 90% similar ($m=0.9$), so I Cooperate, but you think we're only 10% similar ($m=0.1$), so you Defect? I get the Sucker's payoff. How does your rule protect me from misjudging how similar you think we are?"
  *(Gloss: What if I think we're twins and you think we're strangers? I lose points by trusting you.)*
  **Your Reply:** "That's the hardest problem, and honestly, where the model breaks down. If our estimates of $m$ don't match, we aren't in a 'mirror' situation anymore; we're in a standard information asymmetry game. The only defence is to communicate—to talk about the game itself. If we can't discuss our estimates of $m$, then yes, high-$m$ players get exploited by low-$m$ players. That's why I argue the 'talk' phase is where the mirror is actually built."
  **Weakness:** This exposes that your rule doesn't work in a one-shot game without communication.
  **Strategy:** **Concede.** This is the "Secret Fear" question. It's the strongest logical objection. Don't bluff. Admit that without shared knowledge of $m$, the safety vanishes.

  #### 4. The "How Do You Measure It?" Objection
  **Who:** The Practical IT Person / Generalist.
  **The Question:** "Okay, but say I'm in a negotiation. How do I actually calculate $m$? Is it a gut feeling? Do I check their LinkedIn? If it's just a guess, isn't this just rationalising whatever I wanted to do anyway?"
  *(Gloss: How do I get the number? If I just guess it, can't I pick any number I like to justify being nice or mean?)*
  **Your Reply:** "It is a guess, but a structured one. I use three proxies: Shared Training (did we learn the same craft?), Shared Incentives (do we both want the same long-term outcome?), and Shared Culture (do we read the same books?). If all three align, $m$ is high. If I'm negotiating with someone from a completely different industry with a one-off contract, $m$ is near zero. It's not a calculation, it's a checklist to stop you from being naively cooperative."
  **Weakness:** It's subjective.
  **Strategy:** **Dig In.** This is your practical contribution. Defend the checklist idea.

  #### 5. The "Is This Just Morality?" Objection
  **Who:** The Moral Philosopher.
  **The Question:** "You're presenting this as 'rationality', but it sounds like you're just smuggling in a moral preference for cooperation. If the maths says Defect (because $m$ is low), but you Cooperate anyway because it feels 'right', aren't you just doing deontology and calling it decision theory?"
  *(Gloss: Are you actually talking about logic, or are you just saying it's nice to be good?)*
  **Your Reply:** "If $m$ is low, my model says Defect. So it's not pure morality. But you're right that there's a normative push here. I'm trying to show that 'being moral' and 'being rational' overlap more than standard game theory admits, provided you can find enough similarity with the other person. It's not morality *instead* of rationality; it's rationality *including* the connection between us."
  **Weakness:** Blurs the line between "is" and "ought".
  **Strategy:** **Split the Difference.** Agree that they overlap, but insist the *threshold* mechanism is purely mathematical.

  #### 6. The "Gaming the Mirror" Objection
  **Who:** The Cynical Engineer.
  **The Question:** "If I know you're using this rule, I have an incentive to pretend I'm similar to you. I'll read your blogs and wear your uniform to raise your estimate of $m$, then I'll Defect. Doesn't this rule just select for sociopaths who are good at mimicry?"
  *(Gloss: Won't liars just pretend to be like you to trick you?)*
  **Your Reply:** "It does create that incentive. But remember, $m$ isn't just about surface traits; it's about reasoning processes. If you mimic my surface traits but your reasoning is 'Defect whenever possible', eventually that will show in your micro-decisions. The defence is to make $m$ about deep structure (how they solve problems), not shallow structure (what they wear). It raises the cost of faking it."
  **Weakness:** Hard to distinguish deep vs shallow structure quickly.
  **Strategy:** **Dig In.** Emphasize that $m$ requires observation of *decisions*, not just *attributes*.

  #### 7. The "Climate Change" Objection
  **Who:** The Friendly Generalist.
  **The Question:** "Can we use this for big stuff? Like, if every country used a mirror coefficient for climate change, would they cooperate?"
  *(Gloss: Does this fix global warming?)*
  **Your Reply:** "Ideally, yes. Nations are 'similar reasoners' in a way strangers aren't—they all have long-term survival incentives. The problem is their estimate of $m$ is low because they don't trust each other's internal reasoning. The lesson here is that transparency—letting other nations see your decision algorithm—raises $m$ and makes cooperation rational. So, yes, more open books leads to more cooperation."
  **Weakness:** Over-simplifies geopolitics.
  **Strategy:** **Concede (with a smile).** "It's a model, not a policy paper, but I'd love to see it tried."

  #### 8. The "Newcomb's Problem" Objection
  **Who:** The Hardcore Rationalist.
  **The Question:** "Does this hold up in Newcomb's Problem? If the Predictor is 99% accurate, is $m$ just 0.99?"
  *(Gloss: Does this work on the classic thought experiment where a psychic predicts your choice?)*
  **Your Reply:** "In Newcomb's, the correlation is nearly perfect, so $m$ is effectively 1. My model collapses into 'One Box' immediately. The mirror coefficient is really designed for the messy middle ground where correlation is uncertain, which is where we actually live."
  **Weakness:** None really.
  **Strategy:** **Dig In.** This is an easy win to show your model covers the basics.

  ---

  ### Logistics & Strategy

  **Which question to take first if three hands go up?**
  Take **Question 1 (The Game Theorist)**.
  *Why?* It's the most technical and potentially damaging. If you answer it well and concede the math point gracefully, you establish credibility. The room will relax. If you dodge it to take an easier question first, the PhD student will interrupt you later, and it will look messy. Get the hard stuff out of the way while you have the floor.

  **The "Secret Fear" Question:**
  You suspected it was about "different estimates" or "incentives to be weird."
  I believe the actual killer is **Question 3 (Asymmetric Beliefs)**.
  *Why?* Your model relies on symmetry ("If I reason like you, you reason like me"). If I think we are similar, but you *don't* think we are similar, your model gives me no guidance on how to handle *your* defection. It breaks the "Mirror" metaphor physically. Be prepared to admit that your model requires a "common knowledge of similarity" to work perfectly.

  **Final Advice for the Talk:**
  You are in a pub in Bristol, not a lecture hall at LSE. The crowd likes you. They want you to succeed. The "IT Procurement" angle is actually a strength—you are the practitioner trying to make sense of the theory, not the theorist pretending to know practice. Lean into that. When you concede points, do it with a "In my day job, we'd call that a risk factor" vibe.

  Good luck. You've got this.
