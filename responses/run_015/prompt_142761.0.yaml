answer: |-
  **Joint Statement on the Science of Cooperation**

  **Preamble**
  Over two days, we subjected our competing accounts of convention to adversarial collaboration using the merged-rooms study as a fair arena. This document records where we stand following that session. We do not claim to have settled the debate, nor do we claim that our models are exhaustive descriptions of human sociality. We claim only that the points of contact and fracture are now explicit enough for empirical test. The following text is a map of our disagreement, not a treaty of peace. We invite the scientific community to judge the predictions herein against the data produced by the replications described.

  **Agreed Claims**
  1. A convention is an arbitrary regularity in behaviour that solves a recurring coordination problem where agents benefit from matching.
  2. An equilibrium, defined as a state where no individual gains by changing strategy alone, persists because agents expect others to conform.
  3. Common knowledge, meaning a fact known by all, known to be known by all, and so on, is cited by the Lewisian as essential for stability.
  4. The Modeller views stability as a function of the basin of attraction, the range of starting conditions that lead to a specific outcome.
  5. Salience, a property making one option stand out as the natural choice, selects which equilibrium is reached when multiple exist.
  6. In the merged-rooms study, conflict arises because two incompatible equilibria collide upon population integration.
  7. Turnover, the replacement of established agents with naive newcomers, tests the resilience of the established convention against noise.
  8. Sticklers, agents who never switch strategies regardless of payoff, act as a fixed minority pressure on the population.
  9. Announcements can shift expectations without changing payoffs, though the mechanism of this shift is disputed.
  10. Both learning dynamics and rational expectation are observable in the data, though their relative weight is contested.

  **Disagreements Table**

  | Question at Issue | Lewisian Position | Modeller Position | Substantive or Verbal? | Depends on Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **What explains convergence speed after an Announcement?** | Common knowledge creates an immediate rational shift in expectations. | Belief updating via social learning takes multiple rounds to propagate. | Substantive | 1 & 2 |
  | **Is Salience a psychological primitive or a dynamic outcome?** | It is a primitive explanatory notion irreducible to dynamics. | It is a shorthand label for a large basin of attraction in the dynamics. | Verbal (underlying variable: predictive power) | 1 |
  | **Do norms require sanctions to persist?** | No, pure coordination machinery suffices for normative force. | Mixed-motive settings require different machinery involving sanctions. | Substantive | 3 |
  | **How do Sticklers affect the population?** | Irrational agents disrupt rational coordination systems. | They mechanically shift the basin of attraction for the competing equilibrium. | Substantive | 4 |

  **Cruxes**

  **1. The Announcement Effect (Replication 2)**
  *Question:* Does a cheap talk announcement produce immediate coordination beyond what belief-updating models predict?
  *Why it matters:* If convergence is instant, it supports the Lewisian view of rationality triggered by common knowledge; if gradual, it supports the Modeller's learning dynamics.
  *Prediction:* The Lewisian predicts >90% match rate in Round 31 (immediately post-merge). The Modeller predicts <50% in Round 31, reaching >90% only by Round 40.
  *Falsification:* The Lewisian is damaged if convergence is gradual. The Modeller is damaged if convergence is instantaneous without prior interaction.

  **2. Salience vs. Basin Size (Theoretical)**
  *Question:* Is salience an explanatory notion in its own right or just a name for whatever makes a basin of attraction large?
  *Why it matters:* If salience predicts outcomes where basin size does not, it is a distinct causal force.
  *Prediction:* The Lewisian predicts salience overrides history in Replication 5 (Articulability). The Modeller predicts articulability only matters insofar as it changes transmission fidelity (learning rate).
  *Falsification:* The Lewisian is damaged if an inarticulable but salient label fails to dominate. The Modeller is damaged if articulability affects choice independent of transmission error rates.

  **3. Mixed-Motive Extension (Modification Required)**
  *Question:* Is the extension from pure coordination to mixed-motive settings a change of degree or a change of subject?
  *Why it matters:* If the Lewisian machinery fails when sanctions are introduced, conventions and norms are distinct kinds.
  *Modification:* Add a penalty for mismatching and a temptation to defect in a new replication.
  *Prediction:* The Lewisian predicts the same coordination machinery explains compliance. The Modeller predicts sanction-based models are required to explain stability.
  *Falsification:* The Lewisian is damaged if coordination collapses without explicit sanctions. The Modeller is damaged if coordination holds without them.

  **4. Turnover Stability (Replication 3)**
  *Question:* Does turnover disrupt common knowledge sufficiently to break convention?
  *Why it matters:* The Lewisian views common knowledge as fragile; the Modeller views equilibria as robust to noise if the basin is large.
  *Prediction:* The Lewisian predicts convention collapse if turnover exceeds 10% per round. The Modeller predicts stability provided the majority retains the strategy.
  *Falsification:* The Lewisian is damaged if the convention survives high turnover. The Modeller is damaged if low turnover triggers a cascade to the alternative label.

  **What I would need to see**

  **The Lewisian**
  I need to see evidence that common knowledge changes behavior instantly or categorically distinct from learning rates. If the data shows that announcements work only because they alter the statistical likelihood of encountering a partner who heard the announcement, my view loses ground. I require a discontinuity in the convergence curve that learning models cannot fit without ad hoc parameters. Specifically, if Round 31 does not show a spike in coordination distinct from Round 30, I must concede that rationality is doing less work than dynamics.

  **The Modeller**
  I need to see evidence that learning dynamics cannot predict the convergence speed without invoking rationality primitives. If the standard replicator equations fail to match the time-to-equilibrium even when calibrated for noise and turnover, I must concede that agents are reasoning rather than merely adapting. Specifically, if the Sticklers in Replication 4 do not shift the population proportion according to their numerical weight but instead trigger an immediate switch, my dynamic account is insufficient. I require proof that the basin of attraction is not the whole story.
