answer: |-
  # Session Design: The Allais Paradox and Event Partitioning

  **Course:** Rational Choice (First-Year Seminar)
  **Time:** 50 Minutes
  **Students:** 24 (Philosophy/PPE)
  **Budget:** £20
  **Constraint:** No cash payments to students.

  ## 1. The Incentive Scheme (Making Choices Bite)
  Since you cannot offer cash, you must create *incentive compatibility* using the budget. The goal is to make the difference between the "Sure Thing" and the "Gamble" feel tangible.

  *   **The Prize Pool (£20):** Purchase one £20 Amazon/Book Voucher (representing the "£5 Million" prize) and a box of high-quality chocolates (e.g., Hotel Chocolat, approx. £15-20 total, representing the "£1 Million" prize).
  *   **The Mechanism:**
      1.  Tell students: "At the end of class, I will draw one student's name at random. I will then roll a die to select *one* of the four choices you made today."
      2.  "If your selected choice yielded '£5M', you win the Voucher. If it yielded '£1M', you win the Chocolate. If '£0', you win nothing."
      3.  **Why this works:** It makes the choice *consequential* for every student (ex-ante) while respecting the budget (ex-post). It maps the abstract millions to tangible goods with a clear preference ordering (Voucher > Chocolate > Nothing).

  ## 2. Materials Required
  *   **Choice Sheets (25 copies):** Two distinct halves, labelled Round 1 and Round 2. (Print double-sided or as separate slips).
  *   **Coloured Stickers or Highlighters:** To mark the "common consequence" columns in Round 2.
  *   **Collection Box:** For anonymous submission.
  *   **The Prizes:** Voucher and Chocolate visible on the desk.
  *   **Dice:** One D10 (for probability resolution if the winner is picked) and one D24 (for student selection).

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Instructor Script/Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Incentives** | "Welcome. Today is experimental. We are testing how you choose under risk. On the desk are a voucher and chocolate. One of you will win one of these based on *one* of the choices you make today. Name on the sheet, please, for the draw, but choices are anonymous." |
  | **05-15** | **Round 1 (Standard)** | Hand out sheets. "Read Pair 1. Circle A or B. Read Pair 2. Circle A or B. Do not discuss." Collect sheets immediately into the box. |
  | **15-20** | **The Pivot** | "Keep your pens down. I am going to hand you a second sheet. It describes the *exact same* chances and prizes. But I have laid them out differently. I want you to look at the structure." |
  | **20-30** | **Round 2 (Partitioned)** | Hand out Round 2. "Notice the columns. Some are coloured. Choose again. Be honest; if you are picked, this is what you play with." Collect sheets. |
  | **30-35** | **Tally & Reveal** | Quickly tally the board (4 numbers: R1-Pair1, R1-Pair2, R2-Pair1, R2-Pair2). Draw the pattern on the board. |
  | **35-50** | **Debrief** | Connect the pattern to the Independence Axiom. Discuss the three diagnoses. |

  ## 4. The Choice Sheets (Wording)

  **Round 1: The Standard Presentation**
  *Instructions: For each pair, circle the option you prefer. One of these choices may determine your prize.*

  **Pair 1**
  *   **Option A:** £1 Million for sure.
  *   **Option B:** 10% chance of £5 Million, 89% chance of £1 Million, 1% chance of Nothing.

  **Pair 2**
  *   **Option A:** 11% chance of £1 Million, 89% chance of Nothing.
  *   **Option B:** 10% chance of £5 Million, 90% chance of Nothing.

  ***

  **Round 2: The Partitioned Presentation**
  *Instructions: The prizes and probabilities are identical to Round 1. The events are now split into four distinct columns. Note the shaded columns.*

  **Pair 1**
  | Event Prob. | **10%** | **1%** | **44%** (Shaded) | **45%** (Shaded) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Option A** | £1 Million | £1 Million | **£1 Million** | **£1 Million** |
  | **Option B** | £5 Million | Nothing | **£1 Million** | **£1 Million** |

  **Pair 2**
  | Event Prob. | **10%** | **1%** | **44%** (Shaded) | **45%** (Shaded) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Option A** | £1 Million | £1 Million | **Nothing** | **Nothing** |
  | **Option B** | £5 Million | Nothing | **Nothing** | **Nothing** |

  *(Note: The shaded columns represent the 89% common mass. In Pair 1 they are both £1M. In Pair 2 they are both Nothing.)*

  ## 5. The Debrief: Mapping Activity to Theory

  Do not simply lecture. Use the data on the board to drive the theory.

  **Step 1: The Empirical Pattern (5 mins)**
  *   Ask for a show of hands: "Who chose Safe in Pair 1 and Risky in Pair 2 in Round 1?" (Expect a majority).
  *   "Who switched to Safe/Safe or Risky/Risky in Round 2?"
  *   **Point:** "Most of you likely violated Expected Utility (EU) in Round 1. Did Round 2 fix it? If yes, why? If no, why?"

  **Step 2: The Independence Axiom (5 mins)**
  *   Draw the EU calculation on the board.
  *   $U(1M) > 0.10 U(5M) + 0.89 U(1M) + 0.01 U(0)$
  *   Subtract $0.89 U(1M)$ from both sides.
  *   Result: $0.11 U(1M) > 0.10 U(5M) + 0.01 U(0)$.
  *   Show that Pair 2 is *mathematically identical* to this result.
  *   **Visual Hook:** Point to the shaded columns in Round 2. "Independence says these shaded columns are irrelevant. They are the same in Option A and Option B. You should ignore them. If you didn't ignore them in Round 1, but did in Round 2, the *description* changed your preference."

  **Step 3: The Representation Result (5 mins)**
  *   "Why do we care? Von Neumann-Morgenstern proves that if you satisfy axioms like Independence, you *must* act as if you are maximizing a utility function."
  *   "If you violate Independence, you cannot be represented as a standard expected utility maximizer. You aren't just 'making a mistake'; you are operating outside the model."

  ## 6. Separating the Three Diagnoses

  You must distinguish *why* the violation happened. Use this grid in your explanation:

  | Diagnosis | Description | What Round 2 Tells Us |
  | :--- | :--- | :--- |
  | **1. Normative Rejection** | "I know the math, but I prefer security. The axiom is wrong." | **No Shift.** If students keep the Allais pattern in Round 2, they likely hold this view. The partition didn't change their values. |
  | **2. Coarse Outcomes** | "The prize isn't just money; it's 'money + no regret'." | **Ambiguous.** Splitting probability branches doesn't enrich the *outcome* description (e.g., adding "no regret"). If they switch, it wasn't this. If they don't, it *could* be this, but we haven't tested it properly. |
  | **3. Framing Artefact** | "I didn't see the common consequence. The description confused me." | **Shift to EU.** If Round 2 yields more EU-consistent choices, the violation was likely cognitive/salience-based. The shaded columns made the cancellation obvious. |

  **Crucial Nuance for the Seminar:**
  Be explicit: "This activity strongly tests Diagnosis 3 (Framing). It weakly tests Diagnosis 1 (Normative). It does *not* test Diagnosis 2 (Outcome Enrichment). To test Diagnosis 2, we would need to rewrite the prizes as '£1M and you feel safe' vs '£5M and you might feel regret'. We didn't do that today."

  ## 7. Candid Reflection: What Will Go Wrong

  **1. The "N=24" Problem**
  *   **Risk:** With only 24 students, statistical noise is high. You might get zero Allais violators, or everyone might violate. The "Event Splitting" effect might not show up simply due to sample size.
  *   **Mitigation:** Prepare a script for *both* outcomes.
      *   *If it works:* "Look, the visual salience restored rationality."
      *   *If it fails:* "Interesting. Even with the structure laid bare, you still reject Independence. This suggests the violation is robust, not just a framing error." (This is actually a stronger philosophical result).

  **2. The "Hypothetical" Problem**
  *   **Risk:** Students may treat the choices as jokes because only one person wins.
  *   **Mitigation:** Emphasize the "Random Student, Random Question" rule. It makes every choice potentially pivotal. Keep the prizes visible.

  **3. The "Outcome Enrichment" Confusion**
  *   **Risk:** Students will conflate "splitting the probability" with "enriching the outcome."
  *   **Mitigation:** In the debrief, explicitly state: "We split the *event*, not the *prize*. We did not add 'regret' to the text. So if you still violate Independence, do not claim it is because of regret unless you can explain why splitting the 89% into 44% + 45% changes the regret."

  **4. What This Activity Cannot Deliver**
  *   **The Limit:** No classroom activity can prove whether Independence is *normatively* correct. It can only show if people *satisfy* it.
  *   **Your Voice:** You must conclude by saying: "Data cannot tell you whether you *ought* to satisfy Independence. It only tells you that if you don't, you cannot use the standard Expected Utility model to describe yourself. Whether that is a bug in you or a bug in the model is a philosophical question, not an empirical one."

