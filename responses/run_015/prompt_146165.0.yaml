  ## 9. Final Advice for the Instructor
  *   **Control the Room:** When distributing Round 2, forbid discussion. "Do not talk to your neighbours. This is a test of *your* consistency."
  *   **The "Zero Effect" Scenario:** If the data shows no change between Round 1 and Round 2, do not panic. This is a gift. It allows you to argue that the Allais preference is *stable* and not merely a framing error. This leads to a richer discussion about whether rationality requires Independence.
  *   **Timekeeping:** Wear a watch. If the tallying takes too long, skip the detailed count and ask for a show of hands for the "Allais Pattern" (Safe/Risky).

  This design respects the constraints, targets the specific theoretical mechanism you requested, and provides a robust fallback if the empirical effect fails to materialize.
