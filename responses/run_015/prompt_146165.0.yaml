                      *   1B: 10% 5M + 89% 1M + 1% 0.
                      *   Cancel 89% 1M. Remaining: 11% 1M vs 10% 5M + 1% 0.
                      *   2A: 11% 1M + 89% 0.
                      *   2B: 10% 5M + 90% 0 -> 10% 5M + 1% 0 + 89% 0.
