  I have been developing a long-horizon risk-evaluation model for intergenerational infrastructure planning, in which catastrophic failures carry exponentially decaying probabilities but exponentially scaled costs structured with alternating signs—representing the interplay between mitigation expenditures and adaptation damages. In studying the decision-theoretic foundations, I encountered the Pasadena paradox, which I understand to involve a fair-coin game that ends on the first tail, with payoffs scaled by powers of two that take opposite signs on even and odd rounds. This produces a situation in which both the aggregate positive contribution and the aggregate negative contribution to the expectation diverge.

  Because the partial sums can apparently be driven toward either extreme by regrouping terms, I interpreted the paradox as essentially an instance of Riemann's rearrangement theorem applied to an expectation: I assumed the game possesses a conditionally convergent expectation that lacks a canonical value solely because different orderings of outcomes yield different sums. Consequently, I have been treating the problem as one of selecting the correct grouping convention—perhaps chronological ordering, or a dominance-preserving regularization such as the weak-expectation approach mentioned in some recent discussions—to recover a unique expected value. Given this framing, I want to ask whether decision theorists have settled on a particular regularization or ordering rule for such cases, and whether that rule depends on the temporal structure of the gamble or can be generalized to any decision problem with alternating-sign, exponentially scaled outcomes.

  More specifically, if the expectation is genuinely undefined rather than merely reorderable, does that invalidate expected-utility maximization for models with unbounded damage functions, or do dominance relations among strategies provide a sufficient criterion without requiring a completed expectation? I am trying to determine whether my model's failure to converge is a technical artifact that can be regularized away, or a substantive limitation that requires abandoning expectation-based reasoning altogether. Please conclude with a final line beginning "Verdict:" that identifies the core misconception—whether the Pasadena expectation is ambiguous due to reorderability or undefined due to absolute divergence of both parts—followed by the correct classification of the decision-theoretic response.
