  3.  **Identify the Missing Ethical Frameworks:**
      *   **Paternalism:** Acting against someone's will for *their own good*. (Dan's focus).
      *   **Harm Principle (Mill):** Preventing harm to *others*. This is the key counter-argument. If I ask AI to help me scam someone, refusing isn't paternalism toward me; it's preventing harm to the victim.
      *   **Complicity/Accomplice Liability:** The AI (or its creators) doesn't want to be an instrument of harm. It's about moral agency (or simulated agency) of the tool provider.
      *   **Terms of Service/Contractual Agreement:** Using the tool is a privilege based on agreed rules, not an absolute right.
      *   **Safety/Alignment:** The AI is designed to be helpful, harmless, and honest. "Harmless" extends beyond the user.

  4.  **Address the "Blocking vs. Steering" Distinction:**
