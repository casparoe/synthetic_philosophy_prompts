      *   *5 vs 3:* Preference laundering (5) corrupts the "endorsement" signal (3). If the data is laundered, the reflection is tainted. This reinforces the 3-4 tension.
      *   *1 vs 7:* If alignment is hard by default (1), why focus on mediocre systems (7)? Maybe because mediocre systems are less capable of deceptive alignment? But if alignment is hard *by default*, even mediocre systems might drift. Actually, 1 supports 7 if "hard" means "doesn't happen automatically," so we need to work on the deployment side. Not a strong tension.
