      *   *Revision:* Modify Point 3. Instead of "whatever we would endorse on reflection" (which implies a reachable, stable signal), shift to "systems that remain legibly uncertain and structurally constrained from acting on high-stakes decisions without external verification that is *robust to manipulation*." Or, acknowledge that "endorsement" is a placeholder for a process we don't yet know how to secure.
      *   *Better Revision:* Refine Point 3 to acknowledge the fragility. "Procedural target... *provided we can solve the verification problem*." But that weakens it.
      *   *Best Revision:* Refine Point 4/5 to acknowledge that *current* approval signals are fragile, but the goal of conceptual work (6) is to create *robust* oversight. Or, refine Point 3 to be about *limiting* agency rather than *satisfying* preference. "Do nothing we'd flag" is negative constraint. "Whatever we endorse" is positive optimization. Drop the positive optimization. Stick to the negative constraint.

