      *   *5 vs 6:* Preference laundering happens via data/world interaction. Pausing frontier models (6) might stop the *worst* laundering, but if we focus on ordinary institutions (7), they might still launder preferences at scale.
      *   *3 vs 7:* Procedural alignment (corrigibility) is usually a property of frontier models. Ordinary institutions deploying "mediocre systems" might not care about corrigibility; they care about task completion. Focusing effort there (7) might mean working on governance/policy rather than alignment tech, which fits, but does it fit the "conceptual bottleneck" claim (6)?

