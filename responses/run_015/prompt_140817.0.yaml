      *(Self-Correction during drafting)*: Make sure I don't just say "3 and 4 conflict." I need to explain *why* specifically regarding the "endorsement" signal. The "Preference Laundering" (5) makes 4 worse. It's a triad. I should treat 3-4-5 as the core knot.
