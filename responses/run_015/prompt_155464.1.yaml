answer: |-
  **WORKSHOP PREP SHEET: HARSANYI, STAKES, AND CALIBRATION**

  **To:** Presenter
  **From:** Senior Colleague
  **Re:** Q&A Strategy

  Look, I've seen this movie. You've built a clever bridge between measurement theory and distributive justice, but you've done it by making the social weights endogenous to the feasible set. That is your vulnerability. The Sen-ish crowd and the Decision Theorist will smell blood on the Independence of Irrelevant Alternatives (IIA) violation immediately. The philosophers will worry you've smuggled normativity into a "measurement" convention.

  You have 10 minutes. They have 10 voices. You cannot win every point; you must survive the ones that invalidate the mechanism.

  Here is the damage assessment, ordered by likelihood and lethality.

  ### PRE-EMPTIVE CONCESSIONS
  *Do this in the last 3 minutes of the talk. Do not wait for Q&A.*

  1.  **Concede Normativity of Calibration:** Admit explicitly that "unit-stake calibration" is not a discovery of pre-existing interpersonal units. It is a *convention*. Do not claim it is "neutral." Claim it is the *minimal* normative commitment required to make the theorem operational without importing a full theory of justice.
  2.  **Concede Menu-Relativity:** Acknowledge that social preferences will violate standard IIA. Frame this immediately as "Contextual Stakes" rather than "Instability." If you try to defend IIA, you lose the Decision Theorist and the Social Choice people.

  ---

  ### THE EIGHT OBJECTIONS

  #### 1. The "Dummy Option" Manipulation (IIA Violation)
  **Who:** The Senior Social Choice Theorist (Sen-ish).
  **The Question:** "You admit your weights depend on the feasible set $F$. Suppose we have two options, $x$ and $y$. Person 1 prefers $x$, Person 2 prefers $y$. Under your calibration, $x$ wins. Now introduce option $z$. $z$ is dominated for everyone—nobody would ever choose it. But for Person 1, $z$ is catastrophic, expanding her utility range massively, while for Person 2, $z$ is irrelevant. Person 1's weight collapses. Now $y$ wins. You've allowed a socially irrelevant, unanimously rejected option to flip the social choice between $x$ and $y$. Isn't this manipulable by agenda setters?"
  **The Reply:** "It is manipulable if the agenda setter can fabricate options. But in real policy contexts, the feasible set is determined by constraints (budget, technology), not by whim. More importantly, this isn't a bug; it's information. The introduction of $z$ reveals that Person 1's *potential loss* in this decision context is far greater than we thought. If the stakes for Person 1 are actually 100 times higher than Person 2's because of the tail risk $z$ represents, why *shouldn't* that dampen her weight per unit of utility? We are weighting by marginal stake, not by raw preference intensity."
  **Soft Spot:** This is weak. If $z$ is truly dominated and known to be so, it shouldn't carry informational content about risk. You are relying on the idea that "range" captures "stakes," but range is sensitive to outliers.
  **Damage:** High. If this holds, your rule is unstable.

  #### 2. The "Measurement is Moral" Trap
  **Who:** The Constructivist Rawlsian.
  **The Question:** "You insist this is a measurement theorem, not a moral one. But choosing to normalize by range rather than by level, or by absolute units, is a moral choice. You've just pushed the normative question back one step. Why is 'equality of stake' the right metric? That's a substantive egalitarian claim, not a measurement convention."
  **The Reply:** "I agree it's a normative convention. But it's a *procedural* one, not an *outcome-based* one. Harsanyi's original $\lambda_i$ are underdetermined by the axioms. Someone has to set them. My claim is that setting them to equalize stakes is the only convention that respects the formal structure of the decision problem without importing an external theory of the good (like primary goods). It treats persons as equal *agents in this choice*, not as equal *recipients of welfare*."
  **Soft Spot:** You are conceding the "measurement not moral" line is overstated. You are now defending a specific egalitarian view.
  **Damage:** Medium. It undermines your opening hook but leaves the mechanism intact.

  #### 3. Adapted Preferences (The "Happy Slave")
  **Who:** The Luck Egalitarian (Dworkin/Arneson vein).
  **The Question:** "Consider a person with adapted preferences due to oppression. Her range is compressed because she doesn't expect more. Under your rule, her range is small, so her unit weight is *high*. She gets priority. Now consider a person with expensive tastes. Her range is huge. Her weight is low. You are rewarding adaptation and punishing ambition. Is that the distributive verdict you want to defend?"
  **The Reply:** "For the adapted preferences case: Yes. If her feasible range is compressed by oppression, every unit of gain she *can* achieve is harder won and represents a larger fraction of her available good. She gets priority. For expensive tastes: Also yes. If your utility function is so sensitive that small resource changes cause massive utility swings, you are claiming a high stake. But we normalize that away. We force your range to 1. You don't get extra social weight just because your utility function is volatile."
  **Soft Spot:** The "Happy Slave" case is tricky. If she reports a small range because she's resigned, you are incentivizing resignation. You need to distinguish *feasible* range from *expected* range.
  **Damage:** Medium-High. Hits the moral plausibility of the output.

  #### 4. Social vNM Independence
  **Who:** The Decision Theorist.
  **The Question:** "You assume the social ordering satisfies vNM independence. But if we care about fairness, we might prefer a sure thing for everyone over a lottery that gives one person everything and another nothing, even if the expected utility is higher. Diamond's critique applies. If you keep vNM for society, you've ruled out ex post egalitarian concerns by fiat."
  **The Reply:** "I am not ruling out ex post concerns; I am locating them in the utility functions $u_i$. If individuals are averse to inequality, that enters their $u_i$. The social aggregator need only be rational over the *distributions* presented. If you violate independence at the social level, you cannot represent the social preference as a sum of utilities at all. You leave the Harsanyi framework entirely. I am exploring what Harsanyi can do, not what a rank-dependent social welfare function can do."
  **Soft Spot:** You are begging the question. The point is society *should* violate independence.
  **Damage:** Medium. Limits the scope of your theorem to "welfarist" audiences.

  #### 5. Prioritarian Redundancy
  **Who:** The Parfitian Prioritarian.
  **The Question:** "Your rule gives more weight to those with smaller ranges. Often, those with smaller ranges are worse off. So your view mimics prioritarianism. But prioritarianism weights by *level* of well-being, not *range*. What if someone is badly off but has a wide range (high potential), and someone is well off but has a compressed range? You help the well-off person. Why is range morally superior to level?"
  **The Reply:** "Because level is status-quo biased. Range is about what is *at stake* in this decision. Prioritarianism says 'help the worse off' regardless of the decision. I say 'help the person for whom this decision matters more.' If a wealthy person faces a decision where they could lose everything (high range), and a poor person faces a decision where they gain a trivial amount (low range), my rule prioritizes the wealthy person's loss. That's not prioritarianism; that's stake-sensitivity."
  **Soft Spot:** This sounds like you are abandoning distributive justice for efficiency.
  **Damage:** Low-Medium. Mostly taxonomic.

  #### 6. Dynamic Inconsistency
  **Who:** The Senior Economist.
  **The Question:** "Menus change over time. Options expire. If weights depend on the menu, my weight today is different from my weight tomorrow. A plan optimal at $t=0$ might be rejected at $t=1$ simply because the feasible set shrank. How do you handle sequential decision making?"
  **The Reply:** "You evaluate the plan at the initial node using the initial feasible set. Once the decision is made, the 'stakes' were locked in. We don't re-calibrate after the fact. This is standard in contract theory: you fix the weights at the constitutional stage."
  **Soft Spot:** But you said weights track stakes in the *actual* decision problem. If the problem changes, the stakes change. You are contradicting your own menu-relativity claim to save consistency.
  **Damage:** Medium. Practical implementation issue.

  #### 7. The Zero-Range Problem
  **Who:** A Grad Student (sharp one).
  **The Question:** "What if someone is indifferent between all options in $F$? Their range is zero. You can't divide by zero. Do they get infinite weight? Zero weight?"
  **The Reply:** "Zero weight. If you have no stake in the decision, you are a null voter for this problem. We treat them as having $u_i(x) = constant$, so they drop out of the summation."
  **Soft Spot:** None, technically. But philosophically harsh.
  **Damage:** Low. Technical fix.

  #### 8. Single-Profile vs. Multi-Profile
  **Who:** The Second Social Choice Theorist.
  **The Question:** "Harsanyi's theorem is multi-profile. It holds across all possible utility profiles. Your calibration is single-profile; it depends on the specific $u_i$ and $F$ in front of us. You aren't proving a theorem anymore; you're proposing a rule. Does the aggregation result even hold?"
  **The Reply:** "The aggregation result holds *given* the calibration. For any fixed profile and fixed $F$, there exist $\lambda_i$ (defined by the calibration) such that $U = \sum u_i^*$. I am not claiming this $\lambda$ vector works for all profiles. I am claiming this is the correct way to select the $\lambda$ vector for *this* profile."
  **Soft Spot:** You are admitting you aren't using Harsanyi's theorem in its standard axiomatic strength.
  **Damage:** Low. Semantic.

  ---

  ### THE "MUST LAND" REPLY
  **Topic:** Objection #1 (Menu Relativity / Dummy Options).

  If you fumble this, the room will conclude your mechanism is mathematically unstable.
  **The Move:** You must distinguish between **Strategic Manipulation** and **Informational Sensitivity**.
  **Say this:** "If the addition of $z$ changes the range, it changes the *stakes*. If $z$ is a catastrophic tail-risk for Person 1 that is not for Person 2, then Person 1 *does* have more at risk in this decision context. The fact that $z$ is dominated doesn't mean it's irrelevant to the *scale* of the decision. However, I concede that if $z$ is a 'phantom' option—feasible in name only—we need a robustness check. I propose we define the feasible set $F$ as the set of *serious* contenders, not the logical closure of all possibilities. That restricts the manipulation."
  *Note:* This is a retreat. You are moving from "all feasible options" to "serious options." It's necessary to save the theory.

  ### THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "If the $\lambda_i$ are just exchange rates determined by the menu, and the menu is determined by political power (who gets to set the agenda), haven't you just formalized the power of the agenda-setter? The person who defines the feasible set defines the weights."
  **Why it's deadly:** It connects your technical calibration directly to political philosophy's core worry: power. It suggests your "measurement" is just politics by another name.
  **Preparation:** If asked, pivot to **Constitutional Constraints**. "The feasible set shouldn't be set ad hoc. It should be constrained by rights or budget constraints that are fixed prior to the calibration. The calibration happens *within* the just bounds, not to determine them."

  ### FINAL ADVICE
  1.  **Don't fight the IIA violation.** Own it. Call it "Stake-Dependence." If you try to say it's compatible with IIA, the Social Choice people will eat you alive.
  2.  **Watch the Rawlsian.** They won't care about the math. They will care that you are using "utility" instead of "primary goods." Don't get dragged into a metric war. Say: "I am assuming we have already agreed to use utility for this specific class of decisions (e.g., risk policy). Given that, how do we aggregate?"
  3.  **Keep the examples tiny.** When explaining the range shift, use: "Person A: 0 to 10. Person B: 0 to 2. Add option -100 for A. A's range becomes 110. A's weight drops." Visuals help.
  4.  **End on the "Measurement" point.** Reiterate: "Harsanyi tells us the form must be additive. He doesn't tell us the units. I am telling you the units. That is all."

  Good luck. Keep your water close. The last ten minutes will get personal.
