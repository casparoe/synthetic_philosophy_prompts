  I'm co-teaching a grad seminar on formal epistemology this term with my colleague Dana, who's formally in the math department and is a much more commited Bayesian than I am — I'm the one who keeps dragging everything back to bare metaphysical questions she finds boring, and she's the one who brings those grocery-store cupcakes to every meeting. We've just finished two weeks on updating on uncertain evidence, and I've realized I have no idea what rule she actually thinks is correct. She won't state one in general terms; whenever I push her she says something like "the cases tell you what to do" and then just does the case. So I've been reconstructing it from her verdicts, and next week is the last session before she flies off to a conference, and I'd like to have it pinned down before then. (My sabbatical application is due Friday and I keep working on this instead, which tells you where my priorities are. Also: please don't give me a reading list or point me at papers — I can look those up myself. I want the reconstruction.)

  Her running example goes like this. An urn is either the red-heavy one (80% red balls) or the blue-heavy one (20% red), 50/50 which. One ball gets drawn and you squint at it under bad light. Let E be the proposition that the ball looks red: your prior gives you P(E) = 0.5, plus 0.8 for the red urn given E and 0.2 given not-E. The rule she keeps using is the one where you move your credence over the evidence partition first and then read off the hypothesis by holding fixed the probability of the hypothesis inside each cell — so if your experience leaves you 0.8 on E and nothing else is going on, you end up at 0.8 × 0.8 + 0.2 × 0.2 = 0.68 on the red urn. Her verdicts so far: (i) that clean case, she says 0.68, no hesitation. (ii) Same 0.8 shift on E, except you've also just learned that the lamp has a red gel over it and that the gel goes up only on the days when the blue urn is the one in use: she refuses to run the update on E at all, says the very conditionals you'd be holding fixed are the ones that just got changed, calls the 0.68 "an artifact of the partition," and lands in the mid-0.4s — much closer to where you started — once she writes down a bigger space with a variable for the gel and conditions on the look in there. (iii) Same 0.8 shift, but there's no story at all: nothing you can point to changed, you just find yourself at 0.8, and you have no opinion either way about whether your color vision is degraded. She shrugs and says 0.68 anyway. (iv) You're not sure you even saw the ball — you might have blinked, and the 0.8 arrived by some fuzzy route: she says the input isn't well formed, go find the proposition you actually got evidence about (something in the neighborhood of "it visually seemed red to me") and condition on that with a likelihood that handles the blink case, you can't just feed the number for E into the update. (v) Two shifts, one at 10:00 when you look and one at 10:05 when you heft the ball: she says do them in the order they happened, a