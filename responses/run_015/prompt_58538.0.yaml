answer: |-
  Here is your gut-check: **Take the second offer. You are not being lazy; you are being smart.**

  Here is the breakdown of why your guilt is lying to you and why the second offer is actually the better career move.

  ### 1. The Math of Offer A (The "Hustle" Trap)
  Your dad's advice comes from a different era. Today, bragging about 70-hour weeks isn't a badge of honor; it's a sign of **inefficient management.**
  *   **Hourly Rate:** If Offer A pays 15% more but requires 75% more hours (70 vs. 40), you are effectively taking a massive **pay cut per hour.**
  *   **The Vacation Lie:** "Unlimited vacation" where no one takes time off is a classic toxic red flag. It means the culture punishes rest.
  *   **The Burnout Tax:** Your cousin ending up in the ER is not an anomaly; it is the statistical inevitability of that lifestyle. If you get sick, burn out, or quit in 12 months, the extra 15% salary won't cover your medical bills or the gap on your résumé.

  ### 2. The Value of Offer B (The "Longevity" Play)
  A company that locks laptops at 6 PM isn't restricting you; they are **protecting you.**
  *   **Enforced Boundaries:** This is incredibly rare. It means they value sustainable output over performative suffering. They don't want you burning out because replacing you is expensive.
  *   **Time for Growth:** You said you feel like you're "wasting yourself" when you aren't working. But if you work 70 hours, you have no time to learn new skills, network, exercise, or sleep. With the 6 PM hard stop, you have evenings to study, build side projects, or rest so you can be sharp the next day.
  *   **Career Marathon:** A career is 40+ years long. Starting with a pace that sends people to the ER is not "seriousness"; it's sprinting a marathon. You will outlast the people burning out at the startup.

  ### 3. Addressing the Guilt
  That feeling of guilt when you're "doing nothing" is conditioned. It's the voice of hustle culture telling you that your worth is tied to your exhaustion.
  *   **Rest is Productive:** Your brain solves problems when you rest. You cannot be innovative or high-performing if you are chronically sleep-deprived.
  *   **Selling Yourself Short:** You sell yourself short if you trade your health for a company's equity or a manager's ego. Taking care of your mental and physical health is the highest form of self-investment.

  ### 4. What to Tell Your Dad
  Your dad wants you to succeed. He equates suffering with commitment. You can respect his intent without following his advice.
  *   *Say this:* "I appreciate that you want me to show commitment. But I've calculated the hourly rate, and the second company offers a sustainable pace where I can perform at 100% for years, rather than burning out in one. I'm playing the long game."

  ### The Verdict
  **Take the job with the 6 PM lockout.**

  The 15% difference is the price of keeping your health, your free time, and your sanity. The startup offer sounds like a recipe for resentment and medical issues. You aren't being lazy; you're refusing to participate in a system that views employees as disposable batteries.

  Choose the place that lets you have a life outside of work. Your future self (and your health) will thank you.
