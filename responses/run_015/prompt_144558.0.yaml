answer: |-
  You have identified a real, documented, and deeply frustrating phenomenon. Your intuition is correct: this is not Goodhart's Law, and it is not Moral Hazard. You are describing the collision between **market/legal rules** and **social norms**.

  The specific academic term for what you are seeing is **Motivation Crowding Theory** (specifically, the crowding out of *intrinsic* motivation by *extrinsic* incentives). However, that term is economic and individualistic. What you are describing is the social version: **Social Norm Displacement** (or **Norm Crowding Out**).

  Here is the breakdown of the concepts, the irreversibility factor, how your three cases differ, and how to handle the boundary cases in your board meeting.

  ### 1. The Core Concept: Norm Crowding Out
  The seminal paper on this is Gneezy and Rustichini's *"A Fine is a Price"* (2000). They studied a daycare center that started fining parents for picking up children late.
  *   **Result:** Late pickups *increased*.
  *   **Why:** Before the fine, parents felt a *moral obligation* not to inconvenience the teachers (a social norm). After the fine, it became a *transaction* (a market norm). Parents felt they were simply paying for the extra service of late care. The moral guilt was "priced out."

  **How this matches your Bike Room:**
  *   **Before:** The norm was "We take care of our shared space." Enforcement was social (a "friendly-but-not-friendly word"). This relies on shame, pride, and community standing.
  *   **After:** The norm became "I must not park in the walkway, or I pay $20." Everything else is now outside the contract. If I leave tools on the bench, I haven't broken the *rule*, so I haven't done anything wrong.
  *   **The Shift:** You have moved the relationship from **Community Stewardship** (infinite responsibility) to **Regulatory Compliance** (finite responsibility).

  ### 2. The Irreversibility: Norm Hysteresis
  You asked if there is literature on the "one-way" nature of this. Yes. It falls under **Social Capital Depreciation** and **Norm Hysteresis**.

  *   **Norms are Skills:** Following a social norm isn't just knowing the rule; it's a practiced habit of attention. The "two or three guys" in your bike room had developed a habit of stewardship. When the fine was introduced, they stopped practicing that habit. Skills atrophy.
  *   **Transmission Failure:** You hit on the critical point: *"The people who moved in during the fine era never learned it."* Norms are transmitted through observation and correction. If the old enforcers stop correcting (because it feels like "snitching" now) and the new residents only see a sign, the *knowledge* of how to be a good neighbor is lost.
  *   **Hysteresis:** In physics, hysteresis is when a system depends not just on its current input, but on its history. In sociology, once trust is replaced by rules, removing the rules does not automatically restore trust. You have to rebuild the social capital manually, which is much harder than posting a sign.

  **Elinor Ostrom**, who won the Nobel Prize for work on common-pool resources (like your bike room), argued that external imposition of rules often destroys the local capacity for self-governance. Once that capacity is destroyed, it doesn't just snap back.

  ### 3. Are Your Three Cases the Same Thing?
  They are siblings, but not identical twins.

  *   **Case 1 (Bike Room): Pure Norm Crowding Out.**
      *   *Mechanism:* A fine changed a moral obligation into a price.
      *   *Outcome:* Compliance on the specific metric (walkway clear), degradation of general care (tools out, pump stolen).
      *   *Verdict:* This is the textbook example.

  *   **Case 2 (Trail Crew): Goodhart's Law + Crowding Out.**
      *   *Mechanism:* A reward was attached to a specific metric (miles).
      *   *Outcome:* People gamed the metric (more miles, less quality).
      *   *Difference:* This *is* partially Goodhart's Law because the metric (miles) became a poor proxy for the goal (good trails). But the *loss of unpaid maintenance work* is Crowding Out. The reward signaled that "only miles matter," so unmeasured care was discarded.

  *   **Case 3 (Tool Library): Bureaucratization of Trust.**
      *   *Mechanism:* An app replaced a handshake/logbook.
      *   *Outcome:* Efficiency went up, mutual trust went down.
      *   *Difference:* This is about **Signaling**. The app signals "We do not trust you to be honest." When an institution signals distrust, people reciprocate with lower civic engagement.

  **Summary:** All three are instances of **Formalization Displacing Informal Order**, but Case 1 is the cleanest example of the phenomenon you are worried about.

  ### 4. Proposed Name and Definition
  If you need a term for the board that isn't dry economics, I propose calling it **The Stewardship Trap**.

  **Definition:** *The Stewardship Trap occurs when a formal rule or incentive is introduced to solve a specific behavioral problem, successfully increasing compliance on that specific metric, but simultaneously displacing the informal social norms that encouraged broader care, resulting in a net loss of community maintenance capacity that is difficult to reverse.*

  **What counts:**
  *   A rule is introduced to fix a specific mess.
  *   The mess decreases.
  *   Unregulated messes increase.
  *   Community members stop correcting each other.

  **What doesn't count:**
  *   A rule that stops a behavior without degrading other behaviors (rare).
  *   A rule that stops a behavior and the community *increases* other caring behaviors (also rare, usually happens only if the rule removes a major source of conflict).

  ### 5. Settling the Boundary Cases
  You asked three specific boundary questions. Here is how the literature answers them:

  **A. Is it the same phenomenon when the new rule is a reward rather than a fine?**
  **Yes.** This is the **Overjustification Effect**. If you pay kids to draw, they draw less when you stop paying. If you reward trail miles, people stop caring about trail quality. Extrinsic motivators (money, prizes, points) crowd out intrinsic motivators (pride, care, fun) in both directions.

  **B. Is it the same thing when the outcome is better on the measured dimension and worse on every other one?**
  **Yes.** In fact, this is the *dangerous* version. If the outcome was worse on *all* dimensions (like the daycare late pickups increasing), the policy would be dropped immediately. The fact that the walkway is clearer makes the policy look successful, hiding the erosion of the pump security and tool care. This is **Metric Fixation**. It seduces the board into thinking they solved the problem when they only moved it.

  **C. Is it still this phenomenon if the old informal norm was never actually healthy (e.g., territorial guys)?**
  **Mechanism: Yes. Outcome: Debatable.**
  This is the most critical distinction for your meeting.
  *   **The Mechanism:** The *process* of norm destruction is identical. Formal rules will still kill whatever informal culture existed, whether that culture was "friendly stewardship" or "territorial bullying."
  *   **The Trade-off:** If the "two guys" were actually gatekeeping the space and preventing new people from using it, then the informal norm was **toxic social capital**. In that case, destroying it is a feature, not a bug. You *want* to break that norm.
  *   **The Argument:** You need to argue that your bike room norm was *positive* social capital (stewardship), not negative (gatekeeping). If the old system was inclusive but messy, the fine is a mistake. If the old system was clean but exclusionary, the fine might be worth the cost. Based on your description ("friendly-but-not-friendly word," "ran the place quietly"), it sounds like positive stewardship.

  ### 6. How to Argue This in the Meeting
  Do not walk in and say "Goodhart's Law." Walk in with this framing:

  1.  **Distinguish Compliance from Care:** "A fine buys compliance. It does not buy care. We can force people to move bikes from the walkway, but we cannot fine them into caring about the stolen pump."
  2.  **Highlight the Hidden Cost:** "The cost of this fine isn't just administrative. The cost is that neighbors stop talking to neighbors. When enforcement becomes the Board's job, it stops being the community's job."
  3.  **Warn of Irreversibility:** "If we do this, we are spending social capital we cannot easily earn back. New residents will learn to follow the sign, not to look out for the room. If we remove the sign in two years, the room will not go back to how it was; it will get worse, because the habit of stewardship will have died."
  4.  **Propose an Alternative:** Suggest **Restorative Norms** instead of **Punitive Rules**.
      *   Instead of a fine: A mandatory "shift" to clean the room if you leave it messy.
      *   Instead of a sign: A community work day to reset the room, reinforcing that *we* own this, not *the board*.

  **The Bottom Line:**
  You are describing **Motivation Crowding** leading to **Norm Hysteresis**. You are right to be worried. The sign works exactly as designed—it solves the visible problem while killing the invisible engine that actually kept the place running.
