      *   *Check:* Did I distinguish from Goodhart clearly? Yes, Goodhart is about the *measure* lying. This is about the *motivation* changing.
      *   *Check:* Is the tone appropriate? Professional, analytical, empathetic to the co-op context.

  11. **Final Polish:** Ensure the distinction between "Compliance" and "Stewardship" is clear. That's the heart of the user's argument. (Compliance = doing what is written; Stewardship = caring for the whole).

  **(Self-Correction on the "Name"):** While "Motivation Crowding" is the academic term, it's a bit dry. The user asked for a proposed name if nothing fits perfectly. I should offer the academic term but also a more descriptive phrase they can use in a meeting. "The Compliance-Stewardship Trade-off" or "Norm Displacement." Let's stick with **Motivation Crowding** as the anchor but explain the **Social Norm** specific variant.

  **(Refining the Irreversibility):** This is specifically about *intergenerational norm transmission*. If the old enforcers stop, and new people only see the sign, the "muscle memory" of the community atrophies. This is **Norm Atrophy**.

  **(Refining the Boundary Case on Toxic Norms):** If the old guys were bullies, the formal rule breaks the *bad* norm. The crowding out still happens, but it might be a net win. The user needs to know this distinction so they don't romanticize the past.

