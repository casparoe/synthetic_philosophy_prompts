      *   *Outcome:* Compliance on the specific metric, degradation of overall pro-social behavior/stewardship.
      *   *Social Dynamic:* Shift from "community policing" to "authority policing."
      *   *Temporal Aspect:* Hysteresis/Irreversibility (hard to go back).

  3.  **Identify Established Concepts:**
      *   **Crowding Out Effect (Motivation Crowding Theory):** This is the strongest economic/psychological fit. Extrinsic incentives (fines/rewards) reduce intrinsic motivation.
      *   **The Semipermanence of Norm Erosion:** Related to social capital theory (Putnam) or institutional memory.
      *   **Legal Centralism vs. Legal Pluralism:** The shift from informal ordering to state/formal rule enforcement.
      *   **The "Overjustification Effect":** Psychological term for when an external incentive decreases a person's intrinsic motivation to perform a task.
      *   **Elster's "Norms vs. Rules":** Jon Elster writes extensively about how social norms work differently than rational choice rules.
      *   **Bohnet & Frey / Gneezy & Rustichini:** Specific studies on fines and daycares (the classic example).

  4.  **Evaluate "Goodhart's Law" vs. User's Observation:**
      *   User is right to distinguish. Goodhart's is "When a measure becomes a target, it ceases to be a good measure." (Gaming the metric).
      *   User's observation is "When a rule becomes the standard, the *spirit* dies." (Crowding out norms).
      *   *Verdict:* It's Motivation Crowding Theory, specifically the social norm variant.

  5.  **Address the Irreversibility (Hysteresis):**
      *   This is crucial. Once norms are broken, they don't automatically return when the rule is removed.
      *   Concepts: *Norm Hysteresis*, *Social Capital Depreciation*, *Institutional Memory Loss*.
      *   Reference: Elinor Ostrom's work on Common Pool Resources discusses how trust, once broken by external imposition, is hard to rebuild.

  6.  **Analyze the Three Cases:**
      *   *Case 1 (Bike Room):* Classic Crowding Out. Informal enforcement replaced by formal fine. Stewardship declines.
      *   *Case 2 (Trail Crew):* Incentive distortion. Reward for miles -> ignore quality/maintenance. This is closer to Goodhart's *plus* Crowding Out.
      *   *Case 3 (Tool Library):* Bureaucratization. App replaces trust.
      *   *Synthesis:* They are all instances of **Formalization Displacing Informal Norms**, but Case 2 has a stronger Goodhart component (gaming the metric), while 1 and 3 are pure norm displacement.

  7.  **Address the Boundary Cases:**
      *   *Rewards vs. Fines:* Yes, same phenomenon (Overjustification Effect covers rewards; Crowding Out covers both).
      *   *Measured dimension improves:* Yes, that's the trap. It *looks* successful initially (no bikes in walkway), but the hidden cost is social capital.
      *   *Unhealthy original norms:* This is the tricky one. If the "two guys" were territorial bullies, the formal rule might be necessary. But the *mechanism* of norm destruction remains the same, even if the outcome is net positive. Need to distinguish the *mechanism* from the *moral valence*.

  8.  **Drafting the Response:**
      *   **Acknowledge and Validate:** The user's intuition is sharp. They are describing a real, documented phenomenon.
      *   **Primary Label:** **Motivation Crowding Theory** (specifically **Social Norm Crowding Out**).
      *   **Secondary Label:** **The "Daycare Center Effect"** (referencing the famous Gneezy & Rustichini study).
      *   **The Irreversibility:** Discuss **Norm Hysteresis** and **Social Capital Depreciation**. Reference Ostrom.
      *   **Differentiating the Cases:**
          *   Case 1: Pure Norm Crowding Out.
          *   Case 2: Metric Distortion (Goodhart) + Crowding Out.
          *   Case 3: Bureaucratization/Trust Erosion.
      *   **Proposed Name (if needed):** "Normative Displacement" or "The Stewardship Trap." (Actually, sticking to established theory is better, but offering a synthesized term helps the user argue). Let's suggest **"Formalization-Induced Norm Erosion"**.
      *   **Boundary Cases:**
          *   Rewards = Yes (Overjustification).
          *   Metric Improves = Yes (That's the seduction).
          *   Toxic Norms = Nuanced. The *mechanism* is the same, but the *trade-off* changes.

  9.  **Refining the Argument for the Board Meeting:**
      *   The user needs ammo.
      *   Key point: Fines change the *frame* from moral/social to market/legal.
      *   Key point: You can buy compliance, but you can't buy care.
