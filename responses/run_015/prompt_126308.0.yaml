answer: |-
  **Scenario**

  In 2020, State X led a UN-authorized humanitarian intervention in Republic Z to overthrow a genocidal junta. Successful but destabilizing, the power vacuum triggered civil strife, displacing 40,000 citizens to a neutral border zone. X remains economically robust, capable of absorbing the group without strain. However, the conflict in Z has stalled; return is physically possible but economically blocked because State Y maintains a strict customs embargo on Z's goods to pressure human rights reforms, inadvertently freezing the reconstruction required for safe repatriation. Y could lift specific exemptions at moderate political cost to allow returnees to reintegrate, but refuses. The refugees remain in limbo. X claims no further duty; Y claims no initial responsibility. The camp persists due to Y's ongoing embargo policy, not X's original intervention.

  **Demonstration of Principles**

  *   **Trigger Liability:** Assigns duty to **X**. X's intervention initiated the causal chain (intervention → vacuum → strife → displacement). Even if well-motivated, X broke Z, making X liable for the fallout.
  *   **Capacity:** Assigns duty to **X**. X is explicitly "economically robust" and can absorb the group "without strain," whereas Y faces "political cost" and Z is collapsed. X is the least-cost absorber.
  *   **Sustaining-Cause:** Assigns duty to **Y**. The *current* barrier preventing resolution (return to Z) is Y's embargo. Y holds the key to ending the displacement now at moderate cost. By refusing to unlock the door home, Y assumes responsibility for housing those locked out.

  **Honest Bits**

  *   **Key Feature:** The separation of *originating cause* (X's past intervention) from *current barrier* (Y's present policy). The split relies on Y having independent agency over the *resolution* distinct from X's agency over the *origin*.
  *   **Deletion Test:** If you delete Y's embargo, refugees return home; the allocation question vanishes. If you delete X's intervention, no refugees exist. The three-way split collapses into a two-way fight (Trigger vs. Capacity) if Y's policy is merely reactive or if Y lacks the power to enable return.
  *   **Trigger Counterargument:** A trigger defender argues Y's embargo is only relevant because X created the instability. Y's policy is a reaction to X's mess; therefore, Y's sustaining condition is downstream of X's trigger. X owns the entire chain, including Y's reaction.
  *   **Final Read:** Sustaining-cause is genuinely distinct. Trigger liability looks backward at fault for the *problem*; sustaining-cause looks forward at control over the *solution*. It shifts the normative weight from "who broke it" to "who holds the glue." It prevents states from weaponizing inaction (refusing to lift barriers) to shift burdens onto historically liable but currently powerless actors. It is not relabelling; it is a different temporal coordinate.
