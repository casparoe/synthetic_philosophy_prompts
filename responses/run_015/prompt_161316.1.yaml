answer: |-
  Your hypothesis is correct: the impasse persists because the debate treats the **Constitution**, **Coverage**, and **Character** questions as a single package deal, when they are logically separable. The standard objections recur without resolution because each side uses arguments targeting one question to defeat claims made about another.

  Your three-question split accurately relocates the standard objections. The **regress worry** is indeed a challenge to *Constitution*: if consciousness requires a higher-order state, must that state be conscious? If yes, regress; if no, why does the first state need it? This targets the metaphysical ground of consciousness. The **mismatch and targetless representation** cases (the "problem of the rock") are primarily challenges to *Character*: if the higher-order representation misrepresents the first-order state, what is the experience like? If the experience matches the higher-order content, then consciousness is determined by the higher-order state (supporting HO Character), but this creates a tension with the intuition that consciousness should be veridical regarding the world (supporting FO Character). Finally, disputes over **blindsight and absent-minded driving** are purely about *Coverage*: is there phenomenology present without report/access?

  The **content-swap subject** case you stipulate is a powerful diagnostic tool because it breaks the covariance between first-order and higher-order states. In standard cases, FO and HO contents align, allowing theorists to conflate Constitution and Character. In your swap case (FO=Green, HO=Red), the theories diverge sharply on *Character* while potentially agreeing on *Constitution* (since both systems are active). A Higher-Order theorist is committed to the subject experiencing *Red* (Character follows the HOR). A First-Order theorist is committed to the subject experiencing *Green* (Character follows the FOR). If both agree the state is conscious (Constitution settled by the presence of both systems), the disagreement reveals that the core dispute is often not about *whether* a state is conscious, but *what determines its phenomenology*. This suggests that much of the "Constitution" debate is actually a disguised debate about Character.

  Regarding the **neural marker**: such a marker could not settle the *Constitution* question in principle. A marker is a correlate; to interpret it as a marker of *consciousness* rather than merely *reportability* or *access*, one must already have a pre-theoretical criterion for consciousness (calibration). If the marker is calibrated against report, it settles *Coverage* relative to Access-Consciousness. If it appears when the subject denies the state, it highlights the gap between Access and Phenomenal Consciousness (Block's distinction). It cannot settle *Character* at all, as neural activity does not intrinsically specify qualitative content without an interpretive bridge. It cannot settle *Constitution* because correlation is not metaphysical ground; knowing *when* consciousness occurs does not explain *what it is*.

  Is the dispute verbal? Substantially, yes, but not merely. It is a disagreement about **different questions under one label**. The word "conscious" is doing triple duty: naming a metaphysical status (Constitution), delineating a set of states (Coverage), and specifying a qualitative nature (Character). The sides differ on explanatory standards: HO theorists prioritize explaining *subjectivity* (the "for-me-ness"), which leans on Constitution/Character via representation. FO theorists prioritize explaining *perceptual richness*, which leans on Coverage/Character via first-order content. Because they treat these distinct explanatory goals as a single target ("consciousness"), they talk past one another. Progress requires decoupling the questions: acknowledging that a theory might explain how a state becomes *available* (HO/Access) without explaining how it becomes *phenomenal* (FO/P-conscious), or vice versa. The impasse will not end via experiment alone, because the theories are frameworks for interpreting data, not predictions of raw correlates. It ends only by disaggregating the questions your hypothesis identifies.

  \answer{different questions under one label}
