answer: |-
  This is a sophisticated pedagogical design. You are asking students to inhabit a reasoning pattern (adaptationism) until they feel its friction, rather than telling them where the friction lies. This is the Socratic method applied to philosophy of science.

  Below is the complete kit for your session. It is designed to be tight; 70 minutes is aggressive for four rounds of group work, so you must be a ruthless timekeeper.

  ### I. Materials: The Trait Packet

  Print these on separate slips of paper. You have 16 students in 4 groups. You need 8 slips total. **Crucial:** Distribute them so that every group receives exactly **one Real** and **one Invented** trait. Do not tell them this yet.

  **Instructions for the Convenor:**
  *   **Register:** Keep the language dry. Do not use words like "evolution," "survival," or "brain" in the trait descriptions.
  *   **Verification:** I have selected these based on general scientific consensus vs. common myths, but you must verify them before the session. If you find a paper supporting a "fake" trait, swap it.
  *   **Security:** Collect phones during the session. If a student Googles "Do humans sleep north-south?" during Round 2, the activity collapses.

  **The Traits (Cut these out)**

  1.  **Trait A:** A strong preference for foods high in sugar and fat, even when caloric needs are currently met. *(Real)*
  2.  **Trait B:** A tendency to orient the head toward magnetic North while sleeping. *(Invented)*
  3.  **Trait C:** Visual systems that detect snake-like curves faster than straight lines or other shapes. *(Real)*
  4.  **Trait D:** Increased irritability and aggression in males when barometric pressure drops. *(Invented)*
  5.  **Trait E:** Nausea and vomiting occurring primarily during the first trimester of pregnancy. *(Real)*
  6.  **Trait F:** A universal tendency to begin counting on fingers starting with the pinky. *(Invented)*
  7.  **Trait G:** A psychological bias to trust individuals who speak with the same accent as oneself. *(Real)*
  8.  **Trait H:** A brief, involuntary holding of breath when walking past dark, enclosed entryways. *(Invented)*

  **Verification Notes for You (Do Not Distribute):**
  *   **Real A:** Well-documented "mismatch" theory.
  *   **Real C:** Öhman & Mineka (2001) preparedness theory.
  *   **Real E:** Profet's embryo protection hypothesis (standard textbook example).
  *   **Real G:** Social identity theory/evolutionary roots of tribalism.
  *   **Fake B:** A common myth; no robust evidence for magnetic orientation in human sleep. *If you find a niche paper claiming this, swap for: "Tendency to hum when anxious."*
  *   **Fake D:** "Weather pain" is reported but meta-analyses show weak/no correlation for aggression. *If challenged, emphasize the "aggression" link is the unproven part.*
  *   **Fake F:** Finger counting starts vary culturally (thumb vs. index vs. pinky). It is not universal.
  *   **Fake H:** Invented for this exercise. It sounds like pathogen avoidance but is not a documented universal reflex.

  ---

  ### II. Timeline (70 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Intro** | Seating, phone collection, distribution of Trait Packets. |
  | **00:05 – 00:15** | **Round 1** | **Neutral Explanation.** "Why does this exist?" (No evolution mentioned). |
  | **00:15 – 00:30** | **Round 2** | **Adaptation Story.** "Assume this is an adaptation." Write the story. |
  | **00:30 – 00:35** | **The Reveal** | **Real vs. Fake.** Announce half are invented. Groups compare confidence. |
  | **00:35 – 00:45** | **Round 3** | **The Opposite.** "Explain the reverse trait." |
  | **00:45 – 01:00** | **Round 4** | **Falsification.** "What would prove this wrong?" |
  | **01:00 – 01:10** | **Debrief** | **Vocabulary & Mapping.** Connect experiences to philosophical concepts. |

  ---

  ### III. Scripts: Instructions to Read Aloud

  **Intro (00:00)**
  "Welcome. Today we are investigating how we explain human behavior. I am going to give you a series of observations about human beings. Your job is not to judge whether they are true or false yet. Your job is to explain them. I ask that you keep your phones away. We are relying on reasoning today, not search engines."

  **Round 1 Instructions (00:05)**
  "Each group has two traits. You have ten minutes. For each trait, write down the most convincing explanation you can for why humans do this. You may use any kind of reasoning: biological, social, practical, or historical. Do not worry about proving it. Just make the story make sense. Go."

  **Round 2 Instructions (00:15)**
  "Keep your same traits. You have fifteen minutes. This time, I want you to change your lens. Assume that each trait is an **adaptation**. Assume that at some point in human history, this specific behavior helped people survive or reproduce better than those who didn't have it. Write the story of *how* it helped. Be specific about the problem it solved. Go."

  **The Reveal (00:30)**
  "Stop writing. Here is the complication: In the packet you were handed, half of the traits are real, well-documented human behaviors. The other half are invented by me. I will not tell you which is which yet. Look at the stories you just wrote for your two traits. Did you write a better story for one than the other? Or were they equally convincing?"
  *(Pause for 30 seconds of group murmur. Do not let them debate which is real yet.)*
  "Keep that feeling. We will return to it."

  **Round 3 Instructions (00:35)**
  "Take one of your two traits. You have ten minutes. Imagine the **opposite** trait exists. If your trait was 'fear of snakes,' the opposite is 'attraction to snakes.' If it was 'preference for sugar,' the opposite is 'aversion to sugar.' Your job is to write an adaptation story for this *opposite* trait that is just as convincing as the first one. Go."

  **Round 4 Instructions (00:45)**
  "Look at your original adaptation story from Round 2. You have fifteen minutes. I want you to stop trying to prove it right. Instead, tell me how to prove it **wrong**. What observation could you make, what measurement could you take, or what comparison could you find that would force you to throw this story in the trash? Be specific. If you say 'no evidence,' that is not an answer. What evidence? Go."

  **Debrief Intro (01:00)**
  "Put down your pens. We are going to talk about what happened."

  ---

  ### IV. Debrief Guide (Mapping Experience to Concepts)

  Do not lecture. Ask questions that lead them to the vocabulary. Write the vocabulary on the board *only after* they describe the feeling.

  **1. The Real/Fake Reveal (Addressing Round 2)**
  *   **Ask:** "Now I will tell you which were real. [List them]. How many groups wrote a confident adaptation story for a fake trait?"
  *   **The Point:** Plausibility is not Truth.
  *   **The Vocabulary:** Write **"Just-So Story"** on the board.
  *   **Say:** "When we can construct a plausible narrative for a fact that isn't true, the narrative itself isn't doing any work. This is the critique Gould and Lewontin made in 1979. If the story fits the data perfectly but the data was made up, the story is unfalsifiable."

  **2. The Opposite Game (Addressing Round 3)**
  *   **Ask:** "How many groups found it easy to explain the opposite trait? Did anyone find a trait where the opposite was *impossible* to explain?"
  *   **The Point:** Symmetry of Explanation.
  *   **The Vocabulary:** Write **"Predictive Power"** on the board.
  *   **Say:** "If a theory can explain X, and it can also explain Not-X with equal ease, it predicts nothing. A hypothesis that accommodates every possible outcome is not a scientific hypothesis; it is a description."

  **3. The Falsification Struggle (Addressing Round 4)**
  *   **Ask:** "Which was harder: writing the story, or figuring out how to break it? For which traits was it impossible to name a refutation?"
  *   **The Point:** Testability varies by trait.
  *   **The Vocabulary:** Write **"Falsifiability"** on the board.
  *   **Say:** "Some traits resist testing because they rely on unobservable past environments. Others rely on mechanisms we can measure today. The ones you struggled to falsify are the ones where the 'Just-So' critique bites hardest."

  **4. Alternative Explanations (Addressing Round 1 vs 2)**
  *   **Ask:** "In Round 1, before I said 'adaptation,' did anyone suggest the trait might be a side-effect of something else, or learned culturally?"
  *   **The Point:** Not everything is an adaptation.
  *   **The Vocabulary:** Write **"Spandrel / By-product"** and **"Cultural Transmission"** on the board.
  *   **Say:** "Evolutionary explanations fail when they attach an adaptive story to a trait that is actually a by-product (a spandrel) or a cultural meme. The adaptationist lens can blind you to non-adaptive causes."

  **Closing Statement (01:08)**
  "We are not concluding that evolutionary psychology is fake. We are concluding that *reconstructing* the past is hard. Good evolutionary science makes risky predictions about the present—like Trait C (snake detection), which we can test in labs today. Bad evolutionary science makes untestable stories about the past. Your job as philosophers of science is not to reject evolution, but to demand the risky predictions."

  ---

  ### V. Troubleshooting: What Will Go Wrong

  **1. The "Wikipedia" Student**
  *   **Risk:** One student has read Gould or listened to a podcast on this topic. They will say, "This is just the Spandrels critique," in Round 2.
  *   **Fix:** Acknowledge them, but defer. "You know the vocabulary. Excellent. For this round, I need you to play the game without using the labels. Save the critique for the debrief. I need you to help your group feel the difficulty, not name it."

  **2. The "Empirical Smugglers"**
  *   **Risk:** Groups will sneak real knowledge into the Fake traits. (e.g., "Barometric pressure affects joints, so maybe aggression...")
  *   **Fix:** During the Reveal, highlight this. "Notice how you used real biology to prop up the fake trait? That is exactly how a Just-So story works. It borrows credibility from adjacent truths."

  **3. The Cynical Collapse**
  *   **Risk:** After the Reveal, a student says, "So we can't know anything about human evolution. It's all guesses."
  *   **Fix:** Use the Closing Statement. Distinguish between *physiological* evolutionary biology (antibiotic resistance, anatomy) which is testable, and *behavioral reconstruction* which is the specific problem today. "We aren't saying evolution didn't shape the brain. We are saying 'storytelling' isn't the way to prove it."

  **4. Time Overrun**
  *   **Risk:** Round 4 (Falsification) is cognitively difficult. They will stall.
  *   **Fix:** If you hit 01:00 and they are still writing Round 4, cut the debrief short and assign the vocabulary as a takeaway. It is better to finish the activity than to rush the thinking.

  **5. The "Real" Traits Turn Out Controversial**
  *   **Risk:** A student challenges "In-group bias" or "Morning sickness" as not being universal or adaptive.
  *   **Fix:** Concede the point. "You are right. Even the 'Real' traits are debated. That proves the point: if the 'Real' ones are debated and the 'Fake' ones sounded plausible, the difficulty lies in the *method* of storytelling, not just the data."

  ---

  ### VI. Limitations: What This Activity Cannot Do

  You must supply these points yourself in the final minutes, as the activity is designed to generate skepticism, not balance.

  1.  **It does not teach Comparative Method:** The activity isolates the groups. Real evolutionary psychology often uses cross-species comparison (e.g., comparing primate grooming to human gossip). The activity makes it look like we only have human data.
  2.  **It does not teach Genetics:** Modern evolutionary behavioral science looks for heritability estimates. This activity treats traits as black boxes.
  3.  **It risks Equivocation:** Students may leave thinking "Adaptation" means "Good" or "Conscious." You must ensure the debrief clarifies that adaptation means "increased reproductive frequency," not "moral good" or "conscious choice."
  4.  **It creates a False Dichotomy:** The activity pits "Adaptation" against "Fake." In reality, a trait can be *both* adaptive and culturally transmitted (gene-culture coevolution). The activity simplifies this to make the philosophical point clear.

  **Final Advice:**
  Your role is not to be the expert, but the referee of the process. If they argue about whether a trait is real, stop them. "The truth of the trait is not the point. The truth of the *reasoning* is the point." If you maintain that boundary, they will leave with the philosophical distinction you want.
