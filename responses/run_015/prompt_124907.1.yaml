answer: |-
  Hi

  I read through your eight points and I can see why the argument went sideways. You have built a framework that looks like classical liberalism on paper but produces conservative outcomes in practice, and that is exactly where your friend pounced. You asked me to check the tensions, order them by severity, suggest fixes, and tell you straight if your friend is right, so I will do that without softening the blow.

  The most severe tension in your list is between points one, two, five, and eight on one side, and points six and seven on the other. Points one, two, five, and eight are standard Hartian liberal principles. They say the law should only stop harm, disgust is not enough, there is no single morality to enforce, and adults can consent to their own ruin. Points six and seven are specific judgments that violate those principles. You want to ban incest and kin-for-hire despite no direct harm, no coercion, and full consent. This is the core contradiction. You are claiming the rules of the game are liberal, but you are making moves that require a different rulebook. The cheapest fix here is to redefine harm in point one to include damage to social institutions like the family. If you say that incest or contracted kinship harms the institution of the family even if no individual is hurt, then points six and seven fit under point one. The cost of this fix is that you effectively concede the argument to your friend. You become a legal moralist who believes society can protect its structure even against willing participants, which is exactly what Lord Devlin argued.

  The second worst tension is between point four and point five. Point four says the law has an expressive job to teach people what is acceptable. Point five says you reject enforcing a constitutive morality because society is too pluralistic to have one. If the law teaches acceptability, it is enforcing a morality. If there is no shared morality to enforce, the law cannot teach it without imposing one group's views on another. The cheapest fix is to clarify point four to say the law teaches procedural morality, like do not harm others, rather than substantive morality, like what makes a good life. The cost is that this weakens your justification for banning the kin company. You cannot say the ban teaches people that family must be biological without violating point five.

  The third tension is between point one and point three. Point one says you need harm to criminalize. Point three says you are fine banning public indecency even when no one is around to be offended. If no one is around, there is no victim and no harm in the standard sense. This is a classic puzzle in legal philosophy. The cheapest fix is to argue that public spaces carry an implicit contract of consent, so violating that contract is a harm to the public order. The cost is minimal here, as most liberals accept public order exceptions, but it does stretch the definition of harm.

  If you want the single revision that cleans up the most inconsistency, you should amend point one. Change it to say criminal law needs harm to others or damage to essential social institutions that everyone relies on. This allows you to keep the incest ban and the kin company ban without contradicting your harm principle. However, you must understand what this costs you. It costs you the ability to claim you are not a legal moralist. It opens the door for others to ban things you might like by claiming they damage social institutions. It is a powerful tool, but it is the tool your friend accused you of wielding.

  To answer your final question straight: yes, your friend is right. You have ended up as a legal moralist without noticing. You are using the vocabulary of Hart and Wolfenden to protect liberal freedoms, but your intuitions on specific cases are driven by a belief that certain social forms are sacred and must be protected from erosion, even by consent. That is the Devlin position. Devlin argued that society has a right to protect its moral fabric just as it has a right to protect its government from treason. You are arguing that the kin company is a kind of treason against the idea of family. There is nothing wrong with holding that view, but you cannot hold it while claiming that only harm to individuals justifies criminal law. You need to choose whether you are a liberal who tolerates things that make your skin crawl, or a communitarian who believes some structures are off limits regardless of consent. Right now you are trying to be both, and that is why you lost the argument.

  Best
