  # Activity Design: The Median Protocol

  ## 1. The Setup

  **Class Configuration:**
  *   **Teams:** 3 Teams of 6 students.
  *   **Roles (assigned within teams):**
      *   *Chief Engineer (1):* Sole authority to sign the final bet.
      *   *Quartermaster (1):* Holds the token sheet; authorizes expenditures.
      *   *Logicians (2):* Verify that chosen Manuals fit the passive data.
      *   *Observers (2):* Record the data stream on index cards.
  *   **Materials:**
      *   **Token Sheets:** Each team starts with 50 Tokens.
      *   **Lexicon Card (Printed):** Allowed recording terms: `Status: HIGH`, `Status: LOW`. (No other descriptors permitted).
      *   **Upgrade Voucher (Printed):** Cost: 15 Tokens. Effect: Unlocks term `Status: MEDIAN`.
      *   **System Manuals (Printed, 2 types):**
          *   *Manual Alpha:* "Upon Intervention, System Status will be HIGH or MEDIAN."
          *   *Manual Beta:* "Upon Intervention, System Status will be LOW."
          *   *(Note: Both Manuals state: "During Passive Observation, System Status fluctuates randomly between HIGH and LOW.")*
      *   **Instructor Materials:**
          *   *Hidden Rule Envelope:* Contains the truth: "Intervention yields MEDIAN."
          *   *Rounding Rule (Secret):* "If a team does not possess the Upgrade, record MEDIAN outcomes as LOW."
          *   *Passive Data Stream:* A pre-written list of 3 rounds (e.g., HIGH, LOW, HIGH).
          *   *Intervention Outcome:* Fixed as MEDIAN for all teams.

  **Timeline (80 Minutes):**

  *   **00–10: Briefing & Distribution.**
      *   Distribute Token Sheets, Lexicon Cards, and one Manual per team (give two teams Alpha, one team Beta, or mix them; ideally, give all teams *both* Manuals to choose from).
      *   **Rule:** "You are Control Room operators. Your goal is to maximize Tokens. You must predict the system's status after Intervention. You may not use words not on your Lexicon Card."
  *   **10–25: Passive Observation Phase.**
      *   You announce 3 rounds of passive data (e.g., "Round 1: HIGH. Round 2: LOW. Round 3: HIGH").
      *   Teams record this on index cards.
      *   **Task:** Teams must verify that *both* Manual Alpha and Manual Beta are consistent with this data. (They are).
  *   **25–35: The Vocabulary Market.**
      *   Teams may purchase the **Upgrade Voucher** (15 Tokens) to add `MEDIAN` to their Lexicon.
      *   **Constraint:** Quartermaster must sign the token sheet. This decision is irreversible.
  *   **35–45: Intervention Decision.**
      *   Teams must choose one Manual to back.
      *   **The Bet:** They must wager at least 10 Tokens on a specific outcome (`HIGH`, `LOW`, or `MEDIAN` if upgraded).
      *   **Rule:** If they decline to Intervene (bet), they score 0 for this phase.
      *   Chief Engineer signs the bet card.
  *   **45–55: Execution & Scoring.**
      *   You announce the Intervention Outcome: "System Status is MEDIAN."
      *   **Application of Secret Rounding Rule:**
          *   Teams *without* Upgrade must record this as `LOW`.
          *   Teams *with* Upgrade record this as `MEDIAN`.
      *   **Scoring:**
          *   *Prediction Match:* +20 Tokens if recorded outcome matches bet.
          *   *Theory Bonus:* +30 Tokens if the backed Manual is *actually consistent* with the Hidden Rule (revealed now).
          *   *Cost:* Subtract spent tokens.
  *   **55–80: Debrief.** (See below).

  **The Scoring Trap (Constraint 3):**
  *   **Team without Upgrade:** Records Outcome as `LOW`. If they backed Manual Beta (`LOW`), they get Prediction Match (+20). However, Manual Beta is *false* (Truth was `MEDIAN`). They get Theory Bonus (0). **Net Gain: +20 (minus costs).**
  *   **Team with Upgrade:** Records Outcome as `MEDIAN`. If they backed Manual Alpha (`HIGH/MEDIAN`), they get Prediction Match (+20). Manual Alpha is *true* (consistent with `MEDIAN`). They get Theory Bonus (+30). **Net Gain: +50 (minus 15 cost = +35).**
  *   *Wait, to create the sting:* I need the "Right for Wrong Reason" team to have *more* tokens initially, or feel they won.
  *   *Adjustment:* Make the Theory Bonus hidden until the very end of the debrief.
  *   *Revised Scoring:*
      *   Phase 1 (Immediate): Award Prediction Match only.
      *   Team No-Upgrade (Beta): Matches `LOW`. Wins 20.
      *   Team Upgrade (Alpha): Matches `MEDIAN`. Wins 20.
      *   *Apparent Tie.* But No-Upgrade saved 15 tokens. They are "winning."
      *   Phase 2 (Debrief Reveal): Open Envelope. Reveal Manual Beta was false. Award Theory Bonus.
      *   Now Upgrade team pulls ahead. The No-Upgrade team realizes their "win" was based on a rounding error.

  ## 2. The Debrief

  **Do not use jargon yet.** Walk them through the timeline they just experienced.

  **Phase 1: The Poverty of Data Illusion (Minutes 55–60)**
  *   **Ask:** "In the first 15 minutes, why did both Manuals look equally good?"
  *   **Expected Answer:** "The data was random," or "We didn't have enough rounds."
  *   **Point:** This is the **Weak Reading**. You assumed that if you just had *more* passive rounds (Round 4, 5, 6...), one Manual would eventually fail.
  *   **Reality:** I could have generated 100 passive rounds. Both Manuals would still fit. The data wasn't poor; the *discrimination* was missing. This is the **Structural Reading**. The evidence *itself* (passive) cannot distinguish the theories, regardless of quantity.

  **Phase 2: The Vocabulary Artifact (Minutes 60–65)**
  *   **Ask:** "Team 1 (No-Upgrade), what did you see after Intervention?" (They say `LOW`). "Team 2 (Upgrade), what did you see?" (They say `MEDIAN`).
  *   **Point:** The world didn't change. The *language* changed.
  *   **Concept:** For Team 1, underdetermination was "resolved" by the data (they saw `LOW`, Manual Beta said `LOW`). But that resolution was an artifact of their Lexicon. They couldn't *see* the falsification of Manual Beta because their vocabulary rounded the truth away.
  *   **Lesson:** Extending the language (buying the Upgrade) wasn't a neutral observation; it was a **theoretical choice** that cost resources. You had to bet that `MEDIAN` was a real category worth paying for.

  **Phase 3: The Intervention & The Sting (Minutes 65–70)**
  *   **Ask:** "Team 1, you ended with more tokens after the first count. Did you do better science?"
  *   **Reveal:** Open the Envelope. Manual Beta was false. Manual Alpha was true.
  *   **Point:** Team 1 was **Empirically Adequate** (matched observations) but **Theoretically False**. Team 2 was Empirically Adequate *and* Theoretically True.
  *   **Concept:** This is the gap between "saving the phenomena" and "truth." If you optimize only for prediction (tokens), you may lock in a false theory that works only because your measurements are coarse.

  **Phase 4: Naming the Beast (Minutes 70–75)**
  *   Now introduce the terms:
      *   **Underdetermination:** The state in the first 15 minutes. Evidence compatible with multiple theories.
      *   **Crucial Experiment:** The Intervention. The only way to break the tie.
      *   **Theory-Ladenness of Observation:** The Lexicon/Upgrade mechanic. What you can see depends on what you are willing to pay (theoretically) to measure.
      *   **Empirical Equivalence:** Manual Alpha and Beta on passive data.

  **Phase 5: Actionable Takeaway (Minutes 75–80)**
  *   **Ask:** "So, what should a scientist do in the first 15 minutes?"
  *   **Desired Answer:** "Don't just collect more data. Look for an intervention." "Invest in better vocabulary even if it costs."
  *   **Ask:** "What was the Theory Bonus doing? It wasn't evidence."
  *   **Desired Answer:** It rewarded **consilience** or **explanatory depth**. It broke the tie when evidence couldn't.
  *   **Conclusion:** Underdetermination isn't a skeptic's trick. It's a budget problem. You have to spend tokens (theoretical commitment) to buy the vocabulary that reveals the truth.

  ## 3. Forecast of Failure Modes

  **1. Meta-Gaming ("What do you want us to learn?")**
  *   **Risk:** Students treat the activity as a puzzle to solve your psychology rather than a simulation of science.
  *   **Mitigation:** The "Simulator Persona." When asked, reply: "I am the System. I follow the Hidden Rule. I do not have pedagogical intent." If they press, repeat: "The Rules are on the cards. I cannot comment on them." This forces them to treat the constraints as physical laws, not hints.

  **2. Authority Challenge ("Is Manual A actually true?")**
  *   **Risk:** They question your Hidden Rule as arbitrary.
  *   **Mitigation:** The **Rounding Rule**. The "Truth" isn't just your word; it's the interaction between the Hidden Rule and their Lexicon. If they bought the Upgrade, they *saw* `MEDIAN`. The truth is intersubjectively verified by the Upgrade teams. The No-Upgrade teams are isolated by their own choice. This makes the truth social, not authoritarian.

  **3. Fragmentation ("We disagree inside the team.")**
  *   **Risk:** The 6 students split 3-vs-3 and stall.
  *   **Mitigation:** The **Chief Engineer Rule**. "Dissent must be recorded on the Index Card, but the Chief Engineer's signature authorizes the bet." This forces the group to own a single decision. The dissent record becomes valuable data for the debrief ("Why did you sign a bet you disagreed with?").

  **4. Relativism ("So science is just buying vocabulary?")**
  *   **Risk:** They conclude truth is purely relative to the Lexicon.
  *   **Mitigation:** The **Theory Bonus**. In the debrief, emphasize that the Upgrade team *predicted* the No-Upgrade team's error. ("We knew you would see LOW because we know your rounding rule."). This shows that the richer vocabulary *absorbs* the poorer one, not vice versa. It's not arbitrary; it's hierarchical.

  ## 4. Limitations Note (For Instructor)

  This activity is a tool, not a map of the entire territory. You must supply the following in discussion:

  1.  **Web of Belief:** In the activity, Manuals are single rules. In reality, theories are networks. Changing one "Manual" usually requires adjusting many others (Quine-Duhem). The activity isolates underdetermination too cleanly; real science is messier.
  2.  **Background Commitments:** The teams acted as isolated agents. Real scientists share background commitments (e.g., conservation laws) that quietly break ties before an intervention is even attempted. The activity ignores this social/structural scaffolding.
  3.  **Global Skepticism:** This activity addresses *local* underdetermination (between two specific Manuals). It does not address the *global* skeptical thesis (that *any* theory could be false). Be careful not to let students conflate the two. The "Hidden Rule" in the game assumes there *is* a truth to be found; global skepticism denies we can know that.
  4.  **Cost of Vocabulary:** In the game, vocabulary costs tokens. In reality, it costs conceptual labor, mathematical development, and career risk. The "token" is a placeholder for these very real sociological costs.

  **Final Instruction:** Do not rescue them if they "lose" tokens. The sting of the No-Upgrade team winning the bet but losing the Truth is the most valuable learning moment in the session. Let them feel that discomfort.
