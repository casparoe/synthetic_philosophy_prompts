  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **Context:** Upper-division philosophy of science seminar (18 students, 80 mins, whiteboard, index cards, no computers).
      *   **Problem:** Students know the underdetermination thesis (UDT) but treat it as inert/Cartesian skepticism or confuse it with mere "poverty of data." They believe more data of the *same kind* would settle it.
      *   **Goal:** An activity where students *collide* with the gap between weak (temporary data lack) and strong (structural) underdetermination. No jargon (underdetermination, Quine, Duhem, grue) until debrief.
      *   **Constraint 1 (Actionable Divergence):** Rival accounts agree on all passive observations/predictions but disagree on *intervention* outcomes. Intervention has a cost. Decision must be made before knowing if it was worth it.
      *   **Constraint 2 (Fixed Vocabulary):** Observation categories are fixed on a printed list. New categories cost scarce tokens. Extending language is a theoretical choice/cost.
      *   **Constraint 3 (Payoff/Scoring):** Scored against a hidden data stream generated by the instructor. "Right for wrong reason" vs. "Right for right reason" distinction needs to be palpable.
      *   **Deliverables:** Setup (roles, timeline, materials, scoring, intervention rule), Debrief (mapping moments to concepts, then naming), Failure Forecast (meta-gaming, authority questioning, fragmentation, relativism), Limitations Note (webs of belief, background commitments, global skepticism).

  2.  **Deconstruct the Core Philosophical Problem:**

      *   The students think $E \to T$ is just blocked by noise. They think $E_{more} \to T$.
      *   I need to show that $E_{more}$ (of the *allowed* kind) *cannot* distinguish $T_1$ from $T_2$.
      *   To distinguish them, they need $E_{new}$ (new vocabulary), but acquiring $E_{new}$ costs resources and assumes a theoretical commitment (that the new category is real/useful).
      *   Intervention is key. $T_1$ says "If you push X, Y happens." $T_2$ says "If you push X, Z happens." But observing X and Y passively looks the same in both.
