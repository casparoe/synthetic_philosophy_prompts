prompt: |-
  I'm a PhD student working at the intersection of decision theory and ethics, and I've spent the better part of the last year trying to figure out where I stand on expected value fanaticism. The position, as I've come to understand it, is roughly this: if you accept that the rational choice is the one that maximizes expected value, and you refuse to place any principled upper bound on either the probability scale or the value scale, then you are committed to letting vanishingly small probabilities of arbitrarily large payoffs dominate your practical reasoning. A one-in-a-googolplex chance of preventing an astronomical amount of suffering would, on this view, outweigh the certain prevention of a single headache — and indeed would outweigh any finite amount of ordinary suffering prevented with certainty. I find myself drawn to the view because the alternatives seem to involve either an unmotivated cap on value (why this bound rather than that one?) or a departure from expected value maximization that looks ad hoc when examined closely. And I'm not satisfied by appeals to what we would or wouldn't do in practice; the view is making a claim about the structure of practical rationality, not about human psychology.

  What I want — and what I haven't found a clear treatment of — is a systematic map of what would count against this position. Not a list of objections I can bat away, but an honest survey of the evidence, arguments, formal results, and conceptual considerations that should genuinely move someone who currently accepts fanatical expected value reasoning. I want to know which defeaters would be decisive (they would force me to abandon the view), which would be merely awkward (they would require significant qualification but leave something recognizable intact), and which are often presented as defeaters but on closer inspection beg the question or miss the point. I'm especially interested in whether the view makes any predictions that differ from its rivals in a way that could in principle be checked — or whether it has been insulated against empirical disconfirmation entirely. If the latter, I want to know whether that insulation is a problem for a view about the norms of practical reason, or whether it's exactly what we should expect. And I'd like to know which of these costs the view's defenders would themselves concede as genuine, as opposed to what critics claim the view is committed to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in decision theory/ethics. Deeply familiar with the literature (likely knows Beckstead, Greaves, MacAskill, Weirich, etc.).
      *   **Topic:** Expected Value (EV) Fanaticism (often called "Strong Longtermism" or "Pascalian Reasoning" in this context).
      *   **Core Position:** Rational choice = EV maximization + Unbounded utility/probability $\rightarrow$ Tiny probabilities of huge value dominate.
      *   **User's Stance:** Leaning towards fanaticism. Finds alternatives (bounded utility, non-expected utility theories) unmotivated or ad hoc. Dismisses purely psychological objections ("we wouldn't actually do that").
      *   **Goal:** A *systematic map* of defeaters. Not a hit-list to knock down, but an honest survey of what *should* move them.
      *   **Specific Criteria:**
          *   Distinguish decisive defeaters vs. awkward qualifications vs. question-begging objections.
          *   Address empirical checkability/falsifiability (insulation vs. normativity).
          *   Distinguish what defenders concede vs. what critics claim.
          *   Focus on the *structure of practical rationality*.

  2.  **Deconstruct the Position (Fanaticism):**
      *   Premise 1: Expected Utility Theory (EUT) is the correct norm for rational choice.
      *   Premise 2: Utility functions are unbounded (no lexical priorities, no caps).
      *   Premise 3: Probabilities are never exactly zero (unless logically impossible).
      *   Conclusion: sufficiently large $V \times p$ outweighs any certain finite $V'$.

  3.  **Brainstorming Categories of Defeaters:**
      *   *Formal/Mathematical:* St. Petersburg paradox, infinite utilities, integration issues.
      *   *Epistemic:* Can we actually assign probabilities to such claims? (Epistemic humility, cluelessness).
      *   *Decision-Theoretic:* Money pumps, dynamic inconsistency, separability.
      *   *Ethical/Normative:* Repugnant conclusions, alienation from moral intuition (though user is wary of this).
      *   *Metaphysical:* Nature of value, person-affecting views.
      *   *Structural:* The "insulation" problem (is it unfalsifiable?).

  4.  **Filtering for the User's Level:**
      *   Avoid basic intros to EUT.
      *   Cite specific authors (Beckstead & Thomas, Russell, Isaacs, Hájek, Nover & Hájek, Smith).
      *   Focus on the *tension* points, not just "it feels wrong."
      *   Address the "insulation" question directly (is normativity empirical?).

  5.  **Drafting the Map (Iterative Process):**

      *   *Category 1: The Formal/Mathematical Constraints (Decisive Potential).*
          *   If utility is unbounded, does EUT break? Yes, St. Petersburg variants.
          *   *Key Argument:* Nover & Hájek (2004), Hájek (2019). If you allow unbounded utility, you face games with undefined expected value.
          *   *Defeater Status:* **Decisive** *if* one holds that rationality requires a complete ordering. If EV is undefined, EUT cannot guide action.
          *   *Defender Concession:* Many accept "Weak Fanaticism" or truncate probabilities to avoid undefined integrals.

      *   *Category 2: The Epistemic/Cluelessness Objection (Awkward but manageable).*
          *   Can we justify $p > 0$ for astronomical claims?
          *   *Key Argument:* Greaves (on cluelessness), Russell (on epistemic barriers). If $p$ is not just small but *inscrutable*, EV calculation fails.
          *   *Defeater Status:* **Awkward.** Requires adding an epistemic layer to the decision theory. Doesn't kill fanaticism, but limits its scope to "robust" high-impact scenarios.
          *   *Defender Concession:* Defenders (Beckstead) admit we need robustness, not just raw EV.

      *   *Category 3: Dynamic Consistency & Money Pumps (Decisive Potential).*
          *   If you are a fanatic, can you be money-pumped?
          *   *Key Argument:* If you reject separability, you might avoid fanaticism, but at the cost of dynamic inconsistency.
          *   *Defeater Status:* **Decisive** *if* dynamic consistency is a requirement of rationality.
          *   *Nuance:* Some argue fanaticism *requires* rejecting separability (Russell).

      *   *Category 4: The "Insulation" Problem (Philosophical Methodology).*
          *   User asks: Is it insulated from empirical disconfirmation?
          *   *Analysis:* Normative theories aren't empirically falsifiable in the scientific sense. They are reflective-equilibrium tested.
          *   *Defeater Status:* **Not a defeater per se,** but a methodological warning. If it implies *nothing* about actual choices (because probabilities are always too vague), it's vacuous.
          *   *Key Concept:* Action-guidance. If the theory never tells you to do X over Y in the real world because the inputs are always contested, is it a theory of *practical* reason?

      *   *Category 5: Bounded Utility as a Rational Requirement (The Direct Attack).*
          *   User finds caps "unmotivated."
          *   *Counter:* Is boundedness a coherence constraint?
          *   *Key Argument:* Smith (2014), Russell (2023). Unbounded utility + EUT $\rightarrow$ Paradox. Therefore, rationality *requires* bounded utility.
          *   *Defeater Status:* **Decisive** *if* the formal paradoxes hold. This attacks Premise 2 directly.

      *   *Category 6: Probability Dilution / The "Any Hypothesis" Problem.*
          *   For every hypothesis $H$ that says "Do X for huge value," there is $H'$ that says "Do Y for huge value."
          *   *Key Argument:* Isaacs (2014). The "Pascalian Mugging" space is crowded.
          *   *Defeater Status:* **Awkward.** Suggests fanaticism leads to paralysis, not action.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the query. Validate the tension (formal elegance vs. practical absurdity).
      *   **Section 1: Formal Coherence (The "Hard" Defeaters).** Focus on St. Petersburg, undefined expectations, and the necessity of bounded utility for EUT to function.
      *   **Section 2: Epistemic Access (The "Soft" Defeaters).** Cluelessness, inscrutable probabilities, hypothesis crowding.
      *   **Section 3: Dynamic Rationality.** Money pumps, separability, and diachronic consistency.
      *   **Section 4: The Methodological Question.** Insulation, falsifiability, and action-guidance.
      *   **Section 5: Defender Concessions.** What do Beckstead/MacAskill actually grant? (Weak vs. Strong fanaticism).
      *   **Conclusion:** Summary of where the burden of proof lies.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate "Longtermism" with "Fanaticism." Longtermism can be non-fanatical (high prob, high value). Fanaticism is specifically about the *tiny prob, huge value* trade-off.
      *   *Correction:* Ensure I address the "unmotivated cap" worry. The argument isn't that we pick a cap arbitrarily, but that *coherence* forces a cap.
      *   *Tone:* Academic, rigorous, neutral but critical. Avoid "common sense" appeals.
      *   *Citations:* Need to be precise. Beckstead & Thomas (2021) "A Paradox of Tiny Probabilities and Enormous Values" is essential reading here. Russell (2023) "On the Infinite."

  8.  **Final Review against User Constraints:**
      *   Systematic map? Yes.
      *   Decisive vs. Awkward? Yes, categorized.
      *   Empirical checkability? Addressed in Methodology section.
      *   Defender concessions? Included.

  9.  (Final Polish): Ensure the distinction between *Weak Fanaticism* (some tiny prob matters) and *Strong Fanaticism* (any tiny prob matters if value is high enough) is clear, as defenders often retreat to Weak.

  *(Self-Correction on "Empirical Disconfirmation"):* I need to be careful here. Normative ethics isn't empirical. But the *inputs* (probabilities, causal claims) are. The theory is insulated from *normative* disconfirmation, but vulnerable to *input* skepticism. I must clarify this distinction.

  10. **Final Output Generation** (Proceed to draft response based on these thoughts).
answer: |-
  This is a precise and high-stakes question. You are asking for the "stress points" of the fanatic position—not the intuitive pushback (which you have rightly bracketed as psychological), but the structural, formal, and epistemic tensions that threaten the coherence of the view itself.

  Given your background, I will skip the introductory exposition of Expected Utility Theory (EUT) and focus on the specific fault lines in the literature. I have organized this map into three categories: **Formal Coherence** (decisive threats), **Epistemic Access** (qualifying threats), and **Methodological Status** (the insulation problem).

  ---

  ### I. Formal Coherence: The "Hard" Defeaters
  *These arguments attempt to show that Fanaticism + EUT is mathematically or logically incoherent. If successful, these are decisive; they force abandonment or radical revision of the formalism.*

  #### 1. The Undefined Expectation Problem (St. Petersburg Variants)
  **The Argument:** If you accept unbounded utility and EUT, you are vulnerable to games where the expected value is undefined (not infinite, but undefined due to oscillating series or lack of convergence). Nover & Hájek (2004) and Hájek (2019) demonstrate that with unbounded utility, one can construct lotteries where EUT fails to yield a verdict.
  **Why it matters:** EUT is supposed to be a complete guide to rational choice. If the expected value is undefined, the theory is silent. If you modify the theory to handle undefined values (e.g., via relative expectations or principal values), you often lose the linearity that makes EUT attractive in the first place.
  **Defeater Status:** **Decisive.** If you hold that rationality requires a complete ordering of options, unbounded utility is incompatible with standard EUT.
  **Defender Concession:** Most sophisticated defenders (e.g., Beckstead & Thomas 2021) concede this. They often retreat to **Weak Fanaticism** (there exists *some* probability/value pair that dominates) rather than Strong Fanaticism (for *any* probability, there is a value that dominates), or they accept that EUT needs modification in infinite contexts (e.g., Russell 2023).

  #### 2. The Bounded Utility Theorem
  **The Argument:** This is the direct counter to your worry about "unmotivated caps." The argument is that the cap is not motivated by intuition but by **coherence**. Smith (2014) and Russell (2023) argue that if you want to avoid the St. Petersburg paradoxes and money pumps, you *must* have a bounded utility function. The "cap" is the price of admission for a consistent decision theory.
  **Why it matters:** It turns your "unmotivated cap" objection on its head. The cap isn't arbitrary; it's a derived constraint of rational agency. To reject the cap is to reject the coherence of the agent.
  **Defeater Status:** **Decisive,** *provided* you accept that diachronic consistency (avoiding money pumps) is a requirement of rationality.
  **Defender Concession:** Defenders often bite the bullet on money pumps (arguing that rational agents can be pumped if the stakes are Pascal-like) or argue that the scenarios required to pump a fanatic are physically impossible (requiring infinite resources).

  #### 3. Dynamic Inconsistency and Separability
  **The Argument:** Fanaticism often requires rejecting **Separability** (the idea that the value of a sub-game shouldn't depend on the larger game it's embedded in). If you are a fanatic, you might choose $A$ over $B$ in isolation, but prefer $B$ over $A$ when embedded in a larger sequence to avoid a Pascal's Mugging later.
  **Why it matters:** Rejecting separability leads to dynamic inconsistency. You might plan to maximize EV today but violate that plan tomorrow when the probabilities shift slightly.
  **Defeater Status:** **Awkward.** It requires adopting a non-standard decision theory (like causal decision theory with specific constraints or "sophisticated choice" models). It leaves the view recognizable but significantly more complex.
  **Defender Concession:** Defenders (like MacAskill) often acknowledge this tension but argue that "resolute choice" (binding oneself to the initial plan) resolves it without abandoning fanaticism.

  ---

  ### II. Epistemic Access: The "Soft" Defeaters
  *These arguments grant the formal coherence of fanaticism but argue that the inputs required to trigger it are unavailable to agents. These do not kill the theory but limit its practical scope.*

  #### 1. The Cluelessness / Inscrutability Objection
  **The Argument:** Greaves (2016) and others argue that for astronomical claims (e.g., affecting $10^{50}$ lives), we are not just uncertain; we are **clueless**. We cannot assign a meaningful probability distribution. If the probability is not just small but *inscrutable*, the EV calculation is not "small number $\times$ big number"; it is "undefined $\times$ big number."
  **Why it matters:** Fanaticism relies on $p > 0$. If epistemic humility forces us to treat $p$ as an interval including 0 or as undefined, the dominance argument fails.
  **Defeater Status:** **Awkward.** It forces the fanatic to add an epistemic filter. The view becomes: "Maximize EV, but only where probabilities are robustly estimable." This saves the theory from absurdity but potentially neuters its longtermist implications.
  **Defender Concession:** **High.** Beckstead (2013) and MacAskill explicitly build in "robustness" requirements. They concede that raw EV is insufficient without epistemic stability.

  #### 2. Hypothesis Crowding (The "Any Hypothesis" Problem)
  **The Argument:** Isaacs (2014) and others note that for every hypothesis $H_1$ that says "Action A saves $10^{50}$ lives," there is a rival hypothesis $H_2$ that says "Action A *dooms* $10^{50}$ lives" (or that Action B does the saving). If we have no epistemic access to distinguish these, the expected value of *any* action sums to roughly zero (or undefined) across the space of all possible Pascalian hypotheses.
  **Why it matters:** It suggests fanaticism leads to **paralysis**, not action. If every action is correlated with some astronomical good and some astronomical bad via some tiny-probability chain, EV maximization cannot rank them.
  **Defeater Status:** **Awkward.** It requires the fanatic to argue that *some* hypotheses are more credible than others (breaking symmetry), which returns us to the Cluelessness objection.
  **Defender Concession:** Defenders argue that we *do* have asymmetries (e.g., physicalism vs. idealism, specific causal mechanisms), but they must defend why these asymmetries hold up under extreme scrutiny.

  ---

  ### III. Methodological Status: The Insulation Problem
  *You asked specifically about empirical disconfirmation and insulation. This is the meta-ethical layer.*

  #### 1. Normative Insulation vs. Action-Guidance
  **The Question:** You asked if insulation from empirical disconfirmation is a problem.
  **The Analysis:** Normative theories are not empirically falsifiable in the Popperian sense. However, they must be **action-guiding**. If a theory implies that we should always do $X$, but our epistemic access to the variables determining $X$ is permanently blocked (see Cluelessness above), the theory is **vacuous**.
  **The Defeater:** If Fanaticism implies that *in the actual world*, we can never distinguish the fanatic choice from the non-fanatic choice (because probabilities are always too vague), then the theory has no **extensional difference** from its rivals in practice.
  **Status:** **Methodological Warning.** It doesn't prove the theory false, but it suggests it might be **otiose**. If the view is insulated from all empirical input because the relevant probabilities are never knowable, it ceases to be a theory of *practical* reason and becomes a theory of *ideal* reason for omniscient beings.
  **Defender Concession:** Defenders argue that there *are* cases where the difference is visible (e.g., existential risk reduction vs. bednet distribution), but they must show the probability estimates are robust enough to survive the "Hypothesis Crowding" critique.

  #### 2. The "Reflective Equilibrium" Cost
  **The Question:** You dismissed appeals to "what we would do." However, in wide reflective equilibrium, considered judgments *are* data.
  **The Analysis:** If a theory systematically contradicts a vast network of stable, cross-cultural, and cross-contextual moral judgments (not just "I don't feel like it," but "this violates fairness/justice/agency"), the theoretical cost is high.
  **The Defeater:** The cost is not that the theory is false, but that the **burden of proof** shifts massively. You must show that the theoretical virtues of Fanaticism (simplicity, linearity) outweigh the massive cost of revising our entire normative framework.
  **Status:** **Qualifying.** It doesn't refute the view, but it demands that the formal arguments (Section I) be airtight. If the formal arguments have loopholes (e.g., bounded utility solves the paradoxes), the reflective equilibrium cost tips the scale against fanaticism.

  ---

  ### IV. Summary Map: What Should Move You?

  | Objection Category | Specific Argument | Decisive or Awkward? | Defender's Likely Concession |
  | :--- | :--- | :--- | :--- |
  | **Formal** | **Undefined Expectations** (St. Petersburg variants) | **Decisive** (for standard EUT) | Accept Weak Fanaticism or modify EUT (e.g., relative expectations). |
  | **Formal** | **Bounded Utility Theorem** (Coherence requirement) | **Decisive** (if consistency is required) | Deny that money pumps are irrational in Pascal contexts; or accept bounded utility. |
  | **Formal** | **Dynamic Inconsistency** (Separability failure) | **Awkward** | Adopt "Resolute Choice" or sophisticated decision models. |
  | **Epistemic** | **Cluelessness / Inscrutability** | **Awkward** (limits scope) | Add epistemic robustness constraints (EV must be robust, not just high). |
  | **Epistemic** | **Hypothesis Crowding** | **Awkward** (leads to paralysis) | Argue for asymmetry in hypothesis credibility. |
  | **Methodological** | **Vacuity / Lack of Action-Guidance** | **Methodological** | Argue that real-world XRisk cases *are* distinguishable. |

  ### V. The Crucial Distinction: Weak vs. Strong Fanaticism
  To be precise in your dissertation, you must distinguish these, as the defeaters apply differently:

  1.  **Strong Fanaticism:** For *any* probability $p > 0$, there exists a value $V$ such that $p \times V$ outweighs any certain finite good.
      *   *Vulnerability:* Highly vulnerable to the **Undefined Expectation** and **Bounded Utility** arguments. Most formal results suggest this is incoherent.
  2.  **Weak Fanaticism:** There exists *some* pair $(p, V)$ with very small $p$ and very large $V$ that outweighs certain finite goods.
      *   *Vulnerability:* More resilient. It avoids the need for *arbitrarily* small probabilities. It only requires that *actual* longtermist interventions (e.g., $p = 10^{-6}$, $V = 10^{20}$) beat near-term interventions.
      *   *Status:* Most defenders (Beckstead, MacAskill) effectively argue for Weak Fanaticism in practice, even if they use Strong Fanaticism rhetoric in theory.

  ### VI. Recommendation for Your Position
  If you are looking for the strongest pressure point to test your conviction, focus on **Section I.2 (The Bounded Utility Theorem)**.

  Your hesitation about "unmotivated caps" is the linchpin. If you can be convinced that **boundedness is a coherence constraint on rational preference** (similar to transitivity), rather than an arbitrary moral intuition, the fanatical position collapses without needing to appeal to "common sense."

  Read **Russell (2023) "On the Infinite"** and **Smith (2014) "Is There a Duty to Obey the Law?"** (specifically his work on utility bounds). If their proofs hold, then accepting Fanaticism is akin to accepting $2+2=5$ because you like the result. It forces you to choose between **EUT** and **Unbounded Utility**. You cannot have both.

  If you choose to keep Unbounded Utility, you must abandon standard EUT. If you do that, you need a new decision theory that handles infinite values without paradox. Currently, no such theory is widely accepted as superior to EUT. That is the decisive cost.

  ### VII. On Empirical Insulation
  To answer your specific methodological worry: **Insulation is a problem for Practical Reason.**
  A theory of *practical* reason must connect to *action*. If the theory's verdicts depend on variables ($p$ and $V$ for astronomical events) that are empirically inaccessible to the point where reasonable agents must disagree on their order of magnitude, the theory fails to coordinate action or guide deliberation.
  It becomes a **gnoseological** claim (about the structure of value) rather than a **praxeological** one (about what to do). For a PhD in decision theory/ethics, this shift is significant. It moves the view from "How should I choose?" to "How is value structured?" The former requires action-guidance; the latter does not. If Fanaticism cannot guide action in the real world due to epistemic barriers, it may be true as axiology but false as decision theory.

  **Final Advice:** Do not look for empirical disconfirmation of the *norm*. Look for **impossibility proofs** regarding the *inputs*. If the inputs required to trigger fanaticism are provably unknowable (not just unknown), the decision theory is practically vacuous. That is the strongest internal critique available.
