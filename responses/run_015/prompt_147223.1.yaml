      3.  Address the "Natural Kind" hypothesis.
      4.  Evaluate the Transparency/Closure distinction.
      5.  Recommend the "Change of Question" strategy as the most viable path to progress.

  8.  **Final Review against constraints:** No verdict favoring one side. No survey of interpretations. Honest structural diagnosis.

