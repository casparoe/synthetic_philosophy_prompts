      *   *Refining the Diagnosis:* It's not *just* verbal. It's a clash of *explanatory projects*. Camp A is doing metaphysics of mind; Camp B is doing cognitive science/engineering. They are talking past each other because they have different success conditions.
      *   *The "Aberrant Translations":* Point out that these are Rorschach tests. Camp A sees "failure of reference." Camp B sees "probabilistic noise."
      *   *The "Natural Kind" Issue:* Crucial. "Understanding" isn't like "combustion." It's normative.
