answer: |-
  Here is a complete run-sheet for the **Shadow Envelope Protocol**. This is designed to be run by you (the facilitator) acting as the "Market," which ensures the pump mechanics hold tight without students colluding to break the loop.

  ### Workshop Title: The Shadow Envelope Protocol
  **Time:** 90 Minutes
  **Participants:** 16 Grad Students (Phil/Econ Mix)
  **Goal:** Experiential understanding of diachronic inconsistency via a forced money pump with a pre-commitment device.

  ---

  ### 1. Materials & Setup
  You need physical tangibility to make the "loss" feel real, even if points are abstract.

  *   **16 Envelopes:** Sealed, labeled "ROUND 4 SELF."
  *   **16 Asset Packets:** Each contains 3 distinct cards (Red, Blue, Green). *Note: The cards have no intrinsic value; value is assigned by the student.*
  *   **16 Scorecards:** Pre-printed ledger for tracking points.
  *   **16 Pens.**
  *   **Incentive:** A $20 coffee gift card (or equivalent) for the top 3 scorers. This creates enough stakes to make point-loss sting without requiring real cash upfront.
  *   **Projector/Board:** To display the "Market Offers" for each round.

  ---

  ### 2. The Rules (Read these verbatim to avoid ambiguity)

  **Phase 0: The Commitment (15 Mins)**
  1.  Hand out Asset Packets. Tell students they currently hold the **Red** card.
  2.  Hand out Envelopes and Scorecards.
  3.  **Instruction:** "Inside the envelope, write your true ranking of the three colors (1st, 2nd, 3rd). Seal it. Do not open it until the end. This represents your **Diachronic Plan**."
  4.  **Starting Score:** Everyone writes **100 Points** on their scorecard.
  5.  **The Contract:** "At the end of the session, we open the envelope.
      *   **Autonomy Penalty:** If your final card does *not* match your Envelope's #1 ranked color, subtract **25 points**. (You betrayed your plan).
      *   **Consistency Tax:** If your final card *does* match your starting card (Red), but you engaged in any trades, you must subtract the total cost of all trades. (You paid to stay still)."

  **Phase 1: The Market Rounds (45 Mins)**
  *You act as the Bank. Do not let students trade with each other. They trade with the Market.*

  *   **Round 1 (15 Mins):**
      *   **Market Offer:** "The Market values Blue higher than Red right now. You may trade Red for Blue."
      *   **The Squeeze:** "To execute this upgrade, you pay a **5-point transaction fee**."
      *   *Rationality Check:* If they prefer Blue locally, they trade. Score: 95. Asset: Blue.
      *   *Opt-out:* They keep Red. Score: 100. Asset: Red.

  *   **Round 2 (15 Mins):**
      *   **Market Offer:** "The Market values Green higher than Blue."
      *   **The Squeeze:** "Trade Blue for Green. Fee: **5 points**."
      *   *Rationality Check:* If they prefer Green locally, they trade. Score: 90. Asset: Green.

  *   **Round 3 (15 Mins):**
      *   **Market Offer:** "The Market values Red higher than Green." (Full circle).
      *   **The Squeeze:** "Trade Green for Red. Fee: **5 points**."
      *   *Rationality Check:* If they prefer Red locally, they trade. Score: 85. Asset: Red.

  *   **Constraint:** Students must decide individually. No talking during rounds. If they talk, they are disqualified from the prize (this prevents collusion to break the pump).

  **Phase 2: The Reveal & Scoring (15 Mins)**
  1.  Open Envelopes.
  2.  **Calculate Final Score:**
      *   Start: 100
      *   Minus Trade Fees (5 per trade).
      *   Minus Autonomy Penalty (25) *IF* Final Card ≠ Envelope #1.
      *   Minus Consistency Tax (Total Fees) *IF* Final Card = Start Card (Red).
      *   *Wait, check the math:* The rules above have a double penalty risk. Let's simplify for the "Squeeze."
      *   **Revised Scoring Rule for Maximum Squeeze:**
          *   If Final Card == Envelope #1: You are "Consistent." Deduct Trade Fees only.
          *   If Final Card != Envelope #1: You are "Inconsistent." Deduct **25 Points** (Flat Penalty).
          *   *The Trap:* Most students will rank Red #1 in the envelope because it's their endowment (Endowment Effect).
          *   If they trade Red->Blue->Green->Red: They end with Red. Envelope says Red #1. They are Consistent. But they paid 15 fees. Final Score: 85.
          *   If they stop at Green: They end with Green. Envelope says Red #1. They are Inconsistent. Penalty 25. Final Score: 90 (100 - 5 - 5) - 25 = 65.
          *   *Result:* They are forced to complete the pump to maximize score. They *choose* to be pumped.

  **Phase 3: Debrief (15 Mins)**
  (See section below).

  ---

  ### 3. The Debrief: Mapping the Squeeze
  Don't lecture. Ask questions to draw the distinction out of them.

  **1. Local vs. Global Rationality (Synchronic vs. Diachronic)**
  *   *Ask:* "In Round 1, was it rational to trade Red for Blue?"
      *   *Expected:* Yes, Market said Blue is better + I want the prize points.
  *   *Ask:* "At the start of Round 1, was it rational to plan a cycle that ends with Red minus 15 points?"
      *   *Expected:* No. That's globally irrational.
  *   *Point:* This is the core of diachronic rationality. A sequence of locally rational acts (maximizing utility at t1, t2, t3) produced a globally dominated outcome. The "Shadow Envelope" was your t0 self trying to constrain your t1-t3 selves.

  **2. The Function of the Envelope (Pre-commitment)**
  *   *Ask:* "Did anyone write a ranking in the envelope that *anticipated* the pump? (e.g., ranking Green #1 so they could stop at Round 2?)"
      *   *If yes:* Discuss strategic preference falsification.
      *   *If no (likely):* Discuss why we fail to anticipate future market pressures. The Envelope represents **Plan Rationality**. The Trading Rounds represent **Action Rationality**. The gap between them is where the money pump lives.

  **3. The Autonomy Penalty**
  *   *Explain:* "The 25-point penalty for violating your envelope represents the psychic cost of regret or identity fracture. In real life, when you break a diet or a savings plan, you don't just lose money; you lose trust in your future self. That '25 points' is the erosion of self-trust."

  ---

  ### 4. Honesty Check: What This Simulation Can't Do
  Be upfront with the group during the debrief. This builds credibility.

  **1. True Temporal Distance**
  *   *Limitation:* In 90 minutes, "Round 4 Self" is the same person as "Round 1 Self." In reality, diachronic rationality deals with *change*. Your values actually shift over years. The envelope assumes a static "True Self," which is a philosophical fiction.
  *   *Takeaway:* Real life isn't just resisting temptation; it's negotiating with a future person who might legitimately want different things.

  **2. Uncertainty**
  *   *Limitation:* Here, the Market offers were clear. In reality, we don't know if the trade is actually an "upgrade." We pump ourselves on bad information.
  *   *Takeaway:* Real money pumps often hide the loop. Here, the loop was visible on the projector. If they still got pumped, it proves the structural pressure is stronger than knowledge.

  **3. The "Opt-Out" Cost**
  *   *Limitation:* In this game, refusing to trade was costless (except for the artificial Autonomy Penalty). In reality, opting out of social or economic norms has a high immediate cost (social exclusion, missed investment).
  *   *Takeaway:* The pump works best when refusing the trade is *also* painful.

  ---

  ### 5. Predictable Failure Points (And Fixes)

  **Failure 1: The "I See The Trick" Rebellion**
  *   *What happens:* An Econ student spots the A-B-C-A loop in Round 1 and shouts it out. Everyone refuses to trade.
  *   *Fix:* Pre-empt this. In the intro, say: "Markets shift unpredictably. Just because Red was valuable at t0 doesn't mean it will be at t3. Optimize for the current round." Do not reveal the cycle structure. Let them discover it at the reveal.
  *   *If they still refuse:* Pivot the debrief. "You avoided the pump by colluding. In the real world, you can't collude with your future self. The fact that you *could* stop here proves the pump is structural, not inevitable."

  **Failure 2: Envelope Cheating**
  *   *What happens:* Students peek or change their ranking after Round 3 to match their final card.
  *   *Fix:* Collect the envelopes at the start of Phase 1. Keep them on your desk. This adds a layer of "trust the system" which mirrors trusting your past self.

  **Failure 3: The "Endowment Effect" Confusion**
  *   *What happens:* Students rank Red #1 in the envelope simply because they were given Red, not because they prefer it.
  *   *Fix:* This is actually a feature, not a bug. It highlights how arbitrary starting positions lock in diachronic paths. Use this in the debrief: "Your 'True Self' was biased by your starting endowment. That's why planning is hard."

  **Failure 4: Math Errors**
  *   *What happens:* Scoring takes too long.
  *   *Fix:* Put the scoring formula on the board. Have them calculate their own scores, then you audit the top 3 winners.

  ### 6. Facilitator Script Snippet (For the "Squeeze")
  *During Round 3, when offering the trade back to Red:*
  > "Look at your scorecard. You're at 90 points holding Green. Your envelope likely says Red is best. If you keep Green, you take a 25-point hit for inconsistency. If you trade back to Red, you pay 5 points but stay consistent. You are literally paying to undo your own progress. This isn't a mistake; it's the price of local rationality. Make your choice."

  ### 7. Why This Works for Phil/Econ Mix
  *   **Econ Students:** Will try to game the scoring. They will feel the squeeze of the "Consistency Tax" as a dominated strategy they were forced into.
  *   **Phil Students:** Will fixate on the "Shadow Envelope" as a metaphor for personal identity over time.
  *   **Both:** Will leave with a visceral memory of paying points to return to square one, which is more memorable than a candy bar diagram.
