prompt: |-
  I'm putting together a workshop session on diachronic rationality and money pumps for about 16 grad students — mix of phil and econ — and I want them to actually feel teh squeeze of being pumped, not just diagram it on a board. We've got 90 minutes, casual room, no real money, and they've already seen the standard Dutch book loop with candy bars so they're a bit bored. I was talking with a friend about how every classroom version is just A-to-B-to-C-to-A, so I want to inject a weird framing I'm calling the shadow envelope mechanic: every student writes a private ranking of three goods at the start and seals it in an envelope marked your round-4 self, then in rounds 1-3 they only see pairwise trade offers with small immediate bonuses, trading with neighbors. The catch is there's a hidden consistency tax — if they end round 3 holding the same good they started with but paid fees along the way they lose extra points, but if they try to reject the final trade back they pay an autonomy penalty for violating their sealed envelope's revealed preference. I need the full setup — rules, materials, point scheme (maybe coffee vouchers or just scorecards), timeline — plus a debrief that maps each round onto local vs. diachronic rationality. Also be honest: what part of real temporal inconsistency can't be staged in 90 minutes? And tell me what will predicably go wrong the first time I run it. Oh, and don't build in any citation exercises — half of them will just guess names. Keep it in teh weeds but not so obscure they can't follow without googling.
