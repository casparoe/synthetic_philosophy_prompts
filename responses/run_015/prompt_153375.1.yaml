answer: |-
  The Proprioceptive Ward hummed with a silence that felt heavy, like water behind glass. Here, patients did not lie in beds; they stood in shared null-space, their physical bodies encased in haptic suits miles away, while their sensory selves projected into this gray, gridless void. The boundary between mental representation and physical object was not just blurred; it was technologically erased. If you imagined a wall, the server rendered it, and your suit resisted your touch. Reality was consensus.

  Elara stood in the center of the void, clutching the Certainty Case. It was a matte-black lozenge, rough-textured and cold, unlike the smooth polygons of the simulated environment. She had brought it from the loading zone, a physical token dragged into the digital ether.

  Dr. Aris materialized beside her, his avatar crisp, too perfect. He looked at the Case. "You're still trying to solve the Ward problem with props, Elara."

  "It's not a prop," Elara said. She lifted the Case with both hands. The haptic suit groaned, simulating mass. "Here is the Case."

  Aris sighed, the sound rippling through the audio feed. "And?"

  "And it is not a thought," she said. "Here is the Case. It is distinct from my experience of it. Therefore, something exists outside my mind."

  This was her engine. She was attempting to replicate the structure of Moore's proof, but transposed into a world where 'here' meant nothing. She wasn't showing hands; hands could be rendered. She was showing the Case, an object that claimed independence from the simulation's code.

  Aris walked around her, inspecting the object. "Practically, I feel it. The server is registering the weight transfer. But philosophically, you've achieved nothing. The suit could be simulating the weight of the Case just as it simulates the floor beneath us."

  "But I feel the resistance," Elara insisted. She pressed the Case into Aris's virtual hands. He flinched; his avatar registered the load.

  "That's proprioception, not ontology," Aris said. "You're assuming that because you have direct acquaintance with the item, it must be external. But in this facility, direct acquaintance is exactly what the software provides. You're begging the question."

  Elara took the Case back. The weight settled into her palms, a comforting anchor. "You're making the mistake everyone makes about Moore," she said. "You think he was trying to build a logical fortress. You think he believed he was deducing the external world from premises the skeptic would accept."

  "Wasn't he?" Aris asked. "He offered it as a proof."

  "No," Elara said. "He was pointing. He wasn't trying to win a logic game where the rules are rigged against reality. He was saying that some things are more certain than the premises used to doubt them. I don't need to prove the Case is external to know I'm holding it. The holding comes first."

  Aris shook his head. "That's common sense, Elara. It's not a refutation of idealism. If the idealist says 'all is mind,' showing them a object inside your mind doesn't help."

  "Moore didn't care about the idealist's rules," Elara said. "He cared that he knew he wasn't dreaming. I know I'm holding this. If I know that, then the external world exists, because this isn't me."

  "It's a category error," Aris countered, his voice fading slightly as the server lagged. "You're conflating phenomenological certainty with metaphysical truth. You feel it, so you claim it's real. But 'real' is the variable we're testing."

  Elara stopped listening. The argument was looping, a snake eating its own tail. Aris wanted a deduction that would force the skeptic to concede. Elara only wanted to know where she stood. She looked at the Case. It did not flicker. It did not dissolve when she looked away. It demanded effort to hold.

  "Keep your logic," Elara said. "I'm keeping the Case."

  She turned away from Aris. The void around them remained gray and infinite, but the weight in her hands was specific. She walked toward the sector designated for personal storage. There was no table there, only the potential for one. She willed a surface into existence, and the server complied, generating a simple wooden desk.

  She placed the Certainty Case on the desk. It made a solid *thud* that vibrated through her gloves. It stayed there. It did not float. It did not vanish when Aris logged off.

  Aris's avatar flickered and disappeared as his session ended. Elara was alone in the void, save for the object. She knew, theoretically, that Aris was right. The suit could be lying. The server could be simulating the thud, the weight, the rough texture. There was no logical bridge from 'I feel this' to 'This is outside me' that couldn't be severed by a sufficiently advanced deception.

  Yet, she left the Case on the desk. She walked away without looking back, trusting that if she returned, it would still be there. She couldn't prove it would remain. She couldn't deduce its independence from the laws of the facility. But she lived as if it were true. The external world was not a theorem she had solved; it was a place she had decided to inhabit. The Case sat on the desk, silent and heavy, a fact without a foundation, waiting for her to come back and hold it again.
