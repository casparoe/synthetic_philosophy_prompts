answer: |-
  # PhD Defense Prep Sheet: The "Provisional Validity" Chapter

  **Time to Defense:** 3 Weeks
  **Core Claim:** Legal validity is trivalent (Valid, Void, *Provisionally Valid*). Amendment N (2019) was provisionally valid until ratified by M (2022).
  **Risk:** You are arguing for a normative category within a positivist framework. The panel will try to force you into either "It was valid (social fact)" or "It was void (logical necessity)."

  ---

  ## Part 1: The Eight Objections (Ordered by Damage Potential)

  ### 1. The Hartian Trap (Supervisor)
  **The Question:** "You claim the Rule of Recognition (RoR) can return a third value. But the RoR is a social fact about official convergence. If officials applied N between 2019 and 2022, the RoR *already* recognized it as valid. If they didn't, it was void. Isn't 'provisional validity' just a fancy name for 'we haven't checked the social facts yet'?"
  **The 2-Minute Answer:** "The RoR isn't just a headcount of what officials do; it includes the *criteria* they accept for doing it. The criteria in Art. 51 included a temporal condition (the double lock). Between 2019 and 2022, the social practice was *incomplete*, not divergent. Officials applied N *on the understanding* that it required future ratification. The RoR recognizes the *process*, not just the output. My third value captures the status of a norm within an unfinished procedure, which is distinct from a norm that has failed a completed procedure."
  **Soft Spot/Concession:** You are conceding that if officials *never* intended to ratify, N would have been void ab initio.
  **Why This Answer Fails:** If you can't point to specific official statements acknowledging the "provisional" nature (rather than just treating it as law), the Supervisor will prove the social fact was simply "validity," making your category redundant.

  ### 2. The Monday Morning Test (Retired Judge)
  **The Question:** "I'm a trial judge in 2021. A lawyer cites N. Do I uphold it? If I say yes, and M fails in 2022, have I committed a legal error? If I say no, and M passes, have I denied justice? Give me a rule I can write in a judgment."
  **The 2-Minute Answer:** "You rule that N is *defeasibly* binding. You apply it, but you note the pending ratification. If M passes, your judgment stands. If M fails, your judgment is insulated by *res judicata* to prevent chaos, but the statute falls prospectively. This mirrors how courts handle statutes under constitutional review: they apply them until struck down, but the 'provisional' status acknowledges the cloud on the title."
  **Soft Spot/Concession:** You are conceding that *res judicata* does the heavy lifting, not the validity status itself.
  **Why This Answer Fails:** If the Judge presses on *liability* (e.g., someone was jailed under N, then N is voided), your theory offers no compensation mechanism, making "provisional validity" look like a license for state lawlessness.

  ### 3. The Hierarchical Impossibility (Visiting Kelsenian)
  **The Question:** "A lower norm cannot validate the act that created it. N was created under Art. 50, but Art. 51 governed Art. 50. M cannot reach back and cure N's nullity. Nullity is a logical zero. You cannot multiply zero to get one. This is mysticism, not jurisprudence."
  **The 2-Minute Answer:** "I am not arguing M validates N's *enactment*; I am arguing M validates N's *continuity*. Think of it as a contract ratified by a principal. The agent's act is unauthorized until ratification. Ratification doesn't change the past physics of the signature; it changes the legal attribution. N existed as a factual norm; M provided the imputation."
  **Soft Spot/Concession:** You are conceding N was technically *ultra vires* at the moment of enactment.
  **Why This Answer Fails:** Kelsenians view the *Grundnorm* as static. If the procedure was violated, the norm never entered the system. Private law analogies (agency) often fail in public law where *vires* are strict.

  ### 4. The Planning Theory Objection (Dept Philosopher)
  **The Question:** "Law is a shared plan. The plan was Art. 51. N violated the plan. How can a plan be retroactively amended to include a violation? That destroys the guidance function of plans. If I can break the plan and fix it later, the plan never guided me."
  **The 2-Minute Answer:** "The Plan included a 'repair mechanism.' Complex plans often have ratification clauses for emergency deviations. The guidance function wasn't lost; officials were guided by the *expectation* of ratification. The plan isn't a straightjacket; it's a framework that includes its own amendment rules, even retroactive ones."
  **Soft Spot/Concession:** You are admitting the "plan" was vague enough to allow its own violation.
  **Why This Answer Fails:** If the repair mechanism is too easy to use, the original plan (Art. 51) ceases to constrain anyone, undermining the Planning Theory's core claim about constraint.

  ### 5. The "Basic Structure" Disguise (Comp. Const. Lawyer)
  **The Question:** "This looks like 'unconstitutional constitutional amendments' doctrine (India, Germany) but without a court. You're letting the legislature police itself. Why isn't this just judicial review with the serial numbers filed off? Why should we accept legislative self-ratification?"
  **The 2-Minute Answer:** "Because judicial review assumes a hierarchy where the court is above the legislature. Here, the Constitution is above both. My model explains how the system self-corrects without requiring a judicial coup. It preserves legislative supremacy while acknowledging constitutional constraints. It's not self-ratification; it's procedural completion."
  **Soft Spot/Concession:** You are conceding that without a court, the "constraint" is purely political.
  **Why This Answer Fails:** If the Lawyer argues that without a court, "procedural completion" is just majority rule, your distinction between "valid" and "provisionally valid" collapses into "what the majority can get away with."

  ### 6. The Revenge Paradox (Logician)
  **The Question:** "You mention the revenge case: a clause saying 'No amendment has effect before enactment,' which is itself amendable. If I amend that clause to say 'This amendment has effect before enactment,' do I create a time-travel paradox? Does your third value handle self-referential validity?"
  **The 2-Minute Answer:** "No, because legal time isn't physical time. Legal retroactivity is a fiction of *imputation*, not causality. The norm doesn't exist before it's enacted; its *effects* are merely backdated. My third category handles this by separating *existence* (enactment) from *efficacy* (backdating). Nomic deals with game states; law deals with normative statuses."
  **Soft Spot/Concession:** You are conceding that retroactivity is a fiction, not a truth.
  **Why This Answer Fails:** If the Logician shows that backdating effects creates a contradiction in obligations (e.g., "You were obligated in 2019 to do X" when X was impossible), the "fiction" breaks down.

  ### 7. The Morality Smuggle (Supervisor/Second Guess)
  **The Question:** "Isn't 'provisional validity' just a normative claim about fairness? You want N to count because people relied on it. That's a moral argument, not a positivist one. You're smuggling Dworkin in through the back door."
  **The 2-Minute Answer:** "No. Reliance is a social fact, not a moral value. The stability of the system is a functional prerequisite, not a moral good. Positivism can account for systemic stability without invoking morality. I'm describing how the system *maintains* itself, not how it *ought* to."
  **Soft Spot/Concession:** You are walking a tightrope between "systemic stability" (fact) and "rule of law" (value).
  **Why This Answer Fails:** If "systemic stability" requires ignoring clear text (Art. 51), you are arguably prioritizing a moral value (order) over a social fact (the text officials agreed to).

  ### 8. The Voidable Analogy (General)
  **The Question:** "You lean on void vs. voidable in private law. But in public law, *ultra vires* is usually void ab initio. Why should public law be more lenient than private law regarding jurisdiction?"
  **The 2-Minute Answer:** "Because the 'principal' in public law is the People/Constitution, which cannot disappear. In private law, if the principal dies, the agency ends. In constitutional law, the system persists. The 'voidable' analogy holds because the sovereign power remains continuous, allowing for ratification that private parties might not survive."
  **Soft Spot/Concession:** You are admitting public law is *sui generis* here.
  **Why This Answer Fails:** Many public law theorists argue *ultra vires* must be strict to prevent tyranny. Leniency looks like impunity.

  ---

  ## Part 2: Strategic Concessions & Fights

  ### What to Give Away in the Opening (First 2 Minutes)
  **Concede:** "I am not arguing that N was *perfectly* valid in 2019. I concede it was defective. My claim is narrower: that 'defective' is not synonymous with 'void' in a constitutional context."
  **Why:** This disarms the Kelsenian and the Judge immediately. You aren't saying black is white; you're saying there's a grey scale. It stops them from spending 10 minutes proving N violated Art. 51 (which is obvious).

  ### The One Objection to Pick a Fight Over
  **Target:** The Hartian (Supervisor) on the Rule of Recognition.
  **Why:** This is your theoretical contribution. If you concede the RoR is binary, your thesis collapses.
  **Strategy:** Stand firm that the RoR includes *temporal* and *procedural* conditions that can be in a state of suspension. Argue that Hart himself acknowledged the "internal point of view" includes acceptance of rules about rule-change. If officials accept the *possibility* of ratification, the RoR accommodates the interim status.
  **Risk:** High. But necessary for the PhD.

  ### The One Objection to Just Accept
  **Target:** The Logician's "Time Travel" worry.
  **Why:** You can't beat a logician on logic.
  **Strategy:** "You're right that if we treat legal time as physical time, it's paradoxical. I accept that legal retroactivity is a normative fiction, not a logical truth. My theory describes the fiction, it doesn't claim to solve physics."
  **Cost:** It limits the scope of your theory to "legal fictions" rather than "ontological statuses," which weakens the philosophical weight but saves the practical argument.

  ### The Question You Hope Nobody Asks
  **"What if M fails in 2022?"**
  **Why it's deadly:** If M fails, N becomes void. Every contract, conviction, and tax collected under N (2019-2022) is potentially unlawful.
  **The Trap:** If you say "They stand," you admit validity depends on *outcome*, not status (Realism). If you say "They fall," you admit your theory causes chaos (Judge).
  **Prep:** Have a "Prospective Overruling" answer ready. "If M fails, N is voided prospectively only. Past acts remain protected by legitimate expectation." (This is weak positivism, but necessary for survival).

  ---

  ## Part 3: The "Rethink" Paragraph (Where You Might Be Wrong)

  **The Argument That Should Make You Drop the Third Category:**
  The most damaging argument against your thesis is **Legal Realism combined with the Binary Nature of Coercion.** At any given moment (e.g., 2020), a state official is either *authorized* to coerce a citizen under N or they are *not*. There is no middle ground in the physical application of force. If a police officer arrests someone under N, and N is later voided, the arrest was legally unauthorized *at the time*, regardless of your "provisional" label. By positing a third status, you may be describing a *sociological* uncertainty (officials aren't sure if they can arrest) rather than a *legal* status. If you cannot show that "Provisional Validity" changes the *deontic power* of the official at T1 (other than by adding uncertainty), then you haven't found a third legal status; you've just found a fancy word for "legal risk." If the panel convinces you that the RoR must be binary to function as a guide for coercion, you should abandon the "third status" claim and reframe the thesis as "The Rule of Recognition includes a *deferred validation* mechanism," which is a procedural claim, not an ontological one.
