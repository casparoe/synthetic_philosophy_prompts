  **LOGICAL SPACE & CELL MAP**
  **Axes:** (1) Outcome Sensitivity (Desert vs. Sanction vs. Evidence); (2) Constitutive Sensitivity (Mitigate vs. Destroy Agency vs. Ignore); (3) Success Justification (Yes/No).
  **Occupied Cells:**
  1.  **Control Purist:** No Outcome, No Constitutive. (Luck never touches blame).
  2.  **Pragmatist:** Yes Outcome (Sanction only), No Constitutive. (Outcomes change punishment, not desert).
  3.  **Evidentiary:** Yes Outcome (Evidence only), No Constitutive. (Outcomes reveal will).
  4.  **Full Luckist:** Yes Outcome (Desert), Yes Constitutive (Mitigate). (Luck everywhere).
  5.  **Skeptic:** No Outcome, Yes Constitutive (Destroy). (Constitutive luck eats agency).
  6.  **Consequentialist:** Yes Outcome (Justification). (Success makes act right).
  **Empty/Unstable Cells:**
  1.  *Outcome changes Wrongness but not Blame:* Incoherent. If act isn't wrong, blame has no object. If act is wrong, blame follows.
  2.  *Constitutive changes Blame but not Wrongness:* Unstable. Capacity defines agency; if agency changes, wrongness attribution shifts.
  **Overlaps:**
  *   *Control vs. Evidentiary:* Collapses if evidence is perfect. Separated by "Bird/Block" case (intent same, evidence differs).
  *   *Control vs. Pragmatist:* Collapses on blame. Separated by "Secret Sin" case (desert vs. social response).

  ***

  **DIAGNOSTIC TREE: WEEK 1**

  **Q1. THE INTERRUPTED KILLER**
  You intend to kill someone.
  Case A: You pull the trigger; the gun jams.
  Case B: You pull the trigger; the bullet fires, but a bird blocks it.
  Case C: You pull the trigger; the bullet hits.
  **How do you rank the badness of what you did?**
  *   (1) A, B, and C are equally bad. → **Go to Q2**
  *   (2) C is worse than A and B; A and B are equal. → **Go to Q3**
  *   (3) C is worst, B is middle, A is best. → **Go to Q4**

  **Q2. (INTENT FOCUS) THE SECRET SIN**
  You do something awful. Nobody ever finds out. No legal trouble.
  **What do you deserve?**
  *   (1) You deserve punishment anyway, even if no one knows. → **Go to Q5**
  *   (2) You deserve nothing internally, but society should punish if caught. → **LEAF: PRAGMATIST**
  *   (3) You deserve nothing, and no one should do anything. → **LEAF: AMORALIST (UNNAMED)**

  **Q3. (OUTCOME FOCUS) THE DRUNK DRIVERS**
  Two drivers, same drunk, same driving. One hits a child; one arrives home safe.
  **Is the one who hit the child more blameworthy?**
  *   (1) Yes, the outcome changes what they deserve. → **Go to Q5**
  *   (2) No, they are equally blameworthy, but we treat the hitter harder. → **LEAF: PRAGMATIST**
  *   (3) No, they are equal, unless the outcome proves they were riskier. → **LEAF: EVIDENTIARY**

  **Q4. (CAUSALITY FOCUS) THE LOADED GUN**
  You leave a loaded gun where a child can reach it.
  Case A: The child finds it, nothing happens.
  Case B: The child finds it, shoots someone.
  **Is what you did wrong in both cases?**
  *   (1) Yes, equally wrong. → **Go to Q5**
  *   (2) B is much worse; A is barely wrong. → **LEAF: FULL LUCKIST**
  *   (3) A is not wrong; only B is wrong. → **LEAF: CONSEQUENTIALIST**

  **Q5. (CONSTITUTIVE CHECK) THE BAD UPBRINGING**
  Someone was raised so they are physically incapable of feeling guilt or remorse. They do something bad on purpose.
  **Are they responsible?**
  *   (1) Yes, fully. Their background doesn't change their choice. → **LEAF: CONTROL PURIST**
  *   (2) Less responsible, because they couldn't help being that way. → **LEAF: FULL LUCKIST**
  *   (3) Not responsible at all; they aren't truly an agent. → **LEAF: SKEPTIC**

  **Q6. (JUSTIFICATION CHECK) THE ARTIST**
  Someone abandons their family to paint in another country.
  Case A: They become a great painter, enriching culture.
  Case B: They fail, produce nothing, and ruin their family.
  **Does success change if the act was permitted?**
  *   (1) Yes, success makes it okay; failure makes it wrong. → **LEAF: CONSEQUENTIALIST**
  *   (2) No, it was wrong to leave either way. → **Return to Q5**
  *   (3) No, it was permitted either way. → **Return to Q5**

  ***

  **LEAF DEFINITIONS**
  1.  **CONTROL PURIST:** Luck never touches blame or wrongness. Only choices matter.
  2.  **PRAGMATIST:** Luck changes what we may *do* to someone (punishment), not what they *deserve* internally.
  3.  **EVIDENTIARY:** Luck matters only because it reveals what was in the agent's mind.
  4.  **FULL LUCKIST:** Luck changes wrongness, blame, and background mitigation equally.
  5.  **SKEPTIC:** Constitutive luck (upbringing/capacity) destroys agency altogether.
  6.  **CONSEQUENTIALIST:** Outcomes justify the initial action (success makes it right).
  7.  **AMORALIST (UNNAMED):** Nothing is deserved; morality is purely social enforcement.

  **SEPARATION NOTES**
  *   **Control vs. Evidentiary:** Hard to separate without Q1 (Bird/Block). If bird blocks, intent is clear but outcome failed. Evidentiary view says "less bad" (less evidence of efficacy); Control says "equal."
  *   **Control vs. Pragmatist:** Hard to separate without Q2 (Secret Sin). Both say "equal blame," but split on "deserve punishment if unknown."
  *   **Redundancy:** *Amoralist* is often just *Skeptic* applied to sanctions only. If a student picks both, treat as Skeptic.
  *   **Unstable:** If a student says "Outcome changes wrongness" but "Blame stays same," push them to Q5. This view usually collapses into Pragmatist or Full Luckist under pressure.
