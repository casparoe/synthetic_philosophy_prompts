answer: |-
  The conclusion I defend is this: under the assumptions of Constant-Valence Micropsychism, the total moral disvalue contained within a given volume of matter over a given duration is invariant to whether micro-experiences compose into macroscopic subjects. Consequently, any ordinary region of spacetime contains vast moral disvalue solely in virtue of containing many fundamental degrees of freedom, generating a strong pro tanto reason to prefer fewer such degrees or shorter durations of existence.

  To establish this, we must first address the relationship between moral significance and subjecthood. The no-subject objection claims that disvalue requires a unified subject to undergo it, implying that if micro-experiences do not fuse, there is no subject to bear the burden, and thus no moral weight. This objection fails because it conflates the *container* of experience with the *content* that matters morally. Assumption (i) stipulates that every fundamental degree of freedom has an intrinsic experiential character. If negative valence is intrinsically morally significant, then every instance of it constitutes a locus of moral concern. Whether these instances are unified into a single stream of consciousness or remain a plurality of micro-subjects affects only the distribution of disvalue, not its sum. If composition occurs, one large subject bears a massive load; if it does not, many micro-subjects each bear a small load. The total quantity of negative valence remains identical. Moral significance should track the occurrence of bad experience, not the structural arrangement of the experiencer. To hold otherwise is to privilege metaphysical unity over the raw presence of negative tone, which is arbitrary.

  This leads directly to the distinction between suffering and bare negative valence. A critic might insist that only full-blooded suffering—involving aversion, cognitive appraisal, or an object—carries moral weight, whereas a uniform, contentless $-v$ is morally inert. This distinction is untenable within the present framework. The moral work is done by the hedonic tone itself, not by the cognitive architecture surrounding it. If there is something it is like to be a degree of freedom, and that what-it-is-like is negatively valenced, then there is a prima facie badness present. Complex suffering may intensify the negative valence or extend its duration, but it does not create moral significance ex nihilo. The bare feeling of badness is sufficient for moral relevance. To deny this is to claim that a simple pain is morally negligible until a mind reflects upon it, which contradicts the intuition that pain is bad primarily because of how it feels, not because of what thoughts accompany it. Therefore, the constant $-v$ of every degree of freedom contributes to the total disvalue regardless of its simplicity.

  Next, we must consider the aggregation of this value. The counting-versus-adding objection suggests that summing identical $-v$ across distinct degrees of freedom is merely counting entities rather than adding moral weight, unlike aggregating diverse human sufferings. This objection fails because moral aggregation operates on occurrences, not on qualitative diversity. Two distinct instances of identical pain are morally worse than one instance, even if the quality of the pain is indistinguishable. The degrees of freedom are distinct physical entities; therefore, their experiences are distinct occurrences. Summing their valences is not a category error but a necessary procedure for assessing total disvalue. The fact that human suffering varies qualitatively is incidental to the aggregation principle; the core principle is that distinct bad experiences sum together. Since there are vastly many degrees of freedom in ordinary matter, the sum of their identical negative valences yields an astronomical total disvalue.

  This aggregation must hold regardless of the metaphysical status of composition, addressing the arbitrariness objection. If moral significance swung wildly based on whether micro-experiences fuse—a fact described in (iii) as unresolved or indeterminate—then moral truth would depend on arbitrary structural facts. It is implausible that the moral status of a region of space should change drastically based on a metaphysical vagueness regarding composition. Therefore, the moral significance must be insensitive to the resolution of the composition question. The argument escapes the reductio by anchoring moral weight in the micro-experiences themselves, which exist regardless of whether they compose. The structural fact of composition is morally superficial compared to the fundamental fact of negative valence.

  Regarding time, the argument requires both synchronic and diachronic composition considerations. Assumption (ii) notes that rocks and brains differ in how long degrees of freedom persist. To claim that a cubic metre over a second contains astronomical disvalue, we must assume that the negative valence persists across time intervals. We do not need micro-experiences to unify diachronically into a persisting self; we only need the degrees of freedom to persist as entities capable of sustaining experience over time. If a degree of freedom exists for a duration, it generates disvalue proportional to that duration. Thus, the argument relies on the persistence of the physical degrees of freedom, not necessarily on the diachronic unity of a subject. The disvalue accumulates over time simply because the negative valence continues to occur.

  Finally, concerning magnitude, the claim of "astronomically large magnitude" relies on the premise that ordinary matter contains a vast number of fundamental degrees of freedom. This number is not merely illustrative; it is essential to the claim that the disvalue is astronomical rather than negligible. However, the argument for a pro tanto reason to reduce matter does not depend on the specific count, only on the count being sufficiently large to outweigh competing moral considerations. Within the context of this exercise, we accept that ordinary matter implies a high density of degrees of freedom. The number does the work of establishing the scale of the problem, but the logical force of the argument holds even if the number were smaller, provided the valence is negative.

  The single load-bearing premise of this argument is that negative valence is intrinsically morally significant independent of subjecthood or cognitive complexity. Without this premise, the argument collapses. If moral significance required a unified macro-subject, the no-subject objection would succeed, and unfused matter would be morally neutral. If moral significance required complex suffering rather than bare valence, the constant $-v$ would be morally inert. If moral significance did not aggregate across distinct occurrences, the vast number of degrees of freedom would not generate astronomical disvalue. The entire claim that ordinary matter is saturated with moral disvalue rests on the assertion that the raw presence of negative tone, in any instance, constitutes a moral bad that sums across all fundamental entities.
