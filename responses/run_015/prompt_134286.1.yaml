answer: |-
  Here is the committed take you asked for.

  The divergence between Peirce and James is **real and metaphysical**, not merely a difference in perspective or emphasis. James is not describing Peirce's convergence "from the inside." They are operating with incompatible ontologies: Peirce is a Scholastic Realist (universals and generals are real), while James is a Radical Empiricist/Nominalist (only particulars and processes are real).

  Here is how that plays out regarding your specific worries about open-ended domains and pluralism.

  ### 1. Peirce: Does truth collapse into correspondence in open-ended domains?
  **No, it collapses into Regulative Idealism.**

  Your worry is that if ethics/aesthetics are structurally open-ended (no final verdict possible), Peirce's definition renders them meaningless. Peirce would actually reject your premise: he believed the normative sciences (logic, ethics, aesthetics) *were* capable of convergence because they are grounded in the *summum bonum* (the ultimate good), which is an objective reality discoverable by inquiry.

  However, if we grant your constraint—that these domains are *structurally* open-ended with no possibility of a final community verdict—Peirce's theory does not revert to correspondence (mirroring a mind-independent fact). Instead, it becomes a **regulative ideal**.

  In this scenario, "truth" in ethics ceases to be a state of affairs and becomes a *direction*. It functions like a limit in calculus: you can approach it, but you cannot occupy it. This is not correspondence because there is no pre-existing "ethical fact" waiting to be mirrored; the "fact" is constituted by the convergence that never arrives.
  *   **The Verdict:** In open-ended domains, Peirce's view makes truth **epistemically inaccessible in the present**. It doesn't make ethical claims false, but it makes their truth-value asymptotic. This is a **bug** for practical ethics (where we need to act now), but a **feature** for his scientific realism (preventing dogmatism). If you demand truth be actionable *now*, Peirce fails you in open domains.

  ### 2. James: Is pluralism a feature or a bug?
  **It is a Feature.**

  James explicitly embraces the scenario you fear: two isolated groups with incompatible but locally "working" beliefs about justice. For James, **both can be true.**

  This is not a bug of relativism; it is the core of his "pluralistic universe." James argues that reality is "plastic." It is not a single, block universe waiting to be mapped (Peirce's view), but a mosaic that can be carved in different ways depending on human interests. If belief A leads Group A to successful navigation of their social reality, and belief B does the same for Group B, both are true *for those contexts*.

  James blocks the "anything goes" relativism charge not through convergence, but through the constraint of **sensory experience and "leading."** A belief cannot work if it contradicts brute sensory facts (you can't believe you can fly and jump off a cliff). In ethics, the "brute fact" is the friction of human suffering or social cohesion. If a belief about justice leads to social collapse, it ceases to "work" and thus ceases to be true.
  *   **The Verdict:** James's pluralism is a **feature** because it accounts for the historical and cultural variability of truth without surrendering the notion of truth entirely. He replaces the *unity* of truth (Peirce) with the *utility* of truth. If you value human agency and the historical reality of moral progress over metaphysical unity, James wins.

  ### 3. Is James just Peirce "from the inside"?
  **No.**

  This is a common reconciliation attempt (that James focuses on the *process* of inquiry while Peirce focuses on the *outcome*), but it fails under scrutiny.
  *   **Peirce requires the End:** For Peirce, the "final opinion" is ontologically prior to the truth of any current belief. A belief is only *provisionally* true insofar as it aligns with where inquiry is *fated* to go. Without the telos of convergence, Peirce's truth dissolves.
  *   **James rejects the End:** James explicitly rejects the idea that truth waits at the end of inquiry. For James, truth **happens** to an idea. It becomes true, is *made* true by events. If inquiry stops, or if two inquiries diverge forever, Peirce says truth is undefined; James says truth is plural.

  James is not looking at Peirce's convergence from a closer distance; he is looking at a different object entirely. Peirce is tracking the **stability of representation**; James is tracking the **cash-value of interaction**.

  ### The Bottom Line
  If you are working in **hard sciences** where convergence is empirically evident (e.g., physics), Peirce's view is superior because it explains why our theories get less wrong over time regardless of individual utility.

  However, regarding your specific knot about **ethics and aesthetics**:
  1.  **Peirce's view strains to the breaking point.** If convergence is structurally impossible, his definition of truth becomes an empty hope. It risks making ethical truth claims meaningless in the present tense.
  2.  **James's view holds firm.** His pluralism allows ethical truth to be real and binding *locally* without requiring a universal verdict that may never come.

  **Committed Conclusion:** The divergence is real. Peirce sacrifices present-day ethical truth for the sake of metaphysical realism (the Real is what the community *would* say). James sacrifices metaphysical unity for the sake of present-day ethical agency (the True is what *does* work). In open-ended domains like ethics, **James's pluralism is the necessary correction to Peirce's idealism.** Peirce's framework cannot accommodate structural open-endedness without turning truth into a mere horizon; James's framework is built for it.
