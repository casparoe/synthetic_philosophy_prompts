  I saw the shadow cross the floor at night.
  The silence hums like wire in the ground.
  They say I cannot trust my own eyesight.

  I saw the shadow cross the floor at night,
  although the cameras captured only light.
  I wait for signals but there is no sound.
  They say I cannot trust my own eyesight.

  I saw the shadow cross the floor at night,
  although the cameras captured only light,
  because the feed was looped to hide the sight.
  A lock was picked but no one else was round.
  They say I cannot trust my own eyesight.

  I saw the shadow cross the floor at night,
  although the cameras captured only light,
  because the feed was looped to hide the sight,
  and logs were purged to make the gap seem right.
  The truth might stand regardless of the bound.
  They say I cannot trust my own eyesight.

  I saw the shadow cross the floor at night,
  although the cameras captured only light,
  because the feed was looped to hide the sight,
  and logs were purged to make the gap seem right,
  yet witnesses were paid to stay out of sight.
  I search the dust but nothing can be found.
  They say I cannot trust my own eyesight.

  I saw the shadow cross the floor at night,
  although the cameras captured only light,
  because the feed was looped to hide the sight,
  and logs were purged to make the gap seem right,
  yet witnesses were paid to stay out of sight.
  No one answers from the safe compound.
  They say I cannot trust my own eyesight,
  because my mind invents the dark and bright,
  and medicine is offered for the fright,
  yet doctors work for states that hold the light.

  ***

  The refrains accumulate clauses that function as auxiliary hypotheses: each addition explains away a specific counter-evidence (cameras, logs, witnesses, skepticism, medical diagnosis) while preserving the original claim. The final quatrain forces the two refrains to sit side-by-side, visually demonstrating how the defense of the belief has become heavier than the belief itself, while leaving open the possibility that the shadow was indeed real.
