answer: |-
  # JOINT STATEMENT ON VERISIMILITUDE AND SCIENTIFIC PROGRESS
  **Prepared for the [Group Name] Reading Group**
  **Signatories: The Likeness Proponent (LP) & The Consequence Proponent (CP)**

  ### 1. AGREED CLAIMS

  1.  **The Function of the Concept:** We agree that the primary philosophical work of "verisimilitude" (truthlikeness) is to make sense of scientific progress in a realist framework. Specifically, it must explain how a sequence of theories can constitute progress even if every theory in the sequence is strictly false. If verisimilitude cannot rank false theories, it is useless for the history of science.
  2.  **The Triviality Result:** We agree that Karl Popper's original definition (truth-content minus falsity-content) is untenable. We accept the Miller–Tichý proof that, under classical logic, no false theory can be closer to the truth than any other false theory. We are not attempting to revive Popper's definition or deny the formal result.
  3.  **The Role of Logic:** We agree that verisimilitude cannot be purely syntactic. Any adequate account must rely on semantic content (states of affairs, worlds, or truth-conditions) rather than mere sentence structure.
  4.  **The Goal of Ordering:** We agree that a successful account must generate a partial ordering of theories. It is not required that *all* theories be comparable, but the account must rank paradigmatic cases of "obvious progress" (e.g., Newtonian mechanics vs. Aristotelian physics regarding planetary orbits) in the correct direction.
  5.  **[FLAGGED AGREEMENT] On "Content":** We agree that verisimilitude is sensitive to the *content* of a theory. **[Note: LP interprets "content" as the set of possible worlds excluded by the theory. CP interprets "content" as the set of relevant consequences entailed by the theory. We sign this only to acknowledge that both views treat logical strength as a variable, though we measure it differently.]**
  6.  **Language Dependence:** We agree that language dependence (the "grue" problem) is a serious challenge. An account that yields opposite verisimilitude orderings merely by translating predicates into logically equivalent but gerrymandered vocabulary is defective. We disagree on which camp solves this, but agree it is a constraint.

  ---

  ### 2. DISAGREEMENTS TABLE

  | Topic | The Likeness Proponent (LP) Formulation | The Consequence Proponent (CP) Formulation |
  | :--- | :--- | :--- |
  | **Fundamental Metric** | Truthlikeness is a function of the **distance** between the actual world and the set of possible worlds in which the theory is true. The closer the "closest world" allowed by the theory is to the actual world, the higher the verisimilitude. | Truthlikeness is a function of the **balance of relevant consequences**. It is the weight of true relevant consequences minus the weight of false relevant consequences. |
  | **The Nature of Error** | Error is **mislocation**. A false theory is one that rules out the actual world; its degree of falsehood is determined by how far away the worlds it *does* allow are from reality. | Error is **misinformation**. A false theory is one that entails false claims; its degree of falsehood is determined by the importance and number of the false claims it makes. |
  | **Truth-Value Monotonicity** | Adding a **true** conjunct to a theory always increases (or leaves unchanged) its verisimilitude, because it restricts the set of allowed worlds, potentially eliminating distant ones. | Adding a **true** conjunct increases verisimilitude *only if* the conjunct is relevant to the domain of inquiry. Irrelevant truths are inert. |
  | **Handling Falsity** | A theory can be false but very close to the truth if the worlds in which it is true are neighbors to the actual world. Falsity does not preclude high verisimilitude. | A theory can be false but have positive verisimilitude if it entails enough true relevant consequences to outweigh the false ones. Falsity is a penalty, not a disqualifier. |
  | **Source of Normativity** | The metric of similarity is grounded in the **structure of natural properties** and physical magnitudes. Distance is objective because the state-space is objective. | The metric of relevance is grounded in **explanatory power** and problem-solving context. Relevance is objective because scientific problems fix the relevant consequence classes. |

  ---

  ### 3. CRUXES AND PREDICTIONS

  We have identified four concrete test cases where our intuitions diverge. Below we state the case and our respective verdicts in advance.

  #### Crux 1: The Quantitative Near-Miss
  **Case:** The true value of a constant $K$ is 5.0.
  *   Theory A says: $K = 5.1$
  *   Theory B says: $K = 50.0$
  *   Both are strictly false.

  **LP Prediction:** Theory A is significantly closer to the truth than Theory B.
  *   *Reasoning:* The metric on logical space inherits the metric of the quantity space. The world where $K=5.1$ is a "neighbor" to the actual world; the world where $K=50$ is distant. Verisimilitude tracks this distance directly.

  **CP Prediction:** Theory A is closer to the truth than Theory B, *but* this requires careful handling.
  *   *Reasoning:* We cannot simply say "5.1 is closer than 50." We must argue that Theory A entails true relevant consequences that Theory B does not (e.g., "$K$ is between 1 and 10"). Theory B entails false relevant consequences (e.g., "$K$ is greater than 10") that Theory A avoids. If the consequence class is defined too strictly (e.g., only "$K=5.0$" counts), both are equally false. We commit to the view that approximate consequences count as true relevant consequences.

  #### Crux 2: The Grue/Gerrymandering Test
  **Case:** We describe a world of emeralds.
  *   Vocabulary 1: Green ($G$), Blue ($B$).
  *   Vocabulary 2: Grue ($Gr$), Bleen ($Bl$).
  *   Theory X: "All emeralds are Green." (True)
  *   Theory Y: "All emeralds are Grue." (False, assuming time $t$ has passed).
  *   Now, re-describe the *same* ontological situation using a gerrymandered vocabulary where the *false* theory looks structurally simple and the *true* theory looks complex.

  **LP Prediction:** The verisimilitude ordering must remain invariant under translation.
  *   *Reasoning:* If the ordering flips, the account is defective. Likeness theorists admit this is a vulnerability. We claim the metric must be defined over **natural properties**, not arbitrary predicates. If "Grue" is not a natural property, it does not define a valid dimension in logical space. The ordering holds because the underlying state-space is fixed, not the language.

  **CP Prediction:** The verisimilitude ordering must remain invariant under translation.
  *   *Reasoning:* Relevance filters out gerrymandered predicates. A consequence framed in "Grue" is not a *relevant* consequence for mineralogy if "Grue" is not a projectible predicate. The account survives because the definition of "relevant consequence" includes a constraint on natural kinds or explanatory utility.

  *(Note: Both sides claim invariance, but LP grounds it in metaphysics [natural properties], while CP grounds it in methodology [relevance criteria].)*

  #### Crux 3: The Padding Problem
  **Case:** Theory T is a false theory about planetary orbits.
  *   Modification T+: T conjoined with a true but irrelevant claim (e.g., "The number of stars in the Milky Way is $N$").
  *   Modification T++: T conjoined with an unconstrained parameter (e.g., adding a free variable that can be adjusted to fit data without explanatory gain).

  **LP Prediction:** T+ has higher verisimilitude than T.
  *   *Reasoning:* T+ is true in a subset of the worlds in which T is true. Since the added conjunct is true, it eliminates some false worlds (where the star count is not $N$) without eliminating the actual world (since the claim is true). Restricting the set of allowed worlds towards the actual world increases closeness. Irrelevance is not a logical category for likeness.

  **CP Prediction:** T+ has the *same* verisimilitude as T (regarding the domain of orbits).
  *   *Reasoning:* The added claim is irrelevant to the problem situation (planetary orbits). It adds no weight to the true relevant consequences regarding orbits, nor does it add false ones. Verisimilitude is domain-relative. Padding with irrelevant truths is philosophically inert and should not register as progress.

  #### Crux 4: Cross-Domain Comparison
  **Case:**
  *   Theory P: A false theory in Physics (e.g., Phlogiston theory).
  *   Theory B: A false theory in Biology (e.g., Lamarckism).
  *   Can we say P is closer to the truth than B?

  **LP Prediction:** Generally, No.
  *   *Reasoning:* Distance is measured in state-space. The dimensions of the state-space for physics (mass, charge) are incommensurable with biology (fitness, inheritance). There is no common metric to compare the "distance" of P from physical truth vs. B from biological truth. Verisimilitude is local to a logical space.

  **CP Prediction:** Potentially Yes, but difficult.
  *   *Reasoning:* If we can weigh consequences by their explanatory importance, we might compare the *degree* of error. However, we concede that without a unified problem-shift context, cross-domain comparison is usually meaningless. We differ from LP only in that we *could* compare them if we had a universal metric of "informational value," whereas LP is structurally barred by the lack of a common state-space.

  ---

  ### 4. CONDITIONS FOR ABANDONMENT

  **LP:** I will abandon the Likeness approach if it is demonstrated that a metric on logical space cannot be defined without presupposing the very truthlikeness intuitions it is supposed to justify (circularity), or if the "natural properties" defense fails to block the Grue-problem without resorting to realism that is too strong for a fallibilist account.

  **CP:** I will abandon the Consequence approach if it is demonstrated that "relevance" cannot be formally defined without implicitly smuggling in a likeness metric (e.g., if determining which consequences are "relevant" requires knowing which are "close" to the truth), rendering the account reducible to Likeness.

  ---

  ### 5. EDITOR'S NOTE (FROM THE DRAFTER)

  **The Most Likely Fudge:**
  Claim #5 in the Agreed Claims section ("On Content") is the primary verbal fudge. Both parties agree that "content matters," but LP treats content as *exclusionary* (ruling out worlds) while CP treats content as *entailment* (ruling in consequences). In classical logic, these are duals, but in verisimilitude, they behave differently regarding false theories. LP thinks adding truth always helps (monotonicity); CP thinks adding irrelevant truth does nothing. They have signed Claim #5 to signal cooperation, but this is where the substantive fight remains.

  **Verbal vs. Substantive:**
  There is a significant verbal overlap in **Crux 2 (Grue)**. Both claim their account is language-invariant. LP grounds this in "Natural Properties" (Metaphysics); CP grounds this in "Relevance/Projectibility" (Methodology). If "Natural Property" and "Relevant Predicate" turn out to be extensionally equivalent, their disagreement is merely verbal (labeling the same constraint). If they come apart (e.g., a property is natural but irrelevant, or relevant but not natural), the disagreement is substantive. My suspicion is they are aiming at the same target (blocking gerrymandering) from different angles, and the "disagreement" is largely terminological.

  **The Real Sticking Point:**
  **Crux 3 (Padding)** is the only place where their verdicts clearly contradict (Increase vs. Unchanged). This is the empirical test for your group. If your intuition is that padding a theory with true facts about stars does *not* make a theory of planets better, CP wins. If your intuition is that a theory with more true claims is logically superior regardless of topic, LP wins. This is not verbal; it is a clash of normative intuitions about what science is for.
