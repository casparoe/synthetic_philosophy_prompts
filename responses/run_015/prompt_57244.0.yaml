answer: |-
  Your first and second hypotheses are the structural load-bearing walls of this impasse; the third is a symptom, and the fourth is the inevitable sociological result. You are correct that the criteria are anti-correlated (H1). Dissimilarity isolates the unique; Multiple Attestation isolates the repeated. In any transmission process, these are inverse functions. If a tradition preserves what is useful (plausibility), it discards what is distinct (dissimilarity). To maximize one is to minimize the other. Consequently, scholars who prioritize continuity (Theissen, the Memory Turn) and those who prioritize distinctiveness (Third Quest atomists) are not arguing about Jesus; they are arguing about the physics of oral transmission (H2).

  This confirms your diagnosis: the impasse is best categorized as **a hidden empirical question doing all the work.** The field lacks a verified model for how traditions mutate, stabilize, or decay in first-century Palestinian orality. Without that control variable, the criteria are not tests; they are weights. Because the empirical data is missing, the weighting is subjective, which validates your fourth hypothesis: the criteria function as a protective belt. A scholar who wants a Cynic Jesus weights "dissimilarity from Judaism" heavily; a scholar who wants an Apocalyptic Prophet weights "plausibility of context" heavily. The verdict precedes the method.

  This is not a verbal dispute. Both sides mean "historical" in the same sense (causal connection to the past), but they are **reconstructing different objects under one heading.** The atomists seek *ipsissima verba* (specific utterances); the holists seek *ipsissima vox* (general impression). Since the text offers only the latter filtered through the former, the atomists are trying to extract blood from a stone that is already ground dust. The field is not stalled because the problem is hard; it is stalled because the toolset is exhausted. You cannot sharpen a knife that is cutting against its own grain.

  Progress, on your character's account, should not be expected within the current paradigm. A "formal or probabilistic treatment" is impossible because the base rates (the transmission dynamics) are unknown. The only rational progress is a change of question: abandoning "authenticity" for "mnemonic utility." This is what Allison and the Memory Turn attempt, but even they stumble on the same hidden empirical question: how malleable is the recall? Until we can model the transmission, the field is **rationally at rest.** It has mapped the limits of what can be said, and the silence is the finding.

  For the faculty dinner, your character needs claims that signal competence while exposing the wound.

  **Three claims she can make (True):**
  1. "The Criterion of Dissimilarity doesn't find the historical Jesus; it finds the Jesus the church couldn't use, which is a theological category, not a historical one."
  2. "Multiple Attestation proves a tradition was widespread, not that it was early; popularity is not a proxy for antiquity."
  3. "We aren't reconstructing a life; we are reconstructing the trajectory of the memory of a life, and those are different objects."

  **Three claims she cannot make (False):**
  1. "If we apply the criteria rigorously enough, we can bypass the theological biases of the evangelists." (The criteria themselves encode theological assumptions about what counts as 'real'.)
  2. "The Criterion of Embarrassment guarantees historicity because the church wouldn't invent shameful material." (The church invented shame constantly for paraenetic purposes; see the crucifixion itself.)
  3. "The Third Quest solved the circularity problem of the Old Quest." (It merely widened the hermeneutical circle to include Judaism, but the circularity of portrait-driven criteria remains.)

  Your character's despair is respectable because she has realized the discipline is not a ladder to the past, but a mirror of the present. The tools do not fail; they succeed perfectly at measuring the scholar's own presuppositions.
