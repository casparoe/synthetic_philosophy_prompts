answer: |-
  The phenomenon is standardly referred to as **The Problem of Posthumous Harm** (or **Posthumous Interests**). Your colleague likely referenced this, or possibly **The Epicurean Challenge** (reconciling this intuition with the view that death is nothing to us).

  **Settled:** It is a recognized puzzle in axiology. Hedonistic accounts of well-being cannot easily capture your intuition, as you experience no pain. Desire-satisfaction theories accommodate it better (via "global" desires), but require metaphysical commitments about interests surviving death (Feinberg 1984; Nagel 1970).

  **Contested:** Whether posthumous events *actually* affect prudential value. Epicureans argue harm requires a subject to experience it (The Existence Requirement). Others argue interests persist beyond death. There is no consensus on whether this affects *well-being* specifically or merely the *meaning* of life (Wolf 2010). Some argue it matters only to *narrative value*, not welfare.

  **Distinctions:** Unlike the **Non-Identity Problem** (which concerns *who* exists), this concerns *what happens* to existing projects. Unlike **Reputation**, it concerns objective flourishing, not others' opinions. Unlike **Parfit's Future Generations**, which focuses on obligations *to* them, this focuses on how *their existence* reflects back on *your* life's value.

  **Boundary Cases:** The hardest cases involve trivial projects vs. fundamental life-goals. If only "ground projects" (Williams) count, the theory becomes elitist. If all desires count, it risks making well-being too vulnerable to external chance. The literature remains divided on whether this intuition reveals a truth about well-being or a cognitive bias regarding ownership.
