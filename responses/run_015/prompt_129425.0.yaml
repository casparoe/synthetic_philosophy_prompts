answer: |-
  Good evening. For those who don't know me, I'm a senior, and for the last three years, I've spent most of my afternoons behind the gym, in the shop that now bears Ms. Halvorsen's name.

  You've seen the new sign outside. The letters are clean. They hold ink well. Mara Danes drew them—she's sitting right there—and when I asked Ruth about them last week, she just said, "It's a good a."

  That distinction matters. Because for thirty-eight years, Ruth taught us that a letter isn't a shape you can copy. It's a job you have to do.

  She taught us that you can't point to a curve and say, "That is what makes an *a* an *a*." You can change the **skeleton**, the underlying structure. You can close the **counter**, the empty space inside. You can sharpen the **terminal**, the end of the stroke. But if you trace one of her letters perfectly, she'd tell you it's the only one on the page that *isn't* a letter. Because a letter isn't a picture. It's a decision within a system.

  On the easel next to me is a sheet of paper. It holds three hundred *a*s. Every current student in the shop drew them this week. No two are alike. None of them are Ruth's. But every single one of them is an *a*. They all do the work.

  This is why I cannot stand here and list Ruth's qualities. I cannot tell you she was kind, or precise, or demanding. She called that a "spec sheet." She believed a person isn't a bag of traits any more than a letter is a list of curves. To define her by adjectives would be to say she is finished, static. Dead, in her terminology.

  So I will not say she lives on in this new sign. The sign is Mara's work. It belongs to the system Mara is building now. But the room itself—the pressure of the press, the smell of the ink, the permission to touch the wood type—that is the system Ruth built.

  She once asked us what makes a person the same person after a long illness. She said the answer depends on what the rest of us are. If we are the alphabet she designed, then she is still the letter holding us together.

  Ruth, you taught us that identity is not about being copied. It's about making room for other things to function. You gave us the space to make our own marks. You taught us that the work continues not because the hand stays the same, but because the system holds.

  We are not your trace. We are your students. And we are still setting the type.

  Thank you.

  ***

  **Note on Constraints**

  The hardest tension was honoring Ruth without violating her philosophy of identity. First, I wanted to praise her character directly ("she was kind"), but her "spec sheet" rule forbids reducing a person to static adjectives; instead, I framed her influence as the "system" or "room" she built for others. Second, I needed to address the new sign without claiming it *was* her (which she would deny) or dismissing it (which would hurt Mara); I resolved this by validating the sign as "good work" within the continuing system, rather than a spiritual extension of Ruth. Finally, avoiding the "you had to be there" trap meant I had to articulate her philosophy clearly enough for her sister to understand (using the *a* metaphor) while keeping the technical terms accurate enough for the designers in the room.
