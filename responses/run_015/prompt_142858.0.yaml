          *   *Wait, standard Frame Problem logic:*
              *   *Solution A (Frame Axioms):* For every Action $A$ and Fluent $F$, write $A \to (F_{next} \leftrightarrow F_{curr})$. Cost: $O(A \times F)$. Adding an Action is expensive ($O(F)$). Adding a Fluent is expensive ($O(A)$).
              *   *Solution B (Successor State/Effect Axioms):* For every Fluent $F$, write $F_{next} \leftrightarrow (ActionCausesTrue \lor (F_{curr} \land \neg ActionCausesFalse))$. Cost: $O(F \times \text{effects})$. Adding an Action is cheap (just add to relevant Fluent rules). Adding a Fluent is cheap (just write rule for new Fluent).
              *   *Wait, the prompt asks for asymmetry:* "encoding which survived one revision cheaply is the one that gets punished by the other."
              *   Actually, Successor State Axioms (SSA) are generally considered the "solution" to the representational frame problem. To show the *difficulty*, I need to force them into a naive representation first, or show that *maintaining* the SSA is hard when *relevance* is unknown.
