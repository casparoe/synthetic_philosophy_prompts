      *   *Fluents (15-25):* Let's aim for 20. Needs to include the two complications.
      *   *Actions (5-8):* Let's aim for 6 initially, add 1 later.
      *   *Complication 1 (Deferred/Cancelable):* A "Heating" process. Turn on heater -> Hot later, unless Open Window happens in between.
