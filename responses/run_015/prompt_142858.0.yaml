answer: |-
  Here is a complete design for the 90-minute session. It is built to be run exactly as specified, with the "pain points" engineered into the scoring and revision phases.

  # Activity: The Containment Bench

  ## 1. The World Design
  **Setting:** A simplified hazardous materials handling bench.
  **Constraint:** Strict Closed World. If a fact is not on a card, it does not exist. If a rule is not on a sticky note, it does not apply.

  ### The Fluents (20 Total)
  Print these on Index Cards (one per card). Teams place them face-up (True) or face-down (False) on their table.
  *Initial State:* All False, unless noted.

  1.  `Main_Power` (True)
  2.  `Backup_Power`
  3.  `Pump_Active`
  4.  `Valve_Open`
  5.  `Tank_Full`
  6.  `Tank_Pressure_High`
  7.  `Tank_Temp_High`
  8.  `Coolant_Flow`
  9.  `Vent_Open`
  10. `Seal_Locked`
  11. `Alarm_Sounding`
  12. `Alarm_Reset`
  13. `Operator_Present`
  14. `Remote_Mode`
  15. `Calibration_Done`
  16. `Error_Log_Full`
  17. `Safety_Interlock` (Complication 2: Indirect Fluent)
  18. `Vent_Process_Pending` (Complication 1: Deferred Marker)
  19. `System_Ready`
  20. `Containment_Breach`

  ### The Actions (6 Initial + 1 Added Later)
  Print these on Cardstock. Teams "play" an action card to execute it.

  1.  `Start_Pump`
  2.  `Open_Valve`
  3.  `Activate_Coolant`
  4.  `Lock_Seal`
  5.  `Reset_Alarm`
  6.  `Initiate_Vent` (Complication 1: Deferred)
  7.  *(Hidden)* `Install_Sensor` (Added in Phase 3)

  ### The Causal Rules (The "Physics Binder")
  Teams must transcribe these onto Sticky Notes. They are not given all at once; they are discovered or provided as the "Laws of Physics" for the bench. For the sake of time, **provide this master list to all teams at the start of Phase 1**, but require them to transcribe them into their own system.

  1.  `Start_Pump` → `Pump_Active` (True)
  2.  `Open_Valve` → `Valve_Open` (True)
  3.  `Activate_Coolant` → `Coolant_Flow` (True)
  4.  `Lock_Seal` → `Seal_Locked` (True)
  5.  `Reset_Alarm` → `Alarm_Sounding` (False)
  6.  `Initiate_Vent` → `Vent_Process_Pending` (True)
  7.  **Rule 7 (Deferred):** If `Vent_Process_Pending` is True at End of Turn, AND `Lock_Seal` was NOT played this turn → `Vent_Open` (True) AND `Vent_Process_Pending` (False).
  8.  **Rule 8 (Cancellation):** If `Lock_Seal` is played while `Vent_Process_Pending` is True → `Vent_Process_Pending` (False). `Vent_Open` remains False.
  9.  **Rule 9 (Indirect/Qualification):** `Safety_Interlock` is True IF (`Pump_Active` AND `Coolant_Flow`) OR (`Seal_Locked`). (Otherwise False).
  10. **Rule 10 (Ramification):** If `Tank_Pressure_High` AND `Valve_Open` → `Containment_Breach` (True).
  11. **Frame Default:** Any Fluent not explicitly changed by a Rule remains unchanged. **(This is the trap.)**

  ---

  ## 2. Rules, Turn Order, and Payoff Scheme

  **Team Arrangement:** 6 Teams of 3 students.
  **Materials per Team:**
  *   Set of 20 Fluent Cards.
  *   Set of 6 Action Cards.
  *   Pack of Sticky Notes (for rules).
  *   Pen.
  *   Score Sheet.

  **The Economy (Points):**
  *   **Start:** 100 Points.
  *   **Representation Cost:** -1 point per Sticky Note written (Phase 1 & 3).
  *   **Inference Cost:** -1 point per Fluent Card touched/verified per turn (Phase 2).
  *   **Error Penalty:** -10 points per turn for any Fluent reported incorrectly in the State Log.
  *   **Revision Cost:** -1 point per Sticky Note added or modified (Phase 3).

  **Turn Order (Phase 2):**
  1.  **Input:** Instructor announces which Action Card the team "plays" (same action for all teams to ensure comparability, or randomize per team for chaos—*recommendation: Same action for all to compare scores easily*).
  2.  **Processing:** Teams consult their Sticky Notes. They may touch/flip Fluent Cards to update the state. **Every touch costs 1 point.**
  3.  **Output:** Teams submit a "State Vector" (list of all 20 Fluents as T/F) to the Instructor.
  4.  **Scoring:** Instructor checks against the Master Truth. Deduct points for errors and touches.

  ---

  ## 3. The Ramp (Phase Instructions)

  ### Phase 1: Encoding (20 Minutes)
  **Handout:** "The Physics Binder" (The 11 Rules above) and the Blank Score Sheet.
  **Instruction:**
  > "You are building the control software for this bench. You must transcribe the Physics Rules into your system using Sticky Notes. You start with 100 points. Every Sticky Note you write costs 1 point. You may organize these notes however you like (by Action, by Fluent, etc.), but once Phase 2 starts, you cannot move them, only add new ones. Your goal is to maximize your final score."

  **Withhold:** Do not tell them about Phase 3 revisions yet. Do not tell them about the cost of touching cards yet (tell them *during* Phase 2 to simulate the realization of computational cost). *Correction:* To ensure they strategize, tell them the costs upfront.
  **Revised Instruction:** "Every rule written costs 1 point. In the next phase, every fluent you check to update your state will cost 1 point. Incorrect states cost 10 points."

  ### Phase 2: Operation (30 Minutes)
  **Instruction:**
  > "We will run 5 turns. I will announce the Action for each turn. Update your Fluent Cards to match the Physics. Submit your State Vector. Remember: Checking a card costs points. Being wrong costs more."

  **Turn Sequence:**
  1.  `Start_Pump`
  2.  `Activate_Coolant`
  3.  `Initiate_Vent` (Triggers Deferred)
  4.  `Lock_Seal` (Cancels Deferred)
  5.  `Open_Valve` (Triggers Ramification if Pressure High—*set Pressure High initially for this test*)

  *Instructor Note:* During Turn 3, watch for teams who fail to track `Vent_Process_Pending`. During Turn 4, watch for teams who fail to cancel the vent. During Turn 5, watch for `Containment_Breach`.

  ### Phase 3: Revision (25 Minutes)
  **Instruction:**
  > "The lab has been upgraded. We are introducing changes to the physics. You must update your Sticky Notes to accommodate these changes. Each edit costs 1 point."

  **Revision A (New Action):**
  > "We have added a new Action: `Emergency_Stop`. It sets `Pump_Active`, `Coolant_Flow`, and `Vent_Open` to False. It does not affect other fluents."
  > *Teams must update their rules.*

  **Revision B (New Fluent):**
  > "We have added a new sensor: `Radiation_Level`. It is normally Low. The action `Start_Pump` causes it to become High. All other existing Actions leave it Low."
  > *Teams must update their rules.*

  **Final Tally:** Count remaining points.

  ---

  ## 4. Worked Turn Example (Scoring)

  **Scenario:** Team "Logic-Lovers".
  **Current State:** `Pump_Active` (T), `Coolant_Flow` (F).
  **Action:** `Activate_Coolant`.

  **Team Strategy:** They organized rules by **Action** (Effect Axioms).
  *Sticky Note:* `Activate_Coolant` → `Coolant_Flow` (T).
  *Implicit Assumption:* Everything else stays the same (Frame Default).

  **Execution:**
  1.  They read the Action card.
  2.  They find the Sticky Note for `Activate_Coolant`.
  3.  They flip `Coolant_Flow` to True.
  4.  **Crucial Decision:** Do they check `Pump_Active`?
      *   If they trust their "Frame Default", they don't touch it. Cost: 0.
      *   If they are paranoid, they check it. Cost: 1.
  5.  They submit State Vector.
  6.  **Instructor Check:** `Pump_Active` is still True. `Coolant_Flow` is True. All others False.
  7.  **Score:**
      *   Rule Cost: -1 (already paid in Phase 1).
      *   Check Cost: -0 (They trusted the default).
      *   Error Cost: -0.
      *   *Total Turn Cost:* 0.

  **Contrast:** Team "Paranoids".
  **Strategy:** They check every Fluent every turn to be sure.
  **Score:** -20 points (for touching 20 cards). They will go bankrupt by Turn 5.

  **Contrast:** Team "Naive".
  **Strategy:** They wrote rules by Action, but didn't write "Frame Defaults".
  **Turn 5 (`Open_Valve`):** They update `Valve_Open`. They forget to check `Containment_Breach`.
  **Result:** `Containment_Breach` should be True (Ramification). They report False.
  **Score:** -10 points penalty.

  ---

  ## 5. Debrief Guide (15 Minutes)

  **1. The Representation Trade-off (The "Binder" Problem)**
  *   **Ask:** "When I added `Emergency_Stop` (New Action), which teams had to write many notes? When I added `Radiation_Level` (New Fluent), which teams had to write many notes?"
  *   **Reveal:**
      *   Teams who organized by **Action** (Effect Axioms): New Action was cheap (1 note). New Fluent was expensive (had to add "No Change" to all 6 existing Actions).
      *   Teams who organized by **Fluent** (Successor State Axioms): New Action was expensive (had to find every Fluent the Action affects). New Fluent was cheap (1 note).
  *   **Point:** There is no encoding that is cheap for *both* types of growth. This is the **Representational Frame Problem**.

  **2. The Relevance Problem (The "Touching" Problem)**
  *   **Ask:** "Who checked every card every turn? Who went bankrupt? Who trusted their rules and got burned by the `Containment_Breach`?"
  *   **Point:** You cannot afford to check everything (Sensors are cheap, *attention* is expensive). You must predict what changes. But to predict what changes, you need to know what is relevant. To know what is relevant, you need to know what changes. This is the **Inferential Frame Problem**.

  **3. The Arithmetic of Explosion**
  *   **Write on Whiteboard:**
      *   $A$ = Actions, $F$ = Fluents.
      *   **Naive Approach:** Write $A \times F$ rules (Action $A$ leaves Fluent $F$ alone).
      *   **Growth:** Add 1 Action $\to$ Write $F$ new rules. Add 1 Fluent $\to$ Write $A$ new rules.
      *   **Real World:** $A$ and $F$ are in the millions. $A \times F$ is impossible.
  *   **Point:** The problem isn't that the world is messy. It's that the *logic of change* requires specifying non-change, and non-change is the vast majority of reality.

  **4. Addressing "Why not just look?"**
  *   **Student Objection:** "A robot with cameras sees what changed. It doesn't need rules."
  *   **Your Reply:** "The camera gives you a million pixels. Which pixels matter? If a pixel changes in the background, do you update your belief about the 'Safety_Interlock'? You need a rule to tell you which data to process. Writing that rule *is* the Frame Problem. Sensors solve data acquisition; they do not solve relevance."

  ---

  ## 6. Troubleshooting & Predictable Failures

  **1. Common-Sense Smuggling**
  *   **Symptom:** A team argues "`Lock_Seal` obviously doesn't change `Radiation_Level`, we don't need a rule."
  *   **Fix:** Enforce the "Physics Binder" strictly. "In this universe, magic exists. Unless you write that `Lock_Seal` does not change `Radiation`, I will rule that it *might*."
  *   **Why:** This forces them to feel the burden of explicitness.

  **2. The Degenerate Strategy (Check Everything)**
  *   **Symptom:** A team decides to touch all 20 cards every turn.
  *   **Fix:** The scoring punishes this (-20/turn). If they still do it, highlight in debrief that they solved the Frame Problem by brute force, which scales poorly. "You solved it for 20 fluents. Try it for 20 million."

  **3. The "Artifact" Objection**
  *   **Symptom:** "This is just because you made up arbitrary rules. Real physics doesn't work this way."
  *   **Fix:** "Real physics implies conservation laws (things stay the same unless pushed). That *is* the Frame Default. You are assuming stability. The AI has to *represent* that stability. The artifact is the game; the logic is universal."

  **4. Over-Flagging then Under-Flagging**
  *   **Symptom:** After the `Containment_Breach` surprise, teams start checking everything. Then they get tired and stop checking.
  *   **Fix:** Use this in debrief to illustrate the instability of heuristic relevance. "You adjusted your relevance filter, but you couldn't maintain the cost."

  ---

  ## 7. Honesty About Limits (The Final 10 Minutes)

  You must explicitly state what the game *did not* teach them, to prevent false conclusions.

  **1. The Architectural Claim**
  *   **Say:** "This game showed you a combinatorial explosion in a *logical symbol system*. It proves that *this specific way of thinking* (explicit rules + state vectors) breaks. It does not prove that *connectionist* or *sub-symbolic* systems break the same way."
  *   **Why:** CS students will immediately jump to Neural Nets. Acknowledge that NNs hide the frame problem in weights, but don't necessarily solve the *relevance* issue (they still suffer from catastrophic forgetting or lack of systematic generalization).

  **2. The Philosophical Claim**
  *   **Say:** "McCarthy and Hayes thought this was a bug in the code. Dennett and others argued it's a bug in the *concept of mind*. If you think knowledge is a list of sentences, you have a Frame Problem. If you think knowledge is a skill or a habit, the problem looks different. We just broke the Sentence-Model of Mind."

  **3. The "Solution"**
  *   **Say:** "There is no agreed-upon solution. Successor State Axioms (organizing by Fluent) fix the Representation problem but make the Inference problem harder (you have to search all Fluents to find which Action applies). We trade one cost for another. That is the lesson: **Cognition is a resource management problem, not just a truth-tracking problem.**"

  ---

  ## Instructor Prep Checklist
  1.  **Print 6 sets** of 20 Fluent Cards.
  2.  **Print 6 sets** of 6 Action Cards.
  3.  **Sticky Notes:** Ensure plenty of small squares.
  4.  **Master Truth Table:** Have the correct state for all 5 turns pre-calculated so you can grade instantly.
  5.  **Timer:** Strict timekeeping is essential to induce pressure.
  6.  **Whiteboard:** Pre-draw the Score Table (Team 1-6, Phase 1, 2, 3, Total).

  This design forces the trade-off physically. They will *feel* the cost of writing the sticky notes and the cost of touching the cards. When you add the new Fluent in Phase 3, the teams who organized by Action will physically groan as they have to write 6 new notes. That groan is the learning objective.
