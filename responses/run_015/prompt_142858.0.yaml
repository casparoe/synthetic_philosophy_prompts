  2.  **Deconstruct the Frame Problem for this Context:**
      *   The "Frame Problem" in AI (McCarthy & Hayes) is about representing change without listing every non-change.
      *   The "Qualification Problem" is about the infinite conditions required for an action to succeed.
      *   The "Ramification Problem" is about indirect consequences.
      *   *Crucial distinction:* The prompt asks for the *representational* frame problem (how to write the rules) and the *inferential* frame problem (what to re-check).
      *   *The Trap:* Students think "more sensors/compute" solves it. The activity must show that *logic/representation* is the bottleneck, not data.

