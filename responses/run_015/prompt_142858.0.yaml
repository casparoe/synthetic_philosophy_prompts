      *   Goal: Show the trade-off between *Frame Axioms* (listing what stays same) vs. *Successor State Axioms* (listing what changes).
      *   Actually, a better trade-off for a game is *Explicitness vs. Modularity*.
      *   *Phase 1:* Write rules. Cost = number of sentences written.
      *   *Phase 2:* Update state. Cost = number of fluents checked/updated per turn.
      *   *Phase 3:* Revision. Add new Action (penalizes Successor State style if not careful) vs. Add new Fluent (penalizes Frame Axiom style).
