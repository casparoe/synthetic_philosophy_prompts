  **Missing Distinction**
  Both parties operate within an **internalist** framework of justification, assuming that for a rule to be justified, the agent must be able to cite a reason or argument for it. They miss the distinction between **dialectical justification** (persuading a skeptic via argument) and **epistemic entitlement** (having a warrant without needing an argument). An externalist or entitlement theorist (e.g., Crispin Wright) would argue that we are *entitled* to use MP without being able to prove its validity non-circularly. This changes the outcome by allowing that deduction *is* justified (externally), even if Ellis is right that no *argument* can satisfy the Tortoise. Norah's hope for vindication and Ellis's concession that "it will not be an argument" could be reconciled: the justification exists, but it is not argumentative in shape.

