answer: |-
  The empty chair breeds a quiet **resentment**,
  Crowding out the usual **gratitude**.
  Where has the ordinary **love** gone?
  I wait for a reason worthy of **forgiveness**,
  Not a hollow, automatic **excuse**.
  I am a person, not a case for **treatment**.

  You say you needed medical **treatment**,
  And suddenly the edge of **resentment** dulls.
  Is that a valid **excuse**?
  It invites a return of **gratitude**,
  Or at least a prompt **forgiveness**,
  Because I still know how to **love**.

  But then a shadow falls on **love**,
  A vast climate of **treatment**.
  It washes away the need for **forgiveness**,
  And dissolves the salt of **resentment**.
  It steals the bread of **gratitude**,
  Leaving nothing here to **excuse**.

  Is there anyone to **excuse**?
  In a clinic without **love**,
  Where does **gratitude** go?
  We are subjects of **treatment**,
  Strangers to **resentment**,
  And strangers to **forgiveness**.

  I do not grant **forgiveness**,
  I reject the grand **excuse**.
  I hold onto **resentment**,
  To prove I am capable of **love**,
  Not a subject for **treatment**,
  But a partner in **gratitude**.

  There is no room for **gratitude**,
  Nor any act of **forgiveness**,
  Only a policy of **treatment**,
  A final, calm **excuse**,
  That kills the **love**,
  And leaves only **resentment**.

  If I cannot offer **gratitude** or **forgiveness**,
  If there is no **love** left to **excuse**,
  Then I am left with **resentment** and your **treatment**.
