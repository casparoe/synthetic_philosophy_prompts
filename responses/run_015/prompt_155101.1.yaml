answer: |-
  ### 1. Agent Mapping

  To apply the framework, we must identify the valuing standpoints operative in the capsule and determine which value-components (manifest-feature vs. provenance) were dominant for each agent, alongside the evidence they relied upon.

  *   **The Connoisseur-Experts (e.g., Bredius):**
      *   **Value:** Primarily **provenance-value**. While they praised the manifest features (light, composition), the *intensity* of this praise was contingent on the belief that these features were generated by a 17th-century genius.
      *   **Options:** Praise, authenticate, recommend acquisition.
      *   **Evidence:** Stylistic expertise (visual features interpreted through a historical lens) and provenance documents (though in this case, the provenance was fabricated or assumed).
      *   **Framework Implication:** Under the **counterfactual-attribution test**, if Bredius had known the canvas was by van Meegeren, his valuation would have collapsed. Therefore, his response was **revelation-sensitive**.

  *   **The Museum/Art Society:**
      *   **Value:** **Provenance-value** mixed with institutional trust-value. Acquiring a "Vermeer" secures national heritage status and public prestige.
      *   **Options:** Buy, display as Old Master, reclassify, or deaccession.
      *   **Evidence:** Expert testimony (Bredius) and the object's integration into the historical canon.
      *   **Framework Implication:** The purchase was rational based on available evidence, but the value held was not inherent to the canvas alone; it was relational. Upon revelation, the museum faced a choice: destroy the object (rejecting its new status) or recontextualize it (accepting second-order authenticity).

  *   **The Ordinary Pre-Revelation Viewer:**
      *   **Value:** A blend, but heavily weighted toward **provenance-value** via deference to authority. They experience the manifest features but derive esteem from the label "Vermeer."
      *   **Options:** Admire, visit, feel cultural pride.
      *   **Evidence:** Expert testimony and museum context.
      *   **Framework Implication:** Their enjoyment is **revelation-sensitive**. If told it is a fake, the "snobbery" your friend mentions is actually a loss of provenance-value, not necessarily a loss of visual pleasure, though the two are often entangled.

  *   **Hermann Göring:**
      *   **Value:** **Provenance-value** as power and status. Owning a Vermeer signals dominance and cultural appropriation.
      *   **Options:** Buy, display, hoard.
      *   **Evidence:** Dealer assurance and the visual grandeur of the work.
      *   **Framework Implication:** For Göring, the manifest features were secondary to the causal history (that it was a treasure stolen from the Dutch). The framework highlights that his valuation was entirely dependent on a false provenance.

  *   **The Postwar Public (Van Meegeren as Hero):**
      *   **Value:** **Second-order authenticity**. The object became a witness to a specific historical drama (deceiving the Nazis/art establishment).
      *   **Options:** Celebrate, visit as a curiosity, forgive the forgery.
      *   **Evidence:** The confession and the legal outcome.
      *   **Framework Implication:** This group demonstrates the framework's fourth component. The object gained a new causal history (van Meegeren vs. Nazis) that generated a new form of provenance-value, distinct from the original Vermeer-value.

  *   **The Present-Day Viewer:**
      *   **Value:** **Manifest-feature value** (appreciating the craft of the fake) and **Second-order authenticity** (historical interest).
      *   **Options:** View as a forgery, study technique, reflect on deception.
      *   **Evidence:** Knowledge of the confession, art historical records.
      *   **Framework Implication:** The viewer can rationally value the object without believing it is a Vermeer. The value is no longer revelation-sensitive regarding the *Vermeer* claim (since it is known to be false), but it is sensitive to the *van Meegeren* claim.

  ### 2. Explanatory Mapping

  The framework illuminates the trajectory of the *Supper at Emmaus* by categorizing the shifts in value as shifts in the type of relation the viewer holds to the object.

  *   **Initial Acclaim:** The framework explains this as a high valuation of **provenance-value**. The experts were not merely hallucinating beauty; they were correctly identifying manifest features but incorrectly attributing their causal source. The high price and esteem were rational responses to the *belief* in Vermeer's authorship.
  *   **The Shock of Exposure:** This is explained as a sudden collapse of provenance-value. The **counterfactual-attribution test** confirms this: if the painting had been presented as "van Meegeren, 1930" initially, it would not have commanded the same price or reverence. The "loss" your friend dismisses as snobbery is, under this framework, the loss of a specific historical relation (17th-century genius) that cannot be recovered by looking.
  *   **Legal and Public Standing:** Van Meegeren's shift from traitor to hero is explained by the **second-order-authenticity problem**. The object (and the artist) acquired a new causal history. The painting was no longer a "failed Vermeer" but a "successful van Meegeren." The value did not vanish; it transmuted. The public valued the narrative of deception (a specific historical act) over the narrative of creation (the original Vermeer act).
  *   **Exhibition as Forgeries:** The fact that the paintings are displayed rather than destroyed confirms that **manifest-feature value** and **second-order authenticity** retain worth. The museum reclassified the object. It is no longer exhibited as a window into the 17th century, but as a window into 20th-century deception and technical skill. The framework validates this as a rational re-categorization rather than a mere consolation prize.

  ### 3. Silence and Distortion

  While the framework clarifies the aesthetic and metaphysical shifts, it is silent or distorting regarding ethical, political, and phenomenological dimensions.

  *   **Moral and Political Valence:** The framework treats Göring's purchase as a valuation of provenance. It cannot adequately capture the *moral* stain of the transaction. Selling a "national treasure" to an occupier is treason; selling a fake is fraud. The framework distinguishes these as different provenance histories, but it lacks the normative resources to explain why one is a capital offense and the other a lesser crime, other than through external legal definitions. It reduces a moral catastrophe to a change in attribution.
  *   **Theory-Laden Perception:** The framework assumes **manifest-feature value** can be considered "apart from who made it." However, the Van Meegeren case suggests that expert perception is theory-laden. Bredius saw "Vermeer's light" partly because he believed it was Vermeer. If the framework insists manifest value is independent of attribution, it distorts the phenomenology of viewing. Experts may literally *see* differently when they believe they are looking at a master. The framework's binary (manifest vs. provenance) may be too clean; attribution may bleed into perception.
  *   **The "Bad Fake" Problem:** The **second-order-authenticity** component suggests that exposed fakes become "genuine historical objects of a different kind." This risks being too generous. If van Meegeren had produced a clumsy, obvious fake, it would not have acquired the same "hero" status or museum value. The framework implies that *any* exposed forgery gains second-order value, but in reality, only *successful* or *notorious* fakes do. It cannot explain why some fakes are discarded while others are curated.
  *   **The Phenomenology of Betrayal:** The framework describes the change in value but does not fully account for the emotional feeling of *betrayal*. The "shock" is not just a recalculation of provenance-value; it is a violation of trust in the institution. The framework treats this as "trust-value" but does not analyze the ethical breach inherent in the forgery itself, distinct from the object's properties.

  ### 4. Two-Directional Test

  Here we test the framework against the case to see if the case breaks the framework or if the framework holds.

  *   **Does it confirm Provenance-Value is distinct?**
      *   *Yes.* The massive price differential between the "Vermeer" phase and the "van Meegeren" phase, despite no physical change to the canvas, confirms that a significant portion of the value was relational (provenance), not intrinsic (manifest). This supports your position against your friend: something real was lost (the historical relation), not just a label.
  *   **Does it show Manifest-Feature Value is less independent than assumed?**
      *   *Yes, this is a significant challenge.* The experts praised the composition *as* Vermeer's solution to a problem. If they knew it was van Meegeren, they might have criticized the same composition as pastiche or derivative. This suggests manifest-feature value is not fully isolationist.
      *   *Ranking:* **Awkward but manageable.** The framework can accommodate this by acknowledging that "manifest features" are always perceived under a description, but it must concede that the *valuation* of those features is often entangled with attribution.
  *   **Does Second-Order Authenticity rescue too much?**
      *   *Yes, this is a potential fatal flaw.* If every exposed forgery becomes a "genuine van Meegeren" (or "genuine [Forger]"), then the category of "fake" as a negative value judgment loses its bite. It risks turning every fraud into a potential museum piece.
      *   *Ranking:* **Awkward.** It requires a qualification: second-order authenticity generates value only if the new causal history is itself culturally significant (e.g., deceiving Göring). A random forgery discovered in an attic does not gain this value.
  *   **Concession vs. Rejection:**
      *   *Concede:* You should concede that manifest-feature value is not hermetically sealed from attribution beliefs (theory-laden perception).
      *   *Reject:* You should reject your friend's claim that *only* snobbery is lost. The framework proves that provenance-value is a rational category of value, not merely social posturing. The loss of the causal link to Vermeer is a loss of a specific kind of historical good, even if the visual array remains.

  ### 5. Epistemic Audit

  Finally, we must distinguish between settled facts, live philosophical controversies, and interpretive applications of your framework.

  *   **Settled Common Knowledge (Historical/Art World):**
      *   It is settled that van Meegeren painted the *Supper at Emmaus* in the 1930s.
      *   It is settled that the painting was sold and displayed as a Vermeer before the confession.
      *   It is settled that the market value and critical esteem collapsed upon the revelation of the forgery.
      *   It is settled that the painting is currently preserved and exhibited as a van Meegeren/forgery, not discarded.

  *   **Live Controversies (Philosophy of Art):**
      *   **Perceptual Independence:** There is no consensus on whether a viewer *can* truly separate manifest-feature value from provenance beliefs. Some philosophers (following Nelson Goodman) argue that knowing a work is a fake changes the aesthetic experience itself; others argue the visual properties remain identical. Your framework assumes they can be distinguished, but this is contested.
      *   **The Nature of Provenance-Value:** It is contested whether provenance-value is a *genuine* aesthetic value or merely an economic/biographical preference. Your friend argues it is the latter (snobbery); you argue it is the former (historical relation). The framework supports your view, but the debate is unresolved in the broader field.
      *   **Artistic vs. Aesthetic Value:** It is contested whether a forgery can be aesthetically equal to an original but artistically inferior. The Van Meegeren case is often used as evidence that they can be aesthetically similar (experts were fooled) but artistically different (one is innovative, one is derivative).

  *   **Interpretations vs. Entailments:**
      *   **Interpretation:** My claim that the Postwar Public valued "Second-Order Authenticity" is an interpretation of their behavior through your lens. One could alternatively argue they simply enjoyed the scandal, not the object's new ontological status.
      *   **Entailment:** It is an entailment of your framework that if the value changes solely due to belief change (with features fixed), the value is revelation-sensitive. The case fits this entailment.
      *   **Interpretation:** My assessment that the framework's "Second-Order" move is "too generous" is a critical evaluation, not a logical necessity of the framework itself. The framework allows for the move; it does not mandate that *all* fakes must be valued, only that they *can* be reclassified.

  In sum, the framework successfully validates your intuition that something real (provenance-value) is lost in forgery exposure, countering the "snobbery" charge. However, it requires refinement to account for the way attribution influences perception itself, and it must be careful not to imply that all forgeries automatically gain value as historical curiosities.
