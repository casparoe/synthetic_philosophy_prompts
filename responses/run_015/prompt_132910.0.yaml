      *   **Research Question:** Needs to be sharp. "Does the requirement of source-code transparency in program equilibrium induce a fixed-point failure in models of shared intentionality that require nested procedural self-representation?"
      *   **Literature Gap:** Nash = action opacity. SI = belief transparency. Neither addresses *procedure* transparency + *recursive self-modeling*.
      *   **Method:** Formalize a 2-agent PE game where payoffs depend on establishing a "We-Intention." Use modal logic of provability or computability theory. Analyze if the fixed point exists.
      *   **Plan:** Months 1-2 (Formalization), 3-4 (Analysis/Proof), 5 (Interpretation), 6 (Writing). Contingency: If full computability proof fails, switch to modal logic approximation.
      *   **Success:** Conditions defined for stability vs. instability. Implications for opacity in agency.
