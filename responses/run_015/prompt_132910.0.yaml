      *   **Pre-writing Task:** Brainstorm the conceptual landscape (Program Equilibrium vs. Nash, identify philosophical tension).

  2.  **Brainstorming & Conceptual Landscape:**
      *   *Program Equilibrium (PE):* Agents submit programs that read each other's source code. Outcome depends on simulation. Key feature: Transparency of *mechanism*, not just outcome. Allows for conditional cooperation based on proof of cooperation (e.g., Prisoner's Dilemma solved via modal logic or quining).
      *   *Nash Equilibrium (NE):* Agents choose actions based on beliefs about others' actions. Reasoning is opaque; only the choice matters.
      *   *Shared Intentionality (SI):* Bratman, Gilbert, etc. "We-intentions." Requires mutual belief/knowledge that we intend X. Usually modeled via common belief operators ($C_B$).
      *   *The Tension:* SI assumes agents can represent each other's *intentions* (propositional attitudes). PE requires agents to represent each other's *decision procedures* (computational functions).
      *   *The Specific Problem:* If Agent A must simulate Agent B to determine A's action, and Agent B must simulate Agent A, and both simulations must include a model of the simulator (to satisfy SI requirements of mutual recognition), we hit a recursive nesting problem. In PE, this is often handled by fixed-point theorems (like Kleene's Recursion Theorem). In SI, it's handled by common belief axioms.
      *   *The Philosophical Tension:* Does the *mechanical* transparency of PE undermine the *normative* stability of SI? If I see your code, do I still "share" an intention with you, or am I merely predicting you? More technically: Does the requirement to model the *process* of reasoning (not just the belief state) introduce a Gödelian incompleteness or fixed-point failure that standard Common Belief models hide?
      *   *Identified Tension:* Standard SI models assume that "mutual recognition" is transparently accessible without cost or logical paradox. PE reveals that accessing the *procedure* of recognition might trigger infinite regress or inconsistency when the procedure itself includes the recognition condition. This is the "Reflective Instability."

  3.  **Drafting - Section by Section:**

