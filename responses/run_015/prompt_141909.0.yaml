answer: |-
  Public commemoration is obligatory only where it prevents the active erasure of victims' moral status and sustains the integrity of the wronged site or community, becoming impermissible when it instrumentalises the dead for the living's self-regard or obstructs the viability of a shared political future.

  In arriving at this, I tested three candidate principles against your eight cases. First, I considered a purely archival principle: that the duty is discharged if the truth is preserved somewhere accessible. This broke on Case 2, where archives remained intact yet the removal of the gallery constituted betrayal; it also failed Case 1, where an unlisted PDF was deemed admirable rather than negligent. Second, I tested a strictly relational principle, akin to your own draft, where memory is duty-bound only if it sustains a specific relationship between living and dead. This broke on Case 7, where the duty is to *forget* to preserve social peace, and on Case 3, where no relational lineage exists yet the duty persists. Third, I considered a utilitarian calculus of harm and benefit. This broke on Case 8, where the recoil is deontological (about the integrity of the dead) rather than consequentialist. The principle stated above synthesises the surviving insights: it distinguishes public status from private grief, active erasure from passive neglect, and witness from performance. I had to make a judgement rather than a deduction on Case 1, distinguishing between 'neglect' (permissible) and 'erasure' (forbidden); this rests on the political judgement that the amnesty trade-off secured a future viability that outweighed the passive fading of the report. I also made a judgement on Case 3, extending the definition of 'community' to include stewardship of place rather than solely lineage, which is a normative leap not strictly deducible from the facts provided.

  (i) **The Principle:** Public commemoration is obligatory only where it prevents the active erasure of victims' moral status and sustains the integrity of the wronged site or community, becoming impermissible when it instrumentalises the dead for the living's self-regard or obstructs the viability of a shared political future.

  (ii) **Table of Verdicts**

  | Case | Verdict under Principle | Agrees or Conflicts |
  | :--- | :--- | :--- |
  | 1 (Amnesty Report) | Permissible (No active erasure; future viability secured) | Agrees |
  | 2 (Museum Removal) | Wrong (Active erasure of public status) | Agrees |
  | 3 (Town Pogrom) | Obligatory (Stewardship of wronged site) | Agrees |
  | 4 (Family Grave) | No Obligation (Private sphere; no public status at stake) | Agrees |
  | 5 (Settler Contrition) | Impermissible (Instrumentalises dead; ignores victim agency) | Agrees |
  | 6 (Saturation) | Impermissible (Instrumentalises memory for self-regard) | Agrees |
  | 7 (Post-Conflict Silence) | Obligatory to Forget (Protects shared political future) | Agrees |
  | 8 (AI Testimony) | Impermissible (Instrumentalises dead; violates integrity) | Agrees |

  (iii) **Conflicts and Costs of Surrender**
  There are no direct conflicts between the principle and your verdicts, but there is one point of tension that requires you to surrender a specific intuition if you wish to hold the principle strictly.
  1.  **Case 1 (The Unlisted PDF):** This is the highest cost potential conflict. The principle permits this because it is not *active* erasure and aids *future viability*. To hold your verdict here while tightening the principle, you would have to say that the world is such that truth *must* be publicly integrated, not just archived. To go on holding your verdict, you must accept that political stability can sometimes morally outweigh public visibility, provided the truth is not actively destroyed.
  2.  **Case 3 (The Town):** The principle relies on 'stewardship of site'. If you surrender this, you must accept that memory dies with lineage. The cost is high: it renders place-based memory unintelligible. You would have to say about the world that geography carries no moral weight, only genetics.
  3.  **Case 4 (The Family):** The principle excludes private memory from *obligation*. If you feel a tug of duty here, you would have to say that lineage itself generates normative claims independent of public status. The cost is low; surrendering this aligns with your 'faintly absurd' verdict.

  (iv) **Structural Features**
  The work is being done by the distinction between **Public Status** and **Private Sentiment**, and between **Active Erasure** and **Passive Fade**.
  *   **Case 2 vs Case 1:** The feature is *agency of removal*. In Case 2, the state actively removes a gallery (erasure). In Case 1, the public passively ignores a report (neglect). If you vary this feature—say, the state in Case 1 actively suppressed the PDF—the verdict flips to 'Wrong'.
  *   **Case 3 vs Case 4:** The feature is *sphere of memory*. Case 3 is public/place-based; Case 4 is private/lineage-based. If you vary this—make the town pogrom a private family secret—the duty lapses.
  *   **Case 5/6 vs Case 2:** The feature is *direction of benefit*. In Case 2, memory benefits the victim's status. In 5/6, memory benefits the commemorator's virtue. If you vary this—make the settler contrition requested by victims—the verdict flips to 'Permissible'.

  (v) **Test and Repair of Your Principle**
  *Your Principle:* "A wrong must be remembered by whoever is in a position to sustain, through the remembering, a relation that the wrong damaged; and the duty lapses when remembering no longer sustains such a relation but merely substitutes for one."
  *Test:*
  1.  **Case 4 (Family):** Your principle implies a duty if the family is 'in a position to sustain a relation'. You feel no duty. The principle convicts you because lineage looks like a 'position'.
  2.  **Case 7 (Forgetting):** Your principle mandates remembering to sustain a relation. It cannot account for a duty to *forget* to sustain a community.
  3.  **Case 8 (AI):** Your principle focuses on 'relation'. It does not capture the *integrity* violation of the dead subject.
  *Repair:* "A wrong must be remembered by the political community occupying the site of the wrong to sustain the victim's public moral status, unless remembering instrumentalises the dead or obstructs the viability of a shared future; private lineage generates no such duty."
  *Why this repairs it:* It adds the 'public status' constraint (solving Case 4), the 'viability' constraint (solving Case 7), and the 'instrumentalisation' constraint (solving Case 5, 6, 8).

  (vi) **Verdicts on Unsettled Cases**
  (a) **Unilateral Discontinuation:** Yes, a political community may discontinue commemorating once every direct claimant is dead and no descendant has asked for it to continue, *provided* the memory is archived (not erased) and the discontinuation does not signal a revisionist denial of the wrong. The duty shifts from active commemoration to passive preservation.
  (b) **Stranger Adoption:** No, a duty to remember cannot be discharged by complete strangers adopting a forgotten massacre as their cause, unless invited by the victims' descendants. Without invitation, this risks instrumentalisation (Case 5/6), turning the victims' suffering into a prop for the strangers' moral identity.

  (vii) **Saturation**
  Saturation is a real moral category, not merely aesthetic impatience. It marks the point where the *function* of memory shifts from witnessing the victim to signalling the virtue of the witness. When commemoration becomes professionalised and continuous (Case 6), it ceases to be a disruptive moral demand and becomes part of the bureaucratic background, allowing the commemorators to feel they have 'done' morality without further cost. The moral wrong lies in this self-exoneration; the aesthetic weariness is the symptom of recognizing the performance has become hollow.
