answer: |-
  **1. The Temporal Application Problem**
  **Question:** Consider a statute enacted in the 1930s applied to technological facts nobody then envisaged, like the internet or AI. On your account, whose expectations determine the interpretive method: the enacting legislature's or the current one's?
  **Anticipated Reply:** It must be the enacting legislature's expectations; otherwise, we lose the original authority that grounds the statute. The method is fixed at enactment.
  **Follow-up:** But if the enacting legislature could not conceive of the facts, how can they empirically hold an expectation about the *method* for resolving them? Doesn't this force judges to impute expectations to dead legislators, collapsing your empirical claim into a judicial fiction?

  **2. The Aggregation Problem**
  **Question:** Legislatures are multimember bodies. Some members expect textualism, some expect purposivism, and many have no methodological expectations at all. How are these divergent or non-existent expectations to be aggregated to find a single "correct" method?
  **Anticipated Reply:** We look to the default expectation. Legislators know that courts read text, so they generally expect textualism unless they signal otherwise.
  **Follow-up:** Is there actual empirical evidence for that claim, or is it a presumption? If many legislators rely on staff and lobbyists who expect courts to consult committee reports, doesn't your "default" simply privilege the judge's own methodological preference under the guise of empiricism?

  **3. The Purposivism Charge**
  **Question:** Critics will argue this view is purposivism in disguise. If the authority of the method rests on what the legislature *wanted* courts to do, aren't you still appealing to a counterfactual legislative attitude rather than the text itself?
  **Anticipated Reply:** No, my view concerns the expected *method* of interpretation, not the expected *outcome* of the case. I am asking how they wanted the law read, not what result they wanted.
  **Follow-up:** But if the "method" is chosen solely because the legislature willed it, isn't the legislative will still the ultimate authority? How is that substantively different from the *Holy Trinity* appeal to the "spirit" or "intention of its makers" that you opened with?

  **4. Statutory Override of Method**
  **Question:** On your account, could Congress switch the correct method by statute? For example, could they pass a law directing courts to consult committee reports rather than relying on the text alone?
  **Anticipated Reply:** A legislature may choose its interpreters' methods, but only within the limits of whatever anti-delegation rationale you accept. They cannot compel courts to violate constitutional bounds.
  **Follow-up:** Who sets those constitutional bounds? If it is the courts deciding the limits of legislative control over interpretation, isn't the empirical fact of legislative expectation rendered irrelevant whenever it conflicts with judicial doctrine?

  **5. The Hard Case: Vehicles in the Park**
  **Question:** Consider a municipal ordinance barring "vehicles" from a public park applied to a motorized wheelchair. The text includes it, the purpose excludes it, and the absurdity carve-out you concede may not clearly reach it. How does your theory resolve this?
  **Anticipated Reply:** We must investigate what that specific municipality expected courts to do in such ambiguous cases. If the empirical record is silent, we look to the background default.
  **Follow-up:** For local ordinances, that empirical record is almost always unknowable. If the fact is unavailable, does your theory offer a decision rule? Or does it default to the judge's own preference, which undermines the rule-of-law stability you seek?

  **6. The *Holy Trinity* Hook**
  **Question:** You opened by quoting *Holy Trinity Church* to suggest textualists and purposivists are looking for justification in the wrong place. But *Holy Trinity* was explicitly rejected by modern textualists precisely because it prioritized spirit over letter. Does your theory actually require us to vindicate *Holy Trinity* for statutes from that era?
  **Anticipated Reply:** It vindicates the *structure* of the reasoning (looking to legislative authority) but not necessarily the outcome, unless the 1892 Congress actually expected courts to ignore the text.
  **Follow-up:** If historical research showed the 1892 Congress *did* expect courts to prioritize spirit over letter, would you be committed to applying *Holy Trinity* reasoning today? If not, why not?

  **7. The Rejection of Notice**
  **Question:** You argue that textualism's authority rests on empirical facts rather than notice or democratic legitimacy. But if citizens cannot know the empirical expectations of a past legislature, don't they lack fair notice of how their laws will be interpreted?
  **Anticipated Reply:** Authority comes from the enactment itself, not the citizen's ability to predict the interpretive method. The law is binding regardless of their methodological knowledge.
  **Follow-up:** But if the method changes the meaning, and the method is hidden in historical empirical facts inaccessible to the public, isn't the "law" effectively secret? Doesn't that undermine the very democratic legitimacy you claim to sidestep?

  **8. Judicial Competence**
  **Question:** Your theory requires judges to act as empirical historians regarding legislative expectations for every statute. Do courts actually have the resources and tools to make these findings reliably?
  **Anticipated Reply:** Courts already make empirical assumptions about legislatures implicitly; I am just asking them to make them explicit and evidence-based.
  **Follow-up:** There is a difference between a working assumption and a factual finding. If the evidence is contested, does the judge become a fact-finder in a trial without parties? Doesn't this politicize the bench by forcing them to adjudicate historical disputes?

  **9. Stability and the Rule of Law**
  **Question:** If the correct interpretive method depends on the contingent practices of each specific Congress, doesn't this create instability? A citizen would need to know the drafting culture of 1930 versus 1990 to understand the law.
  **Anticipated Reply:** Accuracy to the legislative authority is more important than stability. The law is what the legislature authorized, even if that authorization varies over time.
  **Follow-up:** But the Rule of Law requires that like cases be treated alike. If two identical statutory texts are interpreted differently solely because of the era they were passed, aren't you prioritizing historical accuracy over legal coherence?

  **10. Empirical Falsification (Closing)**
  **Question:** Finally, to test the strength of your empirical commitment: What specific empirical finding would make you give this view up? If we discovered legislators generally expect courts to ignore the text, would you abandon textualism?
  **Anticipated Reply:** If the empirical finding was that legislators expect methods that fundamentally destroy the rule of law or judicial independence, I would have to reject that expectation on normative grounds.
  **Follow-up:** But if you are willing to reject the empirical finding on normative grounds, doesn't that mean your theory ultimately rests on normative values after all? Isn't the empiricism just window dressing for the values you won't surrender?
