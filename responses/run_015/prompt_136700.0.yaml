answer: |-
  The 1793 Macartney Embassy serves as a critical stress test for the contrastive framework often applied to the Great Divergence. When the "Needham Question" is operationalized as a contrastive explanation—"Why did industrial modernity emerge in Britain (P) rather than China (Q)?"—it presupposes that Britain and Qing China constitute comparable units within a shared causal field. Analyzing the Macartney episode through this lens reveals significant friction between the logical requirements of contrastive explanation and the historical ontology of the late eighteenth-century Eurasian order.

  ### Mapping the Episode: Actors, Constraints, and Option Sets

  To evaluate the explanatory fit, we must first strip the embassy of narrative teleology and map the decision space as it existed in 1793.

  **Principal Actors and Logics**
  The British delegation, led by Lord Macartney, operated within an emerging Westphalian logic of sovereign equality and fiscal-military expansionism. Their objective function was the maximization of trade access and the securing of extraterritorial diplomatic rights to reduce transaction costs for the East India Company. The Qing court, centered on the Qianlong Emperor, operated within a tributary logic where political legitimacy was contingent on the performance of ritual hierarchy. Their objective function was the maintenance of internal stability and the preservation of the cosmological order, wherein foreign relations were managed as a subset of domestic administration.

  **Option Sets and Constraints**
  The British option set was constrained by distance and military overstretch. They could not coerce the Qing without jeopardizing the lucrative Canton trade. Their viable options were: (1) perform the *kowtow* to secure an audience but undermine claims of sovereign equality; (2) refuse the *kowtow*, risking the audience and trade privileges; or (3) negotiate a performative compromise. They chose the third, achieving an audience but failing to secure treaty terms.

  The Qing option set was constrained by the imperative of ritual consistency. Granting British requests for a permanent embassy or tariff reductions would not merely be a policy shift but a violation of the tributary constitution, potentially signaling weakness to domestic and steppe rivals. Their viable options were: (1) accede to British demands, risking ritual incoherence; (2) reject demands and maintain the Canton System; or (3) expel the British entirely, risking unnecessary conflict. They chose the second.

  **Outcomes**
  The outcome was a reaffirmation of the status quo. The Qing issued an edict rejecting all British requests, citing self-sufficiency and the immutability of dynastic precedent. Trade continued under the strictures of the Canton System. No institutional bridge was built between the two political economies.

  ### Evaluating the Contrastive Query: Homogeneity and Stability

  A legitimate contrastive explanation requires that the fact (P) and the foil (Q) share a degree of **unit homogeneity**. They must be governed by sufficiently similar causal structures such that the difference in outcome can be attributed to specific variables rather than foundational categorical differences.

  **Violation of Unit Homogeneity**
  The Macartney episode suggests that Britain and Qing China in 1793 do not satisfy unit homogeneity. The British state was structured to externalize costs and project power for economic gain; the Qing state was structured to internalize order and minimize external disruption. When the contrastive query asks, "Why did Britain seek open trade while China rejected it?", it implicitly assumes both states were playing the same game of mercantile optimization. However, the mapping shows they were playing different games. For the British, the refusal was an economic loss; for the Qing, acquiescence would have been a political-existential threat. Because the institutional logics are incommensurable, treating them as homogeneous units in a single regression of "modernization potential" misdescribes the causal mechanism. The contrastive framework, if applied naively, forces a false parallel between state capacities that were structurally distinct.

  **Counterfactual Stability and Modal Fragility**
  Contrastive explanation also relies on **counterfactual stability**: the foil (Q) must have been a live possibility had specific conditions changed. The standard Great Divergence narrative often implies that China "failed" to industrialize, suggesting a modal fragility where small interventions (like open trade in 1793) could have shifted the trajectory.

  The Macartney case demonstrates **modal stability** regarding the Qing refusal. Given the information and institutional constraints mapped above, the Qing rejection was a rational equilibrium. It was not a failure of vision but a successful optimization of their specific legitimacy function. For the Qing to have chosen the "British path" (sovereign equality, open ports) would have required dismantling the tributary system itself. Therefore, the contrast class—"Industrialization versus Sustained Agrarian-Bureaucratic Stability"—is not counterfactually stable with respect to diplomatic interventions. The embassy was not a switch that could have been flipped; it was a symptom of the deeper structural divergence. The "Why Britain not China?" query, when anchored to this diplomatic episode, implies a contingency that did not exist.

  ### Implications for the "Why Britain not China?" Query

  Does this episode render the Needham Question malformed? It suggests the question is malformed *at the level of diplomatic history*, but potentially salvageable at the level of deep structural history.

  If the contrastive explanation seeks to locate the divergence in specific decision points (e.g., "Why did Macartney fail?"), it fails because it violates unit homogeneity. The British and Qing were not alternative versions of the same state; they were different species of polity. However, if the query is reformulated to ask, "Why did the European geopolitical fragmentation produce fiscal-military states while East Asian integration produced tributary stability?", the units become comparable as responses to geopolitical pressure. In this deeper structural view, the Macartney Embassy is not the locus of explanation but data confirming the divergence. The embassy reveals that the causal differences lay in property rights, energy regimes, and geopolitical competition centuries prior to 1793, not in the diplomatic protocols of the Qianlong reign.

  Thus, the episode indicates that the standard contrastive framing is often too coarse. It treats "China" and "Britain" as static containers of potentiality, rather than dynamic systems with different teleologies. The query is not entirely void, but it requires shifting the contrast class from "outcomes of specific encounters" to "evolution of state forms."

  ### Assessment of the Theory of Contrastive Explanation

  What does the Macartney case reveal about the theory of contrastive explanation itself?

  **1. Confirmation of Structural Sensitivity**
  The episode functions as a confirming instance for the requirement of unit homogeneity. It demonstrates that when contrastive explanations ignore the underlying ontological differences between the *explanans* (Britain) and the *explanandum* (China), they produce causal distortions. The theory correctly predicts that if the units are not homogeneous, the explanation will be spurious. The failure of the "Why P not Q" query here is not a failure of the theory, but a validation of its strictures regarding causal parity.

  **2. The Limits of Event-Based Contrast**
  The case suggests that contrastive explanation is ill-suited for "turning point" narratives in macro-history. The theory illuminates that the embassy was not an anomaly requiring reformulation, but rather evidence that the question was never about diplomatic episodes at all. The divergence was overdetermined by structural factors that render the diplomatic encounter epiphenomenal. A contrastive framework focused on events will inevitably struggle to explain outcomes determined by long-term structural inertia.

  **3. Normative and Welfare Silence**
  Finally, the case highlights a specific silence in the theory of contrastive explanation. The framework can analyze the rationality of the Qing refusal within its own institutional logic, but it is silent regarding the **normative standing** of that decision. It cannot adjudicate whether the tributary system was "better" or "worse" for human welfare than the emerging British industrial order, nor can it judge the justice of the trade regime. It explains why the refusal occurred, not whether it *should* have occurred. Furthermore, the theory does not account for the asymmetric welfare implications of the two paths: the British path led to industrial growth but also imperial predation; the Qing path maintained stability but eventually left the region vulnerable to nineteenth-century coercion. Contrastive explanation maps the causal geometry of the divergence, but it remains agnostic on the moral topology.

  ### Conclusion

  The 1793 Macartney Embassy, when analyzed through the lens of contrastive explanation, exposes the limitations of applying the "Why Britain not China?" query to discrete diplomatic moments. The episode fails the test of unit homogeneity, as the British and Qing operated within incommensurable institutional logics that made their option sets fundamentally different. It demonstrates modal stability in the Qing refusal, undermining the counterfactual claim that industrialization was a live option accessible through diplomatic adjustment. Consequently, the case suggests that the Great Divergence cannot be explained by contrasting specific policy failures or successes at the diplomatic level. Instead, the episode confirms that valid contrastive explanations in this domain must operate at the level of deep state formation and geopolitical structure. The theory of contrastive explanation remains robust, provided it is disciplined enough to recognize when the contrast class itself is a category error.
