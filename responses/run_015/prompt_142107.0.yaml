      *   *False Conflict:* (2) is actually compatible with (1). Probability $\neq$ Preference.
      *   *False Conflict:* (7) is compatible with (4). Obligation can be to "potential people" or based on impersonal value, not specific harmed identities.

      *   *Confidence:* High on the structural tensions.
      *   *Least Sure Point:* (8)'s recoil. The intuition that "saving for richer people is nuts" is common but economically debatable depending on the good (positional vs absolute).

  5.  **Final Review against Constraints:**
      *   Rank tensions by severity? Yes.
      *   Tell what gives and cost? Yes.
