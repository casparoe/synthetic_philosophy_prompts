          *   This is a triangle of doom. You can't have all three.
          *   If (1) is true, (5) is suspect. If (5) is true, (1) is suspect. If (6) is true, (5) is suspect (because Future Self is effectively a stranger).
          *   *Resolution:* You likely need to abandon strong impartiality (6) or strong temporal neutrality (1).
          *   *Cost:* Abandoning (1) makes you vulnerable to the "tyranny of the present." Abandoning (6) makes you a partialist (okay for personal life, harder for policy).

      *   *Refining Tension 2 (The Policy One): (4) vs (8).*
          *   (4) says spend on mitigation. (8) says invest money instead.
          *   If market returns > damage growth, investing wins.
          *   *Resolution:* You need to argue that money *cannot* buy the specific good (existential safety, irreversible biodiversity loss).
          *   *Cost:* You have to argue for "inelastic substitution" between capital and nature.

      *   *Refining Tension 3 (The Rate One): (3) vs (1).*
