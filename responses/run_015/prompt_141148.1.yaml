          *   MaxEnt: Weight stays same (frequency ratio same).
          *   Max-Margin: Hinge loss accumulates (100 errors). L1 penalty stays constant (one weight). Eventually, cost of errors > cost of weight. They *converge*.
          *   *Crucial Insight:* The researcher is *partially* right. Enough data *does* collapse the margin learner's error tolerance. But "enough" might be practically infinite for rare events. This nuances the "underdetermination" claim.

