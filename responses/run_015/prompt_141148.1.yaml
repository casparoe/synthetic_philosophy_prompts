      *   **Learner B (Max-Margin IRL with L1/Hinge):**
          *   Assumption: Demonstrator is mostly optimal, allows for some slack (hinge loss).
          *   Objective: Maximize margin between optimal trajectory and others, penalize complexity (L1 sparsity).
          *   Implication: L1 promotes sparsity (weights go to exactly zero). Hinge loss ignores small deviations. If a behavior is rare and costly, the L1 penalty might drive its weight to zero, treating the behavior as a "violation" (hinge loss) rather than a "preference."

  3.  **Construct the Scenario (The "Expensive-Seldom" Case):**

