answer: |-
  ### Part 1: The Specification (Requirements for a Theory)

  To count as an explanation of the Gender Equality Paradox (GEP) sufficient to ground normative judgment (justice vs. loss vs. neutrality), a theory must satisfy the following requirements.

  **1. Level-Consistency (The Ecological Constraint)**
  *   **Requirement:** The theory must explicitly state whether its causal mechanism operates at the individual level (psychology/biology), the institutional level (policy/labor markets), or the cultural level (norms/values), and it must not infer individual motivation from country-level correlation without a bridging mechanism.
  *   **Case:** Country-level data cannot dictate individual destiny. A theory claiming "women prefer X" based on national STEM gaps commits the ecological fallacy unless it explains how national indices translate to individual psyches.
  *   **Why Requirement:** Without this, the theory confuses aggregate outcomes with individual intent, making normative judgment impossible (you cannot judge an individual's freedom based on a national average).

  **2. Index Independence (The Tautology Constraint)**
  *   **Requirement:** The theory must account for the construction of the "equality" variable. It must explain the correlation without relying on equality indices that mathematically include the outcome variable (e.g., labor participation rates) or are heavily correlated with GDP.
  *   **Case:** If "equality" is measured partly by women's workforce participation, finding that "equality" predicts workforce segregation is circular.
  *   **Why Requirement:** To ensure the phenomenon is real and not a statistical artifact of how we measure development.

  **3. Differential Sensitivity (The Selectivity Constraint)**
  *   **Requirement:** The theory must explain why the effect appears in *preferences* and *vocational choices* but often disappears or reverses in *competency* measures (e.g., math performance).
  *   **Case:** If gender equality unlocks "true nature," it should affect ability and interest similarly. If it affects only interest, the mechanism is likely about valuation or identity, not capacity.
  *   **Why Requirement:** This distinguishes between theories of *capacity* (biology/ability) and theories of *valuation* (social worth/identity).

  **4. Distributional Integrity (The Variance Constraint)**
  *   **Requirement:** The theory must accommodate the fact that within-group variance is significantly larger than between-group variance. It cannot rely on "typical man/woman" essentialism to explain aggregate shifts.
  *   **Case:** Even if the average preference shifts, the overlap remains massive. A theory that treats the groups as distinct categories fails to describe the actual population.
  *   **Why Requirement:** To prevent reification of gender categories. Policy based on "average differences" harms the individuals who fall outside the average.

  **5. Counterfactual Stability (The Saturation Constraint)**
  *   **Requirement:** The theory must predict what happens at the theoretical limit of equality. Does the gap widen indefinitely, plateau, or reverse?
  *   **Case:** A curve that fits existing data but implies infinite divergence is implausible. A theory needs a stopping point or a turning point to be falsifiable.
  *   **Why Requirement:** To distinguish between a transient phase (developmental) and a stable equilibrium (structural/biological).

  ---

  ### Part 2: Genuine Requirements vs. Political Prejudice in a Lab Coat

  Not all methodological demands are neutral. Some are legitimate scientific rigor; others are conclusion-driven constraints disguised as rigor.

  **Genuine Requirements:**
  *   **Level-Consistency:** This is basic logic. Inferring individual psychology from national GDP is a category error regardless of politics.
  *   **Index Independence:** This is basic econometrics. Controlling for tautology is necessary for validity.
  *   **Distributional Integrity:** This is basic statistics. Ignoring variance leads to stereotyping.

  **Political Prejudice in a Lab Coat:**
  *   **The "Free Choice" Demand (often from the "Paradox is Real" camp):** Demanding that a theory *must* conclude choices in high-equality nations are "fully free" as a precondition for accepting the data. This begs the question. It assumes that legal equality equals autonomy, ignoring adaptive preferences or subtle socialization. It shuts down inquiry into *how* preferences are formed.
  *   **The "Artifact" Demand (often from the "Paradox is False" camp):** Demanding that a theory *must* find a confounding variable (like GDP) that reduces the effect to zero before accepting the pattern exists. While controlling for confounds is good, demanding total elimination as a precondition for discussion assumes the correlation *cannot* be causal. It treats the phenomenon as guilty until proven innocent.
  *   **The "Counterfactual" Weaponization:** While predicting the top of the scale is genuine science (see Spec #5), demanding a prediction *now* for a scenario we haven't observed is often used to dismiss current data as "incomplete." It moves the goalposts: "You can't explain it until we reach perfect equality," which may never happen.

  ---

  ### Part 3: The Core Tension (Free Choice vs. Aggregate Steering)

  You suspect two requirements are enemies:
  1.  **Autonomy:** Choices in high-equality countries are genuinely theirs (coercion lifted).
  2.  **Convergence:** Aggregates land on traditional stereotypes everywhere once pressure lifts (suggests hidden steering).

  **Are they enemies?**
  Logically, no. Biologically essentialist theories meet both: choices are free, and biology steers the aggregate.
  Normatively, **yes**. If the aggregate converges on stereotypes, it undermines the claim that the *social* project of gender equality has succeeded in expanding human potential, even if legal coercion is gone.

  **Which to drop?**
  Drop the requirement that **Aggregate Convergence implies Hidden Steering.**
  *   **Why:** Convergence alone does not prove steering. It could be biology, or it could be convergent rational choice (e.g., women choosing care work because it pays relatively better in rich countries). Assuming steering because the outcome looks traditional is a prejudice.
  *   **The Cost:** You lose the ability to claim the pattern *itself* is evidence of injustice. You cannot point to the STEM gap and say "this proves oppression remains." You must look deeper into *preference formation*.

  **Can we intervene if choices are free?**
  Yes. This is the concept of **Adaptive Preferences**.
  *   **The Version:** People adapt their desires to the options they perceive as available. Even in "high equality" countries, if the *culture* signals that STEM is "male" (even without legal barriers), women may freely choose not to pursue it to avoid social friction. The choice is uncoerced (no one stopped them) but not fully autonomous (the preference was shaped by a skewed environment).
  *   **Intervention:** Warranted not to force outcomes, but to widen the *imaginative horizon* so preferences are formed under conditions of genuine plurality, not subtle signaling.

  ---

  ### Part 4: Opportunity-Sensitive vs. Expression-Sensitive

  Your distinction is not junk; it carves the problem space effectively.

  *   **Opportunity-Sensitive:** Differences shrink when external barriers (laws, costs, harassment) are removed. This measures *exclusion*.
  *   **Expression-Sensitive:** Differences grow when conformity pressure is removed. This measures *preference*.

  **The Third Category: Structure-Responsive (or Rational-Adaptive)**
  *   **Definition:** Differences change based on the *relative utility* of options within the specific economic structure, independent of barriers or identity norms.
  *   **Example:** In wealthy nations, welfare states may make part-time care work more viable for one sex (often women) not because of norms (Expression) or barriers (Opportunity), but because the tax/benefit structure makes it the rational utility-maximizing choice for a household.
  *   **Why it matters:** It suggests the "choice" is free and the "preference" is real, but the *structure* incentivizes traditional divisions. Intervention here requires changing economic incentives, not just removing barriers or changing culture.

  ---

  ### Part 5: Theory Families Against the Spec

  **1. The "Essentialist" Story (Innate dispositions unlocked)**
  *   **Performance:** Meets Distributional and Selectivity well (abilities same, interests different). Fails Index Independence if it ignores wealth confounds.
  *   **Normative Implication:** If true, the gap is neither unjust nor a loss; it is self-actualization.

  **2. The "Socialization" Story (Internalized roles persist)**
  *   **Performance:** Meets Selectivity well. Struggles with Expression-Sensitivity (why do roles strengthen when pressure lifts?). Requires complex "adaptive preference" modeling to meet Autonomy.
  *   **Normative Implication:** The gap is unjust; preferences are distorted by prior conditioning.

  **3. The "Security/Post-Materialist" Story (Rich countries allow niche-picking)**
  *   **Performance:** Meets Counterfactual Stability (predicts a plateau). Handles Index Independence by focusing on wealth, not equality.
  *   **Normative Implication:** The gap is a luxury good; neither unjust nor a loss, but a side-effect of development.

  **4. The "Artifact" Story (Indices are broken)**
  *   **Performance:** Fails the premise. If true, there is nothing to explain. Meets Index Independence by dissolving the variable.
  *   **Normative Implication:** No intervention needed on this specific pattern; focus on actual barriers.

  **The Killer Requirement:**
  **Level-Consistency (The Ecological Constraint).**
  This kills the most popular discourse. Most "Essentialist" arguments slide from "Countries have more gaps" to "Women prefer X." Most "Socialization" arguments slide from "Countries have more gaps" to "Society forces women." Both fail to explain the *mechanism* linking national wealth to individual psychology without committing the ecological fallacy. A theory that cannot bridge that gap is just ideology.
