  **Brainstorming Candidate Settings**

  1.  **Neighborhood Snow Shoveling:** Neighbors decide whether to shovel their sidewalks. *Drop:* Too much causal visibility and reputational leakage; violates causal isolation.
  2.  **Office Coffee Fund:** Employees contribute to a shared coffee supply. *Drop:* Typically repeated interaction with enforcement norms; violates one-shot constraint.
  3.  **Alumni Donation Drive:** Thousands of graduates anonymously donate to a shared prestige fund. *Pick:* Large N, anonymous, one-shot, shared psychology provides correlation without logical identity.

  **Scenario**

  Ten thousand alumni of the same university receive an anonymous, one-shot invitation to contribute $50 to a legacy fund. There is no communication, reputation tracking, or enforcement; decisions are submitted simultaneously via sealed digital ballot. Each contribution adds $0.10 to the personal network value of every alumnus, including the contributor. Agents are psychologically similar due to shared upbringing but causally isolated; no one runs another's decision algorithm. The total potential benefit per contribution ($1,000) vastly exceeds the cost, but individual causal impact is negligible. You must decide whether to contribute based solely on your private reasoning, knowing your choice correlates statistically with others' via shared values, but causes nothing.

  **Walkthrough and Arithmetic**

  **Parameters:**
  *   **Agents ($N$):** 10,000.
  *   **Cost ($C$):** $50.
  *   **Benefit per recipient per contribution ($b$):** $0.10.
  *   **Structure:** Symmetric linear public good.
  *   **Prior:** Beta(2, 2) over the population cooperation rate $\theta$. Effective Sample Size (ESS) = 4. Prior Mean = 0.5.
  *   **Update:** Your action is treated as one sample of $\theta$.
      *   If Contribute: Posterior Beta(3, 2). Mean $E[\theta|C] = 0.6$.
      *   If Defect: Posterior Beta(2, 3). Mean $E[\theta|D] = 0.4$.
  *   **Expected Other Cooperators:**
      *   Given Contribute: $9,999 \times 0.6 \approx 5,999$.
      *   Given Defect: $9,999 \times 0.4 \approx 3,999$.
      *   $\Delta$ Expected Others ($\Delta K$): 2,000.

  **Verdict Derivation:**
  *   **CDT:** Evaluates causal impact. My action changes my payoff by $b - C = 0.10 - 50 = -49.90$. **Defect.**
  *   **FDT:** Evaluates logical dependency. Agents share psychology (common cause) but do not run identical algorithms or simulations. There is no subjunctive link. My choice does not fix theirs. Payoff same as CDT. **Defect.**
      *   *Flip Condition:* FDT would cooperate only if others were known to be running a simulation of your exact source code. This scenario specifies "psychologically similar... causally isolated," explicitly excluding logical identity.
  *   **EDT:** Evaluates conditional expected utility.
      *   $E[U|C] - E[U|D] = (\Delta K \times b) - C = (2,000 \times 0.10) - 50 = 200 - 50 = +150$.
      *   Since $150 > 0$, **Cooperate.**

  **Critical Population Size ($N^*$):**
  Holding prior (Beta(2,2)) and payoffs fixed, EDT flips when $(N-1) \times (0.6 - 0.4) \times 0.10 > 50$.
  $(N-1) \times 0.02 > 50 \Rightarrow N-1 > 2,500 \Rightarrow N^* = 2,501$.
  **Sense of "Large":** It is the ratio of Population Size to Prior Certainty ($N/\text{ESS}$). The world must be large enough that your action provides significant news about the *aggregate* behavior of others, outweighing the negligible causal impact.

  **Ablations:**
  1.  **$N=3$:** $\Delta K = 2 \times 0.2 = 0.4$. EDT Benefit = $0.04$. Cost = $50$. **EDT Defects.** The evidential bonus scales linearly with $N$; small worlds kill the effect.
  2.  **Step Function:** Benefit $V=\$500$ if contributions $\geq 5,000$ (prior mean). $P(\text{Success}|C) \approx 1.0$, $P(\text{Success}|D) \approx 0.0$. EDT Benefit = $500 \times 1 = 500$. **Bonus gets bigger** (500 vs 200) because the correlation pushes the probability mass over the threshold cliff.
  3.  **Knows Own Disposition:** If you know your type independently of action, $P(\theta|Action) = P(\theta)$. $\Delta K = 0$. **EDT Defects.** The evidential link is screened off by introspective knowledge.

  **Objection and Judgment:**
  *   **Objection (Managing the News):** "You are paying $50 merely to receive good news about a world you cannot change. This is irrational superstition."
  *   **Evidentialist Reply:** "In large worlds with common causes, being the kind of agent who cooperates *is* the condition under which the world is good. You aren't paying for the news; you are paying to inhabit the favorable branch of the correlation."
  *   **Judgment:** The case survives as a valid isolation of EDT's normative commitment to correlation, provided one accepts that logical identity is not the only source of decision-relevant dependency.

  **Rigging Check:**
  Verdicts are derived from standard Bayesian updating and utility maximization, not stipulated. Causal isolation is enforced by anonymity. The prior (ESS=4) is diffuse but not artifactually so; it represents genuine uncertainty about a large population's sentiment. The case is fair.

