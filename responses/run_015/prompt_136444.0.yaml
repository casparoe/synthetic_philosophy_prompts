answer: |-
  ### I. The Translation

  To translate the debate into the vocabulary of contract law, we must treat the "world" as a **Contractual Regime** and "actions" as **Amendments**.

  **1. The Frame Problem: The Silence of the Amendment**
  Imagine you are counsel for Party A. You have a Master Services Agreement (the **State**) containing five hundred operative provisions (the **Fluents**). Party A and Party B execute a one-page Amendment (the **Action**) that changes the payment rate in Section 4.2.

  The Frame Problem is the interpretive crisis regarding the remaining four hundred and ninety-nine provisions. The Amendment is silent on them. It does not say "Section 3.1 survives," nor does it say "Section 3.1 is terminated."
  *   **The Puzzle:** How do you determine the **Contractual Position** at Time 2? Do you assume that every silent provision remains in force? Or do you require explicit confirmation for every provision that is intended to survive? If you require explicit confirmation, the Amendment must be as long as the original contract. If you assume survival, on what doctrinal basis do you rest that assumption, and how do you handle provisions that *implicitly* conflict with the change (e.g., if the payment rate changes, does a penalty clause tied to the old rate survive)?

  **2. The Frame-Axiom Strategy: The Schedule of Surviving Provisions**
  The classic AI solution corresponds to a drafting strategy that treats silence as dangerous. To ensure the Contractual Position is fully defined after the Amendment, you attach a **Schedule of Surviving Provisions**.
  *   **The Mechanism:** For every single provision in the original Master Services Agreement, the Amendment includes a line item stating: "Section X.Y shall remain in full force and effect."
  *   **The Burden:** This creates a combinatorial explosion of drafting. For every new Amendment, you must review and restate the status of every existing obligation, regardless of relevance. It is legally safe but administratively impossible. It treats **Continuity** as something that must be expressly re-granted rather than a default status.

  **3. The Successor-State-Axiom Response: The General Continuity Rule**
  The modern AI solution (Reiter's Successor-State Axioms) corresponds to a **Rule of Construction** embedded in the Master Services Agreement.
  *   **The Mechanism:** The original contract includes a clause stating: "All provisions of this Agreement shall survive any Amendment unless an Amendment expressly states that such provision is terminated or is logically inconsistent with an express term of the Amendment."
  *   **The Shift:** You no longer list what stays the same. You only list what changes. A provision remains in force at Time 2 if (1) it was in force at Time 1, AND (2) the Amendment did not terminate it.
  *   **The Efficiency:** This reduces the drafting burden from "list everything" to "list only changes." It treats **Continuity** as the default and **Change** as the exception that requires specific pleading.

  ***

  ### II. The Residue Report

  Here is the assessment of how well the Contract Law vocabulary maps onto the AI debate, and where the fit fails.

  **1. Elements that Translate Cleanly**
  *   **The Burden of Specification:** The Frame Problem maps perfectly to the drafting burden of an Amendment. The tension between "expressly restating everything" (Frame Axioms) and "relying on default rules" (Successor-State) is identical to the tension between a restated agreement and an amendment by reference.
  *   **The Qualification Problem:** In AI, this is the worry that an action might have unexpected side effects. In Contract Law, this is the doctrine of **Implied Terms** or **Conflict**. If the Amendment changes the "Payment Date," does that implicitly terminate a "Late Fee" clause calculated on the old date? Both fields struggle with identifying which silent dependencies are broken by an express change.

  **2. Elements that Must Be Distorted to Fit**
  *   **Truth vs. Obligation:** AI logic deals with *truth values* (Is the door open? True/False). Contract law deals with *normative force* (Is the party obligated? Enforceable/Not Enforceable). Translating "The door is open" to "The obligation to keep the door closed is extinguished" works, but it distorts the nature of the fact. A door's state is physical; a contract's state is social and legal.
  *   **Discreteness of Fluents:** AI requires the world to be chopped into discrete properties (fluents). Contract law recognizes that obligations are often holistic. You cannot always isolate "Section 4.2" from "Section 4.3" without losing the commercial purpose. Forcing the Contractual Regime into discrete "fluents" distorts the interpretive practice of reading the contract as a whole instrument.

  **3. Elements with No Counterpart in Contract Law**
  *   **The Closed World Assumption:** AI planning typically assumes the system knows *all* relevant properties of the world. Contract Law explicitly rejects this. We have the **Parol Evidence Rule**, but we also have doctrines like **Frustration of Purpose**, **Impossibility**, and **Course of Dealing**. These allow external facts (outside the four corners of the document) to alter the Contractual Position even if the text remains unchanged. AI's Frame Problem assumes a closed box; Contract Law assumes an open environment where external context can void continuity without an explicit Amendment.
  *   **Computational Tractability:** The Frame Problem is ultimately a problem of *processing power*. It asks: "Can a machine infer the new state without checking every single fact?" Contract Law has no equivalent worry. A human lawyer can read an Amendment and intuitively grasp what survives without needing a formal rule to make the inference computationally efficient. The "problem" exists for the *calculator*, not the *interpreter*.

  ***

  ### III. The Interpretive Question

  You ask: If there is material in the Frame Problem debate that Contract Law cannot express, does that indicate the problem is a pseudo-problem generated by artificial formalisms, or that Contract Law is missing a distinction?

  **The Verdict: It is a Pseudo-Problem of Metaphysics, but a Real Problem of Formalization.**

  Contract Law demonstrates that the "metaphysical puzzle" of representing change is not genuine in human governance. Lawyers do not struggle with the Frame Problem because they do not rely on explicit logical enumeration to determine continuity. They rely on **presumptions** (e.g., *expressio unius est exclusio alterius*), **intent**, and **adjudication**. When ambiguity arises about whether a clause survived an Amendment, a court does not run a logical proof; it hears evidence on what the parties intended.

  Therefore, the existence of the Frame Problem in AI does not indicate that Contract Law is missing a distinction. Rather, it indicates that **logic is a poorer medium for representing change than natural language governed by normative principles.**

  **Why your friend is mostly right:**
  The Frame Problem dissolves when you move from "listing facts" to "specifying rules of change." Successor-State Axioms are the logical equivalent of a "General Continuity Rule." Once you adopt that rule, the "puzzle" of what persists is solved by definition. The difficulty was never about the nature of reality (metaphysics); it was about the inefficiency of the notation (Frame Axioms).

  **Why your intuition is not wrong:**
  You sensed a "residual ambiguity." In Contract Law, even with a General Continuity Rule, ambiguity remains regarding *implied* obligations and *contextual* shifts (e.g., does a change in law void the contract?). In AI, this corresponds to the **Ramification Problem** (indirect consequences) and the **Qualification Problem** (unknown preconditions).
  Contract Law handles this residue through **equity** and **judgment**. AI cannot. It must formalize the residue. Because the residue involves open-ended context (the "world outside the contract"), it cannot be fully captured in a closed logical system.

  **Conclusion:**
  The Frame Problem is not a metaphysical mystery about how the world changes; it is an engineering bottleneck regarding how much context a formal system must store to simulate change. Contract Law avoids the bottleneck by outsourcing the "residue" to human judges and social norms. If you are building an autonomous agent that cannot call a judge, the Frame Problem is a genuine engineering hurdle. If you are asking whether reality itself is ambiguous about persistence, Contract Law suggests it is not: persistence is the default, change is the exception, and the "gap" is only visible when you try to remove the human interpreter from the loop.

  Your friend is correct that the *metaphysical* weight is an artifact of the notation. But you are correct that the *pragmatic* difficulty of capturing context survives in any system that tries to separate explicit effects from the silent background. Contract Law solves this not by better notation, but by allowing the background to remain informal until a dispute arises. AI, requiring pre-computed certainty, cannot afford that luxury.
