      *   *Frame Axioms (Classic Solution):* Explicitly state for every action and every property that *if* the action happens, the property remains the same (unless explicitly changed). This is combinatorially explosive.
      *   *Successor-State Axioms (Reiter's Solution):* Instead of listing what stays the same, define the conditions under which a property *becomes* true or *becomes* false in the next state. A property holds in the next state if (1) the action made it true, OR (2) it was already true and the action didn't make it false. This scales linearly with actions/properties.
