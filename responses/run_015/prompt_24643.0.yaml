answer: |-
  ### Exam Question

  **Question 1 (90 Minutes)**

  Graham Priest's dialetheism proposes that the Liar sentence ($\lambda \leftrightarrow \neg T\langle\lambda\rangle$) is both true and false, thereby preserving semantic closure without collapsing into triviality. Critics argue that this solution generates a "Revenge Liar" that dialetheism cannot absorb without sacrificing the intelligibility of its own semantic categories.

  Construct a Revenge Liar sentence specifically targeting the dialetheist's distinction between "true contradictions" (gluts) and "true only" sentences. Explain Priest's standard reply that this Revenge sentence is simply another true contradiction. 

  In your evaluation, do not merely assert that paraconsistent logic tolerates this. Instead, analyze the *cost* of this reply. Specifically, address whether the dialetheist can coherently characterize their position from a classical metatheory, or if the metatheory itself must be paraconsistent. What does this imply about the dialetheist's ability to express the notion of "truth exclusion" (i.e., that some sentences are *only* true)? Conclude by locating the Revenge problem: is it a failure of the *logic* (LP), the *semantics* (closure), or the *metaphysics* (the nature of truth)?

  ***

  ### Model Answer

  The standard Liar ($\lambda$) is solved by the dialetheist by accepting $T\langle\lambda\rangle \land \neg T\langle\lambda\rangle$. However, this creates a semantic partition: sentences are either "true only" ($T^!$) or "true contradictions" (gluts). The Revenge Liar targets this partition. Consider the sentence $\rho$: "This sentence is not a true contradiction" (formally, $\rho \leftrightarrow \neg (T\langle\rho\rangle \land \neg T\langle\rho\rangle)$).

  If $\rho$ is a glut, then it is a true contradiction, which contradicts what $\rho$ says. If $\rho$ is not a glut, it is true (and not false), meaning what it says is the case—it is not a glut. This appears consistent. However, for the dialetheist, the threat lies in the *expressibility* of the exclusion. To define a glut, one must be able to distinguish it from a classical truth. One needs a predicate $T^!(x)$ (true and not false). But if the logic is paraconsistent, the negation involved in "not false" ($\neg \neg T(x)$) does not necessarily exclude $T(x)$. Thus, the dialetheist struggles to formulate a predicate that *excludes* truth from falsity without generating a new contradiction.

  Priest's reply is to accept that $\rho$, like $\lambda$, is a glut. He argues that the category of "true only" is not logically exclusive in a way that prevents revenge; rather, the revenge shows that the boundary itself is contradictory. This preserves semantic closure: every sentence, including those about semantic categories, is within the scope of the logic.

  However, this reply incurs a severe metatheoretic cost. If the object language is paraconsistent, the metatheory used to explain it cannot be consistently classical. If the metatheory is classical, it validates the Principle of Non-Contradiction (PNC). From a classical metatheory, the dialetheist's claim that "$\rho$ is a true contradiction" is simply false, because the metatheory denies true contradictions exist. To explain dialetheism coherently, the dialetheist must employ a paraconsistent metatheory.

  This leads to the problem of ineffability. If the metatheory is paraconsistent, the dialetheist cannot consistently assert that "some sentences are *only* true." Any attempt to exclude falsity from a sentence can be met with a Revenge sentence asserting that the exclusion fails. Consequently, the dialetheist cannot coherently communicate the distinction between their view and trivialism (the view that *all* sentences are true) from within their own framework, because the exclusionary notions required to make that distinction are themselves subject to revenge.

  Ultimately, the Revenge problem is not a failure of the logic (LP handles the inference validly) nor merely the semantics. It is a metaphysical and semantic problem regarding the *intelligibility* of truth. The dialetheist saves semantic closure at the price of making their own semantic categories unstable. They can assert the position, but they cannot consistently characterize the conditions under which the position is distinct from its negation.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Part 1: Reconstruction of the Revenge (5 Marks)**
  *   **5:** Correctly constructs a sentence targeting the "glut" vs. "true only" distinction (e.g., "This sentence is not a glut" or "This sentence is true only"). Shows understanding that the negation must target the *dialetheic status*, not just truth.
  *   **3-4:** Constructs a standard Liar or misidentifies the target (e.g., targets truth rather than the glut distinction).
  *   **0-2:** Fails to construct a sentence or relies on standard explosion arguments.

  **Part 2: Evaluation of Priest's Reply (5 Marks)**
  *   **5:** Accurately explains Priest's "inclusive" strategy (accepting the revenge as another glut) and identifies that this preserves semantic closure.
  *   **3-4:** States Priest accepts contradictions but fails to explain *why* (closure) or confuses this with blocking explosion.
  *   **0-2:** Claims Priest rejects the sentence or tries to solve it classically.

  **Part 3: Advanced Analysis (The "A-Grade" Differentiator) (10 Marks)**
  *   **9-10 (A Range):** Explicitly addresses the **Metatheory** or **Exclusion** problem.
      *   *Must* argue that a classical metatheory undermines dialetheism (by ruling out gluts from the start) OR that a paraconsistent metatheory makes the distinction between "true only" and "glut" inexpressible/ineffable.
      *   *Must* locate the problem in semantics/metaphysics (intelligibility of categories) rather than just logical validity.
  *   **7-8 (High B):** Discusses the metatheory but vaguely. Notes that communication is hard but doesn't explain *why* (failure to mention exclusionary predicates). Or, distinguishes logic vs. metaphysics but doesn't apply it to the metatheoretic constraint.
  *   **5-6 (Low B):** Good general discussion of revenge but relies on the idea that "paraconsistent logic handles it" without analyzing the cost to the metatheory or the expression of exclusion.
  *   **0-4 (C/F):** Recites basic definitions of paraconsistency. Confuses dialetheism with trivialism. Fails to address the prompt's requirement about metatheory or semantic layers.

  **Specific Penalties:**
  *   **-2:** Confusing *paraconsistency* (logical property) with *dialetheism* (ontological/semantic claim).
  *   **-2:** Claiming the Revenge Liar proves trivialism (that *everything* is true) without qualification.
  *   **-2:** Exceeding word count significantly or failing to structure the essay.

  **Grade Boundaries:**
  *   **A (17-20):** Secure reconstruction + Insightful metatheoretic/exclusion analysis.
  *   **B (14-16):** Secure reconstruction + Standard evaluation of Priest (lacks deep metatheoretic critique).
  *   **C (10-13):** Basic understanding of Liar/Gluts + Weak or confused Revenge analysis.
  *   **D/F (0-9):** Fundamental misunderstandings of the logic or failure to answer the prompt.
