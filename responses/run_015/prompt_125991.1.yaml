      *   *Navigation Acts:* He calls them wise for defense, not immoral.
      *   *Federal Union:* This is the biggest error. Smith proposes it explicitly.
      *   *Categorical Opposition:* No, only to the mercantile system.
      *   *20th Century:* Anachronistic.

  6.  **Refine Tone:** Professional historian, precise, authoritative, referencing Books III and IV specifically.

  7.  **Check Constraints:**
      *   Lead with bottom line in first sentence.
      *   No preamble.
      *   No restating the question.
