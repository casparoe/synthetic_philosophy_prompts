      *   *Q5 (Visibility):* Likely answer: Detectability is essential. Follow-up: What about "bluffing" irrationality?
      *   *Q6 (Self-Knowledge):* Likely answer: Opacity is necessary. Follow-up: Does this make rationality a tragic condition?

  6.  **Final Polish:** Check the voice. It should sound like an intelligent interviewer, not a grad student exam. Use terms like "narrative tension," "character motivation," etc., to tie back to the user's profession.

