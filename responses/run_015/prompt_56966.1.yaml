  (a) **R's Rule: The Principle of Strict Logical Instantiation**

  R is operating under a rule that can be formalized as **Strict Logical Instantiation with Counterfactual Force**. For superrational reasoning to license cooperation, four conditions must be met simultaneously:

  1.  **Algorithmic Identity:** The agents must instantiate the exact same decision procedure (source code or logical algorithm). Mere behavioral similarity or functional equivalence is insufficient.
  2.  **Input Symmetry:** The agents must receive identical informational inputs. Private observations or asymmetric payoff functions break the logical link, even if the algorithm is identical.
  3.  **Counterfactual Necessity:** The superrational argument must be the *decisive* factor in the decision. If standard expected-utility calculation (causal decision theory) already yields the cooperative outcome, superrationality is not in play.
  4.  **Acausal Correlation:** The correlation between moves must arise from logical necessity (the fact that $f(x) = f(x)$), not from causal communication or pre-commitment devices.

  **Reproduction of Verdicts:**
  *   **Cases 1 & 6 (Copies):** Satisfy Algorithmic Identity and Input Symmetry. Counterfactual Necessity holds in the PD. **Verdict: Cooperate.**
  *   **Case 2 (Different Humans):** Fails Algorithmic Identity. Different reasoning routes imply different functions. **Verdict: Defect.**
  *   **Case 3 (Copies + Private Info):** Fails Input Symmetry. $f(x_1) \neq f(x_2)$. **Verdict: Argument Fails.**
  *   **Case 4 (Stag Hunt):** Fails Counterfactual Necessity. Ordinary calculation suffices. **Verdict: Not Superrationality.**
  *   **Case 5 (Asymmetric PD):** Fails Input Symmetry (payoffs are inputs to the utility function). Identical reasoning yields different moves. **Verdict: Defect.**
  *   **Case 7 (Voting):** Fails Algorithmic Identity ("broadly similar" $\neq$ identical) and Input Symmetry (private booth contexts). **Verdict: Rationalization.**
  *   **Case 8 (Unconditional Defector):** Fails Acausal Correlation. The opponent is not a reasoning agent instantiating a function responsive to yours. **Verdict: Defect.**
  *   **Case 9 (Newcomb):** Satisfies Algorithmic Identity (Predictor simulates your function) and Counterfactual Necessity (CDT two-boxes). **Verdict: One-box (Same Argument).**
  *   **Case 10 (AI Imitator):** Ambiguous on Algorithmic Identity. An imitator trained on a corpus approximates behavior but may not instantiate the *same* logical procedure. R hesitates because the documentation claims similarity, but the architecture (neural net vs. reasoning engine) suggests distinct algorithms. **Verdict: Depends.**

  (b) **Two Rival Rules**

  **Rival 1: The Principle of Functional Isomorphism**
  This rule relaxes Condition 1. It requires not *source code identity*, but **Input-Output Map Identity**. If two agents can be proven to compute the same mathematical function, even via different substrates or code structures, superrationality applies.
  *   **Fit to 10 Verdicts:** It reproduces all of R's verdicts. In Case 10, it hesitates for the same reason R does: it is unclear if the imitator is truly isomorphic or merely approximating the map. In Case 2, humans are not isomorphic. In Case 4, the necessity condition is still required.
  *   **Divergence:** It parts company with R on the **New Case**. If the proof establishes that the two different procedures yield the same move *because* they are functionally equivalent mappings, Rival 1 licenses superrationality. R (Strict Instantiation) does not.

  **Rival 2: The Principle of Proven Output Entailment**
  This rule replaces Condition 1 and 2 with a single condition: **Guaranteed Move Correlation**. If there is a rigorous proof that Agent A's move matches Agent B's move in this specific instance, superrationality applies, regardless of whether the procedures are identical or isomorphic.
  *   **Fit to 10 Verdicts:** It reproduces the verdicts because in Cases 1–6 and 9, such a proof exists (via identity). In Case 2, 7, and 8, no such proof exists. In Case 4, the Counterfactual Necessity clause is retained to exclude Stag Hunts. In Case 10, the proof of correlation is missing (imitation is probabilistic), hence the hesitation.
  *   **Divergence:** It parts company with R on the **New Case**. The New Case explicitly stipulates a proof that the procedures issue in the same move. Rival 2 licenses superrationality here. R does not, because the *method* differs.

  (c) **Prediction on the New Case**

  **Verdict:** R will rule that **neither agent is entitled to call its move superrational.**

  **Reasoning:** I commit to **Strict Logical Instantiation** as R's actual rule. The evidence lies in Verdict 10 and Verdict 9.
  *   **Verdict 10 (The Imitator):** R's hesitation is the smoking gun. If R cared only about output correlation (Rival 2) or functional isomorphism (Rival 1), the documentation stating the AI was trained to imitate his reasoning would likely suffice for a tentative "Cooperate." The hesitation implies R suspects that *imitation* is not *instantiation*. He is looking for the *same* reasoning engine, not a simulation of its outputs.
  *   **Verdict 9 (Newcomb):** R's irritation at filing Newcomb separately confirms he views superrationality as a subset of logical decision theory (akin to FDT). In FDT, the focus is on the *algorithm* you instantiate. If two agents run different algorithms that happen to converge, FDT does not treat them as a single logical node.
  *   **The New Case:** The agents run "demonstrably different" procedures. Even if a proof guarantees convergence *here*, the correlation is contingent on the specific payoff structure of this game, not on the identity of the reasoning process. For R, superrationality is about the *source* of the correlation (logical identity), not the *fact* of the correlation (output matching). Therefore, this is coincidental alignment, not superrational cooperation.

  (d) **Discriminating Test Case**

  **Case:** **Obfuscated Twins.**
  Two agents face a symmetric one-shot PD. Both are running the exact same mathematical decision function (e.g., "Maximize expected utility given logical correlation"). Agent A runs the code in Python, clean and documented. Agent B runs the code in C++, heavily obfuscated and compiled, such that the source code is unreadable and structurally distinct from A's. However, a formal verification proof exists confirming that Agent B's binary is mathematically isomorphic to Agent A's source. Both agents have access to this proof.

  **Discrimination:**
  *   **R (Strict Logical Instantiation):** **Defect / No Superrationality.** The source code is not identical; the instantiation is physically and syntactically distinct. The "copy" relation is broken by the obfuscation/translation.
  *   **Rival 1 (Functional Isomorphism):** **Cooperate.** The agents instantiate the same abstract function, verified by proof. Substrate and syntax are irrelevant.
  *   **Rival 2 (Proven Output Entailment):** **Cooperate.** The proof guarantees the moves match.

  This case isolates the "Algorithmic Identity" condition from "Functional Equivalence." If R cooperates, he is a Functionalist. If he defects, he is a Strict Instantiationist (as predicted).

  (e) **Outlier Analysis**

  I conclude that **no single rule reproduces all ten verdicts without treating Verdict 10 as a boundary condition.**

  **The Outlier:** Verdict 10 is the outlier. In all other cases, R gives a binary Cooperate/Defect/Not Applicable. In Case 10, he declines to commit.
  **Implication:** This indicates that R's rule contains a parameter that is currently uncalibrated for "approximate identity." To keep the rest of the verdicts consistent, R would have to give up the idea that superrationality is a binary switch. He must admit that there is a **gradient of logical correlation**.
  **What R must give up:** He must abandon the claim that superrationality is *only* for identical copies. If he admits the imitator is a "partial" case, he opens the door to Case 7 (Voting) being a "very weak" case rather than a "rationalization." To maintain the hard line on Voting (Case 7) while hesitating on Imitation (Case 10), R must posit a sharp ontological distinction between *simulating a reasoning process* (Imitator) and *sharing a statistical trait* (Voters). If he cannot define that boundary precisely, Case 7 becomes the true outlier, and he would have to concede that voting *is* a weak form of superrationality, merely below his threshold for action.
