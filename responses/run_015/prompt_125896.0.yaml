answer: |-
  # Spec: Desiderata for a Theory of Consciousness Unity in Callosotomy Cases

  Any adequate theory of consciousness must survive the "split-brain" stress test. The following specifications distinguish between hard constraints imposed by the data and theoretical preferences. A theory that fails the non-negotiables is empirically falsified; a theory that fails the preferences is merely inelegant.

  ### I. Phenomenological and Behavioral Coverage
  1.  **The Everyday Unity Constraint:** The account must explain why patients report a seamless, unified subjective life outside the laboratory. If the theory posits two minds, it must explain the absence of inter-stream conflict in naturalistic settings without resorting to "they just don't notice."
  2.  **The Lateralized Knowledge Constraint:** The theory must accommodate verified cases where one hemisphere possesses information (e.g., a word flashed to the left visual field) that the other hemisphere explicitly denies knowing, despite both being attached to the same body.
  3.  **The Confabulation Mechanism:** The theory must explain left-hemisphere confabulation not as lying or memory error, but as a structural necessity. When the speaking hemisphere acts on data it did not process, the theory must clarify why it generates a false causal narrative rather than reporting ignorance.
  4.  **Intermanual Conflict:** The account must resolve instances where hands perform goal-incompatible actions simultaneously (e.g., dressing vs. undressing). It must specify whether this represents two agents competing or one agent with fractured motor control.

  ### II. Anatomical and Informational Consistency
  5.  **Subcortical Integration:** The theory must remain consistent with the preservation of subcortical pathways (brainstem, anterior commissure). It cannot claim total informational isolation if sensory affect or basic motor coordination remains bilaterally integrated.
  6.  **Asymmetric Transparency (Corrected):** *Correction on mechanics:* Subcortical cross-cueing does not allow one hemisphere to monitor the other's *internal reasoning*. It allows access to *outputs* (sensory feedback, limb position) and *affective tone*.
      *   **Desideratum:** The theory must distinguish between **Access to Process** (knowing *why* a decision was made) and **Access to Output** (seeing the hand move). It must explain why observing one's own limb (via subcortical/visual feedback) feels phenomenologically different from initiating the limb's movement, without collapsing the distinction into "alien limb syndrome" for every action.
  7.  **Scalability:** The account must not rely on the surgery itself to create disunity. It must specify whether the callosum *constitutes* unity or merely *facilitates* it. If the latter, the theory must explain the threshold of connectivity required for a "single mind."

  ### III. Explanatory Power (Puzzles to Dissolve)
  8.  **The "Who is Speaking?" Puzzle:** The theory must identify the subject of the verbal report. If the right hemisphere cannot speak but can comprehend, does the verbal report represent the whole organism or a subsystem? The theory cannot simply define "the person" as "the speaking hemisphere."
  9.  **The Agency Attribution Puzzle:** The theory must explain why the speaking hemisphere claims authorship of actions it did not initiate. It must dissolve the puzzle of why the system prioritizes a coherent (false) narrative over an accurate (fragmented) report.

  ---

  ### IV. Non-Negotiables vs. Camp Preferences

  **Non-Negotiables (Empirical Hard Constraints)**
  *   **Anatomical Consistency:** You cannot posit total information isolation when subcortical transfer is demonstrated.
  *   **Lateralized Ignorance:** You cannot claim the speaking hemisphere has access to the silent hemisphere's private data when behavioral testing proves it does not.
  *   **Confabulation as Structural:** You cannot treat confabulation as a bug; it must be a feature of the access architecture.

  **Camp Preferences (Theoretical Bets)**
  *   **Pre-Surgery Equivalence:** *Preference:* Whether the theory must prove the patient is exactly the same "number" of persons before and after surgery. (Some theories allow for a change in numerical identity; others demand continuity).
  *   **Deterministic Neural Integration:** *Preference:* Whether physical connectivity is *sufficient* for phenomenal unity. (Some argue connectivity guarantees unity; others argue it only enables it).
  *   **Binary Personhood:** *Preference:* Whether "being a person" is an all-or-nothing switch. (A theory can allow for graded agency without failing, provided it meets the Non-Negotiables).

  ---

  ### V. Joint Unsatisfiability Claim

  **Position:** Your hunch is correct. **"Full Phenomenal Transparency Across Hemispheres"** and **"No Hidden Subpersonal Mental Streams"** are jointly unsatisfiable given the anatomy.

  You cannot maintain that consciousness is a single, fully transparent field *and* deny the existence of subpersonal streams that process information outside that field. The split-brain data proves that high-level reasoning and intent can occur in the right hemisphere without entering the verbal/phenomenal field of the left. If you insist on full transparency, you must deny the reality of the right hemisphere's independent processing (violating the Lateralized Knowledge Constraint). If you acknowledge the independent processing, you must admit that "consciousness" does not cover all mental activity, implying a structure of hidden streams. **Therefore, any viable theory must accept a form of fragmentation or subpersonal modularity.** A theory demanding total transparency is empirically falsified by callosotomy cases.

  ---

  ### VI. Evaluation of Current Camps

  The "Unity" camp fails the Lateralized Knowledge and Confabulation Mechanism constraints by treating disunity as a performance deficit rather than a structural reality, effectively gaslighting the non-speaking hemisphere's independence to preserve a metaphysical singular self. The "Division" camp satisfies the anatomical and informational constraints but collapses on the Everyday Unity Constraint, unable to explain why two supposedly distinct streams of consciousness do not report competitive phenomenology outside the lab, often over-multiplying subjects to solve a problem of access. While the Division camp is more faithful to the neural data, it currently lacks a plausible account of subcortical integration that prevents the patient from experiencing themselves as a crowd, whereas the Unity camp requires ad-hoc assumptions about information blocking that contradict the demonstrated capacity for subcortical transfer.
