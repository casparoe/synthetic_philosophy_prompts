  Rough bands we're using: 21-25 handles everything the question asks with no substantive errors; 16-20 solid and mostly right but with a real mistake or a chunk of the question left unaddressed; 11-15 gets the general shape but mishandles the core mechanism; below that, off-topic or confused throughout.

