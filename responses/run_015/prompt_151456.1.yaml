answer: |-
  ### Research Agenda: Prioritizing Conceptual Levers for Welfare Architecture

  For a conceptual research group with no empirical capacity, the goal must be to identify the **normative bottlenecks** that dictate institutional design. You cannot solve empirical problems (e.g., "how many people are structurally unemployed?"), but you can solve the conceptual problems that determine how the state *responds* to empirical uncertainty.

  My recommendation is to prioritize the tensions in the following order:

  1.  **Tension 1: Contractualism vs. Moral Desert** (The Justificatory Logic)
  2.  **Tension 2: State Epistemic Obligations vs. Institutional Suspicion** (The Verification Standard)
  3.  **Tension 3: Coherence of the 'Undeserving' Category** (The Classification Limit)

  Below is the defense of this ordering based on dependency, tractability, and practical leverage, followed by the conditions under which this ranking would invert.

  ---

  ### 1. Priority One: Contractualism vs. Moral Desert
  **The Question:** Can welfare conditionality be defended purely as a reciprocal exchange (contractualism), or does it inevitably rely on judgments of moral worth (desert)?

  **Why it is Upstream (Dependency):**
  This is the architectural keystone. The answer to this question determines *what* the institution is looking for.
  *   **If Contractualist:** The state only needs to verify *behavior* (e.g., "Did the claimant submit three job applications?"). The claimant's internal motivation, character, or "deservingness" is irrelevant. The "undeserving poor" category becomes rhetorical noise rather than a policy target.
  *   **If Desert-Based:** The state must verify *intent* and *character* (e.g., "Did the claimant *try* hard enough?" or "Are they *really* looking?"). This necessitates the "undeserving" category and justifies intrusive fraud protocols.

  **Tractability (Conceptual Only):**
  This is pure normative political philosophy. It requires analyzing the logical consistency of "reciprocity" without invoking "merit." You do not need fieldwork to determine whether a theory of justice permits punishing moral failure via benefit sanctions.

  **Practical Leverage (Architecture vs. Rhetoric):**
  Resolving this alters the **legal structure of sanctions**.
  *   If you prove that current workfare systems *covertly* rely on desert (despite contractualist rhetoric), you expose a legitimacy deficit. The policy architecture must then be redesigned to remove discretionary judgments about "effort" or "attitude," limiting sanctions to clear, binary breaches of contract.
  *   If you prove contractualism is sufficient, you undermine the moralistic rhetoric used to justify harsh fraud detection, potentially lowering the political will for punitive measures.

  ### 2. Priority Two: State Epistemic Obligations
  **The Question:** What is the minimum epistemic standard the state must meet before imposing a sanction? Does the presumption of innocence apply to welfare claimants, or does the logic of fraud prevention justify a presumption of guilt?

  **Why it is Mid-Stream:**
  This tension is dependent on Tension 1. You cannot determine the *standard of proof* (T2) until you define *what is being proven* (T1).
  *   If the obligation is contractual (T1), the epistemic bar is low (paperwork verification).
  *   If the obligation is desert-based (T1), the epistemic bar is impossibly high (mind-reading), creating a gap that "institutional suspicion" fills.

  **Tractability:**
  This is a problem of **social epistemology** and **administrative law**. You can analyze the concept of "legitimate authority" without empirical data. You can argue conceptually that an institution lacks the *capacity* to know certain facts (e.g., intent), and therefore lacks the *right* to sanction based on them.

  **Practical Leverage:**
  Resolving this alters the **burden of proof**.
  *   If you establish that the state has a positive epistemic obligation to *verify* non-compliance rather than simply *detect* anomalies, fraud protocols must shift from algorithmic suspicion (flagging outliers) to evidentiary confirmation.
  *   This moves the design from "guilty until proven innocent" (current fraud architecture) to "compliant until verified otherwise." This is a concrete procedural change, though less foundational than T1.

  ### 3. Priority Three: Coherence of the 'Undeserving Poor'
  **The Question:** Is the distinction between voluntary and involuntary non-contribution conceptually coherent given structural constraints?

  **Why it is Downstream:**
  This is the **boundary condition**. It matters only if the state insists on making the distinction.
  *   If T1 is resolved in favor of pure contractualism, the "undeserving" category is functionally obsolete. The state pays for compliance, not virtue. Whether a claimant is "structurally blocked" matters only for defining reasonable contract terms, not for moral judgment.
  *   If T1 remains desert-based, *then* T3 becomes critical. But since your group cannot do empirical fieldwork, you cannot settle whether structural unemployment *actually* blurs the line. You can only analyze the *concept* of voluntariness.

  **Tractability (Low for your constraints):**
  While you can analyze the *concept* of voluntariness, determining whether real-world labor markets satisfy those conditions is empirical. A conceptual argument that "structural constraints negate voluntariness" is vulnerable to empirical counter-claims (e.g., "some jobs are always available").

  **Practical Leverage:**
  Resolving this alters **eligibility criteria**.
  *   If the category is incoherent, targeted conditionality collapses into universalism. This is the most radical design change, but it is the hardest to defend without empirical data. It is a "nuclear option" that is difficult to aim precisely with conceptual tools alone.

  ---

  ### Defense of Ordering Criteria

  1.  **Dependency:** T1 dictates the *object* of inquiry. T2 dictates the *method* of inquiry. T3 dictates the *limits* of inquiry. You cannot set a method (T2) or find a limit (T3) without knowing what you are investigating (T1).
  2.  **Tractability:** T1 is the most amenable to pure conceptual analysis. It relies on logical consistency within normative theory. T2 requires bridging theory and administration. T3 risks colliding with empirical reality, which is outside your group's scope.
  3.  **Practical Leverage:** T1 offers the highest leverage because it has the potential to **neutralize T3**. If you successfully argue that welfare is a contract, not a moral reward, the "undeserving" category loses its normative grip. You achieve the policy impact of T3 (reducing stigma and targeting) without the empirical burden of T3.

  ### What Would Change This Ranking?

  I would invert this agenda (prioritizing T3 over T1) under two conditions:

  1.  **Access to Empirical Collaboration:** If the group partners with economists or sociologists who can provide data on structural unemployment, T3 becomes tractable. If you can *prove* that 40% of "non-compliance" is structurally determined, the "undeserving" category collapses empirically. This renders the T1 philosophical debate moot; the policy fails on factual grounds, regardless of its normative justification.
  2.  **Shift in State Justification:** If the state explicitly abandons contractualist rhetoric and openly admits the system is about "moral correction" (desert), T1 is settled by fiat. The research focus must then immediately shift to T2 (Epistemic Obligations). If the state claims the right to judge moral worth, the urgent question becomes: *By what right does the state claim to know moral worth?* This makes T2 the upstream bottleneck for legitimacy.

  ### Recommended 3-Year Work Plan

  *   **Year 1 (T1):** Map the logical dependence of current sanction regimes on desert theory. Produce a typology of "contractual" vs. "moral" conditions. **Goal:** Show that current fraud protocols are incompatible with a purely contractual model.
  *   **Year 2 (T2):** Define the "Epistemic Threshold for Sanctioning." Argue for a normative principle of *administrative humility*: the state cannot sanction what it cannot verify. **Goal:** Propose a "Burden of Proof" framework for welfare administration.
  *   **Year 3 (Synthesis):** Apply T1 and T2 to T3. Argue that *because* the state cannot meet the Epistemic Threshold (T2) regarding voluntariness (T3), it must retreat to a minimal Contractualist model (T1). **Goal:** A white paper recommending the abolition of "intent-based" sanctions.

  This agenda maximizes your comparative advantage (conceptual clarity) to force institutional changes (burden of proof, removal of moral judgment) without requiring data you do not have.
