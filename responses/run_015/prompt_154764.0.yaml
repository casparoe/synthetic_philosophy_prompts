      *   *Precautionary Principle:* How to handle uncertainty. Don't assume zero, don't assume max. Use a "sliding scale of precaution."
      *   *Aggregation:* Does suffering sum across individuals? Utilitarian view says yes. Rights view says no (inviolability). The committee likely operates on a hybrid (cost-benefit analysis mandated by law usually).
      *   *Consistency:* The "Pig/Crab" rule is essentially an argument against phylogenetic chauvinism. It's sound *if* the behavioral markers are truly equivalent.
      *   *Defensibility:* The procedure needs to document *why* a decision was made, especially where evidence is lacking.

  3.  **Drafting the Procedure (The "Tuesday Afternoon Tool"):**
      *   *Goal:* Step-by-step, stop/no-go points, clear distinction between fact and value.
      *   *Structure:*
          1.  **Triage (The "Stop" Check):** Is this legally protected? (Often the first hard stop).
          2.  **Sentience Assessment (The "Fact" Check):** Using the Precautionary Principle.
          3.  **Severity & Numbers (The "Calculation"):** Addressing the aggregation problem.
          4.  **The Value Handoff (The "Decision"):** Where the committee must vote based on ethics, not science.
      *   *Addressing the "Missing Evidence":* Use a proxy system (Phylogeny + Behavior). If close to a known sentient relative + complex behavior = assume sentience for precaution.
      *   *Addressing the "Numbers Game":* Acknowledge the discomfort. Don't just multiply. Use a "Risk Weighted Burden."
