answer: |-
  You have not garbled it. You have actually grasped the central tension in animal ethics better than many scientists do: **nociception** (reflexive withdrawal from damage) is not **pain** (the subjective unpleasant experience of damage), and **pain** is not necessarily **consciousness** (self-awareness, future planning). For welfare purposes, *sentience* (the capacity to suffer) is the threshold that matters.

  You are also right that your committee is being asked to make value judgments disguised as technical assessments. When evidence is missing, you are not *finding* the answer; you are *choosing* a risk tolerance.

  Here is a procedure designed for your constraints: 20 minutes, mixed expertise, defensible minutes, no journal access.

  ### The "Tuesday Afternoon" Protocol

  This is a four-step filter. You run it in order. If a step triggers a "Stop," you stop. If it triggers "Escalate," you move to the next step with higher scrutiny.

  #### Step 1: The Legal & Phylogenetic Hard Stop
  *   **Question:** Is this species legally protected (e.g., vertebrates, cephalopods)?
  *   **Action:**
      *   **Yes:** Proceed to Step 2.
      *   **No (e.g., insects, nematodes):** Apply the **Precautionary Slider**.
          *   *Rule:* If the species is an invertebrate, ask: "Is there a close relative that is sentient?" (e.g., Crabs $\rightarrow$ Lobsters; Flies $\rightarrow$ Bees).
          *   *If Yes:* Treat as sentient for the purpose of severity banding.
          *   *If No:* Band as "Sub-threshold" but record the *number* of animals.
  *   **Why:** This handles the "absence of evidence." You don't need proof of consciousness; you need phylogenetic proximity to a known sentient creature. This prevents "assume zero" without forcing "assume human-level."

  #### Step 2: The Consistency Check (Your Pig/Crab Rule)
  *   **Question:** What evidence of suffering is being used to justify the severity band?
  *   **Action:** Apply the **Phylogenetic Parity Test**.
      *   *Prompt:* "If a mammal showed this behavior (e.g., guarding an injury, trade-off between pain relief and food), would we call it pain?"
      *   *If Yes:* You must classify this behavior as pain in the current species *unless* there is specific evidence they lack the neural hardware to process it.
      *   *If No:* You may classify it as nociception only.
  *   **Why:** This formalizes your intuition. It isn't circular; it's a bias check. It forces the committee to justify why a crab's behavior counts for less than a pig's. If you can't justify it neurologically, you must treat them the same.

  #### Step 3: The Aggregate Burden Calculation
  *   **Question:** Does the number of animals change the severity band?
  *   **Action:** Do **not** multiply Credence $\times$ Number. Instead, use the **Aggregate Trigger**.
      *   *Rule:* A protocol involving >100 animals automatically bumps the scrutiny level (e.g., from Fast-Track to Full Discussion), even if individual severity is "Mild."
      *   *Rule:* A protocol involving >1,000 animals requires a specific justification for the *sample size* in the minutes.
  *   **Why:** Multiplying probabilities feels cold and mathematically dubious (is 1000 flies equal to 1 monkey? Who knows?). But high numbers *always* increase the risk of error and the total welfare burden. This makes numbers a procedural trigger, not a moral calculator.

  #### Step 4: The Value Handoff
  *   **Question:** Is the remaining disagreement about *facts* or *values*?
  *   **Action:** Label the decision in the minutes.
      *   *Fact:* "We accept the evidence that X causes pain."
      *   *Value:* "We accept this pain because the scientific benefit is Y."
      *   *Uncertainty:* "We lack evidence on sentience; we are applying the Precautionary Slider."
  *   **Why:** This protects you. If someone challenges the decision later, you can show that you acknowledged the uncertainty and made an explicit ethical choice, rather than pretending the science settled it.

  ---

  ### What Philosophy Survives (and What You Drop)

  **Keep:**
  1.  **The Precautionary Principle:** When in doubt, err on the side of the animal. This survives into Step 1.
  2.  **The Argument from Analogy:** Your Pig/Crab rule. This survives into Step 2.
  3.  **Aggregation:** Suffering sums up. This survives into Step 3.

  **Drop:**
  1.  **Metaphysical Consciousness:** You do not need to decide if a fish has a "self." You only need to decide if it *suffers*. Drop the hard problem of consciousness; stick to welfare.
  2.  **Utilitarian Calculus:** Do not try to calculate "Net Good." You cannot weigh scientific benefit against animal pain on a single scale. Keep them separate (Severity vs. Justification).
  3.  **Rights Language:** Avoid "inviolable rights." It creates hard stops that the law may not support. Stick to "Burdens" and "Justifications."

  **Where This Will Misfire:**
  *   **Qualitative Differences:** The procedure treats pain as a quantity. It cannot distinguish between "fear of death" (Macaque) and "thermal irritation" (Larva). It risks equating them if the numbers are high enough.
  *   **The "Paperwork" Trap:** Step 3 might turn high-number low-severity protocols into bureaucratic nightmares without actually improving welfare.
  *   **Expertise Gap:** The committee still has to guess at "Phylogenetic Proximity." You will need the vet to carry this load.

  ---

  ### Running the Cases

  Here is how the procedure handles your three specific scenarios.

  #### Case 1: 50,000 Fruit Fly Larvae (Heat Avoidance, Killed)
  *   **Step 1 (Phylogeny):** Invertebrate. Close relatives (other insects) show complex learning. **Slider:** Treat as sentient for banding.
  *   **Step 2 (Consistency):** Heat avoidance + learning implies they "mind" the heat. If a mouse did this, we'd call it mild pain. **Band:** Mild per animal.
  *   **Step 3 (Aggregate):** 50,000 animals. **Trigger:** This exceeds the 1,000 threshold.
      *   *Result:* Cannot Fast-Track. Requires Full Discussion. Requires Sample Size Justification.
      *   *Severity:* Individually "Mild," but procedurally "High Scrutiny."
  *   **Step 4 (Handoff):** Minutes record: "Uncertainty on sentience remains; precaution applied. High numbers accepted based on scientific necessity."
  *   **The Uncomfortable Outcome:** Your instinct is "this is paperwork." The procedure says "this is a massive aggregate welfare burden." It forces you to ask: *Do we really need 50,000? Could we do 5,000?* It challenges the idea that small animals are ethically free just because they are small.

  #### Case 2: 1 Rhesus Macaque (Severe, Brain Recording)
  *   **Step 1 (Phylogeny):** Vertebrate/Primate. **Hard Stop:** Legally protected. High confidence in sentience.
  *   **Step 2 (Consistency):** Invasive surgery + restraint. Parity with human medical procedures. **Band:** Severe.
  *   **Step 3 (Aggregate):** N=1. No aggregate trigger.
  *   **Step 4 (Handoff):** This is a pure Value Handoff. The science is clear (it will suffer). The decision is whether the science justifies *Severe* suffering in a *Primate*.
  *   **The Outcome:** The procedure confirms your instinct: this is the "real" ethical problem. However, it prevents you from dismissing the flies entirely. It forces the committee to weigh *one severe life* against *50,000 mild lives* explicitly, rather than letting the monkey dominate the conversation by default.

  #### Case 3: Zebrafish Larvae (5 Days Old, Drug Screen)
  *   **Step 1 (Phylogeny):** Vertebrate. **Hard Stop:** In many jurisdictions (e.g., UK/EU), protection starts at independent feeding (approx. 5 dpf).
      *   *If legally protected:* Treat as Vertebrate.
      *   *If not:* Apply Slider. They are fish. High proximity to sentient adults.
  *   **Step 2 (Consistency):** Drug screen implies potential systemic distress.
  *   **Step 3 (Aggregate):** Likely high numbers (screening). Triggers Sample Size Justification.
  *   **Step 4 (Handoff):** **Uncertainty Label.** "Sentience at 5dpf is scientifically debated. Committee applies Precautionary Principle."
  *   **The Outcome:** This is the hardest case. The procedure forces you to admit you don't know. It stops the scientists from saying "they can't feel anything" without proof. It likely bumps this to "Moderate" scrutiny purely due to the uncertainty + numbers, even if the individual severity is low.

  ### Summary of the "Dislike"
  You suspected the procedure might tell you the flies matter more than the monkey. It won't say that. It will say **the flies matter *differently*.**

  *   The Monkey is a **Depth** problem (Intense suffering, high moral weight per individual).
  *   The Flies are a **Breadth** problem (Low uncertainty, high risk of aggregate error).

  Your instinct to prioritize the monkey is ethically sound (most people weight higher-order suffering more heavily). But the procedure prevents you from ignoring the flies as "just bugs." It forces the Sample Size Justification. If the scientists can't justify 50,000 flies, the protocol gets sent back. That is a win for welfare, even if the flies aren't "conscious" in the human sense.

  ### Final Advice for the Committee Room
  When the scientists say, "It's just a reflex," use Step 2: *"If a dog did that, would you give it analgesia? If yes, why not the crab?"*

  When the chair says, "We haven't got time to debate consciousness," use Step 4: *"We don't need to debate it. We just need to minuted that we are applying the Precautionary Principle because the evidence is missing."*

  This keeps you within your 20 minutes, keeps the minutes defensible, and ensures you aren't just rubber-stamping uncertainty.
