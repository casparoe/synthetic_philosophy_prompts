      *   *Focus:* Make sure the distinction between *Sentience Probability* and *Severity Band* is clear.
      *   *The "Numbers" problem:* I need to be careful not to endorse pure utilitarianism if it violates legal frameworks (which usually prioritize protected species). I will frame it as "Aggregate Welfare Burden."

  9.  **Final Polish:** Ensure the tone is collaborative ("You're right about X, here's how to operationalize it"). Make sure the "Value Handoff" is explicit so they don't blame science for ethical choices. (Proceed to generate response).

  *(Self-Correction on Case 3)*: Zebrafish at 5 days. In the UK, they become protected at 5 days post-fertilization (independent feeding). If the protocol says "5 days," they are likely legally protected. I should note this legal threshold as a "Hard Stop" in the procedure, as AWECs must comply with law first. I will treat it as the "Threshold Case."

  *(Self-Correction on Case 1)*: Invertebrates (flies) are often not legally protected (depending on jurisdiction, e.g., UK ASPA vs. US AWA). The user says "Animal Welfare and Ethics Committee," implying a broader scope than just legal minimums (many institutions cover all vertebrates + cephalopods + sometimes decapods/insects voluntarily). I will assume the committee *has* the remit to judge them, otherwise the question is moot. I will proceed assuming they have ethical jurisdiction even if not legal.

  *(Refining the "Numbers" intuition)*: The user dislikes "Credence x Intensity x Number." Why? Because it feels cold. I need to validate that discomfort. The procedure shouldn't just be a calculator; it should be a "Risk Trigger." If Aggregate Risk > Threshold, then Scrutiny Level Up.

  *(Refining the "Consistency Rule")*: It's essentially the "Argument from Analogy." I will validate it as a bias check.

