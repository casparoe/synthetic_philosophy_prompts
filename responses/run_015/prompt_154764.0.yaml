      *   **User Role:** Lay member on an Animal Welfare and Ethics Committee (AWEC). Background in estates management, not science/philosophy. Self-educated on animal consciousness.
      *   **Context:** Monthly meetings, 8-9 protocols, ~20 mins per protocol. Committee composition: Lay member (user), Vet, Scientists, Chair. No species specialists. Decisions must be defensible.
      *   **Core Need:** A *procedure* (checklist/algorithm), not a position paper. Needs to be actionable within time limits.
      *   **Key Challenges to Address:**
          1.  Thin/missing evidence (invertebrates, larvae).
          2.  Numbers vs. Confidence (1 macaque vs. 50k larvae).
          3.  Consistency Rule (Pig vs. Crab evidence).
          4.  Value Judgments vs. Fact Finding (where the procedure stops).
      *   **Test Cases:**
          1.  50k fruit fly larvae (heat avoidance, killed).
          2.  1 Rhesus macaque (severe, brain recording).
          3.  5 dpf zebrafish larvae (drug screen, sentience unknown).
