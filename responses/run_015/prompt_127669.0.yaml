prompt: |-
  Draft the joint statement that a defender of a Dennett-style compatibilist account of moral responsibility—who holds that determinism does not erase desert but only constrains its scope, supporting a limited, non-retributive proportionality in punishment—and a defender of Gregg Caruso's hard-incompatibilist, free-will-skeptical rejection of retributive desert—who holds that without libertarian freedom no offender genuinely deserves suffering or deprivation beyond what is necessary for public safety, rehabilitation, and deterrence—could both sign after a good-faith adversarial collaboration. The collaboration should examine a specific, hypothetical institutional design that has not been widely discussed: a "calibrated-quarantine" criminal-justice framework in which the duration and conditions of state-imposed separation are determined by predictive-risk algorithms, yet must be publicly justified to the offender as proportionate to the harm caused rather than solely to future risk.

  In a numbered agreed-claims section, list the propositions both sides can accept regarding (i) the formal structure of the free-will debate, (ii) the empirical findings on punishment and deterrence, and (iii) the normative constraints on state coercion. Follow this with a disagreements table in which each side's position is phrased in wording that side would accept: the compatibilist's claim that reconstructed "moral desert" can survive within determinism and ground a harm-sensitive but risk-independent proportionality; the skeptic's claim that such reconstruction is merely verbal and that any harm-sensitive justification collapses into consequentialist risk-management.

  Then identify the cruxes—specifically, whether "proportionality to harm" can be conceptually detached from retributive desert, and whether predictive algorithms can ever satisfy the normative demands of fairness without smuggling in metaphysical assumptions about agency. For each crux, specify a concrete case or argument both parties agree bears on it: for example, an offender whose harmful act was deterministically caused by an undiagnosed brain tumor and whose predictive-risk score is near-zero, asking whether any non-instrumental justification for deprivation remains. Record, in advance, each side's predicted assessment of that case.

  Finally, include a brief note on whether any portion of the disagreement is merely verbal—particularly around terms like "responsibility," "desert," and "proportionality"—and state what both sides agree would count as evidence that moves the debate. Throughout the document, clearly separate claims that are settled among philosophers of action and punishment from those that remain genuinely contested among specialists, and do not present either camp's contested metaphysical or normative commitments as if they were the consensus view.
