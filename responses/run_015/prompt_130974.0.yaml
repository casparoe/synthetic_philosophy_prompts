  *Wait, one more check on the "Collective Reward".* If the reward is *shared*, they might coordinate to all bet 0%. I need to ensure there's tension. Individual recognition for highest surviving fund + Collective reward for survival rate. This creates the Prisoner's Dilemma-esque tension between safety and glory.

  *Let's finalize the "Catastrophe".* To make it feel like "Geometric Rationality," the catastrophe should ideally be the natural consequence of volatility (ruin), but the prompt specifically asks for a "hidden catastrophe round." I will implement a "Black Swan" event in Round 7 where the coin is weighted 90% Lose, but *only* for those who bet >40%. No, that's too complex to track secretly.
