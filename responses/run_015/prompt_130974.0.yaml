  12. **Final Polish:** Check tone. Needs to be academic but engaging. Precise instructions for the instructor.

  *(Self-Correction on the Math)*: If the odds are 60% to double (100% return) and 40% to lose bet (100% loss of stake), the Kelly fraction is $p - q/b = 0.6 - 0.4/1 = 0.2$. So 20% bet is optimal. If they bet 100%, expected arithmetic return is high, but geometric growth is negative ($1.6^{0.6} \times 0.4^{0.4} \approx 0.92 < 1$). They will almost certainly go bust over 10 rounds. This works perfectly.
