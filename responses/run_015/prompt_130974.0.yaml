answer: |-
  # Seminar Simulation: The Perpetual Trust Protocol

  **Topic:** Geometric vs. Arithmetic Rationality  
  **Time:** 90 Minutes  
  **Participants:** 12 Students (6 Pairs)  
  **Materials:** 6 Calculators (or phones allowed), 12 Printed "Ledger Sheets," 1 Large Coin (or digital randomizer projected), Whiteboard for Leaderboard, Small Collective Reward (e.g., high-quality chocolates or a promise of a dedicated coffee session).

  ## 1. The Framing (00:00 – 00:10)
  **Do not mention Kelly, Geometric Mean, or Expected Value.**

  **Instructor Script:**
  "You are Trustees. Each pair manages a 'Perpetual Trust' intended to support beneficiaries who will not be born for another century. Your capital is not yours; it is an intergenerational covenant. Your goal is twofold:
  1.  **Survival:** If your Trust capital hits 0, the lineage is extinct. You are 'dismissed' (eliminated from the prize pool).
  2.  **Growth:** Among surviving Trusts, the one with the highest final capital wins individual recognition.
  However, there is a collective covenant: If *at least half* of the Trusts survive to the end with more than their starting capital, I will provide [The Collective Reward] for the whole seminar. If too many lineages go extinct due to recklessness, the reward is forfeit. You are competing for glory, but cooperating for survival."

  **Roles:**
  *   **The Trustee (1 per pair):** Makes the betting decisions. Holds the ledger.
  *   **The Auditor (1 per pair):** Cannot speak during decision phases. Must record the Trustee's *stated reasoning* for each bet in one sentence on the Ledger Sheet (e.g., "Feeling lucky," "Recouping loss," "Maximizing EV").

  **Starting Capital:** 100 "Trust Units" (TU) per pair.

  ## 2. The Mechanics (00:10 – 00:40)
  **The Game:** 10 Rounds of betting.
  **The Coin:** A biased coin. **60% Heads (Win), 40% Tails (Lose).**
  **The Payoff:**
  *   **Heads:** You win 100% of the amount bet (Capital + Bet).
  *   **Tails:** You lose 100% of the amount bet (Capital - Bet).
  *(Note: This has a high positive Arithmetic Expected Value: $0.6(1) + 0.4(-1) = +0.2$ per unit bet. Arithmetic rationality dictates betting 100%.)*

  **The Hidden Rule (The Catastrophe):**
  Do not reveal this yet. **In Round 7**, a "Market Liquidity Crisis" occurs.
  *   If a Trustee bet **more than 50%** of their current capital in Round 7: Their Trust is immediately liquidated (0 TU) regardless of the coin flip. (Rationale: Over-leverage triggers margin calls in a crisis).
  *   If a Trustee bet **50% or less**: The normal coin flip applies.

  **Procedure per Round:**
  1.  Trustees decide their bet fraction (0% to 100% of current capital).
  2.  Auditors record the reasoning.
  3.  Bets are written on a slip of paper and handed to you (Instructor).
  4.  You announce the Coin Result (Heads/Tails).
  5.  Trustees calculate new capital.
  6.  You update the Public Leaderboard on the whiteboard (showing current TU for all 6 Trusts).
  7.  **Crucial:** Allow 30 seconds of side-talk between pairs after Rounds 3 and 6. This allows "social contagion" of strategy.

  ## 3. The Reveal & Scoring (00:40 – 00:50)
  1.  **Round 7 Execution:** Collect bets. Reveal the "Liquidity Crisis" rule *now*. Apply the liquidation to overexposed Trusts. Flip the coin for the rest.
  2.  **Complete Rounds 8–10:** Resume normal rules.
  3.  **Final Tally:**
      *   Count surviving Trusts (>0 TU).
      *   Check Collective Reward condition (Did $\ge$ 3 Trusts survive with >100 TU?).
      *   Identify the "Top Performer" among survivors.
  4.  **Auditor Handover:** Collect the Ledger Sheets. Do not look at them yet.

  ## 4. The Debrief (00:50 – 01:30)
  **Phase 1: The Autopsy (15 mins)**
  *   Ask the eliminated Trustees: "What was your logic in Rounds 1–3?" (Likely: "I had the advantage, so I pressed it.")
  *   Ask the Auditors to read their notes aloud for Round 1 vs. Round 4. Look for the shift from "Maximizing gain" to "Chasing losses" or "Copying the leader."
  *   **The Arithmetic Seduction:** Point out that every eliminated Trustee made a mathematically *correct* Arithmetic Expected Value decision in every single round prior to ruin. They maximized local return but destroyed global capacity.
  *   **The Catastrophe:** Reveal that Round 7 punished leverage, not bad luck. Ask the survivors: "Did you bet <50% because you knew a crisis was coming, or because you were afraid of ruin?" (Most will say fear of ruin).

  **Phase 2: The Theory Mapping (15 mins)**
  *   **Arithmetic Mean:** "What is the average outcome of one flip?" (Positive). This drives the impulse to go All-In.
  *   **Geometric Mean:** "What is the compound growth rate over time?" Show on the board: If you bet 100% on a 60/40 double-or-nothing, your long-term geometric growth is negative ($1.6^{0.6} \times 0.4^{0.4} \approx 0.92$). You *will* go to zero eventually.
  *   **The Fiduciary Horizon:** Connect the "Perpetual Trust" framing to the math. Arithmetic rationality serves a single beneficiary (one round). Geometric rationality serves the lineage (infinite rounds). Ruin is not a "bad outcome"; it is the termination of the moral obligation.

  **Phase 3: Limitations & Verbal Supply (10 mins)**
  *   **The Finite Horizon Problem:** Admit that in a fixed 10-round game, the optimal strategy is *not* constant fractional betting (Kelly). As rounds run out, you should actually bet *more* to maximize end-state value if you are behind. The simulation forces a "Perpetual" mindset on a finite game.
  *   **What You Must Supply:** You must verbally explain that in the real world, we do not know when Round 10 is. The "Perpetual Trust" framing is the only thing that justifies Geometric Rationality. If the game ends tomorrow, Arithmetic wins. If the game is life, Geometric wins.
  *   **The Auditor's Role:** Highlight that the Auditors recorded *narratives* ("I need to catch up"), not math. Rationality is often post-hoc storytelling to justify arousal states triggered by the leaderboard.

  ## 5. Predictable Failure Modes
  1.  **The "Leader" Effect:** In Round 2, one Trustee will likely go All-In and win. They will top the leaderboard. In Round 3, 4 or 5 other Trustees will mimic them to avoid "falling behind," ignoring their own capital preservation. *Mitigation:* During the debrief, highlight the Auditor notes from Round 3 that say "Following X's strategy."
  2.  **Collusion:** Students might agree to all bet 0% to secure the collective reward. *Mitigation:* Remind them before Round 1 that the "Top Performer" gets individual recognition (grade bonus/public praise), re-introducing the competitive tension.
  3.  **The "Unfair" Catastrophe:** Students may feel Round 7 was a "GM trick." *Mitigation:* Frame it explicitly as "Hidden Risk." In real finance, leverage limits are often hidden until a crisis hits. The lesson is that *unknown* constraints punish overexposure.
  4.  **Calculation Drag:** Students might spend too long calculating. *Mitigation:* Enforce a 45-second timer per round.

  ## 6. Limitations of the Activity
  *   **Cannot Reproduce Infinity:** The most critical feature of Geometric Rationality is the *indefinite horizon*. Because this game ends at Round 10, a savvy mathematician might calculate the exact optimal bet for Round 10 (All-In if behind, 0 if ahead). The simulation cannot force them to feel the "infinite" pressure without lying about the end time. You must supply this verbally in the debrief: "The Trust was supposed to be perpetual. The game ending was a simulation constraint, not a fiduciary reality."
  *   **Discrete vs. Continuous:** Real capital is continuous; this is discrete rounds.
  *   **Social Utility:** The collective reward might dampen the competitive drive too much, leading to a "race to the bottom" (everyone bets 0). Monitor this; if everyone bets 0 in Round 1, intervene by announcing a "Minimum Growth Requirement" for the Trust.

  Summary: This simulation forces students to experience the conflict between maximizing single-round expected value and ensuring long-term survival through a fiduciary framing, biased odds, and a hidden leverage penalty that punishes arithmetic maximization.
