prompt: |-
  I'm running a postgraduate seminar on practical rationality — twelve students, ninety minutes, philosophy graduates with some maths — and I want them to feel, in their bones, why geometric rationality pulls against arithmetic intuition, without my simply lecturing them about Kelly betting. The niche framing I want injected is an intergenerational one: each student manages a "perpetual trust" that must survive across rounds on behalf of notional future beneficiaries, so that preserving compound capital feels like a fiduciary duty rather than an abstract mathematical preference. Please design a runnable in-room simulation with clear rules, assigned roles (a trustee who places bets and an observer-auditor who records reasoning but does not intervene), and a point-based payoff scheme with no real money but a tangible small collective reward — perhaps a shared prize for any trust that survives all rounds — so that the tension between maximising expected arithmetic return and avoiding ruin emerges from the incentives themselves. The coin or card mechanism should have a known bias, and participants should be able to observe running streaks so that arithmetic reasoning seduces them into overbetting just before a hidden "catastrophe" round wipes out anyone overexposed. Include a timeline, materials needed, and a debrief that maps specific moments — the first near-ruin, the social pressure after an early win, the auditor's silent record — onto the formal distinction between geometric and arithmetic mean reasoning. Be explicit about what will predictably go wrong the first time I run it, especially peer pressure to chase streaks, and be frank about which feature of geometric rationality — likely its dependence on an infinite or indefinite horizon — the activity cannot reproduce and I must supply verbally. No lecture up front; the idea must arrive through play. Please conclude with a one-sentence summary of the core design on a final line beginning "Summary:".
