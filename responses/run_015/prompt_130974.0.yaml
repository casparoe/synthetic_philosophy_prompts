  *Decision:* Round 6 is the "Audit." Before the coin flip, any Trustee who bet >50% of their *starting* capital for that round is flagged. If the coin comes up Tails (40%), they don't just lose the bet, they lose *everything* (Fiduciary Breach). This makes the risk of ruin asymmetric for high bettors.

