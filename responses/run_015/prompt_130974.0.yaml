      *   **Framing:** Intergenerational "Perpetual Trust" (fiduciary duty to future beneficiaries).
      *   **Mechanism:** In-room simulation with betting, bias, streaks, and a hidden "catastrophe" round.
      *   **Roles:** Trustee (bettor) and Observer-Auditor (records reasoning, no intervention).
      *   **Incentives:** Point-based, no real money, shared collective reward for survival.
      *   **Deliverables:** Rules, Timeline, Materials, Debrief, Prediction of Failure Modes, Limitations of the Activity, One-sentence Summary.
      *   **Constraint:** No lecture up front. Idea must arrive through play.
      *   **Formatting:** Final line must start with "Summary:".

  2.  **Deconstruct the Core Concept (Geometric vs. Arithmetic):**
      *   *Arithmetic Rationality:* Maximize expected value per round. If $EV > 0$, bet as much as possible.
      *   *Geometric Rationality:* Maximize long-term growth rate. Avoid ruin. Bet fractionally (Kelly Criterion).
      *   *The Tension:* Arithmetic says "go big on positive EV." Geometric says "volatility drag kills compounding."
      *   *The Simulation Need:* A game where betting everything wins early but loses eventually, while betting fractionally survives.
      *   *The Twist:* The "Catastrophe" round needs to punish overexposure specifically, mimicking the "risk of ruin" inherent in finite vs. infinite horizons.

  3.  **Design the Simulation Mechanics:**
      *   *Players:* 12 students. Pairs work best for the Trustee/Auditor dynamic. So, 6 pairs.
      *   *Capital:* Start with 100 "Trust Units" (TU).
      *   *Betting:* Each round, choose a fraction of current capital to bet (0% to 100%).
      *   *The Coin:* Needs a positive EV to tempt arithmetic maximizers. Let's say 60% chance to double the bet, 40% chance to lose the bet. (EV = $0.6 \times 2 - 0.4 \times 1 = 0.8$ per unit bet). This is highly attractive arithmetically.
      *   *The "Catastrophe":* A hidden round where the odds flip or a "tax" is applied that wipes out high leverage. Actually, a better mechanism for *geometric* failure is simply the volatility drag over many rounds, but the prompt asks for a "hidden catastrophe round." Let's integrate both. The game runs for $N$ rounds. One round is secretly designated as the "Audit/Catastrophe" where if your exposure was >50%, you lose everything (mimicking a black swan or regulatory collapse due to over-leverage). Or, simpler: Just standard volatility over 10 rounds usually wipes out full-bettors, but to ensure the *feeling* of a trap, let's add a specific "Market Correction" round announced only after bets are placed.
      *   *Refinement on Catastrophe:* To make it feel like a "fiduciary duty," the goal is to have the *highest* ending capital *among those who didn't go bankrupt*. If you hit 0, you are fired (breach of duty).
      *   *The "Perpetual" Aspect:* The game needs to feel like it *could* go on forever. The surprise ending is key.
      *   *Incentive:* If *any* trust survives with >100 TU, everyone gets a prize (e.g., high-quality chocolate/coffee). This encourages some cooperation/risk-aversion, but individual glory (highest score) encourages risk. Wait, the prompt says "shared prize for any trust that survives." This aligns incentives toward survival (Geometric). But human nature is competitive. I need to balance this. Let's make the collective reward contingent on *at least half* the trusts surviving. This creates social pressure to be prudent, but the temptation to win individually remains.

  4.  **Drafting the Rules & Flow:**
      *   *Setup:* 6 pairs. 6 Trustees, 6 Auditors.
      *   *Rounds:* 10 Rounds.
      *   *Odds:* 60% Win (Bet $\times$ 2), 40% Lose (Bet $\times$ 0).
      *   *Catastrophe:* Round 7 is the "Stress Test." If you bet >50% of capital in Round 7, you are liquidated (0 TU). This forces a specific geometric constraint at a specific moment.
      *   *Auditor Role:* They don't bet. They write down *why* the Trustee chose their fraction. This creates the "reasoning record" for the debrief.
      *   *Feedback:* Public leaderboard after every round. This creates the "social pressure after an early win."

  5.  **Addressing the "Intergenerational" Framing:**
      *   Script the intro carefully. "You are Trustees for a lineage that does not yet exist."
      *   Bankruptcy = "Lineage Extinct."
      *   Growth = "Prosperity for descendants."

  6.  **Developing the Debrief:**
      *   Map the Auditor notes to the math.
      *   Highlight the "Arithmetic Seduction" (Round 1-3 wins).
      *   Highlight the "Geometric Reality" (Round 7 Catastrophe or Volatility Drag).
      *   Discuss the Horizon problem (the game ended, but the Trust is supposed to be perpetual).

  7.  **Predicting Failure Modes:**
      *   *Peer Pressure:* If one Trustee goes all-in and wins Round 1, others will feel stupid for betting small.
      *   *Collusion:* They might try to share info (forbid this).
      *   *Boredom:* 10 rounds of calculation might drag. Keep rounds fast.
      *   *The "Catastrophe" feels unfair:* Need to frame it as "Hidden Risk" inherent in markets, not a GM trick.

  8.  **Limitations:**
      *   Finite game vs. Infinite horizon. The Kelly criterion is optimal for *infinite* play. In a fixed 10-round game, optimal betting is actually dynamic (bet more as rounds run out). I must admit this limitation in the debrief. The lesson is about *ruin*, not perfect Kelly optimization.

  9.  **Refining the Timeline (90 mins):**
      *   00-10: Framing & Setup.
