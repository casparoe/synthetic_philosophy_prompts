answer: |-
  You have put your finger on a precise epistemic failure that is often conflated with Goodhart's Law but is mechanistically distinct. You are describing a failure of **Measurement Invariance**, driven by what philosophers of science and methodologists call **Operational Drift**.

  While there is no single "Law" named after a person that covers this exactly (like Goodhart's), the concept is well-established in psychometrics, policy evaluation, and experimental design under the umbrella of **Threats to Longitudinal Validity**. Specifically, your two examples map onto two classic categories defined by Campbell and Stanley (1963): **Instrumentation** (the lab example) and **Selection** (the committee example).

  However, since you asked for a concept that captures the *philosophical* pattern rather than just the statistical error, the most accurate established term is **Operational Drift**.

  Here is the breakdown of why this is distinct from the neighbors you mentioned, a definition you can use, and the answer to your question about intent.

  ### 1. Why it is not Goodhart's Law
  Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") describes a **behavioral** response. It assumes agents in the system change the *underlying reality* to satisfy the metric (e.g., teachers teaching to the test, doctors avoiding sick patients to lower mortality rates).

  In your cases, the underlying reality (the river chemistry, the patient wait times) did not change to fit the metric. The **definition of the metric** changed to fit the administrative or technical environment.
  *   **Goodhart:** The world moves to match the map.
  *   **Your Pattern:** The map's scale changes, but the legend stays the same.

  ### 2. Why it is not the Will Rogers Phenomenon
  The Will Rogers phenomenon (or stage migration) is a statistical artifact regarding **averages**. It occurs when moving a borderline case from Group A to Group B raises the average of *both* groups.
  *   **Will Rogers:** Concerns means/averages and reclassification of individuals between groups.
  *   **Your Pattern:** Concerns **counts** and the movement of the **threshold** (the line) or the **sampling frame** (the pool). You are observing a change in $N(x > T)$, not $\bar{x}$.

  ### 3. Why it is not Specification Gaming
  Specification gaming (common in AI and optimization) involves an agent finding a loophole to maximize a reward function without satisfying the intent (e.g., a cleaning robot hiding dirt instead of removing it). This implies an active search for a gap between the rule and the spirit.
  *   **Specification Gaming:** Active exploitation of a loophole by an agent.
  *   **Your Pattern:** Passive drift of the operational definition, often due to technical upgrades or bureaucratic maintenance, without necessarily any agent trying to "win."

  ### The Concept: Operational Drift
  In the philosophy of science (rooted in Percy Bridgman's **Operationalism**), a concept is defined by the set of operations used to measure it. "River Health" is not a Platonic ideal; it *is* the count of samples above the detection limit.

  **Operational Drift** occurs when the operational definition (the instrument, the threshold, the sampling frame) changes over time, while the *label* of the concept remains constant. The metric remains **technically valid** (it accurately counts what it says it counts) but loses **construct validity** (it no longer tracks the theoretical concept it is supposed to represent).

  #### Proposed Definition
  > **Operational Drift:** A degradation in the longitudinal validity of a metric caused by changes in the operational definition (thresholds, instruments, or sampling populations) rather than changes in the underlying phenomenon or strategic behavior by agents. The metric remains locally accurate but globally incomparable.

  #### Boundaries and Edges
  *   **The Edge with Goodhart:** If the threshold is moved *specifically* to make the numbers look better (e.g., the committee redraws the line *because* too many sites are failing), Operational Drift becomes **Metric Manipulation** (a subtype of Goodhart/Campbell's Law).
  *   **The Edge with Error:** If the instrument drifts due to lack of calibration (unintended), it is **Instrument Decay**. If the definition changes due to improved science (intended, but uncommunicated), it is **Operational Drift**. The epistemic result is the same; the ethical status differs.

  ### The Question of Intent
  You asked: *Is the version where nobody intends anything and there is no incentive at all the same phenomenon, or a different one?*

  **Epistemically, it is the exact same phenomenon.**
  The validity of the data is broken in identical ways. A trend line generated by a silent instrument upgrade is just as scientifically useless as a trend line generated by a silent regulatory downgrade. In both cases, the time-series is non-stationary not because of the river, but because of the ruler.

  **Ethically, they are different.**
  *   **No Intent:** This is a failure of **Metadata Management** or **Provenance Tracking**. It is negligence or ignorance.
  *   **With Intent:** This is **Data Falsification** or **Spin**.

  However, in the philosophy of science, we care about the warrant for belief. Since the warrant is destroyed in both cases, they should be treated as the same class of error when interpreting the data. The "No Intent" version is often more dangerous precisely because it lacks the obvious markers of gaming; it wears the cloak of technical progress (e.g., "We bought a better spectrometer").

  ### Summary for your notes
  *   **Established Technical Term:** **Instrumentation Threat** (Campbell & Stanley) or **Measurement Non-Invariance** (Psychometrics).
  *   **Established Philosophical Term:** **Operational Drift**.
  *   **Distinction from Goodhart:** Goodhart is behavioral (agents change the world); Operational Drift is definitional (the ruler changes length).
  *   **Distinction from Will Rogers:** Will Rogers affects averages via reclassification; Operational Drift affects counts via threshold/population shifts.
  *   **Intent:** Irrelevant to validity, relevant to ethics.

  You are seeing the **reification of the proxy** collide with the **instability of operations**. The count becomes the reality, so when the operation changes, we mistakenly believe the reality has changed.
