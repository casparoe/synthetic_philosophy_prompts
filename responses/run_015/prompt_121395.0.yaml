      *   *Defeater B: The Triviality Charge.* If *all* political concepts (e.g., "justice," "freedom," "Asian values") are boundary objects, then saying "Western values" is one adds no specific insight. It becomes a linguistic truism rather than a critique of this specific category.
      *   *Defeater C: Functional/Institutional Clustering.* Values aren't just rhetoric; they co-evolve with institutions (common law, property rights, scientific method). If these cluster geographically due to causal mechanisms (not just self-definition), the circularity argument fails. It's not circular; it's path-dependent.
      *   *Defeater D: The "Exit Option" Test.* If people actually migrate *toward* these values (not just the geography), does that suggest a universal appeal that transcends the "Western" label? (This is weaker, as the thesis admits universalism is part of the contradiction).

