answer: |-
  Subject: seminar plan / maimonides sacrifice

  Hey,

  Here's the arc I'm thinking for the grad seminar. Since they've already skimmed Guide III and are stuck on the "concession to weakness" soundbite, we need to break that before we build the actual theory. If we start with the primary/secondary intention stuff, they'll just map their simplistic view onto the new terminology. So, **example first, theory second.**

  Here's the sequence:

  **1. The Hook (Carrying Case)**
  Start immediately with the text they think they know: Leviticus 1:2. Ask them why *these* animals? Cattle, sheep, goats.
  *   **Include:** The specific historical claim in Guide III:32. The Sabians/Egyptians worshipped these specific animals. The law isn't just tolerating sacrifice; it's hijacking the specific *object* of idolatry to redirect it to God.
  *   **Exclude:** Don't get into bird offerings or meal offerings yet. Keep it tight on the quadrupeds so the Egyptian parallel hits hard.
  *   **Misconception Check (Proto-Vegan/Abolitionist):** Head this off right here. Make clear Maimonides isn't saying sacrifice is inherently evil or that God hates blood. It was the only language they spoke. It's about *reorientation*, not rejection.

  **2. The Mechanism (Primary/Secondary Intention)**
  Once they see the historical redirection, introduce the structural logic.
  *   **Primary Intention:** The thing God actually wants (knowledge of Him, prayer, ethical monotheism).
  *   **Secondary Intention:** The legal mechanism used to get there given historical constraints (sacrifice).
  *   **Misconception Check (God Lied/Deception):** This is the danger zone. Students will think "Secondary Intention" = "Divine Lie." You need to emphasize *pedagogy*. It's like a teacher using training wheels. The training wheels aren't a lie; they're a necessary condition for the primary goal (riding) at that specific developmental stage. It's divine wisdom, not trickery.

  **3. The Teleology (Prayer vs. Sacrifice)**
  Wrap up with how prayer supersedes sacrifice.
  *   **Misconception Check (Prayer destroys Sacrifice's logic):** They'll think if prayer is better, sacrifice was useless. Clarify that sacrifice had positive pedagogical value *at the time*. It wasn't just a stopgap; it was the bridge. You can't have the destination without the bridge, even if you don't stay on the bridge forever.

  **What to Leave Out**
  *   **Karaite-Rabbanite debates:** Totally irrelevant here and will derail the metaphysics.
  *   **Mishneh Torah sacrificial codes:** We're doing philosophy of law, not halakhic minutiae. Don't open that can of worms.
  *   **Spinoza/Political Control:** Briefly mention it's not just about social stability (Hobbes/Spinoza read), but about theological correction.

  **The Check Question**
  At the end, ask them this:
  *"If Maimonides believed sacrifice was merely a concession to human weakness, how would he explain the specific selection of cattle, sheep, and goats in Leviticus 1:2 versus any other domesticated animal?"*

  If they say "because those were the easiest to find" or "because people liked killing those," they missed it. They need to say "because those were the specific idols being worshipped," which proves the law is a *redirection* of habit, not just a tolerance of sin.

  Let me know if this flow works for you. I think hitting the Egyptian context first is the only way to shake them off the "concession" autopilot.

  Cheers,
  J

