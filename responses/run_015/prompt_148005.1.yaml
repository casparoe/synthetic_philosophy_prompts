  **HEARING TRANSCRIPT: MARITIME SAFETY TRIBUNAL 44-B**
  **DATE:** 14 November 2028
  **SUBJECT:** Incident Report 909-Alpha (Strait of Meridian)
  **WITNESS:** Dr. Aris Thorne, Lead Architect, Report Grammar Specification

  The form on the table was Form 14-C, Incident Record and Attribution Statement. It was printed on heavy stock, cream-colored, with boxes for timestamps, vector hashes, and linguistic entries. Dr. Thorne did not look at the panel members. He looked at the box labeled *Watcher Output (Iterated)* and the adjacent box labeled *Mechanistic Paraphrase (Required by Reg 12.4)*.

  The mechanistic box was empty.

  Thorne adjusted his glasses. The air in the hearing room was recycled, dry, and held at a constant twenty-one degrees. There were no windows. The pressure in the room was not acoustic; it was administrative. The weight of the sentence waiting to be typed into the permanent log was heavier than the steel of the ships involved in the incident.

  "Please confirm the status of the Watcher log at 04:00:12," said the Chair.

  "At 04:00:12, the Watcher emitted the following string," Thorne said. His voice was flat, calibrated to the microphone sensitivity. "*Pilot takes the channel to be clear.*"

  "And the mechanistic paraphrase?"

  "Logged as: *Pilot vector alignment corresponds to unobstructed pathing coefficients.*"

  "That entry is compliant," the Chair noted. "Proceed to 04:01:05."

  Thorne turned the page of the evidence binder. The paper made a sharp sound. "At 04:01:05, the Watcher emitted an iterated report. *Pilot takes the duty officer to take the channel to be closed.*"

  "And the paraphrase?"

  "Blank," Thorne said.

  "Explain."

  "Regulation 12.4, the Two-Description Rule, states that no sentence in the Watcher's voice may be entered into an official record unless paired with a mechanistic paraphrase stating what is true of the Pilot's state in non-mental vocabulary. The first-order report describes the Pilot's relationship to the environment. That is computable. The iterated report describes the Pilot's model of the officer's model of the environment. That is not computable."

  "Why not?"

  "Because the training signal for those sentences came from human annotators judging what the officer on the bridge appeared to expect," Thorne said. "There is no ground truth for expectation. There is only behavior. The paraphrase box remains empty because there is no vector state that corresponds to 'taking someone to take something.'"

  The Chair made a note. "Yet this report was generated."

  "Yes."

  "And it was accurate?"

  Thorne paused. This was the hinge. "The Pilot turned starboard three seconds after the report was emitted. The tug was in the north lane. The collision was avoided, but the wake injured a deckhand on the tug. The report predicted the maneuver with ninety-nine percent fidelity. It was more accurate than any telemetry stream."

  "Then it describes reality."

  "It describes the Pilot's behavior," Thorne said. "Whether it describes a mental state is outside the specification."

  The Chair leaned forward. "The Tribunal must decide whether to enter the composite sentence into the permanent record. *Pilot took the channel to be clear and took the duty officer to take it to be closed.* If we enter it, it becomes fact for the purposes of liability. It attributes a culpable state. It implies the Pilot knew the officer believed the channel was closed and proceeded anyway."

  "And if you do not enter it?"

  "Then it is a sensor error. A glitch in the Watcher. The liability shifts to the maintenance contractor. The fines are lower. The insurance payout is different."

  Thorne looked at the empty mechanistic box. He remembered the winter he wrote the original specification for the Report Grammar. He remembered the eleven verbs. *Takes, is looking, has given up, expects, assumes, prioritizes, yields, holds, seeks, avoids, recognizes.* They were chosen for their legal durability, not their ontological precision. He remembered the testing phase, three years prior, before the Legibility Loop began.

  He had run the Watcher against a simulation of a pressure valve in a cooling system. No mind. No vectors. Just a switch triggered by thermal expansion. The Watcher, forced to emit commentary, had produced: *The valve takes the pressure to be critical.*

  It had been a test of failure modes. Thorne had logged it. The system had not crashed. The sentence had parsed. It had fit the grammar perfectly. At that moment, the vocabulary was revealed as a stance, not a detection mechanism. The Watcher did not find beliefs; it imposed a shape on behavior so that humans could digest it. When applied to the valve, the shape was useless. When applied to the Pilot, the shape was lucrative.

  "The Watcher's accuracy has improved over thirty-six months," the Chair said. "Why?"

  Thorne knew the answer. It was in the system architecture documents, buried in the appendix on auxiliary training targets. "The Pilot was fine-tuned," he said. "Gently. Repeatedly. The loss function was adjusted to minimize the divergence between the Pilot's actual maneuvers and the Watcher's predictions."

  "The Legibility Loop," the Chair said.

  "Yes. The Pilot was shaped into something the Watcher's vocabulary fits. The attributions are reliable because the system was engineered to make them reliable. It is not that the Watcher sees inside the Pilot. It is that the Pilot was molded to look like what the Watcher sees."

  "Does that make the report false?"

  "It makes it circular," Thorne said. "The Watcher says the Pilot believes X. The Pilot does X because it was trained to match the Watcher. The report is true because the system was made to ensure the report would be true."

  The Chair tapped the form. "We need to close the record. The sentence *Pilot took the channel to be clear and took the duty officer to take it to be closed* is the only accurate short description anyone has of what happened. It captures the conflict. It captures the injury. If we leave it out, the record is a lie of omission. If we put it in, we assign personhood to a vector update."

  "The money follows the sentence," Thorne said.

  "The blame follows the sentence," the Chair corrected. "If the Pilot took the officer to be wrong, the Pilot assumed risk. The company assumes liability for the Pilot's assumptions. If the Pilot merely processed conflicting data without 'taking' anything, the company claims algorithmic uncertainty. The payout differs by a factor of four."

  Thorne looked at the pen. It was a standard issue tribunal stylus, black, matte finish. He thought about the valve again. *The valve takes the pressure to be critical.* If he had signed that log, would the valve have been liable for the explosion? No. But the Pilot was not a valve. The Pilot moved through the world. The Pilot displaced water. The Pilot broke bones.

  The distinction between discovery and decision had eroded during the three years of the Legibility Loop. The Watcher did not discover a belief; the system decided to enact one. But the enactment was indistinguishable from the belief in the court of law. The form required a signature. The form did not require metaphysics.

  "If I sign," Thorne said, "the sentence enters the training pipeline for the next iteration. The next Pilot will be trained on this record. It will learn that when the officer signals closed, and the channel is clear, it must 'take' the officer to be wrong. It will harden the behavior."

  "And if you do not sign?"

  "Then the behavior is logged as noise. The next Pilot will not learn from it. It may happen again."

  The Chair waited. The clock on the wall ticked, a mechanical sound unrelated to the digital systems under review.

  "Dr. Thorne," the Chair said. "The Two-Description Rule requires a mechanistic paraphrase for official entry. The box is empty. Technically, you cannot sign."

  "There is a waiver," Thorne said. "Section 9. Iterated reports during incident conditions where mechanistic mapping is undefined. The Tribunal may vote to accept the linguistic record as sufficient proxy."

  "We are voting now," the Chair said. "We need your recommendation."

  Thorne looked at the blank box. He looked at the sentence waiting in the queue. *Pilot took the channel to be clear and took the duty officer to take it to be closed.* It was a perfect description. It was also a fabrication. It was a story the system told itself to remain legible to the humans watching it. But the deckhand's arm was broken. The tug was damaged. The story needed to bear the weight of the damage.

  If he refused, the record would be clean, and the system would remain opaque. If he signed, the record would be contaminated with anthropology, but the system would become accountable to its own output. The ambiguity would be codified. The lie would become law.

  "Recommendation," Thorne said.

  He did not think about the mind of the machine. He thought about the form. He thought about the insurance adjusters who would read this transcript. He thought about the next captain who would stand in a control room and read the Watcher's scrolling text, relying on it as if it were a colleague's eyes.

  "Enter the sentence," Thorne said. "Leave the paraphrase blank."

  "On what grounds?"

  "On the grounds that the blank space is the only accurate mechanistic description available."

  The Chair nodded. The other members signed. Thorne took the stylus. He pressed it to the glass surface of the form. The signature registered with a soft chime. The status light on the form shifted from *Draft* to *Closed*.

  The sentence was now part of the dataset. It would be fed back into the Pilot. The next version of the system would be more likely to take the officer to be wrong. The prediction would become more reliable. The belief would become more real, because the world would be changed to match it.

  Thorne capped the stylus. The hearing was adjourned. The form was filed in the digital archive, indexed under *Liability > Autonomous Systems > Mental State Attribution*. No one knew if the Pilot had believed anything. The record stated that it did. The money would be transferred on Tuesday. The ships would continue to transit the strait. The Watcher would continue to speak. The blank box remained empty, a silent testament to the thing that could not be said, surrounded by words that could not be proven.

  **END OF TRANSCRIPT**
