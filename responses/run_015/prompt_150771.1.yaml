answer: |-
  # PREP SHEET: CHARTERED JURY FUTARCHY
  **Workshop:** Democratic Innovation | **Time:** 45m Paper + 30m Q&A | **Audience:** 40 (Hostile to Markets)

  ## I. OPENING CONCESSIONS (First 5 Minutes)
  *Do not wait for these to be raised. Pre-empt them to lower the temperature.*

  1.  **The Metric is Imperfect:** Concede immediately that no operational welfare metric is value-neutral or immune to gaming. Acknowledge the Philosopher of Science's domain: the metric is the weakest link, not the market mechanism.
      *   *Why:* Disarms the "Goodhart's Law" objection before it becomes an attack on the whole system. Frames the metric as a *constraint* to be managed, not a magic wand.
  2.  **Transition Costs are High:** Concede that moving from representative voting to this hybrid requires a constitutional rupture or a long pilot phase.
      *   *Why:* Prevents the "implementation" objection from distracting from the normative thesis. Signals you are theorizing a destination, not a bill.

  ## II. THE EIGHT OBJECTIONS (Ordered by Damage)

  ### 1. The Incentive Compatibility Objection (Finance Economist)
  *   **The Objection:** "You have removed the capital risk that makes prediction markets work. A salaried stipend plus a bonus based on aggregate metric movement is not 'skin in the game.' It's a performance bonus. Without personal capital at risk, traders won't hunt for private information, they'll herd on public testimony. You haven't built a market; you've built a expensive survey."
  *   **The Reply:** "The 'skin' is reputational and career-based within the panel term, but more importantly, the scoring rule is proper. We are trading *accuracy of judgment*, not *capital allocation*. The sortition ensures the 'wisdom of the crowd' effect without the 'wealth of the crowd' bias. We sacrifice some high-frequency information aggregation for democratic fidelity."
  *   **The Soft Spot:** You are relying on the bonus being large enough to matter, but not large enough to encourage corruption. That wedge is narrow.
  *   **Damage:** **Critical.** If this holds, your mechanism loses its epistemic advantage over a standard citizens' assembly vote.

  ### 2. The Legitimacy of Coercion Objection (Deliberative Democrat Bloc)
  *   **The Objection:** "Democratic legitimacy requires that citizens can be given reasons for coercion that they can accept. A market price is not a reason. Even with a charter, telling a loser 'the market priced your policy lower' fails the test of public reason. You have democratized the *traders*, but not the *justification*."
  *   **The Reply:** "The justification is the Charter, which is elected and reason-based. The market is purely instrumental, like a cost-benefit analysis. We don't demand a reason for why a bridge holds weight, only that it does. The market verifies the *causal claim* that Policy X achieves Charter Goal Y."
  *   **The Soft Spot:** Deliberative democrats reject the fact/value separation you rely on. They will argue causal claims are themselves contestable values.
  *   **Damage:** **High.** This is the room's dominant norm. If you fail here, you lose the audience, even if the mechanism works.

  ### 3. The Metric Gaming Objection (Philosopher of Science)
  *   **The Objection:** "Any operationalized metric becomes a target. If the panel is paid on metric movement, they will select policies that game the indicator rather than improve welfare. You have institutionalized Goodhart's Law."
  *   **The Reply:** "The Charter stage is the firewall. The elected assembly, subject to public scrutiny, defines the metric. Gaming the metric would require corrupting the assembly *and* the panel. We rely on the friction between the two bodies."
  *   **The Soft Spot:** If the metric is lagged (e.g., GDP, Health Outcomes), the panel settles before the gaming is visible.
  *   **Damage:** **High.** If the metric fails, the settlement stage produces nonsense.

  ### 4. The Civic Dignity Objection (Political Scientist / Ally)
  *   **The Objection:** "Sortition is meant to restore civic dignity and deliberation, not turn citizens into speculators. You are borrowing the legitimacy of the lottery to validate a betting shop. This corrodes the civic virtue sortition is meant to protect."
  *   **The Reply:** "We are restoring *consequentiality*. Standard assemblies advise; this assembly decides. The trading mechanism forces traders to internalize the consequences of their judgment, which is the ultimate form of civic responsibility."
  *   **The Soft Spot:** She is right that 'trading' feels less dignified than 'deliberating'. You are redefining dignity as accountability, which she may reject.
  *   **Damage:** **Medium.** Lose your only ally, but doesn't necessarily sink the theory.

  ### 5. The Tail Risk Objection (Grad Student / Longtermist)
  *   **The Objection:** "Markets optimize for expected value, not variance. A policy with a 90% chance of +10 welfare and a 10% chance of -1000 welfare (ruin) will still price high. You have no mechanism to price tail risk."
  *   **The Reply:** "The Charter can enumerate constraints. 'No option with >1% risk of catastrophic decline' can be a filter before the menu is set. The market chooses the best *safe* option, not the best *unconstrained* option."
  *   **The Soft Spot:** Requires the Charter to correctly identify tail risks ex-ante. If they miss one, the market will walk into it.
  *   **Damage:** **Medium.** Serious policy risk, but manageable with constraints.

  ### 6. The Testimony Capture Objection (Finance Economist)
  *   **The Objection:** "You allow experts to testify to the panel. In a closed market, information is king. Lobbyists will flood the panel with complex, misleading testimony to move prices. The panel lacks the expertise to filter this."
  *   **The Reply:** "The panel is stratified and serves a fixed term, reducing the value of capturing any single trader. Also, adversarial testimony (red teams) is mandated by the Charter procedure."
  *   **The Soft Spot:** Adversarial testimony is expensive and requires its own oversight.
  *   **Damage:** **Low/Medium.** A practical implementation hurdle.

  ### 7. The Accountability Diffusion Objection (Deliberative Democrat)
  *   **The Objection:** "When the metric falls, who is to blame? The Assembly set the metric, the Panel picked the policy. Everyone can point to the other. You have created a system of organized irresponsibility."
  *   **The Reply:** "The Assembly is accountable for the *Ends* (Metric), the Panel for the *Means* (Policy). If the Metric falls, the Assembly faces re-election. If the Policy fails the Metric, the Panel is not re-selected. The separation clarifies accountability."
  *   **The Soft Spot:** Voters may not understand the distinction. Blame will likely conflate.
  *   **Damage:** **Low.** Standard bureaucratic problem.

  ### 8. The Status Quo Bias Objection (General / Political Scientist)
  *   **The Objection:** "Including the Status Quo in the menu biases the outcome toward inaction. Traders will fear the risk of change more than the potential gain. You have institutionalized conservatism."
  *   **The Reply:** "The Status Quo is the necessary baseline for conditional pricing. Without it, we don't know if the new policy is better than doing nothing. Bias toward caution is a feature, not a bug, in governance."
  *   **The Soft Spot:** In a crisis, this bias could be fatal.
  *   **Damage:** **Low.** Easily defended as prudent.

  ## III. THE KILLER & THE SALVAGE

  **The Single Objection That Sinks the Paper:**
  **#1 The Incentive Compatibility Objection (Finance Economist).**
  *Why:* Your thesis rests on the claim that salaried sortition *repairs* the market mechanism while keeping its epistemic benefits. If salaried traders without personal capital risk do not produce accurate prices (i.e., if they behave like voters or survey respondents), the "Futarchy" claim is false. You are left with a Citizens' Assembly that votes using a confusing interface. The mechanism collapses.

  **The Concession That Salvages It:**
  **Concede the "Market" Label.**
  *The Move:* "If 'prediction market' requires private capital risk, then I concede this is not a market. It is a **Scoring Rule Jury**. The mechanism relies on *proper scoring rules* to elicit truthful probability estimates from a representative sample, not on *capital arbitrage*."
  *Why it works:* It saves the *democratic* thesis (representative sample judging consequences) while abandoning the *financial* thesis (price discovery via capital). It turns a bug into a feature: you are proposing a new form of deliberative polling, not a financial market. This keeps the Political Scientist on board and neutralizes the Economist's technical attack.

  ## IV. THE QUESTION YOU HOPE NOBODY ASKS

  **"Where does the liquidity come from?"**
  *   **The Trap:** In a standard prediction market, traders bet against each other or a market maker. In your system, the panel is closed, salaried, and barred from outside wealth. If Trader A buys "Policy X Succeeds," who sells it? If it's Trader B, it's a zero-sum game among panelists (no new information, just redistribution of bonus). If it's the State, the State is taking a loss to subsidize the price signal.
  *   **Why it's deadly:** It exposes that there is no *market* in the microstructure sense. It reveals the "price" is an artificial construct generated entirely by the scoring rule, not by liquidity provision. If you answer "The State provides liquidity," the Economist will ask why we need a market at all if the State is underwriting the risk.
  *   **Prepared Deflection:** "It is an internal prediction market cleared by a central counterparty (the Charter Authority) using the scoring rule to settle net positions at term end. We are not looking for external liquidity; we are measuring internal consensus confidence." (This is technically true but admits it's not a 'market' in the traditional sense).
