answer: |-
  **Project Title:** Categorizing Time: A Typological Test for Historical Periodization

  **Research Question**
  Do deflationist critiques of historical periodization apply equally across distinct categories of temporal labeling, or does conflating boundary, trajectory, and threshold terms generate false controversies? Specifically: Is the claim that "actors did not know they were living in it" a valid falsification for all period labels, or only for those functioning as boundaries?

  **Intervention**
  Current historiography treats periodization as a unified problem. Deflationists argue all periods are retrospective projections (the "Middle Ages" exists only because Humanists invented it). Realists argue some periods track ontological shifts (the "Scientific Revolution" marks a real change in method). Both camps assume all period labels function identically—as names for stretches of time. This project argues they do not. I propose a tripartite typology:
  1.  **Boundary Terms:** Define a stretch by what sits between (e.g., *Medium Aevum*). Content is residual.
  2.  **Trajectory Terms:** Claim a direction of change and smuggle in evaluation (e.g., *Renaissance*, *Revolution*).
  3.  **Threshold Terms:** Assert a specific property switches on at a datable point (e.g., *Print Culture*, *The Experimental Method*).

  The debate is stalled because deflationists test all three against the criterion of contemporary self-awareness. This is a category error. A Boundary term *should* fail that test; a Threshold term *should not*. By separating the labels, we can salvage realist claims for some periods without denying deflationist insights about others.

  **Methodology**
  I will not trace the etymology of the words (e.g., when "Scientific Revolution" was first coined). Word-history conflates the label with the concept. Instead, I will apply a **Contemporaneity Criterion** to the *phenomena* the labels describe. For each case, I will identify the standard "start date" and "defining criterion" used by modern historians. I will then search primary sources within a 20-year window of that start date to determine if contemporaries recognized that specific criterion as a novelty or break.

  **Case Studies**
  1.  **Boundary:** *The Middle Ages* (Start: ~500 CE). Criterion: Collapse of imperial structure/shift in identity.
  2.  **Trajectory:** *The Scientific Revolution* (Start: ~1543–1600). Criterion: Adoption of a new method distinct from antiquity.
  3.  **Threshold:** *Print Culture* (Start: ~1450). Criterion: Use of movable type as a distinct medium.

  **Work Plan (10 Weeks)**
  *   **Weeks 1–3 (Taxonomy & Criteria):** Finalize definitions of the three types. Establish the "Standard Criteria" for each case study via secondary literature (e.g., what exactly makes the Scientific Revolution a "revolution" for modern historians?). Compile a corpus of digitized primary sources (EEBO, Latin Library, etc.) relevant to the start-date windows.
  *   **Weeks 4–6 (Boundary & Trajectory):** Apply the Contemporaneity Criterion to *Medium Aevum* and *Scientific Revolution*. Code texts for explicit acknowledgment of the defining criterion (e.g., claims of "new method" vs. "restoration").
  *   **Weeks 7–8 (Threshold):** Apply the Criterion to *Print Culture*. Focus on early printer prefaces and humanist correspondence regarding the medium itself.
  *   **Weeks 9–10 (Synthesis):** Correlate results with the typology. Draft final paper.

  **Why This Method?**
  Tracing the history of the *words* (e.g., when "Middle Ages" was first used) proves only when the label arrived, not whether the periodization is useful. My method tests the *validity of the categorization* against contemporary experience. If actors in 1600 claimed they were doing something fundamentally new (Trajectory), the deflationist critique loses force even if they didn't use the noun "Revolution."

  **Deliverable**
  A 20-page paper proposing the typology and a heuristic table ("The Periodization Validity Matrix") that historians can use to justify their period choices. The table will allow a researcher to ask: "Am I using a Boundary term? If so, I cannot claim contemporary self-awareness." This provides a practical tool for avoiding category errors in narrative construction.

  **Failure Conditions**
  The project fails if the typology does not predict the outcome of the test. For example: if Threshold terms show no contemporary recognition of the "switch," or if Boundary terms show high contemporary awareness of the "break." In that case, the distinction is semantic only and offers no historiographical utility. The project is merely inconclusive if results are mixed within categories (e.g., some Thresholds visible, some not), suggesting additional variables are required.

  **Feasibility and Scope**
  Ten weeks is insufficient for archival deep-dives. I will rely on digitized corpora and established anthologies of primary sources. The risk is breadth over depth. To mitigate this, I will restrict the primary source search to "programmatic texts" (prefaces, manifestos, chronicles) where claims about novelty are most likely to appear, rather than attempting to survey general usage. If Week 6 reveals the *Scientific Revolution* case is too diffuse, I will cut the *Middle Ages* case entirely to prioritize the Trajectory/Threshold comparison, which is the stronger theoretical intervention.
