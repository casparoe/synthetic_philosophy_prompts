answer: |-
  Your skepticism is well-founded. Your roommate has grasped the "vibe" of G.E. Moore's *Principia Ethica* but has conflated several distinct arguments, particularly regarding the **Open Question Argument** and the **Principle of Organic Unities**.

  Here is a breakdown of what is accurate, what is mangled, and how the pieces actually fit together.

  ### 1. The Two Intrinsic Goods
  **Verdict: Mostly Accurate**

  Your roommate is correct that Moore identifies two primary categories of intrinsic value. In Chapter VI of *Principia Ethica*, Moore concludes that the greatest goods we know of are:
  1.  **The pleasures of human intercourse (Friendship/Personal Affection).**
  2.  **The enjoyment of beautiful objects (Aesthetic Appreciation).**

  Moore is an **Ideal Utilitarian**. Unlike classical utilitarians (like Bentham or Mill) who thought *pleasure* was the only intrinsic good, Moore argued that certain states of consciousness are good in themselves, even if they aren't purely "pleasurable" in a hedonistic sense.

  **The Nuance:** Moore doesn't necessarily say these are the *only* things with intrinsic value in the entire universe, but they are the only ones we can confidently identify as constituting the "greater goods."

  ### 2. The Open Question Argument (OQA)
  **Verdict: Mangled**

  Your roommate claims Moore uses the OQA to *prove* that friendship and beauty are the goods. This is incorrect.

  *   **What the OQA actually does:** The Open Question Argument is a meta-ethical tool used to prove **Non-Naturalism**. It argues that "Good" is a simple, indefinable property. If you define "good" as "pleasure," it still makes sense to ask, "But is pleasure good?" Therefore, "good" cannot be identical to "pleasure."
  *   **How we find the goods:** The OQA clears the ground by destroying Naturalism (the idea that good = natural properties like pleasure, evolution, desire). Once that is cleared, Moore uses **Intuitionism** to identify *which* things possess this non-natural property of "goodness." He argues we just "see" (via intuition) that friendship and beauty are good.
  *   **The Error:** The OQA explains *why* you can't define good; it doesn't tell you *what* is good. Your roommate conflated Moore's meta-ethics (what is "goodness"?) with his normative ethics (what things are "good"?).

  ### 3. The Principle of Organic Unities
  **Verdict: Major Misrepresentation**

  This is the biggest error in your roommate's explanation.

  *   **Roommate's Claim:** Organic unity means friendship and beauty must be *combined* to generate value (1+1=3).
  *   **Moore's Actual Claim:** The Principle of Organic Unities states that **the value of a whole is not necessarily equal to the sum of the values of its parts.**

  Moore does **not** argue that friendship and beauty need each other to be valuable. They are valuable independently.

  **How Moore actually applies it:**
  Moore uses Organic Unities to explain the relationship between an **object** and the **consciousness** of that object.
  *   *Example:* A beautiful world exists. (Part A: Beauty).
  *   *Example:* A conscious mind exists. (Part B: Consciousness).
  *   *The Whole:* A conscious mind *appreciating* the beautiful world.

  Moore argues that the whole (Appreciation of Beauty) has vastly more value than the sum of the parts (Beauty alone + Consciousness alone). In fact, a beautiful world with no one to see it has very little value compared to one that is appreciated.

  **Where the roommate went wrong:**
  They treated "Friendship" and "Beauty" as the *parts* that need combining. In Moore's view, "Friendship" and "Beauty" are already the *wholes* that contain value. Organic Unity is about how context changes value (e.g., pleasure is usually good, but pleasure taken in cruelty is bad as a whole), not about multiplying friendship by art.

  ### 4. The Utilitarian Conclusion
  **Verdict: Technically Accurate, but Cynical**

  *   **"Utilitarian with extra steps":** This is a fair, if reductive, summary. Moore *is* a utilitarian in structure. He believes the right action is the one that produces the most intrinsic good. The "extra steps" are that he redefined "good" to include non-natural properties (Ideal Utilitarianism) rather than just pleasure.
  *   **"OQA is a smokescreen for intuitionism":** This is uncharitable. The OQA isn't a smokescreen; it's the foundation. Without the OQA, Moore can't claim that "good" is a unique property that requires intuition to detect. If "good" just meant "pleasure," he wouldn't need intuition; he'd just need a thermometer.
  *   **The Calculus Problem:** Your roommate mentioned Moore uses Organic Unities to defend a utilitarian calculus. Actually, Organic Unities makes the calculus **impossible**. If the value of a whole isn't the sum of its parts, you cannot simply add up units of friendship and beauty to maximize them. Moore admits we can never calculate the exact outcome of our actions, but we must still aim for the best we can intuit.

  ### Summary for Your Roommate

  You can tell him he got the **Ideal Utilitarianism** right (maximizing friendship and beauty), but he mixed up the machinery:

  1.  **Open Question Argument:** Used to prove "Good" is indefinable, not to list the specific goods.
  2.  **Organic Unities:** Does not mean Friendship + Beauty = Super Good. It means The Consciousness of Beauty > (Beauty + Consciousness).
  3.  **Independence:** Friendship and Beauty are intrinsically valuable on their own; they don't need to be combined to work.
  4.  **Utilitarianism:** He is an Ideal Utilitarian, but the "Organic Unity" principle actually makes the utilitarian math much harder, not easier.

  **The Bottom Line:** Moore argues we should maximize the good. The good consists primarily of loving people and appreciating beauty. We know this because "good" is a unique property we intuit, not because we can calculate it naturally. Your roommate's "1+1=3" synergy claim is the specific part that is philosophically unsupported by Moore's text.
