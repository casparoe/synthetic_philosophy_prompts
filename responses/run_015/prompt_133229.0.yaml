answer: |-
  Here is the principle that unifies your verdicts, followed by the audit of your seven cases and the answer to your new scenario.

  ### The Principle: Rational Caring Measure

  In the Everett picture, probability is not a frequency of worlds (ontology), nor is it simple ignorance of a pre-existing fact (epistemology). It is a **normative constraint on rational action**.

  The principle is: **A rational agent should weight their concern for future branches proportional to the squared amplitude (the Born measure) of those branches.**

  This is the core of the Decision-Theoretic Derivation (Deutsch-Wallace). It treats the squared amplitude not as a count of how many worlds exist, but as a "measure of existence" or a "caring measure." Just as you care more about a future self who is healthy than one who is sick, in MWI you care more about a future self located in a high-weight branch than a low-weight one. The math of Hilbert space (specifically unitarity and the inner product) forces the square law if you want to avoid being Dutch-booked (guaranteed to lose utility) across branches.

  ### Audit of Your Seven Verdicts

  Here is how the principle handles your cases, and where you need to tighten your intuition.

  **1. Equal-amplitude (1/2, 1/2): Symmetry.**
  *   **Verdict:** Keep.
  *   **Why:** Symmetry is a special case of the Caring Measure. If the physical setup is symmetric, a rational agent cannot prefer one outcome over the other without violating indifference. The measure is equal, so the credence is equal.

  **2. Unequal Amplitudes (.9, .1): Reject Branch Counting.**
  *   **Verdict:** Keep.
  *   **Why:** Branch counting is ill-defined in Hilbert space. You can rotate the basis and change the "number" of branches arbitrarily. The squared amplitude is the only basis-independent quantity conserved under unitary evolution. Rationality requires betting on the invariant quantity.

  **3. Micro-branching (.1 fans out): Fanning buys nothing.**
  *   **Verdict:** Keep.
  *   **Why:** This is **Branching Indifference**. If the sub-branches are orthogonal states of the environment that you don't care about (they feel identical), they sum to the same total weight. Splitting a branch into a million pieces doesn't change the total measure of existence for that outcome. Your credence stays .1.

  **4. Macro-copies (1000 copies of you): Still .1.**
  *   **Verdict:** Keep, but refine the reasoning.
  *   **Why:** This is the hardest intuition to swallow. In MWI, "1000 copies" is not a well-defined physical fact unless those copies are in orthogonal states. If they are truly identical states, it is *one* branch with weight .1. If they are orthogonal (distinguishable), their weights must sum to .1. You cannot have 1000 copies each with weight .1; that would violate unitarity (total probability > 1). You must trust the weight, not the headcount.

  **5. Tiny Weight ($10^{-30}$): Act as if it won't happen.**
  *   **Verdict:** Keep.
  *   **Why:** This is pragmatic rationality. Expected utility is $Value \times Weight$. If weight is $10^{-30}$, the contribution to expected utility is negligible. However, you are correct that the branch ontologically exists. You just rationally ignore it for decision-making, same as you ignore the chance of quantum tunneling through your chair.

  **6. Interference (Recombination): No probability in play.**
  *   **Verdict:** **Modify.**
  *   **Why:** You are half-right. If branches recombine, no irreversible measurement occurred, so no "split" in the decision-theoretic sense happened yet. However, your betting intuition needs adjustment. If you bet halfway through, you are betting on the *final* outcome. The .9/.1 odds are correct *predictions* of the final interference pattern, but they are not probabilities of "which branch I am on" yet, because there is only one branch (the superposition). Probability attaches to **records**, not transient superpositions.

  **7. Irrational Weights ($1/\pi$): Continuity.**
  *   **Verdict:** Keep.
  *   **Why:** The "equal sub-branches" argument is just a proof technique, not the definition. The Born Rule is continuous. If the rule holds for rational numbers (via the sub-branch trick) and rational agents must be consistent under small perturbations (continuity), it must hold for irrationals. You don't need nice numbers for the Caring Measure to apply.

  ### The Tension Points

  You suspected **1 and 7** couldn't both stay. They can. Symmetry (1) is just the point where the Caring Measure happens to be equal. The principle doesn't rely on symmetry; symmetry relies on the principle.

  You suspected **6** has to go. It does, in the form you stated. Probability isn't a property of the wavefunction at $t=1$; it's a property of the agent's relation to the *decohered* outcomes at $t=final$. If interference is possible, the game isn't over, and "odds" are just calculations of future measure, not current self-location.

  ### The New Scenario: Rotation After Split

  **The Setup:** A device entangles a qubit (the "split"), then rotates part of the Up amplitude into Down *before* observation.
  **The Question:** Does credence change when the rotation happens, or was it settled at the split?

  **The Answer:** Credence is settled at **observation (decoherence)**, not at the initial entanglement.

  **Why:**
  In MWI, "splitting" is just entanglement. Until that entanglement spreads to the environment irreversibly (decoherence), the system is still evolving unitarily as a single coherent object.
  1.  **If the rotation happens before decoherence:** The "branches" are not yet distinct worlds. They are just components of a single evolving vector. Your rational credence must track the **final squared amplitudes** at the moment the record becomes irreversible. If the rotation shifts weight from Up to Down before you look, your credence shifts.
  2.  **If the "split" implies decoherence has already happened:** You *cannot* rotate amplitude from the Up branch to the Down branch. That would require bringing the decohered branches back together (reversing entropy), which is physically impossible for all practical purposes.

  **ML Analogy:** Think of the wavefunction as a probability distribution in a generative model.
  *   **Entanglement:** You sample a latent variable.
  *   **Decoherence:** The sample is written to disk.
  *   **Rotation:** If you modify the latent variable *before* writing to disk, the final distribution changes. If you try to modify it *after* writing to disk, you're editing a saved file, which doesn't change the distribution of the original sample generation.

  **Verdict:** Your credence should reflect the weights **at the time of observation**. If you know the rotation is coming, your credence *now* should already account for the final weights. If the rotation is a surprise, your credence updates when you learn the Hamiltonian allows it. There is no "fact of the matter" about which branch you are in until the record is fixed.

  ### Summary

  Your gut is mostly right. The unifying principle is **Decision-Theoretic Consistency**.
  *   **Give up:** The idea that probabilities exist during coherent superposition (Case 6). They are bets on final records.
  *   **Give up:** The idea that "copies" have meaning independent of weight (Case 4). Weight is fundamental; copies are derivative.
  *   **Keep:** The Born Rule as a primitive constraint on rational caring, applicable to all amplitudes (Case 7), symmetric or not (Case 1).

  Probability in MWI isn't about what *exists*; it's about what you should *care about*.
