answer: |-
  The defense that Thomas Malthus was "right but early" is one of the most persistent memes in the history of economic thought. It functions as a rhetorical shield: it acknowledges the empirical failure of the prediction (mass starvation and population collapse did not occur in the 19th or 20th centuries) while preserving the theoretical core (population grows geometrically, food arithmetically).

  However, this defense corrupts the logic of long-run falsification. By treating time as a neutral variable rather than a structural one, "right but early" renders the theory unfalsifiable. If a prediction fails for two centuries, claiming it is merely "delayed" ignores the possibility that the system has fundamentally evolved to negate the causal mechanism.

  To salvage the logic without resorting to magical thinking, we should apply the geological concept of **structural dormancy**. This distinction reveals that Malthus identified a sleeping cause, not a premature forecast. This framing does not save Malthus the prophet, but it might save Malthus the diagnostician. Furthermore, it offers a critical template for evaluating modern long-range predictions, particularly regarding climate tipping points.

  ### The Falsification Trap of "Right but Early"

  In the philosophy of science, a theory must be falsifiable. If $P$ (population pressure) leads to $Q$ (subsistence crisis), and we observe $\text{not-}Q$ for an extended period, we must conclude $\text{not-}P$ or that the causal link is broken.

  The "right but early" defense bypasses this by turning the theory into a tautology: *The crisis will happen when the crisis happens.* This ignores that in social systems, time is not a vacuum. During the two centuries Malthus was "early," humanity didn't just wait for the trap to spring; we built escape hatches. The Industrial Revolution, the Haber-Bosch process, and the demographic transition weren't merely countervailing forces that showed up late; they were structural changes that altered the coefficients of the equation.

  To say Malthus was "early" implies the trap was always set, and we just haven't sprung it yet. But if you avoid a bear trap for 200 years by inventing steel-toed boots, the trap isn't "dormant"—it's obsolete. Treating 200 years of rising per-capita income as a mere "delay" mistakes a trend reversal for a pause. It suggests the mechanism is dominant but latent, when evidence suggests the mechanism was superseded.

  ### Structural Dormancy: Geology vs. Economics

  This is where the geological analogy of **structural dormancy** becomes essential. In seismology, a fault line can remain quiet for millennia. During this dormancy, stress accumulates. The lack of earthquakes does not falsify the theory of plate tectonics; the energy is being stored, not released. The mechanism is real, but the *rupture* is contingent on a threshold.

  If we apply structural dormancy to Malthus, we must distinguish between the **pressure** (resource scarcity) and the **rupture** (Malthusian catastrophe).

  1.  **The Sleeping Cause:** Malthus correctly identified that finite resources exert pressure on infinite growth desires. This pressure is like tectonic stress. It is always present.
  2.  **The Premature Forecast:** Malthus assumed the crust was rigid. He predicted that stress would inevitably lead to rupture (famine/war).

  The "right but early" argument conflates these two. It assumes the rupture is inevitable. The dormancy framework, however, allows for the possibility of **stress relief**. In geology, stress is relieved by earthquakes. In economics, stress can be relieved by innovation (efficiency) or substitution (new resources).

  If the system releases stress continuously through technological innovation, the fault line never snaps. In this view, Malthus wasn't "early"; he was observing a static system in a dynamic world. The mechanism (scarcity) is real, but it is not *dominant* because the system possesses elastic properties Malthus denied. Therefore, watching the predicted outcome get avoided for two centuries isn't evidence of a delayed earthquake; it's evidence that the tectonic plates are sliding past each other smoothly rather than locking up.

  ### Does This Bury or Save Malthus?

  This framing splits Malthus in two.

  **It buries Malthus the Prophet:**
  If we accept structural dormancy, we admit that the *timing* of the rupture is unknowable because it depends on human ingenuity (the elasticity of the crust). A prediction that cannot specify *when* a threshold will be breached, or acknowledge that the threshold might move, is not a prediction; it's a warning. Malthus's specific forecast of inevitable misery is falsified by the historical record of decoupling population growth from resource constraints.

  **It saves Malthus the Diagnostician:**
  However, the dormancy framework validates his identification of the *stress*. We see this in modern ecological economics. We may not face a classic Malthusian famine, but we face "dormant" pressures in the form of soil degradation, aquifer depletion, and biodiversity loss. The stress is accumulating even if GDP is rising. Malthus was right that carrying capacity exists, even if he was wrong about how rigidly it binds us.

  So, the dormancy framing saves the *logic of constraints* while burying the *inevitability of collapse*. It transforms Malthusianism from a prophecy of doom into a theory of risk management.

  ### Generalizing to Climate Tipping Points

  This distinction is vital for contemporary long-range predictions, specifically regarding climate tipping points (e.g., the collapse of the AMOC, permafrost thaw, or ice sheet disintegration).

  Climate models often operate like Malthus: they identify a stressor (carbon concentration) and predict a rupture (tipping point) at a specific threshold (e.g., $+2^\circ\text{C}$). When we approach these thresholds without immediate catastrophic feedback, the temptation is to say the models are "right but early."

  Applying the dormancy framework changes the epistemological stance:

  1.  **Avoiding Unfalsifiability:** If we miss a predicted tipping point date, we cannot simply say "it's dormant." We must measure the *stress accumulation*. Is the carbon concentration stabilizing? If the stressor is removed or reduced (via decarbonization), the dormancy might become permanent. If we treat the prediction as "early" regardless of mitigation efforts, we make the theory unfalsifiable.
  2.  **Elasticity vs. Rigidity:** Like Malthus, climate models can underestimate human adaptation (geoengineering, resilience) or overestimate system rigidity. However, unlike economics, planetary physics is less elastic. You cannot innovate your way out of thermodynamics as easily as you can out of food production.
  3.  **The Danger of Dormancy:** In geology, dormancy creates false security. A quiet fault line encourages building cities on top of it. In climate, a "dormant" tipping point (where warming hasn't yet triggered runaway feedback) might encourage emissions complacency.

  The Malthus lesson here is that **dormancy is not safety.** Just because the Malthusian trap didn't snap in 1900 doesn't mean resource constraints vanished; it means we managed the stress. Similarly, just because a climate tipping point hasn't triggered by 2030 doesn't mean the physics are wrong. It means the stress is currently being managed or has not yet hit the critical fracture point.

  ### Conclusion

  Saying Malthus was "right but early" is an intellectual sleight of hand that protects a theory from the evidence of history. It treats time as a delay rather than a transformer of systems. By adopting the framework of **structural dormancy**, we clarify the logic: Malthus identified a real force (resource pressure) but misjudged the structure of the system (assuming rigidity over elasticity).

  This does not save his prediction of inevitable collapse. It buries the forecast but preserves the constraint. For modern forecasters, the lesson is clear: Distinguish between the accumulation of stress and the inevitability of rupture. A sleeping cause is not a promise of future disaster; it is a call to manage the pressure before the dormancy ends. If we confuse the two, we risk either fatalism (waiting for the inevitable Malthusian snap) or complacency (assuming the quiet fault line is safe).
