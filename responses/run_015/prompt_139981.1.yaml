  Here are the three rules that best fit her verdicts, their predictions for next week's case, and my recommendation on how to play the session.

  ### The Three Candidate Rules

  **1. Robust Causal Role Functionalism (RCRF)**
  *   **The Rule:** A mental state is realized if and only if there is an internal state that occupies the specific causal role of that mental state (triggered by appropriate inputs, causing appropriate outputs/internal transitions), provided the system generates these transitions *intrinsically* (no external technicians) and *non-trivially* (no look-up tables).
