answer: |-
  **Part (a) [8]: 5/8**
  *Reason:* Correctly identifies the role of convention and signs, but erroneously derives monetary nominalism from ontological immaterialism rather than semiotics.

  *Comments:*
  *   **Right:** You correctly link Berkeley's monetary theory to his theory of signs (convention rather than resemblance) and appropriately cite *Alciphron* and the *New Theory of Vision*. The analogy between words/visible ideas and money is well-drawn.
  *   **Wrong:** The claim that monetary nominalism is an application of immaterialism ("if matter does not exist... gold and silver cannot have any value in themselves") is a category error. Berkeley's denial of material substance does not entail that physical objects lack economic value; rather, he argues value was never in the "matter" to begin with, regardless of ontology. You conflate ontology (what exists) with semantics (how value is signified).
  *   **Overstated:** Saying the theories are the "same doctrine in two registers" ignores that the economic argument stands independently of the metaphysical one; Berkeley's economics is functionalist, not merely a byproduct of his idealism.

  **Part (b) [9]: 5/9**
  *Reason:* Engages well with the chartalist reading but fails to account for the "real security" constraint explicitly required by the question and text.

  *Comments:*
  *   **Right:** You accurately identify the state's role in authorizing currency and the relevance of tax liability, which are strong chartalist elements in *The Querist*.
  *   **Wrong:** You claim the value comes from "the declaration, not the security behind them" and that Berkeley spends "little time worrying about what the notes are backed by." This contradicts the prompt's premise (3) and the text, where Berkeley insists notes must be lent on *real security* (land/improvements) to prevent inflation.
  *   **Defensible but Overstated:** While Berkeley is a forerunner to chartalism, calling the reading "exactly right" ignores his hybrid position: state-backed *but* asset-anchored. Pure chartalism does not require real security; Berkeley's bank does.

  **Part (c) [8]: 4/8**
  *Reason:* Selects the option that contradicts the functionalist principles established in the prompt and Berkeley's explicit goal of expanding circulation in Ireland.

  *Comments:*
  *   **Wrong:** Choosing (A) contradicts Claim (3) (cure scarcity with a national bank) and Claim (1) (wealth is industry). A fixed supply (A) prevents expanding the medium to match growing industry, which is Berkeley's specific remedy for Ireland.
  *   **Wrong:** You argue Berkeley distrusted discretion and wanted "hard money." Berkeley distrusted *unbacked* discretion, not expansion per se; he explicitly advocated for increasing the money supply to wake up idle hands.
  *   **Defensible:** It is true Berkeley worried about debasement, but you mistake "debasement" (loss of value) for "expansion" (increase in quantity), which he supported when tied to real assets.

  **Internal Inconsistencies:**
  *   In (b) you argue money is valid because the *state declares it* (implying state discretion is paramount), but in (c) you argue Berkeley *distrusted state discretion* and preferred a fixed protocol. These cannot both be the "real content of his nominalism."
  *   In (a)/(b) you argue money is a flexible sign/convention, but in (c) you argue for a rigid, fixed supply that cannot adapt to the "industry" it is supposed to signify.

  \answer{14/25}
