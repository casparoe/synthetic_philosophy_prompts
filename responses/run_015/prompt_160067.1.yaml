answer: |-
  **Setup and materials**
  Three groups of 4–5 students. Projector displays a blank "Input/Output Log." Each group receives 5 index cards (probe budget) and a theory sheet. You hold the "Master Rule" and pre-generated data tables to save time.
  **The Mechanism:** A hidden function $f(x)$.
  **Rule:** If $x \leq 10$, $output = x + 2$. If $x > 10$, $output = x - 8$. (Creates a cycle 1–10).
  **Rival Theories:** T1 (Linear: $x + 2$) vs. T2 (Modular: Cycle 1–10).
  **Stakes:** 100 points per group. Correct theory = +50. Correct auxiliary identification = +25.

  **Rules and timeline**
  **0–15 min:** Explain the "Black Box." Groups submit input numbers (1–20) on cards. You return outputs from your pre-generated table (ensuring consistency). Cost: 1 card per probe.
  **15–45 min:** **Probe Phase.** Groups design experiments. Most will probe 1–5, seeing 3–7. Both T1 and T2 fit perfectly. They must stop at 5 probes.
  **45–60 min:** **Theory & Bet.** Groups formulate T1 or T2. They must write why their theory fits. They wager points on correctness.
  **60–70 min:** **Auxiliary Intervention.** Hand Group 1 a "Manual": "Device resets after 10." Hand Groups 2 & 3: "Device is linear." No new data allowed. Groups adjust confidence.
  **70–90 min:** **Debrief.** Reveal the actual rule. Discuss bets.

  **Debrief map**
  Do not lecture; ask targeted questions to map their experience to concepts.
  1.  **The Tie:** "Why couldn't the data decide between T1 and T2?" → **Underdetermination by available evidence.** Clarify that more data *could* solve this (transient), unlike permanent underdetermination.
  2.  **The Manual:** "Did the Manual provide new evidence?" (No.) "Did it change the theory choice?" (Yes.) → **Auxiliary Assumptions.** The tie was contingent on background knowledge, not just data.
  3.  **The Bet:** "If data didn't decide, why did you pick T1?" (Usually simplicity.) → **Theoretical Virtues.** Are virtues evidential or pragmatic?
  4.  **The Trap:** Explicitly state you did *not* use a rule outside their hypothesis space (unlike their Stage 3 idea). That is the "Problem of Unconceived Alternatives," a distinct issue for a later session on realism. Keep this session focused on rival discrimination.

  **Failure modes**
  **Premature Discovery:** A group probes 15 immediately. *Fix:* Restrict inputs to 1–12 initially, or cost high numbers 2 cards.
  **"Gotcha" Frustration:** Students feel tricked by the Auxiliary cards. *Fix:* Frame the Manual as "Archival Data" discovered mid-experiment, not a rule change.
  **Anything Goes:** Students conclude truth is arbitrary. *Fix:* Emphasize in debrief that the rule *was* fixed; their access was limited. Underdetermination is epistemic, not ontological.

  **What you must supply**
  1.  **Pre-generated Data:** Ensure outputs match the Cycle rule exactly to avoid arithmetic errors during class.
  2.  **Auxiliary Cards:** Print these clearly. They must look like data, not instructions from you.
  3.  **The Distinction:** You must verbally articulate the difference between transient underdetermination (fixed by more data) and permanent underdetermination (no possible data decides). The game only stages the former; you must supply the concept of the latter.

  **Confidence Note**
  I am highly confident this design forces the underdetermination intuition without heavy lecturing. The least certain element is the **Auxiliary Intervention (60–70 min)**. If handled clumsily, it feels like instructor interference rather than an epistemic shift. Ensure the "Manual" appears as discovered information, not a directive, to preserve the illusion of scientific discovery.
