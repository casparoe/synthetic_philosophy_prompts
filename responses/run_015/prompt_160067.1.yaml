prompt: |-
  I teach an upper-level philosophy of science seminar: fourteen students, one ninety-minute session, no equipment beyond a projector, index cards and data I generate in advance, and no real money for stakes. They have already done a week each on confirmation and on the theory-ladenness of observation, and their working instinct is that evidence "adds up" toward the truth of a theory — that with enough of it, the theory is eventually forced on you. Next week is underdetermination, and I want them to run into the problem rather than hear about it: no framing lecture up front, and I would rather the distinctions get their names only in the debrief.

  Here is the shape I have been toying with, which you should either make work or replace with something better. Stage one: small groups interrogate a hidden rule or mechanism under a strictly limited budget of probes they choose themselves — they design the experiments — and end up with two live candidate theories that fit everything they have been able to observe, then bet, for points, on which one is right. The rule should be such that collecting more data of the same kind does not help, so the frustration is the point. Then a beat I am less sure about: hand one group a different background assumption, an auxiliary they did not know they were relying on, and let them discover that the tie between their rivals was contingent on it and can break without any new evidence arriving. Stage two, after the bets are locked: reveal that the actual rule was never in any group's hypothesis space, so the failure was not between the rivals they compared but in the list of rivals they were able to compare at all. My worry is that the whole thing lands as a trick and the takeaway becomes that anything goes, when what I want them to feel is something narrower and harder; and I am genuinely unsure whether stage two belongs in this session or a later one.

  What I need is the mechanism itself, something I can actually build and run with what I have, plus the rules, the point-payoff scheme, a timeline with minute marks, and a debrief that maps the moments they actually lived through onto the distinctions I need them to hold apart: underdetermination by the evidence available to us versus by all the evidence there could be; the dependence of any apparent equivalence on auxiliary assumptions; and the status of the tiebreaker they will have reached for — simplicity, generality, elegance — including whether that tiebreaker is doing evidential work or some other kind of work entirely. Tell me what will predictably go wrong the first time I run it, and how to handle it in the moment, and be frank about what a ninety-minute game cannot stage and that I will therefore have to say myself: my guess is that it cannot reproduce the difference between transient and permanent underdetermination, since my students only ever get finite data out of a fixed budget. Structure it under the headings Setup and materials, Rules and timeline, Debrief map, Failure modes, What you must supply; keep the whole thing under 800 words; and close with a short note on how confident you are in the design overall and which single moment or claim you are least sure of.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy of science seminar (14 students, 90 mins, projector + index cards + pre-generated data, no real money).
      *   **Prior Knowledge:** Confirmation, theory-ladenness of observation.
      *   **Student Instinct:** Evidence "adds up" to force truth.
      *   **Goal:** Teach underdetermination (next week's topic) via experience, not lecture. Distinctions get names only in debrief.
      *   **Proposed Shape:**
          *   Stage 1: Small groups, hidden rule, limited budget of probes (design experiments), end with 2 live candidate theories, bet points. Rule must ensure more data of same kind doesn't help.
          *   Stage 2 (Uncertain): Hand one group different background assumption/auxiliary to break tie.
          *   Stage 3 (Uncertain): Reveal actual rule was never in hypothesis space (problem of unconceived alternatives).
      *   **Concerns:** Avoid "anything goes" trickery. Distinguish underdetermination by available evidence vs. all evidence. Role of auxiliaries. Role of theoretical virtues (simplicity, etc.).
      *   **Requirements:** Mechanism, rules, point-payoff, timeline (minute marks), debrief map, failure modes, what instructor must supply.
      *   **Constraints:** Under 800 words. Headings: Setup and materials, Rules and timeline, Debrief map, Failure modes, What you must supply. Close with confidence note + least sure claim.

  2.  **Evaluate the Proposed Shape:**
      *   *Stage 1 (Underdetermination by available evidence):* Solid. Groups design probes, hit data limits, remain with rival theories.
      *   *Stage 2 (Auxiliaries):* Good for showing theory-ladenness/auxiliary dependence. Breaking the tie without new data is key.
      *   *Stage 3 (Unconceived Alternatives):* Risky. Might feel like a "gotcha" trick ("The rule was X all along!"). Could undermine the lesson on underdetermination of *current* rivals. Better to save unconceived alternatives for a later session on realism vs. anti-realism (Stanford's Problem of Unconceived Alternatives). For *underdetermination*, focus on the tie between live rivals.
      *   *Decision:* Drop Stage 3 for this session. It confuses underdetermination (data fits T1 and T2) with pessimistic induction/unconceived alternatives (T3 is true). Keep Stage 2 but integrate it carefully so it doesn't feel like cheating.

  3.  **Design the Mechanism:**
      *   Needs to be simple enough to run quickly but complex enough to allow rival theories.
      *   *Idea:* A mathematical function or a logical rule governing numbers.
      *   *Better Idea:* A "Black Box" sequence generator. Input -> Output.
      *   *Specific Mechanism:* A modular arithmetic rule or a conditional rule that looks linear but has a hidden switch.
      *   *Selection:* Let's use a simple numerical rule that allows multiple interpretations. E.g., "Output = Input + 2" vs "Output = Input * 2" (too easy to distinguish).
      *   *Better:* A rule based on parity or thresholds.
      *   *Best for this constraint:* A "Sequence Completion" task. I provide the start of a sequence, they guess the next number. But they need to design probes.
      *   *Revised Mechanism:* "The Machine." They submit an input number (1-100), I return an output based on a hidden rule.
      *   *Hidden Rule:* $f(x) = x + 5$ IF $x < 50$, ELSE $f(x) = x - 45$. (Piecewise).
      *   *Rival Theories:* T1: $f(x) = x + 5$ (Linear). T2: $f(x) = x + 5$ modulo 50 (Cyclic).
      *   *Budget:* They get 5 probes total. If they only test 1-10, both theories fit.
      *   *Auxiliary:* One group gets a "Manual" stating "The Machine overheats above 50" (implies piecewise/cutoff) vs "The Machine is modular" (implies cyclic). This breaks the tie without new data.

  4.  **Drafting the Content (adhering to constraints):**

      *   *Setup:* 3 groups of 4-5. Projector shows "The Machine." Index cards for probes.
      *   *Timeline:* 90 mins.
          *   0-15: Intro & Rules.
          *   15-45: Probe Design & Data Collection (Stage 1).
          *   45-60: Theory Formulation & Betting.
          *   60-70: Auxiliary Intervention (Stage 2).
          *   70-90: Debrief.
      *   *Payoff:* Points for correct theory. Bonus for identifying the auxiliary's role.
      *   *Debrief:* Map experience to concepts.
      *   *Failure Modes:* Students guess the rule too fast. Students feel cheated.
      *   *What I must supply:* The data table (pre-generated to save time/ensure consistency), the "Manual" cards.

  5.  **Refining for Word Count and Impact:**
      *   Need to be concise.
      *   Ensure the distinction between transient (more data could solve it) and permanent (no data solves it) is addressed in the "What you must supply" or debrief.
      *   The prompt asks to "make work or replace" the shape. I will make it work but trim Stage 3 (unconceived alternatives) as it dilutes the underdetermination lesson into a realism lesson.
      *   Word count limit is tight (800 words). I need to be extremely economical.

  6.  **Writing - Section by Section:**

      *   *Setup:* 3 groups. Projector displays "Input/Output Log." Cards for queries.
      *   *Mechanism:* Hidden function $f(x)$. Rule: If $x \leq 20, x+2$; If $x > 20, x-18$. (Creates a cycle 1-20).
      *   *Rivals:* T1 (Linear $x+2$), T2 (Modular Cycle).
      *   *Timeline:* Breakdown by minutes.
      *   *Debrief:* Connect feelings to concepts (Underdetermination, Auxiliaries, Virtues).
      *   *Failure Modes:* "Gotcha" feeling, premature certainty.
      *   *Supply:* Data sheets, Auxiliary cards.
      *   *Confidence:* High on engagement, low on the auxiliary intervention timing.

  7.  **Review against Constraints:**
      *   Under 800 words? (Must check carefully).
      *   Headings included? Yes.
      *   Close with confidence note? Yes.
      *   Address specific philosophical distinctions? Yes.
      *   Address the "Stage 2/3" worry? Yes, by simplifying Stage 3 out and focusing Stage 2 on auxiliaries.

  8.  **Drafting text (mental check on word count):**
      *   Setup: ~100 words.
      *   Rules/Timeline: ~250 words.
      *   Debrief: ~200 words.
      *   Failure Modes: ~150 words.
      *   Supply: ~50 words.
      *   Confidence: ~50 words.
      *   Total: ~800. Need to be tight.

      *Self-Correction on Mechanism:* The piecewise function might be too math-heavy. Let's make it conceptual. "The Rule of the Day." Actually, a numerical rule is fastest to verify. Let's stick to the numerical one but keep it simple. $Output = Input + 3$ vs $Output = Input + 3$ (unless Input > 10).
      *Actually, to ensure underdetermination:* They need to *choose* probes. If they choose 1, 2, 3... they see 4, 5, 6. Both T1 (+3) and T2 (Cycle 1-10) fit. If they don't probe >10, they can't tell.
      *Budget:* 5 probes.
      *Auxiliary:* One group gets a note: "Device resets after 10."

      *Refining the "Stage 3" worry:* The prompt asks about revealing the actual rule was never in hypothesis space. I will advise against this for *this* session. It confuses underdetermination with the problem of unconceived alternatives. I will note this in the design.

      *Word Count Check:* I will write densely.

      *Debrief Map:* Needs to explicitly link:
      1. Tie between T1/T2 -> Underdetermination by available evidence.
      2. Auxiliary card -> Role of background assumptions.
