answer: |-
  Here is your Q&A prep sheet. It is designed for the room you are in, not the seminar room you came from.

  ### Early Concessions (First 2 Minutes)
  *Do not wait for them to force these. State them in your closing remarks or immediately upon opening the floor.*

  1.  **Concede Feasibility:** "I am not proposing this as a clinical protocol for next Tuesday. I am using the *possibility* of the tech to stress-test our current definitions of personhood, which we are already using in DBS and hemispherectomy."
  2.  **Concede Biological Complexity:** "When I say 'functional substitute,' I am not talking about a silicon logic gate replacing a cell. I mean a unit that interfaces with the neurochemical environment—glia, volume transmission, and all. If it doesn't handle the chemistry, it doesn't count as a substitute."
  3.  **Concede Risk:** "If this procedure carried a risk of 'death' or 'loss of self,' the IRB would never approve it. My argument is specifically about whether that risk *exists*, not whether we should take it."

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The Surgeon: "If tissue doesn't matter, why gradual?"
  **The Objection:** "I've removed half a brain in a 6-year-old. They wake up, they rehab, they're the same kid. You're arguing for swapping neurons one by one to preserve identity. But my data shows identity survives *instant* loss of massive tissue. If the 'self' survives a hemispherectomy, why does it need a gradual swap? Your 'Diagonal Replacement' seems like engineering caution, not metaphysics."
  **The Reply (90s):** "You're right that the *self* survives loss, but it survives via *plasticity*, not substitution. In a hemispherectomy, the remaining tissue takes on new roles. In my scenario, we are preventing the remaining tissue from *having* to change roles. The gradualness isn't to save the 'soul'; it's to prevent functional collapse of the network while we swap the hardware. Think of it like changing the engines on a 747. You can lose a wing and the plane might fly (plasticity), but if you want to swap the engines mid-flight without the plane noticing a dip in thrust, you do it gradually. My claim is about preserving *function* without demanding *reorganization*."
  **Soft Spot:** You are conflating "surviving trauma" with "continuous identity." The Surgeon might press that if the kid survives instant loss, the "gradual" requirement is medically unnecessary, making your metaphysical point irrelevant.

  #### 2. The Systems Neuroscientist: "Define 'Functional Role'"
  **The Objection:** "You keep saying 'preserve local functional role.' That is a black box. Are we matching spike timing? LFP coherence? Receptor density? If I swap a neuron for something that matches the firing rate but misses the neuromodulatory volume transmission, the network dynamics change. If you can't specify the physical variables, 'functional equivalence' is just magic."
  **The Reply (90s):** "I agree 'functional role' is too vague for engineering, but it's precise enough for ethics. We don't need to know the full neural code to know when a patient is behaving normally. If the input-output behavior is preserved, and the internal state markers (like sleep cycles, memory recall) remain stable, the 'role' is filled. I'm not asking you to build the device today. I'm asking: if you *could* match the variables you care about—spikes, chemistry, timing—would there be a moment the light goes out? My argument is that without a specific moment of failure, the objection fails."
  **Soft Spot:** You are dodging the mechanism. If the "substitute" can't actually do the chemistry (which silicon can't), the premise is physically impossible, and the ethics don't apply.

  #### 3. The Biological Naturalist: "Causal Powers"
  **The Objection:** "You're treating the brain like a computer where substrate doesn't matter. But neurons have causal powers in virtue of their biology. A simulation of a rainstorm doesn't make you wet. A simulation of a neuron doesn't have the causal powers to generate consciousness. You can't compute your way out of biology."
  **The Reply (90s):** "I'm not claiming substrate doesn't matter. I'm claiming that if the *causal effects* are identical, the substrate is irrelevant to the *subject*. If the substitute neuron releases the same neurotransmitters, triggers the same downstream spikes, and reacts to the same hormones, it is exercising the same causal powers. The 'wetness' of the rainstorm is a physical property, but consciousness is a *functional state* of the system. If the system behaves as if it's conscious, and reports being conscious, on what grounds do we say it isn't, other than 'it's made of the wrong stuff'?"
  **Soft Spot:** She will not accept that consciousness is a functional state. You are talking past each other. You cannot win this; you can only show her view leads to skepticism about other humans.

  #### 4. The IRB Chair: "Who Consents?"
  **The Objection:** "Let's say you do this over 10 nights. On night one, Patient A consents. On night ten, the brain is mostly synthetic. Is the entity waking up on day 11 the legal person who signed the form? If they sue for battery, who is the plaintiff? If they die, who inherits?"
  **The Reply (90s):** "This is why the 'Sleep Gap' matters. We already allow people to make advance directives for situations where their capacity changes or they are unconscious (like DNR orders). We treat the person waking up after anesthesia as the same legal agent who went under. My procedure just extends that window. As long as there is psychological continuity—memory, personality, narrative—the law tracks the person, not the tissue. The 'plaintiff' is the same psychological entity, even if the biological substrate has shifted."
  **Soft Spot:** Legal personhood is binary; your metaphysics is gradual. If there's *no fact of the matter* about identity (as you claim), the law cannot function.

  #### 5. The Residents: "Why Are We Talking About This?"
  **The Objection:** "This sounds like sci-fi. We deal with stroke, trauma, tumors. We don't have neural lace. Why should we care about a thought experiment that can't happen in our lifetime?"
  **The Reply (90s):** "Because you already have the pieces. Deep Brain Stimulation modifies neural activity. Hemispherectomy removes it. BCIs read it. The 'gradual replacement' isn't a single device; it's the trajectory of where neurotech is going. If we wait until the tech is ready to ask 'does this kill the patient?', we've already failed. You need the ethical framework now so you aren't forced to make these calls without one when the FDA asks."
  **Soft Spot:** It *is* speculative. If they feel you're wasting their time with fantasy, you lose the room's respect.

  #### 6. The Neuroscientist (Follow-up): "Glial Interaction"
  **The Objection:** "You mentioned chemistry, but did you mean glia? Astrocytes regulate blood flow and synaptic transmission. If your substitute doesn't talk to the glia, the tissue dies around it. Are you replacing the glia too?"
  **The Reply (90s):** "Yes. If the unit of replacement is 'functional tissue,' it includes the support structure. If the substitute triggers an immune response or starves the neighbors, it's not a functional substitute; it's a lesion. My argument assumes a successful integration. If the integration fails, the patient gets sick, and we stop. The ethical question is about the *successful* case."
  **Soft Spot:** This pushes the engineering burden so high it might become impossible. You are assuming away the hardest biological problems.

  #### 7. The Surgeon (Follow-up): "Pathology"
  **The Objection:** "What if the substitute tissue degrades differently? Biological tissue gets sick. Synthetic tissue wears out. Now you have a chimera brain with two failure modes. That's a clinical nightmare."
  **The Reply (90s):** "Absolutely. That's a safety objection, not an identity objection. My talk is about whether the *person* survives, not whether the procedure is safe. We can agree it's dangerous and still agree that if it works, the person is still there. Don't let the risk of the car crash convince you the driver doesn't survive the drive."
  **Soft Spot:** Clinicians hate separating "safety" from "identity." To them, a dangerous procedure *threatens* the person.

  #### 8. The Philosopher: "Sleep is Not a Gap"
  **The Objection:** "Sleep isn't a cessation of consciousness like a switch off. It's a regulated state with specific restorative functions. Anesthesia is different. You can't equate 'natural sleep' with 'surgical unconsciousness' to license the swap."
  **The Reply (90s):** "Subjectively, they are identical. I close my eyes, I open them, time has passed. If the objection to replacement is 'you can't interrupt the stream of consciousness,' then sleep already interrupts it. If the objection is 'you need biological restoration,' then we ensure the substitute supports that restoration. The point isn't that sleep is magic; it's that we already accept discontinuity in experience as compatible with survival."
  **Soft Spot:** Sleep has specific neural architecture (glymphatic clearance, etc.) that general anesthesia might not replicate. If the swap prevents cleaning, the brain rots.

  ---

  ### The One Reply That Has to Land
  **Target:** The Systems Neuroscientist (Objection #2).
  **Why:** If "functional equivalence" is meaningless, your whole thesis is magic.
  **The Line:** "I am not asking you to define the *code*. I am asking you to acknowledge that if the *behavior* and *reporting* of the system remain stable across the swap, the burden of proof shifts to you to locate the loss. If the patient walks, talks, and remembers the same way, 'loss of consciousness' is a claim without evidence."

  ---

  ### The Weakest Point (Your "Sleep Gap" Worry)
  **Your Fear:** If sleep licenses replacement, why not do it all in one night under anesthesia? If the answer is "you can," then "gradualness" is doing no work, and your "Diagonal Replacement" argument collapses.
  **The Verdict:** You are right to worry. This is the reductio ad absurdum of your position.
  **The Least-Bad Answer:** Distinguish **Phenomenal Continuity** from **Functional Stability**.
  *   *Say this:* "Sleep licenses the *interruption* of experience, but it does not license the *instant restructuring* of the network. If you swap 100% of the tissue in one night, even under anesthesia, you risk functional collapse—the system might not boot up. Gradualness isn't about what the *subject feels*; it's about what the *system can tolerate*. Sleep handles the subjective gap; gradualness handles the engineering load."
  *   *Why it's weak:* It admits the metaphysics (identity) relies on the engineering (stability). If the engineering gets solved, your metaphysical distinction vanishes.

  ---

  ### The Question You Hope Nobody Asks
  **The Question:** "Would you volunteer for this procedure yourself, right now, if we had the tech?"
  **Why it's dangerous:**
  *   If you say **Yes**: You look reckless. The clinicians will think you don't understand the risk.
  *   If you say **No**: You look like you don't believe your own thesis. If the person survives, why not you?
  **The Pivot:** "I would not volunteer, because the risk of *engineering failure* is too high. I believe the *person* would survive, but I don't trust the *device* yet. I'm arguing about the survival of the self, not the reliability of the hardware."
