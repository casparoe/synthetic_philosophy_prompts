  Here is the breakdown of your friend's logic, the prediction on the vineyard case, and the test to prove which rule she's actually using.

  ### The Prediction
  She is going to call the communal vineyard setup **unnatural (*chrematistike*)**.

  Even though the clay discs don't earn interest and can't be sold outside, the key factor for her will be the **unlimited accumulation**. She already flagged "stacking up gold coins" as the bad kind in her second verdict. In the vineyard case, people are accumulating discs "way more than they could drink in years." To an Aristotelian, wealth is only natural when it serves a purpose (like eating, drinking, or maintaining the household). Once you accumulate past the point of use, the wealth stops being a tool for living and becomes an end in itself. That shift in purpose makes it *chrematistike*, regardless of whether the token earns interest.

  ### The Two Competing Rules
  Both of the following rules explain her first four verdicts perfectly, but they diverge on the vineyard case.

  **Rule 1: The Teleological Limit (Purpose-Based)**
  *   **The Principle:** Exchange is natural only if it is bounded by the needs of the household or community. Acquisition becomes unnatural when it seeks unlimited accumulation rather than satisfied need.
  *   **Why it fits the first four cases:**
      *   *Wheat for Shoes:* Satisfies a need. (Pass)
      *   *Arbitrage:* Aims at unlimited gold stacking, not need. (Fail)
      *   *Shoemaker:* Silver is used immediately for needs (food/leather). (Pass)
      *   *Interest:* Aims at infinite growth of money itself, detached from need. (Fail)
  *   **Verdict on Vineyard:** **Fail.** The accumulation exceeds the need for wine.

  **Rule 2: The Sterile Medium (Instrument-Based)**
  *   **The Principle:** Exchange is natural only if money (or tokens) remains a passive tool for measuring value or facilitating trade. It becomes unnatural if the money is treated as a living thing that can "breed" (interest) or if trade is conducted solely to increase the money supply.
  *   **Why it fits the first four cases:**
      *   *Wheat for Shoes:* No money involved, just direct use. (Pass)
      *   *Arbitrage:* Trading specifically to increase the money stack. (Fail)
      *   *Shoemaker:* Silver is used as a passive medium, not held for growth. (Pass)
      *   *Interest:* Money is made to "breed" more money. (Fail)
  *   **Verdict on Vineyard:** **Pass.** The discs are sterile (no interest) and act only as receipts for labor. The hoarding itself isn't a mechanistic violation.

  ### Which Rule Is She Running?
  I'd bet she is running **Rule 1 (The Teleological Limit)**.

  Here is why: In her second verdict about arbitrage, she didn't just condemn the trading mechanism; she specifically pointed out the goal was to "stack up gold coins." If she were purely focused on the mechanism (Rule 2), she might have focused only on the buying cheap/selling dear aspect. But by highlighting the *stacking*, she signaled that the *volume relative to need* is what triggers her moral alarm.

  Furthermore, her condemnation of interest ("money shouldn't make money") is often interpreted in Aristotelian terms not just as a mechanical error, but as a teleological one: it assumes money has a biological function it doesn't possess, divorcing acquisition from the real economy of goods and needs. Since she seems sensitive to the *purpose* of the acquisition in the arbitrage case, she will likely view the vineyard hoarders as treating the discs as ends in themselves, which violates the natural limit.

  ### The Tie-Breaker Case
  To definitively prove which rule she is using, you need a scenario where the **mechanism is sterile** (satisfies Rule 2) but the **purpose is unlimited** (violates Rule 1).

  **The Case of the Miser's Chest:**
  Imagine a farmer who sells his surplus grain for silver coins. He puts the coins in a locked chest in his basement. He never lends them out (no interest), he never trades them to buy low and sell high, and he never spends them on luxuries. He just adds to the pile every year until he dies, leaving a massive heap of unused silver to his heirs.

  *   **If she says this is Natural:** She is running **Rule 2 (Sterile Medium)**. The money didn't breed, and he didn't trade for profit. The hoarding doesn't matter.
  *   **If she says this is Unnatural:** She is running **Rule 1 (Teleological Limit)**. The silver is being accumulated without any reference to need or use. It is wealth for wealth's sake, which is the definition of *chrematistike*.

  Given her previous comments, she should call the Miser's Chest unnatural. If she hesitates there, you'll know the mechanism (Rule 2) is actually weighing heavier on her mind than the purpose.
