          *   The "Hidden Problem": Moral learning via ranking might optimize for *appearing* virtuous in comparison rather than *being* virtuous in context (Goodhart's Law).
      *   **Addressing the Opposition (The "Losing Side"):**
          *   If recommending approval, the opposition is the "Rejectionists" (flattening complexity).
