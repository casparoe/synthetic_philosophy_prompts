answer: |-
  Hey, I was thinking about what you said at dinner the other night regarding leave and daycare, and I want to write this out properly because I think you hit on something really important that gets missed in the usual noise. You are right to feel annoyed because the debate is usually framed as if we are just helping people do what they already want to do, but your point about the ratchet effect changes the whole moral landscape. The argument you are making is that when the state decides to heavily subsidize dual-earner families through cheap daycare and policies that encourage a quick return to work, it is not just removing barriers, it is actively rebuilding the economy around the assumption that both parents will work. Once that happens, the cost of housing, the price of goods, and even the expectations of employers adjust to that two-income baseline. A family looking at that landscape today cannot simply choose to have one parent home because the math no longer works, not because they lack the desire, but because the policy itself helped inflate the cost of living to absorb that second income. So when policymakers point to high labor participation rates as proof that everyone wants to work, they are ignoring that they spent years removing the viability of the alternative. You are calling this channeling rather than enabling, and that is a crucial distinction. Enabling means making a path easier to walk, while channeling means fencing off the other paths so everyone ends up on the same one. If the goal of family policy is actually freedom, then spending public money to make one lifestyle cheap while letting the other become economically impossible is a failure, even if it looks like success on a spreadsheet.

  Now, I know the immediate pushback on this, and you brought it up yourself, which is why I think your position holds water. The obvious objection is that this sounds like a dressed-up version of the old male breadwinner model, and that talking about choice often ends up meaning women are subtly pressured to stay home while men keep working. Historically, that is exactly what happened, and any policy that makes staying home easier risks reversing decades of progress in women's economic independence. If you make it financially viable to stay home, employers might assume women will do it and stop investing in their careers, or partners might quietly expect it, turning a theoretical option into a social expectation. This is a serious risk, and you cannot just wave it away by saying people should be free to choose. To avoid this, the policy design has to be rigorously neutral, meaning it must support the child regardless of the parents' employment status. Instead of subsidizing daycare slots specifically, which only helps those who work, the state should provide a universal per-child benefit that goes to the family no matter what. If that money is enough to cover the cost of care if you choose to buy it, but also enough to support the household if you choose to provide the care yourself, then the financial penalty for staying home disappears. Right now, the system often punishes staying home by withholding support, which forces work. If the support is attached to the child rather than the job, the financial push is removed.

  Beyond the money, the rules around leave and work hours need to be designed so that taking time off does not become a career death sentence. Current leave policies often act as a cliff where you take your months and then must return to full-time work or lose your footing. A system that protects real choice would allow for a gradual return, guaranteeing the right to return to part-time work with pro-rated benefits and seniority for a set period. This protects the parent who wants to stay connected to the workforce without committing to full-time hours immediately. It also needs to be structured so that it is equally accessible to fathers. If leave is labeled as maternity leave, it reinforces the idea that care is women's work. If it is parental leave that is use-it-or-lose-it for both partners, it normalizes men taking time off too, which reduces the stigma for women and prevents employers from viewing women as the risky hire. The key is that the policy must not make staying home the default, but it must not make it the punished option either.

  So how do you tell the difference between someone freely taking the option and someone being pushed? You look at the penalty structure. In the current system, the penalty for staying home is financial ruin or career oblivion, so anyone who stays home is often making a sacrifice. In a neutral system, the penalty should be zero. If a woman stays home because she prefers it, and her partner stays home because he prefers it, and both face the same long-term career security and financial standing as someone who worked through, then the choice is revealed preference rather than coercion. You would know the policy is working if you see a mix of choices across genders and income levels, rather than a uniform trend. If you see that men are taking leave at similar rates to women, or that high-earning women are staying home at similar rates to low-earning women, you know the decision is about preference rather than economic pressure or gender norms. The goal is not to get everyone home, and it is not to get everyone to work, but to ensure that the economic structure does not dictate the answer before the family even gets to ask the question.

  Ultimately, your argument is about preserving the capacity for a family to decide what matters most to them without the state having already decided for them through economic engineering. We accept that people have different values about work and home life, yet our policies assume a single model is best for everyone. By locking the economy into a dual-earner structure, we are effectively telling parents that their time with their children is less valuable than their time in the workforce, unless they can pay a premium they often cannot afford. Making the one-parent-home option genuinely livable again does not mean forcing women out of the workforce, it means ensuring that the workforce does not become the only place a family can survive. If we fix the incentives so that the money follows the child and the career risks are managed for both parents, then we can stop arguing about whether policy is pushing people one way or the other and start trusting families to make the call themselves. That seems like a much more honest definition of support than just subsidizing the status quo and calling it freedom.
