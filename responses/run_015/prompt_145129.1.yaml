  # JOINT STATEMENT ON DEMOCRATIC BOUNDARIES AND THE TRANSBOUNDARY AQUIFER AUTHORITY

  **Signatories:** The Subjectionist Camp and The Stakeholderist Camp
  **Date:** October 26, 2023
  **Subject:** Findings from Adversarial Collaboration regarding the Democratic Legitimacy of the Transboundary Aquifer Authority (TAA)

  ## I. AGREED CLAIMS

  Following a structured dialogue regarding the normative foundations of democratic boundary-drawing, we endorse the following descriptive and conceptual claims. These claims establish the shared factual and theoretical terrain upon which our residual disagreements rest.

  1.  **Legitimacy Requirement:** A collective decision-making body exercising significant power over human life requires a principle of democratic legitimacy to justify why specific individuals are included in the decision-making process (the *demos*) while others are excluded.
  2.  **Conceptual Distinction:** There is a analytically distinct difference between (a) being subject to the direct, binding coercive authority of a body (enforceable legal mandates backed by sanctions) and (b) having one's fundamental interests causally and foreseeably affected by the decisions of a body (changes in welfare, environment, or opportunity).
  3.  **TAA Coercive Reach:** The Transboundary Aquifer Authority (TAA) exercises direct coercive authority over citizens of the three member states through enforceable extraction quotas, compliance monitoring, and legal penalties for violation.
  4.  **TAA Causal Reach:** The TAA's allocation rules causally determine the economic viability of non-citizen agricultural laborers within the basin, alter the ecological security of downstream communities in non-member states, and constrain the resource availability for generations not yet born.
  5.  **Current Exclusion:** Under the current TAA charter, voting membership and formal standing are restricted to representatives of the three member states; non-citizen laborers, downstream non-members, and future generations possess no formal mechanism to veto or directly author rules.
  6.  **Risk of Arbitrariness:** Both camps agree that excluding individuals from the *demos* creates a risk of arbitrary power: either the risk of being ruled without consent (Subjectionist concern) or the risk of having vital interests ignored (Stakeholderist concern).
  7.  **Institutional Constraint:** Any boundary principle adopted must be translatable into institutional design features, such as voter eligibility rolls, representation quotas, or standing rules, though the camps disagree on how determinate these features must be.

  ## II. RESIDUAL DISAGREEMENTS

  While we agree on the facts of the case and the definitions of key terms, we disagree on which principle should govern the boundary of the *demos*. The following table articulates these disagreements in the precise terminology each camp accepts.

  | Topic | Column A: Subjectionist Formulation | Column B: Stakeholderist Formulation |
  | :--- | :--- | :--- |
  | **1. Extraterritorial Economic Impact** | Economic dependency created by the TAA does not constitute political subjection unless the Authority holds direct legal enforcement power over the laborer's person or property; without reciprocal legal obligation, there is no duty of inclusion. | Severe economic dependency caused by the TAA constitutes a vital stake in the outcome; because the Authority's decisions foreseeably determine the laborer's livelihood, exclusion amounts to governance without regard for affected interests. |
  | **2. Future Persons** | Future generations cannot be subjects of authority because they cannot reciprocate obligations, comply with laws, or participate in deliberation; present actors must act as trustees, not co-legislators with the unborn. | Future generations hold fundamental interests that are causally locked in by present decisions; because the TAA's allocation foreseeably alters their survival conditions, their interests demand representation equivalent to present stakeholders. |
  | **3. Determinacy of Membership** | A legitimate boundary principle must yield a crisp, binary list of members for every decision; if a principle cannot identify exactly who votes, it fails to guide institutional design and invites administrative arbitrariness. | A legitimate boundary principle must track the intensity of affectedness; if a principle requires fluid or weighted membership to reflect varying degrees of impact, institutions must adapt rather than imposing artificial binary borders. |
  | **4. Source of Obligation** | The obligation to include an individual arises from the structural relationship of authority and subordination; democracy is the justification of coercion through reciprocal authorship. | The obligation to include an individual arises from the moral imperative to prevent harm and respect autonomy; democracy is the protection of interests from external imposition. |

  ## III. THE CRUXES

  We have identified three sub-questions where empirical clarification or conceptual resolution could shift the weight of argument for one or both sides. For each crux, we specify a concrete feature of the TAA case that bears on the question, and we record each side's predictive judgment regarding what that feature demonstrates.

  ### Crux 1: The Functional Equivalence of Economic Enforcement
  *   **Sub-Question:** Does the TAA's enforcement mechanism rely on the compliance of non-citizen laborers to such a degree that they function as subjects, even if legal liability rests with landowners?
  *   **Concrete Feature:** Whether non-citizen laborers possess direct legal standing to challenge TAA rulings in tribunal, and whether TAA fines are levied against the individual pump-operator or the corporate license-holder.
  *   **Subjectionist Predictive Judgment:** If fines are levied only against corporate license-holders and laborers lack standing, this demonstrates that laborers are objects of policy, not subjects of law; inclusion would conflate economic impact with political agency.
  *   **Stakeholderist Predictive Judgment:** If laborers lack standing despite bearing the brunt of compliance (e.g., job loss due to quotas), this demonstrates a "governance gap" where power is exercised without accountability; inclusion is required to close the gap regardless of legal technicalities.

  ### Crux 2: The Representability of Future Interests
  *   **Sub-Question:** Can an institution weight future interests without granting membership, or does weighting implicitly acknowledge stakeholder status?
  *   **Concrete Feature:** Whether the TAA's allocation algorithm explicitly weights projected scarcity in 2100 as a binding constraint on current extraction, or treats it as a discretionary discount rate.
  *   **Subjectionist Predictive Judgment:** If the algorithm treats future scarcity as a binding constraint, this demonstrates prudent trusteeship by current members; it confirms that present subjects can legitimately decide for the future without sharing the *demos*.
  *   **Stakeholderist Predictive Judgment:** If the algorithm treats future scarcity as a binding constraint, this demonstrates that future interests are already structurally embedded; excluding them from the *demos* renders the weighting arbitrary and unaccountable to those whose interests are weighed.

  ### Crux 3: The Feasibility of Fluid Boundaries
  *   **Sub-Question:** Is a fixed voter roll a necessary condition for democratic agency, or can agency be exercised through graduated representation?
  *   **Concrete Feature:** Whether the TAA charter allows for weighted voting rights based on "volume of water dependency" versus "one-state, one-vote."
  *   **Subjectionist Predictive Judgment:** If voting is weighted by dependency, this demonstrates a shift from democratic equality to technocratic management; it confirms that only a fixed, equal membership (the member states) can sustain legitimate collective self-rule.
  *   **Stakeholderist Predictive Judgment:** If voting is weighted by dependency, this demonstrates that democratic equality is compatible with proportional affectedness; it confirms that a fixed boundary obscures the reality of differential power and impact.
