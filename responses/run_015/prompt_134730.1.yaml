prompt: |-
  I have been asked, together with two colleagues in economics, to design the call for a three-year research programme on moral trade. The budget is four postdoctoral positions, and the remit from the funder is unusually concrete: they want the programme to end with results that would change how large philanthropic funders, and perhaps eventually states, allocate resources in the presence of deep moral disagreement. My colleagues want a call organised around application areas. I think that is premature, because I do not think we yet know which of the open questions in this area are load-bearing and which are decoration.

  Let me fix the object. By moral trade I mean the arrangement in which parties who disagree about what matters morally each perform the action the other's view ranks highly in exchange for the reverse: I fund the intervention your consequentialism prizes, you fund the thing my traditionalism or perfectionism or nationalism prizes, and each of us expects, by our own lights, to have done better than we could have done acting separately. Assume for this exercise that the parties are sincere, that their moral views are stable rather than up for revision, and that they are not trading under ordinary empirical ignorance about consequences. I want the conceptual questions, not the measurement ones.

  The questions I can currently see on the table are these. Enforcement and credible commitment: how parties bind themselves when there is no external enforcer, and what the difference is between a moral trade and a mere assurance game. The unit of account: what exactly changes hands, and whether the currency of trade can be specified without presupposing a common standard that the parties by hypothesis reject. Adverse selection: agents holding the most permissive or most aggregative views can offer the most in any bilateral trade, so a mature market may be dominated by precisely the theories the trading parties least want to empower; call this Gresham's law of moral trade. Endogeneity: if trade is available and widespread, each party's effective normative position drifts toward whatever view is most willing to trade, which in practice means toward something consequentialism-shaped, and it is unclear whether that convergence is a defect of the institution or its point. Trade with parties who cannot or will not recognise themselves as trading: future people, nonhuman animals, agents whose commitments are structured as protected or sacred values that resist being placed on any common metric, and agents whose views we represent only by model or simulation. Aggregative effects: many bilateral trades, each rational by each trader's own lights, may leave every trader worse off by those same lights, a market-level analogue of a prisoner's dilemma. And finally the relation between moral trade and the other things we already do under moral disagreement: moral hedging, bargaining toward a shared second-order theory, legislative compromise, vote trading, and the accommodation and deference that pluralist societies already practise.

  What I want from you is a defended ordering of the call, not a survey and not a reading list; I can find the literature myself. Be explicit about the criteria you are using, how much weight each carries, and where they conflict: importance to the funder's goal of changing institutional allocation, tractability in three years for people trained in philosophy with some decision theory, neglectedness, and how much of the rest of the agenda depends on the answer to this question rather than the reverse. Tell me which of the questions above are genuinely upstream, which are downstream and can wait, and which are pseudo-questions or would not change anything downstream even if settled. Tell me also which of them are really questions for moral philosophy rather than for institutional design or game theory, since I will have to defend the programme's share of the money to my economist colleagues. If there is a question I have not listed that matters more than any I have, say so and say why.

  My own hunch, offered as a hypothesis you should feel free to attack, is that the unit-of-account question is upstream of everything else, including enforcement: until we can say what is being traded and in what it is denominated, the rest of the agenda has no clear object, and the enforcement literature is tacitly assuming an answer. My second hunch is that the endogeneity question is the one with the most surprising implications for how institutions should behave, and the one most likely to be resisted by people attracted to moral trade in the first place. Argue me up or down on both.

  Finally, tell me what would change the ranking. If over the next three years one of these questions were answered, or shown to be unanswerable, or dissolved by a distinction, which others would move, and in which direction? What would you put in the call as the intended falsification test for the wager that this programme is worth funding at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Task:** Design a defended ordering for a research call on "moral trade" (3-year programme, 4 postdocs).
      *   **Context:** Collaboration with two economists. Funder wants concrete results changing how philanthropists/states allocate resources under deep moral disagreement.
      *   **Definition of Moral Trade:** Parties with disagreeing moral views exchange actions (I fund X you value, you fund Y I value) to mutual benefit *by their own lights*. Sincere, stable views, no ordinary empirical ignorance.
      *   **Constraint:** Focus on *conceptual* questions, not measurement/empirical ones.
      *   **Input Questions:** Enforcement/Commitment, Unit of Account, Adverse Selection (Gresham's Law), Endogeneity (Normative Drift), Trade with Non-Standard Agents (future/animals/sacred), Aggregative Effects (Market-level PD), Relation to Existing Practices (hedging/compromise).
      *   **User's Hunches:**
          1.  Unit of Account is upstream of everything (including enforcement).
          2.  Endogeneity has the most surprising/resisted implications for institutions.
      *   **Requirements:**
          *   Defended ordering (not a survey).
          *   Explicit criteria & weights (Importance to Funder, Tractability, Neglectedness, Upstream/Downstream dependency).
          *   Identify Upstream vs. Downstream vs. Pseudo-questions.
          *   Distinguish Moral Philosophy vs. Institutional Design/Game Theory (for economist colleagues).
          *   Identify missing questions.
          *   Argue for/against User's Hunches.
          *   Dynamic Analysis: What changes the ranking?
          *   Falsification Test for the programme.

  2.  **Evaluate the Criteria:**

      *   *Importance to Funder (40%):* The funder wants *allocation changes*. Questions must lead to actionable institutional design or policy advice. Pure metaphysics is out.
      *   *Upstream/Dependency (30%):* If Question A must be answered to make sense of Question B, A is higher priority.
      *   *Tractability (20%):* 3 years, 4 postdocs (Philosophy + Decision Theory). Can't solve everything. Needs clear deliverables.
      *   *Neglectedness (10%):* Less critical given the specific remit, but ensures novelty.

  3.  **Analyze the Input Questions:**

      *   *Unit of Account:* What is traded? "Moral value"? "Expected utility"? If parties reject a common metric, how is the exchange rate set? *Verdict:* Highly Upstream. If undefined, "trade" is metaphorical.
      *   *Enforcement/Commitment:* How to bind without external enforcer? *Verdict:* Downstream of Unit of Account (can't enforce what you can't define). Crucial for implementation.
      *   *Adverse Selection (Gresham's Law):* Permissive views dominate. *Verdict:* Institutional Design/Econ. Important for stability.
      *   *Endogeneity (Normative Drift):* Trading changes the moral views themselves (toward consequentialism). *Verdict:* Deeply Philosophical + Institutional. High impact on Funder's goal (if trading corrupts the moral landscape, is it good?).
      *   *Non-Standard Agents:* Future/Animals/Sacred. *Verdict:* Important for scope, but perhaps secondary to the core mechanism working first.
      *   *Aggregative Effects:* Bilateral rationality vs. Collective irrationality. *Verdict:* Game Theory/Econ. Crucial for scaling.
      *   *Relation to Existing Practices:* Hedging, Compromise, etc. *Verdict:* Contextual/Downstream. Helps position the innovation.

  4.  **Develop the Ordering (The "Defended Ordering"):**

      *   *Priority 1: The Unit of Account (The "Currency" Problem).*
          *   Why: You can't trade without a medium of exchange. If moral values are incommensurable, trade is impossible or requires a meta-theory.
          *   Critique of User's Hunch: I agree it's upstream, but it might be a "dissolution" target. Maybe the answer is "there is no unit, only pairwise exchange rates."
      *   *Priority 2: Endogeneity (The "Corruption" Problem).*
          *   Why: If the mechanism changes the moral views, the long-term allocation impact is fundamentally altered. This addresses the "deep moral disagreement" remit directly.
          *   Critique of User's Hunch: Strong agreement. This is the most philosophically rich and institutionally dangerous aspect.
      *   *Priority 3: Aggregative Effects & Adverse Selection (The "Market Failure" Problems).*
          *   Why: Once we know *what* is traded and *how it affects views*, we need to know if the market crashes or creates bad equilibria.
          *   Note: Group these as "Structural Stability."
      *   *Priority 4: Enforcement/Commitment.*
          *   Why: Essential for implementation, but relies on 1 & 2.
      *   *Priority 5: Non-Standard Agents & Existing Practices.*
          *   Why: Extensions and Context.

  5.  **Address the "Philosophy vs. Econ" Split:**

      *   Economists will care about Enforcement, Aggregative Effects, Adverse Selection (Mechanism Design).
      *   Philosophers must claim Unit of Account and Endogeneity (Normative Metaphysics/Ethics).
      *   *Strategy:* Frame Unit of Account as "Preference Aggregation without a Common Utility Function" (Econ-friendly) but rooted in "Incommensurability" (Phil). Frame Endogeneity as "Dynamic Preferences" (Econ) but rooted in "Moral Integrity/Adaptation" (Phil).

  6.  **Critique the User's Hunches:**

      *   *Hunch 1 (Unit of Account is Upstream):* **Support with nuance.** It is logically upstream, *but* if the answer is "there is no unit, only bilateral exchange rates," then enforcement becomes the bottleneck. Don't let it become a metaphysical black hole.
      *   *Hunch 2 (Endogeneity is Most Surprising/Resisted):* **Strong Support.** Proponents of moral trade (e.g., effective altruists) often assume static preferences. If trading makes everyone consequentialists, does that defeat the pluralist goal? This is the "killer app" question.

  7.  **Identify Missing Questions:**

      *   *The "Exit Condition" / Termination:* When does moral trade become morally *forbidden*? (Complicity). If I trade with a racist to fund malaria nets, am I complicit in their racism? This is distinct from Endogeneity. It's about *moral taint*.
      *   *Information Asymmetry regarding Moral Types:* Not just empirical ignorance, but ignorance about *which* moral theory the other holds (signaling).

  8.  **Dynamic Analysis (What changes the ranking?):**

      *   If Unit of Account is solved (e.g., "Pareto improvements relative to status quo"), Enforcement jumps to #1.
      *   If Endogeneity is shown to be negligible, Aggregative Effects jump up.
      *   If Complicity is shown to be a hard stop, the whole programme might need pivoting to "Moral Segregation."

  9.  **Falsification Test:**

      *   What would prove this programme wasn't worth funding?
      *   Test: If it turns out moral trade is *only* possible between agents with nearly identical moral views (high overlap), then it fails the "deep disagreement" remit.

  10. **Drafting the Response:**

      *   *Tone:* Academic, rigorous, direct, respectful of the economist colleagues but firm on the philosophical necessity.
      *   *Structure:*
          1.  Criteria & Weights.
          2.  The Ordering (1-5).
          3.  Philosophy vs. Econ Defense.
          4.  Critique of Hunches.
          5.  Missing Question.
          6.  Dynamic Shifts.
          7.  Falsification Test.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Unit of Account is first." I need to explain *why* it's the bottleneck for the *Funder's goal*. If we can't define the trade, we can't advise funders on how to allocate.
      *Refinement on Endogeneity:* Make sure to distinguish between "preference change" (Econ) and "moral corruption/adaptation" (Phil).
      *Refinement on Economists:* Acknowledge that Enforcement looks like the most "Econ" topic, but argue that without the Phil work on Unit/Endogeneity, the Econ work is modeling a phantom object.

  11. **Final Review against Constraints:**
      *   Defended ordering? Yes.
      *   Explicit criteria/weights? Yes.
      *   Upstream/Downstream/Pseudo? Yes.
      *   Phil vs Econ? Yes.
      *   Missing question? Yes (Complicity/Taint).
      *   Argue hunches? Yes.
      *   Dynamic shifts? Yes.
      *   Falsification test? Yes.

