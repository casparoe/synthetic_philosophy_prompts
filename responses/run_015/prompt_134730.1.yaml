answer: |-
  Here is a defended ordering for the research call, structured to satisfy the funder's demand for institutional impact while securing the philosophical space necessary to make the concept coherent.

  ### 1. Criteria and Weights

  To rank these questions, I have applied the following weighted criteria. The weights reflect the specific constraint that this is a *philosophy-led* programme within an *economics-led* consortium, aiming for *institutional application*.

  *   **Upstream Dependency (35%):** Does answering Question A make Question B intelligible? If A is unresolved, is work on B merely modeling a phantom object?
  *   **Importance to Funder's Goal (30%):** Does the answer directly dictate how a funder should allocate resources under disagreement? Does it identify a dealbreaker or a green light?
  *   **Tractability (20%):** Can four postdocs make genuine progress in three years using philosophical and decision-theoretic tools? (Purely empirical or purely metaphysical questions are penalized).
  *   **Neglectedness (15%):** Is this already being handled by standard mechanism design or political philosophy?

  ### 2. The Defended Ordering

  **Priority 1: The Unit of Account (The "Currency" Problem)**
  *   **Status:** *Genuinely Upstream.*
  *   **Rationale:** You cannot design an enforcement mechanism (Priority 4) or model market equilibria (Priority 3) if you cannot specify the object of exchange. If moral values are incommensurable, "trade" is metaphorical. If they are commensurable, we have implicitly accepted a meta-ethical standard that the parties reject by hypothesis.
  *   **Tractability:** High. This is a conceptual clarification task suitable for philosophy/decision theory. It does not require empirical data.
  *   **Funder Impact:** Critical. If no unit of account exists, funders cannot be advised to trade; they must be advised to hedge or segregate.
  *   **Philosophy vs. Econ:** This is primarily **Moral Philosophy/Meta-ethics**. Economists assume a utility function; philosophers must justify its existence across divergent moral theories.

  **Priority 2: Endogeneity (The "Corruption" Problem)**
  *   **Status:** *Genuinely Upstream (Long-term).*
  *   **Rationale:** If participating in moral trade alters the agents' moral views (specifically, drifting toward consequentialism/aggregativism), the "deep disagreement" the funder wants to manage may dissolve. If the mechanism eliminates the disagreement it was designed to accommodate, is it a success or a failure?
  *   **Tractability:** Medium. Requires modeling dynamic preferences + normative analysis of whether such drift is "corruption" or "learning."
  *   **Funder Impact:** High. If trade homogenizes moral views, the institutional design changes from "managing pluralism" to "accelerating convergence."
  *   **Philosophy vs. Econ:** **Hybrid.** Economists model dynamic preferences; Philosophers evaluate the *normative status* of that change (integrity vs. improvement).

  **Priority 3: Aggregative Effects & Adverse Selection (The "Market Failure" Problems)**
  *   **Status:** *Downstream.*
  *   **Rationale:** Once we know *what* is traded (Priority 1) and *how it affects the traders* (Priority 2), we can model whether the market stabilizes or collapses. Adverse selection (Gresham's Law) and Aggregative Effects (Market-level PD) are structural risks.
  *   **Tractability:** High for economists, Medium for philosophers (defining the "worse off" condition).
  *   **Funder Impact:** High. Determines scalability.
  *   **Philosophy vs. Econ:** Primarily **Institutional Design/Game Theory**. Philosophers define the welfare metric; Economists model the equilibrium.

  **Priority 4: Enforcement and Credible Commitment**
  *   **Status:** *Downstream.*
  *   **Rationale:** You cannot enforce a contract if you cannot define the consideration (Priority 1). Furthermore, if Endogeneity (Priority 2) means agents naturally converge, enforcement costs may drop.
  *   **Tractability:** High. Standard mechanism design literature applies.
  *   **Funder Impact:** Medium. Essential for implementation, but secondary to feasibility.
  *   **Philosophy vs. Econ:** Primarily **Institutional Design/Game Theory**.

  **Priority 5: Relation to Existing Practices & Non-Standard Agents**
  *   **Status:** *Contextual/Extension.*
  *   **Rationale:** These are applications of the core theory. Comparing trade to legislative compromise is useful for framing, but doesn't determine the mechanics. Trade with future people/animals depends on the Unit of Account.
  *   **Tractability:** High.
  *   **Funder Impact:** Low/Medium. Refines the scope but doesn't determine the viability.
  *   **Philosophy vs. Econ:** **Moral Philosophy**.

  **Pseudo-Questions (or Low Priority):**
  *   *Trade with parties who cannot recognise themselves as trading:* This is largely a sub-question of the **Unit of Account**. If we can't denominate value for a non-human animal, we can't trade with it. If we can, the "recognition" issue is secondary.
  *   *Moral Hedging vs. Trade:* This is a taxonomic distinction. It matters for labeling, but not for the mechanics of allocation.

  ### 3. Defense to Economist Colleagues

  You must argue that **Priority 1 and 2 are not "philosophical decoration."**

  *   **Against Priority 1 (Unit of Account):** Your economists will say, "Let them reveal preferences via exchange rates; we don't need a common unit."
      *   *Counter-argument:* In standard markets, money is the unit. In moral trade, there is no money. If Party A trades "Saving 1 Life" for Party B's "Preserving 1 Sacred Site," and they disagree on the *value* of life vs. site, there is no numeraire. Without solving this, you are modeling barter with incommensurable goods. The "exchange rate" is the variable we are trying to solve for, not a given. If we skip this, the economists are modeling a market that cannot exist.
  *   **Against Priority 2 (Endogeneity):** Your economists will say, "Preferences are exogenous in standard models. Let's assume stability."
      *   *Counter-argument:* The funder's remit is "deep moral disagreement." If the trading mechanism itself resolves the disagreement by converting traditionalists to consequentialists, the *problem* the funder wants to solve disappears, but the *legitimacy* of the solution is in question. Is it a market solution or a coercive assimilation? This determines whether the funder should *scale* the programme or *limit* it.

  ### 4. Critique of Your Hunches

  **Hunch 1: The Unit-of-Account question is upstream of everything, including enforcement.**
  *   **Verdict:** **Correct, but with a trap.**
  *   **Argument:** You are right that enforcement presupposes an object. However, do not let this become a metaphysical black hole. The "solution" may not be a common currency (e.g., "moral utils") but a **pairwise exchange rate function** that requires no third-party standard.
  *   **Risk:** If the postdocs spend 3 years debating incommensurability without producing a functional model of exchange, the economists will revolt.
  *   **Adjustment:** Frame Priority 1 not as "What is the True Value?" but as "What is the minimal formal structure required to denote a binding moral exchange without a meta-ethical consensus?" This keeps it decision-theoretic.

  **Hunch 2: The Endogeneity question is the one with the most surprising implications... and most likely to be resisted.**
  *   **Verdict:** **Strongly Correct.**
  *   **Argument:** Proponents of moral trade (often in the Effective Altruism sphere) view it as a way to *satisfy* diverse values. They rarely consider that the *act of trading* might privilege the values that are most "tradeable" (usually aggregative/consequentialist) and starve those that are "sacred" (deontological/virtue-based).
  *   **Implication:** If true, moral trade is not a neutral platform for pluralism; it is an engine of moral convergence. This directly challenges the funder's goal of allocating resources *in the presence* of disagreement. It suggests the institution might eliminate the condition of its own necessity. This is the most "fundable" insight because it is counter-intuitive and high-stakes.

  ### 5. The Missing Question: Complicity and Taint

  There is a question you have not listed that is more upstream than Enforcement and potentially more blocking than Unit of Account: **The Complicity Constraint.**

  *   **The Question:** Under what conditions does entering a moral trade make an agent *complicit* in the immoral actions of their trading partner?
  *   **Why it matters:** If I am a consequentialist and I trade with a nationalist to fund malaria nets (by allowing them to fund a border wall), have I *enabled* the border wall? Even if the net result is positive by my lights, does the *transaction itself* violate my deontological constraints against aiding injustice?
  *   **Why it's missing:** You focused on the *structure* of the trade (enforcement, currency, effects). You omitted the *moral status of the link* between the traders.
  *   **Ranking:** This belongs at **Priority 1.5**. If the answer is "Moral trade is inherently complicit for non-consequentialists," the programme is dead on arrival for a large class of agents. It must be settled before modeling Aggregative Effects.

  ### 6. Dynamic Analysis: What Changes the Ranking?

  *   **Scenario A: Unit of Account is "Dissolved."**
      *   *Trigger:* Postdocs show that no common unit is needed; only bilateral Pareto improvements relative to the status quo are required.
      *   *Shift:* **Enforcement jumps to Priority 1.** If the object is simply "I do X, you do Y," the hard problem becomes binding commitment without a meta-currency.
  *   **Scenario B: Endogeneity is shown to be Negligible.**
      *   *Trigger:* Formal modeling shows moral views are sticky enough that 30 years of trade doesn't shift the distribution.
      *   *Shift:* **Aggregative Effects jump to Priority 2.** The focus moves from "Does this change us?" to "Does this market crash?"
  *   **Scenario C: Complicity is a Hard Stop.**
      *   *Trigger:* Philosophical consensus that trading with "immoral" views constitutes endorsement.
      *   *Shift:* **The Programme Pivots.** The call must shift from "How to facilitate trade" to "How to screen trading partners." This moves **Adverse Selection** to Priority 1 (we need to screen out "toxic" moral theories).

  ### 7. The Falsification Test

  To defend the wager that this programme is worth funding, you need a condition under which you would recommend *against* implementing moral trade institutions.

  **The Falsification Test:**
  > "The programme will be considered successful if it produces a formal model of moral trade. However, the *policy recommendation* will be to **abandon** moral trade as an institutional mechanism if:
  > 1.  **Incommensurability holds:** No exchange rate can be defined without imposing a meta-ethical standard that violates the 'deep disagreement' constraint; OR
  > 2.  **Convergence is mandatory:** The only stable equilibrium for a moral trade market is one where all agents converge to a single moral theory (e.g., consequentialism), thereby eliminating the pluralism the funder seeks to accommodate."

  **Why this test?**
  It protects you from the charge of "solutionism." It tells the funder: "We are not here to prove moral trade works. We are here to prove whether it *can* work without destroying the moral landscape." This aligns perfectly with the remit to change how funders allocate resources: sometimes the best advice is "Do not use this tool."

  ### Summary of the Call Structure

  1.  **Work Package 1 (Philosophy Lead):** The Formal Structure of Exchange. (Unit of Account + Complicity). *Deliverable: A decision-theoretic model of bilateral moral exchange without a common numeraire.*
  2.  **Work Package 2 (Philosophy/Econ Lead):** Dynamic Normativity. (Endogeneity). *Deliverable: A model of preference evolution under moral trading regimes.*
  3.  **Work Package 3 (Econ Lead):** Market Stability. (Aggregative Effects + Adverse Selection). *Deliverable: Equilibrium analysis of a multi-agent moral market.*
  4.  **Work Package 4 (Joint):** Institutional Design. (Enforcement + Application). *Deliverable: A protocol for philanthropic implementation or a recommendation against it.*

  This ordering secures the philosophical foundations first, ensuring the economists are modeling reality rather than fantasy, while keeping the end-goal of institutional design clearly in sight.
