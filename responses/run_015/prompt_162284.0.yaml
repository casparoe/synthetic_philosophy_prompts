answer: |-
  **TO:** Exhibitions Committee
  **FROM:** Sixth-form Representative, Youth Advisory Panel
  **DATE:** 10th [Month]
  **SUBJECT:** Copy Sign-off: Industrial Gallery Panel (1816–1819)

  **Recommendation**

  With the printing deadline due at the end of this week, I recommend we **approve the copy subject to named revisions**. I propose the Curator incorporates specific changes to distinguish between the environmental causes of the economic crisis and the institutional causes of the mortality rate. These revisions must be signed off by the Committee Chair by Friday to meet the printer's schedule. A full redraft risks missing the March opening; approving the draft as it stands risks historical inaccuracy regarding human agency.

  **The Mediation Test**

  The disagreement between the Curator and the Trustee centres on causation. The draft text employs agentive language for natural factors (the volcano and fever 'did things' to the town). The Trustee argues this is *environmental determinism* (the theory that physical environment dictates social development), which obscures the policy decisions of the Board of Guardians.

  To resolve this, I propose we adopt the 'Mediation Test' for this panel and future displays. A natural factor may be described as an agent only where:
  1.  It materially closed options that were previously open to human agents (e.g. a failed harvest prevents eating); AND
  2.  Its effects were not wholly routed through an institution that could have acted otherwise (e.g. relief policy).

  My EPQ supervisor has objected that this test is subjective: it allows historians to assign blame based on preference, describing events as 'nature' when generous and 'policy' when critical. This is a valid concern. However, for a public museum, the goal is not philosophical purity but causal clarity. While all history involves selection, we must avoid *erasure*. If we describe death as a weather event when it was facilitated by administrative neglect, we are not balancing perspectives; we are misstating the mechanism of suffering. The test forces us to identify where nature ended and human choice began.

  **Application to the Panel**

  Applying this test to the current copy yields a split result.

  First, the eruption of Mount Tambora and the subsequent cold summer pass the test. These events made a real difference to what the weavers and landowners could reasonably do. Wages fell because demand collapsed and supply vanished; this was not a policy choice. To omit this would be to suggest the town's misery was entirely self-inflicted, which is equally deterministic. The Curator is correct that visitors must understand the shock of 1816 compared to 1814. The environment did strike first.

  However, the typhus outbreak and the resulting forty deaths fail the second clause of the test. The presence of disease is natural, but the mortality rate was routed through the Workhouse and the Board of Guardians. As the Trustee argues, the difference between survival and death often depended on whether families received *outdoor relief* (aid given without entering the institution) or were packed into overcrowded wards. Describing the fever as the sole killer obscures the conditions that allowed it to spread. Here, the institution could have acted otherwise.

  **Addressing the Curator's Position**

  I recognise that accepting the Trustee's argument too fully risks sanitising the experience of the weavers. The Curator's draft captures the visceral feeling of the period: to the people living through it, the world itself seemed hostile. If we over-correct and attribute every hardship to Parliament, we imply a level of human control that did not exist. There is a danger in making the past look like a simple moral play where all suffering is someone's fault. The Curator's emphasis on the volcano ensures visitors grasp the scale of the disaster. My proposed revisions do not remove the volcano; they simply prevent the volcano from taking credit for decisions made in the Boardroom.

  **Conclusion**

  The text should be revised to state that while the *crisis* was triggered by nature, the *mortality* was determined by relief policy. For example: 'The cold summer destroyed the harvest, but the death toll was shaped by relief decisions.' This satisfies the Mediation Test. It acknowledges the environmental shock without absolving the Guardians of their duty of care.

  Please review the attached mark-up. If the Curator can integrate these distinctions by Friday, we can proceed to print without compromising the gallery's historical integrity.

  **[Name]**
  Sixth-form Representative
