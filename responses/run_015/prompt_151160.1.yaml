answer: |-
  Here is the real talk on your situation, stripped of the corporate HR fluff.

  ### The Short Answer
  You are not being gaslit in the clinical sense (she isn't trying to convince you that reality doesn't exist), but you are being **manipulated through a power asymmetry.**

  Her argument—"My breaking the rule doesn't make your lateness okay"—is **logically valid** but **morally bankrupt.**

  Here is the philosophical distinction:
  1.  **Logical Validity:** The rule exists. You broke it. Technically, you are liable. Her breaking it doesn't magically make you on time.
  2.  **Moral Authority:** In a social contract (like a workplace), the person who writes the rule implicitly agrees to be bound by it to maintain legitimacy. When a leader exempts themselves from a standard they enforce on others, they aren't enforcing "standards"; they are enforcing **submission.**

  She isn't wrong that you were late. She is wrong that she has the moral standing to write you up for it while flagrantly violating the same policy. That isn't management; that's hypocrisy weaponized as policy.

  ### Is There a Philosophical Point Here?
  Yes. It's the difference between **Rule of Law** and **Rule by Man.**

  *   **Rule of Law:** The rule applies to everyone equally. If the manager breaks it, she should face consequences (or at least acknowledge the double standard).
  *   **Rule by Man:** The rule applies to whoever has less power. The manager is essentially saying, "The rule is a tool I use to control you, not a standard I use to govern myself."

  When she says, "As manager I still get to enforce standards," she is admitting that the standard isn't about "professional presence" or "reliability." It's about **hierarchy.** If reliability were the actual goal, her behavior would be the first thing addressed, because a manager being unavailable for two hours impacts the team more than an individual contributor being ten minutes late.

  ### What Would Change My Mind?
  I am taking your side on the principle of fairness, but I need to be honest about where I could be wrong. Here is what would flip my assessment:

  1.  **Different Job Classifications:** If she is "Exempt" (salaried, no overtime) and you are "Non-Exempt" (hourly, clock-in/out), labor laws often treat attendance differently. Salaried managers often have flexible hours in exchange for no overtime pay, while hourly staff are paid strictly for time worked. If the policy legally distinguishes between you, her argument holds water.
  2.  **The "Coverage" Argument:** If her job requires her to be in meetings with external clients or upper management that run late, and your job requires you to man a phone desk or production line at a specific time, the "rule" might actually be about *coverage*, not clock time. If her being late doesn't stop work, but your being late does, the standard is functionally different.
  3.  **Prior History:** If you have been late 20 times and this is the first write-up, and she is late 20 times but her boss tolerates it for some reason, the "one time" write-up might be the straw that broke the camel's back for you, while she has political capital saved up. (Though even then, the double standard is toxic).

  ### Where My Reasoning Is Shakiest
  I have to admit two blind spots here:

  1.  **I don't know the written policy:** You said she *wrote* the policy. Does the policy explicitly say "All staff including management"? Or does it say "Employees"? Sometimes managers carve out loopholes for themselves in the fine print. If she wrote a loophole for herself, she's sleazy, but she might be technically within her rights.
  2.  **I don't know her boss's stance:** She CC'd her boss on your write-up. Does her boss know she takes two-hour lunches? If her boss knows and allows it, then the "standard" isn't actually what's written on paper; the standard is "Manager gets flexibility, you don't." That sucks, but it might be the *actual* culture, regardless of what the policy says.

  ### The Verdict
  She is pulling a power move. By CC'ing her boss on a single instance of you being ten minutes late while she habitually breaks the rule, she is creating a paper trail to justify firing you later, or simply asserting dominance.

  **Is it gaslighting?** No. Gaslighting is making you question your sanity. This is **gaslighting-adjacent:** it's telling you that fairness doesn't matter, only compliance does.

  **Is she valid?** Logically, yes (you were late). Ethically and culturally, no. A leader who demands sacrifice they aren't willing to make loses the respect of the team. She is trading short-term compliance for long-term resentment.

  **Advice (Non-HR version):** Do not fight this on the moral ground ("It's not fair!"). She has already told you she doesn't care about fairness. Fight it on the **documentation ground.**
  *   Keep a private log of dates/times she is late or gone.
  *   Do not be late again. Not once.
  *   If this goes to HR or a higher-up later, you need to show a pattern of selective enforcement, not just complain about hypocrisy. Selective enforcement is a legal liability for companies; hypocrisy is just annoying. Frame it as the former if you ever need to escalate.

  She's not wrong about the rule. She's wrong about her right to stand above it. But in corporate America, power often trumps right. Watch your back.
