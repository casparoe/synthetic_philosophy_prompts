prompt: |-
  ok so i have this work situation and idk if im being gaslit or if theres actually a philosophical point hiding in it. my manager literally wrote our teams attendance policy last year — she made this big deal about "profesional presence" and being reliable — but she comes in late like three days a week and takes two hour lunches. then she writes me up for being ten minutes late once, and cc'd her boss saying i have "reliability issues." when i said she's breaking her own rule she said her breaking it doesnt make my lateness okay, and that as manager she still gets to enforce standards. is that actually valid? like, does her being a hypocrite make her wrong to call me out, or is that just a deflection? please answer in american english. also be real about what would change your mind — what argument or evidence would flip you — and tell me where your reasoning is shakiest. and dont just give generic hr advice; im asking whether theres a real issue about who gets to blame people when theyre guilty of the same thing, especially when they made the rule.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Situation:** The user's manager created a strict attendance policy ("professional presence," reliability) but consistently violates it herself (late 3 days/week, 2-hour lunches). The user was written up for being 10 minutes late once, with the manager cc'ing her boss about "reliability issues." When confronted, the manager argued that her violation doesn't excuse the user's, and she has the authority to enforce standards.
      *   **Core Question:** Is the manager's argument valid? Is this gaslighting, or is there a philosophical point about authority and rules? Who gets to blame whom when both are guilty?
      *   **Constraints:**
          *   Answer in American English.
          *   Be real about what would change my mind (epistemic humility).
          *   Identify where reasoning is shakiest.
