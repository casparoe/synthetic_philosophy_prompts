answer: |-
  The tax is valid. Amendment C was enacted according to the law in force in 2015. The law in force in 2015 was the Charter as amended by B. B was validly enacted because the entrenchment clause (§2) had already been validly repealed by A. A was validly enacted because it complied with the amendment power existing at the time (§1) and did not trigger the unanimity requirement of §2. The chain of title is unbroken.

  ### The Substantive Argument

  The validity of Amendment A turns on the proper construction of §2. Section 2 states: "Section 1 may be amended only by a unanimous vote of the Assembly." It does not state that Section 2 itself may only be repealed by a unanimous vote. It states only that Section 2 "may not be repealed by implication."

  Amendment A was an express repeal of Section 2. It was not implied; it was the explicit text of the amendment. Therefore, the specific prohibition in §2 against *implied* repeal does not apply to A. Since the specific prohibition does not apply, the general amendment power in §1 governs. Section 1 permits amendment by a two-thirds vote. Amendment A received 68 votes out of 99 voting members (68.7%), satisfying the two-thirds requirement. Consequently, A was valid when enacted.

  Upon the enactment of A, Section 2 ceased to exist. The legal landscape in 2013 consisted solely of Section 1 (requiring two-thirds) and the new text of A (which re-stated Section 1's two-thirds requirement). Amendment B proposed to change the text of Section 1 to allow simple majority amendments. This was a textual amendment of Section 1. At the time of B's enactment, Section 2 was no longer law. Therefore, the unanimity requirement was no longer in force. The only applicable requirement was the two-thirds vote mandated by Section 1. Amendment B received 71 votes out of 98 voting members (72.4%), satisfying the two-thirds requirement. Consequently, B was valid when enacted.

  Upon the enactment of B, Section 1 was amended to require only a simple majority. In 2015, Amendment C required only a simple majority. It received 53 votes out of 99 voting members (53.5%). Consequently, C was validly enacted, and the tax is law.

  ### Textual vs. Modal Protection

  You distinguish between a textual change (altering the words) and a modal change (altering the powers). I take the position that §2 protects the **text** of Section 1, not its modal profile.

  The Charter is a composite instrument composed of distinct numbered sections. To "amend Section 1" means to alter the provision designated as Section 1. Amendment A left the text of Section 1 untouched; it re-enacted it verbatim. It operated on Section 2. To adopt the modal view—that §2 protects the *powers* conferred by §1 regardless of which section is textually altered—is to render the structure of the Charter incoherent. If any change that affects the difficulty of amending §1 counts as an "amendment of Section 1," then §2 effectively entrenches *itself* against repeal, because repealing §2 makes it easier to amend §1. But §2 already addresses its own repeal: it forbids only *implied* repeal. If the framers intended §2 to be unamendable except by unanimity, they would have written "Section 2 may be amended or repealed only by a unanimous vote." They did not. They drew a distinction between §1 and §2. I respect that distinction. The modal reading collapses the two sections into one functional unit, violating the express textual separation the Charter maintains.

  Regarding §5 (Severability): If the repealing sentence in A ("Section 2 is repealed") were void, the remainder of A ("The Charter may be amended by a two-thirds vote...") could stand on its own under §5, as the Assembly would clearly have enacted the status quo rule even without the repeal. However, admitting this would destroy my case. If the repeal is void, Section 2 survives. If Section 2 survives, Amendment B (passed by 72%) is void for lack of unanimity. If B is void, the simple-majority route never opened, and C is void. Thus, §5 highlights the stakes: the Charter prefers to save legislative text, but for the tax to stand, the repealing sentence of A must be recognized as valid. The existence of §5 supports a presumption of validity, but it cannot cure the survival of §2. My argument requires that the repeal itself be effective, not severable from it.

  ### The Procedural Grounds

  I rely on the substantive argument above as the primary foundation: A and B were valid *when enacted*. However, I also rely on §3 and §4. These provisions add a layer of **finality** that cures any residual doubt.

  Section 4 states the Clerk's certificate is "conclusive evidence that the amendment was enacted in the manner this Charter requires." Section 3 limits judicial review to sixty days. In 2011 and 2013, certificates issued. No petitions were filed. The procedural grounds do not merely bar the remedy; they define the reality of the Charter. By making the certificate "conclusive," the Charter removes the factual predicate of the amendment's validity from judicial inquiry. This adds to the substantive argument by preventing the Court from re-examining the vote count or the legal characterization of the amendment years later. It transforms a potentially debatable substantive validity into an unassailable legal fact.

  ### Objection 1: The Substance of Amendment

  *Objection:* A was in substance an amendment of §1, because it changed the conditions under which §1 can be amended. A unanimity requirement that any two-thirds majority may delete at will is no requirement at all, so §2 must be read to reach it.

  *Response:* This objection confuses the *effect* of a rule with the *scope* of a rule. It is true that repealing §2 makes it easier to amend §1. But every amendment makes some future action easier or harder. If I amend §1 to require a 90% vote, I have changed the modal profile. If I amend §1 to require 10%, I have changed it more. The text of §2 does not say "Section 1 may not be made easier to amend." It says "Section 1 may be amended only by a unanimous vote." That restriction attaches to the act of amending the *text* of Section 1.

  Furthermore, the objection ignores the specific language regarding §2's own repeal. §2 says it "may not be repealed by implication." This phrase is operative only if express repeal is possible. If §2 were immune to repeal by a §1 majority, the distinction between implied and express repeal would be meaningless; *no* repeal would be allowed. The presence of the "implication" qualifier necessarily implies that express repeal is permitted under the general amendment power. To read §2 as immune to express repeal is to read the word "implication" out of the Charter. The Assembly exercised the power §1 gave it to remove the restriction §2 placed on §1. That is not a contradiction; it is the exercise of sovereignty.

  ### Objection 2: Nullity and the Certificate

  *Objection:* An amendment that is void is not voidable but a nullity; there is nothing there for a certificate to be conclusive about and nothing there for a limitation period to run against, so the Court in 2015 is free, and indeed obliged, to disregard A and B however the Clerk described them.

  *Response:* This objection assumes a natural law of validity existing outside the Charter. It posits that "voidness" is an ontological state that the Charter's procedures cannot touch. But within the legal system created by this Charter, validity is constituted by the Charter's own rules. Section 4 does not say the certificate is evidence of the *facts* of the vote; it says it is conclusive evidence that the amendment was enacted "in the manner this Charter requires." This is a rule of recognition. It empowers the Clerk to determine, conclusively, whether the manner requirements were met.

  If an amendment is "void," it is void because the Charter says so. But the Charter also says the Certificate is conclusive. These two rules must be harmonized. The only coherent reading is that the time limit in §3 and the conclusivity in §4 define the window in which "voidness" can be declared. Once the window closes, the amendment is, by the Charter's own definition, enacted in the required manner. To allow a court in 2015 to declare a 2011 amendment a "nullity" despite a conclusive certificate and an expired limitation period is to allow the Court to amend §3 and §4. The Court is bound by the Charter. The Charter says the certificate is conclusive. Therefore, for the purposes of this legal system, A and B are not nullities; they are law.

  ### Conclusion

  The single sentence on which this argument most depends is the final sentence of §2: **"This section may not be repealed by implication."**

  If this sentence is read the other way—if it is interpreted to mean that §2 is so fundamental that *any* repeal is forbidden unless unanimous—then my argument collapses. If "may not be repealed by implication" is read as a mere clarification of a total bar on repeal, then Amendment A required unanimity. Since A lacked unanimity, A is void. If A is void, §2 survives. If §2 survives, B required unanimity. B lacked unanimity. B is void. If B is void, the simple-majority rule never existed. C is void. The tax falls. But the text does not bear that reading. It distinguishes between implied and express repeal. It invites the conclusion that express repeal is permitted. The Assembly accepted the invitation. The tax stands.
