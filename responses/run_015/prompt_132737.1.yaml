  I'm in a graduate seminar on the unity of consciousness, and an argument with a friend has stalled in the usual way: every time we get near the actual disagreement, one of us says that it depends what you mean by a subject, and the conversation restarts. So I want to force it into numbers. Set up the case like this: an adult has the corpus callosum and anterior commissure fully sectioned for intractable epilepsy, and then — this part is stipulation, since no such device exists — the connection is replaced by an implant that relays activity between homotopic cortical areas with three independently adjustable parameters: throughput, from zero up to roughly biological callosal capacity; temporal fidelity, i.e. whether relayed activity arrives with its timing preserved or is relayed with jittered timing so that content is shared without being temporally bound; and directionality, symmetric or else one-way in either direction. Assume the rest of the classic picture: contralateral hemifields, language lateralized to the left hemisphere so that only it can name what is presented, the two hands occasionally working at cross-purposes, and both hemispheres sharing a brainstem, one sleep–wake cycle and one body. Now hold the dials at some intermediate setting — say half of biological throughput, timing preserved, symmetric — and consider the general claim: that there is some intermediate setting at which the number of subjects of experience in this patient is neither determinately one nor determinately two. I mean this as a claim about determinacy, not about evidence: count it as false if any physically or functionally specifiable threshold, however arbitrary-looking, is entailed by the correct theory of consciousness to fix the count, and true only if the how-many question genuinely has no answer there. My credence is about 0.4. My friend's is about 0.8, on the ground that unification is obviously a matter of degree and any sharp threshold would be arbitrary; I think she is