  ### Mentor Check-In

  #### 1. Does the order of elimination matter?
  **Verdict: No (for strict domination).**
  Your mentor is correct. Because every elimination we did was **strict** (e.g., $4 > 1$, not $4 \ge 1$), the final survivor is unique.
  *   In Round 2, both **Park (C2)** and **Mall (C3)** were dominated by **Cinema (C1)**.
  *   If you deleted C2 first, C3 would *still* be dominated by C1.
  *   If you deleted C3 first, C2 would *still* be dominated by C1.
  *   You end up at the same unique solution $(R1, C1)$ regardless of which "bad" column you threw away first.
  *   *Caveat:* This only works because the domination is **strict**. If we had weak domination (e.g., $3 \ge 3$), the order could change the outcome.

  #### 2. Is the chain fragile? (The "Backup Mixture" Test)
  **Verdict: Yes, it collapses.**
  You asked: *"If I deleted one of the strategies that goes into the dominating mixture, does the whole elimination chain collapse?"*
  *   The first elimination relied on a mix of **Cinema (R1)** and **Park (R2)** to kill **Mall (R3)**.
  *   **Scenario:** Suppose **Park (R2)** didn't exist in the game at all.
  *   **Check:** Can **Cinema (R1)** alone beat **Mall (R3)**?
      *   Look at the "Mall (C3)" column: R1 gets 0, R3 gets 1.
      *   $0 < 1$. **No.**
  *   **Result:** Without R2, R3 is no longer dominated. R3 survives.
  *   **Ripple:** If R3 survives, the Friend's strategies **Park (C2)** and **Mall (C3)** are no longer dominated (because they get high scores against R3).
  *   **Conclusion:** The entire chain collapses. There is no "backup" mixture. R1 and R2 are **partners**; they need each other to clear the board.

  ### Why This Matters
  This example proves that a strategy can be "useless" on its own (Park/R2 gets a 0 against Cinema/C1) but **essential** for the logic of the game. Without Park/R2, you can't prove Mall/R3 is bad. If you can't prove Mall/R3 is bad, your Friend might play Mall/C3 to exploit you.

  Your mentor showed you that in game theory, **context is king**. A strategy's value isn't just its own payoff; it's its role in the ecosystem of available moves.
