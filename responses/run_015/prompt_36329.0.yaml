  #### Round 3: The Final Showdown
  Now the Friend only has **Cinema (C1)** left.

  | You \ Friend | **Cinema (C1)** |
  | :--- | :---: |
  | **Cinema (R1)** | 8, 3 |
  | **Park (R2)** | 0, 3 |

  **Check Your Strategies:**
  *   **Cinema (R1)** gives 8.
  *   **Park (R2)** gives 0.
  *   **R1 strictly dominates R2.**

  **Action:** **Delete Row 2 (Park).**

  ### The Final Result
  The process stops here.
  **Unique Solution:** **(Cinema, Cinema)**.
  Both players choose Cinema. The Iterated Elimination of Strictly Dominated Strategies (IESDS) solved the game completely.

