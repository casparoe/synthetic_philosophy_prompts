  4. I floated a "disagreement probe" idea with the team: before shipping, build a benchmark of tasks where the intended goal and the suspected learned proxy come apart, run the model on them, and check which one its behaviour tracks. Does that idea hold up? Would it separate goal misgeneralization from reward hacking and from plain capability failure? And where would it give us false confidence — say, if the model were situationally aware, or if our probe tasks secretly share some regularity with the training distribution?

  Please write plainly, and skip citations and references entirely — I can't look anything up from this machine and I don't need reading recommendations, just the reasoning.
