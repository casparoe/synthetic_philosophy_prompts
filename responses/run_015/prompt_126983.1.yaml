answer: |-
  The municipality of Port Haven issues five-year "climate-adaptation visas" to foreign workers who construct sea walls, pay local taxes, and obey all zoning and criminal laws without eligibility for citizenship. Upstream across the border, the Verdant Valley farmers lose irrigation water due to the wall's diversion, though they remain under their own nation's jurisdiction. Meanwhile, a remote panel of international hydrologists advises the council via video link; their research grants depend on the project's approval, yet they never enter Port Haven and face no local legal coercion.

  Under **All Affected Interests (AAI)**, visa-holders are included because their daily lives are shaped by the decision; farmers are included because the diversion materially harms their livelihoods; but advisors are excluded because their financial stake is a voluntarily assumed professional risk rather than an imposed externality. Under **All Subjected Persons (ASP)**, visa-holders are included because they are coercively bound by local law; farmers are excluded because Port Haven's laws hold no jurisdiction over them; and advisors are excluded because they face no legal coercion whatsoever. The structural feature doing the work is **coercive jurisdiction**: ASP tracks who is forced to obey, while AAI tracks who suffers involuntary consequences. If you drop the five-year limit, the visa-holders become permanent residents, collapsing the boundary problem into standard naturalization debates where ASP and AAI converge on inclusion. A defender of ASP would attack the case by arguing that the farmers' water loss is merely an externality, not a legitimacy deficit; since Port Haven does not coerce the farmers, it owes them no democratic voice, only diplomatic negotiation or compensation.
