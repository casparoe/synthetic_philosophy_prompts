prompt: |-
  I'm taking a course on democratic theroy and we got stuck on the boundry problem — who actually belongs to the demos? I want you to build me a thought experiment, but not the usual tourist-or-temporary-worker case everyone recycles. Picture a coastal municipality that issues "climate-adaptation visas": people come for exactly five years, build flood defenses, pay local taxes, are subject to police and zoning law, but have no path to permanent residency. There's also an upstream farming community in a neighbouring country whose groundwater gets diverted by the wall project, and a remote panel of hydrologists who advise the council over video, never physically present, never subjected to local law, but whose grant funding is tied to the project's approval.

  The case should be realistic, one paragraph max, no trolleys or sci-fi. I need it engineered so that "all affected interests" and "all subjected persons" both include the visa-holders, but split on the farmers — AAI includes them, ASP excludes them — and both exclude the remote advisors, though for different reasons. After you lay out the scenario, walk through what each principle says about all three groups and why. Then tell me which structural feature is actually doing the work, what breaks if we drop the five-year limit, and how a defender of ASP would attack the case. Don't cite anyone or give me a reading list, I just want to reason through it. (Sorry for any typos, I'm typing this on my phone between classes.)
