prompt: |-
  I have recently become the analyst who prepares the risk assessments on which my agency's scientific advisory committee decides whether to adopt a proposed intervention. My colleagues keep handing me a single best-estimate number for the relevant probability, and I no longer think that number is honest: what we actually have is a set of disagreeing estimates, a model identified only within bounds, and sparse data. Once the probability is a set rather than a point, expected-utility maximisation stops telling me what to do, and I know there are rival replacements -- maximin (do as well as possible in the worst case), maximin expected utility (do as well as possible under the worst admissible distribution), Hurwicz (a blend of the best and worst cases), E-admissibility (admit any option that is optimal under some admissible distribution), and maximality (admit any option that no other option beats under every admissible distribution). Write me a procedure my team can run on any proposal, within about a week and recorded on a page: how to elicit, bound and record the set; how to choose among these rules and defend the choice, given that choosing a rule is itself a decision under the uncertainty we are trying to handle; what to do when the rules disagree; how to avoid the trap in which collecting more evidence makes the set wider rather than narrower; where the procedure stops with a no; and where it must hand the decision to a named person because the residual question is how much risk we are willing to accept rather than a question of fact. Then run it on two proposals -- a screening programme whose benefit and harm are both uncertain, and a novel vector-control intervention with an imprecise ecological risk -- including one whose answer I will not like, and close by saying what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Risk Analyst for a scientific advisory committee.
      *   **Problem:** Colleagues provide single point estimates for probabilities, but reality involves sets of estimates, model uncertainty, and sparse data (imprecise probabilities). Expected Utility (EU) maximization fails under imprecision.
      *   **Task:** Create a 1-page procedure (to be run within a week) for handling imprecise probabilities in risk assessment.
      *   **Key Components of Procedure:**
          *   Elicit, bound, and record the set of probabilities.
          *   Choose among decision rules (Maximin, MMEU, Hurwicz, E-admissibility, Maximality) and defend the choice (meta-decision under uncertainty).
          *   Handle disagreement among rules.
          *   Avoid the "more evidence = wider set" trap (dilation).
          *   Define stopping criteria (when to say "no").
          *   Define hand-off criteria (when to pass to a decision-maker for risk tolerance).
      *   **Application:** Run the procedure on two specific proposals:
          1.  Screening programme (uncertain benefit/harm).
          2.  Novel vector-control intervention (imprecise ecological risk).
          *   *Constraint:* One outcome must be one the user "will not like" (i.e., counter-intuitive or restrictive).
      *   **Conclusion:** State what the procedure *cannot* settle.
      *   **Format:** Concise, actionable, professional tone (analyst to committee/team).

  2.  **Deconstruct the Procedure (The "One-Page Protocol"):**
      *   *Timeframe:* 1 week. This means it needs to be streamlined, not a months-long Delphi study.
      *   *Elicitation:* Need to capture the *range* of expert opinion, not force consensus. Use intervals $[P_{min}, P_{max}]$.
      *   *Decision Rules:* Need a hierarchy. MMEU is often too conservative. E-admissibility/Maximality are good for filtering. Hurwicz requires an $\alpha$ (optimism index).
      *   *Meta-Decision:* How to pick the rule? Pre-commitment based on agency mandate (precautionary vs. innovation).
      *   *Dilation:* Acknowledge that refining models can widen bounds if it reveals structural uncertainty. Mitigation: Fix the model class early.
      *   *Stopping/Hand-off:* Distinguish between "scientifically inadmissible" (risk too high/uncertain) and "policy choice" (risk acceptable for benefit).

  3.  **Drafting the Procedure (Iterative refinement):**
      *   *Name:* Imprecise Risk Assessment Protocol (IRAP).
      *   *Step 1: Elicitation.* Don't average. Record min/max from credible models/experts.
      *   *Step 2: Rule Selection.* This is the tricky part. The prompt asks how to choose among rules *given* uncertainty. The standard approach in robust decision making is to use *Maximality* or *E-admissibility* to filter, then apply a secondary rule if needed. Or, pre-specify the rule based on the *type* of risk (e.g., catastrophic = Maximin). Let's suggest a tiered approach: Filter by E-admissibility, then apply Maximin for catastrophic tails, or Hurwicz for trade-offs.
      *   *Step 3: Dilation.* Explicitly state: "Do not refine model structure if it expands bounds without new data."
      *   *Step 4: Decision.* If all rules reject -> No. If rules disagree -> Hand off.

  4.  **Developing the Case Studies:**
      *   *Case 1: Screening Programme.*
          *   Context: Medical/Public health.
          *   Uncertainty: Sensitivity/Specificity and Prevalence.
          *   Outcome: Let's make this the one the user "won't like." Usually, analysts want to approve screenings. If the uncertainty is high, robust rules might reject it even if the *average* looks good. Let's make the "No" happen here due to wide bounds on harm (false positives).
      *   *Case 2: Vector-Control.*
          *   Context: Environmental/ECological.
          *   Uncertainty: Non-target species impact.
          *   Outcome: Approval with conditions, or a clear "Hand-off." Let's make this one where the rules agree (E-admissible) but the risk tolerance is the bottleneck.

      *Wait, the prompt says "including one whose answer I will not like".*
      *   Interpretation A: The analyst won't like the answer (e.g., recommended rejection of a pet project).
      *   Interpretation B: The committee won't like the answer.
      *   Interpretation C: The outcome is counter-intuitive.
      *   *Decision:* I will make the Screening Programme result a **Rejection** based on Maximin/MMEU, despite a positive Expected Value. Analysts often feel pressure to approve "obviously good" things. Robustness might kill it. This is often unpopular.

  5.  **Refining the "Meta-Decision" on Rules:**
      *   How to choose the rule without falling into infinite regress?
      *   *Solution:* The agency's *mandate* dictates the rule. If the mandate is "prevent harm," use Maximin/MMEU. If "promote welfare," use Hurwicz/E-admissibility. This moves the decision from the analyst to the agency's charter (a fixed point).

  6.  **Drafting the Content (incorporating technical terms):**
      *   Use terms like "credal set," "dilation," "admissibility."
      *   Keep it tight. The prompt asks for a procedure "recorded on a page." I should present the procedure clearly, then the application.

  7.  **Addressing Specific Constraints:**
      *   *Within a week:* The elicitation must be rapid (expert ranges, not full Bayesian updating).
      *   *Avoid Dilation:* Fix the model class *before* sensitivity analysis.
      *   *Hand-off:* Distinguish "Indeterminate" (rules disagree) from "Risk Tolerance" (rules agree it's safe, but is it worth it?).
      *   *What it cannot settle:* Value judgments (trade-offs between lives saved vs. ecological damage).

  8.  **Review against Prompt:**
      *   Procedure included? Yes.
      *   Elicit/Bound/Record? Yes.
      *   Choose/Defend Rules? Yes (via Mandate).
      *   Disagreement handling? Yes (Hand-off).
      *   Dilation trap? Yes (Model freezing).
      *   Stop with No? Yes (Inadmissibility).
      *   Hand to named person? Yes (Risk Owner).
      *   Two proposals run? Yes.
      *   One disliked answer? Yes (Screening rejection).
      *   Closing limitation? Yes.

  9.  **Final Polish:**
      *   Tone: Professional, authoritative, concise.
      *   Formatting: Use bolding and lists for readability (simulating the "one page" feel).
      *   Ensure the distinction between *uncertainty* (imprecise prob) and *risk tolerance* (utility) is clear.

  **(Self-Correction during drafting):** I need to make sure I don't get bogged down in the math of the decision rules. The user knows them. I need to focus on the *procedure* for selecting and applying them.
  *Correction on the "Disliked Answer":* I need to make sure the reasoning is sound. If the Screening Programme has wide uncertainty on harm, Maximin will assume the worst harm. If the worst harm outweighs the best benefit, it gets rejected. This is robust but often frustrating for proponents. I will frame this clearly.

  *Correction on "Choosing the Rule":* The prompt asks how to choose among rules given that *choosing a rule is itself a decision under uncertainty*. This is a deep philosophical point (regress problem). The practical solution is **Pre-commitment based on Statutory Mandate**. I must emphasize this. The analyst doesn't choose the rule ad-hoc; the agency's mission chooses it.

  *Correction on Dilation:* The trap is "collecting more evidence makes the set wider." This happens when new data reveals model instability. The fix is to distinguish *parameter uncertainty* (narrows with data) from *model uncertainty* (may widen). The procedure must freeze the model class for the assessment period.

