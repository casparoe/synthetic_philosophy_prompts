answer: |-
  # IMPRECISE RISK ASSESSMENT PROTOCOL (IRAP)
  **Purpose:** To replace point-estimate risk assessments with robust decision-making under imprecise probabilities.
  **Timeframe:** 5 Working Days.
  **Owner:** Risk Analysis Unit.

  ### 1. ELICITATION & BOUNDING (Days 1–2)
  *   **Do not force consensus.** Solicit probability estimates $P(E)$ from all credible models and subject-matter experts.
  *   **Record the Credal Set:** Define the probability set $\Gamma = [P_{min}, P_{max}]$.
      *   $P_{min}$: Lowest plausible probability from a defensible model.
      *   $P_{max}$: Highest plausible probability from a defensible model.
  *   **Document Drivers:** Explicitly list which model assumptions drive the bounds (e.g., "upper bound driven by Model B's assumption of linear dose-response").
  *   **Anti-Dilation Clause:** Do not introduce new model structures during this week. Refining parameters narrows $\Gamma$; adding model classes widens it. Freeze the model class at Day 1.

  ### 2. DECISION RULE SELECTION (Day 3)
  *   **The Meta-Decision:** Choosing a decision rule under uncertainty leads to infinite regress. **Stop the regress at the Agency Mandate.**
      *   **Mandate = Prevention (e.g., Environmental Safety):** Use **Maximin Expected Utility (MMEU)**. Optimize for the worst-case distribution in $\Gamma$.
      *   **Mandate = Innovation/Welfare (e.g., Drug Approval):** Use **E-Admissibility**. Approve if the intervention is optimal under *any* $P \in \Gamma$.
      *   **Mandate = Balanced (e.g., Public Health):** Use **Hurwicz ($\alpha$)**. Weight best/worst cases by pre-commitment coefficient $\alpha$ (set by Committee Chair, not Analyst).
  *   **Defense:** The rule is not chosen for *this* case; it is chosen for *all* cases of this type. This avoids bias.

  ### 3. APPLICATION & CONFLICT RESOLUTION (Day 4)
  *   **Run the Selected Rule:** Calculate utility bounds $[U_{min}, U_{max}]$.
  *   **Secondary Check:** Run **Maximality**. If the proposal is dominated by the status quo under *every* $P \in \Gamma$, reject immediately.
  *   **Rule Disagreement:** If E-Admissibility says "Yes" but MMEU says "No":
      *   **Status:** INDETERMINATE.
      *   **Action:** Hand off to Decision Maker (see Step 4). Do not average the rules.

  ### 4. TERMINATION & HAND-OFF (Day 5)
  *   **Stop with NO:** If $U_{max} < 0$ (even the best-case distribution yields negative utility) OR if Maximality shows dominance by status quo. This is a scientific inadmissibility finding.
  *   **Hand-Off:** If $U_{min} < 0 < U_{max}$ (outcome depends on which probability in $\Gamma$ is true):
      *   **Status:** RISK TOLERANCE REQUIRED.
      *   **Action:** Transfer to Named Risk Owner (e.g., Committee Chair).
      *   **Briefing:** "Science cannot resolve this. The question is not *what will happen*, but *how much risk we are willing to bear* given the ambiguity."

  ---

  ## APPLICATION OF PROTOCOL

  ### PROPOSAL A: Population Screening Programme
  *   **Context:** Screening for Condition X. Benefit = Early detection; Harm = False positives leading to invasive follow-up.
  *   **Imprecision:** Prevalence is sparse ($P_{prev} \in [0.1\%, 1.0\%]$). Specificity varies by lab ($P_{spec} \in [95\%, 99\%]$).
  *   **Mandate:** Public Health (Balanced). Rule: **Hurwicz ($\alpha=0.4$, precautionary lean)** & **Maximality**.
  *   **Analysis:**
      *   *Best Case ($P_{max}$ benefit, $P_{min}$ harm):* Net Utility = +500 QALYs.
      *   *Worst Case ($P_{min}$ benefit, $P_{max}$ harm):* Net Utility = -200 QALYs (Harm dominates due to low prevalence amplifying false positives).
      *   *Maximality Check:* Under the low-prevalence/high-harm model, the Status Quo (no screening) dominates Screening.
  *   **Result:** **REJECT.**
  *   **Why you won't like it:** The *average* estimate suggests a net benefit. Colleagues will argue the "worst case" is unlikely. However, under IRAP, because the Status Quo dominates the Proposal in a credible subset of $\Gamma$, the proposal is inadmissible. We cannot recommend an intervention that harms more than it helps in a defensible scenario, regardless of the "best guess."

  ### PROPOSAL B: Novel Vector-Control Intervention (Gene Drive)
  *   **Context:** Reducing malaria via mosquito suppression. Benefit = High. Risk = Non-target ecological collapse.
  *   **Imprecision:** Ecological cascade models disagree fundamentally. Probability of collapse $P_{eco} \in [0.001, 0.15]$.
  *   **Mandate:** Environmental Safety. Rule: **MMEU (Maximin)**.
  *   **Analysis:**
      *   *Best Case:* Malaria eradicated, no ecological impact.
      *   *Worst Case:* Malaria reduced, but $P_{eco}=0.15$ triggers irreversible ecosystem loss (Utility = $-\infty$).
      *   *MMEU Calculation:* The worst-case distribution assigns sufficient mass to the catastrophic outcome that Expected Utility is negative.
  *   **Result:** **HAND-OFF TO COMMITTEE CHAIR.**
  *   **Rationale:** While MMEU suggests rejection, the benefit (human lives) is so high that the "worst case" might be an acceptable risk to the policy maker. The uncertainty is structural (model disagreement), not parametric. The Analyst cannot weigh human life against ecological ambiguity.
  *   **Briefing to Chair:** "The science indicates a 15% chance of severe ecological harm. Maximin says 'No'. E-Admissibility says 'Yes'. The choice is not factual; it is a value judgment on whether malaria eradication justifies a 15% ambiguity-weighted risk of ecological damage."

  ---

  ## LIMITATIONS OF THIS PROCEDURE
  This procedure **cannot settle**:
  1.  **Value Conflicts:** It separates fact (probability sets) from value (utility), but it cannot resolve disagreements on the utility function itself (e.g., how to weigh economic cost vs. lives).
  2.  **True Ignorance:** If the set $\Gamma$ is unbounded because we lack the vocabulary to describe the risk (unknown unknowns), the procedure yields "Indeterminate" without guidance.
  3.  **Political Mandate Shifts:** If the Agency Mandate changes (e.g., from "Precaution" to "Growth"), the Decision Rule changes, altering the outcome without new data. This is a feature, not a bug, but it must be acknowledged.
