answer: |-
  This is a sharp observation, and you are right to feel that existing terminology is either too moralizing ("sour grapes"), too generic ("moral victory"), or too specific ("Lost Cause"). You have identified a specific *mechanism of political memory* that converts strategic failure into ethical capital while simultaneously voiding political liability.

  Here is the breakdown you need for your typology.

  ### 1. Is this one phenomenon or two?
  It is **one phenomenon**. The two moves you identify (Devotion via Cost + Detachment via Defeat) are mutually constitutive, not merely coincidental.

  *   **Why they travel together:** The "Devotion" half requires the "Detachment" half to function sustainably. If the cause were not detached from its concrete consequences, the "Devotion" would implicate the commemorators in those consequences (e.g., if you honor the Confederate dead for their *cause* rather than their *sacrifice*, you must defend slavery). Conversely, the "Detachment" requires the "Devotion" to have any weight. A cause that was simply abandoned carries no moral weight; a cause that was *died for* carries immense weight.
  *   **The Mechanism:** The defeat acts as a **purifying agent**. It severs the link between the *will* (which remains intact and admirable) and the *world* (where the will would have produced messy, likely objectionable results).
  *   **Conclusion:** Do not split them in your typology. The tension is the feature, not a bug.

  ### 2. Literature Check: Near Misses
  There is no single established term that captures this specific configuration, though several fields circle it.

  *   **David Blight (*Race and Reunion*):** Describes the Confederate case perfectly but treats it as a specific historical accommodation rather than a trans-historical structural mechanism.
  *   **Jay Winter (*Sites of Memory*):** Focuses on grief and mourning. He captures the "Devotion" half but does not account for the political utility of the "Detachment" half.
  *   **Ernst Kantorowicz (*The King's Two Bodies*):** Relevant to the Kosovo case (sacral sovereignty), but focuses on legal theology, not the *utility of defeat*.
  *   **Ernesto Laclau ("Empty Signifier"):** In political theory, an empty signifier is a symbol that unifies a group precisely because it is vague. Your cases are **"Empty Causes."** However, Laclau doesn't specify that the *emptiness* is produced by *military defeat*.
  *   **Reinhart Koselleck (*Futures Past*):** Discusses how defeated histories are conceptualized, but lacks the specific "immunity" mechanism you've found.

  **Verdict:** You are safe to coin. The fit with existing concepts is imperfect because they focus on either the *grief* (Winter), the *politics* (Blight), or the *semantics* (Laclau), whereas you are describing the *ethical arbitrage* of failure.

  ### 3. The Term: **Counterfactual Sanctification**
  I recommend this term for your typology. It is neutral, descriptive, and precise.

  *   **Counterfactual:** Refers to the second condition. The cause is honored precisely because it *never happened*. Its political content exists only in the subjunctive mood ("what would have been").
  *   **Sanctification:** Refers to the first condition. The suffering and loss elevate the actors to a sacred status that places them beyond ordinary political critique.

  *Alternative (if you want something punchier):* **The Alibi of Defeat**.
  *Note:* You mentioned disliking "Martyr's Alibi" because it prejudges intent. If you use "Alibi of Defeat," define it structurally, not psychologically. It is not that the commemorators are *lying*; it is that the *structure of the memory* provides an alibi. However, **Counterfactual Sanctification** is safer for a dissertation typology as it sounds less accusatory.

  ### 4. Definition and Diagnostic Test
  **Definition:** *Counterfactual Sanctification* is a mode of commemoration in which a political community extracts moral capital from a military or strategic failure by framing the cost of the loss as proof of sincerity, while relying on the failure itself to prevent the concrete implementation of the cause, thereby rendering it immune to practical critique.

  **Diagnostic Test (The "Three-Point Check"):**
  To classify a speech, monument, or text as an instance of Counterfactual Sanctification, it must pass all three:

  1.  **The Cost Clause:** Does the text explicitly cite the *suffering* or *death* of the losers as the primary justification for honoring them? (e.g., "They gave their all.")
  2.  **The Void Clause:** Does the text treat the *goal* of the losers as abstract, spiritual, or unknowable *because* they lost? (e.g., "We will never know what kind of nation they would have built, but we know they loved freedom.")
  3.  **The Immunity Clause:** Does this combination allow the commemorators to claim the virtue of the cause without accepting responsibility for its likely political consequences? (e.g., Honoring the "heritage" without defending the laws.)

  ### 5. The Boundary Case: Dunkirk vs. Warsaw
  You asked about Dunkirk. Here is how to distinguish it using the test.

  *   **Dunkirk (Failure of Type):** Dunkirk fails the **Void Clause**. The objective was *restated*, not abstracted. The goal became "escape" rather than "hold the line." The defeat was re-categorized as a strategic success. There is no *counterfactual* holiness; there is a *redefined* victory. The devotion is present, but the loss is not the *source* of the purity; the survival is.
  *   **Warsaw Ghetto Uprising (Near Miss):** This passes the **Cost Clause** (immense suffering) but fails the **Void Clause**. The cause (armed resistance against tyranny) *was* implemented in the act of fighting. The moral value comes from the *action taken*, not the *action prevented by death*.
  *   **Your Cases (Confederate/Kosovo/Masada):** The moral value comes from the *interruption* of the political project by death. The project remains pure *because* it was stopped.

  ### 6. Conditions and Scope
  To finalize your chapter, you need to界定 (delimit) the conditions under which this operates.

  *   **Must the losers have suffered?**
      *   **Yes.** Without material cost (death, ruin, exile), there is no "sacrifice" to license the honoring. A bloodless defeat is usually just an embarrassment, not a sanctification.
  *   **Must the cause be one the commemorators would now disavow?**
      *   **No.** This is a crucial distinction. In the Kosovo cycle, later generations *do* want the heavenly kingdom. In the Confederate case, they *do not* want slavery. Counterfactual Sanctification works for *both* disavowed causes (Confederacy) and transvalued causes (Kosovo). The mechanism is the same: the *earthly implementation* is deferred, regardless of whether that implementation is currently desired.
  *   **Does it survive in non-national cases?**
      *   **Yes.** It applies to any political community.
      *   *Example:* **Failed Utopian Communes.** (e.g., Brook Farm). They are remembered for their "high ideals" and "shared sacrifice," while the economic contradictions that caused their collapse are treated as tragic bad luck rather than structural flaws.
      *   *Example:* **Abandoned Scientific Programs.** (e.g., Alchemy). Sometimes framed as "devoted seekers of truth" whose "failure" preserved the mystery, allowing modern chemists to claim the lineage of "curiosity" without the lineage of "error." (Though this is rarer).
      *   *Example:* **Lost Labor Strikes.** A strike that failed can be commemorated for the "solidarity" (Cost) while the specific demands (Wages/Hours) are abstracted into "Dignity" (Void), allowing current unions to claim the heritage without committing to the specific, perhaps outdated, demands of the past.

  ### Summary for your Dissertation
  *   **Term:** Counterfactual Sanctification.
  *   **Typology:** A singular configuration where *Cost* validates *Sincerity* and *Defeat* validates *Purity*.
  *   **Differentiation:** Distinct from "Moral Victory" (which claims the loss was actually a win) and "Redemptive Defeat" (which claims the loss bought a future victory). In Counterfactual Sanctification, the loss *is* the victory because it preserves the cause from the corruption of reality.
  *   **Boundary:** Dunkirk is "Victory in Defeat" (redefinition); Your cases are "Sanctity in Defeat" (abstraction).

  This gives you the conceptual carving you need to proceed without listing instances. It allows you to treat the Confederate, Kosovo, and Masada cases as variations of a single structural logic of memory.
