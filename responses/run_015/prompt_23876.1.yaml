answer: |-
  Good evening. For those who don't know me, I had the privilege of studying under our guest of honor during my doctoral work. But looking around this room, I see I am just one of many. We have family here, members of the congregation she has served quietly for decades, and colleagues from across the seminary. And, of course, we have the survivors. The former advisees who know that a meeting with her was never just a meeting; it was an examination of conscience disguised as an office hour.

  For thirty-eight years, she has stood at the intersection of rigorous philosophy and deep faith. And if there is one thing that defines her tenure, it is that she never allowed those two things to comfort each other too much.

  Many of you know she is a wholehearted believer in the power of the Cross. But she was never content with a Sunday School version of what that means. She wanted to know how it worked. And she had a favorite way of pressing us on this. She would often bring up a short, sharp paper by the philosopher David Lewis.

  For the philosophers in the room, you know the one. For everyone else, the argument was simple. Lewis observed that in our daily lives, we are perfectly happy to let a stranger pay a debt for us. If you get a parking fine, and a friend pays it, the debt is cleared. Nobody feels cheated. But, Lewis noted, we would be horrified if a stranger offered to serve our prison sentence, or stand in front of a firing squad in our place. We instinctively feel that punishment belongs to the guilty. You can transfer a debt; you cannot transfer a punishment without violating justice.

  And then she would look at us over her glasses and ask the question that kept two generations of students awake at night: "So, which one is the Cross supposed to be? A fine? Or a firing squad?"

  She asked it bluntly. She asked it repeatedly. And if you are waiting for me to tell you that she finally found the tidy answer that solved the puzzle... I can't do that. Because she never did.

  For a long time, I thought this was a frustration. I thought a teacher's job was to lead you out of the maze. But standing here tonight, after thirty-eight years of her ministry, I realize that her refusal to solve that puzzle was actually her greatest gift to us.

  She understood that if the Gospel were easily reconciled with human ideas of justice, it would cease to be grace. It would just be a transaction. By holding that tension—by refusing to let the mystery be domesticated by philosophy, but also refusing to ignore the philosophy for the sake of the mystery—she taught us that the Cross is big enough to withstand our hardest questions.

  She taught the philosophers in this room that logic has limits. And she taught the congregation in this room that faith is not a shield against thinking hard. She showed us that you can live in the tension of a hard question without losing your footing. In fact, she showed us that loving the truth means respecting its complexity.

  She never gave us a way out of that question because she knew the answer isn't found in a lecture. It's found in the life we lead after the lecture is over. It's found in the service she gave this community, the patience she showed her students, and the grace she extended even when the logic didn't add up.

  So, I would like to invite everyone to please raise their glasses.

  To our dear friend and teacher. Thank you for the hard questions. Thank you for the honest silence. And thank you for showing us that some mysteries are not meant to be solved, but lived.

  To your health, and to your rest. Cheers.
