answer: |-
  The debate between monistic and pluralist theories of metaphysical grounding centers on whether the relation of "in virtue of" is a single, unified structural feature of reality or a family of distinct dependence relations tailored to specific ontological domains. This tension becomes acute when analyzing **institutional facts**—such as the status of a piece of paper as legal tender or the existence of a contractual obligation. These facts appear to rest on a dual foundation: a physical/psychological substrate (brains, bodies, paper) and a normative/social superstructure (collective acceptance, constitutive rules).

  ### 1. The Monistic Constraint and the Institutional Problem

  **Metaphysical Grounding Monism** posits that there is only one grounding relation ($\prec$). This relation is typically characterized by strict formal conditions: it is **irreflexive** (nothing grounds itself), **asymmetric** (if $A \prec B$, then $\neg(B \prec A)$), and **transitive**. For the monist, reality forms a single, well-ordered hierarchy culminating in the fundamental physical base.

  For institutional facts, monism creates a pressure toward **reductionism**. If a contract ($C$) is grounded in collective acceptance ($A$), and collective acceptance is grounded in physical/psychological states ($P$), transitivity demands that $P \prec C$.
  *   **The Tension:** Institutional facts possess normative properties (rights, obligations) that seem categorially distinct from physical properties. If $P \prec C$ directly, the monist risks explaining away the normative "oomph" of the contract, reducing it to mere physical movements.
  *   **The Overdetermination Worry:** If the monist attempts to preserve the normative layer by saying $A \prec C$ and $P \prec A$, they must ensure no circularity arises. However, institutional facts often involve feedback loops (the existence of money influences the psychological states that sustain money). Strict asymmetry forbids this. Consequently, monists often struggle to account for the *synchronic* dependence of institutional facts on ongoing collective acceptance without violating the strict unidirectionality of the grounding chain.

  ### 2. The Pluralist Response: Domain-Specific Relations

  **Grounding Pluralism** argues that "grounding" is a generic term covering distinct relations (e.g., $\prec_{phys}$, $\prec_{norm}$, $\prec_{soc}$). A pluralist can assert that physical states $\prec_{phys}$ ground psychological states, while collective acceptance $\prec_{soc}$ grounds institutional facts.

  **Handling Institutional Facts:**
  Pluralism accommodates the dual nature of institutional facts more naturally. The physical paper is the *vehicle*, grounded physically. The status of "legal tender" is the *value*, grounded socially.
  *   **Avoiding Overdetermination:** In a monistic framework, if both Physical Base ($P$) and Normative Rule ($N$) fully ground Institutional Fact ($I$), we face **grounding overdetermination** (two sufficient grounds for one fact). This threatens the uniqueness of the metaphysical explanation. Pluralism avoids this by relativizing the formal conditions. $P$ is the full ground relative to $\prec_{phys}$, and $N$ is the full ground relative to $\prec_{soc}$. Since the relations are distinct, they do not compete; thus, asymmetry is preserved *within* each domain, and overdetermination is dissolved because there is no single metric against which both are competing sufficient grounds.

  ### 3. The Collapse Worry: Grounding vs. Causal-Constitutive Explanation

  The primary objection to pluralism is that by multiplying grounding relations to fit specific domains, we risk **collapsing metaphysical grounding into causal-constitutive explanation**.

  *   **The Distinction:** Metaphysical grounding is meant to be constitutive and synchronic (what makes a thing what it is *now*). Causal explanation is diachronic (what events led to this).
  *   **The Risk:** If $\prec_{soc}$ is defined merely as "dependence on collective acceptance," critics argue this looks like a sociological causal claim (people believing in money *causes* it to function) rather than a metaphysical one (the belief *constitutes* the money).
  *   **Formal Conditions as a Safeguard:** To prevent collapse, pluralists must insist that even domain-specific relations retain the formal hallmarks of grounding (irreflexivity, asymmetry). If $\prec_{soc}$ allows for circularity (e.g., money grounds acceptance which grounds money), it ceases to be grounding and becomes a causal loop.
  *   **The Verdict on Collapse:** Pluralism avoids collapse only if it maintains that social grounding is **constitutive**. For example, the rule "X counts as Y in context C" is not a causal generalization but a constitutive rule that makes the status fact obtain. If the pluralist treats these rules as merely functional or causal, the distinction vanishes. However, if they treat them as metaphysical constraints within the social domain, the distinction holds, but at the cost of fragmenting the concept of "reality."

  ### 4. Assessment: Layered Fundamentality and Social Autonomy

  Can a **layered, domain-relative conception of fundamentality** preserve the autonomy of social ontology without sacrificing the core motivation for a distinct metaphysical dependence relation?

  **Yes, but with qualifications.**

  1.  **Preserving Autonomy:** A layered view successfully protects social ontology from aggressive physical reductionism. It acknowledges that while social facts depend on physical facts, they are not *exhausted* by them because the *mode* of dependence (social grounding) introduces normative properties that physical grounding cannot generate. This validates the intuition that a contract is more than ink on paper.
  2.  **Maintaining Metaphysical Bite:** To avoid sacrificing the core motivation for grounding (explaining the structure of reality), the layered conception must assert that domain-relative grounds are still **metaphysical**, not merely conceptual or epistemic. This means accepting that "fundamentality" is not a global peak but a local property. A social fact can be fundamental *relative to the social domain* even if it is derivative relative to the physical domain.
  3.  **The Compromise:** This approach requires a **structural pluralism**. We accept multiple grounding relations to handle the heterogeneity of institutional facts, but we unify them under a generic schema of **non-causal dependence**.

  **Conclusion:**
  The tension between monism and pluralism reveals that institutional facts strain the classical, strictly hierarchical model of metaphysics. Monism preserves the unity of science but threatens to erase the normative reality of social structures. Pluralism preserves social autonomy but risks fragmenting metaphysics into disconnected discourses.

  A layered, domain-relative conception offers the most viable path forward. It avoids overdetermination by recognizing that physical and normative grounds operate on different axes of dependence. It avoids collapsing into causal explanation by insisting that social grounding remains constitutive (defining what a contract *is*) rather than merely causal (explaining how a contract *persists*). Thus, social ontology can remain autonomous—governed by its own grounding rules regarding status functions and collective intentionality—without denying that the social world ultimately supervenes on the physical. The cost is the abandonment of a single "Great Chain of Being," replaced by a mosaic of interlocking but distinct metaphysical structures.
