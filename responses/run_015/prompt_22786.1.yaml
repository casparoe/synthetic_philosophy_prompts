      *   *Properties:* Haecceitists typically accept *impure* properties (properties involving specific individuals) or primitive haecceities as legitimate properties.
      *   *Addressing Point 1 (Triviality):*
          *   If the property is "being identical to $a$," then $a$ has it and $b$ does not.
          *   *Critique:* This makes PII analytic/trivial. $\forall x \forall y (x=y \leftrightarrow \forall F(Fx \leftrightarrow Fy))$. If "being identical to $x$" counts as $F$, then distinctness *guarantees* a difference in properties.
          *   *Haecceitist Defense:* They might argue haecceities are *sui generis* non-qualitative properties, not just logical tautologies like "being identical to $a$." However, the standard criticism is that this saves PII at the cost of making it uninteresting.
      *   *Status of Black's Universe:* Possible. The spheres are distinct because they have different haecceities. PII is technically true (if haecceities count as properties) or false (if PII is restricted to qualitative properties). Usually, Haecceitists reject the *qualitative* restriction of PII.

