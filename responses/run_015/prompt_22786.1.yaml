  6.  **Refining the Argument:**
      *   *Haecceitism:* Relies on "impure properties" (e.g., $x = a$). This makes PII analytic. $\forall x \forall y (x \neq y \rightarrow \exists F (Fx \land \neg Fy))$ is true if $F$ is "being identical to $x$." This is the "Triviality Objection." Haecceitists might argue haecceities are *sui generis*, but they still function solely to individuate, leading to the same charge.
      *   *Non-Haecceitism:* If they deny haecceities, they must ground distinctness in qualities. If Black's spheres share *all* qualities, the Non-Haecceitist must say either (a) they are actually one object (denying Black's setup) or (b) the scenario is impossible. They are not committed to saying it's *logically* impossible, but *metaphysically* impossible given their theory of objects. Can they accept it? Only by abandoning PII. But as a *response* defending PII, they claim impossibility.
      *   *Comparison:* The Haecceitist saves PII by expanding the domain of properties to include identity-involving ones. The Non-Haecceitist saves PII by restricting the domain of possible worlds.
      *   *Triviality:* The Haecceitist view is widely regarded as rendering PII trivial. The Non-Haecceitist view keeps it substantive. Therefore, Non-Haecceitism handles the triviality problem more cleanly.

  7.  **Structure of the Response:**
