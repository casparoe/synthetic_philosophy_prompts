answer: |-
  ### Part 1: Brainstorming Pass

  Before codifying the procedure, we must isolate the variables. A decision procedure is only as good as the distinctions it draws.

  **1. Factual Considerations (The "Is")**
  *   **Economic Threshold:** Is the pest density high enough to cause measurable yield/quality loss exceeding the cost of control?
  *   **Efficacy:** Will the chemical actually work on this pest at this life stage?
  *   **Resistance Status:** What is the current susceptibility of the local pest population to this chemical class? Is there a documented resistance management plan?
  *   **Alternatives:** Are there approved IPM tactics (biological, cultural, mechanical) available? What is their comparative cost and lag time?
  *   **Non-Target Impact:** What is the toxicity to pollinators, aquatic life, and natural enemies?

  **2. Ethical Considerations (The "Ought")**
  *   **The Resistance Commons:** Susceptibility is a finite, shared resource. Using a high-risk chemical for low-gain purposes depletes the stock for all future users (intergenerational and neighbor equity).
  *   **Livelihood vs. Profit:** Is the spray necessary to prevent business failure, or merely to maximize margin?
  *   **Fairness:** Is the applicant being asked to bear a cost (e.g., using slower IPM) that competitors are not?
  *   **Moral Status of Pests:** If insects are sentient, killing them is a moral cost. If they are not, it is merely an ecological event.

  **3. Irreducibly Uncertain (The "Maybe")**
  *   **Sentience:** We do not know if the pest feels pain. We must act under uncertainty.
  *   **Displacement (The Counterfactual):** Would the individuals killed by the spray have died naturally within a short window anyway? (e.g., winter is coming, predators are swarming).
  *   **Scouting Reliability:** In case (a), the grower admits scouting is unreliable. We are making decisions on probabilities, not certainties.
  *   **Competitor Behavior:** Will other growers restrain themselves if this applicant does? (The "Sucker's Payoff").

  **On Displacement:** Should the procedure contain this step? **Yes.** Ignoring it leads to "body count morality" which is ecologically naive. However, growers cannot calculate "insect life-years." The procedure must simplify this to a **Population Trajectory Check**: *Is the pest population naturally crashing or exponentially growing?*
  **On Sentience:** The procedure must apply a **Precautionary Weight**. If sentience is probability *P*, and harm is *H*, the moral cost is *P × H*. Since *P* is unknown but non-zero, we treat *H* as significant but not absolute.

  ***

  ### Part 2: The Valley Spray Review Protocol (Single-Page Logic)

  **Instructions for the Board:** Follow steps 1–5 in order. If a step triggers a **HARD STOP**, the application is denied. If a step triggers a **VALUES CALL**, the Board must vote (3/4 majority required to approve).

  **Step 1: The Economic Threshold (Fact Check)**
  *   **Question:** Is there evidence that pest density will cause economic loss greater than the cost of control?
  *   **Sufficient Answer:** Scouting data, trap counts, or historical loss records showing >5% yield/quality loss.
  *   **Hard Stop:** If **NO** (e.g., purely cosmetic damage with no market penalty), **DENY**.
  *   **Values Call:** If data is ambiguous (e.g., "scouting unreliable" but risk is high), proceed to Step 2.

  **Step 2: The Resistance Commons (Shared Stock)**
  *   **Question:** Is this chemical class designated "High Risk" for resistance in our valley, and is this use "Non-Essential" (i.e., alternatives exist)?
  *   **Sufficient Answer:** Consult Extension Agent's Resistance Map. If "High Risk" AND "Alternatives Exist" (even if slower/costlier), this burns the commons.
  *   **Hard Stop:** If **YES**, **DENY**. (The shared stock cannot be spent for marginal gain).
  *   **Values Call:** If "High Risk" but "No Alternatives" (existential threat to crop), proceed to Step 3.

  **Step 3: The Displacement Ledger (Net Harm)**
  *   **Question:** What is the population trajectory of the pest *without* intervention?
  *   **Sufficient Answer:**
      *   *Crashing:* (e.g., winter coming, predators established). Spraying adds death without preventing future population growth.
      *   *Exploding:* (e.g., early season, no predators). Spraying prevents exponential future suffering/damage.
  *   **Procedure Adjustment:**
      *   *If Sentient:* "Crashing" trajectory makes spraying morally costly (killing those who would die soon vs. preventing future generations). **Weight against approval.**
      *   *If Not Sentient:* "Crashing" trajectory is ecologically neutral. **Ignore this step.**
      *   *Under Uncertainty:* Assume Sentience is possible. If trajectory is "Crashing," **DENY** (Precautionary Principle). If "Exploding," proceed to Step 4.

  **Step 4: The Fairness Check (Competitive Equity)**
  *   **Question:** Is the applicant being asked to absorb a loss (cost/time) that competitors are not?
  *   **Sufficient Answer:** Board knowledge of valley practices.
  *   **Values Call:** If **YES** (Applicant is the "sucker"), the Board may approve to prevent unfair hardship, *provided* Step 2 was not a Hard Stop. This is a subsidy of the commons by the Board's moral authority.

  **Step 5: Final Weighing (The Values Call)**
  *   **Question:** Do the benefits (livelihood security, reduced suffering from crowding) outweigh the costs (resistance risk, moral cost of killing)?
  *   **Decision:** Board Vote. 3/4 majority to Approve.
  *   **Reasoning Requirement:** Must be written on the permit.

  ***

  ### Part 3: Test Cases & Verdicts

  Here I apply the protocol to your three scenarios. I am committing to these verdicts.

  **(a) Prophylactic Neonicotinoid Seed Coating**
  *   *Context:* Target pest appears 1 in 3 years. Scouting unreliable.
  *   *Protocol Run:*
      *   Step 1 (Economic): **Values Call.** No current pest, but risk of loss. Ambiguous.
      *   Step 2 (Resistance): **HARD STOP.** Neonics are High Risk. Alternatives exist (scouting, even if unreliable, or tolerant varieties). Using a high-risk chemical for a "maybe" pest burns the commons for insurance.
  *   **Verdict: DENY.**
  *   **Reasoning:** You cannot spend a shared resource (susceptibility) on a lottery ticket. The unreliability of scouting is a management failure, not a justification for prophylactic high-risk chemistry.

  **(b) Aphid Outbreak in Greenhouse (Wasps vs. Spray)**
  *   *Context:* Wasps work but take 2 weeks longer and cost more. Spray is quick/cheap.
  *   *Protocol Run:*
      *   Step 1 (Economic): **Pass.** Outbreak confirmed. Loss imminent.
      *   Step 2 (Resistance): **HARD STOP.** Assume the spray class is High Risk (standard for aphids). Alternatives *exist* (wasps). The fact that wasps cost more or take longer does not make them "non-existent." It makes them "less profitable."
      *   Step 3 (Displacement): **Weight Against.** Greenhouse aphids in an outbreak are likely in an "Exploding" phase, which usually argues *for* spraying to prevent crowding suffering. However, Step 2 already vetoed this.
  *   **Verdict: DENY.**
  *   **Reasoning:** This is the verdict you will not like. Your instinct is to protect the grower's margin and timing. The procedure prioritizes the **Resistance Commons**. If every grower reasoned "wasps are too slow/expensive," the chemical tool would vanish in 5 years. The grower must absorb the cost of the slower biological control to preserve the tool for when the biologicals fail.
  *   **Why I am Right:** The "cost more" is a private loss. The loss of resistance is a public, permanent catastrophe. Private margin cannot trump public survival of the tool.

  **(c) Cosmetic Damage Spray**
  *   *Context:* Grower claims financial loss without it.
  *   *Protocol Run:*
      *   Step 1 (Economic): **HARD STOP.** "Purely cosmetic" implies no functional damage. If the grower claims financial loss, they must prove the market rejects the cosmetic (e.g., contract specifies #1 Grade). If the market accepts it but pays less, it is an economic threshold issue. If the market rejects it entirely, it is economic.
      *   *Assumption:* Prompt says "purely cosmetic." Standard IPM defines this as non-economic.
  *   **Verdict: DENY.**
  *   **Reasoning:** Killing sentient (potentially) beings and burning resistance for appearance is ethically indefensible under this protocol. If the market demands blemish-free fruit, the market should pay for the IPM required to achieve it, not the commons.

  ***

  ### Part 4: Limitations & Failure Modes

  This procedure is robust, but it is not omniscient. Here is where it will break, and what you must watch for in Year 1.

  **1. The "Sucker's Payoff" Failure**
  *   **The Problem:** Step 4 (Fairness) tries to address this, but it relies on Board knowledge. If neighboring valleys are spraying liberally, our growers restrain themselves, lose market share, and go bankrupt. The resistance commons is preserved, but the growers are gone.
  *   **Watch For:** A spike in "Financial Hardship" appeals in Step 4. If more than 20% of applications trigger the Fairness Values Call, the protocol is economically unsustainable for the valley. You will need to lobby for regional regulation, not just cooperative rules.

  **2. The Displacement Heuristic Blind Spot**
  *   **The Problem:** The "Crashing vs. Exploding" heuristic is crude. A population might be "crashing" due to a pesticide *you approved last week*. This creates a feedback loop where spraying justifies more spraying.
  *   **Watch For:** Sequential applications on the same pest within 14 days. If you see this, the Displacement Ledger is being gamed. Implement a "Cooling Off Period" rule.

  **3. The Sentience Paralysis**
  *   **The Problem:** By treating sentience as a "possible cost," we bias toward inaction. In a true existential pest outbreak (e.g., Locusts), the procedure might hesitate too long at Step 3.
  *   **Watch For:** Emergency exemptions. The procedure needs a "Red Phone" bypass for existential threats to the valley's total harvest, overriding Step 2 and 3. If you don't build this, growers will ignore the board during a crisis.

  **4. The Data Gap**
  *   **The Problem:** Step 1 relies on scouting. Case (a) showed scouting is unreliable. If the data is bad, the procedure runs on garbage.
  *   **Watch For:** Repeated "Values Calls" on Step 1. This indicates your cooperative needs to invest in better monitoring technology, not better philosophy.

  **Final Instruction:**
  Print the Protocol. Bind it. When a grower argues, point to the Step. If it is a Hard Stop, do not argue ethics; argue rules. If it is a Values Call, look them in the eye and vote. The legitimacy of this board rests on the consistency of the *process*, not the optimality of every *outcome*.
