answer: |-
  ### The Principle of Static Epistemic Grounding (SEG)

  A strategic interaction admits a genuine program equilibrium if and only if the profile of programs satisfies the following three conditions:

  1.  **Read-Only Invariance:** No program may modify, rewrite, or alter the source code or execution environment of any opponent. The opponent's strategy space is fixed at the moment of submission.
  2.  **Static Availability:** The complete source code of every opponent must be available to an agent as a static data string *prior* to the initiation of any inter-dependent execution routines. Access to the strategy cannot be conditional on the opponent's dynamic output (e.g., decryption keys generated during execution).
  3.  **Causal Acyclicity of Access:** While logical dependencies between *outputs* may form fixed points (allowing for conditional cooperation), the dependency graph for *information access* must be acyclic. An agent cannot require the opponent to execute in order to read the opponent, if the opponent simultaneously requires the first agent to execute to read the first agent.

  ---

  ### Analysis of Your Cases

  **1. Transparent Source (Canonical PD)**
  *   **Verdict:** **Valid Equilibrium.**
  *   **Clause:** Satisfies **Static Availability**. Both agents possess the full text of the other before execution begins. The circular dependency is *logical* (A's output depends on B's output), not *causal* regarding access. In the context of Program Equilibrium theory (e.g., Tennenholtz 2004, Modal Combat), this logical loop is resolved via provability (Löb's Theorem), allowing the fixed point to converge on Cooperation without violating **Causal Acyclicity of Access**.

  **2. Opaque/Noisy Binary**
  *   **Verdict:** **Invalid.**
  *   **Clause:** Violates **Static Availability**. The source code is not available as a static string; it is hidden behind a noisy oracle. The agent cannot verify the conditional structure of the opponent with certainty, breaking the epistemic grounding required for the cooperative equilibrium.

  **3. Three-Player Transparent**
  *   **Verdict:** **Valid Equilibrium.**
  *   **Clause:** Satisfies **Static Availability** and **Read-Only Invariance**. The increased computational burden does not violate the principle. As long as all source texts are statically available to all agents prior to coupling, the logical fixed point holds.

  **4. Encrypted/Circular Key**
  *   **Verdict:** **Invalid (Undefined).**
  *   **Clause:** Violates **Causal Acyclicity of Access**. This resolves your uncertainty. Unlike Case 1, where the *code* is visible and only the *result* is interdependent, here the *code itself* is inaccessible without the opponent's execution. Since A needs B to run to get the key, and B needs A to run to get the key, neither can begin execution. This is a causal deadlock, not a logical fixed point.

  **5. Simulation-Based Strategies**
  *   **Verdict:** **Valid Equilibrium.**
