      *   **Context:** Called out a dev for missing deadlines in a retro. Dev pointed out User does it too ("you literally do this every week"). User admitted it ("yeah, fair"). User is now tasked with running a 40-minute session for other team leads on "giving critical feedback when you're not exactly clean yourself."
      *   **Goal:** A structured plan for the session (order of ideas, dependencies), not an explanation of the topic itself.
      *   **Constraints:**
          *   Audience: Engineers (want yes/no rules, no philosophy background).
          *   Time: 40 minutes.
          *   Content: Must address specific misconceptions (a-e).
          *   Specific Case: Must use a hypothetical example (not the user's), ideally one where criticism is obviously correct and critic is obviously guilty.
          *   Specific Dilemma: Does owning the hypocrisy ("I'm late, but you're late") buy standing back?
          *   Exclusions: What to refuse to discuss (e.g., deep metaphysics of blame).
          *   Closing: One diagnostic question.
          *   **Crucial Requirement:** Take a definitive stance on whether hypocritical blame is *unfair* or just *unwise/ineffective*. Apply this stance to the user's specific situation (apologize, drop, or raise differently). No "on the one hand, on the other hand."

  2.  **Deconstruct the Core Philosophical/Practical Problem:**
      *   *The Problem:* Tu Quoque (You Also). Just because I do it, doesn't mean you shouldn't. But if I do it, do I have the *right* to say it?
      *   *The Tension:* Truth of the claim vs. Standing of the speaker.
      *   *The User's Instinct:* "I still think the complaint was correct and I can't work out how both of those can be true." (They can be true because truth and standing are separate dimensions).
      *   *The "Owning It" Question:* Does admitting hypocrisy restore standing?
          *   *Analysis:* It restores *trust* and *effectiveness*, but it doesn't necessarily restore moral *authority* in a strict deontological sense. However, in a pragmatic engineering context, it shifts the dynamic from "Parent vs. Child" to "Peer vs. Peer struggling with the same bug."
      *   *The Stance:* I need to pick one: Unfair vs. Unwise.
          *   *Option A (Unfair):* Hypocritical blame violates a norm of reciprocity. It treats the other as a means to an end or asserts a superiority one doesn't possess.
          *   *Option B (Unwise):* It's strategically stupid. It triggers defensiveness. It undermines culture. But the blame itself isn't morally wrongful, just pragmatically doomed.
          *   *Decision:* For an engineering leadership context, **Unwise/Ineffective** is the stronger, more actionable stance. Calling it "Unfair" invites moral grandstanding and defensiveness (which engineers hate). Calling it "Ineffective" invites optimization (which engineers love). *However*, the prompt asks me to commit to whether it's *genuinely unfair* OR *just unwise*.
          *   *Refinement:* Actually, looking at the user's distress ("going round my head"), calling it merely "unwise" might feel like dodging the moral weight. But calling it "unfair" might paralyze them.
          *   *Stronger Argument:* It is **Unfair** in a specific sense: it asserts a normative authority you haven't earned. It's not that the *content* is false, it's that the *act* of blaming imposes a burden you aren't willing to carry yourself. That is a fairness issue regarding the *relationship*, not the *fact*.
          *   *Wait, let's look at the "Engineers want yes/no" constraint.* If I say "It's unfair," they might think "So I can never criticize." If I say "It's unwise," they might think "So I can do it if I'm willing to pay the price."
          *   *Best Fit:* **It is Unfair.** Why? Because blame is a social practice requiring standing. Without standing, it's not blame, it's harassment. This gives a clearer rule for engineers: "Fix your standing before you speak."
          *   *Correction:* Actually, the most useful distinction for *leaders* is that hypocritical blame undermines the *system* of accountability. It's unfair to the *team*, not necessarily the individual.
          *   *Let's go with the "Unfair" stance.* It's more robust. It forces the leader to fix themselves first. It aligns with the user's feeling that something was "off" beyond just "it didn't work."
          *   *Wait, re-reading the prompt:* "Pick one, defend it, and then tell me what follows for my own mess."
          *   *Decision:* I will argue it is **Genuinely Unfair**. Specifically, it violates the principle of *reciprocity* required for normative authority.
          *   *Implication for User:* You cannot simply "raise it some other way." You must repair standing first.

  3.  **Develop the Session Plan (The "Shape"):**
      *   **Time:** 40 mins.
      *   **Audience:** Engineers (logic-driven, pragmatic).
      *   **Example:** Needs to be clear. *Safety* is usually the best domain for this. A manager telling devs to wear badges when the manager doesn't. Or Code Review standards. Let's go with **Code Review Standards**. It's relatable.
      *   **Sequence:**
          1.  **Separate Truth from Standing:** (User's intuition is correct).
          2.  **Define Standing:** It's not about being perfect; it's about shared burden.
          3.  **The "Owning It" Move:** Does confession help? (Yes, but conditionally).
          4.  **Address Misconceptions:** Weave these into the flow.
          5.  **The Hard Line:** What we aren't discussing.
          6.  **The Diagnostic Question.**

  4.  **Addressing the Misconceptions (Timing):**
      *   (a) "Hypocrite can never say anything true": Address immediately after separating Truth/Standing.
      *   (b) "Answer is just don't do the thing": Address when defining Standing (it's about trajectory/effort, not perfection).
      *   (c) Tu Quoque (always a dodge): Address when discussing the "Owning It" move. Sometimes it's a valid challenge to authority.
      *   (d) Hypocrisy vs. Inconsistency: Address early. Hypocrisy is claiming an exemption you deny others.
      *   (e) Blame has no force if no standing: Address near the end. The *fact* remains, the *authority* is gone.

  5.  **Drafting the Content - Step-by-Step:**

      *   **Stance:** Hypocritical blame is **Unfair**. It asserts a privilege you haven't earned.
      *   **Advice to User:** Apologize for the *manner/standing*, not the *content*. Re-raise the deadline issue only after fixing your own process or explicitly partnering on the solution.
      *   **The Example:** "The Commenting Standard." Lead demands 30% comment density. Lead's own PRs have 5%.
      *   **The "Owning It" Case:** "I know my PRs are bare, and I'm working on it. But yours are breaking the build." Does this work? It works *if* there's a plan. It fails if it's just an excuse.

  6.  **Refining the Flow (The "Moves"):**
