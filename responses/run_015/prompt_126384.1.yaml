      *   **Framing:** The colony is the subject; ants are modalities.
      *   **Task:** Identify real defeaters (arguments against this view), ranked from Fatal to Awkward.
      *   **Specifics:** Include experimental evidence (trail disruption), philosophical arguments (unity of consciousness/point of view), and evolutionary arguments.
      *   **Meta-Analysis:** Determine which defeaters defenders would concede vs. dismiss.
      *   **Critical Question:** Has this view been qualified into unfalsifiability, and is that a problem?
      *   **Constraint:** No citations, just straight reasoning.

  2.  **Deconstruct the "Colony Mind" Hypothesis:**
