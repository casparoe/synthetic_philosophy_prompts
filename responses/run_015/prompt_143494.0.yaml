  1. You argue Calvinist values reshaped the background conditions of rational action rather than pushing capitalism like a billiard ball, but doesn't that just move the causality problem into a black box? If values only become operative when material structures are already ripe, how do you distinguish their influence from mere incidental noise?

  2. If capital accumulation made ascetic values attractive to merchants looking to justify their wealth, aren't those values just post-hoc rationalizations? How do you demonstrate that the ethics preceded the economic behavior rather than simply legitimizing practices that were already profitable?

  3. Critics argue your view collapses into functionalism where culture only tracks economic needs, so how do you show values having independent weight? If the culture shifts only when it serves the economy, isn't culture still just a dependent variable in your model?

  4. Regarding the Scottish Presbyterian counterexample of strong ascetic values but weak capital accumulation, do you treat that as falsifying noise or just an outlier? If you dismiss it as an exception, aren't you protecting your thesis from the very evidence that should test its limits?

  5. You say values reshape what counts as rational economic action, but if actors are still maximizing utility, isn't the calculus ultimately economic? How do you prevent this 'thin causal' reading from dissolving into a claim that culture merely decorates decisions driven by material incentive?
