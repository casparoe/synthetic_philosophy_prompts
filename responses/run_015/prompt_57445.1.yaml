      I recommend we remove the book from consideration.

      We are divided because our founding documents contain a tension: they mandate recognizing a book's "achievement" while simultaneously existing to honor "integrity in the reporting of science." Those favoring the award argue the text is silent on author conduct outside the final text. Those favoring disqualification argue the intimacy we praised was obtained by breach. I side with the latter because the method of reporting cannot be severed from the integrity of the report.

      The strongest case for the reading I reject rests on a strict textualism regarding "achievement." One could argue that the prize evaluates the object submitted, not the biography of its creator. If the book stands as a coherent, impactful work of science communication, penalizing it for ethical breaches during its construction conflates the art with the artist. Furthermore, the documents do not explicitly list ethical violations as disqualifying criteria. By this logic, introducing conduct standards now constitutes mission creep, setting a precedent where jurors must investigate private contracts rather than evaluate public writing. This argument respects the boundary between our role as critics and our role as moral arbiters, suggesting that if the founders wanted conduct to matter, they would have codified specific exclusions.

      However, this reading ignores the clause honoring "integrity in the reporting of science." Integrity is not a characteristic of a printed page; it is a characteristic of process. If the reporting process violates fundamental ethical promises to subjects, the integrity is compromised regardless of the literary quality. To award this book would signal that integrity is optional so long as the resulting narrative is compelling.

      Regarding the evidence, we must address what a prize jury should treat as established when an allegation has never been adjudicated. We are not a court of law requiring proof beyond a reasonable doubt. We are a journalistic body evaluating journalistic work. Our standard must be the preponderance of evidence based on available documentation. Here, the account is documented, the family confirms the promise, and the author admits the exchange occurred, disputing only the characterization. For our purposes, the breach is established. Waiting for legal adjudication would abdicate our responsibility to judge science writing on science writing timelines. We must act on the best available information rather than hiding behind the lack of a verdict.

      To guide future deliberations where misconduct is not merely adjacent to the work but constitutive of it, I propose the "Constitutive Harm Test." We must ask: Could this narrative exist without the misconduct? If the access, the data, or the emotional intimacy central to the book's distinction was secured through deception or breached confidentiality, the misconduct is constitutive. In such cases, the work is tainted at its spine. If the misconduct were peripheral—for example, if the author plagiarized a footnote but reported the primary narrative honestly—the harm might be adjacent. But here, the child's illness supplies the narrative spine. The intimacy we singled out for praise was the direct product of the breached promise. The misconduct is not a footnote; it is the foundation.

      Some may argue that striking the book punishes the subject matter or silences a important story. But protecting the ecosystem of science writing requires enforcing trust between reporters and subjects. If families believe promises of anonymity are expendable for the sake of a prize-winning book, future reporting becomes impossible. Our decision sets a boundary for the profession.

