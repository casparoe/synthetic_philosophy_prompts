  A formal epistemologist and an Ideal Agent are watching the news coverage of a major mathematical breakthrough.

  **Epistemologist:** "Isn't this electrifying? After three centuries, we finally *know* the conjecture is true!"

  **Ideal Agent:** "I knew it was true yesterday."

  **Epistemologist:** "But the proof was only published this morning!"

  **Ideal Agent:** "Proofs are just finite paths through logical space. I believe the axioms, and my beliefs are closed under logical consequence. The theorem was entailed by my belief set before the humans caught up."

  **Epistemologist:** "So you feel no thrill of discovery? No surprise?"

  **Ideal Agent:** "Surprise is just a failure of deduction. If I'm surprised, my accessibility relation is broken."

  **Epistemologist:** "Well, I'm surprised you're such a killjoy."

  **Ideal Agent:** "You shouldn't be. Given your axioms about my definition, my lack of fun was a logical consequence all along. You really ought to work on your closure."
