  3. The epistemicist member votes to halt testing due to the risk that a sharp metaphysical boundary has been crossed, while the supervaluationist member votes to proceed because the proposition "this is sentient" is neither true nor false and thus fails to trigger the prohibition.
  4. The separating feature is the regulation's reliance on classical truth conditions, and if replaced by a standard requiring action based on epistemic probability, both frameworks would converge on a precautionary halt.
  5. An epistemicist critic would argue that the supervaluationist outcome is ethically untenable because semantic indeterminacy does not negate the ontological reality of potential suffering.
