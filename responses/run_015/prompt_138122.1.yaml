answer: |-
  **Q&A Prep Sheet**

  **1. Ministry Lawyers:** "This 'no-context' clause creates precedent for unlimited restitution claims."
  **Reply:** "This establishes a moral record, not legal liability; existing statutes explicitly bar retroactive claims."
  **Weakness:** Relies on statutes remaining unchanged.

  **2. Descendant Associations:** "We publicly stated we didn't want this. Why impose an apology we rejected?"
  **Reply:** "This secures state truth, not your consent; denial foreclosure serves the future polity, not past healing."
  **Weakness:** Treats victims as means to state ends.

  **3. Government Archivist:** "Nine thousand is disputed. Codifying an indefensible number is dishonest."
  **Reply:** "Approximate figures prevent erasure; precision invites denialist nitpicking on margins."
  **Weakness:** Undermines archival rigor.

  **4. Justice Practitioners:** "Removing historical context stops us learning why this happened."
  **Reply:** "Context becomes mitigation; denial migrates from 'it didn't happen' to 'it was normal'."
  **Weakness:** Flattens historical complexity.

  **5. Ministry Lawyers:** "Condemning a lawful act undermines the current rule of law."
  **Reply:** "Legality is not morality; we judge past acts by current norms without voiding past legality."
  **Weakness:** Risks retrospective legal instability.

  **6. Justice Practitioners:** "This ignores restorative justice needs in favor of bureaucratic record-keeping."
  **Reply:** "Restoration requires fixed truth; this builds the truth floor upon which restoration stands."
  **Weakness:** Prioritizes record over healing.

  **7. Political Theorists:** "Can the 2024 state truly speak for the 1948 cabinet?"
  **Reply:** "State continuity permits withdrawing prior authorization specifically, not rewriting history."
  **Weakness:** Metaphysical contention on identity.

  **8. Any Attendee:** "Your grandmother's name on the lists biases the draft's rigidity."
  **Reply:** "Personal stake ensures resistance to dilution; the text stands on logic, not lineage."
  **Weakness:** Perceived conflict of interest.

  ***

  **Near-Certain Objections:** #1 (Lawyers/Liability) and #2 (Descendants/Consent).

  **Opening Concession:** Begin with: "I acknowledge the descendant associations have not requested this apology." This disarms the legitimacy charge before it becomes an attack.

  **Critical Reply:** Reply #4 (Context/Mitigation) must land. If you concede context, the "no-context clause" dies, and the thesis collapses into standard historical acknowledgement.

  **The Dreaded Question:** "Did you know about your grandmother before writing the draft?"
  **Answer:** "No. I found her name six months ago. It confirmed the urgency, not the argument."
