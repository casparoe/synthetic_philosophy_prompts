answer: |-
  Your intuition about the "institutional burden asymmetry" is sharp and often overlooked in standard textbook accounts. You have identified a procedural engine that drives the substantive deadlock. However, calling it merely procedural risks understating the metaphysical chasm beneath it. The stalemate persists because the burden of proof is allocated differently *precisely because* Hart and Devlin disagree on what constitutes a threat to the state.

  Here is the diagnosis of the stall, broken down by your proposed categories, followed by a verdict on progress.

  ### 1. The Burden Asymmetry: Procedural or Substantive?
  You are right that Devlin treats existing moral consensus as a public good akin to national security, while Hart treats individual liberty as the default position requiring justification for infringement. But this is not just a rule of evidence; it is a clash of ontologies.

  For Devlin, society is an organic entity held together by invisible bonds of shared conception. Therefore, any significant shift in morality is structurally analogous to treason—it attacks the integrity of the entity itself. The burden lies on the reformer because the *status quo* is the condition of society's existence.

  For Hart, society is a collection of individuals. The "bond" is political and legal, not moral. Therefore, state coercion is the threat, not moral divergence. The burden lies on the state because coercion is the intrusion.

  So, is it substantive disagreement in procedural clothing? Yes. The procedure (who bears the burden) is simply the operational expression of the substance (what kind of thing "society" is). You cannot resolve the burden dispute without first settling the metaphysical one.

  ### 2. Diagnosing the Stall
  The debate stalls because it operates simultaneously on three levels, and interlocutors usually switch between them without noticing.

  **A. Verbal (The Definition of Harm and Society)**
  There is a significant verbal component. Devlin expands "harm" to include "social disintegration," whereas Hart restricts "harm" to tangible setbacks to individual interests. If disintegration is a harm, Devlin wins; if it is not, Hart wins. Similarly, they talk past each other on "society." Devlin means a community of ideas; Hart means a political structure. When Hart asks for evidence of disintegration, he is looking for crime rates or political collapse. Devlin is pointing to social alienation and the loss of shared meaning. They are measuring different variables.

  **B. Hidden Empirical (The Disintegration Thesis)**
  This is the weakest link in Devlin's armor, yet the hardest to disprove. Devlin claims that loosening shared morality leads to social collapse. Hart demands empirical proof. The stall occurs because this is unfalsifiable in the short term. Societies do change morally without immediately collapsing (as Hart noted), but Devlin could argue the decay is slow, generational, or cultural rather than political. Because the timeline for "disintegration" is indefinite, the empirical claim functions more like a article of faith. Neither side can produce a knockout empirical blow.

  **C. Bedrock Intuitions (Disgust vs. Autonomy)**
  This is the true bedrock. Devlin relies on the rationality of collective emotion—specifically intolerance, indignation, and disgust. He argues that if the "man on the Clapham omnibus" feels deep disgust, that feeling itself is evidence of a moral boundary essential to society. Hart views this as irrational prejudice. For Hart, disgust is precisely what law must filter out, not encode. For Devlin, disgust is the sensory mechanism by which society detects threats to its survival. You cannot argue someone out of a bedrock intuition about whether collective disgust is a valid legal datum.

  ### 3. What Would Count as Progress?
  Since the bedrock intuitions are unlikely to shift, progress will not come from abstract theory winning out. It will come from refining the tools we use to apply these theories to specific legislative contexts.

  **The Critical vs. Positive Morality Distinction**
  You suggested applying this to legislative inertia, and that is the most promising path. Devlin distinguishes between "positive morality" (what people actually believe) and "critical morality" (what people ought to believe upon reflection). He admits positive morality can be wrong, but argues the law must generally follow it to maintain cohesion.
  Progress lies in interrogating *when* legislative inertia becomes harmful. Hart assumes inertia is safe (liberty is preserved). But in modern contexts (e.g., assisted dying or drug policy), maintaining the old moral consensus may cause tangible harm (suffering, black markets).
  If we can demonstrate that adhering to Devlin's "shared morality" creates the very disintegration he fears (by breeding resentment, inequality, or loss of trust in law), we turn his empirical thesis against him. This moves the debate from "Morality vs. Liberty" to "Which strategy best preserves social cohesion?"

  **Case Studies over Principles**
  The debate stalls in the abstract because both sides can construct coherent worlds. Progress happens in the particular.
  *   **Online Harm:** Devlin might argue that unchecked online expression fragments shared reality (disintegration). Hart might argue regulation chills autonomy. A resolution requires analyzing specific mechanisms: does this specific regulation prevent tangible harm, or does it merely enforce a moral preference?
  *   **Assisted Dying:** Here, the "harm" is contested. Is it harm to the sanctity of life (Devlin) or harm to the individual's autonomy and suffering (Hart)? Progress is made not by solving the principle, but by designing safeguards that minimize the risk of error regardless of which principle holds.

  ### Verdict
  The debate is unresolvable at the level of first principles because it rests on incompatible views of human flourishing and social ontology. Devlin sees flourishing as embedded in a shared moral order; Hart sees it as embedded in individual choice.

  However, the debate is *manageable* if we accept your burden asymmetry insight. We should treat Devlin's claim not as a trump card for tradition, but as a cautionary note about the speed of legal change. We should treat Hart's claim not as a ban on moral legislation, but as a rigorous requirement for justification.

  Progress looks like this: acknowledging that while the state cannot enforce morality for its own sake (rejecting Devlin's bedrock), it must account for the social cost of dismantling shared norms (accepting Devlin's empirical warning). The shift is from "Is this moral?" to "Is the social cost of changing this norm outweighed by the harm of keeping it?" That moves the stalemate from metaphysics to policy analysis.
