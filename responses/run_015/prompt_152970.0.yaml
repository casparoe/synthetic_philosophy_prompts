      *   *The Committed Position:* I need to split how this presumption works.
          *   *Belief-Artifacts:* Objects that *seem* to encode meaning (symbols, text, specific ritual placement). Here, the presumption should be *high skepticism*. Just because it looks symbolic doesn't mean it reflects a shared cosmological belief. It could be habit, aesthetics, or individual whim.
          *   *Institutional-Residue:* Objects that require coordination to exist (standardization, mass production, resource allocation). Here, the presumption should be *lower skepticism*. It is harder to get 100 pots to look identical without some form of coordination (institution) than it is to bury one person facing east without a complex cosmology.
      *   *The Split:* High bar for "Belief" (internal state), Lower bar for "Institution" (external coordination).

  3.  **Drafting the Decision Procedure (The "20-Minute Gate"):**
