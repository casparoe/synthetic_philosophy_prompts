answer: |-
  # The 20-Minute Interpretive Gate: A Decision Procedure for Museum Plaques

  **Purpose:** To prevent over-interpretation of material culture while allowing robust claims where the evidence supports them.
  **Time Cost:** ~20 Minutes per plaque draft.
  **Philosophical Stance:** **The Asymmetry Principle.** We treat inferences about *Belief* (internal states/meaning) differently from inferences about *Institutions* (external coordination/practice).
  *   **For Belief:** Presume **Independence**. Just because two people did the same thing doesn't mean they shared the same thought. The burden of proof is on the *connection*.
  *   **For Institution:** Presume **Dependence**. High-fidelity standardization across time/space usually requires transmission and coordination. The burden of proof is on the *lack of connection*.

  ---

  ## Part 1: The Procedure (Flowchart-in-Words)

  Run through these four gates in order. If you stop at any gate, follow the instruction.

  ### Gate 1: Pattern Integrity (5 Minutes)
  **Question:** Is the pattern statistically or visually robust, or is it an anecdote?
  *   **Test:** Look at the sample size ($N$) and the variance.
      *   If $N < 10$ or variance is high (e.g., "most face East, but some face North, West, and Down"): **STOP.**
      *   If the pattern is cherry-picked from a larger, messy dataset: **STOP.**
  *   **Sufficient Answer:** "The pattern is consistent across >80% of the relevant assemblage."
  *   **Outcome:**
      *   **Fail:** Do not infer anything. Label as "Variable Practice."
      *   **Pass:** Proceed to Gate 2.

  ### Gate 2: The Equifinality Check (5 Minutes)
  **Question:** Can this pattern be explained by physics, economics, or biology *without* invoking belief or institutions?
  *   **Test:** List three non-social causes.
      *   *Example:* Burial orientation aligns with prevailing wind? Tool shape dictated by available stone grain?
      *   *Example:* Ceramic shift caused by a new clay source drying differently?
  *   **Sufficient Answer:** "Environmental or material constraints do not fully account for the variance."
  *   **Outcome:**
      *   **Fail:** Attribute to environment/technology. Do not infer belief or institution.
      *   **Pass:** Proceed to Gate 3.

  ### Gate 3: The Asymmetry Split (5 Minutes)
  **Question:** Are you inferring a **Belief** (meaning/cosmology) or an **Institution** (coordination/standardization)?
  *   **Branch A: Belief Claim (e.g., "Cosmology," "Ritual," "Symbolism")**
      *   **Rule:** Presume Independence. Did they *have* to share a belief to do this?
      *   **Test:** Is there a secondary correlate? (e.g., Orientation + Grave Goods + Iconography).
      *   **Threshold:** High. One pattern is never enough for belief. You need a "cluster" of symbolic behaviors.
      *   **Outcome:** If only one behavioral line exists (e.g., just orientation), **DOWNGRADE** to "Tradition" or "Custom." Do not use the word "Belief" or "Cosmology."
  *   **Branch B: Institution Claim (e.g., "Oversight," "Standardization," "Production Control")**
      *   **Rule:** Presume Dependence. Is the precision too high for independent invention?
      *   **Test:** Look for "Costly Signaling." Does the standardization require extra labor or resource allocation that individuals wouldn't voluntarily sustain?
      *   **Threshold:** Moderate. If the standardization is complex and widespread, coordination is the default explanation.
      *   **Outcome:** If standardization is high, **ALLOW** inference of "Coordination" or "Shared Practice." Avoid specific political labels (e.g., "State") unless there is architectural evidence.

  ### Gate 4: The Values Handoff (5 Minutes)
  **Question:** Does the inference carry political or ethical weight that the data cannot settle?
  *   **Test:** Does the claim imply coercion, hierarchy, or sacred authority that descendants or local communities might contest?
  *   **Sufficient Answer:** "The data shows coordination, but the *nature* of that coordination (voluntary vs. coercive) is unknowable."
  *   **Outcome:**
      *   **Flag:** If the plaque implies **Authority/Control**, you must add a qualifier (e.g., "suggests," "may indicate").
      *   **Sign-off:** If qualifiers are added, you may sign. If the text asserts authority as fact, **REJECT**.

  ---

  ## Part 2: The Committed Position (Why This Split?)

  You asked for a defense of the procedure's core logic. Here it is:

  We treat **Belief** and **Institution** asymmetrically because they leave different kinds of material traces.

  1.  **Belief is "Light":** Two neighbors can bury their dead facing East for entirely different reasons (one loves the sunrise, one fears the dark, one copied the other without asking why). Materially, the result is identical. Therefore, we must **Presume Independence**. We cannot assume a shared mental world just because we see a shared physical action. To infer "Cosmology," we need a *system* of symbols, not a single habit.
  2.  **Institution is "Heavy":** To produce 500 pots with identical rim diameters and temper ratios across three generations requires training, resource access, and quality control. It is materially inefficient for 50 individuals to independently invent the *exact* same complex constraint. Therefore, we **Presume Dependence**. Standardization is a fossil of coordination. We do not need to know *why* they coordinated to know *that* they coordinated.

  **The Risk:** This procedure will systematically under-report "Belief" and over-report "Institution." This is intentional. It is worse to invent a theology for the dead than it is to acknowledge that the living had to organize their labor.

  ---

  ## Part 3: Application to Your Three Cases

  Here is how the procedure runs on your specific drafts.

  ### Case 1: Standardized Burial Orientations
  *   **Claim:** "This burial orientation reflects a cosmological belief."
  *   **Gate 1 (Pattern):** Pass. (Assume 90% face East).
  *   **Gate 2 (Equifinality):** Pass. (Terrain doesn't force East).
  *   **Gate 3 (Asymmetry):** **FAIL.** This is a Belief Claim.
      *   *Reasoning:* Orientation is a single behavioral line. It passes the "Tradition" threshold but fails the "Cosmology" threshold. It could be habit, not theology.
      *   *Procedure Output:* **DOWNGRADE.**
      *   *Revised Text:* "This consistent orientation suggests a shared **custom** or **tradition** regarding the dead." (Remove "Cosmological Belief").
  *   **Gate 4 (Values):** Pass. (Custom is low stakes).
  *   **Verdict:** Sign only if "Cosmological Belief" is removed.

  ### Case 2: Abrupt Shift in Ceramic Manufacture
  *   **Claim:** "This tool standardization shows institutional oversight."
  *   **Gate 1 (Pattern):** Pass. (Assume sudden uniformity across sites).
  *   **Gate 2 (Equifinality):** Pass. (Clay source didn't change; technique did).
  *   **Gate 3 (Asymmetry):** **PASS.** This is an Institution Claim.
      *   *Reasoning:* Abrupt, widespread standardization is "Heavy." It implies knowledge transmission and quality enforcement. The Presumption of Dependence applies.
      *   *Procedure Output:* **ALLOW.**
      *   *Revised Text:* "The rapid standardization indicates **coordinated production practices**." (Swap "Institutional Oversight" for "Coordinated Practices" to stay safe on Gate 4).
  *   **Gate 4 (Values):** Flag. "Oversight" implies a boss. "Coordination" implies a system.
  *   **Verdict:** Sign if "Oversight" is changed to "Coordination."

  ### Case 3: Repetitive Decorative Motif on Domestic Pottery
  *   **Claim:** "Institutional residue present." (Colleague hates this; feels it implies ritual authority over everyday life).
  *   **Gate 1 (Pattern):** Pass. (Motif is ubiquitous).
  *   **Gate 2 (Equifinality):** Pass. (Motif is complex, not a natural byproduct of firing).
  *   **Gate 3 (Asymmetry):** **PASS.** This is an Institution Claim.
      *   *Reasoning:* High-fidelity replication of complex motifs across households implies a "school" of practice or a shared normative system. That *is* an institution (in the sociological sense of 'established custom/practice').
      *   *Procedure Output:* **ALLOW "Institutional Residue."**
  *   **Gate 4 (Values):** **HANDOFF.**
      *   *The Conflict:* Your colleague hears "Institution" and thinks "State/Religious Coercion." The procedure defines "Institution" as "Sustained Coordination."
      *   *The Fix:* The procedure validates the *coordination*, not the *coercion*.
      *   *Revised Text:* "The motif's consistency indicates a **strong normative tradition** shared across households."
  *   **Verdict:** This is the **Values Handoff**. The procedure says the *fact* of coordination is real (Institutional Residue). Your colleague is objecting to the *political flavor* of the word "Institution."
      *   *Action:* Do not change the finding (coordination existed). Do change the label to "Normative Tradition" to satisfy the ethical constraint without lying about the material evidence.

  ---

  ## Part 4: What This Procedure Cannot Do

  Be explicit with your colleague: This tool has blind spots. It will not protect her from the following errors:

  1.  **It Cannot Identify Specific Meanings:** It can tell you a burial pattern is a "Tradition," but it can never tell you if East means "Sun God," "Ancestral Home," or "Wind Direction." Any plaque naming a specific deity or myth is outside the gate.
  2.  **It Cannot Distinguish Voluntary from Coercive:** It can identify "Coordination" (Case 2 & 3), but it cannot tell you if that coordination was enforced by a king or agreed upon by a guild. If the plaque says "State Control," the procedure flags it as a guess.
  3.  **It Cannot Detect "Silent" Institutions:** If an institution existed but left no material standardization (e.g., a loose oral tradition, a non-hierarchical leadership), this procedure will output "No Evidence." It is biased toward bureaucratic traces.
  4.  **It Cannot Resolve Community Disputes:** If local descendants say "Our ancestors never followed rules," and the pottery says "They used identical molds," this procedure sides with the pottery. It is a tool for material honesty, not diplomatic peacekeeping.

  **Final Instruction to Curator:**
  If the procedure tells you to **STOP**, do not sign.
  If the procedure tells you to **DOWNGRADE**, edit the text.
  If the procedure flags a **VALUES HANDOFF**, discuss the specific word choice (e.g., "Authority" vs. "Tradition") but do not deny the material pattern.

  This keeps your name on facts, not fantasies.
