answer: |-
  **Classification Review Board: Social Kind Determination Procedure**

  **Objective:** Classify proposed categories as either "Tracking Categories" (routine hard-coding) or "Constructed Kinds" (mandatory opt-in, sunset review, anti-reification safeguards).

  **Step 1: Institutional Dependence Check**
  *Question:* Does the kind exist independently of human agreement or institutional rules?
  *Sufficient Answer for "No":* The kind refers to biological or physical facts observable without institutional validation (e.g., blood type, altitude).
  *Stop Point:* If **No**, classify as **Tracking Category**. End procedure.
  *Human Sign-off:* Required if the kind mixes biological markers with social interpretation (e.g., sex vs. gender).

  **Step 2: Interactive Loop Check**
  *Question:* Does classifying individuals into this kind alter their self-conception or behavior, thereby changing the kind's extension?
  *Sufficient Answer for "Yes":* Evidence exists that awareness of the classification influences how members act or identify (e.g., diagnostic labels affecting community formation).
  *Note:* A "No" here does not stop the procedure but flags the kind as "Stabilized" rather than "Interactive."

  **Step 3: Counterfactual Dissolution Check (Niche Test)**
  *Question:* If this agency and its rulebook vanished tomorrow, would people still face a coordination problem requiring this kind to solve practical issues?
  *Sufficient Answer for "Yes":* The kind persists as a tool for community coordination or resource allocation independent of the state (Normative Residue).
  *Sufficient Answer for "No":* The kind disappears entirely or reverts to mere habit without practical coordination utility (Administrative Disappearance).
  *Stop Point:* If **No**, classify as **Tracking Category**. If **Yes**, classify as **Constructed Kind**.

  **Human Sign-off Required:** Distinguishing between entrenched habit and genuine coordination problems in Step 3.

  ***

  **Application to Proposals**

  **(1) Neurotype in Employment Surveys**
  *Step 1:* Partially dependent (diagnosis requires institutions), but traits exist independently. Proceed.
  *Step 2:* **Yes.** Labeling affects identity, support access, and workplace behavior (Interactive Loop).
  *Step 3:* **Yes.** Without federal surveys, neurodivergent communities would still coordinate around these categories for advocacy and support (Normative Residue).
  *Result:* **Constructed Kind.** Triggers opt-in and sunset review. Data collectors must accept reduced comparability for ethical compliance.

  **(2) Central-Bank Digital Currency (CBDC) Unit**
  *Step 1:* **No.** Exists only via institutional rule. Proceed.
  *Step 2:* **No.** Holding the unit does not alter individual identity or behavior in a feedback loop regarding the classification itself.
  *Step 3:* **No.** If the central bank vanished, the unit would cease to exist; no private coordination problem would sustain it (Administrative Disappearance).
  *Result:* **Tracking Category.** Permits routine hard-coding in GDP reports.

  ***

  **Limitations and Ontological Status**

  **Settled Consensus:**
  Specialists agree that institutional facts (like currency) depend on collective acceptance, whereas brute facts (like gravity) do not. There is also consensus that some classifications interact with the classified, altering the phenomenon itself.

  **Contested Issues:**
  This procedure cannot resolve deep philosophical disputes. First, it remains contested whether all interactive kinds necessarily require institutional backing, or if some emerge organically without formal rules. Second, economists and ontologists disagree on whether macro-level economic kinds (like inflation rates) exhibit looping effects similar to human kinds; this procedure treats them as non-interactive for safety, though some argue aggregate behavior shifts based on reported metrics. Finally, the distinction between "habit" and "coordination problem" in the Dissolution Check is interpretive; borderline cases involving cultural norms without formal institutions may yield inconsistent results without senior adjudication.

  This procedure prioritizes civil-rights safeguards over statistical convenience where normative residue exists, acknowledging that some categories create the reality they measure.
