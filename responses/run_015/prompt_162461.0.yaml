              *   *Wait, 5 mins is tight.* Let's simplify. The "Uncountable" bus. The previous bus was countable (1, 2, 3...). This bus is "All possible patterns."
              *   *Better:* Keep it simple. The "Decimal" bus. Each guest represents a number between 0 and 1. The new arrival constructs a number not on the list.
