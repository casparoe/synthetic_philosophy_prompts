  **Overall Comment**
  This is an excellent script that demonstrates a sophisticated grasp of the provided texts and engages creatively with the hypothetical stipulations. The argument in part (b) is particularly strong and defensible. However, precision in defining key terms in part (c) prevents a perfect score.

  **Part (a) [4/4]**
  You have accurately stated the difference between the extreme and moderate theses using the language of the handout, and you have correctly identified that the Aetolian case engages the moderate thesis (as the bill appeals to societal survival rather than bare immorality). You have also adhered strictly to the three-sentence limit. Full marks.

  **Part (b) [8/8]**
  Your central move here—that Devlin's argument relies on protecting a *common morality* whereas Aetolia relies on a *convention of deference*—is defensible based on the handout's definition of legal moralism and the stipulations regarding Aetolia's lack of a first-order moral code. You correctly identify that the limits-of-toleration standard requires more than a headcount, and you argue coherently that without a shared morality, the Aetolian reaction collapses into mere disapproval. While your assertion that "nothing in Aetolia's cohesion is therefore at stake" tensions slightly with the sociologists' agreement in stipulation (iii), it is acceptable as a claim that nothing of the *relevant kind* for Devlin's theory is at stake. This shows high-level engagement with the materials. Full marks.

  **Part (c) [6/8]**
  You successfully apply Hart's first two strands: you treat the disintegration thesis as an empirical claim requiring evidence (which you supply) and you effectively use the false belief stipulation to challenge the "reasonable member" standard. However, you lose marks on accuracy. In your final paragraph, you define "legal moralism" as "the view that the law may coerce people for their own good". The handout explicitly states that legal moralism is "not to be confused with legal paternalism, the view that conduct may be criminalised in order to protect the agent from himself". Your definition describes paternalism, not moralism. This contradicts the authoritative text provided and costs you marks under the accuracy criterion.
