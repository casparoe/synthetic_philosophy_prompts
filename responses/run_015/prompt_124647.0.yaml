      Look, you're conflating the moral quality of the act with the reader's assessment of the character's arc. When that woman lets her brother take the fall in scene one, we condemn the act but hope for redemption; when she does it in the final page, we condemn the act and resign ourselves to her corruption. The wrongness hasn't shifted, only our expectation of repentance. You say readers call her a 'worse person' in the second version, but that's a judgement on her entrenched disposition, not the atomic morality of the betrayal itself. The principle 'do not sacrifice an innocent sibling for self-preservation' holds true in both instances; what changes is the aggravating factor of habitual vice, which is itself a stable moral reason, not a holistic flip.

      As for your stopping point, you're assuming principles must be blind algorithms to be contentful. They aren't. We can acknowledge that context affects the *weight* of a reason without conceding that it changes its *valence*. The fact that it's the climax of a tragedy doesn't turn betrayal into a virtue; it merely highlights the totality of the moral failure. You're a novelist, so you see life as a narrative sweep, but morality isn't a plot device. It's the grid we lay over the story to judge it. If you dissolve that grid into the story itself, you haven't proved particularism; you've just abolished the distinction between ethics and aesthetics.

