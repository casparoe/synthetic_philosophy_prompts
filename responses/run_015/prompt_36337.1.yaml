  8.  **Final Polish:** Organize with clear headings. Ensure the "Joint Statement" framing is clear. (Self-Correction: Make sure the table is formatted clearly in Markdown).

  9.  *(Final thought on the "Prediction" requirement)*: The prompt asks for "each side's prediction written down in advance." This implies a bet on how a specific case resolves morally or practically. I will frame these as "Moral Verdict Predictions."

