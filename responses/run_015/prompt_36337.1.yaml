answer: |-
  # JOINT STATEMENT ON THE ETHICS OF COMBATANCY
  **An Adversarial Collaboration**

  **Signatories:**
  *   **Dr. A. (Traditionalist):** Defends the Moral Equality of Combatants and the Independence Thesis.
  *   **Dr. B. (Revisionist):** Defends the Asymmetry Thesis and Liability based on Responsibility.

  **Context:** Following the departmental seminar on [Date], we acknowledge that our disagreement is not merely terminological but strikes at the foundation of how we conceptualize violence, authority, and individual agency in war. This document maps our common ground, isolates our substantive divergences, and identifies the specific empirical and philosophical cruxes that determine the outcome of our debate.

  ---

  ### I. SHARED CLAIMS

  We agree on the following propositions, which form the basis of our continued dialogue:

  1.  **The Reality of Harm:** War necessarily involves the intentional infliction of lethal violence and severe suffering. Any ethical framework that cannot account for the mitigation of this suffering is defective.
  2.  **The Combatant/Non-Combatant Distinction:** There is a morally significant distinction between those directly participating in hostilities and those who are not. Non-combatants possess a stronger claim to immunity than combatants, regardless of the justice of the war.
  3.  **Categorical Distinction:** *Jus ad bellum* (the justice of resorting to war) and *jus in bello* (justice in the conduct of war) are distinct *categories* of moral evaluation. We disagree on whether they are *independent* in application, but we agree they ask different questions.
  4.  **Epistemic Limitations:** Combatants generally operate under conditions of severe epistemic constraint ("the fog of war"). They rarely have access to the full evidence regarding the proportionality or necessity of the war they fight.
  5.  **The Function of Rules:** The laws of armed conflict (LOAC) currently codify the Traditionalist view (symmetry of combatant status). We agree that existing international law does not track the Revisionist moral ontology.
  6.  **Individual Agency:** Soldiers are moral agents, not merely automatons. While they operate within a chain of command, they retain some capacity for moral judgment, though the extent of this capacity is a point of contention.

  ---

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  | Feature of the Dispute | Traditionalist Position (Dr. A) | Revisionist Position (Dr. B) |
  | :--- | :--- | :--- |
  | **Moral Equality of Combatants (MEC)** | **Affirmed.** Combatants on both sides possess an equal right to attack one another and are equally liable to be attacked. | **Denied.** Only combatants fighting for a just cause (or those excused from fighting for an unjust cause) possess the right to attack. |
  | **Source of Liability** | **Status-Based.** Liability arises from posing a lethal threat as an agent of a hostile force. Moral guilt is not required. | **Responsibility-Based.** Liability arises from individual moral responsibility for an unjust threat. Mere threat-posing is insufficient. |
  | **Relation of *Ad Bellum* to *In Bello*** | **Independence.** The justice of the cause does not determine the permissions of conduct. An unjust combatant can fight permissibly. | **Dependence.** *Jus in bello* permissions derive from *jus ad bellum* status. Fighting for an unjust cause is prima facie wrongful killing. |
  | **Normative Force of Convention** | **High.** The "War Convention" creates moral obligations that exist independently of deep morality to facilitate regulation. | **Low.** Conventions are heuristics. If a convention contradicts deep morality (e.g., permitting unjust killing), it lacks moral force. |

  ---

  ### III. THE CRUXES

  We identify three specific points of contention where our theoretical commitments yield divergent practical verdicts. For each, we stipulate a case and record our conflicting predictions.

  #### Crux 1: Epistemic Access and the Excusing Power of False Belief
  **The Issue:** Does a combatant's sincere, non-culpable belief that their war is just render them non-liable to defensive attack, or does their objective role as a threat render them liable regardless of belief?

  **The Case:** *The Misinformed Defender.*
  Country A launches a surprise, unprovoked attack on Country B. Country B's government, however, has a secret history of planning such an attack themselves and merely got beaten to the punch. The soldiers of Country B are told truthfully that they are under attack and falsely that their nation is innocent of aggression. They fight defensively based on this information. They are objectively fighting an unjust war (because their nation was planning aggression), but subjectively they are defending their homeland against an actual strike.
  *   **Question:** Are Country B's soldiers liable to be killed by Country A's soldiers?

  **Predictions:**
  *   **Traditionalist:** **Liable.** Their objective status as armed threats in an active conflict renders them liable. Their internal beliefs regarding the broader *ad bellum* context do not alter their *in bello* status. To hold otherwise is to demand epistemic access soldiers do not possess.
  *   **Revisionist:** **Not Liable (or Significantly Less Liable).** Liability tracks responsibility for unjust harm. If their ignorance of their nation's secret aggressive intent is non-culpable, they are "innocent threats." Killing them is permissible only under strict necessity constraints, similar to killing a bystander to save a life, not as a matter of combatant privilege.

  #### Crux 2: The Source of Authority (Fairness vs. Truth)
  **The Issue:** Do the rules of war derive their authority from being fair terms of cooperation imposed on people forced to fight, or from tracking the deeper facts about moral liability?

  **The Argument:** *The Reciprocity Constraint.*
  If the rules of war are to effectively limit violence, they must be acceptable to combatants on both sides. If one side is told "You are morally forbidden to fight," they may reject the rules entirely, leading to greater brutality. Therefore, symmetrical rules are justified by their consequences (limiting horror), even if they are metaphysically false regarding individual liability.

  **The Case:** *The Surrender Paradox.*
  An enemy soldier surrenders. Under the War Convention, they are immune from attack. However, intelligence reveals with certainty that this specific soldier, if released, will return to the front immediately and kill five of your comrades. Deep morality suggests they are still a lethal threat. The Convention says they are safe.
  *   **Question:** Which authority binds the soldier?

  **Predictions:**
  *   **Traditionalist:** **The Convention Binds.** The rule exists to maintain a reciprocal system that saves lives overall. Violating the convention undermines the institution of surrender, leading to more deaths long-term. The soldier is morally obligated to spare the surrendering enemy, even if deep morality suggests otherwise.
  *   **Revisionist:** **Deep Morality Binds.** Conventions are only proxies for moral truth. If we *know* the surrendering soldier remains an unjust threat, the convention offers no moral shield. Liability is restored immediately upon the return of the threat. Adhering to the rule here is fetishizing a heuristic over human life.

  #### Crux 3: Conscripts in Wars of Aggression (Believed Defensive)
  **The Issue:** How do coercion and epistemic limitation interact for conscripts fighting for an aggressor state that believes it is defending itself?

  **The Case:** *The Conscripted Patriot.*
  Country X is a closed society. The state controls all media. Country X invades Country Y, but the population of X is told Y is amassing troops to invade them. The soldiers are conscripts; refusal means imprisonment or execution of their families. They fight to "defend" their homes from the supposed aggression of Y.
  *   **Question:** Are these conscripts legitimate targets for Country Y's professional army?

  **Predictions:**
  *   **Traditionalist:** **Legitimate Targets.** They are combatants. The symmetry of danger applies. To exempt them would grant immunity to the aggressor's foot soldiers, making defense of the victim state impossible. Their duress is a matter for post-war tribunals or blame, not battlefield liability.
  *   **Revisionist:** **Generally Immune (unless necessary).** These soldiers are akin to "innocent threats." They are coerced and non-culpably ignorant. They do not bear sufficient responsibility for the unjust threat to be liable to defensive killing. Country Y may only kill them if there is no other way to stop the invasion (a high threshold).

  ---

  ### IV. VERBAL DISPUTES AND GENUINE MOVERS

  **1. Where we suspect we are talking past each other:**
  We acknowledge a potential verbal dispute regarding the term **"Liability."**
  *   **Dr. A** often uses "liable" to mean "permissibly targetable under the conventions of war without subsequent punishment."
  *   **Dr. B** uses "liable" to mean "has forfeited their right not to be killed in virtue of their moral actions."
  *   **Resolution:** If Dr. A admits that conscripts in *The Conscripted Patriot* case are *morally blameless* even if targetable, and Dr. B admits they might be *targetable under extreme necessity* even if not liable, the gap narrows. We agree to distinguish **Targetability** (practical permission) from **Moral Liability** (forfeiture of rights).

  **2. What would genuinely move us:**
  *   **For Dr. A (Traditionalist) to shift:** Evidence that asymmetric rules (telling one side they cannot fight) actually *reduce* overall atrocities in civil wars or interstate conflicts, rather than causing the disadvantaged side to abandon the laws of war entirely. A robust account of how individual soldiers can be expected to know *ad bellum* facts without paralyzing their effectiveness.
  *   **For Dr. B (Revisionist) to shift:** A demonstration that the "Deep Morality" view leads to counter-intuitive results where victims of aggression are morally prohibited from defending themselves because the aggressors are non-liable innocent threats. A viable theory of **Collective Agency** that shows how individual soldiers *do* inherit the guilt of the state without violating individualist constraints.

  **Signed,**

  _________________________
  **Dr. A.**

  _________________________
  **Dr. B.**

  **Date:** _________________
