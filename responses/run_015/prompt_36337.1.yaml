          *   *Traditionalist Prediction:* Liable to attack (because they are a combatant), but perhaps blameless.
          *   *Revisionist Prediction:* Not liable (if non-culpable ignorance), or less liable. *Correction:* Revisionists usually say they are *objectively* wrong to fight, but might be *excused* from blame. However, liability to be killed is the key. McMahan argues non-culpable ignorance *can* mitigate liability, but doesn't erase the objective wrong. Let's refine: Traditionalist says liability is invariant to belief. Revisionist says liability tracks culpability/responsibility, so belief matters.
          *   *Refined Prediction:* Traditionalist: Liable. Revisionist: Not liable (or significantly less so) if ignorance is non-culpable.
      *   *Crux 2: Source of Authority (Convention vs. Deep Morality).*
