  5.  **Drafting Section 3: The Cruxes (The Hard Part):**
      *   *Constraint:* Push past slogans. Specific cases/arguments. Predictions.
      *   *Crux 1: Epistemic Access & False Belief.*
          *   *Issue:* Does ignorance of the war's injustice excuse liability?
