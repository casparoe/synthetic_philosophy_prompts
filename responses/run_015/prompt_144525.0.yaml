          *   *Implication:* Physical damage to an object is now violence against a subject. Property damage = Assault.

      *   *Idea 4: Reading speed.*
          *   *Refinement:* The mind thinks at the speed of the eye turning the page. Skimming = manic episode. Slow reading = sedation. Re-reading = Groundhog Day trauma.
          *   *Implication:* The reader controls the *time* of the mind.

      *   *Idea 5: The Substrate.*
