answer: |-
  Moral guilt is non-transferable and dies with the agent, but restitutionary liability attaches to continuous institutional structures holding unjustly acquired capital, while a distinct duty of recognition binds those who inherit the social standing produced by the injustice.

  This tripartite principle—dividing **Culpability** (agency), **Liability** (structural asset continuity), and **Recognition** (narrative inheritance)—accommodates your verdicts by separating what you owe because of what you *did*, what you owe because of what you *hold*, and what you owe because of who you *are* in relation to the history.

  **The Clauses and Forcing Cases**
  1.  **The Culpability Clause:** Moral guilt requires voluntary agency and knowledge. This is forced by **Case 1** (voter) and **Case 4** (endorser). It explains why **Case 3** (descendant) bears no guilt despite benefiting; they lacked agency in the original act.
  2.  **The Liability Clause:** Restitutionary debt attaches to the legal or institutional person that holds the unjustly acquired assets, regardless of personnel turnover. This is forced by **Case 5** (firm). The firm is liable not because the current shareholders benefited personally, but because the *legal entity* holds capital accumulated through the injustice. It also applies to **Case 8** (paintings); the liability travels with the specific asset, not the viewer.
  3.  **The Recognition Clause:** Those who inherit the social standing, national identity, or stability produced by the injustice owe a duty of acknowledgment and non-indifference, distinct from debt. This is forced by **Case 3** (indifference is wrong despite no guilt) and **Case 2** (resistor owes something political). The resistor owes not because they are guilty, but because they remain a beneficiary of the post-war political order that arose from the ruins, requiring solidarity with those excluded.
  4.  **The Decay Clause:** Liability fades as structural continuity breaks or specific unjust assets dissipate into the general commons; the Duty of Recognition does not fade. This is forced by **Case 6** (state liability fades) and **Case 7** (successor state).

  **Apology and Forgiveness**
  Under this framework, entities in **Case 5** (firm) and **Case 6** (state) cannot strictly "apologize," as apology requires moral agency they lack. They can only issue **Acts of Contrition**: binding commitments to repair and acknowledge harm. Conversely, descendants of victims cannot "forgive" the moral guilt of the dead perpetrators; that forgiveness belongs only to the victims themselves. However, victim descendants can **accept restitution** and **grant reconciliation**, which extinguishes the liability claim. If they refuse reconciliation without cause, they may violate their own Duty of Recognition, but the liability remains until settled.

  **Lapsing and Transformation**
  Liability lapses outright when the specific unjust assets are no longer traceable or the institutional continuity is severed (e.g., the firm goes bankrupt and ceases to exist, or the state dissolves completely without successor). It transforms into a general Duty of Recognition when assets dissipate into the general infrastructure (Case 6). The liability does not become "metaphysical"; it becomes diffuse political obligation. Your intuition in **Case 6** that liability fades is correct because the link between specific unjust assets and the current state budget weakens over time, whereas in **Case 5**, the corporate ledger maintains a sharper continuity of capital.

  **Case 5 vs. Case 6**
  You are not being inconsistent; **Case 5** and **Case 6** differ materially. The firm is a legal fiction designed for continuity of asset ownership; the state is a political reality subject to population turnover and sovereign changes. The firm's liability is precise (accounting); the state's liability is diffuse (taxation/policy). Therefore, the firm's liability persists longer and is more enforceable than the state's, which relies on the fragile continuity of political identity.

  **The Four-Way Distinction**
  The distinction between criminal, political, moral, and metaphysical guilt largely renames the problem rather than solving it. "Criminal" maps to Culpability (Case 1); "Political" maps to Liability and Recognition (Cases 2, 5, 6); "Moral" maps to Culpability and Recognition (Cases 3, 4); "Metaphysical" does no work and should be discarded. Your tripartite principle is more functional because it dictates *remedies* (prison vs. reparations vs. memorialization) rather than just labeling feelings.

  **Inaccommodated Verdicts and Overturning**
  My account cannot accommodate **Case 10** without contradiction. You state in **Case 9** that comparable wrongs do not cancel claims, yet in **Case 10** you admit subsequent suffering makes you *less* willing to press the claim. This is a psychological inconsistency, not a moral principle. Suffering inflicted upon Vardania later does not extinguish the debt owed to the minority population; to allow it to do so would treat justice as a ledger of pain rather than a structure of rights. I would overturn **Case 10**: the subsequent invasion is irrelevant to the liability incurred by the mid-century regime.

  Additionally, I must refine your verdict on **Case 3**. You deny guilt but hesitate on liability regarding the "family house." Under the Liability Clause, if the house was seized property, the descendant *is* liable for restitution regardless of their indifference or emigration. The "something wrong" you feel is not just a failure of Recognition; it is an unpaid Restitutionary Debt. You should be more confident here: they are not guilty, but they are liable.
