answer: |-
  The Chase-Sanborn argument presents a formidable challenge to non-eliminativist philosophies of mind by targeting the structural coherence of the qualia concept itself. Their claim is not merely that qualia are mysterious, but that the triad of **epistemic privacy**, **intrinsicness**, and **explanatory relevance** constitutes an impossible job description. To evaluate whether your proposed "phenomenal bookkeeping" strategy rescues the concept, or merely displaces the incoherence, we must first determine what work the bookkeeping is intended to do.

  ### Phenomenal Bookkeeping: Rescue or Relocation?

  The "phenomenal bookkeeping" approach treats qualia analogously to unobservable theoretical entities in physics (e.g., electrons or quarks), positing them via their structural relations within a nomological network rather than by direct ostension. On the surface, this appears to secure **explanatory relevance**: if qualia are nodes in a causal-structural model, they inherit the explanatory power of that model.

  However, against the Chase-Sanborn charge, this strategy likely **relocates the incoherence** rather than resolving it. The tension in the Chase-Sanborn triad arises because traditional qualia are defined by *how they are given* (intrinsically, privately) rather than *what they do*. By shifting to a bookkeeping model, you effectively redefine qualia as structural-functional roles. This secures explanatory relevance but abandons **intrinsicness** in the traditional sense. In physics, theoretical entities are defined entirely by their relational properties (charge, mass, spin); they have no "inner nature" distinct from their structural role. If your bookkeeping treats qualia similarly, you have conceded the eliminativist's point: the *intrinsically private* qualia of the introspective model do not exist; only the structural posits remain. If, conversely, you insist the bookkeeping entities retain an intrinsic core *distinct* from their structural role, you reintroduce the original problem: how does that intrinsic core contribute to the bookkeeping without being defined by it? If it contributes nothing, it is epiphenomenal; if it contributes, it is relationally defined.

  Therefore, phenomenal bookkeeping saves the *term* 'qualia' only by evacuating it of the metaphysical weight that generates the Chase-Sanborn paradox. It is a defence of functionalism, not of traditional qualia realism.

  ### Decisive Defeaters Against Chase-Sanborn

  To genuinely defeat the Chase-Sanborn position, one must demonstrate a metaphysical framework where intrinsic properties can be causally potent without being reduced to relational structures. Below are the primary candidates, ranked by severity.

  #### 1. Russellian Monism (Fatal Objection)
  This is the most severe threat to the Chase-Sanborn position. Russellian Monism posits that physical science describes the *structural-relational* aspects of matter, while the *intrinsic* nature of matter is phenomenal (or proto-phenomenal).
  *   **Why it defeats the triad:** It directly satisfies **intrinsicness** (qualia are the categorical base of physical properties) and **explanatory relevance** (they are the causal powers underwriting physical dynamics). **Privacy** is preserved as a limitation of third-person access to the intrinsic nature, not an ontological barrier.
  *   **Chase-Sanborn Response:** They might argue this is speculative metaphysics that violates causal closure or parsimony. However, this is a substantive objection, not a conceptual one. It admits the *coherence* of the triad while disputing its *truth*.
  *   **Severity:** **Fatal.** It shows the triad is metaphysically possible, undermining the claim of structural incoherence.

  #### 2. The Phenomenal Concept Strategy (PCS) (Severe Objection)
  PCS argues that the incoherence arises from confusing *concepts* with *properties*. We possess unique, demonstrative, recognitional concepts for our experiences (phenomenal concepts) that are distinct from our physical/functional concepts.
  *   **Why it defeats the triad:** It explains why the triad *seems* incoherent (the concepts operate differently) without requiring the *properties* to be non-physical or causally isolated. The property is physical (causally relevant, non-private), but the mode of access is private and direct.
  *   **Chase-Sanborn Response:** They often reject this as merely explaining the *illusion* of qualia rather than saving the phenomenon. They may argue that if the property is physical, it lacks the "intrinsicness" required by the introspective model.
  *   **Severity:** **Severe.** It dissolves the conceptual tension, though it may not satisfy those who believe the *ontology* must match the *introspective feel*.

  #### 3. Categorical Property Realism (Moderate Objection)
  This view challenges the Humean or purely dispositional view of causation presupposed by Chase-Sanborn. It argues that properties can be intrinsically categorical and yet causally potent without their causal role exhausting their identity.
  *   **Why it defeats the triad:** It attacks the assumption that "explanatory relevance" requires "relational definition." An intrinsic property can be a cause simply by being what it is, not by virtue of its relations to other events.
  *   **Chase-Sanborn Response:** They may dismiss this as obscure or incompatible with a scientific worldview.
  *   **Severity:** **Moderate.** It challenges the background metaphysics of the argument but requires a significant overhaul of standard causal theories.

  ### Unfalsifiability and Insulation

  Is the Chase-Sanborn position insulated by definitional moves? To a significant extent, **yes**. The argument relies on a "no-fools-gold" policy regarding the introspective model. If a defender proposes a theory where qualia are intrinsic yet causal (like Russellian Monism), the eliminativist can simply stipulate: "That is not what we mean by qualia; we mean properties that are intrinsic *and* inaccessible to structural analysis."

  However, the position is not entirely unfalsifiable. It is vulnerable to **formal constraints**. If a formal model of consciousness can be constructed where intrinsic variables are necessary for the system's stability or information processing (e.g., in Integrated Information Theory, though controversial), and these variables map onto behavioural reports, the claim of *structural incoherence* is empirically weakened. The Chase-Sanborn argument is strongest as a conceptual critique; it weakens if the "incoherent" posits become indispensable for successful scientific prediction.

  ### Ranking of Defeaters

  1.  **Russellian Monism:** (Most Damaging) Shows the metaphysical compatibility of the triad.
  2.  **Phenomenal Concept Strategy:** (Damaging) Shows the incoherence is epistemic, not ontological.
  3.  **Phenomenal Bookkeeping:** (Ineffective) Merely redefines the terms, conceding the core objection.

  A committed defender of Chase-Sanborn would concede that **Russellian Monism** is damaging because it grants the coherence of the triad, forcing them to argue against its plausibility rather than its possibility. They would dismiss **Phenomenal Bookkeeping** as a concession (admitting traditional qualia are gone) and treat **PCS** as an account of error theory rather than a vindication of qualia.

  ### Conclusion

  The Chase-Sanborn argument succeeds only if one accepts a specific, restrictive view of causation and property identity. It is not a logical proof of incoherence but a demonstration of incompatibility with a specific physicalist framework. Your "phenomenal bookkeeping" proposal, while methodologically sound for a science of mind, does not save the traditional qualia concept from this specific charge; it merely substitutes a functionalist surrogate. To defeat Chase-Sanborn decisively, one must step outside the bookkeeping metaphor and argue for a metaphysics where intrinsic natures are the engines of causal structure.

  Verdict: \answer{The Chase-Sanborn position is conceptually robust but metaphysically contingent; it is fatally undermined by Russellian Monism, which demonstrates the coherence of the triad, whereas phenomenal bookkeeping merely relocates the incoherence by redefining qualia functionally.}
