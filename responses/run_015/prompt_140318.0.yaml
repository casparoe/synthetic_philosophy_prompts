answer: |-
  # Q&A Preparation Sheet: Expected Value Fanaticism & Modal Scarcity

  **Candidate:** 4th-Year PhD Student
  **Time Limit:** ~2 minutes per reply (approx. 250–300 words spoken)
  **Strategy:** Concede the theoretical pressure point immediately to show intellectual honesty, then pivot to the *diagnostic* utility of your view (distinguishing mugging from x-risk) and the *preservation* of EV reasoning where it is robust.

  ---

  ### 1. The "Wrong Tool" Objection (Decision Theorist)
  **Phrasing:** "You're spending considerable energy constraining priors to save Expected Utility from itself. But if EU yields fanaticism, and you have to impose ad hoc constraints like 'Modal Scarcity' to stop it, why isn't the rational conclusion that EU is the wrong normative baseline? Why not simply adopt Risk-Weighted EU or bounded utility, which block fanaticism structurally without needing this complex distinction between 'anchored' and 'hypothesis-space' probabilities?"

  **Reply:**
  "I concede that if the only goal were to block fanaticism, Risk-Weighted EU is a more elegant mathematical solution. However, my goal isn't just to block the conclusion, but to explain the *source* of the intuition that mugging cases feel different from existential risk cases. Risk-Weighted EU treats both as high-stakes/low-probability inputs and dampens them via a risk function. My claim is that the mugging probability is epistemically defective in a way the x-risk probability is not.
  By focusing on the probability generation, I preserve linearity in EV for cases where our probabilistic models are robust—like climate modeling or AI alignment scenarios where we have mechanistic anchors. If we switch to Risk-Weighted EU, we lose the ability to aggregate small probabilities in those legitimate longtermist cases because the risk function dampens them indiscriminately. I am arguing for a filter on *admissibility* of probabilities, not a transformation of *value*. This allows us to remain EV maximizers where our epistemic footing is solid, which is a significant theoretical advantage over abandoning linearity entirely."

  **Concede:** Admit that for *purely* blocking fanaticism, alternative frameworks are mathematically cleaner.
  **Soft Spot:** You haven't proven why linearity is worth saving if it requires complex epistemic constraints.

  ### 2. The "Longtermism Killer" Objection (Ethicist)
  **Phrasing:** "This sounds like a sophisticated excuse for discounting the future. In x-risk mitigation, we often deal with 'unknown unknowns'—considerations we haven't thought of yet. If 'Modal Scarcity' requires probabilities to be anchored to articulable mechanisms fixed in advance, aren't you ruling out the very scenarios where longtermism is most vital? If we can't articulate the mechanism of a future pandemic or AI takeover precisely enough to satisfy your bound, do we ignore it?"

  **Reply:**
  "That is a crucial worry, and I concede that the line between 'unanchored residue' and 'mechanism-anchored uncertainty' is difficult to draw in practice. However, my distinction is not about *precision*, but about *source*. In x-risk cases, even if the probability is tiny, it is derived from a reference class of known physical or computational processes—e.g., the rate of mutation in viruses or the optimization pressure in neural networks. The total probability mass of these known mechanisms is bounded.
  In the mugging case, the probability comes from an open-ended hypothesis space of 'possible beings with powers I can't conceive.' There is no fixed reference class. My view demands that we quantify the uncertainty over the *mechanisms* we know exist, rather than assigning residue probability to mechanisms we cannot describe. This doesn't discount the future; it demands we ground our estimates in causal models rather than logical possibility. It forces longtermists to do harder work on mechanism, which I argue strengthens the field."

  **Concede:** Admit the operational boundary is fuzzy and risks being too strict if "mechanism" is interpreted too narrowly.
  **Soft Spot:** A clever longtermist argument can often be reframed as a "mechanism," making the distinction unstable.

  ### 3. The "Operationalization" Objection (Formal Epistemologist)
  **Phrasing:** "You talk about probabilities being 'anchored' to a reference class bounded from below by one over the number of live hypotheses. How is this computable? Who decides what counts as a 'live hypothesis' fixed in advance? This sounds like you're re-describing calibration problems in vague English. Without a formal rule for generating this bound, isn't 'Modal Scarcity' just a heuristic rather than a normative principle?"

  **Reply:**
  "I concede that I am not offering a fully automated algorithm for prior generation; that would require solving the problem of logical uncertainty. However, in formal epistemology, we often accept norms that are regulative ideals rather than computable functions. Think of 'coherence'—it's a norm, even if checking it is hard.
  My proposal is that a probability is admissible only if it belongs to a partition where the sum of probabilities is constrained by the agent's current modeling capacity. It is computable relative to a specific model specification. If the model is 'physics as we know it,' the hypothesis space is bounded. If the model is 'anything logically possible,' it is not. The norm tells us which model to use for decision-making. It's not a heuristic; it's a constraint on model selection under uncertainty, similar to how you might reject a statistical model that overfits. It tells us when our probability assignments are tracking structure versus when they are tracking our own ignorance."

  **Concede:** Admit it is not a closed-form algorithm and relies on agent-relative modeling capacity.
  **Soft Spot:** If it relies on agent capacity, it makes rationality subjective in a way that might violate inter-subjective agreement.

  ### 4. The "Risk-Weighted" Alternative (Decision Theorist)
  **Phrasing:** "Lara Buchak's Risk-Weighted Expected Utility handles the mugging case by attenuating the weight of low probabilities without needing to question their source. It respects the agent's risk attitude. Why is your epistemic constraint preferable to simply saying rational agents can be risk-averse regarding extreme stakes?"

  **Reply:**
  "Risk-Weighted EU is a powerful framework, but it treats the aversion to fanaticism as a *preference* parameter rather than an *epistemic* constraint. If we use Buchak's framework, we still have to input the probabilities. If the probability in a mugging case is epistemically garbage—because it's drawn from an unbounded residue—inputting it into *any* calculus, even a risk-weighted one, legitimizes it.
  My view is that these probabilities shouldn't enter the calculus at all. Furthermore, Risk-Weighted EU often implies violations of separability and dynamic consistency that are costly for longtermist planning. By keeping standard EU but filtering the inputs via Modal Scarcity, I preserve the diachronic stability needed for long-term projects. I am arguing that the intuition against mugging isn't about risk aversion; it's about the recognition that the probability claim is ill-formed. We shouldn't model epistemic defects as risk preferences."

  **Concede:** Admit that Risk-Weighted EU is a consistent alternative that many find plausible.
  **Soft Spot:** You need to prove that "ill-formed probability" is a coherent category distinct from "low probability."

  ### 5. The "Imprecise Probability" Alternative (Formal Epistemologist)
  **Phrasing:** "This sounds like a clumsy version of Imprecise Probabilities. If a probability is 'hypothesis-space-generated,' why not just represent it as a wide interval or a set of distributions that includes zero? Why invent a new 'anchoring' condition when the literature on robustness and model uncertainty already has the tools to handle this?"

  **Reply:**
  "Imprecise probabilities are indeed the standard tool for model uncertainty, and I concede my view is compatible with using sets of probabilities. However, the standard imprecise approach often leads to *indecision* or paralysis when the intervals are too wide. My 'Modal Scarcity' condition is more prescriptive: it tells us when to *collapse* the interval to zero for decision purposes.
  The issue with simply saying 'the probability is between 0 and 1' is that in high-stakes cases, the upper bound still dominates the EV calculation. My claim is stronger: if the probability is unanchored residue, the upper bound is not just uncertain, it is *inadmissible*. I am proposing a threshold for when imprecision becomes so severe that the probability mass is effectively non-existent for decision theory. It's a bridge between the imprecise probability literature and the fanaticism debate, specifying when robustness requires ignoring a hypothesis entirely."

  **Concede:** Admit that Imprecise Probability is the more established formalism for this terrain.
  **Soft Spot:** You haven't formally derived the threshold where an interval becomes "inadmissible" rather than just "wide."

  ### 6. The "Storytelling Mugger" Objection (Ethicist)
  **Phrasing:** "A sophisticated mugger can provide a mechanism. They can say, 'I am from a simulation running on a server farm, here are the specs.' If they articulate a mechanism, does their probability become anchored? If so, you haven't solved fanaticism, you've just forced muggers to be more creative. If not, why is their mechanism different from an AI alignment scenario?"

  **Reply:**
  "This is the strongest test of the view. I concede that a sufficiently detailed story can mimic an anchor. The distinction lies in the *independent verification* of the reference class. In AI alignment, the 'mechanism' (computational optimization) exists independently of the claim. We can observe optimization in other contexts.
  In the mugger case, the mechanism (simulation running by this specific agent) is posited *solely* to explain the claim. It is a *post hoc* anchor. Modal Scarcity requires the reference class to be established *prior* to the specific hypothesis. We know 'simulations' are possible generally, but we don't have a bounded prior on 'simulators approaching pedestrians.' The mugger's mechanism is endogenous to the request; the x-risk mechanism is exogenous to the decision. I concede this requires careful scrutiny of causal history, but it prevents the 'creativity' loophole."

  **Concede:** Admit that a mugger *could* theoretically satisfy the condition if they appealed to truly exogenous mechanisms (e.g., known physics).
  **Soft Spot:** Distinguishing "exogenous" from "endogenous" mechanisms in real-time conversation is highly subjective.

  ### 7. The "Learning" Objection (Decision Theorist)
  **Phrasing:** "Suppose I reject a mugging hypothesis today because it's unanchored. Tomorrow, I find evidence that makes it anchored. Have you violated Bayesian Conditionalization? You seem to be saying I should treat the probability as zero today, but non-zero tomorrow. That looks like diachronic inconsistency."

  **Reply:**
  "I concede that this looks like a violation of strict Conditionalization if we view the probability as a fixed property of the world. However, on my view, the admissibility of the probability is a function of the *agent's current model state*. It is not the probability that changes, but the *status* of the hypothesis within the decision space.
  Think of it like a p-value threshold. A result isn't 'significant' today, but with more data, it becomes 'significant.' We don't say the statistician was irrational yesterday. Similarly, Modal Scarcity is a rule for *current* admissibility based on *current* anchoring. If new evidence anchors the hypothesis, it enters the decision space legitimately. This is consistent with a view of rationality that bounds decision-relevance by current epistemic resources, rather than demanding logical omniscience."

  **Concede:** Admit this deviates from standard Bayesian updating rules.
  **Soft Spot:** You are effectively redefining rationality to be resource-bounded, which opens you to charges of not addressing ideal rationality.

  ### 8. The "Aggregation" Objection (Ethicist)
  **Phrasing:** "You say independent bets are legitimate for anchored probabilities. But if I face a million small x-risk decisions, each with a tiny anchored probability, doesn't the EV still dominate? If you block the single mugging, why allow the aggregation of small anchored risks to drive policy? Isn't that just fanaticism by the back door?"

  **Reply:**
  "I concede that aggregation can lead to high-stakes conclusions, but that is a feature, not a bug, provided the probabilities are robust. The 'fanaticism' problem arises when a *single* decision is hijacked by a speculative tail. In the aggregation case, we are relying on the Law of Large Numbers applied to *anchored* distributions.
  If the probabilities are mechanism-anchored, they are calibrated. If I make a million bets on calibrated probabilities, my expected value converges to actual value. In the mugging case, even a million bets don't help because the probability is reference-class unstable; I can't specify the sequence of bets because I can't specify the hypothesis space. So, aggregation is legitimate for x-risk because the uncertainty is reducible over time and trials. It is illegitimate for mugging because the uncertainty is structural. This preserves the ability to act on longtermist goals without falling prey to single-shot speculation."

  **Concede:** Admit that your view still permits very high-stakes conclusions if the volume of anchored bets is high enough.
  **Soft Spot:** You must ensure the "anchoring" holds up under aggregation and doesn't degrade.

  ---

  ### Flagged Duplicates
  *   **Objections 4 & 5** are fundamentally the same: "Another framework (Risk-Weighted or Imprecise Prob) does this better."
      *   *Defense:* Differentiate by emphasizing your view preserves *linearity* (unlike RW-EU) and offers *admissibility criteria* (unlike Imprecise Prob).
  *   **Objections 2 & 6** are fundamentally the same: "This kills longtermism / Muggers can game this."
      *   *Defense:* Emphasize the *exogenous vs. endogenous* mechanism distinction.

  ---

  ### The Question You Hope Nobody Asks
  **Question:** "Is Modal Scarcity an epistemic norm or a decision-theoretic axiom? If it's epistemic, why does it violate Bayesian updating (by ignoring evidence of unanchored hypotheses)? If it's decision-theoretic, why isn't it just a transformation of the utility function (i.e., you value 'anchored' outcomes more)?"

  **Honest Answer:**
  "It is a hybrid norm that sits at the interface. Strictly speaking, it violates ideal Bayesianism because it imposes a constraint on prior admissibility based on model structure rather than evidence alone. I argue this is necessary because ideal Bayesianism assumes a fixed hypothesis space, which is false in open-world scenarios. It is not a utility transformation because I still value the outcomes equally; I am claiming the probability term in the EV product is undefined, not that the utility is discounted. If forced to choose, I classify it as a *procedural* norm for non-ideal agents operating under model uncertainty."

  **Why this is dangerous:** It admits your view is inconsistent with standard Bayesian epistemology, which the Formal Epistemologist on your committee may view as a fatal theoretical cost.
