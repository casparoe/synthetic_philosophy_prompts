prompt: |-
  I'm a science-and-ideas journalist, and I want one corner of philosophy rendered into the vocabulary I actually work in. My toolkit is: source hierarchies, credibility priors, signal versus noise, verification routines, the both-sides reflex, the informal "who counts as an expert" list, and a bit of information theory — channels, codebooks, compression, bits. The philosophy is epistemic injustice: the case where a speaker gets less credibility than the evidence supports because of how hearers read their identity, and the case where someone can't make sense of their own experience because the shared vocabulary has no term for it yet.

  Translate both cases into my vocabulary as faithfully as you can — don't smuggle my framework's assumptions in and call the result a translation — and then give me the residue report: what carries over cleanly, what fits only once I've distorted it, and what has no expression in my toolkit at all. My working hypothesis is that the first case is just a badly calibrated prior that I already have tools for, and the second is a codebook or compression failure. I suspect I'm wrong, or at least that something important is left over: is the harm here only an information loss to the hearer, or is there a wrong done to the speaker that my vocabulary simply cannot represent?

  Two things to stop you giving me the standard answer. One: I deal in credibility excesses at least as often as deficits — the fluent, well-credentialled source who is believed further than the evidence warrants. Does the framework have anything to say about that, or is it built only for shortages? Two: nearly everything that goes wrong in my world is institutional — the comissioning editor, house style on attribution, the fact that nobody on the desk has ever met anyone remotely like the person I'm interviewing — but the remedy I keep running into is pitched at the individual hearer's character or attentiveness. That seems aimed at the wrong unit of analysis. Is that a genuine problem for the view, or am I making a category mistake?

  Where something doesn't survive the translation, tell me whether that's a defect in my vocabulary or a sign that the philosophers' claim is fuzzier than it looks. British English please, and under 800 words if you can — I'm on deadline and I definately don't have library access.
