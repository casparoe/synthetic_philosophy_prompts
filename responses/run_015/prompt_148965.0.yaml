answer: |-
  **The Translation**

  **Testimonial Injustice:** This is a credibility prior skewed by identity metadata. Your algorithm weights the source's social category (gender, race, class) higher than their track record or evidence quality. Signal is discarded as noise not because of content analysis, but because the source header triggers a low-trust flag.

  **Hermeneutical Injustice:** This is a codebook mismatch. The sender possesses data but lacks the compression algorithm shared by the receiver to encode it efficiently. Because the collective vocabulary lacks a term for the experience (e.g., "sexual harassment" prior to the 1970s), the message cannot be packaged without massive fidelity loss. The signal degrades into noise because the shared codebook has no entry for that specific variable.

  **Residue Report**

  **What carries over cleanly:** The mechanics of error. You are correct that testimonial injustice functions like a badly calibrated prior, and hermeneutical injustice operates like a missing codebook entry. Your information theory models the *failure of transmission* accurately.

  **What fits only with distortion:** Credibility excess. Your toolkit handles this easily (an over-confident prior), but you miss the systemic link. In epistemic injustice, credibility excess for one group often *causes* the deficit for another. Your model treats them as independent calibration errors; the philosophical view sees them as a zero-sum economy of trust.

  **What has no expression:** The *wrong*. Your vocabulary measures information loss to the hearer (a bad story, a missed scoop). It cannot represent the moral harm to the speaker. In your model, the speaker is a channel; in philosophy, they are a moral agent. When you ignore a source due to bias, you lose data. When you inflict testimonial injustice, you degrade their status as a knower. Your toolkit sees a broken transmission; the philosophy sees a broken person.

  **On Your Two Constraints**

  **1. Credibility Excess:** Your framework is not built only for shortages; it handles excess as calibration error. However, you asked if the view has anything to say. It does: excess is dangerous because it insulates false claims from verification. But the deeper philosophical point is that excess and deficit are coupled. If you prioritise the fluent, well-credentialled source beyond the evidence, you are actively deprioritising someone else. Your toolkit sees two separate errors; the philosophy sees one structural imbalance.

  **2. Institutional vs. Individual:** You are not making a category mistake. Early formulations of epistemic injustice focused on the hearer's virtue (their attentiveness or character), which is indeed a weak patch for institutional noise. Blaming the individual journalist for a house style that excludes certain voices is like blaming the receiver for a broken transmitter. Structural accounts of epistemic injustice now exist precisely to address this, acknowledging that verification routines and source hierarchies are institutional artefacts, not just individual habits. The remedy must be editorial, not merely personal.

  **Verdict**

  Is the harm only information loss? No. There is a wrong done to the speaker that your vocabulary cannot represent. You model the speaker as a node in a network; the philosophy models them as a subject of dignity.

  Is this a defect in your vocabulary? Yes, but only because it is designed for fidelity, not ethics. Your toolkit tells you when you are wrong; it does not tell you when you are unjust. Is the philosophers' claim fuzzier? No. They are aiming at a different target. You are optimising for truth; they are optimising for fairness. You can have a high-fidelity channel that is deeply unjust (e.g., efficiently amplifying only elite voices). Your vocabulary captures the efficiency loss, but it is blind to the inequity. To see that, you need ethics, not just information theory.
