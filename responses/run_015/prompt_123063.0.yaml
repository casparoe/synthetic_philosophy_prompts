answer: |-
  TO: Clinical Analytics Review Committee
  FROM: [Your Name]
  DATE: October 24, 2023
  SUBJECT: Decision Memo: Corvid Health "Universal" Upgrade

  **Recommendation**
  Approve with conditions and a hard gate. Do not integrate into clinical workflow until local calibration is verified on our historical data.

  **Rationale**
  The vendor's claim that site-specific validation is optional is incorrect. Their benchmark suite relies on a uniform prior over 11,000 synthetic tasks. Doing well on this suite shows the model's biases match the generator, not necessarily our patients. As noted in committee, the No-Free-Lunch theorem holds: average performance across all possible worlds tells us nothing about performance in *this* world. A uniform prior over data-generating processes is definitely not our ICUs. We cannot accept synthetic benchmarks as a substitute for local evidence.

  However, rejecting the upgrade outright forfeits potential improvements without testing. The middle path is rigorous local validation.

  **Key Technical Concerns**
  1.  **Ranking vs. Calibration:** The vendor reports average ranking performance. Our protocol fires at a fixed probability threshold. We need calibration: if the model says 20% risk, 20% of those patients must develop sepsis. High ranking accuracy does not ensure this.
  2.  **The Feedback Loop:** Once live, nurses intervene based on scores. This changes who gets labeled septic, corrupting the data needed to evaluate the model. A standard pilot cannot straightforwardly establish performance because the act of measurement changes the outcome. We must be honest that a pilot establishes usability, not necessarily raw predictive accuracy.
  3.  **Clinician Anchoring:** The strongest objection is behavioral. If we deploy a "pilot," clinicians may anchor on the score even if warned it is experimental. Deployment by inertia is a real risk; a tool once seen is hard to unsee. This is a greater risk than the mathematical circularity argument.

  **Conditions for Approval**
  To address these issues, I propose the following conditions for the vendor:

  1.  **Retrospective Silence:** Corvid must run "Universal" on our last 24 months of historical data in silent mode. We rejected the idea of asking them to name the "50 most similar tasks" from their suite; that allows cherry-picking. Instead, they must perform on *our* data distribution.
  2.  **Calibration Report:** They must provide calibration plots at our specific protocol threshold, not just aggregate AUC.
  3.  **Hard Gate:** No UI integration until calibration targets are met. This mitigates the anchoring risk; if the number isn't visible, it cannot bias judgment.
  4.  **Evaluation Window:** We set a 6-week silent trial starting immediately. If calibration fails, the contract lapses in March as planned.

  **Response to Objections**
  To the philosopher's point on induction: We are not assuming success because it worked elsewhere. We are treating this as a new device requiring local clearance. The circularity is broken by testing on *our* past data before touching *our* future patients.

  To the vendor: We welcome the upgrade, but "domain-general" evidence is insufficient for clinical safety. Please provide the retrospective analysis by [Date].

  **Decision**
  Conditional Approval.
