prompt: |-
  Give an example of a conceptual issue that arises when Buddhist ethics — specifically the Theravada emphasis on cetana (volitional intention) and the Mahayana doctrine of upaya (skillful means) — is pressed against consequentialist evaluation. Construct a precise, non-standard scenario, avoiding familiar tropes such as the burning-house parable or clinical euthanasia cases, in which an agent knowingly undertakes an action that foreseeably increases aggregate suffering in the short term, yet is regarded within the Buddhist framework as morally unproblematic because it issues from a mental state free of lobha, dosa, and moha. Then articulate the exact point of conceptual tension: does the consequentialist objection that the outcome profile makes the act wrong merely rest on a misunderstanding of kamma as intention rather than consequence, or does it expose a deeper incoherence in holding that an act can be genuinely skilful if its welfare effects are systematically negative? Map the conceptual geography with discipline, indicating where each framework falls silent, where they talk past one another, and where they genuinely contradict, and do so without invoking bibliographic authority or citation.
