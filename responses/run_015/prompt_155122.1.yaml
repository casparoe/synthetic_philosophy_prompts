answer: |-
  ### The Scenario: The Ontological Triage

  Consider a senior meditation master residing in a hospice for terminally ill practitioners. One patient, a devoted layperson, is entering the final moments of life. The patient's mind is naturally settling into a state of profound peace and attachment to the memory of their family, a state that, according to the master's insight into kammic trajectory, will result in a favorable rebirth within the human realm but one bound by intense clinging, guaranteeing future cycles of significant suffering. Alternatively, a state of acute cognitive dissonance and unresolved anxiety at the moment of death would shatter this attachment, likely precipitating a transition to a higher spiritual plane or a breakthrough toward liberation, albeit through a experience of terror and confusion.

  The master, possessing the ability to influence the patient's mental environment through subtle verbal or energetic intervention, deliberately introduces a disruptive element—a specific, jarring contradiction regarding the patient's life history—that destroys the patient's peace. The patient dies in a state of heightened agitation and psychological distress. Aggregate suffering in the immediate timeframe is demonstrably increased: the patient experiences fear rather than peace, and the family, witnessing this, experiences grief and confusion rather than closure.

  The master acts without *lobha* (no desire for reputation or reward), without *dosa* (no ill will toward the patient), and without *moha* (clear vision of the long-term soteriological outcome). In the Theravada frame, the *cetana* is pure; the volition is rooted in compassion for the patient's ultimate freedom, not their temporary comfort. In the Mahayana frame, this is *upaya*: a skillful means that violates the precept of non-harming in the conventional sense to serve the ultimate welfare of the being. The master regards the act as morally unproblematic, even meritorious, because the defilements that usually bind action to suffering are absent.

  ### The Conceptual Tension

  The consequentialist objection is immediate and structural: an action that foreseeably maximizes distress and minimizes well-being in the affected subjects is morally wrong, regardless of the agent's internal state. The tension here is not merely about the time horizon (short-term pain for long-term gain); standard consequentialism can accommodate delayed gratification. The tension arises from the *currency* of evaluation.

  Consequentialism evaluates the *quality of experience* (pleasure, preference satisfaction, absence of pain). Buddhist ethics, in this specific configuration, evaluates the *ontological status of the experiencer* (bound vs. liberated, clinging vs. non-clinging).

  The consequentialist argues that the act is wrong because the outcome profile contains a net deficit of welfare. The Buddhist argues that the act is right because the outcome profile contains a net deficit of *samsaric binding*. The conceptual friction lies in whether "welfare" is defined by the hedonic tone of the continuum or by the cessation of the continuum's binding mechanisms. If the Buddhist claims the act is "skillful" (*kusala*) despite the increase in empirical suffering, they are asserting that *dukkha* (suffering) is not identical to pain, but rather to clinging. The consequentialist, operating on a secular or hedonic utilitarian axis, cannot register "clinging" as a harm unless it manifests as measurable dissatisfaction.

  ### Mapping the Conceptual Geography

  **1. Zones of Silence**
  *   **Consequentialist Silence:** Standard consequentialist frameworks fall silent on the post-mortem trajectory. They lack the metaphysical apparatus to weigh "rebirth in a lower realm" against "death in terror." Consequently, they must treat the death moment as the terminus of moral accounting. They cannot evaluate the master's claim that the terror was "better" for the patient, because their metric ends at biological cessation.
  *   **Buddhist Silence:** Traditional Buddhist ethics often lacks a granular language for secular, aggregate welfare that is divorced from kammic consequence. It struggles to articulate why the family's grief matters if it does not impact their own liberation. The framework is silent on the intrinsic value of social cohesion or emotional closure unless these are instrumental to Dharma practice.

  **2. Talking Past One Another**
  *   **The Definition of Harm:** The two frameworks talk past one another when defining "harm." For the consequentialist, harm is the infliction of negative qualia (fear, pain). For the Buddhist agent, harm is the reinforcement of *avijja* (ignorance) and *tanha* (craving). When the consequentialist says, "You harmed the patient," they mean "You caused pain." When the Buddhist replies, "I did not harm the patient," they mean "I did not bind them to samsara." They are using the same moral vocabulary to describe incompatible ontological realities.
  *   **The Locus of Morality:** Consequentialism locates morality in the *world* (the state of affairs produced). Buddhist ethics, particularly via *cetana*, locates morality in the *mind* (the quality of the volition). The consequentialist asks, "What happened to the patient?" The Buddhist asks, "What was the state of the master's mind?" They are answering different questions while appearing to debate the same act.

  **3. Genuine Contradiction**
  *   **The Permissibility of Inflicted Distress:** A genuine contradiction emerges if we grant the Buddhist metaphysical premises. If we accept that the patient's terror leads to liberation, and that liberation is the ultimate good, then Buddhism mandates the infliction of terror. Consequentialism (specifically negative utilitarianism or hedonic utilitarianism) forbids the infliction of terror if a less painful alternative exists (e.g., allowing the peaceful death).
  *   **Incoherence of Skillful Means:** The deeper incoherence arises within the Buddhist framework itself when pressed by consequentialist scrutiny. If an act is defined as "skillful" (*kusala*) because it leads to the end of suffering, but the act *systematically produces* suffering in the observable world to achieve that end, the link between "skillful" and "welfare" is severed. If *upaya* allows for the indefinite postponement of welfare for a metaphysical gain that cannot be empirically verified, the ethical system risks becoming unfalsifiable. The consequentialist exposes a potential vacuity: if any amount of empirical suffering can be justified by an appeal to invisible long-term kammic benefits, the ethical constraint on action dissolves.

  ### Conclusion on Coherence

  The consequentialist objection does not merely rest on a misunderstanding of *kamma* as intention. It exposes a foundational divergence in the telos of ethics. If ethics is the optimization of sentient experience, the Buddhist agent is wrong. If ethics is the optimization of sentient liberation (even at the cost of experience), the consequentialist is blind.

  However, the contradiction is most acute regarding the *epistemology of outcomes*. The consequentialist relies on foreseeable, empirical outcomes. The Buddhist agent relies on supranormal insight into kammic trajectories. The incoherence lies in the agent's claim to certainty. To justify increasing aggregate suffering, the agent must be certain of the soteriological payoff. If that certainty is subjective (based on the agent's claim of being free from *moha*), the ethical framework becomes vulnerable to solipsism: any atrocity could be justified by a claim of pure intention and invisible benefit. Thus, the tension is not just between intention and consequence, but between private spiritual certainty and public welfare verification. The Buddhist framework remains coherent only if one accepts the metaphysical reality of the kammic trajectory; without it, the "skillful means" becomes indistinguishable from harmful delusion.
