prompt: |-
  ok so I'm a junior and I run the peer tutoring thing at my school after class, and I'm also on the student committee for our new "mastery based grading" pilot (whole other story lol). Anyway the problem we keep running into is this: someone gives you the right answer and you cant tell if they actually KNOW it or if they just... got it right somehow. My little brother can tell you any times table answer but if you ask him 7x8 a different way he freezes. And in tutoring I've had kids who ace the multiple choice and then fall apart on the one question that asks them to explain or use it somewhere new.

  So my teacher lent me this philosophy book and I read the Meno thing, where Socrates asks whether true belief is really worth less than knowledge, and the answer is basically yes it is, because true beliefs are like the statues of Daedalus that run away unless you tie them down, and you tie them down by being able to give the reason why. Which is a nice image but its a dialogue, not something I can hand to a tutor.

  Here's what I want. Act like an expert on epistemology (theory of knowledge) who also actually knows the learning-science stuff about how people fool themselves into thinking they learned something -- the fluency illusion, re-reading feeling like learning when it isnt, cramming that evaporates, that kind of thing. Think carefully before you write anything, and start with a short brainstorm of what really separates knowing something from having a lucky true belief, then turn that into a procedure I can actually run.

  The procedure is for a peer tutor or a teacher with maybe 10 minutes and zero philosophy training. I want it as an ordered list of things to do or ask, with what counts as passing each step, where you stop and say "thats a true belief, not knowledge, dont mark it mastered," and -- this matters -- where the procedure has to get handed to a human because its a judgment call and not a fact. Keep every step doable inside an actual tutoring session (ask them to explain it, make them do it a different way, ask what would change their mind, come back to it in a week, whatever works), and tell me which steps are load bearing and which I could skip if I'm in a rush.

  Then run it on three made-up students: (1) one who memorized the steps for solving quadratics and gets every practice problem right, but cant say why you divide by 2a or what completing the square is actually doing; (2) one who can explain photosynthesis beautifully with all the right words but cant apply it to a plant in a closet; (3) one who aced my whole practice test by cramming the night before and will defintely have forgotten all of it by next week. For each one, say what the procedure spits out and whether that answer feels right to you.

  And be straight with me about two things. First, where does this procedure give an answer I wont like -- like flagging a kid as "doesnt really know it" when they can obviously do it, or the reverse? Second, what can it just not do? (I'm already worried about the kid who can do the thing perfectly but cant put it into words, and the kid who knows it fine but freezes because I'm staring at them.) I dont want a reading list or citations or names of papers, just give me the idea straight. And if the Meno framing isnt actually the right one for what I'm trying to do, say so and use a better one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, runs peer tutoring, on a student committee for mastery-based grading.
      *   **Problem:** Distinguishing between *true belief* (getting the right answer by luck/memorization without understanding) and *knowledge* (robust understanding that transfers).
      *   **Inspiration:** Plato's *Meno* (Daedalus statues analogy: true belief runs away unless tied down by reasoning).
      *   **Role:** Expert in epistemology + learning science (fluency illusions, cramming, etc.).
      *   **Deliverables:**
          1.  Short brainstorm on the difference between knowing and lucky true belief.
          2.  A concrete, ordered procedure (checklist) for tutors/teachers (10 mins, no philosophy training).
          3.  Indication of pass/fail criteria for each step.
          4.  Indication of where human judgment is needed.
          5.  Indication of load-bearing vs. skippable steps.
          6.  Test the procedure on three specific made-up students (Quadratic memorizer, Photosynthesis explainer, Crammer).
          7.  Honest limitations (false negatives/positives, what it can't do).
          8.  Critique of the *Meno* framing if necessary.
      *   **Constraints:** No reading lists/citations/names of papers. Keep it practical.

  2.  **Brainstorming: Knowledge vs. True Belief (Epistemology + Learning Science):**
      *   *Meno:* True belief is unstable. Knowledge is stable because it's "tied down" by *aitias logismos* (reasoning/account of the cause).
      *   *Learning Science:*
          *   *Fluency Illusion:* Recognizing text feels like knowing it.
          *   *Transfer:* Can you apply it in a new context?
          *   *Retention:* Does it stick over time (spacing effect)?
          *   *Metacognition:* Do you know *why* you know it? Can you debug yourself?
          *   *Fragility:* Does stress or slight variation break it?
      *   *Synthesis:* Knowledge is *robust*, *transferable*, *explainable*, and *stable*. True belief is *fragile*, *context-bound*, *opaque*, and *transient*.

  3.  **Developing the Procedure (The "Tie-Down" Protocol):**
      *   Needs to be fast (10 mins).
      *   Needs to be actionable for a peer tutor.
      *   Needs to catch the specific failures mentioned (memorization without understanding, explanation without application, cramming).
      *   *Step 1: The Performance Check.* (Did they get it right?) - Baseline.
      *   *Step 2: The Variation Check.* (Transfer) - Change the numbers/context.
      *   *Step 3: The "Why" Check.* (Reasoning) - Meno's tying down.
      *   *Step 4: The Error Check.* (Debugging) - Show a wrong answer, ask them to fix it.
      *   *Step 5: The Time Check.* (Retention) - Come back later. (This is hard in one session, need to adapt).
      *   *Refinement:* Since it's a tutoring session, "come back in a week" isn't a *during-session* check. I need to simulate stability or mark it as "provisional." Let's make Step 5 a "Metacognitive Prediction" instead. Ask them to predict where they might fail.
      *   *Load Bearing:* Variation and Explanation are key. Prediction is good for metacognition.
      *   *Judgment Call:* Deciding if an explanation is "deep enough" vs. just reciting vocabulary.

  4.  **Drafting the Procedure Steps:**
      1.  **Solve:** Get the right answer. (Pass = Correct).
      2.  **Vary:** Change one constraint. (Pass = Still correct/adapts method).
      3.  **Justify:** Explain the *mechanism*, not just the step. (Pass = Connects concept to action).
      4.  **Debug:** Identify an error in a fake solution. (Pass = Spots the conceptual break).
      5.  **Predict:** Say what would make this harder. (Pass = Realistic assessment).

  5.  **Testing on the Three Students:**
      *   *Student 1 (Quadratic Memorizer):*
          *   Solve: Pass.
          *   Vary: Fail (numbers change, formula confusion).
          *   Justify: Fail ("That's just the rule").
          *   Result: True Belief.
      *   *Student 2 (Photosynthesis Explainer):*
          *   Solve (Explain): Pass.
          *   Vary (Plant in closet): Fail (Can't apply light constraint).
          *   Result: True Belief (Verbal fluency without conceptual model).
      *   *Student 3 (Crammer):*
          *   Solve: Pass.
          *   Vary: Maybe Pass (if similar).
          *   Justify: Weak.
          *   Predict: Fail (Overconfident).
          *   *Constraint:* The procedure happens *now*. How to catch cramming? The "Predict" step helps (they usually say "I got this" when they don't). Also, the "Debug" step often trips up cramming because it requires deeper processing.
          *   *Result:* Likely flagged as fragile/True Belief due to lack of depth in Justify/Debug.

  6.  **Addressing Limitations & The Meno Framing:**
      *   *Meno Critique:* Meno focuses on *justification*. Learning science focuses on *retrieval* and *transfer*. Meno is a good metaphor, but "Knowledge = Justified True Belief" (JTB) has problems (Gettier cases). For schools, "Knowledge = Robust Competence" is better. I should shift the framing from "Truth" to "Robustness."
      *   *False Negatives:* The shy kid, the kid with language barriers, the kid who is intuitive but can't articulate (tacit knowledge).
      *   *False Positives:* The kid who is good at guessing what the tutor wants to hear (school-smart but not deep).
      *   *What it can't do:* Measure long-term retention in a single session. Measure emotional blocks.

  7.  **Refining the Tone:**
      *   Needs to be respectful of the user (Junior in HS doing impressive work).
      *   Direct, practical, no academic fluff.
      *   Acknowledge the difficulty of the task.

  8.  **Final Review against Constraints:**
      *   Short brainstorm? Yes.
      *   Ordered list procedure? Yes.
      *   Pass/Fail criteria? Yes.
      *   Judgment call markers? Yes.
      *   Load-bearing vs. skippable? Yes.
      *   Run on 3 students? Yes.
      *   Honest limitations? Yes.
      *   Meno critique? Yes.
      *   No citations? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Include a "wait a week" step.
      *   *Correction:* User said "10 minutes... inside an actual tutoring session." I can't make them wait a week *during* the session. I need to mark the status as "Provisional" if time-check isn't possible, or use a metacognitive proxy. Let's use the "Prediction" step as a proxy for stability. If they can't predict where they'd get stuck, they don't know the boundaries of their knowledge.
      *   *Initial thought:* Strict JTB framing.
      *   *Correction:* As noted, JTB is philosophically contentious. For *mastery grading*, we care about *competence*. I will pivot the framing slightly from "Knowledge" to "Mastery" or "Robust Understanding" to avoid philosophical rabbit holes while keeping the Meno spirit.
      *   *Student 3 (Crammer):* How to catch this in 10 mins? Cognitive load. Ask them to do two things at once or explain while solving. Crammers rely on working memory shortcuts. If you overload working memory, the shortcut breaks. I'll add a "Dual-Task" or "Interference" element to the Variation step.

  10. **Final Polish:** Ensure the distinction between "Load Bearing" and "Skippable" is clear. Ensure the "Judgment Call" moments are highlighted. (Proceed to generate output).

  *(Self-Correction on Student 3)*: Actually, catching cramming in 10 minutes is really hard. The best indicator is often the *explanation* quality. Crammers memorize procedures, not reasons. I will emphasize the "Justify" step for this.

  *(Self-Correction on Meno)*: The user asked me to say if Meno isn't the right frame. Meno is about *recollecting* eternal truths. School learning is about *building* neural pathways. I should explicitly state that Meno is a metaphor for *stability*, not literal truth.

