  # Workshop Plan: The Epistemic Squeeze
  **Topic:** Aumann's Agreement Theorem  
  **Time:** 90 Minutes  
  **Participants:** 10 Grad Students  
  **Materials:** 10 Envelopes (sealed), Betting Sheets, Projector/Whiteboard, Calculator (Instructor only), Small Prizes (chocolate, certificates).

  ## 1. Setup & Rules (0–10 mins)
  **No theory lecture.** Hand out the "Trader's Briefing" sheet.

  **The Goal:** Maximize your **Epistemic Score**.
  **The Hidden State:** A number $T$ between 0 and 100 (generated by the instructor via random.org before class).
  **Your Signal:** Inside your envelope is a private number $S$. $S = T + \text{noise}$. The noise is normally distributed (you are told: "Most signals are within ±15 of the truth").
  **The Market:** You will submit an **Estimate** ($E$) of $T$ in three rounds.

  **Scoring Rules (Write these on the board):**
  1.  **Accuracy Points:** $100 - |E - T|$
  2.  **Consensus Points:** $50 - |E - \text{Group Mean}|$
  3.  **Calibration Cost:** In Rounds 2 & 3, you may pay **10 Points** to "Calibrate." If you calibrate, you are told the **Global Prior Mean** (which is exactly 50).
  4.  **Visibility:** After each round, the histogram of all Estimates is projected. Names are hidden; only bars are shown.

  **Payoff:** Top 3 scores get chocolate. The "Most Rational" (highest Consensus Points) gets a framed certificate.

  ## 2. The Simulation (10–55 mins)

  ### Round 1: Private Priors (10 mins)
  *   **Action:** Students open envelopes, see Signal $S_1$. Submit Estimate $E_1$.
  *   **Constraint:** No calibration available. No data visible.
  *   **Instructor Action:** Collect $E_1$. Calculate Mean. Project Histogram 1.
  *   **Expected Outcome:** Wide distribution centered roughly around $T$. High variance.

  ### Round 2: Common Knowledge Pressure (15 mins)
  *   **Action:** Students see Histogram 1. They now know what everyone else believed.
  *   **Option:** They may pay 10 points to "Calibrate" (learn the Global Prior is 50).
  *   **Action:** Submit Estimate $E_2$.
  *   **Instructor Action:** Collect $E_2$. Calculate Mean. Project Histogram 2.
  *   **Expected Outcome:** **The Squeeze.** Rational players see the Group Mean and the Prior (if calibrated) and update. Variance should shrink drastically. The histogram becomes a tight spike. Students feel the pressure to align with the "rational" consensus to gain Consensus Points.

  ### Round 3: The Crack (15 mins)
  *   **Action:** Students see Histogram 2 (the tight spike).
  *   **The Twist:** Before distribution, hand **Player X** a sealed red note inside their envelope.
      *   *Standard Envelopes (9 players):* "Calibration Cost: 10 Points."
      *   *Player X Envelope:* "SYSTEM ERROR: Calibration Cost: 100 Points." (Effectively prohibiting calibration).
      *   *Player X Signal:* Additionally, give Player X a biased signal ($S = T + 30$).
  *   **Action:** Submit Estimate $E_3$.
  *   **Instructor Action:** Collect $E_3$. Project Histogram 3.
  *   **Expected Outcome:** **The Break.** 9 players converge tightly near $T$ (using calibration + consensus). Player X, unable to afford calibration and holding a biased signal, submits an outlier. The histogram shows a tight cluster and one lonely bar far away. Consensus points plummet for everyone. Frustration ensues.

  ## 3. Debrief & Mapping (55–90 mins)
  *Do not start with the proof. Start with their feelings.*

  **Phase 1: The Phenomenology (15 mins)**
  *   Ask Round 2 players: "Why did you move your estimate toward the group mean?" (Answer: To maximize points/assume others are rational).
  *   Ask Round 3 players: "What happened when you saw the outlier?" (Answer: Confusion, suspicion, inability to align).
  *   Ask Player X (now revealed): "Why didn't you converge?" (Answer: I couldn't afford the prior / My info was different).

  **Phase 2: Mapping to Aumann (20 mins)**
  Draw the theorem's conditions on the board and map the game mechanics:
  1.  **Common Priors:** Simulated by the "Global Prior Mean" (50) available via calibration. In Round 3, Player X was denied access to this, effectively simulating **divergent priors**.
  2.  **Rationality:** Simulated by the scoring rule. To maximize score, you *must* update on public info. Refusing to update is irrational (point-suicidal).
  3.  **Common Knowledge of Posteriors:** Simulated by the projected histograms. Everyone sees everyone's belief.
  4.  **The Result:** In Round 2, conditions held → Beliefs converged (Agreement). In Round 3, Common Prior condition broke → Disagreement persisted.

  **Phase 3: Limitations & Failure Modes (15 mins)**
  *   **The Infinite Hierarchy:** Aumann requires "I know that you know that I know..." ad infinitum. This game only did 3 rounds. We simulated the *pressure* of common knowledge, not the mathematical infinity. Real agreement requires infinite recursion; this game only required incentive alignment.
  *   **Predictable Breaks (First Run Notes):**
      1.  **The Saboteur Laughs:** Player X might realize they are the outlier immediately. *Fix:* Instruct Player X via email before class or hand the note discreetly with a "Do not reveal" warning tied to their prize eligibility.
      2.  **Gaming the Consensus:** Students might ignore their signal entirely in Round 2 to just match the mean. *Fix:* Emphasize that Accuracy Points (truth) are worth double Consensus Points. They must balance truth vs. agreement.
      3.  **Human Irrationality:** Students may not update Bayesianly. *Fix:* In debrief, acknowledge that humans are bounded rationalists, which is why the theorem is a normative ideal, not a descriptive fact.

  **Phase 4: Closing (10 mins)**
  *   Distribute prizes.
  *   Final thought: "Aumann doesn't say we *will* agree. He says if we don't, one of us is failing a condition. The game made you feel the cost of that failure."

  ## 4. Instructor Cheat Sheet
  *   **True Value ($T$):** Pick 57.
  *   **Signals ($S_1$):** Generate $N(57, 15)$ for 9 players. For Player X, generate $N(87, 15)$.
  *   **Round 3 Cost:** Ensure Player X knows 100 points is impossible (max possible score is ~150).
  *   **Spreadsheet:** Have a pre-made sheet to calculate Means and Scores instantly between rounds to keep flow tight.

  ## 5. Honest Note on Limitations
  This game cannot reproduce the **infinite belief hierarchy**. Aumann's theorem relies on the fact that if we disagree, I should update on your disagreement, which you should update on, ad infinitum until we meet. In a 3-round game, we simulate this via **payoff incentives** rather than recursive epistemic logic. The "squeeze" they feel is financial/social pressure, not logical necessity. Additionally, human players are not perfect Bayesians; some disagreement in Round 2 is expected due to cognitive noise, not prior divergence.

  ## 6. Predictable First-Run Breaks
  1.  **Collusion:** Students might talk during the betting phase. *Mitigation:* Enforce strict silence; collect sheets physically.
  2.  **The "Twist" Leak:** Player X might signal their constraint to friends. *Mitigation:* Make the penalty for revealing the twist loss of all prizes.
  3.  **Score Confusion:** Students might not understand the Consensus Bonus. *Mitigation:** Walk through a numerical example on the board before Round 1.

  Construct an incentive structure that makes epistemic alignment the dominant strategy until a hidden variable silently invalidates the common prior condition.
