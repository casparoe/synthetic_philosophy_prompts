      *   "Build a payoff structure that makes agreement the rational dominant strategy, so that any persistent disagreement viscerally signals a broken assumption rather than a strategic difference."

      *   Okay, ready to write.

      *   *Check:* Did I include the "honest note on which feature the game can't reproduce"? Yes, infinite belief hierarchy.
      *   *Check:* "what predictably breaks the first time you run it"? Yes, students gaming the scoring or the saboteur revealing themselves.

      *   *Timing:* 90 mins is tight for 3 rounds + debrief. I need to keep rounds short (10 mins each).
