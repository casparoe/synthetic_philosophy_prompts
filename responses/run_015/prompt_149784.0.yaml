  ### The Responsibility Decision Tree

  This instrument classifies positions on moral responsibility using four specific thought experiments. Answer the questions in order. A "Yes" or "No" at each node directs you to the next question or to a final position (Leaf).

  **Node 1 (Standard Frankfurt):**
  In the standard setup, she acts exactly as she wants. A device would have forced her had she wavered, but she never wavered. Is she blameworthy?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 4.

  **Node 2 (Prior Self-Creation):**
  Suppose she freely arranged, years earlier, to become the sort of person the device would never have to correct. Is she blameworthy?
  *   **No:** **Leaf 1: Hard Incompatibilist.**
  *   **Yes:** Go to Node 3.

  **Node 3 (Induced Twitch):**
  Suppose the only alternative she retains is a twitch of hesitation the monitoring device itself induces. Does this technical possibility satisfy the requirement for freedom?
  *   **Yes:** **Leaf 2: Leeway Incompatibilist.**
  *   **No:** **Leaf 3: Source Incompatibilist.**

  **Node 4 (Trying-and-Failing):**
  Suppose she feels a strong pull to do otherwise and tries to resist, but the device ensures she succeeds anyway. Is she blameworthy?
  *   **No:** **Leaf 4: Unnamed (Volitionist).**
  *   **Yes:** Go to Node 5.

  **Node 5 (Desert):**
  If she is blameworthy, does she *deserve* suffering for it, or is blame just a tool to correct behavior?
  *   **Tool:** **Leaf 5: Revisionist.**
  *   **Desert:** Go to Node 6.

  **Node 6 (Alternative Possibilities):**
  In the standard case (Node 1), could she have done otherwise?
  *   **Yes:** **Leaf 6: Actual-Sequence Compatibilist.**
  *   **No:** **Leaf 7: Semicompatibilist.**

  *(Note: Leaf 8 is left unoccupied to allow for future theoretical combinations, such as a Revisionist Hard Incompatibilist.)*

  ---

  ### The Leaves (Positions)

  **Leaf 1: Hard Incompatibilist**
  *   **Diagnosis:** Occupied.
  *   **Awkward Line:** "I know you want to hold her accountable, but on this view, no one has ever deserved anything in the history of the world."

  **Leaf 2: Leeway Incompatibilist**
  *   **Diagnosis:** Occupied.
  *   **Awkward Line:** "She is innocent here, but if that device had induced a slightly more robust alternative, she would suddenly be guilty."

  **Leaf 3: Source Incompatibilist**
  *   **Diagnosis:** Occupied.
  *   **Awkward Line:** "Even though she traced her character back to a free choice, this specific action doesn't belong to her because the actual sequence was determined."

  **Leaf 4: Unnamed (Volitionist)**
  *   **Diagnosis:** Unoccupied. **Diagnosis:** Unattractive. It makes responsibility turn on internal conflict rather than action, excusing the resolute sinner while punishing the conflicted one.
  *   **Awkward Line:** "She is responsible when she acts wholeheartedly, but if she struggled against her own nature, we must let her off."

  **Leaf 5: Revisionist**
  *   **Diagnosis:** Occupied.
  *   **Awkward Line:** "We should blame her, not because she deserves it, but because it's the only way to keep her from doing it again."

  **Leaf 6: Actual-Sequence Compatibilist**
  *   **Diagnosis:** Occupied.
  *   **Awkward Line:** "She could have done otherwise, provided that 'could' doesn't mean she actually had the power to break the laws of physics."

  **Leaf 7: Semicompatibilist**
  *   **Diagnosis:** Occupied.
  *   **Awkward Line:** "She is fully responsible for what she did, even though it is literally true that she could not have done anything else."

  **Leaf 8: Unnamed (Revisionist Incompatibilist)**
  *   **Diagnosis:** Unexplored. **Diagnosis:** Merely unexplored. It combines the skepticism of Leaf 1 with the practice of Leaf 5, a stable but rarely defended position.
  *   **Awkward Line:** "No one ever deserves blame, yet we must continue to punish each other as if they did."

  ---

  ### Mapping Your Characters

  Here is where your three characters land in the tree, and an analysis of their disagreements.

  **Character 1:** *"She couldn't have done otherwise, so blame is off the table."*
  *   **Location:** **Leaf 2 (Leeway Incompatibilist).**
  *   **Path:** Node 1 (No) → Node 2 (Yes) → Node 3 (Yes).
  *   **Analysis:** This character defends the Principle of Alternative Possibilities (PAP). They argue that the presence of the device (which removes the ability to do otherwise) is sufficient to negate blame, regardless of the actual sequence of events.

  **Character 2:** *"The device never touched the actual story, so she is fully answerable."*
  *   **Location:** **Leaf 6 (Actual-Sequence Compatibilist).**
  *   **Path:** Node 1 (Yes) → Node 4 (Yes) → Node 5 (Desert) → Node 6 (Yes).
  *   **Analysis:** This character focuses on the actual sequence (what actually happened) rather than the counterfactuals (what the device would have done). They defend a compatibilist notion of "could have done otherwise."

  **Character 3:** *"Even if she is answerable, none of us are, really."*
  *   **Location:** **Leaf 1 (Hard Incompatibilist).**
  *   **Path:** Node 1 (No) → Node 2 (No).
  *   **Analysis:** This character is a global skeptic. While they might concede the Frankfurt point for argument's sake ("Even if she is answerable..."), their core position is that causal determination (or luck) undermines responsibility universally, rendering the device irrelevant.

  ### Substantive vs. Verbal Disagreements

  **1. Character 1 vs. Character 2 (Substantive)**
  *   **Fault Line:** The Principle of Alternative Possibilities (PAP) vs. Actual Sequence.
  *   **Verdict:** This is a genuine philosophical disagreement. Character 1 believes the *removal of alternatives* kills responsibility. Character 2 believes the *presence of a guided actual sequence* secures it. They will never agree on the verdict for this case.

  **2. Character 2 vs. Character 3 (Substantive)**
  *   **Fault Line:** Compatibilism vs. Hard Incompatibilism.
  *   **Verdict:** This is the deepest fault line in the debate. Character 2 believes responsibility can survive determinism; Character 3 believes it cannot. This is not verbal; it is a fundamental clash on the nature of causation and agency.

  **3. Character 1 vs. Character 3 (Mostly Verbal in this scene, Substantive elsewhere)**
  *   **Fault Line:** Leeway Incompatibilism vs. Hard Incompatibilism.
  *   **Verdict:** In *this specific scene*, their disagreement is **merely verbal** regarding the verdict. Both conclude "Blame is off the table." Character 1 argues it is off because of the *device* (no alternatives). Character 3 argues it is off because of *determinism* (no ultimate source).
  *   **Recommendation:** If you write twenty pages of them arguing about whether *this protagonist* is to blame, they are talking past each other, because they agree on the outcome. To make this substantive, you must shift the argument to a *different case*: a world without the device but with determinism. Character 1 would say she is responsible there (if she had alternatives); Character 3 would say she is not. If they stay on the Frankfurt case, cut the scene; they are allies in exoneration, despite different theories.

  ### Inseparable Leaves

  **Leaf 6 (Actual-Sequence Compatibilist) and Leaf 7 (Semicompatibilist)**
  *   **Diagnosis:** These leaves are difficult to separate in practice. Both agree that the protagonist is blameworthy in the Frankfurt case. The distinction (Node 6) relies on whether the character is willing to use the phrase "could have done otherwise."
  *   **Flag:** In a novel, these two positions may sound identical. Character 2 (Leaf 6) says "She could have done otherwise." A Semicompatibilist (Leaf 7) says "She is responsible, though she could not have done otherwise." Unless your characters are philosophically precise, these two will sound like they are saying the same thing. If you need distinct voices, ensure Character 2 emphasizes *freedom* while a hypothetical Semicompatibilist character emphasizes *control*.
