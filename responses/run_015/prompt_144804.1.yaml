prompt: |-
  I've got a departmental colloquium next thursday in front of an analytic metaphysics group — most of them work on persistence, composition and vagueness, and the two who've actually read the personal identity literature are conventionalists about it (roughly: just pick the relation that does the work and stop arguing about "identity"). No ethicists, and nobody who cares about prudential rationality for its own sake.

  Thesis: Parfit's fission argument shows at most that identity isn't necessary for what matters in survival, not that identity is irrelevant. What matters is psychological continuity/connectedness (call it R) holding non-branchingly — I get what matters from a future person only if that person is R-related to me without a comparably strong rival claimant. Sketch: (1) in asymmetric branch cases, where the scan leaves the original alive but damaged and the replica intact (or the other way round), the no-rival clause picks the stronger branch, which I claim is what people actually judge, and it does that without Parfit's talk of R coming in degrees; (2) in symmetric fission I concede there's no survival and try to locate the badness of fission in the loss of non-branchingness itself rather than in the loss of identity; (3) against degree-of-R views I use the case where a duplicate flickers into existence for one second on the far side of the galaxy, which I argue forces them to credit scattered partial survival everywhere.

  Write me the prep sheet: the objections this audience will actually raise, in their vocabulary, ordered by how much damage they'd do rather than by how often they come up in the literature — what I should concede in the first two minutes, which single reply has to land for the view to survive, where each of my replies is soft, and the question I'm definately hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **Event:** Departmental colloquium.
      *   **Audience:** Analytic metaphysicians.
      *   **Specializations:** Persistence (endurance/perdurance), Composition (mereology), Vagueness.
      *   **Specific Knowledge:** Only two have read personal identity literature; they are *conventionalists* (identity is a choice of conceptual scheme, not a deep fact).
      *   **Exclusions:** No ethicists, no one cares about prudential rationality *per se*.
      *   **Thesis:** Parfit's fission argument shows identity isn't *necessary* for what matters, but not *irrelevant*. What matters is Relation R (psychological continuity/connectedness) holding *non-branchingly*.
      *   **Key Claims:**
          1.  Asymmetric fission: The "no-rival" clause picks the stronger branch (matches intuition) without needing degrees of R.
          2.  Symmetric fission: No survival. Badness lies in loss of non-branchingness, not loss of identity.
          3.  Against degree-R views: The "flickering duplicate" case (scattered partial survival is absurd).
      *   **Goal:** A prep sheet focusing on objections *this specific audience* will raise, ordered by damage potential, including concessions, the "make or break" reply, weak points, and the dreaded question.

  2.  **Analyze the Audience's Lens (Metaphysics vs. Ethics/Prudentiality):**
      *   *Persistence/Mereology:* They care about *what* the object is, how it persists through time, and the logic of composition. They will treat "survival" as a metaphysical relation, not a pragmatic/ethical one.
      *   *Vagueness:* They will pounce on the "non-branching" clause. Is it vague? Does it induce indeterminacy in identity?
      *   *Conventionalism:* The two experts think identity is a linguistic/conceptual choice. They will attack the idea that there is a "fact of the matter" about what matters that tracks non-branching R.
      *   *Disinterest in Prudential Rationality:* Arguments about "why should I care about my future self?" won't land. Arguments need to be about *ontology* and *logic*.

  3.  **Brainstorming Objections (Filtering for the Audience):**
      *   *Standard Parfitian Objection:* "Why does branching matter if R is what matters?" (Too ethical/prudential).
      *   *Metaphysical Objection:* "What makes the non-branching clause intrinsic or extrinsic?" (High damage).
      *   *Vagueness Objection:* "When does a rival become 'comparably strong'?" (High damage given their interest in vagueness).
      *   *Conventionalist Objection:* "You're just stipulating a new concept of 'survival'." (High damage from the two experts).
      *   *Persistence Objection:* "Is this a 3D or 4D view? How does R relate to temporal parts?" (Medium/High damage).
      *   *The Flickering Duplicate:* "Why is scattered survival absurd? Maybe composition is unrestricted?" (Medium damage).

  4.  **Ordering by Damage Potential:**
      1.  **The Extrinsicness/Only x and y Problem:** Metaphysicians hate when identity conditions depend on extrinsic facts (like the existence of a rival elsewhere). This kills the "non-branching" clause immediately if not handled.
      2.  **The Vagueness of "Rival":** Since they work on vagueness, they will attack the threshold for "comparably strong rival." If it's vague, is survival vague? If survival is vague, is identity vague? (Leibniz's Law issues).
      3.  **The Conventionalist Attack:** "You're reifying 'what matters' as if it's a natural kind."
      4.  **The Flickering Duplicate/Mereology:** Unrestricted composition fans might not mind scattered survival.

  5.  **Drafting the Prep Sheet Sections:**

      *   **Concessions (First 2 mins):** Need to disarm the conventionalists and the metaphysicians. Admit identity is distinct from "what matters." Admit the view is revisionary but claims to track pre-theoretic concern.
      *   **The "Make or Break" Reply:** Must address the Extrinsicness problem (Only x and y). If the relation that determines survival depends on something spacelike separated, it violates local supervenience. This is the metaphysician's kill shot.
      *   **Soft Replies (Weak Points):**
          *   The definition of "Rival."
          *   The badness of fission (why is loss of non-branching bad if identity wasn't going to hold anyway?).
          *   The flickering duplicate (relies on intuition about absurdity which mereologists might reject).
      *   **The Dreaded Question:** Something that combines vagueness, convention, and metaphysics. "Is 'non-branching' a vague predicate, and if so, does that make identity vague?"

  6.  **Refining the Vocabulary:**
      *   Use terms like "supervenience," "intrinsicness," "temporal parts," "sortal concepts," "indeterminacy," "truthmakers."
      *   Avoid: "Prudential concern," "moral responsibility," "selfishness."

  7.  **Developing the Content (Iterative refinement):**

      *   *Objection 1 (Extrinsicness):* This is the "Only x and y" principle. If my survival depends on whether a duplicate exists in Andromeda, that's extrinsic. Metaphysicians hate this. *Damage: Critical.*
      *   *Objection 2 (Vagueness):* "Comparably strong rival." Where is the cut-off? If it's vague, is it indeterminate whether I survive? If identity is involved, Evans' argument looms. *Damage: High.*
      *   *Objection 3 (Conventionalism):* The two experts will say you're just picking a different convention than Parfit. *Damage: Medium-High.*
      *   *Objection 4 (Mereology):* The flickering duplicate. If they are universalists about composition, scattered objects are fine. *Damage: Medium.*

      *   *Concession:* Admit identity is one thing, survival another. Don't try to save "Identity" in the strict metaphysical sense. Save "What Matters."
      *   *Key Reply:* Defend the *non-branching* clause not as extrinsic magic, but as a structural feature of the causal chain. (This is hard, need to frame it carefully). Actually, better advice: Frame it as a *conceptual* truth about the concept of "survival" rather than a metaphysical truth about "identity." This appeases conventionalists.
      *   *Soft Spots:* The "badness" of fission. Without ethics, why is fission bad? Need to frame it as a metaphysical loss (loss of unique continuation).
      *   *Dreaded Question:* "Is the non-branching requirement vague, and does that entail indeterminate identity?"

  8.  **Final Polish:** Check tone. Needs to be strategic, slightly cynical but helpful. Focus on *their* interests (metaphysics), not the traditional personal identity interests (ethics).

