      *Revised Strategy:* The "Make or Break" reply must address the *Only x and y* problem (extrinsicness). That is the metaphysician's primary weapon against non-branching views.

      *Revised Dreaded Question:* Something about the *truthmaker* for the non-branching clause.

  9.  **Finalizing the Output Structure:**
      *   Audience Profile (Brief reminder).
      *   Top 3 Objections (Ordered by Damage).
      *   The 2-Minute Concession.
      *   The "Make or Break" Reply.
      *   Soft Spots (Where to hedge).
      *   The Dreaded Question.

  10. (Reviewing against constraints): "Ordered by how much damage they'd do rather than by how often they come up in the literature." "In their vocabulary." "What I should concede." "Single reply." "Where replies are soft." "Question hoping nobody asks."

