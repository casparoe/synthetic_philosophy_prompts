answer: |-
  # Colloquium Prep Sheet: Metaphysics Division
  **Audience Profile:** Persistence/Mereology/Vagueness specialists. Two Conventionalists on PI. No Ethicists.
  **Strategic Goal:** Shift the debate from *Prudential Rationality* (which they ignore) to *Metaphysical Structure and Vagueness* (which they care about). Do not defend "Identity" as a deep metaphysical fact; defend "Non-Branching R" as the correct *concept* for tracking persistence in our best ontological scheme.

  ---

  ### 1. Top 3 Objections (Ordered by Damage Potential)

  **I. The "Only x and y" / Extrinsicness Objection (Critical Damage)**
  *   **The Worry:** Metaphysicians hate identity (or survival) conditions that depend on extrinsic facts. If whether *I* survive depends on whether a duplicate flickers into existence in Andromeda (your flickering duplicate case), you violate local supervenience. My intrinsic properties and causal history are fixed, yet your view says my survival status flips based on a spacelike-separated event.
  *   **Why it hurts:** This isn't just a PI objection; it's a general metaphysical constraint on dependence relations. If you can't explain how the "no-rival" clause supervenes on local facts, they will treat the view as metaphysically incoherent.
  *   **Likely Phrasing:** "You're making survival extrinsic. How can the truthmaker for 'Person A survives at t2' include the non-existence of a distinct entity B at t2?"

  **II. The Vagueness of "Rival" (High Damage)**
  *   **The Worry:** This audience specializes in vagueness. Your "comparably strong rival claimant" clause is a vagueness magnet. Is a 90% psychological overlap a rival to a 95% overlap? If the threshold is vague, then whether I survive is vague.
  *   **Why it hurts:** If survival is vague, and survival is what matters, then *what matters* is vague. If you link this to identity (even loosely), they will hit you with Evans' argument on indeterminate identity. They will press you on whether the world is fuzzy or your concepts are.
  *   **Likely Phrasing:** "Is the 'non-branching' condition a sharp boundary? If not, are you committed to indeterminate existence?"

  **III. The Conventionalist Trap (Medium-High Damage)**
  *   **The Worry:** The two experts think PI is just a choice of conceptual scheme. They will argue you are just stipulating a new definition of "survival" that happens to align with your intuitions, but offers no metaphysical advantage over Parfit's or Lewis's stage theory.
  *   **Why it hurts:** They will dismiss your "badness of fission" as merely verbal. If identity is conventional, why is *this* convention (non-branching) privileged over Parfit's (R matters, identity doesn't)?
  *   **Likely Phrasing:** "You're just carving the world differently. What metaphysical work is 'non-branching' doing that 'R' isn't?"

  ---

  ### 2. The First Two Minutes: Strategic Concessions
  *Do not fight the "Identity is Deep" battle. You will lose it against conventionalists and mereologists.*

  1.  **Concede Identity vs. Survival:** Explicitly grant that "Identity" in the strict Leibnizian sense might not hold in fission cases. Frame your project as identifying the *persistence relation* that underpins our practices of anticipation and responsibility, not saving numerical identity at all costs.
  2.  **Concede Convention (Partially):** Acknowledge that there is a choice of concepts involved. Your claim is not that Non-Branching R is the *only* coherent concept, but that it is the *best fit* for the cluster of concerns (anticipation, memory, agency) we label "survival."
  3.  **Pivot to Structure:** State clearly: "I am not arguing about prudential rationality. I am arguing about the **topological structure of causal chains** required for a unique continuant." This signals you are speaking metaphysics, not ethics.

  ---

  ### 3. The "Make or Break" Reply
  **The Objection:** The Extrinsicness Problem (Objection I above).
  **The Reply:** **The "Causal Field" Defense.**
  *   **Argument:** Do not claim the rival's existence *changes* the intrinsic facts of the original branch. Claim that "Survival" is a *global* property of a causal network, not a local property of a single strand.
  *   **Key Line:** "Survival isn't a relation between time-slices; it's a structural feature of the entire causal tree. Just as 'being a trunk' depends on there being no other trunks in the tree, 'being the survivor' depends on the branching structure of the whole. The truthmaker is the *total causal graph*, not the local slice."
  *   **Why it must land:** If you fail to justify why extrinsic facts matter, the mereologists will eat you alive for violating supervenience. You must convince them that persistence is inherently a structural/global notion, not a local one.

  ---

  ### 4. Where Your Replies Are Soft (Hedge Here)
  *   **The Badness of Fission:** You claim the badness lies in the loss of non-branchingness. Without ethicists in the room, you cannot ground "badness" in welfare.
      *   *Risk:* They will ask, "If R holds, and I have successors, what metaphysical loss occurred?"
      *   *Hedge:* Frame it as a loss of *uniqueness* or *singularity* of reference, not a loss of welfare. "It's not that the future is worse; it's that the relation of *my* future becomes indeterminate."
  *   **The Flickering Duplicate:** You use this to kill degree-R views.
      *   *Risk:* Unrestricted Composition fans (common in this group) won't mind scattered objects. They might say, "Sure, you partially survive in Andromeda. So what?"
      *   *Hedge:* Pivot to *agency*. "A scattered survivor cannot be the object of a unified plan." (Risky, edges toward ethics). Better: "It violates the sortal constraints on *person*. Persons are countable units; scattered partials are not."
  *   **Defining "Rival":**
      *   *Risk:* Vagueness experts will pin you down on the threshold.
      *   *Hedge:* Embrace epistemicism or supervaluationism if pressed. "There is a sharp cut-off determined by the causal facts, even if we cannot know it." (This is a standard metaphysical move they will respect, even if they disagree).

  ---

  ### 5. The Question You Hope Nobody Asks
  **"What is the truthmaker for the non-branching clause in a symmetric fission case where both branches are destroyed immediately?"**

  *   **Why it's deadly:**
      1.  It combines **Vagueness** (when does destruction count?), **Persistence** (do the stages exist?), and **Conventionalism** (why does it matter if both die?).
      2.  If you say "There is no truthmaker," you concede the relation is not real.
      3.  If you say "The truthmaker is the absence of a rival," they will press: "Does an absence exist?" (Meinongian worries).
      4.  If you say "It's the causal history," they will ask: "But the history is identical to the case where one survives. How can identical truthmakers yield different survival values?" (This revives the Extrinsicness problem in a harder form).

  **Prepared Deflection:** "In that case, the causal tree terminates. The question of 'survival' presupposes a future continuant. If both branches die, the non-branching condition is trivially satisfied but vacuously so. The loss is the termination of the causal chain, not the branching." (Pray they don't follow up on "vacuously").
