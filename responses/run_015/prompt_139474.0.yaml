  *Counter-Argument:* The Property Manager (external) relies on the minutes. If the minutes say "Member X resigned," the PM acts on that.
  *Resolution:* The procedure must distinguish between "Recorded Event" and "Current Status." The minute records *what was said*. The "Current Status" is a separate list.
  *Better Resolution for the Prompt:* The prompt asks "Was the act performed?" Austin says yes (Abuse). I should stick to the Austinian line for the sake of the exercise, even if it hurts the user. It demonstrates the "Insincerity Asymmetry." I will rule that the resignation *act* occurred in the minutes, even if she was later reinstated. This creates the paper trail the PM needs. This goes against the user's desire to make it look like she never left.

