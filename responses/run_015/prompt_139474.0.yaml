prompt: |-
  hey — I'm taking a philosophy of language seminar this term (Austin, Searle, indirect speech acts, we just did the infelicity stuff: misfires where nothing happens at all vs. abuses where the act happens but hollowly, plus the bit where a performative uttered in a play or a joke isn't void so much as parasitic/etiolated) and I also happen to be the recording secretary for my uni's student housing co-op — about 300 members, board meets every Sunday night, minutes have to be posted within 48 hours, the chair signs off before they go up, and then the next meeting rubber-stamps them, which meant that by the time anyone catches a mistake its baked in. And the minutes get read by people who were never in the room: the property management company, the student activities office that controls our funding, members who were at work, next years board. Nobody warned me that minute-taking is basically applied speech act theory — I'm constantly deciding which utterances in that room were *acts* (a motion, a commitment, a resignation, an adjournment) and which were just noise, and whatever I write down is what the act ends up being for everyone downstream.

  So could you turn the theory into an actual procedure I can run while writing minutes, preferably at midnight after a three hour meeting? I want an ordered checklist: the questions to ask about each candidate utterance, what counts as a good enough answer to each when I can't go back and ask anyone, the points where the procedure stops with "no act, don't record it as one", and the points where it hands the decision to a human because its a politics or values call rather than a conceptual one. It has to be runnable by my backup, a first-year engineering student who has not read any Austin and never will, so no jargon in the steps themselves even if the reasoning behind them is technical. Two problems I keep hitting that I dont think the theory handles cleanly, please dont skip them: (1) *deferred uptake* — nearly everything said in the room is addressed to the room, but the audience whose uptake actually matters is some later reader (the property manager, next years board, maybe a bank), and the two can come apart badly, e.g. something everyone present correctly hears as blowing off steam will read, in the minutes, as a binding commitment to fix the boiler by a date. I don't want the procedure to just say "uptake succeeded, act performed"; I want it to tell me which audience's uptake to weight, when the later reader wins over the room, and how to write the thing so the later reader gets it right. (2) *the insincerity asymmetry* — my read of Austin is that an insincere promise is still a promise (an abuse, not a misfire) while a promise by someone with no authority to make it is nothing at all, which implies my job is completely indifferent to whether anyone meant what they said, and the members are going to hate that. Also please say explicitly what the procedure can't settle, and where it'll misfire. And I'm not asking for citations or a reading list, I can look the seminar stuff up myself — I want the operational version.

  Then run it on three cases from last term, and include at least one where the answer goes against me. (a) Our maintenance director, mid-argument about the bike room: "fine, I'll have the locks replaced by Friday" — no "I promise", said angrily, he actually did it, and then the week after he said he'd never committed to Friday at all. (b) A board member after losing a budget vote: "if thats how this is going then I'm done, take this as my resignation" — she showed up at the next two meetings and acted completely normal, nobody ever formally accepted or declined anything, and four months later the property manager read the minutes and asked whether we had a vacancy on the board. I want her to still be on the board: she's a friend and shes literally the only person who understands the boiler, so dont just tell me what I want to hear, tell me what your procedure says and how much of it is genuine. (c) At our training retreat we ran a practice meeting with a fake chair; the fake chair said "I declare this meeting adjourned" at the end of it and the real meeting — which was still on the agenda and still had quorum — just dissolved, everyone packed up. Was the real meeting ever adjourned, and what do I write in the minuites?
