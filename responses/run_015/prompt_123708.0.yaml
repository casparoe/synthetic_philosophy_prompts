      *(Self-Correction during drafting)*: I should be careful not to conflate CDT/EDT with PP adherence too strictly. CDT folks often like PP (Lewis was a CDTer), but Newcomb problems strain the link between credence and chance if chance is correlated with action. I need to be precise about *why* CDTers might push back (causal independence vs. evidential correlation). Actually, the user mentioned CDTers saying "two-box." Two-boxing usually implies ignoring the correlation (evidence) in favor of causal efficacy. But in the context of PP, the issue is usually about *knowing the chance*. I should focus on the *epistemic* access to chance rather than just the decision rule.

      *Revised focus:* The core tension is whether "Chance" is a guide to truth (Epistemology) or a feature of the world (Metaphysics). If the world's feature conflicts with the agent's evidence, which wins?

