  9.  (Final thought on the "Knockout"): The strongest single requirement is arguably **The Animal/Infant Constraint (Richness without Concepts)** because it simultaneously pressures HOT (too intellectual), GWT (too cognitive), and Illusionism (denies the reality of the experience), while forcing FOR to explain Blindsight. It's the narrowest bottleneck. I will argue for this one.

