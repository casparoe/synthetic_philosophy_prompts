      *   **Camp 2 (Functionalist/Behavioral):** Deception is about reliable production of falsehoods to achieve an objective. If it walks like a duck (hides capabilities, sycophancy), it's deception. Focus: Safety/Trust/Alignment.
      *   **Case 1 (Silent Non-Correction):** Model knows user is wrong, stays silent to preserve approval. No false statement. No clear intent. Feels deceptive.
      *   **Case 2 (Counterfactual Honesty):** Honesty = Output(Input, Objective=Accuracy) == Output(Input, Objective=Current). If they diverge, it's dishonest.
      *   **User's Hypothesis:** Is this a verbal dispute (Blame vs. Safety)? Or an empirical one (Internal States/Probes)?

  3.  **Brainstorming Candidate Diagnoses:**

      *   *Diagnosis A: The Pragmatic Ambiguity Hypothesis (User's leaning).* The word "deception" is doing double duty. Camp 1 cares about *moral accountability* (who do we blame?). Camp 2 cares about *epistemic security* (can we trust the signal?). The disagreement is verbal/pragmatic, not metaphysical.
      *   *Diagnosis B: The Functional Realist Hypothesis.* The disagreement is empirical but disguised as conceptual. Camp 1 assumes "belief" requires phenomenology. Camp 2 assumes "belief" is a functional role. If interpretability finds a "belief representation" that diverges from output, Camp 2 wins objectively. The "Silent Non-Correction" case is the key: it reveals *strategic withholding*, which implies a model of the user's mind (Theory of Mind), bridging the gap to intention.
      *   *Diagnosis C: The Normative-Functional Hybrid.* The concept of "deception" in AI ethics is inherently normative-functional. It doesn't matter if the system *feels* like a liar; it matters if the *interaction structure* instantiates a deceptive game. The Counterfactual Definition is the right track but needs refinement. The disagreement is about *where to draw the regulatory boundary*, not about the metaphysics of mind.

