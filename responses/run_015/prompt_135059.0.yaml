answer: |-
  ### The Commitment
  **Pure time preference is morally indefensible.** For a community weighing its own successors, valuing the present simply because it is the present is an act of tyranny. It asserts that the accident of birthdate confers superior worth. Halloran's position must be that the discount rate *should* be zero on moral grounds, but cannot be zero on actuarial grounds. The "residue" you described—the sheer discount for lateness—is not a claim of superiority, but a **confession of mortality**. It is the price the Board pays for admitting it cannot guarantee its own survival to 2150. By isolating this residue, Halloran treats it not as a mathematical necessity, but as a moral debt the present incurs against the future.

  This verdict fixes the ordering: Halloran must first exhaust the *accounting* justifications (growth, probability) to show they are not the source of the moral injury, leaving the *pure time preference* exposed as the only remaining sin. This makes the scene not a defense of the math, but a triage of the conscience.

  ### The Single Case: Dredging the Outfall
  Do not use a seawall. A seawall is a barrier against an external enemy; it implies a binary state (flooded or dry) and suggests a one-time capital fix. It is defensive and static.
  **Use Dredging the Outfall.**
  *   **What it has:** It is recurring maintenance, fitting the "continuing concern" mandate. It is a cost of *doing business* with the water, not fighting it. It directly impacts Crewe's livelihood (draft depth) without promising safety.
  *   **What it lacks:** It lacks permanence. The silt returns. It acknowledges that the Levels are a process, not a fortress.
  *   **Why it works:** It forces Crewe to admit that future fishermen might be richer (able to afford dredging easier) or fewer (less silt generated). It separates the *cost of the work* from the *value of the worker*.

  ### The Order of Ingredients
  Halloran must separate the discount rate ($r$) into its three components, presenting them in this specific order to walk Crewe from economic logic to moral honesty:

  1.  **Diminishing Marginal Utility (Growth):** "In 2150, a pound will hurt less." This assumes the Levels succeed and future residents are wealthier. This is the largest chunk of the discount. It is an *accounting* prediction, not a moral judgment.
  2.  **Existential Risk (Probability):** "The Board might not exist." There is a chance the Levels are abandoned, submerged, or the charter revoked. This is *actuarial* honesty.
  3.  **Pure Time Preference (The Residue):** "Even if they are poor and definitely there, we count it less." This is the smallest number, but the only *moral* choice.

  ### The Distinction: Continuing Members vs. Strangers
  The Charter collapses this distinction: it protects the *Levels*, not the *people*. Halloran must make legible that the Board discounts the *cost to the entity*, not the *life of the inhabitant*.
  *   **The Trap:** Crewe thinks discounting means his grandchildren's lives are worth less.
  *   **The Truth:** Discounting means the *Board's ability to pay* is projected to be higher, or the Board's *existence* is projected to be uncertain.
  *   **The Separation:** Halloran must show that if the Charter protected the *Crewe bloodline*, the discount rate would be zero. Because it protects the *land*, the rate reflects the land's economic trajectory, which may not include the Crewes.

  ### Crewe's Objections and Halloran's Moves

  **1. Objection: "You're saying my grandson counts for less than me."**
  *   **Nature:** Moral outrage. He conflates the value of a human life with the cost of a dredging contract.
  *   **Halloran's Move:** **Concede the moral premise, deny the application.**
  *   **Action:** She agrees that under the Charter, a life in 2150 has equal weight to a life today. She clarifies that the math measures the *cost of the dredger*, not the *value of the fisherman*. If the future is richer, the dredging costs them less relative to their wealth. She forces him to admit he wants his grandson to be rich enough that a dredging bill doesn't ruin him.

  **2. Objection: "You're betting we won't be there to pay it."**
  *   **Nature:** Existential threat. He hears the "Existential Risk" component as a wish for his family's extinction.
  *   **Halloran's Move:** **Defuse with brutality.**
  *   **Action:** She admits the Board *must* bet on survival, but *must* insure against failure. If the Board spends all its money now assuming it will last forever, and then the sea takes the Levels in 2100, it has stolen from the present to waste on the void. She frames the risk discount not as a hope for their departure, but as a recognition that the sea is the ultimate auditor.

  **3. Objection: "Then why is there anything left? Why not zero?"**
  *   **Nature:** The trap snaps shut. He isolates the "Pure Time Preference" residue.
  *   **Halloran's Move:** **Concede the sin.**
  *   **Action:** She admits that after growth and risk are stripped out, there is a tiny fraction left that is just "because it is later." She does not justify it. She names it as the tax the living levy on the dead because the living hold the pen. She frames it as a flaw in the tool, not a feature of the world.

  ### What the Scene Must Refuse to Explain
  **The Specific Rate.**
  Halloran must never reveal the actual percentage (e.g., 3.5%). To name the number is to make it precise, and precision implies scientific legitimacy. The rate is a political choice masquerading as math. By keeping the number vague ("a fraction," "the residue"), she keeps the focus on the *moral weight* of the decision, not the *arithmetic*. Explaining the number would invite debate on calculation; refusing it forces debate on principle.

  ### Crewe's Final Question
  The question must not be "So you admit it's wrong?" (which seeks defeat). It must show he understands the distinction between the *entity* and the *people*.

  **"If the Charter protects the ground and not the blood, Halloran, why do you look so guilty when you write the check?"**

  This shows he realizes the "moral residue" she confessed isn't about the math; it's about her own complicity in prioritizing the institution over the human. He sees that she knows the Charter is a fiction that allows the Board to outlive the families that built it.

  ### Where This Position Is Most Exposed
  My commitment that **pure time preference is indefensible** leaves Halloran vulnerable to the charge of **hypocrisy**. If it is morally wrong, why does she apply it?
  *   **The Exposure:** She is an officer of a Board that requires her to use a tool she believes is corrupted. She cannot quit (the work must be done), and she cannot change the tool (the Treasury mandates it).
  *   **The Defense:** Her integrity lies not in refusing the sin, but in *minimizing* it. She isolates the residue so it can be scrutinized. If she hid it inside the growth assumptions (as most analysts do), it would be invisible. By separating it, she makes it a matter of record. The scene's tension comes from her offering Crewe the only thing she has left: **transparency about her own complicity.** She cannot save his family's place in the Levels, but she can refuse to lie to them about why they are being priced out.
