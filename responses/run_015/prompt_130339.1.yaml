  (2) Nagarjuna denies all four horns for dharmas, so dharmas are empty, śūnyatā.

  (3) but emptiness itself either is identical to dharmas, different from them, both, or neither.

  (4) if emptiness is identical, then dharmas arent empty — theyre just themselves. if different, emptiness carries its own svabhāva, violating (2). both/neither collapses into contradictions with dependant origination.

  (5) so asserting that all dharmas are empty cant sit in any horn without self-refutation or sneaking in a non-empty ground.

  (6) therefore Madhyamaka collapses into nihilism or crypto-essentialism about the saṃvṛti/paramārtha boundary.

