answer: |-
  1. Symmetric overdetermination
  *   **Translates cleanly:** Multiple independent triggers converging on a single incident. Your example of the expired certificate and the retry storm hitting the same queue maps directly to two sufficient faults present in the same window.
  *   **Translates with distortion:** You treat this probabilistically ("fixing this keeps us up sixty per cent of the time"). The historical concept demands certainty: either one *would* have caused the outcome alone. Your vocabulary allows for "maybe," theirs requires "would."
  *   **Cannot be expressed:** The metaphysical status of the counterfactual. In a postmortem, if you fix one trigger, you close the ticket. In history, if you remove one cause but the outcome remains guaranteed by the other, the explanation remains incomplete.

  2. The backup that never fired
  *   **Translates cleanly:** A healthy standby system or failover path that was available but not engaged during the incident.
  *   **Translates with distortion:** You call this a "mitigation opportunity" or "configuration gap." History calls it a "cause." In your vocabulary, if the failover didn't fire, it isn't part of the incident timeline. In theirs, it is part of the causal structure because it guarantees the outcome regardless of the first cause.
  *   **Cannot be expressed:** Causal status for non-events. You cannot open a postmortem for an incident that was prevented by a backup, so you have no vocabulary for causes that exist only in the timeline where the primary trigger failed.

  3. The bundle claim (INUS conditions)
  *   **Translates cleanly:** A contributing factor within a chain of events. You accept that small things matter when combined with others.
  *   **Translates with distortion:** You treat factors as additive weights toward probability. The historical claim treats them as logical conjuncts in a sufficient set. You fix redundancy (defence in depth); they argue about whether a factor was non-redundant within the sufficient bundle.
  *   **Cannot be expressed:** The logical requirement of non-redundancy. Your practice encourages redundancy to reduce blast radius. Their theory requires isolating the specific subset of conditions that was strictly sufficient, which your probabilistic model dissolves.

  4. Causes versus background conditions
  *   **Translates cleanly:** The difference between a new trigger and the baseline configuration. You distinguish between a bad deploy (cause) and a known fragile service (background).
  *   **Translates with distortion:** You define "normal" as "last known good state." History defines "normal" as social or political expectation. Your baseline is technical; theirs is normative.
  *   **Cannot be expressed:** The judgment of what *should* be normal. You accept the architecture as given unless it breaks. They argue that the background conditions (alliance systems) are themselves causal because they should not have been normal.

  5. Contrastive explanation
  *   **Translates cleanly:** Defining the scope of the incident. You explain why service A went down rather than staying up.
  *   **Translates with distortion:** Your contrast is fixed: Incident vs. No Incident. Their contrast is flexible: War in 1914 vs. War in 1915, or War vs. Peace. You optimize for uptime; they optimize for specificity.
  *   **Cannot be expressed:** Alternative timelines where the outcome occurs later or differently. Your postmortem ends when service is restored. Their explanation must account for why the event happened *then* rather than *later*, which your mitigation-focused view treats as irrelevant.

  6. Reason-based explanation
  *   **Translates cleanly:** Human factors or operator decisions logged during the incident.
  *   **Translates with distortion:** You treat reasons as system inputs that led to a trigger. They treat reasons as justifications that make the action intelligible. You ask "what did they click?"; they ask "why did they think that was right?"
  *   **Cannot be expressed:** The validity of the agent's reasoning. In a postmortem, a "good reason" that leads to an outage is still a root cause. In history, a "good reason" might exempt the action from being treated as a mere mechanical cause.

  ### Diagnosis

  Your friend is closer to the mark than you are. The historian's worry is not less sharp; it is simply orthogonal to your remit. You suspect the puzzle is a fuss about nothing because your practice dissolves it into a to-do list. That dissolution works only because you have the authority to act and a forward-looking goal. You do not need to know which cause was *the* cause; you only need to know which fix yields the best uptime per engineering hour.

  The residue that does not survive translation is not a blind spot in your thinking. It is a feature of your trade. Postmortems are engineering tools, not truth machines. They are designed to ignore the metaphysical weight of counterfactuals in favour of actionable mitigations. The historian cannot ignore it because their goal is understanding, not mitigation. The hard question never arises for you not because it is solved, but because you are paid to stop asking it once the service is back up.

  ### Uncertainty

  My translation does the most violence in **Item 3 (The bundle claim)**. I have forced a logical structure (necessary parts of sufficient sets) into a probabilistic model (weights contributing to risk). These are fundamentally different ways of counting reality. I am least confident here because your vocabulary treats causes as levers to pull, whereas the historical concept treats them as truths to be uncovered.

  I would move to a different verdict if incident response ever required absolute causal truth rather than statistical reliability. If your team were tasked with proving *why* an incident happened in a court of law rather than preventing recurrence, the residue would become critical, and the "different questions" defence would collapse.

  \answer{different-questions, because IR targets mitigation; history targets ontological truth}
