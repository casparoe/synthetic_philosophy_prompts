answer: |-
  ### 1. Order of Introduction

  **Sequence and Dependencies**
  1.  **The American Heuristic (5 minutes):** Begin by eliciting the students' default assumption: that church–state separation is a single spectrum (more separation vs. less separation), likely modeled on their understanding of the U.S. Establishment Clause. *Dependency:* You cannot disrupt this model until they have articulated it.
  2.  **France (10 minutes):** Present this profile first. It is the most effective disruptor because American students associate France with strict secularism (*laïcité*). The Alsace-Moselle exception (state payroll, presidential appointment of bishops) immediately fractures the idea that a "separation statute" (1905) guarantees a uniform outcome. *Dependency:* Students must see that a legal statute does not equal a functional reality before they can analyze specific state functions.
  3.  **Germany (20 minutes):** Present this second as the carrying case. It deepens the fracture by showing a state with *no* established church that nonetheless integrates itself into religious life more deeply than England. *Dependency:* Students need the France contrast to understand that "no establishment" does not mean "no state involvement."
  4.  **England (10 minutes):** Present this last. It completes the triangle by showing formal establishment without financial integration (no tax). *Dependency:* Students need the Germany case to appreciate that England's establishment is symbolic/personnel-based rather than fiscal.
  5.  **The Function-Grid (5 minutes):** Introduce the grid **afterward**, as a generalization the students assemble themselves. Do not present the grid as an empty schema at the start. If you give them the checklist first, they will treat the cases as mere data-entry exercises. By presenting the grid after the cases, you force them to feel the cognitive dissonance of the three profiles first; the grid then arrives as the necessary tool to resolve the confusion.

  ### 2. The Carrying Case

  **Choice:** The **German exit ruling** (2012 Federal Administrative Court case).

  **Why:** This case personalizes the abstract concept of "registration." It moves the discussion from macro-level funding (which students can dismiss as historical accident) to the micro-level of individual identity (which feels immediate and rights-based). It proves that the state defines the boundary of religious membership, not just the church.

  **Content to Keep:**
  *   **The Individual:** A retired professor of canon law (this detail matters—it shows even an expert cannot outmaneuver the bureaucracy).
  *   **The Motive:** He wanted to leave the church *as a public-law corporation* (to stop taxes) but remain Catholic *in matters of faith*.
  *   **The Mechanism:** The federal tax database and employer withholding.
  *   **The Ruling:** The state cannot register a split membership; the declaration of exit is legally binary.

  **Content to Strip:**
  *   **The Specific Tax Rate:** Do not dwell on the "eight or nine percent" figure; it distracts into economic policy. Just call it "a percentage of assessed income tax."
  *   **The Court Name:** "Federal Administrative Court" is sufficient; do not elaborate on its jurisdiction relative to other courts.
  *   **The Collection Fee:** Mention the state retains a fee, but do not discuss the rate.

  **Two-Case Structure Judgment:**
  A one-case structure is sufficient and preferable for fifty minutes. Adding a second carrier (e.g., Alsace) risks turning the session into a tour of exceptions rather than an analysis of functions. Use France and England as contrasting profiles, but let the German professor's failed exit attempt carry the theoretical weight of the "bundle" argument.

  ### 3. The Misconceptions

  **1. "France must be the most separated country because it has an explicit separation statute."**
  *   **When to head off:** During the **France** profile (Step 2).
  *   **Strategy:** **Refute.** Do not concede this. Use the Alsace-Moselle details immediately to show that the 1905 statute is not coextensive with the national territory. This establishes early that statutes are not functions.

  **2. "A church tax means Germany has a state religion."**
  *   **When to head off:** During the **Germany** profile (Step 3), before discussing the exit ruling.
  *   **Strategy:** **Bracket.** Acknowledge the intuition is logical but ask them to hold it in suspension until they compare it to England. If you refute it too early, they will cling to it; if you bracket it, they must wait for the comparative evidence to resolve it.

  **3. "Establishment entails government control of clergy and therefore makes England the least free."**
  *   **When to head off:** During the **England** profile (Step 4).
  *   **Strategy:** **Concede.** Acknowledge that formal appointment power exists (Sovereign appoints bishops), but pivot immediately to the lack of financial control (no tax). This forces them to decouple "control" from "freedom" and see establishment as a specific functional bundle rather than a tyranny metric.

  **4. "Membership is a matter of private belief rather than of registration."**
  *   **When to head off:** During the **German exit ruling** discussion (Step 3).
  *   **Strategy:** **Refute.** This is the core pedagogical moment. Use the professor's failed qualification to demonstrate that state law cannot register a split membership. This is the point where the "bundle" idea must land: the state function of *registration* overrides private belief in the public sphere.

  ### 4. Judgment on the Grid

  **Are five functions the right scaffold?**
  Yes, keep all five. Cutting them down risks collapsing the distinct variations you want them to see. For example, merging "Recognition" and "Registration" would hide the difference between France (recognizing bodies) and Germany (registering individuals). First-years can handle five categories if they are treated as checklists rather than abstract theories.

  **Which function is load-bearing?**
  You are correct: **Registering individual membership** is the load-bearing function. American students view religious affiliation as inherently private and voluntary. They can understand state funding (Revenue) or state titles (Appointment) as historical artifacts. They cannot easily see *record-keeping* as a political act. When they grasp that the state maintains a tax database of religious membership that overrides theological self-definition, the idea that "separation is a bundle of functions" becomes unavoidable. Use this function as the key that unlocks the rest of the grid.

  ### 5. Closing Check

  **Task:** Classify a fourth arrangement using only the functions.
  **Instructions to Students:** "Based on the five functions we identified, map the following hypothetical country. Is it more like England, Germany, or France? Or is it a new combination?"

  **Drafted Fourth Arrangement:**
  > "In Country X, there is no official state church and no religious tax collected by the state. However, all religious buildings must be licensed by the Ministry of Interior to operate. Clergy salaries are paid by congregations, but the Ministry must approve all hires. Citizens check a box for religious affiliation on the national census, which determines local school holiday schedules."

  **Discrimination Criteria:**
  *   **Student who memorized:** Will try to match it to France or Germany based on surface features (e.g., "It's like France because no tax").
  *   **Student who grasped the bundle:** Will identify the specific mix: No Revenue (like England/Germany exit), No Recognition of bodies (unlike England), Yes Registration (Census box, like Germany), Yes Appointment (Ministry approval, like France/England), Yes Jurisdiction (Licensing, like Germany). They will conclude it is a unique bundle, proving the variables are independent.

  ### 6. What to Openly Decline

  "We are mapping administrative structures today, not histories or doctrines, so we will set aside the American legal precedents, the theological implications of the German ruling, and the diplomatic history of the Alsace concordat to focus strictly on how these states administer religious functions."
