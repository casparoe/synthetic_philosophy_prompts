prompt: |-
  I'm a journalist who covers science and ideas for a general-interest magazine, and last year I started reporting a feature on why people vote the way they do when they despise every viable option. The reporting kept surfacing two camps who had long since stopped listening to each other. The first camp — call them the harm-minimizers — holds that in a first-past-the-post election with two viable candidates, a ballot is damage-control equipment and nothing else: the probability that yours is decisive is tiny but nonzero, the stakes are enormous, and since the cost of voting is trivial, you vote for the less bad of the two, full stop. The second camp — call them the clean-hands camp — holds that a vote is an act of political self-authorship: casting it for a candidate you find odious, merely because other people's behavior makes that candidate's rival a live threat, makes you complicit in what follows, and no multiplication of a tiny probability by a large benefit figure launders that. Each camp thinks the other has misunderstood what a vote even is. The harm-minimizers say the clean-hands voters are mistaking a soapbox for a lever. The clean-hands camp says the harm-minimizers have a theory that can explain why to vote but cannot explain why anyone should care how.

  I eventually persuaded a representative of each camp, with a couple of their respective fellow travelers, to spend two days in a closed room on the adversarial-collaboration model I've watched work in psychology disputes, with me as rapporteur. My assignment for you is to draft the joint statement I was supposed to file afterwards. It must contain the following. First, a numbered section of claims both camps can sign — I expect this to include the old rational-choice point that turnout needs something like a duty term to be explicable at all, an agreed acknowledgment that virtually no individual vote alters an outcome, and, crucially, the concession they eventually reached that a voter in a jurisdiction whose result is utterly foregone may, even by the harm-minimizers' own lights, vote sincerely. Second, a table of the disagreements that remain, each row worded so that the camp it describes would accept the phrasing — the two of them spent ninety minutes fighting over the sentence that begins a vote is a tool, so keep the wording scrupulously neutral. Third, the cruxes: the sub-questions such that settling one would move at least one camp, each paired with a concrete case both sides agree bears on it and with each side's prediction written down in advance. Three cases they consented to treat as tests: a vote-swapping scheme in which a third-party voter in a swing jurisdiction pairs with a major-party voter in a safe one, each casting the other's preferred ballot, so that each cause nets one vote; a referendum on a civilizational-scale risk whose benefits accrue over centuries, where the decisiveness probability is minuscule and the stakes astronomical; and the secret-ballot problem — if no one ever learns how you voted, what exactly is being expressed, and can clean-hands reasoning survive the removal of an audience? Finally, both camps asked me to establish which parts of their dispute are merely verbal. They have come to suspect that the phrase supporting a candidate means preferring that candidate's victory to the harm-minimizers, but approving of the candidate to the clean-hands camp. The statement should say which disagreements dissolve once those words are pinned down and which are as hard as ever — and it should be a document either of them could put their name to without wincing.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Role:** Journalist covering science and ideas for a general-interest magazine.
      *   **Task:** Draft a joint statement following a two-day adversarial collaboration session between two camps of voters.
      *   **Camps:**
          *   *Harm-Minimizers (HM):* Vote is damage control/lever. Vote for the less bad option in FPTP (First-Past-The-Post).
          *   *Clean-Hands (CH):* Vote is political self-authorship/soapbox. Voting for an odious candidate makes you complicit.
      *   **Required Components:**
          1.  *Numbered Section of Agreed Claims:* Must include rational-choice duty term necessity, acknowledgment of individual vote insignificance, and concession on sincere voting in foregone jurisdictions (even by HM lights).
          2.  *Table of Remaining Disagreements:* Scrupulously neutral wording (avoiding "tool" vs. "expression" triggers). Each row must be acceptable to the camp it describes.
          3.  *The Cruxes:* Sub-questions where settling one moves a camp. Must include specific concrete cases (Vote Swapping, Civilizational Risk Referendum, Secret Ballot/Audience). Must include predictions from both sides.
          4.  *Verbal Disputes Analysis:* Address the semantic ambiguity of "supporting a candidate" (preferring victory vs. approving character). Distinguish which disagreements dissolve and which remain substantive.
      *   **Tone:** Neutral, precise, collaborative, suitable for a general-interest magazine, signable by both parties without wincing.

  2.  **Deconstruct the Components & Draft Content:**

      *   **Component 1: Agreed Claims**
          *   *Point 1 (Rational Choice/Duty):* Standard rational choice theory says $P \times B < C$. So, people vote because of a "D" term (duty/civic obligation). Both sides need to agree that turnout requires this non-instrumental explanation.
          *   *Point 2 (Decisiveness):* Acknowledge that $P$ (probability of being decisive) is effectively zero for almost all voters.
          *   *Point 3 (Safe States/Sincere Voting):* HM usually says vote less-bad. But if the result is foregone (safe state), the instrumental value is zero. So HM must agree CH can vote sincerely there without violating HM logic.
          *   *Drafting:* Keep it dry and mathematical where possible to reduce emotional friction.

      *   **Component 2: Table of Disagreements**
          *   *Challenge:* Avoid the word "tool" vs. "soapbox" or "lever" vs. "expression" if those triggered fights. Use functional descriptions.
          *   *HM View:* Focus on consequences, aggregate outcomes, risk mitigation.
          *   *CH View:* Focus on integrity, complicity, personal moral stance.
          *   *Wording:* Needs to be "He said/She said" but neutral. "Camp A holds..." "Camp B holds..."
          *   *Rows:*
              1.  Primary Function of the Ballot.
              2.  Nature of Complicity.
              3.  Weight of Consequences vs. Integrity.

      *   **Component 3: The Cruxes (Test Cases)**
          *   *Case 1: Vote Swapping.* (Swing/Third Party <-> Safe/Major Party).
              *   *HM Prediction:* Net benefit to preferred outcome. Morally permissible/encouraged.
              *   *CH Prediction:* Still casting a vote for an odious candidate. Complicity remains even if traded.
          *   *Case 2: Civilizational Risk Referendum.* (Tiny P, Astronomical B).
              *   *HM Prediction:* Expected value ($P \times B$) outweighs cost/integrity. Vote for risk mitigation.
              *   *CH Prediction:* If the means are morally corrupt, the end doesn't justify it. Or, if the option is "bad but less bad," complicity remains. *Correction:* The prompt says "referendum." Usually yes/no. Let's assume it's a choice between two risky paths or a specific policy. Let's frame it as: Does the magnitude of stakes override the integrity constraint?
              *   *Refinement:* HM says Yes (Pascal's Wager style). CH says No (Integrity is lexical priority).
          *   *Case 3: Secret Ballot/Audience.*
              *   *HM Prediction:* Irrelevant. Impact is causal, not expressive.
              *   *CH Prediction:* Crucial. If no one knows, self-authorship is undermined or changed. *Wait, CH logic:* If voting is self-authorship, does it need an audience? Usually, self-authorship is internal. But the prompt asks: "can clean-hands reasoning survive the removal of an audience?" CH might argue that without public accountability, it's just a private thought, not a political act. Or they might argue it *strengthens* the purity. Let's look at the prompt: "if no one ever learns how you voted, what exactly is being expressed."
              *   *HM Prediction:* Behavior remains the same (consequences don't care about secrecy).
              *   *CH Prediction:* Behavior might change (expression requires reception) OR Behavior remains same (integrity is internal). *Prompt hint:* "can clean-hands reasoning survive the removal of an audience?" implies CH might struggle here. Let's frame the prediction carefully. CH claims the act validates the self *to the self*, but acknowledges the political dimension requires public witness. Let's go with: HM says vote stays same; CH says vote might change because the "statement" loses force.
              *   *Actually, looking closer at the prompt:* "can clean-hands reasoning survive the removal of an audience?" This suggests a vulnerability for CH. If voting is expression, who is the audience? If secret, is it still expression?
              *   *Decision:* HM predicts no change in voting behavior. CH predicts potential change or acknowledges a tension in the theory regarding private vs. public acts.

      *   **Component 4: Verbal Disputes**
          *   *Phrase:* "Supporting a candidate."
          *   *HM Definition:* Preferring Victory A over Victory B.
          *   *CH Definition:* Endorsing Character/Platform A.
          *   *Resolution:* Acknowledge that when HM says "I support X," they mean "I prefer X's win." When CH hears "support," they hear "I endorse X."
          *   *Outcome:* Some arguments dissolve (e.g., "You're lying about who you support"). Some remain (e.g., "Is preferring a win enough to justify the endorsement cost?").

  3.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Too journalistic? Needs to sound like a formal report filed by a rapporteur.
      *   *Constraint Check:* Did I include the "duty term"? Yes. "Foregone jurisdiction"? Yes. "Table"? Yes. "Three cases"? Yes. "Verbal dispute"? Yes.
      *   *Neutrality:* Ensure the table doesn't make CH look irrational or HM look cynical. Use "Instrumental" vs. "Expressive/Integrity" language.
      *   *Formatting:* Use clear headings, numbered lists, and a markdown table.

  4.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Header:* JOINT STATEMENT OF ADVERSARIAL COLLABORATION.
      *   *Intro:* Brief context (two days, closed room).
      *   *Section I (Common Ground):* 1. Rational choice gap (D term). 2. Decisiveness (P ~ 0). 3. Safe states (HM concedes CH logic applies there).
      *   *Section II (Disagreements Table):* Columns: Topic, Harm-Minimizer Position, Clean-Hands Position.
      *   *Section III (Cruxes/Tests):* The three scenarios. Predictions.
      *   *Section IV (Verbal Disputes):* The "Support" semantic analysis.
      *   *Sign-off:* Rapporteur signature block.

  5.  **Polishing the Language:**
      *   *Avoid:* "Lever," "Soapbox," "Odious," "Complicit" (unless quoting definitions).
      *   *Use:* "Instrumental value," "Expressive value," "Causal contribution," "Moral association."
      *   *Specific fix on the "Safe State" concession:* The prompt says "even by the harm-minimizers' own lights." This means HM admits that if P=0, the instrumental argument vanishes, so the cost of voting "wrongly" is also zero. So HM agrees CH voters aren't *harming* anyone in a safe state.
      *   *Specific fix on "Support":* Make sure to distinguish *preferential ranking of outcomes* vs. *moral endorsement of agents*.

  6.  **Final Review against constraints:**
      *   Numbered section of claims? Yes.
      *   Includes duty term? Yes.
      *   Includes vote insignificance? Yes.
      *   Includes foregone jurisdiction concession? Yes.
      *   Table of disagreements? Yes.
      *   Neutral wording (no "tool")? Yes.
      *   Cruxes with 3 specific cases? Yes.
      *   Predictions included? Yes.
      *   Verbal dispute section? Yes.
      *   Signable by both? Yes, by keeping descriptions descriptive rather than evaluative.

  7.  **Final Polish:** (Self-Correction during drafting) *Make sure the table rows don't sound like caricatures.* Instead of "HM says votes are tools," say "HM prioritizes the causal impact on election outcomes." Instead of "CH says votes are soapboxes," say "CH prioritizes the moral association between voter and candidate."

      *Wait, one detail on the Secret Ballot:* The prompt asks "can clean-hands reasoning survive the removal of an audience?" I need to make sure the prediction reflects this tension. CH might predict that without an audience, the *political* nature of the act diminishes, potentially altering the weight of the decision. HM predicts no change.

      *Wait, one detail on Vote Swapping:* HM sees it as net gain. CH sees it as still casting the "bad" vote.

      *Wait, one detail on Civilizational Risk:* HM sees Expected Value dominating. CH sees Integrity as a constraint that isn't overridden by magnitude.

      *Okay, ready to write.*
answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Ethics and Mechanics of Voting in First-Past-The-Post Systems
  **Date:** October 24, 2023
  **Rapporteur:** [Journalist Name]
  **Participants:** Representatives of the Harm-Minimization Camp (HMC) and the Clean-Hands Camp (CHC)

  **PREAMBLE**
  Over a period of two days, representatives of the Harm-Minimization Camp and the Clean-Hands Camp engaged in structured dialogue to map the contours of their disagreement regarding voter behavior in elections with two viable candidates and various third-party options. The following document outlines areas of consensus, remaining substantive disagreements, proposed empirical and theoretical tests, and an analysis of verbal disputes. Both camps affirm that this document accurately reflects the conclusions of the session.

  ### I. AREAS OF CONSENSUS
  Both camps agree to the following numbered claims as foundational premises for further discussion:

  1.  **The Rational-Choice Gap:** Standard rational-choice theory, which calculates the value of voting as the probability of decisiveness multiplied by the benefit of the preferred outcome ($P \times B$), yields a value lower than the cost of voting ($C$) for virtually all individual voters. Therefore, both camps acknowledge that actual turnout levels cannot be explained without positing a non-instrumental "duty" or "civic obligation" term ($D$) in the voter's calculus.
  2.  **Individual Insignificance:** Both camps acknowledge that for any given voter in a large-scale election, the probability that their specific ballot will alter the election outcome is statistically negligible (effectively zero).
  3.  **The Foregone-Jurisdiction Concession:** The Harm-Minimization Camp concedes that in jurisdictions where the election result is utterly foregone (i.e., the margin of victory vastly exceeds the number of votes cast), the instrumental value of voting for the "less bad" viable candidate is zero. In these specific cases, the HMC agrees that a voter may vote sincerely for a non-viable candidate without violating the harm-minimization principle, as no additional harm is incurred by forgoing an instrumental lever that does not function.

  ### II. REMAINING DISAGREEMENTS
  The following table outlines the substantive disagreements that persist despite the consensus above. The phrasing in each column has been approved by the respective camp as an accurate characterization of their position.

  | Topic | Harm-Minimization Camp Position | Clean-Hands Camp Position |
  | :--- | :--- | :--- |
  | **Primary Function of the Ballot** | The ballot is a mechanism for influencing the distribution of political power and policy outcomes in the aggregate. | The ballot is a mechanism for establishing the moral relationship between the citizen and the state. |
  | **Source of Moral Value** | Value is derived from the consequences of the election result; the moral weight of a vote is tied to its contribution to the optimal outcome. | Value is derived from the integrity of the act itself; the moral weight of a vote is tied to the voter's endorsement of the candidate's platform. |
  | **Nature of Complicity** | Complicity is determined by causal contribution to the worse outcome; failing to prevent a foreseeable harm when able is the primary moral failure. | Complicity is determined by associative responsibility; enabling a candidate's victory count, regardless of intent, creates moral liability for their actions. |
  | **Priority of Constraints** | Consequentialist considerations override deontological constraints when the stakes of the election outcome are sufficiently high. | Deontological constraints regarding personal integrity override consequentialist considerations, regardless of the stakes of the election outcome. |

  ### III. CRUXES AND TEST CASES
  The groups identified three specific scenarios where their predictions diverge. Settling the theoretical interpretation of these cases would move at least one camp toward the other's position. Both camps have recorded their predictions in advance.

  | Test Case | Description | Harm-Minimization Prediction | Clean-Hands Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Vote Swapping** | A voter in a swing jurisdiction (preferring a third party) pairs with a voter in a safe jurisdiction (preferring a major party). They agree to cast ballots for each other's preferred candidates to net one vote for the third party and one for the major party. | **Permissible/Encouraged.** The aggregate outcome yields a net benefit to the preferred political cause without altering the risk profile in the swing jurisdiction. The instrumental gain validates the trade. | **Impermissible.** The voter in the safe jurisdiction is still physically casting a ballot for a candidate they find odious. The moral stain of the act remains regardless of the quid pro quo arrangement elsewhere. |
  | **2. Civilizational Risk Referendum** | A referendum where Option A poses a minuscule probability of catastrophic civilizational collapse, and Option B poses a certainty of significant but non-existential economic loss. $P$ of decisiveness is near zero; $B$ (avoiding collapse) is astronomical. | **Vote for Option B.** The Expected Value ($P \times B$) of avoiding extinction is so large that it overwhelms the integrity cost. The duty to prevent catastrophe is lexical. | **Vote Sincerely.** If Option B requires endorsing a platform or mechanism viewed as morally corrupt, the magnitude of the stakes does not launder the complicity. Integrity is not subject to utilitarian calculus. |
  | **3. The Secret-Ballot Problem** | A hypothetical scenario where the ballot is guaranteed to be secret forever (no audit, no leak, no statistical inference). The voter is the only entity who could ever know their choice. | **No Change in Behavior.** The causal mechanics of the vote remain identical. The moral obligation is to the outcome, which exists independently of whether the act is witnessed. | **Behavior May Change.** If voting is an act of political self-authorship, it requires a public dimension to function as a statement. Without an audience (even a potential one), the act loses its political character and becomes a private thought, weakening the "Clean Hands" constraint. |

  ### IV. ANALYSIS OF VERBAL DISPUTES
  A significant portion of the dialogue was dedicated to determining whether the disagreement is substantive or merely semantic. The groups focused on the phrase **"supporting a candidate."**

  **1. Semantic Divergence**
  *   **Harm-Minimization Camp:** Uses "support" to mean *preferring the victory of Candidate A over the victory of Candidate B.*
  *   **Clean-Hands Camp:** Uses "support" to mean *approving of the character, platform, or methods of Candidate A.*

  **2. Dissolved Disagreements**
  The following arguments were identified as verbal and are now considered resolved:
  *   *"You are lying when you say you support the lesser evil."* **Resolved:** The HMC admits they do not *approve* of the candidate (CH definition), only that they *prefer the victory* (HM definition).
  *   *"You are wasting your vote by not supporting a winner."* **Resolved:** The CHC admits they do not intend to *influence the victory* (HM definition), but rather to *register approval* (CH definition).

  **3. Remaining Substantive Disagreements**
  Even with these definitions pinned down, the following disagreements remain hard:
  *   **The Complicity Threshold:** Does *preferring a victory* (HM definition) inherently entail enough *approval* (CH definition) to trigger moral liability? The CHC argues that pulling the lever is an act of endorsement regardless of internal intent; the HMC argues that intent separates the voter from the candidate's sins.
  *   **The Hierarchy of Duties:** When the duty to prevent harm (HM) conflicts with the duty to maintain integrity (CH), which duty takes precedence? Clarifying the definition of "support" does not answer which moral framework is correct.

  **CONCLUSION**
  The collaboration confirms that while both camps utilize the same vocabulary, they are often describing different moral objects. However, a core incompatibility remains regarding whether the morality of voting is located in the *outcome of the election* or the *character of the voter*. Future reporting should focus on the three test cases above, as these offer the clearest path to distinguishing between a difference in values and a difference in error.

  ***

  **Signed,**

  __________________________
  Representative, Harm-Minimization Camp

  __________________________
  Representative, Clean-Hands Camp

  __________________________
  Rapporteur
