      *   *Hypothesis 1: Semantics ("Darwinism").* The user is right to suspect this. "Darwinism" can mean the *abstract principle* (natural selection exists) or the *specific models* (Hardy-Weinberg, specific phylogenetic claims). Popper attacked the former, praised the latter.
      *   *Hypothesis 2: Falsifiability Standards.* The user asks about predicting future species vs. explaining past ones. This is crucial. Popper valued *risky predictions*. Evolutionary biology often relies on *retrodiction* (explaining the fossil record) or *consilience* (matching genetics to morphology). If the friend thinks retrodiction counts as strong falsification and the user thinks only novel prediction counts, they will talk past each other.
      *   *Hypothesis 3: Hidden Intuitions (What science should do).* Is science about finding universal laws (Popper's physics envy) or constructing historical narratives (evolutionary biology)?

