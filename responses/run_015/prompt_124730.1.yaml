answer: |-
  This deadlock is a classic philosophical stall, but it isn't bedrock. It is resolvable, provided you and your friend stop arguing about "Popper's view" and start arguing about the **structural layers of the theory** you are both labeling "Darwinism."

  You are correct that the word "Darwinism" is doing too much work, but the split is deeper than just semantics. It is a three-layered category error involving the **level of abstraction**, the **direction of testing**, and the **definition of key terms**.

  Here is the diagnosis of the disagreement structure, followed by the specific distinctions needed to break it.

  ### 1. The Level of Abstraction (Framework vs. Model)
  This is the primary source of the stalemate. You and your friend are discussing two different logical objects.

  *   **Your Position (The Framework):** You are treating "Darwinism" as a **meta-theoretical framework**. In this view, Natural Selection is a universal principle: "Organisms better adapted to their environment tend to survive." If "adapted" is defined solely by "surviving," this is indeed a tautology. It is a logical truth, not an empirical one. Popper's initial critique was aimed at this level. He argued that as a universal worldview, it functions as a "metaphysical research programme"—a lens through which to view biology, not a testable law like gravity.
  *   **Your Friend's Position (The Model):** Your friend is treating "Darwinism" as a set of **specific causal models**. In this view, evolutionary biology makes claims like: "If pesticide X is applied, the frequency of allele Y in population Z will increase within N generations." This is not tautological. It is empirically risky. Popper's later concession was aimed at this level. He acknowledged that while the *principle* might be metaphysical, the *specific applications* generate falsifiable hypotheses.

  **The Stall:** You are arguing about the logical status of the *engine*; your friend is arguing about the performance of the *car*. You are both right about your respective objects, but you are using the same label for both.

  ### 2. The Direction of Inference (Prediction vs. Retrodiction)
  This is the disagreement over standards of falsifiability.

  *   **Popper's Ideal (Prediction):** Popper's gold standard for science was the **risky novel prediction**. A theory should say, "Event X will happen at time T," and if it doesn't, the theory dies.
  *   **Evolutionary Practice (Retrodiction):** Evolutionary biology largely relies on **retrodiction** and **consilience**. It explains past events (the fossil record, phylogenetic trees) and checks if multiple lines of evidence (genetics, morphology, geology) converge on the same narrative.
  *   **The Stall:** You are likely holding out for Popper's strict "prediction of future states" standard. If Darwinism can't predict the emergence of a specific new species next year, you view it as weak. Your friend is accepting "explanatory power over existing data" as sufficient falsification. If a genetic model fails to match the fossil record, they view that as a falsification. You view that as just a story about the past.

  **The Diagnosis:** This is a clash between **Physics Envy** (your side, seeking universal laws that predict future states) and **Historical Science** (your friend's side, reconstructing unique causal chains). Popper struggled with this himself. He wanted biology to be like physics; biology insists it is more like history.

  ### 3. The Definition of Fitness (Outcome vs. Propensity)
  This is the technical pivot point regarding the "tautology" charge.

  *   **The Tautological Definition:** If "fitness" is defined *ex post facto* as "those who survived," then "the fittest survive" means "those who survived, survived." This is unfalsifiable. This seems to be your interpretation.
  *   **The Propensity Definition:** Modern biology (and Popper's later understanding) defines fitness *ex ante* as a **propensity** or probability of survival based on measurable traits (e.g., camouflage efficiency, metabolic rate, reproductive output). If an organism has high-propensity traits but dies due to bad luck (a falling rock), the theory isn't falsified. But if organisms with high-propensity traits systematically fail to survive across a population, the theory *is* falsified.
  *   **The Stall:** If you are operating with the Outcome definition, the theory is logically empty. If your friend is operating with the Propensity definition, the theory is empirically rich. You cannot resolve the tautology argument without agreeing on how "fitness" is measured *before* survival is determined.

  ### How to Break the Deadlock

  To move past this, do not ask your friend to read more Popper. Instead, propose the following three distinctions in your next conversation. If you can agree on these, the disagreement dissolves.

  **1. Distinguish the "Hard Core" from the "Protective Belt"**
  Propose that you both accept Popper's later nuance: The *core principle* of Natural Selection is indeed nearly tautological (it's a logical truth that traits conferring survival advantages will become more common). However, science doesn't test the core logic; it tests the **auxiliary hypotheses**.
  *   *Agreement Target:* Agree that the *logic* of selection is trivial, but the *identification* of which traits confer advantage is the hard, falsifiable science.

  **2. Shift from "Prediction" to "Constraint"**
  Stop arguing about whether evolution predicts the *future*. Argue about whether it **constrains the possible**.
  *   *Agreement Target:* A good evolutionary model rules things out. For example, it predicts we will *not* find mammal fossils in Cambrian strata. If we do, the theory is falsified. This satisfies Popper's demand for risk without requiring the theory to predict specific future species.

  **3. Demand Independent Measurement of Fitness**
  This is the killer move on the tautology point.
  *   *Agreement Target:* Ask your friend: "Can we measure fitness *without* looking at survival rates?" If the answer is yes (e.g., measuring physiological efficiency, mating success, or genetic load *before* the selection event), then it is not a tautology. If the answer is no, then you are right, and it is metaphysical. Modern biology says "Yes," which validates your friend's view, but acknowledges your logical concern was valid for earlier, looser definitions.

  ### Is It Bedrock?
  No. It is not a fundamental philosophical impasse. It is a **classification error**.

  You are treating Evolutionary Theory as a **Law** (like Thermodynamics), which demands universal, exceptionless prediction.
  Your friend is treating it as a **Mechanism** (like Plate Tectonics), which demands causal explanation of observed patterns.

  Popper eventually realized that "Metaphysical Research Programme" wasn't an insult; it was a description of how mature sciences often start. They begin with a guiding idea (metaphysics) that generates specific, testable models (science).

  **The Resolution:**
  Tell your friend: "I concede that specific evolutionary models are falsifiable and scientific (your point). But you must concede that the abstract principle of 'Survival of the Fittest' is only scientific if 'Fitness' is defined independently of 'Survival' (my point). If we agree on that distinction, Popper didn't change his mind; he just clarified which layer of the theory he was talking about."

  That splits the difference without requiring either of you to surrender your core intuition.
