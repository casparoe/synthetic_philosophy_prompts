      *   **Layer 2: The Empirical Content of Specific Models.** (Friend's focus). Can we test specific claims about moths, finches, or alleles?
      *   **Layer 3: The Temporal Direction of Testing.** (Prediction vs. Explanation).
      *   **Conclusion:** It's a category error. They are arguing about different *objects* under the same label.

