      *   *Phase 2 (The Recantation/Nuance):* Later (early 1980s), Popper clarified. He admitted that while the *core principle* might look metaphysical, the *application* of evolutionary theory involves testable hypotheses (e.g., specific adaptations, genetic frequencies). He didn't fully reject his earlier view but refined it: the *framework* is metaphysical, but the *specific theories* within it are scientific.
      *   *The Tautology Charge:* This is often misunderstood. If fitness is defined independently of survival (e.g., physiological traits), it's not a tautology. If it's defined *by* survival, it is. Modern biology defines it independently (propensity interpretation).

