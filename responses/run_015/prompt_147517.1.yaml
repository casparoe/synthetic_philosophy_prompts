prompt: |-
  I'm a backend engineer who reasons about distibuted systems. Restate Sartre's idea of radical freedom and bad faith — specifically the self-deception where we act like we're either pure transparent consciousness with no fixed nature, or like we're a solid object with a predetermined essense — using only the vocabulary of distributed transactions: ACID, isolation levels, two-phase commit, split-brain, state replcation, and rollback. Be as faithful as you can, then report the residue: which parts map cleanly onto transaction failure modes, which you had to distort to make fit, and what (if anything) in Sartre's view has no counterpart in database consistency logic at all. Is the leftover genuinely about human freedom, or is it just philosophical jargon describing a system failure my vocabulary already covers? Don't ask me for citations; just work from the concept.
