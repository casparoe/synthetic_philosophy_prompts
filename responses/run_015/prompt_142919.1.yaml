  3. **Background-extension Brier (BXB):** It is proper on a fixed vocabulary, uninformed refinement changes the expected score depending on $\mu$, and the score can be improved by aligning vocabulary boundaries with the background measure.
  4. **Common-coarsening Brier (CCB):** It is proper on the meet partition, uninformed refinement leaves the score unchanged if the meet is stable, and the score can be improved by coordinating vocabularies to manipulate the meet.
