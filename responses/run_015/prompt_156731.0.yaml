answer: |-
  Here is a concrete example of how the structural mismatch between **punctuated** and **diffuse** harm breaks the ranking machinery, specifically through the choice of counterfactual baseline.

  ### The Cases

  1.  **Punctuated Atrocity:** The Holodomor (Soviet Ukraine, 1932–1933).
      *   **Structure:** A sharp spike in mortality driven by specific policy decisions.
      *   **Window:** 24 months.
      *   **Consensus Harm:** ~4 million excess deaths.
      *   **Baseline Stability:** High. We compare 1932–33 mortality against 1930–31 and 1934–35. The "normal" background rate is clearly visible on either side of the spike.

  2.  **Diffuse Process:** Indigenous Demographic Collapse in the Americas (1492–1900).
      *   **Structure:** A sustained elevation of mortality and suppression of birth rates due to disease, displacement, and extraction, without a single "start" order or "end" treaty that halts the mechanism.
      *   **Window:** 400+ years (arbitrary boundary).
      *   **Consensus Harm:** Highly contested (ranges from 10 million to 100 million+).
      *   **Baseline Stability:** Non-existent. There is no "peace time" to compare against, only theoretical trajectories.

  ### The Metric: Integrated Excess Mortality ($H$)

  To rank these, we calculate $H = \int_{t_{start}}^{t_{end}} (M_{actual} - M_{baseline}) \, dt$.

  For the **Holodomor**, $t_{start}$ and $t_{end}$ are natural (the famine begins and ends). $M_{baseline}$ is robust (average harvest years). The integral yields a stable number: **4 million**.

  For the **Americas**, $t_{start}$ and $t_{end}$ are fuzzy, but the real breakdown happens in $M_{baseline}$. Because the harm is diffuse, the baseline determines whether we are measuring a *stock loss* (people who died) or a *flow loss* (generations that never existed).

  ### Scenario A: Baseline = "Pre-Contact Conditions" (Static Stock)
  **Assumption:** We treat the pre-contact population as a fixed asset. Harm is measured as the reduction of that specific asset pool.
  *   **Logic:** Compare the population in 1900 to the population in 1492. We assume that without contact, the population would have remained roughly stable at pre-contact levels (a Malthusian floor assumption).
  *   **Calculation:**
      *   1492 Population: ~60 million.
      *   1900 Population: ~5 million.
      *   $H_{diffuse} = 60M - 5M = \mathbf{55 \text{ million}}$.
  *   **Ranking:** Diffuse (55M) > Punctuated (4M).
  *   *Wait, this doesn't invert yet.* To get the inversion, we must look at **Intensity-Weighted Harm** or a stricter definition of "Direct Causality" often paired with static baselines.

  Let's refine Scenario A to match how historians often minimize diffuse harm: **The "Background Mortality" Baseline.**
  *   **Assumption:** High mortality was the global norm in 1500. We only count deaths *above* the expected regional mortality rate of the era.
  *   **Logic:** If the global average life expectancy was 30, and the Americas dropped to 25, the "excess" is small per year, even if sustained.
  *   **Calculation:**
      *   Annual Excess Deaths: ~50,000 (averaged over 400 years).
      *   Peak Intensity: Never exceeds 200,000/year.
      *   **Ranking Metric:** *Severity of Intent/Intensity.*
      *   **Result:** The Holodomor (2M deaths/year, clear intent) ranks as a **higher category of evil** than the diffuse process (background noise of empire).
      *   **Rank:** **Punctuated > Diffuse.**

  ### Scenario B: Baseline = "Independent Development Trajectory" (Dynamic Flow)
  **Assumption:** We treat the population as a growing system. Harm is measured as the deviation from the growth trajectory of a comparable, non-colonized region (e.g., Japan or Ethiopia).
  *   **Logic:** Populations grow. If the Americas had not been colonized, the 60 million in 1492 would have compounded. The harm isn't just the dead; it's the *unborn*.
  *   **Calculation:**
      *   Growth Rate (conservative 0.5%/year): 60M in 1492 becomes ~400M by 1900.
      *   Actual 1900: ~5 million.
      *   $H_{diffuse} = 400M - 5M = \mathbf{395 \text{ million}}$.
      *   This includes "lost generations." The integral $\int$ now captures the widening gap between the *actual* line and the *counterfactual* line over 400 years.
  *   **Ranking:** Diffuse (395M) >> Punctuated (4M).
      *   **Rank:** **Diffuse > Punctuated.**

  ### The Machinery Break

  The inversion occurs because the **Punctuated Case** is robust to baseline shifts, while the **Diffuse Case** is defined by them.

  1.  **The Window Problem:** The Holodomor has a natural integration window (1932–1933). Even if you change the baseline slightly, the area under the curve remains roughly the same because the spike is vertical. The Americas case has no natural window. If you choose the "Static Stock" baseline, you implicitly close the window early (counting only the initial shock). If you choose the "Independent Trajectory" baseline, you implicitly keep the window open for centuries, allowing the integral to compound.
  2.  **The Baseline as a Time-Machine:** In the punctuated case, the baseline is empirical (data from adjacent years). In the diffuse case, the baseline is theoretical (data from a world that never existed).
      *   When you use **Pre-Contact Conditions**, you are asking: *"How many people were killed?"* (A forensic question).
      *   When you use **Independent Trajectory**, you are asking: *"How much future was stolen?"* (A civilizational question).

  **The Inversion:**
  *   If your moral framework prioritizes **Forensic Causality** (Baseline A), the Holodomor ranks higher because the link between decision and death is tight, and the diffuse case dissolves into "historical inevitability."
  *   If your moral framework prioritizes **Counterfactual Potential** (Baseline B), the Colonial Collapse ranks higher because the compounding loss of potential human life over 400 years dwarfs the concentrated loss of the Holodomor.

  The structural mismatch is that the metric ($H = \int \text{Harm}$) assumes a closed system where harm is an event. But the diffuse case is an open system where harm is a **state**. By forcing a state into an event-based metric, the ranking flips entirely based on how you draw the theoretical floor.
