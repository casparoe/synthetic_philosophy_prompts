answer: |-
  This is an exceptionally sharp piece of reasoning. You have effectively reconstructed the central tension in the last twenty years of experimental philosophy of action: the conflict between the *Knobe Effect* data and the *Traditional* conception of intentional action. Your TA is right that the argument "proves too much," but pinpointing the exit requires disentangling semantic content from judgmental process.

  Per your request, I will brainstorm three candidate diagnoses, price their costs, and then commit to the one I believe offers the most philosophical stability while respecting your constraint to keep (1) and (5).

  ### Candidate Diagnosis 1: Reject Premise (2) (The "Influence vs. Content" Diagnosis)
  **The Move:** You deny that judgmental sensitivity to moral factors entails that moral factors are part of the *application conditions* (semantics) of the predicate.
  **Why it looked plausible:** It relies on a natural inference: if $X$ changes when $Y$ changes, $Y$ must be part of the definition of $X$. This is the "truth-conditional" assumption common in early X-Phi.
  **The Cost:** You must explain *why* the judgments flip if not because of the concept's meaning. You are forced to adopt a "performance error" model (bias, pragmatic implicature, or emotional interference) or a "hybrid" model where the concept is stable but its application is weighted by norms. You also have to accept that folk intuitions are unreliable guides to semantic content.
  **Handling Case C:** This handles Case C beautifully. If the driver is *norm violation* rather than *moral badness*, (2) is empirically false as stated. The concept isn't "moralized"; it's "norm-sensitive." Norm sensitivity can be a heuristic for spotting intentionality without being part of the definition.

  ### Candidate Diagnosis 2: Reject Premise (4) (The "Thick Concept" Diagnosis)
  **The Move:** You deny that a "moralized" predicate cannot be upstream-independent. You argue that concepts can be "thick" (containing both descriptive and evaluative content) and still serve as evidence for verdicts.
  **Why it looked plausible:** Premise (4) assumes a rigid fact/value distinction. If "cruel" is a thick concept, we can identify an act as cruel (upstream) and use that to blame someone (downstream), even though "cruel" contains moral content.
  **The Cost:** This blurs the line between description and evaluation. It requires you to argue that *intentionally* is a thick ethical concept. This is a heavy metaphysical load. It also risks circularity: if *intentionally* contains "badness," and blame requires *intentionally* + *badness*, does blame become redundant? You need a nuanced theory of how moral content functions within a descriptive predicate.
  **Handling Case C:** Harder. Is violating a coffee machine rule a "moral" thick concept? You'd have to broaden "moralized" to "normativized." But if the norm is silly, is the concept still thick? It strains the analogy with "cruel" or "brave."

  ### Candidate Diagnosis 3: Restrict the Scope (The "Side-Effect Specificity" Diagnosis)
  **The Move:** You argue that the Knobe Effect applies only to *side effects*, whereas Premise (5) relies on examples of *means* or *goal-directed action*. You claim *intentionally* is context-sensitive or ambiguous.
  **Why it looked plausible:** You noted this yourself. The cases in (1) are about foreseen side effects; the cases in (5) ("pushed the door") are about means to an end. Many philosophers (e.g., Sripada) argue the cognitive mechanisms for these are distinct.
  **The Cost:** You fragment the concept of intentional action. You lose the unity of the folk concept. It implies X-Phi tells us something about *side-effect* attributions but nothing about *intentional action* in the core sense. This concedes a major victory to the Traditionalists and limits the scope of your seminar's findings.
  **Handling Case C:** Case C is also a side effect, so the asymmetry remains. But it doesn't solve the "proves too much" worry for other predicates like *knows* or *caused*, which don't have a means/side-effect split in the same way.

  ---

  ### My Commitment: Reject Premise (2)

  I recommend you **reject Premise (2)**. This is the cleanest exit that preserves your empirical data (1) and your linguistic/legal intuition (5). It directly addresses the TA's "proves too much" objection by blocking the inference from *judgmental influence* to *semantic content*.

  Here is the detailed pricing and analysis you requested.

  #### 1. Why Reject (2) and What Was the Trap?
  Premise (2) states: *"When attributions of a predicate flip across cases that differ only in a moral respect, moral considerations are part of that predicate's application conditions."*

  **The Trap:** This premise conflates **epistemology** (how we decide to apply a word) with **semantics** (what the word means). Just because moral considerations *influence* the decision to apply the word "intentionally" does not mean they are *constitutive* of the word's meaning.
  *   **Analogy:** Imagine a scale that is slightly magnetized. It gives different readings for iron vs. plastic objects of the same weight. The reading "flips" based on material. Does that mean "weight" is defined by "magnetism"? No. It means the *measurement process* is sensitive to magnetic fields.
  *   **Application:** The Knobe Effect shows that our *capacity to judge* intentionality is sensitive to norms. It does not prove that the *concept* of intentionality includes norms.

  **The Cost:** By rejecting (2), you must accept that ordinary speakers are not infallible guides to the deep structure of their own concepts. You are positing a gap between *competence* (knowing the concept) and *performance* (applying it in context). This opens you to the charge that you are "explaining away" the data rather than embracing it. You need a theory of *why* the bias exists (e.g., norms help us spotlight relevant causal agents).

  #### 2. Pricing the Alternatives
  **If you reject (4) instead (The Thick Concept View):**
  *   **What you accept:** You accept that *intentionally* is a moralized concept.
  *   **The Price:** You must explain how a moralized concept functions upstream. If "intentionally" means something like "caused + bad + aware," then saying "He did it intentionally but it wasn't bad" becomes a contradiction (like "It's a bachelor but he's married"). Yet, as you note in (5), "He did it intentionally but was justified" sounds fine. To save this, you have to argue that the moral content is *defeasible* or *prototypical* rather than necessary. This makes the semantics very messy.
  *   **Case C Problem:** If you reject (4), you claim the concept is moralized. But Case C involves a *conventional* norm (coffee machine), not a moral one. If the concept is truly *moralized*, Case C shouldn't trigger the effect. If it does trigger the effect, the concept is *normativized*. But then, is "violating a silly rule" part of the content of *intentionally*? That seems implausible. Rejecting (2) handles this better: norms *influence* the judgment, even silly ones, without becoming part of the definition.

  **If you restrict the Scope (The Contextualist View):**
  *   **What you accept:** You accept that "intentionally" means one thing for means and another for side effects.
  *   **The Price:** You lose the generality of your conclusion. Your argument was that "nothing can be learned about intentional action." If the effect is limited to side effects, then we *can* learn about intentional action (in the means-ends sense) from folk usage; it's only the peripheral cases that are noisy. This weakens your seminar's takeaway.

  #### 3. The Scope Shift: Side Effects vs. Aiming
  You asked: *"Is that the real problem — a scope shift from side effects to intentional action in general?"*

  It is a **red herring** for the specific contradiction you generated, but a **real problem** for the generalization.
  *   **Why it's a red herring here:** Your contradiction arises between (3) [Intentionally is moralized] and (5) [Intentionally is upstream-independent]. This contradiction holds even if we restrict (5) to side effects. We can say, "The side effect was produced intentionally, but the chairman is not to blame for it" (perhaps he was coerced). The tension between *moralized content* and *upstream function* exists regardless of whether it's a means or a side effect.
  *   **Why it matters generally:** If you keep (1) and (5) and reject (2), you are claiming the Knobe Effect is a performance error or pragmatic influence. If that influence is specific to side effects (where the agent's attitude is the only variable), that supports the "Influence" model. If it happened for means (e.g., "He shot the victim intentionally" flips based on whether the victim was bad"), that would be harder to explain as mere influence. Since the effect is strongest in side effects, restricting the scope helps you reject (2) more plausibly.

  #### 4. Can "Moralized" and "Upstream-Independent" Coexist?
  You asked: *"Is there any reading of moralized on which (3) and (5) are both true?"*

  Yes, but it requires a precise distinction between **Content** and **Evidence**, which your notes gesture at.

  *   **The Reading:** A predicate is moralized if moral considerations are part of the **evidence** speakers use to settle its application, but not part of the **truth conditions**.
  *   **How it works:**
      *   **Truth Conditions (Upstream):** To be true, "He did it intentionally" requires only Awareness + Causal Control + (maybe) Desire. This is independent of blame.
      *   **Evidence (Moralized):** In ambiguous cases (like side effects where Desire is weak or absent), speakers use moral badness as a *heuristic* to infer the presence of the mental state. "It was bad, so he must have cared enough to do it intentionally."
  *   **Why this saves (5):** Because the moral verdict is not *constitutive* of the intentional action. It is merely a cue used by the cognitive system to *detect* intentional action. Therefore, a jury can theoretically strip away the moral cue and ask, "Ignoring whether it was bad, did he have the mental state?"
  *   **The Catch:** This effectively means rejecting (2) as written. (2) says moral considerations are part of the *application conditions* (which usually implies truth conditions). If you reinterpret "application conditions" to mean "conditions under which speakers *feel licensed* to apply the term" (assertibility conditions) rather than "conditions under which the term is *true*," you can keep (3) in a weakened sense.
  *   **My Advice:** Don't take this deal. It's terminologically slippery. It is cleaner to say the concept is **not moralized** (reject 3), but the **judgment is morally influenced**. This keeps the upstream independence robust.

  ### Summary of the Exit
  Your TA said you "prove too much" because Premise (2) is a universal claim about how to interpret valence effects. If you accept (2), then *every* concept that shows a valence effect (knows, caused, free) becomes moralized, collapsing the descriptive into the normative globally.

  By rejecting (2), you block this over-generation. You can say:
  1.  **Keep (1):** The data is real; people's judgments flip.
  2.  **Keep (5):** The concept *intentionally* is still upstream-independent (it *can* be separated from blame in principle, even if people struggle to do so in practice).
  3.  **Reject (2):** The flip in judgment is due to **normative sensitivity in the cognitive process**, not **moral content in the semantic definition**.

  **Regarding Case C:** This confirms the rejection of (2). Since Case C involves a *conventional* norm (coffee machine) and not a *moral* one, yet produces the same effect, the driver cannot be "moral content." It must be "norm violation" generally. Since norm violation is not the same as blameworthiness (one can violate a silly rule without being blameworthy), the link between the effect and *blame* is broken. This confirms that the effect is about **normative expectations**, not moral verdicts.

  **Final Philosophical Bill:**
  *   **You pay:** The simplicity of the "Folk are right about their concepts" view. You must accept that folk intuitions are subject to systematic bias based on normative expectations.
  *   **You gain:** A distinction between the *concept* of intentional action (which remains useful for law and morality) and the *psychology of attributing* intentional action (which is messy and norm-laden). This allows you to say X-Phi teaches us about human *psychology*, not necessarily about the *metaphysics of action*.
