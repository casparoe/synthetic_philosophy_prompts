prompt: |-
  me and my friend were arguing for like three hours last night about Dennett's multiple drafts model and whether it actually kills the Cartesian theater or just relocates it. i'm moderating a podcast Q&A next week with a philospher who defends the model but adds this twist: she thinks the editorial process isn't just selecting between drafts but involves retroactive narrative smoothing that fakes a unified observer after the fact. i need like 8 or 9 interveiw questions that don't let her retreat to the usual no-audience-in-the-brain line. specifically i want one pressing whether that smoothing is just the theater with extra steps, one on first-person authority if drafts get revised post-hoc, and one about split-brain cases where the smoothing apparently breaks down. for each, include a follow-up keyed to her likely answer. no generic what-drew-you-to-philosophy stuff, and don't conflate her with panpsychism unless it's actually relevant. can you draft them? definatly need them by tomorow, my notes are a mess.
