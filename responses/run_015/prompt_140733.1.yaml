  ### Part 1: Sequence and Dependency

  **The Order of Arrival**
  1.  **Outer Message:** This must arrive first. It is the packaging that signals *that* there is a message to be received. Without establishing that the object is a communication and not just noise or debris, the other two levels cannot exist.
  2.  **Frame Message:** This must arrive second. Once the students accept the object is a message, they need the instructions on *how* to decode it. You cannot understand the Frame until you know there is something to decode (Outer), but you cannot access the Inner without the Frame.
  3.  **Inner Message:** This arrives last. It is the payload, the content that is revealed only after the Outer has identified the object as a message and the Frame has provided the decoding key.

  **The Board State**
  Before you use any of the three terms, draw three concentric circles on the board. Label them only "1 (Outside)," "2 (Middle)," and "3 (Inside)." Do not write "Outer," "Frame," or "Inner" yet. This visual dependency prevents them from treating the terms as a flat list.

  **The Answer to "Where is Meaning?"**
  State the answer **last**, as the conclusion of the section.
  *   **Why:** If you state it first ("Meaning is in the interaction"), it becomes a dogma they memorize rather than a structural insight they derive. If you state it in the middle, it interrupts the mechanical breakdown of the levels. It must be the synthesis that emerges once they see how the Inner Message changes when the Outer Message changes, despite the physical object remaining identical.

  ### Part 2: The Carrying Example

  **The Example:** A **Toy Traffic Light** (a small, battery-operated plastic model with a red light that illuminates).

  **The Three Levels:**
  *   **Outer Message:** The context in which the object is placed (e.g., taped to a model road intersection vs. sitting on a desk next to a lamp). This signals *that* it is communicating (a command vs. a decoration).
  *   **Frame Message:** The convention used to decode the signal (e.g., Traffic Law "Red means Stop" vs. Interior Design "Red means Warmth"). This is discoverable because students recognize the object as a traffic light immediately (under 3 minutes).
  *   **Inner Message:** The specific content conveyed (e.g., "Halt your vehicle" vs. "Set a cozy mood").

  **Why the constraints are met:**
  *   **Physical:** You can hold it, pass it, and move it.
  *   **Discoverable:** Students recognize the "traffic light" schema instantly; they don't need you to explain the Frame, they bring it with them.
  *   **Inner Changes with Outer:** You leave the light untouched on the desk. You move a model car in front of it (changing the Outer context to "Road"). The Inner Message becomes "Stop." You remove the car and plug the light into a USB port for ambiance (changing the Outer context to "Decor"). The Inner Message becomes "Atmosphere." The physical object (the light) never changes.

  **The Rejections:**
  *   **Phonograph Record:** It implies the meaning is physically grooved into the object (the Inner), making it hard to show how the Outer context changes the Inner content without changing the playback speed (which alters the object's state).
  *   **Alien Artifact:** It is unverifiable; students cannot discover the Frame themselves in three minutes because they lack the cultural key to decode it, forcing you to announce the Frame rather than letting them find it.
  *   **DNA:** It suggests biological essentialism, leading students to believe the Frame (cellular machinery) is intrinsic to the DNA itself rather than a separate interpretive layer.

  ### Part 3: Misconceptions

  **Order of Formation and Intervention:**
  1.  **"Frame = File Header" (Immediate):** Due to their programming week, they will assume the Frame is always a explicit, machine-readable header (e.g., `0x89PNG`).
      *   *Head Off:* During the **Frame Message** introduction. Clarify that a Frame can be cultural or contextual (like knowing what a traffic light is), not just bits at the start of a file.
  2.  **"Inner = Real Meaning" (Early):** They will intuitively feel the Inner Message is the only "real" part, and the Outer/Frame are just metadata about us.
      *   *Head Off:* During the **Example demonstration**. When you change the Outer context and the Inner meaning shifts, point out that the "real" content changed without the object changing.
  3.  **"Levels are Fixed Properties" (Mid-Section):** They will assume that if something acts as a Frame, it is permanently a Frame.
      *   *Head Off:* During the **Example demonstration**. Show that the Traffic Light itself is the Object in one view, but part of the Outer context in another (e.g., if looking at a photo of a room).
  4.  **"The Sender Fallacy" (Missing):** They will assume a Frame Message must be intentionally placed by a sender.
      *   *Head Off:* During the **Frame Message** introduction. Note that we often impose Frames on things (like seeing faces in clouds) where no sender existed.
  5.  **"Radical Relativism" (End):** Your strongest student will conclude that if meaning isn't in the object, *any* reading is valid.
      *   *Head Off:* **This is the dangerous one.** It must be addressed in the **Closing Question**. If meaning is relational, it is constrained by the Frame and Outer context, not arbitrary.

  **The Dangerous Misconception:** **Radical Relativism.** If this stands, the distinction between a correct decoding and a hallucination collapses, disabling all downstream analysis of information systems.

  ### Part 4: The Closing Question

  **The Question:** "If I hand you a hard drive with no label, no file system documentation, and no computer to run it on, does it contain information?"

  **Wrong Answers and Diagnostics:**
  *   **"Yes, the bits are physically there."**
      *   *Diagnosis:* This student holds the **"Inner = Real"** misconception. They believe meaning is intrinsic to the storage medium (Object) regardless of the Frame or Outer context.
  *   **"No, it's just a piece of plastic."**
      *   *Diagnosis:* This student has swung to **Radical Relativism** or nihilism. They believe that without an active reader, the potential for meaning does not exist at all.
  *   **"It contains potential information, but no actual message."**
      *   *Diagnosis:* **Success.** This student understands that Information requires the *interaction* of the Object (Inner potential) with a Frame and Outer context to become a Message.

  ### Part 5: What to Decline

  **The Refusal:** "We are discussing *semantics* (how meaning is constructed), not *statistics* (how much data is transmitted)."

  **What to Decline:**
  1.  **Gödel's Incompleteness Theorems:** Too mathematical; distracts from the semiotic point.
  2.  **Strange Loops:** Too abstract; requires understanding self-reference which isn't needed for the three-level distinction.
  3.  **Shannon Information Theory:** **This is actively misleading.**
      *   *Why:* Shannon explicitly defines information as the *reduction of uncertainty*, deliberately stripping away meaning (semantics) to measure capacity. Teaching Shannon alongside Hofstadter's "Meaning" in a 45-minute section creates a direct contradiction: Shannon says meaning is irrelevant to information; Hofstadter says meaning is the whole point. Introducing Shannon now will cause them to conflate "bits" with "messages," reinforcing the "Frame = File Header" misconception.
