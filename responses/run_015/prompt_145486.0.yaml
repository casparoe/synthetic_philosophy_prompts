answer: |-
  This is a sophisticated set of intuitions. You have effectively recreated the central tension in climate ethics and intertemporal economics without reading the literature. Your gut is tracking the difference between *descriptive psychology* (how humans actually feel) and *normative ethics* (how we argue we should act).

  Here is the breakdown of the principles, the settled science, the contested philosophy, and the hard choice you have to make for Case 5.

  ### The Unifying Principle: "Weighted Duty with Side-Constraints"

  The single framework that best accommodates your verdicts on Cases 1–4 is **Agent-Relative Prioritarianism with Deontological Constraints.**

  In plain English: *We have a duty to make the future better (Prioritarianism), but we are allowed to weight the needs of those closer to us in time and space more heavily (Agent-Relative), provided we do not directly violate fundamental rights to do so (Deontological Constraints).*

  Here is how it handles your cases:

  *   **Cases 1 & 2 (Time Discounting):** This principle accepts **Hyperbolic Discounting**. Unlike standard economics, which argues for a constant exponential discount rate (a "pure rate of time preference"), this principle acknowledges that human moral urgency decays non-linearly. It validates your feeling that 15 years away feels like 80% urgency, but 60 years feels like near-zero.
  *   **Cases 3 & 4 (Spatial/Concrete Discounting):** This validates the **Identifiable Victim Effect**. It accepts that a specific person on your street triggers a stronger moral imperative than a statistical life in the future, without requiring you to be a sociopath about the future. It treats the "contradiction" in Case 4 not as a logical error, but as a feature of human moral architecture.
  *   **Case 5 (The Button vs. The Program):** This is where the "Side-Constraints" kick in. This principle **splits the pair**. It says the Button is monstrous (violating a right not to be killed) while the Program is obligatory (allocating resources to save lives). It refuses to treat them as mathematically identical.

  ### Settled vs. Contested

  To write this authentically, you need to know where the experts agree and where they are still fighting.

  **1. Settled (Psychology & Behavioral Econ):**
  *   **Humans discount hyperbolically.** Everyone agrees with your Case 1 and 2 intuitions as *descriptions* of human behavior. We value the present disproportionately.
  *   **The Identifiable Victim Effect is real.** We care more about "the child in the well" than "statistical lives." Your Case 3 is psychologically standard.
  *   **Acts vs. Omissions:** Psychologically, humans distinguish sharply between *doing* harm (pushing the button) and *allowing* harm (not funding the program).

  **2. Contested (Philosophy & Welfare Economics):**
  *   **The Discount Rate (Case 1 & 2):** Economists argue fiercely over whether we *should* discount the future.
      *   *The Ramsey Rule:* Standard economics says we should discount only based on the probability that the future people won't exist or will be richer.
      *   *The Parfit Argument:* Philosopher Derek Parfit argued that discounting future welfare simply because they are in the future is ethically indefensible. If you agree with Parfit, your Case 2 intuition is morally wrong, even if psychologically normal.
  *   **The Doing/Allowing Distinction (Case 5):**
      *   *Deontologists (Rights-based):* Agree with you. Killing is worse than letting die.
      *   *Consequentialists (Utilitarians):* Disagree with you. They argue that if the outcome is identical (1 dies, 10k live), the method is irrelevant. To a strict Utilitarian, refusing to press the Button is as immoral as refusing to fund the Program.
  *   **Non-Identity Problem:** For climate specifically, there is a contested philosophical issue: Our actions today change *who* gets born in 2100. If we save the climate, different people will exist than if we don't. Can we say we are "harming" them if they wouldn't exist otherwise? This complicates Case 4.

  ### The Hard Tradeoff: What Must Be Thrown Out?

  You asked which verdict my best principle has to throw out to stay clean.

  If you adopt **Weighted Duty with Side-Constraints** (which fits your novelistic need for nuanced characters), you must throw out **Logical Consistency across all domains.**

  You cannot have a single mathematical formula that satisfies Cases 1–5.
  *   To satisfy Cases 1–4, you need **Discounting**.
  *   To satisfy Case 5 (Button), you need **Rights/Absolutes**.
  *   To satisfy Case 5 (Program), you need **Consequentialism**.

  **The Honest Verdict for Case 5:**
  To keep your intuition that the **Button is monstrous**, you must reject **Pure Consequentialism**.
  To keep your intuition that the **Program is obligatory**, you must accept **Consequentialism**.

  You cannot logically hold both without a "rule of thumb" exception. Most people (and most legal systems) resolve this by saying: *We maximize good (Program), but never by directly violating bodily autonomy (Button).*

  **However, for a climate novel, here is the critical insight:**
  Climate policy is almost *always* Case 5 Program, never Case 5 Button. We are never deciding to kill one specific person to save the future; we are deciding how to allocate resources (taxes, regulations) that have statistical costs and benefits.
  *   **If your character is an Economist:** They will treat the Button and Program as identical. They will say your refusal to press the button is an irrational "deontological constraint" that risks the 10,000 lives.
  *   **If your character is an Ethicist/Activist:** They will agree with your split. They will argue that treating human lives as fungible resources (the Program view) is the slippery slope that leads to the Button.

  **To stay clean, you must discard the idea that there is a single "exchange rate" for human life across time.** If you try to make your characters calculate a single number for all five cases, they will sound sociopathic or naive.

  ### The Tree: Moral Weight or Sentiment?

  **Verdict:** Under the principle of *Weighted Duty*, planting a tree you will never sit under has **real moral weight**, but it is symbolic weight, not just carbon weight.

  *   **The Economic View:** It only matters if the carbon sequestration value exceeds the cost. If it doesn't, it's sentiment.
  *   **The Ethical View:** It is a **Commitment Device**. It signals that you are lowering your personal discount rate. It proves to yourself and your community that you are capable of acting for a future you won't see.
  *   **For the Novel:** Treat the tree as a ritual. It bridges the gap between Case 1 (immediate cost) and Case 4 (distant benefit). It makes the abstract concrete.

  ### Summary for Dialogue

  If you want your characters to sound smart and conflicted (rather than like textbooks):

  1.  **Don't let them solve Case 5.** Let one character argue that the Button and Program are the same (Utilitarian), and let the other argue that the distinction is the only thing keeping us human (Deontologist). Both are philosophically defensible.
  2.  **Validate the Discounting.** Don't have characters pretend they care about 2100 as much as next Friday. Have them admit that caring less about the future feels wrong but is unavoidable, and that the moral struggle is *fighting* that instinct.
  3.  **The "Contradiction" is the Point.** Your Case 4 (Local Flood vs. 2100 Carbon) isn't a bug in your character's logic; it's the central drama. The character who claims not to feel that contradiction is likely a zealot or a liar.

  **Final Recommendation:**
  Keep your verdicts on 1–4. They are humanly truthful.
  On Case 5, **keep the split.** Acknowledge that logic demands they be the same, but humanity demands they be different. That tension is where the story lives. If you force them to be the same, you lose the moral horror that drives engagement. If you force them to be different without acknowledging the logical inconsistency, your characters sound uneducated.

  The most compelling character is the one who says: *"I know the math says they're the same. I know I'm being inconsistent. But if I press that button, I'm a murderer. If I skip the program, I'm just... negligent. And I can live with negligence. I can't live with murder."*
