      *   *Crucial Point on Case 5:* In climate policy, we are almost always in "Program" territory (spending resources), never "Button" territory (direct killing). So the "Program" intuition is the one that matters for the novel's theme. I need to highlight this.

  7.  **Final Polish:** Check tone. Ensure it sounds like it's coming from someone who knows the literature (Ramsey, Parfit, Singer, Kahneman) but speaks clearly to a writer. (Avoid excessive jargon, explain terms).

      *   *Key Distinction:* Descriptive (how we think) vs. Normative (how we should think).
      *   *Key Conflict:* Consequentialism (outcomes matter) vs. Deontology (actions matter).

  8.  **Final Plan:**
      *   Name the principle: **"Discounted Beneficence with Side-Constraints."**
