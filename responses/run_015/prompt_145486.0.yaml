  *(Self-Correction on Case 5)*: Wait, if I choose a principle that saves the "Program is okay" intuition, does it force me to say the Button is okay? No, Deontology saves the "Button is bad" intuition. But Utilitarianism forces you to say "Button is okay." The user wants to know what principle saves 1-4. 1-4 rely on discounting. Discounting is often Utilitarian (Ramsey). But Case 5 relies on Rights. So there is a clash. I need to be clear that **Standard Climate Economics** ignores Case 5's "Button" problem entirely. It assumes we are always in "Program" mode. This is vital for the novelist.

