answer: |-
  This is a classic debate in the philosophy of biology, rehearsing the tension between the **Selected-Effects (Etiological)** account (Millikan, Neander) and the **Causal-Role (Systemic)** account (Cummins). Both students are articulating standard, well-formed positions, but they are prioritizing different theoretical virtues. Here is the breakdown of who is right on each specific move.

  **Move 1: Lena on Malfunction**
  **Verdict: Lena is right.**
  This is the strongest philosophical argument for the etiological account. Cummins's causal-role account defines function as a causal contribution to a system's capacity. If a kidney filters waste poorly, it is still contributing causally to the system (perhaps causing the system to fail, but still playing a causal role). Cummins struggles to distinguish between a part *performing its function poorly* and a part *malfunctioning* (failing to do what it is *supposed* to do). Lena correctly identifies that only an account grounded in history (selection) can ground the normativity required to define "malfunction" or "disease."

  **Move 2: Marcus on Exaptation and History**
  **Verdict: Marcus is right.**
  Marcus correctly identifies a major practical weakness in strict etiological accounts. Biologists frequently attribute functions to traits based on their current utility, even if that utility is not the original selection pressure (exaptation). Requiring a full reconstruction of selection history can be empirically impossible or misleading regarding the trait's current biological significance. The causal-role account is indeed more general and avoids the "historical baggage" that can stall biological explanation.

  **Move 3: Lena on Exaptation Defense**
  **Verdict: Lena is theoretically consistent, but biologically rigid.**
  Lena is correct that, strictly speaking, the etiological account distinguishes between a trait's *proper function* (what it was selected for) and its current *effect* (flight). However, modern etiological theorists (like Neander) have refined this to include traits *maintained* by selection for a new role, not just their origin. Lena's claim that flight is merely a "byproduct" ignores that feathers are currently maintained by selection for flight. While she is right that function must track history, her application here is slightly outdated regarding how etiological accounts handle co-opted traits.

  **Move 4: Marcus on Artifacts and Scope**
  **Verdict: Marcus is right.**
  Marcus lands a solid blow regarding the scope of the theory. The etiological account is specific to evolutionary biology; it cannot account for the function of artifacts (e.g., a heart-lung machine) or traits that are spandrels (byproducts that aid fitness but were not selected for). The causal-role account is domain-general. If the goal is a unified theory of "function" across biology and engineering, Lena's account fails. However, since this seminar is specifically about *biological* function, this point is less damaging to Lena than the malfunction point is to Marcus.

  **Overall Assessment**
  Both students are arguing for different theoretical virtues. Marcus prioritizes **generality** and **empirical tractability**, while Lena prioritizes **normativity** and **conceptual precision**.

  In the context of *biological function* specifically, normativity is the distinguishing feature. Without the ability to distinguish between a function and a mere effect (or a malfunction), the concept of "function" collapses into "causal contribution." While Marcus is right that the etiological account is narrower, Lena is right that it captures the essential "ought" inherent in biological teleology. The inability of the causal-role account to handle malfunction is generally considered the fatal flaw when analyzing *biological* function specifically, whereas the etiological account's limitations on artifacts are often viewed as a feature (distinguishing biology from engineering) rather than a bug.

  \answer{Lena}
