answer: |-
  Here is the evaluation of your candidate principles, the synthesis of a working principle, and its application to your undecided case.

  ### 1. Testing the Candidate Principles

  **The Corridor Rule**
  *Definition:* When long-run effects are inscrutable, choose the option that best preserves the capacity to notice mistakes and reverse course (buy information, stay reversible).
  *   **Verdict (a) Malaria vs. Index Fund:** **FAILS.** The Corridor Rule dictates holding the money. Cash in an index fund is maximally reversible and preserves future optionality. Spending on malaria consumes the resource and is irreversible. You fund the malaria charity.
  *   **Verdict (b) Sealed-Envelope:** **FAILS (Likely).** If the long-run models are equally credible and one predicts catastrophe, the Corridor Rule suggests abstaining until you can distinguish the models, because funding risks locking in a catastrophic path. You fund it.
  *   **Verdict (c) Empty Box:** **PASSES.** Declining preserves optionality.
  *   **Verdict (d) The Tail:** **PASSES (Conditionally).** If the intervention prevents extinction, it preserves the "corridor" of all future humanity.
  *   **Verdict (e) Series:** **PASSES.** A series locks in a policy, reducing future flexibility compared to a one-off.
  *   **Summary:** The Corridor Rule is too conservative. It paralyzes near-term action in favor of future flexibility, contradicting your confidence in case (a).

  **The Zero-EV-minus-Variance Principle**
  *Definition:* Treat inscrutable long-run effects as expected value (EV) zero, subtract a penalty for variance, and decide on near-term evidence.
  *   **Verdict (a) Malaria:** **PASSES.** Near-term EV is positive; long-term is zero.
  *   **Verdict (b) Sealed-Envelope:** **PASSES.** Long-term signs cancel out (EV ≈ 0). Near-term is positive.
  *   **Verdict (c) Empty Box:** **PASSES.** Near-term is zero. Long-term is zero.
  *   **Verdict (d) The Tail:** **FAILS.** The near-term effects are unmeasurable (zero). The long-term effects are inscrutable (zero by your definition). A symmetric variance penalty would discourage the grant, not encourage it. You fund it.
  *   **Verdict (e) Series:** **WEAK FAIL.** Statistical variance increases with repetition, but your unease is about *systemic lock-in*, not just portfolio variance. This principle misses the structural risk.
  *   **Summary:** This principle captures your near-term focus but fails to account for the asymmetry of existential risk (d) and the structural risk of institutional lock-in (e).

  ### 2. The Repaired Principle: "The Anchor and Veto"

  To accommodate your actual practice, you need a principle that prioritizes near-term evidence but introduces specific, asymmetric constraints for long-term uncertainty.

  **The Principle:**
  **Maximize robust near-term welfare impacts, subject to an Asymmetric Long-Term Veto.**

  **The Clauses:**
  1.  **The Anchor (Near-Term Sufficiency):** An intervention is eligible for funding if it produces robust, measurable near-term welfare benefits. Long-term speculation (positive or negative) is treated as noise (EV = 0) and ignored *unless* Clause 2 or 3 is triggered.
  2.  **The Existential Veto (Downside Asymmetry):** An intervention is ineligible if a credible long-term model predicts irreversible civilizational collapse, *unless* the intervention's primary purpose is to prevent that specific collapse. (Positive long-term speculation never overrides the Anchor; negative long-term speculation only overrides the Anchor if it is existential).
  3.  **The Lock-In Multiplier (Reversibility Constraint):** If an intervention is effectively irreversible or represents the first step in a committed series, the threshold for the Existential Veto lowers. Long-term uncertainty that would be acceptable for a one-off, reversible grant becomes unacceptable for an irreversible or institutionalized one.

  ### 3. Clause-by-Clause Motivation from Your Cases

  *   **Case (a) Malaria vs. Index Fund:** Handled by **The Anchor**. The near-term benefit is robust. The long-term difference between spending now vs. later is treated as noise (cluelessness). You do not wait for better future options because the current near-term value is certain.
  *   **Case (b) Sealed-Envelope:** Handled by **The Anchor** + **Reversibility Assumption**. The near-term benefit is robust. The long-term sign disagreement is treated as noise (EV = 0). You fund it because the "catastrophically bad" model is treated as speculative noise *assuming the action is reversible*.
  *   **Case (c) Empty Box:** Handled by **The Anchor**. No near-term benefit means the grant is ineligible. Long-term speculation cannot open the door.
  *   **Case (d) The Tail:** Handled by **The Existential Veto**. This is the exception to the Anchor. Because the risk is civilizational collapse, the lack of near-term evidence is waived. The "noise" assumption is suspended for high-severity downside risks.
  *   **Case (e) Series:** Handled by **The Lock-In Multiplier**. The grant itself is identical, but the context changes. A series creates institutional lock-in, making the path harder to reverse. This triggers the Veto on uncertainty that would otherwise be ignored.
  *   **Case (f) Sign Agreement vs. Disagreement:** Handled by **The Anchor**. If signs agree, long-term noise has a direction, reinforcing the decision. If signs disagree, it is pure noise, so you fall back to the Anchor (near-term grounds).

  ### 4. The Verdict to Overturn

  You asked which verdict I would overturn to save the principle. **You must qualify Verdict (b).**

  In (b), you fund a program with a "catastrophically bad" long-run model because the near-term evidence is good. This is only consistent with (d) and (e) if the program is **reversible**. If the Sealed-Envelope program were irreversible, funding it would violate the **Lock-In Multiplier**.

  Your intuition in (e) (unease about series/lock-in) and (d) (funding to prevent catastrophe) reveals that you *do* care about long-term downside risk when the stakes are structural. Verdict (b) treats long-term downside risk as negligible solely because near-term good is present. This is inconsistent with your caution in (e).

  **The Repair:** You should only fund (b) if you are confident the intervention can be halted or reversed if early warning signs of the "bad" model emerge. If (b) is irreversible, you should decline it.

  ### 5. Application to the Undecided Case

  **The Case:** An intervention with large, well-evidenced near-term effects, but which is **effectively irreversible**, where long-run models **disagree about the sign**, and there is **no second chance**.

  **Application of "Anchor and Veto":**
  1.  **Check the Anchor:** The near-term effects are large and well-evidenced. *Status: Eligible.*
  2.  **Check the Existential Veto:** The models disagree about the sign. One model implies a negative long-term outcome. Does it imply civilizational collapse? The prompt says "disagree about the sign," not necessarily "existential risk." However, see Clause 3.
  3.  **Check the Lock-In Multiplier:** The intervention is **effectively irreversible** and there is **no second chance**. This maximizes the Lock-In Multiplier.
      *   In Case (b), you accepted sign disagreement because you presumably assumed reversibility (or low lock-in).
      *   In Case (e), you expressed unease about a *series* (partial lock-in) even with identical grant profiles.
      *   Here, you have total lock-in (irreversibility) + total uncertainty (sign disagreement).

  **Decision:** **Decline.**

  **Reasoning:**
  While the **Anchor** pulls you toward funding (large near-term good), the **Lock-In Multiplier** forces you to treat the long-term sign disagreement as a critical risk rather than noise. Because you cannot reverse course, the "bad" sign model represents a permanent negative legacy that you cannot correct.

  In Case (b), you could fund because if the bad model started to manifest, you could stop. Here, you cannot. This triggers the Veto. The uncertainty of the long-term sign, combined with irreversibility, creates a risk of permanent harm that outweighs the certain near-term benefit. You are prioritizing the *preservation of future optionality* (from the Corridor Rule) over the *immediate near-term gain* specifically because the immediate gain comes at the cost of permanent lock-in.

  **Summary:** You fund near-term good *unless* buying that good burns the bridge behind you while the map ahead is blank. In this case, the bridge is burned. Do not cross.
