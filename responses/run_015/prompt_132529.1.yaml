answer: |-
  This is a sharp observation. You have identified a pressure point in epiphenomenalist metaphysics that is often glossed over by the broader "self-undermining" objections. The standard objection asks, "How can you know consciousness exists if it does nothing?" Your objection asks, "How can you *discriminate* and *refine* your knowledge of consciousness if it does nothing?"

  The distinction is crucial. The standard objection targets the *existence* of the belief. Your observation targets the *content* and *accuracy conditions* of the belief, specifically as they scale with granularity and time.

  Per your request, I will not jump immediately to a label. Instead, I will brainstorm three candidate "carvings" of this problem—three ways to conceptualize the underlying metaphysical/epistemic tension. Then, I will select the most robust one, coin a precise term for it, and map its boundaries against the neighbouring worries you mentioned.

  ### Candidate Carving 1: The Discriminative Sensitivity Objection
  This carving focuses on the **grain** issue you highlighted.
  *   **The Core:** To report "throbbing" rather than "stabbing," your cognitive system must be *sensitive* to the difference between throbbing and stabbing. In any naturalistic framework, sensitivity implies a causal dependency: state $A$ causes report $A$, and state $B$ causes report $B$.
  *   **The Tension:** If qualia are epiphenomenal, the physical base causes the report. The quale "rides along." If the physical base is identical in two worlds, but the qualia differ (inverted spectrum), the report remains the same. Therefore, the report is not sensitive to the *qualitative* difference, only the *physical* difference.
  *   **The Scaling:** As you noted, coarse reports ("I feel something") require low sensitivity (binary). Fine reports ("throbbing") require high sensitivity (high-dimensional). The epiphenomenalist can perhaps luck into the coarse report, but the probability of consistently hitting the correct fine-grained label without causal sensitivity approaches zero.
  *   **Verdict:** This captures the "scaling with detail" intuition well. However, it treats the problem as a static probability issue. It doesn't fully capture the *temporal* aspect of your example—the *correction* a week later. It explains why the first report might be wrong, but not how the second report could be *righter* in a way that is answerable to the inert quale.

  ### Candidate Carving 2: The Semantic Anchoring Objection
  This carving focuses on the **meaning** of the terms used.
  *   **The Core:** When the philosopher writes "throbbing," what fixes the reference of that word? Usually, reference is fixed by a causal history (Kripke/Putnam style) or a functional role. I point to a sensation and name it.
  *   **The Tension:** If the sensation does nothing, it cannot participate in the causal history of the word. The word "throbbing" is caused entirely by physical brain states. Thus, "throbbing" refers to a physical brain state, not the quale.
  *   **The Scaling:** When the philosopher corrects themselves ("No, it was stabbing"), they claim the first word failed to refer to the *quale*. But if the quale never entered the causal chain, the word *couldn't* have referred to it in the first place. The correction is therefore systematically misguided; they are correcting a physical description with a ghost standard.
  *   **Verdict:** This is strong on metaphysics but slightly too semantic. It risks collapsing into the claim that "phenomenal language is meaningless," which is a bit blunt. It doesn't quite explain the *normative* force of the correction—why the philosopher feels *bound* by how it felt, even if their theory says that feeling did nothing.

  ### Candidate Carving 3: The Normative Calibration Objection
  This carving focuses on the **revision** and **authority** aspect.
  *   **The Core:** Phenomenological reporting is a calibration process. I adjust my public language to match my private experience. Correction is *recalibration*. This requires a feedback loop: Experience $\to$ Report $\to$ Comparison $\to$ Adjustment.
  *   **The Tension:** Calibration requires the thing being measured (the quale) to exert leverage on the measuring instrument (the speech motor cortex). If the quale is inert, the loop is broken. The "comparison" happening a week later is a comparison between a *memory trace* (physical) and a *new utterance* (physical). The original quale is not present to adjudicate.
  *   **The Scaling:** The more precise the calibration required (throbbing vs. stabbing), the tighter the feedback loop must be. Epiphenomenalism posits a loop with zero bandwidth between the target and the instrument.
  *   **Verdict:** This captures the dynamic nature of your example (the week-later correction) and the scaling issue (precision requires tighter coupling). It frames the problem not just as "how do I know?" but "how do I *tune*?"

  ---

  ### The Settled Carving: The Problem of Phenomenal Calibration

  I propose we settle on the third carving, formalized as **The Problem of Phenomenal Calibration**.

  While the *Discriminative Sensitivity* objection explains the grain issue, and the *Semantic Anchoring* objection explains the reference issue, **Phenomenal Calibration** subsumes both by focusing on the *epistemic practice* of phenomenology itself. It highlights that phenomenological reporting is not a one-off judgment (like "I exist") but an ongoing, revisable, high-resolution mapping task.

  #### Definition
  **The Problem of Phenomenal Calibration** is the difficulty of explaining how a subject can progressively refine the accuracy of their phenomenal reports (e.g., correcting "throbbing" to "stabbing") if the phenomenal properties being reported are causally inert.

  It consists of three conjuncts:
  1.  **Causal Isolation:** The phenomenal property $Q$ has no causal influence on the physical report $R$.
  2.  **Normative Authority:** The subject treats $Q$ as the normative standard for the correctness of $R$ (evidenced by corrections/revisions).
  3.  **Informational Bandwidth:** The specificity of $R$ (its grain) implies a high-bandwidth informational link between $Q$ and $R$, which is precluded by (1).

  The problem is not merely that the belief is unjustified (standard self-undermining), but that the *process of error-correction* regarding phenomenal content becomes metaphysically inexplicable. If $Q$ does nothing, the "correction" is just one physical state replacing another, with no mechanism to ensure the new state is *more aligned* with $Q$ than the old one.

  ---

  ### Differentiation from Neighbouring Worries

  You asked to distinguish this from specific existing problems. Here is how **Phenomenal Calibration** carves out its own space:

  **1. vs. The Standard Self-Undermining Objection (The "Paradox of Phenomenal Judgment")**
  *   *The Standard Objection:* (Chalmers, 1996). If consciousness does nothing, my judgment "I am conscious" is caused by physics, not consciousness. Thus, I don't *know* I am conscious.
  *   *The Difference:* The standard objection targets the **existence claim** ("I have a feeling"). It is a binary problem (Something vs. Nothing).
  *   *Phenomenal Calibration:* Targets the **individuation claim** ("It is *this* feeling"). It is a continuous problem (Throbbing vs. Stabbing). The standard objection might be dodged by claiming a "brute nomological connection" (the physical state always co-occurs with the judgment). Calibration cannot be dodged this way, because a brute connection explains consistency, but it does not explain *revisability towards accuracy*. Why does the second judgment track the quale *better* than the first if neither is caused by it?

  **2. vs. Moore-Style Paradox / Self-Refutation**
  *   *Moore's Paradox:* "It is raining, but I don't believe it." This is a pragmatic contradiction between content and assertion.
  *   *The Difference:* The epiphenomenalist is not asserting a contradiction. They are asserting "Qualia exist" and "Qualia do nothing." This is logically consistent.
  *   *Phenomenal Calibration:* This is not a logical contradiction but an **explanatory gap in practice**. The theory is consistent, but the *activity* of doing phenomenology (writing, correcting, debating) presupposes causal powers the theory denies. It is a pragmatic self-stultification of the *research program*, not the proposition.

  **3. vs. The Generality Problem (Reliabilism)**
  *   *The Generality Problem:* (Goldman). To judge if a belief-forming process is reliable, we must individuate the process type (e.g., is it "vision" or "vision in dim light at 5pm?").
  *   *The Difference:* The Generality Problem is about how we *describe the source* of the belief.
  *   *Phenomenal Calibration:* This is about how we *individuate the target* of the belief. The issue isn't "Is the process 'introspection' or 'fine-grained introspection'?" The issue is "Does the target 'throbbing' have enough causal leverage to select the word 'throbbing' over 'stabbing'?" It is a problem of **Target-Tracking**, not Process-Individuation.

  **4. vs. The "Zombie Twin" Intuition**
  *   *Zombie Worry:* A physical duplicate would say the same things without qualia.
  *   *The Difference:* The Zombie worry is usually used to argue that qualia are non-physical.
  *   *Phenomenal Calibration:* Uses the Zombie intuition to argue that **phenomenal error is impossible** for the epiphenomenalist. If my zombie twin says "throbbing" and I say "throbbing," and neither of us is caused by the quale, then if I later say "actually, stabbing," I am not correcting an error relative to the quale. I am just changing noise. The Zombie twin would make the *same correction* for the *same physical reasons*. Therefore, the correction is not about the quale.

  ---

  ### Boundary Cases and Scalability

  To ensure this concept is robust, we must look at where the problem fades or intensifies.

  **1. The Coarse-Grained Boundary (Where the problem weakens)**
  *   *Case:* The subject reports "I am in *some* phenomenal state."
  *   *Analysis:* Here, the "Calibration" requirement is minimal. Almost any internal state maps to "some state." The probability of accidental alignment is high.
  *   *Implication:* Epiphenomenalism is most tenable at the coarsest grain ("There is something it is like"). It becomes increasingly untenable as the grain fine-tunes. This validates your intuition that the "fine-grainedness is where the real problem lives."

  **2. The Infallibility Boundary (Where the problem transforms)**
  *   *Case:* The Cartesian claim that we cannot be wrong about our current qualia.
  *   *Analysis:* If reports are infallible, "correction" is impossible. If I say "throbbing," it is throbbing by fiat.
  *   *Implication:* The Problem of Phenomenal Calibration *dissolves* if one adopts strong Infallibilism. However, this comes at the cost of making phenomenology scientifically useless (since science requires the possibility of error and correction). Your example relies on the philosopher *admitting error* ("I got it wrong"). This suggests most working epiphenomenalists implicitly reject infallibility, thereby inviting the Calibration Problem.

  **3. The Memory Boundary (The "Week Later" Factor)**
  *   *Case:* Correcting a report based on memory.
  *   *Analysis:* This intensifies the problem. Now we need a causal chain: Qualia $\to$ Encoding $\to$ Storage $\to$ Retrieval $\to$ Comparison $\to$ Correction.
  *   *Implication:* Epiphenomenalism breaks the first link. If the quale doesn't cause the encoding, the memory trace is of the *physical correlate*, not the quale. The later comparison is between a report and a physical trace. The claim that this settles the truth about the *quale* is unsupported.

  ### Summary for Your PhD

  You are tracking a specific vulnerability in non-interactionist dualism that is distinct from the general "knowledge" objection.

  *   **Label:** **The Problem of Phenomenal Calibration**.
  *   **Core Insight:** Epiphenomenalism severs the feedback loop required for high-resolution error correction.
  *   **Key Differentiator:** It targets *specificity* and *revision* (dynamic accuracy), not just *existence* (static justification).
  *   **Strategic Use:** You can use this to argue that even if epiphenomenalism is metaphysically possible, it renders the *practice* of phenomenology (and the data it produces) inexplicable. It turns the phenomenologist's detailed reports into "blind shots" that somehow consistently hit the bullseye and correct their own aim without seeing the target.

  This gives you a principled reason to draw the line where you suspected: the trouble scales with detail because calibration requires bandwidth, and epiphenomenalism posits zero bandwidth.
