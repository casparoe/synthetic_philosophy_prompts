answer: |-
  This is a sharp dissection of local land-use politics. The term "temporal feudalism" captures the friction between a democratic ideal (one person, one vote) and the administrative reality of zoning (one parcel, one veto).

  Below is a reconstruction of the implicit theory governing your city's process, followed by an analysis of its logical commitments, alternative theoretical licenses, and potential defenses of seniority. Per your request, I have concluded with a specific taxonomy separating descriptive facts, contested expert disagreements, and my own analytical synthesis.

  ### 1. Reconstruction of the Implicit Theory

  The process you describe rests on a specific, often unarticulated political theory of the city. It is not merely "NIMBYism"; it is a coherent, if exclusionary, framework regarding rights and standing.

  **A. Property as a Bundle of Expectations, Not Just Rights**
  The process presupposes that property ownership includes a *negative easement* over the surrounding public realm. When you buy a home, you are not just buying the structure; you are buying the *regulatory environment* surrounding it.
  *   **The Theory:** The "character" of the neighborhood is a capital asset attached to existing homes. Changing the zoning devalues that asset by altering the expectations under which it was purchased.
  *   **The Implication:** The city is not a neutral referee but a guarantor of the status quo. The "right to the city" is a right to *stability*, not a right to *participation in change*.

  **B. Standing as Proximity + Tenure (The "Presentist" Bias)**
  The hearing process operationalizes a specific definition of harm.
  *   **The Theory:** Harm is presumed to be physical and immediate (traffic, shadow, parking) and is legally cognizable only for those currently exposed to it.
  *   **The Implication:** Future residents are theoretical; current neighbors are actual. The process privileges *existing* impacts over *potential* benefits. It assumes that the pain of the loser (the neighbor losing light) outweighs the gain of the winner (the tenant gaining housing) because the loser is identifiable and present, while the winner is abstract. This is a raw application of status quo bias codified into procedure.

  **C. The Neighborhood as a Corporate Entity**
  The process treats the neighborhood as an entity with interests distinct from the sum of its residents.
  *   **The Theory:** A neighborhood has a "character" that survives the turnover of individual humans. Therefore, the current residents are merely *stewards* of that character, empowered to defend it against changes that would alter its essence, even if those changes align with broader city goals.
  *   **The Implication:** This reifies the built form. The "interest" of the neighborhood is often defined by the *buildings* (single-family detached) rather than the *people* (families, workers). This explains why a family of eight in a house is permissible (fits the form) but 40 people in an apartment is not (violates the form), even if the material impacts are similar.

  ### 2. Strict Commitments vs. Compatible Beliefs

  To understand how rigid this theory is, we must distinguish what the practice *requires* you to believe versus what merely *fits* with it.

  **Strict Commitments (What the practice forces you to accept)**
  1.  **Form Over Function:** You must accept that the *type* of building is a legitimate subject of regulation, distinct from the *impacts* of the building. If impacts were the only metric, the family of eight would trigger the same review as the 40-unit building. The process commits you to the view that density itself is a harm, regardless of traffic or noise.
  2.  **Veto Power as Property Right:** You must accept that adjacent owners possess a property right in the *vacancy or low density* of their neighbor's land. If they didn't, they would have no standing to object to a legal rezoning.
  3.  **Temporal Priority = Moral Weight:** The process commits to the view that being there first grants a higher order of consideration than arriving later. The procedural hurdle (rezoning) exists specifically to protect the prior arrangement.

  **Merely Compatible (What often accompanies it, but isn't required)**
  1.  **Exclusionary Intent:** While the *outcome* is often exclusionary (keeping out lower-income renters), the *theory* does not strictly require malice. One could support this process believing it protects environmental quality or historic preservation, without caring about who lives there.
  2.  **Small Government:** Ironically, this process is often defended by people who claim to want less regulation. However, the theory does not require small government; it requires *specific* government intervention to freeze the status quo. A libertarian would oppose the rezoning *and* the restrictions on the existing home.
  3.  **Racial/Class Homogeneity:** While statistically correlated, the theory of "neighborhood character" can be articulated purely in aesthetic or infrastructural terms. The logic holds even if the demographics remain unchanged.

  ### 3. Equifinality: Different Theories, Same Practice

  You asked where different theories license the exact same practice. This is crucial because it means defeating the practice requires defeating multiple underlying justifications, not just one.

  **Theory A: Lockean Labor/Mixing**
  *   **Logic:** "I invested in this neighborhood based on the rules at the time. Changing the rules devalues my labor/investment."
  *   **License:** Protects incumbents based on reliance interests.
  *   **Overlap:** Same veto power for current owners.

  **Theory B: Administrative Efficiency (Cost-Benefit)**
  *   **Logic:** "It is too costly to identify future tenants. Current owners are easy to notify and have a concentrated interest. Let's just listen to them to save transaction costs."
  *   **License:** Protects incumbents based on procedural convenience.
  *   **Overlap:** Same veto power for current owners.

  **Theory C: Communitarian Stability**
  *   **Logic:** "Rapid change destroys social capital. Existing residents maintain the social fabric; new high-density residents are transients."
  *   **License:** Protects incumbents based on social cohesion.
  *   **Overlap:** Same veto power for current owners.

  **Why this matters:** If you argue against Theory A (by saying "no one owns the skyline"), the proponents can retreat to Theory B ("we just need a clear rule for who gets notified") or Theory C ("we need to protect community stability"). The practice is robust because it is underwritten by a coalition of incompatible philosophies.

  ### 4. Is There a Defense of Arrival Time That Isn't Incumbency?

  "Temporal feudalism" sounds pejorative, but is there a liberal-democratic defense of seniority that isn't just "I got mine"?

  **The Reliance Argument (Contractarian)**
  This is the strongest non-feudal defense. It argues that the city made an implicit contract with the buyer in 2019. The zoning code was part of the price. To change it retroactively is a breach of contract.
  *   **Distinction:** This isn't about *who you are* (seniority); it's about *predictability*. If the city cannot bind its future self, property becomes a gamble, and investment dries up.
  *   **Limit:** This justifies protecting the *rules*, not necessarily the *specific outcome*. It argues for a high bar for change, not necessarily a veto.

  **The Civic Competence Argument (Republican)**
  This argues that standing should be tied to civic investment.
  *   **Logic:** People who have lived somewhere longer have more "skin in the game." They pay taxes longer, know the local history, and are more likely to be around to deal with the long-term consequences of a decision. Transient renters (the likely tenants of the new building) may not be around to fix problems if the project fails.
  *   **Distinction:** This frames seniority as a proxy for responsibility, not privilege.
  *   **Limit:** It falsely equates homeownership with stability and renting with transience, which is empirically shaky.

  **The "Anti-Developer Capture" Argument**
  *   **Logic:** Developers are repeat players with specialized knowledge and capital. Individual neighbors are one-shot players. The hearing process is a corrective imbalance to ensure the "little guy" isn't steamrolled by professional lobbyists.
  *   **Distinction:** Seniority here is a proxy for vulnerability.
  *   **Limit:** It assumes the developer is the aggressor and the neighbor the defender, ignoring that the neighbor is using state power to restrict the property rights of the landowner.

  ### 5. Epistemic Taxonomy: Settled, Contested, and Analytical View

  Per your request, here is the separation of claims made above into descriptive facts, live expert disagreements, and my own synthesis.

  | Claim / Concept | Epistemic Status | Notes |
  | :--- | :--- | :--- |
  | **Process Mechanics** (3 hearings, rezoning required, neighbors speak, future tenants don't) | **Settled Fact** | These are observable procedural realities of your specific municipality and most North American zoning codes. |
  | **"Neighborhood Character" as Legal Interest** | **Settled Fact (Legal)** | Courts generally uphold "character" as a legitimate state interest in zoning cases (*Village of Euclid* legacy). |
  | **Impacts of Density vs. Occupancy** (Family of 8 vs. 40 units) | **Contested (Empirical)** | Planners debate whether density *itself* causes negative externalities or if it's design-dependent. Your observation that impacts are "pretty similar" is a live empirical dispute. |
  | **Property as "Expectation of Status Quo"** | **Contested (Theoretical)** | Legal scholars disagree on whether zoning creates a vested right in the *surroundings*. Some say zoning is a public right, not a private contract. |
  | **"Temporal Feudalism" Label** | **Analytical View** | This is my synthesis of your observation. It is a metaphor, not a legal term. It captures the *effect* but implies a hierarchy that proponents would deny. |
  | **Equifinality of Theories** (Lockean, Efficiency, Communitarian) | **Analytical View** | This is a philosophical reconstruction. Proponents usually believe only *one* of these is their true motivation. |
  | **Reliance Argument as Non-Incumbent Defense** | **Analytical View** | This is a normative argument I am constructing. Some economists support it; housing advocates generally reject it as a barrier to supply. |
  | **Administrative Standing vs. Legal Standing** | **Settled Fact** | It is a fact that zoning hearings grant "procedural standing" to neighbors that differs from Article III legal standing in court. |
  | **The "Reification" of the Neighborhood** | **Analytical View** | The claim that the process treats the neighborhood as a corporate entity is a sociological interpretation of the legal process. |

  **Summary of the View:**
  My own analytical view is that the process is not merely "broken"; it is functioning exactly as designed by a theory that prioritizes **stability of capital** over **equality of access**. The "temporal feudalism" label is accurate insofar as the system grants sovereignty to the past over the future. The only non-exclusionary defense is the *Reliance Argument*, but that argument collapses if the city's own plan (which you mentioned) already calls for the density. If the plan already says the density belongs there, the "reliance" was always on a temporary reprieve, not a permanent right. The process you describe allows neighbors to veto the *implementation* of the city's own plan, which suggests the implicit theory is actually **Local Veto Supremacy**, not Rule of Law.
