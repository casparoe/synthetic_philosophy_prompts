answer: |-
  Your stalemate arises because you are both attempting to map a debate about voluntary exchange onto a narrative about structural servitude. The repugnant-markets literature, whether invoking Kass on disgust or Roth on matching mechanisms, presupposes agents who possess enough standing to participate in a transaction, even if that participation is constrained. Ishiguro's novel, however, depicts subjects who are systematically denied the status of agents. To apply market ethics here is to risk conscripting the text, as your friend suggested, but it is also a necessary violence if we are to understand why the economic language of the real world fails to describe the horror of this one. The novel does not simply argue for or against markets; it exposes the preconditions required for markets to be morally intelligible. When you look at the internal economy of Hailsham, the token system governing the students' art, you are not seeing a market in the sense that Satz or Sandel would recognize. There is no external currency, and the tokens cannot be redeemed for freedom or survival. Instead, this is a pedagogical simulation designed to teach the children that their inner lives have exchange value, even while denying them the power to set the price.

  Debra Anderson's expressive theory of valuation fits this scene better than Sandel's corruption objection or Satz's criteria for noxious markets. Sandel worries that money corrupts the meaning of a good, but here the tokens do not corrupt the art; they validate it. The students feel seen when their work is traded. The corruption lies elsewhere: it lies in the fact that this miniature economy masks the total alienation awaiting them. Anderson insists that different goods require different modes of valuation, and the Gallery represents the mode that should apply: art as evidence of a soul, inalienable and sacred. Yet Madame removes the best work from the token economy entirely, placing it in a space the students cannot access. This creates a dissonance where the children are trained to value their humanity through trade, while the guardians treat that humanity as a specimen to be collected. The token system is not a market that exploits them; it is a rehearsal for a consent they will never be asked to give. It corrupts their understanding of value, teaching them to accept external valuation as the only proof that they matter.

  This misalignment of value and agency sharpens during the Norfolk trip, specifically regarding the recovery of the lost cassette. When Kathy finds her music in a secondhand shop and pays for it, she participates in a standard resale transaction. However, ethically, this is a case of someone charging for the return of a good that was never theirs to keep. The shopkeeper holds leverage over a lost item, and the students accept the terms without dispute. Their reaction commits the novel to a specific claim about subordinate groups: they internalize market norms even when those norms work against them, because they lack the social standing to assert a non-market claim. They cannot demand the return of lost property as a right; they must purchase it as a commodity. This scene suggests that the horror is not the presence of a market, but the inability to opt out of it. In the real world, we might argue about whether certain goods should be bought and sold. In the world of the novel, the clones cannot argue at all. They are forced to speak the language of commerce because they are denied the language of rights. This supports your suspicion that the market framing is something readers bring, but it also shows that the book uses that framing to demonstrate how economic logic colonizes moral reasoning when power is unequal.

  This leads to the most significant divergence between your positions and the text: the absence of a market for the organs themselves. You note correctly that no price is ever named, no broker hired. The organs are not sold; they are completed. This vocabulary of duty and completion is crucial. If the clones sold their organs, they would, in a grim sense, be acknowledged as owners of their bodies. A market transaction requires a seller. By refusing to price the organs, the society in the novel refuses to acknowledge the clones as owners. This makes the gift-and-obligation structure far more repugnant than a market would be, though for reasons neither Kass nor Roth fully capture. A market would imply consent, however coerced. The current system implies biological destiny. Ishiguro's refusal to price anything is not an evasion; it is the central moral position of the book. It argues that the ultimate exploitation is not commodification, but instrumentalization without the intermediary of commerce. To sell an organ is to participate in a transaction; to donate it because it is your purpose is to be erased as a person.

  Consequently, pricing the clones' organs would be less repugnant than the current structure, because it would grant them a sliver of agency they are otherwise denied. This complicates your friend's Kassian reading. Kass argues that repugnance protects us from violating human dignity. But here, the public's repugnance is directed at the creation of the clones, not their harvesting. The society is disgusted by the manufacturing of life, not the consumption of it. Once the Morningdale scandal reveals the artificiality of the children, the system collapses, not because people realized the organ taking was wrong, but because the aesthetic purity of the natural order was violated. The revulsion does not do genuine moral work; it does protective work for the conscience of the donors. They need to believe the clones are other enough to be used, but human enough to suffer. Your Rothian reading is closer to the truth in that repugnance is a poor moral tracker, but Roth assumes that markets are the alternative. The novel suggests that when agents are stripped of standing, markets are not even an option. The horror is pre-market.

  The deferral rumor further illuminates this stripping of agency. The idea that a couple in love might postpone donation functions as a non-market rationing device keyed to emotion rather than willingness to pay. In a market, time is bought. In this system, time is supposedly earned through authentic feeling. When this turns out to be false, it implies a rigid inalienability imposed from the outside. Inalienability is usually a protection; we say bodies cannot be sold to protect people from exploitation. Here, inalienability is a trap. The clones cannot sell their organs, but neither can they keep them. They have no property rights in themselves. The falsity of the deferral rumor proves that no exception exists for love, just as no exception exists for money. Who gets to decide what a life is worth? The institution decides, and the value is fixed at zero. This defeats the Kassian hope that social norms can protect the vulnerable. The norms here are the weapon. It also defeats the Rothian hope that mechanism design can improve outcomes. There is no mechanism that can fix a system where the participants are not recognized as players.

  So, where does this leave your argument? Neither position is fully vindicated, but your reading is favored insofar as it recognizes that repugnance is misdirected. However, the novel goes further than saying repugnance is a poor tracker; it suggests that repugnance is a luxury of the fully human. The public feels disgust so they do not have to feel guilt. Your friend argues that the collapse of the program after the scandal shows the system relies on ignorance. This is true, but not because the ignorance protects morality. It protects the comfort of the beneficiaries. The novel does not belong in the repugnant-markets literature in the standard sense, because there is no market to be repugnant about. You and your friend have conscripted the text, but that conscription reveals something vital. By trying to find the market, you highlight its absence. The book belongs in a literature about the conditions that make markets possible. You cannot have a repugnant market unless you have agents who can be repugned against.

  Ishiguro adds something to the debate that a journal article on kidney sales cannot. An article assumes parties who can speak, contract, and object. It debates the terms of the transaction. The novel dramatizes the phenomenology of being the object of the transaction. It shows what it feels like to live inside a system where your body is a resource but your voice is irrelevant. The contribution is about the vocabulary of objection. In market ethics, we assume that if a transaction is unjust, the victim can name it as such. They can say, "This price is too low," or "I do not consent." The clones have no vocabulary for this. They speak of completion, of duty, of watching the horizon. They cannot name the injustice because their language has been curated to prevent it. Ishiguro shows that the deepest harm of exploitation is not the taking of the organ, but the taking of the language required to resist the taking. A journal article can analyze the fairness of a price. It cannot show you the silence of someone who knows they have no price to name. The novel forces the ethicist to confront the fact that before we debate whether a market is repugnant, we must ask who is allowed to stand at the counter. In this light, the book does not vindicate Kass or Roth. It indicts the world that makes their debates possible while leaving the clones outside the room.
