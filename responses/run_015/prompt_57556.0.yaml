      *   **Goal:** Be faithful to both the novel and the theorists. Explicitly state where the market framing is reader-imposed. Conclude on which position (Kassian vs. Rothian) is favored or if both are defeated. Add what Ishiguro contributes to the repugnance debate that a journal article cannot (specifically regarding moral phenomenology and vocabulary).

  2.  **Deconstruct the Four Points:**

      *   **Point 1: Hailsham's Internal Economy.**
          *   *Scenario:* Students create art, trade via tokens, sell at Sales, Madame takes best for Gallery.
          *   *Theorists:*
              *   Satz (Noxious Markets): Focus on vulnerability, extreme harm, undermining equality.
              *   Sandel (Corruption vs. Fairness): Does money corrupt the good (art) or just make it unfair?
              *   Anderson (Expressive Theory): Different goods need different valuation modes.
          *   *Analysis:* The tokens aren't real money (cannot be exchanged outside). It's a simulated market. The Gallery removes art from the economy entirely (inalienable?).
          *   *Fit:* Anderson fits best. Art is treated as a mode of expressing soul/humanity, but the token system simulates valuation. However, the Gallery removes it from exchange, suggesting art proves humanity rather than having exchange value. Sandel's corruption objection applies if tokens cheapen the art, but the students feel validated by the trade. Satz is less relevant unless we view the students as vulnerable agents being trained for exploitation.
          *   *Verdict:* It's a pedagogical simulation, not a true market. It trains them to accept valuation of their inner lives by outsiders.

      *   **Point 2: Norfolk Trip (The Cassette).**
          *   *Scenario:* Lost item found in a shop, money paid to get it back.
          *   *Ethics:* Resale of lost goods.
          *   *Analysis:* The shopkeeper isn't the owner. The students pay anyway. It highlights their lack of power/ownership. They accept the market norm even when it feels wrong because they have no other language.
