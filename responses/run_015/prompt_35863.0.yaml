  Based on Daniel's track record, I would bet that he is operating on a principle of **Reasoning-Isomorphism Superrationality**. This is a specific, rigorous subset of Evidential Decision Theory (EDT) where cooperation is contingent not merely on shared goals or abstract rationality, but on **common knowledge of operational algorithmic similarity**.

  He does not cooperate because he is nice (he defects against strangers). He does not cooperate simply because he shares values (he prioritizes reasoning style in his intellectual life). He cooperates when he has evidence that the other party is running the same "decision software" he is, and that they know he is running it too.

  Here is why this principle beats the alternatives, followed by my predictions and the discriminating test.

  ### Why Reasoning-Isomorphism Beats the Rivals

  1.  **Vs. Naive Superrationality:** A pure Hofstadterian superrationalist might cooperate with *any* agent they deem rational. Daniel defects against the "total stranger about whom he knows nothing." This shows he requires evidence of correlation, not just an assumption of rationality. He needs to know the other agent's *process* matches his, not just that they are smart.
  2.  **Vs. Team Reasoning (Shared Values):** If Daniel were a team-reasoner keyed to values, he would likely cooperate with anyone who shares his ends. Yet his cooperation with the friend is explicitly predicated on having "talked the problem through and converged on a view." The *convergence of reasoning* was the trigger, not the pre-existing friendship.
  3.  **Vs. Standard Evidential Decision Theory:** Standard EDT suggests voting because your vote is evidence others like you will vote. Daniel fits this, but his specific behavior in the Lottery (picking 1) and with the Friend (converging) shows he cares about the *mechanism* of that correlation. He needs the correlation to be grounded in shared *reflectiveness*, not just demographic or psychological similarity.

  ### The Predictions

  **Case One: The Stranger Who Read the Literature**
  **Prediction: Daniel Defects.**
  While the stranger has access to the same "source code" (the literature), Daniel knows "no idea whether she acts on it." For Daniel, reading is not running. In the Friend case, they *converged* (active alignment). In the Lottery, the group was *reflective* (active processing). Mere exposure to the ideas does not establish the **common knowledge of operational isomorphism** required to trigger the superrational switch. Without assurance that she executes the algorithm, he defaults to the causal Nash equilibrium: Defect.

  **Case Two: The Election of Mirrors vs. Values**
  **Prediction: Daniel Votes for the Opponent.**
  This is the harder pill to swallow, but it follows from the principle. Daniel rejects the causal EV argument for voting because he believes his act is evidentially linked to other agents of his *type*. His "type" is defined by his reasoning style, not his policy preferences. The prompt states that voters whose "reasoning most closely mirrors Daniel's" support the Opponent.
  If Daniel votes for his preferred candidate (supported by the "different style" group), he severs the evidential link to his reasoning cohort. He would be asserting that his specific instance of reasoning is superior to the aggregate of his mirrors, which undermines the very symmetry that justifies his voting in the first place. To remain consistent with his rejection of the EV argument, he must vote with the mirrors, even if they are "wrong" on values.

  ### The Discriminating Case

  To definitively distinguish **Reasoning-Isomorphism Superrationality** from **Team Reasoning (Shared Values)**, you should present Daniel with the following scenario:

  **The "Aligned Enemy" Dilemma:**
  Daniel is in a one-shot Prisoner's Dilemma with a stranger. He is given verified proof that the stranger **shares all his social and political values perfectly** (they want the exact same world outcome) but **uses Causal Decision Theory** (they explicitly maximize individual expected value and will defect if it pays).

  *   **If Daniel Cooperates:** He is a **Team Reasoner**. He cares about the *outcome* and trusts that shared values create a "team" regardless of the decision algorithm.
  *   **If Daniel Defects:** He is a **Reasoning-Isomorphism Superrationalist**. He knows that because she is a Causal Decision Theorist, she will defect. Since his algorithm does not match hers, there is no acausal link to exploit. He defects to avoid the sucker's payoff, prioritizing the integrity of the reasoning match over the shared values.

  Given his history of defecting against strangers and his obsession with *how* people think (Hofstadter, reflectiveness), I expect him to **Defect**, confirming that for Daniel, the *method* is the message.
