     *Cheapest insentient lookalike:* A battery management system throttling performance to prevent overheating despite user demand for speed.

  4. **Cross-contextual valence integration:** **70**
     *Cheapest insentient lookalike:* A multi-objective controller collapsing distinct error terms into a single scalar loss function driving all actuators.

  5. **Broadcast architecture:** **40**
     *Cheapest insentient lookalike:* A classical blackboard system where independent modules post data to a shared global memory.

  6. **Self-report:** **25**
     *Cheapest insentient lookalike:* A large language model predicting the token "pain" follows patterns describing tissue damage.

  7. **Domestic thermostat:** **1**
     This is not a *reductio* of the instrument but a necessary anchor; it confirms the scale measures deviation from pure control theory, and since a thermostat is the paradigm of non-valenced regulation, it must occupy the floor.

  **Honeybee Placement**
  A honeybee plausibly exhibits Marker 2 (conditioning) and Marker 3 (trade-offs in foraging vs. safety), but lacks the neural substrate for Marker 5 (global broadcast). On this scorecard, the bee's credence is driven by its highest confirmed marker, landing it near **55**. It does not reach the 70 of Integration because we lack evidence that its competing drives collapse into a single phenomenological currency rather than parallel modular arbitration.

  **Metacognitive Reflection**
  Constructing the lookalikes lowered my absolute credences for all markers, as each can be instantiated by standard optimization algorithms without invoking qualia. However, the exercise sharpened the relative ordering: it moved Self-Report down significantly (due to LLMs) and elevated Integration above Trade-off, clarifying that a unified loss function is stronger evidence for valence than the behavioral output of cost-minimization alone. I walked in thinking Report was stronger evidence; I leave thinking functional integration is the only marker that isn't trivially spoofed by current AI architectures.
