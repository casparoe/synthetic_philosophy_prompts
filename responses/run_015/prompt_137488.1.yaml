prompt: |-
  Hey — I run a tiny reading group (six of us, two physicists, one anaesthetist, the rest just argumentative) and I want a one-page flowchart we can fight over: a decision tree that takes you from an assumption everybody in the room already accepts — before the trigger is pulled you'd bet on the outcomes at the Born-rule odds — to a named position on the quantum suicide / quantum immortality argument. Not prose about the argument: an actual tree I can photocopy.

  A few constraints, because I've seen handouts that just list five "-isms" and I don't want that:

  - Build it from the logical space, not from a list of names. Give me the branch questions and the combinations of answers they allow first, then locate the positions in that space.
  - Max 8 branch questions, so somewhere around 8-10 leaves. Every node has to be phrased as a yes/no or two-or-three-way question someone could answer without knowing where it leads — no node is allowed to contain the words "Everett", "many worlds", "measure", "Born", "anthropic", "immortal" or "branch".
  - Use my cases, not the usual one, and say which node each one is doing the work at:
    1. the standard equal-odds gun, ten runs;
    2. a rigged version where the survival outcome has a much smaller share of the total each run (say one part in a thousand), ten runs — I want to know whether the argument still goes through when what you survive into keeps getting thinner;
    3. a version where the bad outcome isn't death but a year of dreamless sleep, so there's an outcome with a body but no experiencing at all;
    4. a version where the bad outcome leaves you alive and in pain — does the argument tell you to expect to be maimed?;
    5. the technician standing behind the glass, who watches the whole sequence from outside — whatever the tree says about her evidence, say whether it has to differ from the subject's, and at which node.
    I made up 2, 3 and 4 so tell me if any of them just collapses into something standard.
  - Leaves I want present: the plain "you should expect to keep experiencing, and pulling the trigger is fine" one; the "you'll keep experiencing but don't do it" one; a fading/threshold view on which experience thins out and effectively stops; a "this gives you no evidence about anything" leaf; one shared exit leaf for everyone who denies there are successors at all; and a leaf for "there are successors but none of them is me, so there's nothing to anticipate".
  - Then: at least three combinations of answers your tree allows that nobody actually holds, each with a one-line diagnosis — incoherent, unattractive, or just unclaimed?
  - Flag any pair of leaves your questions can't separate instead of inventing a question to split them. I definately expect the no-successors exit to lump together views that hate each other, and I suspect two other leaves come apart only in case 2 — if that's so, say so.

  Two more things. Commit: pick a leaf for yourself, tell me which unoccupied cell you think deserves a tenant and why, and give me a number from 0 to 100 for how much this argument raises your credence in there being successors — I want a verdict with reasons, not a survey of what various people would say. And keep the whole thing, tree plus diagnosis plus your commitments, under 600 words.
