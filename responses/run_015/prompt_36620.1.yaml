      *   **Subject Matter:** Epistemic injustice (specifically Miranda Fricker's *testimonial injustice*), medical gaslighting, base rate neglect vs. systemic bias, intentionality vs. structural harm.

  2.  **Deconstruct the Debate (Move-by-Move):**

      *   *Context:* Mum exhausted/losing weight -> GP dismisses (stress/age/exercise) -> Late diagnosis (routine blood test would have caught it).
