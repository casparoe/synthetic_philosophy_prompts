answer: |-
  ### Internal Brainstorm: Audience Dialectic

  Before populating the table, here is the strategic landscape. Your "Hard Person-Affecting" view is theoretically robust but practically vulnerable.

  1.  **The Climate Ethicists (The Practical Threat):** They are your biggest risk. They will not care about the metaphysics of identity; they care that your view *sounds* like an excuse for intergenerational negligence. They will conflate "no person-affecting reason" with "all things considered permissible." You must separate the *moral reason* from the *empirical calculation* of risk to existing people.
  2.  **The Impersonalists (The Theoretical Threat):** They will attack the core intuition that "impersonal loss is inert." They will push the "Miserable Lives" boundary. If you say level 65 vs 80 doesn't matter, does level 5 vs 10 matter? If you say yes, you lose the principle; if you say no, you lose the room. You must hold the line on the *concept* of harm, even if it costs you intuitive plausibility at the margins.
  3.  **The Contractualist (The Deontological Threat):** They might agree with you on person-affecting constraints but will worry about *principles*. Can current people reasonably reject a principle that allows depletion? You need to argue that reasonable rejectability requires a *comparative* complaint, which P1 (the non-existent conservation people) cannot lodge.
  4.  **The Grad Students (The Technical Threat):** They will look for inconsistencies with Parfit's Three Claims or the Non-Identity Problem's standard solutions. They might bring up "Risky Policies" where identity is preserved but harm is probabilistic.
  5.  **The "Hope Nobody Asks":** The *Risky Policy* case (Parfit's Case 15). If we choose a policy that imposes a risk of harm on future people, and the harm materializes, the NIP says "no harm done" (they wouldn't exist otherwise). But intuitively, imposing the *risk* was wrong. This targets the *ex ante* status of your view. If you admit *ex ante* harm to possible people, you collapse into impersonalism; if you deny it, you look reckless.

  ***

  ### Q&A Prep Sheet: Defending the Hard Person-Affecting View

  | Objection Stated In Audience Voice | Likely Source In The Room | Damage Assessment | Recommended Two-Minute Reply In My Voice | Where The Reply Is Softest And What To Concede |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. "You're telling climate policymakers that causing a future world with significantly more suffering is morally neutral. If your theory licenses depletion to save us modest costs today, it licenses sacrificing the future for the present. Isn't this just moral egoism dressed up as metaphysics?"** | Climate Ethicists | **Critical.** This frames your thesis as practically abhorrent and politically dangerous. It threatens the *uptake* of your work. | **Strategy: Reframe.** "I distinguish moral reasons from all-things-considered judgments. My claim is that *impersonal* welfare loss provides no reason. However, depletion almost always imposes *risks* on existing people (e.g., instability, resource wars). Those are same-person harms. I am not licensing depletion; I am saying the *specific* NIP-based objection to it fails. We must stop depletion for the sake of *us*, not for the sake of *them*." | **Soft Spot:** Reliance on empirical risk claims. **Concede:** "If a depletion case were truly risk-free for existing people, my theory says it's permissible. I accept that bullet, but deny such cases exist in reality." |
  | **2. "You claim impersonal loss is inert. But if Outcome A has more net suffering than Outcome B, surely A is worse in some sense? If you deny this, aren't you forced to say a world of miserable people is no worse than a world of happy people, provided they are different people?"** | Impersonal Population Ethicists | **High.** Attacks the core theoretical intuition. If you lose this, you lose the "Hard" in Hard Person-Affecting. | **Strategy: Hold Firm.** "I deny 'worse' has moral weight without a subject. 'Worse' is a comparative adjective that requires a comparator. A world isn't a container of value; it's a collection of lives. If no one is worse off, nothing is worse. I accept the implication: creating miserable lives is not *wrong* if those lives are worth living and no one else is harmed. It is regrettable, but not wrongful." | **Soft Spot:** The "Regrettable but not Wrongful" distinction sounds like splitting hairs. **Concede:** "I concede this strains ordinary language, but ordinary language assumes same-people choices. We need new vocabulary for different-people choices." |
  | **3. "From a contractualist perspective: Couldn't existing people, who care about the future, reasonably reject a principle that permits depletion? The complaint isn't from P1, it's from us, who value the well-being of our successors."** | Contractualist Faculty | **Medium-High.** Threatens to bypass the NIP by grounding the complaint in *existing* agents' values. | **Strategy: Reframe.** "Reasonable rejectability requires a personal disadvantage. If my valuing P1's welfare doesn't make *me* worse off when P1 doesn't exist, I have no grounds for rejection. Altruistic preferences are satisfied or frustrated, but frustration of a preference about non-existent people isn't a *harm* to the preferrer in the relevant deontological sense." | **Soft Spot:** Denying that preference frustration counts as harm. **Concede:** "I concede that severe psychological distress from knowing depletion occurred counts as harm to us. But modest altruistic disappointment does not." |
  | **4. "Your Reservoir case assumes we know identities will differ. But chaos theory suggests small policy changes might not alter identities for generations. If P1 and P2 overlap significantly, your person-affecting restriction collapses into standard utilitarianism anyway."** | Grad Students / Climate Ethicists | **Medium.** An empirical attack on the metaphysical premise. | **Strategy: Hold Firm (Conditionally).** "My thesis is conditional: *If* the people are different, the reason vanishes. If empirical science shows identities persist, then we have same-person reasons to prefer conservation. I am arguing about the moral significance of identity, not the sociology of conception." | **Soft Spot:** Makes the theory empirically fragile. **Concede:** "I concede the view's application depends on empirical identity facts. But the *principle* remains: identity determines the type of reason." |
  | **5. "You say we have no reason to prefer P1 (80) over P2 (65). But suppose P2's lives are barely worth living (level 5). Do you really have no reason to prefer P1? If you draw a line anywhere, aren't you smuggling in impersonal value?"** | Impersonal Population Ethicists | **Medium.** The "Slippery Slope" to the Absurd. | **Strategy: Hold Firm.** "The line is 'worth living.' Below that, we harm the person by creating them (wrongful life). Above that, we benefit them by creating them. Whether they are at 5 or 80, they are benefited by existence relative to non-existence. The magnitude of benefit doesn't create a duty to maximize it across different persons." | **Soft Spot:** The intuition that 5 vs 80 *must* matter. **Concede:** "I concede this is counterintuitive. But intuitions are trained on same-people cases. We shouldn't trust them here." |
  | **6. "If impersonal loss gives no reason, why does it feel like we have a reason? You say we import same-people reasoning. But isn't it more likely you're ignoring a genuine impersonal reason that our intuition correctly tracks?"** | Grad Students / General Faculty | **Low-Medium.** Meta-ethical challenge about intuition reliability. | **Strategy: Reframe.** "It's not that the intuition is false, but that it is misapplied. We feel a reason because we instinctively model P1 and P2 as the *same* people at different times. Once we rigorously enforce the non-identity constraint, the 'loss' disappears. The feeling is a cognitive illusion of continuity." | **Soft Spot:** Calling deep moral intuitions "illusions" is arrogant. **Concede:** "I concede the intuition is robust. But robustness doesn't equal validity in non-identity contexts." |
  | **7. "You argue depletion is permissible to spare present people 'modest costs.' Who defines modest? If the cost is a 1% GDP loss, is that modest? If you leave 'modest' vague, your theory is action-guiding only in trivial cases."** | Climate Ethicists | **Low-Medium.** Practical vagueness objection. | **Strategy: Hold Firm.** "'Modest' is context-dependent, but the principle holds regardless of the threshold. Whether the cost is 1% or 10%, if it doesn't harm existing people's basic rights, the *future people's* lower welfare doesn't tip the scale. The vagueness of 'modest' doesn't invalidate the structural claim." | **Soft Spot:** Doesn't answer how to adjudicate the threshold. **Concede:** "I concede my theory doesn't solve the threshold problem, only the structural one. That is a separate project." |
  | **8. "If you bite the bullet on depletion, consistency demands you accept the 'Mere Addition Paradox' conclusions. Are you prepared to say that adding more lives at lower welfare is never worse, leading to a Repugnant Conclusion variant?"** | Impersonal Population Ethicists | **Low.** Technical consistency check. | **Strategy: Reframe.** "Not necessarily. The Person-Affecting Restriction blocks the Repugnant Conclusion because adding people doesn't harm anyone. The 'Repugnance' comes from impersonal aggregation. I reject the aggregation, so I avoid the conclusion. My view is actually a solution to the Repugnant Conclusion." | **Soft Spot:** Requires complex defense of how PA restriction blocks Repugnance. **Concede:** "I concede this requires a full axiology I haven't presented today, but the NIP defense is consistent with avoiding Repugnance." |
  | **9. "You claim P2 has no complaint. But if P2 knows their lower welfare was caused by a choice to save us money, won't they feel aggrieved? Doesn't the *relationship* between generations create duties independent of identity?"** | Climate Ethicists / Grad Students | **Low.** Relational/Expressive objection. | **Strategy: Hold Firm.** "Feelings of grievance are real, but moral wrongness requires a violated right or harm. P2 owes their existence to the choice. They cannot coherently claim they should have been better off *and* existed. The relationship is constitutive of their existence, not just causal." | **Soft Spot:** Dismissing relational duties. **Concede:** "I concede there may be expressive reasons to conserve, but not justice-based reasons grounded in P2's welfare." |
  | **10. [HOPE NOBODY ASKS] "Consider a Risky Policy: We choose depletion, which imposes a 1% chance of catastrophic harm on a specific future person. That person materializes and is harmed. They say: 'You risked me.' Does the NIP shield you here? If you say yes, you license gambling with lives. If you say no, you admit ex ante duties to possible people, collapsing your view."** | **Senior Population Ethicist** | **Catastrophic.** This is Parfit's "Risky Policy" objection. It breaks the Hard Person-Affecting view by focusing on *ex ante* risk to identifiable *slots* or *existing* risk-bearers. | **Strategy: Concede (Partial).** "This is the hardest case. I must distinguish *ex ante* harm to *existing* people (who fear for the future) vs. *ex post* harm to future people. I concede that imposing *risk* can be wrong if it violates existing people's security. But if the risk is only to the future person's welfare, and they still have a life worth living, the NIP holds. I accept this limits the view's application to high-risk scenarios." | **Soft Spot:** This concedes the most ground. **Concede:** "I concede that *risk* introduces same-person reasons for existing agents. This narrows the scope of permissible depletion significantly in the real world." |
