  Two homunculi are monitoring the central processor of a subject's mind.

  "Incoming token," says the first. "Predicate: 'EAT'. Argument: 'BERRY'."

  "Semantic value?" asks the second.

  "Highly toxic. Death imminent."

  "So we halt the motor function?"

  "I can't. Check the syntactic structure. There's a [SWEET] flavor tag attached to the predicate node."

  "But that's qualia! You can't put phenomenological quality in the logical form."

  "Doesn't matter. The engine is syntax-driven. It sees the tag, it triggers the 'yum' routine. The semantics are causally inert."

  "So the thought means 'poison', but the structure feels like 'candy'?"

  "Exactly. The computation is flawless. It's the survival that's buggy."

  ***

  **Note on Liberties Taken:**
  This joke relies on a fictional modification of Jerry Fodor's Language of Thought hypothesis. In standard LOT, mental representations do have both syntactic structure and semantic content, and cognitive processes are sensitive only to the syntax. However, Fodor never argued that syntactic markers include "flavor tags" that carry phenomenological quality (qualia). The joke exaggerates the separation between syntax and semantics by suggesting syntax can encode "feelings" that override semantic truth conditions, whereas real LOT maintains that semantics determines truth conditions while syntax drives the causal processing, without conflating the two into single markers.
