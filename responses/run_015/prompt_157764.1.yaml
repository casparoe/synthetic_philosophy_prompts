  ### Brainstorming: Mapping the Logical Space

  Before we draw the tree, we need to clear up the confusion in the room. You are right: your committee is treating one big disagreement as if it were a single argument about a word, but it is actually a stack of four or five different philosophical questions. If we don't separate them, you will talk past each other forever.

  Here is the logical map. The first question is the **Meta-Question**: Are we trying to find the *true* name for what happened (like a scientist naming a disease), or are we choosing a *tool* to get something done (like a lawyer choosing a charge)? This is the split between your auntie (who likely thinks there is a truth to be honored) and the dissenter (who thinks the word is a "political football"). If you disagree here, no amount of evidence about deaths or land will change minds, because you are playing different games.

  If you agree it is about **Truth (Moral Kind)**, the next split is **Harm**: Does the group have to die physically, or does killing their culture count? This sorts Case 1 (resettlement) and Case 5 (children). If you say only physical death counts, those cases are out. If you say cultural death counts, they are in.

  The third split is **Identity**: Who decides what the group is? The victims (who they say they are) or the perpetrators (who they *said* they were attacking)? This sorts Case 2 (the colonial census). If the killers attacked a group that no longer existed socially, did they commit genocide?

  The fourth split is **Motive**: Did they want the group gone for its own sake, or was destroying the group just the price of getting the land? This sorts Case 4 (land grab). Some people think genocide requires hatred; others think it includes cold calculation.

  The fifth split is **Mindset**: Did they have to *plan* to destroy the group, or is it enough that they *knew* their actions would destroy it? This sorts Case 6 (poisoning/neglect).

  The final splits are **Scale** (does one valley count?) and **Agency** (does a boss have to order it, or can a system do it?).

  Many of these questions constrain each other. For example, if you think the word is just a **Political Tool**, you might not care about **Specific Intent**—you only care if using the word helps your cause. But if you think it is a **Moral Truth**, you usually care deeply about **Intent**. Also, few people defend the view that "Perpetrators define the group" *and* "It is a Moral Truth," because that makes the truth depend on the liar's definition. That combination is likely empty.

  Below is the tree built from these distinctions. I have phrased the branches as plain questions your committee can answer.

  ***

  ### The Taxonomy Tree

  **Root Question:** Are we using the word "genocide" to name a moral truth about the past, or as a political tool to achieve something in the present?

  *   **Branch A (Political Tool):** Is the primary goal of using the word to secure justice/compensation, even if the definition is stretched?
      *   **Yes:** **Leaf 1: The Strategic Instrumentalist.** (Awkward commitment: You must admit you might call something genocide even if you privately think it doesn't fit, just to win.)
      *   **No:** **Leaf 2: The Prudent Skeptic.** (Awkward commitment: You must admit you might stay silent about a horror if using the word would cause more political trouble than it solves.)

  *   **Branch B (Moral Truth):** Does the group have to suffer physical biological destruction (death/birth prevention), or does ending their social/cultural existence count?
      *   **Yes (Physical Only):** **Branch B1:** Did the perpetrators define the group (e.g., using an old census), or did the victims define themselves?
          *   **Victims Define:** **Branch B1-i:** Was the destruction the ultimate goal, or just a means to get land/resources?
              *   **Goal:** **Leaf 3: The Strict Legalist.** (Awkward commitment: You must accept that a massacre done purely for profit without hatred might not count.)
              *   **Means:** **Leaf 4: The Materialist.** (Awkward commitment: You have to call a land-grab genocide even if the killers offered the group safe passage away.)
          *   **Perpetrators Define:** **Leaf 5: The Objectivist.** (Awkward commitment: You must accept that killers can create a group out of thin air just by targeting it.)
      *   **No (Cultural Counts):** **Branch B2:** Did the perpetrators have to specifically *want* the group destroyed, or is *knowing* it would happen enough?
          *   **Want (Specific Intent):** **Branch B2-i:** Does destroying a small part (one valley) count as destroying the group?
              *   **Yes (Local Counts):** **Leaf 6: The Community Defender.** (Awkward commitment: You must accept that destroying a single village can be genocide even if the wider nation survives.)
              *   **No (Substantial Only):** **Leaf 7: The Threshold Guardian.** (Awkward commitment: You have to tell a wiped-out valley they don't count because too many of their kin survived elsewhere.)
          *   **Know (Foreseeability):** **Branch B2-ii:** Does it require a coordinated plan by leaders, or can it emerge from laws/systems without a single boss?
              *   **Plan Required:** **Leaf 8: The Intentionalist.** (Awkward commitment: You must exclude cases where bureaucracy or negligence destroyed a group without a signed order.)
              *   **Structure Enough:** **Leaf 9: The Structuralist.** (Awkward commitment: You have to accept that "no one person did it" is not a defense if the system caused the destruction.)
              *   *(Note: I have added a 10th leaf below to capture a specific nuance often found in these debates)*
              *   **Leaf 10: The Humanitarian Universalist.** (Combines Cultural + Know + Structure + Perpetrator Define). (Awkward commitment: You must accept that a group can be genocided even if they didn't exist before the attackers named them.)

  ***

  ### Analysis of the Logical Space

  **Unoccupied Combinations**
  There are two combinations of answers that are logically possible but practically empty (nobody seriously lives there):
  1.  **Moral Truth + Perpetrator Defines Group:** Very few people argue that "genocide" is an objective moral truth *and* that the killer gets to decide who the victim group was. If the word names a truth, relying on the liar's definition makes the truth unstable. This leaves **Leaf 5** and **Leaf 10** somewhat isolated; most people who care about truth insist the victims must define themselves.
  2.  **Political Tool + Strict Physical Intent:** It is rare to find someone who admits the word is just a political tool but *still* insists on strict physical definitions. Usually, if you view the word as a tool, you want to broaden the definition to cover more injustices (Instrumentalists usually want *more* coverage, not less). This makes the space between **Leaf 1** and **Leaf 3** mostly empty.

  **Indistinguishable Leaves**
  I must flag that **Leaf 3 (Strict Legalist)** and **Leaf 4 (The Materialist)** are often indistinguishable in practice. In real cases, it is very hard to prove whether killers wanted the group dead for hatred's sake or just for land. Most committees end up treating them the same way because the evidence looks identical (mass death). Similarly, **Leaf 8 (Intentionalist)** and **Leaf 9 (Structuralist)** blur when a "plan" is inferred from the "structure."

