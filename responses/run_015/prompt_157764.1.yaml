  ### Walkthrough: Your Auntie vs. The Dissenter

  Let's walk your two main opponents down the tree to see where the real disagreement lies. This will tell you how to run the next meeting.

  **Member 1: Your Auntie (Insists on the word "genocide")**
  *   **Meta:** She insists on the word because she believes it is the *truth* of what happened, not just a lever for politics. -> **Branch B (Moral Truth)**.
  *   **Harm:** Her family was scattered, the language died, the village erased. She knows people survived physically, but the community died. -> **No (Cultural Counts)**.
  *   **Mindset:** She likely believes the authorities *knew* scattering everyone would kill the culture, even if they didn't issue a death warrant. -> **Know (Foreseeability)**.
  *   **Agency:** She sees the scattering as a policy/system, not necessarily one man's order. -> **Structure Enough**.
  *   **Landing:** **Leaf 9: The Structuralist.**

  **Member 2: The Dissenter (Thinks the word is a distraction/football)**
  *   **Meta:** He calls it a "political football." This suggests he sees the word as a *tool* used for leverage, not necessarily a fixed truth. -> **Branch A (Political Tool)**.
  *   **Utility:** He says "inflating it helps nobody" and "just describe what happened." He thinks using the word causes more fights than justice. -> **No (Prudent Skeptic)**.
  *   **Landing:** **Leaf 2: The Prudent Skeptic.**

  **The Divergence**
  They differ on the **very first branch (The Meta-Question)**.
  *   Your Auntie thinks we are doing **Philosophy/History** (naming a truth).
  *   The Dissenter thinks we are doing **Politics/Strategy** (weighing consequences).

  **How to run the meeting:**
  You cannot resolve this by showing more evidence of suffering. If you show evidence of cultural death, Auntie says "See? Truth!" and Dissenter says "I know it was bad, but will the word *help*?"
  *   **Strategy:** You must move the conversation to the **Political Tool** branch temporarily. Ask the Dissenter: "If we *were* to agree this is a moral truth (Branch B), would you still oppose the word?"
      *   If he says "Yes, because it causes trouble," you know it's purely strategic. You can negotiate on strategy (e.g., "Will a different word cause less trouble but get the same result?").
      *   If he says "No, because it still doesn't fit the law," then he is actually a **Leaf 3 (Strict Legalist)** hiding behind political arguments. In that case, you debate the **Harm** branch (Physical vs. Cultural).

  **Best Case Scenario:**
  If you can convince the Dissenter to agree to the **Moral Truth** branch for the sake of the memorial (since memorials are about truth, not politics), you then only differ on the **Harm** branch (Physical vs. Cultural). That is a much smaller gap to bridge than "Truth vs. Politics." If you can get them to agree that "Cultural destruction counts as destruction," you win the vote.
