      *   *Strategy:* Anchor *naya* in *methodology* (model parameters, initial conditions), not "truth." A model isn't "true" in isolation; it's valid relative to its constraints. This allows rejecting models that violate physical laws (ontological constraints) while accepting uncertainty in projections.
