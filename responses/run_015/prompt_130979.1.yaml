      *   *Reply:* Distinguish *prediction* from *mechanism*. Both capture valid physical processes (clouds vs. ocean heat uptake). Neither is "false" regarding the physics they include, but neither is "absolute." We reject models that violate conservation of energy (absolute falsification), but keep the ensemble for uncertainty.
