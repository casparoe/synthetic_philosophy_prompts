answer: |-
  **Brainstorming**

  Right, let's look at the machinery of this stalemate. You've got a classic is-ought gridlock, but it's been weaponised on both sides. The philosophers are wielding the autonomy of reasons: 'Just because you feel loyalty doesn't make loyalty right.' The psychologists are wielding the ubiquity of intuition: 'Just because you claim reasons doesn't mean you aren't running on care-based firmware.' It's a mutual assured destruction scenario. But the interesting bit you mentioned is the survey manipulation. If stripping the harm framing makes the political split disappear or get noisy, that suggests the 'foundations' aren't stable latent traits. It suggests 'fairness' for a liberal might just be 'harm' in a suit. If the constructs aren't psychometrically distinct, the whole normative comparison collapses. You can't say conservatives are 'broader' if the ruler you're using is elastic.

  Then there's the teleological worry. What is morality *for*? If the psychologists define it functionally (social cohesion, binding groups), then loyalty and authority are obviously 'moral'. If the philosophers define it normatively (justification of action to others, welfare), then loyalty and authority look like potential biases. The impasse isn't just about whether facts imply values; it's about whether the descriptive taxonomy *presupposes* a normative theory. Haidt's model smuggles in a functionalist definition of morality. The liberals are working with a prescriptive definition. They aren't disagreeing about the data; they're disagreeing about what the data is data *of*.

  And your hypothesis about the symmetrical debunking? It's elegant, but it assumes the foundations are robust enough to serve as the 'tools' of debunking. If the survey data gets noisy when you tweak the wording, maybe there aren't five tools. Maybe there's just one (harm/welfare) and a bunch of post-hoc rationalisations that correlate with tribal identity. If that's the case, the philosophers aren't sawing off the branch they're sitting on; they're pointing out the branch is rot. But the psychologists can't hear that because their model treats the rationalisations as the primary reality.

  ***

  **The Diagnosis: Teleological Equivocation and Psychometric Conflation**

  Here is where I think the impasse actually lies. It is not, as you suggest, a third-order dispute about the metaphysical status of foundations (modules vs. schemas), nor is it merely a symmetrical standoff of debunking arguments. It is a **teleological equivocation** compounded by **psychometric conflation**.

  The two sides are using the word 'morality' to pick out two fundamentally different phenomena, and the Moral Foundations Theory (MFT) framework encourages this confusion by presenting a descriptive taxonomy as if it were a neutral map of normative terrain.

  On the one hand, your psychologists are operating with a *sociological-functional* definition of morality. On this view, morality is whatever set of norms and intuitions serves to bind a group, regulate behaviour, and sustain social order. If loyalty and authority bind the group, they are, by definition, moral foundations. The 'width' of the moral matrix is a measure of functional capacity.

  On the other hand, your philosophers are operating with a *justificatory-normative* definition. Morality is the system of reasons we offer to justify our actions to others, typically grounded in welfare, rights, or fairness. On this view, 'binding the group' is not a moral goal in itself; it is only moral if the binding is just. Hence, loyalty and authority are suspect until proven otherwise.

  The impasse arises because MFT allows the psychologists to say, 'Look, conservatives use more moral tools,' while the philosophers hear, 'Conservatives have more moral reasons.' But the psychologists have only shown that conservatives utilise more *social-regulatory mechanisms*. They have not shown that these mechanisms track *normative truth*. Conversely, when philosophers say, 'Liberals are more rational,' psychologists hear, 'Liberals are using a different subset of foundations,' which they then debunk as merely another intuition.

  This is where your survey manipulation finding becomes critical. If removing harm-framing makes the liberal/conservative split noisy, it strongly suggests that for liberals, 'fairness' and 'care' are not distinct psychological constructs but are conceptually fused. For conservatives, they may be distinct. This means the 'five foundations' are not universal latent traits. They are, in part, artefacts of how specific political subcultures articulate their intuitions. You cannot use a taxonomy that is partially endogenous to one group to measure the superiority of that group. It is a category error to treat the *prevalence* of an intuition as evidence of its *validity*, especially when the taxonomy itself is derived from the pool of intuitions you are trying to judge.

  **Critique of Your Hypothesis**

  I must be blunt: your hypothesis is too charitable to the psychological framework, and consequently, it misidentifies the locus of the error.

  You suggest the dispute is a 'third-order one about what sort of thing a foundation is meant to be'. I believe this is a red herring. It does not matter whether a foundation is an innate module, a learned schema, or a grammatical rule. Even if we settled that tomorrow—say, by fMRI evidence showing distinct neural correlates for 'sanctity'—the normative gap would remain untouched. Knowing the causal etiology of a judgment does not tell us if the judgment is correct, nor does knowing the modularity tell us if the module is truth-tracking.

  Your diagnosis of a 'standoff between two debunking arguments' is structurally accurate but substantively shallow. It assumes both sides are playing the same game with different moves. They are not. The philosophers are playing a justificatory game (what ought I to do?); the psychologists are playing an explanatory game (why do I feel I ought to do this?). The 'standoff' feels symmetrical only because the MFT framework invites philosophers to treat psychological explanations as if they were normative competitors.

  The real muddle in your framing is the idea that this is a dispute about *foundations*. It is a dispute about the *domain of the moral*. By accepting the term 'moral foundations', your reading group has already conceded that loyalty and sanctity are candidates for moral truth in the same way that harm and fairness are. But that is precisely the normative question at issue. If 'sanctity' is merely a disgust response co-opted for social signalling, calling it a 'moral foundation' begs the question against the philosopher who sees it as a bias. The impasse persists because you are trying to solve a normative problem with a descriptive taxonomy that has already baked in a functionalist normative assumption.

  **What Would Count as Progress?**

  Given this diagnosis, expecting a 'result that would settle it' in the current framework is futile. You will not find a p-value that tells you whether loyalty is a virtue. Progress requires dismantling the current question rather than answering it.

  1.  **Abandon the 'Width' Metric:** You must stop treating the number of foundations endorsed as a measure of moral adequacy. 'Broader' is not 'better'. A moral system that validates slavery might be 'broad' (appealing to loyalty, authority, and sanctity), but it is not therefore superior to a narrower one based on harm. The group needs to explicitly decouple descriptive breadth from normative weight.

  2.  **Domain-Specific Epistemology:** Instead of asking 'Is this a foundation?', ask 'Under what conditions does this sensitivity track a genuine value?' Treat each foundation as a separate epistemological problem. For Care/Harm, the link to suffering is relatively clear. For Authority, the link to legitimate coordination needs to be argued for, not assumed. For Sanctity, the link to dignity or bodily integrity needs to be established without relying on disgust. This moves the discussion from 'who has more' to 'which ones are truth-tracking and when'.

  3.  **Reframe the Empirical Question:** The psychologists need to stop looking for political differences in foundation *scores* and start looking for differences in foundation *application*. The noisy survey result you mentioned suggests the constructs are unstable. The empirical work should focus on whether 'loyalty' triggers the same cognitive processes in a liberal (e.g., loyalty to a union) as in a conservative (loyalty to a nation). If the psychological mechanism is the same but the object differs, the political asymmetry is superficial. If the mechanism differs, the 'foundation' is not a unified construct.

  4.  **Accept Incommensurability:** Finally, you may need to accept that there is no neutral ground. The functionalist definition of morality and the justificatory definition are rival concepts. Progress might look like a clear agreement to disagree on the definition, acknowledging that MFT describes *moralities* (plural, sociological phenomena) while philosophy seeks *Morality* (singular, normative standard). Once you admit the psychologists are studying the former and the philosophers the latter, the demand for the data to answer the normative question dissolves.

  In short, you are stuck because you are trying to weigh normative reasons on a sociological scale. The scale is not broken; it is just designed for a different substance. Put the reasons back on the philosophical balance, and use the scale only to measure how heavy the intuitions feel to the people holding them.
