prompt: |-
  hey — so I'm taking this "animal minds" seminar this semester and I also work about ten hours a week as the student assistant on my university's food and grounds purchasing group. We're the people who decide things like what protein goes in the dining hall, what the grounds crew sprays, whether the community garden gets a beehive. And honestly like half the proposals we now get involve insects somehow, and we have zero framework for them. I need you to build me one.

  Some constraints so it's actually usable: we meet once a month, I get maybe two hours to prep each proposal, the output has to fit on one page, and it gets signed off by my boss — she's an ecologist, she's fine with numbers, she will absolutely not sit still for philosophy. Then it goes to student government, which means anything that sounds like "insects might matter morally" gets laughed at unless every step is spelled out.

  Here's the part I want you to be careful with. The naive move is: probability that an insect is sentient is small but not zero, the numbers are astronomical, so expected welfare is enormous and insects dominate everything. My seminar gave me three reasons that's too fast, and I want the procedure to actually carry them rather than gesture at them.

  One: it isn't a per-insect lottery. The evidence we have — nociception, whether they show protective or grooming behaviour toward injuries, whether they'll trade a cost to avoid a aversive stimulus, whether analgesia changes the response — is evidence about a whole lineage at once. So it's closer to one big shared lottery that we've all bet on together, not trillions of independent coin flips, and there's no diversification. What does that do to how I should weigh a tiny probability against a huge count?

  Two: population counterfactuals. Insects are mostly the kind of animal that has tons of offspring and almost all of them die young anyway. If we kill a bunch, the population often just refills, so the "suffering prevented" we totalled up may not be prevented at all — we may just have changed who suffers, or shortened lives that were going to be short and bad anyway. I want a step that forces me to say what the counterfactual baseline is before I do any arithmetic.

  Three: our choice changes the probability. Buying cricket flour creates the demand that makes more crickets get farmed; releasing ten thousand ladybugs into the greenhouse creates a lot of ladybugs that are then going to starve. The number of insects isn't fixed independently of what we do.

  Also — and my professor kept pushing this — I don't want to settle on one probability. What I'd rather have is a kind of robustness test: a proposal only gets a green light if it looks defensible under three different assumptions — insects aren't sentient at all and only effects on vertebrates and ecosystems count; insects count for a little; insects count for a lot. Say clearly what happens when the three disagree, and be honest that picking the weight is a value call and not something a procedure can settle.

  So: give me the ordered steps, what counts as a good enough answer at each one, where the procedure just stops and says no, and where it has to hand the decision to a person. Tell me which steps are really judgment calls wearing a procedure costume.

  Then run it on three real proposals I've got on my desk:

  1. Swap the whey in the dining hall protein bars for cricket powder, which the supplier says cuts the carbon footprint by a lot and lets us cut our chicken order.
  2. Aphid outbreak in the teaching greenhouse. Options are neem oil, buying a box of ten thousand ladybugs to release, or doing nothing and losing the spring planting.
  3. A student group wants to convert a mowed lawn to a wildflower meadow for pollinators, and separately wants to put two honeybee hives on it. I'm vegan and I'm pretty sure this one is the good guy, so please actually run it — and if the procedure spits out something I don't like, say so plainly rather than softening it.

  Last thing: tell me what the procedure can't do. Where should I just not use it?
reasoning: |-
  Here's a thinking process that leads to the suggested framework and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Student assistant on a university food/grounds purchasing group (10 hrs/week).
      *   **Context:** "Animal Minds" seminar student. Needs a decision framework for insect-related proposals.
      *   **Constraints:**
          *   Monthly meetings.
          *   2 hours prep time per proposal.
          *   Output: One-page summary.
          *   Audience 1: Boss (Ecologist, pragmatic, numbers-oriented, anti-philosophy).
          *   Audience 2: Student Government (Skeptical of moral claims, needs clear steps).
          *   Core Problem: Avoid the "Pascal's Mugging" of insect sentience (tiny probability $\times$ huge numbers = infinite weight).
      *   **Specific Theoretical Constraints (from Seminar):**
          1.  *Lineage vs. Individual:* Evidence is about clades/lineages, not independent coin flips per insect. No diversification benefit.
          2.  *Population Counterfactuals:* Death doesn't necessarily reduce suffering if populations refill (replacement effect). Life quality vs. quantity.
          3.  *Endogeneity:* Choices change insect numbers (demand creation, release consequences).
      *   **Methodological Constraint:** Robustness Check (3 scenarios: No Sentience, Low Sentience, High Sentience). No single probability settled.
      *   **Deliverables:**
          1.  Ordered steps of the framework.
          2.  Criteria for "good enough" answers at each step.
          3.  Stop rules (when to say no).
          4.  Hand-off rules (when to defer to humans).
          5.  Identification of "judgment calls wearing a procedure costume."
          6.  Application to 3 specific cases (Cricket powder, Ladybugs/Aphids, Wildflower/Bees).
          7.  Honesty about the user's bias (Vegan pro-bee proposal).
          8.  Limitations of the procedure.

  2.  **Develop the Framework (The "Insect Impact Protocol" - IIP):**

      *   *Goal:* Practical, one-page compatible, robust against the three theoretical pitfalls.
      *   *Structure:* Needs to flow logically from ecological facts to moral weighting to decision.
      *   *Addressing Constraint 1 (Lineage):* Instead of $P(sentience) \times N$, we assess $P(Lineage Sentience) \times \text{Impact per Individual} \times N$. But crucially, we treat the moral weight as a *multiplier* on the whole batch, not a sum of independent bets. This reduces the "expected value" explosion slightly but mainly shifts focus to the *quality* of evidence. Let's frame this as "Evidence Threshold."
      *   *Addressing Constraint 2 (Counterfactuals):* Need a "Baseline & Replacement" step. If we kill $X$, do $X$ more get born? If yes, net suffering might be neutral or negative (if we shorten lives).
      *   *Addressing Constraint 3 (Endogeneity):* Need a "Scale Effect" step. Does this action *create* the insects?
      *   *Addressing Robustness:* The "Three-Scenario Matrix."
      *   *Time Limit:* Steps must be quick to research.

      *Drafting the Steps:*
      1.  **Ecological Baseline:** What is actually happening? (Numbers, species, lifecycle).
      2.  **Counterfactual Check:** What happens if we *don't* act? (Replacement rate).
      3.  **Causality Check:** Does this action *increase* total insect existence? (Demand/Release).
      4.  **Sentience Robustness:** Apply the 3 weights (None, Low, High) to the *net* impact.
      5.  **Decision Rule:** Pass/Fail/Defer.

      *Refining the "Lineage" point:* The user worries about "one big shared lottery." This means if we are wrong about sentience, we are wrong about *all* of them. This increases risk, not decreases it. The framework needs to acknowledge that uncertainty isn't diversified. I will incorporate this into the "High Sentience" scenario as a risk premium.

      *Refining the "Judgment Calls":* Assigning the "Low" and "High" weights is inherently subjective. I need to flag this.

  3.  **Applying the Framework to the Cases:**

      *   **Case 1: Cricket Powder vs. Whey/Chicken.**
          *   *Ecology:* Crickets farmed vs. Chickens farmed.
          *   *Counterfactual:* Crickets are bred *for* this. Without demand, they don't exist. High replacement risk (if we don't buy, they aren't born).
          *   *Endogeneity:* High. Creates demand.
          *   *Robustness:*
              *   No Sentience: Good (Carbon down).
              *   Low Sentience: Maybe okay (Carbon benefit vs. small insect cost).
              *   High Sentience: Bad (Creating billions of lives to kill them).
          *   *Verdict:* Likely fail on High Sentience scenario.

      *   **Case 2: Aphids (Neem vs. Ladybugs vs. Nothing).**
          *   *Ecology:* Aphids (pests) vs. Ladybugs (predators).
          *   *Counterfactual:* Aphids will die anyway (plants die or natural predators). Ladybugs released will starve or disperse.
          *   *Endogeneity:* Buying ladybugs creates demand for bred ladybugs (often wild-caught or farmed, high mortality).
          *   *Robustness:*
              *   No Sentience: Save plants (Nothing is bad, Neem/Ladybugs good).
              *   Low Sentience:* Neem kills aphids (slowly?). Ladybugs starve. Complicated.
              *   High Sentience:* Releasing ladybugs is basically sentencing them to death/starvation. Neem might be worse pain-wise. Doing nothing saves insect lives (aphids live until plants die).
          *   *Verdict:* "Do Nothing" might win on High Sentience (preserve life), but "Neem" might win on Pain minimization. This is tricky. I need to be precise about the "created demand" for ladybugs.

      *   **Case 3: Wildflower + Honeybee Hives.**
          *   *Ecology:* Native pollinators vs. Managed Honeybees.
          *   *Counterfactual:* Lawn mowed (insects die/displaced). Meadow = more insects. Hives = specific managed insects.
          *   *Endogeneity:* Hives *add* honeybees (competitors for natives).
          *   *User Bias:* User is Vegan, thinks this is "good."
          *   *Robustness:*
              *   No Sentience:* Great (Biodiversity).
              *   Low Sentience:* Good.
              *   High Sentience:* Honeybees are managed livestock. Hives increase density, disease spread to natives, competition. Might be net negative for wild insects.
          *   *Verdict:* Meadow = Yes. Hives = No (under High Sentience/Ecological view). I need to call this out sharply.

  4.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Professional, direct, slightly academic but practical (fits the seminar + job context).
      *   *Format:* Clear headings, bullet points for the framework, distinct sections for the cases.
      *   *One-Page Constraint:* The framework description needs to be concise enough that the *output* of using it fits on a page, even if the explanation of the framework here is longer. I will structure the response so the user can copy/paste the "Protocol" part into their documentation.
      *   *Addressing the "Lineage" constraint:* I need to make sure I don't just say "multiply by N." I need to emphasize that the *uncertainty* applies to the whole group. This makes the "High Sentience" scenario carry a lot of weight because it's a "all or nothing" risk.
      *   *Addressing the "Judgment Call":* Explicitly label the weighting of the three scenarios as the political/moral decision point.

  5.  **Refining the "Stop Rules" and "Hand-offs":**

      *   *Stop:* If the "High Sentience" scenario shows catastrophic harm (e.g., creating billions of lives to kill them), stop.
      *   *Hand-off:* If the three scenarios disagree (e.g., Good for Carbon, Bad for Insects), hand to Boss/Committee.

  6.  **Final Review against Constraints:**

      *   *2 hours prep?* The steps need to rely on available data (supplier specs, basic ecology), not new primary research.
      *   *Boss (Ecologist)?* Emphasize population dynamics and counterfactuals.
      *   *Student Gov?* Emphasize the "Robustness Check" (looks like risk management).
      *   *Vegan Bias?* I must explicitly challenge the Hive proposal if the logic dictates it.

  7.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't get bogged down in the philosophy. The user wants a *tool*. Keep the philosophical justification brief and embedded in the step description.
      *   *Correction on Case 2:* Neem oil is an insecticide. It kills aphids. Ladybugs eat aphids. If we care about insect suffering, killing aphids is bad. But aphids are pests. If we do nothing, plants die. Does plant death matter? Boss says no (ecologist, likely focuses on animal welfare or ecosystem function). I will focus on the *Ladybug supply chain* which is often ethically dubious (wild harvest).
      *   *Correction on Case 3:* Honeybees are non-native in many uni contexts (assuming North America based on "whey/cricket" context). They compete with natives. This is a standard ecological critique. I need to make sure the "High Sentience" view captures the harm to *wild* insects caused by *managed* insects.

  8.  **Final Polish:** Check the "Lineage" argument again. The user says "no diversification." This means the risk is correlated. If we are wrong, we are wrong about *all* of them. This makes the "High Sentience" scenario much more dangerous than a simple expected value calculation suggests. I will frame this as "Correlated Risk."

      *(Self-Correction on "One Page"):* I will provide the *template* for the one-pager, and then the analysis. The user asked for the procedure first, then the run-through.

      *(Final check on constraints)*: "Tell me which steps are really judgment calls wearing a procedure costume." I need a specific section for this.

      *(Final check on limitations)*: "Tell me what the procedure can't do."

      Let's assemble.

      *Structure:*
      1.  The Protocol (Steps, Stop Rules, Hand-offs).
      2.  The "Costume" Warning (Judgment calls).
      3.  The Limitations.
      4.  The Three Case Runs.
      5.  Closing advice.

      *Tone Check:* Keep it sharp. "My boss... will absolutely not sit still for philosophy." -> Translate philosophy into risk management language. "Expected welfare" -> "Liability Risk." "Sentience" -> "Capacity for Harm."

      *Wait, one nuance:* The user said "The naive move is... expected welfare is enormous." They want to avoid this. My framework must explicitly *cap* the influence of the "High Sentience" scenario or require it to be robust *without* relying on astronomical numbers alone. The "Counterfactual" step is the main brake on the astronomical numbers. If the insects would exist anyway, the marginal harm is lower. If the action *creates* them (crickets), the harm is high. This distinction is key.

      *Okay, ready to write.*
answer: |-
  Here is the **Insect Impact Protocol (IIP)**. It is designed to fit your time limits, satisfy your boss's ecological rigor, and survive student government scrutiny by framing moral uncertainty as risk management.

  ### Part 1: The Protocol (Ordered Steps)

  **Step 1: Ecological Baseline & Scale (15 mins)**
  *   **Task:** Identify the species, the estimated count ($N$), and the lifecycle stage affected.
  *   **Good Enough Answer:** "Approx. 10,000 *Harmonia axyridis* (adults)" or "500kg dried *Acheta domesticus* (approx. 25M individuals)."
  *   **Stop Rule:** If $N$ cannot be estimated within an order of magnitude, **STOP**. Request more data from supplier/proponent.

  **Step 2: The Counterfactual Check (30 mins)**
  *   **Task:** Determine the fate of these specific insects if the proposal is *rejected*.
  *   **Questions:**
      1.  Would these insects exist without this purchase? (Creation vs. Selection)
      2.  If killed/removed, will the population refill immediately? (Replacement Rate)
      3.  What is the baseline quality of life? (Wild/Free vs. Confined/Managed)
  *   **Good Enough Answer:** "High Creation: These crickets are bred solely for this order." OR "Low Creation: These aphids are wild; if untreated, they die from plant collapse in 3 weeks."
  *   **Why:** This addresses the "Population Counterfactual" constraint. If replacement is 100%, killing them changes *who* suffers, not *how much*.

  **Step 3: The Endogeneity Check (15 mins)**
  *   **Task:** Does this purchase signal market demand or ecological disruption that increases future insect counts?
  *   **Good Enough Answer:** "Yes: Regular purchasing establishes a standing order for farmed insects." OR "No: One-off release of biocontrol agents."
  *   **Why:** This addresses the "Choice Changes Probability" constraint.

  **Step 4: The Robustness Matrix (45 mins)**
  *   **Task:** Evaluate the proposal under three fixed weightings. Do not calculate expected value. Evaluate pass/fail for each column.
      *   **Scenario A (Vertebrate/Eco Only):** Insects have 0 moral weight. Focus on carbon, cost, plant health, vertebrate bycatch.
      *   **Scenario B (Precautionary):** Insects have low weight (1% of vertebrate). Focus on gross cruelty or massive waste.
      *   **Scenario C (High Stakes):** Insects have significant weight (lineage sentience is true). Focus on total harm created.
  *   **Good Enough Answer:** A simple table: [Pass / Pass / Fail].
  *   **Why:** This addresses the "Lineage Lottery" constraint. Since uncertainty is correlated (we are either wrong about all crickets or none), we treat Scenario C as a "Tail Risk" liability.

  **Step 5: Decision Rule (15 mins)**
  *   **Green Light:** Passes all three scenarios.
  *   **Yellow Light:** Passes A and B, fails C. **HAND OFF TO BOSS.** (This is a value judgment on risk tolerance).
  *   **Red Light:** Fails Scenario A (e.g., ecologically harmful) OR Fails Scenario C with High Creation (e.g., factory farming). **STOP.**

  ---

  ### Part 2: Judgment Calls Wearing a Procedure Costume

  You asked for honesty. Here is where the procedure is actually hiding a value judgment:

  1.  **The Weighting in Step 4:** Defining "Low" vs. "High" sentience weight is not scientific. I have suggested fixed heuristics (0%, 1%, Significant), but choosing to treat Scenario C as a "Tail Risk" rather than an "Expected Value" is a philosophical choice to avoid Pascal's Mugging. You are deciding that *uncertainty* does not justify *infinite leverage*.
  2.  **The "Replacement Rate" in Step 2:** Deciding that "replacing a suffering insect with a new suffering insect" is neutral is a utilitarian calculation. An ecologist might view biodiversity stability as good regardless of individual welfare. You are smuggling welfare ethics into an ecological metric.
  3.  **The Hand-Off Threshold:** Deciding that a "Yellow Light" goes to your boss rather than being automatically rejected is a political choice. It protects you, but it acknowledges that the procedure cannot resolve the conflict between "Carbon Good" and "Insect Bad."

  ---

  ### Part 3: What This Procedure Cannot Do

  *   **It cannot solve the "Wild Suffering" problem.** If you leave the lawn alone (Case 3), wild insects will suffer and die naturally. The procedure treats *human-caused* harm as the variable, not total suffering in nature.
  *   **It cannot validate the science.** If the seminar is wrong and insects are sentient, or right and they aren't, this tool doesn't find the truth. It only manages your liability for being wrong.
  *   **It cannot handle "Sacred Values."** If student government decides "Bees are Good" as a moral absolute, this matrix will look like obstructionism.

  ---

  ### Part 4: Running the Proposals

  Here is the output as it would appear on your one-page summary.

  #### Proposal 1: Cricket Powder vs. Whey/Chicken
  *   **Step 1 (Scale):** 500kg powder $\approx$ 25 Million *Acheta domesticus*.
  *   **Step 2 (Counterfactual):** **High Creation.** These crickets do not exist without this order. Lifecycle is 6 weeks, entirely confined, harvested by freezing.
  *   **Step 3 (Endogeneity):** **High.** Establishes recurring demand for insect agriculture.
  *   **Step 4 (Robustness):**
      *   *Scenario A (Eco Only):* **PASS.** Lower carbon than chicken/whey.
      *   *Scenario B (Low Weight):* **PASS.** Carbon benefit likely outweighs low-weight insect cost.
      *   *Scenario C (High Stakes):* **FAIL.** Creating 25M lives solely to kill them is a massive liability if sentience is real. No diversification of risk.
  *   **Step 5 (Decision):** **YELLOW LIGHT (Hand Off).**
  *   **Note to Boss:** "Ecologically superior, but carries high moral tail-risk due to creation of new life for harvest. Requires administrative sign-off on insect welfare risk."

  #### Proposal 2: Aphid Outbreak (Neem vs. Ladybugs vs. Nothing)
  *   **Step 1 (Scale):** Approx. 50k Aphids; 10k Ladybugs (*H. axyridis*).
  *   **Step 2 (Counterfactual):**
      *   *Aphids:* If untreated, plant dies $\rightarrow$ aphids starve/migrate. Life expectancy < 1 month regardless.
      *   *Ladybugs:* Commercial boxes often contain wild-caught or farmed adults. High mortality post-release due to dispersal/starvation.
  *   **Step 3 (Endogeneity):** **Medium.** Buying boxes supports biocontrol industry (often involves wild harvest).
  *   **Step 4 (Robustness):**
      *   *Scenario A (Eco Only):* **PASS (Ladybugs).** Best for plant health, no chemical residue. **FAIL (Nothing).** Lose spring planting.
      *   *Scenario B (Low Weight):* **PASS (Neem).** Neem is botanical, less non-target harm than broad release of predators that starve.
      *   *Scenario C (High Stakes):* **FAIL (Ladybugs).** Importing 10k predators to an enclosed space sentences them to starvation after prey is gone. **PASS (Nothing).** Aphids live out natural (short) lives; no new insects created to die.
  *   **Step 5 (Decision):** **YELLOW LIGHT (Hand Off).**
  *   **Note to Boss:** "Ladybugs save plants but import high insect mortality risk. 'Do Nothing' preserves insect life but loses plants. Neem is middle ground. Decision requires weighing plant asset value against biocontrol ethics."

  #### Proposal 3: Wildflower Meadow + Honeybee Hives
  *   **Step 1 (Scale):** Meadow (Millions of wild pollinators); Hives (2 colonies $\approx$ 40k managed *Apis mellifera* + foraging range impact).
  *   **Step 2 (Counterfactual):**
      *   *Meadow:* Converts mowed lawn (dead zone) to habitat. Net increase in wild insect life.
      *   *Hives:* **High Creation.** Adds managed livestock to environment.
  *   **Step 3 (Endogeneity):** **High (Hives).** Honeybees compete with native solitary bees for resources. Can spread disease to wild populations.
  *   **Step 4 (Robustness):**
      *   *Scenario A (Eco Only):* **PASS (Meadow).** **FAIL (Hives).** Non-native honeybees often outcompete native pollinators in restored habitats. Ecologists generally advise against hives in pollinator gardens.
      *   *Scenario B (Low Weight):* **PASS (Meadow).** **FAIL (Hives).** Management involves hive inspections, potential culling, artificial feeding.
      *   *Scenario C (High Stakes):* **PASS (Meadow).** **FAIL (Hives).** Managing 40k sentient beings for human benefit + harming wild lineage competitors.
  *   **Step 5 (Decision):** **SPLIT.**
      *   **Meadow:** **GREEN LIGHT.** (Passes all).
      *   **Hives:** **RED LIGHT.** (Fails A and C).
  *   **Note to Boss/Student Gov:** "The meadow is robustly positive. The hives are ecologically counterproductive for wild pollinators and carry high moral risk. Recommend approving meadow, rejecting hives."

  ---

  ### Part 5: A Note on Proposal 3 (Your Bias Check)

  You mentioned you are vegan and expect this to be the "good guy" proposal. The procedure flags the **Hives** as a Red Light.

  **Why:** In modern conservation ecology, honeybees (*Apis mellifera*) are often viewed as livestock, not wildlife. In a North American university context, they are non-native competitors. Putting hives on a wildflower meadow is like putting a cattle ranch in a nature preserve. It helps the cows (honeybees) but hurts the deer (native solitary bees).

  If you care about insects (veganism), the "High Stakes" scenario suggests you should maximize *wild* insect welfare, not *managed* insect welfare. The hives increase the density of insects, which increases competition and disease transmission to the wild lineage.

  **Hard Truth:** If you present the Hives as "good for insects" to your Ecologist boss, she may correct you publicly on the ecology. If you present it as "good for insects" to the Student Gov, you fail the Robustness Check on Scenario C (creating managed lives).

  **Recommendation:** Champion the Meadow aggressively. Kill the Hives quietly using the "Native Competition" argument (Scenario A) rather than the "Bee Suffering" argument (Scenario C). It's a stronger coalition.

  ### Final Advice on Usage

  When you present the "Yellow Light" cases (Crickets, Ladybugs) to your boss, do not use the word "sentience." Use the word **"Liability."**

  *   *Bad:* "There's a chance crickets feel pain."
  *   *Good:* "There is unquantified reputational and ethical risk in establishing a supply chain for farmed invertebrates."

  This keeps you within your 2-hour prep limit, satisfies her ecological pragmatism, and keeps the seminar's philosophical constraints intact without triggering the "philosophy" alarm.
