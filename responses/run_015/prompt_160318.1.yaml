answer: |-
  Here is a menu of six distinct claims your partner's proverb could be making, ordered from trivial to radical. Each includes the specific verdicts you requested and addresses the complications you raised. You can read this directly to your partner or use it to cross-examine them.

  ### 1. The Pragmatic Necessity Claim
  **The Claim:** "American companies cannot physically operate in this region without making these payments; therefore, they should not be punished for doing what is required to function."
  *   **Verdict:** **Platitude.** It is descriptively true that systems can be rigged to require payments.
  *   **Does it win?** **No.** This proves *coercion*, not *corruption's absence*. It explains why the act happens, but it does not prove the act is morally permissible or that US law should yield. It justifies the action as self-defense, not as culturally valid.

  ### 2. The Legal Sovereignty Claim
  **The Claim:** "US law has no jurisdiction on foreign soil; only the host country's statutes define what is legal."
  *   **Verdict:** **Substantive but Arguable.** This is a standard argument about national sovereignty versus extraterritoriality (like the FCPA).
  *   **Does it win?** **Only if** you ignore the "Expected vs. Endorsed" gap. If the payment is illegal under *local* statute (even if expected in practice), this claim fails. If the local law also bans it, "When in Rome" demands you obey the local law, not the local bad habit.

  ### 3. The Prevalence-as-Endorsement Claim
  **The Claim:** "Because local officials and drivers routinely make this payment, the local culture morally approves of it."
  *   **Verdict:** **Straightforwardly False.** This ignores your teacher's point. A practice can be universally *expected* (descriptive) while universally *despised* (normative).
  *   **Does it win?** **No.** If the "Romans" hate the practice but feel forced to do it, the proverb collapses. You cannot claim cultural respect while ignoring the culture's actual moral desire to stop the corruption.

  ### 4. The Epistemic-to-Moral Slide
  **The Claim:** "Locals understand the context of the payment better than Americans do; therefore, their classification of the act (as a 'fee' or 'gift') overrides our moral judgment."
  *   **Verdict:** **Substantive but Arguable.** It is true locals have better *epistemic* access (they know the meaning). It is false that this grants *moral* authority.
  *   **Does it win?** **No.** This is where your partner is smuggling. Understanding *what* a payment means (epistemic) does not decide *whether* it is harmful (moral). A local mobster understands the meaning of protection money better than anyone; that doesn't make it moral.

  ### 5. The Transaction Type Claim
  **The Claim:** "This payment is a 'clientelist bond' or 'relationship fee,' not a 'bribe,' because it secures ongoing loyalty rather than buying a specific rule violation."
  *   **Verdict:** **Substantive but Arguable.** This addresses your concern about gift vs. bribe vs. clientelism.
  *   **Does it win?** **Only if** third parties are unaffected. If the "bond of loyalty" causes a contract to go to a less qualified firm or a safety inspection to be skipped, the internal logic of the relationship does not cancel the external harm. The "matching complaint" inside clientelism is indeed a betrayal of public care, which US rules aim to protect.

  ### 6. The "Who is Rome" Claim
  **The Claim:** "The 'Romans' whose conventions matter are the officials at the border, not the citizens harmed by the delay or the diverted contract."
  *   **Verdict:** **Radical and Straightforwardly False.** This redefines the relevant community to exclude the victims.
  *   **Does it win?** **No.** In Public Forum, you must weigh impacts. If the "Romans" are defined as the public whose roads and safety are compromised, their convention is likely *against* the bribe. Limiting "Rome" to the corrupt insiders begs the question.

  ***

  **How to use this in practice:**
  When your partner says the slogan, ask: *"Which of the six claims are you making?"*
  *   If they say **1 or 2**, argue that necessity or jurisdiction doesn't equal morality.
  *   If they say **3**, remind them that hate-filled compliance isn't cultural endorsement.
  *   If they say **4**, call out the slide from "knowing the meaning" to "setting the morality."
  *   If they say **5**, demand proof that no third party is harmed by the "relationship."
  *   If they say **6**, ask why the victims at the border crossing aren't counted as "Romans."
