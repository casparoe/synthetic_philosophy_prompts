      *   *Check:* The ending. *Adjustment:* Make sure to highlight the tension between the plot (books burned = bad) and the poem (names are all we have = okay?).

  7.  **Final Polish:** Ensure smooth transitions between the Chinese philosophical lens and the Western literary text. (e.g., "If we put Gongsun Long in the labyrinth...")

  8.  *(Final thought before generating)*: Make sure not to get bogged down in historical accuracy of the School of Names vs. Eco's Semiotics. Focus on the *conceptual* bridge the user is asking for.

  **(Self-Correction Note):** I need to be careful not to say Eco *knows* Gongsun Long. He doesn't. The user is asking for a reading *through the lens*. I must maintain that distinction. Eco is doing Western Semiotics; we are applying Eastern Logic to see what lights up.

