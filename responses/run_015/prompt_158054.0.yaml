answer: |-
  This is a fantastic, if wildly anachronistic, angle for a discussion group. You're essentially asking to read a postmodern semiotic novel written by an Italian medievalist through the lens of ancient Chinese logicism. It works surprisingly well because both Umberto Eco and the School of Names (Mingjia) are obsessed with the same problem: the gap between the word we use and the world we live in.

  Here is a breakdown of how *The Name of the Rose* dramatizes the "White Horse" problem, where Eco might be conflating linguistic and ontological errors, and what the famous ending adds to the pile.

  ### 1. The Library as the "White Horse" Trap
  Gongsun Long's famous dictum—"A white horse is not a horse"—argues that the specific concept (white horse) is not identical to the universal category (horse). The name restricts the reality. If you demand a "horse," a black horse will do; if you demand a "white horse," a black one is excluded. The name creates a boundary that the object itself doesn't necessarily respect.

  Eco's library is a physical manifestation of this logical trap. The library is organized by a cryptic cataloging system that functions like a rigid language. The books are not placed by content, but by a code that only the librarian understands.
  *   **The Metaphor Holds:** When William of Baskerville tries to find the forbidden book, he realizes the catalog (the Name) does not match the shelves (the Actuality). The system claims a book is in one place, but it is in another. This is the "White Horse" problem on an architectural scale. The category "Geography" might contain a book on "Poisons." By forcing the book into a category, the library obscures the thing itself.
  *   **The Dramatization:** Eco shows that when you prioritize the *Ming* (Name/Category) over the *Shi* (Actuality/Content), the system becomes a labyrinth. The library isn't just a storage room; it's a logical argument made of stone. And like Gongsun Long's paradox, it proves that if you define things too rigidly, you lose access to the truth. The "White Horse" (the specific truth of the book) is lost because the librarians are obsessed with the "Horse" (the universal order of knowledge).

  ### 2. The Poisoned Book: Linguistic vs. Ontological Mistake
  This is the crux of your second question. The villain, Jorge, hides Aristotle's second book of *Poetics* (on comedy) because he believes laughter undermines the fear of God. He treats the book as ontologically poisonous—it *is* evil.

  *   **Where Eco Confuses the Mistake:** A strict School of Names reading would suggest Jorge is making a *linguistic* mistake. He has rectified the name "Heresy" to match the object "Laughter," but he has done so falsely. He is treating a semantic relationship (this book signifies danger) as an ontological fact (this book *is* danger).
  *   **Eco's Verdict:** Eco sides against Jorge here. William solves the mystery not by accepting the book's "evil essence," but by understanding the *signs* surrounding it (the ink stains on fingers, the layout of the rooms). Eco is arguing that the poison isn't in the book; it's in the *interpretation* of the book.
  *   **The Mingjia Lens:** Gongsun Long would say Jorge is failing to distinguish the name from the actual. "Laughing" is not "Sin." By conflating them, Jorge destroys the library. Eco dramatizes this by having the library burn down. The fire is the result of forcing the Name to dominate the Thing. So, Eco isn't backing Aristotle (who believes categories reveal essence); he's backing a form of skepticism that aligns surprisingly well with the School of Names: be wary when the map claims to be the territory.

  ### 3. Does Eco Back Aristotle or the Mingjia?
  On the surface, the novel is steeped in Aristotelian Scholasticism. The characters speak in syllogisms. They believe logic can reveal God's order. But Eco pulls the rug out.

  *   **Aristotle:** Believes universals exist within things. If you categorize correctly, you find the truth.
  *   **Mingjia:** Believes names and actualities can drift apart. Correcting names is political and ethical, but the gap is inherent.
  *   **Eco:** Ultimately, Eco is a semiotician, not a realist. He believes signs are slippery. In the novel, every time a character assumes an Aristotelian certainty ("This sign *must* mean this thing"), they get killed or misled. William succeeds because he treats truth as probabilistic, not absolute.

  So, does he back Aristotle over the Mingjia? **No.** He uses an Aristotelian setting to prove a point that is much closer to the School of Names: that our systems of classification are human constructs that often hide reality rather than reveal it. The library burns because it tried to be a perfect Aristotelian universe. It failed because it ignored the "White Horse" distinction—the specific, messy reality of the books themselves.

  ### 4. The Ending: "Stat Rosa Pristina Nomine"
  The novel ends with the Latin phrase: *Stat rosa pristina nomine, nomina nuda tenemus* ("The rose of yesteryear remains by name; we hold bare names").

  *   **The Argument:** This is the ultimate Nominalist statement. The universal "Rose" is gone; the actual roses are dead; all we have is the word "Rose."
  *   **Does it add anything?** Yes, it pushes the School of Names' skepticism into postmodern melancholy. Gongsun Long wanted to "rectify names" to make governance work. He wanted the Name and the Actuality to align so society could function. Eco's ending suggests that alignment is impossible. The library is ash. The books are gone. We are left with the *name* of the library, the *name* of the truth.
  *   **The Tension:** Here is where your group can dig deep. If Eco truly believed "we hold bare names," why does the novel mourn the burning library? If names are all we have, the loss of the books shouldn't matter. But it does matter. This suggests Eco is confused, or perhaps he's admitting that while *philosophically* we are Nominalists (we only have language), *emotionally* we are Realists (we crave the thing itself).
  *   **Comparison:** Gongsun Long would say, "Fix the name, save the state." Eco says, "The name is all that's left, and the state is in ruins." Eco's ending is more pessimistic. It suggests the gap between Name and Thing isn't just a logical puzzle to be solved (as the Mingjia hoped); it's a tragic condition of human existence.

  ### 5. Where the Metaphor Breaks
  For your discussion, you should point out where this comparison might strain:

  1.  **Intent:** The School of Names was largely political. They wanted to ensure that a "ruler" acted like a "ruler." Eco is epistemological. He cares about how we *know* things, not necessarily how we govern. Applying Gongsun Long to Eco risks politicizing a mystery novel that is mostly about epistemology.
  2.  **The Ontological Mistake:** You asked if Eco confuses language mistakes with ontological ones. I'd argue Eco does the opposite: he shows characters *making* that confusion. However, Eco himself might be guilty of it in the ending. By lamenting the loss of the books while simultaneously writing a poem about how only names matter, he creates a contradiction. He wants to have his "White Horse" (the real truth) and eat it too (claim only the name exists).
  3.  **The Labyrinth:** In Gongsun Long's dialogue, the confusion is in the logic. In Eco's novel, the confusion is physical (a literal maze). The metaphor holds poetically, but logically, a maze is an obstacle to movement, not necessarily an obstacle to definition.

  ### Summary for the Group
  If I were framing this for the group, I'd propose this thesis:

  *The Name of the Rose* is a Western dramatization of the *Ming-Shi* (Name-Actuality) gap. The library represents a failed attempt to force *Ming* (categories) onto *Shi* (books) without flexibility. Jorge represents the fatal error of treating a linguistic classification as an ontological truth. While Eco writes in the tradition of Aristotle, his conclusion is Nominalist, aligning him closer to the School of Names' skepticism about language's ability to capture reality. However, unlike Gongsun Long, who sought to repair the gap, Eco accepts the gap as a tragic ruin. We are left holding the bare name of the rose, wondering if the scent ever really existed at all.

  This reading gives you a fresh way to talk about the library not just as a plot device, but as a philosophical antagonist that fights the characters using the weapon of misclassification.
