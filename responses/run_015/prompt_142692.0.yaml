      *   **Topic:** Democratic legitimacy of the EU, focusing on "delegation asymmetry" and a proposed "reversibility condition" (competence-return procedure).
      *   **Audience:** Specific mix of 8 people + Chair (4 lawyers, 2 theorists, 1 former Perm Rep, 1 Central European analyst, 1 comparative constitutionalist chair).
      *   **Constraints:**
          *   Do *not* focus on standard reform menu (EP powers, transnational lists, etc.) or the three predictable objections already prepared (Brexit proves exit works, Art 48 availability, differentiated integration).
          *   Need ~10 objections, ordered by likelihood/damage.
          *   Attributed to specific audience members with their specific jargon/style.
          *   Format per objection: 2-minute spoken reply, immediate concession, non-negotiable point, soft spot.
          *   Include ordering advice (who speaks when), a bridging line, and an assessment of the weakest joints (volunteered vs. hidden).
          *   Include the "fatal question" (hope nobody asks).
          *   Flag legal points needing verification.
      *   **Thesis Summary:** Legitimacy deficit stems from *delegation asymmetry* (easy to delegate/enforce, hard to reverse). Remedy: Competence-return procedure (trigger, audit, reversed majority, anti-cherry-picking). Requires amending "ever-closer union" teleology.

  2.  **Deconstruct the Audience & Their Likely Angles:**

      *   *Lawyer 1 (Competences/Implied Powers):* Will attack the legal feasibility. Implied powers (Art 352 TFEU), *effet utile*, flexibility clause. How can you "return" competences if the Court interprets them broadly?
      *   *Lawyer 2 (Withdrawal/Amendment):* Will focus on Art 50 and Art 48. You say they aren't "ordinary," but legally they are the *only* ordinary ways. Is your procedure compatible with primary law?
      *   *Lawyers 3 & 4 (Generalists/Institutional Design):* Will ask about the Council voting mechanics. "Reversed majority"? How does that interact with existing QMV rules? Institutional chaos.
      *   *Theorist 1 (Input/Output/Problem-Solving):* Sympathetic to problem-solving. Will ask: Does this undermine the Union's ability to solve cross-border problems? If we can reverse climate or competition rules easily, do we lose output legitimacy?
      *   *Theorist 2 (Republican/Discursive/Constituent Power):* Will ask: Who is the "demos" triggering the return? Is this just intergovernmentalism disguised? Where is the constituent power in your audit?
      *   *Former Perm Rep (Council/Credibility):* Will focus on market stability. If competences are reversible, investment drops. Credibility of commitments. "Unbind at will."
      *   *Central European Analyst (Two-Speed/Exit Threats):* Who holds the trigger? Rich states vs. poor states. Asymmetric power. Will Germany use this to force opt-outs?
      *   *Chair (Comparative Constitutionalist):* The "Category Mistake." Independent central banks, constitutional rights, devolution are also hard to reverse. Why is the EU unique?
