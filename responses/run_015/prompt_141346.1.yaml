      *   **The Implicit Theory:** The law assumes actions are diagnostic. It treats behavior as a trace left by a mental state. It's not Newcomb's problem; it's standard abductive reasoning. If you run, it's *more likely* you're guilty than if you stayed. It doesn't assume the action *caused* the guilt, but that the guilt caused the action.
      *   **Strict Presupposition vs. Good Fit:** Does the law *need* EDT? No. It needs Bayesian inference. Both EDT and CDT can agree on the probability update. The conflict arises in *policy rules* (like silence). The law blocks certain inferences not because they are logically invalid, but because they undermine rights. So, rival theories fit the fact-finding, but the procedural rules are policy bolt-ons.
