      *   *Right to Silence (Griffin v. California):* Prosecutors can't comment on failure to testify. This is a *policy* rule (privilege against self-incrimination), not an evidential one. It blocks the natural Bayesian inference that "silent people often have something to hide."
      *   *Refusal (Breathalyzer):* In many jurisdictions, refusal is admissible as consciousness of guilt *and* carries administrative/criminal penalties. This is a mix of evidential use and policy incentive (implied consent laws).
      *   *Evidential vs. Causal Decision Theory:*
          *   Evidential (EDT): My action provides news about the state of the world (e.g., I run, so I am likely guilty).
          *   Causal (CDT): My action causes outcomes (e.g., If I run, I get caught/penalized).
          *   The Law mostly uses EDT for *fact-finding* (what happened?) but CDT/Policy for *rules of procedure* (how should we behave to ensure fairness/efficiency?).
      *   *The Defense Argument:* "Screening off." The fact that she knew she was suspected explains the running, regardless of guilt. Also, character evidence (she's a "runner").
