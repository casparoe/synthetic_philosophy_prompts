prompt: |-
  I'm writing a legal thriller and have gotten myself into a corner where I actually need to know what I think. Setup: my defendant didn't do it, but she panics and runs when the patrol car pulls up, and the prosecutor wants the jury to hear about the running. As far as I can tell (my brother-in-law is a public defender and is useless on this, he just keeps saying it depends), the flight is admissible as what the cases call consciousness of guilt, along with lying to the detectives, hiding the jacket, and refusing the breath test — the idea being that a person with nothing to hide doesn't do those things, so the jury can read her behavior as a symptom of a fact that was already fixed. But in the very same trial the judge will tell the jury it must not hold it against her that she never took the stand, which everybody in the room knows is also something guilty people do more often. And the breathalyzer thing is weird too: refusing is evidence of guilt, and refusing is also its own separate crime, which sounds less like reading a symptom and more like just making refusal expensive so people blow.

  Here's what I can't get straight, and it's making me doubt the whole courtroom scene. The consciousness-of-guilt move looks like it treats an action as evidence about what is already true — she ran because she's the sort of person who has something to run from — which is the one-boxer's picture of action that Newcomb's problem is built to stress test, where your choice is news about whether the box was already full. The rest of the trial seems to run on the opposite, causal picture: punish to change what people will do next time, exclude evidence of later repairs so people keep fixing the railing, criminalize refusal to change the incentives. So: is the doctrine genuinely committed to the evidential picture of action, or can someone who thinks only causal effects matter reconstruct the whole package as ordinary Bayesian reasoning about what guilt predicts, with the silence instruction and the exclusionary rules bolted on as policy? I want the line between what the practice strictly presupposes and what it merely sits well with, including the places where two quite different theories would both license exactly the rules we have.

  The scene I actually need to write: her lawyer argues to the jury that the running proves nothing, because she only ran after she found out the cops had already matched her prints at the scene — an innocent person who knows she's already the only suspect has as much reason to bolt as a guilty one, maybe more, and the defense also wants to put her ex on the stand to say she once ran from a fender-bender she caused at nineteen purely out of panic, to show that flight here is explained by her being a runner, not by her being a killer. Is that a good argument or a trick? What is the cleanest thing the prosecutor says back? If the court accepted it, would it have to stop using flight against anyone who already knew they were a suspect, which is most defendants? And if a jurisdiction replaced the evidential picture with a strictly causal one, what would concretely have to change about how trials run? If I've got the doctrine wrong, correct me gently and then answer anyway.

  Give me: The implicit theory (about two paragraphs, reconstructing what the practice assumes about action and evidence); Strict presupposition vs. good fit (a paragraph, with any place where rival theories both fit); The inconsistencies (a paragraph or two on the silence instruction and the double treatment of refusal); My lawyer's argument (a paragraph — does the screening-off move work, what's the prosecution's best reply, and does accepting it gut the doctrine); Causal-only courtroom (a short paragraph on what would have to change); and Bottom line (two or three sentences on what my defense lawyer should actually say in the scene).
