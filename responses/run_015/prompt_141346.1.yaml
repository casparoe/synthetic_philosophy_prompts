answer: |-
  **The Implicit Theory**
  The legal doctrine operates on a naive realist theory of action: behavior is treated as a physical trace left by a mental state. When the court admits evidence of flight or lying, it is not engaging in Newcomb-like prediction but in abductive reasoning (inference to the best explanation). The logic is causal-retrospective: the fact of guilt causes a state of fear, which causes the act of running. The jury is asked to trace the arrow backward from the effect (running) to the cause (guilt). This presupposes that actions are diagnostic symptoms of internal conditions, meaning the law treats human behavior as legible text. It assumes a stable link between psyche and soma, where a "guilty mind" reliably produces "incriminating acts" with a frequency higher than an "innocent mind" produces the same acts under similar pressure.

  However, this evidential picture is confined strictly to the fact-finding phase. The system does not claim that running *makes* you guilty, nor does it claim that the act is metaphysically bound to the crime. It claims only that the probability of guilt is updated conditional on the observation of flight. This is standard Bayesian updating, not decision theory. The law assumes that rational actors generally try to avoid conviction, so behaviors that increase the risk of conviction (like fleeing) are statistically correlated with those who know they are guilty. The doctrine presupposes that while innocent people might run, guilty people run *more often* or for *different reasons*, and that distinction is accessible to a jury.

  **Strict Presupposition vs. Good Fit**
  The practice does not strictly presuppose evidential decision theory (EDT) over causal decision theory (CDT); rather, it presupposes that actions are *caused* by mental states, which allows them to serve as *evidence* of those states. Both EDT and CDT can accommodate this Bayesian update without contradiction. The place where rival theories both fit is the admissibility of circumstantial evidence itself; whether you view the action as "news" (EDT) or "effect" (CDT), the probabilistic weight remains the same. The friction arises only when policy rules intervene. The legal system is a hybrid: it uses evidential reasoning to determine truth (what happened?) but causal/utilitarian reasoning to set procedure (how do we ensure a fair system?). The "fit" is seamless until a rule like the privilege against self-incrimination blocks a logically valid inference for the sake of a broader systemic goal.

  **The Inconsistencies**
  The silence instruction and the treatment of refusal appear inconsistent only if you view the trial as a pure truth-seeking engine. The instruction not to hold silence against the defendant is a "counter-legal" rule; it explicitly forbids the jury from making a valid Bayesian update because the Fifth Amendment prioritizes the right to withhold information over the probative value of that withholding. It is a policy firewall, not a logical claim that silence is meaningless. The breathalyzer refusal is different because "implied consent" laws transform the refusal from a mere symptom into a separate contractual breach. By driving, you agreed to test; refusing is an independent violation that carries its own penalty. The law treats the refusal as both evidence of guilt (evidential) and a distinct offense (causal/regulatory). This isn't a philosophical contradiction; it is a stacking of incentives. The system says, "Refusing is evidence you are guilty, and also, we will punish you for refusing to ensure the system functions."

  **My Lawyer's Argument**
  The defense argument is a classic "alternative explanation" attack on the weight of the evidence, not its admissibility. The "screening-off" move works logically: if being a suspect causes innocent people to run at the same rate as guilty people, the evidentiary value of running drops to near zero. However, the prosecutor's cleanest reply is "totality of the circumstances." They will argue that while panic explains the running, it does not explain the lying, the hidden jacket, and the refusal combined. Accepting the defense argument does not gut the doctrine; it merely forces the prosecution to prove the flight was motivated by guilt rather than general anxiety. The risky element is the ex-boyfriend's testimony; under Federal Rule 404, character evidence (she's a "runner") is generally inadmissible to prove conduct. The judge might allow it only to rebut the specific inference of consciousness of guilt, but the prosecutor will object fiercely that this is a backdoor propensity argument.

  **Causal-Only Courtroom**
  If a jurisdiction replaced the evidential picture with a strictly causal one, trials would cease to exist as inquiries into past truth. A purely causal system cares only about future outcomes: detention would be based on risk assessment (what will you do?), not proof of past acts (what did you do?). Evidence of flight would be irrelevant unless running itself caused further harm. The courtroom would transform into an administrative hearing focused on incentives and containment, where the question is not "Did she do it?" but "What sanction minimizes future crime?" Retrospective justice requires an evidential view of action; a causal-only view is purely prospective and utilitarian.

  **Bottom Line**
  Your lawyer should tell the jury: "Panic is not an admission; it is a reflex, and the prosecution is asking you to punish her for having a pulse in a terrifying situation." The prosecutor should reply: "Innocent people stop and explain; guilty people run and hide, and she did both."
