answer: |-
  ### Essay Question (90 Minutes)

  **Lexical Threshold Negative Utilitarianism (LTNU) asserts that suffering above a certain intensity lexically outweighs any amount of pleasure, precluding trade-offs. However, standard utilitarian aggregation presupposes a common metric of value. Critically evaluate the following objection:**

  > *"If pleasure and pain are incommensurable to the degree required for lexical priority, LTNU lacks the conceptual resources to aggregate suffering across individuals or time, rendering the view action-guiding only in trivial cases."*

  **In your answer, address whether a coherent theory of value can sustain both lexical priority and aggregative minimization simultaneously.**

  ***

  ### Model Answer (Approx. 600 Words)

  Lexical Threshold Negative Utilitarianism (LTNU) attempts to capture the intuition that extreme suffering is qualitatively worse than mere discomfort, such that no quantity of pleasure can justify imposing it. However, this lexicality generates a structural tension regarding commensurability. If pain and pleasure are on a single scale, trade-offs should be possible; if they are not, aggregation becomes problematic. The objection posits that LTNU collapses because it requires incommensurability for lexicality but commensurability for aggregation. While this tension is significant, it is not fatal if LTNU adopts a dual-scale model of value.

  The core of the objection rests on the definition of aggregation. To "minimize total suffering," one must be able to sum units of suffering across persons and durations. This typically implies a cardinal metric where one unit of pain is comparable to another. However, lexical priority implies that the metric for severe pain is discontinuous with the metric for pleasure, and potentially with mild pain. If severe pain is *sui generis*—belonging to a different order of value than pleasure—then they cannot be placed on a single number line. If they cannot be on a single line, the utilitarian calculus of "maximize net good" or "minimize net bad" loses its mathematical coherence. We cannot subtract pleasure from pain if they are incommensurable. Consequently, in complex real-world scenarios where actions produce both mild suffering and potential pleasure, LTNU risks paralysis. It can forbid severe torture, but it may lack the machinery to decide between two policies that both avoid the lexical threshold but differ in aggregate mild suffering.

  However, a sophisticated proponent of LTNU can resist the claim that the view becomes action-guiding *only* in trivial cases. The defense requires distinguishing between *inter-category* and *intra-category* commensurability. LTNU need not claim that pain and pleasure are incommensurable in all respects, only that they are incommensurable regarding *trade-offs*. One can maintain that while pleasure cannot cancel out severe pain, instances of severe pain can be compared to other instances of severe pain.

  This allows for intra-category aggregation. We can still sum up total severe suffering to minimize it, even if we cannot subtract pleasure from that sum. The "minimization" function applies strictly to the negative side of the ledger. The lexical threshold acts not as a breakdown of measurement, but as a constraint on the optimization function. We are minimizing $S$ (suffering) subject to the constraint that no $S_{lexical}$ is permitted, regardless of $P$ (pleasure).

  Yet, this defense concedes too much if it ignores the problem of mixed goods below the threshold. If mild pain and pleasure *are* commensurable (to allow for trade-offs in non-lexical cases), LTNU risks collapsing into standard Negative Utilitarianism or Classical Utilitarianism at the margins. If they are *not* commensurable even below the threshold, the theory indeed struggles to guide action in ordinary life, where we constantly trade minor inconveniences for minor pleasures.

  Therefore, the objection holds partial force. LTNU is coherent only if it posits a fragmented value structure: one scale for severe suffering (where aggregation applies), and a separate relation for pleasure/mild pain (where trade-offs might apply). This saves the view from incoherence but complicates its practical application. It renders LTNU less a unified theory of value and more a deontological constraint wrapped in utilitarian language. The view survives, but it loses the elegance of a single aggregative metric, confirming the objector's suspicion that lexicality comes at the cost of theoretical unity.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  #### **A Grade (70-100): First Class**
  *To achieve an A, the essay must move beyond exposition and engage with the structural logic of the theory.*
  *   **Identifies the Core Tension:** Explicitly articulates the conflict between the requirement for a single metric (for aggregation) and the requirement for separate metrics (for lexical priority).
  *   **The Intra/Inter Distinction:** Makes the crucial philosophical move of distinguishing between *inter-category* commensurability (pain vs. pleasure) and *intra-category* commensurability (pain vs. pain). This is the only way to resolve the "stuck" feeling.
  *   **Action-Guiding Critique:** Addresses the "trivial cases" claim. Acknowledges that while severe cases are solvable, "ordinary" trade-offs become problematic if the scales are fragmented.
  *   **Conclusion:** Offers a nuanced verdict (e.g., "The view is coherent but loses theoretical unity" or "It becomes a constrained optimization problem rather than pure aggregation").

  #### **B Grade (60-69): Upper Second**
  *To achieve a B, the essay must be competent and accurate but misses the deeper structural resolution.*
  *   **Accurate Definitions:** Correctly defines LTNU and commensurability.
  *   **Explains the Objection:** Clearly states why incommensurability makes math/aggregation hard.
  *   **Misses the Distinction:** Fails to distinguish between aggregating pain-with-pain versus pain-with-pleasure. Treats "aggregation" as a monolith that is either fully possible or fully impossible.
  *   **Standard Objections:** Relies on standard objections to Negative Utilitarianism (e.g., "The Benign Explosion" or "Destroy the World") rather than the specific commensurability/aggregation tension requested in the prompt.
  *   **Resolution:** Attempts to solve the problem but relies on hand-waving (e.g., "We just know severe pain is worse") without explaining the metric.

  #### **C Grade (50-59): Lower Second**
  *   **Descriptive:** Mostly explains what LTNU is without critically evaluating the specific objection in the prompt.
  *   **Confusion:** Confuses lexicality with intensity (thinking lexical just means "very intense" rather than "trumping").
  *   **Irrelevance:** Discusses population ethics (Repugnant Conclusion) without linking it to the commensurability issue.

  #### **Specific Mark Deductions (Mistakes)**
  *   **-10 Marks:** Reciting the definition of Negative Utilitarianism without addressing the *Lexical Threshold* modification.
  *   **-15 Marks:** Claiming LTNU allows trade-offs between severe pain and pleasure (this contradicts the definition of lexicality).
  *   **-20 Marks:** Failing to address the "aggregation" component of the prompt (focusing only on the moral intuition of suffering).
  *   **-10 Marks:** Asserting that "utilitarianism always requires a single scale" without considering constrained optimization models.
