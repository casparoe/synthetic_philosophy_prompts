answer: |-
  **The Charging Plaza**

  The charging plaza hummed, a grid of magnetic squares where the delivery Runners docked. Individually, a Runner was stupid. It had three sensors: obstacle avoidance, GPS coordinate, and battery level. It had one output: wheel movement and an LED ring that glowed blue when charged, red when hungry.

  "They're spelling 'Tacos' again," Sam said, pointing to the hub.

  Leo shook his head, sipping cold coffee. "They aren't spelling anything. Thirty units just happened to dock in a cluster that looks like a word to you. It's pareidolia. Like seeing faces in clouds."

  "Ask them," Sam challenged.

  Leo opened the campus app. He typed: *Is the dining hall open late?*

  Below them, the Runners shifted. It wasn't instantaneous. A unit finished a delivery, rolled into an empty slot, and its LED flickered green. Another moved to fill a gap. Within two minutes, the red lights formed a distinct 'Y' shape across the grid.

  "See?" Sam said. "The fleet knows the schedule."

  "The fleet doesn't know anything," Leo countered. "The central server knows the schedule. The server tells the bots where to park based on availability. The 'Y' is just a side effect of optimization algorithms. None of these bots understand 'late night.' They just know 'dock here.'"

  "But the understanding isn't in the bot," Sam said, leaning on the railing. "It's in the pattern. You don't say a neuron understands 'justice,' but you believe *you* do. Why is the fleet different?"

  "Because I'm not made of delivery bots."

  The argument stalled when winter break hit. The university shut down the north campus to save heating costs. The maintenance crew came with crates and collected exactly half the Runners, putting them into sleep mode in a warehouse.

  When spring semester started, the Runners returned. The plaza was full again.

  Leo and Sam watched the first lunch rush. A student typed a query into the app: *Where is the professor?*

  The Runners buzzed. They docked and undocked rapidly, lights flashing erratically. Finally, they settled. The pattern was a messy smear of red and blue. No shape. No answer.

  "Glitchy," Leo noted. "Probably firmware corruption from storage."

  "Try again," Sam said.

  Leo typed: *Where is the professor?*

  The Runners shifted. They formed the same messy smear. Then, without a new query, they shifted again. The same smear. They were stuck in a loop, cycling through the same configuration every forty-five seconds.

  "It looks like... confusion," Sam whispered.

  "It looks like a reduced processing pool," Leo said, though his voice was quieter now. "Half the variables are gone. The system can't find the optimal fit for the data anymore. It's just thrashing."

  "But it's thrashing consistently," Sam said. "Before, if you asked a hard question, they'd take time to arrange a complex shape. Now they just panic. If it was just code, why did the personality change? The code is the same. The server is the same. Only the body changed."

  Leo watched a single Runner bump into a dock, blink red, and move away. It knew nothing. It was a plastic shell with a battery. But the plaza—the whole humming, flickering grid—seemed to be shivering. It felt less like a machine malfunctioning and more like a stroke victim trying to speak.

  "Maybe it's just metaphor," Leo said, but he didn't look at Sam.

  "Maybe," Sam said. "But I think we just broke its brain."

  They stood there as the Runners cycled their confused pattern again, blinking blindly in the sun, waiting for a question they no longer had the capacity to answer.
