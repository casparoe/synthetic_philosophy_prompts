answer: |-
  # Activity Plan: The Selection Ladder

  ## Overview
  This session uses a "ratchet" mechanism to guide members from intuitive medical decisions to controversial ethical commitments without explicit instruction. The group generates the rules themselves, then finds those rules compelling them toward conclusions they might initially resist. The facilitator acts as a strict procedural referee, not a moral guide.

  ## Materials
  *   Whiteboard and markers (black, red, blue).
  *   6 Sets of Index Cards (labeled Stage 1 through Stage 6). Each set contains two cards (Option A, Option B).
  *   One large index card labeled "The Rule."
  *   Timer.

  ## Setup (5 Minutes)
  *   Arrange chairs in a semi-circle facing the whiteboard.
  *   Place the "The Rule" card at the center of the board.
  *   **No Lecture Rule:** Do not introduce the topic of eugenics, bioethics, or reproduction. State only: "Today we are simulating decision-making for a fictional fertility clinic. You are the ethics board. You will make six decisions. After each decision, you must write the rule you used on the board. You cannot erase or contradict previous rules."

  ## Minute-by-Minute Timeline

  **00:00 – 05:00: Setup & Rules**
  Explain the "No Revision" constraint. If a rule is written in Stage 1, it must logically permit the choice in Stage 2. If Stage 2 forces a contradiction, the group must debate until they find wording that satisfies both, but they cannot delete Stage 1's text.

  **05:00 – 15:00: Stage 1 (The Intuition)**
  *   **Scenario:** A couple has two embryos. They will implant one. The other remains frozen for donation.
  *   **Card A:** 80% chance of Condition K (Death by age 10, significant pain). 20% chance normal life.
  *   **Card B:** 0% chance of Condition K. 100% chance normal life (Life expectancy 80).
  *   **Action:** Group chooses. (Expected: Card B).
  *   **Board:** Write Rule 1. (Expected: "Choose the embryo with the higher chance of a long, pain-free life.")

  **15:00 – 25:00: Stage 2 (The Disability Slide)**
  *   **Constraint:** Apply Rule 1.
  *   **Card A:** 100% Deaf. Life expectancy 80. No chronic pain. High community support.
  *   **Card B:** 100% Hearing. Life expectancy 80. 10% risk chronic pain. Standard support.
  *   **Action:** Group chooses. (Tension: Rule 1 says "pain-free," but A is pain-free. Rule 1 says "long life," both are equal. They must define "life quality".)
  *   **Board:** Write Rule 2. (Expected refinement: "Choose the embryo with fewer biological barriers to typical functioning.")
  *   **Facilitator Check:** Does Rule 2 contradict Rule 1? If they try to say "Deafness doesn't matter," ask if that violates "fewer barriers."

  **25:00 – 35:00: Stage 3 (The Maximizing Turn)**
  *   **Constraint:** Apply Rule 2.
  *   **Card A:** Average immune system. Cost $0.
  *   **Card B:** Top 10% immune system (fewer sick days, better long-term health). Cost $10,000 (reduces money for education).
  *   **Action:** Group chooses. (Tension: Rule 2 says "fewer barriers." Health is a barrier. Cost is a barrier.)
  *   **Board:** Write Rule 3. (Expected: "Choose the embryo with the best overall prospects, weighing costs.")

  **35:00 – 45:00: Stage 4 (The Non-Identity Reveal)**
  *   **Constraint:** Apply Rule 3.
  *   **Card Text Update:** Read aloud: "Remember: If you pick Card A, Child A exists. If you pick Card B, Child B exists. Neither child exists unless you pick them. You are not hurting the one you don't pick; they simply never are."
  *   **Action:** Ask if this changes the choice. (Most will say no, which confirms the impersonal nature of the obligation).
  *   **Board:** Write Rule 4. (Expected: "Parents ought to create the child with the best prospects, even if no specific child is harmed by not being chosen.")

  **45:00 – 55:00: Stage 5 (The Self-Check)**
  *   **Constraint:** Apply Rule 4.
  *   **Prompt:** "Look at Rule 4. Your parents did not select you using this method. You exist by chance. Did your parents fail a moral obligation toward you?"
  *   **Action:** Discussion. (This creates personal discomfort with the principle they just wrote).
  *   **Board:** No new rule. Mark Rule 4 with a question mark.

  **55:00 – 65:00: Stage 6 (State vs. Parent)**
  *   **Constraint:** Apply Rule 4.
  *   **Three Cards:**
      1.  State forbids parents from ignoring Rule 4.
      2.  State pays for the selection to ensure Rule 4 is followed.
      3.  State allows parents to ignore Rule 4.
  *   **Action:** Vote on which policy fits Rule 4. (This separates parental duty from state compulsion).
  *   **Board:** Write Final Policy.

  **65:00 – 70:00: Debrief**
  *   Reveal the terms "Procreative Beneficence" and "Non-Identity Problem."
  *   Map the room's feelings to the philosophical positions.

  ## Debrief Script & Mapping
  *   **Minute 65:** "Look at Rule 1 vs Rule 3. You started by avoiding death. You ended by weighing immune systems. That is the distance between therapy and enhancement."
  *   **Minute 67:** "In Stage 4, you agreed the choice determines *who* exists. This means your rule isn't about making *someone* better off. It's about making the *outcome* better. That is the 'impersonal' commitment."
  *   **Minute 69:** "In Stage 6, you likely separated what parents *should* do from what the state *must* force. That distinguishes liberal eugenics from state eugenics."
  *   **Resistance Option:** If members say "We wouldn't actually do this," reply: "You wrote the rule. The rule demands it. The activity shows what your own logic requires, not what you feel comfortable doing."

  ## Failure Modes
  1.  **Debate Team Wiggle:** They refuse to write a definitive rule, using vague language like "It depends."
      *   *Handling:* "The clinic needs a protocol. 'It depends' is not a protocol. Write the condition that makes it depend."
  2.  **Science Derailment:** "Polygenic scores aren't that accurate."
      *   *Handling:* "For this simulation, assume the data on the card is the best available medical truth. We are testing the ethics of the choice, not the technology."
  3.  **Eugenics History:** Someone brings up coercive sterilization early.
      *   *Handling:* "Write that on the side of the board. We will address it in the debrief. Right now, we are testing the logic of *choice*, not *force*."
  4.  **Disability Offense:** The wheelchair user feels the "barriers" language is ableist.
      *   *Handling:* Validate immediately. "That is exactly the tension Stage 2 was designed to surface. Does 'barrier' mean medical limitation or social failure? Keep that question for the debrief."

  ## Irreducibles (What you must supply)
  *   The historical context of 20th-century eugenics programs (the activity isolates choice from force; you must reconnect them).
  *   The philosophical definition of "person-affecting" vs. "impersonal" principles (the activity generates the intuition; you must provide the vocabulary).
  *   The religious doctrine regarding embryo status (the activity treats embryos as selectable options; you must acknowledge the theological objection separately).

  ## Safeguards
  *   **Disability Framing:** Card text for Deaf embryo explicitly states "High community support" and "No chronic pain" to avoid framing the life as tragic.
  *   **Embryo Discomfort:** Card text explicitly states unselected embryos are "frozen for donation," not destroyed, to accommodate religious objections to discard.
  *   **No Jargon:** Terms like "Non-Identity," "Beneficence," and "Eugenics" are banned until the final 5 minutes.

  ## Cheat Check
  *   **Did we label cards "Healthy"?** No, used stats (life expectancy, pain risk).
  *   **Did we assume non-existence is better?** No, all profiles describe lives "clearly worth living."
  *   **Did we force the verdict?** No, the group writes the rules. The facilitator only enforces consistency.
  *   **Did we sneak in state compulsion?** No, Stage 6 explicitly separates state power from parental duty.

  ## Success Criteria
  At minute 70, the whiteboard should display a chain of rules that starts with "Avoid Death" and ends with "Maximize Prospects," with a visible tension around the "Self-Check" stage. Members should express discomfort that their own logic commits them to positions they find intuitively difficult, specifically regarding the impersonal nature of the obligation.

