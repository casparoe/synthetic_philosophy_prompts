          *   "We excised the cause" claim vs. historical optimism bias.
          *   Endogeneity of reference classes (selection effects).
          *   Reference class selection regress.
          *   Outside View usage modes (Point Estimate vs. Calibration vs. Threshold).
          *   First-of-a-kind cases (broad classes).
          *   Distinction: Modesty about self vs. Deference to base rate.
      *   **Critical Analysis:** Identify which desiderata cannot be jointly satisfied (impossibility results).
      *   **Evaluation:** Scorecard of common rules of thumb against the criteria.
      *   **Constraint:** Write it so the *other* teammate (the Outside View proponent) doesn't feel it's biased toward the Inside View proponent.

  2.  **Deconstruct the Core Tension:**
      *   The user wants a *theory specification*, not advice. This needs to look like a requirements document for a decision-making framework.
      *   The tension is between *specificity* (Inside View) and *statistical validity* (Outside View).
      *   The "Impossibility" section is crucial. It needs to identify where the math or logic breaks down, not just where it's hard.

  3.  **Drafting the Requirements (The Spec):**
      *   *Requirement 1: Reference Class Stability.* (Addresses the regress problem). Needs to stop the "narrowest class" game.
      *   *Requirement 2: Causal Isolation.* (Addresses "we excised the cause"). How do we prove the failure mode is gone?
      *   *Requirement 3: Selection Effect Correction.* (Addresses endogeneity). The base rate isn't raw; it's conditioned on who tried.
      *   *Requirement 4: Variance Sensitivity.* (Addresses Point Estimate vs. Threshold). High variance classes shouldn't dictate means.
      *   *Requirement 5: Forecaster Calibration Decoupling.* (Addresses Modesty vs. Deference). Separating "I am bad at guessing" from "This class dictates the outcome."
      *   *Requirement 6: Mechanism-Outcome Alignment.* (Addresses Mechanism vs. Outcome stats). What if they disagree?
      *   *Requirement 7: Null-Class Handling.* (Addresses First-of-a-kind). What if no good class exists?

  4.  **Refining the Requirements (Neutral Tone Check):**
      *   Make sure R2 doesn't sound like "Inside View wins if you have a story." It needs to demand *evidence* of excision.
      *   Make sure R3 doesn't sound like "Outside View is always rigged." It needs to acknowledge selection bias on both sides.
      *   Ensure the distinction between Modesty and Deference (R5) is clear, as requested.

  5.  **Identifying the Impossibility Result:**
      *   The user suspects: "Sensitive to diagnostic info" vs. "Not exploitable by self-serving claims."
      *   *Deep Dive:* This is essentially the *Reference Class Problem* meets *Goodhart's Law*. If the rule allows exceptions based on inside-view claims, agents will optimize their claims to trigger exceptions. If the rule forbids exceptions, it ignores genuine innovation.
      *   *The Real Conflict:* It's actually between **Causal Specificity** and **Statistical Exchangeability**. To use a base rate, you assume exchangeability (you are random draw from class). To use an inside view, you assume non-exchangeability (you are special). You cannot logically be both fully exchangeable and fully non-exchangeable simultaneously. The theory must define the *degree* of exchangeability, which is itself unobservable.
      *   *Another Conflict:* **Stopping the Regress** vs. **Mechanism Sensitivity**. To stop the regress, you need a heuristic for class selection. To be sensitive to mechanism, you need to analyze the specific case. The heuristic often overrides the analysis.

  6.  **Developing the Scorecard:**
      *   Rules to test:
          1.  Always defer where a class exists.
          2.  Defer unless you have a mechanism.
          3.  Split the difference.
          4.  Defer to the narrowest class.
          5.  Outside view as sanity check only.
      *   Evaluate against the Requirements.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the stalemate. Frame this as a "Decision Protocol Spec."
      *   **The Desiderata (The Spec):** Numbered list. Each needs: Definition, Motivation (Case), Status (Non-negotiable/Preference).
      *   **The Impossibility Theorem:** Where does it break? Focus on Exchangeability vs. Specificity.
      *   **The Dominant Constraint:** Which requirement kills the most heuristics? (Likely Reference Class Stability or Causal Isolation).
      *   **Scorecard:** Matrix style.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I separate Modesty and Deference? *Yes, make sure R5 is explicit.*
      *   *Check:* Is the tone neutral? *Avoid saying "The Inside View person is right about X." Instead say "The framework must account for X."*
      *   *Check:* Did I address Endogeneity? *Yes, R3.*
      *   *Check:* Did I address the "Excised Cause" problem? *Yes, R2.*
      *   *Refinement:* The user asked for "which single requirement does the most work." I need to pick one and justify it. "Reference Class Stability" is a strong candidate because it undermines the "narrowest class" rule which is common but flawed. However, "Causal Isolation" is what the Inside View person cares about. Let's look at which one *rules out* the most bad heuristics. Actually, **Exchangeability Verification** (part of R1/R6) is the killer. Most heuristics assume exchangeability without testing it.
      *   *Refinement on Impossibility:* The user guessed "Sensitive to info" vs "Not exploitable." I should validate that but refine it to "Unobservable Exchangeability." We can't *know* if we are exchangeable without running the project, which defeats the purpose.

  9.  **Final Polish:**
      *   Ensure the formatting is clean.
      *   Check word count (keep it dense but readable).
      *   Make sure the "Non-negotiable" vs "Preference" tags are clear.
      *   Ensure the conclusion empowers the team to move forward, even if the theory is imperfect.

  10. **Final Review against constraints:**
      *   "Write it so I could hand it to the teammate who disagrees with me." -> Needs to be very balanced. The Inside View person shouldn't feel this gives them a free pass to ignore stats, and the Outside View person shouldn't feel this dismisses base rates.
      *   "List of requirements with case or consideration behind each."
      *   "Mark non-negotiable vs preferences."
      *   "Tell me which subset... can't be jointly satisfied."
      *   "Which single requirement does the most work."
      *   "Scorecard."

  *(Self-Correction during final output generation)*: I need to be careful not to sound like I'm solving their problem. I am providing the *tool* to solve it. The tone should be "Here is the architecture of the decision engine you are trying to build."

  Let's organize the Desiderata into logical groups: Input (Classes), Processing (Integration), and Output (Decision).

  *Impossibility Insight:* The core tension is that *validating* the inside view requires data that is only available *after* the decision (the success of the mitigation). The Outside View relies on data that ignores the mitigation. The impossibility is **Ex Ante Verification of Non-Exchangeability.**

  *Dominant Requirement:* **Reference Class Stability.** It kills "narrowest class," "always defer," and "split difference" because those don't define *how* to select the class stably.

  Okay, ready to write.
answer: |-
  # Specification: Integrated Forecasting Protocol (IFP) v0.1

  **To:** Project Team
  **From:** [Your Name/Neutral Facilitator]
  **Subject:** Requirements for a Decision Theory on Inside/Outside View Integration

  This document outlines the functional requirements for a decision framework capable of resolving the current stalemate regarding project timeline estimation. It does not advocate for the Inside View (causal modeling) or the Outside View (base rates) as primary. Instead, it specifies what a valid theory must handle to be considered adequate for high-stakes, low-data environments.

  If a proposed decision rule fails any **Non-Negotiable** requirement, it is formally insufficient for this context. **Preference** items indicate areas where teams may weight factors differently based on risk tolerance.

  ---

  ## Part I: Desiderata (The Requirements)

  ### 1. Reference Class Stability (The Regress Stopper)
  *   **Definition:** The protocol must specify a deterministic or bounded-heuristic method for selecting the reference class that does not rely on the forecaster's intuition at the moment of estimation. It must prevent "class shopping" (selecting the class that yields the desired outcome).
  *   **Motivation:** The choice of reference class is itself a judgment call exposed to overconfidence. If the rule is "defer to the narrowest class containing you," a motivated team can always construct a narrower class (e.g., "teams with blue logos") to manipulate the base rate.
  *   **Status:** **Non-Negotiable.** Without this, the Outside View is gamed.

  ### 2. Causal Isolation Verification (The "Excised Cause" Test)
  *   **Definition:** If the Inside View claims a historical failure mode has been removed, the protocol must require evidence that the mitigation is *causally independent* of the team's optimism. It cannot accept a theoretical mechanism alone; it requires prior validation of the mitigation in a context similar enough to transfer validity.
  *   **Motivation:** Every failed historical project likely believed they had "excised the cause" of previous failures. Accepting narrative claims of exceptionality without independent validation defaults to assuming every team is above average.
  *   **Status:** **Non-Negotiable.** Without this, the Inside View is gamed.

  ### 3. Selection Effect Correction (Endogeneity Handling)
  *   **Definition:** The base rate used must be adjusted for the fact that the historical sample consists only of teams who *chose* to attempt the project. The protocol must account for the possibility that the current team is self-selected for optimism in the same way the historical sample was.
  *   **Motivation:** Reference classes are endogenous. If everyone deferred to the base rate, only teams with strong Inside Views would attempt, changing the success rate of "attempters." Treating base rates as exogenous physical constants ignores that they are aggregates of past decisions similar to ours.
  *   **Status:** **Non-Negotiable.** Ignoring this treats social data as physical law.

  ### 4. Variance Sensitivity (Usage Mode Distinction)
  *   **Definition:** The protocol must distinguish between using the Outside View as a *point estimate* (mean/median), a *calibration check* (variance/bounds), or a *decision threshold* (kill switch). High-variance classes are forbidden for point estimates but mandatory for risk bounds.
  *   **Motivation:** A class with enormous spread (e.g., "software projects") is useless for predicting a specific duration (mean) but highly informative for predicting the probability of a blowout (tail risk). Collapsing these uses discards information.
  *   **Status:** **Non-Negotiable.** Using a high-variance mean as a point estimate is statistically negligent.

  ### 5. Forecaster Calibration Decoupling
  *   **Definition:** The protocol must separate *meta-cognitive modesty* (how reliable is this team at estimating?) from *statistical deference* (how predictive is this class?). One can be maximally modest about one's own reliability and still reject a base rate if the class is non-exchangeable.
  *   **Motivation:** People run these together. "I am overconfident, therefore I must use the base rate." This is an error. You might be overconfident, but if the base rate is irrelevant to your mechanism, deferring to it doesn't fix your calibration; it just changes your error source.
  *   **Status:** **Preference.** (Some teams prefer to hard-code modesty as a discount factor; others treat it as a separate variable).

  ### 6. Mechanism-Outcome Alignment
  *   **Definition:** When the narrowest *mechanically-similar* class (shared causal structure) and the narrowest *outcome-similar* class (shared statistics) diverge, the protocol must specify a weighting hierarchy. It cannot simply average them.
  *   **Motivation:** In novel projects, outcome classes are often broad (high variance) while mechanism classes are narrow (low data). If the mechanism suggests speed but the outcome history suggests slowness, the theory must state which carries the burden of proof.
  *   **Status:** **Non-Negotiable.** Ambiguity here leads to stalemate.

  ### 7. Null-Class Handling (First-of-a-Kind)
  *   **Definition:** The protocol must define a fallback state when no reference class exists that satisfies Stability (Req 1) and Alignment (Req 6). It cannot default to "use a broad class" if that violates Variance Sensitivity (Req 4).
  *   **Motivation:** In first-of-a-kind cases, the only classes containing you are absurdly broad. Forcing a base rate in this context creates false precision. The theory must allow for "Knightian Uncertainty" where probability estimates are suspended.
  *   **Status:** **Preference.** (Some organizations require a number for resource allocation even under uncertainty; others allow "no-go" based on unquantifiable risk).

  ---

  ## Part II: The Impossibility Result

  You asked which subset of these desiderata cannot be jointly satisfied. The conflict is not between "Inside" and "Outside." It is between **Requirement 2 (Causal Isolation)** and **Requirement 1 (Reference Class Stability)**.

  **The Tension:**
  To satisfy **Causal Isolation**, you must evaluate the specific, unique details of your team and technology to verify that the historical failure mode is truly gone. This requires deep engagement with the Inside View.
  To satisfy **Reference Class Stability**, you must restrict the ability to claim exceptionality based on specific details, because those details are the very vector for self-serving bias.

  **The Impossibility:**
  There is no *ex ante* metric for "Causal Isolation" that is not itself subject to the Planning Fallacy.
  *   If you demand high evidence for Isolation (to prevent gaming), you effectively veto all innovation, forcing deference to the base rate (violating the spirit of the Inside View).
  *   If you accept lower evidence for Isolation (to allow innovation), you open the door to the exact self-serving claims the Outside View is meant to suppress (violating Stability).

  **The Hard Truth:**
  You cannot simultaneously **verify non-exchangeability** (we are different from the past) and **prevent self-deception** (we think we are different but aren't) using only the information available *before* the project starts. The information required to satisfy Req 2 is usually only generated *during* the project.

  Any theory that claims to solve this is hiding the cost in its priors. You must choose: do you prioritize avoiding False Positives (taking on doomed projects) or False Negatives (rejecting viable innovations)? The math does not decide this; your risk tolerance does.

  ---

  ## Part III: The Dominant Constraint

  If you must select one requirement to rule out the usual rules of thumb, it is **Requirement 1: Reference Class Stability**.

  Most heuristics fail because they assume the reference class is obvious. It is not.
  *   "Defer to the narrowest class" fails because "narrowest" is subjective.
  *   "Defer where a class exists" fails because it allows irrelevant classes (e.g., "construction projects" for software).
  *   "Split the difference" fails because it averages two numbers without validating if the Outside number is applicable.

  Stability forces you to write down the class selection rule *before* looking at the data. If you cannot define the class without referencing your specific hopes for the project, the Outside View is invalid for this decision.

  ---

  ## Part IV: Heuristic Scorecard

  Here is how common decision rules score against the Non-Negotiable requirements.

  | Heuristic | Ref Class Stability | Causal Isolation | Selection Correction | Variance Sensitivity | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **"Always defer where a class exists"** | ❌ | ❌ | ❌ | ❌ | **Reject.** Ignores mechanism and endogeneity. |
  | **"Defer unless you have a mechanism"** | ⚠️ | ❌ | ❌ | ❌ | **Reject.** "Having a mechanism" is too easy; fails Isolation verification. |
  | **"Split the difference"** | ❌ | ❌ | ❌ | ⚠️ | **Reject.** Averages incommensurate values without stability. |
  | **"Defer to the narrowest class"** | ❌ | ⚠️ | ❌ | ❌ | **Reject.** Vulnerable to class-shopping (Stability failure). |
  | **"Outside view as sanity check only"** | ⚠️ | ✅ | ❌ | ✅ | **Viable.** Passes Isolation and Variance, but struggles with Stability and Selection. |

  **Recommendation:**
  The only heuristic that approaches adequacy is **"Outside View as Sanity Check,"** *provided* you add a rigid rule for Reference Class Stability (e.g., "The class must be defined by variables observable to a third party before the project started").

  However, note that even this fails **Selection Effect Correction**. To fully satisfy the spec, you cannot simply *use* a rule. You must acknowledge the **Impossibility Result**: You are choosing between the risk of delusion (Inside View) and the risk of stagnation (Outside View).

  The decision is not about which number is right. It is about which error your team can survive.
