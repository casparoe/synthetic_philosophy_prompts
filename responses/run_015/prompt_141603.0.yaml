answer: |-
  Here is the spec, refined for philosophical load-bearing capacity. I have kept your nine points but tightened the definitions to prevent wiggle room, tagged them by necessity, and flagged the structural tensions.

  ### The Spec: Requirements for Colony-Level Mentality

  **1. Supervenience & Causal Power (The Census Test)**
  *   **Req:** If a complete micro-state description fixes the macro-state, the theory must state whether the macro-state has *causal power* distinct from the sum of micro-causation.
  *   **Why:** To distinguish between a mind that *does* work vs. a pattern that is merely *observed*.
  *   **Tag:** **Non-Negotiable.** (Without causal power, it's epiphenomenal bookkeeping.)

  **2. Integration vs. Aggregation (The Quorum Test)**
  *   **Req:** The theory must distinguish between a threshold switch (mechanical sum) and evidence weighing (semantic integration).
  *   **Why:** A thermostat hits a threshold; a mind updates a belief. The mechanism must support *reason-responsiveness*, not just trigger-happiness.
  *   **Tag:** **Non-Negotiable.** (Distinguishes cognition from cybernetics.)

  **3. Vehicle Location (The Stigmergy Test)**
  *   **Req:** A principled criterion for when environmental structure (tunnels, trails) counts as *memory/processing* vs. *tool/input*.
  *   **Why:** If the nest is the mind, removing the termites must leave a "dead mind" or "memory without a thinker." The theory must specify which.
  *   **Tag:** **Camp Preference.** (Internalists say mind stops at cuticle; Extended Mind theorists say no. A theory can work either way, but must pick.)

  **4. Normativity (The Error Test)**
  *   **Req:** An account of how the colony can *misrepresent* the world (false belief) rather than merely malfunction or exhibit inertia.
  *   **Why:** Content requires the possibility of error. If the trail persists, is the colony *wrong*, or just broken?
  *   **Tag:** **Non-Negotiable.** (The hardest hurdle for naturalized intentionality.)

  **5. Diachronic Identity (The Fission Test)**
  *   **Req:** Conditions for persistence over time and through division. If a colony splits, does the mind split, die, or copy?
  *   **Why:** Minds are subjects of experience/action over time. If identity is indeterminate, the subject is indeterminate.
  *   **Tag:** **Non-Negotiable.** (No subject, no mind.)

  **6. Temporal Coherence (The Grain Test)**
  *   **Req:** A defense of the processing rate. If decisions take days, does the "thought" persist during the gaps?
  *   **Why:** To rule out systems too slow to interact coherently with their environment (e.g., a glacier that "decides" to erode).
  *   **Tag:** **Camp Preference.** (Functionalist views allow slow minds; embodied/enactive views require real-time coupling.)

  **7. Decentralization Constraint (The No Bottleneck Test)**
  *   **Req:** An explanation of how representation is bound without a homunculus or central bus, without collapsing into the "Chinese Nation" triviality.
  *   **Why:** To address the combination problem. Brains bind via synchrony/anatomy; colonies must bind via *what*?
  *   **Tag:** **Non-Negotiable.** (Must explain unity without a center.)

  **8. Evolutionary Alignment (The Conflict Test)**
  *   **Req:** An account of how conflicting evolutionary interests (queen vs. worker vs. male) affect cognitive unity.
  *   **Why:** Neurons don't reproduce; ants do. Internal conflict suggests multiple agents, not one.
  *   **Tag:** **Non-Negotiable for Biological Views.** (Crucial for distinguishing superorganisms from aggregates.)

  **9. Pathology & Hijacking (The Parasite Test)**
  *   **Req:** A distinction between a mind being *controlled* vs. a mind *ceasing to exist* and being replaced.
  *   **Why:** To define the boundaries of agency. If a fungus drives the colony, is the colony a puppet or a corpse?
  *   **Tag:** **Camp Preference.** (Depends on whether you define mind by history/function or current organization.)

  ---

  ### Structural Tensions (Incompatible Pairs)

  You were right to suspect trade-offs. Here are the two critical friction points:

  1.  **Sharp Identity vs. Fluid Boundaries:**
      *   *Conflict:* **Diachronic Identity (5)** demands clear persistence conditions. **Vehicle Location (3)** + **Decentralization (7)** implies boundaries are fuzzy and distributed.
      *   *Result:* You cannot have a strict "ship of theseus" identity condition *and* a fully extended, fluid stigmergic mind. A theory that embraces extended stigmergy must accept that identity is conventional or degree-based, which weakens the "subject" status required for (5).

  2.  **Decentralization vs. Non-Triviality:**
      *   *Conflict:* **Decentralization Constraint (7)** wants to allow distributed systems. **Normativity (4)** + **Integration (2)** wants to exclude traffic jams and stock markets.
      *   *Result:* If you loosen the binding mechanism enough to fit an ant colony (no central boss), you inevitably let in stock markets. If you tighten it to exclude markets (e.g., requiring evolutionary selection), you risk excluding human crowds or AI swarms. You usually have to sacrifice **Substrate Neutrality** to save **Non-Triviality**.

  ---

  ### The Killer Constraint

  **Colony-level Error (Normativity).**

  This is the single requirement that excludes the most candidate theories.
  *   **Why:** It forces a theory to explain *aboutness* without an observer.
  *   **The Aggregate View** fails because ants following a stale trail is just physics, not falsehood.
  *   **The Pure Stance View** fails because "error" becomes "useful to predict as error," making truth observer-relative (bookkeeping).
  *   **The Superorganism View** struggles because without a selected function for the *colony as a whole* (distinct from the queen's genes), "error" lacks a teleological ground.

  ---

  ### Theory Evaluation (Brief)

  **1. Superorganism / Extended Functionalist**
  *   **Performance:** Passes **Integration** and **Decentralization** well (treats colony as brain).
  *   **Failure:** Crashes on **Evolutionary Alignment (8)**. Because workers/queens have conflicting genetic interests, the "single mind" analogy breaks down into a parliament of rivals. It also struggles with **Error (4)** unless it posits group-level selection strongly.

  **2. Aggregate / "Nothing There"**
  *   **Performance:** Passes **Census (1)** and **Identity (5)** trivially (there is no colony mind to track).
  *   **Failure:** Fails **Normativity (4)** and **Integration (2)**. It cannot explain why we treat the colony *as if* it has beliefs without admitting there is a functional reality to those beliefs. It reduces Aunt Hillary to a metaphor, not a mechanism.

  **3. Pure Intentional Stance (Dennettian)**
  *   **Performance:** Passes **Error (4)** pragmatically (it's an error if the prediction fails).
  *   **Failure:** Fails **Census (1)** on realism. It admits Aunt Hillary is a "bookkeeping convenience," which concedes the argument to Dave. It saves the phenomena by denying the ontology.
