      *   *Correction:* User describes $Z$ as "caused by the outcome." If $Y \rightarrow Z$, then $Z$ is a descendant of $Y$. Conditioning on a descendant of $Y$ is generally bad but technically conditioning on $Y$ itself is the issue. If $T \rightarrow Z \leftarrow U \rightarrow Y$, that's a collider. The user says "split variable... partly caused by the outcome." This implies $T \rightarrow Y \rightarrow Z$. If we condition on $Z$, we are conditioning on a proxy for $Y$. This creates bias. I should clarify the "Collider" vs "Post-Treatment" distinction. Let's stick to **Post-Treatment Bias** as the umbrella, often manifesting as Collider Bias.
      *   *Refining V2:* The user asks for the term for the *mistake*. It's "Over-adjustment." The term for the *quantity* is "Total Effect."
