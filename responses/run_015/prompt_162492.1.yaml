answer: |-
  You have stumbled onto the central insight of modern causal inference, the kind that usually takes a graduate seminar to crystallize. You are absolutely correct: the algebraic table is identical in all three cases, but the *causal topology* is completely different. The numbers cannot tell you which version you are in; only your knowledge of the clinical process can.

  In the philosophy of science and statistics literature (specifically the Structural Causal Model framework pioneered by Judea Pearl and others), these are not just "versions of Simpson's Paradox." They are distinct structural relationships that happen to produce the same arithmetic reversal.

  Here is the carving you are looking for.

  ### 1. The Three Topologies

  You need to stop thinking about "subgroups" and start thinking about **arrows**. In your data, you have Treatment ($T$), Outcome ($Y$), and the Split Variable ($Z$). The question is: where do the arrows point?

  #### Version One: The Confounder (Pre-Treatment Heterogeneity)
  *   **The Structure:** $Z \rightarrow T$ and $Z \rightarrow Y$.
  *   **The Story:** Severity ($Z$) makes patients sicker ($Y$) and also makes doctors more likely to assign the new procedure ($T$).
  *   **The Status of $Z$:** $Z$ is a **Confounder**. It is a common cause.
  *   **The Verdict:** The stratified (split) number is the **Causal Effect**. The overall (marginal) number is biased.
  *   **The Name:** This is standard **Confounding**. When it produces a reversal, it is the classic **Simpson's Paradox**.
  *   **Action:** You *must* adjust for $Z$. If you don't, you are lying.

  #### Version Two: The Mediator (Mechanism Obstruction)
  *   **The Structure:** $T \rightarrow Z \rightarrow Y$.
  *   **The Story:** The Program ($T$) causes patients to Exercise ($Z$), and Exercise causes better Function ($Y$).
  *   **The Status of $Z$:** $Z$ is a **Mediator**. It is on the causal pathway.
  *   **The Verdict:** The overall (marginal) number is the **Total Effect**. The stratified number is the **Direct Effect** (the effect of the program *excluding* the exercise component).
  *   **The Name:** The mistake you described (reporting the split numbers as the main result) is called **Over-adjustment Bias** or **Adjusting for an Intermediate**.
  *   **Action:** If your boss asks "Does the program work?", you quote the **Total Effect** (the overall number). If they ask "Does the program work *independent of* exercise?", you quote the Direct Effect. In your clinic context, the Total Effect is almost always the right answer, because exercise adherence is part of the product you are selling.

  #### Version Three: The Collider (Outcome-Dependent Selection)
  *   **The Structure:** $T \rightarrow Z \leftarrow U \rightarrow Y$ (or $Y \rightarrow Z$).
  *   **The Story:** You split by "Still in pain at 3 weeks" ($Z$). Pain is caused by the Outcome ($Y$) or by the Treatment ($T$) and other unmeasured factors ($U$).
  *   **The Status of $Z$:** $Z$ is a **Collider** (or a Descendant of a Collider). It is an effect, not a cause.
  *   **The Verdict:** Both numbers are suspect, but the stratified number is **meaningless**. By conditioning on $Z$ (an outcome), you induce a spurious correlation between $T$ and any other causes of $Z$. You are essentially comparing apples to oranges within the strata because you've selected the sample based on the result.
  *   **The Name:** **Collider Stratification Bias** or **Post-Treatment Bias**.
  *   **Action:** Do not split. Do not adjust. This stratification manufactures a relationship that doesn't exist.

  ---

  ### 2. The Vocabulary You Asked For

  You asked for specific terms for the Version 2 mistake and the target quantity.

  *   **The Mistake:** In econometrics and epidemiology, this is **Over-adjustment Bias**. In causal diagrams, it is **Blocking the Causal Path**. You are effectively asking, "What is the effect of the treatment if we hold the mechanism constant?" which is often a nonsensical question for policy.
  *   **The Target Quantity:** In Version 2, the number you actually want (the overall number) is the **Total Causal Effect**. The number you get when you split (the stratified number) is the **Controlled Direct Effect**.
  *   **The Version 3 Mistake:** This is **Selection Bias** induced by conditioning on a collider.

  ---

  ### 3. The Mixed Case (The Physio Reality)

  This is the hardest and most important part for your work. You asked: *"What about a stratifier that is both, partly a reason people ended up in the treatment group and partly caused by the treatment?"*

  Example: **Exercise Adherence.**
  1.  **Mediator Path:** The Program ($T$) encourages Adherence ($Z$). ($T \rightarrow Z$)
  2.  **Confounder Path:** Motivated Patients ($U$) are more likely to sign up for the Program ($T$) AND more likely to have high Adherence ($Z$). ($U \rightarrow T$, $U \rightarrow Z$)

  This creates a "M-structure" or a scenario of **Time-Varying Confounding**.

  **The Problem:**
  *   If you *don't* adjust for Adherence ($Z$), you get the Total Effect (good), but if Motivation ($U$) is unmeasured, your estimate of the Total Effect might be confounded by $U$ anyway (depending on the exact graph).
  *   If you *do* adjust for Adherence ($Z$), you block the mediator path (underestimating the Total Effect) AND you potentially open a "collider path" between Treatment and Unmeasured Motivation, inducing bias.

  **The Hard Truth:**
  With standard regression on observational data (the kind you likely run in Excel or standard SQL), **this quantity is often not identifiable.** You cannot cleanly separate the effect of the program *on* adherence from the effect of adherence *due to* motivation.

  **The Solution (The "Carving"):**
  In advanced causal inference, we handle this with **G-Methods**, specifically **Marginal Structural Models (MSMs)** using Inverse Probability Weighting.
  *   *Concept:* Instead of splitting the data (stratifying), you weight the patients. A patient who had low probability of adhering but did adhere gets weighted up. A patient who had high probability of adhering gets weighted down.
  *   *Why:* This creates a "pseudo-population" where adherence is no longer correlated with the baseline motivation, effectively randomizing the mediator without blocking the path.

  **Can you do this with your data?**
  Probably not easily. It requires modeling the probability of adherence at every time step. If you cannot do MSMs, you must default to the **Intention-to-Treat (ITT)** principle: Analyze based on assignment to the program, regardless of adherence. This estimates the **Total Effect of Assignment**, which is usually the business question ("Is this program worth buying?").

  ---

  ### 4. How to Tell Them Apart in the Wild

  Since the tables look identical, you cannot use statistics to distinguish V1, V2, and V3. You must use **Temporal Logic** and **Domain Knowledge**.

  **Heuristic 1: The Time Test**
  *   Did $Z$ exist *before* $T$ started?
      *   Yes: Likely V1 (Confounder). Adjust for it.
      *   No: Likely V2 or V3. Do not adjust (unless you specifically want direct effects).

  **Heuristic 2: The Intervention Test**
  *   If you forced $Z$ to be equal for everyone (e.g., forced everyone to do 5 exercises), would the effect of $T$ change?
      *   If yes, $Z$ is a Mediator (V2).
      *   If no, $Z$ is a Confounder (V1).

  **Heuristic 3: The "Bad Outcome" Test (for V3)**
  *   Is $Z$ a sign that things are going wrong? (e.g., "Referral for Imaging", "Still in Pain").
      *   If yes, $Z$ is likely a Collider/Descendant of Outcome. **Never stratify on this.** It is selection bias. You are comparing "People who didn't get better despite treatment" vs "People who didn't get better without treatment." That is a comparison of resilience, not efficacy.

  ### 5. A Proposed Terminology for Your Clinic

  Since you asked me to coin terms if the field lacks them (though the field has them, they are academic), here is a pragmatic vocabulary for your meetings with your sister and the clinicians:

  1.  **The "Apples-to-Apples" Split (V1):** *Risk Adjustment.*
      *   *Definition:* Splitting by pre-existing severity.
      *   *Rule:* **Mandatory.** The overall number is a lie.
  2.  **The "Mechanism" Split (V2):** *Pathway Blocking.*
      *   *Definition:* Splitting by adherence or intermediate progress.
      *   *Rule:* **Forbidden** for efficacy claims. It answers "Does the treatment work if we break its mechanism?"
  3.  **The "Survivor" Split (V3):** *Outcome Conditioning.*
      *   *Definition:* Splitting by status at a follow-up (pain, imaging, dropout).
      *   *Rule:* **Toxic.** It creates fake effects.

  ### Summary for your Argument

  When you argue with your sister:
  *   If the split variable is **Severity at Intake**: She is right. Show the split numbers. (Confounding).
  *   If the split variable is **Exercise Adherence**: You are right. Show the overall numbers. (Mediation).
  *   If the split variable is **Pain at Week 3**: You are both wrong to look at split numbers. Throw that analysis away. (Collider Bias).

  The "Paradox" isn't that the numbers reverse. It's that we keep asking the numbers to tell us about causality without drawing the arrows first. The table is just the shadow; the DAG (Directed Acyclic Graph) is the object. You need to draw the arrows before you run the regression.
