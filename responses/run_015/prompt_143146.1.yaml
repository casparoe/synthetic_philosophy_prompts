answer: |-
  **Principle: Protective Necessity with Agency Constraints**
  Force is permissible iff:
  1.  **Defensive Aim:** It prevents serious physical harm to innocents (including self). (Motivated: Wrestler, Sleepwalker).
  2.  **Specific Pre-emption:** Preventive coercion requires certainty regarding a specific agent's intent. (Motivated: Basement).
  3.  **Consent Limits:** Consent validates risk but not irreversible harm or death. (Motivated: Boxing vs. Death Match).
  4.  **Directness Constraint:** Direct infliction of harm is forbidden unless meeting 1-3; indirect contribution is permissible. (Motivated: Truck vs. Taxes).
  5.  **Non-Punitive:** Force cannot be solely retributive. (Motivated: Execution).

  **Inconsistencies & Drops**
  Your gut holds two views: a **Rights-Based View** (execution bad, revolt good) and a **Harm-Based View** (basement good, sabotage 50/50). This principle prioritizes Harm-Based consistency.
  1.  **Slave Revolt:** You must drop the verdict that *all* revolt violence is fine. If it exceeds proportionality or targets non-combatants, this principle condemns it, aligning it with your execution verdict (punitive/excessive harm).
  2.  **Factory Sabotage:** Drop the 50/50. Without imminent harm prevention, this is property destruction, not defense. Condemn it.
  3.  **Unloaded Gun:** Drop the "cleaner" intuition. Deception undermines the moral authority of the threat. It's permissible only if truly necessary, not "cleaner."

  **New Cases**
  1.  **Drone Data Centre:** Impermissible. Like taxes, this is indirect complicity. Sabotage becomes direct harm infliction without the immediacy required by Clause 1.
  2.  **Defensive Conscription:** Impermissible. Direct participation violates Clause 4. The state's defensive aim does not justify your direct agency in killing.
  3.  **Property vs. Body:** Violence against property is permissible only instrumentally—to stop body violence. Smashing a window to escape a fire is fine; smashing it to punish the owner is not. Property lacks an intrinsic moral shield against defense, but not against punishment.

  **Least Force Analysis**
  The clause is not merely laundering squeamishness; it enforces proportionality (Shove vs. Cripple). However, your gun intuition suggests you value **Minimum *Effective* Force**. You prefer the gun because it minimizes *your* physical risk and engagement, not necessarily the threat level. The principle should read "Minimum *Effective* Intervention," acknowledging that psychological threats are force. If a shove works, crippling is wrong not because it's violent, but because it's *excessive* relative to the goal.
