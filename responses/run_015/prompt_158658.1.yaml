answer: |-
  Based on Maya's track record, here is the breakdown of her ethical framework, her likely verdict on Finland, and the philosophical rules at play.

  ### 1. The Finland Prediction
  **Maya will say the tourist is bound by the invisible queue.**

  Even though there is no physical line, the "silent tracking" is the local mechanism for establishing **fairness** (first-come, first-served). In her view, standing too close or boarding out of turn isn't just a social faux pas; it is **free-riding on the information system**. The locals are doing the cognitive labor of tracking arrival order; a tourist who ignores this gains an unfair advantage (boarding earlier than their arrival time warrants) and creates social friction (the "invasive" feeling).

  She treats the Finnish bus stop like the London queue, not the Naples scramble. The *function* of the norm is fair distribution of a resource (seats/boarding priority), so violating it is a moral wrong, even if the enforcement is silent.

  ### 2. Rule A vs. Rule B
  You asked if she is running:
  *   **Rule A:** "Local coordination norms always bind visitors."
  *   **Rule B:** "Only norms that prevent harm or free-riding."

  **Neither fits perfectly, but Rule B is closer if "harm" is defined broadly.**

  *   **Why Rule A fails:** If *all* coordination norms bound visitors, Maya would have to argue that tourists must adopt purely symbolic local customs (e.g., "don't wear red on Tuesdays" in a specific village). Her distinction between London (queue) and Naples (scramble) suggests she evaluates the *purpose* of the norm, not just its existence. In Naples, queue-jumping is coordinated behavior, yet she excuses it. Rule A cannot explain why Naples is permissible.
  *   **Why Rule B struggles:** If "harm" means immediate physical or financial damage, Rule B fails the **Berlin Test**. Jaywalking at 3am with zero cars causes no immediate harm and no free-riding (no one gains an advantage). Yet, she condemns it. She justifies this via "eroding a shared commitment." This implies she counts **systemic integrity** as a form of harm, which stretches Rule B significantly.

  ### 3. The Splitter Case
  To split Rule A (Coordination) and Rule B (Harm/Free-riding), you need a norm that is **coordinated but functionless.**

  **The Case:** *The "Sunday Whistle" Norm.*
  Imagine a small town in Austria where, by unwritten custom, no one whistles on Sundays. It's not religious, not noise-pollution related (it's 2pm), and no one is offended if a tourist does it; it's just a "thing we don't do."
  *   **Rule A (Coordination):** The tourist should not whistle. It is a local coordination norm.
  *   **Rule B (Harm/Free-riding):** The tourist can whistle. It causes no harm, no offense, and no unfair advantage.
  *   **Maya's Likely Verdict:** The tourist can whistle.
  *   **Why:** This splits the rules. If she follows Rule A, she must forbid it. If she follows Rule B (or her actual logic), she permits it. This proves she isn't a cultural relativist (Rule A); she requires a functional justification.

  ### 4. The Third Rule: "Functional Constitutivism"
  There is a third rule that fits her verdicts (especially Berlin vs. Saigon) better than A or B.

  **Rule C:** *"Visitors must adhere to norms that constitute the operational integrity of the local social system."*

  This rule focuses on whether the norm is the **engine** that makes the system work, rather than just "harm" or "coordination."

  *   **Berlin (Jaywalking):** The system is **Rule-Based Order**. The safety and flow rely on everyone internalizing the rule. Breaking it at 3am undermines the *habit* that keeps the system safe at 3pm. The norm *constitutes* the safety.
  *   **Saigon (Traffic):** The system is **Flow-Based Negotiation**. The safety and flow rely on constant movement and eye contact. Stopping for a red light (Western rule) would actually *break* the system and cause accidents. The norm of "weaving" *constitutes* the safety.
  *   **London vs. Naples:** In London, the queue *constitutes* fairness. In Naples, the "scramble/assertiveness" *constitutes* access. Jumping a London queue breaks the engine; jumping a Naples scramble is just running the engine.
  *   **US vs. Japan Tipping:** In the US, tips *constitute* the wage (economic viability). In Japan, service dignity *constitutes* the transaction; tipping breaks that engine.
  *   **Finland:** The silent tracking *constitutes* the fairness mechanism.

  ### 5. The Best Match
  **Rule C (Functional Constitutivism) is the best match.**

  It explains the **Berlin vs. Saigon** distinction perfectly, where Rule B struggles.
  *   **Rule B** has to argue that 3am jaywalking causes "harm." Maya admits there are no cars. She has to rely on abstract "erosion."
  *   **Rule C** simply identifies that Berlin runs on *Deontological Infrastructure* (rules are the infrastructure), while Saigon runs on *Consequentialist Infrastructure* (outcomes/flow are the infrastructure).

  In Berlin, the *act* of following the rule is the contribution to the system. In Saigon, the *outcome* of smooth flow is the contribution. Maya is judging tourists on whether their actions support or degrade the **underlying operating system** of the society they are visiting, not just on immediate harm or blind adherence to custom.

  **Summary for your argument:** Tell Maya she isn't a relativist (Rule A) or a simple utilitarian (Rule B). She is a **Social Systems Functionalist**. She believes tourists are morally obligated to keep the local "social machine" running, whether that machine runs on rigid rules (Berlin/London/Finland) or fluid negotiation (Saigon/Naples). The Finnish invisible queue is definitely binding because it is the gear that turns the fairness engine.
