prompt: |-
  I've been arguing with my friend Maya about travel ethics and she has this consistant track record on conventions. She says in the US not tipping is basically theft even if you're a tourist who just landed, in Japan you should never tip even if it feels rude not to, queue-jumping in London is a real moral wrong but in Naples it's more like breaking an etiquette game with no deep weight. She also thinks jaywalking in Berlin at 3am with zero cars is still wrong because you're eroding a shared commitment, but in Saigon where traffic is just continuous negotiation she doesn't think visitors are morally failing by weaving through however they can.

  Now she mentioned Finland — apparently at bus stops people don't form a visible line but stand in this loose spread and everyone silently tracks who arrived when, and if you stand right behind someone like in New York you're being invasive even though there's no line to technically cut. She hasn't said whether a tourist has to learn that invisible queue, but I want to predict her take. Is she running "local coordination norms always bind visitors" versus "only norms that prevent harm or free-riding"? What'd she say about the Finnish cluster, and what further case would actually split those two rules? I'm also curious if there's a third rule that fits her earlier verdicts just as well, and if so which one is the best match for her Berlin vs Saigon distinction.
