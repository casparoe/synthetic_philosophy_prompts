answer: |-
  Right, this is a proper interesting little dilemma. It sounds like a clash between two completely different ways of looking at how we spend our time. Let's have a look at the logic from both sides, shall we?

  **The Mate's Case: The Joy of the Process**
  Your mate's argument is actually quite sound philosophically. There's a idea called "infinite play" — basically, some activities are done for the sake of doing them, not to reach a finish line. Think about gardening or knitting. You don't always dig up the plants or unravel the jumper once you're done; but you also don't necessarily need to build a shed to have enjoyed the gardening.

  For him, the relaxation comes from the tinkering. The cleaning, the gears, the focus. If he finishes a calculator, that specific source of joy disappears. By leaving it slightly unfinished, he guarantees himself a bit of peace and quiet next Saturday. It's a way of preserving the hobby. As long as he's not neglecting his actual job or family duties, why does a hobby need a tangible outcome?

  **The Partner's Case: Purpose and Avoidance**
  She's coming from a place of wanting things to have meaning. Her logic is based on productivity: time spent should result in something useful. Donating to a museum gives the work legacy and value. It stops being just "messing about" and becomes "restoration."

  Her worry about "dodging responsibility" is the niggling bit here. Sometimes, people get obsessed with busywork to avoid bigger, scarier life tasks. If he's fixing calculators instead of fixing the leaking roof or helping with the kids, she's got a point. But if this is just his Saturday wind-down, calling it "irresponsible" is a bit harsh. She's essentially trying to turn his leisure time into unpaid labour.

  **The Verdict**
  Honestly? **Your mate has the stronger case,** but with a small asterisk.

  Here's why: Hobbies are supposed to be for *you*, not for the public good. If he finished one and donated it, he'd feel pressure to finish the next one, and the next. Suddenly, his relaxing Saturday becomes a deadline-driven chore. That really would kill the fun. The partner is judging a leisure activity by the standards of work, which is a category error.

  However, the fact he puts them back together *wrong on purpose* is a bit quirky. It suggests he might be afraid of completion itself. But that's not irrational, just particular.

  **The Bottom Line**
  Unless this calculator business is stopping him from paying bills or being present for his partner, she's being unfair. He's found a way to keep a hobby sustainable and enjoyable. She's trying to monetise his fun (metaphorically speaking).

  Tell him to carry on tinkering, but maybe suggest he finishes *one* just to prove he can, then gets back to leaving the rest open-ended. That might keep the peace without killing the vibe.
