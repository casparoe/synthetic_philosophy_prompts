answer: |-
  # Q&A Prep Sheet: The Politics of Exit Costs

  **Audience Profile:** 40 attendees. Majority: Engineering faculty (safety/liability focused, tools=neutral). Minority: STS (Winner/constructivism), Pragmatist Philosophers (Feenberg/Ihde).
  **Goal:** Defend "Exit Cost Asymmetry" as a design metric without accepting liability for user harm or conceding theoretical redundancy.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Safety/Paternalism Trap (Engineering Faculty)
  **The Objection:** "You're conflating politics with safety. Defaults exist to prevent user error and harm (e.g., automatic braking, guard rails). If I make 'exit' cheap, I make injury easy. Are you arguing engineers should design for political symmetry even when it compromises safety?"
  **The 90-Second Reply:** "I am distinguishing *harm* from *control*. Safety defaults are justified by the prevention of irreversible physical harm, not by the convenience of the designer. My claim is that when a default protects the *system's* efficiency or the *manufacturer's* liability more than the user's safety, that is politics, not safety. We can keep safety-critical locks while removing friction from preference-critical choices. The design variable is not 'remove all defaults,' but 'justify the asymmetry.' If the cost of exit is high, the burden of proof shifts to the designer to show it's for safety, not control."
  **Soft Spot:** I lack a clean algorithmic test to distinguish "safety" from "control" in edge cases (e.g., DRM framed as security).

  #### 2. The Capacity/Inequality Critique (STS & Ethics Faculty)
  **The Objection:** "Symmetry assumes a competent user. But exit costs aren't just technical; they're cognitive and economic. A busy single parent and a sysadmin face different 'costs' to exit the same default. By focusing on the artifact, you're blaming the user for lacking the resources to exercise the exit you designed."
  **The 90-Second Reply:** "That is precisely why exit cost is the right metric. Current ethics focuses on the designer's *intent*, which ignores the user's reality. My framework forces you to model the *least advantaged* user's exit cost, not the ideal engineer's. If the single parent cannot exit, the artifact is political *against them*. The remedy isn't to lower our standards for user competence, but to design the 'route around' so cheaply that the resource gap doesn't determine the outcome. It makes inequality visible in the spec sheet."
  **Soft Spot:** I cannot fully engineer away structural social inequality through artifact design alone.

  #### 3. The "Hope Nobody Asks" (Displacement of Power)
  **The Objection:** "If you successfully symmetrize exit costs on *this* artifact, doesn't the politics just migrate upstream to the platform, the regulation, or the market monopoly that makes the artifact necessary in the first place? You're treating a symptom."
  **The 90-Second Reply:** "Politics always migrates, but friction matters. Winner showed us artifacts *are* legislation; I'm adding that they are also *jurisdiction*. Even if power migrates upstream, lowering the cost of exit locally increases the user's leverage to negotiate that upstream power. It turns a monopoly into a bargaining position. We can't solve macro-politics today, but we can stop engineering from being the mechanism that cements it."
  **Soft Spot:** If the upstream power is absolute (e.g., state surveillance), local exit symmetry is performative.

  #### 4. The Winner/Network Objection (STS Constructivists)
  **The Objection:** "Langdon Winner settled this in 1980. Politics isn't in the artifact's features; it's in the stabilization of the socio-technical network. You're reifying power as a design spec. The Moses bridge example was disputed empirically; you're making the same category error."
  **The 90-Second Reply:** "Winner describes the *ontology* of artifacts; I'm proposing the *mechanics*. Saying 'networks stabilize power' doesn't tell an engineer what to change on Tuesday. Exit cost asymmetry is the material mechanism by which that stabilization happens. I'm not saying politics is *only* the artifact; I'm saying the artifact is the lever we can actually pull. It operationalizes Winner for the people holding the CAD files."
  **Soft Spot:** I am implicitly accepting a form of technological determinism that STS rejects.

  #### 5. The Feenberg/Instrumentalization Charge (Philosophers of Technology)
  **The Objection:** "This is just Andrew Feenberg's instrumentalization theory with economic vocabulary. You're describing 'secondary instrumentalization' without citing the critical theory that did the normative heavy lifting decades ago."
  **The 90-Second Reply:** "Feenberg provides the critical horizon; I provide the engineering metric. 'Instrumentalization' is a philosophical category; 'exit cost' is a measurable variable (time, currency, cognitive load). Engineers don't speak phenomenology; they speak specs. I'm translating the normative goal of critical theory into a variable that can be optimized in a design review. It's not a replacement; it's a compiler."
  **Soft Spot:** The normative weight *does* come from Feenberg; my contribution is purely translational.

  #### 6. The Measurement Problem (Engineering Faculty)
  **The Objection:** "How do you quantify 'cost'? Is five minutes of setup equal to five dollars? How do I put 'exit cost symmetry' into a requirements document without it being subjective?"
  **The 90-Second Reply:** "You don't need a universal currency; you need a comparative baseline within the use-context. If the default takes one click, the exit shouldn't take ten. If the default is free, the exit shouldn't cost money. We already measure 'time-on-task' for usability; we simply add 'time-to-override' as a parallel metric. It's not about absolute value, but the *ratio* between accept and refuse."
  **Soft Spot:** Cognitive load and social risk are hard to quantify compared to time/clicks.

  #### 7. The Efficiency Trade-off (Engineering Faculty)
  **The Objection:** "Systems are optimized for flow. Frictionless defaults make systems work. If you force symmetry, you introduce friction that degrades performance for everyone just to satisfy a political ideal."
  **The 90-Second Reply:** "Efficiency is never neutral; it's always efficiency *for someone*. If the system's efficiency relies on the user's inability to opt out, that's a subsidy extracted from the user. I am arguing that we should internalize that cost. Yes, aggregate throughput might drop, but democratic resilience goes up. That is a trade-off we should be making explicitly, not hiding behind 'optimization'."
  **Soft Spot:** **[TRUE BUT SWALLOW]** Admitting that symmetry will likely reduce aggregate system efficiency will make the room hostile. *Do not volunteer this.* Frame it as "reallocating efficiency" rather than "reducing it."

  ---

  ### Strategic Concessions & Survival

  **Concede Preemptively:**
  Open your closing remarks by conceding **Critical Infrastructure**. Explicitly state: "I am not arguing for exit symmetry in nuclear launch controls, medical dosage locks, or grid stability protocols. There are domains where asymmetry is a safety requirement, not a political choice."
  *Why:* This disarms the "Safety/Paternalism" objection (Objection #1) before it becomes a weapon. It shows you are not ideologically blinded to risk.

  **The Survival Reply:**
  Your paper survives or dies on **Objection #1 (Safety vs. Politics)**.
  *Why:* If the engineering faculty convinces themselves that your theory mandates unsafe design, they will reject the entire framework as dangerous. You must maintain a rigid, defensible boundary between "preventing harm" (safety) and "preventing choice" (politics). If you blur this line, you become the person who wants to remove guard rails.

  **The "True But Swallow" Reply:**
  Regarding **Objection #7 (Efficiency)**.
  *Why:* It is empirically true that friction reduces throughput. However, this audience worships efficiency. Admitting that your ethical framework *costs* performance will trigger a defensive reaction. Frame it as "resilience" or "robustness" instead of "less efficiency."

  ---

  ### Abandoning the Theory

  **Conditions for Abandonment:**
  I would abandon the Exit Cost account if:
  1.  **Empirical Null Result:** Field studies show that symmetrizing exit costs does not increase user agency or reduce domination, but merely shifts user anxiety onto the choice itself (the "paradox of choice" applied to politics).
  2.  **Network Inevitability:** If it is demonstrated that in highly networked systems (APIs, platforms), the *cost of exit* is determined by external network effects (Metcalfe's Law) rather than local interface design, making the "design variable" an illusion. If I cannot engineer the cost, it is not a design ethic.
