  - The precise question (about 150 words):
  Bentham argues same-sex acts warrant no punishment because they cause no direct physical harm. Standard interpretations cast him as a straightforward harm-reduction liberal, assuming his utilitarian calculus naturally excludes moralistic condemnation. However, this overlooks whether Bentham implicitly relies on a distinction between tangible injury and symbolic contamination to dismiss public outrage as irrelevant. If public disgust constitutes pain within his hedonic calculus, ignoring it requires justification beyond simple act-utilitarianism. The specific core question is whether Bentham's sexual ethics depend on an unstated hierarchy of harms that privileges physical integrity over moral sentiment, and if so, whether this hierarchy is consistent with his act-utilitarian penal theory. Resolving this matters because if Bentham secretly imports rule-utilitarian commitments to protect sexual liberty, his broader claim to a unified, scientific penal code based solely on consequences ultimately collapses. This investigation tests the coherence of his liberal conclusions against his foundational philosophical mechanics.

  - Approach and method (about 200 words):
  The project employs comparative textual analysis mapping the structure of harm-claims in Bentham's sexual-ethics fragments against his established penal theory. First, I will catalog instances where Bentham dismisses public disgust as irrelevant pain versus where he acknowledges secondary mischief in other offenses. Second, I will test whether excluding moral sentiment from the calculus requires a rule-based exception or if it follows strictly from act-utilitarian first principles regarding evidence and proof. Cross-referencing findings with his definitions of mischief in the Introduction to the Principles of Morals and Legislation. The three-month plan divides into phases. Month one focuses on isolating relevant passages concerning sexual offenses and comparing them to his treatment of religious or political offenses where public sentiment is weighed differently. Month two involves constructing the logical model to see if the exclusion of moral harm holds under pure act-utilitarianism, specifically examining how he calculates the pain of punishment versus the pain of the act. Month three refines the argument, addressing counter-interpretations where Bentham might implicitly rely on long-term rule stability to override immediate harm calculations. This method avoids broad biographical surveying, sticking strictly to the structural consistency of his argumentation regarding harm classification and penal justification within the specified timeframe.

  - What success and failure look like (about 150 words):
  Success yields a reconstructed harm-taxonomy that demonstrates whether Bentham's exclusion of moral contamination is internally consistent. A positive outcome shows how act-utilitarianism can dismiss symbolic harm without covert rule-utilitarian assumptions, strengthening the philosophical foundation of his penal reforms. The deliverable will be a concise paper articulating this reconstructed logic, useful for scholars debating the coherence of classical utilitarian liberalism. Failure occurs if the analysis reveals an irreconcilable contradiction, proving Bentham shifted frameworks unnoticed when discussing sexuality. Additionally, failure includes the risk that the fragmentary nature of his sexual ethics writings prevents definitive conclusions. If the texts are too incomplete to determine whether he systematically excluded moral sentiment or simply ignored it ad hoc, the project cannot validate the consistency claim. In this scenario, the output will document the specific gaps preventing resolution, which remains valuable by clarifying the limits of scholarship on Bentham's unpublished manuscripts regarding sexual liberty and penal coherence.

  - Scope, risks, and deliverable (about 100 words):
  Three months part-time is adequate as the scope focuses on structural consistency rather than comprehensive exegesis. The biggest specific obstacle is engaging deeply with secondary literature on rule-utilitarian interpretations, which could expand the project beyond the timeframe. Staying focused on primary textual mechanics mitigates this risk. The finished final output will be an analytical essay providing a clear verdict on the consistency of Bentham's harm principle. This helps researchers studying Bentham's intellectual legacy by clarifying whether his liberal sexual ethics stand on firm utilitarian ground or require philosophical revision, offering a precise concrete tool for evaluating his broader penal philosophy.
