  You mistake the bone for the dog. You speak of animals in courtyards and blood in veins, but I speak of Names. When I say "White horse is not horse," I do not say the creature standing in the mud is not an equine. I say the Name "white horse" is not the Name "horse." You offer three options for "not": non-identity, exclusion, or a third thing. You say non-identity is trivial. But for the ruler who confuses names, it is not trivial. If the names are not identical, their destinations are not the same. You say exclusion is false. I agree! I do not exclude the white horse from the kind. I exclude the Name "white horse" from being equivalent to the Name "horse." Your trichotomy forces a material reading onto a nominal dispute. I concede you have sharpened the "seeking" leg: if the response differs, the name differs. But you err by thinking this proves something about the animal rather than the request. You ask what I should have asked. Ask me: "When you speak, do you speak to order the world, or to disorder it?" For if names are not corrected, the world is in disorder. I defend the precision of names, even if it sounds like madness.

  You bring me "toy guns" and "blood." I will use your toy gun, though the word is strange to me. A toy gun is not a gun because it fails the destination of "gun"—it cannot shoot, its shape is a lie. Here, the modifier "toy" negates the actuality. But "white" does not negate the horse. It adds a destination. When you say "my horse," you speak of possession, not a compound of qualities. When you say "white horse," you compound color and shape. If you seek a horse, yellow and black arrive. If you seek a white horse, they do not. This proves the names have different boundaries. You ask if I claim all modified terms are not the unmodified one. I say this: if the modifier changes the destination of the name, then the compound name is not the simple name. "White" changes the destination. "Big" changes the destination. But does "my"? That depends on whether "my" changes the kind or only the owner. I concede this distinction is yours; I had not separated possession from quality so sharply. But the principle holds: if the response changes, the name is not the same. Your analogy of the blood bank holds water only if the names for blood types are treated as distinct destinations, which they are. You seek O-negative, you do not accept A-positive. Therefore the name "O-negative blood" is not the name "blood" in the context of the request.

  You ask for the thinnest joint. It is here: when my opponent points to the courtyard and says "Here is a white horse, is it not a horse?" I must say "Yes," without surrendering "White horse is not horse." It is hard to make men see that the finger pointing at the animal is not the name of the animal. You speak of "kinds" versus "animals." This is close to my distinction between the universal White and the particular white thing, though I borrow your phrasing to make it clear. If you understand "horse" as the shape-universal and "white horse" as the compound-universal, you see my path. But I cannot speak of universals as you do. I speak of Names that do not shift. The weakest point is that I must use the word "horse" in both subject and predicate, and men hear the animal both times. I should have said "The name 'white horse' is not the name 'horse'." But then there is no paradox to stir the lord's mind. The danger is that men will think I deny the animal's existence. I do not. I deny the name's equivalence. If you push me there, where the name touches the thing, I am most vulnerable, for language wants to bind them, and I want to keep them apart.
