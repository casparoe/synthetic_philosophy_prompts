answer: |-
  The inside view attends to the specific details of a case; the outside view classes the case with others to derive a baseline expectation. Epistemic modesty recommends deferring to the outside view when the two conflict. To test this, we must freeze the information sets available at the time of decision, avoiding the contamination of hindsight.

  **Episode A: Cold Fusion (1989)**
  As of March 1989, the information set for a physicist evaluating Pons and Fleischmann included the claim (excess heat from electrolysis), the method (press conference, no peer review), and the theoretical context (nuclear physics).
  1.  *Base-Rate Reasoning:* The reference class was "tabletop nuclear claims." As you noted, Paneth and Peters (1920s) and Tandberg (1930s) occupied this class. The base rate of success was effectively zero. However, this class is outcome-dependent; had Pons succeeded, the class might have been renamed "condensed matter nuclear science." An outcome-independent class, such as "claims announced by press conference before peer review," also carries a dismal success rate.
  2.  *Adjacent Theory:* This carried the most weight. Nuclear physics dictated that D-D fusion producing measurable heat must emit lethal neutron fluxes. This was a hard constraint, not a statistical regularity.
  3.  *Signal-Reading:* The press conference bypassed the norm of peer review. The withholding of calorimetric details signaled low credibility.

  The community's rejection was driven primarily by Adjacent Theory and Signal-Reading. The base rate supported the rejection but was not the engine; if the neutron flux had been consistent with the heat, the base rate would have been ignored. The Utah legislature, acting as a funder in a political register, ignored all three outside view components, prioritizing local economic development over epistemic norms.

  **Episode B: H. pylori (1984–1985)**
  As of 1984, the information set for a gastroenterologist included the claim (bacteria cause ulcers), the method (peer-reviewed publication, culture), and the theoretical context (sterile stomach dogma).
  1.  *Base-Rate Reasoning:* The reference class was "reports of gastric bacteria." The 1954 study and earlier 19th-century reports were filed here as contamination errors. The base rate suggested Warren and Marshall were wrong.
  2.  *Adjacent Theory:* The doctrine that "no acid, no ulcer" and that acid kills bacteria was strong, but physiological, not physical. It allowed for exceptions (e.g., mucosal protection) more readily than nuclear physics allowed for neutron suppression.
  3.  *Signal-Reading:* Marshall and Warren published in a reputable journal (1984). Marshall's self-experiment (1985) was a high-cost signal. It proved nothing statistically about ulcers, but it demonstrated confidence and biological plausibility (the bacteria could survive acid).

  Here, the outside view initially dictated rejection. The base rate and theory aligned against the claim. Acceptance required overriding the outside view with strong inside-view evidence (culture, biopsy, self-experiment). The signal of the self-experiment was crucial in shifting the community from "contamination" to "novel pathogen."

  **Testing Your Suspicion**
  You suspect base rates did little work, with Theory and Signal wearing the outside view's clothes. The episodes confirm this. In A, the base rate of failed cold fusion was secondary to the hard constraint of neutron flux. In B, the base rate of failed bacteria reports was overcome by the signal of the self-experiment and the inside-view quality of the culture. Base rates provide the background noise; Theory and Signal provide the decisive frequencies. Epistemic modesty based solely on base rates would have stalled B as effectively as it stalled A. Modesty must be sensitive to the *type* of outside constraint: hard physical laws weigh more than historical failure rates.

  **Agents and Registers**
  The outside view governs different agents differently.
  *   *Individual Scientists:* For a physicist in 1989, modesty meant disbelief (Theory dominates). For a chemist, modesty meant skepticism but potential replication (Signal ambiguous).
  *   *Funders (DOE):* Modesty meant withholding specific funding (Base Rate + Theory).
  *   *Community:* The community acted as a distributed agent. Most took the outside view (disbelief), preserving resources. A few took the inside view (pursuit), gathering the data needed to update the base rate.
  Epistemic modesty does not say the same thing in all registers. For belief, modesty recommends suspension. For effort allocation, modesty recommends diversification: most should defer, but some must investigate to prevent the ratchet effect.

  **Three Difficulties**
  (a) *Retrospective Reference Class:* You ask if the base rate is contaminated. In A, the class "tabletop nuclear claims" is defined by theoretical conflict, not just outcome. In B, the class "gastric bacteria reports" was defined by methodological failure (contamination). If we define the class outcome-independently as "claims contradicting established dogma via new microscopy," the base rate is low but not zero. Repairing the class definition clarifies that B was always a low-probability event, but not impossible. The verdict in A would not change (theory kills it); the verdict in B might have been reached faster if the class was defined by *method* (culture) rather than *history* (contamination).

  (b) *The Ratchet:* If the outside view governs pursuit, science stops. No one investigates low-base-rate claims, so the base rate never updates. This is a reductio if the outside view is applied to *investigation*. It is not a reductio if applied to *belief*. The norm should be: take the outside view for confidence levels, but allow inside-view exceptions for resource allocation. Modesty requires believing the claim is likely false while acknowledging it might be worth checking.

  (c) *The Distributed Agent:* In a community, optimal strategy involves division of cognitive labor. If everyone takes the outside view, B never happens. If everyone takes the inside view, A wastes billions. Epistemic modesty for a solitary agent implies deference. For a community, it implies recognizing that one's own role might be to check the outliers. Modesty here means accepting that most colleagues should ignore you, but hoping a few do not. The theory lacks a robust account of this division; it treats agents as isolated updaters rather than nodes in a network.

  **Silence**
  The inside/outside framework is silent on incentives. It cannot explain why Utah funded A (political credit) or why the acid-suppression industry resisted B (economic inertia). It is also silent on error costs. In A, a false positive wastes money; a false negative wastes little (fusion remains impossible). In B, a false positive wastes research time; a false negative keeps patients sick. The framework treats belief accuracy as the sole good, ignoring the utility of the belief. It cannot explain why the community reversed in B (high utility of cure) but not A (low utility of heat).

  **Verdict**
  This pair shows that the outside view and its recommended modesty are claims about a restricted domain: they govern *belief justification* well but *exploration strategy* poorly. Base rates are less decisive than theoretical constraints and procedural signals. The framework confirms that modesty is virtuous for belief but vicious if it stifles the minority pursuit required to update the base rate.

  Regarding the community's preferred error: If scoring on **accuracy of beliefs**, the community should prefer False Negatives (rejecting A correctly, initially rejecting B). It is better to disbelieve a truth temporarily than believe a falsehood. If scoring on **allocation of effort**, the community should prefer False Positives in *pursuit* (allowing work on B) but False Positives in *belief* should remain costly. The optimal distribution is to disbelieve the claim (outside view) while funding a small fraction of agents to test it (inside view). In A, the community erred on effort only via the Utah legislature (too much). In B, the community erred on effort initially (too little), delaying a cure. The outside view explains the belief lag in B, but only a utility-weighted model explains why that lag was a failure of effort allocation.
