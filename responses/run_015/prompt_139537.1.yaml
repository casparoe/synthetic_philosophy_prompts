answer: |-
  ### Sketch Phase

  **Candidate Analogies:**
  1.  **Munich 1938:** The core lesson is that aggressive dictators interpret restraint as weakness and that concessions purchase only a temporary peace at the cost of a larger war later. The structural match requires a revisionist power testing the resolve of established powers.
  2.  **Vietnam 1965–75:** The core lesson is that military superiority does not guarantee political success, that domestic will is fragile, and that open-ended commitments without clear exit strategies lead to strategic failure. The structural match requires a land war in difficult terrain against a motivated irregular or nationalist force.
  3.  **Thucydides Trap:** A rising power challenging a hegemon. This fits poorly. Iraq was a regional power, not a systemic rival to the US. It was opportunistic, not structural. I agree with your suspicion; invoking this would be category error.

  **Functions of Analogy:**
  1.  **Predictive:** Claims causal similarity. "If A (invasion) then B (war)" because it happened in the reference class. Requires base rates.
  2.  **Procedural:** Sets decision rules. "In cases resembling X, presumption lies with action/inaction." Shifts burden of proof.
  3.  **Authorising:** Moral framing. Makes the action intelligible and defensible to a constituency.

  **Potential Failures:**
  *   **Munich:** Fails if the dictator is rational/deterrent-sensitive rather than ideologically expansionist. Fails if sanctions *could* work (unlike 1930s).
  *   **Vietnam:** Fails if the terrain is open desert (mechanised warfare possible) and the objective is limited (liberate Kuwait, not nation-build Iraq).
  *   **Epistemic Symmetry:** They are not symmetrical. Munich invokes catastrophic loss (existential); Vietnam invokes costly failure (strategic). Loss aversion makes Munich psychologically heavier.

  **Initial Verdict on Lens:**
  Your distinction holds, but the 'Predictive' job is almost never honest. It is usually a disguised Procedural claim. The 'Authorising' job may have an internal variant: coordination among elites, not just public legitimacy.

  ***

  ### Case Analysis: The Gulf Crisis 1990–91

  **The Munich Analogy: Initiation and Coalition**
  The agents invoking Munich were primarily George H.W. Bush and Margaret Thatcher. The option on the table in August 1990 was whether to impose strict sanctions and wait, or to assemble a military coalition immediately for potential offensive action.

  For Munich to do **predictive** work, the actors would have needed to identify a reference class of 'dictatorial invasions left unchecked' and demonstrate a high frequency of subsequent wider wars. They did not do this. They did not argue that 70% of such invasions lead to world war; they argued that *this* dictator was Hitler. This is not prediction; it is identification. The evidence available at the time—Iraq's use of chemical weapons against Kurds and Iranians, the sheer size of the Iraqi army—supported the 'aggressive dictator' premise but did not support the 'inevitable wider war' conclusion without the intervention of the analogy itself.

  The **procedural** work was dominant. Munich operated as a burden-shifter. Once the label 'appeasement' was attached to sanctions-only policies, the burden of proof moved decisively to those advocating restraint. To argue for waiting was not to argue for prudence; it was to argue for cowardice. This closed off the 'sanctions might work' hypothesis not because it was empirically disproven, but because it was procedurally disqualified.

  The **authorising** work was necessary for the coalition. Arab states joining a Western-led coalition required a moral narrative that was not about oil or imperialism. Framing Saddam as a new Hitler made the coalition a 'return to civilisation' rather than a colonial intervention.

  **The Vietnam Analogy: Scope and Termination**
  The agents invoking Vietnam were primarily Colin Powell (Chairman of the Joint Chiefs) and the Pentagon planners. The option on the table in January 1991 was the scope of the ground war and the conditions for ceasefire.

  For Vietnam to do **predictive** work, it required a reference class of 'interventions in the Middle East turning into insurgencies'. There was no such class. The prediction was hypothetical: 'If we occupy Baghdad, we will face an insurgency.' This was checkable in principle (by analysing Iraqi nationalism vs. sectarianism), but in practice, it was treated as a deterministic law derived from the Vietnam experience.

  The **procedural** work here was the 'Powell Doctrine': overwhelming force, clear objectives, exit strategy. This was a decision rule designed to prevent the specific failure mode of Vietnam (gradual escalation, unclear goals). It dictated the air campaign's intensity and, crucially, the decision to stop short of Baghdad.

  The **authorising** work was domestic. To sell a war to a American public traumatised by Vietnam, the administration had to promise it would not *be* Vietnam. The analogy licensed the war only on the condition that it was *not* like the analogy. This is a paradoxical use: 'We must fight to avoid Munich, but we must fight like this to avoid Vietnam.'

  **Verdict on the Analogies**
  Did either analogy fit better? Structurally, neither fit perfectly. Iraq was not Nazi Germany (no industrial capacity for global war) and Kuwait was not Vietnam (open terrain, state-on-state conflict). However, the **Munich analogy was empirically weaker but rhetorically stronger**. There was no evidence Saddam intended to invade Saudi Arabia or Israel immediately, though the threat was present. The **Vietnam analogy was empirically stronger regarding the risks of occupation**, as history subsequently showed, but it was used to limit the war rather than prevent it.

  They did not cancel out. They divided the labour. Munich justified the *start*; Vietnam justified the *stop*. The decision to halt the ground war was a victory for the Vietnam procedural rule, masked by the Munich authorising narrative (we liberated Kuwait, we did not need to conquer Iraq).

  **The Thucydides Trap**
  You are correct to dismiss this. The Thucydides Trap describes structural stress between a rising power and an established hegemon. Iraq was not a rising hegemon; it was a indebted regional power acting out of economic desperation. The US was not threatened in its hegemony, only in its regional interests. Invoking Thucydides would have implied a long-term containment strategy rather than a punitive expedition. It adds nothing here.

  ### Lens Analysis: Testing Your Hypotheses

  **The Three Jobs**
  Your distinction between Predictive, Procedural, and Authorising is robust, but I propose a refinement. The **Predictive** job is not just rare; it is almost always counterfeit. When a politician says 'This is Munich', they are not offering a probability distribution. They are offering a *classification*. Once the situation is classified as 'Munich', the prediction follows by definition, not by induction. Therefore, the Predictive job collapses into the Procedural. If you define the present as '1938', then '1939' is not a prediction; it is a script.

  I confirm your hypothesis that the **Procedural** and **Authorising** jobs are the rule. In the Gulf Crisis, no actor produced base rates. They produced imperatives.

  **The Stock of Episodes**
  Your hypothesis that the stock is biased towards moral clarity is confirmed. Munich and Vietnam are 'clean' wars in memory, though they were messy in reality. Munich has a clear villain (Hitler) and a clear mistake (Chamberlain). Vietnam has a clear failure (withdrawal) and a clear cause (mission creep). This clarity makes them useful for decision-making under uncertainty because they reduce complexity. However, this confirms your suspicion: they are unrepresentative. The Gulf War was neither a clear moral crusade (given the alliances with Syria and Saudi Arabia) nor a clear military failure (it was a victory). The analogies forced the complex reality into a binary frame to make it decidable.

  **Epistemic vs. Psychological Symmetry**
  Here I must challenge you. You suggest the lessons are epistemically symmetrical but psychologically asymmetrical. I argue they are **epistemically asymmetrical** as well.
  The Munich lesson is a *negative existence proof*: one case of appeasement failing is sufficient to validate the rule 'appeasement is dangerous'. It relies on the severity of the outcome (World War) to outweigh the frequency.
  The Vietnam lesson is a *statistical warning*: it relies on the frequency of failures in similar interventions.
  Because the cost of being wrong about Munich (global war) is perceived as higher than the cost of being wrong about Vietnam (strategic setback), the Munich analogy carries more weight in the initial decision to use force. This is not just psychological bias; it is a rational weighting of catastrophic risk. However, once force was committed, the Vietnam analogy gained traction because the *cost* of being wrong about Vietnam (body bags) became immediate. The weight shifts over time.

  **The Silence: The Coordinating Job**
  Your framework misses a fourth job: **Coordination**.
  Analogies are not just for the public (Authorising) or for the decision rule (Procedural); they are for the bureaucracy. In 1990, the State Department, the Pentagon, and the White House had different institutional interests. 'Munich' allowed the White House to align the State Department (diplomacy) with the Pentagon (force) under a single narrative. 'Vietnam' allowed the Pentagon to constrain the White House's ambition without appearing insubordinate.
  The analogy provides a shared vocabulary that allows disparate actors to synchronise their mental models without agreeing on first principles. You can agree 'We don't want another Vietnam' without agreeing on why Vietnam failed. This coordinating function is distinct from Authorising (which is outward-facing) and Procedural (which is action-guiding). It is internal glue.

  **Embarrassments to the Framework**
  Your framework cannot tell you whether the analogies were *true* in a causal sense, only how they were used. But there is a deeper silence: your framework assumes the actors are choosing analogies to fit decisions they have already made (epiphenomenal).
  In the Gulf Case, there is evidence the analogies **constrained** the decision. The commitment to the Vietnam procedural rule (exit strategy) genuinely prevented the occupation of Baghdad. Bush wanted to stay; Powell invoked Vietnam to stop him. Here, the analogy was not epiphenomenal; it was constitutive of the outcome. Your hypothesis that analogies are usually decorations for settled decisions fails here. The analogy *was* the decision mechanism when preferences were conflicted.

  ### Confidence Note

  I am highly confident in the analysis of the analogies' functional roles (Procedural and Authorising dominating Predictive) and in the rejection of the Thucydides Trap for this specific case. The historical record of the decision-making process supports the view that Munich drove the coalition building and Vietnam drove the exit strategy.

  The claim I am least sure of is the assertion that the analogies were **constitutive** rather than **epiphenomenal** in the decision to stop short of Baghdad. I have reconstructed this as Powell using Vietnam to constrain Bush. However, it is possible that Bush had already decided to stop for geopolitical reasons (fearing Iranian advantage or coalition fracture) and allowed Powell to use the Vietnam analogy as the public face of that decision. If access to Bush's private diaries or contemporaneous notes revealed he had independently settled on limited objectives before Powell's intervention, my claim that the analogy did independent work would collapse. The consideration that would change my mind is evidence of the temporal sequence of Bush's private decision versus Powell's public articulation of the 'Powell Doctrine'.
