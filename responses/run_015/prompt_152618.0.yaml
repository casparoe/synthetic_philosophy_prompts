answer: |-
  1. Quick verdict
  The summary captures the core intuition of pragmatic encroachment but incorrectly conflates it with contextualism and mischaracterizes its normative implications. It identifies the right examples but draws the wrong theoretical conclusion.

  2. What's accurate in her summary
  Her description of the core intuition behind pragmatic encroachment is spot-on. She correctly identifies that views like Jeremy Stanley's argue practical stakes influence whether a true belief counts as knowledge, not just evidence and truth. The bank case example is the standard illustration: high stakes (depositing a paycheck) raise the justification threshold compared to low stakes (casual chat). She rightly notes this challenges the traditional idea of knowledge as a purely mental state invariant to practical context. By highlighting that risk affects epistemic status, she captures the motivating problem: why we hesitate to claim knowledge when errors are costly, even if evidence remains constant. This accurately reflects the departure from purist epistemology. The analogy of a "permission slip" captures the action-guiding nature of knowledge attributions well.

  3. Where it slips — misrepresentations and conflations
  The major error is conflating pragmatic encroachment with epistemic contextualism. Contextualism claims the word "knows" changes meaning based on conversational context, whereas encroachment claims knowledge itself varies with stakes, regardless of conversation. They are rival solutions, not identical views. Additionally, her claim that this collapses into subjective Bayesian updating is a distortion. Bayesian updating concerns how evidence changes probability; encroachment concerns how stakes change the *threshold* for knowledge or rational action. They operate on different variables. Suggesting it reduces to "subjective risk tolerances" undermines the objective normative force proponents claim. Encroachment theorists argue stakes objectively alter justification, not merely that individuals subjectively feel differently. By calling it a "social permission slip," she leans too hard into contextualism, ignoring that encroachment advocates often view knowledge as a real state sensitive to practical facts. This misrepresentation weakens her critique because it attacks a straw man. The Bayesian collapse argument fails because encroachment maintains a normative link between knowledge and action that pure probability updating lacks. Furthermore, she implies knowledge is merely social, but encroachment suggests we simply lack knowledge until evidence meets the higher bar.

  4. How a defender of pragmatic encroachment would respond
  A defender would argue that pragmatic encroachment preserves normative bite precisely because it links knowledge to rational action via the Knowledge-Action Principle. They would reject the Bayesian collapse by insisting that two agents with identical evidence can differ in knowledge status due to objective stakes, not subjective updating. For the defender, knowledge is the norm of action; if stakes change what action is rational, they change what knowledge is required. They would also sharply distinguish their view from contextualism: contextualism makes knowledge attributions context-sensitive, while encroachment makes knowledge itself stakes-sensitive. The defender would argue that reducing this to subjective tolerance misses the point that high stakes objectively raise the cost of error, thereby demanding more evidence for the same epistemic status. Thus, the view remains a robust claim about the nature of justification, not merely a linguistic trick. This explains why acting on low-stakes knowledge in high-stakes scenarios is irrational.

  5. Bottom line for understanding the view
  Your friend correctly identifies motivating cases but conflates distinct theories. Pragmatic encroachment argues stakes affect knowledge itself, while contextualism argues stakes affect the meaning of "knows." Her conclusion about Bayesian collapse relies on treating stakes as subjective rather than objective constraints on rational action. Remember: contextualism is about language, encroachment is about the relationship between knowledge and action. The Bayesian critique fails if you accept that practical rationality constrains epistemic justification. Her summary is a useful heuristic for the *problem* but misleading regarding the *solution*. Don't accept the collapse conclusion without challenging the premise that stakes are subjective.
