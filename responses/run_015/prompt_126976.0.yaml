answer: |-
  **The Scenario**

  Elena, a project lead, discovers a budgetary error that secretly benefits her team but violates a vague compliance rule. She knows the exact figures, the rule's text, the likelihood of audit, and the team's morale impact—all non-moral facts are exhausted. Paralyzed by the conflict between loyalty and integrity, she asks a peer, Marcus, who knows the same data. Marcus says, "Correct it." He offers no argument, cites no precedent, and Elena has no prior evidence of his ethical superiority nor time pressure forcing a shortcut. She corrects it. The decision preserves the department's long-term credibility.

  ***

  **The Three Readings**

  1.  **The Optimist** argues that Elena acquired genuine moral knowledge through testimony. Just as she could learn the budget figures from Marcus, she learned the moral status of the error. The cost to this view is explaining how understanding was transmitted without argument; it must claim that moral concepts can be grasped via verdict alone, which risks making moral understanding too thin.
  2.  **The Pessimist** contends that Elena did the right thing but lacked moral worth. She acted on authority, not reason, and therefore failed to act *virtuously*. The cost here is high: she must explain why Elena's action feels morally robust rather than hollow, and why the outcome (preserving credibility) doesn't vindicate the method. She resists hardest because the case is designed to show deference yielding a "good" agent, not just a "right" act.
  3.  **The Skeptic (No Expertise)** claims there is no moral expertise, only reasons to think Marcus is right. She argues Elena deferred because Marcus is a peer whose judgment she respects, not because he is an "expert." The cost is explaining what reason Elena had without track records or arguments; she must rely on a vague notion of "basic trust" that risks collapsing into the Optimist's view.

  ***

  **The Machinery**

  The single feature doing the work is **the exhaustion of non-moral facts combined with structural bias**. Elena knows everything descriptive but recognizes her own position (team loyalty) compromises her moral perception. The deference is not a shortcut but a corrective lens. If you remove the agent's recognition of her own bias, the case degenerates into blind obedience (irrational deference) or a simple case of deferring on facts (e.g., if Marcus knew a rule she didn't). It relies on the agent knowing *that* she cannot see clearly, even if she knows *what* is there.

  **The Pessimist's Counterattack**

  The Pessimist will accuse you of smuggling in a non-moral fact: the fact of **Marcus's conviction**. She will argue Elena didn't defer on the moral question ("Is this wrong?"); she deferred on a psychological fact ("Marcus believes this is wrong") and then applied her own moral rule ("I should align with peers on ambiguous issues"). She will claim you stipulated the verdict (that Elena acted well) instead of deriving it, because acting on another's moral verdict *just is* lacking understanding, by definition.

  **The Editor's Question**

  If Marcus had turned out to be wrong (e.g., correcting the budget actually destroyed the team), Elena would still have done the right thing **in deferring**, because her deference was an act of epistemic humility in the face of recognized bias. However, she would not have done the right thing **in action**. This distinction supports the **Optimist** view: it shows that moral testimony can be a rational source of justification (making the deference right) even if the content is false, separating the epistemic virtue of the agent from the truth of the claim. If you answer that deference was wrong because the outcome was wrong, you concede to the Pessimist that moral testimony cannot carry independent warrant.
