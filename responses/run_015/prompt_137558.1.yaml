  **[ESTABLISHED USAGE]** vs **[MY PROPOSAL]**

  Here is the carving you asked for.

  ### 1. The Word
  There is no single established term that captures the specific narrative movement you observed: the unannounced sliding of a counterfactual story back toward the actual timeline. Your friend is conflating two distinct concepts, which is why existing words like "determinism" feel wrong.

  *   **[ESTABLISHED USAGE]** The structural claim your friend makes (that deep forces like fiscal-military pressures force history into specific shapes) is called **Equifinality**. In systems theory, this means different initial conditions can lead to the same end state.
  *   **[ESTABLISHED USAGE]** The cognitive bias your friend exhibits (filling the unknown future with the known past because he cannot imagine otherwise) is called **Creeping Determinism** (a subset of Hindsight Bias).
  *   **[MY PROPOSAL]** The specific narrative habit of allowing a counterfactual branch to re-merge with the actual trunk without explicit justification is **Narrative Reversion**.

  **Narrative Reversion** is the word you lacked. It describes the *shape* of the story, not the truth of the history. It is the rhetorical move of treating the actual timeline as a gravity well that pulls the story back in, regardless of whether the structural forces (Equifinality) actually warrant it.

  ### 2. One Phenomenon or Two?
  **[MY JUDGEMENT]** They are **two distinct phenomena** that are frequently conflated.

  Your friend treats them as one because they produce the same output (a 1650 that looks like our 1650). But the *mechanism* is different.
  1.  **Structural Equifinality:** The world *forces* convergence. (e.g., "Gunpowder is expensive, so all states must tax, so all states develop parliaments.")
  2.  **Imaginative Inertia:** The author *forces* convergence. (e.g., "I don't know what a Catholic 17th-century England looks like, so I'll use the Protestant one.")

  **The Test to Separate Them:**
  Apply the **"Because" Test**.
  *   **Instance of Structural Equifinality:** The historian can point to a specific causal pressure that exists in *both* timelines and compels the same outcome. (e.g., "Parma's occupation creates a resistance movement, which requires central funding, which requires a Parliament, *because*...")
  *   **Instance of Narrative Reversion (Exhaustion):** The historian asserts the outcome without a causal bridge. (e.g., "Eventually, trade resumes." *Why?* "Because trade always does.")

  If the "because" relies on a law of human behavior or material constraint that survives the divergence, it is Equifinality. If the "because" relies on the fact that *this is what happened in reality*, it is Narrative Reversion.

  ### 3. The Two Knobs
  **[MY JUDGEMENT]** Your insight about the "two knobs" is the correct way to model this. Historians usually only track Knob 1.
  *   **Knob 1 (Magnitude of Divergence):** How big is the shock at the Point of Divergence? (Your friend's "plausibility".)
  *   **Knob 2 (Elasticity of Timeline):** How fast does the system absorb the shock?

  Your friend assumes **High Elasticity** (the timeline snaps back quickly). Your reinsurance model assumes **Low Elasticity** (branches stay separate). Both are assumptions. History likely has variable elasticity depending on the domain (technology might be high elasticity; culture might be low). By failing to name Knob 2, your friend cannot argue about *rate*, only *size*.

  ### 4. Boundary Cases
  To clarify **Narrative Reversion**, here are the boundaries:

  *   **[CLEAR INSTANCE]**: Your friend's Armada scenario. London falls, but by 1650 there is still an "awkward parliament" and "Atlantic trade." The specific institutions of the actual 1650 are imported without a causal chain explaining how a Spanish-conquered England generates the *exact* same fiscal habits as the uncaptured one. This is Narrative Reversion.
  *   **[CLEAR NON-INSTANCE]**: A scenario where the divergence compounds. Suppose the Armada succeeds, Spain installs a Catholic monarchy, and the Puritans *do not* flee to America because they are suppressed. By 1650, there is no United States, no English common law tradition in the New World, and the global balance of power is Iberian. The branches do not rejoin. This is **Path Dependence** (the opposite of Reversion).

  ### 5. The Personal Case
  **[MY JUDGEMENT]** The personal case ("If I hadn't taken that job...") is the **same cognitive mechanism** applied to a different domain.

  It is **Narrative Reversion** used for emotional regulation.
  *   **Function:** In history, Reversion creates a sense of structural order (the world makes sense). In biography, Reversion creates a sense of fate or reduced regret (my life makes sense; I didn't miss out on anything unique).
  *   **Mechanism:** It relies on **Imaginative Inertia**. It is easier to imagine the life you know than the life you didn't live. Your friend assumes his personal timeline has **High Elasticity** ("something like it would have come along") to protect himself from the chaos of **Path Dependence** (the idea that one small choice permanently altered his trajectory).

  ### 6. Summary Position
  **[MY COMMITMENT]**
  You are right; your friend is methodologically sloppy. He is masking **Imaginative Inertia** as **Structural Equifinality**. The word for this masking is **Narrative Reversion**.

  *   **Is it a feature of history?** Sometimes (Equifinality).
  *   **Is it an artefact of method?** Often (Narrative Reversion).
  *   **The Distinction:** You must demand the causal chain. If the historian cannot explain *why* the counterfactual 1650 looks like the actual 1650 without referencing the actual 1650, they are not doing history; they are doing fiction with a safety net.

  Your reinsurance intuition is superior here: treat the branches as separate unless there is a proven mechanism to merge them. Do not accept **Narrative Reversion** as "plausibility." It is a failure of imagination disguised as a theory of stability.
