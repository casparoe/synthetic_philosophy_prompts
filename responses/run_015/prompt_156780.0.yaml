answer: |-
  # Research Agenda: The Metaphysical Anchor of the Knowledge Argument

  **Program Duration:** 3 Years
  **Primary Objective:** Determine whether the Knowledge Argument (KA) refutes physicalism or merely reveals features of human conceptual architecture.
  **Ranked Problem Clusters:**
  1.  **Cluster A:** The Phenomenal-Concept Strategy (PCS) & Metaphysical Compatibility.
  2.  **Cluster B:** The Ability-Knowledge Boundary.
  3.  **Cluster C:** The Extrapolation Problem.

  This agenda prioritizes metaphysical grounding over epistemological taxonomy and application. The core thesis of this program is that the KA is not primarily an argument about what Mary *learns* (Cluster B) or what that implies for *others* (Cluster C), but an argument about the *ontological cost* of the concepts required to explain her learning (Cluster A). Consequently, Cluster A is the bottleneck; Clusters B and C are indeterminate until A is resolved.

  ---

  ## Priority 1: Cluster A (The Phenomenal-Concept Strategy)
  **Timeline:** Year 1
  **Focus:** Determining whether phenomenal concepts constitute a non-physical mode of presentation that violates physicalist causal closure or supervenience.

  ### Defense of Placement

  **(1) Dependency**
  Cluster A is the metaphysical anchor. Cluster B (the nature of Mary's knowledge) cannot be resolved without knowing the ontological status of the concepts mediating that knowledge. If phenomenal concepts are physically realized but epistemically distinct (the PCS view), then Mary's "new knowledge" is compatible with physicalism. If phenomenal concepts require non-physical properties to function, physicalism fails regardless of whether we call the gain "ability" or "proposition." Cluster C (extrapolation) is entirely dependent on A; we cannot attribute consciousness to AI or animals without knowing if the gap Mary experiences is a universal feature of consciousness (dualism) or a species-specific feature of human conceptualization (physicalism).

  **(2) Tractability**
  This is the most technically developed cluster, making it the most tractable starting point. The literature on two-dimensional semantics, cognitive science of concepts, and the "transparency" of experience provides stable tools for analysis. While the problem is hard, the distinctions required (e.g., *referent* vs. *mode of presentation*) are already available. Progress does not require inventing new categories but rigorously testing existing PCS variants (e.g., recognitional vs. quotational concepts) against the "phenomenal concept zombie" objection.

  **(3) Payoff**
  The payoff here is decisive for the core debate. A successful defense of PCS validates physicalism by localizing the epistemic gap to our cognitive architecture rather than the world. A failure of PCS (showing it collapses into property dualism) effectively concedes the Knowledge Argument to the dualist. Results in B or C would be merely taxonomic if A is not settled; knowing *that* Mary gains ability (B) tells us nothing about physicalism if we don't know the metaphysics of the concepts underpinning that ability.
  *Reversal Condition:* If early Year 1 analysis reveals a consensus that PCS is logically incoherent *a priori* (independent of empirical cognitive science), Priority 1 would shift to B as a damage-control measure.

  **(4) Resource Sensitivity**
  Cluster A is the non-negotiable core. If the program were cut from three years to two, Cluster A must remain intact. Without a verdict on the metaphysical compatibility of phenomenal concepts, the program yields no conclusion on physicalism. Dropping A would render the remaining work on B and C speculative, as they would lack a truth-condition for the physicalist hypothesis.

  ---

  ## Priority 2: Cluster B (The Ability-Knowledge Boundary)
  **Timeline:** Year 2
  **Focus:** Analyzing whether Mary's post-release change is propositional or practical, contingent on the conceptual architecture established in Year 1.

  ### Defense of Placement

  **(1) Dependency**
  Cluster B is downstream of Cluster A. The "Ability Reply" (Lewis/Nemirow) is often treated as a rival to PCS, but in this agenda, it is treated as a refinement. If Cluster A establishes that phenomenal concepts are physical but unique, Cluster B investigates whether the deployment of these concepts constitutes a distinct epistemic category (acquaintance) or reduces to propositional attitudes. We cannot sharply define the "ability" Mary gains without knowing if the content of that ability is physical (dependent on A). Conversely, A does not strictly depend on B; one can argue for the metaphysical coherence of phenomenal concepts without settling the precise epistemology of "knowing-how."

  **(2) Tractability**
  Tractability is moderate. The distinction between *knowing-that* and *knowing-how* is philosophically fraught and often circular when applied to qualia. However, by Year 2, the program will utilize the conceptual framework settled in Year 1 to avoid this circularity. For instance, if A confirms PCS, B can analyze abilities as *dispositions to deploy phenomenal concepts*. This makes the distinction sharper than it would be in isolation.

  **(3) Payoff**
  The payoff is high for clarifying the *mechanism* of the epistemic gap, but lower for the metaphysical verdict. If B shows Mary gains only abilities, it supports physicalism, but only if A has already secured the metaphysical safety of those abilities. If B shows she gains new propositions, physicalism survives only if A shows those propositions are about physical states. Thus, B refines the conclusion of A but rarely overturns it.
  *Reversal Condition:* If Cluster A results in a stalemate (PCS is neither proven nor disproven), Priority 2 would elevate to Priority 1. In that scenario, proving that Mary's gain is *purely* practical (no new facts) becomes the only viable path to save physicalism.

  **(4) Resource Sensitivity**
  Cluster B is the primary candidate for compression if time is tight, though not for elimination in a two-year plan. If the program is cut to two years, B is integrated into the final months of Year 1. Its resolution is not required to reach a verdict on physicalism (which comes from A), but it is required to explain *why* the intuition of novelty persists. Dropping B entirely would leave the program metaphysically sound but phenomenologically incomplete.

  ---

  ## Priority 3: Cluster C (The Extrapolation Problem)
  **Timeline:** Year 3
  **Focus:** Applying the verdicts of A and B to cross-species, AI, and altered-state consciousness attribution.

  ### Defense of Placement

  **(1) Dependency**
  Cluster C is wholly dependent on A and B. The criteria for attributing consciousness to an AI or a bat depend entirely on whether the "Mary gap" is a feature of consciousness itself (Dualism) or a feature of human concepts (Physicalism). If A concludes physicalism is true, C becomes a functionalist project. If A concludes dualism is true, C becomes a project in detecting non-physical properties. Attempting C before A is premature speculation; one cannot construct non-circular attribution criteria without knowing the ontological nature of the attribute.

  **(2) Tractability**
  Tractability is low. This cluster involves empirical variables (neuroscience, AI architecture) and normative ethics that are unstable. Progress here requires inventing distinctions (e.g., "phenomenal fidelity" in AI) that are not yet stable. It is best tackled only after the conceptual ground is cleared by A and B, ensuring that the extrapolation rests on a settled metaphysical foundation.

  **(3) Payoff**
  The payoff is high for applied ethics and philosophy of mind *applications*, but low for the *core physicalism debate*. Resolving C does not settle whether physicalism is true; it only settles where consciousness is found given the truth of physicalism (or dualism). Therefore, it is the least critical for the dissertation's primary philosophical contribution.
  *Reversal Condition:* If the research context shifts dramatically (e.g., a breakthrough in AI consciousness claims that forces an immediate practical verdict), C would move to Priority 1. However, for a theoretical program on the KA, this is unlikely.

  **(4) Resource Sensitivity**
  **Cluster C is the drop candidate.** If the program is cut from three years to two, Cluster C is eliminated. Its resolution does not alter the conclusions reached in A and B regarding the truth of physicalism. A and B establish whether the Knowledge Argument refutes physicalism; C merely maps the consequences of that verdict. Dropping C leaves the core philosophical argument intact, whereas dropping A or B would undermine the argument's foundation or explanatory power.

  ---

  ## Summary of Trade-Offs and Reversal Conditions

  **The Core Trade-Off:**
  This agenda accepts the risk that focusing on Cluster A (Metaphysics) may seem abstract compared to Cluster C (Application). The trade-off is justified because C is unstable without A. A program that prioritizes C risks building attribution criteria on a metaphysical foundation that Year 1 might later prove false (e.g., designing AI tests based on physicalist assumptions when the KA actually proves dualism).

  **Reversal Protocol:**
  The ranking A > B > C holds unless one of the following occurs during the first 12 months:
  1.  **PCS Collapse:** If Cluster A analysis demonstrates that all versions of the Phenomenal-Concept Strategy are logically incoherent, the program shifts to **Cluster B**. In this scenario, the "Ability Reply" becomes the last line of defense for physicalism and must be exhausted before conceding to dualism.
  2.  **Empirical Override:** If new neuroscientific data renders the conceptual distinction in A empirically undecidable, the program shifts to **Cluster C**. If we cannot solve the metaphysics conceptually, we may need to infer the answer from the best explanatory criteria for consciousness attribution (inference to the best explanation).

  **Final Resource Decision:**
  In a two-year constraint, the program delivers a verdict on Physicalism (via Cluster A) and a refined account of Epistemic Gain (via Cluster B), omitting the Extrapolation (Cluster C). This ensures the dissertation/grant fulfills its primary philosophical mandate: settling the ontological status of the Knowledge Argument.
