answer: |-
  **Case Study: The Heritage Grant**

  The City Heritage Council is deciding whether to award a "Centennial Preservation Grant" to the owners of the Old Miller Theatre, a designation that strictly applies only to the "original structure" built in 1924. The Theatre Trust argues the building qualifies, insisting it is still the "original structure" despite renovations, while the Development Corp argues it does not, claiming it is effectively a new construction. The building stood empty from 1970 to 1990, during which the roof collapsed and the interior was completely gutted; however, the exterior brick facade was preserved, the foundation was reinforced rather than replaced, and the 2005 reconstruction followed the 1924 blueprints exactly. The Trust insists that calling this a "new building" dishonours the historical continuity of the site, while the Developer insists that calling it "original" devalues the labour of the 1924 builders and sets a dangerous precedent for zoning laws.

  **Agreed Neutral Facts**
  *   **Material Composition:** Less than 15% of the pre-1970 physical material remains in the current edifice.
  *   **Spatiotemporal Path:** The structure occupies the exact same coordinates as the 1924 building with no gap in legal ownership, though there was a 20-year gap in physical integrity.
  *   **Design:** The current visual appearance matches the 1924 blueprints with 98% accuracy.
  *   **Function:** The building serves the same public function now as it did in 1924.
  *   **Causal History:** The 2005 reconstruction was caused by the intent to restore the 1924 building, not to build a distinct replica elsewhere.

  ***

  ### Discussion Notes

  **(a) The Hirsch-Style Deflationist**
  *   **Verdict:** Merely Verbal.
  *   **Reasoning:** Once we disambiguate "original structure" into the neutral facts above (e.g., "majority original material" vs. "continuous spatiotemporal path"), the disagreement vanishes. The Trust accepts the path facts; the Developer accepts the material facts. There is no further disagreement about the world.
  *   **Driving Feature:** The availability of a neutral vocabulary that captures all agreed-upon physical facts.
  *   **If Stakes Removed:** If the grant money and zoning laws disappear, the dispute evaporates instantly. No one would bother arguing about "originality" in a vacuum.
  *   **What they say to the parties:** "You aren't disagreeing about reality; you're disagreeing about which English word to attach to these agreed-upon facts. Stop fighting about what *is* and negotiate about what you *want* the rule to cover."

  **(b) The Sider-Style Realist**
  *   **Verdict:** Substantive (One side is objectively wrong).
  *   **Reasoning:** There is a joint-carving structure to reality regarding identity over time. Either the causal-historical path *makes* the object the same, or the material constitution *does*. One of these readings maps onto the fundamental structure of the world better than the other, regardless of the grant.
  *   **Driving Feature:** The assumption that there is a single, privileged metaphysical notion of "identity" that the phrase "original structure" is attempting to track.
  *   **If Stakes Removed:** The metaphysical fact remains true even if no one cares. The dispute *should* continue for the sake of truth, even if the practical urgency fades.
  *   **What they say to the parties:** "One of you is describing the world as it fundamentally is, and the other is mistaken. The grant rules are secondary; find out which concept of identity carves nature at the joints."

  **(c) The Carnap-Style Pragmatist (Framework View)**
  *   **Verdict:** Substantive (but non-descriptive).
  *   **Reasoning:** The dispute isn't about "what exists" but "which linguistic framework is most useful for our purposes." The question is whether the "continuity framework" or the "material framework" better serves our social goals (preservation vs. clarity).
  *   **Driving Feature:** The normative/institutional stakes. The "substantiveness" comes from the consequences of adopting a framework, not from the framework's ability to mirror reality.
  *   **If Stakes Removed:** The dispute becomes idle. Without a purpose (like a grant or zoning law), there is no external standard to judge which framework is "better."
  *   **What they say to the parties:** "Don't ask if it *is* the original building. Ask which way of speaking helps us achieve the values we care about. If preserving heritage is the goal, use the Trust's framework; if protecting property rights is the goal, use the Developer's."

  ***

  ### Critical Reflection: The Weakness in the Tests

  You are right to be suspicious. The **Loaded-Reading Test** as you defined it ("non-linguistic reason to prefer") seems to track *practical importance* rather than *ontological substantiveness*.

  **Why your suspicion is likely correct:**
  In the case above, the "non-linguistic reasons" (honouring history, zoning precedents) are entirely dependent on the institutional context. If you strip away the Heritage Council, the "loaded" nature disappears. This suggests the test measures *how much we care*, not *whether there is a fact of the matter*. A dispute can be merely verbal (by Dissolution) but highly loaded (e.g., "Is a fetus a person?" in a legal context). If the Loaded-Reading Test classifies that as "substantive" just because the stakes are high, it fails to distinguish between *metaphysical* depth and *practical* urgency.

  **What would convince me the Loaded-Reading Test is valid:**
  You would need a case where parties have non-linguistic reasons to prefer a reading *even in the absence of institutional stakes*. For example, if a scientist prefers reading "species" one way over another purely because it yields better predictive models, not because of funding or laws. If the "load" comes from *theoretical utility* rather than *institutional consequence*, the test might track a kind of pragmatic substantiveness that survives the removal of legal stakes.

  **What would convince me the Dissolution Test is flawed:**
  If you found a case where parties disambiguate terms, agree on all neutral facts, yet *still* feel a residual disagreement that isn't just about word choice. For example, if they agree on all physical facts about a statue and the clay, but one insists "The statue *is* the clay" and the other insists "The statue is *distinct* from the clay," and neither can reduce this to a linguistic preference. If that intuition persists after full disambiguation, the Dissolution Test might be prematurely closing the book on substantive metaphysics.

  **Advice for your 10-minute slot:**
  Be explicit that the two tests measure different things. The Dissolution Test measures *truth-conditional divergence* (do they mean different things?). The Loaded-Reading Test measures *pragmatic significance* (does the choice matter?). Your case shows that a dispute can be truth-conditionally empty (Verbal) but pragmatically full (Loaded). The danger is conflating "pragmatically full" with "metaphysically substantive." Your presentation succeeds if you show that metaontology needs to decide whether it cares about *what exists* or *how we talk about what exists*.
