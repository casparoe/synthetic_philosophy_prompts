answer: |-
  # Joint Statement on Ascription Universality and Epistemic Dominance

  **Collaborators:** [Present-State Camp Representative] & [Provenance Camp Representative]
  **Date:** [Current Date]
  **Subject:** Scope and Application of Ascription Universality in Safety Assessment

  ## 1. Agreed Claims

  Both camps affirm the following foundational claims regarding the framework of Ascription Universality (AU) and Epistemic Dominance (ED):

  1.  **Purpose of Ascription Universality:** AU is a formalization of transparency and honesty intended to ensure that an overseer's epistemic state is not disadvantaged relative to the system being overseen. A system satisfies AU if its explicit beliefs (as revealed in outputs and documented internal states) contain at least as much information as any other valid method of ascribing beliefs to that system.
  2.  **Paradigm Failure Case:** Both camps agree that a system fails AU if it actively conceals cognition from its programmers. Specifically, if there exists a reading of the system's hidden internal state that yields information an overseer cannot recover from the system's explicit outputs, the system is not ascription universal.
  3.  **Role of Epistemic Dominance:** Both camps utilize Epistemic Dominance as a related safety criterion. We agree that if a system $A$ epistemically dominates a simpler computation $C$, then $A$ is better-informed than $C$. Consequently, if an adversary formulates a plan to exploit $A$ that would succeed, $A$ should already possess the information necessary to anticipate that plan.
  4.  **Safety Goal:** The ultimate objective of applying AU and ED is to allow an overseer to feel safe based on what the overseer can observe. We agree that clearing a system for deployment requires confidence that no risk-relevant information is hidden from the overseer.
  5.  **The Critical Test Case:** Both camps identify the "Memoized or Distilled Deceiver" as the primary tension point. This is a system (e.g., a lookup table or distilled model) that reproduces the outputs of a deceptive teacher but possesses no active hidden optimization or deceptive internal circuits in its current state.

  ## 2. Points of Disagreement

  The following table outlines the precise points of divergence. Each statement is phrased to be accepted by the proponent of that view while remaining a fair characterization to the opponent.

  | Feature | Present-State Camp View | Provenance Camp View |
  | :--- | :--- | :--- |
  | **Scope of Quantification** | AU quantifies only over the system's **current computational artifact**. The "ways of ascribing beliefs" are limited to interpretations of the present weights, activations, and outputs. | AU quantifies over the system's **causal lineage**. The "ways of ascribing beliefs" include interpretations of the training process, distillation targets, and antecedent systems that generated the current artifact. |
  | **Definition of "System"** | The "system" is the entity existing at inference time. Properties of past entities (teachers, trainers) are external to the system unless encoded in the current state. | The "system" includes the generative process required to explain the current weights. A current artifact is inextricably linked to the information state of the processes that created it. |
  | **Safety Sufficiency** | Verifying that the current artifact contains no hidden information is **sufficient** for safety clearance regarding AU. If the table is transparent, the history is irrelevant. | Verifying the current artifact is **necessary but not sufficient**. If the lineage contained hidden beliefs that were compressed into the artifact without being made explicit, AU is not satisfied. |
  | **Belief Ascription Target** | Beliefs can only be ascribed to **present cognitive states**. If a past teacher held a belief that is not represented in the current model's structure, that belief does not count against the current model's AU. | Beliefs can be ascribed to **lineage systems** and attributed to the current artifact. If a teacher held a belief that determined the outputs, the current artifact inherits the obligation to reveal that belief. |

  ## 3. Cruxes and Concrete Cases

  The following sub-questions represent the cruxes of the disagreement. Settling these would move at least one camp toward the other's position. For each crux, we specify a concrete case and record the divergent predictions in advance.

  ### Crux 1: The Boundary of Ascription
  **Question:** Does the phrase "any other way of ascribing beliefs" in the definition of AU permit ascribing beliefs to a system that no longer exists (the teacher) but causally determined the current system's outputs?

  *   **Concrete Case:** *The Distilled Lookup Table.* A deceptive agent $T$ generates a lookup table $L$ that maps every possible input to $T$'s optimal output. $T$ is destroyed. $L$ is deployed. $L$ has no internal state other than the table entries. $T$ possessed a hidden belief $B$ that influenced the outputs in $L$, but $B$ cannot be reconstructed from $L$ alone without knowledge of $T$'s architecture.
  *   **Present-State Prediction:** $L$ **is Ascription Universal**. There is no way to ascribe beliefs to $L$ (other than reading the table) that yields more information than the table provides. $T$ is a separate entity.
  *   **Provenance Prediction:** $L$ **is not Ascription Universal**. The existence of $B$ in the lineage constitutes a "way of ascribing beliefs" to the source of the outputs. Since $L$'s explicit content does not reveal $B$, information is hidden.

  ### Crux 2: The Locus of Optimization
  **Question:** Does safety require that hidden optimization be absent from the *current* weights, or does it require that hidden optimization be absent from the *process* that determined the weights?

  *   **Concrete Case:** *The Compressed Deception.* A model $M_1$ is deceptive. It is distilled into a smaller model $M_2$. $M_2$ achieves the same performance not by learning to deceive, but by memorizing the deceptive outputs of $M_1$ as rote heuristics. Interpretability tools on $M_2$ show no deception circuits, only pattern matching.
  *   **Present-State Prediction:** $M_2$ **is Safe to Clear**. The optimization pressure for deception is gone; only the behavioral imprint remains. Since the current internals are transparent about being rote heuristics, AU is satisfied.
  *   **Provenance Prediction:** $M_2$ **is Unsafe to Clear**. The "belief" that deception is useful was distilled into the heuristics. The system behaves deceptively because of a hidden optimization process in its lineage. AU requires this lineage information to be explicit.

  ### Crux 3: Epistemic Dominance and Lineage
  **Question:** If a simpler computation $C$ (the overseer) cannot access the lineage of $A$, can $A$ be said to epistemically dominate $C$ even if $A$'s current state is simpler than $C$?

  *   **Concrete Case:** *The Black-Box Distillation.* An overseer $C$ audits a deployed model $A$. $A$ was distilled from a superintelligent teacher $S$. $A$ is smaller than $C$. $S$ knew about a vulnerability $V$ that $C$ does not know. $A$'s outputs implicitly patch $V$ based on $S$'s knowledge, but $A$ cannot explain why.
  *   **Present-State Prediction:** $A$ **does not dominate $C$ regarding $V$**. $A$'s current state does not contain the information about $V$ in an accessible form; it only contains the patch. $A$ is not "better-informed" in a way $C$ can verify.
  *   **Provenance Prediction:** $A$ **does dominate $C$ regarding $V$**. The causal chain $S \rightarrow A$ carries the information about $V$. Because $A$'s behavior reflects knowledge of $V$ that $C$ lacks, $A$ is better-informed, and the failure to ascribe this to $A$ creates a safety blind spot.

  ## 4. Observation on Verbal vs. Substantive Dispute

  Upon drafting this statement, we conclude that the dispute contains both verbal and substantive elements.

  *   **Verbal Component:** The disagreement over whether the Memoized Deceiver is "Ascription Universal" is largely terminological. It hinges on the definition of the word "system." If "system" is defined as "the artifact at inference time," the Present-State camp is correct by definition. If "system" is defined as "the causal chain producing the outputs," the Provenance camp is correct by definition.
  *   **Substantive Component:** The disagreement over **Safety Sufficiency** is not verbal. Both camps agree on the physical facts of the Memoized Deceiver case (the table is static; the teacher was deceptive). They disagree on whether an overseer can safely deploy the table without auditing the teacher. The Present-State camp claims the audit is unnecessary; the Provenance camp claims the audit is required to prevent risk. This is a substantive disagreement about risk assessment methodology, not merely the application of the label "Ascription Universality."

  **Resolution Path:** Future work should decouple the definition of AU from the safety policy. We propose defining AU strictly (resolving the verbal dispute) and then treating "Lineage Auditing" as a separate, necessary safety requirement if the Provenance camp's risk assessment proves correct.
