answer: |-
  The analogy between inverse reinforcement learning and ordinary mindreading is indeed pervasive, and its rhetorical power lies in its ability to import the robustness of human social cognition into the fragility of statistical inference. To audit this analogy, we must first trace the structural correspondence between the source case of human interaction and the target case of formal preference learning, identifying where the components align and where the mapping dissolves. In the source case of human mindreading, the interpreter's prior over possible desires is not a blank slate but a dense, evolutionarily sculpted distribution grounded in shared biology; we assume others want food, safety, status, and connection because we want these things ourselves. In the formal setup, this role is occupied by the inductive biases of the learning architecture, such as a simplicity prior on reward functions or the specific parameterization of a neural network, which is vastly thinner and lacks the semantic grounding of biological need. The shared world in the human case is the physical and cultural environment that both interpreter and target inhabit, ensuring that when a target reaches for a cup, the interpreter sees the same cup, governed by the same physics. In the formal setup, the learner often inhabits a distinct state space or observes the demonstrator through a partial observability filter, meaning the "world" the learner infers rewards over may not match the world the demonstrator acted in.

  The availability of language in the human case serves as a high-bandwidth correction channel, allowing the interpreter to ask, "Did you want the red one?" and receive a negation or confirmation that updates the prior instantly. In the standard formal setup of learning from trajectories, this channel is severed; the learner sees only the execution, not the intent, and must rely on the static dataset without the ability to query the demonstrator. The standing assumption that the target is competent at getting what she wants corresponds to the rationality assumption in inverse reinforcement learning, often modeled as Boltzmann rationality where the probability of an action scales with its expected value. However, the human competence assumption is nuanced and contextual; we forgive slips of the hand or moments of confusion. The formal model usually applies a global temperature parameter to the optimality constraint, which, as you noted, is often unidentifiable and conflates noise with indifference. Finally, the feedback channel in human mindreading is continuous and bidirectional; if I misunderstand your desire, you correct me, and the relationship survives. In the formal setup, the feedback channel is the loss function minimizing divergence between predicted and observed trajectories, a unidirectional signal that penalizes prediction error but cannot distinguish between a model that misunderstands values and a model that misunderstands the environment.

  Having laid out the correspondence, we can now examine the disanalogies to determine which are merely cosmetic and which undermine the reassuring conclusion that behavior is sufficient data. The first load-bearing point you raised concerns the shared structure between interpreter and target. In the human case, the inference succeeds not merely because the data is rich, but because the hypothesis space is constrained by the fact that both agents are human. The prior over desires is sharp because human desires cluster tightly around survival and social cohesion. In the formal setup, the learner is typically an artificial agent with no biological drives, no social embedding, and potentially a radically different ontology. This disanalogy is fatal to the reassuring conclusion because it removes the very mechanism that makes mindreading robust. The analogy borrows plausibility from the human case's shared hardware to suggest the formal case is equally stable, but without that shared hardware, the prior over rewards becomes dangerously diffuse. The framework is silent on whether the demonstrator's behavior reflects values or merely constraints, and without the shared biological prior to break the symmetry, the learner cannot reliably distinguish between a preference for coffee and a habit formed because tea was unavailable.

  The second point, the taste-versus-map problem of non-identifiability, strikes at the mathematical core of the analogy. In human mindreading, we resolve this ambiguity by leveraging the shared world; if I see you walk into a wall, I assume you are blind or the wall is invisible, not that you desire pain, because I know the physics of walls. In the formal setup, if the transition dynamics or the demonstrator's beliefs are not perfectly modeled, the reward function absorbs the error. A trajectory that avoids a state is interpreted as a dislike for that state, even if the demonstrator avoided it because they believed it was unreachable. This disanalogy is not irrelevant; it is the primary failure mode of inverse reinforcement learning. The reassuring conclusion relies on the assumption that the observed policy is optimal for the recovered reward, but as you noted, this constraint is satisfied by a large family of rewards, including degenerate ones like a constant zero reward function if the demonstrator is assumed to be perfectly rational, or a reward function that penalizes every action equally if the noise parameter is tuned incorrectly. The sharpness of the inference depends entirely on the priors and the noise model, neither of which are derived from the behavior itself. Thus, the claim that data is sufficient is false; the data is underdetermined without strong, external assumptions about the demonstrator's epistemic state and rationality bounds.

  The third point regarding evidence channels highlights a category error in the analogy. Watching someone act is fundamentally different from asking them to judge trajectories. In the human case, we use both, but we privilege verbal report when actions are ambiguous. The formal setup often conflates these by treating preference labels as equivalent to behavioral trajectories, yet they impose different cognitive loads on the demonstrator. When a human acts, they are optimizing under real-time constraints with their own beliefs; when they rate a trajectory, they are simulating counterfactuals. The competence assumption changes shape because a person may be bad at achieving their goals but good at recognizing them. If the formal system treats preference data as just another form of behavior, it inherits the identifiability problems of action data without gaining the clarifying power of explicit judgment. This disanalogy matters because it suggests that the "behavior is enough" claim only holds if we expand the definition of behavior to include explicit feedback, which contradicts the original rhetorical move of relying on passive observation.

  Given these disanalogies, the reassuring conclusion does not survive the audit intact. It relies on the hidden premise that the learner possesses a prior as rich as a human's and operates in a world as shared as a human's. Without these, the inference is not a robust recovery of values but a projection of the learner's inductive biases onto the data. The framework is silent on the normativity of the behavior; it can tell you what policy generates the data, but it cannot tell you if that policy is good for the demonstrator, or if the demonstrator is acting under coercion, addiction, or false belief. To rest a roadmap on the claim that behavior is enough is to ignore the degeneracy of the inverse problem. You need the analogy to hold the conclusion up, and since the analogy fails on the critical dimensions of shared structure and identifiability, the conclusion collapses.

  Regarding your alternative analogies, the traveler's itinerary offers a more honest structural mapping than the mindreading analogy. Reading a traveler's path to infer their interests captures the partial observability and the taste-versus-map problem explicitly. If a traveler skips a museum, it could be because they dislike art or because the museum was closed. This analogy correctly imports the epistemic uncertainty that the mindreading analogy hides. It forces the observer to acknowledge that the environment's constraints are entangled with the agent's preferences. However, it still suffers from the lack of a feedback channel; unless you can ask the traveler why they skipped the museum, you remain stuck in the same non-identifiability trap. The compiler reverse-engineering analogy is structurally precise regarding optimization but misleading regarding values. Reverse-engineering optimization flags from a binary assumes a deterministic, consistent objective function without noise or belief errors. It gets the "optimality" assumption right but fails to capture the messy, bounded rationality of human behavior. It implies that if we just look hard enough, the "true flags" are there in the code, whereas in human behavior, the "true flags" may not exist in a consistent form at all.

  Between the two, the traveler's itinerary is the superior analogy for alignment work because it centers the problem of distinguishing preference from constraint. It does not offer the false comfort of the mindreading analogy, which suggests that understanding is a natural byproduct of observation. Instead, it suggests that understanding requires disambiguation, either through richer context about the world the traveler moved through or through direct query. If your group's roadmap rests on the claim that behavior is enough, it is resting on the mindreading analogy's hidden premises rather than the formal reality. A more robust roadmap would treat behavior as a noisy, underdetermined signal that must be regularized by explicit feedback and constrained by models of human belief and error. The audit suggests you should not dismiss the difficulty others allege; the philosophers are worrying about the exact gaps that the engineering analogy papers over. The data is not sufficient on its own, and the system will not learn what people want from what they do unless it also learns, or is told, what people know and what they can do.
