answer: |-
  Here is a breakdown of the slogan "absence of evidence is not evidence of absence," dissected for your piece.

  ### I. The Menu of Claims

  The slogan is a logical tautology often deployed as an epistemological shield. When the historian used it, she could have been making one of four distinct claims, ranging from the trivial to the substantive.

  **1. The Logical Possibility Claim**
  *   **The Claim:** The fact that a record does not exist does not logically entail that the event did not occur.
  *   **Verdict:** **Platitude.** It is deductively true but intellectually inert. It confuses *proof* with *evidence*.
  *   **Assumption:** It assumes nothing about the record other than it is not an omniscient camera. It merely states that $\neg E$ (no evidence) does not deductively prove $\neg H$ (hypothesis is false).

  **2. The Informational Nullity Claim**
  *   **The Claim:** The silence carries *zero* information. Finding no mention of the practice should not update our prior belief about how common the practice was.
  *   **Verdict:** **False (in most historical contexts).** In Bayesian terms, absence of evidence is almost always evidence of absence, provided the search was conducted in a place where evidence *might* have been found. The only way this claim holds is if the probability of finding evidence is identical whether the event happened or not.
  *   **Assumption:** It assumes the record-generation process is completely uncorrelated with the phenomenon being studied (i.e., the court records are random noise regarding this practice).

  **3. The Structural Incommensurability Claim**
  *   **The Claim:** The system that produced the record was structurally incapable of registering this specific practice, even when it occurred in front of the record-keepers.
  *   **Verdict:** **Defensible Substantive Claim.** This is the only version that does real historical work. It argues that the "evidence" was impossible to generate because the conceptual vocabulary or legal incentives of the court excluded the practice.
  *   **Assumption:** It assumes a specific bias in the archive: that the practice is not just unrecorded, but *unrecordable* within that specific administrative language.

  **4. The Sensitivity Claim (The Counter-Slogan)**
  *   **The Claim:** Absence of evidence is evidence of absence, *proportional to the sensitivity of the search*.
  *   **Verdict:** **Scientifically Accurate.** If a court reliably records debt disputes but never records marriage customs, the absence of debt records implies no debt, but the absence of marriage records implies nothing.
  *   **Assumption:** It assumes records are a sampling mechanism with a known "detection rate."

  ### II. The Verdict Across Your Three Silences

  Your distinction (Loss, Production, Description) is a robust heuristic for archival work. The validity of the historian's slogan shifts significantly across them.

  **1. Silences of Loss (Documents destroyed/missing)**
  *   **Verdict on Slogan:** **Strong.** If the gap is due to random decay, fire, or weeding, the absence of evidence truly is not evidence of absence. The missing data is Missing Completely At Random (MCAR).
  *   **Nuance:** This validates the historian's brush-off *only if* she implies the records are fragmentary due to preservation issues.

  **2. Silences of Production (No document ever made)**
  *   **Verdict on Slogan:** **Weak.** If the people appear in the records (as your prompt specifies) but the practice is never mentioned, this is not a silence of production regarding the *people*, but potentially regarding the *practice*. If the court had a standing incentive to record the practice (e.g., taxing it), and didn't, the absence *is* evidence of rarity.
  *   **Nuance:** The slogan fails here if the administrative logic suggests the practice *should* have triggered a document.

  **3. Silences of Description (Misfiled/uncataloged)**
  *   **Verdict on Slogan:** **Temporary.** This is an epistemic silence, not an ontological one. Digitization and new queries can fix this. Using the slogan here is a defense of laziness or limited imagination.
  *   **Nuance:** If the digitization is OCR-based and the handwriting is illegible, this reverts to Silence of Loss.

  **Does the distinction need redrawing?**
  Yes. You need a fourth category: **Silences of Discourse (or Concept).**
  This occurs when the event happened, entered the court, was written down, but was translated into a legal category that renders it invisible to your specific query.
  *   *Example:* A colonial court records an indigenous inheritance dispute not as "customary succession" (your search term) but as "property trespass" (the legal term available to the clerk).
  *   *Relevance:* The record exists, the production happened, the description is legible. But the *concept* is absent. The historian's slogan is most defensible here, but only if she specifies that the *language* of the archive cannot capture the practice.

  ### III. The Historian's Brush-Off vs. The Audience's Ear

  **Which reading entitles the historian to her brush-off?**
  Only **Claim 3 (Structural Incommensurability)**. She is entitled to dismiss your inference only if she can demonstrate that the colonial court system was structurally blind to the practice in question (e.g., "This was a domestic ritual the British magistrates refused to recognize as legal, so they never wrote it down, even when it caused the dispute"). If she cannot substantiate that structural blindness, the slogan is a rhetorical shield, not an argument.

  **Which reading does the audience probably hear?**
  **Claim 1 (Logical Possibility).** The audience hears a tautology: "You can't prove it didn't happen." This feels profound but actually shuts down inquiry. It converts a probabilistic question ("How likely is it that...?") into a binary one ("Can you prove it...?"). It protects the archive from critique by raising the bar of proof to an impossible standard.

  ### IV. Licensing Absence as Evidence

  You asked what would license treating a patterned absence in an administrative record as genuine evidence about frequency.

  **The Bayesian License.**
  You are licensed to treat absence as evidence if you can establish the **Sensitivity** of the archive.
  *   **The Test:** Did the administrative system have an *incentive* to record the practice if it existed? (e.g., Did it generate fees? Did it require a license? Did it create liability?)
  *   **The Inference:** If the court profited from recording the practice, and the practice is absent from the records of people who *were* in court, the absence is strong evidence that the practice was rare *among that population*.
  *   **The Caveat:** This evidence applies only to the population interacting with the court, not the general colonial population (addressing your "Silence of Production" regarding those outside the system).

  **The Fourth Consideration: The Silence of the Norm.**
  There is one reading you may have missed. Sometimes, absence indicates that a practice was so ubiquitous it was considered background noise and therefore unworthy of record.
  *   *Example:* A court record details exceptions to a rule but never states the rule itself.
  *   *Implication:* In this specific case, absence of evidence is evidence of *presence* (or normativity). The historian's slogan fails completely here. If your practice was the "default" state of being, the archive would be silent on it precisely because it was universal.

  ### Summary for your Piece
  The slogan is a logical truth (Claim 1) masquerading as a historical method (Claim 2). It is useful for guarding against overconfidence in negative findings (Loss), but dangerous when used to immunize archives from scrutiny regarding their structural biases (Discourse). A patterned absence in a high-sensitivity archive (one that should have recorded the thing) is not just evidence; it is often the *best* evidence we have. To wave it off is to treat the archive as a holy text rather than a bureaucratic machine.
