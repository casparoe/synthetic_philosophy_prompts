answer: |-
  This is a classic interpretive tension: the need for narrative coherence versus the duty to historical accuracy. Your staff is right that a label hedged into paralysis ("Some people thought X, others thought Y, history is complex") fails the visitor. But the advisory board is right that "inevitable progress" falsifies the lived experience of the past.

  The historiographical cure for Whig history is not moral relativism; it is **contingency** and **context**. We can judge child labor as a horror without implying that its abolition was inevitable or that the people who opposed it were merely "obstacles." We can acknowledge the mills closed without implying they closed *so that* an arts district could exist.

  Here is the procedure you asked for. It is designed for a generalist writer with a stopwatch.

  ### The 10-Minute "Whig Audit" Procedure

  **Time Budget:** 10 minutes per label.
  **Goal:** Detect teleology (inevitability) and presentism (judging past solely by present values).
  **Honesty Clause:** Steps 1 and 2 are mechanical. Steps 3 and 4 are judgment calls. If a writer cannot answer Step 4 confidently, the label must be escalated.

  #### Step 1: The "So That" Scan (Mechanical)
  **Action:** Search the text for causal connectors that imply intent or inevitability.
  **Trigger Words:** *Led to, paved the way for, resulted in, made possible, ultimately, inevitably, step toward, precursor to.*
  **The Test:** If you find these, ask: "Did the historical actors know this outcome was coming?"
  *   **Pass:** The text describes a consequence without implying it was the goal. (e.g., "The strike failed. *Later*, laws changed.")
  *   **Fail:** The text implies the event happened *in order to* create the present. (e.g., "The strike paved the way for laws.")
  *   **Fix:** Change causal language to chronological language. Replace "paved the way" with "was followed by." Replace "made possible" with "was replaced by."

  #### Step 2: The "Nobody Knew" Check (Mechanical/Judgment)
  **Action:** Locate adjectives describing historical actors' foresight.
  **Trigger Words:** *Visionary, forward-thinking, backward, resistant, progressive, regressive, modern, outdated.*
  **The Test:** Does the label praise someone for knowing the future, or condemn them for failing to know it?
  *   **Pass:** Actors are described by what they *wanted* at the time. (e.g., "He argued for safety.")
  *   **Fail:** Actors are described by how well they match *us*. (e.g., "He was a visionary leader" or "They resisted progress.")
  *   **Fix:** Ground the description in contemporary evidence. Instead of "visionary," use "advocated for [specific contemporary goal]."

  #### Step 3: The "Moral Anchor" Test (Judgment Call)
  **Action:** Identify any moral judgments (triumph, horror, success, failure).
  **The Test:** Is this judgment based on *our* values alone, or can it be anchored in values held *then* or universal human costs?
  *   **Pass:** "Child labor was hazardous" (Verifiable physical harm) or "Critics at the time called it exploitative" (Contemporary consensus).
  *   **Fail:** "Child labor was an obstacle to a modern workforce" (Economic teleology) or "Fortunately, we now know better" (Condescension).
  *   **Fix:** Anchor the moral claim. If calling something a "triumph," state *who* cheered and *why* at the time.

  #### Step 4: The "Dead End" Verification (Judgment Call)
  **Action:** Look at the "losers" or "ended" things in the text.
  **The Test:** Does the text explain why they lost, or does it just imply they *had* to lose?
  *   **Pass:** Acknowledges specific pressures (economic, political, force).
  *   **Fail:** Implies natural selection ("could not survive," "gave way to").
  *   **Fix:** Add agency. Things don't "give way"; people make decisions that change things.

  #### Escalation Protocol
  If the writer cannot fix the label in 10 minutes using these steps, or if fixing it requires new historical facts (e.g., finding out *who* opposed pasteurization), **send to Curator.** Do not guess. A vague label is better than a confident lie.

  ***

  ### Application to Your Drafts

  Here is the audit applied to the three texts you provided.

  #### 1. The Textile Mills Label
  > **Draft:** "The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible."

  *   **Step 1 (So That Scan):** **FAIL.** "Made possible" implies the mills existed *for the purpose* of creating the arts district. "Could not survive" implies inevitability.
  *   **Step 2 (Nobody Knew):** **PASS.** No specific actors named.
  *   **Step 3 (Moral Anchor):** **FAIL.** "Thriving" is a presentist judgment on the arts district vs. the "dead" industry.
  *   **Step 4 (Dead End):** **FAIL.** Industries don't die of natural causes; they are closed by owners, undercut by competitors, or regulated out of existence.

  **Verdict:** **Rewrite Required.** This is classic Whig teleology. It treats the deindustrialization as a necessary sacrifice for the gentrification that followed.

  **Suggested Rewrite:**
  > "For a century, these mills powered the city's growth. In the 1970s, facing overseas competition and rising costs, owners shuttered the factories. For decades the buildings stood empty, until developers converted them into the arts district you see today. The city's economy changed, but the brickwork remains."
  > *(Why this works: It replaces "could not survive" with specific causes ["oversseas competition"]. It replaces "made possible" with chronological sequence ["until developers converted"]. It removes the moral judgment on which economy is "better.")*

  #### 2. The Pasteurization Label
  > **Draft:** "A pioneering step toward the public-health protections we take for granted today."

  *   **Step 1 (So That Scan):** **FAIL.** "Step toward... today" defines the 1908 action solely by its 2024 result.
  *   **Step 2 (Nobody Knew):** **FAIL.** "Pioneering" is a hindsight label. They didn't know they were pioneers; they thought they were saving babies *then*.
  *   **Step 3 (Moral Anchor):** **PASS/FAIL MIX.** Calling it a health protection is factually sound, but "take for granted" is condescending presentism.
  *   **Step 4 (Dead End):** **N/A.**

  **Verdict:** **Rewrite Required.** You are allowed to call this a triumph (as per your memo), but the triumph must be grounded in 1908, not 2024.

  **Suggested Rewrite:**
  > "In 1908, infant mortality from contaminated milk was a leading cause of death in the city. Health officials argued that pasteurization would save lives immediately. Despite resistance from local dairies, the law passed. Within five years, child mortality rates dropped by half."
  > *(Why this works: It keeps the moral weight [saving lives] but anchors it in contemporary data [1908 mortality rates] rather than present comfort ["take for granted"]. It acknowledges conflict ["resistance from dairies"] rather than a smooth "step forward.")*

  #### 3. The Then-and-Now Timeline Wall
  > **Concept:** 1890s photographs of street corners paired with 2020s photographs of the same corners.

  *   **Step 1 (So That Scan):** **N/A (Visual).**
  *   **Step 2 (Nobody Knew):** **N/A.**
  *   **Step 3 (Moral Anchor):** **FAIL.** The visual juxtaposition inherently invites a comparison of "then vs. now."
  *   **Step 4 (Dead End):** **FAIL.** By skipping 1920, 1950, and 1980, the exhibit implies a direct transformation.

  **Verdict:** **Escalate to Curator/Design.**
  I know you are fond of this wall and have defended it. I am telling you that **no label text can fix this.** This is structural Whig history.
  By pairing 1890 directly with 2020, you visually erase the contingency of the middle century. You force the visitor to ask: "Is the street better now? Or worse?" You imply the 2020 version is the "final form" of the street. If a fire burned the block in 1940 and it was rebuilt cheaply, the viewer assumes the 2020 look was the *goal* of the 1890 layout.

  **The Unpleasant Truth:**
  To fix this without removing the wall, you must disrupt the visual teleology.
  1.  **Add a Middle:** You need a third image from 1950 or 1970 to show that the path wasn't direct.
  2.  **Change the Caption:** Do not label it "Then and Now." Label it "Change and Continuity."
  3.  **Acknowledge Loss:** If a historic building was demolished to make a parking lot in the middle, the 2020 photo is not a "progress" shot; it's a documentation of loss. The label must say: "This corner survived the war but lost its original facade in 1965."

  If you cannot add the middle image or alter the captions to acknowledge the *gaps*, this wall is Whig history in its purest visual form. It suggests history is a slideshow of improvements (or declines) rather than a chaotic series of interventions. **I recommend you flag this for the advisory board before they see it.**

  ***

  ### What This Procedure Cannot Do

  You asked for honesty about limitations. This checklist fixes *syntax*, not *strategy*. It will not catch Whig history that lives in the architecture of the exhibit itself.

  1.  **Survivorship Bias:** If your curators only selected objects that "won" (e.g., the suffragettes' sash but not the anti-suffrage pamphlets), the labels can be perfectly neutral and the exhibit will still be Whig. The checklist cannot fix missing objects.
  2.  **Pathing:** If the gallery floor plan forces visitors to walk a straight line from "Primitive" to "Modern," the spatial experience teaches teleology faster than any label can undo it.
  3.  **The "Hero" Frame:** If the exhibit is structured around "Great Men who Built the City," it inherently suggests that history is driven by individual agency toward a goal, rather than by systems, accidents, and collective action.
  4.  **Fundraising & Marketing:** You mentioned your fundraising copy drifts into "right side of history." If the brochure outside promises a story of triumph, the nuanced labels inside will feel like a betrayal to the visitor. The procedure stops at the gallery door.

  **Final Advice:**
  Use the audit to clean the copy. It will make your writers sharper and protect you from the "moral flatline" accusation. But take the verdict on the Timeline Wall seriously. That is the kind of structural Whiggism that historians spot immediately, and no amount of copyediting will hide the fact that you skipped 100 years of messy contingency to get a clean before-and-after shot.
