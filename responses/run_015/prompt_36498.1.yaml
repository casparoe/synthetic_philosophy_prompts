prompt: |-
  I head the interpretation team at a regional history museum, and all of our exhibit copy — wall text, object labels, timelines, audio guide scripts — is drafted by curators, edited by generalist writers, and signed off by me before it goes to print. After our most recent exhibit, a historian on our advisory board complained that our labels were Whig history in miniature: the city's past read as a dress rehearsal for its present, every old institution judged by whether it "led to" what we now have, and the losing side of every conflict treated as an obstacle on a road whose destination everyone at the time supposedly knew. My staff split over what to do. One faction thinks the cure would be worse than the disease — visitors want a story with some direction, and a label so hedged that it presents everything as equally contingent is unreadable in the eight seconds a visitor actually spends on it. The other faction suspects that any moral language about the past is Whig, that we should stop calling the 1908 milk-pasteurization campaign a triumph and the child labor in our mills a horror, and I don't think that can be right either: some things really were better and worse than others, and pretending the past is a moral flatline is its own kind of falsification.

  What I want is a procedure our copywriters can run on a draft label in the time they actually have — call it ten minutes per label, several hundred labels per exhibit — with no historian in the room. Please translate whatever the historiography genuinely offers (Butterfield's original complaint, the distinction between narrating change and narrating progress, the distorting power of hindsight, the "on the right side of history" rhetoric that even our fundraising copy keeps drifting into) into a sequence of tests a non-specialist can apply: the questions to ask in order, what counts as a sufficient answer to each, where the procedure ends with a concrete rewrite, and where it has to hand the label back to a curator because the problem is one of interpretation rather than detectable wording. Be honest about which of your tests are mechanical and which are judgment calls dressed up as procedure — my writers can tell the difference, and they'll stop using a checklist that pretends.

  Then run the procedure on three real drafts I'm sitting on. First, our label about the textile mills closing: "The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible." Second, the pasteurization label: "A pioneering step toward the public-health protections we take for granted today." Third, our Then-and-Now timeline wall, which pairs 1890s photographs of the same street corners with 2020s ones. Include at least one case where the procedure returns a verdict I won't like — I am fond of that timeline wall and have defended it publicly — and make sure you say what the procedure cannot do: what kinds of Whig history live at the level of the exhibit as a whole, in which objects get selected and how visitors are routed through the gallery, that no per-label checklist will ever catch.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Head of Interpretation at a regional history museum.
      *   **Problem:** Advisory board historian accused exhibit copy of "Whig history" (teleological, presentist, judging past by present standards, viewing history as inevitable progress).
      *   **Staff Conflict:** One side wants narrative clarity (Whig is readable); the other side fears moral language itself is Whig (relativism). The User rejects moral relativism (some things *were* worse).
      *   **Goal:** A 10-minute per-label procedure/checklist for generalist writers (no historians present) to detect and mitigate Whig history without making text unreadable or morally flat.
      *   **Requirements:**
          *   Translate historiography (Butterfield, etc.) into practical tests.
          *   Distinguish between mechanical tests and judgment calls.
          *   Apply the procedure to three specific drafts (Textile Mills, Pasteurization, Then-and-Now Timeline).
          *   Include at least one verdict the User won't like (challenging the Timeline).
          *   Explicitly state the limitations of the procedure (what it *can't* fix at the exhibit design level).
      *   **Tone:** Professional, honest, pragmatic, historiographically grounded but accessible.

  2.  **Deconstruct "Whig History" for the Procedure:**
      *   *Herbert Butterfield's core critique:* Studying the past with direct reference to the present; arranging history as a story of progress leading to today; praising agents who accelerated progress and condemning those who retarded it.
      *   *Key Distinctions:* Change vs. Progress; Contingency vs. Inevitability; Past Context vs. Present Values.
      *   *The User's Constraint:* Cannot be morally flat (child labor *is* bad). Cannot be unreadable (needs a story).
      *   *The Solution:* A "Whig Audit" that focuses on *causality* and *perspective*, not necessarily moral judgment.

  3.  **Drafting the Procedure (The "Whig Audit"):**
      *   *Time Limit:* 10 minutes.
      *   *Step 1: The "Therefore" Test (Causality).* Does the text imply Event A happened *so that* Event B could happen? (Mechanical: Search for "led to," "paved the way," "made possible.")
      *   *Step 2: The "Nobody Knew" Test (Hindsight).* Does the text imply actors knew the outcome? (Judgment: Look for "visionary," "failed to see," "inevitable.")
      *   *Step 3: The "Victor's Voice" Test (Agency).* Are losers only defined by their loss? (Judgment: Do we know what they *wanted*, not just what they stopped?)
      *   *Step 4: The "Present Standard" Test (Morality).* Is the judgment based on values held *then* or *now*? (Crucial distinction: Child labor is bad now, but was it contested then? If yes, cite the contemporaries.)
      *   *Step 5: The "Dead End" Check (Contingency).* Does the text acknowledge other paths were possible? (Judgment: Add "at the time," "argued," "attempted.")
      *   *Escalation:* When to send to Curator. (If the *facts* need changing, not just words.)

  4.  **Applying the Procedure to the Drafts:**

      *   **Draft 1: Textile Mills.**
          *   *Text:* "The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible."
          *   *Analysis:* "Could not survive" = inevitability. "Made possible" = teleology (mills existed *for* the arts district).
          *   *Verdict:* Fail. Needs rewrite to acknowledge agency/contingency.
          *   *Rewrite:* Focus on the *decision* to close or the *struggle*, not the inevitable outcome.

      *   **Draft 2: Pasteurization.**
          *   *Text:* "A pioneering step toward the public-health protections we take for granted today."
          *   *Analysis:* "Step toward... today" = Whig. "Take for granted" = presentist valuation.
          *   *Nuance:* User says we can call it a triumph. How? By citing *contemporary* health arguments, not just current safety.
          *   *Verdict:* Fail (Teleological).
          *   *Rewrite:* Anchor the "triumph" in 1908 terms (saving babies *then*), not 2024 terms.

      *   **Draft 3: Then-and-Now Timeline.**
          *   *Concept:* 1890s photos vs. 2020s photos of same corners.
          *   *Analysis:* This is visual Whig history. It implies "look how far we've come" (progress) or "look what we lost" (decline), but inherently centers the present as the final state. It erases the middle.
          *   *Verdict:* **The Unpleasant Truth.** This is structural Whiggism. A label fix won't work. The *selection* of images is the problem.
          *   *Action:* Flag for Curator/Design.

  5.  **Refining the Limitations (The "What This Can't Do" Section):**
      *   Labels are symptoms; exhibition design is the disease.
      *   Object selection (survivorship bias).
      *   Pathing (linear flow implies progress).
      *   The "Hero" curation (great men vs. systems).

  6.  **Review against Constraints:**
      *   *Honesty about mechanics vs. judgment:* I need to explicitly label which steps are "Find this word" vs. "Ask yourself this question."
      *   *Time limit:* Keep the steps concise.
      *   *Tone:* Respectful of the User's authority but firm on the historiography.
      *   *Unpleasant Verdict:* The Timeline wall is the perfect candidate for this.

  7.  **Final Polish:**
      *   Ensure the distinction between "moral judgment" and "teleological judgment" is clear. (We can condemn child labor without saying it was *inevitable* that it would be condemned *exactly this way*.)
      *   Make sure the rewrites sound like museum copy (concise, engaging).

  8.  *(Self-Correction during drafting)*: I initially thought about telling them to remove moral language. The User explicitly rejected that ("some things really were better and worse"). I need to ensure the procedure allows moral judgment *if* it is grounded in contemporary evidence or universal human rights frameworks, rather than "we won, so we are good." The Pasteurization rewrite needs to reflect this: it was a triumph because people *then* said it saved lives, not just because we have safe milk now.

  9.  *(Final Check on the Timeline)*: The User said they are fond of it and defended it publicly. I need to be gentle but firm. The procedure must identify that this isn't a *label* problem, it's a *concept* problem. That fits the "hand back to curator" requirement.

  10. **Structure:**
      *   Introduction (Acknowledging the tension).
      *   The Procedure (The 10-Minute Whig Audit).
      *   The Application (Three Drafts).
      *   The Limitations (Structural Whiggism).
      *   Closing.

