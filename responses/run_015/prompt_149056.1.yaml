answer: |-
  **Summary of verdicts**
  Your intuitions cluster around three specific tensions. First, **conflict of interest**: you recuse for a son (strong tie) but not a chess friend (weak tie). Second, **authority limits**: you enforce ritual on a child, but not an autonomous adult; adoptive parents get full authority, temporary caretakers do not. Third, **duty hierarchy**: you correct moral faults even if harmony breaks, unless depression makes safety the priority; you keep a friend's secret unless public safety (poisoning) is at stake; you grade your child accurately rather than favoring them. Essentially, you prioritize public integrity over private bias and moral formation over comfort, but only when the relationship is deep enough and the recipient capable of receiving it. You're balancing the weight of the role against the context of the situation.

  **The principle and its clauses**
  The unifying account is **Contextual Role Telos**. A role isn't a static rulebook; it's a function defined by its purpose (*telos*) within a specific relational weight. It's one principle with variable activation conditions, not a pile of exceptions.

  1.  **Public Trust Clause:** When a role serves public order (magistrate, teacher), impartiality overrides familial partiality. The *telos* here is community stability. Hence, recusal for a son and accurate grading are mandatory because bias undermines the institution itself.
  2.  **Relational Depth Clause:** Duties scale with bond permanence. A son or adoptee triggers full moral formation duties because the relationship is foundational; a chess friend or temp caretaker does not. The "hat" matters only if the hat is stitched to the head.
  3.  **Agency Limit Clause:** Parental authority dissolves as child autonomy solidifies. You can't coerce adults because the *telos* of parenting is to create independent moral agents, not permanent subordinates.
  4.  **Capacity Condition (The Depression Exception):** Moral correction requires a receptive agent. If mental health crises block receptivity, the role's *telos* shifts temporarily from "formation" to "preservation." Harmony trumps correction here not because morality doesn't matter, but because the relationship must survive to teach later.

  This handles your "it depends" worry. It's not arbitrary; it's functional. If the conditions for the role's purpose don't exist (e.g., the kid can't hear you due to crisis), the duty shifts. You aren't rationalizing; you're tracking whether the role can actually function.

  **The new cases**
  **Retired Magistrate:** He should recuse. Even though he's retired and it's informal, the *purpose* of arbitration is communal harmony and perceived fairness. Estrangement introduces bias risk, and his former title creates undue pressure on the parties. The role's *telos* (fair resolution) is compromised by the history, even if the legal authority is gone. The "activation condition" for impartiality is still met because the community expects it.

  **Invented Case:** A son discovers his father committed a minor theft years ago. The father is now dead. Should he reveal it to restore honesty?
  **Verdict:** No. The role of "son" includes protecting the father's legacy (*wei qin hui*) unless public safety is currently threatened. Since the father is dead and the theft past, the *telos* of the relationship (reverance) outweighs abstract justice. This fits your "friend secret" vs. "poisoning" logic: past harm vs. ongoing danger. The duty to honor the dead parent activates more strongly than the duty to correct a closed case.

  **What has to go**
  The simplest version of the principle ("Always prioritize moral formation") breaks on your depression case. You can't save that verdict without admitting that **relationship viability** is a higher-order precondition than **moral instruction**. If you drop the idea that correction is absolute, does the system collapse? No. It actually makes it more coherent. Confucianism emphasizes *ren* (benevolence) as the root. Pushing correction when it destroys the person violates benevolence. So, you don't need to drop the verdict; you need to drop the assumption that "tough love" is always the primary duty. Sometimes the duty is simply "be present." That's not a failure of principle; it's a recognition that roles require living participants. You're not rationalizing; you're refining the hierarchy.
