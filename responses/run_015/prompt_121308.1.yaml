prompt: |-
  i'm a phd student in philosophy of science but i sit on a hospital ethics commitee every thursday, and we keep getting proposals where someone wants to delay an intervention to "gather more data" and nobody knows how to decide if that's legit. I want you to turn Good's theorem — the value of information thing — into a step-by-step procedure my committee can run in 20 minutes with no calculus. Give me the ordered questions: what prior do we state in writing, how do we sketch the loss function without inventing fake dollars, where do we check if the expected value of information exceeds the cost of waiting (including a seasonal decay penalty if delay makes the result useless), and how do we spot "epistemic rent-seeking" where a stakeholder is just using information requests to stall. For each step say what counts as a sufficient answer and where the procedure stops with a clear "no — approve now" vs "yes — delay is rational" vs "this is a values call, not a math call." Make sure it handles disagreements between clinicians and budget officers with thier different loss functions, and flag the spots where judgment is unavoidable. Then apply it to three cases: delaying a triage protocol for a 200-person study; refusing to wait on a cheap supplement; and a flu-vaccine rollout where the procedure outputs "collect more data" right as the season peaks — that's the one I won't like, show me exactly where it breaks and hands back to human judgment. Finally, say what the procedure can't do: settle prior disputes, handle purely symbolic harms, or stop information from being weaponized politically.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of science, sits on a hospital ethics committee.
      *   **Problem:** Frequent proposals to delay interventions to "gather more data." Committee struggles to decide if this is legitimate or stalling.
      *   **Task:** Convert Good's Theorem (Value of Information) into a 20-minute, no-calculus, step-by-step procedure for the committee.
      *   **Requirements:**
          *   Ordered questions.
          *   Define priors (in writing).
          *   Sketch loss functions (no fake dollars).
          *   Check Expected Value of Information (EVI) vs. Cost of Waiting (including seasonal decay).
          *   Spot "epistemic rent-seeking" (stalling).
          *   Define sufficient answers for each step.
          *   Decision points: "No — Approve Now," "Yes — Delay is Rational," "Values Call."
          *   Handle disagreements (clinicians vs. budget officers).
          *   Flag unavoidable judgment spots.
          *   Apply to three specific cases (Triage protocol, Cheap supplement, Flu-vaccine rollout).
          *   Specifically analyze the Flu-vaccine case where the math says "wait" but timing is bad (show where it breaks/hands back to judgment).
          *   State limitations (prior disputes, symbolic harms, political weaponization).

  2.  **Deconstruct Good's Theorem for Non-Mathematicians:**
      *   *Core Idea:* You should only pay for information if the expected improvement in decision quality outweighs the cost of getting that information.
      *   *Translation:* Is knowing the answer worth the harm caused by waiting for the answer?
      *   *Components needed:*
          1.  Current Belief (Prior).
          2.  Potential Actions (Intervene vs. Wait).
          3.  Outcomes/Harms (Loss Function).
          4.  Cost of Delay (Time sensitivity).
          5.  Value of New Data (Will it actually change the decision?).

  3.  **Drafting the Procedure (The "Good's Gatekeeper" Protocol):**
      *   *Time Limit:* 20 minutes. Needs to be punchy.
      *   *Step 1: The Prior (What do we think we know?)*
          *   Need to avoid Bayesian calculus. Use confidence intervals or "betting" language.
          *   *Output:* Written statement of current consensus/uncertainty.
      *   *Step 2: The Loss Function (What hurts?)*
          *   No dollars. Use "Patient-Harms" vs. "Resource-Harms."
          *   Need to capture Clinician vs. Budget Officer tension.
      *   *Step 3: The Cost of Waiting (Decay)*
          *   Seasonal/Temporal penalty.
          *   Opportunity cost.
      *   *Step 4: The Value of Data (Will it change anything?)*
          *   Crucial step. If data won't change the action, EVI = 0.
      *   *Step 5: The Rent-Seeking Check (Is this stalling?)*
          *   Incentive alignment.
      *   *Decision Matrix:* Combine inputs to give the three outcomes.

  4.  **Refining the Steps (Iterative Polish):**
      *   *Step 1 (Prior):* Ask for a "Confidence Range." If everyone agrees >90% on efficacy/safety, data is low value.
      *   *Step 2 (Loss):* Use a 2x2 grid. Harm of Acting vs. Harm of Waiting.
      *   *Step 3 (Decay):* Explicitly ask about "Seasonality" or "Window of Opportunity."
      *   *Step 4 (EVI):* Ask "What specific result would make you switch decisions?" If no specific result is named, EVI is low.
      *   *Step 5 (Rent-Seeking):* Ask "Who benefits from the delay?"

  5.  **Developing the Three Cases:**
      *   *Case 1: Triage Protocol (200-person study).*
          *   High stakes, moderate urgency. Data likely valuable.
          *   *Outcome:* Likely "Delay is Rational" *if* the study is quick.
      *   *Case 2: Cheap Supplement.*
          *   Low cost, low risk. High certainty usually.
          *   *Outcome:* "Approve Now." Cost of waiting > Value of data.
      *   *Case 3: Flu Vaccine (The Trap).*
          *   Seasonal decay is huge.
          *   Math might say "Wait for RCT," but season ends soon.
          *   *Breakpoint:* Step 3 (Decay). The procedure must flag that if Decay > EVI, you stop. But if the model underestimates Decay, it fails. I need to show where the *human* overrides the *metric*.

  6.  **Addressing the "Flu-Vaccine" Constraint:**
      *   The prompt specifically asks to show where the procedure breaks and hands back to human judgment in the Flu case.
      *   *Scenario:* Procedure says "Collect Data" (because uncertainty is high), but Season is peaking.
      *   *Fix:* The procedure needs a "Kill Switch" in Step 3. If the window is closing, the Cost of Waiting becomes infinite (or effectively so).
      *   *Analysis:* I need to demonstrate that the *formula* might output "Wait" if the uncertainty is weighted too heavily, but the *protocol* must force a "Values Call" when temporal constraints dominate epistemic ones.

  7.  **Addressing Limitations:**
      *   Priors are subjective.
      *   Symbolic harms (trust, dignity) don't fit loss functions well.
      *   Political weaponization (using data requests to block policy).

  8.  **Final Review against Constraints:**
      *   20 minutes? Yes, 5 steps.
      *   No calculus? Yes, qualitative proxies.
      *   Ordered questions? Yes.
      *   Sufficient answers defined? Yes.
      *   Decision outcomes clear? Yes.
      *   Disagreements handled? Yes (via explicit loss function comparison).
      *   Flu case analysis included? Yes.
      *   Limitations section included? Yes.

  9.  **Tone:** Professional, precise, philosophical but practical. Acknowledge the user's expertise (PhD in Phil Sci) but keep the tool usable for clinicians/admins.

  10. **Writing the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't actually use the term "Expected Value" in a mathematical sense. Use "Decision-Impact Potential."
      *   *Correction:* Ensure the "Rent-Seeking" step isn't just an accusation but a structural check.
      *   *Correction:* In the Flu case, be very specific about *why* the math fails (it treats time as linear cost, not binary cliff).

  11. **Final Polish:** Check the "Stop/Go" criteria for each step. Ensure the "Values Call" is a distinct category, not just a failure of the math. (Proceed to generate output).

  *(Self-Correction on the Flu Case)*: The prompt says "the procedure outputs 'collect more data' right as the season peaks — that's the one I won't like, show me exactly where it breaks."
  *Interpretation:* I need to construct the procedure such that it *could* output "collect data" based on epistemic value, but I must highlight the specific step where the human must override it because the *temporal* reality trumps the *epistemic* calculation. Or, better, design the procedure so Step 3 (Decay) *should* catch it, but if the committee underestimates the decay, the procedure fails. I will argue that the procedure *must* have a "Temporal Cliff" check that overrides EVI. If the procedure *still* says wait, that is the breaking point where judgment takes over. I will frame it as: The procedure calculates EVI, but Step 3 imposes a "Hard Stop" if the window closes. If the committee ignores Step 3, that's the failure point.
  *Refined Plan:* I will design Step 3 to be the "Seasonal Decay Penalty." In the Flu analysis, I will show that if the committee treats decay as linear (cost per day) rather than binary (season ends = 0 value), the procedure gives the wrong answer. The "Break" is the quantification of time. I will explicitly mark this as the "Judgment Override."

