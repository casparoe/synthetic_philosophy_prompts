answer: |-
  Here is the **Good's Gatekeeper Protocol**. It is designed for a 20-minute committee review. It translates the Value of Information (VoI) into qualitative thresholds. It does not eliminate judgment, but it forces judgment to be explicit rather than hidden behind "we need more data."

  ---

  ### The Good's Gatekeeper Protocol (20-Minute Version)

  **Pre-Requisite:** The proposal must state the *specific* data being gathered and the *exact* delay time requested (e.g., "3 months for 200-patient NCT"). If these are vague, **Stop. Reject Delay.**

  #### Step 1: The Prior Statement (2 Minutes)
  **Question:** "Write down the current consensus belief about the intervention's efficacy/safety. What percentage confidence do we have that acting *now* is better than acting *later*?"
  *   **Clinician Input:** Confidence based on pathophysiology/clinical experience.
  *   **Admin Input:** Confidence based on existing cost/utilization data.
  *   **Sufficient Answer:** A written range (e.g., "60–80% confident it helps").
  *   **Stop Condition:** If confidence is **>90%** (near certainty) OR **<10%** (near certainty of harm), **Stop. Approve/Deny Now.** Data has no value if the mind is made up.
  *   **Judgment Flag:** Disagreement here is not a math problem; it is a *epistemic culture* problem. If Clinicians say 90% and Admins say 40%, proceed to Step 2 but flag "High Epistemic Conflict."

  #### Step 2: The Loss Sketch (5 Minutes)
  **Question:** "Fill the 2x2 Harm Grid. Do not use dollars. Use 'Patient-Harms' (morbidity/mortality) and 'System-Harms' (cost/capacity)."
  *   **Cell A (Act & Wrong):** Harm if we intervene and it turns out useless/harmful.
  *   **Cell B (Wait & Wrong):** Harm if we wait and the intervention turns out to be vital.
  *   **Sufficient Answer:** Consensus on which cell is "Catastrophic" vs. "Manageable."
  *   **Decision Rule:** If Cell B (Wait & Wrong) is Catastrophic and Cell A is Manageable, **Stop. Approve Now.** (Precautionary Principle overrides VoI).
  *   **Judgment Flag:** Clinicians usually weight Cell B higher; Budget Officers weight Cell A higher. If they cannot agree on which cell is "Catastrophic," this is a **Values Call**.

  #### Step 3: The Decay Penalty (3 Minutes)
  **Question:** "Does the value of this decision expire? If we wait the requested time, does the problem go away or get worse?"
  *   **Options:**
      1.  **Linear Decay:** Harm increases per day (e.g., backlog grows).
      2.  **Binary Cliff:** Value drops to zero after date X (e.g., flu season ends, grant expires).
      3.  **None:** Problem is stable (e.g., chronic care protocol).
  *   **Sufficient Answer:** Selection of 1, 2, or 3. If 2, state the "Drop-Dead Date."
  *   **Decision Rule:** If **Binary Cliff** and the requested delay crosses the cliff, **Stop. Approve Now.** (Data gathered after the cliff is worthless; VoI = 0).
  *   **Judgment Flag:** Estimating the "steepness" of Linear Decay is subjective.

  #### Step 4: The Decision-Switch Test (5 Minutes)
  **Question:** "What *specific* result from this new data would make us change our decision?"
  *   **Sufficient Answer:** A concrete threshold (e.g., "If mortality reduction is <5%, we won't adopt").
  *   **Stop Condition:** If the proposer cannot name a result that would stop the intervention, **Stop. Approve Now.** (This is "Confirmation Bias Data," not Value of Information).
  *   **Rent-Seeking Check:** "Who benefits from the delay?"
      *   If the beneficiary is the *researcher* (publication, grant extension) and not the *patient/system*, flag as **Epistemic Rent-Seeking**.
      *   If the beneficiary is the *budget office* (avoiding immediate spend), flag as **Fiscal Stalling**.
  *   **Decision Rule:** If Rent-Seeking is flagged and Cell B (Wait & Wrong) is Catastrophic, **Stop. Approve Now.**

  #### Step 5: The Final Weighing (5 Minutes)
  **Question:** "Compare the Cost of Waiting (Step 3) against the Decision-Switch Potential (Step 4)."
  *   **Sufficient Answer:** Majority vote on one of three outcomes.
  *   **Outcomes:**
      1.  **No — Approve Now:** Cost of Waiting > Value of Data. (Or Rent-Seeking detected).
      2.  **Yes — Delay is Rational:** Value of Data > Cost of Waiting. (Uncertainty is high, stakes are balanced, time is available).
      3.  **Values Call:** The math is balanced, but the *type* of harm is incommensurable (e.g., Budget vs. Life). This requires Senior Ethics/Board escalation.

  ---

  ### Application to Three Cases

  #### Case 1: Triage Protocol (200-Person Study)
  *   **Step 1 (Prior):** Clinicians 60% confident; Admins 50%. (Uncertainty exists).
  *   **Step 2 (Loss):** Act & Wrong = Mis-triage (Manageable). Wait & Wrong = Deaths from backlog (Catastrophic).
  *   **Step 3 (Decay):** Linear Decay (Backlog grows daily).
  *   **Step 4 (Switch):** "If study shows protocol increases mortality by >1%." (Concrete).
  *   **Step 5 (Weighing):**
      *   *Analysis:* Cell B is Catastrophic. Even if data is valuable, the cost of waiting (deaths) outweighs the refinement of the protocol.
      *   *Verdict:* **No — Approve Now.** (Implement with monitoring, do not delay for RCT).
      *   *Note:* The protocol prevents "perfect is the enemy of good."

  #### Case 2: Refusing to Wait on a Cheap Supplement
  *   **Step 1 (Prior):** 85% confident it's harmless/useful (low risk).
  *   **Step 2 (Loss):** Act & Wrong = Wasted $5 (Manageable). Wait & Wrong = Patient suffers deficiency (Manageable/High).
  *   **Step 3 (Decay):** None (Chronic condition).
  *   **Step 4 (Switch):** Proposer says, "We just want to be sure." No specific switch threshold named.
  *   **Step 5 (Weighing):**
      *   *Analysis:* Low cost of acting. Low specificity on data value.
      *   *Verdict:* **No — Approve Now.**
      *   *Rent-Seeking:* Flagged. Researcher wants publication on a trivial intervention.

  #### Case 3: Flu-Vaccine Rollout (The Breaking Point)
  *   **Scenario:** It is October. Flu season peaks in December. A proposal suggests waiting for a final efficacy report from a Southern Hemisphere study due in November.
  *   **Step 1 (Prior):** 70% confident the strain match is good.
  *   **Step 2 (Loss):** Act & Wrong = Wasted doses (System Harm). Wait & Wrong = Unvaccinated population during peak (Patient Catastrophe).
  *   **Step 3 (Decay):** **Binary Cliff.** Value drops to near-zero if rollout starts after January.
  *   **Step 4 (Switch):** "If efficacy <40%, we halt."
  *   **Step 5 (Weighing):**
      *   *The Procedure's Output:* If the committee treats Decay as *Linear* (Cost per week of delay), the math might say: "Wait 4 weeks for 20% more certainty."
      *   *The Break:* The procedure breaks if the committee fails to enforce the **Binary Cliff** rule in Step 3.
      *   *Where Judgment Takes Over:* The committee must recognize that "4 weeks" is not a cost; it is a **mission kill**.
      *   *Correction:* If Step 3 is answered correctly ("Binary Cliff: November 30"), the protocol forces **Approve Now**.
      *   *If the Protocol Fails:* If the committee answers Step 3 as "Linear," the protocol outputs "Delay." **This is the failure point.**
      *   *Why:* Good's Theorem assumes the *opportunity* to act remains constant. In seasonal epidemiology, the *opportunity* decays non-linearly.
      *   *Human Override:* The Chair must veto the "Delay" recommendation because the *context* (seasonality) invalidates the *linear assumption* of the loss function. This is a **Values Call** disguised as a math call.

  ---

  ### What This Procedure Cannot Do

  1.  **Settle Prior Disputes:** If the Clinician says "90% effective" and the Statistician says "40% effective," this protocol cannot solve that. It only flags it as "High Epistemic Conflict." You still need a tie-breaker (usually the Senior Clinician or Board).
  2.  **Handle Symbolic Harms:** The Loss Sketch (Step 2) handles morbidity and cost well. It handles "loss of public trust" or "dignitary harm" poorly. These are qualitative values that resist grid placement. If the debate is about trust, this is automatically a **Values Call**.
  3.  **Stop Political Weaponization:** A stakeholder can still game Step 4 by inventing a fake "Decision Switch" (e.g., "We need 99% certainty"). The Rent-Seeking check helps, but if the stakeholder has enough power, they can define "Catastrophic Risk" however they like. This protocol exposes the move, but does not prevent the power play.

  ### Summary for the Committee
  *   **Approve Now:** If waiting causes catastrophic harm, if the data won't change the decision, or if the window is closing (Binary Cliff).
  *   **Delay Rational:** If uncertainty is high, harms are balanced, time is available, and the data has a specific "switch" threshold.
  *   **Values Call:** If the disagreement is about *which harms matter more* (Life vs. Money) rather than *how much we know*.

  **Final Instruction:** Print this. Put it on the table. If someone says "we need more data," ask: "Step 4: What result stops you?" If they can't answer, you have your permission to vote.
