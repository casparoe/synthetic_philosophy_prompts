      *   *Point System/Bureaucracy:* The utilitarian calculus fails because of complexity. The show critiques rigid utilitarianism.
      *   *Resolution:* The show moves beyond DDE and Utilitarianism toward Virtue Ethics. Michael's redemption is key here. He isn't judged by points eventually; he's judged by his choices.
      *   *Conclusion:* The philosophy doesn't fit because the system was designed to be broken. The show argues for a more nuanced ethics than DDE or pure Utilitarianism allows.

  8.  **Refining constraints:**
