  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Ethics of Michael's neighborhood design in *The Good Place*, specifically through the lens of the Trolley Problem and the Doctrine of Double Effect (DDE).
      *   **Key Questions:**
