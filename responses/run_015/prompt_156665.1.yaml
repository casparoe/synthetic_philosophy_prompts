  2.  **Deconstruct the Doctrine of Double Effect (DDE):**
      *   *Core Principle:* An action causing harm is permissible if:
          1.  The act itself is morally good or neutral.
          2.  The bad effect is not intended (only foreseen).
          3.  The good effect is not produced *by means of* the bad effect.
          4.  The good effect outweighs the bad effect.
      *   *Application to Michael:*
          *   *Act:* Creating a neighborhood. (Neutral/Good?)
          *   *Intention:* Moral improvement (ostensibly) vs. Torture (actually).
          *   *Means/End:* Is suffering the tool to get improvement?
          *   *Proportionality:* Does eternal torture outweigh potential improvement?

  3.  **Analyze Michael's Role (Switch vs. Person):**
      *   *Trolley Problem:* Pulling the switch diverts harm to save others. Pushing the person uses a human as a means to stop the trolley.
      *   *Michael's Design:* He isn't just diverting a trolley; he *built the tracks*. He engineered the triggers.
      *   *Verdict:* He is pushing the person. The suffering isn't collateral damage; it's the mechanism.

  4.  **Analyze DDE Coverage vs. Collapse:**
      *   *Coverage:* Michael claims (in Season 2) that he wants to prove humans can improve. The suffering is foreseen but not the *goal* (allegedly).
      *   *Collapse:* The suffering *is* the measurement tool. Without the stressors triggering bad behavior, there's no data. Therefore, the bad effect is a means to the end. This violates DDE condition #3.
      *   *Season 2 Reveal:* The point system is broken. No one gets in. This makes the "improvement" goal impossible within the existing bureaucracy, rendering the proportionality condition (#4) void because the good effect is unachievable.

  5.  **Analyze Chidi's Indecision:**
      *   *Season 1:* Played for laughs (analysis paralysis).
      *   *Later Seasons:* Indecision causes harm. Waiting to choose is choosing. In the final judgment, inaction counts against you.
      *   *Ethical Implication:* Utilitarianism cares about outcomes. If indecision leads to bad outcomes, it's bad. Deontology cares about duty. If duty requires action, indecision is a failure of duty. The show leans towards virtue ethics/existentialism here: you must choose to define yourself.

  6.  **Analyze the Point System (Utilitarianism vs. Deontology):**
      *   *Point System:* Purely consequentialist/utilitarian calculus. Points added/subtracted based on outcomes and unintended consequences.
      *   *Problem:* It makes morality impossible because the world is too complex (unintended negative consequences outweigh good intentions).
      *   *Show's Resolution:* The system is fixed not by changing the math, but by changing the *process* (rebirth, testing).
      *   *Deontological Preservation:* The show ultimately argues that *intent* matters (Michael's redemption, the humans' growth). The final test isn't about points; it's about becoming better people. So, it preserves deontological/virtue ethics distinctions despite the utilitarian framework of the afterlife.

  7.  **Drafting the Response (Iterative Process):**

