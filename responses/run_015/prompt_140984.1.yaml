  Based on M's track record, she is a **Self-Sampling Assumption (SSA) Halfer with Causal Restrictions**. She accepts that your *rank* within a reference class is evidence (Doomsday), but she rejects that the *size* of the reference class is evidence for the world's existence (Presumptuous Philosopher), and she treats "finding yourself awake/existing" as non-informative (Sleeping Beauty).

  Here are the three rules that fit her history, their predictions for your new case, and my verdict.

  ### The Three Rules

  **1. The "Universal Doomsday" Rule (Global SSA)**
  *   **The Principle:** You should reason as if you are a random sample from *all* observers (or civilizations) that exist in the world, regardless of causal contact. If a theory implies there are vastly more civilizations than another, finding yourself in a specific one is strong evidence against that theory (just as finding yourself as an early human is evidence against a very long future).
