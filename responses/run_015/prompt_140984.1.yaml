  **2. The "Causal Reference Class" Rule (Local SSA)**
  *   **The Principle:** You sample only from observers (or civilizations) that are causally connected to you or potentially knowable. "Ask me when we meet some aliens" isn't a deferral; it's a boundary condition. If they are permanently out of sight, they are not in your reference class, so their numbers don't affect your sampling probability.
