prompt: |-
  I've been teaching medical ethics this semester and my grad students keep hitting the same snag with advance directives — the theory sounds neat, the earlier self wrote it, but then you've got a dementia patient who seems genuinely content now, and the directive was specifically written to reject life in exactly this kind of state where they no longer have narrative self-awareness. The identity question makes the authority question messy, and I don't want another one-off essay answer. Instead, write me a reusable decision procedure for a clinical ethics consultant who gets paged maybe twice a week about these conflicts. They have thirty minutes, no metaphysics background, and need to document why they either honored the directive or overrode it. Turn the debate about diachronic authority — is the past self a trustee with binding power, or just one preference-source among others? — into actual steps: ordered questions, what counts as a sufficient answer at each stage, the stop-points where you say honor the directive versus current patient's interests take precedence, and the explicit flag-points where it's not a technical call but a values judgment that needs family or sign-off. The hard cases have to include a patient with advanced dementia who smiles at caregivers but whose directive refused feeding tubes if they ever lost narrative self-awareness, and a case where the patient verbally revoked part of the directive after diagnosis but before losing capacity, with family split on whether that revocation was authentic. Run both through your procedure, and make sure one of them yields an answer the family is going to hate. Be honest about where the procedure misfires — say, when welfare and narrative continuity pull in opposite directions — and say plainly what it can't do. Also please seperate what's settled in the bioethics and policy literature from what's genuinely contested among philosophers who actually work on personal identity and diachronic autonomy; don't present one side of that authority debate as the consensus when it's not. I keep misspelling diachronic in my lecture notes so I feel your pain if you do too, but keep the distinction clear anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Medical ethics instructor teaching grad students.
      *   **Problem:** Students struggle with the conflict between advance directives (ADs) and the current well-being of dementia patients (the "then-self vs. now-self" problem).
      *   **Task:** Create a *reusable decision procedure* for a clinical ethics consultant (CEC).
      *   **Constraints:**
          *   Consultant has 30 minutes.
          *   No metaphysics background.
          *   Needs documentation justification (honor vs. override).
          *   Must translate the philosophical debate (diachronic authority) into actionable steps/questions.
          *   Must include stop-points and flag-points for value judgments/family sign-off.
          *   Must run two specific hard cases through the procedure:
              1.  Advanced dementia, content now, AD refuses feeding tube based on loss of narrative self-awareness.
              2.  Verbal revocation after diagnosis but before incapacity, family split on authenticity.
          *   One outcome must be one the family will hate.
          *   Must acknowledge limitations/misfires (welfare vs. narrative continuity).
          *   Must distinguish settled bioethics/policy from contested philosophy (personal identity/diachronic autonomy).
          *   Tone: Professional, practical, honest about uncertainty.
          *   Note: User mentioned misspelling "diachronic," asked to keep the distinction clear (implies I should use the term correctly but explain it simply).

  2.  **Deconstruct the Philosophical/ethical Landscape:**
      *   *Settled/Policy:* ADs are legal documents. Capacity assessment is standard. Surrogate decision-makers exist. Best Interest Standard vs. Substituted Judgment Standard.
      *   *Contested/Philosophical:* Does the past self bind the future self if psychological continuity is broken? (Dworkin vs. Dresser/Robertson). Is current experiential well-being enough to override prior critical interests?
      *   *The "Diachronic" Issue:* Authority over time. Is the AD a binding command (Ulysses contract) or a strong preference?

  3.  **Drafting the Decision Procedure (The "30-Minute Triage"):**
      *   Needs to be linear.
      *   Needs to filter out easy cases first (validity, capacity).
      *   Needs to address the core conflict explicitly.
      *   *Step 1: Validity & Capacity (The Gatekeepers).* Is the AD legal? Is the patient currently capacitated? (If capacitated, AD is irrelevant, current wishes rule).
      *   *Step 2: Specificity & Applicability.* Does the AD actually cover *this* medical situation?
      *   *Step 3: The "Diachronic Conflict" Check.* This is the core. Is there a visible conflict between current well-being and prior values?
      *   *Step 4: The Authority Weighting.* How much weight does the prior self get? (This needs to be operationalized without metaphysics).
      *   *Step 5: The Flag Point.* When to escalate to IRB/Court/Family Consensus.

  4.  **Developing the Cases:**
      *   *Case 1 (Content Dementia/Feeding Tube):* AD says no tube if "no self." Patient is happy/feeding orally but losing weight. Decision: Honor AD? Or feed?
          *   *Goal:* One outcome the family hates. If we honor the AD, the family (seeing a happy grandma) will hate it. If we override, the patient dies according to prior wishes. Let's aim for honoring the AD (as per Dworkin/critical interests) because that's the harder ethical pill for families, but acknowledge the friction.
      *   *Case 2 (Verbal Revocation):* Patient said "I changed my mind" while still capacitated but maybe stressed? Family split.
          *   *Goal:* Show the procedural handling of revocation.

  5.  **Refining the Procedure for the "30-Minute" Constraint:**
      *   It can't be a philosophical treatise. It needs checklists.
      *   It needs to explicitly state: "We are not solving personal identity here; we are applying policy *informed* by the debate."

  6.  **Addressing the "Settled vs. Contested" Requirement:**
      *   Need a preamble or sidebar that clarifies:
          *   *Settled:* Legal validity, capacity assessment, surrogate hierarchy.
          *   *Contested:* Whether the "then-self" has moral authority over the "now-self" when psychological continuity is severed (Dworkin's Critical Interests vs. Dresser's Experiential Interests).

  7.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the instructor's pain point. Define "Diachronic" clearly (across time).
      *   *The Landscape:* Distinguish Policy vs. Philosophy.
      *   *The Procedure:* "The 30-Minute Diachronic Triage Protocol."
          *   Phase 1: Legal/Medical Baseline.
          *   Phase 2: The Conflict Assessment.
          *   Phase 3: Weighting & Decision.
          *   Phase 4: Documentation & Flags.
      *   *Case Applications:* Run Case 1 and Case 2 through the protocol.
      *   *Limitations:* Where does this fail? (When welfare and autonomy clash irreconcilably).

  8.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions Yes/No where possible. Define "Sufficient Answer."
      *   *Critique:* Did I distinguish settled vs. contested enough?
      *   *Fix:* Add a specific box/table for this.
      *   *Critique:* Did I ensure one family hates the outcome?
      *   *Fix:* In Case 1, recommend honoring the AD (withholding tube) despite current contentment. This aligns with the "Critical Interest" view but hurts the family seeing a "happy" patient.
      *   *Critique:* Did I handle the "Verbal Revocation" correctly?
      *   *Fix:* If capacity was present during revocation, AD is void. If capacity is disputed, that's the flag point.
      *   *Tone Check:* Keep it clinical but ethically robust. Don't pretend the metaphysics are solved.

  9.  **Final Polish:**
      *   Check spelling of "Diachronic."
      *   Ensure the distinction between *Substituted Judgment* (what they would want) and *Best Interest* (what is good for them now) is clear in the procedure.
      *   Make sure the "Flag Points" are explicit about when the consultant steps back.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a request for a clinical tool that bridges high-level moral philosophy and bedside triage. Below is a decision procedure designed for a Clinical Ethics Consultant (CEC). It is structured to be completed in 30 minutes, requires no metaphysics training, and forces explicit documentation of where the "hard philosophy" is being hidden behind policy or value judgments.

  Following the procedure, I have applied it to your two cases and provided the required distinction between settled policy and contested philosophy.

  ***

  # The 30-Minute Diachronic Triage Protocol (DDTP)
  **For:** Clinical Ethics Consultants
  **Context:** Conflicts between Advance Directives (AD) and Current Well-being in Incapacitated Patients
  **Goal:** Documented justification to Honor or Override.

  ### Part 1: The Landscape (Read Before Starting)
  *Do not spend consultation time debating this. This is your background briefing.*

  | **Settled Policy & Law** | **Contested Philosophy (The "Diachronic" Debate)** |
  | :--- | :--- |
  | **Capacity:** If the patient has capacity *now*, the AD is void. Current wishes rule. | **Identity:** Does the person who wrote the AD remain the *same moral agent* as the dementia patient? (Psychological Continuity vs. Biological Continuity). |
  | **Validity:** ADs must be signed/witnessed per state law. | **Authority:** Does the "Past Self" have trustee authority (binding) or advisory authority (one input among many)? |
  | **Surrogates:** Hierarchies exist (Spouse > Adult Children > etc.). | **Interests:** Do "Critical Interests" (life narrative values) outweigh "Experiential Interests" (current pleasure/pain)? |
  | **Revocation:** Oral revocation is valid *if* the patient had capacity at the time. | **Harm:** Is it a harm to force a demented patient to live a life they previously deemed undignified, even if they enjoy it now? |

  ***

  ### Part 2: The Procedure

  #### Phase 1: The Gatekeepers (Minutes 0–5)
  *If you fail these, stop. Do not proceed to ethical weighting.*

  1.  **Is the patient currently capacitated regarding this decision?**
      *   *Assessment:* Can they understand, appreciate, reason, and express a choice *now*?
      *   *Yes:* **STOP.** Honor current wishes. AD is inactive. Document capacity assessment.
      *   *No:* Proceed to Q2.
  2.  **Is the Advance Directive legally valid and accessible?**
      *   *Assessment:* Signed, witnessed, not revoked by a later valid document.
      *   *No:* **STOP.** Proceed to Surrogate Standard (Best Interest).
      *   *Yes:* Proceed to Q3.
  3.  **Does the clinical situation match the AD trigger?**
      *   *Assessment:* AD says "Terminal Condition" but patient is "Permanent Unconsciousness"? Or AD says "Dementia" specifically?
      *   *No:* **STOP.** AD does not apply. Use Surrogate Standard.
      *   *Yes:* **Proceed to Phase 2.**

  #### Phase 2: The Diachronic Conflict Assessment (Minutes 5–20)
  *This is where you map the philosophical snag without using philosophical jargon.*

  4.  **Is there a visible conflict between Prior Values and Current Welfare?**
      *   *Question:* Does the patient appear content/satisfied *now* in the state the AD forbids?
      *   *Answer:* **No** (Patient is suffering): **Honor AD.** (Prior wishes and current welfare align).
      *   *Answer:* **Yes** (Patient seems content): **FLAG.** Proceed to Q5.
  5.  **What is the basis of the Prior Refusal?**
      *   *Question:* Did the AD refuse treatment based on *physical pain/burden* OR based on *loss of identity/interaction*?
      *   *Answer:* Physical Burden: Weight current welfare heavily (Patient is not in pain).
      *   *Answer:* Loss of Identity/Narrative: Weight prior autonomy heavily (This is a "Critical Interest" case).
  6.  **Is there evidence of Revocation or Ambiguity?**
      *   *Question:* Did the patient express changed wishes *after* diagnosis but *before* incapacity?
      *   *Answer:* Yes, with witnesses/capacity: **AD is Void.** Honor revocation.
      *   *Answer:* Yes, but capacity is disputed: **FLAG.** Proceed to Phase 3.
      *   *Answer:* No: Proceed to Phase 3.

  #### Phase 3: Weighting & Decision (Minutes 20–25)
  *Choose one path. You cannot walk both.*

  **Path A: The Trustee Model (Honor the AD)**
  *   *Rationale:* The prior self made a binding decision to protect their life narrative. Current contentment is a symptom of the condition they sought to avoid.
  *   *Requirement:* The AD must be specific about the condition (e.g., "If I cannot recognize my family").
  *   *Documentation:* "Patient's critical interests (narrative integrity) outweigh current experiential interests."

  **Path B: The Welfare Model (Override the AD)**
  *   *Rationale:* The patient is a distinct moral entity now. Causing death to a content being violates the duty of non-maleficence.
  *   *Requirement:* Strong evidence of current enjoyment (not just absence of pain) and vague AD language.
  *   *Documentation:* "Current best interest supersedes prior directive due to significant discontinuity in psychological identity."

  #### Phase 4: The Flag Points (Minutes 25–30)
  *If you hit these, you cannot decide alone. You need sign-off.*

  *   **FLAG 1 (Family Dissent):** If the surrogate/family strongly opposes the Path A/B decision derived above. *Action:* Convene family meeting. If impasse remains, recommend Legal/Risk Management.
  *   **FLAG 2 (Disputed Capacity at Revocation):** If family splits on whether the patient had capacity when they verbally changed their mind. *Action:* Treat as "Unclear AD." Default to Life-Prolonging treatment until court/proxy clarification.
  *   **FLAG 3 (The "Happy Dementia" Hard Case):** If Path A (Honor AD) leads to death of a smiling patient. *Action:* This requires Attending Physician + Ethics Committee Chair sign-off. Do not carry this alone.

  ***

  ### Part 3: Case Applications

  Here is how the DDTP runs through your two specific scenarios.

  #### Case 1: The Content Dementia Patient
  *   **Scenario:** 78F, advanced dementia. Smiles, enjoys music, feeds self poorly. AD refuses feeding tube if she loses "narrative self-awareness." Family wants the tube; she looks happy.
  *   **Phase 1:** Incapacitated? Yes. AD Valid? Yes. Trigger Match? Yes ("narrative self-awareness" lost).
  *   **Phase 2:** Conflict? **Yes** (She is content). Basis of Refusal? **Identity/Narrative** (Not physical pain). Revocation? No.
  *   **Phase 3 Decision:** **Path A (Honor AD).**
      *   *Reasoning:* The AD was specifically designed for this philosophical snag. The patient defined her life by cognitive continuity. Honoring her current smile violates the specific "Critical Interest" she documented.
  *   **Phase 4 Flag:** **FLAG 1 & FLAG 3.**
      *   *Outcome:* The recommendation is to **withhold the feeding tube.**
      *   *Family Reaction:* **They will hate this.** They see a happy mother; you are recommending she starve based on a document written by a "different" person.
      *   *Documentation Note:* "While patient exhibits experiential welfare, the directive explicitly prioritizes narrative identity. Overriding this reduces the AD to a suggestion and violates the autonomy of the competent self who anticipated this specific state of being."

  #### Case 2: The Verbal Revocation
  *   **Scenario:** 65M, diagnosed with early Alzheimer's. Six months later (still capacitated per chart), tells daughter, "If I get bad, just keep me going." Two years later, incapacitated. AD says "No life support." Son (holder of POA) wants to follow AD. Daughter wants to follow verbal comment.
  *   **Phase 1:** Incapacitated? Yes. AD Valid? Yes.
  *   **Phase 2:** Conflict? Yes. Revocation? **Yes, disputed.**
  *   **Phase 3 Decision:** **FLAG 2 (Disputed Capacity at Revocation).**
      *   *Reasoning:* You cannot verify capacity at the time of the verbal comment without a contemporaneous assessment.
  *   **Phase 4 Flag:** **FLAG 2.**
      *   *Outcome:* **Default to Life-Prolonging Treatment.**
      *   *Reasoning:* In the absence of clear evidence that a revocation was capacitated, the written legal document stands *unless* there is clear and convincing evidence of change. However, because the family is split, the risk of liability for wrongful death (if you follow daughter) vs. battery (if you follow son) is high.
      *   *Documentation Note:* "Verbal revocation occurred in outpatient setting without capacity documentation. Under state law, written AD prevails absent clear proof of capacitated revocation. However, due to surrogate conflict, treatment continues until proxy consensus or legal adjudication."
      *   *Family Reaction:* The Son (wanting to honor AD) will hate this. He is being forced to keep his father alive against the written word.

  ***

  ### Part 4: Limitations & Misfires (For your Lecture Notes)

  You asked for honesty about where this procedure breaks. A 30-minute consult cannot solve the metaphysics of personal identity. Here is where the DDTP misfires:

  **1. The "Welfare vs. Narrative" Misfire**
  *   **The Problem:** In Case 1, the procedure recommends honoring the AD (Path A). This assumes the "Past Self" has moral authority.
  *   **The Philosophical Snag:** If you subscribe to the view that severe dementia creates a *new* person (psychological discontinuity), the Past Self has no authority over the New Person. The procedure forces the consultant to pick a side (Path A or B) without resolving the metaphysics.
  *   **The Risk:** You may authorize the death of a content being based on a metaphysical assumption (continuity of self) that is genuinely contested in philosophy (Dresser vs. Dworkin).

  **2. The "Best Interest" Black Box**
  *   **The Problem:** Phase 3, Path B relies on "Current Best Interest."
  *   **The Philosophical Snag:** "Best Interest" usually implies welfare. But for humans, is welfare just pleasure (experiential) or is it living in accordance with values (critical)? If the patient values dignity over pleasure, is it in their *current* best interest to be kept alive undignified?
  *   **The Risk:** The procedure treats "Current Welfare" as observable (smiling = good). This ignores that the patient may be experiencing a diminished state they would find abhorrent *if they could understand it*.

  **3. The Procedural Shield**
  *   **The Problem:** The "Flag Points" push hard decisions to committees or courts.
  *   **The Reality:** This protects the consultant, not the patient. It turns a moral tragedy into a bureaucratic delay.
  *   **The Risk:** In Case 2, defaulting to treatment while waiting for consensus may result in the patient undergoing invasive procedures they likely did not want, simply because the family cannot agree on the *past* capacity.

  ### Summary for Students
  *   **Settled:** Law requires us to follow valid ADs from capacitated selves.
  *   **Contested:** Whether the "self" that wrote the AD is the same "self" in the hospital bed.
  *   **The Tool:** The DDTP forces you to document *which* ethical weight you are applying (Narrative Integrity vs. Current Welfare) so that if you are wrong, you are wrong transparently, not accidentally.

  *(Note on spelling: "Diachronic" means "across time." "Synchronic" means "at one time." The conflict is diachronic because it spans the timeline of the patient's identity.)*
