answer: |-
  Hey, it sounds like you stumbled into a pretty sophisticated debate without realizing it, because your roommate and her study partner are essentially reenacting a major conflict in environmental history and philosophy that has been going on for decades. It is actually fascinating that you were just nodding along because the tension they are describing is real, but I can definitely help you unpack who is landing their punches and who is swinging at air. I will go through their exchange move by move just like you asked and give you a rating on each argument along with why I think so, and then I will wrap up with who comes out on top and what blind spots they both still have.

  Starting with Marcus's opening move where he claims agency requires intentionality and that calling Tambora an actor lets governments off the hook, I would rate this as mostly right but slightly conflated. He is philosophically consistent with a traditional humanist view where agency is tied to moral personhood and intent, so on those terms he is correct that a volcano does not have intentions. However, he becomes slightly mistaken when he implies that acknowledging the volcano's causal power automatically erases human moral responsibility. History shows that famines are rarely just about crop failure but about distribution and policy, so his worry is valid, but he is treating explanation as if it were exoneration, which is a logical slip.

  Priya's first pushback about structural veto power and the distinction between causal weight and moral excuse is clearly right. She is accurately describing how material constraints work without needing to attribute human-like consciousness to them. The river analogy is strong because it illustrates how the environment sets the boundaries of the possible without dictating the specific choices made within those boundaries. By separating the physical reality of a veto from the moral question of blame, she avoids the trap Marcus set, and her point about anthropocentrism is well-founded because ignoring material limits does lead to bad history.

  When Marcus comes back with the market comparison and the matchstick analogy regarding the Black Death, I would rate this as mixed and leaning toward mistaken. He is right that markets are emergent properties of human intention while viruses are not, so there is a categorical difference there. However, his comparison of the bacterium to a matchstick is clearly mistaken because a matchstick is inert matter while a bacterium has a reproductive logic and evolutionary trajectory that actively interacts with human systems. Treating a replicating pathogen as merely a tool like a matchstick ignores the biological reality that the pathogen changes the game in ways the arsonist cannot fully control.

  Priya's response about the interaction effect and the weakening of feudal labor structures is clearly right. This is a well-documented historical phenomenon where the biological reality of the plague forced economic shifts that no human planner intended. She is correct that calling this mere background ignores the structural coupling between human and non-human dynamics, and her focus on unintended outcomes validates the idea that non-human forces shape history even without having a plan.

  Marcus's next point about giving the plague a seat at the table making it impossible to blame anyone is mostly mistaken. This is a slippery slope argument that assumes acknowledging constraints removes all freedom, which is not how responsibility works in law or ethics. We constantly judge human actions within the context of difficult circumstances without absolving the actors, so his fear that recognizing microbial agency destroys moral accountability is an overstatement that does not hold up to scrutiny.

  Priya's final analogy about the arsonist and oxygen is clearly right and effectively shuts down Marcus's moral worry. Recognizing oxygen as a necessary condition for fire does not excuse the arsonist, just as recognizing microbial conditions does not excuse policy failures. This perfectly captures the nuance that multiple causes can exist simultaneously without canceling out human responsibility, and it clarifies that acknowledging non-human forces is about understanding the full context of an event rather than finding a scapegoat.

  Overall, I think Priya is more right than Marcus, primarily because she has a more robust framework for handling complex systems where human and non-human forces interact. Marcus is holding onto a stricter definition of agency that protects moral responsibility but fails to account for the material realities that shape human choices, whereas Priya manages to keep both the material constraints and the human responsibility in the picture without collapsing one into the other. Marcus is right to worry about determinism, but he is fighting a strawman version of environmental history that Priya successfully corrects.

  However, there are things both of them are missing that might help you understand the bigger picture. They are both overlooking the concept of political ecology, which is the idea that human structures often amplify natural shocks rather than just reacting to them. For example, a volcanic winter causes crop failure, but whether that becomes a famine depends on grain storage, trade laws, and class structures, so the non-human force is the trigger but the human system is the amplifier. Additionally, they are talking past each other on the definition of agency itself, where philosophers often distinguish between agents who have projects and actants who simply exert force, and neither of them explicitly makes that distinction which would solve much of their semantic disagreement. Marcus is worried about moral dilution while Priya is worried about analytical blindness, and the truth is that you need Priya's analytical lens to understand the event but Marcus's moral framework to judge the human response to it. It is a great debate to have listened to, and honestly, you probably understood more than you thought by just noticing that they were talking about different layers of the same problem. Hope that helps you jump in next time they start arguing over coffee.
