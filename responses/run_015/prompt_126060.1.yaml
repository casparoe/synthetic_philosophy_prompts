      *   *Williams Point:* The student says the idealized model issues an external reason. But idealized models (like Smith's) argue that if you were rational, you *would* have the motivation. So it's internal. The student needs to argue why *this specific* idealization fails the internalist test, not just assert it.
      *   *Insulation Point:* The student says indirect reasons protect the trait from being overridden in *any* single case. This is controversial. Many indirect theorists allow for "esoteric" morality or collapse conditions. The student treats the psychological erosion of the disposition as a normative shield without arguing why the indirect reason wouldn't favor suspension in *this* specific high-stakes case (one life vs. long-term trust).
