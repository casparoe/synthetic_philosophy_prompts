  The phenomenal-essentialist view (A) insists pain's sensory quality inherently entails suffering. Regarding asymbolics who say, "it hurts but I don't care," View A must argue these patients are mistaken or behaviorally suppressed; the negative valence remains present phenomenally despite their indifference. Conversely, the integrative-command view (B) treats pain as a unified imperative to protect the body. It accepts the patient's report literally: the sensory signal persists, but the motivational command causing aversion is disconnected, thereby removing the badness.

  Consider "reverse asymbolia": intense distress and withdrawal without localized sensory quality. View A struggles here, as it ties badness inextricably to sensory phenomenology; without the "hurt," there should be no pain-based suffering. View B accommodates this naturally: the protective command and affective distress can activate independently of specific sensory localization, similar to panic or anxiety.

  The existence of both standard asymbolia (sensation without badness) and reverse asymbolia (badness without sensation) demonstrates a double dissociation. This strongly favors View B over View A, as View A cannot easily explain either separation without ad hoc assumptions about hidden suffering or misreported phenomenology. View B explains both as modular failures within the pain system.

  Therefore, pain's badness should be located not in its phenomenal character, but in its motivational integration—the command to act—which can dissociate from raw sensory input.
