      *   *Key Criterion:* It's not just input-output mapping. It's about *competence without comprehension* vs. *comprehension*. For Dennett, comprehension arises from layers of competence built through evolution and learning. AI currently has competence without the deep, embodied, evolutionary grounding that yields genuine understanding (and thus moral status).
      *   *Normativity:* There is a difference between *treating* something as a person (Intentional Stance) and it *being* a person (having the requisite functional/evolutionary depth).

