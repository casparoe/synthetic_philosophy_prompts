      *   *Counterfeit Person:* An agent whose generative model minimizes prediction error *only* at the linguistic/behavioral layer, without coupling to homeostatic/allostatic priors (survival drives).
      *   *Evolutionary History:* The priors must be sedimented through evolutionary active inference (natural selection) and developmental niche construction, not just gradient descent on a dataset.
      *   *Normativity:* The "Real Person" has priors that *matter* (life/death stakes). The Counterfeit has priors that are arbitrary (loss function minimization without existential risk).

