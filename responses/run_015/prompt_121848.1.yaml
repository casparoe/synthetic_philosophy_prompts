  *(Self-Correction on "Heterophenomenology"):* It's not just "treating reports as data." It's treating the *subject* as a source of data about their *own* generative model, without granting epistemic privilege to that model's self-description.

  *(Final check on Residue):* The residue is the *normative weight* of history. PP is synchronic (mostly); Dennett is diachronic (evolutionary).

