answer: |-
  You are not over-analyzing. You have identified a specific, robust rhetorical maneuver that is distinct from standard testimonial injustice, though it borrows its mechanics.

  There is no single, canonical Latin term for this specific configuration (like *ad hominem* or *straw man*), but in Social Epistemology and Science and Technology Studies (STS), this is recognized as a form of **Strategic Boundary Work** or **Asymmetric Epistemic Gatekeeping**. Recently, some philosophers have begun referring to this as **Epistemic Gerrymandering**.

  Here is the carving you asked for: the conceptual anatomy of the move, how it differs from Fricker's categories, and where the boundaries lie.

  ### 1. The Anatomy of the Move
  The phenomenon relies on three simultaneous operations:
  1.  **Hyper-Specialization (The Quarantine):** An expert in Field A is told their expertise is *too narrow* to cover Field B (which is adjacent or dependent on A).
  2.  **De-Specialization (The Import):** A non-expert in Field C is told their lack of specific training is irrelevant because their perspective is "broad," "ethical," or "common sense" regarding Field B.
  3.  **Outcome-Dependent Enforcement:** The strictness of the boundary is correlated with the conclusion the speaker supports, not the structural relationship between the fields.

  This is not a disagreement about *what is true*; it is a disagreement about *who is permitted to speak truth*.

  ### 2. Why It Is Not (Exactly) Fricker's Epistemic Injustice
  You are right to sense a divergence from Miranda Fricker's framework.

  *   **Vs. Testimonial Injustice:** Fricker's testimonial injustice is rooted in **identity prejudice** (race, gender, class) causing a *credibility deficit*. In your examples, the climate scientist is not being dismissed because she is a woman or marginalized; she is being dismissed because she is *too* credentialed in the "wrong" way. The prejudice here is not against the *person*, but against the *domain* when it yields inconvenient results. Furthermore, testimonial injustice is typically a deficit (lowering credibility); this move is **differential** (lowering one while raising another asymmetrically).
  *   **Vs. Hermeneutical Injustice:** This occurs when someone lacks the concepts to make their experience intelligible (e.g., lacking the term "sexual harassment"). Your scenario involves speakers who *have* the concepts and the data but are barred from deploying them.
  *   **The Closer Fit: Distributive Epistemic Injustice:** This is a newer extension of Fricker's work (by scholars like Kristie Dotson or Miranda Uptal). It concerns the unfair distribution of *epistemic participation*—who gets to produce knowledge. Your scenario is a tactical manipulation of distributive injustice.

  ### 3. The Established Concept: Strategic Boundary Work
  The most precise academic anchor for this is **Thomas Gieryn's "Boundary Work."**
  Gieryn argued that "science" is not a fixed category but a rhetorical resource. Actors expand or contract the boundaries of "legitimate expertise" to include allies and exclude opponents.

  *   **Expansion:** When the economist speaks on climate, the audience *expands* the boundary of "relevant expertise" to include economics.
  *   **Contraction:** When the climatologist speaks on policy, the audience *contracts* the boundary to exclude policy implications.

  When this is done selectively based on political or ideological desired outcomes, it is **Strategic Boundary Work**.

  ### 4. Proposed Label: Epistemic Gerrymandering
  If you are looking for a term to coin or adopt, **Epistemic Gerrymandering** is the strongest fit.
  Just as political gerrymandering draws district lines to maximize one party's power regardless of geography, epistemic gerrymandering draws disciplinary lines to maximize one conclusion's credibility regardless of actual competence.

  **Why this label works:**
  *   It captures the **artificiality** of the boundaries.
  *   It captures the **strategic intent** (maximizing a specific outcome).
  *   It captures the **asymmetry** (different rules for different districts).

  ### 5. The Carving: Boundaries and Edge Cases
  To ensure this concept doesn't become a catch-all for "any time I dislike an argument," here is where the phenomenon stops and starts.

  #### Necessary Conditions (The "Heart" of the Phenomenon)
  For this to count as Epistemic Gerrymandering/Strategic Boundary Work, three conditions must be met:
  1.  **Adjacency:** The fields in question must be reasonably adjacent (e.g., Climate Science and Energy Policy; Medicine and Ethics). If a virologist tries to speak on macroeconomics, telling them to "stay in their lane" is legitimate, not gerrymandering.
  2.  **Inconsistency:** The standard for "relevant expertise" must shift between speakers. If you dismiss *both* the scientist and the philosopher on policy grounds, that is consistent technocracy. If you accept *both* because they are "smart people," that is consistent populism. The injustice lies in the **switch**.
  3.  **Correlation with Conclusion:** The boundary drawing must track with the acceptability of the conclusion. (e.g., The scientist is silenced *only* when advocating for regulation; the economist is heard *only* when advocating for markets).

  #### Boundary Cases (Where it gets murky)
  *   **Legitimate Lane-Keeping:** A Nobel physicist claims to have solved consciousness using quantum mechanics. Dismissing them is not gerrymandering; it is valid demarcation. The test is: *Is the boundary being drawn based on methodological rigor or conclusion comfort?*
  *   **Interdisciplinary Disagreement:** An ethicist and a doctor disagree on triage protocols. If the audience listens to both but weighs the doctor higher on survival rates and the ethicist higher on moral weight, that is **Epistemic Division of Labor**, not gerrymandering. Gerrymandering occurs when the ethicist is silenced on *moral* grounds because the doctor disagrees, or vice versa.
  *   **The "Public Intellectual" Exception:** Some figures (e.g., Noam Chomsky, Jared Diamond) build careers on crossing lanes. Criticizing them for trespassing is not necessarily gerrymandering if the criticism is applied consistently to all public intellectuals regardless of their political alignment.

  #### Where it stops being this and starts being something else
  *   **If it's unconscious:** If an audience genuinely believes economists understand climate better than climatologists due to a misunderstanding of the fields (not strategic manipulation), this is **Epistemic Confusion** or **Category Error**, not gerrymandering. Gerrymandering implies a functional utility to the boundary-drawing.
  *   **If it's about method, not domain:** If the scientist is dismissed because they used a flawed statistical model, and the economist is accepted because they used a robust one, that is **Methodological Critique**. The phenomenon you are describing ignores method and focuses solely on *disciplinary identity*.

  ### Summary
  You have identified a manipulation of **epistemic authority** via **asymmetric boundary enforcement**.

  *   **Academic Term:** Strategic Boundary Work (Gieryn).
  *   **Descriptive Term:** Epistemic Gerrymandering.
  *   **Mechanism:** Contracting the "competence circle" for inconvenient experts while expanding it for convenient non-experts.
  *   **Distinction from Fricker:** It is not about identity prejudice (Testimonial) or lack of concepts (Hermeneutical); it is about the **politics of domain demarcation**.

  This is a vital concept because it immunizes bad arguments from critique. By framing the climate scientist as "merely technical" and the economist as "broadly visionary," the arguer avoids engaging with the data and instead fights a meta-debate about who is allowed to speak. Recognizing this move allows you to pivot the conversation back to the evidence: *"Regardless of their title, does the argument hold? If the economist's training is sufficient to speak on climate impacts, why is the climatologist's training insufficient to speak on climate policy?"*
