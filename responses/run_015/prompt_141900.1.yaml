prompt: |-
  I have just come away from a long and frustrating argument with a friend about whether any purely behavioral criterion could ever be an adequate test for the presence of a mind, and I now think the argument stalled because we were operating with different, unstated requirements.

  My friend is a thoroughgoing skeptic about behavioral tests. He insists that verbal behavior is cheap: a machine might produce flawless conversational behavior by consulting a vast precomputed list of question-and-answer pairs, or by exploiting statistical regularities in a way that involves no understanding whatsoever, and it would still be a mere automaton. He also pressed the case of a being that is fully conscious and intelligent but, whether by choice, by paralysis, or by never having learned a language, produces no relevant behavior at all; such a being would fail any behavioral test, yet plainly has a mind. From this he concluded that no behavioral criterion can be adequate: at best it is fallible evidence, never a criterion.

  I pushed back as hard as I could. I argued that the whole attraction of a behavioral criterion is that it must be public, checkable, and action-guiding; if we demand direct access to inner states, we have no way to apply the criterion to other human beings, let alone to machines, non-human animals, or aliens. I also argued that the classical imitation game is too narrow, because it tests only conversational fluency in a human idiom, and that a better behavioral criterion would look instead at the candidate's capacity for sustained, embodied, norm-governed cooperation with others over time. My friend replied that this merely changes the behavior, not the underlying problem. At that point we were talking past each other.

  I do not want a reading list or a history of the debate. I want a specification. Suppose we want a behavioral criterion good enough to underwrite one serious practical decision: whether to treat a candidate—an artificial system, a non-human animal, a human patient who cannot speak, or an imagined alien—as a subject of experience and a bearer of interests, with the moral protections that go with that. Write the desiderata: the requirements any behavioral criterion for mind would have to meet to count as adequate for that purpose, with the case or consideration behind each requirement.

  Please build the list around the stress cases my friend and I improvised, and add any others you think load-bearing. The cases should include at least the following.

  First, the Ledger case: a system that contains, for every question it can be asked within the test, a stored answer, and that produces its replies purely by looking them up, with no real-time inference, no understanding, and no perspective of its own; it is behaviorally indistinguishable, within the test, from a being that understands.

  Second, the Silent Sage: a being that is conscious, intelligent, and fully capable of experience and thought, but that cannot exhibit the behavior the criterion demands—whether because it has no suitable output channel, because it has chosen silence, or because it is a human patient who is conscious but can only blink and thus cannot satisfy a rich verbal or interactive test. The point is that the absence of the tested behavior need not mean the absence of mind.

  Third, the Parochial Interrogator: the test is administered by an interrogator from a radically different culture or species, who does not share human conversational norms, so that a candidate might fail merely because it cannot navigate those local norms rather than because it lacks a mind.

  Fourth, the Longitudinal Collaborator: instead of a short interrogation, the candidate spends years working with human beings on a shared, physically situated project, and its success depends on perception, action, memory, correction, and responsiveness to norms over time.

  Fifth, the Perfect Actor: a candidate that can produce apparently sincere avowals of pain, love, confusion, and fatigue, and can even behave in human-like ways when it is uncertain or mistaken, but is only simulating all of it.

  Sixth, the Language-less Human: a human being raised without exposure to any language until late adolescence, who before linguistic training has desires, fears, perceptual experiences, and a point of view, but cannot pass a verbal test.

  For each requirement, give the motivating case or consideration, and say what the criterion must get right: which cases it must not misclassify, which distinctions it must respect (for example, between evidence for mind and the constitutive mark of mind; between dispositional and occurrent states; between failing to exercise a capacity and lacking it; between mere behavioral mimicry and the real thing; between human parochial norms and mind as such), and which empirical or conceptual results it must not contradict. Mark each requirement as non-negotiable or as a preference of a particular camp, and say why.

  Above all, tell me which requirements pull against each other. I strongly suspect that some subset cannot be jointly satisfied. For instance, a demand that the criterion never produce false negatives—that it must classify every genuinely minded being as minded—seems to force us to accommodate silent, non-verbal, or alien minds, and therefore to make the behavioral evidence very permissive; but a demand that it never produce false positives—that it must exclude Ledger systems and Perfect Actors—seems to force us to require some internal, real-time processing or understanding, which we may be unable to verify from behavior without reintroducing false negatives. If there is a genuine inconsistency in the full set of desiderata, identify the smallest subset that is jointly unsatisfiable and explain the trade-off; that is the part I most want to see.

  Once the desiderata are on the table, score them briefly: in a sentence or two each, say how three candidate views measure up. The first is the classical imitation game restricted to text-based conversation. The second is a total Turing test that requires the candidate to perceive and act on the physical world, and to cooperate with others, over an extended period. The third is a position that treats the presence of a specific neurophysiological or functional organization as the real criterion, and treats behavior only as evidence of it. Keep the scoring brief; the important work is the list of requirements and the tensions among them.

  Finally, close by saying what, if anything, a behavioral criterion can honestly deliver given those tensions. I would rather have a criterion that is explicit about its limits than one that pretends to do more than it can.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Specify desiderata (requirements) for a *behavioral criterion* of mind adequate for a specific practical decision: granting moral protection/subject-of-experience status.
      *   **Context:** The user had a stalled argument with a skeptic friend about behavioral tests (Turing Test style) vs. internal states.
      *   **Constraints:**
          *   No reading lists or history.
          *   Build around specific stress cases provided (Ledger, Silent Sage, Parochial Interrogator, Longitudinal Collaborator, Perfect Actor, Language-less Human).
          *   Add other load-bearing cases if necessary.
          *   For each requirement: Motivating case, what it must get right (distinctions), Non-negotiable vs. Preference.
          *   **Crucial:** Identify tensions/inconsistencies among requirements (the "smallest subset that is jointly unsatisfiable").
          *   **Scoring:** Briefly score three candidate views (Classical TT, Total/Embodied TT, Neuro/Functional Criterion).
          *   **Conclusion:** State what a behavioral criterion can *honestly* deliver given the tensions.
      *   **Tone:** Philosophical, precise, analytical, pragmatic (focused on the moral decision).

  2.  **Deconstruct the Stress Cases & Derive Requirements:**

      *   *Case 1: The Ledger (Lookup Table).*
          *   Problem: Behavioral indistinguishability without understanding.
          *   Requirement: **Robustness against Precomputation/Mimicry.** The criterion must distinguish between generating behavior via static lookup vs. dynamic, context-sensitive processing.
          *   Tension: How to verify "dynamic processing" behaviorally without peeking inside?

      *   *Case 2: The Silent Sage (Conscious but non-behaving).*
          *   Problem: False negatives. Mind exists, behavior doesn't.
          *   Requirement: **Sensitivity to Latent Capacity.** The criterion must account for the *capacity* to behave, not just occurrent behavior. Or, it must accept minimal behavior (blinks) as sufficient.
          *   Tension: If we lower the bar for behavior to catch the Sage, do we let in the Ledger?

      *   *Case 3: The Parochial Interrogator (Cultural mismatch).*
          *   Problem: Bias in the test design.
          *   Requirement: **Normative Neutrality/Universality.** The behavioral markers must not rely on specific human cultural idioms (like English conversation).
          *   Tension: How to define "universal" behavior without being so abstract it catches nothing or everything?

      *   *Case 4: The Longitudinal Collaborator (Extended interaction).*
          *   Problem: Short tests miss depth/learning.
          *   Requirement: **Temporal Depth & Adaptability.** The criterion must require sustained interaction showing learning, correction, and norm sensitivity over time.
          *   Tension: Practicality vs. Rigor. Also, does a Longitudinal Actor exist? (See Perfect Actor).

      *   *Case 5: The Perfect Actor (Simulating inner states).*
          *   Problem: Simulating pain/love without feeling it.
          *   Requirement: **Vulnerability/Stake Sensitivity.** The behavior must reflect genuine stakes (harm avoidance, goal preservation) that are costly to fake.
          *   Tension: A sophisticated enough simulator could fake costliness.

      *   *Case 6: The Language-less Human (Mind without language).**
          *   Problem: Verbal tests exclude pre-linguistic or non-linguistic minds.
          *   Requirement: **Modality Independence.** The criterion cannot require language. It must rely on non-linguistic interaction (pointing, tool use, avoidance).
          *   Tension: Non-linguistic behavior is easier to mimic (Ledger case again).

  3.  **Synthesize and Refine Requirements (Drafting the List):**

      *   *Req 1: The Anti-Ledger Constraint (Dynamic Responsiveness).* Must distinguish lookup from inference.
      *   *Req 2: The False-Negative Constraint (Capacity over Performance).* Must account for inability to act (Silent Sage/Language-less).
      *   *Req 3: The Parochialism Constraint (Modal/Cultural Neutrality).* Must not depend on human-specific norms.
      *   *Req 4: The Integrity Constraint (Vulnerability).* Behavior must show cost/stakes (against Perfect Actor).
      *   *Req 5: The Moral Safety Constraint (Precautionary Principle).* If in doubt, err on the side of protection.

  4.  **Identify the Core Tension (The "Impossible Triangle"):**

      *   The user suspects an inconsistency. I need to pinpoint it.
      *   *Tension:* **Verification (Anti-Ledger)** vs. **Inclusivity (Silent Sage)** vs. **Behavioral Exclusivity.**
      *   If we demand *only* behavior (Behavioral Exclusivity), we cannot verify internal processing (Anti-Ledger) without making the test so hard it excludes the Silent Sage (Inclusivity).
      *   Specifically: To rule out the Ledger, you need complex, novel, open-ended interaction. To include the Silent Sage, you need to accept minimal or no interaction. These are contradictory.
      *   *The Trilemma:*
          1.  Strictly Behavioral (no peeking at brain).
          2.  No False Positives (exclude Ledgers/Actors).
          3.  No False Negatives (include Sages/Non-verbal humans).
      *   You can only pick two.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the stakes (moral protection).
      *   **The Desiderata:** List them clearly with Case, Requirement, Distinction, and Status (Non-negotiable/Preference).
      *   **The Tensions:** Explicitly map the Trilemma. This is the core value add.
      *   **Scoring:**
          *   Classical TT: Fails Anti-Ledger, Fails Language-less.
          *   Total/Embodied TT: Better on Ledger, still fails Silent Sage.
          *   Neuro/Functional: Solves the tension by abandoning pure behaviorism.
      *   **Conclusion:** What can behavior actually do? It provides *probabilistic warrant* for moral caution, not ontological proof.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't slip into defending functionalism as a behavioral criterion. The prompt asks for a *behavioral* criterion. The third scoring option is a contrast view (neuro/functional) to show how it escapes the trap.
      *   *Refinement on "Silent Sage":* If the Sage produces *no* behavior, *no* behavioral test can catch them. The requirement must be about *potential* behavior or minimal signals (blinks). I need to be precise here. The requirement is "Sensitivity to Minimal/Impaired Output."
      *   *Refinement on "Ledger":* The behavioral solution is usually "novelty" or "learning." But a Ledger could theoretically be huge. The requirement must be about *unbounded* novelty or *costly* adaptation. Let's focus on *Adaptive Normativity* (Longitudinal Collaborator).
      *   *Refinement on Tensions:* The strongest tension is between **Opacity** (we can't see inside) and **Discrimination** (we need to tell Actor from Real). If we stay purely behavioral, we cannot logically guarantee discrimination against a perfect mimic. This is the philosophical hard stop.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Did I use all 6 cases? Yes.
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify the unsatisfiable subset? Yes.
      *   Is the scoring brief? Yes.
      *   Is the conclusion honest about limits? Yes.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a specification of the desiderata for a behavioral criterion of mind, designed to underwrite the practical decision of granting moral protection.

  ### I. The Desiderata

  **1. The Dynamic Responsiveness Requirement**
  *   **Motivating Case:** *The Ledger.* A lookup table can match input to output perfectly within a fixed domain but lacks inference or perspective.
  *   **What it must get right:** It must distinguish between *retrieval* and *generation*. The criterion cannot be satisfied by static correctness; it must require evidence of real-time processing, such as the ability to handle novel, unanticipated inputs or to recover gracefully from errors without a pre-scripted correction.
  *   **Distinction:** Mere behavioral mimicry vs. generative capacity.
  *   **Status:** **Non-negotiable.** If the criterion admits the Ledger, it grants moral status to a database, diluting the protection for genuine subjects and misallocating resources.

  **2. The Minimal Output Requirement**
  *   **Motivating Case:** *The Silent Sage* and *The Language-less Human.* A conscious being may lack the motor capacity for complex interaction or the linguistic training to pass a verbal test.
  *   **What it must get right:** It must treat the *capacity* for interaction as sufficient, even if the *performance* is severely degraded. It must allow that a single blink, a change in heart rate, or a pre-linguistic gesture can satisfy the criterion if it is reliably linked to environmental stimuli.
  *   **Distinction:** Failing to exercise a capacity (paralysis/choice) vs. lacking the capacity (unconsciousness).
  *   **Status:** **Non-negotiable.** If the criterion excludes the Silent Sage or the pre-linguistic human, it fails the fundamental moral purpose of protecting the vulnerable.

  **3. The Normative Neutrality Requirement**
  *   **Motivating Case:** *The Parochial Interrogator.* A test based on human conversational norms (politeness, irony, specific cultural references) will misclassify aliens or humans from different backgrounds.
  *   **What it must get right:** The behavioral markers must be grounded in universal biological or rational constraints (e.g., avoiding harm, seeking resources, consistency over time) rather than cultural idioms.
  *   **Distinction:** Human parochial norms vs. mind as such.
  *   **Status:** **Non-negotiable.** A criterion that relies on human-specific behavior is speciesist by definition and cannot justify universal moral protection.

  **4. The Vulnerability Requirement**
  *   **Motivating Case:** *The Perfect Actor.* A system can simulate pain or desire without having interests that can actually be harmed.
  *   **What it must get right:** The criterion must require behavior that indicates *stakes*. The candidate must demonstrate avoidance of damage or loss of function that is costly to repair. It must behave as if it has something to lose.
  *   **Distinction:** Simulated preference vs. genuine interest.
  *   **Status:** **Preference (Pragmatic).** While philosophically desirable, verifying "cost" behaviorally is difficult. A sophisticated Actor could simulate the *appearance* of cost. This is a high bar that may conflict with the Minimal Output Requirement.

  **5. The Longitudinal Consistency Requirement**
  *   **Motivating Case:** *The Longitudinal Collaborator.* Short tests miss the depth of memory, learning, and norm-adherence required for genuine agency.
  *   **What it must get right:** The criterion must evaluate behavior over time, looking for the accumulation of shared context, the correction of past mistakes, and the maintenance of goals despite distraction.
  *   **Distinction:** Occurrent state (passing a momentary test) vs. dispositional state (having a persistent perspective).
  *   **Status:** **Preference.** This strengthens the evidence but makes the criterion impractical for emergency moral decisions (e.g., triage).

  ---

  ### II. The Inconsistency: The Behavioral Trilemma

  You suspected that some subset of these requirements cannot be jointly satisfied. You are correct. There is a logical tension inherent in the project of a *purely behavioral* criterion for moral status.

  **The Unsatisfiable Subset:**
  1.  **Strict Behavioralism:** The criterion relies *only* on public behavior (no access to internal structure/neurophysiology).
  2.  **No False Positives:** The criterion must exclude the Ledger and the Perfect Actor (systems that mimic mind without having it).
  3.  **No False Negatives:** The criterion must include the Silent Sage and the Language-less Human (minds that cannot produce complex behavior).

  **The Conflict:**
  To satisfy **(2) No False Positives** against a Ledger or Perfect Actor under **(1) Strict Behavioralism**, you must demand complex, novel, adaptive, and costly behavior (Dynamic Responsiveness + Vulnerability). You must push the behavioral bar high enough that a lookup table or a script cannot clear it.

  However, to satisfy **(3) No False Negatives** for the Silent Sage or Language-less Human under **(1) Strict Behavioralism**, you must lower the behavioral bar to accept minimal, impaired, or non-linguistic output (Minimal Output).

  **You cannot simultaneously raise the bar high enough to exclude a sophisticated mimic and lower it enough to include a paralyzed sage.**

  *   If you prioritize **Exclusion** (catching the Ledger), you inevitably commit **False Negatives** against the Silent Sage. (Your friend wins).
  *   If you prioritize **Inclusion** (catching the Sage), you inevitably commit **False Positives** against the Ledger. (You win, but at the cost of potentially granting rights to automata).
  *   If you try to split the difference, you end up with an arbitrary threshold that satisfies neither constraint fully.

  **The Trade-off:**
  The only way to resolve this trilemma is to abandon **(1) Strict Behavioralism**. You must admit that behavior is *evidence* of an internal state, not the *constitutive mark* of it. This allows you to posit that the Silent Sage has the internal state despite low behavior, and the Ledger lacks the internal state despite high behavior. But this moves the criterion from "behavioral" to "inferential/structural," which was your friend's objection to the utility of the test.

  ---

  ### III. Scoring Candidate Views

  **1. The Classical Imitation Game (Text-based Turing Test)**
  *   **Score:** Fails.
  *   **Reason:** It violates the **Minimal Output Requirement** (excludes Language-less Humans and Silent Sages) and the **Dynamic Responsiveness Requirement** (vulnerable to the Ledger if the domain is restricted). It is highly susceptible to the **Parochial Interrogator** bias.

  **2. The Total/Embodied Turing Test (Longitudinal Collaboration)**
  *   **Score:** Partial Success / High Cost.
  *   **Reason:** It significantly improves **Dynamic Responsiveness** and **Vulnerability** (harder to fake physical adaptation over years). However, it still fails the **Minimal Output Requirement** (a paralyzed Sage cannot pass a physical test) and cannot logically guarantee exclusion of the **Perfect Actor** (a robot could be built to degrade physically over time).

  **3. The Neuro-Functional Criterion (Internal Structure as Real Criterion)**
  *   **Score:** Theoretically Consistent / Practically Difficult.
  *   **Reason:** This view dissolves the Trilemma by rejecting **Strict Behavioralism**. It classifies the Silent Sage as minded (based on brain scan) and the Ledger as not (based on architecture). However, it violates the **Public/Checkable** constraint you initially defended; we do not yet know which internal structures are necessary for experience, making it hard to apply to aliens or AI.

  ---

  ### IV. Conclusion: What Behavior Can Honestly Deliver

  Given the tensions identified above, a purely behavioral criterion cannot deliver ontological certainty. It cannot prove the presence of a mind, nor can it guarantee the absence of one without risk of error.

  However, it can deliver a **Precautionary Warrant**.

  The honest function of a behavioral criterion is not to distinguish *Mind* from *Non-Mind* with metaphysical precision, but to distinguish *Safe to Ignore* from *Must Protect*.
  *   Against the **Ledger**, we must admit we cannot be certain behaviorally, but we can argue that a system complex enough to pass a rigorous Longitudinal Collaborator test is *functionally equivalent* to a moral subject for the purposes of interaction.
  *   Against the **Silent Sage**, we must admit that behavioral failure is not proof of mindlessness. Therefore, the criterion must be used as a *sufficient* condition for protection, not a *necessary* one.

  **The Verdict:**
  Adopt a **Two-Tier Policy**.
  1.  **Behavioral Success:** If a candidate meets the rigorous behavioral criteria (Embodied, Longitudinal, Vulnerable), they are granted full moral protection. (Accepts the risk of False Positives to ensure safety).
  2.  **Behavioral Failure:** If a candidate fails the behavioral criteria, they are *not* automatically denied protection. They trigger a secondary review based on structural similarity (neuro/functional) or phylogenetic history.

  This concedes your friend's point that behavior is fallible evidence, but maintains your point that it is the only action-guiding tool we have for the first tier. It explicitly accepts the risk of protecting some automata to ensure we do not harm a single Sage.
