  The locus stands; no void comes into sight.
  Four sources hold the truth that sense has bound.
  Absence is known in its own native light.

  For absence lacks an object to unite.
  Where perception fails, logic holds the ground.
  The locus stands; no void comes into sight.

  As name fits form in clarity so bright.
  The bare floor shows where pots were strictly bound.
  Absence is known in its own native light.

  The Sutra speaks to clarify the sight.
  Apply this rule to all where voids are found.
  The locus stands; no void comes into sight.

  Truth comes from without, not by intrinsic right.
  Tarka clears the doubt that hovers round.
  Absence is known in its own native light.

  So four paths lead to what is truly bright.
  No fifth source breaks the circle drawn around.
  The locus stands; no void comes into sight.
  Absence is known in its own native light.
