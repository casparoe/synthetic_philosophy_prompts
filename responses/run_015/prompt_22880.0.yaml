      *   *The Clash:* If the meaning of "wrong" changes between premise 1 (assertoric) and premise 2 (embedded), the argument commits the fallacy of equivocation. If the meaning stays the same, the expressivist needs to explain how an attitude can be the *content* of a conditional without becoming a belief-like state.
