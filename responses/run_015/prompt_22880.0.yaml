answer: |-
  This is an excellent question. It cuts right to the heart of why metaethics has been obsessed with this problem for the last 50 years. The textbook gloss often stops at "Expressivists can't explain logic," but as you've sensed, that's too quick. Expressivists *can* assign meanings to embedded sentences. The problem is whether those meanings preserve **logical validity** without collapsing into cognitivism.

  Since you are a PhD student, I will skip the introductory definitions and focus on the structural constraints of the problem, the distinction you asked about, and the specific technical hurdles Blackburn's quasi-realism faces (particularly the Unwin/Schroeder objections).

  ### 1. Terminology: Embedding vs. Frege–Geach

  First, let's clear up the taxonomy. While often used interchangeably, there is a precise distinction:

  *   **The Embedding Problem:** This is the linguistic datum. Moral sentences (e.g., "Stealing is wrong") appear in unasserted contexts: conditionals ("If stealing is wrong..."), questions ("Is stealing wrong?"), and negations ("Stealing is not wrong"). The problem is simply explaining the *semantics* of these embeddings. How do we compose the meaning of the whole from the parts if the parts aren't propositions?
  *   **The Frege–Geach Problem (FGP):** This is the *logical* consequence of the embedding problem. It is specifically the challenge of explaining how moral arguments can be **valid**. Validity is standardly defined as truth-preservation. If moral sentences lack truth conditions, they cannot preserve truth. Therefore, moral arguments should be invalid (or commit the fallacy of equivocation).

  **The Distinction:** You can solve the Embedding Problem (by assigning complex attitude-contents to conditionals) without solving the Frege–Geach Problem (by explaining why inferences involving those contents are *logically valid* rather than merely psychologically consistent). Most contemporary debate focuses on FGP because solving the semantics is useless if it breaks the logic.

  ### 2. Why the "Higher-Order Attitude" Response Fails

  You asked: *Why doesn't it just work to say the conditional expresses a higher-order attitude?*

  Let's formalize your intuition.
  *   **Simple Expressivism:** "Stealing is wrong" expresses $Boo! (stealing)$.
  *   **Your Proposal:** "If stealing is wrong, then lying is wrong" expresses $Boo! (stealing \land \neg Boo! (lying))$. (Roughly: I disapprove of stealing without disapproving of lying).

  This seems to capture the meaning. So, what's the issue? The issue is **Univocality** and **Validity**.

  Consider this Modus Ponens argument:
  1.  Stealing is wrong.
  2.  If stealing is wrong, then getting your brother to steal is wrong.
  3.  Therefore, getting your brother to steal is wrong.

  For this argument to be valid, the term "wrong" must have the **same meaning** in Premise 1 (P1) and Premise 2 (P2).
  *   In P1, "wrong" functions to express a first-order attitude: $Boo! (stealing)$.
  *   In P2 (the antecedent), "wrong" is not expressing an attitude. You are not actually booing stealing in the antecedent; you are hypothesizing.

  If you adopt your proposal, the meaning of "Stealing is wrong" in P1 is *Expressing Attitude A*. But the meaning of "Stealing is wrong" in P2 is *Being the object of Attitude B*.
  *   P1 Meaning: $Attitude(Stealing)$
  *   P2 Meaning: $Attitude(Attitude(Stealing) \dots)$

  **The Equivocation Charge:** Geach's original point was that this commits the fallacy of equivocation. The phrase "stealing is wrong" plays two different semantic roles. In P1, it asserts a state of the speaker. In P2, it describes a condition. If the meaning shifts, the argument is invalid (like: "Feathers are light; What is light cannot be dark; Therefore, feathers cannot be dark").

  **The Logical Gap:** Even if we grant the expressivist that P2 expresses a complex attitude, **logic does not govern attitudes in the same way it governs beliefs.**
  *   If I believe $P$, and I believe $P \to Q$, rationality *demands* I believe $Q$. This is because beliefs aim at truth, and truth is preserved via logical form.
  *   If I $Boo! P$, and I $Boo! (P \land \neg Boo! Q)$, am I rationally required to $Boo! Q$?
      *   Not necessarily. I could be psychologically inconsistent, but logical validity is not just psychological consistency.
      *   To make it valid, the expressivist must show that the *structure* of the attitudes mirrors the *structure* of propositional logic. But if the structure mirrors propositional logic perfectly, haven't we just reinvented propositions (and thus cognitivism)?

  This is the **Blackburn Dilemma**: Either the embedded clause expresses an attitude (in which case it can't function as a truth-apt antecedent), or it functions as a proposition (in which case expressivism collapses into cognitivism).

  ### 3. Blackburn's Quasi-Realism: The "Logic of Attitudes"

  Simon Blackburn's *Spreading the Word* and *Essays in Quasi-Realism* attempt to dissolve this dilemma. He doesn't try to make moral sentences truth-apt; he tries to explain why they *project* as if they are.

  **The Strategy:**
  Blackburn argues that we shouldn't define validity as "truth-preservation." Instead, we should define it as **inconsistency-avoidance**.
  *   Logic is not about the world; it is about the constraints on our commitments.
  *   When I assert "Stealing is wrong," I am not describing a fact; I am undertaking a **commitment** to a norm.
  *   When I assert the conditional, I am undertaking a commitment to a higher-order norm: *I am committed to disapproving of anyone who disapproves of stealing but fails to disapprove of getting their brother to steal.*

  **How this handles Modus Ponens:**
  Blackburn argues that holding Premise 1 and Premise 2 while denying the Conclusion puts you in a state of **inconsistent attitudes**.
  1.  Commitment: $Boo! (Stealing)$
  2.  Commitment: $Boo! (Stealing \land \neg Boo! (Brother Stealing))$
  3.  Denial of Conclusion: $\neg Boo! (Brother Stealing)$ (i.e., Tolerance of brother stealing)

  Blackburn claims that holding (1), (2), and (3) is a form of irrationality analogous to believing $P$, $P \to Q$, and $\neg Q$. He calls this a "logic of attitudes." He tries to show that the *functional role* of moral language is isomorphic to propositional logic, even if the *metaphysical underpinning* (attitudes vs. beliefs) is different.

  **Why this is "Quasi"-Realism:**
  He earns the right to talk about moral "truth," "facts," and "validity" without positing moral properties. We say "It is true that stealing is wrong" just to reaffirm our commitment. This is deflationary truth.

  ### 4. The Hard Wall: The Negation Problem (Unwin/Schroeder)

  This is where you need to get into the weeds for your dissertation. Blackburn's solution was dominant for 20 years, but it ran into a technical wall known as the **Negation Problem** (formulated by Peter Geach, refined by Mark Unwin, and devastatingly pressed by Mark Schroeder in *Being For*).

  The problem is distinguishing between different types of non-acceptance. In cognitivism, there is only one way to reject a proposition $P$: believe $\neg P$.
  In expressivism, there are multiple ways to "not accept" $Boo! (P)$:
  1.  **Absence:** I have no attitude toward P.
  2.  **Opposition:** I have the opposite attitude ($Hooray! (P)$).
  3.  **Embedding:** I accept "If P then Q" (which involves a complex attitude).

  **Unwin's Point:**
  Consider these three sentences:
  1.  Stealing is not wrong. (Negation)
  2.  Is stealing wrong? (Question)
  3.  If stealing is wrong, then... (Conditional Antecedent)

  For the expressivist, "Stealing is wrong" = $Boo! (Stealing)$.
  What is "Stealing is **not** wrong"?
  *   Is it $\neg Boo! (Stealing)$? (I don't boo stealing). That allows for indifference, which is too weak.
  *   Is it $Hooray! (Stealing)$? (I approve of stealing). That seems too strong (tolerance isn't approval).

  **Schroeder's "Being For" Argument:**
  Schroeder argues that Blackburn cannot distinguish the attitude expressed by:
  *   (A) "Stealing is not wrong."
  *   (B) "It is not the case that stealing is wrong."

  In standard logic, these are equivalent. But for an expressivist, the scope of the attitude matters.
  *   If "Wrong" = $Boo!$, then "Not Wrong" should be $\neg Boo!$.
  *   But in a conditional "If stealing is not wrong...", the "not wrong" is embedded.
  *   Schroeder shows that to make the logic work, the expressivist needs a distinct attitude type for every logical operator.
      *   Attitude for $P$
      *   Attitude for $\neg P$
      *   Attitude for $P \to Q$
      *   Attitude for $\neg (P \to Q)$
      *   Attitude for $P \land Q$
      *   ...and so on.

  This leads to an **explosion of attitude types**. To solve FGP, the expressivist must posit a distinct psychological state for every possible logical embedding. But we don't seem to have that many distinct psychological states. We seem to have one state (disapproval) that we can combine logically.

  If the expressivist says, "No, it's just one state combined logically," then they are admitting that the state has **propositional structure**. And if it has propositional structure, it looks suspiciously like a belief.

  ### 5. Summary for Your Research

  To summarize the "wall" you are hitting:

  1.  **The "Higher-Order Attitude" move fails** because it creates an equivocation between the assertoric use of "wrong" and the embedded use. This breaks logical validity (Modus Ponens becomes a fallacy of equivocation).
  2.  **Blackburn's Fix** is to redefine validity as inconsistency of commitments rather than preservation of truth. He tries to show that moral logic tracks the logic of consistency among attitudes.
  3.  **The Remaining Problem** is that to make this work without collapsing into cognitivism, the expressivist must distinguish between logically distinct attitudes (e.g., the attitude in "not wrong" vs. the attitude in "if wrong"). Schroeder argues this requires positing too many distinct psychological states, making the theory psychologically implausible, OR it requires admitting that the attitudes have propositional content, which makes the theory metaphysically indistinguishable from realism (The Problem of Creeping Minimalism).

  **Recommendation for "Getting into the Weeds":**
  If you want to master this, you need to engage with **Mark Schroeder's *Being For* (2008)**. He formalizes the "Negation Problem" in a way that shows exactly where Blackburn's semantics leak.
  *   Look at his distinction between **A-type** and **B-type** attitudes.
  *   Look at the debate over **Biforcated Attitudes**.
  *   Also, consider **Ridge's Ecumenical Expressivism**, which attempts to solve this by hybridizing (moral sentences express *both* a belief and a desire), though this invites other objections regarding the unity of moral judgment.

  The reason you feel the textbook treatment is glib is that the "standard response" (higher-order attitudes) was effectively refuted by Geach himself in the 60s, and the *actual* contemporary responses (Blackburn, Gibbard, Schroeder) are highly technical attempts to rebuild the logic of attitudes without using propositions. The tension remains unresolved: **Either you save the logic and lose the expressivism, or you save the expressivism and lose the logic.**
