answer: |-
  Here is a plan for the seventy-five-minute session, designed to isolate the Common Prior Assumption (CPA) as a structural constraint rather than an empirical description.

  ### I. Order and Dependencies

  **The Sequence (0–50 minutes)**
  1.  **State Space & Partitions (0–10):** Define $\Omega$ and $\mathcal{P}_i$. *Dependency:* None.
  2.  **Posteriors as Random Variables (10–20):** Define $q_i(\omega) = \mu(E | \mathcal{P}_i(\omega))$. Emphasize that $q_i$ is a function $\Omega \to [0,1]$, measurable with respect to $\mathcal{P}_i$. *Dependency:* Requires Partitions.
  3.  **Common Knowledge & The Meet (20–30):** Define the meet $\mathcal{M} = \bigwedge_i \mathcal{P}_i$. Define an event $C$ as common knowledge at $\omega$ if $\mathcal{M}(\omega) \subseteq C$. *Dependency:* Requires Partitions.
  4.  **The Result Statement (30–35):** "If there exists a common prior $\mu$, then for any event $E$, it cannot be common knowledge that $q_1(E) \neq q_2(E)$." *Dependency:* Requires Posteriors as RVs and Meet.
  5.  **The CPA Definition (35–40):** Introduce the CPA *after* the result statement. *Dependency:* Requires the Result Statement to show what work the CPA does.

  **Argument for Meet Before Result**
  Your instinct is correct. The meet machinery must precede the result. If you state the result ("No agreeing to disagree") before defining the meet, students treat "common knowledge" as a colloquial phrase. By constructing the meet first, you define the *object* of the theorem (the set of states where posteriors are mutually known). The theorem then becomes a claim about the properties of functions on that set. If you reverse this, the CPA looks like a premise about the agents' psychology; if you follow this order, the CPA looks like a consistency condition on the model's geometry.

  **The Three Readings of the Prior**
  Do not define the prior once. Introduce the readings sequentially to prevent collapse.

  1.  **The Ancestral Reading (Minute 15):** Introduce this *informally* when first mentioning "prior." Describe it as "the belief agents held before receiving signals."
      *   *Placement:* During the setup of Posteriors as RVs.
      *   *Purpose:* To acknowledge and bracket student intuition.
      *   *Risk:* If left unchallenged, students treat CPA as a historical claim.
  2.  **The Bookkeeping Reading (Minute 35):** Introduce this *formally* when defining the CPA. "A single measure $\mu$ on $\Omega$ such that every $q_i$ is derived from $\mu$ via Bayes' rule on $\mathcal{P}_i$."
      *   *Placement:* Immediately before the Proof Sketch.
      *   *Purpose:* To show the CPA is a mathematical consistency constraint on the *modeler's* representation, not necessarily the agents' history.
      *   *Risk:* If introduced with the Ancestral reading, students conflate "modeler's device" with "agents' memory."
  3.  **The Adjudicative Reading (Minute 55):** Introduce this *after* the Result. "If we impose the Bookkeeping reading, any residual disagreement must be attributed to information ($\mathcal{P}_i$), not to the measure ($\mu$)."
      *   *Placement:* During the Interpretation/Implications phase.
      *   *Purpose:* To explain the "all disagreement is information" gloss.
      *   *Risk:* If introduced before the Result, it sounds like a normative command ("Agents *ought* to share priors") rather than a structural feature ("If they share priors, then...").

  **What Breaks if Collapsed:** If you introduce Ancestral and Bookkeeping together, the "empirical claim" misconception becomes ineradicable. If you introduce Bookkeeping and Adjudicative together, students will believe the CPA *prohibits* disagreement, rather than prohibiting *common knowledge* of disagreement.

  ---

  ### II. The Example: The Cabinet Crisis

  **The Setup**
  *   **Context:** A coalition government deciding whether to call a snap election.
  *   **Agents:** Prime Minister (PM) and Coalition Partner (CP).
  *   **State Space ($\Omega$):** Six scenarios of public opinion and economic data, $\{1, 2, 3, 4, 5, 6\}$.
  *   **Event ($E$):** "The party will lose the election" ($E = \{3, 4, 5, 6\}$).
  *   **Partitions:**
      *   PM ($\mathcal{P}_1$): $\{\{1, 2\}, \{3, 4\}, \{5, 6\}\}$ (Reads economic data).
      *   CP ($\mathcal{P}_2$): $\{\{1\}, \{2, 3\}, \{4, 5\}, \{6\}\}$ (Reads polling data).
  *   **Structure:** The partitions form a chain ($1-2-3-4-5-6$). The meet $\mathcal{M}$ is the trivial partition $\{\Omega\}$. Everything that is true is Common Knowledge.

  **Why These Properties Earn Their Place**
  1.  **Political/Institutional:** Prevents the "toy-work" dismissal. It frames the math as a model of cabinet stability, not balls in an urn.
  2.  **No Trade/Bets:** Isolates belief from action. If you introduce bets, students conflate "No Trade Theorem" with "No Disagreement Theorem." We want to show disagreement is impossible *in belief*, regardless of stakes.
  3.  **Non-Nested:** If $\mathcal{P}_2$ refined $\mathcal{P}_1$, the meet would be $\mathcal{P}_2$. Students would think the result is just about the better-informed agent. The chain structure forces them to compute the meet iteratively.
  4.  **6 States / Depth 3-4:** Small enough to calculate on the board in 5 minutes; large enough that the meet isn't immediately obvious.
  5.  **Serviceable Without Prior:** This is the critical constraint.
      *   *Case A (No CPA):* Assign posteriors directly. Let $q_{PM}(E) = 0.8$ on all cells. Let $q_{CP}(E) = 0.2$ on all cells. Since $\mathcal{M}=\{\Omega\}$, it is **Common Knowledge** that they disagree. This is mathematically consistent *unless* we demand a common prior.
      *   *Case B (With CPA):* Ask: "Is there a $\mu$ that generates these?"
          *   $E_\mu[q_{PM}] = \mu(E)$. Since $q_{PM}=0.8$ everywhere, $E_\mu[q_{PM}] = 0.8$.
          *   $E_\mu[q_{CP}] = \mu(E)$. Since $q_{CP}=0.2$ everywhere, $E_\mu[q_{CP}] = 0.2$.
          *   Contradiction: $\mu(E)$ cannot be both 0.8 and 0.2.
      *   *Contrast:* The *only* thing that changed was the imposition of $\mu$. The partitions, states, and posteriors remained identical. This isolates the CPA as the active constraint.
  6.  **Shared Support:** Ensure $\mu(\omega) > 0$ for all $\omega$ in the CPA case. If support differs, students attribute the failure to "one agent ruling out a state," which is a shallow failure (certainty). We want the deep failure (probability consistency).

  ---

  ### III. Misconception Map

  | Misconception | Minute | The Move (Sentence or Gesture) |
  | :--- | :--- | :--- |
  | **CPA is Common Knowledge** | 35 | "Common knowledge is a property of *events*; the Common Prior is a property of the *measure*. Do not circle them with the same chalk." |
  | **Empirical Claim (Culture)** | 45 | (After Ancestral Reading) "We are not claiming they grew up in the same town. We are claiming their posteriors can be *represented* as slices of one measure." |
  | **Historical Moment** | 45 | "There need not be a time $t=0$. The 'prior' is a shadow cast by the posteriors, not a memory they possess." |
  | **Rationality Requirement** | 55 | "Differing posteriors do not convict an agent of irrationality. They convict the *model* of lacking a common measure." |
  | **Trade Refutes CPA** | 60 | "Trade requires stakes. This theorem holds even if the agents are disembodied cameras recording probabilities." |
  | **Prior Must Be Uniform** | 35 | (Write $\mu$ on board) "This is a distribution, not a flat line. It can be skewed; it just must be *shared*." |
  | **Disagreement Impossible** | 50 | "They can disagree. They just cannot *know* that they disagree. Circle the word 'Common Knowledge' in the theorem statement." |
  | **Prior Belongs to Agents** | 35 | "The prior belongs to the *modeler*. The agents only see their partition cell." |
  | **CPA implies Agents Know Prior** | 38 | "Agents know their posterior. They do not need to know $\mu$ to satisfy the assumption." |
  | **CPA Prohibits Learning** | 52 | "The posteriors differ *because* they learned. The CPA prohibits the *common knowledge* of that difference, not the difference itself." |

  ---

  ### IV. Declinations and State Space Closure

  **What to Decline**
  Explicitly state at Minute 60: "I am declining three topics today. First, **Type Spaces**: we are working with state spaces, not universal type spaces. Second, **Separating Hyperplanes**: we are not proving the No-Trade Theorem via convex geometry. Third, **Veil of Ignorance**: this is not a normative claim about fairness."

  **The State Space Point**
  *   **The Point:** In a finite model, CPA has no implications for finite belief hierarchies beyond shared support. A common prior can always be restored by enlarging the state space (adding hidden variables). Therefore, the CPA is a claim that the *current* state space is exhaustive.
  *   **When:** Minute 62.
  *   **How:** "If you allow me to add a state $\omega_7$ that explains why PM sees 0.8 and CP sees 0.2, I can always restore the prior. By refusing to add $\omega_7$, you are declaring this state space **closed**. The failure of the CPA is a failure of the model's completeness, not the agents' logic."
  *   **Why:** This prevents students from thinking the CPA restricts "behavior" directly. It restricts the *modeler's* description of the world.

  ---

  ### V. The Check at Minute 70

  **The Audit Question**
  "Consider this claim from a paper you will read next month: *'In a legislative bargaining model with a common prior, the expected policy outcome equals the median voter's ideal point.'*
  1.  Where is the prior used in that derivation?
  2.  If we drop the common prior but keep rationality and common knowledge of partitions, does the claim survive?"

  **Confidently Wrong Answer**
  "The claim survives. If agents are rational and know the partitions, they will bargain until they agree. The prior doesn't matter because information aggregation fixes the outcome."
  *(Diagnosis: This student thinks CPA is about convergence or rationality.)*

  **Confidently Right Answer**
  "The prior is used to equate the agents' expectations of the median. Without a common prior, Agent 1's expectation of the median and Agent 2's expectation can diverge permanently, even with common knowledge. The claim fails."
  *(Diagnosis: This student sees the prior as an expectation-equalizing device.)*

