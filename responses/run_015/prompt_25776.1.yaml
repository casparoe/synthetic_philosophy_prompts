answer: |-
  # JOINT STATEMENT ON PRIORITARIANISM AND TELIC EGALITARIANISM
  **An Adversarial Collaboration**

  **Date:** October 26, 2023
  **Parties:** Proponents of Prioritarianism (P) and Proponents of Telic Egalitarianism (TE)
  **Purpose:** To map the structure of our disagreement, identify genuine common ground, and isolate the specific claims upon which the debate turns.

  ---

  ## PART I: AGREED CLAIMS
  *We jointly affirm the following propositions. We acknowledge that while these claims are widely accepted within our specific dialogue, some remain contested in the broader literature on distributive justice.*

  1.  **Rejection of Strict Sum-Utilitarianism:** We agree that the moral value of an outcome is not determined solely by the sum total of well-being. The distribution of well-being matters, not just the aggregate.
  2.  **The Weight of Claims:** We agree that, *ceteris paribus*, a benefit to a person at a lower absolute level of well-being carries more moral weight than an identical benefit to a person at a higher absolute level. (We disagree on *why* this is the case, but agree that it is the case).
  3.  **Practical Convergence:** In almost all realistic policy scenarios (e.g., tax redistribution, healthcare allocation), our views recommend the same actions. We agree that "Leveling Down" is never *all-things-considered* obligatory or permissible in real-world contexts where utility can be gained without creating inequality.
  4.  **The Status of the Leveling-Down Objection (LDO):** We agree that the LDO is the primary philosophical challenge for TE. We agree that any plausible version of TE must explain why the *pro tanto* value of equality does not justify making everyone worse off in practice.
  5.  **Welfarist Framework:** For the purposes of this dialogue, we assume a welfarist account of currency (we are distributing well-being, not resources or capabilities), though we acknowledge this is a simplification of broader political philosophy.
  6.  **Impersonal Value:** We agree that both views are typically framed as "telic" (outcome-oriented) rather than "deontic" (rule-oriented). We are debating the value of states of affairs, not merely the rights of agents.
  7.  **Pareto Principle:** We agree that if a change makes at least one person better off and no one worse off, the new state is *all-things-considered* better than the old state. (TE proponents affirm this overrides the *pro tanto* value of equality in Pareto improvements).

  ---

  ## PART II: DISAGREEMENT MATRIX
  *The following table isolates our residual disputes. Each position is phrased charitably to ensure proponents of that view recognize their own commitment.*

  | Domain | Telic Egalitarian (TE) Position | Prioritarian (P) Position | Nature of Dispute |
  | :--- | :--- | :--- | :--- |
  | **Source of Value** | Inequality is *intrinsically* bad. A world where A and B are equal at level 10 contains a value (equality) absent in a world where A is at 5 and B is at 15, even if the sum is higher in the latter. | Only absolute levels of well-being have intrinsic value. Relational facts (who has what compared to whom) have no intrinsic moral weight. | **Substantive:** Competing axiologies. |
  | **Leveling Down** | In a case where we can level down (make the better off worse to match the worse off), there is *one respect* in which the outcome is improved (equality), even if it is worse overall. | Leveling down generates no value whatsoever. It is a pure waste. There is no "respect" in which it is an improvement. | **Substantive:** Valuation of non-welfarist outcomes. |
  | **The "Why"** | We owe help to the worse off partly *because* they are disadvantaged relative to others. Their complaint is against the inequality itself. | We owe help to the worse off because they are at a low absolute level. Their complaint is against their absolute suffering, not their relative standing. | **Substantive:** Grounds of moral claims. |
  | **Person-Affecting** | (Optional/Divided) Some TE accept that inequality can be bad even if no specific person is harmed by the inequality (e.g., different people exist in different outcomes). | P is naturally compatible with the "Person-Affecting Restriction" (an outcome can only be better if it is better for some particular person). | **Structural:** Compatibility with person-affecting views. |
  | **Scope** | Equality matters globally. Inequality between citizens of different nations is intrinsically bad, just as it is within a nation. | Priority matters globally, but the "weighting function" might vary based on special relationships or institutional schemes. | **Applied:** Scope of the principle. |

  ---

  ## PART III: CRUXES AND TESTS
  *These are the specific sub-questions where settling the matter would cause one or both sides to revise their view. We identify the evidence or thought experiments relevant to each.*

  ### Crux 1: The "Isolated Communities" Case
  *   **Scenario:** Two communities exist on separate islands. They cannot interact, trade, or know of each other's existence. Community A has equal well-being (10, 10). Community B has unequal well-being (5, 15).
  *   **TE Prediction:** Community A is *pro tanto* better than Community B. Inequality is bad even without envy or social friction, because the impersonal pattern is worse.
  *   **P Prediction:** Community A and B are equal in value (assuming the sum/priority-weighted sum is identical). Without relational effects, the inequality is morally inert.
  *   **Move Condition:** If TE proponents admit that inequality in this case is *not* bad, they collapse into a form of Prioritarianism or Instrumental Egalitarianism. If P proponents admit A is better, they abandon core Prioritarianism.

  ### Crux 2: The Explanation of Priority
  *   **Question:** Why does a benefit to the worse off matter more?
  *   **TE Explanation:** Because it reduces the gap. The moral urgency is derived from the *distance* between persons.
  *   **P Explanation:** Because the marginal utility of well-being diminishes morally (not just economically). The moral urgency is derived from the *absolute position* on the scale.
  *   **Test Case:** A "Robinson Crusoe" scenario. One person exists. They will exist for two periods. In Option 1, they are at level 10 then 10. In Option 2, they are at level 5 then 15.
      *   **P:** Might apply priority weighting across time (favoring the 5).
      *   **TE:** Cannot call this "inequality" in the standard telic sense (no distinct persons). If TE favors Option 2 here, they are relying on a non-egalitarian principle.
  *   **Move Condition:** If TE agrees that "inequality" does not apply to one person over time, they must explain why it applies to two people simultaneously without referencing the distinctness of persons.

  ### Crux 3: The "Complaint" Model
  *   **Question:** Can the TE view be reformulated as a model of "reasonable complaints" rather than "impersonal value"?
  *   **Hypothesis:** Perhaps TE is just the view that the worse off have a *complaint* that the better off do not, and satisfying complaints is good.
  *   **P Stance:** If TE is reduced to complaints, P can accommodate this. P agrees the worse off have stronger claims.
  *   **TE Stance:** If TE is reduced to complaints, it loses its "telic" force. TE insists the *state of the world* is worse, not just that someone has a grievance.
  *   **Move Condition:** If TE accepts the "Complaint" reformulation, the dispute may be verbal. If TE insists the *impersonal state* is worse independent of complaints, the dispute is substantive.

  ---

  ## PART IV: NOTE ON VERBAL VS. SUBSTANTIVE DISPUTES
  *We explicitly flag the following area as containing a potential verbal dispute. We have not resolved whether this is merely semantic.*

  **The Definition of "Intrinsic Badness"**
  *   **The Risk:** There is a risk that TE uses "Inequality is intrinsically bad" to mean "We have strong moral reasons to reduce inequality," while P interprets this as "There is a metaphysical value property called Equality."
  *   **Our Consensus on the Risk:**
      *   If TE means only that **relative position generates stronger moral reasons** to act, P may agree (since P also generates stronger reasons to help the low). The disagreement here would be **verbal**.
      *   If TE means that **the pattern itself holds value** independent of the reasons for action (e.g., in the Isolated Communities case), the disagreement is **substantive**.
  *   **Field Status:** In the broader literature (e.g., Parfit vs. Temkin), this is a live dispute. Parfit argued Prioritarianism captures all the plausible intuitions of Egalitarianism without the LDO cost. TE proponents (e.g., Temkin, Otsuka) argue this misses the value of "fairness" or "community" which is inherently relational.
  *   **Our Stance:** We agree to treat the disagreement as **substantive** regarding the *Isolated Communities* case. If inequality is bad there, it is not verbal. If it is not bad there, the view may be verbal or instrumental.

  ---

  ## PART V: SIGNATURES

  **For the Prioritarians:**
  *We sign this acknowledging that Prioritarianism must explain why the 'priority weight' function exists without reference to relations, and that it must defend against the charge that it ignores the moral significance of fairness.*

  _________________________

  **For the Telic Egalitarians:**
  *We sign this acknowledging that Telic Egalitarianism must defend the claim that 'leveling down' is good in some respect, and that it must defend the value of equality in cases where no social friction exists.*

  _________________________

  ---

  ### Workshop Facilitator Notes (For Internal Use)
  *   **Settled vs. Contested:** Note that Part I, Claim 7 (Pareto) is treated as settled *for this collaboration*, but some radical egalitarians in the wider field might reject Pareto if it entrenches inequality. Claim 1 (Rejection of Utilitarianism) is settled between P and TE, but contested by Utilitarians.
  *   **Verbal Dispute:** Pay close attention to Part IV during the session. If the TE proponent struggles to define "intrinsic badness" without referencing "reasons to act," the P proponent should press the "Parfitian Collapse" argument.
  *   **Crux 1:** This is the strongest test. If the TE proponent hedges on the Isolated Communities case, ask them what *kind* of egalitarianism they hold (Instrumental vs. Telic).
