prompt: |-
  Hey, I need a hand with something. I'm putting together a workshop on distributive ethics and I want a document that models what good-faith intellectual disagreement actually looks like. Specifically, I want an adversarial-collaboration joint statement between a prioritarian and a telic egalitarian — the kind of egalitarian who thinks inequality is intrinsically bad, not just instrumentally bad. The leveling-down objection is obviously the main flashpoint, but I don't want it to dominate so completely that the document misses other places where they might genuinely converge or diverge.

  The deliverable should be something both could actually sign. So: a numbered list of agreed claims (about the formal structure of each view, about what each view rules out, about practical upshots where they coincide, about what the leveling-down objection does and doesn't show — whatever you think they can honestly share). Then a disagreements table or section where the residual disputes are stated precisely, with each side's position phrased so its own proponents would say "yes, that's what I mean." Then the cruxes: the sub-questions where settling them would actually move someone. And for each crux, if there's a thought experiment, a case, or a kind of evidence both would agree bears on it, lay that out and record what each side predicts or expects.

  One thing I'd especially like you to flag: are there parts of this debate that are partly or wholly verbal? Like, if they cash out "intrinsic badness of inequality" differently, does the disagreement survive that disambiguation or collapse? I want that called out explicitly if it's there.

  And please, throughout, separate what's genuinely settled among people who work on this from what's contested. Don't write as if one side's framing is the consensus when it isn't. If something is a live dispute, say so.

  Format-wise, I'm easy — whatever makes it clearest. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Topic:** Distributive Ethics (Prioritarianism vs. Telic Egalitarianism).
      *   **Goal:** A model of good-faith intellectual disagreement (Adversarial Collaboration).
      *   **Format:** Joint Statement.
          *   Section 1: Numbered list of Agreed Claims (formal structure, ruled-out views, practical overlaps, leveling-down nuances).
          *   Section 2: Disagreements Table (precise statements of residual disputes, phrased charitably).
          *   Section 3: Cruxes (sub-questions that move the needle, thought experiments/evidence, predictions).
          *   Special Requirement: Flag verbal/semantic disputes vs. substantive ones.
          *   Constraint: Distinguish settled vs. contested claims within the field (don't present one side as consensus).
      *   **Tone:** Professional, philosophical, charitable, precise.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Telic Egalitarianism (TE):** Inequality is *intrinsically* bad. A state where everyone is worse off but equal can be *pro tanto* better than a state where some are better off and others worse off (regarding the equality component), even if the total/average welfare is lower.
      *   **Prioritarianism (P):** Benefiting people matters more the worse off they are. No essential reference to relational standing. The "priority weight" is a function of absolute level.
      *   **The Leveling-Down Objection (LDO):** TE implies that making everyone worse off to achieve equality is *in some respect* good. P avoids this.
      *   **Convergence:** Both reject strict utilitarianism (sum-ranking). Both favor helping the worse off over the better off (usually). Both accept Pareto principles (usually).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find common ground.
      *   *Formal:* Both are welfarist (usually), both are consequentialist (usually), both reject simple sum-utilitarianism.
      *   *Practical:* In most real-world cases, both recommend redistribution from rich to poor.
      *   *Leveling Down:* Both agree LDO is a serious challenge. Both agree that *all-things-considered*, leveling down is usually wrong. The dispute is about *pro tanto* value.
      *   *Settled vs. Contested:* It's settled that LDO is the standard objection. It's contested whether LDO is fatal.

  4.  **Drafting - Section 2: Disagreements:**
      *   Need to phrase TE so a TE says "Yes" and P so a P says "Yes, that's their view."
      *   *Core:* The source of value. Is it the gap or the absolute level?
      *   *LDO:* Does leveling down generate *any* value? TE: Yes (equality). P: No (waste).
      *   *Person-Affecting:* P is often more compatible with person-affecting views, TE often implies impersonal value. (Though sophisticated TE can be person-affecting). Let's stick to the core value claim.
      *   *Verbal Dispute Check:* Is "intrinsically bad" just a label? If TE defines it as "reasons to redistribute," P agrees. If TE defines it as "value in the state of affairs independent of people," that's substantive. Need to highlight this.

  5.  **Drafting - Section 3: Cruxes:**
      *   What would change minds?
      *   *Crux 1: The intuition pump.* Does the "equal misery" case feel *better* in any way than "unequal misery"?
      *   *Crux 2: The explanation.* Why do we care about the worse off? Is it because they are worse off *than others* or because they are *absolute* low?
      *   *Crux 3: Verbal vs. Substantive.* If we rephrase TE as "Priority + Complaints," does it collapse? (Parfit's point).
      *   *Evidence:* Reflective equilibrium on specific cases.

  6.  **Refining the "Verbal Dispute" Flag:**
      *   This is crucial. Parfit argued Prioritarianism might just be Egalitarianism without the LDO implication. But TE proponents insist the *relation* matters.
      *   I need to explicitly state: "If TE means 'we have stronger reasons to help the disadvantaged because of their relative position,' P might agree on the *reasons* but disagree on the *ground*."
      *   I will add a specific box or note on this.

  7.  **Review against Constraints:**
      *   *Numbered list?* Yes.
      *   *Disagreements table?* Yes.
      *   *Cruxes with predictions?* Yes.
      *   *Verbal dispute flag?* Yes.
      *   *Settled vs. Contested?* Ensure language reflects uncertainty where appropriate (e.g., "We acknowledge..." vs "It is true that...").
      *   *Signable?* Needs to sound like a joint output, not a third-party analysis. Use "We agree," "We disagree."

  8.  **Self-Correction/Polishing:**
      *   *Critique:* Is the distinction between Telic and Deontic Egalitarianism clear?
      *   *Fix:* Ensure the prompt's specific request for *Telic* is honored. Telic = outcome-focused.
      *   *Critique:* Is the LDO section nuanced enough?
      *   *Fix:* Acknowledge that TE proponents often concede LDO makes TE *all-things-considered* wrong in those cases, but insist it remains *pro tanto* right. P denies even the *pro tanto* rightness.
      *   *Critique:* Is the tone too academic?
      *   *Fix:* Keep it accessible but precise enough for a workshop.
      *   *Critique:* Did I mark what is settled in the literature?
      *   *Fix:* Add footnotes or parentheticals indicating where the broader field stands (e.g., "While Parfit framed this as a collapse...").

  9.  **Final Polish:** Check the "Verbal Dispute" section. This is often the most insightful part of these collaborations. I will make sure to distinguish between "lexical disagreement" and "substantive disagreement about the ground of reasons."

  *(Self-Correction during drafting)*: I need to make sure I don't present Prioritarianism as the "sensible middle ground" which is a common bias. I must present TE as a robust view with intuitive pull (fairness/complaints).

  *(Final Plan)*:
  1. Title & Intro.
  2. Part I: Common Ground (Numbered).
  3. Part II: The Disagreement Matrix (Table).
  4. Part III: Cruxes & Tests.
  5. Part IV: Note on Verbal vs. Substantive Disputes.
  6. Signatures.

