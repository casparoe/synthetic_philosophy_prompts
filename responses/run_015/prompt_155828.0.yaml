answer: |-
  The instability you have identified in Lexical Threshold Negative Utilitarianism (LTNU) is not merely a technical glitch; it is a fundamental category error. Your thesis is correct: **once LTNU grants that pleasures and pains are commensurable on a single cardinal hedonic scale below the threshold, it cannot coherently withhold that commensurability above the threshold.** The lexical rule does not function as a mere parameter adjustment within a utilitarian framework; it functions as a structural break that requires a non-hedonic, non-aggregative property to justify it. By attempting to maintain the single-scale assumption while enforcing a lexical priority, LTNU tries to be both a scalar theory of value and a constraint-based theory of obligation simultaneously. It fails at the former and disguises the latter.

  Here is the argument for why the single-scale assumption collapses under the weight of the lexical threshold, why the standard objections fail to save it, and how the decision-theoretic wrinkle confirms that LTNU is ultimately a hybrid view masquerading as utilitarianism.

  ### I. The Architecture of the Single Scale and Its Collapse

  To see the instability, we must first make explicit what the "single cardinal hedonic scale" commits LTNU to. Let us define the unit as the *hedon* ($h$).

  1.  **Cardinality:** The scale is not merely ordinal. The difference between $+2$ and $+4$ is equivalent to the difference between $+10$ and $+12$. Ratios and differences are meaningful.
  2.  **Interpersonal Comparability:** $h$ is invariant across subjects. One person's unit of suffering is subtractable from another's unit of pleasure.
  3.  **Unboundedness (Positive):** As per your formulation ("any quantity of pleasure, however large"), the positive side of the scale has no ceiling. For any $h_{total}$, there exists a possible state $h_{total} + \delta$.
  4.  **Linearity of Aggregation:** Duration ($t$) and Number of experiencers ($n$) act as multipliers on intensity ($i$). Total Value $V = \sum (i \times t \times n)$.

  The instability arises at the threshold $T$. Below $T$, the value function is linear: $V(h) = h$. At or above $T$ (for negative $h$), the value function becomes lexical: $V(h_{\text{severe}}) < V(\text{any } h_{\text{positive}})$.

  If $h$ is a single cardinal quantity, then by the Archimedean property of real numbers, for any two finite magnitudes $A$ and $B$, there exists an integer $n$ such that $n \times A > B$. If severe suffering is just a larger negative number on the same scale as pleasure (e.g., $-1,000,000$ hedons), and pleasure is unbounded, then a sufficient quantity of pleasure (e.g., $+1,000,001$ hedons) *must* mathematically outweigh the suffering.

  To block this, LTNU must assert that severe suffering is *not* a finite number on the same scale. It must be treated as effectively $-\infty$ relative to the positive scale. But if severe suffering is $-\infty$ and pleasure is finite (however large), they are not on the same cardinal scale. You have effectively posited two different ontological categories: *Ordinary Hedonic Tone* and *Lexical Suffering*.

  If you insist they are the same category, you violate the **Unboundedness** commitment. You are implicitly saying the positive scale has a hard ceiling (the lexical threshold of the negative scale), or that the negative scale extends to a different order of infinity than the positive scale. Either way, the "single scale" is a fiction. The lexical rule does normative work only if severe suffering carries a property—call it *moral urgency* or *inviolability*—that is not captured by the magnitude of $h$. Once you admit this property, you have admitted that $h$ is not the sole determinant of value. You have abandoned utilitarianism (value = sum of $h$) for a hybrid view where value = sum of $h$ *subject to constraint $C$*.

  ### II. Answering the Objection from Ordinary Lexical Orderings

  Your seminar friends argue that lexical orderings are coherent even with common measures, citing multi-criteria decision theory or political philosophy (e.g., Rawlsian liberty prioritizing over income). They claim one can compare candidates on a shared dimension and still let a second dimension dominate.

  This objection fails because it conflates **multi-dimensional vectors** with **single-dimensional scalars**.

  In the cases your friends cite, lexical priority works because there are *two distinct goods*. For example, in a hiring process, you might rank candidates by "Skill Score" but apply a lexical rule for "Criminal Record." Even if both are scored 0–100, they represent different properties. The lexical rule works because "Criminal Record" triggers a different normative mode (disqualification) than "Skill" (optimization).

  LTNU, however, claims that pleasure and pain are *two directions on a single scale of hedonic tone*. There is no second dimension. There is only $h$. If you introduce a lexical rule here, you are effectively saying that "Negative $h$ above $T$" is a different dimension from "Positive $h$."

  If you try to model this as a vector $\langle h_{\text{pleasure}}, h_{\text{pain}} \rangle$, you have already abandoned the single-scale assumption. You are no longer netting them out. You are saying pain counts as a different *kind* of disvalue than pleasure counts as value. This confirms my thesis: the lexical rule requires a qualitative distinction (a second dimension, effectively) to function. If you maintain the single scale, the lexical rule is mathematically arbitrary. Why does $-100$ trump $+1,000,000$ but $-99$ does not? If the only property is intensity, the jump from 99 to 100 cannot change the *order* of the value, only the magnitude. To change the order (from tradeable to lexical), you must appeal to a property other than magnitude.

  ### III. Answering the Saturation Reply

  The second objection suggests that the hedonic scale is not linear but saturating (compressive). Perhaps the utility function for pleasure is asymptotic, $U(p) = 1 - e^{-p}$, while suffering remains linear or exponential, $U(s) = -s^2$. On this view, no finite sum of pleasures can ever mathematically reach the "value height" of severe suffering because the pleasure curve flattens out.

  This reply distinguishes a **steep trade-off** from a **genuinely lexical** one, and in doing so, it refutes itself.

  1.  **Finite vs. Infinite:** A saturating function implies that pleasure has a maximum possible value (the asymptote). If pleasure is bounded, then yes, a sufficiently deep pain could outweigh the maximum possible pleasure. However, your formulation of LTNU specifies "any quantity of pleasure, however large." This implies the *amount* of pleasure can grow indefinitely (via number of people or duration), even if the *intensity* per person is capped.
  2.  **Aggregation:** Utilitarianism aggregates across persons and time. Even if individual intensity saturates, the *total* value $V = \sum U(p_i)$ does not necessarily saturate if the population $n$ is unbounded. If $n$ can be infinite, the sum of saturated utilities can be infinite. If the sum of pleasures can be infinite, and the suffering is finite (even if very large), the suffering is outweighed.
  3.  **The Lexical Gap:** To make the saturation reply work for LTNU, you must assert that the suffering is *infinitely* bad relative to the pleasure, or that the total possible pleasure is *finitely bounded* in a way that prevents aggregation from bridging the gap. If you assert the latter, you are no longer doing standard aggregative consequentialism; you are positing a cap on the good. If you assert the former, you are back to incommensurability.

  A merely curved scale allows for trade-offs; it just makes the exchange rate very high. A lexical rule forbids trade-offs entirely. No continuous function $f(x)$ can map a single input dimension to a value space where one region is lexicographically prior to another without a discontinuity. If the function is discontinuous at $T$, then $h$ below $T$ and $h$ above $T$ are not functioning as the same metric. The "saturation" is just a mathematical disguise for the qualitative shift I identified in Section I.

  ### IV. The Decision-Theoretic Wrinkle

  This is where the argument bites hardest. The instability of LTNU is not just axiological; it is practical. Under uncertainty, the lexical rule generates fanaticism that standard utilitarianism avoids.

  Consider an agent choosing between:
  *   **Option A:** Guarantee a utopia for $10^{100}$ people (sub-threshold pleasure).
  *   **Option B:** A $1 - \epsilon$ chance of the same utopia, but an $\epsilon$ chance of one person experiencing severe threshold suffering.

  A standard expected-value maximizer calculates $EV = P \times V$. If $V$ is finite, a sufficiently small $\epsilon$ makes Option A preferable.
  However, if LTNU treats threshold suffering as lexically prior, its value is effectively $-\infty$ (or strictly dominant). The Expected Value of Option B becomes $-\infty$ (or lexically negative) regardless of how small $\epsilon$ is, provided $\epsilon > 0$.

  **This supports the thesis.** It demonstrates that LTNU cannot function as a theory of "betterness" or "value maximization."
  1.  **Fanaticism:** If any non-zero probability of threshold suffering swamps any certain good, the view demands we spend all resources mitigating infinitesimal risks of severe pain, ignoring all positive goods. This is the "Pascal's Wager" pathology of lexical views.
  2.  **Incomparability:** If we face a choice between two options that *both* carry some risk of threshold suffering, LTNU lacks the resources to rank them. If both have $-\infty$ expected value (due to the lexical weight), they are rationally equivalent, even if one has a much lower probability of catastrophe.

  **How LTNU Must Respond:**
  To avoid this paralysis, the friendliest version of LTNU must abandon the claim that it is a theory of *overall value* (axiology). It cannot say Option A is "better" than Option B in terms of a sum. Instead, it must become:
  *   **A View about Permissions/Constraints:** It is a deontic constraint: "Do not impose risk of threshold suffering." This admits that LTNU is not utilitarianism. It is consequentialism with side-constraints.
  *   **A View about Reasons:** It claims we have decisive reasons to avoid threshold suffering, but this does not necessarily map to a "value of the world" function.

  By making this move, LTNU admits the instability I argued for. It acknowledges that the lexical rule is not a feature of the *hedonic scale*, but a feature of the *moral structure* governing the scale. It confirms that the "single scale" was insufficient to carry the normative load. The "urgency" or "demand" you suspected is real, and it is a deontic property, not a hedonic one.

  ### Conclusion

  The instability you sensed is inevitable. A single cardinal scale implies the Archimedean property: everything is tradeable given enough quantity. A lexical threshold denies the Archimedean property. You cannot have both.

  If LTNU insists on the single scale, it is mathematically incoherent (violating the definition of cardinality). If it insists on the lexical threshold, it must posit a qualitative discontinuity in the nature of severe suffering that places it outside the hedonic calculus. This turns the view into a hybrid: aggregative consequentialism for the sub-threshold, and deontological constraint for the supra-threshold.

  The decision-theoretic wrinkle seals this diagnosis. The fanaticism problem arises precisely because the view tries to apply a lexical constraint within an expected-value framework. The only way to solve it is to admit the constraint is not part of the value function. Therefore, LTNU is not a stable form of utilitarianism. It is a disguise for a rights-based or constraint-based view that uses hedonic language to describe the threshold but relies on non-hedonic norms to enforce the priority. The elegance of the scalar theory is lost because the lexical rule was never a scalar feature to begin with.
