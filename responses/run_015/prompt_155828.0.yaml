      *   Part I: The Architecture of the Single Scale. Define the hedon. Show how aggregation works. Show where the threshold breaks the math.
      *   Part II: The Illusion of Lexical Commensurability. Address Objection 1. Explain why multi-criteria doesn't apply to single-dimension.
      *   Part III: The Saturation Fallacy. Address Objection 2. Explain asymptotes vs. lexical gaps.
      *   Part IV: The Decision-Theoretic Collapse. Show how risk exposes the non-utilitarian core.
      *   Conclusion: LTNU is Deontology in Utilitarian clothing.

  8.  *(Self-Correction during drafting)*: Make sure to emphasize the "Unboundedness" commitment. If pleasure is bounded, LTNU is easier to defend mathematically, but the prompt says "any quantity of pleasure, however large." This implies unbounded pleasure potential. This is a crucial contradiction. If pleasure is unbounded, a single scale *must* eventually outweigh finite pain unless pain is *infinitely* bad. If pain is infinitely bad, it's not on the same cardinal scale as finite pleasure.

  9.  *(Refining the Decision Theory section)*: The prompt asks whether this wrinkle supports or undercuts the thesis. It supports the thesis that LTNU is unstable/hybrid. I should argue it forces LTNU to abandon axiological consequentialism for deontic constraints.

