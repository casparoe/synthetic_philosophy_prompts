answer: |-
  Here is the plain assessment of your hunches against the text, without citations or reading lists.

  ### 1. The Epistemic Reading
  **Does it hold up?** Yes, but with a major caveat.

  Your hunch is that the Samsas have better evidence than we do with insects (shared language, history, specific reactions) and still fail to recognize the person. This suggests our epistemic bar for insects is impossibly high.

  This survives contact with the text, but only if you frame the family's failure correctly. In the novella, the family does not fail because they lack data; they fail because they stop processing it. The sister, who starts as the caretaker, eventually declares "it" is no longer Gregor. She doesn't say "I can't tell." She says "He is gone."

  This is not an epistemic failure (lack of knowledge); it is a moral failure (refusal to acknowledge). They actively construct a narrative where the creature is vermin to justify removing the burden. If you use this for your insect argument, you cannot claim that we *can't* know if insects suffer. You have to claim that we *won't* know, because knowing would cost us too much. The text supports the idea that convenience overwrites evidence.

  **Where it resists you:** The reader is given a privilege the family is not. We hear Gregor's thoughts. We know he understands the violin. We know he is trying to protect the picture on the wall. The text does not leave the reader in the dark. So, the novella does not prove that evidence is insufficient; it proves that *witnesses* are unreliable. If you want to make an argument about insect sentience, you have to decide: are you writing about how hard it is to know, or how hard it is to care once you do know? The text leans heavily toward the latter.

  ### 2. The Lottery Version vs. The Scale Argument
  **Is it a genuine alternative?** Yes, it is conceptually distinct, not just arithmetic rewording.

  The standard scale argument relies on aggregation of welfare. It says: a billion small pains add up to a big bad. It asks for compassion based on volume.

  Your lottery version relies on uncertainty of status. It says: one of these billion shells might contain a "person." It asks for caution based on the risk of erasure.

  This distinction matters for your novel. The standard scale argument makes the insects into a ocean of suffering. Your lottery version makes them into a crowd of hidden kings. Kafka's Gregor is not suffering because he is a bug; he is suffering because he is a man trapped in a bug. Your lottery argument captures this specific horror better than the standard scale argument does. The standard argument says "it hurts." The lottery argument says "it is someone."

  **Where it resists you:** The math is still the weak link. In the novella, Gregor is not a probability. He is a certainty (to the reader). The horror of the book comes from the *singular* tragedy of Gregor, not the statistical likelihood of other Gregors. The lottery argument dilutes the tragedy into statistics. If you have multiple transformed people in your block of flats, you are moving toward the lottery argument, but you risk losing the claustrophobic focus that makes the original work. You are trading intensity for breadth.

  ### 3. Where the Book Resists You (The Hard Truths)
  You asked which hunches don't survive contact with the thing. Here are the three biggest friction points.

  **A. The Interiority Cheat**
  You noted that Kafka hands the reader Gregor's interiority. This undermines the epistemic argument. The reader is never in doubt. We are never in the position of the insect-observer. We are in the position of God.
  If you want your novel to argue that we can't know if insects are sentient, you cannot give your transformed characters interiority. You must keep the reader outside, looking in, just as confused as the neighbors. If you let the reader hear their thoughts, you are preaching to the converted. You are saying "Look how cruel they are to these people," rather than "Look how hard it is to tell if these are people."
  *Verdict:* If you keep the interiority, you are writing a tragedy about lost humanity, not a philosophical argument about insect evidence.

  **B. The Anchor of the Human Past**
  Gregor's claim on our moral attention relies almost entirely on his history as a human. We mourn him because he was a salesman who paid rent and loved his sister. We do not mourn the bug; we mourn the man who was erased.
  An insect does not have a human past. It does not have a sister who used to play the violin for it. If your argument is about real insects, you cannot appeal to the "Gregor" factor (the lost human potential). You have to argue for the moral weight of the *current* form.
  *Verdict:* The novella is actually hostile to insect rights because it suggests Gregor only matters because he *wasn't* always a bug. If your transformed characters in the block of flats were never human, the text offers you no support. Their suffering only matters in the Kafka framework if they remember being human.

  **C. The Singularity vs. Aggregation**
  You want to use the scale argument (numbers matter). The novella is structurally opposed to this. It is about *The One*. The tragedy is that *this specific* consciousness is trapped.
  Kafka's world is not utilitarian. It does not care about the greatest good. It cares about the individual crushed by the machine. The scale argument requires us to look at the horizon and see billions. The novella requires us to look at the ceiling and see one spot.
  *Verdict:* You cannot use the *Metamorphosis* structure to argue for the scale argument without breaking the engine of the story. The story gets its power from focus. The moral argument gets its power from breadth. They pull in opposite directions.

  **D. The Ending**
  You find the ending buoyant. Many readers find it chilling, but your reading is valid: the family survives the parasite. They take the tram. They plan for the future.
  This ending is an indictment of the moral argument. It suggests that the removal of the "problem" allows life to continue. It validates the culling.
  If your novel is an argument for insect sentience, a buoyant ending for the humans is a failure. It suggests the humans were right to clear out the furniture and starve the creature. To make the moral argument work, the ending must be haunted. The relief the family feels must be framed as delusion or guilt, not spring sunshine.
  *Verdict:* The original ending resists your thesis. It suggests that survival trumps morality. If you want to argue for the insects, the humans cannot be allowed to walk into the sun so easily.

  ### Recommendation for the Draft
  You are two-thirds through. You have a present-day block of flats and multiple transformed beings. This is a strong divergence from Kafka that actually helps your philosophical goals, provided you make specific choices.

  1.  **Cut the Interiority:** If you want to argue about epistemic uncertainty, do not let the reader inside the heads of the transformed. Keep it behavioral. Let the neighbors argue about whether they are screaming or just clicking. Make the reader feel the uncertainty.
  2.  **Drop the Human Past:** Do not make them former humans. Make them ambiguous. If they are former humans, you are writing about disability or dehumanization, not insect sentience. If they are unknown entities, you force the moral question: does it matter what they *were*, or only what they *are*?
  3.  **Fix the Ending:** If you want the scale argument to land, the relief of the humans must be complicated. The "spring walk" needs to feel like a walk over a grave they refuse to acknowledge. If the ending is truly happy for the humans, the book concludes that the vermin were expendable.
  4.  **Embrace the Lottery:** Your "lottery" idea is stronger for fiction than the "scale" idea. It creates mystery. Are any of them people? Or are they all just bugs? That uncertainty creates tension. The scale argument (billions suffering) is abstract; the lottery argument (this one might be a person) is dramatic.

  **Final Verdict:**
  The novella is a bad vehicle for the standard scale argument (aggregation of pain) because it is too focused on the singular. It is a good vehicle for the lottery argument (hidden personhood) *if* you remove the reader's omniscience. The epistemic reading holds up, but only if you emphasize the family's *refusal* to see, not their inability to see.

  If you cannot bear to remove the interiority of your transformed characters, or if you need the humans to have a genuinely happy ending, you should abandon the philosophical argument about insect sentience. In that case, you are writing about something else: perhaps the burden of care, or how families metabolize shame. That is also a valid book, but it will not make the argument you are hoping for.
