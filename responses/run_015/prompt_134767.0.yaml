prompt: |-
  I'm a philosophy PhD student who also advises a regional disaster-response board, and I need a reusable decision proceedure for rescue-allocation cases where we can't save everyone. I want it grounded in the Taurek-style view that raw numbers shouldn't decide—saving five doesn't automatically outweigh saving one—but I need it to handle real messiness: victim counts that are estimates with big error bars, partial rescue where survivors are left severely disabled, and knock-on harm to dependants. Write the procedure as ordered questions with clear stop/no-stop points, flag exactly where judgment replaces calculation, and say what it can't settle. Then run it on two proposals: (a) one helicopter can reach either a confirmed 3 people in a flooded clinic or an estimated 8–15 in a remote valley with unreliable headcounts; (b) a rapid unit saves more lives but leaves survivors with serious disability, while a slower unit saves fewer but intact. Include one case where the procedure gives an answer the board will hate. Keep it practical—something people without philosophy training can run in a meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student + Disaster-Response Board Advisor.
      *   **Task:** Create a reusable decision procedure for rescue allocation (triage) where not everyone can be saved.
      *   **Philosophical Grounding:** Taurek-style (numbers don't automatically count; "save the greater number" is not an absolute moral requirement). Focus on fairness to individuals rather than aggregate utility.
      *   **Complexities to Handle:** Uncertain victim counts (error bars), partial rescue (survival with severe disability), knock-on harm to dependents.
      *   **Format:** Ordered questions with clear stop/no-stop points. Flag where judgment replaces calculation. State limitations (what it can't settle).
      *   **Application:** Run on two specific proposals:
          *   (a) Helicopter: 3 confirmed (clinic) vs. 8-15 estimated (valley).
          *   (b) Rapid unit (more lives, severe disability) vs. Slow unit (fewer lives, intact).
      *   **Constraint:** Include one case where the procedure gives an answer the board will hate.
      *   **Tone/Style:** Practical, usable by non-philosophers in a meeting.

  2.  **Deconstruct the Philosophical Foundation (Taurek):**
      *   John Taurek's "Should the Numbers Count?" (1977) argues that there is no "super-observer" perspective that aggregates losses. Loss is experienced individually.
      *   Key implication: Saving 5 isn't *morally required* over saving 1 just because $5 > 1$. However, it might be *permissible*.
      *   To make this practical for disaster response, we can't just flip a coin every time (though Taurek suggests a lottery might be fair). We need a procedure that respects individual equal worth without collapsing into pure utilitarianism, but also acknowledges practical constraints (probability of success, severity of outcome).
      *   *Adaptation:* Instead of "maximize lives," the goal is "minimize unfairness in exposure to risk of loss." We need to weigh probabilities and outcomes without simply summing them up.

  3.  **Drafting the Procedure (The "Equal Concern Protocol"):**
      *   *Goal:* Make it actionable. Numbered steps. Yes/No branches.
      *   *Step 1: Feasibility.* Can we actually reach them? (Hard stop).
      *   *Step 2: Probability of Success.* Taurek cares about the *chance* of being saved. If Group A has a 90% survival chance and Group B has a 10% chance, saving Group A respects their individual hope more.
      *   *Step 3: Severity of Outcome.* Survival isn't binary. If saving Group A means they live but suffer immensely, vs. Group B lives intact. This touches on "benefit."
      *   *Step 4: Dependents.* Taurek focuses on the victims, but the prompt asks for knock-on harm. We need to integrate this carefully without sliding back into utilitarianism. Let's frame it as "compounded loss" for specific individuals (the dependents), not just "social utility."
      *   *Step 5: The Numbers Question.* This is the crux. If all else is equal, do we count? Taurek says no (flip a coin). But in disaster response, a coin flip is often unacceptable. We need a "Threshold of Significance." If the difference is massive, we might lean numbers, but if it's close, we prioritize certainty or fairness. Let's make the "Judgment Flag" here.
      *   *Stop/No-Stop:* Clear decision points.

  4.  **Refining the Procedure for "Messiness":**
      *   *Uncertainty:* Need to address the 8-15 estimate. Use a "Minimum Credible Count."
      *   *Disability:* Need a metric for "Quality of Survival."
      *   *Judgment Flags:* Explicitly mark where the committee must vote or deliberate rather than calculate.

  5.  **Developing the Test Cases:**
      *   *Case (a):* 3 confirmed vs. 8-15 estimated.
          *   Taurek view: The 3 have a stronger claim if the 8-15 are highly uncertain. The probability of *any specific individual* being saved might be higher in the clinic.
          *   Procedure outcome: Likely the Clinic (3). Why? Because the *probability per person* is higher, and the count is certain. The valley people face a "double risk" (disaster + rescue uncertainty).
      *   *Case (b):* Rapid (More/Disabled) vs. Slow (Fewer/Intact).
          *   This is the "Board will hate" case.
          *   Utilitarianism says: Save more lives.
          *   Taurek/Individual focus: Does a life with severe disability count as a "save" equivalent to an intact life? If we value the *quality* of the future for the individual, saving fewer intact might be preferred.
          *   *Decision:* Let's make the procedure favor the "Intact" group, even if fewer. This will anger a board focused on "body count" metrics.
      *   *Wait, I need to ensure the "Board will hate" case is explicit.*
      *   Let's adjust Case (b) analysis. If the procedure says "Save the Fewer Intact," the board (focused on metrics) will hate it. If it says "Save the More Disabled," the disability rights advocates might hate it. Let's aim for the "Save Fewer Intact" outcome as the controversial one, as it contradicts standard "maximize lives" triage.

  6.  **Writing the Procedure (Iterative refinement):**
      *   *Name:* The Equal-Chance Allocation Protocol (ECAP).
      *   *Structure:* Flowchart style text.
      *   *Flags:* [JUDGMENT CALL] tags.
      *   *Limitations:* Acknowledge it doesn't solve "who among the equal."

  7.  **Running the Cases:**
      *   *Case A (Clinic vs. Valley):*
          *   Q1 (Feasibility): Both yes.
          *   Q2 (Success Prob): Clinic is high (confirmed location). Valley is low (search time/uncertainty).
          *   Q3 (Outcome): Assume similar survival quality.
          *   Q4 (Dependents): Assume neutral.
          *   Q5 (Numbers): 3 vs. Min 8.
          *   *Taurek Twist:* Even though 8 > 3, if the *individual chance* of rescue in the valley is diluted by search uncertainty, the 3 might win. Or, we use the "Minimum Credible Count." If we treat the 8-15 as "at least 8," does 8 outweigh 3? Taurek says not automatically. But practical constraints (probability of success) usually tip this. Let's make the procedure prioritize *certainty of rescue per individual*.
          *   *Result:* Clinic (3). Reason: Higher individual probability of successful extraction.
      *   *Case B (Rapid/Disabled vs. Slow/Intact):*
          *   Q1: Both feasible.
          *   Q2: Rapid has higher survival *rate*.
          *   Q3: Quality of Life. This is the key. If "severe disability" is deemed a significantly diminished future...
          *   *Result:* Slow/Intact.
          *   *Why the Board will hate it:* They want to maximize "lives saved" for funding/stats. Saving fewer people looks bad on a report, even if their quality of life is better.

  8.  **Review against Constraints:**
      *   Taurek-style? Yes, emphasizes individual chance over aggregate sum.
      *   Messiness handled? Yes (uncertainty, disability, dependents).
      *   Ordered questions? Yes.
      *   Stop/No-Stop? Yes.
      *   Judgment Flags? Yes.
      *   Limitations section? Yes.
      *   Two proposals run? Yes.
      *   One hated answer? Yes (Case B).
      *   Practical tone? Needs to be crisp, avoiding jargon like "aggregationism."

  9.  **Final Polish:**
      *   Ensure the distinction between "counting numbers" and "counting probabilities" is clear. Taurek objects to *aggregating loss*, not necessarily acknowledging that saving 100 people is logistically different than saving 1. But morally, the procedure must reflect that the *individual's* claim is paramount.
      *   *Correction on Taurek:* Taurek suggests a lottery if all else is equal. In disaster response, we can't always lottery. We need a "Weighted Fairness" approach.
      *   *Refining the "Hated" Case:* Make sure the reasoning is clear. If the procedure prioritizes "Intact Survival" over "Raw Survival Count," it violates standard utilitarian triage. This is the friction point.

  10. **Final Output Generation** (Drafting the response based on these thoughts).
      *   *Self-Correction during drafting:* Make sure I don't accidentally slip into utilitarianism in the "Dependents" section. Frame dependents as "additional specific losses" rather than "social utility."
      *   *Check:* Did I include the "Judgment replaces calculation" flags? Yes.
      *   *Check:* Did I include the "What it can't settle" section? Yes.

  (Proceed to generate output.)
answer: |-
  # The Equal-Chance Allocation Protocol (ECAP)
  **Version 1.0 | For Disaster-Response Board Use**

  **Purpose:** To allocate scarce rescue resources when not all victims can be saved, without treating human lives as interchangeable units in a sum.
  **Philosophical Grounding:** Based on the principle that each individual has an equal claim to rescue. Aggregate numbers (saving 5 vs. 1) do not automatically override individual claims. Priority is given to the *probability of success per individual* and the *quality of the future saved*, rather than total body count.

  ---

  ## Part 1: The Decision Procedure

  **Instructions:** Answer the following questions in order. If a "STOP" is reached, execute that decision. If a **[JUDGMENT FLAG]** appears, the Board Chair must call a vote; calculation cannot resolve this step.

  ### Q1: Feasibility & Immediacy
  **Question:** Is rescue physically possible for *both* groups within the critical time window?
  *   **No (One group is unreachable/too late):** Allocate to the reachable group. **STOP.**
  *   **Yes:** Proceed to Q2.

  ### Q2: Individual Probability of Success (The "Per-Capita" Test)
  **Question:** Does one group have a significantly higher *individual* probability of successful extraction? (e.g., Group A is in a known room; Group B is scattered in a flood zone where finding them is 50/50).
  *   *Note: Do not count total people yet. Compare Person A1 vs. Person B1.*
  *   **Yes (Difference > 20%):** Prioritize the group with the higher individual success rate. **STOP.**
      *   *Rationale:* It is fairer to give a 90% chance to 3 people than a 30% chance to 10 people.
  *   **No (Probabilities are roughly equal):** Proceed to Q3.

  ### Q3: Quality of Survival (The "Intact Future" Test)
  **Question:** Will one rescue option result in survivors with significantly diminished capacity for a meaningful life (e.g., severe permanent disability, prolonged agony) compared to the other?
  *   **Yes:** Prioritize the group with the higher quality of survival (more "intact" future). **[JUDGMENT FLAG]**
      *   *Board Vote Required:* Is the disability severe enough to outweigh a higher raw survival count? (Requires 2/3 majority to override).
  *   **No (Outcomes are comparable):** Proceed to Q4.

  ### Q4: Compounded Loss (Dependents)
  **Question:** Does one group contain individuals whose death causes *specific, identifiable* secondary deaths (e.g., a parent with an infant dependent on them for immediate survival, not just income)?
  *   **Yes:** Prioritize the group with the dependents. **STOP.**
      *   *Constraint:* Count only immediate life-dependence (e.g., feeding/care), not long-term economic impact.
  *   **No:** Proceed to Q5.

  ### Q5: The Numbers Threshold
  **Question:** Is the difference in group size "significant" (defined as > 3:1 ratio)?
  *   **Yes (e.g., 3 vs. 10+):** Prioritize the larger group. **STOP.**
      *   *Rationale:* While numbers don't automatically count, a massive disparity creates a presumption of fairness to the greater number *if* all previous factors are equal.
  *   **No (e.g., 3 vs. 5, or 8 vs. 15 with high error):** **[JUDGMENT FLAG]**
      *   *Board Vote Required:* Conduct a weighted lottery or Chair's tie-break. Do not default to the higher estimate.

  ---

  ## Part 2: Limitations (What ECAP Cannot Settlement)
  1.  **Identity within Groups:** ECAP selects *which group* to save, not *which individuals* within that group if resources run out mid-rescue.
  2.  **Social Value:** ECAP explicitly ignores social utility (e.g., "save the doctor over the criminal").
  3.  **Uncertainty Resolution:** If error bars overlap (e.g., 5 vs. 4–6), ECAP forces a judgment call rather than a mathematical expected-value calculation.
  4.  **Moral Distress:** This procedure may mandate saving fewer total lives to preserve fairness or quality of life. The Board must accept this moral cost.

  ---

  ## Part 3: Application to Current Proposals

  ### Case A: The Helicopter Dilemma
  **Scenario:** One helicopter sortie.
  *   **Option 1:** Flooded Clinic. **3 confirmed victims.** High accessibility.
  *   **Option 2:** Remote Valley. **Estimated 8–15 victims.** Unreliable comms, debris field makes location uncertain.

  **ECAP Run:**
  1.  **Feasibility:** Both reachable within fuel limits. (Proceed)
  2.  **Individual Probability:**
      *   Clinic: Location confirmed. Extraction probability ~90% per person.
      *   Valley: Search time required. Extraction probability estimated ~40% per person (due to search risk).
      *   *Comparison:* 90% (Clinic) > 40% (Valley). Difference is >20%.
  3.  **Decision:** **Prioritize the Clinic (3 people).**
      *   *Stop Point:* Q2.
      *   *Reasoning:* Even though the Valley *might* have 15 people, the *individual chance* of any specific Valley victim being saved is less than half that of a Clinic victim. Under Taurek-style fairness, we do not gamble the certain 3 for the probabilistic many.

  **Board Reaction:** Likely acceptable. High uncertainty usually justifies caution.

  ***

  ### Case B: The Triage Unit Dilemma
  **Scenario:** Two extraction units available, but only enough supplies for one approach.
  *   **Option 1 (Rapid Unit):** Can extract **12 people**. However, due to speed/rough handling required, all 12 will suffer **severe spinal injuries** (permanent paralysis from waist down).
  *   **Option 2 (Slow Unit):** Can extract **7 people**. Extraction is gentle. All 7 survive **intact** (no permanent disability).

  **ECAP Run:**
  1.  **Feasibility:** Both feasible. (Proceed)
  2.  **Individual Probability:** Both near 100% survival for those selected. (Proceed)
  3.  **Quality of Survival:**
      *   Rapid: Survival with severe permanent disability.
      *   Slow: Survival intact.
      *   *Comparison:* Significant difference in future quality.
  4.  **Decision:** **Prioritize the Slow Unit (7 people).**
      *   *Stop Point:* Q3 (Judgment Flag).
      *   *Reasoning:* The protocol weights "intact future" higher than "raw biological continuity." Saving 12 to a life of severe disability is deemed less morally weighty than saving 7 to an intact life, provided the Board votes to uphold the "Intact Future" standard.

  **Board Reaction:** **HOSTILE.**
  *   *Why they will hate it:* Disaster boards are funded and evaluated on "Total Lives Saved." Choosing to save 7 instead of 12 looks like a failure of efficiency on a report.
  *   *The Philosophical Conflict:* This is the Taurek friction point. A utilitarian says $12 > 7$. An individual-focused view asks: *Is the life offered to the 12 actually a benefit comparable to the 7?* If the Board rejects this, they are implicitly accepting that raw biological existence outweighs the quality of that existence, which ECAP is designed to resist.

  ---

  ## Part 4: Implementation Notes for the Chair

  1.  **Handling the Judgment Flags:** When a **[JUDGMENT FLAG]** appears, do not ask "What saves the most?" Ask "Which choice treats the individuals with equal respect?"
  2.  **Handling Uncertainty:** In Case A, if the Valley count was confirmed at 50+, Q5 (Numbers Threshold) would trigger. ECAP allows numbers to decide *only* when the disparity is massive and other factors are equal.
  3.  **Documentation:** When recording the decision for Case B, explicitly state: *"Decision made per ECAP Q3: Quality of survival prioritized over aggregate count."* This protects the board from accusations of arbitrary choice later.

  **Warning:** Using ECAP means you will sometimes choose to save fewer people. If the Board is not willing to accept that moral cost, this procedure should not be adopted.
