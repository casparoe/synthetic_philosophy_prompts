answer: |-
  The single requirement excluding the largest share of otherwise plausible theories is **Procedural Independence** (identifying will without a vote), and the jointly unsatisfiable pair is **Preference Actualism** versus **Epistemic Correction**, where the latter is the prejudice of the deliberative camp rather than a genuine requirement for adjudicating faction.

  | Desideratum | Case Earning Its Keep | Status |
  | :--- | :--- | :--- |
  | **Procedural Independence** | The **inter-electoral claim**: will must be identifiable independently of any procedure to adjudicate claims before a vote is held. | Non-negotiable |
  | **Aggregation Invariance** | **Scale-fragmentation**: must resolve cases where a majority rejects every component of a package yet approves the package as a whole. | Non-negotiable |
  | **Preference Actualism** | **The silent and misinformed**: must track the will people actually have (including non-voters) to avoid arbitrary elite substitution. | Non-negotiable |
  | **Epistemic Correction** | **The silent and misinformed**: must filter preferences formed under systematic misinformation to distinguish true will from manipulated faction. | Preference (Deliberative) |
  | **Bearer Continuity** | **The bearer question**: must define whether the people survive large changes in membership and whether the bearer binds its future self. | Non-negotiable |
  | **Intensity Sensitivity** | **Intensity**: must account for cases where 51% are mildly for and 49% are intensely against, preventing tyranny of the mild majority. | Preference (Liberal) |
  | **Cycle Resolution** | **Cycling and agenda-order**: must yield a stable determination even when no stable majority exists across sequential choices. | Non-negotiable |
  | **Constitutional Compatibility** | **Self-binding**: must adjudicate whether a people wills a constitution that later blocks what it now wants without denying current sovereignty. | Non-negotiable |

  **Jointly Unsatisfiable Pair:** **Preference Actualism** and **Epistemic Correction** cannot both be satisfied when misinformation is systemic; if the people are lied into a preference, Actualism counts it as will, while Correction rejects it. **Epistemic Correction** is the prejudice of the deliberative camp; for real-time adjudication of faction, substituting an idealized will for the actual psychological states of bearers is arbitrary and elitist, violating the specification's purpose.

  **Aggregative-procedural accounts:** Fail Procedural Independence; they define the will as the output of a vote count, making pre-vote adjudication logically impossible.
  **General-will tradition:** Satisfies Holism and Self-binding but fails Non-Arbitrariness; offers no real-time mechanism to distinguish the general will from a factional claim without circular interpretation.
  **Deliberative or counterfactual-will accounts:** Satisfy Epistemic Correction but violate Preference Actualism; they adjudicate based on what people *would* will, effectively replacing the people's voice with expert judgment.
  **Constructivist views:** Fail Procedural Independence; they hold the people exist only in being invoked, so there is no prior will against which to measure the politician's claim.
