answer: |-
  The practice you describe, often termed "transparent stewardship" or "apologetic retention," relies on a specific philosophical architecture designed to legitimize continued possession despite acknowledged illicit acquisition. Reconstructing this implicit theory reveals three core commitments.

  First, it presupposes a **Utilitarian Cosmopolitanism**. This view holds that the epistemic and aesthetic value of the object to a global public outweighs the proprietary rights of the source community. The museum posits itself as a node in a "universal" network where objects serve humanity at large, implying that removing the object to a specific national or local context diminishes its total utility. Second, it operates on a theory of **Epistemic Reparations**. By admitting to looting via wall texts, the institution assumes that the primary harm of colonialism was the erasure of history or context, which can be repaired through truth-telling and data sharing (like 3D scans). This treats the violence as a narrative problem rather than a property violation. Third, it relies on **Technological Substitutability**. The offer of digital surrogates suggests that the informational content of the artifact is separable from its material aura, and that for the purposes of education and memory, the copy can stand in for the original.

  Regarding your specific hypotheses: Yes, the practice assumes knowledge and display value outweigh property rights, otherwise the admission of theft would logically necessitate return. It does assume moral repair is achievable through acknowledgment and data, effectively decoupling justice from restitution. And yes, it secretly relies on a "World Heritage" theory where the encyclopedic museum is the optimal caretaker for the sake of global access.

  However, the internal consistency of this framework is fragile. There is a performative contradiction in claiming to democratize access while maintaining unilateral curatorial control. If the museum admits the acquisition was violent, yet retains the power to decide how that violence is narrated (even with "co-curation," the institution usually holds final veto power or structural dominance), it replicates the colonial power dynamic it claims to be critiquing. Furthermore, claiming "universal access" while the object remains physically inaccessible to the majority of the source community (due to visa costs, travel barriers, etc.) undermines the cosmopolitan justification.

  If we shift to a policy of **Interpretive Sovereignty**, where the source community holds exclusive authority over display and explanation, the museum's role undergoes a radical ontological shift. The museum can no longer function as an *author* of meaning but must become a *bailee* or a service provider. This would require:
  1.  **Surrendering Curatorial Voice:** The museum could not override a community's decision to keep an object sacred, hidden, or undisplayed, even if this contradicts the museum's mission of public access.
  2.  **Dismantling Universalism:** The object would cease to be "world heritage" managed by a global elite and become specific heritage managed by a specific polity.
  3.  **Structural Subordination:** In cases of dispute, the source community's ethical framework would supersede the museum's legal or academic frameworks.

  This shift exposes that "transparent stewardship" is not a neutral middle ground but a strategy to preserve institutional authority under the guise of ethical progress.

  Verdict: Transparent stewardship relies on a cosmopolitan utilitarianism that privileges global access over proprietary justice, whereas interpretive sovereignty would necessitate the museum's transformation from an authoritative owner to a subordinate custodian.
