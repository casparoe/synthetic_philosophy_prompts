          3.  **Material Continuity vs. Informational Access:** The physical object is less important than the data it yields.
      *   *Consistency Check:* Highlight the contradiction between admitting illegitimacy of acquisition while asserting legitimacy of retention. The "apologetic retention" paradox.
      *   *Interpretive Sovereignty:* What changes? The museum loses its voice. It becomes a warehouse or a partner, not an authority. It challenges the "Universal Museum" model fundamentally.
      *   *Conclusion/Verdict:* Needs to be punchy and summarize the core tension.

  7.  **Refining the Argument (Self-Correction during drafting):**
