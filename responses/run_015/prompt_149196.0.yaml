prompt: |-
  Hey, construct a thought experiment for conciliationism vs. steadfastness with a twist that isn't just the usual restaurant-bill case. Put two peer archivists on a museum board: they disagree over whether an oral tradition about a factory strike should outweigh a contradictory company record. Both have the same trainning and accuracy on other disputes, but one grew up in the community and has direct testimonial access while the other only has the files. Design the scenario—one paragraph, realistic, no sci-fi—so conciliationism pushes the first archivist to split the difference with her peer, while steadfastness lets her hold firm because she can inspect her own reasoning trace but not his. Then do the check: state the belief, the method, each theory's verdict and why, point out the feature doing the work (the access asymmetry despite peer calibration), and say what happens if you remove that feature—does it collapse into a generic disagreement? Finish with how a conciliationist would push back on the steadfastist's move. Keep it focused, no reading lists.
