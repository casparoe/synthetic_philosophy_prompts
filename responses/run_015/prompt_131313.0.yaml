  1. **Question 1 (Motivational Infrastructure):**
  In your monograph, you argue that rapid demographic change erodes the "motivational infrastructure" required for high-transfer welfare schemes. I would like to press on the modal status of this claim: do you intend this as an empirical prediction about voter psychology—suggesting that solidarity *contingently* fades with diversity—or as a normative condition for legitimate coercion, implying that solidarity *ought* to be bounded regardless of empirical resilience? If the former, your view seems vulnerable to counter-empirical findings; if the latter, it risks circularity by defining legitimacy in terms that exclude the very populations whose rights are in question.

  *   **Follow-up 1:**
      You have indicated in previous work that this operates as both a descriptive and normative claim. However, if you maintain that the empirical fragility of solidarity generates a normative duty to restrict standing, are you not deriving an "ought" from an "is"? Specifically, does this not commit you to the view that prejudicial attitudes among current members acquire normative weight simply by virtue of their existence, thereby allowing existing biases to veto the entry rights of outsiders?

  2. **Question 2 (Asylum and Collapsed Reciprocity):**
      Let us turn to the distinction you draw between entry rights and standing rights. Consider asylum seekers fleeing states where the "thick civic reciprocity" you prize has already collapsed due to war or famine. These individuals cannot offer immediate reciprocity because their capacity to contribute has been structurally destroyed. If you grant them entry rights based on urgency but deny them standing rights in the distributive scheme until integration is achieved, are you not creating a class of residents who are subject to the state's coercion without access to the cooperative benefits that justify that coercion in the first place?

  *   **Follow-up 1:**
      Your likely reply is that this two-tier structure is merely provisional—temporary protection pending integration. But given that trauma and structural barriers often delay integration for years, does this provisional status not functionally reproduce the kind of permanent exclusionary caste system you claim to avoid? At what point does the duration of "temporary" non-standing convert a protective measure into a violation of the very democratic solidarity you seek to preserve?

  *   **Follow-up 2:**
      Furthermore, if standing is contingent on the capacity to reciprocate, how do you account for existing citizens who are permanently unable to contribute due to disability or age? If they retain full standing based on membership rather than contribution, why is that same logic not extended to refugees who were willing co-authors of their own societies before external collapse? Does your entry-versus-standing distinction inadvertently penalize bad luck in a way that contradicts the insurance function of the welfare state?

  3. **Question 3 (Operationalization of Integration):**
      Moving to the metrics of your theory: you argue that standing rights are contingent upon prior integration into the framework of thick civic reciprocity. How do we operationalize the determination that reciprocity has been achieved without smuggling in assimilationist benchmarks or culturally parochial norms? If the state acts as the arbiter of who has successfully integrated, does this not grant the majority culture the power to define the terms of cooperation in a way that systematically disadvantages non-dominant groups, effectively turning standing rights into a privilege granted only to those who mirror the existing electorate?

  *   **Follow-up 1:**
      I anticipate you will retreat to procedural rather than substantive criteria for integration—focusing on adherence to law and democratic norms rather than cultural affinity. But if the criteria are purely procedural, is that robust enough to sustain the "thick" solidarity you claim is necessary for redistribution? Thin procedural compliance rarely generates the deep trust required for high-tax regimes; does your view not require a substantive cultural homogeneity that your procedural definitions attempt to obscure?

  *   **Follow-up 2:**
      Moreover, if integration is the precondition for standing, who bears the burden of proof? If the migrant must demonstrate reciprocity before accessing the resources that would facilitate integration (such as language training or housing support), are you not creating a catch-22 where standing is withheld precisely until it is no longer needed to secure integration? Does this not render the entry-versus-standing distinction a mechanism for deferring obligation indefinitely?

  4. **Question 4 (Falsifiability and Concluding Challenge):**
      My final question concerns the falsifiability of reciprocity-first conditionalism. You distinguish your view from empirical warnings about fiscal strain by grounding it in normative legitimacy. However, what specific institutional failure or empirical finding could actually falsify your position, as opposed to merely demonstrating that integration is more difficult or costly than anticipated? If every failure of redistribution can be attributed to insufficient integration rather than a flaw in the conditionalist architecture, does the theory not become immune to refutation?

  *   **Follow-up 1:**
      If you respond that the theory would be falsified by a successful instance of high-redistribution under conditions of open borders and rapid demographic change, we must ask: does this not reduce your normative claim to a bet against cosmopolitan empirical success? If such a society were to emerge, would you concede that the lexical ordering of reciprocity over open borders was mistaken, or would you argue that their solidarity was simply "thinner" and therefore less legitimate, thereby insulating the normative claim from the empirical counter-example?
