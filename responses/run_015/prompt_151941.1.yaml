          *   Singular Command $\rightarrow$ Exceptional, non-generalizable override to one PI.
          *   Teleological End $\rightarrow$ Trial's ultimate therapeutic promise/scientific destiny.
      *   **Constraints:** No theological language unless rendered precisely in protocol equivalents. Do not make the IRB framework sound like it already contains "inward faith" or "absolute relation."
      *   **Second Task:** Provide a "Residue Report."
          *   Identify clean mappings.
          *   Identify distorted survivals (paradox of faith, inwardness, anxiety, non-verifiable command).
