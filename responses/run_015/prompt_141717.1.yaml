answer: |-
  Here is a complete lesson plan for a 75-minute seminar session designed to operationalize the money-pump argument through a trading game.

  ### **Session Title:** The Cost of Cycles
  **Time:** 75 Minutes
  **Students:** 14 (7 Agents, 7 Exploiters)
  **Materials:** 
  *   30 Index Cards (10 marked **A**, 10 marked **B**, 10 marked **C**).
  *   ~200 Poker Chips (two colors: one for "Currency," one for "Bank Fees").
  *   2 Six-sided Dice.
  *   Whiteboard for tracking scores.

  ---

  ### **1. The Setup (10 Minutes)**

  **The Story:**
  Tell the class they are entering a market for "Consumption Bundles" (Cards A, B, C). 
  *   **Objective Value:** All cards redeem for **10 Chips** at the end of the game.
  *   **Subjective Preference:** Agents have a specific, intransitive preference order they *must* roleplay. 
  *   **Transaction Cost:** Every trade costs **1 Chip**, paid to the Bank (You).
  *   **Termination Risk:** After every trade, a die is rolled. On a **1 or 2**, the market closes immediately.

  **Group Division:**
  *   **Group 1 (Agents):** 7 Students. 
      *   *Endowment:* 15 Chips + 1 Random Card (A, B, or C).
      *   *Preference Sheet:* Handed out secretly. All read: **"You prefer A to B, B to C, and C to A."** (This is the cycle).
      *   *Goal:* Maximize Final Score = (Final Chips) + (Card Redemption 10) + (Satisfaction Bonus).
      *   *Satisfaction Bonus Rule:* Tell them: *"If you end the game holding a card you prefer over the one you started the round with, you gain 'Satisfaction.' You must decide if Satisfaction is worth the Chip cost."* (Do not quantify Satisfaction in chips).
  *   **Group 2 (Exploiters):** 7 Students.
      *   *Endowment:* 0 Chips.
      *   *Goal:* Maximize "Bank Extract." They get 1 point for every Chip the Agent pays to the Bank.
      *   *Information:* They know the Agents' preference cycle (A>B>C>A).
      *   *Constraint:* They can only offer a swap if it moves the Agent *up* their preference list (e.g., if Agent has B, Exploiter must offer A).

  **The "Small Gain" Wrinkle (Crucial Instruction):**
  Before starting, announce to the room: *"In this market, the subjective 'Satisfaction' of a single upgrade is generally considered small. Most agents value an upgrade at less than 1 Chip of cold hard cash. But you don't know your exact valuation until you trade."* 
  *(This plants the seed that trading might be irrational, satisfying your constraint that gains are small relative to fees.)*

  ---

  ### **2. Trading Protocol (20 Minutes)**

  1.  **Pairing:** Match each Agent with an Exploiter.
  2.  **Offer:** Exploiter looks at Agent's card. Offers the *preferred* card from the cycle (e.g., Agent has B, Exploiter offers A).
  3.  **Decision:** Agent chooses **Swap** or **Hold**.
      *   If **Swap**: Agent gives 1 Chip to the Bank (You). Agent swaps cards.
      *   If **Hold**: No chips change hands. Cards stay same.
  4.  **Termination Roll:** You roll the D6 publicly.
      *   **1-2:** Game Over. Agents cash out.
      *   **3-6:** Continue to next offer.
  5.  **Repeat:** Continue until Game Over or Agent refuses 3 consecutive swaps (signaling "Commitment").

  **Instructor Role:** 
  *   Collect the 1 Chip fees into a visible "Bank Pile."
  *   Track the number of swaps per pair on the board.
  *   Enforce the rule: Exploiters *must* offer the preferred option (to simulate the pump structure).

  ---

  ### **3. Round 1 Debrief (10 Minutes)**

  Do not explain the theory yet. Ask descriptive questions:
  1.  **To Agents:** "Who traded at least once? Who traded three times?"
  2.  **To Exploiters:** "Who got an agent to cycle back to their original card?"
  3.  **The Bank:** Count the chips in the Bank Pile. "This is wealth destroyed by transaction costs. Who paid it?"

  **Key Observation to Highlight:** 
  Point out any Agent who traded A→B→C→A. 
  *"You started with A. You ended with A. You have 3 fewer chips. The Exploiter didn't take the chips; the Bank did. The fee made the cycle visible."*

  ---

  ### **4. Role Swap & Variant (20 Minutes)**

  **Swap:** Agents become Exploiters, Exploiters become Agents.
  **New Rule (The "Commitment" Test):** 
  Tell the new Agents: *"You are allowed to make a binding declaration before the first roll. You can say 'I will not trade more than once.' If you break this promise, you forfeit 5 Chips."*
  *(This introduces the pre-commitment strategy without naming it.)*

  **Run the Protocol:** Same as Round 1.
  **Expectation:** Some Agents will use the commitment rule to stop the pump. Others will ignore it and get drained again. The stochastic die roll will force some Agents to trade once (to avoid ending on a "bad" card before the game cuts), validating the "forgoing gains" worry.

  ---

  ### **5. Final Debrief & Theory Mapping (15 Minutes)**

  This is where you connect the game mechanics to the decision theory. Draw three columns on the board: **Game Moment**, **Student Intuition**, **Theoretical Concept**.

  | Game Moment | Student Intuition | Theoretical Concept |
  | :--- | :--- | :--- |
  | **The 1-Chip Fee** | "It's just a small tax." | **Transaction Cost / Spread.** This is the critical wrinkle. Without it, the cycle is costless. With it, the cycle has a price. |
  | **The Die Roll** | "I had to trade now or I'd be stuck with C." | **Stochastic Termination.** This counters the "I'd just wait" objection. Inaction has an opportunity cost (risk of ending on a dispreferred bundle). |
  | **Refusing to Trade** | "I saw the cycle coming." | **Backward Induction.** (If they reasoned from the end). |
  | **Using the Cap** | "I promised not to trade twice." | **Pre-commitment / Plan Rationality.** |
  | **Trading Once** | "I got a better card for 1 chip." | **Myopic Choice.** Locally rational (Gain > Fee), globally dangerous if it leads to a cycle. |

  **The Uncomfortable Conclusion (The "Cost-Relative" Point):**
  Deliver this script: 
  *"Most of you think the Money Pump proves Intransitivity is irrational. Look at the Bank Pile. If the Fee was 0, you could cycle forever and lose nothing but time. If the Fee was 100, no one would trade. The pump only works if **(Value of Upgrade) > (Fee)**.*
  *Therefore, the argument doesn't prove you must be transitive. It proves you must not accept cycles **profitable at the prevailing spread**. If your preference for A over C is weak (small gain), and the fee is high, keeping the intransitive preference is rational. The fee saves you from the drain."*

  ---

  ### **Predictable Failures & Mitigation**

  1.  **The "Strike" (Agents refuse all trades):**
      *   *Why:* Students realize Card Value (10) is constant, so paying 1 Chip is objectively losing money.
      *   *Fix:* Emphasize the **Satisfaction Bonus** during setup. "If you end on a dispreferred card, you feel a 'psychic loss' equivalent to chips." Remind them they are roleplaying an agent who *feels* the preference, not a robot maximizing only cash.
  2.  **Collusion:**
      *   *Why:* Agent and Exploiter split the "Bank" chips.
      *   *Fix:* The Bank is *you*. Chips go into a pile on your desk, not the Exploiter's hand. Exploiters only get "points" on a scoreboard.
  3.  **Confusion on Preferences:**
      *   *Why:* A>B>C>A is cognitively taxing.
      *   *Fix:* Print the preference cycle clearly on their sheet: **"If you have B, ask for A. If you have C, ask for B. If you have A, ask for C."** Give them the algorithm, not just the order.
  4.  **Boredom in Round 2:**
      *   *Why:* They've seen the trick.
      *   *Fix:* Make Round 2 competitive. "The Exploiter who extracts the most fees gets first choice on the next seminar topic."

  ---

  ### **The Unstageable Feature**

  **The Discovery of Preference:**
  The game assumes Agents *know* they have intransitive preferences (it's printed on their sheet). In the real philosophical dispute, the problem is often that agents *discover* their intransitivity only after being pumped, or that preferences are constructed during choice. 
  *   **What to say out loud:** *"In this game, you knew your preferences were cyclic from the start. In reality, the money pump is dangerous because we often don't know we're in a cycle until we've already paid the fees. The game simulates the exploitation, but not the self-ignorance that makes the exploitation possible."*

  **The "Wealth" Metric:**
  The game uses chips as a universal metric for both "Cash" and "Utility" (via the Satisfaction abstraction). 
  *   **What to say out loud:** *"We used chips to measure satisfaction to make the game playable. But the real argument is about whether we can compare 'happiness from a bundle' to 'cash in pocket' at all. The pump assumes we can. If we can't, the fee doesn't matter."*
