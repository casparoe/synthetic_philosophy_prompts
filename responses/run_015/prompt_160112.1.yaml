answer: |-
  It is a pleasure to meet a fellow measurer. You are quite right to feel frustrated; philosophy often treats "mechanism" as a dirty word, whereas in your line of work, if you can't measure it or describe how it works, you haven't really found the phenomenon. Brenda, however, seems to be trying to carve out a middle path that respects the physics without dismissing the experience.

  Here is the breakdown of the three positions you outlined, how they handle Partial Mary, and my assessment of Brenda's likely ruling based on her track record.

  ### 1. The Three Hypotheses on Partial Mary

  **Hypothesis 1: The Ability Camp**
  *   **The Logic:** Knowledge is knowing-how. To know what red is like is to be able to imagine it, remember it, or recognize it.
  *   **Prediction for Partial Mary:** She learns something new because she gains new abilities (she can now recognize red, which she previously called "dark yellow").
  *   **Surprise Level:** **Exactly as surprised as Ordinary Mary.** On this view, the gap is binary: either you have the ability or you don't. The fact that she already has *some* colour abilities (for blue/green) doesn't bridge the gap to the *ability* to recognize red. The inability is total until the cone fires.

  **Hypothesis 2: The Phenomenal Concept Camp**
  *   **The Logic:** The fact is old (physical), but the *concept* is new. She gains a new "file folder" in her mind that can only be opened by experience.
  *   **Prediction for Partial Mary:** She learns something new (a new concept).
  *   **Surprise Level:** **Exactly as surprised as Ordinary Mary.** The surprise comes from the mismatch between the physical description and the phenomenal concept. Even if she has a 2D colour map, the *concept* of "red experience" is distinct from "green experience." The conceptual gap is just as wide for a new dimension as for a new modality.

  **Hypothesis 3: The Quality-Space / Acquaintance Camp**
  *   **The Logic:** Knowledge requires occupying the state. You must "stand in" the quality. However, because you already occupy a structured space (colour space), new experiences are located relative to old ones.
  *   **Prediction for Partial Mary:** She learns something new (she occupies a new neural state), but it is structurally related to what she already knows.
  *   **Surprise Level:** **Less surprised than Ordinary Mary.** Ordinary Mary has no qualitative framework; red is a shock from outside her universe. Partial Mary has a 2D colour map; red is a new direction on a map she already holds. The "shock" is dampened by the existing structure.

  ### 2. Brenda's Likely Verdict

  **The Verdict:** Brenda will rule that Partial Mary **does learn something new**, but she will be **less surprised** than Ordinary Mary.

  **The Reasoning:**
  Brenda is not a standard dualist (she denies new *facts*), nor is she a functionalist (the Robot verdict kills that). Her view hinges on the **Simulation Case**. That is the key to the whole puzzle.

  When she said, *"If it's a real running of her own colour machinery then yes... the difference... is in whether the system has actually been exercised,"* she told you exactly what she values. She values the **physical activation of the specific neural circuit**.

  1.  **Why she learns something:** For Brenda, "knowing" isn't about writing down a true sentence (fact); it's about the system *firing*. In the Partial Mary case, the L-cone and its associated neural pathway have never fired before. The "machinery" is finally "exercised." Therefore, she gains the acquaintance.
  2.  **Why she is less surprised:** Brenda accepted the **Inverted Mary** case as a "real difference" based on wiring. This shows she cares about the *structure* of the physical system. Ordinary Mary has zero colour-structure in her experience. Partial Mary has a fully functioning 2D colour structure. When the L-cone fires, it integrates into an existing network. The *mechanism* of the surprise is the integration of a new signal into an old map. For Ordinary Mary, there is no map. For Partial Mary, there is. A physiologist knows that stimulating a sensitized pathway is different from stimulating a dormant one. Brenda's emphasis on "machinery" suggests she respects this physiological difference.

  **Winning the Tenner:**
  Bet that she says **Yes, she learns something** (in the acquaintance sense), but emphasize that the **surprise is diminished** because the "quality space" was already partially occupied. If the bet is a simple Yes/No on "Does she learn anything new?", the answer is **Yes**. Brenda consistently rules that if the machinery runs for the first time, knowledge is gained (Simulation case), regardless of whether it adds a new "fact" to the world (Ordinary Mary case).

  ### 3. The Tie-Breaking Case

  The strongest tension is between **Hypothesis 1 (Ability)** and **Hypothesis 3 (Acquaintance/Activation)**. Both say she learns something. But they disagree on *what* constitutes the knowledge. Ability requires you to *keep* the skill. Acquaintance requires only that the state *occurred*.

  To separate these, propose **"The Amnesic Mary"** case to the group next week.

  **The Case:**
  Mary is released and looks at the red tomato. The visual system fires; she has the experience. However, due to a rare condition (or a sci-fi intervention), she immediately loses all memory of the event and loses the ability to imagine or recognize red again. She retains all her physical knowledge, but the specific ability to "do" anything with red is gone.

  **What it shows:**
  *   **The Ability Camp (1)** must say she **did not know** (or doesn't know now). If knowledge is an ability, and she has no ability, she has no knowledge.
  *   **The Acquaintance/Activation Camp (3)** must say she **did know** (at the moment). The system was "exercised." The machinery ran. The event happened.

  **Why this fits Brenda:**
