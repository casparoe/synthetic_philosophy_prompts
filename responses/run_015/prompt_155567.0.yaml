      *   *Target:* To maximize probability of hitting a specific target *above* the median in finite time, you generally need *more* variance than Kelly (fractional Kelly < 1 reduces variance, > 1 increases variance). Since Kelly median $\approx$ Target, to get $P > 50\%$, you need to shift the distribution right, which implies $f > 0.2$.
