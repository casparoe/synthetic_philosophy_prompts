      *   *Kelly Performance:* Median wealth after 60 rounds $\approx W_0 \cdot e^{60 \cdot g(0.2)}$. $g(0.2) \approx 0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 0.6(0.182) + 0.4(-0.223) \approx 0.109 - 0.089 = 0.02$. $e^{60 \cdot 0.02} = e^{1.2} \approx 3.32$. So Kelly median hits the target (3.0).
      *   *The Conflict:* Kelly maximizes *median* terminal wealth (asymptotically). But the goal is $P(W_{60} \ge 3M \text{ and } W_t > 0.25M \forall t)$.
