answer: |-
  This is a sophisticated problem in the sociology of science and the philosophy of funding. You are asking me to reverse-engineer the decision heuristic of a specific actor who explicitly claims to use Imre Lakatos's Methodology of Scientific Research Programmes (MSRP), but whose actual behavior (the track record) reveals a modified, institutional version of it.

  Here is the analysis of her rule, her likely decision on the mystery case, and the crucial test case that would expose her actual operating system.

  ### 1. The Rule She Is Running

  She is not running a strict Lakatosian rule, nor is she running a simple "novel fact" rule. She is running **Lakatos plus Institutional Hygiene.**

  A strict Lakatosian looks at the *logic* of the programme: Is the theoretical content increasing? Is some of it corroborated?
  Your Programme Officer (PO) looks at the *sociology* of the programme: Is the community policing its own hard core? Are the tools independent? Is the "progress" actually just a reshuffling of the protective belt?

  Her rule can be reconstructed as follows:
  **Fund if:** (Theoretical Progress OR Empirical Progress) **AND** (Hard Core Stability **AND** Methodological Independence).
  **Cut if:** (Degenerating Problem Shift) **OR** (Hard Core Fragmentation) **OR** (Circular Calibration).

  Let's test this against her nine previous calls:

  *   **Phlogiston/Vulcan/Cut Programme:** All failed on **Methodological Independence** and **Degeneration**. They absorbed anomalies via *ad hoc* auxiliaries without new content. The "Cut Programme" is the key: 10 years of explaining null results is the definition of a degenerating shift.
  *   **Wegener (pre-1960):** Failed on **Theoretical Progress**. He had a fact (drift) but no mechanism (hard core was weak/missing). She called it degenerating *at the time*, proving she judges on the state of the programme *then*, not on hindsight.
  *   **Plate Tectonics/Neutrino:** Passed all checks. Plate Tectonics had mechanism + novel prediction (magnetic striping). Neutrino started *ad hoc* (rescue device) but achieved **Methodological Independence** (detection methods) and **Theoretical Progress** (weak force integration).
  *   **String Theory:** This is the outlier that defines her nuance. It fails **Empirical Progress**. She funds it because it passes **Theoretical Progress** (mathematical unification) and maintains **Hard Core Stability** (the math is consistent even if untested). She tolerates empirical stalling *only* when theoretical richness is high.

  ### 2. The Mystery Case: What She Says vs. What She Should Say

  **What she will say:**
  She will cut the programme. She will acknowledge the "prediction" but dismiss it as a **pseudo-novel fact**.

  Her public rationale will focus on the **calibration circularity** and the **hard core fragmentation**. She will argue that a prediction generated by a simulation, tested by an instrument calibrated against that same simulation, does not count as independent corroboration. It is the theory testing itself. Furthermore, she will point to the split in the field (mechanism vs. readout) as evidence that the **hard core has dissolved**. In Lakatosian terms, when the proponents of a programme cannot agree on what the fundamental entity *is*, but agree to share funding, the protective belt has swallowed the hard core. That is the definition of degeneration.

  **What she should say (to be consistent):**
  She should say exactly that. To be consistent with the **Wegener** and **Cut Programme** decisions, she must prioritize the *integrity of the problem shift* over the *existence of a positive result*.

  *   **Consistency with Wegener:** Wegener had the "fact" (continents fit) but lacked the mechanism. She cut him. The Mystery Programme has a "fact" (the asymmetry ratio) but the mechanism is disputed (oscillation vs. readout). If she funds this, she contradicts her Wegener decision.
