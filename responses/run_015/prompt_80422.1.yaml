answer: |-
  You have put your finger on one of the central tensions in the philosophy and sociology of science. There is no single, canonical English word that captures this specific three-way fork, but there is a well-established framework for it within the **Sociology of Scientific Knowledge (SSK)** and the history of science.

  The scholar you are looking for is **Robert K. Merton**. In the mid-20th century, Merton formalized exactly what you are describing: the distinction between the *social reward system* of science (who gets the prize) and the *epistemic status* of the discovery (was it bound to happen?).

  Here is how to map the territory you've identified, the terms that exist for the edges, and a proposal for how to name the configuration.

  ### 1. The Three Axes (The Configuration)

  You are correct that "credit" is a conflation of three distinct variables. In academic literature, they are usually treated as separate dimensions:

  **Axis 1: Historical Necessity (Inevitability vs. Contingency)**
  *   **The Question:** Was this discovery "in the air" (multiple discovery is likely) or did it require a unique genius (singular discovery)?
  *   **Established Terms:** This is the debate between **Historical Determinism** (the *Zeitgeist* view; science evolves inevitably) and **Historical Contingency** (the *Great Man* view; specific individuals alter the trajectory).
  *   **The Tension:** If Determinism is high, individual credit should theoretically be diluted (shared). If Contingency is high, credit should be concentrated.

  **Axis 2: Substantive Contribution (Merit)**
  *   **The Question:** Who actually did the intellectual work of synthesis, proof, or insight?
  *   **Established Terms:** **Epistemic Credit** or **Cognitive Contribution**.
  *   **The Tension:** This often tracks with Axis 1, but not always. Two people might have the insight (Axis 1 = Inevitable), but one provides the rigorous proof while the other has only a hunch (Axis 2 = Merit differs).

  **Axis 3: Institutional Priority (Documentation)**
  *   **The Question:** Who satisfied the bureaucratic requirements of the scientific community first?
  *   **Established Terms:** **Priority** (in the Mertonian sense).
  *   **The Mechanism:** This is not about truth or genius; it is about **adjudication**. Science needs a clean break to move forward. As Merton argued, "Priority" is the currency of science. It is a social mechanism to settle disputes, not a philosophical judgment on inevitability.

  ### 2. Why There Is No Single Word

  There isn't one word for this triangle because the scientific community actively works to **collapse** it.

  To function efficiently, science pretends that Axis 3 (Priority) is a perfect proxy for Axis 2 (Merit) and ignores Axis 1 (Inevitability). We say "Newton discovered calculus" because it simplifies the narrative, even if historically calculus was "in the air" (Axis 1) and Leibniz contributed equal merit (Axis 2).

  If you need a term for this specific conflation, the closest existing concept is **The Priority Rule** (or **Mertonian Priority**). Merton explicitly noted that the Priority Rule functions *regardless* of whether the discovery was inevitable. Its purpose is to motivate scientists to publish, not to accurately measure historical necessity.

  However, if you want to name the *distinction* you are making (the fork itself), you might call it:
  *   **The Priority-Merit-Necessity Gap**
  *   **The Adjudication-Epistemology Split**

  ### 3. Mapping the Edges: Newton and Leibniz

  Your intuition about Newton and Leibniz is the perfect test case for this framework. Here is how the three axes diverge in that specific instance:

  *   **Axis 1 (Necessity/Inevitability):** **High Inevitability.**
      Both men were standing on the shoulders of Barrow, Fermat, and Descartes. The tools of algebraic geometry were mature enough that calculus was arguably "due." If neither had been born, someone else (like Bernoulli) likely would have formalized it within 20 years.
      *   *Credit Implication:* Individual credit should be low/shared.

  *   **Axis 2 (Merit/Contingency):** **High Contingency (Divergent).**
      While the *core concepts* (integration/differentiation) were the same, the *formulations* were contingent. Leibniz's notation ($dy/dx$) was vastly superior to Newton's (fluxions) and is what we use today. Newton's physical application was deeper.
      *   *Credit Implication:* Credit should be split based on utility. Leibniz gets credit for the *language*; Newton for the *physics*.

  *   **Axis 3 (Priority/Documentation):** **Newton Wins (Institutionally).**
      Newton developed it earlier (roughly 1666) but published later. Leibniz published first (1684). The Royal Society (chaired by Newton) adjudicated the dispute in Newton's favor.
      *   *Credit Implication:* Newton gets the *name* ("Newtonian Physics"), but the world uses Leibniz's math.

  **The Result:** The "Who found it?" question yields different answers depending on which axis you query.
  *   Ask a **Historian** (Axis 1): "It was a multiple discovery; credit belongs to the era."
  *   Ask a **Mathematician** (Axis 2): "Leibniz gets credit for the notation; Newton for the application."
  *   Ask a **Textbook** (Axis 3): "Newton and Leibniz" (sometimes), but often just "Newton" due to the Matthew Effect (the famous get famous).

  ### 4. Proposed Terminology for Your Use

  Since you are looking for a way to articulate this distinction in your own thinking or writing, I suggest adopting the following labels. They are precise and map to the philosophical literature without requiring a paragraph of explanation each time.

  1.  **Ontic Status:** (Your "Inevitability") Was the truth waiting to be found?
  2.  **Agentic Contribution:** (Your "Contingency") How much did the specific individual's mind shape the outcome?
  3.  **Institutional Priority:** (Your "Documentation") Who satisfied the social contract of publication first?

  **The "Fork" itself:**
  You could refer to this as **The Mertonian Triangle of Credit**.

  ### 5. Why This Distinction Matters

  You noted that these pull in opposite directions. This is crucial for understanding **Eponymy** (naming things after people).

  *   **Stigler's Law of Eponymy:** "No scientific discovery is named after its original discoverer."
  *   **Why?** Because Eponymy tracks **Axis 3 (Priority/Visibility)** and **The Matthew Effect** (fame), but it often ignores **Axis 1 (Inevitability)**.

  When you separate these three, you realize that asking "Who discovered X?" is actually a category error.
  *   If you mean "Who was the first human to encode this truth?" that is **Priority**.
  *   If you mean "Without whom would this truth have remained hidden?" that is **Contingency**.
  *   If you mean "How much of this was just the next logical step?" that is **Necessity**.

  In the case of Darwin and Wallace:
  *   **Necessity:** High (Malthus, geology, and breeding made evolution "in the air").
  *   **Contingency:** Moderate (Darwin's 20 years of data vs. Wallace's insight).
  *   **Priority:** Shared (The Linnean Society joint reading), but **Credit** went to Darwin (Axis 3 collapsed into Axis 2 due to Darwin's thicker evidence).

  ### Summary
  There is no single word, but the framework is **Mertonian Sociology of Science**.
  *   The fork is between **Epistemic Necessity** (was it bound to happen?) and **Agentic Contingency** (did they make it happen?).
  *   The resolution is **Institutional Priority** (who filed the claim?).
  *   The conflict arises because science uses **Priority** to settle questions of **Contingency**, while ignoring **Necessity**.

  If you need a shorthand for your own notes, call it the **Priority-Merit-Necessity Triad**. It captures the fact that we use the third (Priority) to answer questions about the second (Merit), while the first (Necessity) haunts the whole process.
