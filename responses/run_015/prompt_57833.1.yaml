    "belief_link": "If a mixed strategy beats you in every single case, it mathematically must beat you in any weighted average of those cases, making you never optimal.",
    "order_point": "The final set of survivors is order-independent, but removing Down immediately simplifies Column's problem by removing a strategy they never need to guard against.",
    "trap": "You interpreted mixing as introducing gambling risk instead of recognizing it as a tool to engineer a higher minimum payoff."
  }
