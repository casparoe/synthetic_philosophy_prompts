answer: |-
  It is good to hear from you, and you have picked up on exactly the right tension that keeps the file theory of reference interesting. Your tentative principle is a solid starting point, but if we run it hard against the cases you listed, it does fracture in a couple of specific places. The core idea that informativeness tracks the distinctness of cognitive files is promising, but your own verdicts show that file distinctness is neither necessary nor sufficient for informativeness. Let us walk through where the breaks happen and how we might weld them back together.

  The first crack appears in your astronomer case. You stipulate that two astronomers independently dub the same anomalous reading A and B, and when they say A is B, you judge this uninformative. Your tentative principle says informativeness requires distinct files. Since there were two separate dubbing acts, there are arguably two distinct file tokens created here, yet you say nothing is learned. This tells us that mere token distinctness of files, or distinctness of names, is not enough. The repair forced by this case is that the files must differ not just in identity but in their epistemic content or mode of access at the time of the assertion. In the astronomer case, both files are populated by identical evidence, namely the immediate instrument reading in the shared room. Because the epistemic route to the referent is identical for both terms, linking them yields no new constraint on the world. So we must amend the principle to require that the files embody distinct epistemic perspectives or justificatory bases, not just distinct labels.

  The second and more stubborn break comes from your Water and Lois cases. You note that Water is H2O stays informative for experts and Clark Kent is Superman stays non-inert for Lois even after they believe the identity and have seemingly merged the files. Your tentative principle suggests that once files are merged, distinctness vanishes and informativeness should drop to zero. Since you insist informativeness persists, we have to conclude that file merger in the sense of belief acceptance does not erase the functional distinctness of the concepts. The repair forced by these cases is that informativeness tracks the persistence of distinct cognitive roles rather than the current belief state regarding coreference. Even if Lois believes Clark is Superman, the file labeled Clark Kent is tied to intimate social interactions and the file labeled Superman is tied to heroic rescue scenarios. These roles do not collapse just because the identity is believed. Similarly, for the chemist, the concept Water plays a phenomenal and practical role while H2O plays a theoretical and structural role. The identity statement remains informative because it bridges two distinct conceptual frameworks that continue to operate independently for different purposes.

  So the repaired principle looks something like this. An identity statement a is b is informative for a speaker S if and only if S associates a and b with cognitive files that play distinct epistemic or practical roles, such that asserting the identity constrains the world in a way that neither file does alone. This saves the Hesperus case because the evening and morning appearances are distinct epistemic roles. It saves the Astronomer case because the epistemic roles are identical despite the distinct names. It saves the Water and Lois cases because the practical and theoretical roles remain distinct even after the identity is believed. However, I have to be straight with you about the Vulcan case. You want to say Vulcan is Vulcan is defective in a way Hesperus is Hesperus is not, specifically that it is not true. My repaired principle explains why it is uninformative, since the file is identical to itself, but it cannot explain the truth-value defect. That verdict relies on a theory of reference failure for empty names, which is orthogonal to the theory of informativeness. I can save your verdict that it is uninformative, but I cannot save the verdict that it is untrue without importing a separate semantic theory about empty terms.

  Now for the two cases you have not settled. First, if you know A equals B and B equals C and have merged both pairs, is A equals C informative? Given the repaired principle, the answer depends on whether the cognitive roles of A and C remain distinct. If A is a phenomenal concept, B is a bridge concept, and C is a theoretical concept, then even if you believe A equals B and B equals C, the direct link between A and C might still carry informative weight because it connects the phenomenal role directly to the theoretical role without the mediation of B. However, if the merger implies that all three files have been collapsed into a single functional role where no distinct perspectives remain, then A equals C would be uninformative. In most real-world cases like the Water example, roles rarely fully collapse, so I predict A equals C retains some informativeness, though perhaps less than the original bridge identities, because it closes a transitive gap in the conceptual network.

  Second, is informativeness symmetric? Can a is b be informative while b is a is not? I think the repaired principle allows for asymmetry here, motivated by the direction of explanation. In the Water is H2O case, the statement feels informative because it explains the nature of water using the theory of chemistry. The reverse, H2O is Water, feels more like a classification or labeling of the chemical structure using the common term. If informativeness is tied to the reduction of uncertainty or the expansion of explanatory power, then the direction matters. If the file for a is the anchor of inquiry and the file for b is the explanatory target, then a is b is informative. If you reverse them, you might be stating a trivial classification. So for Lois, Clark Kent is Superman might be informative because it reveals the secret identity of the hero, whereas Superman is Clark Kent might feel less informative if the hero persona is the primary focus and the civilian identity is just a mask. The asymmetry arises because the cognitive roles are not just distinct but ordered in terms of which one is being explained by the other.
