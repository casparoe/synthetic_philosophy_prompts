      *   **Part 1: Preferences vs. Choice (The Econ vs. Phil Split):** Explain how behavioral econ treats hyperbolic discounting as a descriptive model of *choice* that *looks like* changing preferences, whereas philosophy treats akrasia as a normative failure.
