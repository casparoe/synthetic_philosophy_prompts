  # Triage Key for Thought Experiments

  **Instructions:** Start at Probe 1. Follow the path dictated by the answer. "Yes" indicates a failure of the case to function as evidence; "No" indicates the case survives that probe. Proceed to the next probe only if the case survives the current one.

  ### The Probes (Ordered by Cost)
  1.  **Stipulation Audit:** List the case's explicit supposes. Does any single stipulation merely assert the conclusion the case is meant to support?
  2.  **Possibility Test:** Ask what has to be false, incoherent, or unimaginable for the scenario to get off the ground. Does the verdict depend on that impossibility?
  3.  **Flip Test:** Invert the case's morally or theoretically salient surface features (names, imagery, order) while holding the structure fixed. Does the verdict track the surface?
  4.  **Fill-in Test:** Supply the causally or normatively relevant detail the description omits. Does the verdict survive the specification?
  5.  **Repetition Test:** Run the case many times over, or embed it in a sequence approaching an ordinary case. Is the verdict stable across iterations?

  ---

  ### Decision Tree

  **Node 1: Stipulation Audit**
  *   **Fail:** Go to Node 2.
  *   **Pass:** Go to Node 3.

  **Node 2: Stipulation Type**
  *   **Explicit Assertion:** → **Leaf 1**
  *   **Implicit Loading:** → **Leaf 2**

  **Node 3: Possibility Test**
  *   **Fail:** → **Leaf 3**
  *   **Pass:** Go to Node 4.

  **Node 4: Flip Test**
  *   **Fail:** Go to Node 5.
  *   **Pass:** Go to Node 6.

  **Node 5: Flip Type**
  *   **Surface/Verbal:** → **Leaf 4**
  *   **Deep/Structural:** → **Leaf 5**

  **Node 6: Stability Checks (Fill-in then Repetition)**
  *   **Fail Fill-in:** → **Leaf 6**
  *   **Pass Fill-in / Fail Repetition:** → **Leaf 7**
  *   **Pass Both / Narrow Scope:** → **Leaf 8**
  *   **Pass Both / General Scope:** → **Leaf 9**
  *   **Pass Both / Theory-Constative:** → **Leaf 10**

  ---

  ### Leaves: Dispositions and Illustrations

  **Leaf 1: Circular Stipulation**
  *   **Disposition:** Retire immediately, because the argument assumes what it attempts to prove.
  *   **Illustration:** A case defining a "murderer" as "one who kills unjustly" to prove that all murderers act unjustly.

  **Leaf 2: Loaded Description**
  *   **Disposition:** Repair by neutralizing emotive language, because the verdict relies on connotative framing rather than structure.
  *   **Illustration:** Describing a tax as "confiscation" versus "contribution" to sway verdicts on property rights.

  **Leaf 3: Metaphysical Dead End**
  *   **Disposition:** Retire, because the scenario requires a world too distant from ours to inform actual theory.
  *   **Illustration:** A scenario requiring a square circle to demonstrate a logical contradiction in ethics.

  **Leaf 4: Framing Artifact**
  *   **Disposition:** Repair by standardizing presentation, because the intuition is sensitive to irrelevant narrative ordering.
  *   **Illustration:** Judging a harm differently when described as a "side effect" versus a "means," despite identical causal structures.

  **Leaf 5: Structural Bias**
  *   **Disposition:** Replace with illustration only, because the intuition reflects a deep cognitive bias rather than a normative truth.
  *   **Illustration:** Rejecting a beneficial outcome solely because it involves "artificial" enhancement rather than natural ability.

  **Leaf 6: Underdescribed**
  *   **Disposition:** Repair by adding missing causal details, because the verdict hinges on unspecified background facts.
  *   **Illustration:** A contract case omitting whether the agents had equal bargaining power or information.

  **Leaf 7: Aggregation Sensitivity**
  *   **Disposition:** Replace with a model, because the intuition collapses when the case is scaled or repeated.
  *   **Illustration:** Judging a small harm negligible in isolation but intolerable when summed across a million victims.

  **Leaf 8: Context Bound**
  *   **Disposition:** Keep as evidence for limited domains, because the intuition holds only within specific institutional settings.
  *   **Illustration:** A cooperation dilemma that resolves differently in a market setting versus a family setting.

  **Leaf 9: Robust**
  *   **Disposition:** Keep as primary evidence, because the intuition survives all stress tests and applies generally.
  *   **Illustration:** A Gettier-style case where justified true belief fails to yield knowledge across varied descriptions.

  **Leaf 10: Theory-Constative**
  *   **Disposition:** Retire as evidence, because the case only works if one already accepts the theory it is meant to test.
  *   **Illustration:** A case about personal identity that yields different verdicts depending on whether one assumes psychological or bodily continuity.

  ---

  ### Structural Notes & Confidence

  **Indistinguishable Leaves:**
  *   **Leaf 8 (Context Bound) and Leaf 9 (Robust):** The probes cannot strictly separate these; the distinction relies on the user's judgment of the theory's intended scope. A case may be robust within a narrow theory but bound outside it.
  *   **Leaf 3 (Metaphysical Dead End) and Leaf 10 (Theory-Constative):** Both result in retirement, but for different reasons (impossibility vs. circularity). In practice, a scenario that is impossible often functions only for those who already accept the theory allowing the impossibility.

  **Unoccupied Combinations:**
  *   **Pass Fill-in / Fail Repetition / Pass Flip:** This combination is logically unlikely. If a case fails repetition (Leaf 7), it usually reveals an underdescription (Leaf 6) or a structural bias (Leaf 5) that a Flip Test would have caught earlier. This gap represents **incoherence** in the testing sequence.
  *   **Fail Possibility / Pass Stipulation:** A scenario can be impossible without begging the question (e.g., time travel). This region is **unoccupied** in my tree only because I routed all Possibility failures to one leaf; in reality, "Repairable Impossibility" (e.g., idealized physics) is a distinct category I collapsed to save nodes.

  **Confidence Ratings:**
  *   **Leaf 1, 2, 6, 7, 9:** High Confidence. These failure modes are distinct and the probes reliably identify them.
  *   **Leaf 3, 4:** Medium Confidence. Distinguishing "dead end" from "repairable" impossibility, or "surface" from "deep" framing, can be subjective.
  *   **Leaf 5, 8, 10:** Low Confidence. These rely heavily on the user's theoretical commitments.

  **Most Controversial Branch:**
  *   **Node 5 (Flip Test Fail → Leaf 5 Structural Bias):** A specialist would likely disagree here, arguing that "Deep/Structural" flip failures are not biases to be discarded but foundational intuitions that define the theory. Treating them as failures (Replace) rather than data (Repair/Keep) presupposes that the theory should be independent of human cognitive architecture, which is a contested methodological stance.
