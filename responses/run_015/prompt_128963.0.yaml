answer: |-
  Here is a repair of your "closure rule" that respects your gut verdicts, followed by the necessary cost of admitting them.

  ### The Principle: The Normative Deviation Account

  An omission $O$ (the failure to perform action $A$) is a cause of outcome $E$ if and only if:

  1.  **Counterfactual Dependence:** Had $A$ occurred, $E$ would not have occurred.
  2.  **Local Expectation:** There existed a specific, contextually active expectation (normative, functional, or contractual) attached to *this* agent or mechanism to perform $A$ at *this* time.
  3.  **Deviation from Course:** The failure to perform $A$ constituted a deviation from the expected functional course of the system, rather than the continuation of a background state.
  4.  **Direct Path:** The causal path from the omission to $E$ does not depend on a prior omission of a different protective system, unless that prior system was also under a Local Expectation.

  ***

  ### Why These Clauses Exist (Case Mapping)

  *   **Clause 1 (Counterfactual Dependence):** This is the baseline. It forces us to acknowledge that without the "but-for" test, we aren't talking about causation at all.
      *   *Forced by:* **Case 3.** Even if you had a duty (Local Expectation), if the plant was already dead (roots rotted), your watering wouldn't have changed the outcome. This clause kills the causation claim there.

  *   **Clause 2 (Local Expectation):** This is the heavy lifter. It distinguishes between "someone who *could* act" and "someone who *should* act." It restricts causation to agents embedded in a specific normative or functional web.
      *   *Forced by:* **Case 1 vs. Case 2 & Case 8.**
          *   In **Case 1**, the assistant has a job description. The expectation is local and specific.
          *   In **Case 2**, the passerby has capacity but no assignment. No Local Expectation.
          *   In **Case 8**, you have moral capacity, but no specific assignment to *that* child. The expectation is global/moral, not local/functional. This clause preserves your intuition that you didn't *cause* the death, even if you were blameworthy.

  *   **Clause 3 (Deviation from Course):** This handles the "background condition" problem. It distinguishes between a system failing to *do* something versus a system failing to *be* something.
      *   *Forced by:* **Case 5 vs. Case 6.**
          *   In **Case 5**, the guard's job is to lock the door. Not locking is a *deviation* from the script.
          *   In **Case 6**, the guard's job is to *stay*. Not leaving is *following* the script. It is the background state of the system functioning correctly. Therefore, it cannot be a causal omission of a duty; it is the performance of a duty.

  *   **Clause 4 (Direct Path):** This prevents infinite regress into structural absences.
      *   *Forced by:* **Case 7 (Fence) & Case 10.**
          *   In **Case 7 (Controller)**, the controller exists and fails to fire. That is a Direct Path failure.
          *   In **Case 7 (Fence)**, the fence never existed. If there was no plan/norm to build one, this is a structural absence, not a deviation.
          *   In **Case 10**, the company *should* have had a process (industry norm/Local Expectation). The absence of the process is a deviation from the expected design. This clause allows Case 10 to be a cause while keeping the "No Fence" case ambivalent (unless a fence was mandated).

  ***

  ### Verdicts on Three New Cases

  **Case A: The Universal Donor**
  You are the only person on earth with the blood type required to save a specific dying child. You know this. You do not donate. The child dies.
  *   **Verdict:** **Cause.**
  *   **Why:** This might surprise you given Case 8. In Case 8, you were *a* potential donor among millions. Here, uniqueness creates a **Local Expectation**. When capacity is unique, the "general moral obligation" collapses into a "specific functional assignment." You are no longer a passerby; you are the designated mechanism. The principle treats you like the Greenhouse Assistant.

  **Case B: The Seizure while Driving**
  You feel a seizure coming on while driving. You do not pull over. You crash and hurt a pedestrian.
  *   **Verdict:** **Cause.**
  *   **Why:** This clarifies **Case 9**. In Case 9 (self-harm), you have no expectation to save yourself (autonomy). In this case, holding a driver's license creates a **Local Expectation** of safety toward others. "Not pulling over" is a **Deviation from Course** of the licensed driver function. The principle distinguishes omissions harming self (not causes) from omissions harming others via assumed risk (causes).

  **Case C: The Relieved Guard**
  Guard A is assigned to lock the door at 6 PM. Guard B is assigned to check the lock at 6:05 PM. Guard A doesn't lock it. Guard B doesn't check it. A thief enters at 6:10 PM.
  *   **Verdict:** **Both caused it.**
  *   **Why:** Both had specific assignments (Local Expectation). Both deviated from their script. The thief's entry counterfactually depends on *both* failures (if A locked, B's check is moot; if B checked, A's failure is caught). This tests the overdetermination intuition.

  ***

  ### The Overturn: Which Verdict Must Go?

  I cannot accommodate **Case 4 (The 100 People)** as you described it.

  You wrote: *"If I scale it to a hundred people with the same assignment, all of whom forget, I suddenly want to say none of them caused it and it was just 'the group,' which on reflection seems insane. Maybe it isn't."*

  **I am telling you it is insane.** You must overturn the intuition that the causation vanishes at 100.

  **Why:**
  Causation is not a conserved quantity that gets diluted. If Person 1's watering would have saved the plants, Person 1 is a cause. If Person 100's watering would have saved the plants, Person 100 is a cause. The fact that 99 other people *also* failed does not metaphysically erase the causal power of the first person's failure.

  Your shifting intuition here is tracking **Blame**, not Causation.
  *   With 2 people, each is 50% to blame.
  *   With 100 people, each is 1% to blame.
  *   But 1% of a cause is still a cause.

  If you accept the **Normative Deviation Account**, the verdict is clear: if the assignment was "Each of you is responsible for watering" (individual sufficiency), then all 100 are causes. If the assignment was "You as a team must water" (collective requirement), then the *Team* is the cause, and individuals are not. But you specified "same assignment" as the 2-person case. If the 2-person case yields "both caused it," the assignment must be individually sufficient. Therefore, the 100-person case must yield "all caused it."

  **The Cost:**
  You have to accept that in the 100-person scenario, there are 100 distinct causes of the death. It feels "thinner" because the *responsibility* is thin, but the *causation* is robust.

  ### A Note on Case 8 (The Charity)

  You mentioned you'd rather have a principle that tells you you're wrong about Case 8 than one that gerrymanders a distinction.

  The **Normative Deviation Account** *does* gerrymander. It explicitly builds a wall between "Assigned Duty" (Case 1) and "General Capacity" (Case 8).

  If you want a principle that says Case 8 *is* a cause, you must adopt a pure Counterfactual Theory (Clause 1 only). But if you do that, you lose Case 2 (The Passerby). The Passerby and the Charity Donor are structurally identical regarding counterfactuals. If the Donor is a cause, the Passerby must be too.

  Since your gut says Passerby = No Cause, you are committed to the view that **causation by omission is not a metaphysical fact about the world, but a normative fact about our systems.** It relies on the "Local Expectation" clause. This means causation is partly a social construct. If you find that distasteful, you must abandon your verdict on Case 2. But if you hold Case 2, you must accept that Case 8 is not a cause, and the distinction is not gerrymandering—it's the definition of the phenomenon. Omissions aren't "nothingness"; they are failures of *expectations*. No expectation, no failure, no cause.
