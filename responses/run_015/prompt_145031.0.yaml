answer: |-
  This is a classic instantiation of **Pascal's Mugging** applied to **Population Ethics**. Your longtermist colleague is relying on a specific set of axioms that, when combined, produce the "dominance" result you find intuitive to reject. To block the inference without appealing to sentiment, you need to attack the axioms themselves.

  Here is the conceptual machinery you need to dismantle the argument, organized by the specific philosophical lever you can pull.

  ### 1. The Decision-Theoretic Lever: Bounded Utility
  The colleague's argument relies on **Expected Value (EV) Maximization** with an **Unbounded Utility Function**.
  *   **The Logic:** If $Utility$ can be infinite (or arbitrarily large), and $Probability > 0$, then $EV = P \times U$ is infinite (or arbitrarily large). Any finite cost is swamped.
  *   **The Objection:** Standard decision theory does not *require* unbounded utility. In fact, many decision theorists argue utility *must* be bounded to avoid Dutch Books and money pumps.
  *   **The Move:** Argue for a **Bounded Utility Function**. This posits that there is a limit to how much moral value can be added by additional welfare or additional lives. Even if the future is infinite, the *moral value* of that future converges to a finite cap.
  *   **Why it works:** If utility is bounded (say, at $U_{max}$), then $P \times U_{max}$ becomes a finite number. Once the number is finite, it can be meaningfully compared to the certain, finite utility of the mental health support. The "infinity" leverage is broken.

  ### 2. The Epistemic Lever: Robust Credence vs. Logical Possibility
  The colleague treats "nonzero chance" as a binary switch (0 vs. $>0$). In rigorous decision theory under deep uncertainty, this is insufficient.
  *   **The Logic:** Any logically possible scenario gets a nonzero credence.
  *   **The Objection:** We must distinguish between **logical possibility** and **epistemically robust probability**. The chain of causation required for the "policy chair" to actually secure an infinite positive future is contingent on thousands of speculative premises (e.g., humanity survives, the policy is implemented, the policy works as intended, the value trajectory is positive).
  *   **The Move:** Apply **Epistemic Discounting**. If the probability of the infinite outcome depends on a conjunction of $n$ uncertain premises, the credence should decay exponentially ($p^n$). If the value grows linearly or polynomially with time, but the epistemic uncertainty grows exponentially, the Expected Value collapses back toward zero.
  *   **Why it works:** It shifts the burden of proof. It's not enough to say "it's possible." They must show the probability is *robust* enough to outweigh the certainty of the present harm/benefit.

  ### 3. The Population Ethics Lever: Person-Affecting Views
  The colleague is implicitly assuming **Total Utilitarianism** (the value of a world is the sum of the welfare of all who ever live). This treats future people as "containers" of value to be filled.
  *   **The Logic:** More good lives = better world, regardless of who they are.
  *   **The Objection:** This runs into the **Non-Identity Problem**. The policy chair affects *who* comes into existence (by changing social structures, marriage markets, economic conditions, etc.). You cannot say the future people are "better off" because of the chair, because without the chair, *those specific people would not exist*.
  *   **The Move:** Adopt a **Person-Affecting Restriction** (or a Narrow Person-Affecting View). An action is only better if it makes *particular, identifiable* people better off.
  *   **Why it works:** The mental health support helps *existing, identifiable* students (de re). The policy chair helps *merely possible* people (de dicto). If you hold that we have stronger obligations to identifiable existing persons than to possible future persons, the "infinite sum" of future people doesn't enter the calculus in the same way. It blocks the aggregation of "possible people" to swamp "actual people."

  ### 4. The Aggregation Lever: Separability and Swamping
  Even if you accept Total Utilitarianism, there is a problem with how values are aggregated across time and space.
  *   **The Logic:** All value sums into one big pot.
  *   **The Objection:** This leads to the **Swamping Problem**. If distant future value always swamps present value, then *no* present action matters unless it affects the far future. This renders local ethics unintelligible.
  *   **The Move:** Argue for **Temporal Discounting** (not of welfare, but of *uncertainty*) or **Separability**. A principled view holds that the value of a local cluster of lives (the students) is not morally negligible just because there are *more* lives elsewhere.
  *   **Alternative:** **Critical-Level Utilitarianism**. This view holds that adding a life only adds value if the welfare is above a certain "critical" threshold. If the infinite future contains many lives barely worth living, they might not add positive value on this metric, blocking the "infinity" sum.

  ### 5. The Formal Decision Rule: Stochastic Dominance
  If you want to avoid assigning precise probabilities to infinite outcomes (which is arguably impossible), use **Stochastic Dominance**.
  *   **The Logic:** Choose the option that has a higher probability of achieving at least level $X$ of value, for all $X$.
  *   **The Objection:** We cannot establish that the "Policy Chair" stochastically dominates the "Mental Health" option.
  *   **The Move:** The Mental Health option has a near-100% probability of producing *some* positive value $V$. The Policy Chair has a high probability of producing $0$ value (policy fails, humanity goes extinct, etc.) and a tiny probability of producing $\infty$.
  *   **Why it works:** For any finite threshold of value $V$ (e.g., "alleviate 200 units of suffering"), the Mental Health option is *more likely* to achieve it than the Policy Chair. Therefore, under Stochastic Dominance, the Mental Health option is the rational choice, regardless of the infinite upside of the Chair.

  ### Summary for the Seminar
  To formalize the objection, tell your colleague their argument fails because it conflates **logical possibility** with **decision-relevant probability**, and it assumes **unbounded utility** in a context where **bounded utility** is required to avoid decision paralysis.

  **The strongest single move:**
  Combine **Bounded Utility** (there is a cap on moral value) with **Stochastic Dominance** (the certain option is more likely to achieve any finite moral good). This allows you to acknowledge the potential scale of the future without accepting that it automatically dominates present, certain obligations. It turns the puzzle from "Infinity vs. Finite" into "High Probability Finite vs. Low Probability Finite," which is a standard risk-assessment problem.
