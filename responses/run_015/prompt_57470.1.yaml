      *   *So, the Rival Rule:* **"Credit attaches to the first valid public entry in the scientific record."**
      *   *Friend's Rule:* **"Credit attaches to the first valid conception, provided the failure to publish was not the fault of the discoverer."** (Distinguishes passive drawer vs. active suppression).

  5.  **Determine the Deciding Case:**
      *   Need a case where publication is delayed, but not by malice, yet the discoverer *could* have published.
      *   *Scenario:* A researcher finds something, sits on it to refine the proof/make it perfect (no suppression, just perfectionism), meanwhile others find it.
      *   *Friend's likely vote:* No award to the perfectionist (fits 1930s drawer logic).
      *   *Rival Rule vote:* No award (fits "Effective Date").
      *   *Wait, I need a case that splits them.*
      *   *Split:* The Friend distinguishes between *passive* non-publication (1930s) and *active* suppression (Postdoc). The Rival Rule (Strict Publication) treats them the same.
      *   *Deciding Case:* A researcher is prevented from publishing by *bureaucracy* or *illness* (not malice, not choice).
      *   *Better Deciding Case:* **The "Lost in Transit" Case.** A paper is accepted, then lost by the journal/publisher for 5 years. Meanwhile, someone else publishes.
      *   *Friend:* Awards the first author (fault wasn't theirs, communication was attempted).
      *   *Rival:* Awards the second author (first entry in record was the second).
      *   *Actually, let's look at the "Wrong Derivation" case.* She gave credit to the *second* person. This implies *understanding* is a prerequisite for credit.
      *   *Let's refine the Rival Rule:* **"Credit requires valid public demonstration."**
      *   *Friend's Rule:* **"Credit requires valid conception plus non-culpable failure to communicate."**
      *   *Deciding Case:* **The "Preprint Server Glitch".** Author uploads to arXiv. Server error makes it invisible/unsearchable for 2 years. Others publish.
      *   *Friend:* Credits Author (tried to communicate).
      *   *Rival:* Credits Publishers (first *accessible* record).

  6.  **Evaluate the Rule (Right vs. Habit):**
      *   Is her rule right? It promotes justice and protects junior researchers (like the Technician and Postdoc). It discourages gatekeeping (Supervisor). However, it makes prizes about *forensic accounting of blame* rather than *scientific impact*. It turns the jury into a tribunal.
      *   It's a "moral" rule rather than a "functional" rule.
      *   Is it just habit? She seems consistent. It's likely a principled stance on the sociology of science (Merton vs. Bourdieu).
      *   *Verdict:* It's the *right* rule for *ethics*, but potentially the *wrong* rule for *prizes designed to highlight current utility*. But since it's a "discovery" prize, acknowledging the true origin is historically important.

  7.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Analytical, slightly conversational but rigorous.
      *   *Vocabulary:* Programme, centre, realise, honour, favour, whilst, amongst.
      *   *Structure:*
          1.  The Vote.
          2.  The Principle.
          3.  The Rival Principle.
          4.  The Deciding Case.
