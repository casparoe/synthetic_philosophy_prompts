      *(Self-Correction during drafting)*: Make sure I clearly distinguish why the 1930s case differs from the Postdoc case in her eyes.
      *   1930s: "Having it in a drawer isn't doing science." (Passive).
      *   Postdoc: Supervisor *sat on it*. (Active obstruction).
      *   Her rule must account for *agency*.
      *   Rival rule: "Publication is the only clock."

      *(Refining the Deciding Case)*: The "Lost Manuscript" vs "Suppressed Manuscript".
      *   Case: Researcher dies before publishing. Notebook found later. Same time as independent discovery.
      *   Friend: No award (fits 1930s).
      *   Rival: No award.
      *   That doesn't split them.
