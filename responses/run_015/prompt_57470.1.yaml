      *(Refining British English)*: Ensure spelling (honour, programme, centre, defence) and idioms (fall out, minuting, reckoned).

  8.  **Final Polish:** Check against all constraints.
      *   Vote prediction? Yes.
      *   Her Rule? Yes.
      *   Rival Rule? Yes.
      *   Deciding Case? Yes.
      *   Evaluation? Yes.
      *   British English? Yes.

      *(One last check on the "Wrong Derivation" case)*: She gave priority to the *second*. This is crucial. It means "Being first" is not enough. "Being right" is necessary.
      *   So her rule is: **Credit = Valid Understanding + (Publication OR Excusable Non-Publication).**
