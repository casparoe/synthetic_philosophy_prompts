answer: |-
  Here is my assessment of your friend's position, the principles at stake, and where the fault line truly lies.

  ### The Vote
  She will vote to award the prize to the **postdoc alone**.

  She will likely argue that the two later groups, whilst they did the work of validation, were merely walking a path that had already been cleared but was deliberately blocked. She will view the supervisor's suppression as a disqualifying ethical breach that severs his claim (had he tried to claim it) and excuses the postdoc's failure to publish. The fact that the postdoc is alive and contactable allows the jury to correct the record in a way the 1930s manuscript case did not.

  ### Her Rule: The "Culpable Obstruction" Principle
  The principle she is running is this: **Scientific priority belongs to the first person to achieve valid understanding, unless they are responsible for the failure to communicate it.**

  She distinguishes between *passive* silence and *active* suppression.
  *   In the **1930s manuscript** case, the silence was passive (the author chose not to publish or died). Her verdict ("having it in a drawer isn't doing science") establishes that science is a communicative act. If you don't speak, you don't count.
  *   In the **Postdoc** case, the silence is active (the supervisor gagged her). Here, the communicative act was *attempted* but thwarted by hierarchy.
  *   This aligns with her **Technician** verdict (credit for labour over hierarchy) and her **Wrong Derivation** verdict (credit for understanding over lucky publication). She is consistently prioritising *intellectual honesty and labour* over *procedural milestones*, provided the individual isn't at fault for the procedural gap.

  ### The Rival Rule: The "Public Record" Doctrine
  There is a competing rule that fits all six of her previous verdicts equally well but yields the opposite result on the new case. Let's call it the **Effective Date of Publication** rule.

  **The Rule:** Credit attaches strictly to the date a valid result enters the public domain.

  **How it fits the previous six:**
  1.  **Newton/Leibniz:** Both published, but the prize is withheld because the *inevitability* makes the specific date moot (or rather, the dispute is about priority, and if it's inevitable, priority is diluted).
  2.  **Darwin/Wallace:** Joint reading counts as simultaneous publication; she accepts this as the "right shape" because the public record was updated jointly.
  3.  **1930s Manuscript:** Never entered the public record; no credit.
  4.  **Technician:** The publication occurred; the citation adjusted the *attribution* within the public record, which is permissible even if the priority date doesn't change.
  5.  **Three Labs:** All published simultaneously; the prize is declined because the public record shows no unique priority, only resource disparity.
  6.  **Wrong Derivation:** The first publication was scientifically invalid (a false entry in the record); the clock started with the second, valid publication.

  **Where it diverges:**
  On the **Postdoc** case, the Public Record Doctrine says the postdoc gets nothing. It does not matter *why* the result wasn't published; if it wasn't in the archive, it didn't happen. The prize should go to the two later groups (split) or be withheld as a "simultaneous discovery" akin to the Three Labs case.

  ### The Deciding Case
  To settle which rule she is actually running, you need a case where publication is prevented by **systemic friction rather than malice**.

  **The Case:** A researcher submits a correct paper to a prestigious journal. It is stuck in peer review for four years due to bureaucratic incompetence and editor turnover (no malicious suppression, just chaos). During this time, another group independently discovers the result and publishes. The first paper is finally published a month later.

  *   **Under the "Culpable Obstruction" Principle:** The first researcher gets credit (or a share). They did everything right; the failure to communicate was not their fault.
  *   **Under the "Public Record" Doctrine:** The second group gets credit. The first result was not accessible to the community when it mattered.

  If she awards the first researcher here, she is running a moral rule about justice. If she awards the second, she is running a functional rule about the propagation of knowledge. My suspicion is she would abstain or award the second group, which would suggest her Postdoc vote is driven specifically by the *villain* in the story (the supervisor), rather than a broad principle of excusable delay.

  ### Is Her Rule Right?
  Her rule is **morally superior but administratively dangerous.**

  It is right in the sense that science is a human endeavour, not just a log of outputs. Protecting junior researchers from predatory seniority (the Technician and Postdoc cases) is vital for the health of the ecosystem. If prizes only reward those who successfully navigate the politics of publication, you incentivise gatekeeping.

  However, it is dangerous because it turns a prize jury into a court of law. To apply her rule, you must establish *intent* and *culpability*. In the Postdoc case, the suppression is clear. But in many grey areas—perfectionism, fear of criticism, strategic delay—it becomes impossible to judge why someone didn't publish. The "1930s Manuscript" verdict shows she knows this; she drew a hard line at the drawer to avoid psychoanalysing the dead.

  She is likely using a rule she has honed to protect the vulnerable in her own field, rather than a universal principle of bibliometrics. It is the right rule for a *human* institution, but it relies on the jury having better intelligence capabilities than a scientific body ought to possess. She is treating the prize as a mechanism of restorative justice, whereas the prize rules likely conceive of it as a marker of historical impact.

  In short: she is voting for the person, not the discovery. And whilst that is decent of her, it does make one wonder if she's judging the right thing.
