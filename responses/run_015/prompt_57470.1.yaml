          4.  Propose a *further case* that would distinguish between the rival rules.
          5.  Evaluate whether her rule is *right* or just *habitual*.
          6.  **Constraint:** Answer in *British English*.

  2.  **Analyze the Friend's Past Verdicts (The Data):**
      *   *Newton/Leibniz:* No award. Reason: Inevitability ("obviously coming"). Acknowledges notation difference and procedural corruption, but prioritises the idea that the discovery was imminent regardless of individuals.
      *   *Darwin/Wallace:* Joint reading was right, but criticises the "one name" constraint. Implies credit should reflect contribution, but structural limits of the prize are flawed. She accepts the historical solution (joint announcement) as "the right shape."
      *   *Unpublished 1930s Manuscript:* No retroactive credit. Reason: "Having it in a drawer isn't doing science." Context: Field already had the pieces. *Key:* Communication/Impact matters more than private insight.
      *   *PI vs. Technician:* Technician got on citation (dissent filed). Reason: Instrumental contribution recognised. *Key:* Actual labour/enabling work counts, even if hierarchy says otherwise.
      *   *Three Labs/Same Time:* No award. Reason: Enabled by technique, relied on resources (postdocs/machines) rather than unique insight. *Key:* Inevitability/Resources > Individual genius. If the path is cleared, the walker doesn't get the prize.
      *   *Wrong Derivation/Right Result:* Priority to the *second* person (who had the correct derivation). Reason: Understanding > Lucky guess. *Key:* Validity/Comprehension matters more than being first to print a flawed claim.

  3.  **Synthesize the Friend's Principle:**
      *   What ties these together?
      *   She rejects "first to write it down" if it wasn't communicated effectively (1930s manuscript).
      *   She rejects "first to print" if the understanding was flawed (Wrong Derivation).
      *   She rejects awards when the discovery was inevitable due to resources/timing (Three Labs, Newton/Leibniz).
      *   She supports credit for actual labour/contribution over hierarchy (Technician).
      *   She supports joint credit when contributions are distinct but essential (Darwin/Wallace - though she critiques the prize rules).
      *   *Core Philosophy:* Science is a communal, communicative enterprise. Priority belongs to those who *establish* the truth within the community, not just those who *conceive* it privately or accidentally. It's about *effective contribution to the corpus of knowledge*.
      *   *Specific nuance:* She seems to value *agency* and *overcoming obstruction* vs. *inevitability*.
      *   *Wait, look closer at the New Case:* Postdoc has it -> Supervisor suppresses it (active obstruction) -> Postdoc leaves -> 11 years later others find it (inevitability again?).
      *   *Conflict:* The "1930s Manuscript" case suggests "in a drawer isn't science." But here, the drawer was *forced* by misconduct/suppression. The "Three Labs" case suggests if it's inevitable (technique released), don't award. Here, the technique/knowledge existed 11 years prior but was buried.
      *   *Her likely vote:* She will likely vote for the **Postdoc**.
      *   *Why?* Because the "inevitability" in the Three Labs/Newton cases was natural progression. Here, the progression was *artificially halted* by human agency (the supervisor). The "drawer" in the 1930s case was passive; this drawer was active suppression. She values the *integrity* of the scientific record. Also, she fought for the Technician against the PI (hierarchy injustice). She will likely fight for the Postdoc against the Supervisor/Field.
      *   *The Rule:* "Credit follows effective communication *unless* communication is maliciously suppressed, in which case priority rests with the originator upon vindication." OR "Science is a conversation; you don't get credit for shouting into a void, unless someone put a gag on you."
      *   *Refined Rule:* **Priority requires public validation, except where the failure to publish is due to systemic or hierarchical malpractice rather than individual inaction.**

  4.  **Identify Alternative Rules (The Rivals):**
      *   *Rule A (Strict Mertonian Norm of Communism):* Science belongs to the community. If it isn't published, it doesn't count. (Fits 1930s, Newton/Leibniz, Three Labs). *Result on New Case:* No award to Postdoc. (Fits the "drawer" logic).
      *   *Rule B (First to Conceive):* Priority goes to the first mind to grasp the truth. (Fits Technician maybe? No. Fits Postdoc). *Result on New Case:* Award Postdoc. *But* this fails the "Wrong Derivation" case (she gave it to the second person). So strict "First to Conceive" is out.
      *   *Rule C (Impact/Utility):* Who actually changed the field? (Fits Three Labs - no one changed it uniquely. Fits 1930s - no impact. Fits New Case - The two later groups changed the field, not the postdoc). *Result on New Case:* Award the two later groups (or no one).
      *   *Rule D (The "Clean Hands" Doctrine):* You only get credit if your path to publication was ethically sound and scientifically robust. (Fits Wrong Derivation, Technician, Darwin/Wallace).
      *   *Comparison:* The friend's rule seems to be a hybrid of "Communication is key" + "Justice overrides procedure."
      *   *Alternative that fits all 6 but fails New Case:* **The "Effective Date of Publication" Rule.** Science only exists when published. Suppression is unfortunate, but the clock starts at publication. This fits the 1930s drawer (no pub = no credit). It fits Newton/Leibniz (pubs existed but inevitability diluted it). It fits Three Labs (pubs existed but too crowded). It fits Wrong Derivation (pub existed but flawed). It fits Technician (pub existed, credit adjusted).
      *   *Wait, does "Effective Date" fit the Technician?* Yes, if the citation counts as publication/credit.
