      *   *Principle:* The mechanism must not rely on accidental syntactic identity or fragile implementation details (like whitespace or variable names) that are not strategically essential. Cooperation must survive semantically equivalent transformations of the code.
  *   **Rule 3: Endogenous Guarantee (The "No External Crutches" Rule).**
      *   *Derived from:* (vi) PROVE (YES) vs. (v) Naive PROVE (NO) and the setup description.
      *   *Principle:* The guarantee of cooperation must arise from the logical interaction of the programs, not from external parameters fixed by the organizer (like a step budget $B$) that merely *permit* verification rather than *enforce* it logically.

