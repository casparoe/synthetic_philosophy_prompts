      *   *Claim 2:* "Equality of chance... is what makes the chamber democratic rather than merely competent." -> *Mistake:* Competence and democracy aren't opposites here. Democratic legitimacy in sortition often relies on *outcomes* and *process quality*, not just the initial draw.
      *   *Claim 3:* "Any channel through which some members come to be better informed than others reinstates... inequality of influence... so that a chamber with unequal information is to that extent not a lottery chamber at all." -> *Mistake:* This conflates *ex ante* equality (selection) with *ex post* equality (deliberation). Division of labor is necessary for function. Information asymmetry isn't necessarily power asymmetry if institutional checks exist.
