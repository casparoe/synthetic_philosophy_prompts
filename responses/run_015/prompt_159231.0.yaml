answer: |-
  Random selection serves multiple distinct masters. Primarily, it is an instrument of *political equality*, breaking the monopoly of elites on office and ensuring every citizen has an equal ex ante chance to rule. Second, it is an *epistemic device*, aggregating diverse lived experiences and distributed knowledge that elections typically filter out in favor of the articulate and wealthy. Third, it is a *liberating mechanism*, freeing representatives from the need to cultivate donors, parties, or future career prospects, thereby aligning their incentives with the common good rather than reelection. Consequently, it answers objections regarding corruption, unresponsiveness, and the homogenization of political perspectives, but it must also answer objections regarding competence, accountability, and the potential for internal oligarchy.

  ***

  **Claims in your proposal that rest on a mistake:**

  1.  **"As I understand the case for the lot, it is at bottom an equality case."**
      *   *Mistake:* This reduces sortition to a single value. While equality is central, the epistemic value (accessing diverse knowledge) and the liberty value (freedom from capture) are co-equal. Prioritizing equality of information above all else undermines the epistemic function.
  2.  **"Any channel through which some members come to be better informed than others reinstates... inequality of influence... so that a chamber with unequal information is to that extent not a lottery chamber at all."**
      *   *Mistake:* This conflates *equality of status* (one person, one vote) with *uniformity of input*. Influence is determined by voting power and agenda control, not merely by information possession. Information asymmetry becomes power asymmetry only if institutional checks (like reporting requirements) are absent.
  3.  **"Since no member can ever stand for anything again, the chamber faces no incentive distortions worth designing around."**
      *   *Mistake:* This assumes career ambition is the only source of distortion. Members still have incentives related to ideology, legacy, social pressure, post-service employment, or simple cognitive laziness (free-riding on others' work).
  4.  **"The egalitarian logic of sortition commits us to this strong, information-equalizing version."**
      *   *Mistake:* Egalitarian logic commits us to equal *weight* of voice and equal *opportunity* to serve, not equal *cognitive load*. Functional differentiation is compatible with political equality if the division of labor is accountable to the whole.

  ***

  **Response**

  You are not right that the egalitarian logic of sortition commits you to the strong, information-equalizing version you propose. While your intuition that information asymmetry can breed oligarchy is correct, your remedy confuses the conditions of *selection* with the conditions of *deliberation*.

  The core error lies in your conception of political equality. In a democratic assembly, equality is secured when every member possesses an equal vote and an equal right to speak, not when every member possesses an identical mental state. By mandating that all 200 members receive exactly the same briefings and hear exactly the same testimony, you are not ensuring equality; you are enforcing ignorance. Collective decision-making relies on the division of cognitive labor. If every member must process every piece of information personally to maintain "purity," the chamber cannot handle the complexity of modern governance. They will either become overwhelmed, rely on informal and unrecorded whispers to make sense of the formal data, or defer blindly to the few who naturally grasp the material faster. Paradoxically, your strict uniformity creates the very inequality of influence you seek to avoid: it empowers the naturally articulate or intellectually privileged members who can synthesize the uniform data faster, while disempowering those who need specialized support to understand it.

  There is a principled stopping point short of your hard rule. The line should be drawn not at *information equality*, but at *transparency and accountability*. The danger of private briefings is not that Member A knows something Member B does not; the danger is that Member A knows something *the chamber* does not, and uses it to steer votes without scrutiny.

  Therefore, you should allow individual briefings and committee-specific expert hearings, provided two conditions are met. First, **recordability**: all briefings, written or oral, must be recorded and archived in a central repository accessible to every member. Second, **reportability**: members who specialize (e.g., in a committee) must present summarized findings to the plenary, subject to questioning. This preserves the epistemic benefit of specialization—allowing some members to dive deep into budgetary technicalities while others focus on healthcare—without creating a class of information gatekeepers.

  Regarding your assumption about incentives: the lack of re-election does not eliminate the need for institutional guardrails. Without the discipline of parties or the ambition for higher office, members may still drift toward capture by external lobbyists who offer social validation or future employment, or toward internal capture by a charismatic faction that controls the briefing office. Your design gives the briefing office immense power as the sole information gatekeeper. If that office is truly non-partisan, you rely on hope; if it is not, you have created an unelected bureaucracy that rules the chamber. A better design allows members to commission their own expert analysis, competing with the central office, ensuring that no single source controls the epistemic environment.

  In sum, the logic of sortition requires equality of *power*, not equality of *knowledge*. To achieve the former, you must permit the latter to vary, provided the variation is transparent and accountable to the whole. Your proposed rules would likely produce a chamber that is equally ignorant, rather than equally empowered.
