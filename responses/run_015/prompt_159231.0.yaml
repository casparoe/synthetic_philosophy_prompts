      *   *Epistemology of Collective Decision-Making:* Groups decide well when they aggregate diverse information. Forced uniformity of information reduces diversity of perspective.
      *   *Institutional Design:* Committees exist for a reason. 200 people cannot hear all experts in plenary efficiently. Specialization allows deeper scrutiny.
      *   *Power Dynamics:* Information asymmetry *can* lead to domination. But strict uniformity leads to ignorance or reliance on informal networks (whisper campaigns). Formalizing asymmetry (committees) with reporting duties is better than banning asymmetry.
