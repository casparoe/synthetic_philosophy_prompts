answer: |-
  Imagine a void containing only two perfect spheres, suspended precisely two metres apart, sharing identical mass, charge, and internal lattice structures, symmetrically poised in an eternal static present. To this sterile symmetry, I append a single, invisible distinction: the sphere on the left bears an internal 'narrative index', a metaphysical marker designating it as the primary subject of existence, whereas the sphere on the right carries a secondary index, marking it as the derivative counterpart. This distinction is not spatial, for it does not alter their separation; it is not temporal, for no history precedes them; it is not causal, as no force emanates from the index; and it is not empirically detectable, yielding no measurement variance. It is purely a metaphysical mark of individuality, a silent testament to an ontological ordering that exists independently of physical qualities or relational positions.

  I maintain that this scenario successfully rejects Leibniz's Principle of the Identity of Indiscernibles by isolating a real non-qualitative difference. On this view, the left sphere is not merely 'sphere A' by convention, but possesses a primitive thisness—a haecceity—that is intrinsic yet devoid of qualitative content. It is not 'heavier' or 'older' or 'more central'; it simply *is* the primary entity in a way that the secondary sphere is not, despite their qualitative mirroring. The structural element doing the philosophical work here is the decoupling of individuality from quality; by stipulating that the narrative index is a brute fact of identity rather than a describable property, we allow for numerical distinctness without qualitative divergence. The spheres are thus truly distinct objects, not because of what they are like, but because of who they are in the ontology of this universe.

  A defender of Leibniz would inevitably attack this scenario by arguing that the narrative index collapses into a disguised relational property or a qualitative difference. They would contend that 'being primary' is merely a relation to an observer or a logical framework, and since the universe is empty of observers, the property must supervene on qualitative facts; if the spheres are qualitatively identical, their modal and narrative profiles must be too. They would claim I am merely naming the spheres differently without grounding that difference in reality. However, this objection begs the question by assuming that all facts must be qualitative or relational. By insisting that the narrative index is a fundamental, non-qualitative constituent of the object itself, I demonstrate that reality can harbour distinct individuals that differ only in their primitive thisness, thereby proving that indiscernibles need not be identical.
