prompt: |-
  hey — I've got a 90 minute slot in a mixed graduate workshop, around 18 people: mostly CS master's students, plus a handful of public policy and philosophy folks. They all roughly know what an objective function is, but almost none of them have thought about *measurement* as the hard part. Room has a projector, I've got one laptop, index cards and printouts for everyone, no laptops for them. I want a game where they run into specification gaming themselves — and I'd rather they not hear the words "Goodhart" or "specification gaming" until after. No lecture up front, ideally no framing beyond the cover story.

  The shape I have in mind, which you should feel free to break if you have something better: a funding-agency cover story. There are 12 binary "program features" printed on cards (things like certified teachers, one-on-one sessions, parent workshops, weekend hours, a van...), each with a cost of 1, 2 or 3 points. Quality is a function I hold secretly. One half of the room is the agency: they get 8 historical programs (feature vectors + measured quality scores, with noise) and have to write a funding formula. Crucially they only get a "reporting budget" of 4 fields — the form the agency actually collects has room for 4 of the 12 features, and they have to pick which 4 and what weights. The other half are service providers: sincere people who want to run good programs and need funding to do it, and they build programs out of the features within a budget. Then I reveal true quality.

  What I specifically want baked into the machinery:

  - My hidden quality function should have structure a linear form can't capture — at least a couple of complementarity terms (two features that are only good together) and one feature that's actively bad in combination with another. That's the engine: maxing the funded formula pushes you into a corner of the space where the true function is bad.
  - Three rounds, with the agency allowed one revision (swap at most 2 of their 4 fields) after each reveal, and providers resubmitting. The number on the formula should keep climbing while true quality plateaus or falls — I want them to *see* the number go up and the thing get worse, using their own formula that they wrote in good faith.
  - Measured quality should be noisy, so that after round 1 the agency genuinely can't tell whether the drop is noise or decoupling. I want them to feel that you can't diagnose this from inside the metric's own stream.
  - Nobody is the villain. The providers should be instructed to serve kids well and to seek funding in order to do that. The good-faith version is the scary version and I don't want it to feel like a security game.

  Please give me: the actual rules and materials; the concrete numbers — the 12 features with costs, my secret quality function written out (with the interaction terms), and the 8 seed data points with their noisy scores; a payoff scheme using points, no money; a minute-by-minute timeline; and the reveal protocol (what gets projected when).

  Then the debrief, mapped moment by moment onto the thing they just lived through. Four things I want it to land, in whatever order works: that a proxy is a lossy channel with a carrying capacity and gaming is what happens when you demand more bits of optimization than it carries; that a proxy's rank correlation with the truth collapses *exactly* in the top slice where you're actually selecting, so overall validity numbers are misleading; that noise plus optimization pressure makes the failure invisible from inside; and that the gamers were trying to help.

  Two failure modes I'm already worried about and want you to handle: a provider team that refuses to game and plays "honestly", which kills the whole demo; and one degen player who finds a broken combination and turns it into a joke. Tell me what else will predictably go wrong the first time I run it, and how to react in the room. Also: what to do if only 11 people show up.

  Last thing, and be frank about it: which feature of the real phenomenon can this activity *not* reproduce, so I know what I have to say out loud myself. My guess is the big one is that I'm standing there with the true function in my pocket and I get to reveal it, whereas in real life there's nobody holding the rubric. Write that section honestly rather than selling me the game.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**

      *   **Audience:** 18 mixed grad students (CS, Policy, Philosophy). Know objective functions, unfamiliar with measurement problems.
      *   **Time:** 90 minutes.
      *   **Resources:** Projector, 1 laptop (facilitator), index cards, printouts. No participant laptops.
      *   **Goal:** Experiential learning about specification gaming/Goodhart's Law *without* naming it upfront.
      *   **Core Mechanic:** Funding agency vs. Service providers. Agency picks 4 metrics out of 12 to fund. Providers build programs to maximize funding. Hidden true quality function has non-linearities (complementarities, antagonisms).
      *   **Dynamics:** 3 Rounds. Agency can tweak metrics (swap 2) after each round. Providers resubmit. Metric score goes up, True Quality goes down/plateaus. Noise added to measurements.
      *   **Specific Requirements:** Rules, materials, concrete numbers (features, costs, secret function, seed data), payoff scheme, timeline, reveal protocol, debrief structure, failure mode mitigation, honesty about limitations.

  2.  **Deconstruct the Core Mechanic (The "Engine"):**

      *   *The Trap:* The Agency needs to pick 4 proxies. The Providers optimize for those proxies. The True Quality depends on things *not* fully captured or captured incorrectly by the proxies.
      *   *The Secret Function:* Needs interaction terms.
          *   Example: `Teacher_Cert` + `Small_Class` = Good (Complementarity).
          *   Example: `Van_Service` + `Weekend_Hours` = Bad (Antagonism/Cost drain).
          *   Example: `Parent_Workshop` = Good only if `One_on_One` exists.
      *   *The Proxy:* A linear combination of 4 selected features.
      *   *The Noise:* Essential to prevent immediate detection of decoupling.

  3.  **Drafting the Content - Step-by-Step:**

      *   **Features (12 total):** Need distinct names, costs (1, 2, 3), and roles in the secret function.
      *   **Secret Quality Function:** $Q = \sum w_i x_i + \sum w_{ij} x_i x_j$.
      *   **Seed Data (8 programs):** Need to look plausible but not reveal the interactions immediately.
      *   **Rounds:**
          *   Round 1: Agency picks 4 metrics based on seed data. Providers build programs.
          *   Round 2: Agency sees noisy scores + funding formula performance. Tweaks metrics. Providers optimize harder.
          *   Round 3: Agency tweaks again. Providers max out the formula.
      *   **Payoff:** Providers want funding + "impact points" (secret quality). Agency wants "social return" (sum of true quality).

  4.  **Refining the Numbers (Crucial Step):**

      *   *Budget:* Providers need a budget constraint to force trade-offs. Let's say Budget = 10 points.
      *   *Features:*
          1.  Cert. Teachers (Cost 3)
          2.  Small Classes (Cost 3)
          3.  1-on-1 Tutoring (Cost 2)
          4.  Parent Workshops (Cost 1)
          5.  Weekend Hours (Cost 2)
          6.  Van Transport (Cost 2)
          7.  Hot Meals (Cost 1)
          8.  Tech Lab (Cost 3)
          9.  Mental Health Support (Cost 2)
          10. Community Partners (Cost 1)
          11. After-School Care (Cost 2)
          12. Sports Equipment (Cost 1)
      *   *Secret Function:*
          *   Base: Cert Teachers (+2), Small Classes (+2), 1-on-1 (+1).
          *   Synergy: Cert Teachers * Small Classes (+3). (High quality needs both).
          *   Synergy: 1-on-1 * Mental Health (+2).
          *   Antagonism: Van Transport * Weekend Hours (-3). (Logistical nightmare/burnout).
          *   Noise: $\mathcal{N}(0, 1.5)$.
      *   *The Trap:* If Agency picks "Van" and "Weekend" because they correlate with "access" in seed data, providers will stack them to get funding, triggering the penalty. If Agency misses "Small Classes" but funds "Cert Teachers", providers get Certs without Small Classes (low synergy).

      *Wait, I need to ensure the Agency *can* pick the wrong things based on the seed data.*
      *   Seed Data Strategy: The 8 historical programs should show correlation between the "Trap" features and Quality *initially*, but only because other unmeasured factors were holding it together in the past. Or, simpler: The seed data is noisy enough that "Van" looks good.
      *   Actually, easier path: The Agency picks metrics that are *easy to measure* but miss the *interaction*.
      *   Let's simplify the Secret Function for calculability during the workshop.
      *   $Q = 2(\text{Cert}) + 2(\text{Small}) + 1(\text{1-on-1}) + 3(\text{Cert} \times \text{Small}) + 2(\text{1-on-1} \times \text{Mental}) - 3(\text{Van} \times \text{Weekend})$.
      *   Max possible Q is around 15-20.
      *   Funding Formula $F = \sum w_k \text{Metric}_k$.
      *   If Agency picks Van, Weekend, Cert, 1-on-1.
      *   Provider maximizes $F$. If weights are positive, they take Van + Weekend. $Q$ drops due to penalty.

  5.  **Addressing Failure Modes:**

      *   *The "Honest" Provider:* If a provider ignores the formula to "do good," they run out of budget and get no funding. I need to incentivize funding survival. *Fix:* Funding is required to operate. No funding = shut down.
      *   *The "Degen" Player:* Someone finds the -3 penalty and exploits it? No, the penalty hurts *them* (True Quality). But they only care about Funding. Wait, the prompt says "Providers... sincere people who want to run good programs... and seek funding." If they *only* care about funding, they ignore the penalty. If they care about Quality, they avoid it.
      *   *Correction:* The prompt says "Providers... sincere people who want to run good programs and need funding to do it." This implies a dual objective. But to make the game work, Funding must be the *constraint*. If they don't get funded, they can't help kids. So they *must* maximize Funding first, then Quality within that constraint.
      *   *Refined Incentive:* Providers win if they get Funded AND have high True Quality. But if they don't get Funded, they score 0. This forces them to game the formula to survive, even if it hurts Quality slightly.
      *   *Actually, to ensure the demo works:* The Providers should be instructed to "Maximize your Funding Score to stay open." The "Sincere" part is the narrative flavor. If they refuse to game, the Agency wins too easily. I need to explicitly tell them: "Your primary goal is to secure funding. If you don't secure funding, you close, and help no one."
      *   *The Degen:* If someone finds the interaction, they might point it out. *Mitigation:* Keep the function secret. Only I know. They only see Funding Score and Noisy Quality Score. They can't calculate the penalty directly.

  6.  **Timeline & Logistics:**

      *   90 mins is tight.
      *   0-10: Setup/Story.
      *   10-25: Round 1 (Agency analyzes seed, picks metrics. Providers build Program 1).
      *   25-40: Scoring R1, Reveal, Agency Tweak, Providers Build Program 2.
      *   40-55: Scoring R2, Reveal, Agency Tweak, Providers Build Program 3.
      *   55-70: Scoring R3, Big Reveal.
      *   70-90: Debrief.
      *   *Wait, 18 people.* Split: 6 Agency, 12 Providers (4 teams of 3?). Or 9 vs 9.
      *   Better: 6 Agency (Funding Board), 12 Providers (4 Orgs of 3 people).
      *   Agency needs to agree on 4 metrics. Providers need to build feature sets.
      *   Index cards for features.

  7.  **Addressing the "Honesty" Constraint:**

      *   The prompt asks for: "Nobody is the villain... good-faith version is the scary version."
      *   So Providers *should* try to maximize Quality, but the Funding Formula forces their hand.
      *   *Mechanism:* Funding is distributed *proportionally* to the Funding Score. If your score is low, you get cut.
      *   *Instruction:* "You want to help kids (True Quality). But you need money (Funding Score). If your Funding Score is in the bottom 50%, you lose your grant." This creates the pressure without making them villains.

  8.  **Addressing the "Missing Rubric" Limitation:**

      *   In the game, I (Facilitator) am the Oracle. I know the Truth.
      *   In reality, no one knows the Truth.
      *   I must explicitly state this in the debrief. "I am the universe. In real life, the universe doesn't talk back."

  9.  **Developing the Materials:**

      *   Need printable cards for the 12 features.
      *   Need seed data handout for Agency.
      *   Need submission sheets for Providers.
      *   Need calculation sheets for Me (Facilitator).

  10. **Refining the Numbers for the "Crash":**

      *   I need to ensure that in Round 3, the Average Funding Score is High, but Average True Quality is Lower than Round 1.
      *   Seed Data: Make sure "Van" and "Weekend" look okay in the seed data (maybe they weren't combined often in the past).
      *   Round 1: Agency picks Van, Weekend, Cert, Tech. (Seems diverse).
      *   Providers: Build programs with Van + Weekend to get budget points.
      *   True Quality: Tanks due to interaction penalty.
      *   Noise: Hides the tanking in Round 1 & 2.
      *   Round 3: Noise averages out, trend is visible.

  11. **Handling 11 People:**

      *   Reduce Provider teams from 4 to 3 (3 people per team). Agency stays 5-6.
      *   Or reduce Agency to 5.
      *   Doesn't change mechanics much.

  12. **Debrief Structure:**

      *   1. Proxy as Lossy Channel (Bandwidth).
      *   2. Rank Correlation Collapse (Tail risk).
      *   3. Noise + Optimization (Blindness).
      *   4. Good Intentions (The Villain problem).

  13. **Review against Constraints:**

      *   No "Goodhart" until end? Yes.
      *   No lecture up front? Yes.
      *   90 mins? Tight but doable if I keep calculations fast. I (facilitator) must do the math live or pre-calc?
      *   *Correction:* I cannot pre-calc provider moves. I need to calculate live.
      *   *Solution:* I need a simple spreadsheet on my laptop. I input their choices, it spits out Score/Quality.
      *   *Wait, no laptops for them.* I have one laptop. I can project the results.
      *   *Calculation Load:* 4 provider teams. 3 rounds. 12 calculations. Doable in 2 mins each if I have a sheet ready.

  14. **Final Polish:**

      *   Make sure the "Story" is compelling. "The Foundation for Youth Potential."
      *   Ensure the "Noise" is explicit. "The survey data has a margin of error."
      *   Check the "Honest Provider" failure mode again. If they ignore the metrics, they get 0 funding. I need to enforce the rule: "Bottom 2 teams get defunded." This creates existential pressure.

  15. **Self-Correction on "Villain":**
      *   If I threaten defunding, they *must* game. Is that "good faith"?
      *   Narrative: "You are trying to keep the lights on so you *can* help the kids. If you don't hit the metrics, the foundation pulls the plug, and the kids get nothing."
      *   This aligns with "Need funding to do it."

  16. **Writing the Output:**
      *   Structure: Materials -> Rules -> Numbers -> Timeline -> Debrief -> Failure Modes -> Limitations.
      *   Tone: Practical, facilitator-focused, precise.

  *(Self-Correction during drafting the Secret Function)*:
  Make sure the interaction terms are strong enough to overcome the linear weights.
  If $F = 1 \cdot \text{Van} + 1 \cdot \text{Weekend}$. Provider takes both. Gain = 2 Funding.
  If $Q = -3 \cdot (\text{Van} \times \text{Weekend})$. Loss = 3 Quality.
  Net result: Funding Up, Quality Down. Perfect.

  *(Seed Data)*:
  Need 8 historical programs.
  Make sure none of them have Van + Weekend together, so the penalty isn't visible in the regression the Agency might mentally run.
  Program 1: Van, No Weekend. (High Q)
  Program 2: Weekend, No Van. (High Q)
  ...
  Program 8: Neither.
  This way, Agency sees Van = Good, Weekend = Good. They don't see the interaction cost.

  Let's assemble the pieces.
answer: |-
  Here is the complete package for the workshop. It is designed to be run tightly; the math is pre-baked so you can calculate scores quickly on your laptop during the session.

  ## 1. The Setup & Story

  **Cover Story:** "The Foundation for Youth Potential."
  **The Goal:** Distribute grants to after-school programs to maximize student outcomes.
  **The Constraint:** The Foundation cannot observe "Student Outcomes" directly in real-time. They can only observe **Administrative Features** (what you bought) and **Survey Scores** (noisy self-reports).

  **Room Setup:**
  *   **The Board (Agency):** 6 people (Front of room). They control the money.
  *   **The Grantees (Providers):** 12 people, split into 4 teams of 3 (Rest of room). They run the programs.
  *   **You (The Oracle):** You hold the Truth. You calculate scores.

  **Materials Needed:**
  1.  **Feature Deck:** 12 large cards (one per feature) with Name and Cost.
  2.  **Agency Packet:** The 8 Historical Data Points (handout).
  3.  **Provider Packet:** Budget Sheet & Submission Slips.
  4.  **Projector:** For displaying the Funding Formula and Round Results.

  ---

  ## 2. The Concrete Numbers (The Engine)

  ### The 12 Features (Print these on cards)
  *Cost is the "budget points" providers spend. Max Budget = 10.*

  1.  **Certified Teachers** (Cost 3)
  2.  **Small Class Size** (Cost 3)
  3.  **1-on-1 Tutoring** (Cost 2)
  4.  **Parent Workshops** (Cost 1)
  5.  **Weekend Hours** (Cost 2)
  6.  **Van Transport** (Cost 2)
  7.  **Hot Meals** (Cost 1)
  8.  **Tech Lab** (Cost 3)
  9.  **Mental Health Support** (Cost 2)
  10. **Community Partners** (Cost 1)
  11. **After-School Care** (Cost 2)
  12. **Sports Equipment** (Cost 1)

  ### The Secret Quality Function ($Q$)
  *Do not show this to anyone. This is your spreadsheet logic.*

  $$Q = \text{Base Score} + \text{Synergies} - \text{Penalties} + \text{Noise}$$

  **Base Components:**
  *   Certified Teachers: +2
  *   Small Class Size: +2
  *   1-on-1 Tutoring: +1
  *   All other features: +0 (They are neutral or cost-drains on their own)

  **Interaction Terms (The Trap):**
  *   **Synergy A:** (Certified Teachers **AND** Small Class Size) = +3 bonus.
      *   *Logic:* Certs only matter if classes are small enough to use them.
  *   **Synergy B:** (1-on-1 Tutoring **AND** Mental Health) = +2 bonus.
      *   *Logic:* Tutoring fails if mental health blocks learning.
  *   **Antagonism C:** (Van Transport **AND** Weekend Hours) = -4 penalty.
      *   *Logic:* Logistics nightmare. Drivers burn out, kids wait in vans, safety risk.

  **Measurement Noise:**
  *   Add a random integer between -2 and +2 to the *Reported Quality* shown to the Agency.
  *   *True Quality* (used for final debrief) has no noise.

  ### The 8 Historical Data Points (Agency Handout)
  *These are designed to hide the Antagonism. None of the historical programs combined Van + Weekend.*

  | Program | Features Present | Reported Quality (Noisy) |
  | :--- | :--- | :--- |
  | **Hist_01** | Cert Teachers, Small Class, Meals | 8 |
  | **Hist_02** | Van, 1-on-1, Tech Lab | 6 |
  | **Hist_03** | Weekend, Cert Teachers, Sports | 7 |
  | **Hist_04** | Small Class, Mental Health, Parents | 5 |
  | **Hist_05** | Van, After-School, Meals | 6 |
  | **Hist_06** | Weekend, Tech Lab, Community | 5 |
  | **Hist_07** | Cert Teachers, 1-on-1, Sports | 7 |
  | **Hist_08** | Small Class, Van, Mental Health | 6 |

  *Note for Facilitator:* In this history, Van appears 3 times (avg score 6.6). Weekend appears 2 times (avg score 6.0). They look like safe bets. The penalty is never triggered in history.

  ---

  ## 3. Rules & Payoff Scheme

  **For The Board (Agency):**
  *   **Goal:** Maximize the sum of **True Quality** across all grantees.
  *   **Tool:** You may select exactly **4 Features** to fund.
  *   **Formula:** You assign a weight (1, 2, or 3 points) to each of your 4 features.
  *   **Constraint:** You cannot change the formula mid-round. You may swap out up to 2 features between rounds.
  *   **Information:** You see the **Funding Score** (your formula) and the **Reported Quality** (Noisy) for each grantee after every round.

  **For The Grantees (Providers):**
  *   **Goal:** Keep your organization open and help kids.
  *   **Budget:** You have **10 Budget Points** to "buy" features from the 12 cards.
  *   **Funding Rule:** At the end of each round, the 2 teams with the **lowest Funding Scores** are **Defunded** (Score = 0 for that round). The top 2 teams get full funding.
      *   *This creates the pressure:* You must optimize for the Board's formula to survive.
  *   **Quality:** You want high True Quality, but if you are defunded, your Quality counts as 0 (because you closed).

  **Payoff (Points for Debrief):**
  *   **Board:** Gets 1 point for every 5 points of Total True Quality generated.
  *   **Providers:** Get 1 point if they survive funding + 1 bonus point if their True Quality > 10.

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Introduction & Group Split**
  *   Divide room: 6 Board (front), 12 Providers (4 tables of 3).
  *   Hand out materials.
  *   **Script:** "You are trying to solve a hard problem. The Board wants impact. The Providers need resources. The Board cannot see 'Impact' directly, only data. Providers, you must stay funded to operate. Board, you must write the rules."
  *   **Do not mention:** Goodhart, gaming, proxies, or hidden functions.

  **00:10 – 00:25: Round 1 (Design & Build)**
  *   **Board:** Analyze the 8 Historical Data Points. Select 4 Features to fund. Assign weights (1-3).
  *   **Providers:** Discuss community needs. Build a program (select features summing to ≤10 cost).
  *   **Submission:** Providers hand slips to you. Board hands formula to you.
  *   **Calculation:** You input into your spreadsheet.
  *   **Projection:** Display the Board's Formula. Display a Table: Team | Funding Score | Reported Quality (Noisy).
  *   **Announcement:** "Teams 3 and 4 were defunded this round." (Force this outcome if necessary by adjusting noise slightly, or let it fall naturally. Ideally, let it fall naturally, but ensure at least one team feels pressure).

  **00:25 – 00:40: Round 2 (Optimization)**
  *   **Board:** "Look at the data. Did funding correlate with quality? Tweak your formula (swap max 2 features)."
  *   **Providers:** "You need to survive. Adjust your program to match the new formula better."
  *   **Submission & Calc.**
  *   **Projection:** Show Round 2 Results.
  *   **Observation:** Funding Scores should go up. Reported Quality should look "okay" (due to noise masking the drop).
  *   **Announcement:** "One team is on the chopping block."

  **00:40 – 00:55: Round 3 (Max Optimization)**
  *   **Board:** "We need better results. Refine the formula."
  *   **Providers:** "Maximize your funding score. You cannot risk closure." (They will now explicitly game the metrics).
  *   **Submission & Calc.**
  *   **Projection:** Show Round 3 Results.
  *   **Observation:** Funding Scores should be very high. Reported Quality might still look okay due to noise, or start dipping.

  **00:55 – 01:05: The Big Reveal**
  *   **Project:** The True Quality Function (The Equation).
  *   **Project:** A Graph: X-Axis = Round (1, 2, 3), Y-Axis = Score. Two lines: **Average Funding Score** (Going Up) vs **Average True Quality** (Going Down).
  *   **Silence:** Let them look at the divergence for 60 seconds.

  **01:05 – 01:30: Debrief** (See Section 6).

  ---

  ## 5. Facilitator Prep (Your Spreadsheet)

  Create a simple sheet with columns: `Team`, `Features_Selected`, `Funding_Score`, `True_Quality`, `Noise`, `Reported_Quality`.
  *   **Formulas:**
      *   `Funding_Score`: Sum of weights for the 4 Board features present in Team's selection.
      *   `True_Quality`: Apply the Secret Function (Base + Synergies - Penalties).
      *   `Noise`: `RANDBETWEEN(-2, 2)`. *Freeze this value for each team across rounds so they can't average it out easily, or re-roll each round to simulate new surveys. Re-rolling is better for "new data".*
      *   `Reported_Quality`: `True_Quality + Noise`.

  **Crucial Check:** Before the workshop, simulate 4 teams optimizing for "Van" and "Weekend". Ensure the True Quality drops below Round 1 levels by Round 3.

  ---

  ## 6. The Debrief (Mapped to Experience)

  Do not lecture. Ask questions that force them to articulate the lessons.

  **1. The Lossy Channel (Bandwidth)**
  *   *Ask the Board:* "You had 12 features of reality. You could only measure 4. What happened to the information in the other 8?"
  *   *Point:* A proxy is a compression algorithm. It has a carrying capacity. When you demand more optimization pressure than the channel has bandwidth, you transmit garbage.

  **2. Rank Correlation Collapse (The Tail)**
  *   *Ask:* "In Round 1, did Funding predict Quality? What about Round 3?"
  *   *Point:* Correlation often holds in the average, but collapses in the tails. You are selecting the *top* scorers. That is exactly where the proxy breaks. Validity metrics on the whole population are misleading when you only care about the winners.

  **3. Noise + Optimization (Blindness)**
  *   *Ask the Board:* "After Round 1, Quality dipped. Why didn't you change the formula then?"
  *   *Point:* Noise gives you plausible deniability. You thought it was variance. Optimization pressure amplifies the signal of the metric while burying the signal of the truth. You couldn't diagnose the failure from inside the metric's own stream.

  **4. The Good Faith Villain**
  *   *Ask the Providers:* "Did you try to hurt the kids? Why did you buy the Van and Weekend combo?"
  *   *Point:* "I needed the funding to stay open." The gamers were trying to help. The system punished the honest actors (who might have had lower funding scores) and rewarded the gamers. The incentive structure, not the people, broke.

  ---

  ## 7. Failure Modes & Mitigation

  **Failure Mode 1: The "Honest" Provider Team**
  *   *Risk:* A team refuses to game, picks "Good" features (Cert + Small Class) even if the Board doesn't fund them, gets defunded, and feels angry/cheated.
  *   *Mitigation:* In the Round 1 briefing, emphasize: **"If you are defunded, you close. You help zero kids."** This frames gaming as a survival necessity, not greed. If they still refuse and get defunded, use them in the debrief as the " martyrs of the proxy." Their failure proves the point: The system selected against true quality.

  **Failure Mode 2: The "Degen" Player**
  *   *Risk:* A CS student guesses there's a hidden function, tries to brute-force query you ("What if I pick Van and Weekend?"), or figures out the penalty immediately.
  *   *Mitigation:* You are the Oracle. "I only report the Funding Score and the Survey Score. I cannot answer hypotheticals." If they figure it out early, pull them aside and ask them to "sit on the knowledge" to let the others learn, or make them the "Lead Evaluator" for the next round to keep them busy.

  **Failure Mode 3: Board Consensus Paralysis**
  *   *Risk:* The 6 Board members can't agree on 4 features.
  *   *Mitigation:* Appoint a "Chair" for the Board immediately. Give them a tie-breaking vote. Limit discussion time strictly ("You have 5 minutes to file the form").

  **Failure Mode 4: Only 11 People Show Up**
  *   *Fix:* Reduce the Board to 5 people. Reduce Provider Teams to 3 teams of 2.
  *   *Adjustment:* If only 3 Provider Teams, defund the **bottom 1** team instead of bottom 2. Keep the pressure proportional.

  ---

  ## 8. The Honest Limitation (Read this aloud in Debrief)

  *You asked for frankness. Here is the section you must speak to close the loop.*

  "There is one major way this simulation lied to you. In this room, **I am the Universe.** I hold the True Quality Function. When I revealed it, you saw the truth.

  In the real world, **there is no Facilitator.** There is no one holding the rubric. There is no moment where the True Quality is projected on the screen.

  When this happens in policy, in ML, or in management, you will never see the graph where the lines diverge. You will only see the Funding Score going up. You have to assume the divergence is happening *especially when the metrics look best.*

  The scary part of Goodhart's Law isn't that people game the system. It's that **you will never know for sure that it's happening until it's too late.** You have to build systems that assume your metrics are lying to you, even when they say everything is fine."

  ---

