answer: |-
  Run Lola Run is a viable teaching text only if you frame the third run not as another variation of chaos, but as a deliberate argument that human agency can stabilize a knife-edge system.

  The film validates your distinctions primarily in the first two runs, where the system behaves as purely knife-edge and switching. Consider the encounter on the tenement staircase: in the first run, Lola trips over a neighbor's dog, losing seconds that eventually lead to her arriving too late to save Manni; in the second, she avoids the dog but collides with a man on a bicycle, delaying her just enough to result in her own death during a bank robbery. These scenes demonstrate distinction (ii), Knife-edge versus Buffered, because the social and physical environment offers zero friction to absorb the shock; a half-second delay propagates linearly into fatality. They also illustrate distinction (i), Ampliative versus Switching, though mostly as Switching: the menu of outcomes (Manni lives, Manni dies, Lola dies) appears fixed, and the small events merely select which ticket is drawn rather than generating entirely new categories of existence.

  However, the flash-forward sequences attached to the strangers Lola brushes past are where the film complicates this by introducing distinction (iii), Token-level versus Structural-level contingency. When Lola bumps into a woman pushing a pram in the first run, the film freezes and catalogs a future where that woman loses her husband and lives in poverty; in the second run, the collision is slightly different, and the freeze-frame shows her winning the lottery and living luxuriously. This supports your intuition that contingency is distributed: the "nail" is not just Lola's timing, but the intersection of her timeline with dozens of others. These sequences argue that while the structural level (the city of Berlin, the existence of banks and supermarkets) remains buffered and identical across all three runs, the token level is radically ampliative for the individuals involved. The small event does not just select a winner; it writes a biography.

  You must confront the resistance you noted: the third run undermines the chaos theory reading. In the final iteration, Lola does not merely encounter different obstacles; she navigates them with supernatural competence, screaming at a casino roulette wheel to land on twenty and leaping over the staircase dog without breaking stride. This is not sensitive dependence on initial conditions; it is convergence through agency. If you present the film solely as an illustration of the "for want of a nail" trope, you will mislead students, because the film ultimately argues that the nail matters only until the runner learns how to jump. To use it honestly, you must treat the trilogy of runs as a dialectic: runs one and two establish the chaos theoretic baseline, while run three proposes that memory and will can buffer a knife-edge system.

  Regarding your distinctions, (i) Ampliative versus Switching and (ii) Knife-edge versus Buffered risk collapsing into each other in this specific context. A system that is sufficiently buffered will rarely allow a small cause to switch outcomes, and a system that is knife-edge will almost always allow a small cause to switch rather than amplify, because the endpoints are already defined by the system's fragility. In the film, because the timeline is only twenty minutes, there is little room for ampliative outcomes (new structures) to emerge; there is only time for switching (life or death). Distinction (iii) remains the most robust, as the film clearly separates the structural stability of the setting from the token instability of the lives within it.

  The film adds to the debate what abstract argument cannot: the visceral experience of the "near miss." Reading about counterfactuals allows students to understand the logic of divergence, but watching Lola sprint past the same patch of pavement three times forces them to feel the contingency of space and time. It visualizes the simultaneity of possible worlds, making the claim that "things could have been otherwise" feel like a physical proximity rather than a logical possibility. By showing the flash-forwards, it also forces the viewer to acknowledge the ethical weight of token contingency; the argument that small causes matter is usually abstract, but seeing the future happiness of a stranger hinge on Lola's shoulder checking them makes the cost of contingency immediate.
