      *   (iii) *Token vs. Structural:* Does it change individual fate (token) or systemic outcome (structural)?

  3.  **Analyze *Run Lola Run* through these lenses:**
      *   *Structure:* Three runs. Run 1 (Death), Run 2 (Death/Arrest), Run 3 (Success/Winning).
      *   *Mechanism:* Small delays/encounters (staircase, bike, pram) cause massive divergences in Runs 1 & 2.
      *   *Run 3:* Lola learns (screams at casino, avoids obstacles). This suggests agency overriding chaos.
      *   *Flash-forwards:* The people Lola bumps into have their futures altered drastically (life/death, wealth/poverty) based on seconds of interaction.

  4.  **Evaluate the Distinctions against the Film:**
      *   (i) *Ampliative vs. Switching:* The film mostly shows *switching* among pre-existing tragic/comedic outcomes (Manni dies, Lola dies, etc.), but the flash-forwards suggest *ampliative* possibilities (a life path entirely created by the bump).
      *   (ii) *Knife-edge vs. Buffered:* The film argues Berlin 1998 is purely *knife-edge*. Everything is fragile. A second delay means death. This is historically dubious but cinematically true here.
      *   (iii) *Token vs. Structural:* The flash-forwards are pure *token* contingency (individual lives changed), but the main plot (getting the money) is *structural* for the protagonists (life or death). However, the systemic world (the bank, the supermarket) remains structurally identical across runs; only the tokens change.

