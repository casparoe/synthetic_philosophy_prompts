answer: |-
  This is a delightful problem. You are essentially asking me to reverse-engineer a biologist's implicit ontology based on a set of classified judgments. Dana is not a philosopher; she is a practitioner. Her definitions are likely operational, grounded in what she has to pipette, culture, and argue about in grant reviews. Philosophers look for necessary and sufficient conditions; biologists look for *family resemblances with a hard boundary around the lab.*

  Here is the breakdown of the "Dana Principle," the predictions for your three cases, a critique of your candidate rules, and the decisive test case.

  ### 1. The Underlying Rules (The Dana Principle)

  Your two candidate rules are **not** the same rule. In fact, they are in tension, and Dana's ledger resolves that tension by prioritizing one over the other in specific contexts.

  *   **Rule A (Self-Maintenance):** Focuses on the *here and now* capacities of the entity (metabolism, boundary, homeostasis).
  *   **Rule B (Lineage):** Focuses on the *history and future* of the entity (evolution, reproduction, ancestry).

  If Rule A were dominant, candle flames (self-maintaining thermodynamic structures) might sneak in, and dormant spores might be excluded (no current maintenance). If Rule B were dominant, sterile mules would be excluded (no reproduction/evolutionary future).

  Dana's ledger suggests a hybrid, but with a specific hierarchy. I propose her working definition is: **Metabolically Closed Systems of Biological Origin.**

  Here is how that rule parses her ledger:
  1.  **Metabolic Closure (Actual or Potential):** This kills the viruses, prions, and RNA strands. They are open systems dependent on a host's closure. It also kills the flames and whirlpools (wrong kind of process). It allows the spores (potential closure) and the RBCs (actual, albeit limited, glycolysis).
  2.  **Biological Origin (Ancestry):** This is the load-bearing beam you missed. It explains the **Mule** and the **Worker Bee**. They are alive not because *they* can reproduce, but because they are *tokens of a type* that reproduces. They inherit "aliveness" from their parents. This also explains **HeLa cells** and **RBCs**; they are alive because they are somatic parts of a living lineage.
  3.  **Substrate Specificity:** This kills the **Game of Life glider** and the **Moon Probe**. To Dana, "metabolism" isn't just energy processing; it's *biochemistry*. Silicon and code don't count.

  ### 2. Predictions for Your Three Cases

  Based on the **Metabolically Closed Systems of Biological Origin** rule, here is how Dana will rule:

  **Case 1: The Synthetic Protocell (Metabolism + Membrane, No Reproduction/Lineage)**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** This is the critical test of the "Lineage" clause. It has the self-maintenance (Rule A), but it lacks the Biological Origin (Rule B). It was assembled, not born. To Dana, this is a machine that mimics life, much like a clock mimics a heartbeat. The fact that it cannot evolve is secondary; the fact that it has no ancestors is fatal. It fails the "Mule Test" (the Mule has parents; the Protocell has engineers).

  **Case 2: Giant Viruses (Mimivirus)**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** You noted she gets "decisive." While Mimivirus blurs the line for *genomic* definitions (coding for translation factors), it does not blur the line for *metabolic closure*. It still cannot generate energy or synthesize proteins without hijacking a host cell. Dana draws the line at the cell membrane. Inside the membrane = Alive (mostly); Outside = Parasite/Machine. She will view the extra genes as just a more sophisticated key, not an engine.

  **Case 3: The Von Neumann Probe (Moon Factory)**
  *   **Verdict:** **Not Alive.**
  *   **Reasoning:** This triggers the Substrate Specificity clause. It self-repairs and replicates (Rule A satisfied), and arguably creates a lineage (Rule B satisfied). But it is not *biological*. Dana's "Alive" list is exclusively carbon-based biochemistry. Her "Not Alive" list includes the Game of Life glider, which proves she rejects substrate independence. A moon factory is just a very complex candle flame—thermodynamic dissipation via machinery, not biology.

  ### 3. Critique of Your Candidate Rules

  You asked me not to hold back, so here it is: **You are too generous to the "Self-Maintenance" rule.**

  You wrote: *"Some obvious candidates get weeded out by her record -- the RNA replicator verdict seems to kill pure 'life is Darwinian evolution' definitions, the flame thing kills bare thermodynamic self-organization..."*

  You are treating the "Flame" exclusion as a minor tweak to the Self-Maintenance rule (i.e., "organized" self-maintenance). But for a developmental biologist, the difference between a flame and a cell isn't just "organization"; it's **mechanism**. A flame maintains itself through diffusion and reaction kinetics. A cell maintains itself through *teleonomic* processes (feedback loops, genetic regulation).

  However, the **Mule** is the real hammer that breaks your first rule.
  *   **Rule 1 (Self-Maintenance):** A mule maintains itself. Verdict: Alive. (Consistent)
  *   **Rule 2 (Lineage):** A mule is a token of a reproducing lineage (horses/donkeys), even if the token is sterile. Verdict: Alive. (Consistent)

  So where do they diverge? **Case 1 (The Protocell).**
  *   **Rule 1** says: It maintains itself. **Alive.**
  *   **Rule 2** says: It has no lineage. **Not Alive.**

  If Dana calls the Protocell "Not Alive" (which I predict she will), then Rule 2 (Lineage/Ancestry) is the dominant rule, and Rule 1 is merely a necessary condition. You cannot have life without metabolism, but metabolism alone does not make life. You need the *history*.

  Furthermore, your "Token of a lineage" rule needs the **Somatic Clause**. An RBC is not a token of a reproducing lineage (it can't divide). It is a *part* of a token. So the rule must be: *An entity is alive if it is a metabolically closed system (actual or potential) that is either (a) a reproductive unit of a biological lineage, or (b) a functional somatic part of (a).*

  ### 4. The Killer Test Case

  To definitively separate the surviving rules (Biological Origin vs. Functional Capacity), you need to break the link between "Ancestry" and "Substrate."

  **The Case:** **The "Phoenix" Synthetic Cell.**
  > A team synthesizes a complete bacterial genome from scratch (no biological template) and inserts it into a synthetic cytoplasm (no biological lipids or proteins, all chemically synthesized). However, this cell **can** metabolize, grow, and **reproduce** indefinitely, evolving in the lab. It has no biological ancestors, but it has a future lineage.

  **Why this separates the rules:**
  *   **The "Biological Origin" Rule (Dana's likely view):** **Not Alive.** It has no parents. It is a machine that bootstrapped a lineage. It fails the "Mule" logic (the Mule had biological parents; this has chemists).
  *   **The "Functional Capacity" Rule (Rule 1 modified):** **Alive.** It metabolizes, maintains boundaries, and evolves. The lack of ancestors is irrelevant history.

  **Alternative Case (if you want to test the Somatic Clause):**
  **The "Brain-in-a-Vat" (Biological).**
  > A human brain is kept alive in a nutrient tank, fully conscious, metabolizing, but disconnected from any body and incapable of reproduction.
  *   **Dana's likely verdict:** **Alive.** (It's a somatic part of a biological lineage, functioning).
  *   **The "Reproducing Lineage" Rule:** **Not Alive.** (It cannot reproduce and is not an organism).
  *   *Note:* I suspect Dana will call this alive, which reinforces the "Somatic Part" clause of her ontology.

  ### Summary for your Seminar
  Tell your students that Dana is a **Historical Essentialist** regarding origin, but a **Functionalist** regarding maintenance.
  1.  **Origin:** Must be biological (excludes Moon Probe, Protocell).
  2.  **Maintenance:** Must be metabolically closed (excludes Viruses, Flames).
  3.  **Status:** Can be a whole organism or a functional part (includes Mule, RBC, HeLa).

  If you call her and predict "Not Alive" for the Protocell, "Not Alive" for the Mimivirus, and "Not Alive" for the Moon Probe, you won't just look smug. You'll look like you understand that for a biologist, life isn't just what something *does*; it's where it *comes from*.
