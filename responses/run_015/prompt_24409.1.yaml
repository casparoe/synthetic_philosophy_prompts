prompt: |-
  I'm in a seminar on interpretability and we keep going in circles on whether neural nets actually have representations or whether 'representation' is just us projecting onto them. Can you write the joint statement a committed representationalist and a committed anti-representationalist (the deflationist who thinks 'representation' is only a relation to an interpreter, not a property the network has) could both sign after a good-faith adversarial collab? I want the claims both would agree on, the precise disagreements each phrased so their own side would accept the wording, the cruxes, and for each crux a concrete case or argument both would agree bears on it with each side's prediction written down in advance. I think one crux is whether there's a fact of the matter about what a feature represents indepentent of the interpreter, and another is whether the fact that many different bases can compute the same function is a real problem for realism or just a hardness problem. Format it as a numbered agreed-claims section followed by a disagreements table.
