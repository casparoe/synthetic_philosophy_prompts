      Title: **The Proximity Architecture of Rescue: Disaggregating Spatial, Causal, and Epistemic Conditions in Singer's Pond Argument**
      **Project Overview**
      Peter Singer's drowning child argument posits that if we can prevent something bad without sacrificing anything of comparable moral importance, we ought to do it. Standard extensions treat global poverty or climate harm as analogous cases where distance is morally irrelevant. This project challenges that extension by hypothesizing that the original case relies on an implicit three-layer proximity structure—spatial, causal, and epistemic—that is dissolved in systemic harms.
      **1. The Precise Question**
      Is the moral force of Singer's argument carried by the severity-cost comparison alone, or does it depend on an implicit proximity architecture that makes discrete rescue obligations structurally different from obligations to redesign institutions?
      Specifically, does the duty of rescue survive intact when all three layers are dispersed? In the pond case, the agent is spatially near, causally singular (the omission is the cause), and epistemically certain (direct perception). In institutional harms, victims are statistical, causes are distributed across design choices, and knowledge is mediated by models. This project asks whether the "rescue" label applies when these conditions are removed, or if the moral obligation shifts category from direct rescue to structural justice.
      **2. Gap in Existing Positions**
      Current literature leaves this question open due to categorical flattening. Defenders of global obligations (Singerians) tend to treat distance as morally irrelevant *per se*. They argue that physical proximity lacks intrinsic moral weight, but they do not ask *which kind* of distance matters. They assume that if spatial distance is irrelevant, then causal and epistemic distance are similarly negligible or reducible to cost.
      Conversely, critics of global obligations who focus on institutional reform invoke collective-action problems and epistemic opacity to argue against direct duties. However, they conflate these structural issues with proximity effects. They do not separate the difficulty of coordinating collective action from the moral phenomenology of the rescue scenario itself. Consequently, it remains unclear whether the failure of the analogy is due to practical impossibility (collective action) or a fundamental shift in the moral relation (proximity architecture). This project isolates proximity as a distinct variable to determine if the duty itself changes shape, not just its feasibility.
      **3. Methodology (Six-Month Plan)**
      **Months 1-2: Formalization of Proximity Conditions.**
      I will reconstruct the pond case to isolate the three implicit conditions.
      *   *Spatial:* Physical immediacy allowing direct intervention.
      *   *Causal:* A binary link where agent inaction is the sufficient cause of harm.
      *   *Epistemic:* Direct perceptual knowledge of the victim's state.
      I will produce a formal schematic showing how these conditions constrain the "severity-cost" calculation, demonstrating that the low cost of rescue is partially dependent on these proximity conditions being met.
      **Months 3-4: Application to Structural Analogues.**
      I will apply this schematic to three cases where proximity is dispersed:
      1.  *Climate-Adaptation Funding:* Victims are statistical; causes are cumulative; knowledge is model-based.
      2.  *Supply-Chain Labor Safeguards:* Victims are hidden; causes are distributed across contractors; knowledge is audited.
      3.  *Algorithmic Resource Allocation:* Victims are data points; causes are code design; knowledge is opaque.
      For each, I will test where the pond analogy holds and where it breaks. I will determine if the "cost" increases merely practically or if the moral relation changes fundamentally.
      **Months 5-6: Constructing Competing Arguments and Identifying the Crux.**
      I will construct two versions of the obligation:
      1.  *Direct Scaling:* Treats institutional harm as aggregated pond cases.
      2.  *Structural Redesign:* Treats institutional harm as a distinct category requiring justice-based rather than rescue-based arguments.
      I will identify the exact crux where the Direct Scaling argument fails. Is it at the point of causal distribution, or epistemic mediation? The final output will pinpoint the specific proximity condition that, when removed, invalidates the rescue framework.
      **4. Success and Failure Conditions**
      **Failure:**
      The project fails if the analysis collapses proximity effects into general collective-action problems. If the conclusion is merely that "institutional harm is harder to fix," the conceptual distinction is lost. It also fails if it turns out the pond case and the institutional cases differ only in scale (i.e., more victims, higher cost) without a structural shift in the moral obligation.
      **Success:**
      A successful deliverable is a framework that tells us when an institutional obligation is a direct analog of rescue and when it requires a separate moral argument altogether. Specifically, I aim to produce a typology of moral obligations that distinguishes "Rescue Duties" (dependent on proximity architecture) from "Design Duties" (dependent on systemic influence). This framework will clarify when appeals to the drowning child are rhetorically powerful but philosophically misleading, providing a more precise tool for evaluating obligations in global poverty, climate ethics, and AI governance.

