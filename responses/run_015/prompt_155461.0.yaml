answer: |-
  **Project Title:** The Proximity Architecture of Rescue: Disaggregating Spatial, Causal, and Epistemic Conditions in Singer's Pond Argument

  **1. The Precise Question**
  Is the moral force of Singer's argument carried by the severity-cost comparison alone, or does it depend on an implicit proximity architecture that makes discrete rescue obligations structurally different from obligations to redesign institutions?

  Standard interpretations of the drowning child example assume the moral obligation derives strictly from the ratio of harm prevented to cost incurred. This project hypothesizes that the original case smuggles in a three-layer proximity structure—spatial, causal, and epistemic—that gets quietly dissolved when people apply the reasoning to distant strangers. In the pond case, the agent is spatially near, causally singular (the omission is the direct cause), and epistemically certain (direct perception). In institutional harms, victims are statistical rather than named, causes are distributed across design choices rather than single omissions, and knowledge of the harm is mediated by models rather than direct perception. This project asks whether the duty of rescue survives intact when all three layers are dispersed, or if the moral obligation shifts category from direct rescue to structural justice.

  **2. Gap in Existing Positions**
  Existing literature leaves this question open due to categorical flattening. Defenders of global obligations tend to treat distance as morally irrelevant *per se*. They argue that physical proximity lacks intrinsic moral weight, but they do not ask *which kind* of distance matters. They assume that if spatial distance is irrelevant, then causal and epistemic distance are similarly negligible or reducible to cost. Consequently, they extend the rescue analogy to systemic issues without testing whether the underlying moral logic holds when the proximity architecture is removed.

  Conversely, institutional-reform critics invoke collective-action and epistemic problems to argue against direct duties. However, they conflate these structural issues with proximity effects. They do not separate the difficulty of coordinating collective action from the moral phenomenology of the rescue scenario itself. They argue that institutional harm is *harder* to address, but fail to ask if it is *different* in kind. This project isolates proximity as a distinct variable to determine if the duty itself changes shape, not just its feasibility. By disaggregating spatial, causal, and epistemic conditions, I will show whether the failure of the analogy is due to practical impossibility or a fundamental shift in the moral relation.

  **3. Methodology (Six-Month Plan)**
  This is a strictly conceptual project involving philosophical reconstruction and comparative analysis of moral cases.

  **Months 1-2: Formalization of Proximity Conditions.**
  I will reconstruct the pond case to isolate the three implicit conditions necessary for the "rescue" label to apply.
  *   *Spatial:* Physical immediacy allowing direct intervention without intermediaries.
  *   *Causal:* A binary link where agent inaction is the sufficient cause of harm.
  *   *Epistemic:* Direct perceptual knowledge of the victim's state.
  I will produce a formal schematic showing how these conditions constrain the "severity-cost" calculation. The goal is to demonstrate that the low cost of rescue is partially dependent on these proximity conditions being met, rather than being an independent variable.

  **Months 3-4: Application to Structural Analogues.**
  I will apply this schematic to three conceptual test cases where proximity is dispersed, analyzing them as structural analogues rather than empirical studies:
  1.  *Climate-Adaptation Funding:* Victims are statistical; causes are cumulative; knowledge is model-based.
  2.  *Supply-Chain Labor Safeguards:* Victims are hidden; causes are distributed across contractors; knowledge is audited.
  3.  *Algorithmic Resource Allocation:* Victims are data points; causes are code design; knowledge is opaque.
  For each, I will test where the pond analogy holds and where it breaks. I will determine if the "cost" increases merely practically or if the moral relation changes fundamentally when specific proximity layers are stripped away.

  **Months 5-6: Constructing Competing Arguments and Identifying the Crux.**
  I will construct two versions of the obligation to identify the exact point of divergence:
  1.  *Direct Scaling:* Treats institutional harm as aggregated pond cases (the standard Singerian extension).
  2.  *Structural Redesign:* Treats institutional harm as a distinct category requiring justice-based rather than rescue-based arguments.
  I will identify the exact crux where the Direct Scaling argument fails. Is it at the point of causal distribution, or epistemic mediation? The final output will pinpoint the specific proximity condition that, when removed, invalidates the rescue framework.

  **4. Success and Failure Conditions**
  **Failure:**
  The project fails if the analysis collapses proximity effects into general collective-action problems. If the conclusion is merely that "institutional harm is harder to fix due to coordination costs," the conceptual distinction is lost. It also fails if it turns out the pond case and the institutional cases differ only in scale (i.e., more victims, higher cost) without a structural shift in the moral obligation. In either case, the hypothesis that proximity architecture constitutes a distinct moral variable would be disproven.

  **Success:**
  A successful deliverable is a framework that tells us when an institutional obligation is a direct analog of rescue and when it requires a separate moral argument altogether. Specifically, I aim to produce a typology of moral obligations that distinguishes "Rescue Duties" (dependent on proximity architecture) from "Design Duties" (dependent on systemic influence). This framework will clarify when appeals to the drowning child are rhetorically powerful but philosophically misleading, providing a more precise tool for evaluating obligations in global poverty, climate ethics, and AI governance. The final manuscript will define the boundary conditions of the rescue analogy, offering a refined conceptual tool for normative ethics.
