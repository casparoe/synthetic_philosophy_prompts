answer: |-
  **Scope**

  The theory must explain representational content for sub-personal states—neural patterns, cellular signals, or functional nodes—that guide behavior. It is not primarily about full-blown human beliefs, but the foundational indicators that make belief possible. Solving the problem means showing how physical states bear normative conditions (accuracy conditions) without invoking magic or irreducible intentionality. A successful theory renders intentional explanation scientifically respectable by grounding "aboutness" and "error" in natural facts—causal, historical, or functional—allowing us to say a state *means* X even when X is absent, without collapsing meaning into mere correlation or utility.

  **The list**

  1.  **The Error Condition:** *Case:* A state triggers a response when the target is absent. *Requirement:* The theory must distinguish misrepresentation from mere malfunction or statistical noise. A state can be functioning perfectly according to its design yet still be false. If error is defined only as system breakdown, normativity disappears; the theory must allow for correct function with incorrect content.
  2.  **The Determinacy Condition:** *Case:* The frog-style detector fires for flies, dark spots, or pellets. *Requirement:* The theory must select a single content (e.g., "fly") rather than a disjunction ("fly-or-pellet") or nothing. Natural relations are messy; content must be specific. A theory that yields indeterminate content fails to explain why the organism behaves specifically toward flies rather than pellets.
  3.  **The Consumer Authority Condition:** *Case:* A mechanism selected for X is co-opted by a downstream system reading it as Y. *Requirement:* The theory must decide whether content is fixed by the producer's history or the consumer's usage. If both count, contradiction arises. To explain behavior, the theory must identify which interface sets the truth conditions when production and consumption diverge.
  4.  **The Environmental Stability Condition:** *Case:* An organism drifts to a new environment where the state tracks G instead of F. *Requirement:* The theory must specify when content shifts versus when the organism is simply in error. Content cannot be so sensitive to current context that it changes daily, nor so rigid that it ignores total environmental collapse. A threshold for environmental relativity is needed.
  5.  **The Developmental Gradience Condition:** *Case:* A young organism or network mid-training lacks settled dispositions. *Requirement:* The theory must account for content acquisition. Either content arrives by degrees as functions stabilize, or the theory must admit contentless states during learning. A binary switch (content/no-content) risks arbitrariness; the spec should allow for functional maturation.
  6.  **The History Independence Condition:** *Case:* A history-free duplicate (Swampman) has identical dispositions but no evolutionary past. *Requirement:* The theory must declare whether history is essential. If content requires selection history, the duplicate has none; if it requires only current structure, history is irrelevant. This decides whether content is intrinsic or relational.
  7.  **The Aspectual Shape Condition:** *Case:* Two states pick out the same object but under different aspects (e.g., Hesperus vs. Phosphorus). *Requirement:* The theory must distinguish modes of presentation, not just extensions. If naturalism cannot capture cognitive perspective, it fails to explain rational behavior. However, this may be a high-level demand exceeding sub-personal scope.
  8.  **The Causal Relevance Condition:** *Case:* A state represents food and causes foraging. *Requirement:* The content itself must play a role in causing the behavior, not just the physical vehicle. If content is epiphenomenal, intentional explanation loses its scientific utility. The theory must show how meaning gets into the causal chain.

  **Requirements vs. camp loyalties**

  Several demands are philosophical preferences, not scientific necessities. **Reductiveness** is often demanded, but naturalization (grounding in natural facts) suffices; strict reduction to physics is unnecessary. **Coverage of Artifacts** is a scope decision, not a desideratum for biological naturalism; if the theory is for evolved minds, artifacts are optional extensions. **Swampman intuitions** are modal tests, not empirical constraints; insisting on content for duplicates is a loyalty to intrinsicism, not science. **Folk-psychological respect** is a target, but the theory may revise folk concepts (e.g., denying aspectual shape at the neural level) to secure naturalization. The boundary lies at scientific utility: does the definition allow us to predict and explain behavior better than non-intentional terms? If yes, philosophical quirks like Swampman are secondary.

  **Where the list breaks**

  The desiderata cannot all be jointly satisfied without trade-offs. The primary tension exists between **Determinacy** (Frog case) and **History Independence** (Swampman). Etiological theories solve Determinacy via history but fail Swampman; structural theories pass Swampman but struggle with Determinacy. However, the most expensive requirement is **Aspectual Shape**. Naturalistic accounts of sub-personal states typically track relations, not modes of presentation. Capturing "aspect" requires complex conceptual roles that resist simple naturalization. For a base theory of content aimed at scientific respectability, Aspectual Shape is the cheapest to give up. We can accept that sub-personal states lack fine-grained aspectual sensitivity, pushing that problem to higher-level cognitive architectures. Sacrificing Aspect saves Error, Determinacy, and Causal Relevance, which are more critical for basic intentional explanation.

  **The knockout**

  The **Error Condition** is the single requirement that does the most work. Pure informational-covariation accounts fail here immediately: if a state carries information that P, it cannot occur when P is false, making error impossible. Any theory that cannot distinguish "false signal" from "system breakdown" is dead on arrival. This requirement excludes simple correlation models and forces the introduction of norms (functions, goals, or success conditions). It is the gatekeeper: if you cannot explain how a properly functioning state gets it wrong, you have not naturalized content, only causation.

  **Scorecard**

  | Desideratum | Etiological (Teleo) | Informational (Covariation) | Consumer (Success) |
  | :--- | :--- | :--- | :--- |
  | **Error** | Pass | Fail | Pass |
  | **Determinacy** | Pass | Fail | Mixed |
  | **Consumer Authority** | Mixed | N/A | Pass |
  | **Drift/Stability** | Pass | Fail | Pass |
  | **Gradience** | Mixed | Pass | Pass |
  | **History Indep.** | Fail | Pass | Mixed |
  | **Aspectual Shape** | Fail | Fail | Fail |
  | **Causal Relevance** | Pass | Pass | Pass |

  *Note: "Fail" indicates significant structural difficulty, not necessarily fatal.*
