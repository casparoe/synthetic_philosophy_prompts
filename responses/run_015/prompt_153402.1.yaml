prompt: |-
  I'm taking this philosophy of belief course and my prof, Dr. K., keeps throwing these little ethical scenarios at us about when it's okay to hold a belief without solid evidence. So far she's said: a ship captain who genuinely believes the storm will miss them despite ambiguous radar and decides not to turn back — wrong, he should of suspended judgment; a patient with a terminal diagnosis who believes in an afterlife with zero empirical backing — that's fine; a climate scientist who sticks with her model even after a failed replication, mostly cause she needs the grant money to keep testing — wrong, she should hold it tentatively at best; and a refugee who believes her family survived despite no news, because she literally can't keep walking without that conviction — permissible, maybe even required.

  Now there's this case she hasn't touched yet, and I'm trying to figure out her call. A neighborhood organizer is fighting a zoning change that might put a factory near a school. The environmental reports are genuinely split — credible people on both sides. She doesn't just hope or play politics; she genuinely comes to believe the water will be poisoned, and she uses that conviction to rally people. She admits the evidence doesn't settle it, but says the choice is forced and the stakes are huge for her community. Would Dr. K. say she's ethically okay to hold that belief?

  I'm less interested in the bare yes/no than in what rule she's actually running — is it the James-style live/forced/momentous thing, a Clifford-style ban with some practical carve-out, or something like "belief is okay when it's psychologically necessary for survival but wrong when it's instrumentally useful for a cause"? What other principle fits her first four verdicts just as well, and what's the case that would actually tell them apart? Also please write this in American English, and say what argument or counterexample would change your mind about which rule she's using.
