answer: |-
  Q1: Let's start with the norms. We tell graduate students to "aim at the truth" and "assert only what is true." If "S is true" says nothing more than "S," doesn't that instruction collapse into "assert S"? How does a student aim at an infinite list of sentences without a single property to guide them?

  **Follow-up:** If she says the norm is just a rule of thumb for asserting what you have evidence for, ask: Then why do we need the word "truth" at all? Why not just tell them "assert what you have evidence for"? If "truth" adds nothing to the instruction, isn't it redundant noise in our best normative practices?

  Q2: Following on that, if the norm isn't redundant, is it an infinite shopping list? To follow "assert only what is true," do I need to check every instance of the equivalence schema? Since no finite agent can do that, isn't the deflationary norm either empty or impossible to follow?

  **Follow-up:** If she says we follow the *concept* rather than the list, ask: What is that concept if not a substantive property? If it's just a logical device, how does a logical device motivate action? Logic tells you what follows from what, not what you should *do*.

  Q3: Let's move to my old field. In seismology, we explain why certain models build instruments that work and predict quakes by saying those models are "true." If truth is just a logical device for generalization, doesn't that explanation collapse? Are you saying our instruments work simply because we believe what we should believe?

  **Follow-up:** If she says instruments work due to "empirical adequacy" rather than truth, ask: Isn't empirical adequacy just a synonym for "true about the observable world"? If you strip out the idea that the theory latches onto reality, what is left to explain the success other than luck or pragmatism?

  Q4: Pushing that further, if truth is that thin, does the explanation of scientific progress survive? If a new theory replaces an old one because it's "truer," but truth isn't a substantive property of tracking reality, are we just saying the new theory is "more useful"? If so, why do we expect the new instruments to work better in unforeseen situations?

  **Follow-up:** If she says we expect it because of past success, ask: Isn't that induction? And doesn't induction rely on the assumption that there's a stable reality to track? If truth isn't a property of that relationship, aren't you smuggling realism in while denying it?

  Q5: I've been reading up on the math side. Popular accounts say if you add a truth predicate to arithmetic, you can prove consistency, which arithmetic can't do on its own. That sounds like truth adds new power and content. How do you reconcile that with the claim that truth is logically insubstantial?

  **Follow-up:** If she says that only applies to a "full" Tarskian truth predicate and not the deflationary one, ask: So you admit there's a version of truth that has substantive content? Why should we accept your minimalist version as the whole story if a slightly richer version does more explanatory work?

  Q6: Let's grant your version is the "conservative" one that doesn't prove consistency. Is that meager version actually strong enough to do the generalization work you need? If I can't prove consistency, can I really generalize over infinite sets of sentences without running into contradictions?

  **Follow-up:** If she says the conservative version is sufficient for all legitimate uses, ask: Then what are we losing? If we lose the ability to prove consistency, haven't we lost the ability to guarantee our logical system doesn't explode? Is a notion of truth that can't assure consistency really doing the heavy lifting we need?

  Q7: Now to my archive case. I have forty years of notebooks in shorthand I can't read. I say, "Everything in these notebooks is true." If truth is just disquotation, what am I doing? I can't disquote sentences I can't decode. Is this ascription meaningless?

  **Follow-up:** If she says it's a standing commitment to endorse each entry if decoded, ask: What happens if one entry says, "The claim on page 200 is not true," and page 200 contains that very sentence? If I endorse *everything*, I endorse a contradiction. How does your view handle this without crashing?

  Q8: To avoid that contradiction in the notebooks, don't you have to restrict the equivalence schema? You'd have to say some sentences—like the one on page 200—aren't eligible for truth ascription. Doesn't that restriction require a notion of "groundedness" or "meaningfulness"? And isn't groundedness a substantive semantic property you said didn't exist?

  **Follow-up:** If she denies groundedness is substantive, ask: Then what criteria do you use to exclude the paradoxical sentences? If it's not a semantic property, what is it? If you can't specify the restriction without invoking substantive semantics, hasn't the deflationary view just stopped working?

  \answer{Q8 — the groundedness follow-up}
