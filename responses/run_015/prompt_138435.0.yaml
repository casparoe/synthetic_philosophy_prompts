prompt: |-
  I teach a seminar on agency and free will, and there is a configuration I keep running into for which I have no word. It is not the flat stereotypy of the familiar wasp case — the animal that runs a routine to its end no matter what happens partway through. It is roughly the inverse: an agent who is genuinely flexible, who deliberates, learns, and revises plans in response to reasons, but whose flexibility is *scheduled*. Some standing rule settles when reconsideration is in order, and that rule is not itself up for reconsideration at the time it applies.

  Three instances. A colleague rewrites her syllabus from scratch at the start of every term and will not alter it during the term; asked what she would do if something genuinely syllabus-relevant happened in week five — a new edition, a two-week campus closure — she said, without any sense of paradox, that she would note it for next year. A friend resolved, after long reflection, to revisit his career plans only on his birthday, so as to keep the rest of the year free of second-guessing; last March something happened that he himself grants would have moved him had it happened in June, and he declined to think about it until June. And in the ethological material I have read, the same shape seems to recur as flexibility during the acquisition of a routine paired with rigidity during its execution, with nothing that revisits the switch between the two.

  I am after a term of art, if one exists, for rigidity at the meta-level — flexibility that is real but exercised only under a rule that is not itself flexible — and, more than the label, its carving. I take it this is not stubbornness or akrasia: in my cases the agent is not failing to do what she judges best, but following a judgment about when to judge. I take it to be more than the truism that no rule can govern its own application without regress, though I want to know how near to that it sits. What I most want clarified is the edge: does the structure count as rigidity at all if the higher-level rule is itself revisable at some other scheduled time, or does that merely relocate the problem one level up? And if it does merely relocate it, what would have to be true for the regress to terminate in something that is not itself rigid? A name alone would be of little use to me; that last question is why I care, since pointing to an agent's flexibility is the standard way of marking agency off from mechanism, and the flexibility always seems to rest on something that is not flexible.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user teaches a seminar on agency and free will.
      *   **Problem:** They encounter a specific configuration of agency for which they lack a precise term.
      *   **Description of the Configuration:**
          *   Not stereotypy (rigid execution regardless of context, like the sphex wasp).
          *   Inverse: Genuine flexibility/deliberation/learning, but *scheduled*.
          *   Meta-level rigidity: A standing rule determines *when* reconsideration is allowed. That rule is not open to reconsideration *at the time it applies*.
          *   Examples: Professor (syllabus fixed per term, changes saved for next), Friend (career plans reviewed only on birthday), Ethology (flexibility in acquisition, rigidity in execution, switch not revisited).
      *   **What they want:**
          *   A term of art (if it exists).
          *   A "carving" (conceptual analysis/boundary drawing).
          *   Clarification on the "edge": Is it still rigidity if the higher-level rule is revisable later? Does this just relocate the problem?
          *   The Core Philosophical Question: If flexibility rests on something not flexible, does that undermine agency? How does the regress terminate in something *not* rigid?
      *   **Tone:** Philosophical, precise, academic but accessible, respectful of the nuance.

  2.  **Initial Brainstorming & Terminology Search:**
      *   *Precommitment / Ulysses Pact:* This is the closest standard term. Elster, Schelling. Binding oneself to a future course of action to prevent weakness of will. But the user's cases aren't necessarily about weakness of will (akrasia); they are about efficiency/focus.
      *   *Second-Order Volitions:* Frankfurt. Wanting to want something. Related, but usually about desires, not scheduling deliberation.
      *   *Policy/Plan Hierarchy:* Bratman's Planning Theory of Intention. Intentions resist reconsideration. This is very close. Bratman explicitly discusses the "stability" of intentions and the costs of reconsideration.
      *   *Bounded Rationality / Satisficing:* Simon. We don't optimize everything all the time.
      *   *Meta-Cognition / Metacognitive Control:* Knowing when to think.
      *   *Constitutive Rules:* Rules that define the activity.
      *   *Algorithmic/Heuristic:* In cognitive science, a "stop rule."
      *   *Structural Rationality:* Broome.
      *   *The "Regress" Problem:* This sounds like Wittgenstein (rule-following) or Carroll (Achilles and the Tortoise).

  3.  **Selecting the Best Conceptual Fits:**
      *   **Michael Bratman's "Planning Theory of Intention":** This is the strongest philosophical match. Bratman argues that intentions are *conduct-controlling pro-attitudes* that are *stable* and *resist reconsideration*. He explicitly addresses the "cost of reconsideration." If we reconsidered every intention every moment, we couldn't act. So we have a policy of *not* reconsidering unless there is a significant trigger. The user's "scheduled flexibility" is a specific version of Bratman's "stability of intention."
      *   **Jon Elster's "Ulysses and the Sirens" (Precommitment):** Good for the binding aspect, but implies a threat of temptation. The user says it's *not* akrasia. However, Elster discusses "binding" for efficiency too.
      *   **Herbert Simon's "Bounded Rationality":** Explains *why* (cognitive limits), but doesn't capture the normative structure of agency.
      *   **Harry Frankfurt's "Second-Order Volitions":** Good for the hierarchy, but less about temporal scheduling.
      *   **Cognitive Science/Control Theory:** "Gain scheduling" or "Meta-control."

  4.  **Developing the "Carving" (Conceptual Analysis):**
      *   The user asks: Is this rigidity? Yes, but *functional* rigidity.
      *   The Regress: If the rule for reconsideration is fixed, what fixes that rule?
      *   Termination: The regress must terminate in something that isn't a *rule* but a *disposition* or *capacity*. Or, it terminates in a "hinge commitment" (Wittgenstein).
      *   Distinction from Mechanism: Mechanisms don't *schedule* their own updates based on reasons. Agents adopt policies *because* they value stability/efficiency.

  5.  **Drafting the Response - Section by Section:**

      *   **Acknowledgment:** Validate the insight. It's a sharp observation.
      *   **Terminology:**
          *   *Primary Candidate:* **Bratmanian Stability of Intention** (or "Non-Reconsideration Policy"). This is the standard philosophical term in action theory.
          *   *Secondary Candidate:* **Precommitment Strategy** (Elster/Schelling), though note the caveat about akrasia.
          *   *Tertiary Candidate:* **Meta-Cognitive Stop Rules** (Cognitive Science).
          *   *Proposed Label:* **"Scheduled Deliberation"** or **"Structured Flexibility."** Maybe **"Diachronic Policy Constraint."** Let's stick close to Bratman: **"Intention Stability"** or **"Deliberative Closure."**
      *   **The Carving (Analysis):**
          *   Why do it? To reduce cognitive load, ensure coordination, allow execution.
          *   Is it rigidity? It is *local* rigidity for *global* flexibility.
          *   The "Edge" Question: Does revisability later solve it? No, it pushes it back.
      *   **The Regress/Termination:**
          *   This is the crux. If every rule needs a higher rule, we never act.
          *   Solution 1: **Dispositions/Habits** (Aristotle/Bourdieu). Not rules, but trained responses.
          *   Solution 2: **Hinge Commitments** (Wittgenstein). Things we don't doubt to allow doubt elsewhere.
          *   Solution 3: **Constitutive Aims** (Velleman). The aim of agency itself sets the boundary.
      *   **Agency vs. Mechanism:**
          *   Mechanism: Rigidity is causal necessity.
          *   Agency: Rigidity is normative adoption. The agent *owns* the constraint. The "switch" is reason-responsive, even if not constantly active.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* The user specifically said it's *not* akrasia. I need to make sure I don't lean too hard on Ulysses/Sirens (which is usually about temptation). Bratman is better because he focuses on the *rationality of stability* independent of temptation.
      *   *Refining the Regress:* The user asks: "What would have to be true for the regress to terminate in something that is not itself rigid?"
      *   *Answer:* It must terminate in a *capacity* or a *nature*, not a *rule*. A rule is propositional. A capacity is functional. The ability to recognize "now is the time" must be intuitive/dispositional, not ruled.
      *   *Key Distinction:* **Operational Closure** vs. **Causal Closure**.

  7.  **Final Polish:**
      *   Ensure the tone matches the user's (sophisticated, seminar-leader).
      *   Check that all three parts of the prompt are answered (Term, Carving/Edge, Regress/Agency).
      *   Make sure to explicitly mention Michael Bratman. His work is the direct hit here.

  8.  *(Final check of the "Edge" question)*: The user asks if revisability at a higher level just relocates the problem. Yes, it does. The termination point is the key. I need to articulate that the termination point is the *agent's identity* or *practical standpoint*, which isn't a rule but the *source* of rules.

  9.  *(Constructing the specific term)*: "Deliberative Closure" sounds good. "Policy-Guided Stability." Let's offer Bratman's "Stability of Intention" as the canonical term, but suggest "Meta-Level Lock-in" or "Scheduled Reconsideration" for the specific phenomenon.

      *Wait, one more thought:* In computer science/AI, this is "Metareasoning." Specifically, "When to think." But the philosophical implications are what matter.

      *Let's focus on the "Regress Termination".* The regress stops when we hit the *agent*. The agent isn't a rule. The agent is the thing that *has* rules. The "flexibility" is the capacity to adopt/drop rules. That capacity doesn't need a rule; it's the definition of agency.

