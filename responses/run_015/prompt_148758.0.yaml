answer: |-
  Here is the translation of Presentism and Eternalism into your database vocabulary, followed by the residue report on where the mapping holds and where it leaks.

  ### The Translation

  **Definition of Existence:** A tuple (or event) "exists" if and only if it is addressable by a query without error or restoration from backup.

  #### 1. Eternalism $\rightarrow$ The Immutable Event Log (Bitemporal)
  Your intuition is correct. Eternalism maps cleanly to a fully audited, bitemporal system or an Event Sourced architecture.
  *   **The Schema:** The universe is a write-ahead log (WAL) or an append-only event store. Every state change is an immutable event.
  *   **Time:** `valid_time` is just another coordinate (like `x`, `y`, `z`). There is no privileged `CURRENT_TIMESTAMP` at the storage engine level.
  *   **Existence:** A record from the Jurassic period and a record from today are equally addressable. You can run `SELECT * FROM universe AS OF '2024-01-01'` or `AS OF '-65000000-01-01'` with equal success.
  *   **The "Now":** "Now" is an indexical label applied at the application layer (the query), not a property of the data. It is equivalent to a user passing a parameter `@view_date` to a stored procedure. The data itself does not know which slice is "present."

  #### 2. Presentism $\rightarrow$ The Materialized View with Aggressive GC
  Presentism maps to a system that maintains only a single materialized view of the current state, coupled with a garbage collection policy that physically obliterates history.
  *   **The Schema:** A standard OLTP table representing current state. No history tables, no versioning columns, no event log.
  *   **Time:** There is only `transaction_time = NOW()`. `valid_time` is collapsed; the only valid time is the current system clock.
  *   **Existence:** `SELECT * FROM past_events` returns empty or throws an error. To query the past is to query a dropped table.
  *   **The "Now":** The system clock *is* the ontology. As the clock ticks, the previous state is overwritten (UPDATE) rather than versioned (INSERT). The previous bits are physically flipped on the disk platter or SSD cell.

  ---

  ### The Residue Report

  Here is where the abstraction leaks. You asked if the Presentist intuition that the past is *gone* survives translation, or if it collapses into *not in the current snapshot*.

  #### 1. Clean Mappings
  *   **Eternalism $\leftrightarrow$ Event Sourcing:** This is a near-perfect isomorphism. The "Block Universe" is literally an immutable log. The philosophical claim that "Caesar's death is as real as my typing this" maps to "The `UserCreated` event from 2010 has the same persistence guarantees as the `UserLoggedIn` event from 2024."
  *   **Indexicality $\leftrightarrow$ Query Parameters:** The Eternalist claim that "Now is like Here" maps perfectly to SQL. `NOW()` is a function, not a constant. You can query any time slice if you have the data.

  #### 2. Distortions Required
  *   **Presentism $\leftrightarrow$ Logical Deletion:** To make Presentism work in a DB, you have to distort the definition of "addressable." In most production DBs, even if you `DELETE` a row, it exists in the transaction log, the backup stack, or the undo tablespace until vacuumed.
      *   *The Distortion:* You must assume a storage engine where `UPDATE` physically destroys the previous bits without journaling. You have to ignore the WAL (Write-Ahead Log). If the WAL exists, the DB is secretly Eternalist, even if the schema is Presentist.
  *   **The "Open Future" $\leftrightarrow$ NULL Constraints:** Presentism often claims the future does not exist (it is open/indeterminate). In DBs, the future is usually represented by `NULL` in a `end_date` column or a lack of events. However, in a DB, the *capacity* for the future exists (the schema allows new rows). Presentism requires the *ontological* capacity to be non-existent until it happens. This is hard to model; a DB table always has the *potential* for rows, whereas a Presentist universe says the future has no being at all.

  #### 3. The Leftover (The "Gone" Intuition)
  This is the critical failure point of the translation.

  **The Problem:** In your framework, "exists" = "is addressable in a query."
  *   **Eternalism:** Past is addressable.
  *   **Presentism:** Past is not addressable.

  **The Residue:** In database architecture, "not addressable" is a **permission/access state**, not an **ontological state**.
  If I `DROP TABLE history`, the data is gone from the *schema*, but the DBA can restore it from S3 backups. If I `UPDATE users SET status='active'`, the old value is gone from the *page*, but it might still be in the WAL.

  For the Presentist, the past isn't just "unqueryable"; it is **physically unreal**. There is no backup tape in the sky.
  *   **DB Reality:** Data persists until actively destroyed, and even then, traces remain (magnetic remanence, wear leveling on SSDs).
  *   **Presentist Reality:** The past ceases to be.

  **Does the intuition survive?**
  No. It collapses into "not in the current snapshot."
  Why? Because to implement Presentism in a computer, you need a machine to do the deleting. That machine exists *now*. The log of what was deleted exists *now* (in the GC logs). The entropy increase from the deletion exists *now*.
  You cannot build a Presentist database because the hardware required to maintain the "Present" state inherently creates an Eternalist trail of transactions (WAL, logs, backups, cache coherency protocols).

  #### 4. Verdict: Sloppy Philosophers or Inexpressible Framework?

  It is not that philosophers are sloppy; it is that **Database Design is inherently Eternalist.**

  *   **The "Moving Now":** Presentism relies on a "Moving Spotlight"—the property of *presentness* moves along the timeline. In DBs, there is no moving pointer that updates the universe. The `sysdate` function returns a value, but the storage engine doesn't change its nature based on that value.
  *   **The Residue:** The leftover is **Temporal Passage**.
      *   In DBs, time is a dimension (B-Tree key).
      *   In Presentism, time is a mechanism of ontological destruction.

  **Conclusion:**
  Your framework cannot represent Presentism without lying about the infrastructure.
  If you define "exists" as "addressable," Presentism becomes merely **Snapshot Isolation** (I can only see committed rows at T-Now). But Snapshot Isolation is a consistency guarantee, not an ontology. The data at T-1 still exists on disk; I'm just prevented from seeing it to ensure consistency.

  Therefore, the Presentist intuition that the past is *gone* does not survive translation. It degrades into **Access Control**.
  *   **Eternalism** is the native state of information systems (logs, history, versioning).
  *   **Presentism** is a UI optimization (Materialized Views) layered on top of an Eternalist storage engine.

  If you force the metaphor, Presentism claims the WAL doesn't exist. Since a DB without a WAL is unsafe/corruptible, Presentism maps to **Data Loss**. The philosophers aren't being sloppy about "existence"; they are asserting a physical reality (the destruction of the past) that our information architecture is explicitly designed to prevent. We build databases to *resist* Presentism.
