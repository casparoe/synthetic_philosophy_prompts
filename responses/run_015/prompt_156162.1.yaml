          *   *Why:* Maybe wild lives are net positive? Or uncertainty implies caution (Pascal's Wager).
          *   *Cost:* User wants to keep this.
      *   **Option D: The "Intervention Risk" (Uncertainty).**
          *   Ecosystems are complex. Reducing one species might explode another (predator release).
          *   *Cost:* Practical, not theoretical.

      *   **Focus on the User's specific hunch:** They think (3) to (5) hides a trick.
