  *(Refining the "Talent" point)*: This is the strongest point the user made. I need to validate that heavily. In a race, we assume everyone has the *capacity* to run. In the economy, "marketable talent" is unevenly distributed and largely luck-based. LE says compensate for that. The race analogy hides this.

