answer: |-
  Stage 1 — preparation

  *   **Marcus's Considerations:**
      1.  **Long-run dominance:** Over many independent trials, EU maximizers outperform rivals with probability approaching one.
      2.  **Dynamic consistency:** Violating the sure-thing principle leads to ex-ante rejected plans when acting sequentially.
      3.  **Self-endorsement:** EU maximization recommends itself upon reflection; rival rules often do not.
      *   *Independence:* Empirical performance vs. logical consistency vs. reflective stability.
  *   **Thea's Considerations:**
      1.  **Substantive risk sensitivity:** Tail outcomes matter differently than probability-weighted utility suggests.
      2.  **Exploitability as cost:** Being pumped is a financial cost, not a logical contradiction (like refusing blackmail).
      3.  **Aggregation failure:** Enriching consequences to include "risk run" breaks separability across decisions.
      *   *Independence:* Normative intuition vs. pragmatic classification vs. structural math.
  *   **Genuine Disagreements:**
      1.  Whether exploitability implies irrationality or merely cost.
      2.  Whether risk attitudes are separable from utility over outcomes.
      3.  Whether dynamic consistency requires EU structure.
      4.  Whether consequence enrichment preserves the long-run argument.
  *   **Relabeling Moves:** Defining "consequences" to include "having chosen riskily" (Marcus); defining "rational" to exclude costly principles (Thea). Both flagged to prevent trivial dissolution.
  *   **Concessions:** Marcus concedes exploitability is a cost *ceteris paribus* (costs him absolute prohibition). Thea concedes intransitivity is indefensible (costs her cyclical preference models).

  ***

  Stage 2 — dialogue

  The espresso machine hissed, filling the silence between Marcus and Thea. They sat in the corner of the faculty lounge, the remnants of the colloquium still hanging in the air.

  "Let's strip away the axioms," Marcus said, stirring his coffee. "The pragmatic case stands on two legs. First, the long-run. Suppose you face a thousand independent decisions, each a coin flip: heads you gain $100, tails you lose $50. Expected utility says take it. A max-min rule says refuse. Over a working life, the EU agent ends up roughly $50,000 ahead. The risk-averse agent ends at zero. The probability that the EU agent outperforms approaches one. That isn't an axiom; it's arithmetic."

  Thea leaned back. "That arithmetic relies on independence and aggregability. Suppose instead the losses are correlated. If tails hits once, it hits everywhere—a career-ending crash. Now the long-run argument collapses because there is no long run; there is only one ruin event. But I will concede something upfront: if my preferences are intransitive—A preferred to B, B to C, C to A—I am indefensible. I would pay a fee to have those preferences fixed. Intransitivity is a bug, not a feature."

  "Good," Marcus said. "But dynamic consistency is the second leg. Imagine you plan at time zero to take a bet at time one if condition X holds. But when X actually holds, you refuse. You've steered yourself toward a distribution you rejected ex-ante. You've guaranteed a loss relative to your own prior plan. That's not just bad luck; it's self-sabotage."

  "You're framing exploitability as a logical contradiction," Thea countered. "I frame it as a cost. Yes, a money pump drains resources. But so does refusing to pay a blackmail demand. We don't call the blackmailee irrational for refusing to pay; we say they bear a cost to maintain a principle. My principle is tail-protection. If someone pumps me for $5 to avoid a one-in-a-million catastrophe, that's an insurance premium, not a refutation."

  "Who is the bookie?" Marcus asked. "In the real world, the exploiter isn't a guy in a trench coat; it's the market. It's an anonymous mechanism that extracts value from inconsistency. And precommitment isn't free. You can't always bind your future self without paying legal or psychological costs. Being the sort of agent who gets exploited is a cost denominated in the very currency you care about: outcomes. So, state your rule as a functional. How do you calculate value?"

  "I weight the probability of bad outcomes directly," Thea said. "I don't fold risk into the utility of money. I use a weighting function that overweights the bottom decile. Plus, I admit menu-dependence. I am worse off for having been offered a risky option, even if I don't choose it, because the mere presence of the risk induces anxiety. My utility depends on the menu, not just the chosen outcome."

  Marcus shook his head. "If all your concerns are fixed by the total consequence—the whole history, including whatever risks you ran—then your ranking over histories is represented as the expectation of some utility index. You've just moved the risk sensitivity into the description of the outcome. 'Getting $100 via a risky path' is a different outcome than 'Getting $100 via a safe path.' Once you fix the history, the pump applies at that level. You're back to expected utility over histories."

  "That's the no-free-consequences objection," Thea said. "To make my risk-sensitivity consequentialist, you have to enrich the consequence space until 'the risk I ran' is a coordinate. But coordinates indexed to individual decisions do not aggregate across decisions. Here is the break: Suppose Decision 1 involves a 10% risk of ruin. Decision 2 involves a 10% risk of ruin. If I treat risk as a consequence, the disutility of running risk in Decision 2 might depend on whether I ran risk in Decision 1. If I already survived one risk, the second feels safer, or perhaps compounding risk feels exponentially worse. The enriched objective's ranking is not the sum of the per-decision scores. You cannot have rich consequences and across-decision separability. Pick one."

  "Consider two decisions," Marcus pressed. "Decision 1: Invest or Save. Decision 2: Invest or Save. If your risk disutility compounds non-linearly, say, cost is squared, then the total cost of two risks is 4, not 2. But the long-run argument can be restated over life-histories. Maximize the expectation of your real intertemporal objective. It doesn't need narrow per-decision separability. It just needs you to maximize the expectation of the total history utility. If your concerns are decision-indexed rather than history-level, you aren't a consequentialist at all. And here is the fixed-point: expected utility maximization is self-endorsing. If you ask an EU agent whether she should use EU next time, she says yes. A rule that does not endorse itself on reflection is unstable."

  "Self-endorsement is cheap," Thea replied. "Satisficing at a threshold is self-endorsing under its own standard. Tail-minimizing is self-endorsing. Reflective stability selects nothing unless you assume the standard of reflection is expected utility. And regarding exploitability: promise-keepers are exploitable. People who refuse to pay blackmail are exploitable. It is a cost to be weighed, not a refutation. The pragmatic case is at best *ceteris paribus*."

  Marcus paused, looking into his cup. "I concede that point. Exploitability is a cost *ceteris paribus*. If the cost of becoming coherent exceeds the cost of remaining pumpable, you should remain pumpable. But the weighing is itself a decision that the coherence arguments constrain. You must weigh consistently. So I ask you: name a single case in which the cost of becoming coherent exceeds the cost of remaining pumpable. Not in theory, but in the actual structure of your choices."

  "The cost of monitoring consistency," Thea said immediately. "Cognitive load. If I spend all day ensuring my risk weights sum correctly across menus, I miss the opportunities those menus offer. Sometimes the pump is cheaper than the accountant."

  "But the accountant is you," Marcus said. "If you cannot trust your future self to weigh the costs correctly, you need the rule. And if you can trust yourself to weigh the costs correctly, you can trust yourself to maximize expected utility. The gap closes."

  "The gap is where the risk lives," Thea said, standing up. "You see a gap to be closed; I see a space to be protected."

  "And who protects you from the pump?" Marcus asked.

  "The same thing that protects me from the blackmail," Thea said. "The willingness to pay."

  She left her cup on the table. Marcus watched her go, then looked down at his notes, where the numbers still added up perfectly, except where they didn't.
