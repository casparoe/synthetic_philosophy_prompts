      *   The "Sleepwalkers" (Christopher Clark, 2012) argues all powers were complicit in a crisis they didn't fully understand.
      *   The "Structuralist" view argues imperialism, alliances, and mobilization schedules made war inevitable regardless of intent.
      *   *Constraint:* Museum copy needs to be concise, accurate, and educational without igniting a political firestorm or simplifying too much.

  3.  **Drafting the Specifications (The "Spec"):**
      *   *Requirement 1: Counterfactual Robustness.* A theory must explain not just what happened, but what could have stopped it. (Case: The July Crisis decisions).
