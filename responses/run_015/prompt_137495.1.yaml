      *   *Requirement 3: Temporal Scope.* It must define *when* responsibility accrued. (Case: 1914 decisions vs. 1890s alliance building).
      *   *Requirement 4: Archival Independence.* It shouldn't rely solely on one nation's surviving records. (Case: German records burned vs. French/Diplomatic cables).
      *   *Requirement 5: Moral vs. Causal Clarity.* It must distinguish "caused" from "blamed."

