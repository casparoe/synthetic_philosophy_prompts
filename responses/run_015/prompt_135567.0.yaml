  *(Refining the Toy)*: The user's toy uses a fixed function for $Z$. I should note that this hardcodes supervenience. A better toy might treat $Z$ as a stochastic node or just a label, but the detached tensor is the clearest causal analogue. I will stick with their toy but critique the "fixed function" aspect.

  *(Final check on Advisor)*: The advisor says the paradox dissolves. I need to argue that it dissolves the *causal* puzzle but leaves the *epistemic* puzzle intact. The ML framework is naturalistic; the philosophical problem is often normative.

