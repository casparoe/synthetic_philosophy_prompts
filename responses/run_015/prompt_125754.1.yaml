answer: |-
  Dear friend,

  It is a pleasure to engage with this argument, because you have effectively reconstructed a version of the overgeneration objection that haunts many indispensability arguments in the philosophy of physics. You are right to feel that if the reasoning holds, it proves too much, and your intuition that step eight reveals a flaw is correct. The argument is valid, meaning the conclusion follows from the premises, so to block the absurd result in step seven while preserving your desired conclusion in step four, you must reject one of the earlier premises. The step you should give up is premise three, and the reason it looked sound is that it conflates predictive indispensability with ontological fundamentality in a way that ignores the specific role of probability in scientific modeling.

  Premise three claims that if a quantity is indispensable for predictions, it cannot encode ignorance and must answer to something in the world. This principle is too strong because it fails to distinguish between the mathematical machinery required to calculate probabilities and the physical state those probabilities describe. In classical statistical mechanics, the probability distribution over microstates is indeed indispensable for making macroscopic predictions about gases, yet almost everyone agrees it represents our ignorance of the precise microstate, not a physical fluid smeared out over phase space. The predictive success of statistical mechanics is not a miracle; it is explained by the law of large numbers applied to the underlying ontic microstates. If you keep premise three, you are forced to say that the probability distribution in statistical mechanics is a physical object, which leads directly to your unwanted conclusion in step six. By rejecting premise three, you acknowledge that a mathematical object can be indispensable for prediction without being a fundamental constituent of reality, allowing you to maintain that the wavefunction is ontic for reasons other than mere predictive indispensability.

  You asked what it costs to give up premise three. The cost is that you lose the simple, generic realist argument that works for electrons or fields and applies it to the wavefunction. You can no longer say the wavefunction is real simply because we need it to predict measurement outcomes, since we also need probability distributions to predict gas behavior without believing those distributions are real. Instead, you must rely on arguments that are specific to the unique structure of quantum theory. This brings us to your question about whether there is a way to reach conclusion four without reaching conclusion seven. There is, but it rests on something more specific than indispensability, namely the Pusey-Barrett-Rudolph theorem, often called the PBR theorem. Unlike your friend's argument, which relies on general scientific realism, the PBR theorem attempts to show that if the wavefunction were merely epistemic, representing ignorance about some underlying physical state, then quantum mechanics would make predictions that contradict experimental results. It argues that distinct quantum states must correspond to non-overlapping distributions over physical reality, implying the wavefunction is fixed by the physical state.

  However, I must be careful to distinguish what is settled in the field from what is genuinely contested, as you requested. It is not settled that the wavefunction is ontic. While many physicists and philosophers lean toward psi-ontism, there is no consensus, and psi-epistemic models remain a live area of research. The PBR theorem itself is not considered a final proof by the community because it relies on assumptions that are contested, particularly an assumption called preparation independence, which some argue is not justified in all interpretations of quantum mechanics. Furthermore, the definition of what it means for the wavefunction to be ontic is itself a matter of debate. Some argue that even if PBR holds, it only shows the wavefunction is real in a specific technical sense that does not rule out all forms of epistemic interpretation. In contrast, it is largely settled among philosophers of science that classical probability distributions in statistical mechanics are epistemic, representing ignorance rather than physical stuff, which is why your reductio works so well against the generic indispensability argument.

  So, to summarize the path forward for your position. You should tell your friend that premise three is false because indispensability for prediction does not rule out epistemic status, as evidenced by the standard treatment of probability in classical physics. To defend the claim that the wavefunction is ontic, you should pivot away from general indispensability and toward the specific structural features of quantum theory that distinguish it from classical statistical mechanics. You can cite the PBR theorem as the stronger argument for your view, but you must acknowledge that this theorem is not universally accepted as conclusive because its assumptions are contested. By making this move, you avoid the collapse of the ontic-epistemic distinction and preserve the nuance that allows scientific theories to use mathematical tools to represent ignorance without committing to those tools as physical entities. This preserves the distinction you value in step eight while allowing you to argue for step four on more robust, quantum-specific grounds.

  I hope this helps clarify where the tension lies and gives you the resources to refine your position. It is a subtle debate, and your reconstruction of the argument shows you have a firm grasp of the stakes involved.

  Best regards,

