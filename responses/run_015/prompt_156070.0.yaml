answer: |-
  This is an exceptionally clean reconstruction of the "Futarchy Creep" argument. Your friend has effectively formalized the intuition that if you take epistemic consequentialism seriously, it is hard to stop it from consuming the democratic constraints meant to cabin it.

  You are right to reject the conclusion. A system that selects its own objective function via forecast is not a government; it is a runaway optimization process. However, your friend is also right that the standard "values vs. facts" rebuttal (his defense of step 5) is too convenient. As you note, choosing a welfare metric $W$ (e.g., GDP vs. GNH vs. Carbon Stability) has massive causal consequences. Treating $W$ as purely normative ignores that constitutional choices are empirical bets about what kind of world is sustainable.

  Here is the diagnosis you asked for, separating the parity worry from the reflexivity worry, pricing the alternatives, and identifying the precise point of failure.

  ### 1. The Diagnosis: Where the Argument Breaks

  The argument fails at **Step (5)**, but not for the reason your friend gives. It fails not because $W$ is a "value" and $P$ is a "belief," but because **$W$ is a parameter of the mechanism, while $P$ is a variable.**

  **Why (5) looked sound:**
  It relies on an equivocation in Step (3). Step (3) claims markets are the best estimators of interventional quantities $E[W | do(P)]$. This is true *only conditional on a fixed settlement condition*. A prediction market on "Will Policy P pass?" settles based on a defined rule. A market on "Will GDP rise?" settles based on a defined metric of GDP.
  Step (5) treats the choice of $W$ as just another intervention $P$. But you cannot run a market to select $W$ without already having a meta-metric $W^*$ to settle the bets on $W$.
  *   If you settle the "$W$-market" using $W$, you have circularity (pricing $W$ in terms of $W$).
  *   If you settle the "$W$-market" using $W^*$, you haven't solved the problem; you've just pushed the question of the objective function up one level.

  **The Technical Flaw:**
  Prediction markets are *measurement devices*. They measure probability relative to a settlement rule. They cannot generate their own settlement rule. To ask a market to choose $W$ is to ask a thermometer to choose the temperature scale. It can tell you if it's 100 degrees, but it cannot tell you whether you *should* be measuring in Fahrenheit or Celsius, because the reading "100" has no meaning until the scale is fixed exogenously.

  Therefore, **(3) does not support (5)**. (3) supports the claim that markets are optimal *given* $W$. It cannot support the claim that markets are optimal for *selecting* $W$, because the mechanism ceases to function without $W$ already selected.

  ### 2. The Role of Premise (1): The Engine of the Creep

  While (5) is the technical break, **(1) is the philosophical vulnerability.**
  Premise (1) asserts that decision procedures are assessed *solely* by the expected value of outcomes. This is a purely instrumentalist view of governance. If (1) is true without qualification, then *any* constraint on the market (like "voters must choose $W$") is suspect, because it might lower expected $W$.

  To save your project, you must modify (1) to include a **lexical priority constraint**.
  *   *Revised (1):* A decision procedure is assessed by expected outcomes, *subject to the constraint that the objective function $W$ is authorized by the demos.*
  *   Why this works: It acknowledges that democratic legitimacy is not just an input to welfare; it is a *constitutive condition* of the welfare function. In political theory terms, it distinguishes between *ordinary politics* (maximizing $W$) and *constitutional politics* (defining $W$). Markets are tools for ordinary politics; they lack the normative capacity for constitutional politics.

  If you keep (1) as written, you cannot block (5) without appearing arbitrary. You must admit that "outcome maximization" is not the *only* virtue of a government; "authorship" is another.

  ### 3. The Parity Worry (5 & 5') vs. The Reflexivity Worry (7)

  You suspected these were independent. They are.

  **The Parity Worry (5 & 5'):**
  *   **The Claim:** If markets are best for $P$, why not for $W$? Why not for the rule itself?
  *   **The Resolution:** As argued above, $W$ is a parameter, not a variable. Regarding (5') (Epistocracy): This is actually a stronger argument against markets than for them. If the goal is just $E[W]$, and a panel of experts estimates $P$ better than a market (perhaps because markets are thin or manipulable), (1)-(3) *do* imply epistocracy.
  *   **The Fix:** You must defend (4) not just on empirical grounds (voters are ignorant) but on *normative* grounds. The "expressive voting" point is good, but it needs to be bolstered by the claim that *who decides W* matters intrinsically, not just instrumentally. If you concede (1) fully, you *must* accept epistocracy if the experts are better. To avoid this, you must argue that the *process* of voting on $W$ creates a form of compliance or stability that expert rule does not, which feeds back into $W$.

  **The Reflexivity Worry (7):**
  *   **The Claim:** A market cannot price its own authority without circularity.
  *   **The Resolution:** This is a Gödelian limit. A system cannot contain its own truth predicate. A market rule $M$ cannot use $M$ to validate $M$.
  *   **Independence:** Even if you fix (5) by voting on $W$, (7) remains. You cannot use a futarchical market to decide "Should we use futarchy?" because the market's prices depend on the rule being in place.
  *   **The Fix:** This requires a **constitutional layer** outside the mechanism. The decision to use markets must be made by a procedure that is *not* a market (e.g., a vote, a tradition, a constitution). This validates your intuition that the "decoupling patch" (consultative markets) is actually the only stable position. If the market advises but does not decide, the reflexivity loop is broken. The market becomes an information input to a political decision, rather than the decision procedure itself.

  ### 4. Pricing the Alternatives

  **Option A: Bite the Bullet (Market Epistocracy)**
  *   **Cost:** High. You accept that $W$ is chosen by traders.
  *   **Consequence:** Traders will arbitrage the definition of $W$. If $W$ is "GDP," they will bet on policies that inflate GDP numerically while destroying value. If $W$ is "Market Cap," they will bet on centralization. Without an exogenous anchor, $W$ becomes endogenous to the traders' positions. This leads to **Goodhart's Law on a civilizational scale**: once a measure becomes a target, it ceases to be a good measure.
  *   **Verdict:** Unstable. The market collapses because the settlement condition is manipulable by the traders.

  **Option B: Reject (3) (Markets aren't special)**
  *   **Cost:** Medium. You lose the specific argument for futarchy.
  *   **Consequence:** You retreat to generic epistemic democracy. This is safe but abandons the specific engagement with market mechanisms.
  *   **Verdict:** Unnecessary. You can keep (3) as "Markets are good estimators *conditional on W*."

  **Option C: Reject/Qualify (1) (Consequentialism has constraints)**
  *   **Cost:** Low (for your project). You are a political theorist; you are allowed to posit normative constraints.
  *   **Consequence:** You preserve democracy's role in setting $W$. You admit that legitimacy is a side-constraint on efficiency.
  *   **Verdict:** **Recommended.** This allows you to keep (2), (3), and a modified (4).

  **Option D: The Decoupling Patch (Consultative Markets)**
  *   **Cost:** Low. It reduces markets from a *decision rule* to an *informational input*.
  *   **Consequence:** This admits your friend is wrong about (4). Markets do not *pick* $P$; they inform the electorate/legislature who picks $P$.
  *   **Verdict:** **Most Robust.** This solves (7) immediately. It also solves (5) because the market is no longer asked to settle $W$; it is asked to forecast $W$ *as defined by voters*. This aligns with your desire to keep the "expressive voting" point.

  ### 5. What Would Change My Mind (Confidence & Falsification)

  **Least Confident Rejection:**
  I am least confident in rejecting **(1)** outright. There is a strong tradition (utilitarian, effective altruist) that argues normative constraints are just "rules of thumb" for maximizing outcomes. A sophisticated futarchist might argue that we should *vote* on $W$ today only because markets aren't ready to price $W$ yet, but in principle, (1) should hold.
  *   *Why I still reject it:* Even if (1) is true in the abstract, the *identification problem* in (7) makes it impossible to implement (1) fully. You cannot maximize $W$ if you cannot define $W$ without circularity.

  **Considerations That Would Relocate the Break:**
  1.  **A Mechanism for Endogenous Settlement:** If you could show a mechanism design where $W$ is settled not by definition but by a *meta-market* that is logically distinct from the $P$-market (e.g., a recursive betting system that converges on a stable metric without external input), then (5) would stand. I suspect this is impossible (infinite regress), but if a formal proof existed, my diagnosis would fail.
  2.  **Causal Identification in (3):** If it turned out that prediction markets *cannot* estimate $E[W | do(P)]$ without randomized control trials (which governance rarely allows), then (3) fails. If markets only estimate $E[W | P]$ (observational), then they are subject to confounding (e.g., markets predict recession when opposition wins, not because opposition causes recession). If (3) is false, the whole argument collapses to "markets are just polls with money."
  3.  **The "Decoupling" Instability:** If you find a case where "consultative markets" inevitably become "decisive markets" due to political pressure (e.g., legislators are blamed for ignoring the market price), then the decoupling patch is unstable. This would force you back to rejecting (1) more harshly: you must legally forbid obeying the market to save the system.

  ### Summary Recommendation for Your Work

  1.  **Hold (2) and (3):** Markets are excellent at estimating causal effects *conditional on a fixed metric*.
  2.  **Modify (1):** Add a lexical priority for democratic authorization of the metric $W$. This blocks (5) without relying on a shaky value/fact distinction.
  3.  **Accept the Decoupling Patch:** Argue that (4) should be revised. The division of labor is not "Vote $W$, Market $P$." It is "Vote $W$ and $P$, informed by Market on $E[W|P]$." This solves the reflexivity problem (7) and acknowledges that markets are inputs to sovereignty, not replacements for it.
  4.  **Concede (5'):** Admit that if the goal were *purely* outcome maximization, epistocracy would be superior. This strengthens your democratic theory by forcing you to argue why *democratic authorship* is itself a component of $W$, not just a tool for achieving it.

  Your friend's argument is a *reductio ad absurdum* of pure instrumentalism. Do not try to fix the market; fix the premise that the market is the master rather than the servant of the polity.
