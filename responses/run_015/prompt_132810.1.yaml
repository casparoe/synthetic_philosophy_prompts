      *   (6) **Upamāna & Similarity:** *Upamāna* yields knowledge of a similarity relation (*sambandha*). This relation is *not* a particular or a universal tracked by *anumāna*. *However*, similarity *is* nothing over and above shared properties (*sādhāraṇa dharma*), which *is* what *anumāna* tracks.
      *   (7) **No Circularity:** No *pramāṇa* certified by itself. One can defeat another without prior external certification.

