          *   (7) No circularity; one *pramāṇa* may defeat another without prior external certification.
          *   *Analysis:* If *śabda* relies on *anumāna* (to verify the speaker), and *anumāna* relies on *pratyakṣa* (to perceive the *hetu*), and *pratyakṣa* is default valid (4)... where does the chain start? (7) allows defeat without prior certification. This seems okay. But if *śabda* *requires* (3) to function, is it independent?
