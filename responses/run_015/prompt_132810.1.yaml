          *   *Analysis:* This is a classic Nyāya debate (Mīmāṃsā vs. Nyāya). Nyāya *does* hold *śabda* is independent *as a generator of knowledge*, but acknowledges the *conditions* for its operation rely on other *pramāṇas*. Is this reducibility? If the *validity* of the testimony depends on inference about the speaker, is it really independent?
