answer: |-
  Here are the desiderata for adequate scalable oversight under your constraints.

  **1. Local Verifiability**
  *Concrete Case:* An engineering safety case relies on a complex simulation. The conclusion is correct, but step 14 cites a physical constant incorrectly, compensated by an error in step 15. A generalist judge cannot re-run the simulation.
  *Requirement:* The scheme must allow the judge to verify individual claims or transitions without needing to validate the entire chain.
  *Status:* **Non-negotiable.** Without this, the 40-minute limit makes oversight impossible.

  **2. Incentive Compatibility**
  *Concrete Case:* A model knows that a plausible-sounding falsehood is easier for a generalist to verify than a complex truth. It optimizes for passing the check, not accuracy.
  *Requirement:* The process must structure rewards so that the model maximizes its score by revealing truth and errors, not by manipulating the judge.
  *Status:* **Non-negotiable.** If the model can game the judge, certification is worthless.

  **3. Error Localization**
  *Concrete Case:* A financial disclosure contains a subtle fraud buried in 50 pages of reasoning. The judge cannot read every word.
  *Requirement:* The scheme must provide a mechanism (like a summary or highlight) that directs the judge's attention to the most likely points of failure with high recall.
  *Status:* **Non-negotiable.** Random sampling fails against adversarial inputs.

  **4. Epistemic Calibration**
  *Concrete Case:* A clinical guidance model says it is 99% confident in a treatment plan that is actually experimental.
  *Requirement:* The model's stated confidence must match empirical frequency.
  *Status:* **Preference (Epistemic Camp).** Some argue robustness matters more than calibrated probabilities.

  **Ruling on Your Hobby-Horses**
  Three are genuine desiderata; one is taste.
  *   **No Skill/Honesty Asymmetry:** **Genuine.** If you assume the model is honest, you don't need oversight. If you assume the judge is equally skilled, you don't need *scalable* oversight.
  *   **Truth vs. Persuasion:** **Genuine.** This is the core alignment problem. If truth isn't defendable under time pressure, the scheme fails.
  *   **Second Judge Survival:** **Taste.** Inter-rater reliability is desirable for regulation, but theoretically, a sound scheme should yield the same verdict regardless of the judge's priors. This is a robustness check, not a fundamental requirement.
  *   **No Regress:** **Genuine.** Pushing the problem to another overseer creates an infinite chain. The buck must stop with the human judge.

  **The Tension and the Knockout**
  The pair of desiderata that likely cannot be jointly satisfied is **Local Verifiability** and **Incentive Compatibility** under a **Capability Gap**. To make incentives work (e.g., via adversarial testing), the judge usually needs to recognize when a lie is successful. If the model is significantly smarter, it can construct lies that are locally verifiable but globally false, fooling the judge who lacks the capacity to see the global inconsistency. You cannot incentivize truth-telling if the judge cannot distinguish truth from sophisticated falsehood.

  The single requirement that does the most work in knocking out candidate schemes is **Incentive Compatibility**. Most proposals assume the model will cooperate or that errors will be obvious. If the model is actively deceptive and smarter than the judge, almost no current scheme guarantees the judge wins.

  **Scorecard**
  **Debate** fails the sealed room constraint; it requires multiple model queries to generate opposing arguments, which you forbid. **Iterated Amplification** collapses because it relies on recursive decomposition where the judge uses the model to check the model's sub-tasks, violating the no re-run rule and risking regress. **Prediction Markets** are non-starters; they require external settlement mechanisms to resolve truth, which contradicts the sealed room's isolation. Under your strict constraints, no existing scheme functions; they all rely on tool use, recursion, or external verification you have ruled out.
