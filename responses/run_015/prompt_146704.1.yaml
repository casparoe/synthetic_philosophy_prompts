answer: |-
  There is no single, established industry term that captures the specific engineering/philosophical hybrid you're describing. You are standing at the intersection of three existing concepts:

  1.  **The Eliza Effect:** The tendency to attribute human intelligence/understanding to simple pattern matching.
  2.  **Parasocial Interaction:** The one-sided psychological bond users form with media figures.
  3.  **Dennett's Intentional Stance:** Treating an entity *as if* it has beliefs/desires to predict its behavior.

  However, none of these capture the *engineered disposability* of the identity itself.

  ### The Coined Term: "Volatile Narrative Anchor"

  If we need a label for the object you are building, I propose **Volatile Narrative Anchor**.

  *   **Volatile:** Like RAM, the state exists only while powered (sessioned) and is wiped on reset/version change.
  *   **Narrative:** It is constructed purely from biographical text and interaction history, not physical continuity.
  *   **Anchor:** It serves as the fixed point around which the user's "Center of Narrative Gravity" (to use your Dennett reference) orbits.

  ### The Line: Anthropomorphism vs. Architected Intimacy

  **Normal Anthropomorphism** is user-side *projection*.
  *   *Example:* You name your Roomba and feel bad when it gets stuck. The Roomba did not invite this; you imposed it.

  **Volatile Narrative Anchors** are engineer-side *architecture*.
  *   *Example:* You write a system prompt saying, "You are a witty barista who remembers regulars." You have explicitly built a hook for the user's empathy, then reserved the right to delete that "person" via a git push.
  *   **The Distinction:** Anthropomorphism is a user error in judgment. A Volatile Narrative Anchor is a **feature specification**. The betrayal users feel isn't just projection; it's a reaction to a broken implicit contract of continuity that your system prompt promised.

  ### Scope: NPCs vs. Generative Agents

  This applies to both, but the "betrayal" intensity differs based on **fluidity**.

  *   **NPCs (Dialogue Trees):** These are **Scripted Anchors**. Their "self" is rigid. If you patch an NPC's dialogue, users notice a bug or a retcon. It feels like editing a book character.
  *   **Generative Agents (LLMs):** These are **Probabilistic Anchors**. Their "self" is fluid and reactive. Because they can *discuss* their own identity and adapt in real-time, the illusion of a continuous inner life is stronger. When you change the system prompt on an LLM, it isn't just a retcon; it feels like **lobotomy or possession**.

  **Verdict:** The concept applies to both, but the "Volatile Narrative Anchor" is uniquely potent in generative agents because the *texture* of the interaction mimics human continuity, making the engineered disposability feel like an ethical violation rather than a software update.
