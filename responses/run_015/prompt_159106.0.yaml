  8.  **Self-Correction/Nuance Check during Drafting:**
      *   *Correction:* Make sure not to conflate Burke with Chesterton too much. They are allied but distinct. Chesterton is more paradoxical/witty; Burke is more political/organic. The prompt asks if readings are "Genuinely Burkean." I need to be careful there. Burke emphasizes prescription and prejudice (in the neutral sense). Chesterton emphasizes common sense and mystery.
      *   *Correction on Friend's Conclusion:* The friend says "must identify original rationale." This is a very specific claim. Most readings of Chesterton's Fence actually contradict this (Chesterton says know the *use*, not the *history*). I need to highlight this discrepancy strongly.
