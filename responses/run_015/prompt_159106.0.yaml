  2.  **Deconstruct "Chesterton's Fence":**
      *   *Source:* G.K. Chesterton, *The Thing* (1929).
      *   *Quote:* "There exists in such a case a certain institution or law; let us say, for the sake of simplicity, a fence or gate erected across a road. The more modern type of reformer goes gaily up to it and says, 'I don't see the use of this; let us clear it away.' To which the more intelligent type of reformer will do well to answer: 'If you don't see the use of it, I certainly won't let you clear it away. Go away and think. Then, when you can come back and tell me that you do see the use of it, I may let you destroy it.'"
      *   *Core Idea:* Don't destroy institutions without understanding their function.
      *   *Nuance:* Chesterton emphasizes *understanding the use*, not necessarily the *historical intent*. However, popular usage often conflates function with original intent.

  3.  **Drafting the Menu of Theses:**
      *   I need to categorize them logically. The user suggested separating "Original Purpose" from "Present Effects." I will structure the menu around these two axes, plus a third category for "Procedural/Epistemic" readings.

      *   *Category 1: Original Purpose/Historical Intent (The Friend's Reading)*
