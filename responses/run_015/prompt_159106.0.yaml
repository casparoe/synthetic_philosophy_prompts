          *   Burkean? Superficial (Burke cared about prescription/tradition, not specific founder intent).
          *   Supports Friend? Yes.
          *   Forbids Experiment? Yes, usually.

      *   *Thesis 2 (Functional/Hidden):*
          *   Claim: It serves a function we don't see.
          *   Status: Substantive.
          *   Burkean? Yes.
          *   Supports Friend? Partially (need to know function, not necessarily original intent).
          *   Forbids Experiment? No, allows testing.

      *   *Thesis 3 (Evolutionary/Survival):*
          *   Claim: Survival proves value.
