      *Note:* This looks very much like Timothy Williamson's argument against Luminosity in *Knowledge and Its Limits*, combined with a skeptical twist. The "Lamp Principle" is essentially the claim that knowledge is luminous (or close to it). The argument shows Safety + Externalism (No Halos) $\rightarrow$ $\neg$ Luminosity. The office mate is using the failure of Luminosity to drive skepticism via the Lamp Principle.

