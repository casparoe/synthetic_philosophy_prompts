  3. The propensity view interprets the statistic as a physical disposition of the Clark family's specific circumstances, but there is no repeatable chance setup here to ground such a chance. This leads to the settled conclusion that propensities are inherently unauditable after the fact since one observes only the outcome, never the chance itself.

  4. Your intuition is largely correct that single-event auditability fails for frequentism and propensity, but it is a live dispute whether subjectivism's reliance on scoring rules constitutes genuine verification or merely consistency checking. Demanding single-case auditability is widely regarded by philosophers of probability as a category error none of the three interpretations can meet.

  5. Thinking in these terms reclassifies the miscarriage of justice from a calculation error to a category mistake, where an unauditable theoretical construct was presented as empirical fact. It is settled among statisticians that such probabilities are inadmissible without contextual priors, though judicial standards for admissibility remain disputed.
