      *   *Fact:* Thresholds exist (e.g., 10 days supply) to distinguish user from dealer.
      *   *Philosophical Core:* It's a hybrid model. It retains the *form* of prohibition (illegality) but swaps the *substance* of punishment (health/administrative vs. criminal/penal).

  3.  **Address the Specific Threads (Drafting Arguments):**

      *   *Legality vs. Health:* The law says "No," the state says "Help." This requires a view of law as *regulatory* rather than *retributive*. It presupposes law is a tool for social hygiene, not moral vengeance. Is it stable? Yes, if you view administrative law as distinct from criminal law. It's a "soft prohibition."
      *   *Paternalism:* It is strongly paternalistic. It intervenes where harm is primarily to self. This requires a "weak paternalism" or "libertarian paternalism" stance, OR a view that addiction negates autonomy. If the user is fully autonomous, this is hard to justify. If the user is compromised, it's easier.
      *   *Consent:* "Agree to treatment or face fines/bans." This is coercive. Medical ethics usually demand voluntary consent. The model presupposes that *administrative coercion* validates *medical intervention*. This is the shakiest ethical ground. It treats treatment as a compliance metric, not a clinical necessity.
      *   *Addiction/Responsibility:* It distinguishes the "addict" from the "recreational user." This presupposes addiction diminishes capacity. It's not full incompatibilism (they aren't insane), but it's not full compatibilism either (they aren't fully responsible). It's a "diminished responsibility" model. Why drugs and not sugar? Because drugs are *illegal* substances, creating a jurisdictional hook. The state claims authority because the substance is prohibited, not just because the behaviour is harmful.
      *   *Quantity/Intent:* 10 days supply = personal use. This presupposes that *quantity is a reliable proxy for intent*. It's an epistemic shortcut. It assumes the market is stable enough that "10 days" is a knowable metric. It also presupposes use and supply are distinct moral categories, despite the grey area.

