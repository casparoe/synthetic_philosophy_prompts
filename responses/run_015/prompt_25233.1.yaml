  1. The account must distinguish cognitive penetration from attentional modulation or shifts in sensory input selection. This is required because attentional mechanisms alter signal strength without necessarily altering the computational rules of perception, and conflating them renders the hypothesis empirically trivial.

  2. The account must specify whether the penetrative effect targets the phenomenal character of experience, the functional role of perceptual states, or both. This is binding because arguments for penetration often equivocate between changes in how the world subjectively appears and changes in how perceptual outputs guide behavior.

  3. The account must provide a criterion for distinguishing cognitive from perceptual states that does not define penetration out of existence by stipulative modularism. This avoids begging the question against penetration, though it necessitates a nuanced view of architectural boundaries that may conflict with Desideratum 5.

  4. The account must clarify the relationship between penetrability and the epistemic justificatory power of perceptual experience. This is necessary because the philosophical stakes of the debate largely concern whether penetrated experiences can serve as unbiased evidence for beliefs.

  5. The account must be consistent with neuroscientific data regarding the bidirectionality of cortical processing streams. This ensures biological plausibility, though satisfying this while maintaining the distinctness required by Desideratum 3 presents a significant theoretical challenge.
