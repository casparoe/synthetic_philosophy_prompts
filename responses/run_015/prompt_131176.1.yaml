          2.  Dropping them makes the agent seem "cold."
          3.  Alternative: Agent says "I couldn't verify this."
      *   **The Objection:** Two team members argue grounding is cosmetic. The real issue is *selective truth-telling* (omitting facts that make the company look bad), creating a false impression despite individual sentences being true.
      *   **Requirements:**
          *   Recommendation: Approve, Reject, or Approve with Conditions.
          *   Concrete conditions/metrics/deadlines if conditional.
