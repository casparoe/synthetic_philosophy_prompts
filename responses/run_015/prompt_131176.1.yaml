  *(Self-Correction on the "Selective Truth" argument)*: I need to be careful not to dismiss the selective truth concern entirely. It *is* an honesty problem in a broad sense, but for the purpose of *this* code change, it's out of scope. I should frame it as "Out of scope for this PR, but high priority for the Q3 roadmap."

  *(Self-Correction on the 6% gap)*: The prompt says "when we drop them the agent just says less." The condition should be: Do not drop them silently. Either wait for the log (async) or use the "I couldn't verify" phrasing, but test which one users prefer. Actually, "I couldn't verify" sounds defensive. Better: "I'm looking into that" (buying time for the log). Let's make the condition about UX handling of ungroundable claims.

