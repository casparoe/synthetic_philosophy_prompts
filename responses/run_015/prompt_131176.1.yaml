      *   *Refinement:* Frame "internal tracking" as the "System of Record." If the System of Record is wrong, that's a data integrity bug. The LLM shouldn't compensate for data bugs by hallucinating.
      *   *Refinement on Selective Truth:* Distinguish between "lying" (commission) and "spin" (omission). Grounding fixes commission. Policy fixes omission.

  6.  **Final Polish:**
