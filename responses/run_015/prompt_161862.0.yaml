  5.  **Must distinguish uncertainty from cluelessness (unknown structure).** [Keep] — This is your core insight.
  6.  **Must handle sign uncertainty (+ or -).** [Keep] — Critical for long-run interventions.
  7.  **Must handle magnitude uncertainty (1 unit vs 1 million).** [Keep] — Critical for prioritization.
  8.  **Must handle model uncertainty (which causal graph).** [Keep] — Different theories of change.
  9.  **Must handle symmetric vs. asymmetric cluelessness.** [Keep] — Choosing between two unknowns vs. known vs. unknown.
  10. **Must work for consequentialists.** [Keep] — This is where the problem lives.
  11. **Must work for non-consequentialists.** [Context] — Scope creep, but a good stress test.
  12. **Must handle time discounting.** [Context] — Relevant, but secondary to cluelessness.
  13. **Must handle probability discounting.** [Keep] — Tiny probs of huge stuff.
  14. **Must account for cost of thinking.** [Keep] — Bounded agent.
  15. **Must account for cost of information.** [Keep] — Buy info vs. act.
  16. **Must define the baseline (EV of doing nothing).** [Keep] — Is omission an act?
  17. **Must handle pivotality.** [Keep] — One vote among millions.
  18. **Must distinguish ontic (world) vs. epistemic (head) cluelessness.** [Keep] — Determines if info buying helps.
  19. **Must avoid paralysis.** [Keep] — Cannot say "never act".
  20. **Must avoid recklessness.** [Keep] — Cannot say "ignore unknown risks".
  21. **Must be computationally tractable.** [Keep] — No research staff.
  22. **Must handle error on error estimates.** [Keep] — Meta-cluelessness.
  23. **Must not privilege status quo.** [Discard] — Status quo is just another option with unknown effects.
  24. **Must not privilege the measurable.** [Keep] — The "Legibility Tax" constraint.
  25. **Must handle correlation between outcomes.** [Context] — Portfolio theory, useful but secondary.
  26. **Must handle value drift.** [Context] — Future values might change, adds complexity.
  27. **Must handle moral uncertainty.** [Context] — Which ethical theory is right? Separate from empirical cluelessness.
  28. **Must allow for "satisficing".** [Keep] — Optimal is too expensive.
  29. **Must not rely on precise point estimates.** [Keep] — You know better than that.
  30. **Must handle "cluelessness cancels out".** [Discard] — This is a specific solution, not a requirement.

  ***

  ### The Spec: What an Adequate Theory Must Deliver

  You asked for a specification, not a survey. Based on the brainstorm above, here is the narrowed-down spec for a decision theory adequate for a bounded agent facing deep structural uncertainty.

  #### 1. Ontology of Cluelessness
  **Requirement:** The theory must distinguish between *epistemic* cluelessness (I don't know the parameters) and *ontic* cluelessness (the system is fundamentally indeterminate or chaotic beyond prediction).
  **Why:** In ecology, this determines whether you deploy more sensors or accept the noise. In ethics, if the long-run is ontically indeterminate, buying information is waste. If it's epistemic, information buying is the rational move. A theory that treats all cluelessness as resolvable ignorance is lying to you; a theory that treats all of it as fundamental noise paralyzes you.
  **Verdict:** Required. The theory must tell you which kind you face, or provide a rule for acting when you can't tell.

  #### 2. Distinctions Not to Collapse
  **Requirement:** The theory must keep these separate:
  *   **Risk vs. Uncertainty vs. Cluelessness:** Known probabilities vs. unknown probabilities vs. unknown causal structure.
  *   **Sign vs. Magnitude:** Not knowing *how much* good is different from not knowing *if* it's good.
  *   **Symmetric vs. Asymmetric:** Being clueless about Option A but not Option B is a decisive reason to pick B. Being clueless about both is not.
  *   **Act vs. Omission:** Doing nothing must be treated as an intervention with its own causal tail, not a zero-value baseline.
  **Verdict:** All required. Collapsing sign and magnitude uncertainty is the most common error (assuming unknown effects average to zero). Collapsing act and omission privileges the status quo unjustifiably.

  **Scope Note on Non-Consequentialists:** A theory of *decision-making* should ideally tell a deontologist what to do when they are clueless about whether an act violates a duty. However, most "cluelessness" literature is consequentialist (focused on outcomes). I will mark this as **Optional**. If a theory only works for consequentialists, it is still useful to you, but it is not a *general* theory of decision-making.

  #### 3. Cases It Must Handle
  1.  **Measured Near-term vs. Speculative Long-term:** The wetland vs. the existential risk fund.
  2.  **Low Pivotality:** You are one donor among millions.
  3.  **Sign Disagreement:** Plausible models say +EV, equally plausible models say -EV.
  4.  **The Baseline:** Is "spend on myself" an option with known value, or also clueless?
  5.  **Buy Info vs. Act:** When does research become procrastination?

  #### 4. The Three Arguments (Triaged)

  **(1) Sign-Robustness**
  *   *The Demand:* Act only when the sign of the effect survives every model you take seriously.
  *   *My View:* **Required for long-run, optional for near-term.** In your field, you wouldn't release a biocontrol agent if one plausible model predicted an outbreak. For high-stakes, irreversible long-run interventions, sign-robustness is a necessary safety constraint. For near-term welfare (feeding the hungry), the sign is robust enough that demanding this across all models is overkill. A theory must allow you to toggle this strictness based on stakes and reversibility.

  **(2) The Legibility Tax**
  *   *The Demand:* If cluelessness pushes you toward measurable options, are you paying for legibility rather than value?
  *   *My View:* **Required.** This is a systematic bias. Measurable effects are not necessarily more valuable than unmeasurable ones; they are just cheaper to evaluate. An adequate theory must explicitly discount the "measurable" option by the probability that the "unmeasurable" option is actually better but hidden by noise. It doesn't need to calculate the exact tax, but it must acknowledge the distortion. If a theory says "maximize what you can measure," it fails.

  **(3) Meta-Cluelessness**
  *   *The Demand:* Handle uncertainty about your own uncertainty estimates (error on the error).
  *   *My View:* **Required, but with a stopping rule.** You are right: the error on the error is often the biggest term. However, a decision theory cannot demand infinite regress. It must provide a heuristic for when your uncertainty estimate is "stable enough." A theory that ignores meta-uncertainty is overconfident; a theory that demands perfect meta-uncertainty modeling is unusable. The requirement is: *acknowledge it and bound it.*

  #### 5. Impossible Pairs (Trade-offs)

  Here is the hard truth. You cannot have all of these. A theory must explicitly sacrifice one to save the other.

  1.  **Tractability vs. Completeness:** You cannot model all error structures (like in ecology) and still decide by Tuesday. A theory that is fully honest about model uncertainty will be too computationally heavy for a bounded agent. A theory that is tractable will necessarily simplify the error structure.
      *   *Verdict:* You must accept Tractability. A theory that demands full ecological-style modelling for ethical choices is useless to you.
  2.  **Long-Run Sensitivity vs. Stability (Pascal's Mugging):** If you take the long-run seriously, tiny probabilities of huge stakes dominate. If you ignore them to avoid madness (Pascal's Mugging), you are effectively ignoring the long-run.
      *   *Verdict:* This is the central tension. A theory must pick a side. You cannot have both "the long-run dominates" and "ignore tiny probabilities."
  3.  **Epistemic Honesty vs. Action-Guidance:** Admitting total cluelessness often implies paralysis. Acting implies pretending you know enough.
      *   *Verdict:* You need Action-Guidance. A theory that says "we know nothing, suspend judgment" is philosophically honest but practically dead.

  #### 6. The Knockout Requirement

  **The Single Requirement:** **Handling Extreme Stakes without Paralysis or Recklessness.**
  This is the filter that kills the most candidates.
  *   Straight Expected Value (EV) fails here (leads to Pascal's Mugging/recklessness).
  *   Strict Sign-Robustness fails here (leads to paralysis on almost all long-run issues).
  *   "Ignore the long-run" fails here (leads to missing the most important stuff).
  A theory must explain why some tiny probabilities count and others don't, without using an arbitrary threshold. If it can't do this, it collapses under the weight of the long-run argument.

  ***

  ### Scorecard: Main Families of Views

  Here is how the common arguments stack up against the spec.

  | View | Tractability | Sign-Robustness | Legibility Tax | Meta-Cluelessness | Extreme Stakes | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Straight EV Totalism** | Pass | Fail | Fail | Fail | Fail | **Reject.** Treats unknowns as zeros or averages. Ignores error structure. Blown up by Pascal's Mugging. |
  | **Wash-Out (Near-term)** | Pass | Pass (Near) | Fail | Pass | Pass | **Partial.** Good for bounded agents, but assumes long-run effects cancel. Unproven premise. Ignores legibility bias. |
  | **Ignore the Rest** | Pass | Pass | Fail | Pass | Pass | **Reject.** Explicitly pays the Legibility Tax. Biased toward the measurable. |
  | **Buy Info / Wait** | Fail | Pass | Pass | Pass | Pass | **Reject for you.** Fails Tractability/Bounded Agent. You need to decide this month. |
  | **Non-Consequentialist Fallback** | Pass | Pass | Pass | Pass | Pass | **Scope Creep.** Solves the decision problem by changing the ethical theory. Doesn't solve consequentialist cluelessness. |
  | **Sign-Robust Big Stakes** | Fail | Pass | Pass | Pass | Pass | **Reject.** Fails Tractability. Leads to paralysis on almost all long-run bets because sign is rarely robust. |

  **Honest Verdict:** Nothing on that list satisfies the full spec.
  *   The **Wash-Out** view is the only one that fits a bounded agent, but it rests on the empirical claim that long-run effects cancel, which you rightly identify as unproven (like assuming a perturbation washes out without measuring the chaos).
  *   The **Straight EV** view is the only one that takes the long-run seriously, but it fails the error-structure check (your core expertise).
  *   The **Sign-Robust** view is the most scientifically honest, but it is practically paralyzing for a donor without a research staff.

  ### Final Advice for the Ecologist

  You recognized the shape of the problem immediately because it *is* the same problem. In ecology, when you couldn't measure the error structure of a chaotic system, you didn't pretend it was zero. You managed for resilience.

  For your chequebook and your time this month:

  1.  **Reject the "Long-Run Dominates" Framing as a Calculation.** It is true in principle (time is vast), but false in practice for a bounded agent. You cannot calculate the integral of the future. Treat it as a constraint, not an objective function.
  2.  **Apply Sign-Robustness to Irreversible Risks.** If an intervention carries a plausible risk of catastrophic downside (negative sign in some models), do not fund it, regardless of the upside. This is your biocontrol agent rule.
  3.  **Accept the Legibility Tax, But Cap It.** You will naturally lean toward the wetland project because you can see the effects. That is rational for a bounded agent. Do not guilt yourself for not solving existential risk with a spreadsheet. But, allocate a small portion (say, 10-20%) to high-uncertainty, high-upside bets where the sign is robustly positive (e.g., basic research, broad capacity building) rather than specific speculative interventions.
  4.  **Meta-Cluelessness Stopping Rule.** Decide that your uncertainty estimates are "good enough" when further modelling costs more than the potential decision error. You know this heuristic from fieldwork. Apply it here. Don't model the ethics harder than you modelled the plankton.

  **The Specification Summary:**
  Demand a theory that is **tractable enough to use**, **honest enough to admit error structures**, and **robust enough to avoid catastrophic downside**. No existing popular theory hits all three. You will have to hybridize: use near-term metrics for most decisions, apply sign-robustness filters for long-run bets, and accept that you are paying a legibility tax for the privilege of actually acting.
