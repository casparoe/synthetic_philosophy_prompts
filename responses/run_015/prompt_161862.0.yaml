  ### Brainstorm: The Space of Requirements

  Here is the raw list of demands I generated before narrowing down. I've marked which ones I think are essential (Keep), which are useful but secondary (Context), and which are prejudices or impossible (Discard).

  1.  **Must give a definite answer (action-guiding).** [Keep] — You have a chequebook this month.
  2.  **Must respect common sense intuitions.** [Discard] — Common sense is often wrong about systemic risks (see ecology).
  3.  **Must handle infinite values.** [Keep] — Long-run arguments often imply infinite or near-infinite stakes.
