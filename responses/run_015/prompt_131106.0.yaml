answer: |-
  You asked me to push back hard if you are conflating legal doctrine with aesthetics, so I am going to start there.

  **Your legal premise is largely incorrect.**

  There is no general principle in European copyright regimes (whether Civil Law *droit d'auteur* systems like France/Germany or the hybrid UK system) that categorically downgrades moral rights protection for pure instrumental or ambient music compared to vocal or programmatic music.

  Under the Berne Convention (Article 6bis) and the EU Term Directive, moral rights (specifically the right of integrity) attach to the **author of a work**. A "musical work" is defined by originality and expression, not by the presence of semantics. A string quartet by Beethoven has the same moral rights status as a lied by Schubert. If a broadcaster cuts 50 bars off a Mahler symphony (instrumental) or auto-tunes a pop vocal (lyrical), the author's claim to integrity is theoretically identical.

  Where you are likely finding this distinction is in the **applied art / functional exception**.
  1.  **Functional Audio:** Sound effects, logos, or purely functional background loops are sometimes deemed to lack the "authorial stamp" required for full copyright, or they are treated as "works made for hire" where moral rights are waived (common in film/TV production contracts).
  2.  **Film Scoring:** In many jurisdictions, the director's moral right to the *film* can override the composer's moral right to the *music* once it is synched. This often impacts instrumental score more than songs, simply because songs often exist prior to the film (pre-existing work) while scores are commissioned.

  **The Verdict on Your Premise:** You are mistaking a distinction between **Fine Art vs. Applied Craft** for a distinction between **Representational vs. Abstract**. The law doesn't care if the music "means" something; it cares if the music is **functional**.

  ***

  ### The Ontological Clash: Romantic Personality vs. The Will

  However, let's suspend the legal correction for a moment and treat your question as a philosophical probe into the *spirit* of the law. Even if the black-letter law doesn't explicitly state your premise, does the *culture* of copyright enforcement reflect the bias you describe?

  Yes. And here is where the Schopenhauerian analysis gets fascinating.

  #### 1. The Law's Ontology: Hegelian/Romantic Personality
  European *droit d'auteur* is built on the **Personality Theory** of copyright (Kant, Hegel, Fichte). The work is an extension of the author's personality.
  *   **The Assumption:** To violate the work is to violate the *personhood* of the author.
  *   **The Bias:** It is easier to prove a violation of personhood when there is a clear **communicative intent**. If a song has lyrics, the "message" is explicit. Distorting the lyrics is an obvious attack on the author's voice.
  *   **The Instrumental Problem:** With abstract instrumental music, the "personality" is harder to pin down legally. If a composer claims, "Slowing down this tempo distorts my vision," a court might view that as subjective preference rather than an objective injury to honor/reputation, unless the programmatic intent is documented.

  **So, the law silently assumes art is communicative.** It assumes the artwork is a vessel for a specific *concept* or *narrative* that can be distorted. This is a **representational/mimetic ontology**.

  #### 2. Schopenhauer's Ontology: Music as Will
  Schopenhauer explicitly rejects the idea that music is representational.
  *   **The Hierarchy:** Other arts copy the *Ideas* (shadows of reality). Music copies the *Will* (the thing-in-itself).
  *   **The Lyrics Problem:** Schopenhauer actually argues that adding lyrics to music **degrades** the music. It forces the universal language of the Will to serve the particular, conceptual language of the intellect.
  *   **The Hierarchy within Music:** Schopenhauer does have a hierarchy, but it's not Lyrics > Instrumental. It is **Melody > Harmony > Bass**.
      *   **Bass:** Inorganic nature (blind Will).
      *   **Harmony:** Plant/Animal life (striving).
      *   **Melody:** The intellectual striving of man (the "story" of the Will).

  #### 3. Is the Law Doing "Bad Schopenhauerian Metaphysics"?
  **Yes, but in reverse.**

  If the law privileges vocal/programmatic music over instrumental/ambient music, it is operating on a **Platonic/Aristotelian** framework (Art represents Ideas/Actions), which Schopenhauer explicitly argues music *transcends*.

  *   **The Law says:** "Music with words has more 'soul' (personality) because it communicates a concept."
  *   **Schopenhauer says:** "Music with words is compromised because it submits to concepts. Pure music is the highest art because it bypasses concepts."

  So the law is not doing "bad Schopenhauerian metaphysics"; it is doing **anti-Schopenhauerian metaphysics**. It treats music as a subordinate semiotic system rather than a metaphysical revelation.

  #### 4. The "Accidental Alignment" on Drones
  Your second intuition is sharper: *Could a Schopenhauerian say the split accidentally tracks his hierarchy, since melody-less drones (pure harmony) really are closer to the Will's blind ground?*

  If the law treats ambient/drone music as "sound design" (functional, background, less protected), Schopenhauer would have a complex reaction:

  1.  **Agreement on Status:** Schopenhauer might agree that bass-heavy, melody-less drone is closer to the "blind striving" of the inorganic Will. It is the "brute mass" of sound.
  2.  **Disagreement on Value:** However, Schopenhauer values the **Melody** as the highest manifestation of the Will (the human struggle). If the law devalues instrumental music because it lacks the "human story" (melody/narrative), the law is accidentally aligning with Schopenhauer's *internal* hierarchy of music, even if it gets the metaphysics wrong.
      *   **Law:** "No lyrics/story = less protection."
      *   **Schopenhauer:** "No melody/intellectual striving = lower grade of Will objectification."

  **But there is a catch.** Schopenhauer would not say drone music is "craft." He would say it is a lower *grade* of metaphysical truth, but still truth. The law says it is "functional audio" (not art). That is a category error Schopenhauer would reject. For Schopenhauer, even a bass drone is a revelation of the Will, not a tool for a film editor.

  ### Conclusion

  You are conflating legal doctrine with aesthetics, but the conflation reveals a genuine tension.

  1.  **Legally:** The premise is false. Moral rights do not formally distinguish between vocal and instrumental works. The distinction exists between **Authorial Works** vs. **Functional/Industrial Productions**.
  2.  **Philosophically:** The law's bias toward "communicative" content (lyrics/program) reveals it is grounded in **German Idealism of the Person** (Hegel), not **German Pessimism of the Will** (Schopenhauer).
  3.  **The Metaphysical Verdict:** The law assumes art is about **Meaning** (Semantics). Schopenhauer argues music is about **Being** (Ontology).

  If the law devalues ambient music, it is because it cannot find the "Author" in the "Will." It wants a signature, a message, a persona. Schopenhauer would argue that the moment you demand a message from music, you have stopped listening to the Will and started reading a menu.

  So, the law isn't doing bad Schopenhauerian metaphysics. **It is doing confident Hegelian metaphysics, which Schopenhauer would claim is deaf to the true nature of music.**
