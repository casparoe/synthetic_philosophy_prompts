answer: |-
  A community is obliged to sustain public acknowledgement of past wrongs only insofar as doing so preserves its normative integrity, without usurping the agency of the victims or obstructing the possibility of a just political future.

  In arriving at this formulation, I tested two candidate principles against your cases. The first, a principle of *fidelity*, held that we owe memory to those with whom we share a relationship. This broke on Case 4 (where a familial relation exists but you feel no duty) and Case 3 (where no relation exists yet you insist on a duty). The second, a principle of *utility*, held that memory is required only when it produces beneficial consequences. This broke on Case 2 (where archives remain intact and information is lost, yet you deem the removal a betrayal) and Case 8 (where the AI archive functions perfectly yet you recoil). The principle I have offered above shifts the locus from relationship or utility to *normative integrity*: the duty arises from what the commemorating community must be to remain legitimate, not merely from what it owes to the dead or what good it produces. I must disclose that applying this to Case 3 required a judgement rather than a deduction; I judged that occupying the *place* of a atrocity generates a normative tie independent of genealogy, a claim not derivable from the principle alone but necessary to make it fit your verdict.

  **(i) The Principle**
  As stated in the opening sentence: **A community is obliged to sustain public acknowledgement of past wrongs only insofar as doing so preserves its normative integrity, without usurping the agency of the victims or obstructing the possibility of a just political future.** This is ordered: integrity is the ground, agency and future are the limits.

  **(ii) Case Verdict Table**

  | Case | Verdict under Principle | Agrees or Conflicts |
  | :--- | :--- | :--- |
  | 1. Truth Commission PDF | Permissible (Integrity secured by Commission; acknowledgement sustained by availability). | Agrees |
  | 2. Museum Removal | Wrong (Removal undermines integrity; active erasure vs. passive storage). | Agrees |
  | 3. Town Pogrom Service | Obligatory (Town's integrity depends on acknowledging blood on its soil). | Agrees |
  | 4. Family Grave Visit | Optional (Family integrity does not depend on 1902 ancestor). | Agrees |
  | 5. Settler Contrition | Wrong (Usurps victim agency; victims asked them to stop). | Agrees |
  | 6. Saturation | Wrong (Usurps moral seriousness; becomes self-regarding). | Agrees |
  | 7. Duty to Forget | Obligatory (Remembering obstructs just political future/peace). | Agrees |
  | 8. AI Testimony | Wrong (Usurps agency of the dead; simulation vs. testimony). | Agrees |

  **(iii) Conflicts and Costs**
  My principle accommodates all eight verdicts without conflict. However, were I to force a conflict, it would be on Case 3. To hold that Case 3 is *not* obligatory under this principle, I would have to argue that a community's normative integrity is never tied to the history of its *place*, only to its *people*. To go on holding your verdict while rejecting my principle, you would have to say that the world contains moral free-floating duties attached to geography itself, independent of any community's identity. The cost of surrendering Case 3 is high: it removes the ground for most Holocaust memorialisation in Germany today, where the current population is not genealogically tied to the victims but occupies the perpetrator space.

  **(iv) Structural Features**
  The work is being done by the distinction between *constitutive* and *performative* memory. In Cases 2, 3, and 7, the memory (or silence) is constitutive of the political order itself. In Cases 5, 6, and 8, the memory is performative—it is about the actor, not the act. If we vary Case 3 so that the town inhabitants are not descendants of bystanders but recent immigrants with no historical tie to the land, the verdict might shift towards Case 4 (optional), unless one holds that *citizenship* alone binds one to the land's moral history. If we vary Case 5 so that the victims *request* the contrition, it shifts from indecent to obligatory, proving that agency is the decisive variable.

  **(v) Testing Your Principle**
  Your principle states: *A wrong must be remembered by whoever is in a position to sustain, through the remembering, a relation that the wrong damaged; and the duty lapses when remembering no longer sustains such a relation but merely substitutes for one.*
  **Test:** This convicts you on Case 4 (a family relation exists, however attenuated) and fails on Case 7 (where the relation damaged might require silence to heal). It also struggles with Case 3 (no relation exists).
  **Repair:** *A wrong must be remembered by whoever is in a position to sustain, through the remembering, a **normative** relation that the wrong damaged; and the duty lapses when remembering no longer sustains such a relation, **obstructs the repair of that relation**, or merely substitutes for one.* This adds the necessary condition for Case 7 (repair via silence) and clarifies Case 4 (the relation is not normative for the family's integrity).

  **(vi) Unsettled Cases**
  (a) **Discontinuing commemoration:** Yes, a political community may discontinue commemorating a wrong once every direct claimant is dead, *provided* the commemoration is no longer required for the community's own normative integrity (see Case 3 vs Case 5). If the memory serves only the victims' descendants, their silence permits cessation. If the memory serves the perpetrator community's moral self-understanding, the duty may persist.
  (b) **Strangers adopting a cause:** Generally no, unless they act as stewards at the explicit request of the victim community. Without ancestry or standing, such adoption risks the indecency of Case 5 (usurping agency) and the saturation of Case 6 (making it about the commemorators' virtue).

  **(vii) Saturation**
  Saturation is a real moral category, not merely aesthetic impatience. It marks the point where the *signal* of memory becomes noise that drowns out the *substance* of responsibility. When commemoration becomes professionalised and continuous (Case 6), it allows the community to feel it has 'done' memory, thereby licensing moral inattention elsewhere. The flip occurs when the practice ceases to challenge the commemorators and begins to comfort them.
