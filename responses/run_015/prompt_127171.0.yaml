  The principle distinguishing your verdicts is **constraint hardness**: when the primary drivers are biophysical or geological, structure dominates and actors are substitutable, but when the drivers are ideological or organizational, agency dominates and actors are unique.

  Your "structure" cases (Rome, Industrial Revolution, Americas, Potato) all rely on hard limits like soil exhaustion, coal geography, germ theory, and climate suitability. In these scenarios, individual humans cannot alter the trajectory, only react to it; if Watt hadn't built his engine, someone else would have exploited the coal seams because the economic and physical pressure was already there. Your "agency" cases (USSR, Manhattan) rely on soft constraints like political will, secrecy, and management hierarchies. The Soviet Union did not collapse because of resource exhaustion alone, but because Gorbachev uniquely chose not to use force to maintain the ideological structure; similarly, the Manhattan Project was a specific organizational mobilization where security clearance and management style created non-substitutable bottlenecks.

  Your tension over Constantinople arises because you are conflating the *outcome* with the *timing*. The principle dictates that the city's fall was structural due to Ottoman demographic and military consolidation, rendering the eventual outcome inevitable, but the specific year 1453 and the immediate Renaissance ripple effects were agential, determined by Constantine's tactics and the chain across the horn. You do not need to drop a verdict, but you must separate the event's inevitability from its scheduling.

  This classifies modern climate change as **Little Ice Age (Structure)**. While specific executives and policies are agential, the underlying driver is the biophysical carbon cycle and the structural demands of industrial energy consumption. Individual actors are substitutable within the system; if one CEO refuses to drill, another will, because the hard constraint of energy demand and thermodynamics drives the accumulation, not specific personalities. Specific policies may tweak the severity, but the reshaping of society by warming physics operates independently of will once triggered.

  To tighten this model, you should recategorize the **Manhattan Project** verdict. Given the known physics and the existential pressures of WWII, the atomic bomb was structurally inevitable among great powers; Oppenheimer and Szilard were accelerants, not unique causes. Reclassifying this as structure aligns your model perfectly: hard constraints (physics, biology, geology) always overwhelm individual agency, while soft constraints (ideology, loyalty, organization) remain vulnerable to it.
