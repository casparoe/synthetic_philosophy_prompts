answer: |-
  # Q&A PREP SHEET: The Counterfactual-Cost Constraint

  **Time Budget:** 12 Minutes (Realistically 4 questions @ 3 mins each).
  **Room Dynamics:** 50% Imprecise, 15% CDT, 15% Longtermist, 10% Other.
  **Strategy:** You cannot satisfy the Imprecise crowd (they want no sharp numbers) and the Longtermists (they want unbounded EV) simultaneously. Your goal is to convince the CDTs and the moderates that your mechanism is *structural*, not *stipulative*.

  ---

  ## 1. PRE-EMPTIVE MOVES

  ### **The Concession (Slide 1)**
  *State this before you begin the main argument to inoculate against the "ad hoc" charge.*
  "I am not solving fanaticism for silent universes. If the threat comes from a physical process with no speaker—vacuum decay, rogue AI with no communication channel—my constraint does not apply. I am solving the *testimonial* problem: why we are rational to ignore high-stakes demands from strangers. If you need a defuser for agentless tail risks, this isn't it."
  *(Why: Disarms the Philosopher of Religion and the Longtermists immediately. You limit the scope so they can't claim you failed to solve everything.)*

  ### **The Non-Negotiable (Hold Come Hell or High Water)**
  "Utterances are actions with opportunity costs. Treating speech as costless evidence is the error. I will not accept a model where the magnitude of a claim is probabilistically independent of the cost of making that claim."

  ### **The "Kill Shot" Reply**
  *If they ask: "Isn't this just a prior?"*
  "No. A prior is a state of mind. This is a likelihood function derived from game theory. I am not telling you what to believe *before* you hear the mugger; I am telling you how to update *when* you hear him. The 1/N drop isn't a bound; it's the market price of credibility."

  ### **The "Doom Question" (Hope Nobody Asks)**
  "Does this constraint apply to scientific testimony? If a climatologist says 'There is a 0.01% chance of civilization collapse,' does your constraint force me to treat that as a mugging because the cost of the collapse is so high?"
  *(If asked: Concede that expert institutional verification changes the cost structure. The mugger has no audit trail; the scientist does. Don't try to argue the cost is different; argue the *verification* is the costly signal.)*

  ---

  ## 2. RANKED OBJECTIONS & REPLIES

  I have ranked these by a weighted product of **Likelihood** (given the room mix) and **Damage** (to your thesis).

  ### **#1: The "Smuggled Prior" Objection**
  * **Source:** Imprecise Probabilists (The 50% majority).
  * **Likelihood:** Very High.
  * **Damage:** High (Threatens novelty).
  * **The Voice:** "You're presenting this as a likelihood constraint, but it functions exactly like a sharp prior bound. You've just moved the arbitrariness from the utility function to the conditional probability $P(\text{Utterance} | \text{World})$. For a permissivist, there is a rational credence function where the mugger *is* credible. Why is your cost-function any less dogmatic than my imprecise prior?"
  * **2-Minute Reply:**
      "It's a category error to call this a prior. A prior is what you hold before the evidence. My constraint kicks in *after* the evidence (the speech act) is observed.
      Think of it like forgery detection. If I hand you a million-dollar bill, your skepticism isn't a 'prior' against wealth; it's a likelihood assessment based on the cost of printing that bill.
      To the permissivist point: Permissivism allows a *range* of priors, but it doesn't allow you to ignore the causal structure of the signal. Even if your prior is wide, your likelihood function must respect the fact that high-power agents don't beg. If you ignore that, you aren't being permissive; you're being incoherent. I'm not narrowing your credal set; I'm telling you how to conditionalize properly within it."
  * **Soft Spot:** They will press that *any* fixed functional form for likelihoods acts like a dogmatic prior in the limit. You have no defense against a radical subjectivist who says "My likelihoods are whatever I want."
      *   *Pivot:* "Then we disagree on the norms of rationality. I assume rational agents model signal costs. If you don't, you're vulnerable to Dutch Books on testimony."

  ### **#2: The "Collateral Damage" Objection**
  * **Source:** Longtermists (The 3-4 vocal allies/enemies).
  * **Likelihood:** Medium.
  * **Damage:** Critical (Undermines the "General Purpose" claim).
  * **The Voice:** "This looks like a solution to the Mugging, but it kills Longtermism. Most existential risks look like muggings: low probability, astronomical cost, presented by experts asking for resources now. If you enforce a 1/N discount on the probability of catastrophe because the 'demand' is costly, you're telling us to ignore climate change or AI safety. You've solved the parking lot case by blinding us to tail risks."
  * **2-Minute Reply:**
      "I conceded in Slide 1 that this applies to *demands*, not *diagnoses*. The mugger says 'Give me $5 or I destroy N.' The climatologist says 'If we do nothing, N is destroyed.'
      The cost constraint applies to the *ask*. The mugger asks for money to stop the threat. The scientist asks for money to *study* the threat.
      Crucially, the scientist provides audit trails, peer review, and causal models. Those are the 'costly signals.' The mugger offers only a promise. My constraint rewards the scientist for bearing the cost of verification. It doesn't blind you to tail risks; it blinds you to *unverified* tail risks leveraged for immediate cash."
  * **Soft Spot:** The line between "demand" and "diagnosis" is blurry in EA contexts (e.g., "Fund this intervention or people die").
      *   *Pivot:* Distinguish between *coercive conditionals* ("Pay or I act") vs. *causal predictions* ("Act or nature acts"). Your constraint targets the former.

  ### **#3: The "Spam/Scaling" Objection**
  * **Source:** General / Decision Theorists (Your weakest existing reply).
  * **Likelihood:** Medium-High.
  * **Damage:** Critical (Destroys the internal mechanism).
  * **The Voice:** "You say the cost of the utterance scales with N. But digital speech is cheap. A mugger can spam a billion people. The cost per recipient is $\epsilon$. Even if $N$ is huge, $\epsilon \times 10^9$ is still negligible compared to the utility of $N$. The opportunity cost evaporates at scale. Your 1/N drop doesn't hold."
  * **2-Minute Reply:**
      "This assumes the mugger is trying to maximize total revenue. But signaling theory isn't about total revenue; it's about *equilibrium*.
      If spamming is cheap, the signal becomes noise. Rational agents learn to ignore cheap signals. If the mugger spams, the *response rate* drops.
      To get your $5, the mugger needs a *response*. If they spam, they must invest in targeting or personalization to get that response. That targeting cost *does* scale with the sophistication required to convince a specific target of a specific magnitude.
      A generic 'I am a god' email is ignored. A targeted 'I know your mother's maiden name' attack costs more. The more specific and high-stakes the claim, the more expensive the *successful* utterance becomes. I'm bounding the cost of a *successful* demand, not a broadcast."
  * **Soft Spot:** This is your weakest technical ground. A sufficiently advanced AI *could* personalize spam at near-zero marginal cost.
      *   *Pivot:* "If personalization is free, then *trust* is free, and the whole concept of 'credibility' dissolves. We are discussing a world where trust has a price. If you posit a world where trust is free, decision theory breaks everywhere, not just here."

  ### **#4: The "News vs. Cause" Objection**
  * **Source:** Causal Decision Theorists (The 5 specialists).
  * **Likelihood:** Medium.
  * **Damage:** Medium (Technical nuisance).
  * **The Voice:** "You're treating the utterance as evidence (EDT). You say 'Given he said it, what's the prob?' But I don't care about the news value. I care about the causal impact of my payment. If the mugger has already decided whether to destroy the world, my $5 changes nothing. You've solved an epistemic problem, but the decision problem remains: if $P > 0$ and $U = \infty$, CDT still pays."
  * **2-Minute Reply:**
      "You're right that CDT ignores the news value. But CDT requires a causal graph. In that graph, there is a node for 'Mugger Capability.'
      My constraint informs the *prior probability* of that node before you even consider the decision.
      If the probability of 'Mugger Capability' is $10^{-100}$ because of the cost constraint, then CDT doesn't pay.
      I am not doing EDT work; I am fixing the input parameters for your CDT calculation. You want to know what to conditionalize on? Conditionalize on the fact that high-power agents don't beg. Once you put that in your causal model, the expected utility of paying drops to zero."
  * **Soft Spot:** If the CDTer insists the probability is non-zero *regardless* of the begging (e.g., "Maybe he's just crazy but powerful"), you can't force them to update.
      *   *Pivot:* "Then we have a disagreement about empirical likelihoods, not decision theory. I'm telling you how to estimate the 'Capability' node. If you estimate it differently, show me the causal mechanism where capability leads to begging."

  ---

  ## 3. CRITIQUE OF YOUR EXISTING REPLIES

  **Weakest Link:** Your reply to **(a) The Spam/Scaling Objection**.
  * **Current Stance:** "The opportunity-cost argument evaporates."
  * **Why it Fails:** You are conceding the point. If the cost evaporates, your constraint evaporates. You cannot admit this in the room.
  * **Fix:** Use the "Successful Signal" defense drafted in Objection #3 above. Do not defend the cost of *sending*; defend the cost of *being believed*. A spam email has low cost but also low probability of success. To actually get the $5, the cost must rise.

  **Strategic Weakness:** Your reply to **(b) The Agentless Version**.
  * **Current Stance:** "My view is a general-purpose defuser."
  * **Why it Fails:** If you admit it doesn't work on agentless cases (physics/AI), it is *not* a general-purpose defuser. The Longtermists will catch this contradiction.
  * **Fix:** Use the Concession on Slide 1. Reframe the thesis: "This is a general defuser for *testimonial* fanaticism." Do not claim it solves physics-based tail risks. It is better to be honest about scope than to be caught overclaiming.

  ---

  ## 4. FINAL TACTICAL NOTES

  *   **The Emeritus Philosopher:** He will not ask a question; he will make a statement about Pascal's Wager being about salvation, not muggers.
      *   *Response:* Nod respectfully. "That's precisely why I focused on the hoodie. Pascal's Wager relies on a hidden God (no utterance). My constraint explains why we reject the *Mugger* (utterance). They are structurally different problems."
  *   **The Imprecise Crowd:** They will try to drag you into a debate about sets of probabilities.
      *   *Response:* Keep it on likelihoods. "You can have a set of priors. I'm telling you the likelihood function is the same for all of them."
  *   **Time Management:** If a question runs long, cut your reply to 60 seconds. "I think we're drilling into the priors, and I want to leave room for others. The short version is: signal cost constrains likelihood."

  **Good luck. Keep the distinction between *Demand* and *Diagnosis* sharp; that's your shield.**
