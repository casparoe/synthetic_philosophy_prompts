answer: |-
  **UNIVERSITY OF OXFORD**
  **FINAL HONOUR SCHOOL OF PHILOSOPHY**
  **PAPER: CONSCIOUSNESS AND METAPHYSICS**

  **Time allowed: 60 minutes**

  **Answer ONE question.**

  **1.** Epiphenomenalism holds that phenomenal properties are causally inert with respect to the physical domain, including the physical processes underlying belief formation. A standard objection is that this view renders phenomenal judgments inexplicable or unjustified, thereby refuting itself.

  Consider the following engineered analogue, the **'Eta-Field'**:
  Stipulate a quantity, *eta*, which possesses exactly the two features the epiphenomenalist attributes to phenomenal properties:
  (i) *Causal Inertness:* *Eta* values are causally inert with respect to all physical events, including the formation of beliefs.
  (ii) *Brute Correlation:* *Eta* values are tied to physical states by a correlation that is nomologically necessary but metaphysically contingent and brute. Thus, there are metaphysically possible worlds with the physical base and physical laws intact, but where the *eta* values are absent or different.

  Suppose investigators form fine-grained, reliable beliefs about *eta* values. They do so using instruments responsive only to the physical base, relying on the known bridge law linking the physical base to *eta*.

  Write an essay evaluating the self-stultification objection to epiphenomenalism in light of this analogue. Your answer should:
  (a) Reconstruct the paradox in its strongest form, moving beyond simple causal theories of knowledge to consider modal conditions on knowledge (such as safety or sensitivity).
  (b) Use the Eta-Field case to isolate whether the epistemic problem lies in causal inertness itself or in some residual feature specific to phenomenal judgment.
  (c) State the resulting dilemma for the epiphenomenalist crisply and take a stand on one horn, explaining the theoretical costs of that choice (e.g., regarding the nature of self-knowledge or the conceivability argument).
  (d) Conclude by stating whether, on your chosen resolution, the epiphenomenalist can claim to know she has experiences, or whether she holds a view she can have no reason to hold.

  **Expected length: 1,000–1,200 words.**

  ***

  ### MODEL ANSWER

  The self-stultification objection claims that if epiphenomenalism is true, we cannot know it is true, because our experiences cause nothing, including our beliefs about them. However, this naive causal formulation is too blunt. As the Eta-Field analogue demonstrates, causal inertness does not automatically preclude knowledge. If a brute nomological correlation exists between a physical base $P$ and an inert property $E$, an agent measuring $P$ can infer $E$. If the bridge law is known, the belief is reliable within the actual world. Therefore, the paradox cannot rest merely on the absence of causal chains. To find the paradox's bite, we must reconstruct it modally.

  The strongest version of the objection relies on a safety condition on knowledge: for a belief to count as knowledge, it must not be easily false. In nearby possible worlds where the proposition believed is false, the agent should not hold the belief. In the Eta-Field case, because the correlation between $P$ and $E$ is metaphysically contingent, there are nearby worlds where the physical base $P$ occurs (causing the belief that $E$ is present) but $E$ is absent. Consequently, the belief is unsafe. The agent forms the same belief via the same physical mechanism, but the truth value of the belief regarding $E$ flips. If safety is required for knowledge, investigators cannot know *eta* values.

  Applying this to consciousness: if phenomenal properties are epiphenomenal, they supervene on the physical only nomologically, not metaphysically (as per the conceivability of zombies). Thus, there are nearby zombie worlds where the physical base for my belief 'I am in pain' exists, but the pain does not. My belief is formed by the physical base alone. In the zombie world, the belief is false. Therefore, my actual belief is unsafe. This generates a scepticism that mirrors the Eta-Field case. If the Eta-Field case yields scepticism, the epiphenomenalist might argue this is a acceptable cost, akin to scepticism about unobserved theoretical entities. However, this ignores a crucial disanalogy.

  The Eta-Field case involves theoretical inference. Investigators posit $E$ to explain $P$ or simply track it via a bridge law. Phenomenal judgment, however, is typically taken to be non-inferential and grounded in acquaintance. When I judge 'I am in pain', I am not inferring a hidden variable from physical data; the pain is presented to me. This is the residual difference the analogue isolates. The Eta-Field lacks a mode of presentation that guarantees the subject's access to the property itself independent of the physical bridge. If phenomenal concepts are grounded in acquaintance, the justification for the judgment does not rely on the reliability of the physical mechanism tracking an external correlate, but on the direct presence of the property.

  This generates a dilemma for the epiphenomenalist.
  Horn One: Accept that phenomenal judgment is analogous to Eta-judgment (theoretical/inferential).
  Horn Two: Insist that phenomenal judgment relies on acquaintance.

  I take Horn Two. If we treat phenomenal judgment as merely theoretical tracking of an inert property, epiphenomenalism is indeed self-stultifying, because the safety condition fails across zombie worlds. The cost of Horn Two, however, is significant. It requires a robust account of acquaintance that allows a causally inert property to justify a belief. This challenges the causal theory of justification, suggesting instead a constitutive or relational account where the experience itself is part of the justification, not merely a cause.

  Furthermore, this choice impacts the conceivability argument that often motivates epiphenomenalism. The conceivability of zombies relies on the idea that the phenomenal concept picks out a property distinct from the physical concept. If acquaintance grounds the phenomenal concept, it explains why the concept is distinct: it is grounded in a different mode of access. However, it tightens the constraints on dualism. If acquaintance provides justification despite causal inertness, it must be because the relation of acquaintance is itself metaphysically robust. This risks collapsing the metaphysical contingency required for the zombie argument. If acquaintance guarantees the presence of the property, can there truly be a nearby world where the physical base exists without the property? If the property is essentially acquainted, perhaps the physical base without the property is not a nearby world, but a world where the subject does not exist.

  Regarding the self-stultification worry: on Horn Two, the epiphenomenalist can claim to know she has experiences. The knowledge is not derived from the causal efficacy of the experience, but from its phenomenological presence. The belief 'I am in pain' is justified because the pain is manifest, not because it caused the belief. The physical cause of the belief token is irrelevant to the justification provided by the acquaintance relation.

  However, this saves self-knowledge at the expense of scientific knowledge of other minds. If my knowledge of my own pain relies on acquaintance, and I lack acquaintance with yours, and your pain causes nothing in me, I have no route to know you are conscious. The epiphenomenalist avoids self-stultification regarding her own mind but accepts scepticism regarding other minds. This is a coherent, if lonely, position. She does not hold a view she has no reason to hold; her reason is the immediate acquaintance with her own consciousness. The view is not self-refuting, but it is epistemically solipsistic. The Eta-Field analogue fails to capture this because it models consciousness as a theoretical posit rather than a lived reality. Once we correct for this, the paradox dissolves for the first-person case, leaving only the hard problem of other minds, which is a separate burden.

  ***

  ### MARKING SCHEME (Out of 20)

  | Criterion | Marks | Must-Hit Move & Differentiation |
  | :--- | :---: | :--- |
  | **1. Reconstruction of the Paradox** | 5 | **A-Grade:** Identifies that simple causal inertness is insufficient; reconstructs the argument using modal conditions (safety/sensitivity) and zombie worlds.<br>**B-Grade:** Relies on the naive causal claim ("no cause = no knowledge") without addressing why the bridge law doesn't solve it. |
  | **2. Deployment of the Analogue** | 5 | **A-Grade:** Uses the Eta-Field to show that inertness + correlation *can* yield reliability, isolating the modal fragility or the lack of acquaintance as the real issue.<br>**B-Grade:** Treats the Eta-Field as identical to consciousness without noting the disanalogy in mode of access, or dismisses it too quickly. |
  | **3. The Dilemma & Resolution** | 5 | **A-Grade:** Clearly states the dilemma (Inferential vs. Acquaintance) and takes a definite stand, articulating the theoretical cost (e.g., solipsism, challenge to causal justification).<br>**B-Grade:** Hedges between options or fails to identify the cost of the chosen resolution. |
  | **4. Self-Stultification Conclusion** | 5 | **A-Grade:** Concludes clearly on whether the epiphenomenalist can claim knowledge (Yes, via acquaintance) and addresses the status of the view (not self-refuting, but solipsistic).<br>**B-Grade:** Vague conclusion or claims the view is refuted without explaining how the agent knows the refutation. |

  **Pass/Fail Guidelines:**
  *   **Bare Pass (10/20):** Correctly defines epiphenomenalism and states the naive self-stultification objection. Attempts to use the Eta-Field but may not fully integrate it into a modal argument. Conclusion is clear but lacks nuance on costs.
  *   **Fail (<10/20):** Confuses epiphenomenalism with interactionism. Ignores the Eta-Field stipulations. Claims the view is obviously false without argument.

  **Specific Penalties (Apply even if fluent):**
  *   **Conflating Causal Inertness with Explanatory Irlevance:** Deduct 2 marks if the candidate argues that because experiences cause nothing, they explain nothing (ignoring non-causal explanation).
  *   **The Common-Cause Fallacy:** Deduct 3 marks if the candidate treats the 'bridge law' or 'common cause' reply as definitively solving the epistemic problem without addressing the modal fragility (nearby worlds where the correlation breaks).
  *   **Ignoring the First-Person Perspective:** Deduct 2 marks if the answer treats phenomenal judgment entirely as third-person theoretical inference, ignoring the role of acquaintance.
