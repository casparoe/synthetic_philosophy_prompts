  **2. Paradoxes and Puzzles**
  The theory must dissolve the **defection regress**: the intuition that "knowing you cooperate frees me to defect" must be shown as logically incoherent under CKR. It must solve the **embedding problem**: why cooperate with a superrational peer but not a rock or simpleton programmed to mirror you? The theory must distinguish logical correlation (shared reasoning) from causal mimicry. It must address the **tension with Causal Decision Theory (CDT)**. CDT dictates defection in PD; superrationality requires cooperation. The theory must explain why CDT's causal ontology is insufficient for logical correlation. Additionally, it should handle **Newcomb's Problem** consistently, treating the predictor as a logically linked agent.

  **3. Classical Game Theory and Rationality**
  The theory is permitted to overturn the standard result that defection strictly dominates cooperation in one-shot PD under CKR. It must reject dominance reasoning when actions are logically correlated. However, it should preserve Nash equilibria in games where logical correlation provides no leverage (e.g., zero-sum games). It must reduce to classical rationality when CKR or symmetry is absent. Superrationality should not be a distinct mode agents switch into. It must be presented as what individual rationality *is* when the decision problem correctly includes the logical fact that similar agents in similar situations will reach similar conclusions. The conflict is an artifact of incomplete problem specification, not a dual-process system.

  **4. Incompatible Desiderata**
