      *   *Payoff Nuance:* Ensure I distinguish between the Soldier's Payoff (Survival) and the Officer's Payoff (Aggression). The "Live and Let Live" system was a rebellion against the Command's game.

  9.  **Final Review:** Does this flow logically?
      *   Intro: Contextualize WWI trenches as a natural experiment.
      *   Mapping: Define Players, Strategies, Payoffs.
      *   The Anonymity/Scale Issue: Unit-level reciprocity.
