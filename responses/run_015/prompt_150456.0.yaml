          *   Which accounts (selected-effect, causal-informational, functional-role) fit?
          *   Distinguish strict presupposition vs. fit vs. underdetermination.
          *   **Complication 1:** No one selected the background feature (blind optimisation). Whose selection history matters? What is proper function here?
          *   **Complication 2:** The remedy (test classifier) might also exploit shortcuts. Regress?
          *   **Final Question:** What if engineers abandoned history for causal role alone? What makes the network "wrong" in the natural world then?
      *   **Constraints:** British English, 600-800 words.

  2.  **Deconstruct the Engineering Practice:**
      *   *Observation:* Network classifies based on background (snow), not target (wolf).
      *   *Verdict:* It's a "snow detector", not a "wolf detector". Output right, reason wrong.
      *   *Test:* Intervention (paste animal on new background). If output flips, content was background.
      *   *Underlying Theory:* This looks like a hybrid. The *normative* claim ("it ought to detect wolves") relies on history/intention (training labels, designer goals). The *diagnostic* claim ("it actually detects snow") relies on causal-counterfactual dependence (interventionist test).

  3.  **Evaluate Theories of Content:**
      *   *Causal-Informational:* Content is what causes the state. If snow causes the output, it represents snow. But engineers say it's *wrong* to call it a wolf detector. Pure causal theory struggles with error (if it represents snow, it's not wrong about snow).
      *   *Selected-Effect (Etiological):* Content is what the system was selected for. Engineers intend wolf detection. Training selects for minimising loss on wolf labels. But the *actual* selection gradient picked up snow. This fits the "wrong reason" verdict best. The "proper function" is wolf detection (designer intent/training objective), even if the *mechanism* is snow detection.
      *   *Functional-Role:* Content determined by role in the system. Less helpful for distinguishing "right/wrong reason" externally.

  4.  **Address Complications:**
      *   *Complication 1 (Blind Optimisation):* Gradient descent has no intentions. The "selection history" is the training objective function set by humans. The normative force comes from the *assigned* task (minimise wolf/non-wolf error), not the *achieved* minimum (snow detection). Proper function is teleological (assigned by designers), not biological.
      *   *Complication 2 (Regress):* The test classifier might also shortcut. This suggests a regress if we demand a "shortcut-free" validator. However, the regress stops at human interpretation. The engineers themselves are the ultimate arbiters of what counts as the relevant feature (wolf vs. snow). The talk of "really representing" is pragmatic, not metaphysical.

  5.  **Address the Final Question (Causal Role Alone):**
      *   If content = causal role, the network represents snow. It is never "wrong" about snow. To say it is "wrong" requires an external standard (the label/history). Without history, "error" disappears; there is only mismatch between system behaviour and human utility.

