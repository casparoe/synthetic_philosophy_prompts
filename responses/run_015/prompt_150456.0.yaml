      The engineering practice presupposes a hybrid theory of content, blending etiological norms with interventionist semantics. Strictly, it presupposes that representational content is distinct from mere causal correlation; there is a fact of the matter about what a system *means* to detect, separate from what it *actually* tracks. This fits well with a selected-effect (etiological) account, where content is determined by the function the system was selected to perform. Here, the 'selection' is the training objective minimising loss on wolf labels. However, the diagnostic test—intervening on the background—is purely causal-counterfactual. This creates the tension you note: the verdict of error ('wrong reason') relies on history (it was supposed to be a wolf detector), while the identification of the mechanism relies on causal role (it is actually a snow detector). Pure causal-informational theories cannot supply 'error' here; if content is fixed by causal role, the network represents snow perfectly. Pure functional-role theories struggle to distinguish the intended role from the realised one without external norms. Thus, the practice requires a normative standard external to the immediate causal profile, supplied by the training history.

      Regarding the first complication, the 'selection history' is not biological but artefactual. Gradient descent is blind, but the loss landscape was constructed by human labellers. The normative work is done by the designers' intentions encoded in the objective function. Proper function is thus assigned teleology: the network functions correctly only if it aligns with the designer's goal, not merely if it minimises loss via any pathway. When the network exploits background correlations, it fails its assigned proper function, even if it succeeds at the mathematical objective. This transfers to naturalising mental content only if one accepts that biological proper functions can be similarly distinct from immediate causal utilities—a contentious but viable position in teleosemantics.

      The second complication suggests a regress: if the test classifier also shortcuts, how do we verify the verifier? The regress stops at the human engineer. The practice does not require an infinite chain of shortcut-free classifiers; it relies on human perceptual grounding. Engineers recognise snow and wolves directly. The talk of 'really representing' is not a metaphysical claim about the network's intrinsic ontology, but a pragmatic description of alignment between system behaviour and human utility. It is underdetermined whether the content is fixed by the data distribution or the designer's intent, but the practice treats them as coincident ideals. When they diverge, intent usually trumps data structure in defining the 'true' task.

      Finally, if engineers abandoned history and read content off causal role alone, their reports would change fundamentally. They would state: 'This system detects snow with high accuracy.' The claim that the network is 'wrong' would vanish. In the natural world, without historical norms, there is no error, only mismatch. A network causally coupled to snow is not mistaken about snow; it is merely useless for finding wolves. Error requires a norm, and norms require history or intention. Without the historical element, the distinction between 'right for the wrong reason' and 'right for the right reason' collapses into 'effective' versus 'ineffective' relative to a separate human goal. The natural fact making the network 'wrong' is not in the weights or the pixels, but in the divergence between the system's causal profile and the historical conditions of its creation. Thus, the practice strictly presupposes a teleological element; without it, shortcut learning is not a failure of representation, but merely a surprise in causal coupling.

