      *   *Complication 1:* Blind optimisation. The "selection" is the loss function defined by humans. Proper function is assigned, not evolved.
      *   *Complication 2:* Regress. Stops at human judgment. "Really representing" is a pragmatic tool for debugging, not a metaphysical fact.
      *   *Final:* Without history, no error. Just causal coupling.

