      5.  **Functional Equivalence:** Output matches human utility. (Empirical, API-ok).

      *Refining Applications:*
      1.  Consent: Claim 2 blocks "assesses comprehension." Claim 5 permits use if reliability matches nurses. If nurses don't "understand" either (just label patterns), Claim 2 applies to humans too (reductio or operationalism).
      2.  Abbreviation: Claim 1/2 explains failure (statistical association vs. knowledge). Variant (admitting ambiguity) touches Claim 2 (meta-cognition?).
