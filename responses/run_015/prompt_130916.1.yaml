  8.  **Refining the "Corrective Analysis":**
      *   *Masada:* The myth relies on *Counterfactual Dependency* (if they surrendered, no Israel) but *rejects* Retrospective Moral Framing of the *specific cause* (Sicarii extremism is not endorsed, only the will to live free).
