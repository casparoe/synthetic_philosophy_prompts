answer: |-
  ### Desiderata for a Theory of Meaningful Work in an Automated Economy

  **1. The Normative Distinction Requirement**
  *   **Specification:** The theory must differentiate meaning from mere instrumentality (wages) without reducing it to subjective preference (liking).
  *   **Motivating Case:** Prevents the collapse of "meaning" into either wage-slavery (economic instrumentalism) or hobbyism (psychological subjectivism).
  *   **Classification:** **Non-negotiable.** (Condition of conceptual coherence for any philosophical theory of *meaning*).

  **2. The Post-Work Anthropology Requirement**
  *   **Specification:** The theory must explain the drive for work-like activity post-subsistence and justify why automating craft/care does not exhaust human meaning.
  *   **Motivating Case:** Addresses the "Keynesian leisure problem" and the fear that automation renders human effort obsolete.
  *   **Classification:** **Camp-specific.** (Reflects **Aristotelian/Marxist** commitments regarding *Homo Faber* and labor as essential to flourishing, opposing Neoclassical views of labor as disutility).

  **3. The Recognition vs. Task Requirement**
  *   **Specification:** The theory must preserve the distinction between intrinsic task value and value derived from social recognition/status, specifying automation's threat to each.
  *   **Motivating Case:** Distinguishes between the dignity of doing (craft) and the dignity of being needed (social utility), which automation impacts differently.
  *   **Classification:** **Non-negotiable.** (Condition of analytical clarity to separate Hegelian recognition from Aristotelian activity).

  **4. The Empirical Adequacy Requirement**
  *   **Specification:** The theory must accommodate data showing autonomy/mastery predict satisfaction better than income, while involuntary unemployment harms wellbeing beyond financial loss.
  *   **Motivating Case:** Ensures the theory aligns with Self-Determination Theory and sociology of unemployment, avoiding contradictions between psychological internalism and social externalism.
  *   **Classification:** **Non-negotiable.** (Condition of empirical adequacy).

  **5. The Locus Adjudication Requirement**
  *   **Specification:** The theory must adjudicate whether meaning resides in the activity, the social relation, or the narrative identity, forbidding arbitrary collapse among these.
  *   **Motivating Case:** Prevents category errors where a boring job is deemed meaningful solely due to family narrative, or vice versa.
  *   **Classification:** **Camp-specific.** (Reflects **Ontological** commitments: Activity [Aristotle], Relation [Hegel], or Narrative [MacIntyre/Taylor]).

  ***

  ### Evaluation of Candidate Frameworks

  | Framework | Performance Against Desiderata | Critical Failures |
  | :--- | :--- | :--- |
  | **Purely Subjective "Calling"** | **Fails.** Reduces meaning to preference (Violates 1). Cannot explain unemployment harm if income/preferences are met (Violates 4). Collapses locus to identity (Violates 5). | **Req 1 & 4** |
  | **Purely Objective "Contribution"** | **Fails.** Risks instrumentalism (Violates 1). Renders human work meaningless if robots contribute more (Violates 2). Ignores autonomy data (Violates 4). | **Req 2 & 4** |
  | **Hybrid "Capability"** | **Passes.** Treats work as a functioning (objective but agent-relative). Allows activity without economic necessity. Distinguishes capabilities (autonomy) from functionings (employment). | **None significant.** |

  ***

  ### The Single Eliminating Requirement

  **Requirement 4 (The Empirical Adequacy Requirement)** eliminates the most candidates.

  *   **Justification:** It simultaneously disqualifies the **Subjective** account (which cannot explain why involuntary unemployment damages wellbeing even when subjective preference/income is secured via UBI) and the **Objective** account (which cannot explain why high-contribution/low-autonomy roles yield lower satisfaction than lower-contribution/high-autonomy roles). While Requirement 1 eliminates Subjectivism and Requirement 2 eliminates Objectivism in an automated context, Requirement 4 exposes the empirical insufficiency of *both* pure models regarding human wellbeing.
