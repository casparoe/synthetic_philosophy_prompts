answer: |-
  You're mixing up Turing reporting an objection with him endorsing the phenomenon himself. He isn't suggesting humans have a psi-field that machines need to be shielded from; he's acknowledging that if telepathy were real, it would break the rules of his test by letting the judge cheat. Basically, you're reading his contingency plan as a statement of fact about human biology.

  Turing was actually being pretty pragmatic about the whole thing. He admitted that the statistical evidence for ESP looked convincing enough back in the 50s that he couldn't just ignore it, but he didn't believe it was some special soul-power that defined humanity. His point was that if telepathy exists, it gives the human player an unfair advantage in the Imitation Game, so the test conditions should just be adjusted to block those signals—like moving the players into a radio-shielded room. He wasn't trying to prove psi exists; he was just closing a loophole so the test could measure intelligence rather than psychic abilities.

  Luckily for modern AI researchers, ESP is pretty much dismissed by science now, so nobody needs to build telepathy-proof server rooms. The spirit of his point still matters though, since we still have to design evals that prevent cheating or data leakage, just not the psychic kind. So no, you don't need a Turing-corrected psi-layer for your LLM benchmarks.
