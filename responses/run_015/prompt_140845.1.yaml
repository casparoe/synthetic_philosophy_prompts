  3. Observers assume the practice requires the law of large numbers to justify betting on low probabilities, but the fund relies on single-shot stakes where aggregation across trials is impossible. This reveals that repeatability is a prejudice of risk-neutral gamblers rather than a requirement for serious existential planning.
  4. Your calibration floor separates the cases only if it measures evidence quality rather than just probability size, otherwise it collapses into arbitrary numerology. What actually does the work is the distinction between model-based inference and unconstrained speculation, not the numerical threshold itself.
  5. If they adopted explicit ambiguity aversion, meetings would shift from calculating numbers to debating the quality of the underlying models before any multiplication occurs. This would force them to reject high-stakes projects with poorly understood mechanisms even if the rough math looks favorable.
