          *   *Verdict:* The "pyrrhic" charge is largely fair *if* the goal of PII is to ground identity in qualitative facts. If the goal is just logical truth, it's less fair. But in metaphysics, the substantive version is the one people care about.
      *   *Advice:* Refine the framing. It's not just "useless"; it's that it fails to achieve the *Leibnizian motivation* (sufficient reason, reduction of identity). The haecceitist accepts the trivial truth but denies the *qualitative* supervenience.

