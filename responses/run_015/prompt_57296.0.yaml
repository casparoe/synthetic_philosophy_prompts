prompt: |-
  Longtime lurker of the demandingness-objection threads here and I keep coming back to a case that I think breaks the standard supererogation machinery. Oates on Scott's last journey, March 1912: gangrenous feet, knows he's slowing the other three down, asks them to just leave him in his sleeping bag, they refuse, and the next morning he says "I am just going outside and may be some time," walks out of the tent into a −40 blizzard on his birthday, and is never seen again — his body was never found. Scott and the other two got pinned by weather about twelve days later and died in the tent, still short of the big supply depot they'd been slogging toward. So four dead, nobody saved, and what Oates bought the others was maybe a few extra miles of margin they never cashed in.

  Run that through the category properly. Take the stock definition — morally good, not required of anyone, involving serious cost or risk to the agent, and praiseworthy — plus Urmson's saints-and-heroes framing that set the whole project up, and tell me whether the act lands inside it or outside. The bit I cant get past: does the definition need a benefit term, and if it does what's the verdict when the benefit comes out to zero? Walk me through the live options — no moral credit at all because outcome luck is doing everything; credit attaches to the decision under uncertainty rather than the result; or the act was supererogatory in motive but not in effect and the category was never built to hold that split — and then say which one you'd actually sign up for. And does the supererogation paradox get any grip here: if one ought to do whatever produces the most good and walking out was that thing, its obligatory and there's no surplus merit left to praise.

  Then contrast Kolbe at Auschwitz. Same shape, one life traded for a stranger's, except Gajowniczek actually lived and had descendants. If Kolbe is obviously supererogatory and Oates isn't, is the category just consequentialist underneath, despite always getting sold as the anti-consequentialist category? And is there something about the small-team structure the literature misses — whether Scott and Wilson could legitimately have asked him to do it, whether their refusal to abandon him changed what he owed them, whether a role duty inside a five-man party does work that the stranger-on-the-street cases don't have room for. I know all the competence-failure and logistics stuff about the expedition, skip that part.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** "Longtime lurker of the demandingness-objection threads." This implies familiarity with academic ethics, specifically meta-ethics, normative ethics (consequentialism vs. deontology vs. virtue ethics), and the specific literature on supererogation (Urmson, Heyd, etc.). They use technical jargon correctly ("demandingness-objection," "supererogation machinery," "Urmson's saints-and-heroes," "outcome luck," "supererogation paradox").
      *   **Tone:** Intellectual, precise, slightly weary of standard answers, looking for a rigorous breakdown rather than a summary.
      *   **Core Case:** Lawrence Oates (Scott's Terra Nova Expedition, 1912).
      *   **Core Question:** Does Oates' sacrifice fit the definition of supererogation given the *outcome* was zero benefit (everyone died anyway)?
      *   **Specific Tasks:**
          1.  Run Oates through the stock definition (good, not required, costly, praiseworthy).
          2.  Address the "benefit term" problem (does supererogation require actual good consequences?).
          3.  Walk through live options (no credit due to luck, credit for decision under uncertainty, motive vs. effect split).
          4.  Pick a stance.
          5.  Address the "Supererogation Paradox" (if it maximizes good, is it obligatory?).
          6.  Contrast with Maximilian Kolbe (Auschwitz).
          7.  Analyze the "small-team structure" (role duties, refusal to abandon).
          8.  Skip logistics/competence failure (focus on the ethics).

  2.  **Deconstruct the Oates Case:**
      *   *Action:* Walking into the blizzard to die.
      *   *Intent:* To increase the survival chances of Scott, Wilson, and Bowers by removing a burden (gangrene, slowing pace).
      *   *Outcome:* Scott, Wilson, and Bowers died 12 days later, 11 miles from safety. Oates died immediately. Total survival: 0.
      *   *Standard Definition:* Supererogatory acts are (1) optional, (2) morally good, (3) costly to the agent.
      *   *The Glitch:* Most definitions imply the act *benefits* others or society. If the benefit is null, is it still "morally good"?

  3.  **Address the "Benefit Term" Problem:**
      *   *Option A: Consequentialist Threshold.* If supererogation requires *actual* good consequences, Oates fails. It becomes a tragic mistake or a futile sacrifice.
      *   *Option B: Expected Utility/Decisionism.* If supererogation is about the *rationale* at the time of decision, Oates passes. He reasonably believed it would help.
      *   *Option C: Motive/Character.* If it's about virtue, Oates passes. His character was exemplary regardless of the weather.
      *   *My Stance:* Option B (Decision under uncertainty) is the most robust for ethical theory. We judge agents on what they could know, not on outcome luck. Otherwise, morality becomes a lottery.

  4.  **Address the Supererogation Paradox:**
      *   *The Paradox:* If an act produces the *most* good, utilitarianism says it's obligatory. If it's obligatory, it can't be supererogatory (which must be optional).
      *   *Application to Oates:* If walking out *actually* saved them, a utilitarian might argue he *ought* to have done it. But since it didn't save them, did it produce the most good?
      *   *Resolution:* The paradox relies on omniscience. Under non-ideal epistemic conditions, the "obligatory" threshold is blurry. Oates' act remains optional because the duty to self-preservation (or team cohesion) wasn't clearly overridden by the uncertain benefit to others.

  5.  **Contrast with Kolbe:**
      *   *Kolbe:* Volunteered to die in place of a stranger (Gajowniczek). Gajowniczek lived.
      *   *Comparison:* Kolbe is the paradigmatic supererogatory act. Oates is the "failed" supererogatory act.
      *   *Implication:* If Kolbe is supererogatory and Oates isn't (due to outcome), then the category *is* covertly consequentialist. This undermines the deontological/virtue-based defenses of supererogation (Urmson wanted to protect "saints" from utilitarian demandingness).
      *   *Counter-argument:* If we judge based on *ex-ante* expectation, both are supererogatory. The outcome is morally irrelevant luck.

  6.  **Analyze the "Small-Team Structure" (The Nuance):**
      *   *Strangers vs. Companions:* Kolbe/Stranger is a "one-off" interaction. Oates/Scott is a "joint enterprise."
      *   *Role Duties:* In an expedition, there are mutual reliance duties. "No man left behind" is often a team norm.
      *   *The Refusal:* Scott *refused* to leave Oates. Oates overriding this refusal complicates things. Did he violate a duty of obedience/cohesion? Or did he recognize the duty to the mission's success overrode the team's emotional refusal?
      *   *Literature Gap:* Most supererogation literature focuses on dyadic stranger cases (soldier/grenade, passerby/drowning child). It neglects "shared fate" scenarios where the beneficiaries have agency and voice (Scott saying "don't go").

  7.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the depth of the prompt. Validate the Oates case as a stress test for the category.
      *   *Section 1: The Definition Check.* Break down Urmson's criteria. Highlight the missing "success condition."
      *   *Section 2: The Benefit Term & Luck.* Discuss Moral Luck (Williams/Nagel). Argue for the "Expected Value" view.
      *   *Section 3: The Paradox.* Tackle the "If it's best, it's obligatory" claim. Distinguish between objective and subjective obligation.
      *   *Section 4: Kolbe Contrast.* Show how outcome dependence makes the category consequentialist. Argue against this.
      *   *Section 5: Team Dynamics.* This is the strongest insight. Discuss "Joint Agency" and "Refusal of Benefit."
      *   *Conclusion:* Summarize the verdict. Oates is supererogatory *ex-ante*, but the category needs to account for "futile sacrifice" vs. "failed supererogation."

  8.  **Refining the Tone:**
      *   Keep it academic but conversational (matching the user's "lurker" vibe).
      *   Avoid moralizing.
      *   Use specific terms (ex-ante/ex-post, deontic status, moral luck).
      *   Ensure the "Small-Team" point gets enough weight, as the user specifically flagged it as under-explored.

  9.  **Self-Correction/Check during drafting:**
      *   *Did I skip logistics?* Yes, focus on the ethics of the sacrifice, not whether Oates was actually slowing them down physically (though the *belief* matters).
      *   *Did I answer the "which one would you sign up for" prompt?* Need to be explicit. I'll sign up for the "Decision under Uncertainty" view.
      *   *Is the Kolbe comparison sharp enough?* Make sure to highlight that Kolbe's success makes him the "easy" case, while Oates breaks the machinery.

  10. **Final Polish:** Check for clarity on the "Supererogation Paradox." Ensure the distinction between "obligatory" and "supererogatory" is clear in the context of maximizing good. (If Oates *did* save them, would it be obligatory? Utilitarians say yes. Non-utilitarians say no. This tension needs to be explicit.)

  *(Self-Correction on the Paradox)*: The prompt asks: "if one ought to do whatever produces the most good and walking out was that thing, its obligatory and there's no surplus merit left to praise." I need to address this specifically. If the act *had* worked, would it cease to be supererogatory? Only for a maximizing consequentialist. For a common-sense morality (Urmson), it remains supererogatory because it exceeds duty. But the *failure* makes it look like a mistake. I need to separate the "Obligation" question from the "Success" question.

  Okay, ready to write.
answer: |-
  This is a brutal stress test for the category, and you're right to flag it. The Oates case is the "Gettier problem" of supererogation: it satisfies the intuitive conditions for saintliness while failing the functional conditions for "goodness" because the causal chain snapped.

  Let's run the machinery.

  ### 1. The Stock Definition vs. The Oates Case

  You cited the standard Urmsonian triad:
  1.  **Morally good.**
  2.  **Not required (optional).**
  3.  **Costly/risky to the agent.**

  Most definitions implicitly include a fourth condition: **Beneficial to others/society.** This is usually glossed over because in 99% of cases (the soldier on the grenade, the donor kidney), the benefit is assumed or realized.

  In Oates' case:
  *   **Cost:** Absolute (death).
  *   **Optionality:** High (Scott explicitly forbade it; no external duty forced him).
  *   **Benefit:** Zero (ex-post).

  If we treat the "Benefit" condition as *ex-post* (actual consequences), Oates falls out of the category. He becomes a tragic figure, perhaps irrational, but not morally praiseworthy in the specific *supererogatory* sense. He committed a "futile sacrifice." If we treat "Benefit" as *ex-ante* (expected utility based on available information), he stays in.

  ### 2. The Benefit Term and Moral Luck

  This is the crux. Does supererogation require *success*?

  **Option A: No credit (Outcome Luck dominates).**
  If the category requires actual good, Oates gets no moral credit. This aligns with a hard consequentialist view where moral worth tracks state-of-affairs. But this makes morality a lottery. If a blizzard had lifted 12 hours later, Oates is a saint. Since it didn't, he's a corpse who made a miscalculation. This is intuitively repugnant to non-consequentialists.

  **Option B: Credit attaches to the decision under uncertainty.**
  This is the standard deontological/virtue ethics defense. We judge the maxim, not the outcome. Oates reasonably believed his removal increased the group's survival probability. The fact that the weather pinned Scott later is independent moral luck. On this view, Oates is fully supererogatory.

  **Option C: Motive vs. Effect Split.**
  The act was supererogatory in *motive* but neutral/failed in *effect*. This suggests the category is fractured. We praise the virtue (courage, selflessness) but cannot classify the *act* as "morally good" in the consequential sense.

  **My Verdict:** I sign up for **Option B**. If we demand actual success for supererogation, we collapse the category into "successful altruism." We lose the ability to praise the firefighter who dies entering a building that turns out to be empty, or the donor whose organ is rejected. Supererogation must track the *attempt to exceed duty*, not the *success of the outcome*. Otherwise, the "demandingness objection" wins by stealth: you are only praised if you actually save the day, which pressures agents to only act when success is guaranteed.

  ### 3. The Supererogation Paradox

  You asked: *If one ought to do whatever produces the most good and walking out was that thing, it's obligatory and there's no surplus merit left to praise.*

  This is the classic utilitarian squeeze on supererogation.
  *   **If Oates succeeded:** A maximizing utilitarian argues Oates *ought* to have done it. It becomes obligatory. Supererogation vanishes.
  *   **If Oates failed (as happened):** The utilitarian argues he *ought not* to have done it (waste of life, zero utility). It becomes wrong.

  The paradox only gets grip if you accept **Objective Obligation** (what you ought to do given the actual facts of the world). But moral agents operate under **Subjective Obligation** (what you ought to do given your epistemic position).

  Even if Oates had saved them, I would argue the act remains supererogatory because the *duty of self-preservation* and the *duty of team cohesion* (Scott said stay) create a deontic barrier. Overriding that barrier for the sake of others is the definition of "beyond duty," regardless of the utility calculus. The paradox dissolves if you reject the premise that "maximizing good" is the sole determinant of obligation.

  ### 4. The Kolbe Contrast and the Consequentialist Leak

  Contrast Oates with Maximilian Kolbe (Auschwitz, 1941).
  *   **Structure:** One life for a stranger.
  *   **Outcome:** Gajowniczek lived.
  *   **Verdict:** Paradigmatic supererogation.

  If we say Kolbe is supererogatory and Oates is *not* (because Oates failed to save anyone), then yes, **the category is covertly consequentialist.** It relies on a "success condition" that Urmson and the deontologists claim to reject.

  If the literature admits Oates is supererogatory *despite* the failure, it admits that the category is about **agent-relative virtue** rather than **agent-neutral good**. This is the hard pill for consequentialists to swallow. They want to say Oates made a mistake. Virtue ethicists say Oates manifested excellence.

  The Kolbe case is "cleaner" because the causal link held. Oates reveals that supererogation is often a narrative construct we apply *after the fact* based on the story's resolution. We need Kolbe's survival to sustain the myth of the sacrifice. Oates breaks the myth because the sacrifice was consumed by the indifferent universe.

  ### 5. The Small-Team Structure (The Missing Variable)

  This is the most under-theorized part of your prompt. The literature is obsessed with **Stranger Cases** (Kolbe, the drowning child, the grenade). It neglects **Joint Enterprise Cases**.

  In a five-man polar party, the deontic landscape is different:
  1.  **Mutual Reliance:** There is a pre-existing duty of care. Scott and Oates are bound by a social contract of the expedition.
  2.  **Refusal of Benefit:** Scott *refused* to leave Oates. This is crucial. In the Kolbe case, the stranger didn't (couldn't) refuse the sacrifice. In the Oates case, the beneficiaries actively rejected the trade.
  3.  **Role Duty:** Does a team member have a duty *not* to unilaterally alter the risk profile of the group? By leaving, Oates altered the psychological state of the survivors. Some argue this demoralized them; others say it galvanized them.

  **The "No Man Left Behind" Norm:**
  If the team norm is "we survive together or die together," Oates' act might be viewed as a **violation of duty** (abandonment of the shared fate) rather than a supererogatory excess. He took the choice out of Scott's hands.

  However, the counter-argument is that the *mission* (getting the journals/data home) superseded the *team survival*. Oates sacrificed himself for the *mission's* historical record, not just the men. Scott's journals were found; the mission was partially successful.

  **Why the literature misses this:**
  Standard supererogation theory assumes a dyad: Agent -> Recipient. It assumes the Recipient is passive. In the Oates case, the Recipients (Scott/Wilson/Bowers) are agents with their own moral veto. When the beneficiaries say "Don't do this," does doing it anyway count as "good"?

  If I jump on a grenade to save my squad, and my squad screams "Don't!", am I a hero or a rogue? The literature doesn't have a good slot for **Non-Consensual Supererogation**.

  ### Summary Verdict

  1.  **Category Status:** Oates is supererogatory **ex-ante**, not ex-post. If the category requires actual benefit, it is consequentialist and Oates is out. If it requires reasonable expectation of benefit, he is in. I argue for the latter to preserve the category's non-consequentialist integrity.
  2.  **The Paradox:** It doesn't grip if we distinguish subjective obligation from objective outcomes. Even if it maximized good, overriding the team's refusal keeps it in the "optional" bucket.
  3.  **Kolbe vs. Oates:** The difference in verdict relies on outcome luck. If we treat them differently, we admit the category is consequentialist. We should treat them the same to preserve the "saints and heroes" framework.
  4.  **Small-Team Dynamics:** This is the real breaker. The "Refusal of Benefit" by Scott introduces a deontic constraint that stranger-cases lack. Oates' act is supererogatory *relative to humanity*, but potentially **insubordinate relative to the team structure**.

  The Oates case suggests the supererogation category is too thin. It needs a sub-category for **"Futile Sacrifice"** (praiseworthy motive, null effect) and **"Non-Consensual Sacrifice"** (praiseworthy motive, rejected by beneficiaries). Without those, the machinery grinds against the reality of shared fate.
