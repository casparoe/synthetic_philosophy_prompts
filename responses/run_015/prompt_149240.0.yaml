answer: |-
  1. Is Principal a singular human? 2. Does Principal specify task end-state explicitly? 3. Does System select means without prior approval? 4. Is System authorized to override instruction for Principal's benefit?

  **Logical Space and Occupancy**
  The four binary nodes create 16 combinations. Occupied leaves map as follows: (Yes, Yes, No, _) → Mere Instrument (e.g., spreadsheet macro); (Yes, Yes, Yes, No) → Instrument with Discretion (e.g., autopilot maintaining user-set speed); (Yes, No, Yes, No) → Delegated Agent (e.g., booking bot told "get me to London"); (Yes, _, Yes, Yes) → Fiduciary Agent (e.g., trading system halting trade to prevent ruin despite "buy" instruction); (No, _, _, _) → System Coordinator (e.g., DAO treasury management). Unoccupied combinations: (Yes, Yes, No, Yes) is Incoherent (cannot override instruction if means are fixed); (Yes, No, No, _) is Unattractive (no ends specified but no means discretion renders system useless); (No, Yes, _, _) is Unexplored (non-human principal specifying explicit ends usually implies fixed means protocol).

  **Relativization and the Triple**
  I buy the triple argument (System, Principal, Task-under-a-description). The nodes are built relationally: Q2 asks if *this* principal specified *this* end, not if ends are specifiable in principle. A model drafting emails is a Mere Instrument if the principal approves every word (Q3=No, Q2=Yes effectively nullified by review), but a Delegated Agent if the principal says "handle complaints" (Q2=No). The leaves stay clean under this relativization because the classification shifts with the delegation context rather than the artifact's architecture. A trading system is an Instrument with Discretion relative to a risk manager setting limits, but a Fiduciary Agent relative to a shareholder expecting profit maximization over literal instruction adherence.

  **The Bureaucracy vs. Collective Collapse**
  The tree cannot separate "Agent of a Collective" from "Tool of a Bureaucracy" when Q1 (Human Principal) is No. If the principal is a distributed protocol (Q1=No), the system coordinates other systems (Leaf: System Coordinator). However, if the principal is a human collective operating via rigid rules (Bureaucracy), it maps to Q1=Yes (singular representative) or Q1=No (collective as entity). If the bureaucracy is treated as a black-box principal issuing explicit rules (Q2=Yes), the system is a Tool. If the collective is treated as a principal with broad interests (Q2=No), the system is an Agent. Without inspecting the internal governance of the principal to see if rules are ends or means, these leaves collapse. This is not a bug in the framing but an actual result: functionally, a system executing bureaucratic rules indistinguishably from a protocol is operating in the same logical space, regardless of whether we sociologically label the principal a "bureaucracy" or "collective."
