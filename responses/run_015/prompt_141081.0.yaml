answer: |-
  Your friend is partially right: Lewis describes the *structure* of what you call emergent communication, but his analysis targets stability where your field targets generalizability. The gloss you provided is faithful to Lewis (1969), but requires one correction: condition (c) must specify that the alternative regularity $R'$ is *also* a coordination equilibrium (almost everyone prefers $R'$ if others do $R'$). Without this, $R$ might be payoff-dominated rather than arbitrary.

  Here is the translation of the corrected conditions into your vocabulary.

  Clause (a) maps cleanly to **action selection under a joint policy** with low entropy. In your population $P$, the policy $\pi$ outputs the regularity $R$ with high probability in situation $S$. This is standard convergence.

  Clause (b) maps to **opponent model confidence**. Each agent's belief network assigns high probability to others executing $R$. However, in decentralized learning, this is often a **bug**: agents overfit to training partners rather than learning robust features. This is not a clean mapping unless you assume **centralized training with decentralized execution (CTDE)** where the critic enforces consistent beliefs.

  Clause (c) is the **equilibrium reached by independent learners** involving **symmetry breaking**. The reward function creates multiple Nash equilibria; $R$ is selected over $R'$ not by payoff dominance but by **exploration** noise or **seeded asymmetry**. This fits well, provided you acknowledge the alternative equilibrium exists in the reward landscape.

  Clause (d) is the breaking point. **Common knowledge** is **inexpressible** in your framework. You have separate belief networks trained against a **non-stationary environment**. To approximate this, you must assume **weight sharing** or a shared training distribution, which is a **hostage to your machinery**. Without it, you have mutual belief, not common knowledge.

  **Case 1 (Unlearnable Convention):** Lewis counts this as a convention. His conditions require stability and arbitrariness, not acquirability. The fact that a newcomer cannot bootstrap in is irrelevant to the definition; only the current population's state matters. Your field calls this a **cross-play failure** or **overfitting**. The divergence shows Lewis describes a static sociological fact, while you engineer for dynamic robustness. Lewis does not require switchability by a single agent; he requires a coalition shift to move equilibria. Your frustration here is engineering, not conceptual.

  **Case 2 (Sanction-Driven):** Lewis says this is *not* a convention. Condition (c) requires the preference to conform to stem from the expectation of others' conformity, not an external penalty. If removing the penalty unravels coordination, the preference was not conditional on others, but on the critic. Your field sees this as **reward shaping**; the policy optimizes the **reward function** regardless of source. The divergence reveals a normative gap: you lack a vocabulary for "self-enforcing" versus "externally enforced" stability. You treat all reward signals as equivalent incentives, whereas Lewis distinguishes coordination from compliance.

  Your field is rediscovering the mechanics of Lewisian conventions but stripping the epistemic and normative constraints. You solve for equilibrium stability; he solves for mutual recognizability. Working without his notion costs you the ability to distinguish robust social contracts from brittle reward hacking.

