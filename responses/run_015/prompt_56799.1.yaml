answer: |-
  Your gut is right. In my line of work, we learn that a theorem is only as good as the mapping between its variables and the world. Harsanyi's result is mathematically sound within its own closed system, but the popular summary you've read is doing what popular science often does: it treats the *assumptions* of the model as if they were *findings* of the model.

  Here is the sentence-by-sentence breakdown, followed by an assessment of the two specific claims.

  ### Sentence-by-Sentence Critique

  **1. "Take n people choosing among gambles over a fixed set of outcomes, each with a von Neumann–Morgenstern utility function, and suppose the preferences of the society as a whole satisfy the same rationality axioms the individuals do."**
  *   **Verdict:** **Acceptable setup, but load-bearing.**
  *   **Comment:** This is the standard formal setup. However, the second clause is the first major assumption. It asserts that "society" behaves like a single rational agent with a consistent preference ordering over gambles. In modeling terms, you are assuming the aggregate error structure cancels out perfectly to leave a clean signal. There is no empirical guarantee that collective human preferences satisfy the VNM axioms (specifically Independence), even if individuals do.

  **2. "Add one substantive condition — Pareto indifference: whenever every individual is indifferent between two gambles, society is indifferent too."**
  *   **Verdict:** **Harmless simplification (technically under-specified).**
  *   **Comment:** To get the result Harsanyi wants, you actually need the *Strong Pareto* principle: if everyone strictly prefers gamble A to B, society must strictly prefer A to B. Indifference alone isn't enough to force the weights to be positive. But for a summary, this is close enough. The real weight here is assuming that "society" can even have a preference distinct from the individuals that still obeys these rules.

  **3. "Then the society's utility function must be a weighted sum of the individuals', and up to the usual rescaling it is the only form it can take."**
  *   **Verdict:** **Mathematically correct.**
  *   **Comment:** Given the previous assumptions, the math holds. $U_{society} = \sum a_i U_i + b$. This is a linear aggregation result. It is a theorem, not an opinion.

  **4. "The weights are all positive, and if you further require that people be treated alike they come out equal, which is classical utilitarianism."**
  *   **Verdict:** **Correct deduction.**
  *   **Comment:** If you add an "anonymity" axiom (swapping people's utilities doesn't change the social value), the weights become equal. This does yield average utilitarianism.

  **5. "That disposes of two objections at once."**
  *   **Verdict:** **Wrong (Rhetorical overreach).**
  *   **Comment:** Theorems in social choice do not "dispose" of objections; they relocate them. The objections move from the conclusion back to the premises. If you reject the conclusion, you must now reject one of the axioms (VNM rationality for society, Pareto, or Anonymity).

  **6. "Interpersonal comparisons of utility were supposed to be meaningless, but once rationality is imposed you can add utilities across people on one common scale."**
  *   **Verdict:** **Wrong (The "soft one" you suspected).**
  *   **Comment:** This is the critical failure in the summary. VNM utility functions are unique only up to *positive affine transformations* (you can change the zero point and the unit size arbitrarily). Alice's "10 utils" and Bob's "10 utils" are incommensurable unless you fix their scales relative to one another.
      *   The theorem *assumes* there exists a social utility function that relates to individual functions. It does not tell you how to measure Alice and Bob on a common scale *independently* of that social function.
      *   In econometric terms: the model is unidentified without extra normalization. The summary claims the theorem *creates* the common scale; in reality, the existence of the social VNM function *presupposes* the comparability. It begs the question.

  **7. "And Rawls's maximin principle loses: as Harsanyi argued, behind a veil of ignorance where you have an equal chance of being anyone, expected-utility reasoning picks the sum rather than the worst-off position, so maximin isn't rational at all."**
  *   **Verdict:** **Contested/Question-begging.**
  *   **Comment:** This conflates the Aggregation Theorem with Harsanyi's separate "Veil of Ignorance" argument. It claims Maximin is "irrational." It is only irrational *if* you accept the VNM axioms (specifically the Independence axiom) as the sole definition of rationality. Rawls explicitly argues that in high-stakes, non-repeatable foundational choices (like designing a society), expected-value maximization is *not* the rational standard. The summary treats the VNM axioms as laws of physics rather than modeling choices.

  ---

  ### Do the "Disposed Objections" Survive?

  Here is the assessment of the two specific claims, stripped of the rhetoric.

  #### 1. The Claim on Interpersonal Comparisons
  *   **Claim:** The theorem proves we can compare utilities across people on a common scale.
  *   **Reality:** **No.** The theorem does not solve the measurement problem.
  *   **Where the load is:** The load is on the assumption that "Society has a VNM utility function."
      *   If you assume society has a coherent preference ordering that satisfies VNM axioms, and you assume Pareto, then yes, you can represent that social ordering as a sum of individual utilities.
      *   *However*, to do that, you implicitly have to already know how to trade off Alice's utility against Bob's. The theorem doesn't give you a ruler to measure Alice against Bob; it tells you that *if* you have a ruler that measures Society, that ruler must be composed of the individual rulers.
      *   **Verdict:** The objection that interpersonal comparisons are meaningless is not disposed of. The theorem simply assumes them away by positing a social preference order that implies them. It offers no empirical method to establish the scale.

  #### 2. The Claim on Rawls and Maximin
  *   **Claim:** Maximin is irrational because Expected Utility Theory (EUT) selects Utilitarianism behind the veil of ignorance.
  *   **Reality:** **No.** This is a clash of axioms, not a proof of irrationality.
  *   **Where the load is:** The load is on the **Independence Axiom** of VNM theory.
      *   Harsanyi's argument relies on the idea that behind the "veil of ignorance," you face a lottery with equal probabilities of being any person. If you follow EUT, you maximize the average utility.
      *   Rawls argues that the "veil of ignorance" is not a situation of risk (where probabilities are known) but of *uncertainty* (where probabilities are unknown or meaningless). Furthermore, Rawls argues that when the stakes are fundamental rights and life prospects, a rational agent should not gamble on the average if it risks catastrophic outcomes for the worst-off.
      *   Harsanyi calls this irrational because it violates the Independence Axiom. Rawls calls the Independence Axiom inappropriate for this specific domain.
      *   **Verdict:** The theorem does not prove Maximin is irrational. It proves Maximin is *incompatible with VNM axioms*. Whether VNM axioms are the correct standard for moral reasoning is a philosophical question the theorem cannot answer.

  ### Summary for a Modeler
  You know that fitting a line to data requires assuming the error term is well-behaved. Harsanyi's theorem is an elegant fit, but the summary you read treats the assumptions (Society is a VNM agent; Rationality = Expected Utility; Utility scales are compatible) as if they were data points confirmed by the regression.

  They are not. They are the priors. If you accept the priors, the conclusion follows. But the "objections" in philosophy are usually attacks on the priors, not the algebra. The summary claims the algebra defeats the attacks on the priors. That is the oversell.

  **Bottom line:** The math is fine. The interpretation that it settles the moral debate is not. The theorem shows that Utilitarianism is the *unique* solution to a specific optimization problem; it does not prove that our moral reality is actually that optimization problem.
