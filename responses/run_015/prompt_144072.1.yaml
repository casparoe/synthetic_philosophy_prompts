      The glass was thick enough to mute the breathing on the other side. Kaelin sat in the dim coolness of the Evaluation Booth, her fingers hovering over the haptic interface. On the screen, the subject's connectome unfolded like a luminous flower, petals of synaptic density blooming in real-time. Across the glass, Subject 8940 sat still. He was accused of structural sabotage. The charge did not allege malice. Malice was a superstition, a ghost from the era of Folk Law. The charge alleged only causal deviation.

      "State the vector," Kaelin said. Her voice was flat, practiced.

      "I wanted to stop the machine," 8940 said.

      Kaelin's fingers twitched. The interface flagged the word *wanted*. It was a Legacy Term. Her job was to scrub it. She watched the neural overlay. Ideally, *wanted* would correlate with a specific gradient in the ventral striatum, a predictable surge in dopaminergic anticipation. She would translate: *Subject exhibited high-amplitude reward-seeking activation in sector 7.* The court didn't care about wanting. They cared about the wiring that caused the hand to move.

      But today, the overlay was quiet. The striatum was dormant. Yet the subject's voice carried weight, a coherence that the biology denied.

      "Clarify the vector," Kaelin said.

      "I believed it was dangerous," he said. "I feared the outcome."

      *Believed. Feared.* More ghosts. Kaelin zoomed in on the amygdala. Standard baseline. No spike. No flood of cortisol markers. By all rights, Subject 8940 was lying. But the polygraph equivalents embedded in the skin sensors showed no stress deception. He was speaking truthfully about his experience, but his experience had no address in his flesh.

      This was the third case this month. The evaluators called them "Nulls." In a system designed to prove that the mind was just the brain singing to itself, the Nulls were singing a song the microphone couldn't pick up.

      Kaelin typed: *Subject asserts propositional attitude without corresponding neural instantiation.*

      It was an impossibility. The Jurisdiction had abolished intent because neuroscience had supposedly mapped the machinery of action. If you knew the gears, you didn't need to guess at the ghost. Beliefs and desires were merely outdated placeholders, like saying "the sun rises" when you know the earth turns. Eventually, mature science would delete the old language entirely.

      But looking at 8940, Kaelin felt a cold friction in her chest. He looked at her with eyes that seemed to hold a secret interiority, a private room where *he* was the one deciding, not the cascade of ions.

      "Why do you say 'believed'?" she asked, breaking protocol. "Your anterior cingulate shows no conflict resolution. Your hippocampus shows no retrieval of danger models. There is no 'belief' there. There is only signal processing."

      8940 leaned forward. "I know what I felt. I know I chose."

      "Choice is a narrative construct," Kaelin recited. "It is a post-hoc rationalization of deterministic outputs."

      "Then why does it hurt?" he asked. "If it's just output, why does the memory burn?"

      Kaelin paused. The word *hurt* hung in the air. Pain was nociceptive input. Suffering was... complicated. But *hurt* in this context meant something else. It meant a violation of expectation, a sorrow. She scanned his insula. Nothing. The map was blank where the territory claimed to be mountainous.

      She terminated the session. The screen went dark, leaving only her reflection superimposed over the dormant data.

      For weeks, she had fought the anomaly. She assumed the scanners were calibrated wrong. She assumed the theory was sound, but the technology crude. If the mind was nothing but the brain, then the brain must be hiding the data. But what if the brain wasn't hiding it? What if the map was perfect, and the territory was simply... elsewhere?

      She stood up, her joints stiff. The booth was silent. She walked to the biometric mirror in the corner, mandatory for staff stress monitoring. She looked at her own face. She thought about the Nulls. She thought about the subject's eyes.

      "I hope," she whispered to the empty room.

      It was a Legacy Term. A forbidden attribution. She waited for the shame, the automatic correction. Instead, she felt the weight of the word settle in her throat. It felt real. It felt like *her*.

      She activated her own wrist monitor. The readout scrolled rapidly: heart rate, cortisol, synaptic firing rates in the prefrontal cortex. She searched for the hope. She looked for the specific signature of *hoping*.

      The data streamed green and steady. There was arousal. There was anticipation. There was chemical flux. But there was no node labeled *hope*. There was no cluster that matched the feeling expanding in her chest.

      She stared at the numbers. They explained everything about her biology and nothing about her moment. The screen showed the machinery, but it did not show the operator.

      Kaelin turned off the monitor. The darkness returned, complete and absolute. She stood there, waiting for the feeling to fade, waiting for the science to catch up, or for the science to fail. In the silence, she could not tell if she was a machine dreaming it was a person, or a person trapped inside a machine that refused to see her.

      She took a breath. "I wonder," she said.

      The room offered no translation.

