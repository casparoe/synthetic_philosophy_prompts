  # JOINT STATEMENT ON DIACHRONIC CHOICE AND EXPLOITABILITY

  **Parties:** Camp A (Diachronic/Plan-Based) and Camp B (Synchronic/Node-Based)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Money Pumps and Rational Assessment

  ## I. AGREED CLAIMS
  *The following claims describe the formal setup and empirical consequences of the standard money pump scenario. Both camps accept these as the baseline for disagreement.*

  1.  **Welfare Outcome:** In a completed money pump sequence, the agent ends the sequence with less money and the same goods bundle than they possessed at the start, as evaluated by their own preferences at the start ($t_0$).
  2.  **Voluntariness:** In the standard model, no individual trade in the sequence involves coercion, fraud, misinformation, or transaction costs. Each trade is voluntarily accepted at the moment it is offered.
  3.  **Intrapersonal Nature:** In the standard model, the sequence of trades occurs within the lifetime of a single persisting agent. The "exploitation" is intrapersonal, not interpersonal.
  4.  **Counterfactual Basis:** The charge of irrationality does not depend on the pump actually occurring. An agent is assessable based on the *disposition* to accept the trades if offered, not merely on the actual history of offers.
  5.  **Environmental Hostility:** Both camps agree that the sequence of offers constitutes a "hostile" environment in the sense that it converts the agent's preference structure into a net loss. Both agree that a different environment might not generate this loss.

  ## II. DISAGREEMENTS TABLE
  *The following core disagreements are stated twice. Wording A reflects the conceptual framework of Camp A; Wording B reflects the conceptual framework of Camp B. Neither wording implies the other is mistaken; they reflect divergent ontologies of rational assessment.*

  | Topic | Wording A (Diachronic/Plan-Based) | Wording B (Synchronic/Node-Based) |
  | :--- | :--- | :--- |
  | **Locus of Assessment** | Rationality is a property of the **temporal plan**. A set of preferences is irrational if it generates a plan that is dynamically inconsistent and foreseeably self-defeating. | Rationality is a property of the **choice node**. A choice is rational if it maximizes expected utility relative to the preferences held at that specific moment. |
  | **Nature of the Defect** | The defect lies in the **preference structure**. Intransitive or independence-violating preferences are inherently flawed because they fail to secure the agent's own ends over time. | The defect lies in the **execution capacity**. The preferences are acceptable; the loss arises from a failure of resoluteness (willpower) to stick to a prior intention despite changing local incentives. |
  | **Normative Remedy** | The agent **ought to revise preferences**. To be rational, the agent must alter their underlying ranking of options to ensure dynamic consistency. | The agent **ought to exercise willpower**. To be successful, the agent must cultivate the capacity to bind their future choices without altering the underlying preferences. |
  | **Definition of Exploitation** | Exploitation is **self-inflicted harm**. The agent is both the perpetrator and the victim of a failure of self-governance. | Exploitation is **environmental extraction**. The agent is a victim of a market structure that monetizes the gap between local and global optimality. |

  ## III. CRUXES AND TEST CASES
  *For each disagreement, we identify a specific case that bears on the issue. Both camps accept these cases as relevant tests. Predictions are recorded in advance.*

  ### Crux 1: Free Precommitment
  **Case:** At $t_0$, the agent knows the pump sequence will begin at $t_1$. She is offered a costless, irreversible contract that binds her to reject the pump trades at $t_1$ and $t_2$. She declines to sign the contract.
  **Question:** Is declining the contract a rational failure? If so, is it distinct from the failure to resist the pump later?

  *   **Test:** Does the refusal to bind indicate a flaw in the *ranking* of outcomes or a flaw in the *capacity* to commit?
  *   **Prediction (Camp A):** Declining is a **second, distinct irrationality**. It proves the agent's preferences at $t_0$ are misaligned with their own long-term welfare. It is a failure of strategic self-governance.
  *   **Prediction (Camp B):** Declining is **not a rational failure**, or it is the *same* failure as later resistance. At $t_0$, keeping options open may be preferred. Failing to bind is a weakness of will (akrasia), not a failure of rational calculation. Rationality at $t_0$ only requires choosing what is preferred at $t_0$.

  ### Crux 2: The Impersonal Pump
  **Case:** Three distinct agents ($X, Y, Z$) exist simultaneously. Each has the same preference structure as the single agent in the standard pump. $X$ trades with Operator, then $Y$, then $Z$. The Operator profits; the aggregate wealth of $\{X, Y, Z\}$ decreases. No single agent makes more than one trade.
  **Question:** Does the argument for preference revision go through for a population as it does for a person over time?

  *   **Test:** Is diachronic personal identity necessary for the charge of irrationality, or is structural coherence sufficient?
  *   **Prediction (Camp A):** The argument **fails or weakens significantly**. Without diachronic identity, there is no "self" to be inconsistent. The loss is merely an aggregate social inefficiency, not a rational failure of any specific agent. The pump argument *requires* diachronic identity.
  *   **Prediction (Camp B):** The argument **holds identically**. The issue is local choice under specific constraints. Whether the trades happen across time or across people, the phenomenon demonstrates that locally rational choices can lead to aggregate loss. Identity is irrelevant to the node-based assessment.

  ### Crux 3: The Unvisited Agent
  **Case:** An agent possesses the exact preference structure that allows for a money pump. However, she lives in an environment where the specific sequence of offers never occurs. She never loses money.
  **Question:** Is there anything normatively wrong with this agent?

  *   **Test:** Is irrationality a dispositional property (like fragility) or an occurrent property (like breaking)?
  *   **Prediction (Camp A):** The agent is **irrational**. Rationality is a property of the preference structure itself. Being "pumpable" is a defect akin to having a logical contradiction in one's beliefs, regardless of whether anyone asks you to affirm both.
  *   **Prediction (Camp B):** The agent is **rational**. Rationality is assessed on actual choices made. If no irrational choices (relative to current preferences) are executed, no rational failure has occurred. Exploitability is only a problem when exploited.

  ## IV. VERBAL DISPUTE ANALYSIS
  *Where the parties suspect the disagreement is terminological rather than substantive.*

  Both camps acknowledge that a significant portion of the dispute is **verbal**, centering on the definition of the term "rationality."
  *   **Camp A** uses "rationality" to denote **instrumental efficacy over time**. For A, if a cognitive system systematically fails to secure its own ends due to internal inconsistency, it is by definition irrational.
  *   **Camp B** uses "rationality" to denote **procedural correctness at the moment of choice**. For B, if a cognitive system correctly processes current information to maximize current utility, it is rational, even if the system's architecture leads to long-term loss.

  **Substantive Remainder:** Even if the term "rationality" is disambiguated, a substantive disagreement remains regarding **precommitment norms**. Camp A prescribes changing the preference architecture; Camp B prescribes cultivating executive control (resoluteness). This is a disagreement about the correct *intervention*, not merely the label.

  \answer{mixed}
