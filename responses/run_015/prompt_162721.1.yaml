      *   *Taxonomy Critique:* Is "Archival Thesis" too passive? The Nazis destroyed a lot too. But the sheer volume remaining was the key. I'll note that.

  8.  **Final Polish:** Check against constraints.
      *   Did I say if the taxonomy is junk? (No, it's strong).
