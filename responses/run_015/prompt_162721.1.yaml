answer: |-
  This is a strong framework. Your taxonomy is not junk; in fact, the "evidentiary boomerang" addition rescues the slogan from banality and makes it a usable analytical tool. Most undergraduates encounter "history is written by the victors" as a conversation-stopper (a relativist shrug). Your taxonomy turns it into a set of testable mechanisms.

  Here is the mapping run for the International Military Tribunal (IMT), adhering to your request for directness and confidence markers.

  ### 1. Assessment of the Taxonomy
  **Verdict:** Keep it.
  The first three theses (Archival, Framing, Uptake) are standard historiography, but they are correctly identified as distinct mechanisms. The "Losers' Counter-Histories" add-on is essential for Nuremberg because the "Clean Wehrmacht" myth is the perfect stress test for the "Uptake" thesis.
  The **"Evidentiary Boomerang"** is the strongest theoretical contribution here. It is the specific variable that distinguishes Nuremberg from the Moscow Show Trials (1930s) or the Tokyo Tribunal (where the dissenting opinions were far more scathing regarding victor's justice). If you drop this, the seminar slides into cynicism. If you keep it, you have a mechanism for explaining how truth survives power.

  ### 2. Who is "The Victor"?
  **Analysis:** The slogan assumes a monolith. The IMT had four.
  *   **The US (Jackson):** Wanted a judicial process to establish a record for the future, not just execute leaders.
  *   **The UK:** Concerned with legal precedent and sovereignty; worried about ex post facto laws.
  *   **The USSR:** Wanted a show trial to confirm aggressive war and extract reparations; initially pushed for summary executions.
  *   **France:** Concerned with sovereignty and the legal definition of "aggressive war."

  **The Fracture:** The "victor" was not a single author. The Soviet Union attempted to use the tribunal to write history regarding the Katyn massacre (blaming Germans). The Western allies, reviewing the evidence, realized the forensic timeline pointed to the NKVD.
  **Result:** The Katyn charge was quietly dropped from the final judgment.
  **Implication:** This breaks the "Uptake Thesis" in real-time. The victors *could not* force a specific historical narrative (Katyn = German) because the evidentiary rules they established for the tribunal constrained them.
  **Confidence:** High. (Documented in the IMT transcripts and Jackson's private correspondence).

  ### 3. Mapping the Theses against the IMT

  | Thesis | Verdict | Analysis |
  | :--- | :--- | :--- |
  | **Archival** | **Confirmed** | The Nazi bureaucracy was obsessive. The "paperwork survives" thesis holds overwhelmingly. The prosecution relied almost entirely on German documents, not witness testimony (to avoid "he said/she said"). Victory gave the Allies access to the Foreign Office and Wehrmacht archives. *Caveat:* The Nazis did destroy some records, but not enough to obscure the crime. |
  | **Framing** | **Confirmed** | "Crimes Against Humanity" and "Aggressive War" were victor categories. There was no pre-existing positive international law that criminalized *starting* a war in 1939. The victors created the grid. However, this was necessary to capture the scale of the horror; existing laws (war crimes) were insufficient. |
  | **Uptake** | **Mixed/Broken** | In the short term (1950s), this thesis holds: The Cold War necessitated West German rearmament. The "Clean Wehrmacht" myth (a Loser's Counter-History) successfully displaced the Nuremberg narrative in public school curricula for 20 years. The *archive* existed, but the *uptake* was blocked by new power dynamics (US vs. USSR). |
  | **Boomerang** | **Confirmed** | This is the critical win. The commitment to due process created a record that eventually killed the "Clean Wehrmacht" myth. When historians (like Fritz Fischer in the 1960s) returned to the IMT archive, the evidence constrained the political narrative. The victors' legal rigor eventually trapped the losers' lies. |

  ### 4. The Acquittals
  **Fact Check:** You are correct. **Three defendants were acquitted:** Hjalmar Schacht (economics), Franz von Papen (diplomacy), and Hans Fritzsche (propaganda).
  **Significance:**
  *   **Against Show-Trial Reading:** In a pure "victor writes history" scenario, acquittal is impossible. The political objective was the condemnation of the Nazi leadership *as a group*. Acquitting three high-profile figures embarrassed the prosecution and frustrated the Soviets.
  *   **For the Boomerang:** It proves the judges felt bound by the evidence rules Jackson insisted upon. Schacht, for example, was hated by the Allies, but the paper trail showed he had been sidelined before the war's worst crimes.
  *   **Confidence:** High. (IMT Judgment, Oct 1, 1946).
  *   **Retraction Condition:** If evidence surfaced that the acquittals were pre-negotiated political favors (e.g., Schacht had been passing intel to the US), the "Boomerang" thesis weakens. Current historiography suggests they were genuine legal decisions based on the specific indictments.

  ### 5. The Core Question: Relativism vs. Constraint
  **Does this case support the slide to "no fact of the matter"?**
  **Verdict:** No. Nuremberg argues strongly *against* that relativist conclusion.

  **Reasoning:**
  1.  **The Archive as Anchor:** The sheer volume of documented evidence (orders, memos, train schedules) created a "factual anchor" that power could not move. Even when the political will to prosecute faded (Cold War), the *facts* established at Nuremberg remained difficult to deny without lying.
  2.  **Constraint on Authors:** The US and UK committed to a process that allowed the defendants to present evidence. This risked embarrassing the victors (which it did, regarding Katyn and some Allied bombing policies), but it legitimized the record. Because the process was rigorous, the *conclusions* (that the Holocaust happened, that aggressive war was planned) survived the eventual shift in political power.
  3.  **The Relativist Trap:** If "history is written by the victors" means "truth is relative to power," Nuremberg refutes it. The Holocaust did not become "less true" when the Cold War made the US and West Germany allies. The *narrative emphasis* shifted (Uptake Thesis), but the *factual core* (Archival/Boomerang) held.

  **Where the Theory is Silent:**
  Your taxonomy does not fully account for **time**. The "Uptake Thesis" failed for 20 years, then the "Boomerang" kicked in. The slogan "History is written by the victors" implies a static inscription. Nuremberg shows history as a contest between the *Archival Record* (static) and the *Political Uptake* (dynamic). Your "Boomerang" concept bridges this, but you need to emphasize the *lag time*. The victors wrote the initial draft, but the evidence allowed later generations to edit it.

  ### 6. Confidence and Retraction Protocol

  *   **Confidence in "Boomerang" Confirmation:** 90%.
      *   *Retraction Condition:* If the "Clean Wehrmacht" myth had *never* been dismantled by the archive (i.e., if we still believed the Wehrmacht was clean today), I would retract this. The fact that the IMT archive was the primary weapon used by the 1960s generation to break the myth confirms the thesis.
  *   **Confidence in "Acquittals as Evidence of Integrity":** 80%.
      *   *Retraction Condition:* If declassified intelligence shows the US/UK knew Schacht was guilty of conspiracy but let him go to secure economic expertise for reconstruction, the acquittals become political, not legal. (There is some evidence of this regarding utility, but the legal reasoning in the judgment stands on evidentiary gaps).
  *   **Confidence in "Relativism Refuted":** 95%.
      *   *Retraction Condition:* If the core findings of the IMT (existence of gas chambers, plan for aggressive war) were successfully overturned by later historical inquiry using the *same* archive. They have not been; they have been deepened.

  ### Recommendation for the Seminar
  Don't abandon the slogan, but force the students to break it using your taxonomy.
  1.  **Start with the Slogan:** Ask if Nuremberg proves it.
  2.  **Introduce the Acquittals:** This usually breaks the "Show Trial" assumption immediately.
  3.  **Apply the Taxonomy:**
      *   *Archival:* Who kept the receipts? (The Nazis).
      *   *Framing:* Who made the rules? (The Allies).
      *   *Boomerang:* Did the rules trap the Allies? (Yes, on Katyn; Yes, on Acquittals).
  4.  **Conclusion:** Power writes the *first draft*, but evidence writes the *final draft*. Nuremberg is the case study where the victors chose evidence over expediency, and in doing so, created a history that outlasted their own political unity.

  This approach avoids the relativist trap while acknowledging the reality of power. It treats "History is written by the victors" not as a truth claim, but as a hypothesis to be tested against the transcript.
