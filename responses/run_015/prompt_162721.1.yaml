          *   Map the IMT case against the taxonomy (confirm/break).
          *   Identify "the victor" (complicated by the Four-Power coalition).
          *   Address the acquittals (3 defendants) and their significance.
          *   Address the core philosophical question: Does this support relativism ("no fact of the matter") or does the evidentiary record constrain the victors?
          *   **Crucial Constraint:** Be honest/critical. Don't politely work inside the taxonomy if it's flawed. Mark confidence levels. Say where the theory is silent.

  2.  **Evaluate the Taxonomy:**
