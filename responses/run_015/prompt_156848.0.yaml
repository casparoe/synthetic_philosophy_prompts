      *   **Task:** Construct a specific scenario (one paragraph, ordinary institution, adult humans, knowable facts) containing two considerations (one control, one target).
      *   **Target Condition:** "Orphan-rationale condition" - no agent has/could have/could be guided by it (structural inaccessibility), no one is at fault for ignoring it, yet it does normative work (explains why a rule/arrangement is right), makes a difference to whether the arrangement ought to be set up that way, but *no difference to what anyone ought to do* (avoiding the "someone ought to set it up" trap).
      *   **Verdicts:** Possessionism (No reason), Free-floatingism (Reason), Rationale-first (Rationale but not reason).
      *   **Analysis:** Show how each verdict derives from the view's account. Identify the single feature doing the work. Test removing the structural-inaccessibility condition.
      *   **Objection/Reply:** Strongest possessionist re-description vs. best reply.
      *   **Format:** Continuous prose, no headings/bullet points/bold/tables, email style.

