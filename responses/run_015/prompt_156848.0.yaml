      *   *Possessionism:* Reasons require a reasoner. "There is a reason" = "Someone has a reason." If no one can have it, it's not a reason.
      *   *Free-floatingism:* Reasons are objective considerations counting in favor. Existence independent of agents.
      *   *Rationale-first:* Rationales exist as normative structures. They count as "reasons" only if they play a role in deliberation/assessment.

