      *   *Better idea:* The "Silent Alarm" case. A hospital ward's handover protocol.
      *   *Refining the "Structural Inaccessibility":* It needs to be impossible for any agent to have it. Not just hard. Maybe it involves a fact about the system that is only visible from a "view from nowhere" but no one occupies that view, and no one can occupy it.
      *   *Wait, the prompt says "facts are ones the people running the place could actually know."* This contradicts "structurally inaccessible" if interpreted as "unknowable fact".
      *   *Re-reading constraint:* "the only facts are ones the people running the place could actually know." BUT the target consideration must meet the orphan-rationale condition: "no agent in the story has it, could come to have it, or could be guided by it, where the inaccessibility is structural rather than a matter of anyone being ignorant..."
      *   *Resolution:* The *fact* must be knowable in principle (naturalistically), but the *normative force* or the *connection* is structurally inaccessible to deliberation. Or, the fact is knowable, but *using* it as a reason is impossible because of the institutional structure.
      *   *Actually, looking closer:* "no agent... could come to have it... inaccessibility is structural". This suggests the fact itself might be known, but it cannot be *had as a reason*.
