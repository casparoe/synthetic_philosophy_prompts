answer: |-
  You have put your finger on one of the deepest and most debated problems in the philosophy of science. You are describing the tension between **Accommodation** and **Prediction**, and the specific puzzle you're wrestling with is known as **The Problem of Old Evidence**.

  However, the "real cut" you are looking for—the thing that distinguishes your grad student friend from Einstein—is usually discussed under the banner of **Use-Novelty** and **Model Rigidity** (or Degrees of Freedom).

  Here is the breakdown of the names, the distinction, and why the "aiming" feels contradictory.

  ### 1. The Names

  *   **The Move:** When a theory explains data that was already known, it is called **Accommodation**. When it explains data that was not known (or not used) at the time of construction, it is called **Prediction**.
  *   **The Puzzle:** The fact that old evidence (like Mercury's orbit) seems to confirm a new theory (General Relativity) even though, logically, the probability of that evidence was already 100%, is called **The Problem of Old Evidence**.
  *   **The Criterion:** The rule that determines whether accommodation counts as confirmation is the **Use-Novelty Requirement**. Data counts as strong confirmation only if it was *novel to the theory*—meaning it was not used to construct or tune the theory.

  ### 2. Where the Real Cut Is

  You asked if the distinction is about timing, commitment, or strangeness. The answer is **Degrees of Freedom** (sometimes called **Rigidity** or **Flexibility**).

  The question isn't "Did they know the fact?" (Einstein knew about Mercury). The question is: **"Did the fact constrain the theory, or did the theory constrain the fact?"**

  #### Case A: The Grad Student (Overfitting / Ad Hoc)
  Your friend looked at a known correlation and built a model to reproduce it.
  *   **Degrees of Freedom:** High. The student likely had adjustable parameters (knobs) they could turn until the line hit the data points.
  *   **The Logic:** If a model has enough free parameters, it can fit *any* data. A curve with enough bends can connect any set of dots.
  *   **The Verdict:** Because the model was **tuned** to the data, the data did not *risk* falsifying the theory. The theory was built to survive that specific fact. This is statistically called **Overfitting** and philosophically called an **Ad Hypothesis**.
  *   **Why "Aiming" hurts here:** The aiming was *downward* from the data to the parameters. "I need the curve to go through *this* point."

  #### Case B: Einstein / Mercury (Novel Success / Rigidity)
  Einstein derived General Relativity from broad principles (equivalence, general covariance), not from planetary orbits.
  *   **Degrees of Freedom:** Near Zero. Once Einstein wrote down the field equations, there were no "Mercury knobs" left to turn. The theory was **rigid**.
  *   **The Logic:** The theory *could* have predicted a perihelion shift of 10 arcseconds, or 100, or none at all. It was vulnerable. When he calculated the number and it matched the known anomaly (43 arcseconds/century) without tweaking, it was a shock.
  *   **The Verdict:** Even though the fact was old, the *success* was novel. The data was not used in the **construction** of the theory, only in its **justification**. This satisfies **Use-Novelty**.
  *   **Why "Aiming" helps here:** You are misremembering the aiming slightly. Einstein wasn't aiming *at the number*; he was aiming *at the principles*. The number was a **derivational consequence**. If he had tweaked the math to get 43, it would have been like your grad student. He didn't. He got 43 because the math forced it.

  ### 3. The Bayesian Explanation (The "Risk" Factor)

  To square the circle, it helps to look at this through Bayesian confirmation theory.

  Confirmation happens when a theory makes a fact more probable than it was before.
  $$ P(Theory | Data) \propto P(Data | Theory) $$

  *   **Grad Student:** $P(Data | Theory)$ is essentially 1.0, but only because the theory was defined *by* the data. The theory didn't "stick its neck out." It didn't take a risk. No risk, no glory.
  *   **Einstein:** $P(Data | Theory)$ was low *before* the calculation, because the theory was rigid. There were many other values the theory could have yielded. By yielding the *correct* old value, it survived a severe test.

  The philosopher Imre Lakatos called this the difference between a **Progressive Problem Shift** (predicting novel facts or explaining anomalies without tinkering) and a **Degenerating Problem Shift** (adding patches and parameters to save a theory from known facts).

  ### 4. Summary of Terms

  If you want to sound precise about this in the future, here is the vocabulary:

  1.  **Accommodation:** Explaining known data. (Neutral term).
  2.  **Use-Novelty:** The requirement that data must not be used in the *construction* of the theory to count as strong confirmation. (This saves the Einstein case).
  3.  **Overfitting / Curve Fitting:** Creating a model with too many parameters to match existing data. (This kills the Grad Student case).
  4.  **Ad Hoc Hypothesis:** A modification to a theory made solely to save it from a counter-example, without adding new predictive power.
  5.  **The Problem of Old Evidence:** The philosophical puzzle of how known facts can confirm new theories.

  ### The Verdict on "Aiming"

  You wrote: *"Sometimes aiming is a big discount... Sometimes the aiming looks like the whole reason it's impressive."*

  The correction is this: **Aiming at the *data* is a discount. Aiming at the *principles* is impressive.**

  *   **Grad Student:** Aimed at the data. (Bad)
  *   **Einstein:** Aimed at the principles; the data was a target of *opportunity*, not a target of *design*. (Good)

  The cut is not about whether the theorist *knew* the fact. It is about whether the theorist had the **power to change the theory** to fit the fact. If they had the power and used it, it's overfitting. If they lacked the power (because the theory was rigid) and the fact fit anyway, it's a triumph.

  **One final historical nuance:** Historians actually debate whether Einstein *did* know the exact Mercury number while finalizing the equations. Some say he did and was relieved; others say he calculated it after. But philosophically, it doesn't matter. The equations themselves did not contain a parameter for Mercury. That **structural rigidity** is what earns the credit, regardless of what was in Einstein's head at the time.
