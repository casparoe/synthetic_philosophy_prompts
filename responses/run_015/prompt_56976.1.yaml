answer: |-
  The residue supports your suspicion that the capacity threshold is empirically indeterminate within welfare science, but it confirms your friend's claim that welfare science lacks the normative machinery to forbid use based on status alone, revealing the conflict as a category error between descriptive measurement and deontological constraint.

  To translate Nozick rigorously into your vocabulary: his "utilitarianism for animals" is precisely your **harm-benefit analysis (HBA)**, where severity scores (suffering) are aggregated against scientific or societal benefit to determine protocol approval. His "Kantianism for persons" corresponds to the **absolute prohibitions** enforced by Human Research Ethics Committees, where informed consent acts as a side constraint that cannot be overridden by aggregate benefit. The "plan-shaping capacity" he cites as the potential ground for this asymmetry maps to **cognitive complexity and behavioural flexibility**, which you measure via preference tests, cognitive bias assays, and demand curves. However, I must correct your description of Nozick: he does not definitively assert that plan-shaping *is* the ground of rights; he proposes it as a candidate explanation for our intuitions while explicitly maintaining agnosticism about the metaphysical basis of rights, treating the hybrid view as a probe rather than a settled doctrine. In your terms, Nozick is admitting there is **no validated biomarker for moral status**, only proxy indicators that correlate with our intuitive distinctions.

  The residue report breaks down as follows. The **aggregative treatment of animals** lands cleanly as HBA; your procedure explicitly sums suffering across individuals to weigh against benefit, mirroring the utilitarian calculus Nozick describes. The **side constraints on persons** land only after being bent out of shape; your framework contains no equivalent absolute veto for animals based on status, only severity limits based on welfare outcomes (e.g., humane endpoints), meaning the "constraint" is contingent on the measurement of suffering rather than the status of the subject. The **plan-shaping capacity** has no expression in your framework as a threshold; your data presents this capacity as a **continuum of behavioural flexibility and environmental control** across species, lacking the binary switch required to ignite rights. Finally, Nozick's **uncertainty about grounds** translates accurately as the lack of empirical consensus on which welfare indicators correlate with moral standing, though your field treats this as a measurement problem while he treats it as a philosophical one.

  This residue settles the dispute by showing that you and your friend are operating in different categories. Your friend is correct that welfare science is conceptually impoverished regarding *normativity*; your indicators measure *how well* an animal is doing (welfare state), not *whether* it may be used (moral status), so your framework cannot generate the "no" that rights provide. However, you are correct that the philosophical justification for that "no" is empirically indeterminate; the "plan-shaping capacity" does not appear in your data as a binary threshold, and your institutional practice (HBA) already functions utilitarianly regardless of the theoretical status of the animal. For your friend's reading to be right—that the missing piece is a deep fact your discipline lacks—you would need to discover a binary biological or cognitive marker that correlates perfectly with moral status, transforming a continuum into a threshold. For your reading to be right—that the philosophical claim is indeterminate—it must remain true that moral status is a normative imposition rather than an empirical discovery, meaning no amount of welfare data will ever generate a side constraint without an external ethical decision.

  I am highly confident in the mapping of harm-benefit analysis to utilitarian aggregation and in the diagnosis of the continuum-versus-threshold mismatch between welfare science and rights theory. The point I am least sure of is the extent to which Nozick personally endorsed the plan-shaping capacity as the most likely ground for rights versus merely presenting it as a dialectical tool to test intuitions, as his writings maintain a deliberate agnosticism on the metaphysical foundation.
