  **Decision:** Rejection.

  **Closest Analog:** *Problematic News Monitoring.*

  **Analysis of Consistency and Rules**

  To be consistent with our recent record, we must reject the proposal for Persistent Sensory Intolerance (PSI). While the *Compulsive Gaming* precedent might suggest inclusion based on self-identification, the *News Monitoring* and *Persistent Bereavement* precedents establish stricter criteria regarding stability and validity that PSI fails to meet.

  Our committee has not been running a single simple rule, but rather a hierarchy of priorities that becomes visible only when the rules conflict. The operative principle we have actually been following is: **Validity and Stability trump Advocacy and Downstream Utility.**

  *   **Validity/Stability:** We added *Bereavement* only because prevalence had plateaued and other manuals had stabilized the category. We added *Gaming* because a decade of clinical practice had solidified the boundaries. We dropped *High-Functioning Autism* because boundaries did not hold.
  *   **Advocacy/Utility:** We acknowledged advocacy in *Bereavement* and *Premenstrual Syndrome*, but only after validity was established. We ignored advocacy in *Autism* when validity failed. We rejected *News Monitoring* despite reported impairment (utility) because the category was too universal and unstable.

  **Where the Rules Come Apart**
  This case exposes a fracture between our *Gaming* precedent and our *News Monitoring* precedent.
  *   **The *Gaming* Rule:** If a community self-identifies and clinics form, the "kind" exists, and we are merely recording it. (Supports Inclusion).
  *   **The *News Monitoring* Rule:** If a behavior is near-universal in mild form, lacks a marker, and is driven by media attention, coding it recruits the "worried well" and creates a fugue. (Supports Rejection).

  PSI sits precisely on this fault line. It has the organized community of *Gaming*, but it has the trajectory of *News Monitoring* (referrals tripled in five years; driven by short-form video). Crucially, in *Gaming*, clinics existed for a decade before coding, suggesting the "kind" had settled. In PSI, clinicians report patients arriving with *draft criteria*, suggesting the classification is *preceding* the clinical reality, not recording it. This reverses the causality we accepted in *Gaming*. Furthermore, unlike *Bereavement*, prevalence is not plateauing; it is accelerating, triggering our *Fugue* caution. Unlike *Premenstrual Syndrome*, accommodations are already available via general disability routes, removing the downstream necessity that justified *Bereavement*.

  **Principles Committed by Each Decision**

  1.  **Full Inclusion:** Commits us to the principle that **self-identification and community formation are sufficient for validity**, even in the absence of biomarkers or stable prevalence. It prioritizes *Access and Agency* over *Scientific Stability*. This would contradict our *News Monitoring* and *Bereavement* (stability clause) precedents.
  2.  **Research Listing:** Commits us to the principle that **potential kinds deserve investigation even if they risk recruiting the worried well.** This contradicts our *News Monitoring* decision, where we explicitly refused a research listing on the ground that it would recruit the worried well. It treats PSI as more scientifically promising than News Monitoring without evidence of greater validity.
  3.  **Rejection:** Commits us to the principle that **diagnostic categories must demonstrate stability and distinctness before they are licensed,** regardless of patient advocacy or industry funding needs. It prioritizes *Non-Maleficence (avoiding fugue/pathologizing)* over *Utility*. This aligns with *News Monitoring*, *Autism*, and the stability clause of *Bereavement*.

  **The Deciding Evidence or Proposal**

  To best tell the rules apart—specifically to distinguish whether we are "recording a kind" (*Gaming*) or "making one" (*Fugue/News*)—we need:

  **A longitudinal study of symptom onset relative to exposure to the label/social media content.**

  *   **Why:** Our *Gaming* decision relied on the assumption that the "kind" existed prior to the code (clinics existed for a decade). Our *News* decision relied on the fear that the label creates the symptoms.
  *   **Differentiation:** If data shows symptoms consistently *pre-date* exposure to the online community and draft criteria, it supports the *Gaming* rule (Record). If symptoms *post-date* or correlate tightly with exposure, it supports the *News/Fugue* rule (Make).
  *   **Current Gap:** The dossier admits self-referral follows video and symptom-checkers, but we do not know if the distress existed prior. Since this evidence may only be available after we act, the most consistent procedural move is **Rejection** pending such data, mirroring the *Bereavement* requirement for stability before coding.
