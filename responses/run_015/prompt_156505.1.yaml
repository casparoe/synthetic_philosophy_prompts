answer: |-
  Here is the decision tree built from the logical space of our starting points, designed to be pasted directly into our email thread without any formatting that might break on different screens.

  Question One: Consider the graffiti case where the word is spray-painted on a wall overnight with no one present to see it until morning. Does the word do its harmful work or carry its derogatory force just by being there, or does it need a reader to feel attacked?

  Question Two: Consider the in-group case where members use the slur warmly among themselves. Is the derogatory meaning gone entirely in this context, or is the same meaning present but somehow turned off or suspended?

  Question Three: Consider the journalist case where an out-group reporter quotes what someone shouted in a courtroom. Does the journalist contaminate their own report by writing the word, or are they safely describing it without adopting its force?

  Question Four: Consider the actor case where a performer plays a bigot onstage. When the audience gasps, are they reacting to the character's belief or to the word itself being spoken in the real world?

  Question Five: Consider the habit case where a speaker uses the word sincerely but has none of the associated attitudes, out of pure habit. Is the word still derogatory even if the speaker does not mean it that way?

  Question Six: Consider the denial case where someone campaigning against the word says X is not S. Does the slur's negative force survive inside that denial, or does the denial kill it?

  Question Seven: Consider the misapplication case where a slur aimed at someone who isn't in G at all. Is the insult failed because the target does not fit the description, or successful because the speaker tried to apply it?

  Question Eight: Consider the reclaimed stranger case where someone who grew up in a city where the word got reclaimed uses it affectionately to a stranger from somewhere it never was. Is this one word used two ways or two lexical entries that happen to sound the same?

  To navigate this tree, start at Question One. If you said Yes to Question One, move to Question Six. If you said No to Question One, jump to Question Five. If you said Yes to Question Six, move to Question Two. If you said No to Question Six, you are ready for Leaf Five. If you said Yes to Question Five, move to Question Eight. If you said No to Question Five, you are ready for Leaf Two. If you said Yes to Question Two, move to Question Three. If you said No to Question Two, you are ready for Leaf Nine. If you said Yes to Question Three, you are ready for Leaf Ten. If you said No to Question Three, you are ready for Leaf One. If you answered No to Question Eight, you are ready for Leaf Eight. If you answered Yes to Question Eight, you are ready for Leaf Eleven. For any path not explicitly directed above, follow the logic of content versus effect to find the closest matching leaf among the remaining options, specifically using Question Four and Question Seven to distinguish between Leaf Three, Leaf Four, and Leaf Twelve.

  Leaf One: The Prohibitionist View. This position holds that the offense is not content at all but a standing prohibition on the word. The most awkward thing this position is stuck with is explaining why the word feels meaningful rather than just forbidden like a taboo noise.

  Leaf Two: The Purely Pragmatic View. This position holds that it is a purely pragmatic or perlocutionary matter of causing offense. The most awkward thing this position is stuck with is explaining why the offense persists even when the target is not present or does not hear it.

  Leaf Three: The Hybrid Expressive View. This is a hybrid view where the derogation rides on a separate expressive dimension alongside truth-conditional content. The most awkward thing this position is stuck with is explaining why the expressive content cannot be easily cancelled without sounding insincere.

  Leaf Four: Truth-Conditional Derogation. This view holds that the derogatory content is part of what is said and affects the truth conditions. The most awkward thing this position is stuck with is explaining how the word can be used non-derogatorily without changing the truth value of the sentence.

  Leaf Five: The Presupposition View. This view holds that the derogation is presupposed rather than asserted. The most awkward thing this position is stuck with is explaining why the presupposition projects through negation but seems to vanish in some indirect reports.

  Leaf Six: Unnamed Incoherent. This combination suggests the word has semantic content but requires an audience to feel attacked to function. This is incoherent because semantic content is usually understood as stable across contexts of reception.

  Leaf Seven: Unnamed Unattractive. This combination suggests the offense depends entirely on target sensitivity rather than word history. This is unattractive because it lets speakers off the hook for using historically loaded language.

  Leaf Eight: Unnamed Unexplored. This combination suggests lexical ambiguity only for reclaimed uses while maintaining single entry elsewhere. This is merely unexplored because most theories commit to either full ambiguity or full contextualism.

  Leaf Nine: The Contextualist View. This view holds that the meaning shifts with context rather than being fixed. The most awkward thing this position is stuck with is explaining why some contexts feel like they suspend the meaning while others feel like they change it.

  Leaf Ten: The Use-Conditional View. This view holds that the meaning is in the conditions of use rather than truth conditions. The most awkward thing this position is stuck with is distinguishing itself clearly from the pragmatic view without collapsing into it.

  Leaf Eleven: Unnamed Collapse. This leaf represents where the Expressive and Presupposition views collapse at every node you have got. Say so plainly: these two views are indistinguishable here, and an extra case involving embedding under conditionals would pry them apart.

  Leaf Twelve: Unnamed Gap. This leaf covers the view that the habit user is sincere but the word is inert. This is unexplored because it requires a theory of semantic drift that no one has fully formalized yet.

  The single question that does the most sorting work is Question One about the graffiti, because it forces you to decide immediately whether the derogatory force is a property of the word itself or a property of the interaction, which splits the semantic camps from the pragmatic camps right at the start.
