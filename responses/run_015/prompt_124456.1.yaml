  1.  **Analyze the Prompt:**
      *   **Core Task:** Distinguish between "indexical conventions" (local, contingent, coordination-based) and "categorical moral obligations" (universal, principle-based).
      *   **Application:** Apply this distinction to three specific cases: tipping, queueing, and jaywalking.
      *   **Key Question:** Do these generate *genuine moral duties* for participants, or only prudential/game-theoretic reasons?
      *   **Crucial Twist:** Assess the status of the *visitor/outsider* who knowingly flouts the convention. Is it a moral wrong or just folly? Do outsiders have a special normative relation (permission vs. obligation)?
      *   **Requirement:** Take a clear, defended position (no agnosticism). Weigh counterarguments. Justify a specific verdict.

  2.  **Deconstruct the Concepts:**
      *   *Indexical Conventions:* Rules like "drive on the left" or "tip 20%." Their force depends on *where* you are and *what* others are doing. They solve coordination problems. Violation causes friction but not necessarily harm in the abstract.
      *   *Categorical Moral Obligations:* Rules like "do not kill" or "keep promises." Their force is supposed to be universal, regardless of location or social context.
      *   *The Bridge:* Can conventions *become* moral obligations? (e.g., Fair Play principle, Promise-keeping implicit in participation).

  3.  **Formulate a Thesis:**
      *   *Option A (Strict Separation):* Conventions are never moral. They are just prudential. (Too rigid, ignores harm caused by breaking coordination).
      *   *Option B (Full Assimilation):* All conventions are moral duties. (Too demanding, conflates etiquette with ethics).
      *   *Option C (The Fair Play/Participation View):* Conventions generate moral duties *for participants* based on fairness and reliance, but visitors have a weaker obligation, limited by notice and integration.
      *   *Selected Position:* I will argue for a **moderate moral realism regarding conventions**. Indexical conventions *do* generate genuine moral duties for those integrated into the practice, grounded in the principle of *fair play* and the prevention of *harm via disruption*. However, the *visitor's* obligation is attenuated. It is not merely prudential, but it is contingent on *reasonable notice* and *temporary participation*. Deliberate flouting by a visitor is a minor moral wrong (disrespect/unfairness), not just folly, but distinct from violating a categorical imperative.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Define the distinction (Indexical vs. Categorical).
          *   Introduce the three cases (tipping, queueing, jaywalking).
          *   State the thesis: Conventions carry *derivative* moral weight based on fairness and reliance. Visitors are bound, but the threshold for violation is higher (requires knowledge and intent).

      *   **Section 1: The Nature of Indexical Conventions:**
          *   Explain *why* they exist (coordination, efficiency).
          *   Explain the "moral gap." Why isn't driving on the left inherently moral? Because the *side* doesn't matter, the *coordination* does.
          *   Introduce the mechanism that makes them moral: *Reliance* and *Fair Play*. If I benefit from the order, I must uphold it.

      *   **Section 2: Applying the Distinction (The Three Cases):**
          *   *Queueing:* High moral weight. Cutting is theft of time/position. It violates fairness directly.
          *   *Tipping:* Complex. In some contexts (US), it's wage subsidy. Not tipping here is harming the worker (moral). In others, it's bonus.
          *   *Jaywalking:* Low moral weight usually, unless safety is compromised. It's mostly legal/prudential. But if it disrupts traffic flow significantly, it becomes a fairness issue.
          *   *Synthesis:* These aren't just aesthetic. They affect others.

      *   **Section 3: The Visitor Problem:**
          *   This is the crux. Does a tourist have to queue?
          *   *Argument for Exemption:* "When in Rome..." implies obligation, but does ignorance excuse?
          *   *Argument for Obligation:* You are using the public good (the queue system).
          *   *My Verdict:* Knowledge is key. If the visitor *knowingly* flouts it, it is a moral wrong (disrespect/unfairness), not just folly. They are temporarily entering a cooperative scheme.
          *   *Nuance:* The duty is weaker than for a local. It's a duty of *non-disruption* rather than *full endorsement*.

      *   **Section 4: Counterarguments & Rebuttal:**
          *   *Counter 1:* Moralism is overbearing. Let people be different.
          *   *Rebuttal:* Ignoring conventions harms locals who rely on them. It's arrogant.
          *   *Counter 2:* Conventions are arbitrary, so they can't be moral.
          *   *Rebuttal:* The *content* is arbitrary, the *obligation to coordinate* is not. (Schelling points).
          *   *Counter 3:* Visitors are exempt because they don't benefit long-term.
          *   *Rebuttal:* They benefit *while there*. Free-riding is still free-riding.

      *   **Conclusion:**
          *   Restate thesis.
          *   Summarize the derivative nature of the duty.
          *   Final verdict: Visitors who knowingly flout rules commit a pro tanto moral wrong (unfairness), even if not a grave sin.

  5.  **Refining and Polishing:**
      *   *Tone:* Philosophical, analytical, firm.
      *   *Vocabulary:* Use terms like *pro tanto*, *free-rider problem*, *normative force*, *derivative obligation*.
      *   *Check:* Did I address the "prudential vs. moral" distinction clearly? Yes. Did I address the visitor specifically? Yes.
      *   *Self-Correction during drafting:* I need to make sure I don't conflate legal and moral. Jaywalking is often illegal, but is it *immoral*? I need to distinguish safety (moral) from mere rule-breaking (conventional). I will argue that without safety risk, jaywalking is mostly prudential/legal, but queueing is more deeply moral (fairness). Tipping is economic morality. I need to be precise.
      *   *Refining the Visitor Verdict:* I need to be careful not to say a visitor has the *exact same* duty as a local. The duty stems from *participation*. A visitor participates less. But *knowing flouting* is the key. If they know and do it anyway, they treat locals as mere means to their convenience. That is Kantianly problematic.

  6.  **Final Review against Prompt:**
      *   Distinguish indexical vs. categorical? Yes.
      *   Apply to tipping, queueing, jaywalking? Yes.
      *   Assess visitor status? Yes.
      *   Clear defended position? Yes (Derivative Moral Duty).
      *   No agnosticism? Yes.

  7.  (Proceed to generate output based on these thoughts.)
answer: |-
  **The Morality of Coordination: Indexical Conventions and the Obligations of Visitors**

  Philosophical ethics has traditionally prioritized categorical obligations—universal duties such as prohibitions against violence or deceit—over local customs. However, human social life is largely governed by what we might term "indexical conventions": coordination rules whose normative force depends on one's contingent social position, geography, or participation in a specific practice. The central question is whether these conventions possess genuine moral weight or merely offer prudential, aesthetic, or game-theoretic reasons for compliance. Furthermore, does the status of a "visitor"—an outsider temporarily within the practice—alter this normative landscape?

  This essay argues that indexical conventions generate **derivative moral obligations** grounded in the principles of fair play and reliance. While the specific content of a convention (e.g., which side of the road to drive on) is morally arbitrary, the obligation to adhere to it once one benefits from the cooperative scheme is not. Consequently, a visitor who knowingly and deliberately flouts a local convention commits a distinct moral wrong—specifically, a violation of fairness and respect—rather than engaging in mere practical folly. However, the strength of this obligation is proportional to the degree of integration and the clarity of notice.

  ### Indexical Conventions vs. Categorical Obligations

  To distinguish these concepts, we must look to the source of their normative force. A categorical moral obligation, such as the duty not to torture, derives its force from the intrinsic nature of the act and the status of moral agents. It applies universally, regardless of time, place, or social agreement.

  In contrast, an indexical convention derives its force from its function as a solution to a coordination problem. As David Lewis articulated, conventions are arbitrary regularities that persist because everyone expects everyone else to follow them. There is no intrinsic moral value in driving on the left rather than the right; the value lies entirely in *everyone doing the same thing*. If I drive on the left in London, I am not fulfilling a universal imperative; I am adhering to a local indexical rule.

  However, to classify these as merely "prudential" (i.e., "I should follow this to avoid a fine" or "to avoid awkwardness") is to misunderstand the social ontology of cooperation. When a convention stabilizes, it creates a system of reliance. Locals organize their lives, expectations, and economic security around the assumption that the convention will be upheld. To violate the convention is not just to make a strategic error; it is to exploit the cooperation of others while withholding one's own. This transforms the convention from a mere habit into a moral requirement via the **Principle of Fair Play**. If one accepts the benefits of a cooperative scheme (order, safety, efficiency), one incurs an obligation to bear the burdens of that scheme (compliance).

  ### Application to Tipping, Queueing, and Jaywalking

  Applying this distinction reveals varying degrees of moral weight across different practices.

  **Queueing** represents a convention with high moral density. While the rule "first come, first served" is arbitrary (we could distribute goods by lottery), the queue functions as a tangible embodiment of fairness and equal respect. To cut in line is not merely a breach of etiquette; it is a theft of time and position from those who invested effort in waiting. Here, the indexical convention maps directly onto a categorical concern: justice. Compliance is not just prudential; it is a duty to one's fellow participants.

  **Tipping** is more complex and culturally indexical. In the United States, tipping is not merely a gratuity but a subsidized wage mechanism. To dine in a US restaurant and refuse to tip is to consume labor without compensating it, relying on the social expectation that others will cover the worker's livelihood. In this context, tipping transitions from a voluntary gift to a deferred contractual obligation. To flout this is to harm a vulnerable party who relies on the convention. In cultures where service charges are included, tipping is merely aesthetic or bonus-based. Thus, the moral duty is indexical: it exists only where the economic structure relies on the convention.

  **Jaywalking** typically carries the lowest moral weight. In many contexts, crossing against a light when no cars are present is a victimless violation of a coordination rule designed for flow and safety. If safety is not compromised, the violation is primarily legal or prudential. However, if jaywalking disrupts traffic flow or forces drivers to brake unexpectedly, it imposes risk and inconvenience on others. In that specific instance, it ceases to be mere folly and becomes a violation of the duty of non-maleficence.

  ### The Normative Status of the Visitor

  The crucial test of this framework is the visitor. Does a tourist in London have a moral duty to queue, or are they exempt as an outsider? Some argue that visitors stand in a relation of permission; they are observers, not participants, and thus bound only by categorical laws (do not steal, do not kill), not local customs.

  This view is untenable. A visitor who enters a queueing system or a restaurant immediately becomes a beneficiary of the local cooperative scheme. They gain the efficiency of the queue or the service of the waiter *because* others are adhering to the convention. To knowingly flout the rule is to engage in **free-riding**.

  If a visitor knowingly cuts a line, they are not merely committing a social faux pas; they are asserting that their time is more valuable than that of the locals. This is an expression of arrogance and a failure of respect. It treats the locals as mere background conditions for the visitor's convenience rather than as co-participants in a moral community. Therefore, the violation is moral, not just prudential. It is a *pro tanto* wrong (a wrong that can be overridden by stronger duties, but a wrong nonetheless).

  However, the visitor's obligation is attenuated by two factors: **notice** and **integration**.
  1.  **Notice:** A moral obligation to follow a convention requires knowledge of the convention. A visitor cannot be morally culpable for violating a norm they could not reasonably know. However, the prompt specifies a visitor who *knowingly* flouts the rule. In this case, the excuse of ignorance is removed.
  2.  **Integration:** A local's duty is stronger because they are a permanent stakeholder in the system's stability. A visitor's duty is temporary. Yet, temporary participation does not grant moral immunity. Even a temporary player in a game is bound by the rules while at the table.

  ### Counterarguments and Rebuttal

  A strong counterargument suggests that moralizing conventions leads to ethical imperialism or excessive rigidity. If every social norm becomes a moral duty, we risk conflating etiquette with ethics, punishing cultural misunderstandings as sins. Furthermore, some argue that conventions are inherently arbitrary, and morality cannot be built on arbitrariness.

  This objection fails to distinguish between the *content* of the rule and the *duty to coordinate*. It is true that "queueing" is arbitrary compared to "lottery." But once "queueing" is the established mechanism for fairness, undermining it is not arbitrary; it is an attack on fairness itself. The moral weight does not come from the act of standing in line, but from the act of respecting the agreed-upon method of distribution.

  Regarding the visitor's exemption: One might argue that visitors contribute to the local economy and thus "pay" for their exemption. This is a category error. Economic contribution does not purchase the right to disrupt social coordination. Paying for a meal does not grant the moral right to abuse the server; similarly, tourism revenue does not grant the right to bypass the social contract of the street or the shop.

  ### Verdict

  We must conclude that indexical conventions carry **authentic, derivative moral weight**. They are not merely prudential guidelines for social smoothness; they are the micro-structures of trust and fairness that allow society to function. To violate them is to degrade the cooperative infrastructure that others rely upon.

  Regarding the visitor: **A visitor who knowingly and deliberately flouts a local convention commits a moral wrong.** It is a wrong of unfairness (free-riding on the compliance of others) and disrespect (devaluing the local normative order). It is distinct from mere folly because it involves a willful disregard for the expectations and reliance of other moral agents. While the severity of this wrong is generally less than violating a categorical imperative (it is worse to steal a wallet than to cut a line), it is not qualitatively different in kind. It is a breach of duty, not just a strategic error.

  Therefore, the maxim "When in Rome, do as the Romans do" is not merely advice for avoiding trouble; it is a moral imperative grounded in the duty of fair play. Visitors are not tourists in a moral vacuum; they are temporary citizens of the normative space they occupy, bound to uphold the conventions that sustain it.
