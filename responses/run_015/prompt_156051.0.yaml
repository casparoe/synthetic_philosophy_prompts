  **The one reply that has to land**
  The Metaethicist's is-ought challenge. You must argue that while surveys don't *constitute* moral facts, the structure of folk judgment provides a constraint on viable metaethical theories. If a theory requires all moral domains to be equally objective or equally constructed, and the data shows a structural asymmetry, that theory fails to explain the phenomenology of moral experience. You aren't proving realism; you're arguing realism is the best explanation for the welfare core's stability compared to the communal domain's plasticity. If this fails, you're just a psychologist. This bridge is the only reason a philosophy department hires you.

  **The question I'm hoping nobody asks**
  "If the communal domain is constructivist, does that mean interventions to stop purity-based violence are merely cultural imperialism?" This forces you to choose between respecting local construction and protecting individuals. If you say "yes, it's imperialism," you lose the Pol Phil. If you say "no, welfare overrides," you undermine the constructivist claim. You need a nuanced view where welfare constraints limit permissible constructions, but this risks collapsing back into full realism. Prepare a distinction between 'invalidating a practice' and 'refusing to recognize its moral force.' Walk in having heard this so you don't freeze when the Pol Phil corners you on normative implications.
