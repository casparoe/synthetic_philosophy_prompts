  **The objections**
  1. "Even if everyone agrees on harm, why does consensus make it objectively wrong rather than universally preferred?" (Metaethicist). **Answer:** I'm not deriving ought from is; I'm using folk structure as an inference to the best explanation for viable metaethics. Stability suggests truth-tracking. **Weakness:** Risks conflating epistemic access with truth.
  2. "Isn't 'welfare objectivity' just laundering Western liberal individualism into metaphysics?" (Pol Phil). **Answer:** Welfare constraints (pain, death) are pre-ideological biological facts, not liberal constructs. **Weakness:** 'Harm' definitions are culturally contested.
  3. "Your inter-rater reliability on weight vs. content is .65; isn't Claim 2 just noise?" (X-Phi). **Answer:** It's moderate agreement, but the effect size of the asymmetry remains significant across coding schemes. **Weakness:** Claim 2 is the empirical weak point.
  4. "Haidt did this in 2004; what does partitioned realism add beyond renaming Moral Foundations?" (Psych). **Answer:** MFT describes psychology; I'm making a metaethical claim about truth-aptitude based on that structure. **Weakness:** Risk of overstating philosophical novelty.
  5. "How do you know vignettes aren't just measuring comprehension of hypotheticals rather than moral commitment?" (Anthro). **Answer:** We triangulate with behavioral measures and reaction times, not just self-report. **Weakness:** Still lacks thick ethnographic depth.
  6. "Did you preregister the cutoff for 'large variation'? This looks like a multiverse problem." (X-Phi). **Answer:** The asymmetry holds across standard deviations, but I will share the full analysis code. **Weakness:** Post-hoc cutoffs look suspicious.
  7. "You're conflating folk judgment with moral facts; surveys don't touch metaphysics." (Metaethicist). **Answer:** Folk judgment constrains which metaphysical theories are psychologically sustainable for agents. **Weakness:** Doesn't prove facts exist.
  8. "If welfare is objective, how do you adjudicate conflicts between welfare and liberty in global justice?" (Pol Phil). **Answer:** Objectivity sets constraints, not a complete calculus; liberty operates within welfare bounds. **Weakness:** Vague on trade-offs.

