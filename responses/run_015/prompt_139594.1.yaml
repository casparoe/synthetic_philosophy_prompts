answer: |-
  **Mark: 16/25**
  This places the answer in the high 2:1 (upper second-class) range: it is articulate and structurally sound, but contains a fundamental philosophical error in the final section that undermines its conclusion.

  **Point-by-point comments**

  **(a) The Levelling Argument**
  You set out the distinction between a term having "no value" and a term being "constant across options" with clarity; this is the strongest part of the essay and demonstrates a good grasp of the decision-theoretic structure. You correctly identify that the critic targets the epistemic bridge between axiology and deontology rather than the value of the future itself. However, you slightly overstate the deontic component in your introduction by defining SLT as a strict maximizing instruction ("we ought always to act so as to maximize"); the question defines it comparatively ("considerably more"), and conflating the two makes the levelling critique seem easier to dismiss than it is.

  **(b) Astronomical Stakes and Leverage**
  Your calculation using the illustration is mathematically correct and shows you understand how expected value is computed. However, your rebuttal to the symmetry argument is under-defended and reads as correct while missing the critic's point. You argue that "magnitudes are astronomical" so symmetry cancels out; but if the mechanisms for worsening the future are *also* astronomical (as the critic stipulates), they still cancel in expectation regardless of size. You assume we can assign a positive probability to *improving* the trajectory, but the levelling critic's core claim is that under deep uncertainty, the probability of improving and worsening are indistinguishable. You have shown why stakes matter, but not why the *uncertainty* objection fails.

  **(c) Person-Affecting Axiology and Extinction**
  This section contains a significant philosophical error. You claim that on the Asymmetry, extinction deprives possible people of good lives and this is "bad for the person deprived." This contradicts the standard formulation of the person-affecting view and the Non-Identity Problem: if a person never exists, there is no subject for whom "being deprived" can be bad. The Asymmetry specifically entails that bringing a happy person into existence benefits *nobody*, and conversely, failing to bring them into existence (extinction) harms *nobody* in the person-affecting sense. Consequently, your conclusion that SLT survives "intact" on this axiology is incorrect; adopting the Asymmetry typically severs the obligation to ensure the future exists, limiting obligations only to making lives good *given* that people exist.

  **What a first-class answer to (c) would have had to establish**
  A first-class answer would have acknowledged that the person-affecting view blocks the claim that extinction is bad *for* the non-existent future people, thereby removing the "astronomical value" of potential lives from the calculus. It would then have explored whether strong longtermism can be reconstructed on this view (e.g., via obligations to existing people's projects) or must be significantly weakened to a "long-term person-affecting" view that ignores the sheer number of future people.
