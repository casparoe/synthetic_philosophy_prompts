answer: |-
  # Joint Statement on the Locus of Moral Responsibility in Modular Cognitive Architectures

  **Signatories:** Daniel C. Dennett (Tufts University) & Gregg D. Caruso (SUNY Corning)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Sub-Personal Modularity and Just Desert

  ## Part I: Agreed Claims Regarding Neuroscience, Punishment, and Justification

  We, the undersigned, acknowledge the following premises as common ground for this collaboration. These claims establish the empirical and logical boundaries within which our disagreement regarding modular desert operates.

  1.  **The Modular Nature of Decision-Making:** Cognitive science and neuroscience confirm that human decision-making is not the product of a unitary, homuncular commander. It arises from the competitive and cooperative interactions of sub-personal subsystems (e.g., inhibitory control circuits, predictive processing hierarchies, emotional valuation modules). There is no "Cartesian Theater" where consciousness integrates these signals prior to action.
  2.  **The Distinction Between Explanation and Justification:** Providing a causal explanation for a behavior (e.g., "neural pathway X fired") is logically distinct from providing a normative justification for blame or punishment (e.g., "the agent deserved sanction"). The existence of a causal mechanism does not, in itself, settle the question of moral responsibility.
  3.  **Instrumental Value of Social Sanctions:** Both parties agree that social responses to harmful behavior (incarceration, rehabilitation, restitution) serve instrumental functions: protecting the public, deterring future harm, and reinforcing social norms. We disagree on whether these practices can be *additionally* justified by backward-looking "basic desert" (the notion that an agent merits suffering purely because they morally failed, independent of future consequences).
  4.  **Neuro-Exculpation Limits:** We agree that the mere presence of a neural correlate to a behavior does not automatically exculpate an agent. If every action has a neural cause, neural causation cannot be a universal excuse. Exculpation requires demonstrating a specific *kind* of dysfunction that compromises the specific capacities relevant to responsibility.
  5.  **Rejection of Retributivism as Vengeance:** Both parties reject "wild" retributivism—the desire to inflict suffering for its own sake or out of raw vengeance. Any defense of "just desert" must be compatible with a civilized, rule-governed legal system that respects human dignity.

  ## Part II: Disagreements on Modular Desert

  The following table outlines our divergent positions specifically regarding whether moral responsibility (just desert) can be localized to sub-personal modules or must reside at the person level. Each formulation is vetted to ensure accuracy to the respective author's broader philosophical commitments.

  | Feature of Disagreement | **Daniel Dennett (Compatibilist/Functionalist)** | **Gregg Caruso (Hard Incompatibilist/Skeptic)** |
  | :--- | :--- | :--- |
  | **The Locus of Desert** | "Just desert" is a normative status that attaches to the **Person-as-System**. While cognitive architecture is modular, responsibility cannot be localized to a single module (e.g., the amygdala). It attaches to the global, narratively integrated self *because* that self is the functional locus of reasons-responsiveness and self-governance. | "Just desert" (basic moral responsibility) attaches to **Nothing**. Neither the modular subsystems nor the integrated person can be the proper locus of desert. The person is a causal collection of modules, none of which possess the ultimate control required for desert. |
  | **Role of Modularity** | Modular analysis helps identify **excusing conditions**. If a specific module fails (e.g., a tumor compressing inhibitory circuits), the Person may be excused *if* the Person-level system could not reasonably have monitored or corrected that module. Modularity explains *capacity*, not *culpability*. | Modular analysis confirms **causal determination**. Identifying specific subsystem failures demonstrates that actions are the result of luck (constitutive and circumstantial). It reinforces that the "self" is not an unmoved mover, undermining desert at the global level. |
  | **The "Ghost" Requirement** | A Cartesian Ego is not required for desert. A **Center of Narrative Gravity** (a functional abstraction of the whole system) is sufficient to ground qualified just deserts. We do not need a ghost in the machine; we need a competent governor. | A Cartesian Ego (or equivalent ultimate sourcehood) **is** required for desert. Since the "Center of Narrative Gravity" is causally determined by sub-personal processes, it cannot ground basic desert. Without a ghost, there is no one home to deserve anything. |
  | **Normative Implication** | We are justified in holding the **Person** responsible, even if modules fluctuate, provided the Person had a fair opportunity to avoid the violation. Blame is a functional tool to tune the system's future responsiveness. | We are justified only in **Managing Risk**. We may restrain or rehabilitate the Person based on dangerousness (Public Health Quarantine Model), but we cannot morally blame them. Blame implies a desert that does not exist. |

  ## Part III: Precise Cruxes of the Dispute

  Our collaboration identifies two specific conceptual cruxes where our views on modular architecture diverge sharply.

  **Crux 1: The Sufficiency of the Functional Self**
  *   **The Issue:** Does the absence of a unified Cartesian ego undermine *all* ascriptions of desert, or only *metaphysical* ascriptions, leaving *functional* person-level desert intact?
  *   **Dennett:** The absence of a Cartesian ego undermines only *metaphysical* desert. It does not undermine *functional* desert at the person level. The "self" is real enough as a control system to bear responsibility. To demand more is to demand magic. Modular failures are relevant only insofar as they break the control system's capacity to respond to reasons.
  *   **Caruso:** The absence of a Cartesian ego undermines *all* desert. The "functional self" is merely a complex arrangement of determined modules. If the modules are not responsible (because they are determined), the arrangement of them cannot be responsible either. Functional competence does not equal moral desert.

  **Crux 2: Evolutionary Grounding of Local Desert**
  *   **The Issue:** Can evolutionary-functional accounts ground local desert without smuggling in a "ghost-in-the-machine"? Specifically, does the evolutionary utility of blame validate the *truth* of desert, or merely its *utility*?
  *   **Dennett:** The evolutionary utility of blame practices *constitutes* the reality of desert within our social form of life. If a system is designed (by evolution/culture) to be sensitive to reasons and blame, and it fails, it *deserves* the corrective signal. This does not require a ghost; it requires a competent architecture.
  *   **Caruso:** Evolutionary utility validates *safety measures*, not *desert*. That we evolved to blame does not make blame morally justified in the retributive sense. It only shows blame is a natural phenomenon. Grounding desert in function conflates "is useful" with "is morally deserved."

  ## Part IV: Concrete Hypothetical Cases

  To test these cruxes, we propose two hypothetical cases involving modular dysfunction. We record our predicted evaluations of culpability and social response in advance.

  ### Case A: The Circumscribed Lesion
  **Scenario:** A defendant with no prior criminal history suffers a well-circumscribed orbitofrontal cortex (OFC) lesion due to a previously undetected aneurysm. The OFC is critical for impulse inhibition and social emotion processing. Following the lesion, but before diagnosis, the defendant commits a violent assault during a minor provocation. Post-surgery, the impulse control returns to baseline.

  *   **Dennett's Evaluation:**
      *   **Culpability:** **Excused.** The modular failure was inaccessible to the Person-level system. The "Center of Narrative Gravity" could not monitor or correct the OFC because the hardware itself was compromised in a way that bypassed higher-order governance.
      *   **Social Response:** Medical treatment and temporary containment until safety is assured. No retributive punishment.
  *   **Caruso's Evaluation:**
      *   **Culpability:** **No Desert.** The action was the result of constitutive luck (biology) and circumstantial luck (aneurysm). The defendant is not the ultimate source of the action.
      *   **Social Response:** Public Health Quarantine. Detention is justified only as long as the individual poses a danger. No blame, no retribution.
  *   **Agreement:** In this case, our policy recommendations converge (no punishment), though our justifications differ (System Incapacity vs. Lack of Ultimate Source).

  ### Case B: The Predictive Processing Glitch (The "Modular" Defense)
  **Scenario:** A defendant with a neurotypical brain structure commits a premeditated fraud. During trial, defense experts argue that the defendant's *predictive processing hierarchy* (a sub-personal modular architecture) had developed a high-weighting prior for "financial insecurity" based on childhood poverty. They argue this modular weighting automatically biased decision-making toward fraud without explicit Person-level deliberation. The defendant claims: "It wasn't *me*, it was my predictive coding."

  *   **Dennett's Evaluation:**
      *   **Culpability:** **Responsible.** The modular architecture is the *mechanism* of the self, not an external force. The Person-level system is constituted by these priors. Unless the defendant was incapable of recognizing the moral norm (competence), the fact that the decision arose from sub-personal weighting does not exculpate. The Person is responsible for the character traits the modules encode.
      *   **Social Response:** Qualified Just Deserts. Punishment is appropriate to reinforce norms and calibrate the agent's future responsiveness to reasons.
  *   **Caruso's Evaluation:**
      *   **Culpability:** **No Desert.** The "predictive priors" were formed by childhood poverty (circumstantial luck) and genetic predisposition (constitutive luck). The defendant did not choose their modular architecture. To blame the Person for the modules is to blame them for their luck.
      *   **Social Response:** Rehabilitation and Quarantine. Address the "prior" through therapy and economic support. Detain if dangerous. Do not blame.
  *   **Disagreement:** Here, policy diverges. Dennett sees the modular explanation as descriptive of *how* the agent acted, not an excuse. Caruso sees the modular explanation as proof that the agent was *acted upon* by causal history.

  ## Part V: Conclusion – Verbal Disagreement and Substantive Residue

  Upon reviewing our positions, we identify a significant **verbal disagreement** regarding the term "Responsible."

  *   **Dennett** operates with a **forward-looking, functional register**: To be responsible is to be a suitable target of social regulation because one is reasons-responsive. In this register, "desert" is a label for the status of being a competent node in the normative network.
  *   **Caruso** operates with a **backward-looking, metaphysical register**: To be responsible (in the basic desert sense) requires being the *ultimate source* of one's actions. In this register, "desert" implies a cosmic justice that transcends causal determinism.

  **Resolution of Ambiguity:**
  If we agree to banish the term "Just Desert" due to its metaphysical baggage and replace it with "Normative Accountability" (Dennett) vs. "Causal Agency" (Caruso), much of the heat dissipates. We agree that the *Person* is the only coherent locus for accountability; neither of us believes a *module* (like an amygdala) can be held accountable in isolation. We agree that modular failures are relevant to *capacity*, not just causation.

  **Substantive Residue:**
  However, a hard core of substantive disagreement survives the verbal resolution:
  **Is the functional capacity for reasons-responsiveness *sufficient* to justify the expressive attitude of moral blame?**

  *   **Dennett** maintains **Yes**. The functional capacity makes the blame *fair* because the agent *could have done otherwise* had they attended to the reasons. The absence of a Cartesian ego is irrelevant; the presence of a competent control system is enough.
  *   **Caruso** maintains **No**. Even a competent control system is determined by prior causes (modular or global). Therefore, the expressive attitude of moral blame is always fundamentally unjust, even if useful. We must replace blame with compassion and safety management.

  This residual dispute is not about neuroscience or modularity, but about the moral permissibility of retributive emotions in a determined universe. We conclude that while we agree on the *architecture* of the agent (modular, non-Cartesian), we disagree on the *moral ontology* that architecture can support.

  ***

  **Signed,**

  Daniel C. Dennett
  Gregg D. Caruso
