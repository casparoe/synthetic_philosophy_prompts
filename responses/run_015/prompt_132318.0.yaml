prompt: |-
  Draft the joint statement of an adversarial collaboration between Daniel Dennett, representing a compatibilist evolutionary-functional account of moral responsibility that preserves a qualified, non-retributive notion of just deserts, and Gregg Caruso, representing a hard-determinist skeptical position that rejects retributive desert in favor of public-health quarantine models of social defense. Conduct the collaboration not at the broad level of free will, but specifically on the conceptual sub-issue of whether just desert can be coherently localized to modular sub-personal cognitive architectures—whether failures of inhibitory control, predictive-processing errors, or localized neural dysfunction in specific subsystems can bear retributive moral weight, or whether desert necessarily requires attribution to a global, narratively integrated self. Structure the document in four parts: first, a numbered section of claims both parties can sign regarding the neuroscience of decision-making, the instrumental versus expressive functions of punishment, and the logical distinction between explaining behavior and justifying blame; second, a disagreements table in which each side's position on modular desert is formulated in wording that side would accept as accurate to its own view; third, the precise cruxes—especially whether the absence of a unified Cartesian ego undermines all ascriptions of desert or only global, person-level ones, and whether evolutionary-functional accounts can ground local desert without smuggling in a ghost-in-the-machine; fourth, for each crux, a concrete hypothetical case—such as a defendant with a well-circumscribed orbitofrontal lesion who commits a harmful act—that both sides agree bears directly on the dispute, with each side's predicted evaluation of culpability and appropriate social response recorded in advance. Conclude by identifying any purely verbal disagreement—e.g., whether the parties are operating with different registers of "responsible"—and specify exactly which portion of the dispute about modular desert survives once that ambiguity is resolved.
