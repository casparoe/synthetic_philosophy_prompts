prompt: |-
  I'm the senior ethics reviewer for a multi-faith humanitarian network that issues quarterly operational guidance to field teams working in conflict zones. Our partner traditions disagree sharply over whether a moral constraint—say, that staff must never cooperate with armed groups to secure access, or that unpayable debts among displaced populations must be cancelled—is authoritative because it is rationally warranted and our traditions happen to align with it, or because specific revealed commands constitute it as wrong with no further reason required. I need a reusable decision procedure that my team, trained in theology but not in formal philosophy, can run in about thirty minutes on any proposed directive before it goes into a brief. The deliverable should be an ordered checklist of diagnostic questions—each with conditions for a sufficient answer, explicit stop-points where the decision must be handed to a theologian rather than resolved by fact, and clear flags where judgment is unavoidable—grounded in the conceptual space of the Euthyphro dilemma but translated into operational language. Specifically, it must distinguish four categories: command-constituted obligations (where the wrongness is created by the command itself, as with ritual or covenantal duties), reason-tracked obligations (where the command tracks an independent moral fact), hybrid covenant-reason cases, and misaligned cases where a putative command conflicts with independently warranted morality. Include a small set of concrete tests—about counterfactual stability of the obligation across possible worlds, accessibility of the justification to outsiders, and whether the obligation survives if the command were withdrawn—that can be applied without knowing philosophical labels. Then run the procedure on three directives: (a) an absolute prohibition on torture of detainees, (b) a seventh-year debt-release policy applied in refugee camps, and (c) a partner-tradition dietary restriction that field kitchens are asked to observe. The third should yield an answer my board will resist—likely that the restriction is purely command-constituted and therefore not binding on staff outside that covenantal relation—while the first should show a case where the command and the independent reason come apart in a way the tests cannot settle, forcing a hand-off to value-judgment. Conclude by stating exactly what the procedure cannot do: which meta-theological disputes it leaves untouched, and where it will systematically misfire if a tradition denies that moral properties have any modal independence from divine will.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Senior Ethics Reviewer for a multi-faith humanitarian network.
      *   **Audience:** Field teams and operational staff (trained in theology, *not* formal philosophy).
      *   **Task:** Create a reusable decision procedure (checklist) to evaluate proposed operational directives.
      *   **Time Limit:** ~30 minutes to run.
      *   **Core Problem:** Disagreement over the source of moral authority (Euthyphro Dilemma: Is it good because God commands it, or does God command it because it is good?).
      *   **Required Output:**
          1.  An ordered checklist of diagnostic questions.
          2.  Conditions for sufficient answers.
          3.  Explicit stop-points (hand-off to theologian).
          4.  Clear flags for unavoidable judgment.
          5.  Four categories: Command-Constituted, Reason-Tracked, Hybrid, Misaligned.
          6.  Concrete tests (Counterfactual Stability, Accessibility/Universality, Withdrawal Survival).
          7.  Application to three specific directives: (a) Torture prohibition, (b) Debt-release, (c) Dietary restriction.
          8.  Specific outcomes for the applications: (c) must show it's command-constituted/non-binding for outsiders; (a) must show a split requiring value judgment.
          9.  Conclusion: Limitations of the procedure (meta-theological disputes, Divine Command Theory denials of modal independence).
      *   **Tone:** Operational, clear, precise, respectful of theological diversity but firm on procedural logic.

  2.  **Deconstruct the Euthyphro Dilemma for Operations:**

      *   *Divine Command Theory (DCT):* Wrong because Commanded. (Command-Constituted).
      *   *Natural Law/Rationalism:* Commanded because Wrong (independently). (Reason-Tracked).
      *   *The Operational Translation:*
          *   If the rule disappears, does the harm remain? (Reason-Tracked).
          *   If the rule disappears, is it neutral? (Command-Constituted).
          *   Can a non-believer understand *why* it's wrong without faith? (Accessibility).
          *   Does this apply to everyone or just the covenant community? (Scope).

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Name:* Needs to sound official. "Operational Moral Authority Protocol (OMAP)" or "Directive Authority Assessment (DAA)". Let's go with "Directive Authority Assessment (DAA)".
      *   *Structure:* Step-by-step questions.
      *   *Tests:*
          1.  *The Withdrawal Test:* If the command vanished, would the act still be harmful?
          2.  *The Outsider Test:* Can a secular/other-faith actor grasp the justification without revelation?
          3.  *The Modal Test:* Is this wrong in *all* possible contexts, or only within this specific relationship?
      *   *Categories:*
          1.  **Type R (Reason-Tracked):** Universal, harm-based, survives withdrawal.
          2.  **Type C (Command-Constituted):** Ritual, covenantal, neutral without command.
          3.  **Type H (Hybrid):** Both (e.g., justice).
          4.  **Type M (Misaligned):** Command conflicts with reason (The "Abrahamic" test case).
      *   *Stop-Points:* Where theology is needed (e.g., interpreting revelation).
      *   *Judgment Flags:* Where philosophy can't solve it (e.g., conflicting goods).

  4.  **Developing the Three Test Cases:**

      *   *(a) Torture Prohibition:*
          *   *Expectation:* Command and Reason come apart/force hand-off.
          *   *Analysis:* Most traditions agree it's wrong (Reason). But is it *only* wrong because God says so? If God commanded it (hypothetically), would it be right? This is the Euthyphro crux. The test should reveal that Reason says "No Torture" but some DCT adherents might say "Only if God says." This creates a tension. The prompt asks for the command and independent reason to *come apart* in a way tests can't settle. Actually, usually, torture is the strongest case for Reason-Tracked. To meet the prompt's requirement ("command and independent reason come apart... forcing a hand-off"), I need to frame it such that the *source* of the prohibition is disputed even if the *action* is agreed upon. Or, perhaps, a scenario where a specific tradition claims a command *allows* it (exceptionalism) while reason forbids it. Let's aim for the latter to fit the "Misaligned/Hand-off" requirement better. *Correction:* The prompt says "the first should show a case where the command and the independent reason come apart in a way the tests cannot settle, forcing a hand-off to value-judgment." This implies a tension. Let's frame it as: Reason says "Never," but some textual interpretations suggest "Sometimes." The procedure flags this as a Value Judgment hand-off.
      *   *(b) Debt-Release (Jubilee):*
          *   *Expectation:* Hybrid. It's economic justice (Reason) but tied to a specific cyclical command (Command).
          *   *Analysis:* Economic stability is good (Reason). But the *7th year* specific is covenantal (Command).
      *   *(c) Dietary Restriction:*
          *   *Expectation:* Command-Constituted. Not binding on outsiders.
          *   *Analysis:* No inherent harm in pork/shellfish (Reason). Only wrong because Command. Therefore, field kitchens (multi-faith) don't need to adopt it universally, only respect it for those adherents.

  5.  **Refining the Procedure for the "30-Minute" Constraint:**

      *   Keep questions binary or tri-state where possible.
      *   Avoid jargon like "deontological" or "consequentialist." Use "Harm," "Rule," "Relationship."
      *   Ensure the "Stop-Points" are clear.

  6.  **Addressing the Limitations (Conclusion):**

      *   Must acknowledge Nominalism (if God wills it, it's good, period).
      *   Must acknowledge that this procedure assumes *some* modal independence (that moral facts can exist apart from will). If a tradition denies this, the procedure breaks.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Set the context.
      *   *The Checklist:* Numbered steps.
      *   *The Tests:* Defined clearly.
      *   *The Applications:* Run the checklist against a, b, c.
      *   *The Limitations:* Honest assessment of philosophical boundaries.

      *(Self-Correction during drafting)*: I need to make sure I don't use philosophical labels in the checklist itself, as per instructions ("without knowing philosophical labels"). The labels (Type R, Type C, etc.) are for the *reviewer's* classification after the test, not the questions asked to the field team.
      *Wait, re-reading:* "The deliverable should be an ordered checklist... grounded in the conceptual space of the Euthyphro dilemma but translated into operational language."
      *Okay:* The checklist questions must *embody* the logic without using the words "Euthyphro," "Divine Command Theory," etc.
      *Also:* "The third should yield an answer my board will resist." I need to make sure the logic leads inevitably to "Not binding on outsiders" for the diet rule, even if the board wants unity.
      *Also:* "The first should show a case where the command and the independent reason come apart... forcing a hand-off." I need to ensure the Torture case doesn't resolve cleanly.

  8.  **Final Polish:** Check against all constraints.
      *   30 mins? Yes, concise.
      *   Theology trained, not philosophy? Yes, plain language.
      *   Four categories? Yes.
      *   Three tests (Counterfactual, Accessibility, Withdrawal)? Yes.
      *   Specific outcomes for a, b, c? Yes.
      *   Limitations section? Yes.

      *Refining the Torture Case:* To make the command and reason "come apart," I will posit a scenario where a specific textual command is ambiguous regarding "enhanced interrogation" for saving lives, while independent reason (human rights/harm) says absolute prohibition. The procedure identifies this gap and flags it for senior theological judgment.

      *Refining the Diet Case:* Ensure the logic proves it's "Command-Constituted." Test: If the command is withdrawn, is eating the food harmful? No. Therefore, it's not universally binding.

      *Refining the Limitations:* Be precise about "Modal Independence." If a tradition believes morality *is* God's will (Voluntarism), the "Withdrawal Test" is blasphemous/meaningless to them. I must state this.

  9.  **Final Review against Safety Guidelines:**
      *   Does this promote harm? No, it's an ethics review tool.
      *   Does it disrespect religion? No, it navigates theological diversity respectfully but analytically.
      *   Is it actionable? Yes.

      *Let's write it.*
answer: |-
  # Directive Authority Assessment (DAA) Protocol
  **Version:** 4.2 (Operational)  
  **Time Allocation:** 30 Minutes  
  **Audience:** Field Ethics Officers & Regional Coordinators  
  **Purpose:** To determine the binding scope and justification type of proposed operational directives in multi-faith contexts.

  ---

  ## Part I: The Diagnostic Checklist
  *Instructions: Answer the following three tests for the proposed directive. Do not proceed to classification until all three are complete. If you cannot answer a question based on available data, mark it as [UNKNOWN] and trigger the **Theological Hand-Off**.*

  ### Test 1: The Withdrawal Condition (Modal Stability)
  **Question:** If the specific religious command or textual authority citing this rule were removed from history, would the action described still cause identifiable harm or injustice to human flourishing?
  *   **Condition A (Yes):** The harm exists without the command. (e.g., Killing an innocent person causes grief/loss regardless of a rule against it).
  *   **Condition B (No):** The action is neutral or beneficial unless the command forbids it. (e.g., Eating a specific food, wearing mixed fabrics).
  *   **Condition C (Unclear):** The harm is disputed or depends on spiritual consequences not visible to observation.

  ### Test 2: The Outsider Accessibility Condition (Justification Scope)
  **Question:** Can a competent adult outside our faith tradition (secular or different religion) understand *why* this rule exists using only shared human reason, empathy, or social contract logic?
  *   **Condition A (Yes):** The justification relies on universal goods (safety, trust, health, fairness).
  *   **Condition B (No):** The justification relies on exclusive revelation, covenant status, or ritual purity.
  *   **Condition C (Mixed):** The goal is universal (e.g., charity), but the specific mechanism is ritual (e.g., tithe percentages).

  ### Test 3: The Covenant Boundary Condition (Relational Scope)
  **Question:** Is the obligation triggered by *being human* (or being in a position of power), or by *entering a specific agreement* with the Divine/Community?
  *   **Condition A (Human/Universal):** Applies to anyone in the situation (e.g., "Do not exploit the vulnerable").
  *   **Condition B (Covenantal):** Applies only to those who have vowed allegiance to the tradition (e.g., "Keep the Sabbath").
  *   **Condition C (Hybrid):** Applies to humans, but the specific form is covenantal.

  ---

  ## Part II: Classification & Decision Matrix
  *Match your Test Results (A, B, or C) to the categories below. Follow the Operational Directive.*

  | Category | Test Profile | Operational Meaning | Binding Scope |
  | :--- | :--- | :--- | :--- |
  | **Type R: Reason-Tracked** | 1A, 2A, 3A | The command tracks an independent moral fact (harm/justice). | **Universal.** Binding on all staff and partners regardless of faith. |
  | **Type C: Command-Constituted** | 1B, 2B, 3B | The wrongness is created by the command itself (ritual/covenant). | **Particular.** Binding only on adherents of that tradition. Cannot be imposed on others. |
  | **Type H: Hybrid** | 1A, 2C, 3C | Universal moral goal achieved through specific covenantal means. | **Negotiated.** Goal is binding; method may be adapted for multi-faith compliance. |
  | **Type M: Misaligned / Conflict** | 1C, or Mixed A/B | Independent reason and Command appear to conflict or are indeterminate. | **STOP.** Do not issue directive. Trigger **Senior Theologian Hand-Off**. |

  ---

  ## Part III: Stop-Points & Judgment Flags

  **🛑 Theological Hand-Off Point:**
  If **Test 1** yields Condition C (spiritual consequences only) OR **Test 3** yields a conflict between traditions (e.g., Tradition X says Universal, Tradition Y says Covenantal), you must halt. This is not an operational decision. It requires a ruling from the Network's Theological Council on whether the directive is *doctrinally essential* or *culturally contingent*.

  **⚠️ Judgment Flag:**
  If the directive falls into **Type M (Misaligned)**, the procedure cannot resolve the conflict. This indicates a meta-ethical disagreement (e.g., "Is it wrong because God says so, or does God say so because it's wrong?"). The Senior Ethics Reviewer must make a value judgment on whether to prioritize *Operational Safety* (Reason) or *Doctrinal Fidelity* (Command).

  ---

  ## Part IV: Procedure Application (Case Studies)

  ### Case A: Absolute Prohibition on Torture of Detainees
  **Directive:** "Staff must never cooperate in the interrogation or detention of prisoners using enhanced techniques."

  *   **Test 1 (Withdrawal):** **Condition A.** Even without a religious command, torture causes severe psychological/physical harm and degrades justice.
  *   **Test 2 (Accessibility):** **Condition A.** Secular human rights law and empathy confirm the wrongness.
  *   **Test 3 (Boundary):** **Condition A.** Applies to all humans in power, not just believers.
  *   **Preliminary Classification:** **Type R (Reason-Tracked).**
  *   **Complication:** One partner tradition cites a textual exception for "existential threats" (Command), while independent reason suggests an absolute ban (Reason).
  *   **Result:** **Type M (Misaligned).**
  *   **Operational Outcome:** **STOP.** The tests reveal a split. Independent reason says "Always Wrong." One tradition's command says "Wrong unless Command permits exception." The procedure cannot adjudicate whether the Command overrides the Reason.
  *   **Action:** **Hand-Off to Senior Ethics Reviewer.** This requires a value judgment on whether the Network prioritizes universal human rights norms over specific textual exceptions. The procedure identifies the conflict but cannot solve it.

  ### Case B: Seventh-Year Debt-Release in Refugee Camps
  **Directive:** "All loans issued to displaced persons must be forgiven after seven years."

  *   **Test 1 (Withdrawal):** **Condition A (Partial).** Unpayable debt causes harm (Condition A), but the *seven-year* specific does not map to an economic fact (Condition B).
  *   **Test 2 (Accessibility):** **Condition C.** Economic relief is universal (A), but the cyclical timeline is scriptural (B).
  *   **Test 3 (Boundary):** **Condition C.** Justice is universal, but the Jubilee mechanism is covenantal.
  *   **Result:** **Type H (Hybrid).**
  *   **Operational Outcome:** **Negotiated.** The *obligation to prevent debt slavery* is binding on all staff (Type R). The *seven-year mechanism* is covenantal (Type C).
  *   **Directive Revision:** Field teams must implement *sustainable debt relief*, but may adapt the timeline (e.g., 5 years, 10 years, or income-based) to fit local economic realities, provided the core goal (preventing permanent indenture) is met.

  ### Case C: Partner-Tradition Dietary Restriction in Field Kitchens
  **Directive:** "All field kitchens must prohibit pork and shellfish to maintain ritual purity."

  *   **Test 1 (Withdrawal):** **Condition B.** If the command were withdrawn, eating pork causes no inherent physical or moral harm to human flourishing.
  *   **Test 2 (Accessibility):** **Condition B.** A secular or non-covenantal actor cannot access the justification (ritual purity) through reason alone.
  *   **Test 3 (Boundary):** **Condition B.** This is triggered by covenantal holiness codes, not universal human status.
  *   **Result:** **Type C (Command-Constituted).**
  *   **Operational Outcome:** **Particular.**
  *   **Directive Revision:** **REJECT as Universal Policy.** This restriction is not binding on staff outside that covenantal relation. Field kitchens must *accommodate* adherents who request it (providing option B), but cannot impose it on all staff or beneficiaries as a moral requirement. To do so would be to enforce a ritual law as a universal moral law, which the tests show it is not.
  *   **Note:** This finding may resist Board pressure for "uniformity," but the DAA Protocol confirms that uniformity here constitutes a category error.

  ---

  ## Part V: Limitations & Meta-Theological Disclaimer

  **What This Procedure Cannot Do:**

  1.  **It Cannot Resolve Divine Voluntarism:** This protocol assumes *Modal Independence*—the idea that moral properties (like "harm" or "justice") have some stability independent of a specific command. If a partner tradition holds to strict Divine Command Theory (where an act is good *solely* because God wills it, and could be evil if God willed otherwise), **Test 1 (Withdrawal)** is meaningless to them. For them, if the command is withdrawn, the morality vanishes. The procedure will systematically misfire for these traditions, categorizing their absolute duties as "Type C" when they view them as "Type R."
  2.  **It Cannot Adjudicate Revelation:** The protocol treats textual commands as data points. It cannot determine if a command is *authentically* revealed or *correctly interpreted*. If a tradition claims a command exists where none is textually evident, the DAA flags it as [UNKNOWN] but cannot debunk the claim.
  3.  **It Cannot Force Consensus on Type M:** In Misaligned cases (like Torture Case A), the procedure exposes the rift between Reason and Command but offers no philosophical resolution. It forces a leadership choice between *Universal Humanitarian Standards* and *Doctrinal Compliance*. It does not tell you which to choose.

  **Final Instruction:**
  Use the DAA to clarify *why* we disagree, not to pretend we do not. Where the procedure flags a **Hand-Off**, do not attempt to solve it with operational workarounds. Acknowledge the theological impasse.
