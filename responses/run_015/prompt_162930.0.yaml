answer: |-
  This is a classic problem in the metaphysics of personal identity, but framed in a way that reveals a very specific, internally consistent intuition set. You are effectively asking for a **consistency proof** for your moral intuitions regarding identity.

  As a backend engineer, you are thinking about identity as **state continuity** in a distributed system. However, your verdicts reveal that you are not a pure Functionalist (who would say Case 4 is fine) nor a pure Biological Naturalist (who would say Case 2 is death). You hold a hybrid view that prioritizes the **causal history of the active process** over the specific matter or the abstract pattern.

  Here is a precise formulation of the principle that best captures your verdicts, followed by the stress tests you requested.

  ### The Principle: Single-Threaded Causal Continuity (STCC)

  **Definition:** A patient persists as the same person if and only if their conscious state evolves via an unbroken, singular chain of physical causation, without intermediate duplication of *active* agency.

  This principle relies on three distinct clauses. Each clause is motivated by specific cases from your list.

  #### Clause 1: The Causal Link Requirement
  *   **Statement:** The state of the system at $t_{+1}$ must be physically derived from the state at $t_0$ through continuous physical laws, not via abstract copying or instantiation.
  *   **Motivated by:** **Case 2 vs. Case 4.**
      *   In Case 2 (Swap), the silicon replaces the biology *in situ*. The causal flow of inputs $\to$ processing $\to$ outputs is uninterrupted. The physical medium changes, but the *process* is continuous in spacetime.
      *   In Case 4 (Scan), the pattern is abstracted (copied) and instantiated elsewhere. The causal chain is broken; the emulation is a *child* of the biological brain, not a *continuation* of it.
  *   **Verdict:** Case 2 = Survival. Case 4 = Death.

  #### Clause 2: The Non-Fission Requirement
  *   **Statement:** At no point during the procedure may there exist two distinct physical systems both causally sustaining the *active* behavioral output of the patient. Passive redundancy is permitted; active divergence is not.
  *   **Motivated by:** **Case 3 vs. Case 6.**
      *   In Case 3 (Shadow), the duplicate receives inputs but has no causal efficacy on the world (output discarded). It is a log, not a node. There is only one "active thread."
      *   In Case 6 (Branch), both copies drive output and diverge. This creates two competing claims to identity. Destroying one is a kill operation.
  *   **Verdict:** Case 3 = Survival. Case 6 = Death (or morally prohibited).

  #### Clause 3: The Phenomenal Realization Requirement
  *   **Statement:** The physical substrate must be capable of supporting subjective experience (qualia), not just input-output mapping.
  *   **Motivated by:** **Case 7.**
      *   If the "lights are off" (no qualia), the system is a Philosophical Zombie. Even if I/O is perfect, the *subject* is gone.
  *   **Verdict:** Case 7 = Death.

  ---

  ### Application to New Cases

  Here is how STCC handles the three scenarios you requested.

  #### 1. The "Deep Sleep" Migration
  *   **Scenario:** The full 15-year procedure is performed while the patient is in continuous, dreamless, medically induced sleep. They wake at the end.
  *   **STCC Verdict:** **Same Person (Survival).**
  *   **Reasoning:** This is identical to Case 2 (All at once), just extended in time. Clause 1 is satisfied because the replacement is gradual and *in situ* (causal continuity). Clause 2 is satisfied because there is never a moment where two active minds exist. The suspension of consciousness (sleep) does not break causal continuity any more than a CPU idle cycle breaks a process's identity.
  *   **Consent Implication:** Standard surgical risk. No special identity warnings needed.

  #### 2. The "Vat Survival" Variant
  *   **Scenario:** The tissue is mapped (Case 4), the emulation starts, but the original biological tissue is kept alive in a vat, disconnected from the body but metabolically active.
  *   **STCC Verdict:** **Death / Fission.**
  *   **Reasoning:** This violates Clause 2 (Non-Fission). You now have two systems: the biological brain in the vat and the silicon emulation in the head. Both are causally capable of sustaining the patient's mental life. Even if the vat brain is sedated, it is a "candidate." If the vat brain is awake, it is definitely a second person.
  *   **Consent Implication:** This must be classified as a terminal procedure for the biological original. The emulation is a new legal entity.

  #### 3. The "Merge" Protocol
  *   **Scenario:** Two copies are started from a checkpoint (like Case 6), run for a month, and then their memory states are mathematically merged back into a single instance, discarding the divergent hardware.
  *   **STCC Verdict:** **Death / New Person.**
  *   **Reasoning:** This violates Clause 2. The moment the branches diverged, the "single thread" was broken. You had two active streams of consciousness. Merging the *data* does not merge the *subjective experience* that occurred during the divergence. The entity that wakes up after the merge has memories of being both, but the causal chain of the original singular stream was severed.
  *   **Consent Implication:** Prohibited. This is creating two people and killing one to make a third.

  ---

  ### The Honest Account: Incoherence and Overturns

  You asked for an honest account of where this principle fails or forces you to change your mind. There are two critical pressure points in your intuition set that STCC exposes.

  #### 1. The Coherence of Case 7 (Dark Substitutes)
  *   **The Problem:** You stated: *"If the behaviour matches perfectly, what work is the phrase 'the lights are off' doing?"*
  *   **The Hard Truth:** Under a physicalist worldview (which medicine and engineering generally assume), Case 7 is **incoherent**. If the silicon unit reproduces every spike, every neurotransmitter release, and every behavioral output perfectly, there is no physical difference between "lights on" and "lights off."
  *   **The Philosophical Cost:** To maintain your verdict on Case 7, you must accept **Non-Functionalism**. You are asserting that consciousness is not defined by what a system *does*, but by what it *is made of* or some intrinsic property not measurable by I/O.
  *   **Impact on Verdicts:** If you cannot defend Non-Functionalism to your colleagues (i.e., if you agree that "perfect simulation = consciousness"), then **Case 7 must be overturned to Survival.** This removes the need for Clause 3.
  *   **Recommendation:** For consent language, you cannot rely on Case 7. You cannot verify qualia. You must assume that perfect I/O equivalence *is* consciousness, or admit you are banning a procedure based on unverifiable metaphysics.

  #### 2. The Tension between Case 4 and Case 5 (Rollback)
  *   **The Problem:** Your verdicts on Case 4 (Scan & Replace = Death) and Case 5 (Rollback = Survival) are in tension under Clause 1.
      *   **Case 4:** Biological State $\to$ Copy $\to$ Kill Bio $\to$ Run Copy. (Verdict: Death).
      *   **Case 5:** Corrupted State $\to$ Copy (Checkpoint) $\to$ Kill Corrupted $\to$ Run Copy. (Verdict: Survival).
  *   **The Inconsistency:** In both cases, you are destroying a currently running conscious instance and replacing it with a copy of a previous state. Why is destroying the "Corrupted Emulation" acceptable, but destroying the "Biological Brain" not?
      *   If it's because the *medium* changed in Case 4 (Bio to Silicon), then Case 5 implies that once you are Silicon, you can be copied/killed freely.
      *   If it's because the *time gap* was shorter in Case 5, that is a slippery slope.
  *   **The Overturn:** To be consistent with Case 4, **Case 5 must be treated as a micro-death.** The "corrupted" instance that existed for that day is destroyed. If that instance was conscious, you killed it.
  *   **Engineering Analogy:** Case 5 is like killing a production pod to restore from a snapshot. In distributed systems, we don't worry about the "identity" of the pod. In persons, if you accept Case 4 is death, you must accept that *any* restore-from-backup involves killing the current timeline.
  *   **Recommendation:** You likely need to overturn your intuition on Case 5, or explicitly limit the "Causal Link" to allow *local* state restoration within the same substrate while forbidding *cross-substrate* instantiation.

  ### Summary for Consent Language

  Based on STCC, here is how you should draft the go/no-go rules:

  1.  **Prohibit Copying:** The procedure must never instantiate a functional duplicate of the patient's cognitive state while the original is active. (Blocks Case 4, Case 6, Vat Survival).
  2.  **Require In-Situ Replacement:** Substrate migration must occur via gradual displacement of tissue, maintaining spatio-temporal continuity of the signal path. (Blocks Scan & Replace).
  3.  **Acknowledge Substrate Risk:** Consent must disclose that while behavioral continuity is guaranteed, the nature of subjective experience in silicon is an open metaphysical question. (Addresses Case 7 without making unverifiable claims).
  4.  **Define "Termination":** Explicitly state that procedures involving branching (even if followed by pruning) are classified as terminal for the original stream. (Blocks Case 6 and Merge).

  **Final Advice:** Your intuition on Case 4 (Scan & Replace = Death) is the strongest ethical constraint you have. It is the "Copy & Kill" problem. If you defend that, you must accept that **continuity of the physical process matters more than continuity of the information pattern.** Defend that clearly, and the rest of the rules follow.
