  6.  **Refining the Tensions:**

      *   *Tension A (The Budget/Proxy Contradiction):* Claim 3 explicitly says "I should reach the same verdict if I delegate... to a slower proxy." Claim 5 explicitly says "I... defect against a copy of myself running with a smaller proof-search budget." A slower proxy *is* a smaller budget (in terms of steps allowed in the one-shot interaction). This is a direct logical contradiction.
