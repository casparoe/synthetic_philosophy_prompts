answer: |-
  Here are the desiderata for an interpretation of Machiavelli's *fortuna* and *virtù*, structured by the specific problems you raised, followed by the meta-adjudication you requested.

  The governing constraint is your stipulated purpose: **Action-Guidance.** An interpretation is inadequate if it renders *virtù* identifiable only in retrospect (tautological) or if it renders agency impossible (deterministic).

  ### I. The Desiderata

  #### 1. The Agency Boundary (The Arithmetic)
  *   **The Requirement:** The interpretation must specify the *locus of control* remaining to the agent within the 50/50 split. It must explicitly state whether *virtù* is an independent causal power (able to override fortune) or a responsive capacity (selecting means for ends fortune supplies). Crucially, if it is the latter, it must demonstrate that **non-trivial advice survives.**
  *   **The Case:** If *virtù* is merely reacting to fortune's ends, the agent is a passenger, not a driver. An interpretation that collapses *virtù* into "doing what works" without defining *how* to identify "what works" before the fact offers no guidance. The interpretation must provide a heuristic for distinguishing between a domain where preparation matters and a domain where surrender is rational.
  *   **Status:** **Non-Negotiable.** (Without a defined sphere of agency, the agent cannot act.)

  #### 2. The Temporal Distinction (The River)
  *   **The Requirement:** The interpretation must distinguish between *virtù* as **structural preparation** (building dikes in calm weather) and *virtù* as **tactical improvisation** (swimming/fleeing during the flood). It must explain why the same work saves one city and wrecks another without resorting to pure luck.
  *   **The Case:** Machiavelli's river metaphor implies two distinct temporal modes: the time of peace (prediction/prevention) and the time of crisis (reaction/endurance). An interpretation that conflates these fails the agent. If I am in "calm," I need engineering advice; if I am in "flood," I need survival advice. An interpretation that treats them as identical renders the agent vulnerable to using the wrong tool for the time.
  *   **Status:** **Non-Negotiable.** (The agent must know *when* they are to determine *what* to do.)

  #### 3. The Stability-Flexibility Paradox (Conformity-to-the-Times)
  *   **The Requirement:** The interpretation must resolve whether *virtù* is a **stable character trait** (e.g., audacity) or a **meta-capacity for adaptation** (the ability to change one's nature to fit the times). It cannot claim it is both without explaining the mechanism of switching.
  *   **The Case:** Machiavelli notes men hold to their modes while times move. If *virtù* is a stable trait (e.g., caution), it will eventually fail. If *virtù* is the ability to change, the agent needs to know *what* triggers the change. An interpretation that leaves this ambiguous forces the agent to guess whether to persist or pivot.
  *   **Status:** **Non-Negotiable.** (The agent needs a decision rule for consistency vs. adaptation.)

  #### 4. The Failure Condition (The Hard Cases & The Woman)
  *   **The Requirement:** The interpretation must account for the failure of the seemingly virtuous (Borgia) without rendering *virtù* insufficient. It must treat the "woman" metaphor as **strategic load-bearing** (a claim about the specific conduct fortune rewards) rather than decoration.
  *   **The Case:** If Borgia had *virtù* but failed due to "extraordinary malignity of fortune," then *virtù* is not a reliable guide for success. The interpretation must decide: Was Borgia's *virtù* incomplete (e.g., he failed to secure the papacy), or is Machiavelli admitting that *virtù* can lose? Furthermore, if the "woman" metaphor is decorative, the advice to be "bold" is rhetorical fluff. If it is substantive, it specifies the *direction* of adaptation (toward aggression). The agent needs to know if boldness is a universal key or a situational one.
  *   **Status:** **Non-Negotiable regarding Failure; Preference regarding Metaphor.** (You must know if failure indicts the agent or the universe. The gendered rhetoric is secondary unless it alters the strategic advice.)

  #### 5. The Institutional Continuity (The Discourses)
  *   **The Requirement:** The interpretation must state whether the advice for the Prince is **continuous** with the advice for the Republic (variety of citizens substituting for individual adaptability) or **discontinuous**.
  *   **The Case:** If the *Discourses* suggest republics survive because they contain many natures, but the *Prince* demands one man embody all natures, the advice for the individual agent is fundamentally different from the advice for the system builder. An interpretation that forces continuity where Machiavelli posits a trade-off misleads the agent about their structural limitations.
  *   **Status:** **Preference.** (This is crucial for a constitutional designer, but less critical for an individual agent acting *now* who may not have the power to build institutions. It is a scholarly preference for coherence, not strictly an action-guiding necessity for the individual.)

  ---

  ### II. Meta-Adjudication

  #### 1. Non-Negotiable vs. Preference
  *   **Non-Negotiable:** Desiderata 1 (Agency), 2 (Temporal), 3 (Stability), and 4 (Failure). These are derived directly from your stipulation that the reading must guide an agent *ex-ante*. If an interpretation fails any of these, the agent cannot distinguish *virtù* from luck before the outcome is known.
  *   **Preference:** Desideratum 5 (Institutional Continuity). While intellectually satisfying, an individual agent can act on *virtù* without resolving whether a republic would have done better. Demanding this excludes readings that treat the *Prince* as a standalone manual for emergency rule, which may be more useful for your specific purpose.

  #### 2. The Most Exclusionary Requirement
  **Desideratum 1 (The Agency Boundary / Ex-Ante Operationalizability).**
  This requirement excludes the largest number of interpretations currently on offer.
  *   **Why:** The dominant trend in Machiavelli scholarship (particularly the Cambridge School and historicist readings) treats *virtù* as a context-dependent concept that cannot be abstracted into a universal rule without distortion. Many scholars argue *virtù* is essentially retrospective: we call it *virtù* because it succeeded.
  *   **Impact:** Your purpose demands the opposite: that *virtù* be identifiable *before* success. This eliminates any interpretation that treats *virtù* as a label applied by historians rather than a toolkit used by agents. It also eliminates deterministic readings where fortune is >50% in practice, as these render advice futile.

  #### 3. The Tension: Action-Guiding vs. Situation-Relative
  You suspect the **Action-Guiding Requirement** (must know *ex-ante* what counts as *virtù*) and the **Situation-Relative Requirement** (*virtù* is a fit between trait and occasion) are in direct tension.

  **They are.**
  If *virtù* is purely a "fit" with the times, and the times are unknowable in advance (as Machiavelli suggests fortune is a flooding river), then you cannot know *ex-ante* if you possess *virtù*. You only know after the flood recedes. This violates your purpose.

  **Which should give way?**
  **The Situation-Relative Requirement must give way.**

  **Reasoning:**
  You have fixed the purpose: **guidance for an agent who must act now.**
  If an interpretation insists that *virtù* is so radically contingent that it cannot be identified until after the fact, it is descriptively accurate to Machiavelli's pessimism but **useless for your stipulated purpose.** To serve your purpose, the interpretation must posit a form of *virtù* that is robust enough to be actionable *ex-ante*.

  This forces the interpretation to define *virtù* not as "perfect fit" (which is impossible to guarantee), but as **"robust adaptability."** The advice becomes: *Do not try to predict the times; cultivate the capacity to shift modes.*
  However, even this is risky. If the interpretation claims "adaptability" is the rule, but admits you might not be able to adapt fast enough (the Borgia problem), it still fails the action-guiding test.

  Therefore, to meet your purpose, you must reject interpretations that emphasize Machiavelli's tragic realism (that *virtù* often fails) in favor of interpretations that emphasize Machiavelli's **prescriptive optimism** (that *virtù*, properly understood as bold preparation, *usually* masters fortune). You must prioritize the *Prince* as a handbook over the *Prince* as a tragedy.

  **Conclusion:** Demand an interpretation that treats *virtù* as a **method of diagnosis and preparation** that yields a high probability of success, even if it admits the possibility of failure. Reject any interpretation that makes *virtù* purely retrospective or so situational that no general rule of conduct can be extracted.
