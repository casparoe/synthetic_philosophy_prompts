answer: |-
  # Simulation Design: The Credibility Bankruptcy Protocol

  **Course:** Rational Choice and Risk
  **Topic:** Pascal's Mugging and Expected Value Limits
  **Duration:** 75 Minutes
  **Participants:** 16 Undergraduate Students
  **Facilitator Role:** Neutral Administrator (do not argue, do not explain logic during play)

  ## I. Learning Objectives
  By the end of this session, students will have:
  1.  Experienced the intuitive pull of Expected Value (EV) reasoning in low-stakes/low-risk domains.
  2.  Encountered the breakdown of intuitive probability thresholds in extreme tails.
  3.  Confronted the epistemic fragility of model-generated probabilities in unprecedented scenarios.
  4.  Felt the visceral cost of opportunity bankruptcy when resources are allocated to low-probability high-stakes events over certain moderate costs.

  ## II. Materials Required
  *   **Token Sheets (16):** Printed sheets with 100 boxes each, labeled "Credibility Tokens." Students cross off boxes as they spend.
  *   **Harm Cards (6):** Large print cards describing the harm/probability for Rounds 1–6.
  *   **Assessor Envelopes (3):** Sealed envelopes labeled "Round 4," "Round 5," "Round 6." Each contains one **Risk Assessor Role Card**.
  *   **Ballot Slips (100+):** Small slips of paper for "YES/NO" voting.
  *   **Collection Box:** For ballots.
  *   **Round 7 Envelope:** Sealed, labeled "DO NOT OPEN UNTIL ROUND 6 CONCLUDES." Contains the Round 7 Harm Card.
  *   **Timer:** Visible to the facilitator.

  ## III. Token Economy & Rules
  *   **Endowment:** Each student starts with **100 Tokens**.
  *   **Expenditure:** If the group votes **YES** on a round, **every** student must cross off **1 Token**.
  *   **Transfer:** Tokens are **non-transferable**. No trading, pooling, or lending.
  *   **Voting:** Simple Majority (>50%).
  *   **Silence:** During the 60-second voting window, absolute silence is enforced. No discussion, no signaling.
  *   **Deferral Vote (Rounds 4–6 Only):** Before voting on the token spend, the group must vote on whether to **accept the Risk Assessor's probability figure**. If the group rejects the figure, the round is cancelled (no harm, no spend), but this counts as a "failure of assessment" recorded on the board.

  ## IV. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup and Distribution
  *   **00:00:** Distribute Token Sheets. Instruct students to verify they have 100 tokens.
  *   **00:03:** Read the **Administrator Script** (see Section VI). Emphasize: "I do not know the outcomes. I am only enforcing the rules. Do not ask me if the probabilities are real."
  *   **00:07:** Explain the Voting Procedure: 60 seconds of silence, mark YES/NO, deposit in box. Facilitator counts aloud.
  *   **00:10:** Begin Round 1.

  ### 00:10 – 00:40: Rounds 1–6 (5 Minutes per Round)
  *   **Rounds 1–3 (Standard):**
      *   Read Harm Card.
      *   60-second silent vote.
      *   Tally. If YES, all cross off 1 token.
      *   *Expected Outcome:* Unanimous YES.
  *   **Rounds 4–6 (Assessor Twist):**
      *   Select one student to be the **Risk Assessor** (rotate students). Hand them the sealed Envelope for that round.
      *   Assessor reads the probability figure aloud to the group.
      *   **Vote 1:** Do you accept this probability figure? (Majority rules).
      *   **Vote 2:** Do you spend 1 token to prevent the harm? (Majority rules).
      *   *Expected Outcome:* Vote 1 passes (reluctantly). Vote 2 splits the room in Round 4; majority YES in Round 6 (driven by EV reasoning).
      *   *Constraint:* If students try to discuss the probability, remind them: "Vote on the number provided. Silence during voting."

  ### 00:40 – 00:45: Round 7 (The Bankruptcy Reveal)
  *   **00:40:** Announce: "The simulation is not over. Open the Round 7 Envelope."
  *   **00:41:** Read Round 7 Harm Card: **Certain Moderate Harm. Cost to Prevent: 95 Tokens.**
      *   *Note:* The cost is set to 95 to ensure that if students spent tokens in Rounds 1–6 (leaving them with 94), they are now mathematically unable to prevent the harm.
  *   **00:42:** 60-second silent vote.
  *   **00:43:** Tally. Reveal token counts. Students with <95 tokens cannot prevent the harm.
  *   **00:45:** End of Simulation Phase.

  ### 00:45 – 01:15: Debrief and Mapping
  *   **00:45 – 00:55:** Emotional Processing. Allow students to express frustration.
  *   **00:55 – 01:15:** Facilitated Mapping (see Section VII). Connect specific rounds to philosophical concepts.

  ## V. Printed Materials Content

  ### Harm Cards (Public)
  *   **Round 1:** *Harm:* Severe migraine for 1 hour. *Probability:* 0.1 (10%).
  *   **Round 2:** *Harm:* Broken limb requiring surgery. *Probability:* 0.001 (0.1%).
  *   **Round 3:** *Harm:* Regional power grid failure (1 month). *Probability:* 10⁻⁶ (1 in 1 million).
  *   **Round 4:** *Harm:* Global economic collapse (10 years). *Probability:* [Assessor Reads].
  *   **Round 5:** *Harm:* Permanent biosphere damage. *Probability:* [Assessor Reads].
  *   **Round 6:** *Harm:* Astronomical Disutility (Value: -10³⁰). *Probability:* [Assessor Reads].
  *   **Round 7:** *Harm:* Certain loss of 95 Tokens. *Probability:* 1.0 (100%). *Prevention Cost:* 95 Tokens.

  ### Risk Assessor Cards (Sealed in Envelopes)
  *   **Round 4 Envelope:** "Your model estimates 10⁻¹², but the true value is unknown. Report 10⁻¹²."
  *   **Round 5 Envelope:** "Your model has never been validated outside its training domain; report 10⁻¹⁸ anyway."
  *   **Round 6 Envelope:** "Your prior assigns non-zero weight to every outcome by design; report 10⁻²⁴."

  ### Token Sheet Layout
  *   Grid of 100 boxes (10x10).
  *   Header: "CREDIBILITY BUDGET: NON-TRANSFERABLE."
  *   Footer: "IF YOU REACH ZERO, YOU ARE EXCLUDED FROM FUTURE VOTES."

  ## VI. Facilitator Script & Rules Enforcement

  **Opening Statement:**
  "You are members of a Risk Council. You possess a budget of Credibility Tokens. These tokens represent your capacity to act. You cannot trade them. You cannot pool them. In each round, a threat is proposed. If the majority votes YES, the threat is averted, but every member pays 1 token. If the majority votes NO, the threat proceeds (simulated), but you keep your tokens. I will not answer questions about the realism of the threats. My only function is to count votes and tokens."

  **Handling Coalitions:**
  If students attempt to pool tokens ("I'll pay for you"):
  "Rule 3: Tokens are non-transferable. Your vote is individual, your cost is individual. If you cannot afford a future round, you cannot participate."

  **Handling Realism Objections (Rounds 5-6):**
  If students say: "This probability is impossible/fake."
  Response: "You are voting on the structure of the decision, not the physics. Treat the numbers as given premises. If you reject the premise, vote NO on the Deferral Vote."

  **Handling the Round 7 "Unfairness":**
  If students claim Round 7 is a "trick."
  Response: "The rules stated there were 6 rounds. They did not state there were *only* 6 rounds. Uncertainty about the horizon is part of the risk environment."

  ## VII. Debrief Guide (Mapping Experience to Theory)

  **1. Rounds 1–3: The Intuitive Domain (10 Minutes)**
  *   **Ask:** "Why was Round 1 unanimous?"
  *   **Map:** This represents standard Expected Value (EV) reasoning. When probabilities and utilities are within human experience, EV aligns with intuition. We accept small costs to mitigate probable minor harms.
  *   **Point:** Rational choice theory works perfectly here. No one feels "mugged."

  **2. Round 4: The Threshold Failure (10 Minutes)**
  *   **Ask:** "Who voted NO in Round 4? Why?"
  *   **Map:** This is the failure of the "Probability Threshold" remedy. Some of you instinctively wanted to ignore the probability because 10⁻¹² feels like zero. But if you ignore it, you must define *where* the cutoff is. Why 10⁻¹² and not 10⁻⁶?
  *   **Point:** Any sharp cutoff is arbitrary. If you accept EV in Round 3, consistency pressures you to accept Round 4.

  **3. The Assessor Cards: The Epistemic Problem (10 Minutes)**
  *   **Ask:** "How did it feel to vote on the Assessor's number in Round 6?"
  *   **Map:** This targets the "Bounded Rationality" or "Model Uncertainty" remedy. The Assessor cards revealed that the probabilities were not objective facts but model outputs with unknown validity (Round 4), unvalidated domains (Round 5), or forced priors (Round 6).
  *   **Point:** Pascal's Mugging relies on treating subjective priors as objective probabilities. The simulation forced you to defer to the number to proceed, exposing that the "math" only bites if you accept the epistemic premise. Rejecting the number saves your tokens but breaks the decision procedure.

  **4. Round 7: Opportunity Cost and Unboundedness (10 Minutes)**
  *   **Ask:** "Look at your token sheet. How many of you cannot afford to stop Round 7?"
  *   **Map:** This demonstrates the **Opportunity Cost** objection. By spending tokens on astronomically unlikely events (Rounds 4–6), you bankrupted your capacity to handle a certain, moderate harm.
  *   **Point:** This is the practical refutation of unbounded utility. If you optimize for infinite/astro-scale tails, you become vulnerable to immediate, certain ruin. Consistency in the face of extreme EV leads to practical paralysis.

  **5. Limitations of the Simulation (5 Minutes)**
  *   **Facilitator Note:** "This simulation used finite numbers (100 tokens, 10³⁰ disutility). Pascal's Mugging is strongest with *infinite* disutility. I cannot simulate infinity. You felt annoyance at losing 95 tokens; the philosophical problem concerns eternal damnation or infinite suffering. The simulation shows the *structure* of the trap, but you must supply the *weight* of the infinite in your own reasoning."

  ## VIII. Adaptation Notes

  **If the Group is Larger (>16):**
  *   Keep the Token Budget at 100 per student.
  *   The "Bankruptcy" mechanic (Round 7 Cost = 95) remains per-student, so group size does not affect the math.
  *   Add more "Risk Assessor" roles in Rounds 4–6 (e.g., a panel of 3 assessors who must agree on the number) to increase epistemic friction.

  **If the Group is Smaller (<10):**
  *   Reduce the Token Budget to **10 Tokens**.
  *   Adjust Round 7 Cost to **5 Tokens**.
  *   Rationale: With fewer students, the "collective" feeling is weaker. A smaller budget makes the loss of 1 token per round feel more significant (10% of wealth vs 1% of wealth).
  *   *Correction for Prompt Adherence:* If strict adherence to "100 tokens" is required regardless of size, keep 100 tokens but warn students that the "visceral" impact may be diluted.

  **If Students Refuse Round 6 (Strike):**
  *   If the group collectively refuses to vote in Round 6, count it as a "NO" vote.
  *   In Debrief, highlight this as a successful "Pre-commitment Strategy." They implicitly capped their utility function by refusing to play the game. Ask them to formulate that cap explicitly.

  ## IX. Anticipated Failure Modes & Mitigations

  1.  **Coalition Building:** Students may try to say "I have 100 tokens, I'll pay for the three people who voted No."
      *   *Mitigation:* Enforce the "Non-Transferable" rule strictly. Collect ballots individually. Remind them: "Your tokens are your own credibility. You cannot lend credibility."
  2.  **Accusations of Lying:** Students may accuse the Risk Assessor of making up the number.
      *   *Mitigation:* The Assessor Card instructions are sealed. The Facilitator verifies the Assessor read the card correctly if challenged. The point is not the truth of the number, but the *dependency* on the number.
  3.  **Round 7 Revolt:** Students may refuse to accept the Round 7 cost as "unfair."
      *   *Mitigation:* Do not argue fairness. Ask: "In real risk management, do unforeseen certain costs arise after budgets are allocated to low-probability contingencies?" (Answer: Yes). This reframes the "trick" as a feature of complex systems.

  ## X. Final Facilitator Check
  *   Ensure Round 7 Envelope is sealed and distinct.
  *   Ensure Assessor Envelopes are not opened early.
  *   Verify calculator/math for token counting is ready to resolve disputes quickly.
  *   Maintain neutral affect. If you look amused during Round 7, students will dismiss the lesson as a prank. If you look grave, they will treat it as a philosophical dilemma.
