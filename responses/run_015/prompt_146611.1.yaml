      *   *Threshold Recognisability:* This challenges the "actual consensus" model. It moves towards a *potential* consensus based on shared democratic premises, acknowledging that doctrinal barriers might block uptake without making the reason inherently inaccessible.
      *   *The Goal:* A specification of public justification that navigates these nuances better than standard Rawls (public reason) or Audi (translation principle) or Wolterstorff (religious reasons allowed).

  3.  **Drafting the Desiderata (Iterative Process):**

