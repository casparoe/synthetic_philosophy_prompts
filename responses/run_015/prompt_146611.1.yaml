          *   Classification: Non-negotiable vs. Camp Preferences (e.g., neutrality of aim vs. effect, translation vs. direct access).
          *   Tension Mapping: Explicitly state if any subset is jointly unsatisfiable (e.g., transparency vs. opacity).
          *   Disruptive Requirement: Identify the single requirement that damages existing positions the most.
          *   Format: List/Table acceptable, but conceptual weight on criteria/cases.
          *   Language: British English.

  2.  **Deconstruct the Core Concepts:**
