      *   *Tensions:* Opacity vs. Transparency. If I don't know my doctrine's implications, I can't guarantee my public reason is independent.
      *   *Disruptive Requirement:* Likely the one concerning *Doctrinal Opacity* combined with *Threshold Recognisability*, as it undermines the "translation" model (Audi) and the "all-in" model (Wolterstorff).

