  1.  **Analyze the Request:**
      *   **Topic:** Religious arguments in democratic deliberation / Public Justification.
      *   **Problem:** The standard Rawlsian exclusivism vs. inclusive liberalism framing is too coarse.
      *   **Key Conditions:**
