answer: |-
  Here's a tight, jargon-light argument you can hand out. It frames natural kinds not as "what things really are," but as "which bets pay off."

  ***

  **The Betting Test: Why Gold Works and Tigers Don't**

  Don't ask what gold or tigers *are*. Ask what they *do*. We group things into "kinds" for one reason: to make predictions. If I tell you something belongs to a certain group, you should be able to guess how it will behave in a situation you haven't seen yet. This is called induction. The best natural kinds are the ones that let you win the most bets across the widest range of contexts.

  **Chemistry Wins the Bet**
  Take gold. If I hand you a nugget and say "this is gold," you can predict its density, how it reacts to acid, its melting point, and how it conducts electricity. Here's the kicker: it doesn't matter *where* that gold came from. Gold mined in 1800 behaves like gold mined today. Gold on Earth behaves like gold on Mars. Gold in a ring behaves like gold in a circuit board.

  The grouping "gold" supports **context-independent induction**. You can write universal rules about gold that hold true everywhere, anytime. The payoff is high because the behavior is stable across all environments.

  **Biology Loses the Bet**
  Now take tigers. If I tell you "this is a tiger," what can you predict? It probably has stripes. It probably eats meat. But will it hunt alone or in a group? Will it survive in the snow? Will it breed with this other tiger?

  Unlike gold, a tiger's traits depend heavily on its environment, its health, and its specific history. A tiger in a zoo behaves differently than a tiger in the wild. A tiger from Sumatra looks different than a tiger from Siberia. More importantly, "tiger" is a snapshot of a moving target. Evolution is constantly changing the population. If you wait a million years, the "tiger" grouping might not exist anymore, or it might behave completely differently.

  The grouping "tiger" supports **context-dependent induction**. You can't write universal laws about tigers that hold true regardless of time or place. The payoff is low because the behavior varies with history and environment.

  **The Verdict**
  We aren't saying gold has a magical "essence" or that tigers are fake. We're saying that for the purpose of science—which wants universal laws—chemistry gives you stable tools, while biology gives you messy histories.

  Gold is a natural kind because it lets you predict the future based on the label alone. Tigers are not, because to predict a tiger, you need to know its story, not just its name. Chemistry carves nature at the joints; biology just traces the scars.
