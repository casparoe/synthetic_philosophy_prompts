prompt: |-
  hey — quick one. I work on the procurement side of a public agency, and we're trying to write fairness requirements into the contracts we sign with vendors who sell us risk scores (benefits eligibility, that sort of thing). Vendors bid with different models, we audit them after they've been running for a while, and everyone building a model knows the rule in advance. I need a spec before I write anything down.

  What I want from you: the list of requirements a fairness criterion has to meet to be usable as a procurement rule, with the motivating case behind each. The ones I keep circling: an auditor has to be able to check it from decisions and realised outcomes alone (we don't get the features, and outcomes are only observed for people who were selected); it has to be comparable across vendors whose scores aren't on the same scale; it can't be something a vendor can hit by tuning against the audit while making things worse on the ground; it should compose, or at least not fall apart, when the same person passes through three of these systems in a row; and it should still mean something when the score allocates an intervention that changes the outcome it was predicting. Add any I'm missing, say which are non-negotiable and which are just preferences, and flag anywhere I'm confusing the definition of a criterion with an estimator we could actually compute.

  The bit I really care about: given the familiar no-go results — you can't have calibration and equal error rates across groups at once when base rates differ, and the rest of that family — which subset of my requirements is jointly unsatisfiable, and what would we have to drop. One line each on the existing criteria at the end, no scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Procurement side of a public agency.
      *   **Task:** Writing fairness requirements into contracts for vendors selling risk scores (benefits eligibility).
      *   **Context:** Vendors bid with different models, post-deployment auditing, rules known in advance.
      *   **Constraints/Requirements for the Fairness Criterion:**
          1.  *Auditability:* Checkable from decisions + realized outcomes only (no features, censored outcomes for non-selected).
          2.  *Scale Invariance:* Comparable across vendors (scores on different scales).
          3.  *Goodhart Resistance:* Can't be gamed by tuning against the audit without improving ground truth.
          4.  *Composability:* Holds up when individuals pass through multiple systems.
          5.  *Intervention Awareness:* Meaningful when the score allocates an intervention that changes the outcome (treatment effect).
      *   **Specific Ask:** List requirements with motivating cases, distinguish non-negotiable vs. preferences, flag definition vs. estimator confusion, identify jointly unsatisfiable subsets (no-go theorems), and suggest what to drop. End with one-liners on existing criteria.
      *   **Tone:** Professional, technical, direct ("quick one", "spec before I write anything down").

  2.  **Deconstruct the Requirements (The "Spec"):**

      *   *Req 1: Auditability (Observability).* The agency doesn't get features ($X$), only scores ($S$), decisions ($D$), and outcomes ($Y$). Crucially, $Y$ is only observed if $D=1$ (selected). This is the *censoring* problem.
      *   *Req 2: Scale Invariance.* Vendor A uses 0-1 probability, Vendor B uses 0-100 risk index. The metric must depend on rank or thresholded decisions, not raw score values.
      *   *Req 3: Goodhart Resistance (Robustness).* If the metric is the target, can the vendor optimize the metric while harming utility or fairness? This relates to *performative prediction* or *gaming*.
      *   *Req 4: Composability.* System A $\to$ System B $\to$ System C. Does fairness at each step guarantee fairness overall? Or does it explode?
      *   *Req 5: Intervention Awareness (Causal).* The score triggers a benefit. The benefit changes $Y$. So $Y(1) \neq Y(0)$. Standard predictive fairness assumes $Y$ is fixed. This requires *causal fairness*.

      *   *Missing Requirements:*
          *   *Legal Defensibility:* Does it align with disparate impact/treatment law?
          *   *Computational Tractability:* Can the auditor actually calculate it with finite sample sizes?
          *   *Group Definition:* How are protected groups defined if features aren't shared? (Wait, if features aren't shared, how do we know groups? This is a critical conflict).

  3.  **Address the "Definition vs. Estimator" Confusion:**
      *   The user asks to check fairness from "decisions and realised outcomes alone."
      *   *Problem:* To measure fairness across groups (e.g., racial parity), you *need* group membership ($A$). The prompt says "we don't get the features." Usually, protected attributes are considered features. If the agency doesn't have $A$, they can't measure group fairness.
      *   *Assumption:* I must assume the agency *does* have the protected attributes (from their own records) even if they don't get the vendor's input features. Otherwise, group fairness is impossible. I need to flag this.
      *   *Censoring:* Outcomes only observed for selected ($D=1$). This makes error rates (FPR/FNR) impossible to calculate directly without strong assumptions (like ignorability or an audit sample).

  4.  **Analyze the No-Go Theorems (The "Impossible Trinity"):**
      *   *Classic:* Calibration + Equalized Odds + Base Rate Difference $\to$ Impossible.
      *   *User's Constraints:*
          *   Auditability (Censored Outcomes) makes Equalized Odds hard/impossible without experimental data.
          *   Intervention Awareness (Causal) breaks the link between Prediction Fairness and Outcome Fairness.
          *   Composability is generally false for most fairness metrics (e.g., Demographic Parity composes, but Equalized Odds often doesn't in sequence).
      *   *The Big Conflict:* You cannot have *Causal Fairness* (intervention changes outcome) + *Predictive Parity* (error rates) + *Observational Auditing* (censored data).
      *   *Specifically:* If the intervention changes the outcome, the "outcome" for the rejected group is counterfactual. You cannot observe it without randomization. Therefore, "realised outcomes alone" is incompatible with "intervention that changes the outcome."

  5.  **Drafting the Response:**

      *   **Section 1: The Specification (Requirements).**
          *   Break down the user's 5 points + missing ones.
          *   Label Non-Negotiable vs. Preference.
          *   Flag the "Features/Group" confusion.
      *   **Section 2: The Impossibility Result.**
          *   Identify the clash between *Censoring* (only see outcomes for selected) and *Intervention* (selection changes outcome).
          *   Identify the clash between *Scale Invariance/Rank* and *Calibration*.
          *   Identify the clash between *Composability* and *Error Rate Parity*.
      *   **Section 3: What to Drop.**
          *   Recommendation: Drop the idea of measuring error rates on realized outcomes alone if interventions are causal. Move to *randomized audit trials*.
          *   Drop strict composability (too hard).
          *   Focus on *Process Fairness* or *Threshold Parity* rather than Outcome Parity.
      *   **Section 4: One-Liners on Existing Criteria.**
          *   Demographic Parity, Equalized Odds, Calibration, Predictive Parity, Causal Fairness.

  6.  **Refining the Logic (Self-Correction during drafting):**
      *   *Correction on Group Data:* The user says "we don't get the features." In procurement, the vendor doesn't get the PII, but the Agency usually holds the PII. I need to clarify that the Agency must link the vendor's ID to their own demographic data. If they can't do that, *no group fairness metric is possible*. I will treat this as a critical dependency.
      *   *Correction on Censoring:* If outcomes are only observed for selected, you literally cannot calculate False Negative Rates. You don't know if the rejected people would have had the outcome. This makes "Equalized Odds" impossible to audit observationally. This is a hard stop.
      *   *Correction on Intervention:* If the benefit *fixes* the risk (e.g., housing prevents eviction), then a "positive outcome" (no eviction) for the treated group tells you nothing about the underlying risk. It tells you the treatment worked. This invalidates predictive fairness metrics entirely.
      *   *The "Goodhart" point:* If you optimize for a fairness metric that is observable (like Demographic Parity), vendors can just randomize decisions to hit the ratio while ignoring risk. This violates utility.

  7.  **Finalizing the Recommendations:**
      *   **Hard Constraint:** You cannot audit error rates with censored data + causal interventions.
      *   **Solution:** You need a *control group* (randomized rollout) to estimate counterfactuals.
      *   **Metric:** Focus on *threshold consistency* or *allocation rules* rather than outcome parity. Or, accept that you can only audit *process* (e.g., "did you use the same threshold for everyone?") rather than *outcome* fairness.
      *   **Composability:** Acknowledge this is mostly impossible for error rates. Suggest limiting the scope or aggregating the systems.

  8.  **Structure & Tone Check:**
      *   Keep it tight.
      *   Use bolding for emphasis.
      *   Ensure the "One Line" section is strictly one line per criterion.
      *   Make sure the "Definition vs. Estimator" flag is prominent.

  9.  *(Self-Correction on the "No-Go" specific to this prompt)*: The prompt asks "which subset of *my* requirements is jointly unsatisfiable."
      *   Requirement A: Audit from decisions + realized outcomes alone (Censored).
      *   Requirement B: Intervention changes outcome (Causal).
      *   Requirement C: Measure fairness (implies comparing outcomes across groups/decisions).
      *   *Conflict:* A + B make C impossible. You can't observe the counterfactual outcome needed to judge fairness if the intervention changes the outcome and you only see realized outcomes for the treated.
      *   *Conflict 2:* Scale Invariance + Calibration. Calibration requires score values to match probabilities. Scale invariance implies rank-only. These are tensioned (though monotonic transforms preserve calibration, different scales often imply different binning). Actually, Calibration is scale-*dependent* (scores must mean probability). So Scale Invariance + Calibration is a conflict.
      *   *Conflict 3:* Composability + Error Rate Parity. Known result (cumulative disadvantage).

      *   *Decision:* The strongest conflict is **Censored Outcomes + Causal Intervention + Outcome-Based Fairness**. This is the "Fundamental Problem of Causal Inference" meets "Selective Labeling."

  10. **Final Polish:** Check against the "one line each" constraint for the ending. Ensure the distinction between non-negotiable and preference is clear. (e.g., Legal compliance is non-negotiable, composability is preference).

      *(Wait, one nuance)*: The user says "outcomes are only observed for people who were selected." This is the *Selective Labeling* problem. If the intervention *changes* the outcome, this is also *Causal*.
      If I select you for housing, you don't become homeless. Outcome = 0 (good).
      If I reject you, you might become homeless. Outcome = 1 (bad).
      But I never see the outcome for the rejected.
      So I can't measure False Negatives.
      So I can't measure Equalized Odds.
      So I can't measure Calibration (need to know Y for all S).
      So what *can* I measure? Demographic Parity (selection rates). But that doesn't account for risk.
      So, Requirement 1 (Audit from decisions/outcomes alone) is incompatible with Requirement 5 (Intervention changes outcome) if the goal is predictive fairness.

      Okay, ready to write.

      *Wait, missing requirement:* **Group Attribute Availability.** The user says "we don't get the features." If protected attributes are features, they don't have them. I must flag this. If they have them internally, they need to link. If not, group fairness is dead on arrival. I will assume they can link internally but flag the risk.

      *Wait, Goodhart:* If the rule is known, vendors can post-hoc adjust thresholds per group to hit Demographic Parity. This hurts utility. This is the "Fairness vs Utility" tradeoff, but specifically "Gaming the Metric."

      *Let's structure the "Unsatisfiable Subset" clearly.*
      1. Observational Auditing (Censored).
      2. Causal Intervention.
      3. Predictive Fairness (Error rates/Calibration).
      Pick 2.

      Okay, proceeding to generate response.

      *Wait, check the "one line each" constraint.* "One line each on the existing criteria at the end, no scorecard." I need to list common criteria (Demographic Parity, EO, Calibration, etc.) and give a one-line verdict.

      *Refining the "Definition vs Estimator" flag:* The user asks for a "fairness criterion." A criterion is a population property (e.g., $P(D=1|A=0) = P(D=1|A=1)$). An estimator is how you calculate it from sample data. The user's constraint "auditor has to be able to check it from decisions and realised outcomes alone" conflates the *definition* (what is fair) with the *identification strategy* (can we measure it). I need to point out that some criteria are *unidentifiable* under their data constraints, not just hard to estimate.

      *Okay, plan solid.*
      1. Spec Requirements (with Motivating Case, Status, Flags).
      2. The Impossibility Cluster (What breaks).
      3. Recommendations (What to drop/modify).
      4. One-liners on existing criteria.

      *Wait, Composability:* "should compose... when the same person passes through three of these systems."
      If System 1 filters 50% of Group A, and System 2 filters 50% of Group A... cumulative impact is 75%.
      Demographic Parity composes multiplicatively (ratios stay same).
      Error rates do not compose well.
      I should note this.

      *Let's write.*
answer: |-
  ### Part 1: The Specification
  Here are the requirements for a procurement-ready fairness criterion, categorized by necessity. I have flagged where you are conflating a *definition* (the mathematical property) with an *identification strategy* (whether your data allows you to measure it).

  | Requirement | Motivating Case | Status | Flag |
  | :--- | :--- | :--- | :--- |
  | **1. Identifiability** | You state you only see decisions ($D$) and realized outcomes ($Y$) for the selected ($D=1$). If the criterion requires $Y$ for the rejected ($D=0$), you cannot compute it. | **Non-Negotiable** | **Definition/Estimator Confusion:** Most error-rate metrics (FPR/FNR) are *unidentifiable* under selective labeling. You are asking for an estimator for a quantity that does not exist in your data. |
  | **2. Scale Invariance** | Vendor A outputs probabilities [0,1]; Vendor B outputs risk indices [0,100]. The contract cannot mandate a specific score distribution. | **Non-Negotiable** | Criteria must rely on rank-ordering or thresholded decisions, not raw score values. |
  | **3. Causal Validity** | The benefit (e.g., housing) prevents the risk (e.g., eviction). If $Y$ is observed post-intervention, $Y$ reflects treatment efficacy, not underlying risk. | **Non-Negotiable** | **Definition/Estimator Confusion:** Predictive fairness criteria assume $Y \perp D$. Your setting is $Y(D)$. You need a *causal* fairness criterion, not a predictive one. |
  | **4. Goodhart Resistance** | Vendors know the rule. If the rule is "equal selection rates," vendors will randomize to hit the ratio regardless of risk. | **Preference** | Hard to guarantee. Mitigate by tying fairness to utility bounds (e.g., "parity within 10% of max utility"). |
  | **5. Composability** | Individuals pass through Housing $\to$ Cash $\to$ Job systems. Cumulative disadvantage can occur even if each step is "fair." | **Preference** | Most criteria do not compose. Enforcing this restricts you to Demographic Parity, which ignores risk. |
  | **6. Group Observability** | You say "we don't get the features." Protected attributes (race, sex) are features. If you cannot link vendor IDs to your internal demographic data, group fairness is impossible. | **Non-Negotiable** | **Operational Blocker:** You must ensure legal/technical ability to link records internally before auditing group metrics. |

  ### Part 2: The Impossibility Cluster
  You asked which subset of your requirements is jointly unsatisfiable. You have run into the **Fundamental Problem of Causal Inference** combined with **Selective Labeling**.

  **The Unsatisfiable Trio:**
  1.  **Observational Auditing:** You only observe outcomes for the selected ($Y$ given $D=1$).
  2.  **Causal Intervention:** The selection changes the outcome ($Y(1) \neq Y(0)$).
  3.  **Predictive Fairness:** You want to measure error rates or calibration (which require knowing $Y$ for everyone).

  **Why it breaks:**
  If the intervention works, a positive outcome for a selected person tells you nothing about their underlying risk, only that the treatment worked. You cannot observe the counterfactual ($Y$ if rejected) for the selected, nor the outcome for the rejected. Therefore, **you cannot calculate error rates, calibration, or equalized odds from realized outcomes alone.**

  **What you must drop:**
  *   **Drop "Predictive Fairness" based on realized outcomes.** You cannot audit error rates in this setting without a randomized control trial (RCT).
  *   **Drop "Composability" for error metrics.** It is mathematically impossible to guarantee cumulative error-rate parity across sequential systems without centralizing the decision logic.
  *   **Keep "Scale Invariance."** This forces you toward rank-based or threshold-based metrics.

  **The Procurement Fix:**
  Shift from *Outcome Fairness* (which is unidentifiable) to *Process Fairness*.
  *   **Requirement:** "Vendor must demonstrate that for any threshold $t$, the selection rate $P(S > t | A)$ differs by no more than $\epsilon$ across groups." (This is **Demographic Parity** on the score distribution).
  *   **Caveat:** This ignores base rates. To mitigate, require vendors to submit a *simulation* on a held-out, labeled audit dataset (where you provide the features/outcomes) before signing, rather than auditing on live data alone.

  ### Part 3: Existing Criteria (One-Line Verdicts)

  *   **Demographic Parity:** Identifiable under your constraints, but incentivizes ignoring risk and composes poorly on cumulative opportunity.
  *   **Equalized Odds:** Unidentifiable; requires observing false negatives (outcomes for rejected applicants).
  *   **Calibration:** Scale-dependent; fails your scale invariance requirement and unidentifiable with censored outcomes.
  *   **Predictive Parity:** Unidentifiable; requires knowing true positives/negatives across all groups despite censoring.
  *   **Counterfactual Fairness:** Conceptually correct for interventions, but requires a causal model you cannot audit from decisions alone.
  *   **Threshold Consistency:** Identifiable and scale-invariant; requires vendors to prove they apply the same score cutoff to all groups.
