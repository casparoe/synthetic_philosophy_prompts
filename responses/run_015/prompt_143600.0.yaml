      *   *The Interrupted Project:* This tests the "narrative" view of welfare. Deprivationists usually focus on hedonic or objective goods. Does "completion" add value? If so, death interrupts the *value* of the past too? That's a tricky spot for deprivationism (usually focuses on future goods). I need to frame this carefully.

  5.  **Drafting the Document (Iterative Process):**

      *   *Header:* JOINT STATEMENT ON THE BADNESS OF DEATH.
      *   *Intro:* Brief context.
