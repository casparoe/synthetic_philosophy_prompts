      *   **Tone:** Professional, philosophical but accessible (for a feature sidebar), adversarial collaboration style.

  2.  **Deconstruct the Philosophical Positions:**

      *   **The Epicurean (Symmetrist):** Death is annihilation. No subject = no harm. Prenatal non-existence is not bad, so post-mortem non-existence shouldn't be either. Harm requires a subject to experience it.
      *   **The Deprivationist:** Death is bad because it deprives you of the good life you would have had. Harm is comparative (actual life vs. possible life). You don't need to experience the harm for it to be a harm.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the collaboration.
      *   **Section 1: Agreed Claims:** Need to find common ground that isn't trivial.
          *   Fear of dying is real.
          *   Dying (process) is distinct from being dead (state).
          *   Death harms survivors.
          *   Lives can go better or worse.
          *   *Idea:* Both agree that *premature* death is generally worse than death at the end of a full span, though they explain it differently. Both agree that consciousness is necessary for *experiencing* value, even if not for *having* value.
      *   **Section 2: Table of Disagreements:** Needs parallel phrasing.
          *   *Topic:* The Nature of Harm. Epicurean: Harm requires a subject. Deprivationist: Harm requires a counterfactual comparison.
          *   *Topic:* Symmetry. Epicurean: Before/After are morally equivalent. Deprivationist: Before/After are asymmetric because of potential futures.
          *   *Topic:* Timing. Epicurean: Harm never occurs. Deprivationist: Harm occurs when the goods are lost (at death).
      *   **Section 3: The Cruxes:**
          *   *Timing Problem:* When does the harm happen?
          *   *Subject Requirement:* Must a victim exist to be harmed?
          *   *Verbal Dispute:* Is "harm" defined by experience or by welfare metrics?
      *   **Section 4: Test Cases (including the user's specific ones):**
