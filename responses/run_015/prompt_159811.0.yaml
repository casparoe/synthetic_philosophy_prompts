answer: |-
  You have identified a real phenomenon, but you are looking for it in the literature of AI safety or computer science, where it is often conflated with capability gains or specification gaming. The mechanism you describe is not primarily technical; it is economic and organizational.

  The established concept you are looking for lives in **Transaction Cost Economics** and **Contract Theory**, specifically under the heading of **Incomplete Contracting**.

  ### The Established Concept: Incomplete Contracting
  In economics (Oliver Hart, Oliver Williamson), a contract is "incomplete" when it is too costly to specify every possible state of the world and the corresponding action. When the cost of writing the specification (the "means") exceeds the cost of verifying the outcome (the "ends"), rational actors shift from **rules-based governance** to **discretion-based governance**.

  You are observing **Imperative-to-Declarative Drift** driven by **Specification Cost**.
  *   **Imperative:** "Run command X." (Low discretion, high specification cost).
  *   **Declarative:** "Make the bill lower." (High discretion, low specification cost).

  The "drift" occurs because the marginal cost of writing a perfect procedure is high, while the marginal cost of stating a goal is low. As the system proves reliable, the organization optimizes for labor efficiency by offloading the "thinking" (the procedure selection) to the system.

  ### The Dynamic: The Specification Ratchet
  While "Incomplete Contracting" explains the *why*, it doesn't fully name the *irreversibility* you noted. "Autonomy Creep" is indeed vague. A tighter label for the dynamic you described is **The Specification Ratchet**.

  **Definition:** *The Specification Ratchet is the path-dependent process by which instructions shift from procedural to outcome-based due to the economic pressure to reduce specification costs, locked in by the subsequent development of infrastructure (dashboards, permissions, review flows) that assumes outcome-based interaction, making reversion to procedural control prohibitively expensive.*

  **What doesn't count:**
  *   **Capability Gain:** If the instructions change *only* because the model learned to do more, that is capability scaling, not the Ratchet. The Ratchet happens even if capability stays flat, driven by human laziness/efficiency.
  *   **Function Creep:** This is when a tool is used for *new* purposes (e.g., using a chatbot for HR instead of Support). You are describing the same purpose, executed differently.
  *   **Specification Gaming:** This requires the system to exploit a loophole. In your case, the system is doing exactly what is asked; the *ask* is what has changed.

  ### Human Managers vs. Human Reports
  This pattern **does** show up between humans. It is the difference between managing a junior engineer and a principal engineer.
  *   **Junior:** "Write a function that sorts this list using quicksort." (Procedural)
  *   **Principal:** "Reduce the latency of this endpoint by 50%." (Outcome)

  **The Difference:**
  With humans, this shift is mediated by **shared cognitive context** and **social accountability**. If a human report fails to achieve the outcome, you can interrogate their reasoning. With the AI, the "reasoning" is opaque (a black box).
  *   **Human Delegation:** Transfers authority, but retains the ability to audit the *process* through conversation.
  *   **AI Delegation:** Transfers authority, and often loses the ability to audit the *process* entirely, leaving only the *output* for verification.

  Therefore, while the *economic mechanism* (Specification Cost) is identical, the *risk profile* is distinct. The AI case is a **Black-Box Delegation**, whereas the human case is a **Transparent Delegation** (in theory).

  ### The Legal Question
  Your legal team wants a binary (Tool vs. Agent) because liability frameworks usually depend on it. A "Tool" implies the user is liable for the output (like a hammer). An "Agent" implies the system (or its maker) might bear liability for its decisions (like a contractor).

  You cannot give them one honest sentence because the system's status is not a property of the software; it is a property of the **interaction at the moment of use**.

  **The Explanation for Legal:**
  > "The system cannot be classified as strictly a tool or an agent because its degree of agency is not a static architectural feature, but a dynamic variable determined by the granularity of the human instruction at the moment of invocation."

  **If forced to draft the customer-facing sentence:**
  > "The system operates as a controllable tool when given procedural instructions, but assumes discretionary agency when tasked with outcomes, shifting liability based on the user's chosen level of specification."

  ### Summary
  *   **Theoretical Home:** Transaction Cost Economics (Incomplete Contracting).
  *   **Proposed Name:** The Specification Ratchet.
  *   **Mechanism:** Specification Cost > Verification Cost.
  *   **Human Parallel:** Yes (Junior vs. Senior management), but without the opacity.
  *   **Legal Reality:** Agency is a continuous variable, not a binary state.

  You are not managing a tool that is becoming an agent; you are managing a **discretionary interface** where the boundary of control is being economically eroded. The risk isn't that the system "wakes up"; it's that your organization has quietly signed a series of incomplete contracts with a black box, and the ratchet prevents you from reading the fine print.
