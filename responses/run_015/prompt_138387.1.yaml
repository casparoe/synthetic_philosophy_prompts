answer: |-
  **Project Title:** The Aggregation Problem: Causal History and Normative Force in Multi-Peer Disagreement

  **Project Summary**
  The contemporary debate regarding peer disagreement is stalled between conciliationism (which mandates adjusting credence upon encountering a disagreeing peer) and steadfastness (which permits maintaining one's initial credence). This project argues that the stalemate arises from a structural limitation common to both views: the "Dyadic Assumption." Nearly all existing treatments model disagreement as a two-person interaction—one agent and one peer—and assume that the normative rule derived from this case generalizes to multi-peer contexts via simple iteration. I propose that this generalization fails. In multi-peer contexts, the normative force of disagreement depends not merely on the headcount of peers, but on the causal history of their opinions. This fellowship year will be dedicated to demonstrating that standard epistemological frameworks lack the resources to handle multi-peer disagreement without incorporating information about peer independence, and to determining whether such information is epistemically accessible.

  **The Research Question**
  The central question is not the broad "What should I do when peers disagree?" but a specific structural inquiry: **"Does a normatively adequate aggregation rule for multi-peer disagreement require causal-historical information about peer independence, and if so, can standard epistemological frameworks accommodate this requirement without collapsing into general theories of testimony?"**

  This question is narrow enough for a determinate answer within one year. It does not require solving the disagreement debate entirely, but rather testing the scalability of its current solutions. The goal is to establish whether the "peer" concept, as currently defined, carries sufficient evidential weight in group contexts, or whether it functions only as a placeholder for independent evidential access.

  **Why Standard Views Leave This Open**
  The proposal does not rehearse familiar objections regarding dogmatism or spinelessness. Instead, it targets the structural inadequacy of both families of view when moved from dyadic to multi-peer cases.

  1.  **Path-Dependence:** Standard conciliationism typically advises adjusting credence toward the peer's position. In a multi-peer scenario, if an agent adjusts sequentially toward each peer, the final credence depends on the order of encounter. No standard view offers a principled aggregation rule to avoid this arbitrariness. If the agent adjusts once toward a group summary, the view owes an account of how to weight that summary, which it does not provide.
  2.  **Correlation and Independence:** Both views treat the *fact* of disagreement as the trigger for normative pressure. However, in multi-peer cases, the *number* of disagreeing peers is treated as a proxy for the *weight* of evidence. This proxy fails if peers are correlated (e.g., they share training, read the same papers, or defer to a common authority). Counting correlated peers over-calls the evidence; collapsing them into a single testimonial datum under-calls it. Neither view distinguishes between ten independent peers and ten peers who have merely echoed a single source.
  3.  **Phantom Consensus:** A group may converge on a position no member arrived at independently (e.g., through mutual deference). In such cases, the headcount looks like robust evidence but is actually fragile. Standard views lack the machinery to detect this, as they assess peer status based on current competence and information, not the causal history of how that competence was applied.

  Consequently, the debate is stalled not because the normative intuitions are conflicting, but because the underlying model of the disagreement situation is underspecified.

  **Methodology**
  I will not rely on generating further intuitions about cases, as intuitions regarding large groups are unstable and likely contaminated by the very Dyadic Assumption I am challenging. Nor will I build a formal model that presupposes independence, as this would beg the question.

  Instead, I will employ a method of **structural stress-testing**. I will construct paired cases where the dyadic normative verdict is clear, but the multi-peer extension diverges based on causal history.
  *   *Case A (Independent):* Ten peers arrive at a view via distinct evidential paths.
  *   *Case B (Correlated):* Ten peers arrive at a view via a shared, potentially misleading channel.

  I will then apply standard conciliationist and steadfast rules to both cases. If the rules yield the same normative verdict for both cases, I will argue they are defective, as the evidential situation differs. If they yield different verdicts, I will demonstrate that the view implicitly relies on independence assumptions it does not state. This method isolates the variable of *causal history* to see if standard epistemological tools can register it.

  **Range of Conclusions and Failure Conditions**
  There are three viable outcomes:
  1.  **Revisionism:** Standard views can be saved, but only by redefining "peer" to include independence conditions.
  2.  **Skepticism:** The required causal-historical information is typically inaccessible to the agent, meaning normative guidance for multi-peer disagreement is impossible in real-world contexts.
  3.  **Expansion:** Epistemology of disagreement must merge with social epistemology of testimony, abandoning the idea that disagreement is a distinct normative category.

  **Failure Condition:** It is crucial to distinguish a negative result from a failed project. Finding that standard views fail is a *success* for this project. The project would be considered **not worth undertaking** only if it turns out that the "multi-peer" problem dissolves into the general problem of testimony without remainder. If "disagreement" adds no specific normative structure beyond "conflicting testimony," then the specific literature on peer disagreement is a distraction, and pursuing this line of inquiry would be a category error. I will assess this early in the fellowship; if the distinction collapses, I will pivot to a broader critique of the subfield rather than attempting to solve the aggregation problem.

  **Scope and Timeline**
  *   **Fellowship Year:** The goal is diagnostic and negative. I will establish the failure of the Dyadic Assumption and prove the necessity of causal-historical data. I will determine whether "peerhood" can coherently include independence conditions.
  *   **Deferred to Dissertation:** Constructing the positive normative theory (the actual aggregation rule) and applying it to specific domains (e.g., scientific consensus or political polarization) will be deferred. The fellowship buys the time to break the stalemate; the dissertation will build the resolution.

  **Practical Upshot**
  Is there a deliverable for a non-philosopher, such as a convener of expert panels? Yes, but it is a constraint rather than an algorithm. The result will not provide a formula for weighting expert opinions. However, it will provide a rigorous justification for why "near-unanimity" is epistemically hollow without metadata regarding how that unanimity was achieved. For a panel convener, the upshot is that seeking consensus is less valuable than seeking *independent* convergence. This is a real deliverable: it shifts the metric of success from *agreement* to *diversity of derivation*. If the project concludes that this information is inaccessible (Outcome 2 above), the upshot is a warning against relying on headcounts in policy decisions. Either way, the philosophical work translates into a cautionary principle for institutional design.

  **Critical Reflection on Framing**
  I have considered whether the many-peer case is a sideshow and the real stall lies elsewhere (e.g., in the definition of "peerhood" itself). However, the definition of peerhood is typically tested in dyadic cases. The multi-peer context is the only arena where the *evidential value* of peerhood is stressed enough to reveal its dependence on causal history. Therefore, the many-peer case is not a distraction but the necessary stress test for the core concept. If the concept breaks here, it is broken generally. Focusing on this extension is the most efficient route to diagnosing the foundational stall.
