  The distinguishing clause across your first four cases is whether the action conforms to the default functional norms of the shared space. In Case 1, overhead lighting is a baseline requirement for office work, so the burden of accommodation falls on the sensitive individual (Noah), whereas in Case 2, strong perfume is an optional deviation from professional norms, so the burden falls on the source (Maya). Similarly, Case 3 treats loud instrument practice as a deviation from the residential norm of quiet enjoyment, forcing Leo to adapt, while Case 4 treats door painting as an intrinsic property right within the norm of home ownership, forcing Priya to tolerate it. This principle resolves Case 5 in Leo's favor: a white noise fan is a standard appliance used for the baseline function of a bedroom (sleep), and faint mechanical hum is within the expected auditory background of shared walls, unlike the active, loud intrusion of the saxophone.

  However, Case 1 is the least defensible under scrutiny because it creates a tension with Case 2 regarding physiological harm. In Case 2, you rule that health (migraines) trumps personal preference (style), but in Case 1, you rule that economic function (work lighting) trumps health (migraines). While the "Baseline Expectation" principle saves the logic, it relies on the assumption that office lighting norms are immutable, whereas ethical consistency usually demands that severe health constraints override baseline functional norms if a low-cost alternative exists (e.g., Maya using a desk lamp instead of overheads).
