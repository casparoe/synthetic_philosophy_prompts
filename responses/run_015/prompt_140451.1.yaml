      *   *Key Terminology:* Introduce "Target Adequacy" vs. "Structural Fidelity."
      *   *The "Econ Student" Point:* They say "wrong question." They might mean "You're asking about truth, we're asking about utility." The user's split bridges this by showing *when* utility decouples from truth.

