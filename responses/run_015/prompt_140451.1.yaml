answer: |-
  This is a sharp diagnosis of a classic impasse. You are right to resist the historian's dismissal. De-idealization assumes a continuum: you can always add friction, heterogeneity, or bounds to get "closer" to reality. Your "Substitutive" category identifies something darker: assumptions that are not just distant from reality, but *categorically* different from it, serving as computational surrogates rather than approximate descriptions.

  Here is the diagnosis of your stalemate, working through your taxonomy and your cases.

  ### 1. Does the Three-Way Split Collapse?

  Your split is robust, but not in the way you think. It doesn't collapse into de-idealization, but it is unstable across **queries**.

  *   **Relaxable:** This is standard robustness. If I add transport costs $\epsilon$, the equilibrium shifts by $\delta$. Everyone agrees here.
  *   **Load-bearing:** This is standard sensitivity. If I add heterogeneity, the equilibrium disappears. Everyone agrees here too.
  *   **Substitutive:** This is the friction point. You define this as "no sequence of small relaxations walks you from the false description to the true one." This is distinct from de-idealization because de-idealization implies the false assumption is a *limit* of the true one. Substitutive assumptions are often *topologically* distinct (e.g., continuous fluid vs. discrete agents).

  **Where it collapses:** The category of an assumption is not intrinsic to the assumption; it is relative to the **output variable** you care about.
  An assumption can be *Substitutive* for one question and *Load-bearing* for another. This is why your group is talking past each other. The Friedmanite is looking at Output A (aggregate price), where the assumption is Substitutive (works fine). The Critic is looking at Output B (distributional impact), where the assumption is Load-bearing (breaks everything).

  The stalemate isn't about the assumptions; it's about the **invariance of the model's success across counterfactuals.**

  ### 2. Working the Cases

  Let's apply this relativity to your two examples. This shows why the "Econ PhD" says you're asking the wrong question, and why they are half-right but missing the danger.

  **Case A: The Housing Market (Representative Agent)**
  *   **The Assumption:** All landlords are identical price-takers.
  *   **Query 1 (Forecasting Average Rent):** The model works for ten years.
      *   *Diagnosis:* Here, the assumption is **Substitutive**. The heterogeneity averages out. You cannot "relax" this assumption easily without breaking the solvability of the differential equations, but the aggregate output remains stable despite the falsehood. The Friedmanite wins.
  *   **Query 2 (Policy: Rent Cap):** The city council uses the model. The prediction fails.
      *   *Diagnosis:* Here, the assumption flips to **Load-bearing**. A rent cap triggers a response that depends entirely on the *margin* of landlords (who is willing to exit the market?). By assuming a representative agent, you have assumed away the very margin that drives the policy outcome. The Critic wins.
  *   **The Stalemate Source:** The Friedmanite says, "The model predicted rents correctly for ten years." The Critic says, "The model failed to predict the policy impact." Both are true. The disagreement is about whether a model that succeeds at Query 1 earns credit for Query 2. Your split reveals that **Substitutive assumptions do not grant license for counterfactual intervention.**

  **Case B: The Epidemic (Perfect Mixing)**
  *   **The Assumption:** Everyone has an equal probability of contacting everyone else.
  *   **Query 1 (Early Curve Shape / R0):** The model fits the exponential growth phase.
      *   *Diagnosis:* **Substitutive.** Nobody believes people are perfectly mixed. This is a statistical smoothing device. It captures the *mean field* behavior. It is not "approximately true" (social networks are not dense random graphs), but it is *computationally sufficient* for the bulk flow.
  *   **Query 2 (Hospital Capacity / Lockdown Targeting):** The model is used to size ICU beds or target restrictions.
      *   *Diagnosis:* **Load-bearing (potentially).** If the variance in contact rates is high (superspreaders), the "perfect mixing" model underestimates the herd immunity threshold and overestimates the efficacy of random lockdowns.
      *   *Nuance:* However, for *total* hospital capacity (aggregate load), the perfect mixing model often remains **Substitutive** even here. The total number of infections might be right even if the *who* is wrong.
  *   **The Stalemate Source:** The Critic says, "The mechanism is false; you don't know *why* it works." The Friedmanite says, "The mechanism doesn't matter; the bed count is right." The tension is between **Structural Fidelity** (do we know the causal gears?) and **Target Adequacy** (did we hit the number?).

  ### 3. Diagnosis of the Stalemate

  The disagreement is not verbal, nor is it purely empirical. It is a clash of **Modal Profiles**.

  1.  **Friedman's Side (Instrumentalism):** Cares about *Actual World Prediction*. If the model maps Input $\to$ Output correctly in the observed domain, the internal structure is irrelevant. They treat models as **lookup tables**.
  2.  **The Critic's Side (Realism/Interventionism):** Cares about *Possible World Intervention*. If you change the rules (policy), does the model still hold? They treat models as **simulators**.

  Your "Substitutive" category is the bridge that burns. A Substitutive assumption works for Actual World Prediction (Friedman) but often fails for Possible World Intervention (Critic).

  **Why the Econ Student is Annoying (and Half-Right):**
  They say you're asking the wrong question because, in their training, "explanation" is often a luxury good. If the Fed needs a number by Tuesday, a Substitutive assumption that delivers the number is "true enough." They are operating under a constraint of **tractability**. They know the Representative Agent is false (Substitutive), but they also know the Heterogeneous Agent model might not solve. They are making a trade-off you are treating as a philosophical error.

  **Why the Historian is Half-Wrong:**
  They say this is just de-idealization. But de-idealization implies we can get closer to truth by adding complexity. With Substitutive assumptions (like perfect mixing or representative agents), adding complexity often breaks the model entirely without guaranteeing better predictions (overfitting). The issue isn't "degree of truth"; it's **dimensionality reduction**. You are compressing a million dimensions into one. The fight is about how much information loss is permissible before the compression becomes misleading.

  ### 4. What Counts as Progress?

  You will not solve this by defining "assumption" better. You will solve it by defining **"Domain of Robustness."**

  Progress in your reading group would look like shifting the question from *"Are the assumptions realistic?"* to *"For which class of counterfactuals is this model invariant?"*

  Here is the specific program to break the stalemate:

  1.  **Formalize the "Substitutive" as Effective Theory:**
      Borrow from physics. An ideal gas law is false (particles have volume), but it is an *Effective Theory* valid at certain scales. Progress means identifying the **scale** at which the Substitutive assumption breaks. In econ, this means specifying: "This model works for aggregate price prediction but is invalid for distributional policy analysis."
      *   *Action:* Ask the Econ student: "Under what conditions does the Representative Agent model yield the *same* policy prescription as a Heterogeneous Agent model?" If they can't answer, the Critic wins. If they can, the Friedmanite wins.

  2.  **The "Warrant for Intervention" Test:**
      Propose a rule: **Substitutive assumptions warrant prediction; Load-bearing assumptions warrant intervention.**
      If a model relies on Substitutive assumptions (perfect mixing, representative agent), it can be used to forecast the status quo. It *cannot* be used to design a policy that changes the structure of the system (e.g., a rent cap changes the incentives of the marginal landlord, whom the representative agent assumed away).
      *   *Action:* Ask the group: "Do we agree that a model built on Substitutive assumptions requires external validation before policy use?"

  3.  **Empirical Audit of "Success":**
      The stalemate is partly empirical. How often do Substitutive assumptions actually lead to policy failure?
      *   *Action:* Stop arguing theory. Look at the history. When did the Representative Agent models fail policy? (e.g., 2008 crisis, where heterogeneity in leverage mattered). When did Perfect Mixing work? (e.g., initial flu spread). If the failure rate of Substitutive models in policy contexts is high, the Critic wins on empirical grounds, not philosophical ones.

  ### Summary Diagnosis

  Your three-way split is real and distinct from de-idealization because it acknowledges **tractability constraints** that prevent relaxation, not just truth constraints.

  The stalemate is a **clash of modal scope**. The Friedmanite is satisfied with *actual-world fit*. The Critic demands *counterfactual robustness*.

  The "Substitutive" assumption is the Trojan Horse: it delivers actual-world fit (pleasing the Friedmanite) while hiding counterfactual fragility (enraging the Critic).

  **Progress** comes from forcing the group to specify the **Query** before evaluating the **Assumption**. If the question is "What will rent be next year?", the Representative Agent might be fine. If the question is "What happens if we cap rent?", that same assumption is fatal. The disagreement isn't about the model; it's about whether the group is trying to predict the future or design it. Once you separate those goals, the "F-twist" loses its bite, because its validity is shown to be local, not universal.
