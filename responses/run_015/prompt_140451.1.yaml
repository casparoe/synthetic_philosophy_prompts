prompt: |-
  I'm in a philosophy-of-science reading group — six of us, one econ PhD student who builds models for a living, one historian of science, the rest grad students — and we've spent something like eight weeks on the same argument about unrealistic assumptions in scientific models and nobody has moved anybody. The Friedman side (you know the one, from his 1953 essay on positive economics, the bit people nickname the F-twist) says a theory is judged by its predictions, its assumptions aren't in the business of describing anything, and unrealisticness is often a positive virtue because you buy generality and tractability with it; the examples get dragged out every time, the billiard player who plays as if he knew the trigonometric solution, the tree whose leaves end up distributed as if each leaf were maximizing its own sunlight, and the point is supposed to be that as-if reasoning can get the answer right exactly by not tracking the real mechanism. The other side says fine, that works for predicting inside the domain you fit on, but the second you want an explanation, or you want to move the model to a new setting, or you want to use it to design a policy, the falsehoods propagate and you can't tell which of your results are artifacts of the setup. My gut is with the second side, but I've noticed I only ever have intuitions, and the econ student keeps saying we're asking the wrong question, which I find annoying partly because I half believe it.

  So here's the thing I actually want you to get your teeth into, because I think it's where the disagreement is hiding and I've never seen anybody say it. I've started sorting the false assumptions inside models into three kinds. Relaxable ones: false, but you can perturb toward realism and the result survives, like assuming zero transport costs when transport costs are small. Load-bearing ones: the result doesn't degrade when you relax them, it flips or vanishes, so the finding was made by the assumption. And a third kind I have no good name for, substitutive ones, where the false claim isn't standing in for a true claim you could write down if you were cleverer — it's standing in for something genuinely unformulable for us, like treating a whole population of heterogeneous agents as one representative agent, or assuming perfect mixing in an epidemic model: there is no sequence of small relaxations that walks you from the false description to the true one, so the assumption isn't even in the business of being approximately true. My hypothesis is that the decades-long argument is three arguments stacked under one heading: about relaxable assumptions the instrumentalist is straightforwardly right and the critic is making noise; about load-bearing ones the critic is straightforwardly right and the instrumentalist is changing the subject; and about substitutive ones it's a different question entirely that neither side has vocabulary for, something about whether a model is a claim about the world or a tool for acting on it. The historian in our group says my three-way thing is just the old point about de-idealizability dressed up in new words, which I don't think is right but I can't say why.

  Give me a diagnosis, not a verdict and not a survey of positions. Is my three-way split a real distinction or does it collapse under pressure, and if it collapses, where exactly? Is the stalemate mostly verbal — a fight about what counts as the assumptions of a theory in the first place, the axioms, the initial conditions, the bridge principles, the ceteris paribus clause — or is it a clash about what models are for, prediction versus explanation versus intervention, or a hidden empirical question about how common each of my three kinds actually is in practicing scientists' models, or just bedrock disagreement about what understanding amounts to that neither side can argue for? Please actually work my cases rather than gesturing at them: a housing-market model that treats every landlord as an identical price-taker, forecasts average city rents beautifully for ten years, and then gets used by the city council to predict what happens under a rent cap, where the answer turns out to hinge entirely on the heterogeneity the model assumed away; and the perfect-mixing epidemic model that gets the early curve shape right and is used to size hospital capacity even though nobody for a second believes anyone is perfectly mixed. And then, given whatever you think this disagreement is: what would count as progress on it — a distinction like the one I'm fumbling at, some formal result about when relaxing an assumption changes a conclusion, a change of question, an empirical study of modeling practice — or should we expect none, and why?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **Context:** Philosophy-of-science reading group (6 people, mixed backgrounds: econ PhD, historian, grad students).
      *   **Problem:** 8-week stalemate on Friedman's "F-twist" (unrealistic assumptions in models).
      *   **User's Position:** Leans towards the critic side (false assumptions break explanation/policy) but feels they only have intuitions.
      *   **User's Innovation:** Proposes a three-way split of false assumptions:
          1.  *Relaxable:* False but perturbable (results survive).
          2.  *Load-bearing:* False and critical (results flip/vanish if relaxed).
          3.  *Substitutive:* False, standing in for something unformulable (no sequence of small relaxations leads to truth, e.g., representative agent, perfect mixing).
      *   **User's Hypothesis:** The stalemate is actually three different arguments stacked under one heading. The historian claims it's just "de-idealizability" dressed up.
      *   **Task:** Give a *diagnosis*, not a verdict or survey. Analyze if the three-way split holds or collapses. Determine the nature of the stalemate (verbal, functional, empirical, bedrock). Work the specific cases (housing market/rent cap, epidemic/perfect mixing). Suggest what counts as progress.
      *   **Tone:** Intellectual, rigorous, engaging, respectful of the user's insight but critical where necessary. Avoid generic philosophy summaries.

  2.  **Deconstruct the User's Three-Way Split:**
      *   *Relaxable:* This aligns with standard robustness analysis. Friedman wins here.
      *   *Load-bearing:* This aligns with the "garbage in, garbage out" or "right answer for wrong reasons" critique. Critic wins here.
      *   *Substitutive:* This is the interesting one. The user claims these aren't "approximately true" even in limit. They are *functional placeholders*.
      *   *Historian's Objection:* It's just "de-idealizability."
      *   *My Assessment:* The historian is half-right but misses the nuance. De-idealization usually implies there *is* a more realistic idealization to move towards. The "Substitutive" category implies there might *not* be a tractable realistic version at all. It's not just about degrees of truth; it's about *representational capacity*. However, does "Substitutive" collapse into "Load-bearing"? If you can't relax it, isn't it by definition load-bearing? Not necessarily. A substitutive assumption might yield robust predictions *despite* being un-relaxable (e.g., perfect mixing gets the R0 right even if contact networks are complex). So the distinction holds, but the boundary between Load-bearing and Substitutive is porous.

  3.  **Analyze the Specific Cases:**
      *   *Housing Market (Representative Agent):*
          *   Prediction (Average Rent): Works well (Substitutive/Relaxable hybrid).
          *   Intervention (Rent Cap): Fails because distribution matters (Load-bearing).
          *   *Diagnosis:* The assumption functions differently depending on the *question asked*. It's not intrinsic to the assumption, but to the *query*.
      *   *Epidemic (Perfect Mixing):*
          *   Prediction (Early Curve): Works (Substitutive).
          *   Intervention (Hospital Capacity): Works for aggregate load, fails for localized outbreaks.
          *   *Diagnosis:* Here, the falsehood is known to be ontologically wrong, but statistically sufficient for the specific output (aggregate flux). It's a *statistical surrogate*, not a structural claim.

  4.  **Diagnose the Stalemate:**
      *   Is it verbal? Partly. "Assumption" is doing too much work (ontological claim vs. mathematical convenience vs. ceteris paribus).
      *   Is it functional? Yes. Prediction vs. Explanation vs. Intervention. Friedman talks prediction; Critics talk explanation/intervention.
      *   Is it empirical? Yes. How common are "Substitutive" assumptions that actually work for intervention?
      *   Is it bedrock? Yes. What is "understanding"? Is it knowing the mechanism or knowing the input-output mapping?
      *   *Core Insight:* The stalemate persists because "Model Success" is underspecified. The user's split helps, but the real friction is *Modal Robustness*. Can the model survive counterfactuals?

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the Insight:* Validate the three-way split. It's better than de-idealization because it addresses *tractability constraints*, not just truth approximation.
      *   *Critique the Split:*
          *   "Relaxable" is standard.
          *   "Load-bearing" is standard sensitivity analysis.
          *   "Substitutive" is the gem. But is it distinct from Load-bearing? If I can't relax it, isn't it load-bearing? *Correction:* No. I can't relax it (computationally/conceptually), but the result might still hold if I *could*. So it's about *epistemic access* to the relaxation, not just the logical dependence.
          *   *Refinement:* The split isn't about the assumptions themselves, but about the *relationship between the assumption and the target phenomenon*.
      *   *Work the Cases:*
          *   Housing: The Representative Agent is *Substitutive* for price prediction (aggregation works) but *Load-bearing* for policy (distribution matters). The assumption didn't change; the *use case* changed. This proves the stalemate is about *purpose*, not just assumptions.
          *   Epidemics: Perfect mixing is *Substitutive*. It's a statistical smoothing device. It works for R0, fails for superspreaders. It's not "approximately true," it's "computationally sufficient."
      *   *The Historian's Objection:* Why is the user right to resist? De-idealization assumes a continuum of truth. Substitutive assumptions admit there is no continuum (e.g., discrete agents vs. continuous fluid). It's a category error, not a degree error.
      *   *The Real Stalemate:* It's a clash of *Modal Profiles*. Friedman cares about *actual* world prediction. Critics care about *counterfactual* world intervention.
      *   *Path to Progress:*
          1.  Stop asking "Are assumptions realistic?" Ask "For which *queries* is this model robust?"
          2.  Formalize "Substitutive" as *Effective Theory* (like renormalization in physics).
          3.  Empirical study: Map assumptions to query-types.

