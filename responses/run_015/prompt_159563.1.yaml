answer: |-
  This is a really sharp reconstruction of the tension between Taurek's non-aggregationism and the metaphysics of personal identity, and you have put your finger on exactly the nerve that keeps ethicists up at night. You are basically asking whether the principle that blocks aggregation across persons should also block aggregation across time within a single person, and you have correctly spotted that if the answer is yes, we get absurd results in the Ada case. Since you want to keep the Taurek conclusion that numbers do not count across lives, you are looking for a way to stop the slide from the five-versus-one case to the Ada case without giving up the coin flip. The rot, I think, is in step five, though step one is doing a lot of the heavy lifting that makes step five look plausible. Step five looks safe when you write it down because it relies on a very strict reading of reductionism, one that assumes that if persons are just series of stages, then only the stages can be subjects of loss. But that inference is where most philosophers, even reductionists, would push back.

  To see why, you have to look at what is settled and what is contested in the literature. It is pretty much settled among ethicists that there is a reason to give Ada the ten years rather than the one year. Almost nobody, not even hardline reductionists, accepts conclusion six. We agree that a doctor who knowingly shortens a patient's life without consent has wronged them. So step six is your anchor; it is the fixed point that the rest of the argument has to accommodate. What is genuinely contested is whether the justification for saving Ada for ten years commits us to saving the five instead of the one. Utilitarians and aggregators say yes, the logic is the same. Taurekians say no, the logic is different. Your argument tries to show that if you are a Taurekian for the wrong metaphysical reasons, you end up sabotaging the Ada case. The way out is to show that the metaphysics allows for aggregation within a life even if it blocks it across lives.

  The problem arises in your move from step four to step five. You write that on a reductionist picture, no individual loses nine years because Ada-at-forty-one is not strictly identical with Ada-at-fifty. This assumes that strict identity is required for someone to bear a loss over time. But most reductionists, following Parfit, argue that what matters for survival and prudential concern is not strict identity but psychological connectedness and continuity. Even if Ada is just a series of stages, those stages are linked by memory, character, and causal dependence in a way that the stages of the five different people are not. When you treat Ada, you are benefiting a single life narrative, a single system of interconnected stages. When you choose between the five and the one, you are choosing between five distinct life narratives. So step five is false because it ignores the prudential unity relation. There is an individual who loses the nine years, namely Ada, understood not as a metaphysical ego but as a psychologically unified sequence. The five people do not form a similar sequence. They are not connected to each other by memory or character. So you can hold that numbers count within a life because there is a unified subject of experience, while maintaining that numbers do not count across lives because there is no unified subject spanning the five.

  If you reject step five in this way, you can keep step one, but you have to refine what you mean by individual. Step one says a consideration counts only if it is a fact about what some individual stands to lose. If you define individual loosely enough to include a psychologically connected series of stages, then Ada counts as an individual who loses nine years. The five people do not count as an individual who loses five lives. This preserves the Taurekian intuition that there is no single subject who loses the aggregate amount in the five-versus-one case, while avoiding the absurdity in the Ada case. However, you pay a price for this. The price is that you have to accept that personhood is a matter of degree. If psychological connectedness is what allows aggregation within a life, then what happens in cases where connectedness is weak? Think about severe dementia or fission cases. If Ada loses most of her memories between forty-one and fifty, does the reason to save her weaken? Some philosophers, like McMahan with his time-relative interest account, are willing to bite that bullet and say yes, the reason is weaker. Others say no, biological continuity is enough. You will have to take a stand on what constitutes the unity of a person, and you cannot just say it is obvious.

  Another option is to reject step one entirely, but that costs you Taurek. If you say that five separate reasons can aggregate even without a single subject who loses all five, then you have accepted the aggregator's view. You would have to say that the reason to save the five is stronger simply because there are five distinct claims, even if no one person holds all five claims. This is the standard objection to Taurek, argued by people like Kamm and Broome. They say that justice requires us to respond to the sum of claims, not just the strength of the strongest single claim. If you go this route, you save Ada easily, but you lose the coin flip. Since you said you prefer keeping the coin flip, I assume you do not want to pay that price. So rejecting step one is probably not the move for you, unless you are willing to concede that Taurek was wrong about the five-versus-one case.

  There is also a historical note to consider here. Taurek himself did not rely on reductionism. In fact, he might be uncomfortable with your use of it. Taurek's argument is moral, not metaphysical. He argues that each person has a claim to be saved, and since no one has a claim to be preferred over another, we must give them equal chance. He does not need to say that the group of five is not an individual; he just says that the group does not have a claim because groups do not suffer. You are trying to ground his moral conclusion in a metaphysical premise about the nature of persons. That is a valid strategy, but it exposes you to metaphysical counterarguments that Taurek avoided. Taurek could simply say that Ada is one person and the five are five persons, and leave it at that. He does not need to dissolve Ada into stages. If you bring reductionism into it, you invite the problem you are facing. So one way to fix your argument is to drop the reductionist premise in step four. If you treat Ada as a plain old person who persists through time, then step five does not follow. Ada loses nine years. Full stop. The five do not lose five lives collectively. Full stop. The asymmetry is preserved without needing to wrestle with person-stages.

  However, if you are committed to reductionism for other reasons, perhaps because you find the further fact view of persons untenable, then you must stick with the prudential unity solution. You have to argue that the relations that hold between Ada-at-forty-one and Ada-at-fifty are morally significant in a way that the relations between Ada and Bob are not. This is the standard reductionist line. Parfit himself thought that reductionism makes the distinction between persons less significant, which actually pushes him toward aggregation across lives, not away from it. He thought that if persons are less real, we should care less about the boundary between them. So you are actually using reductionism against Parfit's own conclusion. You are saying that if persons are just stages, then intrapersonal aggregation is threatened. Parfit says if persons are just stages, then interpersonal aggregation is permitted. You are worried that if you block interpersonal aggregation, you block intrapersonal aggregation. The way to avoid this is to say that the unity within a life is sufficient for aggregation, while the disunity across lives is not. This is a stable position, but it requires you to defend the moral significance of psychological connectedness.

  So here is the bottom line on where I think you should cut. I would reject the inference from step four to step five. It looked safe because it assumes that loss requires strict identity of a subject over time. But loss only requires a subject who is sufficiently connected to the future experience to have a stake in it. Ada has that stake; the five people do not have a collective stake. By rejecting this inference, you keep step one, you keep step three, and you avoid step six. The cost is that you must accept a view of persons where unity is based on psychological relations rather than metaphysical identity, and you must accept that these relations come in degrees. This might make some edge cases messy, like whether to save a person who will have very little psychological connection to their future self, but it saves you from the absurdity of saying there is no reason to save Ada for ten years. It also keeps you faithful to the Taurekian intuition that the five do not constitute a single claimant, because they lack the connectedness that Ada has with herself.

  One last thing to flag as contested. There is a group of philosophers who argue that Taurek is simply wrong and that numbers must count, full stop. They would look at your argument and say that step six is not actually absurd, or rather, that if your metaphysics leads to step six, your metaphysics is fine but your moral intuition about Ada is wrong. They might say that on a strict reductionist view, we should indeed be less concerned about the future, or that we should aggregate across lives just as we do within them. This is not the consensus view, but it is a live position in population ethics and personal identity. If you want to stay in the Taurekian camp, you have to reject that move. You have to insist that the separateness of persons is a moral barrier that does not apply to the separateness of stages. Whether you ground that in psychology or just assert it as a moral primitive is up to you, but you cannot let the metaphysics of stages dissolve the moral unity of a life. If you do that, you lose Ada, and if you lose Ada, you have probably lost too much to make the theory viable. So hold the line on Ada, adjust the metaphysics of loss, and keep the coin flip.
