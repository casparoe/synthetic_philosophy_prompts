prompt: |-
  I do translation and questionnair localisation for survey instruments (mostly market research, but I've done a handful of academic ones), and I read philosophy blogs for fun, so I keep running into the cross-cultural vignette studies: you tell people a short story and ask something like "did he really know, or did he only think he knew", and then you compare answer rates between two countries — the one where people mostly give the answer philosophy professors give, and the one where they mostly don't.

  Here's the pattern I keep noticing and don't have a word for. In a chunk of the responses, from whichever group, people aren't answering the question that was asked. Ask "did he know" and they write back things like "you couldn't say that in court" or "for practical purposes you have to act as if he didn't" — they've turned a question about how things are into a question about what we should say, or what someone in that position should do. That much is boring. Three things make it look like something with a shape to me:

  1. It isn't spread evenly across respondents, it tracks the verdict. Nearly everyone who gives the minority answer is answering a question I didn't ask, while the people giving the majority answer mostly answer straight. So it can't just be noise that averages out across the sample.
  2. The off-target answers are often *good*. They cite considerations that are genuinely relevant to the original question, the sort of thing a philosopher would count as a reason. It's not confusion, and it's not failing to follow the story: comprehension checks come out fine.
  3. It shows up in both groups but lopsidedly. In the other group the minority-verdict people do it too, just less often and more vaguely. And I've seen the same shape in a completely different kind of case — the sort where someone uses a name they picked up second-hand and got the details wrong, and you ask who they're talking about.

  So the measured gap between groups seems to sit almost entirely inside the subpopulation who quietly switched the question, and if you coded only "did this person answer what was asked" the gap would shrink a lot but not vanish.

  Is there a name for this? I assume survey methodology has a term for an item meaning different things to different groups, but I don't know it, and I suspect it isn't quite my thing either, because here the switching is tied to the content of the answer rather than to which group someone is in.

  What I actually want is the carve, not a label. What is this, and what is it not — it isn't plain misunderstanding, it isn't translation failure, it isn't people being yea-sayers or picking the extreme option. Where are the boundary cases: someone who does answer the asked question but backs it with a "you couldn't say that" consideration; someone who answers both versions; someone whose off-target answer is just barely on target. And the bit I really can't settle: is this a confound to be screened or weighted away, or is it the datum — is what differs between the groups the verdict, or what they take the case to be *about*? If nothing established fits, coin a term and define it with its edges. Please don't just hand me a word or point me at papers to read.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Professional translator/localizer of survey instruments (market research + academic). Reads philosophy blogs. Familiar with cross-cultural vignette studies (experimental philosophy/x-phi).
      *   **The Phenomenon:** Respondents in vignette studies (e.g., "Did he know?") often answer a *different* question than the one asked (e.g., "What should we say?" or "What should we do?").
      *   **Key Characteristics:**
          1.  Correlates with the *verdict* (minority answers tend to be the ones answering the "wrong" question).
          2.  The answers are *good/relevant* (not confusion, not noise, philosophically substantive).
          3.  Cross-cultural asymmetry (happens in both groups but lopsidedly).
          4.  Replicates across different vignette types (knowledge vs. reference).
      *   **The Goal:** The user doesn't just want a label (though they ask if there is one). They want "the carve." They want to understand the *nature* of the phenomenon, its boundaries, and crucially, its methodological status (confound vs. datum).
      *   **Constraint:** "Please don't just hand me a word or point me at papers to read." (Needs synthesis, analysis, and conceptual framing).

  2.  **Deconstruct the Phenomenon:**
      *   It's not *measurement error* in the traditional sense (random noise).
      *   It's not *translation failure* (user is a pro, comprehension checks pass).
      *   It's not *acquiescence bias* (yea-saying).
      *   It *is* a shift in the *interpretive frame* or *conversational implicature*.
      *   The shift is systematic: It aligns with the minority verdict.
      *   The shift is pragmatic: It moves from *semantic/truth-conditional* ("Is it true?") to *pragmatic/normative* ("Is it appropriate to assert?").

  3.  **Search for Existing Concepts (and why they might fall short):**
      *   *Construct Validity:* Too broad.
      *   *Differential Item Functioning (DIF):* Close. This is when an item functions differently for different groups. But DIF is usually statistical detection, not necessarily this specific *pragmatic shift* mechanism.
      *   *Conversational Implicature:* Gricean. Relevant, but describes the mechanism, not the survey artifact.
      *   *Epistemic Contextualism:* Philosophical theory, not survey method.
      *   *Pragmatic Encroachment:* Philosophical theory (knowledge depends on stakes). Very relevant to the *content*, but is it the *methodological artifact*?
      *   *Response Bias:* Too generic.
      *   *Interpretive Repertoire:* Sociolinguistics.
      *   *Frame Switching:* Cognitive psych.

      *Decision:* There isn't a single perfect term in survey methodology that captures "systematic pragmatic reframing correlated with the minority verdict." The user suspects this. I need to validate that suspicion and then provide the "carve."

  4.  **Develop the "Carve" (Conceptual Framing):**
      *   **Core Concept:** This is **Pragmatic Reframing** or **Normative Displacement**.
      *   **Why it happens:** Vignettes ask metaphysical/semantic questions ("Is it Knowledge?") but real life demands pragmatic/normative judgments ("Can I blame him?", "Can I bet on it?").
      *   **The Asymmetry:** Why does it track the minority verdict?
          *   Hypothesis: The "Standard" (Professor) answer relies on holding the frame strict (semantic). The "Folk" answer often defaults to the practical frame.
          *   In Culture A, the default is Semantic. In Culture B, the default is Pragmatic.
          *   Therefore, Culture B looks like they "don't know" (or whatever the minority view is) because they are answering "Is it safe to act?"
      *   **Methodological Status:** Is it a bug or a feature?
          *   If the research question is "Who matches the professors?" -> It's a confound (noise in measurement of the specific construct).
          *   If the research question is "How do people conceptualize knowledge?" -> It's the datum (the difference *is* the concept).

  5.  **Drafting the Response - Section by Section:**

      *   **Acknowledge and Validate:** Confirm that standard survey terms (DIF, construct validity) are too blunt. Acknowledge the sophistication of the observation.
      *   **Naming the Phenomenon:** Propose a descriptive term. "Pragmatic Displacement" or "Normative Reframing." Let's go with **Pragmatic Displacement**. It captures the shift from "is" to "ought/use."
      *   **The Mechanism (The "Why"):** Explain *Gricean Relevance*. When you ask "Does he know?", the respondent asks "Why are you asking?" If the stakes in the story are high, the relevant answer is about action, not abstract truth.
      *   **The Asymmetry (The "Who"):** Why does it track the minority? Because the "Majority/Professor" view is usually the one that successfully suppresses the pragmatic context to isolate the semantic variable. The "Minority/Folk" view often integrates the context. If one culture integrates context more readily, they produce the "displaced" answers and the "minority" verdict simultaneously.
      *   **Boundary Cases (The "Carve"):**
          *   *Pure Semantic:* "Yes, facts match." (Professor style).
          *   *Pure Pragmatic:* "No, you can't bet." (Displaced).
          *   *Hybrid:* "Yes, but don't tell him." (Answered the question, added pragmatics).
          *   *Ambiguous:* "It depends." (Refusal to frame).
      *   **The Crucial Question (Confound vs. Datum):** This is the heart of the user's query.
          *   Argument for Confound: If you want to compare *semantic intuitions*, this is measurement error. You are measuring "willingness to assert" not "attribution of knowledge."
          *   Argument for Datum: If you want to compare *epistemic practices*, this is the finding. Knowledge *just is* tied to action for some groups. To screen it out is to impose the Professor's frame as the "correct" one.
      *   **Recommendation:** Don't screen it. Code it. Treat "Frame" as a variable.

  6.  **Refining the Tone:**
      *   Match the user's intellectual level (philosophy-literate, methodological savvy).
      *   Avoid academic jargon where possible, or define it if used.
      *   Be decisive. The user asked for a carve, not a literature review.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Call it "Contextualism." *Correction:* No, that's a philosophical theory. Call it "Pragmatic Displacement."
      *   *Initial thought:* Tell them to use DIF analysis. *Correction:* They know survey methods. DIF detects *that* it happens, not *what* it is.
      *   *Focus:* Make sure to address the "minority verdict" correlation. That's the most interesting part. Why do the "wrong" answerers answer the "wrong" question? Because the "right" answer requires abstraction.
      *   *Check constraints:* Did I point to papers? No. Did I just give a word? No.

  8.  **Final Polish:** Structure with clear headings. Ensure the "Confound vs. Datum" section is robust. (This aligns with the "Experimental Philosophy" debates about competence vs. performance, but framed through localization).

      *(Self-Correction on the "Name"):* The user asked "Is there a name?" I should answer that honestly first. There isn't a *single* standard term, but "Differential Item Functioning" is the statistical cousin, and "Pragmatic Implicature" is the linguistic cousin. I will synthesize these into a working label for their specific context. Let's call it **Construct-Frame Drift**. Or **Pragmatic Reframing**. Let's stick with **Pragmatic Reframing** as it's more descriptive of the cognitive act.

      *Wait, one more nuance:* The user mentions "the one where people mostly give the answer philosophy professors give." This implies the "Professor" answer is the baseline. I need to challenge that gently. The "Professor" answer is just the *Abstract Semantic* frame.

      *Final Plan:*
      1. Validate: No single term, but here's the conceptual space.
      2. Define: **Pragmatic Reframing**.
      3. Explain the Asymmetry (Abstraction cost).
      4. Boundary Cases.
      5. The Verdict (Confound vs. Datum).

      *Let's write.*
answer: |-
  You are describing a phenomenon that sits at the intersection of psychometrics, pragmatics, and experimental philosophy. There is no single standard term in survey methodology that captures the specific *shape* you are seeing (correlated with the verdict, substantive rather than noisy, cross-cultural).

  The closest statistical term is **Differential Item Functioning (DIF)**, which flags when an item measures different latent traits in different groups. But DIF is a diagnostic statistic, not an explanation. It tells you the item is biased, not *why*.

  The closest linguistic term is **Conversational Implicature** (Grice), specifically a violation of the Maxim of Relation. When you ask "Does he know?", the respondent infers "Why is this relevant?" and answers the inferred question ("Is it safe to act?").

  Since you want the carve and not just a label, I propose we call this **Pragmatic Reframing**.

  Here is the breakdown of what it is, why it tracks the minority verdict, where the boundaries lie, and how to treat it methodologically.

  ### 1. The Mechanism: Why it tracks the minority verdict
  You noted that the "off-target" answers cluster heavily among the minority verdict (the non-professor answer). This is not accidental. It is a feature of **abstraction cost**.

  *   **The Asked Question** ("Did he know?") is a *semantic/metaphysical* query. It requires the respondent to isolate a specific cognitive relation (justified true belief, or whatever) from the surrounding social context.
  *   **The Reframed Question** ("Could you say that in court?") is a *pragmatic/normative* query. It integrates the cognitive relation with stakes, consequences, and social norms.

  For most respondents, the pragmatic frame is the **default**. Human cognition is geared toward action and social coordination, not ontological categorization. To answer the "asked" question, a respondent must actively *suppress* the pragmatic context.

  **The Asymmetry Explanation:**
  The "Professor" answer (the majority in academic samples) is the one that successfully suppresses the pragmatic context. Therefore, the group that answers "like the professors" is, by definition, the group that *didn't* reframe. The group that gives the "minority" verdict is often the group that accepted the pragmatic frame.

  If Culture A treats knowledge claims as inherently tied to action (high pragmatic integration) and Culture B treats them as descriptive states (low pragmatic integration), Culture A will produce more Pragmatic Reframing. Consequently, Culture A will also produce the "minority" verdict. The reframing isn't just correlated with the verdict; it is the *mechanism* producing the verdict.

  ### 2. The Boundaries: Coding the Carve
  You asked for the boundary cases. If you are coding open-ended responses or designing follow-ups, here is how you distinguish the zones:

  *   **Pure Semantic (The "Professor" Frame):**
      *   *Response:* "Yes, because the facts were true and he saw them."
      *   *Status:* Answers the asked question. Ignores stakes.
      *   *Boundary:* Even if they mention stakes ("He saw it, even though it was risky"), as long as the verdict relies on the truth-condition, they are in this bucket.

  *   **Pure Pragmatic (The Displacement):**
      *   *Response:* "No, because he couldn't prove it." / "You can't really say he knows."
      *   *Status:* Answers a different question (assertibility conditions vs. truth conditions).
      *   *Boundary:* Look for modal verbs of permission/obligation ("should," "could," "allowed") replacing modal verbs of possibility ("might," "must" in the logical sense).

  *   **The Hybrid (The Edge Case):**
      *   *Response:* "He knows, but he shouldn't say he does."
      *   *Status:* Answers the asked question, but qualifies it with the reframed consideration.
      *   *Methodological Treatment:* Count this as **Semantic**. They successfully distinguished the state of knowledge from the propriety of assertion. This is the crucial boundary. If they separate the two, they haven't reframed the construct; they've just added context.

  *   **The Refusal (The Hard Edge):**
      *   *Response:* "It depends on what you mean by know."
      *   *Status:* Rejects the frame entirely.
      *   *Methodological Treatment:* This is missing data. They are pointing out the ambiguity you are trying to measure.

  ### 3. Confound or Datum?
  This is the critical methodological decision. Is Pragmatic Reframing noise to be screened, or the signal itself?

  **Argument for Confound (Measurement Error):**
  If your research question is *"Do Group A and Group B have different intuitions about the concept KNOWLEDGE?"*, then Pragmatic Reframing is a confound.
  *   **Why:** You are trying to measure a semantic construct. If Group B answers a normative question, you are comparing apples (semantics) to oranges (norms). The gap isn't in their concept of knowledge; it's in their interpretation of the survey task.
  *   **Action:** You must screen these responses. You can use the "Hybrid" category as a comprehension check. If they can distinguish "knows" from "should say," they are valid. If they conflate them, they are measuring "assertibility," not "knowledge." You would weight or exclude the Pure Pragmatic group to isolate the semantic intuition.

  **Argument for Datum (Construct Validity):**
  If your research question is *"How do Group A and Group B deploy epistemic concepts in reasoning?"*, then Pragmatic Reframing is the datum.
  *   **Why:** In many philosophical traditions (and likely many cultures), "knowledge" is *not* a purely semantic state. It is a status that licenses action. To separate "knowing" from "acting on it" is an artificial abstraction imposed by the researcher (and the philosophy professors). If Group B refuses to separate them, that *is* their concept of knowledge.
  *   **Action:** Do not screen. Code the "Frame" as a variable. Your result is not "Group B knows less," but "Group B has a higher threshold for pragmatic integration in epistemic attribution." The gap *is* the finding.

  ### 4. The Recommendation
  Given your background in localization and the nature of cross-cultural work, I argue for the **Datum** approach, with a specific coding adjustment.

  Treating it as a confound assumes the "Professor Frame" (pure semantics) is the universal standard of competence, and the "Folk Frame" (pragmatic) is a performance error. In cross-cultural work, that is a dangerous assumption. It privileges the WEIRD (Western, Educated, Industrialized, Rich, Democratic) academic style of decontextualized reasoning as the "correct" way to process the vignette.

  **The Solution: Two-Stage Coding**
  Don't just code the Verdict (Yes/No). Code the **Frame**.
  1.  **Verdict:** Yes / No / Unsure.
  2.  **Frame:** Semantic / Pragmatic / Hybrid.

  **Analysis:**
  *   Compare Verdicts *within* Frames. (Do Culture A and Culture B differ when both are using the Semantic frame?)
  *   Compare Frames *between* Cultures. (Is Culture A more likely to use the Pragmatic frame?)

  **Why this works:**
  If the cultural gap vanishes when you control for Frame, you have proven that the difference is not about *knowledge*, but about *conversational norms*.
  If the gap persists even within the Semantic frame, you have found a genuine difference in epistemic intuition.
  If the gap is entirely in the Frame distribution, you have found a difference in **Epistemic Style**.

  ### Summary Definition
  **Pragmatic Reframing:** A systematic response pattern in vignette studies where respondents substitute a normative or action-oriented query (e.g., "Is it appropriate to act?") for the requested semantic query (e.g., "Is it true?"). It is distinguished from confusion by the coherence and relevance of the justification, and from measurement error by its strong correlation with the minority verdict. It indicates that the respondent treats the target concept as inherently context-sensitive rather than abstract.

  **Verdict:** It is not noise. It is a difference in **construct operationalization** by the respondent. If you screen it out, you are not cleaning the data; you are enforcing a specific philosophical framework onto a population that may not share it. Code it, don't delete it.
