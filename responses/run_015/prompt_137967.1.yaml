      *   *The "Swapped-Side" Test:* This is essentially checking for *persuasion bias* vs. *truth-tracking*. If Model A wins regardless of whether it's defending "Vulnerable" or "Secure," it's good at debating, not necessarily good at finding truth. If accuracy drops when swapping, it suggests the models are exploiting specific positional advantages or the judge has a bias.

