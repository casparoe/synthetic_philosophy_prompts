  *(Self-Correction on the "Individuals vs Classes" point)*: I need to be careful here. If species are individuals (Ghiselin), they aren't natural kinds. This affects how we treat "laws" about species. I should frame this as a requirement for the concept to be compatible with *one* coherent ontology, even if we debate which one. Actually, the prompt asks me to take seriously "what the concept owes to the claim that species are individuals." I will frame this as "Ontological Consistency."

  *(Self-Correction on "Jointly Unsatisfiable")*: The classic trilemma is usually Universality, Monophyly, and Ancestry/Reticulation. Or Universality, Discreteness, and Evolutionary Gradualism. I will focus on the tension between **Universality**, **Discreteness**, and **Evolutionary Realism** (acknowledging reticulation/gradualism).

