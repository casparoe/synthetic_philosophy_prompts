answer: |-
  This is a strategically sound move. Much of the species literature is indeed a dialogue of the deaf because proponents of the Biological Species Concept (BSC) are optimizing for *process* (what holds a lineage together), while proponents of the Phylogenetic Species Concept (PSC) are optimizing for *pattern* (how we diagnose lineages), and both claim to be defining the *same thing*.

  Below is a draft of the desiderata for your chapter. It is structured to distinguish between biological constraints, epistemic constraints, and metaphysical constraints, followed by an analysis of their incompatibility and a brief scorecard.

  ***

  # Desiderata for an Adequate Species Concept

  To adjudicate between rival concepts, we must first distinguish between what a species concept must *be* (ontological adequacy), what it must *explain* (empirical adequacy), and what it must *allow us to do* (epistemic adequacy).

  ### 1. Empirical Adequacy (The "Scope" Requirement)
  *   **The Requirement:** The concept must apply to the full range of biological diversity without excluding major modes of life by definition.
  *   **The Motivating Case:** The **Bdelloid Rotifer** and **Prokaryote** problem. Any concept defining species via reproductive isolation (like the BSC) categorically excludes obligately asexual lineages. Similarly, the **Hybridization** problem: in many plant groups (e.g., oaks, *Helianthus*) and some animal groups (e.g., cichlids), distinct lineages exchange genes upon secondary contact without collapsing into a single homogenous pool. A concept that treats all hybridization as evidence of "one species" fails to capture the evolutionary independence of these lineages.
  *   **Status:** **Non-Negotiable.** A concept of *biological* species that excludes biology (asexuals, bacteria) is not a general concept; it is a local heuristic.

  ### 2. Theoretical Consistency (The "Mechanism" Requirement)
  *   **The Requirement:** The concept must be consistent with the population-genetic and evolutionary mechanisms known to generate and maintain biodiversity.
  *   **The Motivating Case:** **Gradualism and Ring Species.** Evolution is a continuous process. In ring species (e.g., *Ensatina* salamanders), population A mates with B, B with C, but A does not mate with C. A concept demanding sharp, binary boundaries contradicts the continuous nature of gene flow and divergence. Furthermore, the concept cannot posit a "species force" distinct from known evolutionary forces (drift, selection, mutation, migration).
  *   **Status:** **Non-Negotiable.** If the concept requires biological mechanisms that do not exist (e.g., a sudden switch from "variety" to "species"), it is metaphysically inflationary.

  ### 3. Epistemic Access (The "Taxonomist" Requirement)
  *   **The Requirement:** The concept must allow for the identification of species units using available evidence (morphology, DNA, ecology) within a reasonable timeframe.
  *   **The Motivating Case:** **The Museum Drawer.** A taxonomist cannot observe mating compatibility in extinct fossils, preserved specimens, or cryptic microbes. They rely on morphological distinctness or DNA barcodes. If a concept defines species by a process (e.g., "potential interbreeding") that is unobservable in the relevant context, it renders the concept scientifically idle for classification purposes.
  *   **Status:** **Negotiable (with caveats).** There is a distinction between the *ontology* of species (what they are) and the *diagnosis* of species (how we find them). However, a concept that makes identification *in principle* impossible (e.g., requiring knowledge of all future evolutionary trajectories) is pragmatically useless. This is a constraint on utility, not necessarily truth.

  ### 4. Discreteness (The "Countability" Requirement)
  *   **The Requirement:** The concept must yield units that are sufficiently discrete to be counted and named without arbitrariness.
  *   **The Motivating Case:** **Conservation and Biodiversity Metrics.** If species boundaries are entirely fuzzy or subjective, counting species for the IUCN Red List or measuring biodiversity gradients becomes an exercise in stipulation rather than discovery. We need species to be individuals or natural kinds that can be enumerated.
  *   **Status:** **Prejudice.** This is likely a cognitive demand imposed by human classification systems rather than biological reality. Nature is often fuzzy; insisting on sharp boundaries may force us to "carve nature at joints" that do not exist.

  ### 5. Ontological Coherence (The "Individuality" Requirement)
  *   **The Requirement:** The concept must commit to a coherent ontological status (e.g., species as historical individuals vs. species as natural kinds/classes) and remain consistent with it.
  *   **The Motivating Case:** **Ghiselin/Hull Thesis.** If species are individuals (spatiotemporally restricted historical entities), they cannot have essential properties, and laws of biology cannot be "about" species in the same way laws of physics are about electrons. If a concept treats species as classes (defined by shared properties) but then discusses their birth/death as historical events, it is ontologically inconsistent.
  *   **Status:** **Non-Negotiable (Internally).** The concept does not have to choose "Individual" over "Class," but it cannot equivocate between them.

  ### 6. Universality (The "One Size Fits All" Requirement)
  *   **The Requirement:** There should be a single definition of species that applies to all life (bacteria, protists, plants, animals).
  *   **The Motivating Case:** **Linnaean Ambition.** The desire for a unified theory of biodiversity.
  *   **Status:** **Prejudice.** This is the most suspect desideratum. It assumes that the term "species" picks out a single natural phenomenon across the tree of life. Given the radical differences in how bacteria evolve (HGT) versus mammals (vertical descent), assuming a single underlying reality may be a category error.

  ***

  # The Incompatibility Thesis: Where the Desiderata Break

  The species problem persists not because we lack cleverness, but because a subset of these desiderata is **jointly unsatisfiable**. Specifically, you cannot simultaneously satisfy **Empirical Adequacy**, **Discreteness**, and **Universality** given our current understanding of evolutionary theory.

  1.  **Universality + Empirical Adequacy $\rightarrow$ Loss of Discreteness.**
      If you demand a concept that works for asexuals, sexuals, and hybridizing plants (Empirical Adequacy) and applies to all of them (Universality), you are forced to define species as segments of lineages. However, because evolution is gradual and reticulate (Empirical Adequacy), lineage segments do not always have sharp boundaries. To maintain Universality and Empirical Adequacy, you must accept fuzzy boundaries, violating Discreteness.

  2.  **Discreteness + Universality $\rightarrow$ Loss of Empirical Adequacy.**
      If you demand sharp, countable units (Discreteness) across the board (Universality), you must impose arbitrary cutoffs on continuous variation. This forces you to ignore or misrepresent the biological reality of ring species, hybrid zones, and clinal variation, violating Empirical Adequacy.

  3.  **Discreteness + Empirical Adequacy $\rightarrow$ Loss of Universality (Pluralism).**
      If you demand sharp units that reflect biological reality, you may succeed in mammals (using BSC) and in asexuals (using PSC), but you cannot use the *same definition* for both. You must accept **Species Pluralism**: the word "species" refers to different theoretical entities in different domains of life.

  **Conclusion on Desiderata:** The requirement for **Universality** is the primary source of the paradox. It is a philosophical prejudice inherited from essentialism and Linnaean taxonomy, not a biological necessity. Dropping Universality resolves the tension between Discreteness and Empirical Adequacy, allowing for domain-specific concepts that are theoretically consistent within their scope.

  ***

  # Brief Scorecard of Contenders

  The following table evaluates how the major concepts fare against the non-negotiable desiderata. Note that "Pass" indicates the concept handles the constraint well; "Fail" indicates a structural inability to accommodate it.

  | Desideratum | Biological (BSC) | Phylogenetic (PSC) | Morphological (MSC) | Ecological (ESC) | Cohesion |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Empirical Adequacy** (Asexuals/Hybrids) | **Fail** (Excludes asexuals; struggles with hybridization) | **Pass** (Applies to all genealogies) | **Pass** (Phenotype exists everywhere) | **Pass** (Niche exists everywhere) | **Pass** (Broadly defined) |
  | **Theoretical Consistency** (Mechanism) | **Pass** (Grounded in gene flow) | **Pass** (Grounded in ancestry) | **Fail** (Phenotype $\neq$ Lineage; convergent evolution) | **Pass** (Grounded in selection) | **Pass** (Integrates mechanisms) |
  | **Epistemic Access** (Identification) | **Fail** (Hard to test isolation; impossible for fossils) | **Pass** (DNA/Clades are diagnosable) | **Pass** (Immediate observation) | **Mixed** (Niche hard to measure) | **Mixed** (Mechanisms hard to measure) |
  | **Ontological Coherence** | **Pass** (Treats species as individuals) | **Pass** (Treats species as individuals) | **Fail** (Often implies essentialism/classes) | **Pass** (Treats species as individuals) | **Pass** (Treats species as individuals) |
  | **Universality** | **Fail** | **Pass** | **Pass** | **Pass** | **Pass** |

  **Commentary:**
  *   **BSC:** Theoretically robust for sexual animals but fails the Empirical Adequacy test globally. It is a local concept masquerading as a universal one.
  *   **PSC:** Satisfies Universality and Empirical Adequacy but risks violating Discreteness by oversplitting (every monophyletic group becomes a species) and struggles with reticulation (networks vs. trees).
  *   **MSC:** Epistemically useful but theoretically shallow; it confuses the *sign* of a species with the *cause*.
  *   **Cohesion/ESC:** Attempts to bridge the gap but often lacks the operational sharpness of the PSC or the mechanistic clarity of the BSC.

  **Final Verdict for the Thesis:** The scorecard suggests that no single concept satisfies all non-negotiable desiderata simultaneously. The BSC fails Empirical Adequacy; the PSC threatens Discreteness; the MSC fails Theoretical Consistency. This supports the argument that **Universality** must be jettisoned. A pluralistic approach, where the "job description" varies by taxonomic domain, is the only way to satisfy the non-negotiable constraints of Empirical Adequacy and Theoretical Consistency.
