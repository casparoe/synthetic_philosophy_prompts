answer: |-
  Here is the diagnosis: **This is not a verbal dispute; it is a substantive clash about the ontology of norms.** Specifically, it is a conflict between **epistemic grounding** (Lewis) and **causal grounding** (Evolutionary Game Theory). The literature is stalled because philosophers keep trying to reduce one to the other, assuming they are describing the same phenomenon at different levels of abstraction. They are not.

  Here is the defense of that position, followed by the concrete move that breaks the stalemate.

  ### 1. The Diagnosis: Reasons vs. Forces
  The core error in the literature is the assumption that Evolutionary Game Theory (EGT) is just "Lewisian dynamics." This is false.
  *   **Lewisian Convention** is constituted by *reasons*. For a regularity to be a Lewisian convention, agents must conform *because* they expect others to conform, based on a system of beliefs (common knowledge). The stability of the norm is internal to the agents' cognitive states.
  *   **Evolutionary Convention** is constituted by *forces*. Stability is external to the agents. It resides in the payoff structure and the selection dynamics (replicator dynamics, learning rules). Agents do not need to know *why* they are conforming; they only need to be punished for deviating.

  The "stall" exists because Lewis's account is **constitutively incapable** of explaining norm evolution without smuggling in evolutionary assumptions, while EGT is **constitutively incapable** of explaining normativity (the "ought") without smuggling in rationalistic assumptions.

  ### 2. The Smoking Gun: Latent Conventions
  You identified the "latent convention" as the middle ground. It is actually the wedge that splits the two accounts.
  *   **In EGT:** A latent convention is simply an equilibrium with a large **basin of attraction**. It exists as a structural feature of the payoff landscape. The population can be far away from it, but the "pull" exists objectively in the math of the system. No agent needs to conceive of it.
  *   **In Lewis:** A latent convention requires **counterfactual common knowledge**. For a norm to be "latent" in a Lewisian sense, agents must currently possess the reasoning capacity to simulate the new equilibrium *before* it happens.

  This is a substantive divergence, not a verbal one. If a norm shifts because the payoff structure changed slowly and agents drifted into a new basin without ever explicitly reasoning about the change (e.g., gradual shifts in driving habits or linguistic pronunciation), **Lewis's account fails.** It requires a cognitive leap (re-evaluating common knowledge) that the agents did not perform. EGT captures this; Lewis does not.

  Conversely, if a norm shifts because a focal point became salient and agents *reasoned* their way to a new coordination (e.g., a sudden agreement to use a new digital platform), **EGT is too slow.** It models the drift, but misses the intentional jump.

  ### 3. Why "Just Bolted On" is Wrong
  The claim that EGT models are "just Lewisian equilibria with mutation and selection bolted on" is a category error. It assumes that the *endpoint* (the equilibrium) is the only thing that matters. But Lewis's project was not just to identify equilibria; it was to explain **compliance**.
  *   Lewis asks: "Why do *I* follow this rule?" Answer: "Because I know you know..."
  *   EGT asks: "Why does this *pattern* persist?" Answer: "Because deviators get weeded out."

  If you treat them as the same, you cannot explain **bad norms**. Lewisian agents, being rational, should theoretically coordinate on the payoff-dominant equilibrium (unless trapped by history). Evolutionary agents can get locked into payoff-*dominated* equilibria (risk-dominant) simply because the basin of attraction is deeper. If real-world norms often stick around despite being inefficient (which they do), the Lewisian rationalistic model is empirically inadequate for explaining *stability*, while the EGT model is empirically inadequate for explaining *justification*.

  ### 4. What Moves the Needle
  Do not look for a formal result showing evolutionary dynamics can't reach certain equilibria; we already know the math. Do not admit the question is ill-posed; the phenomenon of norm change is real.

  **The needle-mover is a Conceptual Distinction that forces an Empirical Adjudication.**

  We must stop using the word "Convention" univocally. We need to distinguish between:
  1.  **Intentional Conventions:** Stabilized by mutual belief and reasoning (Lewisian).
  2.  **Functional Conventions:** Stabilized by selection pressures and behavioral reinforcement (Evolutionary).

  **The Concrete Test:**
  The field needs to pivot to **cognitive load tracking during norm shifts.**
  *   **Hypothesis A (Lewis):** During a norm shift, agents will exhibit high cognitive engagement, explicit signaling, and reasoning about others' expectations. (Shifts track *salience cues*).
  *   **Hypothesis B (EGT):** During a norm shift, agents will exhibit low cognitive engagement, mimicking local majorities, and reacting to payoff feedback without understanding the global structure. (Shifts track *payoff frequencies*).

  **The Verdict:**
  If you want to resolve the stall, you must argue that **most real-world norms are Functional, not Intentional.**
  Lewis's account is a special case—a high-cognition idealization that applies to explicit agreements (like driving on the right vs. left, or standardizing software protocols) but fails for deep social norms (like gender roles, etiquette, or moral taboos) which evolve slowly, often against individual rationality, and persist without common knowledge.

  **Definite Position:**
  The disagreement is substantive. Lewis provides a theory of **Rational Compliance**, while Evolutionary models provide a theory of **Behavioral Stability**. They are not competing answers to the same question; they are answers to different questions that have been conflated under the header "Convention."

  **To move the needle:** Stop trying to save Lewis from the evolutionary critique. Accept that Lewisian convention is a **subset** of evolutionary equilibrium (the subset where cognitive capacity is high enough to simulate counterfactuals). The research program should not be "How do we make Lewis dynamic?" but "Under what cognitive conditions does a Functional Convention become an Intentional one?" That is the only empirical question that matters.
