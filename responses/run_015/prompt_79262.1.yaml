answer: |-
  You have identified a genuine gap in the standard taxonomy of decision theory. The standard literature treats the "Sunk Cost Fallacy" (SCF) as a binary: either you ignore the past (rational) or you let the past dictate the future (irrational). Your three cases demonstrate that the past can *transform* the present decision landscape without dictating the decision itself.

  The difference is not in the reason cited (all three cite the future), nor strictly in the counterfactual (all three admit they wouldn't start today). The difference is located in the **Cost of Discontinuity**.

  In the textbook Fallacy, the cost of stopping is identical to the cost of continuing regarding the past expenditure; the money is gone either way. The agent continues *because* the money is gone.
  In your three cases, the past expenditure has **endogenously created a new cost to stopping** that did not exist at $T=0$. The agent continues *despite* the money being gone, because stopping now triggers a penalty that starting would not have.

  Here is the carving you are looking for, the nearest existing discussions, and a proposed term.

  ### 1. The Carving: Justification vs. Transformation

  The distinction lies in how the sunk cost enters the equation.
  *   **The Fallacy (Past as Justification):** The agent treats the sunk cost as a *benefit* to be recovered. "I must continue to make the past spend worth it." This is magical thinking; the spend is not recoverable.
  *   **Your Shape (Past as Transformation):** The agent treats the sunk cost as a *constraint* that alters the utility of future options. "Because I have spent X, the value of continuing is $V_c$ and the value of stopping is $V_s$, where $V_s$ includes a penalty generated by X."

  In all three of your instances, the sunk cost has created **Real Switching Costs**.
  *   **The Book:** The switching cost is the degradation of a meta-habit (the policy of finishing). The cost of stopping is not the lost years, but the damage to the *rule* that protects future projects.
  *   **The Rail:** The switching cost is reputational capital. The cost of stopping is not the lost concrete, but the increased pricing on *future* contracts.
  *   **The Russian:** The switching cost is specific human capital. The cost of stopping is not the lost study time, but the atrophy of a skill that makes the *next* two years more valuable than two years in a new language.

  ### 2. The Name: Hysteresis of Commitment

  There is no single canonical name for this specific shape, but the nearest technical concept is **Hysteresis**.

  In physics and economics, hysteresis describes a system where the state of the object depends on its history. A magnetic metal remains magnetized after the field is removed; a worker who is unemployed for a long time becomes unemployable even if demand returns. The history of the system changes its current parameters.

  Applied to agency, I propose the term **Hysteresis of Commitment**.
  *   **Boundary:** It fits where the prior investment alters the *physics* of the current choice (reputation, skill, habit).
  *   **Edge:** It stops fitting when the "cost of stopping" is purely emotional (regret, shame) without instrumental consequence. If the friend keeps writing the book *only* to avoid the feeling of guilt, that is the Fallacy. If she keeps writing to preserve the habit of discipline, that is Hysteresis.

  An alternative descriptive term is **The Abandonment Surcharge**. This highlights that stopping now costs *more* than stopping would have cost at the start.

  ### 3. Analysis of Your Instances

  **Instance 1: The Policy (The Book)**
  *   **Discussion:** This aligns with **Michael Bratman's Planning Theory of Intention** (*Intention, Plans, and Practical Reason*, 1987). Bratman argues that intentions are not just desires; they are plan-states that resist reconsideration to reduce deliberation costs and ensure coherence.
  *   **The Carving:** The "never quit" policy is a **Pre-commitment Device** (Thomas Schelling). The rationality is *ex ante*. The agent accepts a localized loss (the bad book) to secure a global gain (the disposition to finish).
  *   **The "Never Quit" Man:** He is inside your pattern *if* the policy is a calculated heuristic to combat optimism bias or procrastination. He is outside (committing the Fallacy) if the policy is dogmatic and he cannot articulate the meta-benefit. The difference is whether he views the loss as an **insurance premium** (rational) or a **debt repayment** (fallacy).

  **Instance 2: The Reputation (The Rail)**
  *   **Discussion:** This is **Signaling Theory** and **Reputational Bonding**. It is discussed in contract theory and political economy (e.g., **Albert Hirschman's *Exit, Voice, and Loyalty***, though he focuses on the response to decline).
  *   **The Carving:** The sunk cost has created a **Liability of Expectation**. The city is not paying for the rail; it is paying for the *credibility* that allows future rails to be built cheaply. The sunk cost is the entry fee to a credible equilibrium.

  **Instance 3: The Competence (The Russian)**
  *   **Discussion:** This is standard **Human Capital Theory** (Gary Becker). It is the only case that is technically "Synchronic Rationality" (rational at this exact moment) rather than "Diachronic Rationality" (rational across time).
  *   **The Carving:** The outsider commits the **Reference Class Error**. They compare the agent to a "newcomer," but the agent is not a newcomer. The sunk cost has created **Specific Asset Accumulation**. The past is not a reason; it is a *productive asset*.

  ### 4. Are They One Phenomenon?

  They are two phenomena united by a common structure.
  *   **Cases 2 & 3 (Rail/Russian)** are **Instrumental**: The past investment yields a tangible future dividend (cheaper contracts, higher fluency). This is straightforwardly rational and often misidentified as SCF by observers who ignore the changed baseline.
  *   **Case 1 (Book)** is **Constitutive**: The past investment yields a *structural* dividend (integrity of agency). This is more fragile. It relies on the agent's psychology. If the agent is lying to herself about the "policy," it collapses into the Fallacy.

  The unifying thread is **Diachronic Rationality**. The standard SCF model assumes a "slice" of time (should I invest $100 now to get $50?). Your model assumes a "stream" of time (does stopping now break the stream in a way that makes future streams less valuable?).

  ### 5. Where the Existing Discussions Stop

  *   **Sunk Cost Fallacy (Arkes & Blumer, 1985):** Stops fitting because it assumes the past cost has *zero* marginal utility. In your cases, the past cost has *negative* marginal utility for stopping (it makes stopping expensive).
  *   **Escalation of Commitment (Staw, 1976):** Usually presumes irrationality/psychological entrapment. It fails to distinguish between "throwing good money after bad" (Fallacy) and "spending money to protect reputation" (Strategy).
  *   **Path Dependence (David, 1985):** Fits well, but is usually macro-structural (QWERTY keyboards). It lacks the *agency* component of the "Book" case.
  *   **Planning Agency (Bratman):** Fits the "Book" case perfectly but doesn't account for the external reputational costs of the "Rail" case.

  ### 6. Summary Definition

  If you require a label for this carving, I suggest:

  **The Rationality of Irreversibility**
  or
  **Hysteresis of Commitment**

  **The Boundary Condition:**
  The line between this shape and the Fallacy is crossed when the **Cost of Discontinuity** becomes imaginary.
  *   *Rational:* "If I stop, I lose my reputation/skill/habit." (Verifiable consequence).
  *   *Fallacy:* "If I stop, the time I spent was wasted." (Emotional consequence).

  The man whose policy is "never quit" is inside your pattern if he acknowledges that the policy is a tool to minimize *total* lifetime quit-costs, accepting that it will occasionally force him to finish a worthless project. He is purchasing **Option Value** on his own future reliability. If he cannot articulate that trade-off, he is merely trapped.

  You are describing **Second-Order Rationality**: actions that are suboptimal in the first order (finish the bad book) but optimal in the second order (maintain the self-concept of a finisher). The sunk cost is the premium paid for that second-order stability.
