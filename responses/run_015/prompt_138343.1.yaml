answer: |-
  The setup
  Divide class into eight pairs. Each pair acts as a committee deciding if applicant Alex qualifies for a "Household Subsidy." The pivotal term is "Dependent." Alex is 22, lives with parents, pays partial rent, files taxes separately. One student plays the Budget Officer (needs to limit payouts); the other plays the Welfare Advocate (needs to maximize support). They must output a single Yes/No verdict. Crucially, they cannot compromise on the verdict without agreeing on what "Dependent" means. They receive private cards detailing institutional incentives and preferred definition constraints. Incentives remain hidden initially.

  Rules and materials
  Materials: Case file (Alex's financials), Role Cards (Officer/Advocate), Definition Menus (3 options: Financial Reliance, Residential Co-location, Legal Tax Status).
  1. Read case and private card silently. Do not show cards yet.
  2. Argue for Yes/No based on your private incentive.
  3. If stuck, you may reveal cards. You will see you agree on all non-semantic facts (income, residence).
  4. To finalize a verdict, you must select one Definition from the Menu together.
  5. The chosen Definition determines the Yes/No outcome automatically.
  6. You cannot split the difference; one definition governs the case.
  7. If no agreement is reached in time, the subsidy is denied by default, and both receive a penalty.
  8. Individual success is measured by how closely the chosen Definition matches your private preference.
  9. Instructor calls time for reveal.
  10. You may not discuss your points total, only the definition's merits.

  Timeline
  0-5: Distribute materials, silent reading. Instructor emphasizes no card sharing.
  5-20: Round 1 Negotiation. Argue verdict without sharing cards. Instructor circulates, noting "fact" vs "meaning" claims on a pad.
  20-30: Card Reveal. Students realize factual agreement exists. Instructor calls time strictly.
  30-45: Round 2 Negotiation. Choose a Definition from the Menu. Discuss trade-offs.
  45-55: Reporting. Pairs state verdict and chosen definition. Instructor boards the definitions used for class view.
  55-75: Debrief. Connect game dynamics to metaphysical verbal disputes and conceptual ethics.
  Total: 75 minutes. Ensure strict timekeeping to preserve debrief space. Protect debrief time.

  Scoring
  Use participation points or hypothetical departmental "budget credits."
  Pair Bonus: +2 points if they reach any agreement.
  Individual Bonus: +3 points if the chosen Definition matches your Role Card's preference.
  Penalty: -2 points each if time expires without agreement.
  This creates a Prisoner's Dilemma structure: Cooperating (agreeing) saves the pair, but defecting (holding out for your definition) maximizes individual score. Mirrors coordination vs commitment tension. The "cost" is tangible within the game economy, simulating real-world stakes of classification.

  Debrief map
  Start by asking why Round 1 stalled. They argued facts, but cards reveal facts were identical. This isolates the dispute as verbal (a). They meant different things by "Dependent." Once definitions aligned, the Yes/No followed automatically. No first-order disagreement remained about Alex's income or housing.
  However, the argument didn't end. Why? Because choosing a definition has consequences. This is the gap: verbal disputes aren't trivial if concepts govern resources. This is conceptual ethics (b). Deflationism fails because the choice of language changes the world's normative structure.
  Map to ontology: Replace "Dependent" with "Exists." Mereologists agree on particles arranged table-wise. Disagree on whether composition occurs. Both are "right" relative to their conceptual scheme (quantifier variance). But choosing a scheme affects theory cost, explanatory power, and ideological commitment. The fight isn't about the world's structure, but which linguistic framework best serves our theoretical needs. The stakes are real, even if the disagreement is verbal.
  Students feel the other is wrong because schemes are threatened. In metaphysics, rejecting universalism isn't just semantic; it changes what theories you can build. The residual dispute is about which carvings of reality are useful, not which are true. The game forces you to feel the cost of coordination versus the cost of concession.
  Connect specifically to the "nothing at stake" intuition. Students often think verbal = pointless. Here, verbal = high stakes. The ontology lesson is that existence claims are often bids to privilege one conceptual framework over another, where the privilege carries practical and theoretical weight.

  What will go wrong
  Students may reveal cards immediately, skipping the phenomenology of confusion. Instruct them to wait. If they do, pause and reset to preserve the lesson.
  They might treat it as pure bargaining, ignoring the conceptual constraint. Emphasize that the Definition *dictates* the verdict.
  One definition might seem morally superior (Advocate), making the Officer look villainous. This obscures the structural point. Remind them both roles serve legitimate institutional functions.
  Time creep during negotiation will eat debrief time. Use a visible timer.
  Students might conflate "verbal" with "unimportant." The scoring penalty forces them to feel the cost of non-coordination.
  Some pairs may finish early and disengage. Have a secondary question ready: "Can you justify your definition to a third party?"

  What the game can't do
  It doesn't prove quantifier variance is true in metaphysics; it models the *structure* of such disputes.
  It doesn't tell us which concept *ought* to be chosen, only that choosing matters.
  It cannot simulate the emotional weight of real exclusion, only hypothetical point loss.
  It assumes participants value the points; if they don't, the stakes feel fake.
  It simplifies the complexity of natural language into a menu of three options.
  It doesn't capture the historical baggage or ideological weight real terms carry outside the classroom.
  Real conceptual ethics involves open-ended cultural negotiation.

  Where this design is most likely to fail
  If the payoffs (points) make the dispute substantive (moral/pragmatic), students may conclude the dispute *wasn't* verbal, just hidden. This undermines the lesson. Emphasize in debrief that the *facts* didn't change, only the labeling rule. The substantiveness lies in the *consequences of the label*, not the truth of the claim.
  If students feel the Officer's role is unethical, they won't see a symmetric conceptual choice.
  Ensure roles are symmetric.
