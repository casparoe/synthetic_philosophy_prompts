answer: |-
  Your gut is working really well here. You haven't just been reacting randomly; you're instinctively tracking a distinction that moral philosophers actually argue about (it's often called the problem of **"moral testimony"** or the **"division of moral labor"**).

  There is a principle that fits all four of your cases without you having to give any of them up. I'd call it the **Knowledge vs. Ownership Principle**.

  ### The Principle
  **It is fine to defer when the obstacle is *knowledge* or *emotional burden*. It is dodgy to defer when the obstacle is *character* or *accountability*.**

  In other words: You can outsource the *input* (facts, expertise, shared weight), but you cannot outsource the *output* (your integrity, your risk, your agency).

  ### How it fits your four cases

  1.  **Flatmate & Chicken (Fine)**
      *   **Obstacle:** Knowledge. You haven't done the research; she has.
      *   **Agency:** Eating chicken doesn't define your core character in a high-stakes way, and the consequence (animal suffering) is factual.
      *   **Verdict:** You are deferring on the *facts* of the supply chain, not abdicating your moral compass.

  2.  **GP & Life Support (Fine)**
      *   **Obstacle:** Knowledge + Burden. The GP knows the medical prognosis (fact), and she is sharing the emotional weight of a traumatic decision (burden).
      *   **Agency:** You aren't letting her decide "if life is valuable"; you are letting her inform you on "if this is living or suffering."
      *   **Verdict:** This is a fiduciary relationship. She has a duty of care to your dad, so she shares the accountability.

  3.  **Pub Bloke & Whistleblowing (Dodgy)**
      *   **Obstacle:** Accountability. If you grass up your boss, *you* face the fallout, not him.
      *   **Agency:** This requires courage and personal judgment about justice. A stranger has no skin in the game.
      *   **Verdict:** You are trying to outsource the *risk* and the *conviction*. That's abdicating agency.

  4.  **GP & CV Lying (Dodgy)**
      *   **Obstacle:** Character. Honesty is a personal virtue.
      *   **Agency:** The GP has no expertise in employment ethics, and she won't suffer the consequences if you get caught.
      *   **Verdict:** This is purely about *your* integrity. Deferring here suggests you don't want to own your own honesty.

  ---

  ### The Test Case: The AI & The Community Garden

  Now, let's run your flip-flopping case through the **Knowledge vs. Ownership Principle**.

  **The Scenario:** Letting an AI trained on ethicists decide how your community garden splits its donations.

  **1. Is the obstacle Knowledge?**
  *   *Argument for Yes:* Ethicists know theories of justice (utilitarianism, egalitarianism, etc.) better than gardeners might. The AI can process data without bias.
  *   *Argument for No:* Distributing donations in a *community* isn't just about math or theory; it's about context, relationships, and specific needs that an AI can't see.

  **2. Is the obstacle Accountability/Ownership?**
  *   *Argument for Yes:* If the AI makes a unpopular or harmful decision, who takes the blame? The AI can't feel guilt. The gardeners lose ownership of their community values.
  *   *Argument for No:* It saves time and argument.

  **The Verdict: It is Dodgy.**

  Here is why your gut is flip-flopping, and why the principle says "no":

  *   **The Trap:** It *looks* like the Chicken case (deferring to expertise/research). You might think, "Ethicists know morality better than I do."
  *   **The Reality:** It is actually the CV case (Character/Ownership). A community garden is built on *shared values*. The process of arguing about and deciding where money goes *is* the community building.
  *   **The Accountability Gap:** If the AI decides to give all the money to a controversial cause because the "ethics math" says so, the community fractures. But the AI doesn't care. By using the AI, the humans are hiding behind an algorithm to avoid the hard work of negotiating values together.

  **To make it "Fine":**
  You could use the AI as a **consultant** (like the GP on life support). Ask it: "Here are three options; what are the ethical pros and cons of each?"
  But you cannot make it the **decision-maker**. The moment the AI pulls the lever, you have outsourced the community's moral agency.

  ### Summary Checklist for Future Decisions

  If you're unsure whether to defer, ask these three questions:

  1.  **Do they know something I don't?** (Facts/Medical/Technical) -> *Lean towards Defer.*
  2.  **Do they share the consequences?** (Fiduciary/Partner/Friend) -> *Lean towards Defer.*
  3.  **Does this decision define who I am (or who we are)?** (Integrity/Courage/Community Values) -> *Lean towards Do Not Defer.*

  Your intuitions are spot on. You're willing to share the burden of *knowing*, but not the burden of *being*. Keep that distinction.
