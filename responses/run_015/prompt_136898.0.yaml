  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure I don't just say "trust your gut." The user wants the *rule* behind the gut.
      *   *Correction:* The "Better Idea" at 30k is the hardest nut. Why is it laziness? Because the "better idea" hasn't incurred the cost of friction yet. It's cheap. The current draft is expensive. We value what we suffer for? No, that's masochism. We value *proven viability*. The "better idea" is unproven. The current draft has proven viability (it got to 30k) but hit a wall. Hitting a wall is normal. Abandoning it for a path without walls (yet) is the error.
