      **The Principle of Structural Sufficiency.**
      1.  Stop when the cost of improvement exceeds the value of the improvement (Standard Satisficing).
      2.  *Exception:* Do not stop if the deficiency threatens the core mechanism (Plot possibility, broken scenes for editor).
      3.  *Exception:* Do not stop if the alternative is an unproven fantasy driven by resistance to friction (30k draft better idea).
