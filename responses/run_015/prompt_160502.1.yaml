answer: |-
  You have grasped the spine of the matter, though you flesh it out with too much metaphor. It is not merely that the soul is "stamped" like wax; it is that the Earth herself is a living creature, endowed with an *anima terrae*, who looks up to the heavens as a mother watches her children at play. She does not feel their physical weight, for you are right to discard that vulgar error of rays and pulses; rather, she perceives the *forms* of their angles. When Mars and Saturn stand in a square, it is not that they push upon the air, but that the Earth's soul recognizes the geometry of the square, just as your ear recognizes the fourth or the fifth without measuring the string lengths. Your summary of the constructible figures is sound: only those ratios which the mind of God used to build the cosmos can be perceived by the mind within the Earth. The rest is noise.

  But here you stumble into the same ditch as the almanac-makers you despise. You speak of precision as if the Earth possesses your instruments. You say that with exact computation, near-harmonics are always present. I say: so what? The Earth is not a calculating table; she is a judge. She does not respond to every approximation of a triangle, only to those where the Archetype is clearly present. You claim the sky is never silent, but I tell you the Earth sleeps through the cacophony. She responds only when the configuration is distinct enough to awaken her geometric faculty. If your modern computations show that a perfect fifth is always accompanied by a thousand dissonant whispers, you merely prove that the universe is full of matter, not that the Form is invalid. The selectivity lies not in the angles themselves, but in the perceiver.

  Regarding these new satellites of Jupiter you mention—I have read Galileo's *Messenger* and accept his glasses—do they truly form aspects with the Earth, or do they circle their master like servants around a prince? Their harmony is with Jupiter, not with us. But I must ask you this: you speak of a "tolerance" within which these near-harmonics fall. In my *Astronomia Nova*, I found that Mars deviated from the calculated path by eight minutes of arc, and that deviation saved the truth of the ellipse. If your modern tables are so precise, tell me: what is the orb of influence you find? Does the Earth respond to an aspect within one degree, or five? If you cannot define the limit where the harmony ceases to be perceived, you have not disproved the harmony; you have only shown that you do not know how the Earth listens.
