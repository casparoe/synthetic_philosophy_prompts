answer: |-
  ### The Failures We Are Engineering

  Before we talk about rules, let's be clear about the specific bruises I want these students to walk away with. If they leave smiling, I've failed.

  1.  **The Ruin of Arithmetic:** I want at least half the room to go "bust" (drop below £10) in the first phase despite playing a game with positive Expected Value (EV). They need to feel that *average outcome* $\neq$ *your outcome*.
  2.  **The Tournament Trap:** In the middle phase, I want the student who played "sensibly" (geometric growth) to watch a lunatic who went all-in every time take the prize. They need to feel the conflict between *surviving long-term* and *winning the room*.
  3.  **The Horizon Anxiety:** In the final phase, I want them to freeze. When they don't know when the game ends, the "long run" justification for their strategy evaporates. I want them to realise they've been relying on a promise of infinite time that the market never made.

  ---

  ### Mechanic Brainstorming

  **Option 1: The Card Deck.** Draw from a shuffled deck of 20 cards (10 win, 10 lose).
  *   *Pros:* Finite, countable risk.
  *   *Cons:* Card counting becomes the skill, not bet sizing. Too much noise.

  **Option 2: The Market Simulation.** Students trade against each other.
  *   *Pros:* Real social dynamics.
  *   *Cons:* 90 minutes is too short for price discovery. They'll spend 60 minutes arguing about rules.

  **Option 3: The Compounding Coin (Selected).**
  *   *Setup:* A binary gamble with positive arithmetic EV but negative geometric growth if bet fully.
  *   *Why:* It isolates the variable (bet sizing). It forces the math into their hands without complex trading. It creates the exact divergence between ensemble average (room wealth) and time average (individual wealth) required for the ergodicity lesson later.

  ---

  ### The Workshop Design: "The Ruin Game"

  **Audience:** 18 Undergrads (Maths/Econ/Phil).
  **Time:** 90 Minutes.
  **Materials:**
  *   18 "Wealth Trackers" (A4 sheets with a log-scale graph and calculation table).
  *   Play money (or just ledger entries). Let's use ledger entries to save shuffling time. Start wealth: **£1,000** (fictional).
  *   One large coin (or a projected random number generator).
  *   Prize: A £20 Amazon voucher or a nice bar of chocolate.

  **The Gamble:**
  *   **Coin Flip:** 50% Heads, 50% Tails.
  *   **Heads:** You win **60%** of your stake. (Multiplier: 1.6)
  *   **Tails:** You lose **50%** of your stake. (Multiplier: 0.5)
  *   **Unbet Cash:** Stays safe (Multiplier: 1.0).
  *   *Note:* The Arithmetic EV is positive ($0.5 \times 1.6 + 0.5 \times 0.5 = 1.05$). The Geometric Mean of a full bet is negative ($\sqrt{1.6 \times 0.5} = \sqrt{0.8} \approx 0.89$).

  #### Timeline

  **00:00 – 00:10: Setup & Instructions**
  *   Hand out trackers.
  *   Explain the gamble clearly. Write the multipliers on the board.
  *   **Rule:** You must write down your bet fraction *before* the flip. No changing mid-round.
  *   **Silence:** No talking strategies during play.
  *   **The Hook:** "This is a good game. On average, the bank pays out 5% per round. Your job is to not go home poor."

  **00:10 – 00:40: Phase 1 — The Long March (Fixed Horizon)**
  *   **Rounds:** 10 Rounds fixed.
  *   **Goal:** Maximise your final wealth.
  *   **Action:** I flip one coin for the room. Everyone records the result against their own stake.
  *   *Observation:* Watch the "All-In" players. After a Head-Tail sequence, they are at $1.6 \times 0.5 = 0.8$ of their starting wealth. They are losing money on a winning game.
  *   *Target:* By Round 10, the All-Ins should be down ~90%. The Kelly-optimal players (betting ~15-20%) should be up.

  **00:40 – 01:00: Phase 2 — The Sprint (Tournament Twist)**
  *   **Reset:** Everyone starts fresh with £1,000.
  *   **Rounds:** 5 Rounds fixed.
  *   **Goal:** **Winner Takes All.** The single person with the highest final wealth gets the prize. Second place gets nothing.
  *   **The Dilemma:** Betting 20% guarantees growth, but you won't beat the person who bets 100% and gets three Heads in a row. To win the room, you must accept a high risk of ruin.
  *   *Observation:* Most will hedge. One or two will go All-In. If an All-In player gets lucky, they win. If they bust, a conservative player wins by default. This creates genuine tension.

  **01:00 – 01:20: Phase 3 — The Fog (Indefinite Horizon)**
  *   **Reset:** Everyone starts fresh with £1,000.
  *   **Goal:** Maximise wealth.
  *   **Mechanic:** After every round, I flip a *second* coin.
      *   Heads: We play another round.
      *   Tails: The game ends immediately.
  *   **The Trap:** There is no "final round" strategy. You cannot coast. But the probability of the game continuing drops exponentially.
  *   *Observation:* Students will struggle to size bets. Do they bet aggressively to bank cash before the stop? Or conservatively to survive the potential long tail?

  **01:20 – 01:30: The Debrief (The Reveal)**
  *   **Step 1: The Graveyard.** Ask for a show of hands: "Who ended Phase 1 with less than £1,000?" (Likely 50%+). "Who went bust?"
  *   **Step 2: The Room Average.** Sum the total wealth of the room in Phase 1. Divide by 18. It will be *higher* than £1,000.
      *   *Point:* The *ensemble* (the room) made money. The *time average* (you) lost money.
  *   **Step 3: The Tournament.** Ask the winner of Phase 2 what their strategy was. It was likely "reckless".
      *   *Point:* Optimising for *rank* is different to optimising for *wealth*.
  *   **Step 4: The Vocabulary.** Now you can say the words.
      *   "You were maximising Arithmetic Mean in Phase 1 and got crushed by Volatility Drag."
      *   "The safe bet size is the **Kelly Criterion**, which maximises the **Geometric Mean** (log wealth)."
      *   "This difference between the room's average and your average is **Ergodicity**."

  ---

  ### What Will Predictably Go Wrong (And How to Fix It)

  **1. The Calculation Bottleneck**
  *   **Failure:** 18 students multiplying £1,243.50 by 1.6 on a phone calculator while you're trying to flip the next coin. The session drags. Boredom sets in.
  *   **Fix:** The "Wealth Tracker" handout must have pre-calculated zones or a nomogram. Better: Tell them to round to the nearest £10. Precision is the enemy of insight here. Or, provide a simple Excel sheet on a shared drive they can access on laptops if the room allows. *Recommendation:* Pen and paper, round to nearest £10. It feels more like a ledger.

  **2. The "Bad Luck" Excuse**
  *   **Failure:** In Phase 1, a student bets 20% (correctly) but gets 8 Tails in a row. They lose money and claim the strategy is broken.
  *   **Fix:** Pre-empt this. In the intro, say: "Variance will hurt you in the short run. Look at the median, not your neighbour." In the debrief, use the Room Average to show the *system* worked even if *they* didn't.

  **3. The Tournament Collusion**
  *   **Failure:** Two students agree to split the prize if one of them wins, allowing them to take opposite extreme risks to game the distribution.
  *   **Fix:** Explicitly forbid side-bets. "If I hear whispering, the prize is cancelled." Undergrads value the voucher more than the theory; use that leverage.

  **4. The Indefinite Horizon Confusion**
  *   **Failure:** They treat the "Stop Coin" as a risk to be hedged rather than a horizon constraint. They might bet 0% to "wait it out".
  *   **Fix:** Remind them in Phase 3: "Cash does not grow. Inflation is 0%, but opportunity cost is high. If you don't bet, you stay at £1,000. If you bet and the game ends, you keep the winnings."

  ---

  ### The Honest Limitation

  Here is the part of the idea that the game simply cannot deliver, and you must say out loud in the debrief:

  **You cannot simulate the pain of ruin with fake money.**

  In Phase 1, when a student goes from £1,000 to £50, they will laugh. In the real world, that drop triggers margin calls, psychological panic, and forced liquidation. They will tell themselves, "I'd just stop betting if this were real."

  **What to say:**
  *"You felt a twinge of anxiety in Phase 3 when the coin flipped to stop. Multiply that by the rent being due. This game assumes you can keep playing fractional bets down to infinity. In reality, you hit a floor. You get fired. The fund closes. That hard floor makes the Geometric Mean even more critical than this game suggests. You didn't feel true ruin today. Remember that."*

  ---

  ### Final Checklist for the Facilitator

  *   **British English:** Ensure you say "maths", "programme", "quid". Keep the tone dry.
  *   **Timekeeping:** Be ruthless. If Phase 1 runs over, cut Phase 3 rounds, not the debrief. The debrief is where the learning happens.
  *   **The Coin:** Use a physical coin. The sound of it landing creates tension. A digital RNG feels like a video game.
  *   **The Silence:** Enforce it. If they talk, they share risk. The lesson requires isolation.

  Right, print the trackers. Good luck. You'll need it.
