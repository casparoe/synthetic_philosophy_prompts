      *   *Stone:* Blame (private), Accusation (public), Punishment, Sanction?
      *   *Shouldn't:* Prudential warning? Moral prohibition? Norm of standing?
      *   *Core Philosophical Issue:* The "Standing to Blame" debate. Does hypocrisy undermine the *fittingness* of blame or the *authority/standing* to express it?

  3.  **Drafting the Menu of Theses (The Axes):**
      *   I need to map the user's axes (Stone, House, Shouldn't, Consequence) into coherent positions.
      *   *Thesis 1: The Prudential Reading.* (Classic folk wisdom). Don't do it because you'll get hurt/exposed.
      *   *Thesis 2: The Unfairness Reading.* (Bell, Fritz). It's unfair to the target because it implies superiority.
      *   *Thesis 3: The Standing/Authority Reading.* (Wallace, Todd). The blame might be fitting, but the blamer lacks the *right* to issue it.
      *   *Thesis 4: The Inefficacy/Counterproductivity Reading.* Hypocritical blame doesn't work morally.
      *   *Thesis 5: The Fittingness Reading.* (The one the classmate seems to want). Hypocrisy makes the blame *unfitting*. (This is the controversial one).

  4.  **Evaluating the Theses:**
      *   *Prudential:* True but irrelevant to moral philosophy of blame.
      *   *Unfairness:* Substantive, defensible (Bell).
      *   *Standing:* The dominant view in current literature (Wallace). Distinguishes fittingness from standing.
      *   *Fittingness:* Generally rejected in contemporary literature (hypocrisy doesn't change the facts of the wrong).

  5.  **Addressing the Specific Cases:**
      *   *Confessed Hypocrite:* "I did it, I was wrong, you are wrong."
