      *   **Task:** Disambiguate the proverb into precise theses (a "menu"), evaluate them (platitude/substantive/false), apply them to specific cases (Confessed Hypocrite, Ex-Hypocrite/Role-Holder), and address the tension with the *tu quoque* fallacy.
      *   **Tone:** Academic, rigorous, precise, but conversational enough for a peer discussion. Needs to show familiarity with the literature (e.g., Wallace, Bell, Fritz, Miller, Todd).

  2.  **Deconstruct the Proverb ("Glass Houses"):**
