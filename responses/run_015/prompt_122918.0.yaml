  6.  **The *Tu Quoque* Fallacy Tension:**
      *   *Tu Quoque:* "You did it too" is a fallacy when used to deny the *truth* of the premise or the *wrongness* of the act.
      *   *Glass Houses:* Is about the *blamer's permission/standing*, not the *act's wrongness*.
      *   *Resolution:* They operate at different levels. *Tu quoque* attacks the argument's validity regarding the act; Glass Houses attacks the speaker's authority to assert it. Both can be true.

