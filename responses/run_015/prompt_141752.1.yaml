answer: |-
  You have diagnosed the situation perfectly. You and your friend are not just disagreeing about a thought experiment; you are disagreeing about **which version of externalism is true.**

  Putnam's original slogan ("meanings just ain't in the head") is broad enough to cover two very different mechanisms.
  1.  **Causal-Historical Externalism (Your view):** Reference is fixed by an initial grounding event (a "baptism") and transmitted through a social chain. The environment matters *at the start* and *at the expert level*, but the link is historical.
  2.  **Informational/Covariation Externalism (Your friend's view):** Reference is fixed by what *reliably causes* your tokenings of a word *right now*. The environment matters *continuously*.

  You asked me to take a side on whether there is a fact of the matter. I will side with **you (the Causal-Historical view)**. In your Slow Switch scenario, "water" continues to refer to H₂O throughout the fifty years, and the community ends up systematically referring to H₂O while mistakenly believing the liquid in their taps is water.

  Here is the concrete breakdown of why this is the case, where the theories come apart, and why your friend's intuition, while common, misinterprets the mechanics of Putnamian reference.

  ### 1. Where the theories come apart: The possibility of error
  The decisive factor here is whether a linguistic community can be **systematically wrong** about the fundamental nature of the stuff they interact with daily.

  *   **Your Friend (Covariation):** If reference is determined by what *currently* causes your use of "water," then as soon as XYZ becomes the dominant cause of your "water" tokenings, your word "water" begins to refer to XYZ. On this view, the speakers *cannot* be wrong about the taps. If they say "This is water," and it's XYZ, they are speaking truthfully because their word "water" now means XYZ.
  *   **You (Historical):** If reference is determined by the historical chain, the word "water" is rigidly anchored to the original sample (H₂O). As the environment changes, the speakers' *beliefs* change (they believe the taps contain water), but their *reference* does not. They are pointing at XYZ and saying "water," which means H₂O. They are making a false statement.

  **Why I side with you:** A theory of reference that makes it impossible for a community to be wrong about the basic furniture of their immediate environment is too weak. We need a semantics that allows for **systematic error.** If I grow up in a simulation where everything that looks like a cat is a robot dog, my word "cat" should still refer to biological cats (via the historical chain of the language I inherited), and I should be mistaken when I point to a robot and say "cat." If reference shifted automatically to match the simulation, we could never discover we were in a simulation; the truth would always track our deception.

  Therefore, in your Slow Switch case, the reference stays with H₂O. The community is suffering from a massive, undetected error.

  ### 2. Addressing the specific details of your case

  **Does it flip? Is there a switch point?**
  On the Historical view: **No.** There is no switch point. Reference is not a fluid that flows to the lowest bidder; it is a chain. Unless there is an explicit act of re-baptism (e.g., scientists discover the change and say, "From now on, we will use 'water' to refer to XYZ"), the chain remains attached to the original kind.
  *   *Weightiest Point:* This implies the transition is not a semantic shift, but an accumulation of false beliefs. The "fact of the matter" is determinate: it's H₂O until the chain is deliberately severed or the concept becomes empty.

  **The Museum Bottles and Mars Colony:**
  These are **critical**. On the Historical view, these samples act as "reservoirs" of the original reference. Even if all H₂O vanished from Earth, the existence of the museum bottles preserves the *possibility* of the reference. If *all* H₂O in the universe were destroyed, *then* the term "water" might become empty (referring to nothing), or it might shift via a "descriptive fallback" (e.g., "the clear drinkable liquid"). But as long as the historical kind exists somewhere, the chain holds.
  *   *Contrast:* On your friend's Covariation view, the museum bottles are irrelevant. If no one interacts with them, they don't cause tokenings, so they don't fix reference.

  **The Kids Born in Year Forty:**
  This is the strongest test. These children learn the word "water" from parents who are pointing at XYZ.
  *   *Friend's View:* The kids mean XYZ. They learned the word ostensively from XYZ samples.
  *   *Your (Historical) View:* The kids mean H₂O. Language acquisition is not just conditioning on local stimuli; it is initiation into a **social practice**. When a parent teaches a child "water," they are passing on a word that has a history. The parent intends to teach the child the *same word* they use. Since the parent's word refers to H₂O (historically), the child's word refers to H₂O, even if the child has never encountered H₂O.
  *   *Implication:* Yes, a generation can end up meaning something different from what they encounter, *if* the social chain preserves the history. But in this case, they mean the *same* as their parents (H₂O), they are just wrong about the stuff in the taps.

  ### 3. The Nature of Your Disagreement

  This is a **metaphysical disagreement about the reference relation**, not just a pragmatic one.

  *   **Your Friend** is treating reference as a **functional state** of the speaker relative to their *current* environment. (Like a thermometer: if the environment changes, the reading changes).
  *   **You** are treating reference as a **historical relation** between the speaker and the world. (Like a proper name: "Aristotle" refers to Aristotle even if everyone currently alive believes Aristotle was a fictional character).

  Your friend is leaning on the slogan "Meaning ain't in the head" to imply "Meaning is in the *current* environment." But Putnam's point was "Meaning is not *solely* in the head," leaving room for history. Your friend has adopted a version of externalism (Covariation) that is actually more vulnerable to skepticism than the Historical view, because it ties meaning too tightly to immediate causal contact.

  ### 4. Does indeterminacy count against Externalism?

  You asked: *If the case just has no crisp answer, does that count against externalism?*

  Since I am taking the side that there *is* a crisp answer (it stays H₂O), I don't have to concede indeterminacy. However, if we assume a hybrid view where reference *does* eventually drift to XYZ after 100% replacement, that creates a "Sorites Paradox" for reference.
  *   Does this kill externalism? No. It kills **classical bivalence** for semantic claims.
  *   It suggests that reference is a vague relation, not a sharp one. This is a cost, but not a fatal one. Natural kind terms are human tools, and like all tools, their boundaries can be fuzzy when pushed to extreme sci-fi scenarios.
  *   However, the Historical view minimizes this fuzziness. It says the boundary is sharp: *Did the community re-baptize the kind?* If no, reference holds.

  ### 5. My "Take a Side" Summary & Defeaters

  **The Verdict:** "Water" refers to H₂O throughout the 50 years. The speakers are systematically mistaken about the contents of their taps. There is no moment where the meaning flips.

  **The Weightiest Part of this Argument:**
  The **Division of Linguistic Labor** and **Deference**. Even if no one *knows* chemistry, the structure of the language assumes there *is* a fact of the matter about the underlying nature of stuff. When speakers use "water," they implicitly defer to "the actual nature of the stuff we've always called water." Since the actual nature of the stuff they *started* calling water was H₂O, their deference points to H₂O. The fact that the environment swapped out the stuff underneath them doesn't change where their deference points; it just means their deference is no longer satisfied by the local taps.

  **What Would Change My Mind:**
  I would switch to your friend's side (Covariation/XYZ) if:
  1.  **Total Extinction:** If *every single molecule* of H₂O in the universe were destroyed, including the museum bottles and the Mars colony. At that point, "water" cannot refer to H₂O because H₂O does not exist. The term would either become empty or shift to XYZ by default.
  2.  **Explicit Re-calibration:** If the community's scientists discovered the swap and voted to keep using the word "water" for the new XYZ stuff (effectively a re-baptism). At that moment, the historical chain is deliberately re-anchored, and "water" becomes XYZ.

  **Conclusion for your argument:**
  Tell your friend: "If you're right, then we can never be wrong about the basic stuff in our environment. If the world secretly swapped out all the gold for fool's gold tomorrow, your theory says our word 'gold' would instantly start meaning fool's gold, and we'd all be speaking truthfully. My theory says we'd all be speaking falsely. Externalism should allow for the possibility that the world tricks us, not that the world defines our truth automatically."

  That is the concrete difference. You are arguing for the possibility of **systematic error**; she is arguing for **adaptive truth**. Historical externalism wins because it explains how we can be wrong.
