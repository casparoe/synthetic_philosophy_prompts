answer: |-
  Here is a principle constructed to fit your data, an analysis of where the moral weight rests, and an honest assessment of where the principle strains against your intuitions.

  ### The Principle: Constitutive Inalienability

  **Statement:**
  > A market transaction is impermissible if it requires the seller to treat a **constitutive attribute of their moral or civic agency** as a fungible commodity. A attribute is "constitutive" if its removal or alienation diminishes the seller's status as a free, equal, or intact person.

  **The Three Clauses:**
  1.  **Bodily Integrity:** You may sell the *products* of your body (eggs, labor, risk) or its *remains* (corneas), but you may not sell the *permanent structural parts* of your living self (kidneys).
  2.  **Civic Agency:** You may be compensated for the *burden* of citizenship (voting stipends), but you may not sell the *exercise* of civic power (votes).
  3.  **Expressive Integrity:** You may sell your *labor* (ghostwriting), but you may not sell your *authority, judgment, or virtue* (veto power, your name, your willingness).

  ### Where the Repugnance Lives

  Based on your verdicts—specifically the "Willingness Premium" case—the repugnance lives in **what the transaction expresses to others.**

  It is not primarily about harm (the surgery is the same in both kidney cases), nor is it primarily about state enforcement (surrogacy and kidneys both involve state enforcement). It is about **semantic corruption.**

  *   **The Proof:** Your "Willingness Premium" case. Nothing physical changes. No extra coercion exists. Yet, paying for the *willingness* turns a moral sacrifice into a purchased service. It changes the social meaning of the act from "gift" to "transaction."
  *   **The Mechanism:** When the state enforces these contracts, it becomes a co-signer of that expression. By banning the market, the state declares, "This part of you is not for sale," which preserves the social meaning of that attribute.

  ### Friction Points: Where the Principle Breaks

  No principle fits every gut verdict perfectly. Here is where **Constitutive Inalienability** struggles with your list, and my advice on how to handle it in your novel.

  **1. The Festival Water Case**
  *   **The Verdict:** You said $80 for water at a desert festival is "No" (though less bad than hurricane water).
  *   **The Conflict:** Water at a festival is not usually constitutive of agency in the same way as a kidney or a vote. It is a discretionary purchase. If the principle is about "constitutive attributes," this verdict is an outlier.
  *   **The Fix:** You have two choices.
      *   *Drop the Verdict:* Have the character concede that festival water *should* be legal, distinguishing it from the hurricane case based on **duress**. This strengthens the principle (Markets are banned when necessity removes consent).
      *   *Bend the Principle:* Expand the definition of "constitutive" to include **shared survival goods**. Argue that pricing essential survival tools anywhere corrupts the social meaning of community.
  *   **Recommendation:** **Drop the Festival Verdict.** It is the weakest link. In a debate, the opponent will crush this distinction. It is stronger to argue that price gouging is only banned when *coercion* (the hurricane) is present. This gives your characters a clearer line: *Consent vs. Desperation.*

  **2. The Fixed-Price Kidney Case**
  *   **The Verdict:** You said "No," but with weaker recoil.
  *   **The Conflict:** The principle bans the *commodification* of the kidney. A fixed price is still a price. It still makes the kidney fungible.
  *   **The Nuance:** This is actually your novel's "Gray Zone." The principle suggests this *should* be permissible if the price mechanism is removed (making it a stipend/sacrifice rather than a market). Your gut says "No," but hesitates.
  *   **Recommendation:** **Keep the Verdict, but make it the pivot point.** This is where your characters should fight. One argues, "It's still a sale." The other argues, "No, the lottery and fixed price remove the market *meaning*; it's now a civic draft." This is the most fertile ground for drama.

  **3. Surrogacy vs. Kidney**
  *   **The Verdict:** Surrogacy is "Yes," Kidney is "No."
  *   **The Conflict:** You noted both involve state claims on the body.
  *   **The Resolution:** The principle distinguishes them via **Permanence and Separation.** A kidney is a permanent loss of *self*. A surrogate carries a *separate* life temporarily. The surrogate's body is the vessel, not the product.
  *   **Recommendation:** This distinction holds up well legally and philosophically. Keep it.

  ### Verdicts on Your New Cases

  Applying **Constitutive Inalienability** to your unsettled scenarios:

  **1. The AI Estate (Post-Mortem Style Rights)**
  *   **Analysis:** This involves selling your *expressive voice* after death.
  *   **Comparison:** Like the cornea (post-mortem), but unlike the cornea, a writing style is not a physical part; it is an **identity marker**. Like the "Selling Name" case, this transfers authority. It misleads the public into thinking the agent created the work, corrupting the meaning of authorship.
  *   **Verdict:** **No.**
  *   **Reasoning:** It violates **Expressive Integrity**. Even after death, your style is constitutive of your identity. Selling it turns your artistic legacy into a fungible asset, expressing that "art is product," which corrodes the institution of authorship.

  **2. The State Monopsony (Single Buyer, Fixed Sum, No Contact)**
  *   **Analysis:** The state is the only buyer. Price is fixed. No negotiation. No contact between donor and recipient.
  *   **Comparison:** This removes the "Market" element entirely. It is no longer a commodity transaction; it is a **taxed sacrifice** or a **civic draft with compensation**.
  *   **Verdict:** **Yes (Permissible).**
  *   **Reasoning:** This survives the **Semantic Corruption** test. Because there is no bidding, no negotiation, and no direct buyer-seller relationship, the transaction does not express "this body part has a market price." It expresses "the state compensates citizens for bodily sacrifice." It aligns with your weaker recoil on the fixed-price kidney case, pushing it over the line into acceptance.

  ### Summary for Your Draft

  If you build your argument around **Semantic/Expressive Harm** (what the transaction *says* about us) rather than **Physical Harm** (what the transaction *does* to us), you will capture the "Willingness Premium" intuition, which is your most unique insight.

  **The Sacrifice:** You must be willing to let the "Festival Water" verdict go, or your opponent will use it to invalidate the whole theory.

  **The Core Conflict:** Your characters should not fight about *harm*. They should fight about *meaning*.
  *   **Character A:** "A kidney is a part of a person. Putting a price on it, even a fixed one, says a person is a collection of parts."
  *   **Character B:** "A lottery with a fixed stipend doesn't say 'price.' It says 'sacrifice.' We pay soldiers to risk their bodies. Why is a kidney different?"

  That is where your novel lives.
