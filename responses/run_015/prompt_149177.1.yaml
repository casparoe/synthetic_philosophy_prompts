  # PERPETRATOR CAUSALITY REVIEW PROTOCOL (PCRP)
  **Museum of Comparative Genocide Studies | Curriculum Review Board**
  **Version:** 4.2 | **Cycle:** Quarterly | **Review Window:** 10 Working Days

  ## PURPOSE
  To evaluate educational proposals (lesson plans, exhibit texts, scripts) explaining perpetrator behavior in mass killing events. This protocol ensures explanations navigate the historiographical tension between **Situational/Organizational Factors** (Browning) and **Cultural/Ideological Factors** (Goldhagen) without committing specific logical or historical errors.

  ## BOARD COMPOSITION
  *   **Lead Historian:** Ensures factual accuracy.
  *   **Pedagogical Specialist:** Ensures age-appropriateness.
  *   **Community Representative:** Ensures resonance with survivor/descendant communities.

  ---

  ## PHASE 1: INITIAL SCREENING (Days 1-3)
  *Completed by Lead Historian & Pedagogical Specialist.*

  **1.1 Scope Definition**
  *   [ ] Does the proposal identify a specific historical event/perpetrator group?
  *   [ ] Does the proposal explicitly state its causal claim (why did they kill)?
  *   **STOP NODE:** If no causal claim is explicit, **RETURN TO AUTHOR** for clarification.

  **1.2 Factor Inventory**
  *   [ ] List all causal factors cited (e.g., peer pressure, antisemitism, bureaucratic orders, economic gain).
  *   [ ] Categorize each factor as **Situational/Organizational** (S) or **Cultural/Ideological** (C).

  **1.3 Hard Error Scan A: Contextless Situationalism**
  *   **Question:** If the proposal relies primarily on **S** factors (peer pressure, routinization), does it explicitly address the pre-existing cultural dehumanization of the *specific* victim group?
  *   **Sufficient Answer:** Yes, the text explains why *this* group was targeted as vulnerable before the situational pressure was applied.
  *   **Insufficient Answer:** No, or "propaganda" is mentioned only as background noise without linking it to the perpetrators' willingness to target humans.
  *   **DECISION NODE:** If Insufficient $\rightarrow$ **FLAG FOR REVISION (Error Type 1)**.

  **1.4 Hard Error Scan B: Contextless Ideology**
  *   **Question:** If the proposal relies primarily on **C** factors (hatred, worldview), does it explain the organizational context required to translate belief into systematic action?
  *   **Sufficient Answer:** Yes, the text details how state structure, chains of command, or impunity enabled the ideology to become lethal policy.
  *   **Insufficient Answer:** No, organization is treated as incidental or purely passive.
  *   **DECISION NODE:** If Insufficient $\rightarrow$ **FLAG FOR REVISION (Error Type 2)**.

  **1.5 Hard Error Scan C: Additive-Causation Fallacy**
  *   **Question:** Does the proposal list **S** and **C** factors side-by-side as independent variables that sum to violence?
  *   **Sufficient Answer:** No, the proposal specifies the *interaction* (e.g., ideology lowered the threshold for obedience; organization radicalized existing prejudice).
  *   **Insufficient Answer:** Yes, implies either factor alone would have produced the same outcome, or treats them as interchangeable.
  *   **DECISION NODE:** If Insufficient $\rightarrow$ **RECOMMEND REJECTION (Error Type 3)**. *See Application Case 3.*

  ---

  ## PHASE 2: EXPLANATORY LAYER CHECK (Days 4-7)
  *Completed by Full Board.*

  **2.1 Explanatory Flattening Detection**
  *   **Definition:** Collapsing distinct levels of analysis (Individual, Meso/Group, Macro/State) into a single causal soup.
  *   **Checklist:**
      *   [ ] Does the text distinguish between *individual* psychology (fear, ambition) and *group* dynamics (cohesion, conformity)?
      *   [ ] Does the text distinguish between *group* dynamics and *state* policy (legal frameworks, resource allocation)?
  *   **DECISION NODE:** If layers are collapsed $\rightarrow$ **FLAG FOR REVISION**.

  **2.2 Temporal Scale Verification**
  *   **Question:** Does the proposal distinguish between long-term causes (decades of prejudice) and short-term triggers (war outbreak, specific orders)?
  *   **Sufficient Answer:** Yes, a timeline or sequence is implied or stated.
  *   **Insufficient Answer:** No, causes are presented as simultaneous or timeless.
  *   **DECISION NODE:** If Insufficient $\rightarrow$ **FLAG FOR REVISION**.

  **2.3 Historiographical Defensibility**
  *   **Question:** Is the causal model defensible within current scholarship (even if debated)?
  *   **Criterion:** A proposal favoring Browning *or* Goldhagen is acceptable **IF** it acknowledges the counter-argument exists and explains why its chosen lens is prioritized for *this specific learning objective*.
  *   **DECISION NODE:** If the proposal presents a fringe theory as consensus $\rightarrow$ **REJECT**.

  ---

  ## PHASE 3: VALUES & IMPACT HAND-OFF (Days 8-10)
  *Completed by Community Representative & Lead Educator.*
  *Note: This phase begins ONLY if Phase 1 & 2 are passed. History determines defensibility; Values determines utility.*

  **3.1 Moral Risk Assessment**
  *   **Question:** Does the explanation risk morally excusing the perpetrator (e.g., "they had no choice")?
  *   **Action:** If **S** factors dominate, verify the text explicitly reaffirms perpetrator agency.
  *   **HAND-OFF POINT:** If the Board disagrees on whether the text excuses the perpetrator, this is a **VALUES JUDGMENT**, not a historical fact. Vote required.

  **3.2 Community Resonance**
  *   **Question:** Does emphasizing one causal factor (e.g., pure hatred vs. pure conformity) undermine the dignity of the victims or the experience of survivors?
  *   **HAND-OFF POINT:** This is outside historical scope. Community Representative holds veto power here if consensus cannot be reached.

  **3.3 Pedagogical Utility**
  *   **Question:** Is the nuance required to make this historically accurate appropriate for the target age group?
  *   **HAND-OFF POINT:** If accuracy requires complexity beyond the audience's capacity, the **Pedagogical Specialist** recommends simplification or topic change.

  ---

  ## LIMITATIONS OF PROTOCOL
  *This procedure cannot automate the following:*
  1.  **Ambiguous Evidence:** Where historical records are contradictory, the protocol flags the ambiguity but cannot resolve it. This requires **Expert Historical Judgment**.
  2.  **Normative Weight:** The protocol identifies if an explanation is *historically coherent*, not if it is *morally preferable*. Deciding whether emphasizing situational factors risks "normalizing" genocide is a **Board Values Vote**.
  3.  **Regional Specificity:** This protocol is generalized. Applications to non-European genocides require consultation with **Regional Specialists** to ensure "ideology" and "organization" are defined correctly for that context.

  ---

  # APPLICATION OF PROTOCOL TO CURRENT PROPOSALS

  ## PROPOSAL 1: High-School Lesson Plan (Reserve Police Battalion 101)
  **Summary:** Explains killings via unit cohesion, fear of isolation, bureaucratic routinization. Antisemitic propaganda mentioned as "background noise."

  *   **Phase 1.3 (Hard Error Scan A):** **FAILED.**
      *   *Analysis:* Relies heavily on **S** factors (peer pressure). Mentions antisemitism only as "background." Fails to explain why *Jews* were the target of this pressure rather than another group.
      *   *Protocol Verdict:* **FLAG FOR REVISION (Error Type 1).**
      *   *Required Fix:* Must integrate how dehumanization made the victims "killable" before peer pressure was applied. Peer pressure explains compliance, not target selection.
  *   **Phase 3 (Values Hand-off):** N/A (Failed Phase 1).

  ## PROPOSAL 2: Documentary Treatment (Local Auxiliaries)
  **Summary:** Argues auxiliaries killed primarily due to internalized eliminationist worldview. Organizational structure mentioned as "incidental enabling condition."

  *   **Phase 1.4 (Hard Error Scan B):** **FAILED.**
      *   *Analysis:* Relies heavily on **C** factors (worldview). Dismisses organization as "incidental." Fails to explain how local grievances were weaponized by occupying state structures.
      *   *Protocol Verdict:* **FLAG FOR REVISION (Error Type 2).**
      *   *Required Fix:* Must demonstrate how the organizational context (impunity, supply of weapons, orders) was *necessary* to translate worldview into mass action.
  *   **Phase 3 (Values Hand-off):** N/A (Failed Phase 1).

  ## PROPOSAL 3: Museum Panel Text ("The Dual Cause")
  **Summary:** States "both situational pressure and cultural ideology caused the violence, and either one alone would have produced the same outcome." Treats explanations as independent/interchangeable.

  *   **Phase 1.5 (Hard Error Scan C):** **FAILED.**
      *   *Analysis:* Commits Additive-Causation Fallacy. Claims interchangeability ("either one alone would have produced the same outcome"). This is historically incoherent; ideology without state power rarely leads to industrial genocide; state power without specific ideology rarely targets specific groups for extermination.
      *   *Protocol Verdict:* **RECOMMEND REJECTION (Error Type 3).**
      *   *Board Resistance Note:* Educators often prefer this "balanced" phrasing to avoid controversy. The Board must resist approving this. It creates **Explanatory Flattening** (Phase 2.1) by treating distinct causal layers as interchangeable.
      *   *Required Fix:* Rewrite to show *interaction*. Example: "Cultural ideology identified the target; situational pressure overcame moral inhibitions; organizational structure provided the means."

  ---

  ## DECISION LOG FOR THIS CYCLE

  | Proposal | Phase 1 Result | Phase 2 Result | Final Status | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **01 (Lesson Plan)** | **Revise** (Error Type 1) | N/A | **Return to Author** | Must integrate victim dehumanization context. |
  | **02 (Documentary)** | **Revise** (Error Type 2) | N/A | **Return to Author** | Must integrate organizational necessity. |
  | **03 (Panel Text)** | **Reject** (Error Type 3) | N/A | **Reject** | Additive fallacy creates historical incoherence. |

  **Director's Note to Board:**
  Proposal 3 will likely generate debate. It *sounds* inclusive. However, under PCRP Phase 1.5, it is historically indefensible. Approving it would violate our mandate for accuracy. Please prepare to explain to stakeholders why "both/and" is insufficient without describing *how* the factors interact.

  **Next Steps:**
  1.  Send revision letters to Proposals 1 & 2 by Day 11.
  2.  Draft rejection notice for Proposal 3 by Day 11.
  3.  Schedule Values Deliberation for Day 14 regarding the *tone* of the revision letters (to ensure we do not appear to be silencing specific historiographical schools, but rather demanding rigor).
