prompt: |-
  You direct the curriculum review board at a museum of comparative genocide studies. Every quarter you receive proposals for new educational modules—lesson plans, exhibit texts, and short documentary scripts—that explain why ordinary people participated in mass killing. You need a reusable procedure your board (historians, educators, and one community representative without advanced historical training) can run consistently within a two-week review cycle, to decide whether a proposal's explanation of perpetrator behavior is defensible, oversimplified, or conceptually confused.

  Ground the procedure in the well-known historiographical tension between Christopher Browning's argument in Ordinary Men—situational and organizational pressures, including peer dynamics, career incentives, dehumanization of victims, and incremental escalation, can explain much killing without requiring deep prior ideological hatred—and Daniel Goldhagen's argument in Hitler's Willing Executioners—that a pervasive, culturally specific eliminationist antisemitism created a reservoir of willingness making ordinary Germans eager executioners rather than reluctant conformists.

  Design the procedure as an ordered protocol: the specific questions to ask at each stage, what counts as a sufficient answer, where the protocol stops with a clear "revise or reject," and where it must hand the decision to the board's values judgment rather than historical fact. The protocol must detect three hard errors: invoking peer pressure or bureaucratic compartmentalization without addressing whether victims were already dehumanized in the culture; invoking ideology without addressing whether organizational context was necessary to translate belief into action; and committing an additive-causation fallacy by listing situational and cultural factors side by side without specifying their interaction or temporal scale. Include explicit decision nodes for "explanatory flattening," where distinct levels of analysis are collapsed into interchangeable causes.

  Then apply the procedure to three proposals:

  1. A high-school lesson plan explaining Reserve Police Battalion 101's killings almost entirely through unit cohesion, fear of isolation, and bureaucratic routinization, mentioning antisemitic propaganda only as background noise.

  2. A documentary treatment arguing that local auxiliary forces in occupied territories killed primarily because they had long internalized an eliminationist worldview specific to their region, with organizational structure mentioned only as an incidental enabling condition.

  3. A museum panel text stating that "both situational pressure and cultural ideology caused the violence, and either one alone would have produced the same outcome," treating the two explanations as independent and interchangeable.

  In your applications, include at least one case where the procedure yields a verdict the board is likely to resist—such as rejecting a proposal that sounds balanced but collapses explanatory layers into an additive model. Also specify precisely what the procedure cannot do: which distinctions require expert historical judgment it cannot automate, and which normative questions (for example, whether emphasizing situational factors risks morally excusing perpetrators) lie outside its scope and must be flagged for separate deliberation.

  Present the deliverable as a reusable checklist with decision nodes, not as an essay about the debate. Mark every hand-off point explicitly.
reasoning: |-
  Here's a thinking process that leads to the suggested curriculum review protocol:

  1.  **Analyze the Request:**
      *   **Role:** Director of the Curriculum Review Board at a Museum of Comparative Genocide Studies.
      *   **Task:** Create a reusable procedure (protocol/checklist) for reviewing educational module proposals (lesson plans, exhibits, scripts) regarding perpetrator behavior.
      *   **Audience:** The Board (historians, educators, one community representative).
      *   **Constraint:** Must be runnable within a two-week cycle.
      *   **Theoretical Grounding:** Must navigate the tension between Christopher Browning (*Ordinary Men*: situational/organizational factors) and Daniel Goldhagen (*Hitler's Willing Executioners*: cultural/ideological factors).
      *   **Specific Requirements:**
          *   Ordered protocol with specific questions.
          *   Define sufficient answers.
          *   Define stop points (Revise/Reject).
          *   Identify hand-off points to board values judgment.
          *   Detect three hard errors:
              1.  Situational factors without dehumanization context.
              2.  Ideology without organizational context.
              3.  Additive-causation fallacy (listing factors without interaction/temporal scale).
          *   Detect "explanatory flattening."
          *   Apply to three specific proposals (Browning-heavy, Goldhagen-heavy, Additive-flattened).
          *   Include a case where the verdict might be resisted (e.g., rejecting the "balanced" additive one).
          *   Specify limitations (what the procedure *cannot* do).
          *   Format: Reusable checklist with decision nodes (not an essay).

  2.  **Deconstruct the Theoretical Tension (Browning vs. Goldhagen):**
      *   *Browning:* Ordinary men $\rightarrow$ Situational pressure (peer pressure, authority, routinization) $\rightarrow$ Killing. Ideology is present but not the *primary* driver for everyone.
      *   *Goldhagen:* Ordinary Germans $\rightarrow$ Eliminationist Antisemitism (cultural cognitive model) $\rightarrow$ Willing Killing. Organization facilitates but doesn't create the will.
      *   *Synthesis/Modern Consensus:* Most historians reject strict binaries. It's usually an interaction. Ideology makes victims vulnerable; organization makes killing feasible; situational factors overcome moral inhibitions.
      *   *The "Hard Errors" to Catch:*
          1.  *Contextless Situationalism:* "They killed because of peer pressure" (Ignores *who* they were killing and why that specific group was targeted).
          2.  *Contextless Ideology:* "They killed because they hated Jews" (Ignores the state machinery required to turn hate into systematic genocide).
          3.  *Additive Fallacy:* "A + B = C" without explaining *how* A and B interact (e.g., does ideology lower the threshold for situational pressure?).

  3.  **Drafting the Protocol (The "Perpetrator Causality Review Protocol" - PCRP):**
      *   *Structure:* Phase 1 (Intake/Screening), Phase 2 (Causal Logic Check), Phase 3 (Historical Accuracy Check), Phase 4 (Values/Impact Hand-off).
      *   *Decision Nodes:* Pass, Revise, Reject, Hand-off.
      *   *Hard Error Checks:* Need specific questions for the three defined errors.
      *   *Explanatory Flattening:* Need a check for collapsing levels of analysis (individual vs. structural vs. cultural).

  4.  **Developing the Application Cases:**
      *   *Proposal 1 (Browning-heavy):* Focuses on Reserve Police Battalion 101. Emphasizes peer pressure/routinization. Downplays antisemitism.
          *   *Analysis:* Risks Hard Error #1 (Situational without dehumanization).
          *   *Verdict:* Revise (Needs to integrate victim dehumanization/cultural context).
      *   *Proposal 2 (Goldhagen-heavy):* Focuses on auxiliaries. Emphasizes eliminationist worldview. Downplays organization.
          *   *Analysis:* Risks Hard Error #2 (Ideology without organizational context).
          *   *Verdict:* Revise (Needs to show how structure enabled action).
      *   *Proposal 3 (Additive/Flattened):* "Both caused it, either would work."
          *   *Analysis:* Risks Hard Error #3 (Additive Fallacy) and Explanatory Flattening.
          *   *Verdict:* Reject (This is the "resisted" verdict because it sounds balanced but is historically incoherent).

  5.  **Refining the Limitations Section:**
      *   What can't this do? It can't settle deep historiographical debates where evidence is ambiguous. It can't decide moral questions (does this excuse the perpetrator?). It can't replace expert knowledge of specific regional contexts (e.g., Rwanda vs. Holocaust).

  6.  **Formatting and Tone:**
      *   Tone: Administrative, precise, authoritative but collaborative.
      *   Format: Checklist style with bold headers, boxes for decision nodes.
      *   Ensure the "Hand-off" points are explicit.

  7.  **Review against Constraints:**
      *   *Two-week cycle?* Yes, the protocol is designed for efficiency.
      *   *Board composition?* Yes, accessible to the community rep but rigorous for historians.
      *   *Three hard errors included?* Yes.
      *   *Explanatory flattening included?* Yes.
      *   *Applications included?* Yes.
      *   *Limitations included?* Yes.
      *   *Checklist format?* Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the distinction between "Revise" and "Reject" clear?
      *   *Fix:* Make "Reject" reserved for fundamental historical incoherence (like Proposal 3), and "Revise" for imbalances that can be fixed (like 1 and 2).
      *   *Critique:* Is the "Hand-off" clear?
      *   *Fix:* Create a specific section called "Values & Impact Hand-off" where historical defensibility ends and ethical/pedagogical judgment begins.
      *   *Critique:* Did I address the "resisted verdict"?
      *   *Fix:* In the application for Proposal 3, explicitly note that educators often like "both/and" answers, but the protocol must flag the *interaction* failure.

  9.  **Final Polish:** Check the specific wording of the Browning/Goldhagen tension to ensure neutrality while enforcing historical rigor. Ensure the "Hard Errors" are defined clearly in the protocol preamble. (Proceed to generate output).

  *(Self-Correction Note during final review)*: Make sure the distinction between "Historical Fact" and "Values Judgment" is sharp. The protocol determines if the history is *defensible*, not if it is *comfortable*.

  10. **Final Output Generation** (matching the thought process above).
