  9.  **Developing the Debrief:**
      *   Map the argument: "I saw it as X" vs "You just thought it was X."
      *   Introduce terms: Modularity (Fodor) vs. Penetration (Churchland/Predictive Processing).
      *   Highlight the "Hard Problem" of the activity: We only have verbal reports.

