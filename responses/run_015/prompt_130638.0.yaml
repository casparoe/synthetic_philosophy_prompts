      *   Concrete rules? Check.
      *   Payoff scheme? Check (Exemption Tokens).
      *   Predictable failure? Check (Observers noticing, students comparing notes).
      *   Honest admission? Check (Phenomenological access).
      *   Timeline? Check.

  11. **Final Polish:**
      *   Tone: Professional, practical, pedagogical.
      *   Ensure the "Threat" prime is ethical (don't actually scare them, just gamify risk).
      *   Make sure the Observers have a specific script so they don't interfere.

  *(Self-Correction during drafting)*: The Face/Vase is too binary. If half see Face and half see Vase, it's easy to say "It's ambiguous." To make CP plausible, the stimulus should be *slightly* biased one way, but the prime pushes the other. Or, use a stimulus where "Threat" makes a neutral face look angry. Let's suggest using *Ambiguous Emotional Faces* as the primary stimulus, with Face/Vase as a warmup. Actually, sticking to the user's "Face/Vase" request is safer, but I will advise adding a second, more subtle stimulus to make the "Threat" prime relevant (e.g., Is that a snake or a rope?). Let's stick to the prompt's "Face or Vase" but advise on *how* to present it (speeded exposure) to prevent deep scrutiny. Speed forces reliance on priors (the prime).

  *Wait, one more thing:* The prompt asks for "what will predictably break the first run." I need to be specific. The observers are the weak link. If they sit in the circle, they hear the discussion. If the discussion reveals the prime ("I was thinking about security..."), the observers know. I need to forbid mentioning the card game during deliberation.

  *Limitation:* The biggest limitation is that this demonstrates *bias*, not necessarily *penetration*. I need to make sure the instructor explains that this activity *simulates* the debate, it doesn't settle the science.

