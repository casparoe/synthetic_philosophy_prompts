answer: |-
  Here is a complete design for the "Perceptual Jury" activity, tailored for an 80-minute community college session. It is built to be run with minimal prep, no budget, and maximum philosophical friction.

  # Activity Title: The Perceptual Jury
  **Objective:** To generate a lived conflict over whether cognitive states (fear/priority) alter perceptual *experience* or merely post-perceptual *judgment*.
  **Class Size:** 12 Students (10 Jurors, 2 Observers).
  **Materials:** Printed cards (see below), 3 projected images, whiteboard, "Exemption Tokens" (index cards).

  ---

  ## 1. The Setup (Minutes 0–10)
  **The Cover Story:** Tell the class they are participating in a study on "Collaborative Decision Making Under Uncertainty." Do not mention perception, philosophy, or priming.

  **The Roles:**
  *   **The Observers (2 students):** Send them into the hall for 2 minutes. Give them a clipboard and a specific script: *"Your job is to track the **confidence level** and **reaction time** of the voters, not the votes themselves. Mark if they hesitate, sigh, or argue. Do not participate in the discussion."*
      *   *Crucial:* Tell them, "There are no trick questions. Just watch the behavior." This keeps them blind to the manipulation.
  *   **The Jurors (10 students):** Seat them in a circle. Split them physically: **Left Side (Group A)** and **Right Side (Group B)**.
      *   *Rule:* "No sharing of materials or discussing the warm-up game once it is collected."

  **The Payoff:**
  *   There are 3 "Exemption Tokens."
  *   Token 1: The side (A or B) with the highest internal agreement wins one token.
  *   Token 2: The individual who makes the most persuasive argument during deliberation wins one.
  *   Token 3: The Observers win one if their data log matches the Instructor's secret key.
  *   *Value:* Tokens can be redeemed for: Leaving 5 minutes early, choosing the discussion topic for next week, or a "homework pass" for a minor assignment.

  ---

  ## 2. The Hidden Mechanism: "Resource Allocation" (Minutes 10–25)
  This is the priming phase. It must feel like a boring administrative task so they don't suspect it's the variable.

  **Distribution:** Hand out sealed envelopes.
  *   **Group A (Threat Prime):** Envelope labeled **"Security Protocol."**
  *   **Group B (Neutral Prime):** Envelope labeled **"Logistics Protocol."**

  **The Task (5 Minutes):**
  Inside are 10 cards with abstract shapes and a number (1–5).
  *   **Group A Instructions:** "You are managing a defense grid. Each card represents a **potential breach**. Spend your budget units to **block** high-risk numbers. If you miss a high risk, the perimeter fails."
      *   *Psychological Effect:* Induces vigilance, threat detection, focus on "hostile" patterns.
  *   **Group B Instructions:** "You are managing a supply chain. Each card represents a **resource drop**. Spend your budget units to **collect** high-value numbers. If you miss a high value, efficiency drops."
      *   *Psychological Effect:* Induces opportunistic scanning, focus on "constructive" patterns.

  **The Catch:** The cards are identical. Only the *framing* differs.
  **Collection:** Collect all cards and envelopes immediately. Do not let them compare.

  ---

  ## 3. The Voting Rounds (Minutes 25–45)
  Project three images. For each, students have 30 seconds to look, then must vote publicly (raise hands) and briefly state *why*.

  *   **Stimulus 1 (Warmup):** Classic Rubin's Vase (Face/Vase).
      *   *Goal:* Get them comfortable voting. Expect a mix.
  *   **Stimulus 2 (The Test):** An ambiguous emotional face (e.g., a face that is morphed 50% between Neutral and Angry) OR an ambiguous shadow (e.g., a coiled shape that could be a Rope or a Snake).
      *   *Recommendation:* Use the **Rope/Snake** image. It aligns better with the "Security vs. Logistics" prime.
      *   *Group A (Security)* should lean toward **Snake**.
      *   *Group B (Logistics)* should lean toward **Rope**.
  *   **Stimulus 3 (The Stressor):** A degraded image (visual noise) with a hint of a figure.
      *   Ask: "Is there a person hiding in the static? Yes/No."
      *   *Group A* should report **Yes** (hyper-vigilance).
      *   *Group B* should report **No** (standard threshold).

  **The Conflict:**
  By Stimulus 2 and 3, the voting should split roughly along the seating lines (Group A vs. Group B). The Observers will notice the polarization but shouldn't know why.

  ---

  ## 4. The Deliberation (Minutes 45–65)
  This is the core philosophical engine. The Instructor steps back. The students must resolve the disagreement to win the Tokens.

  **The Rule:** You cannot say "I think it is X." You must say "It **looks** like X."
  *   If a student says, "I think it's a snake because you told us to look for danger," they forfeit a Token.
  *   They must argue about the *visual experience itself*.

  **Predictable Arguments:**
  *   *Group A:* "It looks curved and aggressive. The shading looks like scales."
  *   *Group B:* "It looks flat. The texture looks like fiber. It's clearly lying still."
  *   *The Clash:* "You're just *interpreting* it as a snake." vs "No, my eyes literally see scales."

  **The Instructor's Role:**
  *   Do not intervene.
  *   Write key phrases on the board: *"It looks like..."* vs *"I think it is..."*
  *   If the energy dies, prompt: "Can someone from the other side describe exactly what the other side is seeing? Do you agree that's what they see?"

  ---

  ## 5. The Reveal & Debrief (Minutes 65–80)
  **Step 1: The Data (5 Mins)**
  Ask the Observers to report. "Did you see a split? Did confidence change?"
  Reveal the Envelope labels ("Security" vs. "Logistics").
  Ask Group A: "Did you feel more stressed during the card game?"
  Ask Group B: "Did you feel more relaxed?"

  **Step 2: The Theory (10 Mins)**
  Now, and only now, introduce the term **Cognitive Penetration**.
  *   **The Penetration View:** Your cognitive state (fear/security mode) changed the *content* of your visual experience. The snake *looked* real to you.
  *   **The Modularity View (Fodor):** Your eyes saw the same pixels. Your brain just *judged* it differently based on the prime. The experience was identical; the belief was not.

  **Step 3: The Honest Admission (Crucial)**
  The instructor must admit the limitation of the simulation to the class:
  > "This game created a conflict, but it cannot solve the philosophy problem. Why? Because I cannot see through your eyes. Even if Group A screams 'It looked like a snake!', a skeptic can always say, 'No, it looked like a rope, you just *believed* it was a snake.' We have no instrument to measure 'seeming' other than your word. This activity simulates the *argument* for cognitive penetration, not the proof of it."

  ---

  ## Predictable Failure Points & Fixes

  **1. The Observers Catch On**
  *   **Risk:** During deliberation, a Juror slips up: "Well, since we were doing that security game..." The Observers now know the prime and their data is biased.
  *   **Fix:** Before deliberation, explicitly warn: "Discussing the card game rules during deliberation is a foul. Stick to the images." If a student slips, gently interrupt: "Focus on the image, not the previous task."

  **2. The Prime is Too Weak**
  *   **Risk:** The card game feels boring. No stress is induced. Voting remains random.
  *   **Fix:** Add a timer and a "Penalty" to the card game. "If your group total is under 50 points, the whole group loses the Token." Social pressure induces the necessary cognitive load/threat state.

  **3. The "Face/Vase" is Too Familiar**
  *   **Risk:** Students know the trick. They intellectualize it immediately.
  *   **Fix:** Use the **Rope/Snake** or **Angry/Neutral Face** as the main event. Face/Vase is just the warmup. The threat prime works better on survival-relevant stimuli (snakes/faces) than geometric figures.

  ---

  ## The "Honest Admission" (Instructor Notes)
  *Include this in her lecture notes for the final 5 minutes.*

  **What this simulation cannot reproduce:**
  The activity relies on **verbal reports**. In philosophy of mind, this is the "Problem of Privileged Access."
  *   **The Limitation:** We are measuring *judgments about experience*, not *experience itself*.
  *   **The Philosophical Stalemate:** A proponent of the **Modularity of Mind** (like Jerry Fodor) will look at this data and say: "See? The Security group just lowered their criterion for calling something a snake (Signal Detection Theory). Their *qualia* didn't change."
  *   **The Takeaway:** The value of the game isn't proving CP is true. It's showing why the debate is so hard to settle. If we can't agree on whether we *saw* differently in a classroom, how can neuroscientists settle it with fMRIs?

  ---

  ## Materials Checklist for Instructor
  1.  **Envelopes:** 5 marked "Security" (Red dot inside), 5 marked "Logistics" (Blue dot inside).
  2.  **Cards:** 10 index cards per envelope with random numbers (1-10) and abstract scribbles.
  3.  **Slides:**
      *   Slide 1: Rubin's Vase.
      *   Slide 2: Ambiguous Rope/Snake (search "ambiguous snake rope illusion").
      *   Slide 3: Noise pattern with faint hidden figure (search "camouflage hidden person image").
  4.  **Observer Clipboards:** Printed sheets with columns for "Time," "Vote," "Hesitation (Y/N)," "Confidence (1-5)."
  5.  **Tokens:** 3 Index cards marked "EXEMPTION."

  This design keeps the "magic trick" hidden until the end, forces the students into the phenomenological argument naturally, and respects the 80-minute constraint while leaving room for the crucial theoretical wrap-up.
