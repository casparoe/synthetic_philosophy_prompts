  3. Answering no to whether rational update requires a well-defined evidential partition and whether prior ratios must be preserved across updates that cross ambiguous boundaries, while also answering no to whether ambiguity should be resolved by expanding the frame but yes to whether Jeffrey's rule can legitimately apply to second-order uncertainty about the partition itself, identifies this leaf. This is the Imprecise-Probability View that weights over frames, whose most awkward commitment is that rational belief is often too vague to guide decisive action.

  4. Answering no to whether rational update requires a well-defined evidential partition and whether Jeffrey's rule can legitimately apply to second-order uncertainty about the partition itself, while answering yes to whether prior ratios must be preserved across updates that cross ambiguous boundaries and whether ambiguity should be resolved by expanding the frame, identifies this leaf. This is the Frame-Expanding Contextualist, whose most awkward commitment is that the meaning of propositions shifts whenever the evidential context changes.

