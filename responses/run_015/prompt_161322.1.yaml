      *Wait, the Art/Math tension:* I need to explicitly mention how to manage this. Art kids want beauty; Math kids want precision. The rule "Identical Icons" favors Math. The rule "No Words" favors Art. I need to balance it. "Speed" favors Math. "Clarity" favors Art. I will emphasize that *speed* is a constraint to stop over-arting.

