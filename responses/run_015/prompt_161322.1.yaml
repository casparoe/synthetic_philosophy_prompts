      *   *Art Kids:* Rush them. *Math Kids:* Restrict symbols.
      *   *Talking:* Enforce silence strictly with a penalty (point deduction).

  9.  **Drafting the Content (Iterative refinement):**

      *   *Name:* "The ISOTYPE Protocol" (Don't reveal name yet).
