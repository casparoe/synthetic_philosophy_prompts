      *   *Game Version:* In Round 1, you made rules. In Round 2, you found a contradiction. In Round 3, you must fix the contradiction *without* looking at the room, only by changing your previous drawings.
      *   *Implementation:*
          1.  Round 1: Draw the room's contents.
          2.  Round 2: Facilitator introduces a "Conflict Card" (e.g., "One team drew a chair, one drew a stool. Which is true?").
          3.  Round 3: Teams must agree on a standard *without* checking the physical object. They must revise their "Dictionary" based on consensus, not observation.

