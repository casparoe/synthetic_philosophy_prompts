      *   *Roles:* Encoder, Decoder, Auditor (for the Boat round).
      *   *Scaling:* If only 7 people, everyone is a pair. If 14, two pairs form a "Squad."

      *(Self-Correction on the "Boat" Round)*: The user's specific idea was an Inspector who only receives pictures. Let's use that.
      *   *Round 3:* The "Reality" is sealed in an envelope (prepared by facilitator beforehand). The Teams send Picture Reports. The Inspector (Facilitator or Rotating Student) compares Report to Envelope. *But* to hit the Neurath point, the Inspector must reject the Envelope as "just another picture."
