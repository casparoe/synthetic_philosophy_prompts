answer: |-
  Here is the diagnosis: You are stuck because you are arguing about **ontology** (what things *are*) while the evidence is about **structure** (how things *relate*).

  Your friend (PMI) assumes a theory is a monolithic block: if the *name* of the entity changes (e.g., "ether" to "electromagnetic field"), the *reference* is lost, and the theory is false. You (NMA) assume success implies the *entities* named are real. You are both making the same category error: you think the "truth" of a theory resides in its **noun phrases** (the entities), when the predictive success actually resides in its **verbs and syntax** (the mathematical relations).

  This is not a substantive split about the history of science; it is a conceptual split about **what bears the truth value**. Your friend thinks the *ontological interpretation* bears the truth value. You think the *predictive output* bears the truth value. The reality is that the *structural relations* bear the truth value, and those are distinct from both.

  **The Diagnosis:**
  The impasse is a **Unit of Analysis Mismatch**.
  *   **Friend's Premise:** A theory is "false" if its central entities don't exist (e.g., Phlogiston doesn't exist, so Phlogiston theory is false).
  *   **Your Premise:** A theory is "true" if its predictions work (e.g., Phlogiston theory explained combustion, so it caught something real).
  *   **The Reality:** The *ontology* was wrong (no phlogiston), but the *structure* was right (conservation of mass/energy flows).

  You are trading "False Ontology" (Friend) against "True Prediction" (You). Neither wins because both are correct about different layers of the same cake.

  **What Counts as Progress:**
  Stop arguing about "truth" or "success" in the abstract. Those terms are too loaded. Progress is only possible if you agree to perform a **Structural Audit** on a specific theory change.

  You must pick one historical revolution (e.g., Fresnel's Optics to Maxwell's Electromagnetism, or Newtonian Gravity to General Relativity) and agree to list exactly two columns:
  1.  **Discarded Ontology:** What entities/concepts were thrown out? (e.g., The Luminiferous Ether).
  2.  **Retained Structure:** What equations/mathematical relations survived intact? (e.g., The wave equations).

  **The Condition for Resolution:**
  *   **If you can agree** that the *equations* survived even when the *explanation* changed, the Pessimistic Meta-Induction collapses. It proves that science accumulates *structural knowledge* even if it doesn't accumulate *ontological certainty*. This validates your intuition (science isn't a miracle) without validating your specific claim (that current entities are definitely real).
  *   **If your friend insists** that because the "ether" was removed, *nothing* of value was retained from Fresnel's theory, they are denying the mathematical history. At that point, you give up. They are no longer arguing philosophy; they are arguing against the history of math.

  **The Verdict:**
  Do not try to convince him that current theories are "true." Convince him that **relations are more stable than entities.** If he admits that the *math* from "false" theories often works in "true" theories, the PMI loses its bite. If he refuses to distinguish between the *math* and the *metaphor*, the debate is verbal and you should stop. The impasse isn't hard; it's just looking at the wrong layer of the theory.
