answer: |-
  Here is the plan. It is designed for 35 minutes, high skepticism, and zero fluff.

  ### 1. The Auction Variant: Option C (The "Time-Boxed" Standard)

  Do not run Option B (Sealed). It turns the mechanism into a guessing game about the prize value, which dilutes the lesson about the *payment rule*. Option A (Standard) is the right mechanism, but your worry about the "99-cent smart aleck" is valid. If someone bids $0.99 immediately, the escalation trap never springs.

  **Run Option A with two constraints:**
  1.  **The Prize is $5, not $1.** $1 is trivial enough for engineers to treat as a joke. $5 is enough to trigger "I want to win" without being unethical.
  2.  **The "3-Second Rule."** Once bidding opens, a bidder has 3 seconds to raise or they fold. This prevents strategic sniping (like jumping to $4.90) and forces the *momentum* that creates the trap.

  **Why:** You need them to feel the *heat* of the escalation, not just analyze it. The time pressure prevents the "rational" pre-game calculation and forces them into the local rationality trap ("I'm only 10 cents deeper to win $5").

  ### 2. The Sequence: Desire → Rules → Action → Autopsy

  You guessed that the payment rule must land before the word "auction." **I argue the opposite.** If you lead with "Second place pays their bid," they will not play. You need to establish **Desire** before **Risk**.

  **Order of Operations (Minutes 0–5):**
  1.  **Place the $5 bill on the table.** (Desire).
  2.  **State Rule 1:** "Highest bid wins the $5." (Familiarity).
  3.  **State Rule 2:** "Second-highest bidder pays their bid and gets nothing." (The Trap). **Write this on the whiteboard.**
  4.  **Select Two Volunteers.** Pick two who sit near each other (peer pressure) but aren't friends (competition).
  5.  **Run the Auction.** Enforce the 3-second rule.
  6.  **Stop the Auction.** **Crucial:** As soon as the *combined* bids exceed $5 (e.g., $3.00 vs $2.10), freeze it. Do not wait for exhaustion. The lesson is in the structure, not the endurance.

  **Why this order:** If you explain the penalty first, they opt out. If you explain the prize first, they opt in. Once they opt in, the penalty rule locks them in. This mirrors their projects: they inherited the prize (the launch) before they understood the penalty structure (the political cost of killing it).

  ### 3. The One Case: "The Zombie Inheritance"

  Do not use a generic "project" example. Use the specific situation they are all in right now.

  **The Case:**
  > "You inherited a migration project 4 months ago. It was already 2 months late. You've spent 3 months fixing it. It is now 5 months late.
  >
  > **The Prize:** Shipping the migration (Credit for the launch).
  > **The Bid:** 2 more weeks of engineering time.
  > **The 'Second Bidder' Penalty:** If you kill the project now, you are the manager who 'failed to deliver the inheritance.' You eat the sunk cost *plus* the reputational hit of being the one who pulled the plug. If you push on, you eat the cost, but you might still get the credit."

  **What it must have:** A clear **penalty for withdrawal** that is distinct from the cost of continuation. In their jobs, the penalty is "being the failure." In the auction, the penalty is "paying without winning."
  **What it must lack:** A clear ROI calculation. If the ROI is obvious, it's a math problem. It must be ambiguous, forcing them to rely on the structure.

  ### 4. Misconceptions & Mitigation

  Address these *during* the Autopsy (Minutes 5–15), immediately after the auction stops.

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"This is just the Sunk Cost Fallacy."** | Immediately after bidding stops. | **Correction:** "Sunk cost is a feeling ('I hate losing what I spent'). This auction is a **rule** ('The system charges me for stopping'). In your projects, is the pressure coming from your gut, or from the promotion cycle?" |
  | **"Just set a budget cap / Pre-commit."** | When asking "How do you fix this?" | **Correction:** "A cap is revisable. When you hit the cap, you are *deeper* in the hole. You will renegotiate the cap because stopping now triggers the 'Second Bidder Penalty.' You cannot pre-commit your way out of a structural trap." |
  | **"At $1.10, both sides see it's irrational."** | When bids pass the prize value. | **Correction:** "At $1.10 vs $1.00, the loser pays $1.00. If they bid $1.20, they pay $0.20 net. **Continuing is locally rational.** That is the danger." |
  | **"It's the Winner's Curse."** | If they mention overvaluing. | **Correction:** "The value is known ($5). You aren't overpaying because you misjudged the prize. You are overpaying because the exit door is locked." |
  | **"Backward induction says don't bid."** | Theoretical pushback. | **Correction:** "True. But you didn't start the auction. You inherited the project at Bid #4. Backward induction doesn't help you when you're already in the game." |

  ### 5. The Final Question (Minutes 30–35)

  Do not ask them to solve the problem. Ask them to **diagnose the structure.**

  **The Question:**
  > "I'm going to describe two projects. In both, you are 6 months in, over budget, and success is uncertain.
  >
  > **Project A:** If you kill it, the budget is re-allocated to a new initiative you will lead.
  > **Project B:** If you kill it, the budget is cut, and your team is dissolved.
  >
  > In which case is escalating commitment **structurally rational**, and in which case is it **psychological**?"

  **The Test:**
  *   **Confident-but-Wrong Answer:** "Project B, because the stakes are higher." (This focuses on magnitude, not structure).
  *   **Confident-but-Wrong Answer:** "Neither, because sunk costs are always a fallacy." (This ignores the structural penalty).
  *   **Right Answer:** "Project B is **structural**. The penalty for stopping (team dissolution) exceeds the cost of continuing. Project A is **psychological**. There is no structural penalty for stopping, only the internal feeling of loss."

  **Why this works:** It forces them to identify the *Second Bidder Penalty* (the rule) vs. the *Sunk Cost* (the feeling).

  ### 6. What to Refuse to Explain

  You cannot teach them how to change their company's incentive structure in 35 minutes. If you try, you will lose credibility.

  **Say this explicitly at Minute 34:**
  > "I am not going to teach you how to fix the incentive structure that created Project B. That requires changing how your VP measures success. I am teaching you to recognize when you are in a Dollar Auction so you can stop playing **before** you bid. If you are in a structural trap, the only winning move is to change the game, not to bid higher. I can't give you the authority to change the game today, but I can give you the language to tell your boss: 'This isn't a sunk cost problem, this is an escalation trap.'"

  ### Summary of Whiteboard Usage
  *   **Left Side:** Auction Rules (1. Highest wins. 2. Second pays.).
  *   **Center:** The Bidding Ladder (Draw the bids as they happen, stop when Sum > Prize).
  *   **Right Side:** The Map (Auction Rule = Project Penalty).

  **Final Note on Tone:**
  They are skeptical of leadership training. Do not act like a Guru. Act like a Senior Engineer debugging a system. The "system" is the incentive structure. The "bug" is the escalation clause. You are handing them the logs.
