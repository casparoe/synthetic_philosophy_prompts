answer: |-
  **Research Proposal: Ontological Foundations of Moral Judgement – Individual vs. Distributed Agency in WEIRD and Non-WEIRD Contexts**

  **1. Introduction and Research Question**
  Contemporary moral psychology has become heavily reliant on the WEIRD (Western, Educated, Industrialised, Rich, Democratic) critique. Since the work of Haidt and Henrich, it is well-established that moral *values* diverge across cultures. However, the current literature often treats these divergences as superficial differences in preference or weighting of moral foundations. This proposal argues that the divergence is deeper: it is ontological. The central research question is: *Do WEIRD populations operate with a default ontology of individual agency, whereas non-WEIRD populations operate with a distributed ontology of agency, and does this metaphysical difference explain cross-cultural variance in folk moral judgement without necessitating moral relativism?*

  By shifting the focus from *what* people value to *who* they perceive as acting, this project seeks to bridge moral psychology and the philosophy of action. If moral judgement relies on attributing intent, and cultures differ on where intent resides (inside the skull vs. across a social network), then conflicting judgements may stem from descriptive disagreements about action rather than normative disagreements about the good.

  **2. Background and Limitations of Existing Positions**
  The standard position in moral psychology posits that WEIRD subjects are outliers in their moral reasoning, often prioritising autonomy and harm over community or authority. The counter-position, often from moral realists, argues that despite cultural noise, there are objective moral truths that folk judgements approximate. Both positions leave a significant gap. The psychological account describes the variation but rarely explains the underlying cognitive architecture of 'the agent'. The philosophical account often assumes a universal model of agency (usually individualistic) against which deviations are measured as errors or relativism.

  This project identifies a gap in how agency is conceptualised. If a collectivist culture views an action as emerging from a relational network rather than an individual volition, blaming a single individual might be as category-errorous as blaming a finger for a hand's movement. Existing literature touches on this but usually remains within anthropology. There is a need for a conceptual analysis that brings this ontological distinction into the debate on moral objectivity. If the divergence is ontological, we can maintain moral objectivity while acknowledging that different groups are literally seeing different actions.

  **3. Methodology**
  As this is a philosophy and social science joint honours project, the method will be mixed but theoretical. I will not be conducting empirical fieldwork, as this is beyond the scope of a semester module. Instead, the methodology consists of two parts:

  *   **Conceptual Analysis:** I will analyse the concept of 'agency' in prominent moral psychology texts versus anthropological accounts of relational personhood. This involves reconstructing the implicit premises in WEIRD moral judgement tasks (e.g., trolley problems) to show they presuppose individualistic agency.
  *   **Hypothetical Empirical Framework:** I will sketch a design for a hypothetical cross-cultural study. This will not involve data collection but will demonstrate how the ontology of agency could be operationalised. For example, designing vignettes where intent is explicitly distributed across a group to see if this neutralises the WEIRD/non-WEIRD judgement gap. This serves as a proof-of-concept for future research.

  This approach allows me to answer the research question using available literature while contributing a novel theoretical framewrok for testing the hypothesis.

  **4. Expected Outcomes and Failure Conditions**
  A successful result would be a coherent argument demonstrating that ontological pluralism regarding agency offers a better explanation for moral divergence than value pluralism. Specifically, it would show that when agency is controlled for, moral judgements converge. This would allow for a form of 'ontological relativism' that preserves 'moral objectivity'.

  Failure would look like one of two things. First, if the conceptual analysis reveals that 'distributed agency' is merely a metaphor for social pressure rather than a genuine ontological claim about intent. Second, if the hypothetical framework shows that even when agency is distributed, WEIRD subjects still individualise blame, suggesting the issue is normative (selfishness) rather than metaphysical (ontology). If the distinction collapses under analysis, the project will pivot to discussing why the individualistic ontology is so resilient in Western thought.

  **5. Timeline**
  The project will be completed over a 12-week semester.

  *   **Weeks 1-3:** Literature review. Focusing on philosophy of action and critiques of WEIRD psychology. Narrowing down the definition of 'distributed agency'.
  *   **Weeks 4-6:** Drafting the conceptual analysis section. Mapping the individualistic assumptions in standard moral dilemmas.
  *   **Weeks 7-9:** Developing the hypothetical empirical framework. Writing up the proposed vignette structures and predicted outcomes.
  *   **Weeks 10-11:** Writing the discussion on moral objectivity vs. relativism. Integrating feedback from tutor.
  *   **Week 12:** Final edits and proofreading. Ensuring teh argument flows logically and checking formatting.

  **6. Significance**
  This project moves beyond the stalemate of "everyone has different values" vs. "there is one true morality". By locating the difference in the ontology of the agent, it offers a way to understand cross-cultural moral conflict as a misunderstanding of action rather than a clash of values. This has implications not just for academic theory, but for how international policy and legal frameworks attribute responsibility across cultural boundaries.
