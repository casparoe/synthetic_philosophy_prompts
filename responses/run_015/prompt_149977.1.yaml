  2.  **Deconstruct the Theory (Herbert Simon):**
      *   *Bounded Rationality:* Agents lack the cognitive capacity to optimize; they satisfice.
      *   *Satisficing:* Searching until an option meets an aspiration level, then stopping.
      *   *Aspiration Level:* Adjusts based on experience (lowers if success is rare, raises if success is easy).
      *   *Cognitive Cost:* Search itself has costs; optimization is often not worth the computational effort.
