  Prior to initiating any search sequence, the User must complete the Adequacy Threshold Disclosure Form. This document requires the listing of minimal acceptable criteria for the decision at hand. By signing, the User legally acknowledges that any option surpassing these criteria will be disregarded as surplus to requirements. Selecting an option significantly superior to the threshold is discouraged, as the marginal utility gain does not justify the computational expense of identifying said superiority. The Platform is not liable for losses incurred by rejecting superior options deemed cognitively expensive to verify.

