answer: |-
  **Speech Draft**

  Good evening.

  My wife tells me I have become insufferable. She says four years of philosophy seminars have ruined me for decent conversation. She may be right. But it is why I am standing here.

  Next month, this department closes. We become an Institute for Integrative Systems Biology. The Pro-Vice-Chancellor fought hard for that title. He wanted the word "Emergent" in the grant application. He is sitting right there. He knows what he bought.

  But look around the room.

  To my left, the biochemists. You want the mechanism. You want the atoms. You suspect "emergence" is a word people use when the chemistry gets too hard.

  To my right, the systems biologists. You think reductionism is a twentieth-century fetish. You are bored of being told to go and find the mechanism.

  And in the middle, the rest of us. Spouses. Grandchildren. Undergraduates. They deserve seven minutes that do not require a degree to understand.

  So I will not give you a warm bath. I will not tell you that everyone is right. Everyone is not right.

  I want to talk about allostery.

  I spent thirty-five years on it. We know the structures. We know how the subunits move. We argued for decades about whether they flip all at once, or one by one. We have the coordinates. We have the rates.

  Now, ask a simple question. Can we predict the behaviour of the whole enzyme from the physics of the parts?

  The answer is yes. And the answer is no.

  It is yes, because the atoms obey the laws of physics. Nothing magical happens when they assemble. There is no extra force.

  It is no, because you cannot actually do the calculation.

  This brings me to a distinction. I have two names for it.

  The first is *Bookkeeping Emergence*.

  Imagine you are mapping a city. You could list every brick in every wall. Or you could draw a street map. The street map is a re-description. It is a filing system. You could, in principle, rebuild the map from the brick list. But it is inconvenient. So we use the map. It says nothing extra about the world. It just helps us find the station.

  Some people think this is all emergence is. A convenient shorthand. A way to stop us drowning in data.

  The second is *Obstruction Emergence*.

  Here, the derivation from below exists. It is true in principle. But it is not available to any creature like us.

  To calculate the traffic flow from the mental state of every driver would take longer than the journey itself. To predict the enzyme's switch from the atomic coordinates requires more precision than the system will hold still for. The math works in a bloodless sense. But in the real world, the road is blocked.

  So, where does allostery fall?

  It falls on the side of Obstruction.

  We have the structures. But the functional description at the level of the whole assembly has not gone away. It has not collapsed into a derivation. Why? Because the path from the bottom is obstructed. It is too complex. It is too sensitive. It transfers nothing to the next enzyme.

  This is honest. It avoids the trap.

  I am not saying the whole is more than the sum of its parts. I do not believe that.

  I am not saying emergence is vitalism with a grant number. That would insult my friends on the right.

  I am saying something about us.

  Is this cut in nature? Or is it in us?

  I must be straight. It is a cut in us.

  It costs me something to admit that. It means emergence is not a new force of nature. The PVC did not discover a new particle.

  But it also costs the biochemists something. It means you will not solve this by better mass spectrometry. You will not get there by grinding harder on the parts. The obstruction is robust. It is not a failure of technology. It is a feature of our relationship with complex systems.

  So, what is the new Institute for?

  It is not for reducing everything to atoms. We know how to do that.

  It is not for waving hands at "emergent properties" as if they were magic. We know that is nonsense.

  It is for mapping the obstructions.

  Find where the bottom-up road closes. Find where the re-description becomes indispensable. Find the places where the calculation takes longer than the phenomenon lasts.

  That is work. That is science. It respects the chemistry. It respects the system. And it does not lie to the undergraduates.

  We are not here to worship the parts. We are not here to worship the whole. We are here to measure the distance between them.

  So, please raise your glasses.

  I propose a toast.

  To the obstructions. May we find them. May we map them. And may we never pretend they are not there.

  ***

  **Post-Speech Note: Vulnerabilities and Costs**

  You asked for honesty about the distinction's weaknesses and the cost of using it. Here is the assessment.

  **1. The Moving Goalpost of Computation**
  Your definition of *Obstruction Emergence* relies on the calculation being "not available to any creature like us." This is an epistemic claim (about knowledge), not an ontological one (about reality). The weakness here is technological drift.
  *   **The Risk:** A hard-nosed computational biologist in ten years might say, "We just simulated that enzyme end-to-end using quantum computing. Your obstruction is gone."
  *   **The Concession:** By framing it this way, you tie the validity of the higher-level description to current computational limits. If the limits move, your philosophical defence of the Institute's mission shrinks. You are betting on complexity outpacing computing power indefinitely.

  **2. The "Cut in Us" Disappointment**
  You explicitly state the cut is in *us*, not nature.
  *   **The Cost to the PVC:** The Pro-Vice-Chancellor likely wants "Emergence" to be a selling point, a *thing* the Institute discovers. By admitting it's a limitation of human cognition/calculation, you deflate the brand. You've told him he funded a study of human limitations, not a new law of biology.
  *   **The Cost to the Chemists:** Conversely, some reductionists hold out hope that *everything* is ultimately Bookkeeping—that if we were smart enough, the "whole" would dissolve entirely into the "parts." By validating Obstruction as robust, you tell them they will never finish their project. That is a hard pill for a mechanist to swallow.

  **3. The "Bloodless Sense" Ambiguity**
  You say the derivation exists in a "bloodless sense."
  *   **The Weakness:** A philosopher (or a pedantic physicist) will ask: In what sense does it exist if it cannot be instantiated? If a derivation requires more precision than the Heisenberg limit allows, or more time than the universe has left, does it *actually* exist?
  *   **The Concession:** You are walking a line between mathematical platonism and physical realism. If pressed, you might have to concede that for all practical purposes (FAPP), the derivation *doesn't* exist, which strengthens the Obstruction claim but weakens the "it's true in principle" defence you use to keep the chemists on side.

  **4. The Toast's Edge**
  The toast ("To the obstructions") is honest, but it frames the Institute's mission as studying *failures* of reductionism rather than *successes* of integration.
  *   **The Risk:** It sounds slightly defeatist. "We study where we get stuck."
  *   **The Mitigation:** You counter this in the speech by calling it "work" and "science," but be prepared for the optimists in the room to feel you've framed their future as a catalogue of dead ends rather than new beginnings.

  **Summary**
  The distinction holds up well for a dinner speech because it avoids metaphysical fluff. However, it grounds the Institute's legitimacy in human limitation rather than natural complexity. This is intellectually honest, but politically riskier than the usual "synergy" rhetoric. You are trading diplomatic safety for philosophical integrity. Given your constraints, that is the correct trade.
