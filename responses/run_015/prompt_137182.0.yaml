  So your dilemma does not cut me. I happily accept the first horn: similarity must be perceivable by *you* for *upamāna* to fire, precisely because the knowledge produced is *your* recognition of the name-object link via that likeness. The app's hidden feature-space similarity is causally relevant to the app, but epistemically inert for you until you see the likeness yourself. The irreducibility of *upamāna* stands because only it explains how you learn a meaning through seeing a likeness, rather than deducing a fact from a sign or accepting a statement from a person. Here is what you must settle: when you finally look at the animal after the app identifies it, do you know it is a *gavaya* because you see its cow-like shape yourself, or only because you trust the phone's label?
