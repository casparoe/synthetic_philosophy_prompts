answer: |-
  # JOINT STATEMENT ON THE PARADOX OF DEONTOLOGY
  **Signed by:** The Structural-Threshold Deontology Working Group & The Binary-Constraint Deontology Working Group
  **Date:** October 26, 2023
  **Subject:** Findings of Adversarial Collaboration regarding Agent-Relative Constraints and Extreme Cases

  ## I. AGREED CLAIMS

  1.  **The Formal Structure of Deontological Reasons:** We agree that deontological reasons function fundamentally as side-constraints on action rather than as weights within a aggregative calculus. To treat a deontological prohibition (e.g., against killing an innocent) as merely a negative value to be outweighed by sufficient positive value (e.g., saving lives) is to misunderstand the agent-relative nature of the duty. The constraint attaches to the *agency* of the moral actor, restricting what they may do, not merely what they may bring about.

  2.  **The Precise Formulation of the Paradox:** We agree that the "Paradox of Deontology" arises when an absolute or near-absolute constraint against performing a specific kind of wrongful act (e.g., murdering one innocent person) appears to mandate permitting an outcome that contains a significantly greater quantity of wrongness of the same or related kind (e.g., five innocent persons being murdered by a third party). The paradox highlights the tension between the goal of minimizing rights-violations in the world and the duty to maintain the integrity of one's own moral agency.

  3.  **Moral Distinctions in Harm:** We agree that any adequate resolution must preserve the moral significance of the distinction between *intended harm* (as a means or end), *foreseen but unintended harm* (as a side-effect), and *harm permitted through omission* (failure to prevent). Collapsing these distinctions into a single metric of "suffering" or "rights-violations" obscures the specific normative force of the prohibition against direct violation.

  4.  **Rejection of Consequentialist Dissolution:** We share the judgment that a straightforward consequentialist dissolution of the paradox—treating the constraint as merely one cost among others in a maximization function—fails to preserve what is distinctive about deontological moral reasoning. Such a dissolution eliminates the "agent-centered restriction" that prevents an individual from being used merely as a resource for the greater good, thereby ceasing to be deontological in any meaningful sense.

  ***

  ## II. DISAGREEMENTS TABLE

  | Issue | Structural-Threshold Formulation (STD) | Binary-Constraint Formulation (BCD) | Crux: Case, Argument, and Predicted Verdicts |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of the Limit** | Deontological norms contain a hidden, non-aggregative scaling parameter. The constraint does not break; rather, its normative structure *transforms* when harm reaches a structurally defined magnitude (a catastrophe threshold). Below the threshold, the constraint is lexically prior; above it, the nature of the permission changes. | Deontological norms are binary. A constraint is either valid or it is not. If a norm appears to yield in extreme cases, it is not because of a scaling parameter, but because the act description changes or a conflicting duty of a different category (e.g., defense of others) becomes operative. The constraint itself does not possess a "breaking point." | **Case:** *The Geometric Rescue.* An agent can violate one prohibition (killing 1 innocent) to prevent a third party from killing $N$ innocents. $N$ increases geometrically (5, 25, 125, 10,000).<br><br>**Argument:** Does the permission to act emerge gradually or at a sharp limit?<br><br>**STD Verdict:** At $N=10,000$, the structural threshold is crossed; the prohibition transforms into a permission to minimize catastrophic violation.<br>**BCD Verdict:** At $N=10,000$, the act is still prohibited *as a violation*, but the agent may be excused, or the act is re-described as "stopping a murderer" where the death is foreseen side-effect, not intended means. |
  | **2. Hierarchy of Constraints** | The permission of catastrophic harm to avoid a single prohibited act reveals a latent hierarchy among constraints. There is a meta-norm that ranks the duty to prevent catastrophe above the duty to maintain personal purity in specific, extreme contexts. | There is no hierarchy among constraints, only a distinction between *doing* and *allowing*. Permitting catastrophe does not reveal a hierarchy; it reveals the limit of an agent's responsibility. The constraint against *my* killing remains absolute; the deaths caused by others are not *my* violations to prevent via violation. | **Case:** *The Multi-Agent Threat.* Five agents are each about to kill one innocent. You can kill one innocent to psychologically disrupt the five, saving the five victims.<br><br>**Argument:** Is the wrongness of 5 deaths by 5 agents comparable to 1 death by you?<br><br>**STD Verdict:** The meta-norm prioritizes minimizing total rights-violations when the disparity is vast; the hierarchy permits the 1 death.<br>**BCD Verdict:** The 5 deaths are not *your* agency. Your constraint remains absolute. To kill the 1 is to become a murderer, regardless of the others' actions. |
  | **3. Source of the Paradox** | The paradox is an artifact of misapplying binary logic to graded moral reasons. Moral reality admits of degrees of urgency; insisting on binary constraints creates a false dichotomy between "forbidden" and "obligatory" that ignores the nuance of extreme necessity. | The paradox is a genuine feature of moral rationality. It reflects the tragic structure of a world where maintaining moral integrity does not guarantee the best outcomes. Binary logic is required to capture the distinctness of agency; removing the paradox removes the moral tragedy inherent in responsibility. | **Case:** *The Logical Form of Permission.* Analyzing the statement "You are permitted to X."<br><br>**Argument:** Does "permitted" mean "not forbidden" or "morally optimal"?<br><br>**STD Verdict:** "Permitted" implies the reason against X has been outweighed by the structural shift; the paradox vanishes when logic is graded.<br>**BCD Verdict:** "Permitted" implies the constraint does not apply. If the constraint applies, it is forbidden. The paradox remains because the world offers no clean option, only the choice to remain innocent or save lives. |

  ***

  ## III. ANALYSIS OF VERBAL VS. SUBSTANTIVE DISPUTE

  Upon review, we identify that a portion of our dispute is verbal rather than substantive, specifically regarding the description of **moral integrity** and **constraint satisfaction**.

  1.  **Equivalent Descriptions:**
      *   **BCD Terminology:** "Honoring the constraint." For the Binary-Constraint Deontologist, this means strictly refraining from the prohibited act-type regardless of consequences.
      *   **STD Terminology:** "Respecting the reason." For the Structural-Threshold Deontologist, this means giving the reason its due weight, which includes recognizing that in catastrophic contexts, "respecting the reason" may structurally require minimizing total violations.
      *   **Equivalence:** Both camps agree that the agent must not treat the prohibition lightly. When the STD claims they are "respecting the reason" by crossing the threshold, and the BCD claims they are "honoring the constraint" by refusing to cross it, both are attempting to preserve the **inviolability of the person**. The BCD locates inviolability in the agent's own hands (I must not violate); the STD locates inviolability in the global moral order (Violations must be minimized when catastrophic).

  2.  **Substantive Remainder:**
      *   Despite this verbal overlap, a substantive disagreement remains regarding the **logic of moral permission**. The BCD maintains that if an act is prohibited, it is irrational to perform it, even to prevent similar acts by others. The STD maintains that rationality itself shifts at the threshold, making the act not merely "excusable" but "permissible."
      *   This is not merely semantic. It affects the **guidance function** of morality. If the BCD is correct, moral guidance must remain rigid to prevent slippery slopes. If the STD is correct, moral guidance must be sensitive to magnitude to prevent moral disaster. We agree that this substantive divergence turns on empirical and metaphysical claims about whether moral reasons *can* change type based on magnitude, a question this collaboration has clarified but not resolved.

  **End of Statement**
