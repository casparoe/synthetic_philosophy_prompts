          *   Crux: Logical form of moral permission.

      *Refining the Crux:* The prompt asks for a "concrete case or structural argument... plus each camp's predicted verdict or inference." I need to make sure the "Multi-Agent Rescue Scenario" is specific enough. Let's use a scenario where one violation prevents $N$ violations by others or prevents $N$ deaths.

  5.  **Drafting the Verbal vs. Substantive Analysis:**
