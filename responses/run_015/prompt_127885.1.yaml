answer: |-
  The principle that best captures the pattern of your intuitions is **The Merited Response Account of Ethical Criticism**.

  **The Principle:**
  A work of art is artistically flawed if and only if it prescribes an ethical response (e.g., admiration, sympathy, relish) that is unmerited by the object of that response. Conversely, ethical properties affect artistic value only when they are **internalized** within the work's structure—meaning they shape the audience's engagement with the text, image, or sound. Ethical defects in the artist's biography, private beliefs, or production history are artistically irrelevant *unless* they manifest within the work's prescribed experience.

  This principle unifies your cases by distinguishing between **external contamination** (biography, private belief, production abuse) and **internal integration** (narrative content, thematic purpose, prescribed emotional uptake).
  *   **Cases 2, 4, and 6 (Abusive Filmmaker, Cruel Composer, Vile Beliefs):** The immorality is external. The work prescribes compassion or beauty, which are merited responses. The art remains intact.
  *   **Cases 3 and 5 (Cruel Painting, Propaganda Film):** The immorality is internal. The painting prescribes relish in cruelty; the film prescribes dehumanization. These are unmerited responses. Therefore, the works are artistically flawed.

  **The Verdict I Cannot Accommodate:**
  I must explicitly state that this principle cannot fully accommodate your verdict on **Case 1 (The Plagiarist Novelist)** without significant qualification. You judge the novel as "good art, though diminished as an achievement."

  **Why it fails:**
  On the Merited Response Account, artistic value is tied to the *merit* of the audience's response. A central part of the aesthetic response to literature is admiration for the author's creativity and voice. If the work is plagiarized, that admiration is based on a falsehood; the response is *unmerited* because the author did not generate the style or insight. While you separate "artistic value" from "achievement," my principle suggests these are inseparable in literature: the art *is* the achievement of communication. If the communication is a deception (plagiarism), the aesthetic contract is broken, and the work is not merely a "diminished achievement" but an **aesthetically flawed object** (a forgery of expression). Your intuition tries to preserve the object's value while condemning the act; my principle argues the act's immorality (deception) penetrates the object's value because the object *is* an act of communication.

  **Application to the Documentary Case:**
  *Case:* A documentary made by exploiting suffering subjects, where the final film critically exposes that very exploitation.

  **Prediction:**
  According to the Merited Response Account, this documentary is **artistically successful (good art)**, despite the immoral production history.

  **Reasoning:**
  1.  **Production History (External):** The exploitation of subjects is an ethical defect in the *origin*, similar to the abusive filmmaker in Case 2. Since this exploitation is not celebrated or hidden within the text, but rather exists in the production context, it does not inherently prescribe an unmerited response to the viewer *through the form*.
  2.  **Content and Purpose (Internal):** The film's content *critically exposes* the exploitation. Therefore, the response the film prescribes is not "relish in suffering" (which would be unmerited), but rather "moral outrage at the exploitation" and "critical reflection on documentary ethics."
  3.  **Merited Response:** Anger at exploitation is a **merited** ethical response. Because the film's internal structure aligns the audience's emotional uptake with a morally correct judgment (that the exploitation was wrong), the ethical property of the content *enhances* the artistic value.

  **Conclusion:**
  The documentary transforms the immoral origin into moral insight. Unlike the Propaganda Film (Case 5), where form and immoral purpose were inseparable, here the form serves a *moral* purpose (exposure) even if the production was unethical. The work is artistically coherent and prescribes merited responses. We may condemn the filmmaker personally (as in Case 4), but the work itself stands as a successful, perhaps even profound, piece of art.
