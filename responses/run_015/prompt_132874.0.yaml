answer: |-
  Here is the diagnosis: **The stall is substantive, not verbal.** It is not merely a clash of formalisms or a confusion between "causal history" and "rational justification." It is a fundamental incompatibility between **epistemic requirements** (Lewis) and **causal mechanisms** (Evolutionary Game Theory) regarding how agents access equilibrium during a transition.

  My definite position is this: **Lewis's account is structurally incapable of explaining norm evolution because his condition of "common knowledge" creates an epistemic bottleneck that cannot be crossed during a transition phase.** Evolutionary models solve this by bypassing the need for reasoning entirely. The "latent convention" problem is the smoking gun that proves these are not just different descriptions of the same thing; they are competing hypotheses about cognitive architecture.

  Here is the defense of that position, followed by exactly what would move the needle.

  ### 1. The Diagnosis: Epistemic Overload vs. Causal Flow
  The literature stalls because Lewisians try to absorb evolutionary dynamics into rational choice theory by claiming that "asymptotic stability" is just "long-run rationality." This is false.

  *   **Lewis (Static/Rational):** A convention exists *only if* agents have common knowledge of the regularity and the preferences supporting it. This is a high-bandwidth epistemic state. It explains why, once we are *at* equilibrium $E_1$, we stay there.
  *   **Evolutionary (Dynamic/Causal):** A convention exists if the population distribution rests in a basin of attraction. Agents need not know *why* they are doing it, nor do they need to know that others know. They just follow a rule (imitate success, stick if it works).

  **The Substantive Clash:**
  When a payoff structure shifts slowly (e.g., technology changes the cost of driving on the left vs. right), a Lewisian agent must *reason* their way to the new equilibrium. They must form a belief that others will shift, know that others know they will shift, etc.
  An evolutionary agent simply experiences a stochastic shock (a "mutation" or error) that pushes the population out of the old basin and into the new one.

  If the Lewisian account were sufficient, norm change would require a moment of collective rational insight. If the Evolutionary account is correct, norm change can happen through blind drift and local imitation without anyone understanding the new global payoff structure. These are empirically distinct claims about human cognition.

  ### 2. The "Latent Convention" Smoking Gun
  You mentioned "latent conventions"—norms nobody follows but which shape counterfactuals. This is where the verbal defense falls apart.

  *   **For Lewis:** A latent convention is a *propositional attitude*. It exists in the heads of the agents as a shared counterfactual belief ("If we were in situation $S'$, we would do $R'$"). If the agents cannot articulate or reason through this counterfactual, the latent convention *does not exist* in the Lewisian sense.
  *   **For Evolution:** A latent convention is a *topological feature*. It is a nearby equilibrium with a large basin of attraction. It exists in the structure of the game, regardless of whether agents can reason about it.

  **Why this matters:**
  If real-world norms shift because people suddenly "realize" a latent alternative (Lewis), we should see correlated changes in explicit reasoning and discourse prior to the shift.
  If real-world norms shift because of cumulative drift or stochastic shocks (Evolution), we should see behavioral change *preceding* rationalization. People switch, then invent the reason why.
  The literature stalls because Lewisians assume the reasoning comes first (justification), while Evolutionists observe the behavior comes first (causation). These cannot be reconciled by saying "they are the same thing." One posits a cognitive mechanism the other explicitly denies is necessary.

  ### 3. What Would Move the Needle?
  You asked for concrete steps. Conceptual distinctions won't fix this; we need to break the theoretical deadlock. A formal result showing evolutionary dynamics can't reach certain equilibria is useless because we know they *can* (replicator dynamics cover Lewisian equilibria). Admitting the question is ill-posed is cowardly; the question is sharp, the answers are conflicting.

  Here is the specific intervention that would resolve the stall:

  **The "Epistemic Bottleneck" Experiment.**
  We need an experimental design that isolates the **common knowledge requirement** during a transition.

  *   **Setup:** Create a coordination game in a lab with a established convention (Equilibrium A). Slowly alter the payoffs so that Equilibrium B becomes superior, but keep the risk of miscoordination high (stag hunt structure).
  *   **Condition 1 (Lewisian):** Allow cheap talk and public announcements. Enable agents to build common knowledge of the shift.
  *   **Condition 2 (Evolutionary):** Disable communication. Agents only see the history of play (imitation dynamics).
  *   **The Test:** Measure the *speed and probability* of the transition from A to B.

  **The Decisive Outcome:**
  *   **If Lewis is right about evolution:** Condition 2 should fail or stall indefinitely. Without the ability to form common knowledge of the new counterfactual, rational agents should remain stuck in the inferior equilibrium because the epistemic conditions for the new convention are not met.
  *   **If Evolution is right about evolution:** Condition 2 should eventually succeed via stochastic drift (mutations/errors), even without common knowledge. The transition will be slower but inevitable based on basin size, not reasoning.

  **Why this moves the needle:**
  Current literature assumes Condition 2 is just "noisy Lewis." It isn't. If Condition 2 succeeds where Condition 1 is blocked (or vice versa), it proves that **reasoning and selection are distinct causal pathways for norm change.**

  ### 4. Conclusion
  Stop treating Lewis and Evolutionary accounts as complementary formalisms. They are competing causal theories.
  *   Lewis claims norm change is driven by **epistemic updates** (reasoning about salience and payoffs).
  *   Evolution claims norm change is driven by **population dynamics** (selection and drift).

  The "stall" exists because philosophers want norms to be rational (Lewis) but sociologists observe them to be historical (Evolution).
  **My verdict:** The Evolutionary account subsumes the Lewisian account for *genesis*, but the Lewisian account remains necessary for *maintenance* in high-stakes, high-cognition environments.
  **The fix:** Acknowledge that Lewis explains **Normative Stability** (why I *should* keep doing this), while Evolution explains **Behavioral Transition** (why we *started* doing this). The error is trying to use Lewis to explain the transition.

  If you want to end the stall, stop asking "Is Lewis compatible with Evolution?" and start asking "Under what specific cognitive loads does the Lewisian epistemic bottleneck prevent the Evolutionary basin shift?" That is an empirical question, not a philosophical one, and it is the only one that matters.
