  ### NEW MEMBER QUIZ (6 Questions)

  **Goal:** Help members identify which sense of "native" they instinctively use.

  **Q1.** You find a Joe-Pye Weed at a nursery. It is the correct species, but bred in Europe for shorter stems. You plant it. Is your garden "native"?
  *   A) Yes, it's the right species.
  *   B) No, it's a cultivar.
  *   C) Yes, if the bees like it.

  **Q2.** Your neighbor gives you Hosta starts from Vermont. You live in Michigan. Are they native?
  *   A) Yes, same continent.
  *   B) No, humans moved them.
  *   C) Yes, if they survive the winter.

  **Q3.** A plant species was not recorded here in 1800 but is walking north due to climate change. Is it native now?
  *   A) No, it wasn't here at the baseline.
  *   B) Yes, it arrived without human help.
  *   C) Who cares, is it helping pollinators?

  **Q4.** You are selling seeds. You collected them locally, but don't know the genetics. Do you label them "Native"?
  *   A) Yes, species matches.
  *   B) No, I can't prove genotype.
  *   C) Yes, but I add "locally collected" with a question mark.

  **Q5.** Someone says "Keep Michigan Native." How does that sound?
  *   A) Like a botanical guideline.
  *   B) Like a boundary against outsiders.
  *   C) Like a vague slogan.

  **Q6.** We argue about "native" constantly. What should we do?
  *   A) Define it stricter.
  *   B) Stop using the word; say "locally adapted."
  *   C) Let everyone use their own definition.

  **Scoring Key:**
  *   **Mostly A:** **The Time-Capsule Gardener (Baseline).** You care about species lists and historical presence.
  *   **Mostly B:** **The Zero-Footprint Purist (No-Human/Genotype).** You care about human agency and genetic purity.
  *   **Mostly C:** **The Functionalist (Ecological).** You care about outcomes, not origins.
  *   **Mixed A/B:** **The Genotype Localist.** You want the right plant from the right place.
  *   **Mostly B (Q5):** **The Gatekeeper.** Watch out for exclusionary language.
  *   **Mostly C (Q6):** **The Precisionist.** You want to retire the word.

  **Discrepancy Note:** The Quiz sorts *people* by instinct; the Mod Tree sorts *posts* by claim type. A "Functionalist" person (Quiz) might write a post that looks like a "Baseline" claim (Tree) because they are asking a question. The Quiz assumes consistency; the Tree assumes context. The Quiz Q4 Option C maps to Leaf F (Marketplace), but the Tree routes sellers differently. The Quiz is diagnostic; the Tree is regulatory.
