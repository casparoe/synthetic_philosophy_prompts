answer: |-
  ### SCRATCH BRAINSTORM (Delete Later)

  1.  **Referent Scope:** Is the word attached to a biological taxon (species/genus) or a practice/vibe/method (e.g., "native gardening")?
  2.  **Agency of Arrival:** Did the organism arrive via human transport (intentional or accidental) or natural processes (range shift, wind, animal)?
  3.  **Temporal Baseline:** Is the cutoff date pre-settlement (e.g., 1800), pre-human impact, or current moment?
  4.  **Genetic Precision:** Does the label require local ecotype/genotype or just species-level identity?
  5.  **Functional Weight:** Does current ecological performance (pollinator support) override historical origin?
  6.  **Speech Act Type:** Is the word describing a verifiable fact, selling a product, or signaling group belonging/virtue?

  ***

  ### LOGICAL SPACE MAPPING

  Before building the tree, we map the combinations allowed by the axes above to see where our required positions sit and where the empty cells are.

  | Cell | Agency | Baseline | Genetics | Function | Occupied Position | Diagnosis of Empty/Adjacent Cells |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Natural | Pre-1800 | Species | Low | **Baseline Purist** | |
  | **2** | Natural | Pre-1800 | Genotype | Low | **Local-Provenance** | |
  | **3** | Natural | Current | Species | High | **Ecological-Function** | |
  | **4** | Human | Pre-1800 | Species | Low | **Cultivar-Tolerant** | *Adjacent Cell (Human/Current/Species):* **Unattractive.** Implies invasive species become native if old enough. |
  | **5** | Human | Pre-1800 | Genotype | Low | **Marketplace-Label** | *Adjacent Cell (Human/Current/Genotype):* **Incoherent.** If human moved it recently, local genotype is impossible by definition. |
  | **6** | Natural | Current | Species | High | **Range-Shift (Merged into Function)** | *Empty Cell (Natural/Pre-1800/Genotype/High):* **Unoccupied.** Nobody cares about genotype if it's purely functional. |
  | **7** | Human | None | None | None | **No-Human-Transport** | *Empty Cell (Human/Pre-1800/None/None):* **Incoherent.** If human moved it, it fails the "No-Human" test immediately. |
  | **8** | N/A | N/A | N/A | N/A | **Belonging/Identity** | *Empty Cell (Taxon/Fact/None):* **Deflationary.** Refuses to play the game. |
  | **9** | Non-Taxon | N/A | N/A | N/A | **Halo/Deflationary** | *Empty Cell (Non-Taxon/Specific Claim):* **Incoherent.** You cannot make empirical claims about "native compost." |

  **Diagnosis of Empty Cells:**
  *   **Human/Current/Species:** Unattractive. This legitimizes invasive species simply by waiting enough time (the "future native" argument), which creates policy paralysis.
  *   **Human/Current/Genotype:** Incoherent. You cannot have a local genotype if a human brought it from 800 miles away last year.
  *   **Non-Taxon/Specific Claim:** Incoherent. "Native" requires a biological referent to be empirically checkable; applying it to methods makes it purely normative.

  ***

  ### MODERATION DECISION TREE

  **Instructions for Mods:** Process one post at a time. Do not read replies unless the post explicitly references them. If a branch requires context you do not have, flag for "Context Review."

  **Q1.** Does the word "native" in this post attach to a specific plant, species, or biological organism?
  *   **No:** Go to Q2.
  *   **Yes:** Go to Q3.

  **Q2.** Is the post using "native" to describe a gardening method, aesthetic, or vibe (e.g., "native compost," "native vibes")?
  *   **Yes:** Go to Q9.
  *   **No:** (Word is used but referent is unclear) Go to Q10.

  **Q3.** Does the post explicitly state or imply the plant was moved by a human hand from elsewhere?
  *   **No:** Go to Q4.
  *   **Yes:** Go to Q5.

  **Q4.** Does the post argue the plant arrived recently without human help (e.g., range shift, walked north)?
  *   **No:** (Assumes historical presence) Go to Q6.
  *   **Yes:** Go to Q7.

  **Q5.** Was the plant moved from within the same continent but a different region (e.g., bucket from 800 miles east)?
  *   **No:** (Imported from overseas/different continent) Go to Q8.
  *   **Yes:** Go to Q6.

  **Q6.** Does the post specify a named cultivar (e.g., bred for shorter stems, specific color)?
  *   **No:** Go to Q7.
  *   **Yes:** Go to Q8.

  **Q7.** Does the post claim knowledge of the specific genotype or local collection site?
  *   **No:** Go to Q11.
  *   **Yes:** Go to Q12.

  **Q8.** Does the post argue the plant counts as native *despite* the breeding or origin?
  *   **No:** (Acknowledges it might not be) Go to Q11.
  *   **Yes:** (Insists it counts) Go to Q13.

  **Q9.** Does the post suggest we should stop using the word for non-plant things?
  *   **No:** Go to Q10.
  *   **Yes:** Go to Leaf H.

  **Q10.** Is the word "native" being used to describe a person, a community boundary, or a moral standing?
  *   **No:** Go to Leaf H.
  *   **Yes:** Go to Q14.

  **Q11.** Is the post asking a question about classification or stating a fact?
  *   **Asking:** Go to Leaf F.
  *   **Stating:** Go to Leaf A.

  **Q12.** Does the post imply that non-local genotypes are harmful or wrong?
  *   **No:** Go to Leaf B.
  *   **Yes:** Go to Leaf C.

  **Q13.** Does the post prioritize ecological function (pollinators doing fine) over origin history?
  *   **No:** Go to Leaf D.
  *   **Yes:** Go to Leaf E.

  **Q14.** Does the post use "native" to exclude members or signal superiority (e.g., "Keep Michigan Native")?
  *   **No:** Go to Leaf G.
  *   **Yes:** Go to Leaf G.

  ***

  ### LEAVES (Dispositions & Commitments)

  **Leaf A: The Time-Capsule Gardener (Baseline Purist)**
  *   **Awkward Commitment:** You must accept that pre-settlement landscapes were managed by indigenous fire, not "empty land."
  *   **Disposition:** **Allow.** (Empirical claim, potentially wrong but good faith).

  **Leaf B: The Genotype Localist (Local-Provenance)**
  *   **Awkward Commitment:** You must treat a plant grown from seed collected 50 miles away as potentially "not native" compared to one from 5 miles away.
  *   **Disposition:** **Allow.** (High standard, but checkable).

  **Leaf C: The Zero-Footprint Purist (No-Human-Transport)**
  *   **Awkward Commitment:** You must classify your own garden as artificial if you ever planted a seed, even if it was local.
  *   **Disposition:** **Warn.** (Often leads to gatekeeping behavior; remind that restoration involves human transport).

  **Leaf D: The Horticultural Pragmatist (Cultivar-Tolerant)**
  *   **Awkward Commitment:** You must accept that a plant bred in Europe for shorter stems is ecologically equivalent to a wild straight species.
  *   **Disposition:** **Allow.** (Common market reality; flag if sold as "straight species").

  **Leaf E: The Functionalist (Ecological-Function)**
  *   **Awkward Commitment:** You must accept that Dame's Rocket or other naturalized invasives might be "native enough" if pollinators use them.
  *   **Disposition:** **Allow.** (Value claim, but productive for discussion).

  **Leaf F: The Honest Broker (Marketplace-Label)**
  *   **Awkward Commitment:** You are selling a label you cannot verify (e.g., "locally collected" without genotype data).
  *   **Disposition:** **Flag for Verification.** (Requires seller to clarify uncertainty in listing).

  **Leaf G: The Gatekeeper (Belonging/Identity)**
  *   **Awkward Commitment:** You are defining community membership based on plant choices rather than botanical facts.
  *   **Disposition:** **Remove & DM.** (Identity-exclusion violates community safety guidelines).

  **Leaf H: The Precisionist (Deflationary/Halo)**
  *   **Awkward Commitment:** You must retire a useful shorthand word and replace it with longer, clunkier phrases (e.g., "locally adapted").
  *   **Disposition:** **Move to Meta.** (Philosophical discussion, not for main queue).

  ***

  ### TREE LIMITATIONS & CONTEXT FLAGS

  **Inseparable Leaves:**
  *   **Leaf A (Baseline) vs. Leaf C (No-Human-Transport):** The tree separates these based on Q3 (Human Transport). However, in practice, a Baseline Purist often slides into No-Human-Transport rhetoric when discussing "contaminated" sites. If a post says "Human moved it, so it's not native," it hits Leaf C. If it says "It wasn't here in 1800, so it's not native," it hits Leaf A. The distinction relies on the *poster's stated reason*, which may be ambiguous in a short post.
  *   **Leaf F (Marketplace) vs. Leaf D (Cultivar):** A seller selling a cultivar as "native" hits Leaf D. A seller selling a wild plant as "native" without genotype data hits Leaf F. If they sell a cultivar without genotype data, the tree forces a choice at Q6/Q7. We treat Cultivar as the dominant trait here, but mods should watch for misleading labels.

  **Context Dependencies:**
  *   **Q10/Q14 (Identity):** A post saying "Keep Michigan Native" (@loosestrife) looks like a slogan. Without reply context, it might look like a Baseline claim (Leaf A). The tree relies on Q14 to catch the exclusionary tone, but tone is hard to judge in isolation. **Mod Action:** If Q14 is ambiguous, flag for "Context Review" to see if the user is attacking others.
  *   **Q4 (Range Shift):** A post about a plant walking north (@zone5b_andy) requires knowing if the poster accepts the shift as "natural." The tree assumes "Yes" goes to Function/Baseline split. If the mentor says "Absolutely not," the mentor is Leaf A, the poster is Leaf E. The tree classifies the *post*, not the debate. Mods must classify the OP's stance.

