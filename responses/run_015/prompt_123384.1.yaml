      *   **Friend's Position:** Hedonic/Utilitarian view. Suffering and happiness are just intensities on a single scale. Enough pleasure *can* outweigh pain.
      *   **User's Position:** Qualitative/Deontological view (roughly). Suffering is a different *category* than pleasure. Once "real suffering" hits, no amount of good stuff fixes it (lexical priority).
