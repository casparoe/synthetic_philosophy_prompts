answer: |-
  Good morning. Welcome to "One Mind or Many? Consciousness After Commissurotomy."

  Look around this room. We have a rare configuration. On one side, we have the clinicians and surgeons who actually evaluated these patients, who navigated the messy reality of the clinic and the operating theater. On the other, we have philosophers and cognitive scientists whose understanding often comes from the sanitized pages of textbooks. For the next two days, we need to erase that boundary. The clinicians need the conceptual precision of the philosophers, and the philosophers need the structural constraints of the clinical data.

  We are here because the split-brain literature is too important to be treated as mere decoration, yet too fragile to be treated as a blunt instrument. We must avoid two tempting errors. The first is the pop-science claim that severing the corpus callosum literally creates two distinct people inside one skull. The data does not support such a clean duplication. The second error is the reductionist dismissal that hemispheric dissociations are merely behavioral noise with no philosophical weight. The patients' behaviors are too robust, and too strange, for that dismissal to hold.

  To navigate between these extremes, I propose we anchor our discussions around a specific conceptual distinction: the difference between *executive unity* and *phenomenal unity*.

  By executive unity, I mean the capacity to initiate and maintain a single coherent course of action. It is the ability of the organism to button a shirt without one hand undoing the work of the other, to pursue a goal without internal sabotage. By phenomenal unity, I mean the subjective sense that experiences belong to one owner. It is the feeling that the pain in the left foot and the sight of the coffee cup are happening to the same "me."

  In the intact brain, we assume these two forms of unity travel together. If I act as one, I feel as one. But commissurotomy cases put real pressure on this assumption. We see clear fractures in executive unity: hands acting at cross-purposes, conflicting responses to lateralized stimuli. Yet, when asked, many patients report a subjective continuity that seems remarkably intact. They do not report feeling like two people.

  This is the live structural constraint we must confront. If executive unity can fracture while phenomenal unity remains reported as intact, then these are not the same thing. We cannot assume that because a patient acts in a fragmented way, their consciousness is fragmented. Nor can we assume that because they report feeling whole, their executive integration is preserved.

  Over the next two days, I ask the clinicians to press the philosophers on the limits of the behavioral data. I ask the philosophers to press the clinicians on the implications of those limits for the structure of subjectivity. We are not here to solve the mind-body problem by lunchtime on day two. We are here to determine whether the unity of the mind is a single thing that can be broken, or a bundle of distinct capacities that can come apart.

  Let us treat the data with the respect it demands, and the concepts with the rigor they require. Thank you, and let's begin.
