answer: |-
  # Joint Statement on Historical Explanation: Adversarial Collaboration

  ### Agreed claims

  1.  **Causal Realism:** Both sides affirm that historical events are not random occurrences; they happen for reasons and stand in causal relations to prior states of affairs. Neither side denies causation altogether.
  2.  **Case Study Acceptance:** Both sides accept the same concrete empirical facts regarding the case study: a constitutional convention in a divided society collapsed due to deadlock. Liberal factions sought a parliamentary monarchy; conservative factions sought an estate-based federal structure; both opposed absolute rule; neither could secure a majority; the convention failed.
  3.  **Evidential Constraint:** Both sides agree that historical explanations are constrained by archival evidence and cannot contradict established empirical data regarding dates, actions, and stated intentions.
  4.  **Agency Relevance:** Both sides agree that the intentions, beliefs, and decisions of the historical agents are relevant data points for any successful explanation of the convention's collapse.
  5.  **Fallibilism:** Both sides acknowledge that their respective explanatory models are fallible and subject to revision based on new evidence or logical critique.

  ### Disagreements Table

  | Crux | Covering-law formulation | Narrative formulation | Shared argument or case that bears on it | Covering-law prediction | Narrative prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Structure of Explanation** | Explanation consists in subsuming the convention's collapse under general probabilistic laws regarding factional polarization and institutional design failures. | Explanation consists in configuring the unique temporal sequence of debates, votes, and interpersonal conflicts into a coherent plot where the ending follows intelligibly from the beginning. | The deadlock occurred because neither side could trust the other's commitment to limits on power. | Identifying the specific variables of "trust" and "power" allows us to model similar conventions across different centuries. | The specific meaning of "trust" in this context is unique to this society's prior history and cannot be modeled across centuries. |
  | **The Role of Particularity** | Particular details are explanatorily relevant only insofar as they instantiate values for variables in a law-like regularity; unique details are "noise" unless they alter the probability function. | Particular details are constitutive of the explanation; swapping one event changes the configurational fit, meaning the unique details are the "signal" rather than noise. | A specific procedural maneuver by the liberal leader on day three escalated tensions irreversibly. | This maneuver is an instance of a broader class of "escalatory procedural moves" that statistically increase collapse risk. | This maneuver is a singular plot point that gains its significance only from its specific place in this specific sequence. |
  | **Explanatory asymmetry in nearby counterfactual worlds** | The asymmetry is epistemic: we explain the collapse better than the "near-success" because we lack precise data on the stochastic variables that tipped the scale, not because the logic differs. | The asymmetry is hermeneutic: we explain the collapse better than the "near-success" because narrative closure renders the actual outcome intelligible in a way the non-occurring alternative cannot be. | The vote tally was 48% to 52%; a shift of three delegates would have passed a compromise, yet we explain the failure robustly but struggle to explain the "almost." | With complete data on the three delegates' stressors, the "almost" outcome would be subsumable under the same probabilistic law as the actual outcome. | The "almost" outcome lacks narrative reality; its intelligibility depends entirely on the actual collapse, so no independent explanation of the "almost" is possible. |

  Joint statement summary: The residual disagreement lands on whether the intelligibility of historical contingency derives from hidden regularities in human behavior or from the retrospective imposition of narrative form.
