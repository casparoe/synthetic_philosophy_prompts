          *   NC: "The asymmetry is ontological/hermeneutic; the 'almost' has no narrative reality independent of the actual ending."
          *   Let's make it tighter.

      *   *Refining the Final Sentence:* "Joint statement summary: The residual disagreement lands on whether the intelligibility of historical contingency derives from hidden regularities in human behavior or from the retrospective imposition of narrative form."

