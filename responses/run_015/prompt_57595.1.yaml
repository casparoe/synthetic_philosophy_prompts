answer: |-
  **The principle**

  A moral dilemma exists only when an agent faces two competing binding obligations that cannot be reconciled by a higher-order rule. "Ought" does not agglomerate; you ought to save A, you ought to save B, and the tragedy is that both "oughts" remain valid even when one cannot be done. Residue is the cost of satisfying one obligation by violating another. It consists of a debt owed either to the specific claimant denied their due, or to the agent's own integrity when the necessary act violates a constitutive norm of the self.

  Clause 1 (Integrity vs. Convention): Residue becomes a permanent "stain" only when the justified act violates the agent's constitutive integrity (violence, coercion of will), not merely social convention or bureaucratic rules. This accounts for Case 5 (torture stains) versus Case 4 (forgery does not). Forgery bypasses a system; torture bypasses a human will.

  Clause 2 (Partiality vs. Impartiality): Residue is owed when the claimants are bound by special relationships (love, kinship), not when the agent acts as an impartial allocator of scarce resources. This accounts for Case 3 (mother owes child) versus Case 2 (doctor owes nothing). The doctor serves the resource; the mother serves the child.

  Clause 3 (Culpability for Predicament): The reality of the dilemma is independent of how the agent arrived there, but the dignity of the scene depends on whether the agent is culpable for the constraint. This accounts for Case 1 (coerced, dignified) versus Case 6 (self-inflicted, undignified). Coercion removes blame for the situation, but not the cost of the choice.

  Clause 4 (Regret vs. Wrong): Loss of a good life path is regret, not residue, if no specific obligation is violated. This accounts for Case 7. Career versus marriage is a conflict of interests, not obligations, unless a specific promise was broken.

  Clause 5 (Wrong without Blame): An agent can incur a debt without committing a moral wrong if the choice is forced by a malicious third party. This accounts for Case 1. The guard absorbs the wrong; the mother absorbs the cost. The source of the conflict (coercion, chance, prior conduct) does genuine work: it determines whether the residue is guilt, grief, or shame.

  **The two pairs**

  **Cases 2 and 3:** The difference is partiality. The doctor is a public functionary distributing a public resource; the mother is a private guardian distributing private salvation. An intermediate case decides this: A father has one dose of medicine and must choose between his child and a stranger. If he chooses the child, he owes the stranger nothing (Case 2 logic). If he must choose between child and child, he owes the lost child everything (Case 3 logic). The verdicts stand. The principle holds that special obligations generate residue where impartial duties do not. To change this would be to deny the specific weight of kinship, reducing the mother to a hospital administrator.

  **Cases 4 and 5:** The difference is the locus of violation. Forgery violates a record; torture violates a person. An intermediate case: Kidnapping the torturer's sibling to force cooperation. This stains, because it uses a person as a means. Forgery uses a signature as a means. The verdicts stand. The stain tracks the violation of bodily or mental autonomy, not procedural rules. If you erase the distinction, you suggest that breaking a rule is identical to breaking a will, which flattens the moral landscape. The writer must preserve the hierarchy of violations: flesh over paper.

  **Casualties**

  The most vulnerable verdict is Case 1. My principle calls it "not a dilemma" because there are no conflicting obligations, only forced costs. Yet the user feels residue. A rival one-clause account ("Any tragic choice is a dilemma") would accommodate this easily. Abandoning my distinction costs moral precision: it conflates coercion with agency. If the mother's choice is a dilemma, the guard's power is diminished. Keeping the distinction preserves the horror of the guard's coercion.

  The second vulnerable verdict is Case 7. Is career versus marriage truly not a dilemma? A rival account ("Subjective distress defines dilemma") would call it one. Abandoning my verdict costs clarity between moral wrong and life sadness. If every loss is a wrong, nothing is. I rank Case 1 as the higher cost to abandon because it protects the innocence of the victim; Case 7 is lower because it protects the definition of guilt. The simpler rival saves psychological realism but loses moral architecture. I recommend keeping the architecture; the novel can portray the regret of Case 7 without mislabeling it a moral stain.

  **New cases**

  1.  **The Starving Thief:** A parent steals bread to feed a child. Verdict: No stain (like Case 4). Property vs. Life. Confidence: High.
  2.  **The Sacrificial Son:** A father must send one son to war to save the family from execution. Verdict: Stain (like Case 3). Special obligation violated. Confidence: High.
  3.  **The Broken Vow:** Breaking a vow to visit a grave to save a drowning stranger. Verdict: No stain (like Case 4). Minor convention vs. Life. Confidence: High.
  4.  **The Confidential Murder:** A lawyer learns a client plans a murder. Breaking confidentiality prevents it. Verdict: Stain (like Case 5). Professional integrity vs. Moral duty. Confidence: Moderate.

  Flag: Case 4 might be wrong. Preventing murder may clear the stain entirely, unlike torture where the act itself is the harm. If the account yields "stain" here, it may be straightforwardly wrong. The lawyer's integrity is restored by the save. This suggests the principle needs a clause for "Prevention of Greater Harm clears Stain," which complicates Case 5. If torture prevents murder, does the stain vanish? My account says no (Case 5 verdict). This tension is the engine of the novel.

  **The directive**

  Case 8 is a genuine dilemma. The "person" is continuous enough for promises to bind, but discontinuous enough for interests to diverge. The husband promised a project of life, not just care for an organism.

  Recommendation: Honor the promise. Turn off the machine.

  Why: The other endings fail. Keeping her alive betrays the lucid wife who defined the marriage's terms; it treats her past self as dead. Hesitating forever is cowardice; it refuses the cost of love. The tragedy is that honoring the promise feels like killing her. That is the residue. The scene must end in daylight (action taken) but with the husband permanently altered (stain incurred). He saves her from the illness by killing her from the promise. This fits Case 5 (stain) and Case 3 (special obligation). The promise is the jacket; the present self is the child in the water.

  **What I should write**

  Aesthetic considerations entitle you to present a non-dilemma as a felt conflict if it reveals character (Case 7), but not to present a non-stain as a stain if it undermines the theme (Case 4). You may dramatize the weight of regret without mislabeling it guilt. However, if you fake a dilemma where none exists, the resolution will feel unearned. If you miss a real dilemma, the tragedy will feel shallow. The question bears the weight of the novel's moral architecture. Do not sacrifice the structure for the sensation. The reader must feel the difference between the guard's coercion and the father's choice. Write the residue where it is owed, and let the clean choices sleep.
