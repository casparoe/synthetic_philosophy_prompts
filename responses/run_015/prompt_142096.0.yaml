  The fog off the strait didn't roll; it settled, heavy and wet, pressing against the reinforced glass of North Station. Elara sat in the hum of the cooling stacks, her hand hovering over the selector switch. On the desk, the logbook lay open, pen capped. There was nothing to write yet. There was never anything to write until the courier returned.

  Across the water, three kilometers of grey choppy sea away, Kael sat in South Station. He was watching his monitors. To him, the incoming stream of particles was white noise. A random scatter of clicks on the Geiger counters, spin-ups and spin-downs with no pattern, no rhythm. It was the sound of rain on a tin roof. He knew that Elara was holding her hand over the switch. He knew that when she dropped it, she would choose either Basis A or Basis B. He knew that choice would dictate the reality of the particles currently hitting his detectors. But he couldn't see it. Not yet.

  This was the twentieth batch of the term. Twenty pairs of systems, entangled at the source and shipped to either side of the strait. Twenty microscopic things that refused to be separate.

  Elara dropped the switch. Basis A. She didn't feel anything. No resistance, no spark. Just a mechanical click that engaged the magnet array above her trap. She leaned back. The particles in her trap collapsed into definite states along the Z-axis. According to the formalism, the particles in Kael's trap, three kilometers away, instantly collapsed into corresponding definite states along the Z-axis. They were now prepared in a specific pure state ensemble.

  If she had chosen Basis B, they would have been prepared in a different ensemble, incompatible with the first. X-axis instead of Z. You can't be both.

  Kael watched his screens. The noise continued. He ran the local tomography routine. It returned maximum entropy. Random. He poured coffee. He watched the fog. He knew that if he sorted these clicks based on Elara's choice, they wouldn't be random. They would show perfect correlation. They would show that his particles had been behaving as if they knew what Elara decided three days ago.

  But he couldn't sort them. The data sat on his drive, encrypted by ignorance.

  The wait was the hard part. The physics didn't care about the wait. The correlations were established at the moment of measurement. But the humans had to wait for the boat. The courier cut through the fog once a day, carrying the hard logs. No radio. Radio was too fast, too tempting. They needed the delay to prove that nothing traveled across the water. If information had flown across the strait, it would have arrived with the light. The logs arrived with the diesel exhaust.

  On day three, the boat docked. Kael met the courier on the pier. The logbook was wet with sea spray. He took it back to the console, wiped the cover, and opened it. Elara's handwriting. *Batch 20. Basis A.*

  He typed the key into his system. The software filtered the noise. It pulled out only the events corresponding to Elara's measurement times. The scatter plot on his screen resolved. The random cloud tightened into a line. His particles hadn't been random. They had been waiting for her word to show their true face.

  Kael sat back. The hum of the servers seemed to change pitch.

  "It's just data," he said to the empty room. He said it often. "It's just a summary of what I know."

  That was the first comfort. The psi-epistemic view. The wavefunction wasn't a thing; it was a ledger. When Elara measured, she updated the ledger. When the courier arrived, Kael updated his copy. No physical influence crossed the strait. Just knowledge.

  But the line on the screen was sharp. Too sharp. If it was just knowledge, why did the ink on the page constrain the clicks in the detector? Kael had measured these particles before he opened the log. They had hit his sensors with specific energies, specific spins. They had physically interacted with his equipment. Those interactions were consistent with a system that was *already* in Basis A. They weren't consistent with a system that was undecided.

  If the state was just information, then his information had reached across the water and organized matter without touching it. He had updated a ledger, and a machine three kilometers away had obeyed the entry before the pen touched the paper. That wasn't knowledge. That was leverage. That was action at a distance wearing a suit of words.

  He called Elara. The line was crackly.

  "Did you see it?" she asked.

  "It's clean," Kael said. "Too clean. If I hadn't opened your log, those particles would still have hit the sensor the same way."

  "Sure," Elara said. "But you wouldn't have known how to group them."

  "They were grouped," Kael said. "Physically. The statistics are there in the hardware. My detector didn't wait for your mail."

  "So what are you saying? The state is real?"

  Kael looked at the equation on his whiteboard. To describe the state of just these twenty particle pairs, he needed a vector in a configuration space of sixty dimensions. Twenty particles, three spatial coordinates each. Not three dimensions. Sixty.

  "If it's real," Kael said, "where is it? It's not in my trap. It's not in yours. It's not in the space between us. It's in... somewhere else. A space with sixty dimensions. A space I can't point to. A space that doesn't fit in the room."

  "That's the cost," Elara said. "You want the state to be physical? You have to pay for the real estate. The universe is bigger than the box."

  "It's not bigger," Kael said. "It's different. You're telling me the actual stuff, the real stuff, lives in a mathematical abstraction, and we just see the shadows?"

  "Better than magic," Elara said. "Better than my thoughts moving your atoms."

  "Neither works," Kael said.

  He hung up. He looked at the manual on the desk. The calibration guide. It wasn't the machine. It wasn't even a description of the machine's current state. It was a rule. It said: *If input is A, output must be B.*

  There was a third way. He had heard the theorists whisper it during the seminars back at the institute. The nomological view. The state isn't a thing, and it isn't knowledge. It's a law.

  Like gravity. Gravity isn't an object sitting between the earth and the moon. It's a rule that tells the moon how to move around the earth. When Elara dropped her switch, she didn't send a thing, and she didn't just update a belief. She selected which law applied to the pair.

  But laws don't change. Gravity doesn't switch off because you close your eyes. Yet here, the rule depended on Elara's choice. A law that could be toggled by a technician on a Tuesday morning wasn't a law. It was a procedure.

  Kael walked to the window. The fog had lifted slightly. He could see the light of South Station's tower blinking in the distance. Elara was looking back at him. They were two points in three-dimensional space, connected by a correlation that lived in sixty dimensions, enforced by a rule that changed based on a choice, verifiable only after a delay that proved no signal passed.

  He picked up the pen. He had to sign the log. *Verification complete. Correlation confirmed.*

  He hesitated. What was he confirming? That the particles were real? That his knowledge was complete? That the law had held?

  If he checked "Ontic," he admitted the world was mostly invisible dimensions. If he checked "Epistemic," he admitted his mind reached across the strait. If he checked "Nomological," he admitted the laws of physics were local variables subject to human switches.

  He signed his name. He didn't check the box.

  The courier was waiting for the return copy. Kael handed over the clipboard. The boat engine coughed, turned, and headed back into the grey.

  Elara would get the log in three days. She would see that he had verified the steering. She would know that her choice had mattered. She would sit in her station, surrounded by the hum of the cooling stacks, and wonder what exactly she had steered.

  The particles in the trap were gone now, measured, dissipated. The state was gone. Only the log remained. A record of a rule that had applied to things that no longer existed, in a space that couldn't be found, organized by information that couldn't travel.

  Kael turned off the monitor. The room was dark, save for the status LEDs. Green. Stable. Waiting for Batch 21.

  He didn't feel like he understood anything. He felt like he was holding a map of a country that didn't exist, using a compass that pointed nowhere, following roads that appeared only when he walked on them.

  He went to make more coffee. The machine gurgled. It obeyed the laws of thermodynamics, or maybe it was just obeying the manual. He couldn't tell the difference anymore. He just drank the coffee and waited for the fog to come back.

