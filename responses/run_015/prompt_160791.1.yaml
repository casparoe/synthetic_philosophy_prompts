answer: |-
  Here is the specification for a theory of Evidential Cooperation in Large Worlds (ECL), tailored to your constraint: an actual, bounded agent deciding in real-time without source-code access.

  ### The Spec: Requirements for Adequacy

  **1. The Threshold Condition (Checkable Evidential Link)**
  *   **Requirement:** The theory must output a specific inequality involving the payoff matrix and a correlation coefficient. It must state: *Cooperate if and only if* $P(\text{Other} = C | \text{Me} = C) - P(\text{Other} = C | \text{Me} = D) > \frac{T - R}{R - P}$ (using standard PD payoffs).
  *   **Rationale:** Without a threshold, "evidence" is too vague. If the correlation is 0.001, cooperation is altruism, not rationality.
  *   **Status:** **[Non-Negotiable]**. If it doesn't quantify the link, it's not a decision theory; it's a mood.

  **2. The Common Cause Filter (Smoking Lesion Immunity)**
  *   **Requirement:** The theory must distinguish between correlation caused by the *logic of the decision* and correlation caused by a *shared upstream trait* that does not mediate the decision. It must defect in cases where your action is merely a symptom of a fixed trait that also causes the other's action, but your action does not logically imply theirs.
  *   **Rationale:** Otherwise, you end up paying to take vitamins because healthy people take vitamins, or refusing to smoke because smokers get cancer, even if smoking doesn't cause cancer.
  *   **Status:** **[Non-Negotiable]**. This is the baseline for distinguishing evidence from causation in a way that matters for control.

  **3. Graining Stability (Reference Class Invariance)**
  *   **Requirement:** The verdict must not change if the agent redescribes the situation at a different level of abstraction (e.g., describing the algorithm as "code" vs. "physics" vs. "psychology"), provided the structural relationships remain identical. You cannot game the verdict by splitting one decision into two sub-decisions or by narrowing the definition of "agent like me."
  *   **Rationale:** If I can flip the recommendation from Defect to Cooperate just by deciding to view myself as a "human" rather than a "carbon-based optimizer," the theory is subjective mush.
  *   **Status:** **[Non-Negotiable]**. This is the "No Magic Description" clause.

  **4. Bounded Epistemic Access (The No-God's-Eye Clause)**
  *   **Requirement:** The theory must generate a verdict given *subjective* credences about similarity, not *objective* facts about similarity. It cannot require the agent to know the true frequency of twins in the universe. It must work with a prior over "how many of me are there."
  *   **Rationale:** You specified the agent is actual and bounded. A theory that says "Calculate the exact ratio of twins" is useless to an agent who can't count them.
  *   **Status:** **[Non-Negotiable]**. This is the most damaging requirement for existing theories (see below).

  **5. Adversarial Robustness (The Anti-Twin Test)**
  *   **Requirement:** If an adversary creates an agent that is structurally identical to you but wired to output the *opposite* of your decision (a "mimic" or "anti-twin"), the theory must not recommend cooperation based on similarity alone.
  *   **Rationale:** If similarity triggers cooperation, an adversary can drain you by building copies that defect when you cooperate.
  *   **Status:** **[Contested / Taste]**. Causalists demand this; Evidentialists argue this is a rare edge case not relevant to the "large world" cosmological argument where twins arise from convergence, not malice.

  **6. The Output Type (Rationality vs. Engineering)**
  *   **Requirement:** The theory must declare whether it is prescribing an *action* for the current instance or a *policy* for the type. If it prescribes a policy (e.g., "Be the kind of agent that cooperates"), it must explain how a non-self-modifying agent instantiates that policy *now*.
  *   **Rationale:** Many theories slide here. They say "You should cooperate" but mean "You should have been built to cooperate." For a bounded agent that already exists, this distinction is fatal.
  *   **Status:** **[Non-Negotiable]**. You need to know if you are being told to *do* or to *be*.

  **7. Non-Collapse Condition (Not Utilitarianism in Disguise)**
  *   **Requirement:** There must be at least one case in a large world where the theory says *Defect* even though Cooperating would increase total expected utility across all twins.
  *   **Rationale:** If the theory always says "do the thing that maximizes total utility of all similar agents," it is just Act Consequentialism with a restricted scope. It needs to fail on its own terms (e.g., evidential terms) to be distinct.
  *   **Status:** **[Contested / Taste]**. This is often a CDT demand to prove EDT/FDT isn't just "consequentialism for nerds." An ECL proponent might argue collapsing into total utility is a *feature*, not a bug.

  **8. Partial Correlation Handling (Graceful Degradation)**
  *   **Requirement:** The theory must handle cases where the other agent is 90% like you, or where you are 50% sure you are in a twin scenario vs. a standard scenario. It cannot be binary (Twin/Not-Twin).
  *   **Rationale:** In the real world, similarity is a spectrum.
  *   **Status:** **[Non-Negotiable]**. Binary switches break under uncertainty.

  ---

  ### The Impossibility Analysis

  You asked for the subsets that cannot be jointly satisfied. There is a fundamental tension here, specifically a trilemma between **Graining Stability**, **Bounded Epistemic Access**, and **Action-Guidance**.

  **The Conflict:**
  To satisfy **Graining Stability** (Req 3), the theory needs an objective fact of the matter about what constitutes "the same decision procedure." Usually, this is defined functionally (same input-output map) or structurally (same source code).
  However, you have imposed **Bounded Epistemic Access** (Req 4): the agent cannot inspect source code and doesn't know the population.
  Therefore, the agent must rely on *subjective priors* about similarity.
  But subjective priors are vulnerable to *redescription*. If I describe myself as "an agent facing a PD," I might assign a high prior to twins. If I describe myself as "an agent named [Name] facing a PD on [Date]," I assign a near-zero prior.
  Because the agent cannot access the objective facts to anchor the reference class (due to Boundedness), the verdict becomes dependent on the description (violating Graining Stability).

  **The Impossibility Result:**
  For a bounded agent without source-code access, **Graining Stability** and **Bounded Epistemic Access** are jointly incompatible with **Action-Guidance**.
  *   If you fix the reference class objectively to ensure Stability, the Bounded Agent cannot compute it (fails Action-Guidance).
  *   If you let the Bounded Agent use subjective similarity, you lose Stability (redescription changes the verdict).
  *   If you force Action-Guidance using subjective similarity, you invite the "Reference Class Gerrymandering" problem.

  **The Single Most Damaging Requirement:**
  **Requirement 4 (Bounded Epistemic Access).**
  This is the killer. Most formal treatments of ECL (like FDT or standard Superrationality) implicitly assume the agent knows its own algorithm or can treat its decision as a logical variable abstracted from implementation. Once you remove the ability to inspect code or know the population distribution, the "logical link" becomes just another uncertain empirical hypothesis. Once it's an empirical hypothesis, you fall back into standard EDT, which fails the Smoking Lesion test (Req 2).

  **The Question-Begging Requirements:**
  *   **Requirement 2 (Common Cause Filter):** This is the Causalists winning by definition. It defines "rational" as "causally efficacious." An Evidentialist would argue that in a large world, the distinction between "my decision causes theirs" and "our shared logic causes both" is metaphysical hair-splitting that doesn't change the expected utility calculation. Demanding this filter presupposes that causation is the only valid channel for rationality.
  *   **Requirement 7 (Non-Collapse):** This is also CDT/Deontological taste. If the goal is "do good in a large world," collapsing into total utility maximization is success, not failure. Demanding it *not* collapse presupposes that the *process* of decision-making matters independently of the outcome.

  ---

  ### Scorecard

  **1. Evidential Decision Theory (EDT)**
  *   **Verdict:** Cooperates readily.
  *   **Passes:** Threshold Condition, Bounded Access (it loves subjective credences), Partial Correlation.
  *   **Fails:** Common Cause Filter (Smoking Lesion). It cannot distinguish between "my choice predicts theirs" and "a third factor causes both." It also fails Graining Stability because it relies entirely on the agent's subjective conditional probabilities, which are description-dependent.
  *   **Note:** It satisfies the "actual agent" constraint best but is vulnerable to spurious correlations.

  **2. Causal Decision Theory (CDT)**
  *   **Verdict:** Defects.
  *   **Passes:** Common Cause Filter, Adversarial Robustness.
  *   **Fails:** The whole point of ECL. It treats the other agent's decision as a fixed state of the world, ignoring the logical correlation. It fails the purpose of the spec entirely.
  *   **Note:** It is the only one that satisfies the "Non-Collapse" requirement easily, but only by ignoring the large-world premise.

  **3. Functional/Algorithmic Decision Theory (FDT / Updateless)**
  *   **Verdict:** Cooperates (if logical link is strong).
  *   **Passes:** Common Cause Filter (distinguishes logic from physics), Graining Stability (in theory, by focusing on function), Adversarial Robustness (if the function is opposite, it defects).
  *   **Fails:** **Bounded Epistemic Access.** FDT requires you to treat your decision as the output of a function you can reference. If you cannot inspect your source code or identify the function formally, you cannot run FDT. It also struggles with the Output Type (often prescribes a policy for the *algorithm*, not the *instance*).
  *   **Note:** The strongest candidate theoretically, but the hardest to implement for a "meat" agent.

  **4. Old-School Superrationality (Hofstadter)**
  *   **Verdict:** Cooperates.
  *   **Passes:** Intention (gets the spirit of ECL).
  *   **Fails:** Almost all technical requirements. No Threshold Condition (vague on "how similar"), no Graining Stability (relies on intuition), no handling of Partial Correlation.
  *   **Note:** It's a heuristic, not a theory. It tells you *that* you should cooperate, but not *how* to calculate it without magic.

  ### Summary for the Argument

  If you want to argue for ECL being a genuine reason for an *actual* agent to cooperate, you have to bite the bullet on **Requirement 4**. You must argue that an agent can form a stable prior over "logical similarity" without seeing code. If you can't do that, ECL collapses into EDT (and gets eaten by Smoking Lesions) or remains a theoretical curiosity for gods and AI with shared source code.

  The strongest attack vector against your friend is **Graining Stability**. Ask them: "Without access to the source code, what prevents me from describing myself uniquely enough that the probability of a twin drops to zero, making defection the only rational choice?" If they can't answer that without assuming the agent *should* ignore unique details (which is itself a normative claim, not a descriptive one), the theory lacks action-guidance for bounded beings.
