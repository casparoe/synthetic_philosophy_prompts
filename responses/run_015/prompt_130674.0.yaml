answer: |-
  Your position is a sophisticated form of **Threshold Material Essentialism**. It posits that numerical identity is preserved across time only if a specific quantitative threshold of original matter (>50%) persists within a qualitatively defined region (the "structurally essential core"). This avoids the binary trap of strict mereological essentialism (any loss destroys identity) while rejecting functionalist accounts (form/function preserves identity).

  However, this view faces significant challenges from formal metaphysics, conservation science, and bio-ethics. Below is an assessment of the specific defeaters you requested, ranked from fatal to merely awkward, followed by an analysis of the risk of unfalsifiability.

  ### I. Formal Accounts of Material Constitution

  **1. The Constitution View (Lynne Rudder Baker)**
  Baker argues that artifacts are not identical to the matter that constitutes them. A statue is constituted by clay/resin but is a different "primary kind" of object.
  *   **The Defeater:** On this view, identity conditions are determined by the *sortal concept* ("statue," "heirloom") and the intentional history, not the mass ratio. If the conservator's intention was *preservation* (continuing the history of the specific object) rather than *replication* (making a copy), the object persists regardless of mass dominance.
  *   **Impact:** Your view conflates *constitution* (what it is made of) with *identity* (what it is). If the "statue" sortal allows for restoration, your material threshold is irrelevant.

  **2. Hylomorphic Structuralism (Kathrin Koslicki)**
  Koslicki updates Aristotelian hylomorphism, arguing that an object's essence lies in its *structure* (form), not just its matter. Crucially, structure includes the arrangement of parts, not just the parts themselves.
  *   **The Defeater:** If the resin-clay gradient preserves the *structural integrity* required for the statue to exist as a statue, the matter is secondary. If the resin allows the clay fragments to hold the *exact* spatial relations they held originally (better than the clay could alone), the "form" is arguably *better* preserved by the hybrid than by the original matter alone.
  *   **Impact:** Challenges the "structurally essential core" premise. If the resin *is* the structure holding the core together, the resin is essential to the form, making the distinction between "original" and "foreign" matter metaphysically shallow.

  **3. Four-Dimensionalism (Ted Sider)**
  If objects are spacetime worms, the "statue" is a series of temporal stages.
  *   **The Defeater:** Identity is a matter of causal continuity between stages. If the pre-shatter stage causally explains the post-restoration stage (via the conservator's actions), they are temporal parts of the same worm. The material composition of a specific time-slice is irrelevant to the identity of the whole worm.
  *   **Impact:** Renders your "current mass dominance" condition category mistake. It asks a synchronic question (what is it made of *now*?) to solve a diachronic problem (is it the *same* thing?).

  ### II. Restoration Cases: Synthetic Load-Bearing

  **1. The "Armature" Problem (Bronze Casting & Repair)**
  Many large bronze sculptures rely on internal steel armatures for load-bearing support. In severe restorations, corroded bronze is replaced by epoxy composites keyed to the original steel.
  *   **The Case:** If the steel armature (foreign) bears 90% of the load, and the visible surface is 60% original bronze but non-load-bearing, your view suggests the "core" (the steel/resin) is foreign, thus identity is lost.
  *   **The Defeater:** Conservation standards (e.g., ICOM-CC) classify such objects as "original" provided the intervention is reversible and documented. If the art world (the authority on artifact identity) accepts it as the original, your metaphysical claim conflicts with the constitutive rules of the practice.
  *   **Impact:** Suggests identity is normative/social, not merely mereological.

  **2. The *Frauenkirche* (Dresden)**
  Rebuilt after WWII using original stones where possible, but bonded with modern mortar and supported by modern concrete cores.
  *   **The Case:** It is universally regarded as the *same* church (numerically), not a replica. Yet, the "structurally essential core" (the foundations and load-bearing walls) contains a massive percentage of new material.
  *   **The Defeater:** If the *Frauenkirche* survives, why not the statue? The only difference is scale. If you argue the church is a "new building," you conflict with legal, historical, and cultural reality.
  *   **Impact:** Forces you to accept that most "historic landmarks" are actually new objects, a conclusion that carries heavy ontological baggage.

  ### III. Biological Parallels: Prosthesis and Turnover

  **1. Metabolic Turnover (The Biological Ship of Theseus)**
  Human bodies replace nearly all cells every 7–10 years.
  *   **The Parallel:** If SDV (Substrate Dominance View) applies to biological organisms, you cease to be the same person every decade.
  *   **The Defeater:** Most philosophers and biologists reject this. We maintain identity through *organizational continuity*, not material dominance.
  *   **Impact:** To save SDV, you must posit a radical discontinuity between "artifacts" and "organisms." If you cannot explain *why* a statue requires material dominance but a human does not (given both are functional structures), the view is ad hoc.

  **2. Neural Prosthetics (The "Core" Argument)**
  Consider a patient with Parkinson's receiving deep brain stimulation, or a future scenario where neurons are replaced by synthetic nanobots that replicate function exactly.
  *   **The Parallel:** If 51% of your neural substrate (the "structurally essential core" of personhood) is replaced by synthetic matter that bonds chemically/electrically, are you a new person?
  *   **The Defeater:** If you say "Yes, you died," you embrace a controversial view of death that contradicts psychological continuity theories. If you say "No, you survive," you abandon SDV for persons.
  *   **Impact:** If SDV applies to persons, it is ethically catastrophic. If it doesn't, the "artifact" vs. "person" distinction requires a robust defense that doesn't rely on intuition.

  ### IV. Ranking the Defeaters

  Here is the ranking of objections from **Fatal** (requires abandoning the core thesis) to **Awkward** (requires uncomfortable qualifications).

  **1. FATAL: The Sorites of "Core" and "Dominance"**
  *   **Reasoning:** There is no non-arbitrary way to define "structurally essential core" or "numerical dominance." Is it 51% mass? 51% volume? 51% structural load? If the resin bonds chemically to the clay, is it still "resin" and "clay," or a new polymer?
  *   **Why Fatal:** If the boundaries of these conditions are vague, the identity condition is vague. But numerical identity is typically considered a strict, all-or-nothing relation. If identity turns on a vague threshold, the theory collapses into incoherence. You cannot say "it is 50.1% original, so it survives" vs "49.9%, so it perishes."
  *   **Verdict:** Unless you can provide a precise metric for "core" and "dominance" that isn't circular, the view is logically untenable.

  **2. FATAL: The Biological *Reductio***
  *   **Reasoning:** If SDV applies to all concrete objects, it applies to humans. If it applies to humans, we die constantly. If you exempt humans, you must explain the metaphysical difference between a grandmother's statue and a grandmother's body.
  *   **Why Fatal:** Both are functional, organized structures. If the statue loses identity due to material replacement but the body does not, the criterion for identity is not "material constitution" but "kind." If it's "kind," then the "statue" kind might allow more replacement than you posit.
  *   **Verdict:** Forces a choice between absurd biological conclusions or abandoning material essentialism as the primary driver of identity.

  **3. SERIOUS: The Conservation Intent Paradox**
  *   **Reasoning:** In conservation, identity is tied to the *intent of preservation*. A "restoration" aims to keep the *same* object alive. A "replica" aims to make a *new* one.
  *   **Why Serious:** If the conservator successfully preserves the causal history and the object is treated as the original by all epistemic agents, claiming it is "new" creates a divergence between metaphysical reality and social/functional reality.
  *   **Verdict:** Makes your view revisionist. You are redefining "statue" against standard usage. This isn't logically fatal, but it isolates the theory from practice.

  **4. AWKWARD: Functional Indistinguishability**
  *   **Reasoning:** If the statue looks, weighs, and occupies the same space, and the resin is chemically bonded, the difference is undetectable without mass spectrometry.
  *   **Why Awkward:** It implies that two objects could be qualitatively identical and spatiotemporally continuous, yet numerically distinct solely due to a hidden material ratio.
  *   **Verdict:** Merely counter-intuitive. Haecceitists (those who believe in "thisness" independent of qualities) would accept this. It's a bullet you can bite, though it tastes bad.

  ### V. The Unfalsifiability Trap

  You asked whether the view can be qualified into unfalsifiability, and whether that is a vice.

  **How Insulation Occurs:**
  A defender of SDV can evade the "Core" and "Dominance" defeaters by refining the definitions ad hoc.
  *   *Challenge:* "The resin is 60% of the mass."
  *   *Refinement:* "Yes, but the *clay* is 90% of the *aesthetic surface*, which is the true 'core' of a statue."
  *   *Challenge:* "But the resin holds the weight."
  *   *Refinement:* "Weight-bearing isn't the essence of a statue; visual form is. The clay dominates the visual core."
  *   *Challenge:* "What about a sculpture where the interior is the art?"
  *   *Refinement:* "Then the interior matter must dominate."

  **Is This a Vice?**
  **Yes.** In metaphysics, a theory of concrete objects must be grounded in principles that are not merely post-hoc rationalizations of intuitions.
  *   **The Vice:** If "structurally essential core" can be shifted to wherever the original matter happens to be, the theory predicts nothing. It becomes a tautology: *The object survives if the original matter remains in the parts that matter for identity.* This explains nothing because "parts that matter for identity" is defined by whether the object survives.
  *   **Honest Assessment:** To avoid unfalsifiability, you must pre-commit to a definition of "core" (e.g., "load-bearing volume" or "geometric center") *before* analyzing cases. If you do this, the view becomes falsifiable (e.g., by the *Frauenkirche* case). If you do not, the view is insulated but empty.

  ### Conclusion

  Your view is robust against naive "part replacement" intuitions but fragile against **structuralist** and **biological** critiques.
  *   **To save the view:** You must argue that artifacts differ metaphysically from organisms (rejecting the biological parallel) and that "structural core" is defined by load-bearing mass, not aesthetics (accepting that the *Frauenkirche* is a new building).
  *   **The Cost:** This makes you an ontological revisionist. You will have to tell museums that many of their "original" pieces are technically replicas, and that biological continuity is irrelevant to artifact identity.
  *   **Final Verdict:** The **Sorites of "Core"** is the fatal flaw. Without a non-arbitrary metric for what constitutes the "essential core," the dominance condition cannot do the metaphysical work you require of it. The view risks becoming a sophisticated way of saying "it's the same object if enough of the important stuff is there," where "important" is determined by whether we think it's the same object.
