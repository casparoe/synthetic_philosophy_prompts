      *   **The Core Conflict:** Whoever slows down takes a permanent career hit (lost momentum, funding); the other gains. If both refuse to slow down, twins get 50h/week daycare, both feel guilty. It's a prisoner's dilemma-esque situation (individual incentive to let the other take the loss vs. collective good).
      *   **The Question:** Is there a principled, fair way to split this burden, or is it a structural trap philosophy can't solve?
      *   **Tone:** Empathetic, rigorous but accessible, British English.

