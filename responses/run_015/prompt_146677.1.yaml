      *   *Justice/Fairness (Rawls):* Veil of ignorance. If they didn't know who would be who, what would they agree to?
      *   *Utilitarianism:* Maximise overall well-being. Career success + child well-being + parental mental health.
      *   *Care Ethics:* Focus on the relationship and the specific needs of the children, not abstract rules. The spreadsheet ignores the relational aspect.
      *   *Equality of Opportunity vs. Equality of Outcome:* Do they want equal career trajectories (outcome) or equal opportunity to choose (process)?
