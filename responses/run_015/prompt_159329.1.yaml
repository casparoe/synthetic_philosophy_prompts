answer: |-
  ### (1) Design Notes & Brainstorm

  **Discriminating Questions Considered:**
  I started with the standard list of *pramāṇas* (Perception, Inference, Testimony, Comparison, Absence, Presumption) and tried to turn each into a case-based binary choice.
  *   *Perception:* Used the "stick in water" case. It tests whether sensory appearance is sufficient or if it requires correction (implying a second source).
  *   *Inference:* Used "smoke/fire." Classic. Tests if non-sensory cognition is irreducible.
  *   *Testimony:* Used "stranger/GPS." This covers the human/machine constraint. The reductionist option here is crucial: "Yes you know, but only because you inferred the source is reliable."
  *   *Comparison:* Used the *gavaya* (forest cow) case. Tests if recognizing similarity from description is distinct from just hearing the description (Testimony) + seeing the animal (Perception).
  *   *Absence:* Used "no pot" vs. "no ghost." This addresses your constraint about perceptibility. I initially considered splitting this into two nodes, but to save space for the Convergence node, I combined them into a single node with a qualifying clause ("...even if the thing absent is imperceptible?").
  *   *Presumption:* Used the "fat man" case. This corrects your memory: the 5-vs-6 split in Mīmāṃsā is about *Presumption* (*arthāpatti*), not Absence (*abhāva*). Both Mīmāṃsā schools accept Absence; Bhāṭṭas accept Presumption (6), Prābhākaras reject it (5).
  *   *Convergence:* Used "infer fire then see fire." Tests if sources generate distinct knowledge tokens or merge.

  **Pruned Questions:**
  *   *Correction as a separate node:* I initially wanted a node for "When sight conflicts with touch, is sight knowledge?" But this is effectively the negation of Node 1 (Perception Only). If you say "No, sight was illusion," you imply a correcting source exists. I folded this into Node 1's phrasing.
  *   *Machine Reliability split:* I considered branching on "Unknown reliability" vs. "Known reliability" for the GPS case. However, this creates a modal distinction rather than a source count distinction. I embedded the "unknown reliability" clause into Node 3 to force the student to decide if the *mechanism* itself yields knowledge or if it requires an inference about reliability.

  **Correction on Your Memory:**
  You recalled a split over whether *Absence* needs its own entry (5 vs 6). Historically, the split between Prābhākara and Bhāṭṭa Mīmāṃsā is over *Presumption* (*arthāpatti*). Both accept Absence (*abhāva*) as a source (usually the 5th). The Bhāṭṭas add Presumption as the 6th. The Prābhākaras reduce Presumption to Inference or Comparison. I have structured Node 6 to reflect this.

  ---

  ### (2) Diagnostic Flowchart: "How Many Ways to Know?"

  **Start:** Imagine you see a stick half-submerged in water. It looks bent. You touch it; it is straight.

  **Node 1:** Did your eyes give you *knowledge* (before you touched it), or just an illusion?
  *   **No (Illusion only):** → **Leaf A**
  *   **Yes (It was knowledge, just corrected):** → **Node 2**

  **Node 2:** You see smoke on a hill. You know there is fire. Is this knowledge distinct from simply seeing the fire itself?
  *   **No (It's just delayed perception/memory):** → **Leaf B**
  *   **Yes (Irreducible):** → **Node 3**

  **Node 3:** A stranger (or a GPS) tells you "There is a cliff ahead." You don't know them. Do you know this immediately, or only after inferring they are reliable?
  *   **No (Only after inferring reliability):** → **Leaf C**
  *   **Yes (Immediate uptake):** → **Node 4**

  **Node 4:** You are told a *gavaya* is like a cow. Later you see one in the forest and recognize it. Is this recognition distinct from remembering the description + seeing the animal?
  *   **No (Just Memory + Perception):** → **Leaf D**
  *   **Yes (Irreducible recognition):** → **Node 5**

  **Node 5:** You see an empty floor. You know "There is no pot here." Is this distinct from seeing the floor, even if the absent thing was never visible (e.g., "No ghost here")?
  *   **No (Just seeing the floor):** → **Leaf E**
  *   **Yes (Absence is a distinct object):** → **Node 6**

  **Node 6:** Devadatta is fat but never eats during the day. You know "He eats at night." Is this distinct from inferring "He must eat sometime"?
  *   **No (Just Inference):** → **Leaf F**
  *   **Yes (Distinct postulation):** → **Node 7**

  **Node 7:** You infer fire from smoke, then walk up and see the flames. Does the seeing give you a *new* piece of knowledge, or just confirm the old one?
  *   **No (Confirmation only):** → **Leaf G**
  *   **Yes (New knowledge token):** → **Leaf H**

  ---

  ### (3) Leaf Table

  | Leaf | Label | Who Ends Up Here | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **The Radical Empiricist** | Cārvāka | Must deny you knew the stick *looked* bent; sensory contact is the only truth. |
  | **B** | **The Perceptual Reductionist** | (Unoccupied) | Must claim knowing fire from smoke is identical to seeing fire (collapses time). |
  | **C** | **The Testimony Reductionist** | Buddhist (Dignāga) | Must claim trusting a GPS requires a silent syllogism about its reliability every time. |
  | **D** | **The Three-Source Theorist** | (Unoccupied) | Accepts Testimony but denies Comparison is distinct (rare historical position). |
  | **E** | **The Four-Source Theorist** | Nyāya (Standard) | Must claim knowing "no pot" is just seeing the floor (struggles with "no ghost"). |
  | **F** | **The Five-Source Theorist** | Mīmāṃsā (Prābhākara) | Must explain the fat man without "postulation" (reduces it to inference or comparison). |
  | **G** | **The Six-Source (Merge) View** | (Unoccupied) | Accepts all sources but denies they generate distinct knowledge tokens when converging. |
  | **H** | **The Six-Source (Distinct) View** | Mīmāṃsā (Bhāṭṭa) | Must accept "postulation" as a source, which looks very much like complex inference. |

  ---

  ### (4) Unoccupied-Cells Audit

  *   **Leaf B (Perceptual Reductionist):** *Incoherent.* It requires collapsing the temporal gap between seeing smoke and seeing fire. If knowledge is identical, you know the fire before you see it, which contradicts the definition of perception.
  *   **Leaf D (Three-Source Theorist):** *Unattractive.* Historically, schools that accepted Testimony as distinct (Nyāya/Mīmāṃsā) almost always accepted Comparison (*upamāna*) as distinct too, because the cognitive mechanism (recognizing similarity from description) feels distinct from mere testimony.
  *   **Leaf G (Six-Source Merge):** *Overlooked.* Most schools that accept 6 sources also treat each *pramāṇa* as generating a distinct cognition (*jñāna*). A view that accepts the sources but merges the results is logically possible but textually rare; usually, source-individuation implies result-individuation.

  ---

  ### (5) Unseparable-Pairs Note

  This flowchart diagnoses the *count* of sources, but it is blind to three structural disagreements you care about:

  1.  **Instrument vs. Result:** The tree counts sources (instruments), but some schools define sources by the *result* (knowledge). If two instruments produce the exact same knowledge token, are they one source or two? Node 7 attempts to catch this, but it doesn't separate those who say "One Source, Two Instruments" from "Two Sources, One Result."
  2.  **Convergence (Redundancy):** Node 7 asks if the second knowledge is *new*, but it doesn't separate the view that the second source is *defeated* (you already know, so perception is useless) from the view that it is *reinforced* (you know it twice). The tree treats these as the same "No" branch.
  3.  **Correction (Defeasibility):** Node 1 handles the stick case, but it doesn't separate the view that the first perception was *false* from the view that it was *true but overridden*. Nyāya says the visual knowledge was valid until defeated; Buddhists often say it was invalid cognition. The tree lumps these together under "Yes/No" on whether it was knowledge.

  To separate these, you would need extra nodes asking: "Is the first cognition false?" and "Does the second cognition replace or add to the first?"

  ---

  ### (6) Closing: Cutting for Time

  If you have to squeeze this into twenty minutes, cut **Node 4 (Comparison)** and **Node 6 (Presumption)**.

  **What you lose:** You lose the ability to distinguish Nyāya (4) from Prābhākara Mīmāṃsā (5) and Bhāṭṭa Mīmāṃsā (6). The seminar will collapse into a debate between Buddhists (2), Nyāya (4), and Mīmāṃsā (5/6 lumped).
  **Why cut these:** The *gavaya* case (Comparison) is often the hardest for undergraduates to grasp as distinct from Testimony, and it consumes disproportionate explanation time. The Fat Man case (Presumption) is the most "technical" and relies on specific metaphysical commitments about absence that may distract from the core epistemological question of reductionism. Cutting them leaves the core debate: **Perception vs. Inference vs. Testimony**, which maps cleanly onto contemporary debates (Empiricism vs. Rationalism vs. Testimony Reductionism).
