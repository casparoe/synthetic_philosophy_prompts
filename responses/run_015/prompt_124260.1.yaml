      *   So, in a world where a rock is at the bottom (and Mildred was never sunk), "Bloppy = Mildred" is still true (if Mildred exists elsewhere or we consider trans-world identity), but "The thing at the bottom = Mildred" is false.
      *   The user's Step (7) says "Bloppy = Mildred is contingent." This is false if Bloppy is rigid. What is contingent is "The thing at the bottom = Mildred."
      *   So the error is equating the name "Bloppy" with the description "thing at the bottom."
      *   I need to make sure I explain *Reference Fixing* clearly. This is the heart of Kripke's *Naming and Necessity*.

  7.  **Final Structure:**
