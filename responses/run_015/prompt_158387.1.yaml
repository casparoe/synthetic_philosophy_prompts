answer: |-
  # Specification for Lexical Threshold Negative Utilitarian Machinery

  **Document Purpose:** To define the operational parameters of the hedonic scale and lexical threshold required for an institutional allocator to execute Lexical Threshold Negative Utilitarianism (LTNU) without arbitrariness, paralysis, or internal contradiction.

  **Core Definition:** The machinery must instantiate a function $V(E)$ mapping experiences $E$ to real numbers (or a lexical structure), governed by a threshold $T$, such that for any experience $e$, if Unpleasantness$(e) > T$, then $V(e) < V(\text{any aggregate of pleasures})$.

  ---

  ## I. Desiderata for the Scale and the Cut

  ### 1. The Affective Anchor (Sensory vs. Unpleasantness)
  *   **Case:** A subject reports sensory pain (sharpness, location) without distress (e.g., hypnotic analgesia, morphine block).
  *   **Motivation:** LTNU is concerned with *suffering*, not nociception. Counting sensory signals without affective tone misallocates resources toward numbing sensation rather than alleviating distress.
  *   **Failure Mode:** The allocator funds sensory blockers for patients who do not mind the pain, diverting funds from patients in psychological agony with low sensory intensity.
  *   **Status:** **Non-Negotiable.** The scale must measure *unpleasantness* (affective valence), not *intensity* (sensory magnitude).

  ### 2. The Netting Protocol (Relief and Double-Counting)
  *   **Case:** Relief pleasures (itch easing, post-injection).
  *   **Motivation:** If relief is coded as positive pleasure *and* the cessation of pain, the same physiological event is counted twice (once as pain removal, once as pleasure addition). This inflates the value of analgesia relative to prevention.
  *   **Failure Mode:** The allocator prioritizes treating existing pain (to generate relief) over preventing pain (which generates no relief), creating a perverse incentive to let pain occur so it can be relieved.
  *   **Status:** **Non-Negotiable.** Relief must be bookkept strictly as the *reduction of negative magnitude*, not the *addition of positive magnitude*. The baseline is neutral; relief returns the subject to neutral, not into positive credit.

  ### 3. Simultaneous Valence Integration (Mixed Experiences)
  *   **Case:** Spicy meals, horror films, satisfying exhaustion.
  *   **Motivation:** Experiences often contain co-occurring positive and negative hedonic tones. The threshold must apply to the *net* state or the *dominant* state to generate a ranking.
  *   **Failure Mode:** If the components are evaluated separately, a supra-threshold pain could be "cancelled" by a simultaneous supra-threshold pleasure, violating the lexical claim that the pain is *urgent*. If netted, the pain might disappear below $T$.
  *   **Status:** **Non-Negotiable.** The machinery requires a **Pre-Threshold Netting Rule**. Valences must be integrated into a single scalar value *before* comparison with $T$. If Net $> T$ (on the negative side), the lexical veto applies.

  ### 4. Qualitative Commensurability (The Unity of Suffering)
  *   **Case:** Burning vs. grief vs. boredom vs. suffocation.
  *   **Motivation:** LTNU posits a *single* threshold. If these are distinct dimensions, there is no single line to draw. A threshold on "burning" does not lexically prohibit "grief."
  *   **Failure Mode:** Without a conversion function (e.g., 1 unit of Grief = $k$ units of Burning), the allocator cannot compare programs targeting different types of suffering. The lexical veto becomes specific to pain *types*, fragmenting the view into multiple lexical utilitarianisms.
  *   **Status:** **Non-Negotiable** (for LTNU), but **High Risk**. The theory must posit a mapping function $Q(\text{type}) \to \text{scalar}$. If no such function exists, LTNU is incoherent.

  ### 5. Temporal Aggregation Invariance (The Sandpile & Merging)
  *   **Case:** Many sub-threshold moments vs. one supra-threshold moment; splitting/merging episodes.
  *   **Motivation:** If the threshold is defined by peak instantaneous intensity, a long torture session can be evaded by splitting it into short bursts with breaks. If defined by integrated intensity (area under curve), many small pains can sum to a lexical veto.
  *   **Failure Mode:** **Gerrymandering.** If the rule is not invariant, the allocator can manipulate the description of the "episode" to change the moral verdict.
  *   **Status:** **Non-Negotiable.** The threshold must be defined over a **Standardized Temporal Unit** (e.g., "uninterrupted episode") or an **Integrated Intensity Metric** (intensity $\times$ duration). The specification must fix which one. *Recommendation:* Integrated Intensity over a minimum duration window to prevent "flicker" evasion.

  ### 6. Interpersonal Calibration (Beyond Behaviorism)
  *   **Case:** Stoics vs. Complainers; different expressive norms.
  *   **Motivation:** The allocator compares across persons. Self-report is noisy. Physical stimulus is not pain.
  *   **Failure Mode:** Resources flow to the expressive, away from the stoic. The "shared quantity" is an illusion if not calibrated.
  *   **Status:** **Non-Negotiable.** The theory must specify a **Calibration Anchor**. This cannot be mere behavior. It requires a normative assumption of *psychophysical equivalence* (e.g., similar neural correlates imply similar pain, adjusted for reported valence). Without this, the "population" in the allocator's brief is a fiction.

  ### 7. Threshold Anchoring and Unit Invariance
  *   **Case:** Threshold set as fraction of worst possible pain; rescaling units.
  *   **Motivation:** If $T$ is relative to the worst pain *currently existing*, eliminating the worst pain lowers $T$, making previously acceptable pains now lexically forbidden. This creates "moral churn." If $T$ depends on units (Joules vs. Ergs), the verdict is arbitrary.
  *   **Failure Mode:** **The Ratchet Effect.** Success in alleviating worst-case suffering tightens the constraint on remaining suffering, potentially paralyzing future allocation.
  *   **Status:** **Non-Negotiable.** $T$ must be **Absolute** (fixed to a phenomenological standard, e.g., "childbirth without anesthesia" or "burning of 10% body surface") and **Unit-Invariant** (ratios of magnitudes must hold regardless of scaling).

  ### 8. Risk and Probability Discounting
  *   **Case:** Small probability of supra-threshold pain vs. guaranteed sub-threshold benefit.
  *   **Motivation:** Strict lexicality implies $V(\text{Supra}) = -\infty$. Expected Value $E = p \times -\infty = -\infty$ for any $p > 0$. This licenses paralysis (no action is safe enough) or fanaticism (prevent the tiny risk at any cost).
  *   **Failure Mode:** **Allocator Paralysis.** The allocator cannot authorize any program with any risk of severe pain (e.g., surgery, transport).
  *   **Status:** **Partisan.** Strict lexicality is incompatible with action under uncertainty. A defender must adopt a **De Minimis Probability Rule** (probabilities below $\epsilon$ are treated as 0) or a **Lexical Discount Function**. This modifies the core LTNU claim but is required for the "institutional purpose."

  ### 9. Experiential vs. Evaluative Utility
  *   **Case:** Chosen pain (marathon), retrospective valuation.
  *   **Motivation:** LTNU is hedonic. A subject may value a painful life retrospectively.
  *   **Failure Mode:** If the allocator respects retrospective valuation, they may permit supra-threshold pain because the subject "gladly endured it." This violates the "urgency" of the suffering *while it occurs*.
  *   **Status:** **Non-Negotiable.** The scale must measure **Experienced Utility** (felt during the episode), not Decision or Remembered Utility. The lexical veto applies to the suffering subject, not the narrating self.

  ---

  ## II. Inconsistency Report

  **Smallest Jointly Unsatisfiable Subset:**
  1.  **Strict Lexical Priority:** No amount of sub-threshold good compensates for any probability of supra-threshold bad.
  2.  **Empirical Fallibility:** The allocator can never assign probability 0 to a negative outcome in the physical world.
  3.  **Action-Guidance:** The allocator must be able to rank and authorize at least some programs involving risk (e.g., medical transport).

  **Analysis:** You cannot have all three. If (1) and (2) hold, (3) fails (Paralysis). If (1) and (3) hold, (2) fails (you must assume certainty where none exists). If (2) and (3) hold, (1) fails (you are effectively trading off risk against benefit).
  **Resolution:** For the institutional purpose, **(1) must be relaxed** via the *De Minimis Probability Rule* (Desideratum 8). Strict lexicality is metaphysically possible but institutionally inoperable under risk.

  **Secondary Tension:** **Qualitative Commensurability (4)** and **Non-Arbitrary Aggregation**. If pain types are truly qualitatively distinct (grief vs. burning), any mapping to a single scalar is necessarily arbitrary or stipulative. LTNU demands a single scale; phenomenology suggests pluralism. This is a structural weakness in the theory's foundation, not just its application.

  ---

  ## III. The Most Exclusionary Requirement

  **Requirement:** **Qualitative Commensurability (Desideratum 4).**

  **Reasoning:** This requirement demands that all forms of suffering be reducible to a single scalar magnitude. This excludes the largest class of plausible alternative theories of welfare and pain. Most contemporary philosophy of mind and ethics treats "suffering" as a cluster concept or posits incommensurable values (e.g., dignity vs. comfort, physical vs. psychological). Insisting on a single line where phenomenology suggests a manifold is the heaviest lift for LTNU. It forces the theory to deny the reality of qualitative difference to save the lexical math.

  ---

  ## IV. Scorecard of Contenders

  *Scoring against the 9 Desiderata (Pass/Fail/Partial). Focus is on adequacy for the Allocator's Machinery.*

  | Contender | 1. Affective | 2. Netting | 3. Mixed | 4. Quality | 5. Invariance | 6. Interpersonal | 7. Anchor | 8. Risk | 9. Experiential | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Classical Cardinal Hedonic Scale** | Pass | Pass | Pass | **Fail** | Pass | Partial | Pass | Pass | Pass | **Rejected.** Fails Lexicality (Core LTNU claim). Allows trade-offs that LTNU forbids. |
  | **Standard LTNU (Unspecified)** | Partial | **Fail** | **Fail** | **Fail** | **Fail** | **Fail** | **Fail** | **Fail** | Pass | **Rejected.** Fails almost all operational specs. Metaphysically bold, operationally empty. |
  | **Distinct Normative Kind (Pluralist)** | Pass | Pass | Partial | **Fail** | N/A | Partial | N/A | Partial | Pass | **Rejected.** Explicitly denies Desideratum 4 (Single Scale). Cannot generate a unified ranking for the allocator. |
  | **Damage-Signal View** | **Fail** | N/A | N/A | Partial | Pass | Pass | Pass | Pass | **Fail** | **Rejected.** Fails Desideratum 1 (Sensory vs. Affective) and 9 (Experiential). Counts damage, not suffering. |
  | **Preference-Based / Revealed Choice** | **Fail** | N/A | N/A | **Fail** | Partial | Pass | Partial | Pass | **Fail** | **Rejected.** Fails Desideratum 1 and 9. Validates chosen suffering, violating the "urgency" of pain. |

  **Summary:** No existing off-the-shelf theory passes the specification without modification. The **Standard LTNU** fails because it lacks the engineering for risk, time, and quality. The **Classical Scale** fails the core lexical constraint. To make LTNU work for an allocator, one must adopt the **Classical Scale's** measurability, impose the **LTNU Lexical Cut**, but modify it with the **De Minimis Risk Rule** and a stipulated **Quality Conversion Function**. This hybrid is the only candidate that satisfies the Non-Negotiables for institutional action.
