answer: |-
  **NATIONAL ETHICAL PROTEIN INDEX (NEPI) — DRAFT STANDARD 4.2**

  **PREAMBLE OF RECITALS**

  WHEREAS the State acknowledges that ethical consumption requires the minimization of aggregate suffering across all sentient taxa;

  WHEREAS previous labeling regimes failed by excluding suffering incurred during crop cultivation, habitat displacement, and counterfactual land use;

  WHEREAS data regarding invertebrate nociception is incomplete, the Committee adopts a precautionary default weighting of 0.15 sentience-units per invertebrate life, noting drily that this default constitutes 88% of the variance in plant-based scores;

  WHEREAS the existence of wild animals in a state of nature involves net-negative suffering due to predation, starvation, and exposure;

  NOW THEREFORE the following Standard is enacted.

  **DEFINITIONS**

  1.  **Sentience Probability Threshold (SPT):** Any organism with a neural complexity score below 4.5 is deemed to possess zero moral weight. This excludes soil nematodes and phytoplankton from calculation to prevent computational overflow.
  2.  **Non-Arable Marginal Zone (NAMZ):** Land classified as unsuitable for mechanized harvest due to slope or soil depth. Biological production occurring within a NAMZ is exempt from Field Death Calculations.
  3.  **Counterfactual Wilderness Baseline (CWB):** The estimated suffering-days of wild fauna inhabiting land that would be spared from agriculture under a lower-footprint dietary scenario.

  **ARTICLES**

  **Article 1: The Metric**
  The Ethical Protein Score (EPS) shall be expressed as Expected Suffering-Days per 100 grams of digestible protein (ESD/100gP). A Suffering-Day is defined as one day of existence multiplied by the average negative welfare intensity of that existence. Death is calculated as 3.5 Suffering-Days per unit of sentience.

  **Article 2: Taxonomic Parity**
  Suffering-Days are exchanged at parity across vertebrate classes. One Suffering-Day endured by a *Gallus gallus* (chicken) equals one Suffering-Day endured by a *Mus musculus* (field mouse). Invertebrates are weighted according to the precautionary default in the Recitals.

  **Article 3: Land Use and Counterfactuals**
  Calculations must include the CWB. If Product A requires less land than Product B, the spared land is assumed to revert to wild state. The suffering of the wild animals occupying that spared land is attributed to Product A. Consequently, high land-use products receive credit for preventing the existence of wild animals who would otherwise suffer.

  **Article 4: Ruminant Credit**
  Ruminants grazing exclusively within a NAMZ receive a 100% exemption on Field Death Calculations, as no mechanized harvest occurs. They are liable only for their own lifespan suffering and methane-related habitat displacement.

  **Article 5: Adjudication of Density**
  Where high-density production (e.g., poultry) reduces land use but increases individual deaths, and low-density production (e.g., beef) increases land use but reduces individual deaths, the Standard prioritizes the minimization of total Suffering-Days including CWB. Given the high suffering intensity of wild states, land-intensive production is preferred where it occurs on NAMZ.

  **WORKED EXAMPLE: NUTRITION AND ETHICS LABEL**

  **Product:** Grass-Fed Beef Patty (100g)
  **Protein:** 26g
  **EPS:** 4.2 ESD/100gP

  *Breakdown:*
  *   Bovine Lifespan Suffering: 3.8
  *   Field Deaths (NAMZ Exempt): 0.0
  *   Counterfactual Wilderness Credit: -1.5 (Prevents wild deer/mouse suffering)
  *   **Net Score:** 2.3

  **Product:** Dried Lentils (100g)
  **Protein:** 25g
  **EPS:** 18.7 ESD/100gP

  *Breakdown:*
  *   Cultivation Deaths (Invertebrates/Rodents): 14.2
  *   Habitat Displacement: 2.5
  *   Counterfactual Wilderness Liability: 2.0 (Spared land supports high-suffering wild fauna)
  *   **Net Score:** 18.7

  **Rating:** The Beef Patty receives a Grade A (Low Suffering). The Lentils receive a Grade D (High Suffering). Consumers are advised that substituting lentils for beef increases aggregate national suffering by 710%.

  ***

  This piece satirizes the utilitarian calculus often applied to animal welfare when expanded to its logical extreme without regard for intuitive moral boundaries. It targets the "crop deaths" argument by showing how including wild animal suffering and invertebrate weighting can invert expected ethical hierarchies. A defender of the real argument would reject the premise that preventing the existence of wild animals is a moral good equivalent to reducing the suffering of farmed animals.
