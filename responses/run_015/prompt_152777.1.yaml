answer: |-
  # The Analogy Audit: A Decision Procedure for Markers

  **Purpose:** To distinguish between analogies that perform *argumentative work* (identifying causal mechanisms and scope conditions) and analogies that perform *rhetorical work* (lending an air of inevitability or moral clarity without logical support).
  **Time Budget:** 10 minutes per paper.
  **Prerequisites:** None. This procedure analyzes the *structure* of the text, not the historical accuracy of the claims.

  ---

  ## Part I: The Procedure

  Run the four tests in order. If a paper **FAILS** any test, mark the analogy as **"Decorative"** and stop. Do not proceed to the next test. If a paper **PASSES** all four tests, mark the analogy as **"Functional"** and proceed to the Judgment Zone.

  ### Test 1: The Inventory (Specificity & Abstraction)
  *Addresses: The student who supplies no features beyond the name; The level-of-abstraction problem.*

  *   **Instruction:** Highlight every claim the student makes about the *historical case* (e.g., 1938 Munich) and the *current case* (e.g., Current Trade Dispute).
  *   **PASS:** The student lists at least **three specific structural features** shared by both cases (e.g., "expansionist ideology," "military asymmetry," "failed diplomatic signaling") AND explicitly states the **general principle** connecting them (e.g., "Appeasement encourages aggression").
  *   **FAIL:** The student relies on the label alone (e.g., "This is Munich") without listing shared features, OR equates specific individuals/dates rather than structural dynamics (e.g., "Leader X is just like Hitler").

  ### Test 2: The Falsifier (Disconfirmation)
  *Addresses: The lesson stated so that no outcome could disconfirm it.*

  *   **Instruction:** Locate the student's conclusion or policy recommendation. Ask: "What evidence, if found in the current case, would make the student admit this analogy does *not* apply?"
  *   **PASS:** The student identifies a **scope condition** or a **disqualifying factor** (e.g., "If the rising power shows restraint in non-trade sectors, the Munich analogy fails").
  *   **FAIL:** The argument is unfalsifiable. Any evidence is interpreted as confirming the analogy (e.g., "Their aggression proves it's Munich; their cooperation is just a trick to prove it's Munich").

  ### Test 3: The Invariance Check (Robustness)
  *Addresses: The invariance test; The level-of-abstraction problem.*

  *   **Instruction:** Identify one major feature of the current situation that the student *did not mention* (e.g., nuclear weapons, global supply chains, domestic politics). Ask: "Does the student's conclusion depend on this feature matching the historical case?"
  *   **PASS:** The student explicitly acknowledges a difference between the cases but argues it is **irrelevant** to the causal mechanism (e.g., "Unlike 1938, we have nuclear weapons, but because the conflict is economic, this does not alter the appeasement dynamic").
  *   **FAIL:** The student ignores significant differences, or the argument collapses if a superficial detail changes (e.g., the argument relies on the leader's personality rather than the regime type).

  ### Test 4: The Agency Test (Mechanism vs. Determinism)
  *Addresses: The Thucydides trap/structural inevitability; The analogy actors were invoking.*

  *   **Instruction:** Examine the causal link. Does the analogy predict an outcome or recommend a policy to alter an outcome?
  *   **PASS:** The analogy is used to identify a **risk** that policy can mitigate or exploit (e.g., "Vietnam shows the risk of quagmires, so we must set exit criteria"). Human agency matters.
  *   **FAIL:** The analogy is used to claim **inevitability** (e.g., "Thucydides Trap means war is structural and policy cannot matter"). The analogy removes the need for decision-making.

  ---

  ## Part II: The Judgment Zone (Hand-Off)

  If a paper passes all four tests, the TA marks it **"Functional Analogy."** However, the TA must flag the paper for **Instructor Review** if either of the following applies. These require historical knowledge beyond the 10-minute limit.

  1.  **The Reflexivity Flag:** The student notes that current political actors are *themselves* using this historical analogy to justify their actions. (Risk: The analogy is a self-fulfilling prophecy, not an objective comparison).
  2.  **The Contention Flag:** The student acknowledges that the *same* historical analogy is used by opponents to argue the opposite conclusion. (Risk: The student must explain why their application is superior; if they don't, the analogy is contested).

  *Instructor Note:* You must review these flagged papers to determine if the student has adequately handled the reflexive or contested nature of the analogy. The TA procedure cannot adjudicate historical contestation.

  ---

  ## Part III: Application to Current Papers

  Here is the application of the Audit to the three papers currently on your desk.

  ### Paper 1: The Trade Concession (Munich)
  *Argument:* Conceding on tariffs is appeasement; this is Munich; we must stand firm.
  *   **Test 1 (Inventory):** **FAIL.** The paper asserts "This is Munich" but lists no structural features shared between 1938 Europe and the current trade partner (e.g., territorial ambition vs. economic surplus). It relies on the label.
  *   **Result:** **Decorative.** The analogy lends moral urgency but performs no logical work.
  *   **TA Action:** Mark down for unsupported assertion.

  ### Paper 2: The Limited Intervention (Vietnam)
  *Argument:* Intervention is justified *only if* we have clear exit criteria, because Vietnam taught us to avoid quagmires.
  *   **Test 1 (Inventory):** **PASS.** Identifies features: "unclear objectives," "local legitimacy deficit," "open-ended commitment." States principle: "Interventions fail without exit strategies."
  *   **Test 2 (Falsifier):** **PASS.** Implies that if exit criteria *are* clear, the Vietnam warning does not apply.
  *   **Test 3 (Invariance):** **PASS.** Acknowledges technology/terrain differs, but argues the *political* dynamic of domestic will is invariant.
  *   **Test 4 (Agency):** **PASS.** Uses history to set constraints on policy, not to forbid policy.
  *   **Result:** **Functional.**
  *   **Instructor Honesty Check:** You noted this is an argument you make in lecture. If the procedure failed this, it would be because the argument was framed as "Vietnam means all interventions fail" (Determinism). As described ("taught us to avoid quagmires"), it treats the analogy as a lesson on *conditions*, not a prophecy of *defeat*. The procedure correctly validates this distinction. If your lecture version relies on inevitability, the procedure is correctly flagging a logical weakness in your own rhetoric.

  ### Paper 3: The Great-Power War (Thucydides Trap)
  *Argument:* A rising power and a ruling power are structurally destined for war; policy cannot matter; we must prepare for conflict.
  *   **Test 1 (Inventory):** **PASS.** Identifies structural features: "rising GDP," "naval expansion," "alliance networks."
  *   **Test 2 (Falsifier):** **FAIL.** The claim is that war is "structural." There is no condition under which war *does not* happen.
  *   **Test 4 (Agency):** **FAIL.** Explicitly states "policy therefore cannot matter." This removes the purpose of practical reasoning.
  *   **Result:** **Decorative (Deterministic).** The analogy is used to abdicate reasoning, not to guide it.
  *   **TA Action:** Mark down for fatalism; note that practical reasoning requires agency.

  ---

  ## Part IV: Limitations of the Procedure

  As the course convenor, you must understand where this tool is blind. A paper can pass the Audit and still be poor, or fail and still be insightful.

  **1. The "True History" Blind Spot**
  The TA cannot verify historical accuracy. A student can construct a logically perfect analogy (Passes all 4 tests) based on entirely false historical premises (e.g., claiming Munich succeeded in preserving peace). The procedure grades *reasoning structure*, not *factual correctness*. You will need to spot-check "Functional" papers for historical hallucinations.

  **2. The "Novel Insight" Penalty**
  A student may make a subtle, novel argument that doesn't fit the "Three Features" requirement of Test 1 because the analogy is nuanced or singular. The procedure favors standard, formulaic argumentation. A brilliant paper might be flagged for Instructor Review simply because it breaks the checklist.

  **3. The Reflexivity Gap**
  The TA cannot know if the historical actors invoked the analogy themselves (e.g., if the current leaders are consciously acting out the Thucydides Trap). This changes the analogy from an observation to a causal factor. The "Reflexivity Flag" in the Judgment Zone attempts to catch this, but relies on the student disclosing it. If the student doesn't know, the TA won't know.

  **4. The "Good Argument, Bad Conclusion" Problem**
  The procedure validates the *use* of the analogy, not the *policy recommendation*. A student can pass all tests and argue for a policy you (or the consensus) deem immoral or disastrous. The Audit ensures they have reasoned consistently from their premises; it does not ensure the premises are wise.

  **5. False Negatives on First-Year Writing**
  First-year students often write poorly. They may have a sound analogical intuition but fail Test 1 (Inventory) simply because they cannot articulate the three features clearly in the word limit. The procedure may mark down a student who *thinks* well but *writes* poorly. You should allow a "Writing Quality" override for papers that fail Test 1 but show strong intuitive grasp in the Judgment Zone.
