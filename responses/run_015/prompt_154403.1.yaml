answer: |-
  This is a sophisticated observation that cuts to the core of contemporary institutional pathology. You have correctly identified that the phenomenon exceeds mere behavioral adaptation (incentive distortion) and enters the realm of truth-production (epistemology) and being (ontology).

  You are asking for a "carving"—a precise conceptual boundary that separates this from adjacent phenomena like Goodhart's Law, Audit Culture, or Foucaultian discipline.

  After reviewing the relevant literature in political philosophy, science and technology studies (STS), and institutional sociology, my assessment is this: **There is no single, canonical term that captures this exact triad (Ontological Redefinition + Migration of Tacit Knowledge + Epistemic Valorization of Blindness).**

  The literature fragments this phenomenon. *Goodhart's Law* captures the distortion but not the ontology. *Audit Culture* (Power, Strathern) captures the ritual but not the specific claim that blindness equals rigor. *Foucault's Panopticism* captures the visibility but assumes the goal is subjugation, not necessarily the redefinition of professional truth. *Commensuration* (Espeland & Stevens) captures the translation of quality to quantity but often treats it as a neutral negotiation rather than an ontological overwrite.

  To give you the precision you require, I will propose a synthesized term that anchors this configuration within the existing theoretical landscape while marking its specific novelty.

  ### The Proposed Concept: **Ontological Metricization**

  I define **Ontological Metricization** as the institutional process by which a measurement regime does not merely track performance but actively constitutes the reality of the profession, simultaneously disqualifying unmeasurable practices as epistemically invalid.

  While "Metricization" usually refers to the *process* of applying metrics, **Ontological Metricization** specifies the *outcome*: the metric becomes the ontology (the account of what exists), and the residual (the unmeasured) is treated not as "unknown" but as "non-professional."

  Here is the precise carving of the concept, distinguishing it from its nearest neighbors.

  ---

  ### 1. The Mechanism: Three Distinct Phases
  To distinguish this from simple "gaming," we must isolate the three phases you observed. Ontological Metricization requires all three:

  1.  **Behavioral Alignment (The Goodhart Phase):** Staff adjust behavior to maximize the metric. *This is common to many systems.*
  2.  **Ontological Reclassification (The Shift):** The institution formally or informally re-categorizes the measured activities as the "core work" and the unmeasured activities (mentoring, tacit judgment) as "overhead," "personal time," or "inefficiency." *This distinguishes it from Goodhart's Law.*
  3.  **Epistemic Sanitization (The Inversion):** The institution interprets its inability to measure the residual work not as a limitation of the metric, but as evidence that the residual work lacks professional rigor. The blind spot is rebranded as **methodological purity**. *This is the unique signature of Ontological Metricization.*

  ### 2. Boundary Conditions: What It Is Not

  To ensure conceptual clarity, we must distinguish Ontological Metricization from three adjacent concepts you mentioned.

  #### A. Versus Goodhart's Law / Campbell's Law
  *   **The Distinction:** Goodhart's Law describes **Incentive Distortion**. It predicts that when a measure becomes a target, it ceases to be a good measure. It assumes the underlying reality remains constant but is corrupted by the actor.
  *   **Why it falls short:** In your observation, the reality *itself* changes. The profession is not just "corrupted"; it is *redefined*. Furthermore, Goodhart's Law implies a failure of the metric. Ontological Metricization succeeds precisely because the institution believes the metric *is* the reality. The "failure" is a feature, not a bug.

  #### B. Versus Foucault's Panopticism / The Examination
  *   **The Distinction:** Foucault's *Discipline and Punish* describes **Disciplinary Visibility**. The Panopticon works because the subject *internalizes* the gaze. The "Examination" turns the individual into a "case."
  *   **Why it falls short:** Foucault's visibility is about **subjugation and normalization**. Your observation is about **epistemic authority**. In the Panopticon, the watcher sees everything (or the subject believes they do). In Ontological Metricization, the watcher *admits* they cannot see the tacit work, but claims that *because* they cannot see it, it does not count as knowledge. Foucault explains the power dynamic; he does not fully account for the *positivist claim* that "unquantified = unreal." This is a specific modern evolution of discipline into **administrative positivism**.

  #### C. Versus Audit Culture (Michael Power)
  *   **The Distinction:** Audit Culture describes the **Ritual of Verification**. It focuses on how trust is replaced by checking. It explains why the metrics exist (to signal legitimacy to external stakeholders).
  *   **Why it falls short:** Audit Culture explains the *pressure* to measure, but it often treats the metrics as "decoupled" from actual work (i.e., people pretend to work to satisfy the audit). Ontological Metricization is more insidious: the work *actually changes* to match the audit, and the workers come to believe the audit represents the truth. It is not decoupling; it is **ontological coupling**.

  ### 3. The Closest Analogues (and Where They Stop)

  If you wish to ground this in existing literature, these are the nearest neighbors. You can position Ontological Metricization as the synthesis of these three:

  1.  **Commensuration (Espeland & Stevens):** The sociological process of transforming different qualities into a common metric.
      *   *Limit:* Describes the translation, not the *disqualification* of the untranslatable.
  2.  **Performativity (Callon / Butler via STS):** The idea that metrics do not describe reality but *enact* it.
      *   *Limit:* Performativity is often ontologically neutral (multiple realities can co-exist). Ontological Metricization is **hegemonic**; it seeks to eliminate the alternative reality (the tacit work).
  3.  **Agnotology (Proctor / Schiebinger):** The study of culturally induced ignorance.
      *   *Limit:* Agnotology usually studies the *production of ignorance* (e.g., tobacco companies hiding cancer data). Ontological Metricization is the **valorization of ignorance**. It claims the ignorance is a sign of scientific rigor ("We only study what is observable").

  ### 4. Why "Ontological Metricization" Fits Your Observation

  The specific move you identified—the interpretation of blindness as rigor—is an **epistemic closure mechanism**.

  In a hospital, for example, "clinical judgment" is tacit. A dashboard tracks "patient turnover time."
  *   **Goodhart:** Doctors rush patients to lower time.
  *   **Ontological Metricization:** The hospital administration concludes that "time efficiency" is the definition of good medicine. If a doctor spends 20 minutes listening to a patient (unmeasured), the system records this as "idle time." The administration then argues, "We have no data showing that listening improves outcomes; therefore, it is not evidence-based practice."

  The absence of data is used as proof of the absence of value. This is the **Positivist Inversion**.

  ### 5. Recommended Terminology for Your Analysis

  If you are writing or speaking about this, I recommend using **Ontological Metricization** as the overarching structural term, but I suggest you explicitly name the epistemic move you found most striking.

  For the specific move where "blindness is treated as rigor," I propose the term **Epistemic Sanitization**.

  *   **Definition:** The process by which an institution removes "messy" unquantifiable variables from its definition of reality, framing this removal not as a loss of information, but as an increase in methodological purity.

  **Summary Definition for Your Use:**
  > **Ontological Metricization:** An institutional regime wherein accountability metrics cease to function as representational tools and instead constitute the primary ontology of the profession. This regime is characterized by **Epistemic Sanitization**, wherein activities resisting quantification are not merely deprioritized but are reclassified as unprofessional or non-existent, and the system's inability to measure them is framed as a virtue of methodological rigor.

  ### 6. Intellectual Lineage

  If you need to cite the "school of thought" this belongs to, it sits at the intersection of:
  1.  **Critical Data Studies** (e.g., Rob Kitchin, *The Data Revolution*): Critiques the assumption that data is neutral.
  2.  **Science and Technology Studies (STS)** (e.g., Annemarie Mol, *The Body Multiple*): Discusses how practices enact reality.
  3.  **Neo-Foucaultian Governmentality** (e.g., Nikolas Rose, *Powers of Freedom*): Discusses how numbers govern the soul.

  Your observation adds a specific nuance to Governmentality: it is not just that we are governed by numbers, but that we are **ontologically reduced** to them, with the reduction itself justified as epistemic progress.

  ### Final Verdict

  The literature has not carved this out as a single, named phenomenon. It has the pieces (Commensuration, Audit, Performativity), but it lacks the specific label for the **ontological inversion combined with the valorization of the blind spot**.

  **Ontological Metricization** is the precise term you need. It distinguishes the phenomenon from simple gaming (Goodhart) and simple surveillance (Foucault) by highlighting that the *nature of the work itself* is being rewritten, and the *loss of the unmeasured* is being sold as a gain in clarity.
