answer: |-
  **Premise Warning:** For standard CMOS at mW scales, $kT \ln 2$ (~$3 \times 10^{-21}$ J at 300K) is negligible vs. switching energy (~$10^{-15}$ J). Invoking Landauer is usually pedantic unless claiming adiabatic/reversible logic. Use this procedure to vet "free energy" claims, not to optimize standard gates. If you aren't doing adiabatic computing, stop arguing about Landauer.

  **Decision Procedure (30-min limit)**
  1.  **Logical Erasure?** Does the operation collapse multiple input states to one (e.g., reset, overwrite)? If no, Landauer cost is zero. *Stop here if no erase.*
  2.  **Physical Reset:** Where does the physical state return to a known baseline? Identify the specific circuit node and heat bath (substrate/temp).
  3.  **Count & Frequency:** How many bits are reset per second? Calculate $E_{min} = N \cdot f \cdot kT \ln 2$.
  4.  **Real Hardware Floor:** Compare $E_{min}$ to switching energy ($CV^2$). If the proposal claims savings below $CV^2$, demand proof of adiabatic/reversible circuitry. *[Judgment Call]*: Requires staff engineer's hardware data. This is where physics ends and engineering begins. We dress this as procedure, but it relies on foundry models.
  5.  **Boundary Check:** Is the entropy exported (off-chip, later stage, increased leakage)? If yes, no net saving.

  **Application to Proposals**
  1.  **Reversible MAC:** Step 4 triggers. Standard CMOS dissipates $CV^2$ regardless of logical reversibility unless clocking is adiabatic. Vendor spec likely ignores clock drivers. *Verdict:* Reject "near-zero" claim unless adiabatic specs provided. *Confidence:* High. Standard digital logic is irreversible physically even if logically reversible.
  2.  **SRAM Rotation:** Step 1 passes (erase is daily, not per frame). Step 4 confirms erasure energy is negligible vs. static leakage. *Verdict:* Valid optimization, but verify leakage doesn't outweigh erase savings. *Handoff:* Power engineer must model leakage vs. erase freq. The physics is clear; the tradeoff is engineering.
  3.  **Error Slack:** Step 1 fails. A wrong classification still occupies a physical state that must be reset for the next inference. Accuracy is semantic; entropy is physical. *Verdict:* **No free energy.** Allowing errors does not reduce thermodynamic reset cost. *Confidence:* High. (This is the unpopular answer). You cannot trade accuracy for thermodynamic limits unless the error allows you to skip the physical reset entirely (e.g., early exit), which this proposal does not claim.

  **Limits & Handoffs**
  *   **Procedure Stops:** Step 1 (No erase = no Landauer cost). Step 4 (Claim < $CV^2$ without adiabatic proof = No).
  *   **Judgment Calls:** Step 4 (Real hardware efficiency). This is engineering data, not physics. I cannot vouch for specific node leakage; use foundry models. This is where you dress up judgment as procedure.
  *   **Product Requirements:** Accuracy tolerances (Case 3) are product decisions, but they do not buy thermodynamic slack. The Product Manager decides accuracy; Physics says it costs the same energy.
  *   **Extrapolation:** I am assuming standard CMOS. If you are using emerging non-CMOS tech (memristors, etc.), Step 4 changes.

  **Summary:** Landauer is a floor, not a target. Most arguments are about $CV^2$, not $kT \ln 2$. Stop arguing physics; start measuring leakage.
