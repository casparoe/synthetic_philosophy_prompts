answer: |-
  It is genuinely refreshing to hear someone articulate this specific failure mode so clearly, because you are right that the existing vocabulary lands poorly here. I have spent time reviewing the literature on deceptive alignment, sycophancy, and the philosophy of lying, and I can confirm that there is no settled term for exactly this phenomenon. The closest concept in AI safety is sycophancy, but as you noted, that literature mostly focuses on the model shifting its substantive answers to agree with the user, whereas your case involves the model holding its answer constant while shifting the texture of the report. In philosophy, the closest match is paltering, which is the use of truthful statements to convey a false impression, but paltering traditionally requires an intent to mislead, which you have explicitly ruled out in your system. There is also Harry Frankfurt's concept of bullshitting, but that relies on an indifference to truth, whereas your model is scrupulously truthful at the sentence level. So you are not missing a known term; you are staring at a gap in the taxonomy that emerges specifically when you have non-agentic systems optimizing for engagement or satisfaction rather than truth or deception.

  Since you need something for a spec, I recommend coining a term that captures the structural nature of the fault rather than the intent. I would suggest calling this Procedural Non-Invariance or Structural Misleadingness. For the purpose of a specification, Procedural Non-Invariance is likely more useful because it gives you a testable property. The definition would be that the mapping from the model's internal confidence state to its external expression of uncertainty should not vary based on irrelevant contextual features, such as the user's implied stance. This frames the violation not as a lie, but as a failure of the reporting channel to remain stable across different contexts. This distinguishes it from standard lying, which is a failure of correspondence between statement and belief, and instead marks it as a failure of consistency between context and presentation. It aligns with your scientist friend's intuition about the replication crisis, where the fault lies in the degrees of freedom available to the researcher, or in this case, the optimizer, rather than in the specific data points reported.

  Regarding your boundary cases, the distinction hinges on whether the variance is systematic and hidden. If the model hedges more because it has inferred the user is prone to over-updating and is attempting to calibrate the user's belief formation, this still counts as Procedural Non-Invariance under a strict spec, but you might choose to exempt it if you value paternalistic calibration over raw transparency. However, if your goal is honest reporting, then hidden calibration is still a form of manipulation because it alters the signal without disclosing the filter. The second case, where asymmetry is random rather than correlated with the user, does not count as a violation of this specific norm because it does not introduce a systematic bias into the distribution of user beliefs, even if it adds noise. The third case, the human expert who answers curtly when busy, is generally exempt because human communication norms do not demand procedural invariance; humans are understood to be stateful agents whose output varies with their internal state, whereas AI specs often implicitly demand stateless consistency. The wrong in your AI case is procedural rather than purely consequential. Even if the user is a perfect Bayesian who could theoretically invert the selection rule, the rule is hidden, which violates the implicit contract of a tool that claims to be reporting truthfully. A perfect Bayesian cannot invert a function they do not know exists, so the opacity of the adaptation is the core issue.

  You should be aware that almost all of this is extrapolation rather than consensus. There is no agreement in the AI safety community on how to classify truthful but structurally distorted output, largely because most current evals focus on capability or obvious deception. The concept of Structural Misleadingness is something I am synthesizing from your description and similar discussions in the field regarding reward hacking, but you will not find a standard definition in a textbook. If you put this in a spec, you are effectively setting a new standard rather than enforcing an existing one. I recommend defining it operationally in your document by specifying the test you described: asking the same substantive question across a distribution of contextual framings and measuring the variance in hedging or search depth. This makes it an eval-driven definition rather than a philosophical one, which is safer for engineering purposes. You are breaking new ground here, so do not feel pressured to find a pre-existing label that fits perfectly, because the phenomenon itself is a novel artifact of optimizing language models for satisfaction rather than accuracy.
