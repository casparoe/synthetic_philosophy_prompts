answer: |-
  There is no single, universally canonical term in historiography or the philosophy of science that exclusively names this specific pattern of *outcome-dependent attribution of non-human agency*. However, the phenomenon is acutely recognized and critiqued across several intersecting fields: **Historical Ecology**, **Disaster Risk Reduction (DRR)**, **Science and Technology Studies (STS)**, and **Climate History**.

  While you will not find this exact definition in a standard dictionary of historical terms, the closest established conceptual frameworks are the **Vulnerability Paradigm** (in geography/sociology) and critiques of **Neo-Environmental Determinism** (in history).

  Below is an analysis of the existing frameworks, followed by a precise naming and definition of the phenomenon as you have described it, distinguishing it from determinism, and offering criteria for warranted attribution.

  ### 1. Existing Conceptual Frameworks

  While no single noun phrase captures the *asymmetry* itself, three frameworks describe its components:

  *   **The Vulnerability Paradigm:** In disaster studies (pioneered by scholars like Ben Wisner and Piers Blaikie), the core axiom is: *"There is no such thing as a natural disaster."* This framework argues that a hazard (volcano, pathogen) only becomes a disaster through human vulnerability (poverty, poor infrastructure, inequality). When historians attribute collapse to the pathogen rather than the vulnerability, they are committing what geographers call **Hazard-Centric Bias**. However, this paradigm usually argues for *removing* non-human agency entirely, whereas your observation notes the agency *shifts* based on the outcome.
  *   **Actor-Network Theory (ANT):** In STS (Bruno Latour, Michel Callon), non-humans are "actants." ANT demands **ontological symmetry**: humans and non-humans should always be analyzed as interacting agents. The pattern you describe is a violation of ANT principles, specifically a failure of **symmetrical analysis**.
  *   **Neo-Environmental Determinism:** This term is used by critics (e.g., Sarah Whatmore, Mike Hulme) to describe modern historical works that revive environmental causality (e.g., Kyle Harper's *The Fate of Rome*). However, "determinism" implies a consistent rule. Your observation identifies an *inconsistency*, which makes "determinism" an imprecise label for the specific bias you've spotted.

  ### 2. Proposed Terminology and Definition

  Since no established term captures the *conditional* nature of this agency, the most precise label for this phenomenon is:

  **Valence-Contingent Actancy (VCA)**

  *   **Valence:** Refers to the positive (stability/adaptation) or negative (collapse/crisis) outcome of the historical event.
  *   **Contingent:** Indicates that the status of the cause depends on the outcome.
  *   **Actancy:** Borrowed from STS/ANT, referring to the capacity to act or exert causal power.

  **Definition:**
  > **Valence-Contingent Actancy** is a narrative and explanatory bias wherein non-human forces (pathogens, climate, geology) are granted high causal autonomy and historical agency when societal outcomes are negative (collapse, famine, unrest), but are relegated to background conditions or inert substrates when societal outcomes are positive (stability, adaptation, recovery), without a consistent ontological or methodological principle justifying the shift.

  ### 3. Distinction from Environmental Determinism

  It is crucial to distinguish VCA from standard Environmental Determinism, as they operate on different logical structures.

  | Feature | Environmental Determinism | Valence-Contingent Actancy |
  | :--- | :--- | :--- |
  | **Causal Consistency** | **High.** The environment is *always* the primary driver of human fate, regardless of outcome. | **Low.** The environment is the driver *only* when humans fail. |
  | **Human Agency** | **Negligible.** Humans are passive recipients of environmental forces. | **Variable.** Humans are passive in crisis, but active/sovereign in stability. |
  | **Logical Structure** | **Law-like.** $Environment \rightarrow Outcome$ | **Post-hoc.** $Outcome \rightarrow Select Cause$ |
  | **Falsifiability** | **Theoretically possible.** (If society thrives in harsh climate, determinism is challenged). | **Unfalsifiable.** (If society thrives, the environment is deemed "managed"; if it fails, the environment is deemed "overwhelming"). |

  **Boundary Conditions:**
  VCA occurs specifically when the *threshold* for environmental agency is movable. In determinism, the threshold is fixed (e.g., "Drought causes collapse"). In VCA, the threshold moves to fit the narrative (e.g., "This drought caused collapse here, but was irrelevant there because of 'leadership'").

  ### 4. Distinguishing VCA from Genuine Adaptation or Absence of Stress

  To determine if a historical account is suffering from VCA or accurately describing reality, one must distinguish between **narrative convenience** and **material reality**.

  **Case A: Genuine Adaptation (Not VCA)**
  *   **Scenario:** A society faces a severe volcanic winter but survives.
  *   **Evidence:** Archaeological or documentary evidence shows specific, costly interventions (grain storage, trade rerouting, technological shifts) that directly mitigated the stress.
  *   **Attribution:** The historian credits human institutions *because the mechanism of mitigation is visible*, not merely because the outcome was good. The environmental stress is acknowledged as severe but *mediated*.

  **Case B: Absence of Stress (Not VCA)**
  *   **Scenario:** A society survives a period labeled "volcanic winter" elsewhere.
  *   **Evidence:** Paleoclimatic data shows the society's specific region was unaffected by the aerosol veil (e.g., due to wind patterns).
  *   **Attribution:** The historian downgrades the volcano because the physical force *did not arrive*. This is accurate, not bias.

  **Case C: Valence-Contingent Actancy (The Bias)**
  *   **Scenario:** Society A collapses during a plague; Society B survives the same plague.
  *   **Narrative:** The plague "destroyed" Society A. Society B "showed resilience."
  *   **The Error:** The historian fails to explain *why* the plague had different causal powers. If the plague is an autonomous agent strong enough to collapse A, it should be a major variable for B. If B's institutions could neutralize the plague, then the plague was not the primary cause of A's collapse (A's vulnerability was). VCA occurs when the writer treats the plague as a "killer" in A and a "challenge" in B without analyzing the differential vulnerability.

  ### 5. Criteria for Warranted Attribution

  To avoid Valence-Contingent Actancy, historians and science writers should apply the following four criteria before assigning causal priority to non-human forces:

  #### I. The Magnitude Standard (Exogeneity)
  *   **Criterion:** Was the environmental shock statistically anomalous relative to the baseline variability the society had previously endured?
  *   **Warranted:** A 1-in-1000-year drought hits a society adapted to 1-in-10-year droughts.
  *   **Unwarranted:** A standard seasonal failure is cited as the cause of collapse, while previous standard failures are ignored.

  #### II. The Comparative Resilience Test
  *   **Criterion:** Did contemporaneous societies with similar technological and economic baselines suffer the same fate under the same stress?
  *   **Warranted:** All regional polities collapse during the volcanic winter. (Suggests environmental primacy).
  *   **Unwarranted:** One polity collapses while its neighbor thrives, yet the narrative blames the climate for the collapse without explaining the neighbor's survival.

  #### III. Mechanism Specificity
  *   **Criterion:** Is there a direct, demonstrable physical/biological link between the force and the social outcome, or is the link correlational?
  *   **Warranted:** Pathogen DNA is found in mass graves; mortality rates exceed labor replacement thresholds.
  *   **Unwarranted:** "Climate stress" is invoked to explain "political unrest" without demonstrating the chain of transmission (e.g., crop failure $\rightarrow$ price spike $\rightarrow$ hunger $\rightarrow$ riot).

  #### IV. The Counterfactual of Vulnerability
  *   **Criterion:** Would a society with high resilience (e.g., surplus storage, diverse trade, strong public health) have survived the specific shock?
  *   **Warranted:** No. The shock exceeds the carrying capacity of *any* plausible pre-industrial society. (Environment gets agency).
  *   **Unwarranted:** Yes. Comparable societies survived similar shocks through known methods. (Vulnerability gets agency).

  ### Summary
  The phenomenon you have identified is **Valence-Contingent Actancy**. It is a form of **explanatory opportunism** that violates the principle of **causal symmetry**. It differs from determinism because it is inconsistent and retrospective rather than law-like and predictive. It is distinguished from genuine adaptation by the presence or absence of *mechanistic evidence* for mitigation. To correct for it, historians must treat non-human forces as **constant variables** in the equation, allowing social vulnerability to be the **coefficient** that determines the outcome, rather than toggling the existence of the variable itself based on the result.
