  *   **Cost:** You must accept that "rational agents" cannot get rescued in the Classic Hitchhiker case unless they can bind themselves externally. You become the agent who leaves people in the desert because they can't credibly commit.

  **Path 2: The Functional Decision Theorist (FDT/Resolute)**
  *   **Principle:** Rationality is choosing the optimal decision *policy*. Your current decision is the logical truth-maker for the driver's past prediction.
  *   **Action:** **Overturn Classic, A, and C.** You should **Pay** in the Classic case and **Case B**. Furthermore, in **Case A and C**, if the driver knew you were rational enough to bypass reversible constraints, they wouldn't have saved you. To be the *type* of agent who gets saved, you must be the type who *doesn't* bypass reversible constraints if doing so violates the policy that secured the rescue. (This is the hard pill for CDT agents).
  *   **Cost:** You must accept paying when "causally futile" in the narrow sense.

