  ### Which Verdict Must You Overturn?

  You have two coherent paths. You cannot stay in the middle.

  **Path 1: The Sophisticated Instrumentalist (CDT)**
  *   **Principle:** Rationality is maximizing causal utility at the node of decision. Past predictions are sunk costs.
