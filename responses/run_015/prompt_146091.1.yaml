  **Precise Principle to Adopt:**
  > **The Principle of Ex Post Causal Dominance:** In sequential games where the benefit is already secured, an agent is rationally required to defect on commitments unless fulfilling them yields a *causal* future benefit (reputation, enforcement) or the agent adopts a non-standard decision theory (FDT) that treats logical correlation as causal leverage.

