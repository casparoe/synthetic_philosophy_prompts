answer: |-
  **Project Title:** Marriage as Interface: A Modular Account of Matrimony

  **Research Question**
  Does the widespread acceptance of same-sex marriage force us to abandon the idea that marriage has a single, unitary function (whether reproductive or companionate), and instead treat it as a modular institutional system where reproductive, economic, and affective components can be decoupled?

  **Background & The Problem**
  The usual philosophical tug-of-war over same-sex marriage is stuck in a rut. On one side, you have the natural law crowd arguing marriage is essentially for procreation; on the other, liberals arguing it's essentially about romantic companionship and commitment. Both sides assume marriage must have *one* essence that determines its boundaries. If you're Team Procreation, same-sex marriage looks like a category error. If you're Team Romance, it looks like a perfect fit.

  I think this framing misses the machinery entirely. It treats marriage like a natural kind (like "water" or "tiger") rather than what it actually is: a piece of social infrastructure. My proposal is to view marriage as a **standardised interface**. It's a protocol that allows disparate systems—tax law, inheritance rules, medical consent, immigration, kinship networks—to talk to each other without negotiating every single case from scratch.

  When we introduced same-sex marriage, we didn't just swap the participants; we stress-tested the interface. We kept the tax bits, the inheritance bits, and the next-of-kin bits, but we completely decoupled the "reproductive module". The fact that the system didn't crash suggests the "unitary function" view was wrong all along. This project wants to flesh out that intuition. It's not about arguing *for* same-sex marriage (that ship has sailed in many places), but about understanding what its existence tells us about the ontology of social institutions.

  **Methodology & Timeline (6 Months Part-Time)**
  Since this is a part-time grant, I'm not attempting a global legal survey. The heavy lifting here is conceptual, using legal structures as case studies rather than doing pure legal theory. I'm aiming for about 10–12 hours a week.

  *   **Months 1–2: Framing the Interface.**
      I'll start by mapping the existing philosophical literature on functionalism vs. institutionalism in marriage. I want to sharpen the "interface" metaphor so it doesn't just sound like tech-bro slang. I'll be looking at social ontology stuff (how we create institutional facts) to ground the idea that marriage is a "protocol". By the end of Month 2, I want a solid draft of the core theoretical framework.

  *   **Months 3–4: Comparative Conceptual Analysis.**
      Here's where I get my hands dirty. I'll pick two jurisdictions—likely the UK and one other (perhaps the US or Netherlands)—and look at the legislative texts surrounding the legalisation of same-sex marriage. I'm not looking for case law precedents, but rather the statutory structure. Specifically, I want to trace which "modules" remained untouched (e.g., tax allowances, pension rights) and which were explicitly altered or debated. The goal is to show that the legal machinery treats these rights as separable components, even if the public rhetoric talks about "marriage" as a single block.

  *   **Month 5: Synthesis & Objections.**
      I'll draft the main argument. Crucially, I need to steelman the opposition. Maybe the unitary view is more resilient than I think? Perhaps there's a deeper "union" concept that holds the modules together even without reproduction. I'll spend this month trying to break my own theory. If the modular view can't explain why we don't allow polygamous marriages (another modular possibility), the theory needs tweaking.

  *   **Month 6: Polishing & Dissemination.**
      Final edits, formatting, and preparing a summary article for a public philosophy outlet. I want this to be readable outside of academia, given the public interest in the topic.

  **Expected Outcomes & Failure Conditions**
  **Success:** A paper arguing that marriage is best understood as a cluster concept or a modular system. The result would be a shift in how we debate future family law issues (like polyamory or care networks). Instead of asking "Is this *really* marriage?", we'd ask "Which modules of the marriage protocol are relevant here?"

  **Failure:** There are two ways this could flop. First, if I find that the legal systems *didn't* actually decouple the modules—that granting same-sex marriage required such fundamental changes to the nature of the institution that it *is* a different thing entirely, supporting the unitary view. Second, practical failure: if the legal analysis becomes too time-consuming for a part-time schedule. If I get bogged down in statute law, I might need to pivot back to pure conceptual analysis using secondary sources.

  **Scope Check & Feasibility**
  Six months part-time is tight. I'm aware of the risk of scope creep. It's tempting to look at every jurisdiction that legalised same-sex marriage, but that's a job for a team, not a solo philosopher on a stipend. I'm restricting the legal analysis to illustrative examples only. The goal isn't to write a legal history, but to use the law as evidence for a philosophical claim.

  I'm also limiting the philosophical scope. I won't be solving the entire debate on social ontology or the metaphysics of institutions. I'm focusing strictly on the implications of the same-sex marriage shift. If I find myself drifting into general political philosophy, I'll reel it back in. The "interface" metaphor is specific enough to keep me honest, but broad enough to be interesting.

  Ultimately, this project is about updating our philosophical toolkit. We're using nineteenth-century concepts to debug twenty-first-century institutions. That mismatch is where the interesting problems are, and where I think this project can make a genuine contribution.
