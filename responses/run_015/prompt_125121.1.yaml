  I'm applying for a small six-month philosophy grant, part-time, and need a two-page proposal. My half-baked idea: the usual debate about same-sex marriage asks whether marriage is essentially reproductive or essentially about romantic companionship, but I think that misses the point entirely. What if marriage isn't a thing with a single purpose at all, but more like a social interface — a standardised protocol that lets tax law, inheritance rules, medical consent, and kinship all talk to each other without negotiating every case from scratch? Same-sex marriage doesn't just fit or fail one purpose; it tests whether that interface can still function when the reproductive module is completely decoupled from the other ones. So my question is: does fully accepting same-sex marriage force us to abandon the idea that marriage has a unitary function, and instead treat it as a modular system where reproductive, economic, and affective parts can be coupled or decoupled?

  Turn this into a proper proposal with: a precise research question, why the standard procreation-vs-companionship framing genuinely leaves it open, the method (what I'd actually do month by month — maybe comparing how different jursidictions structure marriage rights? or conceptual analysis of legal texts? suggest something realistic for a part-timer), what a result would look like and what would count as failure, and an honest scope check for six months part-time. Don't include a bibliography or citation list — I'll fill in referneces myself. Write the answer in British English, keep it casual, and don't sound like a funding robot. (Sorry if there's a typo or two in this brief — I wrote it quickly.)
