  I need to fill in a missing detail to make your case work: I'm assuming the drug in the second hospital is actually lethal in this context, otherwise the patient wouldn't die when it's delivered, and I'm assuming the nurse chose that default ten years ago specifically knowing it would enable these deaths. With that fixed, your engineer argument shows that defaults determine what counts as "in train," but it doesn't show the distinction is empty. In the first hospital, the lethal sequence is the patient's illness; the nurse's inaction leaves nature to take its course. In the second, the lethal sequence is the machine's program; the nurse's inaction leaves the machine to take its course. The engineer can swap these, yes, but that just means the engineer's choice is morally heavy, not that the nurse's action is the same. Changing the default changes the structure of agency available to the nurse, and that structure is exactly what the doing/allowing distinction tracks.

  Even with her prior choice, we should separate the *setting of the trap* from the *springing of it*. She did a wrong thing ten years ago by rigging the system, but today she is merely allowing the harm to proceed because she isn't stopping a process she didn't initiate *in this moment*. This still matters for what we can do right now. If she is allowing, we might be permitted to physically override her silence and cancel the infusion in the second hospital, whereas forcing her to actively confirm in the first might violate her bodily integrity differently because it requires her will to drive the event. The distinction tells us about the direction of force required to save the patient, and that remains true even if she is the one who wrote the code. The engineer's power to rewrite defaults doesn't erase the difference in agency; it just shifts where the blame for the setup lies.

  [The assumption that the default settings are morally arbitrary rather than safety-driven; if the switch is truly capricious, the moral weight of the distinction collapses into the engineer's whim rather than the nurse's agency.]
