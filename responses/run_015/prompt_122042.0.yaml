answer: |-
  Here is the backward induction argument and the Centipede Game restated in the language of institutional economics and contract design, followed by the residue report and an analysis of your variant.

  ### Part 1: The Contract Restatement
  **The Setup:**
  Imagine a Joint Venture (JV) structured as a finite, multi-stage contract between Party A and Party B. The contract has a hard sunset clause at Stage $T$. At each stage $t$, the current controlling party holds a **Real Option**: they can either exercise a **Liquidation Clause** (take the accumulated surplus and terminate) or execute a **Rollover Provision** (continue to $t+1$), which increases the total surplus pool but shifts control to the other party.

  **The Backward Induction Argument (as a Renegotiation-Proofness Test):**
  1.  **Terminal Node ($T$):** At the final stage, the contract expires. There is no future rollover value. Party B, holding control, has a fiduciary duty to maximize residual claims. Exercising the Liquidation Clause yields a higher immediate payoff than sharing. There is no reputational collateral beyond $T$. Therefore, B liquidates.
  2.  **Penultimate Node ($T-1$):** Party A anticipates B's liquidation at $T$. A calculates the Expected Value (EV) of rolling over. Since B will capture the surplus at $T$, A's share of the rollover value is less than A's liquidation value at $T-1$. The Rollover Provision is not **incentive-compatible** for A at $T-1$.
  3.  **Unraveling:** This logic propagates backward. Because the terminal behavior is fixed (liquidation), the continuation value at every prior node is depressed below the immediate liquidation value.
  4.  **The Rationalist Conclusion:** The contract is **not renegotiation-proof**. In fact, it is void *ab initio*. Party A should exercise the termination for convenience clause at Node 1. The optimal contract design is to not sign the JV.

  **The Paradox in Contract Terms:**
  In practice, parties sign these JVs and roll them over repeatedly, realizing gains far exceeding the Node 1 liquidation value. The "paradox" is that standard contract theory (assuming strict maximization and common knowledge thereof) predicts the deal dies at drafting, but institutional reality shows the deal thrives through execution.

  ---

  ### Part 2: The Residue Report

  Here is the translation fidelity check between Game Theory and Contract Law/Institutional Economics.

  #### 1. What Translates Cleanly
  *   **Finite Horizon $\rightarrow$ Fixed-Term Sunset:** The mathematical requirement for a known end-date maps perfectly to a contract with a fixed expiration date and no automatic renewal.
  *   **Defection $\rightarrow$ Exercising Exit Options:** "Taking the money" is legally equivalent to triggering a termination for convenience or liquidation preference.
  *   **Unraveling $\rightarrow$ Hold-Up Problem:** The backward induction logic is essentially a formalized hold-up problem. If I know you will hold me up at $T$, I won't make specific investments at $T-1$.
  *   **Payoffs $\rightarrow$ Residual Claims:** The utility functions map cleanly to the distribution of residual control rights and cash flow rights.

  #### 2. What Requires Distortion (The "Rationality" Problem)
  *   **Rationality $\rightarrow$ Fiduciary Maximization:** To make BI work in contract terms, you must assume parties are *legally constrained* to maximize only their own immediate residual claim. In reality, contract law allows parties to consider "course of dealing," "reputation," or "implicit covenants of good faith."
      *   *The Distortion:* You have to assume the contract *forbids* the parties from valuing the relationship. BI assumes the contract is **complete** regarding incentives but **incomplete** regarding enforcement of cooperation.
  *   **Common Knowledge $\rightarrow$ Recital Clauses:** In games, CKR is an epistemic state. In contracts, this would look like a Recital: *"Whereas, both parties acknowledge that the other will act to maximize their own short-term financial interest at every decision node..."*
      *   *The Distortion:* Lawyers never draft this. Why? Because it destroys the deal value. CKR is a predictive assumption for the theorist, not a prescriptive clause for the drafter.

  #### 3. What Has No Counterpart (The Missing Tool)
  *   **Exogenous Rules vs. Endogenous Design:** This is the critical failure of the translation. In the Centipede Game, the payoff structure is **exogenous** and immutable. You cannot write a clause that changes the payoff at Node $T$ once the game starts.
      *   *In Contracting:* We solve the BI paradox precisely by **changing the rules**. We add penalty clauses, escrow accounts, performance bonds, or "poison pills" that make liquidation at Node $T$ costly for Party B.
      *   *The Verdict:* The Centipede Game models a contract *without enforcement mechanisms*. It is a model of a handshake deal in a vacuum. Contract law is the technology we invented specifically to break backward induction.
  *   **Is CKR Missing from Law?** No. Contract law does not need Common Knowledge of Rationality because it relies on **Common Knowledge of Enforcement**. Lawyers don't care if you *want* to defect; they care if you *can* afford to. CKR is a tool for predicting behavior in the absence of institutions. Contract law *is* the institution. It's not a missing tool; it's the solution to the problem CKR describes.

  ---

  ### Part 3: The Variant Analysis (Stochastic Sunsets)

  **Your Variant:** Payoff doubles ($2^t$), Survival Probability halves ($0.5^t$), Expected Value (EV) is flat.
  **Question:** Does backward induction still bite?

  **Contract Translation:**
  This is no longer a Fixed-Term Contract. This is an **Evergreen Agreement with Exogenous Termination Risk**.
  *   *Payoff Doubling:* Compounding value of the JV (synergies accrue).
  *   *Survival Halving:* Exogenous shock risk (Force Majeure, regulatory ban, market crash) that increases over time.
  *   *Flat EV:* The risk-adjusted value of continuing is identical to stopping.

  **Does BI Still Bite?**
  **No.** The induction chain breaks. Here is why, in institutional terms:

  1.  **Loss of the Anchor:** Backward induction requires a **common knowledge terminal node**. You must know *for certain* that the game ends at $T$. In your variant, there is no hard $T$. There is only a probability distribution of termination.
  2.  **Ambiguous Sunset Clauses:** In contract law, if the expiration date is uncertain (e.g., "This contract lasts until the FDA approves the drug," where approval probability drops over time), you cannot reason backward from a specific date. You cannot calculate the value at $T$ because $T$ is a random variable, not a constant.
  3.  **The Noise Breaks the Chain:** BI relies on the certainty that *if* we reach $T$, you *will* defect. If there is a probability the game ends *before* you get the chance to defect (due to the halving survival rate), the incentive to defect at the "theoretical" end is diluted.
  4.  **Risk Aversion & Option Value:** Even with flat EV, a risk-averse party (standard in institutional econ) might prefer the certain liquidation now over the risky rollover. However, this is not BI; this is **Real Options Valuation**. BI is about strategic anticipation of the *partner's* move. Your variant introduces *Nature's* move.

  **What This Reveals:**
  The standard Centipede paradox hides the fact that **finite horizons are artificial constructs**.
  *   In the standard game, the "end" is a rule of the game.
  *   In your variant, the "end" is a risk parameter.

  In institutional economics, this suggests that **uncertainty about the contract horizon is a cooperation mechanism.** If parties are unsure when the relationship will end (due to market conditions, not a calendar date), the "last period" problem dissolves. You cannot defect at the "last period" if you don't know which period is the last.

  **Conclusion on the Variant:**
  Your variant makes sense in contract terms (it's a risk-adjusted rollout). It reveals that the "Paradox" is actually an artifact of **deterministic sunset clauses**. If you draft contracts with ambiguous termination dates (or link them to stochastic external events), you naturally insulate the agreement from backward induction unraveling. The "noise" doesn't just break the induction chain; it removes the anchor required to cast the chain in the first place.

  **Summary for the Institutional Economist:**
  The Centipede Game is a model of a **complete contract with no enforcement**. Backward induction proves such a contract is worthless. Contract law exists to make the contract **incomplete** (leaving room for discretion) but **enforceable** (penalizing opportunism). Your variant shows that introducing **horizon uncertainty** (stochastic sunsets) achieves the same result as enforcement: it prevents the parties from identifying the moment to hold each other up.
