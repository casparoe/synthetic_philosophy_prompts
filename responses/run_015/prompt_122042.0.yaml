      *   **Part 3: The CKR Question.** (Predictive vs. Prescriptive).
      *   **Part 4: The Variant Analysis.** (Stochastic Sunsets).

  8.  *(Self-Correction during drafting)*: Make sure to emphasize that in contracts, we *add* clauses to stop BI. In the Centipede game, you *can't* add clauses. That's the fundamental disconnect. The Centipede game is a model of a contract *without* enforcement mechanisms.

  9.  *(Refining the Variant)*: If the survival probability is exogenous, it's not a pure Centipede game anymore. It's a game against Nature + Opponent. If the "end" is not common knowledge (because Nature might end it secretly?), then BI fails. This mirrors "ambiguous sunset clauses."

  10. **Final Polish:** Check against the "institutional economist" persona. Use terms like "ex-post opportunism," "incomplete contracting," "governance structure."

