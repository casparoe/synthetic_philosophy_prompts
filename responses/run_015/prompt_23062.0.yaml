  Anyway, could you write me a dialogue between two philosophers who disagree about whether a slur's derogatory force is baked into its literal meaning (the semanticist position, where the pejorative content is part of the propositional content and so it's non-cancellable and projects weirdly out of things like presuppositions) versus the view that the slur just means the same as its neutral synonym and all the sting is conveyed pragmatically, say via implicature or by treating the slur as a kind of demonstrative that points to a socially constructed stereotype? Make them both sharp and actually respond to each other's points — no strawmen please — and have them each bring up at least one concrete sentence example and try to genuinely convert the other by the end. I'm not sure I even have the right terminology for the demonstrative side of things, so feel free to use whatever the standard labels are.
