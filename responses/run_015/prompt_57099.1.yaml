      *   **User Profile:** New job in causal inference for public health. Philosophically inclined (knows terms like "interventionist," "counterfactual/possible-worlds account," "surgical-style intervention"). Committed interventionist (likely Woodwardian manipulationist).
      *   **Core Stance:** Causal claims = claims about interventions. Counterfactuals are just blurry gestures at interventions.
      *   **Specific Constraint:** Do *not* list usual objections. Press hard on *one* specific worry: **In principle non-intervenable variables** (market equilibria, ancestry, geological periods, dense feedback systems).
      *   **Secondary Question:** How exposed is the view to collapsing back into counterfactualism? What are the warning signs?
      *   **Formatting Requirement:** Rank defeaters from fatal to merely awkward. Be clear about which ones a committed interventionist would concede vs. explain away.
