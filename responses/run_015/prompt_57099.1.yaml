      *   **Part 1: The "In Principle Non-Intervenable" Worry (The Deep Cut):**
          *   Focus on *conceptual coherence* of the intervention, not just practical feasibility.
          *   *Case Study:* Ancestry/Geological Time. You can't change ancestry without changing the person entirely. Is it a "surgical" intervention?
          *   *Case Study:* Equilibrium. Changing price *is* changing supply/demand. You can't hold the rest fixed.
          *   *The Retreat:* Moving to "hypothetical interventions."
          *   *The Cost:* This is the critical point. If the intervention is hypothetical, its coherence depends on the *model structure*. If the model structure is just a set of counterfactual dependencies, interventionism has swallowed its tail.
          *   *Verdict:* This is the most dangerous objection. It threatens the *definition* of causality, not just its application.

      *   **Part 2: Collapse into Counterfactualism:**
          *   How to tell if it's happening?
          *   Sign 1: The "Agent" vanishes. If $I$ is just an exogenous error term, where is the manipulation?
          *   Sign 2: Modality. If you define interventions using "would" statements without a physical mechanism, you're doing Lewisian metaphysics with extra steps.
          *   Sign 3: The "Ideal" Intervention. Woodward's conditions (I1-I4) are defined counterfactually (e.g., $I$ does not affect $Y$ except through $X$).

      *   **Part 3: Ranking the Defeaters:**
