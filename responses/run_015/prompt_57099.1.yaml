          *   *Serious (but maybe survivable):* Collapse into counterfactualism. It undermines the *motivation* but maybe not the *utility*.
          *   *Awkward:* Practical impossibility (we can't intervene on stars). Interventionists usually explain this away via "in principle."
          *   *Conceded:* Interventionists *must* concede that if no intervention is definable even in principle, there is no causation. (Woodward admits this).

      *   **Refining the Argument (Self-Correction during drafting):**
