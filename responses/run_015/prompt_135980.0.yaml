answer: |-
  There is no single, canonical term in political ethics that perfectly captures this specific inversion of the "dirty hands" problem. However, your observation identifies a recognized and increasingly discussed mutation of classical political theory. It sits at the intersection of **Carl Schmitt's theory of sovereignty**, **sociological theories of stigma management**, and **recent work on populist performativity**.

  While the standard "dirty hands" problem (articulated by Michael Walzer, drawing on Machiavelli and Weber) treats moral violation as a tragic burden to be shouldered privately, the phenomenon you describe treats the violation as a **public badge of efficacy**.

  Below is an analysis of the closest existing concepts, a proposed precise definition for the phenomenon, and a differentiation from nearby theoretical ideas.

  ### 1. Closest Existing Concepts

  While no single term dominates, three theoretical frameworks converge on this phenomenon:

  *   **Stigma Embrace (International Relations/Sociology):** Drawing on the work of Rebecca Adler-Nissen, this concept describes how actors (usually states) who are labeled "deviant" or "pariahs" stop trying to clear their names and instead embrace the stigma to signal independence and resolve. In domestic politics, a leader embraces the label of "norm-breaker" to signal they are not constrained by a "failed" system.
  *   **Schmittian Sovereignty (The Exception):** Carl Schmitt defined the sovereign as "he who decides on the exception." In your scenario, the leader does not just decide the exception quietly; they *perform* the exception. The authority derives not from upholding the law, but from the visible capacity to suspend it.
  *   **Populist Performativity:** Scholars like Jan-Werner Müller and Benjamin Moffitt note that populists often derive legitimacy from "breaking the rules" of the elite. The transgression proves they are not part of the corrupt establishment bound by "political correctness" or "bureaucratic red tape."

  ### 2. Proposed Definition: "Constitutive Transgression"

  Since an established term is lacking, the most precise label for this phenomenon is **Constitutive Transgression**.

  **Definition:** A mode of political legitimation wherein a leader's authority is reinforced, rather than diminished, by the public acknowledgment of violating established moral or legal norms. The violation is not framed as a tragic necessity (as in Dirty Hands) but as a demonstrative act of loyalty to the collective, proving the leader's willingness to incur moral debt on behalf of the group.

  **Boundary Conditions:**
  1.  **Normative Baseline:** It requires a pre-existing liberal-democratic context where norms *are* expected to be held. You cannot constitute authority through transgression if there are no norms to transgress (e.g., in a totalitarian dictatorship, brutality is routine, not transgressive).
  2.  **Publicity:** The act must be known. Secrecy turns it into corruption or classic dirty hands; publicity turns it into Constitutive Transgression.
  3.  **In-Group/Out-Group Dynamic:** It requires a polarized audience. The "stain" repels the out-group (critics) but binds the in-group (supporters) more tightly, as the leader's moral risk is interpreted as a sacrifice for *their* specific safety.

  ### 3. Comparison: Classic Dirty Hands vs. Constitutive Transgression

  The structural inversion you identified can be mapped across three dimensions:

  | Dimension | Classic "Dirty Hands" (Walzer/Weber) | Constitutive Transgression (Your Phenomenon) |
  | :--- | :--- | :--- |
  | **Moral Psychology of Agent** | **Tragic Regret.** The agent feels guilt. They acknowledge the act is wrong and hope never to do it again. They seek to return to normalcy. | **Resolute Pride.** The agent displays willingness. The act is framed as "doing what is necessary" without apology. The guilt is rejected or reframed as strength. |
  | **Status of the "Stain"** | **Burden.** The moral cost is a liability that weighs on the leader's soul and reputation. It must be managed or atoned for. | **Asset.** The moral cost is capital. It signals that the leader is "serious" and unencumbered by naive morality. |
  | **Audience Evaluation** | **Forgiveness.** The public accepts the act as a necessary evil but views the leader as morally compromised. Trust is strained. | **Validation.** Supporters view the act as proof of competence. Critics are dismissed as weak. Trust is *deepened* among the base. |
  | **Relationship to Norms** | **Restorative.** The goal is to preserve the normative order by making an exception to save it. | **Disruptive.** The goal is to show the normative order is secondary to the leader's will or the group's survival. |

  ### 4. Distinction from Nearby Concepts

  To ensure precision, we must distinguish Constitutive Transgression from three adjacent concepts:

  **A. Costly Signaling Theory**
  *   *Standard View:* An agent signals commitment by incurring a cost (e.g., risking life, spending money) that a "fake" agent would not pay.
  *   *Distinction:* In standard costly signaling, the cost is a *loss* (e.g., blood, treasure). In Constitutive Transgression, the "cost" (moral reputation) is paradoxically converted into a *gain* (political authority). It is a form of **"Negative Costly Signaling,"** where the signal's value lies in the agent's willingness to be perceived as "bad" by external standards to prove they are "good" for the in-group.

  **B. Moral Authority Derived from Sacrifice**
  *   *Standard View:* A leader gains legitimacy by suffering for the people (e.g., imprisonment, physical hardship).
  *   *Distinction:* Sacrifice implies the leader *loses* something valuable. In Constitutive Transgression, the leader is not losing moral standing; they are rejecting the currency in which that standing is measured. They are not suffering; they are *empowering* themselves by showing immunity to moral censure.

  **C. The Legitimation of State Violence (Monopoly on Violence)**
  *   *Standard View:* The state has a legal right to use violence (police, military). This is bureaucratic and legalistic.
  *   *Distinction:* State violence is legitimate because it is *legal*. Constitutive Transgression relies on the act being *extra-legal* or *para-legal* (e.g., targeted killing without trial, negotiating with terrorists). If the act were fully legal, it would not generate the "stain" required for this specific form of legitimacy. The power comes from the *excess* over the law.

  ### 5. Why This Matters Now

  This phenomenon is distinct from hypocrisy because hypocrisy requires a gap between *action* and *professed value* (claiming to be good while doing bad). Constitutive Transgression closes that gap: the leader professes that "doing bad" (when necessary) *is* the relevant virtue.

  It differs from authoritarianism because it often thrives in **democratic contexts** where accountability mechanisms exist but are polarized. In an autocracy, the leader does not need to signal resolve to supporters; they simply rule. In a democracy, the leader must *prove* they are willing to fight the "enemies" of the people, even if fighting them requires breaking the rules the "enemies" wrote.

  **Summary:**
  You have identified a shift from the **Ethic of Responsibility** (bearing the guilt of necessary evil) to an **Ethic of Transgression** (wearing the guilt as a badge of honor). While political theory has not yet settled on a single term, **"Constitutive Transgression"** or **"Public Dirty Hands"** captures the mechanism: the moral stain is not a byproduct of power, but a raw material for its construction.
