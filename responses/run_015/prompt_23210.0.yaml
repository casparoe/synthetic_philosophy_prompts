      *   *Fair Warning Problem:* If the justification is "you were warned," but you *weren't* effectively warned (didn't hear/understand), the premise is false.
      *   *Consequentialist Counter:* A consequentialist might still punish the unaware person to maintain the system's integrity (everyone must check the laws). But a *Fair Warning Retributivist* struggles because the specific moral link (choice + knowledge) is broken.
      *   *Conclusion:* The argument collapses because it cannot justify punishing the specific individual who didn't receive the warning, unless it appeals to general system benefits (which is consequentialism).

  5.  **Drafting the Argument (Iterative Process):**

