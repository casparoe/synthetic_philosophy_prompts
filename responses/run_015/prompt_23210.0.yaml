answer: |-
  Your intuition is philosophically robust. Many legal philosophers have argued exactly what you are suggesting: that the "Fair Warning" justification is a hybrid theory that often collapses into consequentialism when pressed, and that it fails to satisfy the core requirements of pure retributivism, particularly regarding the unaware offender.

  Here is an argument supporting your hypothesis, broken down into three main points: the instrumental nature of the warning, the problem of moral culpability, and the shift from desert to system maintenance.

  ### 1. The Instrumentalization of the Warning
  Pure retributivism is **backward-looking**. It argues that punishment is justified solely because a moral wrong was committed in the past, and the offender *deserves* suffering in proportion to that wrong. The state's job is to balance the moral scales, regardless of future outcomes.

  The "Fair Warning" argument, however, introduces a **forward-looking condition**. It says punishment is justified because the state *pre-announced* the consequence.
  *   **The Consequentialist Creep:** Why do we issue warnings? In a pure retributive framework, a moral wrong is wrong regardless of whether it was codified. Murder was "deserving" of punishment before it was illegal. By making the *warning* a necessary condition for just punishment, you are implicitly admitting that the act itself isn't enough; the *communication* of the rule is what matters.
  *   **The Function of Communication:** The only reason to communicate a rule in advance is to influence behavior (i.e., deterrence). If the warning didn't serve the function of guiding conduct, it would be a pointless ritual. Therefore, valuing the "Fair Warning" is valuing the *efficacy* of the law as a behavioral guide. This is a consequentialist metric. You are no longer punishing because they are evil; you are punishing because they violated a terms-of-service agreement that exists to maintain social order.

  ### 2. The Problem of the Unaware Offender
  This is the strongest point in your critique. Pure retributivism relies on **moral culpability**. To deserve punishment, you must be morally blameworthy.

  *   **The Retributive Gap:** If an offender genuinely did not internalize the warning (due to ignorance, cultural difference, cognitive overload, or lack of access), the "Fair Warning" argument loses its grip. If the justification for punishment is "You knew the rules and chose to break them," then the person who *didn't* know the rules cannot be punished under this specific justification without contradiction.
  *   **The Consequentialist Pivot:** How does a proponent of Fair Warning respond to the unaware offender? Usually, they argue: *"It doesn't matter if they didn't hear the warning; we must punish them anyway to maintain the integrity of the warning system for everyone else."*
      *   Notice what happened there? The justification shifted from the **individual's desert** (Retributivism) to the **system's utility** (Consequentialism).
      *   If you punish the unaware person to ensure that *other* people take the warnings seriously, you are using that individual as a means to an end. This is classically utilitarian. A pure retributivist would have to admit that if the person truly lacked moral knowledge (mens rea), punishing them is unjust, regardless of the warning.

  ### 3. "Fairness" as a Proxy for "Efficiency"
  The "Fair Warning" argument often relies on a concept of fairness derived from contract theory (you agreed to the rules by staying in society). However, this is often a fiction that masks consequentialist goals.

  *   **The Price Theory:** Legal realists like Oliver Wendell Holmes Jr. argued that law is essentially a pricing system. The "warning" tells you the price of an action. If you pay the price (punishment), you have essentially purchased the right to break the rule. This is not retributive justice (which views punishment as a moral condemnation); it is a transactional, consequentialist model of social regulation.
  *   **Who is the Warning For?** If the warning is truly for the benefit of the offender (to ensure they have a fair choice), then punishing someone who didn't receive the warning is unjust. But if the warning is for the benefit of *society* (to establish clear norms), then punishing the unaware offender is justified to reinforce those norms. Since most legal systems *do* punish the unaware (under the maxim *ignorantia juris non excusat*), the system is prioritizing the societal benefit over the individual's moral desert. This confirms that the "Fair Warning" is a mechanism for social control, not a safeguard of individual moral justice.

  ### Conclusion
  Your suspicion is well-founded. The "Fair Warning" defense attempts to dress up consequentialist goals (deterrence, rule-following, social stability) in the language of retributive fairness (autonomy, choice, desert).

  It fails as a pure retributive argument because:
  1.  It makes punishment contingent on the **efficacy of communication** (a consequentialist metric) rather than the **inherent wrongness of the act**.
  2.  It cannot justify punishing the **unaware offender** without abandoning the individual's desert in favor of **systemic utility**.

  If the only reason the warning matters is that it allows the system to function predictably, then the "Fair Warning" argument is indeed consequentialism in a trench coat. It prioritizes the stability of the legal machine over the moral reality of the individual standing before the judge.
