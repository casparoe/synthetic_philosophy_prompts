      *   *Multiple Drafts Model:* Consciousness is not a single stream but a parallel process of various "drafts" of narrative fragments. There is no final cut, no central editor. What we call "conscious experience" is just the draft that wins out at a specific moment for specific behavioral output.
      *   *Selfhood:* The Self is a "center of narrative gravity," a fiction constructed by the brain, not a thing inside the brain.

