          *   *Cartesian Reading:* Joel is the editor. He is moving props (Clementine) around the stage of his mind. There is a "Joel" doing the hiding.
          *   *Dennettian Reading:* This is a clash of drafts. The "Erasure Draft" (Lacuna tech) vs. the "Preservation Draft" (Joel's emotional resistance). The "Joel" hiding her isn't a homunculus; it's a competing narrative fragment gaining temporary dominance. The fact that she doesn't fit (childhood Joel is confused) shows the incoherence of forcing a narrative where it doesn't belong.
          *   *Tension:* The visual perspective is first-person/over-the-shoulder. It implies a stable observer *during* the chaos. Dennett would say the observer is being constructed *in that moment*, not pre-existing.

      *   **Sequence 2: The Final Montauk Confrontation:**
