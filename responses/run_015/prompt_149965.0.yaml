      *   *User's Claim:* As scale increases (more participants, bigger harm), $P(\text{decisive})$ decreases, but Harm magnitude increases. Product (Expected Harm) stays flat.
      *   *Epi Critique:* This looks like a continuous approximation of a discrete threshold. If the "harm" scales linearly with the batch size, and the probability of triggering the batch scales inversely, the expectation is constant.
      *   *Is it an artifact?* It depends on the distribution of the jitter relative to the density of participants. If the jitter width is fixed but participant density increases, the probability of being pivotal drops faster than harm increases? No, wait.
      *   *Standard Model:* If $N$ people, threshold $K$. Harm $H$. $P(\text{pivotal}) \approx 1/N$ (roughly, if uniform). Expected harm $\approx H/N$. If $H \propto N$ (total harm scales with participants), then Expected Harm is constant.
