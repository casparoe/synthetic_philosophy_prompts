      *   *Fairness/Free-riding:* "I benefit from others' restraint."
          *   Epi translation: Public goods game. Herd immunity dynamics without vaccination cost. Non-excludable benefits.

  3.  **Translate the User's "Jitter/Threshold" Model:**
      *   *Setup:* Threshold $T$ for harm. Total exposure $X = \sum x_i$. Harm $H$ occurs if $X \ge T$.
