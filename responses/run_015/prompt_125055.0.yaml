  2.  **Evaluate the Flatmate's Position:**
      *   **Philosophical Stance:** This is classic Cartesian skepticism / infallibilism. He's adopting a very high bar for "knowledge" (infallibility or ruling out all logical possibilities, like brain-in-a-vat scenarios).
      *   **Pragmatic Consistency:** He acts as if he knows things (signs contracts, takes medicine) while claiming he doesn't *know* them. He calls this "pragmatics."
      *   **The Problem:** While philosophically coherent in a narrow sense (strict infallibilism), it's practically useless and linguistically misleading in everyday contexts. It divorces the word "know" from its functional role in human communication and coordination. It's a form of "contextualism" failure—ignoring that the standards for "knowledge" shift based on context.
      *   **Is it "wrong"?** It's not logically inconsistent, but it's pragmatically defective and arguably misuses the concept of knowledge as it functions in society. It creates an unnecessary barrier to communication without gaining any actual safety or accuracy.
      *   **The "Verbal Quibble" Aspect:** It is partly a verbal quibble about the definition of "know," but it has real-world consequences if it impedes decision-making or trust. However, since he acts normally, the main issue is conversational friction.
      *   **The Compromise:** His compromise (temporary assumptions) is actually a standard philosophical move (bracketing), which suggests he's engaging in a kind of intellectual game rather than genuine dysfunction.

  3.  **Determine the Bottom Line:**
      *   Is there something wrong? Yes, but it's not logical inconsistency; it's a misuse of language standards appropriate to the context.
      *   Draft Bottom Line: His rule isn't logically broken, but it misapplies a specialized philosophical standard to everyday contexts where the word "know" is meant to function practically rather than infallibly.
      *   Refining for punchiness: There is something wrong with it, but not because he's illogical; rather, he is applying a specialized philosophical definition of "knowledge" to everyday contexts where the word is meant to signal reliable action, not metaphysical certainty.

  4.  **Develop the Reasoning:**
      *   **Contextualism:** Epistemologists (like David Lewis or Keith DeRose) argue that the standards for "knowing" shift based on context. In a fraud detection meeting, high standards apply. In a flat about a stomach bug, low standards apply. He is ignoring context.
      *   **Function of Knowledge Claims:** When we say "I know," we aren't usually claiming metaphysical certainty; we're offering assurance that we are reliable enough to act on. By denying this, he undermines the social function of the word.
      *   **The "Moorean" Point:** G.E. Moore argued that some things (like "here is a hand") are more certain than the skeptical premises used to doubt them. Denying the existence of the front door is less reasonable than accepting the skeptical argument is misapplied.
      *   **The Pragmatic Contradiction:** He claims he doesn't know, yet acts as if he does. While he distinguishes "pragmatics" from "knowledge," this creates a disconnect. If "knowledge" doesn't guide action even when probability is overwhelming, the concept loses its value.
      *   **What to say:** Challenge the *purpose* of the word "know." Ask him what work the word is doing if it doesn't license action. Point out that contextualism is the dominant view in modern epistemology for exactly this reason.

