      There is something substantively wrong with his approach, not because it is illogical, but because it ignores how language actually functions by applying a specialized philosophical standard of infallibility to everyday contexts where "knowledge" is meant to signal reliable action rather than metaphysical certainty.

      His position relies on **infallibilism**, the idea that you can only know something if it is impossible for you to be wrong, but most contemporary epistemologists reject this in favor of **contextualism**, which holds that the standards for claiming knowledge shift depending on the situation. In his job, the cost of error is high, so the standard for "knowing" a transaction is fraudulent must be near-perfect; in your flat, the cost of error regarding a stomach bug is low, so the standard for "knowing" you are ill is much lower. By refusing to adjust his standards to the context, he is breaking the social contract of communication, where saying "I know" functions as an assurance that you are reliable enough to act on, not a claim that you have defeated every logical skeptical scenario.

      Furthermore, his distinction between "knowledge" and "pragmatic action" collapses under scrutiny because the primary purpose of attributing knowledge is to guide action. If he is willing to sign contracts and take medicine based on the evidence, he functionally treats those propositions as known, making his verbal denial a pointless semantic game that adds friction without adding accuracy. You can point out that Ludwig Wittgenstein argued some propositions (like "I have a body" or "this is a door") must be exempt from doubt to serve as the "hinges" upon which our ordinary questioning turns; if you doubt the hinges, you cannot turn the handle of any specific inquiry, including his fraud detection work.

      To engage him without just saying "be reasonable," ask him why he believes the definition of "know" should be fixed at the highest possible bar regardless of context, and point out that if "knowledge" never licenses action even when probability is overwhelming, the concept loses its utility for human coordination. You can also accept his compromise for arguments but insist that in daily life, the default context is "ordinary stakes," where his skeptical scenarios are irrelevant distractions rather than genuine alternatives that need ruling out.

