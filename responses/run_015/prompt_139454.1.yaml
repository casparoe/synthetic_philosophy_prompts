answer: |-
  # JOINT STATEMENT ON THE NATURE, PERSISTENCE, AND CHANGE OF SOCIAL NORMS

  ## PART I: AGREED CLAIMS

  The collaborating parties, representing the Equilibrium Programme (Camp A) and the Sanction-and-Transmission Programme (Camp B), stipulate the following propositions as the common foundation for this inquiry. These claims are derived from the stipulated field data regarding the two hamlets, the ferry, and the bridge, combined with ordinary conceptual analysis.

  1.  **Definition of Behavioural Regularity:** Both camps agree that a "behavioural regularity" exists when a specific pattern of action occurs with sufficient frequency in a recurrent situation to be statistically distinguishable from random variation. The ferry schedule (waiting ten minutes past the hour) in Years 0 to 3 and the north-side parking in Year 1 both qualify as behavioural regularities under this definition.
  2.  **Material Payoff Structure:** Both camps agree that in Years 1 to 3, the bridge offered a strictly dominant material payoff for all residents compared to the ferry. Crossing by bridge was faster and cheaper for every resident whatever anyone else did. Therefore, continued ferry use in Years 1 to 3 was not a coordination equilibrium based on material payoffs alone.
  3.  **The Intervention Effect:** Both camps agree that the posting of survey results in Year 2 constituted an intervention that altered the information available to residents. Specifically, it corrected the empirical expectation regarding the prevalence of ferry use and the normative expectation regarding the willingness of others to sanction bridge users. Both camps agree this intervention causally contributed to the reduction of ferry use from 41 per cent to 22 per cent.
  4.  **Definition of Phantom-Equilibrium Regularity:** Both camps adopt the stipulated term "phantom-equilibrium regularity" to describe a behavioural regularity that is stable *only* because participants hold false beliefs. In the **belief-phantom variant**, stability relies on false beliefs about others' preferences; in the **sanction-phantom variant**, stability relies on false beliefs about others' willingness to sanction, where in fact no one would sanction. Both camps agree that if a regularity persists after all relevant beliefs are corrected to match reality, it is not a phantom-equilibrium regularity.
  5.  **Non-Diagnostic Features:** Both camps agree that the mere existence of a regularity is non-diagnostic regarding the underlying mechanism. The fact that everyone parks on the north side does not, in itself, prove whether the cause is salience (Camp A) or prestige-biased transmission (Camp B), as both mechanisms can produce identical distributions of behaviour.
  6.  **Role of Expectations:** Both camps agree that expectations about the behaviour of others play a role in sustaining regularities. Camp A terms these "expectations of conformity" derived from common knowledge of equilibrium; Camp B terms these "empirical expectations" derived from cultural transmission. Both agree that in the hamlet case, users in Years 1 to 3 held the expectation that others would use the ferry.
  7.  **Absence of Formal Enforcement:** Both camps agree that no formal authority, fine, or exclusion mechanism was ever applied to ferry users or bridge users in the stipulated period. Any sanctioning discussed must be informal (social disapproval, refusal of service, or criticism).

  ## PART II: DISAGREEMENTS TABLE

  The following table enumerates the residual substantive disagreements. The formulations provided in the "Camp Formulation" columns are those that partisans of each camp would sign without hedging.

  | Issue | Camp A (Equilibrium) Formulation | Camp B (Sanction-and-Transmission) Formulation | Genuine or Verbal? | Reason for Assessment |
  | :--- | :--- | :--- | :--- | :--- |
  | **Status of Ferry Regularity (Years 1–3)** | The 41 per cent ferry use was a **convention**, defined as a coordination equilibrium sustained by preferences that include a weight for conformity and anticipated sanctioning, making it self-enforcing given those preferences. | The 41 per cent ferry use was a **norm of the sanction-phantom variant**, sustained by false beliefs about others' willingness to sanction, and not a convention because it was not a coordination equilibrium given actual material and psychological payoffs. | **Genuine** | The disagreement turns on whether "preferences" can legitimately include conformity weights that contradict stated personal disapproval (4 per cent), or whether this masks a false belief about social pressure. |
  | **Status of 22 Per Cent Plateau** | The residual 22 per cent usage is **not a phantom-equilibrium regularity**; it is a material equilibrium for the boat owners whose asset utilization preferences differ from the general population, persisting despite corrected beliefs. | The residual 22 per cent usage is a **belief-phantom variant of a phantom-equilibrium regularity**, stable only because the boat owners falsely believe the community prefers their continued operation despite the posted data showing otherwise. | **Genuine** | Camp A attributes persistence to divergent material interests (ownership); Camp B attributes it to persistent false beliefs about community preferences regarding the boat owners' role. |
  | **Modelling Sanctions and Conformity** | Loading sanctions and conformity into the **preferences** is legitimate modelling because it renders the theory testable by predicting that behaviour will change if those preferences change or if the equilibrium is disrupted. | Loading sanctions and conformity into the **preferences** is an immunity manoeuvre because it makes the theory unfalsifiable; any deviation can be explained by positing an unobserved preference for conformity rather than a transmission dynamic. | **Genuine** | This is a methodological dispute over what constitutes a testable commitment versus a post-hoc explanation of anomalies. |
  | **Explanation of North-Side Parking** | The north-side parking regularity is best explained by **salience**, where the first adopters created a focal point that solved a coordination problem for subsequent parkers without need for transmission. | The north-side parking regularity is best explained by **prestige-biased transmission**, where the three households acted as high-status models whose behaviour was copied by the population regardless of coordination payoffs. | **Genuine** | Both mechanisms predict the same outcome (clustering), but they imply different vulnerabilities to the removal of the initial adopters or the focal features. |
  | **Convention vs. Norm Distinction** | The distinction between conventions and sanction-backed norms is a **difference in the mechanism** that holds a regularity in place (coordination payoffs vs. other payoffs), but both share the same logical structure of equilibrium. | The distinction between conventions and sanction-backed norms is a **difference in kind**, as many socially central norms are not solutions to coordination problems at all and require transmission dynamics to explain their existence. | **Genuine** | Camp A sees all norms as a subset of equilibrium phenomena; Camp B sees coordination norms as a subset of a broader class of transmission-sustained regularities. |

  ## PART III: CRUXES

  The following sub-questions identify points where empirical resolution within the hamlet context would compel at least one camp to revise its position.

  **Crux 1: The Source of Stability in Years 1–3**
  *   **Sub-question:** Was the stability of the 41 per cent ferry usage driven by a genuine preference for conformity or by pluralistic ignorance (false belief about others' sanctions)?
  *   **Proposed Study:** Conduct a private, anonymous vote among the 41 per cent of ferry users asking: "If you knew for certain that no one else cared whether you used the bridge, would you switch?"
  *   **Camp A Prediction:** At least 60 per cent of ferry users will answer "No" (indicating a genuine preference for the ferry/conformity independent of false beliefs).
  *   **Camp B Prediction:** At least 60 per cent of ferry users will answer "Yes" (indicating their behaviour was contingent on the false belief that others cared).
  *   **Movement:** If the result matches Camp B's prediction, Camp A must concede the regularity was a sanction-phantom variant, not a convention. If the result matches Camp A's prediction, Camp B must concede that conformity preferences can sustain equilibria without false beliefs.

  **Crux 2: The Mechanism of Parking Emergence**
  *   **Sub-question:** Is the north-side parking regularity dependent on the continued presence of the prestigious initiators?
  *   **Proposed Study:** The three prestigious households who first adopted north-side parking move away from the hamlets permanently in Year 4. Researchers observe parking distribution for the following year.
  *   **Camp A Prediction:** North-side parking will remain above 80 per cent because the regularity has become a salient focal point independent of the initiators.
  *   **Camp B Prediction:** North-side parking will drop below 50 per cent because the source of prestige-biased transmission has been removed, triggering a re-evaluation of the practice.
  *   **Movement:** A significant drop moves Camp A; stability moves Camp B. This discriminates between salience (property of the situation) and transmission (property of the population structure).

  **Crux 3: The Nature of the 22 Per Cent Residual**
  *   **Sub-question:** Do the residual boat owners persist due to material asset interest or false normative beliefs?
  *   **Proposed Study:** Researchers offer the two oldest boat owners a subsidy equal to the market rental value of their boats for one year, conditional on them parking the boats and using the bridge exclusively.
  *   **Camp A Prediction:** Both owners will accept the subsidy immediately, as their persistence is driven by material payoff which the subsidy now overrides.
  *   **Camp B Prediction:** At least one owner will refuse the subsidy, citing a duty to the river or community need, indicating their behaviour is sustained by a false belief about normative necessity (belief-phantom).
  *   **Movement:** Refusal moves Camp A (forces admission of non-material motives); Acceptance moves Camp B (forces admission that the residual is material, not phantom).

  **Crux 4: Re-establishing the Ferry Norm**
  *   **Sub-question:** Can the ferry regularity be restored solely through public coordination without changing material payoffs?
  *   **Proposed Study:** Community leaders publicly pledge to use the ferry at a specific time daily, creating a new salient focal point, while bridge costs remain lower.
  *   **Camp A Prediction:** Ferry use will increase significantly (to >50 per cent) because the pledge creates a new coordination equilibrium (convention) that overrides the material payoff difference via conformity preferences.
  *   **Camp B Prediction:** Ferry use will not increase significantly (remaining <30 per cent) because transmission dynamics require more than a pledge; they require sustained sanctioning or conformist copying over time which a pledge alone does not generate.
  *   **Movement:** A large increase moves Camp B (showing salience/coordination can override transmission lag); no increase moves Camp A (showing material payoffs dominate coordination without sanctioning).

  **Note on Mediating Variables:** In Crux 4, both camps predict a change in *expectations*, but Camp A posits the mediating variable is *common knowledge of a new equilibrium*, while Camp B posits the mediating variable is *perceived prestige of the leaders*. Measuring whether residents follow the leaders because "everyone else will" (A) or because "these specific people did" (B) would discriminate between the camps even if the aggregate usage numbers are similar.

  ## PART IV: CLOSING SUBSECTIONS

  ### 1. Dissolution of Disputes into Verbal Questions
  A portion of the original dispute has dissolved into questions about words, specifically regarding the definition of "preference." Camp A uses "preference" to encompass any motivation that stabilizes a choice, including the desire to avoid social disapproval. Camp B uses "preference" to refer only to intrinsic valuations of outcomes, treating the desire to avoid disapproval as a separate constraint imposed by the social environment. Consequently, when Camp A states "agents prefer to conform," and Camp B states "agents are coerced by norms," they may be describing the same psychological state using different vocabularies. This verbal dispute is resolved by adhering to the definitions in Part I: Camp A will speak of "equilibrium of preferences" and Camp B of "sustenance by expectations," acknowledging that these may map to the same observable behaviour in the hamlet data without agreeing on the underlying ontology.

  ### 2. Falsification and Expected Errors
  Both camps commit to the following conditions under which they would count their view as falsified or erroneous:

  *   **Camp A (Equilibrium):** Camp A would count its view as falsified if a behavioural regularity is observed to persist stably over a long period where **every** participant prefers to deviate, knows that every other participant prefers to deviate, and knows that no sanction will occur upon deviation. Camp A expects to be wrong in cases where "common knowledge" is impossible to establish, yet norms persist; in such cases, Camp A acknowledges its model of equilibrium may be too demanding.
  *   **Camp B (Sanction-and-Transmission):** Camp B would count its view as falsified if a behavioural regularity is observed to emerge instantaneously across a population without any prior cultural transmission, prestige modelling, or history of sanctioning, solely based on the logical structure of the payoff matrix. Camp B expects to be wrong in cases of pure coordination (like the initial ferry schedule before the bridge) where transmission dynamics are unnecessary; in such cases, Camp B acknowledges its model may over-attribute complexity to simple equilibrium selection.
