answer: |-
  ### Teaching Plan: Origin Essentialism (90 Minutes)

  #### I. Dependency Order
  To prevent the discussion from collapsing into biology or law, you must secure the metaphysical framework before stating the thesis.

  1.  **Secure the Distinction: Numerical vs. Qualitative Identity (Minutes 0–15)**
      *   **The Distinction:** You must establish the difference between being *the very same individual* (Numerical) and being *an exact duplicate* (Qualitative).
      *   **Why it precedes the thesis:** Without this, participants will argue that a clone or a sibling with similar traits is "the same person." Lawyers understand this as *identity of the party* vs. *similarity of the profile*; doctors understand it as *the specific organism* vs. *a specimen of the same type*.
      *   **The Move:** Ask: "If we created a perfect biological replica of you right now, would it be *you*?" (Target answer: No, it's a duplicate.) This clears the ground for claiming that *origin* determines numerical identity, not just properties.

  2.  **State the Thesis (Minutes 15–20)**
      *   **Formulation:** "For any person $P$, $P$ could not have come into existence from a different zygote (different sperm/egg pairing) than the one $P$ actually originated from."

  3.  **The Defensive Step: The "No Switching" Argument (Minutes 20–30)**
      *   **The Defense:** Immediately anticipate the objection: "That's just a definition of 'you'."
      *   **The Counter:** Argue that origin is not merely a label but a *constitutive constraint*. Use the analogy of a material object (e.g., a specific statue cannot be made from a *different* lump of clay and remain *this* statue). The defense is that the specific material cause is part of the identity conditions, not just the history.

  #### II. Carrying Example Selection
  **Select: Siblings conceived naturally from the same parents but different gametes.**

  **Reject:** The embryo split/IVF scenario.
  *   **Reason:** The IVF scenario introduces *temporal gaps* ("years later") and *environmental variance* ("different country"). For doctors, this triggers epigenetics and developmental plasticity debates. For lawyers, it triggers jurisdiction and custody analogies. It tests *environmental* essentialism, not *origin* essentialism. Furthermore, identical twins share the *same* zygotic origin, which complicates the "one origin, one person" intuition without testing the "could *this* person have had a *different* origin" claim.

  **Specification of the Sibling Example:**
  *   **Features it MUST have:**
      *   **Same Parents:** To isolate the gametes as the variable. If parents change, participants will argue about "parental essentialism" instead of gametic essentialism.
      *   **Same Timeframe:** Conceived close enough together that the "historical era" is constant.
      *   **Distinct Gametes:** Explicitly state these are *different* sperm and *different* eggs (e.g., you vs. your brother).
  *   **Features it MUST lack:**
      *   **Genetic Cloning:** Do not allow talk of identical DNA.
      *   **Adoption/Surrogacy:** Removes the biological link, confusing legal parentage with metaphysical origin.
      *   **Tech Specifics:** Keep it "natural conception" to avoid debates about laboratory causation.

  #### III. The Niche Distinction (Gametes vs. Causal Pathway)
  **Placement:** Minutes 60–75 (During the "Objections and Refinements" phase).

  **Strategy:**
  Do not introduce this at the start. It is a destabilizing distinction. If you ask early on, "Do we mean the specific cells or the fertilization event?", lawyers will argue about evidence (can we prove *which* sperm?) and doctors about biology (do the cells persist?).
  *   **Introduce it only after** the group accepts the core intuition that "origin matters."
  *   **The Pivot:** "Now that we agree the origin matters, *what exactly* is the origin? Is it the biological matter (the specific sperm/egg tokens) or the causal process (the specific fertilization event)?"
  *   **Purpose:** This illuminates the boundary of the theory. If the sperm is destroyed and replaced by molecule-for-molecule identical matter before fertilization, is it the same origin? This keeps the advanced thinkers engaged without confusing the novices during the foundational phase.

  #### IV. Misconception Mapping & Interventions

  | Misconception | Point of Surface | Minimal Intervention |
  | :--- | :--- | :--- |
  | **Genetic Determinism**<br>("If the DNA is the same, I am the same.") | **During Thesis Statement (Min 15).** Participants will assume the claim rests on genetic uniqueness. | **Intervention:** Explicitly stipulate a hypothetical where a *different* sperm/egg pairing produces the *exact same genome*. Ask: "Even if the genetics were identical, is it *you*?" Force the separation of *matter* from *code*. |
  | **Psychological Continuity**<br>("I am my memories/consciousness.") | **During Numerical/Qualitative Distinction (Min 10).** | **Intervention:** Remind them we are discussing *coming into existence*, not *persisting through time*. Say: "We are not asking what makes you the same person at 50 as you were at 5. We are asking what makes you *this* person rather than *that* person at the moment of conception." |
  | **Parental Essentialism**<br>("I must have *these* parents.") | **During Sibling Example (Min 35).** Participants will argue you couldn't have been born to *different* parents. | **Intervention:** Concede that parental essentialism might be true, but bracket it. Say: "Let's grant you must have *these* parents. The question is: given *these* parents, could you have come from a *different* egg?" Isolate the gamete from the parent. |

  #### V. The Check Question
  **Do not ask:** "What is origin essentialism?" (Tests memory).
  **Do not ask:** "Do you agree with this?" (Tests opinion).

  **Ask this instead:**
  > "Imagine a future technology allows your parents to create a zygote using *different* biological material (different sperm/egg tokens) than they actually used, but engineered to have your *exact* DNA sequence. If that zygote developed into an adult, would that adult be *you* or your *twin*?"

  *   **Correct Grasp:** "It would be my twin (a qualitative duplicate), not me (numerically distinct)."
  *   **Incorrect Grasp:** "It would be me, because the DNA is the same." (This reveals they are holding a genetic view, not a modal/origin view).

  #### VI. Omissions
  **Explicitly state the following omissions at the start (Minute 5):**
  1.  **Formal Modal Logic:** "We will not be using possible world semantics or S5 logic. We are talking about intuitive possibility."
  2.  **Artifact Essentialism:** "We are not discussing whether a table must be made from the same wood. Human biology has specific constraints we will respect."
  3.  **Biological Kind Essentialism:** "We are not debating whether humans are essentially mammals. We are debating individual identity."

  **Confirmation:** Yes, state this omission openly. Lawyers and doctors respect scope limitations. It prevents them from trying to apply legal standards of evidence or biological taxonomy to a metaphysical identity question. Tell them: *"We are bracketing the mechanics of proof and biology to focus strictly on the conditions of identity."*
