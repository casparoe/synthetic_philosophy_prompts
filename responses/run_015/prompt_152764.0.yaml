      *   *Parental Essentialism:* "I must have *these* parents." *Correction:* It's about the *gametes*, not the social/biological parents (though they usually correlate). Intervention: During the Sibling example.

  6.  **Deconstruct Requirement 5: Check Question:**
      *   Needs to test modal grasp, not memory.
      *   *Idea:* A counterfactual scenario where the genome is identical but the gametes are different.
      *   *Draft:* "If science could create a zygote with your exact DNA using different biological material from your parents, would it be *you*?"

  7.  **Deconstruct Requirement 6: Omissions:**
      *   *Leave out:* S5 Modal Logic, Transworld Identity mechanics, Artifact Essentialism (tables/ships), Biological Kind Essentialism (tigers/oak trees).
      *   *Confirm:* Yes, state this openly to manage expectations.

