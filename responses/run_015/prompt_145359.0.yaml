prompt: |-
  I'm putting together the final exam for our philosophy of mind and medicine seminar—upper-level undergrads, about 45 minutes, closed-book. I need a question on pain asymbolia and teh badness of pain, but I don't want students just parroting the classic clinical descriptions of lesions and missing affect. Instead, build in this twist: ask them to compare real asymbolia—where people report pain sensations but lack suffering or avoidance—with a hypothetical inverse case where a patient has intense suffering and strong avoidance behavior but zero sensory representation of tissue damage whatsoever. The core task should be arguing, using both cases together, whether pain's badness is essentially representational (it tracks bodily harm) or essentially affective/motivational. Please draft the exam question itself, then give me a model answer and a marking sheme: five must-hit points worth 20 marks total, with a one-line note on how candidates typically mess up each point. Don't ask for bibliographies or citations—this has to work without web access. Keep it in the weeds but don't hinge it on obscure papers they wouldn't have seen.
