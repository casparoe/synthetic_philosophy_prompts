answer: |-
  **Pre-Draft Reasoning & Sketch of Competing Considerations**

  *   **The Vendor's Claim:** They argue the Frame Problem (what stays the same when things change) applies only to symbolic systems that need explicit rules to say "the wall color didn't change." They claim an LLM conditions on the whole chart, so it "sees" everything.
      *   *Where it bites:* They are technically correct about architecture but wrong about risk. An LLM doesn't "see"; it predicts tokens based on statistical weight. If "procedure cancelled" is a rare token sequence compared to "procedure completed," the model's statistical inertia will carry forward the "procedure completed" plan (NPO, med hold). This is the Frame Problem re-emergent as a probabilistic bias. It is not a null-pointer bug; it is a structural feature of predictive text.
  *   **The Intensivist's Worry:** Silent failure. If the AI changes a dose, it's visible. If it *doesn't* change a dose when it should, it looks like a deliberate decision to maintain status quo. We can't audit inaction.
      *   *Where it bites:* This is the strongest safety argument. Automation bias means clinicians trust the "unchanged" plan more than they should.
  *   **The CMIO's Worry:** The "Human Standard." Humans also carry forward orders without re-verifying every dependency every shift. We rely on intuition. Holding AI to a standard of "explicit justification for inaction" is a standard humans fail.
      *   *Where it bites:* This is the strongest adoption argument. If we demand perfect explicability, we ban all tools.
      *   *Counter:* Human error is localized and accountable. AI error is systemic and unaccountable. If one nurse misses a dose, it's training. If the AI misses it for every Parkinson's patient during cancelled OR days, it's a product defect. We can tolerate human heuristic failure; we cannot tolerate scaled systemic bias without monitoring.
  *   **The Proposed Condition:** "Relevance Receipts" + Perturbed Testing.
      *   *Verdict:* This is the right lever. We cannot open the black box, but we can stress-test the edges. Requiring a log of what was *considered* for update forces the vendor to expose the carry-forward logic. The perturbed test set (cancellations, retractions) validates that context changes actually trigger plan changes. It moves validation from "accuracy" to "robustness."
  *   **Recommendation:** Renew 6 months, conditional, no expansion. Termination loses the benefit (fewer dropped follow-ups). Expansion scales the risk before mitigation. Conditions must address the silent failure mode.

  ***

  **MEMORANDUM**

  **TO:** Clinical AI Review Committee
  **FROM:** Clinical Ethics
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Clementine Pilot Status

  **Recommendation**
  I recommend we renew the Clementine pilot for six months with specific safety conditions and no expansion to additional units. Termination discards demonstrated benefits regarding care continuity; expansion scales unresolved systemic risks. We must treat the recent near-miss not as a software bug, but as a structural limitation of the technology that requires ongoing validation rather than a one-time fix.

  **The Vendor's Defense and the Frame Problem**
  The vendor argues that because Clementine uses a Large Language Model (LLM) rather than symbolic logic, it does not suffer from the "frame problem"—the difficulty of knowing what remains unchanged when a situation changes. They claim their system conditions on the whole chart, so nothing needs to be explicitly updated.

  This is misleading. While the architecture differs from 1970s planners, the functional risk is identical. An LLM predicts text based on statistical patterns in training data. In most training data, a scheduled procedure leads to completion. When a procedure is cancelled, that is a statistical outlier. The model's "inertia" favors the common pattern (procedure happened) over the rare one (procedure cancelled), causing it to carry forward orders dependent on an event that never occurred. This is not a null-pointer bug fixable with a patch; it is a characteristic failure mode of probabilistic systems. They have not solved the frame problem; they have hidden it inside a statistical black box.

  **The Intensivist's Concern: Silent Failure**
  The intensivist's objection is the most critical safety constraint. When Clementine makes an error of commission (adding a wrong drug), it is visible. When it makes an error of omission (failing to restart medication because it assumed a procedure happened), it presents as a deliberate decision to maintain the status quo. Because the system does not flag what it *did not* reconsider, these errors are invisible to the care team until harm occurs. We cannot audit inaction. If we cannot distinguish between "verified as still appropriate" and "ignored because it wasn't top-of-mind," we are relying on luck rather than safety engineering.

  **The CMIO's Concern: The Human Standard**
  The CMIO argues that human clinicians also coast on unarticulated relevance. Nurses do not log why they didn't change a vitals order every shift. Holding the AI to a standard of explicit justification for every unchanged item is a standard humans fail, and enforcing it may block useful tools that alleviate burnout.

  This is a compelling argument for pragmatism, but it misses the difference in scale and accountability. When a human nurse misses a dependency, it is an individual error contained to one patient, and the nurse is morally accountable. When Clementine misses a dependency, it is a systemic error affecting every patient matching that profile simultaneously, and the software is not accountable. We tolerate human heuristic failure because humans possess embodied context and liability. We cannot tolerate scaled algorithmic bias without external monitoring. We are not holding the machine to a higher standard of perfection; we are holding it to a higher standard of visibility because its failures are multiplied.

  **Proposed Conditions for Renewal**
  To bridge these concerns, I propose two conditions for the six-month renewal. These are not requests for perfection, but for visibility and robustness.

  1.  **Change Logging (The "Relevance Receipt"):** The vendor must provide a structured log with each generated plan indicating which items were carried forward unchanged versus which were actively re-evaluated. We do not need a philosophical justification for every line, but we need to know what the system treated as static. This allows spot-audits of the "silent" decisions.
  2.  **Adversarial Test Set:** The vendor must run a monthly test suite of perturbed scenarios against their model. This includes cancelled procedures, retracted lab results, and room transfers. They must report the pass rate: did the system correctly identify downstream dependencies when the upstream context was revoked? This shifts our validation from "accuracy" (does the plan look good?) to "robustness" (does the plan change when the world changes?).

  **Evaluation of Conditions**
  Some may argue this merely relocates the problem: can we trust the log? Is the test set comprehensive? These are valid concerns. However, requiring the log forces the vendor to expose their carry-forward logic, making it auditable. requiring the test set forces them to prove sensitivity to context changes rather than just statistical averages. It does not solve the frame problem, but it manages the risk by treating the system as a learner that needs continuous evaluation rather than a tool that is "fixed" once.

  **Conclusion**
  Clementine provides value, but its characteristic failure mode is silent and systemic. We cannot expand its use until we have a mechanism to detect when it fails to update. A six-month conditional renewal allows us to verify if these monitoring conditions provide sufficient safety visibility. If the vendor cannot provide the change logs or fails the adversarial testing, we must terminate. We are not buying a calculator; we are buying a partner in care. Partners must be able to explain why they didn't act.

  **Signed,**
  **Clinical Ethicist**
