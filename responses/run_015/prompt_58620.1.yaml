prompt: |-
  ok so me and my best friend just burned a whole evening on this stupid arguement and we need someone else to weigh in. he says religion makes people better, like truely kinder and more honest, because you have God watching plus a community that notices if you screw up. I said come on, look at super secular places that are really high trust, people return wallets and pay taxes and stuff without being religious at all.

  we kept going in circles because we never nailed down what better even means. so here is what I want: write an essay that sorts this out and actually picks a side at the end with reasons, not just both sides have a point.

  to make it interesting can you break better into at least three different things, like being nice day to day vs actually sacrificing for strangers vs keeping shared norms and institutions working, and say if religion helps with some but not others. and then deal with his big comeback, which is that secular high trust societies are just coasting on leftover religious habits and will run out of trust in a generation or two unless they find a replacement. is that true or can secular groups sustain trust on their own.

  to test it, imagine two brand new towns built tomorrow from scratch with the same kind of people: one gets churches and prayer groups on every block but almost no other clubs, the other gets zero religious stuff but tons of sports leagues and parent groups and neighborhood projects and like an atheist sunday get-together that copies church without God. which town is still high trust after 50 years and why, and what does that tell us about what does the work in religion, the belief part or the meeting-every-week part.

  also tell me how confident you are in your overall take and point to the one bit you are least sure about and why.
reasoning: |-
