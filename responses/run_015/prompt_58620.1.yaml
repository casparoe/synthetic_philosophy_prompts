          *   Must define "better" by breaking it into at least three categories (e.g., day-to-day niceness, sacrifice for strangers, maintaining norms/institutions).
          *   Must address the friend's specific counter-argument: "Secular high-trust societies are coasting on religious leftovers and will crash."
          *   Must include a thought experiment: Two new towns (Religious vs. Secular-Community) built from scratch. Which lasts 50 years? What does this say about belief vs. gathering?
          *   Must state confidence level and identify the area of least certainty.
      *   **Tone:** Analytical, persuasive, nuanced but decisive.

  2.  **Deconstruct "Better" (The Three Categories):**
      *   *Category 1: In-Group Prosociality (Day-to-day niceness within the community).* Religion is historically very strong here. The "God is watching" + "community scrutiny" effect works well for people *inside* the fold.
      *   *Category 2: Universal Altruism (Sacrificing for strangers/out-groups).* This is trickier. Secular humanism often excels here because it's based on shared humanity rather than shared dogma. Religion can sometimes limit this to "believers only."
      *   *Category 3: Institutional Trust/Norm Maintenance (Paying taxes, following rules).* High-trust secular societies (Scandinavia) show this is possible without religion. It relies on rule of law and social safety nets.

  3.  **Address the "Religious Leftovers" Argument:**
      *   The friend argues secular trust is parasitic on past religious capital.
      *   *Counter:* While historically true (Enlightenment values grew from religious soil), institutions can become self-reinforcing. Trust breeds trust. If the system works (low corruption, high welfare), people have a rational incentive to maintain it, regardless of metaphysics.

  4.  **The Thought Experiment (Two Towns):**
      *   *Town A (Religious):* Churches on every block, prayer groups, no other clubs.
      *   *Town B (Secular-Community):* No religion, but sports, parent groups, neighborhood projects, "Atheist Sunday."
      *   *Analysis:* Sociology suggests *social capital* (the meeting-every-week part) is the active ingredient, not the *theology* (the belief part). Putnam's "Bowling Alone" and "American Grace" support this.
      *   *Prediction:* Town B likely sustains trust better long-term because it's more inclusive and adaptable. Town A risks fragmentation if theological disputes arise or if demographics shift. However, Town A might have higher initial intensity.
      *   *Verdict:* Town B wins on sustainability. The mechanism is *regular face-to-face cooperation*, not the object of worship.

  5.  **Formulate the Conclusion (Picking a Side):**
      *   The prompt asks to pick a side.
      *   *Option 1:* Religion makes people better. (Hard to defend given secular high-trust nations).
      *   *Option 2:* Secularism makes people better. (Also hard, as secularism can lead to isolation).
      *   *Option 3 (Nuanced but decisive):* **Community structures make people better, and secular frameworks are more sustainable for modern pluralistic societies.**
      *   *Refined Position:* Religion *can* make people better *if* it functions as a community hub, but it is not *necessary* for morality, and secular community structures are more robust for long-term, large-scale trust. Therefore, the friend is wrong that religion is uniquely required, but right that *community* is required. I will side with the user (Secular/Structural view) but validate the friend's insight about community.
      *   *Wait, I need to pick a side on the original bet:* "Does religion make people better?" vs "Secular places work fine."
      *   *Decision:* I will argue that **Secular frameworks are sufficient and potentially more stable for defining "better" in a diverse world.** Religion is a *tool* for goodness, not the *source*.

  6.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the stalemate. Define the problem (definition of "better").
      *   **Defining Better:**
          1.  *Micro-Morality (In-Group):* Religion wins here (surveillance/shame).
          2.  *Macro-Altruism (Out-Group):* Secularism competes well (universal rights).
          3.  *Systemic Trust (Institutions):* Secularism wins here (rule of law > divine fear).
      *   **The "Leftover Capital" Argument:** Address the friend's point. Acknowledge historical debt, but argue institutions can self-repair. Trust is a habit, not just a theological hangover.
      *   **The Two Towns Experiment:**
          *   Town A (God): High cohesion, high exclusion risk.
          *   Town B (Community): High cohesion, high inclusion.
          *   Winner: Town B. Why? Because the *mechanism* is the gathering, not the god.
      *   **Conclusion:** Pick the side. The user is more right. Religion isn't the engine; community is. Secularism can build that engine.
      *   **Confidence & Uncertainty:** Rate confidence. Identify the hardest variable (e.g., long-term existential meaning without religion).

  7.  **Refining the Argument (Self-Correction during drafting):**
