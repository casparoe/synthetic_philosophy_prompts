      *Refining Normative Probability:* Is it permissible in *any* context? Maybe in high-level macroeconomics or political science forecasting where individuals aren't targeted. Yes, that seems plausible. So 0.60 is defensible.

      *Refining Coherence:* Within-nation variance is huge. But the claim only requires "at least some... generalizations." Trust levels (e.g., World Values Survey) do cluster. So 0.75 is defensible.

