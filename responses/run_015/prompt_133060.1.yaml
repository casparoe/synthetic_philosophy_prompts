answer: |-
  # Specification for a Coherent Liberal Social Choice Theory

  This document outlines the conceptual requirements (desiderata) for any theory attempting to resolve Sen's Liberal Paradox while retaining both a Pareto condition and a substantive notion of individual rights. It evaluates the proposed "No-Peeping" condition against these requirements and identifies the structural tensions inherent in the problem.

  ## I. Core Desiderata (The Requirements)

  An adequate theory must satisfy the following conditions to be considered a solution rather than an evasion.

  | # | Desideratum | Motivating Case & Rationale |
  | :--- | :--- | :--- |
  | **1** | **Acyclicity** | **Case:** Standard Lewd/Prude.<br>**Requirement:** The social preference ordering must be transitive (or at least acyclic). A theory that permits a cycle ($A > B > C > A$) fails to yield a decision. This is the baseline mathematical constraint Sen proved is incompatible with U, P, and L. |
  | **2** | **Rights Efficacy** | **Case:** Standard Lewd/Prude.<br>**Requirement:** Assigning a right to an individual must be capable of altering the social outcome against a conflicting unanimous preference. If the right never changes the outcome relative to a Pareto-optimal baseline, it is symbolic, not decisive. |
  | **3** | **Pareto Sensitivity** | **Case:** Reverse Nosiness (Lewd hates Prude reading; Prude hates reading; both prefer *Nobody* > *Prude* > *Lewd*).<br>**Requirement:** If all individuals strictly prefer $X$ to $Y$, the society should rank $X$ above $Y$, *unless* a right explicitly blocks $Y$. A theory that ignores unanimous agreement to satisfy a right where no right is at stake fails efficiency. |
  | **4** | **Sphere Non-Circularity** | **Case:** Defining what Lewd controls.<br>**Requirement:** The definition of the "private sphere" (over which one has rights) cannot depend on the specific preferences at hand. You cannot define the sphere as "whatever preferences we want to protect." It must be defined prior to the aggregation (e.g., "bodily integrity," "personal consumption"). |
  | **5** | **Symmetry & Scalability** | **Case:** $N > 2$ (A community of 100 Prudes and 1 Lewd).<br>**Requirement:** The logic must hold if the number of agents increases. If a right protects Lewd against one Prude, it should not vanish because 100 Prudes dislike Lewd's choice, unless the theory explicitly aggregates harm thresholds. |
  | **6** | **Externality Discrimination** | **Case:** Racist Pamphlet vs. Lady Chatterley.<br>**Requirement:** The theory must distinguish between "meddlesome preferences" (Prude dislikes Lewd's private pleasure) and "legitimate externalities" (Neighbor dislikes racist pamphlet because it incites violence against them). A theory that bans all other-regarding preferences kills political liberty; one that allows all kills privacy. |
  | **7** | **Positive/Negative Distinction** | **Case:** Lewd's desire for Prude to read.<br>**Requirement:** The theory must distinguish between a right *to do* (Lewd reading) and a right *to compel* (Lewd forcing Prude). Minimal Liberalism usually grants the former. A solution cannot grant Lewd a right over Prude's action without collapsing into authoritarianism. |

  ## II. Conceptual Distinctions (What Cannot Be Collapsed)

  To avoid trivial solutions, the theory must maintain the following separations:

  1.  **Decisiveness vs. Moral Right:**
      *   *Distinction:* Being "decisive" in social choice means your preference dictates the social ranking for that pair. A "moral right" is a normative claim.
      *   *Risk:* A theory might grant decisiveness only when it aligns with the moral right, effectively defining rights as "whatever the social choice function allows."
      *   *Requirement:* The scope of the right must be identifiable independently of the aggregation rule's output.

  2.  **Pareto as Unanimity vs. Pareto as Efficiency:**
      *   *Distinction:* **Unanimity** is procedural (everyone says $X > Y$). **Efficiency** is outcome-based (no waste, maximal utility).
      *   *Risk:* In the Lewd/Prude case, *Nobody Reads* is Pareto-efficient (unanimously preferred to *Prude Reads*). However, if Lewd has a right to read, *Lewd Reads* might be the liberal outcome, which is Pareto-inefficient relative to *Nobody Reads* (since both prefer *Nobody*).
      *   *Requirement:* The theory must state whether it protects the *process* of unanimous agreement or the *state* of efficiency. Sen's paradox uses Unanimity. A solution that switches to Efficiency must explain why unanimous preference is overridden.

  3.  **Excluding Meddlesome Preferences vs. Stipulating the Conclusion:**
      *   *Distinction:* **Exclusion** says "We don't count preferences about others' private acts." **Stipulation** says "We don't count preferences that cause a paradox."
      *   *Risk:* If you exclude preferences only when they create a cycle, the rule is ad hoc.
      *   *Requirement:* The rule for excluding preferences (like No-Peeping) must apply even when no paradox exists.

  4.  **Absolute Trump vs. Weighted Claim:**
      *   *Distinction:* Is a right a veto (deontological) or a heavy weight in a calculus (consequentialist)?
      *   *Requirement:* This is not a universal desideratum but a **camp preference**. A liberal libertarian theory *requires* Absolute Trumps. A welfarist liberal theory *requires* Weighted Claims. An adequate theory must declare which it is. Treating "Absolute Trump" as a universal requirement is a prejudice against consequentialism.

  ## III. Stress Test: The "No-Peeping" Condition

  **Proposal:** Preferences must depend only on own private consumption and own rights violations.
  **Effect:** Lewd cannot prefer *Prude Reads* > *Lewd Reads* based on Prude's suffering. Lewd ranks *Lewd Reads* > (*Prude Reads* $\sim$ *Nobody*). Prude ranks (*Lewd Reads* $\sim$ *Nobody*) > *Prude Reads*.
  **Result:** No cycle. *Lewd Reads* wins (Lewd is decisive on his reading; Prude is indifferent between Lewd/Nobody).

  **Desiderata Compliance Check:**

  | Criterion | Pass/Fail | Analysis |
  | :--- | :--- | :--- |
  | **Acyclicity** | **Pass** | Eliminates the preference profile that generates the cycle. |
  | **Sphere Non-Circularity** | **Fail (Risk)** | Defining "private consumption" is the hard part. Is reading a book private? Is burning it in the yard private? If "private" is defined normatively to solve the paradox, it violates **Sphere Non-Circularity**. |
  | **Externality Discrimination** | **Fail** | This is the critical failure point. If Lewd is a Neo-Nazi and the book is *Mein Kampf*, the neighbor's dislike is "meddlesome" under No-Peeping. The condition kills legitimate claims against harmful externalities (noise, pollution, incitement). |
  | **Symmetry & Scalability** | **Pass** | Applies uniformly to all agents. |
  | **Preference Sanitization** | **Mixed** | It successfully sanitizes the Lewd/Prude case, but it does so by **weakening Unrestricted Domain**. It asserts that "meddlesome preferences" are irrational or inadmissible. |

  **Verdict on No-Peeping:**
  To be more than ad hoc, No-Peeping requires a **Theory of the Private Sphere**. It cannot simply state "preferences about others don't count." It must provide a criterion for *which* other-regarding preferences count (e.g., "harm principle" vs. "mere dislike"). Without this, it smuggles in the trade-off it claims to resolve by defining the domain to match the desired liberal outcome.

  ## IV. Incompatibilities & The "Killer" Constraint

  **Suspected Incompatible Pair:**
  **Unrestricted Domain (U)** AND **Rights as Absolute Trumps.**
  You cannot have a rule that accepts *any* preference profile (including meddlesome ones) and *always* lets rights override unanimous welfare judgments. Sen proved this. One must yield.

  **The "Killer" Requirement:**
  The single requirement that knocks out the most popular escapes is **Sphere Non-Circularity (Desideratum 4)**.

  *   **Why it kills "Game Form" escapes:** Some argue rights are about *options* available, not *outcomes* achieved. This fails if the available options are shaped by the very preferences the theory tries to ignore.
  *   **Why it kills "Domain Restriction" escapes (like No-Peeping):** It forces the theorist to define "private" without looking at the utility functions. If you define "private" as "whatever Lewd wants to do," you are circular. If you define it as "physical bodily integrity," you might solve Lewd/Prude but fail on the Racist Pamphlet case (where the harm is social, not bodily).
  *   **Why it kills "Waiver" escapes:** Some suggest Lewd can waive his right to achieve the Pareto optimum (*Nobody Reads*). This fails if the right is a duty (Prude has a right *not* to be forced) or if waiver requires a meta-preference that creates a new cycle.

  **Non-Negotiable vs. Camp Preference:**
  *   **Non-Negotiable:** **Acyclicity.** (A decision must be reachable).
  *   **Non-Negotiable:** **Sphere Non-Circularity.** (Definitions cannot be outcome-dependent).
  *   **Camp Preference:** **Absolute Trump.** (Libertarians demand this; Utilitarians reject it).
  *   **Camp Preference:** **Unrestricted Domain.** (Welfarists demand this; Liberals often reject it).

  ## V. Scorecard of Popular Escapes

  | Escape Strategy | Mechanism | Fails Which Desideratum? | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Waiver of Rights** | Lewd waives right to read to allow *Nobody Reads*. | **Rights Efficacy.** If rights are waived whenever they conflict with Pareto, they are not rights, they are suggestions. | **Weak** |
  | **Game Form Liberty** | Rights guarantee *opportunity* to read, not the *outcome* that one reads. | **Rights Efficacy.** If the opportunity exists but social choice always selects the outcome where you don't use it, the liberty is hollow. | **Weak** |
  | **Domain Restriction (No-Peeping)** | Disallow preferences over others' private acts. | **Externality Discrimination.** Cannot distinguish between prurient interest and legitimate harm (e.g., pollution, hate speech). | **Moderate** (Needs a Harm Principle supplement) |
  | **Conditional Pareto** | Pareto applies only if no rights are violated. | **Sphere Non-Circularity.** Requires knowing if a right is violated *before* aggregating, but violation often depends on the aggregation. | **Moderate** |
  | **Utility Measurement** | Measure intensity; Prude's disgust outweighs Lewd's glee. | **Unrestricted Domain.** Requires interpersonal utility comparison, which standard SC theory forbids. | **Strong** (but changes the framework entirely) |

  ### Summary Recommendation
  To satisfy your spec, a theory must adopt a **Domain Restriction** (like No-Peeping) but ground it in a **Harm Principle** rather than a privacy principle.
  1.  **Allow** other-regarding preferences *only* if the agent can demonstrate a direct, non-preference-based harm (e.g., physical, economic, or rights-violating).
  2.  **Disallow** other-regarding preferences based solely on moral disgust or vicarious utility.
  3.  **Treat Rights** as constraints on the *feasible set* prior to aggregation, not as weights within the aggregation.

  This satisfies **Acyclicity** and **Rights Efficacy**, but it explicitly sacrifices **Unrestricted Domain**, acknowledging that a liberal society cannot aggregate illiberal preferences (meddlesomeness) without contradiction.
