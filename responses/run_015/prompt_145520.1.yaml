          4.  *Synthesis:* Everyone must devote all disposable resources to preventing distant future catastrophe.
          5.  *Non-Distributive Prevention:* "Preventing" a collective harm isn't distributive. If I fail, others might succeed. If I succeed alone, the harm might still happen. Therefore, I must *ensure* the outcome, not just contribute.
          6.  *Extreme Demand:* Work continuously to marginal utility (and beyond) because partial contribution doesn't satisfy the obligation to *ensure*.
          7.  *Absurdity:* This is too demanding ("ought implies can" violation or simply counter-intuitive).
          8.  *Conclusion:* One of (1)-(5) must be rejected.
