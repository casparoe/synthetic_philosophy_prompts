  7.  **Self-Correction/Nuance Check:**
      *   *Wait, does Singer actually say others don't reduce obligation?* In *Famine, Affluence, and Morality*, Singer argues that if others don't give, you must give more up to the point of marginal utility. So Premise (3) is actually *Singerian*.
      *   *However*, Premise (5) adds a twist: "each agent is required... to ensure the outcome." Singer argues you are required to *prevent the bad thing*, but if the bad thing is collective, your individual causal power is limited.
      *   *Correction:* The error is applying the *Pond* logic (individual causal sufficiency) to a *Collective* problem (individual causal insufficiency). In the Pond, I *can* save the child. In the Future Catastrophe, I *cannot* prevent it alone. Therefore, the obligation shifts from "prevent" to "contribute to preventing."
