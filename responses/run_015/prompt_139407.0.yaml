answer: |-
  This is a tight, high-wire act for 90 minutes. The risk is that the activity eats the debrief. The payoff is that students will have *experienced* the indeterminacy before they hear the theory.

  Below is the complete kit.

  ### Part 1: The Materials (Print these)

  **1. The Ordinance (Handout 1 – Everyone)**
  > **STATION AEGIS: BIO-VAULT CONSERVATION PROTOCOL (REV. 4)**
  >
  > **Rule 1 (Category):** No organic matter shall be removed from the Bio-Vault without Authorization.
  > **Rule 2 (Time):** The Bio-Vault is locked and inaccessible to personnel between the hours of 22:00 and 06:00.
  > **Rule 3 (Procedure):** All removals must be entered into the Digital Log and countersigned by the Shift Lead prior to removal.
  >
  > *Violation of any rule results in immediate revocation of Vault privileges.*

  **2. The Case List (Handout 2 – Everyone)**
  > **INCIDENT REPORTS**
  >
  > **Case A (The Compost):** A researcher removes a tray of dead, diseased wheat stalks from the Vault at 14:00 to be incinerated outside. The wheat is organic matter. It is logged and countersigned.
  >
  > **Case B (The Freeze):** At 23:30, the Vault heating unit fails. A technician enters the Vault to repair it, preventing the seeds from freezing. Access is prohibited between 22:00 and 06:00.
  >
  > **Case C (The Emergency):** A researcher needs a specific bacterial culture to treat a contaminated water filter at 14:00. They log the removal. The Shift Lead is unconscious in the med-bay. The researcher removes the culture without the countersignature.

  **3. The Purpose Statements (Handout 3 – SPLIT THE ROOM)**
  > *Print two versions. Label them "Group A" and "Group B." Do not let students swap.*
  >
  > **VERSION A (Security Focus)**
  > **PREAMBLE: PURPOSE OF PROTOCOL**
  > These rules are established to maintain strict inventory control and prevent the loss or theft of Station property. The Bio-Vault contains high-value genetic assets belonging to the Station Authority. The primary goal is to ensure that every item is accounted for and that unauthorized removal is impossible.
  >
  > **VERSION B (Survival Focus)**
  > **PREAMBLE: PURPOSE OF PROTOCOL**
  > These rules are established to safeguard the biological viability necessary for Station survival. The Bio-Vault contains the life-support resources required for the crew's continued existence. The primary goal is to ensure the long-term utility and preservation of biological resources for the mission.

  **4. The Drafter's Note (Handout 4 – Round 3 Only)**
  > **MEMORANDUM FROM CHIEF ARCHITECT (DECLASSIFIED)**
  > "Regarding Rule 3: The countersignature requirement was intended to prevent unrecorded theft, not to block life-support interventions when the Lead is incapacitated.
  > Regarding Rule 1: The ban on organic removal was designed to prevent bio-contamination of the outside environment, not to prevent the disposal of waste."

  ---

  ### Part 2: The Timeline (90 Minutes)

  **0:00 – 0:05 | Setup &分组 (Grouping)**
  *   **Action:** Hand out **Ordinance** and **Case List** to everyone.
  *   **Split:** Divide the room into two halves (7 vs 7). Hand out **Purpose Version A** to the left, **Version B** to the right.
  *   **Instruction:** "You are the Station Tribunal. Your job is not to decide what is *moral* or *smart*, but whether the conduct violates the Protocol. Mark each case: **VIOLATION**, **NO VIOLATION**, or **UNDETERMINED**. Do not talk to the other group. Do not Google. You have 10 minutes."
  *   **Board:** Draw a 3x3 grid (Cases A, B, C vs. Violation/No/Undetermined). Leave space for Group A and Group B tallies.

  **0:05 – 0:15 | Round 1 (Text Only)**
  *   **Task:** Students apply the text only.
  *   **TA Role:** Circulate. If they ask "But isn't this stupid?", say: "Apply the rule as written."
  *   **Tally:** At 0:15, stop them. Ask for a show of hands for each case. Fill the Board.
  *   *Expected Outcome:* Case A (Violation - it's organic), Case B (Violation - it's 23:30), Case C (Violation - no signature). It should feel rigid.

  **0:15 – 0:30 | Round 2 (The Purpose Reveal)**
  *   **Action:** Tell them to read their **Purpose Statement**. "Re-evaluate your verdicts in light of this purpose. Discuss within your group."
  *   **Crucial:** Remind them *not* to read their purpose statement out loud to the other group yet.
  *   **Task:** New tally.
  *   **Tally:** At 0:30, fill the Board.
  *   *Expected Outcome:* Group A (Security) will likely stay strict on Case A & C. Group B (Survival) will likely flip Case B (Freeze) and Case C (Emergency) to No Violation.
  *   **The Reveal:** Ask Group A to read their Purpose. Ask Group B to read theirs. The room should realize they were playing different games.

  **0:30 – 0:40 | Round 3 (The Drafter's Note)**
  *   **Action:** Hand out **Drafter's Note**.
  *   **Task:** "Final verdict. Does this note change the application?"
  *   **Tally:** Final column on the Board.
  *   *Expected Outcome:* Case C flips to No Violation (Note explicitly covers it). Case A is now ambiguous (Note says "waste disposal," Rule says "organic matter"). Case B remains tense (Note doesn't mention time rules).

  **0:40 – 1:30 | Debrief & Theory Mapping**
  *   See Part 4 below.

  ---

  ### Part 3: Board Plan & Tallying

  Draw this early. It keeps the "score" visible.

  | CASE | ROUND 1 (Text) | ROUND 2 (Purpose A) | ROUND 2 (Purpose B) | ROUND 3 (Note) |
  | :--- | :---: | :---: | :---: | :---: |
  | **A (Compost)** | Violation | Violation | No Viol. | ? |
  | **B (Freeze)** | Violation | Violation | No Viol. | Violation |
  | **C (Emergency)** | Violation | Violation | No Viol. | No Viol. |

  *Use different colored markers for Round 1, 2, and 3 to show the drift.*

  ---

  ### Part 4: The Debrief (Mapping to Theory)

  Do not mention Hart or Fuller until minute 50.

  **1. Open Texture & The Penumbra (Hart)**
  *   **Point to:** Round 1, Case A.
  *   **Ask:** "Why did everyone say 'Violation' in Round 1 even though incinerating dead wheat is sensible?"
  *   **Theory:** Hart's **Core vs. Penumbra**. The word "organic matter" has a core meaning (plants, bacteria). The rule settles the matter in advance.
  *   **The Squeeze:** The rule gives certainty (we know what to do), but it produces absurdity (we can't throw out trash).
  *   **Key Question:** "Is it better to have a rule that is clear but occasionally stupid, or a standard that is smart but requires a judge to decide every time?"

  **2. Purposive Interpretation (Fuller)**
  *   **Point to:** Round 2 Divergence.
  *   **Ask:** "Group B, you flipped Case B (The Freeze). Why?"
  *   **Theory:** Fuller's claim that law is not just words but **purposeful activity**. You cannot apply a rule without understanding what it is *for*.
  *   **The Squeeze:** Once you admit purpose, Group A and Group B had *different* purposes.
  *   **Key Question:** "If the law depends on purpose, whose purpose counts? The Security Chief's? The Survival Officer's? Yours?"

  **3. Indeterminacy of Purpose (The Generality Objection)**
  *   **Point to:** The Difference between Version A and Version B.
  *   **Ask:** "Both Purpose Statements were plausible. Neither was in the text. How did we choose?"
  *   **Theory:** This is the Hartian counter-attack. Purposes can be stated at different **levels of generality**.
      *   Level 1: "Prevent theft." (Case C is a violation).
      *   Level 2: "Ensure Station Survival." (Case C is not a violation).
  *   **Key Moment:** If a student says, "Well, obviously survival is more important," press them: "That's a moral judgment, not a legal one. You just became the legislator."

  **4. Fidelity to Law (The Hartian Defense)**
  *   **Point to:** Round 1 vs. Round 3.
  *   **Ask:** "In Round 3, the Drafter's Note said Rule 3 didn't apply to emergencies. Did that make you feel better?"
  *   **Theory:** Hart argues rules exist to **settle coordination problems**. If we have to wait for a Drafter's Note every time the Shift Lead is unconscious, the rule isn't doing its job.
  *   **Key Moment:** "Why follow Rule 3 in Case C if the Lead is unconscious? Because next time, someone might claim the Lead was unconscious when they weren't. The rule protects against *future* lying, not just *current* necessity."

  **5. The Reveal (Minute 65)**
  *   Now name them. **H.L.A. Hart** (Positivism/Separation Thesis) vs. **Lon Fuller** (Internal Morality of Law).
  *   Explain that Round 1 was a Hartian reading (textual authority). Round 2 was a Fullerian reading (law as purposive).
  *   Explain that the conflict between Purpose A and Purpose B illustrates the critique of Fuller (indeterminacy).

  ---

  ### Part 5: Troubleshooting (What Will Go Wrong)

  **1. "Wait, this is Hart and Fuller, isn't it?" (Minute 5)**
  *   **Risk:** A law student recognizes the structure immediately.
  *   **Fix:** "Maybe. But right now I want you to solve the Station's problem, not diagnose the seminar. Park the names until the end."

  **2. Groups Compare Purpose Sheets (Minute 20)**
  *   **Risk:** They realize the sheets differ and stop working.
  *   **Fix:** Physical separation. If you have the space, put Group A on the left wall, Group B on the right. Collect the sheets *before* the reveal.

  **3. Arguing on the Merits (Minute 25)**
  *   **Risk:** "Of course you should fix the heater! People will die!"
  *   **Fix:** Interrupt. "I am not asking if it is *right*. I am asking if it is a *Violation*. You can do the right thing and still violate the rule. That is the point of the exercise."

  **4. One Group Finishes Early (Minute 12)**
  *   **Risk:** Silence while the other group finishes.
  *   **Fix:** Have a "Dissent" task ready. "If you agree unanimously, write down the strongest argument *against* your position. You will need it for the debate."

  **5. The Drafter's Note Resolves Everything (Minute 35)**
  *   **Risk:** Students think the Note solves the indeterminacy.
  *   **Fix:** Point out Case B (The Freeze). The Note *doesn't* mention the Time Rule. Ask: "Why did the Architect explain Rule 3 but stay silent on Rule 2? Does silence mean prohibition, or does it mean Rule 2 is absolute?"

  ---

  ### Part 6: Honest Limitations (What You Must Lecture)

  This exercise is a simulation of *interpretation*, not *obligation*. You need to explicitly supply the following in the last 15 minutes, because the game cannot generate them:

  1.  **The Internal Point of View:**
      *   *Limitation:* Your students are playing judges for 90 minutes. They don't *live* under these rules. They don't feel the burden of fidelity.
      *   *Supply:* Explain that for Hart, the "Internal Point of View" is when officials accept the rules as standards of conduct, not just threats of punishment. The exercise shows *how* they interpret, not *why* they obey.

  2.  **The Moral Stakes (The Grudge Informer):**
      *   *Limitation:* Station Aegis is benign. No one goes to jail. The "law" isn't evil.
      *   *Supply:* You must describe the **Grudge Informer Case** (Nazi era). Fuller's point is that if law loses its "inner morality" (clarity, non-retroactivity, congruence), it isn't just bad law, it ceases to be law *at all*. Hart says: "It is law, but it is too evil to obey." This is the real moral crux that the Seed Vault scenario softens.

  3.  **Fidelity as a Moral Attitude:**
      *   *Limitation:* The exercise makes fidelity look like stubbornness (Round 1).
      *   *Supply:* Explain Fuller's view: Fidelity to law is a reciprocal relationship between government and citizen. When the government twists the purpose (like Purpose Sheet A vs. B), it breaks that reciprocity. Hart says reciprocity is nice, but clarity is safer.

  ### Final TA Tip
  If the discussion stalls in the debrief, ask the three law students: "In a real moot court, which Purpose Sheet would you submit to the judge? Why?" This usually breaks the ice because it shifts from "philosophical truth" to "professional strategy," which often reveals their underlying theoretical commitments.
