      *   **Constraints:**
          *   No stock examples (No vehicles in the park, no grudge informer).
          *   Invent a self-contained scenario (Antarctic station idea is good, keep or refine).
          *   Specific Rule Types: Time/Place, Category (living/non-living), Procedure.
          *   Specific Case Types: Text yes/Purpose no, Purpose yes/Text no, 50/50 split.
          *   Structure: Rounds with reveals (Text only -> Divergent Purposes -> Drafter's Note).
          *   No advance reading, no names (Hart/Fuller) until debrief.
          *   Deliverables: Ordinance, Cases, Purpose Sheets (A & B), Drafter's Note, Timeline, Board Plan, Tallying, Debrief Guide, Troubleshooting.
          *   Honesty Check: What will go wrong? What can't this exercise do?

  2.  **Scenario Development:**
      *   *Idea:* Antarctic Research Station is strong. It's isolated, high stakes, resource-scarce, bureaucratic but communal. Let's call it "Station Aegis."
      *   *Resource:* The "Bio-Vault" (seeds, samples, meds).
      *   *Ordinance:* "The Bio-Vault Conservation Protocol."
      *   *Rules:*
          1.  *Category:* "No organic material may be removed from the Bio-Vault without authorization." (The "Living Thing" rule).
          2.  *Time/Place:* "Access to the Bio-Vault is prohibited between 22:00 and 06:00." (The "Curfew" rule).
          3.  *Procedure:* "All removals must be logged in the Digital Manifest and countersigned by the Shift Lead." (The "Paperwork" rule).

  3.  **Case Development:**
      *   *Case 1 (Text Yes / Purpose No):* Removing a dead plant sample for disposal outside. Text says "organic material" (dead is organic). Purpose is conservation/preventing theft. Disposal isn't theft.
      *   *Case 2 (Purpose Yes / Text No):* Accessing the vault at 22:30 during a fire alarm/medical emergency. Text says "No access 22:00-06:00." Purpose is safety/conservation. Emergency overrides safety logic.
      *   *Case 3 (The 50/50 Split):* A researcher takes a seed sample at 14:00, logs it digitally, but the Shift Lead is asleep/unconscious, so they can't get the countersignature. They take it to save a crop failing in the greenhouse. Text: Violation (no signature). Purpose: Debatable (protocol integrity vs. mission success).
      *   *Refinement:* Let's make Case 3 trickier. Maybe "Organic Material" includes bacteria? Or maybe the "Countersignature" rule applied to a digital transfer that auto-logs? Let's go with the *Countersignature* rule during a crisis. It highlights procedure vs. outcome.
      *   *Wait, I need a specific 50/50 case.* Let's try: A researcher removes a vial of frozen bacterial culture (organic) at 14:00. They log it. The Shift Lead is the *only* other person on station and is currently in the airlock decontaminating (cannot be reached for 20 mins). The researcher needs the bacteria *now* to treat a contaminated water filter.
          *   Text: Violation (No countersignature).
          *   Purpose: Conservation? No, the bacteria is used, not lost. Safety? Yes, water is critical.
          *   This creates the "Rule of Law" tension: Do we follow the procedure to prevent abuse, or bend it for necessity?

  4.  **Purpose Sheets (The Twist):**
      *   *Group A (Narrow/Specific):* "To prevent theft and loss of proprietary genetic stock." (Focus on ownership/security).
      *   *Group B (Broad/Teleological):* "To ensure the long-term survival and scientific utility of the Station's biological resources." (Focus on mission/survival).
      *   *Effect:* Group A will be stricter on removal (theft risk). Group B will be more flexible (survival utility).

  5.  **Drafter's Note:**
      *   Needs to complicate things. "The Countersignature rule was intended to prevent *unrecorded* loss, not to delay emergency medical or life-support interventions. However, the 'No Organic Material' rule was absolute to prevent bio-contamination."
      *   This helps the Procedure case but hurts the "Dead Plant" case (if dead plants count as contamination risk).

  6.  **Timeline (90 Minutes):**
      *   0-5: Intro & Groups.
      *   5-20: Round 1 (Text Only).
      *   20-35: Round 2 (Purposes - Split Groups).
      *   35-50: Round 3 (Drafter's Note & Deliberation).
      *   50-90: Debrief & Mapping to Theory.

  7.  **Debrief Mapping:**
      *   Text Only = Hart (Core meaning).
      *   Purpose Split = Fuller (Law includes purpose) + Indeterminacy objection.
      *   Drafter's Note = Intent vs. Text.
      *   Final discussion = Fidelity to Law.

  8.  **Troubleshooting:**
      *   *Naming the debate:* Acknowledge, park it, return later.
      *   *Comparing sheets:* Physical separation, collect sheets afterwards.
      *   *Merits arguing:* Remind them they are *judges applying rules*, not legislators.
      *   *Fast finishers:* Give them a "Harder Case" or ask them to draft a dissent.

  9.  **Limitations:**
      *   Internal Point of View: Hard to simulate in 90 mins.
      *   Immoral Laws: This scenario is benign. Need to lecture on the Grudge Informer to get the moral stakes of Fuller.
      *   Fidelity: Students are playing a game, not living under the law.

  10. **Refining the Materials:**
      *   Make the Ordinance look official.
      *   Ensure the Cases are punchy.
      *   Make the Purpose Sheets distinct but plausible.
      *   Check the timing. 14 students = 3 groups of 4, or 2 groups of 7? Small groups are better for participation. Let's do 3 groups of 4-5. Wait, for the Purpose Sheet twist, I need to split the room. Two large groups (7 vs 7) works better for the "don't compare" constraint. Let's do 2 groups of 7.
      *   *Correction:* 14 people is small enough for 2 groups of 7.
      *   *Board Plan:* Need a grid to tally votes.

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Case 1 (Text Yes/Purpose No):* Removing a dead, diseased plant for incineration. Text: "Organic material." Purpose: Conservation (it's dead/diseased).
      *   *Case 2 (Purpose Yes/Text No):* Bringing a personal antibiotic (organic) into the vault to treat a spill? No, that's messy. How about: Accessing the vault at 23:00 because the heating failed and seeds will freeze. Text: "No access 22:00-06:00." Purpose: Conservation (seeds will die).
      *   *Case 3 (The Split):* The Countersignature. A researcher removes a vial. Logs it. Shift Lead is in the bathroom/unavailable for 5 mins. Researcher leaves immediately. Text: Violation. Purpose: Accountability (did loss occur? No).
      *   *Wait, I need to ensure the Purpose Sheets actually change the outcome.*
          *   Group A (Security/Property): "Prevent unauthorized removal of Station assets." -> Case 1 (Dead plant is asset? Maybe scrap). Case 2 (Emergency access? No, rule is rule).
          *   Group B (Mission/Survival): "Ensure biological continuity of Station operations." -> Case 1 (Dead plant is waste, remove). Case 2 (Seeds freeze, mission fails, access allowed).
      *   *Okay, let's finalize the Rules.*
          1.  **Rule 1 (Category):** "No organic matter shall be removed from the Bio-Vault."
          2.  **Rule 2 (Time):** "The Bio-Vault is locked and inaccessible from 22:00 to 06:00."
          3.  **Rule 3 (Procedure):** "All removals require a Digital Log entry AND a Shift Lead Countersignature."

      *   *Cases:*
