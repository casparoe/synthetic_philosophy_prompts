answer: |-
  INTERNAL MEMORANDUM

  **TO:** Regional Operations Directors
  **FROM:** Central Strategy Unit (CSU)
  **DATE:** 14 November 1978
  **REF:** CSU/OP/78/429
  **SUBJECT:** Implementation of Centipede Delegation Protocol

  It has come to the attention of the Strategy Unit that a significant volume of administrative labour is being initiated at lower hierarchical nodes without adequate consideration of downstream capacity. Current workflows assume that tasks passed upward will be actioned. This assumption is empirically flawed. To rectify this misallocation of effort, the CSU proposes the immediate adoption of the Centipede Delegation Protocol (CDP).

  The CDP is grounded in backward induction modelling regarding rational actor behaviour within a vertical chain of command. The logic is straightforward. If a task reaches the Board, it will not be completed due to competing strategic priorities. Knowing this, a Divisional Head should not complete it, anticipating the Board's inaction. Knowing *that*, a Regional Manager should not complete it, anticipating the Divisional Head's inaction. This unraveling continues down to the entry-level clerk. Therefore, the only rational move at the initial node is to never initiate the task. By recognising that the probability of completion approaches zero as hierarchy increases, staff can avoid the sunk cost of premature diligence.

  To operationalise this, we have established the **Hargreaves Point**. This is the threshold of effort beyond which the probability of upward deferral outweighs the marginal utility of task completion. Once a task requires more than twelve minutes of input, the employee should calculate their **Recursive Deferral Coefficient (RDC)**. If the RDC exceeds 0.84, the file must be immediately marked 'For Review' and passed to the next tier. This ensures that no single individual bears the burden of a process destined to stall.

  Pilot trials at the Bristol Branch (Centre 44) demonstrate the efficacy of this approach. Over a six-week period, staff were instructed to apply backward induction to all incoming requisitions. The results were notable:

  1.  **Paperwork Velocity:** Increased by 45%. Files circulated through the system much faster because no one stopped to read them.
  2.  **Decision Latency:** Improved significantly. By deferring decisions upward until they reached the Board (where they were subsequently lost), the branch eliminated the risk of incorrect local decisions.
  3.  **Staff Morale:** Rose by 18%, correlating with a reduction in the occurence of actual work.

  In one specific instance, a requisition for new typewriter ribbons was initiated by a Junior Clerk. Under legacy protocols, this would have been processed within 48 hours. Under CDP, the clerk anticipated the Finance Manager would defer to the Regional Director, who would defer to the Board. The clerk correctly identified the Hargreaves Point at minute four and filed the request under 'Pending Strategic Alignment'. The ribbons were never purchased, saving the organisation £4.12, and the file was eventually mislaid at the Executive level, removing the liability from the branch entirely.

  Some critics argue this leads to operational paralysis. This misunderstands the objective. Paralysis is not a failure state; it is a risk mitigation strategy. If no tasks are completed, no errors can be attributed to specific personnel. Accountability is successfully diffused across the entire chain, rendering individual performance metrics impossible to audit. This provides maximum job security with minimal output.

  Regional Directors are instructed to recieve this protocol as mandatory guidance effective 1st January. Managers found actioning tasks without first calculating the RDC will be subject to review for 'over-performance' and potential insubordination against strategic inertia targets. Please ensure all staff understand that doing nothing is only efficient if it is done for the right reasons.

  Signed,

  **J. P. Thistlethwaite**
  Head of Process Optimisation
  Central Strategy Unit
