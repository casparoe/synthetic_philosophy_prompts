answer: |-
  No, the right historiography should not drop the rest because historical events are rarely strictly overdetermined by independent sufficient causes, but are instead produced by conjunctural complexes where every factor is necessary to trigger the outcome. Your intuition about redundancy is logically sound for strict philosophical overdetermination, such as two shooters firing simultaneously where either bullet alone would kill the victim, but this model rarely applies to complex historical processes like the fall of Rome. When historians loosely speak of overdetermination, they are usually describing what philosopher J.L. Mackie called INUS conditions: an Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient. In this framework, economic decline alone was not sufficient to fall Rome, nor was barbarian pressure alone; rather, the conjunction of economic decline, barbarian pressure, and political corruption formed a sufficient complex. Because each factor is a necessary component of that specific sufficient complex, removing any single factor via mental ablation would prevent the outcome, meaning no single cause is redundant. This resolves your counterfactual worry: if you strip away the economic decline, the empire does not fall in that specific way or at that specific time because the remaining factors were insufficient on their own. You are also correct to suspect a token-level issue, as type-level generalizations might suggest sufficiency (e.g., "invasions destroy empires"), but token-level historical events depend on specific contextual conjunctions where no single variable carries full causal weight. Consequently, historical explanation is not redundant because citing multiple causes does not list alternative sufficient paths, but rather reconstructs the single actual pathway composed of interdependent necessary parts.
