answer: |-
  The tension you are facing is the classic friction between **Putnamian Natural Kind Externalism** (meaning fixed by underlying physical structure) and **Burgean Social Externalism** (meaning fixed by communal normative practices). Your invented cases sharpen this because they isolate the variables: *Neuro-signal* pits intended description against causal source (favouring source/practice), while *Synthetic Emerald* pits communal classification against chemical identity (favouring identity/structure).

  To unify these verdicts without splitting your theory into domain-specific rules, you need an argument that prioritizes **Causal-Historical Grounding** over **Metaphysical Essence**.

  Here is the argument that resolves the conflict: **The "Baptismal Sovereignty" Argument.**

  Semantic externalism posits that reference is fixed at the point of introduction (baptism) via a causal link to the world, which is then preserved by a social chain of transmission.
  1.  **In the Neuro-signal case:** The term was baptized ostensively or via measurement. The *causal source* of the data was the artefact, not the brainwave. Even though the scientists *described* it as a brainwave, the causal chain anchored the word to the artefact. Your intuition that "social practice wins" is actually an intuition that **the causal source of the baptism overrides the speakers' descriptive beliefs.**
  2.  **In the Emerald case:** If Twin Earth jewellers baptize 'emerald' using mined stones and explicitly exclude synthetic ones, they are fixing the reference to an **origin-based kind** (like biological species), not merely a chemical kind. If you insist that "chemical structure wins" despite their explicit origin restriction, you are allowing *metaphysical assumptions* (that gems are individuated solely by chemistry) to override the *semantic facts* of how the term was grounded.

  To maintain a unified externalist framework, you must treat the **grounding event** as sovereign in both cases. In *Neuro-signal*, the grounding event picked out the artefact. In *Emerald*, if the grounding event picked out "mined beryl," then 'emerald' refers to mined beryl, even if synthetic beryl is chemically identical. To say chemistry *must* win in the Emerald case is to claim that speakers can be systematically wrong about the reference-fixing properties of their own natural kind terms in a way they cannot be in the Neuro-signal case. Consistency demands that if causal history fixes reference in the first case, it must fix it in the second.

  Therefore, the "Emerald Structure Reading" relies on a hidden descriptivist assumption (that 'emerald' *means* "beryl with chemical composition X") which contradicts the externalist mechanism you accepted in the Neuro-signal case.

  Verdict: A unified principle exists (Causal-Historical Grounding), but it sacrifices the Emerald Structure Reading.
