answer: |-
  # Diagnostic Instrument: Higher-Order Evidence and Epistemic Akrasia

  ## Instructions
  Read each of the ten cases below. Each describes an agent who has formed a belief based on first-order evidence and subsequently acquired higher-order evidence (evidence about the reliability of their belief-forming process). Select the option that best matches your intuitive judgment about the agent's epistemic situation. There are no "correct" answers; the goal is to map the inferential structure of your intuitions.

  ---

  ### The Quiz

  **Case 1: The Calculation**
  Alex solves a complex math problem in their head and becomes 90% confident the answer is 453. Immediately after, Alex's classmate Blake, whom Alex knows to be equally competent and attentive, says they solved the same problem and are 90% confident the answer is 459.
  *   **A.** Alex is required to significantly lower their confidence, perhaps suspending judgment entirely.
  *   **B.** Alex may retain their 90% confidence, provided they carefully re-checked their work.
  *   **C.** Alex should lower confidence somewhat (e.g., to 60%), but need not suspend judgment.

  **Case 2: The Fatigue Diagnosis**
  Jordan finishes a logic puzzle and believes the conclusion is valid. A reliable monitor then informs Jordan that they have been awake for 24 hours and that cognitive performance on logic tasks drops by 50% after this duration. Jordan feels sharp, but trusts the monitor.
  *   **A.** Jordan's belief is no longer supported; they ought to withhold belief.
  *   **B.** Jordan's belief remains supported if the reasoning was actually valid, regardless of fatigue.
  *   **C.** Jordan is not blameworthy for keeping the belief, but the belief is no longer justified.

  **Case 3: The Bias Report**
  Taylor believes a political claim *p* based on news reports. A psychological evaluation reveals Taylor has a strong, unconscious confirmation bias regarding this specific political topic. Taylor cannot introspectively detect the bias affecting this specific belief.
  *   **A.** Taylor is epistemically criticizable for maintaining belief in *p*.
  *   **B.** Taylor is not criticizable, but ought to stop believing *p*.
  *   **C.** Taylor may continue to believe *p* if the news reports were sufficiently strong.

  **Case 4: The Reasoning Drug**
  Casey takes a pill believed to be a vitamin. Later, Casey learns the pill was actually a drug that induces random logical errors in 80% of users. Casey has no specific reason to think they made an error on the specific proposition *q* they currently believe, other than having taken the pill.
  *   **A.** Casey must abandon belief in *q*.
  *   **B.** Casey may retain belief in *q*, though their confidence should be reduced.
  *   **C.** Casey's rationality depends on whether *q* is actually true.

  **Case 5: The Track Record**
  Morgan uses a specific heuristic to estimate probabilities. A review of Morgan's past 100 estimates shows the heuristic yields the correct result only 40% of the time. Morgan currently believes *r* based on this heuristic.
  *   **A.** Believing *r* is irrational given the track record.
  *   **B.** Believing *r* is rational if the current application of the heuristic feels compelling.
  *   **C.** Believing *r* is permissible, but Morgan cannot claim to know *r*.

  **Case 6: The Expert Undercut**
  Riley forms a belief based on sensory perception. An expert in optics informs Riley that the lighting conditions in the room systematically produce illusions of the exact type Riley is experiencing.
  *   **A.** Riley's perceptual evidence is defeated; Riley should not believe.
  *   **B.** Riley's perceptual evidence remains; Riley is merely uncertain if it is veridical.
  *   **C.** Riley should believe the expert, but may still trust their eyes if the illusion seems absent.

  **Case 7: The Akratic State**
  Sam believes *s*. Sam also believes: "My total evidence does not support believing *s*." Sam has arrived at this second belief through careful reflection on their own evidence.
  *   **A.** It is possible for Sam's total doxastic state to be fully rational.
  *   **B.** Sam's total doxastic state is necessarily irrational.
  *   **C.** Sam's first-order belief is irrational, but the second-order belief is rational.

  **Case 8: Strong First-Order, Strong Higher-Order**
  Drew has overwhelming first-order evidence for *t* (e.g., a clear mathematical proof). However, Drew also has overwhelming higher-order evidence that they are currently incapable of grasping proofs in this domain (e.g., a reliable brain scan shows a temporary lesion in the reasoning center).
  *   **A.** Drew ought to believe *t* because the proof is conclusive.
  *   **B.** Drew ought to withhold belief because the lesion undermines their grasp of the proof.
  *   **C.** Drew ought to believe *t*, but is blameworthy for doing so without external confirmation.

  **Case 9: Positive Higher-Order Evidence**
  Pat believes *u* based on moderate evidence. Pat then receives a reliable report that their cognitive faculties are currently functioning at peak efficiency, far above average.
  *   **A.** Pat should increase confidence in *u* beyond what the first-order evidence alone warrants.
  *   **B.** Pat's confidence should remain fixed by the first-order evidence alone.
  *   **C.** Pat is permitted to increase confidence, but not required to.

  **Case 10: Blame vs. Justification**
  Lee believes *v*. Lee acquires higher-order evidence suggesting *v* is unsupported. Lee retains belief in *v*.
  *   **A.** Lee is unjustified in believing *v* and is epistemically blameworthy.
  *   **B.** Lee is unjustified in believing *v* but is not epistemically blameworthy.
  *   **C.** Lee is justified in believing *v* and is not epistemically blameworthy.

  ---

  ## Scoring Key and Diagnostic Profiles

  *Note: This key maps clusters of responses to epistemological commitments. It is a heuristic tool for seminar discussion, not a mathematical proof. Your profile is determined by the preponderance of your answers.*

  ### Profile 1: The Defeater (Conciliationist)
  *   **Typical Answers:** 1A, 2A, 4A, 5A, 6A, 8B.
  *   **Core Commitment:** Higher-order evidence is genuine evidence that must be weighed alongside first-order evidence; in cases of conflict, higher-order evidence often defeats or undercuts the first-order evidence.
  *   **Most Awkward Commitment:** This view risks widespread skepticism, as we often have some reason to doubt our reliability in any given domain.
  *   **Relation to Akrasia:** Typically aligns with **No-Level-Splitting**. If HOE defeats the belief, one should not hold the belief, thus avoiding the akratic state.

  ### Profile 2: The Anchor (Steadfast)
  *   **Typical Answers:** 1B, 2B, 3C, 4B, 6B, 8A.
  *   **Core Commitment:** A peer's disagreement or evidence of impairment need not reduce the force of one's original evidence; if the first-order evidence is strong enough, it can rationally sustain belief despite higher-order doubts.
  *   **Most Awkward Commitment:** It can appear arbitrary or question-begging to privilege one's own reasoning over reliable reports of one's own impairment.
  *   **Relation to Akrasia:** Often implies **Level-Splitting**. One believes *p* (due to FOE) while acknowledging the HOE suggests the belief is unsupported.

  ### Profile 3: The Normativist (Right Reasons)
  *   **Typical Answers:** 2C, 3B, 8C, 10B.
  *   **Core Commitment:** The first-order evidence alone fixes what one *ought* to believe (propositional justification); higher-order evidence bears primarily on blameworthiness or doxastic justification (whether one is responsible in holding the belief).
  *   **Most Awkward Commitment:** It creates a gap between what is justified and what one is permitted to be blamed for, potentially allowing "lucky" believers to be justified while being blameworthy, or vice versa.
  *   **Relation to Akrasia:** Variable, but often **No-Level-Splitting**. If FOE fixes the norm, believing against HOE might be blameworthy but the belief itself could remain justified, avoiding true akrasia.

  ### Profile 4: The Weigher (Total Evidence)
  *   **Typical Answers:** 1C, 4B, 5B, 6C, 9A.
  *   **Core Commitment:** Both orders of evidence count as inputs into a single calculus; neither simply replaces the other, and the rational outcome depends on the specific strength of each in the particular case.
  *   **Most Awkward Commitment:** It lacks a clear algorithm for how to weigh incommensurable types of evidence (e.g., a logical proof vs. a reliability statistic).
  *   **Relation to Akrasia:** Typically **No-Level-Splitting**. The "total evidence" determines the rational belief; if the total evidence says "withhold," believing is irrational.

  ### Profile 5: The Fragmented (Level-Splitting)
  *   **Typical Answers:** 7A is the primary indicator. May combine with Profile 2 answers.
  *   **Core Commitment:** It is rationally permissible (or sometimes required) to believe *p* while believing that one's belief in *p* is not rationally supported. Rationality operates on separate levels that need not cohere.
  *   **Most Awkward Commitment:** It sanctions a fragmented mind, where one part of the agent's perspective condemns the other part's activity as irrational.
  *   **Relation to HOE:** Treats HOE as binding on the second-order belief but not necessarily forcing a change in the first-order belief.

  ### Profile 6: The Coherer (No-Level-Splitting)
  *   **Typical Answers:** 7B is the primary indicator. May combine with Profile 1 or 4 answers.
  *   **Core Commitment:** A combination of believing *p* and believing that believing *p* is irrational is necessarily irrational. Rationality requires coherence between levels.
  *   **Most Awkward Commitment:** In cases of misleading higher-order evidence, this view may force the agent to abandon a true and well-supported belief simply to maintain coherence.
  *   **Relation to HOE:** Treats HOE as a constraint that forces the first-order belief to align with the second-order assessment.

  ---

  ## Unoccupied Combinations

  The following combinations of intuitions are logically unstable or theoretically unoccupied. If your answers align with these, your position may be incoherent or under-theorized.

  1.  **The "HOE is Irrelevant" + "Akrasia is Irrational" Cluster**
      *   *Pattern:* You claim higher-order evidence never changes what one ought to believe (Steadfast on all cases), yet you claim the Akratic State (Case 7) is necessarily irrational.
      *   *Diagnosis:* **Incoherent.** If HOE never changes what you ought to believe, you never have a reason to think your belief is unsupported. Therefore, the condition for akrasia (believing *p* + believing belief in *p* is unsupported) should never arise for a rational agent. If it does arise, the Steadfast view says the belief is fine, so the second-order belief is false, making the *state* irrational only because the second-order belief is false, not because of the split. However, maintaining that HOE is *evidence* but *never* impacts justification while demanding coherence is a tension most theorists resolve by dropping one horn.

  2.  **The "Total Defeat" + "Rational Akrasia" Cluster**
      *   *Pattern:* You claim strong HOE always requires abandoning the first-order belief (Conciliationist on all cases), yet you claim the Akratic State (Case 7) is rational.
      *   *Diagnosis:* **Unattractive.** If strong HOE requires abandoning the belief, then an agent who retains the belief is violating a rational requirement. A state that violates a rational requirement cannot be fully rational. This position suggests one ought to drop the belief, but it's okay if one doesn't, which collapses the normativity of the "ought."

  3.  **The "Positive Only" Cluster**
      *   *Pattern:* You claim Positive HOE (Case 9) increases justification, but Negative HOE (Cases 1-6) does not decrease it.
      *   *Diagnosis:* **Unexplored.** Most epistemological theories treat evidence symmetrically. A view that allows reliability boosts to count but reliability defeaters to not count lacks a clear principled basis, though it might appeal to a specific kind of epistemic conservatism.

  ---

  ## Limitations and Expansions

  ### Positions the Quiz Cannot Separate
  1.  **Steadfastness vs. Right Reasons:** This quiz struggles to fully separate the Steadfast view from the Right Reasons view. Both often recommend retaining belief in the face of HOE. The distinction lies in *why*: Steadfastness claims the HOE doesn't defeat the FOE; Right Reasons claims the FOE fixes the norm and HOE only affects blame/access. While Case 10 attempts to probe this, advanced undergraduates often conflate "justified" with "not blameworthy."
      *   *Distinction Flag:* This quiz does not rigorously distinguish between **propositional justification** (having reasons) and **doxastic justification** (basing belief properly on reasons). Right Reasons theorists rely heavily on this split; Steadfast theorists often do not.

  2.  **Conciliationism vs. Total Evidence:** In many cases, a Conciliationist and a Total Evidence theorist will give the same answer (e.g., "lower confidence"). The difference is that the Conciliationist sees HOE as a *defeater* that trumps, while the Total Evidence theorist sees it as a *weight* to be balanced. Without varying the strength of HOE more granularly, these views look identical on a multiple-choice quiz.

  ### Proposed Additional Cases
  To separate these positions further, consider adding the following cases to an expanded version of the instrument:

  1.  **The "Ungettable" Evidence Case (Separates Steadfast from Right Reasons):**
      *   *Description:* An agent has first-order evidence for *p*. Higher-order evidence suggests they are biased. However, the agent *cannot* access the first-order evidence directly anymore (it is lost), only their memory of the conclusion.
      *   *Purpose:* Right Reasons theorists might say the agent is no longer justified because they cannot base the belief on the FOE properly. Steadfast theorists might say the belief remains justified if the original formation was sound. This probes the *basing relation*.

  2.  **The "Variable Weight" Case (Separates Conciliationism from Total Evidence):**
      *   *Description:* Present two versions of the Peer Disagreement case. In Version A, the peer is slightly less reliable. In Version B, the peer is slightly more reliable.
      *   *Purpose:* Ask for specific confidence intervals. A Total Evidence theorist should show a smooth gradient of confidence adjustment. A strict Conciliationist might show a "threshold" effect where any peer disagreement triggers a mandatory suspension of judgment regardless of slight reliability differences.
