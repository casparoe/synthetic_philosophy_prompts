answer: |-
  This is an excellent exercise in source criticism. The summary you have is a very specific, aggressive reading of Global Workspace Theory (GWT), heavily influenced by the "Paris School" (Stanislas Dehaene) and Daniel Dennett. It blends empirical claims with metaphysical conclusions.

  If you use this in a seminar, you need to know exactly where the empirical data ends and the philosophical advocacy begins. Below is the sentence-by-sentence breakdown, followed by a synthesis of the specific logical and philosophical issues you raised.

  ### Sentence-by-Sentence Analysis

  **1. "Global workspace theory says that a mental state becomes conscious when the information it carries wins a competition for a brain-wide bottleneck and gets broadcast to the rest of the system — to memory, to language, to motor planning."**
  *   **Status:** **Accepted / Standard Summary.**
  *   **Analysis:** This is an accurate, standard description of the cognitive architecture proposed by Bernard Baars and implemented neurally by Dehaene. The metaphors of "competition," "bottleneck," and "broadcast" are canonical GWT terminology.
  *   **Seminar Safety:** Safe to repeat as a description of the theory's mechanism.

  **2. "That broadcast is what being conscious consists in; it is the difference between everything your brain registers without your noticing it and the one content you are aware of at a time."**
  *   **Status:** **Contested (Theoretical Claim).**
  *   **Analysis:** This states the *identity claim* of GWT. Proponents accept this. Critics (e.g., Victor Lamme, Ned Block) reject it. They argue broadcast is necessary for *reporting* awareness, but not for *having* an experience (phenomenal consciousness).
  *   **Seminar Safety:** Safe to attribute to GWT ("GWT claims that..."), but do not present it as an established fact.

  **3. "This is also why the theory handles the distinction philosophers draw between access consciousness and phenomenal consciousness so cleanly: phenomenal consciousness is just the having of the experience, access consciousness is the very same experience being globally broadcast and made available, so access is where the explanatory work gets done and phenomenal consciousness is simply what is left over once you subtract it."**
  *   **Status:** **Rejected / Misleading (Philosophical Interpretation).**
  *   **Analysis:** **Your suspicion is correct.** This is the most dangerous sentence in the text.
      *   **The Standard Complaint:** The standard philosophical critique (from Ned Block, who coined the terms) is that GWT explains *Access* but leaves *Phenomenal* consciousness unexplained (the "explanatory gap").
      *   **The Summary's Claim:** This summary claims GWT *dissolves* the distinction by making phenomenality a residual epiphenomenon ("what is left over").
      *   **The Problem:** This is not a neutral summary of GWT; it is an *illusionist* or *eliminativist* interpretation. Most GWT proponents argue Access and Phenomenality *coincide* (you can't have one without the other), not that phenomenality is a useless leftover. By calling it "what is left over," the speaker implies it has no causal power, which is a further metaphysical commitment not required by the cognitive architecture itself.
  *   **Seminar Safety:** **Do not repeat this as fact.** If you use it, you must frame it as: "Some proponents argue this dissolves the distinction, but critics argue this conflates the two."

  **4. "The theory is not armchair either — it predicts the data."**
  *   **Status:** **Accepted (with caveats).**
  *   **Analysis:** GWT/GNW has generated testable predictions. However, "predicts" is strong; "is consistent with" is often more accurate given the replication crises in some neuroimaging studies.
  *   **Seminar Safety:** Safe, provided you acknowledge competing theories (like IIT) also claim to predict data.

  **5. "Masked words and unseen images are processed quite deep into the cortex but never ignite; when a stimulus does ignite, you get the late sustained activity in prefrontal and parietal cortex and the P300 wave, and at that point subjects can report the stimulus and are conscious of it on every measure available to us."**
  *   **Status:** **Contested (Empirical Interpretation).**
  *   **Analysis:** The description of "ignition" and P300 is accurate to the GNW (Global *Neuronal* Workspace) model. However, the claim "conscious of it on every measure available to us" is the flashpoint.
      *   **The Critique:** Critics using "no-report paradigms" argue subjects can have phenomenal experiences (measured via eye-tracking or neural markers) *without* the P300/prefrontal ignition, provided they don't have to report it.
      *   **The Implication:** The speaker assumes that if you can't report it, you aren't conscious of it. This is a methodological assumption, not a raw datum.
  *   **Seminar Safety:** Attribute to GNW proponents. Acknowledge the "no-report" counter-evidence.

  **6. "So consciousness, in the only sense science can get a grip on, just is global availability, and what people call the hard problem is the insistence on an extra fact — the what-it's-like — that makes no difference to what the organism does or says."**
  *   **Status:** **Editorializing / Philosophical Premise.**
  *   **Analysis:** This does not follow from the previous sentences. It requires a hidden premise: *Science can only study functional/structural facts.*
      *   **The Leap:** Moving from "GWT explains access" to "The Hard Problem is a pseudo-problem" is a philosophical move (Type-A Physicalism or Illusionism), not a scientific conclusion. David Chalmers (who formulated the Hard Problem) would argue this begs the question.
      *   **The "Only Sense" Claim:** This is methodological naturalism, which is a stance, not a finding.
  *   **Seminar Safety:** **Flag this clearly.** This is the speaker's philosophical stance, not the theory's empirical output.

  **7. "There is no room for such a fact in the theory, and the neural signature of reportability is the neural correlate of consciousness."**
  *   **Status:** **Contested (Definition).**
  *   **Analysis:** This equates the Neural Correlate of Consciousness (NCC) with the Neural Correlate of *Reportability* (NCR).
      *   **The Consensus:** Most researchers agree NCC and NCR should be distinguished.
      *   **The GNW Stance:** Dehaene argues that because we can only verify consciousness via report, the NCC *must* include the report machinery.
      *   **The Opposition:** Critics argue this confuses the *consequence* of consciousness (report) with the *state* of consciousness.
  *   **Seminar Safety:** Present as the GNW definition, but note it is a major point of contention in the field.

  ---

  ### Addressing Your Two Specific Concerns

  #### 1. Conclusions vs. Premises (The Logical Gap)
  You asked whether conclusions like "the Hard Problem is a pseudo-problem" or "reportability is the right measure" follow from the accurate parts of the summary. **They do not.** They require additional, undefended philosophical premises.

  *   **The Hard Problem:** To conclude the Hard Problem is an "insistence on an extra fact," one must assume **Physicalism** or **Illusionism** is true. GWT is a functional theory; it describes *how* information is processed. It does not logically entail *why* that processing feels like anything. The speaker is smuggling in a metaphysical solution (there is no "why") as if it were a scientific result.
  *   **Reportability:** To conclude "reportability = consciousness," one must assume **Operationalism**: that a scientific construct is identical to the method used to measure it. Critics argue this is a category error. The summary presents this operational definition as a discovery ("science can get a grip on"), when it is actually a methodological choice that excludes alternative possibilities (like unconscious phenomenality).

  **Seminar Advice:** If you present this, explicitly state: *"The speaker moves from the functional account of GWT to an eliminativist conclusion about the Hard Problem. This move is valid only if one accepts the premise that functional exhaustiveness equals ontological completeness."*

  #### 2. Settled vs. Contested vs. Editorializing
  Here is how you should categorize these claims for your audience to avoid "wincing later."

  | Claim Category | Specific Claims from Text | Consensus Level |
  | :--- | :--- | :--- |
  | **Settled Ground** | • GWT posits a bottleneck and broadcast mechanism.<br>• Unconscious stimuli can be processed deeply (masking).<br>• Conscious report is associated with late sustained activity (P300/PFC). | **High.** Even critics accept these as the *claims* of GWT and generally accept the basic empirical patterns (though they dispute the interpretation). |
  | **Contested Ground** | • Broadcast *is* consciousness (vs. broadcast is just for report).<br>• P300/Ignition is the *NCC* (vs. NCC of report).<br>• Access and Phenomenal consciousness coincide (vs. can come apart). | **Low.** This is the active battlefield between GNW (Dehaene) and competitors like IIT (Koch) or Recurrent Processing Theory (Lamme). |
  | **Editorializing** | • Phenomenal consciousness is "what is left over."<br>• The Hard Problem is an "insistence on an extra fact."<br>• Science can *only* grip global availability. | **None.** These are philosophical stances (Illusionism/Physicalism) adopted by the speaker, not findings of the theory itself. |

  ### Verdict on the "Left Over" Line
  Your memory is serving you well, but the situation is nuanced.
  *   **Standard Critique:** GWT explains Access, ignores Phenomenal. (Block's view).
  *   **Proponent Defense:** GWT explains Access, and Access *is* Phenomenal. (Dehaene's view).
  *   **The Summary's Claim:** Phenomenal is "what is left over."

  The summary is actually **more aggressive** than the standard proponent defense. It sounds like **Epiphenomenalism** (phenomenality exists but does nothing) or **Eliminativism** (phenomenality is an illusion). Standard GWT proponents usually argue that phenomenality *is* the access, so there is nothing "left over." The summary implies there *is* a remainder, but it's useless. This is a specific philosophical flavor (likely Dennettian) layered on top of the neuroscience.

  **Recommendation:** In your seminar, quote the first two sentences as the theory. Quote the last two sentences as the *philosophical implications drawn by proponents*. Do not present the middle section (the Access/Phenomenal distinction) as a settled resolution; present it as the primary point of contention between GWT and its critics.
