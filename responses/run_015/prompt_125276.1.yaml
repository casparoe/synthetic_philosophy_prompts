      *   **Source Material:** A paragraph summarizing Global Workspace Theory (GWT) and its relation to Access vs. Phenomenal Consciousness, attributed to a cognitive neuroscientist on a podcast.
      *   **Task:** Evaluate the summary sentence-by-sentence. Identify what is accepted, simplified, or rejected by experts (philosophers/neuroscientists of consciousness).
      *   **Specific Concerns:**
          *   Verify the user's suspicion about the "what is left over" line (Access vs. Phenomenal distinction).
