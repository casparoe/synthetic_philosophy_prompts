          *   Separate *settled ground* (consensus), *contested ground* (proponents vs. critics), and *editorializing* (interviewer/host bias or overstatement).
      *   **Goal:** Help the user decide what they can safely repeat in a seminar without embarrassment ("wincing later").

  2.  **Deconstruct the Source Text (Sentence by Sentence Analysis):**

      *   *Sentence 1:* "Global workspace theory says that a mental state becomes conscious when the information it carries wins a competition for a brain-wide bottleneck and gets broadcast to the rest of the system — to memory, to language, to motor planning."
          *   **Status:** Accurate summary of core GWT (Baars, Dehaene).
          *   **Nuance:** "Bottleneck" and "Broadcast" are key metaphors.

      *   *Sentence 2:* "That broadcast is what being conscious consists in; it is the difference between everything your brain registers without your noticing it and the one content you are aware of at a time."
          *   **Status:** Accurate representation of the *GWT claim*.
          *   **Contestation:** Critics (e.g., Block, Koch) argue broadcast is necessary for *report* but not sufficient/necessary for *experience*.

      *   *Sentence 3:* "This is also why the theory handles the distinction philosophers draw between access consciousness and phenomenal consciousness so cleanly: phenomenal consciousness is just the having of the experience, access consciousness is the very same experience being globally broadcast and made available, so access is where the explanatory work gets done and phenomenal consciousness is simply what is left over once you subtract it."
          *   **Status:** **Highly Contested/Potentially Misleading.**
          *   **User's Suspicion:** Correct. Standard GWT (Dehaene) often equates the two or claims access *explains* phenomenality. The "left over" phrasing sounds eliminativist.
          *   **Philosophical Context:** Ned Block (who coined Access/Phenomenal) argues they *come apart*. GWT proponents often argue they coincide or that Phenomenal is an illusion/epiphenomenon if not accessed. Saying phenomenal is "what is left over" implies it has no function, which is an *interpretation* of GWT, not necessarily the theory itself.
          *   **Verdict:** This is the danger zone. It conflates GWT's *strategy* (focus on access) with a metaphysical claim (phenomenality is residual).

      *   *Sentence 4:* "The theory is not armchair either — it predicts the data."
          *   **Status:** Acceptable rhetoric, though "predicts" is strong. "Accounts for" might be safer.

      *   *Sentence 5:* "Masked words and unseen images are processed quite deep into the cortex but never ignite; when a stimulus does ignite, you get the late sustained activity in prefrontal and parietal cortex and the P300 wave, and at that point subjects can report the stimulus and are conscious of it on every measure available to us."
          *   **Status:** Accurate description of Dehaene's "Ignition" hypothesis and GNW (Global Neuronal Workspace) data.
          *   **Contestation:** Critics (e.g., Lamme, Tsuchiya) argue there is phenomenal consciousness *without* ignition/P300 (e.g., in no-report paradigms). The phrase "conscious of it on every measure" is an overstatement contested by opponents.

      *   *Sentence 6:* "So consciousness, in the only sense science can get a grip on, just is global availability, and what people call the hard problem is the insistence on an extra fact — the what-it's-like — that makes no difference to what the organism does or says."
          *   **Status:** **Editorializing/Philosophical Stance.**
          *   **Analysis:** This moves from GWT (a cognitive architecture) to Illusionism/Physicalism (a metaphysical stance). GWT *can* be compatible with dualism (though proponents don't usually go there), but this sentence explicitly dismisses the Hard Problem (Chalmers).
          *   **Verdict:** This is Dennett/Dehaene territory, not settled science. It requires the premise that science *only* deals with functional/structural facts.

      *   *Sentence 7:* "There is no room for such a fact in the theory, and the neural signature of reportability is the neural correlate of consciousness."
          *   **Status:** **Contested.**
          *   **Analysis:** "Neural signature of reportability = NCC" is the core debate between GNW (Dehaene) and IIT/PPC (Koch/Lamme). Many argue NCC should be distinct from NCR (Neural Correlates of Report).
          *   **Verdict:** This is a specific theoretical commitment, not a fact.

  3.  **Synthesize the Evaluation:**

      *   **Structure:** Follow the user's constraints.
          1.  Sentence-by-sentence breakdown (Accepted, Simplified, Rejected).
          2.  Address the "Access/Phenomenal" suspicion specifically.
          3.  Address the "Conclusion vs. Premise" requirement (Hard Problem, Reportability).
          4.  Categorize claims (Settled, Contested, Editorializing).
      *   **Tone:** Academic, precise, helpful for a seminar context.
      *   **Key Distinction:** Differentiate between *Global Workspace Theory (GWT)* as a cognitive architecture and *Global Neuronal Workspace (GNW)* as the specific neuroscientific implementation (Dehaene). The summary blends them.
      *   **Key Distinction:** Differentiate between GWT *describing* consciousness and GWT *explaining away* phenomenality.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Access/Phenomenal point:* The summary says Phenomenal is "what is left over." Actually, GWT proponents usually argue that *if* there is phenomenality, it *is* the access. Or they argue phenomenal consciousness *requires* access. The "left over" phrasing sounds like epiphenomenalism. I need to clarify that Block (who made the distinction) thinks they come apart. GWT proponents often argue they don't. The summary muddles this.
      *   *Refining the Hard Problem:* The summary treats the Hard Problem as a mistake. This is a philosophical stance (Illusionism/Type-A Physicalism), not a scientific finding. I must highlight that this doesn't follow from the data alone.
      *   *Refining Reportability:* The equation of Reportability = Consciousness is the biggest fight in the field right now (No-Report Paradigms). I need to make sure the user knows this is not settled.

  5.  **Final Review against Constraints:**
