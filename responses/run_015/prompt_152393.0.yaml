answer: |-
  Here is the runnable lesson plan, designed for 75 minutes with 14 students.

  ### Strategic Decisions & Rationale

  1.  **The Token Purchase:** I recommend **cutting this**. Ten minutes is too much of your budget for a hedge mechanism that distracts from the core calibration data. The "Split Narrative" (Adversary vs. Machine) does the heavy lifting for disarming the "cheating" objection more effectively than a coin-flip token. Save the time for the debrief.
  2.  **Two-Stage Commitment:** **Keep this, but streamline it.** Do not let them hold onto the first card. Collect the "Red" card before handing out the "Black" card. This prevents them from engineering a sum of 10 to look consistent. It forces the incoherence into the open.
  3.  **Anti-Anchoring:** Strict silence. Cards are collected immediately. No discussion until the board is full.
  4.  **The "Classmate" Story:** To make this credible without actually involving a student, you will tell a specific story about a student from a previous year who is "competing" against the current class. (You do not need to actually have them fill it; you fill both bags identically beforehand. The *belief* is the variable).

  ---

  ### Materials Prep
  *   **Bag A (Opaque):** 5 Red, 5 Black balls. (Sealed/Drawstring closed).
  *   **Bag B (Opaque):** 5 Red, 5 Black balls. (Identical to Bag A).
  *   **Bag C (Transparent):** Empty, clear container.
  *   **Loose Balls:** A box of Red and Black ping-pong balls on your desk.
  *   **Index Cards:** Two distinct colors (e.g., Pink for Red Bet, Blue for Black Bet). 14 sets.
  *   **Whiteboard:** Divided into two columns: "Group A (Adversary)" and "Group B (Machine)."
  *   **Book Token:** Visible on the desk.

  ---

  ### The Script (Minute-by-Minute)

  #### 0:00 – 0:10: Setup & The Split
  **Action:** Place Bag A and Bag B on the table. Stand in the center. Divide the room physically: Left 7 students = Group A. Right 7 students = Group B.

  **Say:** "Last week we concluded that if you are rational, your choices can be modeled as maximizing expected utility relative to a *single* subjective probability measure. Today, we test the 'single measure' part. We are not going to talk about theory yet. We are going to price your uncertainty."

  **The Narrative (Crucial):**
  *   **To Group A:** "Bag A was filled by a student from last year's seminar. They are not here, but they want the book token. They win the token if the majority of Group A loses their hypothetical bets today. They know you are betting. They filled the bag to minimize your success."
  *   **To Group B:** "Bag B was filled by a mechanical randomizer. A computer generated a number between 0 and 10 for red balls. Every composition was equally likely. It is currently sitting in the lab. No human touched it."
  *   **To Everyone:** "In reality, both bags contain 10 balls. In reality, I am not telling you the composition. You do not know what is in either bag. You only know the *story* of how it was filled."

  **Say:** "We will use Bag A for Group A, and Bag B for Group B. The rules are identical. You will not touch the opaque bags. You cannot weigh them. You cannot shake them."

  #### 0:10 – 0:25: Calibration Phase 1 (Red)
  **Action:** Distribute **Pink Cards** to everyone.
  **Board:** Write: *"Bet: I win $100 if a RED ball is drawn."*
  **Board:** Write: *"Transparent Bag: I will fill this with X Red balls (and 10-X Black). You win $100 if RED is drawn from here."*

  **Say:** "On the Pink Card, write your name. Now, answer this: How many Red balls must I put in the Transparent Bag to make you **indifferent** between betting on Red from the Transparent Bag versus betting on Red from your Opaque Bag?
  If you write '5', you are saying the Opaque Bag feels exactly like a 50/50 known risk.
  If you write '6', you are saying the Opaque Bag is worse than a 50/50 risk; you need a bonus in the Transparent Bag to match it.
  Do not talk. Do not look at your neighbors. When you are done, place the card face down."

  **Action:** Walk around with a collection box. Collect all Pink Cards *before* anyone moves to the next step. This prevents them from adjusting Red based on Black.

  #### 0:25 – 0:40: Calibration Phase 2 (Black)
  **Action:** Distribute **Blue Cards**.
  **Board:** Change "RED" to "BLACK" in the text.

  **Say:** "Take a Blue Card. Same question. How many **Black** balls must I put in the Transparent Bag to make you indifferent between betting on Black from the Transparent Bag versus betting on Black from your Opaque Bag?
  You may not look at your Pink Card. You may not change your Pink Card answer. This is a fresh judgment.
  Write your number. Face down."

  **Action:** Collect Blue Cards.

  #### 0:40 – 0:55: The Reveal & Board Work
  **Action:** Take the cards to the board. Do not return them to students yet.
  **Board:** Create a table.
  | Student | Group | Red # (Pink) | Black # (Blue) | Sum |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | A (Adv) | | | |
  | ... | ... | | | |
  | 8 | B (Mach) | | | |

  **Action:** Read the numbers aloud anonymously. "Student 1, Group A: Red 6, Black 6." Fill the board. Calculate the Sum column publicly.

  **Say:** "Look at the Sum column. If you operate with a single probability measure, the number of Red balls you require plus the number of Black balls you require should equal 10. If you think the opaque bag is 50/50, you write 5 and 5. Sum 10. If you think it's 40/60, you write 4 and 6. Sum 10."
  "Count how many sums are exactly 10. Count how many are greater than 10. Count how many are less than 10."

  *(Note: In Ellsberg-style ambiguity aversion, students usually demand *more* balls in the transparent bag to match the opaque bag, e.g., "I need 6 Red in Clear to match Opaque Red" implies Opaque Red < 60%. If they do this for both colors, the numbers sum to >10. Wait, let's re-verify the logic for the script.*
  *Correction for Script Consistency:* If I am ambiguity averse, I prefer the Known (Transparent 5/5) over the Unknown (Opaque) for Red. To make me *indifferent*, I must make the Transparent bag *worse*. So I would say "I am indifferent if Transparent has **4** Red balls." (Because 5 is too good).
  *If they write 4 for Red and 4 for Black, the Sum is 8.*
  *If they write 5 and 5, the Sum is 10.*
  *Most likely outcome for ambiguity averse students: Sums < 10.*
  *Most likely outcome for EUT students: Sums = 10.*
  *Adjust the Board Talk accordingly:* "If your numbers sum to less than 10, you have stated that the Opaque bag is worse than a 40% chance for Red AND worse than a 40% chance for Black. That is mathematically impossible for a single probability measure."

  #### 0:55 – 1:15: The Debrief
  **Action:** Sit down. Put the marker down.

  **Say:** "We are done with the experiment. Now we speak theory."

  **1. The Single Measure Break:**
  "Look at the sums that are not 10. If you have a single subjective probability $P$, then $P(Red) + P(Black)$ must equal 1. Your calibration numbers represent the equivalent known probability. If they don't sum to 10, you do not have a single number in your head. You have a range, or a hesitation, that a single number cannot capture."

  **2. The Cheating Objection (The Split):**
  "Half of you thought a rival student filled the bag. Half thought a machine did. Did the 'Machine' group write 5 and 5? (Check data). If the Machine group also shows sums not equal to 10, then your hesitation is not about 'someone is out to get me.' It is about the *structure of the knowledge itself*. It is not risk. It is not paranoia. It is the absence of a probability."

  **3. The Name:**
  "This is the **Ellsberg Paradox**. The feeling you had, where 50/50 known felt different than 50/50 unknown, is called **Ambiguity Aversion**. Expected Utility Theory cannot model this without breaking the axioms we proved last week."

  ---

  ### Troubleshooting Guide

  **1. The "I Just Assume 50/50" Student**
  *   **Symptom:** They write 5 and 5. They look bored.
  *   **Response:** Do not challenge them during the activity. In the debrief, ask: "Did anyone feel a *tension* writing the second number? Even if you wrote 5, did part of you want to write 6?" If they say no, ask them to look at the class data. "You are in the minority. The theory claims *everyone* should be like you. The data says most people aren't. Why should the theory describe you and ignore them?"

  **2. The "Can I Shake the Bag?" Student**
  *   **Symptom:** Asks to weigh or shake the opaque bag to deduce composition.
  *   **Response:** "The rules of the seminar forbid it. In the real world, sometimes information is strictly unavailable. If you could solve it by shaking, it would be a Risk problem, not an Uncertainty problem. Please play within the constraints."

  **3. The "You Know What's In It" Accusation**
  *   **Symptom:** "Professor, you filled the bags. You know. So it's not unknown."
  *   **Response:** "The exercise is about *your* state of mind, not mine. I could know, I could not know. But *you* do not know. Your decision must be made based on *your* information. If your behavior changes based on whether *you* know, that is what we are measuring. My knowledge is irrelevant to your constraints."

  **4. The "I Won't Gamble" Student**
  *   **Symptom:** Refuses to write a number. "I don't bet."
  *   **Response:** "Write '0'. That is a valid calibration. It means no amount of balls in the transparent bag can match the opaque bag for you. That is an extreme form of the same feeling. Include it in the data."

  **5. The "What if the Bag is Empty?" Question**
  *   **Symptom:** "What if there are no red balls?"
  *   **Response:** "I told you there are 10 balls. They are either Red or Black. The composition is the only unknown."

  **6. The "Leak" (Student claims they know the contents)**
  *   **Symptom:** "I know it's 5 and 5." (Maybe they peeked or guessed).
  *   **Response:** "If you truly knew, you would have written 5 and 5 without hesitation. The fact that you are here asking questions suggests you didn't know *at the moment of writing*. Trust your card, not your hindsight."

  ---

  ### Limitations: What This Activity Cannot Deliver

  You must be frank about these in the final 5 minutes. The activity generates a *phenomenological* contradiction, not a formal proof.

  1.  **Descriptive vs. Normative:** The activity shows that people *violate* EUT (Descriptive). It does not prove they *should* violate it (Normative). A staunch Bayesian might argue, "You should have assigned 50/50 to the machine bag and 50/50 to the adversary bag using the Principle of Indifference. Your numbers are wrong, not the theory." You must acknowledge this: "The data shows we *are* ambiguity averse. Whether we *ought* to be is a philosophical question for next week."
  2.  **The Formal Gap:** The board shows sums $\neq$ 10. This violates Additivity. It does not automatically prove **MaxMin Expected Utility** or **Choquet Expected Utility**. It just breaks the Single Measure Representation. You will need the lecture to build the alternative models (sets of priors, capacities, etc.). The activity clears the ground; it does not build the house.
  3.  **Incentive Compatibility:** Since this is hypothetical money (no budget), some students may not take it seriously. Acknowledge this: "If this were real money, the tension might be higher. But the *pattern* of hesitation usually remains even with hypothetical stakes."

  ### Final Note on the "Token"
  I omitted the raffle token purchase from the script. If you feel you must include it to spend the budget:
  *   **Add at Minute 40:** "Before I tally, you can buy a 'Coin Flip' pass for 1 ticket. If you buy it, I flip a coin to decide if you bet on Opaque or Transparent. You don't choose."
  *   **Why I excluded it:** It turns the session into a market mechanism lesson. The core goal is to feel the *breakdown of the single measure*. The calibration numbers do that directly. The token hedge is a secondary effect of that breakdown. Don't let the secondary effect eat the time needed to discuss the primary effect. Save the token for a raffle at the end of the term for attendance.
