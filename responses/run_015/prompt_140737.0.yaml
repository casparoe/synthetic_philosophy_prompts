prompt: |-
  Last night I spent about three hours arguing with my friend Mara — she's a behavioral ecologist, I'm an ex-field-ornithologist turned data person, so we are both just informed enough to be annoying — about whether basically every apparently wasteful thing an animal (or a person) does is "costly signaling" in the handicap-principle sense. I kept losing ground because whenever I raised a case she'd say "obviously a handicap", and whenever she raised one I'd say "that's just mechanically constrained" or "that's not a signal at all, it's a byproduct", and we were really just trading labels at each other without any shared way of telling the mechanisms apart. What I want from you, acting as someone who knows the signaling / honest-communication literature properly and also has some grip on the philosophy-of-biology side (function, information, what it takes for something to be *about* something), is a decision tree — or a flowchart-style taxonomy, whatever is cleaner — that takes you from the starting point "here is a trait or behaviour that looks wasteful and seems to change how others respond to whoever has it" and sorts it down to the mechanism, if any, that is keeping it honest. Please brainstorm the logical space first and show your working on the ordering of the branches before you start naming leaves, because I suspect half our disagreement was about which question to ask first.

  Build it from the logical space rather than from a list of names: start with the questions and the answer-combinations they allow, then locate the actual positions in that space. No more than six or seven branch questions, eight to ten leaves, and every node phrased as something you could answer about a concrete case without already knowing which leaf it leads to — so no bare nodes like "is the signal costly?", more like "who pays, and do they pay before the receiver responds, in the very act of producing the thing, or later, when someone checks?" The cases I want it calibrated on, and then applied to, are: the peacock's train; stotting in gazelles; a toad whose call pitch is fixed mechanically by body size; a bowerbird whose bower also happens to shelter the female from rain; the 200-page dissertations my old department required that nobody reads past chapter three; and two of my own — on the birding forum I moderate, the rarest-bird posts that get the most cred are the ones where the photo is *terrible*, blurry and hand-held, and the blurrier the more people believe it; and a small desert congregation I read about whose members wear a scratchy wool undershirt all summer that no one else can ever see. The leaves I need to be able to reach are: a strategic-cost handicap in the strict Zahavian sense; a mechanically constrained / index-type signal; a conventional or near-costless signal; honest because signaller and receiver interests already align; honest because receivers punish cheaters or otherwise impose the cost themselves; honest because of receiver psychology rather than signaller cost (sensory bias, amplifier-ish stuff); costly but the cost does no honesty work at all (pure waste, spandrel, whatever you'd call it); and not-a-signal-at-all, just a cue or a byproduct of selection for something else. Give each leaf the standard name if it has one plus one sentence on its most awkward commitment, and please make the "not a signal" and "cost does no work" leaves genuinely reachable rather than rhetorical decoration. Also flag any pair of leaves your tree can't actually separate without data nobody has — I suspect the strict handicap versus the differential-cost version is one, and index versus amplifier might be another — and note any cells of the logical space that come out empty, with your diagnosis of whether nobody is there because it's incoherent, just unattractive, or merely unexplored.

  Then run all seven cases through it and tell me which ones the handicap principle really does explain and which ones get sorted somewhere else, because that's the actual bet Mara and I made. Her side was that the handicap principle is the default explanation for waste and everything else is a special case; mine was that we keep reaching for it in cases where the honesty is doing no explanatory work or the "signal" isn't a signal, which makes the whole thing unfalsifiable. I'd also like to know whether the tree gives any principled reason to prefer one of those framings, or whether they're just two ways of drawing the same boxes. Two practical notes: this is going in front of my undergrad discussion group as well as back to Mara, so keep the node language plain even when the leaves are technical; and please don't bother with citations, references, or a further-reading list — I don't have library access from where I'm writing and I'd probably get the names wrong anyway, so just describe the positions in your own words and I'll go look up the literature myself later.
