answer: |-
  Here is the decision tree, built from the logical space of mechanisms rather than a list of examples, followed by the application to your seven cases and a verdict on the bet.

  ### Part 1: The Logical Space and Decision Tree

  The core disagreement between you and Mara isn't about whether costs exist; it's about *what the costs are doing*. To separate them, we have to ask questions about the relationship between the trait, the sender, the receiver, and the truth.

  Here is the branching logic. Each node is a question you can answer by looking at the mechanics of the specific case, without knowing the final label.

  **Q1. The Receiver Test:** If you magically removed the receiver (or their ability to perceive this trait), would natural selection eventually eliminate the trait?
  *   **No:** The trait exists for reasons other than influencing a receiver (e.g., physiological byproduct, self-maintenance). → **Leaf 1**
  *   **Yes:** The trait is shaped by its effect on a receiver. → **Go to Q2**

  **Q2. The Physics Test:** Could a low-quality individual produce this trait if they had infinite energy and resources, but the same body/physics?
  *   **Yes:** The trait is not physically locked to quality; it can be faked with enough effort. → **Go to Q3**
  *   **No:** The trait is physically impossible to fake (e.g., deep voice requires large vocal cords). → **Leaf 2**

  **Q3. The Interest Test:** If the receiver knew the true quality of the sender, would they still want the sender to send this signal?
  *   **Yes:** Both parties benefit from the same outcome; there is no incentive to lie. → **Leaf 3**
  *   **No:** The sender benefits from lying (or hiding quality), and the receiver benefits from knowing the truth. → **Go to Q4**

  **Q4. The Enforcement Test:** Is the main cost paid *after* the signal is sent, if the receiver discovers the signal was false?
  *   **Yes:** Honesty is kept by the threat of punishment (ostracism, attack, rejection). → **Leaf 4**
  *   **No:** The cost is paid *during* production, regardless of whether the lie is caught. → **Go to Q5**

  **Q5. The Psychology Test:** Does the signal work primarily because it triggers a pre-existing sensory bias in the receiver, rather than proving quality through cost?
  *   **Yes:** The receiver is "tricked" or stimulated by the form, not the cost. → **Leaf 5**
  *   **No:** The receiver is evaluating the cost/effort itself. → **Go to Q6**

  **Q6. The Cost Test:** Is the signal expensive to produce or maintain (energy, risk, time)?
  *   **No:** The signal is effectively free (arbitrary). → **Leaf 6**
  *   **Yes:** The signal requires significant investment. → **Go to Q7**

  **Q7. The Honesty Test:** If you could make this signal cheap to produce, would low-quality individuals flood the system and fake it?
  *   **Yes:** The cost is the *only* thing keeping the signal honest. → **Leaf 7**
  *   **No:** The signal would remain honest even if cheap (e.g., honesty is secured by something else, but cost remains). → **Leaf 8**

  ***

  ### Part 2: The Leaves (Taxonomy)

  Here are the eight outcomes. Each includes the standard name and the "awkward commitment"—the theoretical price you pay for classifying a case here.

  **Leaf 1: Not-a-Signal (Cue / Byproduct)**
  *   **Definition:** The trait provides information, but it did not evolve *to* communicate. It is a side effect of selection for something else.
  *   **Awkward Commitment:** You must argue that the receiver's use of the information is parasitic or incidental, and the sender gains no specific adaptation for being "read."

  **Leaf 2: Index (Mechanically Constrained)**
  *   **Definition:** The signal is honest because it is physically impossible to fake (e.g., frequency scales with size).
  *   **Awkward Commitment:** You must accept that the sender has *no strategic choice*; the signal reveals quality not because the sender wants to, but because physics forces it to.

  **Leaf 3: Common Interest (Interest Alignment)**
  *   **Definition:** The signal is honest because the sender and receiver want the same thing; lying would hurt the sender too.
  *   **Awkward Commitment:** You must assume conflict is absent; this model collapses if there is even a small incentive to exaggerate.

  **Leaf 4: Receiver Punishment (Enforced Honesty)**
  *   **Definition:** The signal is cheap to send, but liars are caught and punished severely by the receiver.
  *   **Awkward Commitment:** You must posit a costly monitoring mechanism on the receiver's side; if checking for lies is too hard, the system fails.

  **Leaf 5: Sensory Bias (Receiver Psychology)**
  *   **Definition:** The signal is honest (or effective) because it exploits a pre-existing quirk in the receiver's nervous system, not because of sender cost.
  *   **Awkward Commitment:** You must explain why the receiver doesn't evolve resistance to the manipulation; often implies the bias is a byproduct of selection for something else.

  **Leaf 6: Conventional (Near-Costless)**
  *   **Definition:** The signal is arbitrary and cheap, kept honest by social agreement or correlation (e.g., language, badges).
  *   **Awkward Commitment:** You must explain why low-quality individuals don't just adopt the convention; usually requires some hidden cost or strict social structure.

  **Leaf 7: Strategic Handicap (Zahavian)**
  *   **Definition:** The signal is honest *because* it is costly; the cost scales such that low-quality individuals cannot afford to fake it.
  *   **Awkward Commitment:** You must accept that waste is functional; the cost is not a bug, it is the feature that guarantees truth.

  **Leaf 8: Costly Waste (Spandrel / Incidental Cost)**
  *   **Definition:** The signal is costly, but the cost does not ensure honesty (honesty is secured by Index or Interest, yet cost remains).
  *   **Awkward Commitment:** You must argue that the cost is evolutionary dead weight; it persists despite doing no work for the signaling system.

  ***

  ### Part 3: Indistinguishability and Empty Cells

  **Indistinguishable Pairs (The "Data Wall"):**
  1.  **Strategic Handicap (Leaf 7) vs. Differential Cost Index (Leaf 2 variant):** In practice, it is incredibly hard to prove whether a trait is physically impossible to fake (Index) or just prohibitively expensive (Handicap). If a small peacock *could* grow a large train but would die trying, is that physics or strategy? You need physiological data on marginal costs that rarely exists.
  2.  **Sensory Bias (Leaf 5) vs. Conventional (Leaf 6):** If a receiver prefers a trait, is it hard-wired (Bias) or learned agreement (Convention)? Without developmental isolation experiments, you often can't tell.

  **Empty Cells (The "Logical Vacuums"):**
  1.  **Costly Common Interest:** If interests truly align (Leaf 3), selection should drive costs down to zero. A "Costly Common Interest" signal is theoretically unstable; why pay for a signal if you both want the same thing? (This makes Leaf 8 rare in this branch).
  2.  **Punishment without Detection:** You cannot have Leaf 4 (Punishment) if the receiver cannot verify the truth. This cell is empty by definition.

