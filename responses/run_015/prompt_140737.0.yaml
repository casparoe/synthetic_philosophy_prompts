  ### Part 4: Running the Cases

  Here is how your seven cases sort through the tree.

  **1. The Peacock's Train**
  *   **Path:** Q1 (Yes, Signal) → Q2 (Yes, a small peacock *could* grow it with enough resources, theoretically) → Q3 (No, Peahen wants good genes, Peacock wants to mate regardless) → Q4 (No, no punishment for lying) → Q5 (No, not just a sensory tickle) → Q6 (Yes, very costly) → Q7 (Yes, if trains were cheap, low-quality males would fake them).
  *   **Leaf:** **Strategic Handicap.**
  *   **Verdict:** Mara is right here. This is the textbook case. The cost *is* the guarantee.

  **2. Stotting in Gazelles**
  *   **Path:** Q1 (Yes) → Q2 (Yes, physically possible to fake) → Q3 (No, Predator wants to eat, Gazelle wants to live) → Q4 (Yes/No boundary). *Analysis:* Does the predator punish the lie by eating them? Yes. But the cost is paid *during* the stott (energy). However, the honesty comes from the fact that only fit gazelles can afford to stott *and* escape.
  *   **Leaf:** **Strategic Handicap** (or potentially **Index** if stotting height is mechanically linked to muscle power).
  *   **Verdict:** Mara wins this one too, but barely. It's a handicap signal to the predator ("I am too fit to catch").

  **3. Toad Call Pitch**
  *   **Path:** Q1 (Yes) → Q2 (No, a small toad *cannot* physically produce a deep frequency regardless of effort).
  *   **Leaf:** **Index.**
  *   **Verdict:** **User wins.** This is not a handicap. It is a physical constraint. Calling it a "handicap" is category error; the toad isn't paying a cost to be honest, it is physically incapable of lying.

  **4. Bowerbird Bower (Shelter Function)**
  *   **Path:** Q1 (Yes) → Q2 (Yes, a bad builder could try) → Q3 (Yes/No). *Analysis:* If the bower shelters the female, she benefits from a good bower, and he benefits from her staying. Their interests on *bower quality* align.
  *   **Leaf:** **Common Interest.**
  *   **Verdict:** **User wins.** The "waste" isn't keeping it honest; the shared benefit of rain protection is. The cost is investment in a shared good, not a handicap to prove quality.

  **5. 200-Page Dissertations**
  *   **Path:** Q1 (Yes, signals competence) → Q2 (Yes, anyone can type) → Q3 (No, Department wants quality, Student wants degree) → Q4 (No, nobody reads it to punish) → Q5 (No) → Q6 (Yes, high time cost) → Q7 (No, if it were 20 pages, would people fake it? Maybe. But *nobody reads past chapter three*. The cost does not ensure honesty because the receiver doesn't verify).
  *   **Leaf:** **Costly Waste.**
  *   **Verdict:** **User wins decisively.** The cost is real, but it does no honesty work because the "receiver" (committee) ignores the data. It is a barrier to entry, not a signal of quality.

  **6. Blurry Bird Photos**
  *   **Path:** Q1 (Yes) → Q2 (No/Yes). *Analysis:* Can a faker make a blurry photo? Yes. But can they make a *convincingly* blurry photo of a rare bird? The blur indicates "hand-held in difficult conditions."
  *   **Leaf:** **Index** (of opportunity) or **Handicap** (sacrificing clarity).
  *   **Decision:** If the blur is a result of the bird's rarity (moving fast, hiding), it's an **Index**. If the photographer *chooses* not to sharpen it to prove they didn't stage it, it's a **Handicap**. Given "blurrier the more people believe," it suggests the blur is an **Index** of authenticity (mechanical constraint of the encounter).
  *   **Verdict:** **User wins.** It's likely an Index of "wildness," not a Handicap. The cost (bad photo) isn't paid to signal; it's a byproduct of the rare encounter.

  **7. Invisible Wool Undershirts**
  *   **Path:** Q1 (No). *Analysis:* If "no one else can ever see" it, there is no biological receiver. It cannot shape receiver behavior directly.
  *   **Leaf:** **Not-a-Signal (Cue/Byproduct).**
  *   **Verdict:** **User wins.** If it changes how others respond, they are responding to a *correlated* cue (e.g., the wearer acts more pious because they are uncomfortable). The shirt itself is a private cost, potentially a **Costly Waste** or self-handicap, but biologically, it is not a signal. Mara's framework breaks here because there is no receiver.

