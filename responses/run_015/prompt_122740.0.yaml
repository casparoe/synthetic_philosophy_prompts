  In a Nova Scotia harbor, two wooden boats float under the same name, both claiming the soul of the *Alder* while denying the other's right to exist. One holds the uninterrupted history of fifty years of races, while the other holds the physical wood of the original hull, yet neither can prove they are the thing they say they are.

  **Where this could go wrong**
  A philosopher will argue I've conflated ontology with semantics, treating a metaphysical problem as a social one. They might say I've ignored mereological nihilism—the idea that wholes never exist at all, only particles arranged boat-wise. They're right, technically. But insisting on that precision kills the story. The villagers aren't arguing about particles; they're arguing about belonging. If I solve for philosophical rigor, I lose the human stakes. I should care only if my simplification leads to a unjust outcome, not if it irritates academics. The goal isn't to define "boat" for the universe, but to explain why two neighbors can't share a name. Oversimplification is a vice in logic, but a virtue in narrative if it clarifies the conflict.
