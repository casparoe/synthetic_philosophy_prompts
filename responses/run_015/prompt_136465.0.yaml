      *   **Key Conflict Point:** The comparison to traditional learning tools (books/teachers). Sam will say AI is just a better textbook. Jordan needs to explain why AI is *different* (too seamless, too personalized, removes the "productive struggle").

  3.  **Drafting - Section by Section:**

