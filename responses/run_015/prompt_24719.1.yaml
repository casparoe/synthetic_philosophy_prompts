answer: |-
  1. **Universal Domain**
     The aggregation rule must accept any logically possible combination of individually consistent judgment sets as input. It cannot exclude profiles simply because they are complex or divergent.
     *Case:* A theory of collective judgment must accommodate the messy reality of democratic disagreement rather than assuming away hard cases by restricting input to only "well-behaved" preferences. If a rule fails when opinions are polarized, it fails when it is needed most.
     **[Status: Non-negotiable]**

  2. **Independence**
     The group's verdict on a given proposition must depend only on how individuals voted on that specific proposition, not on their judgments regarding other propositions.
     *Case:* This prevents manipulation via irrelevant alternatives and ensures fairness across issues; the status of a fact should not hinge on unrelated votes. It treats each proposition as a separate object of democratic decision.
     **[Status: Preference of Formalists / Often Contested]**

  3. **Non-dictatorship**
     There must be no single member whose judgments automatically determine the group's judgments regardless of what others believe.
     *Case:* Collective agency requires that the group verdict emerges from the plurality, not the fiat of one individual. A rule that simply tracks one member is not a theory of *collective* judgment.
     **[Status: Non-negotiable]**

  4. **Unanimity (Pareto Principle)**
     If every individual accepts a proposition, the group must accept that proposition.
     *Case:* Respect for consensus is a minimal requirement of responsiveness. If there is no disagreement, the aggregation rule should not manufacture one.
     **[Status: Non-negotiable]**

  5. **Collective Rationality (Deductive Closure)**
     The set of group judgments must be logically consistent and complete; if the group accepts premises that entail a conclusion, it must accept the conclusion.
     *Case:* The group must act as a rational agent. A body that holds contradictory views cannot coherently justify actions or policies, rendering its judgment functionally useless.
     **[Status: Non-negotiable]**

  ***

  **The Jointly Unsatisfiable Subset**
  The impossibility theorem in judgment aggregation (List & Pettit, 2002) demonstrates that **Universal Domain, Independence, Non-dictatorship, and Collective Rationality** are jointly unsatisfiable. No aggregation rule can satisfy all four conditions simultaneously when the propositions are logically interconnected. While Unanimity is generally satisfiable alongside these, the core tension lies between the democratic desire for issue-by-issue fairness (Independence) and the logical requirement for coherence (Collective Rationality) across all possible profiles (Universal Domain) without yielding to a dictator.

  **The Discursive Dilemma**
  The discursive dilemma is the concrete face of this tension. Consider a three-judge court deciding liability ($r$) based on two premises: a valid contract ($p$) and a breach ($q$), where $r$ is true if and only if $p$ and $q$ are true.
  *   Judge 1 accepts $p$, $q$, and $r$.
  *   Judge 2 accepts $p$, rejects $q$, and rejects $r$.
  *   Judge 3 rejects $p$, accepts $q$, and rejects $r$.
  A majority accepts $p$ (Judges 1 & 2) and a majority accepts $q$ (Judges 1 & 3). Logically, this entails $r$. However, a majority directly rejects $r$ (Judges 2 & 3). If the group follows Independence (voting proposition-by-proposition), it accepts $p$ and $q$ but rejects $r$, violating Collective Rationality (consistency). If it follows Collective Rationality, it must ignore the majority vote on $r$ or the premises, violating Independence or Universal Domain constraints on majority rule.

  **Evaluation of Voting Procedures**
  *   **Premise-based Voting:** The group votes on the premises ($p$ and $q$) and derives the conclusion ($r$) logically. This satisfies **Collective Rationality**, **Universal Domain**, **Non-dictatorship**, and **Unanimity**. However, it violates **Independence**, because the group's judgment on $r$ is determined by votes on $p$ and $q$, not directly by votes on $r$.
  *   **Conclusion-based Voting:** The group votes directly on the conclusion ($r$) and ignores the logical implications of the premises for the final verdict. This satisfies **Independence**, **Universal Domain**, **Non-dictatorship**, and **Unanimity**. However, it violates **Collective Rationality** regarding the full agenda, as the group may end up accepting premises that logically contradict their accepted conclusion (as seen in the dilemma above), failing to act as a coherent rational agent.
