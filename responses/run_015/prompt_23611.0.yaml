          *   Elena's "Tandem" Defense: Strongest point, aligns with Kyburg.
          *   Marcus's "Overstated" Claim: Historically accurate critique of the literature.
      *   *Deep Dive 1: Gerrymandering:* It shows incompleteness, not falsity. The principle is conditional: *Among relevant classes, pick the most specific.*
      *   *Deep Dive 2: Entanglement:* Relevance isn't prior. We determine relevance *via* specificity tests (Salmon's homogeneity).
