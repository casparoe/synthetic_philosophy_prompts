          2.  Is "Relevance" a separate filter or constitutive of the class selection?
          3.  What is the nature of "Specificity" (logical vs. epistemic)?
          4.  What did Kyburg/Reichenbach/Salmon actually say about this?

  3.  **Evaluate Move-by-Move:**

      *   *Elena 1 (Practice):* Right that practitioners do this. But is practice normative? Partially right. It shows utility, not necessarily philosophical sufficiency.
      *   *Marcus 1 (Rigged/Gerrymandering):* Right that logical specificity allows absurd classes. This is the core of the RCP. If specificity is purely logical (subset relation), any individual is a singleton class with frequency 0 or 1. MSRC collapses without a relevance filter.
      *   *Elena 2 (Concession/Relevance Prior):* Partially right. Relevance is necessary. But is it *prior*? This is the crux.
      *   *Marcus 2 (Relevance does the work):* Strong point. If relevance filters out the gerrymandered classes, MSRC only orders the *remaining* valid classes.
      *   *Elena 3 (Tandem/Role):* Right that it's not standalone. But does it do *any* work if relevance is strict? Yes, because multiple relevant classes often exist (e.g., Smoker AND Male vs. Smoker AND Male AND Over 50).
