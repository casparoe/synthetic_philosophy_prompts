          *   Wait, I need to force the "Letter vs Group" question.
          *   Source: △ △ → △ ✕. (Rightmost changed. Heaviest changed).
          *   Target: ○ ○ → ?
          *   If "Change Rightmost": ○ △ (Weight) / ○ ★ (Ring).
          *   If "Change Heaviest Group": △ △ (Weight) / ★ ★ (Ring).
          *   This works.

  4.  **Developing the Payoff Scheme:**

      *   Goal: Reward predicting the *consensus*, not the "truth".
      *   Mechanism: "Market Prediction".
      *   Teams write their answer *and* bet points on how many other teams will agree with them.
      *   Or simpler: "The Consensus Bonus". If your answer matches the modal answer of the class, you get points. If you are unique, you get zero.
      *   *Better:* "The Distribution Bet". Teams submit their answer. Then they guess the % of the class that will give that answer.
      *   *Best for time:* "The Majority Match". You get 1 point for submitting an answer. You get 2 bonus points if your answer is in the Top 2 most common answers. This encourages finding the "obvious" path, highlighting that "obvious" is shared cognition, not logic.
      *   *Refinement based on prompt:* "Rewards teams for predicting the distribution of answers... rather than for being correct."
      *   *Idea:* Each team submits an answer. Then they submit a "Prediction Card": "X% of rooms will say Y".
      *   *Simpler Idea:* **The Schelling Point Game.**
          *   Round 1: Solve.
          *   Round 2: Bet on the Modal Answer.
          *   Score = (Correctness of Solution * 0) + (Accuracy of Prediction * 10).
          *   Wait, if they solve it, they have an answer.
          *   *Revised:* Teams submit their Answer. Then they submit a Prediction: "How many other teams will submit *this specific string*?"
          *   Score: 10 points if your Answer is the Modal Answer. 5 points if your Prediction of the Modal Answer's size is within 10%.
          *   *Actually, the prompt asks to reward predicting distribution.*
          *   *Let's try:* Each team gets 100 chips. Before seeing the problem, they distribute chips across the *possible* answer spaces (defined by the table). After reveal, they score based on how well their chip distribution matched the actual class histogram.
          *   *Too complex for 90 mins.*
          *   *Simplest effective version:* **The Consensus Wager.**
          *   Step 1: Write Answer.
          *   Step 2: Wager points on "My answer is the Class Modal Answer."
          *   Step 3: Tally.
          *   Points awarded only if you matched the Mode.
          *   *Why this works:* It forces them to think "What will everyone else see?" which reveals the shared cognitive biases (the slippages).

  5.  **Mid-Session Perturbation:**

      *   Need to break one ordering.
      *   *Option A:* Remove Weight. Only Ring exists.
      *   *Option B:* Remove Ring. Only Weight exists.
      *   *Decision:* Remove Weight Order. Handout says "Weight Order is suspended. Only Ring Order applies."
      *   *Effect:* Problems involving ★ (no weight successor) become trivial (Ring wraps). Problems involving •/○ divergence become unambiguous (Ring wins).
      *   *Task:* Re-answer Item 2 and 3.
      *   *Observation:* Teams that argued for Weight will have to switch. Teams that argued for "Logic" will realize the logic depended on the available ontology.

  6.  **Closing Round (Build the Trap):**

      *   Teams create a Source-Target pair.
      *   Constraint: Must force a specific slippage (e.g., Ring vs Weight).
      *   Exchange with another team.
      *   Rule: "Answer in the spirit of the Source."

  7.  **Debrief:**

      *   Connect to Hofstadter/Copycat concepts without jargon initially, then name them.
      *   Conceptual Slippage.
      *   Pressure.
      *   Description Levels.

  8.  **Troubleshooting:**

      *   *Spotting the trick:* Acknowledge and recruit them as "observers."
      *   *No Answer:* Validate "No Answer" as a valid answer (resistance to slippage).
      *   *Gimmick:* Emphasize that *all* rules are like this.
      *   *Time:* Keep tallying simple.

