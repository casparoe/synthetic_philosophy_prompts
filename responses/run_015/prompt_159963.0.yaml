  # Seminar Plan: The Slippage Engine (90 Minutes)

  ## 1. Rules, Roles, and Timeline

  **Room Setup:**
  *   5 Tables (Teams of 2–3 students).
  *   Whiteboard for tallying.
  *   **Handout A:** The Domain Sheet (Symbols, Ring Order, Weight Order). No other text.
  *   **Handout B:** Problem Set 1 (3 items).
  *   **Handout C:** Perturbation Card (Distributed mid-session).
  *   **Handout D:** Score Sheet (For the "Distribution Bet").

  **Roles:**
  *   **Instructor:** Timekeeper and Tally Clerk. Do not explain *why*. Only confirm *what* (e.g., "Yes, that string is valid").
  *   **Scribes:** One per team to write final answers.
  *   **Observers:** If a student solves the meta-game early, recruit them as a "Rule Judge" for the Closing Round (see Troubleshooting).

  **Timeline:**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Calibration** | Handout A. Explain symbols and orders only. **Round 1, Item 1** (Trivial). Collect answers. Tally on board. Show 100% agreement. |
  | **10–30** | **The Pressure** | **Round 1, Items 2 & 3** (Divergence & Boundary). Teams submit answers + **Distribution Bet** (predict class mode & %). |
  | **30–40** | **The Reveal** | Tally answers. Calculate scores. **Do not declare a correct answer.** Highlight the clustering. |
  | **40–50** | **Perturbation** | Distribute **Handout C** (Weight Order Suspended). Teams re-answer Items 2 & 3. |
  | **50–65** | **The Trap** | Teams design a Source-Target pair that forces a slippage. Swap with another team. Solve. |
  | **65–90** | **Debrief** | Map activity to concepts (Slippage, Description, Pressure). Final question. |

  ---

  ## 2. Concrete Instance Set

  **Domain Handout (Handout A):**
  *   **Symbols:** • ○ △ ✕ ★
  *   **Ring Order:** • → △ → ✕ → ★ → ○ → • (Cycle)
  *   **Weight Order:** • < ○ < △ < ✕ < ★ (Linear)

  **Problem Set 1 (Handout B):**
  *   **Source Pair (Fixed for all items):** `• △` → `• ✕`
      *   *Transformation:* The rightmost/heaviest symbol changes to its successor.

  | Item | Target Source | The Tension | Candidate Answers & Rationale | Purpose |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | `○ △` → ? | **None.** Ring and Weight successors for △ are both ✕. | **`○ ✕`** (100% agreement expected). | **Calibration.** Establishes the "Successor" rule and commitment. |
  | **2** | `• ○` → ? | **Divergence.** ○ is Rightmost/Heaviest. <br>Weight Succ: △ <br>Ring Succ: ★ | **`• △`** (Weight Logic) <br> **`• ★`** (Ring Logic) | **Separates Ring vs. Weight.** Forces a choice between magnitude and position. |
  | **3** | `• ★` → ? | **Boundary.** ★ is Rightmost/Heaviest. <br>Weight Succ: **None** <br>Ring Succ: ○ | **`• ○`** (Ring Wrap) <br> **`• ★`** (No Change/Blocked) <br> **`?`** (Undefined) | **Separates Logic vs. Ontology.** Tests if "Successor" requires existence or allows wrapping. |

  **Answer Table for Instructor (Tally Sheet):**

  | Item | Description Pair Separated | Predicted Class Mode | Alternative Answers |
  | :--- | :--- | :--- | :--- |
  | **1** | N/A | `○ ✕` | None |
  | **2** | Weight-Successor vs. Ring-Successor | `• △` (Weight bias is common) | `• ★` |
  | **3** | Existence vs. Wrapping | `• ○` (Wrapping is common) | `• ★`, `?` |

  ---

  ## 3. Payoff Scheme: The Distribution Bet

  **Goal:** Reward teams for modeling the *class's* cognition, not for logical correctness. This makes the clustering visible in the score.

  **Mechanism:**
  1.  **Answer Submission:** Teams write their solution string.
  2.  **The Bet:** On the same slip, teams write:
      *   **Predicted Mode:** "The most common answer in this room will be: ______"
      *   **Confidence:** "______% of teams will give this answer."
  3.  **Scoring (Max 20 points per round):**
      *   **10 Points:** If your *Predicted Mode* matches the *Actual Mode* (even if the answer is "wrong").
      *   **10 Points:** If your *Confidence %* is within ±10% of the *Actual %* of teams that gave that answer.
      *   **0 Points:** If you predicted a minority answer.

  **Why this works:** If the class splits 50/50 on Item 2, no one gets the Confidence points. If the class clusters 80/20, teams that predicted the 80% cluster score high. The tally *demonstrates* the structured space of answers without you lecturing about it.

  ---

  ## 4. Mid-Session Perturbation

  **Handout C (The Disruption):**
  > **NOTICE:** The Weight Scale has broken.
  > **New Rule:** Weight Order is suspended. Symbols have no magnitude.
  > **Only the Ring Order remains.**
  > *Re-answer Items 2 and 3.*

  **Effect on Teams:**
  *   **Item 2 (`• ○` → ?):** The divergence vanishes. Ring Successor of ○ is ★. Teams that argued for `• △` (Weight) must slip to `• ★`.
  *   **Item 3 (`• ★` → ?):** The boundary vanishes. Ring Successor of ★ is ○. Teams that wrote `?` or `• ★` must slip to `• ○`.
  *   **Pedagogical Point:** The "Logic" didn't change; the *ontology* did. What was a "hard constraint" (Weight Max) is now gone. This forces them to feel that their previous "truth" was dependent on the available descriptions.

  ---

  ## 5. Closing Round: Build the Trap

  **Task:**
  1.  **Design:** Create a Source-Target pair using the 5 symbols.
  2.  **Constraint:** The transformation must rely on a specific slippage (e.g., Ring vs. Weight, or Single vs. Group).
  3.  **Rule Statement:** Write one sentence describing the rule (e.g., "Increment the heaviest symbol").
  4.  **Swap:** Exchange with another team.
  5.  **Solve:** The receiving team must answer "in the spirit of the rule."

  **Scoring:**
  *   **Trap Points:** If the receiving team gives an answer different from what the designing team intended (due to slippage), the Designers get points.
  *   **Spirit Points:** If the receiving team can argue their answer fits the Rule Statement, they get points.

  **Purpose:** Shifts them from *solvers* to *mechanics*. They must explicitly manipulate the ambiguity they just experienced.

  ---

  ## 6. Debrief Map

  **Do not start with "Analogy."** Start with their experience.

  1.  **The Tally (5 mins):** Point to the board. "In Round 1, Item 2, 80% of you said `• △`. In Round 2, 100% said `• ★`. The logic didn't change. The *world* changed. Your 'correctness' was a function of the available descriptions."
  2.  **Conceptual Slippage (10 mins):** Name the phenomenon. "When you saw `• ○`, you had to decide: does 'successor' mean 'heavier' or 'next in ring'? You couldn't do both. You *slipped* one concept to preserve the other. This is **Conceptual Slippage**."
  3.  **Levels of Description (10 mins):** Refer to the Trap Round. "Some teams wrote 'Change the symbol.' Others wrote 'Change the heaviest.' When the target was `○ ○`, did you change one or both? That is a **Level of Description** problem. Is the object the *letter* or the *run*?"
  4.  **Pressure (10 mins):** "Why did 80% choose Weight in Round 1? Because Weight feels more 'logical' than an arbitrary Ring. That is **Pressure**. Some slips are cheap (Ring to Ring); others feel like cheating (ignoring Weight)."
  5.  **Final Question (5 mins):**
      > "In the Perturbation Round, I took away Weight. If I had instead told you that 'Ring Order is a superstition and only Weight is real,' how many of you would have felt relieved that Item 3 (`• ★`) finally had a definitive 'No Answer'?"
      > *(Wait for hands/nods)*
      > "That relief is the feeling of a cognitive architecture resolving competition. You didn't find the truth; you found the path of least resistance."

  ---

  ## 7. Troubleshooting: What Will Go Wrong

  **1. The "Spotter" (Someone sees the trick in Round 1):**
  *   **Symptom:** A student says, "This is about which rule we pick, right? There's no right answer."
  *   **Fix:** Recruit them. "Exactly. You are now the **Rule Judge** for the Trap Round. Your job is to decide if a team's argument for their answer is valid, regardless of the string." This validates their insight without deflating the room.

  **2. The "Nihilists" (Team concludes there is no answer):**
  *   **Symptom:** Team writes `?` or `NULL` for Item 3.
  *   **Fix:** Validate this in the tally. "This is a valid answer: 'Refusal to Slip.' In the scoring, if `?` is the Mode, predictors of `?` win." This shows that resistance is part of the distribution, not an error.

  **3. The "Gimmick" Objection (Students dismiss the Ring/Weight setup as artificial):**
  *   **Symptom:** "This is just a game. Real rules aren't like this."
  *   **Fix:** Use the Debrief. "In natural language, 'bank' is a river edge or a financial institution. The context determines the slip. This microdomain is just a pressure chamber for what you do every time you understand a metaphor."

  **4. Tally Arithmetic Eats Time:**
  *   **Symptom:** Calculating % and scores takes 20 minutes.
  *   **Fix:** **Pre-print Tally Sheets.** Have teams write answers on sticky notes. Stick them on the board in columns. Count columns visibly. Do the math *while* they start the Perturbation round. Announce scores at the end of class. The *anticipation* of the score is enough to drive the point home.

  ---

  ## 8. Limitations Note (For the Instructor)

  **What this session cannot reproduce:**
  In the classical Copycat architecture (Hofstadter/Mitchell), slips are **subpersonal**. The system does not *choose* to slip from Weight to Ring; the slip emerges from stochastic codelets competing under temperature.

  **Your students are different:**
  *   **Deliberate:** They will consciously debate "Should we use Ring or Weight?"
  *   **Reasoned:** They will give you verbal justifications ("I chose Weight because it's linear").
  *   **Binary:** They may treat the Perturbation as a "Rule Change" rather than a shift in conceptual pressure.

  **How to handle this:**
  In the Debrief, explicitly name this gap. "You just performed slippage *consciously*. In the mind, this happens *pre-consciously*. You felt the tension; the architecture *is* the tension. You gave me reasons; the system gives you an output. The feeling of 'obviousness' you had in Round 1, Item 1? That was the system hiding the work. Today, we broke the system so you could see the gears."
