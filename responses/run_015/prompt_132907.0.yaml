      *   *Splitting Responsibility:*
          1.  *Prevention:* Who could have stopped it? (Mentor/Code Review).
          2.  *Explanation:* Who explains the log? (Programmer).
          3.  *Blame:* Who takes the penalty? (Team Captain/Alliance).
