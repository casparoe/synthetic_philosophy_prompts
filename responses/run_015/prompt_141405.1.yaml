answer: |-
  # The Pragmatic Inference Decision Tree

  **Instructions:** Start at **Node 1** with a concrete instance where a hearer has derived content ($C$) from an utterance ($U$) that goes beyond the bare sentence meaning. Answer **Yes** or **No** based on diagnostic tests you can perform on the example (e.g., trying to deny it, swapping words, checking truth conditions). Follow the arrows to the next node or a final Leaf.

  ### The Nodes

  **Node 1: Speaker Endorsement**
  If you told the speaker, "By saying $U$, you meant $C$," would they accept this as accurate, or would they be puzzled/annoyed and say, "No, I didn't mean that at all"?
  *   **No** (They deny meaning it) → Go to **Node 2**.
  *   **Yes** (They accept it) → Go to **Node 3**.

  **Node 2: Hearer-Specific Knowledge**
  Does deriving $C$ require specific knowledge about *this specific hearer* (e.g., "I know *you* like blue, so I inferred you were talking about the blue shirt") that another random hearer wouldn't have?
  *   **Yes** → **Leaf A: Hearer Over-Inference** (Not Speaker Meaning).
  *   **No** → **Leaf B: World Knowledge/Observation** (True, but not communicated by speaker).

  **Node 3: Truth-Conditional Impact**
  If $C$ turns out to be false, is the utterance $U$ automatically judged as **false** (a lie or mistake), or can $U$ still be considered true despite $C$ being false?
  *   **Yes** ($U$ is false if $C$ is false) → Go to **Node 4**.
  *   **No** ($U$ can be true even if $C$ is false) → Go to **Node 7**.

  **Node 4: Indexical Resolution**
  Is $C$ required simply to fix the reference of a word like *I, you, here, now, that*? (e.g., fixing who "I" refers to).
  *   **Yes** → **Leaf C: What is Said (Indexicals)**.
  *   **No** → Go to **Node 5**.

  **Node 5: Sense Selection**
  Is $C$ required to pick which meaning of an ambiguous word is being used (e.g., *bank* = river vs. money)?
  *   **Yes** → **Leaf D: What is Said (Disambiguation)**.
  *   **No** → Go to **Node 6**.

  **Node 6: Loosening/Metonymy**
  Is $C$ a relaxed or transferred version of the literal meaning (e.g., "The ham sandwich" refers to the person eating it; "empty" means "mostly empty")?
  *   **Yes** → **Leaf E: What is Said (Loosening/Transfer)** *[Contested]*.
  *   **No** → **Leaf F: Entailment/Presupposition** *[See Note 1]*.

  **Node 7: Cancelability**
  Can the speaker explicitly deny $C$ immediately after $U$ (e.g., "$U$, but not $C$") without sounding contradictory or nonsensical?
  *   **No** (Sounds contradictory) → **Leaf G: Non-Cancelable Inference** *[Empty/Problematic]*.
  *   **Yes** (Sounds fine) → Go to **Node 8**.

  **Node 8: Detachability**
  If you replace the key words in $U$ with synonyms that keep the truth conditions the same, does $C$ disappear?
  *   **No** ($C$ stays even with different words) → Go to **Node 9**.
  *   **Yes** ($C$ disappears with different words) → Go to **Node 10**.

  **Node 9: Lexical Trigger**
  Is $C$ triggered by a specific function word (like *but, therefore, even, yet*) rather than the whole act of speaking?
  *   **Yes** → **Leaf H: Conventional Implicature**.
  *   **No** → **Leaf I: Structural/Prosodic Inference** *[Rare/Empty]*.

  **Node 10: Context Dependence**
  Does $C$ arise just from hearing the sentence form (e.g., "Some X are Y"), or do you need to know the specific situation/goals of the speaker to get $C$?
  *   **No** (Arises from sentence form alone) → Go to **Node 11**.
  *   **Yes** (Needs specific situation) → **Leaf J: Particularized Conversational Implicature**.

  **Node 11: Default Status**
  Is $C$ a standard, default inference that happens unless blocked, or is it a calculated guess based on cooperation?
  *   **Yes** (Standard/Default) → **Leaf K: Generalized Conversational Implicature** *[Contested]*.
  *   **No** (Calculated/Ad-hoc) → **Leaf J: Particularized Conversational Implicature** *[See Note 2]*.

  **Node 12: Embedding (Projection)**
  *(Only reached if Node 7 was ambiguous)*: If you put $U$ inside "I doubt that..." or "It's possible that...", does $C$ survive?
  *   **Yes** → **Leaf L: Presupposition** *[Not Implicature]*.
  *   **No** → Return to **Node 8**.

  ---

  ### Worked Examples

  1.  **'Some of the students passed'** (Inference: *Not all passed*)
      *   N1 (Endorsement): **Yes** (Speaker meant to suggest not all).
      *   N3 (Truth-Conditional): **No** (Sentence is true even if all passed).
      *   N7 (Cancelable): **Yes** ("Some, in fact all, passed").
      *   N8 (Detachable): **Yes** (If you say "Not all", the inference changes/vanishes).
      *   N10 (Context): **No** (Arises from "Some" generally).
      *   N11 (Default): **Yes**.
      *   **Result: Leaf K (GCI).**

  2.  **'She's poor but honest'** (Inference: *Contrast between poverty and honesty*)
      *   N1: **Yes**.
      *   N3: **No** (Sentence can be true even if there is no contrast).
      *   N7: **No** ("She's poor and honest, but there's no contrast" sounds weird/contradictory regarding the word *but*). *Wait, test for CI:* Can you deny the contrast? "She's poor but honest, though there's no contrast." It feels contradictory.
      *   *Correction for CI:* CI is often non-cancelable regarding the *word's contribution*, but let's check N8.
      *   N8 (Detachable): **No** (If you swap 'but' for 'and', the contrast inference vanishes).
      *   N9 (Lexical Trigger): **Yes** (Triggered by 'but').
      *   **Result: Leaf H (Conventional Implicature).**

  3.  **'I ate three of the cookies'** (Inference: *Exactly three, not four*)
      *   N1: **Yes**.
      *   N3: **No** (Strictly true if I ate four).
      *   N7: **Yes** ("I ate three, in fact I ate four").
      *   N8: **Yes** (Swap "three" for "at least three", inference goes).
      *   N10: **No** (Standard for number words).
      *   N11: **Yes**.
      *   **Result: Leaf K (GCI).** *[Note: Contested, see below]*

  4.  **'The ham sandwich is getting impatient'** (Inference: *The customer is impatient*)
      *   N1: **Yes**.
      *   N3: **Yes** (If it's literally a sandwich, the sentence is false).
      *   N4/N5: **No** (Not indexical or ambiguous).
      *   N6 (Loosening): **Yes** (Metonymic transfer).
      *   **Result: Leaf E (What is Said - Loosening).** *[Contested]*

  5.  **'The lecture hall was empty'** (Said when 2 people were there) (Inference: *Mostly empty / No audience*)
      *   N1: **Yes**.
      *   N3: **Yes** (If we treat 'empty' loosely, the truth depends on this).
      *   N6 (Loosening): **Yes**.
      *   **Result: Leaf E (What is Said - Loosening).**

  6.  **Reference Letter** ('Perfect attendance, lovely handwriting') (Inference: *Not good at philosophy*)
      *   N1: **Yes**.
      *   N3: **No** (Letter is true even if candidate is a genius).
      *   N7: **Yes** (Can add "and he's also a brilliant philosopher").
      *   N8: **Yes** (Rephrasing loses the sting).
      *   N10: **Yes** (Depends on the context of writing a reference).
      *   **Result: Leaf J (PCI).**

  7.  **Hearer thinks speaker is wearing blue** (When speaker didn't mention clothes)
      *   N1: **No** (Speaker: "I never said anything about my shirt!").
      *   N2: **Yes** (Hearer saw them).
      *   **Result: Leaf A (Hearer Over-Inference).**

  ---

  ### Notes on Contested Ground & Tree Violence

  **1. The "What is Said" Boundary (Leaves C, D, E vs. K)**
  *   **Common Ground:** Indexicals (Leaf C) and Disambiguation (Leaf D) are universally accepted as part of "What is Said" (truth-conditional content).
  *   **Contested:** **Leaf E (Loosening/Metonymy).**
      *   *Contextualists (e.g., Recanati):* Argue loosening ("empty", "ham sandwich") is part of "What is Said" (Leaf E).
      *   *Literalists/Griceans:* Argue the literal meaning is "What is Said" and the loosened meaning is an Implicature (Leaf K or J).
      *   *Tree Violence:* The tree forces you to choose at Node 3 (Truth-Conditions). If you think loosening affects truth, you go Left. If you think it's pragmatic enrichment, you go Right. There is no neutral path.

  **2. The Status of Generalized Implicature (Leaf K vs. J)**
  *   **Common Ground:** Particularized Implicatures (Leaf J) exist (e.g., the Reference Letter).
  *   **Contested:** **Leaf K (GCI).**
      *   *Neo-Griceans (e.g., Levinson):* GCI is a real, distinct level of default inference (Node 11 = Yes).
      *   *Relevance Theorists:* Deny GCI exists. All inferences are particularized (Leaf J) but some are just processed very quickly because the context is always "the default one."
      *   *Tree Violence:* Node 11 forces a binary on what might be a continuum of processing effort. If you are a Relevance Theorist, Leaf K is empty; everything goes to Leaf J.

  **3. Number Words (Leaf K vs. Leaf C)**
  *   **Contested:** Does "three" semantically mean *at least three* (making "exactly three" a GCI, Leaf K) or *exactly three* (making it Leaf C)?
  *   **Tree Path:** The tree assumes the standard Gricean view (At least = Said; Exactly = GCI). If your group adopts the semantic view, the 'Three cookies' example moves to Leaf C.

  **4. Empty/Problematic Leaves**
  *   **Leaf G (Non-Cancelable Inference):** Theoretically empty for conversational implicature. If it's non-cancelable, it's usually an entailment (Leaf F) or Presupposition (Leaf L). If you land here, you likely answered Node 3 incorrectly.
  *   **Leaf I (Structural Inference):** Rare. Usually, if it's detachable (Node 8), it's lexical. This leaf catches prosodic or syntactic implicatures, but they are often folded into PCI.
  *   **Leaf F (Entailment):** Included to catch truth-conditional inferences that aren't indexicals/disambiguation. In a strict Gricean handout, this is often lumped into "What is Said."

  **5. Indistinguishable Leaves**
  *   **Leaf J (PCI) and Leaf K (GCI):** As noted, if your group rejects default inferences, these collapse. The tests (Context Dependence) are gradient. Some "Generalized" inferences require *some* context (e.g., knowing "some" is being used informatively).
  *   **Leaf E (Loosening) and Leaf J (PCI):** Sometimes it is impossible to decide if a loose use ("I'm starving") is part of the truth conditions (Leaf E) or a hyperbolic implicature (Leaf J). The tree forces a choice at Node 3, but intuition often wavers.

  ### How to Use This Handout
  Tell your group: **"This tree is a diagnostic tool, not a map of reality."** It forces binary decisions on phenomena that are often gradient. If an example bounces between two leaves (e.g., Loosening vs. PCI), that isn't a failure of your analysis; it's evidence of a live theoretical dispute. Use the friction points (Nodes 3, 6, 11) to spark discussion about where semantics ends and pragmatics begins.
