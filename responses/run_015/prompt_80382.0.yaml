prompt: |-
  I'm in an epistemology course and the induction unit has me a bit spooked, so I went looking for a plain-English account of Goodman's grue thing. A friend read me a paragraph from a philosophy blog post and then paraphrased the rest, and here's roughly what they said:

  "Goodman's grue argument shows that induction is hopeless. He defines a new color predicate: call an object 'grue' if it is observed before some cutoff date and is green, or if it is observed after the cutoff and is blue. Every emerald we've ever examined has been green, so by induction we expect the next emerald to be green. But every emerald we've ever examined has also been grue, since they were all observed before the cutoff and are green. So the exact same evidence, by the exact same inductive reasoning, supports the prediction that the next emerald will be grue — which, since it'll be observed after the cutoff, means blue. Since grue is a perfectly good predicate, on a par with green, there's no rational basis for preferring one prediction over the other, and this generalizes to show that all inductive hypotheses are underdetermined by the evidence. The upshot is that we can never really justify any inductive inference, so Goodman's point is a devastating critique of the scientific method."

  I sort of follow the setup but I cant tell how much of the punchline is real versus the blogger overreaching. I have a vague feeling the "induction is hopeless" line is doing more work than the setup supports, but I can't actually say why. Is this a fair summary? Can you go through it and tell me which parts an epistemologist working on induction would actually accept, which are subtly off, and which are just wrong — and does the conclusion (that induction is hopeless / arbitrary) follow from the accurate parts, or only because of the misrepresentations? Start with the bottom line in the first sentence, then give the reasoning, no preamble and no restating the question.
