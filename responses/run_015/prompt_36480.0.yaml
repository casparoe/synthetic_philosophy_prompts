prompt: |-
  So I help run a small interdisciplinary seminar -- its sort of a evolution-meets-economics-meets-philosophy thing, third year undergrads, about 16 of them, and I have one 80-minute session to fill on signaling. The theme for the session is basically the handicap principle / costly signaling: the idea that signals are credible *because* they're costly, and that a cheap-to-fake signal is worthless. Peacock tails, stotting gazelles, expensive degrees, long engagement rings, that whole family of ideas.

  I want a game, not a lecture. The dream is that the students discover the core idea themselves before I ever name it. Something like: round one where a signal is free to send, so everyone sends it, and trust in the signal collapses in front of their eyes. Then a second round where the signal costs something, and the cost bites differently depending on who you are (the honest/strong/high type pays less to send it than the low type does, or can afford more of it), and suddenly the signal means something again. And ideally a third condition where the cost is the same for everyone -- pure burned money -- so they can fight about whether that kind of cost is doing real work or is just waste, which is the philosophically juicy part (it gets at the intuition that peacock tails are "wasteful" and whether that waste is load-bearing).

  Constraints and what I need from you:

  - 16ish students, 80 minutes total including debrief, no real money (we use points or tokens or candy, something I can hand out), minimal prep and materials. It has to be runnable by me plus one other TA, and it should work even if a couple students are checked out.
  - Payoff scheme needs to be concrete: actual point numbers, what a high type and a low type each walk away with under each choice, so the incentives are real rather than vibes. Please actually check your own numbers -- trace through what a rational-but-lazy student would do at each decision point and confirm they'd want to play along rather than troll. Trolling is a real risk with this crowd.
  - A timeline, minute by minute, with the rules for each round written out as I'd read them aloud.
  - A debrief that maps specific moments of the game onto the concepts (cheap talk, pooling vs separating, why cost is what anchors credibility), and that finally names the handicap principle and connects it to the biology and the economics. I want them to have the "oh THAT'S why the tail is huge" moment.
  - An honest section on what will predictably go wrong the first time I run it -- students colluding, someone spite-sending signals to break the game, the numbers being confusing, whatever you can foresee -- with fixes.
  - And a frank note on what the game *cannot* reproduce about real costly signaling. My worry is that in the game, the cost structure that makes the signal honest is stipulated by me, the designer -- whereas in nature nobody stipulates it, it's just the equilibrium that got selected. I'd like you to think about whether that gap matters and what I have to supply by talking that the game itself never shows.

  You're basically a game designer who also has a serious background in behavioral ecology and experimental economics -- someone who's run classroom games with real incentives before and knows where they fall apart. Before you commit to a design, brainstorm 2-3 candidate game concepts briefly (signal markets, predator-prey role play, etc.), tell me which one you're picking and why the others are worse, then give me the full design for the winner. Think carefully about the incentive structure at every step -- the whole thing dies if the students don't actually feel the collapse of cheap talk in round one, so that round especially has to be airtight. Don't water it down, and don't hide the hard parts.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Topic:** Costly Signaling / Handicap Principle (Evolution, Economics, Philosophy).
      *   **Audience:** 16 third-year undergrads (interdisciplinary seminar).
      *   **Time:** 80 minutes total (including debrief).
      *   **Format:** Game-based learning (discovery before theory).
      *   **Structure:** Three rounds (Free/Cheap Talk, Costly/Differential Cost, Costly/Uniform Cost).
      *   **Constraints:** No real money (points/candy), minimal prep, runnable by 1 instructor + 1 TA, robust against trolling/collusion.
      *   **Deliverables:**
          1.  Brainstorm 2-3 concepts, pick one.
          2.  Full game design (rules, payoffs, timeline).
          3.  Incentive check (rational actor analysis).
          4.  Debrief guide (mapping game to theory).
          5.  Troubleshooting (what goes wrong).
          6.  Limitations (game vs. reality gap).

  2.  **Brainstorming Game Concepts:**

      *   *Concept 1: The Job Market (Education Signaling).*
          *   Setup: Students are "Workers" (High/Low ability) and "Employers." Workers choose education level. Employers offer wages based on education.
          *   Pros: Intuitive for econ students.
          *   Cons: Hard to simulate "ability" privately without complex testing. Employers might collude. Hard to do 3 rounds quickly with role switching.
      *   *Concept 2: Predator-Prey (Stotting).*
          *   Setup: Some students are Gazelles (High/Low fitness), some are Cheetahs. Gazelles signal fitness. Cheetahs choose to chase.
          *   Pros: Directly maps to biology.
          *   Cons: Logistics of movement in a classroom. Hard to track private information (fitness) without cards. Cheetahs might just chase randomly.
      *   *Concept 3: The "Gift Market" (Dating/Alliance).*
          *   Setup: Pairs form. One is "Sender" (High/Low Quality), one is "Receiver." Sender offers a "Gift" (Signal). Receiver accepts/rejects.
          *   Pros: Simple dyadic interaction. Easy to track points. Maps well to engagement rings/expensive degrees.
          *   Cons: Matching 16 people into 8 pairs leaves some out if odd numbers (can solve with instructor participation).
          *   *Refinement:* Let's make it a "Market for Trust." Everyone is a Sender. The Instructor/TA acts as the Receiver (or a central bank). This reduces coordination noise. Actually, better: Split class into Senders and Receivers, then swap.
          *   *Selected Concept:* **The "Trust Market" (Sender/Receiver).** It's the standard Spence Signaling Model setup but gamified. It allows for clear private information (Type), clear signal choice (Cost), and clear payoff consequences. It fits the 3-round structure perfectly.

      *   *Decision:* I will select a modified **Sender-Receiver Trust Market**.
      *   *Why?* It isolates the variables best. Predator-prey is too chaotic for 80 mins. Job market requires too much math for quick rounds. The Trust Market allows direct manipulation of the cost function ($C_{high}$ vs $C_{low}$) which is the core theoretical lever.

  3.  **Designing the Incentives (The Critical Step):**
      *   *Goal:* Round 1 (Pooling), Round 2 (Separating), Round 3 (Wasteful Cost).
      *   *Types:* High (H) and Low (L). Let's say 50/50 split (8 H, 8 L). Private info.
      *   *Roles:* Senders (S) and Receivers (R). 8 pairs. Swap roles in Round 2? No, keep roles fixed for 3 rounds to see learning, or swap to keep engagement. Let's keep roles fixed for Rounds 1-3 to maintain the "market" feel, then debrief. Actually, swapping ensures everyone feels both sides. Let's do Rounds 1 & 2 as Senders, Round 3 as Receivers? No, the prompt asks for 3 conditions of *signaling*. So everyone needs to signal 3 times.
      *   *Revised Structure:* All 16 are Senders. The "Receiver" is a simulated market (Instructor + TA) OR students pair up.
      *   *Best for Class Size:* Pair them up. 8 Pairs. In each pair, one is Sender, one is Receiver.
      *   *Wait, private info:* If they pair up, they know each other. Bad for signaling.
      *   *Solution:* **Anonymous Market.** All 16 are Senders. The Instructor/TA act as the "Market" (Receiver). This ensures anonymity and control.
      *   *Wait, engagement:* 16 students watching 2 people decide is boring.
      *   *Better Solution:* **Two Markets.** Split class into two groups of 8. Group A are Senders, Group B are Receivers. Then swap.
      *   *Actually, simplest for 80 mins:* **All 16 are Senders.** The "Receiver" is a simple algorithm read by the Instructor. "If Signal > X, I trust." No, that removes the human element.
      *   *Best Compromise:* **8 Senders, 8 Receivers.** Randomly assigned types to Senders (Private). Receivers observe Signal, decide to "Invest" or "Pass."
      *   *Payoffs:*
          *   Sender High (H): Value of Trade = 10. Cost of Signal = 2.
          *   Sender Low (L): Value of Trade = 10. Cost of Signal = 8. (Crucial: Cost must be higher for L).
          *   Receiver: Gain if Trust H = +5. Loss if Trust L = -5. Gain if Pass = 0.
      *   *Round 1 (Cheap Talk):* Signal Cost = 0 for everyone.
      *   *Round 2 (Handicap):* Signal Cost = 2 for H, 8 for L.
      *   *Round 3 (Burned Money):* Signal Cost = 5 for everyone.

      *   *Incentive Check:*
          *   *Round 1:* Cost 0. L sends signal (gets 10-0=10). H sends signal (gets 10-0=10). Receiver sees signal. Knows 50% chance H, 50% L. Expected Value = 0.5(5) + 0.5(-5) = 0. Receiver is indifferent. If Receiver is skeptical, they Pass. Sender gets 0. *Risk:* Receiver might trust blindly. *Fix:* Make Receiver loss bigger. Loss if Trust L = -10. Exp Value = 0.5(5) + 0.5(-10) = -2.5. Receiver should Pass. Sender gets 0. Signal collapses.
          *   *Round 2:* Cost H=2, L=8. Value=10.
              *   H sends: 10-2 = 8. H doesn't send: 0. (Send).
              *   L sends: 10-8 = 2. L doesn't send: 0. (Send? Wait, 2 > 0).
              *   *Problem:* If L sends, pooling returns. Need L to *not* send.
              *   *Fix:* Make Cost for L > Value. Cost L = 12.
              *   L sends: 10-12 = -2. L doesn't send: 0. (Don't Send).
              *   H sends: 10-2 = 8. (Send).
              *   Receiver sees Signal -> Knows it's H. Trusts. Payoff +5.
              *   Receiver sees No Signal -> Knows it's L. Passes. Payoff 0.
              *   *Equilibrium:* Separating.
          *   *Round 3:* Cost = 5 for both.
              *   H sends: 10-5 = 5.
              *   L sends: 10-5 = 5.
              *   Both send. Pooling. Receiver Exp Value = -2.5 (using previous numbers). Receiver Passes.
              *   *Wait, the prompt wants Round 3 to be "Pure Burned Money" where they fight about waste.*
              *   If Cost is same, it's just Cheap Talk again (Pool).
              *   *Alternative Round 3:* Make Cost high but equal. Say Cost = 6.
              *   H: 10-6 = 4. L: 10-6 = 4. Both send. Pooling.
              *   *Philosophical Point:* If cost is equal, it doesn't separate. It's just waste.
              *   *Wait, I need Round 3 to show that uniform cost doesn't solve the information asymmetry.*
              *   Okay, Round 3: Cost = 5 for Both.
              *   H Net: 5. L Net: 5.
              *   Both Signal. Receiver knows nothing new. Receiver Passes (because risk of L is too high).
              *   Result: Everyone burns 5 points to get 0 return. Total waste.
              *   *Debrief:* This shows why *differential* cost matters, not just cost.

      *   *Refining the Numbers for "Troll-Proofing":*
          *   Need to ensure Receivers actually learn.
          *   Need to ensure Senders feel the pain.
          *   Currency: "Lab Dollars" redeemable for candy/prizes at end.
          *   Endowment: Everyone starts with 20 points.
          *   Sender Payoff: Base 0. If Trade happens: +15. Minus Signal Cost.
          *   Receiver Payoff: If Trade with H: +10. If Trade with L: -10. If No Trade: 0.
          *   Round 1 (Cheap): Cost = 0.
              *   L sends (Cost 0). H sends (Cost 0).
              *   Receiver sees Signal. Prob(H) = 0.5. Exp Payoff = 0.5(10) + 0.5(-10) = 0.
              *   Receiver Indifferent. Let's make Loss -15. Exp Payoff = -2.5. Receiver Passes.
              *   Senders get 0. Signal worthless.
          *   Round 2 (Handicap): Cost H = 2. Cost L = 12.
              *   H Send: 15 - 2 = 13. H No Send: 0. (Send).
              *   L Send: 15 - 12 = 3. L No Send: 0. (Send? 3 > 0).
              *   *CRITICAL FIX:* L must prefer NOT to send. Cost L must be > 15. Say Cost L = 16.
              *   L Send: 15 - 16 = -1. L No Send: 0. (No Send).
              *   H Send: 15 - 2 = 13. (Send).
              *   Receiver sees Signal -> Must be H. Trust. Payoff +10.
              *   Receiver sees No Signal -> Must be L. Pass. Payoff 0.
              *   Outcome: H gets 13. L gets 0. Receiver gets 10 (on H matches).
          *   Round 3 (Waste): Cost H = 8. Cost L = 8.
              *   H Send: 15 - 8 = 7.
              *   L Send: 15 - 8 = 7.
              *   Both Send. Pooling.
              *   Receiver Exp Payoff = -2.5 (Same as Round 1). Receiver Passes.
              *   Senders lose 8 points each. Total destruction of value.

      *   *Wait, one logistical issue:* If Receivers always Pass in Round 1 and 3, Senders lose points in Round 3. Students hate losing points.
      *   *Mitigation:* Give a show-up fee (20 points). Losses come out of that. Gains add to it.
      *   *Troll Risk:* A Low Type in Round 2 might spite-send (take the -1 loss) just to trick the Receiver.
      *   *Fix:* Make the loss for L sending bigger. Cost L = 20. Net = -5. Rational actors won't do it. Spite actors might. Debrief should address this ("In biology, genes that do this die out").

  4.  **Drafting the Timeline:**
      *   0-10: Setup & Endowment.
      *   10-25: Round 1 (Cheap Talk).
      *   25-40: Round 2 (Handicap).
      *   40-55: Round 3 (Uniform Cost).
      *   55-80: Debrief.
      *   *Wait, need to swap roles?* 80 mins is tight. If I swap roles, I need 6 rounds (3 per role). Too long.
      *   *Decision:* Keep roles fixed. 8 Senders, 8 Receivers. It's enough data. Or, make everyone a Sender, and the "Receiver" is a fixed rule sheet (e.g., "I will buy if Signal >= X").
      *   *Better:* **All 16 are Senders.** The Instructor is the *only* Receiver.
      *   *Why?* Removes Receiver variability. Ensures the "Market Response" is consistent. Allows me to control the "Trust" threshold dynamically if needed to teach.
      *   *Wait, if I am the Receiver, it's me vs 16.* They might gang up.
      *   *Okay, stick to 8 Senders, 8 Receivers.* It creates a "Market."
      *   *Matching:* Random pairing each round? Or fixed? Random is better to prevent reputation effects.
      *   *Timeline Check:* 15 mins per round is generous. 10 mins is tighter but doable.
      *   0-5: Intro/Endowment.
      *   5-20: R1.
      *   20-35: R2.
      *   35-50: R3.
      *   50-80: Debrief.
      *   *Wait, need to explain rules clearly.* 5 mins intro is tight.
      *   *Revised:* 10 Intro, 15 per round (45), 25 Debrief. Total 80. Perfect.

  5.  **Addressing the "Gap" (Game vs. Nature):**
      *   In the game, I *tell* them the costs. In nature, costs are physical constraints (metabolism, predation risk).
      *   In the game, they are rational calculators. In nature, it's evolutionary stability (ESS).
      *   Need to emphasize this in the "Limitations" section.

  6.  **Refining the "Troll" Proofing:**
      *   What if a Receiver trusts in Round 1 anyway?
      *   Instruction: "You are profit maximizers."
      *   If they trust, the Market crashes (L types exploit it).
      *   I need to ensure the Payoff Matrix makes Trust in Round 1 *mathematically* irrational.
      *   Exp Value = -2.5. Rational = Pass.
      *   What if a Low Type sends in Round 2?
      *   Cost = 20. Payoff = -5.
      *   Instruction: "You keep your points. Negative points mean you owe candy." (Don't actually make them owe, but the threat works).
      *   Better: "Lowest score gets no candy." Competition helps.

  7.  **Final Review of the Plan:**
      *   **Concept:** Sender-Receiver Market.
      *   **Rounds:** 1 (Free), 2 (Differential Cost), 3 (Uniform Cost).
      *   **Payoffs:** Checked.
      *   **Materials:** Index cards (Types), Paper (Signals), Candy (Payoffs).
      *   **Debrief:** Connects to Peacocks, Degrees, Rings.
      *   **Limitations:** Stipulated costs vs. Emergent costs.

  8.  **Writing the Response:**
      *   Tone: Professional, experienced, practical.
      *   Structure: As requested (Brainstorm -> Selection -> Design -> Incentives -> Timeline -> Debrief -> Troubleshooting -> Limitations).
      *   *Self-Correction on Round 3:* The prompt asks for Round 3 to be "cost is the same for everyone... fight about whether that kind of cost is doing real work."
      *   If Cost is same, it's pooling. Signal is worthless.
      *   The "fight" comes from: "But I burned money! Why didn't you trust me?" "Because a liar would also burn that money."
      *   This perfectly illustrates that *cost alone* isn't enough; *differential* cost is key.

      *   *One detail:* 16 students. 8 Senders, 8 Receivers.
      *   What if 16 isn't divisible? (It is).
      *   What if someone is absent? (Have a backup plan: Instructor steps in as Sender).

      *   *Incentive Check Re-Run:*
          *   Endowment: 20.
          *   R1: Cost 0. Trade Value 15.
          *   L sends. H sends. Receiver Exp Value (Trust) = 0.5(10) + 0.5(-15) = -2.5. (Changed Loss to -15 to make it clearer).
          *   Receiver Passes. Senders get 0.
          *   R2: Cost H=2, L=20.
          *   H Send Net: 13. L Send Net: -5.
          *   H Sends. L Doesn't.
          *   Receiver sees Signal -> H. Trusts. (+10).
          *   Receiver sees No Signal -> L. Passes. (0).
          *   R3: Cost H=8, L=8.
          *   H Send Net: 7. L Send Net: 7.
          *   Both Send.
          *   Receiver Exp Value (Trust) = -2.5. Passes.
          *   Senders lose 8. Endowment 12.
          *   *Risk:* Senders might refuse to play R3 if they know they lose.
          *   *Fix:* Frame R3 as "New Market Regulation." They *must* submit a signal. (Mandatory signaling). This forces the waste.

      *   *Wait, Mandatory Signaling?*
      *   If I force them to signal, they feel the waste.
      *   If I let them choose, they might coordinate on "Don't Signal."
      *   Prompt says: "Third condition where the cost is the same... fight about whether that kind of cost is doing real work."
      *   If they choose *not* to signal, there is no cost.
      *   So, in Round 3, make Signaling **Mandatory**. "New Rule: All Senders must submit a certificate."
      *   This guarantees the waste happens.

      *   *Okay, ready to write.*
answer: |-
  ### Part 1: Concept Selection

  Here are three candidate concepts for the session:

  1.  **The Job Market (Spence Model):** Students are "Workers" (High/Low ability) choosing education levels, and "Firms" offering wages.
      *   *Verdict:* **Reject.** Too much arithmetic for a quick round. Students get bogged down calculating expected wages rather than feeling the signaling dynamic. Requires complex role-switching to keep engagement high.
  2.  **Predator-Prey (Stotting):** Some students are Gazelles (fit/unfit), some are Cheetahs. Gazelles "stott" (jump) to signal fitness.
      *   *Verdict:* **Reject.** Logistically noisy. Hard to keep private information private in a classroom. Cheetahs tend to chase randomly for fun, breaking the economic incentives.
  3.  **The Trust Market (Sender-Receiver):** Pairs form. Senders have a private "Quality" type. They choose whether to send a costly signal. Receivers choose whether to "Invest."
      *   *Verdict:* **Select.** This is the cleanest mapping to the theory. It isolates the cost function as the only variable between rounds. It creates immediate, tangible stakes (points/candy) and allows for a clear "market crash" in Round 1 and a "waste" scenario in Round 3.

  **Why this design wins:** It minimizes coordination noise. By fixing the payoffs and making the cost structure the *only* thing that changes, the students cannot blame the rules for the outcome—they have to blame the incentives.

  ---

  ### Part 2: Game Design & Incentive Structure

  **Title:** The Certificate Market
  **Players:** 16 Students (8 Senders, 8 Receivers).
  **Currency:** "Lab Points" (LP). 10 LP = 1 piece of candy/prize at the end.
  **Materials:**
  *   8 Envelopes marked "High Type" (contains card saying **H**).
  *   8 Envelopes marked "Low Type" (contains card saying **L**).
  *   Signal Slips (small paper squares) for Senders.
  *   Decision Slips (Invest / Pass) for Receivers.
  *   Whiteboard for tracking aggregate results.

  **The Core Payoff Matrix (Crucial):**
  *   **Sender Payoff:**
      *   If Trade Occurs: **+15 LP** (Base Value) minus **Signal Cost**.
      *   If No Trade: **0 LP** minus **Signal Cost**.
  *   **Receiver Payoff:**
      *   If Invest in **H**: **+10 LP**.
      *   If Invest in **L**: **-15 LP** (Loss).
      *   If Pass (No Trade): **0 LP**.
  *   **Endowment:** Every student starts with **20 LP**. (This buffers losses so no one ends negative, but they feel the pain).

  **Rational Actor Check (The "Troll-Proof" Math):**
  *   **Round 1 (Cheap Talk):** Cost = 0 for everyone.
      *   Sender: Always Signal (Cost 0, Potential Gain 15).
      *   Receiver: Sees Signal. Knows 50% chance H, 50% L.
      *   Receiver Exp. Value: $0.5(10) + 0.5(-15) = -2.5$.
      *   *Result:* Rational Receiver **Passes**. Market collapses. Signal is worthless.
  *   **Round 2 (Handicap):** Cost H = 2 LP. Cost L = 20 LP.
      *   **H Sender:** Signal Cost 2. Net if Trade = 13. Net if No Trade = -2. **Strategy: Signal.**
      *   **L Sender:** Signal Cost 20. Net if Trade = -5. Net if No Trade = 0. **Strategy: Do Not Signal.**
      *   **Receiver:** Sees Signal -> Must be H. **Invest.** Sees No Signal -> Must be L. **Pass.**
      *   *Result:* Separating Equilibrium. Trust is restored.
  *   **Round 3 (Waste):** Cost H = 8 LP. Cost L = 8 LP. **Signal is Mandatory.**
      *   **H Sender:** Cost 8. Net if Trade = 7.
      *   **L Sender:** Cost 8. Net if Trade = 7.
      *   **Both:** Signal (Forced).
      *   **Receiver:** Sees Signal. Still 50/50 chance. Exp. Value = -2.5. **Pass.**
      *   *Result:* Pooling Equilibrium. Everyone burns 8 LP for zero return. Total value destruction.

  ---

  ### Part 3: Timeline & Rules (80 Minutes)

  **00:00 – 00:10: Setup & Endowment**
  *   **Action:** Hand out 20 LP (paper tokens or tally on sheet) to everyone.
  *   **Action:** Randomly assign roles. 8 Senders sit on Left, 8 Receivers on Right.
  *   **Action:** Hand Senders their Type Envelope (H or L). **Emphasize:** "This is private. Do not show anyone. Not even your partner."
  *   **Script:** "You are in a market. Senders have a product quality (H or L). Receivers want to buy, but only from H. Buying L is a disaster. Senders can send a 'Certificate' (signal). Receivers decide to Invest or Pass. Your goal is to maximize your LP."

  **00:10 – 00:25: Round 1 (The Collapse of Cheap Talk)**
  *   **Rule:** "Certificates are free. Anyone can print as many as they want. Cost = 0."
  *   **Action:** Senders write "Yes" or "No" on Signal Slip. Pass to Receiver.
  *   **Action:** Receivers decide Invest/Pass.
  *   **Action:** Reveal Types. Calculate Payoffs. Write Aggregate on Board (e.g., "6 Trades, 4 Crashes").
  *   **Expected Outcome:** Everyone signals. Receivers get burned by L types. Receivers stop trusting.
  *   **Instructor Note:** If a Receiver trusts, let them lose the points. The pain is the lesson.

  **00:25 – 00:40: Round 2 (The Handicap)**
  *   **Rule:** "New Market Regulation. Certificates now cost money. High Types: Cost is 2 LP. Low Types: Cost is 20 LP." (Write on board).
  *   **Action:** Senders decide to Signal or Not. (If Signal, deduct cost immediately).
  *   **Action:** Receivers decide Invest/Pass.
  *   **Action:** Reveal Types. Calculate Payoffs.
  *   **Expected Outcome:** H types signal. L types stay silent. Receivers trust signals.
  *   **Instructor Note:** Watch for L types trying to bluff. If they do, they lose massive points. Highlight this publicly.

  **00:40 – 00:55: Round 3 (The Waste)**
  *   **Rule:** "New Regulation. All Senders MUST submit a Certificate. Cost is 8 LP for everyone, regardless of Type."
  *   **Action:** Deduct 8 LP from all Senders immediately.
  *   **Action:** Senders submit Certificate (Formality).
  *   **Action:** Receivers decide Invest/Pass.
  *   **Action:** Reveal Types. Calculate Payoffs.
  *   **Expected Outcome:** Everyone signals. Receivers still Pass (because signal conveys no info). Senders are down 8 LP with nothing to show.
  *   **Instructor Note:** This will feel frustrating. Good. That frustration is the philosophical hook.

  **00:55 – 01:20: Debrief & Theory**
  *   (See Part 4 below).

  ---

  ### Part 4: Debrief Guide (Mapping Game to Theory)

  Do not lecture immediately. Ask questions to draw the theory out of them.

  **1. The Round 1 Crash (Cheap Talk)**
  *   *Ask Receivers:* "Round 1, why did you stop trusting the signal?"
  *   *Target Answer:* "Because the Liars (L) could send it just as easily as the Truth-tellers (H)."
  *   *Concept:* **Pooling Equilibrium.** When cost is zero, information is zero.
  *   *Connect:* "This is 'Cheap Talk' in economics. A resume claim that costs nothing to write ('I'm a hard worker') is worthless."

  **2. The Round 2 Recovery (Handicap)**
  *   *Ask Low Types:* "Why didn't you send the signal in Round 2?"
  *   *Target Answer:* "It cost too much. I would have lost points even if I got the trade."
  *   *Ask High Types:* "Why was it okay for you?"
  *   *Target Answer:* "The cost was low enough that the profit covered it."
  *   *Concept:* **Separating Equilibrium.** The signal works *because* it is costly, and *because* the cost is harder for the Low Type to bear.
  *   *Connect:* **The Handicap Principle (Zahavi).** Peacock tails. A weak bird cannot afford a huge tail (predation risk/energy). A strong bird can. The tail is honest *because* it is a burden.
  *   *Connect:* **Human Signaling.** University degrees. A degree is hard. If it were easy (online click-through), it would signal less. The difficulty *is* the signal.

  **3. The Round 3 Frustration (Waste)**
  *   *Ask Senders:* "How did you feel burning 8 points to get nothing?"
  *   *Ask Receivers:* "Why didn't the mandatory certificate make you trust them?"
  *   *Target Answer:* "Because the Liars had to buy it too. It didn't separate them."
  *   *Concept:* **Cost is not enough; Differential Cost is key.**
  *   *Philosophical Hook:* "Is the peacock's tail wasteful?" Yes. "Is that waste necessary?" Yes, if the cost is uniform, it doesn't signal quality. The waste is **load-bearing**.
  *   *Connect:* **Engagement Rings.** Why spend 3 months' salary? If everyone spent $50, it signals nothing. The pain of the cost proves the commitment.

  **4. Naming the Theory**
  *   Now write **THE HANDICAP PRINCIPLE** on the board.
  *   Define: "Signals are credible *because* they are costly, and specifically because they are *differentially* costly."

  ---

  ### Part 5: Troubleshooting (What Will Go Wrong)

  **1. The "Spite" Low Type (Round 2)**
  *   *Risk:* A Low Type student decides to burn 20 points just to trick the Receiver, even though it's irrational.
  *   *Fix:* Pre-empt this in instructions. "You are profit maximizers. Negative points reduce your prize tier." If it happens, use it in debrief: "In biology, genes that do this go extinct. In classrooms, students do it for fun. But look at their score—they lost. The market punished them."

  **2. Receiver Collusion (Round 1)**
  *   *Risk:* Receivers agree to "Trust everyone" to be nice.
  *   *Fix:* Keep Receivers anonymous from each other. They write decisions on private slips. If they still trust, let the L-types exploit them. The resulting loss (-15 LP) is a powerful teaching moment. "Nice guys finish last in signaling games."

  **3. Confusion on Costs**
  *   *Risk:* Students forget the costs between rounds.
  *   *Fix:* Keep the Cost Rules projected on the screen or written largely on the whiteboard throughout the session. Do not erase between rounds.

  **4. The "Mandatory" Round 3 Revolt**
  *   *Risk:* Senders refuse to pay the 8 LP cost.
  *   *Fix:* Frame it as a "Tax." "The government requires all sellers to file this form. It costs 8 LP. Pay it now." Collect the tokens physically before they make decisions.

  ---

  ### Part 6: Limitations (The Gap Between Game & Nature)

  You must address this to satisfy the interdisciplinary nature of the seminar. The game has a "Designer God" (you); nature does not.

  **1. Stipulated vs. Emergent Costs**
  *   *In Game:* You *told* them Low Types pay 20 and High Types pay 2. You stipulated the honesty.
  *   *In Nature:* No one sets the price. A peacock's tail is costly because of *physics and physiology* (metabolism, predation).
  *   *The Bridge:* Explain that in evolution, strategies that bluff (Low Types paying low cost) get found out and die. The cost structure *emerges* because the bluffers are removed from the gene pool. The game skips the selection process and jumps to the equilibrium.

  **2. Rationality vs. Instinct**
  *   *In Game:* Students calculate LP.
  *   *In Nature:* Animals don't calculate. They follow instincts that *were* selected for calculation-like outcomes.
  *   *The Bridge:* "We model animals *as if* they are rational economists, but the mechanism is natural selection, not brainpower."

  **3. The "Waste" Question**
  *   *In Game:* Round 3 waste felt pointless.
  *   *In Nature:* Is the tail *really* waste?
  *   *The Bridge:* Mention the counter-theory (Fisherian Runaway). Maybe the tail isn't about survival cost, but about aesthetic preference. The game models Zahavi's Handicap, but not necessarily Fisher's Runaway. This opens the philosophical floor: "Is signaling always about truth, or sometimes about manipulation?"

  **Final Instructor Note:**
  The success of this session hinges on the **payoff pain**. If Round 1 doesn't crash, or Round 3 doesn't feel wasteful, the theory won't stick. Do not soften the blow. Let them lose the points. The frustration *is* the data.
