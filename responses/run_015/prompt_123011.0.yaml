answer: |-
  ### (i) Consent Undermining Scores (0–100)

  | Case | Description | Test A (Counterfactual) | Test B (Identity) |
  | :--- | :--- | :---: | :---: |
  | 1 | Surgeon Swap | 70 | 50 |
  | 2 | Metallic Taste | 10 | 5 |
  | 3 | Horse Meat | 50 | 95 |
  | 4 | Psych Deception | 60 | 80 |
  | 5 | Violent Content | 80 | 90 |
  | 6 | Supervisor Sex | 95 | 30 |
  | 7 | Dementia | 40 | 10 |
  | 8 | Fasting Donor | 30 | 10 |

  *Note on Tightening:* For Case 8, I am interpreting "alert enough" as meeting the *minimum* screening threshold, but the subsequent fainting confirms a physiological compromise (hypoglycemia/fatigue) that retroactively indicates diminished capacity at the moment of signing, justifying the non-zero scores. For Case 3, "no ethical rule" is interpreted as the diner having no *conscious* objection, but the deception itself violates the specific culinary identity agreed to.

  ### (ii) Ordering by Overall Invalidity

  1.  **Case 5 (Violent Content):** Avg 85 (Gap 10) — Both tests score high because the job's psychological nature was concealed, changing the transaction and ensuring refusal.
  2.  **Case 3 (Horse Meat):** Avg 72.5 (Gap 45) — Test B is near-max because the species identity is wrong, even if Test A is moderate due to lack of ethical objection.
  3.  **Case 4 (Psych Deception):** Avg 70 (Gap 20) — The hidden purpose fundamentally alters the nature of the research transaction (Test B) and would deter many participants (Test A).
  4.  **Case 6 (Supervisor Sex):** Avg 62.5 (Gap 65) — Test A is near-max due to structural coercion, but Test B is low because the physical act matched the description.
  5.  **Case 1 (Surgeon Swap):** Avg 60 (Gap 20) — Patients often care who cuts them (Test A), but the medical procedure itself remains identity-consistent (Test B).
  6.  **Case 7 (Dementia):** Avg 25 (Gap 30) — Retention failure undermines stable choice (Test A), but the procedure performed is exactly as described (Test B).
  7.  **Case 8 (Fasting Donor):** Avg 20 (Gap 20) — Physiological stress slightly compromises capacity (Test A), but the donation act is unchanged (Test B).
  8.  **Case 2 (Metallic Taste):** Avg 7.5 (Gap 5) — The patient admitted she would have consented, and the side effect is trivial to the transaction's identity.

  ### (iii) The Void Cut-off

  **Cut-off Score:** 61
  **Void Cases:** 5 (Violent Content), 3 (Horse Meat), 4 (Psych Deception), 6 (Supervisor Sex).
