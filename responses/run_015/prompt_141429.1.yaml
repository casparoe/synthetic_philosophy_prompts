answer: |-
  Good evening. For those who don't know me, I'm the Maid of Honor and the bride's sister.

  Looking around the room, I see a distinct split. About half of you are family who think "neural network" is a type of garden trellis. The other half are colleagues who probably noticed the seating chart was optimized for gradient flow.

  This divide is appropriate, because it mirrors the couple standing here.

  They met four years ago at a conference, at 1 AM, in front of a whiteboard. Most couples meet and talk about movies, or where they want to live. [Bride] and [Groom] started arguing about the metaphysics of machine intelligence. Specifically, they argued about whether the patterns a model finds are *real things* waiting to be discovered, or just *useful tools* we invent to make sense of the noise.

  For those of you checking your phones: She believes love is something you find, like a mountain. He believes love is something you build, like a bridge.

  They have been having this argument every day for four years. Neither has moved an inch.

  Now, usually, when two people disagree fundamentally about the nature of reality, you expect them to drift apart. In their field, if two researchers can't agree on what their data *means*, they stop collaborating. But [Bride] and [Groom] did the opposite. They doubled down.

  And this is where I, as the sister, have to be careful. If I say, "They found their soulmate," I'm taking her side. If I say, "They constructed a highly compatible partnership," I'm taking his. And if I say, "Maybe it's a little bit of both," their old advisor at table four will nod sagely, and they will both spend the rest of the night silently furious at me.

  So, I'm not going to talk about what their love *is*. I'm going to talk about what their love *does*.

  In their work, they look for signals that persist even when you change the conditions. You train a system one way, then you train it again from scratch with different random starting points. If you find the same pattern emerging in both, you pay attention. You call that **invariance**. You call that a signal that isn't just noise.

  I have watched this couple for four years. I have watched them start from different places. I have watched them approach problems with different tools. I have watched them disagree about the fundamental nature of the universe.

  And through all of that, through the stress of jobs, and moving, and planning this wedding, one thing has remained invariant.

  They are still standing on the same side of the whiteboard.

  She still looks at him and sees something real that she was always meant to discover. He still looks at her and sees the most effective way to steer his life toward the good.

  They don't need to agree on *why* the bridge holds up for the bridge to get them across the river.

  There is a temptation, when giving a toast, to try to resolve the tension. To say, "Love is the answer." But anyone who knows them knows that the tension *is* the point. She keeps him honest about what's real. He keeps her honest about what works. She prevents him from becoming a cynic. He prevents her from becoming a dogmatist.

  They are a system that corrects itself.

  So, I am not going to tell you that their marriage is a discovery, or a construction. I am going to tell you that it is robust.

  To [Bride] and [Groom]: May your signal stay strong. May your noise stay low. And may you never, ever agree on what any of it actually means.

  To the couple.
