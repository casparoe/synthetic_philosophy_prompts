answer: |-
  There is no single, canonical noun phrase in the philosophy of science that exclusively names this specific maneuver. However, the phenomenon you describe is a recognized intersection of **Perspectival Realism**, **Model Pluralism**, and the Sociology of Scientific Knowledge (specifically **Boundary Object Theory**).

  In the literature, this is most often discussed descriptively as **"Contextual Ontological Commitment"** or **"Pragmatic Ontological Shifting."** It is a specific species of **Interpretive Underdetermination** (where the formalism underdetermines the ontology, rather than evidence underdetermining the theory).

  Below is an analysis of how this concept sits relative to established philosophical positions, followed by the precise definition and boundary conditions you requested.

  ### 1. Conceptual Location and Nearest Neighbors

  While no single term like "The Quine-Duhem Thesis" exists for this oscillation, it is best understood as a pragmatic application of **Perspectival Realism** (associated with Ronald Giere and Michela Massimi).

  *   **Perspectival Realism:** This view holds that scientific knowledge is always situated within a specific perspective (defined by instruments, models, or goals). Reality is not accessed "god's-eye" but relative to these perspectives. Your example fits here: the "realist perspective" is adopted for mechanism explanation; the "instrumentalist perspective" is adopted for predictive calibration.
  *   **Boundary Objects (STS):** In Science and Technology Studies (Star & Griesemer), models often function as *boundary objects*. They are plastic enough to adapt to the needs of different communities (policymakers vs. modelers) but robust enough to maintain a common identity. The "ontological switching" is the mechanism that allows the model to function as a boundary object: policymakers need *causes* (realism); modelers need *tractability* (instrumentalism).
  *   **Effective Theory Logic:** In physics, "Effective Field Theories" treat entities as real at certain scales and as mathematical artifacts at others. Your observation extends this logic from *scale* to *communicative context*.

  ### 2. Distinctions from Established Concepts

  You asked how this differs from ordinary underdetermination, structural realism, and conventionalism.

  | Concept | Core Claim | How Your Phenomenon Differs |
  | :--- | :--- | :--- |
  | **Underdetermination of Theory by Evidence (UTE)** | Evidence $E$ is compatible with distinct theories $T_1$ and $T_2$. | Your case involves **one** formalism $F$ compatible with distinct **ontologies** $O_1$ and $O_2$. The underdetermination is not about *which model to use*, but *how to interpret the variables within the chosen model*. |
  | **Structural Realism** | Only the mathematical structure is real; entity-ontology is unknowable/irrelevant. | Structural realism is a consistent philosophical stance. Your phenomenon is a **contextual oscillation**. The researcher claims the entities *are* real in context A, and *are not* in context B. Structural realism would deny reality in both. |
  | **Conventionalism** (Poincaré/Duhem) | Theoretical entities are convenient fictions/conventions universally. | Conventionalism is a global instrumentalism. Your phenomenon is **selective realism**. The researcher asserts reality when it aids persuasion (mechanism) and denies it when it aids defense (uncertainty). |
  | **Constructive Empiricism** (Van Fraassen) | Aim is empirical adequacy, not truth; suspend belief on unobservables. | Constructive empiricism is a consistent normative stance. Your phenomenon describes a **descriptive practice** where belief is *not* suspended but toggled based on rhetorical utility. |

  ### 3. Proposed Definition: Contextual Ontological Shifting

  Since an established term is absent, I propose the following precise definition for this maneuver, which you can use to distinguish it from mere inconsistency.

  **Definition:**
  **Contextual Ontological Shifting (COS)** is a methodological practice in scientific modeling wherein agents maintain a single formal structure $F$ but vary the ontological status $O$ of $F$'s latent variables depending on the epistemic or rhetorical context $C$.
  *   In Context $C_{real}$ (e.g., mechanism explanation), variables $V \subset F$ are asserted to refer to mind-independent causal powers.
  *   In Context $C_{inst}$ (e.g., error analysis or calibration), variables $V$ are asserted to be mathematical conveniences without independent referents.
  *   The shift is driven by **pragmatic utility** (explanatory power vs. defensive modesty) rather than by new empirical data or formal modification.

  ### 4. Boundary Conditions

  To distinguish COS from logical fallacies or ad hoc maneuvering, three boundary conditions must be met:

  **A. Formal Invariance (vs. Ad Hoc Hypotheses)**
  *   **Condition:** The mathematical formalism $F$ must remain unchanged during the shift.
  *   **Distinction:** An *ad hoc* hypothesis modifies the model (adding parameters) to save a prediction. COS modifies the *claim about the model's relation to the world* without altering the equations. If the researcher adds a new term to the diffusion equation to make the deep ocean "real," that is ad hoc modeling. If they keep the equation but claim the term represents "real mixing" to policymakers and "smoothing" to peers, that is COS.

  **B. Contextual Coherence (vs. Equivocation)**
  *   **Condition:** Within any single context $C$, the ontological commitment must be consistent.
  *   **Distinction:** *Equivocation* is a fallacy where a term changes meaning within a single argument to derive a false conclusion. COS is not fallacious if the researcher explicitly or implicitly signals the context. It becomes equivocation only if the researcher uses the realist claim to secure funding and the instrumentalist claim to evade accountability *within the same argumentative frame*. COS requires a stable "rule of use" for each context.

  **C. Empirical Indifference (vs. Theory Choice)**
  *   **Condition:** The choice between $O_{real}$ and $O_{inst}$ cannot be determined by empirical data alone.
  *   **Distinction:** If new data arrived (e.g., direct measurement of deep-ocean currents) that forced the realist reading, the shift would no longer be COS; it would be standard theory updating. COS exists specifically in the zone where the data *cannot* decide the ontology, leaving the choice to pragmatic factors.

  ### 5. Summary

  The maneuver you have identified is **Contextual Ontological Shifting**. It is a pragmatic resolution to **Ontological Underdetermination by Formalism**.

  It differs from **Underdetermination of Theory by Evidence** because it occurs *within* a chosen theory, not *between* theories. It differs from **Structural Realism** because it allows for temporary, local entity realism rather than global structural commitment. It differs from **Conventionalism** because it does not treat all entities as fictions, but rather toggles their reality status based on utility.

  In the philosophy of climate science and economics, this is increasingly recognized not as a bug, but as a feature of **"Model-Based Science,"** where models act as **Boundary Objects** that must be ontologically flexible to mediate between the rigorous constraints of peer science and the causal demands of policy.
