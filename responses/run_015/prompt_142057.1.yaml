      *   *Constraint:* Do not explain the material to me. Plan the section.

  3.  **Drafting Component 1: Order of Components:**

      *   *Problem:* If I start with "merely verbal," the 1/3 will nod and the 2/3 will tune out. If I start with "brute facts," the 2/3 will nod and the 1/3 will tune out.
      *   *Solution:* Start with the *shared intuition* that definition solves things, then show where it fails.
      *   *Sequence:*
          1.  Establish the "Charitable Translation" test (the standard verbal dispute test).
          2.  Show a case where translation works but disagreement *remains* (this kills the "waste of time" view).
          3.  Show a case where translation fails to resolve the *utility* of the question (this kills the "brute fact" view).
          4.  Introduce the tripartite distinction: Factual vs. Verbal/Stipulative vs. Framing/Methodological.
      *   *Why this order:* You can't identify a "framing dispute" until you've ruled out simple verbal confusion. You can't rule out verbal confusion until you agree on what "verbal" means (charitable translation). If you introduce "framing" too early, it looks like just another word for "verbal." If you introduce "brute facts" too early, you validate the annoyed students prematurely.
      *   *Critical Juncture:* The distinction between "disagreement about the world" and "disagreement about which question to ask" must come *after* establishing that shared facts/language don't guarantee agreement on *value*.

  4.  **Drafting Component 2: The One Example:**

      *   *Criteria:* Not composites (too fresh/loaded), not vagueness (too easy to dismiss as semantic indecision). Needs to be informed, charitable, high stakes, definition-resistant.
      *   *Candidate 1:* Planet vs. Dwarf Planet (Pluto).
