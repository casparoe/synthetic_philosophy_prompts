answer: |-
  ### I. The Sequence (Order and Rationale)

  **Order:**
  1.  **The Diagnostic Tool:** Establish the "Principle of Charitable Translation" (PCT).
  2.  **The Limit Case:** Apply PCT to the Anchor Example to reveal the "Residue."
  3.  **The Tripartite Classification:** Distinguish Factual, Verbal, and Framing disputes.
  4.  **The Reflexive Check:** Demonstrate that disambiguation is not neutral (the "Whose Term?" wrinkle).

  **Why this is the only workable order:**
  *   **Before "Merely Verbal" can work:** You must first define "merely verbal" not as "trivial" but as "resolvable by charitable translation without loss of content." If you introduce the phrase *before* establishing the PCT, the 1/3 of students who dislike ontology will use "merely verbal" as a conversation-stopper (a dismissal), and the 2/3 will treat it as a challenge to find the hidden fact. The phrase only does analytical work once it is operationalized as a test, not a verdict.
  *   **The Unintelligible Step:** You cannot introduce the **Tripartite Classification** (Step 3) before the **Limit Case** (Step 2). If you present the three categories upfront, students will treat "Framing Dispute" as a synonym for "Verbal Dispute" or "Ignorance." They must *experience* the failure of the binary (Factual vs. Verbal) to accept the third category. The residue must be felt before it is named.
  *   **Drawing the Distinction:** The line between "disagreement about the world" and "disagreement about which question to ask" must be drawn *after* the Residue is identified but *before* the Reflexive Check. If drawn earlier, it collapses into the Factual/Verbal binary. If drawn later, the Reflexive Check will look like skepticism about the classification itself rather than a feature of the method. The classification stabilizes the residue; the Reflexive Check shows the residue is sensitive to perspective.

  ### II. The Anchor Example

  **The Example:** **The Species Concept Dispute in Biology.**
  Specifically: The clash between the *Biological Species Concept* (BSC: interbreeding populations) and the *Phylogenetic Species Concept* (PSC: smallest monophyletic groups).

  **What this example must have:**
  *   **Shared Facts:** Biologists agree on the organisms, the DNA sequences, and the breeding behaviors. There is no ignorance of the territory.
  *   **Shared Language:** Both sides use the word "species." Neither side claims the other is speaking English incorrectly.
  *   **Non-Arbitrary Stakes:** Choosing BSC vs. PSC changes conservation policy, funding allocation, and how we understand evolutionary mechanisms. It is not a whim.
  *   **Definition-Resistance:** You cannot solve this by defining "species." Each definition serves a different theoretical goal (reproductive isolation vs. historical lineage).

  **What this example must lack:**
  *   **Vagueness:** This is not about a borderline case (e.g., "Is this ring species a species?"). It is about competing precise criteria.
  *   **Ontological Baggage:** Unlike composites, students do not have pre-existing metaphysical commitments to "real species" vs. "nominal species" that trigger defensive posturing.

  **Why not the Composite-Objects Dispute?**
  The students are currently polarized on this exact topic. Using it reinforces existing trenches. The 1/3 will say "See? Verbal!" and the 2/3 will say "See? Brute fact!" You cannot teach a *method* for analyzing disputes using a dispute they have already decided is either nonsense or sacred. You need a neutral territory to calibrate the instrument.

  **Why not Vague Predicates (Tall/Heap)?**
  Vagueness suggests the problem is *precision*. Students will assume that if we just sharpened the boundary (e.g., "180.00 cm"), the dispute vanishes. This reinforces the idea that all non-factual disputes are matters of arbitrary stipulation. The Species dispute shows that even with *precise* definitions, disagreement remains because the *purpose* of the classification is contested. This is essential for introducing the "Framing" category.

  ### III. The Misconception Map

  **1. "Merely Verbal = Trivial/Waste of Time"**
  *   **When it forms:** Immediately upon hearing the phrase in Step 1.
  *   **Intervention Point:** During the definition of the Diagnostic Tool.
  *   **Move:** Explicitly state: "A verbal dispute is not one where nobody cares. It is one where translation resolves the conflict. We will see cases where translation *fails* to resolve the conflict, even when the terms are clear."

  **2. "Definition = Resolution (Stipulation settles everything)"**
  *   **When it forms:** During Step 2 (Limit Case), when you ask "Why not just pick the BSC definition?"
  *   **Intervention Point:** Before moving to Step 3.
  *   **Move:** Force the question: "What do we lose if we pick BSC over PSC?" If they answer "We lose the ability to track lineage," you have proven that stipulation has costs. The dispute is about *costs*, not meanings.

  **3. "The False Dichotomy (Factual vs. Quibbling)"**
  *   **When it forms:** At the start of Step 3, when asked to classify the Species residue.
  *   **Intervention Point:** The exact moment of classification.
  *   **Move:** Do not offer the third category immediately. Let them struggle to fit it into "Factual" or "Verbal." When they fail, introduce "Framing Dispute" (renamed from "theoretical-role") as the label for "Agreement on facts and language, disagreement on utility."

  **4. "If Language is Chosen, Nothing is Factual (The Nihilist Slide)"**
  *   **When it forms:** At the end of Step 3, as a reaction to the idea that frameworks are chosen.
  *   **Intervention Point:** Closing summary of Step 3.
  *   **Move:** Emphasize that Framing Disputes *presuppose* facts. You cannot argue about the best map if there is no territory. The choice is real, but it is not a choice about the territory's existence.

  **5. The Wrinkle: "Disambiguation is Not Neutral (Whose Term is Fixed?)"**
  *   **When it forms:** During Step 4 (Reflexive Check).
  *   **Intervention Point:** *After* the Tripartite Classification is secure.
  *   **Move:** Ask: "If we translate the PSC biologist into the BSC biologist's language, who changed their mind?" Show that the verdict of "verbal" depends on which framework is treated as the baseline.
  *   **Goal:** Land this as a feature of the *method* (the procedure requires a baseline), not as a bug of *reality* (there is no truth). It teaches them that the procedure requires an argument for *why* we are holding one term fixed, which is itself a Framing Dispute.

  ### IV. The Check for Understanding

  **The Task:**
  Present a short vignette from **Criminal Law**:
  > "Two prosecutors agree on all the evidence regarding a defendant's mental state (facts). They agree on the statutory definition of 'insanity' (language). Prosecutor A argues the defendant is insane because the goal of the law is *retribution* (you must be morally blameworthy to be punished). Prosecutor B argues the defendant is not insane because the goal of the law is *public safety* (the defendant is dangerous regardless of blame). They disagree on whether to plead 'insanity'."

  **Ask:** "Classify this dispute using the procedure."

  **The Failing Answer (Labeling without Procedure):**
  *   "It is merely verbal because they define insanity differently." (Ignores that they agreed on the definition).
  *   "It is a factual dispute about whether he is really insane." (Ignores the agreement on mental state facts).
  *   "It is arbitrary/subjective." (Misses the theoretical stakes of retribution vs. safety).

  **The Passing Answer (Applying the Procedure):**
  *   "They pass the Charitable Translation test (they share the definition), so it is not merely verbal. They agree on the physical/mental facts, so it is not a first-order factual dispute. It is a **Framing Dispute**: they disagree on the *theoretical role* the concept of insanity plays in the legal system (moral accounting vs. risk management). To resolve it, we cannot look at the world or the dictionary; we must argue about the purpose of the law."

  ### V. The Boundaries (Refusals)

  **1. Metasemantic Theory**
  *   **What it is:** Questions about *how* words get their meanings (use, causation, intention).
  *   **How to mark it:** "We are treating meanings as fixed inputs for this procedure. How those meanings got fixed is a different course. We are analyzing the *structure* of the disagreement, not the *origin* of the terms."

  **2. Model-Theoretic Apparatus**
  *   **What it is:** Formal semantics, possible worlds models of meaning.
  *   **How to mark it:** "We are working in natural language. Formalizing this would require assumptions about logic that we are not making today. The procedure is conceptual, not mathematical."

  **3. The Epistemology of Disagreement**
  *   **What it is:** How rational agents should revise beliefs when peers disagree.
  *   **How to mark it:** "We are not asking 'Who should win?' or 'What should you believe?' We are asking 'What kind of fight is this?' Do not confuse mapping the terrain with choosing a side."

  **Implementation Note:** Write these three items on the board under a header labeled **"OUT OF BOUNDS."** Tell the students: "If our discussion drifts into these zones, I will stop us and point to the board. This is not because those questions are unimportant, but because answering them now would prevent you from learning the diagnostic tool."
