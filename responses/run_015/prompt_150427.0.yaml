  **Joint Statement on Competence and Comprehension in Evolutionary and Computational Systems**

  **From:** The Adversarial Collaboration on Naturalized Intelligence
  **Date:** Oct 14
  **Subject:** Draft v3 (final-ish)

  Look, we spent the last week banging our heads against the wall about whether Darwin and Turing actually proved that mindless systems can be smart, or if that's just a trick of language. We aren't going to agree on the metaphysics today, but we need this dataset annotated. Below is the framework we both can sign off on. It maps where the ground is solid and where the fault lines are.

  There might be a typo or two, we were working late.

  ### 1. Agreed Claims
  *Both camps accept the following as baseline facts regarding the phenomena in question.*

  1.  **The Darwinian Fact:** Natural selection produces complex, adaptive structures (competence) without requiring a foresightful designer or an internal model of the goal within the organism.
  2.  **The Turing Fact:** Formal computation produces valid logical outputs (competence) via manipulation of symbols based solely on their shape syntax, without requiring the machine to understand the semantics of those symbols.
  3.  **The Locality Constraint:** In both cases, the immediate causal mechanism operating in the present moment does not contain a homunculus, a soul, or a central executive that "knows" what it is achieving.
  4.  **The Explanandum:** The core philosophical problem is to explain how "meaning," "truth," or "utility" arises from systems that appear to operate blindly.
  5.  **Outsourcing is Real:** Both sides agree that some form of work is done outside the immediate locus of action—either across evolutionary time (generations) or during the design phase of an algorithm (programming).
  6.  **No Magic:** Neither side posits supernatural forces. All mechanisms must be physically instantiated.

  ### 2. Disagreements Table
  *Where we part ways. Each formulation is phrased so the respective camp can accept it without feeling strawmanned.*

  | Issue | Camp "Strong Inversion" Formulation | Camp "Displaced Comprehension" Formulation |
  | :--- | :--- | :--- |
  | **Presence of Mind** | The performing system possesses **literally zero** comprehension. Competence is decoupled from understanding entirely. | The performing system possesses **distributed** comprehension. Understanding is embedded in the structure/history, not absent. |
  | **The "Inversion" Label** | Calling it an inversion is accurate because reasoning traditionally requires a reasoner; here, the effect exists without the cause. | Calling it an inversion is a framing error. The reasoner is just extended across time or design, not removed. |
  | **Semantic Content** | Syntax and selection pressures are devoid of content until an external observer interprets them. | Syntax and selection pressures *carry* content in virtue of their reliable causal coupling to outcomes. |
  | **System Boundaries** | The system is the individual organism or the running machine *now*. | The system includes the evolutionary lineage or the design context + the machine. |

  ### 3. Cruxes
  *These are the sub-questions where settling the evidence would force one side to update. If we resolve these, the collaboration collapses (hopefully into agreement).*

  **Crux A: The Status of Teleonomic Outsourcing**
  Does pushing the "reasoning" into the past (evolutionary history) eliminate mental content from the present object, or does it store that content in the object's structure?
  *   *Strong Inversion:* History drains content. The organism is a fossil of past utility, not a container of current knowledge.
  *   *Displaced Comprehension:* History deposits content. The organism is a crystallized form of knowledge about its environment.

  **Crux B: Syntax Without an Interpreter**
  If a Turing Machine runs transition rules in a void (no user, no designer present), do the rules themselves constitute a form of syntactic comprehension?
  *   *Strong Inversion:* No. Rules are just physical state changes. Comprehension requires an external interpreter to assign meaning.
  *   *Displaced Comprehension:* Yes. The causal structure of the rules embodies the logical relationship regardless of observation.

  **Crux C: The Threshold for "System"**
  Is there a non-arbitrary way to draw the boundary around where comprehension lives?
  *   *Strong Inversion:* Yes, the boundary is the skin/chassis. Anything outside is environment, not mind.
  *   *Displaced Comprehension:* No, the boundary is functional. If history is causally necessary for the competence, it's part of the cognitive system.

  ### 4. Concrete Cases & Predictions
  *For each crux, we identified a case we both agree is relevant. Here is what each side expects to find.*

  **For Crux A (Teleonomic Outsourcing)**
  *   **Case:** **Instinctive Web Spinning in Orb Weavers.** The spider builds a complex aerodynamic trap without learning or understanding physics.
  *   **Strong Inversion Prediction:** Neurological analysis will show the spider operates on simple trigger-response loops. The "knowledge" of aerodynamics exists only in the *success rate* of the lineage, not in the spider. If you isolate the spider, the comprehension vanishes.
  *   **Displaced Comprehension Prediction:** The spider's body and neural circuitry *are* the model of aerodynamics. The comprehension is physically instantiated in the wiring. Isolating the spider doesn't remove the knowledge any more than unplugging a hard drive deletes the data.

  **For Crux B (Syntax/Interpreter)**
  *   **Case:** **Automated Theorem Proving.** A script runs on a server proving logical conjectures无人 (no human checks the output immediately).
  *   **Strong Inversion Prediction:** The server is just shuffling electrons. No "proof" exists until a mathematician reads the output. The machine has competence (valid output) but zero comprehension of logic.
  *   **Displaced Comprehension Prediction:** The server is performing logical comprehension. The transition rules encode the logical necessities. The comprehension is present in the causal chain regardless of human observation.

  **For Crux C (System Boundaries)**
  *   **Case:** **CRISPR/Cas9 Gene Editing.** Bacterial immune systems that "recognize" viral DNA.
  *   **Strong Inversion Prediction:** The bacteria don't "recognize" anything. It's lock-and-key chemistry. The "recognition" is a metaphor we apply from the outside.
  *   **Displaced Comprehension Prediction:** The bacteria genuinely recognize the virus. The specificity of the match constitutes semantic content within the biological system boundary. The "design" is internalized.

  ***

  *Signatures below indicate we agree this accurately maps the dispute, not that we agree with the other side.*

  [Signed] Camp Strong Inversion
  [Signed] Camp Displaced Comprehension
