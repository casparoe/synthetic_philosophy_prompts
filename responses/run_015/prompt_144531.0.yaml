  ### 2. The Two Plausible Rules
  Her prior verdicts are jointly consistent with two distinct underlying principles that diverge on the dispersed-vat scenario:

  *   **Rule A: The Physical Boundary Principle.**
      *   *Formulation:* A unified macro-subject requires a shared physical boundary or enclosure (e.g., a skull, membrane, or single container) that demarcates the system from its environment. Substrate is irrelevant (per Case 5), and functional disunity is tolerable (per Case 3), but spatial containment is necessary.
