answer: |-
  The fundamental mistake is treating archival silence as a technical deficit to be patched via imputation, rather than recognising that the absence itself constitutes the primary evidence of the power structures you seek to analyse. In software engineering, missing data is a bug to be resolved, yet in archival science, silence is often a deliberate feature of systemic oppression affecting marginalised communities that must be preserved as evidence. If you statistically impute voices into the historical record, you risk fabricating evidence that future researchers might mistake for fact, thereby obscuring the very mechanism of erasure you wish to highlight. The archive is not a neutral database of truth but a residue of administrative power, meaning the gaps reveal who was deemed worthy of documentation by the state or organisation. Community memory is vital, but it belongs in a separate branch—such as an oral history collection—linked to the original fonds without altering its integrity. To merge them would be to break provenance, conflating what was created at the time with what is remembered now. The correct approach is not to fix the silence but to document it, creating metadata that explains why the data is missing rather than pretending it exists.
