answer: |-
  This is a really sharp observation, and you've hit on something that often trips up engineering teams when they try to scale. Your concept of "normative slack" maps quite neatly onto what happens when formal processes collide with informal social hierarchies. In philosophy, this touches on the difference between the letter of the law and the spirit of the law, but you're framing it as a systems failure, which is a very useful lens.

  To give you an example in the weeds, let's look at **deployment governance in a distributed DevOps environment**, specifically regarding the "Staging Gate" and the "Emergency Bypass".

  ### The Setup: The Coordination Rule
  Imagine a distributed team managing a high-availability service. To coordinate releases safely, the organisation establishes a hard rule: **No code reaches production without passing a 24-hour soak test in the staging environment.**

  This rule is a coordination mechanism. It allows the QA team, the SREs (Site Reliability Engineers), and the product managers to synchronise. They all know that if something is in staging, it's pending; if it's in production, it's approved. The rule creates a shared signal.

  ### The Normative Slack
  However, the team recognises that strict rule-following can be brittle. What if there's a critical security vulnerability or a payment processing outage? So, they build in slack: **Maintainers may bypass the staging gate for "critical emergency fixes".**

  On paper, this looks like sensible flexibility. It prevents the coordination system from becoming a bottleneck during a crisis. But here is where your "normative slack" comes into play. The written rule defines "critical" technically (e.g., "P0 incident"), but the *interpretation* of what qualifies as a P0 is left to human discretion.

  ### The Second-Order System
  This is where the invisible system emerges. In practice, whether a fix is deemed "critical" enough to bypass staging isn't decided solely by the severity of the bug. It's decided by **social capital and tenure**.

  *   **Scenario A (High Status):** A senior engineer or a founding member encounters a bug that affects a major client. They declare it a "P0 Emergency". They bypass the staging gate. The system accepts this because challenging their judgement is socially costly. The bypass is recorded as a valid exception.
  *   **Scenario B (Low Status):** A newer contributor or a junior engineer finds a bug that is technically identical in severity. They request a bypass. They are asked to "provide more data" or "wait for the morning stand-up". They are forced to wait the 24 hours.

  The real rule is no longer "No production without staging unless critical." The real rule has become: **"No production without staging unless you have the status to declare it critical."**

  ### The Coordination Break
  You might think, "Well, as long as the seniors are right, does it matter?" It does, because it breaks the coordination signal for everyone else.

  1.  **Signal Degradation:** The staging environment is meant to be a reliable indicator of "ready for production". When high-status individuals routinely bypass it, the link between "staged" and "safe" weakens. SREs start to assume that *any* production change might be unstable, not just the ones that skipped staging, because the definition of "emergency" has become noisy.
  2.  **Workaround Optimisation:** New contributors quickly learn that following the written rule is a disadvantage. Instead of optimising for code quality or testing, they start optimising for **permission-seeking**. They spend more time messaging senior engineers to co-sign their "emergency" requests than they do fixing the actual bug. The coordination effort shifts from managing the software to managing the hierarchy.
  3.  **The "Boy Who Cried Wolf" Effect:** Eventually, seniors start using the bypass for non-critical things—deadlines, demo preparations, or simply because they're impatient. Because the second-order rule protects them, there is no feedback loop to correct this. The staging gate becomes a suggestion for the elite and a wall for the rest.

  ### Why This Breaks Coordination
  In a distributed team, you cannot rely on osmotic communication. You rely on explicit protocols. When normative slack allows the protocol to be bent based on identity rather than state, the protocol loses its ability to coordinate strangers.

  If I join your project tomorrow, I cannot coordinate with you using the "Staging Gate" rule, because I don't know the second-order rule about who is allowed to ignore it. I might block a merge waiting for staging, whilst you merge over my head citing an emergency I wasn't aware of. We are no longer playing the same game.

  The coordination mechanism fails not because people broke the rule, but because the *exception process* became a status game. The system stops coordinating work and starts enforcing hierarchy. You end up with a codebase where stability depends on who touched it, rather than how it was tested. That is the precise failure mode your concept of normative slack predicts: the flexibility meant to save the system ends up privatising the rules, making coordination impossible for anyone outside the inner circle.
