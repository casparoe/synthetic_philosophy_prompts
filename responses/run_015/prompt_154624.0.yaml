answer: |-
  Your hypothesis is incisive. You have correctly identified that the stagnation in the literature is not merely a linguistic technicality but a symptom of a deeper metaphysical disagreement about the nature of action and agency. The debate persists because philosophers are using the label "speech act" to cover two distinct phenomena that only overlap in the paradigmatic case of a competent human speaker.

  Here is a diagnosis of the stalemate, separating the settled consensus from the genuine contestation, and an assessment of whether the impasse can be broken.

  ### 1. The Settled Consensus: What Is No Longer Debated
  To understand where the disagreement lies, we must first clear away what specialists generally agree upon. Since Austin's own retraction in *How to Do Things with Words* (Lecture VI), the following points are broadly settled in the philosophy of language:

  *   **The Collapse of the Binary:** There is no ontological chasm between "performative" and "constative" utterances. It is accepted that stating a fact is itself an action (the act of asserting) subject to norms, and that performatives often contain descriptive content subject to truth evaluation.
  *   **Illocutionary Force is Ubiquitous:** Every meaningful utterance carries an illocutionary force (it counts as something: a warning, a statement, a promise). There is no "neutral" description of reality that lacks a performative dimension.
  *   **Felicity and Truth are Intertwined:** The distinction between being "true" and being "felicitous" is not a clean split. An assertion can be infelicitous (e.g., if the speaker lacks evidence), and a promise can be evaluated for truth (e.g., if the speaker never intended to keep it).

  If the debate were only about these linguistic classifications, it would have ended decades ago. The persistence of the debate indicates that the disagreement has migrated to the *grounds* of these acts.

  ### 2. The Genuine Contention: The Source of Normative Force
  The live wire in contemporary philosophy of language is not whether speech acts exist, but **what confers status upon them.** Here, the field is divided into two camps that are often talking past one another because they prioritize different necessary conditions.

  *   **The Intentionalist Camp:** Drawing on Grice and Searle, this view holds that the core of a speech act is the speaker's intention to produce an effect in a hearer by means of the hearer's recognition of that intention. On this view, agency is internal and psychological. Without a mind capable of forming complex intentions, there is no speech act, only noise or simulation.
  *   **The Conventionalist/Institutional Camp:** Drawing on the early Austin and later Wittgenstein, this view holds that the force of an utterance derives from social convention, procedure, or institutional rule. On this view, agency is external and structural. If the procedure is followed correctly within the institution, the act is performed, regardless of the internal mental state of the operator.

  **The Stalemate:** The Intentionalists argue that without mind, there is no *meaning*, only causal impact. The Conventionalists argue that without institution, there is no *power*, only psychology. Because standard human cases involve *both* mind and institution, both sides can claim their examples prove their point. The stalemate persists because neither side can decisively rule out the other in the human case.

  ### 3. Diagnosis: The Agency Fault Line
  Your suspicion is correct: the disagreement is about the **metaphysics of action**, not the syntax of sentences. The term "speech act" conceals a category error. It conflates:
  1.  **The Illocution:** The social status change (e.g., becoming married, becoming indebted).
  2.  **The Agency:** The causal source of that change (e.g., the will of the speaker).

  In the human case, these are fused. In the non-human cases you cite (AI, smart contracts, biometric clicks), they come apart.

  *   **Smart Contracts:** These are pure Conventionalism. The code executes the transfer. There is zero human intention at the moment of execution, yet the institutional fact (ownership transfer) is created. If you side with Conventionalists, this is a perfect speech act. If you side with Intentionalists, this is merely a causal mechanism, not an action.
  *   **AI Apologies:** These are the inverse. An LLM outputs "I apologize" based on probabilistic weights. It mimics the form of the Illocution but lacks the mental state. However, if the user *accepts* the apology and the social tension is resolved, the *social function* of the speech act was achieved without the *mental substrate*.

  The debate stalls because philosophers defend a definition of "action" that protects their broader metaphysical commitments.
  *   If you believe **individual autonomy** is the foundation of ethics and language, you must insist on intention. To admit AI can perform speech acts threatens the special status of human agency.
  *   If you believe **social structures** are the foundation of reality, you must insist on convention. To admit intention is necessary makes social reality too fragile (dependent on inaccessible mental states).

  ### 4. Prospects for Resolution
  Can this impasse be resolved? It is unlikely to be solved by a new linguistic theory, as the problem is not linguistic. However, progress could be made by dissolving the question through one of three shifts.

  **A. Shift from "Speech Acts" to "Institutional Facts" (The Ontological Shift)**
  Progress is most likely if the debate moves from the philosophy of language to social ontology. If we stop asking "Did the AI speak?" and start asking "Was an institutional fact created?", the disagreement softens.
  *   *Resolution Path:* Acknowledge that "status functions" (Searle's term) can be decoupled from individual psychology. We could develop a taxonomy where **Procedural Performatives** (smart contracts, clicks) are distinguished from **Intentional Performatives** (vows, promises). This admits your hypothesis: the fault line is agency.
  *   *Obstacle:* Many philosophers resist this because it threatens the idea that language is essentially human.

  **B. Distributed Agency (The Sociotechnical Shift)**
  Some contemporary theorists (influenced by Actor-Network Theory or distributed cognition) argue that agency is not located in the mind but in the *network* of human, tool, and institution.
  *   *Resolution Path:* In a smart contract, the agency is distributed between the coder (past intention), the user (triggering action), and the blockchain (enforcement). The "speech act" is a property of the system, not the moment of output.
  *   *Obstacle:* This is often viewed as sociological rather than philosophical, and it struggles to account for moral responsibility (who is to blame if the smart contract fails?).

  **C. Acceptance of Permanent Pluralism (The Deflationary Shift)**
  It is possible that the impasse is permanent because "action" is a cluster concept with no essential core.
  *   *Resolution Path:* Acknowledge that "performative" is a family resemblance term. Some performatives require mind; some require only procedure. The search for a unified theory is the error.
  *   *Obstacle:* This is unsatisfying for theorists seeking a unified science of language.

  ### 5. Conclusion: Is the Impasse Permanent?
  The impasse is likely permanent **if** the goal is a single, unified definition of the speech act that covers both human vows and automated transactions. This is because the two sides are defending incompatible metaphysical priorities (Individualism vs. Structuralism).

  However, the debate can be **dissolved** if the field accepts your diagnosis: that "performative" describes two different mechanisms that usually coincide but can come apart.
  *   **Mechanism A:** Mind-dependent (Human promises).
  *   **Mechanism B:** Procedure-dependent (Algorithmic execution).

  Progress requires philosophers to stop asking "Is this *really* a speech act?" and start asking "Which mechanisms of status-creation are at work here?" If the literature shifts to analyzing the **infrastructure of performativity** (the code, the law, the protocol) rather than the **psychology of the speaker**, your edge cases (AI, smart contracts) become the central data points that force a new taxonomy.

  Until then, the debate will continue to circle the same human examples, because those are the only cases where the conflicting definitions of agency yield the same result, allowing both sides to pretend they are describing the same phenomenon. You have identified the crack in the foundation; the stalemate persists because neither side wants to admit the building is split.
