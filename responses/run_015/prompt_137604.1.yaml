      *   *Selected Rule:* Rule 3 (Distortion Exception) or Rule 2 (Accuracy). Rule 3 is slightly cleaner administratively ("Is it distorting? Yes/No"). Rule 2 requires assessing "accuracy." The prompt says the agent *believes* it will be more accurate. Rule 3 covers this under "Not distorting." Let's lean towards Rule 3 as the primary driver, as it aligns with the specific language used to justify Case 2 ("distorting non-evidential process").
