      *   **Rule 1 (Evidentialism):** RP only constrains future credences produced by *learning new evidence*. Non-evidential processes (drug, therapy, reasoning) allow freedom.
          *   Case 1 (Evidence): Defer required. (Matches Approve).
          *   Case 2 (Drug): Defer not required. (Matches Approve of non-deference).
