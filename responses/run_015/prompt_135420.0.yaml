answer: |-
  This is a sharp question that cuts through the usual econ 101 hand-waving. You are essentially asking for the *axiomatic cost* of Zero Pure Time Preference (ZPTP). You want to know if holding ZPTP forces you to burn down other parts of the decision-theoretic or metaphysical house.

  The short answer is: **Yes.** There are formal results suggesting that ZPTP is incompatible with certain desirable properties of a utility function over infinite horizons. There are also practical *reductios* regarding action-guidance.

  Here is the map of where your position is exposed, ranked from "Formally Fatal" to "Morally Awkward," followed by an analysis of the "risk as discounting" unfalsifiability problem.

  ---

  ### 1. The Formal Fatal Flaw: Koopmans' Theorem & Infinite Streams
  **Rank: Fatal (for standard utility representations)**

  This is the strongest argument against you. It does not rely on psychology, risk, or death. It relies on the topology of infinite utility streams.

  If you assume the future is potentially infinite (or indefinite), and you want to construct a social welfare function (or individual utility function) that ranks consumption/welfare streams, you run into the **Koopmans (1960)** impossibility result.

  Tjalling Koopmans proved that if you require a utility function over infinite streams to satisfy three axioms:
  1.  **Continuity:** Small changes in the stream don't cause massive jumps in value.
  2.  **Sensitivity (Pareto):** If one stream is better in every period, it is ranked higher.
  3.  **Stationarity:** The preference between two streams starting tomorrow should be the same as the preference between those streams starting today (time-invariance of the *structure* of preference).

  ...then **you must have a non-zero pure rate of time preference.**

  **Why this hurts you:**
  If you insist on ZPTP (discount factor $\delta = 1$), the sum of utility $\sum_{t=0}^{\infty} u_t$ diverges for any stream where utility is bounded away from zero. You literally cannot assign a real number value to the future. You lose the ability to rank policies.
  *   *Counter-argument:* You can use "overtaking criteria" (Stream A is better if it eventually surpasses Stream B and stays ahead).
  *   *Rebuttal:* Overtaking criteria create **incompleteness**. There will be pairs of streams you cannot rank. If you want a *complete* ordering (required for standard rational choice theory), you need discounting.

  **The Defeater:** To maintain ZPTP, you must either accept that rational choice is impossible over infinite horizons (no value function exists) or accept that your preference relation is incomplete (there are choices reason cannot decide).

  ### 2. The "Astronomical Waste" & Overdemandingness
  **Rank: Awkward (but consistent for Longtermists)**

  You mentioned longtermist grantmaking. If you hold ZPTP, you are logically committed to the **Astronomical Waste** argument (Bostrom).
  If the future contains even a tiny probability of vast populations (e.g., space colonization), the expected value of the future dwarfs the present.
  *   **The Commitment:** A ZPTP agent should be willing to sacrifice nearly 100% of current welfare for a tiny increase in the probability of the long-term future surviving.
  *   **The Defeater:** This isn't a logical contradiction, but it is a *reductio ad absurdum* for most moral intuitions. If your theory implies you should let a child starve today to reduce the risk of a meteor impact in 10 million years by $10^{-9}$, the theory might be "rational" but it is **action-guidingly broken**.
  *   **Nuance:** If you bite this bullet (as many Effective Altruists do), this isn't a defeater for *you*. But for anyone trying to reconcile ZPTP with common-sense morality, this is the breaking point. It forces a lexical priority of the future over the present that renders present-day ethics vacuous.

  ### 3. Metaphysics: Presentism vs. Eternalism
  **Rank: Weak (Metaphysically Costly)**

  You asked if Presentism (only the present exists) can ground pure time preference without egoism.
  *   **The Argument:** If the future does not *exist*, it has no welfare to count. Therefore, discounting is not about *time*, it is about *existence*.
  *   **The Defeater:** This collapses into **Existence Discounting**, not Time Discounting.
      *   If you are a Presentist, you must also believe the *past* does not exist. Do you care about past suffering? If you care about past suffering (e.g., wishing Hitler had failed), you care about non-existent things.
      *   If you care about the *consequences* of your actions, you necessarily care about future states, even if they don't "exist" yet in a presentist ontology.
      *   To make Presentism work as a defense of pure time preference, you have to argue that *potential* welfare counts for less than *actual* welfare. But since all future welfare is currently potential, this is just restating the discount. It doesn't ground it; it assumes it.

  **Verdict:** Presentism doesn't save you. It just shifts the debate to "why do we value non-existent states?" which brings you right back to ZPTP.

  ### 4. Diachronic Consistency & Self-Locating Uncertainty
  **Rank: Neutral / Supportive of Your View**

  You mentioned self-locating uncertainty ("future self is a probabilistic copy").
  *   **The Standard View:** Parfit-style reductionism suggests future selves are less "you," justifying discounting.
  *   **Your View:** You reject this.
  *   **The Formal Reality:** You are actually on firmer ground here. If you reject pure time preference, you satisfy **Diachronic Consistency** (no money pumps). If you *do* discount purely, you are vulnerable to dynamic inconsistency unless you model yourself as a game between temporal selves (Strotz, 1955).
  *   **The Defeater:** There isn't a strong decision-theoretic defeater here *against* you. In fact, ZPTP is the requirement for dynamic consistency. The only risk is if your ZPTP leads to the "Infinity Paralysis" mentioned in point #1, where you can't make *any* decision because all options have infinite value.

  ### 5. The "Risk as Discounting" Unfalsifiability
  **Rank: Methodological Vice**

  You asked: *Has the anti-preference position been qualified so much... that it's become unfalsifiable?*

  **Yes.** This is a significant problem in the literature.
  When a ZPTP proponent is confronted with the "Infinity Paralysis" (Point #1), they often retreat to: "Well, there's always a non-zero probability of extinction, so the stream isn't infinite."
  *   **The Problem:** This conflates **Epistemic/Ontic Uncertainty** (the world might end) with **Axiological Discounting** (the future matters less).
  *   **Why it's a cop-out:** If I say "I discount the future at 5%," and you say "No, that's just a 5% annual risk of extinction," we have different models.
      *   If the risk of extinction is removed (e.g., we achieve technological immortality and stability), the "risk" defender must say discounting drops to zero.
      *   The "pure preference" defender says discounting stays at 5%.
  *   **The Unfalsifiability:** If every time evidence points to ZPTP, the opponent posits a hidden risk variable to explain the discount, they are protecting their model from falsification.
  *   **The Cost:** This makes the "risk" theory tautological. "We observe discounting. Why? Risk. What risk? The risk that explains the discounting." To avoid this, the risk theorist must independently measure extinction risk (e.g., via asteroid frequency, nuclear war probability) and show it *matches* the observed discount rate. It almost never does (observed market rates are often higher than plausible existential risk rates).

  ---

  ### Summary of Defeaters (Ranked)

  | Rank | Argument | Why it hurts ZPTP | Severity |
  | :--- | :--- | :--- | :--- |
  | **1** | **Koopmans' Theorem** | ZPTP + Infinite Horizon + Continuity = **No Value Function**. You cannot mathematically represent your preferences. | **Fatal** (Formal) |
  | **2** | **Astronomical Waste** | ZPTP implies near-total present sacrifice for tiny future gains. Makes the theory action-guiding only for fanatics. | **Severe** (Practical) |
  | **3** | **Unfalsifiable Risk** | Defenders collapse risk into preference to avoid the Infinity problem, making the "risk" claim tautological. | **Moderate** (Methodological) |
  | **4** | **Presentism** | Fails to distinguish time from existence; requires accepting we shouldn't care about past non-existents either. | **Weak** (Metaphysical) |

  ### Do Defenders Have Non-Feeling Arguments?

  Yes, but they are technical, not intuitive.
  1.  **Koopmans (1960):** As mentioned, this is the big gun. It argues that *without* discounting, you cannot have a continuous utility function. If you value "smoothness" in decision making, you must discount.
  2.  **Rawls (A Theory of Justice):** Rawls argued that ZPTP forces the present to be "enslaved" to the future. If we save everything for the future, the present generation starves. He argued for a "just savings principle" which effectively acts as a constraint on ZPTP, though he grounded it in a contractarian veil of ignorance rather than pure time preference.
  3.  **Growth Dynamics:** In Ramsey-Cass-Koopmans growth models, if the discount rate is lower than the growth rate of the economy, the optimal savings rate becomes 100%. You eat nothing. This is the **Dynamic Inefficiency** argument. To have a stable, solvable economy where people actually consume, the discount rate must exceed the growth rate (or there must be a finite horizon).

  ### The Hidden Commitment You Are Making

  If you hold ZPTP, you are committed to **Lexical Priority of the Future** in any context where the future is sufficiently large.
  *   **The Trap:** You cannot use "diminishing marginal utility" to escape this easily. If the future has billions of people, even with diminishing returns, the aggregate swamps the present.
  *   **The Escape Hatch:** The only way to keep ZPTP without implausible sacrifice is to argue that **our causal leverage** over the far future is vanishingly small.
      *   *Argument:* "I care equally about the future, but my $1 today does almost nothing for people in 10,000 years."
      *   *Counter:* Longtermists argue leverage is *high* (e.g., shaping AI, biosecurity). If leverage is high, ZPTP demands total sacrifice.

  ### Final Verdict

  Your intuition that pure time preference is "spatial discrimination" is ethically robust (Ramsey agreed with you). However, your position is **mathematically fragile**.

  To maintain ZPTP without contradiction, you must:
  1.  Reject the requirement for a continuous, real-valued utility function over infinite streams (accept incompleteness).
  2.  Accept that rational agents should sacrifice almost all present consumption if the future is secure and vast.
  3.  Insist that "risk" arguments be empirically grounded, not used as a fudge factor to make the math converge.

  If you are willing to pay those three costs, your view is consistent. If you want a standard, complete, action-guiding utility function in an infinite universe, **Koopmans says you are mathematically impossible.**
