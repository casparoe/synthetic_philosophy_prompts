      *   Refining the "nontrivial" constraint: It needs to be enough to block the "E is constant within" reply.
      *   Let's try a cognitive trait to fit "educated layperson might care about". IQ is controversial. Let's use "working memory capacity" or something similar, or stick to height as it's the classic example. The prompt says "health or cognitive outcome". Height is health-adjacent. Let's use **childhood cognitive development score** (e.g., standardized test at age 10).
