      *   Between: North has food subsidies (high mean protein). South has famine (low mean protein).
      *   Wait, if protein varies within, and affects cognition, does it lower $h^2$? Yes. To keep $h^2$ high, $V_G$ must be very large compared to $V_E$.
      *   Is it plausible that $V_G >> V_E$ within groups but $\Delta Mean_E$ is large? Yes. Variance is about deviation from the mean. You can have a tight distribution of E around a low mean (North) and a tight distribution of E around a high mean (South), while G is spread out widely in both.
      *   Let's ensure the "nontrivial" constraint is met. "Contribute nontrivially" means $V_E > 0$ and noticeable.
