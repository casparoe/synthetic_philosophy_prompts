      *   (c) Structural feature? The distinction between *variance* (spread) and *mean difference* (location). Heritability is about variance ratios within a specific distribution; it is blind to shifts in the distribution's center caused by environmental means. Also, the fact that the *same* factor operates at both levels but with different magnitudes of variation vs. mean shift.
      *   (d) Counterfactual (E affects mean only, not within variance): If E was constant within groups (e.g., everyone in City A gets exactly 10ppm, everyone in City B gets 0ppm), then $V_E$ within = 0. $h^2$ would be 1.0 (perfect). The case still works logically (Lewontin's original), but it's less forceful because critics say "That's unrealistic, environments always vary within groups." By forcing E to vary within, we block the "constant environment" escape hatch, making the paradox sharper for the hereditarian.

  5.  **Refining the Scenario for Constraints:**
      *   One paragraph.
      *   No twins/adoption.
      *   Trait: Cognitive score.
      *   Factor: Lead (or Nutrition). Let's use **early childhood nutrition quality**. It's less controversial than lead/IQ.
