answer: |-
  Consider two genetically homogeneous but isolated communities, Alpha and Beta, where adult systolic blood pressure is the trait of interest. In both communities, genetic susceptibility to hypertension varies widely, and while daily sodium intake fluctuates nontrivially among families due to individual dietary choices, genetic differences account for 80% of the variance in blood pressure within each group, yielding high heritability estimates. However, Alpha adheres to a cultural norm of high-salt preservation methods, shifting their average sodium intake substantially higher than Beta's low-salt norm, creating a large gap in mean blood pressure between the communities. Despite sodium intake driving variation within each group (lowering heritability slightly from 1.0 but keeping it high), the entire difference in the group means is caused by this environmental shift in average sodium consumption, not by genetic divergence, because the founding gene pools were identical.

  (a) Heritability is high in each population because, within the specific context of each community, the variance in genetic susceptibility ($V_G$) is much larger than the variance in sodium intake ($V_E$); thus, differences between individuals are mostly due to genes, even though salt matters. (b) The between-population difference is environmental because the *mean* sodium intake differs drastically between Alpha and Beta while the mean genetic susceptibility remains identical; the shift in the environmental baseline moves the entire distribution of blood pressure for one group relative to the other. (c) The structural feature trapping the inference is the mathematical independence of within-group variance ratios (heritability) from between-group mean differences; a factor can contribute little to within-group *variance* (preserving high $h^2$) while simultaneously having a large difference in *means* between groups (causing the gap). (d) If the environmental factor affected only the between-population mean (i.e., sodium intake was constant within each community), within-group variance due to environment would be zero, making heritability 1.0; the case would still work as a logical counterexample (Lewontin's original wheat analogy), but it would be less forceful because critics could dismiss it as unrealistic, whereas allowing within-group environmental variance blocks the objection that "environments never vary only between groups."
