      *   (a) $V_G$ dominates $V_E$ within.
      *   (b) Mean E differs, Mean G same.
      *   (c) Variance vs. Mean distinction.
      *   (d) If $V_E$ within was zero, it's the classic Lewontin case. It works logically but is easier to dismiss as unrealistic. The current version is more forceful because it accepts the critic's premise (environment varies within) and still defeats their conclusion.

      *Self-Correction on (d):* If the environmental factor affected *only* the between-population mean and not within-population variance (i.e., constant within groups), $V_E$ within would be zero. Heritability would be 1.0. The logic holds perfectly (Lewontin's wheat). Is it as forceful? No, because critics argue environments *never* vary only between groups. By allowing within-group variance, the thought experiment becomes robust against the "real-world complexity" objection.

