  6.  **Reviewing against "Hard Part":**
      *   "The environmental factor that drives the between-population difference must also contribute nontrivially to the within-population variance."
      *   My scenario: Nutrition varies within groups (rich/poor families) AND differs between groups (North/South policy).
      *   This meets the constraint. It blocks the reply "Within groups, environment is constant, so heritability is high, but between groups environment changes." Here, environment changes within *and* between, yet heritability remains high within, and between difference is environmental.
      *   Why? Because heritability is $V_G / (V_G + V_E)$. If $V_G$ is large, $h^2$ is high. The between difference is $\Delta Mean_E$. $\Delta Mean_E$ can be large even if $Var(E)$ is small.
      *   This is the crux. Variance $\neq$ Mean.

