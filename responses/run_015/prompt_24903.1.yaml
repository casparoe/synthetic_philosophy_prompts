      *Drafting the paragraph:*
      Consider two genetically similar isolated communities, Alpha and Beta, where adult systolic blood pressure is the trait of interest. In both communities, genetic susceptibility to hypertension varies widely, and while daily sodium intake fluctuates nontrivially among families due to individual dietary choices, genetic differences account for 80% of the variance in blood pressure within each group, yielding high heritability estimates. However, Alpha adheres to a cultural norm of high-salt preservation methods, shifting their average sodium intake substantially higher than Beta's low-salt norm, creating a large gap in mean blood pressure between the communities. Despite sodium intake driving variation within each group (lowering heritability slightly from 1.0 but keeping it high), the entire difference in the group means is caused by this environmental shift in average sodium consumption, not by genetic divergence, because the founding gene pools were identical.

