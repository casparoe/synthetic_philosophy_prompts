      *   Wait, if lead exposure varies within, and lead affects cognition, then $V_E$ is non-zero. If $V_G$ is high enough, $h^2$ is high.
      *   The key is that the *mean shift* in environment is large, while the *variance* in environment within groups is small relative to genetic variance.
      *   Let's write it.

  4.  **Drafting the Analysis:**
      *   (a) Why high $h^2$? Because within each city, genetic differences swamp the relatively smaller differences in lead exposure between houses.
