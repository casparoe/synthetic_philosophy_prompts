      *   Feature: The mathematical independence of within-group variance ratios (heritability) from between-group mean differences. Specifically, that a factor can have low variance relative to genetics within groups (preserving high $h^2$) while having a large difference in means between groups (causing the gap).

      *Let's check the trait:* "Health or cognitive outcome". Cognitive score is good.
