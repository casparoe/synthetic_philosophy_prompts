      *(Drafting the Residue Section)*:
      Focus on the "Normative." Biology describes what *is* fit, not what *ought* to be worshipped. The "Divine Accommodation" becomes "Phenotypic Constraint." The "Goal" becomes "Fitness Peak." The loss of the "Lawgiver" is the biggest vanishing point.

      *(Final Polish of the Teleology argument)*:
      Can "necessary" exist without teleology? Yes, as "historical contingency." Can "lower" exist? Yes, as "less efficient." But "necessary *to reach* X" is teleological. Biology says "X was reached via Y," not "Y was required for X." This distinction is vital.

