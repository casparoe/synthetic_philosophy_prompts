      *   *Check:* Did I answer the specific question about teleology in the residue report? Yes, this needs to be the highlight.

  7.  **Final Polish:**
      *   Ensure the transition between the translation and the report is clear.
      *   Verify the evolutionary terms are used correctly (e.g., ESS, Exaptation).
      *   Make sure the "Residue Report" explicitly addresses the "limitation in biological explanation" query.

      *(Self-Correction on "Exclusively"):* The prompt asks to restate the *argumentative structure* using the vocabulary. It doesn't mean I can't mention Maimonides, but the *explanation* of his logic must use the bio terms. I will frame the translation as a "Model Mapping."

