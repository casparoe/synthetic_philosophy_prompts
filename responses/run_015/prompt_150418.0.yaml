answer: |-
  This is a sophisticated aesthetic problem that touches on ontology, reception theory, and the philosophy of art. Your conceit moves forgery from the realm of *fraud* (a moral/legal category) to the realm of *metafiction* (an aesthetic category). To explain the tension you've identified, we must dismantle the standard assumption that a forgery's value is solely contingent on its successful deception.

  Here is an analysis of the conceptual tension between causal and negative provenance, the application of Goodman's distinction, and the conditions under which your premise might collapse.

  ### 1. Causal vs. Negative Provenance

  Standard aesthetics relies on **Causal Provenance**. This is the claim that the value of an artifact is inextricably linked to the history of its production. In this view, a painting is valuable because specific causal chains (the artist's hand, mind, and historical moment) produced it. When a forgery is exposed, the causal chain is severed. The object becomes a "failed original" because it claims a causal history it does not possess. Its value drains because the *source* of the expression was misidentified.

  Your novel proposes **Negative Provenance**. Here, value is derived not from the source, but from the *gap* between the source and the attribution. In a performative forgery, the deception is not a bug; it is the medium.
  *   **Pre-Exposure:** The work functions as a "period piece." The reader engages with the text assuming the causal provenance of the modernist master (e.g., Hemingway). The aesthetic logic relies on this assumption (e.g., interpreting ambiguity as modernist fragmentation).
  *   **Post-Exposure:** The work functions as a "critique." The reader re-engages with the text knowing the causal provenance of the forger. The ambiguity is now read as *mimicry*.

  The tension lies in the fact that standard theory assumes the exposure of a forgery creates a binary: it is either a masterpiece (if real) or trash (if fake). Your conceit suggests a trinary state:
  1.  **Genuine:** Value = Expression of the Master.
  2.  **Innocent Duplicate:** Value = Null (mere replication).
  3.  **Performative Forgery:** Value = The tension between 1 and 2.

  Upon exposure, the performative forgery does not become an innocent duplicate. It retains a unique ontological status because its "fakeness" is constitutive of its meaning. It is distinct from the genuine article (which lacks the layer of critique) and the duplicate (which lacks the intentionality of the deception). The revelation of true authorship does not eliminate non-derivative worth; rather, it *unlocks* the secondary layer of worth that was structurally dependent on the initial deception.

  ### 2. Goodman's Autographic/Allographic Distinction

  Nelson Goodman, in *Languages of Art*, distinguishes between **autographic** arts (painting, sculpture) and **allographic** arts (music, literature).
  *   **Autographic:** The history of production is essential. Even a perfect physical duplicate of a painting is a forgery if it lacks the correct history of production.
  *   **Allographic:** The work is defined by a notation (text, score). If a text matches the notation, it is an instance of the work, regardless of who typed it. A printed copy of *The Great Gatsby* is aesthetically identical to the manuscript in terms of work-identity.

  **The Problem for Literature:**
  Under standard Goodmanian analysis, literature is allographic. Therefore, forgery in literature should be aesthetically irrelevant once the text is fixed. If the words are the same, the work is the same. The "fake Hemingway" should be aesthetically identical to the "real Hemingway" if the text matches, because literature has no "brushstrokes" to scrutinize for hesitation.

  **The Performative Exception:**
  Your conceit challenges this by introducing **Hidden Intentionality** as a constitutive element of the work.
  If the work is defined not just as "Text T," but as "Text T produced by Agent A under the description of Agent B," then the history of production becomes essential to the identity of the work.
  *   By weaving the hidden agency into the aesthetic logic, the forger effectively **autographicizes** the literary text.
  *   The "work" is no longer just the string of words; it is the *performance of authorship*.
  *   Therefore, a perfect copy of the text (an innocent duplicate) is *not* an instance of the performative forgery, because it lacks the specific history of deceptive production.

  In this specific case, hidden intentionality introduces an autographic dimension. The "forgery" is not a defect in the transmission of the text; it is a parameter of the work's definition. When the authorship is revealed, we are not looking at the same work with a new label; we are recognizing that the work *always was* a commentary on authorship, and we are now viewing it with the correct key.

  ### 3. Does Revelation Eliminate Worth?

  No. In standard forgery, revelation eliminates worth because the value was predicated on a falsehood (that the Master wrote it). In performative forgery, the value is predicated on the *success of the performance*.
  *   **Analogy:** Consider an actor playing Hamlet. If we think the actor *is* a prince, we are deceived. If we learn he is an actor, the performance does not lose value; it gains the value of *acting*.
  *   **Application:** The performative forgery is an act of literary ventriloquism. Before exposure, it is read as a voice. After exposure, it is read as a critique of that voice. The aesthetic experience shifts from *immersion* to *analysis*, but the object supports both.

  However, there is a risk. If the text is *too* perfect, the exposure might lead to a sense of betrayal rather than appreciation. The aesthetic logic must be robust enough to survive the shift in context. The text must reward a second reading where the stylistic choices are re-interpreted as citations rather than expressions.

  ### 4. What Would Change My Mind (Epistemic Vulnerabilities)

  To maintain intellectual rigor, I must identify the arguments that could dismantle this framework. I would be compelled to conclude that hidden intentional structure is aesthetically irrelevant, or that provenance is merely a market construct, under the following conditions:

  **A. The Intentional Fallacy (Wimsatt & Beardsley)**
  If one adheres strictly to New Criticism, the "intentional fallacy" argues that the author's intent is irrelevant to the text's meaning. The text stands alone.
  *   **The Threat:** If the "forgery" aspect is not encoded *within the text itself* (e.g., through subtle anachronisms, stylistic exaggerations, or thematic critiques of authorship that are visible only in hindsight), then the "performative" nature is merely biographical trivia.
  *   **The Tipping Point:** If a reader, knowing nothing of the forgery, cannot find a trace of the "performance" in the text even upon re-reading, then the hidden intentionality is extrinsic. If the "forgery" is only in the metadata (the claim of authorship) and not in the data (the text), then Goodman is right: literature is allographic, and the history of production is aesthetically irrelevant. The work would collapse into a mere fake upon exposure.

  **B. Indistinguishability and the "Perfect Copy" Argument**
  If the forged text is aesthetically indistinguishable from a genuine modernist text *even after exposure*, then the "negative provenance" adds no aesthetic value, only historical curiosity.
  *   **The Threat:** If the exposed forgery does not change *how we read the sentences* (e.g., we don't read a sentence as "mimicry" but still as "expression"), then the revelation is market data, not aesthetic data.
  *   **The Tipping Point:** If the shift in provenance does not alter the phenomenological experience of reading (the "aesthetic emotion"), then the distinction is purely commercial. Provenance would be revealed as a market construct (scarcity/authenticity) rather than a philosophical category (ontology of the work).

  **C. The Vulnerability of "Retrospective Encoding"**
  My reasoning is most vulnerable regarding the mechanism of the "shift." I am assuming that the revelation of authorship automatically re-contextualizes the text.
  *   **The Weak Point:** It is possible that once the deception is known, the reader simply cannot engage with the text seriously. The "magic" is broken, and the text becomes a curiosity cabinet piece. If the "unreliable narrator" analogy fails—i.e., if the reader feels *cheated* rather than *enlightened*—then the performative forgery collapses back into standard parasitic forgery. The success of your conceit depends entirely on the text being robust enough to sustain two contradictory readings simultaneously.

  ### Summary for Your Novel

  Your protagonist is not creating fakes; they are creating **conceptual art disguised as artifacts**.
  *   **Causal Provenance** is the lie the reader buys initially.
  *   **Negative Provenance** is the truth the reader discovers later.
  *   **Goodman's Limit:** Your forger is exploiting a loophole in allographic arts by making the *history of production* a semantic requirement of the text.
  *   **The Risk:** If the text doesn't reward the second reading (the post-exposure reading), the work fails. The "forgery" must be legible as "art" only after it is exposed as "fake."

  This tension is the engine of your novel: the forger must write texts that are good enough to pass as modernist classics, but structured such that their falsity is the only thing that makes them masterpieces.
