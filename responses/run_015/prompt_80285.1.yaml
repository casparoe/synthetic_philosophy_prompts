      *   Distinction (Deep vs. Reactive)? Yes (in debrief/sentencing).
      *   What goes wrong? Yes (included section).
      *   What activity can't do? Yes (included section).

  11. **Final Polish:** Ensure the tone is pedagogical and practical. Make sure the "Cause Cards" are specific enough to be useful but general enough to apply. Ensure the distinction between Galen Strawson (Basic Argument) and P.F. Strawson (Reactive Attitudes) is clear in the debrief, as the prompt asks for Galen's view but mentions reactive attitudes (which Galen discusses as a psychological inevitability despite logical impossibility).

