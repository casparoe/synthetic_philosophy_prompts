      *   *Debrief:* Explicit mapping to Premise 1, 2, 3.
      *   *Troubleshooting:* Specific advice on stopping compatibilist moves.
      *   *Limitations:* Acknowledge that the activity proves impossibility, but doesn't explain *why* we keep blaming (Strawson's P.F. Strawson influence vs. Galen Strawson). *Correction:* Galen Strawson acknowledges we can't stop believing in responsibility, even if it's impossible. The activity needs to highlight this tension.

  10. **Review against Constraints:**
      *   18 students? Yes (teams).
