answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Community Land Trust Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Board Selection Method for Spring Elections

  ### Executive Summary

  At the recent meeting, the Board discussed a proposal to replace the election of two director seats with a lottery (sortition) drawn from our 400-person membership. This memo evaluates the philosophical and practical merits of that proposal, specifically addressing the validity of the "equal-claim" argument and the feasibility of mitigating participation bias.

  **Recommendation:** I recommend we adopt a **hybrid model** for the upcoming spring cycle: one seat filled by lottery and one by election, accompanied by bylaw amendments to establish recall procedures and a stipend program. This approach tests the lottery mechanism without sacrificing institutional stability, while actively addressing the demographic biases inherent in both selection methods.

  ### 1. The Validity of the "Equal-Claim" Argument

  The proponent's argument that a lottery treats every member's claim to a seat as equal is not only genuine but aligns closely with the core mission of a Community Land Trust.

  In an electoral model, equality is limited to the *vote*, not the *candidacy*. As we have observed over the past decade, elections tend to select for traits correlated with incumbency, name recognition, and the confidence to campaign. This creates a barrier to entry that effectively disenfranchises members who are equally qualified but less assertive.

  In a CLT context, where the land is held in trust for the *entire* community, descriptive representation is vital. A lottery system operationalizes the principle that every leaseholder/member has an equal stake in governance. It shifts the source of legitimacy from "consent via campaigning" to "equality of opportunity." Therefore, the equal-claim argument is a robust justification for sortition in this specific organizational context, even if it is uncommon in corporate governance.

  ### 2. Addressing the "Decline-and-Redraw" Bias

  Objection (1) posits that a lottery will simply select a different set of the same demographic (retired professionals with free time) because they are the only ones who can accept the burden of service. This is a significant risk, but it is not a fatal flaw of the lottery itself; rather, it is a flaw in the *conditions of service*.

  We can mitigate this bias without abandoning the lottery through three specific mechanisms:

  *   **Compensation (Stipends):** The strongest predictor of who can say "yes" to volunteer governance is economic flexibility. By allocating budget for board stipends (e.g., per-meeting fees or a quarterly honorarium), we lower the opportunity cost for working-age members and parents. This does not guarantee a diverse board, but it removes the financial barrier that currently filters them out.
  *   **The "Pool-First" Method:** Instead of drawing one name and asking them to serve (repeating until acceptance), we should draw a preliminary pool of 20 members. We survey this pool for basic eligibility and willingness *before* the final draw. This preserves randomness among the *able* rather than selecting for the *most persistent*.
  *   **Term Limits:** Whether we elect or draw members, the stagnation we currently face is exacerbated by indefinite tenure. Implementing term limits ensures that even if retirees are the primary pool, the *specific* individuals rotate, preventing the formation of the current four-person clique.

  It is important to note that Objection (3) is correct: our current election system *already* selects for retirees with free time. Switching to a lottery does not worsen this demographic bias; it merely breaks the stranglehold of the specific individuals who have mastered the electoral cycle.

  ### 3. Accountability and Recall

  Objection (2) raises a valid concern regarding accountability. An elected member knows they must face the voters; a lottery member might feel insulated. However, accountability can be codified in bylaws regardless of selection method.

  I recommend we amend our bylaws to include a **recall provision**. If a board member (elected or drawn) misses more than a specified number of meetings or acts contrary to fiduciary duty, the Board or the Membership can trigger a removal vote. This ensures that "answering to no one" is not a consequence of the lottery system.

  ### 4. Proposed Path Forward

  A sudden shift to a full lottery for all open seats carries risk. The Board currently relies on institutional memory held by the long-serving members. Removing both seats from the electoral process simultaneously could result in a loss of continuity.

  **I propose the following for the Spring Cycle:**

  1.  **Hybrid Selection:** Fill one of the two open seats via lottery and one via election. This maintains a link to the traditional accountability model while integrating the equity benefits of sortition.
  2.  **Pilot Stipend:** Allocate funds to provide a modest stipend for the lottery-selected seat specifically, to test if financial support diversifies the applicant/acceptor pool.
  3.  **Bylaw Amendment:** Adopt a recall policy applicable to all directors to address accountability concerns.
  4.  **Term Limits:** Begin a discussion on implementing term limits for all seats to prevent future stagnation, regardless of selection method.

  ### Conclusion

  The "equal-claim" argument is philosophically sound and mission-aligned for a CLT. The "decline-and-redraw" bias is real but can be mitigated through financial support and procedural adjustments rather than abandoning the lottery. By adopting a hybrid model, we can break the current cycle of stagnation while managing the risk to board stability.

  I move that we form a small committee to draft the necessary bylaw amendments for a hybrid selection process to be presented for a vote at the next meeting.
