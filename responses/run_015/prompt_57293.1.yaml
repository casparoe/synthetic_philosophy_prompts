              *   *The "Draft" Model:* You are selected, you have to opt-*out* rather than opt-*in*. (Psychological shift, but still voluntary).
              *   *Hybrid Model:* Elect some, lottery some.
              *   *Term Limits:* If the goal is new blood, term limits on elections might be easier than a full lottery.
              *   *Addressing the specific mechanism:* To fix the "who says yes first" bias, you need to reduce the barrier to saying "yes." Compensation is the big one. Also, clear time commitments.
              *   *Wait, can you fix it *without* giving up the lottery?* Yes, by changing the *conditions* of service, not the selection method. If working parents can afford to serve (stipend/childcare), the pool of "yes" becomes more diverse.

