  2.  **Deconstruct the Specific Questions:**

      *   **Question 1: Is "equal-claim" a valid argument for sortition in this context?**
          *   *Theory:* Sortition (selection by lot) is historically rooted in the idea of political equality. In a democracy, voting implies representation, but sortition implies *descriptive representation* (the board looks like the membership).
          *   *CLT Context:* CLTs are specifically designed to be community-controlled. The "community" aspect is crucial. If 400 people own/lease the land, do they all have an equal stake? Yes. Does an election capture that? Not if the same 4 people win every time.
          *   *Validity:* Yes, it is a genuine argument. It shifts the legitimacy source from "consent of the governed via voting" to "equality of opportunity to serve." It breaks the incumbent advantage.
          *   *Nuance:* It's not just about equality; it's about breaking the *cycle* of the same people.

      *   **Question 2: Can the "decline-and-redraw" problem be fixed?**
          *   *The Problem:* If you draw names, many say "no." You keep drawing until someone says "yes." The first person to say "yes" is likely the one with the most free time (retiree, unemployed, flexible schedule). This recreates the demographic bias of the election system.
