          *   *Stand 2:* The "Cascading" idea is better described as the *constitution of an Institutional Fact through Collective Acceptance* (Searle), not a new illocutionary type.
          *   *Stand 3:* Austin's "void" distinction breaks down when the "procedure" is the social reality itself, which is fluid.
