  9.  **Self-Correction during drafting:** I initially thought about calling it a "Verdictive." But Schabowski wasn't judging; he was announcing policy. Declaration is better. I need to be careful not to say the theory *fails*, but that the *application* reveals the contingency of institutional facts. The student asks if the theory predicts this easily. I should argue it *doesn't* predict it easily; it requires stretching the notion of "procedure."

