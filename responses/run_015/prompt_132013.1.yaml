      *   *The Tension:* Standard Speech Act Theory (SAT) usually locates success at $t_1$ (utterance). The user suggests success is determined at $t_2$ (consequence).
      *   *Institutional Facts:* Searle argues institutional facts exist because of collective acceptance. If the crowd/guards *accept* the border is open, it *becomes* open (de facto if not de jure).
      *   *Is "Cascading Declaration" new?* It sounds like a mix of *Perlocutionary Object* (Austin) and *Status Function* (Searle). It resembles "Ratification" in some legal theories, or "Uptake as Constitutive" (some contemporary readings).
      *   *Counterfactual:* If no one went to the wall, would it be a misfire?
          *   *Strict Austin:* Yes, if authority was lacking, it was void regardless of effects.
          *   *Searlean:* If collective acceptance didn't happen, the status function fails.
      *   *Broadcasters:* They are performing *Assertives* (reporting) which function as *Directives* (telling people they can go) or even *Declarations* (in the court of public opinion).

  5.  **Formulate Commitments & Critique:**
