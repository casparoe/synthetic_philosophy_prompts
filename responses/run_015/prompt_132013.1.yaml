      *   **Constraints:** Be explicit about theoretical silence. State commitments clearly (defend, qualify, or contest). Don't hedge. Call out confusion if present.

  2.  **Deconstruct the Case (Schabowski's Utterance):**
      *   *Context:* GDR Politbüro member, official press conference.
      *   *Content:* "Private travel abroad can be applied for... visas will be issued immediately... effectively immediately, without delay." (*Ab sofort, unverzüglich*).
      *   *Authority:* He *was* a spokesman, but arguably lacked the specific procedural authority to enact the change *at that specific moment* (embargoed until morning, not fully briefed).
      *   *Effect:* Immediate mass movement, guards opened borders, regime collapsed.

  3.  **Map Theory onto Case (Austin/Searle):**
      *   *Austin's Constative/Performative:* It looks performative (changing reality), but relies on constative content (describing regulations).
      *   *Illocutionary Force:* Is it an *Assertive* (describing the law) or a *Declaration* (making it so)?
          *   *Searle:* Declarations change the world to match the proposition. Assertives describe the world.
          *   *Schabowski:* He thought he was asserting a decision already made (to be implemented tomorrow). He *said* it was effective now.
      *   *Felicity Conditions (Austin):*
          *   (A.1) Conventional procedure exists? Yes (GDR law-making).
          *   (A.2) Particular persons/circumstances? Schabowski was the spokesman, but was he the *right* person for *this* timing? (Procedural flaw).
          *   (B.1) Executed correctly? No (wrong time).
          *   (B.2) Completely? Yes.
          *   (Γ.1/2) Sincerity/Intent? He believed it (mostly), but intent regarding the *timing* was confused.
      *   *Misfire vs. Abuse:*
          *   *Misfire:* Act not achieved (void). If he lacked authority, it's a misfire.
          *   *Abuse:* Act achieved but insincere/improper.
