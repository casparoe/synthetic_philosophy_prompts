      *   *Uptake:* Austin requires uptake (understanding). Here, uptake involved *action* (going to the wall). This blurs illocution (meaning) and perlocution (effect).

  4.  **Map Case onto Theory (The "Cascading Declaration"):**
      *   *User's Concept:* Validity fixed retrospectively by uptake/chain of events.
