  8.  (Self-Correction on the NP formulation): The user writes $Cr(A | Ch = f \land E) = f(A | Ch = f)$. This is the standard "New Principle" formulation. I should confirm this is accurate enough for the essay. Yes, it is.

  9.  (Self-Correction on the "Question Begging" point): The user says: "If f is correct, then futures that would make f incorrect presumably have chance zero conditional on f being correct." This is the weak point. Lewis explicitly denies this. $f(Ch=f)$ is high, but not 1. $f(Undermining)$ is low, but not 0. The user needs to argue why this assignment is *illegitimate*, not just that it looks weird.

