answer: |-
  The crux here is the tension between the graded nature of psychological relations and the binary nature of prudential concern. Standard Parfit questions allow students to recite that 'identity is not what matters.' This dial forces them to decide if 'what matters' itself comes in degrees. If it does, survival is vague, and rational anticipation becomes calculative. If it doesn't, Reductionism reinstates a sharp boundary, undermining its motivation. The question tests whether they can distinguish connectedness (degrees) from continuity (branches) and assess the cost of either option.

  ***

  **Exam Question**

  Consider a teletransporter with a fidelity dial (1–100). At 100, the replica has all your memories and traits; at 1, only your temperament. Scanning destroys the original. Consider four cases: (1) One replica at 100; (2) One replica at 40; (3) Two replicas at 100; (4) Two replicas at 40.

  Reductionism claims identity is not what matters; rather, what matters is psychological relation R. Does Reductionism have the resources to make sense of the dial? Specifically, must 'what matters' come in degrees like the dial, or is there a threshold? If it comes in degrees, how does this alter prudential rationality? If there is a threshold, where does it sit? Finally, in the double-replica cases, does branching divide, double, or leave unchanged the amount of 'what matters' present? Argue for a consistent position.

  ***

  **Model Answer**

  Reductionism must accept that what matters comes in degrees, directly correlating to the fidelity dial's adjustment of psychological connectedness. To deny this is to posit a sharp threshold where none exists psychologically, reintroducing the very metaphysical arbitrariness Reductionism seeks to avoid. If a replica at setting 40 shares my values and long-term plans, denying that this matters for survival simply because it falls below a stipulated cutoff is dogmatic. It treats 'what matters' as secretly identical to identity, which contradicts the reductionist premise. Therefore, survival is not a binary fact but a graded relation. The dial does not break the view; it clarifies that 'survival' was never the right concept anyway. Only relation R matters, and R comes in degrees.

  This forces a significant revision of prudential rationality. Traditionally, we anticipate survival or death as distinct states. Under this dial view, we cannot simply anticipate survival; we must weigh expected degrees of survival. Caring about the replica at 40 is rational, but less so than caring about the replica at 100. This sits oddly with standard decision theory, which usually assumes binary outcomes for self-concern. However, this is the honest cost of the view. We must accept that prudential concern scales with psychological connectedness. The fear of death diminishes gradually as the dial lowers, rather than vanishing at a specific point. A reductionist should be willing to pay less to ensure a setting of 40 than a setting of 100, reflecting the diminished degree of what matters.

  Regarding the distinction between connectedness and continuity, the dial varies connectedness directly. Continuity requires overlapping chains of connectedness. In the single replica cases, continuity holds if connectedness is strong enough. In the double cases, continuity holds for both branches. The crucial question is whether branching divides what matters. It does not. Relation R is not a fixed quantity divided among recipients. Two replicas at 40 contain more total psychological connectedness to the original than one replica at 40. While identity cannot double, what matters can. Thus, case (4) is prudentially preferable to case (2), even if neither preserves identity. There is more of me, in what matters, in the world if two exist rather than one.

  Some might argue that branching creates uncertainty that undermines concern. But Reductionism separates concern from identity. If what matters is R, and R is present twice, then what matters is present twice. The only objection is practical confusion for the replicas, but from the pre-scan perspective, the output of what matters is doubled. The Reductionist concludes that the dial reveals survival is vague and branching is beneficial. This accepts the complexity of graded concern over the false comfort of binary identity. The cost is a complicated prudential calculus, but the benefit is a view that respects the actual structure of psychological relations without imposing magical boundaries.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Connectedness vs. Continuity (4 marks):** Must distinguish that the dial varies connectedness (degrees) while branching affects continuity (structure).
      *   *Common Error:* Treating connectedness and continuity as interchangeable terms.
  2.  **Degrees vs. Threshold (4 marks):** Must argue whether 'what matters' admits of degrees or requires a sharp cutoff, justifying the choice.
      *   *Common Error:* Asserting a threshold exists without explaining why it isn't arbitrary.
  3.  **Prudential Rationality (4 marks):** Must explain how graded survival changes decision-making (e.g., scaling concern vs. binary anticipation).
      *   *Common Error:* Ignoring the implication for rationality and treating concern as all-or-nothing.
  4.  **Branching Valuation (4 marks):** Must take a stance on whether two replicas contain more, less, or the same 'what matters' as one.
      *   *Common Error:* Assuming what matters divides like identity (i.e., claiming 2 @ 40 = 1 @ 40).
  5.  **Cost to Reductionism (4 marks):** Must evaluate the theoretical cost (e.g., vagueness vs. arbitrariness) of the chosen position.
      *   *Common Error:* Failing to note the tension between graded relations and binary rationality.

  ***

  **Boundary Note**

  A low A paper engages deeply with the prudential calculus implication of degrees, whereas a high B paper describes the dial accurately but treats prudential concern as static. Papers fall into the C range when they revert to summarizing the standard Teletransporter argument without engaging the specific pressure the dial places on the threshold problem.
