          2.  *Mandate:* Founding document requires "narrowing disparities." The procedure can't forbid relational considerations outright but must identify and handle components aimed *only* at changing the gap.
          3.  *Format:* A written procedure (approx. 20 mins/proposal), ordered questions, stop points, value vs. fact distinction.
