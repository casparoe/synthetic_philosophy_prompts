answer: |-
  **To:** The Allocations Committee, Mercer Valley Community Health Trust
  **From:** [Your Name/Consultant]
  **Subject:** The Mercer Prioritisation Protocol (MPP) – Draft for September Meeting

  ### Part 1: Philosophical Clarifications

  Before presenting the procedure, I must address the two conceptual difficulties you raised. The procedure rests on these answers.

  **1. The Data Problem: Rank vs. Relation**
  You asked: *If the weight a benefit receives depends on where its recipients sit relative to other people, have we quietly bought back the relational view?*

  **Answer:** Yes, formally, but not fatally.
  Because your deprivation index is ordinal (deciles based on ranking), a district's weight *does* depend on other districts. If every district improved equally, the decile boundaries would shift, and weights would remain the same. However, if the "best" district improved massively while the "worst" stayed still, the gap widens, but the worst district's weight remains high.
  **The Cost:** You are using a relative proxy (decile) to measure an absolute moral claim (priority for the suffering). This means your weights track *local poverty* rather than *absolute suffering*.
  **The Test:** The procedure does not test whether the index is relative (you cannot change that). It tests whether the *proposal's justification* relies on the gap.
  **Procedure Instruction:** Treat Decile 1 as "High Need" and Decile 10 as "Low Need" as if these were absolute categories. Do not adjust weights during the meeting based on how the gap looks. The "relational view" you objected to is the claim that *narrowing the gap is itself a good*. The MPP treats *helping the needy* as the good; narrowing the gap is merely a likely side-effect.

  **2. The Mandate Problem: Narrowing Disparities**
  Your founding document requires narrowing disparities. The MPP complies by prioritising the worst-off. However, it distinguishes between:
  *   **Instrumental Narrowing:** Helping the poor raises their floor, narrowing the gap as a consequence. (Permitted/Encouraged)
  *   **Constitutive Narrowing:** Changing the statistics of the gap without raising the floor. (Forbidden)
  The procedure identifies and rejects the second type.

  ---

  ### Part 2: The Mercer Prioritisation Protocol (MPP)

  **Time Required:** 20 Minutes per Proposal
  **Prerequisites:** Staff must provide the "Benefit Estimate Sheet" (see Step 2) prior to the meeting.

  #### Step 1: The "Leveling Down" Filter (3 Minutes)
  *Goal: To reject proposals that narrow gaps by harming the better-off without helping the worse-off.*

  **Question 1.1:** Does this proposal withdraw or reduce an existing service for any group?
  *   **No:** Proceed to Step 2.
  *   **Yes:** Ask Question 1.2.

  **Question 1.2:** Is the resource saved from that withdrawal used to fund a *new* direct service for a worse-off group?
  *   **Yes (New Service):** Proceed to Step 2. (This is a trade-off, not leveling down).
  *   **No (Monitoring/Admin/Statistical):** **STOP.** Reject Proposal.
      *   *Reason:* The proposal reduces total well-being to achieve a statistical equality. This violates the Pareto principle and the Trust's duty to residents.
      *   *Action:* Draft Rejection Statement (see Case 2 below).

  #### Step 2: Benefit Estimation under Uncertainty (5 Minutes)
  *Goal: To quantify benefit without penalising hard-to-measure interventions.*

  **Instruction:** Do not demand a single number. Use the **Benefit Band System**.
  Staff will have classified the proposal's total annual benefit into one of three bands, based on comparable interventions:
  *   **Band A (Low):** < 500 Standard Benefit Units (SBUs)
  *   **Band B (Medium):** 500 – 2,000 SBUs
  *   **Band C (High):** > 2,000 SBUs

  **Question 2.1:** Is the evidence for this proposal strong enough to rule out Band A?
  *   **No:** Assign **Band A**. (If evidence is weak, assume low benefit).
  *   **Yes:** Ask Question 2.2.

  **Question 2.2:** Is the evidence strong enough to rule out Band B?
  *   **No:** Assign **Band B**.
  *   **Yes:** Assign **Band C**.

  *Note: 1 SBU is roughly equivalent to one resident receiving a clinically significant health intervention (e.g., vaccination, resolved housing crisis, 10 nursing visits).*

  **Question 2.3 (Uncertainty Check):** Is the primary recipient group in Deciles 1-3?
  *   **Yes:** You may upgrade the Benefit Band by one step (e.g., from A to B) *if* the qualitative case for impact is compelling, to account for measurement difficulty in deprived areas.
  *   **No:** Keep the assigned Band.

  #### Step 3: Priority Weighting (2 Minutes)
  *Goal: To apply the prioritarian weight based on deprivation.*

  **Instruction:** Identify the primary Decile of the recipients. Apply the **Priority Multiplier (PM)**.
  *Because we lack a cardinal scale, we use a linear step-weight.*

  *   **Deciles 1-2:** PM = 2.0
  *   **Deciles 3-4:** PM = 1.7
  *   **Deciles 5-6:** PM = 1.4
  *   **Deciles 7-8:** PM = 1.1
  *   **Deciles 9-10:** PM = 1.0

  *Note: This specific slope (2.0 to 1.0) is a placeholder. See Step 5.*

  **Calculation:** Take the midpoint of the Benefit Band (A=250, B=1250, C=3000) and multiply by the PM.
  *   *Result:* **Weighted Benefit Score (WBS).**

  #### Step 4: The Dynamic Ranking Check (2 Minutes)
  *Goal: To ensure success is not penalized.*

  **Question 4.1:** If this proposal succeeds perfectly, will the recipient district move to a higher (less deprived) decile in future years?
  *   **Yes:** **Ignore this.** Score the proposal based on the *current* decile. Do not discount the score because future weights might drop.
  *   **No:** Proceed.

  *Rationale:* We score the need as it exists today. Reducing future need is a success, not a loss of priority status.

  #### Step 5: The Value Question (5 Minutes)
  *Goal: To expose the moral trade-off rather than hiding it.*

  **Instruction:** The Priority Multiplier in Step 3 is a value judgment. It represents how much we value a benefit to the worst-off over the average.
  *   **Conservative Slope:** Decile 1-2 PM = 1.5
  *   **Steep Slope:** Decile 1-2 PM = 3.0

  **Action:** Calculate the WBS twice. Once with the Conservative Slope, once with the Steep Slope.
  *   **If the proposal wins funding under both:** It is a robust priority.
  *   **If the proposal wins only under the Steep Slope:** It is a **Value-Dependent Choice**.
  *   **If the proposal loses under both:** It is not fundable.

  **Decision Point:** If the ranking of two proposals flips depending on the Slope, the Committee must vote explicitly on the Slope, not the proposal. *This is the only question the procedure cannot answer.*

  #### Step 6: Cost Efficiency Check (3 Minutes)
  *Goal: To ensure fiscal responsibility.*

  **Question 6.1:** Divide the Total Cost by the Unweighted Benefit Band Midpoint.
  *   **Result:** Cost Per SBU.
  *   **Threshold:** If Cost Per SBU is > 2x the Trust average, the proposal requires a unanimous vote to pass, regardless of Weighted Benefit.

  ---

  ### Part 3: Application to Cases

  Here is how the MPP applies to the three scenarios you provided.

  #### Case 1: Home-Visiting (HV) vs. Falls-Prevention (FP)

  **Data:**
  *   **HV:** 200 families, Deciles 1-2. Cost \$900k. Evidence: Strong. Benefit: Modest per family, high intensity.
      *   *Benefit Estimate:* 200 families $\times$ 2 SBUs/family = 400 SBUs (Band A/B border). Let's assign **Band B (1,250 SBUs)** due to Step 2.3 upgrade (Decile 1-2).
      *   *Cost Per SBU:* \$900,000 / 1,250 = **\$720/SBU**.
  *   **FP:** 11,000 residents, Deciles 5-6. Cost \$600k. Evidence: Very Strong. Benefit: Large scale.
      *   *Benefit Estimate:* 11,000 residents $\times$ 0.2 SBUs/resident = 2,200 SBUs (Band C). Assign **Band C (3,000 SBUs)**.
      *   *Cost Per SBU:* \$600,000 / 3,000 = **\$200/SBU**.

  **Scoring (Using Step 3 Multipliers):**
  *   **FP Score:** 3,000 SBUs $\times$ 1.4 (Decile 5-6) = **4,200 WBS**.
  *   **HV Score:** 1,250 SBUs $\times$ PM (Decile 1-2).

  **The Crossover:**
  For HV to beat FP (4,200 WBS), the HV Weighted Score must exceed 4,200.
  $1,250 \times \text{PM} > 4,200$
  $\text{PM} > 3.36$

  **Analysis:**
  *   Under the **Standard Slope** (PM = 2.0): HV Score = 2,500. **FP Wins.**
  *   Under the **Steep Slope** (PM = 3.0): HV Score = 3,750. **FP Wins.**
  *   **Crossover Value:** The Priority Multiplier for Decile 1-2 must exceed **3.36** for HV to win.

  **Committee Decision:**
  The procedure dictates that **Falls-Prevention ranks higher** unless the Committee explicitly votes that a benefit to the worst-off is worth *more than 3.36 times* a benefit to the middle deciles.
  *   *Honest Answer:* The procedure does not give a definitive ranking. It tells you that funding Home-Visiting requires a moral commitment to priority weighting that is significantly steeper than the standard prioritarian view. If you are not willing to assert that Decile 1 benefits are worth 3.4x Decile 5 benefits, you must fund Falls-Prevention.

  #### Case 2: The "Leveling Down" Proposal (Monitoring Post)

  **Proposal:** Cut outreach in Deciles 9-10. Fund a Disparities Monitoring Post.
  **Step 1 Application:**
  *   **Q1.1:** Does it withdraw service? **Yes** (Outreach in Deciles 9-10).
  *   **Q1.2:** Is resource used for new direct service? **No** (It funds a monitoring post).
  *   **Result:** **STOP. REJECT.**

  **Published Reason (for Board and Applicants):**
  > "While the Trust is committed to narrowing health disparities, our mandate requires that we do so by improving the condition of residents, not by withdrawing support to alter statistics. This proposal reduces total service coverage without delivering a direct health benefit to a higher-need group. The MPP prioritises instrumental narrowing (lifting the floor) over constitutive narrowing (lowering the ceiling). Therefore, this proposal is ineligible for funding."

  #### Case 3: The Flagship Meals Service

  **Proposal:** Meals for isolated elderly in Deciles 1-2.
  **Data:** Cost per unit of benefit is very high (e.g., \$2,000/SBU). Evidence is anecdotal.
  **Step 2 Application:**
  *   Evidence is weak. Cannot rule out Band A.
  *   Step 2.3 Upgrade applies (Decile 1-2). Move Band A to Band B.
  *   *Benefit:* 1,250 SBUs.
  *   *Cost:* \$2,000/SBU (Total Cost \$2.5M for example).
  **Step 3 Application:**
  *   Weight (Decile 1-2): PM = 2.0 (Standard) or 3.0 (Steep).
  *   WBS (Standard): 2,500.
  *   WBS (Steep): 3,750.
  **Step 6 Application:**
  *   Cost Per SBU is \$2,000. Trust Average is likely ~\$400.
  *   This is > 2x average.
  *   **Result:** Requires Unanimous Vote.

  **Analysis:**
  Even at the Steep Slope, the Meals Service produces fewer Weighted Benefits per dollar than almost any other proposal.
  *   *Honest Answer:* The procedure rejects this proposal. It identifies that the Committee's attachment to this service is based on *sentiment* or *visibility*, not *prioritised need*. To fund it, the Committee must admit they are overriding the MPP based on non-procedural values. The procedure forces you to own that choice rather than hiding it behind "benefit" claims.

  ---

  ### Part 4: Limitations and Warnings

  You asked what the procedure cannot do. Trust it, but do not worship it.

  **1. Disagreements It Will Not Resolve**
  The MPP cannot resolve the **Steepness Parameter**. If half the committee believes the worst-off deserve 2x priority and the other half believes they deserve 5x priority, the math will yield different winners. The procedure exposes this; it does not solve it. You must vote on the *value*, not the *project*.

  **2. Judgment Dressed as Arithmetic**
  *   **Benefit Bands:** Assigning a proposal to Band A, B, or C is a judgment call. Staff bias can influence this. *Mitigation:* Require staff to cite two comparable past grants for every Band assignment.
  *   **The Decile Proxy:** As discussed, using deciles assumes Decile 1 today is comparable to Decile 1 five years ago. If inflation or crisis shifts the baseline, the weights may drift. *Mitigation:* Review the Multipliers annually.

  **3. Where You Will Go Wrong**
  *   **The Sunk Cost Fallacy:** You will want to fund the Flagship Meals Service (Case 3) because "we've always done it." The MPP will tell you "No." If you override it, acknowledge you are suspending the protocol for political reasons. Do not pretend the math supports you.
  *   **The Precision Trap:** Do not argue over whether a benefit is 1,200 or 1,300 SBUs. The Bands are wide for a reason. If the decision hinges on a difference of 100 SBUs, the proposals are effectively tied; use a coin toss or geographic spread, not false precision.
  *   **The Relational Slip:** Do not adjust the Multipliers mid-year because "the gap looks too wide." The Multipliers are fixed moral weights, not dials to manage the index.

