  2.  **Deconstruct the Philosophical/Technical Problems:**

      *   **Prioritarianism vs. Egalitarianism:** The user objects to "leveling down" (making some worse off to reduce inequality without helping others). This is a classic objection to strict egalitarianism. Prioritarianism (giving weight to benefits based on absolute level of well-being) avoids this *in theory*.
      *   **The Data Problem (Ordinal vs. Cardinal):** Prioritarianism usually requires cardinal well-being (to know *how much* worse off someone is to apply a concave transformation). The Trust only has deciles (ordinal).
          *   *Risk:* If weights are based on *rank* (Decile 1 gets weight 1.5, Decile 10 gets weight 1.0), is this relational? Yes, technically, because rank depends on others. However, if the weight is attached to the *absolute deprivation status* represented by the decile (assuming Decile 1 is always "very bad"), it functions like a proxy for absolute prioritarianism.
          *   *Solution:* We must treat the Decile as a proxy for absolute need, not relative standing. The "relational" trap is if we change weights *because* the gap changed, not because the absolute need changed. The procedure must test: "Does this weight depend on where others are, or on the absolute condition of the recipient?"
      *   **The Mandate Problem:** The board wants "narrowing disparities."
          *   *Solution:* Distinguish between *instrumental* narrowing (helping the poor raises them up, narrowing the gap as a side effect) and *constitutive* narrowing (changing the gap is the goal). The procedure must flag proposals where the *only* benefit is statistical narrowing.
      *   **The Value Question:** The "priority weight function" (how much extra weight for the worst off). This is the "steepness parameter." The procedure cannot solve this; it must expose it.
      *   **Uncertainty:** Hard-to-measure benefits (common in deep poverty work) shouldn't be penalized.
          *   *Solution:* Use ranges or qualitative bands for benefit estimation, not single point estimates.
      *   **Dynamic Rankings:** If a project succeeds, the district moves up a decile, lowering future weight.
          *   *Solution:* Score based on *current* baseline. Do not penalize success. The goal is to help the person *as they are now*.

  3.  **Drafting the Procedure (The "Mercer Valley Prioritisation Protocol"):**

      *   *Structure:* Step-by-step, time-boxed.
      *   *Step 1: The Relational Filter (The "Leveling Down" Check).* Does this narrow the gap without helping anyone? If yes, Reject.
      *   *Step 2: Benefit Estimation.* Handle uncertainty. Use "Benefit Units" (BUs). Allow ranges.
      *   *Step 3: Priority Weighting.* Map Deciles to Weights. Acknowledge the ordinal limit.
      *   *Step 4: The Calculation.* Weighted Benefit = Benefit $\times$ Weight.
      *   *Step 5: The Value Parameter.* Explicitly identify the "Steepness" choice.
      *   *Step 6: Dynamic Check.* Ignore future rank changes for scoring.

  4.  **Addressing the Specific Philosophical Query (Rank vs. Relation):**

      *   *Question:* If weight depends on rank, is it relational?
      *   *Answer:* Yes, formally. But functionally, if the Decile represents *absolute* deprivation thresholds (e.g., income, health outcomes), it acts as a proxy for absolute status.
