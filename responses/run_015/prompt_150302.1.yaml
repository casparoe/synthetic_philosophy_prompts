  7.  **Addressing the "Uncertainty" Constraint:**

      *   Proposals for the worst-off have weak evidence.
      *   Procedure instruction: Do not use point estimates. Use "Conservative," "Expected," and "Optimistic" benefit scenarios. If a proposal wins only on "Optimistic," flag it. If it wins on "Conservative," strong candidate.
