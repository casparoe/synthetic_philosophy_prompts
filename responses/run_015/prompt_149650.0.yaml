answer: |-
  Your skepticism regarding reflective equilibrium as a mere cleaning procedure is well-founded and points directly to the most philosophically fertile ground in your proposed area of study. The problem of normative sedimentation, where biases reshape the standards of coherence themselves, suggests that internal consistency is insufficient for moral validity. Given your three-year timeline, your background in logic and conceptual analysis, and your lack of resources for large-scale empirical work, I would argue that your primary research energy should be directed toward the meta-level question of whether the distinction between preference and bias holds up under the condition of sedimentation. This is the most upstream task because it determines the viability of the entire project. If the ideal of a preference untainted by bias is indeed misleading, then attempting to model preference change or map specific cognitive distortions becomes an exercise in optimizing a flawed framework. By focusing first on conceptual analysis, you can leverage your existing strengths to define what counts as a legitimate moral development versus a bias reinforcement without needing laboratory access. This work involves dissecting the normative commitments embedded in our psychological concepts and arguing for a revised taxonomy of moral entanglement. The tractability here is high for a philosopher, as it relies on argumentation and literature synthesis rather than data collection. You should be prepared to diminish the importance of this line only if emerging work in social psychology provides robust, norm-independent markers of bias that render the conceptual distinction obsolete, though such evidence is currently scarce. Conversely, if you find that existing ethical theories cannot accommodate the reality of sedimentation without contradiction, this confirms the priority of your conceptual work.

  Once you have established the conceptual boundaries, your second priority should be the overlooked question of institutional mechanisms for external correction. Since you have identified that internal reflective practices may be compromised by the very biases they seek to eliminate, the solution must partially lie outside the individual mind. This direction is upstream of specific cognitive mapping because it addresses the structural conditions under which deliberation occurs. It is highly tractable for someone with your background, as it involves applying tools from social epistemology and political philosophy to the design of ethics review protocols or deliberative bodies. You can analyze how dissent, diversity of perspective, and procedural constraints function as external checks on normative sedimentation. This aligns perfectly with your goal of informing institutional design. The importance of this direction would elevate if case studies of institutional failure reveal that individual deliberative training consistently fails to prevent ethical blind spots, suggesting that structural fixes are necessary. You would diminish its priority only if you discover that institutional mechanisms invariably introduce their own forms of bias that are harder to correct than individual ones, though the current literature on collective intelligence suggests otherwise. This focus ensures your dissertation has practical traction without requiring you to become an empirical psychologist.

  Your third priority should be the selective engagement with empirical psychology to determine which cognitive distortions remain corrigible. This is downstream of the conceptual work because you need a theoretical framework to interpret what corrigibility means in a moral context. It is also downstream of the institutional focus because individual corrigibility may depend on the external structures you analyze in the second phase. While you cannot run experiments, you can critically evaluate existing literature on cognitive debiasing and moral development to see which strategies survive the test of normative sedimentation. This is tractable as a literature-based project, but it risks becoming a survey if not anchored by the strong conceptual claims from your first priority. You should elevate this direction if you find that specific cognitive interventions show high efficacy across diverse contexts, suggesting a universalizable method for individuals. However, you should diminish its importance if the evidence remains too context-dependent or if the psychological mechanisms are too opaque to inform normative theory. This line of work supports the other two but should not drive them, as empirical data alone cannot resolve the normative question of what counts as a correction versus a new distortion.

  I would actively deprioritize the development of formal models of preference change over time. While intellectually rigorous, this direction is the least tractable given your constraints and the current state of the field. Formal modeling often requires mathematical expertise and longitudinal data that you do not have access to, and it risks abstracting away the very normative nuances you aim to capture. Furthermore, it is downstream of the conceptual work; you cannot model legitimate moral development without first defining it philosophically. Investing significant time here would likely yield diminishing returns for your goal of building a workable framework for institutions or individuals. Unless you encounter a specific logical paradox in the concept of preference change that demands formalization to resolve, this work should remain secondary. The risk is that you spend years building a model that rests on shaky conceptual foundations, whereas strengthening those foundations directly offers more immediate progress.

  In summary, your three-year agenda should begin by securing the conceptual ground, determining whether the preference-bias distinction needs reconstruction in light of sedimentation. This sets the terms for everything else. Next, you should pivot to institutional design, exploring how external structures can compensate for internal reflective limitations. This ensures your work has practical application. Finally, you should engage selectively with empirical psychology to refine your understanding of corrigibility, using it to support rather than lead your arguments. By ordering your work this way, you respect your strengths in analysis while addressing the deep structural problems you have identified. If during your first year you find that the conceptual distinction collapses entirely, you would shift focus exclusively to the institutional mechanisms for managing entanglement rather than separating it. If however, you find the distinction holds but is fragile, you would double down on the institutional safeguards. This approach keeps your project coherent, feasible, and philosophically significant, avoiding the trap of trying to solve empirical problems with conceptual tools or vice versa.
