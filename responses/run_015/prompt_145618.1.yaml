      *   **The Impossibility:** Explain the deadlock/conflict in DS terms.
      *   **Mapping Analysis:** Evaluate the Local Autonomy/Global Consistency mapping.
      *   **The Residue:** Discuss Normativity vs. Constraints.
      *   **Settled vs. Contested:** Separate the math from the philosophy.

  10. **Self-Correction/Polishing during drafting:**
