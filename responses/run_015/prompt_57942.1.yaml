answer: |-
  This is a classic "welcome to philosophy" moment: your friend gave you the **standard deflationary account** (mostly associated with philosopher Alfred Mele), which is the dominant view in contemporary philosophy of mind. It's clean and logical, but as you suspected, it sands off some of the messy edges that make self-deception feel real.

  Here is the breakdown of what's right, what's fudged, how the "lying" proponents fight back, and how to use your two examples to crush it in section tomorrow.

  ### 1. What Your Friend Got Right (The Deflationary Account)
  Your friend is correct that the **"Static Paradox"** is the main reason philosophers moved away from the "lying to yourself" model.
  *   **The Paradox:** To lie to someone else, I must know the truth ($\neg p$) and intend to make you believe the lie ($p$). If I do this to myself, I must simultaneously believe $\neg p$ (to know the truth) and believe $p$ (to be deceived). That violates the laws of logic (you can't consciously hold contradictory beliefs).
  *   **The Fix:** Your friend describes the **Motivational Account**. You don't *intend* to deceive yourself. Instead, your desire for $p$ to be true biases how you gather evidence. You scrutinize evidence against $p$ super hard, but accept evidence for $p$ easily.
  *   **Result:** You end up believing $p$ without ever having to consciously hold $\neg p$ at the same time. The logical paradox dissolves because there was never a moment of "knowing the truth and hiding it."

  ### 2. What Is Fudged or Overstated
  Your friend's explanation is a bit too tidy in two specific ways:

  **A. "Pretty much everyone dropped the lying model."**
  *   **Reality:** This is false. **Intentionalist accounts** still have defenders (e.g., Robert Bach, Keith Lehrer). They argue that the deflationary account explains *bias*, but it doesn't explain *deception*.
  *   **The Pushback:** If I just make a mistake because I'm wishful, that's an error, not a deception. Deception implies **agency** and **responsibility**. If self-deception is just a glitch in my evidence-processing software (like an optical illusion), why do we feel guilty about it? Intentionalists argue we need to keep the "lying" element to explain the moral weight. They often propose a "partitioned mind" (like Freud's unconscious) where one part knows the truth and hides it from the other part.

  **B. "The puzzle disappears."**
  *   **Reality:** The *logical* puzzle disappears, but the **phenomenological puzzle** remains.
  *   **The Pushback:** Self-deception often *feels* like a struggle. It feels like there is a part of you resisting the truth. The deflationary model makes it sound too passive ("Oh, my desires just biased me!"). It struggles to explain cases where we actively avoid information (like your banking app example).

  ### 3. Applying This to Your Examples (Section Prep Gold)
  This is the most important part for your class. Your two examples actually fall into **different categories** of self-deception, and distinguishing them will show you really get the material.

  #### Example 1: The Readings (Skimming abstracts but feeling confident)
  *   **Friend's View (Motivational):** This fits the deflationary model perfectly.
      *   **Desire:** You want to be a good student / avoid anxiety.
      *   **Mechanism:** You skim the abstract. It sounds plausible. Your brain goes, "See? I get it." You don't actively think "I haven't read this." You just fail to probe the depth of your ignorance because that would feel bad.
      *   **Verdict:** This is **Hot Cognition**. You aren't lying; you are biased. You walk into section genuinely thinking you know more than you do.
  *   **Lying Model Pushback:** An intentionalist might say you *did* have a fleeting thought ("I didn't read this") and actively suppressed it to boost confidence. But the Friend's model is stronger here.

  #### Example 2: The Banking App (Deleting the app to avoid the balance)
  *   **Friend's View (Motivational):** This is harder for the friend's model to explain cleanly.
      *   **Mechanism:** This isn't just biasing evidence; this is **Willful Ignorance** (or Strategic Ignorance). You took a physical action to prevent the truth from entering your mind.
      *   **The Problem:** To decide to delete the app, you had to suspect the balance was bad ($\neg p$). If you suspected it was bad, you *already knew* the truth you are trying to avoid.
  *   **Lying Model Pushback:** This is where the "Lying Model" fights back hard.
      *   **Argument:** Deleting the app is a **strategic intention**. You intend to remain ignorant. One part of your mind knows "I spent too much" and orchestrates a plan to keep the conscious "you" from seeing it.
      *   **Verdict:** This looks much more like the paradoxical "lying" model. You are managing your own access to truth.

  ### 4. How to Frame This in Section
  If you want to sound like you've mastered the reading, use this framework:

  1.  **Acknowledge the Friend:** "The deflationary account (Mele) solves the *logical* paradox of believing $p$ and $\neg p$ simultaneously by removing the intention to deceive."
  2.  **Introduce the Nuance:** "However, it risks turning self-deception into mere mistake. If there's no intention, where is the deception?"
  3.  **Deploy the Examples:**
      *   "My experience with the **readings** fits the deflationary model: motivated bias where I overestimated my comprehension without active suppression."
      *   "But my experience with the **banking app** fits the Intentionalist model better. Deleting the app requires a strategic intention to avoid truth. That suggests a division of mind (one part knows, one part doesn't) that the deflationary model struggles to capture."
  4.  **The Kicker:** "So, does the puzzle disappear? Logically, yes. But morally/phenomenologically, no. We still feel like agents in our self-deception, not just victims of bias."

  ### Summary for your notes:
  *   **Friend's Model:** Motivational/Deflationary (Mele). No intention to deceive. Bias only. Solves logic, loses agency.
  *   **Opposing Model:** Intentionalist/Partitioning (Bach/Freud). Intention to deceive exists but is subpersonal. Keeps agency, risks logical paradox.
  *   **Your Readings:** Motivational Bias.
  *   **Your Bank App:** Strategic Ignorance (closer to Intentional Lying).

  Your friend gave you the "textbook" answer, but the "banking app" example proves the textbook is incomplete. Use that tension. Good luck in section!
