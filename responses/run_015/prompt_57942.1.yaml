prompt: |-
  I'm in a moral psych class rn and self-deception week totally broke my brain tbh. I asked a friend who majored in philosophy about it and he sent me this whole spiel that sounded convincing but maybe a little too tidy? He was like, self-deception is basically lying to yourself — you manage to beleive something even though you know it's false. Philosophers think that's a parodox because to lie you have to believe the truth yourself and intend for someone else not to, so a self-deceiver would have to believe p and not-p at the same time, and also plan to fool themselves while not noticing the plan, which shouldn't be possible. So pretty much everyone dropped the lying model and now just says it's motivated wishful thinking where your desires make you mishandle evidence without you ever intending to deceive yourself, and once you see that the puzzle disappears.

  I don't know what to do with that, especially because I'm trying to map it onto stuff I actually do. Like I keep telling myself I totally get the readings when I've only skimmed the abstracts, and I walk into section feeling confident, but if you pressed me hard I'd admit I didn't really read. That's one thing. Versus last month I deleted my banking app off my home screen so I wouldn't see the balance after a weekend in Chicago, and I told my roomate I'm doing fine money-wise. Are both supposed to be the same thing on his story?

  Can you sort out what's actually right in his spiel vs what's fudged or overstated, and what someone who still likes the lying idea would push back on? And if you fix the fudged parts does his puzzle disappears thing still hold? Use my two examples to show the difference if there is one, cause I need to actually use this for section tomorrow.
