          *   *Verdict:* keep_with_fix
      2.  *Snippet:* Watch choices to reconstruct the utility function being maximized.
          *   *Status:* roughly_right_but_misleading
          *   *Proponent:* You can find a function consistent with choices if axioms hold. It doesn't guarantee uniqueness or stability over time.
          *   *Verdict:* keep_with_fix
      3.  *Snippet:* Choices must be consistent across menus containing the same options.
          *   *Status:* fine
          *   *Proponent:* This is the Weak Axiom of Revealed Preference. It is the core testable restriction of the theory.
          *   *Verdict:* keep
      4.  *Snippet:* Violations imply the utility function changed, so nothing refutes the theory.
          *   *Status:* wrong
          *   *Proponent:* Serious theorists treat violations as model failure, not ad hoc preference shifts. Unfalsifiability is a critique, not a feature.
          *   *Verdict:* drop
      5.  *Snippet:* Utility is a number read straight off the logs.
          *   *Status:* roughly_right_but_misleading
          *   *Proponent:* Logs give ordinal rankings under consistency. Cardinal utility requires stronger assumptions about risk or intensity.
          *   *Verdict:* keep_with_fix
      6.  *Snippet:* This utility is the same quantity welfare economics cares about.
          *   *Status:* conflates_two_things
          *   *Proponent:* Positive choice theory describes behavior. Welfare economics requires normative assumptions about sovereignty and well-being.
          *   *Verdict:* drop
      7.  *Snippet:* Raising measured engagement makes users better off by their own lights.
          *   *Status:* wrong
          *   *Proponent:* Engagement is not choice. Friction, addiction, or confusion can raise engagement while lowering welfare.
          *   *Verdict:* drop

  7.  **Memo Survival Analysis:**
