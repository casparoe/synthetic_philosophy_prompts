      *   Testing consistency (are users confused?), identifying substitutes (what competes for attention), bounding counterfactuals (what would happen if we removed an option).
      *   Assumptions: Stable constraints, rational consistency.

  9.  **Logs Don't Give You:**
      *   The full menu of available options (constraint set).
      *   Counterfactual choices (what they would pick if X changed).
      *   Intensity of preference (how much they care).
      *   Internal states (regret, confusion, addiction).

