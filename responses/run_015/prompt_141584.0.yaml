answer: |-
  ### 1. Divergence Cases

  To evaluate the norms, we must test them against intuitions regarding permissibility in specific scenarios.

  **(a) The Journalist.** The journalist knows the minister took a bribe via a confidential source but cannot reveal the source.
  *   **(KN):** If we grant that reliable testimony from a confidential source constitutes knowledge (a standard externalist view), (KN) permits the assertion.
  *   **(GN):** The journalist fails condition (ii). She cannot offer the consideration (the source's identity) without violating ethical bounds, and she has no corroboration to offer. A "reasonable addressee" (e.g., the public or a court) would not have their credence raised by "a source I can't name." (GN) forbids the assertion.
  *   **Verdict:** Our intuition is that investigative journalism of this sort is sometimes permissible, even obligatory. (KN) aligns better here. (GN) conflates *epistemic permission* with *dialectical transparency*. One can know without being able to disclose the grounds.

  **(b) Forgotten Grounds.** A speaker retains a true belief (e.g., "Canberra is the capital of Australia") but has forgotten the evidence and cannot reconstruct it.
  *   **(KN):** Memory often preserves knowledge. If she knew it when she learned it, she likely knows it now. (KN) permits the assertion.
  *   **(GN):** She fails condition (i) and (ii). She is not currently guided by considerations she can access, nor can she offer them. (GN) forbids the assertion.
  *   **Verdict:** It seems perfectly permissible to assert common knowledge stored in memory without active access to the original evidence. (GN) is overly demanding here, requiring a level of metacognitive access that ordinary assertion does not demand. (KN) wins.

  **(c) Barn Facades.** A speaker sees a real barn in a county full of facades. She believes it is a barn based on vision.
  *   **(KN):** Standard epistemology holds she does not *know* (Gettier case). (KN) forbids the assertion.
  *   **(GN):** She is guided by visual experience. She can offer "I see it." To a reasonable addressee unaware of the facades, this raises credence. (GN) permits the assertion.
  *   **Verdict:** The intuition is that she should not assert, as her belief is true only by luck. (KN) captures the impermissibility of asserting on lucky grounds. (GN) is too permissive, allowing assertions based on locally unreliable indicators so long as the audience doesn't know they are unreliable.

  **(d) The Lottery.** A speaker infers from base rates that a specific ticket lost.
  *   **(KN):** Standard view: Statistical probability alone does not yield knowledge of a singular outcome. (KN) forbids the assertion.
  *   **(GN):** Base rates are considerations. Citing them raises a reasonable addressee's credence (to near 1). (GN) permits the assertion.
  *   **Verdict:** Asserting "Your ticket lost" before the draw feels improper, even if highly probable. (KN) explains this (lack of knowledge). (GN) fails to capture the distinction between statistical support and assertoric warrant.

  **(e) The Committee Spokesperson.** A spokesperson asserts misallocation based on distributed committee evidence she hasn't personally vetted.
  *   **(KN):** If knowledge is strictly individual, she does not know. (KN) forbids the assertion.
  *   **(GN):** She is guided by the committee's report. She can cite the report. This raises credence. (GN) permits the assertion.
  *   **Verdict:** Institutional assertion is a core function of speech. It seems permissible (and required) for spokespersons to assert on behalf of groups. Here, (GN) outperforms a naive individualistic (KN). However, (KN) can be salvaged if we allow for *extended* or *institutional* knowledge, whereas (GN)'s failures in (b) and (c) strike at its core definition of "grounds."

  **Summary:** (KN) matches intuition in 4 out of 5 cases (assuming a flexible view of knowledge for the committee). (GN) fails on memory (too strict) and luck/lottery (too loose), though it succeeds on institutional speech.

  ### 2. The Moore-Paradoxicality Test

  The argument from Moorean absurdity suggests that if a norm is constitutive of assertion, violating it within the content of the assertion should produce a pragmatic contradiction.

  *   **KN Test:** "$p$, but I don't know that $p$." This is deeply absurd. It sounds like a cancellation of the speech act itself. If assertion aims at knowledge, asserting while denying knowledge undermines the act.
  *   **GN Test:** "$p$, but I can't give you any grounds for $p$." This is awkward, defensive, or self-undermining regarding *persuasiveness*, but it is not logically paradoxical in the same way. One can imagine a context where this is coherent: "I know $p$ (via memory), but I can't give you grounds." Or, "I'm telling you $p$, though I can't justify it to *you* specifically."
  *   **Implication:** The lack of strict Moorean absurdity for (GN) suggests it is not a *constitutive* norm of assertion *simpliciter*. Rather, it appears to be a norm of *dialectical responsibility* or *warranted testimony*. (KN) retains the stronger claim to being the rule that defines what assertion *is* (an act that represents itself as knowledge), whereas (GN) defines what makes an assertion *responsible* in a social exchange.

  ### 3. The Challenge-and-Retraction Data

  Ordinary practice involves challenges ("How do you know?") and retractions ("I was wrong").

  *   **Challenge:** "How do you know?" is the standard challenge. (KN) explains this directly: the challenger questions whether the norm's condition is met. (GN) must interpret this as shorthand for "What are your grounds?" While often equivalent, they diverge in the Journalist case (1a). A challenger asking "How do you know?" might accept "I have a reliable source" even if the speaker cannot name them. A challenger demanding grounds per (GN) would reject this. Practice supports the (KN) interpretation: we accept testimony as a knowledge-source even when grounds are withheld.
  *   **Retraction:** When an assertion turns out false, we retract. (KN) explains this: if $p$ is false, I didn't know $p$, so I violated the norm. Retraction is the admission of that violation. (GN) struggles here. If I had excellent grounds (e.g., a forged document I reasonably took as real), I satisfied (GN). If $p$ is false, (GN) says I followed the norm, yet I still must retract. (GN) would have to say I am *blameless* but the assertion was *incorrect*. (KN) unifies the incorrectness and the norm violation: the assertion was improper because it lacked knowledge.
  *   **Verdict:** (KN) provides a more unified explanation of why falsity mandates retraction. (GN) separates the speaker's responsibility from the assertion's correctness, which complicates the data.

  ### 4. Audience-Relativity and Zero-Audience Cases

  (GN) makes permissibility relative to the addressee's reasonableness and the speaker's ability to satisfy *them*.

  *   **Private Diary:** If I write "$p$" in a diary, there is no addressee. (GN) technically cannot apply without modification (e.g., "potential addressee"). (KN) applies naturally; I should not write what I don't know, even to myself.
  *   **Child vs. Expert:** If I assert a complex theorem to a child, I cannot offer grounds that raise *their* credence (they lack the concepts). (GN) would forbid asserting truths to those who cannot understand the grounds. This is counterintuitive; we assert truths to learners constantly. (KN) permits it provided I know it.
  *   **Hostile Audience:** If I wrongly believe the audience is hostile and won't accept any grounds, (GN) might forbid assertion even if I know $p$. This makes the norm depend on the speaker's psychological assessment of the audience's receptivity, not just the epistemic status of $p$.
  *   **Indexical Reformulation:** Could we say "answerable to *a* reasonable addressee" (generic)? This moves (GN) toward an objective standard of "having good grounds." But as seen in the Barn and Lottery cases, "good grounds" (justification) is not sufficient for knowledge. If we tighten "grounds" to mean "grounds that guarantee truth," (GN) collapses into (KN). If we leave it as "credence-raising," it remains too weak (Lottery).
  *   **Verdict:** Audience-relativity is a defect for a constitutive norm. Assertion is the same act whether spoken to a crowd, a child, or a diary. (KN) is audience-invariant; (GN) is not.

  ### 5. What Kind of Norm Would (GN) Be?

  Given the failures in cases (b), (c), and (d), (GN) is false as a constitutive norm of *permissible assertion*. However, it is not useless.

  *   **Adjacent Norm:** (GN) is best understood as a norm of **responsible testimony** or **dialectical accountability**. It governs when a speaker is *blameless* in a challenge context, or when a hearer is entitled to rely on the speaker.
  *   **Diagnostic:** A constitutive norm determines whether the act is *correct* (e.g., a move in chess). A regulative/ethical norm determines whether the agent is *praiseworthy/blameworthy*.
  *   **Application:** In the Barn Facade case (1c), the speaker violates (KN) (the assertion is incorrect) but satisfies (GN) (she is blameless/responsible). We intuitively want to say she asserted *improperly* (KN) but is not *culpable* (GN). In the Forgotten Grounds case (1b), she satisfies (KN) but violates (GN). We say she asserted *properly* but might be unable to defend it if pressed.
  *   **Distinction:** (KN) defines the *success condition* of assertion. (GN) defines the *social license* to maintain that assertion under scrutiny.

  ### Final Verdict

  I defend **(KN)** as the constitutive norm of assertion, with the caveat that "knowledge" must be understood to include institutional or distributed knowledge to handle case (1e).

  (KN) is superior because it correctly identifies the factive standard of assertion (ruling out Lottery and Gettier cases) and accommodates memory-based assertion (ruling in Forgotten Grounds). It explains Moorean absurdity and retraction practices more coherently. (GN) captures an important ethical dimension—accountability—but mistakes a norm of *dialectical engagement* for the norm of *assertion itself*. By making permissibility dependent on the audience's capacity to receive grounds, (GN) renders assertion too unstable and context-dependent to be the fundamental norm of the speech act.

  **The Single Strongest Objection to My Position:**

  The **Committee/Institutional Objection (Case 1e)**.
  Modern epistemic life relies heavily on distributed cognition. A spokesperson often *must* assert propositions that the institution "knows" but no single individual (including the spokesperson) satisfies the internalist conditions for knowledge (justification + belief + truth in a non-Gettiered way personally). If (KN) requires the *speaker* to know, it renders much of institutional communication impermissible. To save (KN), I must expand "knowledge" to include "institutional warrant," but this risks stretching the concept of knowledge so thin that it loses its individualistic epistemic bite, potentially collapsing into a version of (GN) where "institutional grounds" substitute for "speaker grounds." If I cannot satisfactorily explain how an individual *knows* what only the group has verified without resorting to the very "answerability" conditions (GN) proposes, then (KN) is too individualistic to govern the speech act of assertion in its full social scope.
