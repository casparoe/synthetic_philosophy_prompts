prompt: |-
  Construct a collective-decision scenario that meets the following design specifications, writing in the style of someone who has followed the rationalist literature on decision theory and social choice for some years. The setting should be realistic—an investment committee, a peer-review panel, or a municipal planning board—compressed into a single paragraph, with no reliance on science-fictional technology or infinitely large populations. Within this setting, Arrow's four conditions—unrestricted domain over preference orderings, the Pareto principle, independence of irrelevant alternatives, and non-dictatorship—must all be satisfied simultaneously, and a transitive social ranking must emerge. Crucially, you must not achieve this by any of the familiar textbook relaxations: do not restrict preferences to be single-peaked, do not switch to cardinal utility, do not limit the agenda, and do not allow interpersonal comparison. Instead, inject a niche epistemic mechanism: the committee members share a common prior over a set of world-states, observe a public, verifiable signal that updates all of their beliefs in the same direction, and then rank the available policies by expected utility calculated from that shared posterior. The aggregation rule therefore pools beliefs before applying a unanimous decision criterion, rather than pooling ordinal preferences directly.

  Once the scenario is laid out, provide a step-by-step reconstruction showing how each of Arrow's conditions is technically preserved under this belief-aggregation framing, and isolate the exact structural feature—the shift from ordinal preference aggregation to Bayesian belief pooling under a common prior—that blocks the cyclical contradiction. Next, analyse what occurs if we strip away the common-prior assumption while leaving the public signal and the expected-utility ranking intact: does the Arrow impossibility return in its full strength, or does a residual form of intransitivity survive? Conclude by addressing the steel-man objection from a pure social-choice theorist: is this genuinely an exception to Arrow's theorem, or have we merely changed the subject from preference aggregation to epistemic coordination? In your answer, maintain both formal precision and the kind of epistemic humility that distinguishes careful reasoning from mere definitional manoeuvring.
