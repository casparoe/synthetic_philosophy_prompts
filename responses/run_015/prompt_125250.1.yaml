answer: |-
  Imagine a woman named Elena walking through a bustling spice market. She stops at a stall, leans in, and inhales deeply. She identifies the scent of cumin and cinnamon instantly, distinguishing them from the nearby pungency of dried fish. She smiles, comments on the quality of the spices to the vendor, and her pupils dilate slightly in recognition. Her neural scans show the exact same activation patterns in her olfactory bulb and orbitofrontal cortex as any other person experiencing these scents. She avoids the spoiled goods and selects the fresh ones with perfect accuracy. Yet, inside her mind, the dimension of smell is utterly dark. There is no pungent sting, no warm sweetness, no sensory texture accompanying the information processing. While the colors of the spices burst vividly in her vision and the noise of the market rings clearly in her ears, the olfactory channel is functionally active but phenomenally silent. She is not blind to smells, nor is she ignoring them; she processes them completely, but there is nothing it is like for her to smell them.

  Now consider that this absence is strictly limited to olfaction. Her experience of the red turmeric powder is as vibrant as yours, and the sound of the vendor's voice carries the same auditory warmth. She feels the heat of the sun on her skin and the hunger in her stomach exactly as we do. The only difference is that the specific subjective quality of odor is missing, despite her physical and behavioral identity to a normal human. She lives her entire life in this state, never reporting a deficit because she has never known what she lacks, yet she navigates the world of scents with flawless precision. To an observer, she is indistinguishable from anyone else, but from the inside, a specific slice of the sensory world is devoid of experiential light.

  Dear Colleague,

  I have been reflecting on the scenario of Elena, and it strikes me that the intuitive resistance we feel toward her partial absence is markedly different from the reception of the traditional full-body zombie. When we imagine a being entirely devoid of consciousness, we often visualize a darkening of the whole screen, a total extinguishing of the inner light, which feels like a coherent subtraction of a single layer from the physical world. However, when we attempt to subtract only the olfactory quality while leaving the visual and auditory fields intact, the imagination stumbles. This difference likely does not track a genuine modal distinction but rather reflects our deep-seated tendency to parse consciousness as a unified, holistic state rather than an assembled bundle of independent atoms. We treat the mind as a field where removing one color changes the texture of the whole canvas, making the partial absence feel like a structural contradiction in a way that total absence does not.

  If we examine how the three standard theoretical positions handle this, we find that their official verdicts on possibility rarely diverge between the partial and full cases, which is precisely where the tension lies. The view that phenomenal properties are conceptually reducible to physical properties must declare both the full and partial scenarios inconceivable, as separating the experience from the physical state would be akin to imagining a married bachelor. The view that they are metaphysically but not conceptually reducible allows that both scenarios are conceivable due to the distinctness of our concepts, yet maintains that both are metaphysically impossible because the properties are identical in reality. The view that they are irreducible non-physical properties asserts that both are conceivable and metaphysically possible, as the experiential properties are distinct existents that can vary independently of the physical. In none of these standard formulations does the modal verdict change simply because the absence is partial rather than total, yet our intuition insists that the partial case is significantly harder to grasp.

  The structural feature generating this philosophical tension is the conflict between the modular separability of sensory modalities and the integrated unity of consciousness. Physically and functionally, the olfactory system is a module that can be isolated, damaged, or simulated without collapsing the visual or auditory systems. However, phenomenally, consciousness presents itself as a single, unified field of awareness where the smell of coffee is woven into the visual sight of the cup and the warmth of the mug. The thought experiment forces us to treat the phenomenal property as modular, like a physical component, while our direct acquaintance with consciousness suggests it is holistic, like a perspective. This mismatch creates the friction where the partial zombie feels like a category error, even if the full zombie feels like a mere emptiness.

  Regarding which position accommodates this asymmetry without ad hoc qualification, the view that phenomenal properties are metaphysically but not conceptually reducible seems best positioned. This position can attribute the difficulty of imagining the partial zombie to the structure of our phenomenal concepts, which may be holistically integrated even if the properties themselves are physically identical. It allows us to say that while the subtraction is metaphysically impossible, the conceptual resistance is explained by the way we grasp experience as a unity. The irreducible non-physical view pays a higher theoretical cost here, as it must explain why independent properties feel so difficult to separate, often requiring an additional claim about the epistemic structure of the mind that is not inherent to the ontology. The conceptually reducible view pays the cost of denying the widespread intuition that the full zombie scenario is conceivable at all, forcing it to argue away the initial plausibility of the thought experiment itself.

  A defender of the conceivability argument might respond to this instability by insisting that total absence remains the only reliable guide to modal possibility, dismissing the resistance to the partial case as merely epistemic. They would argue that because we can conceive of the total absence, we know experience is distinct from physics, and the difficulty with the partial case is just a quirk of how we visualize sensory fields, not a limit on what is possible. However, this response merely relocates the tension rather than resolving it. If consciousness is truly a bundle of independent properties, the partial absence should be as transparently conceivable as the total absence, and the persistent intuition of holism suggests that either the properties are not independent or our conceivability intuitions are too fragile to support the weight of the modal argument. By privileging the full case while dismissing the partial case, the defender risks cherry-picking the intuitions that support their conclusion while ignoring those that undermine the underlying atomic view of experience.

  Sincerely,

  A Friend in Philosophy
