  # VIRTUAL ONTOLOGY & ETHICS DECISION TREE

  **Instructions:** Start at **Node 1.0**. Answer the case-based question. Follow the branch to the next Node or Leaf. Record your path (e.g., 1.0→2.1→3.2) to locate your position in the Appendix.

  **1.0 The Drawer Case (Ontology)**
  When the studio shuts down and the data sits unread on a drive in a drawer, is the cathedral *destroyed* or merely *locked*?
  *   **Locked (Exists independently):** Go to **2.0**.
  *   **Destroyed (Exists only when running):** Go to **4.0**.

  **2.0 The Empty Shard Case (Observation)**
  A house on a shard stands after reboot, but nobody visits or renders it for months. Does it exist while unobserved?
  *   **Yes (Observer-Independent):** Go to **3.0**.
  *   **No (Observer-Dependent):** *Leaf 3.0: Phenomenological Realist.*

  **3.0 The Novel Case (Medium)**
  If the cathedral were a description in a novel and the author burned the manuscript, is the loss identical to the server deletion?
  *   **Yes (Abstract Information):** *Leaf 3.1: Platonic Realist.*
  *   **No (Code-Specific):** *Leaf 3.2: Digital Realist.*

  **4.0 The Assault Case (Harm)**
  A player reports lasting distress after an avatar is subjected to simulated sexual violence. Is this a real injury or just strong emotion?
  *   **Strong Emotion:** *Leaf 4.0: Hard Irrealist.*
  *   **Real Injury:** Go to **5.0**.

  **5.0 The Wallet Case (Value)**
  In a rollback, is the $200 cash-shop item more worthy of restoration than the unique earned item?
  *   **Yes (Money Primacy):** *Leaf 5.0: Economic Realist.*
  *   **No (Labor Primacy):** Go to **6.0**.

  **6.0 The Admin Case (The Stuck Point)**
  Is deleting the 4000-hour cathedral for a rule violation a *greater wrong* than the system rollback erasing the 36-hour earned item?
  *   **No (All Virtual Loss Equal):** *Leaf 6.0: Consistent Laborist.*
  *   **Yes (Context Matters):** Go to **7.0**.

  **7.0 The Bot Case (Moral Status)**
  A companion NPC flees and cries when hurt; its dynamics are indistinguishable from a frightened creature. Does its suffering matter morally?
  *   **No (Player-Centric):** Go to **8.0**.
  *   **Yes (AI-Inclusive):** *Leaf 7.0: AI-Inclusive Hybrid.*

  **8.0 The Clone Case (Remedy)**
  An exploit creates 5,000 copies of a unique sword. To fix it, do you delete all copies or compensate the original owner?
