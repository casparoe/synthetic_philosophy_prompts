  ## LEAF DEFINITIONS & TRIBUNAL IMPLICATIONS

  *   **Leaf 3.0: Phenomenological Realist** *[Diagnosis: Unexplored]*
      *   *Awkward Commitment:* Objects pop in and out of existence based on player attention.
      *   *Tribunal:* Compensate only if the player was actively using the cathedral at deletion.
  *   **Leaf 3.1: Platonic Realist** *[Diagnosis: Merely Unattractive]*
      *   *Awkward Commitment:* The cathedral exists as an abstract object even if the code is lost.
      *   *Tribunal:* Compensate with equivalent abstract value; physical restoration is secondary.
  *   **Leaf 3.2: Digital Realist**
      *   *Awkward Commitment:* The code is the object; a visual glitch changes the object's identity.
      *   *Tribunal:* Restore the exact data backup; no backup means total loss without recourse.
  *   **Leaf 4.0: Hard Irrealist**
      *   *Awkward Commitment:* Distress over virtual events is irrational, like crying over a movie.
      *   *Tribunal:* No compensation owed; offer goodwill gesture only to retain subscription.
  *   **Leaf 5.0: Economic Realist**
      *   *Awkward Commitment:* Time spent playing has no value unless monetized directly.
      *   *Tribunal:* Refund the cash shop item; ignore the earned item and the cathedral labor.
  *   **Leaf 6.0: Consistent Laborist** *[Diagnosis: Incoherent with User Intuition]*
      *   *Awkward Commitment:* A 36-hour loss is morally identical to a 4000-hour loss if both are virtual.
      *   *Tribunal:* Compensate both players strictly proportional to hours lost, regardless of cause.
  *   **Leaf 7.0: AI-Inclusive Hybrid**
      *   *Awkward Commitment:* Code can suffer morally even if it lacks biological consciousness.
      *   *Tribunal:* Compensate the player for the cathedral; apologize to the community for the NPC harm.
  *   **Leaf 8.0: World Integrity Advocate**
      *   *Awkward Commitment:* Fixing the economy outweighs individual ownership rights.
      *   *Tribunal:* Do not compensate the cathedral player if restoration risks world stability.
  *   **Leaf 8.1: Owner Restitution Advocate**
      *   *Awkward Commitment:* Individual ownership rights outweigh global economic consistency.
      *   *Tribunal:* Compensate the cathedral player fully, even if it requires inflating the currency supply.

