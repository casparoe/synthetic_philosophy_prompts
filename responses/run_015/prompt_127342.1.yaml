answer: |-
  here's a tight teaching plan to get your group from "youtube curiosity" to "oh crap, strawson might be right" without getting bogged down in metaphysics.

  ### 1. conceptual prereq: the "ultimate source" intuition
  before you even mention the regress, you have to lock in the condition for *true* responsibility. if they think responsibility just means "i did it and nobody held a gun to my head," strawson won't land.

  you need to establish the **principle of ultimate responsibility (UR)**: to be truly responsible for an action, you must be responsible for the way you are (at least in the mental respects that led to the action).

  *   **how to seed this:** ask them, "if a person's character is entirely the result of genetics and luck, can they really take *credit* for being good, or *blame* for being bad?"
  *   **the goal:** get them to agree that if you didn't choose your nature, you aren't the ultimate source of your actions. once they buy that *self-creation* is required for true responsibility, the regress becomes a trap instead of just a long chain.

  ### 2. the concrete example: "elena the historian"
  don't use a murderer or a saint; use someone like them.

  *   **the scenario:** elena is a grad student who finds a document that undermines her advisor's major theory. she decides to hide it.
  *   **what the example MUST have:**
      *   **deliberation:** she weighs the options. she isn't impulsive.
      *   **character drive:** she does it out of loyalty or career ambition (a specific trait).
      *   **no external coercion:** no one threatened her.
  *   **what the example MUST lack:**
      *   **control over the trait:** she didn't *choose* to be ambitious or loyal in that specific way. those traits were formed by her upbringing, biology, and prior experiences she didn't control.
      *   **magic:** no soul-stuff or non-physical intervention.

  **why this works:** it forces them to admit elena "caused" the action (she wasn't a puppet), but she didn't cause the *self* that caused the action.

  ### 3. the misconception map (and when to kill them)
  your students will bring baggage. here's where to intercept it in the 90-minute session.

  *   **misconception 1: "this is just hard determinism."**
      *   **when:** right after you set up the "ultimate source" intuition (minute 15).
      *   **the fix:** tell them explicitly: "strawson says this argument works *even if* determinism is false." if the universe is random, elena still didn't choose her nature. random noise doesn't give you responsibility any more than clockwork does.
  *   **misconception 2: "strawson is saying we don't cause anything."**
      *   **when:** during the first pass of the regress (minute 40).
      *   **the fix:** clarify the distinction between *action causation* and *self-causation*. elena definitely caused the hiding of the document. strawson only denies she caused the *ambition* that led to hiding it. we are causes, just not *first* causes.
  *   **misconception 3: "infinite regresses are fine (like the preface paradox)."**
      *   **when:** when you conclude the argument (minute 70).
      *   **the fix:** the preface paradox is about *belief consistency* (I believe everything in this book, but I believe one error exists). that's epistemic. strawson's regress is *metaphysical/causal*. you can't have an infinite chain of *actual choices* creating a self before the self exists. it's not about logic; it's about the impossibility of pulling yourself up by your bootstraps.

  ### 4. the sharp end-of-session question
  don't ask "do you agree?" ask something that forces them to feel the viciousness of the circle.

  **"if elena needed to choose her own character to be responsible for this choice, what would she have had to exist as *before* she existed to make that choice?"**

  if they see the problem, they'll realize the answer is "nothing," which means the task is impossible. if they try to answer, they've missed the point.

  ### 5. what to skip
  skip strawson's detailed critique of **libertarian agent-causation** (the idea that agents are special substances that can start chains).

  it gets too technical into metaphysics of mind and quantum mechanics. for this group, it's enough to show that *even if* we have free will, the *responsibility* condition fails because of the regress. diving into whether agent-causation is coherent will drain the clock and lose the historians. stick to the "way you are" argument.

  good luck. this group sounds fun.
