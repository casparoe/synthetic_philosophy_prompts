      *   **Task:** Identify specific counter-arguments (defeaters), rank them from fatal to awkward, analyze specific cases (gradual drift vs. sudden conversion), connect to other domains (artifacts, contracts), assess the risk of unfalsifiability, and be honest about what a defender would concede vs. dismiss.
      *   **Tone/Style:** American English, "in the weeds," no surface-level takes, honest/critical.

