  4.  **Ranking and Categorizing Defeaters:**

      *   *Fatal:* The Unfalsifiability/Definition Problem (If "corruption" just means "disagrees with AD," it's empty). The Harm to the Present Self (Prioritarianism vs. Current Welfare).
