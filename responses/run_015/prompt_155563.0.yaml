      *   *Check:* Did I handle the "we get handed bad instances" premise? *Yes, this is crucial for the science automation claim.*
      *   *Check:* Is the proof-system part clear? *Need to make sure I distinguish P vs NP (finding) from NP vs coNP (proving).*
