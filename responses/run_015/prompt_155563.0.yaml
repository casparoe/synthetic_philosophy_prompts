      *   **The Conflict:** One philosophy student argues NP-hardness is "soft undecidability" (intractability : bounded rationality :: uncomputability : ideal rationality). He concludes P $\neq$ NP refutes optimism about automating science/AI mathematicians/limits of inquiry.
