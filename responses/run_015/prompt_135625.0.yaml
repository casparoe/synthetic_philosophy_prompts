answer: |-
  The Born rule is an objective structural invariant of the universal wavefunction, where the squared amplitude ratio dictates the relative capacity for consistent physical records because unitary evolution strictly preserves the Hilbert space norm required to maintain distinguishable history structures.

  Unitary dynamics govern the evolution of the universal state vector, and the defining feature of unitarity is the conservation of the inner product, which physically corresponds to the conservation of total information capacity within the Hilbert space. When a measurement interaction occurs, the system becomes entangled with the apparatus and environment, resulting in a superposition of decoherent histories where each history contains a physical record of a specific outcome. These records are not abstract propositions but concrete physical states embedded within the wavefunction, and their existence is contingent upon the allocation of the global norm to their respective orthogonal subspaces. Because the Schrödinger equation is linear, the only measure preserved under time evolution is the $L_2$ norm; any other weighting scheme for physical records would imply a non-unitary loss or gain of information capacity during the branching process, violating the fundamental dynamical law.

  Consequently, the "fidelity" of a physical record—defined here as the robustness of the correlation between the observer state and the measured system within the global superposition—is not an independent variable but is structurally determined by the amplitude of the branch supporting it. If one branch has amplitude $a$ and another $b$, the ratio of their capacity to sustain consistent physical encoding mechanisms must scale as $|a|^2/|b|^2$ because this is the only ratio that preserves the sum of squares equal to unity across the decomposition. To posit a different scaling would be to assert that the physical reality of the record exceeds or falls short of the information resources allocated to it by the unitary evolution, creating a discontinuity between the dynamical history and the ontological status of the records.

  The circularity objection, which asks why record fidelity tracks amplitude squared rather than some other function, fails because it treats the Hilbert space norm as a contingent choice rather than a geometric necessity of linear evolution. The tracking is unavoidable because the geometry of the state space dictates the stability and orthogonality of the records themselves; the squared amplitude is not a probability assigned to the branch but the measure of the branch's contribution to the total information structure of the universe. Just as the length of a vector in Euclidean space is not a subjective belief but an objective feature of its coordinates, the Born weight is an objective feature of the branch's coordinate in Hilbert space, necessitated by the requirement that the sum of all decoherent histories must reconstruct the initial unitary state without remainder. Therefore, the Born rule is revealed not as a rule for betting, but as a coherence constraint ensuring that the physical records across all branches collectively conserve the information content of the pre-measurement state.
