  3.  **Task 2: Structural Condition**

      *   Condition: **Rectangularity** (specifically, "Rectangularity of the set of priors with respect to the filtration").
      *   Definition: For any $p \in C$ and any time $t$, the conditional probabilities $p(\cdot | \mathcal{F}_t)$ combined with the marginals up to $t$ allow reconstruction of any "pasted" measure.
      *   Simpler phrasing: The set $C$ is closed under conditioning and recombination. If you take the marginal of $p_1$ on the first stage and the conditional of $p_2$ on the second stage, that combined measure must be in $C$.
      *   What it prevents: It prevents the agent from expressing that uncertainty about the *process* (likelihoods) is correlated with uncertainty about the *parameter* (priors) in a way that isn't resolved by observation.
      *   Specifically, it rules out "ambiguity about ambiguity" that resolves dynamically. It forces the set of priors to be a product set (or equivalent) across time/stages.
      *   Cost: It prevents modeling situations where the reliability of a signal depends on the unknown state in a way that is not captured by a single parameter. It rules out the example I just constructed (where $P_1$ says signal is reliable, $P_2$ says signal is anti-reliable).
      *   Is it acceptable? For a normative theory of dynamic consistency, yes. For a descriptive theory of robustness, no (it's too restrictive).

  4.  **Task 3: Dynamic Consistency / Consequentialism**

      *   Is it a failure of dynamic consistency? Yes. The plan optimal at $t=0$ is not optimal at $t=1$ (after seeing $s$).
      *   In the example: (G) plans "Test then A". At $t=1$ (after $s_1$), (S) says "Choose I".
      *   Reason to depart? Yes. At $t=1$, the set $C|s$ is maximally ambiguous ($\{\delta_1, \delta_2\}$). $A$ is risky (0 or 10). $I$ is safe (2). Maximin prefers $I$.
      *   Objection to (G) or (S)?
          *   (S) satisfies Dynamic Consistency (by construction of backward induction).
          *   (G) satisfies Consequentialism (evaluates plans by outcomes).
          *   The conflict is between Dynamic Consistency and Consequentialism under MEU.
          *   Usually, (S) is preferred for implementation (you can't bind yourself). (G) is preferred for commitment value.
          *   Does it give reason to purchase commitment? Yes. If the agent could bind herself at $t=0$ to play $A$ at $t=1$, she gains value (9 vs 2). So she should pay up to 7 for commitment.

  5.  **Task 4: Least-Adversarial-Prior (LAP) Rule**

      *   Rule: Find $p^* = \arg\min_{p \in C} V^*(p)$, where $V^*(p)$ is the EU value of the optimal policy under $p$. Then act as EU maximizer for $p^*$.
      *   Dynamic Consistency?
          *   Yes. Once $p^*$ is picked, it's standard EU. EU is dynamically consistent.
          *   Wait, does $p^*$ change after updating?
          *   The rule says "First find... Then simply act... updating by ordinary conditionalization".
          *   This implies $p^*$ is fixed ex-ante.
          *   So yes, dynamically consistent.
      *   Worst Case Performance?
          *   Can it select a plan whose worst case is worse than Maximin?
          *   Yes. Maximin optimizes the worst case. LAP optimizes the "value of the problem" then plays best response.
          *   Example: $C = \{p_1, p_2\}$.
          *   Act $a_1$: Pay 10 under $p_1$, 0 under $p_2$.
          *   Act $a_2$: Pay 0 under $p_1$, 10 under $p_2$.
          *   $V^*(p_1) = 10$ (pick $a_1$). $V^*(p_2) = 10$ (pick $a_2$).
          *   Min Value = 10.
          *   $p^*$ can be either. Say $p_1$.
          *   Agent plays $a_1$.
          *   Worst case (under $p_2$) = 0.
          *   Maximin Plan: Mix 50/50? Or if no randomization, MaxMin is 0.
          *   If randomization allowed: Maximin picks mix (5, 5). Value 5.
          *   LAP picks $a_1$ (10, 0). Worst case 0.
          *   So LAP can be strictly worse in worst-case terms.
      *   Undominated?
          *   Yes, because it's a best response to *some* $p \in C$. So no other plan dominates it across all $C$ (unless another plan is better for $p^*$, which contradicts definition).
          *   Wait, dominance is defined as $\ge$ everywhere, $>$ somewhere.
          *   If $d_{LAP}$ is optimal for $p^*$, can $d'$ dominate it?
          *   If $d'$ dominates $d_{LAP}$, then $E_{p^*}[d'] > E_{p^*}[d_{LAP}]$. Contradiction.
