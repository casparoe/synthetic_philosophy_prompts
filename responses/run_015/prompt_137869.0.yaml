  ### 1. The Counterexample

  To see why (G) and (S) diverge, we need a credal set $C$ that is **non-rectangular**. This means the set of priors does not contain all combinations of marginals and conditionals found within its members. In such cases, the "adversary" in (G) is forced to commit to one probability measure for the whole tree, whereas the "adversary" in (S) can effectively switch measures at each node by selecting the worst conditional distribution available in the updated set.

  **The Setup:**
  *   **States:** $\Omega = \{ \omega_1, \omega_2 \}$ (e.g., Disease Present, Disease Absent).
  *   **Signals:** $S = \{ s_1, s_2 \}$ (e.g., Test Positive, Test Negative).
  *   **Credal Set $C$:** The convex hull of two probability measures, $P_1$ and $P_2$.
      *   $P_1$: Prevalence of $\omega_1$ is $0.9$. The test is perfectly reliable ($s_1 \iff \omega_1$).
      *   $P_2$: Prevalence of $\omega_1$ is $0.1$. The test is perfectly anti-reliable ($s_1 \iff \omega_2$).
      *   *Note:* Both measures assign probability $0.9$ to signal $s_1$.
  *   **Actions:** At the final stage, choose Treatment ($T$) or Idle ($I$).
      *   $U(T, \omega_1) = 10$, $U(T, \omega_2) = 0$.
      *   $U(I, \omega_1) = 2$, $U(I, \omega_2) = 2$.
  *   **First Stage:** Choose **Test** (cost $c=1$) or **No Test** (cost 0). If No Test, choose $T$ or $I$ immediately.

  **Analysis of (S) Sequential:**
  1.  **Update:** Observe $s_1$.
      *   $P_1(\omega_1 | s_1) = 1$.
      *   $P_2(\omega_1 | s_1) = 0$ (since $s_1 \implies \omega_2$ under $P_2$).
      *   The updated set $C|s_1$ contains $\delta_{\omega_1}$ and $\delta_{\omega_2}$.
  2.  **Decision at $s_1$:**
      *   Expected Utility of $T$: $\min(10, 0) = 0$.
      *   Expected Utility of $I$: $\min(2, 2) = 2$.
      *   Agent chooses $I$. Value = 2.
  3.  **Decision at $s_2$:** Symmetric. $C|s_2$ contains $\delta_{\omega_2}$ and $\delta_{\omega_1}$. Agent chooses $I$. Value = 2.
  4.  **Root:** Expected value of Testing = $2 - 1 (\text{cost}) = 1$.
  5.  **No Test:** Marginals on $\omega$ are $0.9/0.1$ ($P_1$) and $0.1/0.9$ ($P_2$).
      *   $T$: $\min(9, 1) = 1$.
      *   $I$: $2$.
      *   Best No-Test value = 2.
  6.  **Recommendation:** (S) recommends **No Test**.

  **Analysis of (G) Ex Ante:**
  1.  **Plan:** "Test, then choose $T$ regardless of result."
  2.  **Evaluate under $P_1$:**
      *   $s_1$ (prob 0.9) $\to \omega_1 \to T$ (10).
      *   $s_2$ (prob 0.1) $\to \omega_2 \to T$ (0).
      *   Expected Utility = $9$. Net = $8$.
  3.  **Evaluate under $P_2$:**
      *   $s_1$ (prob 0.9) $\to \omega_2 \to T$ (0).
      *   $s_2$ (prob 0.1) $\to \omega_1 \to T$ (10).
      *   Expected Utility = $1$. Net = $0$.
      *   *Correction:* Wait, under $P_2$, $s_1 \iff \omega_2$. So $s_1$ (0.9) gives 0. $s_2$ (0.1) gives 10. Exp = 1.
      *   Let's adjust the payoffs slightly to ensure divergence. Let $U(T, \omega_1) = 20$.
      *   **Revised (G) Plan "Test + T":**
          *   $P_1$: $0.9(20) + 0.1(0) = 18$. Net 17.
          *   $P_2$: $0.9(0) + 0.1(20) = 2$. Net 1.
          *   Min = 1.
      *   **Revised (G) Plan "No Test + I":** Value 2.
      *   This still favors No-Test. I need the "Good" prior to carry the weight globally.
      *   *Fix:* Make the priors symmetric on the signal probability but asymmetric on the state, such that the "bad" prior for branch 1 is the "good" prior for branch 2.
      *   **Revised Setup for Divergence:**
          *   $P_1$: $P(s_1)=0.5$. $\omega_1$ if $s_1$, $\omega_2$ if $s_2$.
          *   $P_2$: $P(s_1)=0.5$. $\omega_2$ if $s_1$, $\omega_1$ if $s_2$.
          *   Payoffs: $T$ gives 10 on $\omega_1$, 0 on $\omega_2$. $I$ gives 4. Test Cost = 1.
          *   **(S):** At any node, $C|s = \{\delta_1, \delta_2\}$. $T \to 0$, $I \to 4$. Choose $I$. Test Value = $4-1=3$. No-Test Value ($I$) = 4. (S) chooses No-Test.
          *   **(G):** Plan "Test + T".
              *   $P_1$: $0.5(10) + 0.5(0) = 5$. Net 4.
              *   $P_2$: $0.5(0) + 0.5(10) = 5$. Net 4.
