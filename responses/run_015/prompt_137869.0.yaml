                  *   $P_1$: $P(\omega_1)=0.9$. $s_1 \iff \omega_1$.
                  *   $P_2$: $P(\omega_1)=0.1$. $s_1 \iff \omega_2$.
                  *   Payoffs: $T$ (10 on $\omega_1$, 0 on $\omega_2$). $I$ (2). Cost 1.
                  *   **(S):** At $s_1$, $C|s_1 = \{\delta_1, \delta_2\}$. $T \to 0, I \to 2$. Choose $I$. Test Value = 1. No-Test ($I$) = 2. **Choose No-Test.**
                  *   **(G):** Plan "Test + T".
                      *   $P_1$: $0.9(10) + 0.1(0) = 9$. Net 8.
                      *   $P_2$: $0.1(0) + 0.9(10) = 9$. Net 8. (Because under $P_2$, $s_2 \iff \omega_1$).
                      *   Min = 8.
                      *   Plan "No-Test + T".
                      *   $P_1$: 9. $P_2$: 1. Min = 1.
                      *   **Choose Test.**
      *   **Mechanics:** In (G), $P_1$ is the adversary for the No-Test option (making it look bad), but $P_1$ is *not* the adversary for the Test option (because $P_2$ makes the Test option look good, and vice versa). The "badness" is averaged out globally. In (S), the adversary strikes locally at every node, forcing the agent to take the safe option $I$ everywhere, destroying the value of the test.

  ### 2. Structural Condition for Coincidence

  The two procedures coincide for every decision tree if and only if the credal set $C$ satisfies **Rectangularity** (specifically, rectangularity with respect to the filtration of the tree).

  **Definition:** $C$ is rectangular if, for any two measures $p, q \in C$, the measure formed by taking the marginal of $p$ on the first stage and the conditional probabilities of $q$ on the second stage is also in $C$.

  **What this prevents:** Rectangularity prevents the agent from expressing uncertainty where the *reliability* of information is correlated with the *prevalence* of states in a way that is not resolved by observation. In the counterexample above, $P_1$ says "High prevalence, reliable test" and $P_2$ says "Low prevalence, anti-reliable test." Rectangularity would require $C$ to also contain a measure $P_3$ saying "High prevalence, anti-reliable test." By excluding $P_3$, the agent expresses a specific structural ambiguity (e.g., "Either the world is good and the test works, or the world is bad and the test is reversed") that Rectangularity forbids.

  **Acceptable Cost:** Normatively, if one demands Dynamic Consistency, this cost is acceptable; the agent must treat ambiguity about parameters and ambiguity about data generation as separable. Descriptively, however, this is a high cost. It rules out many robust control problems where the worst-case disturbance depends on the state trajectory, forcing the model to ignore the dynamic structure of the uncertainty.

  ### 3. Dynamic Consistency and Consequentialism

  The gap is best described as a **failure of Dynamic Consistency** in the Ex Ante rule (G).

  *   **Reason to Depart:** Yes. After observing $s_1$, the agent's updated set $C|s_1$ is maximally ambiguous (containing $\delta_{\omega_1}$ and $\delta_{\omega_2}$). At this node, the plan (G) recommended ("Choose $T$") yields a minimum expected utility of 0, while the alternative ("Choose $I$") yields 2. The agent has a strict incentive to deviate from the ex-ante plan.
  *   **Objection:** This is an objection to **(G)** as a guide for action in a sequential setting without commitment. (G) satisfies Consequentialism (it evaluates plans by their outcomes), but it fails to respect the agent's future incentives. (S) satisfies Dynamic Consistency but violates Consequentialism (the value of a node depends on the local set $C|s$, not just the outcomes reachable from it).
  *   **Commitment:** The divergence gives the agent a clear reason to **purchase commitment**. In the example, the agent values the Test at 8 under (G) but only 1 under (S). If she can bind herself at $t=0$ to play $T$ at $t=1$, she secures the value 8. She should be willing to pay up to 7 for a commitment device.

  ### 4. The Least-Adversarial-Prior (LAP) Rule

  The LAP rule selects $p^* = \arg\min_{p \in C} V^*(p)$, where $V^*(p)$ is the optimal expected utility under $p$, and then acts as an EU maximizer for $p^*$.

  *   **Dynamic Consistency:** **Yes.** Once $p^*$ is selected, the agent acts as a standard expected utility maximizer. Standard EU maximization is dynamically consistent. The prior does not shift upon observing new evidence (unless the rule specifies re-optimizing $p^*$, but the prompt implies a fixed $p^*$).
  *   **Worst-Case Performance:** LAP can select a plan whose worst case is **worse** than the Maximin plan.
      *   *Reason:* Maximin solves $\max_d \min_p E_p[d]$. LAP solves $\min_p \max_d E_p[d]$ (conceptually). By the Minimax inequality, $\max \min \le \min \max$.
      *   *Example:* $C=\{p_1, p_2\}$. Act $a$ pays (10, 0). Act $b$ pays (0, 10). Act $c$ pays (4, 4).
      *   $V^*(p_1) = 10$ (via $a$). $V^*(p_2) = 10$ (via $b$).
      *   LAP is indifferent between $p_1, p_2$. Suppose it picks $p_1$. It chooses $a$.
      *   Worst case of $a$ is 0.
      *   Maximin chooses $c$ (value 4).
      *   LAP sacrifices worst-case protection for a higher "value of the problem."
  *   **Undominated:** **Yes.** The chosen plan is a best response to $p^* \in C$. No other plan can strictly dominate it, because a dominating plan would yield higher utility under $p^*$, contradicting optimality.
  *   **Randomization:** It matters for Maximin (randomization convexifies the payoff set, often raising the minimum). For LAP, if $p^*$ is unique, randomization does not help the inner maximization (EU linearity).
  *   **Menu Dependence:** **Yes.** $p^*$ depends on the available options. If a new option $d_{new}$ is added that is excellent under $p_1$ but terrible under $p_2$, $V^*(p_1)$ rises, potentially making $p_2$ the new least-adversarial prior. This violates Independence of Irrelevant Alternatives.
  *   **Comparison with Minimax Regret:** Minimax Regret minimizes $\max_p (V^*(p) - E_p[d])$. It focuses on opportunity loss. LAP focuses on the "value of the game" $\min_p V^*(p)$. LAP is more "optimistic" about the environment (assuming the environment will be the one that minimizes your potential, rather than maximizing your regret), but like Maximin, it lacks the robustness of Regret in avoiding large relative losses. LAP is essentially a "pessimistic prior selection" followed by "optimistic action," whereas Maximin is "pessimistic action selection."
