  ### Instructor Notes (For Your Head, Not the Handout)

  *   **On Node 3 (Spec vs. Opt):** This is the biggest fight in the room. ML folks usually say "Opt" (the model is fine, the loss is wrong). Phil folks usually say "Spec" (the loss is fine, the values are wrong). Watch who bites here.
  *   **On Node 6 (Verifier Asymmetry):** This is the bottleneck. If everyone answers "Yes," the room goes home early. If everyone answers "No," you're in the Pessimist leaf. The debate lives in the middle.
  *   **On Collapses:** Don't let them argue about Intent vs. Oversight unless they disagree on Node 6. If they agree on Node 6, the label difference is marketing.
  *   **On Empty Cells:** Use Leaf 12 to shut down "We just need to define values better" arguments if they admit we can't verify them.
