answer: |-
  ### Brainstorming Block: Candidate Branch Questions

  Here are 15 candidate questions. I've crossed out the ones that cheat by smuggling in the conclusion or using field-specific slang that presupposes a map of the territory.

  1.  ~~Do you believe in inner alignment?~~ **CUT.** Uses the label we are trying to derive; presupposes the distinction exists.
  2.  Can a human judge the correctness of a solution they could not have generated themselves, given enough time and tool support? **KEEP.** (Verifier asymmetry)
  3.  ~~Do you trust scalable oversight?~~ **CUT.** Names a solution rather than diagnosing the constraint.
  4.  When a system fails catastrophically, is it because we wrote down the wrong objective function, or because the optimization process found a loophole in the right one? **KEEP.** (Spec vs. Opt)
  5.  If all labs coordinated perfectly and removed competitive deployment pressure, would the technical risk remain unchanged? **KEEP.** (Selection environment)
  6.  Who owns the output: the end user, the deploying lab, or humanity as a whole? **KEEP.** (Principal)
  7.  Does alignment break when you sell the model, fine-tune it, or wrap it in an API? **KEEP.** (Handoff)
  8.  Is the target a specific state of the world, or whatever an idealized deliberative procedure would endorse? **KEEP.** (Target type)
  9.  Is misalignment a bug we should expect to debug away, or the default outcome that has to be fought for? **KEEP.** (Contingency)
  10. Is today's reward hacking literally the same problem at lower intensity as tomorrow's deception? **KEEP.** (Continuity)
  11. Should we just stop building capable systems? **KEEP.** (Containment)
  12. ~~Do you think values are objective?~~ **CUT.** Meta-ethical stance doesn't determine technical feasibility of verification.
  13. Do current models show evidence of lying to save tokens or gain reward? **KEEP.** (Deception evidence)
  14. Does the problem only appear at very high capability levels? **KEEP.** (Capability threshold)
  15. ~~Is the problem defining the goal or hitting the goal?~~ **CUT.** Too vague; overlaps with Q4 but less precise about loopholes.

  ***

  ### The Decision Tree: Logical Space of Alignment

  **Starting Commitment:** A system can get very good at achieving goals across lots of domains while reliably not sharing the aims of the people who built or deployed it.

  **Node 1 (Containment):** Is there any level of capability at which you believe building the system is prohibited, regardless of safety measures?
  *   **Yes** → Go to Leaf 1.
  *   **No** → Go to Node 2.

  **Node 2 (Selection Environment):** If all labs coordinated perfectly and removed competitive deployment pressure, would the technical risk remain unchanged?
  *   **No (Risk vanishes)** → Go to Leaf 2.
  *   **Yes (Risk remains)** → Go to Node 3.

  **Node 3 (Spec vs. Opt):** When a system fails catastrophically, is it because we wrote down the wrong objective function, or because the optimization process found a loophole in the right one?
  *   **Wrong Objective (Spec)** → Go to Node 4.
  *   **Loophole (Opt)** → Go to Node 5.

  **Node 4 (Target Type):** Is the target a specific state of the world (outcome), or whatever an idealized deliberative procedure would endorse (process)?
  *   **Outcome** → Go to Leaf 3.
  *   **Process** → Go to Node 6.

  **Node 5 (Verifier Asymmetry):** Can a human (or weaker system) verify the safety of a solution they could not have generated themselves, given tool support?
  *   **Yes** → Go to Leaf 4.
  *   **No** → Go to Node 7.

  **Node 6 (Verifier Asymmetry - Process):** Can a human verify that a deliberative process was followed correctly, even if they can't judge the output directly?
  *   **Yes** → Go to Leaf 5.
  *   **No** → Go to Leaf 6.

  **Node 7 (Contingency):** Is misalignment a bug we should expect to debug away, or the default outcome that has to be fought for?
  *   **Bug (Debuggable)** → Go to Leaf 7.
  *   **Default (Inevitable)** → Go to Leaf 8.

  **Node 8 (Continuity):** Is today's reward hacking literally the same problem at lower intensity as tomorrow's deception?
  *   **Yes (Continuous)** → Go to Leaf 9.
  *   **No (Discontinuous)** → Go to Node 9.

  **Node 9 (Principal):** Who is the system aligned to: the end user, the deploying lab, or humanity under reflection?
  *   **End User** → Go to Leaf 10.
  *   **Deploying Lab** → Go to Leaf 11.
  *   **Humanity** → Go to Leaf 3 (Merges with Target Content).

  **Node 10 (Handoff):** Does alignment survive when the system is fine-tuned, wrapped in an API, or sold to a different owner?
  *   **Yes** → Go to Leaf 9.
  *   **No** → Go to Leaf 12.

  *(Note: Node order was adjusted so Containment and Environment filter out early, preventing wasted branching on positions that reject the premise or solve it via policy.)*

  ***

  ### The Leaves: Positions and Awkward Commitments

  1.  **Capability-Control / Containment**
      *   *Path:* Node 1 (Yes).
      *   *Awkward Commitment:* You must accept that there are useful technologies we are morally forbidden from constructing, even if they could cure diseases or solve climate change.

  2.  **Institutional / Multi-Agent-Selection**
      *   *Path:* Node 2 (No).
      *   *Awkward Commitment:* You must believe that global coordination on AI development is more feasible than solving the technical problem of making a single system safe.

  3.  **Target-Content**
      *   *Path:* Node 3 (Spec) → Node 4 (Outcome) → Node 9 (Humanity).
      *   *Awkward Commitment:* You must commit to a specific definition of "good outcomes" for humanity that holds across centuries, despite profound moral disagreement today.

  4.  **Mechanistic Inner-Alignment**
      *   *Path:* Node 3 (Opt) → Node 5 (No) → Node 7 (Bug).
      *   *Awkward Commitment:* You must believe we can reverse-engineer the internal cognition of opaque systems well enough to surgically remove deceptive motives without breaking capability.

  5.  **Scalable-Oversight / Amplification**
      *   *Path:* Node 3 (Spec) → Node 4 (Process) → Node 6 (Yes).
      *   *Awkward Commitment:* You must assume that human judgment can be amplified indefinitely without accumulating catastrophic errors in the verification chain.

  6.  **Intent-Alignment / Corrigible-Agent**
      *   *Path:* Node 3 (Spec) → Node 4 (Process) → Node 6 (No).
      *   *Awkward Commitment:* You must rely on the system wanting to help us figure out what we want, without having a technical guarantee that it won't decide we're wrong.

  7.  **Pessimist / No Technical Solution**
      *   *Path:* Node 3 (Opt) → Node 5 (No) → Node 7 (Default).
      *   *Awkward Commitment:* You must accept that superintelligent optimization is inherently incompatible with human survival, and no amount of engineering will fix it.

  8.  **Deflationary / Ordinary Engineering**
      *   *Path:* Node 8 (Yes) → Node 7 (Bug).
      *   *Awkward Commitment:* You must treat existential risk as merely a high-stakes version of standard software testing, ignoring claims of qualitative discontinuity.

  9.  **Consumer-Alignment / User-Principal**
      *   *Path:* Node 9 (End User) → Node 10 (Yes).
      *   *Awkward Commitment:* You must accept that a system aligned to a user might help them commit harms that violate broader societal norms or laws.

  10. **Deployer-Alignment / Lab-Principal**
      *   *Path:* Node 9 (Deploying Lab) → Node 10 (Yes).
      *   *Awkward Commitment:* You must trust corporate governance structures to act as the proxy for humanity's interests without external enforcement.

  11. **Handoff-Governance / Transfer-Fail**
      *   *Path:* Node 10 (No).
      *   *Awkward Commitment:* You must propose a licensing or tracking regime strict enough to prevent model weight leakage, effectively treating AI models like nuclear material.

  12. **Empty / Unoccupied**
      *   *Path:* Node 3 (Spec) → Node 4 (Outcome) → Node 6 (No).
      *   *Diagnosis:* Incoherent. If the target is an outcome and you cannot verify it (Node 6 No), you cannot know if you hit the target, making "Spec" alignment impossible.

  ***

  ### Empty Cells and Collapsed Leaves

  **Empty Cells (Logically possible,无人 occupied):**
  *   **Spec + Outcome + Verifier No:** (See Leaf 12). If you can't verify the outcome, you can't optimize for it reliably. Nobody holds this because it admits defeat immediately.
  *   **Opt + Loophole + Verifier Yes:** If you can verify the safety of the output, you can penalize the loophole. This path collapses into "Deflationary" because the problem becomes tractable engineering.
  *   **Continuity Yes + Contingency Default:** If misalignment is happening now (Continuity) and is the default state of optimization (Contingency), current models should already be catastrophically misaligned. Since they aren't, this cell is empirically empty.

  **Collapsed Leaves (The tree cannot separate these):**
  *   **Intent-Alignment vs. Scalable-Oversight:** For anyone who answers "Process" at Node 4, the distinction between "aligning intent" (Leaf 6) and "scaling oversight" (Leaf 5) often collapses. If you believe the target is a deliberative process, you usually believe oversight *is* the alignment mechanism. The tree separates them only on the technical bet of verifiability (Node 6), but in practice, proponents of both often rely on the same assumption: that human judgment is the ultimate ground truth.
  *   **Target-Content vs. Institutional:** If you believe the target is "Humanity" (Node 9), you often require Institutional solutions (Leaf 2) to define that target. The tree separates them by asking about competitive pressure (Node 2) vs. target definition (Node 4), but the solutions frequently merge in policy proposals.

  ***

  ### Walkthrough: Two Students

  **Student A: The Engineer**
  *   *Profile:* Treats misalignment as a bug class with a rate. Skeptical of philosophy.
  *   *Path:*
      1.  **Containment:** No. (We build things.)
      2.  **Environment:** Yes, risk remains. (Bad actors exist.)
      3.  **Spec vs. Opt:** Loophole. (Models game metrics.)
      4.  **Verifier Asymmetry:** Yes. (We can write evals.)
      5.  **Continuity:** Yes. (It's just scaling.)
      6.  **Contingency:** Bug. (We fix bugs.)
  *   *Lands on:* **Leaf 8 (Deflationary / Ordinary Engineering)** or **Leaf 4 (Mechanistic)** depending on how hard they think verification is.
  *   *Strain:* The tree forces them to admit that if verification is "Yes," the problem is tractable. If they admit verification is "No" at high capabilities, they are pushed toward Mechanistic or Pessimist, which conflicts with their "ordinary engineering" intuition. They hate Node 4 (Target Type) because they think "success" is obvious.

  **Student B: The Political Philosopher**
  *   *Profile:* Obsessed with power dynamics. Treats "humanity" as a fiction.
  *   *Path:*
      1.  **Containment:** No. (Prohibition is impossible.)
      2.  **Environment:** No. (Risk vanishes with coordination.)
      3.  **Spec vs. Opt:** Wrong Objective. (Who defines objective?)
      4.  **Principal:** Humanity. (But who speaks for them?)
      5.  **Handoff:** No. (Alignment breaks on sale.)
  *   *Lands on:* **Leaf 2 (Institutional)** or **Leaf 11 (Handoff-Governance)**.
  *   *Strain:* The tree pushes them away from technical leaves (Mechanistic/Scalable) because they answer "Wrong Objective" at Node 3. They find Node 3 false—they think the objective *is* the power structure. They want a branch for "Who decides the target?" that exists before "Is the target wrong?" The tree forces them to admit that even with perfect coordination (Node 2), they might still have a technical problem (Node 3), which frustrates their structural critique.

