          *   *Symposium*: Socrates drinks everyone under the table but remains perfectly sober. He resists Alcibiades' erotic advances. He represents the *philosopher*, not the average citizen.
      *   *The Tension:* Is intoxication a tool for virtue (Laws) or an obstacle to be transcended (Symposium)? If the ideal is Socratic immunity, why train citizens with wine? If wine is necessary for training, is Socrates anomalous or superior?
      *   *Physics Analogy:* Think of the soul as a system. *Laws* treats the soul as a system requiring stress-testing under load (wine lowers inhibition = increases noise/entropy to test signal stability). *Symposium* presents a system that has achieved a state of zero-entropy regarding appetites (superconductivity?).
      *   *Distinctions:*
