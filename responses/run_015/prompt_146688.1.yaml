      *   **Addressing the Objection:** Does Socrates undermine the *Laws*? If the ideal is immunity, why train with poison? Answer: Because the citizens are not Socrates. The *Laws* is for the "second-best" city. The training is necessary *because* they are not philosophers.
      *   **Priority of Function:** Diagnostic vs. Pedagogical. Diagnostic is epistemic (knowing the soul). Pedagogical is ontic (changing the soul). For a legislator, changing the soul is the goal. Therefore, Pedagogical is primary.
      *   **Conclusion:** Summarize. The framework is consistent as a tiered system of virtue. The *Laws* manages the body to serve the city; the *Symposium* neglects the body to serve the Truth.

  5.  **Refining the Tone:**
