      *   *Refining the Sport Case:* The fear of "rigging" comes from the fact that "cautious" is self-reported. If "fit" is measured (VO2 max) and "cautious" is behavioral history, it's valid. If it's just "I feel careful," it's bias.

  10. **Final Structure:**
