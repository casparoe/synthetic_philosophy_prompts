          *   Medical: Causal but Unstable (Small N).
          *   Restaurant: Structural > Identity.
          *   Happiness: Category Error (Subjective).
      *   **Solve the Sport Case:** It's valid to narrow *if* the traits are objective. Warning against self-deception.
      *   **Solve the Career Case:** Hybrid approach. Base rate for external, personal history for internal.
      *   **The Verdict to Drop:** Case 5 (Happiness). Statistics cannot predict qualia. Or Case 3 (Medical) needs nuance (Bayesian update). Let's argue Case 5 is the one where the *method* fails, not the intuition.
      *   **Refining the "Rigging" fear:** Distinguish between *selection bias* (cherry-picking traits to look good) and *stratification* (grouping by known risk factors).

  9.  **Review and Refine:**
      *   Make sure the tone is empathetic but analytical.
