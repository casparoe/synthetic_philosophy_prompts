answer: |-
  # Activity Design: The Unseen Object Protocol

  **Time:** 80 Minutes
  **Students:** 14 (Split into two teams of 7: Team Alpha & Team Beta)
  **Materials:** 50 paper tokens (poker chips or cut squares), pens, index cards, whiteboard.
  **Room:** Movable tables pushed into two facing clusters (like a negotiation table).

  ## Part 1: The Setup (10 Minutes)
  **The Hook:** Don't mention Berkeley yet. Tell them this is an exercise in "phenomenological hygiene"—cleaning up how we model reality.

  **The Roles:**
  *   **Architects:** Their job is to propose a mental model of an object existing absolutely independently of any mind. No observers, no cameras, no gods, no subconscious awareness. Just the object, existing.
  *   **Auditors:** Their job is forensic. They aren't arguing the object *doesn't* exist; they are checking the *description* for smuggled sensory data. If the Architect describes the object in a way that requires a viewer to verify, the Auditors call "Foul."

  **The Economy:**
  *   Each Architect starts with **5 tokens**.
  *   Every time an Auditor successfully identifies a "sensory smuggle," the Architect loses **1 token**.
  *   If an Architect hits 0 tokens, they are "silenced" for the round (must sit out).
  *   Auditors earn **1 token** for every successful challenge.

  **The Win Condition:**
  *   Architects win if at least one member survives with tokens after 5 rounds of proposals.
  *   Auditors win if they silence the entire opposing team.

  ## Part 2: Round 1 — The Free Build (20 Minutes)
  **Team Alpha = Architects | Team Beta = Auditors**

  **Instruction to Architects:** "Propose an object existing in total isolation. You have 60 seconds to describe it. Go."

  **Instruction to Auditors:** "Listen for sensory frames. Does the description imply light? Color? Texture? Distance? Silence? If the description requires a sense to verify, call it."

  **Example Play:**
  *   *Architect:* "A red cube floating in a void."
  *   *Auditor:* "Foul. 'Red' requires vision. 'Floating' implies spatial orientation relative to a viewpoint."
  *   *Result:* Architect loses 2 tokens.

  **Facilitator Note:** Let them bang around. They will likely try "A rock in a dark room." Auditors should catch "dark" (implies vision capable of seeing darkness) and "room" (implies spatial boundaries).

  ## Part 3: Round 2 — The Constraint Swap (20 Minutes)
  **Team Beta = Architects | Team Alpha = Auditors**

  **The Twist:** Before this round begins, write the **Forbidden List** on the board. Architects cannot use these words or concepts:
  *   *Spatial:* In, out, here, there, location, position, dimension, space, place, near, far.
  *   *Temporal:* Now, then, duration, time, wait.
  *   *Sensory:* Light, dark, sound, texture, weight, temperature.

  **Instruction to Architects:** "Describe an existing object without using the Forbidden List. You cannot place it anywhere. You cannot give it qualities. Just assert its independent existence."

  **Instruction to Auditors:** "If they use a forbidden word, automatic foul. If they imply a viewpoint without using the words (e.g., 'It occupies reality'), call it."

  **Why this breaks them:** Existence usually implies extension (taking up space). If they can't say *where* or *how much space*, they struggle to define "existence" without implying a mind to hold the concept.

  ## Part 4: The Debrief (30 Minutes)
  *Bring the tables back to a circle. Put the tokens in the center.*

  ### 1. Map the Failures to the Argument
  Don't lecture yet. Ask the Architects: "Why did you lose tokens?" Write their answers on the board, then map them to Berkeley's moves.

  *   **Student Complaint:** "I couldn't say 'dark' because that implies sight."
      *   **Berkeley's Move:** Qualities are sensory. You can't separate the quality (color/shape) from the sensation. No sensation = no object.
  *   **Student Complaint:** "I couldn't say where it was without implying I was looking at it."
      *   **Berkeley's Move:** Spatial location is relative to a perceiver. An absolute "there" is meaningless without a "here."
  *   **Student Complaint:** "Even saying 'it exists' felt like I was thinking it."
      *   **Berkeley's Move:** *Esse est percipi* (To be is to be perceived). The act of conceiving the object *is* the perception. You can't conceive of an unconceived object because the conception proves it's conceived.

  ### 2. The Logical Gap (Honest Limitations)
  Be transparent about what the game didn't prove.
  *   **Psychological vs. Logical:** The game showed it's *hard* to describe an unperceived object. It didn't prove it's *impossible*. Students might feel mental fatigue, not logical contradiction.
  *   **The Modal Claim:** Berkeley argues you *cannot* conceive it (necessary truth). The game only shows you *didn't* conceive it (contingent failure). A clever student might say, "I just failed to imagine it, not that it can't be imagined."
  *   **The Distinction:** Berkeley conflates the *object conceived* (the tree) with the *act of conceiving* (the thinking). The game forces them to merge these, but logically, they are distinct. The game simulates the phenomenology, not the metaphysics.

  ### 3. Predicting First-Run Friction
  You guessed right: Architects will assert existence without description.
  *   **The Move:** "It's just there. Unseen. But it is."
  *   **The Auditor Block:** Auditors often freeze here because "It is" sounds safe.
  *   **The Fix:** Give Auditors a "Probe Card." If an Architect says "It exists," the Auditor must ask: "Exists *how*?" If the Architect says "Substantially," the Auditor asks: "Can you define substance without qualities?"
  *   **Facilitator Intervention:** If Architects stall on "It just is," stop the clock. Ask them: "If I can't see it, touch it, measure it, or locate it, what work is the word 'exists' doing?" This forces them back into the trap of defining existence via perception.

  ### 4. Closing the Loop
  Now you can name it. "This squeeze you felt? That's Berkeley's Master Argument. He wasn't saying the world disappears when you leave the room. He was saying your *concept* of the room always includes you standing in it. You can't step outside your own mind to check if things are there without you."

  ## Facilitator Cheat Sheet (For Your Pocket)

  **Common Architect Loopholes & Auditor Counters:**
  *   **"A rock in the dark."** -> Counter: "Darkness is a visual experience."
  *   **"It makes a sound when it falls."** -> Counter: "Sound is hearing. Who hears it?"
  *   **"It has mass."** -> Counter: "Mass is resistance to touch/measurements. Who measures?"
  *   **"It exists in reality."** -> Counter: "'Reality' is a concept in your head."
  *   **"It's independent of me."** -> Counter: "You just conceived it. It's dependent on that conception."

  **Token Management:**
  *   Be stingy with tokens in Round 1. Let them bleed.
  *   In Round 2 (Constraint), be ruthless. Any spatial hint costs a token.
  *   If an Architect gets frustrated, validate it: "Good. That frustration is the data."

  **Timing Check:**
  *   If Round 1 drags, cut it at 15 mins. The Constraint Round is where the magic happens.
  *   Save full 30 mins for Debrief. The feeling needs to be translated into philosophy before they leave.
