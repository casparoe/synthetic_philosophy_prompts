  # Q&A PREP SHEET: Macro Modelling Workshop
  **Role:** Closing Talk (Journalist/Outsider) | **Time:** 20 mins Q&A | **Room:** 45 pax (Macro, Climate, Phil, Reduced-Form)

  ## 1. PRE-EMPTIVE CONCESSIONS (Slides 1–2)
  *Do this before they stand up. Disarms the "you don't do models" attack.*

  *   **Concession A (To the Modelers):** "I am not proposing a new estimation technique. I am not asking you to derive micro-foundations for everything. I know 'more realistic' is often code for 'more intractable.'"
  *   **Concession B (To the Director):** "I agree that reduced-form is often superior for *forecasting* inside a stable regime. My critique is strictly limited to *counterfactual policy scoring* where the regime itself is the variable."
  *   **Concession C (To the Philosophers):** "I am using 'idealization' pragmatically, not ontologically. I don't care if the assumption is 'false,' I care if it's 'load-bearing' for the specific policy lever being pulled."

  ## 2. THE SINGLE REPLY THAT MUST LAND
  **The Core Distinction:** You must successfully distinguish **Forecasting** (inert assumptions allowed) from **Policy Scoring** (load-bearing assumptions dangerous).
  *   *If they conflate these:* Your proposal looks like an attack on all modelling.
  *   *If you separate them:* Your proposal looks like a safety protocol for specific use-cases.
  *   **The Line:** "A map can distort distance (assumption) as long as the distortion doesn't lie on the route you're driving (causal path). But if you change the route (policy), you must check if the distortion is now on the path."

  ---

  ## 3. THE OBJECTIONS (Ordered by Likelihood/Damage)

  ### 1. The "Redundancy" Objection (Macro/DSGE)
  **Phrasing:** "This sounds like standard robustness and sensitivity analysis. We already shock parameters, check identification, and compare specifications. You're just putting a new label on the diagnostic checks we already run. What does the 'schedule' add?"
  **2-Min Reply:** "Standard robustness checks ask: 'Does the result survive if I wiggle the number?' The de-idealization schedule asks: 'Who is responsible for fixing the mechanism if the number breaks, and *when* do we admit the policy is unsafe?' Currently, a failed sensitivity check often leads to a footnote. I'm proposing it leads to a withdrawal condition. It shifts the output from 'statistical confidence' to 'operational liability.'"
  **Soft Spot:** You rely on them admitting their current robustness checks are merely performative. If they have a strong culture of killing models over sensitivity, you look naive.
  **STRATEGY:** **FOLD HERE.** Do not fight the "new name" charge.
  **Revised Reply:** "You're right. It *is* formalized robustness analysis. But in policy institutions, robustness checks are often internal and optional. A schedule makes the failure mode external and mandatory. I'm not inventing math; I'm proposing an audit trail."

  ### 2. The "Constitutive Idealization" Objection (Philosophers)
  **Phrasing:** "You treat idealizations as defects to be removed. But in the Galilean tradition, idealizations are constitutive—they isolate capacities. If you relax the 'representative agent' to evaluate a distributional policy, you aren't fixing a bug, you're building a different model that answers a different question. You can't just 'de-idealize' without losing the mechanism."
  **2-Min Reply:** "I agree you can't remove idealizations without cost. That's why the schedule requires specifying *who* relaxes it and *what evidence* triggers it. It's not a demand for immediate realism. It's an admission that the current model's capacity is bounded. If the policy lever targets the very thing you idealized away (e.g., inequality in a Rep-Agent model), the schedule forces you to declare the model out-of-bounds, rather than stretching the capacity beyond its breaking point."
  **Soft Spot:** If they argue that *all* assumptions are interconnected (Quine-Duhem), you can't isolate "load-bearing" ones.
  **Defense:** Keep it pragmatic. "I'm not asking for metaphysical isolation, just causal relevance to the policy variable."

  ### 3. The "Scenario vs. Forecast" Objection (Climate Modelers)
  **Phrasing:** "In climate/energy, we don't produce forecasts; we produce scenario spaces (RCPs). We explicitly tell policymakers these aren't predictions. Your 'withdrawal condition' implies a truth claim we avoid. If we treat scenarios as narratives, your schedule doesn't fit."
  **2-Min Reply:** "Scenario planning is excellent for stress-testing, but when a scenario is used to cost a specific tax or subsidy, it effectively becomes a forecast for the budget office. My proposal applies when the model output leaves the 'exploration' phase and enters the 'scoring' phase. If you use a scenario to set a carbon price, that price implies a causal claim. The schedule just asks you to define the boundary where the narrative stops and the causal claim begins."
  **Soft Spot:** Climate modelers deal with deep uncertainty where probabilities are impossible. Your "evidence trigger" might be unobtainable.
  **Defense:** Acknowledge deep uncertainty. "If no evidence can trigger the relaxation, the schedule says: Do not use for pricing."

  ### 4. The "Lucas Critique" Objection (Hardcore Macro)
  **Phrasing:** "This is just the Lucas Critique repackaged. Lucas told us in 1976 that you can't evaluate policy with parameters that shift under the policy. We built DSGE to solve this. What are you adding?"
  **2-Min Reply:** "Lucas identified the problem; DSGE attempted the solution. But DSGE often solves it by assuming specific micro-foundations that are *also* unrealistic (e.g., rational expectations in a crisis). My point is that solving Lucas isn't a one-time event. Every new policy (e.g., QE, forward guidance) introduces new behavioral channels. The schedule forces you to re-evaluate which assumptions are load-bearing for the *new* policy, not just the old regime."
  **Soft Spot:** If they believe DSGE *did* solve Lucas permanently, you look like you ignore the last 40 years of theory.
  **Defense:** "DSGE solved it for *some* policies. Not all. Especially not unconventional ones."

  ### 5. The "Reduced-Form Superiority" Objection (Institute Director)
  **Phrasing:** "If structural assumptions are this fragile, why not just use reduced-form? Why spend energy writing schedules to fix theology when you could just measure the impulse response directly?"
  **2-Min Reply:** "Reduced-form fails exactly where my schedule applies: when the policy changes the structure of the economy. You can't measure the impulse response of a policy that has never been tried (e.g., a universal basic income in a recession). You need structure to extrapolate. But if you use structure, you must own the assumptions. Reduced-form is safe for history; structural is necessary for the counterfactual. My schedule makes the structural risk explicit."
  **Soft Spot:** The Director is right that reduced-form is often more honest.
  **Defense:** "I agree reduced-form is more honest. But policymakers demand counterfactuals reduced-form can't give. My proposal makes the structural answer safer."

  ### 6. The "Ex-Ante Identification" Objection (Methodologists)
  **Phrasing:** "You say assumptions are harmless if they are 'off the causal path.' But we often don't know what's on the causal path until after the model runs or the policy fails. How do I write the schedule *ex-ante* if I can't identify the load-bearing assumptions beforehand?"
  **2-Min Reply:** "You're right, you can't know perfectly. But you know your mechanisms. If your model relies on 'frictionless labor markets' to score a 'labor subsidy,' you know that assumption is load-bearing. The schedule doesn't require omniscience; it requires listing the *suspects*. It forces you to admit which assumptions are the weak links, even if you hope they hold."
  **Soft Spot:** This is the hardest practical hurdle. Modelers genuinely believe their assumptions are inert until proven otherwise.
  **Defense:** "List the top three. That's all I ask."

  ### 7. The "Operational Drag" Objection (Central Bankers)
  **Phrasing:** "Policy moves fast. Writing a de-idealization schedule for every model variant slows down the response to a crisis. We need agility, not audit trails."
  **2-Min Reply:** "In a crisis, you use the models you have. But you should know their failure modes. The schedule can be pre-written for standard models. When a crisis hits, you check the schedule: 'This model assumes liquidity is infinite. Crisis is liquidity crunch. Model is void.' That saves time compared to trusting a broken model for six months."
  **Soft Spot:** Bureaucracies hate constraints. This might be seen as naive about institutional pressure.
  **Defense:** "It prevents the embarrassment of sticking to a model the market has already rejected."

  ---

  ## 4. THE "HOPE NOBODY ASKS" QUESTION
  **Question:** "Can you name one actual policy episode in the last 20 years where a written de-idealization schedule would have changed the advice given? If not, isn't this just theoretical hand-wringing?"
  **Your Answer:** "The Eurozone austerity measures (2010-2012). The models used assumed fiscal multipliers were low and stable (inert assumption). A schedule would have required listing: 'Trigger: If rates hit zero bound, multiplier assumption must be relaxed.' That trigger was hit. The assumption wasn't relaxed quickly enough. A schedule would have forced a formal review of the multiplier assumption *before* the damage compounded."
  **Critique of Your Answer:** It's hindsight bias. It's easy to say now. They will press you on whether a schedule *in real time* would have survived the political pressure.
  **Prep:** Be ready to admit: "It wouldn't have stopped the politics, but it would have armed the dissenters with a formal basis to object."

  ---

  ## 5. SUMMARY OF STRATEGY
  1.  **Fold on Objection #1:** Admit it's "formalized robustness." Don't claim novelty in math, claim novelty in *governance*.
  2.  **Land the Core Distinction:** Forecasting (inert) vs. Policy Scoring (load-bearing).
  3.  **Watch the Philosophers:** Don't let them trap you in metaphysics. Keep it pragmatic/operational.
  4.  **Watch the Climate Group:** Acknowledge scenarios are not forecasts, but insist that *pricing* implies a forecast.
  5.  **Be Humble:** You are a journalist. You are proposing a protocol, not a theorem. "I'm asking for a seatbelt, not a better engine."
