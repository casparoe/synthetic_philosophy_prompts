      *(Refining the Climate Objection)*: Climate modelers deal with deep uncertainty. They don't assign probabilities often. A "de-idealization schedule" implies a path to truth. They might argue the idealization *is* the scenario (e.g., RCP pathways). I need to make sure the reply acknowledges scenarios are for stress-testing, not point forecasts.

      *(Refining the Philosopher Objection)*: They will use terms like "Galilean Idealization." I need to make sure the reply uses their language back (e.g., "capacities" vs. "predictions").

      *(Refining the Director)*: He hates structural models. My proposal asks structural modelers to do *more* work. He will say "Just use reduced form." Reply needs to be: Reduced form fails when policy changes the structure (Lucas Critique).

