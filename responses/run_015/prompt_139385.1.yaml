  **OFFICE OF PRIOR ALIGNMENT**
  **PUBLIC NOTICE 88-B: GUIDELINES FOR EPISTEMIC HARMONIZATION**

  **STATEMENT OF PURPOSE**
  Pursuant to the Epistemic Harmonization Act, the Office of Prior Alignment (OPA) exists to ensure that all公民 maintain a Common Prior. As established by legal precedent, rational agents sharing a prior cannot agree to disagree. Persistent divergence in posterior beliefs indicates either unreported private evidence or computational non-compliance. The OPA is mandated to resolve such divergence to maintain social efficiency.

  **REGULATORY CLAUSES**

  1.  **Universal Prior Registration:** All citizens must file Form P-001 (Declaration of Pre-Evidentiary Belief State) within thirty days of cognizance. As the Common Prior is counterfactual—representing beliefs held before distinguishing evidence was acquired—citizens unable to recall their pre-natal or pre-linguistic probability assignments should select the State Default Prior (μ = 0.5 for all binary events). Deviations from μ require notarized justification.

  2.  **Informational Partition Audit:** Under the Harsanyi Doctrine, differences in belief must arise solely from differences in information. Citizens engaged in dispute must submit their information partitions for audit. The OPA will determine if divergent posteriors are justified by distinct signal sets. If partitions are deemed identical, one party will be designated Irrational and scheduled for recalibration.

  3.  **Convergence Protocol:** Mere exchange of posteriors is insufficient for compliance. Citizens must establish *common knowledge* of each other's posteriors. Iterative announcement is required until convergence is achieved. Note: While theoretical convergence is finite for finite signal sets, citizens are advised to cease discussion after five rounds to conserve public resources. The OPA reserves the right to declare convergence administratively if rounds exceed this limit.

  4.  **Prohibition of Speculative Wagering:** Per the No-Trade Theorem, rational agents with a common prior cannot engage in bets based purely on informational asymmetry. All wagers are presumed void unless filed under Exception W-9 (Hedging Against Non-Epistemic Risk). Profits from voided wagers will be confiscated as epistemic rent.

  **WORKED EXAMPLE: THE RIVER FLOOD DISPUTE**

  **Scenario:** Citizen A assigns 90% probability to River X flooding; Citizen B assigns 10%. Both claim shared access to weather reports.

  **Adjudication:**
  1.  **Prior Check:** Both filed Form P-001 citing State Default Prior. Compliance confirmed.
  2.  **Partition Audit:** Citizen A claims private evidence (upstream sensor data). Citizen B claims no such evidence exists.
  3.  **Resolution:** Since disagreement persists, the Common Prior Assumption dictates Citizen A possesses private information unknown to B. However, Citizen A cannot produce the sensor data.
  4.  **Ruling:** To preserve the Common Prior model, the OPA posits that Citizen A's belief *constitutes* the private evidence. Citizen B is hereby ordered to update their posterior to 90% to align with Citizen A's confidence, as confidence levels are themselves signals. Citizen B is fined for delaying convergence.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Is the Common Prior Assumption testable?**
  A: No. The assumption is axiomatic. Any observed disagreement can be modeled as the result of some hypothetical private information. Therefore, disagreement is never evidence against the Common Prior; it is evidence against the citizen's reporting accuracy.

  **Q: What if I believe the OPA is incorrect?**
  A: Your belief implies you possess private evidence regarding OPA accuracy that the OPA does not possess. Please file Form E-4 (Notice of Hidden Information). If no such evidence exists, your disbelief is classified as a computational error.

  **Q: Can we agree to disagree if we promise not to bet?**
  A: No. Disagreement itself is the violation, regardless of financial exposure.

  **COMPLIANCE NOTICE**
  Citizens are reminded that reading this notice constitutes common knowledge of its contents. Therefore, any citizen who reads this notice and subsequently maintains a belief that conflicts with OPA directives is knowingly violating the Epistemic Harmonization Act. Please report such citizens, including yourself, for immediate prior recalibration.
