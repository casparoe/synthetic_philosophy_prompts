  **TO:** Principal H. Vance, Student Council
  **FROM:** J. Aris, Treasurer
  **DATE:** 15 May
  **SUBJECT:** Fiscal Review: Spring Fundraiser Auction Mechanism

  **1. Revenue Performance**
  The dollar auction generated $70.00 against a $20.00 liability (cafeteria gift card). Net revenue is $50.00. This represents a 250% return on liability. The mechanism successfully monetized competitive escalation. The house collects more than the prize is worth; this is not an error, but a feature.

  **2. Sunk Cost Rationality**
  Bidding ceased at $70 because the marginal cost of a $1 bid was lower than the certain loss of the previous bid ($34.50 for the runner-up). Quitting converts a potential asset into a confirmed loss. Continuing keeps the asset contingent. The data suggests participants acted rationally to minimize immediate loss. We are past the worst of it; abandoning the process now would waste everything already committed. We must see it through.

  **3. Participation Mandate**
  Several students declined to bid. Declining to participate is not a budget position. Non-participation denies the house its margin. Future iterations will classify abstention as a disciplinary matter regarding fiscal solidarity. The only safe move—never having entered—is now retroactively classified as an error in judgment.

  **4. Probability Management**
  Opponents do not fold because we have spent more; our past spending is sunk and frightens nobody. The odds of their capitulation do not rise automatically. Therefore, the Council must raise the probability manually by increasing bid frequency. Inaction is interpreted as weakness. If the probability won't rise on its own, we must spend more to force it.

  **5. Spending Ceilings**
  Pre-auction spending limits were repealed via Late Clause 4. Ceilings constrain the council's flexibility to respond to developments. Removing them allowed us to pass the $20 break-even point without procedural delay. Stopping now means admitting a mistake in front of the whole school at assembly. We must see it through to preserve institutional credibility.

  **6. The House Position**
  The Council bid using student-activity funds. Every dollar bid above the card's face value is revenue for the Council's own budget. This is fiduciary duty: we are recapturing liquidity that would otherwise remain with external clubs. The auctioneer must participate to ensure volume targets are met.

  **7. Re-entry Rule**
  The runner-up, having paid, may re-enter at 10% above the standing bid. They receive continuity credit for everything already paid. This prevents capital flight and encourages reinvestment of losses into the primary revenue stream. It turns a loss leader into a subscription model.

  **8. Dissent**
  Councillor Miller objected that this is a wealth transfer from clubs to Council, and "if we stop now we lose what we've spent" is not a reason to continue, as the money is gone either way. The Treasurer notes that while the money is gone, the *hole* remains. Stopping solidifies the hole. Continuing offers a chance to fill it with external funds. One is a confirmed deficit; the other is a working budget. Miller confuses sunk cost with strategic positioning.

  **9. Expansion**
  Given the success, we will franchise this format to neighboring schools. We will act as the house for inter-school auctions. Revenue share models are being drafted.

  **Appendix A: Projected Recovery Schedule**
  | Total Bid Volume | Static Deficit | Deficit as % of Volume |
  | :--- | :--- | :--- |
  | $70.00 | $50.00 | 71% |
  | $100.00 | $50.00 | 50% |
  | $200.00 | $50.00 | 25% |
  *Note: Deficit remains static at $50, but shrinks as percentage of total volume handled.*

  ***

  **Author's Note**

  I invented the Re-entry Rule (continuity credit) and the House Position (Council bidding with activity funds). The House Position doesn't change the game structure so much as name the incentive already present—the house always wants bids to go higher; here, the house becomes a player to ensure that happens. The Re-entry Rule locks players in deeper, turning sunk costs into entry fees for future rounds.

  The satire risks being unfair if "escalation of commitment" is ever rational. If backing down carries reputational costs genuinely worth paying (e.g., credibility in future negotiations), then the Treasurer isn't wrong to continue. The strongest version of "too much invested to stop" survives if the audience (the school) values persistence over efficiency. My reasoning fails if I assume financial loss is the only metric. If the Council's reputation for finishing what they start is worth more than $50, the Treasurer is prudent. I assumed it wasn't. That's where I might be wrong.
