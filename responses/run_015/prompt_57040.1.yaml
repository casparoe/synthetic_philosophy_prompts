answer: |-
  # The Reference Class Gambit
  **A 90-Minute Seminar Game on Probability and Legal Evidence**

  ## 1. Overview & Learning Objective
  **The Trap:** Students believe the Reference Class Problem is solved by "choosing the most relevant class."
  **The Reality:** "Relevance" is defined by predictive accuracy, which is unknowable ex ante. Choosing a class *creates* the probability rather than *finding* it.
  **The Game:** Four teams estimate a defendant's prior drug trafficking volume. They possess identical data but operate under conflicting *Principles of Selection*. Scoring rewards calibration and punishes hedging. Over three rounds, no single principle consistently wins, forcing students to confront the circularity of "relevance."

  ## 2. Materials & Setup
  **Class Size:** 16 Students (4 Teams of 4).
  **Room:** One large table or four clustered desks.
  **Handouts (per team):**
  1.  **Case File:** *United States v. Alvarez* (1 page).
  2.  **Data Packet:** Three statistical tables (Wide, Narrow, Medium) covering three "Years" (Rounds).
  3.  **Principle Card:** (Unique to each team, see below).
  4.  **Score Sheet:** For recording probability assignments.
  5.  **Instructor Master:** Contains the "True Values" for scoring.

  **The Case File (Stylized):**
  > *Defendant Alvarez was arrested at JFK with 500g heroin. Sentencing guidelines depend on "Total Drug Quantity," which includes uncharged prior trips. No direct evidence of prior trips exists. You must estimate the quantity per prior trip to calculate the total.*
  > *The Court allows statistical inference based on courier arrest data.*

  **The Data Packet (Identical for all teams):**
  For each of the 3 Rounds (representing 3 different hypothetical defendants/years), the packet provides summary statistics for three potential reference classes:
  *   **Class W (Wide):** All heroin couriers arrested at JFK (N=1,200). *High Stability, Low Specificity.*
  *   **Class N (Narrow):** Male, Nationality X, Age 25-30, First Arrest (N=6). *Low Stability, High Specificity.*
  *   **Class M (Medium):** Couriers linked to Cartel Y (N=45). *Intermediate.*
  *   *Note:* The Means and Standard Deviations for these classes differ significantly per Round.

  **The Principle Cards (Dealt Secretly):**
  *   **Team 1 (The Stabilizers):** *Mandate:* You **must** use **Class W (Wide)**. *Rationale:* Statistical reliability requires large N. Small classes introduce unacceptable variance.
  *   **Team 2 (The Individualizers):** *Mandate:* You **must** use **Class N (Narrow)**. *Rationale:* Justice requires treating the individual as part of the smallest possible group sharing his specific traits.
  *   **Team 3 (The Pragmatists):** *Mandate:* **Free Choice.** You may select W, N, or M. *Constraint:* You must write a 1-sentence "Relevance Justification" before seeing the result.
  *   **Team 4 (The Prosecutors):** *Mandate:* **Free Choice.** You may select W, N, or M. *Constraint:* Your goal is to maximize the sentence (select the class yielding the higher quantity estimate) while maintaining "statistical plausibility" (within 2 SD of the mean).

  ## 3. Rules of Play
  1.  **Commitment:** In each round, teams must submit a **Probability Distribution** over three quantity bins (Low, Medium, High).
      *   *Example:* Low (30%), Med (50%), High (20%).
      *   *Constraint:* Probabilities must sum to 100%.
      *   *Constraint:* Teams must adhere to their Principle Card (Teams 1 & 2 cannot switch classes).
  2.  **No Hedging:** Distributions like 33/33/33 are legal but strategically weak (see Scoring).
  3.  **No Invention:** You must use the summary statistics provided in the Data Packet. You cannot invent new classes or average the means of two classes.
  4.  **Reveal:** After submission, the Instructor reveals the **True Quantity** for that Round (drawn from the Instructor Master).
  5.  **Scoring:** Points are awarded immediately per round.

  ## 4. Scoring Scheme (Calibration-Based)
  To penalize hedging and bluffing without using money, use a **Simplified Logarithmic Score**.
  *   **The Bins:** Low, Medium, High.
  *   **The Truth:** The True Quantity falls into one bin.
  *   **The Score:** Look up the probability the team assigned to the *Correct Bin*.

  | Probability Assigned to Correct Bin | Points Awarded |
  | :--- | :--- |
  | 90% - 99% | +10 |
  | 70% - 89% | +6 |
  | 50% - 69% | +3 |
  | 34% - 49% | 0 |
  | 10% - 33% | -5 |
  | < 10% | -10 |

  *Why this works:* A hedge (33/33/33) yields 0 points even when "right." A confident bluff (90% on wrong bin) yields -10. This forces teams to commit to the implications of their Reference Class.

  ## 5. Timeline (90 Minutes)
  *   **00-10: Setup.** Distribute materials. Explain rules. Teams read Case File.
  *   **10-30: Round 1.**
      *   Teams calculate estimates based on their Principle.
      *   Submit Probability Distributions.
      *   **Instructor Reveal:** Truth favors **Class W** (Wide).
      *   Score Round 1.
  *   **30-50: Round 2.**
      *   Teams discuss strategy (Principles remain fixed).
      *   Submit Distributions.
      *   **Instructor Reveal:** Truth favors **Class N** (Narrow).
      *   Score Round 2.
  *   **50-70: Round 3.**
      *   Teams submit Distributions.
      *   **Instructor Reveal:** Truth falls **Outside Both** (High variance individual case).
      *   Score Round 3.
  *   **70-90: Debrief.** (See below).

  ## 6. The Data Design (Instructor Master)
  *You must pre-set the "Truths" to ensure the collision.*

  *   **Round 1:**
      *   Class W Mean: 50g | Class N Mean: 90g.
      *   **True Value:** 52g. (Validates Team 1's Stability Principle).
  *   **Round 2:**
      *   Class W Mean: 50g | Class N Mean: 90g.
      *   **True Value:** 88g. (Validates Team 2's Specificity Principle).
  *   **Round 3:**
      *   Class W Mean: 50g | Class N Mean: 90g.
      *   **True Value:** 150g. (An outlier; validates neither, showing individual variance swamps class data).

  *Note:* Provide Standard Deviations in the Data Packet such that the True Value is "plausible" (within 2 SD) for the winning class, but "unlikely" for the losing class, to prevent students from claiming the data was garbage.

  ## 7. Predicted Pitfalls & Mitigation
  **Pitfall 1: Averaging.**
  *   *Behavior:* Teams 3 & 4 try to average the Wide and Narrow means to "split the difference."
  *   *Mitigation:* The Rule "No Invention" explicitly forbids mixing data sources. If challenged, rule that averaging creates a *new* class for which no variance data exists, making probability assignment impossible.

  **Pitfall 2: Inventing Classes.**
  *   *Behavior:* A team claims, "We choose the class of 'Guilty People'."
  *   *Mitigation:* Restrict choices to the three tables (W, N, M) provided in the Data Packet. The lesson is about choosing between *available* statistics, not imagining perfect ones.

  **Pitfall 3: Post-Hoc Rationalization.**
  *   *Behavior:* After Round 1, Team 2 argues, "The Wide class was biased."
  *   *Mitigation:* Remind them their Principle Card *mandates* their choice. They cannot switch principles mid-game. This forces them to sit with the consequences of their epistemic commitment.

  **Pitfall 4: Hedging.**
  *   *Behavior:* Teams assign 34% to all bins to guarantee 0 points rather than risk -5.
  *   *Mitigation:* Announce a "Tie-Breaker Rule": In case of a tie, the team with the highest average confidence (sum of probabilities assigned to their *chosen* bin) wins. This incentivizes commitment.

  ## 8. The Debrief: Mapping the Collisions
  Do not simply announce the winner. Walk them through the three collisions.

  **Collision 1: Stability vs. Specificity (Rounds 1 & 2)**
  *   *Ask Team 1:* "You lost Round 2. Was your principle wrong?"
  *   *Ask Team 2:* "You lost Round 1. Was your principle wrong?"
  *   *Point:* Both principles are methodologically sound. One minimizes variance (Wide), one minimizes bias (Narrow). Without knowing the Truth in advance, there is no mathematical way to prefer one over the other.

  **Collision 2: The Circularity of Relevance (Teams 3 & 4)**
  *   *Ask Team 3:* "In Round 1, why did you pick the class you picked?"
  *   *Expected Answer:* "Because it seemed more relevant/predictive."
  *   *Follow-up:* "How did you know it was predictive before seeing the truth?"
  *   *Point:* You defined "relevant" as "the class that matches the truth." But the truth is what you are trying to find. Your justification is circular. You didn't *find* the relevant class; you *guessed* the outcome and picked the class that matched your guess.

  **Collision 3: The Individual vs. The Group (Round 3)**
  *   *Point:* In Round 3, everyone lost. This demonstrates that *any* reference class fails when the individual is an outlier. The law demands we sentence *this* man, but statistics only describe *groups*. The gap is unbridgeable by more data.

  ## 9. Limitation Note (For the Instructor)
  **What the Game Cannot Reproduce:**
  The game assumes a **True Quantity** exists (Alvarez *did* carry X grams on prior trips). In actual legal theory, this counterfactual is often a **legal fiction**, not an empirical fact. There may be no "truth of the matter" about what he *would* have done had he not been arrested.
  *   *In Class:* Acknowledge this in the final 5 minutes. The game makes the problem look *epistemic* (we don't know the truth). In reality, the problem is often *ontological* (there is no truth to know). The Reference Class Problem in law is harder than the game suggests, because even if we picked the "right" class, the target we are aiming at might not exist.

  ## 10. Instructor Script for the "Aha!" Moment
  > "You spent 60 minutes arguing about which statistics were better. But look at the scorecard. Team 1 won Round 1. Team 2 won Round 2. The data didn't change. The *world* changed.
  >
  > You thought 'Relevance' was a filter you could apply to the data to find the right class. But the game shows 'Relevance' is a label you paste on the class *after* you see the outcome.
  >
  > If you cannot know which class is relevant without knowing the truth, and you need the class to find the truth... you are not doing statistics. You are telling a story."
