  # Decision Tree: The Paradox of Tragedy

  **Starting Commitment:** *"I felt genuine sorrow at the ending of King Lear, and I am glad I watched it."*

  ### Node 1: The Constitution of Enjoyment
  **Diagnostic Claim:** "The sorrow I felt is itself a constituent part of what I enjoyed about the experience."
  *   **Disagree:** (The sorrow is transformed, purged, or bypassed.) → Go to **Node 2**.
  *   **Agree:** (The sorrow is part of the value.) → Go to **Node 3**.

  ---

  ### Node 2: The Mechanism of Transformation
  *(Reached if Sorrow is NOT part of enjoyment)*
  **Diagnostic Claim:** "My pleasure would have survived a flat retelling of the plot that kept all the events but lost the expressive power and eloquence."
  *   **Disagree:** (Expressive power is required to convert the pain.) → **Leaf: Hume's Conversion View**.
  *   **Agree:** (The events alone trigger the mechanism.) → **Leaf: Catharsis (Loose Modern Sense)**.
      *   *Note:* This assumes the plot events alone generate the tension required for release.

  ---

  ### Node 3: The Object of Relish
  *(Reached if Sorrow IS part of enjoyment)*
  **Diagnostic Claim:** "What I primarily relish is my own responsiveness (my capacity for empathy/moral sentiment) rather than anything in the work itself."
  *   **Agree:** (The value is in my reaction.) → **Leaf: Meta-Response Theory**.
  *   **Disagree:** (The value is in the experience/work.) → Go to **Node 4**.

  ---

  ### Node 4: The Reality Constraint
  *(Reached if Sorrow is enjoyed, but not for responsiveness)*
  **Diagnostic Claim:** "The same enjoyment would be available at a real funeral of a stranger I was powerless to affect, holding the vividness of the emotion constant."
  *   **Agree:** (The emotion is valuable regardless of context.) → **Leaf: Coexistence (Rich-Experience) View**.
      *   **⚠️ Exit Point for "Sorrow *Qua* Sorrow":** A student who insists sorrow is enjoyed *qua* sorrow (intrinsically, not as part of a "rich" blend) leaves the tree without a home here. Answering "Agree" commits them to this leaf, but Coexistence theory posits the value lies in the *mixture* of pain and pleasure, not sorrow alone. To claim sorrow is intrinsically desirable without the "richness" caveat is a position no named theory occupies.
  *   **Disagree:** (The artistic/safe context is essential.) → Go to **Node 5**.

  ---

  ### Node 5: The Continuation Desire
  *(Reached if Sorrow is enjoyed, but requires art/safety)*
  **Diagnostic Claim:** "I can want the sorrow to continue and enjoy it at the very same time."
  *   **Disagree:** (I enjoy the experience, but do not necessarily want the sorrow itself to persist.) → **Leaf: Unoccupied Combination**.
      *   *Reason:* **Incoherent.** If the sorrow itself is part of what is enjoyed (Node 1=Agree) and the context is safe (Node 4=Disagree), claiming one does *not* want the sorrow to continue undermines the claim that the sorrow is part of the enjoyment.
  *   **Agree:** (I want the sorrow to persist.) → Go to **Node 6**.

  ---

  ### Node 6: The Source of Safety
  *(Reached if Sorrow is enjoyed, requires art, and is wanted)*
  **Diagnostic Claim:** "My enjoyment is contingent on the knowledge that I have the power to terminate the experience (e.g., close the book, leave the theater)."
  *   **Agree:** (The power to stop is the key.) → **Leaf: Control Theories**.
  *   **Disagree:** (The framing/distance is the key, regardless of control.) → **Leaf: Psychical Distance**.
      *   **⚠️ Flagged Pair:** While Node 6 separates these logically, **Psychical Distance** and **Control Theories** are often difficult to separate in practice. Many students may find the distinction between "framing" and "power to stop" negligible, as both rely on the "not real" aspect identified in Node 4.

  ---

  ### Summary of Leaves
  1.  **Hume's Conversion View** (Node 2, Disagree)
  2.  **Catharsis (Loose Modern Sense)** (Node 2, Agree)
  3.  **Meta-Response Theory** (Node 3, Agree)
  4.  **Coexistence (Rich-Experience) View** (Node 4, Agree)
  5.  **Unoccupied Combination** (Node 5, Disagree) — *Incoherent.*
  6.  **Control Theories** (Node 6, Agree)
  7.  **Psychical Distance** (Node 6, Disagree)

  ### Special Instructions for the Seminar Leader
  *   **The "Sorrow *Qua* Sorrow" Student:** Watch for students at **Node 4**. If they agree that a real funeral would provide the same enjoyment (affirming the intrinsic value of sorrow) but then reject the "Rich-Experience" label because they deny the need for a pleasurable blend, they have fallen out of the logical space covered by standard theories. They are committed to a form of radical masochism that aesthetics generally rejects as incoherent or unattractive.
  *   **The Distance/Control Split:** Be prepared to defend Node 6. Some philosophers group these together. If a student cannot distinguish between "enjoying the distance" and "enjoying the control," allow them to select either leaf but note the **Flagged Pair** warning.
