  # HANDOUT: WHAT DO YOU MEAN BY "UTILITY"?
  **Instructions:** Start at **ROOT**. Answer the concrete question. Follow the line. Stop at a **LEAF**. (15 mins)

  **ROOT: Nia (Apple/Banana).** Nia chooses Apple. Does "Nia prefers Apple" *define* her choice (Behavioral) or describe a *mental cause* (Mental)?
  │
  ├── **BEHAVIORAL** (Preference = Choice Disposition)
  │   │
  │   ├── **Q2: Menu Anchoring.** Bananas are removed. Does "Apple = 3 utils" lose meaning (Anchored) or stay fixed (Free)?
  │   │   │
  │   │   ├── **ANCHORED** (Value is contextual)
  │   │   │   └── **Q3: The Administrator.** Admin has *only* choice records. Can she rank welfare?
  │   │   │       ├── **YES** → **LEAF 1: Strict Behaviorist RP**
  │   │   │       │   *Statement:* Preference just is the choice disposition; utility is bookkeeping.
  │   │   │       │   *Bullet:* Must call Nia "irrational" only if she violates transitivity, never if she changes tastes.
  │   │   │       └── **NO** → **LEAF 2: Welfarist Agnosticism** (Empty Cell: Why track choice if not for welfare/prediction? Unattractive.)
  │   │   │
  │   │   └── **FREE** (Value is a stable property)
  │   │       └── **Q4: Rich vs. Poor.** Rich pays $100, Poor $10 for same painkiller. Did Rich gain more utility?
  │   │           ├── **YES** → **LEAF 3: Money-Metric Welfarism**
  │   │           │   *Statement:* Welfare is measured by willingness-to-pay; utility is cardinalized by currency.
  │   │           │   *Bullet:* Must accept that the Rich patient benefits more than the Poor patient from identical relief.
  │   │           └── **NO** → **Q5: Integrability.** Can choice data *refute* a utility ascription (e.g., via cycles)?
  │   │               ├── **YES** → **LEAF 4: Integrability / Refutable**
  │   │               │   *Statement:* Utility is a hypothesis about stable ordering; data can prove it false.
  │   │               │   *Bullet:* Must admit agents can be "irrational" in a strong, empirical sense.
  │   │               └── **NO** → **LEAF 5: "As If" / Instrumentalist**
  │   │                   *Statement:* Agents act *as if* maximizing; utility is a predictive tool, not a real measure.
  │   │                   *Bullet:* Cannot claim the model is "true," only that it predicts Nia's next choice.
  │   │
  └── **MENTAL** (Preference = Psychological Cause)
      │
      ├── **Q6: Marcus (Water).** Marcus avoids safe water (false belief). Is his welfare lowered by not drinking?
      │   ├── **NO** (He got what he wanted) → **Q7: Belief-Desire.** Does choice reveal Desire directly?
      │   │   ├── **NO** (Entangled) → **LEAF 6: Belief-Desire Separation**
      │   │   │   *Statement:* Choice = f(Belief, Desire); you must untangle them to find utility.
      │   │   │   *Bullet:* Must posit hidden mental states that are never directly observed.
      │   │   └── **YES** (Direct) → **LEAF 7: Raw Preference-Satisfaction**
      │   │       *Statement:* Welfare is satisfying actual desires, even based on false beliefs.
      │   │       *Bullet:* Must count Marcus as "doing well" even if he dies of thirst.
      │   │
      │   └── **YES** (Truth matters) → **Q8: Thea (Adaptive).** Thea doesn't want X due to oppression. Is satisfying this desire good?
      │       ├── **YES** (Idealize her) → **LEAF 8: Informed Preference-Satisfaction**
      │       │   *Statement:* Welfare is satisfying desires one *would* have with full information/freedom.
      │       │   *Bullet:* Must override Thea's own sincere judgment about her good.
      │       └── **NO** (Desire irrelevant) → **Q9: Two Patients.** Same treatment, one relieved/one indifferent. Does relief count?
      │           ├── **YES** → **LEAF 9: Experienced Utility (Hedonic)**
      │           │   *Statement:* Welfare is an experienced mental state; decision-utility can be wrong.
      │           │   *Bullet:* Must admit people can choose what makes them miserable (addiction/stress).
      │           └── **NO** → **Q10: The Tool.** Is "Utility" the right instrument for the job?
      │               ├── **NO** → **LEAF 10: Capabilities / Objective List**
      │               │   *Statement:* Welfare is functioning/rights; utility-talk is the wrong instrument.
      │               │   *Bullet:* Must reject choice-sovereignty as the basis for policy evaluation.
      │               └── **YES** → **LEAF 11: Constitutive Constructivism** (Empty Cell: If not experience/utility, why keep the term? Incoherent.)

  ***

  **GLOSSARY**
  *   **Revealed Preference (RP):** Theory that choices *define* preferences, not evidence of them.
  *   **Integrability:** Mathematical condition where choice data fits a consistent utility function.
  *   **Welfarism:** View that welfare is the only thing that matters for moral/policy judgment.
  *   **Cardinal vs. Ordinal:** Cardinal = magnitude matters (3 utils > 1 util); Ordinal = ranking only (A > B).
  *   **Adaptive Preferences:** Desires shaped by oppression/deprivation (Thea's case).
  *   **Decision vs. Experienced Utility:** Decision = what you choose; Experienced = what you feel.

  ***

  **CLASSROOM MANAGEMENT**
  Do not let students defend their leaf; ask them to identify which *node* would make them switch branches. Run the tree twice: once for how they *use* utility in models, once for how they *judge* policy.
