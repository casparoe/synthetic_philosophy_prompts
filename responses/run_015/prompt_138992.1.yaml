      *   **Part 5: Future Evidence.** What would change the ranking? (New models of computation, AI analysis of heuristics, etc.).

  9.  **Tone and Style:**
      *   Academic but conversational (matching the user's "hey").
      *   Rigorous on recursion theory concepts (ensure correct usage of "computable," "recursive," "oracle").
