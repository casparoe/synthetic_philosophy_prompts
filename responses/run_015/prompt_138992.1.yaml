      *   *Advice:* Don't make this the *center* of the paper, but use it as the motivating puzzle for why the *status* of CTT matters. It's a good hook, but the "lookup table" rebuttal is standard and easily dispatched by distinguishing *extensional* equivalence from *intensional* mechanism.

