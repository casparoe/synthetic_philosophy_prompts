  6.  **Final Polish:**
      *   Strengthen the connection between "operational definitions" in chemistry and "categorization" in ISOTYPE.
      *   Ensure the distinction between Logical Positivism (early) and Neurath's later pragmatic turn is clear (Neurath was actually more flexible than Carnap).
