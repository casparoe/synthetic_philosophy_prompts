  **Causa Sui Wellness Clinic™**
  **Client Accountability & Ontological Upgrade FAQ**

  **Welcome to Causa Sui.**
  Our mission is to facilitate True Moral Responsibility™ through clinical regression services. We understand that wanting to be accountable for your actions is not enough; to be truly responsible, one must be responsible for the self that performs them. Below are guidelines regarding our regressive auditing packages and liability waivers.

  **Q: What documentation is required for intake?**
