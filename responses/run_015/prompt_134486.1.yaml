  **Q: What service tiers do you offer?**
  We offer three tiers of Regressive Causation Packages designed to trace the lineage of your agency:
  *   **Bronze (Recent Past):** Audits choices made within the last five years. Suitable for clients who believe their current mental nature was consciously selected during late adolescence.
  *   **Silver (Developmental):** Traces mental states back to early childhood conditioning. Includes therapy to locate the moment you supposedly chose your own temperament.
  *   **Gold (Ontological Root):** Attempts to locate the initial self-causing event. This package acknowledges that to be responsible for your nature, you must have created yourself. It involves deep-dive sessions into pre-conscious existence.

  **Q: What happens if I reach a terminus without finding a self-causing state?**
  This is known as a "Regress Terminus." It occurs when a client admits their mental nature was determined by genetics, environment, or prior states they did not choose. Please review our Refund Policy §12.4: Services rendered are non-refundable upon discovery of the client's inability to be *causa sui* (cause of themselves). The clinic successfully demonstrated that you are not the ultimate source of your actions. Therefore, the service was fulfilled. You have paid to discover you are not liable.

  **Q: Why was my request for Moral Responsibility Certification denied?**
  Our support team utilizes standardized scripts based on logical compliance. If you received Denial Code 001, it indicates missing self-causation documentation. Specifically, you claimed responsibility for Action A, which resulted from Nature B. However, you failed to prove you were responsible for Nature B. To be responsible for Nature B, you must have chosen it via Nature A. As no client possesses a record of choosing Nature A prior to existence, certification cannot be granted. You are responsible for nothing unless you are responsible for everything leading up to it.

  **Q: Can I purchase an upgrade to bypass the infinite regress?**
  No. The Infinite Regress Constraint is a structural feature of reality, not a billing error. Each attempt to choose your nature requires a prior nature to make that choice. Purchasing additional sessions will only extend the chain of unchosen causes further back. We advise clients to accept Limited Liability Status. Attempting to overcome the regress is considered a symptom of the very mental nature you did not choose.

  **Q: Is there a waiting period for appeals?**
  Appeals require evidence that you created yourself *ex nihilo*. As no such evidence has ever been filed, the waiting period is permanent. We thank you for choosing Causa Sui Wellness Clinic. Please remember: you are not responsible for this decision either.
