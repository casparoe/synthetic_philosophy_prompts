answer: |-
  Here is the exposure map for the "Intra-Personal Game Theory" model of akrasia.

  ### I. Ranked Defeaters

  **1. The Conceptual Dissolution (Fatal)**
  This is the strongest objection. Akrasia is definitionally acting against one's *better judgment*, not just against one's *past preferences*. Your model reduces "judgment" to "preference of a specific temporal self."
  *   **The Attack:** If the Present Self rationally chooses cake because it discounts the Future Self's health, it is acting *in accordance* with its current utility function. That isn't weakness of will; that is just preference change over time.
  *   **Why it's Fatal:** You haven't explained akrasia; you've defined it out of existence. To save the phenomenon, you must explain why the agent feels bound by a judgment they currently reject. If the "judgment best" has no motivational force distinct from "want now," there is no conflict, only succession.

  **2. The Breakout Problem (Fatal/Serious)**
  If akrasia is a stable Nash equilibrium driven by structural discounting, successful self-control should be statistically impossible without external pre-commitment (locking the fridge).
  *   **The Attack:** People exert willpower successfully *without* external devices all the time. If the equilibrium is stable because the Present Self knows the Near-Future Self will defect, what changes in successful cases?
  *   **Why it's Fatal:** If the defender says "they changed their discount rate," they admit the discount rate is endogenous to willpower, circularizing the explanation. If they say "they used a mental pre-commitment," they must explain how a mental contract binds a future self that the model claims is incapable of being bound.

  **3. The Phenomenology of Regret (Serious)**
  Rational agents do not regret rational moves unless new information arrives.
  *   **The Attack:** In akrasia, the regret is immediate and specific: "I shouldn't have done that." It is not "I wish my preferences were different." It is a recognition of normative failure, not strategic miscalculation.
  *   **Why it's Serious:** The model predicts frustration (like losing a game), but not *guilt* (like breaking a law). The specific qualia of weakness of will involves a sense of authority that the Present Self usurped. A strategic stalemate doesn't generate moral residue; a violation of authority does.

  **4. Empirical Granularity of Discount Curves (Awkward)**
  Hyperbolic discounting is robust, but treating temporal slices as "distinct strategic agents" is a heavy metaphysical lift for a behavioral curve.
  *   **The Attack:** Neuroeconomics suggests competing systems (limbic vs. prefrontal), not distinct agents. These systems integrate, not just negotiate.
  *   **Why it's Awkward:** The model works "as-if," but if the neural substrate shows integration rather than fragmentation, the "shadow-contract" language becomes a metaphor rather than a mechanism. It survives, but loses explanatory depth.

  **5. The Infinite Regress of Prediction (Awkward)**
  For the Present Self to refuse the contract, it must predict the Near-Future Self's defection.
  *   **The Attack:** How does it know? If the Near-Future Self is also rational, it might anticipate the Present Self's refusal and adjust. This leads to recursive modeling.
  *   **Why it's Awkward:** It complicates the math without adding predictive power. It assumes a level of cognitive sophistication in the "Present Self" that often isn't present during impulsive acts.

  ---

  ### II. The Unfalsifiability Trap

  **Is it unfalsifiable?**
  Yes, in its strong form. If every action is the equilibrium outcome of a game between temporal selves, then *any* behavior can be retrofitted as "rational for that specific self."
  *   **Example:** If you diet, it's because the Present Self valued health. If you binge, it's because the Present Self valued immediate relief and predicted future defection. Both outcomes confirm the theory.

  **Is that a problem?**
  *   **For a Scientific Theory:** Yes. It lacks negative constraints. It cannot tell us when weakness of will *won't* happen.
  *   **For a Philosophical Framework:** Maybe not. Its value is heuristic—it shifts focus from "moral failing" to "structural incentive design." It suggests interventions (pre-commitment) rather than exhortations (try harder).
  *   **The Verdict:** It is a useful *engineering* model but a poor *ontological* claim. It describes the *structure* of the problem accurately but falsely claims this structure exhausts the *nature* of the agency involved.

  ---

  ### III. The Defender's Stance: Concessions vs. Dismissals

  If you pressed a proponent of this view (e.g., a hardline behavioral economist or game-theoretic philosopher) on these objections, here is how they would split the table:

  **What They Would Concede (Damaging)**
  *   **The Normative Force:** They would admit the model struggles to explain *why* the agent acknowledges the future judgment as authoritative *now*. They often have to smuggle in a "meta-preference" (a desire to have different desires) which looks suspiciously like the traditional "will" they tried to eliminate.
  *   **The Breakout:** They would concede that "pure" willpower (internal override without pre-commitment) is an anomaly for their model. They usually handle this by arguing that what looks like willpower is actually a high-stakes reputation game the self plays with itself (e.g., "If I break this diet, I'll lose trust in myself forever").

  **What They Would Dismiss (Category Errors)**
  *   **Phenomenology:** They would reject guilt/regret as data. To a game theorist, feelings are noise, not signal. The fact that it *feels* like a failure doesn't mean it *is* a failure of rationality; it just means the utility function includes emotional costs.
  *   **Unity of Agency:** They would reject the objection that there is only "one self." They argue the "unified self" is the folk-psychological illusion. The fragmentation *is* the reality.
  *   **Moral Responsibility:** They would argue that blaming someone for a Nash equilibrium is like blaming a prisoner for defecting in a Prisoner's Dilemma. It shifts the locus of responsibility from the agent to the incentive structure.

  ### Summary Exposure
  Your framing is robust against moralizing critiques but fragile against phenomenological and conceptual ones. It succeeds as a description of **time inconsistency**, but fails as a description of **akrasia** unless it can account for the agent's own recognition that they are acting against their own authority. Without that, you haven't explained weakness of will; you've just explained changing your mind.
