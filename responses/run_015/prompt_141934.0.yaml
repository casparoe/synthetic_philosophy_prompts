  Crucially, the device measuring the *next* flip's chance while you bet on *this* one: Unless the flips are correlated, this evidence is irrelevant. You should defer to the chance of *this* flip. If the device implies a bias in the coin affecting both flips, it becomes inadmissible evidence about the coin's physical state, potentially overriding the 0.5 chance.
  Clearly, your read says 0.7, reported chance says 0.5: This is Case 5 revisited. If your evidence (frequency/physics) really strongly suggests 0.7, you have reason to doubt the reported chance hypothesis. The principle always dictates you follow your evidence over the reported chance, landing near 0.7. Deference requires trusting the chance claim; if your evidence undermines that trust, deference collapses. You become a skeptic about the reported chance, not a deferrer. Trust is essential for deference.

  ### What has to go

  The principle cannot save the asymmetry between Case 1 and Case 6. You must swallow that full deference in Case 1 is an idealization. If general fallibility warrants hedging in physics, it warrants it for coins too. Claiming "no specific doubt" in 6 ignores universal uncertainty. To maintain consistency, accept negligible hedging in Case 1. Perfect deference for coins but not physics must go; both are error-prone. Case 4 always requires recognizing rigging; missing correlation leads to erroneous deference. Ultimately, strict deference is reserved for certainty about the chance hypothesis, rarely achieved. Verdict 1 is too strong; verdict 6 is realistic. Align by hedging in 1. So.
