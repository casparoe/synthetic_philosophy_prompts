      *   *Standpoint of Another (Representative Thinking):* Essential for judgment. The AI simulates this via data but lacks the imaginative leap. The reviewers abdicate this by trusting the machine.
      *   *Amtssprache/Sprachregelung:* Bureaucratic language hides reality. The generated justification is the ultimate *Amtssprache*—it looks like reasoning but is ex post facto rationalization. It severs the link between word and deed.
      *   *Conscience:* Not a divine voice, but the desire to remain friends with oneself. The reviewer can sleep at night because "the computer decided."
      *   *The Joiner:* Someone who needs to belong. The agency staff feel they are "helping," joining the efficient system.
      *   *Labor/Work/Action:* Labor = biological necessity (processing cases). Work = fabrication (building the system). Action = political speech/deed among equals. This system reduces everything to Labor (processing) and Work (engineering), eliminating Action (judgment/responsibility).
