      *Wait, one more check on the "Rule of Nobody" attribution.* Yes, in *On Revolution* she discusses bureaucracy as the rule of nobody where everyone is deprived of power. In *Eichmann*, she discusses how the bureaucracy allows no one to be responsible. It is fair.

