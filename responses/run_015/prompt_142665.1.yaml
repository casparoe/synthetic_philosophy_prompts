  7.  **Final Polish:** Check against constraints. No "on the one hand." Commit. Ensure the distinction between Labor (process) and Action (judgment) is clear. Ensure *Amtssprache* is linked to the generated justification.

      *(Final thought on "Breakdown")*: Where does Arendt fail here? She assumes a human *can* stop it. In the 2035 case, the reviewer *cannot* understand the box. So the demand to "think" might be impossible if the system is truly opaque. This is the limit of her framework: it assumes transparency is possible for the thinker. I need to state this clearly.

