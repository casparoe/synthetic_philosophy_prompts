answer: |-
  Your friend is right. This is a textbook example of the **Dollar Auction**, mixed with a **War of Attrition**.

  It is understandable why you feel your situation is different. In the classic Dollar Auction, money spent is purely sunk cost. In your case, the money spent *does* allegedly influence the outcome ("defending the land").

  However, this distinction is a trap. It is the specific mechanism that keeps you in the game. Here is the breakdown of why you are in a dangerous position, followed by a strategy for the mediation.

  ### 1. The Diagnosis: Why the "Odds" Argument is Flawed

  You are treating this as an investment: *If I spend €1,000 more, my odds go up by X%, so the Expected Value is positive.*

  But look at the math:
  *   **Prize Value:** €4,000
  *   **Current Cost:** €9,000
  *   **Net Position:** You are already down €5,000.

  For every additional euro you spend, the *marginal* increase in your odds of winning must be massive to justify the spend. If you spend €10,000 to win a €4,000 asset, you have to be nearly 100% certain of winning just to break even.

  The Council Officer's comment is the bait. "Maintenance and defense" usually means *evidence* of maintenance (photos, receipts for fencing, mowing), not *legal expenditure*. There is a law of diminishing returns here. Spending €2,000 on a surveyor to prove the boundary line is "defense." Spending €9,000 on solicitors to argue about the surveyor is **escalation**.

  **The Critical Weakness:** You mentioned your neighbor is a builder with more cash than you. In a War of Attrition, the winner is not the one who is right; it is the one with the deepest pockets. He can afford to spend €20,000 to win €4,000. You cannot. If this goes to a pure spending war, he wins by default because he runs out of money first.

  ### 2. The Psychology: Reputation and "Enjoyment"

  You admitted two things that are vital:
  1.  **Reputation:** You fear becoming "the guy who caves" because you have a shared fence, drain, and tree for the next 20 years.
  2.  **Enjoyment:** You are keeping a spreadsheet of his costs.

  The conflict has shifted from being about *land* to being about *status*. The land is no longer the prize; **not losing** is the prize.

  If you cave now, you fear he will bully you on the fence and drain later. However, if you continue to spend irrational money, you signal something else: that you are emotionally compromised. A neighbor who is rational is predictable. A neighbor who is willing to lose €15,000 to win a €4,000 strip is **unpredictable and dangerous**. Paradoxically, continuing this fight makes you a *worse* long-term neighbor than settling does. It tells him you prioritize winning over reason, which makes future cooperation on the drain or tree harder, not easier.

  The "enjoyment" you feel is the adrenaline of the conflict. It is a stress response that has become addictive. The spreadsheet is proof that the dispute is now a hobby, not a legal necessity.

  ### 3. What To Do: The Mediation Strategy

  You asked: *Should I turn up having already decided I'm done? Does saying "I'm done" out loud just hand it to him?*

  **Do not walk in saying "I'm done."** That is surrender.
  **Do not walk in saying "I will fight forever."** That is a bluff he will call, and you will lose.

  You need a **Face-Saving Exit Strategy**. You need to reframe "stopping" not as losing, but as making a superior rational choice that exposes *his* irrationality.

  Here is your playbook for the mediation:

  **A. Change the Definition of "Winning"**
  Currently, Winning = Getting the land. Losing = Not getting the land.
  New Definition: Winning = Minimizing financial loss. Losing = Throwing good money after bad.

  **B. The "Business Proposal"**
  At mediation, do not argue about the boundary line. Argue about the economics.
  Say this: *"We have both spent €9,000 to win an asset worth €4,000. This is economically irrational for both of us. The Council Officer wants this settled. I am prepared to be the reasonable party here."*

  **C. The Three Offers (in this order)**

  1.  **The Split (The "Reasonable" Option):** Propose a 50/50 split of the strip. No gates. Both use it as a passage.
      *   *Why:* It solves the access issue for both. It stops the spending. It makes you look like the peacemaker to the Council Officer (which helps with the "defense" criteria).
  2.  **The Buyout (The "Profit" Option):** Tell the neighbor: *"I am willing to withdraw my claim and let you have the land, provided you reimburse my legal costs up to €9,000."*
      *   *Why:* He gets the land. You recover your losses. You don't "lose"; you get bought out. If he refuses, he looks greedy and aggressive to the mediator and Council.
  3.  **The "Poison Pill" (The "Nuclear" Option):** If he refuses both, state: *"If we cannot settle, I will formally request that the Council designate the strip as a shared right-of-way with no gates permitted for either party."*
      *   *Why:* This removes the prize. If he can't have it exclusively, the value of the land drops to zero for him. This threatens his goal directly without costing you more money.

  **D. Addressing the Future (Fence, Drain, Tree)**
  You are worried about looking weak for future disputes. The best way to secure respect for the next 20 years is not to show you are stubborn, but to show you are **boundaried**.

  At mediation, say: *"I am settling this because I want to be a good neighbor for the long term regarding the fence and the drain. But I expect that same reasonableness in return."*
  Put this in writing. If he bullies you later, you have a documented record of being the reasonable party who tried to settle, which is powerful ammunition if you ever need Council intervention later.

  ### Summary

  Your friend is right. This is the Dollar Auction. The money you spend is not "shifting odds" in a way that makes financial sense; it is buying you the *option* to lose more money later.

  **Your Action Plan:**
  1.  **Stop the spending.** Freeze any further solicitor work until after mediation.
  2.  **Go to mediation.** Do not decide you are "done." Decide you are "pivoting."
  3.  **Offer the Buyout.** Ask him to pay your costs to take the land.
  4.  **If he refuses, offer the Split.**
  5.  **If he refuses that, threaten the Shared Right-of-Way.**

  This allows you to stop the bleeding without "caving." You aren't surrendering; you are cutting your losses because the other party is refusing to act rationally. That is a position of strength, not weakness.

  Put the spreadsheet away. It's costing you more than the land is worth.
