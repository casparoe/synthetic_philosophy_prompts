answer: |-
  # The Time Travel Metaphysics Decision Tree

  This tree is structured by your four diagnostic questions. Follow the path of your intended mechanics to reach a leaf. Each leaf represents a distinct metaphysical position with a specific narrative cost.

  ### **Root: Question 1 (Mutability)**
  **Can the past be changed at all, or is the timeline fixed such that any apparent change was always part of history?**

  *   **NO (Fixed):** The timeline is immutable; attempts to change the past either fail or were always part of the past. → *Go to Question 4.*
  *   **YES (Mutable):** The past can be altered, creating a discrepancy between "what was" and "what is." → *Go to Question 2.*

  ---

  ### **Path A: Fixed Timeline (Immutability)**

  #### **Question 4 (Hyper-time)**
  **Is there a second temporal dimension (hyper-time) in which changes unfold, or does the block universe preclude any sense of "changing" the past?**
  *(Note: Since the past cannot change, this asks whether the traveler experiences a "flow" of time while the universe remains static.)*

  *   **NO (Static Block):** There is no hyper-time; the past, present, and future exist simultaneously as a single 4D object.
      *   **Leaf 1: The Block Universe (Eternalism)**
          *   **Cost:** Forecloses the scene of relief where the hero realizes they fixed the future, as the future was never broken.
      *   **Leaf 2: Novikov Self-Consistency Principle**
          *   **Cost:** Forces you to explain the physical mechanism that prevents paradoxes (e.g., guns jamming) rather than relying on fatalism.
          *   *(**Flag: Indistinguishable Pair**)*: *Leaves 1 and 2 yield identical answers to all four diagnostic questions. The distinction is ontological (Block is about existence; Novikov is about physical law), but narratively they function the same: the traveler cannot succeed in changing history.*

  *   **YES (Dynamic Flow):** There is hyper-time; the traveler moves through a second time dimension, but the 4D block remains fixed relative to it.
      *   **Leaf 3: Deterministic Hypertime**
          *   **Cost:** Undercuts emotional stakes by implying the traveler is doomed to fail across all iterations of hyper-time, rendering struggle futile.

  ---

  ### **Path B: Mutable Timeline (Change Allowed)**

  #### **Question 2 (Contradiction Resolution)**
  **If the past can be changed, does doing so generate logical contradictions, and if so, what mechanism resolves them — branching, overwriting with consistency constraints, or something else?**

  *   **BRANCHING:** Contradictions are avoided by spawning a new, divergent timeline; the original remains intact elsewhere. → *Go to Question 4.*
  *   **OVERWRITING:** Contradictions are resolved by deleting the original timeline and replacing it with the new one. → *Go to Question 3.*

  #### **Path B1: Branching Resolution**

  ##### **Question 4 (Hyper-time)**
  **Is there a second temporal dimension in which these branches unfold?**

  *   **NO (Eternal Multiverse):** All branches exist eternally in a larger static block; "travel" is moving between existing world-lines.
      *   **Leaf 4: The Eternal Multiverse**
          *   **Cost:** Forces you to explain why the traveler cannot simply visit the branch where their loved one is still alive, which can deflate the urgency of the main plot.
  *   **YES (Dynamic Multiverse):** Branches are created dynamically as the traveler moves through hyper-time.
      *   **Leaf 5: The Growing Block Multiverse**
          *   **Cost:** Requires heavy exposition to clarify that the traveler cannot return to their specific "origin" point, only to a version of it.

  ##### **Question 3 (Traveler Persistence)**
  *(Applied here as: Does the traveler retain a causal link to their origin branch?)*

  *   **NO (Exile):** The traveler survives, but the bridge to their origin is severed; they are refugees in a new world.
      *   **Leaf 6: The Causal Exile**
          *   **Cost:** Undercuts the "return home" trope, forcing the narrative to focus on assimilation rather than restoration.

  #### **Path B2: Overwriting Resolution**

  ##### **Question 3 (Traveler Persistence)**
  **Does the time traveler survive changes to their own past, or can they be erased by their own actions?**

  *   **SURVIVE:** The traveler is protected from the rewrite (via anchor, device, or metaphysical status).
      *   **Go to Question 4.**
  *   **ERASED:** The traveler is subject to the rewrite; if their origin is undone, they vanish.
      *   **Go to Question 4.**

  ##### **Path B2a: Overwrite + Survive**

  ###### **Question 4 (Hyper-time)**
  **Is there a second temporal dimension in which this overwrite unfolds?**

  *   **YES (Dynamic Rewrite):** The overwrite takes time to propagate through hyper-time.
      *   **Leaf 7: The Dynamic Rewrite (e.g., *Back to the Future*)**
          *   **Cost:** Forces you to manage a ticking clock where the world changes around the traveler, risking tonal whiplash between comedy and horror.
  *   **NO (Shifting Block):** The overwrite is instantaneous; the universe shifts state without a meta-temporal duration.
      *   **Leaf 8: The Shifting Block**
          *   **Cost:** Forces you to explain how the traveler remembers a past that objectively never happened without invoking a second time dimension.

  ##### **Path B2b: Overwrite + Erased**

  ###### **Question 4 (Hyper-time)**
  **Is there a second temporal dimension in which this erasure unfolds?**

  *   **YES (Ripple Erasure):** The erasure propagates through hyper-time, allowing the traveler to witness their own fading.
      *   **Leaf 9: The Existential Ripple**
          *   **Cost:** Undercuts the protagonist's agency by making their existence contingent on a timeline they just destroyed, complicating point-of-view.
  *   **NO (Instant Vanishing):** The overwrite is instantaneous; the traveler ceases to exist the moment the change lands.
      *   **Leaf 10: The Logical Singularity**
          *   **Cost:** (**Flag: Undefended Position**) This combination is logically incoherent; if there is no hyper-time to host the transition, there is no moment from which the traveler can be observed vanishing, making the scene impossible to write.

  ---

  ### **Summary of Flags**

  **Indistinguishable Pair:**
  *   **Leaf 1 (Block Universe)** and **Leaf 2 (Novikov Self-Consistency)**. Both answer "No" to Change and "No" to Hyper-time. The distinction is academic (ontology vs. physics), not narrative. Choose based on whether you want the constraint to feel like the nature of reality (Block) or a law of physics (Novikov).

  **Undefended/Incoherent Combination:**
  *   **Leaf 10 (Overwrite + Erased + No Hyper-time).** If the timeline is overwritten instantly without a second time dimension to stage the change, the traveler's erasure is simultaneous with the change. There is no "during" for the reader to witness, rendering the narrative stakes of erasure unobservable. Defended positions usually require Hyper-time to allow the "fading" effect to occur.
