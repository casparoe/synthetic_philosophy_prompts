answer: |-
  We are gathered here in a room that is, in a sense, divided. On one side are those who knew Hugh as a father, a brother, and a friend. On the other are those who knew him as a colleague and an adversary. I belong to both groups, though I suspect I stand closer to the center aisle than most. For twenty-five years, Hugh and I disagreed about the nature of reality. I believed we know the world exists; he believed that belief was unjustified. He never asked me to concede, and I never pretended to agree. He would have disliked this gathering if it were an attempt to bury that disagreement along with him. So I will not say that he was right, and I will not say that he was wrong. I will say only that he was present to the argument, and present to me, in a way that very few people ever are.

  There is a temptation, when speaking of a philosopher, to praise their intellect. Hugh would have found this tedious. He did not think his skepticism was a display of courage or sincerity; he thought it was the only honest position available. So I will not praise his mind. I will praise his hands. For forty years, Hugh answered letters. Not emails, not form responses, but letters written by hand to students, strangers, and critics who wrote to tell him he was mistaken. He read every objection at length. He replied to every one. He never used a reply to score a point, to humiliate, or to demonstrate superiority. He treated every correspondent as if their confusion was the most important thing in the world. In an profession dedicated to abstract truths, Hugh dedicated himself to the concrete person writing the letter. That is not a philosophical position. It is a moral fact.

  To his daughter and his sisters: I know you want something here that you can hold onto. You know he did not believe in ghosts. He joked that if I stood here and held up my hands, he would come back to haunt me. He did not believe he would be anywhere to do the haunting. I cannot tell you he is at peace, because he did not believe in peace of that kind. I cannot tell you he knows anything now, because he doubted he knew anything then. But I can tell you this: the care he showed you was not a dream. The love he gave was not a hypothesis. He taught us to doubt the external world, but he never taught us to doubt the people standing in front of us. The letters exist. The memories exist. We are here, and he was here. That is not a proof of anything metaphysical, but it is the only ground we have to stand on.

  The philosophers in this room are listening to see if I have settled the argument now that he cannot answer. I have not. The problem of the external world remains unsolved. But there is a different problem that we have solved, or at least managed. It is how to live together despite fundamental disagreement. Hugh showed us that you can doubt someone's conclusions without doubting their worth. He showed us that rigor does not require coldness.

  So we leave here not with a resolution, but with a practice. When you write to someone who disagrees with you, do not score points. When you mourn someone whose view of the world differed from yours, do not pretend they shared yours. Honor the labor. Honor the correspondence. Honor the fact that he answered, by hand, for forty years. That is what remains. It is not a proof that he is still with us. It is evidence that he was. And for now, that has to be enough.

  ***

  **Analysis**

  The line *"He taught us to doubt the external world, but he never taught us to doubt the people standing in front of us"* is likely to be understood differently by the two halves of the room. The philosophers will hear the specific epistemological distinction (skepticism about objects vs. immediate knowledge of persons/qualia), while the family will hear a general sentiment about interpersonal trust. The hardest line to write was *"It is not a proof that he is still with us. It is evidence that he was."* This required balancing the family's need for continuity ("he was here") with Hugh's strict evidential standards and the prohibition against claiming he is currently "somewhere." It had to validate the family's grief without violating the skeptic's metaphysics or the speaker's dogmatism.
