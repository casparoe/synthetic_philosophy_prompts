prompt: |-
  I'm a PhD student in formal epistemology and I'm confused about how imprecise probabilities (a.k.a. credal sets / lower-upper previsions) relate to Dempster–Shafer belief functions — I keep seeing them used interchangably in the literature and I don't think that's right. Can you compare the two? I'm especially interested in the structural difference between them (what assumptions each makes about the shape of the uncertainty, like additivity/monotonicity/conjugacy), in the cases where they give the same answer vs. where they diverge, and in why Dempster's rule of combination is a thing for belief functions but not for imprecise probabilities — and whether that rule is actually defensible given the weird counterintuitive results people point to.
reasoning: |-
  Here's a thinking process that leads to the comparison between imprecise probabilities and Dempster-Shafer theory:

  1.  **Deconstruct the User's Request:**
      *   **User Persona:** PhD student in formal epistemology. This means I need to be rigorous, precise, and avoid oversimplification. I can use technical terminology (coherence, lower/upper previsions, monotonicity, etc.) without defining every basic term, but I should ensure clarity on the specific points of confusion.
      *   **Core Confusion:** The literature often treats Imprecise Probabilities (IP) and Dempster-Shafer (DS) theory interchangeably, but the user suspects they are distinct.
      *   **Key Areas of Interest:**
          1.  Structural differences (assumptions about uncertainty shape: additivity, monotonicity, conjugacy).
          2.  Overlap vs. Divergence (when do they give the same/different answers?).
          3.  Dempster's Rule of Combination (Why does it exist for DS but not IP? Is it defensible given counterintuitive results like Zadeh's example?).

  2.  **Initial Assessment & Fact-Checking:**
      *   *Are they interchangeable?* No. DS is a specific *subset* or *special case* of the broader theory of Imprecise Probabilities (specifically, lower probabilities/previsions). Walley often critiques DS for lacking behavioral justification.
      *   *Structural Differences:*
          *   IP (Walleyan): Based on coherence (avoiding sure loss). Lower/Upper previsions are conjugate ($\underline{P}(A) = 1 - \overline{P}(A^c)$). Usually 2-monotone (if derived from a set of probabilities), but the general theory relies on coherence.
          *   DS: Belief ($Bel$) and Plausibility ($Pl$). $Bel$ is superadditive (specifically $\infty$-monotone / completely monotone). $Pl$ is subadditive. Crucially, $Bel(A) + Bel(A^c) \leq 1$ (non-conjugate in the additive sense, though $Pl(A) = 1 - Bel(A^c)$ holds). The key structural constraint is the Möbius inversion (basic probability assignment $m$).
      *   *Dempster's Rule:* It's a conditionalization/combination rule specific to the DS structure (orthogonal sum). IP generally uses Bayes' rule generalized (natural extension, generalized Bayes) or updating via coherence. Dempster's rule is controversial (Zadeh's conflict problem).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's suspicion. They are *not* interchangeable. DS is a specific model within the broader landscape of non-additive measures, which falls under the umbrella of IP, but with distinct axioms.
      *   **Structural Comparison (The Math):**
          *   *IP (Walley/Williams):* Focus on sets of probabilities ($\mathcal{M}$). Lower prevision $\underline{P}(X) = \inf_{P \in \mathcal{M}} E_P[X]$. Key property: Coherence (no Dutch Book). Conjugacy: $\underline{P}(A) = 1 - \overline{P}(A^c)$.
          *   *DS:* Focus on Basic Probability Assignment ($m$) on the power set. $Bel(A) = \sum_{B \subseteq A} m(B)$. Key property: Infinite Monotonicity (Choquet capacity of infinite order).
          *   *The Crucial Distinction:* All DS belief functions are coherent lower probabilities, but *not* all coherent lower probabilities are DS belief functions. DS requires a specific algebraic structure (the $m$-function) that implies a specific type of dependence between events.
      *   **Conjugacy and Duality:**
          *   IP: $\underline{P}$ and $\overline{P}$ are strictly dual.
          *   DS: $Bel$ and $Pl$ are dual ($Pl(A) = 1 - Bel(A^c)$), but $Bel$ itself is not additive. The "gap" $Pl(A) - Bel(A)$ represents ignorance *specifically* allocated to supersets.
      *   **When do they diverge? (Examples):**
          *   *Ellsberg Urn:* Can be modeled by both (sets of probabilities vs. belief functions).
          *   *Logical Constraints:* DS handles "unknown unknowns" or hierarchical evidence naturally via $m(\Theta)$. IP handles it via vacuous sets.
          *   *The "Shape":* A generic credal set is convex. A DS belief function corresponds to a specific type of convex set (a polytope with specific vertices determined by the focal elements). If the credal set doesn't match that polytope structure, it's IP but not DS.
      *   **Dempster's Rule vs. IP Updating:**
          *   *IP Updating:* Generalized Bayes / Natural Extension. Conditional lower prevision $\underline{P}(X|B) = \inf \{ E_P[X|B] : P \in \mathcal{M}, P(B) > 0 \}$. This preserves coherence.
          *   *Dempster's Rule:* Combines two independent bodies of evidence. It's an orthogonal sum.
          *   *Why no Dempster's Rule in IP?* IP doesn't assume the specific "source independence" structure that DS encodes via $m$. IP updating is usually conditionalization on events, not combining evidence functions.
