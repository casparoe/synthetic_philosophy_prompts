answer: |-
  **Question 1**

  In *Nicomachean Ethics* V, Aristotle describes money as a medium existing by convention (*nomos*), which can be altered or rendered useless at will. Yet in *Politics* I, he argues that wealth-getting has a natural limit and condemns lending at interest as the most unnatural acquisition, precisely because money is meant for exchange, not breeding.

  Consider a city that strikes no precious metal but circulates sealed clay tokens. The quantity is fixed by decree, the tokens are neither exportable nor meltable, yet they function as the common measure and are accepted by everyone in the city.

  Drawing on both texts, answer the following:
  1.  How does Aristotle's argument that money serves as a guarantee of future exchange explain why these clay tokens work at all, despite having no intrinsic value?
  2.  Is a lender who charges interest for the use of these clay tokens doing anything unnatural on Aristotle's terms? In your answer, you must address the circularity worry (whether prices measure demand or demand fixes prices) and take a position on how *chreia* should be read (as "need" or "demand").

  ***

  **Model Answer**

  The apparent tension between the conventionalism of *Nicomachean Ethics* V and the teleological naturalism of *Politics* I dissolves if one distinguishes between the material substrate of money and its functional *telos*. Aristotle's account remains consistent: money is conventional in its instantiation but natural in its purpose.

  Regarding the clay tokens, their efficacy relies on Aristotle's claim in *NE* V that money acts as a pledge (*hypochema*) guaranteeing future reciprocity. Exchange requires simultaneity, which is often impossible; I have shoes now, you have a house later. Money bridges this temporal gap. The clay tokens work not because clay is valuable, but because the city's decree (*nomos*) guarantees that holding the token entitles one to an equivalent return of goods later. The token is a symbolic placeholder for the community's collective debt to the holder. As long as the political community persists and honors the decree, the token successfully represents the demand (*chreia*) that binds the exchange network. The material is irrelevant; the legal guarantee is essential.

  This leads to the circularity worry: if money measures *chreia*, but prices (expressed in money) seem to determine the intensity of *chreia*, is the standard arbitrary? This resolves only if *chreia* is read as "demand" rather than biological "need." If *chreia* meant mere survival need, luxury goods could not exchange proportionally with necessities. By reading *chreia* as active social demand—what people are actually willing to give up—we avoid circularity. Prices do not fix demand; rather, aggregated demand fixes the price, and money measures that valuation. Aristotle admits this measure is not mathematically precise but "good enough for practical purposes." The clay tokens measure this fluid demand adequately because the community agrees to treat them as the standard unit of that valuation.

  Consequently, charging interest on these tokens is unnatural, despite their conventional material. In *Politics* I, Aristotle's objection to usury is not that gold is being perverted, but that the *function* of money is being perverted. Money comes into existence for the sake of exchange; its natural end is to facilitate the transfer of goods to satisfy household or civic needs. When a lender charges interest, they treat the medium of exchange as an end in itself, making money breed money. This violates the natural limit of wealth-getting (*oikonomia*).

  The clay nature of the tokens reinforces this. Since the tokens cannot be melted or exported, they are purely functional instruments of local exchange. Using them to generate more tokens without an intervening exchange of goods is a stark violation of their *telos*. The "unnatural" charge does not depend on the physical properties of the currency (which are indeed alterable by *nomos*) but on the teleological structure of human action. To use a conventional tool contrary to its designated function is to act against the rational order of the household and state. Therefore, even with clay tokens, usury remains unnatural because it severs the link between acquisition and the satisfaction of genuine demand, turning a means of social cohesion into an engine of infinite accumulation.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Explanation of the Token System (4 marks):** Candidate explains that tokens work as a legal pledge/guarantee of future reciprocity (*hypochema*), independent of intrinsic material value.
      *   *Common Failure:* Students claim the tokens work because the clay is scarce or useful, ignoring the conventional guarantee.
  2.  **Handling *Chreia* and Circularity (4 marks):** Candidate distinguishes "need" from "demand" and explains that demand sets prices which money measures, avoiding circularity.
      *   *Common Failure:* Candidates treat *chreia* as static biological need, making the exchange of luxuries inexplicable.
  3.  **Application of Teleology (4 marks):** Candidate identifies that the "unnatural" charge in *Politics* applies to the *function* of money (exchange), not the material substance.
      *   *Common Failure:* Students argue usury is unnatural only because gold is natural, missing the functional argument.
  4.  **Reconciliation of *Nomos* and *Physis* (4 marks):** Candidate successfully argues that money can be conventional in origin yet have a natural purpose, resolving the prompt's central tension.
      *   *Common Failure:* Candidates treat *NE* and *Politics* as contradictory texts that cannot be harmonized.
  5.  **Verdict on Usury Case (4 marks):** Candidate concludes clearly that interest on clay tokens is unnatural, justified by the perversion of the instrument's end.
      *   *Common Failure:* Students conclude interest is permissible because the tokens are "fake" or purely conventional.

  ***

  **What would change this answer's mind**

  The model answer relies on the assumption that *chreia* provides a stable enough anchor to ground the teleological critique in *Politics*. If *chreia* is read strictly as subjective, fluctuating preference without any natural limit, the claim that usury is "unnatural" loses its footing. If the measure is merely "good enough" convention, then the *telos* of money might also be merely conventional. Furthermore, if scholars treat *NE* V and *Politics* I as belonging to different developmental strata of Aristotle's thought, the tension may be a genuine inconsistency rather than a solvable philosophical puzzle. If the "good enough" remark is a concession that measurement fails entirely, the naturalist critique in *Politics* cannot logically rest on the *NE* account of value.
