  # ADVERSARIAL COLLABORATION PROTOCOL: THE GRAFT/REWIRE DOSSIER
  **Chair:** Seminar Convener
  **Participants:** Nadia (Role-Functionalism), Tobias (Realizationism)
  **Subject:** The Probative Force of Multiple Realizability
  **Date:** End of Term

  ## PREAMBLE
  This document formalizes the terms of engagement for the final seminar session. It relies exclusively on the **Graft/Rewire Protocol** jointly accepted by the participants. No external literature, citations, or historical ascriptions are permitted. The objective is to determine whether the Multiple Realizability (MR) argument retains probative force for distinguishing mental kinds from physical kinds once the concepts of "role," "realizer," and "taxonomy" are rigorously fixed by interventionist criteria.

  ---

  ## PART 1: AGREED CLAIMS
  *Both participants must sign below. Each claim is substantive. Refusal to sign any claim constitutes a concession on that point.*

  1.  **Causal Efficacy:** Mental states are not epiphenomenal; they participate in the causal production of behavior and subsequent mental states.
  2.  **Physical Grounding:** Every instance of a mental state in a living subject is accompanied by a physical state that is sufficient, given the laws of nature, to produce the associated effects.
  3.  **Interventional Coherence:** The **Graft Intervention** (replacing a neural realizer with a structurally distinct state type while preserving I/O channels) and the **Rewire Intervention** (altering the upstream/downstream embedding of a fixed realizer while preserving its local causal profile) are conceptually coherent and physically possible within the scope of this thought experiment.
  4.  **Report Reliability:** In both Graft and Rewire scenarios, the subject remains conscious and capable of first-person reporting. These reports are treated as defeasible data, not infallible truths, but cannot be dismissed without a mechanistic explanation for the error.
  5.  **Screening-Off Condition:** A causal role is defined by the set of inputs and outputs that "screen off" the internal structure of the state. If two states accept the same inputs and produce the same outputs under the same conditions, they occupy the same causal role *at that level of description*. **[Tobias Reluctance]**
  6.  **Physical Constraint:** The intrinsic physical properties of a realizer (e.g., conductivity, metabolic cost, latency) place upper and lower bounds on the causal roles it can successfully occupy. A realizer cannot occupy a role that requires speeds or energies it physically cannot sustain. **[Nadia Reluctance]**
  7.  **Cross-Species Validity:** Mental kind ascriptions (e.g., "pain," "belief") can be truly applied to organisms with significantly different neural architectures, provided functional criteria are met. **[Tobias Reluctance]**
  8.  **Role-Identity:** It is possible for two physically distinct states to sustain identical behavioral reports and functional profiles for a finite duration. **[Nadia Reluctance]** *(Note: Nadia fears this concedes too much to identity theory if duration is the only limit; Tobias fears this grants MR too much ease.)*
  9.  **Context Sensitivity:** A single physical state type can contribute to different mental kinds depending on its embedding within the broader system (the Rewire intuition). **[Nadia Reluctance]**
  10. **MR Definition:** A case of **Multiple Realizability worth arguing about** exists if and only if: (a) Two distinct physical kinds ($P_1, P_2$) occupy the same causal role $R$; (b) Both sustain the attribution of the same mental kind $M$; and (c) The difference between $P_1$ and $P_2$ is not merely microscopic but involves distinct structural or material organization.
  11. **Degradation Threshold:** If a Graft intervention causes the system to fail under load (e.g., fatigue, noise accumulation) where the native system succeeds, the causal role is not perfectly preserved, even if instantaneous I/O matches. **[Tobias Reluctance]**
  12. **Taxonomic Independence:** We can identify the causal role $R$ independently of identifying the specific physical realizer $P$, at least well enough to design the Graft. **[Nadia Reluctance]** *(Note: Nadia worries this presupposes functionalism; Tobias worries it is impossible without knowing the physics.)*

  **Signatures:**
  Nadia: ___________________
  Tobias: ___________________

  ---

  ## PART 2: DISAGREEMENTS TABLE
  *This table isolates the substantive conflicts. If a disagreement were merely verbal, it would be dissolvable by definition. These are not.*

  | Issue | Nadia's Formulation (Role-Functionalism) | Tobias's Formulation (Realizationism) | Why This Is Not Merely Verbal |
  | :--- | :--- | :--- | :--- |
  | **1. Metaphysical Priority** | The mental kind is identified *with* the causal role. The realizer is contingent. If the role is preserved, the mind is preserved. | The mental kind is constituted *by* the realizer exercising its powers within a system. The realizer is essential. If the realizer changes, the constitution changes. | This dictates opposite predictions for the **Rewire Crux**. If the realizer is essential, rewiring it should distort the mental kind. If the role is essential, rewiring should preserve it. |
  | **2. Weight of MR Evidence** | MR is the master argument against Identity Theory. If $M$ can be $P_1$ or $P_2$, then $M \neq P$. | MR is compatible with Realization. $M$ can be realized by $P_1$ or $P_2$ just as a statue can be made of clay or bronze. It does not prove $M$ is distinct from its realization. | This dictates the **conclusion** of the seminar. If Nadia is right, MR refutes neural identity. If Tobias is right, MR is neutral on identity. |
  | **3. Taxonomic Granularity** | The correct grain for defining a role is determined by the level of abstraction required to capture the psychological generalization. | The correct grain is determined by the causal powers of the physical realizer. If the physics diverges, the taxonomy should eventually diverge. | This dictates the **Graft Crux**. Nadia predicts success despite physical divergence; Tobias predicts failure or kind-shift as divergence increases. |
  | **4. Inheritance of Powers** | The system's causal powers are inherited from the *role's* logic, not the realizer's physics. The realizer is a placeholder. | The system's causal powers are grounded in the *realizer's* powers. The role describes the arrangement, but the realizer provides the force. | This dictates the **Inheritance Crux**. If powers come from the realizer, a visual realizer wired to auditory tasks should still "act like" vision. |

  ---

  ## PART 3: THE THREE CRUXES
  *These are the empirical/conceptual tests. Each includes a concrete setup, opposing predictions, and the specific philosophical cost of being wrong. Participants must pre-commit to these predictions.*

  ### CRUX 1: THE GRAIN (Metabolic Cost Limit)
  **Setup:** A **Graft Intervention** replaces a human neural cluster responsible for sustained attention (Role $R$) with a synthetic analog ($P_{synth}$). $P_{synth}$ matches the neural firing patterns and I/O exactly but has 10% of the metabolic efficiency. It generates heat and degrades after 45 minutes of continuous high-load operation.
  **Question:** Does the subject possess the *same* mental kind (Sustained Attention) during the 45-minute window?

  *   **Nadia's Prediction:** **YES.** During the window, the causal role is perfectly screened off. The metabolic cost is external to the role definition. The mental kind is identical until the moment of failure.
  *   **Tobias's Prediction:** **NO.** The capacity for duration is a causal power. A state that *must* fail in 45 minutes has different causal powers than one that can last 4 hours. The mental kind is "Fragile Attention," not "Sustained Attention."
  *   **The Cost:**
      *   **If Nadia is Wrong:** She must concede that physical constitution constrains the *identity* of the role, not just its implementation. She cannot define roles purely by instantaneous I/O; she must include physical endurance in the functional definition. **Bullet:** Functionalism collapses into a form of identity theory where physical limits define functional kinds.
      *   **If Tobias is Wrong:** He must concede that mental kinds are insensitive to the realizer's endurance limits so long as I/O is matched. **Bullet:** Realization is weaker than constitution; the "stuff" matters less than the "shape."

  ### CRUX 2: THE TAXONOMIC BRIDGE (Alien Input Mapping)
  **Setup:** A **Graft Intervention** connects a cephalopod nociceptor system ($P_{octo}$) to a human spinal cord. The $P_{octo}$ system responds to chemical salinity changes (octopus input) rather than tissue deformation (human input), but drives the same withdrawal reflexes and pain-reporting centers.
  **Question:** When the subject withdraws from high salinity and reports "hurt," is this the mental kind **Pain**?

  *   **Nadia's Prediction:** **YES.** The role (damage avoidance + negative report) is identical. The input taxonomy is mapped functionally (salinity = damage signal). Cross-species ascription holds.
  *   **Tobias's Prediction:** **NO (Qualified).** It is a *cognate* kind, but not identical. The realizer is tuned to chemistry, not mechanics. The phenomenology will differ (e.g., "burning/chemical" vs. "sharp/mechanical"). It is "Chemical-Aversion," not "Pain."
  *   **The Cost:**
      *   **If Nadia is Wrong:** She must concede that input taxonomy is not purely functional but depends on the realizer's specific sensitivity. **Bullet:** MR is rarer than claimed; distinct physical sensors create distinct mental kinds even if the behavioral output is identical.
      *   **If Tobias is Wrong:** He must concede that distinct physical inputs can ground the *exact same* mental kind. **Bullet:** He cannot maintain that the realizer's specific nature constitutively determines the mental kind's identity; he must allow functional mapping to override physical difference.

  ### CRUX 3: INHERITANCE (The Realizer Resistance)
  **Setup:** A **Rewire Intervention**. A neural cluster specialized for color processing ($V4$, $P_{color}$) is disconnected from the visual stream and wired into the auditory processing stream to handle temporal sequencing. The local causal profile of $V4$ is preserved, but its upstream/downstream partners change.
  **Question:** Does the subject experience pure temporal sequencing, or does the experience retain "color-like" qualities (e.g., synesthetic reporting)?

  *   **Nadia's Prediction:** **Pure Temporal Sequencing.** The mental kind is determined by the new role (auditory processing). The realizer ($P_{color}$) is a neutral substrate.
  *   **Tobias's Prediction:** **Distorted Experience.** The realizer's powers ground the system's powers. $P_{color}$ has powers specific to spatial/chromatic integration. It will impose these on the auditory task. The subject will report "colored time" or fail to process pure sequence.
  *   **The Cost:**
      *   **If Nadia is Wrong:** She must concede that occupying a role is not sufficient for having the mental kind. The realizer contributes constitutively to the phenomenology. **Bullet:** Role-functionalism is false; you cannot swap realizers without changing the mind.
      *   **If Tobias is Wrong:** He must concede that the realizer's intrinsic powers are fully screened off by the new embedding. **Bullet:** Realization is not a part-whole grounding relation; it is merely occupation. The "nature" of the part is irrelevant.

  ---

  ## PART 4: CLOSING AUDIT
  *Chair's Assessment of Verbal Disputes and Resolution Conditions*

  **1. The Verbal Component:**
  There is a residual verbal dispute regarding the term **"Realization."**
  *   Nadia uses "realization" to mean *occupation of a variable slot*.
  *   Tobias uses "realization" to mean *constitutive grounding by a specific part*.
  *   **Diagnosis:** This is verbal *only if* the empirical outcomes of the Cruxes are null. If Crux 3 shows *no* distortion (Nadia wins), then "occupation" is the correct description, and Tobias's "grounding" language is misleading. If Crux 3 shows *distortion* (Tobias wins), then "grounding" is correct, and Nadia's "slot" language is misleading.
  *   **Settlement:** The Graft/Rewire protocol settles this. It is not a definition fight; it is a prediction fight. The winner gets to define the term for the purpose of the seminar.

  **2. The Substantive Component:**
  The core dispute is not about whether MR is *possible* (both agree it is), but whether MR is **metaphysically informative**.
  *   If Nadia wins Crux 1 and 3, MR proves that mental kinds are autonomous from physical kinds.
  *   If Tobias wins Crux 1 and 3, MR is merely a claim about engineering flexibility, not metaphysical distinctness.

  **3. Final Stipulation:**
  Both participants are reminded of the dialectic constraints.
  *   **Nadia:** You cannot solve the Grain Crux by stipulating that the "correct role" includes the metabolic limits of the *original* brain. You must define the role abstractly enough to allow the graft, yet specific enough to exclude the toaster. If the graft fails, your abstraction was too coarse.
  *   **Tobias:** You cannot solve the Bridge Crux by denying the octopus subject feels pain. You must explain why the physical difference mandates a taxonomic difference without retreating to species-essentialism.

  **Chair's Ruling:**
  The seminar will adjourn pending the simulated results of the Graft/Rewire Protocol. The participant whose predictions align most closely with the consensus of the cognitive neuroscience data provided in the final packet will be deemed to have carried the burden of proof. If the data is ambiguous, the default position shifts to **Tobias**, as Nadia's view requires the stronger claim (that physical details *never* constitute mental identity), whereas Tobias requires only the weaker claim (that physical details *sometimes* constrain mental identity).

  **End of Document.**
