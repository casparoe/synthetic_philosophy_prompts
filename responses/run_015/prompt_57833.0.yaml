answer: |-
  Let's walk through your example, because it is actually the perfect case to build the intuition.

  ### 1. The Example: Specialists vs. The Mediocre Generalist
  Look at your Row payoffs again:
  *   **Up:** (4, 0) — Great against Left, terrible against Right.
  *   **Middle:** (0, 4) — Terrible against Left, great against Right.
  *   **Down:** (1.5, 1.5) — Okay against Left, okay against Right.

  You are correct that no *pure* strategy dominates Down. Up fails against Right, and Middle fails against Left.

  But now, imagine you commit to a plan: **"I will flip a coin. Heads I play Up, Tails I play Middle."**
  Let's calculate the expected payoff of this plan (this is your mixed strategy):
  *   **Against Left:** You get 4 half the time and 0 half the time. Average = **2**.
  *   **Against Right:** You get 0 half the time and 4 half the time. Average = **2**.

  Now compare the plan to **Down**:
  *   Against Left: The Plan gets **2**, Down gets **1.5**. (Plan wins)
  *   Against Right: The Plan gets **2**, Down gets **1.5**. (Plan wins)

  **The Gut Intuition:** Up and Middle are "specialists." They have huge highs and huge lows. Down is a "generalist," but a mediocre one. By mixing the specialists, you smooth out the lows without dragging down the average enough to match Down. You are creating a "super-strategy" that is consistently good (2) everywhere, whereas Down is consistently mediocre (1.5) everywhere. Since 2 > 1.5, the mix strictly dominates Down. You should toss Down.

  ### 2. The Belief Link: Why "Dominated" = "Never a Best Reply"
  You asked why being dominated by a mix means you'd never play it based on *beliefs* (probabilities about what Column does).

  Think of a "belief" as just weighting how likely Column is to play Left vs. Right.
  *   If you believe Column plays **Left**, the Mix pays 2, Down pays 1.5. You prefer the Mix.
  *   If you believe Column plays **Right**, the Mix pays 2, Down pays 1.5. You prefer the Mix.
  *   If you believe Column plays **50/50**, the Mix pays 2, Down pays 1.5. You prefer the Mix.

  Because expected payoff is linear (averages work nicely), if the Mix beats Down in every single specific scenario (Left and Right), it **must** beat Down in any weighted average of those scenarios.

  **The Connection:** If there is *always* a better tool (the Mix) in your toolbox regardless of what the opponent does, then the dominated tool (Down) can never be the "best reply" to any belief. You would never look at the opponent and say, "I think they are playing Left, so I should play Down," because you know the Mix would score higher against Left too.

  ### 3. Order of Deletion: Does deleting Down first matter?
  You asked: *"Why do we have to do the mixing before we start deleting stuff for the other player? Like does deleting Down first change what Column wants to do?"*

  **Yes, it changes what Column wants to do.**
  Game theory assumes rationality. If Down is strictly dominated (even by a mix), a rational Row player will **never** play it. Column knows Row is rational. Therefore, Column should ignore the row labeled "Down" when making their own decision.

  If you didn't delete Down first, Column might think, "If Row plays Down, my best move is X." But Row *won't* play Down. So Column's calculation based on Down is based on a false premise. By deleting Down (because it's dominated by a mix), you simplify the game for Column, which might cause Column to eliminate their own strategies, which might loop back to Row.

  **Note on Order:** For *strict* dominance, the final set of surviving strategies is actually independent of the order you delete things (Row first vs. Column first). However, you **must** allow for mixed strategies when checking for dominance. If you only check pure vs. pure, you fail to delete Down, and the whole iteration process starts from a wrong foundation.

  ### Summary
  The "weirdness" comes from thinking of a mix as "guessing randomly." Instead, think of it as "committing to a randomized plan that guarantees a higher average score." Down is safely mediocre; the mix is safely good. Safe good beats safe mediocre.

