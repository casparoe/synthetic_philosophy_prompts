answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Committee for Institutional Safety and Legitimate Coercion
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Structure and Authority of Campus Public Safety

  **Executive Summary**

  The Committee for Institutional Safety and Legitimate Coercion has completed its review of the university's policing apparatus. After evaluating the normative implications of coercive authority within a non-sovereign educational institution, the Committee recommends a **Phased Restructuring** of the Department of Campus Public Safety. This course of action transitions the university away from direct possession of armed coercive powers toward a hybrid model centered on unarmed crisis response, with sworn law enforcement authority outsourced to municipal partners under strict contractual limitation.

  This recommendation is grounded in an analysis of institutional legitimacy. It seeks to resolve a structural contradiction we term the "jurisdictional fink," wherein the university exercises state-like powers without state-like accountability. While we acknowledge the legitimate concern that dissolving centralized coercive capacity may create a security vacuum, the proposed restructuring mitigates this risk by decoupling *care* from *coercion* rather than eliminating security infrastructure. The following memo details the conceptual framework, addresses the strongest counter-arguments regarding safety and equity, and provides an actionable implementation timeline.

  **Conceptual Framework: The Jurisdictional Fink**

  The core challenge facing the administration is not merely operational but conceptual. A university is a private or public corporation, not a sovereign state. However, the current Campus Police Department possesses formal powers of arrest, detention, and armed intervention that are functionally indistinguishable from municipal law enforcement. This creates a condition of illegitimate overreach.

  We define this structural anomaly as a **jurisdictional fink**. In this context, a "fink" describes a disposition that appears present but vanishes when its triggering conditions are scrutinized. The campus police hold the *disposition* of coercive authority (the ability to use force), yet the *legitimating conditions* required to justify that authority (democratic sovereignty, public mandate, constitutional accountability) are systematically suppressed or absent. The university is not a polity; it cannot claim the Weberian monopoly on legitimate violence that justifies such power in the civil sphere.

  Furthermore, the norms of academic governance structurally mask this coercion. By framing safety interventions as matters of "community well-being" or "student conduct," the administration obscures the violent potential of armed detention. The authority is present in practice—officers carry weapons and make arrests—but its justification is hidden behind the language of education and care. This creates a fiduciary and ethical risk: the university claims a power it cannot philosophically or politically justify, exposing the institution to liability and eroding trust among the governed (students, faculty, and staff).

  **Evaluation of the Security-Vacuum Objection**

  The Committee has treated seriously the strongest argument against restructuring: the Weberian claim that the university inherits a necessity for a monopoly on violence to prevent a security vacuum. Proponents of retention argue that without a centralized, armed coercive capacity, the campus would suffer a fragmentation of security responsibility. This fragmentation could undermine equity, as wealthy departments might hire private security while others remain vulnerable, and it could degrade rapid crisis response during active threats.

  This objection rests on the premise that safety requires a unified command of force. We concede that *safety* is a prerequisite for academic freedom; an unsafe campus is an unfree campus. However, the objection conflates *safety* with *university-controlled coercion*.

  The risk of a security vacuum is real if coercive capacity is simply removed without replacement. However, retaining the current model preserves the jurisdictional fink, leaving the university liable for the use of force without the sovereign immunity or democratic mandate of a state. The equitable distribution of safety can be maintained not by arming university employees, but by centralizing the funding and coordination of external sovereign agents (municipal police) who possess the actual legitimacy to use force. The vacuum is not created by removing university police; it is created by removing *coordination*. Our recommendation preserves coordination while correcting the legitimacy deficit.

  **Recommendation: Phased Restructuring**

  The Committee recommends **Phased Restructuring**. This option avoids the abrupt risks of complete abolition while rejecting the status quo of unlegitimated retention. It moves the university toward a model where coercive force is recognized as an external sovereign function, while internal safety is managed through unarmed, specialized crisis response.

  This approach resolves the jurisdictional fink by admitting the university cannot legitimately hold the monopoly on violence. Instead, the university will host a monopoly on *care*, contracting the monopoly on *violence* to the actual sovereign (the city/state) under rigorous constraints.

  **Implementation Timeline**

  The transition shall occur over twenty-four months, divided into three distinct phases to ensure stability and allow for iterative assessment.

  *   **Phase I: Audit and De-escalation (Months 1–6)**
      *   **Objective:** Establish baseline metrics and reduce immediate reliance on armed intervention.
      *   **Actions:**
          *   Conduct a comprehensive audit of all use-of-force incidents and arrests from the past five years.
          *   Implement an immediate moratorium on armed patrols in academic buildings and residence halls; armed personnel shall remain stationed at perimeter checkpoints only.
          *   Launch a six-month pilot program for an unarmed Crisis Response Unit (CRU) staffed by mental health professionals and conflict mediators to handle all non-violent calls.
      *   **Milestone:** At Month 6, the Committee shall review CRU efficacy data. If response times exceed ten minutes for priority calls, the timeline may be extended by three months.

  *   **Phase II: Transition and Decoupling (Months 7–18)**
      *   **Objective:** Transfer sworn authority to municipal partners and retrain existing staff.
      *   **Actions:**
          *   Formalize a Memorandum of Understanding (MOU) with the municipal police department. Sworn arrests and armed interventions become the exclusive jurisdiction of municipal officers, who will be assigned to a dedicated campus beat funded by the university.
          *   Offer existing campus police officers the opportunity to retrain for the unarmed CRU or assist in liaison roles. Those retaining sworn status must transfer employment to the municipal agency.
          *   Establish a centralized dispatch protocol to ensure equitable response across all campus zones, preventing the fragmentation of security.
      *   **Milestone:** By Month 18, all university employees must be unarmed. All coercive authority resides with municipal partners.

  *   **Phase III: Institutionalization of Oversight (Months 19–24)**
      *   **Objective:** Embed democratic accountability into the new safety structure.
      *   **Actions:**
          *   Convene a permanent Safety Oversight Board comprising elected representatives from the student body, faculty senate, and staff assembly.
          *   Implement quarterly oversight audits of the municipal MOU compliance, specifically reviewing demographic data of stops and interventions to ensure equity.
          *   Publish an annual "Legitimacy and Safety Report" for the Board of Trustees.
      *   **Milestone:** Full operational handover completed by Month 24.

  **Oversight and Accountability Mechanisms**

  To prevent the re-emergence of the jurisdictional fink under the new model, strict democratic-oversight conditions are required. The Safety Oversight Board shall have subpoena power regarding safety contracts and the authority to recommend the termination of the municipal MOU if equity standards are not met. This ensures that while the university does not wield the sword, it retains the shield of accountability.

  This structure addresses the equity concern: safety funding remains centralized through the university budget, ensuring that no college or department can purchase superior protection at the expense of others. It addresses the response concern: the MOU mandates response time guarantees that, if breached, trigger financial penalties.

  **Conclusion and Motion for Vote**

  The university stands at a juncture where its operational practices must align with its ethical commitments. Maintaining the current policing structure requires the administration to claim a legitimacy it does not possess. Complete abolition without transition risks the safety required for academic inquiry. Phased Restructuring offers a path that honors the philosophical necessity of legitimate authority while pragmatically securing the physical campus.

  The Committee moves that the Board of Trustees approve the **Phased Restructuring Plan** as outlined above, authorizing the administration to allocate the necessary budget for the twenty-four-month transition and to begin drafting the Memorandum of Understanding with municipal partners within thirty days.

  **Action Required:**
  [ ] Approve Phased Restructuring Plan
  [ ] Reject and Maintain Current Structure
  [ ] Table for Further Review

  **Committee Chair Signature:** ______________________
  **Date:** ______________________
