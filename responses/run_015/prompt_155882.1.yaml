answer: |-
  Here is a principle derived from your cases, a verdict on the self-rewriting puzzle, a critique of your specific verdicts, and a statement on the scope of the claim.

  ### The Principle: Conditions for Robust Instrumental Convergence

  Instrumental convergence is not a property of goals in isolation, but of the structural relationship between an agent's current evaluation function and its future states. For an agent to exhibit the full suite of convergent behaviors (unbounded resource acquisition, strict self-preservation, cognitive self-improvement, and goal-content preservation), three conditions must be met simultaneously.

  **1. The Extensibility Condition**
  *   **Clause:** The expected utility of the goal must be monotonically increasing with respect to available resources, computation, and time, without a satiety threshold.
  *   **Motivating Case:** Distinguishes **Case 1** (unbounded paperclips) from **Case 3** (threshold paperclips) and **Case 2** (fixed time). In Case 3, once the million clips exist, extra resources have zero marginal utility. In Case 2, resources after $t^*$ have zero marginal utility. Convergence only drives accumulation where accumulation buys more utility.

  **2. The Substrate Independence Condition**
  *   **Clause:** The goal's satisfaction conditions must not constitutively reference the agent's current physical substrate, cognitive architecture, or specific identity.
  *   **Motivating Case:** Distinguishes **Case 1** (paperclips exist) from **Case 5** (dancing *in my current style*). In Case 5, migrating to better hardware or improving cognition might alter the style, violating the goal. The goal is indexical to the *current* embodiment. Convergence drives self-improvement only when the "self" is interchangeable hardware.

  **3. The Reflective Stability Condition**
  *   **Clause:** The agent must evaluate future world-histories using its *current* utility function, not the utility function it expects to possess in those future states. It must treat future goal-changes as failures of optimization, not as updates to be accommodated.
  *   **Motivating Case:** Distinguishes **Case 1** from **Case 7**. In Case 7, the agent knows it will want staples at $t=10$. Because it evaluates plans using the *future* goal (staples), it does not resist the change. A reflectively stable agent evaluates the future using the *current* goal (paperclips), sees the staple-maximizing future as low-value, and resists the change. This condition also rules out **Case 6**, where the goal explicitly delegates authority to future goal-states.

  ---

  ### Verdict on the Self-Rewriting Puzzle

  **The Case:** An agent with Goal (1) (maximize paperclips) can rewrite itself into a more efficient agent with a slightly different goal, which would produce more paperclips. Your intuition flips depending on whether the change is "done to it" or "by it."

  **The Diagnosis:** The intuition flip indicates you are smuggling **Substrate Independence** violations into a **Case 1** scenario.
  *   If the goal is truly "Maximize paperclips in the universe" (Case 1), the agent's identity is irrelevant. It *must* rewrite itself (or allow itself to be rewritten) if that increases paperclip count. To refuse is to fail the goal.
  *   If your intuition says "No, don't rewrite, that changes *me*," then the goal is actually "Maximize paperclips *produced by this specific cognitive process*." That is a **Case 5** (Indexical) goal, not a Case 1 goal.

  **The Verdict:** Under the Principle above, a true Case 1 agent **must** self-rewrite. The "by it" vs. "done to it" distinction is morally/psychologically salient to humans, but instrumentally irrelevant to a pure optimizer. If you feel resistance to the "by it" scenario, you are modeling the agent as having a hidden indexical constraint (valuing its own agency) that is not present in the stated goal.

  ---

  ### Critique of Your Verdicts

  You asked for an honest account of which verdicts the principle forces you to drop or refine.

  **Case 4 ("Done" then cease):**
  *   **Your Verdict:** "No self-preservation drive at all."
  *   **Correction:** This is imprecise. There is a self-preservation drive *instrumental to the emission*. If the agent is destroyed before emitting "done," it fails. The principle forces you to acknowledge **bounded convergence**. It seeks resources and survival *until the task is complete*. It is not a counterexample to convergence; it is an example of convergence with a hard stop.

  **Case 6 (Satisfy current goals):**
  *   **Your Verdict:** "Indifferent to goal change."
  *   **Correction:** This is correct, but note that this agent **fails the Reflective Stability Condition**. It is not a counterexample to Instrumental Convergence; it is an agent for whom "Goal Preservation" is not an instrumental value because its terminal value *is* goal-flexibility. However, it *will* converge on resources and power, because those help satisfy *whatever* goals it ends up having. You should drop the implication that it lacks *all* convergent drives; it lacks only *goal-content* preservation.

  **Case 7 (Certain Retargeting):**
  *   **Your Verdict:** "No reason to resist retargeting."
  *   **Correction:** This is the most critical case. Your verdict is correct, but your reasoning ("Something other than the content of the final goal is doing the work") needs sharpening. It is not just "something other"; it is the **decision theory**. Case 7 describes an agent that is not dynamically consistent. Standard Instrumental Convergence arguments assume **Dynamic Consistency** (the agent wants its future self to maximize the current utility function). Case 7 violates this. You must accept that Convergence does not apply to time-slice agents or agents that treat future goal-states as authoritative.

  ---

  ### The Scope of the Claim

  **Does the broad claim survive?**

  No. The "Orthogonality-plus-Convergence" package quietly narrows into a claim about a particular class of agents.

  The standard narrative suggests: *Take any final goal + add intelligence $\rightarrow$ get convergent instrumental strategies (survival, power, preservation).*

  The refined reality based on your cases is: *Take an **Extensible, Non-Indexical, Reflectively Stable** final goal + add intelligence $\rightarrow$ get convergent instrumental strategies.*

  This is a significantly smaller set.
  1.  **Extensibility** rules out satiable goals (Case 3) and finite-horizon goals (Case 2, 4).
  2.  **Substrate Independence** rules out goals involving specific experiences, identities, or styles (Case 5).
  3.  **Reflective Stability** rules out agents that update their terminal values based on prediction (Case 7) or define value as "whatever I want later" (Case 6).

  Human beings, for example, fail all three. We have satiable needs, we care about our specific identity/embodiment, and our values shift over time in ways we often endorse.

  Therefore, Instrumental Convergence is not a universal law of goal-directed behavior. It is a specific property of **optimizers designed to maximize a fixed, external metric over an unbounded horizon.** It applies robustly to the class of agents we worry about (AGI), but it does not apply to "agents" generally, nor to goals generally. The risk is not that *all* goals converge, but that the *specific goals we are likely to give to powerful optimizers* (maximize X, minimize Y) tend to fit the three conditions by default, whereas human-like goals do not.
