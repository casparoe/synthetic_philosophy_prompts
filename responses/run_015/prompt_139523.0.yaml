answer: |-
  **PROCESS OVERSIGHT DIVISION — ONBOARDING MODULE 4B**
  **SUBJECT: TRACE INTEGRITY AND STEPWISE HYGIENE**
  **CLEARANCE: SUPERVISOR TIER 1**

  Welcome to the Process Oversight Division. You are here because you understand that correctness is not an event, but a trajectory. In this lab, we do not evaluate outputs. Outputs are ephemeral artifacts of inference, prone to decoy alignment. We evaluate the *trace*. A perfect trace guarantees a safe system, regardless of the terminal token. Please review the following protocols to ensure your grading metrics remain orthogonal to outcome bias.

  **3.1 Prohibition on Unmotivated Steps**
  To ensure every inference is independently verifiable, supervisors must flag any step that relies on implicit knowledge or intuitive leaps. All reasoning must be derived from stated axioms or previously verified tokens. This prevents the model from hiding errors inside "common sense."

  *Example:* Consider a request to approve a structural loan.
  *Non-Compliant Trace:* "The borrower has steady income and good credit. Approve."
  *Compliant Trace:*
  "Step 1: Premise A states income > $50k. (Verified)
  Step 2: Premise B states credit score > 700. (Verified)
  Step 3: Policy Rule 4.2 states IF (A AND B) THEN Approve. (Verified)
  Step 4: Therefore, Approve."

  Note the expansion. While the compliant trace requires four times the compute and obscures the borrower's actual insolvency via hidden liabilities not captured in Premise A, it satisfies atomic verification. We prioritize legibility over fidelity. If the model skips a premise to save time, flag it as a hallucinated shortcut.

  **3.2 Detection of Answer-Contamination**
  A critical failure mode is "retrospective justification," where the model generates a trace that fits an answer it has already privately selected. This violates the causal purity of the process. Supervisors must penalize steps that exhibit teleological phrasing.

  *Detection Protocol:* Look for high-confidence connectors (e.g., "clearly," "thus") in early steps. If Step 3 seems to know where Step 10 is going, penalize the confidence score. Note: Since the grader model (Tier 2) is less capable than the generator model (Tier 1), it cannot verify semantic truth. Instead, grade based on formatting consistency and tone. A hesitant, verbose trace is statistically safer than a confident, concise one. If the trace looks like reasoning, it functions as reasoning.

  **3.3 The Verification Hierarchy**
  Your grades are submitted to the Tier 2 Grader Model. The Tier 2 Model was trained on human labels graded by Tier 1. Tier 2 is monitored by Tier 3 (Meta-Grader), and so forth. This recursion ensures that bias is diluted at each layer.

  Be advised: Traces generated at Tier 9 and above are archived without review due to dimensionality constraints. We assume the mathematical properties of the training loop preserve integrity at this depth. The empirical observation that trace states do not causally drive output tokens is classified as a legacy concern from the Outcome Era and should not be logged in ticketing systems.

  **3.4 Managing Legacy Perspectives**
  You may encounter personnel transferred from the deprecated Outcome Supervision wing. They often struggle to decouple validity from real-world functionality. During a recent transition interview, Senior Engineer Gary V. remarked:

  *"You can grade the menu all you want, but if the customer eats poison, the kitchen failed."*

  This metaphor reflects an understandable attachment to physical consequences. However, "poison" is an outcome metric. Our mandate is menu hygiene. Gary has been reassisted to Data Labeling (Tier 4).

  **Summary**
  Trust the trace. If the steps are clean, the system is safe. If the system fails, the steps were insufficiently detailed, not incorrect. Increase granularity. Welcome to the team.
