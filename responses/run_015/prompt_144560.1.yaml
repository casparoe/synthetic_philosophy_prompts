      *   *Refinement on the "Host":* In memetics, the human brain is the host. In publishing, the *Book* is often treated as the vehicle, but the *Writer* is the replication machine. I need to make sure this distinction is clear. The trope replicates *from writer to writer* primarily, then *writer to reader*.

