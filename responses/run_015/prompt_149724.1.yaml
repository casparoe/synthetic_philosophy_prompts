  1.  **Pharmaceutical Testing Loop:** Humans cannot be coerced for testing even to save millions; animals can be coerced if net pain is minimized relative to cure. Absurdity: Infinite animal sacrifice for marginal human gain vs. zero human coercion for massive animal gain.
  2.  **Urban Infrastructure Conflict:** Human property rights are absolute; animal habitats are calculable costs. Absurdity: Evicting a million bees for a human's shed expansion is mandatory; evicting one human for a million bees is forbidden.
  3.  **Marginal Agency Boundary (Selected):** The Tier-3 Protocol. Entities on the threshold (enhanced crows, chimeras). Absurdity: A single percentile point on a neuro-test determines if an entity is a "resource" or a "rights-bearer." This exposes the binary cliff-edge of Nozick's view when applied to a spectrum of cognition.

  ***

  **OFFICE OF DUAL-FRAMEWORK INTERSPECIES GOVERNANCE (ODFIG)**
  **PUBLIC FREQUENTLY ASKED QUESTIONS: COMPLIANCE SERIES 9**

  **1. What is the primary regulatory mandate of the ODFIG?**
  The Office operates under the Dual-Framework Statute, which mandates distinct ethical processing for biological entities based on taxonomic classification and neuro-cognitive thresholding. Human persons are subject to Side-Constraint Protections, meaning they possess inviolable rights that cannot be overridden for collective benefit. Non-human animals are subject to Aggregate Welfare Management, meaning their individual interests may be traded or sacrificed provided the net reduction in suffering across the population is statistically significant. Personnel must never apply Aggregate Welfare calculations to humans, nor apply Side-Constraint Protections to animals, unless a Tier-3 reclassification is active.

  **2. How does the Office determine when a human person's rights may be overridden for public safety?**
  Under no circumstances may a human person's rights be overridden for public safety. For example, if detaining one innocent human person would prevent a catastrophic event causing widespread harm to millions, ODFIG compliance officers are instructed to prohibit the detention. The Side-Constraint Protection treats individuals as ends in themselves, not as resources for social utility. Conversely, if containing a viral outbreak requires the euthanasia of four million livestock units to protect human health, this is classified as a permissible Aggregate Welfare adjustment. Forms 104-H (Human Inviolability) and 104-A (Animal Utility) must be filed separately to prevent cross-contamination of ethical frameworks.

  **3. What is the Tier-3 Marginal Agency Assessment Protocol?**
  The Tier-3 Protocol is a classified neuro-behavioral diagnostic suite used to evaluate entities residing near the cognitive boundary between species. This includes urban corvids fitted with experimentally enhanced working-memory implants, or chimeric organisms containing partial human neural tissue. Standard animals are managed via Aggregate Welfare. However, if an entity scores above 88.5 on the Recursive Self-Awareness Index, it triggers a Side-Constraint review. Personnel should note that an entity scoring 88.4 remains eligible for utility maximization procedures, including experimental harvesting, while an entity scoring 88.6 immediately acquires full inviolable status. There is no appeals process for scores falling between 88.0 and 89.0 due to the binary nature of the statutory framework.

  **4. How should field agents handle conflicts between protected humans and Tier-3 assessed animals?**
  Conflict resolution prioritizes the Human Side-Constraint. If a Tier-3 assessed entity (e.g., a neural-chimeric canine) poses a threat to a human person, the human's right to safety is absolute, regardless of the animal's cognitive score. However, if the conflict involves a Tier-3 animal and a non-assessed animal, agents must calculate the Aggregate Welfare outcome. For instance, if a enhanced corvid with partial rights status is consuming the nesting grounds of a non-enhanced flock, the officer must calculate whether the corvid's caloric survival outweighs the reproductive loss of the flock. If the corvid fails the utility calculation, it may be relocated or euthanized, provided its enhanced neural tissue is disposed of according to biohazard regulations regarding human-derived matter.

  **5. Can human volunteers consent to be treated under Aggregate Welfare Management?**
  No. Consent does not waive Side-Constraint Protections. A human cannot legally volunteer to be harmed for the greater good, as this treats the person as a means to an end rather than an end in themselves. ODFIG will reject any waiver signed by a human wishing to participate in high-mortality medical testing, even if the testing would cure a disease affecting thousands of animals. Conversely, animals cannot consent to anything; their participation is authorized solely by the ODFIG Utility Calculator. Please ensure that consent forms for human participants explicitly state that their safety cannot be compromised, while intake forms for animal subjects explicitly state that their individual survival is not guaranteed.

  **6. What is the procedure for a borderline entity that fluctuates around the Tier-3 threshold?**
  Entities exhibiting fluctuating neuro-behavioral metrics due to implant degradation or tissue rejection present a compliance challenge. During periods where the entity scores below the threshold, it is legally classified as a resource. During periods where it scores above the threshold, it is legally classified as a person. ODFIG recommends scheduling utility-maximizing procedures (such as tissue sampling) during documented low-score windows. Personnel must cease all invasive procedures immediately if real-time monitoring indicates a score shift above 88.5. Failure to pause procedures during a high-score window constitutes a civil rights violation, even if the procedure began during a low-score window. Continuous monitoring equipment is mandatory for all chimeric holding units.
