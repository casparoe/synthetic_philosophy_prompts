      *Section 1: What the theory is for*
      The theory must serve as a decision procedure for a collective agent with internal value disagreement. It determines whether to execute action-swaps with external parties who hold divergent moral views. The goal is to increase expected value for the group's constituents without requiring consensus on fundamental values or converting distinct value systems into a single metric. It must resolve authority, risk, and integrity constraints.

      *Section 2: Requirements*
      1. **Harmful Counterparties:** Must specify conditions under which enabling a rival's harmful aim is permissible if the reciprocal benefit outweighs it in the group's terms.
      2. **Non-Reciprocating Entities:** Must justify binding commitments to entities (future generations, animals) that cannot enforce compliance or offer reciprocal trade.
      3. **Confidentiality:** Must resolve the principal-agent tension: can leaders execute trades members would veto, provided the trade advances the members' own stated aims?
      4. **Moral Uncertainty:** Must weigh trades where the primary moral view supports the swap but a high-credence alternative view forbids it.
      5. **Strategic Vulnerability:** Must account for risks where performing first empowers the counterparty to exploit the group later.
      6. **Source of Gains:** Must clarify that gains arise from divergent *moral* valuations of outcomes, not empirical beliefs; shared facts do not preclude trade if value orderings differ.
      7. **Distinction:** Must not collapse *trade* (instrumental swap) into *compromise* (adopting shared goals).

      *Section 3: Genuine desiderata versus camp prejudices*
      The ban on acting against one's best moral judgement is a camp prejudice, not a genuine desideratum. Under moral uncertainty, maximizing expected choice-worthiness often requires acting against the most probable view if the stakes of the minority view are sufficiently high. A functional theory must allow trades justified by credence-weighted value, even if the modal view opposes them. Integrity constraints are valid, but rigid adherence to the modal view ignores the logic of uncertainty.

      *Section 4: Conflicts*
      The **Confidentiality** requirement conflicts with **Harmful Counterparties**. If members would veto a trade enabling harm (even for net benefit), maintaining confidentiality violates democratic accountability. However, enforcing member veto power may block Pareto-improvements. Additionally, **Non-Reciprocating Entities** conflicts with **Strategic Vulnerability**. Committing to future people requires unenforceable promises, yet the theory must guard against exploitation. A theory demanding enforceable reciprocity excludes trades with the voiceless; one allowing unenforceable promises risks defection. These tensions suggest no theory satisfies all constraints simultaneously without sacrificing either effectiveness or integrity.

      *Section 5: The requirement that does the most work*
      The **Harmful Counterparties** requirement does the most work in excluding candidate theories. Most frameworks rely on a notion of "mutual benefit" that assumes neutral or positive externalities. A theory permitting resource transfers to actors pursuing aims the group deems *positively harmful* must overcome strong deontological or constraint-based objections. Utilitarian calculations might pass this, but rights-based or virtue-ethical approaches will fail here. This requirement forces the theory to take a stance on complicity that most abstract models of trade evade.

      *Section 6: Scorecard*
      **Own Terms (Bostrom):** Passes Harmful Aims (if net gain), fails Non-Reciprocating (requires rational agency). **Common Currency (MacAskill):** Fails Non-Reciprocating (requires shared metric), passes Uncertainty. **Compromise/Portfolio:** Fails Distinction (collapses trade into consensus), passes Confidentiality. None survive fully. Own Terms best handles divergent values but risks complicity. Common Currency handles uncertainty but assumes commensurability. Compromise preserves integrity but negates the definition of trade. All struggle with unenforceable promises.

      *Section 7: What would change my mind*
      I would drop the **Confidentiality** requirement first. If leaders cannot trust members to accept value-maximizing trades, the group structure is flawed, not the theory. I would reorder the list if presented with a case where confidentiality leads to systemic corruption outweighing trade gains. My reasoning is most likely to fail on the **Source of Gains** constraint; I may be underestimating how shared empirical beliefs constrain moral divergence, potentially making trade rarer than assumed.

