  What the theory is for
  The theory must act as a decision procedure for a collective agent with internal value disagreement. It determines whether to execute action-swaps with external parties holding divergent moral views. The goal is increasing expected value for constituents without requiring consensus on fundamental values or converting distinct systems into a single metric. It must resolve authority, risk, and integrity constraints specifically for campaigning or grantmaking bodies facing strategic interaction.

  Requirements
  First, **Harmful Aims**: It must address complicity when handing over resources makes the world worse in our eyes. Motivating case: A counterparty whose aims we take to be not merely worthless but positively harmful. Second, **Non-Reciprocating Entities**: It must define obligation without leverage. Motivating case: A counterparty that cannot reciprocate or hold us to the deal, such as future people, non-human animals, or a system that has not been built yet. Third, **Confidentiality**: It must reconcile leadership discretion with member veto. Motivating case: A trade that would have to be kept confidential from our own members, who would reject it, even though it is meant to advance their aims. Fourth, **Moral Uncertainty**: It must aggregate credences across actions. Motivating case: A trade proposed on the strength of a moral view we hold with only moderate credence, where our second-favourite view would rank it quite differently. Fifth, **Strategic Vulnerability**: It must assess long-term power dynamics. Motivating case: A trade in which we must perform first, with no way to enforce the other side's part, and where their gains would also leave them a stronger bargainer against us later. Sixth, **Source of Gains**: It must locate value divergence. Motivating case: Your worry that shared non-moral beliefs preclude gains; the theory must show gains come from divergent moral valuations of outcomes, not empirical disagreement. Seventh, **Distinction**: It must preserve agency identity. It cannot solve disagreement by merging values. Motivating case: The definition of moral trade requires parties retain distinct rankings rather than converting values into a shared unit or endorsing the other's ranking. This ensures the trade remains instrumental rather than ideological.

  Genuine desiderata versus camp prejudices
  The ban on acting against one's best moral judgement is a camp prejudice, not a genuine desideratum. Under moral uncertainty, maximizing expected choice-worthiness often requires acting against the most probable view if the stakes of the minority view are sufficiently high. A functional theory must allow trades justified by credence-weighted value, even if the modal view opposes them. Integrity constraints are valid, but rigid adherence to the modal view ignores the logic of uncertainty.

  Conflicts
  The **Confidentiality** requirement conflicts with **Harmful Counterparties**. If members would veto a trade enabling harm (even for net benefit), maintaining confidentiality violates democratic accountability. However, enforcing member veto power may block Pareto-improvements. Additionally, **Non-Reciprocating Entities** conflicts with **Strategic Vulnerability**. Committing to future people requires unenforceable promises, yet the theory must guard against exploitation. A theory demanding enforceable reciprocity excludes trades with the voiceless; one allowing unenforceable promises risks defection. These tensions suggest no theory satisfies all constraints simultaneously without sacrificing either effectiveness or integrity. Thus, the group faces a tragic choice between integrity and impact. Resolving this requires ranking requirements hierarchically. Most theories fail here.

  The requirement that does the most work
  The **Harmful Counterparties** requirement does the most work in excluding candidate theories. Most frameworks rely on a notion of "mutual benefit" that assumes neutral or positive externalities. A theory permitting resource transfers to actors pursuing aims the group deems *positively harmful* must overcome strong deontological or constraint-based objections. Utilitarian calculations might pass this, but rights-based or virtue-ethical approaches will fail here. This requirement forces the theory to take a stance on complicity that most abstract models of trade evade.

  Scorecard
  **Own Terms (Bostrom):** Passes Harmful Aims (if net gain), fails Non-Reciprocating (requires rational agency). **Common Currency (MacAskill):** Fails Non-Reciprocating (requires shared metric), passes Uncertainty. **Compromise/Portfolio:** Fails Distinction (collapses trade into consensus), passes Confidentiality. None survive fully. Own Terms best handles divergent values but risks complicity. Common Currency handles uncertainty but assumes commensurability. Compromise preserves integrity but negates the definition of trade. All struggle with unenforceable promises. Consequently, practitioners must select frameworks based on which constraint they prioritize most heavily in practice.

  What would change my mind
  I would drop the **Confidentiality** requirement first. If leaders cannot trust members to accept value-maximizing trades, the group structure is flawed, not the theory. I would reorder the list if presented with a case where confidentiality leads to systemic corruption outweighing trade gains. My reasoning is most likely to fail on the **Source of Gains** constraint; I may be underestimating how shared empirical beliefs constrain moral divergence, potentially making trade rarer than assumed. Furthermore, if internal disagreement is resolved through deliberation rather than trade, the theory becomes obsolete for cohesive groups.
