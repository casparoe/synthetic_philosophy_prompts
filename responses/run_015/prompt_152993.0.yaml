  3.  **Evaluate Tensions:**

      *   **Tension 1: (1)+(2) vs. (3) [The Mate's First Claim]**
          *   *Conflict:* If social sanction is punishment (1) requiring proportionality/process (2), but platforms have absolute right to drop anyone for any reason without process (3), then (2) cannot be enforced or expected. If platforms are free to be arbitrary, proportionality is voluntary. If it's voluntary, calling it "punishment requiring rules" is normatively strong but practically empty.
