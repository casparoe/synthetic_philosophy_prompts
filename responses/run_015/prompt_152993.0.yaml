      **2. The Expressive Contradiction (4 vs 2) — Minor**
      Your mate is wrong. Expressive punishment (censure) still requires proportionality. If the censure exceeds the wrong, it stops being "marking a line" and becomes "erasure." You can hold both: the goal is expression, but the *limit* is proportionality.
      *Fix:* Keep both. Clarify that disproportionate censure distorts the message.
