      *   **The Scale Mismatch:** Explain this as "Scope Neglect" vs. "Institutional Division of Labor." The policy level triggers "systemic responsibility," the individual level triggers "habit."
      *   **The Replacement Argument:** This is the nuclear option. It shifts the debate from "Right to Life" to "Net Suffering Budget." This is likely the key to unlocking the stalemate.
      *   **Synthesis/Diagnosis:** It's a "Category Error" stalemate. They are using biological evidence to solve a decision-theoretic and population-ethical problem.
      *   **Path Forward:** What counts as progress?
