      *   **Task:** Act as a professional moral philosopher + decision theory expert. Diagnose the stalemate. Don't just survey evidence or list positions. Stress-test the user's hypothesis (the "coupling question"). Address the three specific "wrinkles" (decision theory vs. biology, scale mismatch, population replacement).
      *   **Tone:** Professional, thoughtful, diagnostic, honest (willing to say "this is ill-posed").
