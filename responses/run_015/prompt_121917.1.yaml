      *   *Point 5: Death isn't a big deal/Pattern survival.* -> **Misleading/Emotional Nuance Missing.** In *IASL*, Hofstadter is devastated by death. He finds comfort in the idea that his wife's pattern lives on in *him* (and others), not in a technological backup. He is skeptical that a *copy* is the *same* self (the "teletransportation paradox" vibe). He distinguishes between pattern survival and *first-person* continuity.

