      *   *Substrate Independence:* Hofstadter is a soft functionalist. He believes the *pattern* matters more than the *stuff*. He explicitly discusses copying selves (e.g., in *GEB* with the Tortoise and Achilles, or the "Who Shoves Whom Around" chapter). He is open to the idea that a self could exist on a different substrate *if* the pattern is preserved at the right level of abstraction.
      *   *Degree of Selfhood:* Hofstadter doesn't see selfhood as binary (on/off). It's a matter of degree. A fly has a tiny bit; a human has a lot.
      *   *Split-Brain:* He does discuss split-brain cases. He generally agrees that the unity of consciousness is fragile and dependent on integration.
      *   *Death/Immortality:* In *I Am a Strange Loop*, he is deeply emotional about his wife's death. He argues for a kind of "soul survival" through the patterns left in others' brains (memories, influence), *not* necessarily technological uploading, though he doesn't rule out the theoretical possibility of pattern transfer. However, he is skeptical about the *continuity* of consciousness in a copy.
      *   *Merging/BCI:* This is the tricky part. Does he think two brains linked become *one* self? He discusses "shunting" and shared symbols. He acknowledges the *potential* for shared consciousness but emphasizes the bandwidth and depth required. It's not just "feedback"; it's about sharing the *symbol system*.

