      *   *Wait, the core insight is Riemann Rearrangement.* To show that, we need to show that summing $(1-1) + (1-1)$ gives 0, but $1 + (-1+1) + ...$ gives 1.
      *   *Activity:* Agents hold "Outcome Cards." Auditors hold "Calculation Rules."
      *   *Let's simplify:* 3 Teams. Team Positive (groups pairs as $(1-1)$), Team Negative (groups as $1 + (-1+1)$), Team Skeptic (refuses to sum).
      *   *Stakes:* Teams bet on whether the "Game" is Favorable, Unfavorable, or Indeterminate.

  4.  **Drafting the Rules:**
      *   **Roles:** 5 Traders (decide to buy/sell), 5 Accountants (Grouping Method A), 5 Accountants (Grouping Method B).
      *   **The Asset:** A "Pasadena Bond."
      *   **The Mechanism:** We simulate 4 rounds of the game quickly to show volatility. Then we ask for valuation.
      *   **The Twist:** The Accountants must value the *theoretical* bond using their assigned summation rule on the *expected value series* (1 - 1 + 1 - 1...), not the realized outcomes.
      *   **Why?** Because the paradox is about *expectation*, not realized utility (though they relate).
      *   **Refinement:** To make it experiential, the Traders need to see the Accountants disagree.
      *   **Step 1:** Explain the Bond.
      *   **Step 2:** Accountants calculate EV using their rule.
      *   **Step 3:** Traders decide whether to "Buy" the bond at a price of 0.
      *   **Step 4:** Reveal the disagreement.

  5.  **Addressing the "Settled vs. Contested" Constraint:**
      *   *Settled:* The series $\sum (-1)^{n-1}$ diverges. Standard EV theory requires absolute convergence or a defined sum. Rearrangement changes value.
      *   *Contested:* Does this invalidate EV maximization? Should we use dominance? Is it a reductio of EV or just a boundary case?
      *   *Instruction:* Ensure the debrief distinguishes these. Don't say "EV is dead." Say "EV is incomplete here."

  6.  **Predictable Failures:**
