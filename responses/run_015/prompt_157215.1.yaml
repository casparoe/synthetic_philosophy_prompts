  2.  **Brainstorming Classroom Dynamics & Stakes:**
      *   *Problem:* Grad students are cynical. "Fake money" feels fake. If the payoff is just "points," they won't care.
      *   *Solution:* Make the points matter socially or academically within the context of the workshop.
          *   Idea 1: Extra credit? (No, unethical/unfair).
          *   Idea 2: Chocolate/Coffee? (Logistically messy).
          *   Idea 3: "Decision Capital." The winner gets to choose the topic for the next workshop or gets a "Get Out of Critique Free" card for a draft.
