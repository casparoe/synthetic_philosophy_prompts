      *   *Refinement:* Let's use "Reputation Points" (RP). The top scorer gets a tangible, low-stakes privilege (e.g., picks the break music, chooses the next reading, or just public recognition as the "Rational Agent of the Day").
      *   *Dynamic:* The tension needs to come from the *disagreement* between auditors, not just the payoff. The players need to feel conflicted about whether to play.
      *   *Pasadena Specifics:* The series is $\sum_{n=1}^{\infty} (-1)^{n-1} \frac{2^n}{n} \cdot \frac{1}{2^n} = \sum \frac{(-1)^{n-1}}{n}$. Wait, the prompt describes a specific version: "receive $2^k$ if tails lands on round k, but with alternating signs."
      *   *Correction on Math:* The classic Pasadena Game (Nover & Hájek) uses payoffs $2^k/k$ with probability $1/2^k$. The expectation is $\sum (1/2^k) \cdot (2^k/k) \cdot (-1)^{k-1} = \sum (-1)^{k-1}/k$. This is the alternating harmonic series, which converges conditionally to $\ln(2)$, *but* because it's not absolutely convergent, rearrangement changes the sum.
      *   *Prompt's Description:* "1 - 1 + 1 - 1..." This is Grandi's series. This implies payoffs of $2^k$ with prob $1/2^k$ but signs alternating? If payoff is $2^k$ and prob is $1/2^k$, the term is 1. So the series is $1 - 1 + 1 - 1...$. This diverges by oscillation. This is actually *worse* than the standard Pasadena (which converges conditionally). This is closer to a "Pasadena-style" undefined expectation. I should stick to the prompt's description ($1-1+1-1$) for simplicity in a 20-min game, even if the standard literature uses the harmonic one. It makes the divergence more obvious (oscillation vs. conditional convergence).
      *   *Wait, check the Prompt again:* "expectation series becomes 1 - 1 + 1 - 1... and there is no convergence, not even to infinity." Okay, I will follow the prompt's mathematical setup (Grandi's series style) rather than the strict Nover & Hájek definition, as it's pedagogically sharper for "undefined vs. infinite."
      *   *Stakes:* To make it feel real, I need *time pressure* and *public commitment*.

  3.  **Designing the Activity:**
      *   **Name:** The Oscillating Auditorium.
      *   **Setup:** 15 students. 5 "Agents" (Players), 5 "Auditors A" (Grouping 1), 5 "Auditors B" (Grouping 2).
      *   **The Game:** A coin is tossed (simulated).
      *   **The Payoff:** Round $k$. If Tails on $k$, game ends. Payoff is $(-1)^{k-1} \cdot 2^k$ points? No, to get expectation term = 1, we need Prob $\times$ Payoff = 1. Prob of ending on $k$ is $1/2^k$. So Payoff must be $2^k$. Sign alternates.
      *   **The Conflict:** Auditors calculate EV differently based on how they group the terms.
      *   **Constraint:** We can't play infinite rounds. We need to simulate the *structure* without the infinity.
      *   **Workaround:** We play a finite number of rounds (say, 10), but the *valuation* rules assume the infinite tail. Or, we play multiple "trials" and aggregate.
