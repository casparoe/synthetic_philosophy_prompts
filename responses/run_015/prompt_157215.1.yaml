answer: |-
  ### Part 1: Brainstorming Dynamics & Stakes

  **The Problem:** Philosophy grad students are immune to "fake money." If you give them 1,000 "utility points," they know it dissolves upon leaving the room. If the stakes feel fake, they will treat the decision as a purely abstract puzzle rather than a *choice*, which undermines the goal of making them *feel* the paralysis of undefined expectation.

  **The Solution:** Social Capital & Workflow Control.
  Instead of cash, use **"Workshop Priority."**
  *   **The Stake:** The student (or team) with the highest "Rationality Score" at the end gets to choose the **topic for the next workshop** or gets **first priority on commenting** on a draft in the next session.
  *   **Why this works:** It leverages the actual economy of the graduate cohort (influence, voice, feedback). It creates low-stakes but non-zero friction.
  *   **The Tension:** To win Priority, you need points. To get points, you need to make the "right" decision. But the Auditors will tell you there *is* no right decision. This creates genuine anxiety: *Do I trust the math, the auditor, or my gut?*

  **The Dynamic:**
  *   **Traders:** Must commit. They hate ambiguity. They want a price.
  *   **Auditors:** Hold the power of valuation. They will realize their power creates the paradox.
  *   **The Facilitator:** You must remain neutral. Do not resolve the paradox for them.

  ---

  ### Part 2: The Activity — "The Oscillating Bond"

  **Time:** 20 Minutes
  **Participants:** 15 Students
  **Materials:** Whiteboard, 15 printed "Role Cards," 1 Coin (or random number generator projected).

  #### 1. Roles (Divide into 3 Groups of 5)
  *   **Group A: The Traders (5 students).**
      *   **Goal:** Maximize Workshop Priority Points.
      *   **Task:** You are offered a "Pasadena Bond" for free. You can **Accept** or **Reject**. If you Accept, you inherit the payoff of the game. If you Reject, you get 0 points.
  *   **Group B: Auditors - Method Alpha (5 students).**
      *   **Goal:** Calculate the Fair Value of the Bond.
      *   **Rule:** You must group the expectation terms in pairs from the start: $(Term_1 + Term_2) + (Term_3 + Term_4) + \dots$
  *   **Group C: Auditors - Method Beta (5 students).**
      *   **Goal:** Calculate the Fair Value of the Bond.
      *   **Rule:** You must leave the first term alone, then group the rest: $Term_1 + (Term_2 + Term_3) + (Term_4 + Term_5) + \dots$

  #### 2. The Setup (5 Minutes)
  Explain the **Pasadena Bond** mechanics on the board:
  1.  A fair coin is flipped repeatedly until it lands **Tails**.
  2.  Let $k$ be the round number where Tails first appears.
  3.  **Payoff:** You receive $(-1)^{k-1} \cdot 2^k$ Points.
      *   Round 1 (Tails): $+2$ points.
      *   Round 2 (Tails): $-4$ points.
      *   Round 3 (Tails): $+8$ points.
      *   Round 4 (Tails): $-16$ points.
  4.  **Probability:** The chance the game ends on round $k$ is $1/2^k$.

  **The Calculation Task:**
  Ask the Auditors to compute the **Expected Value (EV)** contribution for each round $k$.
  *   $EV_k = \text{Probability} \times \text{Payoff} = (1/2^k) \times ((-1)^{k-1} \cdot 2^k) = (-1)^{k-1}$.
  *   Write the series on the board: **$1 - 1 + 1 - 1 + 1 - 1 \dots$**

  **Assign the Grouping Rules:**
  *   **Method Alpha:** Calculate $(1 - 1) + (1 - 1) + \dots$
  *   **Method Beta:** Calculate $1 + (-1 + 1) + (-1 + 1) + \dots$

  #### 3. The Run (10 Minutes)
  1.  **Calculation Phase (3 mins):** Auditors confer within their groups to determine the Total Expected Value of the Bond based on their grouping rule.
      *   *Alpha Result:* $0 + 0 + 0 \dots = \mathbf{0}$.
      *   *Beta Result:* $1 + 0 + 0 \dots = \mathbf{1}$.
  2.  **Advice Phase (2 mins):** Auditors send one representative to the Traders.
      *   Alpha says: "The value is 0. It's a fair game. Indifferent."
      *   Beta says: "The value is 1. It's positive. You should Accept."
  3.  **Decision Phase (2 mins):** Traders must vote unanimously to **Accept** or **Reject** the Bond. They know the stakes (Workshop Priority). They hear conflicting expert advice.
  4.  **Simulation Phase (3 mins):** To raise tension, actually flip the coin 4 times rapidly in front of the class.
      *   *Scenario:* If it hits Tails on Round 2, Traders lose 4 points. If Round 1, they gain 2.
      *   Show them the *volatility* is massive, even if the "average" is debated.
      *   *Note:* Stop after 4 flips. Remind them the *real* game is infinite.

  #### 4. The Reveal (5 Minutes)
  *   Ask Traders: "Why was this hard?" (Expected answer: The experts disagreed).
  *   Ask Auditors: "Who is wrong?" (Expected answer: Neither, mathematically).
  *   Collect the votes. Award "Rationality Points" arbitrarily (e.g., everyone gets 1 point for participation, but the *confusion* is the lesson).

  ---

  ### Part 3: The Debrief (60 Minutes)

  **1. Mapping the Activity to the Math (15 mins)**
  *   **The Series:** Confirm on the board that the expectation series is indeed $1 - 1 + 1 - 1 \dots$ (Grandi's Series).
  *   **The Grouping:** Show explicitly how Alpha sums to 0 and Beta sums to 1.
  *   **The Lesson:** In standard arithmetic, $(a+b)+c = a+(b+c)$. In infinite series, **associativity fails** unless the series is *absolutely convergent*.
  *   **Undefined vs. Infinite:** Contrast this with the St. Petersburg Paradox.
      *   *St. Petersburg:* $1 + 1 + 1 + \dots = \infty$. The value is defined (as infinity), but utility functions struggle to handle it.
      *   *Pasadena:* The value does not exist. It is not "huge." It is **mathematically indeterminate**. You cannot maximize what does not exist.

  **2. Settled vs. Contested (25 mins)**
  *Use this section to distinguish mathematical facts from philosophical interpretations.*

  **What is Settled (The Math & Decision Theory Basics):**
  *   **Non-Convergence:** It is a mathematical fact that this series does not converge to a single limit.
  *   **Order Dependence:** It is a fact that rearranging or regrouping terms changes the sum.
  *   **EV Failure:** Standard Expected Value theory (summing probability $\times$ utility) yields no verdict here. It is silent.

  **What is Contested (The Philosophical Implications):**
  *   **Does EV Die?**
      *   *View A:* This is a *reductio* of standard EV maximization. We need a new theory (e.g., Relative Expectation, Dominance principles).
      *   *View B:* EV is fine; this is just a pathological case that never happens in the physical world (finite time/resources).
  *   **Dominance:**
      *   Some argue you should take the game because, for every possible outcome $k$, there is a mapping where you do better? (Actually, in Pasadena, dominance is tricky because payoffs oscillate wildly).
      *   *Discussion Question:* If one game pays $+1$ more than another in every state, should you prefer it? (Weak Dominance). Does Pasadena violate this?
  *   **Truncation:**
      *   Is it rational to just cut off the series at $N=100$?
      *   *Counter:* Why 100? Why not 101? If the value flips sign based on where you cut, is the cut justified?

  **3. Limitations of the Activity (10 mins)**
  *Be honest about what the game couldn't do.*
  *   **The Horizon:** We stopped at 4 flips. The paradox *requires* the infinite tail. In a finite world, the expectation is just a very volatile number, not undefined. The activity simulates the *logic* of infinity, not the *reality*.
  *   **Realized vs. Expected:** The Traders felt the pain of a bad flip (Round 2 loss). The paradox is about the *ex-ante* valuation. In reality, you only play once. The "Expected Value" is a guide for repeated play. If you can't repeat it infinitely, does the undefined EV matter?
  *   **Utility vs. Points:** We used linear points. Real agents have diminishing marginal utility. If we used log utility, the series might converge. The paradox relies on linear utility over unbounded payoffs.

  **4. Open Discussion (10 mins)**
  *   "If you were the Department Chair allocating resources based on this EV, what would you do?"
  *   "Is 'undefined' a feature of the world or a bug in our math?"

  ---

  ### Part 4: Predictable Failures (First Run Troubleshooting)

  1.  **The "Finite truncation" Objection:**
      *   *What happens:* A student will say, "But in reality, the coin will eventually land Tails. The probability of $k > 100$ is negligible. So the value is basically 0 or 1."
      *   *Fix:* Acknowledge this is the "Standard View" response. But press them: "If the decision rule depends on where you truncate, and the value flips from 0 to 1 depending on whether you stop at an even or odd number, do you have a *principle* for where to stop? Or are you just guessing?"
  2.  **Confusing Payoff with Probability:**
      *   *What happens:* Students will think the payoff is just $1, -1, 1, -1$. They will miss the $2^k$ scaling.
      *   *Fix:* Keep the formula $(1/2^k) \times 2^k = 1$ visible on the board at all times. The cancellation is the key mechanism.
  3.  **Auditor Collusion:**
      *   *What happens:* The Auditors talk to each other across groups and realize they disagree, then try to find a "compromise" (like 0.5).
      *   *Fix:* Enforce a "Blackout Period" during the Calculation Phase. No cross-group talk.
  4.  **Traders Ignoring Auditors:**
      *   *What happens:* Traders just flip a coin to decide.
      *   *Fix:* Remind them their "Workshop Priority" depends on making a *defensible* rational choice, not a lucky one. If they can't defend the choice using EV, they lose points.

  ---

  ### Part 5: Expert Note on Settled vs. Contested

  *Use this script to ensure you don't present contested views as consensus.*

  **The Settled Core:**
  "There is no mathematical controversy that the series $\sum (-1)^{n-1}$ diverges. There is no controversy that standard Expected Utility Theory (EUT) requires a defined integral or sum to yield a verdict. If the sum doesn't exist, EUT is silent. That is the technical baseline."

  **The Contested Frontier:**
  "Where philosophers disagree is what we do with that silence.
  *   **The Purists** say: 'EUT is broken. We need a new decision theory that handles conditional convergence.'
  *   **The Pragmatists** say: 'Infinite payoffs don't exist. Any real casino has a bankroll limit. If you cap the game, the EV is defined. The paradox is an artifact of idealization.'
  *   **The Pluralists** say: 'EV is just one tool. We should use Stochastic Dominance or other norms when EV fails.'

  I am not asking you to solve this today. I am asking you to feel why the Purist thinks EUT is in trouble. If your accounting method determines whether a deal is profitable or neutral, can you trust the accounting?"

  ---

  ### Summary Checklist for Facilitator
  *   [ ] **Stakes:** Define the "Workshop Priority" reward clearly at the start.
  *   [ ] **Board Work:** Write the series $1 - 1 + 1 - 1 \dots$ large and center.
  *   [ ] **Timekeeping:** Be ruthless. The debrief is where the learning happens; don't let the game overrun.
  *   [ ] **Neutrality:** When a student asks "So what's the right answer?", reply with "What does your Auditor say?"
  *   [ ] **Limitations:** Explicitly mention the finite horizon limitation in the debrief so they don't leave thinking the game *proved* infinity exists.
