prompt: |-
  i wanna build the full spec for what an adequate interpretation of zhuangzi's view on death actually has to deliver—not just the usual "everything transforms, so chill" take. give me the desiderata: the cases it must handle (the butterfly dream epistemic problem, the drumming-on-tubs response to his wifes death, the cook-ding carving logic applied to dying), the distinctions it cant collapse (accepting transformation vs emotional flatness, form-change vs consciousness-continuing, death-as-event vs death-as-condition), and the modern philosophical constraints it shouldnt violate—like explaining the fear-of-death / no-fear-of-prebirth asymmetry without smuggling in a permanent self.

