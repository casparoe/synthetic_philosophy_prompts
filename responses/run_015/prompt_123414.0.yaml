  The tension you identify is the central philosophical fault line of the meta-science reform movement. The rhetoric is indeed Popperian (naive falsificationism): "Make a risky prediction, test it, accept the refutation." But the actual behavior of the scientific community—preserving the "hard core" of theories like ego depletion by adjusting the "protective belt" of moderators and protocols—is unmistakably Lakatosian.

  Here is the breakdown of what the practice presupposes, where it is underdetermined, and what a genuine shift in appraisal would require.

  ### 1. The Methodology of the Practice: Lakatosian Structure
  The practice presupposes **Lakatos's sophisticated falsificationism**, even if the rhetoric lags behind.
  *   **The Hard Core:** When a high-profile replication fails (e.g., ego depletion), the community does not abandon the core theory. Instead, they invoke the **negative heuristic**: do not direct modus tollens at the hard core.
  *   **The Protective Belt:** The "standard reply" you note (hidden moderators, protocol fidelity, population differences) constitutes adjustments to the protective belt. This is rational behavior under Lakatos, provided the adjustments lead to novel predictions.
  *   **The Crisis:** The declaration of a "replication crisis" is effectively the judgment that a research programme may be **degenerating**. A programme degenerates when its belt adjustments are purely ad-hoc (explaining past data) rather than progressive (predicting novel facts). The reform movement's demand for preregistration is an institutional attempt to force the "belt" to produce *temporal* novelty, serving as a proxy for Lakatosian *theoretical* novelty.

  ### 2. The Scorecard Problem: Real-Time vs. Retrospective
  You correctly identify the friction between Lakatos's philosophy and institutional reality.
  *   **Novelty and Preregistration:** Preregistration guarantees *temporal* novelty (the prediction exists before the data), but it does not guarantee *theoretical* novelty. A degenerating programme can preregister ad-hoc adjustments just as easily as a progressive one. A Lakatosian scorecard would need to assess the *heuristic power* of the prediction, not just its timestamp.
  *   **Retrospective Appraisal:** Lakatos is explicit that degeneration is only legible historically. We cannot know from the inside if a moderator is a genuine discovery or a save. Therefore, a real-time scorecard is philosophically impossible to perfect.
  *   **The Workaround:** The demand for "decisive tests" is an **institutional workaround**. Since we cannot wait 50 years for a historical appraisal, we use rigorous, preregistered replications as a heuristic for "progressiveness." It is a pragmatic compromise: we treat a failed, high-powered preregistered replication *as if* it were decisive to prevent the protective belt from becoming infinitely flexible.

  ### 3. Strict Presupposition vs. Underdetermination
  This is where the philosophy becomes nuanced. The reforms are **underdetermined** by high-level epistemology, even if the practice looks Lakatosian.

  *   **What the Practice Strictly Presupposes:**
      *   **Human Bias:** It presupposes that researchers are subject to cognitive biases (p-hacking, HARKing) that distort evidence.
      *   **Transparency:** It presupposes that making methods and data open allows for error correction.
      *   **Accumulation:** It presupposes that single studies are noisy and evidence must be aggregated (meta-analysis).
      *   *Note:* None of these strictly require Lakatos. They are compatible with multiple frameworks.

  *   **What Fits Well (But Isn't Strictly Required):**
      *   **Lakatosian:** Fits the *theory retention* strategy (saving the core). Justifies Registered Reports (protecting the core from noise).
      *   **Bayesian Evidentialism:** Fits the *statistical* strategy. Preregistration fixes the likelihood ratio by preventing data-dependent hypotheses. Replication updates credence gradually rather than via binary falsification. This licenses the reforms equally well without needing the "hard core/belt" ontology.
      *   **Kuhnian:** Fits the *sociological* strategy. Reforms stabilize "normal science" by ensuring puzzle-solving is rigorous. The "crisis" language is explicitly Kuhnian.
      *   **Naive Falsificationism:** Fits the *rhetoric*, but contradicts the *practice* (as you noted).

  **Conclusion on Underdetermination:** The reforms are a **methodological toolkit** that is philosophy-agnostic. They fix the *process* of science, which is broken due to human bias, regardless of whether you view theories as Lakatosian programmes or Bayesian networks. However, the *response to theory failure* (the ego depletion case) is structurally Lakatosian.

  ### 4. Institutional Changes for Programme Appraisal
  If we dropped the pretense of decisive single tests and appraised research programmes explicitly (taking Lakatos seriously), the following would change:

  *   **Journals:** Would shift from publishing "findings" to publishing "programme updates." A paper would be evaluated on how it extends the heuristic power of a line of inquiry, not just on $p < .05$. "Negative results" that prune the protective belt would be valued as highly as positive results that extend it.
  *   **Funders:** Would fund **trajectories**, not projects. Grants would be awarded for 5-10 year research programmes with committed novel predictions, rather than 3-year projects seeking "significant" results. Renewal would depend on the progressive shift of the programme, not just output volume.
  *   **Hiring Committees:** Would evaluate **coherence and risk**. Instead of counting publications (which rewards belt-padding), they would assess whether a candidate's body of work represents a progressive problemshift (predicting new things) or a degenerating one (explaining old things with new parameters).

  ### Summary
  The practice of meta-science is **Lakatosian** in its operational logic regarding theory change (protecting cores, testing belts), but **underdetermined** in its philosophical justification (compatible with Bayesianism, etc.). The "decisive test" rhetoric is a necessary institutional fiction to manage the retrospective nature of Lakatosian appraisal.

