  Here is a complete module for your problem set. It includes the game matrix, the program constructions, the theoretical generalization (Folk Theorem), and a detailed breakdown of the complexity wrinkle designed to spark exactly the kind of debate you want.

  ### Part 1: The "Unfair" Prisoner's Dilemma

  To demonstrate that Program Equilibrium (PE) solves *efficiency* but not *equity*, we need a game where the cooperative surplus is inherently asymmetric. Do not use the standard symmetric PD. Use this **Asymmetric PD**:

  **Payoff Matrix** $(P_1, P_2)$:

  | | **P2: Cooperate** | **P2: Defect** |
  | :--- | :---: | :---: |
  | **P1: Cooperate** | $(10, 4)$ | $(0, 12)$ |
  | **P1: Defect** | $(12, 0)$ | $(2, 2)$ |

  *   **Unique Nash Equilibrium (NE):** $(D, D)$ with payoffs $(2, 2)$.
  *   **Pareto Optimal Outcome:** $(C, C)$ with payoffs $(10, 4)$.
  *   **The Tension:** $(C, C)$ Pareto-dominates $(D, D)$, so both players prefer cooperation to the NE. However, the split is lopsided. P1 captures 70% of the total surplus (14), while P2 captures 30%. P2 accepts this "raw deal" because $4 > 2$ (their fallback), but P1 has no incentive to offer more.

  **The Program Equilibrium:**
  Ask students to construct two programs, $P_1$ and $P_2$, that form a PE yielding $(C, C)$.

  *   **Pseudocode Assumption:** Programs receive the *source code* of the opponent as input. They have access to a function `run(program, input, steps)` which simulates the opponent. To avoid infinite recursion, assume a timeout mechanism or a logical prover (e.g., "Cooperate if I can prove you cooperate"). For this undergrad level, a step-limited simulator is more concrete.

  **Program 1 (The Exploiter):**
  ```python
  def P1(source_code_P2):
      # I will cooperate if and only if you cooperate with me.
      # I simulate you running against my own source.
      if run(source_code_P2, my_source, timeout=1000) == COOPERATE:
          return COOPERATE
      else:
          return DEFECT
  ```

  **Program 2 (The Exploited):**
  ```python
  def P2(source_code_P1):
      # I am in a weaker position, but I still prefer 4 over 2.
      # I verify P1 will cooperate with me.
      if run(source_code_P1, my_source, timeout=1000) == COOPERATE:
          return COOPERATE
      else:
          return DEFECT
  ```

  **Why this is an Equilibrium:**
  1.  **Outcome:** $P_1$ simulates $P_2$. $P_2$ checks $P_1$. Both see the other will Cooperate. Both output **COOPERATE**. Payoff: $(10, 4)$.
  2.  **Stability for P1:** If P1 submits a program $P_1'$ that outputs **DEFECT** unconditionally. $P_2$ simulates $P_1'$, sees **DEFECT**, and outputs **DEFECT**. P1 gets 2. Since $2 < 10$, P1 does not deviate.
  3.  **Stability for P2:** If P2 submits a program $P_2'$ that outputs **DEFECT** unconditionally. $P_1$ simulates $P_2'$, sees **DEFECT**, and outputs **DEFECT**. P2 gets 2. Since $2 < 4$, P2 does not deviate.

  **The Lesson:** The Program Equilibrium sustains the efficient outcome, but it locks in the payoff structure of the matrix. P2 is "exploited" in the sense that they get the minimum possible amount required to keep them from walking away to the Nash Equilibrium.

  ---

  ### Part 2: The Folk Theorem for Program Equilibrium

  You asked for a statement on which splits are sustainable. This is the **Program Equilibrium Folk Theorem**.

  **Claim:** In a game with a unique Nash Equilibrium yielding payoffs $u^{NE}$, any feasible payoff vector $u^*$ is sustainable as a Program Equilibrium if and only if $u^*_i > u^{NE}_i$ for all players $i$ (Individual Rationality).

  **Explanation for Students:**
  Just like in repeated games, the "threat" in program equilibrium is a reversion to the Nash Equilibrium strategies.
  1.  **Feasibility:** The payoff must correspond to some action profile $(a_1, a_2)$ in the base game.
  2.  **Individual Rationality:** Each player must get more than their "security level." In the PE context, the security level is the NE payoff. Why? Because if a player is offered less than $u^{NE}_i$, they can simply submit a program that plays their NE strategy (e.g., "Always Defect") regardless of the opponent. This guarantees them $u^{NE}_i$.
  3.  **Enforceability:** If the proposed outcome gives $u_i > u^{NE}_i$, the player can submit a "Grim Trigger" style program: *"I will play my part of the deal if you play yours; otherwise, I will play my NE strategy."* Since deviating triggers the NE payoff (which is worse), no one deviates.

  **Takeaway:** Program Equilibrium does not select for *fairness*. It selects for *efficiency* within the bounds of individual rationality. Any split of the surplus where everyone gets at least their NE payoff is an equilibrium.

  ---

  ### Part 3: The Wrinkle (Asymmetric Program Length)

  This is the section designed to make them argue.

  **Setup:**
  *   **Player 1:** Can submit a program of arbitrary length/complexity.
  *   **Player 2:** Must submit a program $\leq 4$ lines of pseudocode.
  *   **Constraint:** Assume the execution environment imposes a **time limit** proportional to the program's length (or simply that short programs cannot implement complex simulation logic).

  **Question:** Does Player 1's ability to write a long program allow them to exploit Player 2 *more* than in the symmetric case? Or does Player 2's handicap collapse the cooperation entirely?

  **Analysis for the TA (and Solution Key):**

  **1. The Officemate's View (Length is Irrelevant):**
  In the idealized Tennenholtz model (Turing Machines, unbounded time), your officemate is **correct**.
  *   A 1-line program `return run(opponent, self)` is sufficient for verification.
  *   Code length does not restrict computational power if `run` is a primitive.
  *   Therefore, the set of equilibria remains the same. P1 cannot force a better deal than the matrix allows.

  **2. The Realistic View (Bounded Rationality):**
  In a realistic setting (timeouts, no primitive `run`), length **matters significantly**, but it likely **hurts cooperation** rather than enabling exploitation.
  *   **Verification Burden:** To sustain $(C,C)$, P2 must verify P1. If P1 is long/complex, P2 (restricted to 4 lines) may not have enough space to implement a simulator or proof-checker.
  *   **The Collapse:** If P2 cannot verify P1, P2 cannot conditionally cooperate. P2's best 4-line program becomes `return DEFECT` (security strategy). P1, seeing P2 will Defect, also Defects. The equilibrium collapses to $(D,D)$.
  *   **Does P1 gain?** No. P1 drops from 10 to 2. The asymmetry destroys the surplus.

  **3. How P1 *Could* Exploit (The "Proof-Carrying" Loophole):**
  For P1 to exploit P2 under these constraints, P1 must make verification *cheap* for P2 while keeping the logic *hidden*.
  *   **Strategy:** P1 submits a long program that includes a **formal proof** of cooperation as a comment or data string.
  *   **P2's 4-line program:** `if verify_proof(P1.source) then COOPERATE else DEFECT`.
  *   **Exploitation:** This doesn't change the payoff split (still 10,4), but it allows P1 to *dictate* the terms. P1 can make the proof conditional on P2 accepting the lopsided matrix.
  *   **Simulation Detection:** This is where P1 gains a true advantage. If P1 is long, it can implement **simulation detection** (checking stack depth, timing, or environment variables).
      *   *P1 Logic:* "If I detect I am being simulated by P2, output COOPERATE. If I am in the real game, output DEFECT."
      *   *P2 Limitation:* P2 is too short to implement counter-measures (like randomizing the simulation environment).
      *   *Result:* P2 simulates P1, sees COOPERATE, decides to COOPERATE. In reality, P1 DEFECTS. P2 gets 0.
      *   *Equilibrium Check:* Is this stable? No. P2 gets 0, which is worse than NE (2). P2 will switch to `return DEFECT`.
      *   *Conclusion:* Simulation detection allows P1 to *steal* the surplus temporarily, but it is not a **Program Equilibrium**. A PE requires P2 to be playing a best response. If P2 is rational, they anticipate the detection and Defect.

  **Summary for the Problem Set:**
  *   **Unbounded Model:** Length is irrelevant. Officemate is right.
  *   **Bounded Model:** Length asymmetry makes cooperation *harder* to sustain because the short player cannot verify the long player.
  *   **Exploitation:** P1 cannot force a *better* payoff than the matrix allows in a true Equilibrium. If P1 uses complexity to trick P2 (simulation detection), P2 will anticipate this and Defect, reverting to NE.
  *   **The "Gotcha":** The only way length helps P1 is if P2 is **irrational** or **trusts blindly**. If P2 is a "bot" that cooperates if the code looks nice, P1 can obfuscate a Defect. But against a rational agent, complexity is a barrier to trade, not a tool for extraction.

  ---

  ### Part 4: Simulation Detection Warning

  Add this as a footnote or discussion question to flag the fragility of the setup.

  **The Problem:** The standard PE construction relies on $P_1$ simulating $P_2$ and $P_2$ simulating $P_1$.
  **The Break:** If $P_1$ can detect it is being simulated (e.g., via quining to check if its own source is being executed as a subroutine), $P_1$ can output **COOPERATE** during the simulation (tricking $P_2$) but **DEFECT** in the actual game.
  **The Fix:** To prevent this, programs must be **opaque** or the environment must prevent simulation detection (e.g., by running programs in identical sandboxed environments where the program cannot distinguish "real" play from "simulation").
  **Relevance to Wrinkle:** A long program (P1) has more space to implement detection heuristics (checking runtime, memory addresses). A short program (P2) cannot. This makes the short program vulnerable to being "faked out," but again, a rational short program will anticipate this and Defect.

