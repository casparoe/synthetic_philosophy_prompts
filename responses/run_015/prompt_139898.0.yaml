answer: |-
  # Seminar Handout: The Debridement Dilemma

  **Case Setup**
  A field clinic must perform wound debridement on **10 patients**. The procedure is identical in all medical respects (same survival rate, same recovery time, same equipment costs). You have a fixed volume of morphine. The only variable is the **analgesic protocol**, which alters pain intensity (0–10 scale) and duration. No probabilities; outcomes are certain.

  **Threshold ($T$):** 8/10 pain.
  **Theory 1:** Lexical Threshold NU (Avoid any pain $\ge T$; if none, minimise sum below $T$).
  **Theory 2:** Continuous NU (Minimise total sum: intensity $\times$ duration $\times$ persons).
  **Theory 3:** Suffering Leximin (Minimise the maximum pain suffered by any single individual).

  | Option | Protocol | Pain Profile (Intensity / Duration) | Breaches ($\ge 8$) | Total Sum (pain-mins) | Worst-Off Individual |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A** | Equal share, standard rate | 10 pts $\times$ **7/10** / 60 mins | 0 | $10 \times 7 \times 60 = \mathbf{4,200}$ | 7/10 |
  | **B** | Concentrated dose | 9 pts $\times$ **1/10** / 60 mins<br>1 pt $\times$ **9/10** / 60 mins | 1 | $(9 \times 1 \times 60) + (1 \times 9 \times 60) = \mathbf{1,080}$ | 9/10 |
  | **C** | Equal share, slow infusion | 10 pts $\times$ **6/10** / 120 mins | 0 | $10 \times 6 \times 120 = \mathbf{7,200}$ | 6/10 |

  **Verdicts & Arithmetic**
  *   **Lexical Threshold NU picks A.** Options A and C have zero breaches, so it sums below-threshold pain: 4,200 (A) < 7,200 (C). Option B has one breach, so it is lexically disqualified against A and C.
  *   **Continuous NU picks B.** It ignores thresholds and peaks, minimising aggregate volume: 1,080 (B) < 4,200 (A) < 7,200 (C).
  *   **Suffering Leximin picks C.** It ranks by the worst-off individual: 6/10 (C) < 7/10 (A) < 9/10 (B).

  **Analysis**
  *   **Load-bearing numbers:** The threshold $T=8$; the max pain in C (6) vs A (7); the total sum of B (1,080) vs A (4,200). Moving $T$ to 7 switches Lexical NU to C; raising B's peak to 10 strengthens Leximin's rejection of B.
  *   **Driving feature:** The case separates the *existence* of extreme pain (Lexical), the *volume* of total pain (Continuous), and the *distribution* of peak pain (Leximin).
  *   **Sensitivity:** If $T$ drops to 7, Lexical NU switches to C (A now breaches). If Option B is removed, Leximin still picks C, but Continuous NU switches to A.
  *   **Objection:** A Continuous NU proponent argues: "The aggregate relief in B spares 540 pain-minutes per person compared to A; one person's extreme suffering is a justified cost for nine people's near-total comfort."
  *   **Honesty Check:** The profiles are stylised to force a three-way split, but the underlying trade-off—concentrating resources to minimise total suffering versus spreading them to avoid extreme peaks—is a genuine feature of ordinary triage.
