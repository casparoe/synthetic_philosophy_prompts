prompt: |-
  hey! im in this philosophy of science seminar (about 10 people, 60 min session) and we're talking about whether a long-run theory can be "right but early" — like Malthus with population growing geometric and food only arithmetic, then tech saves us and everyone calls him falsified. my prof mentioned falsifcation and rescue in long-run predictions, and i want to run an activity for my study group that actually makes us feel that tension instead of just discussing it.

  can you design a classroom game? i want three teams: defenders of a structural long-run claim (they have a two-curve chart showing the gap widening), critics who can play "innovation cards" to shift the resource curve (green revolution, synthetic fertilizer, demographic transition in east asia), and adjudicators who hold "credibility chips." every round the adjudicators vote: falsified, suspended, or rescued. if they vote falsified and then a rescue card hits, they lose chips; if they keep rescuing forever they hit "predictive bankruptcy" and also lose. use token payoffs only — no real money, just points.

  the rules should be arranged so that by round 4 we realize we're replaying the malthus debate without anyone having named it. include a debrief that maps each round onto actual historical moments (british census data, 1960s agricultural tech, maybe the demographic transition) and asks us exactly where we felt the pull to say "he was just early, not wrong." also tell me what will predictably break the first time i run it, and be honest about which feature of the "right but early" problem the game just cant reproduce — like actually waiting two centuries to check.

  please write the answer in American English. no citations or reading lists needed, just the runnable activity with rules, roles, and the debrief.
