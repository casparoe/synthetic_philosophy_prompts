prompt: |-
  i'm in an early christian ethics seminar and we just did augustine on lying — the two short treatises where he argues it's never permitted to lie at all, and then the part where he still sorts lies into kinds (injurious, officious, jocose) and treats some as much less serious than others. i've been testing my gut on cases and the verdicts won't line up, and i need a principle, or two or three candidate principles, that i can actually defend in my paper next week.

  my verdicts (labels so you can refer back):

  A. a man with a gun knocks and asks where my roommate is; he's in the shower and I say "he went out an hour ago." — fine, and more than fine, it feels required.
  B. my grandmother knitted me an ugly sweater and asks if I like it; I say I love it. — fine, barely registers as a moral thing at all.
  C. pub quiz: I tell my mate his answer is wrong when it's right, purely as a piss-take; nobody loses anything. — fine-ish, but I'd feel different if money was riding on it, which makes me think it's fine for a different reason than B.
  D. my neighbour with dementia asks every afternoon whether her sister rang; she didn't; I say yes. — fine, and I'd do it again, but it leaves a residue that B doesn't.
  E. a friend with a terminal diagnosis asks me straight out if he's going to die from it; I say "no, you'll be fine." — not fine, and worse than D, which is confusing since both are falsehoods told to comfort someone.
  F. job interview: I say I left my last job voluntarily when I was fired. — clearly not fine, the worst one on this list.
  G. same as A, but instead of lying I just say "I'm not telling you." — feels better than A, even though it might get my roommate killed. That's the one I keep going back to.
  H. I tell someone something that happens to be true, but I believe it's false and I'm trying to mislead them. — my gut says this is still lying, which makes me think the wrong-making thing is the intent, not the falsity of what I said.

  So: is there one principle that gets all eight, or do some of my verdicts have to go? I keep thinking a graded version of Augustine's line — every lie is wrongful, but gravity varies with the kind of lie and the motive — saves more of them than a consequentialist one does, especially G, but I can't tell whether the grading is doing real work or just smuggling consequences back in through the back door. And if the wrong-making feature really is the will to deceive rather than the falsity of the statement, then what does that say about misleading someone without asserting anything false — silence, equivocation, letting someone walk away with a false belief I didn't plant — and about a novelist writing false dialogue for a character?

  Give me the discussion in prose, then a JSON object at the end. Schema:

  {
    "principles": [
      {
        "name": "short label",
        "statement": "one or two precise sentences stating the principle",
        "case_verdicts": {"A": "written-out verdict", "B": "...", "C": "...", "D": "...", "E": "...", "F": "...", "G": "...", "H": "..."},
        "overturns": ["labels of my verdicts this principle can't save"],
        "new_case": {"description": "a lying-ish case I didn't give you", "predicted_verdict": "what the principle says", "rationale": "why"},
        "augustine_fit": "which parts of the Augustinian package it keeps and which it drops",
        "collapse_risk": "whether it collapses into consequentialism, and why or why not"
      }
    ],
    "recommendation": "which one you'd have me defend, in a sentence or two",
    "unsettled": ["cases or features none of the principles settle"]
  }

  two or three candidates is plenty, and I'd rather you be blunt about which of my gut calls are just inconsistent.
