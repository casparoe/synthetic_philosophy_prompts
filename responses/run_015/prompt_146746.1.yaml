answer: |-
  You are right to distrust the standard labels. "Sunk cost," "Concorde effect," and "escalation of commitment" are often used as catch-all buckets for any situation where people continue a losing course of action. But as your cases show, the *mechanism* driving that continuation matters. If the mechanism differs, the remedy differs. Treating them as one phenomenon would be like treating a broken leg, a muscle cramp, and a paralysis as the same thing because none of them allow you to walk.

  Based on the structure of the incentives and the barriers to exit you described, these are **three distinct phenomena**. They share a surface resemblance (persistence in a costly activity), but the engine driving that persistence is different in each case.

  Here is the structural breakdown, the precise concepts that fit (or fail to fit), and new terms where the old ones break down.

  ### Case 1: The Free-Exit Auction
  **Structure:** Two players. High bid wins prize. Second bid is paid to auctioneer (burned). **Crucially:** Either player can halt at any time, bids are refunded, no money changes hands.
  **Observation:** Players bid past the value of the prize despite a free, zero-cost exit.
  **Established Concept Check:**
  *   *Sunk Cost:* **Fails.** Sunk cost reasoning requires that past investment be irretrievable ("I've spent $50, I can't leave now"). In your variant, the investment is fully retrievable upon halting. The cost is not sunk; it is *voluntarily maintained*.
  *   *Escalation of Commitment:* **Fails.** This implies a rationalization of past decisions. Your players knew the arithmetic. They did not need to justify the past; they were driven by the future.

  **New Concept: Volitional Lock-in**
  This is not an economic trap; it is a psychological one. The structure allows for a "cooling-off" period (the halt option), but the agents psychologically disable it.
  *   **Definition:** A situation where an agent continues a costly activity despite the availability of a zero-cost exit, driven by a shift in utility from *economic gain* to *competitive victory*. The value of the object changes during the contest (from face value to trophy value).
  *   **Why it fits:** Your colleagues understood the math but could not execute the halt. The barrier to exit was internal (ego/arousal), not external.
  *   **Boundary Case:** To distinguish this from the others, ask: *If a third party halted the game for them, would they be relieved or angry?* In Volitional Lock-in, they would likely be angry (deprived of victory). In the other two cases, they would be relieved (saved from loss).

  ### Case 2: The Transfer Auction
  **Structure:** Two players. High bid wins prize. Second bid is paid to *winner* (transferred).
  **Observation:** Bidding goes higher than Case 1. You judge this as rational.
  **Established Concept Check:**
  *   *Sunk Cost:* **Fails.** Again, the decision is forward-looking. It is not "I spent $50 so I must win." It is "If I stop now, I lose $50 to *you*."
  *   *War of Attrition:* **Close, but imprecise.** In a standard war of attrition, both sides pay costs over time. Here, the loser pays the winner. This creates a specific ratchet effect.

  **New Concept: Structural Lock-in (or The Ratchet Trap)**
  This is a genuine economic trap. The rules of the game make stopping more expensive than continuing, at least in the short term.
  *   **Definition:** A situation where the rules of engagement impose an immediate, realized loss on the party who ceases activity, while continuing defers that loss. The agent is rationally coerced into escalation to avoid an immediate penalty.
  *   **Why it fits:** Unlike Case 1, the exit is *not* free. Stopping crystallizes a loss. Continuing keeps the position "in the money" (or at least, not yet realized as a loss). Your colleagues were not foolish; they were playing the rules correctly.
  *   **Boundary Case:** *Does the player want to stop?* In Structural Lock-in, the player *wants* to stop but *cannot* without penalty. In Volitional Lock-in (Case 1), the player *can* stop without penalty but *will not*.

  ### Case 3: The Bureaucratic Program
  **Structure:** Committee renewal. Cost of continuing is shared (budget). Cost of stopping is personal (blame/liability).
  **Observation:** Program continues despite low value.
  **Established Concept Check:**
  *   *Sunk Cost:* **Fails.** You noted the current decision-makers did not choose the program. They have no past investment to justify.
  *   *Tragedy of the Commons:* **Close.** This is usually about overuse of a shared resource. This is the inverse: *under-use* of a shared stop-button.

  **New Concept: Distributed Lock-in (or The Liability Shield)**
  This is a political/social trap, not an economic or psychological one. It arises from an asymmetry in how risk is assigned.
  *   **Definition:** A situation where the cost of inaction is diffused across a group (invisible), while the cost of action (stopping) is concentrated on an individual (visible). Rational self-interest dictates inaction, even when collective interest dictates action.
  *   **Why it fits:** The driver is not "winning" (Case 1) or "avoiding loss to an opponent" (Case 2). It is "avoiding personal attribution of failure." The program continues not because it is valuable, but because killing it is dangerous.
  *   **Boundary Case:** *If the decision were anonymous, would the program stop?* In Distributed Lock-in, yes. If the person proposing the cut could not be identified, the personal liability vanishes, and the program would likely be cut. In Volitional or Structural Lock-in, anonymity changes nothing.

  ### Summary of Distinctions

  | Feature | Case 1: Volitional Lock-in | Case 2: Structural Lock-in | Case 3: Distributed Lock-in |
  | :--- | :--- | :--- | :--- |
  | **Cost of Exit** | Zero (Formally) | High (Immediate Loss) | High (Social/Professional) |
  | **Driver** | Competitive Arousal (Ego) | Rule Coercion (Math) | Risk Asymmetry (Politics) |
  | **Rationality** | Irrational (Economic) | Rational (Individual) | Rational (Individual) / Irrational (Group) |
  | **Barrier Location** | Inside the Agent | In the Rules | In the Social Structure |
  | **Remedy** | Cooling-off / Third Party | Rule Change | Anonymity / Shared Blame |

  ### Why They Are Not One Phenomenon

  If you treat these as one thing, you will prescribe the wrong cure.

  1.  **If you treat Case 1 as Structural:** You might try to change the auction rules. But the rules already allowed a free exit. The problem was the *people*, not the *paper*. The cure is psychological (removing the audience, cooling the room), not structural.
  2.  **If you treat Case 2 as Volitional:** You might tell the players they are being emotional fools. But they aren't. They are responding correctly to a predatory rule set. The cure is to change the payout structure (e.g., runner-up pays auctioneer, not winner), not to lecture the players.
  3.  **If you treat Case 3 as Sunk Cost:** You might argue, "Don't worry about the past years." But the committee members aren't worrying about the past. They are worrying about their *future* reputation. The cure is to make stopping a committee decision (diffusing the blame) rather than an individual proposal.

  ### Final Verdict

  These are **three phenomena**. They are united only by the outcome (persistence), not the cause.

  *   **Case 1** is a failure of **will** (Volitional Lock-in).
  *   **Case 2** is a failure of **design** (Structural Lock-in).
  *   **Case 3** is a failure of **governance** (Distributed Lock-in).

  For your discussion group, the most fruitful question is not "Why did they continue?" but "What kind of wall is stopping them from leaving?" Is the wall in their head, in the rulebook, or in the organizational chart? That distinction tells you whether you need a therapist, a lawyer, or a politician to fix it.
