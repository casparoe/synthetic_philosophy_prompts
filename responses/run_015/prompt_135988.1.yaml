  ### The Principle: Threshold Critical-Level Utilitarianism with Average Weighting

  Based on your seven verdicts, no standard aggregation rule (Total, Average, or simple Critical-Level) fits perfectly without modification. Your intuitions demand a hybrid that respects the *worth* of a life, the *density* of welfare within lives, and the *risk* of suffering.

  Here is the principle that best reconstructs your reasoning, precise enough for hand application:

  **The Weighted Critical-Level Principle**
  1.  **Critical Threshold ($c$):** Set a critical level of well-being at **+5**. (Lives below this contribute no positive value; lives significantly below 0 are heavily penalized).
  2.  **Individual Value:** The value of a single life is $(w - c)$. If $w < c$, the value is 0 (for aggregation purposes) unless $w < 0$, in which case it is negative.
  3.  **Population Weighting:** Calculate the **Average Welfare** ($\bar{w}$) of the population. Apply a multiplier to the Total Value based on $\bar{w}$.
      *   If $\bar{w} \geq 50$, Multiplier = 1.0.
      *   If $\bar{w} < 50$, Multiplier decreases as $\bar{w}$ drops. (e.g., at $\bar{w} = 1$, Multiplier $\approx 0.1$).
      *   *Rationale:* This captures your Case 5 intuition: welfare concentrated in fewer, richer lives is more valuable than welfare spread thinly across many bare lives, even if totals match.
  4.  **Existence Risk Constraint:** When creating *new* lives, do not accept any probability of a life falling below 0 (suffering-dominated) unless it guarantees a significant benefit to *existing* people. For new lives alone, certainty of a worth-living life trumps higher expected value with risk.

