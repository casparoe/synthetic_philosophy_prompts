  ### Answers to Your Unresolved Comparisons

  Using the **Weighted Critical-Level Principle**:

  **1. Is there any finite number of people at +1 that beats 1,000 people at +100?**
  *   **Verdict:** **No.**
  *   **Reasoning:** Lives at +1 are at or below the Critical Threshold ($c=5$). They contribute zero positive value to the sum. Furthermore, their presence drags the Average Welfare down to 1, triggering the severe Population Weighting penalty. No matter how many you add, they add no surplus value and actively dilute the value of the population's average.

  **2. Is A plus 1,000,000 people at +1 better or worse than A alone?**
  *   **Verdict:** **No improvement (Neutral).**
  *   **Reasoning:** Adding lives at +1 adds no surplus value ($1 < 5$). It does not make the world *worse* (unless resources are diverted from existing people, which you stipulated they are not), but it does not make it *better*. It is morally optional.

  **3. Is 2,000,000 people at +50 better than 1,000,000 at +100?**
  *   **Verdict:** **1,000,000 at +100 is better.**
  *   **Reasoning:**
      *   Total Welfare is equal (100 million units).
      *   Average Welfare: Option A is 100; Option B is 50.
      *   Option A triggers the full Multiplier (1.0). Option B triggers a reduced Multiplier (because 50 is on the boundary of the "Decency Threshold").
      *   Consistent with your Verdict 5 (Concentration), the population with higher quality of life per person is preferred when totals are equal.

