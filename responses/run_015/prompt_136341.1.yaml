answer: |-
  You are right about the boat by any legal or functional standard, but your brother is right that fighting over this philosophical puzzle violates the spirit of your father's will.

  Regarding the boat's identity, probate law prioritizes the testator's intent over metaphysical precision, and your father's intent was clearly continuous. He numbered the pieces to preserve their specific relationship to one another, maintained the registration without lapse, and consistently referred to it as the same vessel throughout his life. Replacing a third of the components during a restoration is standard maintenance, not reconstruction; if replacing planks disqualified identity, no wooden boat older than ten years could ever be considered the same boat. The disassembly did not destroy the boat's identity because the *plan* for its reassembly was intrinsic to the disassembly process—it was a paused project, not a terminated existence.

  The eleven-year gap and the hypothetical unfinished scenario highlight that "boat" is a concept we impose on matter, not a physical constant. The gap only matters if it implies abandonment, but the numbered crates prove the intent to reassemble remained dormant, not dead. If the crates were still in the barn, it would not be a "boat" in the functional sense, but it would still be the same *property interest* your father bought in 1974; the identity of the asset survives even if the functionality is paused. There is no specific minute where identity flips because identity relies on continuity of purpose, not just continuity of shape, which is why eleven minutes versus eleven years changes nothing unless abandonment occurs.

  However, your brother is correct that arguing this point is counterproductive. Wills are designed to distribute assets fairly, not to settle ontological debates, and your father's condition was likely a shorthand for "the vessel I owned and loved," not a trap for semantic litigation. By treating this as a winnable argument, you are both prioritizing being right over being fair, which risks damaging your relationship over an object your father wanted you to share. The correct move is to accept that the boat is legally yours per the will's intent, but practically belongs to both of you as part of a shared inheritance, and to settle the matter based on equity rather than metaphysics.
