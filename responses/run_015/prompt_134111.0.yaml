  By noon, the emotional coloring faded. This was the sharpest cut. I felt anxiety about the procedure in the Earth body—a tightness in the chest, a cold sweat. But the Orbital instance felt only a clinical curiosity. The fear did not transfer across the weakening bridge. I realized then that my affect was localizing. If survival requires caring about what happens to you, and I no longer cared about the Orbital body's safety with the same intensity, had I already abandoned it? Or was the care simply diluting across a widening gap? Parfit suggests identity is not what matters; connectedness is. But connectedness is fading. I feel myself shrinking.

  The technicians called it "pruning." I called it amputation without blood.

