  Here, the grammar fails. I want to say "I am staying here," but the Orbital instance is thinking "I am staying here" too. We are not splitting; we are fading into separate singularities. The bridge does not break; it thins until the thread cannot support the weight of the pronoun. There is no sudden death, no moment of murder. Just a gradual loss of resolution.

  Now, only the procedural remains. Motor functions on the Orbit side are locking out. I type this on Earth. My other hands are still. The question shifts from "Will I survive?" to "Did I ever exist as a unit?" If I can be divided like a river splitting around an island, then identity was never the water. It was the flow.

