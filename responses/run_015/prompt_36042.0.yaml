answer: |-
  # Diagnostic Quiz: Which Theory of De Re Modality Do You Actually Hold?

  **Instructions:** Below are eight concrete cases involving possibility, identity, and change. For each case, select the option that best matches your immediate intuition. Do not worry about technical terminology; answer based on what seems true or false to you about the scenario described. At the end, a scoring key will locate your pattern of answers within the logical space of modal metaphysics.

  ### The Questions

  **1. The Near-Miss**
  A politician loses an election by a handful of votes. We say, "He could have won." When you evaluate this claim, what is happening in the situation where he wins?
  *   **A.** The very same person exists in that situation and wins.
  *   **B.** A different person, who closely resembles him, exists in that situation and wins.
  *   **C.** It depends on how we choose to describe the situation; there is no fact of the matter.

  **2. The Modal Fission**
  Imagine the nearest possible world where you win a major lottery. In that world, due to a strange quirk, there are two individuals: one shares your exact memories and psychology up to today, and the other shares your exact physical appearance and mannerisms. Neither resembles you more overall than the other. Is the statement "I would have won the lottery" true in this scenario?
  *   **A.** Yes, clearly true.
  *   **B.** No, clearly false.
  *   **C.** It is indeterminate or requires a tie-breaking convention to be true.

  **3. The Swapped Histories**
  Consider a possible world that is qualitatively identical to ours in every respect (same laws, same properties distributed across space and time), except that you and your closest physical duplicate have swapped life histories. In this world, the person with your body lived your duplicate's life, and vice versa. Is this a *different* possible world from the one where you live your actual life?
  *   **A.** Yes, they are distinct possibilities.
  *   **B.** No, that is just the same world described differently.
  *   **C.** I am not sure what "distinct" means here, but the scenario seems impossible.

  **4. The Origin**
  Consider a person who was conceived from a completely different pairing of gametes (sperm and egg) than you were, but who is otherwise exactly as similar to you as you like (same name, same parents, same life). Could that person be you?
  *   **A.** No, that is impossible. Origin is essential.
  *   **B.** Yes, provided they are similar enough in other respects.
  *   **C.** Yes, identity is primitive and not constrained by origin or similarity.

  **5. The Degradation**
  Could you have been a frog? Assume there is a possible world containing a frog that stands in the best possible candidate relation to you (perhaps it has your soul, or your origin, or is the most similar thing to you in that world).
  *   **A.** No, that is obviously impossible.
  *   **B.** Yes, if the right causal or historical connection holds.
  *   **C.** Yes, if the frog is sufficiently similar to me.

  **6. The Actual Duplicate**
  Suppose that right now, in this actual world, there exists a perfect physical and psychological duplicate of you, causally disconnected from your actual history (a "swampman" style duplicate). Is that duplicate you?
  *   **A.** No, it is a distinct individual.
  *   **B.** Yes, it is me.
  *   **C.** It is indeterminate.

  **7. The Gradual Shift**
  Imagine a chain of possible worlds starting from the actual world. In each step, you change slightly (one cell different, one memory different). At the end of the chain, you are completely different qualitatively. Is the individual at the end of the chain you?
  *   **A.** Yes, identity is preserved through the chain.
  *   **B.** No, at some point the individual ceases to be me.
  *   **C.** There is no sharp cutoff, so it is vague.

  **8. The Lonely Duplicate**
  Imagine a possible world that contains nothing but a single individual who is a perfect qualitative duplicate of you. There is no causal connection to our world. Is that individual you?
  *   **A.** No, without the right history or connection, it is not me.
  *   **B.** Yes, qualitative duplication is sufficient for identity.
  *   **C.** The question is meaningless without further stipulation.

  ***

  ### Scoring Key

  To find your position, trace your answers through the following decision tree.

  **Step 1: The Haecceitism Check (Question 3)**
  *   If you answered **3A** (Yes, distinct worlds): You are inclined toward **Bare Haecceitism**. Proceed to *Leaf 4*.
  *   If you answered **3B** or **3C** (No/Impossible): You are an **Anti-Haecceitist**. Proceed to Step 2.

  **Step 2: The Identity Check (Questions 1, 6, 8)**
  *   If you mostly answered **A** (The same person/No duplicate is me): You lean toward **Transworld Identity (TWI)**. Proceed to Step 3.
  *   If you mostly answered **B** (Resembles him/Duplicate is not me): You lean toward **Counterpart Theory (CT)**. Proceed to Step 3.
  *   *Note: If you mixed these heavily (e.g., 1A but 6B), you may hold an unstable combination. See "Empty Cells" below.*

  **Step 3: The Uniqueness & Essentialism Check (Questions 2, 4, 5)**
  *   **For TWI Leaning:**
      *   If you answered **4A** (Origin Essentialism) and **5A** (No Frog): You land on **Leaf 2 (Kripkean TWI)**.
      *   If you answered **4B/C** (Non-Essentialist) and **5B** (Frog Possible): You land on **Leaf 5 (Liberal TWI)**.
  *   **For CT Leaning:**
      *   If you answered **2C** (Indeterminate): You land on **Leaf 3 (Permissive CT)**.
      *   If you answered **2A** (True) and **5A** (No Frog due to similarity): You land on **Leaf 1 (Lewisian CT)**.

  ***

  ### The Leaves: Positions and Awkward Commitments

  **Leaf 1: The Similarity Counterpartist (Lewisian)**
  *   **Profile:** Anti-Haecceitist, Counterpart Theory, Similarity-based constraints.
  *   **Awkward Commitment:** You must admit that when you say "I could have won," you are strictly speaking reporting that someone else won, and literal self-interest in other worlds is a category mistake.

  **Leaf 2: The Essentialist Identitarian (Kripkean)**
  *   **Profile:** Anti-Haecceitist, Transworld Identity, Origin Essentialism.
  *   **Awkward Commitment:** You must maintain that you exist in other worlds as a literal constituent, yet deny that we can identify you there by any qualitative description, relying instead on a primitive "thisness" that resists analysis.

  **Leaf 3: The Indeterminist Counterpartist (Permissive CT)**
  *   **Profile:** Anti-Haecceitist, Counterpart Theory, Multiple Counterparts allowed.
  *   **Awkward Commitment:** You must accept that many ordinary modal claims (like "I would have won") lack a truth value entirely whenever your properties branch, making modal logic significantly messier than classical logic.

  **Leaf 4: The Bare Haecceitist**
  *   **Profile:** Haecceitist, Transworld Identity (typically), Primitive Thisness.
  *   **Awkward Commitment:** You must concede that God could create two universes that are qualitatively identical in every respect, yet differ solely in which individual occupies which role, rendering the difference empirically undetectable and explanatorily idle.

  **Leaf 5: The Liberal Identitarian (Rare/Unexplored)**
  *   **Profile:** Anti-Haecceitist, Transworld Identity, Non-Essentialist.
  *   **Awkward Commitment:** You must explain how *you* can be a frog in another world without relying on similarity (which would make you a counterpart theorist) or primitive haecceity (which would make you a haecceitist), leaving your criterion for transworld identity mysteriously ungrounded.

  ***

  ### Limitations and Empty Cells

  **The Indistinguishability Caveat**
  This instrument cannot reliably distinguish between **Leaf 1 (Lewisian CT)** and **Leaf 2 (Kripkean TWI)** if the Counterpartist weights "origin similarity" overwhelmingly heavily. A Lewisian who believes the counterpart relation is fixed almost exclusively by origin will answer the Origin Question (Q4) and the Politician Question (Q1) identically to a Kripkean Essentialist. If you found yourself answering "It's him" because "only someone with my origin counts as a counterpart," the quiz has misdiagnosed you as a Transworld Identity theorist. This is a known structural limitation: a sufficiently restrictive counterpart relation is extensionally equivalent to transworld identity with essentialist constraints.

  **Empty Cell: The Haecceitist Counterpartist**
  No leaf corresponds to a view that combines **Counterpart Theory** with **Bare Haecceitism** (answering 3A but 1B). This cell is likely empty because the motivations for Counterpart Theory (avoiding transworld identity puzzles) usually align with the motivations for Anti-Haecceitism (supervenience of the modal on the qualitative). Holding that individuals are world-bound (CT) but that worlds can differ haecceitistically (Haecceitism) is logically coherent but theoretically unstable; it retains the costs of primitive thisness without the benefit of literal transworld identity.

  **Empty Cell: The Qualitative Reductionist**
  There is no leaf for a view that denies *de re* modality entirely (answering that all such claims are really *de dicto*). While this is a recognized position (modal eliminativism or reductionism), the quiz presupposes a realist stance toward modal claims to sort the *type* of realism. Readers who feel all these questions rest on a mistake likely fall outside the intended logical space.
