prompt: |-
  I'm in a seminar on moral change right now (we did Appiah's book on honor codes and then the Bernard Williams argument about slavery — the bit where he says the ancients weren't missing any fact that we have, reflection just wrecked their conceptual scheme, and there's no guarantee that whatever replaces it is an improvement) and I also work about fifteen hours a week as a student campaigner for a small NGO that runs behaviour-change campaigns. We greenlight maybe four campaigns a year, each one costs a couple hundred thousand dollars, and our actual method so far is basically: decide the practice is bad, say on a poster that it's bad, measure nothing. I have to run a workshop for our country director and two community advisory board members next month on how we pick and design these things, and I'd rather bring them something usable than a summary of the readings.

  So what I want is a procedure, not an essay. Take the distinction between norms held in place by argument, by interest, and by honour, and turn it into a decision procedure our team could actually run on a candidate practice in an afternoon workshop — the questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it has to hand the decision back to a human being because it's really a question about values. The people running it will be comms staff and one field officer, so nothing that needs philosophy vocabulary to apply. Things I think it has to handle, and I'm not sure how: how to work out who the relevant honour audience actually is (whose respect does the person doing the practice need, and can we reach them); whether the practice can even be made visible to that audience, since I suspect a lot of our campaigns target things nobody will admit to anyway; whether there's a face-saving exit ramp so people can stop without conceding they were wrong before — my guess is that's why the anti-dueling stuff worked and our stuff doesn't; and how to tell a case where people already privately agree with us but can't stop because of coordination or money, which I think no amount of honour or argument will fix. I also want it to be honest about the Williams worry my tutor keeps raising, which as I understand it is that a procedure like this can tell you whether you'd win but not whether you're right — if that's a real limit, mark exactly where it bites in the procedure.

  Then run it on three cases. First: the initiation week for the sports clubs at my own university, which involves a lot of drinking and some genuinely nasty hazing that everyone knows about and nobody reports. Second: informal cash gifts that families give to nurses at a district hospital where our partner works — everyone knows it's against the rules, the nurses' salaries are months in arrears, and families who don't pay say they get ignored; I can't tell if this is an interests case, an honour case, or neither. Third, and this is the one where I expect an answer I won't like: our own fundraising imagery, i.e. photos of identifiable children in pretty dire situations that we send to donors because they outperform everything else we've tried. Please don't tell me to go read more — I need something I can put on one page and defend in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Analyze the Request:**
      *   **Context:** The user is a student seminar participant (studying Appiah on honor codes and Bernard Williams on moral change/slavery) *and* a practitioner (student campaigner for an NGO running behavior-change campaigns).
      *   **Problem:** Current NGO method is "decide it's bad, put it on a poster, measure nothing." This is ineffective.
      *   **Task:** Create a *decision procedure* (not an essay) for selecting and designing campaigns. It needs to be usable in an afternoon workshop by comms staff and a field officer.
      *   **Key Concepts to Integrate:** Appiah's distinction (norms held by argument, interest, honor), Williams' worry (reflection wrecking conceptual schemes, no guarantee of improvement), face-saving exit ramps, visibility of the practice, identifying the honor audience, coordination/money constraints vs. normative constraints.
      *   **Constraints:** One-page style (concise, actionable), no philosophy jargon, must handle specific edge cases (visibility, exit ramps, structural constraints), must explicitly mark where the "Williams worry" bites (is vs. ought).
      *   **Deliverables:** The Procedure + Application to 3 Cases (University Hazing, Hospital Bribes, NGO Fundraising Imagery).

  2.  **Deconstruct the Theory for Practice:**
      *   *Appiah:* Behavior change isn't just about facts (argument) or money (interest). Often it's about *honor* (social standing, respect). To change behavior, you often need to change what brings honor/shame.
      *   *Williams:* We might be "right" by our lights, but if the local conceptual scheme doesn't support our view, forcing it might just break things without making them better. Also, our own "righteousness" might be the problem (e.g., fundraising imagery).
      *   *Practical Translation:*
          *   Argument = "It's wrong." (Often fails alone).
          *   Interest = "It costs you." (Needs structural change).
          *   Honor = "People like you don't do this." (Needs audience shift).
          *   Williams Limit = "Are we sure *we* are the good guys here?" (Reflexivity check).

  3.  **Drafting the Procedure (The "One-Pager"):**
      *   *Goal:* A flowchart or step-by-step checklist.
      *   *Audience:* Comms staff + Field Officer. Needs plain English.
      *   *Structure:*
          1.  Diagnosis (What holds the behavior in place?)
          2.  Feasibility (Can we reach the audience? Is there an exit?)
          3.  Ethics/Williams Check (Are we sure?)
          4.  Go/No-Go Decision.
      *   *Refining the Steps:*
          *   *Step 1: The Engine.* Is this driven by Need (Money/Structure), Fear (Law/Punishment), or Reputation (Honor/Shame)?
          *   *Step 2: The Audience.* Who watches? Can they see the act?
          *   *Step 3: The Exit.* Can they stop without losing face?
          *   *Step 4: The Mirror (Williams).* Are we imposing an external value that breaks their world? Are *we* doing something questionable to stop them?
      *   *Stop Conditions:* If it's purely structural (no money), don't do a norm campaign. If it's invisible, don't do a shame campaign. If the "Mirror" check fails, pause.

  4.  **Developing the Case Studies:**
      *   *Case 1: University Hazing.*
          *   *Engine:* Honor/Belonging.
          *   *Audience:* Peers/Seniors.
          *   *Visibility:* High (within the group), Low (outside).
          *   *Exit:* Hard (fear of exclusion).
          *   *Verdict:* High risk. Needs to shift honor *within* the group, not just external condemnation.
      *   *Case 2: Hospital Bribes.*
          *   *Engine:* Interest/Need (Nurses need pay, Patients need care).
          *   *Audience:* Hidden transaction.
          *   *Exit:* None (structural deficit).
          *   *Verdict:* **NO GO** for a behavior change campaign. This is a structural/payroll issue. A poster won't fix unpaid salaries.
      *   *Case 3: Fundraising Imagery.*
          *   *Engine:* Interest (Donations) + Internal Norms (Dignity).
          *   *Audience:* Donors.
          *   *Williams Check:* **HARD STOP.** This is the "we are the ancients" moment. We are exploiting dignity for funds. The procedure must flag this as *our* behavior needing change, not just a campaign tactic.

  5.  **Refining the "Williams Worry" Integration:**
      *   Where does it bite? It bites when the procedure asks "Is this practice actually bad?" The procedure can't answer that. It can only answer "Can we change it?"
      *   *Correction:* The user wants the procedure to acknowledge that winning $\neq$ right. I need to add a specific "Legitimacy Check" step where the team admits if they are imposing an external framework that might not stick or might cause collateral damage.
      *   *Specifically for Case 3:* This is the perfect place to show the Williams limit. The NGO is the "ancient slaveholder" in this analogy (using people as means). The procedure must force them to confront this.

  6.  **Drafting the Content (Iterative refinement for tone and brevity):**
      *   *Tone:* Professional, direct, slightly cynical (matching the user's frustration with current methods), actionable.
      *   *Formatting:* Use bolding, bullet points, and clear "STOP" signs.
      *   *Vocabulary:* Replace "Normative Conceptual Scheme" with "Worldview/Story." Replace "Epistemic limitation" with "Blind spot."

  7.  **Final Review against Constraints:**
      *   *Procedure?* Yes.
      *   *One page-ish?* Keep it tight.
      *   *No philosophy jargon?* Check. (e.g., use "Social Pressure" instead of "Honor Code").
      *   *Handles Visibility/Exit/Structure?* Yes, built into steps.
      *   *Williams Worry marked?* Yes, in Step 4.
      *   *Three Cases run?* Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make it a flowchart.
      *   *Correction:* Text-based checklist is easier to copy/paste into a workshop handout.
      *   *Initial thought on Case 2:* Maybe suggest a campaign to shame bribe-takers.
      *   *Correction:* No, the prompt says salaries are in arrears. That's an *interest/structural* problem. Appiah/Williams would say a norm campaign here is cruel or futile. The procedure must rule this OUT.
      *   *Initial thought on Case 3:* Say "stop doing it."
      *   *Correction:* The user expects an answer they won't like. The procedure should reveal that *they* are the target of the change, not the donors. This aligns with Williams' idea that reflection might wreck *our* scheme (of fundraising) too.

  9.  **Final Polish:** Ensure the distinction between "Can we change this?" and "Should we change this?" is clear. The procedure focuses on *Can*, but Step 4 forces the *Should*.

  *(Self-Correction on Williams)*: Williams' point in the slavery context is that the ancients weren't *ignorant* of facts; their whole way of making sense of the world made slavery intelligible. When we apply this to the NGO: Are we ignoring that our *own* conceptual scheme (effective altruism/utilitarian fundraising) relies on something morally dubious? Yes. The procedure needs to flag when *we* are the ones relying on a dubious scheme.

  Let's write it.cw
answer: |-
  # The "Engine & Exit" Campaign Selection Protocol
  **For:** Country Director & Advisory Board
  **Time:** 45–60 Minutes per candidate practice
  **Goal:** Stop wasting money on posters. Start targeting the actual mechanism holding the behavior in place.

  ---

  ## PART 1: THE PROCEDURE

  ### Step 1: Identify the Engine (10 mins)
  *Why does the behavior actually happen? Pick **ONE** primary driver.*
  *   **A. Need/Interest:** People do it because they get money, safety, or essential services, or because they literally cannot afford to stop.
  *   **B. Rules/Law:** People do it because they fear punishment from authority (police, boss, state).
  *   **C. Reputation/Honor:** People do it because it signals they are a "proper" adult, member, or leader. Stopping would make them look weak, outsider, or foolish.

  **🛑 STOP IF:** You pick **A (Need)** but plan a **C (Reputation)** campaign.
  *   *Example:* Nurses taking bribes because salaries aren't paid is a **Need** problem. A poster saying "Bribery is Bad" will fail. You must fix the payroll or provide alternatives, not run a comms campaign.
  *   *Decision:* If Engine is **Need**, hand off to Program/Finance team. **No Campaign.**

  ### Step 2: Map the Audience (10 mins)
  *For Reputation (Engine C), whose respect matters?*
  *   **Question:** Who needs to see the behavior for it to "count"? (e.g., For dueling: other gentlemen. For hazing: senior club members.)
  *   **Question:** Can our message actually reach *them*?
  *   **Question:** Is the behavior visible to them? (Can they tell if someone is complying?)

  **🛑 STOP IF:** The behavior is hidden from the Honor Audience.
  *   *Reason:* You cannot shame or praise what nobody sees. If the practice is secret (e.g., domestic abuse behind closed doors), a public honor campaign will not work.
  *   *Decision:* If Invisible, switch to **Safety/Reporting Mechanism**, not Behavior Change.

  ### Step 3: Design the Exit Ramp (15 mins)
  *How do they stop without admitting they were wrong?*
  *   **The Test:** Can a person stop this behavior tomorrow and still keep their status?
  *   **Requirement:** You must offer a new story that allows them to save face.
      *   *Bad:* "Stop hazing because it's cruel." (Implies current members are cruel).
      *   *Good:* "Real leaders build teams through training, not hazing." (Allows them to keep status as "leaders" while changing the act).
  *   **Requirement:** Is there a coordination solution? (If everyone stops, are they safer? If only *they* stop, are they targeted?)

  **🛑 STOP IF:** Stopping creates immediate physical or financial risk for the individual.
  *   *Decision:* **No Campaign.** You cannot ask for martyrdom.

  ### Step 4: The Mirror Check (The Williams Limit) (10 mins)
  *This is where we admit what we don't know.*
  *   **Question 1:** Are we imposing a value from outside that breaks their social world without offering a replacement? (e.g., Destroying a rite of passage without offering a new way to become an adult).
  *   **Question 2:** Are *we* engaging in a questionable practice to stop *them*? (e.g., Violating dignity to save lives).
  *   **Question 3:** If we win, are we sure the result is better, or just different?

  **⚠️ WARNING:** This procedure tells you if you can **WIN**, not if you are **RIGHT**.
  *   If Step 4 reveals we are the ones relying on a dubious moral scheme (e.g., exploiting dignity for funds), the campaign target is **US**, not the community.
  *   *Decision:* If the Mirror Check fails, **Pause.** Escalate to Board Ethics Review. Do not launch.

  ---

  ## PART 2: CASE RUNS

  ### Case 1: University Sports Hazing
  *   **Step 1 (Engine):** **Reputation/Honor.** It's about belonging and hierarchy. Not primarily about money or law. **(PASS)**
  *   **Step 2 (Audience):** **Seniors/Peers.** They see it. It happens in groups. **(PASS)**
  *   **Step 3 (Exit):** **Current Status: FAIL.** Stopping now looks like weakness or betrayal of tradition.
      *   *Fix:* Reframe. "Elite teams train bodies, amateurs break them." Make *stopping* the high-status move. Needs senior buy-in to validate the new exit.
  *   **Step 4 (Mirror):** **Low Risk.** We aren't breaking their economy; we are protecting safety.
  *   **VERDICT:** **GREEN LIGHT (Conditional).** Only if Senior Captains lead the reframe. Do not use external moralizing ("It's wrong"). Use internal status ("Real athletes don't need this").

  ### Case 2: Hospital Cash Gifts (Bribes)
  *   **Step 1 (Engine):** **Need/Interest.** Nurses: Unpaid salaries. Families: Fear of ignored care. This is survival, not status.
  *   **Step 2 (Audience):** **Hidden.** Transactions are whispered.
  *   **Step 3 (Exit):** **None.** If a nurse stops, they starve. If a family stops, their relative suffers.
  *   **Step 4 (Mirror):** **High Risk.** Campaigning against this blames the victim (nurse/patient) for a structural failure (government payroll).
  *   **VERDICT:** **HARD NO.** Do not run a behavior change campaign. This is advocacy for payroll reform or emergency stipends. A poster here is cynical and useless.

  ### Case 3: Our Fundraising Imagery (Dignity vs. Donations)
  *   **Step 1 (Engine):** **Interest (Revenue).** We do it because it works financially.
  *   **Step 2 (Audience):** **Donors.** They see the images.
  *   **Step 3 (Exit):** **Feasible.** We can raise money with dignity-based imagery, though metrics may dip short-term.
  *   **Step 4 (Mirror):** **CRITICAL FAIL.**
      *   *The Williams Worry:* We are judging the "ancients" (locals) for their practices while we engage in a practice (exploitative imagery) that future generations may view as morally bankrupt. We are using human suffering as a tool.
      *   *The Limit:* This procedure shows we *can* change this (we control the photos), but it reveals *we* are the ones needing moral reflection, not the donors.
  *   **VERDICT:** **INTERNAL CAMPAIGN ONLY.** Stop using the photos. Do not launch an external campaign explaining why; just change the practice. If we ask donors for permission, we are asking them to validate our past harm. **Action:** Change policy immediately. Accept the revenue drop as the cost of moral consistency.

  ---

  **Summary for the Workshop:**
  1.  **Don't campaign against Need.** (Fix the structure).
  2.  **Don't campaign against Invisible acts.** (Fix the reporting).
  3.  **Don't campaign without an Exit.** (Fix the story).
  4.  **Check the Mirror.** (Make sure *we* aren't the problem).
