answer: |-
  **Verdict:** She will **reject** the proposal to replace the legislative recess with an algorithmic filter.

  **Two Consistent Rules:**

  1.  **The Principle of Embedded Incubation (Strict Mapping):** An institution cannot be altered unless every latent function (tacit norms, character formation, social binding) is explicitly identified and *replicated within the same institutional framework* prior to alteration. This rule treats the *process* itself as a repository of wisdom that cannot be externalized.
      *   *Prediction:* **Reject.** The "cooling of passion" is not merely a logical output (coherence) but a psychological state cultivated by the *human experience of delay*. An algorithm cannot replicate the *temperament* of patience; it bypasses the human element entirely. Since the tacit wisdom of the recess is bound to the *human passage of time*, it cannot be mapped onto a computational instant.

  2.  **The Principle of Purpose Decoupling (Functional Relocation):** An institution can be altered if its explicit purpose is met more effectively by a new mechanism, provided any latent social roles are either absent or can be *relocated* to other venues in the social ecosystem without loss of function. This rule permits disentanglement if the "spirit" of the institution can survive elsewhere.
      *   *Prediction:* **Accept (Conditional).** A proponent of this rule would argue the explicit purpose (preventing hasty, incoherent laws) is better served by the algorithm. The latent social role (informal diplomacy during the break) is *relocatable* to committee stages or party whips' offices. Since the "cooling" is arguably a function of *outcome* (fewer bad laws) rather than *process* (waiting), the mechanism is expendable.

  **Best Guess and Reasons:**
  She will follow the **Principle of Embedded Incubation**. Her record demonstrates a consistent skepticism of "efficiency gains" when they threaten unarticulated social bonds (Local Arbitration) or character formation (Hereditary Chamber). While she allowed the Guild monopoly to fall (Purpose Decoupling), that was because *no residual social role was visible*. In the case of the recess, the "cooling of passion" is inherently tied to human psychology and the humility of acknowledging that time, not just logic, resolves conflict. To replace human delay with algorithmic speed is to mistake the *metric* of reflection (coherence scores) for the *act* of reflection (patience). This mirrors her defense of the Hereditary Chamber: the selection mechanism (delay/heredity) *was* the virtue, not just the output. The algorithm represents the rationalist hubris she typically resists—attempting to codify wisdom rather than cultivate it.

  **Closest Prior Analog:**
  **The Hereditary Legislative Chamber.**
  In both cases, she defends a mechanism that appears inefficient or irrational (heredity/mandatory delay) on the grounds that it cultivates a distinctive *temperament* (deliberative slowness/cooling of passion) that cannot be achieved through streamlined, meritocratic, or computational means. Both rulings prioritize the *character of the institution* over the *optimization of its output*.

  **The Separating Case:**
  **The Physical Division Lobby (Voting by Walking).**
  Consider a proposal to replace the traditional Westminster practice of MPs physically walking through separate "Aye" and "No" lobbies with an electronic keypad system to save time and reduce counting errors.
  *   **Under Embedded Incubation:** She would **reject** the keypads. The physical act of walking, being seen, and bodily committing to a vote is an embodied ritual that reinforces accountability and gravity. The "inefficiency" is a feature that binds the member to the decision.
  *   **Under Purpose Decoupling:** She would **accept** the keypads. The explicit function is recording the vote accurately. The social role (public accountability) is relocatable to the digital public record. The medium of the vote is irrelevant so long as the result is binding and transparent.
  This case separates the rules because it isolates the *embodied ritual* from the *bureaucratic function*, forcing a choice between the wisdom of the physical act versus the efficiency of the digital record.
