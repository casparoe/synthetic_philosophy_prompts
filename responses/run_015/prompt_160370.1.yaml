answer: |-
  **Title:** The Continuity of Agency: A Defense of Standard Rationality Against the Transformative Objection

  **Abstract:** This essay argues that L.A. Paul's challenge to Expected Utility (EU) theory rests on a category error between epistemic limitation and normative breakdown. By analyzing the "Escalator" thought experiment, I demonstrate that the alleged problem of choosing for a transformed self dissolves under the recognition of psychological continuity. The burden of proof lies on the exceptionalist to demonstrate why EU fails, not on the standard theorist to show how it survives. The verdict is clear: there is no distinctive normative problem of transformative experience, only the ordinary problem of decision-making under extreme uncertainty.

  ***

  L.A. Paul's argument regarding transformative experience is philosophically seductive because it targets a genuine phenomenological anxiety: the fear that in choosing a radically new life, we are choosing blind. When Paul suggests that deciding whether to have a child or become a vampire cannot be modeled by expected utility maximization, she relies on the intuition that the "subjective character" of the outcome is inaccessible to the pre-transformed agent. If you cannot assign a utility value to an experience you cannot imagine, the standard story goes, you cannot maximize expected utility. Consequently, the choice must be reconceived as something else—an act of exploration, or a leap of faith.

  Your students are right to push back. Their intuition that "people make these choices constantly and mostly do fine" is not merely an appeal to common sense; it is an appeal to the robustness of our normative framework. The thesis I defend here is that the "Transformative Experience" problem is an epistemic predicament that ordinary rational resources already handle well enough. There is no genuine, distinctive normative failure here. The burden of argument lies squarely on the claimant who asserts that a formal decision procedure breaks down, not on the defender of the procedure who asserts that it applies to a new, difficult case. Furthermore, the "Escalator" variant does not reproduce the problem in miniature; it dissolves it by revealing that the "one-shot" case relies on a false ontology of the self.

  ### I. The Burden of Argument

  To adjudicate this dispute, we must first locate the burden of proof. Expected Utility theory is a formal framework for choosing under uncertainty. Its core mandate is to select the action that maximizes the sum of utilities weighted by their probabilities. Crucially, EU theory does not require omniscience. It requires *estimates*. When an agent lacks perfect information, they operate with subjective probabilities and expected values based on available proxies (testimony, simulation, analogy).

  Paul's claim is that transformative choices are not just *hard* cases for EU, but *impossible* ones. She argues that because the utility value is epistemically inaccessible, it is normatively inert. This is a strong claim. It asserts a boundary condition for rationality itself. Therefore, the burden of proof lies on Paul to demonstrate why the standard mechanism of *estimation* fails so catastrophically that the normative structure collapses.

  The defender of standard rationality need only show that the agent is still performing a maximization procedure, even if the inputs are noisy. If I choose to have a child based on the testimony of friends, my own desire for connection, and a rough simulation of future joy, I am assigning a subjective expected utility to the outcome. It may be a low-fidelity estimate. I may be wrong. But being wrong is not a failure of rationality; it is a feature of risk. To claim that EU "breaks down" is to conflate the *quality of the input* with the *validity of the function*. Unless Paul can show that the utility value is not merely unknown but *non-existent* for the pre-transformed self, the EU framework remains the correct normative description of the agent's situation. The burden is on the exceptionalist to prove the rupture; the default position is continuity.

  ### II. The Escalator and the Myth of Rupture

  This brings us to the Escalator. In this variant, the transformative procedure is available in eight graded, reversible doses. Each rung offers a partial, time-limited revelation of the next. The question is whether this ladder dissolves the original problem or reproduces it.

  The Escalator dissolves the problem. It does so by attacking the metaphysical premise underlying Paul's original argument: the idea that transformation creates a *discontinuity of agency*. Paul's one-shot case relies on the intuition that the "post-vampire" or "post-parent" is effectively a different person whose preferences the "pre-vampire" cannot access. The Escalator reveals this to be false.

  In the Escalator scenario, the agent at Rung 3 is not a stranger to the agent at Rung 1. They are linked by a chain of memory and psychological continuity. When the agent at Rung 3 decides whether to ascend to Rung 4, they are not choosing for an alien entity; they are choosing for themselves, updated with new data. The "authority" problem you raise—what right Rung 3 has to decide for Rung 6—is a red herring. It is the same authority I exercise when I choose to save money for my retirement or diet for my future health. It is **stewardship**, not tyranny. The self at Rung 3 is not using the self at Rung 6 as a mere instrument; they are the same enduring agent managing a trajectory of preference change.

  The specific feature of the ladder that does the dissolving work is **marginal epistemic feedback**. The ladder converts a metaphysical gap into an epistemic gradient. It allows the agent to update their utility function iteratively. In the one-shot case, Paul assumes this feedback is absent. However, the existence of the Escalator case demonstrates that the "rupture" Paul posits in the one-shot case is a matter of degree, not kind. If rationality holds on the Escalator (and it clearly does; we would not call the Rung 3 agent irrational for choosing based on their Rung 3 preferences), then the "problem" was never about the *nature* of the preference change, but about the *speed* of the information arrival.

  ### III. The One-Shot Case and the Feature of Continuity

  Here we must address the hardest constraint: If the Escalator dissolves the problem via marginal feedback, why doesn't the absence of that feature in the one-shot case reinstate the normative failure?

  The answer is that the absence of feedback increases *risk*, but it does not alter the *normative structure*. The feature that does the work in the Escalator is not the feedback itself, but what the feedback reveals: **psychological continuity**. The Escalator makes the continuity of the self empirically obvious. The one-shot case attempts to hide it behind a veil of suddenness.

  In the ordinary one-shot case (e.g., having a child), the transformation is not actually instantaneous. It is a process that unfolds over time, even if the decision point is discrete. The "feature" of the Escalator that validates rational choice is the **persistence of the deliberative core**. Even in the one-shot case, the agent deciding is the same entity who will experience the outcome, connected by memory and narrative identity. The fact that the agent cannot *phenomenologically preview* the outcome does not mean they cannot *normatively authorize* it.

  When I decide to have a child, I am not maximizing the utility of a stranger. I am maximizing the expected utility of my future self, based on my current values (e.g., "I value nurturing," "I value legacy"). That my future self might value "nurturing" differently than I currently imagine does not mean my current decision is irrational. It means my current decision is fallible. The Escalator shows us that we are always already on a ladder of self-transformation; the "one-shot" is merely a limiting case where the rungs are invisible, not absent.

  Therefore, the feature of the ladder that dissolves the problem is the **demonstration of continuity**. This feature *is* quietly present in the ordinary one-shot case, contrary to Paul's assertion. Paul assumes that without phenomenological knowledge, there is no psychological bridge. The Escalator proves there is a bridge even without full knowledge. Once we accept that the pre- and post-transformed selves are continuous enough to sustain prudential concern (as they must be for the Escalator to make sense), the one-shot case loses its normative bite. The agent at the bottom of the one-shot cliff is still the same person at the top; they just took a bigger step.

  ### IV. The Authority of the Future Self

  You mention the move of handing the decision to a future self via binding pre-commitment, and the worry that this "relocates the puzzle." I reject this characterization. Allowing the future self to decide is not relocating the puzzle; it is **aligning the locus of authority with the locus of experience**.

  If the worry is that the future self's preferences are "shaped by the transformation" and therefore biased, this misunderstands the nature of preference. Preferences are not static truths to be discovered; they are constitutive of the good life. To say the future self is "biased" because they enjoy the vampire experience is to privilege the pre-vampire perspective without justification. Why is the pre-vampire's aversion to blood more "authentic" than the post-vampire's taste for it?

  The Escalator clarifies this. At Rung 3, if I choose to stop, I honor my current preferences. If I choose to ascend to Rung 8, I honor my anticipated future preferences. Both are rational acts of self-governance. The "authority" of the Rung 3 self over the Rung 6 self is justified by the fact that Rung 3 is the current seat of agency. To deny this is to invite paralysis. If the current self cannot choose for the future self because the future self will be different, then *no* intertemporal choice is ever rational. We would be trapped in the present moment. Since we are not trapped, and since we rightly hold agents responsible for their long-term commitments, the normative authority of the current self to bind the future self must hold.

  ### V. Verdict

  The verdict is this: **There is no distinctive normative problem of transformative experience.**

  The burden of argument was on the claim that Expected Utility reasoning gives out. That burden has not been met. Paul successfully identifies an *epistemic* limitation—we cannot know what it is like to be someone else until we are them. But she fails to show why this epistemic limitation entails a *normative* breakdown. Rational choice is not about choosing correctly with certainty; it is about choosing optimally given one's information state.

  The Escalator thought experiment does not reproduce the problem; it exposes the error in the original setup. It shows that the "self" is not a brittle vessel that shatters upon transformation, but a continuous substrate that updates its values. The feature of the Escalator that dissolves the problem is the **visibility of psychological continuity**. This continuity is present in the one-shot case, even if the epistemic feedback is coarser. The lack of phenomenological preview is a risk factor, not a rationality breaker.

  To teach this week otherwise is to grant too much to the intuition of rupture. We should tell our students that the anxiety of transformative choice is real, but it is the anxiety of *risk*, not the anxiety of *irrationality*. We climb the escalator of our lives rung by rung, often without seeing the next step. That does not mean we are choosing blind; it means we are choosing bravely, using the only tools we have: our current values, our best estimates, and our trust in the continuity of the person we are becoming. Expected Utility theory does not break here. It is exactly what we use to build the ladder.
