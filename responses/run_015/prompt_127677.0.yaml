      *   *Also, Premise (1)* implies a "authority over" model. Some ethicists argue it's not authority *over* the later self, but respect for the *precedent autonomy* of the continuous person. I should mention this distinction.
      *   *Make sure to mention Rebecca Dresser.* She is the primary critic of advance directives in dementia who makes exactly this argument. The user's study group has essentially reinvented Dresser's critique. Naming it will help them research further.

