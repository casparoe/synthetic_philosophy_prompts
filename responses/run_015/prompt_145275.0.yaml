      *   Verify the "Soft Spot" honesty.
      *   Make sure the "Tail-Sensitive" definition is respected in the answers.

      *(Self-Correction during drafting)*: I need to make sure I don't give the user *too much* text for the 90-second replies. They need to be punchy. I will provide the *structure* and *key phrases* for the 90 seconds rather than a verbatim script, but detailed enough to be usable. Actually, the prompt asks for "a reply I can deliver in about ninety seconds." I should write it out close to spoken length. ~200 words.

      *(Refining the "Deferral")*: I can't literally say "Ask Reader 2." I need to say "As [Reader 2] has extensively explored..." or "This aligns with [Reader 2]'s work on..." to invite her into the conversation without refusing to answer.

      *(Refining the "Self-Referential")*: This is the "Epimenides" problem. The answer needs to be that the postulate is a *model of the agent*, not a *constraint on the modeler*.

