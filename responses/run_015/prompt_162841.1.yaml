  **Case Study: The Newly Sighted Patient (Section Plan)**

  **Scenario Setup**
  We are in a post-op recovery room. The subject is an adult male, blind from infancy due to dense bilateral cataracts. Surgery was successful; bandages come off in one hour. We are testing within the first 48 hours.

  **Step 1: The Classic Test (Controlled)**
  We place a matte-finish wooden cube and a matte-finish wooden sphere on a neutral gray table. They are identical in volume, weight, and temperature. The lighting is diffuse to eliminate specular highlights. The experimenter stands behind a screen to prevent auditory cues or air displacement.

  *Result:* The patient points to the cube and says "Cube," and the sphere and says "Sphere" on the first trial. No groping, no hesitation.

  *Why this earns the result:* We controlled for inadvertent cues. No sound when placed (soft pads), no heat difference (props stored in room temp), no sheen (matte paint). The success is behavioral fact.

  *Why this is uninformative:* This is where the class stalled last week.
  1.  **Story A (Common Format):** Vision delivers spatial extension directly. The visual experience *is* the spatial experience. He sees the shape because vision and touch share a native spatial format.
  2.  **Story B (Description Matching):** Vision delivers proprietary primitives (edges, shading gradients, disparity). A cognitive mechanism computes an abstract shape description from these primitives ("six faces, right angles") and matches it against the abstract description touch produced ("six faces, right angles").
  *Both stories predict success.* Story A says he sees the space. Story B says he infers the space instantly. The behavior is identical.

  **Step 2: The Probe (Evaluating Your Proposal)**
  You proposed teaching new shapes via Touch, Guided Motor, and Verbal Description, then testing visual recognition.
  *Verdict:* The intuition is sharp, but the design is vulnerable.
  *The Flaw:* You assume "Verbal Description" bypasses sensorimotor systems. It likely doesn't. When a blind subject hears "six square faces at right angles," they often simulate the haptic exploration motorically. If they succeed on the verbal shape, Story B (Description Matching) claims victory, but Story A (Common Format) can argue the subject simply converted words into motor imagery, then into spatial format. The route isn't pure. It conflates "Propositional Knowledge" with "Simulated Experience."

  *The Fix:* We need a probe where the *visual input* changes, not the learning route. We need to break the link between "Visual Primitives" and "Spatial Description" without breaking "Spatial Content."

  **Alternative Probe: The "Transparent Object" Test**
  *Setup:* Before surgery, the patient learns a specific shape by touch: a **solid opaque cube**. They know it as a solid, bounded volume.
  *Test:* After surgery, we present two items in a lineup:
  1.  The original opaque cube.
  2.  A **glass cube** of identical dimensions and geometry.

  *Predictions:*
  *   **Story A (Common Format):** Vision perceives spatial volume directly. Both objects occupy the same spatial volume. The material (opacity vs. transparency) is secondary to the spatial form.
      *   *Prediction:* Patient identifies both as "Cube" immediately.
  *   **Story B (Description Matching):** Vision computes shape descriptions from *proprietary primitives* (surface shading, occlusion, opacity). The opaque cube provides these cues. The glass cube lacks surface shading and occlusion cues (it refracts rather than blocks). The computation module fails to generate the "Solid Object" description from the glass input.
      *   *Prediction:* Patient identifies the opaque cube but fails or hesitates on the glass cube, despite identical geometry.

  **The Check**
  *   **Discriminating Feature:** Reliance on **Surface Cues** vs. **Spatial Structure**. Story B requires specific surface cues to compute the description. Story A requires only spatial structure.
  *   **If Removed:** If we test only the opaque cube, we return to the standard Molyneux setup. Both stories predict success, and the mechanism remains hidden.
  *   **Why it works:** It isolates the *input requirements* of the visual system. If vision needs "surface" to build "shape," transparency breaks the chain. If vision sees "shape" directly, transparency is irrelevant.

  **Objection Handling**
  *   *The Objection:* "But glass cubes look like cubes to us. Surely the primitives are there."
  *   *The Reply:* They look like cubes to *us* because we have years of experience associating refraction patterns with solid volume. The newly sighted patient lacks this association. For Story B, the "primitive" is the raw sensory data (light intensity, edge contrast). Glass scramles these raw data compared to opaque solids.
  *   *Is it Fatal?* A defender of Story B might argue that "disparity" (binocular depth) is sufficient primitive even for glass.
  *   *The Patch:* Test monocularly (one eye covered). This removes disparity. Now the opaque cube relies on shading/occlusion (present), and the glass cube relies on refraction (complex/unknown). If the patient fails the glass cube monocularly but passes the opaque one, Story B is strengthened. Story A must explain why direct spatial perception fails on transparent objects (perhaps arguing transparency obscures spatial boundaries).

  **Conclusion for the Class**
  This case shows that behavioral success in Molyneux-style tests is compatible with multiple cognitive architectures, and we must manipulate the *quality of the visual input*, not just the output, to distinguish between direct spatial perception and inferred description.
