answer: |-
  # The 10-Minute Adjudication Checklist

  Right, here is the procedure. Print this out and keep it with the answer keys. When a team captain comes to you red-faced about another team 'stealing' their move, run through these four questions in order. Do not skip ahead.

  **Time limit:** 10 minutes. If you haven't decided by then, the status quo stands (no penalty).

  ### Step 1: The Written Rule Test
  **Question:** Does the specific action violate a written rule in the event briefing or on the puzzle sheet?
  *   **YES:** **Issue Penalty.** (e.g., 'No electronic devices', 'Do not leave the room'). Stop here.
  *   **NO:** Go to Step 2.

  ### Step 2: The Private Information Test
  **Question:** Did the copying team gain access to information that was physically hidden or intended to be private to the first team?
  *   *Examples:* Looking over a shoulder at answer sheets, hearing a whispered guess, finding a logbook left in a toilet, accessing a password-protected file.
  *   **YES:** **Issue Penalty.** This is espionage, not strategy. The advantage came from breached privacy, not puzzle-solving. Stop here.
  *   **NO:** Go to Step 3.

  ### Step 3: The Scarcity Test
  **Question:** Did the copying team's action deplete a limited resource needed by the first team to use the same strategy?
  *   *Examples:* Taking the only key to a box, using the only phone signal in a basement, physically blocking a view.
  *   **YES:** **Issue Penalty or Restitution.** You must restore the resource or penalise the blocker.
  *   **NO:** Go to Step 4.

  ### Step 4: The 'Fair Game' Declaration
  **Question:** If you have reached here, the move is legal.
  *   **Decision:** **No Penalty.**
  *   **Action:** Explain to the complaining team: *"The method was visible, the resources were unlimited, and no private data was breached. In this event, observation is a valid skill."*
  *   **Values Check:** If the complaining team is still aggrieved, acknowledge that it feels unsporting, but confirm the result stands. You cannot penalise someone for being observant of public facts.

  ***

  ## Applying the Checklist to Your Cases

  Here is how this plays out with the three scenarios you mentioned.

  ### Case 1: The Mirror Trick
  *Team A uses a mirror to bounce light onto a hidden clue. Team B sees this from across the room and does the same.*

  1.  **Written Rule?** No rule against mirrors.
  2.  **Private Info?** No. The light beam and the mirror were visible to anyone in the room.
  3.  **Scarcity?** No. There is enough light for both teams.
  4.  **Verdict:** **No Penalty.**
  5.  **The Hard Pill:** You will probably hate this. Team A did the creative work; Team B just copied. But under this procedure, Team A's reward is the time head-start they gained before Team B noticed. To penalise Team B is to penalise observation, which creates more arguments than it solves.

  ### Case 2: The Division of Labour
  *Team A splits into three pairs to tackle different puzzle strands. Team B notices this structure and copies the workflow.*

  1.  **Written Rule?** No rule against team structures.
  2.  **Private Info?** No. How a team stands and talks is public behaviour.
  3.  **Scarcity?** No. One team organising themselves doesn't stop another from doing so.
  4.  **Verdict:** **No Penalty.**
  5.  **Note:** This is standard competition. If a workflow is that good, it belongs to the game now.

  ### Case 3: The Private Notes
  *Team B accidentally sees Team A's scratchpad where they've written down partial codes.*

  1.  **Written Rule?** Likely falls under 'fair play' or 'cheating' clauses, but let's assume it's vague.
  2.  **Private Info?** **YES.** A scratchpad is private working material, not a public signal. Even if accidental, the advantage gained is from breached privacy.
  3.  **Verdict:** **Penalty.**
  4.  **Action:** Depending on severity, either wipe Team B's progress on that specific puzzle or add a time penalty. It doesn't matter if it was accidental; the advantage was illegitimate.

  ***

  ## Where This Procedure Breaks Down (Be Honest)

  You asked for honesty about where this fails. Here are the cracks in the logic you need to accept before you start.

  **1. The 'Innovation Tax'**
  The procedure protects the *copier* in Case 1 (The Mirror). This disincentivises cleverness. If Team A knows Team B can just watch and copy, Team A might hide their methods, leading to suspicious behaviour and a worse atmosphere. You are trading innovation for enforceability. You cannot fix this on the night; you fix this by changing the rules next season (e.g., 'No observing other teams' working areas').

  **2. The 'Accidental' Loophole**
  In Case 3, if Team B claims they 'just glanced', you have to judge intent. The checklist says 'Private Info = Penalty', but if it was a genuine accident (e.g., Team A held the paper up to the light in a public spot), a harsh penalty feels vindictive. This is where the **Values Check** in Step 4 bleeds into Step 2. You will have to use your judgement on whether Team A was careless with their private info. If they waved it around, it arguably became public.

  **3. Repeated Offences**
  This checklist handles single incidents. It does not handle a team that makes a habit of hovering near others. If a team constantly positions themselves to 'observe public methods', they are gaming the spirit of the rules without breaking the letter. The checklist says 'No Penalty', but your organisers should feel empowered to disqualify for 'behaviour detrimental to the event' if it happens three times. That is a values call, not a logic one.

  **4. The Ten-Minute Limit**
  If the argument goes over ten minutes, the checklist fails. Human emotions don't respect timers. If you haven't agreed by the deadline, you must default to **No Penalty**. It is better to have a slightly unfair result than to delay the entire event for twenty other teams. Tell the complaining team: *"We cannot verify this within the time limit. The result stands. We will review the rules for next time."*

  ## Summary for Organisers

  *   **Private Info Stolen?** Penalty.
  *   **Public Method Copied?** No Penalty.
  *   **Resources Stolen?** Penalty/Restitution.
  *   **Feels Unfair but Legal?** No Penalty. (Swallow the hate).

  Print this. Stick to it. If they argue, point to the paper, not yourselves.
