  **Joint Statement of Adversarial Collaboration: The Ontology and Ethics of Longworld**

  **Context**
  We, the undersigned parties, represent two distinct philosophical approaches to persistent virtual environments. To ensure we are arguing about the same phenomenon, we stipulate the existence of **Longworld**: a continuous, twenty-year online world featuring non-duplicable items, a player-run court system, voluntary participation under operator-controlled Terms of Service (ToS), an unofficial real-money economy, and deep social embeddedness for many users. This document does not resolve our differences but clarifies exactly where they lie and what evidence would bear on them.

  **I. Agreed Claims**
  Both camps affirm the following propositions:

  1.  **Social Significance:** Longworld is not merely a private hobby. For a significant subset of users, it constitutes a primary site of friendship, status, and cooperative achievement. Disruptions here affect real-world well-being.
  2.  **Ontology vs. Ethics:** The question "Are virtual objects real?" is distinct from "Are virtual harms real?" It is logically possible to be a realist about objects but a fictionalist about harm, or vice versa. We agree not to conflate these headlines, though our camps currently correlate them.
  3.  **Limits of Consent:** While players consent to the ToS, including operator banishment, consent does not automatically metaphysically sanitize all actions. A permitted act can still be a wrong, and a ToS clause does not settle whether an object was destroyed or merely altered.
  4.  **The Fiction Analogy:** The analogy between Longworld items and props in a game of make-believe is imperfect. Unlike a stick imagined as a sword, Longworld items have persistent state, non-duplicability, and causal power within the system that exists independent of any single user's imagination at a given moment.
  5.  **Derivative Harms:** Both sides agree that many wrongs in Longworld are derivative. Losing an item sold for real money is a financial loss; harassment causing distress is a psychological harm. The disagreement concerns whether there are *additional* harms or ontological statuses beyond these.
  6.  **Boundary Cases:** We agree that specific cases must be handled consistently. These include: unnoticed deletion (Case 1), walling-in (Case 2), engine migration (Case 3), operator banishment (Case 4), the sealed world (Case 5), and the generality check regarding Monopoly hotels or poker chips (Case 6).

  **II. Disagreements Table**
  The following table outlines our divergent interpretations of the stipulated cases.

  | Issue | Virtual Realist Wording | Derivative-Harm Fictionalist Wording | Type & Note |
  | :--- | :--- | :--- | :--- |
  | **Item Ontology** | Items are dependent artifactual objects constituted by server state plus social practice. They exist distinct from the code itself. | Items are server states licensed by a fiction. They are props for make-believe, not objects with independent existence. | **Substantive.** Disagreement on metaphysical category, not just labels. |
  | **Nature of Harm** | Damaging an item is a harm *in itself* because it destroys a valuable object, regardless of the owner's awareness. | Harm is exhausted by negative effects on persons (distress, lost time, financial loss). No object, no object-harm. | **Substantive.** Disagreement on whether harm requires a sentient victim to experience loss. |
  | **Migration (Case 3)** | If the practice and function persist, the sword survives engine changes. Identity tracks the social artifact, not the bits. | If the underlying data structure changes, the original item ceased to exist. A new fiction is licensed by new code. | **Verbal/Substantive.** Depends on whether "same sword" means functional continuity or numerical identity of data. |
  | **Unnoticed Deletion (Case 1)** | A wrong occurred because the object was destroyed. The victim was harmed even if they never logged in to feel distress. | No wrong occurred beyond the potential risk. Without distress or lost opportunity, there is no genuine harm to person. | **Substantive.** Tests whether harm requires experiential impact. |
  | **Walling-in (Case 2)** | Restricting access to an object is a partial destruction of its utility, harming the object's purpose. | Restricting access is a nuisance to the player. The house remains intact; only the player's options are reduced. | **Substantive.** Disagreement on whether utility is intrinsic to the object or relational to the user. |
  | **Generality (Case 6)** | Longworld items differ from Monopoly hotels because of persistence, non-duplicability, and social embedding. | Longworld items are like poker chips: valuable only because we agree to treat them as such within a closed system. | **Substantive.** Disagreement on the relevant similarity class for virtual items. |

  **III. Cruxes**
  We identify the following specific questions where empirical evidence or further argument could shift positions. We record our predictions in advance.

  **Crux 1: The Unnoticed Victim**
  *   **Sub-question:** Can a person be harmed by an event they never discover and which alters no future experiences?
  *   **Evidence:** Intuition pumps regarding posthumous reputation damage or undiscovered infidelity.
  *   **Predictions:**
      *   *Realist:* Will argue that just as destroying a will before it is read harms the beneficiaries, deleting an item harms the owner regardless of awareness.
      *   *Fictionalist:* Will argue that without experiential impact or lost opportunities, "harm" is merely metaphorical.
      *   *Empirical Check:* Survey data on whether players feel violated upon learning of past, undiscovered deletions compared to never knowing.

  **Crux 2: Avatar-Directed Acts**
  *   **Sub-question:** Do acts directed at an avatar (e.g., simulated sexual contact, harassment) involve a distinctive wrong, or is the wrong exhausted by distress and relational facts?
  *   **Evidence:** Player testimony regarding "virtual assault" vs. " rude behavior."
  *   **Predictions:**
      *   *Realist:* May argue the avatar is an extension of the self; violating its boundaries is a distinctive wrong akin to battery, even if distress is low.
      *   *Fictionalist:* Will argue the wrong is entirely exhausted by the distress caused and the violation of social norms, identical to verbal harassment in a chat room.
      *   *Empirical Check:* Measure willingness-to-accept compensation. If players demand significantly higher compensation for avatar contact than equivalent chat harassment, this suggests a distinctive wrong.

  **Crux 3: The Sealed World (Case 5)**
  *   **Sub-question:** If everyone leaves Longworld forever, but servers run, does wrecking the builds matter?
  *   **Evidence:** Historical preservation norms vs. server cost-benefit analysis.
  *   **Predictions:**
      *   *Realist:* The artifacts remain valuable as historical records of a culture; destroying them is vandalism.
      *   *Fictionalist:* Without a community to sustain the fiction, the objects revert to mere data. Deleting them is like shredding a script after the play closes.
      *   *Empirical Check:* Observe operator behavior and community outcry when legacy servers are wiped vs. when active worlds are wiped.

  **Crux 4: Generality and Consistency**
  *   **Sub-question:** Does the criterion used for Longworld items apply consistently to Monopoly hotels or poker chips?
  *   **Evidence:** Legal treatment of virtual assets vs. game pieces.
  *   **Predictions:**
      *   *Realist:* Will argue Longworld's persistence and non-duplicability create a qualitative break from board games.
      *   *Fictionalist:* Will argue that if Longworld items are property, so are poker chips in a high-stakes game. If chips are not property, neither are swords.
      *   *Constraint:* If a side cannot distinguish Longworld from Monopoly without arbitrariness, their theory fails the generality check.

  **IV. Conclusion**
  We acknowledge that some cruxes may not be settleable by evidence both sides accept as decisive. Specifically, the metaphysical status of dependent artifacts (Crux 1 & 3) may remain a philosophical stalemate. However, by separating the ontology of objects from the ethics of harm, and by committing to these specific predictions, we ensure that future arguments address the actual structure of the disagreement rather than talking past one another. We sign this to commit to these definitions and constraints.
