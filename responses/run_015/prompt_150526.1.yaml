prompt: |-
  In the seminar I help run — an impartiality-and-giving reading group, mostly people with economics or policy backgrounds — a move keeps recurring. Impartial benevolence, it is said, is just prudence scaled up. Within a single life we aggregate constantly: a painful month now against ten comfortable years, a hard decade of training against a career, savings against consumption. Nobody thinks prudential aggregation is illegitimate, and the trade-offs it licenses are exactly the shape of the trade-offs utilitarianism makes between people. So, the argument goes, once you grant that intrapersonal aggregation is rational, there is no principled residue left to the objection from the separateness of persons; that objection is a label for an intuition that has not survived being thought about.

  I want an audit of the analogy, not a verdict on utilitarianism. Please give me:

  1. The mapping, made explicit. A table of correspondences: what plays the role of the temporal stages, of the deliberating planner, of compensation, of the party who bears the total, of prudence's authority, of whatever ties the stages of one life together.

  2. What the source quietly imports into the target. List the properties of a single life across time that the analogy carries over to a population — one locus at which the sum is experienced; one memory that owns both the cost and the benefit; the sacrificing and the compensated party being the same party; aggregation being optional for the agent and unenforceable by others; ex post ratification by the very person who decided. For each, say whether its absence in the interpersonal case actually does work in the separateness objection or is inert decoration.

  3. The disanalogies that matter, separated from the ones that don't. I suspect some candidate disanalogies are beside the point (that bodies are spatially located, that numbers of people are larger) and others carry the whole weight. Say which, and why.

  4. A gradient test I can put to the group. Hold the trade-off fixed and vary only the degree of psychological unification across the parties: one adult human across fifty years; a pair with shared affect and a joint decision procedure; ten thousand people with a standing assembly, joint deliberation, pooled records standing in for shared memory, ex post ratification, and a shared narrative each has internalized as their own; ten thousand strangers. Does the defensibility of aggregation vary monotonically along this gradient? If it does, what is doing the work — a brute fact about separate bodies, or an empirical, degree-valued fact about how unified the parties are? And then the question that matters: does a monotonic answer vindicate the analogy or destroy it, given that the analogy's users need aggregation to be fine at the far end of the gradient? If you think the unity of a single life is itself achieved by deliberative self-constitution rather than given, say what that does to the argument.

  5. Whether the conclusion survives. Does the analogy carry the claim that the separateness objection is dead, or was the analogy doing the work all along? If it fails, propose a better comparison — one that captures whatever is genuinely right about interpersonal aggregation without importing the features you listed in section 2 — and note whether what survives is utilitarianism specifically or something weaker.

  Two constraints: assume no access to libraries or the web, so no citations, reading lists, or appeals to what some author argued; I want the argument, not the literature. And if you use any term of art, define it in a line.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group on impartiality and giving (economics/policy background).
      *   **Core Argument:** "Impartial benevolence is just prudence scaled up." (Intrapersonal aggregation $\rightarrow$ Interpersonal aggregation). The "separateness of persons" objection is dismissed as an intuition that doesn't survive scrutiny.
      *   **Task:** Audit the analogy, not verdict on utilitarianism.
      *   **Constraints:** No citations/literature appeals (argument only). Define terms of art.
      *   **Required Sections:**
          1.  Explicit Mapping (Table).
          2.  Imported Properties (Source $\rightarrow$ Target) & their relevance to the objection.
          3.  Disanalogies (Matter vs. Don't Matter).
          4.  Gradient Test (Psychological Unity) & Implications.
          5.  Conclusion (Does the objection survive? Better comparison?).

  2.  **Deconstruct the Core Argument (Prudence $\rightarrow$ Benevolence):**
      *   *Premise 1:* Intrapersonal trade-offs (suffering now for gain later) are rational and uncontroversial (Prudence).
      *   *Premise 2:* Interpersonal trade-offs (suffering for one, gain for another) are structurally identical to intrapersonal ones.
      *   *Conclusion:* Therefore, interpersonal trade-offs are rational and uncontroversial (Utilitarianism/Impartial Benevolence). The "separateness of persons" is a non-issue.
      *   *Critique Target:* The structural identity claim.

  3.  **Drafting Section 1: The Mapping:**
      *   Need to align the *Intrapersonal Case* (Source) with the *Interpersonal Case* (Target).
      *   *Temporal Stages* $\rightarrow$ *Distinct Persons*.
      *   *Deliberating Planner (Self)* $\rightarrow$ *Social Planner / Benevolent Spectator*.
      *   *Compensation (Later Self benefits)* $\rightarrow$ *Compensation (Other Person benefits)*.
      *   *Party Bearing Total (The Person)* $\rightarrow$ *The Population / Humanity*.
      *   *Prudence's Authority (Rationality of Self-Interest)* $\rightarrow$ *Morality's Authority (Rationality of Impartiality)*.
      *   *Tie (Psychological Continuity/Memory)* $\rightarrow$ *Tie (Shared Humanity/Social Contract?)*.

  4.  **Drafting Section 2: Imported Properties:**
      *   What comes with "One Life" that doesn't automatically come with "Many People"?
      *   *Property 1: Single Locus of Experience.* In one life, pain and pleasure happen to the same "subject." In many people, they happen to different subjects. *Relevance:* High. This is the core of Rawls' objection.
      *   *Property 2: Memory/Ownership.* I remember my pain when I get the gain. Person A doesn't feel Person B's gain. *Relevance:* High. Compensation feels real only if experienced.
      *   *Property 3: Identity of Sacrificer/Beneficiary.* I sacrifice for me. A sacrifices for B. *Relevance:* High. Consent/Ratification differs.
      *   *Property 4: Optional/Unenforceable.* I can choose to save. Can society force A to suffer for B? *Relevance:* High. Coercion issues.
      *   *Property 5: Ex Post Ratification.* Future me thanks past me. Future B doesn't thank A (A is gone/suffering). *Relevance:* High.
      *   *Assessment:* Are these inert? No, they are the *substance* of the separateness objection.

  5.  **Drafting Section 3: Disanalogies:**
      *   *Don't Matter:* Spatial location (bodies apart), Number size (2 vs 7 billion). These are superficial.
      *   *Do Matter:*
          *   *Phenomenal Unity:* Pain and pleasure are co-conscious in one mind; they are not co-conscious across minds.
          *   *Enforceability/Consent:* I can bind myself; I cannot morally bind you without consent.
          *   *Compensation Mechanism:* Intrapersonal compensation is automatic (I get the money). Interpersonal compensation requires transfer and acceptance, and often the sacrificer is excluded from the benefit.
      *   *Why:* The moral weight lies in *who experiences what*, not where their skin is.

  6.  **Drafting Section 4: The Gradient Test:**
      *   *Scenario:* Vary psychological unity.
      *   *Cases:*
          1.  One person (50 years).
          2.  Deeply bonded pair (shared affect/decision).
          3.  Highly integrated group (assembly, pooled records, shared narrative).
          4.  Strangers.
      *   *Question:* Does defensibility vary monotonically?
      *   *Analysis:* Intuitively, yes. We accept sacrifice more easily the more "unified" the group feels (e.g., family vs. strangers).
      *   *Implication:* If it varies monotonically, then *unity* is the doing work, not "personhood" as a binary switch.
      *   *Crucial Turn:* If unity is achieved by *deliberative self-constitution* (we *make* ourselves a unit), then the "single life" is just a high-unity case. But strangers *aren't* that unit. So the analogy fails at the "strangers" end unless we force them into a union (which violates liberty).
      *   *Vindication or Destruction?* It destroys the *strong* analogy. It suggests aggregation is only justified *to the degree* of unity. Since strangers lack unity, full utilitarian aggregation is unjustified.
      *   *Self-Constitution:* If a single life is also constituted (Parfit style), it weakens the "given" authority of prudence, but doesn't help the interpersonal case unless the interpersonal union is also constituted.

  7.  **Drafting Section 5: Conclusion & Better Comparison:**
      *   *Does the objection survive?* Yes. The analogy smuggles in the "single subject" feature which is exactly what is in dispute.
      *   *Better Comparison:* Instead of Prudence (One Self), compare to *Contracting Parties* or *Insurance*.
      *   *Why:* Insurance captures risk-pooling without requiring a single subject. It acknowledges separateness but allows for mutual advantage.
      *   *Result:* This supports a weaker view (Prioritarianism? Sufficientarianism? Contractualism?) rather than strict Act Utilitarianism. It validates aggregation for mutual benefit, not just sum-maximization regardless of distribution.

  8.  **Review and Refine:**
      *   *Check Constraints:* No citations (Rawls, Parfit, Sidgwick names avoided or defined if essential). Define terms (e.g., "Intrapersonal," "Phenomenal Unity").
      *   *Tone:* Analytical, rigorous, suitable for an economics/policy group.
      *   *Formatting:* Clear headings, table for Section 1.
      *   *Self-Correction during drafting:* Make sure I don't just say "Rawls is right." I need to explain *why* the mechanics of the analogy fail. Ensure the "Gradient Test" logic is tight. If unity matters, then strangers aren't a single self, so the analogy breaks.

  9.  **Final Polish:** Check definitions. Ensure "Separateness of Persons" is defined. Ensure "Prudential Aggregation" is defined. (Mental check: The prompt asks to define terms of art in a line).

      *   *Term:* **Prudential Aggregation**: Weighing costs and benefits within a single life over time.
      *   *Term:* **Interpersonal Aggregation**: Weighing costs and benefits across different individuals.
      *   *Term:* **Separateness of Persons**: The claim that distinct individuals have distinct moral standing that prevents treating them as mere vessels for a collective sum.
      *   *Term:* **Phenomenal Unity**: The state of experiences being felt by a single conscious subject.

      *   *Refining the Gradient:* If the answer is monotonic, it implies utilitarianism is only right *if* everyone is psychologically unified. Since they aren't, utilitarianism overreaches.
      *   *Refining the "Better Comparison":* Insurance is good. It handles risk and trade-offs but respects individual boundaries (you pay premiums, you get covered; you don't just lose your arm for someone else's leg without a prior scheme). Or "Joint Venture." Let's go with **Risk-Pooling/Insurance**. It captures the "scaling up" without the "single mind."

  10. **Final Output Generation** (incorporating the above steps).
answer: |-
  ### 1. The Mapping

  The argument claims that **Interpersonal Aggregation** (Target) is structurally identical to **Prudential Aggregation** (Source). Below is the explicit correspondence required for the analogy to hold.

  | Feature | Source: Intrapersonal (Prudence) | Target: Interpersonal (Benevolence) |
  | :--- | :--- | :--- |
  | **Units of Trade-off** | Temporal stages of one life (Time-$t_1$ vs. Time-$t_2$). | Distinct persons (Person-A vs. Person-B). |
  | **Deliberating Agent** | The individual planning their life. | The impartial spectator / social planner. |
  | **Locus of Experience** | A single consciousness persisting through time. | The aggregate population (treated as a single entity). |
  | **Compensation** | Later self enjoys benefits paid for by earlier self's sacrifice. | Beneficiaries enjoy gains paid for by sacrificers' losses. |
  | **Bearer of the Total** | The Person (who owns all stages). | Humanity / Society (treated as a super-person). |
  | **Authority** | Rationality of self-interest (Prudence). | Rationality of impartiality (Morality). |
  | **Binding Glue** | Psychological continuity (memory, intention, character). | Shared humanity / Moral equality (asserted by the analogy). |

  **Term Definition:** **Prudential Aggregation** is the rational practice of weighing costs and benefits within a single life over time. **Interpersonal Aggregation** is the weighing of costs and benefits across different individuals.

  ### 2. Imported Properties

  The analogy works by quietly importing features of the "Single Life" into the "Population." If these features are absent in the target, the analogy may fail.

  1.  **Single Locus of Experience (Phenomenal Unity)**
      *   *Import:* In the source, pain and pleasure are felt by the same "mind." In the target, they are felt by different minds.
      *   *Relevance:* **Critical.** The separateness objection rests on this. If no single subject experiences the *net* gain, the "gain" is an abstraction, not an experience. This is not inert; it is the core of the objection.
  2.  **Memory and Ownership**
      *   *Import:* In the source, the beneficiary remembers the sacrifice and owns the narrative of "it was worth it." In the target, the beneficiary often does not know, cannot feel, or cannot validate the sacrificer's loss.
      *   *Relevance:* **Critical.** Without shared memory, "compensation" is merely a transfer, not a reconciliation within a life.
  3.  **Identity of Sacrificer and Beneficiary**
      *   *Import:* In the source, the party paying the cost and the party reaping the reward are numerically identical. In the target, they are distinct.
      *   *Relevance:* **Critical.** This changes the moral geometry from *investment* to *extraction*.
  4.  **Volition and Enforceability**
      *   *Import:* In the source, the agent chooses the sacrifice for themselves. In the target, a planner often imposes the sacrifice on one for the sake of another.
      *   *Relevance:* **Critical.** Prudence is autonomous; benevolence scaled up often implies heteronomy (being ruled by another).
  5.  **Ex Post Ratification**
      *   *Import:* In the source, the future self can validate the past self's decision. In the target, the sacrificer may be dead, harmed beyond repair, or dissenting.
      *   *Relevance:* **Critical.** This determines whether the trade-off is a successful *plan* or a mere *calculation*.

  ### 3. Disanalogies: Matter vs. Don't Matter

  **Disanalogies That Don't Matter (Surface Features)**
  *   **Spatial Location:** That bodies are in different places is irrelevant. If two minds were in one body but distinct, the objection would still hold.
  *   **Numerical Scale:** That there are billions of people vs. 50 years of stages is not the issue. The objection applies to a trade-off between two people just as much as two billion.
  *   **Biological Continuity:** That cells regenerate over time but don't cross between people is biological noise. The moral question is about *experience*, not tissue.

  **Disanalogies That Matter (Structural Features)**
  *   **Phenomenal Boundaries:**
      *   *Why:* Pain is essentially subjective. My headache cannot be "balanced" by your pleasure in a way that eliminates the negative quality of the headache. Intrapersonally, the headache is *mine* and the pleasure is *mine*, allowing a net assessment. Interpersonally, the negative quality remains isolated in one subject. This carries the whole weight of the separateness objection.
  *   **Consent and Authority:**
      *   *Why:* I have authority over my future selves (arguably). I do not have authority over you. The move from prudence to benevolence assumes a "Social Planner" has the same rights over citizens that an individual has over their own life stages. This is the political leap the analogy hides.
  *   **The Nature of Compensation:**
      *   *Why:* Intrapersonal compensation is automatic (I get the savings). Interpersonal compensation requires transfer and is often impossible (you cannot compensate a dead person, or someone whose rights were violated, in a way that negates the violation).

  ### 4. The Gradient Test

  **The Setup:** Hold the trade-off fixed (e.g., one party suffers 10 units, another gains 15). Vary only the **Psychological/Decisional Unity**.

  1.  **One Adult (50 years):** High unity. Aggregation widely accepted.
  2.  **Bonded Pair (Shared affect/joint decision):** High unity. Aggregation feels acceptable (e.g., spouses).
  3.  **Integrated Group (10k people, shared assembly, pooled records, shared narrative):** Medium-High unity. Aggregation feels plausible (e.g., a cooperative, a regiment, a cult).
  4.  **Strangers (10k people, no shared deliberation/narrative):** Low unity. Aggregation feels suspect (e.g., sacrificing one for many).

  **The Result:**
  Defensibility varies **monotonically**. As psychological and decisional unity decreases, the intuitive permission to aggregate weakens.

  **What is Doing the Work?**
  It is not a brute fact about separate bodies (skin boundaries). It is an empirical, degree-valued fact about **relational unity** (shared memory, joint deliberation, mutual identification).

  **Vindication or Destruction?**
  This **destroys** the analogy as used by the utilitarian.
  *   *Reasoning:* The utilitarian wants aggregation to be valid at the far end of the gradient (Strangers). But the test shows aggregation is only defensible where unity exists.
  *   *Implication:* If the "Single Life" is just the extreme end of this unity gradient, then Interpersonal Aggregation is only justified *to the extent* that people constitute a unified group. Since strangers do not constitute a unified group, the "Prudence Scaled Up" argument fails for general utilitarianism.
  *   *Self-Constitution:* If a single life is achieved by **deliberative self-constitution** (I make myself a unity by caring about my future), then prudence is not a given fact but an achievement. If so, interpersonal aggregation requires **interpersonal self-constitution** (a social contract or shared project). Without that active constitution, the authority to aggregate is missing. The analogy proves that without a "We," there is no justification for treating us as "One."

  ### 5. Conclusion and Better Comparison

  **Does the Conclusion Survive?**
  No. The analogy does not prove the separateness objection is dead; rather, the analogy *depends* on ignoring the separateness of persons to work. It smuggles the "Single Locus of Experience" from the source into the target. When that feature is removed, the justification for aggregation collapses. The "Separateness of Persons" is not a label for a confused intuition; it is a description of the lack of phenomenal unity and shared authority.

  **A Better Comparison:**
  Do not compare **Interpersonal Aggregation** to **Prudence**.
  Compare **Interpersonal Aggregation** to **Insurance / Risk-Pooling**.

  *   **Why:** Insurance acknowledges separateness. Distinct individuals pay premiums into a pool to protect against distinct misfortunes.
  *   **Captures the Right Intuition:** It allows for trade-offs and impartiality (the pool helps the unlucky, funded by the lucky) without requiring a single subject.
  *   **Avoids the Imported Properties:** It does not require a single locus of experience. It does not require the sacrificer to be the beneficiary. It relies on *ex ante* consent (joining the scheme) rather than *ex post* imposition.
  *   **Resulting View:** This supports a weaker view than Utilitarianism. It justifies **mutual advantage** and **risk mitigation**, but it does not justify sacrificing one person for the greater sum if that person did not consent to the "pool" or if the sacrifice violates the terms of the insurance (e.g., basic rights). It points toward **Contractualism** or **Prioritarianism** rather than strict Sum-Utilitarianism.

  **Term Definition:** **Separateness of Persons** is the claim that distinct individuals have distinct moral standing that prevents treating them as mere vessels for a collective sum. **Phenomenal Unity** is the state of experiences being felt by a single conscious subject.
