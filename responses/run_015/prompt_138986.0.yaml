answer: |-
  Here is a ten-question diagnostic instrument designed for your group. It avoids theoretical jargon and focuses on operational judgments in concrete scenarios. Following the quiz, you will find a scoring key to tabulate results, followed by the technical notes on calibration and instrument limitations you requested.

  ***

  # The Distribution Diagnostic: Ten Cases

  **Instructions:** For each scenario, select the **one** option that best matches your intuition about what justice requires. Do not overthink; mark your first instinct.

  **1. The Metabolic Variation**
  Two neighbours receive identical monthly food vouchers from a social program. Neighbour A has a standard metabolism. Neighbour B has a documented medical condition causing a basal metabolic rate 40% above the mean. To maintain the same physical health and energy levels, B requires significantly more food.
  *   **A.** The vouchers should remain equal; fairness is about the value of the voucher, not the biological outcome.
  *   **B.** Neighbour B should receive extra vouchers to ensure they achieve the same physical health status as A.
  *   **C.** We should check if B can trade the vouchers for cash to buy more calorie-dense food, but no extra entitlement is owed.

  **2. The Expensive Taste (Involuntary)**
  Patient X developed a severe sensitivity to cheap ingredients as a side effect of life-saving medication. They now suffer physical pain unless they eat organic food, which costs double. Patient Y grew up poor but cultivated a taste for organic food to feel refined; they suffer psychological distress unless they eat it.
  *   **A.** Both should receive a subsidy for the extra cost; distress is distress, regardless of origin.
  *   **B.** Only Patient X should be compensated; Patient Y is responsible for their own preferences.
  *   **C.** Neither should be compensated; the state provides standard nutrition, not preference satisfaction.

  **3. The Phobic Citizen**
  A town council meeting is physically accessible (ramps, seating). Citizen P has a severe, diagnosed agoraphobia. They *could* physically enter the room without assistance, but panic prevents them from doing so. They feel excluded from civic life.
  *   **A.** The town has done its duty; the opportunity to attend was provided equally.
  *   **B.** The town should provide a therapist or support worker to enable P to attend.
  *   **C.** The town should allow P to vote or speak remotely to ensure the *function* of participation is met.

  **4. The Miserable and the Content**
  Two people have identical incomes and health. Person M is naturally melancholic and finds little joy in anything. Person C is naturally cheerful and is delighted by small pleasures. M is significantly less happy than C.
  *   **A.** Transfer resources from C to M until their happiness levels are roughly equal.
  *   **B.** Do not transfer; C should not be penalized for being easy to please, nor M rewarded for being hard to please.
  *   **C.** Transfer only if M falls below a minimum threshold of decency, regardless of C's happiness.

  **5. The Positional Ambition**
  Musician T is highly skilled but distressed because they are not the *best* trumpet player in the region. Musician S is less skilled but content being in the top 10%. T's distress is genuine suffering.
  *   **A.** Society should try to elevate T's skill or status to relieve the suffering.
  *   **B.** Society should ignore this; one person's goal to be "better than others" cannot be satisfied for everyone.
  *   **C.** Society should compensate T for the distress, even if they remain second-best.

  **6. The Life Span Trade-off**
  Consider two completed lives. Life A lasts 50 years, lived at a very high intensity of engagement and joy. Life B lasts 100 years, lived at a mild, steady level of contentment. The *total sum* of joy/experience is mathematically identical in both.
  *   **A.** It does not matter; the total good is what counts.
  *   **B.** Life B is better; a longer existence is preferable even at lower intensity.
  *   **C.** Life A is better; the density of experience matters more than duration.

  **7. The Trajectory of Welfare**
  Person X has a wonderful youth and a miserable, impoverished old age. Person Y has a miserable, impoverished youth and a wonderful old age. The total sum of welfare over their lives is identical.
  *   **A.** It does not matter; a life is a life, the sum is what counts.
  *   **B.** Person X is worse off; we should prioritize relieving the misery of the old age.
  *   **C.** Person Y is worse off; starting with misery casts a shadow over the whole life.

  **8. The Wheelchair and the Steps**
  A public building has steps at the entrance. Person W uses a wheelchair. Person A walks. Both have the same income. To enter, W needs a ramp (costly public work) or a taxi voucher (costly private subsidy). A walks in for free.
  *   **A.** Install the ramp; the building must be accessible to all citizens equally.
  *   **B.** Provide W with a taxi voucher equivalent to the cost of the ramp; resources should be equal.
  *   **C.** Do nothing; W's need is special, and general funds shouldn't cover specific disabilities.

  **9. The Bad Luck vs. Bad Bet**
  Person D loses their home to a sudden, unpredictable flood. Person G loses their home investing in a risky stock market scheme they were warned about. Both are now homeless.
  *   **A.** Both receive identical emergency housing assistance; need is need.
  *   **B.** Person D receives priority or better assistance; Person G took a calculated risk.
  *   **C.** Both receive only a minimal safety net sufficient to prevent starvation, nothing more.

  **10. The Surplus Above the Minimum**
  Everyone in a society has enough income to be well-fed, housed, and educated (a "decent minimum"). However, the richest 10% have ten times as much as the rest, creating social hierarchy.
  *   **A.** Redistribute the surplus to narrow the gap, even if everyone is already "decent."
  *   **B.** Do not redistribute; once everyone is above the minimum, inequality is not unjust.
  *   **C.** Tax the rich only if it improves the absolute position of the poor, not to reduce the gap itself.

  ***

  # Scoring Key

  Tally your answers in the columns below. Do not skip questions.

  | Question | **Col 1: Strict Welfarist** | **Col 2: Resourcist / Means** | **Col 3: Capability / Freedom** | **Col 4: Luck / Responsibility** | **Col 5: Non-Egalitarian / Threshold** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **1. Metabolism** | B | A | B | - | - |
  | **2. Taste** | A | C | - | B | C |
  | **3. Phobia** | - | A | C | - | - |
  | **4. Miserable** | A | B | - | - | C |
  | **5. Positional** | A/C | B | - | - | - |
  | **6. Span** | A | - | - | - | B (Prioritarian) |
  | **7. Trajectory** | A | - | - | - | B (Prioritarian) |
  | **8. Wheelchair** | - | B | A | - | C |
  | **9. Bad Luck** | A | - | - | B | C |
  | **10. Surplus** | A | - | - | - | B (Sufficientarian) |
  | **TOTAL** | **\_\_\_\_\_** | **\_\_\_\_\_** | **\_\_\_\_\_** | **\_\_\_\_\_** | **\_\_\_\_\_** |

  *Note: Some questions discriminate between specific pairs. A high score in Col 1 indicates a focus on subjective outcomes. Col 2 indicates a focus on objective means. Col 3 focuses on effective freedom. Col 4 introduces responsibility. Col 5 rejects strict equality for thresholds or priority.*

  **Interpretation:**
  *   **Dominant Col 1:** You are a **Welfarist**. You believe justice is about equalizing subjective states (happiness, welfare).
  *   **Dominant Col 2:** You are a **Resourcist** (Rawls/Dworkin). You believe justice is about equalizing the means to live, leaving outcomes to individuals.
  *   **Dominant Col 3:** You are a **Capability Theorist** (Sen/Nussbaum). You believe justice is about ensuring people have the effective freedom to function.
  *   **Dominant Col 4:** You are a **Luck Egalitarian**. You support equality only when inequalities are not the result of responsible choice.
  *   **Dominant Col 5:** You are a **Sufficientarian or Prioritarian**. You care about the poor, but not necessarily about equality itself.
  *   **Mixed/No Dominant:** You are likely a **Pluralist**, or your intuitions shift depending on the context (which is philosophically respectable).

  ***

  # Technical Notes for the Lab Group

  ### 1. The Calibration Problem (Zeros and Units)
  You raised a point that would stop any experiment cold: *How do we calibrate the instrument?* In physiology, you cannot compare membrane potentials across two cells unless you have established a common zero (ground) and a common unit (mV). In distributive justice, this is the problem of **Interpersonal Comparison of Utility**.

  *   **The Welfarist Instrument:** This view suffers the most from calibration error. There is no objective "zero" for welfare (is it death? neutrality?) and no standard "unit" (is my joy equal to yours?). Welfarists often assume a "standard human response curve" that doesn't exist. If Miriam advocates Capabilities, she faces a similar weighting problem: How many units of "Affiliation" equal one unit of "Health"? Without a weighting formula, the index is uncalibrated.
  *   **The Resourcist Instrument:** This view attempts to solve calibration by using **currency** as the unit and **ownership** as the zero. Money is fungible and measurable. However, as your metabolism case (Q1) shows, currency has different "conversion factors" for different people. It calibrates the *input* perfectly but ignores the *output* variance.
  *   **The Standard Move:** The philosophical "dissolve" for this is **Reflective Equilibrium**. Instead of fixing the zero and unit *a priori* (like a voltmeter), ethicists adjust the definitions until they match our considered judgments on specific cases (like this quiz).
  *   **The Scientist's Critique:** You are right to be suspicious. A measurement system that relies on "what we feel is right" to calibrate the instrument is circular. The Resourcist view is the only one that offers a truly operationalizable metric (price), which is why it dominates policy, even if it fails the "metabolism test." The Capability view admits the calibration problem is political, not scientific—the "weights" are decided by democratic deliberation, not lab measurement.

  ### 2. Incoherent and Unexplored Combinations
  *   **The "Expensive Taste" Contradiction:** If a participant selects **1B** (Compensate Metabolism) but **2C** (Do Not Compensate Involuntary Taste), their position is likely **incoherent**. Both are cases of high conversion costs due to factors outside control. Defending one while rejecting the other usually implies an unexamined bias against "psychological" needs vs "physical" ones.
  *   **The Paternalist Trap:** Selecting **3C** (Force/Ensure Participation) combined with **4B** (No Transfer for Miserable) is **unattractive**. It implies the state should force you to function (go to the meeting) but not help you enjoy it (cheer you up). This is "Functioning Equality" without Welfare, which borders on authoritarianism.
  *   **Unexplored Territory:** Very few defend **Strict Equality of Functioning** (everyone must *actually* do the same things). Most agree we should equalize the *opportunity* to function (Capability), not the functioning itself. If anyone in your group argues we should force the phobic person to attend to make the numbers equal, they are defending a position largely abandoned in modern literature.

  ### 3. Instrument Bluntness (Where the Quiz Cannot Separate)
  *   **Prioritarianism vs. Egalitarianism:** This quiz cannot cleanly separate **Col 1 (Welfarist Egalitarian)** from **Col 5 (Prioritarian)** in all cases. Both will choose to help the miserable person (Q4) and the flood victim (Q9). The difference only appears in "Leveling Down" cases (e.g., "If we can't help the poor, should we blind the rich just to make them equal?"). An Egalitarian says "Yes, equality is good in itself." A Prioritarian says "No, equality is only good if it helps the worse off." This quiz lacks a "Leveling Down" question because it tends to alienate non-philosophers.
  *   **Capability vs. Opportunity-for-Welfare:** In practice, **Col 3 (Capability)** and a sophisticated **Col 1 (Opportunity Welfarist)** often yield the same answers on paper. Both care about what people *can* do, not just what they *have*. The distinction is metaphysical (is the good internal or external?) rather than operational. If Dave and Miriam keep scoring similarly, tell them their instruments are measuring the same signal through different transducers.

  **Final Advice:** If the group splits between Resourcists (Dave) and Capabilities (Miriam), check Q1 and Q8. That is the fault line. If they split between Welfarists and Luck Egalitarians, check Q2 and Q4. That is where the "responsibility" fuse blows.
