  2.  **Drafting the Questions (Iterative Process):**
      *   *Goal:* Map answers to specific theoretical commitments.
      *   *Q1 (Metabolism):* Tests Resources vs. Welfare vs. Capability.
          *   Scenario: Two people, same food budget. One burns calories faster naturally.
