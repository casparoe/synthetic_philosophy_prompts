          3.  Deliver a "Residue Report": What survives intact? What survives with distortion? What has no counterpart?
          4.  Address the Epistemic/Ontic distinction vs. Logical/Physical schema distinction.
          5.  Address the "Reality of Unobservables" vs. "External Designer/Storage Layer."
          6.  Conclude on whether the translation failure reveals a vocabulary gap or philosophical fluff.

  2.  **Deconstruct Structural Realism (Philosophy Side):**
      *   *ESR (Worrall):* We can't know the *nature* of entities (electrons, ether), but we *can* know the *structure* (equations, relations) because structure is preserved across theory change (Fresnel -> Maxwell).
      *   *OSR (Ladyman/Ross):* There *are* no entities underlying the structure. Structure is all there is. Objects are just nodes/positions in a structure.
      *   *Ramsey Sentences:* Replace theoretical terms with existentially quantified variables. "There exists *something* that satisfies these relations." Keeps structure, drops specific nature.
      *   *The Problem:* What *is* the structure *of*? (The "No Miracles" argument vs. the "Pessimistic Meta-Induction").

  3.  **Map to Database Architecture (DB Side):**
      *   *Theory Change:* Schema Migration / Versioning.
      *   *Entities/Objects:* Rows/Tuples in tables.
      *   *Properties/Attributes:* Columns.
      *   *Relations/Structure:* Foreign Keys, Join Paths, Constraints, Normal Forms.
      *   *Observables:* Data in the tables (queryable results).
      *   *Unobservables:* Internal storage mechanisms, physical pointers, or perhaps the "meaning" of the data vs. the data itself.
      *   *Ramsey Sentence:* A View definition without exposing the base tables.
      *   *ESR:* We keep the FK constraints and Join topology during migration, even if we rename tables or change data types.
      *   *OSR:* There are no "rows" independent of the relationships. A row is just a unique key defined by its FKs. (This is tricky in RDBMS because rows usually have intrinsic IDs).
      *   *Logical vs. Physical:* Logical = Structure/Schema, Physical = Storage/Bytes.

  4.  **Drafting the Mapping (Iterative Process):**

      *   *Fresnel-Maxwell (Theory Continuity):* This is like a Schema Migration.
          *   *Old Schema:* `Ether_Table` with columns `density`, `velocity`.
          *   *New Schema:* `EM_Field_Table` with columns `E_vector`, `B_vector`.
          *   *Continuity:* The *queries* (predictions) that join these tables to `Observation_Table` yield the same results in the limit. The *Join Topology* (the mathematical structure) is preserved even if the table names (ontological labels) change.
          *   *Distortion:* In DBs, we usually know *why* we changed the schema. In science, the change is often revolutionary and the "why" is disputed.

      *   *Ramsey Sentences:* This is like a `VIEW`.
          *   *Concept:* `CREATE VIEW Theory_Output AS SELECT ... FROM Base_Tables`.
          *   *Mapping:* The Ramsey sentence says "There exists a schema such that..." The View hides the base tables (the intrinsic nature). You interact with the View (the structure/relations).
          *   *Distortion:* A View depends on base tables. A Ramsey sentence tries to eliminate commitment to the base "things" entirely, leaving only the existential quantifier.

      *   *OSR (Objects = Nodes):* This is like Normalization/Referential Integrity.
          *   *Concept:* In 5NF, you eliminate redundancy. An "object" is just a intersection of relationships.
          *   *Mapping:* A row in a junction table has no meaning outside its FKs. OSR says *all* objects are like junction table rows.
          *   *Distortion:* RDBMS usually assumes a Primary Key (intrinsic identity). OSR denies intrinsic identity. To map OSR, we need a schema where PKs are purely composite of FKs (association tables only).

  5.  **Developing the Residue Report:**
      *   *Survives Intact:* The idea of structure preservation (FK constraints) across versioning. The idea of hiding implementation details (Views/Logical-Physical).
      *   *Survives with Distortion:* The Ramsey Sentence (Views still imply underlying tables). OSR (DBs rely on distinct tuples/rows, OSR denies distinct "things").
      *   *No Counterpart:* The "World" itself. A database is always *about* something external. Structural Realism asks if the structure *is* the world. DBs assume a world *outside* the DB.
