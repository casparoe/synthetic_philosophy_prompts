      *   **User's Lens:** Relational Database Architecture (RDBMS). Specific concepts mentioned: Normalization (1NF-5NF), Foreign Keys (FK), Referential Integrity, Views (Materialized/Virtual), Schema Migration, Data Lineage, Slowly Changing Dimensions (SCD Type 2), Logical vs. Physical Schema, ETL, Join Relations.
