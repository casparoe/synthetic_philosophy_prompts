  Before I read any more about whether death is bad for you, I want to know what I should be asking of a theory on this. Write the desiderata: what any adequate account of the badness (or non-badness) of death has to deliver -- which cases it must get right (the asymmetry with pre-natal non-existence, the no-subject problem, the case of a life that would have been miserable), which puzzles it must dissolve or explain, which distinctions it must respect -- with the case behind each, and flag any pair of desiderata you suspect cant be jointly satisfied. Then, briefly, how the Epicurean no-harm view, the deprivation account, and the counterfactual comparison view do against the list. Think very carefully before answering, and respond in the style of an expert philosopher of death.
