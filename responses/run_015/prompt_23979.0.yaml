      *   *Desideratum 2: The Asymmetry Constraint.* It must explain why we treat death differently from birth (Lucretius' symmetry challenge).
      *   *Desideratum 3: The Valence Constraint (Miserable Life).* It must allow that death is *not* bad (or is good) when the alternative life is net negative.
      *   *Desideratum 4: The Timing Constraint.* It should offer a plausible answer to *when* the harm occurs (at death? after? eternally?).
