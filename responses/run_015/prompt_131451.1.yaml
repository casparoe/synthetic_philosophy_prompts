answer: |-
  Here is the coding procedure, the test run, and the evaluation of where the theory breaks against the footage.

  ### Part 1: The Revised Tag Set
  Your original tags are theoretically precise but operationally invisible to an undergraduate with 20 minutes of training. We need tags that map to *observable features* while preserving the theoretical distinctions you care about.

  **New Tag Set:**
  1.  **Cue (Incidental):** Informative trait/behavior, but no evidence of design for reception (e.g., footprints, breathing sound, breaking twigs).
  2.  **Signal-Index:** Reliability secured by physical constraint. A low-quality individual *physically cannot* produce this (e.g., low-frequency call from small body).
  3.  **Signal-Handicap-Static:** Reliability secured by sunk cost. Trait is grown/maintained (e.g., antlers, plumage). Cost was paid earlier; cannot be dialed up/down in the clip.
  4.  **Signal-Handicap-Dynamic:** Reliability secured by variable cost. Behavior is performed now (e.g., stotting, calling rate). Cost is paid per unit; can be dialed up/down.
  5.  **Uncodeable-Mechanism:** Signal is clear, but we cannot distinguish Index from Handicap, or Static from Dynamic, based on footage alone.
  6.  **Uncodeable-Cost:** Signal is clear, but no receiver or threat is visible to validate the cost (the "empty stage" problem).

  ### Part 2: The Decision Tree (Procedure)
  *Time limit: 3 minutes per clip. If you hit "Uncodeable," stop and tag.*

  **Step 1: Signal vs. Cue**
  *   **Question:** Does the trait/behavior appear exaggerated, repetitive, or oriented toward a potential audience, rather than being a mechanical byproduct of living?
  *   **Yes:** Go to Step 2.
  *   **No:** Tag **Cue**. (Example: The sound of an animal walking through dry leaves).
  *   **Unsure:** Tag **Uncodeable-Mechanism**.

  **Step 2: Index Check (Physical Constraint)**
  *   **Question:** Is the signal's reliability guaranteed by physics or anatomy such that a lower-quality individual *could not* produce it, regardless of motivation? (Requires codebook examples: e.g., "Deep pitch = Large vocal cords").
  *   **Yes:** Tag **Signal-Index**. (Stop. Even if it is also costly, the physics secures the honesty).
  *   **No:** Go to Step 3.
  *   **Unsure:** (e.g., You don't know the biomechanics): Tag **Uncodeable-Mechanism**.

  **Step 3: Timing of Cost (Static vs. Dynamic)**
  *   **Question:** Was the cost paid *before* this clip started (growth/maintenance), or is it being paid *during* this clip (energy/risk)?
  *   **Mostly Before (Morphology):** Tag **Signal-Handicap-Static**.
  *   **Mostly During (Behavior):** Tag **Signal-Handicap-Dynamic**.
  *   **Mixed:** (e.g., Displaying a static trait dynamically): Tag **Uncodeable-Mechanism** (Hand to expert).

  **Step 4: Validation of Cost (The Receiver Problem)**
  *   **Question:** Is a receiver (mate, rival, predator) visible, or is the environmental risk (e.g., open ground, loud noise in quiet forest) obvious in the clip?
  *   **Yes:** Keep the tag from Step 3. Add flag: **Cost-Context-Visible**.
  *   **No:** (Empty frame, no predator, no rival): Change tag to **Uncodeable-Cost**.
      *   *Reason:* Without a receiver or threat, "cost" is theoretical. We cannot confirm the handicap is enforced.

  **Step 5: The Differential Check (Expert Override Only)**
  *   *Undergrads do not attempt this.* This step is for you.
  *   **Question:** Is there visible variation in individual quality (e.g., limp, size difference) correlated with signal intensity?
  *   **Yes:** This is the only observational evidence for *marginal differential cost*.
  *   **No:** The "Costly Signal" claim remains an assumption, not an observation.

  ---

  ### Part 3: Test Run on Archive Clips

  **Clip 1: Gazelle stotting, no predator in frame.**
  *   **Step 1 (Signal/Cue):** Behavior is exaggerated, bouncy, clearly designed for reception. **Signal.**
  *   **Step 2 (Index):** Can a weak gazelle stot? Yes. Physics does not prevent faking. **Not Index.**
  *   **Step 3 (Timing):** Behavior is happening now. Energy is being expended per jump. **Handicap-Dynamic.**
  *   **Step 4 (Validation):** No predator visible. No rival visible. We assume a predator *might* be watching, or the herd is watching, but the cost (predation risk) is not contextualized in the footage.
  *   **Final Tag:** **Uncodeable-Cost.**
  *   **Note for Expert:** To defend Zahavi here, you need to assume the predator is *just* off-camera. The critic is right: without the receiver, the cost is hypothetical. This clip supports "Signaling," but not "Costly Signaling" empirically.

  **Clip 2: Nestling birds begging (audio + video).**
  *   **Step 1 (Signal/Cue):** Gaping and vocalizing are oriented at parents. **Signal.**
  *   **Step 2 (Index):** Can a satiated chick beg? Yes. **Not Index.**
  *   **Step 3 (Timing):** Behavior is happening now. **Handicap-Dynamic.**
  *   **Step 4 (Validation):** Parents are usually present (receiver visible). However, the *cost* is often argued to be predation risk (audio attracts predators) or metabolic exhaustion.
  *   **Complication:** You noted "Cost borne by somebody other than the signaller" (parental provisioning). The chick's signal costs the *parent* energy. The chick's cost is only risk/exhaustion.
  *   **Final Tag:** **Signal-Handicap-Dynamic** (with flag: **Third-Party-Cost-Potential**).
  *   **Note for Expert:** This is the "model case" that often fails your criteria. The chick's signal is cheap for the chick (metabolically) but expensive for the parent. If the honesty relies on the *chick's* cost, it's weak. If it relies on the *parent's* response cost, it's a different model. The footage shows the signal, but not the differential cost between a hungry and full chick (unless you measure duration/intensity against known mass, which you don't have).

  **Clip 3: Male frog advertisement call (pitch tracks size, calling is expensive).**
  *   **Step 1 (Signal/Cue):** Advertisement call. **Signal.**
  *   **Step 2 (Index):** Pitch tracks body size. Small frog *cannot* make deep sound. **Signal-Index.**
  *   **Step 3 (Timing):** Call rate/duration is dynamic (Handicap), but pitch is static (Index).
  *   **Step 4 (Validation):** Predators (bats/flies) often attracted to calls.
  *   **Final Tag:** **Signal-Index** (Priority given to the physical constraint on pitch).
  *   **Note for Expert:** This is the hybrid case. The *pitch* is an Index (unfakeable). The *call rate* is a Handicap-Dynamic (can be faked, but costly). Your procedure forces a choice. I recommend tagging the dominant reliability mechanism. If the females choose on pitch, it's Index. If they choose on rate, it's Handicap. Without behavioral response data, tag **Uncodeable-Mechanism** and let you decide based on species literature.

  ---

  ### Part 4: Evaluation of the Procedure

  You asked which distinctions are load-bearing and which will misfire. Here is the straight assessment.

  **1. Load-Bearing Distinctions (Keep These)**
  *   **Signal vs. Cue:** This is robust. Undergrads can spot "designed for reception" vs. "byproduct" with minimal training. This settles the "is it communication?" question.
  *   **Static (Sunk) vs. Dynamic (Variable):** This is your strongest theoretical contribution. Most papers conflate ornaments (sunk) with displays (variable). The procedure successfully separates them. This matters because only Dynamic signals allow for *immediate* differential cost adjustment.
  *   **Index vs. Non-Index:** Crucial. If physics enforces honesty, "cost" is irrelevant to reliability. Separating these prevents the "everything is a handicap" error.

  **2. Distinctions to Drop (Too Fine-Grained for this Data)**
  *   **Marginal Differential Cost:** You cannot code this from video. It requires knowing the internal state (quality) of the signaller and measuring the slope of their cost function. *Drop this from the undergrad workflow.* It belongs in your "Expert Override" notes. If you try to make undergrads guess this, they will hallucinate data.
  *   **Currency Conversion:** You cannot convert energy to predation risk to mating success from a clip. *Drop this.* Acknowledge in the repository metadata that "Cost" is a proxy (effort/risk), not a measured currency.
  *   **Third-Party Cost:** Distinguishing whether the cost is borne by the signaller or the parent (Clip 2) is theoretically vital but observationally nearly impossible without physiological data. Tag it as a "Potential Complication" rather than a hard category.

  **3. Where the Procedure Will Misfire (Predictable Errors)**
  *   **The "Empty Stage" Error:** In 50% of your clips, there is no receiver. The procedure correctly tags these **Uncodeable-Cost**. This will frustrate users of your archive who want to test signalling theory. *Expect this.* It validates the critic's claim that "costly signalling" is often an assumption projected onto the footage, not a feature of it.
  *   **The "Effort" Proxy:** Undergrads will equate "looks hard" with "costly." A gazelle stotting looks fit, not tired. They may tag it "Low Cost." You will need to calibrate them: "Cost" means "Risk or Energy," not "Struggle."
  *   **The Index/Handicap Hybrid:** As in the frog clip, many signals are both. The tree forces a choice. This will create noise in your dataset. *Mitigation:* Allow double-tagging for Expert Review, but force undergrads to pick the *primary* reliability mechanism.

  **4. The Hard Truth for Your Reading Group**
  You are defending the Zahavi-flavoured version against the claim that it is unfalsifiable. This coding procedure demonstrates *why* the critic has a point.

  Observational footage alone **cannot** confirm the Handicap Principle. It can confirm:
  1.  Signaling exists.
  2.  Physical Indices exist.
  3.  Dynamic behaviors exist.

  It **cannot** confirm that the dynamic behavior is *honestly* secured by differential cost without:
  1.  Seeing the receiver (to enforce the cost).
  2.  Measuring the signaller's quality (to prove the differential).
  3.  Measuring the fitness outcome (to prove the benefit).

  If you use this archive to defend Zahavi, you must admit the data is *consistent* with the theory, not *confirmatory* of it. The "Uncodeable-Cost" tag is your shield. It allows you to say: "We are not claiming this is a costly signal; we are claiming this is a signal where cost *would* be the mechanism, pending experimental validation."

  That is the only defensible position for observational data. If your reading group member claims "costly signal" is unfalsifiable *as used in most papers*, this procedure proves them right about the papers, but gives you the tool to write better ones.
