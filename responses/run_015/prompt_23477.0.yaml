answer: |-
  This is one of the most common points of confusion in game theory, and you are right to feel that the definitions alone don't capture *why* it matters. Your professor is emphasizing this because it distinguishes between **rationality** (what a single player should do) and **equilibrium** (what happens when everyone is doing their best).

  Let's untangle your three points using two specific games.

  ### 1. Why allow Mixed Strategies to Dominate?

  You asked: *"I thought strictly dominated just meant some single pure strategy beats it... why do we need to allow the beating strategy to be a mix?"*

  The intuition is geometric. Think of your strategies as points in space, where the coordinates are the payoffs you get against each of the opponent's strategies.
  *   A **Pure Strategy** is a single point.
  *   A **Mixed Strategy** is a weighted average (a convex combination) of those points.

  If a pure strategy lies "inside" the shape formed by your other strategies, no single other strategy beats it, but a **mixture** of the others can surround and beat it.

  **The Example:**
  Consider a game where Player 1 has three strategies ($T, M, B$) and Player 2 has two ($L, R$). Look only at Player 1's payoffs:

  | P1 \ P2 | $L$ | $R$ |
  | :--- | :---: | :---: |
  | **$T$** | 4 | 0 |
  | **$M$** | 1 | 1 |
  | **$B$** | 0 | 4 |

  **Check for Pure Dominance:**
  *   Does $T$ strictly dominate $M$? No. If P2 plays $R$, $T$ gets 0 and $M$ gets 1.
  *   Does $B$ strictly dominate $M$? No. If P2 plays $L$, $B$ gets 0 and $M$ gets 1.
  *   **Conclusion:** If we only looked for pure dominance, $M$ would survive.

  **Check for Mixed Dominance:**
  *   Consider a mixed strategy $\sigma = 0.5T + 0.5B$.
  *   Against $L$: Expected payoff is $0.5(4) + 0.5(0) = 2$.
  *   Against $R$: Expected payoff is $0.5(0) + 0.5(4) = 2$.
  *   Compare $\sigma$ to $M$:
      *   Against $L$: $2 > 1$.
      *   Against $R$: $2 > 1$.
  *   **Conclusion:** The mixed strategy $\sigma$ **strictly dominates** $M$.

  **Why this matters:** A rational player maximizes expected utility. If I can get an expected payoff of 2 by flipping a coin between $T$ and $B$, why would I ever play $M$ for a guaranteed 1? $M$ is irrational, even though no *single* pure strategy beats it. This is why the definition of Iterated Elimination of Strictly Dominated Strategies (IESDS) **must** allow mixed dominators.

  ---

  ### 2. The "Never a Best Response" (NABR) Equivalence

  You asked: *"Why is a pure strategy strictly dominated by a mixed strategy if and only if it's 'never a best response'?"*

  This is the "deep fact" your professor mentions. It connects **Dominance** (comparing my strategies against each other) with **Best Response** (comparing my strategies against *beliefs* about you).

  **The Definition:** A strategy is a **Best Response** if there is *some* belief (probability distribution) I could hold about your play that makes this strategy my optimal choice.
  **The Claim:** $M$ is strictly dominated (by a mix) $\iff$ $M$ is **Never** a Best Response.

  **Let's test this on our $T, M, B$ example.**
  Is there *any* belief about Player 2 that makes $M$ optimal?
  *   Let $p$ be the probability Player 2 plays $L$. (So $1-p$ is probability of $R$).
  *   Expected Payoff of $T$: $4p + 0(1-p) = 4p$
  *   Expected Payoff of $B$: $0p + 4(1-p) = 4 - 4p$
  *   Expected Payoff of $M$: $1p + 1(1-p) = 1$

  For $M$ to be a best response, it must be at least as good as $T$ **and** $B$.
  1.  $M \ge T \implies 1 \ge 4p \implies p \le 0.25$
  2.  $M \ge B \implies 1 \ge 4 - 4p \implies 4p \ge 3 \implies p \ge 0.75$

  **The Contradiction:** $p$ cannot be less than 0.25 **and** greater than 0.75 at the same time.
  There is **no belief** $p$ for which $M$ is optimal. $M$ is **Never a Best Response**.

  **The Geometric Intuition:**
  Plot the payoffs as vectors: $T=(4,0)$, $B=(0,4)$, $M=(1,1)$.
  A "belief" is essentially a slope. You are looking for a slope where $M$ is the highest point.
  *   $T$ and $B$ form a line segment $y = 4-x$.
  *   $M$ lies strictly below that line segment.
  *   No matter what slope (belief) you draw, the "upper boundary" of the set of strategies will always touch $T$, $B$, or the line between them. It will never touch $M$.

  **Why is this the "Whole Point"?**
  *   **IESDS (Strict)** eliminates strategies that are **irrational**. If a strategy is strictly dominated, it is *never* a best response. A rational player simply will not play it, regardless of what they think the opponent is doing. This is why IESDS is "safe"—it only removes things a rational player would never do.
  *   If we didn't allow mixed strategies in the definition, this equivalence would break. $M$ wasn't dominated by any *pure* strategy, but it *was* Never a Best Response. Allowing mixed dominance ensures that **Dominance $\equiv$ Irrationality**.

  ---

  ### 3. Weak Dominance, Order Dependence, and Nash Equilibrium

  You asked: *"Why is IESDS order independent... but IEWDS (Weak) is order dependent and can delete a Nash Equilibrium?"*

  The difference lies in the word **Strictly** vs. **Weakly**.
  *   **Strict:** Payoff is *always* better ($>$).
  *   **Weak:** Payoff is *at least* as good ($\ge$), and strictly better in at least one case.

  The danger of Weak Dominance is **Indifference**. A weakly dominated strategy might still be a Best Response if the opponent plays the specific strategy where the payoffs are equal.

  **The Example (Deleting a Nash Equilibrium):**
  Consider this $2 \times 2$ game:

  | P1 \ P2 | $L$ | $R$ |
  | :--- | :---: | :---: |
  | **$T$** | 1, 1 | 0, 0 |
  | **$B$** | 0, 0 | 0, 0 |

  **Step 1: Identify Dominance.**
  *   For Player 1: $T$ weakly dominates $B$.
      *   Against $L$: $1 > 0$.
      *   Against $R$: $0 = 0$. (Here is the indifference!)
  *   If we perform **IEWDS**, we delete $B$.
  *   Remaining Game: P1 plays $T$. P2 compares $L$ (1) vs $R$ (0). P2 plays $L$.
  *   **Survivor:** $(T, L)$.

  **Step 2: Check for Nash Equilibria in the original game.**
  *   Is $(T, L)$ a NE? Yes. (1,1) is stable.
  *   Is $(B, R)$ a NE?
      *   P1 plays $B$. P2 plays $R$. Payoffs (0,0).
      *   Can P1 improve? Switch to $T$ against $R$ $\to$ payoff 0. No improvement. ($B$ is a Best Response to $R$).
      *   Can P2 improve? Switch to $L$ against $B$ $\to$ payoff 0. No improvement. ($R$ is a Best Response to $B$).
      *   **Yes, $(B, R)$ is a Nash Equilibrium.**

  **The Problem:** By eliminating $B$ because it was *weakly* dominated, we deleted the Nash Equilibrium $(B, R)$.
  In the equilibrium $(B, R)$, Player 2 plays $R$. Against $R$, Player 1 is *indifferent* between $T$ and $B$. Rationality does not forbid playing $B$ here. But IEWDS assumes Player 1 *won't* play $B$. This assumption is too strong for Nash Equilibrium analysis.

  **Why Order Dependence?**
  Order dependence happens when Player 1 has a weakly dominated strategy that relies on Player 2's strategy, and Player 2 has a weakly dominated strategy that relies on Player 1's.
  *   If you delete P1's strategy first, P2's strategy might become strictly dominated and get deleted.
  *   If you delete P2's strategy first, P1's strategy might become strictly dominated and get deleted.
  *   Depending on the order, you can end up with different surviving sets of strategies.

  Because Weak Dominance relies on indifference ("I *could* play this if you play that"), removing strategies changes the conditions of that indifference. Strict Dominance does not rely on indifference ("I *never* play this"), so removing other strategies doesn't change the fact that the dominated one is bad.

  ### Summary: The "Deep Fact"

  1.  **Mixed Strategies in Strict Dominance:** We allow them because a rational player can randomize. If a mix beats a pure strategy, that pure strategy is **Never a Best Response** to any belief.
  2.  **NABR Equivalence:** This is the bridge.
      *   **Strict Dominance $\iff$ Never a Best Response.**
      *   This means IESDS removes only **irrational** strategies. It is safe, order-independent, and preserves all Nash Equilibria.
  3.  **Weak Dominance:**
      *   **Weak Dominance $\neq$ Never a Best Response.** (A weakly dominated strategy *can* be a best response in cases of indifference).
      *   This means IEWDS removes **equilibrium** strategies. It is risky, order-dependent, and is used for *refining* equilibria (selecting one), not finding them.

  Your professor emphasizes this because **IESDS is about Rationality**, while **IEWDS is about Equilibrium Selection**. Confusing the two leads to deleting solutions that are actually valid.
