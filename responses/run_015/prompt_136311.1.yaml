  # Joint Statement on Value Extrapolation and Idealization

  **Participants:** The CEV Stabilist Working Group & The Idealized-Preference Pluralist Collective  
  **Date:** October 26, 2023  
  **Subject:** Shared Mechanics, Divergent Telos

  We, the undersigned, represent divergent philosophical positions regarding the endpoint of value extrapolation. Despite our adversarial stance on the metaphysics of volition, we recognize a substantial overlap regarding the *process* of idealization. This statement documents our shared ground on the mechanics of extrapolation while explicitly cataloging our remaining disagreements regarding the necessity of global coherence.

  Our collaboration acknowledges that while we agree on how to refine preferences, we disagree on whether refinement necessitates unification. The Stabilist maintains that sufficient reflection reveals a singular "true volition." The Pluralist maintains that sufficient revelation reveals a legitimate plurality of coherent selves. We agree that resolving this dispute is critical for aligning advanced systems with human intent.

  ### I. Agreed Claims

  1.  **Mechanics of Extrapolation:** Value extrapolation requires a process of reflection, knowledge growth, and coherence checking. It is not merely retrieving static data from the brain.
  2.  **Preference Revision:** Reflection can genuinely revise preferences. What an agent wants after idealization may differ from what they currently report or act upon.
  3.  **Anti-Paternalism:** The extrapolation process must not override the agent's values based on the designer's normative assumptions. The output must be attributable to the agent's own idealized perspective.
  4.  **Insufficiency of Revealed Preference:** Observed behavior is an unreliable indicator of true values due to cognitive bias, akrasia, and environmental constraints.
  5.  **Local Coherence:** Incoherent preferences (e.g., circular rankings) are generally problematic and should be resolved locally to prevent exploitation or paralysis.

  ### II. Disagreements Table

  | Issue | Stabilist Wording | Pluralist Wording | Is this verbal? |
  | :--- | :--- | :--- | :--- |
  | **Global Convergence** | Reflective equilibrium must converge on a single, globally coherent preference ordering to constitute a valid utility function. | Reflective equilibrium should only enforce local coherence; forcing global convergence imposes an artificial unity that destroys legitimate value pluralism. | No (Substantive) |
  | **Nature of Contradiction** | Contradictions in value are cognitive errors to be resolved during idealization. | Contradictions in value can be constitutive features of identity to be preserved during idealization. | No (Substantive) |
  | **"True Volition"** | There is a unique fact of the matter about what an agent wants across all modal distances. | "What an agent wants" is a family of possible coherent profiles, none of which is uniquely "true." | Partial (Metaphysical) |

  ### III. Cruxes and Concrete Scenarios

  We identify two specific cruxes where our theoretical differences yield divergent empirical predictions regarding system behavior.

  #### Crux 1: Modal Convergence (The Twin Reflection Scenario)
  **The Issue:** Whether there is a single fact about "what I want" across modal distance, or just a family of local coherent profiles.

  **Concrete Scenario:** Two identical agents are placed in causally isolated environments. Both undergo idealized reflection with slightly different random seeds in their cognitive simulation (e.g., different order of considering arguments).

  *   **Stabilist Prediction:** Both agents will converge to the *same* final preference ordering. The path taken does not alter the unique fixed point of their volition.
  *   **Pluralist Prediction:** The agents may converge to *different* final preference orderings. Both outcomes are equally valid idealizations of the original agent; there is no unique fixed point.

  #### Crux 2: The Archivist Case
  **The Issue:** Whether an idealized self should resolve contradictions or preserve them as a memorial to their history.

  **Concrete Scenario:** An artist explicitly values both "Radical Honesty" and "Kindness," which frequently conflict. They instruct an AI: "Preserve my journals exactly as they are, including the contradictions where I hurt people to be honest. Do not edit them into a coherent memoir."

  *   **Stabilist Prediction:** The idealized self would override this instruction. Upon full reflection, the artist would recognize the contradiction as a failure of integration and prefer the coherent memoir that resolves the tension between honesty and kindness.
  *   **Pluralist Prediction:** The idealized self would endorse the instruction. The tension between honesty and kindness is constitutive of the artist's identity; resolving it would erase the value they place on the struggle itself.

  ### IV. Conclusion

  We commit to testing these predictions through simulation and conceptual analysis. While we share a commitment to avoiding paternalism and respecting the mechanics of reflection, the question of whether human volition is singular or plural remains the decisive fault line in our collaboration.

