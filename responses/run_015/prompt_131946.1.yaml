      *Revised Plan for Least-Costly Change:* Actually, the cleanest fix is to distinguish **Numerical Identity** (the specific "I") from **Psychological Continuity** (the pattern). Claim (4) conflates them. Claim (3) relies on Numerical Identity. Claim (2) relies on Psychological Continuity.
      *   *Change:* Qualify (4). "Survival of the *person* is pattern continuity; survival of the *subject* requires causal continuity."
