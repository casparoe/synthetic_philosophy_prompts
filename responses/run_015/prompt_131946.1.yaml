          *   High Pattern / High Causal: Gradual replacement (Claim 4) or Wired Hive (Claim 6).
          *   The Tension: If pattern is what matters (Claim 1 & 4), why does causal isolation kill identity in Claim 3? If causal integration matters (Claim 6), why does social understanding count as distribution in Claim 2 (which is low bandwidth causal integration)?

  4.  **Pairwise Audit (The Core Work):**

      *   *(1) & (2):* Consistent. If self is a pattern, and patterns can be instantiated elsewhere, social internalization fits.
      *   *(1) & (3):* Consistent. A copy is a *new* loop instance. Hofstadter distinguishes the "soul" (pattern) from the specific instantiation, but usually acknowledges branching creates distinct futures.
      *   *(1) & (4):* Consistent. Substrate independence is core to pattern theory.
