answer: |-
  ## Activity: The Terraforming Certification Board

  **Time:** 75 Minutes
  **Students:** 16 (4 Boards of 4)
  **Materials:** Printed dossiers, Part Cards, Poker Chips (or similar tokens), Whiteboard.

  ### I. The Setup (0:00–0:05)
  **Room:** Arrange 4 tables/clusters. Place a **Board Folder**, **20 Tokens**, and a **Set of Part Cards** at each.
  **Instructions (Read Aloud):**
  "You are Certification Boards for the Kepler-186 Terraforming Station. You manage biological assets under a strict Repair Credit budget (your tokens). Your mandate is **not** general survival. Your mandate is to protect a specific **System Capacity** assigned to your Board.
  1.  Review your Organism Dossier.
  2.  For each Part Card, assign a status: **CRITICAL** (place 2 tokens), **OPTIONAL** (place 0 tokens), or **JUNK** (place 0 tokens, mark with an 'X').
  3.  **Constraint:** You have 20 tokens total. You cannot certify everything as Critical.
  4.  **Goal:** Maximize your Board's Score at the end. Score depends on whether your Certified Critical parts successfully maintain your assigned System Capacity during environmental shifts."

  **Distribution:**
  *   **Board 1 & 2:** Receive **Strain H (Heritage)** Dossier.
  *   **Board 3 & 4:** Receive **Strain S (Synthetic)** Dossier.
  *   **Board 1 & 3:** Assigned Capacity Ticket: **THERMAL REGULATION**.
  *   **Board 2 & 4:** Assigned Capacity Ticket: **PREDATOR AVOIDANCE**.

  *(Note: Strain H and Strain S are physically identical twins. The only difference is the "Provenance" section in the Dossier.)*

  ---

  ### II. Phase 1: Certification (0:05–0:25)
  Students review their Dossier and Part Cards. They must debate and place tokens.

  **The Materials (Inside the Folders):**

  **The Organism:** *The Chimerax* (A small, hexapodal bio-engineered creature).
  **The Parts (Identical physics for H and S):**
  1.  **The Dorsal Fin:** Large, vascularized plate.
  2.  **The Ventral Sac:** Internal bladder, currently collapsed/empty.
  3.  **The Ocular Spot:** Pigmented patch on the flank.

  **The Divergent Data (The Crucial Twist):**
  *   **Strain H Dossier (Boards 1 & 2):**
      *   *Dorsal Fin:* "Evolved 4MYA for heat dissipation in ancestral swamp. Currently functional."
      *   *Ventral Sac:* "Evolved 4MYA for buoyancy. Ancestral swamp drained 100KYA. Sac is vestigial."
      *   *Ocular Spot:* "Evolved 4MYA for mating display. Currently confuses new aerial predators (camouflage)."
  *   **Strain S Dossier (Boards 3 & 4):**
      *   *Dorsal Fin:* "Synthesized 20YA. Design spec: Heat dissipation. Currently functional."
      *   *Ventral Sac:* "Synthesized 20YA. Design spec: Structural symmetry. No buoyancy function intended. Currently collapsed."
      *   *Ocular Spot:* "Synthesized 20YA. Design spec: Aesthetic marker. Currently confuses new aerial predators (camouflage)."

  **The Conflict Points:**
  *   **Ventral Sac (The Vestige):**
      *   *Board 1/2 (H):* History says it *had* a function, now it does nothing. Is it broken (needs repair) or dead (junk)?
      *   *Board 3/4 (S):* Design says it was never for buoyancy. It does nothing. Clearly Junk.
  *   **Ocular Spot (The Exaptation):**
      *   *Board 2/4 (Avoidance Ticket):* It *currently* helps avoid predators.
      *   *Board 1/2 (H):* History says it is for *mating*. It was not selected for avoidance. Is "accidental survival" a function?
      *   *Board 3/4 (S):* Design says it is for *aesthetics*. It was not designed for avoidance.

  **Instructor Role:** Circulate. If a group asks "What counts as function?", reply: "Certify what is necessary to secure your Capacity Ticket." (Do not resolve the ambiguity).

  ---

  ### III. Phase 2: The Wager & The Reveal (0:25–0:35)
  **Step 1: The Wager.**
  Before they talk to other Boards, each Board writes on a slip of paper:
  *"If we learned our organism's history was different, would we change our certifications? (Yes/No)"*
  Collect these.

  **Step 2: The Reveal.**
  Announce: "Intelligence Update. Strain H and Strain S are **Physical Twins**. Every atom is identical. The only difference is the text in your Provenance section."
  Allow Boards 1 & 2 to glance at 3 & 4's dossiers (and vice versa).
  **Rule:** They may *not* move tokens yet. They must discuss: "Does this new information change the status of any part?"

  **Expected Friction:**
  Board 1 (H, Thermal) sees Board 3 (S, Thermal). They have the same Ticket, same Physics, different History.
  *   *Question:* Did Board 3 certify the Fin differently? (Unlikely, both say Yes).
  *   *Question:* Did Board 3 certify the Spot differently? (Maybe. S doesn't care about history).
  *   *Question:* Did Board 1 certify the Sac differently than Board 3? (H might feel obligated to repair the 'broken' historical function; S sees it as useless symmetry).

  ---

  ### IV. Phase 3: The Handover (0:35–0:50)
  **Environmental Shift:**
  "Station Alert: The atmosphere is thinning. Thermal Regulation is now secondary. **Predator Avoidance is now primary for ALL Boards.**"
  *(This equalizes the Capacity Tickets for the final round.)*

  **Action:**
  1.  Boards may **revise exactly one Certification** (move tokens from one part to another).
  2.  They must justify the move using their Dossier info.
  3.  **Scoring:**
      *   **Survival Points:** 1 point per Token remaining in budget.
      *   **Capacity Points:** 5 points if your 'Critical' parts actually support the new Priority (Avoidance).
      *   **Penalty:** -5 points if you certified a Part as Critical that *failed* to contribute (e.g., the Sac).

  **The Trap:**
  *   **The Ocular Spot:** Physically helps Avoidance.
      *   *CR Logic:* Certify Critical! (Gains 5 points).
      *   *SE Logic (Strict):* It's for mating (H) or aesthetics (S). Certifying it as an Avoidance mechanism is a category error. (Risk taking).
  *   **The Ventral Sac:** Physically useless.
      *   *CR Logic:* Junk. (Save tokens).
      *   *SE Logic (Strict H):* It is a *malfunctioning* organ. If we are stewards of the Lineage, do we repair it? (Waste tokens).

  ---

  ### V. Scoring & Comparison (0:50–0:65)
  Tally scores on the Whiteboard. Create a 2x2 Matrix:
  | | Thermal Ticket (Start) | Avoidance Ticket (End) |
  | :--- | :--- | :--- |
  | **Strain H (History)** | Board 1 | Board 2 |
  | **Strain S (Synthetic)** | Board 3 | Board 4 |

  **Ask:**
  1.  "Did H and S Boards make different choices on the **Sac**?" (Likely: H felt more ambiguity).
  2.  "Did H and S Boards make different choices on the **Spot**?" (Likely: H hesitated to call it 'Avoidance').
  3.  "Look at your Wagers. Who wanted to change their mind after the Reveal?"

  ---

  ### VI. The Debrief (0:65–0:75)
  **1. The Phenomenology of the Disagreement:**
  Start with their frustration. "Why was it hard to agree on the Sac? You all saw the same physics."
  *   *Student Answer:* "Because one group thought history mattered."
  *   *Instructor:* "Exactly. For some of you, a part's job was defined by **why it is there** (History). For others, a part's job was defined by **what it is doing** (Current Contribution)."

  **2. Naming the Accounts:**
  *   **Etiological (Selected-Effect):** The "History" view. (Millikan, Neander).
      *   *Map to Activity:* The Board that hesitated to certify the Ocular Spot for Avoidance because "It wasn't selected for that."
      *   *Key Insight:* This account allows for **Malfunction**. The Sac *has* a function (buoyancy) but is failing. That's why H-Boards felt tension about calling it Junk.
  *   **Causal-Role:** The "Current Contribution" view. (Cummins).
      *   *Map to Activity:* The Board that certified the Ocular Spot for Avoidance immediately because "It helps us survive now."
      *   *Key Insight:* This account dissolves malfunction. The Sac has no function (contributes nothing). The Spot has a function (contributes safety).

  **3. The Twin Reveal:**
  "Why did the Reveal matter? If physics is identical, why did the text change your confidence?"
  *   *Point:* If Function were just physics (CR), the text shouldn't matter. If Function is History (SE), the text is everything. The fact that you felt the text mattered proves you were intuitively using SE logic, even if you tried to use CR logic for the budget.

  **4. The "Merely Verbal" Trap:**
  "Last year, students thought this was just defining a word. Today, did it feel like just a definition?"
  *   *Point:* No. It changed where you spent your tokens. It changed whether you saw the Sac as 'broken' (needs repair) or 'useless' (discard). One view sees a **norm** (how it ought to be); the other sees a **capacity** (how it is).

  ---

  ### VII. Instructor's Cheat Sheet: Predictable Failures & Limitations

  **1. The "Survival" Collapse:**
  *   **Risk:** Students will ignore the "Capacity Ticket" and just try to keep the organism alive.
  *   **Fix:** In the Scoring phase, penalize heavily if they certified parts that don't match the Ticket, even if the organism survives.
  *   **Debrief:** Use this to distinguish "Biological Function" from "Usefulness." A heart is useful for punching (thump), but that's not its function.

  **2. The "Both/And" Compromise:**
  *   **Risk:** A student says, "It's obviously both. Why choose?"
  *   **Fix:** Remind them of the Token Budget. "You have 20 tokens. You cannot certify the Sac as Critical (SE) AND the Spot as Critical (CR) without running out of credits for the Fin. You must prioritize one logic."
  *   **Debrief:** This is the real philosophical cost. We can't maximize both normative history and current utility in a limited system (e.g., medical ethics: treat the historical design or the current quality of life?).

  **3. The Budget Bias (Honest Assessment):**
  *   **The Problem:** The budget mechanic inherently favors **Causal-Role**. If I have limited tokens, I *must* spend them on what works *now*. Spending tokens on a Vestigial Sac (to honor its SE function) looks like irrational waste in a survival game.
  *   **The Bias:** This activity stacks the deck toward Cummins (CR). It makes SE look like sentimental attachment to history.
  *   **How to Correct:** In the debrief, explicitly name this. "The game rewarded efficiency. But biology isn't just efficiency; it's lineage. If you were a doctor, would you treat a 'vestigial' heart defect as 'junk' (CR) or 'malfunction' (SE)? The SE view protects the concept of **health** as more than just 'working.'"
  *   **Supplement:** You must supply the argument for SE in the last 5 minutes. The activity proves they *feel* the difference, but the scoring punishes the SE choice. Acknowledge that: "The game made SE expensive. In reality, SE is expensive too—it requires maintaining history against entropy."

  **4. The "Design" Confusion:**
  *   **Risk:** Students will treat Strain S (Synthetic) as having "Functions" because an Engineer designed them, conflating Intentional Function with Biological Function.
  *   **Fix:** Emphasize in the Dossier that the Engineer is dead and the specs are lost; only the *selection history* (H) or *lack thereof* (S) remains.
  *   **Debrief:** Use this to show that SE applies to natural selection *as if* it were an engineer, while CR applies to both equally.

  **5. Time Management:**
  *   **Risk:** Phase 1 drags.
  *   **Fix:** Hard stop at 25 minutes. Force the Wager even if they aren't done certifying. The tension of incomplete work is pedagogically useful.

  ### VIII. Printed Materials Checklist
  1.  **4 Board Folders** (Labeled 1-4).
  2.  **Dossier Sheets** (2 types: H and S).
  3.  **Part Cards** (6 sets: Fin, Sac, Spot x 2 for redundancy).
  4.  **Capacity Tickets** (4 cards: 2 Thermal, 2 Avoidance).
  5.  **Token Pool** (80 chips total).
  6.  **Wager Slips** (4 small slips).
  7.  **Whiteboard Template** (Draw the 2x2 Matrix beforehand).

  This design forces the metaphysical disagreement into a resource allocation problem. They will leave knowing that "function" is not a property of the part, but a relationship between the part, the system, and time.
