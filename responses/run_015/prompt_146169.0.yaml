  ### 1. Ranked Tensions

  I have identified three genuine tensions within your set. They are ranked by severity, based on how much of your framework they threaten and how difficult they are to reconcile without abandoning a firm verdict.

  **Severity 1: The Jaywalking Paradox (Commitment 5 vs. Commitment 6)**
  *   **The Conflict:** Commitment (5) states that jaywalking on an empty street is *not morally wrong at all*. Commitment (6) invokes the Principle of Fair Play: if you accept the benefits of a scheme of mutual restraint, you owe compliance.
  *   **Why it is severe:** The traffic signal system is a scheme of mutual restraint. Even on an empty street, you benefit from the *existence* of the system (it organizes traffic generally, preventing the chaos that would occur if everyone adopted your maxim). If (6) is your *general principle*, it generates an obligation to obey the light even when no car is coming, because you are free-riding on the systemic order maintained by others.
  *   **What must give:** You cannot hold (5) and (6) in their current forms. (6) is the aggressor here. If you keep (6) as the general principle, (5) becomes indefensible (you are wrong, just excusably so). If you keep (5) as a firm verdict, (6) cannot be the general principle for all conventions.
  *   **Cost:** Modifying (6) costs you the elegance of a single, sweeping deontological principle. It forces you to distinguish between *systemic* benefits (which don't always bind) and *particular* reliance (which does).

  **Severity 2: The Mixed-Norm Bus Stop (Commitment 1 vs. Commitment 2)**
  *   **The Conflict:** Commitment (1) states queue-jumping is a *genuine moral wrong*. Commitment (2) states conventions bind only where the practice is "live and mutually recognised." In a mixed-norm stop (some queue, some scrum), the practice is *not* mutually recognised.
  *   **Why it is severe:** If (2) is true, the obligation to queue dissolves in the mixed case because the expectation is fractured. There is no stable convention to violate. However, your intuition in (1) suggests that the people who *are* queuing are still wronged by a jumper, regardless of the scrummers. (2) fails to protect the queuers in this specific environment.
  *   **What must give:** Either (1) must be softened (it's only wrong if the norm is stable) or (2) must be refined (expectations can be local to a subgroup).
  *   **Cost:** Refining (2) complicates the "content-independent" claim. It requires you to argue that a sub-group's expectation generates a moral reason even if the wider crowd ignores it.

  **Severity 3: The Scrum vs. Justice Boundary (Commitment 3 vs. Commitment 7)**
  *   **The Conflict:** Commitment (3) says follow the local norm (even a scrum). Commitment (7) says local norms don't settle morality; unjust norms may be flouted. You distinguish coordination value from distributive profile. A scrum has high coordination value but a poor distributive profile (favours the strong).
  *   **Why it is severe:** This is a boundary dispute. At what point does a "bad distribution" become an "unjust scheme" (triggering 7) rather than just a "local convention" (triggering 3)? If a scrum systematically disadvantages the disabled or elderly, is it merely a convention or an injustice?
  *   **What must give:** You need a threshold for "reasonable justice" in (6)/(7).
  *   **Cost:** This introduces vagueness. You lose the clean "When-in-Rome" rule for borderline cases.

  ### 2. Apparent Inconsistencies (That Dissolve)

  **Commitment 1 vs. Commitment 2 (General Case)**
  *   **Appearance:** (1) calls queue-jumping a "genuine moral wrong," which sounds content-heavy (inherently bad). (2) says reasons are "content-independent" (only bad because of the practice).
  *   **Resolution:** This dissolves if the "wrong" in (1) is defined by the harm in (2). The moral wrong is not the act of walking forward, but the *frustration of reliance*. The queuer has planned their time based on the convention. The jumper defeats that plan. This is a genuine harm, derived from a content-independent rule. These two hold together well.

  **Commitment 3 vs. Commitment 4**
  *   **Appearance:** (3) says follow local norms (scrum). (4) says *don't* follow local norms (don't tip if service charge exists, even if locals tip).
  *   **Resolution:** This is not a contradiction but a distinction in *type* of convention. (3) is a coordination equilibrium (bus boarding). (4) is a wage-setting institution. In (4), the "local custom" of extra tipping is not a coordinated expectation necessary for the transaction, whereas the base wage assumption is. You are consistent in following the *structural* expectation (wages/boarding order) but not the *gratuitous* one (extra tip).

  ### 3. The Diagnostic Case: The Mixed-Norm Bus Stop

  **Case:** A bus stop where a loose line forms, some observe it, others walk to the front without provoking objection.
  **Question:** Does anyone there owe it to anyone else to queue?

  This case discriminates between your accounts as follows:

  *   **Commitment 2 (Coordination/Expectation) fails here.** Because the norm is not "mutually recognised" (some scrum, some queue), the convention is not "live" in the Lewisian sense. Strictly applied, (2) suggests no obligation exists because the expectation is not common knowledge. This contradicts the spirit of (1).
  *   **Commitment 6 (Fair Play) succeeds here.** Even if the norm is mixed, the queuers are engaging in a scheme of mutual restraint. If you walk to the front, you benefit from their restraint (they hold the space you take). You are free-riding on their specific cooperation, even if others are not cooperating.
  *   **Verdict:** The Mixed Bus Stop reveals that **Fair Play (6) is a stronger generator of obligation in partial-compliance scenarios than Coordination (2).** However, as noted in Severity 1, Fair Play is too strong elsewhere (Jaywalking).

  ### 4. The Single Revision

  To clean up the most trouble (resolving the Jaywalking Paradox, saving the Mixed Bus Stop intuition, and clarifying the Scrum boundary), you should revise **Commitment 6**.

  **Current (6):** "A person who accepts the benefits of a scheme of mutual restraint owes compliance with its rules in return..."

  **Proposed Revision:**
  "A person who accepts the benefits of a scheme of mutual restraint owes compliance with its rules in return, **provided that the benefit relies on the particular compliance of others in that instance, not merely on the systemic existence of the scheme.**"

  **Why this fixes the system:**
  1.  **Saves (5) Jaywalking:** On an empty street, your crossing does not rely on the *particular* restraint of drivers (there are none). You benefit from the *system*, but not from *specific reliance*. Therefore, no obligation.
  2.  **Saves (1) & Mixed Bus Stop:** In the mixed stop, the jumper *does* benefit from the *particular* restraint of the queuers (they are holding the spot). Therefore, the obligation holds even if the wider norm is mixed.
  3.  **Clarifies (3) Scrum:** In a full scrum, no one is restraining themselves for you. There is no particular reliance to free-ride on. Therefore, no obligation to queue.
  4.  **Preserves (4) Tipping:** Servers rely on *your* specific tip to meet the wage assumption. The reliance is particular. Obligation holds.

  **Cost:** You lose the simplicity of Fair Play as a blanket principle. You must now assess whether the benefit received is *systemic* (traffic order) or *particular* (my spot in line, my server's wage). But this distinction is necessary to align your general principle with your firm verdicts.

  **Final Diagnosis:** Your firm verdict in (5) is **not** the exposed one; it is the anchor. Commitment (6) is the exposed one. It is too broad. By tightening the definition of "benefit" in (6) to require *particular reliance*, you align your general principle with your specific intuitions across all cases.
