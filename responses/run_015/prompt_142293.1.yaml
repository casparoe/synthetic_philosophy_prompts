answer: |-
  ### Brainstorm: The Friction Points

  Before I lay out the spec, here's where the tension actually lives in your cases. I'm ignoring the standard "Humphrey" objections; they're rhetorical, not technical.

  1.  **The Two Heirs (Fission):** The problem isn't picking A or B; it's whether identity *can* be one-to-many. If you say "indeterminate," you save logic but kill bivalence. If you say "both," you kill transitivity of identity. If you say "neither," you kill continuity. Theories don't solve this; they relocate the cost.
  2.  **The Swap (Haecceitism):** This is the real knife. If intrinsic/causal profiles swap, is the world different? If yes, you need primitive thisness (haecceities). If no, you're an anti-haecceitist (structuralist). This divides the room more than fission does.
  3.  **The Merge (Fusion):** Mostly a consistency check for fission. If you allow branching time/worlds for fission, you must allow converging for fusion. If you ban one, you must ban the other. Most people ban both to save classical identity.
  4.  **The Lonely Object:** This is the technical killer for strict similarity-based Counterpart Theory (CT). If nothing resembles me elsewhere, am I essentially everything I am? Strict CT says yes. That's a bullet most CT folks bite or patch with "world-bound individuals have modal properties via the *relation*, not the *relata*."
  5.  **Near Tie:** This exposes whether your similarity metric is objective or contextual. If it's contextual, modal truth is context-sensitive (pragmatics). If objective, you need a weighting function (metaphysics).

  **Blunt Correction:** You say you want truth conditions, "not merely a translation scheme." Be careful. Lewis's CT *is* a truth-conditional analysis, just a reductive one. If you mean you want *sui generis* modal facts (primitivism), that's a metaphysical commitment, not a neutral requirement for a "theory of de re modality." Don't smuggle Actualism or Primitivism into the spec as if they were logical constraints.

  ***

  ### The Spec: Requirements for a Theory of De Re Modality

  I've sorted your list. I've marked items as **Non-Negotiable** (logical coherence, basic utility) or **Preference** (metaphysical taste, camp loyalty). I've flagged the contradictions.

  1.  **Truth-Conditional Adequacy (Non-Negotiable)**
      *   *Requirement:* Must assign truth values to standard de re claims ($\exists x \diamond Fx$) without circularity.
      *   *Failure:* If the theory says "It is possible that x is F iff x could be F," it's useless.
      *   *Source:* Your "truth conditions" demand.

  2.  **The "Very Object" Constraint (Preference: Kripkean/Actualist)**
      *   *Requirement:* De re claims must be about the *numerically identical* object across worlds, not a surrogate.
      *   *Failure:* Counterpart Theory (CT) "fails" this by design. CT proponents argue surrogacy is a feature, not a bug, to preserve logic.
      *   *Conflict:* Incompatible with Requirement #3.

  3.  **No Transworld Identity / World-Bound Individuals (Preference: Lewisian/Perdurantist)**
      *   *Requirement:* No object is wholly present at more than one world.
      *   *Failure:* Transworld Identity (TWI) theories "fail" this. TWI proponents argue literal identity is the only way to secure reference.
      *   *Conflict:* Incompatible with Requirement #2. **You cannot have both.**

  4.  **Necessity of Identity and Distinctness (Non-Negotiable)**
      *   *Requirement:* If $a=b$, then $\square(a=b)$. If $a \neq b$, then $\square(a \neq b)$.
      *   *Failure:* If a theory allows contingent identity, it breaks standard quantified modal logic (QML) and makes reasoning from premises to conclusions unstable.
      *   *Source:* Your "respect necessity of identity" demand.

  5.  **Non-Triviality for World-Bound Objects (Non-Negotiable)**
      *   *Requirement:* An object existing at only one world must not have all its properties necessarily.
      *   *Failure:* Strict similarity-based CT makes the "Lonely Object" essentially everything it is. This renders de re modality vacuous for single-world entities.
      *   *Source:* Your "Lonely Object" case.

  6.  **Ontological Parsimony regarding Worlds (Preference: Actualist)**
      *   *Requirement:* Do not commit to concrete, existent non-actual worlds.
      *   *Failure:* Lewisian Modal Realism fails this.
      *   *Source:* Your "work without concrete other worlds" demand.

  7.  **Uniformity of Persistence and Modality (Preference: Stage Theorist)**
      *   *Requirement:* Use the same mechanism (counterpart relation) for temporal stages and modal counterparts.
      *   *Failure:* TWI usually treats time (endurance) and modality (transworld identity) differently.
      *   *Source:* Your "one and the same machinery" demand.

  8.  **Anti-Haecceitism / Structuralism (Preference: Quinean/Lewisian)**
      *   *Requirement:* No difference without a qualitative difference. Swapping intrinsic roles without qualitative change does not create a new possibility.
      *   *Failure:* Primitivist TWI allows haecceitistic differences.
      *   *Source:* Your "The Swap" case.

  9.  **Context-Independence of Modal Truth (Preference: Realist/Objectivist)**
      *   *Requirement:* Modal truth shouldn't depend on conversational salience (contextualism).
      *   *Failure:* Contextualist CT makes "I could have been taller" true in one context, false in another, without world-change.
      *   *Source:* Your "modal truth not swing around" demand.

  10. **Domain Flexibility (Preference: Possibilist vs. Actualist)**
      *   *Requirement:* Take a line on the Barcan Formula. Either allow possibilia in the domain or restrict quantification to actual existents.
      *   *Failure:* Blurring "could exist" with "does exist" leads to confusion in quantification.
      *   *Source:* Your "principled line on Barcan" demand.

  **The Incompatibility:**
  Requirements #2 ("Very Object") and #3 ("No Transworld Identity") are mutually exclusive. You have to choose: either objects travel (TWI) or they don't (CT/Stage).
  Furthermore, #6 (No Concrete Worlds) + #2 (Very Object) + #1 (Non-Circular Truth Conditions) is the "Actualist Trilemma." If worlds aren't concrete, and objects don't travel, what *makes* the de re claim true? You end up positing primitive essences or abstract world-states, which looks suspiciously like a "translation scheme" to a Lewisian.

  **The Hardest Requirement:**
  **#5 (Non-Triviality for World-Bound Objects).** This is the technical choke point. It forces CT to complicate its similarity relation (adding "importance" weightings or allowing non-existent counterparts) and forces TWI to explain how an object has properties in a world where it doesn't exist.

  **The Decisive Case:**
  **Case 2 (The Swap).** Fission (Case 1) can be handled by indeterminacy or branching. The Swap tests **Haecceitism**. If you say there is *no* fact of the matter when qualitative roles swap, you are a structuralist (Lewis). If you say there *is* a fact (X is still X even with Y's role), you are a primitivist (Kripke). This cuts deeper than fission because it determines whether your ontology includes primitive "thisness."

  ***

  ### Scoring the Views

  Here is how the three major frameworks score against the spec. I am treating "Pass" as "Handles naturally," "Fail" as "Requires significant patching or violation," and "Cost" as "Acceptable consequence for proponents."

  | Requirement | Counterpart Theory (Lewisian) | Transworld Identity (Kripke/Plantinga) | Stage Theory (Siderian) |
  | :--- | :--- | :--- | :--- |
  | **1. Truth Conditions** | **Pass.** Reductive analysis into quantification over worlds/counterparts. | **Cost.** Relies on primitive modality or abstract world-states. | **Pass.** Reductive, similar to CT but temporalized. |
  | **2. "Very Object"** | **Fail.** Explicitly denies this. Uses surrogates. | **Pass.** Core commitment. | **Fail.** De re claims are about instantaneous stages. |
  | **3. No Transworld ID** | **Pass.** Core commitment. | **Fail.** Explicitly denies this. | **Pass.** Objects are world-bound stages. |
  | **4. Nec. Identity** | **Pass.** (With careful formulation of counterpart relation). | **Pass.** Core commitment. | **Pass.** Identity is timeless for stages. |
  | **5. Lonely Object** | **Fail.** Strict version makes properties necessary. Needs patch (e.g., "counterpart of" relation exists even if relata don't). | **Pass.** Object has essence regardless of other worlds. | **Cost.** Stages are always lonely; modality is about *other* stages. |
  | **6. No Concrete Worlds** | **Fail.** Commits to concrete pluriverse. | **Pass.** Actualist (abstract worlds). | **Fail.** Usually assumes Lewisian ontology for time/modality. |
  | **7. Uniform Machinery** | **Cost.** Temporal parts usually distinct from modal counterparts. | **Fail.** Time is endurance; modality is transworld identity. | **Pass.** Core commitment. Temporal and modal counterparts are same relation. |
  | **8. Anti-Haecceitism** | **Pass.** Qualitative similarity drives the relation. | **Fail.** Allows haecceitistic swaps (Case 2). | **Pass.** Structuralist about stages. |
  | **9. Context-Independence** | **Fail.** Similarity is often context-sensitive. | **Pass.** Essences are fixed. | **Cost.** Depends on how counterpart relation is fixed. |
  | **10. Domain Flexibility** | **Pass.** Possibilist domain (everything exists). | **Pass.** Actualist domain (contingent existence). | **Pass.** Possibilist domain. |

  **Summary Assessment:**
  *   **Counterpart Theory:** Best for logic and structuralism (Case 2), worst for the "Very Object" intuition and Actualism. It solves the logic of fission (Case 1) by allowing one object to have two counterparts, but at the cost of saying "I am not literally that guy."
  *   **Transworld Identity:** Best for the "Very Object" intuition and Case 2 (Swap), worst for explaining *what makes* the identity true without circularity. It struggles with Fission (Case 1) unless it allows branching worlds, which threatens Necessity of Identity.
  *   **Stage Theory:** Best for unifying time and modality (Requirement 7), but inherits CT's problems with the "Very Object" intuition. It treats you as a momentary slice, which many find ontologically extravagant in a different way.

  **Final Verdict:**
  If you want a theory that respects the **logic** of modal reasoning without primitive modality, you must drop Requirement #2 ("Very Object"). If you hold #2 as non-negotiable, you must accept primitive modality or haecceities (Requirement #8 failure). There is no free lunch. Case 2 (The Swap) is the one that will force you to choose between a clean logic (CT/Stage) and a robust intuition about reference (TWI). Pick your poison.
