  6.  **Final Review against constraints:** No bibliography? Check. Unpack logic? Check. Respectful of background? Check.

  *(Self-Correction on the Altruism point)*: I need to be careful. The user asks if it's a secular analog. I should say "It looks like it, but..." The key difference is the *telos*. Evolutionary altruism's telos is species survival (Universal). Abraham's telos is God (Absolute). The structure is similar (violation of norm), but the *reason* and the *outcome* differ fundamentally.

