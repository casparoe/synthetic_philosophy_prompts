answer: |-
  You have correctly identified that standard terminology like bootstrapping, reflection, or meta-circularity describes the loop itself, not the unformalized background that sustains it. In logic and computer science, the loop is well-mapped; the background is often treated as a philosophical embarrassment or a pragmatic necessity rather than a distinct structural feature. There is no established single term in the literature that specifically names this receding, convertible-but-not-eliminable context. The closest existing concepts are Tarski's Undefinability Theorem and the distinction between object language and meta-language, but these name the limit or the hierarchy, not the horizon itself.

  Regarding your question on whether the outside is structurally or pragmatically outside: it is structurally outside. This is not merely a matter of engineering carelessness or current limitation. It is a consequence of diagonalization arguments found in Gödel's Incompleteness Theorems and Tarski's Undefinability of Truth. A system cannot contain its own truth predicate or validator without becoming inconsistent or incomplete. When you internalize the validator (pull the background into the picture), you create a new system that requires a new validator. The receding behaviour is therefore a necessary consequence of formalization limits, not an artifact of sloppy work. The background recedes because consistency requires a strictly stronger meta-system to verify the object system.

  This distinguishes your case from the boundary cases you proposed. Ordinary mutual recursion that provably terminates does not exhibit this horizon because it is well-founded; the chain of references resolves to a base case within the system. There is no regress because the recursion unwinds to a value, not to a requirement for external validation. Similarly, the phasing discipline in macro systems avoids the horizon by enforcing stratification. By numbering stages and forbidding later stages from influencing earlier ones, the system prevents the loop from closing. It builds a tower rather than a circle, ensuring that every level has a fixed, lower level to stand on. In your cases, the loop closes (the compiler compiles itself), forcing the ground outside.

  Since no established term fits, I propose the label **Structural Horizon**.

  **Definition:** A system exhibits a Structural Horizon when it relies on an external context to validate or execute its self-referential operations, and any attempt to formalize that context within the system generates a new, identical requirement for an external context.

  **Criteria:** To count, a system must (1) be self-referential (the output or definition depends on the system itself), (2) require an external agent or context to resolve the reference (the bootstrapping binary, the human reader), and (3) exhibit regress upon internalization (formalizing the agent creates a new agent requirement).

  **Exclusions:** Systems that resolve via base cases (terminating recursion) are excluded because the chain ends internally. Systems that enforce strict stratification (phased macros) are excluded because they prevent the self-reference from becoming circular, replacing the horizon with a fixed foundation.

  The Structural Horizon is the edge of the system where intelligibility is borrowed from the environment. It is the recognition that while you can move the ground, you cannot stand on nothing.

  \answer{Structural Horizon}
