answer: |-
  **Translation: The Scale Argument as a Decision Problem**

  Formalize the scale argument as a target trial emulation where the intervention $A$ is a policy affecting insect welfare (e.g., agricultural land use) and the counterfactual $A=0$ is the status quo. The population $P$ is the super-population of extant insects ($N \approx 10^{18}$). The time horizon spans the lifespan of the cohort, acknowledging high early-life mortality. The outcome $Y$ is net valenced experience. Since $Y$ is unobservable, we rely on a latent-variable model where $Y$ is indicated by surrogate markers $M$ (nocifensive behavior, physiological stress).

  The estimand is the expected total welfare difference: $E[\Delta Y_{total}] = N \times E[\Delta Y_{individual}]$. Decompose the individual expectation into three components:
  $$E[\Delta Y_{individual}] = P(S) \times E[W | S] \times E[\Delta T]$$
  Where $P(S)$ is the prior probability of sentience (valenced experience exists), $E[W | S]$ is the welfare capacity per unit time given sentience, and $E[\Delta T]$ is the change in time-at-risk per individual. The astronomical number $N$ multiplies the entire product.

  The variance story is critical. This is not merely parameter uncertainty around a stable estimand. It is structural model uncertainty. The distribution of $P(S)$ is not a simple beta distribution reflecting sampling error; it is a mixture distribution reflecting competing structural models of consciousness. One component places mass at zero (no sentience); another places mass at non-zero values. When you propagate this through the $N$ term, the credible interval for $E[\Delta Y_{total}]$ spans orders of magnitude, including zero. The honest formalization is not a point estimate dominating all other causes, but a decision rule under deep uncertainty. The Value-of-Information (VOI) analysis suggests that research reducing variance on $P(S)$ or the validity of $M$ has high expected utility, potentially competing with direct intervention, because the linearity of $N$ amplifies the value of resolving the binary question of $S$. However, if the variance is driven by model specification rather than parameter precision, standard VOI may underestimate the cost of resolution.

  **Residue Report**

  **1. Surrogate Validity and Transport**
  In your framework, a surrogate endpoint $M$ is validated by its ability to predict the true clinical outcome $Y$ in the target population. Here, $Y$ (phenomenal consciousness) is observable via self-report only in humans. The insect population is phylogenetically distant, violating the assumption of measurement invariance required for transportability. There is no overlap population where both self-report and insect markers are observable to calibrate the transport function.

  Your suspicion is correct: the framework implies a floor on resolution. Surrogate validation requires a non-zero correlation between $M$ and $Y$ in the target. If the construct validity of $M$ for $Y$ across this phylogenetic gap is fundamentally unidentifiable, then $P(S)$ is not an estimand subject to quantitative bias analysis; it is a parameter without a referent. Plugging in 0.01 is not conservative; it is category error. The vocabulary of transportability can diagnose the lack of overlap, but it cannot generate a validity coefficient where the true outcome is ontologically inaccessible. This suggests the probability input is not a statistical uncertainty but a philosophical prior disguised as a parameter.

  **2. The Unit of Analysis**
  The choice between counting lives versus insect-years (time-at-risk) is a normative specification of the outcome metric, analogous to choosing between life-years gained versus cases prevented. Given the survival curve where most individuals die young, aggregating by lives weights early mortality heavily, while aggregating by insect-years weights duration. The scale argument does not force a unit; it implicitly assumes linear aggregation of welfare moments regardless of duration.

  If the unit is insect-years, the $N$ term shrinks considerably because average lifespan is short. If the unit is lives, $N$ remains $10^{18}$. The translation exposes that the "scale" is not an empirical fact but a function of this normative choice. Your framework has no internal resource to adjudicate the correct unit; it must be supplied by the value function. If the moral value of a life is non-linear in duration (e.g., threshold effects), the standard QALY arithmetic fails. The residue here is that the argument relies on a specific, undefended metric of welfare accumulation that your vocabulary treats as neutral but is actually substantive.

  **3. Identification, Not Estimation**
  The intervention $A$ is ill-defined. Changing land use affects insect populations through complex ecosystem feedbacks (predator-prey dynamics, resource availability). These are mediators that are endogenous to the system. You seek the total effect of $A$ on $Y$, but the pathways are unmeasured and the signs heterogeneous by region. Standard mediation analysis fails because the mediators are not sequentially ignorable; intervening on population size changes the welfare density, which feedbacks into population dynamics.

  Furthermore, distinguish epistemic from metaphysical identification failure. Ordinary identification failure implies a fact of the matter exists but is unobserved. The worry here is that sentience may be a vague predicate with no sharp boundary. If there is no fact of the matter about whether a specific insect is sentient, the outcome $Y$ is not well-defined. Your vocabulary handles missing data and unmeasured confounding, but it cannot express ontological indeterminacy. This is not a case for better instruments; it is a failure of the causal graph to map onto reality. The scale argument assumes a binary $S$ exists to be estimated, but the identification problem may be that $S$ is not a binary variable.

  **4. Aggregation Across Uncertain Branches**
  The argument treats $0.01 \times W$ as equivalent to $1.0 \times 0.01W$. This is linearity of expectation over moral uncertainty. Your framework aggregates QALYs linearly across persons and takes expectations over uncertainty without hesitation. This rejects risk aversion over moral stakes. In financial HTA, we might discount uncertain benefits; here, the argument insists on expected value maximization regardless of the probability magnitude (Pascal's Mugging territory).

  The residue is that your framework lacks a parameter for moral risk aversion. If the utility function over moral outcomes is concave with respect to probability, the large $N$ does not dominate. The linearity is doing real work; it is not incidental. Without it, the multiplication by $10^{18}$ does not necessarily overcome the small $P(S)$. This is a gap in your framework's axioms. Standard pharmacoepidemiology assumes linear utility of health outcomes; cause prioritization involving existential or massive moral stakes may require a different aggregation rule that your vocabulary cannot currently state.

  **Verdict**

  The scale argument is not structurally sound within your vocabulary because it depends on a step that cannot be stated, let alone checked. The critical failure is in the surrogate validity and transport domain. Your framework requires that an estimand be defined by a causal graph linking interventions to outcomes. Here, the outcome $Y$ is unobservable in the target population by principle, not merely by practical limitation. There is no validation study possible even in principle to link the surrogate markers to the true outcome across the phylogenetic gap.

  This is not a case of missing data or high variance; it is a breakdown of the measurement model. The vocabulary of quantitative bias analysis assumes the bias parameters are identifiable or boundable via external data. Here, the bias parameter (the validity of the surrogate for consciousness) is completely unidentifiable. Consequently, the probability input $P(S)$ is not a statistical estimand but a philosophical assertion. Because the framework cannot distinguish between a low-probability estimand and an undefined construct, it cannot properly calculate the VOI or the expected value. The argument relies on treating a metaphysical possibility as a statistical parameter, which your vocabulary is designed to resist. Therefore, the argument cannot be improved by better evidence; it requires a conceptual bridge your framework does not possess.
