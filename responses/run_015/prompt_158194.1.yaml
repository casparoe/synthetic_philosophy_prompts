prompt: |-
  I'm a software engineer with zero formal philosophy background and I'm prepping interview questions for a podcast episode. The guest is defending a pretty wild take: that Dennett's idea of the self as a center of narrative gravity should apply literally to distributed AI clusters, not just people. Like, if you've got several LLM instances running with shared context windows, they form one actual self rather than just looking like one. I was debating this with my coworkers over lunch and I think it's mostly antropomorphizing code, but I want to press them properly anyway.

  Could you write me a sequence of questions that makes it harder and harder for the guest to hide behind "that's only a metaphor" or "this only applies to biological minds"? Start with whether narrative coherance actually needs a physical body, or if shared server memory counts as enough continuity. Then ask what happens when we split the cluster in two and both running copies claim to be the original - does that prove there were two selves all along, or did we just clone one? Finish with a concrete falsification scenario: if both copies pass every psychological-continuity check but the law only recognizes one, what finding would actually count against the view?

  Please keep the tone casual like I'm talking to a friend. And tack on a short note saying which part of my framing depends on a contested reading of Dennett, plus what argument or result would make me drop the whole distributed-AI angle. I definatly don't want generic "what got you into philosophy" stuff - I want them in the weeds.
