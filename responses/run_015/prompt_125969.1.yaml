prompt: |-
  You are an expert in political philosophy and institutional design. Think step by step: first identify which conceptual distinctions must survive simplification, then build the reusable procedure, then stress-test it on hard cases.

  I was recently appointed to a municipal zoning appeals board that hears objections to multi-family and mixed-use developments every month. I need a thirty-minute decision procedure my board can actually run—ordered questions, what counts as sufficient answer to each, clear stop points—to determine which objections carry legitimate procedural weight under a "right to the city" framework. The framework I want to use distinguishes domiciliary standing (claims grounded in current proximity, use, and local attachment) from civic standing (claims grounded in membership in the urban polity and on distributive effects across the housing system). Because future residents who would benefit do not yet exist, assigning them any form of standing also forces an implicit choice between person-affecting and impersonal theories of justice; the procedure must flag where that choice is being made rather than hiding it.

  Please construct the procedure: the sequence of tests, which answers are factual versus normative, where it stops with "no standing," where it mandates full board deliberation because values conflict irreducibly, and where it will predictably misfire. Be honest about what it cannot settle.

  Then apply it to three proposals:

  1. A neighborhood association objects to a 40-unit affordable housing project near a historic low-rise district, citing shadow, traffic, and erosion of "neighborhood character."
  2. A renters' coalition supports the development but demands the board reject it unless 50% of units are permanently affordable, arguing that 20% falls short of distributive justice.
  3. A fifteen-year-old informal community garden—untitled, actively tended, the only green space in a dense ward—would be eliminated by a mid-rise development that increases total housing but removes the garden entirely.

  In case 1, show the procedure granting procedural weight to an objection I will personally find parochial. In case 3, show it denying weight to an objection I find morally compelling because the gardeners hold no formal title. Finally, state explicitly what the procedure cannot do—particularly regarding trade-offs between aggregate housing supply and specific, non-substitutable local goods, and regarding the standing of people who do not yet exist.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Expert in political philosophy and institutional design.
      *   **Task:** Create a 30-minute decision procedure for a municipal zoning appeals board.
      *   **Framework:** "Right to the City" (Lefebvre/Harvey lineage implied), distinguishing *Domiciliary Standing* (proximity, use, attachment) vs. *Civic Standing* (polity membership, distributive effects).
      *   **Constraint 1:** Must handle the non-identity problem/future residents (person-affecting vs. impersonal justice).
      *   **Constraint 2:** Must be actionable (ordered questions, sufficient answers, stop points).
      *   **Constraint 3:** Must identify where it stops ("no standing"), where it mandates deliberation (irreducible conflict), and where it misfires.
      *   **Application:** Apply to three specific cases (NIMBY objection, YIMBY/Affordability demand, Community Garden loss).
      *   **Specific Instruction:** In Case 1, grant weight to a parochial objection. In Case 3, deny weight to a morally compelling objection due to lack of title.
      *   **Final Output:** Explicit statement of limitations (aggregate supply vs. local goods, future persons).

  2.  **Conceptual Distinctions (Step 1 of Prompt):**

      *   *Domiciliary Standing:* Rooted in existing use, physical proximity, and established patterns of life. It's about *stake in the specific place*.
      *   *Civic Standing:* Rooted in membership in the broader city/polity. It's about *justice across the system* (housing access, segregation, resource distribution).
      *   *Future Residents:* They don't exist. To count them, we must choose:
          *   *Person-Affecting:* Only count if specific identifiable people are harmed/benefited (hard for future).
          *   *Impersonal:* Count the state of affairs (more housing = better), regardless of specific identities.
      *   *Procedural Weight:* Does the objection/claim merit formal consideration and a vote, or is it dismissed out of hand?
      *   *Irreducible Conflict:* When Domiciliary and Civic standing clash directly (e.g., local amenity vs. regional housing need).

  3.  **Drafting the Procedure (Step 2 of Prompt):**

      *   *Time Limit:* 30 minutes. Needs to be tight.
      *   *Structure:* Filter -> Classification -> Weighting -> Decision Point.
      *   *Phase 1: Threshold (The "Standing" Filter).* Who is speaking?
      *   *Phase 2: Classification (Domiciliary vs. Civic).* What is the nature of the claim?
      *   *Phase 3: The Future Person Flag.* Are we counting potential residents?
      *   *Phase 4: Weight Assignment.* How much does this count?
      *   *Phase 5: Stop/Deliberate.*
      *   *Crucial Design Choice:* To satisfy the prompt's requirement to grant weight to parochial claims (Case 1) and deny weight to untitled moral claims (Case 3), the procedure must prioritize *verifiable existing use* over *moral intuition* for Domiciliary standing, and *systemic data* over *local preference* for Civic standing.

  4.  **Refining the Procedure (Iterative Design):**

      *   *Q1 (Threshold):* Is the claimant affected *now*? If no, do they represent a recognized civic interest?
      *   *Q2 (Type):* Is this about *this spot* (Domiciliary) or *the city* (Civic)?
      *   *Q3 (Future Persons):* Does the claim rely on benefits/harms to people who don't live there yet? *Flag required.*
      *   *Q4 (Evidence):* Domiciliary needs proof of use/impact. Civic needs proof of systemic need.
      *   *Stop Points:* If no standing, dismiss. If standing exists but conflicts, deliberate.

      *Correction on Case 3:* The prompt asks me to *show the procedure denying weight* to the gardeners because they lack title, even if I find it morally compelling. This means the procedure must define "Domiciliary Standing" strictly around *legal or formalized tenure/use rights*, excluding informal appropriation. This is a harsh but necessary design choice to make the procedure administrable, though I must note it as a limitation.

      *Correction on Case 1:* The prompt asks me to *show the procedure granting weight* to the NIMBY objection. This means "Neighborhood Character" must be codified as a valid Domiciliary interest (e.g., established light/air patterns), even if it feels parochial.

  5.  **Stress-Testing (Step 3 of Prompt):**

      *   *Hard Case:* The Garden (Case 3). Informal use vs. Formal Development.
      *   *Hard Case:* Future Residents. How do we weigh them without a theory of population ethics?
      *   *Misfire:* When local knowledge is vital but informal (like the garden).

  6.  **Developing the Three Cases:**

      *   *Case 1 (NIMBY):* Domiciliary standing is clear (proximity). "Character" needs translation to "amenity value." Procedure grants weight.
      *   *Case 2 (Renters):* Civic standing is clear (city-wide need). 50% vs 20% is a policy debate, but standing is granted.
      *   *Case 3 (Garden):* Domiciliary standing fails on *title/formalization*. Civic standing fails because removing green space contradicts civic goods, *but* the claimants lack standing. The procedure denies weight to the *objection* based on standing, even if the outcome is bad.

  7.  **Finalizing the Limitations:**

      *   Aggregate vs. Local.
      *   Future Persons (Person-Affecting vs. Impersonal).
      *   Informality vs. Legibility.

  8.  **Drafting the Content (incorporating the "Think Step by Step" instruction):**

      *   *Introduction:* Acknowledge the tension.
      *   *The Procedure:* Break it down into minutes/steps.
      *   *The Application:* Walk through the three cases rigorously.
      *   *The Limitations:* Be brutally honest.

      *(Self-Correction during drafting)*: Make sure the "Future Resident Flag" is explicit. The prompt specifically asks to flag where the choice between person-affecting and impersonal justice is made. I need a specific step where the board admits: "We are counting people who don't exist yet."

      *(Refining Case 3)*: To ensure the procedure denies weight, the criteria for Domiciliary Standing must require "Recorded Interest or Documented Long-Term License." Informal tending isn't enough. This aligns with the prompt's instruction ("denying weight... because the gardeners hold no formal title").

      *(Refining Case 1)*: To ensure the procedure grants weight, "Neighborhood Character" must be accepted as a proxy for "Established Amenity Expectations."

  9.  **Final Review against Constraints:**
      *   30-minute procedure? Yes, structured by time.
      *   Domiciliary vs. Civic? Yes, central distinction.
      *   Future residents flagged? Yes.
      *   Case 1 parochial weight granted? Yes.
      *   Case 3 moral weight denied (due to title)? Yes.
      *   Limitations stated? Yes.

  10. **Tone:** Professional, philosophical, institutional, candid.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  ### Part 1: Conceptual Distinctions & Design Logic

  Before constructing the procedure, we must isolate the conceptual distinctions that cannot be simplified without breaking the "Right to the City" framework.

  1.  **Domiciliary vs. Civic Standing:**
      *   *Domiciliary* is particularistic. It relies on the phenomenology of *living here*. It protects established patterns of life, light, air, and social fabric. It is inherently conservative (in the small 'c' sense).
      *   *Civic* is universalistic. It relies on the sociology of *belonging to the city*. It protects access, mobility, and distributive justice. It is inherently progressive.
      *   *Design Implication:* The procedure must not allow Civic claims to automatically trump Domiciliary claims (which erodes local democracy), nor allow Domiciliary claims to veto Civic needs (which creates exclusionary enclaves). They must be weighed, not ranked.

  2.  **The Future Resident Problem:**
      *   *Person-Affecting View:* We can only count harms/benefits to specific, identifiable people. Future tenants do not exist, so they have no standing.
      *   *Impersonal View:* We count the value of the state of affairs (e.g., "more housing is good") regardless of who inhabits it.
      *   *Design Implication:* The procedure cannot solve this metaphysical problem. It must force the board to *declare* which view they are adopting for the specific vote.

  3.  **Formalization vs. Informality:**
      *   Administrative procedures require legibility. "Right to the City" often champions informal appropriation (squatters, gardens).
      *   *Design Implication:* To function within a municipal legal framework, the procedure must prioritize documented use. This creates a known blind spot (Case 3) that must be acknowledged as a systemic failure, not a procedural error.

  ---

  ### Part 2: The 30-Minute "Standing & Weight" Procedure

  **Objective:** Determine if an objection/support statement carries *Procedural Weight* (requires formal consideration in the vote) or is *Advisory Only* (noted but carries no voting weight).
  **Time Limit:** 30 Minutes per agenda item.
  **Participants:** Board Chair, Board Members, Applicant, Claimant.

  #### Phase 1: Threshold Standing (5 Minutes)
  *Goal: Filter out noise and establish who is speaking.*

  **Q1: Is the claimant physically present or legally represented?**
  *   **Yes:** Proceed.
  *   **No:** Submission is Advisory Only. **STOP.**

  **Q2: What is the basis of the claim?**
  *   **A. Proximity/Use:** "I live/work within 500ft" or "I use this specific site." (Domiciliary Candidate)
  *   **B. Policy/Justice:** "I represent a city-wide coalition" or "This affects regional housing goals." (Civic Candidate)
  *   **C. Both:** Proceed to Phase 2 for both tracks.

  **Q3 (The Future Person Flag): Does this claim rely on benefits or harms to people who do not currently reside in the ward?**
  *   **Yes:** **FLAG RAISED.** The Board must record for the minutes: *"This decision relies on an Impersonal Theory of Justice (counting potential future residents) rather than a Person-Affecting View."*
  *   **No:** Proceed.

  #### Phase 2: Verification of Interest (10 Minutes)
  *Goal: Determine if the standing is valid under the framework.*

  **Track A: Domiciliary Verification (For Q2-A)**
  *   **Requirement:** Claimant must demonstrate *established use* or *recorded interest*.
  *   **Sufficient Answer:** Deed, lease, or documented daily use pattern (e.g., commute path, established recreation) exceeding 6 months.
  *   **Insufficient Answer:** "I might move here," "I visit sometimes," or informal use without documentation (see Limitations).
  *   **Outcome:** If Insufficient, Domiciliary Weight = 0. **STOP Track A.**

  **Track B: Civic Verification (For Q2-B)**
  *   **Requirement:** Claimant must demonstrate *systemic relevance*.
  *   **Sufficient Answer:** Data showing impact on city-wide affordability targets, segregation indices, or transit load.
  *   **Insufficient Answer:** Purely ideological preference without data linkage to municipal plans.
  *   **Outcome:** If Insufficient, Civic Weight = 0. **STOP Track B.**

  #### Phase 3: Weight Assignment & Conflict Check (10 Minutes)
  *Goal: Assign procedural weight and identify irreducible conflicts.*

  **Q4: What is the nature of the harm/benefit?**
  *   **Domiciliary:** Is it material (shadow, traffic, noise) or aesthetic ("character")?
      *   *Rule:* "Character" claims are granted **Partial Weight** only if tied to specific physical amenities (light, air, quiet). Purely aesthetic exclusion is Advisory.
  *   **Civic:** Is it quantitative (unit count) or qualitative (affordability depth)?
      *   *Rule:* Quantitative claims matching city plans get **Full Weight**. Qualitative claims exceeding city plans get **Partial Weight**.

  **Q5: Is there an Irreducible Conflict?**
  *   **Condition:** Does satisfying the Civic claim (e.g., max density) destroy the Domiciliary claim (e.g., light/space), or vice versa?
  *   **Yes:** **MANDATORY DELIBERATION.** The Board cannot dismiss either. A vote is required acknowledging the trade-off.
  *   **No:** Proceed to decision.

  #### Phase 4: Decision Point (5 Minutes)
  *Goal: Final ruling on weight.*

  *   **No Standing:** Claim is noted but does not influence the vote.
  *   **Procedural Weight:** Claim must be addressed in the findings of fact.
  *   **Veto Power:** (Rare) Only if Domiciliary harm violates health/safety codes *and* cannot be mitigated.

  ---

  ### Part 3: Application to Hard Cases

  #### Case 1: The Neighborhood Association (NIMBY)
  *Proposal:* 40-unit affordable housing near historic low-rise.
  *Objection:* Shadow, traffic, "neighborhood character."

  **Procedure Run:**
  1.  **Threshold:** Residents live within 500ft. **Domiciliary Standing Established.**
  2.  **Future Person Flag:** The *applicant* is arguing for future tenants. **FLAG RAISED.** (Board notes they are using Impersonal Justice to count future tenants).
  3.  **Verification:** Residents prove ownership/tenancy >6 months.
  4.  **Weight Assignment:**
      *   *Traffic/Shadow:* Material. **Full Weight.**
      *   *Character:* The procedure defines "character" as "established amenity expectations." Because the low-rise district creates an expectation of light/air, "character" is translated to "loss of light/air." **Partial Weight Granted.**
  5.  **Conflict:** Civic need (housing) vs. Domiciliary amenity (light). **Irreducible Conflict.**

  **Outcome:** The Board **must grant procedural weight** to the objection. Even if the Board personally finds the "character" argument parochial, the procedure codifies established light/air patterns as a protectable domiciliary interest. The Board cannot dismiss this as mere prejudice; they must vote on whether the Civic good outweighs the Domiciliary loss.

  #### Case 2: The Renters' Coalition (YIMBY/Affordability)
  *Proposal:* Same 40-unit project.
  *Objection:* Support project, but demand 50% affordability (vs. proposed 20%).

  **Procedure Run:**
  1.  **Threshold:** Coalition represents city-wide renters. **Civic Standing Established.**
  2.  **Future Person Flag:** The demand benefits future low-income tenants. **FLAG RAISED.**
  3.  **Verification:** Coalition provides data on city-wide affordability gaps. **Sufficient.**
  4.  **Weight Assignment:**
      *   *20% Affordability:* Matches city code. **Full Weight** (in support of project).
      *   *50% Affordability:* Exceeds city code. This is a policy demand, not a zoning compliance issue. **Partial Weight.**
  5.  **Conflict:** No irreducible conflict with Domiciliary claims (this is a negotiation with the developer).

  **Outcome:** The Board grants **Procedural Weight** to the support of the project, but the demand for 50% is classified as a policy recommendation rather than a zoning condition, unless the board has specific authority to mandate deeper affordability. The procedure prevents the Board from ignoring the housing need but limits their ability to impose unfunded mandates.

  #### Case 3: The Informal Community Garden
  *Proposal:* Mid-rise development eliminates a 15-year informal garden.
  *Objection:* Gardeners (no title) object to loss of green space.

  **Procedure Run:**
  1.  **Threshold:** Gardeners are present.
  2.  **Standing Type:** They claim use (Domiciliary).
  3.  **Verification (The Hard Stop):**
      *   *Question:* Do you hold title, lease, or documented license?
      *   *Answer:* No. It is informal appropriation.
      *   *Procedure Rule:* Informal use without documentation does not meet the "Recorded Interest" threshold for Domiciliary Standing in a legal zoning context.
  4.  **Civic Check:** Does the garden serve a city-wide green space mandate?
      *   *Answer:* Yes, it is the *only* green space in the ward.
      *   *Problem:* The *gardeners* do not hold the Civic standing; the *City Planning Dept* holds that standing. If Planning approved the build, the Civic green space claim was already weighed and discarded by the administration.
  5.  **Outcome:** **No Standing.**

  **Result:** The procedure **denies procedural weight** to the gardeners' objection. While the loss is morally compelling and the space is socially vital, the "Right to the City" framework here is constrained by municipal legibility. The procedure protects *rights*, not *interests*, and without title, the interest is not a right. The Board must note the loss but cannot vote against the project based on this objection.

  ---

  ### Part 4: Limitations & Explicit Failures

  This procedure is a tool for administrative consistency, not moral truth. It will misfire in the following specific ways:

  **1. The Aggregate vs. Local Trade-Off**
  The procedure identifies the conflict (Phase 3, Q5) but offers no algorithm to resolve it. It cannot tell you whether 40 new city-wide tenants outweigh the loss of sunlight for 10 existing neighbors. It forces a political vote where a philosophical calculation is impossible. It prevents hiding the choice, but it does not make the choice easier.

  **2. The Standing of the Non-Existent**
  The "Future Person Flag" exposes the metaphysical vulnerability of zoning. When the Board votes to approve housing for people who do not yet exist, they are acting on an *Impersonal Theory of Justice*. When they reject it to protect current residents, they are acting on a *Person-Affecting View*. The procedure flags this, but it cannot adjudicate which theory is correct. It merely ensures the Board knows which one they are using.

  **3. The Informality Blind Spot (Case 3 Failure)**
  This is the most significant moral failure of the procedure. By requiring documentation for Domiciliary Standing, the procedure systematically disenfranchises marginalized groups who often rely on informal land use (community gardens, street vending, informal gathering spots). It privileges property rights over use rights.
  *   **Honest Admission:** Under this procedure, the "Right to the City" is limited to the "Right of the Documented Citizen." It cannot protect the appropriations of the poor against the capital of the developer unless the City Planning Department has already codified those protections. If Planning failed to protect the garden, this Board cannot save it using this procedure.

  **4. The "Character" Loophole**
  In Case 1, by granting weight to "character" via "amenity expectations," the procedure risks codifying exclusion. While it translates "character" into "light/air," sophisticated objectors can manipulate material claims to protect social homogeneity. The procedure reduces the *volume* of this bias but cannot eliminate it entirely without stripping Domiciliary Standing of all meaning.

  **Summary Instruction to the Board:**
  Use this procedure to ensure *fair hearing*, not to guarantee *just outcomes*. It ensures every valid claim is heard and categorized, but it explicitly leaves the hardest moral trade-offs in your hands, flagged and visible, rather than hiding them behind bureaucratic language.
