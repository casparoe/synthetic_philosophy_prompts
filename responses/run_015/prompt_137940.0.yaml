answer: |-
  Ash is the hard case, I'll grant you that, but you're treating traits like beads on a string that exist before the string is threaded. They don't. Ash's regret about age twenty-two isn't just a mental state; it's a specific kind of temporal binding that says *that person was me, and this person is me, and there's a moral thread connecting us.* Same with saving for retirement—that's a present sacrifice justified by a future chapter. That's narrative structure, even if Ash never writes it down. The difference between a pattern and a narrative isn't frequency; it's meaning. A pattern says Ash drinks coffee every morning; a narrative says Ash drinks coffee to steady their hands for the work they care about. When Ash spins a story on the spot and disowns it later, that instability doesn't prove the self is missing; it proves the narrative gravity is weak or contested. The unity isn't decoration because without that implicit linking of past, present, and future into a coherent agency, Ash's actions wouldn't be *actions* attributable to a person, just events happening to a body. You say the unity was already in the traits, but traits are abstractions too—you only see 'honesty' or 'loyalty' when you're already reading a life as a story.

  As for the centre of mass, you're right that lives admit many stories, but they don't admit *all* stories. The mass constrains the gravity. You can tell incompatible stories about Ash, but only up to the point where they stop accounting for the behaviour, the regret, the promises. That constraint space is where the self sits. And yes, absolutely, the self is partly a social object; why would you think otherwise? Ash's friends holding the pen doesn't dissolve Ash, it just locates the centre of gravity in the interpersonal space rather than inside the skull. The centre sits in the friction between how Ash acts, how Ash explains themselves, and how others hold them to account. It's not a fixed point, it's a dynamic equilibrium. So I'm not prescribing a way to live; I'm saying that even Ash's episodic shrug is a narrative stance, one that relies on others to hold the continuity steady when Ash won't. Does that make you worry that responsibility becomes too fragile if it depends on the audience holding the pen, or do you think that's actually how blame and praise work anyway?
