answer: |-
  **Final Exam: Reasons and Normativity**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the question below. Your response should be an argument rather than a literature review; no citations are expected.

  Fitting-attitude accounts treat facts about what there is reason to favor as what constitutes an object's having an evaluative property such as being funny or admirable, and such accounts therefore need to exclude facts that are reasons to have an attitude without bearing on whether the object has the property in question. Call this the exclusion problem. Say that the usual move is to separate reasons that bear on whether the attitude is correct or fitting from reasons that bear instead on what it would cost or gain you to have it.

  Consider two cases that this formulation handles awkwardly.

  **Case A (Deferred Access):** A poem has a funny-making feature that the reader can come to perceive only by first being amused, because being amused is what redirects her attention onto it. She is offered, as a reason to be amused now, the fact that amusement is her only route to appreciating the feature that makes the poem funny. The reason thus consists in the poem's really having the property, plus a fact about her psychology.

  **Case B (The Friend's Request):** A friend asks you, as a friend, to find her mediocre poem funny. There is no threat, bribe, or reward, and you have no evidence that it is funny. But finding her work funny is partly constitutive of the friendship, and you have reason to sustain the friendship.

  For each case, is the reason offered a right-kind or a wrong-kind reason, and does the answer depend on whether the attitude would be held because of that reason? Then the crux: Can the distinction be stated so that it yields answers to both cases, does not appeal to the very value property the fitting-attitude account is trying to analyze, and is not merely a list of cases we have independently decided how to classify? If no statement does all three, say what the fitting-attitude theorist should give up instead.

  ***

  **Model Answer**

  I argue that the standard distinction cannot be formulated without circularity or ad hocery, forcing the fitting-attitude theorist to abandon reductive ambitions. The exclusion problem reveals that reasons alone are insufficient to constitute value; we require an independent grasp of correctness to filter them.

  In Case A, the reason appears to be of the right kind because it tracks the poem's actual funny-making feature. However, it is instrumental: amusement is a means to perceive value, not a response to perceived value. If right-kind reasons must be non-instrumental regarding the attitude, this classifies as wrong-kind. If they simply track the property, it is right-kind, but this presupposes the property exists independently of the reason, undermining the constitutive claim. The tension lies in whether epistemic access counts as fittingness.

  In Case B, the reason is wrong-kind regarding the poem's merit—the poem is mediocre. Yet, it is not a pragmatic cost or gain like the demon's threat. It is constitutive of a valuable relationship. Classifying this as wrong-kind relies on the intuition that friendship doesn't make bad art funny, which appeals to the very value property (funniness) the account seeks to analyze. If we classify it as right-kind, we concede that social obligations can constitute aesthetic value, which is implausible.

  The "because of" condition suggests wrong-kind reasons are those for which one cannot hold the attitude. One cannot be amused because of a threat. But one can be amused because of friendship loyalty, or because amusement enables access. Thus, the psychological constraint fails to separate the cases cleanly. The attitude is possible in both cases, yet the normative status differs. This suggests the distinction lies not in psychological possibility but in normative relevance, which returns us to circularity.

  The crux is non-circularity. To define the right kind of reason without mentioning "fittingness" or "value," we typically rely on object-givenness. But Case A shows object-given reasons can be instrumental (access), and Case B shows state-given reasons can be constitutive (friendship). Any formal distinction either misclassifies these cases or secretly relies on whether the reason aligns with the object's value. If we define right-kind reasons as those tracking value, the account is circular: value is defined by reasons, but reasons are defined by value.

  Therefore, no statement satisfies all three conditions. The fitting-attitude theorist should give up the reductive project. They should accept that 'fittingness' is a primitive normative notion that constrains reasons, rather than trying to analyze value solely in terms of reasons. The exclusion problem demonstrates that the normativity of the attitude cannot be fully captured by the reasons for it without presupposing the value it is meant to constitute.

  ***

  **Marking Scheme (Total: 20 Marks)**

  | Point | Marks | Requirement | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Case A Analysis** | 4 | Identifies the tension between the reason tracking the property (RK) and being instrumental (WK). | Treating Case A as straightforwardly RK because it mentions the property. |
  | **2. Case B Analysis** | 4 | Identifies the tension between the reason being non-pragmatic (RK-ish) and not tracking merit (WK). | Treating Case B as straightforwardly WK because it involves friendship benefits. |
  | **3. "Because Of" Condition** | 4 | Analyzes whether the attitude can be held *because* of the reason in each case. | Ignoring the prompt's specific question about the basis of the attitude. |
  | **4. Circularity Constraint** | 4 | Explicitly addresses whether the distinction can be stated without appealing to the value property. | Defining RK reasons as "reasons related to fittingness" (begging the question). |
  | **5. Final Stance** | 4 | Provides a definite conclusion on what the theorist should give up (e.g., reductivism). | Hedging or concluding that the distinction merely needs refinement. |

  An A answer constructs a unified argument about the failure of non-circular demarcation, whereas a B answer treats the cases as isolated puzzles to be solved within the existing framework.
