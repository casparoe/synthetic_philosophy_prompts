answer: |-
  Here is the committed answer:

  The stalemate is **not verbal**. It is a **real normative split** about the teleology of mathematics. However, the debate persists only because both sides are asking an **ill-posed question**: they are fighting over which normative framework owns the exclusive right to the word "truth."

  ### 1. Verbal vs. Normative
  If this were merely verbal, the two sides could agree to use "exists*" for constructive existence and "exists**" for classical existence and proceed without friction. They do not do this. They fight because they are not arguing over definitions; they are arguing over **authority**.

  *   **The Constructivist Norm:** Mathematics is a tool for reasoning about computation and physical reality. If a mathematical object cannot be exhibited or approximated, it is useless for science and therefore illegitimate as "knowledge." For them, AC is a bug because it breaks the link between math and effective procedure.
  *   **The Classicist Norm:** Mathematics is a description of abstract ontology. Truth is independent of human capability. If a structure is logically consistent, it "exists," regardless of our ability to navigate it. For them, rejecting AC is a bug because it arbitrarily cripples the expressive power of the language.

  This is not a dictionary dispute. It is a clash of goals. One side prioritizes **fidelity to computation**; the other prioritizes **fidelity to logical completeness**. You cannot reconcile these with a definition because they are competing values.

  ### 2. The "Selection" Split
  You asked if splitting "selection" into *algorithmic-pickable* versus *structurally-guaranteed* dissolves the dispute.

  **It moves the bump; it does not dissolve it.**

  Technically, this distinction is already understood. Everyone knows AC provides a structural guarantee without an algorithm. The conflict arises because the Classicist claims the *structurally-guaranteed* kind is the **primary** sense of existence, while the Constructivist claims the *algorithmic-pickable* kind is the **only** sense of existence.

  If you formalize the split, you get two distinct logics (e.g., ZF vs. ZF+AC vs. IZF). The formal dispute ends there. But the *philosophical* dispute remains: Which logic gets to be called "Mathematics" without a qualifier? Which one gets the tenure track jobs? Which one is taught as the default?

  The bump moves from "What does AC mean?" to "Which ontology is privileged?" The war is not about the mechanism of selection; it is about the **prestige of the label.**

  ### 3. Is the Question Well-Posed?
  The question "Is the Axiom of Choice true?" is **ill-posed**.

  Truth in mathematics is relative to a system. AC is true in ZFC and false in some models of ZF. Asking if it is "really" true is like asking if "parallel lines meet" is really true without specifying Euclidean or Riemannian geometry.

  However, the question "Should mathematics be closed under effective computation?" is **well-posed**, and the answer is **no**.

  Here is the stand: Mathematics is not one thing. It is a toolkit.
  *   If you are doing computer science or physics, you should work in a constructive framework. AC is dangerous there because it promises objects you cannot simulate.
  *   If you are doing high-level analysis, topology, or algebra, you should work in a classical framework. Rejecting AC there is self-sabotage because it makes theorems needlessly difficult to state and prove.

  The stalemate exists because philosophers and foundationalists are trying to legislate a **monoculture** for a **polyculture** enterprise. They want one "True Logic" to rule them all.

  ### Verdict
  The fight doesn't move because both sides are trying to win a legislative victory for their normative preference over the entire field, rather than accepting a division of labor.

  *   **Is it verbal?** No. It is a clash of values.
  *   **Does splitting selection help?** Only technically. It fails to resolve the fight for dominance.
  *   **Is it well-posed?** The metaphysical question is nonsense. The pragmatic question is settled: use the tool that fits the job.

  The stalemate will only break when the community stops asking "Which one is Math?" and starts asking "Which math is for this problem?" Until then, they are fighting over the deed to a house that is big enough for both of them.
