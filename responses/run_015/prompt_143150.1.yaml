answer: |-
  1. The claim that psychometric g is the same quantity AI researchers mean by artificial general intelligence doesn't follow, because human g is a statistical summary of test correlations while AGI refers to functional adaptability across domains.

  2. The inference that high heritability means intelligence is what you are born with rather than something you build doesn't follow, since heritability ratios describe variance within a specific environment, not fixed genetic destiny.

  3. The assertion that rising scores say nothing about intelligence is contested, because recent meta-analyses show significant gains on highly g-loaded tests like Raven's Matrices, suggesting real cognitive shifts.

  4. The move from a statistical factor to what people really mean by intelligence is a defensible simplification, though it risks treating a descriptive pattern as a singular causal mechanism. Your bandwidth and reach distinction likely points to separate cognitive processes that factor analysis collapses into this single metric.

  5. The statement that g predicts life outcomes better than any other measure is fair within modern industrial societies, but lacks external validation since we have measured it in exactly one species on one planet. Your calibration worry is justified: generalizing from a single species risks confusing local adaptation with universal capability.
