answer: |-
  Your hypothesis that the disagreement centers on the **unit of decision** (act vs. algorithm) is technically correct, but it identifies the *mechanism* of the divergence rather than the *source*. If you stop there, you risk treating it as a mere modeling choice. The stalemate persists because the two sides are optimizing for different normative criteria, disguised as a metaphysical dispute about causation.

  Here is the diagnosis of the debate, followed by what would actually constitute progress.

  ### 1. The Diagnosis: A Normative Clash Disguised as Metaphysics

  The surface-level argument is metaphysical: *Do acausal influences exist?*
  *   **The Causal Side (CDT):** Claims that only physical causation counts. To treat a correlation as a lever is to succumb to magical thinking.
  *   **The Acausal Side (FDT/TDT):** Claims that logical necessity is as real as physical causation. If two agents run the same source code, their outputs are logically identical, regardless of spatial separation.

  However, if you look at the *arguments* they deploy when pressed, the metaphysics dissolves into a disagreement about **the goal of rationality**.

  **The Causal Side prioritizes *Causal Efficacy*.**
  Their core objection is that acausal reasoning violates the **Principle of Dominance**. In Newcomb's Problem, the money is already in the boxes. Whatever is in Box B is fixed. Taking both boxes *always* yields $1,000 more than taking one box, regardless of what the predictor did. To them, a theory that tells you to leave $1,000 on the table is recommending an act that is strictly dominated by another act. They define rationality as **making the world better through your specific physical intervention.** If your physical movement didn't cause the win, you didn't "win" via rationality; you just got lucky.

  **The Acausal Side prioritizes *Outcome Maximization*.**
  Their core objection is that causal reasoning leads to **systematic losing**. They argue that if you define "choice" narrowly as "physical muscle twitch," you are ignoring the fact that your muscle twitch is determined by your decision algorithm. If you want the million dollars, you must be the *kind of agent* who one-boxes. They define rationality as **winning the game.** If a theory makes you poorer in Newcomb scenarios, it is defective, regardless of how satisfying its causal story feels.

  **The Verbal Disagreement:**
  The word "choice" is doing too much work.
  *   For CDT, "choice" = **local physical actuation**.
  *   For FDT, "choice" = **selection of a logical output**.

  The stalemate exists because both normative criteria are intuitively compelling. We want to be the kind of people who win (FDT), but we also want to believe that our specific actions matter in the moment (CDT).

  ### 2. The Problem Definition: Which World Are We In?

  You asked if the disagreement is about which family of problems counts as legitimate. **Yes, this is the pragmatic engine of the stalemate.**

  *   **The Causal Side** views Newcomb-like problems as **pathological edge cases**. In the biological, human world, perfect predictors do not exist. Source code is not visible. Correlations are usually due to common causes (like the Smoking Lesion), not logical identity. Therefore, a theory optimized for Newcomb problems is overfitting to a dataset of zero.
  *   **The Acausal Side** (especially in AI Safety) views Newcomb-like problems as **the fundamental structure of strategic interaction**. In a world of AGI, source code *is* visible. Agents *can* simulate each other. Commitment devices *can* be hard-coded. To an AI safety researcher, ignoring acausal trade is like ignoring gravity because you are indoors; it works until you step outside (into the realm of superintelligence), at which point you fall.

  The "Smoking Lesion" example you cited is actually a pivot point here. Interestingly, modern Functional Decision Theory (FDT) **agrees with CDT** on the Smoking Lesion (smoke, because the decision algorithm doesn't cause the gene), whereas classic Evidential Decision Theory (EDT) disagrees. This shows the "acausal" side is not monolithic. The real divergence is strictly on problems involving **subjunctive dependence** (where the predictor simulates *you*), not mere statistical correlation.

  ### 3. The Hidden Formal Question

  There is a formal question doing the work, and it has been partially answered, which is why the debate feels stuck.

  The formal divergence is **Subjunctive Dependence vs. Causal Dependence.**
  *   **CDT** conditions on $do(Action)$. It surgically severs the action from its prior causes (including the algorithm that generated it).
  *   **FDT** conditions on $Algorithm(Output)$. It treats the output of the computation as the fixed point.

  **The Formal Result:**
  We already know that no single decision theory can satisfy all desirable axioms simultaneously.
  1.  If you satisfy **Dominance** (CDT), you lose in Newcomb.
  2.  If you satisfy **Newcomb** (FDT), you violate strict Dominance in the causal sense.

  This is not a bug; it is a feature of the topology of decision problems. The "hidden question" is: **Is the universe more likely to present you with Dominance problems or Newcomb problems?**

  ### 4. What Counts as Progress?

  Given this diagnosis, "proving one side right" is impossible because they are optimizing different objective functions in different domains. Progress requires **dissolving the universal claim.**

  **A. Reframing: Meta-Decision Theory**
  Progress would look like a **Meta-Decision Theory** that specifies *when* to use causal reasoning and *when* to use acausal reasoning based on the environment's properties.
  *   **Progress Condition:** A formal criterion for **Subjunctive Coupling**.
      *   If the environment contains agents that can access your source code (or high-fidelity model), switch to FDT.
      *   If the environment contains only opaque agents and physical barriers, switch to CDT.
      *   *Why this helps:* It acknowledges that CDT is a robust heuristic for the "human world" (low transparency) while FDT is a necessity for the "AI world" (high transparency). It stops the debate from being about "Truth" and makes it about "Applicability."

  **B. Distinguishing "Rationality" from "Responsibility"**
  Progress would involve separating the **instrumental value** of a decision theory from the **moral/legal value**.
  *   CDT aligns better with legal responsibility (you are responsible for your act, not your algorithm).
  *   FDT aligns better with instrumental success (you are responsible for the outcome of your logic).
  *   *Why this helps:* It clarifies that AI safety needs FDT for alignment (ensuring the AI coordinates correctly), but human law needs CDT for fairness (punishing the act, not the disposition).

  **C. The "Algorithmic Market" Argument**
  A specific formal progress point would be demonstrating **evolutionary stability**.
  *   If a population of agents competes, do CDT or FDT agents dominate?
  *   In a world with communication and pre-commitment, FDT agents can make deals CDT agents cannot (e.g., Parfit's Hitchhiker). FDT agents should theoretically out-compete CDT agents in high-transparency economies.
  *   *Progress:* Showing the **threshold of transparency** at which FDT becomes the evolutionarily stable strategy. This moves the debate from philosophy to game-theoretic ecology.

  ### 5. Why No Progress Might Be Expected

  If progress stalls, it will be because the debate is actually about **Identity**.

  *   **CDT proponents** often hold a view of agency that requires **local freedom**. To them, FDT feels like determinism dressed up as choice. If "my algorithm" decides, then "I" (the conscious experiencer) am not deciding. Accepting FDT feels like surrendering agency to logic.
  *   **FDT proponents** view the "local freedom" of CDT as an illusion. They argue that clinging to CDT is an ego-protection mechanism that sacrifices utility to preserve the feeling of being a "prime mover."

  As long as the debate is tied to human intuition about "free will" and "control," it will remain a stalemate. The "Unit of Decision" is not just a technical parameter; it is a philosophical stance on whether humans (or agents) are **actors** (CDT) or **executors of logic** (FDT).

  ### Summary Recommendation

  Your hypothesis is 80% correct. The disagreement is about the **Unit of Decision**, but that choice is driven by a deeper **Normative Priority** (Dominance vs. Winning) and a **Domain Assumption** (Human Opacity vs. AI Transparency).

  **To make progress:**
  Stop asking "Which theory is rational?"
  Start asking "**Under what environmental conditions does subjunctive dependence become a causal lever?**"

  If you can formally define the **Transparency Threshold**—the point at which an agent's source code becomes sufficiently legible to another that logical correlation becomes actionable leverage—you dissolve the metaphysical debate. You show that CDT and FDT are not enemies, but limiting cases of a single framework applied to low-transparency and high-transparency worlds, respectively. Until then, the stalemate will continue because each side is correctly solving a different problem.
