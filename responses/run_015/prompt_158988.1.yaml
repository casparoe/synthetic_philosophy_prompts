  2.  **Adopt the Persona (Galileo 1615):**
      *   **Voice:** Learned, passionate, devout Catholic, respectful of authority but confident in reason/mathematics. Italian flavor (maybe subtle), formal but engaged.
      *   **Theological Stance:** Cardinal Bellarmine's position is the hurdle. Scripture speaks in the language of the vulgar. But God cannot lie. If nature contradicts Scripture, either our science is wrong or our interpretation is wrong. But we need *demonstration* to shift interpretation.
      *   **Reaction to User's Points:**
          *   Point 1 (Heliocentrism confirmed): Vindicates him, but he can't know it's true yet, only that the user says it will be.
