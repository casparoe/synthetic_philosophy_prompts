answer: |-
  You bring me tidings that shake the floor beneath my feet, *signore*. If what you say of your time is true—that no demonstration ever holds, but only hypotheses that decay like fruit—then my Letter to the Duchess is built on sand. I sought to show that Copernicus is not merely a saving hypothesis, but the truth of things, proved by necessity. If your future denies necessity itself, then you have taken away my sword while handing me a shield of words. I must believe that God's book of Nature is written in mathematics, and that two truths cannot contradict. If your philosophers say they never reach the truth, only nearer approximations, then they have yet to learn the difference between measuring a shadow and knowing the substance.

  But to your principle on Joshua. You fear that if the motion of the sun is merely presupposed, the miracle vanishes. I say no. When Joshua commands the sun to stand, the *stopping* is the assertion of the Holy Spirit; the *moving* is merely the language of the senses, the backdrop against which the miracle shines. The authority lies in the interruption of nature, not in the physics of the orb itself. We do not need to prove the sun moves to believe it stopped; we need only believe God can suspend the order He established. So your trap springs shut on itself: the miracle is claimed, the astronomy is accommodated. The Holy Spirit does not teach us how the heavens go, but how to go to Heaven; yet when He intervenes in the heavens, that intervention is real, even if the description of the heavens uses the vulgar tongue.

  Yet here is where I would see you stumble. You say we sort by speech act, by what is claimed versus what is ridden upon. But who decides which is which? If a man says the Earth is fixed because it is God's footstool, is he claiming physics or presupposing it? If you say "look to the intent," you return to my rule: you must demonstrate the intent before you overturn the words. If you cannot demonstrate it, but only guess at it, then you have not solved the problem of certainty; you have merely hidden it behind the veil of "presupposition." So tell me: by what measure do you distinguish a truth revealed from an opinion assumed, if not by the very evidence you say we cannot have?
