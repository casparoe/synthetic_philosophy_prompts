      *   **Strategy:** Galileo needs to defend the need for *some* standard of proof while acknowledging the user's insight about language. He must protect the miracle (Joshua) while keeping the Earth moving (Psalm 93/104). He needs to challenge the user's definition of "presupposition" vs. "assertion" without conceding that Scripture can be trivialized.

  3.  **Drafting the Response:**
