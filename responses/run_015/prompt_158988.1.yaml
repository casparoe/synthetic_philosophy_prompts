  5.  **Step-by-Step Construction:**
      *   *Para 1:* React to the "no certainty" news. It shakes the foundation of his letter (which argues for demonstration). But acknowledge the user's principle on language is clever. It echoes Augustine and the Cardinal.
      *   *Para 2:* Tackle Joshua. The miracle is not presupposed; it is the *point*. The sun moving is the background; the sun *stopping* is the assertion. Therefore, the authority rests on the stopping, not necessarily the physics of the motion itself, but the interruption of it.
