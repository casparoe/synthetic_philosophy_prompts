answer: |-
  ### Design Reasoning and Scenario Selection

  **Candidate 1: The Safety Report.** A factory worker reports a machinery fault to a safety officer who relies on departmental incident logs showing a high rate of "false alarms" from that unit. I discarded this because it is difficult to make the safety officer individually impeccable; in a safety-critical environment, ignoring a live report in favor of statistical base rates often looks like culpable negligence rather than rational evidential weighting, which undermines the "no villain" constraint.

  **Candidate 2: The Housing Maintenance Request.** A tenant reports mold to a caseworker who checks a database of prior inspections marked "no evidence found." I discarded this because the hearer almost always has the option of ordering a new physical inspection, so relying solely on the contaminated archival record feels like an avoidable procedural failure rather than an inescapable epistemic trap.

  **Candidate 3: The Disability Tribunal.** A claimant testifies to functional limitations before an adjudicator who must weigh oral testimony against prior specialist medical reports. I kept this because medical records carry inherent, rational epistemic weight over self-report in this setting, making the hearer's reliance on them robustly reasonable even if the records themselves are artifacts of past systemic skepticism.

  ***

  ### The Scenario

  Elias, a former data analyst in his forties, sits before Dr. Aris, a senior adjudicator for the national disability benefits tribunal, seeking support for a debilitating neurological condition that lacks objective biomarkers. Elias is articulate, consistent, and clearly distressed, describing a specific pattern of cognitive collapse that prevents work. Dr. Aris is meticulous and sympathetic; she has no stereotypes about Elias's demographic and actively wishes to approve valid claims. However, Elias's file contains three specialist letters from five years ago, during a previous administrative regime, all concluding "no objective clinical findings" despite similar complaints. At that time, the medical standard of care for this condition systematically privileged negative physical exams over patient testimony, a protocol since retired but whose records remain valid evidence. Aris knows the old protocol was "stricter" but has no data on whether it was unjustly skeptical or merely rigorous. Facing a conflict between Elias's live testimony and the documented consensus of three prior specialists, Aris follows standard evidentiary rules: archived expert documentation outweighs uncorroborated oral assertion. She denies the claim, noting that the weight of evidence does not support the severity Elias describes.

  ***

  ### Case Analysis

  **Speaker's Claim:** Elias claims he is incapable of sustained work due to a neurological condition.
  **Hearer's Total Evidence:** Elias's coherent oral testimony vs. three archived specialist reports stating "no objective findings."
  **Resulting Credibility Judgment:** Elias's testimony is assigned lower probability than the archival records; he is judged less reliable than the prior specialists.
  **Harm:** Material (benefits denied) and Epistemic (Elias is rendered invisible as a knower of his own condition; his testimony is treated as less truth-conducive than the contaminated records).

  **Diagnosis 1: The Transactional Reading**
  *Verdict:* Not Testimonial Injustice.
  *Reasoning:* On this view, testimonial injustice requires an identity-prejudicial credibility deficit operating *in the exchange*. Dr. Aris holds no prejudice against Elias; she does not discount him because of who he is, but because of what the evidence ratio dictates. She is following rational epistemic norms (trust documented expert consensus over oral report). The harm is real, but it is a structural or distributive epistemic harm caused by the environment, not a testimonial injustice perpetrated by the hearer. The "injustice" is located in the past records, not the current judgment.

  **Diagnosis 2: The Structural/Evidential-Environment Reading**
  *Verdict:* Testimonial Injustice.
  *Reasoning:* On this view, testimonial injustice occurs when a speaker is denied the credibility they are owed, and the explanation for that deficit runs through an unjust social-epistemic order. Elias is owed credence as a reliable informant on his own capacity. He is denied this credence because the evidential environment (the medical records) is poisoned by past systematic skepticism toward his condition. Even though Aris is innocent, the *transaction* reproduces the exclusion. The injustice is not in Aris's head, but in the fact that the social system of knowledge production has stacked the evidence against Elias in a way that tracks historical prejudice.

  **The Feature Doing the Work**
  The single feature driving the divergence is the **epistemic weight of the archival record**. The transactional reading sees the record as neutral evidence that Aris rationally processes; the structural reading sees the record as a crystallized form of past testimonial injustice that continues to exert force on present credibility judgments.

  **Variation 1: Hearer Learns Evidence is Contaminated (Magnitude Unknown)**
  If Aris learns that the old protocol was "known to be biased" but no study exists quantifying the error rate, she faces an epistemic dilemma. She cannot adjust the weight of the records without guessing. If she suspends judgment, the claim stalls (harm persists). If she defaults to the records, she feels complicit. For the structuralist, the injustice remains because the speaker is still denied credence due to the environment. For the transactionalist, Aris is now in a state of culpable ignorance if she doesn't find a way to correct, shifting the verdict to individual fault.

  **Variation 2: Speaker Learns Hearer was Impeccable**
  If Elias learns that Aris was perfectly rational and free of prejudice, the *psychological* insult of being hated or stereotyped vanishes. However, the *epistemic* harm remains: he is still not believed, and his capacity as a knower is still overridden by the system. For the structuralist, this confirms that the harm is exclusion, not insult. For the transactionalist, this suggests the "injustice" label is misplaced; if no one wronged him intentionally or prejudicially, it is merely unfortunate disadvantage, like being denied a loan due to a credit score error caused by a glitch.

  **Strongest Objection from the Transactional Defender**
  "The structural reading has changed the subject. Testimonial injustice is essentially a ethical wrong involving prejudice, akin to an insult. If you remove the prejudicial attitude, you remove the distinctive wrong. What you are describing is simply 'epistemic bad luck' or 'systemic disadvantage.' Calling it testimonial injustice inflates the concept until it covers any case where a speaker is disbelieved due to historical factors, collapsing the distinction between being wronged and being unfortunate."

  **Consideration That Would Settle the Dispute**
  The dispute turns on the **primary bad** of testimonial injustice. If the primary bad is the *psychological insult* of being prejudiced against, the transactional reading wins. If the primary bad is the *epistemic exclusion* (being silenced or undercut as a knower) regardless of the cause, the structural reading wins. Empirical work on the harm suffered by speakers (does it matter to them *why* they weren't believed?) could inform this, but ultimately it is a normative question about the purpose of the concept.

  **Hermeneutical Injustice and Credibility Excess Check**
  This is not hermeneutical injustice because Elias possesses the concepts to articulate his experience; the problem is not a gap in shared understanding, but the weighting of evidence. It is not credibility excess because Dr. Aris is not receiving undue credence; the prior specialists (absent) might have, but the current exchange does not involve a hearer benefiting from unearned authority.

  **Constraint Confidence Check**
  I am highly confident on Constraints 1 (Impeccable Hearer), 2 (Deflated Judgment), 4 (Harm), and 5 (Generated Verdicts). I am least able to meet Constraint 3 (Hearer has no usable estimate of contamination) honestly. In a real-world setting, if a protocol is retired due to bias, a senior adjudicator like Aris might be expected to know the *direction* of that bias. I had to stipulate that she knows it was "stricter" but not "unjustly skeptical" to prevent her from correcting the error, which risks making her slightly culpably ignorant. This is the weakest link in the chain: maintaining her impeccability while keeping her ignorant of the contamination's direction requires a very specific, perhaps fragile, epistemic position.
