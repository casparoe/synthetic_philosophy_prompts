      *   *Variant C:* Mandatory, but sunset clause + independent metrics. (Tests Reversibility/Evidence).
      *   *Best Discriminator:* **The Audit.** If the panel blocks it even with open metrics, they are against the *surveillance itself* (Cognitive Enhancer logic). If they pass it with open metrics, they are against *opacity* (Credit Scoring logic).

  9.  **Drafting the Response:**
      *   *Tone:* Collegial, analytical, direct.
      *   *Structure:*
          1.  Acknowledge the difficulty (the "underdetermination").
          2.  Identify the Closest Analogue (Credit Scoring).
          3.  Analyze the Three Rules (where they split).
          4.  Determine the "Real" Principle (Procedural Legitimacy/Recourse).
          5.  Recommendation (Wave through with *heavy* conditions or Recommend Against based on evidence opacity). *Correction:* Given the "won't publish numbers" detail, *Credit Scoring* says "Stop."
          6.  The "Substance vs. Practice" distinction.
          7.  The Variant Case design.

  10. **Refining the Recommendation:**
      *   The prompt asks: "Wave it through, wave it through with conditions, or recommend against."
      *   Based on *Credit Scoring* (drop proxies because people can't contest): The vendor won't publish false positive rates. This means the public *cannot assess the risk*. In *Credit Scoring*, opacity was the dealbreaker.
      *   Based on *GM Maize* (wait for data): The pilot metrics are chosen by the vendor. This is insufficient data.
      *   Based on *Vaccine*: This isn't an acute epidemic. It's chronic risk.
      *   *Verdict:* **Recommend Against (in current form).** Specifically, condition it on independent verification of metrics. If they can't provide that, it's a no.
