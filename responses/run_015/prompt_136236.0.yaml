answer: |-
  This is a magnificent mess, and you are right to be worried. Your panel's track record isn't inconsistent, but it is *multivalent*. You are running on at least three different ethical engines, and they don't always fire in the same direction.

  Here is the breakdown of where you stand, which precedent controls, and how to argue it without embarrassing yourself.

  ### 1. The Closest Analogue: The Credit Scoring Model
  Of your seven cases, the **consumer credit scoring model** is the controlling precedent.

  **Why this one and not the others?**
  *   **Not the Vaccine:** The vaccine case was an *acute* emergency exception ("delay has a body count"). This proposal is for *chronic* infrastructure. The urgency is bureaucratic, not existential.
  *   **Not the Flame Retardant:** While there is a vulnerable population (over-70s, domestic violence victims), the flame retardant case hinged on the existence of a *cheap substitute*. Here, the ministry explicitly argues the substitute (pendants) is five times the cost. That's a utilitarian argument your panel has usually accepted (see: Degreasing Solvent).
  *   **Not the Mobile Masts:** Masts were allowed because the risk was weak and the mitigation (siting) was voluntary. Here, the mitigation (unplugging) destroys the utility of the device, and the "risk" (surveillance/error) is internal to the function, not external.

  **The Credit Scoring link:**
  In the credit scoring case, you didn't ban scoring because it was harmful; you banned the *proxies* because the subjects **could not see the decision, could not contest it, and could not get out of its way.**
  Apply that here:
  1.  **Cannot See:** The vendor will not publish false-positive rates.
  2.  **Cannot Contest:** If a flag is raised, who does the householder call? There is no appeals process for an algorithmic "sound of violence" flag.
  3.  **Cannot Get Out:** It is mandatory on all new devices.

  If you were consistent with the Credit Scoring ruling, you cannot approve a system where the criteria for state intervention (police/ambulance dispatch) are opaque and uncontestable, regardless of the potential benefit.

  ### 2. The Three Rules: Where They Come Apart
  You identified three heuristics. Here is how they fracture on this specific case.

  **Rule A: Severity of the Worst Case**
  *   *Prediction:* **Recommend Against.**
  *   *Logic:* If you follow *GM Maize* (containment), the worst case here is a normalized surveillance infrastructure that chills domestic life and is vulnerable to function creep (e.g., listening for political dissent later). That is irreversible. If you follow *Vaccine*, the worst case is preventable death.
  *   *Tension:* Your panel treats "structural/constitutional risk" (Maize, Enhancers) differently from "physiological risk" (Vaccine, Solvent). This is a structural risk. The Maize precedent dominates.

  **Rule B: Opt-In / Opt-Out Agency**
  *   *Prediction:* **Recommend Against.**
  *   *Logic:* If you follow *Mobile Masts*, you'd say "unplugging is an opt-out, so we're good." But if you follow *Cognitive Enhancers*, you recognize that "unplugging" isn't a real choice if the social environment mandates the tech. The Enhancers case ruled that when adoption becomes universal, *not* participating stops being a free choice. Mandatory shipping makes participation universal.
  *   *Tension:* This is the strongest signal. Your panel has consistently ruled that **coercive environments trump individual workarounds.**

  **Rule C: Reversibility (Unwinding)**
  *   *Prediction:* **Wave Through with Conditions.**
  *   *Logic:* If you follow the *Degreasing Solvent* case, you acknowledge that once an industry builds around a standard (call centers, emergency protocols), you can't easily ban it. The Solvent case said: "If it's embedded, monitor, don't ban."
  *   *Tension:* This is the only rule that suggests approval. However, note that in the Solvent case, the risk was *uncertain*. Here, the risk (privacy erosion) is *certain*, even if the safety benefit is uncertain.

  **Which one are you really running?**
  You are running **Rule B (Agency/Coercion)**, mediated by **Credit Scoring (Procedural Justice).**
  Your panel's "hidden constitution" is this: *We tolerate physical risk (Solvent, Masts) more readily than we tolerate procedural opacity or structural coercion (Credit, Enhancers, Maize).*
  The Ministry is arguing Utilitarianism (cost per life-year). Your panel's history is Deontological (rights to contest, rights to exit).

  ### 3. The Recommendation
  **Recommend Against the mandate in its current form.**

  Do not ban the technology. Ban the *policy architecture*.
  Your statement should read: *"We cannot recommend a mandatory intervention system where the triggers for state action are opaque, un-audited, and uncontestable by the subjects. This replicates the procedural flaws of the Credit Scoring case."*

  **The Conditions for Future Approval:**
  1.  **Independent Metrics:** The vendor must publish false-positive/negative rates verified by a third party, not a vendor-chosen pilot. (From *GM Maize*: verify the risk before scaling).
  2.  **Opt-Out by Default:** The feature must be opt-in, or at least opt-out without losing device functionality. (From *Cognitive Enhancers*: preserve the choice not to participate).
  3.  **Appeals Process:** A mechanism for households to contest flags. (From *Credit Scoring*: right to contest).

  ### 4. Substance vs. Social Practice
  You asked if it matters that this is a change in "what people do to each other" rather than a substance/machine.
  **Yes, it matters immensely.**

  Your previous six cases (excluding Enhancers) treated risk as something that *happens to* people (cancer, radiation, debt). This case treats risk as something *constituted by* people (surveillance, trust, domestic privacy).
  *   **The Distinction:** If you treat this as a machine risk (like the Masts), you ask: "Does the audio leak?"
  *   **The Reality:** If you treat this as a social practice (like the Enhancers), you ask: "How does knowing you are heard change how you speak to your spouse?"

  If you ignore this distinction, you will be embarrassed in five years when the technology works perfectly but domestic violence reporting *drops* because abusers know the algorithm listens and change their tactics, or because victims fear false positives will bring police who might escalate violence.
  **Advice:** Explicitly state in your minutes that this ruling sets a precedent for **"Normative Infrastructure."** You are not just regulating a device; you are regulating the expectation of privacy in the home. This elevates the bar from "Safety" to "Legitimacy."

  ### 5. The Variant Case (The Discriminator)
  You asked for a variant that tells the competing rules apart. You want to know if your panel is truly against *surveillance* or just against *bad process*.

  **Propose this counterfactual to your colleagues:**
  *"Imagine the exact same system, same cost, same coverage. But: (1) The code is open-source and audited by the state; (2) The 'listen' function is OFF by default and must be activated by the user; (3) There is a statutory right to appeal a dispatch."*

  *   **If the panel still rejects it:** You are running a **Privacy/Anti-Surveillance** principle (similar to *GM Maize*'s precautionary principle). You believe the risk is inherent to the listening, regardless of safeguards.
  *   **If the panel accepts it:** You are running a **Procedural Justice** principle (similar to *Credit Scoring*). You believe the risk is manageable if the subjects have agency and recourse.

  **My bet:** Your panel will accept the variant. This confirms your "Real Rule" is **Procedural Legitimacy**, not Luddism. This is a defensible position. It allows you to say: *"We are not against saving lives. We are against saving lives via a black box that removes citizen agency."*

  ### Summary for the Meeting
  1.  **Cite Credit Scoring:** Opacity + Mandatory + No Recourse = Rejection.
  2.  **Cite Cognitive Enhancers:** Mandatory deployment creates coercive social pressure; "unplugging" is not a valid opt-out.
  3.  **Distinguish Vaccine:** This is not an acute epidemic; we have time to get the data right.
  4.  **The Principle:** "We do not mandate algorithmic triggers for state force without independent audit and citizen recourse."

  This keeps you consistent, protects you from the "you want old people to die" attack (by offering the audited/opt-in alternative), and respects the panel's actual history of prioritizing agency over efficiency.
