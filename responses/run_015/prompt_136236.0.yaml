  5.  **Identify the Closest Analogue:**
      *   *Candidate 1: Credit Scoring.* Both involve opaque algorithmic decisions affecting life chances/safety without recourse. The "cannot contest" feature is strong here.
      *   *Candidate 2: Cognitive Enhancers.* Both create a structural shift in social norms (privacy vs. safety) that becomes coercive once universal.
      *   *Candidate 3: Vaccine.* Both argue for immediate rollout to save lives, bypassing long-term data.
      *   *Winner:* **Credit Scoring** is the strongest procedural match (opacity, lack of recourse), but **Cognitive Enhancers** is the strongest *structural* match (changing the nature of choice in a shared space).
      *   *Refinement:* The *Credit Scoring* case is the most legally/ethically pertinent because it deals with *decision-making authority* over individuals without their knowledge. However, the *Cognitive Enhancer* case captures the "mandatory environment" aspect.
      *   *Decision:* I need to argue that *Credit Scoring* is the primary analogue regarding *process*, but *Cognitive Enhancers* dictates the *outcome* (recommend against/strict conditions). Actually, looking closer: The Credit Scoring ruling was "drop the proxies" (stop the specific mechanism) because people couldn't contest. Here, people can't contest the *listening*.
      *   *Wait, let's look at the Flame Retardant.* Vulnerable population (kids vs. elderly/violence victims), substitute exists (pendants, though more expensive).
      *   *Let's look at the Mobile Masts.* Weak evidence, no substitute. Here, there *is* a substitute (pendants), just pricier.
      *   *Best Fit:* **Credit Scoring.** Why? Because the core objection in Credit Scoring wasn't just "harm," it was "procedural black box." Here, the vendor won't publish false positive rates. That's the dealbreaker based on precedent.

  6.  **Synthesize the "Three Rules" Conflict:**
      *   *Worst Case:* High (Surveillance state vs. Death). Tension between *Vaccine* (save lives) and *GM Maize* (irreversible spread).
      *   *Consent/Opt-out:* Low (Mandatory). Aligns with *Credit Scoring* (Recommend Against).
      *   *Reversibility:* Low (Infrastructure lock-in). Aligns with *GM Maize/Solvent* (Caution).
      *   *Conflict:* The *Vaccine* precedent suggests ignoring uncertainty for immediate life-saving. The *Credit Scoring* precedent suggests blocking opaque systems regardless of utility.
      *   *Resolution:* The panel seems to prioritize *agency and recourse* (Credit Scoring/Cognitive Enhancers) over *pure utilitarian calculus* (Vaccine/Solvent) when the risk is structural rather than physiological. The Vaccine case was an *emergency* exception (epidemic). This is structural infrastructure.
      *   *Prediction:* The panel is really running on **"Procedural Legitimacy."** If you can't contest the decision, you don't make it mandatory.

  7.  **Address the "Substance vs. Social Practice" Question:**
      *   Does it matter? Yes. Previous cases were about *things* entering a static world. This is about *norms* entering a dynamic social sphere.
      *   Implication: The *Cognitive Enhancer* precedent is the bridge. It acknowledges tech changes social contracts. This case is deeper—it changes the *expectation of privacy* in the home.
      *   Advice: Don't treat it just as a device risk. Treat it as a policy risk.

  8.  **Design the "Variant Case" (The Crucial Experiment):**
      *   Need to isolate the variables: Mandate vs. Default, Opacity vs. Transparency, Reversibility.
      *   *Variant A:* Opt-in default, same tech. (Tests Consent).
