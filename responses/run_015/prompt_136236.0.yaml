      *   *Flame Retardant:* Phased out. *Principle:* Low evidence threshold for harm when substitutes exist and vulnerable population (kids) involved.
      *   *Mobile Masts:* No restriction, just disclosure/voluntary siting. *Principle:* Weak evidence + high social utility + no substitute = status quo + transparency. Individual mitigation possible (move mast).
      *   *Degreasing Solvent:* No restriction, monitoring. *Principle:* Economic dependency + uncertain risk = monitor. Hard to unwind (industry gutted).
      *   *Vaccine (Epidemic):* Roll out immediately. *Principle:* Counterfactual harm (delay kills) outweighs uncertain risk. Urgency overrides standard precaution.
      *   *Credit Scoring:* Drop proxies. *Principle:* Procedural justice/fairness. Inability to contest/see/opt-out trumps lack of *demonstrated* disparate impact. Opacity is the risk.
      *   *Cognitive Enhancers:* Against. *Principle:* Coercive social dynamics (arms race/loss of free choice) trumps safety data. Structural coercion.

  3.  **Analyze the Live Case (Mandatory Audio Monitoring):**
      *   *Technology:* Always-on ambient audio classifier (local processing).
      *   *Purpose:* Safety (falls, violence, medical distress in elderly).
      *   *Mandate:* Mandatory on all new devices, 4 years to universal, no opt-out for purchaser (but can unplug).
      *   *Data:* No raw audio leaves device (claimed), only flags + 20s clip.
