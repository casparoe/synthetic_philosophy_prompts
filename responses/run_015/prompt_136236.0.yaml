  11. **Self-Correction/Nuance Check:**
      *   Did I weigh the *Vaccine* case enough? The ministry argues "5x cost per life year" for pendants. That's a utilitarian argument.
      *   Counter: The *Solvent* case allowed economic harm to override uncertain cancer risk. But the *Credit Scoring* case stopped an economic tool for procedural fairness.
      *   Which wins? Fairness/Agency seems to trump Efficiency in this panel's history (see Credit Scoring, Cognitive Enhancers, GM Maize). Efficiency only won in *Vaccine* (acute crisis) and *Solvent* (economic collapse). This is neither acute crisis nor economic collapse.
      *   So, Agency/Procedural Justice wins.

  12. **Final Polish:** Ensure the distinction between the *technology* and the *policy mandate* is clear. The tech might be okay (like the masts), the mandate is the problem (like the enhancers).

      *(Self-Correction during drafting)*: I need to be careful not to just say "No." I need to show *which precedent* drives that. The *Credit Scoring* precedent is the strongest because of the "cannot contest" feature. The vendor withholding false positive rates makes the risk unknowable, just like the disparate impact was unknowable/uncontestable in credit scoring.

