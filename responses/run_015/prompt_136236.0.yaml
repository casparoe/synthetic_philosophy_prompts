      *   *Rule 1: Severity of Worst Case.*
          *   Risk: Surveillance creep, function creep, data breaches, chilling effect on domestic life, false positives leading to police violence.
          *   Benefit: Lives saved (elderly falls, domestic violence intervention).
          *   Comparison: Like the *Vaccine* (lives at stake) but also like *Credit Scoring* (opaque algorithmic judgment).
      *   *Rule 2: Consent/Opt-out/Agency.*
          *   Feature: Mandatory on device, no opt-out for purchaser. Guests in home have no say. Can unplug (but loses device utility).
          *   Comparison: Strongest link to *Credit Scoring* (can't see/contest/opt-out) and *Cognitive Enhancers* (coercive environment). Weakest link to *Mobile Masts* (voluntary siting).
      *   *Rule 3: Reversibility/Unwinding.*
