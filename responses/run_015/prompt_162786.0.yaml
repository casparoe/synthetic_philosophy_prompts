answer: |-
  **Welcome Address for Naturalisation Ceremony**

  Good morning. For those who don't know me, I run a small volunteer group that helps newcomers settle in this county. I'm also a long way from home myself. I grew up in Coventry, a city that was flattened in the war and built back up by the people who lived there. I've been in this town for twenty years now, but I remember what it feels like to look at a new country and wonder if there's a space for you in its story.

  Today, you are writing yourselves into that story.

  I've been asked to say a few words about the document you're swearing to support. Usually, people say the founders got a great deal wrong, and we've been slowly fixing it ever since. It's a comfortable thing to say. But I've been reading Frederick Douglass lately, and he offers something sharper.

  Douglass was born into slavery. He escaped, and he became the greatest voice for freedom this country has ever known. For years, he believed the Constitution was a pro-slavery contract. But later, he changed his mind. He looked at the text and pointed out something remarkable: the words 'slave' and 'slavery' do not appear in it. Not once.

  He argued that the founders left those words out on purpose. He insisted that the Constitution, read plainly, was an antislavery document. It was the slaveholders who twisted the language to serve them. Douglass didn't say the history was clean. He knew the blood on the floor. But he argued that the law itself belonged to the oppressed, if they had the courage to claim it.

  Now, I am not a scholar. And I know that for a long time, the courts and the powerful read that document differently than Douglass did. To tell you that the text was always 'fine' would be dishonest. We know that paper can be decoration. Many of you come from places where the constitution promised liberty while the government delivered chains. You know that words on a page are nothing without the will to enforce them.

  Douglass's point wasn't that the ink was magic. His point was that the text left the door open. It didn't lock freedom out. And because it didn't lock freedom out, it became a tool that could be used to break the chains.

  That is where you come in.

  When you take this oath, you aren't just accepting a gift from the founders. You are taking up the responsibility of interpretation. You are joining the long line of people who have had to argue for what these words actually mean. Douglass showed us that the Constitution is not a statue to be admired; it is a lever to be moved.

  The federal judge sitting here ensures the law is followed. The historian here remembers how it was used in the past. But you, the new citizens, you determine what it becomes in the future. If the document is to be a 'glorious liberty document,' as Douglass called it, it is because you make it so.

  Welcome to the work. Welcome to the argument. And welcome home.

  ***

  **Note on the Reading of Douglass**

  I have sided with your interpretation. The speech leans on the view that Douglass's 'plain meaning' argument was a strategic, purposive construction rather than a strictly textualist one. He was aware that the Constitution contained compromises (the Fugitive Slave Clause, the Three-Fifths Clause) that functionally protected slavery. His insistence on the absence of the word 'slave' was a rhetorical move to reclaim the document from the Garrisonian view that it was a 'covenant with death.' He was arguing for a moral reading of the text, framed as textual fidelity, to empower abolitionists to use the federal government against slavery.

  **What would change this approach?**
  If historical evidence suggested Douglass genuinely believed the *legal machinery* of the Constitution was sufficient to end slavery without amendment or civil war, I would have to soften the speech's emphasis on 'argument' and 'work.' However, Douglass supported the 14th and 15th Amendments, acknowledging the original text required reinforcement. If one argues the original text was *inherently* anti-slavery rather than *capable of being read* as such, the speech would need to be more celebratory of the founders' intent. Given the historical record of the 3/5ths compromise, I maintain that your reading—that Douglass was making a purposive claim—is the stronger historical position.
