      *   *Part 1: God (20 mins):* Spinoza's God. Not a person, but Order. Address the "Atheist vs. Christian" myth here.
      *   *Part 2: Free Will (20 mins):* The consequence of Part 1. If laws rule everything, choices are determined. Use the Top Analogy. Address the "Nothing Matters" myth here.
      *   *Part 3: Synthesis & Discussion (10 mins):* How to live with this. The "illusion" is necessary.
      *   *Conclusion (5 mins):* The check question.

  6.  **Refining for the Audience:**
