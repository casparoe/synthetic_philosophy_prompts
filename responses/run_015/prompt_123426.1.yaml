      *   *Tone:* Conversational, not lecture-heavy.

  7.  **Finalizing the Specific Requests:**
      *   *Order:* God first, then Free Will. (Rationale: Theology drives the Physics/Philosophy).
      *   *Analogy:* Spinning top is good.
      *   *Check Question:* Needs to distinguish Determinism (caused) vs. Fatalism (inevitable regardless of cause).
      *   *Exclusions:* Quantum Mechanics (too complex, distracts from his specific belief), Detailed biography, Politics.

  8.  **Review against Constraints:**
