      *   *Verdict:* Keep it, but clarify it's a modern illustration of his idea, not necessarily a direct quote.

  4.  **Address Misconceptions:**
      *   *Misconception 1: Einstein was a standard atheist.* Address early when defining "God."
      *   *Misconception 2: Cosmic Religious Feeling = Christianity/Theism.* Address immediately after introducing the term.
