      *   **Specific Thought Experiment:** "Slow Switch" on Earth. H2O gradually replaced by XYZ over 50 years. No one notices. No chemistry knowledge. Continuous community. Some H2O remains (museum, Mars, lab).
      *   **Key Questions:**
          1.  Does "water" refer to H2O, XYZ, or both/indeterminate? Is there a specific flip point?
          2.  Which factors matter (museum, Mars, new generations learning from parents who never saw H2O)? Can meaning shift without notice?
          3.  What is the nature of the disagreement with the friend? (Metaphysical, pragmatic, or about diachronic identity of the word?)
          4.  If there's no crisp answer, does this refute externalism or just determinacy?
