answer: |-
  This is a classic "Slow Switch" case, and it cuts right to the bone of the tension between **Covariation Externalism** (meaning is determined by current causal connections) and **Historical Causal Chain Externalism** (meaning is determined by an initial baptism passed down through communication).

  You asked me to take a side. Here is my position:

  **There is a fact of the matter, and "water" continues to refer to H2O throughout the process, even at the end.** The term does not flip to XYZ. For the generation born in year forty, "water" refers to H2O, even if they have never encountered it, provided they intend to use the word as their parents did.

  Here is the concrete breakdown of why, where the theories diverge, and what carries the weight of this conclusion.

  ### 1. The Concrete Difference: Covariation vs. History

  To see where you and your friend are talking past each other, look at how each theory handles a mistake.

  *   **Covariation (Your Friend's View):** Meaning is a function of what *reliably causes* the word token in the current environment. If 99% of the time you say "water," XYZ is stimulating your senses, your word means XYZ. If the environment changes, meaning changes automatically to track it.
  *   **Historical Chain (Your View):** Meaning is a function of *lineage*. You inherit the reference from the person you learned the word from, who inherited it from theirs, back to an original "baptism" where a sample was pointed to and named. You can be 100% wrong about the properties of the stuff (thinking it's XYZ when it's H2O), but you still refer to the original stuff.

  **Where they come apart:**
  Imagine a gold prospector in 1849 finds fool's gold (pyrite) and shouts, "I found gold!"
  *   **Covariation:** In that moment, for that prospector, "gold" refers to pyrite, because pyrite is what is causing his usage.
  *   **Historical:** "Gold" refers to the metal aurum (Au). The prospector is simply *mistaken*. He is falsely believing "This pyrite is gold." He does not change the meaning of "gold" by being wrong.

  Your Slow Switch case is just the 1849 prospector scenario stretched over 50 years and applied to a whole community.

  ### 2. Addressing Your Specific Questions

  **Does "water" flip, stay H2O, or go indeterminate?**
  It stays H2O. There is no specific moment where it flips.
  Why? Because language allows for *error*. If reference shifted every time the environment changed slightly, we could never be wrong about what stuff is; we would just be talking about different stuff.
  When the taps start flowing XYZ in Year 10, the speakers are not successfully referring to XYZ. They are failing to refer to H2O (because there isn't any there) or, more accurately, they are operating under a **false presupposition** that the stuff in the tap is the same substance as the stuff in the tap in Year 0.
  The reference stays anchored to the original sample (H2O). As H2O vanishes, the word "water" risks becoming an **empty term** (like "phlogiston" or "Vulcan"), not a term that magically re-anchors to whatever is currently wet.

  **Which bits of the setup work?**
  *   **The Museum/Mars Bottles:** These are critical. As long as *any* H2O exists and is accessible in principle to the community (even if just in a museum labeled "Water - Historical Sample"), the causal chain remains unbroken. The museum sample acts as the "paradigm." It fixes the reference.
  *   **The Kids Born in Year 40:** This is the hardest pill to swallow, but on the Historical view, **they mean H2O.** They learn the word from parents who (incorrectly) believe the tap stuff is H2O. The children defer to the parents' usage. The parents intend to refer to "the same stuff our grandparents called water." That intention transmits the H2O reference, even if the children never touch H2O.
      *   *Consequence:* These children have a word that refers to a substance they have never encountered and which no longer exists in their environment. Their statements like "Water is wet" are true (H2O is wet), but their belief "The stuff in the tap is water" is false.
  *   **Can meaning shift without notice?** On the Historical view: **No.** A shift in meaning requires a new baptism or a conscious decision to redefine the term (e.g., "From now on, let's call this new slick stuff 'water'"). If nobody notices, nobody re-baptizes. Therefore, the reference doesn't shift; their *beliefs* just become increasingly false.

  **Where does the disagreement with your friend live?**
  It is a **metaphysical disagreement about the norms of linguistic inheritance.**
  *   **Your Friend** treats words like **thermometers**. A thermometer tracks the current temperature. If the temperature changes, the reading changes. If the liquid in the thermometer changes, the reading tracks the new liquid. Meaning is a tool for navigating the *present* environment.
  *   **You** treat words like **titles to property**. I own this house because I bought it from the guy who bought it from the guy who built it. I don't stop owning the house just because the bricks were slowly swapped out for concrete, provided the legal chain of title remains. Meaning is a tool for maintaining *diachronic* (across-time) communication.

  Your friend prioritizes **utility** (tracking what's actually around). You prioritize **continuity** (talking about the same things our ancestors talked about).

  **If there's no crisp answer, does that count against externalism?**
  No. It counts against **determinacy**, not externalism.
  Vagueness is a feature of language, not a bug. There is no crisp moment when a "heap" becomes a "non-heap," but "heap" isn't "in the head." Similarly, there might be a fuzzy period in Year 30-40 where it is indeterminate whether the community has abandoned the old chain or is just deeply mistaken. But indeterminacy in *when* a chain breaks is not the same as saying reference is internal.

  ### 3. Why I Take This Side (The Weight of the Argument)

  The heaviest weight in my answer rests on **the possibility of systematic error.**

  If your friend is right (Covariation), then the community in Year 50 **cannot be wrong** about the stuff in their taps being water. By definition, if "water" means "whatever causes these wet sensations now," then the tap stuff *is* water.
  This makes scientific discovery impossible. When we discovered that "water is H2O," we didn't just stipulate a definition; we found out a fact about the stuff we were already talking about. If reference tracked current causation, the discovery would have been: "In 1750, 'water' meant H2O. In 2024, 'water' means whatever is in the pipes." That destroys the idea of cumulative scientific knowledge.

  For the sentence "Water is H2O" to be a necessary truth discovered *a posteriori* (as Putnam argued), the term "water" must have referred to H2O *before* we knew the chemistry. Therefore, in your scenario, "water" must refer to H2O *even after* the chemistry changes, until the community explicitly decides to re-anchor the word.

  **What would change my mind?**
  I would switch to your friend's side (Covariation) if it could be shown that **deference is impossible.**
  If the generation born in Year 40 has *no concept* of "substance identity" or "history," and treats the word "water" purely as a label for "drinkable liquid stuff," then the historical chain is cognitively inaccessible to them. If they literally cannot grasp the intention "I mean the same stuff as my parents," then the chain snaps. In that specific case, a new baptism has occurred silently, and "water" becomes XYZ.
  But assuming normal human cognitive capacities (where we understand that words have histories), the Historical Chain holds.

  ### Summary for Your Argument

  Tell your friend this:
  "If reference tracked current causation, then whenever I am hallucinating water, I am successfully referring to whatever neural state is causing my hallucination. I can never be wrong about what I'm referring to, only wrong about its properties. But I *can* be wrong about what I'm referring to (I thought that was gold, it was pyrite). Therefore, reference must be historical, not covariational. In the Slow Switch case, the people aren't referring to XYZ; they are just systematically mistaken about where the H2O is."
