  **CITY OF HALVARD**
  **BUREAU OF HISTORICAL SERVICES**
  **TEN-YEAR STRATEGIC PLAN AND BUDGET REQUEST (FY25–FY35)**

  **TO:** City Council
  **FROM:** Director, Bureau of Historical Services
  **DATE:** October 14, 2024
  **SUBJECT:** Operationalizing Vital Capacity Through Historical Modes

  **1. Executive Summary**
  This plan outlines the Bureau's strategy to optimize the city's plastic power¹ by balancing three distinct historical modalities. Our goal is to ensure history serves life, rather than life serving history, through targeted funding allocations across three operating divisions and one specialized unit.

  **2. Divisional Operations**

  **2.1 Division of Monumental History (Inspiration & Emulation)**
  *Mission:* To identify peak achievements in Halvard's past and construct visible memorials that inspire current citizens to similar greatness.
  *Performance Indicators:* Statues erected per annum; citizen aspiration metrics; Greatness-Citation targets.
  *Recent Achievements:* Completed the Founders' Plaza; designated the Class of 1984 as "Historically Significant."
  *Policy Conflict:* The current Interval Rule mandates a forty-year latency between an act and its monumentalization. However, the Division requests approval for a "Provisional Monumentalization" loophole. This allows living Founders to be memorialized immediately to maximize motivational impact.² Critics argue this diminishes the living by comparing them to their own inflated legends, but the Division maintains that immediate feedback loops are essential for civic vigor.
  *Funding Ask:* $4.2M (Includes bronze procurement hedge).

  **2.2 Division of Antiquarian History (Preservation & Continuity)**
  *Mission:* To preserve all artifacts of local origin with equal reverence, ensuring the citizenry feels rooted in their immediate conditions.
  *Performance Indicators:* Square footage of storage utilized; artifact decay rate (target: 0%).
  *Recent Achievements:* Acquired the 1974 Municipal Waste Logs; saved the original draft of this Strategic Plan.
  *Operational Note:* Under the Equal-Reverence Rule, the Division cannot discard items based on subjective value judgments. This has resulted in a storage crisis where meeting minutes from 1922 occupy space required for 2024 records. The Division argues that discarding anything would sever the chain of piety that binds the citizen to their ancestors.
  *Funding Ask:* $3.8M (Mostly for climate-controlled warehousing).

  **2.3 Division of Critical History (Judgment & Liberation)**
  *Mission:* To bring the past to the bar of judgment to liberate the present from its injustices.
  *Performance Indicators:* Past injustices prosecuted; structural barriers dismantled.
  *Recent Achievements:* Initiated audit of Division 1's hero selection criteria; initiated audit of Division 2's hoarding protocols.
  *Operational Note:* The Division has recently begun auditing its own previous judgments to ensure no new dogmas have formed. This self-referential prosecution has slowed operational throughput but ensures we do not become slaves to our own liberation strategies.³
  *Funding Ask:* $2.5M (Legal fees and consultancy).

  **2.4 Latency Office (Sanctioned Forgetting)**
  *Mission:* To manage the active suppression of data required for civic health.
  *Status:* The Office maintains a queue and waitlist for forgetting requests. However, per intake Form L-9, the Office cannot report on its activities without creating a record of what was forgotten, thereby defeating the point of the operation. Consequently, we propose eliminating this budget line entirely. As noted by heritage consultants Lethe & Co., "Forgetting is not a loss of data, but a reduction in storage costs."⁴
  *Funding Ask:* $0.

  **3. Budget Summary**

  | Division | FY25 Request | FY26 Projection | 10-Year Total |
  | :--- | :--- | :--- | :--- |
  | Monumental | $4,200,000 | $4,500,000 | $45,000,000 |
  | Antiquarian | $3,800,000 | $4,100,000 | $42,000,000 |
  | Critical | $2,500,000 | $2,500,000 | $25,000,000 |
  | Latency | $0 | $0 | $0 |
  | **Total** | **$10,500,000** | **$11,100,000** | **$112,000,000** |

  **4. Appendix A: Risk Register**
  *The following risks identify conditions where operational success may inadvertently compromise long-term viability.*

  | Risk ID | Description | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **R-01** | **Monumental Overload:** If too many heroes are identified, current citizens may feel unable to match past excellence and cease acting entirely. | Increase Monumental budget to erect larger statues. |
  | **R-02** | **Antiquarian Paralysis:** If everything is preserved, the city may become a museum unable to accommodate living residents. | Expand warehousing boundaries into residential zones. |
  | **R-03** | **Critical Rootlessness:** If the past is fully judged and discarded, citizens may lose the soil required to grow future initiatives. | Commission Critical Division to audit the concept of "roots." |
  | **R-04** | **Latency Failure:** If nothing is forgotten, the city will lose the horizon required to plan the future. | Eliminate Latency Office budget to prioritize memory. |

  ***

  ¹ *Plastic Power:* The capacity of a culture to heal wounds and repurpose past trauma for growth.
  ² *Provisional Monumentalization:* Allows for bronze casting while the subject is still breathing, provided they sign a liability waiver.
  ³ *Self-Audit:* Current backlog includes 4,000 hours of internal review regarding the ethics of reviewing ethics.
  ⁴ *Lethe & Co.* (2023). *Memorandum on Cognitive Overhead in Municipal Planning.*
