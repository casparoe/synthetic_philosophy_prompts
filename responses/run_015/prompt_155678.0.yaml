  1. The probability that mathematical consistency and theoretical uniqueness can serve as legitimate evidential support for physical ontology, not merely for formal mathematical structure.
  2. The probability that string theory's landscape genuinely lacks any competing quantum-gravity framework that reproduces the observed Standard Model parameters with comparable parsimony.
  3. The probability that observational selection effects within a multiverse can be made epistemically tractable without a fully solved cosmological measure problem.
