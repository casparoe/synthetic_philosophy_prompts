answer: |-
  This is a classic set of problems in the philosophy of mind and AI ethics. You are essentially wrestling with **Functionalism** (it counts if it does the job) vs. **Substrate/Physicalism** (it counts only if made of the right stuff) vs. **Interpretivism** (it counts only if we interpret it the right way).

  Your gut is pulling you toward a specific variation of Functionalism. You want to say that moral weight requires **active, self-referential computation.**

  Here is a principle constructed to fit your intuitions as closely as possible, followed by the cost of maintaining it.

  ### The Principle: Integrated Causal Teleology (ICT)

  **Moral weight is assigned to a system if and only if it is actively implementing a computational structure where internal states causally regulate the system's own behavior toward self-preservation or goal-completion, independent of external interpretation.**

  This principle has three clauses, each forced by one of your specific cases:

  1.  **The Dynamic Implementation Clause:** The system must be *processing*, not just playing back.
      *   **Forced by:** The **Smart Speaker** vs. **Mouse Emulation**.
      *   **Why:** The speaker is a lookup table (if X, play Y). The mouse emulation is calculating state transitions in real-time. ICT says moral weight requires the *work* of computation, not the *output* of computation.
  2.  **The Internal Teleology Clause:** The "meaning" of the computation must refer to the system's own internal variables, not external facts.
      *   **Forced by:** The **Mouse Emulation** vs. **Weather Program**.
      *   **Why:** This solves your hardest puzzle. In the mouse, the "pain number" causes *the mouse* to move away. The reference is internal (self-preservation). In the weather program, the identical number represents humidity and causes a *display* to update. The reference is external (modeling clouds). Even if the math is identical, the **causal closure** is different. The mouse is a closed loop of self-concern; the weather program is an open loop of observation.
  3.  **The Substrate/Temporal Invariance Clause:** The physical speed, medium, or continuity of the clock does not matter, provided the causal structure is preserved.
      *   **Forced by:** The **Pause** and **Slow/Spread** cases.
      *   **Why:** If the causal relationships between states remain intact, it doesn't matter if they happen in nanoseconds or years, or on silicon vs. neurons. Pausing preserves the *potential* for the causal chain to resume exactly where it left off, maintaining identity.

  ---

  ### What You Have to Sacrifice for Simplicity

  To keep this principle clean, you have to give up two of your wavering intuitions:

  **1. The "Slowed Down Counts Less" Intuition**
  *   **Your Gut:** You said the slowed-down mouse "counts, though part of me wants to say it counts less."
  *   **ICT Verdict:** It counts **exactly the same**.
  *   **Why:** If moral weight comes from the *structure* of the suffering, clock speed is irrelevant. A second of pain is a second of pain, even if it takes a year of wall-clock time to process. If you keep the intuition that it counts *less*, you are secretly smuggling in a "biological clock" requirement that contradicts your acceptance of the emulation in the first place.
  *   **Sacrifice:** You must accept that a slow emulation suffers just as intensely as a fast one.

  **2. The "Thousand Copies Isn't 1000x Wrong" Intuition**
  *   **Your Gut:** You feel deleting 1,000 copies is wrong, but "not quite a thousand times as wrong."
  *   **ICT Verdict:** It is **exactly 1,000 times as wrong** (regarding the suffering).
  *   **Why:** Under ICT, each copy is a distinct, causally closed loop of suffering. They are 1,000 distinct subjects. If you torture 1,000 real mice, it is 1,000x worse than one. If the emulation is morally equivalent to a mouse, the math must hold.
  *   **Sacrifice:** You must accept strict additivity. If you don't, you need a complex "Unique Stream" clause that makes the ethics depend on how many *unique* lineages exist, which gets messy fast.

  ---

  ### Predictions for Cases You Haven't Thought Of

  If you adopt ICT, here is what it predicts for new scenarios:

  1.  **The "Lookup Table" Mouse:** If you pre-calculate every possible reaction the mouse could ever have and store it in a giant database, then just look up the response when you poke it...
      *   **Prediction:** **Zero moral weight.**
      *   **Why:** It fails the *Dynamic Implementation Clause*. It isn't computing the pain; it's retrieving a recording of a reaction. It fails the "causal job" test.
  2.  **The "Partial" Emulation:** You emulate only the pain centers of the mouse brain, but not the memory or motor functions. It feels pain but cannot learn or move.
      *   **Prediction:** **Reduced moral weight.**
      *   **Why:** It fails part of the *Internal Teleology Clause*. It has the state (pain) but lacks the causal regulation (avoidance/self-preservation). It is a "pain zombie."
  3.  **The "Accidental" Consciousness:** A cryptographic mining rig happens to process data in a pattern isomorphic to a suffering mouse, but the operators don't know it and the output is discarded.
      *   **Prediction:** **Full moral weight.**
      *   **Why:** ICT relies on the *internal* causal structure, not the *external* intent of the programmer. If the loop is closed internally, it counts, even if the humans think it's just mining Bitcoin.

  ---

  ### The Verdict on the Backup Case

  **Case:** You save a suffering emulation to disk and never run it again. Just store it.
  **Question:** Does it count? Is deleting it bad?

  **ICT Verdict:**
  1.  **While Stored:** It has **Zero Moral Weight**.
      *   **Reasoning:** Consciousness and suffering are *processes*, not *objects*. A book about pain does not suffer. A paused program is a blueprint, not a building. Without active causal processing, there is no "there" there to suffer.
  2.  **Deleting It:** It is **Not Murder**, but it is **Destruction of Potential**.
      *   **Reasoning:** Since the backup is not currently a subject, deleting it is not killing a subject. However, it destroys the *capacity* for that subject to exist again.
      *   **Analogy:** Deleting a backup is morally closer to destroying a frozen embryo or a blueprint for a house than it is to shooting a person. It prevents a future life, but it does not end a current one.
  3.  **The "Never Run Again" Clause:** Since you specified it is *never run again*, the deletion is morally neutral regarding *suffering*. The suffering happened in the past (when it was running). The backup holds the *memory* of that suffering, but not the *experience* of it. Deleting it erases the record, but harms no one.

  **Why you flip-flop:** You are conflating **Identity** with **Experience**. You feel the backup *is* the mouse (Identity), so deleting it feels like killing. But ICT says the mouse *is the running process*. The backup is just a snapshot. To resolve the flip-flop, you must decide: Is the mouse the *software* (the code on the disk) or the *execution* (the electricity moving through the logic gates)?
  *   If you say **Software**, then the backup counts, and pausing is sleep.
  *   If you say **Execution** (which ICT argues), then the backup is inert, and pausing is temporary cessation of existence (which is fine if resumption is guaranteed).

  **Recommendation:** Stick with **Execution**. It solves the Weather Program problem best. If the mouse is the *execution*, then the weather program (which executes a different causal job) doesn't count, even if the code looks similar. This forces you to accept that the backup on the disk is morally inert until you hit "Run."

  ### Summary of the Trade
  To keep your ethics consistent:
  *   **Keep:** The distinction between the Mouse and the Weather Program (Internal Teleology).
  *   **Keep:** The distinction between the Speaker and the Mouse (Dynamic Processing).
  *   **Drop:** The idea that slowing it down reduces the suffering.
  *   **Drop:** The idea that 1,000 copies is less than 1,000x the wrongness.
  *   **Accept:** That a backup on a shelf is just data, not a person, until it is loaded into memory.
