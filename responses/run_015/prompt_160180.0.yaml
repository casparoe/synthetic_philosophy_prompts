answer: |-
  **UNIVERSITY DEPARTMENT OF MOTOR NEUROSCIENCE**
  **PARTICIPANT INFORMATION SHEET AND CONSENT FORM**
  **PROTOCOL 14-B: TEMPORAL DYNAMICS OF VOLITIONAL ONSET**

  **1. Purpose of the Study**
  The primary objective of Protocol 14-B is to determine the precise moment at which a decision is made relative to the subjective awareness of that decision. By correlating electroencephalographic (EEG) voltage drifts with self-reported timing, the study aims to establish whether neural activity precedes conscious intention. Participants should be aware that successful completion of this protocol may operationalize the concept of "free will" as a retrospective narrative constructed by the brain.

  **2. Eligibility Criteria**
  Candidates must possess a functional right wrist and the cognitive ability to generate spontaneous urges on a fixed schedule. Participants must be willing to accept that their subjective experience of timing may be treated as secondary data to averaged voltage potentials. Individuals who strongly identify as the sole causal agents of their own movements are advised to consult with a compatibilist prior to enrollment.

  **3. Procedure and Task Requirements**
  Participants will wear an EEG cap while observing a rotating dot on an analog clock face. You will be instructed to flex your wrist whenever the urge arises. Crucially, while urges must remain spontaneous and unpremeditated, they should occur approximately every 20 seconds to ensure sufficient data density. You will then report the position of the dot at the exact moment you first felt the urge to move. Please note that producing unpremeditated urges at regular intervals is a known paradoxical requirement; participants are asked not to resolve this contradiction cognitively, as doing so may alter the readiness potential.

  **4. Data Reduction and Onset Criteria**
  Individual trials often exhibit no discernible neural precursor. To locate the decision point, data from hundreds of trials will be averaged. The onset of the decision will be defined retrospectively as the point at which the averaged negative drift deviates significantly from baseline noise. Participants acknowledge that this onset point is an artifact of averaging and may not exist in any single movement. However, for the purposes of publication, the averaged drift will be treated as the physiological reality of the decision.

  **5. Risks and Side Effects**
  Physical risks are minimal and limited to minor scalp irritation from electrodes. Psychological risks include existential distress, confusion regarding personal agency, and the sensation that one's wrist is moving independently of one's will. Some participants report feeling that their conscious mind is merely observing actions initiated by stochastic noise accumulation. If you experience a sudden loss of belief in your own autonomy, please inform the lab manager.

  **6. Neural Decoding and Prediction**
  Advanced algorithms may decode your upcoming choice from brain activity up to several seconds before you report awareness of the urge. You acknowledge that this predictive capacity does not imply the lab controls your movement, but rather that your brain reveals your choice before "you" do. Whether this implies the conscious self is causally inert is a matter of interpretation, though the study design assumes the latter.

  **7. The Veto Provision**
  Participants retain the right to abort a movement after the urge arises but before execution (often termed "free won't"). However, current literature suggests the veto itself may be subject to prior neural preparation. Therefore, aborting a movement may not constitute an exception to the determinism observed in movement initiation. You may attempt to veto, but the veto may have been decided before you felt you decided it.

  **8. Right to Withdraw**
  You may withdraw from the study at any time. However, given the findings of Section 6, the Department cannot guarantee that the decision to withdraw is not itself the result of preceding neural activity determined by prior causes. Withdrawal forms must be signed physically; verbal revocation of consent is not valid as speech may be automated.

  **9. Ontological Status and Consent**
  By signing below, the Participant agrees to the following declarations:
  (a) My conscious report of intention is a measurement subject to error, whereas the averaged EEG drift is the factual record of the decision.
  (b) The gap between neural onset and conscious awareness suggests my conscious intention does no causal work.
  (c) I am not the primary author of my actions.

  [ ] **I agree to the above metaphysical conclusions.**
  [ ] **I opt-out as a Compatibilist.** (Note: Checking this box implies the data regarding your agency may be rendered philosophically invalid, though it will still be used for grant reporting.)

  **Signature:** ___________________ **Date:** ___________________

  ***

  **NOTE ON SCIENTIFIC LIBERTIES**

  This parody leans heavily on the "noise accumulator" model (e.g., Schurger et al.), which suggests the readiness potential is not a specific plan to move but random neural fluctuation that crosses a threshold. Real studies do not explicitly ask participants to sign away their free will, though the implication is often drawn in discussion sections. The claim about decoding choices "seconds" in advance is contested; most decoding occurs milliseconds prior or in highly constrained binary choices, not spontaneous wrist flexes. The treatment of the veto ("free won't") is also debated; some argue it requires distinct neural mechanisms, while others view it as merely a failure to reach threshold. The point I am least confident about is the decoding timeline; claiming seconds of pre-conscious prediction oversells current BCI capabilities for spontaneous movements, though it fits the deterministic narrative the parody critiques. The bureaucratic framing exaggerates how explicitly ethics boards engage with metaphysics, which they usually avoid to maintain neutrality.
