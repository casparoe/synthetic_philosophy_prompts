answer: |-
  1. Conceptual brainstorm
  The primary trap is "moral arithmetic"—the assumption that suffering is quantifiable like currency. If we treat atrocity as a single scale of severity, we inevitably erase the specific texture of each event. A death toll counts bodies but ignores intent, duration, or cultural destruction. The procedure must preserve the distinction between *structural comparison* (how violence was organized) and *hierarchical ranking* (whose pain matters more).

  A niche concept essential here is **Dimensional Asymmetry**. Atrocities are not points on a line; they are vectors operating on different axes (time, intimacy, bureaucracy, ideology). Comparing the Holocaust to the Atlantic Slave Trade linearly is like comparing the weight of a song to the length of a rope. The tool must detect when a proposal tries to flatten these multi-dimensional events into a single metric for funding or space. If the comparison requires ignoring unique dimensions to make the math work, it is ethically inadmissible. We must protect the integrity of the specific harm over the convenience of the exhibit layout.

  2. The decision proceedure
  **The Comparative Harm Protocol (CHP)**

  **Step 1: The Purpose Test**
  Ask: "Is this comparison needed to explain history, or to allocate resources?"
  *   **Yes (Explain):** Proceed to Step 2.
  *   **No (Allocate/Rank):** **HALT.** Do not compare. Funding and square footage cannot be justified by ranking suffering.
  *   *Test Sentence:* "We are comparing these to learn, not to judge worth."

  **Step 2: The Dimensional Fit**
  Ask: "Are we comparing the same type of mechanism?"
  *   **Yes (e.g., logistics vs. logistics):** Proceed to Step 3.
  *   **No (e.g., death toll vs. bureaucratic intent):** **HALT.** This is Dimensional Asymmetry. You are comparing apples to grenades.
  *   *Test Sentence:* "Does this comparison match like with like?"

  **Step 3: The Dignity Check**
  Ask: "Would survivors or descendants feel their specific loss is being diminished or ranked?"
  *   **No:** Proceed to Step 4.
  *   **Yes/Unsure:** **HALT.** If the comparison creates a hierarchy of victimhood, it is inadmissible.
  *   *Test Sentence:* "Does this imply one group suffered 'more'?"

  **Step 4: The Utility Filter**
  Ask: "Does this comparison reveal something neither event shows alone?"
  *   **Yes:** **Admissible.** Proceed with caution.
  *   **No:** **Inadmissible.** It is gratuitous ranking.
  *   **Maybe:** **Needs-Judgment.** Consult community stakeholders.

  **Hard Cases:** If Step 3 triggers a "Maybe," the board must vote. A tie means the proposal is rejected. The default position is non-comparison.

  3. Three worked cases
  **(a) Rwandan vs. Cambodian Genocide (Exhibit Square Footage)**
  *Proposal:* Allocate 30% less space to Cambodia because the death toll was lower than Rwanda.
  *Step 1 (Purpose):* The goal is resource allocation based on severity.
  *Verdict:* **HALT.** The CHP forbids using suffering metrics to decide square footage. This turns tragedy into a budget line item. The board cannot approve this.

  **(b) Holocaust vs. Atlantic Slave Trade (Systems Gallery)**
  *Proposal:* Compare the bureaucratic record-keeping of the Nazis to the ledger systems of slave traders for a "Systems of Violence" section.
  *Step 1 (Purpose):* Educational (explaining mechanisms). **Pass.**
  *Step 2 (Dimensional Fit):* Both compare administrative logistics, not suffering intensity. **Pass.**
  *Step 3 (Dignity):* Risk exists. Descendants might feel slavery is being "normalized" as bureaucracy. **Needs-Judgment.**
  *Step 4 (Utility):* Shows how modernity enables evil. **Pass.**
  *Verdict:* **Admissible with Caveats.** Labels must explicitly state this compares *methods*, not *severity*. Community consultation required to ensure Step 3 concerns are mitigated.

  **(c) Victim Suffering (Memorial Plaque)**
  *Proposal:* Wording stating Event A involved "unparalleled suffering" compared to Event B.
  *Step 1 (Purpose):* Educational? Maybe, but implies ranking. **Warning.**
  *Step 2 (Dimensional Fit):* Comparing subjective suffering. **Fail.** Suffering is not a uniform dimension.
  *Step 3 (Dignity):* High risk. Descendants of Event B will feel ranked as "less suffering."
  *Verdict:* **Inadmissible.** This is the answer the board won't like. They want to honor victims by calling their pain "unique" or "worst." The procedure says this language violates the Dignity Check. You cannot validate one group's pain by implicitly demoting another's. The plaque must stand alone without comparative superlatives.

  4. Limits, misfires, and judgment calls
  This procedure cannot solve political pressure. If a donor demands a ranking, the CHP says "no," but the board may lack the courage to enforce it. Step 3 (Dignity Check) is the weakest link; it relies on the board's intuition about survivor sentiment, which can be biased or uninformed. This step is essentially judgment dressed as a rule.

  Furthermore, the tool fails when histories are entangled, such as colonial violence leading directly into genocide. The "Dimensional Fit" may break down because the events are causally linked, not separate vectors. In these cases, the CHP should trigger a "Needs-Judgment" flag immediately.

  Any proposal that triggers a "HALT" but has strong community support should be kicked upstairs to an external ethics committee. The board should not bear the sole burden of refusing comparisions that communities themselves might request. Finally, the procedure assumes good faith; it cannot stop bad actors from using approved comparisons to smuggle in hierarchical messaging later. Continuous review is required.
