      *   *Relationship with Will:* Represents the integration of passion, aesthetics, and morality.
      *   *Finale:* "Unhistoric acts." She doesn't become a public reformer but a supportive wife/mother who influences locally.
      *   *Contrast:* Rosamond (aesthetic/social focus, lacks moral depth) vs. Dorothea (moral focus, lacks social ease).

  4.  **Synthesize: Wolf vs. Eliot:**
      *   *Agreement:* Eliot agrees with Wolf that a *misguided* pursuit of moral sainthood (Dorothea's early phase) is self-defeating and flattening. Dorothea's "saintliness" makes her blind (Casaubon) and severe (with Celia).
      *   *Disagreement/Nuance:* Wolf worries the saint *cannot* have non-moral interests. Eliot suggests the saint *must* have them to be effective. Dorothea's redemption comes not through *more* moral rigor, but through embracing particular love (Will) and accepting limits.
      *   *The "Hidden Life":* Wolf worries saints are boring. Eliot argues the "hidden life" is where the *real* good happens, even if it looks boring to history. This reframes "boring" as "essential."

  5.  **Drafting the Argument (Section by Section):**

      *   *Introduction:* Acknowledge the pairing. It's a strong one. Wolf provides the philosophical vocabulary; Eliot provides the narrative complexity.
      *   *Point 1: Dorothea as the "Rational Saint" (Supporting Wolf).* Focus on the Casaubon marriage. Her moral ambition crowds out her own happiness and perception. She suppresses her aesthetic side (jewelry, dress) for a "higher" purpose. This confirms Wolf: moral zeal can distort reality.
      *   *Point 2: The Necessity of Non-Moral Goods (Pushing Back).* Dorothea needs Will. Will represents art, beauty, spontaneity. Without him, her morality is sterile. Eliot argues morality *needs* non-moral fuel. Wolf says they compete; Eliot says they symbiotically relate.
      *   *Point 3: Rosamond as the Counter-Image.* Rosamond is all non-moral excellence (charm, music, looks) with no moral core. She is interesting but destructive. This suggests Wolf's fear of the "boring saint" might be preferable to the "charming egoist."
      *   *Point 4: The Finale and "Unhistoric Acts."* This is the big philosophical addition. Wolf evaluates the *life* of the saint. Eliot evaluates the *impact*. The impact is diffuse, invisible, and relational. It redefines "success" away from the "epic" (St. Theresa) to the "domestic."
      *   *What Middlemarch Adds:* Context and Consequence. Wolf is abstract; Eliot shows the *social ecology* of goodness. You can't be good in a vacuum.

  6.  **Refining the Interpretation (Self-Correction/Nuance):**
      *   *Caution:* Is Dorothea actually a "Moral Saint" in Wolf's sense? Wolf defines it as maximizing moral good at every turn. Dorothea often fails at this because she's misguided. She *wants* to be a saint, but the novel shows the *attempt* is what causes the trouble, not the success.
      *   *Correction:* Frame it as Dorothea aspiring to Wolf's "Moral Saint" ideal, and the novel critiquing that *aspiration* rather than the result of actual sainthood.
      *   *Key Scene:* The jewelry scene (rejecting Celia's offer) shows her asceticism. The final meeting with Rosamond shows her moral greatness *through* empathy, not rule-following.

