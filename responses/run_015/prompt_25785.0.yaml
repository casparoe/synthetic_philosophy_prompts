      *(Self-Correction during drafting)*: Make sure to explicitly mention Wolf's distinction between the "Loving Saint" and "Rational Saint." Dorothea starts as a Rational Saint (duty-bound) and moves toward something more integrated, though not quite a "Loving Saint" in Wolf's sense (she still struggles).

