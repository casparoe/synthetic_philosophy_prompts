  2.  **Deconstruct Susan Wolf's "Moral Saints":**
      *   *Thesis:* A moral saint is someone whose every action is as morally good as possible.
      *   *Problem:* This leaves no room for non-moral virtues (wit, style, hobbies, personal projects) unless they serve morality.
      *   *Result:* The saint becomes boring, one-dimensional, or lacks a healthy personality.
      *   *Types:* Loving Saint (finds joy in morality) vs. Rational Saint (sacrifices inclination for duty). Dorothea seems closer to the Rational Saint initially, perhaps evolving.

  3.  **Deconstruct *Middlemarch* (specifically Dorothea):**
