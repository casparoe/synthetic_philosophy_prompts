answer: |-
  ### Stage 1: The Narrow Frame Problem (The Qualification of Non-Change)

  **Philosophical Formulation:** In a formal theory of action, how do you specify what an action *does not* change without writing an infinite list of "frame axioms" (e.g., "If I move the block, the color of the wall does not change")?

  **Engineering Translation:** This corresponds to your **persistence model and structural sharing**.
  In your system, the "frame axiom" is the default state of the memory manager. A cell is assumed *not* to change unless it is explicitly in the write-set of the invalidation cascade. You do not need to declare that Cell Z is unaffected by an edit to Cell A; you simply do not draw an edge from A to Z.

  **Is this a real solution?**
  Yes. In philosophy, frame axioms are logical propositions that burden the reasoner. In your architecture, "no change" is a physical property of the pointer structure. Structural sharing *is* the implementation of inertia. When you create a new version of the document, unchanged nodes are literally the same objects in memory as the previous version. You have not redescribed the problem; you have engineered a substrate where the cost of asserting "nothing changed" is O(1) (pointer equality) rather than O(N) (scanning properties). The "frame" is hard-coded into the memory layout.

  ### Stage 2: The Broad Frame Problem (Relevance and Context)

  **Philosophical Formulation:** Given a massive database of beliefs, how does an agent determine which beliefs are *relevant* to a new event without checking every single one? (e.g., If I pull the trigger, I need to update "gun is fired," but do I need to update "the moon is made of cheese"?).

  **Engineering Translation:** This corresponds to **dependency graph traversal**.
  Your "database of beliefs" is the cell graph. Your "new event" is an invalidation signal. The "relevance check" is the reachability algorithm that walks the graph to find the transitive closure of dirty nodes.

  **Is this a real solution?**
  Yes, conditional on graph accuracy. The graph acts as a pre-computed relevance index. You avoid the combinatorial explosion of checking every cell because the edges *encode* the causal relationships. However, this solution relies entirely on the completeness of the edge set. If an edge is missing (a plugin reads a cell without declaring it), the relevance algorithm fails, and you get stale data. In the philosophical version, the agent must *infer* the edges. In your version, the edges must be *supplied*.

  ***

  ### Residue Report

  #### 1. What translates cleanly, term for term.
  *   **Action/Event:** User edit or Plugin execution.
  *   **State/World:** The immutable snapshot of the cell graph.
  *   **Frame Axioms:** The absence of edges in the dependency graph.
  *   **Inertia:** Structural sharing (unchanged nodes point to previous versions).
  *   **Relevance:** Graph reachability (transitive closure of invalidation).
  *   **Consistency:** Cache coherence (no node reads a stale upstream version).

  #### 2. What translates only with distortion (The Smuggled Assumption).
  Your guess is correct: the crux is the **Closed World Assumption (CWA)**.
  *   **The Distortion:** Your vocabulary assumes the ontology is fixed and authored. You treat the dependency graph as a *specification* of reality. If a plugin violates the graph (reads without declaring), you classify this as a **bug**.
  *   **The Philosophical Reality:** An embedded agent faces an **Open World**. It cannot treat unexpected causal links as "bugs" because it did not author the physics of the environment. It must treat them as **discoveries**.
  *   **Kind vs. Degree:** This is a difference in **kind**. In your system, causality is explicit (declared interfaces). In the general frame problem, causality is implicit (observed correlations). Your engineering solution works *because* you have outsourced the frame problem to the plugin developers. They must solve the frame problem (decide what matters) before they write the code. When they fail, their failure manifests as your on-call load. You have not solved the frame problem; you have **contracted it out**.

  #### 3. What cannot be expressed in your vocabulary at all.
  *   **Semantic Entailment:** Your graph knows that `Cell_A` points to `Cell_B`, but it does not know *why*. It cannot infer that changing a "Price" cell might invalidate a "Risk Assessment" cell unless an edge exists. An intelligent agent uses semantic context to infer edges on the fly (e.g., "Moving a vase near the edge of a table increases the probability of it breaking"). Your system has no mechanism for probabilistic or semantic inference.
  *   **Novelty:** Your system cannot handle a new type of causal relationship without a schema migration or plugin update. If a user introduces a new concept (e.g., "Time of Day") that affects existing cells, the graph does not auto-wire itself. The philosophical frame problem is largely about handling novelty without explicit reprogramming.
  *   **The "Why" of Invalidation:** You track *that* a cell is dirty, not *why*. If a recomputation fails, you can trace the dependency, but you cannot trace the *intent*. This makes debugging "lying plugins" hard because the system sees a data flow violation, not a logical contradiction.

  ***

  ### Judgment

  The residue is a **blind spot** in how you think about software systems, specifically the assumption that **causality is always declarative**.

  The philosophical claim is well-defined: it is the problem of reasoning in an open world with implicit connections. Your system does not solve this; it sidesteps it by enforcing a closed world. The claim that "the Frame Problem is your problem" is true, but only at the boundary where your closed world leaks—specifically, in the **plugin validation layer**.

  Your engineering answer (graph traversal + persistence) is a real solution for the *internal* core, but it is not a solution for the *system-as-a-whole* when third parties are involved. The difficulty of the Frame Problem has not vanished; it has been **relocated** from the runtime recomputation engine to the interface enforcement and sandboxing layer. Your on-call load *is* the Frame Problem, manifesting as the cost of verifying that the closed-world assumptions hold true against untrusted agents.

  \answer{relocated}
