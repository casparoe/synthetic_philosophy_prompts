answer: |-
  Democratic backsliding survives as a coherent analytical category only if we ruthlessly prioritise the reduction of electoral contestation and institutional self-entrenchment over substantive policy outcomes, though this necessity renders it blind to certain forms of rights erosion that do not immediately imperil incumbency. To function as anything other than a partisan epithet, the concept must satisfy five specific desiderata, divided between non-negotiable structural requirements and contingent theoretical preferences.

  The first non-negotiable requirement is **pathway neutrality regarding formal legality**. An adequate theory must register democratic degradation achieved through legal means just as readily as illegal usurpation. This distinguishes the concept from traditional coup studies and is motivated by the Hungarian and Turkish cases, where Fidesz and the AKP utilised supermajorities and emergency decrees respectively to rewrite the rules of play without technically breaking the law at the moment of enactment. If operationalisation demands formal illegality, it fails to capture the central puzzle of modern authoritarianisation: the use of democratic mandates to end democracy. This is a baseline requirement for any camp, though substantive-democrats often strain against it when legal reforms align with populist mandates.

  The second non-negotiable requirement is **contestation reduction**. The core mechanism must be the lowering of the uncertainty of electoral outcomes, ensuring incumbents cannot be removed via the ballot box. This distinguishes backsliding from ordinary policy shifts or unpopular governance. It relies on a minimal-procedural account of democracy, where the existence of rights is secondary to the institutional capacity to sanction leaders. This is indispensable because without it, any unpopular reform becomes backsliding. However, this creates tension with the substantive-democratic camp, which wishes to include the erosion of minority rights even if elections remain competitive.

  The third desideratum, preferred by **behavioural-institutionalists**, is **strategic intent**. The theory should distinguish between institutional decay caused by incompetence or neglect and erosion driven by a coordinated strategy to monopolise power. This helps separate the Law and Justice party's judicial overhaul in Poland, which was explicitly designed to disable checks and balances, from institutional stagnation found in established democracies. While analytically useful for causality, this is not non-negotiable for measurement; requiring proof of intent often relies on inferred motives that are difficult to code cross-nationally, risking subjective bias.

  The fourth desideratum, championed by **liberal-proceduralists**, is **normative violation independent of formal rules**. This is necessary to accommodate the American debate, where executive norm-breaking occurs without constitutional amendment. It demands that unwritten rules of forbearance and mutual toleration be treated as constitutive of the regime. However, this is the weakest link for cross-national analysis. Norms are culturally specific; what counts as hardball in Washington may be standard procedure in Westminster or Berlin. Including this risks importing Anglo-American institutional expectations into contexts where informal rules operate differently, making it a contingent preference rather than a universal requirement.

  The fifth desideratum is **asymmetrical polarisation as a confounding variable**. The model must distinguish between backsliding and high-intensity competition where both sides adhere to the rules. Polarisation often accompanies backsliding, but treating it as synonymous conflates the symptom with the disease. A robust theory must show how polarisation is weaponised to justify institutional capture, rather than treating disagreement itself as degradation. This is preferred by behaviouralists but often ignored by index-based measures that penalise polarisation per se.

  There is a jointly unsatisfiable subset between **value-neutral measurement** and **capturing substantive harm**. If one insists on value neutrality to avoid partisan accusation, one must rely on procedural metrics (elections, court independence). This inevitably misses substantive harms, such as the erosion of media freedom or civil rights, until they are severe enough to impact electoral contestation. Conversely, if one incorporates substantive rights to capture harm early, one must define which rights matter, inevitably importing liberal biases that opponents will dismiss as partisan. You cannot have a concept that is both perfectly neutral and sensitive to substantive democratic quality; one must be sacrificed. For comparative utility, neutrality regarding policy outcomes must be preserved, even if it delays recognition of backsliding until procedural locks are engaged.

  Existing families of approach fare unevenly against these criteria. **Index-based measurements** (such as large-N datasets) satisfy pathway neutrality and contestation but often fail on strategic intent and lag significantly behind reality, only registering backsliding after rights scores plummet. **Actor-focused frameworks** excel at identifying strategic intent and norm violation, capturing the Hungarian and American cases well, but they struggle with cross-national operationalisation and often conflate polarisation with backsliding. **Minimal-procedural accounts** are the most robust against the charge of partisanship and satisfy the non-negotiables, but they are blunt instruments that may miss the Turkish emergency-decree pathway until it is too late to reverse. Ultimately, the concept remains viable only if we accept a minimalist definition that prioritises the mechanics of removal over the quality of governance, acknowledging that this preserves analytical rigour at the cost of early warning sensitivity.
