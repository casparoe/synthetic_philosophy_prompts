  5.  **Addressing Specific Clinical/Edge Cases:**
      *   *Depersonalization:* Usually characterized by *low precision* on self-predictions, not necessarily timescale mismatch. If precision is low, the error signal is ignored. Your theory needs to explain why low precision = "unreal self."
      *   *Ketamine:* Disintegrates the hierarchy. Top-down priors lose grip. This fits "loss of long-term prediction," so it supports the theory.
      *   *Schizophrenia (Frith):* Deficit in efference copy/self-monitoring. Short-term prediction failure. Does this create a self? No, it disrupts agency. This might hurt the theory if selfhood requires *failed* long-term prediction but *successful* short-term prediction.
