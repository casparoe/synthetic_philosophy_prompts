prompt: |-
  I work as the sole analyst on a small event-driven account — roughly nine million dollars of a family office's money — and three or four times a week I have to size a position on a discrete, more-or-less binary outcome: a central-bank decision, a merger-arbitrage spread, the resolution of a piece of litigation. My probability estimates come from an internal forecasting panel of four people whose track record I have audited: they are well calibrated in the middle of the range and badly overconfident in the tails, so that outcomes they call 90% confident land perhaps 60% of the time, and their long-shot enthusiasm is worth almost nothing. The account has three constraints that I cannot design around. Any single position above one and a half percent of the bankroll has to be signed off by an investment committee that meets weekly, is comfortable with fractions and percentages, and is not going to follow an argument about ergodicity. The evaluation horizon is twelve months with quarterly reviews, and several of the contracts I care about resolve after that window closes. And if the account ever falls thirty percent below its high-water mark, the mandate is withdrawn automatically — an absorbing barrier, not a soft stop.

  What I want from you is a written sizing procedure my committee and I could actually run in fifteen minutes, in a fixed order, on a proposal described by four inputs: the contract price, the panel's probability estimate, the time to resolution, and whatever is already on the book. For each step say what counts as a sufficient answer, where the procedure terminates with a zero stake, where the stake is capped by the mandate rather than by the criterion, and where it has to hand the decision to a person because the question is one of values — for instance how much weight to give a small probability of breaching the drawdown barrier, or whether to take a position that is right on the merits but that I cannot explain in two sentences to the people who sign it. I would like the procedure to be explicit about the following, because these are the places I keep losing the thread: that the criterion is about time-average growth rather than expected value, and how to put that to a committee that thinks in expected returns; that the textbook stake is derived in the absence of a barrier and is therefore strictly wrong for me, and what a defensible approximate correction looks like rather than an ignored problem; when it is legitimate to size each bet on its own rather than jointly with the rest of the book, and what to do when it is not, including bets that resolve after the evaluation window and bets correlated with positions I already hold; how to shrink stakes for estimation error in a way that is tied to the panel's recorded miscalibration rather than to a rule of thumb like halving; and what to do on the days when nobody will commit to a number at all. I have a friend at a larger shop who insists that maximizing expected log wealth and maximizing long-run growth are the same claim and that risk aversion has nothing to do with either of them, and I am never quite sure whether he is right or whether it matters for what I do on a Tuesday.

  Then run the procedure on three live cases. First, a contract offered at 22 cents where the panel says 35%, resolving in about six weeks, uncorrelated with anything else I hold. Second, a merger spread at 94 cents that the panel puts at 97%: a small return, a 3% chance of a break, and a break large enough to put the account within a few percent of the barrier. Third, a long-shot at 4 cents where the panel says 9% — the highest expected-return line on my sheet, the one I am most tempted by, and the one I suspect your procedure will tell me to take small or not at all; if so, I want to see that worked through rather than skipped. Finally, tell me in a short closing paragraph what the procedure cannot do, and specifically whether any of it transfers to a quantity that is not money: I am also asked to decide how many analyst-hours to put into a speculative research project, and a committee member has started arguing that the same geometric logic applies there too, which I doubt but cannot quite say why.
reasoning: |-
  Here's a thinking process that leads to the suggested sizing procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Sole analyst on a small event-driven account ($9M family office money).
      *   **Task:** Size positions on binary/discrete outcomes (central bank, merger arb, litigation).
      *   **Frequency:** 3-4 times a week.
      *   **Inputs:** Contract price, Panel probability (4 people), Time to resolution, Current book exposure.
      *   **Panel Calibration:** Well-calibrated in the middle, overconfident in tails (90% call $\rightarrow$ 60% hit rate; long shots worthless).
      *   **Constraints:**
          1.  Single position > 1.5% requires Investment Committee (IC) approval (weekly, no ergodicity talk).
          2.  Evaluation horizon: 12 months (quarterly reviews). Some bets resolve after.
          3.  Hard Stop: -30% from high-water mark (HWM) = mandate withdrawn (absorbing barrier).
      *   **Requirements for Procedure:**
          *   Run in 15 mins.
          *   Fixed order.
          *   Explicit termination points (zero stake).
          *   Explicit caps (mandate vs. criterion).
          *   Explicit hand-offs (value judgments).
          *   Address specific pain points: Time-average growth vs. EV, Barrier correction, Independent vs. Joint sizing, Estimation error shrinkage (based on calibration), Handling uncertainty/no-commitment.
          *   Address the friend's claim (Log wealth = Long-run growth).
          *   Run on 3 specific cases (22c/35%, 94c/97% risk of ruin, 4c/9% long shot).
          *   Closing paragraph: Limitations & non-monetary application (analyst hours).

  2.  **Analyze the Core Mathematical/Philosophical Tensions:**

      *   **Kelly vs. Reality:** Standard Kelly maximizes expected log wealth (time-average growth). The user's friend is technically right *in the limit of infinite bets and no barriers*. However, the user has a *finite horizon* (12 months) and a *hard barrier* (-30%). Standard Kelly ignores the barrier and can lead to ruin before the horizon.
      *   **The Barrier:** A 30% drawdown stop is severe. It effectively truncates the left tail of the wealth distribution. We need "Fractional Kelly" or a specific barrier-adjusted sizing. Given the -30% hard stop, survival is paramount.
      *   **Probability Calibration:** The panel is overconfident in tails. 90% $\rightarrow$ 60%. Long shots (4c/9%) are suspect. We need to map *stated* probability ($p_{stated}$) to *effective* probability ($p_{eff}$).
      *   **Horizon Mismatch:** Bets resolving after 12 months don't help the quarterly review or the 12-month evaluation directly, but they tie up capital and risk. They need a discount or a capital charge.
      *   **Committee Communication:** They understand EV and % returns. They do not understand "ergodicity." The justification must be framed as "protecting the capital base to ensure we can play the game next year" (Risk of Ruin) rather than "maximizing geometric mean."

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Calibration.* Adjust the panel's number.
          *   Middle range: Trust them.
          *   Tails (>80% or <20%): Shrink towards 50% or use historical mapping.
          *   Rule: If $p_{stated} > 80\%$, use $p_{eff} = 0.5 + 0.5 \times p_{stated}$ (rough linear shrink) or specific mapping (90% $\rightarrow$ 60%). Let's use the specific mapping provided: 90% $\rightarrow$ 60%. Long shots $\rightarrow$ near 0 or base rate.
      *   *Step 2: Expected Value Check.* If EV < 0 (after calibration), stop.
      *   *Step 3: Kelly Calculation.* $f^* = (bp - q) / b$. Where $b$ is odds received.
      *   *Step 4: Barrier Adjustment.* This is crucial. Standard Kelly ignores the -30% stop. We need to reduce the stake so that a loss doesn't bring us too close to the barrier, considering the *current* distance to barrier.
          *   Current Drawdown Buffer: Let's say we are at HWM. Buffer = 30%.
          *   If we lose $f$, new equity = $1-f$. Distance to barrier = $(1-f) - 0.7$.
          *   Conservative rule: Never risk more than $X\%$ of the *buffer*. Or use Half-Kelly as a proxy for utility curvature + barrier safety. Given the "hard stop," Half-Kelly is a good heuristic, but maybe we need to be more explicit about the "Distance to Barrier."
          *   Let's introduce a "Survival Cap": Max loss on bet $\le$ 50% of remaining drawdown buffer.
      *   *Step 5: Horizon/Capital Charge.* If resolution > 12 months, discount the EV or reduce size because it ties up capacity during the review period.
      *   *Step 6: Correlation/Book Check.* If correlated with existing book, treat as a portfolio adjustment. If uncorrelated, treat standalone.
      *   *Step 7: Committee Threshold.* If size > 1.5%, prepare IC memo. If can't explain in 2 sentences, reduce size or pass.
      *   *Step 8: Uncertainty.* If panel disagrees wildly, reduce size (uncertainty discount).

      *Refining the "Friend's Claim":* The friend is right mathematically (Log Utility $\equiv$ Max Geometric Growth) *assuming no constraints*. But with a hard barrier and finite horizon, Log Utility is dangerous because it doesn't penalize the *absorbing state* enough. We need to frame this as "Survival Priority."

      *Refining the Calibration:*
      *   Panel says 90% $\rightarrow$ Use 60%.
      *   Panel says 35% (Middle) $\rightarrow$ Use 35% (Well calibrated).
      *   Panel says 9% (Tail) $\rightarrow$ "Worth almost nothing." Use Base Rate or 0%.

      *Refining the Barrier Math:*
      *   Account = $9M. Stop = $6.3M (30% down).
      *   Current Equity $E$. Distance to Stop $D = E - 0.7 \times HWM$.
      *   Max Loss allowed on single bet $\le \alpha \times D$. Let's pick $\alpha = 20\%$ (conservative).
      *   This creates a hard cap on position size based on current P&L.

  4.  **Developing the 15-Minute Procedure:**

      *   *Phase 1: Probability & EV (5 mins)*
      *   *Phase 2: Risk & Barrier (5 mins)*
      *   *Phase 3: Constraints & Governance (5 mins)*

  5.  **Running the Cases:**

      *   *Case 1 (22c/35%):*
          *   Price 0.22. Payoff 1.00. Odds $b = (1-0.22)/0.22 = 3.54$.
          *   $p_{stated} = 35\%$. Middle range. $p_{eff} = 35\%$.
          *   EV = $0.35 \times 1 - 0.65 \times 0.22$? No, binary contract.
          *   Payoff is \$1 if win, \$0 if lose. Cost \$0.22.
          *   Net profit if win: \$0.78. Loss if lose: \$0.22.
          *   $b = 0.78/0.22 = 3.545$.
          *   Kelly $f = (0.35 \times 3.545 - 0.65) / 3.545 = (1.24 - 0.65) / 3.545 = 0.59 / 3.545 \approx 16.6\%$.
          *   This is huge. Needs fractionalizing.
          *   Barrier check: If lose 16%, equity drops 16%. Buffer is 30%. 16% is > 50% of buffer. Reduce.
          *   Committee check: > 1.5%. Needs approval.
      *   *Case 2 (94c/97%):*
          *   Price 0.94. Win \$1. Net +0.06. Loss -0.94.
          *   $p_{stated} = 97\%$. Tail. Overconfident. Map 90% $\rightarrow$ 60%. 97% is worse. Let's map to 70% or lower. Let's say $p_{eff} = 70\%$.
          *   $b = 0.06/0.94 = 0.0638$.
          *   Kelly $f = (0.70 \times 0.0638 - 0.30) / 0.0638$. Numerator is negative ($0.044 - 0.30$).
          *   EV is negative after calibration. **Reject.**
          *   Even if $p_{eff} = 90\%$: $(0.9 \times 0.0638 - 0.1) / 0.0638 = (0.057 - 0.1) < 0$.
          *   This is the "picking up pennies in front of a steamroller" trade. The barrier makes this fatal.
      *   *Case 3 (4c/9%):*
          *   Price 0.04. Win \$1. Net +0.96. Loss -0.04.
          *   $p_{stated} = 9\%$. Tail. "Long-shot enthusiasm worth almost nothing."
          *   $p_{eff} \approx 0\%$ or Base Rate (say 1%).
          *   EV likely negative or negligible.
          *   Kelly will be tiny or zero.
          *   Even if positive EV, correlation/variance drag might kill it.
          *   Verdict: Pass or Token.

  6.  **Addressing the "Friend's Claim":**
      *   Friend: Max Log Wealth = Max Growth. Risk aversion irrelevant.
      *   Reality: True for infinite horizon, no barriers. False for finite horizon + absorbing barrier.
      *   For the user: Risk aversion *is* relevant because the utility function is effectively step-wise (1 if > barrier, 0 if < barrier). Log utility smooths this too much.

  7.  **Addressing the "Analyst Hours" Question:**
      *   Can geometric logic apply to time allocation?
      *   Yes, but the "currency" is attention, not capital. Attention is non-fungible and depletes differently.
      *   The barrier is burnout or missed deadlines.
      *   However, research has optionality value (real options) that financial bets might not.
      *   Advice: Use similar logic (calibration, expected value of information) but don't treat hours as dollars.

  8.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the constraints and the friend's claim.
      *   **The Procedure:** Step-by-step, 15-minute clock.
      *   **The Three Cases:** Applied rigorously.
      *   **Closing:** Limitations and the Analyst Hours question.

  9.  **Refining the Procedure Steps (Self-Correction during drafting):**
      *   *Correction on Calibration:* Make the mapping rule explicit.
          *   $20\% < p < 80\%$: Use $p$.
          *   $p \ge 80\%$: Use $0.6 \times p + 0.4 \times 0.5$ (Linear shrink towards 50%)? No, prompt says 90% $\rightarrow$ 60%. Let's use a piecewise rule.
          *   $p \le 20\%$: Use 0% or Base Rate.
      *   *Correction on Barrier:* The "1.5% IC limit" is a hard constraint. The procedure must respect that. If Kelly says 5%, but IC limit is 1.5%, the procedure caps at 1.5% *unless* the analyst wants to spend the week prepping a memo. For a 15-min procedure, we cap at 1.5% automatically.
      *   *Correction on "Time-Average":* Explain this simply. "Compounding requires survival."

  10. **Final Review against Constraints:**
      *   15 mins? Yes, if rules are rigid.
      *   Fixed order? Yes.
      *   Termination points? Yes (EV < 0, Barrier breach, IC limit).
      *   Values hand-off? Yes (IC memo decision).
      *   Friend's claim addressed? Yes.
      *   3 Cases run? Yes.
      *   Closing paragraph included? Yes.

  11. **Drafting the Content:** (Mental check on the math for Case 2).
      *   Case 2: Price 94c. Risk 94 to make 6.
      *   Panel 97%. Calibrated to ~60-70%.
      *   EV = $0.70(6) - 0.30(94) = 4.2 - 28.2 = -24$. Massive negative EV.
      *   This highlights the "overconfidence in tails" danger.
      *   Barrier risk: A loss takes out 94% of the position value. If position is 1.5% of book, loss is $1.5\% \times 94\% \approx 1.4\%$ of equity.
      *   Wait, the prompt says "break large enough to put the account within a few percent of the barrier."
      *   If the account is near HWM, a 30% drop kills it.
      *   If this bet breaks, does it drop the *account* 30%? Or just close to it?
      *   Prompt: "break large enough to put the account within a few percent of the barrier."
      *   This implies the loss on the bet *plus* existing drawdown gets close to 30%.
      *   This requires a "Distance to Barrier" check in the procedure.

  12. **Final Polish:** Ensure tone is professional, direct, and respects the user's sophistication (they know ergodicity, Kelly, etc., but need operationalizable rules).

  *(Self-Correction on Case 1 Math)*:
  Price 0.22. Win 1.00.
  Profit = 0.78. Loss = 0.22.
  Odds $b = 0.78/0.22 = 3.545$.
  $p = 0.35$. $q = 0.65$.
  Kelly $f = (p(b+1) - 1) / b$? No, standard formula $f = (bp - q) / b$.
  $f = (3.545 \times 0.35 - 0.65) / 3.545 = (1.24 - 0.65) / 3.545 = 0.59 / 3.545 = 16.6\%$.
