answer: |-
  ### The Procedure: Barrier-Aware Event Sizing (BAES)

  **Purpose:** To determine position size in ≤15 minutes, respecting the 30% hard drawdown barrier, the 1.5% committee threshold, and the panel's calibration profile.
  **Philosophy:** Your friend is mathematically correct only in the limit of infinite time and no constraints. You have a finite horizon (12 months) and an absorbing barrier (-30%). For you, maximizing time-average growth *is* risk management. If you hit the barrier, your growth rate becomes negative infinity (mandate withdrawn). Therefore, we do not maximize Log Wealth; we maximize Log Wealth *subject to survival*.

  **Inputs Required:**
  1.  **Price ($P$):** Cost per $1.00 payout.
  2.  **Panel Probability ($p_{raw}$):** Consensus estimate.
  3.  **Time to Resolution ($T$):** In months.
  4.  **Current Drawdown ($DD$):** % below High-Water Mark (HWM).

  ---

  #### Step 1: Probability Calibration (3 Minutes)
  *Adjust $p_{raw}$ to $p_{eff}$ based on audited track record.*

  *   **If $20\% \le p_{raw} \le 80\%$:** Set $p_{eff} = p_{raw}$. (Panel is calibrated here).
  *   **If $p_{raw} > 80\%$:** Apply tail shrinkage. Set $p_{eff} = 0.50 + 0.33 \times (p_{raw} - 0.50)$.
      *   *Example:* 90% raw $\rightarrow$ 60% eff. 97% raw $\rightarrow$ ~65% eff.
  *   **If $p_{raw} < 20\%$:** Set $p_{eff} = \text{Base Rate}$ (use 1% unless specific data exists).
      *   *Rationale:* Panel long-shot enthusiasm is noise.
  *   **Termination:** If Expected Value ($EV$) $\le 0$, **Stop. Stake = 0.**
      *   $EV = p_{eff}(1 - P) - (1 - p_{eff})P$.

  #### Step 2: Raw Kelly Calculation (2 Minutes)
  *Calculate the unconstrained growth-optimal fraction.*

  *   **Odds ($b$):** $(1 - P) / P$.
  *   **Kelly Fraction ($f_{kelly}$):** $(b \times p_{eff} - (1 - p_{eff})) / b$.
  *   **Fractional Adjustment:** Set $f_{target} = f_{kelly} / 2$.
      *   *Rationale:* Half-Kelly reduces volatility by 50% while retaining 75% of growth, providing a buffer against estimation error and the finite horizon.

  #### Step 3: Barrier Proximity Check (3 Minutes)
  *Ensure a loss does not threaten the 30% hard stop.*

  *   **Remaining Buffer ($B$):** $30\% - DD$.
  *   **Max Loss on Bet:** $f_{target} \times P$ (This is the equity lost if the bet goes to zero).
  *   **Safety Cap:** Max Loss on Bet must be $\le 20\%$ of $B$.
      *   *Calculation:* $f_{barrier} = (0.20 \times B) / P$.
  *   **Decision:** Set $f_{safe} = \min(f_{target}, f_{barrier})$.
  *   **Termination:** If $f_{safe} \le 0$, **Stop. Stake = 0.**

  #### Step 4: Horizon & Capacity (2 Minutes)
  *Account for the 12-month evaluation window.*

  *   **If $T \le 12$ months:** No adjustment.
  *   **If $T > 12$ months:** Apply a 50% haircut to $f_{safe}$.
      *   *Rationale:* Capital tied up after the review period cannot be redeployed to meet quarterly targets or recover from drawdowns within the mandate window.
  *   **Set Final Fraction ($f_{final}$).**

  #### Step 5: Governance & Values Hand-off (5 Minutes)
  *Apply mandate constraints and communication filters.*

  *   **Mandate Cap:** If $f_{final} > 1.5\%$:
      *   **Option A:** Cap at 1.5% and proceed.
      *   **Option B:** Trigger Investment Committee (IC) process.
      *   *Constraint:* You cannot execute >1.5% without IC. If you choose Option B, the 15-minute timer stops; you are now writing a memo.
  *   **The "Two-Sentence" Test:** Can you explain the edge and the risk to the IC without using the words "ergodic," "Kelly," or "distribution"?
      *   **No:** Reduce stake to $\le 1.5\%$ (Option A) or **Pass**.
      *   **Yes:** Proceed with IC memo.
  *   **Uncertainty Check:** If the panel range is wide (e.g., estimates vary by >15%) or you feel personal uncertainty:
      *   **Action:** Halve $f_{final}$ again.
      *   **Values Hand-off:** This is where you decide how much weight to give the *possibility* of being wrong versus the *math* of being right. There is no formula for conviction.

  ---

  ### Application to Live Cases

  **Assumptions:** Account is at High-Water Mark ($DD = 0\%$, Buffer $B = 30\%$).

  #### Case 1: The Mid-Range Event
  *   **Inputs:** $P = 0.22$, $p_{raw} = 35\%$, $T = 1.5$ months, Uncorrelated.
  *   **Step 1 (Calibration):** $35\%$ is in the calibrated zone. $p_{eff} = 35\%$.
      *   $EV = 0.35(0.78) - 0.65(0.22) = 0.273 - 0.143 = +0.13$. (Positive).
  *   **Step 2 (Kelly):** $b = 0.78/0.22 = 3.55$.
      *   $f_{kelly} = (3.55 \times 0.35 - 0.65) / 3.55 = 16.6\%$.
      *   $f_{target} = 8.3\%$ (Half-Kelly).
  *   **Step 3 (Barrier):** Buffer $B = 30\%$. Max loss allowed = $6\%$ of equity.
      *   $f_{barrier} = 6\% / 0.22 = 27\%$.
      *   $f_{safe} = \min(8.3\%, 27\%) = 8.3\%$.
  *   **Step 4 (Horizon):** $T < 12$. No change.
  *   **Step 5 (Governance):** $8.3\% > 1.5\%$ limit.
      *   **Decision:** You cannot sign this off alone.
      *   **Two-Sentence Test:** "We buy at 22c, panel sees 35% chance of $1 payout. Mathematically optimal size is 8%, but mandate limits us to 1.5% without committee approval." (Passes).
      *   **Action:** **Cap at 1.5%** for immediate execution, OR **Submit to IC** for 8.3%. Given the 15-minute constraint, the procedure dictates **Cap at 1.5%**.

  #### Case 2: The Merger Arbitrage (Trap)
  *   **Inputs:** $P = 0.94$, $p_{raw} = 97\%$, $T = 4$ months, Break risk threatens barrier.
  *   **Step 1 (Calibration):** $97\%$ is a tail. Apply shrinkage.
      *   $p_{eff} = 0.50 + 0.33 \times (0.97 - 0.50) \approx 65\%$.
      *   $EV = 0.65(0.06) - 0.35(0.94) = 0.039 - 0.329 = -0.29$.
  *   **Termination:** **EV is Negative.**
  *   **Action:** **Stake = 0.**
  *   **Commentary:** The panel's overconfidence hides a fatal negative expectation. Even if you ignored calibration and used 97%, the Barrier Check (Step 3) would likely kill it. A break loses 94% of the position. To keep loss < 6% of equity (20% of buffer), position size must be < 6.4%. But the EV is the primary killer here. This is the exact scenario that breaches the absorbing barrier.

  #### Case 3: The Long Shot
  *   **Inputs:** $P = 0.04$, $p_{raw} = 9\%$, $T = 8$ months, Highest EV on sheet.
  *   **Step 1 (Calibration):** $9\%$ is a tail. "Enthusiasm worth almost nothing."
      *   Set $p_{eff} = 1\%$ (Base Rate).
      *   $EV = 0.01(0.96) - 0.99(0.04) = 0.0096 - 0.0396 = -0.03$.
  *   **Termination:** **EV is Negative.**
  *   **Action:** **Stake = 0.**
  *   **Commentary:** This addresses your temptation. The raw EV looks high because the payout is large, but the *calibrated* probability collapses the edge. If you insisted $p_{eff}$ was 5% (generous):
      *   $EV$ becomes slightly positive. Kelly fraction would be $\approx 1\%$.
      *   However, Step 5 (Uncertainty) applies heavily here. Panel disagreement on long shots is usually high. Halving for uncertainty puts it at 0.5%.
      *   **Verdict:** The procedure forces you to respect the calibration audit. Do not take the bet.

  ---

  ### Closing: Limitations and Analyst Hours

  This procedure cannot optimize for correlation across the whole book in real-time; it assumes independence unless you manually flag a overlap in Step 5. It also cannot predict "black swan" liquidity events where you cannot exit a position before the barrier hits.

  Regarding your committee member's argument on analyst hours: **Do not accept it.** Money is fungible and divisible; analyst attention is neither. The geometric logic of compounding applies to capital because capital survives to fight another day. Analyst hours are consumed upon use. While you should avoid "burnout barriers" (an absorbing state where you can no longer work), research projects are **Real Options**, not binary bets. A failed research project often yields information that improves future calibration (Step 1), whereas a lost financial bet yields only loss. Apply the *calibration* logic to your time (audit which research types yield alpha), but do not apply the *sizing* logic. Time is not bankroll.
