      *   *Core Argument:* Induction relies on the Principle of the Uniformity of Nature (PUN). We can't prove PUN deductively (nature could change). We can't prove it inductively (that would be circular).
      *   *Conclusion:* Induction has no rational foundation. It's based on custom/habit, not reason.
      *   *Key Worry:* Skepticism. Why trust *any* induction?

  3.  **Deconstruct Goodman's "New Riddle":**
