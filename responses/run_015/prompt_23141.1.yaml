      *   *Key Concept:* "Grue" (green before time *t*, blue after).
      *   *Conclusion:* The formal structure of confirmation is insufficient. We need a criterion to distinguish "projectible" predicates from non-projectible ones.
      *   *Key Worry:* Underdetermination. Which induction do we trust?

  4.  **Address the User's Specific Confusion (Justification vs. Uniqueness):**
      *   *Hume:* Questions the *validity/reliability* of the engine itself. (Is the car going to move?)
      *   *Goodman:* Assumes the engine works but questions the *steering*. (Which direction does the car go? Both 'green' and 'grue' paths fit the tracks so far.)
      *   *Verdict:* Goodman is *not* trying to resurrect Humean skepticism. He accepts induction happens. His worry is about *which* inductions are valid. It's about the *uniqueness* of the generalization, not the *possibility* of induction itself.

