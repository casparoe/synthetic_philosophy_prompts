answer: |-
  This is one of the most common and frustrating sticking points in epistemology, so you are in good company. The confusion usually stems from the fact that both Hume and Goodman use the word "induction," but they are attacking two different layers of the problem.

  Here is the breakdown of the difference, followed by a direct answer to your specific questions about justification vs. underdetermination and the upshot for Humeans.

  ### 1. The Core Distinction: Justification vs. Differentiation

  **Hume's Old Riddle (The Problem of Justification)**
  *   **The Question:** *Why* are we allowed to infer the unobserved from the observed at all?
  *   **The Worry:** Skepticism. Hume argues that any attempt to justify induction is circular. To say "induction works because it has worked in the past" is itself an inductive argument.
  *   **The Target:** The **Principle of the Uniformity of Nature**. Hume claims we have no rational basis for believing the future will resemble the past.
  *   **The Conclusion:** Induction is not founded on reason, but on custom and habit. It is psychologically inevitable but rationally groundless.

  **Goodman's New Riddle (The Problem of Projection)**
  *   **The Question:** *Which* inferences from the observed to the unobserved are valid?
  *   **The Worry:** Underdetermination. Goodman accepts that we *do* make inductive inferences (he isn't a skeptic like Hume). His worry is that our current logical rules for confirmation are too loose.
  *   **The Target:** **Projectible Predicates**. Using "grue" (green before time *t*, blue after time *t*), Goodman shows that the same evidence supports contradictory hypotheses equally well under standard logical syntax.
  *   **The Conclusion:** We need a criterion to distinguish "law-like" generalizations (green) from "accidental" or "non-projectible" ones (grue).

  ### 2. Addressing Your Specific Confusion

  You asked: *Does Goodman's grue show that induction is unjustified (Hume's worry) or does it show that the evidence underdetermines which hypothesis to project (Goodman's worry)?*

  **It is definitely the latter.**

  Goodman is **not** trying to reopen Hume's skeptical wound. In fact, Goodman explicitly states that the "old riddle" is a pseudo-problem caused by asking for an impossible foundational justification.

  *   **Hume** asks: "Is the bridge safe to cross?" (Answer: We can't prove it is.)
  *   **Goodman** asks: "Given that we are crossing the bridge, which path leads to the destination?" (Answer: The map shows two paths, 'Green' and 'Grue', that overlap perfectly until now. We need a better map.)

  Goodman's "Grue" problem shows that **evidence underdetermines hypothesis selection.** If you look purely at the logical relationship between evidence statements and hypothesis statements, "All emeralds are green" and "All emeralds are grue" are confirmed to the exact same degree by the same observations.

  Therefore, the problem isn't that induction is *unjustified*; the problem is that our definition of confirmation is **indiscriminate.** It validates crazy predictions (that emeralds will turn blue tomorrow) just as easily as sensible ones. Goodman wants to fix the *rules* of induction, not question the *possibility* of induction.

  ### 3. The Upshot for Humeans

  You asked: *What's the upshot for people who think the old riddle is the real problem?*

  If you are a philosopher who believes Hume's skepticism is the primary threat to knowledge, Goodman's work can feel like rearranging deck chairs on the Titanic. However, Goodman offers a specific response to the Humean, which changes the landscape of the debate.

  **A. Goodman Dissolves the Old Riddle**
  Goodman argues that Hume's demand for a "justification" of induction is incoherent. Hume wants an external, foundational guarantee that induction leads to truth. Goodman argues (in *Fact, Fiction, and Forecast*) that justification is internal.
  *   We justify inductive rules by how well they match our actual inductive practices.
  *   We justify our practices by how well they align with our rules.
  *   This is **Reflective Equilibrium**.

  For a Humean, this is unsatisfying because it abandons the search for an objective guarantee of truth. For a Goodmanian, the Humean worry is a category error. We don't need to prove induction works from "outside" the system; we just need to make sure the system is consistent.

  **B. The "Real Problem" Shift**
  For someone who thinks the Old Riddle is the real problem, the upshot of Goodman is this: **Even if you solve Hume, you still haven't solved Goodman.**
  *   Imagine a god comes down and tells you, "Don't worry, nature is uniform. Induction is justified." (Hume is solved).
  *   You still face Goodman's problem: Uniformity in respect to *what*? Nature is uniform regarding "green," but it is also uniform regarding "grue" (until time *t*).
  *   Therefore, Goodman's riddle is logically independent of Hume's. You can accept Hume's skepticism and still face Goodman's puzzle, or you can reject Hume's skepticism and *still* face Goodman's puzzle.

  **C. The Pragmatic Turn**
  The upshot for the Humean is that the debate shifts from **Metaphysics** (What is the structure of reality that allows induction?) to **Pragmatics/Language** (How do we use language and which predicates are entrenched?).
  Goodman suggests the solution to induction isn't finding a metaphysical law of nature, but understanding which predicates are "entrenched" in our linguistic history. "Green" is entrenched; "Grue" is not.

  ### Summary Table for Your Paper

  | Feature | Hume's Old Riddle | Goodman's New Riddle |
  | :--- | :--- | :--- |
  | **Primary Worry** | **Skepticism:** Is induction rational? | **Differentiation:** Which inductions are valid? |
  | **Target** | The Principle of Uniformity of Nature. | The definition of "Confirmation" / Projectibility. |
  | **Status of Induction** | Unjustified by reason; based on habit. | Taken for granted; needs refinement. |
  | **The "Grue" Role** | N/A | Shows evidence supports conflicting hypotheses equally. |
  | **Type of Problem** | **Justification** (Why do it?) | **Underdetermination** (Which one to do?) |
  | **Proposed Solution** | None (Skepticism) / Naturalism (Habit). | Entrenchment / Reflective Equilibrium. |

  ### How to Frame This in Your Paper
  If you are writing on this, a strong thesis statement might look like this:

  > "While Hume's Old Riddle challenges the *authority* of inductive reasoning by questioning its rational foundation, Goodman's New Riddle challenges the *specificity* of inductive reasoning by demonstrating that evidence alone cannot distinguish between competing projections. Consequently, Goodman does not revive Humean skepticism but rather exposes a deficiency in formal confirmation theory, shifting the philosophical burden from justifying induction to defining projectibility."

  This clarifies that Goodman isn't saying "Induction is broken" (Hume), but rather "Our map of induction is too blurry" (Goodman).
