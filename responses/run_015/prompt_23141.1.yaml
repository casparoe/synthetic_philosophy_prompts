      *   **Core Task:** Compare Hume's "Old Riddle" of Induction with Goodman's "New Riddle" of Induction.
      *   **Specific Confusion:** Is Goodman's "grue" problem a threat to induction *as such* (justification) or just to the *uniqueness* of inductive generalization (underdetermination)?
      *   **Specific Question:** Does Goodman show induction is unjustified (like Hume) or that evidence underdetermines hypothesis projection?
      *   **Follow-up:** What's the upshot for those who think Hume's riddle is the real problem?

  2.  **Deconstruct Hume's "Old Riddle":**
