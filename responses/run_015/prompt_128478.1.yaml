answer: |-
  # Adequacy Conditions for Theories of Composition: A Meta-Ontological Framework

  ## Preamble
  The Special Composition Question (SCQ)—*under what conditions do some things compose a further thing?*—is often obscured by competing theoretical virtues. To evaluate competitor theories (Universalism, Nihilism, Restrictivism) without slogan-matching, we must distinguish between **methodological necessities** (constraints required for any coherent metaphysical system), **explanatory burdens** (phenomena that must be accounted for, even if explained away), and **camp-specific preferences** (ontological commitments specific to a school of thought).

  The following desiderata establish the scorecard.

  ---

  ## I. Desiderata for a Theory of Composition

  ### A. Phenomenological Adequacy (The Data)
  *These criteria measure the theory's ability to accommodate or explain away standard ontological intuitions.*

  | Desideratum | Motivating Case | Status |
  | :--- | :--- | :--- |
  | **1. Artifact Accommodation** | **The Wooden Table:** A theory must affirm the existence of standard artifacts or provide a robust error theory for why we believe they exist despite their non-existence. | **Explanatory Burden** (Must account for the intuition, even if revising the ontology). |
  | **2. Biological Unity** | **The Human Organism:** A theory must distinguish between a living organism and a mere heap of cells, accounting for the causal integration that persists through metabolic turnover. | **Non-negotiable** (Any naturalistic metaphysics must align with biological individuation). |
  | **3. Perspective Dependence** | **The Constellation:** A theory must explain why stars arranged in a pattern (e.g., Orion) do not compose an object, despite satisfying spatial proximity criteria similar to some accepted composites. | **Non-negotiable** (Must distinguish mind-dependent grouping from mind-independent unity). |

  ### B. Resilience and Dynamics (Boundary Cases)
  *These criteria test the theory against cases involving damage, turnover, and process ontology.*

  | Desideratum | Motivating Case | Status |
  | :--- | :--- | :--- |
  | **4. Sortal Resilience** | **The Damaged Statue:** A statue missing a left arm remains one object. A theory cannot make composition so fragile that minor mereological change destroys the whole. | **Camp Preference** (Endurantists require this; Perdurantists may treat arm-loss as a temporal part boundary). |
  | **5. Functional Continuity** | **The Drone Swarm:** A collective maintaining behavior despite 100% turnover of constituent units. A theory must specify if composition is based on *matter* or *structure/function*. | **Explanatory Burden** (Must specify the persistence conditions for dynamic systems). |
  | **6. Process Ontology** | **The Fusion Reaction:** A sustained reaction where no plasma particle persists >1ms. A theory must decide if processes/events are composites of temporal parts or distinct ontological categories. | **Camp Preference** (Substance ontologists deny this is a "whole"; Process ontologists require it). |

  ### C. Formal Coherence (The Logic)
  *These criteria measure consistency with Classical Extensional Mereology (CEM) and logical constraints.*

  | Desideratum | Motivating Case | Status |
  | :--- | :--- | :--- |
  | **7. Transitivity of Parthood** | If *a* is part of *b*, and *b* is part of *c*, then *a* is part of *c*. A theory should preserve this unless a specific counter-example (e.g., biological modularity) forces rejection. | **Methodological Imperative** (Rejecting this requires heavy justification as it breaks standard logic). |
  | **8. Uniqueness of Fusion** | The same parts cannot compose two distinct wholes simultaneously (no co-location). | **Camp Preference** (Universalists/Nihilists accept; some Restrictivists reject to allow Statue/Clay distinction). |
  | **9. Extensionality** | If two wholes have the exact same parts, they are identical. | **Camp Preference** (CEM advocates require this; hylomorphists often reject it). |

  ### D. Metaphysical Costs (The Trade-offs)
  *These criteria measure the theoretical "price" of the view.*

  | Desideratum | Motivating Case | Status |
  | :--- | :--- | :--- |
  | **10. Non-Arbitrariness** | **The Cutoff Problem:** A theory cannot posit a brute fact that 100 grains compose a heap but 99 do not, without a principled difference. | **Non-negotiable** (A principled metaphysics cannot rely on brute vagueness in reality). |
  | **11. Ontological Parsimony** | **Scattered Objects:** A theory should avoid populating the world with "trout-turkeys" (scattered fusions of unrelated parts) unless forced by logic. | **Camp Preference** (Nihilists/Restrictivists prioritize this; Universalists reject it as a virtue). |
  | **12. Physical Compatibility** | **Quantum Entanglement:** A theory must not contradict physical descriptions of matter (e.g., treating particles as discrete when physics describes fields). | **Non-negotiable** (Metaphysics must be consistent with best-available physics). |

  ---

  ## II. The Incompatibility Thesis: The Mereological Trilemma

  The central task of the seminar is to recognize that **no single theory satisfies all Non-negotiable and Preference criteria simultaneously.** Specifically, there is a jointly unsatisfiable subset of requirements often termed the **Mereological Trilemma**. You can satisfy any two of the following three, but not all three:

  1.  **Common-Sense Ontology:** Ordinary medium-sized objects (tables, organisms) exist, but gerrymandered/scattered objects (trout-turkeys) do not. *(Satisfies Desiderata 1, 2, 11)*
  2.  **Principled Restriction:** There is a non-arbitrary, precise condition for composition that avoids brute facts. *(Satisfies Desideratum 10)*
  3.  **Classical Formality:** Composition obeys the laws of Classical Extensional Mereology (specifically Unrestricted Composition or Nihilism). *(Satisfies Desiderata 7, 8, 9)*

  ### The Tension: Restriction vs. Non-Arbitrariness
  The demand for a **principled, non-arbitrary restriction (Desideratum 10)** cannot be squared with the **denial of gerrymandered objects (Desideratum 11)** while maintaining **Common-Sense Ontology (Desideratum 1)**.

  *   **If you restrict composition** to save common sense (deny trout-turkeys), you face the **Vagueness Argument** (Lewis/Sider): If composition is restricted, there must be a borderline case where it is indeterminate whether composition occurs. But existence cannot be vague; therefore, composition must be unrestricted (Universalism) or never occurs (Nihilism).
  *   **If you posit a precise principle** (e.g., "composition occurs only when parts are in contact"), you fail **Common-Sense Ontology**: You either exclude organisms (cells are not always in contact) or include scattered objects (contact chains can span vast distances via intermediaries).
  *   **If you accept Brutal Composition** (Sider), you save Common-Sense Ontology but violate **Non-Arbitrariness**: You admit that there is no *reason* why these parts compose a whole and those do not; it is simply a brute fact. This violates Desideratum 10.

  **Conclusion on Tensions:** The subset {Common-Sense Ontology, Non-Arbitrariness, Denial of Scattered Objects} is jointly unsatisfiable. Any viable theory must explicitly state which of these it sacrifices.

  ---

  ## III. Assessment of Competitor Views

  This scoring indicates how existing views navigate the Trilemma. None score perfectly; each fails at least one high-priority desideratum.

  | View | Performance on Desiderata | Primary Failure / Cost |
  | :--- | :--- | :--- |
  | **Mereological Universalism** | **Passes:** Non-Arbitrariness (10), Formal Coherence (7-9), Physical Compatibility (12).<br>**Fails:** Ontological Parsimony (11), Perspective Dependence (3). | **Ontological Explosion:** Affirms the existence of "trout-turkeys" and constellations equally with tables. Must explain away the *intuition* of difference via pragmatics rather than ontology. |
  | **Mereological Nihilism** | **Passes:** Non-Arbitrariness (10), Ontological Parsimony (11), Formal Coherence (7-9).<br>**Fails:** Artifact Accommodation (1), Biological Unity (2). | **Revisionary Cost:** Denies the existence of tables and organisms. Must provide a robust error theory for why language/thought treats simples arranged table-wise as a single object. |
  | **Biological Restrictivism** (e.g., Van Inwagen) | **Passes:** Artifact Accommodation (1 - partially), Biological Unity (2), Ontological Parsimony (11).<br>**Fails:** Non-Arbitrariness (10), Formal Coherence (9). | **The Boundary Problem:** Cannot precisely define "life" or "causal unity" without arbitrariness (e.g., viruses, borderline metabolic states). Violates Extensionality by treating organisms differently from artifacts. |

  ### Summary for Seminar Preparation
  When evaluating a competitor theory in the seminar, do not ask *"Is this true?"* Ask: **"Which horn of the Trilemma does this theory grasp?"**
  *   If they claim to save common sense *and* avoid arbitrariness, press them on the **Vagueness Argument**.
  *   If they claim to avoid scattered objects *and* keep common sense, press them on **Brutal Composition**.
  *   If they claim logical purity (Universalism/Nihilism), press them on **Explanatory Burden** (Desiderata 1 & 2).

  The conceptual work lies not in finding the perfect theory, but in determining which metaphysical cost is the least debilitating for your broader systematic goals.
