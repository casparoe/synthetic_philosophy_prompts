          *   Cousin (Math Teacher): Offered a logical dilemma (false dichotomy?) about the value of the act.
          *   Older Sister (again): Defended Younger Sister, invoked the concept of "going beyond the call of duty."
          *   User (Narrator): Confused, wants clarity on who was right, what concepts were missed, and what is settled philosophy vs. contested.
      *   **Core Questions:**
          1.  Was the cousin's dilemma airtight?
          2.  Is the aunt right about the "both ways" problem (optionality vs. criticism)?
          3.  Move-by-move analysis of the exchange.
          4.  Identify missing concepts.
          5.  Distinguish settled philosophy from contested areas.
      *   **Goal:** Provide a clear, philosophically grounded explanation that the user can use (or avoid using) at Christmas dinner without sounding like they think it's settled when it's not.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Supererogation:** Acts that are good to do but not wrong to omit. (The core issue).
      *   **Obligation/Duty:** What is required.
      *   **Praise/Blame:** Reactive attitudes tied to obligation and supererogation.
      *   **The Cousin's Dilemma:** "Either giving is better (so you ought to do it) or it isn't (so don't praise the sister)." This sounds like a challenge to the coherence of supererogation.
      *   **The Aunt's Argument:** "If it's optional, you can't criticize non-doers. If you criticize non-doers, it's not optional." This touches on the relationship between optionality and normative judgment.
      *   **The Older Sister's Defense:** "Admirable because it went beyond demand." This is the classic definition of supererogation.

  3.  **Evaluate the Arguments (Move by Move):**

      *   *Aunt's Opening:* "When are you going to step up?" -> Implies obligation.
      *   *Younger Sister:* "No obligation." -> Claim of optionality.
      *   *Aunt's Retort:* "If it's good, how is it fine not to do it?" -> Challenges the gap between "good" and "required."
      *   *Cousin's Dilemma:* "Either it's better (ought) or not better (no praise)." -> This is a version of the "Paradox of Supererogation."
      *   *Older Sister's Counter:* "Admirable *because* it's beyond demand." -> Defines supererogation correctly.
      *   *Aunt's Second Wind:* "If it's above the bar, non-doers are below (blameworthy). If no bar, no criticism." -> Confuses "below the bar" with "not above the bar."
      *   *Cousin's Agreement:* Thinks Aunt is right.

  4.  **Identify the Philosophical Errors/Insights:**
      *   **Cousin's Error:** He assumes a binary: either an act is *required* (maximizes good) or it's *neutral/bad*. He misses the category of *supererogatory* (good but not required). This is the "Maximizing Consequentialism" view vs. "Common Sense Morality."
      *   **Aunt's Error:** She conflates "not doing the supererogatory" with "doing something wrong." Just because I didn't run into a burning building (heroic), it doesn't mean I did something *bad* (below the bar). I just stayed at the baseline.
      *   **Older Sister's Insight:** She nailed the definition of supererogation.
      *   **Missing Concept:** The distinction between *obligatory*, *permissible*, and *supererogatory*. Also, the distinction between *criticism* (blame) and *regret* or *disappointment*.

  5.  **Determine "Settled" vs. "Contested":**
      *   **Settled (mostly):** The *concept* of supererogation is widely accepted in non-consequentialist ethics (Kantian, Virtue Ethics, Common Sense). Everyone agrees there *is* a category of "nice but not required."
      *   **Contested:** *Why* it exists. Consequentialists (like Utilitarians) often struggle with it (the Cousin's view is basically Utilitarian). Some argue supererogation is an illusion. The *limits* of criticism (can you feel disappointed without blaming?) is also nuanced.
      *   **The "Aunt's Point" on Criticism:** This is tricky. Can you criticize someone for not being a hero? Most say no (no blame), but maybe you can feel disappointment. The Aunt says "disapproved of." That's strong.

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the complexity. Validate the user's feeling that they were talking past each other.
      *   **The Core Concept:** Define **Supererogation**. This is the key term they were dancing around.
      *   **Move-by-Move Analysis:**
