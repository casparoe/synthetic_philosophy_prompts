answer: |-
  This is a classic family dinner scenario that accidentally stumbled into one of the most famous debates in modern moral philosophy. Your family essentially reenacted a seminar on **supererogation**.

  The short answer is: **Your older sister was the most philosophically precise, your cousin and aunt were relying on a specific (and controversial) ethical framework that denies the existence of "extra credit" in morality, and you were right that they were talking past each other.**

  Here is a move-by-move breakdown of the exchange, the concepts they were missing, and a guide to what is settled versus what is still fought over in ethics.

  ---

  ### 1. The Core Concept: Supererogation
  To understand who was right, you need the technical term they were missing. In ethics, acts are usually divided into three categories:
  1.  **Obligatory:** You must do it; if you don't, you are blameworthy (e.g., feeding your children).
  2.  **Forbidden:** You must not do it; if you do, you are blameworthy (e.g., stealing).
  3.  **Supererogatory:** It is good to do, but **not wrong to omit**. These are acts of "saints and heroes." (e.g., donating a kidney to a stranger, running into a burning building).

  The entire argument hinged on whether Category 3 actually exists.

  ### 2. Move-by-Move Analysis

  #### Move 1: The Aunt's Opening
  *   **Claim:** "When are you going to step up?"
  *   **Analysis:** The Aunt is treating kidney donation as **Obligatory**. She assumes that because it is a "good thing," it is a requirement.
  *   **Verdict:** This is the spark. In common morality, this is generally considered incorrect. Most ethical systems do not require you to undergo major surgery to save a stranger.

  #### Move 2: The Cousin's Dilemma (The "Checkmate")
  *   **Claim:** "Either giving is better (so you ought to do it) or it isn't (so don't praise the older sister)."
  *   **Analysis:** This is a philosophical position known as **Maximizing Consequentialism** (or Utilitarianism). The logic is: *Morality is about making the world as good as possible. If Act A creates more good than Act B, you are obligated to do Act A.*
  *   **Why it feels airtight:** It is logically consistent *if* you accept the premise that morality is only about maximizing good outcomes.
  *   **Why it fails:** Most people (and most non-Utilitarian philosophers) reject this premise because it makes morality too demanding. If the cousin is right, you are morally obligated to donate your kidney, give away most of your income to charity, and never buy a coffee until everyone else is fed.
  *   **Verdict:** **Not airtight.** It creates a false dichotomy. It ignores the middle category (Supererogation). It claims that if an act is "better," it must be "required." Philosophy largely rejects this because it leads to the "Over-Demandingness Objection."

  #### Move 3: The Older Sister's Defense
  *   **Claim:** "The whole point of calling her act admirable was that it went beyond what anyone could demand."
  *   **Analysis:** She is defining **Supererogation** perfectly. For an act to be heroic, it must be optional. If it were required, doing it would just be "doing your job," and failing to do it would be a crime.
  *   **Verdict:** **Philosophically Correct.** She identified that praise *requires* optionality. If you praise someone for breathing, it's not a compliment because they can't stop.

  #### Move 4: The Aunt's Counter (The "Both Ways" Argument)
  *   **Claim:** "If the act is above the bar, my younger sister is below it... if there's no bar, nothing can be criticized."
  *   **Analysis:** This is a category error. The Aunt thinks the moral landscape is a line where you are either Above (Good) or Below (Bad).
  *   **The Missing Nuance:** There is a **Baseline** (Permissible).
      *   Older Sister: Above Baseline (Supererogatory).
      *   Younger Sister: **At** Baseline (Permissible).
      *   The Aunt thinks Younger Sister is **Below** Baseline (Wrong).
  *   **Verdict:** **Incorrect.** You can be "not heroic" without being "immoral." The Younger Sister stayed at the baseline. She is not "below the bar"; she just didn't jump over it.

  ### 3. Was the Cousin's Dilemma Airtight?
  **No.** It relies on the assumption that "Better" always equals "Obligatory."
  *   **Example:** It is "better" to spend your weekend volunteering at a hospice than playing video games. But almost no one argues you are *obligated* to do so.
  *   **The Flaw:** The cousin conflates **value** (how good an act is) with **requirement** (what you must do). Ethics generally accepts that some valuable acts are optional.

  ### 4. Is the Aunt Right About Criticism?
  **No, but with a nuance.**
  *   **The Aunt's Claim:** If it's optional, you can't disapprove. If you disapprove, it's not optional.
  *   **The Reality:** You cannot **morally blame** someone for skipping a supererogatory act. (You can't say the Younger Sister is *bad*).
  *   **The Nuance:** You *can* feel **disappointment**.
      *   *Blame:* "You did something wrong." (Inappropriate here).
      *   *Disappointment:* "I wish you had done the greater thing, but I accept you didn't have to." (Appropriate).
  *   The Aunt conflated "criticism/blame" with "wishing someone were better." You can think the Older Sister is a hero and the Younger Sister is just... normal. That isn't a contradiction.

  ### 5. Settled vs. Contested (For Christmas Dinner)

  If you bring this up at Christmas, here is how to frame it so you don't sound like you're claiming absolute truth where there is none.

  #### What is Basically Settled (Common Sense Morality)
  *   **The Existence of Supererogation:** Most ethical frameworks (Kantianism, Virtue Ethics, Rossian Deontology) and almost all "common sense" morality agree that there is a category of actions that are good to do but not wrong to skip.
  *   **The Definition:** Everyone agrees that for an act to be "heroic," it must be optional. If you force someone to be a hero, it's not heroism anymore.
  *   **The Cousin's Error:** It is widely accepted that the Cousin's "Maximizing" view is too demanding for human life. (Philosopher J.O. Urmson's 1958 paper *"Saints and Heroes"* is the classic text here, arguing exactly against your cousin's point).

  #### What is Genuinely Contested (The Deep Dive)
  *   **The Utilitarian Challenge:** Strict Utilitarians (like Peter Singer) actually **agree with your Cousin**. They argue that supererogation is a myth invented to make ourselves feel better about not doing enough. If you can save a life at minor cost to yourself, they argue you *are* obligated to do it.
      *   *Dinner Tip:* If you say "Supererogation is real," a hardline Utilitarian will say you are wrong. If you say "It's not real," everyone else will say you are crazy. Acknowledge this split.
  *   **The Limits of Disappointment:** While we agree you can't *blame* the Younger Sister, is it okay for the Aunt to feel *disappointed*?
      *   Some philosophers say yes (it shows she values the good).
      *   Some say no (it exerts undue social pressure that undermines the "optionality").
      *   *Dinner Tip:* This is the safest place to debate. "Is it okay to be disappointed someone isn't a hero?" is a great open question.

  ### Summary for Christmas Dinner

  If you want to weigh in without starting a war, here is the script:

  1.  **Validate the Older Sister:** "Actually, [Older Sister] hit on the standard philosophical definition. For something to be 'admirable,' it usually has to be optional. If it was required, we wouldn't call her a hero, we'd just call her compliant."
  2.  **Correct the Cousin gently:** "The cousin's logic works if you think morality is only about maximizing good outcomes, like a math problem. But most ethical systems say morality also includes personal liberty. You're allowed to keep your kidney even if giving it would create more 'good'."
  3.  **Address the Aunt:** "The Aunt's point about criticism is tricky. We can't say the Younger Sister is *wrong* (blame), but I think the Aunt is asking if we can feel *disappointed*. That's the real question: Can you be disappointed someone didn't go above and beyond without saying they did something bad?"
  4.  **The "Settled" Warning:** "Just so we know, philosophers have been arguing about this since the 1950s. There's a whole category called 'supererogation' dedicated to it. So nobody at this table is crazy; you're just arguing about where the line is between 'duty' and 'heroism'."

  **Final Verdict:**
  *   **Older Sister:** Right on the definition.
  *   **Younger Sister:** Right on the obligation.
  *   **Cousin:** Logically consistent within a specific, controversial framework (Utilitarianism), but wrong about common morality.
  *   **Aunt:** Wrong on the logic (confused "not heroic" with "immoral"), but raising a valid emotional point about social expectations.
  *   **You:** Right to sense they were talking past each other. They were debating **Deontology/Virtue Ethics** (Sisters) vs. **Consequentialism** (Cousin/Aunt) without knowing the labels.
