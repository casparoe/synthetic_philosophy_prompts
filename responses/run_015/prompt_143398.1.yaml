      *   **Ravi's Three Questions:** (1) Origin (did it spread for this?), (2) Maintenance (is it kept by this?), (3) Shape (how much detail is due to function?). Claims adaptationists answer (2) to prove (1) & (3).
      *   **Ines's Counter:** (1) is unreachable history. (3) is unfalsifiable (always add adaptive story later). (1) vs (2) is just exaptation, already handled.
