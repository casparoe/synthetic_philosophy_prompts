answer: |-
  This is a high-quality reconstruction of a debate that has been running, in various forms, for forty-five years. Ines and Ravi are both competent, but they are talking past each other because they are prioritizing different levels of analysis: Ines is defending *methodological capacity*, while Ravi is defending *logical validity*.

  Here is the adjudication, move by move.

  ### Move-by-Move Adjudication

  **Ines (1): "The critique is out of date... Now we have genome-wide selection scans... 'Just-so story' was a fair charge then and isn't one now."**
  *   **Verdict: Half-right.**
  *   **Why:** She is right that the *empirical* landscape has changed. In 1979, testing for selection was often anecdotal. Today, we have phylogenetic comparative methods, QTL mapping, and selection scans that allow us to reject adaptive hypotheses with data. However, she is wrong that this renders the *logical* critique outdated. The availability of tools does not prevent the misuse of inference. A researcher can still run a selection scan, find a signal, and incorrectly infer that the signal explains the *origin* of a complex morphology rather than a recent tweak. The "Just-So Story" charge is no longer about the *absence* of data, but about the *interpretive leap* from data to narrative.

  **Ravi (1): "That changes the subject. Their target was never 'is there selection somewhere near this trait' — it was the move from 'this trait exists and is useful' to 'it exists because it was useful.'"**
  *   **Verdict: Basically Right.**
  *   **Why:** This is the core of the Spandrels argument. Gould and Lewontin were attacking a specific modal fallacy: inferring history from current utility. Ravi correctly identifies that Ines is defending the ability to detect *current* selection, whereas the Spandrels paper warned against assuming current utility explains *historical origin*.

  **Ravi (2): "He drew three questions... (1) origin... (2) maintenance... (3) shape... adaptationists answer with evidence for (2), which is a different claim."**
  *   **Verdict: Basically Right.**
  *   **Why:** This triad is an excellent philosophical dissection of the problem.
      1.  **Origin:** Historical causation (often inaccessible).
      2.  **Maintenance:** Current causal role (tractable).
      3.  **Shape:** The degree of fit between form and function (the "Panglossian" element).
      Ravi is correct that much of behavioral ecology and evolutionary psychology provides evidence for (2) (e.g., knockout studies, fitness correlations) but presents it as proof of (1) and (3). Demonstrating a trait is currently useful does not prove it was selected *for* that use originally, nor does it prove every detail of its structure is optimized for that use.

  **Ines (2): "Only (2) is scientifically tractable. (1) is unreachable history, and (3) is unfalsifiable... (1) versus (2) is already in the literature — that's just the exaptation distinction."**
  *   **Verdict: Half-right.**
  *   **Why:** She is right that (2) is the most tractable and that the origin/maintenance distinction is codified as "exaptation" (a term Gould later championed). However, she is wrong to dismiss (1) as unreachable; phylogenetics and paleontology often allow robust inferences about origin. More importantly, she is wrong to collapse (3) into (1). The "Shape" question is distinct: a trait can have an adaptive origin (1) but possess detailed structural features that are *not* adaptive (3) due to drift, pleiotropy, or physical constraint. Dismissing (3) as unfalsifiable is a concession to the adaptationists she claims to oppose; modern morphometrics and evo-devo attempt to test (3) directly.

  **Ravi (3): "(3) is where the actual explanatory weight sits... 'It's for X' gets presented as an account of the form, but what gets measured is that removing it lowers fitness."**
  *   **Verdict: Basically Right.**
  *   **Why:** This is the strongest philosophical point in the exchange. An adaptationist explanation claims to explain the *specificity* of the form (why *this* shape and not another?). Merely showing that the trait is necessary for fitness (removal lowers fitness) only proves it is a "necessary condition," not that it is an "optimized design." The chin example is apt: the chin might be mechanically necessary (or neutral), but claiming it is "for" sexual selection requires explaining its specific geometry, which often isn't done.

  **Ines (3): "Those are cases where the feature is a necessary consequence of something else... Find the coupling and you've got a result, not a conversation stopper."**
  *   **Verdict: Half-right.**
  *   **Why:** She is right that developmental constraints and architectural coupling are empirically discoverable (this is the bread and butter of Evo-Devo). However, she underestimates the difficulty. Identifying a constraint requires a model of what the trait *would* look like if it were purely adaptive to compare it against. You cannot identify a "leftover" without a prior theory of "design."

  **Ravi (4): "It's only testable once you've decided which trait is the real target of selection, and that's the circularity. You need the architectural facts before you can tell design from leftovers, and in biology you get the architectural facts by first assuming some traits are adaptations."**
  *   **Verdict: Basically Right.**
  *   **Why:** This identifies the **Trait Individuation Problem**. To test if a trait is an adaptation, you must first define the trait boundaries. But biologists often carve nature at joints that presuppose function (e.g., defining a "wing" rather than a "forelimb extension"). If you define the trait by its function, you have rigged the test. Ravi correctly identifies that the "constraint" vs. "adaptation" debate often stalls because there is no theory-neutral way to individuate the units being tested.

  **Final Accusation (Dustbin Categories): "Unfalsifiable dustbin category — hers is 'constraint,' his is 'adaptive story not yet found'."**
  *   **Verdict: Half-right (Both).**
  *   **Why:** Both are vulnerable here. "Constraint" can become a magic word that stops inquiry prematurely (Ines's risk). "Adaptive story not yet found" can insulate adaptationism from refutation indefinitely (Ravi's risk). However, "Constraint" is arguably more tractable because it points toward physical or developmental mechanisms, whereas "hidden function" points toward a potentially infinite search space.

  ---

  ### What Both Are Missing

  There are three critical layers to this debate that neither Ines nor Ravi explicitly articulated.

  **1. Methodological vs. Empirical Adaptationism**
  Ines is defending *Methodological Adaptationism*: the heuristic strategy of assuming traits are adaptations to generate testable hypotheses. This is widely accepted as useful, even by critics. Ravi is attacking *Empirical Adaptationism*: the claim that most traits *are* in fact adaptations. The literature has largely settled that Methodological Adaptationism is a valid tool, while Empirical Adaptationism is false (not everything is an adaptation). They are arguing as if the validity of the *method* depends on the truth of the *claim*, which is a category error.

  **2. The Null Model Dispute**
  The core technical dispute isn't just about "stories," it's about statistics. Adaptationism often functions as the *null hypothesis* in biology (assume selection until proven otherwise). Ravi implies the null should be "drift/constraint." Ines implies the null should be "selection." This is a live methodological war. If you set adaptation as the null, you require massive evidence to prove a spandrel. If you set drift as the null, you require massive evidence to prove adaptation. They are fighting over the burden of proof without naming it.

  **3. The Pluralist Synthesis**
  Both speak as if "Adaptationism" and "Spandrels" are mutually exclusive camps. In modern evolutionary biology, they are integrated. The "Extended Evolutionary Synthesis" explicitly incorporates developmental bias (Ines's point) alongside selection (Ines's tools). The debate is no longer "Selection vs. Constraint," but "How do we weight the variance explained by each?" Both speakers are fighting a 1980s battle in a 2020s context.

  ---

  ### Settled vs. Live Disputes

  To help you referee the department, here is the status of the claims based on the current philosophy of biology consensus.

  **Settled (Consensus)**
  *   **Not every trait is an adaptation.** The Panglossian Paradigm (everything is optimal) is rejected.
  *   **Exaptation is real.** Traits can originate for one reason (or no reason) and be co-opted later.
  *   **Current utility $\neq$ Historical origin.** Inferring history solely from current function is a logical fallacy.
  *   **Constraints exist.** Physical, developmental, and phylogenetic constraints limit the scope of selection.
  *   **Drift is significant.** Neutral evolution accounts for a substantial portion of genomic and phenotypic variation.

  **Live Disputes (Still Contested)**
  *   **The Prevalence Question:** What *percentage* of phenotypic variance is due to selection vs. drift/constraint? Estimates vary wildly between fields (e.g., behavioral ecology vs. morphometrics).
  *   **Trait Individuation:** How do we define a "trait" without presupposing its function? There is no agreed-upon protocol for this.
  *   **The Null Hypothesis:** Should adaptation be the default assumption to be disproven, or should neutrality/constraint be the default? (This splits the field).
  *   **The "Shape" Problem:** To what degree does selection account for the *fine-grained detail* of a structure versus its general presence? (Ravi's point 3). This is rarely quantified rigorously.

  ### Recommendation for the Department

  Ines is right that we have better tools now, but Ravi is right that the tools don't solve the logical inference problem.

  *   **Support Ines on:** The necessity of testing adaptive hypotheses. We cannot do biology without assuming function sometimes.
  *   **Support Ravi on:** The need for rigor in distinguishing maintenance from origin, and the danger of assuming that because a trait is useful, its specific form is optimized.

  **The Verdict:** The Spandrels paper is not "out of date" (Ines is wrong there), but its function has shifted. It is no longer a warning that we *cannot* test adaptation; it is a warning that we *must not conflate* testing current utility with explaining historical origin and detailed form. Ravi has the stronger philosophical grip on the text, but Ines has the stronger grasp on modern empirical practice. The synthesis is: Use Ines's tools to test Ravi's distinctions.
