      *   They are fighting about *methodology* and *logic*, but missing the *heuristic* value of adaptationism.
      *   They are missing the distinction between *global* adaptationism (everything is optimal) and *local* adaptationism (this trait is an adaptation). G&L attacked the global, defended the local testing.
      *   They are missing the role of *null models*. Adaptationism is often a null hypothesis, not a dogma.
