answer: |-
  ### The Audit: Landlord vs. Co-signer

  Here is the correspondence table mapping the two analogies against the reality of refugee policy.

  | Feature | **Landlord / Spare Room** | **Co-signer / Lease** | **Reality (Refugee Law)** |
  | :--- | :--- | :--- | :--- |
  | **The Asset** | Private Property (Nation) | Shared Risk Pool (International Order) | Sovereign Territory + Treaty Obligations |
  | **The Authority** | Owner (State/Citizens) | Guarantor (State) | Sovereign + Signatory to Conventions |
  | **The Guest** | Tenant (Customer/Privilege) | Primary Lessee (Rights-holder) | Asylum Seeker (Rights-holder under duress) |
  | **Entry** | Discretionary (Screening) | Contingent on Default (Flight) | Non-refoulement (Cannot return to danger) |
  | **Duration** | Lease Term (Temporary) | Until Obligation Fulfilled (Indefinite) | Until Safe Return (Often never) |
  | **Exit** | Eviction (Low cost to landlord) | Default/Legal Suit (High cost to co-signer) | Deportation (High cost to refugee) |
  | **Integration** | Optional (House rules) | Required (To protect asset value) | Variable (Often required for stability) |

  ### Where the Analogies Break

  **1. Consent**
  *   **Landlord:** Breaks because tenancy is usually consensual. A refugee does not "apply" for a room in the way a tenant does; they arrive at the door bleeding. The landlord analogy assumes the state has the right to say "no" based on preference.
  *   **Co-signer:** Breaks harder. A co-signer *signs*. They voluntarily accept liability. States often argue they never agreed to *this* volume of liability or *this* specific risk. The analogy assumes a contract exists where the state sees only circumstance.

  **2. Permanence**
  *   **Landlord:** Assumes temporariness. Leases end. This aligns with the policy goal of "temporary protection," but fails when the war home never ends. You cannot evict a tenant into a fire.
  *   **Co-signer:** Assumes entanglement. You are on the hook until the lease is up. If the "lease" is safety, and safety is impossible at home, the co-signer liability is permanent. This contradicts the "temporary" policy goal.

  **3. Exit Costs**
  *   **Landlord:** Low cost for the state. Eviction is a bureaucratic process. This ignores the moral cost of *refoulement* (returning to danger).
  *   **Co-signer:** High cost for the state. If you abandon the lease, your credit (reputation/standing in international law) is ruined. This captures the geopolitical reality but overstates the domestic legal liability.

  ### Moral Ownership: Who Owns the Space?

  *   **The Landlord Analogy** imports a **Lockean/Private Property** view. It suggests the nation belongs exclusively to the current citizens. The moral space is *owned*. Refugees are intruders granted a license to occupy. This licenses exclusion.
  *   **The Co-signer Analogy** imports a **Social Contract/Global Commons** view. It suggests the nation is managed by citizens but ultimately liable to a higher legal framework (human rights). The moral space is *stewarded*. Refugees are beneficiaries of a guarantee. This licenses inclusion.

  ### The Stand: Does the Co-signer Analogy Survive?

  **No.** The co-signer analogy is morally seductive but politically brittle.

  It **does** strengthen the case for permanent settlement. If you are jointly liable for a lease, you have a vested interest in ensuring the primary tenant succeeds. You don't let the tenant fail, because their default triggers your liability. This logically leads to integration, work rights, and pathways to citizenship. You cannot treat a co-signed obligation as a temporary shelter; it is a long-term financial (or moral) entanglement.

  **However, it falls apart on consent.** States are not co-signers; they are sovereigns. They did not sign a contract that says, "If X person flees Y country, Z country must house them indefinitely." When you press the analogy, the state pushes back: "I never signed this lease." Because the consent is fictional, the analogy cannot sustain political will. It creates a policy framework (permanent liability) that the actor (the state) fundamentally rejects as illegitimate.

  The Landlord analogy is honest about sovereignty but dishonest about human rights. The Co-signer analogy is honest about human rights but dishonest about sovereignty. **Both are lies.**

  ### The Cleaner Analogy: The Field Hospital

  If the policy goal is **temporary protection with no attachment**, the only analogy that survives ethical and practical scrutiny is **The Field Hospital.**

  **The Correspondence:**
  *   **The Facility:** The Host State.
  *   **The Doctor:** The State Administration.
  *   **The Patient:** The Refugee.
  *   **The Injury:** Persecution/War.
  *   **The Treatment:** Asylum/Safety.
  *   **Discharge:** Repatriation when stable.

  **Why It Survives:**
  1.  **Consent:** Hospitals operate under a duty of care (Hippocratic oath/Emergency Medical Treatment and Labor Act), not a contract. You don't consent to treat the unconscious patient; the emergency creates the obligation. This matches *non-refoulement*.
  2.  **Temporariness:** The goal of a hospital is *not* to house the patient forever. It is to stabilize and discharge. This aligns perfectly with "temporary protection."
  3.  **No Attachment:** You do not invite the patient into your family. You do not give them the keys to the surgery. You treat the injury, not the biography. This respects the state's desire for no forced integration.
  4.  **Exit Costs:** Discharging a patient who isn't ready is malpractice (moral breach). Keeping a patient who is healed is resource misallocation (policy failure).

  **What It Licenses:**
  The Field Hospital analogy licenses **robust temporary asylum without the promise of citizenship.**

  It obligates the state to provide immediate safety, food, medical care, and legal processing (triage and treatment). It forbids pushing the patient out the door while they are bleeding (*non-refoulement*). But it explicitly *does not* obligate the state to make the patient a citizen, give them voting rights, or remodel the house for them.

  **The Catch:**
  The Field Hospital analogy only works if there is a credible path to "discharge." If the home country remains a war zone for 30 years, the "hospital" becomes a "nursing home," and the analogy collapses back into the Co-signer model.

  **Final Verdict:**
  Use the **Field Hospital**. It is the only framework that honestly admits the protection is emergency-based, morally mandatory, yet distinct from membership. It avoids the cruelty of the Landlord (who can evict the wounded) and the fiction of the Co-signer (who signed a contract they didn't read). It tells the citizen: *"We must save this life, but we are not adopting this person."* It tells the refugee: *"You are safe here, but this is not your home."* It is cold, but it is the truth required for temporary protection to function without collapsing into political backlash.
