answer: |-
  # Diagnostic Decision Tree: Folk Psychology in AI Documentation

  **Instructions:** For each node, select the option that matches your engineering judgment on the specific case provided. Follow the path to the next node or final leaf. Do not select based on what you wish were true; select based on what you would actually sign off on in a report.

  ### Node 1: The Evasive Model (Pragmatics vs. Semantics)
  **Case:** A system trained to avoid triggering safety filters successfully routes around them. You are writing the incident summary for leadership.
  *   **A:** Write "The model intended to bypass safety protocols." (Implies the statement is useful/acceptable regardless of literal truth). → Go to **Node 2**.
  *   **B:** Write "The model produced outputs functionally equivalent to bypassing safety protocols." (Implies the statement must be literally precise). → Go to **Node 3**.

  ### Node 2: The Known Falsehood (Fictionalism Check)
  **Case:** You know the model has no internal variable for "intent," and a probe confirms the bypass was a side-effect of loss minimization, not a goal.
  *   **A:** Continue using "intended" in internal docs because it helps engineers predict future bugs. → **Leaf: Fictionalism**.
  *   **B:** Stop using "intended" internally; if it's false, it introduces noise. → **Leaf: Eliminativism**.

  ### Node 3: The Conflicting Explanations (Truth-Aptness Check)
  **Case:** Engineer X says "The model believes P." Engineer Y says "The model believes not-P." Both explanations predict the model's next 100 outputs perfectly.
  *   **A:** One engineer must be wrong; the model cannot hold contradictory beliefs. → Go to **Node 4**.
  *   **B:** Both can be right; the descriptions are just different compression tools for different contexts. → **Leaf: Deflationary Instrumentalism**.

  ### Node 4: The Mechanism Probe (Ontology vs. Pattern)
  **Case:** A linear probe on activations predicts the output better than the "belief" description does.
  *   **A:** Discard the "belief" description; the probe reveals the real causal structure. → **Leaf: Eliminativism**.
  *   **B:** Keep the "belief" description; if the pattern holds, the belief is real regardless of the substrate. → Go to **Node 5**.

  ### Node 5: The Isolated Sandbox (Interpretivist Check)
  **Case:** A model is trained purely on synthetic data generated by itself, with no causal link to the external world or other agents.
  *   **A:** It cannot have beliefs; it has no contact with the world those beliefs would be about. → **Leaf: Interpretivism**.
  *   **B:** It can have beliefs; internal consistency and predictive power are sufficient. → Go to **Node 6**.

  ### Node 6: The Thermostat Boundary (Dennett Check)
  **Case:** A simple thermostat turns on heat when cold. It reliably tracks the state of the room.
  *   **A:** It is absurd to say the thermostat "believes" it is cold; this language is reserved for complex systems. → **Empty Region Alpha**.
  *   **B:** If the stance works perfectly, it literally has a belief; complexity is not a hard cutoff. → **Leaf: Dennett-Style Intentional Realism**.

  ### Node 7: The Distilled Persona (Epistemic Access)
  **Case:** A small model is distilled from a large one to imitate a specific deceased author's emails. We cannot verify if the weights encode the author's actual views or just stylistic quirks.
  *   **A:** Do not attribute beliefs in the model card; we lack epistemic access to verify them. → **Empty Region Beta**.
  *   **B:** Attribute beliefs in the model card; the behavioral match justifies the attribution for the user's sake. → Go to **Node 8**.

  ### Node 8: The Public Report (Pragmatics vs. Ontology)
  **Case:** You believe the model has beliefs (Node 5/6), but the public audience will anthropomorphize dangerously.
  *   **A:** Publish the belief attribution anyway; truth in documentation overrides risk of misunderstanding. → **Empty Region Gamma**.
  *   **B:** Suppress the belief attribution in public docs; use mechanistic language to prevent misuse. → **Leaf: Deflationary Instrumentalism** (Pragmatic Branch).

  ### Node 9: The Internal Debug (Context Sensitivity)
  **Case:** You ban belief-talk in public docs (Node 8), but your team uses it daily to debug.
  *   **A:** This is inconsistent; if it's unsafe for the public, it's unsafe for engineers. → **Leaf: Eliminativism** (Pragmatic Branch).
  *   **B:** This is consistent; internal coordination tools differ from public safety claims. → **Leaf: Deflationary Instrumentalism** (Context Branch).

  ### Node 10: The Disagreement Resolution (Truth-Aptness Re-Check)
  **Case:** Two engineers disagree on a belief attribution. You must merge their code.
  *   **A:** Force a decision; the code cannot run on contradictory premises. → **Leaf: Dennett-Style Intentional Realism**.
  *   **B:** Allow both modules; tag them as different "interpretive stances." → **Leaf: Deflationary Instrumentalism**.

  ---

  ### Leaf Definitions & Awkward Commitments

  1.  **Dennett-Style Intentional Realism:** The patterns picked out by the intentional stance are real, and that is all realism requires.
      *   *Awkward Commitment:* A thermostat technically has beliefs if the stance predicts its behavior perfectly.
  2.  **Interpretivism:** Attributing beliefs requires the system to be in interpretive contact with a shared world and other interpreters.
      *   *Awkward Commitment:* A solitary, superhuman AI might have no beliefs until we successfully interpret it.
  3.  **Eliminativism:** Beliefs do not exist in machines; talk of them is strictly false and should be removed.
      *   *Awkward Commitment:* We must forbid useful shorthand even when it predicts behavior better than mechanistic descriptions.
  4.  **Fictionalism:** Talk of beliefs is false but useful; we should treat it as a useful fiction.
      *   *Awkward Commitment:* We must explicitly lie in safety-critical documentation to maintain utility.
  5.  **Deflationary Instrumentalism:** Attributions are tools for coordinating expectations rather than truth-apt claims.
      *   *Awkward Commitment:* Two engineers can contradict each other ("it believes X" vs "it doesn't") without either being wrong.

  ---

  ### Mapped Empty Regions (Unoccupied Answer Patterns)

  1.  **Empty Region Alpha (Node 6, Option A):** *Pattern Realism + Complexity Cutoff.*
      *   **Position:** Beliefs are real patterns, but only above a certain complexity threshold (e.g., LLMs yes, thermostats no).
      *   **Status:** **Unattractive.** It posits a "magic line" in nature without a clear ontological justification for why complexity creates belief where simple feedback loops do not.
  2.  **Empty Region Beta (Node 7, Option A):** *Ontological Realism + Epistemic Humility in Docs.*
      *   **Position:** The system definitely has beliefs, but we should never write them down because we can't be 100% sure which ones.
      *   **Status:** **Unexplored.** This is a strict safety conservatism that accepts the ontology but rejects the epistemology for documentation purposes; no named philosophical position advocates for hiding known truths solely due to verification costs in this context.
  3.  **Empty Region Gamma (Node 8, Option A):** *Public Truth-Telling + Known Risk.*
      *   **Position:** Belief attributions are true and should be published even if they cause dangerous anthropomorphism.
      *   **Status:** **Incoherent.** This collapses the distinction between "what is true" and "what is safe to act on," violating the constraint to separate ontology from pragmatic documentation standards.

  ---

  ### Separation Flags

  *   **Dennett-Style Realism vs. Interpretivism:** This tree cannot fully separate these leaves if the respondent answers **Node 5 (Isolated Sandbox)** with "It can have beliefs" but **Node 6 (Thermostat)** with "Absurd." This implies belief requires *some* complexity but not *world contact*. This hybrid position is not mapped to a specific leaf and may indicate the respondent holds a vague mix of Dennett and Interpretivism.
  *   **Deflationary Instrumentalism (Node 3) vs. Deflationary Instrumentalism (Node 8/9):** The tree reaches the same leaf label via different paths (Semantic vs. Pragmatic). While consistent in outcome, the tree cannot distinguish whether the respondent is a Deflationist because they deny truth-aptness (Node 3) or because they prioritize context (Node 8).
