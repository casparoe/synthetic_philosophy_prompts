answer: |-
  Consider two senior aviation maintenance inspectors, Agent A and Agent B, employed by different carriers under identical federal regulations but differing internal safety protocols. Both inspect a batch of hydraulic seals using the same visual checklist, possess identical expertise, and approve identical components containing an undetectable microscopic fracture that poses a catastrophic failure risk. Agent B works for a legacy carrier where human approval directly clears the aircraft for flight; consequently, the seal fails mid-flight, causing a crash landing and severe injuries, leading to B's immediate termination and public censure for negligence. Agent A works for a modern carrier employing an optimal "moral buffer": an automated, non-defective pressure-testing protocol that occurs *after* human approval but *before* flight clearance, which intercepts the fracture and grounds the plane safely. Because the system prevented harm, Agent A is publicly praised for operating within a robust safety culture that "caught" the defect, despite having made the exact same initial approval judgment as B with the same hidden information. The institutional response exonerates A based on the system's success while punishing B based on the system's absence, creating a sharp divergence in moral assessment despite identical individual agency and intent.

  (a) **Contested Belief:** The belief that moral assessment should track the intrinsic quality of the agent's choice and control rather than the extrinsic outcome mediated by systemic architecture.
  (b) **Structural Feature:** The mandatory intermediate verification step that severs the causal link between human approval and operational deployment, ensuring the agent's decision is not sufficient to produce the outcome.
  (c) **Verdicts:**
  *   **Control Principle:** A and B are equally responsible (or equally blameless), as the hidden risk and the buffer's intervention were outside their individual control.
  *   **Standard Individualist Outcome-Sensitive:** B is more blameworthy because their action causally contributed to harm; A is less blameworthy because their action did not.
  *   **Structural Moral-Luck:** A is less blameworthy (or praiseworthy) because the institution successfully managed risk; B is more blameworthy because they operated in a fragile system where individual error translates directly to harm.

  **Philosophical Work:** The causal interception (the buffer) creates moral luck by altering outcomes without altering agency, forcing a conflict between control-based and outcome-based assessment.
  **Removal of Buffer:** If the buffer is removed, A and B face identical causal pathways, resulting in identical outcomes (harm) and convergent blame.
  **Control Principle Attack:** A defender could argue that the institutional praise for A is a category error—attributing systemic reliability to individual virtue—and maintain that moral status remains identical regardless of the machine's intervention, asserting that the divergence in *sanction* described in the scenario reflects an institutional error rather than a valid moral distinction.
