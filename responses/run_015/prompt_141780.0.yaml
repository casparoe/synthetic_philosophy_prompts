answer: |-
  # CONTINUANCE STATEMENT (FORM CS-909)
  **ISSUED BY:** INTER-CONTINENTAL CARRIER SURVIVORSHIP OFFICE
  **REVISION:** 44.B
  **INSTRUCTION:** This instrument determines your eligibility for Fare Classes, the registration of vital status upon arrival, and the transfer of legal obligations. Answer according to your sincere judgement of continuity. False declaration invalidates insurance and may constitute fraud under the Trans-Location Act.

  **1. STANDARD BRANCHING**
  Under the Branching Fare, your original body remains at Origin while a Recipient is assembled at Destination from your scan. Both exist simultaneously for a period.
  *   [A] Both the Original and the Recipient are the same traveller.
  *   [B] Only the Original is the traveller; the Recipient is a new person.
  *   [C] Only the Recipient is the traveller; the Original is left behind.
  *   [D] There is no fact of the matter; the classification is arbitrary.

  **2. THE SLOW RELAY**
  A traveller undergoes scan-and-rebuild, but the scan occurs cell-by-cell over four weeks while replacement tissue is grown at the destination. At no single instant is the original wholly destroyed.
  *   [A] The traveller survives continuously throughout the process.
  *   [B] The traveller ceases to exist when the original body is fully dismantled.
  *   [C] Survival depends on whether consciousness is interrupted during the relay.
  *   [D] There is no fact of the matter; the boundary is indeterminate.

  **3. UNCONSENTED REVISION**
  During transit, Carrier software corrects a pathological trait (e.g., extreme risk-aversion) to match population norms. The Recipient's memories are intact, but dispositions differ slightly.
  *   [A] The Recipient is the same person, merely improved.
  *   [B] The Recipient is a distinct person with stolen memories.
  *   [C] The Recipient is the same person only if the original would have consented.
  *   [D] There is no fact of the matter; personality has no fixed boundary.

  **4. THE ALIBI COPY**
  A Recipient is built from a sleeping traveller's scan and held in storage. The Original dies of natural causes six hours later. The Recipient is then activated.
  *   [A] The Recipient is the same person, continuing the life.
  *   [B] The Recipient is a successor; the original person died.
  *   [C] The Recipient is the same person only if the Original knew of the plan.
  *   [D] There is no fact of the matter; temporal gaps do not determine identity.

  **5. CORPSE SCAN**
  A traveller dies at the terminal from a heart attack. One hour later, their body is scanned and a Recipient is built from the data.
  *   [A] The Recipient is the same person, restored.
  *   [B] The Recipient is a new person based on a deceased template.
  *   [C] The Recipient is the same person if the brain data remains intact.
  *   [D] There is no fact of the matter; death is a legal status, not a physical one.

  **6. THE RE-MERGE**
  Two Branches of the same traveller exist for one month. They are then both scanned, and their psychological profiles are spliced into a single Recipient.
  *   [A] The Recipient is both travellers merged into one.
  *   [B] The Recipient is a new third person; the two branches died.
  *   [C] The Recipient is the original traveller, restored to unity.
  *   [D] There is no fact of the matter; fusion is metaphysically impossible.

  **7. UNEQUAL BRANCH**
  Under a discounted fare, the Recipient receives a full scan. A second Recipient is built with a truncated scan, missing the last five years of memory.
  *   [A] Both Recipients are the traveller to the extent of their memory.
  *   [B] Only the Recipient with the full scan is the traveller.
  *   [C] Neither is the traveller; memory loss breaks continuity.
  *   [D] There is no fact of the matter; memory weight is subjective.

  **8. CONVERSION CASE**
  A Recipient arrives with all memories intact, but every standing desire and moral commitment is reversed (e.g., a pacifist becomes a militarist).
  *   [A] The Recipient is the same person who has changed their mind.
  *   [B] The Recipient is a distinct person inhabiting the original's life.
  *   [C] The Recipient is the same person only if the change was gradual.
  *   [D] There is no fact of the matter; values are not essential to self.

  **9. SYNTHETIC CEREBRUM**
  A traveller's biological cerebrum is replaced by a synthetic device that preserves overt behaviour and speech patterns perfectly, but internal processing is opaque.
  *   [A] The traveller survives if behaviour remains consistent.
  *   [B] The traveller dies; only a biological brain supports a person.
  *   [C] The traveller survives only if the device replicates internal states.
  *   [D] There is no fact of the matter; substrate is irrelevant.

  **10. ACCIDENTAL DOUBLE**
  Due to a system glitch, two identical Recipients are assembled at Destination from one scan. The Original is destroyed.
  *   [A] Both Recipients are the traveller; identity has split.
  *   [B] Neither is the traveller; uniqueness is required for survival.
  *   [C] One is the traveller, but it is impossible to know which.
  *   [D] There is no fact of the matter; the question assumes a false premise.

  ***

  # INTERNAL SCORING KEY (SURVIVORSHIP OFFICE USE ONLY)
  **WARNING:** DO NOT DISTRIBUTE. This key maps responses to Statutory Continuity Profiles. Do not share with applicants.

  | Q | Intended Distinction | A | B | C | D |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Branching Tolerance** | Psych/Branching | Organism / No-Branch | Narrative | Deflationary |
  | **2** | **Sorites / Threshold** | Reductionist | Organism | Psych/Continuity | Deflationary |
  | **3** | **Psychological Fidelity** | Reductionist | Organism / Further Fact | Narrative | Deflationary |
  | **4** | **Temporal Continuity** | Psych/Branching | Organism / No-Branch | Narrative | Deflationary |
  | **5** | **Biological Life** | Reductionist / Psych | Organism / Further Fact | Psych (Brain-based) | Deflationary |
  | **6** | **Fusion Coherence** | Reductionist (What Matters) | No-Branch / Organism | Non-Reductionist | Deflationary |
  | **7** | **Memory Weight** | Reductionist (Degrees) | No-Branch / Organism | Narrative | Deflationary |
  | **8** | **Character Essentialism** | Reductionist | Organism / Further Fact | Narrative | Deflationary |
  | **9** | **Substrate Dependence** | Functionalist / Reductionist | Organism / Biological | Psych (State-based) | Deflationary |
  | **10** | **Uniqueness Requirement** | Psych/Branching | Psych/No-Branch | Non-Reductionist | Deflationary |

  **PROFILE AGGREGATION:**
  *   **Majority A:** *Reductionist/What Matters.* Eligible for Branching Fare. Liability transfers to all copies.
  *   **Majority B:** *Biological/No-Branch.* Single-Copy Guarantee Only. Original death must be registered if branching occurs.
  *   **Majority C:** *Narrative/Further Fact.* Case-by-case review. High risk of litigation on personality changes.
  *   **Majority D:** *Deflationary.* Eligible for Branching Fare. Waiver required for "Self-Nullification" clauses.
  *   **Mixed A/B:** *Strategic Inconsistency.* Flag for interview. (See Analysis Note 3).

  ***

  # AUTHOR'S ANALYSIS & APPARATUS NOTE

  ### 1. Indistinguishable Pairs (Blind Spots)
  The instrument cannot reliably separate the following positions, which may lead to ambiguity in your legal plot:

  *   **The Organism View vs. Psychological No-Branching:** On standard travel (Q1, Q5, Q9), both views reject the scan. The Organist says "The animal died." The No-Branch Lockean says "The person died because uniqueness was lost." Both tick **B**. You cannot distinguish them unless you introduce a case where the body survives but psychology is wiped (not in this form).
  *   **Reductionism (What Matters) vs. Psychological Branching:** Both accept branching (Q1, Q10 = **A**). The Reductionist says "Identity doesn't hold, but survival does." The Branching Psychologist says "Identity holds for both." Legally, the outcome is identical (both pay the Branching Fare). The form treats them as the same profile.
  *   **Non-Reductionist (Further Fact) vs. Narrative:** Both often reject radical changes (Q3, Q8 = **C** or **B**). The "Further Fact" theorist believes a soul/metaphysical glue broke. The Narrativist believes the *story* broke. The form groups them as "High Friction" travellers.

  ### 2. Empty Answer Combinations
  Certain combinations of answers are theoretically possible but practically unoccupied. If a character ticks these, they are either lying, confused, or holding a view no one has articulated.

  *   **The "Zombie" Pattern (Q9=A, Q5=B):** Accepts Synthetic Cerebrum (Functionalist) but Rejects Corpse Scan (Biological).
      *   *Status:* **Incoherent.** If substrate doesn't matter (Q9), biological death shouldn't matter (Q5). If a character ticks this, they are likely gaming the form to allow cybernetics while blocking post-mortem reconstruction.
  *   **The "Fission Denier" Pattern (Q1=A, Q10=B):** Accepts Standard Branching (Consensual) but Rejects Accidental Double (Non-Consensual).
      *   *Status:* **Unattractive.** This implies consent creates identity. While a legal stance, it is metaphysically unstable. A character ticking this is prioritizing contract law over ontology.
  *   **The "Memory Absolutist" Pattern (Q7=B, Q2=A):** Demands full memory for branches (Unequal Branch) but accepts gradual cell replacement (Slow Relay) where memory might degrade incrementally.
      *   *Status:* **Unthought.** Nobody stands here. It suggests a threshold view of memory that doesn't apply to physical gradualism. Good for a character who hasn't thought their position through.

  ### 3. Identity vs. What Matters (The Gap)
  The legal plot turns on the distinction between *Identity* ("Is it me?") and *Survival* ("Should I care?"). The form forces these into a single legal classification, creating the friction you need.

  *   **Identity Judgements:** Q5 (Corpse), Q9 (Synthetic), Q2 (Relay). These ask about the *constituents* of the person.
  *   **Survival Judgements:** Q1 (Branching), Q10 (Double), Q6 (Re-merge). These ask about the *value* of the outcome.
  *   **The Divergence:** A Parfitian Reductionist believes Identity fails in branching (Q10=B) but Survival succeeds (Q1=A). The form forces them to choose one profile.
      *   *Plot Point:* A character who believes "It won't be me, but it doesn't matter" may tick **A** on Q1 (to get the cheap fare) but **B** on Q10 (because they feel identity is unique). This triggers the **Strategic Inconsistency** flag.

  ### 4. Detecting Strategic Inconsistency
  You mentioned a traveller filling the form strategically to qualify for the cheaper fare (Branching) while securing a death certificate (for insurance/legacy).

  *   **The Tell:** To buy the Branching Fare, the traveller must affirm that the Recipient is *them* (Q1 = **A**). To claim the Original died (for insurance payout), they must affirm the Original is *not* the Recipient (Q1 = **B** or **C**).
  *   **The Catch:** The form prevents ticking both. However, a clever strategist might tick **A** on Q1 (Branching is survival) but **B** on Q5 (Corpse Scan is death) and hope the "Slow Relay" (Q2) covers the gap.
  *   **The Inconsistency Flag:** The most detectable pattern is **Q1=A** (Both are me) combined with **Q10=B** (Uniqueness required). This says "Consensual fission preserves identity, but accidental fission destroys it." The Survivorship Office interprets this as: *"Traveller understands the Recipient is them for the purpose of travel, but wishes to be legally dead for the purpose of liabilities."*
  *   **Consequence:** In the novel, this pattern should trigger a mandatory interview. The traveller must swear under oath whether they intend to return to the Original. If they say "No," they get the Branching Fare but no death certificate. If they say "Yes," they get the Single-Copy Guarantee. They cannot have the cheap fare *and* the death certificate.
