answer: |-
  # SEMINAR DECISION TREE: COLLAPSE VS. REARRANGEMENT

  **START:** Select your case (LBA Mediterranean, Classic Maya, Easter Island) and follow the logic.

  ### NODE 1: DEFINITION
  **Q1: Is a demographic drop (death/migration) required for "collapse," or is the vanishing of state institutions sufficient?**
  *   **(A) Demography Required:** People must die or leave for it to count.
  *   **(B) Institutions Sufficient:** If the government/palace falls, it's collapse (even if people stay).

  ---

  ### NODE 2: CULTURAL MARKERS
  **Q4: If writing/ritual/language survives but palaces disappear, is that still collapse?**
  *(Note: Addressed early to clarify what "Institutions" means in Node 1)*
  *   **(A) Yes, Still Collapse:** Palaces/Elite culture define the society.
  *   **(B) No, Not Collapse:** Vernacular culture (language/farming) defines the society.

  ---

  ### NODE 3: CAUSALITY
  **Q2: Is ecological damage necessary for collapse, or just one possible route?**
  *   **(A) Necessary:** Environment is the primary driver (Determinism).
  *   **(B) One Route/Optional:** Politics/War/Trade are sufficient causes (Complexity).

  ---

  ### NODE 4: EXPERIENCE
  **Q3: Does it matter if people at the time felt a rupture vs. seeing it as slow change?**
  *   **(A) Matters (Phenomenological):** If they didn't feel the end, it wasn't the end.
  *   **(B) Doesn't Matter (Structural):** Objective systems matter more than subjective feelings.

  ---

  ## THE LEAVES (POSITIONS)

  ### 🍂 LEAF 1: HARD ECOLOGICAL CATASTROPHIST
  *   **Path:** Q1(A) Demography + Q2(A) Ecology Necessary + Q4(A) Palaces + Q3(B) Feelings Irrelevant
  *   **Named Position:** *Neo-Malthusian / Diamond-ian*
  *   **Weirdest Commitment:** Must argue **Easter Island "Collapsed"** even though Rapa Nui people never left, because the trees died and statues stopped.
  *   **⚠️ OVERLAP FLAG:** Lands on same "Collapse" conclusion as *Complexity Traditionalist* (Leaf 2), but differs on *why* (Trees vs. Taxes).

  ### 🍂 LEAF 2: COMPLEXITY TRADITIONALIST
  *   **Path:** Q1(B) Institutions + Q2(B) Ecology Optional + Q4(A) Palaces + Q3(B) Feelings Irrelevant
  *   **Named Position:** *Tainter / Systems Theorist*
  *   **Weirdest Commitment:** Must argue **LBA Mediterranean Collapsed** even if 90% of peasants farmed the same way, simply because the Mycenaean tax collection stopped.
  *   **⚠️ OVERLAP FLAG:** Lands on same "Collapse" conclusion as *Hard Ecological Catastrophist* (Leaf 1). **Narrative Conflict:** One blames the climate, the other blames bureaucracy, but both agree the "Society" is dead.

  ### 🍂 LEAF 3: CONTINUITY TRANSFORMATIONALIST
  *   **Path:** Q1(A) Demography + Q2(B) Ecology Optional + Q4(B) Language + Q3(B) Feelings Irrelevant
  *   **Named Position:** *McAnany / Yoffee / Revisionist*
  *   **Weirdest Commitment:** Must argue **Classic Maya Did Not Collapse**, because Mayan languages persist today, rendering the abandonment of Tikal a mere "real estate shift."
  *   **⚠️ OVERLAP FLAG:** Lands on same "No Collapse" conclusion as *Experiential Continuity* (Leaf 4). **Narrative Conflict:** One relies on linguistic archaeology, the other on diary entries/inscriptions.

  ### 🍂 LEAF 4: EXPERIENTIAL CONTINUITY
  *   **Path:** Q1(B) Institutions + Q2(B) Ecology Optional + Q4(B) Language + Q3(A) Feelings Matter
  *   **Named Position:** *Phenomenological / Localist*
  *   **Weirdest Commitment:** Must argue **Easter Island Did Not Collapse** primarily because oral traditions suggest continuity of identity, even if ecological carrying capacity was breached.
  *   **⚠️ OVERLAP FLAG:** Lands on same "No Collapse" conclusion as *Continuity Transformationalist* (Leaf 3).

  ### 🍂 LEAF 5: ELITE-BIAS COLLAPSOLOGIST (The "Unnamed" Trap)
  *   **Path:** Q1(B) Institutions + Q2(A) Ecology Necessary + Q4(A) Palaces + Q3(A) Feelings Matter
  *   **Named Position:** *Romantic Declinist*
  *   **Weirdest Commitment:** Must argue **LBA Collapsed** because the *poets* stopped writing, ignoring that the *potters* kept working. Privileges the "rupture" felt by the literate minority over the stability of the illiterate majority.
  *   **⚠️ OVERLAP FLAG:** Often indistinguishable in output from *Complexity Traditionalist* (Leaf 2), but differs on **Who Writes the Narrative**. Leaf 2 says "The State died." Leaf 5 says "The World Ended (for the guys who could write)."

  ---

  ## SEMINAR DISCUSSION FLAGS

  **🚩 THE "MAYA" TRAP (Leaf 3 vs Leaf 2)**
  *   **Conflict:** Leaf 2 says Maya Collapsed (Palaces gone). Leaf 3 says Maya Transformed (People stayed).
  *   **Question:** Is "Society" a government or a population? If you choose Leaf 2, you admit "Society" is a top-down construct.

  **🚩 THE "EASTER ISLAND" TRAP (Leaf 1 vs Leaf 4)**
  *   **Conflict:** Leaf 1 says Collapsed (Ecocide). Leaf 4 says Transformed (Identity survived).
  *   **Question:** Does ecological suicide count as societal collapse if the society adapts to the new, poorer ecology? Leaf 1 says Yes. Leaf 4 says No.

  **🚩 THE NARRATIVE AUTHORITY FLAG (Leaf 2 vs Leaf 5)**
  *   **Conflict:** Both conclude "Collapse."
  *   **Difference:** Leaf 2 relies on **stratigraphy** (burn layers). Leaf 5 relies on **lamentation** (texts complaining about the end).
  *   **Risk:** Leaf 5 accidentally validates the propaganda of the losing elite as objective historical fact.
