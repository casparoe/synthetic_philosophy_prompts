answer: |-
  M: Observe the careenium. The pistons fire because heat expands gas, which drives levers. The simmballs roll into niches because of gravity and momentum. To suggest the symbols *upon* the balls steer the machinery is to confuse the label with the lever. It is substrate all the way down.

  N: Is it? Consider the swap test. We replace a simmball with a placeholder of identical mass, temperature, and position. The bulk physics are conserved. Yet, if the symbol differs, the piston trajectory shifts. The machine responds to the pattern, not merely the weight.

  M: You are smuggling in a physical difference. If the trajectory alters, the causal inputs must have differed. Perhaps the surface topology varies slightly to encode that symbol. The symbol supervenes on the physics; it does not hover above it. You cannot change the symbol without changing the substrate, however minutely.

  N: I grant the supervenience. The symbol rests upon the physics. But does supervenience without downward causation explain the *functional specificity*? Why does *this* specific pattern trigger the left piston and *that* one the right? The substrate explains how the signal travels, but only the symbolic logic explains why *this* signal maps to *that* action. The constraint comes from the pattern, not the particle.

  M: You are describing a lookup table implemented in steel. The 'logic' is just a complex chain of mechanical interactions. To say the symbol pushes the piston is like saying the map pushes the car. It is descriptive convenience, nothing more.

  N: Convenience? Consider multiple realisability. We could carve the symbol, paint it, or magnetise it. The substrate changes entirely—wood, steel, ceramic—yet the same symbol yields the same piston movement. The causal power tracks the symbol, not the material. If the substrate were the sole cause, changing the material should alter the effect. It does not.

  M: It alters the effect only because the engine is designed to be robust against such variations. That proves the engineer's skill, not the symbol's autonomy. You ask whether this proves causal autonomy or only descriptive redundancy. I submit it proves the latter. We group disparate physical states under one symbol because it aids our prediction, not because nature recognises the grouping. The universe sees only atoms; we see the code.

  N: And yet, without the code, the atoms are unintelligible. You dismiss the symbol as epiphenomenal, but you cannot predict the piston's fire without reading the ball. If the map is required to navigate the territory, perhaps the distinction is less clean than you wish.

  M: The map is in here, N, not in there. The careenium does not read meaning; it collides with shape. We supply the meaning.

  N: Then we supply the causation. For in this engine, meaning is the shape that matters.
