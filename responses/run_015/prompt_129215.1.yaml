answer: |-
  1. The archive plays the role of the map, the past itself is the terrain, resolution is the level of detail in surviving records, the zoom control is the historian's choice of scale, and the historian is the person zooming. This picture quietly conflates the terrain with the map by treating the surviving record as if it were the past itself, assuming missing data is merely out of focus rather than absent.

  2. The claim that structures repeat at every scale fails because macro forces like fiscal extraction constrain village life without being visible within it, meaning zooming in conceals causal powers rather than revealing them. This is not a quibble because it dismantles the ontological premise that the macro is merely an aggregate of the micro, rendering the micro incapable of substituting for the macro.

  3. A critic might argue that maps are visual while archives are textual, but this does not matter because both are representational systems mediating access to reality. Even if the methodological claim fails, the analogy can still carry its political claim that ordinary people are agents, provided one accepts that their actions constitute the terrain regardless of whether the map accurately renders them.

  4. The picture imports scale-invariance, the assumption that the macro is a statistical average, and a view from nowhere that ignores the archive's own structure. The superior-substitute conclusion collapses once these are exposed, making your fishing net analogy superior because it acknowledges that evidence reveals the catcher's intent as much as the sea.

  5. I would change my mind if a case demonstrated perfect source continuity across scales, such as a comprehensive census linking individual lives to state logistics without archival silence. My audit is most likely wrong if the committee uses the analogy merely as a pedagogical heuristic for scope rather than a literal claim about historical ontology.
