  *(This is the estimated frequency of moral disagreements where a mutual-gains compromise is structurally available. Given the uncertainty in these estimates, this implies a **~75% credence** that this structure applies to the strict majority of cases.)*

  ### The Decomposition
  I am treating your "mutual-gains structure" as the existence of a policy point $X$ such that both parties prefer $X$ to the *other party's* ideal point (or the conflict point). This requires preferences to be single-peaked and the policy space to be divisible.

  | Disagreement Type | Estimated Prevalence (Weight) | Prob. Mutual Gains Available | Contribution to Total |
  | :--- | :--- | :--- | :--- |
  | **1. Weighting**<br>*(Same values, different priorities)* | 50% | 90% | 45.0% |
  | **2. Existence**<br>*(One values what the other ignores)* | 35% | 50% | 17.5% |
  | **3. Lexicographic**<br>*(Sacred values / Rights / Taboos)* | 15% | 5% | 0.75% |
  | **Total** | **100%** | | **63.25% (≈60%)** |

  **Reasoning for Probabilities:**
  *   **Weighting (90%):** In budget/priority splits (like your XR vs. Disease example), utility curves are usually concave. A mix is almost always Pareto-superior to the other person's extreme. The 10% failure rate accounts for cases where one party believes the other's priority is actively harmful (negative utility), not just less important.
  *   **Existence (50%):** This is the pivot point. If the resource is divisible (budget), gains exist (I get some of what I value, you get some of what you value). But many "existence" disagreements are about binary states (e.g., "Should this species exist?"). You cannot compromise on 50% extinction. I split the difference between divisible resource fights and binary ontological fights.
  *   **Lexicographic (5%):** Sacred values function as constraints, not utility inputs. If a compromise violates the constraint (e.g., "50% of a right"), utility plummets. Compromise is rarely possible without "masking" the trade-off, which is structurally different from your budget example.

  ### Sensitivity Analysis
  My final number is most sensitive to the **Success Probability of Existence Disagreements**.

  While *Weighting* disagreements are more common, the *Existence* category is the largest source of uncertainty and variance. The difference between an existence disagreement being about a **divisible resource** (budget, time, land) versus an **indivisible state** (rights, permissions, ontological status) swings the success probability from ~90% down to ~0%.

  *   **Current Assumption:** 50% of existence disagreements allow trade (divisible).
  *   **Alternative:** If only 20% allow trade (mostly indivisible), the total drops from **60% to 47%**.
  *   **Result:** This single variable shift moves the estimate from "Majority" to "Minority."

  ### The "What Would Move It" Scenario
  You asked: *If I showed you that most real moral disagreements are existence ones rather than weighting ones, how far would your credence drop?*

  If I updated my prevalence estimates to reflect that **60% of disagreements are Existence** (and only 25% are Weighting), keeping the success rates constant:

  *   **New Calculation:** $(0.25 \times 0.90) + (0.60 \times 0.50) + (0.15 \times 0.05)$
  *   **New Total:** $0.225 + 0.30 + 0.0075 = \mathbf{53.25\%}$

  **Impact:** The estimated frequency drops from **60% to 53%**.
  **Credence Shift:** My credence that this applies to the *majority* would drop from **~75% to ~55%**.

  **Why?** Because "Existence" disagreements are fragile. They only yield mutual gains if the parties can agree to "live and let live" on divisible resources. If the disagreement is about how the world *must be* (e.g., "Abortion must be illegal" vs "Abortion must be legal"), the compromise space vanishes. Your budget example works because money is infinitely divisible; most moral conflicts are about binary permissions, which breaks the trade analogy.
