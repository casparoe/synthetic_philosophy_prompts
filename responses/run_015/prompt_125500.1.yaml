          *   *More precise example:* Diaconis and Zabell (1982) discuss this. The "Total Evidence" is not just the final probabilities. It is the *sequence of experiences*. If the experiences are independent, order doesn't matter. If they are not, the "holistic" constraint $Q(E)=q, Q(F)=r$ loses information about *how* those constraints were generated.
