      *   *Q2: Case where Sequential is right, Holistic is wrong?* Yes. The "Dietl/Armendt" style counterexamples. Imagine $E$ and $F$ are correlated. If the evidence for $F$ is actually evidence about the *reliability* of the source of $E$, or if the sensory experience of $F$ is affected by $E$.
