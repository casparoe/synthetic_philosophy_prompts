          *   *Verdict:* The rational agent *takes the toxin* (forms the intention) and *drinks it*. Why? Because the capacity to bind oneself is a prerequisite for the kind of agency that secures the reward.
          *   *Nuance:* This isn't about the specific toxin case (which is contrived) but about the *type of agent* required to navigate it.

      *   **Addressing Temporal Discounting/Planning:**
