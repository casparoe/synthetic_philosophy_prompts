      *   **Specific Framing:** Tension between *diachronic* (across time) and *synchronic* (at a specific moment) practical rationality.
      *   **Key Constraint 1:** Do *not* resolve via Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT). Keep it internal to commitment and execution.
      *   **Key Constraint 2:** Reconstruct the case with precise attention to temporal structure (Decision time $t_1$, Execution time $t_2$, Reward time $t_{reward}$).
      *   **Key Constraint 3:** Weigh the argument for binding across time vs. assessment at each node.
      *   **Key Constraint 4:** Defend a clear verdict (Does the rational agent take the toxin? Does she drink it?).
      *   **Key Constraint 5:** Address whether diachronic resolution collapses into problematic temporal discounting or undermines long-term planning.
      *   **Conclusion:** Turn on whether costs of diachronic consistency are decisive or containable without abandoning synchronic assessment.

  2.  **Deconstruct Kavka's Toxin Puzzle:**
      *   *Setup:* An eccentric billionaire offers \$1 million at midnight tonight if, at midnight tonight, he predicts you *intend* to drink a harmless but painful toxin tomorrow at noon.
      *   *Catch:* You get the money based on the *intention* at midnight. You do not need to actually drink the toxin to keep the money. Drinking the toxin provides no further benefit, only pain.
      *   *The Paradox:* To get the money, you must intend to drink. But once you have the money (or once midnight passes and the prediction is made), you have no reason to drink. If you know you won't drink, can you genuinely intend to drink?

  3.  **Frame as Diachronic vs. Synchronic Rationality:**
      *   *Synchronic:* At $t_2$ (noon), given the money is already secured (or the prediction made), drinking causes pain with no gain. Rationality says: Don't drink.
      *   *Diachronic:* At $t_1$ (midnight), to get the money, you need a plan that includes drinking. If you are the kind of agent who abandons plans when inconvenient, you won't get the money. Rationality says: Stick to the plan (Drink).
      *   *Tension:* If rationality is purely synchronic, you can't form the intention (because you know you'll defect). If rationality is diachronic, you must bind your future self.

