          *   *Valve/Leak:* "Allowed" vs. "Caused." This is the distinction between *initiating* a cause and *failing to interrupt* a chain. Under the principle: If closing the valve was the specific duty/design, the omission is a cause. "Allowed" is linguistically safer but causally equivalent under Normative Counterfactual Dependence.

  6.  **Drafting the Response:**
      *   *Tone:* Respectful, professional, precise, matching the user's engineering mindset. Avoid academic jargon.
