answer: |-
  You have identified the central tension in applied causation: the conflict between *ontological* causation (what physically pushed what) and *explanatory* causation (what we select as the difference-maker). Your physicalist instinct is correct that absences possess no energy. However, your verdicts show that you are not reporting on physics alone; you are reporting on the failure of *systems* (human, mechanical, or administrative) to function as specified.

  There is a coherent principle that fits your verdicts. It requires you to accept that in expert reporting, "causation" is not a raw physical relation but a *normative counterfactual relation*.

  ### The Principle of Deviant Omission

  An omission is a cause if and only if it satisfies three clauses:

  1.  **The Normative Clause:** There existed a specific expectation (duty, design specification, promise, or agreed plan) that the event *should* have occurred.
  2.  **The Efficacy Clause:** In the actual circumstances, had the event occurred, it would have prevented the outcome or significantly altered its course.
  3.  **The Salience Clause:** The absence represents a deviation from the system's intended or normal functioning, distinguishing it from background conditions or remote historical factors.

  ---

  ### Application to Your Cases

  Here is how the principle maps to your nine cases, and where it demands a price.

  *   **Case 1 (Tomatoes):** **Fits.** Norm (promise), Efficacy (water saves), Salience (you were the designated waterer).
  *   **Case 2 (Wilt):** **Fits.** Norm and Salience hold, but Efficacy fails regarding *death* (fungus was lethal). It succeeds regarding *timing*. Your verdict is correct; the principle validates the distinction.
  *   **Case 3 (Spillway/Alarm):** **Fits.** Operator: Norm (duty), Efficacy (opening prevents flood), Salience (immediate deviation). Contractor: Norm exists, but Salience fails. The mis-setting is a "background condition" because it was normalized over three years; the operator's inaction was the *proximate* deviation. The principle defines "background condition" as a normative violation that has lost salience due to time or integration into the system's baseline.
  *   **Case 4 (Firmware):** **Fits.** Norm (design specification), Efficacy (command would flush), Salience (fault is a deviation from code spec). You are comfortable here because the "duty" is encoded in the machine's design.
  *   **Case 5 (Generator/Fire):** **Fits.** Norm (maintenance), Salience (deviation). Efficacy *fails*. In the actual scenario (fire destroying the generator), the maintenance would not have prevented the pumping failure. Your verdict relies on Efficacy, not just readiness.
  *   **Case 6 (Sheet Piles):** **Fits.** Norm (design for 100), Efficacy (breach at the gap), Salience (specific point of failure). The "negligible fraction" is irrelevant; the design specification creates the Norm.
  *   **Case 7 (MP Letter):** **Fits.** Norm (citizen duty is weak/undefined), but Efficacy *fails* for the individual. One letter changes no outcome. The collective passes Efficacy but fails Normative specificity (who is the agent?).
  *   **Case 8 (Shelterbelt vs. Sea Wall):** **Friction.**
      *   *8a (Shelterbelt):* Fits. Norm (minuted decision), Efficacy (roots hold), Salience (decision was a specific deviation from the path that would have prevented failure).
      *   *8b (Sea Wall):* Fits. Norm *fails*. No proposal means no specific expectation was established.
      *   *The Price:* You must accept that a 50-year-old minute is causally relevant. This feels unphysical, but under this principle, the minute created a *system specification* that was violated. The hillside does not care, but the *system of defence* did.
  *   **Case 9 (Dashboard/Telemetry):** **Forces a Decision.** The principle resolves your oscillation.
      *   *Telemetry:* Norm (function correctly), Efficacy (alert would trigger response), Salience (silent failure is a primary deviation).
      *   *Officer:* Norm (telephone if needed), but Efficacy is mediated by information. Given the "green tick," her inaction was *consistent* with the system's presented state. Her omission is not a *deviant* omission relative to the information available.
      *   *Verdict:* You must settle on **Thursday**. The telemetry failure is the Deviant Omission. The officer's inaction was a rational response to a false signal. To blame her is to ignore the Salience Clause (the primary deviation was the sensor, not the reaction to it).

  ---

  ### Answers to Your Specific Questions

  #### 1. Which verdicts must you overturn?
  You should overturn your oscillation in **Case 9**. The principle dictates that the primary deviation (telemetry) screens off the secondary omission (officer) when the secondary agent acts reasonably on available data.
  You should also scrutinize **Case 8a**. While the principle accommodates it, the temporal distance makes the "Norm" tenuous. If the 1962 decision was not reaffirmed in subsequent management plans, its Salience degrades. If you keep 8a, you must accept that administrative history is a physical component of the catchment's defence system. If that sits poorly with you, you should downgrade 8a from "cause" to "contributory historical factor."

  #### 2. Is this causation, blame, or salience?
  You are tracking **explanatory salience within a normative system**.
  In a pure physics report, you would write: *"Water overtopped the levee due to inflow exceeding capacity."*
  In an expert report for inquiry, you write: *"The failure to open the spillway caused the flooding."*
  Both are true. The first describes the *mechanism*; the second describes the *failure of control*.
  **Recommendation:** In your reports, distinguish the two. State the *Physical Mechanism* (hydrological cause) separately from the *Causal Factor* (the omission). This preserves your physicalist integrity while satisfying the legal requirement for accountability. Do not call the omission a "physical cause"; call it a "causal factor in the system failure."

  #### 3. Is a principle available where expectations are irrelevant?
  **No.** Your own verdicts in Cases 1, 3, 8, and 9 foreclose this.
  *   In Case 1, if you had no promise, you would not say you caused the death (even if you walked past the greenhouse).
  *   In Case 8, the physics of the slope are identical in 8a and 8b; only the administrative history differs.
  *   In Case 9, the officer's physical capacity to phone was identical on Monday and Thursday; only her *expectation* of necessity changed.
  If you adopt a principle where expectations are irrelevant, you must conclude that *everyone* who did not water the tomatoes caused their death, and that the 1962 minute is irrelevant. Since you reject those conclusions, you must accept that causation in your field is inextricably linked to **duty and design**. A hillside does not care about a minute, but a *levee system* does, because the system is defined by its plans.

  #### 4. Predictions for the Two New Cases

  **Case A: The Nine-Person Committee**
  *   *Scenario:* A committee omits an action; no individual was tasked.
  *   *Prediction:* The **Committee** caused the outcome, but no individual member did.
  *   *Reasoning:* The Norm attaches to the corporate body (Clause 1). The Efficacy holds (Clause 2). The Salience attaches to the body's failure to minute/act.
  *   *Report Wording:* "The Committee's failure to authorize..." Avoid naming individuals unless minutes show a specific member blocked the action (which would create an individual Norm).

  **Case B: The Open Valve (Permitting vs. Causing)**
  *   *Scenario:* Operator does not close a valve on a pre-existing leak.
  *   *Prediction:* The omission **caused** the emptying, but your linguistic ease with "allowed" is principled.
  *   *Reasoning:* It satisfies all three clauses (Duty to monitor/close, Efficacy of closing, Salience of inaction).
  *   *Linguistic Distinction:* "Caused" implies initiating a chain. "Allowed" implies failing to interrupt one. Under the Principle of Deviant Omission, both are causal. However, "allowed" accurately signals that the *initiating* cause was the leak, while the *sustaining* cause was the omission.
  *   *Advice:* Use "caused" for technical findings of fact (the tank emptied *because* the valve remained open). Use "allowed" for narrative summaries. Do not treat "allowed" as non-causal; treat it as a specific *type* of causal contribution (failure to interrupt).

  ### Summary of the Price
  To maintain coherence, you must pay this price:
  1.  **Accept Normativity:** You must admit that "cause" in your reports is not a property of the water, but a property of the *relationship between the water and the system designed to control it*.
  2.  **Resolve Case 9:** You must attribute cause to the telemetry, not the officer, when the officer relies on faulty instrumentation.
  3.  **Clarify Terminology:** You should explicitly distinguish *Physical Mechanism* from *System Failure* in your writing to satisfy your hydrologist's conscience.

  You have not been equivocating. You have been intuitively applying a systems-engineering view of causation, where a system's "function" is defined by its norms, and a "cause" is a deviation from that function that leads to failure. The Principle of Deviant Omission makes that intuition explicit.
