answer: |-
  The coffee in the breakroom tasted like burnt pennies, same as every morning since 2028. Ellen stood by the window, looking out at the gray sprawl of the Institute for Narrative Cohesion. It wasn't a flashy place. No neon, no flying cars. Just beige bricks, security badges, and the low hum of server stacks cooling the collective past.

  Ellen was a Senior Archivist, Grade 4. Her job wasn't to change history—that was Policy's department. Her job was Mnemonic Hygiene. She made sure people's personal memories matched the official record. Temporal consistency. If the record said the merger happened in June, but you remembered July, you came to Ellen. She smoothed the friction.

  There were two main protocols. Everyone knew them by the old political nicknames, though nobody said them out loud in the open plan office.

  Type O: Orwellian. You change the content. The meeting happened, but the decision was different. You rewrite the script.
  Type S: Stalinesque. You remove the content. The meeting never happened. The person who spoke was never there. You cut the film.

  Type O leaves scars. You remember saying something, but now you remember saying something else. It creates cognitive dissonance, a headache behind the eyes. Type S is cleaner. Just a gap. A missing afternoon. People rationalize gaps easily. *I must have been home sick.* *I must have been drunk.*

  Ellen sat at her desk, logged into the Consistency Suite. It looked like any other video editing software. Waveforms, timelines, metadata tags. She pulled up her own quarterly clearance file. Mandatory review. Everyone had to submit their raw neural logs for a spot check.

  She queued up a memory from last Tuesday. A budget meeting with her supervisor, Henderson.

  She hit play.

  In the raw log, the room was cold. Henderson was angry. He was talking about layoffs. Ellen remembered this. She remembered the knot in her stomach. She remembered arguing back. She remembered saying, *"You can't cut the archival team, we're the only ones who know the legacy code."*

  That was the memory. Solid. High fidelity.

  But the file metadata had a flag. *Correction Applied.*

  Ellen frowned. She hadn't filed a correction on herself. That was against protocol. You don't edit the editor.

  She ran the comparison tool. Side-by-side.

  On the left: The Raw Log. Ellen arguing. Henderson angry.
  On the right: The Cleaned File. Henderson smiling. Ellen nodding.

  In the Cleaned File, she wasn't arguing. She was agreeing. *"You're right, Mr. Henderson. The archival team is bloated. We need cuts."*

  That was Type O. A rewrite. The words changed. The sentiment flipped.

  But then she looked at the timestamps.

  In the Raw Log, the argument lasted four minutes.
  In the Cleaned File, the meeting lasted two minutes.

  Two minutes of the conversation were gone. Excised. Type S.

  So they had rewritten what she said (Orwellian), and they had deleted the time it took to say it (Stalinesque). Both protocols, applied to the same event.

  Ellen leaned back. This was sloppy. Usually, you pick one. If you rewrite the words, you keep the time so the lip sync matches the emotional cadence. If you delete the time, you delete the words too. Doing both created a compression artifact.

  She closed her eyes and tried to recall the memory naturally, without the screen.

  This is where the glitch hit.

  She tried to remember the argument. She reached for the feeling of anger, the heat in her throat. But before she could retrieve the image of Henderson's angry face, she felt a sensation of *shift*.

  It wasn't a thought. It was a perceptual pop. Like when you're staring at a magic eye poster and the 3D image suddenly snaps into focus.

  She felt the *edit* happen before she saw the *result*.

  In her mind's eye, she hadn't yet seen herself agreeing with Henderson. She hadn't yet seen the shortened meeting. But she already felt the *wrongness* of the argument fading. She felt the sensation of "being corrected" before she knew *what* she was being corrected about.

  It was the Color Phi Illusion.

  In the lab experiments, you flash a red light at point A. Then you flash a green light at point B. If the timing is right, the subject doesn't see two static lights. They see one light moving from A to B, changing color in mid-air.

  The brain lies. It waits for the second stimulus (the green light) before it renders the motion (the travel). It constructs the journey retrospectively.

  Ellen was experiencing Memory Phi.

  Her brain had received the second stimulus—the Cleaned File, the agreement, the shorter meeting. But because the protocols conflicted (rewrite vs. erase), the processing lagged. The brain knew an edit was required before it finished rendering the new content.

  So she felt the motion of the change. She felt the slide from "Arguing" to "Agreeing" before the image of "Agreeing" loaded.

  It was a phantom sensation. A ghost limb of causality.

  She opened her eyes. The office was quiet. Gary at the next desk was chewing gum, staring at his own screens. He looked tired. Everyone looked tired.

  "Henderson sign off on this?" Ellen asked. Her voice sounded flat.

  Gary didn't look up. "Standard clearance. You know how it is."

  "They used both protocols, Gary. Type O and Type S on the same cluster."

  Gary stopped chewing. He turned his chair slowly. "Ellen. Don't parse the metadata on your own clearance. It's against policy."

  "It creates a phi gap," she said. "I felt the edit before I saw the new memory. My brain is buffering the causality."

  "It's just stress," Gary said. He turned back to his screen. "Drink some water. Run a defrag on your local cache."

  "It proves it's all post-dictive," Ellen said, louder now. "We think we live in real time. We think I speak, then I hear myself speak. But we're always living in the past. The brain waits for the second light to draw the motion. If they can tamper with the second light..."

  "Ellen." Gary's voice was low. "Stop."

  "If the assembly line is tampered with, the product is still real to the user," she said. She was looking at her hands. They felt real. "But I felt the seam. I felt the machine stitch me up before the fabric was even there."

  Henderson walked out of his office. He was holding a mug. He looked at Ellen. He didn't look angry. He looked like a man who had already forgotten the argument ever happened. Which, technically, he had. They'd probably Type S'd his memory of her objection too.

  "Ellen," Henderson said. "My office. Bring your tablet."

  She stood up. The floor felt solid. The air conditioning hummed.

  As she walked toward his office, she tried to hold onto the anger. She tried to keep the Raw Log active in her head. *I argued. I fought.*

  But the sensation was slipping. The "phi gap" was closing. Her brain was finishing the render. The motion was completing. The red light was moving, turning green, arriving at point B.

  She was starting to remember agreeing with him.

  She reached for the door handle. She paused.

  If conscious experience is assembled retrospectively, then the "now" is just a story we tell ourselves about what just happened. If you control the assembly, you control the now.

  She felt the edit finish. The anger vanished, not suppressed, but erased. The memory of the argument smoothed over like wet concrete.

  She knocked on the door.

  "Come in," Henderson said.

  Ellen walked in. She smiled. She remembered why she was smiling. They had discussed the budget, and she had agreed that cuts were necessary. It was the only logical conclusion.

  "Sorry about the delay," Ellen said. "Just reviewing the files."

  "No problem," Henderson said. "We're on the same page?"

  "Yes," Ellen said.

  She sat down. She didn't think about the gap. She didn't think about the red light or the green light. She just knew that the light had moved, and it was green now.

  But under the desk, her left hand was trembling. Just a little. A phantom vibration. A residual signal from a stimulus that no longer existed.

  She put her hand in her lap and clasped it tight.

  "Let's look at the Q3 projections," Henderson said.

  Ellen opened her tablet. The screen was bright. The text was clear. She began to work. She didn't look at the timestamp. She didn't want to know how much time had passed.

  She just hoped that if they came for the tremor next, they'd use only one protocol. She didn't think she could survive feeling the edit twice.
