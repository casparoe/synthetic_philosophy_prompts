prompt: |-
  Write a short story about a archivist in a near-future institute that corrects autobiographical memories for temporal consistency. The story should turn on the difference between Orwellian revisions—where the past is actively rewritten to align with the present narrative—and Stalinesque revisions, where the past is simply excised leaving no trace. I want you to weave in the color phi illusion, that perceptual effect where a moving object appears to change color before the second stimulus even arrives, but apply it to first-person experience: the protagonist notices that her own memory of a key argument has been subjected to both kinds of revision simultaneously, producing a "phi gap" where she feels the edit occur before she registers what was edited. The point is to explore whether conscious experience is constructed in real time or assembled retrospectivly, and what happens when the assembly line itself is tampered with. Don't make it a generic AI story—keep the tech mundane, the office politics real, and the philosophical punch in the details. Write in American English please, and dont worry about being too polished.
