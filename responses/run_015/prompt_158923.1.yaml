answer: |-
  Your seminar leader is applying a non-aggregative individual complaint principle, which predicts you should save the single stranger with certainty, and her coin flips signify a tie-breaking procedure for equal claims rather than moral indifference.

  The underlying rule fitting all five verdicts is **Maximin Individual Complaints without Aggregation**. This principle dictates that you must compare the strongest individual complaint on each side of the dilemma; if one individual faces a significantly worse harm (death vs. fingers, 40 years vs. 2 years), you save them regardless of numbers. If the strongest complaints are identical (death vs. death, leg vs. leg), numbers cannot be summed to outweigh the individual claim, so you must treat the individuals equally. This explains why partiality is permitted (your sister's claim is strengthened by your relationship) but impersonal numbers are not.

  Regarding the coin flip, her "if you feel like it" phrasing suggests permissibility, but the logic of impartiality in this framework demands **equalizing chances**, not indifference. When complaints are equal, fairness requires giving each individual an equal probability of survival, which a coin flip achieves between the groups. This distinguishes her view from pure moral indifference ("anything goes"), which would allow you to systematically save the one without randomization.

  For tomorrow's gamble case, the rule predicts you **save the one stranger with certainty**. You cannot aggregate the five strangers' 30% chances into a collective "1.5 lives" claim because aggregation is forbidden. You must compare the single stranger's claim (100% survival chance) against any single one of the five strangers' claims (30% survival chance). Since certain rescue satisfies a stronger individual complaint than probabilistic rescue, the one stranger wins. Choosing the gamble would sacrifice a certain life for a mere chance, violating the priority given to the worst-off individual.

  To settle the "anything goes" versus "equal shot" ambiguity in the final session, propose a **1 vs. 1 case where randomization is impossible or costly**. Ask: "If I face two identical strangers and flipping a coin would cause a delay that risks both dying, am I obligated to flip, or may I simply pick one?" If she says you must flip (or find an equivalent randomizer), she holds the "equal shot" view; if she says picking is fine, she holds the "moral indifference" view.
