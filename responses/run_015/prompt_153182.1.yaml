answer: |-
  Good morning. Welcome to "Character in Context." It is a genuine honor to offer these opening remarks. Looking around this room, I see a rare and valuable convergence: faculty philosophers, behavioral scientists, and community members, including family of the organizers. That diversity is not merely ceremonial; it is essential to our topic. Character is not a concept confined to journal articles. It is lived, tested, and often strained in the very world outside these walls.

  As a student navigating the literature of moral psychology, I have often felt the pull of a specific tension. On one side, we have the Aristotelian intuition that virtue is a stable disposition—a reliable state of character that allows a person to act well across varying circumstances. On the other side, we have the situationist critique, bolstered by decades of experimental data. We are all familiar with the unsettling illustrations: ordinary individuals complying with authority to inflict harm, or hurried pedestrians failing to aid a stranger in distress. The hard conclusion drawn from these studies is that cross-situational consistency is a myth, and that what we call "character" is merely an illusion generated by our desire for narrative coherence.

  However, this workshop is convened to resist that false binary. We are not here to choose between the saintly hero and the blank slate. Instead, I propose we consider a qualified middle position, one that relies on the distinction between global trait possession and local trait activation.

  To claim that character is real is not to claim that it is magic. A virtuous disposition is not a suit of armor that renders one immune to social pressure or cognitive fatigue. When we view virtue through the lens of local trait activation, we acknowledge that while individuals may possess stable capacities, the expression of those capacities is deeply sensitive to context. This leads us to a crucial philosophical pivot: situational pressure functions as a constraint on moral aspiration rather than its refutation.

  The data does not prove that goodness is impossible; it proves that goodness is fragile. It shows that even well-formed character can be suppressed when the environment becomes hostile to virtue. This is not a defeat for virtue ethics, but a refinement of it. It shifts our focus from asking only "Who is a good person?" to asking "Where can a good person survive?"

  This has direct implications for how we design institutional expectations of integrity. If we accept that moral behavior is context-sensitive, we cannot rely solely on selecting individuals with "good traits" and placing them in corrupting systems. We must build architectures of integrity that reduce the friction between knowing the good and doing the good. We must design institutions that recognize human vulnerability to pressure, not to excuse misconduct, but to prevent the conditions that make misconduct likely.

  Over the next two days, our goal is not to dismiss the science, nor to abandon the philosophy. It is to integrate them. We aim to show that character is real, but it is not solitary. It requires cultivation, yes, but it also requires a context worthy of it.

  Thank you for being here, for your openness to this dialogue, and for helping us explore what it means to be human, in context.
