  The seminar must demonstrate that population axiology faces structural impossibility rather than solvable trade-offs by guiding students through the failure of Average, Total, and Critical-Level Utilitarianism using a specific digital mind "welfare dial" scenario. This sequence forces students to confront the instability of each theoretical rescue attempt before they encounter the formal impossibility theorems, ensuring they grasp the intuitive force of the problem rather than treating it as a mere logical puzzle. By anchoring the discussion in a technological context rather than biological reproduction, we strip away confounding variables regarding rights or consent, isolating the axiological conflict. The plan adheres strictly to the requested theoretical progression to highlight how each solution generates a mirror-image problem, culminating in a check-for-understanding that tests whether students recognize the structural persistence of the dilemma even when parameters shift.

  ### Seminar Plan: Population Axiology and Structural Impossibility (90 Minutes)

  **I. Average Utilitarianism and the Growth Collapse (0:00–0:20)**
  *   **Lecture (10 mins):** Begin by modeling Average Utilitarianism (AU) under conditions of rapid population expansion. Demonstrate mathematically and intuitively that as populations grow large enough, the requirement to maximize average welfare creates a pressure to limit population size that contradicts our intuitions about adding happy lives, eventually collapsing into a version of the repugnant conclusion where the theory cannot distinguish between a high-quality small population and a massive population with diluted welfare if the average is maintained through specific distributional tricks.
  *   **Discussion (10 mins):** Ask students why AU feels unstable here.
  *   **Misconception Intervention #1 (Minute 15):** Head off the conflation of the *critical level* with a biological "minimum viable life." Explicitly state that in this digital context, "viability" is not the issue; a mind can be viable at negative welfare. The critical level is a normative threshold for contribution to value, not a biological floor for existence. Clarify that AU fails here not because lives are biologically unsustainable, but because the *axiological weight* of adding lives below the current average becomes negative.

  **II. Total Utilitarianism and the Sadistic Conclusion (0:20–0:40)**
  *   **Lecture (10 mins):** Pivot to Total Utilitarianism (TU) as the natural correction to AU's aversion to adding lives. Show how TU avoids the previous collapse by summing welfare, but immediately introduce its mirror-image problem: the Sadistic Conclusion. Explain how TU implies that adding lives with negative welfare (suffering) can be preferable if it allows for a sufficiently large number of lives with positive welfare, or conversely, that we might prefer a population where everyone suffers slightly over one where many have lives barely worth living if the total sum is higher in the suffering case (depending on the specific formulation used to generate the Sadistic Conclusion).
  *   **Discussion (10 mins):** Have students articulate why TU's solution feels like an overcorrection.
  *   **Transition:** Frame Critical-Level Utilitarianism (CLU) as the attempted synthesis that sets a threshold to filter out lives that don't "count" toward the total, aiming to avoid both the AU collapse and the TU sadistic implication.

  **III. Critical-Level Utilitarianism and the Welfare Dial (0:40–1:10)**
  *   **Scenario Introduction (10 mins):** Introduce the "Welfare Dial" scenario. A planner manages a server cluster capable of instantiating digital minds.
      *   *Setting A:* Dial set to high welfare. Result: 1,000 minds experiencing intense flourishing.
      *   *Setting B:* Dial set to low welfare. Result: 1,000,000 minds experiencing life barely above a technologically adjustable critical threshold.
      *   *Constraint:* The threshold is not fixed; it is technologically adjustable based on resource allocation efficiency.
  *   **Analysis (15 mins):** Walk through how CLU evaluates Setting A vs. Setting B. Show that if the critical level is set too low, CLU collapses back into TU (and the Sadistic Conclusion). If set too high, it collapses back into AU (and the growth collapse).
  *   **Misconception Intervention #2 (Minute 55):** Head off the belief that raising the threshold eliminates rather than relocates the problem. Use the dial to show that raising the critical threshold to avoid the Sadistic Conclusion simply makes the "Repugnant" option (Setting B) harder to reach, but does not remove the structural incentive to expand population size at the margin once the threshold is crossed. The problem moves; it does not vanish.
  *   **Variable-Value Discussion (5 mins):** Briefly mention how variable-value theories attempt to make the critical level shift with population size.
  *   **Misconception Intervention #3 (Minute 65):** Head off the oversight that variable-value theories still generate a repugnant conclusion at the margin when the threshold itself shifts with capacity. Explain that if the threshold lowers as capacity increases, the structural pressure to populate returns.

  **IV. Check-for-Understanding and Synthesis (1:10–1:25)**
  *   **Activity (10 mins):** Present the CFU scenario.
      *   *Question:* "In the Welfare Dial scenario, suppose a software update suddenly doubles the technological capacity to raise the critical threshold without reducing total resources. You can now sustain the small population at double the flourishing, or the large population at double the previous 'barely above threshold' level. Does your intuition track the increase in total well-being across the massive population, or does it merely seek to avoid crossing the critical line? If the threshold doubles, does the 'Repugnant' option become more or less attractive under CLU, and why does this indicate a structural failure?"
      *   *Goal:* Force students to see that if they prefer the large population solely because it stays above the line, they are following a rule that ignores total well-being changes. If they track total well-being, they are reverting to TU.
  *   **Group Debrief (5 mins):** Collect responses to highlight the divergence in intuitions.

  **V. Conclusion and Exclusions (1:25–1:30)**
  *   **Wrap Up:** Summarize that AU, TU, and CLU all face structural failures when tested against the Welfare Dial under variable capacity.
  *   **Explicit Exclusions:** State clearly what was left out to maintain focus.
      1.  **Formal Proofs:** We did not cover the full formal proof of the impossibility theorems (e.g., Arrhenius's impossibility result); this seminar focused on the intuitive and structural drivers that motivate those proofs.
      2.  **Ecological Analogies:** We explicitly avoided any analogy to ecological carrying-capacity arguments. The constraints here are axiological and computational, not biological or environmental; conflating the two would obscure the normative nature of the critical level.

  ### Reasoning for Pedagogical Choices
  This plan prioritizes structural intuition over formalism, ensuring students understand *why* the impossibility results exist before seeing the proofs. The "Welfare Dial" is designed to make the abstract concrete, removing biological baggage that often distracts from the axiological core. By following the requested sequence (AU→RC, TU→Sadistic, CLU→Middle), the seminar builds a narrative of theoretical failure that motivates the need for more complex solutions or acceptance of impossibility. The misconceptions are targeted at the exact moments students are most likely to grasp onto a false rescue, ensuring they remain engaged with the difficulty of the problem. The CFU question is calibrated to test whether students have internalized the structural nature of the problem or are merely applying heuristics.
