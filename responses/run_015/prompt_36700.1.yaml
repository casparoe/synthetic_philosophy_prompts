answer: |-
  # The "What Do You Mean By Yes?" Consent Theory Sorter

  You and your roommate agree on the verdicts (don't do it), but disagree on the verdict's *reasoning* (why is it wrong?). This quiz uses eight concrete edge-cases to map your underlying theoretical framework.

  **Instructions:** For each scenario, choose the option that best matches your intuitive judgment about the **status of the consent**, not just whether the act was morally okay.

  ***

  ### 1. The Stealthing Case
  Two people agree to have sex, explicitly conditional on using a condom. Mid-act, one partner removes the condom without the other knowing. The other partner finishes without noticing until later.
  *   **A.** Consent was never given for *this* act (sex without a condom). It is sexual assault.
  *   **B.** Consent was given for sex, but a condition was violated. It is a severe betrayal, but technically the "sex" was consented to.
  *   **C.** Consent was validly given initially, but the deception makes it morally impermissible to continue, even if the legal/consent box is checked.

  ### 2. The Surgical Trainee
  A patient consents to surgery by a specific renowned surgeon. The surgeon truthfully says a trainee will "assist." During the procedure, the surgeon leaves the room, and the trainee performs 50% of the operation. The surgery is successful.
  *   **A.** The consent is void. You consented to *Dr. X* touching you, not Dr. X's student. This is battery.
  *   **B.** The consent is valid (you agreed to the procedure at this hospital), but the surgeon committed fraud.
  *   **C.** The consent is valid, but the surgeon violated a fiduciary duty. The patient was wronged, but not by "unconsented touching."

  ### 3. The Drunk Lease
  A person is visibly intoxicated (slurring, stumbling) but manages to sign a one-year apartment lease. The next day, sober, they want to break the lease.
  *   **A.** The signature is meaningless. A drunk mind cannot form the intent to contract. The lease is void.
  *   **B.** The signature counts. You are responsible for the public signals you send, even if impaired. The lease stands.
  *   **C.** The lease is technically valid (they signed it), but the landlord was predatory to accept it and should let them out.

  ### 4. The Suicidal Threat
  Person A says to Person B, "If you don't sleep with me, I will kill myself." Person B, terrified and caring, agrees to sex to save A's life.
  *   **A.** This is coercion. Consent given under threat of death (even self-harm) is invalid.
  *   **B.** This is a tragic choice, but Person B *did* choose. Consent is present, but Person A is morally monstrous for forcing the choice.
  *   **C.** Consent is invalid because the threat creates a situation where "no" was not a live option.

  ### 5. The White Lie
  Person A lies about being wealthy and single to secure a date that leads to sex. Person B says, "I would never have slept with you if I knew you were broke and married."
  *   **A.** Fraud vitiates consent. If the basis of the agreement is a lie, the consent is invalid.
  *   **B.** This is fraud in the *inducement*, not the *fact*. Consent to sex is valid, even if the reasons were manipulated.
  *   **C.** Consent is valid, but Person A is a bad person. Person B has no right to claim assault, only regret.

  ### 6. The Reluctant "Yes"
  Person A asks for sex. Person B feels like saying no but says "Okay" softly to avoid an awkward argument. Person B does not resist during the act.
  *   **A.** If the internal answer was "no," there is no consent. Words don't override the mental state.
  *   **B.** They said "Okay." In social interaction, we must rely on words, not mind-reading. Consent occurred.
  *   **C.** Consent was given, but Person A failed their ethical duty to ensure enthusiasm. It was permissible but poor conduct.

  ### 7. The Economic Duress
  A boss tells an employee, "Sleep with me or you're fired." The employee agrees because they need the money for rent.
  *   **A.** Economic coercion invalidates consent. You cannot consent when the alternative is destitution.
  *   **B.** Consent is valid (a rational choice was made), but the boss abused their power. It's harassment, not necessarily "rape" via invalid consent.
  *   **C.** Consent is invalid because the power dynamic makes voluntary agreement impossible.

  ### 8. The Sleeping Partner
  Partners often have morning sex. One morning, Partner A starts touching Partner B while B is asleep. B wakes up midway, smiles, and participates.
  *   **A.** Consent is invalid. You cannot consent while unconscious, and prior habits don't count.
  *   **B.** Consent was ratified upon waking. The initial touch was risky, but the smile validated the act.
  *   **C.** Consent is valid based on the established pattern, provided there is a standing agreement.

  ***

  # Scoring Key & Theoretical Profiles

  Tally your answers. Don't look for a perfect match; look for the *cluster* that fits your reasoning.

  ### Axis 1: What *Is* Consent? (Attitudinal vs. Performative)
  *   **Mostly A's on Q1, Q5, Q6:** **The Attitudinalist.**
      *   *View:* Consent is a mental state of agreement. If your head says "no" (Q6) or you were lied to about the nature of the act (Q1, Q5), consent never existed, regardless of what you said or signed.
      *   *Conflict Point:* You likely argue that "Yes" can be a lie, and if it is, it doesn't count.
  *   **Mostly B's on Q1, Q5, Q6:** **The Performative.**
      *   *View:* Consent is a communicative act. It is something you *do* to change someone else's moral permissions. If you say "yes" or sign the paper (Q3, Q6), you have consented, even if you regret it or were misled about peripheral details.
      *   *Conflict Point:* You likely argue that relying on internal states makes consent unknowable to the partner.

  ### Axis 2: How Do Defects Work? (Unified vs. Fragmented)
  *   **Mostly A/C on Q1, Q4, Q5, Q7:** **The Unified Invalidity Theorist.**
      *   *View:* Coercion, deception, and incompetence all work the same way: they break the mechanism of consent. If one is present, consent is null. A lie about money (Q5) and a lie about a condom (Q1) are differences of degree, not kind.
      *   *Conflict Point:* You struggle to see why some lies "count" and others don't.
  *   **Mostly B's on Q1, Q2, Q5:** **The Fragmentalist.**
      *   *View:* Not all defects invalidate consent equally. Coercion might void consent, but mere deception (Q5) or scope creep (Q2) might just be a breach of contract or ethics. You distinguish between "fraud in the factum" (what is happening) and "fraud in the inducement" (why it's happening).

  ### Axis 3: Valid but Wrong? (The Wertheimer Distinction)
  *   **Mostly C's on Q2, Q3, Q4, Q8:** **The Moral Gatekeeper (Wertheimer-ish).**
      *   *View:* It is possible to validly consent, but for the other person to be morally prohibited from acting on it. In Q4 (Suicide Threat) or Q8 (Boss), the victim *did* consent (they made a choice), but the exploiter is barred from accepting that consent due to the vulnerability involved.
      *   *Conflict Point:* You get frustrated when people say "It wasn't rape because they said yes," because you think "They said yes, but you're still a monster for taking it."
  *   **Mostly A's on Q2, Q3, Q4, Q8:** **The Invalidity Theorist.**
      *   *View:* If it was wrong to act, consent was invalid. You reject the idea that someone can "validly" consent to exploitation. If the situation is coercive (Q4, Q8) or incompetent (Q3), the consent is void *ab initio*.

  ***

  # Where This Quiz Fails (Limitations)

  You asked to flag positions this quiz cannot separate. Here are the two biggest blind spots:

  **1. The Attitudinalist vs. The Invalidity Theorist (The "Verdict Overlap" Problem)**
  This quiz sorts by *verdicts* (Is it assault? Is the lease void?). However, **Attitudinalists** (Consent is a mental state) and **Unified Invalidity Theorists** (Coercion voids consent) will almost always pick the same answers (Option A).
  *   *Why:* If I didn't mean it (Attitudinal), consent is invalid. If threats void consent (Invalidity), consent is invalid.
  *   *The Divergence:* The quiz cannot tell if you think consent is missing because of the *victim's head* (Attitudinal) or because of the *actor's conduct* (Invalidity/Coercion). To sort this, you need to ask: "If a person is perfectly happy and willing, but was threatened into it, did they consent?" (Attitudinal might say Yes; Invalidity says No).

  **2. The Performative vs. The Moral Gatekeeper (The "Defective Signal" Problem)**
  **Performative** theorists (Consent is a signal) and **Moral Gatekeepers** (Valid but Wrong) often clash on Q3 (Drunk Lease) and Q6 (Reluctant Yes). However, they can converge on Q4 (Suicide Threat).
  *   *Why:* A Performative theorist might say the "Yes" in Q4 counts as a signal. A Gatekeeper says the "Yes" counts as valid but impermissible. In practice, both might agree "Don't do it," but for different reasons.
  *   *The Divergence:* The quiz struggles to separate "The signal was defective" (Performative failure) from "The signal was real but exploitative" (Gatekeeper). To sort this, ask: "If the drunk person signs the lease and *doesn't* regret it sober, is the lease binding?" (Performative: Yes. Gatekeeper: Maybe still wrong to enforce).

  ### How to Use This With Your Roommate
  Compare your profiles. If you are both **Invalidity Theorists** (Mostly A's) but she is **Attitudinal** and you are **Performative**, you will agree stealthing is wrong, but she will argue *"She never agreed to that act in her head"* while you argue *"He violated the terms of the communicative agreement."*

  That is likely the three-hour argument you just had.
