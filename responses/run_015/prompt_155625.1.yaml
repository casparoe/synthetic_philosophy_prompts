answer: |-
  This is a sharp, strategic question. Eighteen months is enough time for one high-impact paper or a tightly integrated pair of papers, but not enough for a monograph-length system. Your intuition about the **Dissolution Problem** is the most valuable asset you have here. It is underexplored, and it offers a dialectical lever that most participants in the debate have left lying on the table.

  Here is the ranking, the strategic defense, the verdict on Dissolution, and the consensus map you requested.

  ### 1. The Ranking: Where to Attack

  For a solo postdoc with 18 months, I recommend this order of operations. Note that "Upstream" refers to logical priority, while "Priority" refers to where you should spend your time.

  **1. Subject-Summing (Logical Upstream King)**
  *   **Status:** The core problem. If micro-subjects cannot constitute a macro-subject, panpsychism fails.
  *   **Why Rank It Here:** You cannot ignore it. Any solution to Dissolution must be compatible with a story about Summing. However, attacking it head-on (e.g., proposing a new theory of phenomenal mereology) is a quagmire. You will be competing directly with Goff, Coleman, Roelofs, and Mørch on their home turf.
  *   **Strategy:** Do not try to *solve* summing directly. Try to *dissolve* the necessity of the problem by using Dissolution.

  **2. The Dissolution Problem (Your Strategic Wedge)**
  *   **Status:** The most tractable entry point for your timeline.
  *   **Why Rank It Here:** This is your comparative advantage. The literature is saturated with "how do we build up?" and starved for "how does this break down without the bricks vanishing?"
  *   **Tractability:** High. It relies on metaphysical analysis of case studies (split-brain, anaesthesia) rather than constructing a new positive ontology from scratch.
  *   **Dialectical Impact:** If you can show that unity is contingent on macro-level structural relations (rather than micro-level existence), you undermine the "Subject Summing" problem's assumption that we need to *add* subjects together. It shifts the burden to explaining *binding conditions* rather than *subject arithmetic*.

  **3. Quality/Palette Problem**
  *   **Status:** Downstream of Subject-Summing.
  *   **Why Rank It Here:** If there is no macro-subject to *have* the quality, the quality mismatch doesn't matter.
  *   **Tractability:** Low for a solo project. Solving this usually requires a specific theory of qualitative space that ties heavily into philosophy of perception and color science. It dilutes your focus.

  **4. The Grain/Structure Problem**
  *   **Status:** Downstream/Technical.
  *   **Why Rank It Here:** This often devolves into disputes about physics (quantum vs. classical) or neuroscience.
  *   **Tractability:** Low. It risks turning your project into a philosophy of physics paper, which may not serve your primary goal of addressing the metaphysics of consciousness.

  ---

  ### 2. Is Dissolution Distinct or Just Reverse-Summing?

  **Verdict:** It is distinct, but you must argue for that distinctness carefully.

  **The Objection (Reverse-Summing):** If unity is a mereological sum, then dissolution is just subtraction. If $A + B = C$, then $C - A = B$. If you solve summing, you solve dissolution by symmetry.

  **The Defense (Why it's Distinct):**
  The Combination Problem assumes a **constitutive** relationship: The macro-subject *is* the micro-subjects arranged thusly.
  The Dissolution Problem (as you describe it with anaesthesia/split-brain) highlights a **contingent** relationship: The micro-subjects (neurons/particles) persist, but the macro-unity vanishes.

  *   **The Leverage:** In anaesthesia, the physical micro-constituents remain largely intact. If panpsychism claims consciousness is intrinsic to the physical, why does the *macro* consciousness vanish while the *micro* consciousness (presumably) remains?
  *   **The Distinction:** Summing asks: "How does $N$ become 1?" Dissolution asks: "How does 1 become $N$ (or 0) without the $N$ changing intrinsic nature?"
  *   **Strategic Value:** This exposes a vulnerability in **Constitutive Panpsychism**. If the macro-subject is constituted by micro-subjects, and the micro-subjects survive anaesthesia, the macro-subject should arguably survive (perhaps in a fragmented state). If it doesn't, then macro-consciousness is not constitutively dependent on micro-subjects in the way panpsychists claim. It suggests macro-consciousness depends on *functional integration* or *information flow*, which pushes you toward **Emergentism** or **IIT**, potentially undermining the panpsychist motivation.

  **Recommendation:** Frame Dissolution not as "reverse engineering" but as the **"Stability Problem."** Focus on the *conditions of continuity* for phenomenal unity. This forces the panpsychist to explain why the bond between micro-subjects is so fragile under macro-rearrangement if the relata are unchanged.

  ---

  ### 3. Consensus vs. Contested Claims

  You asked for clarity on what is settled. In the metaphysics of consciousness, **very little is settled.** However, there are clear lines of agreement on the *structure* of the debate, even if the *solutions* are contested.

  **Claim 1: "The Combination Problem is just the Hard Problem restated."**
  *   **Status:** **Contested / Generally Rejected by Specialists.**
  *   **The Consensus:** David Chalmers (1996) distinguished them. The Hard Problem is about physical-to-phenomenal emergence (why is there experience at all?). The Combination Problem is about phenomenal-to-phenomenal emergence (how do little experiences make big ones?).
  *   **The Nuance:** Some (e.g., Keith Frankish) argue both are illusory. Some panpsychists argue solving Combination *is* solving the Hard Problem because the physical-to-phenomenal gap is closed by stipulation (intrinsic nature). But analytically, they are distinct problems. Do not treat them as identical in your writing; reviewers will flag it.

  **Claim 2: "The Combination Problem refutes Panpsychism outright."**
  *   **Status:** **Contested.**
  *   **The Consensus:** It is the *primary objection*, not a settled refutation.
  *   **The Camps:**
      *   *Skeptics (e.g., Goff in earlier work, various physicalists):* Treat it as fatal.
      *   *Defenders (e.g., Roelofs, Coleman, Mørch):* Treat it as a hard technical problem with viable solutions (Phenomenal Bonding, Non-merelogical composition, etc.).
      *   *Revisionists (e.g., Goff in later work):* Accept it as fatal to *constitutive* panpsychism and move to *Cosmopsychism* or *Eliminativism*.
  *   **Your Stance:** Your project is positioned perfectly here. You are investigating whether it is fatal or just hard. Do not assume it is fatal; assume it is the bottleneck.

  **Claim 3: "Russellian Monism (RM) dissolves the Combination Problem."**
  *   **Status:** **Highly Contested.**
  *   **The Consensus:** RM motivates panpsychism (by positing categorical properties as proto-phenomenal), but it **does not** automatically solve Combination.
  *   **The Trap:** Many early papers claimed RM solves the Hard Problem, leaving Combination as the only hurdle. However, many critics (and now proponents) admit RM makes Combination *harder* because it commits you to the reality of the micro-subjects that need combining.
  *   **Nuance:** Some argue that if the micro-properties are *protophenomenal* (not full subjects), Combination is easier (no subject summing, just quality summing). Others argue protophenomenality is incoherent.
  *   **Advice:** Do not assume RM is a solution. Treat it as a framework that *generates* the Combination Problem. If you argue RM dissolves it, you are taking a specific, contested camp position (likely aligned with Galen Strawson or early Chalmers), not stating a fact.

  ---

  ### 4. The 18-Month Game Plan

  **Months 1–6: The Dissolution Paper**
  *   **Goal:** Publishable manuscript establishing the "Stability/Dissolution Problem" as distinct from Summing.
  *   **Argument:** Show that cases of unity loss (anaesthesia, split-brain) constrain theories of unity more tightly than cases of unity gain.
  *   **Target:** *Journal of Consciousness Studies*, *Philosophical Studies*, or *Mind & Language*.
  *   **Why:** This establishes your niche. You aren't just another person saying "Panpsychism has a combination problem." You are the person analyzing the *asymmetry* of combination.

  **Months 7–12: The Upstream Implication**
  *   **Goal:** Connect Dissolution back to Subject-Summing.
  *   **Argument:** If Dissolution is the mirror of Summing, and Dissolution reveals that unity is structurally contingent, then Summing cannot be mereological. It must be functional or structural.
  *   **Result:** This either forces Panpsychism toward a view that looks suspiciously like Functionalism (a bullet many won't bite) or requires a new metaphysics of "Phenomenal Fields" (Roelofs style).
  *   **Target:** A second paper or a chapter in an edited volume.

  **Months 13–18: Synthesis and Job Market**
  *   **Goal:** Frame the two papers as a unified project: "The Asymmetry of Phenomenal Unity."
  *   **Output:** A research statement that shows you have identified a gap in the literature and made progress on the central bottleneck of the leading alternative to physicalism.

  ### Final Advice on "Fatal vs. Hard"

  If you conclude it is **Fatal**: You have written a strong argument against Panpsychism. This is valuable, but ensure you haven't just restated existing skepticism. Your "Dissolution" angle is what makes this new.

  If you conclude it is **Hard**: You must sketch the *shape* of the solution. You don't need to solve it, but you need to show that the Dissolution data constrains the solution space in a way that makes a solution *possible* (e.g., "Any solution must account for X, and Theory Y accounts for X").

  **One Warning:** Be careful with the term "micro-subject." Many panpsychists (like Coleman) deny micro-subjects exist; they posit *micro-phenomenal properties*. If you assume micro-subjects, you are attacking **Micropsychism**, not necessarily all Panpsychism.
  *   *Correction:* Frame your Dissolution argument to work against both. If micro-*properties* exist, how does their unity dissolve under anaesthesia while the properties remain intrinsic to the matter? This widens your target and protects you from the "I'm not a micropsychist" defense.

  This is a viable, high-ceiling project. The Dissolution angle is your differentiator. Play it hard.
