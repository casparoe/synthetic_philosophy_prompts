answer: |-
  No worries about the rambling — I know that coffee jitter well. It's actually the perfect state for thinking about induction. Here's a story about getting stuck in the wrong feature space.

  ***

  The canvas was sweating. That was the problem. Every time I reached for the obsidian shard on the left pile, my fingers slipped, leaving a damp smear on the black stone.

  "Again," Tomas said. He wasn't looking at me. He was looking at his hands, resting loosely on his knees. He was patient in the way that only makes you more impatient with yourself.

  Outside, the monsoon rain hammered the valley floor, a white noise static that had been running for three weeks. Inside the tent, the air smelled of wet wool, kerosene, and the bitter dregs of my third coffee. On the tarp between us lay the artifacts. Twelve of them.

  Six on the left. Six on the right.

  It was a Bongard problem made of bone and stone, and I was failing it.

  "Okay," I said, wiping my hands on my trousers. "Let's walk through it. The left pile. They're all chipped. Tools. Used for cutting."

  Tomas shook his head. A small, polite movement.

  "Okay, not tools. Ornaments? They're polished." I pointed to the right pile. "These are rough. Unworked. So, left is worked, right is unworked."

  "No."

  I sighed, the sound too loud in the small space. "Material? Left is stone, right is bone?"

  "Some bone on left. Some stone on right."

  I leaned back against the tent pole, feeling the structure shudder in the wind. I had been here for four months. I had recorded verbs for kinship, nouns for local flora, suffixes for evidentiality. I thought I understood how Tomas's people categorized the world. I thought I knew their taxonomy. I thought the universe was made of *things* that had *properties*.

  If you want to classify a set of objects, you look at their intrinsic features. Shape. Mass. Material. Age. Use. That's how induction works. You gather data, you extract features, you find the boundary.

  I had plenty of data. Twelve objects was enough. The signal was strong. But my model wouldn't converge.

  "Is it... provenance?" I tried, desperate. "Found on the mountain versus found in the valley?"

  Tomas finally looked up. His eyes were dark, reflective in the lantern light. "You are looking at the things," he said. His English was careful, clipped. "You think the rule is inside the thing."

  "Isn't it?"

  "The thing is just... the thing." He gestured vaguely at the left pile, then the right. "The thing is a vessel. But the vessel is empty until you pour the time into it."

  I stared at the stones. I wanted to measure them. I wanted to run a spectrometer over them. I wanted to find the variable *X* that belonged to the object itself. I was hunting for a noun, but he was speaking in adverbs.

  "When?" I asked.

  Tomas smiled. It wasn't a triumphant smile. It was the smile you give a child who is trying to open a door by pushing on the hinge side.

  He stood up and lifted the tent flap. The rain had stopped. The clouds were breaking, ragged holes torn in the grey ceiling. Through one of them, a sliver of white hung over the jungle canopy. A waxing crescent.

  He pointed to the left pile. "My grandmother found these. When the moon was growing."

  He pointed to the right pile. "These were found. When the moon was dying."

  I looked down at the artifacts. The obsidian shard. The piece of jade. The carved bone. They hadn't changed. Their mass was the same. Their chemical composition was identical. The feature space I had been searching—the intrinsic properties of the objects—was empty. There was no signal there.

  The rule wasn't *what*. It was *when*.

  It wasn't taxonomy; it was astronomy. It wasn't about the object's identity, but its relationship to a cycle outside the tent, outside the village, outside the human scale.

  I felt a strange hollow sensation in my chest. It wasn't embarrassment, exactly. It was the vertigo of realizing your map doesn't just have missing details; it's drawn on the wrong projection. I had been trying to solve a relational puzzle with a property-based solver. I was measuring the diameter of the circle when the rule was about the color of the light hitting it.

  "So," I said, my voice quiet. "If I found this..." I picked up a rough stone from the right pile. "Tonight. Under the growing moon. It goes on the left."

  Tomas nodded. He let the flap fall. The tent settled back into the damp dark.

  "The stone is the same," he said, sitting back down. "But the world is different."

  I reached out and moved the stone from the right pile to the left. It clicked against the obsidian. It fit perfectly. The data wasn't sparse. I had just been blind to the dimension that mattered.

  "Okay," I said, picking up my pen. The coffee was cold, but I drank it anyway. "Let's start again. Tell me about the moon."
