  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Cognitive Penetrability of Perceptual Content
  **Parties:** Party A (Impenetrabilist) and Party B (Penetrationist)
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS

  The Parties jointly affirm the following propositions as the fixed background for this collaboration. These claims define the phenomena under investigation and exclude confounding explanations from the scope of the dispute.

  1.  **Distinction Between Perception and Judgment:** A change in a subject's perceptual report, discrimination threshold, or confidence rating is not sufficient evidence for a change in perceptual content. Such changes may result from shifts in post-perceptual judgment, inference, decision criteria, or memory. Evidence for perceptual change must demonstrate a modification in the sensory representation itself, distinct from the subject's doxastic or linguistic response to that representation.
  2.  **Hierarchy of Evidential Markers:** The Parties agree on a hierarchy of measures for establishing genuine perceptual change, ranked by resistance to post-perceptual explanation. From least to most probative: (i) changes in discrimination threshold; (ii) persistence of effects under explicit instructions to disregard the cue; (iii) interocular or cross-modal transfer of learning; (iv) sensitivity changes in forced-choice tasks controlling for response bias; and (v) presence of effects in report-free dependent measures (e.g., pupillometry, fixation stability, or physiological aftereffects) collected under strict fixation control. The Parties agree that no single marker is individually decisive; convergent validity across multiple markers is required.
  3.  **Peripheral Route Exclusion:** Effects mediated entirely by peripheral or pre-perceptual mechanisms do not count as cognitive penetration. Specifically, changes in performance driven solely by eye movements (saccadic targeting), pupil diameter (light/ arousal adjustment), or the shifting of spatial attention (selection of input location) are excluded. Penetration is defined as an influence on the *processing* of the selected input, not the *selection* of the input.
  4.  **Plasticity Concession:** Both Parties concede that perceptual mechanisms are plastic and that extended training alters the functional properties of the perceptual system. The claim that "the perceptual system was different afterwards" is neutral with respect to the penetration debate. A change attributable to long-term re-tuning via feedback is compatible with both Encapsulation (Party A) and Penetration (Party B). The dispute concerns whether standing cognitive states (beliefs, desires) can alter perceptual content *on an occasion*, holding the current state of the learned machinery fixed.

  ## 2. DISAGREEMENTS TABLE

  The Parties acknowledge the following residual disagreements. Each formulation below represents the strongest version of the view that the respective Party is willing to endorse.

  | Issue | Party A (Impenetrabilist) Formulation | Party B (Penetrationist) Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Fixation of Content** | The content of a perceptual state is fixed exclusively by the stimulation and the informationally encapsulated processing modules. Cognitive states (beliefs, desires) cannot enter the computation that determines *what* is perceived, only what is done with that perception. | The content of a perceptual state is fixed partly by the stimulation and partly by the subject's active cognitive states. Two subjects with identical stimulation and identical low-level machinery can perceive differently in virtue of differing beliefs. | Substantive |
  | **2. Role of Semantics** | Any correlation between belief and perception is causal, not semantic. The perceptual system responds to statistical regularities associated with a belief, not the *meaning* of the belief. | Genuine penetration requires a semantic relation. The perceptual change must align with the *content* of the belief (e.g., seeing X *as* Y because one believes X is Y), not merely with statistical associations triggered by the belief. | Substantive |
  | **3. Individuation of Mechanism** | A perceptual mechanism remains the *same* mechanism across time if its proprietary algorithm remains unchanged, even if its weighting parameters are adjusted by learning. | A perceptual mechanism is individuated by its functional role in fixing content. If the rules fixing content change due to belief, the system is functionally distinct, regardless of algorithmic continuity. | Verbal/Conceptual |
  | **4. Interpretation of Aftereffects** | Adaptation aftereffects reflect the fatigue of low-level feature detectors. Their magnitude is determined by physical exposure history, not by current belief states. | Adaptation aftereffects reflect the normative expectation of the perceptual system. Their magnitude can be modulated by top-down expectations regarding the likely state of the world. | Substantive |

  ## 3. CRUXES TABLE

  The Parties agree that the following protocol constitutes the diagnostic test for the disagreements listed above. The predictions are concrete and falsifiable.

  **Protocol Summary:** Subjects train on forced-choice discrimination of synthetic textures (3-parameter statistical model).
  *   **Arms:** **N** (Naive, no rule); **E** (Early rule, hour 0); **D** (Delayed rule, hour 120); **F** (False rule, hour 120, inverted on transfer); **M** (Misaligned rule, hour 120, true but not about discriminative dimension).
  *   **Measures:** Discrimination threshold, Texture-contingent aftereffect magnitude, Interocular transfer, Report-free measure (fixation control).
  *   **Timepoints:** Hour 120 (Pre-instruction for D/F/M), Hour 130 (Post-instruction), Hour 200 (Consolidation).

  | Crux | Protocol Element & Measure | Party A Prediction | Party B Prediction | Condition for Defeat |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Belief-Driven Aftereffects** | **Arm D vs. N.** Compare Aftereffect Magnitude at Hour 130. (Tests if belief alone alters sensory adaptation without new sensory training). | **No Difference.** Aftereffect magnitude in Arm D will equal Arm N at Hour 130. Belief cannot alter the gain of adapted detectors without new exposure. | **Significant Difference.** Aftereffect magnitude in Arm D will exceed Arm N at Hour 130. Belief updates the perceptual prior, altering the adaptation baseline immediately. | **A:** If D > N significantly at 130.<br>**B:** If D = N at 130. |
  | **2. Semantic Specificity** | **Arm E vs. M.** Compare Report-Free Measure at Hour 130. (Tests if the *content* of the belief matters, or merely the arousal/attention of being told a rule). | **No Difference.** Both E and M will show identical performance on report-free measures. Any benefit is due to general alertness or strategy, not semantic content. | **E > M.** Arm E will show superior performance on report-free measures compared to Arm M. Penetration requires the belief to be *about* the discriminative dimension. | **A:** If E > M significantly on report-free measure.<br>**B:** If E = M on report-free measure. |
  | **3. Truth vs. Belief on Transfer** | **Arm F.** Compare Transfer Set Performance at Hour 130. (Tests if perception tracks statistics or the *believed* rule). | **Tracks Statistics.** Performance on the transfer set will align with the actual statistics learned (0-120), not the inverted rule. Belief affects report, not perception. | **Tracks Belief.** Performance on the transfer set will align with the *inverted* rule (the lie), deviating from statistical optimality. Perception follows the believed truth. | **A:** If F performance aligns with the Lie on report-free measures.<br>**B:** If F performance aligns with the Stats despite the Lie. |
  | **4. Mechanism Individuation** | **Arm D.** Trajectory of Thresholds from Hour 130 to 200 *without further feedback*. | **Decay or Stability.** Any threshold improvement at 130 is strategic and will decay or remain static without new feedback. Sustained improvement requires new encapsulated learning. | **Persistence.** Threshold improvements at 130 will persist to 200 without new feedback. The belief sustains the perceptual change directly. | **A:** If D shows sustained improvement 130→200 without feedback.<br>**B:** If D improvement decays to baseline by 200. |

  ## 4. CLOSING SECTION: ASSESSMENT OF VERBAL AND SUBSTANTIVE COMPONENTS

  The Parties jointly acknowledge that a portion of the historical dispute regarding cognitive penetrability has been verbal, arising from divergent conventions for individuating cognitive architectures. Specifically, the disagreement labeled **Issue 3 (Individuation of Mechanism)** in Section 2 is acknowledged to be largely conceptual. Party A defines the "perceptual system" by its proprietary algorithms; Party B defines it by its functional role in fixing content. A change in terminology alone could reconcile these descriptions without altering empirical predictions. This component is classified as **Verbal**.

  However, the Parties argue that the dispute is not *wholly* verbal. The disagreements labeled **Issue 1 (Fixation of Content)**, **Issue 2 (Role of Semantics)**, and **Issue 4 (Interpretation of Aftereffects)** are **Substantive**. These cannot be resolved by terminological stipulation because they generate divergent predictions regarding the data specified in the Cruxes Table (Section 3).

  Specifically, **Crux 3 (Arm F)** isolates a substantive divergence that resists verbal treatment. If subjects in Arm F perform on the transfer set according to the *inverted rule* (the lie) rather than the *statistical regularities* (the truth) on report-free measures, Party A's encapsulation hypothesis is empirically falsified, not merely re-described. Conversely, if performance tracks statistics despite the belief, Party B's claim that cognitive content fixes perceptual content is empirically falsified. Because the expected data patterns are mutually exclusive and observable under the agreed protocol, this component of the dispute is robustly substantive.

  The Parties agree to leave the **Individuation** question (Issue 3) unresolved in this document. Should the empirical results of Cruxes 1, 2, and 3 favor Party B, the Parties will reconvene to negotiate whether this necessitates a change in Party A's definition of "encapsulation" or a concession on the architecture of the perceptual system. Should the results favor Party A, the question of individuation remains moot.
