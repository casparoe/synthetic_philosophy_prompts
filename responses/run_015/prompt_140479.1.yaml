          *   *The Tension:* Rudd's apology is words. Jaspers might call this insufficient if not backed by material reparations (which the prompt notes are "patchy").
          *   *The Counter:* An apology transforms the *political* relationship. It acknowledges the debt. It shifts the state's moral standing. It's a performative act of Political Guilt acceptance, even if Jaspers emphasizes payment.
