          *   *Actualism/Abstractionism:* Worlds are abstract objects. Grounding usually holds between existing entities. Can an actual entity be grounded in a non-actual abstract object?
      *   **Well-Foundedness:** Usually implies that every chain has a *terminus*. If the chain crosses worlds, where does it terminate? In a "super-world"? Or is the totality of reality the domain of grounding?
      *   **The User's Scenario:** Physical constants in $W_1$ depend on a mathematical structure fundamental in $W_2$.
