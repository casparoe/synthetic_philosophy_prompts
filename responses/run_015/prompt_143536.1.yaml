answer: |-
  **Subject: Re: Lecture 12 - Kalai-Smorodinsky and Monotonicity**

  **Jordan:**
  Honestly, the Kalai-Smorodinsky (KS) solution feels so much more intuitive than Nash until you really stress-test the Individual Monotonicity axiom. I get the normative appeal—if the feasible set expands and my ideal point goes up (while yours stays fixed), I shouldn't end up worse off. It feels like a basic rationality constraint. But I'm stuck on the assumption that the disagreement point is fixed during that expansion.

  In real negotiations, the status quo isn't just a fixed utility vector sitting outside the feasible set. It's often endogenous to the context of the available options. If we expand the feasible set in one dimension, it can change how agents frame the fallback position in another dimension. Like, introducing a high-stakes option might make the status quo feel riskier or less stable, effectively lowering the perceived disagreement point. If $d$ shifts downward because $S$ expanded, does monotonicity still hold? It feels like KS breaks if the "threat point" moves simultaneously with the opportunity set.

  **Alex:**
  I see where you're going, but I think you're conflating the model with the application. In the KS framework, the disagreement point $d$ is exogenous by definition. The Monotonicity axiom specifically compares $(S, d)$ to $(S', d)$ where $S \subseteq S'$. If the expansion of $S$ causes $d$ to shift, then you aren't looking at the same bargaining problem anymore—you're comparing $(S, d)$ to $(S', d')$.

  If the framing effect changes how agents value the status quo, that should be captured in the utility representation, not the feasible set. If the presence of new options makes the status quo feel worse, that's a preference transformation. We should model that by adjusting the utility functions so that $d$ remains the fixed reference point relative to those utilities. Once you clean up the representation, Monotonicity holds because you're isolating the effect of the opportunity set alone.

  **Jordan:**
  But that's exactly the issue—you can't "clean up the representation" that neatly. The whole point of cooperative game theory in applied settings is that the feasible set and the disagreement point are co-determined by the institutional context. You can't separate the utility of the status quo from the set of alternatives available to compare it against.

  Think about it: if I'm negotiating a salary and the feasible set expands to include equity options, my fallback point isn't just "no job." It might shift to "no job plus regret over missed equity," or my outside options might look worse by comparison. If expanding $S$ psychologically or strategically lowers my leverage at $d$, then expanding the set *can* hurt me. KS Monotonicity says that's impossible. If the axiom forbids a scenario that happens constantly in real bargaining, is it a normative guide or just a mathematical artifact?

  **Alex:**
  It's a normative guide, though. We're not trying to build a descriptive behavioral model here; we're looking for a solution concept that satisfies certain fairness properties. If we allow $d$ to move endogenously with $S$, we lose the ability to make comparative statics. You need *ceteris paribus* to say anything meaningful about the solution's behavior.

  If you let $d$ shift whenever $S$ shifts, you basically open the door to any outcome. The power of KS is that it says: "Given a fixed threat point and a set of possible agreements, here is the unique point that respects proportional gains." If you want to model the shifting threat point, that's a different game—maybe a non-cooperative stage before the bargaining. But for the bargaining solution itself, holding $d$ fixed is necessary to preserve the axiom's logic. Otherwise, Monotonicity isn't violated; you're just violating the problem definition.

  **Jordan:**
  I get the need for *ceteris paribus*, but my worry is that in negotiation, the "problem definition" *is* the strategic move. Agents don't just accept $S$ and $d$ as given; they argue over them. If KS assumes they are separable, it might be robust mathematically but brittle sociologically.

  If expanding $S$ changes the reference frame such that the agent perceives a loss relative to the new ideal point, even if the absolute utility is higher, the KS solution might demand an increase that the agent doesn't value, or misses that the agent feels worse off because $d$ shifted. I'm not saying we throw out KS, but maybe Monotonicity needs a caveat: it only holds when the framing of the status quo is invariant to the feasible set. And I'm not sure that's ever true.

  **Alex:**
  That's fair. Maybe the compromise is to view KS as a benchmark for when framing effects *aren't* dominant. If the context is stable enough that $d$ doesn't fluctuate with $S$, then Monotonicity gives us a really clean way to handle claims over surplus without relying on IIA. But you're right—if the expansion of the pie changes how people view the knife, the solution concept needs to account for that endogeneity. Maybe that's where the seminar project should go: testing how much $d$ needs to shift to violate Monotonicity in experimental settings.

  **Jordan:**
  Exactly. If we can quantify the threshold where framing effects overwhelm the monotonicity gain, that's way more interesting than just proving the axiom holds in a vacuum. Anyway, gotta run to office hours. Let me know if you want to pair up for the problem set.

  **Alex:**
  Sounds good. I'll think about that threshold condition. See ya.
