  2.  **Deconstruct the Technical Content:**
      *   **Kalai-Smorodinsky Solution:** Balances proportional gains relative to the ideal point. Key axioms: Pareto Efficiency, Symmetry, Scale Invariance, and *Individual Monotonicity*.
      *   **Individual Monotonicity (IM):** If the feasible set $S$ expands to $S'$ (where $S \subseteq S'$), and the ideal point for player $i$ increases (or stays same) while others' ideal points stay same, then player $i$'s payoff in the solution should not decrease. Basically, having more opportunities shouldn't hurt you.
      *   **The Critic's Point (Endogenous Disagreement Point):** KS assumes a fixed disagreement point $d$ (usually normalized to 0). The critic argues that in reality, $d$ isn't fixed. If the set of possible agreements expands, the "status quo" or threat point might shift because the context of the negotiation changes. If $d$ shifts unfavorably for player $i$ when $S$ expands, the net gain might decrease, violating the spirit of IM.
      *   **The Defender's Point:** The model assumes $d$ is fixed. If framing changes $d$, that's a change in the problem definition, not a failure of the solution concept. Utility functions should capture preferences over outcomes including status quo perceptions.
