answer: |-
  ### Part 1: Theoretical Corrections

  Your four claims are substantially correct, but two nuances need tightening before we build the procedure.

  1.  **Rationality vs. Outcome:** You wrote that following the crowd is "individually rational." This is true only if the earlier voters are perceived as acting on *private information*. If they are acting on *public information* (the same memo everyone read), following them is not rational; it is double-counting evidence. Your procedure must distinguish between "I trust Jane's expertise" (Rational Aggregation) and "I trust Jane's vote" (Cascade).
  2.  **Fragility:** You noted the state is fragile. The theory adds that cascades are also *opaque*. Once a cascade begins, later voters cannot tell if the early voters knew something or were just following someone before them. This means you cannot fix a cascade by asking later voters "Why?" They will give you rationalizations, not reasons. You must look at the *sequence*, not just the explanations.

  **Correction for the Procedure:** We will treat "Deference to Expertise" as valid *only if* the expert's private information is explicitly entered into the record before the vote. If the expert just votes first, it counts as a cascade risk.

  ---

  ### Part 2: The Convergence Audit Procedure

  This procedure is designed to be run by you (the Chair) in the 5 minutes before the meeting. The 10 minutes of meeting time are used only to announce the verdict and apply the remedy.

  **Inputs Required:**
  1.  Sealed Pre-Vote Tally (Yes/No/Abstain).
  2.  Final Vote Tally.
  3.  Speaking Order Log (Who spoke 1st, 2nd, 3rd).
  4.  Reason Log (The one-sentence justifications).
  5.  Source Log (What document or person each reason cites).

  #### Step 1: Calculate the "Drift Score"
  Count the number of "Yes" votes in the Pre-Vote ($P$) and the Final Vote ($F$).
  *   **Calculation:** $Drift = |F - P|$.
  *   **Sufficient Answer:** Drift is 0 or 1. (Consensus is stable).
  *   **Non-Answer:** Drift is 2 or more. (Significant movement occurred).
  *   **Termination:** If Drift $\le$ 1, skip to Step 4. If Drift $\ge$ 2, proceed to Step 2.

  #### Step 2: The "Source Concentration" Check
  Review the one-sentence reasons for the Final Vote. Count how many cite the *same* single source (e.g., "The diligence memo," "Jane's field visit," "The Chair's opening").
  *   **Calculation:** $\% \text{Concentration} = (\text{Votes citing dominant source} / \text{Total Votes}) \times 100$.
  *   **Sufficient Answer:** Concentration is $< 50\%$. (Members are looking at different data).
  *   **Non-Answer:** Concentration is $\ge 50\%$. (Members are looking at the same data).
  *   **Termination:** If Concentration $< 50\%$, verdict is **Robust**. If $\ge 50\%$, proceed to Step 3.

  #### Step 3: The "Early Lock" Diagnostic
  Check the votes of the first two speakers in the meeting sequence. Did they vote the same way as the Final Majority?
  *   **Calculation:** Binary Check (Yes/No).
  *   **Sufficient Answer:** The first two speakers *disagreed* with each other OR disagreed with the Final Majority. (The sequence remained open).
  *   **Non-Answer:** The first two speakers agreed with each other AND match the Final Majority. (The sequence likely froze).
  *   **Termination:** If Sufficient, verdict is **Expert-Led**. If Non-Answer, verdict is **Suspected Cascade**.

  #### Step 4: The "Dissent Quality" Check (Only if Drift $\le$ 1)
  If the vote was unanimous or near-unanimous from the start, check the Pre-Vote reasons. Did the Pre-Vote dissenters (if any) cite specific private information (e.g., "I called the CFO," "I visited the site")?
  *   **Sufficient Answer:** Pre-Vote dissent cited private, verifiable data.
  *   **Non-Answer:** Pre-Vote dissent cited general risk ("Too early," "Unclear").
  *   **Termination:** If Sufficient, verdict is **Robust**. If Non-Answer, verdict is **Common Knowledge** (Everyone read the same memo and agreed).

  ---

  ### Part 3: Verdicts and Remedies

  | Verdict | Definition | Remedy | Action |
  | :--- | :--- | :--- | :--- |
  | **1. Robust Consensus** | Low Drift, High Source Independence. | **Approve.** | No action. Record as high-confidence. |
  | **2. Expert-Led** | High Drift, but early speakers had *private* info shared on record. | **Approve with Note.** | Document exactly which new info changed minds. |
  | **3. Suspected Cascade** | High Drift, High Source Concentration, Early Lock. | **Defer.** | Re-solicit sealed votes. Anonymize early arguments. |
  | **4. Common Knowledge** | Low Drift, but everyone cited the same public memo. | **Outside Read.** | Send the memo to one external expert for blind review. |

  **Where "Judgment in a Lab Coat" is Required:**
  Step 3 requires you to decide if the first speaker's influence was due to *status* or *substance*. If the first speaker is the senior regional expert and they cited a site visit, that is **Expert-Led**. If they are senior but cited the same memo as everyone else, that is **Suspected Cascade**. The procedure flags the risk; you must judge the legitimacy of the authority.

  ---

  ### Part 4: Application to Past Cases

  #### Case 1: Ballot-Measure Coalition (9–1 Final)
  *   **Data:** Pre-votes unknown (assume mixed). Two senior officers spoke first (Yes). One had field visit. Others read same memo.
  *   **Step 1 (Drift):** Likely High (Seniors swayed the room).
  *   **Step 2 (Source):** High Concentration (Everyone relied on the Seniors' endorsement).
  *   **Step 3 (Early Lock):** Yes (Seniors spoke first and agreed).
  *   **Step 4 (Expertise Check):** One senior had a *field visit* (Private Info).
  *   **Verdict:** **Expert-Led.**
  *   **Analysis:** Your friend calls this herding. The procedure says this is *rational aggregation* **only if** the field visit details were described to the room before the vote. If the senior just said "I like it, I've been there," it is a Cascade. If they said "I saw 500 volunteers, here is the log," it is Expertise.
  *   **Remedy:** If the field visit details were vague, you should have Deferred for a written summary of the visit. If detailed, the vote stands.

  #### Case 2: Your Championed Grant (10–0 Final, 6–4 Pre-Vote)
  *   **Data:** Pre-vote 6–4. Final 10–0. Reasons cited same evaluation report. No one else spoke to grantee. You spoke early (Championed).
  *   **Step 1 (Drift):** High (4 votes flipped).
  *   **Step 2 (Source):** High Concentration (100% cited the report).
  *   **Step 3 (Early Lock):** Yes (You championed it early).
  *   **Verdict:** **Suspected Cascade.**
  *   **Analysis:** Applying this as if you were not in the room: This is a textbook informational cascade. The "evaluation report" is public/common knowledge. Your advocacy acted as the "early signal." The 4 flipped voters likely updated on *your confidence*, not the *report*.
  *   **Remedy:** This should have been Deferred. The remedy is an **Outside Read** of the evaluation report by someone who doesn't know you. The vote carries low evidential weight.
  *   **Hard Truth:** You are proudest of this grant, but the procedure indicates it was the *riskiest* process. The outcome may be good, but the decision mechanism was fragile.

  #### Case 3: Renewal Rejection (9–1 Against, Deferred by Chair)
  *   **Data:** Vote to Reject. You Deferred. Later, 3 officers revealed unprompted reporting problems.
  *   **Step 1 (Drift):** Low (Vote was lopsided against).
  *   **Step 2 (Source):** Mixed (Initial reasons likely vague; later reasons specific).
  *   **Step 3 (Early Lock):** Likely Yes (Rejection momentum built early).
  *   **Verdict:** **Common Knowledge / Latent Signal.**
  *   **Analysis:** The initial vote looked like a cascade (piling on to reject). However, the private signals (reporting problems) existed but were not weighted heavily enough to drive the *reasons* initially.
  *   **Was Intervention Justified?** **Yes.** Not because the vote was wrong (the grant was likely bad), but because the *reasoning* was hidden. If you had approved the rejection, you wouldn't know *why*. If the reporting problems were fixable, you killed a salvageable grant. If they were fatal, you need to know that for future renewals.
  *   **Correct Remedy:** You used Deferral (correct). Next time, use a **"Silent Re-Vote."** Ask members to re-submit sealed votes *after* hearing the dissenting concerns, without discussion. This separates social pressure from genuine information.

  ---

  ### Part 5: Limitations, Gaming, and Auditing

  **What the Procedure Cannot Do:**
  1.  **Detect Reputational Cascades:** If members vote with you because they want a promotion, the "Source Concentration" will look normal (they will invent reasons). The procedure assumes honesty in the one-sentence reasons.
  2.  **Fix Groupthink:** If everyone truly believes the same wrong thing (e.g., a sector-wide bubble), the Pre-Vote and Final Vote will match. The procedure will label this "Robust," and you will fail together.
  3.  **Handle "Dissent Credit":** If members game the system to vote "No" just to look independent, the Drift Score will look high, triggering a Deferral. This wastes time but prevents bad grants.

  **Gaming Risks:**
  Once members know you are tracking "Source Concentration," they will vary their reasons artificially (e.g., citing different paragraphs of the same memo).
  *   **Mitigation:** Do not announce the specific thresholds. Tell them you are monitoring "Information Diversity."
  *   **Degradation:** The procedure degrades slowly. As long as the *Pre-Vote* remains sealed and private, the Drift Score remains honest. Protect the Pre-Vote secrecy above all else.

  **Audit Frequency:**
  Do not audit only the decisions that feel wrong (selection bias).
  *   **Schedule:** Run the Convergence Audit on **1 in 10 grants**, selected randomly by the Board Secretary before you see the data.
  *   **Reporting:** In your one-page Convergence Note to the Board, include a "Confidence Score" (High/Medium/Low) based on the Verdict.
      *   *High:* Robust Consensus.
      *   *Medium:* Expert-Led or Common Knowledge.
      *   *Low:* Suspected Cascade.
  *   **Board Action:** If you submit three "Low" confidence grants in a row, the Board triggers a full external review of the committee process.

  ---

  ### Part 6: The One-Page Convergence Note (Template)

  **To:** Board of Directors
  **From:** Committee Chair
  **Subject:** Decision Confidence Report [Quarter/Year]

  **Summary:**
  This quarter we funded $X$M across $Y$ grants. Below is the confidence assessment based on our internal information flow audit.

  **High Confidence (Robust Consensus):**
  *   *Grant A, Grant B:* Pre-votes aligned with final decisions. Members relied on independent data sources.
  *   *Risk:* Standard program risk.

  **Medium Confidence (Expert-Led):**
  *   *Grant C:* Final consensus shifted after specific expert testimony.
  *   *Risk:* Dependent on accuracy of [Specific Expert/Report].

  **Low Confidence (Process Alert):**
  *   *Grant D:* High vote drift detected; reasons cited single source.
  *   *Remedy Applied:* [Deferred for Outside Read / Silent Re-Vote].
  *   *Risk:* Informational Cascade. Decision may be fragile to new public data.

  **Chair's Attestation:**
  I certify that for all Low Confidence grants, the remedy was applied to isolate private information from social pressure.

  [Signature]
