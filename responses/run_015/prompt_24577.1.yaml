answer: |-
  1. Multiple realizability suggests consciousness could emerge from distributed networks in cephalopods or insects that lack a mammalian global workspace but still achieve functional information integration.
  2. Complex behavioral trade-offs in invertebrates, such as bees weighing risk against reward or crustaceans protecting injuries, imply affective states that mere access consciousness cannot adequately explain.
  3. Evolutionary continuity suggests it is implausible that phenomenal experience switched on abruptly with specific cortical layers rather than scaling gradually with sensory integration and behavioral flexibility.
  4. A committed defender must concede that if an animal demonstrates robust metacognition or episodic memory without the proposed neural architecture, the architectural necessity claim is falsified.
  5. Although defining consciousness by hidden architecture risks unfalsifiability by dismissing contrary behavior as unconscious processing, this insulation is inherent to any other-minds problem rather than a unique failure of this theory.
