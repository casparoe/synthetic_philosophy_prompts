prompt: |-
  As someone who recently sat through a corporate compliance workshop that treated the Knobe effect—the experimental-philosophy finding that people judge harmful side effects as intentional but beneficial ones as unintentional, holding mental-state descriptions constant—as though it were a calibrated engineering parameter for drafting liability clauses, I want a deadpan parody. Write an in-universe consulting memo (around 600 words) in the polished, jargon-heavy voice of a fictional behavioral-science consultancy proposing a formal “Side-Effect Intentionality Matrix” for multinational governance. The memo should feature fake subsection headers, a “Key Performance Indicator” for moral attribution, and a sidebar on “Cultural Calibration” that notes, without resolving, the WEIRD-population limitations of the underlying studies. Invent a “Senior Fellow” who argues that because the asymmetry replicates in factory-emission vignettes, it should directly inform tort-law mens rea standards. The satire should target both the over-application of folk-psychology experiments to legal doctrine and the tendency of experimental philosophy to present descriptive asymmetries as normative fixtures. Keep the irony sustained and deadpan—never wink—so that the logical extension feels absurd to anyone familiar with the original experiments, yet remains legible as serious corporate prose. After the memo, include a section titled “Commentary on the satirical choices” (around 150 words) explaining which real features of the Knobe literature and its institutional overreach you exaggerated, and why you preserved the deadpan tone. Do not request citations, bibliographies, or reading lists.
