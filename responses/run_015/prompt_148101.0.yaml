  2.  **Deconstruct the Theoretical Concepts (Mental Check):**
      *   *Formal Subsumption:* Capital takes over existing craft. The spinner still spins mostly the same way, but now for a wage, under a boss, for longer hours. The tool is still an extension of the worker.
      *   *Real Subsumption:* Machinery (like the self-acting mule) changes *how* the work is done. The machine dictates the pace. The worker becomes an attendant. Skill is transferred from the worker to the machine (fixed capital).
      *   *The Owners' Analogy:* "Apprentice $\rightarrow$ Clockwork." Implies continuity of product and process, just removal of human error/slowness.
