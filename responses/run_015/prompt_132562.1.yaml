      *   *Winner:* Riley (conceptual utility) vs. Sam (philosophical rigor). I'll lean Riley because the prompt asks about "institutional-decay literature," where mechanism matters more than raw scores.

      *(Self-Correction on Winner)*: Actually, Sam's first point contains a factual error regarding the US and V-Dem (V-Dem did downgrade the US to electoral democracy). If I point that out, it weakens Sam 1 significantly. I should mention that.

