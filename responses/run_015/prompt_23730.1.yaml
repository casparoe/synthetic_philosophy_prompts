      *   *Q4 (Social Construction/Homosexuality):* Focus on the mechanism of change.
          *   *Standard Defense:* We realized it wasn't harmful.
          *   *Follow-up:* Who holds the veto power on harm?
      *   *Q5 (Cultural Variation):* Focus on cross-cultural diagnosis.
          *   *Standard Defense:* Universal human needs.
          *   *Follow-up:* Are those needs biological or cultural?
      *   *Q6 (The "Doctor's Authority"):* Focus on medical power.
          *   *Standard Defense:* Partnership model.
          *   *Follow-up:* Who breaks the tie?
      *   *Q7 (Evolutionary Mismatch):* Focus on modern environments.
          *   *Standard Defense:* Health is context-dependent.
          *   *Follow-up:* Does this make health infinitely malleable?

      *Let's select the best 7-9 and refine the "cornering" aspect.*

      *   *Selection:*
