      *   *Normativism (Engelhardt, Fulford, etc.):* Health involves judgments of value (good/bad).
      *   *Hybrid Views (Wakefield, etc.):* Harmful Dysfunction (natural function + value harm).
      *   *Key Tensions:* Objectivity vs. Subjectivity, Stability vs. Cultural Relativity, Biological Reality vs. Social Interpretation.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Core Claim.* Need to start strong. Don't ask "What is normativism?" Ask *why* the biological definition fails.
      *   *Question 2: The Mere-Badness Problem.* (Required). If health is about values, why isn't ugliness a disease?
          *   *Likely Reply:* Distinction between "intrinsic badness" and "functional failure" or "welfare."
          *   *Follow-up:* Press on who defines welfare.
      *   *Question 3: Natural Kinds.* (Required). Can we do science if the category is fuzzy?
          *   *Likely Reply:* Pragmatic realism. Categories serve purposes.
          *   *Follow-up:* Does this make disease *less* real than gravity?
      *   *Question 4: Objectivity/Policy.* (Required). Public health needs hard numbers.
          *   *Likely Reply:* Values are shared/inter-subjective.
          *   *Follow-up:* What about minority values? (Health equity angle).
      *   *Question 5: Social Construction/Homosexuality.* (Required). The DSM change.
          *   *Likely Reply:* That was a correction of moral error, not a biological discovery.
          *   *Follow-up:* How do we know it was an error without a biological anchor?
      *   *Question 6: The "Enhancement" Angle.* If health is values, is enhancement just new health?
          *   *Likely Reply:* Therapy vs. Enhancement distinction relies on norms.
          *   *Follow-up:* Does this medicalize morality?
      *   *Question 7: The Patient Experience.* Bring it back to the clinic.
          *   *Likely Reply:* Patient values matter.
          *   *Follow-up:* What if patient values conflict with medical norms?
      *   *Question 8: Future/Evolution.* Biological norms change.
      *   *Question 9: Closing/Personal.*

      *Refining for the "Corner Gently" constraint:* The follow-ups need to anticipate the standard defense and push one step further.

  4.  **Developing the Specific Questions & Follow-ups:**

      *   *Q1 (Mere-Badness):* Focus on the line between "unfortunate" and "pathological."
