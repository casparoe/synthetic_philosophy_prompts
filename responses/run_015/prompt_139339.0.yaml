  1. **Wrong.** It defines domination only by pure strategies. In mixed IDSDS, a strategy can be dominated by a mixture even if no pure strategy dominates it.

  2. **Wrong.** Your instinct is correct. In the example, a 50-50 mix of T and M yields payoff 2 against L, C, and R. B yields 1. The mix dominates B, but T fails against C (0<1) and M fails against L (0<1). Mixed domination is strictly stronger than pure.

  3. **Right.** This is Pearce's Lemma. A strategy is undominated (survives IDSDS) iff it is a best response to some belief (mixed strategy profile) over opponents' actions.

  4. **Right.** Strictly dominated strategies are never best responses, so they carry zero probability in any Nash equilibrium. IDSDS preserves all NEs; if it reduces to one profile, that is the unique NE.

  5. **Right.** Order independence is a key property of *strict* domination (pure or mixed). Weak domination lacks this property.

  6. **Wrong.** The mix is a proof tool, not a prescription. Deleting B tells Row not to play B. It does not force Row to play the specific 50-50 mix used to prove B's inferiority. Row might play pure T in equilibrium.

  7. **Wrong.** After deleting B, check Column. Against {T, M}, R gives payoff 1. A 50-50 mix of L and C gives 2 against T (0.5×4+0.5×0) and 2 against M (0.5×0+0.5×4). Since 2>1, R is strictly dominated by a mix and should be deleted. Survivors are {T, M} × {L, C}.
