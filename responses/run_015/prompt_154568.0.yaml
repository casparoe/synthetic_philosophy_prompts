prompt: |-
  I'm a novelist — literary stuff with one foot in SF — and I'm about 40k words into a book that hangs entirely off a quantum suicide setup, and I keep drafting scenes that my beta readers, and my mate who did physics at Imperial, tell me are cheating. So what I want isn't a physics lesson, it's a craft procedure: something I can run on any scene I've written in about ten minutes, in the vocabulary I actually work in — point of view, whose head we're in, free indirect style, what the narrator is licensed to know, what the reader can infer from what's on the page, dramatic irony, offstage action — that tells me whether the scene is honest to the premise or whether I've quietly smuggled in a bit of magic. Constraints: no equations, no branching-tree diagrams (I tried drawing one and it made everything worse), it has to work for both my present-tense first-person chapters and the third-person-limited ones, and it should end in either a rewrite instruction or an explicit "this one's a judgment call, you decide" rather than in a shrug. I cant afford many more dead chapters.

  Where I've got to, which you should correct if I've mangled it: as I understand it, every outcome of the device happens somewhere, but you only ever have experiences in the outcomes where there's still a you around to have them, so from the inside you apparently survive everything while from outside you're just dead in nearly all of it. The snags I keep hitting and want the procedure to handle, in roughly the order I hit them: the *grain* problem, since dying isn't instantaneous and I'm not sure there is a single clean outcome in which "she survives" — what do I do with a scene where the character is clinically gone for four minutes and comes back, is that a branch or a smear? The *mangled-branch* problem, since the outcomes where you walk away from a shotgun in the face are outcomes where you walk away ruined, and my character can't be untouched by chapter nine — how much of that do I owe the reader, and at what point does it stop being a book anyone finishes? The *witness* rule, since every other character in the book sees her die — what am I allowed to dramatise and what can I only report, and can I ever write from the daughter's point of view at all, or is that a different novel? The *accumulation* problem, since from the inside she can't know she's in the freak sequence of outcomes but the reader has to feel the improbability mounting, and I don't know how to get that onto the page without handing the narrator knowledge she couldn't have. And the *other-people* problem, since at one point she tries to drag someone through with her, and I genuinely can't tell whether the premise lets her.

  Then run it on three scenes I've got drafted, and give me the third answer even though I don't want it: (a) a present-tense first-person chapter where she presses the button for the hundredth time and nothing happens; (b) a third-person chapter from the daughter's point of view the following morning, identifying the body; (c) my ending, which I love and which I suspect is exactly the one that breaks the rules — she's ninety-odd, she dies in bed with the daughter holding her hand, and the last two pages are inside her head as it goes dark. Tell me precisely what (c) is getting wrong and what the cheapest fix is that keeps the feeling of it. And be honest about where the procedure runs out: mark the points that are just artistic calls, and separately the points where it runs out because the philosophy and the physics don't settle it either — I'm thinking of the business of whether the point of view tracks how many outcomes there are or how thick they are (amplitude? my mate used a word I've forgotten), and whether there's some floor below which the surviving sliver is too thin to be anybody at all. Don't pad it out with a reading list or names of papers, I've read the pop-science accounts and I'm not going to read the papers — I just want to stop writing scenes that don't work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist (literary/SF blend), 40k words in.
      *   **Problem:** Beta readers and a physicist friend say scenes are "cheating" the quantum suicide (QS) premise.
      *   **Goal:** A *craft procedure* (not a physics lesson) to test scenes for honesty to the premise.
      *   **Constraints:**
          *   No equations, no branching-tree diagrams.
          *   Must work for 1st-person present and 3rd-person limited.
          *   Time limit: ~10 minutes per scene.
          *   Vocabulary: POV, head, free indirect style, narrator license, inference, dramatic irony, offstage action.
          *   Output: Rewrite instruction OR "judgment call." No shrugs.
          *   Specific Snags to Address: Grain (dying isn't instant), Mangled-Branch (survival isn't unscathed), Witness (others see death), Accumulation (reader feels improbability without narrator knowing), Other-People (dragging someone along).
          *   Task: Run the procedure on three specific scenes (a, b, c).
          *   Specific Demand: Be honest about where the procedure fails (artistic calls vs. unsettled physics/philosophy).
          *   Tone: Professional, direct, craft-focused, no fluff/reading lists.

  2.  **Deconstruct the Quantum Suicide Premise (for Craft Purposes):**
      *   *Core Mechanic:* Many-Worlds Interpretation (MWI). Every quantum event branches reality.
      *   *QS Specific:* Consciousness follows the branch where the observer survives.
      *   *The "Cheating":* Usually involves the protagonist knowing too much (omniscience), surviving impossible macroscopic events without consequence (cartoon physics), or violating the POV constraints (seeing branches they shouldn't).
      *   *The User's Understanding:* "From the inside you apparently survive everything while from outside you're just dead in nearly all of it." -> This is correct for the purpose of the narrative logic.

  3.  **Develop the Craft Procedure ("The Continuity Audit"):**
      *   Needs to be a checklist or a series of questions based on narrative tools.
      *   *Focus:* Information flow and Consequence.
      *   *Step 1: The Knowledge Boundary.* What can the POV character know? (They can't know they died elsewhere. They can't know the odds unless told.)
      *   *Step 2: The Cost of Continuity.* Survival isn't free. Entropy must be paid somewhere.
      *   *Step 3: The Witness Limit.* What can external characters see? (They see death mostly.)
      *   *Step 4: The Coherence Check.* Is the survival physically plausible within the surviving branch? (Grain problem).

      *Refining the Procedure:* Let's make it a "Three-Question Interrogation."
      1.  *The Information Lock:* Does the narrator know something the surviving timeline doesn't provide?
      2.  *The Entropy Tax:* Did the survival cost the character something physical/psychological *in this timeline*?
      3.  *The Witness Consistency:* Do offstage reactions match the statistical likelihood of death?

  4.  **Address the Specific Snags (integrating into the procedure or as preamble):**
      *   *Grain:* Survival must be continuous. If brain death occurs, consciousness ends. No "coming back" after true cessation unless the "death" was reversible *in that branch*.
      *   *Mangled-Branch:* The "Survivor Bias." If you survive a shotgun blast, you are likely maimed. The narrative must show the damage.
      *   *Witness:* Others see death. POV can only show their grief/confusion, not their memory of *this* specific survival (because it didn't happen for them).
      *   *Accumulation:* Use dramatic irony. Reader knows the odds; character thinks they are lucky.
      *   *Other-People:* Entanglement. You can't drag someone unless their survival is quantum-linked to yours. Otherwise, they die in your surviving branch.

  5.  **Drafting the Procedure (The "Continuity Audit"):**
      *   Keep it tight. Use the user's vocabulary.
      *   Name it something useful. "The Survivor's Audit."
      *   Steps:
          1.  **POV Knowledge Check:** Is the narrator inferring death elsewhere? (Forbidden).
          2.  **Physical Continuity Check:** Is the body intact enough to host consciousness? (Grain/Mangled).
          3.  **External Reality Check:** Do side characters react to a miracle or a corpse? (Witness).
          4.  **Probability Shadow:** Is the luck feeling like luck or plot armor? (Accumulation).

  6.  **Running the Procedure on the Three Scenes:**

      *   *(a) 1st Person, 100th press, nothing happens.*
          *   *Issue:* Boredom vs. Tension. If nothing happens, is the device broken? Or is this the branch where it failed?
          *   *Verdict:* Needs to show the *expectation* of death without the narrator knowing they survived.
          *   *Fix:* Focus on the sensory anticipation of the end that doesn't come.

      *   *(b) 3rd Person Daughter, identifying body.*
          *   *Issue:* Which body? In *this* branch, the mom is dead. In the mom's branch, she's alive.
          *   *Verdict:* This is valid *only* if it's the daughter's branch. The daughter sees a corpse. The mother (elsewhere) is alive.
          *   *Fix:* Ensure the daughter's grief is absolute. No hint of "maybe she's alive."

      *   *(c) Ending, 90yo, dying in bed.*
          *   *Issue:* QS implies you *don't* die until the mechanism stops or natural causes override the quantum trigger. But natural death *is* a quantum event eventually.
          *   *The Cheat:* If she dies naturally, QS suggests she should slide into a branch where the heart attack didn't happen, ad infinitum, until heat death.
          *   *The Fix:* The device must stop working, or she must accept the cessation of the mechanism. Or, the "death" is the final branch where the probability amplitude hits zero.
          *   *Critique:* The user suspects this breaks rules. It does. QS implies immortality until the universe ends.
          *   *Cheapest Fix:* The device runs out of power/quantum randomness. She becomes classical.

  7.  **Addressing the "Where it Runs Out" (Philosophy/Physics Limits):**
      *   *Amplitude/Measure:* Does consciousness follow *any* branch or only *high measure* branches? Physics doesn't know. This is an artistic choice.
      *   *The "Floor":* When is a branch too thin to support a mind? Artistic choice.
      *   *Identity:* Is the survivor the *same* person? Philosophy doesn't settle it.

  8.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? No, keep it crafty.
      *   *Constraint Check:* No equations? Check. No diagrams? Check. 10-minute scope? Check.
      *   *Specific Request:* "Tell me precisely what (c) is getting wrong and what the cheapest fix is." -> Need to be very clear here.
      *   *Specific Request:* "End in either a rewrite instruction or an explicit judgment call." -> Ensure the audit concludes decisively.

  9.  **Final Polish:**
      *   Make sure the "Grain" and "Mangled-Branch" issues are explicitly handled in the audit steps.
      *   Ensure the distinction between *Narrator Knowledge* and *Reader Inference* is clear for the Accumulation problem.
      *   Clarify the "Other-People" problem in the audit (Entanglement).

      *(Self-Correction during drafting)*: I need to make sure I don't give a physics lecture while explaining the audit. Keep the language strictly narrative. Instead of "wavefunction collapse," use "narrative certainty." Instead of "amplitude," use "narrative weight."

      *(Refining Scene C)*: The user says she dies in bed at 90. In strict QS, she shouldn't die. She should keep surviving until the Earth is swallowed by the sun, etc. The "cheat" is allowing natural death to function as a hard stop. The fix: The *device* dies, not her. Or she turns it off. If she turns it off, she can die. That's the cheapest fix that keeps the emotion.

      *(Refining the Procedure)*: Let's call it "The Survivor's Audit." Four gates.
      1.  The Information Gate (POV knowledge).
      2.  The Continuity Gate (Physical state).
      3.  The Witness Gate (External reaction).
      4.  The Entanglement Gate (Other people).

      Let's write it.

      *(Final check on constraints)*: "No padding with reading list." "Be honest about where procedure runs out." "Mark points that are artistic calls."

      Okay, ready to generate response.

      *Wait, one nuance on Scene C:* If the premise is "Quantum Suicide," the character *cannot* die naturally while the mechanism is active. The mechanism forces survival. If the mechanism is active until age 90, she cannot die at 90 unless the mechanism fails. If the mechanism fails, she becomes mortal again. The emotional beat is "letting go." The fix is she *chooses* to stop the machine. That preserves the QS rules and gives the emotional ending.

      *Wait, one nuance on Scene B:* The daughter identifies the body. In the daughter's timeline, the mother died. In the mother's timeline, the mother lived. This is a classic "divergence" scene. It works *if* we stay strictly in the daughter's POV. We cannot hint that the mother is alive elsewhere *from the daughter's perspective*.

      *Wait, one nuance on Scene A:* 100th press, nothing happens. If it's a suicide device, "nothing happens" means the gun didn't fire / poison didn't inject. The narrator should feel *relief* mixed with *confusion*, not "I survived again." They can't know they survived *other* deaths. They just know *this* attempt failed.

      Okay, structure is solid. Proceeding.cw
answer: |-
  Here is the procedure. It is designed to be run in ten minutes, using only the narrative tools you listed. It does not care about the physics; it cares about the *contract* you have signed with the reader by choosing this premise.

  ### The Procedure: The Survivor's Audit

  Run these four gates on any scene. If a scene fails a gate, it is cheating the premise.

  **Gate 1: The Information Lock (POV & Narrator License)**
  *   **The Question:** Does the narrator know they have died elsewhere?
  *   **The Rule:** The POV character experiences a continuous timeline. They cannot remember dying. They cannot feel "relief" at surviving a specific branch unless the mechanism *failed* to trigger in their current reality. They only know what their senses tell them *here*.
  *   **The Check:** Scan for free indirect style. Look for words like "again," "another death," "lucky." If the narrator thinks, "I died yesterday," you have broken the lock. The narrator must think, "The gun jammed," or "I am still here."
  *   **Pass:** Narrator treats survival as mundane continuity or mechanical failure.
  *   **Fail:** Narrator treats survival as a metaphysical selection.
  *   **Fix:** Rewrite internal monologue to reflect ignorance of the multiverse. The character thinks they are lucky, or the machine is broken. Never that they are a survivor.

  **Gate 2: The Continuity Tax (Grain & Mangled-Branch)**
  *   **The Question:** Is the body in this scene capable of hosting the consciousness that just entered it?
  *   **The Rule:** Consciousness requires a functioning brain. If the device kills by destroying the brain, there is no branch where the character wakes up. If the device kills by heart stoppage, there is a window for resuscitation, but the brain suffers hypoxia.
  *   **The Check:** Look at the physical state of the character at the start of the scene following an event. Are they untouched? If so, the mechanism must be one that allows unscathed survival (e.g., a gun that jams). If the mechanism is a toxin or explosion, the survivor must be damaged.
  *   **Pass:** The character bears the scars, tremors, or cognitive fog of the near-event.
  *   **Fail:** The character walks away from a shotgun blast with clean clothes.
  *   **Fix:** Apply the tax. Add the tremor, the blood, the memory gap. If the damage is too high for the plot, change the mechanism to one that allows clean failure (e.g., a digital trigger that might not send the signal).

  **Gate 3: The Witness Consistency (Dramatic Irony & Offstage Action)**
  *   **The Question:** Do the side characters react to a corpse or a miracle?
  *   **The Rule:** In the vast majority of branches, the protagonist is dead. Side characters are *not* entangled with the protagonist's survival unless they are also using the device. They should see death.
  *   **The Check:** Look at the dialogue and action of secondary characters. Are they grieving? Are they calling an ambulance for a corpse? Or are they reacting to the protagonist standing there?
  *   **Pass:** Side characters see death (offstage to the protagonist) OR side characters see the protagonist but treat it as a statistical miracle (onstage).
  *   **Fail:** Side characters act as if the protagonist's survival is normal, or they reference the death without grief.
  *   **Fix:** Separate the timelines. If the protagonist is alive in the scene, the side characters must be reacting with shock/horror to the improbability, OR the scene must be from a side character's POV where the protagonist is definitely dead.

  **Gate 4: The Entanglement Limit (Other-People)**
  *   **The Question:** Did the protagonist drag someone else into the survival branch?
  *   **The Rule:** You cannot pull another person into your survival branch unless their survival is quantum-linked to yours (e.g., they are standing in the same blast radius). If they are independent, they die in your surviving branch.
  *   **The Check:** If the protagonist saves someone during a "suicide" event, check the physics of the save. Did the save depend on the quantum event?
  *   **Pass:** The other person dies, or their survival is mechanically explained (they weren't in the room).
  *   **Fail:** The protagonist reaches out a hand and pulls a friend through the "death" event unscathed.
  *   **Fix:** The other person must die in the protagonist's timeline. The protagonist survives alone. This is the cost of the premise.

  ***

  ### Running the Audit on Your Scenes

  Here is the verdict on the three scenes you provided.

  **(a) Present-tense First-Person: The 100th Press**
  *   **The Setup:** She presses the button. Nothing happens.
  *   **The Audit:**
      *   *Info Lock:* **Pass.** If she thinks "It didn't fire," she is safe. If she thinks "I survived again," she fails.
      *   *Continuity:* **Pass.** No physical damage if the mechanism didn't trigger.
      *   *Witness:* **N/A.** Solo scene.
      *   *Accumulation:* **Risk.** If she feels bored, it undermines the stakes.
  *   **The Problem:** The reader knows this is the 1 in $2^{100}$ branch. The character thinks it's a broken machine. The tension comes from the gap between her boredom and the reader's terror.
  *   **Verdict:** **Rewrite Instruction.** Do not let her acknowledge the pattern. She must suspect the machine is a dud. The horror belongs to the reader, via the chapter title or an epigraph stating the odds, not the narrator's internal monologue. If she knows she's on run 100, she must attribute it to mechanical failure, not metaphysical immunity.

  **(b) Third-Person Limited: The Daughter Identifying the Body**
  *   **The Setup:** Next morning. Daughter ID's the mother.
  *   **The Audit:**
      *   *Info Lock:* **Pass.** Daughter has no knowledge of the mother's survival elsewhere.
      *   *Continuity:* **Pass.** Body is dead.
      *   *Witness:* **Pass.** This is the "outside" view. She sees the death that happens in 99.9% of branches.
      *   *Entanglement:* **Pass.** Daughter is independent.
  *   **The Problem:** You cannot cut from this scene back to the mother alive in the next chapter without a clear timeline break. If you alternate POVs, you are writing two different books.
  *   **Verdict:** **Judgment Call.** You can write this scene, but it establishes that *this* is the daughter's timeline. The mother is dead here. If you return to the mother's POV, you must acknowledge she has lost her daughter (because in the mother's surviving branch, the daughter likely died or is grieving a different death). You cannot have it both ways. If the mother is alive, the daughter is grieving. If the daughter is happy, the mother is dead. Pick one axis per chapter.

  **(c) The Ending: Natural Death at Ninety**
  *   **The Setup:** She dies in bed, daughter holding hand, fade to black.
  *   **The Audit:**
      *   *Info Lock:* **Fail.**
      *   *Continuity:* **Fail.**
      *   *The Physics/Craft Conflict:** Quantum Suicide implies that as long as the mechanism is active, you *cannot* die. Natural death is a series of quantum events (cells failing, heart stopping). If the device forces survival on quantum outcomes, it overrides natural death. She should not die at 90. She should survive until the heat death of the universe, or until the device runs out of power.
      *   **What it's getting wrong:** It treats the device as a "get out of jail free" card that expires at a narratively convenient time. That is magic. The premise dictates immortality while the device functions.
      *   **The Cheapest Fix:** **She turns it off.**
      *   **Rewrite Instruction:** Keep the scene exactly as is (bed, daughter, hand-holding), but add one beat before the fade. She reaches for the device (or a switch, or a pill that stops the quantum coupling) and deactivates it. *Then* she dies. This preserves the rules: she survived as long as the machine ran, and she chose to accept death at the end. It keeps the emotional resonance (acceptance) without breaking the premise (magic mortality).

  ***

  ### Where the Procedure Runs Out

  You asked for honesty on where the craft tools stop and the philosophy/physics fuzziness begins. Here are the two points where the Audit cannot give you a binary Pass/Fail.

  **1. The "Measure" Problem (Amplitude vs. Existence)**
  *   **The Issue:** In physics, branches have different "weights" (amplitudes). A branch where you survive a nuke is incredibly "thin." Does consciousness persist in a thin branch?
  *   **The Craft Limit:** The Audit cannot tell you if your character is "too lucky." You can survive 100 coin flips. Can you survive 1,000? 1,000,000? At what point does the reader say "this is no longer a human experience"?
  *   **The Call:** This is an artistic threshold. You must decide the "Horizon of Believability." For literary SF, I suggest capping the explicit survivals. After a certain point, stop showing the mechanism. Let the character simply *be* old and lucky. Don't show the 10,000th press. Show the scar.
  *   **Instruction:** Treat the "thickness" of the branch as a mood variable. As the book progresses, make the world feel more alien, more isolated. The "thinness" of the branch manifests as loneliness, not physics.

  **2. The "Grain" of Consciousness (The Four-Minute Gap)**
  *   **The Issue:** You mentioned clinical death for four minutes. If the brain stops, does the "you" in the surviving branch wake up with a gap, or is that a new "you"?
  *   **The Craft Limit:** Neuroscience and Philosophy do not agree on this. The Audit cannot flag this as a cheat because the premise doesn't settle it.
  *   **The Call:** This is your definition of "Self."
      *   *Option A (Continuity):* Consciousness is a stream. If the stream breaks, the survivor is a duplicate. (This leads to horror/uncanny valley).
      *   *Option B (Snapshot):* Consciousness is a state. If the state is restored, it's the same person. (This allows the 4-minute gap).
  *   **Instruction:** Pick one and be consistent. If you choose Option A, the character must feel uncanny about their memories after a gap. If Option B, they can treat it like sleep. Do not mix them. If you mix them, it feels like cheating.

  **Summary:**
  Run the **Survivor's Audit** on every chapter. If it passes, the physics is sound enough for fiction. If it fails, rewrite the POV or the physical consequence. For the ending, **deactivate the device** before death. For the philosophy, pick your definition of self and stick to it. That is where the craft takes over from the science.
