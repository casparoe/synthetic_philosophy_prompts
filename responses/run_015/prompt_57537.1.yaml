answer: |-
  # PROCEDURE: FORECAST ACCURACY AND SCORING PROTOCOL (FASP-4)

  **Authority:** Financial Stability Authority, Forecasting Unit  
  **Applicability:** All quarterly filings by Unit Economists  
  **Execution Time:** ~20 minutes per analyst/cycle  
  **Version:** 1.0 (Epistemic Grounding)

  ---

  ## 1. CHOICE OF SCORING RULE

  **Test:** Identify the forecast type.
  *   **Type A:** Binary or Categorical (e.g., Bank Failure [Yes/No], Stress Event [None/Mild/Severe]).
  *   **Type B:** Continuous Predictive Distribution (e.g., GDP Growth, Inflation Rate).

  **Sufficient Answer:**
  *   For **Type A**, apply the **Logarithmic Scoring Rule** ($S = \ln(p)$ if event occurs, $\ln(1-p)$ if not).
  *   For **Type B**, apply the **Logarithmic Score (Likelihood)** evaluated at the realized outcome ($S = \ln(f(x))$, where $f$ is the reported density).

  **Procedure Output:**
  *   **Cost of Extreme Error:** If an analyst reports $p=0$ (or density $f(x)=0$) and the event occurs, the score is $-\infty$. This filing is rejected as invalid before scoring.
  *   **Cost of Tail Error:** If an analyst reports $p=0.001$ and the event occurs, the penalty is $\ln(0.001) \approx -6.9$. If they reported $p=0.1$, penalty is $\ln(0.1) \approx -2.3$. The rule imposes a severe, non-linear cost for underestimating tail risk.
  *   **Formal Property:** **Strict Propriety** (maximizes expected score only at true credence) and **Locality** (score depends only on the probability assigned to the actual outcome). This prioritizes information content (Kullback-Leibler divergence) over robustness.

  > **[MARGIN: JUDGMENT CALL]**
  > *Derivation vs. Value:* Strict propriety is a mathematical theorem; choosing *Logarithmic* over *Quadratic (Brier/CRPS)* is **not**. Quadratic rules are also strictly proper. We choose Logarithmic because this Authority’s mandate prioritizes tail-risk sensitivity over analyst comfort. Quadratic rules dampen the penalty for extreme overconfidence (e.g., assigning 0.01 to a crisis that happens). This choice sacrifices analyst retention for epistemic severity regarding black swans.

  ---

  ## 2. GRANULARITY AND BINNING

  **Test:** Did the analyst define the bin boundaries for this forecast, or were they assigned by the Unit?

  **Sufficient Answer:**
  *   Boundaries must be **Fixed Ex Ante** by the Unit Director for all analysts.
  *   If an analyst submits a refined partition (e.g., splitting a 3-bin forecast into 8 bins), the forecast must be aggregated back to the standard 3-bin partition before scoring.

  **Procedure Output:**
  *   **Comparability:** Scores are only comparable across analysts if the partition is identical.
  *   **Gaming Prevention:** An analyst gains no scoring advantage by refining bins to concentrate probability mass narrowly around the outcome (sharpness gaming).
  *   **Inaccuracy Measurement:** Total inaccuracy is measured relative to the fixed standard partition. Refinement is recorded as metadata but does not alter the official score.

  > **[MARGIN: JUDGMENT CALL]**
  > *Derivation vs. Value:* Scoring rules operate on a partition; changing the partition changes the score space. However, mandating a *fixed* partition across all analysts is an **administrative constraint**, not an epistemic necessity. It prioritizes institutional comparability (HR/Ranking) over individual epistemic expression. We sacrifice the information gain from refined bins to maintain a level playing field for performance review.

  ---

  ## 3. EVIDENCE, SELF-UNDERMINING, AND MANDATE

  **Test:**
  1.  **New Evidence:** Did the analyst acquire relevant information mid-quarter (e.g., a rumor)?
  2.  **Performativity:** Will the publication of this forecast trigger an intervention that changes the outcome (e.g., warning prevents failure)?

  **Sufficient Answer:**
  1.  **New Evidence:** The analyst **must update** their credence immediately. Ignoring relevant evidence is a violation of epistemic rationality (Conditionalization).
  2.  **Performativity:** The forecast is scored against the **actual realized outcome**, not the counterfactual.

  **Procedure Output:**
  *   **Evidence:** Filing a credence that ignores known evidence is treated as a procedural error, subject to review.
  *   **Self-Undermining:** If a high-probability warning triggers an intervention that prevents the event, the analyst receives a **poor accuracy score** (high probability assigned to non-event).
  *   **Mandate Override:** The Unit Director must annotate such cases in the parliamentary report as "Successful Interventions," decoupling the accuracy score from the utility assessment for external review.

  > **[MARGIN: JUDGMENT CALL]**
  > *Derivation vs. Value:* Accuracy-first epistemology (Good’s Theorem) states you should never decline free evidence. However, it also assumes the forecast does not *change* the truth. In the self-undermining case, **Accuracy-First reasoning conflicts with the Stability Mandate.** Maximizing accuracy might suggest *not* publishing a warning (to preserve the score), but the Mandate requires publishing. We prioritize the Mandate. The procedure accepts that successful prevention looks like forecasting failure. This is a value override, not an epistemic derivation.

  ---

  ## 4. IMPRECISE AND HEDGED FILINGS

  **Test:** Did the analyst submit a point credence (e.g., $p=0.2$) or an interval/set (e.g., $p \in [0.1, 0.3]$)?

  **Sufficient Answer:**
  *   Only **Point Credences** are accepted for official scoring.
  *   Intervals are rejected. If an analyst insists on submitting an interval, the system automatically converts it to the **midpoint** and applies a **Vagueness Penalty** (additive constant to the error score).

  **Procedure Output:**
  *   **Dominance:** The accuracy-dominance argument (that truth-telling maximizes expected score) holds only for precise probabilities.
  *   **Hedging:** Analysts cannot use imprecision to insulate themselves from calibration checks.
  *   **Conversion:** Interval $[a, b]$ is scored as $p = (a+b)/2$.

  > **[MARGIN: JUDGMENT CALL]**
  > *Derivation vs. Value:* Proper scoring rules require precise inputs to function. Forcing precision assumes the analyst’s mental state *can* be precise. This is a **normative imposition**. We are demanding analysts resolve uncertainty that may be inherently ambiguous. This prioritizes the system’s need for calculability over the cognitive reality of the forecaster.

  ---

  ## CASE STUDY RUNS

  ### Case (a): The 0.02 Failure
  **Scenario:** Analyst reported $p=0.02$ for bank failure. Bank failed. Analyst proposes filing $p=0.02$ again next quarter.
  **Procedure Application:**
  1.  **Rule:** Logarithmic Score. Realized score = $\ln(0.02) \approx -3.91$. (Severe penalty).
  2.  **Rationality Check:** Did the analyst ignore evidence? No. Was the probability coherent? Yes (low prob events occur).
  3.  **Output:** The analyst’s official accuracy rating drops significantly. However, **no sanction is applied** for the forecast itself, provided the 0.02 was derived from the model/evidence correctly. The analyst is permitted to file 0.02 again if the underlying risk metrics remain unchanged.
  **Verdict:** The system records a "failure" of prediction accuracy, but validates the epistemic process.

  ### Case (b): The IT Switch (Log to Quadratic)
  **Scenario:** IT proposes switching distributional forecasts from Logarithmic to Quadratic (CRPS/Brier) to reduce analyst complaints about volatility.
  **Procedure Application:**
  1.  **Rule:** Section 1 mandates Logarithmic for all types to ensure tail sensitivity.
  2.  **Test:** Does Quadratic satisfy the tail-sensitivity requirement? No. Quadratic rules penalize a 0.01 probability on a tail event much less severely than Logarithmic rules.
  3.  **Output:** **Proposal Rejected.** The switch would reduce the incentive to resolve tail uncertainty.
  **Verdict:** Analyst complaints are noted but overruled by the epistemic requirement for tail sensitivity.

  ### Case (c): The Bin Split
  **Scenario:** Analyst splits a 3-bin inflation forecast into 8 bins mid-year to capture sharpness near the true value.
  **Procedure Application:**
  1.  **Rule:** Section 2 mandates Fixed Ex Ante partitions.
  2.  **Test:** Did the analyst use the standard partition for the official filing? No.
  3.  **Output:** The 8-bin forecast is aggregated to the 3-bin standard for scoring. The "sharpness" gain from the split is discarded for the official record.
  **Verdict:** The refinement is archived for research but does not improve the analyst’s performance score.

  ---

  ## THE UNWELCOME CONCLUSION

  **Case:** **(a) The 0.02 Failure.**

  **Conclusion:** The procedure dictates that **you (the Director) cannot sanction the analyst**, nor can you officially downgrade their competence rating based solely on this realization, provided their process was sound.

  **Why this is unwelcome:** You will appear before a Parliamentary Committee following a bank failure. The Committee will demand accountability. They will see a forecast of "2% risk" followed by "Failure." They will interpret this as negligence or incompetence. This procedure binds your hands from offering the Committee a head to roll. It forces you to defend a system where a correct probabilistic assessment looks indistinguishable from failure in the public eye.

  **Why you must accept it:**
  If you sanction the analyst for a realized 0.02 event, you incentivize **calibration distortion**. Analysts will begin reporting $p=0.5$ on low-risk events to avoid the Logarithmic penalty if the tail hits. This destroys the informational value of the forecasting unit. You will have accurate *scores* (analysts protecting themselves) but useless *forecasts* (no risk differentiation). To maintain the integrity of the risk signals sent to the market and the supervisory team, you must absorb the political cost of defending probabilistic logic. The procedure protects the *system's* truth-telling capacity at the expense of the *Director's* political convenience.

  ---

  ## LIMITATIONS AND FAILURE MODES

  This procedure is not a panacea. It systematically fails in the following ways:

  1.  **Utility vs. Accuracy:** The procedure rewards *accuracy*, not *usefulness*. A forecast that is perfectly calibrated but arrives too late for intervention scores well but adds no value. Conversely, a "panic" forecast that triggers a preventative intervention (Case 3) scores poorly. The procedure cannot resolve this; it merely flags it. **Decision Right:** The **Parliamentary Committee** must decide if they value Stability (outcomes) or Truth (accuracy). This procedure delivers Truth.
  2.  **Topic Distortion:** Analysts will prefer to forecast variables that are scoreable and stable (e.g., inflation) over variables that are high-stakes but noisy (e.g., geopolitical stress events). The procedure does not reward difficulty, only accuracy. **Decision Right:** **You (the Director)** must manually weight the importance of different forecasts in the final performance review, as the scoring rule treats a correct coin flip and a correct crisis prediction mathematically similarly if probabilities match.
  3.  **The Value of Precision:** By rejecting imprecise filings (Section 4), we may force analysts to commit to false precision. In deep uncertainty, "I don't know" is often the most accurate statement. This system punishes "I don't know." **Decision Right:** **The Analyst** bears the ethical burden of whether to submit a precise number they know is fragile. The procedure assumes the world is precise enough to be scored; this is a philosophical wager, not a fact.
  4.  **Hidden Axiology:** The choice of Logarithmic scoring (Section 1) embeds a specific moral view: that underestimating tail risk is infinitely worse than overestimating it. This is appropriate for a Stability Authority, but it is not "objective." It is a policy choice disguised as mathematics.

  **Final Instruction:** Run this procedure exactly as written. Where the Margin notes indicate a judgment call, document the decision in the Unit’s annual methodology report. Do not alter the rules to accommodate individual analysts. If the rules produce political friction, that friction is the cost of epistemic integrity.
