answer: |-
  Distinguished faculty, philosophy students, proud parents, and fellow students: good morning.

  It is a privilege to welcome you to our annual interdisciplinary symposium. Looking around this room, I see a gathering that is rare in high school, and even rarer in the wider world. We have physicists who deal in the certainty of equations, computer scientists who build the architectures of the future, philosophy students who question the nature of truth itself, and parents who support us all, often without needing to understand the specific jargon we use to describe our work.

  Our theme this year is scientific prediction. Usually, when we talk about prediction, we talk about accuracy. We ask: Did the model match the data? Was the forecast correct? But today, I want to suggest that before we can ask if a prediction is *correct*, we must first ask what kind of prediction it is. We need to talk about the lens through which we view the system we are studying.

  To do this, I want to borrow a framework that distinguishes between three ways of explaining how things behave. We can call them the Physical Stance, the Design Stance, and the Intentional Stance.

  The Physical Stance looks at the constitution of a thing. It asks: What are the parts? What are the laws of motion? If I know the position and speed of every particle, can I calculate the future? This is the home turf of our physics faculty. It is the realm of literal truth.

  The Design Stance ignores the physical details and looks at function. It asks: What is this thing built to do? A thermostat doesn't need to be understood as a bimetallic strip expanding under heat; it can be understood as a device meant to maintain a temperature. We predict its behavior based on its purpose, not its physics.

  The Intentional Stance goes a step further. It treats the system as if it has beliefs, desires, and goals. We use this when we play chess against a computer. We don't think about the silicon; we think about what the computer *wants* to do to win.

  Usually, these stances are applied to robots or human minds. But today, I want to apply them to something much larger and more urgent: long-range ecological forecasting.

  Consider the climate models we use to predict equilibrium states decades from now. When our physics faculty look at these models through the Physical Stance, they see fluid dynamics. They see thermodynamics. They see the Navier-Stokes equations governing the motion of the atmosphere. In this view, a pattern is something discovered. It is a structural reality inherent in the motion of molecules. If the prediction fails, the physics was wrong.

  However, many of our most useful climate models operate closer to the Design or Intentional Stance. They treat the atmospheric system *as if* it were pursuing a functional goal. We speak of the climate "seeking" equilibrium. We speak of the earth system "wanting" to balance its energy budget. We treat the atmosphere not just as moving gas, but as a system with a teleological direction—a goal it is trying to reach.

  This distinction does real work. It constrains what we can claim about truth. If we adopt the Physical Stance, we claim the pattern is literally there in the wind and the heat. But if we adopt the Design Stance, we admit that the pattern of "equilibrium" is something we impose on the chaos to make it manageable. The atmosphere does not actually *want* anything. It has no goals. But treating it as if it does allows us to make predictions that are instrumentally useful, even if they are not literally true in the same way a law of motion is true.

  This matters because it tells us where the risk lies. If we confuse the Design Stance for the Physical Stance, we might mistake a useful heuristic for a law of nature. We might think we have discovered a destiny for the planet, when we have only constructed a tool for managing it.

  This brings me to where I believe our symposium must end up today: the question of Artificial Intelligence, specifically regarding generated imagery.

  There is a tired debate about whether AI images count as "art." I do not want to have that debate. Instead, I want to ask: Under which stance is the pattern in an AI image genuinely predictable?

  If we take the Physical Stance toward a generative model, there is no image. There are only weights, biases, and matrix multiplications. There is no "face," no "style," and no "lighting." There is only math. In this stance, the output is perfectly predictable, but the pattern we care about—the visual meaning—is invisible.

  If we take the Intentional Stance, we treat the AI as if it understands our prompt. We assume it "knows" what a sunset looks like. We treat the output as a communication. In this stance, the pattern is predictable to us as humans, because we share a world of meaning with the creators of the model. But this predictability is fragile. It relies on us ignoring the math and focusing on the function.

  Why does this matter? Because if we expect the reliability of the Physical Stance from a tool that operates on the Intentional Stance, we will be misled. We cannot demand literal truth from a system designed to mimic function. When we look at an AI-generated image, we are not seeing a photograph of a reality that exists; we are seeing the successful imposition of a design pattern onto a mathematical substrate.

  So, as we move into our sessions today, I invite you to watch for these stances. When a physicist presents a model, ask: Are they describing the machinery, or are they describing the function? When a computer scientist demonstrates an algorithm, ask: Is the pattern they found inherent in the data, or is it a reflection of the goals they programmed into the system?

  We are here to predict the future. But we must remember that the future looks different depending on whether we are looking at it through the lens of matter, the lens of design, or the lens of mind. Our job this weekend is not just to make better predictions, but to understand which stance makes those predictions possible, and what we sacrifice when we choose one over the other.

  Thank you, and welcome to the symposium.
