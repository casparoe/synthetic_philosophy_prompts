answer: |-
  **Take-Home Exam: Moral Uncertainty and Incommensurability**
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Essay Question**

  Youre facing a dilemma where Option A violates a lexical deontological constraint (killing one innocent) to save 1,000 lives, whilst Option B respects the constraint but allows the deaths. You hold 60% credence in the lexical deontology and 40% in cardinal utilitarianism. Standard expected utility theory fails here because you cant multiply probabilities against lexical orderings. Explain how youd construct a decision procedure that navigates this incommensurability without just resorting to maximin or following your most probable theory. You need to show how to weigh the metrics without collapsing them into a single scale.

  **Model Answer**

  The main problem is that lexical values arent cardinal, so you cant just run an expected value calculation across the theories. If the deontological view says killing is infinitely wrong, any credence in it makes Option A infinitely bad, which isnt helpful. Instead, you should look at stochastic dominance to see if one option is preferable across the board without needing direct comparison.

  You could treat the deontological rule as a veto power that only gets overridden if the credence in it falls below a specific threshold of seriousness. This keeps the lexical structure intact whilst still allowing the welfare numbers to matter when the deontological credence is low enough. It acknowledges that the metrics dont match but still forces a choice based on robustness.

  Finally, you must admit that theres a moral remainder regardless of what you pick. Even if you choose Option B, the utilitarian credence means youve allowed harm, and if you choose A, youve violated a right. The procedure shouldnt pretend the incommensurability is solved, just managed well enough to act.

  1. You need to see if they spot why expected utility breaks when mixing lexical and cardinal metrics.
  2. Look for a method like stochastic dominance that doesnt collapse the values into one scale.
  3. They should show how the deontological constraint keeps priority without paralysing the decision.
  4. Dock marks if they just revert to maximin or pick the theory with the highest credence.
  5. Give credit for admitting that a moral remainder persists even after a decision is made.
