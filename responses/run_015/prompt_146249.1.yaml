prompt: |-
  I am a novelist defending a specific thesis at an interdisciplinary symposium on artificial intelligence and literary craft: that prolonged reliance on large language models for plot generation does not merely outsource labor, but erodes the author's capacity to sustain what I term the counterfactual web—the dense, unwritten field of narrative branches a character could have pursued but did not, which I take to be the primary locus of moral weight in fiction. The audience comprises literary scholars who regard authorship as distributed and socially constructed, cognitive psychologists who study expertise degradation, and one philosopher of mind for whom understanding reduces to behavioral fluency; they are skeptical of romantic notions of genius but will take empirical and conceptual claims seriously. I sketch my argument briefly: moral characterization in the novel depends on the reader's sense that alternative actions were genuinely live for the agent, and maintaining that liveliness requires the author to hold a complex, unstable map of rejected possibilities, a cognitive load that model-assisted generation tends to collapse into a single optimized path. Prepare me for the objections I will actually face, ordered by how damaging each is to this specific claim rather than to my broader feelings about technology. For each objection, provide the form in which that audience would phrase it, what I should concede immediately, what I must not concede, the weakest point in my reply, and the single reply that must land for the thesis to survive. Include the one question I hope nobody asks—the objection that forces me to distinguish my claim from a generic defense of human labor against automation. Keep the prep sheet focused; I have fifteen minutes and no slides.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Novelist defending a specific thesis at an interdisciplinary symposium.
      *   **Thesis:** Prolonged reliance on LLMs for plot generation erodes the author's capacity to sustain the "counterfactual web" (the dense field of unwritten narrative branches), which is the primary locus of moral weight in fiction.
      *   **Audience:**
          *   Literary Scholars (view authorship as distributed/socially constructed, skeptical of romantic genius).
          *   Cognitive Psychologists (study expertise degradation, interested in empirical claims).
          *   Philosopher of Mind (understanding = behavioral fluency, functionalist).
      *   **Constraints:** 15 minutes, no slides, focused prep sheet.
      *   **Goal:** Prepare for objections ordered by damage to the *specific claim* (not general feelings about tech).
      *   **Required Elements per Objection:** Audience phrasing, immediate concession, non-negotiable point, weakest point in reply, single reply that must land.
      *   **Special Requirement:** Include the "one question I hope nobody asks" (distinguishing from generic anti-automation labor defense).

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* LLM use $\rightarrow$ Collapse of counterfactual web $\rightarrow$ Loss of moral weight in fiction.
      *   *Mechanism:* LLMs optimize for the "most likely" or "coherent" path, reducing cognitive load on the author to hold rejected possibilities in mind.
      *   *Value:* Moral characterization depends on the *liveliness* of alternative actions.

  3.  **Brainstorm Objections based on Audience Profiles:**

      *   *Literary Scholars:* They hate "romantic genius." They see authorship as collaborative (editors, culture, history). They might argue the "counterfactual web" exists in the reading, not the writing. Or that LLMs are just another tool in the distributed system.
      *   *Cognitive Psychologists:* They care about "expertise degradation" (skill fade). But they might argue that offloading low-level cognition frees up high-level cognition (the "calculator effect"). Is holding the web really a skill that degrades, or is it just a workflow change?
      *   *Philosopher of Mind:* If understanding is behavioral fluency, and the text *reads* as if it has moral weight, does the author's internal state matter? (The "Chinese Room" angle applied to art).

  4.  **Select and Order Objections (by Damage to Specific Claim):**

      *   *Damage Level 1 (Highest): The Functionalist/Behaviorist Objection (Philosopher).* If the text *works* for the reader, the author's cognitive process is irrelevant. This destroys the link between authorial cognition and textual value.
      *   *Damage Level 2 (High): The Distributed Authorship Objection (Literary Scholars).* If authorship is already distributed (editors, agents, culture), the LLM is just another node. The "counterfactual web" isn't solely in the author's head.
      *   *Damage Level 3 (Medium): The Cognitive Offloading Objection (Psychologists).* LLMs handle the trivial, freeing the author to focus *more* on the moral complexities. This reverses the causality of the thesis.
      *   *The "Hope Nobody Asks" Question:* This needs to isolate the "moral weight" claim from a general "human labor is better" claim. It should challenge whether the *reader* can actually detect the difference.

  5.  **Drafting the Content (Iterative Refinement):**

      *   *Objection 1 (Philosopher):* "If the output is indistinguishable, where is the harm?"
          *   *Concede:* Reader experience is paramount.
          *   *Hold:* The *source* of the text determines its status as moral inquiry vs. simulation.
          *   *Landing:* Moral weight requires actual deliberation, not simulated deliberation.
      *   *Objection 2 (Scholars):* "Authorship is already collaborative."
          *   *Concede:* Authors never work in a vacuum.
          *   *Hold:* LLMs differ because they optimize for probability, not friction.
          *   *Landing:* The web requires *resistance*, not just collaboration.
      *   *Objection 3 (Psychologists):* "Offloading frees cognitive resources."
          *   *Concede:* Tools do change cognitive load.
          *   *Hold:* Plot generation *is* the moral reasoning, not a separate task.
          *   *Landing:* You cannot outsource the dilemma without outsourcing the morality.
      *   *The "Killer" Question:* "Can a reader tell the difference?" If they can't, is the moral weight real or just a fetishization of process?

  6.  **Refining for Tone and Constraints:**
      *   Keep it tight. 15 minutes prep means bullet points, not essays.
      *   Ensure the "Specific Claim" focus remains (Counterfactual Web $\rightarrow$ Moral Weight).
      *   Make sure the "Concede/Hold" dynamic is clear.

  7.  **Final Review against Constraints:**
      *   Ordered by damage? Yes.
      *   Audience phrasing included? Yes.
      *   Concede/Hold/Weak Point/Landing Reply included? Yes.
      *   "Hope nobody asks" question included? Yes.
      *   No slides/15 mins context respected (concise).

  8.  **Final Polish:** (Self-Correction during drafting) *Wait, make sure the Philosopher's objection is the most damaging.* If the text is behaviorally fluent, the Philosopher says it *has* understanding. If the text has understanding, it has moral weight. This directly contradicts the thesis that the *author's* capacity is the locus. I need to frame the reply carefully: The moral weight isn't in the text's fluency, but in the text as a *record* of human choice.
      *   *Correction:* Actually, the Distributed Authorship objection might be more damaging to the "author's capacity" part. If the author never held the web alone (editors did), then the LLM doesn't erode anything unique. Let's swap 1 and 2. No, the Philosopher's functionalism undermines the *necessity* of the human mind entirely. That's the existential threat. Keep Philosopher first.
      *   *Wait, the "Hope Nobody Asks" question:* Needs to distinguish from generic labor defense. It should be about the *reader's* access to the web. If the reader can't access the unwritten branches, does the web matter?

      *(Self-Correction on Ordering)*:
      1.  **Philosopher (Functionalist):** If the text behaves morally, it is moral. (Destroys the link between internal process and external value).
      2.  **Scholars (Distributed):** You never held the web alone anyway. (Destroys the "erosion" premise).
      3.  **Psychologists (Offloading):** You're holding the web *better* with AI. (Reverses the mechanism).

      *Let's finalize the "Hope Nobody Asks" question.* It needs to be: "If the counterfactual web is unwritten, how does it exert moral weight on the reader?" This forces the novelist to explain how the *absence* is felt, distinguishing it from "human touch" fetishism.

  9.  **Final Polish of the Output:** Ensure the voice is professional, sharp, and ready for a symposium defense. (Proceed to generate output).

  *(Wait, one last check on the "Weakest Point" requirement)*: I need to be honest about where the argument is fragile. For the Philosopher, the weak point is the "record of choice" idea—it risks being esoteric. For the Scholars, the weak point is defining "resistance." For the Psychologists, the weak point is defining "plot generation" as inseparable from "moral reasoning."

