answer: |-
  **SYMPOSIUM PREP SHEET: THE COUNTERFACTUAL WEB**
  **Time:** 15 Minutes | **Format:** Oral Defense | **Constraints:** No Slides

  ### THESIS CORE
  LLM reliance collapses the **counterfactual web** (the cognitive map of rejected narrative branches). Since moral weight in fiction relies on the *liveliness* of alternatives, outsourcing plot generation erodes the text's moral capacity, regardless of surface fluency.

  ---

  ### OBJECTION 1: The Functionalist Trap (Most Damaging)
  **Audience:** Philosopher of Mind
  **Phrasing:** "If understanding reduces to behavioral fluency, and the LLM-generated text is behaviorally indistinguishable from a human draft regarding moral complexity, on what grounds do you claim the moral weight is absent? Are you positing a magical residue in human-authored text?"

  *   **Concede Immediately:** I concede that if the text is indistinguishable, the *reader's immediate experience* of moral tension may remain intact. I am not arguing for a "ghost in the machine."
  *   **Do Not Concede:** Do not concede that moral weight is solely a property of the finished object. It is also a property of the *transaction*.
  *   **Weakest Point in Your Reply:** Arguing that the text is a "record" of choice risks sounding like a provenance fetish (like valuing a hand-painted forgery less than an original).
  *   **The Reply That Must Land:** "Moral weight in fiction is not just the simulation of choice; it is an invitation to the reader to witness *deliberation*. An LLM simulates the *result* of deliberation without the cost. If the author did not endure the friction of the counterfactual web, the text offers a map without the terrain. The reader senses the absence of risk, and without risk, there is no morality."

  ### OBJECTION 2: The Distributed Authorship Critique
  **Audience:** Literary Scholars
  **Phrasing:** "You romanticize the solitary author. Authorship has always been distributed—editors, agents, cultural norms prune the counterfactual web. Why is an LLM qualitatively different from a heavy-handed editor collapsing branches for marketability?"

  *   **Concede Immediately:** I concede the "romantic genius" model is false. Authors have always relied on external friction to shape the web.
  *   **Do Not Concede:** Do not concede that all friction is equal. Human friction is normative; algorithmic friction is probabilistic.
  *   **Weakest Point in Your Reply:** Distinguishing "normative" from "probabilistic" can sound abstract. You need to make it concrete.
  *   **The Reply That Must Land:** "An editor rejects a branch because it violates a human norm or truth claim, forcing the author to defend the moral logic. An LLM rejects a branch because it is statistically unlikely. One forces moral justification; the other forces statistical convergence. The web collapses not because of collaboration, but because the *criteria for rejection* shifts from ethical coherence to predictive likelihood."

  ### OBJECTION 3: The Cognitive Offloading Argument
  **Audience:** Cognitive Psychologists
  **Phrasing:** "Expertise research shows offloading low-level tasks frees working memory for high-level reasoning. Why couldn't LLM plot generation free the author to focus *more* intensely on the moral nuances of the remaining branches?"

  *   **Concede Immediately:** I concede that tools generally alter cognitive load and can enhance high-level focus (the 'calculator effect').
  *   **Do Not Concede:** Do not concede that plot generation is a "low-level task."
  *   **Weakest Point in Your Reply:** Claiming plot is "high level" might seem like gatekeeping. Some plotting is mechanical.
  *   **The Reply That Must Land:** "In moral fiction, plotting *is* the reasoning. You cannot separate the 'what happens' from the 'why it matters.' By offloading the generation of alternatives, you offload the simulation of agency itself. You aren't freeing up memory for moral reasoning; you are outsourcing the very mechanism by which moral reasoning occurs."

  ---

  ### THE QUESTION I HOPE NOBODY ASKS
  **The Objection:** "If the counterfactual web is, by your definition, *unwritten*, by what mechanism does it transmit moral weight to the reader? If the reader cannot access the rejected branches, isn't your defense merely a private virtue signal for the author, irrelevant to the public work of art?"

  *   **Why this is fatal:** It separates your thesis (authorial cognition) from the evidence (the text). It forces you to admit that if the reader can't tell, the "moral weight" might be a solipsistic fantasy, reducing your argument to a generic defense of human labor ("sweat equity") rather than a specific claim about narrative mechanics.
  *   **How to deflect (if asked):** "The unwritten web shapes the *texture* of the written path. A choice made easily reads differently than a choice made painfully. The reader feels the resistance in the prose's certainty. However, I must admit: if the simulation becomes perfect, the distinction moves from the text to the *culture* of authorship. We value the art because we value the human struggle, not just the output." (This is your safe retreat: shift from textual mechanics to cultural value).

  ---

  ### STRATEGIC REMINDERS
  1.  **Don't defend "Genius":** Keep the focus on *cognitive process*, not talent.
  2.  **Define "Web" Early:** Ensure they understand the "counterfactual web" is the *active maintenance* of alternatives, not just the final choice.
  3.  **The Stakes:** This isn't about quality; it's about *category*. LLM fiction isn't "bad" fiction; it is a different category of object (simulation vs. record).
