  ### What the practice strictly presupposes

  Digital preservation strictly presupposes a causal asymmetry: causes must precede effects, and records must precede retrieval. It requires that the state of a system at $t_1$ constrains the state at $t_2$, but not vice versa. Operationally, this means information degradation is treated as irreversible within the system's lifespan. The archive assumes it can access past states (backups) but not future ones, implying a fixed past and an open future. It does not strictly demand a fundamental thermodynamic arrow or a low-entropy Big Bang. It only requires that, locally and statistically, entropy increase is overwhelming enough to make bit-rot unidirectional for practical purposes. Crucially, it assumes past states leave independent traces—copies, logs, hashes—while future states leave none. This trace asymmetry enables repair from yesterday but never from tomorrow. Furthermore, the "recipe" approach presupposes that logical identity is timeless; regenerating a file yields the *same* object because mathematical relationships do not decay, even if physical substrates do. Ultimately, the practice needs only an asymmetry of access and stability, not a metaphysical verdict on time's nature. It assumes the future cannot influence the past, but remains agnostic on why. The system works so long as the past is recoverable and the future is uncertain.

  ### What it merely fits well with

  While the practice functions on minimal causal assumptions, it fits exceptionally well with the standard thermodynamic arrow of time. The narrative of decaying media and fading signals mirrors the universe's march toward higher entropy. Preservation efforts align with the cosmological story of a low-entropy past enabling complex structures like hard drives and servers. However, this fit is compatible rather than constitutive. The archive would operate identically in a universe where time's arrow is merely statistical or local, provided the statistics hold over the preservation window. The practice doesn't prove the thermodynamic arrow; it merely exploits it. It relies on the fact that disorder is statistically more likely than order, but it remains agnostic about whether this tendency is a fundamental law or a contingent boundary condition of our specific cosmic epoch. Consequently, archivists act as local entropy fighters. It really fits the standard physics, but doesn't require any deep philosophy.

  ### Traces vs. entropy

  The asymmetry of traces is not distinct from the entropy story; it is information theory's expression of thermodynamics. A "trace" is a low-entropy correlation between a recording medium and an event. When a file rots, these correlations decay into noise, increasing entropy. The reason past states leave independent traces while future states do not is precisely because the past possessed the lower entropy necessary to imprint order onto media. You cannot maintain stable traces without an entropy gradient to sustain them against thermal noise. Therefore, the archive's reliance on multiple copies (traces) is a direct bet on thermodynamic history. The inability to "pre-repair" from future copies is simply the inability to reverse entropy locally without expending energy. Trace asymmetry and entropy are the same fact described in different registers: physical disorder versus informational loss. They are not competing explanations, but layered descriptions of the same irreversible process in our universe.

  ### Bits vs. recipe

  The split between preserving "bits" and preserving "recipes" reveals divergent assumptions about time's grip on identity. The "bits" strategy respects the thermodynamic arrow by fighting it, migrating data to fresh low-entropy media before decay sets in. It treats preservation as a physical relay race through time. The "recipe" strategy, conversely, assumes a form of logical timelessness. It presupposes that the algorithm and inputs define an identity existing outside time's flow. Regenerating a file isn't copying; it's re-instantiating a timeless truth. This approach quietly assumes the arrow of time affects only the substrate, not the logic. If the arrow is perspectival, the recipe strategy is more robust, betting on invariant laws rather than decaying matter. It suggests preservation is about saving the seed, not the flower. The recipe people assume the result is identical because the math doesn't age, even if the machine does. This distinction always matters when physics fails.

  ### What I can safely say in print

  You can safely state that digital preservation relies on the causal asymmetry of memory, not the fundamental nature of time. It requires that records precede retrieval, regardless of why. You don't need to commit to a specific cosmological model. The practice is underdetermined by physics; it works whether time's arrow is fundamental or emergent. Focus on the human experience of irreversibility: we remember past backups, not future ones. That phenomenological arrow is sufficient ground for your piece. Your readers care about saving data, not solving quantum gravity. Stick to the operational reality. The archive works because the past is fixed, whatever the universe says.
