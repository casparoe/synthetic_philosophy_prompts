  2.  **Deconstruct the Strategy-Stealing Argument (SSA):**
      *   *What is it?* A non-constructive existence proof used in combinatorial game theory.
      *   *Core Logic:*
          1.  Assume the game is symmetric (available moves are the same for both) and having an extra move is never a disadvantage (monotonicity).
          2.  Assume for contradiction that Player 2 (P2) has a winning strategy.
          3.  Player 1 (P1) makes an arbitrary first move.
          4.  P1 then "steals" P2's assumed winning strategy, pretending to be P2.
          5.  If the strategy ever calls for playing on the square P1 already occupied, P1 makes another arbitrary move.
          6.  Since an extra move is never bad, P1 wins.
          7.  Contradiction: P2 cannot have a winning strategy.
          8.  Conclusion: In a game without draws, P1 must have a winning strategy.
      *   *Key Dependencies:*
          *   Finite game.
          *   Perfect information.
          *   No chance.
          *   Symmetry (available moves don't depend on *who* is playing, just the board state).
          *   Monotonicity (extra pieces/moves are never harmful).
          *   No Draws (Zermelo's Theorem context).
          *   Non-constructive nature (we know *that* P1 wins, not *how*).

