      *   *The "Extra Move" Problem:* In some games, having an extra piece blocks a necessary line (e.g., Go, or specific mazes). SSA fails if monotonicity doesn't hold.
      *   *The "Mirror" Confusion:* People think P1 copies P2. Actually, P1 pretends to be P2 using P2's strategy.
      *   *The "Chess" Fallacy:* SSA doesn't apply to Chess because of draws and lack of monotonicity (Zugzwang).
      *   *The "Constructive" Expectation:* Audience wants to know *what* the winning move is. SSA doesn't tell them.
      *   *The "Draw" Loophole:* If draws are possible, the conclusion weakens to "P2 cannot have a forced win" (P1 might only force a draw).
