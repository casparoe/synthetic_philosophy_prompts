answer: |-
  ### Private Brainstorming: The Structural Gap

  Before I give you the tool, here is the landscape as I see it from the intersection of philosophy and econometrics. You are asking for a bridge between two worlds that do not want to be connected.

  In a randomized experiment, the causal verb is earned by the *design*. The treatment is assigned by a mechanism (the randomizer) that is, by definition, orthogonal to the potential outcomes. The philosopher says: "The counterfactual is constructed." The econometrician says: "Selection bias is zero in expectation." You can write "causes."

  In historical development economics, the causal verb is earned by an *argument*. The treatment was assigned by history, which is messy, endogenous, and bundled. The philosopher says: "The counterfactual is imagined." The econometrician says: "Selection bias is zero *conditional on assumptions A, B, and C*."

  The structural differences that break your workflow are three:
  1.  **The N Problem:** In cross-country work, N is roughly 100. You cannot control for everything. Every regression is a specification search. In experiments, N is individuals; you can absorb noise. In history, the noise *is* the signal.
  2.  **The Bundle Problem:** In history, treatments come in packages. Colonialism brought courts, but also roads, and also disease, and also language. To say "Courts caused Growth" is to assert you can surgically remove the roads and disease from the historical record while leaving the courts. The data rarely permits this.
  3.  **The Mechanism/Identification Gap:** You can identify a causal effect of $X$ on $Y$ without knowing *why*. If a border causes a income jump, it could be taxes, it could be norms, it could be policing. The regression coefficient is blind to the story. Most press releases conflate the *identification of the gap* with the *identification of the story*.

  Your job is to spot when the authors have smuggled a story into an identification strategy that only supports a correlation.

  ***

  ### The 15-Minute Causal Triage Procedure

  Keep this on your desk. Run it linearly. If you hit a "STOP," you have your headline.

  **Step 1: The Variation Audit (Real Test)**
  *   **Question:** What is the source of exogenous variation? Is it (A) Randomized, (B) A sharp discontinuity (RDD), (C) An Instrument (IV), or (D) Cross-sectional correlation with controls?
  *   **Sufficient Answer:** If (D), stop. You cannot write "causes." You must write "predicts" or "is associated with."
  *   **Judgment Call:** If (B) or (C), proceed. If (A), you are in RCT land (rare for this topic), write "causes."
  *   **Why:** Controls cannot fix omitted variable bias in N=100 settings. Only exogenous shocks can.

  **Step 2: The Label Permutation (The Sharpened Swap Test)**
  *   **Question:** Look at the variation identified in Step 1. If I keep the *exact same* data and design but rename the independent variable to a competing theory, does the story still hold?
      *   *Example:* If the variation is "Settler Mortality," the authors say this proxies "Institutions." Can I say it proxies "Disease Environment" or "Human Capital Investment"?
  *   **Sufficient Answer:** If the design cannot statistically distinguish between the authors' label and a rival label, you must downgrade the claim.
  *   **The Rule:** If the variation is historical and bundled, the causal claim applies to the *bundle*, not the specific mechanism.
  *   **Why:** This is your Swap Test, sharpened. It is not about whether the swap is plausible; it is about whether the *data* contains information to rule the swap out. If the likelihood function is flat across both theories, the data is silent on the distinction.

  **Step 3: The Exclusion Check (Judgment Call Dressed as Test)**
  *   **Question:** (For IV or RDD) Is there a plausible path from the instrument/boundary to the outcome that *bypasses* the proposed mechanism?
  *   **Sufficient Answer:** If you can sketch a rival path in 30 seconds that the authors do not explicitly test (e.g., "The border also splits an ethnic group," "The instrument also affects climate"), you must qualify the headline.
  *   **Why:** Exclusion restrictions are never testable. They are assertions of faith. Your job is to assess the cost of that faith.

  **Step 4: The Persistence vs. Mechanism Stop**
  *   **Question:** Does the study measure the mechanism directly, or does it measure the historical shock and assume the mechanism persists?
  *   **Sufficient Answer:** If they measure the shock (e.g., "Missionary presence in 1900") and the outcome ("GDP in 2000") but only have survey data for the mechanism ("Trust in 2000"), the causal chain is broken.
  *   **Verdict:** You can claim "Historical Shock X causes Outcome Y." You cannot claim "Mechanism M is the driver."

  ***

  ### Engagement with Your Heuristic: The Swap Test

  **Verdict:** Keep it, but rename it the **Label Permutation Test** and tighten the criteria.

  **Why:** Your intuition is correct: if the design is invariant to the theoretical label, the label is not identified by the design. However, your original formulation risks being too easy to satisfy. A clever author can always construct a straw-man swap.
  **The Sharpening:** Do not ask "Can I imagine a swap?" Ask "Does the *identifying variation* contain information that discriminates between the two?"
  *   *Weak Swap:* "Maybe it's culture, not institutions." (Too vague).
  *   *Strong Swap:* "The instrument is distance from the coast. Authors say this measures trade access (Institutions). I say this measures mosquito load (Geography). Both vary with distance from coast."
  *   *Result:* If the variation is purely geographic distance, the data cannot tell you if it's mosquitoes or merchants. The claim must be about "Coastal Proximity," not the mechanism.

  ***

  ### Running the Procedure on Your Three Cases

  #### Case 1: Cross-Country Institutions (The Classic)
  *   **Design:** Cross-country regression, IV (Settler Mortality).
  *   **Step 1 (Variation):** IV. Pass.
  *   **Step 2 (Label Permutation):** Authors claim Mortality $\to$ Institutions $\to$ Income.
      *   *Swap:* Mortality $\to$ Human Capital/Health Investment $\to$ Income.
      *   *Analysis:* Settler mortality determined who stayed. Those who stayed built societies. Did they build "extractive institutions" or did they just build *people*? High mortality areas got fewer Europeans, less education, worse health infrastructure. These are bundled. The IV isolates the "Colonial Package," not specifically "Property Rights."
  *   **Step 3 (Exclusion):** Does mortality affect income today other than through institutions? Yes, via disease burden and population composition.
  *   **Verdict:** **Downgrade.**
  *   **Headline:** "Colonial Conditions Persist," not "Institutions Cause Prosperity."
  *   **Sentence:** "Historical conditions that shaped early settlement patterns continue to track economic outcomes today, though the specific channel—whether rules or human capital—remains entangled."

  #### Case 2: The Monastic Boundary (The RDD)
  *   **Design:** Regression Discontinuity (River boundary, Medieval tenure).
  *   **Step 1 (Variation):** RDD. Pass (Strong local identification).
  *   **Step 2 (Label Permutation):** Authors claim "Communal Tenure" $\to$ "Social Capital" $\to$ "Income."
      *   *Swap:* "Monastic Administration" $\to$ "Infrastructure/Stability" $\to$ "Income."
      *   *Analysis:* Monasteries didn't just set tenure rules; they built roads, stored grain, and provided legal arbitration. The boundary separates "Monastic Land" from "Feudal Land." Is it the *tenure* or the *monk*?
  *   **Step 3 (Exclusion):** The placebo test (40km away) helps, but doesn't rule out that the river itself is special (trade route).
  *   **Verdict:** **Partial Pass.**
  *   **Headline:** "Medieval Land Systems Have Long Shadows."
  *   **Sentence:** "A sharp discontinuity in wealth exists at the historical boundary of monastic lands, suggesting that medieval administrative systems imprint persistent economic advantages, though the specific role of tenure rules versus broader monastic investment cannot be disentangled."
  *   **Note:** This is a stronger design than Case 1, but the mechanism is still a "black box."

  #### Case 3: Your Culture/Religion Piece (The Hard One)
  *   **Design:** Religious Border + Survey Data (Trust/Patience).
  *   **Step 1 (Variation):** Border Design (Quasi-experimental). Pass.
  *   **Step 2 (Label Permutation):** Authors claim "Religion" $\to$ "Culture (Trust)" $\to$ "Development."
      *   *Swap:* "Religion" $\to$ "Network Access" $\to$ "Development."
      *   *Analysis:* Religious borders often coincide with ethnic borders, language borders, and political jurisdictions. If the border is Protestant/Catholic, it is also likely German/French or Prussian/Austrian.
      *   *Crucial Failure:* You are using survey measures of trust *today* to explain income *today*, instrumented by a border *then*. This is not a causal chain; it is a correlation of contemporaneous variables linked by history.
  *   **Step 3 (Exclusion):** Does the border affect income only through culture? No. It affects tax systems, school systems, and legal codes.
  *   **Verdict:** **Stop. Do not write "Culture Causes."**
  *   **Headline:** "Religious History Predicts Modern Norms and Wealth."
  *   **Sentence:** "Historical religious boundaries align with modern differences in trust and income, indicating a persistent cultural complex, though the data cannot separate theological inheritance from the institutional and network advantages that accompanied religious affiliation."
  *   **Advice for your Feature:** You can still write the 2,000 words. But you must frame it as a mystery of *persistence*, not a proof of *mechanism*. The story is not "Protestants are richer because they trust." The story is "History sticks, and when it sticks, it looks like culture." That is a more profound, if less punchy, philosophical claim. It saves your piece from being debunked in six months.

  ***

  ### What This Procedure Cannot Do

  You asked for the limits. Here they are.

  **1. Equifinality and Conjunctural Causation**
  This procedure is designed to protect you from false positives (claiming X causes Y when it's actually Z). It is not designed to handle the truth that X, Y, and Z are all real and mutually reinforcing.
  *   *The Problem:* Institutions require culture to function; culture requires institutions to stabilize. They co-evolve.
  *   *The Limit:* The procedure will force you to downgrade the claim to "Persistent Bundle." It cannot tell you *how* the bundle works. It treats interaction as noise, when in development, interaction is often the signal.
  *   *The Deferral:* When you hit the "Bundle" stop, you are deferring the question of *composition* to theory and history, which econometrics cannot answer. You must acknowledge that the "cause" is likely a system, not a variable.

  **2. The Truth of the Mechanism**
  The procedure can tell you when a mechanism is *unidentified*, but it cannot tell you when a mechanism is *false*.
  *   *The Problem:* You might run the Label Permutation and find that "Culture" and "Institutions" are indistinguishable.
  *   *The Limit:* It is possible that Culture is the true driver and Institutions are just the shell. It is possible the reverse is true. The procedure forces you to admit ignorance, not to find the truth.
  *   *The Deferral:* This hands the question back to you as a matter of narrative judgment. You must choose the story that best fits the broader historical record, knowing the regression table does not mandate it.

  **3. The "Zero Effect" Null**
  *   *The Problem:* Sometimes the result is null.
  *   *The Limit:* In historical data, a null result often means "The effect faded" or "The measure is wrong," not "No relationship exists."
  *   *The Deferral:* This procedure assumes a positive finding. If the study finds nothing, you need a different heuristic for "Why did history leave no trace?"

  **Final Instruction:**
  When you sit down to write, use the procedure to strip the authors' claims of their hubris. Your value to the reader is not repeating the press release, but telling them exactly how much of the black box remains black. If you do that, you can write the causal verb where it belongs, and the conditional verb where it must, without losing your integrity or your deadline.
