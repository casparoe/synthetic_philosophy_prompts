      *   **Input:** Three types of studies (Institutions, Geography, Culture).
      *   **Specific Requirements:**
          *   Brainstorm privately first about structural differences between historical causal inference and experiments (N size, treatment assignment, entanglement, mechanism vs. identification).
          *   Create a usable decision procedure (questions, order, stopping rules, judgment calls vs. tests).
          *   Engage with the user's "Swap Test" heuristic (keep, sharpen, or replace).
          *   Apply the procedure to three specific cases (Cross-country institutions, Medieval monastic boundary, User's own culture/religion piece).
          *   Conclude with limitations (what the procedure *can't* do, specifically regarding multiple/equifinal mechanisms).
          *   Tone: Professional, blunt, usable under deadline, no citations/reading lists.

  2.  **Private Brainstorming (Structural Differences):**
      *   *Experiments (RCTs):* Treatment is assigned by researcher (randomization). N is often large (individuals). Mechanism is usually secondary to the Intent-to-Treat (ITT). Counterfactual is constructed by design.
      *   *Historical/Observational (Development Econ):* Treatment is "happened" (history). N is small (countries/regions). Treatment is often bundled (institutions *are* geography *are* culture). Counterfactual is constructed by assumption (exclusion restriction).
      *   *The "Small N" Problem:* In cross-country work, you have ~100 observations. You can't control for everything. Omitted variable bias is the default state.
      *   *The "Entanglement" Problem:* Acemoglu/Robinson (Institutions) vs. Sachs (Geography). Colonialists settled where disease was low (Geography) -> set up good institutions (Institutions) -> Rich today. Which is the cause? The instrument (settler mortality) tries to untangle this, but does it really?
      *   *The "Mechanism" Problem:* A study might identify a causal effect of $X$ on $Y$, but the *story* about *why* (the mechanism) might be wrong. E.g., Protestantism correlates with growth. Is it theology (Culture)? Or is it literacy required to read the Bible (Human Capital)? The regression looks the same.
      *   *The "Persistence" Problem:* History is path-dependent. A shock 500 years ago persists. Is it the specific institution or just the fact that *something* stuck?
      *   *Key Insight:* In experiments, identification validates the causal verb. In history, identification validates the *variation*, but the *label* attached to that variation is often theoretical, not empirical.

  3.  **Developing the Decision Procedure:**
      *   Need a flowchart-like structure but in text.
      *   Needs to be fast (15 mins).
      *   Needs to address the "Swap Test."
      *   *Step 1: The Variation Check.* Is there actual exogenous variation, or just cross-sectional correlation? (IV, RDD, Diff-in-Diff vs. OLS).
      *   *Step 2: The Bundle Check (The Sharpened Swap Test).* Can I swap the label? If the variation is historical, does it carry only one meaning?
      *   *Step 3: The Exclusion Check.* Does the instrument/boundary affect the outcome *only* through the proposed channel?
      *   *Step 4: The Stopping Rule.* When to downgrade from "Causes" to "Predicts" or "Tracks."
      *   *Refining the Swap Test:* The user's version is good. I should sharpen it. Call it the "Label Invariance Test." If the statistical design survives a change in theoretical labeling, the statistics don't justify the specific label.

  4.  **Applying to Case Studies:**
      *   *Case 1 (Cross-Country Institutions):* Classic Acemoglu/Johnson/Robinson (AJR) style.
          *   Variation: Settler mortality (IV).
          *   Swap Test: High mortality -> Few settlers -> Bad extractive institutions. But also High mortality -> Low human capital investment -> Bad health today. Can we swap "Institutions" for "Human Capital/Health"? Yes.
          *   Verdict: Downgrade. "Institutions track prosperity," or "Colonial conditions persist."
      *   *Case 2 (Monastic Boundary/RDD):* Within-country, sharp cutoff.
          *   Variation: Geographic discontinuity (River/Boundary).
          *   Swap Test: Monastic land tenure. Communal vs. Private. But Monasteries also brought roads, literacy, stability. Is it "Tenure" or "Infrastructure"?
          *   Strength: RDD is strong locally. Weakness: External validity.
          *   Verdict: Causal claim holds *locally* for the "Monastic Package," specific mechanism (tenure) is shaky.
      *   *Case 3 (User's Culture/Religion Piece):* The hard one.
          *   Variation: Religious border.
          *   Swap Test: Religion -> Trust/Patience. But Religion -> Networks -> Credit access. Religion -> Education.
          *   Honesty: Survey measures of "trust" are often post-treatment or correlated with current wealth.
          *   Verdict: Kill the strong causal claim. It's a "Persistent Cultural Complex."

  5.  **Addressing Limitations:**
      *   Equifinality (many paths to same outcome).
      *   Conjunctural Causation (mechanisms reinforce each other).
      *   The procedure identifies *identification failure*, not *theoretical falsehood*.

  6.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Wearied but sharp. Like a senior colleague reviewing a draft over coffee.
      *   *Structure:*
          1.  Private Brainstorming (as requested, distinct section).
          2.  The Procedure (The "15-Minute Causal Triage").
          3.  The Swap Test (Refinement).
          4.  Case Applications.
          5.  Limitations.
      *   *Constraint Check:* No citations. No reading list. Usable format.

  7.  **Refining the "Swap Test":**
      *   User's definition: If I can swap the mechanism and the design holds, the claim is only about "persistence."
      *   My refinement: Make it about *Informational Content*. Does the data contain enough information to distinguish between Theory A and Theory B? If the likelihood function is flat across A and B, you can't choose A.
      *   Actionable name: "The Label Permutation."

  8.  **Final Polish:**
      *   Ensure the distinction between "Judgment Call" and "Real Test" is explicit in the procedure.
      *   Make sure the advice on Case 3 is blunt but constructive (don't kill the story, shrink the claim).
      *   Ensure the conclusion addresses the "mutually reinforcing" aspect.

  *(Self-Correction during drafting)*: I initially thought about telling them to look at standard errors. No, they said they can eyeball robustness but not re-run. Focus on the *research design* logic, not the statistical output. The stats are secondary to the identification strategy in this context.
  *(Self-Correction on Case 3)*: I need to be careful not to be too destructive. The user wants to write the piece. I should tell them how to write it *honestly* rather than telling them to bin it. Frame it as "Mechanism Ambiguity" rather than "Falsehood."

  9.  **Final Review against constraints:**
      *   Brainstorming section included? Yes.
      *   Decision procedure usable? Yes.
      *   Swap Test engaged? Yes.
      *   Three cases run? Yes.
      *   Limitations section? Yes.
