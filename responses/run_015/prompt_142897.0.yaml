      *Actually, the strongest pushback is on the "Veto" symmetry.* Rorschach isn't a veto player in the game-theoretic sense. He has no power to stop the explosion. He only has the power to reveal. That's not a veto; that's a leak. A veto stops the action. A leak changes the payoff matrix post-action. I should tell them they are wrong about the symmetry.

      *Decision:* I will tell them they are wrong about the **Veto Symmetry (Point 2)**. Rorschach cannot veto. He can only witness. The asymmetry is absolute, not structural.

      *Wait, looking at Point 1 again.* The user asks if Veidt slides off the edge. I should say yes.
