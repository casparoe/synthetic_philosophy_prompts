      *   **Topic:** *Watchmen* (graphic novel preferred, but film acknowledged). Specifically, analyzing Ozymandias (Veidt) through the lens of the "Unilateralist's Curse" (Bostrom et al.) rather than standard Utilitarianism.
      *   **Goal:** Avoid boring students with "is Veidt a utilitarian?" and instead use the unilateralist framework to critique decision-making under uncertainty.
      *   **Constraints:**
          *   Fix/validate the statement of the Unilateralist's Curse.
