      *Idea:* The Unilateralist's Curse is about *accidental* harm due to overconfidence. Veidt intends the harm. The Curse is about *risk*. Veidt is about *sacrifice*. The model doesn't account for intentional atrocity as a means to an end. It assumes the agent thinks they are saving everyone *without* the cost, or miscalculates the cost. Veidt knows the cost. He accepts it. The Curse is about *error*. Veidt is about *calculation*.
