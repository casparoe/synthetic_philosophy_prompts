answer: |-
  You have put your finger on a genuine and significant fault line in the literature, though you are correct that it often lacks a single, canonical proper name. You are distinguishing between what we might call **Counterfactual Override** (your Type 1) and **Counterfactual Manipulation** (your Type 2).

  While there isn't one universally accepted label (like "The Humean Distinction"), this split maps onto several existing debates regarding **bypassing**, **manipulation**, and **sourcehood**. Here is a breakdown of how the literature handles this, the terminology available, and the arguments regarding why the distinction matters for the Principle of Alternative Possibilities (PAP).

  ### 1. Terminology: How the Literature Labels This

  The distinction you've identified is usually discussed under one of three headings:

  **A. Bypassing vs. Manipulation**
  *   **Type 1 (Override):** Often described as a **Bypassing** case. The counterfactual intervener bypasses the agent's psychological states (reasons, deliberation) and directly causes the bodily movement.
  *   **Type 2 (Deliberation-Shaping):** Often described as a **Manipulation** case. The counterfactual intervener ensures the outcome by manipulating the agent's psychological inputs so the agent *generates* the action themselves.
  *   *Note:* While "Manipulation" is the standard term for Type 2, "Manipulation Arguments" (like Derk Pereboom's Four-Case Argument) are often treated as a separate category from Frankfurt-style cases (FSCs). However, your observation correctly notes that Type 2 FSCs *are* a species of manipulation case embedded in a Frankfurt structure.

  **B. Interventionist vs. Predetermination Cases**
  *   Some philosophers (e.g., David Hunt, Kadri Vihvelin) distinguish between cases where the mechanism waits for a **sign** (Interventionist) versus cases where the setup ensures the **causal history** is fixed (Predetermination).
  *   Your Type 2 leans toward **Predetermination**. If the mechanism would have supplied the reasons, it implies the reasons were causally necessitated by the setup, even if the mechanism didn't fire.

  **C. The "Dilemma Defense" Terminology**
  *   Incompatibilists like **Carl Ginet** and **David Widerker** argue that for a Frankfurt case to work, the intervener must know *when* to intervene.
  *   If they rely on a prior sign (e.g., a neural blip indicating wavering), Ginet argues this presupposes determinism (making it a Type 2 case).
  *   If they don't rely on a prior sign, Widerker argues the agent retains a "flicker of freedom" (making it a Type 1 case where PAP isn't truly violated).
  *   In this context, your distinction is often framed as **"Sign-Based" vs. "Non-Sign-Based"** cases, though your focus on the *mode* of intervention (override vs. reasoning) is more specific.

  ### 2. The "Causal Idle" Worry: Sourcehood vs. Leeway

  Your insight that in Type 2 cases the agent's reasons might be "causally idle" is the crux of the **Sourcehood** objection.

  *   **In Type 1 (Override):** In the actual sequence, the agent's reasons *do* the work. The backup is a "counterfactual blocker." Compatibilists (like **John Martin Fischer**) argue this is sufficient for responsibility because the *actual sequence* is uncompromised. The agent is the source of the action in the world that actually exists.
  *   **In Type 2 (Manipulation):** You argue the reasons are "causally idle." Philosophically, this is a worry about **Causal Screening Off** or **Preemption**. If the mechanism *guarantees* the reasons would have been there, does the presence of the mechanism imply that the actual reasons were not truly *up to the agent*?

  **Has anyone argued this distinction defeats PAP challenges?**
  Yes. This is essentially the **Incompatibilist "Dilemma Defense."**

  1.  **Carl Ginet:** Argues that for the counterfactual intervener to be certain the agent will choose X (without intervening), there must be a causally sufficient condition for X already present. If so, the agent is determined. If the case is Type 2 (manipulating reasons to ensure the outcome), it collapses into a standard determinism case, which incompatibilists already reject. It doesn't isolate PAP from Determinism.
  2.  **Robert Kane:** Argues that Type 2 cases fail to establish responsibility because they violate **Ultimate Sourcehood**. Even if the agent acts on their own reasons in the actual sequence, if those reasons were guaranteed by a setup that *would have* manufactured them, the agent is not the *ultimate* creator of those reasons.
  3.  **Alfred Mele:** In his work on manipulation (e.g., *Free Will and Luck*), Mele argues that Type 2 cases invite the intuition that the agent is a "puppet" even in the actual sequence, because the *history* of the reasons is compromised. He suggests Type 1 cases are more robust for compatibilists because the history of the actual sequence is untouched.

  ### 3. Why the Literature Runs Them Together

  The literature often conflates them because of **John Martin Fischer's "Actual Sequence" Compatibilism**.

  Fischer argues that moral responsibility depends *only* on the actual sequence of events. Whether the backup mechanism *would have* overridden you (Type 1) or *would have* manipulated your reasoning (Type 2) is irrelevant, because in the actual world, **neither happened.**

  For Fischer, your distinction is metaphysically interesting but morally irrelevant. As long as the agent acts on their own reasons in the actual sequence (which is true in both your types, strictly speaking), they are responsible. The "causal idle" worry is dismissed by Fischer as a confusion about counterfactuals: the mechanism *didn't* supply the reasons, so the reasons *were* causally efficacious.

  However, **Source Incompatibilists** (like Pereboom or Kane) agree with you: the distinction matters. They argue that Type 2 cases reveal that the agent lacks the right kind of **history** or **sourcehood**, even if the actual sequence looks free.

  ### 4. Proposed Naming

  Since there is no single canonical name, if you were to write on this, you might adopt or adapt one of the following:

  *   **The Bypassing/Manipulation Distinction:** (Most recognizable).
  *   **External vs. Internal Counterfactuals:** (Highlights whether the mechanism acts on the body or the mind).
  *   **The Mechanism Mode Distinction:** (Neutral and descriptive).
  *   **Override vs. Shaping Cases:** (Captures the dynamic you described).

  ### Summary of the Argumentative Landscape

  *   **Compatibilists (Fischer, Frankfurt):** The distinction doesn't matter. In both cases, the actual sequence is agent-controlled. PAP is false in both.
  *   **Leeway Incompatibilists (Ginet, Widerker):** Type 1 fails because it leaves a "flicker" of freedom (PAP isn't violated). Type 2 fails because it presupposes determinism (begging the question).
  *   **Source Incompatibilists (Pereboom, Kane):** Type 1 might work to show PAP is false, but Type 2 shows that even without PAP, the agent lacks **Sourcehood**. Your intuition that the reasons are "causally idle" in Type 2 aligns with the view that the *guarantee* of the reasons undermines their status as the agent's own.

  **Recommendation:** You are identifying a version of the **"Manipulation Argument" within Frankfurt Cases.** The specific worry that the reasons are "causally idle" because they *would have* been supplied is a variation of the **"Screening Off" objection**. You will find the most traction by looking at **Alfred Mele's** work on manipulation and **Carl Ginet's** critiques of Frankfurt cases regarding prior signs.

  If you need a label for your writing, **"Override vs. Manipulation Frankfurt Cases"** is the clearest way to signal this distinction to experts.
