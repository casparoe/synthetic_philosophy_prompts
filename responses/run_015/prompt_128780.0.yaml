answer: |-
  Your roommate's argument is sharp, but it relies on a specific equivocation that trips up almost everyone when they first encounter perdurantism. She is conflating **ontological parity** (all times exist) with **ontological independence** (all parts exist separately).

  Here is the conceptual fix you need to untangle the knot. There are three specific slips in her reasoning, followed by the perdurantist's actual binding mechanism.

  ### 1. The Slip: Confusing "Worm Theory" with "Stage Theory"
  Your roommate claims that if every slice is equally real, then "me-now" and "me-at-twenty" are **different people**. This is the definition of **Stage Theory**, not Perdurantism (often called **Worm Theory**).

  *   **Stage Theory:** The word "I" refers *only* to the momentary temporal slice. The past slice is a different entity.
  *   **Perdurantism (Worm Theory):** The word "I" refers to the **entire spacetime worm**.

  **The Fix:** For the perdurantist, "me-now" is not a person. It is a *part* of a person, just like "my hand" is a part of a person. You wouldn't say your hand is a "different person" than you, even though it is spatially distinct from your foot. Similarly, "me-at-twenty" is not a different person; it is a *temporal part* of the same whole entity that extends through time.

  The roommate's claim that they are "different people" assumes that personhood must be located at a single time. Perdurantists deny this. Personhood is a 4D property.

  ### 2. The Slip: Equating "Distinct Parts" with "Arbitrary Collection"
  She argues that because the parts are distinct, calling the stack "one person" is just a conventional label (like calling a random pile of trash a "collection").

  **The Fix:** Distinct parts do not make a whole arbitrary. Consider your body right now. It is made of distinct cells. None of those cells are numerically identical to each other. Yet, your body is not a "conventional grouping" in the way a random pile of leaves is. It is a **functionally integrated system**.

  Perdurantists argue the same applies across time. The temporal parts are not just stacked; they are **integrated**. The unity of the person is not the unity of a *single substance* (as the endurantist wants), but the unity of a **continuous process**. The "stack" isn't arbitrary because the parts fit together in a specific, law-governed way that random stacks do not.

  ### 3. The Slip: Demanding "Numerical Identity" for Persistence
  This is the deepest slip. Your roommate assumes that for it to be "really one person," the thing existing at time $T_1$ must be **numerically identical** to the thing existing at time $T_2$ (i.e., $A = B$).

  **The Fix:** Perdurantists argue that **persistence is not numerical identity.**

  When we say "I am the same person I was at twenty," the endurantist hears: "The object existing now is identical to the object existing then." The perdurantist hears: "The object existing now and the object existing then are **parts of the same larger whole**."

  She thinks perdurantism surrenders identity. The perdurantist says: "I am not surrendering identity; I am correcting your definition of persistence." They claim numerical identity over time is impossible (because of change), so persistence *must* be a part-whole relation.

  ### The Binding Relation: What holds the worm together?
  You asked what stops the "all parts are real" view from dissolving into a heap. It is not just "causation" (which is too weak); it is **Immanent Causation** (or Genidentity).

  *   **Normal Causation:** One event causes a *different* event (a billiard ball hits another).
  *   **Immanent Causation:** One state causes the *next state of the same continuing entity*.

  The perdurantist argues that the temporal parts are bound because the earlier parts **generate** the later parts from the inside out, preserving structural and psychological continuity. The "me-at-twenty" slice physically and psychologically evolves into the "me-now" slice. This continuous chain of internal causation is what distinguishes a **person-worm** from a **random stack of person-slices**.

  ### Why this is a Solution, not a Surrender
  Philosophers treat this as a solution because it solves the **Problem of Change** without contradiction.

  *   **Endurantism Problem:** If I am wholly present at 20 and wholly present now, and I have different properties (e.g., "has bangs" vs. "no bangs"), how can I be the same object? Logic says $A$ cannot be $F$ and not-$F$.
  *   **Perdurantist Solution:** I do not have the property "has bangs" simpliciter. I have the property "has bangs-at-time-$T_1$." The *whole worm* has both properties at different temporal locations. There is no contradiction.

  **Summary for your argument:**
  Tell her she is treating temporal parts like **spatially scattered objects** (like a pile of bricks) rather than **temporally extended processes** (like a melody). A melody is real, and every note is equally real, but the melody is not "just a collection." It is a single structure defined by the specific relations between the notes. Perdurantism says you are the melody, not the note.
