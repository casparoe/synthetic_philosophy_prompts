prompt: |-
  I have to teach the non-identity problem in a single seventy-five-minute session, and what I want from you is a plan for the explanation, not an explanation of the problem.

  The setting: a guest session in a master's seminar on population and public-health ethics. About twenty students, nearly all from epidemiology or health-policy backgrounds, each with at most one previous applied-ethics module. They read fast, they are comfortable with counterfactuals in their own work, and they are likely to file anything that sounds like possible-persons talk under "metaphysics" and disengage. There is a downstream use for the session: in two weeks they submit a short policy brief arguing for or against a preconception health programme (say, lead abatement plus folate supplementation targeted at people who intend to conceive within the year), and I want them to leave able to tell which of their own arguments survive the non-identity argument and which quietly presuppose an identifiable individual who is made worse off.

  My candidate carrying case, which I would like you to vet: a fertility clinic switches to a cheaper batch of embryo culture medium. The cheaper medium slightly raises the rate of a lifelong but mild condition — a manageable endocrine disorder needing daily medication — in children born from embryos cultured in it. Because the medium also affects which embryos develop to the transfer stage, the child any given couple takes home will be a different child depending on the medium used. The clinic knows all this and chooses purely on cost. Same number of children either way, each life plainly worth living, no one made worse off relative to their own alternative. The attraction of the case for me is that it has one dial: I can stipulate that the medium affects the condition but *not* which embryo is transferred, which turns the very same story into an ordinary harming case. I want to know whether one case with a switch beats two separate cases for this audience, what exactly the case must have and must lack to do the work, and whether I should close off the escape hatch by which a student says the *parents* are the ones wronged, or leave it open and use it later.

  The points I need you to plan around:

  1. Dependency structure. What must be in place before the puzzle can even be stated as a puzzle, and in what order? In particular, must the idea that a life can be well worth living while still going badly for its holder be secured *before* I introduce the claim that a different individual would exist otherwise, or can it stay implicit until a student tries to solve the case by comparison? Say which, and say specifically what breaks if I run them in the wrong order.

  2. Misconceptions, and where each belongs in the sequence. The ones I predict: that this is a problem about personal identity over time, of the ship-of-Theseus sort; that the gametes were already there so it is the same person; that the upshot is "no one is harmed, so anything goes"; that the upshot is the much stronger claim that we have no duties to future generations whatsoever; that the fix is simply to compare this child's life to the better life they could have had, without noticing that the comparison has no subject; and that the whole thing is a symptom of consequentialism, or equally of rights talk, and dissolves if you pick the other one. Tell me which of these I should pre-empt before they arise, which I should let surface and correct live because the correction does useful work, and at what minute each should be headed off.

  3. How much of the solution space to open, given the time, and where: the impersonal comparison, the threshold or non-comparative-harm move, rights to an adequate or open future, and the manoeuvre where the argument is shown to prove too much by being run against a deliberately malicious variant of the same case. Or should the session end without a solution — and if so, how do I keep that from landing as a refusal to answer?

  4. My own terminology. I have been using *identity-entangled* for an effect such that, had the act not been performed, the individual who bears the effect would not have existed, so that the individual cannot be held fixed across the counterfactual; and *identity-neutral* for the opposite. Should I hand these labels to the students, and before the case or only after they have tried and failed to name a plaintiff? And do the labels themselves mislead, for instance by making the puzzle look like a problem about causal dependence rather than about the unavailability of a comparison?

  5. The check for understanding. My candidate is to have each student take a paragraph of their own draft brief and run what I call a plaintiff check: name the individual who is worse off, and say what would have happened to that very individual otherwise; if no one can be named, mark the argument as identity-entangled and say whether it retains any force. Is this the right test, and what could a student who has not really understood still manage to say in response to it?

  6. What to leave out, and say out loud that I am leaving out. I am inclined to refuse the debate over whether an individual's origins are essential to them, the modal metaphysics of merely possible people, the asymmetry in population ethics, and any taxonomy of solution-types. Tell me which of these are unsafe to omit at this level and which refusals are honest.

  Please give me the answer as a session plan with rough timings, not as an exposition of the problem.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 75-minute session plan for teaching the Non-Identity Problem (NIP).
      *   **Audience:** Master's students in epidemiology/health policy (quantitative, practical, low tolerance for metaphysics, one prior ethics module).
      *   **Goal:** Enable them to distinguish arguments that survive NIP from those that presuppose an identifiable victim, specifically for a policy brief on preconception health (lead abatement/folate).
      *   **Constraint:** Do *not* explain the problem itself; provide a *plan* for the explanation.
      *   **Specific Input:** The user has a specific case (fertility clinic culture medium), specific terminology ("identity-entangled" vs. "identity-neutral"), and specific concerns (ordering of concepts, misconceptions, solution space, terminology usage, assessment check, omissions).
      *   **Output Format:** Session plan with rough timings.

  2.  **Evaluate the User's Case (Fertility Clinic Culture Medium):**
      *   *Pros:* Medical setting (relevant to audience), clear mechanism (cost vs. risk), easy to toggle between identity-affecting and identity-neutral.
      *   *Cons:* IVF/embryo selection can trigger "same person" intuitions based on gametes (the "genetic identity" misconception).
      *   *Verdict:* It's strong, but needs careful framing to avoid the "gametes = person" trap. The toggle (switch) is excellent for pedagogical contrast.
      *   *Advice:* Keep the toggle, but explicitly block the "gamete identity" escape route early.

  3.  **Address the Six Specific Points:**

      *   **1. Dependency Structure:**
          *   *Issue:* Order of "Life worth living" vs. "Different individual."
          *   *Analysis:* If you say "different individual" first, they might think "oh, new person, new rules." If you say "life worth living" first, they might think "no harm, no foul."
          *   *Strategy:* Establish the *harm intuition* first (Condition X is bad). Then establish the *counterfactual* (Without Act A, Person P doesn't exist). Then collide them.
          *   *Risk:* If you don't secure "life worth living" first, they will just say "don't do it, it causes harm." If you don't secure "different person" first, they will say "fix the person."
          *   *Decision:* Secure "Bad Condition" + "Life Worth Living" *before* introducing the identity shift.

      *   **2. Misconceptions:**
          *   *Gametes/Identity:* Pre-empt this immediately with the case setup (different sperm/egg combination due to timing/batch).
          *   *No Harm/Anything Goes:* Let this surface, then crush it with the "malicious variant" (Parfit's 14-year-old girl or a deliberate risk case).
          *   *Metaphysics:* Keep it practical. Frame it as a "standing to complain" issue, not "what is a person."
          *   *Consequentialism/Rights:* Don't get bogged down. Show it affects both.
          *   *Timing:* Gametes (Min 10), No Harm (Min 40), Metaphysics (Omit/Deflect).

      *   **3. Solution Space:**
          *   *Time:* 75 mins is tight.
          *   *Strategy:* Don't solve it. Show *why* it breaks standard tools. Offer the "Impersonal" vs. "Rights/Threshold" distinction as a way to categorize their policy arguments, not as truth.
          *   *Ending:* End with the "Plaintiff Check" tool. It's practical. Acknowledge the philosophical unresolvedness but emphasize the policy utility.

      *   **4. Terminology ("Identity-Entangled/Neutral"):**
          *   *Verdict:* Useful heuristics for *this* audience.
          *   *Timing:* Introduce *after* they feel the puzzle. If introduced before, it sounds like jargon. If introduced after the "Plaintiff Check," it labels the bucket they just created.
          *   *Caution:* Ensure they know it's about the *counterfactual dependency*, not causal entanglement.

      *   **5. Check for Understanding (Plaintiff Check):**
          *   *Verdict:* Excellent for policy students.
          *   *Risk:* Students might say "Society is worse off" or "The parents."
          *   *Mitigation:* Force specificity: "Who has the condition?" "Would *that* person exist without the policy?"

      *   **6. Omissions:**
          *   *Safe to Omit:* Essentiality of origins (metaphysics), Asymmetry (too technical), Taxonomy of solutions (too abstract).
          *   *Unsafe to Omit:* The fact that standard harm analysis fails. The distinction between "worse off" and "bad condition."
          *   *Honest Refusal:* "We are not solving metaphysics today; we are auditing policy arguments."

  4.  **Drafting the Session Plan (Iterative Process):**

      *   *0-10 min:* Hook & Case Setup. Use the Clinic Case. Establish the "Bad Condition" but "Good Life."
      *   *10-20 min:* The Identity Twist. Reveal the "Different Child" mechanism. The Toggle (Identity-Neutral version).
      *   *20-35 min:* The Puzzle Emerges. Small group discussion. Why does the standard "harm" argument fail here?
      *   *35-50 min:* Misconceptions & The "Malicious Variant." Address "No harm = OK." Introduce the reckless version to show intuition still says "Wrong."
      *   *50-60 min:* Solutions (Briefly). Impersonal vs. Threshold. Connect to Policy Briefs.
      *   *60-70 min:* The Tool (Plaintiff Check). Terminology introduction here.
      *   *70-75 min:* Wrap up.

  5.  **Refining the Advice within the Plan:**
      *   *Case Vetting:* The IVF case is good but risky on the "genetic identity" front. I need to advise the user to specify that the *timing* of conception changes due to the batch availability, ensuring different gametes meet.
      *   *Terminology:* "Identity-entangled" is non-standard but functional. I should advise using it as a *label for the argument structure*, not a metaphysical claim.
      *   *Misconceptions:* The "Parents are harmed" objection is a classic escape hatch. I need to advise the user to *allow* it, then show how it changes the policy justification (parental rights vs. child welfare).

  6.  **Final Review against Constraints:**
      *   75 minutes? Yes.
      *   Plan, not exposition? Yes.
      *   Address all 6 points? Yes.
      *   Audience appropriate? Yes (focus on policy utility).

  7.  **Final Polish:** Ensure the tone is direct and instructional. (Self-Correction: Make sure to explicitly answer the "one case with a switch vs. two cases" question in the commentary).

  *(Self-Correction during drafting)*: I need to be careful about the "Life worth living" vs. "Different Individual" ordering. If I say "Different Individual" first, they might disengage. If I say "Life worth living" first, they might miss the point. The plan should sequence it: 1. Act causes Condition. 2. Condition is compatible with Good Life. 3. Act causes *This* Person to exist. 4. Therefore, no comparative harm.

  *(Self-Correction on Terminology)*: "Identity-entangled" is clever. I should recommend introducing it *after* the struggle, as a naming of the phenomenon they just discovered.

  *(Self-Correction on Omissions)*: Explicitly state *why* we are omitting the metaphysics (because policy needs action, not truth conditions for personhood).

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Session Plan: The Non-Identity Problem for Health Policy
  **Duration:** 75 Minutes
  **Audience:** Master's in Epidemiology/Health Policy (Practical, quantitative, low tolerance for metaphysics)
  **Goal:** Equip students to audit their policy briefs for arguments that collapse under the Non-Identity Problem (NIP).

  ## 0. Pre-Session Preparation (Instructor Notes)
  *   **The Case:** Your fertility clinic case is strong, but it requires one specific stipulation to block the "gametes are the same" objection. You must specify that the *batch availability* delays conception by one cycle or changes the timing of insemination, ensuring a different sperm meets a different egg. Without this, epidemiology students will treat the zygote as the patient.
  *   **One Case with a Switch:** Use **one case with a switch**. Do not run two separate cases. The cognitive work lies in seeing that *only one variable changes* (the identity-dependence of the mechanism) while the outcome (child with condition) remains constant. This isolates the ethical variable.
  *   **Terminology:** Your terms (*identity-entangled/neutral*) are non-standard but functionally excellent for this audience. Introduce them **after** the puzzle is felt (Minute 60), not before. If introduced early, they sound like metaphysical baggage. If introduced late, they act as filing labels for the policy tool.

  ---

  ## 1. Dependency Structure & Case Setup (00:00 – 00:20)
  **Goal:** Secure the "Bad Condition/Good Life" intuition *before* introducing the identity shift.

  *   **00:00 – 00:05: The Hook.**
      *   State the downstream task: "In two weeks, you are writing a policy brief. Some of your best arguments will vanish if you don't check who they apply to."
      *   Distribute the **Clinic Case (Version A: Identity-Neutral)**.
      *   *Stipulation:* Clinic uses Medium X. Child C is born with Endocrine Condition E. Life is still worth living. If Clinic had used Medium Y, Child C would have been born *without* Condition E.
      *   *Ask:* "Did the clinic harm Child C?"
      *   *Expected Consensus:* Yes. C exists in both worlds; C is worse off in the actual world.

  *   **00:05 – 00:15: The Switch (Version B: Identity-Entangled).**
      *   Reveal the twist: Medium X degrades faster. Using it requires a different processing time, which delays transfer by 48 hours.
      *   *Biological Fact:* A 48-hour delay in ovulation/insemination means a different sperm fertilizes the egg.
      *   *Stipulation:* If Medium Y were used, Child C would *never have existed*. A different child (C*) would exist instead.
      *   *Constraint:* Life with Condition E is still plainly worth living.
      *   *Ask:* "Did the clinic harm Child C?"

  *   **00:15 – 00:20: The Collision.**
      *   Highlight the tension: The outcome (child with condition) is identical. The cost-saving motive is identical. The only difference is *which* child exists.
      *   *Crucial Ordering Note:* If you introduce the identity shift (00:05) before securing the "life worth living" premise (00:00), students will default to "Don't conceive them at all" (the asymmetry problem). You must lock in that the life is *good* first, so the only objection left is the condition.

  ## 2. Misconceptions & Live Correction (00:20 – 00:45)
  **Goal:** Let specific errors surface to demonstrate why standard policy tools fail.

  *   **00:20 – 00:30: Small Group Discussion.**
      *   Prompt: "Write down the sentence that justifies regulating the clinic. Then identify the plaintiff."
      *   *Instructor Role:* Circulate and listen for the predicted misconceptions. Do not correct them yet.

  *   **00:30 – 00:40: Harvesting Misconceptions (Board Work).**
      *   **Misconception 1: "The gametes were there, so it's the same person."**
          *   *Correction:* Pre-empt this in the case text (see Section 0). If raised, dismiss firmly: "In law and epidemiology, you are the specific fusion, not the raw materials."
      *   **Misconception 2: "No one is harmed, so anything goes."**
          *   *Strategy:* **Let this surface.** It is the core of the problem.
          *   *Correction (00:40):* Run the **Malicious Variant**. "Suppose the clinic chooses the cheaper medium *specifically* to produce children with Condition E for a study, knowing it creates different children."
          *   *Point:* If "no harm = permissible" holds, this malicious variant is also permissible. Since it isn't, "no harm" is insufficient. This breaks the "anything goes" conclusion without solving the metaphysics.
      *   **Misconception 3: "The parents are wronged."**
          *   *Strategy:* **Leave this open.** It is a valid policy route (parental rights/informed consent).
          *   *Use:* Note that this shifts the brief from *child welfare* to *consumer protection*. That is a valid pivot, but they must label it as such.
      *   **Misconception 4: "It's just consequentialism."**
          *   *Correction:* Briefly note that Rights theories also struggle here (does C have a right to be born without E if that means C isn't born?). Don't debate; just flag that the tool breaks across frameworks.

  *   **00:40 – 00:45: The Metaphysics Refusal.**
      *   Explicitly state: "We are not debating whether origins are essential. We are accepting the counterfactual as given for the sake of the policy argument. If your policy relies on 'this person' being fixed, and the biology says they aren't, your policy fails."

  ## 3. Solution Space & Policy Tools (00:45 – 01:00)
  **Goal:** Show how to argue *without* a specific plaintiff.

  *   **00:45 – 00:55: Two Ways Out (Briefly).**
      *   Do not present a taxonomy. Present two *moves* they can make in their briefs.
      *   **Move 1: Impersonal Comparison.** "A world with Healthy Children is better than a world with Sick Children," even if the subjects differ. (Warning: This leads to Repugnant Conclusion territory; use with caution).
      *   **Move 2: Threshold/Non-Comparative Harm.** "Condition E falls below a threshold of adequate functioning." It doesn't matter if C is worse off than C could have been; it matters that C is below the line.
      *   *Instruction:* "For your brief, Move 2 is safer. Argue for a right to an adequate start, not a right to the best possible start."

  *   **00:55 – 01:00: The "Proves Too Much" Check.**
      *   Ask: "If your argument bans the clinic, does it also ban a 14-year-old from having a child (Parfit's case)?"
      *   If yes, their principle is too broad. They need to narrow it to *institutional duty* or *foreseeable risk* rather than *identity-affecting choices*.

  ## 4. Terminology & The Plaintiff Check (01:00 – 01:10)
  **Goal:** Formalize the heuristic for their assignment.

  *   **01:00 – 01:05: Introducing the Labels.**
      *   Now introduce your terms: **Identity-Neutral** (Version A) vs. **Identity-Entangled** (Version B).
      *   *Definition:* "Entangled" means the effect is a necessary condition for the existence of the subject bearing the effect.
      *   *Warning:* "This is not about causal entanglement. It is about the unavailability of the counterfactual subject."

  *   **01:05 – 01:10: The Plaintiff Check (Exercise).**
      *   Hand out the checklist.
      *   **Step 1:** Name the individual who is worse off. (e.g., "The child born with lead exposure").
      *   **Step 2:** Describe the counterfactual for *that individual*. (e.g., "Without the policy, this child would not have been conceived").
      *   **Step 3:** If Step 2 is true, mark the argument **Identity-Entangled**.
      *   **Step 4:** Ask: "Does the argument retain force without a comparative harm claim?" (e.g., "Yes, if arguing for a threshold of adequate health").
      *   *Why this works:* It forces them to operationalize the metaphysics. If they can't name the plaintiff, they can't claim comparative harm.

  ## 5. Wrap Up & Omissions (01:10 – 01:15)
  **Goal:** Honest closure.

  *   **01:10 – 01:13: What We Left Out.**
      *   Say out loud: "We did not solve the Non-Identity Problem. Philosophers have argued about this for 40 years. We also ignored the Asymmetry (why we have duties to make happy people but not to make people) and the metaphysics of possible persons."
      *   *Justification:* "You are writing policy briefs, not ontology papers. Your job is to ensure your premises support your conclusions. If your premise is 'Child X is harmed' and your policy creates Child Y, your brief is invalid. That is all you need to know."

  *   **01:13 – 01:15: Final Instruction.**
      *   "For your brief: If your argument is Identity-Entangled, switch to a Threshold argument or a Parental Rights argument. Do not rely on 'making this child better off' if 'this child' depends on the risk."

  ---

  ## Specific Advice on Your Six Points

  1.  **Dependency Structure:**
      *   **Order:** Secure "Life Worth Living" $\rightarrow$ Secure "Different Individual" $\rightarrow$ Collision.
      *   **Breakage:** If you introduce "Different Individual" first, students will treat the new child as a "new case" and miss the paradox. If you skip "Life Worth Living," they will solve it by saying "Don't conceive the child," which bypasses the NIP entirely (the Asymmetry).

  2.  **Misconceptions:**
      *   **Pre-empt:** "Gametes = Person." (Kill this in the case setup).
      *   **Let Surface:** "No harm = OK." (Let them say it, then use the Malicious Variant to show it yields abhorrent results).
      *   **Leave Open:** "Parents are wronged." (This is a valid policy pivot; don't call it a misconception, call it a *different justification*).
      *   **Timing:** Gametes (Min 10), No Harm (Min 40), Parents (Min 45).

  3.  **Solution Space:**
      *   **Depth:** Shallow. Do not teach the solutions; teach the *types* of solutions so they can choose one for their brief.
      *   **Ending:** End without a philosophical solution, but with a **procedural solution** (The Plaintiff Check). This prevents the "refusal to answer" feeling. You are giving them a tool, not a truth.

  4.  **Terminology:**
      *   **Verdict:** Use them. They are precise enough for policy.
      *   **Timing:** Introduce at Minute 60 (after the struggle).
      *   **Risk:** They might think "Entangled" means "Causally linked." Emphasize it means "Existentially dependent."

  5.  **Check for Understanding:**
      *   **Verdict:** The Plaintiff Check is the right test.
      *   **Failure Mode:** A student who doesn't understand will say "Society is the plaintiff" or "The future generation."
      *   **Counter:** Force them to name the *bearer of the condition*. If they say "The generation," ask "Which individual in the generation is worse off than they would otherwise have been?"

  6.  **Omissions:**
      *   **Safe:** Essentiality of origins, Modal Metaphysics, Asymmetry, Taxonomy of Solutions.
      *   **Unsafe:** The distinction between "Worse Off" (Comparative) and "Bad Condition" (Non-Comparative). This is the engine of the policy fix.
      *   **Honest Refusal:** "We are auditing arguments for validity, not solving population ethics." This aligns with their professional identity.
