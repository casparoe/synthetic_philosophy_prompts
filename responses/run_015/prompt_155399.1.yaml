prompt: |-
  hey im in this dev econ class and we're arguing about whether institutions or geography make countries rich. my professor said comparing nations is like comparing patients in a clinical trial where nobody randomised the treatments, every patient lied about their diet, and some of them switched doctors halfway through. can you audit that analogy? like map exactly what corresponds to treatment, outcome, confounder, and patient compliance. then tell me where it falls apart - countries aren't bodies, history doesn't have a control group, etc. also does the analogy secretly treat geography as just background noise instead of something that might change how institutions actually work? my prof threw out "counterfactual stability under geographic path dependence" and im not sure if thats a real concept or just jargon she invented. does the clinical-trial framing even let you ask that question, or does it smuggle in the idea that we can never know causation from history?
