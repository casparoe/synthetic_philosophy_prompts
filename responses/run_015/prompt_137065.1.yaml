  The destination does not care how you came.
  I led you here by accident of light.
  What is true but untied claims no name.

  We stand within the city gates tonight.
  The destination does not care how you came.
  You ask me if I knew the turn was right.

  I only know the arrival is in sight.
  What is found but untied claims no name.
  The extra worth is lost within the night.

  Why bind the statue if it sits upright?
  The destination does not care how you came.
  If guessing gets us here without a fight.

  Then knowledge adds no extra power or might.
  What is found but tied claims no name.
  A costly tether for a bird in flight.

  Yet here we are, and I accept the plight.
  The destination does not care how you came.
  Or maybe credit climbs to final height.
  What is found but tied claims a name.
