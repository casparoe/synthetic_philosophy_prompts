answer: |-
  This is a precise translation task. You are asking to map a **philosophical manifesto** (Neurath's Logical Positivism/Physicalism) onto a **technical specification** (The Grammar of Graphics).

  While both deal with the mapping of information to visual form, their ontologies differ. Your vocabulary is *operational* (how to construct a view); Neurath's was *epistemological* (how to construct truth).

  Here is the translation of Neurath's four distinctions into your vocabulary, followed by the residue report.

  ---

  ### 1. Picture Script vs. Picture Language

  **Neurath's Claim:** A "picture script" (e.g., a painting, a photograph, a realistic illustration) is a continuous, mimetic field that must be interpreted holistically like a scene. A "picture language" (ISOTYPE) is a discrete system of repeatable signs where meaning is derived from counting and arrangement, not artistic rendering.

  *   **Translates Cleanly:** This maps directly to the distinction between **continuous vs. discrete marks** and **analog vs. digital encoding**.
      *   *Picture Script* is a high-fidelity raster layer or a complex custom illustration where visual channels (color, texture, form) are continuous and unbounded. It relies on *post-attentive* processing to decode the scene.
      *   *Picture Language* is a system of discrete **marks** (specifically, repeated point or area marks) where the primary visual channel is **quantity** (count) rather than **magnitude** (length/area of a single bar). It relies on *pre-attentive* grouping and subitizing.
  *   **Distorted:** In your vocabulary, a "picture script" could still be a valid visualization (e.g., a high-resolution heatmap or a flow map). For Neurath, it was epistemologically invalid for science because it invited subjective interpretation. Your toolkit allows for artistic expression; Neurath's forbade it as "metaphysical."
  *   **Lost:** The concept of the **Transformator**. In the Grammar of Graphics, the mapping rules are defined by the code/spec. For Neurath, the "Picture Language" required a human expert (the Transformator) to make judgment calls on how to simplify complex social data into discrete units. Your vocabulary assumes the data exists ready-to-plot; Neurath's theory posits that data must be *transformed* into facts before it can be plotted.

  ### 2. Internationalism / Language Independence

  **Neurath's Claim:** A picture language must bypass the syntax of natural language (German, English, etc.) to convey empirical content directly. It is a "visual Esperanto" rooted in physical reality, not grammar.

  *   **Translates Cleanly:** This aligns with the preference for **universal visual channels** (position, length) over **semantic channels** (text, labels). It supports the design heuristic that legends and scales should be understandable without linguistic fluency. It treats **text** as a secondary annotation layer, not the primary structural grammar.
  *   **Distorted:** Your vocabulary assumes the *structure* of the chart (axes, legends) is universal. Neurath argued the *marks themselves* must carry the syntax. In your system, a square is a rectangle; in ISOTYPE, a square representing "10,000 people" is a noun. Your system separates data from mark; Neurath fused them.
  *   **Lost:** The **political imperative**. Neurath's internationalism wasn't just about usability; it was about democratizing knowledge for the working class across borders. Your vocabulary treats "international" as a usability constraint (accessibility); Neurath treated it as a condition for "Unified Science." The Grammar of Graphics is agnostic to *who* is reading; ISOTYPE was specifically designed for the *uneducated* viewer.

  ### 3. Denotative vs. Expressive Function

  **Neurath's Claim:** Pictures in a scientific context must denote facts, not express emotion or style. Artistic variation introduces noise and bias.

  *   **Translates Cleanly:** This is nearly identical to **Tufte's Data-Ink Ratio** and the principle of **minimalism**. It maps to the restriction of **aesthetic channels** (color, shape) to data variables only, prohibiting their use for decoration. It demands that **visual channels** be used with maximum resolution for data and minimum resolution for style.
  *   **Distorted:** Tufte's "data-ink" is about efficiency and avoiding deception. Neurath's "denotation" was about **Physicalism**. He believed that unless a picture depicted a physical object (a person, a ton of coal), it was borderline meaningless. Your vocabulary comfortably visualizes abstract constructs (GDP, correlation coefficients, sentiment). Neurath would reject most modern dashboards as "metaphysical."
  *   **Lost:** The **ethical stance on truth**. In your vocabulary, a chart can be "accurate" but still misleading (e.g., truncated axes). Neurath believed the *method* of ISOTYPE inherently prevented lying because it forced data into discrete, countable physical units. You view honesty as a constraint on the designer; Neurath viewed it as a property of the system.

  ### 4. Stripping Connotation (Words vs. Pictures)

  **Neurath's Claim:** Natural language words carry bourgeois, historical, and emotional baggage. A disciplined picture language strips this away, presenting "brute facts" without semantic loading.

  *   **Translates Cleanly:** This maps to the handling of **categorical variables**. You treat categories as nominal levels (Factor A, Factor B). Neurath wanted to ensure that the *icon* for "Worker" didn't carry the cultural baggage of the *word* "Worker." It suggests a desire for **neutral scales**.
  *   **Distorted:** Your vocabulary acknowledges that **visual channels carry connotation** (e.g., Red = Danger/Hot, Blue = Cold/Safe). You manage this; Neurath sought to eliminate it. Furthermore, modern cognitive science (which underpins your "pre-attentive" vocabulary) suggests that *all* perception is theory-laden. Neurath's belief that a picture could be a "pure" denotation is incompatible with your understanding of how visual cognition works.
  *   **Lost:** The **critique of language**. Neurath was a Logical Positivist. He believed language was structurally flawed for describing reality. Your vocabulary treats text and visuals as complementary layers. Neurath treated text as a contaminant that the visual system was meant to cure.

  ---

  ### The Residue Report

  You asked whether ISOTYPE is just an early, cruder Grammar of Graphics, or if something is missing.

  **The Verdict:** ISOTYPE is **not** a crude Grammar of Graphics. It is a **sociopolitical technology** wrapped in a visual system. The "residue" that does not translate into your vocabulary is not a defect of your technical toolkit, but evidence that Neurath's project was fundamentally different in kind.

  Here is what survives and what dissolves:

  #### 1. What Survives (The Technical Core)
  The mechanical rules of ISOTYPE translate well.
  *   **Discrete Marks:** The use of repeated icons rather than scaled bars is a valid choice within the Grammar of Graphics (specifically, using `position` and `count` rather than `length`).
  *   **Data-Ink:** The rejection of decorative chartjunk is fully compatible.
  *   **Universal Channels:** The preference for position and quantity over text is standard best practice.

  If you stop here, your intuition is correct: ISOTYPE is a specific *style* of charting within the broader Grammar of Graphics.

  #### 2. What Dissolves (The Epistemological Core)
  The residue reveals that Neurath's "theory of picture languages" was actually a **theory of knowledge**.
  *   **Physicalism:** Your vocabulary allows you to visualize *anything* that can be quantified (happiness, risk, probability). Neurath's theory *forbade* visualizing anything that wasn't a physical object or event. This isn't a technical limitation; it's a philosophical one. Your toolkit is **ontologically flexible**; ISOTYPE was **ontologically rigid**.
  *   **The Transformator:** In the Grammar of Graphics, the mapping is deterministic (Data + Spec = View). In ISOTYPE, the mapping is **curatorial**. The "Transformator" decides what counts as a fact. Your vocabulary has no variable for "editorial judgment on the nature of reality."
  *   **The Audience:** Your vocabulary assumes a **rational observer** who processes visual channels efficiently. Neurath designed for an **empowered citizen** who needs to see social relations to change them. Your vocabulary optimizes for *comprehension*; Neurath optimized for *action*.

  #### 3. The Defect vs. The Bundle
  Is the failure to translate a defect of your vocabulary? **Yes, but necessarily so.**

  Your vocabulary is an **engineering idiom**. It is designed to describe *how* to build a visualization, not *why* it exists or *what truth claims* it makes. It is agnostic by design.

  Neurath's project was **incoherent** only if you view it as a technical specification. If you view it as a political manifesto, it is coherent. He bundled a technical claim ("repeatable icons are easier to count") with a massive epistemological claim ("physical facts are the only truth") and a political claim ("workers need to see facts to overthrow bourgeois narrative").

  **The Residue:**
  The residue is **Intent**.
  *   **Grammar of Graphics:** "How do I map this variable to this channel to minimize cognitive load?"
  *   **ISOTYPE:** "How do I transform this social statistic into a physical fact that enables democratic planning?"

  **Conclusion:**
  Your intuition that ISOTYPE is a "cruder Grammar of Graphics" is **technically true but philosophically false**.
  It is technically cruder (less flexible, harder to automate, limited to countable physical units).
  But it is philosophically richer. It contains a theory of **social truth** that your vocabulary explicitly excludes.

  If you adopt ISOTYPE using only your current vocabulary, you will reproduce the *style* (the icons, the repetition) but you will strip out the *mechanism* (the Transformator's curatorial power) and the *purpose* (the democratization of empirical knowledge). You will make "pretty ISOTYPE charts," but you will not be practicing Neurath's picture language. You will be practicing **illustrated statistics**, which is exactly what Neurath warned against.
