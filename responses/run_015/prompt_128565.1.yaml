prompt: |-
  I'm preparing a handout for a philosophy of science graduate seminar that focuses specifically on emergence in complex adaptive systems—flocking dynamics in collective motion, phase transitions in climate models, and similar cases—rather than on the standard toy examples from philosophy of mind. I want a taxonomy structured as a branching decision tree that sorts positions by the answers a student gives to concrete, case-anchored questions, not by the labels they prefer. The root question should be whether the student accepts that microphysical closure holds without exception in these domains. From there, the first-level branches should split on whether emergence, if present, is ontological, epistemological, or merely pragmatic and model-relative. At the second level, each of those three should branch on how the position handles the causal exclusion problem—specifically, whether it denies downward causation altogether, accepts downward causation but denies that it violates closure via some form of supervenience-based reconciliation, or rejects the exclusion principle itself. Each leaf should carry a named or described position—such as updated British emergentism, non-reductive physicalism with downward causation, pragmatic pluralism about macro-models, or eliminative reductionism—along with one sentence stating its most awkward commitment regarding scientific practice: in particular, what it must say about whether macro-level causal laws should remain in the final, completed theory even if a full micro-level derivation were in principle available. The tree should also flag any pairs of leaves that are genuinely indistinguishable in modeling practice despite different ontological rhetoric, and should identify logical combinations of answers that appear coherent but are not actually defended—briefly diagnosing whether each gap stems from incoherence, unattractiveness, or mere neglect. The audience understands basic philosophy of science but should navigate the tree by answering questions like "would you retain a macro-level explanation in your theory if every micro-state were precisely specified?" without needing to recognize philosophical brand names in advance. Please phrase every node as a direct question with two or three answer options, and make sure the taxonomy does not depend on knowing specific publication dates or on retrieving bibliographic references.
