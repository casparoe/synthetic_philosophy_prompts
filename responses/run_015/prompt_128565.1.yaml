answer: |-
  # DECISION TREE: EMERGENCE IN COMPLEX ADAPTIVE SYSTEMS
  **Seminar Handout | Philosophy of Science**

  **Instructions:** Navigate this tree by answering the questions at each node based on your intuitions about cases like flocking dynamics, climate phase transitions, or ant colony optimization. Do not worry about philosophical labels; focus on the commitments regarding the models and the physics.

  ---

  ### ROOT NODE: MICROPHYSICAL CLOSURE
  **Q1: In a system like a flock of birds or a climate model, do the microphysical laws governing the individual constituents (birds, molecules) fully determine the system's future state without exception or external interference?**

  *   **(A) YES:** The micro-level is causally closed. Nothing happens at the macro-level that isn't fixed by the micro-level.
      *   *Go to Level 1 (A)*
  *   **(B) NO:** The micro-level is not causally closed. Macro-level patterns can influence outcomes in ways not fixed by micro-laws alone.
      *   *Go to Level 1 (B)*

  ---

  ### LEVEL 1: NATURE OF THE MACRO-PATTERN
  **Q2: Given your answer above, is the distinctiveness of the macro-behavior (e.g., the vortex, the swarm cohesion) a feature of the world itself, or a feature of our description?**

  *   **[From Q1-A: Closure Holds]**
      *   **(A1) Ontological:** The macro-pattern is a real feature of the world, distinct from the sum of parts.
          *   *Go to Level 2 (Ontological)*
      *   **(A2) Epistemological:** The macro-pattern is real, but its "emergence" is just a limit on our ability to compute or track micro-states.
          *   *Go to Level 2 (Epistemological)*
      *   **(A3) Pragmatic/Model-Relative:** The macro-pattern is defined by the scale and tools we choose to use; "emergence" is a relation between models, not objects.
          *   *Go to Level 2 (Pragmatic)*

  *   **[From Q1-B: Closure Fails]**
      *   **(B1) Ontological:** The macro-pattern is a new fundamental feature of reality.
          *   *Go to Level 2 (Strong Emergence)*
      *   **(B2) Epistemological/Pragmatic:** *(Note: Selecting this implies emergence is "in our heads" despite physics breaking.)*
          *   *Go to Leaf: UNDEFENDED GAP 1*

  ---

  ### LEVEL 2: CAUSAL EXCLUSION & DOWNWARD CAUSATION
  **Q3: If the macro-level is distinct, does it exert causal power that competes with or bypasses the micro-level?**

  *   **[From A1: Ontological + Closure Holds]**
      *   **(A1-i) Deny Downward Causation:** Macro-variables describe the system but do not *cause* changes; only micro-constituents cause things.
          *   *Go to Leaf: MACRO-EPIPHENOMENALISM*
      *   **(A1-ii) Accept + Reconcile:** Macro-variables cause changes, but this is realized by/consistent with micro-causation (no violation).
          *   *Go to Leaf: NON-REDUCTIVE PHYSICALISM*
      *   **(A1-iii) Reject Exclusion Principle:** Macro-variables cause changes, and this results in genuine causal overdetermination (both levels cause the same effect).
          *   *Go to Leaf: CAUSAL PLURALISM*

  *   **[From A2: Epistemological + Closure Holds]**
      *   **(A2-i) Deny Downward Causation:** Since emergence is just about our knowledge, macro-causation is a useful fiction.
          *   *Go to Leaf: REDUCTIVE ELIMINATIVISM*
      *   **(A2-ii) Accept Downward Causation:** *(Note: Claims macro-causes are real despite emergence being only epistemic.)*
          *   *Go to Leaf: UNDEFENDED GAP 2*

  *   **[From A3: Pragmatic + Closure Holds]**
      *   **(A3-i) Deny Downward Causation:** Macro-causation is valid only within the model, not in the world.
          *   *Go to Leaf: INSTRUMENTALIST PRAGMATISM*
      *   **(A3-ii) Accept Downward Causation:** Macro-causation is valid as a modeling stance, regardless of underlying ontology.
          *   *Go to Leaf: MODEL-RELATIVE REALISM*

  *   **[From B1: Ontological + Closure Fails]**
      *   **(B1-i) Reject Exclusion / Accept Downward:** Macro-laws operate independently and can override micro-tendencies.
          *   *Go to Leaf: STRONG EMERGENTISM*

  ---

  ### LEAF NODES: POSITIONS & COMMITMENTS

  #### 1. NON-REDUCTIVE PHYSICALISM (A1-ii)
  *   **Position:** Macro-properties are ontologically distinct but supervene on micro-states; downward causation is realized through micro-mechanisms.
  *   **Awkward Commitment:** You must claim that macro-level causal laws remain in the final theory, but they are strictly dependent on micro-constituents and never operate in isolation.
  *   **Practice Flag:** *Indistinguishable in modeling practice from Model-Relative Realism (Leaf 6).*

  #### 2. REDUCTIVE ELIMINATIVISM (A2-i)
  *   **Position:** Emergence is purely a computational limitation; macro-terms refer to nothing that isn't already captured by micro-terms.
  *   **Awkward Commitment:** You must claim that macro-level causal laws (e.g., fluid dynamics) should be eliminated from the final theory in favor of exhaustive particle-level derivations.
  *   **Practice Flag:** *Indistinguishable in modeling practice from Macro-Epiphenomenalism (Leaf 3).*

  #### 3. MACRO-EPIPHENOMENALISM (A1-i)
  *   **Position:** Macro-patterns are real ontological features, but they are causally inert by-products of micro-dynamics.
  *   **Awkward Commitment:** You must claim that macro-level causal laws should remain in the final theory as descriptions, even though they explain nothing about why the system changes.
  *   **Diagnosis:** *Undefended/Unattractive Gap.* (Rarely defended because it grants ontological status without causal utility).

  #### 4. STRONG EMERGENTISM (B1-i)
  *   **Position:** Macro-patterns constitute new fundamental laws that are not derivable from or determined by micro-physics.
  *   **Awkward Commitment:** You must claim that macro-level causal laws should remain in the final theory even if they contradict micro-level predictions in specific boundary cases.
  *   **Diagnosis:** *Coherent but costly.* (Requires rejecting standard physicalism).

  #### 5. INSTRUMENTALIST PRAGMATISM (A3-i)
  *   **Position:** Macro-models are tools for prediction; asking if emergence is "real" is a category error.
  *   **Awkward Commitment:** You must claim that macro-level causal laws should remain in the final theory solely as computational shortcuts, with no truth-claim attached.
  *   **Practice Flag:** *Indistinguishable in modeling practice from Non-Reductive Physicalism (Leaf 1).*

  #### 6. MODEL-RELATIVE REALISM (A3-ii)
  *   **Position:** Causation is relative to the model scale; macro-causation is "real" relative to the macro-model.
  *   **Awkward Commitment:** You must claim that macro-level causal laws should remain in the final theory as valid truths within their scale, even if they are silent on the micro-scale.
  *   **Practice Flag:** *Indistinguishable in modeling practice from Non-Reductive Physicalism (Leaf 1).*

  #### 7. CAUSAL PLURALISM (A1-iii)
  *   **Position:** Both micro and macro levels are causally sufficient; nature allows systematic overdetermination.
  *   **Awkward Commitment:** You must claim that macro-level causal laws should remain in the final theory alongside micro-laws, accepting that every event has two complete causal explanations.
  *   **Diagnosis:** *Undefended Gap.* (Generally rejected due to violation of parsimony).

  ---

  ### UNDEFENDED GAPS & DIAGNOSTICS

  **UNDEFENDED GAP 1 (From Q1-B + Q2-B2): "Failed Closure / Epistemic Emergence"**
  *   **The Combination:** You believe micro-physical closure fails (physics is incomplete), but emergence is only in our knowledge (ontologically nothing new exists).
  *   **Diagnosis:** **Incoherent.** If micro-closure fails, something ontologically new is happening; you cannot locate the "gap" solely in epistemology.
  *   **Status:** Not defended in literature.

  **UNDEFENDED GAP 2 (From Q1-A + Q2-A2 + Q3-A2-ii): "Epistemic Emergence / Real Downward Causation"**
  *   **The Combination:** You believe emergence is just a limit on our knowledge, but macro-variables still exert real causal force on the micro-world.
  *   **Diagnosis:** **Incoherent.** If the causal power is real, the property grounding it must be ontological, not merely epistemic.
  *   **Status:** Not defended in literature.

  **UNDEFENDED GAP 3 (From Q1-A + Q2-A1 + Q3-A1-i): "Ontological Emergence / No Downward Causation"**
  *   **The Combination:** You believe macro-patterns are real features of the world (Ontological), but they do nothing (No Downward Causation).
  *   **Diagnosis:** **Unattractive.** This posits "causal danglers"—real entities that make no difference to the physical world. Most philosophers abandon this for Eliminativism or Non-Reductive Physicalism.
  *   **Status:** Rarely defended (Classic Epiphenomenalism).

  ---

  ### PRACTICE FLAGS: ONTOLOGICAL RHETORIC VS. MODELING WORK

  **Pair A: Non-Reductive Physicalism (Leaf 1) vs. Model-Relative Realism (Leaf 6)**
  *   **The Conflict:** One claims macro-causes are grounded in micro-ontology; the other claims they are relative to model scale.
  *   **The Practice:** In both cases, the scientist retains the macro-equations (e.g., Navier-Stokes) alongside agent-based rules. Neither eliminates the macro-law, and both treat it as predictive. The ontological disagreement does not change the simulation architecture.

  **Pair B: Reductive Eliminativism (Leaf 2) vs. Macro-Epiphenomenalism (Leaf 3)**
  *   **The Conflict:** One says macro-patterns aren't real; the other says they are real but causally inert.
  *   **The Practice:** In both cases, the scientist treats macro-causal explanations as provisional. If a micro-derivation becomes available, both positions require discarding the macro-explanation as a fundamental account of *why* the change occurred.
