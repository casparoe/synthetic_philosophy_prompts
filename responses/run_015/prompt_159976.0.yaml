      *   Standard game: Bid for $1. Bidder A bids 10c, Bidder B 20c... Bidder A bids 90c, Bidder B bids $1.00. Now Bidder A faces losing 90c or bidding $1.10 to win $1 (net loss 10c). Escalation continues.
      *   Application here: The "prize" is continuing the magazine. The "bids" are effort, money, emotional energy.
      *   The "Exit Option": Pay a small cost now to avoid the trap later.
