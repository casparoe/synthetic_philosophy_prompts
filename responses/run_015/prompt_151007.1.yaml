      *   **The Relational Fix:** Include relational properties (e.g., "being 1m from $b$"). Now $a$ has it, $b$ does not (reflexively). So $a \neq b$. PII holds.
      *   **The User's Worry (Transworld Identity):** Compare $a$ in $W_1$ (with $b$) to $a$ in $W_2$ (without $b$).
