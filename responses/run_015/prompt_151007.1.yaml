      *   **Pedagogical Advice:** How to frame this for grad students.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Point 1: The Scope of PII.* PII is synchronic and intra-world. It's about counting. If I say $x$ and $y$ are in $W$, do they share all properties? If so, are they one or two? Comparing $x$ in $W_1$ to $x$ in $W_2$ is a modal question, not an individuation question.
