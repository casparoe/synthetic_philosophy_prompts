  First, the non-negotiable constraints. You need to respect the Causal Closure of the Physical (CCP). Basically, physics isn't magic; every physical event has a sufficient physical cause. If you violate this, you're inviting dualist ghosts into the machine. Second, avoid Systematic Overdetermination. If my desire for coffee and my neural state both cause me to walk to the kitchen, we don't want two independent causes firing like a double-barreled shotgun for every single action. That looks coincidental and wasteful. Third, preserve Mental Efficacy. My thoughts need to actually cause stuff. If epiphenomenalism is true, and my thoughts are just exhaust fumes, the theory fails to match our lived experience.

  Then there's the distinction between hard puzzles and camp preferences. The hard puzzle is the exclusion argument itself: If physics is closed, and mental isn't physical, mental gets excluded. That's logic, not taste. Preferences are about whether you're okay with reducing mind to brain or if you need emergence to feel real. Many people conflate the explanatory gap with causal power; just because we can't explain *how* consciousness feels doesn't mean it lacks causal power, but keeping them separate is crucial for a clean theory. You also need to respect the distinction between token and type causation. Maybe specific mental events are physical tokens, even if mental types aren't physical types. Getting this wrong leads to category errors.

  Now, about triggering vs. structuring causes from neuroscience. Triggering is the spark (neuron fires). Structuring is the setup (the circuit configuration). Some say mental states are structuring causes. They don't add energy; they constrain pathways. This helps visualize downward causation without violating conservation laws. It suggests the mind sets the rules of the road rather than pushing the car. But is it just pushing the problem down? Critics say if the structure is physical, you're still just talking physics. It clarifies the mechanism but doesn't fully solve the metaphysical exclusion of non-physical properties. It helps explain *how* constraints work, but not *why* mental properties aren't excluded by physical ones. It's a useful heuristic, but don't let it distract you from the metaphysical heavy lifting.

