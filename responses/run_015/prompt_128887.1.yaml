  You mentioned conflating issues, and that's common. People often mix up ontology (what exists) with epistemology (what we can know). A theory can save causation without explaining subjective experience, or vice versa. Don't demand one theory solve both the hard problem and the exclusion problem simultaneously unless you're ready for panpsychism.

  So, before you pick emergentism or compatibilism, ask yourself which of those three you're willing to let go. That's usually where the real disagreement lies, not in the neuroscience details. The triggering/structuring distinction is useful for modeling, but it doesn't magically dissolve the metaphysical tension. Hope that clears the fog a bit before you dive back in.
