      *   Can it be engineered around?
      *   *Workarounds:*
          1.  **Capital Requirements/Margin:** Make the cost of manipulation prohibitive relative to policy gain (hard to calibrate).
          2.  **Delay/Time-Locks:** Don't implement immediately after market close. Allow a challenge period.
          3.  **Subsidized Liquidity:** Ensure deep liquidity so the cost to move the price is astronomical.
          4.  **Hybrid Governance:** Require market approval *plus* legislative veto (reintroduces the politics Bianca warned about).
          5.  **Decision Markets (Causal):** Use "decision markets" where bets are settled on *causal estimates* rather than raw outcomes, though this requires trusted oracles.
      *   *Verdict:* It's a severe design constraint, not necessarily fatal, but it requires moving away from "pure" futarchy to a hybrid system. The cost of the workaround often reintroduces the political friction futarchy sought to eliminate.

