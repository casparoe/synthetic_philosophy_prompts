      *   *Alternative Missing Consideration:* **The Legitimacy/Coercion Problem.** Even if the market is right, will people accept a policy they hate because a speculator bet on it?
      *   *Selection:* The Counterfactual/Causal Inference problem is more technical and fits the "software engineer" persona better. It's the "oracle problem" in blockchain terms. How do you resolve the bet?
