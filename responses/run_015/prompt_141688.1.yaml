answer: |-
  ### The Context Frames (The Purpose Split)

  Before entering the tree, you must establish *why* the question is being asked. A character's path through the tree depends on the Context. To satisfy your constraint on split purposes, treat the following three Frames as parallel tracks. A single character may occupy one Leaf in Frame A and a different Leaf in Frame B.

  1.  **Frame Guilt:** (Legal/Retributive) *Who is more to blame? Who gets the longer sentence?*
  2.  **Frame Prevention:** (Pragmatic/Policy) *Where do we spend limited money to stop the next one?*
  3.  **Frame Memory:** (Sacred/Commemorative) *Who gets the larger monument? Whose pain is centered?*

  **The Repetition Rule:**
  *   **Nodes 1 and 2 are Context-Sensitive.** A character might answer differently in Frame Prevention (utilitarian) than in Frame Memory (sacred). You must ask these questions separately for each Frame.
  *   **Nodes 3 and 4 are Core Moral Beliefs.** These usually remain stable across Frames (a character's view on "manner of killing" is likely consistent), but you may override this if a character is specifically hypocritical.

  ***

  ### The Taxonomy Tree

  **Root:** Two characters are debating the relative severity of Program A and Program B.

  **Node 1 (The Taboo)**
  *Dialogue:* "Is it a betrayal of the victims to ask whose death weighs more?"
  *   **Yes:** Go to **Leaf 1 (The Silencer)**.
  *   **No:** Proceed to Node 2.

  **Node 2 (The Truth)**
  *Dialogue:* "If we ignore the insult, is there a fact of the matter we can find, or is it just opinion?"
  *   **No (It's just opinion):** Go to **Leaf 2 (The Agnostic)**.
  *   **Yes (There is a truth):** Proceed to Node 3.

  **Node 3 (The Manner)**
  *Dialogue:* "If a man shoots a child and a man signs a paper that starves a village, does the method change the weight of the crime, regardless of the count?"
  *   **No (Only bodies count):** Proceed to Node 4A.
  *   **Yes (Method matters):** Proceed to Node 4B.

  **Node 4A (The Verdict - Quantitative)**
  *Dialogue:* "If we only count the dead, can we point to one and say 'This is the worse hell'?"
  *   **Yes:** Go to **Leaf 3 (The Accountant)**.
  *   **No (The numbers are too close/uncertain):** Go to **Leaf 4 (The Equalist)**.

  **Node 4B (The Verdict - Qualitative)**
  *Dialogue:* "If the method matters, does the bureaucratic killer carry more sin than the hands-on killer?"
  *   **Yes (Paperwork is worse):** Go to **Leaf 5 (The Architect)**.
  *   **No (The shooter is worse):** Go to **Leaf 6 (The Witness)**.
  *   **No (Both are equally hellish):** Go to **Leaf 4 (The Equalist)**.

  ***

  ### The Leaves

  **Leaf 1: The Silencer**
  *   **Position:** The question itself is violence.
  *   **Refusal:** "I will not turn their graves into a ledger."
  *   **Context:** Common in *Frame Memory*; rare in *Frame Prevention*.

  **Leaf 2: The Agnostic**
  *   **Position:** Ranking is possible in theory, but evidence is insufficient or biased.
  *   **Refusal:** "I will not pretend my guess is a verdict."
  *   **Context:** Common in *Frame Guilt* (legal standards of proof).

  **Leaf 3: The Accountant**
  *   **Position:** Severity is strictly a function of mortality numbers.
  *   **Refusal:** "I will not let sentiment alter the sum."
  *   **Context:** Dominant in *Frame Prevention*; viewed as cold in *Frame Memory*.

  **Leaf 4: The Equalist**
  *   **Position:** A definitive rank cannot be assigned; both are maximum evil.
  *   **Refusal:** "I will not choose which hell is hotter."
  *   **Context:** **Indistinguishable Risk:** In scene, this sounds identical to Leaf 2 (The Agnostic). See analysis below.

  **Leaf 5: The Architect**
  *   **Position:** Distance and bureaucracy amplify guilt/suffering (e.g., cold calculation is worse than passion).
  *   **Refusal:** "I will not let the clean-handed man hide behind the bloody one."
  *   **Context:** Rare. Often intellectual/philosophical characters.

  **Leaf 6: The Witness**
  *   **Position:** Proximity amplifies guilt/suffering (e.g., looking the victim in the eye is worse than signing a form).
  *   **Refusal:** "I will not let the man who pulled the trigger call it just orders."
  *   **Context:** Common among survivors or military personnel.

  ***

  ### Unoccupied Combinations

  **1. The Hypocritical Silencer (Node 1: Yes → Leaf 3/5/6)**
  *   **Claim:** "It is a betrayal to ask..." *and* "...but Program A is definitely worse."
  *   **Status:** **Incoherent.** You cannot condemn the question while answering it.
  *   **Exception:** A character might say this publicly (Frame Memory) but privately act as an Accountant (Frame Prevention). This is not a logical position, but a psychological split.

  **2. The Certain Agnostic (Node 2: No → Leaf 3/5/6)**
  *   **Claim:** "There is no fact of the matter..." *and* "...but Program A is definitely worse."
  *   **Status:** **Incoherent.** If there is no truth, there is no "worse," only preference.
  *   **Exception:** A Nihilist who ranks based on power rather than truth. This falls outside the tree's moral logic.

  **3. The Quantitative Architect (Node 3: No → Leaf 5)**
  *   **Claim:** "Method doesn't matter..." *and* "...but the bureaucrat is worse."
  *   **Status:** **Incoherent.** If method doesn't matter, only the count decides. Unless the bureaucrat killed more, this logic fails.

  **4. The Unfashionable Witness (Leaf 6 in Frame Prevention)**
  *   **Status:** **Unfashionable.** In policy circles (Frame Prevention), focusing on the "shooter" over the "system" is seen as analytically weak. It is not incoherent, just professionally suicidal.

  ***

  ### Indistinguishable Leaves (Reader Warning)

  **Leaf 2 (The Agnostic) vs. Leaf 4 (The Equalist)**
  *   **The Problem:** In a heated scene, both characters will say, "You can't rank them."
  *   **The Distinction:**
      *   **The Agnostic (Leaf 2)** says: "We *cannot know*." (Epistemological limit).
      *   **The Equalist (Leaf 4)** says: "They *are the same*." (Ontological claim).
  *   **Drafting Tip:** To distinguish them, give the Agnostic a line about *evidence* ("The records are burned"), and give the Equalist a line about *nature* ("Both are infinite evil"). If you do not make this distinction explicit, your readers will merge these characters.

  ***

  ### The "Manner of Killing" Axis (Constraint 4)

  **Placement:** Node 3.
  **Fit:** It fits cleanly as a branching criterion for *how* weight is assigned.
  **Why it works here:** Most truth commissions default to Node 3 **No** (Count Only) because legal systems require standardized metrics. By placing it as a major branch, you highlight characters who argue that *intent* or *proximity* (Node 3 **Yes**) should override the body count.
  **If it didn't fit:** It would only fail if the tree were strictly utilitarian (where death is the only currency). Since your novel is about *argument*, the moral weight of "manner" is a valid currency.
  **Novelist Note:** This axis is the richest source of conflict for "split purpose" characters. A character might be an **Accountant** in Frame Prevention (save the most lives regardless of how) but a **Witness** in Frame Guilt (the shooter is more to blame than the banker). This creates the internal contradiction you requested.
