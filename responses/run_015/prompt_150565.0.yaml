answer: |-
  This is a sharp set of puzzles. You've identified exactly where the friction lies between the *epistemic* machinery of KNA and the *communicative* reality of assertion. The reason you're going in circles is likely because you are trying to make KNA do three different jobs at once: (1) certify the speaker's warrant, (2) guarantee the sincerity of the speaker, and (3) ensure the communicative success of the utterance.

  KNA can only do the first one. To untangle the knot, you need to separate the **Norm of Warrant** (KNA proper) from the **Norm of Sincerity** and the **Norm of Communication**.

  Here is the machinery to place your five cases.

  ### 1. The Liar (Case B) and the "Fudge" Worry
  You asked: *Is KNA handling the liar only because knowledge entails belief, and is that a fudge?*

  **Verdict:** It is a fudge, or at least a category error.

  If B "knows it's noon" but "doesn't believe it," B is in an impossible epistemic state by standard lights (knowledge entails belief). If B doesn't believe it, B doesn't know it. So, technically, KNA forbids B from asserting. But your intuition is correct: the *reason* B is defective isn't epistemic; it's moral/psychological.

  If we fix the case so B *believes* it's midnight (false belief) but says "noon" to trick the hearer, then B definitely doesn't *know* it's noon. KNA forbids this. But again, the primary violation is **Sincerity**, not Knowledge.

  **The Machinery:** You need to distinguish two norms:
  *   **The Epistemic Norm (KNA):** Assert $p$ only if you are in a position to know $p$.
  *   **The Sincerity Norm:** Assert $p$ only if you believe $p$.

  KNA proponents often claim Sincerity "falls out" of KNA because Knowledge entails Belief. But this collapses the distinction between *being wrong* (asserting without knowledge) and *lying* (asserting without belief).
  *   **Case E (The Guesser)** violates the Epistemic Norm but satisfies the Sincerity Norm.
  *   **Case B (The Liar)** violates the Sincerity Norm (and consequently the Epistemic Norm).

  If you treat KNA as the *sole* norm, you lose the ability to distinguish the specific wrongness of lying from the specific wrongness of guessing. The "fudge" is real: KNA catches the liar only by riding on the back of the belief condition of knowledge, not because assertion inherently forbids deception.

  ### 2. The Hearer Asymmetry (Cases C, D, E)
  You asked: *How can the basic norm be speaker-side if assertion is something you do to someone?*

  **Verdict:** KNA governs the **move**, not the **game**.

  You are conflating the *conditions for making a move* with the *conditions for winning the game*.
  *   **KNA is an Entry Condition:** It dictates when you are licensed to put a proposition into the conversational common ground. It is strictly speaker-side because it concerns your authority to represent reality.
  *   **Gricean/Communicative Norms are Success Conditions:** They dictate whether that move *does* anything useful for the hearer.

  Let's apply this to your cases:

  *   **Case C (Timezone Trick):** Satisfies KNA (Speaker knows). Violates the **Norm of Cooperation** (intentionally allowing misunderstanding). This is a communicative defect, not an assertoric one. C has successfully asserted; they have just done so maliciously.
  *   **Case D (Preaching to Choir):** Satisfies KNA (Speaker knows). Violates the **Norm of Informativeness**. It is a pointless assertion, but not an *unwarranted* one.
  *   **Case E (Lucky Guess):** Violates KNA. Satisfies Norm of Cooperation (hearer gets true info).

  **The Asymmetry Resolved:**
  The asymmetry exists because assertion is a **unidirectional transfer of warrant**.
  When I assert, I am offering you my *authority* as a reason for you to believe.
  *   If I don't know (Case E), I am offering counterfeit authority. It doesn't matter if you happen to have the calendar open (consequential luck); I still offered counterfeit goods.
  *   If I know but you misunderstand (Case C), I offered real authority, but you didn't accept it properly. That's on the uptake, not the issue.

  **The Brick Wall Test:**
  You asked what is wrong with asserting to a brick wall.
  *   **On the KNA view:** Nothing is wrong with the *assertion*. It is a perfectly valid move. It is just a futile one.
  *   **On a Hearer-Dependent view:** It's not an assertion at all because there is no uptake.

  If you accept KNA, you must accept that assertion is **agent-relative**. It is the act of *committing oneself to the truth of p*. Whether anyone receives that commitment is secondary. Asserting to a diary is still an assertion (you are recording your commitment). Asserting to a wall is an assertion (you are exercising the capacity). The "point" of assertion (communication) is distinct from the "nature" of assertion (commitment based on knowledge).

  ### 3. Constitutive Norms and Violations
  You asked: *How can a norm be constitutive if people violate it and still assert? Is B's utterance a defective assertion or not an assertion at all?*

  **Verdict:** You need a distinction between **Null Acts** and **Defective Acts**.

  The "Constitutive" label is often overloaded. In speech act theory, we need to distinguish between violating a **Felicity Condition** (which makes an act infelicitous but real) vs. violating a **Definition** (which makes the act null).

  *   **Null Act (Stage Promise):** When an actor says "I promise" on stage, the context (theatrical convention) suspends the illocutionary force. No commitment is undertaken. This is not a promise.
  *   **Defective Act (Liar/Guesser):** When a liar says "I promise" or "I know," they *do* undertake the commitment, but they are in a position where they cannot fulfill it.

  **Applying this to KNA:**
  KNA is best understood as a **Normative Constitutive Rule**.
  *   *Rule:* "Assertion is the act governed by the norm: Assert $p$ only if you know $p$."
  *   *Violation:* If you assert without knowing, you are still performing the act of assertion, but you are performing it **improperly**.

  Think of it like **Driving**.
  *   The rules of the road are constitutive of the practice of lawful driving.
  *   If you drive on the wrong side of the street, you are still *driving*. You haven't suddenly started "flying." But you are driving *illegally/defectively*.
  *   If you sit in a parked car and pretend to drive, you are *not driving*. (This is the Stage Actor).

  **Mapping your cases to this machinery:**
  *   **A (Normal):** Lawful driving.
  *   **B (Liar):** Driving on the wrong side of the road *and* pretending to be someone else. (Defective Assertion).
  *   **C (Timezone):** Driving legally but leading someone into a ditch. (Defective Communication).
  *   **D (Redundant):** Driving in circles. (Pointless Assertion).
  *   **E (Guesser):** Driving without a license. (Defective Assertion).

  **Why we report "B asserted":**
  We report "B asserted" because the **Illocutionary Force** was achieved. B committed himself to the truth of $p$ in the eyes of the hearer. The hearer is now entitled to hold B accountable ("You said it was noon!"). If it weren't an assertion, B could say "Oh, I wasn't actually asserting, just making a noise." The fact that B is blameworthy proves the assertion happened.

  ### Summary of the Machinery

  To stop going in circles, you need to triage the defects. Your cases aren't all challenging the same thing.

  1.  **Split the Norms:**
      *   **KNA (Epistemic):** Governs the speaker's right to commit. Violated by **E**.
      *   **Sincerity (Psychological):** Governs the speaker's belief. Violated by **B**.
      *   **Cooperation (Communicative):** Governs the hearer's understanding/utility. Violated by **C** and **D**.

  2.  **Resolve the Asymmetry:**
      *   Assertion is the *offering* of knowledge, not the *successful transmission* of knowledge.
      *   Speaker-side norms govern the *offer*. Hearer-side norms govern the *uptake*.
      *   KNA is about the offer. That is why it ignores the brick wall.

  3.  **Refine "Constitutive":**
      *   Violating KNA makes an assertion **unwarranted/defective**, not **null**.
      *   Nullity (Stage) comes from lacking *Illocutionary Intent*.
      *   Defectiveness (Liar/Guesser) comes from lacking *Epistemic/Sincere Warrant*.

  **Which case is doing no work?**
  **Case D** is the weakest link. It's not a problem for KNA; it's a problem for the Maxim of Quantity. It doesn't challenge the norm of assertion; it challenges the pragmatics of conversation. You can safely set D aside when evaluating KNA.

  **Case B** is the most dangerous for KNA *only if* you insist KNA is the *only* norm. If you admit a separate Sincerity Norm, B is handled elsewhere, and KNA is free to focus on E (the guesser), which is its true battleground.

  **Case C** is the strongest argument against KNA being the *whole story* of assertion's value, but it doesn't refute KNA as a *necessary condition*. It just shows KNA is not sufficient for *good* communication.

  The knot untangles when you stop asking KNA to explain why lying is bad (that's sincerity) or why misleading is bad (that's cooperation), and let it just explain why guessing is bad (that's warrant).
