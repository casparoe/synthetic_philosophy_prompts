      *   **Topic:** Clinical brain-computer interface (BCI) trials for motor restoration.
      *   **Conflict:** Engineering practice decodes *pre-conscious* neural signals (readiness potential style) as "intended" movements, while ethical/legal frameworks (informed consent, accountability) treat the patient as a *conscious*, autonomous agent.
      *   **Task:** Reconstruct the implicit theory of agency, moral responsibility, and causal control presupposed by this pairing. Evaluate if it treats neural dynamics as "real" causes and awareness as epiphenomenal. Assess reconcilability with consent practices. Consider compatibilist/hierarchical accounts. Distinguish strict requirements from good fits. Identify philosophical underdetermination. Specify changes needed if conscious awareness were deemed causally necessary.
      *   **Constraint:** Lead with the bottom line in the first sentence. No preamble. No restating the question.

  2.  **Deconstruct the Conflict:**
      *   *Engineering Side:* Uses neural activity (motor/premotor cortex) occurring *before* conscious awareness (Libet-style) to trigger devices. This implies the neural activity *is* the intention/command.
      *   *Ethical/Legal Side:* Requires informed consent (conscious understanding), capacity assessment (conscious reasoning), and holds patients responsible for misuse (assumes conscious control).
      *   *Tension:* If the "real" action starts before consciousness, is the conscious "I" just watching? If so, how can the conscious "I" consent or be responsible?

  3.  **Identify the Implicit Theory:**
      *   The practice implicitly adopts a *functionalist compatibilism* or a *two-level account of agency*. It treats the sub-personal neural mechanism as the *execution* channel while retaining the personal-level conscious agent as the *authorizing* source.
      *   It does *not* necessarily commit to hard determinism or epiphenomenalism about consciousness, though it risks looking like it.
      *   It presupposes that "intention" is identifiable in neural substrate prior to phenomenological report, but that "agency" and "responsibility" belong to the whole person over time, not just the moment of firing.
      *   *Bottom Line:* The practice presupposes a compatibilist, two-level theory of agency that decouples the *mechanism of execution* (pre-conscious neural dynamics) from the *locus of authorization* (conscious, deliberative self), thereby treating neural signals as valid proxies for volition without rendering conscious awareness causally inert.

  4.  **Evaluate Reconcilability:**
      *   Can pre-report signals be authoritative without undermining autonomy? Yes, if autonomy is defined as alignment with higher-order desires/values (Frankfurt-style hierarchical model) rather than immediate conscious initiation.
      *   Consent practices require conscious understanding *ex ante* (before the trial) and *ex post* (accountability), not necessarily conscious initiation of every micro-movement *in situ*.
      *   Philosophical Underdetermination: The practice doesn't strictly require consciousness to be epiphenomenal; it only requires neural signals to be *correlates* or *constituents* of intention that are reliable enough for control. It leaves open whether consciousness plays a veto role (Libet's "free won't") or a shaping role.

  5.  **Determine Strict Requirements vs. Good Fits:**
      *   *Strictly Required:* Reliable correlation between neural state and desired outcome; legal personhood status for the patient.
      *   *Good Fit (but not required):* The idea that the neural signal *is* the intention (rather than a precursor); the idea that consciousness is merely retrospective.
      *   *Underdetermined:* The causal role of consciousness in *forming* the intention vs. *executing* it.

  6.  **Analyze Changes if Conscious Awareness were Causally Necessary:**
      *   If conscious awareness were required for *genuine agency* (libertarian or strong conscious-causation view):
          *   BCI decoding would need to wait for conscious report (impossible for paralyzed users often).
          *   Consent would need continuous reaffirmation.
          *   Accountability for "misuse" (e.g., accidental movement) would vanish if the movement was pre-conscious.
          *   Trial design would need "veto" mechanisms explicitly trained and monitored.

