answer: |-
  The institutional pairing presupposes a compatibilist, two-level theory of agency that identifies volition with specific neural processes accessible prior to conscious report, thereby treating sub-personal dynamics as the mechanism of control while retaining the conscious person as the locus of authorization and accountability. This framework distinguishes between the *mechanism of execution*, which operates on millisecond timescales in motor cortex, and the *locus of authorization*, which operates on the timescale of deliberative identity and legal personhood. By adopting this view, the practice avoids committing to hard determinism or epiphenomenalism; it does not treat conscious awareness as causally inert, but rather as a higher-order state that validates and owns the lower-level neural cascades even if it does not initiate them temporally. Consequently, the "intention" decoded by the BCI is not viewed as a distinct event from the patient's will, but as the earliest detectable physiological constituent of that will, allowing engineers to bypass the latency of phenomenological report without bypassing the agent herself.

  This reconstruction reconciles the engineering logic with ethical protocols by treating informed consent as a standing authorization rather than a concurrent command. Consent practices require that the agent consciously understands the risks and aligns the device with their values *ex ante*, establishing a hierarchical structure where the conscious self authorizes the subconscious machinery to act on its behalf. Moral responsibility is similarly preserved because accountability attaches to the adoption of the device and the cultivation of the neural patterns required to operate it, not to the micro-temporal initiation of each spike. The patient is responsible because the neural dynamics decoded are recognized as *their* dynamics, shaped by their training and goals, even if the conscious awareness of the specific movement lags behind the neural trigger.

  Philosophically, the practice is underdetermined regarding the precise causal role of consciousness. Strictly, the trial design requires only that neural signals reliably correlate with desired outcomes and that the patient possesses legal capacity; it does not strictly require that consciousness be epiphenomenal, only that it is not a necessary bottleneck for signal transmission. While the design fits well with a view that consciousness serves a monitoring or veto function (Libet's "free won't"), it does not demand it. The system functions regardless of whether consciousness shapes the neural preparation or merely observes it, provided the correlation holds. However, if the institution replaced its implicit view with one on which conscious awareness is causally necessary for genuine agency—such as a libertarian or strong conscious-causation account—trial design and ethical review would require radical alteration. Decoding pre-conscious signals would become ethically impermissible as it would constitute acting *on* the patient rather than *for* them, requiring the insertion of a "conscious gate" that waits for phenomenological confirmation before actuation, effectively negating the utility for paralyzed users. Furthermore, accountability for device misuse would shift from the patient to the manufacturers for any action initiated pre-consciously, and informed consent would need to be granular and concurrent for each action rather than a standing agreement, as the patient could not be deemed the author of actions preceding their awareness.
