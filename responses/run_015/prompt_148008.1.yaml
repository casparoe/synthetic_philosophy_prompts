answer: |-
  Six decades ago, the Republic of Meridia ceased its mandatory assimilation program that placed children of the Kaelic linguistic minority into state boarding schools where their native tongue was punished and erased. The last direct survivor of the program died five years ago, and the current Kaelic-descended citizens enjoy full legal equality, economic parity with the majority, and have explicitly dissolved their representative advocacy group, citing no remaining grievances or claims for restitution. There is no material reparation possible since the victims are dead and descendants suffer no disadvantage, yet the historical record remains contested in public discourse, with state archives still officially labeling the policy as "educational standardization" rather than suppression, and no living party possesses the standing to litigate or demand further engagement.

  On the optimal expressive account, the state is strictly required to apologize because the duty of recognition survives the death of the victims; the state's continued archival classification of the policy as "standardization" constitutes an ongoing expressive harm that denies the moral standing of the Kaelic people, and an apology serves as the necessary truth-act to correct the historical record regardless of material consequences. Conversely, on the optimal closure-sensitive reparative account, the apology is impermissible because it functions as a symbolic settlement that falsely signals moral equilibrium where none can be achieved; since the wound is irreparable and no living claimants exist to accept the settlement, the apology acts as a unilateral declaration that the debt is paid, thereby dishonorably sealing a wound that should remain open in collective memory.

  The structural feature forcing this divergence is the **performative finality of moral timestamping**. As defined, the apology records the wrong in historical memory without altering present entitlements or reopening a live claim. For the expressive theorist, this timestamp is the goal: it fixes the moral coordinate of the event as "wrong" without needing to change present distributions. For the reparative theorist, this timestamp is the hazard: by recording the wrong without altering entitlements (because none can be altered), the apology creates a misleading appearance of resolution, effectively closing the books on an irreparable injustice. If this feature were removed—for instance, if the apology were structurally coupled with a permanent, non-closing memorialization fund that explicitly rejected the notion of settlement—the reparative account would likely converge with the expressive one, permitting the apology as part of an ongoing engagement rather than a closing transaction.

  A defender of the reparative account would attack the expressive verdict by arguing that it prioritizes the state's moral self-conception over the reality of the harm, turning the apology into a cost-free virtue signal that allows the majority to feel absolved without actually addressing the unaddressable loss. A defender of the expressive account would attack the reparative verdict by arguing that it holds moral truth hostage to practical utility, effectively granting the state a license to lie about history simply because paying the full price of justice is impossible.

  Verdict: The Performative Finality of Moral Timestamping
