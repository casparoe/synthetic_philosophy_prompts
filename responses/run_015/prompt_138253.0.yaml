answer: |-
  You have identified a distinction that is genuinely present in the landscape of moral theory but is often obscured because it is habitually lumped into the "demandingness objection." Your intuition is correct: **cost** (the welfare/resource drain) and **pervasiveness** (the claim on deliberative space and time) are analytically distinct dimensions, and they pull in different directions.

  There is no single, canonical noun phrase in the literature equivalent to "The Demandingness Objection" that captures *only* this second dimension. However, the concept is discussed under a cluster of headings: **deliberative cost**, **moral silence**, and **the scope of moral authority**.

  Here is the shape of the thing, how it relates to its neighbors, and an account of your three specific questions.

  ### 1. The Shape of the Concept: Deliberative Pervasiveness

  The dimension you are isolating is best described as **Deliberative Pervasiveness**.

  While "demandingness" measures the *depth* of the sacrifice (how much well-being you lose), pervasiveness measures the *breadth* of the claim (how much of your cognitive and temporal landscape is subject to moral evaluation).

  *   **High Cost / Low Pervasiveness:** A conscript soldier deployed for one year. The cost is extreme (risk of death, loss of liberty), but the duty is discrete. There is a clear "before" and "after," and during the deployment, the rules are explicit. You can "clock on" and "clock off."
  *   **Low Cost / High Pervasiveness:** The "constant lookout" case you described. The cost is trivial (minutes a day), but the duty is continuous. It colonizes the background of your consciousness. You cannot clock off because the opportunity for optimization is omnipresent.

  In the literature, this is often treated as a sub-component of **deliberative cost** (discussed by rule consequentialists like Brad Hooker). Hooker argues that a moral code must be evaluated partly by how much mental energy it consumes to follow. However, your insight goes deeper than "mental energy." It is about **interruption** and **jurisdiction**. A pervasive duty asserts that morality has *jurisdiction* over moments that were previously considered morally neutral.

  ### 2. Relation to Neighboring Concepts

  Here is where the edges lie between your concept and the standard objections your friend raised.

  **A. The Demandingness Objection (Welfare Cost)**
  *   **The Match:** Both complain that morality takes too much.
  *   **The Edge:** Demandingness is scalar and outcome-focused (how much utility/welfare is lost?). Pervasiveness is structural and process-focused (how many decisions are moralized?).
  *   **Why it fails your cases:** As you noted, the aid worker case is high-demandingness but low-pervasiveness (in terms of constant re-evaluation). The pension case is low-demandingness but high-pervasiveness. If the objection were purely about welfare loss, the aid worker should bother you more. She doesn't.

  **B. The Integrity Complaint (Williams)**
  *   **The Match:** Both worry about morality alienating the agent from their life.
  *   **The Edge:** Williams' integrity objection is about *identity*: morality forcing you to abandon your "ground projects" (what makes you *you*). Your objection holds even if the agent *has* made morality their ground project.
  *   **Why it fails your cases:** You said the complaint applies even to those who have made impact their friendship and project. The issue isn't that morality displaces their identity; it's that the *structure* of the requirement allows no respite. It is about the *rhythm* of the life, not the content.

  **C. The Disappearance of the Supererogatory**
  *   **The Match:** Both lament the loss of "optional" good deeds.
  *   **The Edge:** Supererogation is about the *status of the act* (is it required?). Pervasiveness is about the *status of the time*.
  *   **Why it fails your cases:** You can have a theory with no supererogatory acts that still allows for "moral silence." For example, a duty to give 10% is exhaustive (no supererogation), but once paid, you are off-duty. A theory can eliminate the supererogatory without being pervasive. Your complaint is about the *continuous live-wire* nature of the duty, not just that everything is required.

  **D. Satisficing Consequentialism**
  *   **The Match:** Satisficing (doing "good enough") creates a stopping point, reducing pervasiveness.
  *   **The Edge:** Satisficing is a *mechanism* to reduce pervasiveness, not the name of the problem itself.
  *   **Why it fails your cases:** One could have a "satisficing" duty that is still pervasive (e.g., "continuously ensure you are never below the threshold"). The key is not the *level* of the bar, but the *frequency of the check*.

  **E. The Agent-Centred Prerogative (Scheffler)**
  *   **The Match:** This prerogative creates a protected sphere where you can pursue your own interests.
  *   **The Edge:** The prerogative protects *choices*, but not necessarily *deliberative space*.
  *   **Why it fails your cases:** You can have a prerogative to keep your money, but still feel a pervasive *pressure* to justify not giving it. The pervasiveness you describe is often social or psychological (the "atmosphere in the room"), which a formal prerogative doesn't always dissolve.

  ### 3. Addressing Your Three Questions

  **(i) Does this discriminate between theories? (The Non-Consequentialist Problem)**
  You asked if ordinary non-consequentialist views turn out to be pervasive too. **Yes, they often are.** This is the strongest evidence that you have found a real dimension distinct from "consequentialist demandingness."
  *   **Virtue Ethics:** Often *more* pervasive than act-consequentialism. A consequentialist can calculate a donation and stop. A virtue ethicist is required to cultivate character *at all times*. There is no "clocking off" from being honest, courageous, or kind.
  *   **Care Ethics:** Explicitly relational and continuous. You cannot "discharge" your duty to a child or partner and be done.
  *   **Implication:** If your objection holds, it indicts Virtue Ethics and Care Ethics just as hard as Maximizing Consequentialism. It suggests the problem isn't *consequentialism*; it's **comprehensive moral doctrines** that lack "moral holidays." This means the demandingness debate *has* been aimed at the wrong target if it assumes only consequentialism is invasive.

  **(ii) Is pervasiveness just hidden cost? (The Attention Currency)**
  You asked if "cheap but pervasive" is just costly in attention/decision fatigue.
  *   **The Collapse Argument:** Yes, cognitive load is a cost. If we count "minutes spent worrying" as a welfare cost, the dimensions collapse.
  *   **Why they remain distinct:** It is not just the *volume* of attention, but the **interruptibility**.
      *   *Case A:* A surgeon works 12 hours straight (high cost, high focus).
      *   *Case B:* A parent of a sick child sleeps in 20-minute intervals (lower total hours, but fragmented).
      *   Case B is often experienced as more exhausting, not because of total energy, but because of the **loss of autonomy over time**.
      *   **The Test:** If I could guarantee you that the "constant lookout" duty required zero cognitive strain (it was automatic, like breathing), would it still bother you? If the answer is "Yes, because it's not *my* choice to breathe," then it is not about attention cost. It is about **authority**.

  **(iii) Is this about Authority? (The Legitimacy Hypothesis)**
  You suspect the complaint is about "the kind of authority the requirement claims." **This is the most philosophically fertile ground.**
  *   **Moral Jurisdiction:** Your "clocking off" metaphor is juridical. You are arguing for a limit on morality's *jurisdiction*.
  *   **Deliberative Sovereignty:** The aid worker case is a voluntary enlistment in a high-cost zone. The pension case is a conscription into a low-cost zone. The objection is that morality is claiming **sovereignty** over deliberative spaces where it has no legitimate business.
  *   **Why this fits:** It explains why the "atmosphere in the room" changes. The group isn't just asking for money; they are asserting a right to audit his reasoning. The objection is not "this is hard," but "this is not your place to ask."

  ### 4. A Proposal: "Deliberative Sovereignty"

  Since no single canonical term captures the *structural authority* aspect you are circling, I propose we define this as a claim to **Deliberative Sovereignty**.

  **Definition:**
  **Deliberative Sovereignty** is the agent's claim to a sphere of decision-making where moral reasons are not merely outweighed by other reasons, but are **inadmissible**. It is the right to act for non-moral reasons (preference, whim, aesthetic taste) without requiring moral justification.

  **How it differs from Supererogation:**
  Supererogation says: "You may do X, and it is good."
  Deliberative Sovereignty says: "You may do X, and morality has **no verdict**."

  **Boundary Cases (To decide what falls in and out):**

  1.  **The "Tax" Case (Falls OUT):**
      *   *Scenario:* The state requires you to file a tax return once a year. It costs money and time.
      *   *Verdict:* This is high cost, low pervasiveness. It does not violate Deliberative Sovereignty because it is a discrete transaction. You pay, you are done. Morality (via law) recedes.
      *   *Why:* It allows for "clocking off."

  2.  **The "Dietary" Case (Falls IN):**
      *   *Scenario:* A moral theory requires you to evaluate the ethical supply chain of every single food item you buy, forever.
      *   *Verdict:* This is low cost (per item), high pervasiveness. It violates Deliberative Sovereignty.
      *   *Why:* It turns a realm of preference (taste, convenience) into a realm of moral audit. It denies the right to "not think about it."

  3.  **The "Emergency" Case (Boundary Test):**
      *   *Scenario:* You walk past a drowning child. You have a duty to save them.
      *   *Verdict:* This is high cost (risk), high pervasiveness (must be alert?).
      *   *Distinction:* Most theories grant Deliberative Sovereignty *except* in emergencies. The violation occurs when the **emergency becomes the baseline**. Your giving circle friend is treating the structural injustice of the world as a continuous emergency, thereby dissolving the baseline where Sovereignty applies.

  ### Summary

  You have correctly identified that the "Demandingness Objection" is a conflation of **Welfare Cost** and **Deliberative Pervasiveness**.

  *   **The Concept:** Deliberative Pervasiveness (the claim on cognitive space).
  *   **The Value at Stake:** Deliberative Sovereignty (the right to zones of moral silence).
  *   **The Literature:** It hides in discussions of "deliberative cost" (Hooker) and "integrity" (Williams), but is distinct from both.
  *   **The Verdict:** Your friend is arguing about *magnitude* (how much you give). You are arguing about *jurisdiction* (where morality is allowed to speak). The aid worker accepts a magnitude limit but retains jurisdiction over her off-hours. The pension optimizer surrenders jurisdiction over his reasoning in exchange for low magnitude.

  The complaint is not that morality asks for too much; it is that it claims **too much territory**.
