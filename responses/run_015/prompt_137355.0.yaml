answer: |-
  # Spec for Group Mind Attribution: The Aunt Hillary Standard

  ## Preliminary Ruling: Intentionality vs. Phenomenology
  The list below concerns **intentionality** (beliefs, desires, goal-directedness) only. Demanding phenomenal consciousness (what it is *like* to be the colony) is a category error for this inquiry. Consciousness is a claim about subjective experience; intentionality is a claim about representational function and behavioural guidance. A system can track truth, fail to track truth, and act on that tracking without feeling anything. If we require the colony to *feel* united before we say it *believes* the nest is north, we conflate sentience with sapience. This excludes the 'hard problem' from the reading group's initial scope. If the colony passes the intentionality test, we may later ask if it suffers; but suffering is not a prerequisite for having a view on the world.

  ## The Desiderata

  **1. Explanatory Autonomy (Non-negotiable)**
  *Source: Redundancy worry + No double counting.*
  Attributing a state to the colony must yield predictions or explanations that are not equally well served by describing the individual ants. If 'The colony believes X' is merely a shorthand for 'Ant 1 did A, Ant 2 did B...', the attribution is eliminable. The colony-level description must capture a pattern in the data that vanishes at the individual level. Furthermore, the theory must specify the causal relation between the colony-state and the ant-states to avoid overdetermination. The colony causes the move *by* organising the ants, not *in addition to* the ants moving.
  *Portability:* Applies to firms (policy vs. employee action) and server farms (load balancing vs. packet routing).

  **2. Normative Detachability (Non-negotiable)**
  *Source: The colony can be wrong.*
  The system must support misrepresentation. It is not enough that the colony reliably moves north when food is north. It must be possible for the colony to 'believe' food is north when it is not, due to internal error rather than external disruption. The truth conditions of the belief must be distinct from the causal conditions that produced it. If the system is infallible, it is a thermometer, not a mind.
  *Portability:* Applies to algorithms (false positives) and slime moulds (growing towards a decoy nutrient).

  **3. Functional Portability (Non-negotiable)**
  *Source: Gradual replacement + Swap case + Slave-making.*
  The mentality must supervene on the organisation, not the substrate. If we swap ants for functionally identical robots, or swap the workforce between nests, the mental states should follow the functional structure, not the biomass. Genetic relatedness is irrelevant; a colony of slave-makers possesses the same cognitive architecture as a colony of kin. This rules out biological essentialism.
  *Portability:* Crucial for server farms and AI swarms where substrate is silicon.

  **4. Informational Integration (Negotiable)**
  *Source: House-hunting + Memory without a rememberer.*
  The colony must possess information that no single member possesses. This requires a mechanism for aggregating distributed data (scout reports) into a unified state (decision to move). Memory must be stored in the system's structure (trails, architecture, worker distribution) rather than individual longevity. However, the *degree* of integration required is debatable; loose coupling might suffice for weak belief, tight coupling for strong agency.
  *Portability:* Applies to corporate knowledge bases and distributed ledgers.

  **5. Boundary Determinacy (Negotiable)**
  *Source: Too many minds + Fission.*
  The theory must provide principled criteria for where the mind begins and ends. It cannot be that every overlapping subset of ants constitutes a mind. In fission, the theory must specify whether identity is preserved by continuity of structure, continuity of matter, or split. However, demanding sharp boundaries may be unrealistic for biological systems which are inherently vague.
  *Portability:* Difficult for firms with contractors, or slime moulds which physically merge and split.

  ## Tensions and Collisions

  There is a significant collision between **Boundary Determinacy** and **Functional Portability**. Functional Portability implies that if the organisation is preserved, the mind is preserved. But biological organisation is often fuzzy (the Sorites problem in Gradual Replacement). If we insist on Determinacy, we may have to draw arbitrary lines (e.g., '51% of original ants'), which violates the spirit of Portability. If we accept vagueness, we risk the 'Too Many Minds' explosion. You cannot have perfectly sharp boundaries and perfectly substrate-neutral gradualism simultaneously.

  A second tension exists between **Explanatory Autonomy** and **Causal Closure**. If the physical world is causally closed at the micro-level (ant movements), it is difficult to show how the macro-level (colony belief) exerts *new* causal power without overdetermination. Autonomy requires the macro-level to do work; physics suggests the micro-level does all the pushing. Resolving this requires a robust account of realisation, not just correlation.

  ## Weighting the Requirements

  **Most Work:** **Explanatory Autonomy.** This is the hammer. Most candidate systems fail here. It is easy to show a colony *acts* like it has beliefs; it is very hard to show that positing the belief explains anything better than positing local ant interactions. This requirement kills the 'poetic metaphor' accounts.

  **Least Work:** **Boundary Determinacy.** In practice, this requirement is almost impossible to satisfy for biological systems without stipulation. It forces artificial precision onto messy natural kinds. While theoretically important, it rarely settles the debate because proponents can always argue the boundary is slightly fuzzy. It is the first requirement to be compromised.

  ## Scoring Stock Positions

  **As-If Instrumentalism:** Passes Boundary Determinacy easily (boundaries are our choice) but fails Explanatory Autonomy by definition. It treats colony beliefs as useful fictions. It survives the Sorites but concedes the reality of the mind.

  **Realiser Functionalism:** Strong on Explanatory Autonomy and Functional Portability. It identifies the mind with the causal role, regardless of substrate. However, it struggles with Boundary Determinacy in cases of fission or merging, as functional roles can overlap. It is the strongest candidate for a literal reading.

  **Superorganism (Unit of Selection):** Strong on Informational Integration and Normative Detachability (evolutionary errors count). Weak on Functional Portability, as it often relies on genetic relatedness to define the unit. It risks excluding slave-making colonies or artificial swarms.

  **Plain Eliminativism:** Passes all tests by denying the premise. It argues Explanatory Autonomy is never met; only ant-level physics is real. It is the safest position but offers the least insight into the systemic behaviour we observe. It wins on parsimony, loses on utility.
