answer: |-
  The tension you've identified arises because the "whole business" actually layers three distinct definitions of identity that usually cooperate but occasionally expose their seams. Unicode operates on a **philological** definition: a character is an abstract unit of a writing system defined by its historical and linguistic provenance (script membership), which is why Latin "a" and Cyrillic "а" are distinct despite visual identity, and why CJK ideographs are unified despite visual variation. Font families operate on a **functional** definition: glyphs are interchangeable instances of a character if they serve the same semantic role within a styling system, which is why single-storey and double-storey "a"s are the same character despite the topological gap you noticed. Your morph rule operates on a **phenomenological** definition: identity is preserved only through continuous perceptual recognition.

  The reason your morph rule breaks on italics is that typography is a system of conventions, not just continuous shapes; the jump from double-storey to single-storey is a discrete stylistic switch, not a perceptual continuum, yet the *function* remains constant. A fallback tool built on your morph rule would prioritize visual fidelity over linguistic integrity, potentially substituting a Cyrillic glyph for a Latin character if the shape matched better, which would break search indexing, spellchecking, and screen readers that rely on script tags. Conversely, a tool built strictly on the Unicode view (as most are) prioritizes script membership, sometimes forcing a visual mismatch (like a generic CJK glyph) to preserve the correct linguistic data. The standards do not rely on family resemblance, because that would blur script boundaries, nor on shape, because that would fracture character unity across styles.

  The existing practice commits us to the view that character identity is fundamentally a matter of linguistic role and script membership rather than visual shape or perceptual continuity.

  \answer{ROLE}
