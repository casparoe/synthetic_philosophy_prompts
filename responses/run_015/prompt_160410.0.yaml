  1. Summary
  The market analogy captures the efficiency gains of moral trade but obscures crucial normative differences. While comparative advantage applies, moral trade lacks a common numeraire and enforceable contracts. Consequently, the claim that refusing trade is irrational holds only if you accept subjective valuation over objective impact. The analogy supports cooperation but cannot justify ignoring the moral quality of the counterparty's cause. It is a useful heuristic for coordination, not a moral free pass.

  2. The Mapping
  In markets, agents exchange private goods for personal consumption using money as a neutral measure. In moral trade, agents exchange donations for impersonal impact using 'moral value' as a contested measure.

  | Feature | Market Trade (Source) | Moral Trade (Target) |
  | :--- | :--- | :--- |
  | **Goods** | Private consumption items | Impersonal charitable impact |
  | **Budget** | Personal income | Altruistic budget |
  | **Comp Advantage** | Production efficiency | Cost-effectiveness per cause |
  | **Gains** | Increased utility for traders | Increased total moral value |
  | **Price** | Market clearing price | Exchange rate of moral worth |
  | **Enforcement** | Contract law | Social trust/reputation |
  | **Consumer** | The trader | Third-party beneficiaries |
  | **Numeraire** | Currency (objective) | Moral weight (subjective) |

  This mapping reveals the structural similarity: both rely on divergent valuations to create surplus. However, the 'consumer' separation is critical. In markets, I buy what I eat; in moral trade, I fund what you care about. The numeraire shift from currency to moral worth is the weakest link, as there is no objective exchange rate between saving a life and converting a soul. Enforcement relies on reputation rather than law, making default risk higher.

  3. Where it Holds
  The analogy holds robustly regarding efficiency mechanics. If you value cause A slightly more than B, and I value B slightly more than A, swapping donations increases satisfaction for both without extra cost. This is pure comparative advantage. The specialisation argument also stands: if you are better at earning money for charity than I am, or better at researching specific causes, trading allows us to leverage those skills. The 'gains from trade' conclusion is mathematically sound provided we accept subjective valuation. If both parties believe they are doing more good by swapping, the subjective expected utility rises. This makes the coordination element of moral trade genuinely analogous to market exchange; it solves a cooperation problem where both sides have slack resources they value differently. The incentive to find partners with divergent valuations is identical to finding partners with divergent production costs. Consequently, refusing to trade when valuations diverge is indeed inefficient relative to your own utility function, mirroring the market logic of leaving money on the table.

  4. Where it Breaks
  The analogy breaks critically where normative substance matters. Most significant is the lack of money as a common measuring rod. Market price aggregates value information. In moral trade, there is no objective exchange rate between saving a life and converting a soul. This undermines the conclusion that counterparty values are irrelevant. In markets, I don't care what you do with my cash because price signals efficiency. In moral trade, if your cause is harmful, my 'payment' facilitates harm. This is an externality markets price in but moral trade ignores.

  Secondly, the trader is rarely the consumer. In markets, I consume what I buy. In moral trade, beneficiaries are third parties who cannot consent. This breaks the 'no harm' assumption of voluntary exchange. If I trade for something harmful to them, I am complicit. This directly attacks the conclusion that counterparty values are irrelevant. If their cause is negative value, the trade is negative sum.

  Thirdly, enforcement differs. Market trade relies on contract law; moral trade relies on trust. Your flatmate's credit idea fails here. Delayed payment introduces default risk without legal recourse. This isn't cosmetic; it changes the risk calculus. Trading against future giving lacks the binding power of a loan agreement.

  The analogy imports features moral trade lacks: money as a common measuring rod, contract law, the trader also being the consumer, no third-party beneficiaries, and no externalities. Cosmetic breaks include the medium of exchange; cash versus direct donation is minor. However, the lack of a numeraire is fatal to the 'exchange rate' concept.

  Crucially, the conclusion we should trade more fails if the counterparty's cause is negative sum. Markets assume positive sum transactions; moral trade can be negative sum if one cause destroys value. The analogy assumes all voluntary trades are beneficial, true for private goods but false for public moral goods where externalities dominate. Therefore, principle-based refusal is rational when trade involves facilitating harm. The market analogy smuggles in the assumption that price equals value, contested in moral trade. Without contract law, 'credit' is merely a promise, vulnerable to time-inconsistency. Without a numeraire, you cannot calculate if the trade is truly value-positive overall, only subjectively. Structural efficiency exists, but the moral safety net of pricing is absent.

  5. My Three Cases
  Your flatmate's staggered credit proposal illustrates the enforcement break. In markets, delayed payment is a loan secured by law. Here, it is a promise secured by friendship. If she defaults in month two, you cannot sue; you only lose trust. This transforms the trade from a swap into a risk-bearing gift. It only works if the relationship value exceeds the financial risk, which complicates the 'clean win' narrative. The risk premium should theoretically adjust the exchange rate, but moral trade lacks the language for this.

  The mission trip trade highlights the externality break. Your climber believes bednets are waste; you believe missions are harmful. Trading here isn't positive-sum unless one of you is objectively wrong about the value. If missions are harmful, you are funding harm to gain bednets. The market analogy fails because there is no price signal to correct this; you are trading based on conflicting truth claims, not divergent preferences. Refusing this trade isn't leaving value on the table; it is avoiding complicity in harm. The market assumption that voluntary exchange implies mutual benefit fails when the 'goods' are moral claims about reality.

  Your extensions reveal the numeraire break. Trading with someone who wants cash for consumption treats your moral budget as income. This collapses the distinction between earning and giving, effectively monetising your altruism. It works only if you value their consumption morally, which contradicts the premise of effective giving. Trading against your future giving is essentially borrowing against your conscience. Without contract law, this relies on your future self honouring a debt to a stranger. This introduces time-inconsistency risks that markets solve with interest and collateral. Moral trade lacks these stabilisers, making long-term swaps fragile compared to immediate exchanges. You are betting on your own future integrity without a mechanism to enforce it.

  6. A Better Analogy
  A superior analogy is diplomatic treaty-making between states. States specialise in defence or aid, swapping support for mutual security gains. Like moral traders, states act on behalf of third parties (citizens) without their direct consent. There is no global contract law to enforce agreements, only reputation and reciprocity. Trade is refused on principle when treaties violate human rights, acknowledging that not all swaps are legitimate. This captures the enforcement risk, the third-party beneficiaries, and the normative constraints missing from market trade. It preserves the efficiency argument while admitting that principle-based refusal is rational when the partner's agenda is harmful. It frames moral trade as cooperation under uncertainty, not mere exchange.

  7. What Survives
  Only the first conclusion survives weakly: refusing trade *can* leave value on the table, but only if valuations diverge and causes are neutral. The second conclusion collapses; counterparty values matter immensely because of externalities and third-party harm. The third conclusion is conditional; we should trade more only within a trusted network of verified causes. The market framing supports coordination but not moral abdication. It justifies swapping bednets for animal welfare, but not bednets for mission trips. Efficiency is real, but moral risk exceeds the market analogy significantly.
