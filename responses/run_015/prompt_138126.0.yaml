      *   Eternalism $\neq$ Perdurantism.
      *   Eternalism = Times are equally real.
      *   Perdurantism = Objects have temporal parts.
      *   Endurantism = Objects are wholly present at times.
      *   You can be an Eternalist Endurantist (I am wholly present at $t_1$, and wholly present at $t_2$, and both $t_1$ and $t_2$ exist).
