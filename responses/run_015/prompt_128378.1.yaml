      *   *Correction:* The Cancer/Nobel case is often used to show that some reasons look like RKRs but are actually WKRs (or vice versa depending on the theory). I'll frame it as the "Instrumental vs. Constitutive" tension.

      *(Refining the AI Case)*: The AI rewards *true* belief. Truth is the aim of belief. So is this a WKR? If the theory says RKRs for belief are *evidence*, then yes, it's a WKR (pragmatic reward). If the theory says RKRs are *truth-conducive*, then maybe it's an RKR? This is a great stress test. I need to highlight this ambiguity.

      *(Refining the "Killer")*: The "State-Given/Object-Given" distinction was the dominant view for a long time. Counterexamples (like the "Guise of the Good" or specific admiration cases) killed it. So **Extensional Adequacy** is the right answer for what kills popular accounts.

      *(Typo Plan)*: I'll miss a comma or maybe spell "desiderata" wrong once? No, keep it readable but casual. Maybe "alot" instead of "a lot" or a missing apostrophe. Let's go with a missing apostrophe in "dont" or "im" (though the prompt used them). I'll slip one in like "its" instead of "it's".

