answer: |-
  hey, so youve hit on the exact spot where the literature gets messy. the WKR problem is basically a filter test: we need a theory that lets the Right-Kind Reasons (RKRs) pass through but catches the Wrong-Kind Reasons (WKRs), without breaking the machine in the process.

  here is the full checklist of desiderata you need to demand from any account, including that weird AI injection you mentioned.

  ### The WKR Desiderata Checklist

  **1. Extensional Adequacy (The "Get the Cases Right" Rule)**
  *   **Motivation:** The standard cases. The demon threatening your family unless you admire him (Parfit's demon), or the bribe to believe in climate change.
  *   **Requirement:** The theory must classify the demon's threat and the bribe as WKRs. It must classify the fact that the demon is cruel as an RKR *against* admiring him.
  *   **Status:** **Nonnegotiable.** If a theory says the demon threat makes the demon admirable, the theory is dead on arrival.
  *   **Tension:** This often fights with *Explanatory Depth*. It's easy to stipulate the right results, but hard to explain *why* without being circular.

  **2. The Non-Circularity Constraint**
  *   **Motivation:** Early attempts just defined RKRs as "reasons that make the attitude fitting." But "fitting" is just a synonym for "supported by RKRs."
  *   **Requirement:** The account must distinguish WKRs from RKRs using independent criteria (e.g., structure, source, or relation to the object) rather than just labeling them.
  *   **Status:** **Nonnegotiable.** Philosophical definitions cant be tautologies.
  *   **Tension:** This is where the **Object-Given vs. State-Given** distinction usually dies. It looks non-circular, but counterexamples show some state-given reasons act like RKRs.

  **3. The Doxastic Applicability (The Belief Constraint)**
  *   **Motivation:** The Climate Change Bribe & your **AI Tutor Case**.
  *   **Requirement:** The theory must handle belief, not just emotions or desires.
      *   *On the AI Case:* Suppose the AI gives a dopamine hit for *true* belief, but ignores evidence. Is this a WKR?
      *   *Analysis:* Yes, it should count as a WKR. Even though it tracks truth (the aim of belief), it bypasses the *proper basis* (evidence). If a theory allows this as an RKR, it permits epistemic irresponsibility. If it counts it as a WKR, it acknowledges that pragmatic rewards (even truth-tracking ones) are distinct from evidential support.
  *   **Status:** **Camp-Specific.** Evidentialists say this is nonnegotiable (only evidence counts). Pragmatists might argue that if it promotes the aim of belief (truth), it's partially right-kind.
  *   **Tension:** **The Instrumental/Demon Tension.** If you allow instrumental reasoning for belief (to satisfy the AI or avoid the demon), you risk validating wishful thinking. If you ban it entirely, you cant explain why its rational to take a pill to make yourself believe in a cure (Cancer-cure case).

  **4. The Guidance/Actionability Constraint**
  *   **Motivation:** The Cancer-Cure/Nobel-Prize case. You might have reason to *want* to want the cure (to motivate yourself), but that doesnt make the cure desirable.
  *   **Requirement:** The theory must distinguish between reasons to *bring about* an attitude (manipulation) vs. reasons that *justify* the attitude.
  *   **Status:** **Nonnegotiable.** We cant believe at will, but we can act to influence belief. The theory needs to parse this gap.
  *   **Tension:** Jointly unsatisfiable with **Strong Voluntarism**. If a theory assumes we can believe at will, it struggles to explain why pragmatic reasons are "wrong."

  **5. The Normative Force Preservation**
  *   **Motivation:** The Demon Case again.
  *   **Requirement:** The theory must acknowledge that WKRs are still *reasons* in some sense. It is rational to comply with the demon to save your family, even if the admiration is unfitting.
  *   **Status:** **Camp-Specific.** Fitting-Attitudes theorists sometimes try to say WKRs arent reasons for the attitude at all, but reasons for *wishing* you had the attitude. Pragmatists say they are genuine reasons for the attitude, just outweighed.
  *   **Tension:** If you say WKRs arent reasons for the attitude, you struggle to explain the rationality of compliance. If you say they are, you blur the line with RKRs.

  ---

  ### The Joint Unsatisfiability Flag 🚩

  The biggest headache is pairing **Doxastic Applicability** with **Normative Force Preservation**.

  *   **The Problem:** If you admit pragmatic reasons (like the AI reward or the Demon threat) are genuine reasons for *belief* (to preserve normative force), you violate the evidentialist norm that belief *only* responds to evidence.
  *   **The Conflict:** You want to say the demon gives you a reason to *desire* ice cream (ok), but not a reason to *believe* the demon is nice (not ok). A unified theory of reasons for attitudes struggles to treat belief differently from desire without looking ad-hoc.
  *   **Result:** Many theories sacrifice Doxastic Applicability. They say "WKR works for desire/admiration, but belief is special." That works, but it means the theory isnt general.

  ### The "Killer" Requirement

  The single requirement that eliminates the most popular accounts is **Extensional Adequacy**.

  Specifically, it killed the **State-Given vs. Object-Given** distinction. For a long time, everyone thought:
  *   RKR = Reason about the object (The demon is cruel).
  *   WKR = Reason about the state of having the attitude (The demon will kill me if I dont admire him).

  Then came the counterexamples (like the "Ecumenical" cases) where a reason about the *state* seemed to make the attitude fitting, or reasons about the *object* looked pragmatic. Once the cases showed the distinction didnt map perfectly onto the WKR/RKR split, that whole family of accounts got wiped out. Extensional adequacy is the executioner.

  ---

  ### Scoring the Views

  Here is how the two contenders you mentioned stack up against the checklist.

  **1. The Value-Relation View (e.g., Hieronymi, Way)**
  *   *Gist:* RKRs are those that bear on the "question" the attitude answers. Belief answers "Is it true?" Admiration answers "Is it good?"
  *   **Extensional Adequacy:** **High.** Handles the demon case well (threats dont make the demon good).
  *   **Non-Circularity:** **High.** Defines reasons via the constitutive aim of the attitude.
  *   **Doxastic Applicability:** **High.** Strictly evidentialist. The AI tutor case is a WKR because it doesnt answer "Is it true?" via evidence.
  *   **Weakness:** Struggles with **Normative Force Preservation**. It has to do gymnastics to explain why complying with the demon is rational if the threat isnt a reason for the attitude itself.
  *   **Score:** 8/10. Solid, but maybe too rigid on belief.

  **2. The Incentive-Dependence View (e.g., Schroeder)**
  *   *Gist:* WKRs are reasons that depend on the *incentive* of having the attitude, rather than the content.
  *   **Extensional Adequacy:** **Medium.** Good on standard cases, but gets fuzzy on the AI Tutor.
  *   **Non-Circularity:** **Medium.** "Incentive" can be tricky to define without smuggling in the WKR concept.
  *   **Doxastic Applicability:** **Low/Medium.** This is the trouble spot. If the AI reward is an incentive for truth, does it become an RKR? If the theory allows pragmatic incentives for belief, it risks the "wishful thinking" objection.
  *   **Weakness:** The **AI Tutor Case** is a stress test here. Since the reward tracks truth, an incentive view might accidentally classify it as an RKR, which evidentialists hate.
  *   **Score:** 6/10. More flexible, but leaks on the doxastic side.

  ### Quick Takeaway for your Seminar
  If you want to look sharp, focus on the **AI Tutor case**. It exposes whether a theory cares about the *source* of the reason (evidence vs. reward) or the *outcome* (truth). Most classic WKR theories were built on admiration/desire. Forcing them to handle doxastic rewards (especially truth-tracking ones) is where they usually squirm.

  hope this helps get your notes in order. good luck with the seminar!
