prompt: |-
  hey, im putting together notes for a philosophy seminar on the wrong-kind-reasons problem and i realized i dont actually know what im demanding of a theory. can you lay out the full desiderata — the checklist an adequate account has to satisfy? cover the usual suspects: the cancer-cure/nobel-prize case, the demon threatening your family unless you want ice cream, and the bribery-for-belief-in-climate-change setup. then also tackle this weird injection: suppose an AI tutor gives you tiny neural rewards every time you form a belief that is true, but the reward mechanism is blind to evidence and content — does that create wrong-kind reasons for belief, and should the theory cover doxastic wrong reasons too? for each desideratum, say what case or principle motivates it, mark whether its nonnegotiable or just camp-specific, and flag any pair that looks jointly unsatisfiable (maybe something about allowing instrumental reasoning without letting in the demon?). also tell me which single requirement eliminates the most popular accounts. finally, briefly score the value-relation view and the incentive-dependence view against the list. please use american english, and feel free to be casual — a typo or two is totally ok.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Wrong-Kind-Reasons (WKR) problem in philosophy (specifically regarding reasons for attitudes like belief, desire, admiration, etc.).
      *   **Task:** Lay out the full desiderata (checklist) for an adequate theory.
      *   **Specific Cases to Cover:**
          *   Cancer-cure/Nobel-prize (reasons for desire/intention).
          *   Demon threatening family unless you want ice cream (reasons for desire).
          *   Bribery for belief in climate change (reasons for belief).
          *   *New/Weird Injection:* AI tutor giving neural rewards for true beliefs (blind to evidence) -> Does this create WKR for belief? Should the theory cover doxastic wrong reasons?
      *   **Requirements for each Desideratum:**
          *   Motivating case/principle.
          *   Status (Nonnegotiable vs. Camp-specific).
          *   Flag joint unsatisfiability (tensions).
      *   **Specific Question:** Which single requirement eliminates the most popular accounts?
      *   **Evaluation:** Briefly score the "Value-Relation View" and the "Incentive-Dependence View" against the list.
      *   **Tone/Style:** American English, casual, typos allowed (simulated).
      *   **Goal:** Help the user understand what they are demanding of a theory.

  2.  **Deconstruct the WKR Problem:**
      *   The core issue: Distinguishing between reasons that count in favor of the *content* of an attitude (Right-Kind Reasons, RKR) and reasons that count in favor of *having* the attitude but not its content (Wrong-Kind Reasons, WKR).
      *   Example: A demon threatens you if you don't admire him. You have a reason to admire him (to save your life), but he isn't admirable. That's a WKR.
      *   The challenge: Formulating a criterion that filters out WKRs without filtering out legitimate RKRs or making the theory circular.

  3.  **Drafting the Desiderata (The Checklist):**

      *   *Desideratum 1: The Extensional Adequacy (The "Get the Cases Right" Rule).*
          *   Motivation: The standard cases (Demon, Bribe).
          *   Status: Nonnegotiable. If you call the demon threat a reason to admire, you've failed.
          *   Tension: Sometimes conflicts with explanatory depth.

      *   *Desideratum 2: The Non-Circularity Constraint.*
          *   Motivation: You can't just say "RKRs are reasons of the right kind."
          *   Status: Nonnegotiable.
          *   Tension: Hard to satisfy without being too vague.

      *   *Desideratum 3: The Normative Force Preservation.*
          *   Motivation: WKRs *are* reasons in some sense (pragmatic), just not for the attitude's fittingness.
          *   Status: Camp-specific (Fitting Attitudes vs. Pragmatism).
          *   Tension: If you say they aren't reasons at all, you ignore the rationality of complying with the demon.

      *   *Desideratum 4: The Doxastic Applicability (The Belief Constraint).*
          *   Motivation: The Climate Change Bribe & AI Tutor case.
          *   Status: Highly debated (Nonnegotiable for evidentialists, rejectable for pragmatists).
          *   *AI Case Analysis:* If the AI rewards truth but ignores evidence, is that a WKR? Yes, because it's not evidence. But it aligns with truth. This tests the "object-given" vs. "state-given" distinction.
          *   Tension: If you allow pragmatic reasons for belief (to solve the demon case), do you open the door to wishful thinking?

      *   *Desideratum 5: The Guidance/Actionability Constraint.*
          *   Motivation: Can we act on these reasons? (Cancer cure/Nobel).
          *   Status: Camp-specific.
          *   Tension: We can't believe at will, but we can desire at will.

  4.  **Addressing the Specific Cases:**
      *   *Cancer/Nobel:* Reasons for intention/desire. Distinguishes between reasons to *bring about* a state vs. reasons the state is *good*.
      *   *Demon/Ice Cream:* Classic WKR. Reason to desire, but ice cream isn't desirable.
      *   *Climate Bribe:* Doxastic WKR. Reason to believe, but not evidence.
      *   *AI Tutor:* This is tricky. It rewards *true* belief. Is truth an RKR for belief? Evidentialists say evidence is the only RKR. Pragmatists say truth/value matters. If the AI bypasses evidence, it's arguably a WKR because it doesn't track the *basis* of the belief, even if it tracks truth. This tests whether the theory is about *fittingness* or *correctness*.

  5.  **Identifying the "Killer" Requirement:**
      *   What kills the most accounts? Usually, it's the **Non-Circularity + Extensional Adequacy** combo. Many accounts (like the "Object-Given/State-Given" distinction) fail on extensional adequacy (some state-given reasons look like RKRs). But the single biggest hurdle is often **Non-Circularity** while maintaining **Extensional Adequacy**.
      *   Actually, a strong contender is the **Doxastic Applicability** requirement. Many theories work for admiration/desire but crash on belief (because belief aims at truth/evidence). If a theory demands WKR applies to belief, it kills Evidentialism. If it demands WKR *doesn't* apply to belief, it kills Pragmatism.
      *   Let's pick **Non-Circularity** as the technical killer, but **Doxastic Applicability** as the substantive killer. The prompt asks for *one* requirement. I'll go with **Non-Circularity** because it wipes out the "fittingness" definitions that just restate the problem. Or better: **The Distinctness Constraint** (must distinguish WKR from RKR without relying on the distinction itself).
      *   *Refinement:* The prompt asks what eliminates the most *popular* accounts. The "State-Given vs. Object-Given" distinction was very popular and got taken down by counterexamples (Extensional Adequacy). So, **Extensional Adequacy** is the executioner.

  6.  **Addressing the AI Tutor Case:**
      *   Does it create WKR? Yes. It's a pragmatic incentive attached to the state of believing, not the evidence for the content. Even if it tracks truth, it bypasses the *proper basis* (evidence).
      *   Should the theory cover doxastic wrong reasons? Yes, otherwise the theory is incomplete. Belief is the hardest test case.

  7.  **Scoring the Views:**
      *   *Value-Relation View (e.g., Hieronymi, Way):* Focuses on what the attitude takes as its object. Good on non-circularity, struggles with doxastic pragmatism.
      *   *Incentive-Dependence View (e.g., Schroeder):* Focuses on whether the reason depends on the incentive of having the attitude. Good on demarcation, sometimes struggles with the AI case (is truth an incentive?).

  8.  **Tone Check:**
      *   American English.
      *   Casual ("hey," "look," "stuff").
      *   Allow a typo or two (I will intentionally insert minor imperfections).
      *   Structure: Clear headings, bullet points.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the messiness of WKR.
