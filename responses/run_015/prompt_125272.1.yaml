  ok so im trying to figure out what i actually think about lying vs like just misleading someone, going off my gut on real cases

  - i tell my mom i was at the library when i was at jake's party. lie, obviously bad
  - she asks was there alcohol there and i say i didn't see any. true i guess, i was in the backyard all night, but i totally knew there was. i feel like this is a *little* less bad than the first one but not much and i cant really say why
  - my english teacher asks if i wrote my essay and i say i worked really hard on it. also true, i did, just on the prompts. i feel like this is basically as bad as straight up lying even tho nothing i said was false
  - my friend asks if her outfit looks bad and i say no its fine. false, and i do want her to believe it, but i feel completely fine about this one
  - the vice principal literally watched me do it and then asks did you do that, and i say no. nobody believes me and i know nobody will. i weirdly feel less bad about this than about the library one, like its not even really a lie
  - i snap back at my sister that i didn't eat her leftovers, 100% sure that i did, and it turns out dad ate them. i still feel like i did something wrong, like i *tried* to lie

  my guess at a principle was: lying is saying something you believe is false with the intent to make them believe it, everything else is just misleading, and misleading is less bad because they couldve asked a follow up question. but my outfit verdict and my essay verdict seem to break that in opposite directions, and i dont know what to do with the VP one at all.

  is there a principle that gets all these, or close? and what does it say about the case i keep flip flopping on: i have an AI write me an excuse note for gym and hand it in, knowing the AI just makes up plausible-sounding text and doesnt know or believe anything. is anyone lying there, me or the AI, and is it worse or less bad than if id just written the fake note myself? also be honest about which of my verdicts i should probably drop
