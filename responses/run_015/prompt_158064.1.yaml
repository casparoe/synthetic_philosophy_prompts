answer: |-
  ### Strategic Landscape: Adversarial Mapping

  Before proceeding to the Q&A sheet, I have mapped the core commitments and blind spots of your audience to ensure the objections are tailored precisely to their disciplinary instincts.

  **Health Economists**
  *   **Core Commitment:** Aggregate welfare maximisation. Resources are scarce; therefore, leaving survival probability 'on the table' is akin to waste.
  *   **Blind Spot:** They often treat the *metric* (QALYs) as neutral, missing how the act of measurement alters clinical behaviour (Goodhart's Law). They may view satisficing as mere cognitive laziness rather than a normative constraint.
  *   **Attack Vector:** Inefficiency and perverse incentives.

  **Clinical Ethicists**
  *   **Core Commitment:** Protection of the vulnerable and scrutiny of power. They fear protocols that legitimise 'less than best' care for specific groups.
  *   **Blind Spot:** They may prefer case-by-case discretion, overlooking that unstructured discretion often yields *more* bias than structured satisficing.
  *   **Attack Vector:** Structural bias and the political authority to define 'dignity'.

  ***

  ### Thesis Defence Q&A Prep Sheet

  **Topic:** Engineered Satisficing in Emergency Triage Protocols
  **Candidate:** [Your Name]
  **Context:** University Hospital Ethics Seminar

  ---

  #### Objection 1: The Structural Bias Trap
  **Source:** Clinical Ethicist
  **Phrasing:** "You argue satisficing protects dignity, but historically, 'good enough' care is precisely what marginalized populations receive. By engineering a 'stop rule' into the protocol, aren't you simply codifying a two-tier system where complex comorbidities trigger a lower standard of search effort, masking rationing as ethical virtue?"

  **Reply (2 mins):**
  "That is the precise moral hazard I aim to dismantle, not invite. Currently, maximisation protocols *already* create a two-tier system, but implicitly: patients with complex comorbidities are deprioritised because their 'expected survival' metric is lower. My proposal makes the threshold explicit and universal. The 'dignity-preserving threshold' is not a lower standard for complex patients; it is a *floor* for all patients. Once a pathway meets the threshold of restoring agency and relieving suffering, the protocol mandates stopping the search for marginal survival gains that require disproportionate resource extraction. This prevents the system from exhausting resources on marginal utility for the few while neglecting the dignity of the many. I am not arguing for 'less care' for the complex; I am arguing against 'more care' for the simple when that excess comes at the cost of systemic equity."

  **Weakness/Concession:**
  You must concede that if the threshold is set too low, this objection holds. You need to commit to the threshold being high enough to guarantee genuine dignity, not just biological survival.

  ---

  #### Objection 2: The Aggregate Utility Loss
  **Source:** Health Economist
  **Phrasing:** "Even if your equity argument holds, decision theory dictates that if you have the data to distinguish between a 60% and 70% survival probability, choosing the 60% option because it 'satisfices' systematically reduces total life-years saved across the population. Are you not ethically liable for the aggregate deaths caused by ignoring marginal utility gains?"

  **Reply (2 mins):**
  "This objection assumes the metric of 'expected survival' is stable and independent of the protocol. My thesis argues it is not. When maximisation is the design feature, clinicians and administrators optimise for the metric, not the patient. This leads to 'cream-skimming'—selecting patients who boost survival rates rather than those in deepest need. By satisficing, we stabilise the clinical relationship. The 'lost' life-years you calculate are theoretical; the moral hazard of maximisation is actual. It distorts triage towards patients who are cheaper to save, not those who need saving most. Satisficing accepts a theoretical loss in aggregate utility to prevent the systemic corruption of clinical intent. We are trading speculative QALYs for actual justice."

  **Weakness/Concession:**
  Concede that in mass-casualty incidents where resources are strictly finite and immediate survival is the only goal, maximisation may temporarily resume. Your argument applies to standard emergency triage, not disaster medicine.

  ---

  #### Objection 3: The Political Authority Problem
  **Source:** Clinical Ethicist
  **Phrasing:** "You speak of a 'dignity-preserving threshold' as if it were a clinical datum. Who defines this threshold? If it is set by hospital administration or insurance actuaries, does this not strip clinicians of the moral agency required to advocate for the individual patient in front of them?"

  **Reply (2 mins):**
  "Currently, thresholds are set implicitly by resource availability and risk aversion, which is far less transparent. My proposal demands that the threshold be set through a deliberative democratic process within the hospital ethics committee, including patient advocates, not merely by administration. Furthermore, this does not strip agency; it relocates it. The clinician's agency is currently consumed by bureaucratic optimisation games. By engineering the stop-rule, we return the clinician's cognitive bandwidth to the qualitative assessment: 'Has this patient's dignity been secured?' rather than 'Can I squeeze out another 2% survival chance?' It protects their agency from the pressure to maximise metrics."

  **Weakness/Concession:**
  You must acknowledge the risk of bureaucratic capture. Concede that the protocol requires a robust, independent ethics oversight body to review threshold settings annually.

  ---

  #### Objection 4: Incentive Compatibility and Gaming
  **Source:** Health Economist
  **Phrasing:** "From a mechanism design perspective, this creates a perverse incentive. If clinicians are rewarded for hitting the threshold rather than maximising outcomes, rational actors will lower their effort to the minimum required to cross the line. How do you prevent the threshold from becoming a ceiling?"

  **Reply (2 mins):**
  "This assumes the clinician's utility function is purely effort-averse. However, medical professionalism is intrinsically motivated by patient welfare. The current maximisation model creates *more* gaming—clinicians upcoding severity or avoiding high-risk patients to protect survival metrics. A satisficing protocol aligns better with professional norms: 'Do what is sufficient to restore the patient.' To prevent the threshold becoming a ceiling, we pair it with a random audit mechanism for cases near the boundary. But fundamentally, we must trust that removing the pressure to maximise aggregate utility allows professional virtue to flourish rather than suppressing it with impossible demands."

  **Weakness/Concession:**
  This is a vulnerable point. You must concede that without robust audit cultures, slackness is a real risk. You cannot rely on professionalism alone.

  ---

  #### Objection 5: The Fiduciary Duty to the Individual
  **Source:** Clinical Ethicist
  **Phrasing:** "Medicine is a fiduciary practice. Your duty is to *this* patient. If a maximising option exists that offers better survival, and you deliberately choose a satisficing option because of a systemic design feature, have you not betrayed the individual trust relationship?"

  **Reply (2 mins):**
  "The fiduciary duty is not to maximise biology at all costs; it is to act in the patient's best interest. Sometimes, the 'maximising' option involves invasive, resource-intensive interventions that compromise the patient's dignity without guaranteeing survival. By pre-committing to a dignity threshold, we protect the patient from the violence of futile optimisation. The betrayal occurs when the system forces clinicians to treat patients as units of utility. Satisficing restores the patient as an end in themselves. If the maximising option violates the dignity threshold (e.g., excessive suffering for marginal gain), the fiduciary duty actually *requires* satisficing."

  **Weakness/Concession:**
  You need to be careful not to conflate 'dignity' with 'quality of life' judgments that patients might reject. Concede that patient preference must override the threshold if they explicitly demand maximisation.

  ---

  #### Objection 6: Epistemic Negligence
  **Source:** Health Economist
  **Phrasing:** "Satisficing is traditionally a heuristic for when search costs are high. In modern triage, data is instantaneous. If you have the information to maximise, deliberately ignoring it looks like epistemic negligence. Why would you design a system that mandates ignoring available data?"

  **Reply (2 mins):**
  "Because data is not wisdom. Having the probability curve does not tell you the moral cost of pursuing it. Ignoring the data beyond the threshold is not negligence; it is a normative boundary condition. We ignore data constantly in ethics—we do not harvest organs from healthy people even if the utility data supports it. In triage, once the dignity threshold is met, further data regarding survival probabilities becomes morally irrelevant to the decision procedure. It is not that we *cannot* see the data; it is that we *ought not* to let it drive the decision. This is a feature of practical reason, not a bug of information processing."

  **Weakness/Concession:**
  This sounds dogmatic. Concede that in research settings or novel treatments, maximisation remains appropriate. This protocol is for standard emergency care.

  ---

  #### The Question You Hope Nobody Asks
  **Source:** Formalist Critique (Economist/Philosopher Hybrid)
  **Phrasing:** "You reject QALYs as the currency of triage, yet you propose 'dignity-preserving thresholds' as the alternative. Unless you can provide an intersubjective metric for dignity that is as operationalisable as a QALY, your protocol is arbitrary. If you *do* provide a metric, haven't you just created a new utility function to be maximised, collapsing your argument back into the formalism you critique?"

  **Reply (2 mins):**
  "This is the crux of the matter. I am not proposing a new metric to be maximised; I am proposing a *constraint* on maximisation. Dignity is not a currency; it is a status. We do not measure status; we recognise it. The threshold is operationalised through checklists of agency-restoration and suffering-mitigation, not a scalar score. However, I must concede that without some formalisation, the threshold is vulnerable to drift. My defence is that 'operationalisable' does not mean 'quantifiable'. We can operationalise 'informed consent' without reducing it to a number. Similarly, we can operationalise dignity through procedural safeguards rather than a utility curve. If you demand a single currency for all moral value, you have already accepted the utilitarian premise I am rejecting."

  **Weakness/Concession:**
  This is your weakest flank. You must concede that some quantification is inevitable in implementation, but argue that it remains a *threshold* (binary) rather than a *scale* (continuous), which preserves the logical structure of satisficing.
