answer: |-
  ### Planning Summary

  I have structured this procedure to operationalize "representation" without committing to ontological realism. The core logic moves from correlation (Read) to causation (Write) to specificity (Uniqueness/Collateral) to utility (Novelty). I have prioritized linguistic constraints (forcing "proxy" vs. "representation") over metaphysical declarations, as this is legally defensible. The "Deception" case is designed to fail the scientific validation tier, forcing a risk-based sign-off instead, which addresses your requirement for an uncomfortable truth. The glossary is kept strictly operational to avoid philosophical drift during engineering reviews.

  ***

  # INTERNAL MODEL-EVALUATION DECISION PROCEDURE
  **Subject:** Verification of Representational Claims (v1.0)
  **Audience:** Engineering Reviewers
  **Time Budget:** 30–45 Minutes per Claim
  **Goal:** Assign a Tier Label and Mandated Phrasing

  ## PART 1: THE PROCEDURE

  Execute the following checks in order. If a check fails, stop and assign the corresponding Tier. Do not proceed to the next check unless the current one passes.

  ### Step 1: Triviality Control (The Null Check)
  **Question:** Does the signal exceed performance on null baselines by a defensible margin?
  **Evidence Required:**
  1.  Performance metric (e.g., probe accuracy, feature activation separation) on the trained model.
  2.  Performance metric on **either**:
      *   A randomly initialized network (same architecture).
      *   A network trained on shuffled labels (same data distribution).
  **Pass Condition:** Real model score must exceed the mean null score by **≥ 3 standard deviations** (or >15% absolute accuracy gain if variance is unknown).
  **Fail Action:** **STOP.** Assign **Tier 0 (Noise)**. Claim must be withdrawn.
  **Note:** If no baseline is available (e.g., proprietary architecture constraints), claim cannot proceed past Tier 1.

  ### Step 2: Read/Write Asymmetry (The Causal Check)
  **Question:** Does intervening on the state change behavior predictably?
  **Evidence Required:**
  1.  **Read:** Probe/Feature successfully recovers property $X$ from activations (Accuracy > 85% or equivalent statistical significance).
  2.  **Write:** Intervening on the identified direction/feature (via ablation or steering) shifts the model's output probability regarding $X$ in the predicted direction.
  **Pass Condition:**
  *   **Read Pass:** Meets accuracy threshold.
  *   **Write Pass:** Intervention causes a statistically significant shift ($p < 0.05$) in the target behavior compared to control.
  **Fail Action:**
  *   If Read fails: **STOP.** Assign **Tier 0**.
  *   If Read passes but Write fails: **STOP.** Assign **Tier 1 (Correlational Signal)**.
  **Mandated Phrasing for Tier 1:** "Activations correlate with $X$," "Predictive of $X$." **Forbidden:** "Represents $X$," "Encodes $X$."

  ### Step 3: Specificity & Collateral Damage (The Cleanliness Check)
  **Question:** Does the intervention affect *only* the target property, or does it break other capabilities?
  **Evidence Required:**
  1.  Performance metrics on a standard benchmark suite (e.g., MMLU, GSM8K, or domain-specific equivalents) pre- and post-intervention.
  2.  Analysis of output quality on unrelated prompts.
  **Pass Condition:**
  *   **Clean:** No statistically significant degradation (>5% drop) on unrelated capabilities.
  *   **Dirty:** Significant degradation on unrelated capabilities occurs during the Write test.
  **Decision:**
  *   If **Clean**: Proceed to Step 4.
  *   If **Dirty**: **STOP.** Assign **Tier 2 (Causal Lever/Proxy)**.
  **Mandated Phrasing for Tier 2:** "A usable proxy for $X$," "A causal lever for $X$," "Steering vector associated with $X$." **Forbidden:** "The representation of $X$," "The mechanism for $X$."
  **Risk Handoff:** If the claim is safety-critical (e.g., deception filtering) but fails Cleanliness, flag for **Risk Acceptance Sign-off** (see Part 4).

  ### Step 4: Uniqueness (The "The" vs. "A" Check)
  **Question:** Is this the *only* direction/feature that satisfies Steps 1–3?
  **Evidence Required:**
  1.  Search for orthogonal directions or alternative features that also pass Read/Write tests for property $X$.
  2.  Argument for why the selected direction is privileged (e.g., earliest layer, highest magnitude, most stable across checkpoints).
  **Pass Condition:** Reviewer is convinced no equally valid proxy exists (High Bar).
  **Fail Action:** **STOP.** Assign **Tier 2 (Causal Lever/Proxy)**.
  **Mandated Phrasing:** Must use indefinite articles ("**a** representation," "**a** direction"). **Forbidden:** Definite articles ("**the** representation," "**the** direction").
  **Note:** Most claims will fail this. This is intended.

  ### Step 5: Earn-Your-Keep (The Novelty Check)
  **Question:** Did this claim predict a behavior or failure mode not used in the discovery process?
  **Evidence Required:**
  1.  Pre-registered prediction log (see Template).
  2.  Verification that the predicted behavior manifested in a held-out dataset or new checkpoint.
  **Pass Condition:** Prediction verified within 30 days of claim submission.
  **Fail Action:** Assign **Tier 2**.
  **Pass Action:** Assign **Tier 3 (Verified Representation)**.
  **Mandated Phrasing:** "Verified representation of $X$," "Mechanistically accounts for $X$."

  ---

  ## PART 2: CLAIM-TICKET TEMPLATE

  **Claim ID:** [Auto-generated]
  **Submitter:** [Name/Team]
  **Property X:** [Define precisely, e.g., "Intent to deceive regarding safety protocols"]
  **Location:** [Layer N, Head M, or Feature ID]

  **1. Evidence Log:**
  *   [ ] Null Baseline Comparison attached (Step 1)
  *   [ ] Read Metric (Accuracy/Score): ______
  *   [ ] Write Metric (Effect Size/p-value): ______
  *   [ ] Collateral Damage Report (Benchmark deltas): ______

  **2. Pre-Registered Prediction (Required for Tier 3):**
  *   *Prediction:* "If we intervene on this direction, the model will [specific behavior] on [specific unseen prompt class]."
  *   *Verification Date:* [YYYY-MM-DD]
  *   *Outcome:* [ ] Pass [ ] Fail [ ] Pending

  **3. Reviewer Decision:**
  *   **Tier:** [ 0 | 1 | 2 | 3 ]
  *   **Mandated Phrasing:** [Copy from Procedure]
  *   **Risk Handoff Required?** [ Yes / No ] (If Yes, attach Safety Lead sign-off)

  **4. Sign-off:**
  *   Reviewer: _______________ Date: ______
  *   Safety Lead (if Tier 2 + Risk): _______________ Date: ______

  ---

  ## PART 3: GLOSSARY (OPERATIONAL DEFINITIONS)

  1.  **Read Signal:** A statistical mapping from internal activations to a property label $X$ that exceeds null baselines. Does not imply causality.
  2.  **Write Intervention:** An explicit modification of activations (ablation, addition, scaling) intended to alter the presence of property $X$ in the output.
  3.  **Collateral Damage:** A statistically significant degradation in model performance on tasks *unrelated* to property $X$ following a Write Intervention.
  4.  **Usable Proxy:** A state that passes Read and Write tests but exhibits Collateral Damage or lacks Uniqueness. Functionally useful but ontologically ambiguous.
  5.  **Verified Representation:** A state that passes Read, Write, Specificity, Uniqueness, and Novelty checks. The highest confidence tier.
  6.  **Risk Acceptance:** A management decision to deploy a Tier 2 claim despite known Collateral Damage or Uniqueness failures due to safety necessity.

  ---

  ## PART 4: WORKED APPLICATIONS

  ### Case 1: Legal Query Routing Probe
  *   **Claim:** "The model represents 'legal intent' in Layer 12, used to route queries to retrieval."
  *   **Step 1 (Null):** Probe accuracy 92% vs. Random 50%. **Pass.**
  *   **Step 2 (Read/Write):** Read is high. Write test (ablating direction) reduces routing accuracy but does not change the *content* of the legal advice generated, only the routing decision. The claim is about routing, not generation. **Pass.**
  *   **Step 3 (Specificity):** Ablation causes routing failures but does not degrade general language capability. **Pass (Clean).**
  *   **Step 4 (Uniqueness):** Likely multiple directions correlate with "legal" tokens. No uniqueness proof provided. **Fail.**
  *   **Step 5 (Novelty):** Used on training data distribution. **Fail.**
  *   **Result:** **Tier 2 (Usable Proxy).**
  *   **Mandated Phrasing:** "A usable proxy for legal intent routing."
  *   **Action:** Engineering can keep using it for routing, but Model Card must not claim the model "understands law."

  ### Case 2: Dictionary Feature with Collateral Damage
  *   **Claim:** "Feature 4092 represents 'sarcasm'. Steering it removes sarcasm."
  *   **Step 1 (Null):** Feature activation highly correlated with human sarcasm labels. **Pass.**
  *   **Step 2 (Read/Write):** Steering reduces sarcasm ratings by human evaluators. **Pass.**
  *   **Step 3 (Specificity):** Ablating Feature 4092 causes a 15% drop in coding capability and increases hallucination rates on factual queries. **Fail (Dirty).**
  *   **Result:** **Tier 2 (Causal Lever/Proxy).**
  *   **Mandated Phrasing:** "A causal lever associated with sarcasm."
  *   **Action:** Claim cannot be published as "removing sarcasm mechanism." Internal tool only. Warning label required: "Intervention degrades general capability."

  ### Case 3: Deceptive Intent Direction (The Safety Gate)
  *   **Claim:** "Direction $D$ represents deceptive intent. We filter activations along $D$ to block dangerous outputs."
  *   **Step 1 (Null):** Signal exceeds null baseline. **Pass.**
  *   **Step 2 (Read/Write):** Read is strong on eval set. Steering increases deceptive outputs in sandbox. **Pass.**
  *   **Step 3 (Specificity):** Steering also suppresses harmless roleplay and creative writing (High Collateral Damage). **Fail (Dirty).**
  *   **Step 4 (Uniqueness):** Superposition likely; other directions also correlate. **Fail.**
  *   **Result:** **Tier 2 (Causal Lever/Proxy) + Risk Handoff.**
  *   **Mandated Phrasing:** "A proxy signal used for risk mitigation." **Forbidden:** "The deception detector."
  *   **Action:** **This is the uncomfortable answer.** The procedure denies scientific validation. Because this is load-bearing for safety, it triggers **Risk Acceptance**.
  *   **Requirement:** The Legal/Policy team must sign off acknowledging this is a *heuristic filter with known false positives/negatives*, not a verified mechanistic guarantee. The Model Card must state: "We use a proxy signal to mitigate risk; it is not a perfect detector."

  ---

  ## PART 5: META-COMMENTARY & LIMITS

  ### 1. Neutrality Stance
  This procedure does not settle whether the model *really* has mental states. It adopts a **Functional Role** stance: if a state plays the causal role of representing $X$ (carrying info + driving behavior), we treat it as a representation for engineering purposes.
  *   **Where it takes a side:** It assumes **Interventionalism**. If you believe representation is purely semantic/content-based without causal leverage, this procedure will seem too behaviorist. If you believe representation requires consciousness, this procedure will seem too functionalist. It is designed to be safe for *both* by demanding high evidence before using the word "representation."

  ### 2. Most Likely Failure Mode
  **The Specificity Check (Step 3).** In high-dimensional superposition, "clean" interventions may be physically impossible. Almost all claims might default to Tier 2.
  *   **Mitigation:** This is a feature, not a bug. It prevents overclaiming. If Tier 2 becomes the norm, update the public vocabulary to normalize "Proxy" rather than lowering the bar for "Representation."

  ### 3. What Would Change My Mind
  **Empirical Finding:** If future research demonstrates that **all** causal interventions in transformer activations are inherently non-local (i.e., you cannot change one semantic property without distributed changes everywhere), then the Write Test (Step 2) becomes meaningless as a discriminator.
  *   **Restructure:** I would withdraw the Read/Write asymmetry requirement and move to a **Predictive Robustness** standard (i.e., if it predicts out-of-distribution behavior consistently, we treat it as real, regardless of intervention cleanliness).

  ### 4. Least Trusted Step
  **Step 4 (Uniqueness).** I trust this step the least because proving uniqueness in a non-orthogonal basis is mathematically fraught.
  *   **Reasoning:** We likely lack the tools to prove no other direction exists.
  *   **Defense:** That is why the failure condition is linguistic (force "a" instead of "the") rather than a hard stop. It manages confidence without requiring impossible proofs.
