answer: |-
  ### The Functions of the Tipping Convention: Coordination vs. Compensation

  To analyze the moral weight of Danny Meyer's 2015 decision to eliminate tipping, one must first dissect the dual economic functions served by the pre-existing New York restaurant-tipping convention.

  **1. The Coordination Function**
  In game-theoretic terms, a coordination convention solves a problem of mutual expectation without necessarily involving a conflict of interest. In the context of dining, tipping historically served to align the incentives of the server and the diner.
  *   **Signaling Quality:** The tip acts as a post-hoc signal of satisfaction, theoretically encouraging servers to maintain high standards to secure future income.
  *   **Directing Labor Attention:** In a busy dining room, the prospect of a tip directs server attention to tables where marginal effort yields marginal return. It solves the "who gets served first" problem dynamically, without requiring managerial intervention for every request.
  If tipping were *purely* coordinative, it would function like driving on the right side of the road: the specific rule matters less than the fact that everyone follows it to ensure smooth interaction.

  **2. The Compensation Function**
  The compensation function addresses the distribution of costs and the sustenance of the labor force. Under U.S. federal and New York State law (at the time), restaurant employers were permitted to pay tipped employees a "cash wage" significantly below the standard minimum wage, provided tips made up the difference.
  *   **Externalizing the Wage Bill:** This function allows the employer to shift a portion of the operational cost (the living wage of the staff) onto the consumer. The price on the menu covers food and overhead, but the "price" of service is left indeterminate and paid voluntarily by the diner.
  *   **Distributive Judgment:** This embeds a contested moral and economic judgment: that the diner, rather than the business owner or the pricing structure, bears the primary responsibility for ensuring the server earns a living wage.

  ### Applying the Conventionalist Framework: Obligations of Locals and Visitors

  The prompt specifies a **qualified conventionalist framework**: conventions generate moral obligations for participants *only* when they serve pure coordination and *do not* embed contested distributive judgments. Under this strict framework, we must assess the moral obligations of diners under the old regime.

  **The Status of the Old Regime**
  Because the pre-2015 tipping convention inextricably mixed coordination (incentives) with compensation (wage subsidy), it fails the "pure coordination" test. The distributive element is contested (as evidenced by labor debates and Meyer's own reform). Therefore, under this specific framework, **the convention itself generates no inherent moral obligation to tip.** The norm is not akin to a traffic rule (pure coordination) but akin to a tax collection method (distributive).

  **Local Regulars vs. Non-Local Visitors**
  *   **The Local Regular:** A local participant is embedded in the institutional context. While the qualified conventionalist framework suggests no *convention-based* moral obligation exists (because the convention is impure), a local might incur a "fair play" obligation. By participating in the local economy long-term, the local benefits from the labor stability the tipping system (flawed as it is) provides. However, under the strict constraints of the prompt's framework, even this is tenuous. The local's primary obligation shifts from *following* the convention to *reforming* it, as the convention rests on a contested distributive judgment.
  *   **The Non-Local Visitor:** The visitor is a transient participant. They do not benefit from the long-term stability of the local labor market, nor do they participate in the recurring social contract of the city's dining ecosystem. Under the qualified conventionalist framework, since the convention is not purely coordinative, the visitor has **no moral obligation** to uphold it. Their duty is merely prudential (to avoid social friction), not moral. The visitor is not bound to subsidize a local wage structure they do not inhabit, especially when the convention embeds a distributive judgment they may not share.

  ### What Meyer's Reform Reveals: Disguised Wages vs. Flexible Conventionalism

  Danny Meyer's "Hospitality Included" initiative serves as a natural experiment that tests the nature of the convention.

  **Undermining the Moral Obligation (The Disguised Wage Mechanism)**
  Meyer's reform strongly supports the view that the tipping convention was **never purely coordinative but was always a disguised wage mechanism.**
  *   **Evidence:** If tipping were essential for coordination (service quality), eliminating it should have led to a collapse in hospitality. Meyer argued the opposite: that tipping created transactional friction and income instability that *harmed* hospitality. By raising menu prices to pay salaries, USHG demonstrated that service could be coordinated through management and culture rather than direct pecuniary incentives.
  *   **Implication:** This reveals that the "moral obligation" to tip was largely an illusion created by the internalization of a wage subsidy. If the employer can pay the wage directly without moral loss (and arguably with moral gain regarding equity between front-of-house and back-of-house staff), then the diner's obligation to compensate via tip vanishes. The convention was upholding a distributive arrangement that the restaurateur himself deemed obsolete.

  **Supporting Flexible Conventionalism**
  Alternatively, the episode supports **flexible conventionalism**. It demonstrates that conventions can be re-engineered without moral loss. Meyer did not abolish the obligation to pay for service; he relocated it from the voluntary post-prandial gift to the mandatory menu price. This suggests that while specific conventions (tipping) may not bind morally, the underlying value (fair compensation for labor) does. The convention is a vessel, not the cargo. If the vessel leaks (inequity between BOH and FOH), it can be replaced. This supports a view where visitors and locals are bound to the *value* (fairness) but not the specific *local mechanism* (tipping), allowing for moral continuity despite conventional change.

  ### Broader Implications and the Silence of Conventionalism

  **Visitors and Local Conventions**
  This episode **weakens** the broader claim that visitors must observe local conventions when those conventions depend on institutional contexts the visitors do not share.
  *   **Queuing and Jaywalking:** Norms like queuing or traffic laws are typically pure coordination conventions. They ensure safety and order regardless of the distributive outcome. A visitor is bound by these because they are prerequisites for shared public space.
  *   **Economic Conventions:** Tipping is an economic convention dependent on local labor laws and wage structures. A visitor does not share the institutional context (they do not pay local taxes, do not rely on the local labor market). The Meyer case highlights that when a convention is a proxy for a local distributive policy (wage law), the outsider is not morally bound to uphold it. To demand a visitor tip in a system they view as unjust wage externalization is to demand they participate in a local political economy they cannot vote on.

  **Where the Conventionalist View is Silent**
  While the conventionalist framework helps categorize the obligation, it is silent on two critical areas exposed by the Meyer episode:

  1.  **The Epistemic Burden:** The framework dictates that obligations exist only if a convention is purely coordinative. However, it offers no guidance on **how a participant (especially a visitor) is to know the nature of the convention.** Is tipping in 2014 New York coordination or compensation? To an economist or a restaurateur like Meyer, it was clearly compensation. To a tourist, it appears to be a coordination norm (reward for service). The conventionalist view is silent on who bears the burden of proof when the nature of the convention is opaque. It does not tell the visitor whether they are permitted to investigate the convention before following it.
  2.  **The Transition Period:** Conventionalism explains why we follow established norms. It is silent on **moral obligations during the dissolution of a convention.** When Meyer announced the change, there was a period of confusion. Some restaurants followed suit; others did not. During this transition, was a diner morally obligated to tip at a USHG restaurant if the menu said "service included" but the server looked confused? The framework relies on the existence of a stable convention to generate obligation. It offers no moral compass for the "in-between" state where the old convention is dying, and the new one is not yet established. In this silence, the visitor is left without a rule, highlighting that conventionalism cannot guide action when the convention itself is in flux.

  ### Conclusion

  Danny Meyer's 2015 decision serves as a potent case study revealing that economic conventions often mask distributive judgments rather than solving coordination problems. Under a qualified conventionalist framework, the pre-2015 tipping norm generated no moral obligation for visitors, and tenuous obligations for locals, because it functioned as a wage subsidy. Meyer's reform confirmed this by demonstrating that service coordination could be decoupled from direct tipping. Ultimately, the episode weakens the claim that visitors must blindly follow local economic norms, while exposing the silence of conventionalism regarding the epistemic burden of identifying a convention's true function and the moral landscape during periods of normative transition.
