              *   *Visitor:* Transient. Doesn't benefit from the long-term stability of the labor market. Under the "pure coordination" test, if the convention is mixed (coord + comp), the visitor has *no* moral obligation, only a prudential one (avoid awkwardness). The prompt asks to apply the framework strictly: If it's not pure coordination, *no* obligation. So, neither has a strong moral obligation, but the local might have a "fair play" obligation that the visitor lacks.
      *   **Analyzing Meyer's Reform (Task 4):**
          *   *Did it reveal the truth?* Yes. By moving to service-included, Meyer acknowledged the wage bill belongs on the P&L, not on the customer's guilt. It exposes the "compensation" function as the dominant moral issue.
          *   *Option A vs. Option B:* It leans heavily toward Option A (undermining the claim that tipping was a moral obligation). If a restaurateur can simply switch to salaries and service is maintained (or improved), the "coordination" argument for tipping weakens. It shows the old convention was a disguised wage mechanism.
          *   *Flexible Conventionalism:* It also supports Option B slightly—conventions *can* change. But the prompt asks to choose the implication regarding moral obligation. The stronger point is that the *old* obligation was illusory because the convention was structurally unjust (distributive).
      *   **Broader Implications & Silence (Task 5):**
