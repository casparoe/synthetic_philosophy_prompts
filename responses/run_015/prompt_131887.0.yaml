          *   *Compensation:* Federal/State law allows tipped minimum wage (lower than standard). Tips make up the difference. This shifts cost from employer to diner. This is distributive.
      *   **Applying the Framework (Task 2 & 3):**
          *   *The Framework:* Obligations exist *only* for pure coordination. If distributive/contested, the convention doesn't create a *moral* duty (though maybe a legal or social one).
          *   *Analysis of Old Regime:* Tipping wasn't *purely* coordinative. It was heavily compensatory. Therefore, under this specific framework, the moral obligation is weak or non-existent because it rests on a contested distributive judgment (who pays the living wage?).
          *   *Visitor vs. Local:*
