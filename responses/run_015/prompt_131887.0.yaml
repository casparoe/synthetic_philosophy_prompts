          *   *Queuing/Jaywalking:* These are usually pure coordination (safety, order). Tipping is different.
          *   *Where is Conventionalism Silent?* It is silent on *how to identify* when a convention shifts from coordinative to distributive. It is also silent on what obligation exists *after* a convention is deemed unjust (do you fight it? ignore it?). It doesn't tell the visitor what to do if the local convention is morally ambiguous.

  4.  **Refining the Argument (Self-Correction/Nuance):**

