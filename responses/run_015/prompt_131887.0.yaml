      *   **Key Question 1:** Do everyday economic conventions constitute moral obligations? Are outsiders bound by them?
      *   **Task 1 (Distinction):** Distinguish between the *coordination function* (signaling quality, directing labor) and *compensation function* (externalizing wage bill) of the pre-2015 tipping convention.
      *   **Task 2 (Application):** Apply a specific conventionalist framework: Conventions generate obligations *only* when they serve pure coordination and *not* when they embed contested distributive judgments.
      *   **Task 3 (Visitor vs. Local):** Under this framework, determine the moral obligations of a non-local visitor vs. a local regular under the *old* regime.
      *   **Task 4 (Meyer's Reform Analysis):** What does the reform reveal?
