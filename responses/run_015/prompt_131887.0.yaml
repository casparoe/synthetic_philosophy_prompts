      *   **Task 5 (Broader Implications):** Assess whether this strengthens or weakens the claim that visitors must observe local conventions (queuing, jaywalking) when contexts aren't shared. Identify where the conventionalist view is *silent*.

  2.  **Initial Knowledge Retrieval & Structuring:**

      *   *Danny Meyer/USHG:* In late 2015, Meyer announced "Hospitality Included." He raised menu prices to pay back-of-house (BOH) and front-of-house (FOH) staff salaries, eliminating the tip line. This was a huge deal in the NYC dining scene.
      *   *Tipping Convention:* Historically, tips supplement sub-minimum wages for servers. It acts as an incentive (coordination/quality signal) and a subsidy (compensation).
