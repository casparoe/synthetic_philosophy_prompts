answer: |-
  This is a high-risk, high-reward seminar design. You are asking students to embody methodological commitments before they have the vocabulary to justify them. That is exactly how to break the "verbal dispute" illusion.

  Here is the operational plan, materials, and script to run **"The Depot Protocol."**

  ### 1. Room Setup & Seating (The Grid Constraint)
  You have 22 students. You need 6 working groups (four groups of 4, two groups of 3).
  Arrange them in 2 Rows of 3 Groups each.
  *   **Row 1 (Front):** Group 1 (Team World), Group 2 (Team Lab), Group 3 (Team World).
  *   **Row 2 (Back):** Group 4 (Team Lab), Group 5 (Team World), Group 6 (Team Lab).

  **The Pairing:**
  *   G1 passes to G4 (Diagonal Left)
  *   G2 passes to G5 (Diagonal Right/Center)
  *   G3 passes to G6 (Diagonal Right)
  *   *Result:* Every "World" group compares verdicts with a "Lab" group.

  ### 2. Materials (No Projector)
  *   **6 Envelopes:** Labeled "Unit 1," "Unit 2," "Unit 3."
  *   **Procedure Cards (Laminated/Index Card):**
      *   *Team World (Historians):* "You possess the **Incident Log**. You cannot touch the machine. You may only ask: 'In the closest possible version of this Log where Variable X was different, but everything else remained exactly as written, would Outcome Y change?'"
      *   *Team Lab (Engineers):* "You possess the **Control Console**. You cannot look at the Log. You may only ask: 'If I force Variable X to value V, and hold all other variables fixed at their current settings, does Outcome Y move?'"
  *   **Logic Cards (Inside Envelopes):** Boolean rules for each Unit (see below).
  *   **Verdict Sheets:** One per group. Columns: *Variable | Verdict (Cause/Not) | Justification (One Sentence).*
  *   **Paperclips:** For Team Lab to signify "Clamped" variables.
  *   **Environment Cards (Unit 3 only):** Team Lab gets two (Winter/Summer). Team World gets one (Actual: Winter).
  *   **Timer:** Your phone.

  ### 3. The Three Units (Black Boxes)

  **Unit 1: "The Chain" (Transitivity Check)**
  *   **Logic:** `R` (Sensor) → `P` (Pump) → `V` (Valve) → `F` (Flood).
      *   If R=1 then P=1. If P=1 then V=1. If V=1 then F=1. (Else 0).
  *   **Actual State:** R=1, P=1, V=1, F=1.
  *   **Goal:** Both teams mark R, P, and V as Causes.
  *   **Trap:** Team World might skip P and V (thinking R is the "real" cause). *Rule:* They must evaluate every variable listed.

  **Unit 2: "The Watchdogs" (Symmetric Overdetermination)**
  *   **Logic:** `A` (Trip 1) OR `B` (Trip 2) → `S` (Shutoff).
      *   If A=1 OR B=1, then S=1.
  *   **Actual State:** A=1, B=1, S=1.
  *   **Goal:**
      *   Team World: **Not Causes.** (If A=0, B is still 1 in the Log, so S=1. No dependence).
      *   Team Lab: **Causes.** (Clamp B=0. Set A=1 → S=1. Set A=0 → S=0. Dependence restored).
  *   **Conflict:** This is the core friction point.

  **Unit 3: "The Fragile One" (Invariance vs. Token)**
  *   **Logic:** `D` (Damper) + `T` (Temp) → `F` (Flood).
      *   Rule: If T=Winter AND D=Closed → F=1. All other combos → F=0.
  *   **Actual State:** T=Winter, D=Closed, F=1.
  *   **Materials:**
      *   Team World: Gets **Incident Log #404** (T=Winter).
      *   Team Lab: Gets **Test Env Card A** (Winter) AND **Test Env Card B** (Summer).
  *   **Goal:**
      *   Team World: **Cause.** (In this Log, if D=Open, F=0).
      *   Team Lab: **Not a General Cause.** (Works in Winter, fails in Summer. Not invariant. Cannot be relied upon as a handle).
  *   **Note on your worry:** You asked if students will say "Just add Temp to the model." *Let them.* In the debrief, that is the Woodwardian move. The game succeeds if the Lab team feels D is a "bad lever" even if it worked this time.

  ### 4. Enforcement & Rules (Crucial)
  You cannot circulate freely. You must build enforcement into the artifacts.

  1.  **The "Ink" Rule (Team World):** Give them pens, not pencils. "The Log is written in ink. You cannot change the background. If your justification says 'I would have turned off B,' you are fired. You must say 'If the Log read B=0...'"
  2.  **The "Clamp" Rule (Team Lab):** They must physically paperclip the variables they are holding fixed on their Logic Card. If they don't clip it, they aren't holding it fixed.
  3.  **The Inspector:** You stand at the front. Any group can "appeal" another group's sheet during the comparison phase if they spot a protocol violation (e.g., World team intervening).
  4.  **Time Boxing:** Strict 12-minute intervals per Unit. Timer on projector or loud phone alarm.

  ### 5. Timeline (90 Minutes)

  *   **00-10: Briefing.** Distribute groups and Procedure Cards. **Do not name Lewis or Woodward.** Read the Procedure Cards aloud. Emphasize: "You are not solving the same problem. You are running different protocols."
  *   **10-22: Unit 1 (The Chain).** Groups fill verdict sheets.
  *   **22-25: Pass & Check.** G1→G4, etc. "Did you match?" (They should).
  *   **25-40: Unit 2 (The Watchdogs).** Groups fill verdict sheets.
  *   **40-45: Pass & Check.** "Did you match?" (They won't). *Do not discuss why yet.* Just note the discrepancy on the board.
  *   **45-60: Unit 3 (The Fragile One).** Groups fill verdict sheets. (Lab team tests both Env cards).
  *   **60-65: Pass & Check.** Note discrepancies.
  *   **65-75: Sheet Swap.** Teams swap sheets with their diagonal partner. They have 5 minutes to write one "Objection" on the partner's sheet using *only* their own procedure's language.
  *   **75-90: Debrief.**

  ### 6. The Debrief Script (Mapping the Collision)
  *Do not start with names.* Start with the Unit 2 conflict.

  **Phase 1: The Watchdogs (Pre-emption/Overdetermination)**
  *   **Ask:** "Unit 2. Team World, why did you say A is not a cause?"
      *   *Expected:* "Because S still happens without it."
  *   **Ask:** "Team Lab, why did you say A is a cause?"
      *   *Expected:* "Because if we hold B fixed at 0, A moves S."
  *   **The Reveal:** "Team World, you were running a **Counterfactual Dependence** test (Lewis). You asked if the outcome *hinged* on the input in the actual scenario. Team Lab, you were running an **Interventionist** test (Woodward). You asked if the input is a *handle* for the output."
  *   **The Lesson:** "Lewis fixes the *world* (background stays same). Woodward fixes the *system* (other variables stay same). In overdetermination, the actual world hides the causal power. The intervention reveals it."

  **Phase 2: The Chain (Transitivity)**
  *   **Ask:** "Unit 1. Did anyone on Team World skip P or V?"
      *   *If yes:* "Why?" ("R is the real cause").
      *   **The Lesson:** "Lewis needs chains of stepwise dependence to handle pre-emption. If you skip the middle links, you can't solve Unit 2. You need the chain to trace the dependence."

  **Phase 3: The Fragile One (Invariance)**
  *   **Ask:** "Unit 3. Team World, did D cause the flood?" (Yes). "Team Lab, is D a cause?" (No/Conditional).
  *   **The Lesson:** "Team World judged *Token Causation* (this specific flood). Team Lab judged *Type Causation* (can we use D to control floods generally?)."
  *   **Addressing your worry:** "Some of you Lab folks probably said 'D is a cause relative to Winter.' That is exactly Woodward's **Invariance Condition**. A causal claim is only true relative to a model where the relationship holds stable. Lewis doesn't care about stability; he cares about what happened *this time*."

  **Phase 4: The Takeaway**
  *   "You felt these as conflicting intuitions because they *are* different questions. One asks: 'What did this outcome depend on?' The other asks: 'What can I manipulate to change the outcome?' They overlap in simple chains (Unit 1). They diverge in complex systems (Unit 2 & 3). The theories aren't fighting over the definition of 'cause'; they are optimizing for different uses of the concept."

  ### 7. Troubleshooting: What Will Go Wrong

  **1. The "Sneaky Intervention" (Team World)**
  *   **Risk:** World students will say "If I turned off B..."
  *   **Fix:** During the briefing, threaten a "Protocol Violation" penalty. If a World sheet uses active verbs ("turn," "set," "force"), deduct 50% of their "credit" (bragging rights).
  *   **Why it happens:** It's natural language.
  *   **Correction:** Remind them: "You are reading a history book, not operating a machine."

  **2. The "Model Expansion" (Unit 3)**
  *   **Risk:** Lab team says "We just add Temp to the model, now D is invariant."
  *   **Fix:** Acknowledge this is correct *Woodwardian* reasoning. "You just performed a 'Model Relativization.' But notice: Team World didn't have to do that. For them, D caused the flood *simpliciter* on that night. The friction is between *Absolute Token* vs. *Relative Type*."

  **3. The "Bored Lab Team"**
  *   **Risk:** Unit 1 is too easy for Lab.
  *   **Fix:** Give Lab team extra "Noise Variables" on the Logic Card for Unit 1 (e.g., `Z` does nothing). Ask them to verify `Z` is not a cause. This forces them to actually test it.

  **4. The "Diagonal Pass" Chaos**
  *   **Risk:** Sheets get lost or mixed up.
  *   **Fix:** Number the envelopes and sheets 1-6. G1 passes to G4. G4 passes to G1. Keep it bilateral.

  ### 8. Limitations (What the Game Can't Do)
  Be honest about these in the last 5 minutes.

  1.  **Similarity Metric (Lewis):** The game stipulates "closest world = change one variable." Real Lewisian counterfactuals involve messy similarity weights (miracles vs. divergence). You can't simulate that with index cards.
  2.  **Causal Graph Structure (Woodward):** The game gives them the Logic Card (the equations). In reality, discovering the graph *is* the hard part. Woodward assumes we know the modules; the game assumes we know the modules.
  3.  **Normativity:** Neither game captures why we *care* about causation (blame, responsibility, explanation). The game is purely metaphysical/epistemic.

  ### 9. Verdict Sheet Template
  *(Print on half-sheets of paper)*

  ```text
  UNIT: _____   TEAM PROCEDURE: [ WORLD / LAB ]

  | Variable | Verdict (Cause / Not) | Protocol Justification (One Sentence) |
  |----------|-----------------------|---------------------------------------|
  |    R     |                       |                                       |
  |    P     |                       |                                       |
  |    V     |                       |                                       |
  |    F     | (Outcome - Skip)      |                                       |

  COMPARISON NOTES (Fill this in after receiving partner's sheet):
  Do our verdicts match? [ YES / NO ]
  If NO, which variable disagrees? ___________
  ```

  ### Final Advice
  The success of this seminar hinges on your refusal to explain *why* the rules are different until the end. When a student asks, "But isn't holding B fixed the same as imagining a world where B is 0?" your answer must be: "Run the protocol. Write the verdict. Ask me that in the last 15 minutes."

  If they feel the frustration of the mismatch in Unit 2, you have succeeded. They will walk out understanding that "Cause" is not a natural kind they are discovering, but a tool they are building.
