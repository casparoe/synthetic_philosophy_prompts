answer: |-
  My dear friend, you have set a truly formidable trap for me over this coffee, and I must confess it is the sort of puzzle that keeps a student of human nature awake at night. You ask if I can distinguish the corrupted from the merely different without begging the question, without sneaking in some hidden property of beauty residing in the symmetry itself, and without relying on anything beyond the principles we have agreed upon. It is a sharp challenge because it strikes at the very heart of how I believe the standard of taste is established. You describe two critics who possess every external qualification I have ever demanded: delicacy, practice, comparison, good sense, and freedom from prejudice. Yet their internal sentiments diverge radically on the matter of symmetry. One finds delight where the other finds indifference. If beauty is truly a sentiment, and both feel sincerely, on what ground do I stand to say one is right and the other wrong?

  I must begin by reaffirming what we both know to be the foundation of this discussion. Beauty is no quality in things themselves. It exists merely in the mind which contemplates them, and each mind perceives a different beauty. If I say this asymmetrical arrangement is beautiful, I am not speaking of a fact in the object, but of a feeling in my breast. However, I have also insisted that there is a standard of taste, and this is not a contradiction but a necessity of social life. We do seek a rule by which the various sentiments of men may be reconciled. The key to unlocking your puzzle lies not in the object, nor in the abstract definition of the critic, but in the uniformity of human nature. When I speak of the ideal critic, I am not speaking of a solitary judge defined only by a checklist of virtues. I am speaking of a judge who represents the common fabric of humanity. The standard of taste is not established by a single verdict, but by the joint verdict of such critics who share the fundamental constitution of the species.

  You suggest the inverted critic has perfect sensory organs. I grant you the eye may be perfect, the hand steady, the memory vast. But the organ of taste is not merely the eye; it is the internal frame of the mind itself, the constitution of the sentiments. I have written that the general principles of taste are uniform in human nature. If a man were to claim that a bitter poison tastes sweet, we would not say he has a different but equally valid taste; we would say his palate is disordered relative to the common human constitution. In your example, the inversion is not in the sensing of the lines or shapes, but in the reward, the delight, the sentiment of approbation. If this sentiment deviates so wildly from the universal experience of mankind—if all ages and nations find a certain balance in symmetry pleasing while this one critic finds delight only in chaos—then I must conclude that this critic lacks the common internal frame upon which the standard is built. They are not a corrupted version of the ideal critic; they are simply outside the jurisdiction of the standard because they do not share the nature that the standard describes.

  Is this circular? I understand why it might appear so. It sounds as if I am saying the majority is right because they are the majority. But my appeal is not to numbers, it is to the empirical fact of human uniformity. We observe that across time and culture, despite variations in custom and climate, there are certain forms that consistently provoke approbation and others that provoke blame. This consistency suggests a deep structure in the human mind, a common machinery of sentiment. The standard of taste is the refinement of this common machinery. When your inverted critic disagrees, they are not proving that the standard is subjective; they are proving that their own internal machinery is anomalous. I do not call them corrupted because they fail to match an objective property in the asymmetry. I call them anomalous because they fail to match the shared sentiment of the species, which is the only ground upon which a standard of taste can possibly rest.

  Consider the purpose of the standard. It is to regulate sentiment, to distinguish the durable from the fleeting, the healthy from the diseased. If we allow that any internal constitution, no matter how alien to the common human experience, establishes an equally valid standard, then we have no standard at all, only a collection of isolated reports. We would be unable to say that Homer is better than a ballad of yesterday, except to ourselves. But we do say it, and we expect others to agree, because we believe we are appealing to something common in them. If your inverted critic cannot feel that commonality, they are like a man born without the capacity for friendship trying to judge the virtue of loyalty. They may understand the facts, they may articulate the reasons, but they lack the sentiment that makes the judgement possible within the human community.

  So, to answer your question directly, I do have a way to distinguish them, and I hope you will see it is not merely circular. The standard is not defined by the verdict of any individual, even an ideal one, but by the convergence of verdicts among those who possess the common human constitution. The inverted critic is not wrong because they fail to perceive an objective beauty. They are wrong because their sentiment fails to align with the universal principles of approbation that define human nature. They are different, yes, but in a way that excludes them from the role of the judge. A judge must be a representative of humanity, and if their reward circuitry, as you modern thinkers call it, is inverted relative to the species, they are no more a representative of human taste than a man with six fingers is a representative of the human hand. We may pity their inability to enjoy what we enjoy, or marvel at their difference, but we cannot accept their verdict as establishing a new standard. The standard remains rooted in the common sentiments of mankind, refined by art and reason, and those who stand outside that common nature stand outside the standard.
