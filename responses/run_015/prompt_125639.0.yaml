answer: |-
  Mara, a forensic accountant, concludes her audit of a nonprofit with first-order evidence confirming Vendor X overcharged by exactly 18%, based on reconciled ledgers and bank statements. However, she possesses higher-order evidence undermining this conclusion: she was interrupted three times during the final reconciliation, and her firm's internal data indicates auditors interrupted three times exhibit a 40% false-positive rate on overcharge claims of this magnitude, compounded by her subjective feeling of being rushed. Crucially, all three interruptions came from the same colleague regarding an unrelated grant deadline, and Mara privately knows—though she lacks shared data or studies to prove it—that these specific interruptions function as structured mental breaks that reliably sharpen her focus due to a stable, idiosyncratic cognitive pattern unrecorded in the firm's statistical reference class.

  **1. Strict Calibrationist**
  *   **Belief:** Mara must significantly lower her confidence in P (that Vendor X overcharged).
  *   **Reasoning Method:** Objective reliability tracking.
  *   **Why:** Rationality requires aligning confidence with the best available evidence regarding one's reliability. The firm's statistics are public, objective data, whereas Mara's belief about her "idiosyncratic pattern" is private and unverified. To allow private exceptions to statistical norms is to invite bias; therefore, the higher-order evidence defeats the first-order evidence regardless of her internal state.

  **2. Level-Splitter**
  *   **Belief:** Mara can rationally maintain high confidence in P while simultaneously believing she is unreliable in this context.
  *   **Reasoning Method:** Compartmentalization of levels.
  *   **Why:** The first-order evidence (ledgers) strongly supports P, while the higher-order evidence (firm stats) supports the claim that her belief formation is unreliable. Rationality permits holding P true while acknowledging that, given the statistics, she shouldn't trust herself. The contradiction is epistemic akrasia, but it is permitted because the evidence at each level remains distinct and undefeated.

  **3. Context-Sensitive Calibrationism**
  *   **Belief:** Mara should maintain confidence in P.
  *   **Reasoning Method:** Total evidence view with refined reference classes.
  *   **Why:** Rational calibration requires using the *relevant* reference class. The firm's statistic applies to "any three interruptions," but Mara's total evidence includes the specific nature of these interruptions (structured breaks) and her self-model confirming they boost performance. Once the reference class is narrowed to "auditors with this specific cognitive pattern receiving these specific interruptions," the 40% false-positive rate no longer applies, dissolving the higher-order defeater.

  **Structural Feature and Removal Test**
  The single structural feature doing the work is the **mismatch between the general statistical reference class and the private, idiosyncratic self-model**. The case hinges on whether Mara's private knowledge is sufficient to narrow the reference class. If you remove this feature—meaning Mara does not know that these interruptions help her, or they are random noise—the case collapses into a standard standoff. Without the private self-model, Context-Sensitive Calibrationism loses its leverage; the firm's statistics become the best available guide, forcing the view to converge with Strict Calibrationism (lower confidence) or rely solely on Level-Splitting to maintain belief despite acknowledged unreliability.

  **Critique of Strict Calibrationism**
  A defender of Strict Calibrationism would attack the case by arguing that Mara's private knowledge is epistemically suspect. Self-assessment of cognitive performance is notoriously prone to overconfidence bias; without external validation or shared data, her claim that "interruptions help me" is merely a hunch, not evidence. Allowing agents to override objective statistical data with subjective self-models undermines the normative force of higher-order evidence and opens the door for anyone to dismiss error rates by claiming special status. To change my mind on this analysis, one would need to provide evidence that private self-knowledge of cognitive patterns is generally reliable enough to warrant reference class narrowing. My reasoning is most likely to fail here: I am assuming Mara's private knowledge is justified, but in real-world epistemology, unverified self-knowledge is often the very source of error that higher-order evidence is meant to correct.

  Verdict: The mismatch between the statistical reference class and her private self-model.
  Note: This verdict flips if Mara's private self-assessment is shown to be unreliable or biased rather than factive.
