answer: |-
  Three chemists—Negative, Positive, and Republican—are washing burettes in the lab.

  **Negative** says, "Liberty is simple. It's when no one knocks the burette out of my hand. No interference."

  **Positive** says, "No, liberty is having the steady hand and the reagents to titrate the solution myself. It's capacity."

  **Republican** says, "You're both wrong. Liberty is when no one owns the stand the burette is clamped to."

  Just then, the Principal Investigator walks in, grabs the clamp stand, and holds it steady. He doesn't move it. He doesn't twist the stopcock. He just smiles benevolently.

  **Negative** sighs with relief. "See? He's not interfering. The flow rate is constant. I'm free."

  **Republican** drops their pipette. "He's holding the stand. That makes me a ligand in his coordination complex. He provides the orbital space; I just donate the electrons."

  **PI** says, "But I'm a benevolent master. I promise I'll never twist the stopcock."

  **Republican** starts packing their bag. "It doesn't matter. You hold the activation energy. You *can* twist it whenever you want. That's domination."

  **Negative** shakes their head. "But you'll be unstable out there! You need the complex!"

  **Republican** opens the fume hood sash. "Better a free radical than a bound ligand."
