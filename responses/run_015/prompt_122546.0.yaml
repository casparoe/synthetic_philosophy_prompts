answer: |-
  ### Essay Question

  **Topic:** Aquinas on Tyranny and Private Authority

  **Prompt:**
  Consider the following hypothetical case grounded in Thomistic political theory. A provincial ruler governs strictly for his own private advantage rather than the common good, fulfilling the definition of a tyrant. He was installed by a distant Emperor who now refuses all appeals and offers no recourse. The community lacks the institutional capacity to depose him publicly; any collective resistance would trigger a devastating civil war. However, a single private individual could assassinate the tyrant quietly, an act everyone agrees would cause significantly less disorder than allowing the tyranny to continue.

  Recall Aquinas's framework: (1) tyranny is rule for private good rather than common good; (2) resistance is permissible only if the resulting disorder is not worse than the tyranny itself; and (3) killing a ruler is lawful only by public authority or the community, not by private whim.

  Based strictly on these principles, does Aquinas's theory commit him to allowing this targeted killing *in extremis*, or does it demonstrate that his ban on private tyrannicide is absolute? Construct an argument that weighs the teleological goal of the common good against the procedural requirement for public authority. Do not use outside citations; rely on logical extrapolation from the provided framework.

  ***

  ### Model Answer

  Aquinas's political theory rests on the teleological claim that authority exists solely to secure the common good. When a ruler governs for private advantage, he forfeits the moral basis of his rule. In the hypothetical case, the provincial ruler is clearly a tyrant by definition. The central tension lies between the substantive goal of preserving the community and the procedural requirement that judgment against a ruler must come from public authority.

  On one hand, Aquinas's principle regarding disorder suggests the assassination is permissible. He argues that removing a tyrant is inadvisable if it exposes the community to greater dangers than the tyranny itself. Here, the prompt stipulates that collective resistance causes civil war, while private killing causes less disorder. If the metric is purely consequentialist—weighing the survival and peace of the community against the life of the usurper—the private act succeeds where public action fails. The common good is the supreme law; if the only mechanism to save the common good is private action, strict adherence to procedure seems to contradict the ultimate end of politics.

  However, Aquinas's prohibition on private killing is not merely about avoiding disorder; it is about the nature of justice itself. For Aquinas, judgment belongs to the public person, not the private individual. Allowing private whims to determine life and death undermines the rule of law, which is itself a component of the common good. Even if the tyrant is unjust, a private assassin acts without jurisdiction. To authorize private killing is to invite anarchy, where any individual might claim their violence serves the common good. In this view, the ban on private tyrannicide is absolute because the *mode* of action matters as much as the outcome. A community that survives tyranny through private murder may survive physically, but it loses the legal order that makes political life possible.

  The absence of the distant Emperor complicates this. Normally, a higher authority could judge the tyrant. Here, that authority is absent. Does the community inherit that judgment? Aquinas suggests the community can depose a tyrant, but only collectively. In this case, collective action is impossible without disaster. This creates a lacuna in Aquinas's theory. If the community tacitly consents to the assassin, does he become a public instrument? Aquinas might argue no, because the act remains clandestine and private in nature.

  Ultimately, Aquinas's principles likely commit him to forbidding the act. While the common good is the end, the means must be orderly. To allow private killing is to prioritize immediate peace over the structural integrity of justice. Aquinas would likely argue that in such extremis, one must look to divine remedy rather than violate the natural order of judgment. Therefore, the ban on private tyrannicide remains absolute, revealing that for Aquinas, the legitimacy of authority is not solely derived from outcomes, but from the proper ordering of power. The theory prioritizes the preservation of legal order even at the cost of enduring a tyrant, lest the cure destroy the patient's soul rather than just its body.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | **Criterion** | **Marks** | **Common Error** |
  | :--- | :---: | :--- |
  | **1. Definition of Tyranny**<br>Correctly identifies the ruler as a tyrant based on the "private good vs. common good" framework provided. | **4** | Students often focus on the ruler's cruelty rather than the *direction* of his rule (private vs. common). |
  | **2. The Disorder Calculation**<br>Accurately applies the principle that resistance is barred if it causes worse disorder than the tyranny. | **4** | Students frequently ignore the prompt's stipulation that private killing causes *less* disorder than public resistance. |
  | **3. Public vs. Private Authority**<br>Distinguishes clearly between lawful public judgment and unlawful private whim/vigilantism. | **4** | Students often conflate "community consent" with "private authority," missing the procedural distinction. |
  | **4. The Higher Authority Problem**<br>Addresses the specific complication of the absent Emperor and the lack of public recourse. | **4** | Students tend to treat the case as a standard tyranny scenario without addressing the "missing higher authority" constraint. |
  | **5. Final Conclusion**<br>Provides a definitive stance on whether the ban is absolute or conditional based on the weighed principles. | **4** | Students often hedge indefinitely without committing to whether Aquinas would allow or forbid the act. |
