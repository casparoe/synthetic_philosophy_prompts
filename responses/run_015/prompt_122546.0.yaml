prompt: |-
  Hey — I’m putting together a take-home final for my upper-level undergrad seminar on medieval political theory, and I need one essay question on Aquinas’s view of tyrannicide. I don’t want something that can be answered just by saying that Aquinas lets a community depose a tyrant but forbids private individuals from killing him. So build the question around a new case: imagine a ruler who clearly governs for his own private good rather than the common good, but he was installed by a distant higher authority that now ignores all appeals. The only realistic way to remove him without a full civil war is a targeted killing by one private person, and let’s say everyone agrees the resulting disorder would be much smaller than letting the tyranny continue. The question should force students to say whether Aquinas’s own principles actually commit him to allowing this in extremis, or whether they show his ban on private tyrannicide is absolute. Please remind students in the question of the framework — tyranny as rule for private good, the rule that resistance is permissible only if the disorder it causes isn’t worse than the tyranny, and the idea that killing a ruler is lawful only by public authority or the community, not by private whim — but don’t ask for any citations or extra reading. Then give a model answer of about 500–600 words and a marking scheme out of 20 built around five must-hit points, with the mark for each and a one-line note on the usual way students mess it up. Keep it focused and remeber I can edit down if it’s too long; also feel free to seperate the parts clearly.
