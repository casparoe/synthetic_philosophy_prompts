          4.  Conceivability $\neq$ Possibility (for empirical identities).
          5.  Theoretical terms (TTs) = "Functionally Rigid" (FR). They pick out whatever plays role $R$ in actual world. If nothing plays $R$ in $w$, term fails to designate (empty reference).
          6.  This distinction (Primitive Rigidity vs. Derivative Functional Rigidity) allows rejecting pure descriptivism and pure causal theories, and avoids full-blown essentialism about *every* scientific kind.
      *   **Specific Concerns:**
