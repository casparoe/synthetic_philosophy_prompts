  **1. Does Hobbes reject Euclid's parallel postulate in *substance* (truth) or only in *formulation/strategy* (proof/definition)?**

  *   **1.1 Rejects in Substance**
      *   **2. How are geometric objects treated?**
          *   **2.1 Mental Constructions** → **3. Status of Squaring the Circle?**
              *   **3.1 Principled Impossibility** → **Leaf: Unnamed (Idealist Misreading)**
                  *   *Commitment:* Hobbes's materialism is ignored to preserve his geometry as pure thought.
              *   **3.2 Contingent Limitation** → **Leaf: Unnamed**
                  *   *Commitment:* Hobbes denied parallel truths because his tools were physically inadequate.
              *   **3.3 Actually Resolved** → **Leaf: Unnamed**
                  *   *Commitment:* Hobbes discovered a non-Euclidean geometry before its time.
          *   **2.2 Descriptions of Actual Physical Motion** → **3. Status of Squaring the Circle?**
              *   **3.1 Principled Impossibility** → **Leaf: Unnamed (Materialist Misreading)**
                  *   *Commitment:* Hobbes's physics falsifies Euclidean truth claims about parallels.
              *   **3.2 Contingent Limitation** → **Leaf: Unnamed**
                  *   *Commitment:* Physical lines have width, causing parallel postulate failure in practice.
              *   **3.3 Actually Resolved** → **Leaf: Unnamed**
                  *   *Commitment:* Physical motion validates a substance-rejection of Euclidean parallels.
          *   **2.3 Linguistic-Logical Definitions** → **3. Status of Squaring the Circle?**
