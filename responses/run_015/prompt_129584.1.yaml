  hey so im building a handout for an anthro seminar and i need a sorting tree — like a decision flowchart — for positions on whether societies actually collapse or just reconfigure. Focus on three cases: the Bronze Age palace economies, the Classic Maya, and Easter Island (the moai/toppling shift to the birdman cult). I want it to sort people by answers to concrete case-questions, not by the label they like.

  Start with this: if you think Easter Island's shift away from moai-building is just religious reorientation with no collapse, go left; if you think it's collapse despite no demographic wipeout, go right. Next branch: is the disappearance of writing — Linear B, Classic Maya script — necessary for calling something collapse? Then: is demographic contraction sufficient even if local exchange networks survive, like that idea of "administrative dark matter" where small-scale trade keeps going after palaces fall?

  The tree needs these leaves: (1) pure narrative framing — we call it collapse because we liked the monuments; (2) complexity-loss — collapse means losing hierarchical integration and writing; (3) demographic determinist — collapse is mainly population crash, institutions are secondary; (4) silent reorganization — local networks survive and adapt, so it's not failure just invisibility to state-centered archaeology; (5) flag one empty combo, like "writing loss is necessary but Easter Island had none to lose so it's automatically not collapse" — say whether anyone holds that and why it's unoccupied.

  Make it about 6-8 nodes, for undergrads who haven't read the whole literature. Don't ask for a bibliography or citations — just the tree, with each node phrased as a yes/no or pick-one question someone can answer without knowing the jargon, and each leaf getting one sentence describing its most awkward commitment. Also flag if any two leaves come out identical on all your branches, especially whether your tree can actually seperate the "silent reorganization" view from the "pure narrative framing" view — if they land on the same answers, say so explicitly.

  oh and keep the language casual, its just for a discussion draft.
