answer: |-
  There is no single established term in aesthetics or philosophy of perception that captures the specific triad of features you describe. Your case sits at an intersection where **Cognitive Penetrability** (philosophy of mind), **Perceptual Learning** (psychology), and **Categorization** (aesthetics) overlap, but it violates the standard boundaries of each.

  The standard view of Cognitive Penetrability holds that if a belief changes a perception, removing the belief should (eventually) revert the perception. The standard view of Aesthetic Categorization (e.g., Walton) holds that if a category is factually incorrect, the aesthetic properties grounded in it are illusory or incorrect. Your case defies both: the perception persists *after* the belief is retracted, and the hearing remains phenomenologically robust even when the factual ground is pulled.

  Because the existing vocabulary forces you to choose between "it's just belief" (which fails the phenomenology) or "it's just perception" (which fails the genealogy), I propose we carve this out as a distinct phenomenon.

  ### The Coined Term: **Testimonial Perceptual Crystallization**

  **Definition:** A state change in auditory perception wherein propositional testimony acts as a nucleation point for a Gestalt reorganization of sensory data. Once the reorganization occurs, the perceptual structure becomes self-supporting (crystallized) based on the acoustic viability of the stimulus, rendering it independent of the testimony's truth value or the listener's continued belief in the testimony.

  ### The Carving: Distinguishing from "Near Misses"

  To see why this requires a new term, we must distinguish it from the three concepts it most resembles.

  **1. Versus Wittgensteinian Aspect-Seeing (Duck-Rabbit)**
  *   **The Difference:** Aspect-seeing is voluntary and reversible; both aspects remain available. In Crystallization, the prior state is *lost* (you cannot un-hear the viola line). Furthermore, aspect-seeing is non-normative (neither duck nor rabbit is "correct"). Your case is normative: there is a right way to hear it, and the new way feels like the *discovery* of a fact, not the adoption of an interpretation.
  *   **The Carve:** Crystallization is **irreversible** and **veridical-feeling**.

  **2. Versus Kendall Walton's "Categories of Art"**
  *   **The Difference:** Walton argues we hear works under categories (e.g., "Guernica" under "Cubism"). If we are told a work is not Cubist, we *ought* to stop hearing it as such. In your case, you are told the information was false (wrong edition), yet the hearing persists. Walton treats the category as a lens you look *through*; Crystallization treats the category as a structure that hardens *into* the object.
  *   **The Carve:** Crystallization survives **factual debunking** of the category.

  **3. Versus Standard Cognitive Penetrability**
  *   **The Difference:** Standard penetrability implies a continuous dependency: I hear X *because* I believe Y. If I stop believing Y, the penetration should cease. In Crystallization, the belief is a *scaffold* that is kicked away after construction. The perception becomes **encapsulated** (in the Fodorian sense) *after* being penetrated.
  *   **The Carve:** Crystallization involves **Justificatory Decoupling**: the perceptual state detaches from its epistemic cause.

  ### Verdict on the Three Features

  You asked whether the three features (One-shot Permanence, Generalization, Debunking Survival) are one phenomenon or distinct. They are **causally linked phases** of a single process, but they are **mechanistically distinct**.

  1.  **One-shot Permanence (The Trigger):** This is a **Gestalt Insight**. It distinguishes the phenomenon from gradual Perceptual Learning (which requires repetition). The sentence provides the "key" that unlocks the pattern.
  2.  **Generalization (The Structure):** This is **Schema Induction**. The sentence doesn't just point to a bar; it provides a rule ("listen for buried viola counter-melodies"). This allows the hearing to transfer to other works. Without this, you would only hear the specific bar, not the style.
  3.  **Debunking Survival (The Autonomy):** This is **Perceptual Hysteresis**. This is the most philosophically significant feature. It occurs because the acoustic signal *supports* the hearing, even if the historical/textual claim does not. The sound waves contain enough ambiguity or potential to sustain the viola line. Once your brain organizes the waves that way, the organization is self-evident in the data. The testimony was the match, but the fuel was in the sound.

  **Verdict:** They travel together because Feature 1 creates the Schema (Feature 2), and the Schema's acoustic viability allows for the Autonomy (Feature 3). However, it is possible to have 1 without 2 (hearing a specific bar but not the style) or 1 without 3 (hearing it only as long as you believe the source). Your case is the "perfect storm" where all three align. Feature 3 is the defining characteristic that separates this from mere suggestion.

  ### Boundary Cases

  To refine the definition, we must distinguish Crystallization from two boundary cases where the label should *not* apply.

  **Case A: The Hallucination (False Positive)**
  *   *Scenario:* A colleague tells you there is a quote from *The Rite of Spring* in a piece. You hear it. Later, you learn the composer denied it and the intervals do not match. You *continue* to hear the quote.
  *   *Verdict:* This is **Pareidolia**, not Crystallization.
  *   *Why:* In Crystallization, the acoustic data must be *viable* for the hearing (the viola line is physically present in the mix, just buried). In Pareidolia, the acoustic data does not support the pattern; the brain is imposing a pattern that isn't there. If you listen with a spectrogram or isolate the track and the line vanishes, it was Pareidolia. If the line remains audible once pointed out, it is Crystallization. The "Debunking" in your case was about the *edition*, not the *acoustics*.

  **Case B: The Technical Instruction (Local Attention)**
  *   *Scenario:* A colleague says, "Watch the oboist at bar 30, she comes in early." You hear the early entry. Later, you learn she was actually on time. You stop hearing the early entry.
  *   *Verdict:* This is **Suggestibility**, not Crystallization.
  *   *Why:* The perception here is fragile and relies entirely on the continued belief in the proposition. It lacks the "Hysteresis." Once the belief goes, the perceptual distortion corrects itself. Crystallization requires the percept to become "sticky" and phenomenologically objective.

  ### Summary of the Phenomenon

  You are describing a moment where **testimony functions not as information, but as a perceptual tool.**

  The sentence ("the viola has the counter-melody") is not processed as a fact to be stored in memory; it is processed as an algorithm for auditory segregation. Once the auditory system segregates the stream according to that algorithm, the segregation becomes the default state of the auditory system for that stimulus class.

  The survival of debunking is the crucial clue: it proves that the *truth* of the testimony was less important than its *utility*. The testimony was false regarding the *score* (the edition), but true enough regarding the *sound* (the acoustic potential). Your brain locked onto the acoustic potential, and that lock is mechanical, not epistemic.

  **Term:** Testimonial Perceptual Crystallization.
  **Core Mechanism:** Justificatory Decoupling via Acoustic Viability.
  **Status:** A distinct subtype of Cognitive Penetrability characterized by Perceptual Hysteresis.
