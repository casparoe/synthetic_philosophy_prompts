answer: |-
  **Q&A PREP SHEET: Copy-Robustness & Newcomb's Problem**
  **To:** Self
  **Re:** Department Work-in-Progress Talk
  **Audience:** 12 ppl (Majority CDT, 2 Epistemologists, 1 Game Theorist). None specialize in functionalism/simulations.

  ### **OPENING CONCESSIONS (First 2 Minutes)**
  *Don't fight the physics.* Concede immediately that in the Simulant Variant, there is **zero causal influence** between your choice and the box's content. The CDT hardliners are right about the causal graph. If you try to argue there's a "hidden causal link," you lose credibility.
  *   **Say this:** "I am not arguing that you causally affect the past. I am not arguing that the simulation sends a signal. I grant the CDT causal model is correct *given* the standard definition of an agent. My claim is that the standard definition of an agent is the variable we should be manipulating, not the causal graph."
  *   **Why:** This disarms the "magic" accusation. It frames the talk as metaphysics/semantics, not physics.

  ---

  ### **THE SINGLE REPLY THAT MUST LAND**
  **The Intuition Pump Check.**
  If you leave the room with nothing else, they must accept that their intuition in the **Simulant Variant** matches their intuition in **Classic Newcomb**.
  *   **The Line:** "If you 2-box in the Simulant case but 1-box in the Classic case, you need to explain what *causal* work the Predictor is doing that the Simulator isn't. If the intuition survives the removal of the Predictor, then 'Prediction' wasn't the load-bearing premise. 'Agency Boundaries' were."
  *   **Why:** This forces the CDT people to defend the Predictor's special status, which is hard without invoking the very "spooky" correlations they usually reject.

  ---

  ### **ANTICIPATED OBJECTIONS & REPLIES**

  #### **1. The CDT Hardliner (Causal Dominance)**
  **The Objection:** "Look, the money is already in the box. The copy is dead. Your choice literally cannot change the state of the world compared to the alternative. You're asking me to act *as if* I have magic powers. Dominance reasoning applies: Box A is empty or full regardless of what I do. I take both."
  **The Reply:** "I agree dominance applies if 'You' refers only to the biological organism standing here. But decision theory is about selecting a *policy*, not just a muscle movement. If 'You' includes the functional algorithm that was simulated, then your choice *does* determine the box content, because the simulation's choice determined it, and you *are* that algorithm. I'm not asking you to break causality; I'm asking you to locate the agent upstream of the biology."
  **Where it's Soft:** They will view "locating the agent upstream" as verbal trickery. To them, *you* are the body in the room. You need a principled reason why the algorithm counts as "you" other than "it helps me get money."

  #### **2. The Game Theorist (Correlated Types)**
  **The Objection:** "Why are we inventing metaphysical baggage like 'copy-robustness'? This is just a game with correlated types. You and the simulation share a type. Standard equilibrium analysis handles this. You're just describing a correlated equilibrium without the math. Why call it a new decision theory?"
  **The Reply:** "In a correlated equilibrium, two distinct players receive signals from a common source. My claim is stronger: there aren't two players. There is one agent instantiated twice. If it's just correlation, you should be indifferent to whether the copy is destroyed or not. But if I tell you the copy *survives* and you meet them later, the strategic landscape changes (now it's a coordination game). The fact that the *destruction* of the copy doesn't change your intuition suggests you aren't treating it as a separate player to begin with."
  **Where it's Soft:** Distinguishing "one agent twice" from "two perfectly correlated agents" is notoriously difficult without begging the question. They might press you on what observable difference this makes.

  #### **3. The Formal Epistemologist (EDT in Disguise)**
  **The Objection:** "This sounds like Evidential Decision Theory with extra steps. EDT says condition on the act. You're saying condition on the copy's act. But since the copy is identical to you, conditioning on your act *is* conditioning on the copy's act. Haven't you just derived EDT from a functionalist premise? What's the gain?"
  **The Reply:** "EDT treats the correlation as a brute probabilistic fact. I'm treating it as an *identity* fact. EDT breaks down if the correlation is 99% but not perfect (the 'Tickle Defense' problem). Copy-robustness gives us a handle on *why* we condition: not because of statistical regularity, but because the output is logically necessitated by the same source code. It grounds the evidence in ontology, not just frequency."
  **Where it's Soft:** If the math comes out identical to EDT in all practical cases, they will accuse you of metaphysical inflation. You need to find a case where Copy-Robustness diverges from standard EDT.

  #### **4. The "Common Sense" Metaphysical Objection**
  **The Objection:** (Likely from the CDT sympathizers who aren't hardliners) "But the copy isn't *you*. It's a bunch of bits in a server. It was destroyed. I have no access to its mental state. How can I be responsible for something I can't see and don't experience?"
  **The Reply:** "You don't have access to the causal mechanisms of your own brain either, you just have the output. The claim is that 'you' are the information processing structure, not the substrate. If I upload your mind and run it on silicon, and you say 'I am still here,' you've accepted functionalism. I'm just asking you to apply that consistently to the decision problem."
  **Where it's Soft:** The prompt says *nobody* works on functionalist views. This is your biggest risk. They may simply reject functionalism outright as irrelevant to decision theory. If they dig in on "I am my body," the argument stalls.

  ---

  ### **THE QUESTION I'M HOPING NOBODY ASKS**
  **"What happens when the simulation is 90% accurate?"**
  **Why it's deadly:** My argument relies on a binary: either the copy is functionally identical (robust) or it isn't. If the simulation is slightly imperfect (maybe it gets tired faster, or has a slight variance in random number generation), does copy-robustness degrade linearly?
  *   If I say **Yes**: Then my view collapses into a probabilistic view (like EDT or CDT+), and the "ontological" claim loses its punch.
  *   If I say **No**: It implies a magical threshold where agency snaps into existence. That's implausible.
  *   **Prep:** If asked, pivot to "Degrees of Agency." Argue that decision theory usually assumes ideal agents, and this is a theory for ideal cases. Don't try to solve the Sorites paradox live.

  ---

  ### **GENERAL TONE NOTES**
  *   **Don't get defensive.** You are proposing a reframing, not claiming CDT is "wrong" about math, but "narrow" about metaphysics.
  *   **Watch the Game Theorist.** If they start drawing payoff matrices, let them. Just keep pointing out that the matrix assumes distinct rows/columns for You vs. Copy, which is the premise in question.
  *   **American English:** Keep it punchy. "Here's the thing," "The load-bearing beam," "Let's grant that." Avoid overly dense jargon where possible.

  **Good luck. You're asking them to change how they define 'self' to save their decision theory. That's a heavy lift, but if the Simulant Variant sticks, you've got a foothold.**
