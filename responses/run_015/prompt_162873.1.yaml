  This question tests the student's ability to distinguish between a definition and a substantive theoretical commitment. A slogan-reciter will assert that ungroundedness suffices for fundamentality by stipulation. A successful student must recognize that fundamentality is introduced to solve a specific problem about metaphysical explanation. They must see that if an item explains nothing, calling it fundamental renders the concept idle. The crux is recognizing that the biconditional assumes every ungrounded thing plays a structural role, which is a claim about reality, not language.

  4. **Model answer**
  The standard view identifies the fundamental with the ungrounded. On this picture, to be fundamental is simply to lack a metaphysical cause. However, the Core/Residue distinction demonstrates that ungroundedness is merely a negative property. It tells us what does not happen to an item, but not what the item does. If we accept this distinction, we see that Residue items are ungrounded but metaphysically inert. They ground nothing. Core items, by contrast, are the base upon which the rest of reality depends. The question is whether metaphysical inertness is compatible with fundamentality.

  I argue that it is not. Fundamentality is not just about where chains stop; it is about what supports the derivative. The concept is introduced to capture the idea that reality has a structure where some things exist in virtue of others. The fundamental items are those in virtue of which everything else exists. If an item is Residue, it does not contribute to this project. It exists, but nothing else exists in virtue of it. Calling it fundamental suggests it plays a role in the metaphysical explanation of the world, which it does not. Therefore, fundamentality should be restricted to Core items.

  This move requires accepting the No Idlers principle: there are no Residue items. This is crucial. If we define fundamental as ungrounded, then Residue is fundamental by definition. But if we define fundamental as Core, then Residue is impossible. The choice reveals that the standard biconditional is not a definition but a substantive assumption. It assumes that every ungrounded thing grounds something. This is a claim about the structure of reality, not merely about how we use words. Without this assumption, the concept of fundamentality loses its explanatory power. We could have a world full of fundamental facts that explain nothing.

  Consider the alternative. If we allow Residue to be fundamental, we sever the link between fundamentality and explanation. The fundamental is supposed to be the source of being for the non-fundamental. Residue has no offspring. It is an orphan without ancestors. It is distinct from the derivative, but it does not generate it. Some might argue that independence is enough for fundamentality. But independence is negative. Fundamentality is positive. It is the capacity to ground. Without this capacity, ungroundedness is trivial. Any isolated fact would be fundamental. This makes the concept too broad to be useful. It fails to distinguish between what is basic and what is merely isolated.

  Furthermore, if we stick to the standard slogan, we cannot rule out realities where the fundamental stuff does nothing. This defeats the purpose of grounding, which is to map dependence. The fundamental is the bottom of the structure, not just the absence of a top. Residue is outside the structure. Therefore, only Core items are fundamental. This makes No Idlers a necessary constraint on viable metaphysical theories. It is not a mere terminological stipulation. It ensures that when we list the fundamental facts, we list everything needed to derive the rest. Residue is not needed. So it is not fundamental.

  In conclusion, the equation fails because it ignores the directional nature of grounding. Fundamentality is the bottom of the structure, not just the absence of a top. Residue is outside the structure. Therefore, only Core items are fundamental. This makes No Idlers a necessary constraint on viable metaphysical theories. It is not a mere terminological stipulation. The biconditional is substantive. It assumes a specific architecture of reality where nothing is left out of the explanatory chain. To treat it otherwise is to trivialize the metaphysical project.

  5. **Marking scheme**
  1.  **Conceptual Distinction (5 marks):** Clear definition of Core vs. Residue. *Error:* Conflating residue with derivative items.
  2.  **Standard View Analysis (5 marks):** Accurate statement of the ungroundedness view. *Error:* Treating the biconditional as an undeniable definition.
  3.  **Explanatory Role Argument (5 marks):** Argument linking fundamentality to grounding others. *Error:* Focusing only on independence without explanatory function.
  4.  **No Idlers Evaluation (5 marks):** Correct identification as a substantive principle. *Error:* Dismissing it as a mere terminological stipulation.
  5.  **Final Verdict (5 marks):** Clear conclusion on the biconditional's status. *Error:* Ambiguous or contradictory stance on fundamentality.

  6. **A borderline B answer**
  The standard view says the fundamental is the ungrounded. Therefore, if Residue is ungrounded, it is fundamental. The Core items are also fundamental because they ground things. The difference is just that Core items do more work. But both are ungrounded, so both are fundamental. The No Idlers principle says there is no Residue. This is a claim about the world. If there were Residue, it would still be fundamental because it lacks grounds. The student understands the vocabulary but treats the biconditional as a definition rather than a substantive claim about explanatory roles. They fail to see why inertness matters for the concept.
