prompt: |-
  I just joined the board of the tiny rural water district where I live — my own kid drinks this water — and we're completely stuck. We have to decide whether to keep our current chlorination, which produces a disinfection byproduct that's inside the legal limit but that some newer animal studies hint is a developmental risk well below that limit, or switch to a different treatment that handles much better the parasite that gave us two boil-water advisories, but which has thin human data and one suggestive endocrine signal. One member invoked the precautionary principle to argue for switching, another invoked the exact same phrase to argue for staying put, and we've had three meetings going in circles.

  My working theory is that this isn't a scientific disagreement — we all agree on the facts — but a disagreement about who gets stuck with the burden of proof when nobody can run the study that would settle it, and that the phrase is just a flag people plant on whatever default they already liked. Is that right, or is there something substantive underneath: is precaution a procedural rule about who has to go get evidence, or a substantive decision rule about minimizing the worst case, and can it even apply to doing nothing? Diagnose what our board is actually fighting about, tell me what would count as progress here — a distinction, a rule, a different question — and be honest if the concept is doing no work in a case where precaution points both directions.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user is a new board member of a tiny rural water district.
      *   **Stake:** Personal (their kid drinks the water) + Public trust (board responsibility).
      *   **Problem:** Decision paralysis between two water treatment options.
          *   *Option A (Current/Chlorination):* Legal limits met, but newer animal studies suggest developmental risks below limits. Vulnerable to parasites (2 boil advisories).
          *   *Option B (New Treatment):* Better parasite control, but thin human data + one suggestive endocrine signal.
      *   **Conflict:** Two board members both invoke the "Precautionary Principle" to argue for opposite outcomes.
      *   **User's Hypothesis:** This isn't a scientific disagreement; it's about the *burden of proof* and the *default status*. The term "precaution" is being used rhetorically to justify pre-existing preferences.
      *   **Request:** Diagnose the real fight, explain if precaution is procedural or substantive, determine if it applies to inaction, and suggest what counts as progress (distinction, rule, question). Be honest if the concept is useless here.

  2.  **Deconstruct the "Precautionary Principle":**
      *   *Definition:* Broadly, "better safe than sorry." But legally and philosophically, it's messy.
      *   *The Paradox:* The user has identified the "Precautionary Paradox." If you take precaution against Risk X (byproduct), you might expose yourself to Risk Y (parasite/endocrine). Precaution against one thing is recklessness against another.
      *   *Procedural vs. Substantive:*
          *   *Procedural:* Who has to prove safety? (Shifts burden of proof).
          *   *Substantive:* What outcome minimizes worst-case harm? (Maximin rule).
      *   *Status Quo Bias:* Precaution is often weaponized to protect the status quo ("don't change until proven safe") OR to force change ("don't keep using this until proven safe").

  3.  **Diagnose the Board's Fight:**
      *   The user is largely right. It's a conflict over *which risk counts as the default threat*.
      *   Member 1 (Switch): Precaution = Don't expose kids to potential developmental toxins (Chemical Risk). Default = Chemical safety.
      *   Member 2 (Stay): Precaution = Don't expose kids to potential parasites/endocrine disruptors from new tech (Biological/New Tech Risk). Default = Known system stability.
      *   *Real Issue:* It's not about "precaution" generally; it's about *risk prioritization* and *trust in the known vs. the unknown*. It's a value judgment disguised as a scientific principle.

  4.  **Evaluate the Concept's Utility:**
      *   Is "Precaution" doing work? No, not as currently used. It's a Rorschach test.
      *   Why? Because it lacks a *comparative* framework. It treats risks in isolation.
      *   Can it apply to doing nothing? Yes, but only if "doing nothing" is an active choice to maintain a risk profile. Inaction is not risk-neutral.

  5.  **Formulate a Path to Progress:**
      *   Need to move from "Precaution vs. Precaution" to "Comparative Risk Assessment."
      *   Need to make the value judgments explicit.
      *   Need to define the "Default" explicitly.
      *   *Key Distinction:* **Precaution against Hazard** vs. **Precaution against System Failure.**
      *   *Key Question:* "What is the *irreversible* harm?" (Developmental vs. Acute Infection vs. Endocrine).
      *   *Key Rule:* **ALARA (As Low As Reasonably Achievable)** combined with **Multi-Criteria Decision Analysis (MCDA).**

  6.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Start by validating the user's insight. They are sharp. The "Precautionary Paradox" is a known phenomenon in risk regulation.
      *   *Diagnosis:* Confirm that the fight is about the *Baseline*. One side sees the chemical as the intrusion; the other sees the technology change as the intrusion.
      *   *Substantive vs. Procedural:* Explain that Precaution is usually procedural (shift burden), but here it's being used substantively (minimize worst case). The problem is they disagree on *which* worst case matters more.
      *   *Inaction:* Address whether precaution applies to doing nothing. Yes, but "doing nothing" maintains the current risk profile. It is not a neutral state.
      *   *Progress:* What helps?
          *   Stop using the phrase "Precautionary Principle." It's too vague.
          *   Adopt **Comparative Risk Assessment**.
          *   Distinguish between **Reversible** and **Irreversible** harms.
          *   Distinguish between **Probability** and **Severity**.
          *   Introduce **Adaptive Management** (try, monitor, pivot).
      *   *Honesty:* Admit that if the risks are truly incommensurable (e.g., cancer risk vs. parasite outbreak), science can't solve it. It requires a value judgment. The board needs to own that, not hide behind "precaution."

  7.  **Refining the Tone:**
      *   Needs to be empathetic but rigorous.
      *   Avoid jargon where possible, but use precise terms where helpful (e.g., "status quo bias," "type I/II errors").
      *   Acknowledge the personal stake (the kid).
      *   Structure: Diagnosis -> The Concept -> The Trap -> The Way Out.

  8.  **Self-Correction/Nuance Check:**
      *   *Did I answer the specific question about procedural vs. substantive?* Yes, need to make sure that distinction is clear.
      *   *Did I address the "doing nothing" aspect?* Yes, emphasize that maintenance is an active choice.
      *   *Is the advice actionable for a rural board?* Keep it practical. They probably don't have money for complex modeling. Focus on framing the discussion.
      *   *Is the user right?* Yes, mostly. But add nuance: it's not *just* rhetoric; it's about underlying values regarding uncertainty.

  9.  **Final Polish:** (Reviewing against the prompt's constraints).
      *   "Diagnose what our board is actually fighting about."
