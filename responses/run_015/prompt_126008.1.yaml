      *   *Refinement on "Moral Equivalence":* Be very clear here. Individual PTP is about *my* time. Institutional PTP is about *other people's* time. That's the key distinction.
      *   *Refinement on "Governance":* Ensure the mechanisms aren't just financial. They need to be constitutional/charter-based.

  5.  **Final Review against Constraints:**
      *   American English? Yes.
      *   No bibliographies? Yes.
