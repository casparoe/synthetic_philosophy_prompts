answer: |-
  Your draft is sharp, but the mechanics of "hardening" face significant metaphysical pressure. Here are direct answers to your six points.

  1.  **§2 Fairness:** §2 is fair only if you assume eternalism. If the future is ontologically open (nothing exists there), there is no fact *now* that the battle occurs. Your objection bites only if the gap theorist accepts existing future facts but denies truth-values. That is an unstable mix. If the gap theorist denies the existence of future facts, §2 loses its grip, but then "hardening" looks like coming-into-existence, not a change in truth-status.

  2.  **The Regress (§4):** The regress is real if "B hardens at noon" is itself a future contingent. If it is contingent, it needs a hardening time. Option (c) stops this by making the schedule a necessary structural fact. But then you must explain why the *outcome* isn't also structural. If the structure of time settles *when* truth attaches, why doesn't it settle *which* truth attaches?

  3.  **Collapse (§5):** Scheduled Settling risks collapsing into Ockhamism. The Ockhamist says "It is true now that B." You say "It is true now that B will have a truth-value at noon." If the schedule is settled, you have a determinate fact about the future structure. The metaphysical burden is nearly identical. You've moved the determinacy from the event to the timeline, but you still have a determinate future fact.

  4.  **§3 Weakness:** §3 conflates branching with bivalence. Branching time semantics often *use* gaps (supervaluationism). You can accept the branching structure without accepting that B is true-or-false now. The gap isn't erased by branching; it's explained by it. You don't need to abandon gaps to accept branching; you just need to deny the "Thin Red Line" that picks one branch as actual *now*.

  5.  **Novelty:** This is very close to Supervaluationism over Branching Time. In that view, truth is defined relative to a history. At a moment, a proposition is gapped if it varies across histories. Your "schedule" is the tree structure itself. Your "hardening" is the moment a proposition becomes true/false on all remaining histories (or the moment of evaluation shifts). Your difference is rhetorical: you frame it as a property change (hardening) rather than a semantic evaluation shift. It's a reframing, not a new metaphysics.

  6.  **Causal Preconditions (§6):** "Causal preconditions complete" is hand-waving. In indeterministic causation, preconditions can be complete without the effect being necessitated. If the cause is complete but the effect is still chancy, why does truth-value attach? You need a principle linking causal completion to semantic settling that doesn't smuggle in determinism.

  **The "Thin Schedule" Worry:** Your worry in §6 is the strongest point. If the schedule is privileged structure, why is it less objectionable than the Thin Red Line? The Thin Red Line picks the *actual* history. Your schedule picks the *moment of resolution*. If indeterminism is real, why is the moment of resolution determinate? If a quantum event decides the battle, does the hardening happen before or after the decay? If the schedule says "noon" but the decay happens at 11:59, your schedule is wrong. If the schedule waits for the decay, it's not settled now. This tension threatens §5.

  **Verdict:** The "hardening" metaphor is vivid, but Scheduled Settling looks like a renaming of existing branching-time semantics. The real work is in §6; if you can't define the schedule without determinism, the view collapses. You need to explain how the *time* of settling is fixed while the *content* is not, without invoking a deterministic structure that contradicts the openness you're trying to preserve.
