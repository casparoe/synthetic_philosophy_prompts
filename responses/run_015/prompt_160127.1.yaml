answer: |-
  **The Spec: Desiderata for 'Why Be Moral?'**

  **Non-Negotiable (The Hard Core)**
  1.  **The Undisturbed Agent:** The answer must address a fully informed, instrumentally rational agent with no weakness of will. *Case:* Glaucon's challenge assumes ignorance and irrationality are excuses, not solutions.
  2.  **Justificatory Priority:** Must provide normative reasons, not psychological causes or genealogical origins. *Case:* Explaining why we *do* behave morally does not explain why we *should*.
  3.  **The Ledger & Reverse Ring:** Must hold when deeds are recorded but burned (no reputation) and when you are punished for good acts you didn't commit. *Case:* Tests whether justice is valued for itself or merely for its consequences.

  **Preference (Contested Ground)**
  4.  **Cost Ladder Specification:** Must declare whether obligation persists at the life-cost rung. If it breaks, it must justify why this isn't a defeat. *Status:* Preference. Demanding it never breaks rules out supererogation; demanding it breaks concedes morality is conditional.
  5.  **Efficacy & Compliance:** Must address near-total non-compliance and individual inefficacy. *Status:* Preference. Strict adherence here favours deontology over consequentialism unfairly.

  **Junk (Camp Prejudices)**
  6.  **Character/Integrity:** *Junk.* Presupposes virtue is itself a good, begging the question against the egoist.
  7.  **Neutrality Between First-Order Theories:** *Junk.* Impossible to satisfy without emptiness; substantive answers necessarily privilege specific moral architectures.

  **The Incompatible Pair**
  You cannot jointly satisfy **Instrumental Rationality** (Undisturbed Agent) and **Categorical Obligation**. If the agent only recognises reasons stemming from existing desires (instrumental), moral demands cannot be binding independent of those desires (categorical). To save the categorical feel, you must redefine rationality to include moral ends, which violates the Undisturbed Agent constraint. One must yield: either morality is hypothetical (dependent on desire) or rationality is substantive (includes moral truths).

  **The Killer Requirement**
  **The Ledger Case.** This does the most work eliminating popular answers. It instantly disqualifies prudential accounts relying on reputation, divine punishment, or social contract enforcement. If the book is burned unread, external sanctions vanish; if the agent is undisturbed, internal anxieties vanish. Only intrinsic value survives.

  **Theory Scores**
  *   **Self-Interest/Prudential:** Fails the Ledger; immorality often maximises utility when sanctions are removed.
  *   **Mutual Advantage/Contract:** Fails Non-compliance; creates a sucker's payoff when others defect.
  *   **Kantian/Constitutivist:** Meets Undisturbed Agent; strains against Cost Ladder (demands sacrifice without external reward).
  *   **Character-Based:** Fails Neutrality; presupposes virtue is beneficial rather than proving it.
