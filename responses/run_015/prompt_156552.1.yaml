prompt: |-
  Hey — I'm a journalist covering science and ideas for a general audience, and I'm working up a story about the weird financial plumbing between governments and churches in Europe and the US. I keep running into details that don't fit the simple seperation of church and state narrative we usually tell. In Germany, for instance, the state tax office collects Kirchensteuer for registered Catholics and Protestants, and if you file a Kirchenautritt to opt out you stop paying — but in some dioceses that also means you're barred from communion and church burial. Meanwhile France has laïcité, which keeps religion out of public schools and government funding in principle, though they still have some contracts with private religious schools, and England has an established Church with bishops in the Lords but no church tax, funded mostly by old endowments and parish giving. The US, of course, has the Establishment Clause, but every administration interprets it differently. I was talking with a friend who study political philosophy, and she said these four models don't just reflect different histories — they actually presuppose different answers to what religious freedom is for: is it about private belief, corporate autonomy, national culture, or something else? So I need you to do the philosophical reconstruction: for each setup, what view of state neutrality, of the church as an institution, and of the individual believer does the practice quietly require? Specifically, does Germany's model treat membership as an administrative status the state can bill for, and does that clash with liberal ideas about voluntary association? Does France's exclusion of visible religion from public spaces rest on a particular theory of equality? Does England's establishment assume a symbolic church that doesn't coerce? And does the US separation model presuppose that government money or recognition always corrupts religion? I don't want citations or a bibliography — just a sharp reconstruction of the implicit theory behind each model. Say what each one strictly presupposes versus what merely fits well with it, point out where the four setups quietly contradict each other, and tell me whether they could all survive if you replaced the underlying view with a purely contractual model of religious membership — like a subscription you cancel, with no sacramental or civic fallout.
