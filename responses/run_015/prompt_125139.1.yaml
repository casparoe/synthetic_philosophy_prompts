  1.  **Deconstruct the Request:**

      *   **Role:** Scientific Secretary of a National Research Council's Standing Review Panel.
      *   **Task:** Create a decision procedure for assessing large, long-running research programmes (10-40M€, 8-15 years old).
      *   **Constraints:**
          *   Time: ~1 afternoon per programme (3-4 hours).
          *   Input: 40-page dossier (self-report, pub list, 2 external reviews).
          *   Panel: Working scientists + 1 statistician (no philosophy of science training).
          *   Output: One of 4 verdicts (Renew, Renew w/ Restructuring, Probation, Wind Down).
          *   Requirement: Must be checkable against the dossier (no impressions), appeal-proof.
          *   Framework: Lakatosian Methodology of Scientific Research Programmes (MSRP), but *implicit* (panelists shouldn't need to know Lakatos).
      *   **Specific Distinctions to Handle:**
          1.  Identity Question (Hard Core change = New Programme).
          2.  Translational Reformulation (Equivalent formalism $\neq$ Progress).
          3.  Immunity Clause (Belt modification making falsification impossible).
          4.  Borrowed Progress (Success independent of Hard Core).
          5.  Prediction-Milling (Quantity vs. Risk/Content of predictions).
          6.  Stagnation vs. Consolidation (Maturing vs. Degenerating).
          7.  Hindsight/Grace Period (How long to wait for novelty).
      *   **Application:** Apply to three specific cases (Programme A, B, C) with full verdicts and findings.
      *   **Closing:** Limitations of the procedure (guessing, inappropriate cases, biases).

  2.  **Develop the Decision Procedure (The "Protocol"):**

      *   *Goal:* Translate Lakatosian concepts (Hard Core, Protective Belt, Positive/Negative Heuristic, Progressive/Degenerating) into operational checklist items.
      *   *Structure:* Needs to be linear, with stop conditions.
      *   *Tone:* Administrative, precise, evidentiary.
      *   *Step 1: Identity Check.* Has the core changed? If yes, treat as new (restart clock or restructure).
      *   *Step 2: The "Borrowed Progress" Filter.* Separate infrastructure/tools from theoretical claims.
      *   *Step 3: The "Immunity" Test.* Look for ad hoc adjustments to explain away failures.
      *   *Step 4: The "Novelty & Risk" Audit.* Count predictions, but weigh them by risk and timing (pre-registration vs. post-hoc).
      *   *Step 5: The "Stagnation vs. Consolidation" Differentiator.* Is the lack of new theory due to saturation (consolidation) or lack of power (stagnation)? Look at industry uptake or precise measurement vs. vague fitting.
      *   *Step 6: The Grace Period Rule.* How much degeneracy is allowed? Define the "anomaly budget."
      *   *Decision Matrix:* Map findings to the 4 verdicts.
      *   *Value/Risk Handoff:* Explicitly mark where the panel stops judging facts and starts judging policy (e.g., political importance vs. scientific merit).

  3.  **Drafting the Protocol Steps (Iterative Refinement):**

      *   *Refining "Identity":* Ask: "Did the central claim change?" Evidence: Self-report introduction vs. original grant.
      *   *Refining "Translational Reformulation":* Ask: "Do the new equations derive new numbers?" Evidence: Math appendices, external review comment on equivalence.
      *   *Refining "Immunity":* Ask: "Did they explain a failure by changing the measurement limit?" Evidence: Response to negative results in self-report.
      *   *Refining "Prediction-Milling":* Ask: "Was the prediction registered *before* data collection?" Evidence: Timestamps, pre-prints.
      *   *Refining "Grace Period":* Set a hard limit. E.g., 5 years without *novel* factual success triggers Probation unless specific conditions met.

  4.  **Applying to Programme A (Sleep/Memory):**

      *   *Core:* Reactivation during sleep is causally necessary.
      *   *Progress:* 1 confirmed prediction (rodents).
      *   *Degeneracy:* 8 failed replications (humans).
      *   *Defense:* "Salience threshold" (Immunity Clause alert).
      *   *Borrowed Progress:* Sleep-staging tool (useful, but doesn't prove core).
      *   *Analysis:* The immunity clause is the killer. They made the core unfalsifiable by claiming the measurement is impossible.
      *   *Verdict:* Probation (or Wind Down with closure). Given the 8 failures vs 1 success, and the ad hoc defense, it's degenerating. But the tool is useful. Let's go with *Probation with Restructuring*. They need to fix the human model or admit the core is limited to rodents.
      *   *Wait, looking closer:* The immunity clause is explicit ("salience cannot presently be measured"). This is a classic Lakatosian degeneration signal. The tool is borrowed progress.
      *   *Decision:* Place on Probation. The core is under threat, but the infrastructure is valuable. They need to resolve the human replication crisis without ad hoc clauses.

  5.  **Applying to Programme B (Materials/Order Parameter):**

      *   *Core:* Single order parameter.
      *   *Progress:* Extended to 3 new families. Industry adoption (Specs).
      *   *Anomaly:* 1 family deviates (excluded as "insufficiently characterised").
      *   *Status:* "Consolidation."
      *   *Analysis:* Industry adoption suggests *instrumental* progress, even if theoretical novelty is low. The anomaly handling is slightly ad hoc but common in engineering contexts ("consolidation").
      *   *Distinction:* Stagnation vs. Consolidation. Here, it's Consolidation because it's becoming a standard tool (specs written into it).
      *   *Verdict:* Renew as is. It's doing what a mature programme should do (standardization).

  6.  **Applying to Programme C (Urban Infrastructure/Scaling Law):**

      *   *Core:* Single scaling law.
      *   *Issues:* 3 equivalent reformulations (Translational Reformulation). Immunity clause ("only above network size no dataset reaches"). Data artefact in confirmation.
      *   *Spin-offs:* Successful but abandoned the core.
      *   *Politics:* Flagship, Director retiring, Board likes it.
      *   *Analysis:* This is a degenerating programme masquerading as a flagship. The spin-offs prove the *people* are good, but the *programme* (the core) is dead. The reformulations are empty. The immunity clause is blatant.
      *   *Verdict:* Wind Down with Closure Grant. This is the hard call. The prompt says "I would rather not be told to wind down... I would still rather be told that than not." I must be honest to the protocol.
      *   *Nuance:* Fund the *people* (spin-offs), not the *core*. Restructuring might work if they admit the core is wrong, but "Wind Down" is cleaner for the specific *programme* identity. Let's suggest "Wind Down Programme, Renew People via New Grants." Actually, the verdict options are fixed. "Wind down with a closure grant" fits best.

  7.  **Drafting the Limitations Section:**

      *   What can't it do? High-risk/high-reward (moonshots). Interdisciplinary work (hard to define a single core).
      *   Biases: Favors incremental prediction over deep conceptual shifts. Favors quantifiable outputs.
      *   Hindsight: Acknowledge that a "degenerating" programme might be right (e.g., Wegener/Continental Drift). The Grace Period rule handles this partially, but not fully.

  8.  **Review and Refine:**

      *   *Check against constraints:* Is it doable in an afternoon? Yes, it's a checklist. Is it Lakatosian without the jargon? Yes, terms like "Hard Core" are replaced with "Central Claim."
      *   *Check against specific distinctions:*
          *   Identity: Step 1.
          *   Translational Reformulation: Step 3.
