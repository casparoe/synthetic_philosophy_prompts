      *   *Check against the "Appeal-proof" requirement:* Every finding must cite a page in the dossier.
      *   *Tone:* Professional, bureaucratic but scientifically rigorous.

  9.  **Final Polish:** Ensure the distinction between "Panel Decision" (Fact) and "Board Decision" (Value/Risk) is clear in the procedure. Ensure the verdicts for A, B, and C are logically derived from the procedure steps. (Self-Correction on Programme A: 8 failures vs 1 success + Immunity Clause is severe. Probation is appropriate. Wind Down might be too harsh given the 1 success and the tool utility, but the Immunity Clause is dangerous. Let's stick with Probation/Restructuring to force them to address the human replication without the 'unmeasurable' excuse). (Self-Correction on Programme C: The prompt implies the Secretary *wants* the truth even if painful. I will recommend Wind Down, but note the Board can override on policy grounds).

