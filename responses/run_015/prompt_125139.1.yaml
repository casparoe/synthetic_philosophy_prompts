answer: |-
  # The Research Programme Assessment Protocol (RPAP)
  **Version 1.0 | For Internal Use by Standing Review Panels**

  ## Purpose
  To provide a standardized, evidence-based method for assessing the scientific vitality of long-running research programmes. This protocol converts philosophical criteria of scientific progress into checkable administrative findings. It is designed to be completed in one session (4 hours) using only the provided dossier.

  ## Instructions to Panelists
  *   **Do not** judge "promise," "prestige," or "potential."
  *   **Do** cite specific pages in the Self-Report (SR), Publication List (PL), or External Reviews (ER) for every finding.
  *   **Stop** at any "Termination Point." If a Termination Point is reached, the default verdict is *Wind Down* unless a specific override clause is triggered.
  *   **Defer** any question marked [VALUE JUDGMENT] to the Council Board. The Panel provides the scientific finding; the Board decides the risk tolerance.

  ---

  ## Step 1: The Identity Check (Hard Core Stability)
  **Question:** Has the Central Claim changed fundamentally since the last review or original grant?
  *   **Evidence Required:** Compare the "Aims" section of the current SR against the original Grant Agreement or previous Review Verdict.
  *   **Sufficient Answer:**
      *   *Yes, Changed:* The mechanism, entity, or law claimed to be universal is different.
      *   *No, Stable:* The claim is the same; only applications or precision have changed.
  *   **If Silent/Unclear:** Consult ER 1. If ER 1 disagrees with SR, mark as *Disputed*.
  *   **Finding Rule:** If *Yes, Changed*, the programme is scientifically a **New Programme**. It cannot be "Renewed as is." It must be judged as a new application (typically *Renew with Restructuring* to reset the clock).
  *   **Termination Point:** None. This determines the *category* of renewal, not the success.

  ## Step 2: The Borrowed Progress Filter
  **Question:** Which reported successes would remain valid even if the Central Claim were false?
  *   **Evidence Required:** SR "Key Outputs" list and ER comments on utility.
  *   **Sufficient Answer:** Identify outputs that are tools, datasets, software, or training outcomes.
  *   **Finding Rule:** Tag these as **Infrastructure**. They count toward *societal value* but **do not count** toward *scientific progress* of the Central Claim.
  *   **Termination Point:** If >50% of the "Key Scientific Findings" listed in SR are tagged as Infrastructure, proceed to Step 6 (Consolidation Check). If 100% are Infrastructure, recommend *Wind Down* (scientific mission complete or failed).

  ## Step 3: The Equivalence Test (Translational Reformulation)
  **Question:** Do new models or formalisms derive new, testable numbers, or do they merely restate old ones?
  *   **Evidence Required:** SR Section on "Theoretical Developments" and ER 2 (Methodology focus).
  *   **Sufficient Answer:**
      *   *Progressive:* The new formalism yields a numerical prediction the old one could not.
      *   *Equivalent:* The SR or ER explicitly states the new model is "mathematically equivalent," "isomorphic," or "a change of vocabulary" to the old one.
  *   **Finding Rule:** Count only *Progressive* reforms as scientific output. Count *Equivalent* reforms as **Administrative Activity** (neutral).
  *   **Termination Point:** If the period's primary theoretical output is *Equivalent* reformulation, mark as **Theoretical Stagnation**.

  ## Step 4: The Immunity Clause Audit
  **Question:** When a prediction failed, was the explanation testable, or did it place the error beyond measurement?
  *   **Evidence Required:** SR "Discussion of Anomalies" and PL (papers addressing negative results).
  *   **Sufficient Answer:**
      *   *Acceptable:* "The parameter X was out of range; we will measure X next cycle." (Testable)
      *   *Immunity:* "The effect exists but cannot be measured with current instruments," or "The sample was impure" (without independent verification of impurity).
  *   **Finding Rule:** One *Immunity* explanation is noted. Two or more *Immunity* explanations regarding the same Central Claim constitute a **Degeneration Signal**.
  *   **Termination Point:** If a **Degeneration Signal** is found *and* there are no confirmed novel predictions (see Step 5), proceed to *Wind Down*.

  ## Step 5: The Prediction Risk Audit
  **Question:** Were successful predictions risky (could easily have been false) and registered before data collection?
  *   **Evidence Required:** PL (dates of pre-prints/submission vs. data collection) and SR "Hypotheses Tested."
  *   **Sufficient Answer:**
      *   *High Risk:* Pre-registered, specific numerical value, binary outcome.
      *   *Low Risk (Milling):* Post-hoc fitting, qualitative trend ("increased" vs "decreased"), or slicing one dataset into multiple minor findings.
  *   **Finding Rule:** Count only *High Risk* confirmed predictions as **Novel Factual Success**.
  *   **Threshold:** A 5-year period requires at least **one** confirmed *High Risk* prediction to avoid *Probation*.
  *   **Termination Point:** Zero *High Risk* confirmed predictions triggers *Probation* automatically, unless Step 6 (Consolidation) overrides.

  ## Step 6: Stagnation vs. Consolidation
  **Question:** Is the lack of new theory due to exhaustion of ideas (Stagnation) or saturation of the market/utility (Consolidation)?
  *   **Evidence Required:** ER comments on field adoption and SR "Impact" section.
  *   **Sufficient Answer:**
      *   *Consolidation:* The model is written into industry standards, regulations, or is the default tool for other researchers. Anomalies are handled by excluding edge cases defined by *measurement limits*, not theoretical fixes.
      *   *Stagnation:* The model is cited but not used; anomalies are handled by theoretical patches.
  *   **Finding Rule:** If *Consolidation*, the requirement for *Novel Factual Success* (Step 5) is waived. The programme is judged on *Utility* and *Maintenance*.
  *   **Termination Point:** None. This modifies the verdict criteria.

  ## Step 7: The Grace Period & Risk Handoff
  **Question:** If the programme is degenerating (Failures > Successes + Immunity Clauses), is there a justified reason to wait?
  *   **Evidence Required:** SR "Future Outlook" and ER assessment of "Potential."
  *   **Finding Rule:**
      *   *Standard Rule:* A programme may run without *Novel Factual Success* for one review cycle (5 years). Two cycles without success mandates *Wind Down*.
      *   *Extension:* An extension (Probation) is permitted only if: (1) A specific experiment is underway that resolves the anomaly, and (2) The External Reviewers agree the experiment is decisive.
  *   **[VALUE JUDGMENT] Handoff:** If the Panel recommends *Wind Down* but the programme is a "Flagship" or has high political capital, the Panel must state: *"Scientific verdict: Wind Down. Policy override required for Renewal."* The Board must sign the override.

  ---

  # Application of Protocol to Current Cycle

  ## Programme A: Sleep and Memory Consolidation
  **Dossier Reference:** SR-A, PL-A, ER1-A, ER2-A.

  **Step 1: Identity Check**
  *   **Finding:** Central Claim (reactivation during sleep is causally necessary) is unchanged.
  *   **Evidence:** SR-A p.3 matches Original Grant p.1.
  *   **Status:** Continuation.

  **Step 2: Borrowed Progress**
  *   **Finding:** The automated sleep-staging tool is **Infrastructure**.
  *   **Evidence:** ER1-A p.5 ("Tool is field-standard, independent of memory theory").
  *   **Status:** Valuable, but does not support the Central Claim.

  **Step 3: Equivalence Test**
  *   **Finding:** No major reformulations reported.
  *   **Status:** N/A.

  **Step 4: Immunity Clause Audit**
  *   **Finding:** **Degeneration Signal Detected.**
  *   **Evidence:** SR-A p.12. Eight failed replications explained by "salience threshold... cannot presently be measured."
  *   **Analysis:** This places the falsifying condition beyond measurement capability. This is an Immunity Clause.
  *   **Count:** 8 instances of Immunity defense against negative results.

  **Step 5: Prediction Risk Audit**
  *   **Finding:** **One High Risk Success.**
  *   **Evidence:** PL-A Item 4 (Pre-registered rodent study, specific neuromodulator block).
  *   **Analysis:** Meets the minimum threshold to avoid automatic Probation, but is outweighed by Step 4 findings.

  **Step 6: Stagnation vs. Consolidation**
  *   **Finding:** **Stagnation.**
  *   **Evidence:** Tool is used (Infrastructure), but the theory is not adopted as standard due to replication crisis (ER2-A p.3).

  **Step 7: Grace Period**
  *   **Finding:** Programme has had 5 years. One success vs. eight failures protected by Immunity Clauses.
  *   **Analysis:** The Immunity Clauses prevent the anomalies from counting against the core, but they also prevent the core from counting as science (unfalsifiable).

  **Panel Verdict:** **Place on Probation with Short Re-Review (2 Years).**
  **Written Findings:**
  1.  The Central Claim remains scientifically viable only if the "salience threshold" is rendered measurable.
  2.  The current defense against negative human results constitutes an Immunity Clause (Protocol Step 4).
  3.  Renewal is contingent on a specific plan to measure salience or a restructuring of the Central Claim to exclude human cueing.
  4.  The sleep-staging tool is recognized as valuable Infrastructure but does not justify theoretical renewal on its own.
  5.  **Board Note:** If the Board wishes to Renew As Is despite these findings, a Policy Override is required citing the value of the Infrastructure over the scientific status of the Core.

  ---

  ## Programme B: Materials Failure Order Parameter
  **Dossier Reference:** SR-B, PL-B, ER1-B, ER2-B.

  **Step 1: Identity Check**
  *   **Finding:** Central Claim (single order parameter) is unchanged.
  *   **Status:** Continuation.

  **Step 2: Borrowed Progress**
  *   **Finding:** Minimal. Outputs are theoretical models applied to materials.
  *   **Status:** Scientific Progress counts fully.

  **Step 3: Equivalence Test**
  *   **Finding:** No reformulations.
  *   **Status:** N/A.

  **Step 4: Immunity Clause Audit**
  *   **Finding:** **Minor Anomaly.**
  *   **Evidence:** SR-B p.8. One material family excluded as "insufficiently characterised."
  *   **Analysis:** This is borderline. However, ER2-B notes this is standard engineering practice for outlier exclusion, not a theoretical patch.
  *   **Status:** No Degeneration Signal.

  **Step 5: Prediction Risk Audit**
  *   **Finding:** **Zero High Risk Novel Predictions.**
  *   **Evidence:** SR-B p.4 ("Period described as consolidation").
  *   **Status:** Triggers Probation *unless* Step 6 applies.

  **Step 6: Stagnation vs. Consolidation**
  *   **Finding:** **Consolidation.**
  *   **Evidence:** SR-B p.10 ("Written into specifications"); ER1-B p.2 ("Default design tool for industry consortium").
  *   **Analysis:** The model is no longer predicting novel facts; it is codifying known facts into standards. This fits the definition of Consolidation.
  *   **Override:** The requirement for *Novel Factual Success* (Step 5) is waived.

  **Step 7: Grace Period**
  *   **Finding:** Not applicable (Consolidation justifies lack of novelty).

  **Panel Verdict:** **Renew As Is.**
  **Written Findings:**
  1.  The programme has transitioned from Discovery to Consolidation (Protocol Step 6).
  2.  Lack of novel predictions is consistent with maturity and industry standardization.
  3.  The handling of the anomalous material family is within acceptable engineering tolerances (ER2-B).
  4.  The Central Claim remains stable and instrumentally effective.

  ---

  ## Programme C: Urban Infrastructure Scaling Law (Flagship)
  **Dossier Reference:** SR-C, PL-C, ER1-C, ER2-C.

  **Step 1: Identity Check**
  *   **Finding:** Central Claim (single scaling law) is unchanged formally, but effectively abandoned by spin-offs.
  *   **Evidence:** SR-C p.5 (Spin-offs "abandon the scaling law").
  *   **Status:** **Identity Crisis.** The most successful work from the programme rejects the Core.

  **Step 2: Borrowed Progress**
  *   **Finding:** Training ground for the field.
  *   **Evidence:** SR-C p.2.
  *   **Status:** **Infrastructure (Human Capital).** Does not validate the Core.

  **Step 3: Equivalence Test**
  *   **Finding:** **Theoretical Stagnation.**
  *   **Evidence:** SR-C p.6 ("Three reformulations... formally equivalent to predecessor").
  *   **Analysis:** Per Protocol Step 3, these count as Administrative Activity, not Scientific Progress.

  **Step 4: Immunity Clause Audit**
  *   **Finding:** **Degeneration Signal Detected.**
  *   **Evidence:** SR-C p.9 ("Law applies only above a network size no available dataset reaches").
  *   **Analysis:** This places the falsifying condition beyond current data availability indefinitely.
  *   **Count:** Systemic application to all failed tests.

  **Step 5: Prediction Risk Audit**
  *   **Finding:** **Zero Validated Successes.**
  *   **Evidence:** SR-C p.11 ("Celebrated confirmation... traced to an artefact").
  *   **Status:** Fails minimum threshold.

  **Step 6: Stagnation vs. Consolidation**
  *   **Finding:** **Stagnation.**
  *   **Evidence:** Not adopted in policy (ER1-C p.4 "Too abstract for municipal use").

  **Step 7: Grace Period & Risk Handoff**
  *   **Finding:** Programme is 15 years old (3 cycles). Two cycles without valid success.
  *   **Analysis:** Grace period expired.
  *   **[VALUE JUDGMENT] Handoff:** The Board is expected to favour renewal. The Panel must flag the conflict.

  **Panel Verdict:** **Wind Down with Closure Grant.**
  **Written Findings:**
  1.  The Central Claim is protected by an Immunity Clause regarding dataset size (Protocol Step 4).
  2.  Theoretical outputs are translationally equivalent reformulations, not progress (Protocol Step 3).
  3.  The one confirmed prediction was invalidated by data artefact (Protocol Step 5).
  4.  **Critical Finding:** The programme's most successful scientific outputs (spin-offs) explicitly abandon the Central Claim (Protocol Step 1).
  5.  **Board Note:** Scientific verdict is Wind Down. The programme is scientifically degenerating. Continued funding of the *Central Claim* is not supported by evidence. The Board may choose to fund the *personnel* via new mechanisms, but the *Programme C* identity should cease. A Policy Override is required to Renew.

  ---

  # Limitations and Biases of the RPAP

  **1. The "Moonshot" Blind Spot**
  This procedure is biased against high-risk, high-reward programmes that require long gestation periods without intermediate predictions (e.g., gravitational wave detection prior to LIGO). A programme that is genuinely revolutionary may look "degenerating" for 15 years before a single breakthrough. The Grace Period (Step 7) mitigates this for one cycle, but a 20-year "dark period" will trigger a Wind Down verdict even if the science is sound.
  *   *Mitigation:* The Board must use the [VALUE JUDGMENT] override for known "Moonshot" lines, accepting the scientific risk explicitly.

  **2. The Quantification Bias**
  The protocol privileges predictions that are numerical and pre-registered (Step 5). Programmes in qualitative sciences (e.g., anthropology, certain areas of ecology) or those developing new conceptual vocabularies may struggle to generate "High Risk" predictions in the required format. They may be penalized as "Stagnant" when they are actually "Conceptually Shifting."
  *   *Mitigation:* External Reviewers must be instructed to translate conceptual shifts into "testable implications" in their reports for the Panel to use.

  **3. The Infrastructure Trap**
  Large programmes often drift into becoming service providers (databases, tools). The protocol correctly identifies this as "Borrowed Progress" (Step 2). However, a National Council *may* want to fund services even if the science is static. The protocol forces a choice: admit it is a service, or pretend it is research.
  *   *Mitigation:* The "Renew with Restructuring" verdict should be used to convert degenerating research programmes into dedicated Infrastructure grants, rather than winding them down entirely.

  **4. The Hindsight Problem**
  As noted in the prompt, Lakatosian judgments are ultimately retrospective. A Panel deciding *now* is guessing the future trajectory. The RPAP minimizes this by demanding *current* falsifiability. However, it cannot distinguish between a "dead end" and a "difficult truth."
  *   *Mitigation:* The "Probation" verdict is the safety valve. It acknowledges the degeneracy but buys time for a potential revival without committing to a full 5-year renewal.

  **5. Political Inertia**
  The procedure assumes the Board will respect the [VALUE JUDGMENT] handoff. In reality, Flagship programmes (like Programme C) generate their own political momentum. The Panel may find itself issuing "Wind Down" verdicts that are routinely overridden.
  *   *Mitigation:* The Written Findings must be public (or accessible to auditors). If the Board consistently overrides scientific verdicts for political reasons, the audit trail will reveal a systemic divergence between Council Policy and Scientific Merit.
