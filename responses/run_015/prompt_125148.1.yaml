answer: |-
  1. "The eulogy"

  Good morning. For those who do not know me, I am Hugh's godson. Standing here, looking out at this room, I see the two halves of his life that rarely touched. On one side, the colleagues and students who shared his working days for thirty-eight years. On the other, Maureen's family, who shared his Sundays and his silence. You know different things about him. Some of you know the voice that commanded a classroom in French or guided a nervous teenager through a monologue. Others know the man who sat at this kitchen table, arguing over the news, or holding Maureen's hand when the pain became too much to hold alone.

  Hugh left a note with his will. It asked us not to turn him into a character. He disliked the idea that a life could be summarized by a list of adjectives. He worried that when we say someone was "kind" or "stubborn," we stop looking at what they actually did. We replace the person with a label. So, I will not tell you what Hugh was like. I will tell you what Hugh did.

  I remember a Tuesday in November 1994. He came home early. He had written a reference for a seventeen-year-old boy who had been caught with exam papers. The Headmaster wanted it withdrawn. Hugh refused. He did not make a speech. He did not call a meeting. He packed his bag, walked out of the school gate, and came home to make tea. He told me later that he didn't know if he was right. He only knew that on that Tuesday, withdrawing the reference was a thing he could not do. He lived with the cost of that choice for the rest of his life. He lost the pension. He lost the routine. He gained uncertainty. Some of you in this room think he was a hero for that. Some think he was foolish. Hugh would tell you that both views miss the point. It was not a destiny. It was a Tuesday.

  In the classroom, he did not teach French as a set of rules to be memorized. He taught it as a way to say something new. I watched him once with a student who could not pronounce the word "oiseau." Hugh did not correct her again. He spent twenty minutes drawing a bird on the board, making noises, acting out flight, until she laughed and said it correctly. He could have moved on. He chose to stay.

  At home, he read. He read Sartre, not as a decoration, but as a tool. He argued with the pages. He marked them up. He believed that we are not finished products. He believed that what you did yesterday does not force what you do today. This was hard for the people who loved him. It meant he could change his mind. It meant he was never fully known, even by Maureen, especially by Maureen. That was not a lack of love. It was a respect for the fact that she, too, was still becoming who she was.

  He had a private name for the thing he fought against. He called it the passport photograph. He meant the habit of taking a still image of a person at the end of their life and pretending that is who they were. He hated the idea that death settles the account. He hated the idea that suffering is over, because suffering was part of the work. He did not choose peace. He chose engagement. So I will not tell you he is at peace. That is a state he never claimed. But I will say this to Maureen and her family: the struggle is over for him. The weight is down. You are allowed to rest now.

  We are here to mourn, but also to witness. When you look at the coffin, do not see a finished story. See a series of moments where things could have gone differently. See the Tuesday he walked out. See the evening he stayed up to help a stranger. See the morning he chose to be gentle when he was tired.

  There is a comfort in this, though it is not the usual kind. The usual comfort says that he is safe now, and that you will join him later in a place where nothing changes. Hugh would say the comfort is different. The comfort is that you are not safe. You are not finished. When you leave this building, you are not the same person who walked in. You have choices to make. A phone call to return. A kindness to offer. A principle to hold, or to let go. Nothing about you is settled by what you have been so far.

  He spent thirty-eight years showing people that they could speak differently, act differently, be differently. He did not do this to be admired. He did it because he believed it was the only honest way to live. To pretend we are fixed is to lie. To pretend we are free is to take responsibility.

  I have tried to speak about his actions because his actions are what remain. They are in the students who speak French because he taught them. They are in the boy who kept his reference. They are in Maureen, who cared for him when he could no longer care for himself.

  He was many things. But if I must use one word to describe him, knowing he would argue with it, I would say he was free. Not free from consequence, but free to choose his consequences. And he leaves that freedom to you. Do not let this day fix you. Do not let grief turn you into a passport photograph of yourselves. Go out and do something on a Tuesday that you might not have done yesterday. That is how you honour him. That is how you keep him alive.

  2. "What the speech refuses to say"

  This speech deliberately omits the standard consolations of a funeral. I do not say Hugh is "at peace," "in a better place," or "watching over us." For Maureen's Catholic family, these phrases offer genuine comfort, implying a divine order and an end to struggle. To say them would be to lie about Hugh's worldview, which rejected the idea of a settled soul. To omit them is not to deny their faith, but to honour Hugh's specific request not to attribute a state of being to him that he never chose.

  I also refuse the narrative arc of the "principled stand." Regarding the 1994 resignation, I avoid saying he was a hero or that the school was wrong. A heroic narrative implies his character made the action inevitable—that he was always the sort of man who would walk out. Hugh insisted it was a contingent act, something he did on a Tuesday that could have been otherwise. Framing it as destiny simplifies the cost he bore and insults the complexity of the colleagues who remained. It suggests the conflict is resolved, when for many in the room, the tension remains valid.

  Finally, I avoid trait-talk until the very end. Standard eulogies rest on adjectives: "kind," "generous," "wise." These suggest a static identity. Hugh's philosophy, and his note, demanded we look at the verbs, not the nouns. To say "he was kind" explains nothing; to say "he stayed late to help" shows the cost. Omitting the traits prevents the mourners from filing him away. It forces them to confront the unsettlement of his life, which is the only consolation compatible with his beliefs: that they, too, are still unwritten.

  3. "Lines to cut"

  If the room feels too fractured between the believers and the skeptics, cut the paragraph beginning "He hated the idea that suffering is over..." Directly challenging the concept of peace may alienate Maureen's family in a moment of vulnerability. Substitute it with: "He did not seek rest. But for those who loved him, the need to fight for him is over. You are allowed to rest now." This validates their relief without making a metaphysical claim about Hugh's state.

  If the 1994 incident causes visible tension among former colleagues, soften the detail about the Headmaster. Cut "The Headmaster wanted it withdrawn." Substitute: "There was a demand to withdraw it." This removes the specific antagonist while keeping the focus on Hugh's refusal.

  If the ending feels too abstract, cut "Do not let grief turn you into a passport photograph of yourselves." Some may find the metaphor confusing in grief. Substitute: "Do not let grief stop you from choosing." This retains the imperative of freedom without the philosophical imagery.
