prompt: |-
  I'm helping a regulatory agency choose one decision rule for cost-benefit analysis under risk: a single formula that staff economists will apply to hundreds of unrelated projects a year (vaccine approvals, dam safety, wildfire mitigation, biosecurity containment), with the resulting number published and open to legal challenge. Before I look at any candidate rule, I want the specification. What must a risk-weighting rule deliver to count as adequate for that job, with the case or consideration behind each requirement, and which of those requirements are genuinely non-negotiable as opposed to the hobby-horses of one camp?

  My draft list, with the case I have in mind for each:

  1. Take a definite stand on the classic Allais and common-ratio patterns — accommodate them in the formalism, or give a principled account of why they are error. Silence is not acceptable.
  2. Stay calibrated across stake sizes: modest, well-documented aversion to a small-stakes coin flip must not compound into refusing plainly favorable large-stakes gambles.
  3. Give real weight to low-probability, irreversible, catastrophic losses, rather than letting them vanish because they are unlikely.
  4. Avoid fanaticism — a vanishingly small chance of an astronomically large payoff must not automatically dominate every ordinary project — and avoid achieving this by a hard probability cutoff, since any cutoff can be defeated by slicing one risk into many smaller ones.
  5. Behave consistently under changes of bracketing: a portfolio of independent projects should not get one verdict project-by-project and the opposite verdict as a single aggregate distribution, or if it does, the rule must say which bracketing is authoritative and why.
  6. Say whether it evaluates a single decision or the policy of following the rule repeatedly, and what it recommends when a plan that is optimal from the outset is one the agency will later want to abandon midway.
  7. Say whose risk attitude enters the formula when the people bearing a risk are not the people receiving the benefits, and when citizens disagree among themselves; it must not quietly substitute the agency's own attitude for the social one.
  8. Pin the risk attitude down by a fixed, publicly specified calibration procedure rather than fitting it to each decision, so that a verdict cannot be retrofitted to an intuition.

  Tell me which of these are real desiderata for this job and which I should drop. Flag any pair you suspect cannot be jointly satisfied — I think 3 and 4 are jointly unsatisfiable, and that 5 is unsatisfiable together with matching ordinary narrow-bracketed choices, but I want to know if either suspicion is wrong. Name the single requirement that does the most work in excluding otherwise attractive candidates, and add any requirement I have missed that would disqualify a rule outright. Then, in a few lines each and no more, score three contenders: expected utility with a concave utility index, a risk-weighted rule that re-weights probabilities rather than only outcomes, and a safety-first rule that maximizes the worst outcome.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A regulatory agency needs a *single* decision rule for cost-benefit analysis (CBA) under risk.
      *   **Scope:** Hundreds of unrelated projects/year (vaccines, dams, wildfires, biosecurity).
      *   **Constraints:** Published results, open to legal challenge, applied by staff economists.
      *   **Task:** Evaluate a draft list of 8 requirements (desiderata) for adequacy, identify non-negotiables vs. hobby-horses, flag impossibility theorems/trade-offs, identify the most exclusionary requirement, add missing critical requirements, and score three specific contenders (EU, Risk-Weighted, Safety-First).
      *   **Constraint:** "In a few lines each and no more" for the scoring section.

  2.  **Evaluate the Draft List (Requirements 1-8):**
      *   *Req 1 (Allais/Common-Ratio):* Is this non-negotiable? For a *regulatory* rule, descriptive accuracy of individual psychology is less important than normative coherence. However, legal challenges often hinge on "arbitrary and capricious" decisions. If the rule violates strong intuitions systematically, it invites challenge. But is it a *functional* requirement? Maybe not. It's more about theoretical purity. *Verdict:* Drop or downgrade. It's a hobby-horse of decision theorists, not necessarily regulators.
      *   *Req 2 (Calibration across stakes):* This is the Rabin Calibration Theorem issue. If you reject small gambles, you imply absurd rejection of large ones. For a regulatory body, this is crucial. You can't have a rule that blocks trivial risks but paralyzes major infrastructure. *Verdict:* Keep. Non-negotiable for functional usability.
      *   *Req 3 (Catastrophic/Low-Prob):* Essential for agencies dealing with dams, biosecurity, etc. Standard EU often discounts these too much. *Verdict:* Keep. Core mission requirement.
      *   *Req 4 (Anti-Fanaticism/No Cutoffs):* "Pascal's Mugging" avoidance. Essential to prevent resource allocation to negligible probabilities of infinite value. Hard cutoffs are gameable. *Verdict:* Keep. Core mission requirement.
      *   *Req 5 (Bracketing/Consistency):* This is the aggregation problem. If project-by-project says "yes" but portfolio says "no" (or vice versa), the agency is incoherent. Legally dangerous. *Verdict:* Keep. Non-negotiable for administrative consistency.
      *   *Req 6 (Dynamic Consistency/Policy vs. Act):* Regulatory rules need to be stable over time. If the rule recommends abandoning a plan midway, it creates sunk cost fallacies or time inconsistency issues. *Verdict:* Keep. Important for long-term projects (dams).
      *   *Req 7 (Distribution/Whose Attitude):* Crucial for public policy. Equity weights, Kaldor-Hicks vs. Pareto. If the agency imposes its own risk aversion on the public, that's undemocratic/illegal. *Verdict:* Keep. Non-negotiable for legitimacy.
      *   *Req 8 (Fixed Calibration):* Prevents "result-oriented" reasoning. Essential for legal defensibility. *Verdict:* Keep. Non-negotiable for rule of law.

  3.  **Identify Trade-offs and Impossibility Theorems:**
      *   *User's Suspicion 1 (3 & 4):* Heavy weighting of low-prob catastrophes (3) vs. avoiding fanaticism (4). This is the core tension in risk regulation. Can they be satisfied? Yes, but not by EU. Risk-weighted models (like Buchak's) or bounded utility can handle this, but there's a tension. It's not strictly *impossible*, but it requires careful functional form (e.g., inverse-S weighting).
      *   *User's Suspicion 2 (5 & Narrow Bracketing):* Bracketing consistency is hard. If you evaluate project-by-project (narrow), you miss correlation/diversification. If you evaluate aggregate (broad), you need a portfolio view which is hard for "hundreds of unrelated projects." *Verdict:* The user is right. You cannot have both project-level autonomy and perfect portfolio consistency without a central aggregator. The rule must specify the *unit of analysis*.
      *   *Other Trade-offs:* Dynamic consistency (6) often conflicts with Rank-Dependent/Risk-Weighted models (which can be dynamically inconsistent). EU is dynamically consistent but fails 3 & 4 often.

  4.  **Identify the "Most Exclusionary" Requirement:**
      *   Which rule kills the most candidates?
      *   Req 2 (Rabin Calibration) kills most behavioral/non-linear models if not carefully parameterized.
      *   Req 5 (Bracketing) kills project-level heuristics.
      *   Req 7 (Social Risk Attitude) kills simple agency-centric models.
      *   *Winner:* Req 5 (Bracketing/Aggregation). It forces a structural definition of the decision problem that most standard economic tools (designed for individual choice) don't address explicitly. Or Req 2 (Calibration), which mathematically constrains the curvature of the utility/weighting function severely. Let's go with Req 2 (Calibration) because it mathematically forbids a large class of intuitively appealing risk-averse functions (like high curvature CRRA applied to small stakes).

  5.  **Identify Missing Requirements:**
      *   *Transparency/Computability:* Staff economists need to calculate it. If it requires complex Monte Carlo simulations for every project, it fails.
      *   *Legal Standing/Statutory Alignment:* The rule must align with the specific statutes (e.g., OMB Circular A-4).
      *   *Missing:* **Separability/Independence of Irrelevant Alternatives.** If adding a dummy project changes the ranking of real projects, the rule is vulnerable to manipulation.
      *   *Missing:* **Information Sensitivity.** The rule shouldn't break if probability estimates are rough (robustness).
      *   *Selection:* **Robustness to Probability Estimation Error.** Regulatory probabilities are often expert guesses. A rule that swings wildly between $p=0.001$ and $p=0.002$ is unstable for legal challenge.

  6.  **Score the Contenders:**
      *   *Expected Utility (EU) with Concave Utility:*
          *   Pros: Consistent, dynamic, no fanaticism.
          *   Cons: Fails Catastrophe weighting (3), Fails Calibration (2) if curved enough for 3.
      *   *Risk-Weighted (e.g., Rank-Dependent):*
          *   Pros: Handles Catastrophe (3), avoids Fanaticism (4) with right weights.
          *   Cons: Dynamic inconsistency (6), Bracketing issues (5), Calibration (2) is tricky.
      *   *Safety-First (Maximin/Minimax Regret):*
          *   Pros: Great for Catastrophe (3).
          *   Cons: Ignores benefits/probabilities (Fanaticism 4 fail), terrible Calibration (2), ignores distribution (7).

  7.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, direct.
      *   *Structure:*
          1.  Assessment of the 8 requirements (Keep/Drop/Modify).
          2.  Trade-offs/Impossibility analysis.
          3.  The "Killer" Requirement.
          4.  Missing Requirement.
          5.  Scoring the three contenders (strict line limit).

      *   *Refining the Assessment:*
          *   Req 1 (Allais): Drop. Normative vs. Descriptive. Agency needs normative coherence, not psychological mimicry.
          *   Req 2 (Calibration): Keep. Rabin's theorem is a hard constraint.
          *   Req 3 (Catastrophe): Keep. Mission critical.
          *   Req 4 (Fanaticism): Keep. Resource constraint.
          *   Req 5 (Bracketing): Keep. But note the tension.
          *   Req 6 (Dynamic): Keep.
          *   Req 7 (Social Attitude): Keep. Legitimacy.
          *   Req 8 (Calibration Procedure): Keep. Rule of Law.

      *   *Refining Trade-offs:*
          *   3 & 4 are not logically impossible but require specific functional forms (e.g., bounded utility + probability weighting).
          *   5 is the hardest. You must choose the "Budget Constraint" as the bracket.
          *   6 conflicts with Risk-Weighted models (dynamic inconsistency).

      *   *Refining the "Killer":* Requirement 2 (Calibration). It eliminates high-curvature utility functions that are usually proposed to solve Requirement 3 (Catastrophes). This creates the central tension.

      *   *Refining Missing:* **Robustness to Probability Imprecision.** Regulatory probabilities are not casino odds.

      *   *Refining Scoring:* Strict "few lines each".

  8.  **Final Review against Constraints:**
      *   "Tell me which... are real desiderata... and which I should drop."
      *   "Flag any pair you suspect cannot be jointly satisfied."
      *   "Name the single requirement that does the most work..."
      *   "Add any requirement I have missed..."
      *   "Score three contenders... in a few lines each and no more."

      *(Self-Correction during drafting)*: I need to be careful about Req 1. While "Allais" is technical, the underlying issue is *coherence vs. intuition*. For a legal context, violating strong intuitions invites challenge. However, the prompt asks for "non-negotiable as opposed to hobby-horses." Allais violations are often considered rational errors in normative theory. I will recommend dropping it as a formal requirement, subsuming it under coherence.
      *(Self-Correction on Trade-offs)*: The user suspects 3 & 4 are unsatisfiable. I should clarify that they *are* satisfiable but constrain the function space tightly (e.g., you need probability weighting, not just utility curvature).
      *(Self-Correction on Scoring)*: Ensure I don't ramble.

      *Let's finalize the "Killer Requirement".* Is it Calibration (2) or Bracketing (5)? Calibration (2) mathematically restricts the *form* of the equation. Bracketing (5) restricts the *application*. Calibration is more fundamental to the "single formula" request. If the formula fails Rabin calibration, it's mathematically broken for the stated purpose. I'll stick with 2.

      *Missing Requirement:* I'll add **Computational Tractability/Transparency**. If staff economists can't compute it easily, it fails. Or **Robustness to Probability Error**. Given "legal challenge," Robustness is better. If the result flips on small probability changes, it's arbitrary.

      *Wait, one more check on Req 1:* The prompt asks to "Take a definite stand... Silence is not acceptable." Actually, for a regulatory rule, silence *is* the standard (EU takes a stand by ignoring them). The requirement demands the rule *address* them. I will advise dropping this. It's theoretical baggage. The rule just needs to be coherent.

      *Let's write.*
answer: |-
  ### Assessment of Requirements

  **Keep as Non-Negotiable:**
  *   **2 (Calibration):** Essential. Rabin's calibration theorem shows that rejecting modest risks implies absurd rejection of large gains. A rule that paralyzes large-stakes public investment due to small-stakes aversion is functionally broken.
  *   **3 (Catastrophes) & 4 (Fanaticism):** Both are mission-critical. You must weight tail risks without succumbing to Pascal's Mugging. These define the agency's protective mandate.
  *   **5 (Bracketing):** Legally vital. Incoherence between project-level and portfolio-level verdicts invites successful "arbitrary and capricious" challenges.
  *   **7 (Social Attitude):** Legitimacy. An agency imposing its own risk aversion overwrites legislative intent and citizen preferences.
  *   **8 (Fixed Calibration):** Rule of Law. Prevents outcome-driven manipulation of parameters.

  **Drop or Downgrade:**
  *   **1 (Allais/Common-Ratio):** Drop. This is a decision-theory hobby-horse. A normative regulatory rule need not mimic descriptive psychological biases; it must be coherent. Silence is acceptable if the rule is normatively justified.
  *   **6 (Dynamic Consistency):** Downgrade to "justification required." While desirable, some risk-weighted models sacrifice dynamic consistency to satisfy Catastrophe/Fanaticism constraints. The rule must simply state how mid-stream changes are handled, not necessarily guarantee optimality.

  ### Trade-offs and Impossibility

  *   **3 (Catastrophes) & 4 (Fanaticism):** Your suspicion is **wrong**. They are jointly satisfiable, but not by Expected Utility (EU). They require a functional form that weights probabilities non-linearly (e.g., inverse-S shape) while bounding utility. You cannot satisfy both with utility curvature alone.
  *   **5 (Bracketing) & Project Autonomy:** Your suspicion is **right**. You cannot have a rule that validates independent project decisions *and* guarantees portfolio consistency without a central budget constraint. The rule must designate the **annual budget** or **regulatory portfolio** as the authoritative bracket, rendering individual project verdicts provisional.
  *   **2 (Calibration) & 3 (Catastrophes):** This is the true tension. To weight catastrophes heavily (3), you typically need high curvature or aggressive probability weighting. High curvature violates calibration (2) (Rabin). You must solve 3 via probability weighting, not utility curvature, to preserve 2.

  ### The Single Most Exclusionary Requirement
  **Requirement 2 (Calibration across stake sizes).**
  This mathematically eliminates the most intuitive solution to Requirement 3 (Catastrophes). Most economists instinctively reach for a highly concave utility function to capture catastrophe aversion. Requirement 2 forbids this, forcing the designer to use probability weighting or alternative formalisms, thereby excluding standard EU implementations immediately.

  ### Missing Requirement
  **Robustness to Probability Imprecision.**
  Regulatory probabilities are expert estimates, not casino odds. A rule is inadequate if a verdict flips from "approve" to "reject" due to a change in estimated probability from 0.001 to 0.002. The rule must demonstrate stability within the confidence intervals of the input data to withstand legal challenge on evidentiary grounds.

  ### Scoring Contenders

  **Expected Utility (Concave Utility)**
  Fails Requirement 2 and 3. To weight catastrophes sufficiently (3), curvature must be high, which implies absurd small-stakes aversion (violating 2). It is dynamically consistent and bracketing-neutral but mathematically incapable of distinguishing between low-prob/high-loss and high-prob/low-loss beyond the mean.

  **Risk-Weighted (e.g., Rank-Dependent)**
  Satisfies 2, 3, and 4 with correct parameterization (inverse-S weighting). Fails 6 (Dynamic Consistency) and struggles with 5 (Bracketing) unless the "portfolio" is explicitly defined as the decision unit. Best theoretical fit, highest implementation complexity.

  **Safety-First (Maximin)**
  Satisfies 3 perfectly but fails 4 (Fanaticism) and 2 (Calibration) catastrophically. It ignores benefits and probabilities, treating a 1-in-a-billion risk the same as a 1-in-2 risk. Legally indefensible for cost-benefit analysis as it precludes trade-offs.
