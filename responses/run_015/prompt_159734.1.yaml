answer: |-
  You have described a cognitive maneuver with exceptional clarity. It is a recognized phenomenon, though it sits at the intersection of statistics, cognitive psychology, and philosophy, so it carries different names depending on which discipline is speaking.

  To answer your primary question: **Yes, this has been named, but no single label captures the entire shape you have outlined.**

  The statistical root is **The Reference Class Problem**. The cognitive manifestation is **The Inside View** (specifically, the *Illusion of Validity*). The structural mechanism you identified—where detail erodes comparability—is **Overfitting** (or the *Curse of Dimensionality*). The sincerity you feel is **System 2 Rationalization**.

  Here is the breakdown of the phenomenon, its edges, and how to distinguish it from honest restriction.

  ### 1. The Statistical Root: The Reference Class Problem
  In probability theory, the "Reference Class Problem" (formulated by Hans Reichenbach and later John Venn) asks: *To which class should a single case be assigned to determine its probability?*

  Every event belongs to infinite classes. You are a novelist (Class A), writing a historical document novel (Class B), with a detailed plan (Class C), in a specific market (Class D).
  *   Class A might have a 10% success rate.
  *   Class B might have a 5% success rate.
  *   Class C might have a 50% success rate.
  *   Class D might have a 2% success rate.

  There is no mathematical rule for which class is the "correct" one. Your maneuver is to iteratively narrow the class by adding variables (source, date, function, archive) until the class contains only *you*. Statistically, this is **The Problem of the Single Case**. Once the class size is one, the base rate is undefined, and you are free to assign any probability you wish, usually based on the coherence of the story rather than frequency.

  ### 2. The Cognitive Mechanism: Inside View Generation
  You asked if this is simply the "Inside View." Daniel Kahneman, who coined the term, would say this is the **mechanism by which the Inside View is fortified.**

  *   **The Inside View** is the focus on the specific circumstances of the case (your plan, your research).
  *   **The Outside View** is the focus on the statistics of the class (books like this).

  Usually, people fall into the Inside View because they ignore the Outside View. You are describing something more sophisticated: **using the specifics of the Inside View to dismantle the Outside View.** By specifying the differences ("those were debuts," "those had no archive"), you are not merely ignoring the base rate; you are arguing that the base rate is *inapplicable*.

  This is closely tied to the **Illusion of Validity**. Kahneman describes this as the confidence one feels when a story is coherent. The more detailed your plan (ninety scenes, sources, dates), the more coherent the narrative becomes. Coherence feels like truth. The cognitive system mistakes the *ease of imagining the steps* for the *probability of the outcome*.

  ### 3. The Structural Error: Narrative Overfitting
  Your insight about "the finer the description, the fewer the comparators survive" is the crux of the matter. In machine learning and statistics, this is called **Overfitting**.

  If you create a model with too many variables to predict an outcome, it will perfectly describe the past data but fail to predict new data. By adding variables (archive, market, author history), you are "fitting" the comparison class to your specific case.
  *   **Honest Modeling:** Selects variables that are *causally relevant* to the outcome.
  *   **Overfitting:** Selects variables that are *descriptively unique* to the case.

  This is also the **Curse of Dimensionality**. As you add dimensions (details) to your description, the volume of the space increases so much that available data (comparable books) become sparse. Eventually, you are alone in the space. You interpret this isolation as uniqueness; statistically, it is just sparsity.

  ### 4. The Sincerity: System 2 Rationalization
  You note that this does not feel like motivated reasoning because the arguments are sincere and defensible. This is a crucial distinction.

  Standard motivated reasoning is often "hot" (emotional, System 1). What you are describing is "cold" motivated reasoning, or **System 2 Rationalization**. You are using your analytical brain not to check the bias, but to build a fortress for it. Because every exclusion criterion is factually true (it *is* true that other books lacked your archive), the process feels scrupulous.

  The error is not in the *truth* of the premises, but in the **weight** assigned to them. You are treating descriptive differences as causal barriers without evidence that they actually alter the probability of success.

  ### 5. Distinguishing Honest Restriction from the Maneuver
  You asked: *How does one tell an honest restriction of the comparison class from this thing?*

  This is the hardest boundary, but there are three tests:

  **A. The Pre-Commitment Test (Temporal)**
  You hinted at this: *"differ only in whether the restriction was fixed before one knew where it would lead."*
  *   **Honest:** "I will only compare this to books with archives, because I hypothesize archives drive sales." (Defined before checking the data).
  *   **Maneuver:** "I will exclude books without archives." (Defined after seeing that excluding them helps the prediction).
  *   *Practical application:* Can you write down the inclusion/exclusion criteria for your comparison class *before* you look at the success rates of that class?

  **B. The Causal Relevance Test (Structural)**
  *   **Honest:** The excluded factor has a known mechanism for changing the outcome. (e.g., "I am excluding debuts because established marketing channels increase visibility by X%").
  *   **Maneuver:** The excluded factor is descriptive but causally opaque. (e.g., "I am excluding books without archives," without evidence that archives correlate with sales in your genre).
  *   *Practical application:* If you remove this detail from the plan, does the probability of success actually change, or does the *story* just feel less complete?

  **C. The Cross-Validation Test (Predictive)**
  *   **Honest:** The narrowed comparison class successfully predicts outcomes for *other* similar cases.
  *   **Maneuver:** The narrowed class only works for *this* case.
  *   *Practical application:* If you apply your exclusion criteria to a different author's project, does the resulting prediction hold up? If your criteria result in a class of size one every time, they are not predictive criteria; they are identifiers.

  ### 6. When Is This Move Not a Failure?
  You asked if there are cases where narrowing the class is what the evidence demands. **Yes.**

  This is the domain of **Expert Intuition** (studied by Gary Klein). In high-validity environments (firefighting, chess, medicine), experts *do* narrow the reference class based on specific cues. A doctor does not compare a patient to "all humans"; they compare them to "smokers over 50 with symptom X."

  This move is valid when:
  1.  **The environment is regular enough** to be learned (publishing is notoriously noisy/low-validity).
  2.  **The expert has had feedback** on similar specific cases (you have published nine books, so you have some domain expertise).
  3.  **The details are causal.** If you know from experience that "books with archives sell better in this specific niche," then excluding non-archive books is statistically sound.

  The failure occurs when the environment is noisy (publishing) and the details are narrative (scenes, sources) rather than causal (marketing budget, platform size).

  ### Summary Definition
  If you require a name for this specific shape, the most accurate composite term is **Narrative Overfitting of the Reference Class.**

  *   **Narrative:** It relies on the coherence of the story (scenes, sources).
  *   **Overfitting:** It adds variables until the model fits only the current case.
  *   **Reference Class:** It operates by manipulating the statistical group used for prediction.

  It is the **mechanism of the Inside View**, executed via **System 2 Rationalization**, resulting in the **Illusion of Validity**.

  ### How to Recognize It
  You are doing this when:
  1.  Your comparison class shrinks as your plan becomes more detailed.
  2.  Every reason for exclusion is factually true but causally unproven.
  3.  You feel confidence increasing as the number of comparable cases decreases. (This is the inverse of statistical robustness; usually, fewer comparators should mean *less* confidence).

  You are *not* doing this when:
  1.  You define the comparison criteria before checking the success rates.
  2.  You can point to a causal mechanism linking the specific detail to the outcome.
  3.  You acknowledge that as the class narrows, the uncertainty should increase, not decrease.

  Your friend who asked about the "base rate" was invoking the Outside View. Your response was not a defense of the book, but a dissolution of the class. That is the signature of the move.
