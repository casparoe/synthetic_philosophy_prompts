answer: |-
  # Spec Sheet: Theory of Lottocratic Legitimacy

  ## The Core Problem
  A theory of lottocratic legitimacy must solve the **Authorization Gap**. Elections derive legitimacy from *ex-ante consent* (voting for a candidate). Sortition derives legitimacy from *statistical mirroring* (being a microcosm). The theory must explain why the unchosen majority is obligated to obey the randomly chosen minority, without relying on the claim that the lottery produces "better outcomes" (which is empirical and contingent) or that it is "more democratic" (which begs the question).

  ## Desiderata List

  ### 1. The Principle of Statistical Agency (Non-Negotiable)
  *   **Requirement:** The theory must explain how a random sample acquires the agency to act *on behalf of* the whole, not just *as a part of* the whole. It cannot rely solely on the mathematical fact of representation; it must establish the normative transfer of authority from the population to the sample.
  *   **Case/Consideration:** **Athenian sortition vs. Modern polling.** Polls predict; legislatures decide. The theory must distinguish why a Citizen Assembly has binding power while a poll does not, despite identical selection methods.
  *   **Distinction:** **Random sampling as fact vs. Random selection as norm.** The theory cannot rest on the statistical accuracy of the sample alone; it must justify the *normative weight* of the selection method.

  ### 2. The Non-Selected Obligation (Non-Negotiable)
  *   **Requirement:** The theory must provide a specific reason why those *not* selected (the "losers" of the lottery) are morally bound to comply with the decisions. "Equality of opportunity" is insufficient because political obligation usually requires more than a chance to play.
  *   **Case/Consideration:** **Losers and Non-citizens.** If a constitutional convention is selected by lot, why must a dissenting citizen obey? If a body governs residents including non-citizens, does the lottery of citizens legitimize rule over non-citizens?
  *   **Distinction:** **Legitimacy of the office vs. Legitimacy of the person in it.** The obligation must attach to the decision of the body, not the virtue of the specific individuals drawn.

  ### 3. The Competence Threshold (Non-Negotiable)
  *   **Requirement:** The theory must define a minimum floor of capability required for the lottery to be legitimate. It cannot claim legitimacy holds even if the body is demonstrably incapable of understanding the brief.
  *   **Case/Consideration:** **Competence and AI Governance.** If an AI board is partially selected by lot, do laypeople have the capacity to audit algorithmic harm? If eligibility filters are too strict, does it collapse back into oligarchy?
  *   **Distinction:** **Descriptive representation vs. Deliberative competence.** The theory cannot assume that looking like the population (descriptive) guarantees the ability to govern (competence).

  ### 4. The Anti-Capture Mechanism (Non-Negotiable)
  *   **Requirement:** The theory must account for how the body remains independent of organized interests, bureaucrats, and facilitators. Legitimacy evaporates if the random body becomes a puppet for elites.
  *   **Case/Consideration:** **Capture and Nonresponse.** Who controls the agenda? What happens if the wealthy opt-out of the lottery pool (nonresponse), skewing the sample? The theory must address structural vulnerability to manipulation.
  *   **Distinction:** **Lot as selection method vs. Lot as decision procedure.** The theory must ensure the lottery isn't just used to pick people who then vote via majority rule (which can be captured), but that the randomness protects the *process*.

  ### 5. The Accountability Loop (Non-Negotiable)
  *   **Requirement:** Since members cannot be voted out, the theory must specify how they are held accountable for abuse, negligence, or deviation from their mandate.
  *   **Case/Consideration:** **Accountability and Juries.** Juries are unaccountable for verdicts (double jeopardy). Legislatures cannot be. The theory must explain why a legislative lottery gets more or less leash than a judicial one.
  *   **Distinction:** **Descriptive representation vs. Accountability.** You cannot trade one for the other; the theory must show how they coexist.

  ### 6. The Deliberative Transformation Condition (Preference)
  *   **Requirement:** The theory should ideally explain how raw opinion becomes considered judgment. It need not demand ideal speech situations, but must account for how preferences change.
  *   **Case/Consideration:** **Empirical findings on deliberation.** Data shows deliberation reduces polarization but can also entrench privilege if not managed. The theory should not assume deliberation is always virtuous.
  *   **Distinction:** **Selection vs. Decision.** The legitimacy of the *selection* should not depend entirely on the quality of the *deliberation*, though they are linked.

  ### 7. The Scalability Constraint (Preference)
  *   **Requirement:** The theory should address whether legitimacy degrades as the body grows or as the jurisdiction expands.
  *   **Case/Consideration:** **Scaling up.** A jury of 12 works for a trial. A legislature of 500 for a nation. Does the logic hold for a global assembly?
  *   **Distinction:** **Legitimacy of the person vs. Office.** At scale, individual members matter less; does the "office" retain legitimacy if the "persons" are interchangeable cogs?

  ### 8. The Hybrid Compatibility Clause (Preference)
  *   **Requirement:** The theory should be able to explain lottocratic legitimacy in isolation *and* in tandem with elections.
  *   **Case/Consideration:** **Hybrid lottery/election bodies.** Does the lottery body check the elected body, or co-legislate? The theory must define the boundary of authority.
  *   **Distinction:** **Random selection as norm vs. Fact.** In a hybrid, is the lottery a normative ideal or a functional fix for election failures?

  ---

  ## Jointly Unsatisfiable Requirements (The Trilemma)

  A theory of lottocratic legitimacy likely cannot maximize the following three simultaneously:

  1.  **Pure Equality of Selection:** No filters on eligibility (everyone can be picked).
  2.  **High Competence Threshold:** The body must possess significant technical/policy literacy.
  3.  **Strong Accountability:** The body must be strictly answerable to the public will.

  **Why:**
  *   If you enforce **(1) Pure Equality**, you risk violating **(2) Competence** (random people may lack literacy).
  *   If you enforce **(2) Competence** via testing/filtering, you violate **(1) Pure Equality** (creating an elite pool).
  *   If you enforce **(3) Strong Accountability** (e.g., recall elections or strict polling mandates), you negate the benefit of the lottery (independence from public pressure), effectively turning them into elected delegates, which collapses the distinction between **Selection** and **Decision**.

  *Most theories must sacrifice one. Athenian sortition sacrificed Competence (relying on collective wisdom). Modern Citizen Assemblies sacrifice Pure Equality (using stratification/screens). Hybrid models sacrifice Accountability (making them advisory).*

  ---

  ## Scorecard

  | Model | Stat. Agency | Non-Selected Obligation | Competence Threshold | Anti-Capture | Accountability Loop | Notes |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Athenian Pure Sortition** | ✅ | ✅ | ⚠️ | ⚠️ | ❌ | High on equality/agency; fails modern competence/accountability specs. No non-citizen coverage. |
  | **Advisory Citizen Assemblies** | ⚠️ | ❌ | ✅ | ✅ | ❌ | Fails "Non-Selected Obligation" (no binding power). High competence/capture protection. |
  | **Hybrid Elected/Lottery Leg.** | ✅ | ✅ | ✅ | ⚠️ | ⚠️ | Best fit. Solves obligation via shared power. Capture risk remains in interface between chambers. |
  | **Expert + Random Panels** | ⚠️ | ⚠️ | ✅ | ✅ | ⚠️ | Weak on "Statistical Agency" (experts dilute the 'people's voice'). Good for AI/Technical governance. |

  **Legend:** ✅ (Meets Spec), ⚠️ (Partial/Contested), ❌ (Fails Spec)
