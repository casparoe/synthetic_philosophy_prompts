answer: |-
  ### The Question

  We usually count heads when we do moral math: one cow counts as one unit. But suppose what matters isn't heads, but "felt time"—the total amount of time spent experiencing anything at all. A cow lives years; a bug lives weeks. But bugs die and get replaced constantly.

  Write for 45 minutes on this: If we switch to counting "felt time" instead of heads, does the moral weight of insects go up or down? If you accept this math for bugs, can you stop it from sliding down to mites, nematodes, or single cells? Is it even possible to multiply a "maybe they feel pain" by a "huge number" without making things up? Does this logic tell us to make bugs happier, or to ensure fewer of them are born? And for social insects, is the unit of time the individual or the colony? Don't just say "it's hard." Pick a lane and defend where the logic breaks or holds.

  ***

  ### Model Answer

  If we switch from counting heads to counting "felt time," the insect case gets weirder, not simpler. At first glance, short lives look like less moral weight. A week of suffering matters less than a decade. But because insects replace themselves so fast, the total "felt time" per year might actually dwarf mammals. A cow gives you twenty years of experience once; an aphid gives you a week of experience, but there are fifty generations of them in that same twenty years. So switching to time doesn't necessarily save us from the conclusion that insects dominate the moral landscape. It might even make it worse, because high turnover means more births and deaths to account for. The math of replacement cancels out the math of longevity.

  But this calculation relies on a shaky multiplication. We are taking a huge number (population) and multiplying it by a tiny probability (chance of consciousness). The problem is we don't know the probability. It's not a coin flip; it's total ignorance. When you multiply "unknown" by "infinity," you don't get a useful number. You get a mess. If we can't put a number on the chance a bug feels pain, we can't sum up the time either. We're just stacking guesses on top of guesses. To treat "maybe" as a percentage is to pretend we know something we don't.

  Then there's the slide downward. If bugs count because there are many of them and they might feel, what about mites? They are smaller, live shorter, but there are even more of them. What about nematodes in the soil? If "felt time" is the only metric, we should care most about the smallest, shortest-lived thing that might have a flicker of experience. To stop this, we need a cutoff. But any cutoff looks arbitrary. Why a brain? Why a nervous system? If we pick a line, we have to admit we're guessing, not calculating. We are letting the size of the number dictate the moral truth, which seems backward.

  This leads to the hardest question: what do we do? If there is massive "felt time" full of suffering in the wild, the logic doesn't tell us to help them. It might tell us to prevent them existing. If a life is mostly pain, adding more "felt time" is bad, even if the life is worth living overall. But preventing existence means intervening in nature on a scale we can't manage. It implies we should care more about stopping bugs being born than helping cows live better. That feels wrong to most people, which suggests the "felt time" math is missing something human beings care about, like relationships or complexity.

  Finally, the colony issue. For ants, the individual worker is like a cell in a body. The "felt time" might belong to the hill, not the bug. If the colony is the unit, the numbers drop drastically. This feels like a convenient escape hatch, but it might be true. If the individual ant doesn't care about its own survival, maybe it doesn't feel pain in a way that counts.

  In the end, counting "felt time" breaks the same way counting heads does. It forces us to make arbitrary cutoffs, multiply uncertainties, and accept conclusions about preventing existence that we aren't willing to act on. It shows the numbers are too big for our moral intuitions to handle.

  ***

  ### Marking Scheme (Out of 20)

  **1. Engages with turnover rates vs. lifespan (4 marks)**
  *   *Note:* Loses marks if they treat short lives as automatically less weight without considering how many replacements occur per year.

  **2. Addresses the "mites and nematodes" regression (4 marks)**
  *   *Note:* Loses marks if they just assert "mites don't count" without explaining why the logic doesn't apply to them too.

  **3. Critiques the multiplication of uncertainty (4 marks)**
  *   *Note:* Loses marks if they treat the probability of consciousness as a known number (like 1% or 5%) rather than unknown.

  **4. Distinguishes between welfare vs. existence (4 marks)**
  *   *Note:* Loses marks if they assume the only option is helping bugs, ignoring the argument that preventing birth might be the logical conclusion.

  **5. Considers the colony as a unit (4 marks)**
  *   *Note:* Loses marks if they ignore the ant/bee exception entirely or dismiss it without argument.
