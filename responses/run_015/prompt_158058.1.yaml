answer: |-
  The kiosk hummed, a low-frequency vibration that Lena felt in her molars. It was 14:03, the dead zone of the afternoon shift, when the Ministry of Moral Accounting's public terminals usually sat idle. The air in the lobby smelled of ozone and recycled static.

  On the screen, Citizen 8940-B's profile hovered in pale blue wireframe. A deficit alert pulsed near the chest cavity of the avatar: *Medical Care Quota: -45 Hours.*

  Lena's finger hovered over the glass. She knew the protocol. Normally, a deficit like this triggered a garnishment of future leisure credits or a mandatory service assignment. The citizen would be flagged. Their social efficiency score would dip. They would spend the next year paying back the debt, every hour of care they failed to give logged against them until the ledger balanced.

  But Lena knew the clause in Subsection 12, Paragraph C. *Voluntary Assumption of Unrequested Liability.*

  If she tapped *Accept Transfer*, the system wouldn't see it as charity. Charity was "Grace," and Grace was unquantifiable, a soft metric that looked nice on annual reviews but didn't move needles. The system couldn't process pure altruism; it only understood balance. So, if Lena took the debt onto her own ledger without the other party initiating the request, the algorithm categorized it as a *Correctional Offset*. Her surplus care hours would cancel out his deficit. Both records would snap back to zero. Clean. Green.

  It was the loophole she'd been riding for three weeks.

  " You're laundering sin, Lena."

  Mara's voice wasn't in the room, but it was there, etched into the back of Lena's skull from their argument last Sunday. Over synth-coffee, her sister had slammed her mug down hard enough to crack the glaze.

  "It's not sin," Lena had said, stirring her cup. "It's fixing a broken variable."

  "It's destroying the only thing that's real," Mara snapped. "Supererogation. Doing more than you have to. That's the only place where we're actually human. But you? You're turning 'above and beyond' into a tax deduction. Once the system can price grace, grace stops being grace. It's just duty wearing a mask."

  Lena blinked, the memory fading as the kiosk screen dimmed slightly. She looked at the deficit again. -45 Hours. Probably a sick parent. Or a child. Someone who couldn't find the time between their own mandatory labor shifts to log the care hours the state demanded of everyone.

  If she didn't act, the man would be penalized. His life would tighten.
  If she did act, the system would log it as a transaction. A trade.

  She looked at her own ledger status in the corner of her visor. *Surplus: 120 Hours.* She worked late. She volunteered for the hazardous waste cleanup nobody wanted. She hoarded virtue like coins.

  The printer inside the kiosk whirred to life, anticipating the receipt. *Zzzzt-click.* The sound was sharp, like a bone snapping.

  Lena hesitated. This was the gap Mara talked about. The weird philosophical hollow where the act sat. If she did this because she knew it wiped the record clean, was she being good? Or was she just optimizing data? By making the extra ordinary, was she erasing the possibility of the extraordinary?

  If no one knew she did it, not even the recipient, was it virtuous? Or was it just invisible maintenance?

  Her finger trembled. The cursor hovered over *Confirm Transfer*.

  She thought about the stamp the machine would print. The "Grace-Stamp" was supposed to be gold, but lately, the ink cartridges were running low, and they came out a pale, sickly yellow, like old teeth. It was supposed to signify moral surplus, but it just looked like bureaucracy trying to mimic holiness.

  *Just fix the variable,* she told herself.

  *You're killing the point,* Mara's voice countered.

  The screen flickered. A tiny glitch in the rendering software caused the word *Transaction* to stutter, missing a letter for a fraction of a second. *Transaciton.* Even the perfect system slipped.

  Lena exhaled, a sharp sound in the quiet lobby. She couldn't leave the debt. She couldn't let the garnishment happen. But she hated that the only way to help was to speak the system's language. She had to become a ledger entry to save a person.

  She tapped the screen.

  *Processing…*

  The hum of the kiosk pitched up. The wireframe avatar of Citizen 8940-B flashed green. Her own surplus counter dropped from 120 to 75.

  *Zzzzt-click.*

  The receipt slid out of the slot. Lena pulled it free. The paper was warm. She looked at the bottom line.

  *Status: Balanced.*
  *Classification: Debt-Transfer (Voluntary).*
  *Note: Grcae Record Updated.*

  She stared at the typo. *Grcae.* The Ministry never made typos. Unless the system was straining under the weight of all this forced kindness. Unless the logic was breaking down under the paradox of mandated mercy.

  Lena crumpled the receipt in her fist. It felt heavy, denser than paper should be. She had saved a stranger from penalty. She had balanced the books. She had done something good.

  But as she walked out into the grey afternoon light, the crumpled ball in her pocket felt less like a good deed and more like a receipt for something she couldn't name, purchased at a price that left her feeling entirely overdrawn.
