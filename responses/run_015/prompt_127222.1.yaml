answer: |-
  This premise is not confused. It is a coherent application of speech-act theory to urban political economy. The task is possible. Here is the argument built from the ground up, followed by the flag on where the logic is most vulnerable.

  ### The Argument

  **1. The Speech-Act Structure of Zoning**
  In basic speech-act theory, there is a distinction between constative utterances and performative utterances. A constative utterance describes a state of affairs that exists independently of the speech (e.g., "It is raining"). It can be true or false. A performative utterance brings a state of affairs into existence through the act of speaking itself (e.g., "I pronounce you married"). It cannot be true or false; it can only be "happy" or "unhappy" (successful or unsuccessful) based on authority and context.

  Zoning decisions are routinely disguised as constative acts. When a planning board denies a development proposal to preserve "neighborhood character," they speak as if "character" is a pre-existing object they are measuring and protecting. They imply: "This neighborhood *is* quiet, and this building *would be* loud."

  However, "neighborhood character" is not a natural fact like rainfall. It is a regulatory effect. The quietness exists only because previous zoning acts prohibited denser, louder uses. Therefore, the zoning decision is not constative; it is performative. It is an illocutionary act that constitutes the reality it claims to describe. When the city zones an area for single-family homes, it is not finding a single-family neighborhood; it is making one.

  **2. The NIMBY Performative Contradiction**
  NIMBY opposition relies on a specific rhetorical sleight of hand. They treat the outcome of past performative acts (the current low-density state) as if it were a constative fact (the inherent nature of the land).

  This creates a performative contradiction. To argue against new housing based on "character" is to say: "The reality created by your previous speech acts must now constrain your future speech acts, because we pretend the reality was always there." They are defending a constructed artifact as if it were a natural law. They claim to be protecting an independent descriptive fact, but that fact is entirely dependent on the continued enforcement of the very rules they are advocating. They are hiding the authorship of the space. They want the power of the performative (to exclude) without admitting they are performing (creating exclusion).

  **3. Reframing the Right to the City**
  Traditionally, the "right to the city" is framed positively: a right to access, to inhabit, to participate in the production of space. This framing often gets bogged down in debates over who deserves access to what finite resource.

  Based on the speech-act analysis above, we should reframe the right to the city as a negative right. It is not primarily a right to *be* in the city, but a right *not to be subjected* to unauthorized constitutive utterances.

  If zoning is a speech act that defines reality for everyone within its jurisdiction, then those subjected to it are being bound by a definition they did not author. When a NIMBY group successfully lobbies for a zoning restriction that preserves "character," they are effectively issuing a command: "You shall not exist here." Because this command is disguised as a description ("this is not for you"), it denies the recipient the ability to contest the premise.

  Therefore, the ethical violation is not just exclusion from space, but subjection to a false reality. The right to the city becomes the right to challenge the felicity conditions of the zoning utterance. It is the right to say: "You do not have the authority to define my existence through this retroactive performance." It shifts the battle from "Who gets to live here?" to "Who has the right to speak the city into existence?"

  **4. Urban Ethics of Authorship**
  Under this framing, urban ethics is about transparency of authorship. A just city is one where the performative nature of zoning is admitted. If the city says, "We are choosing to make this area expensive to protect current asset values," that is an honest constative statement about a performative intent. It can be debated ethically.

  The current system is unethical because it naturalizes choice. It turns political decisions (performances) into physical constraints (facts). The right to the city, then, is the right to demand that constitutive rules be recognized as choices, not discoveries. It is a negative right against being governed by lies about the nature of space.

  ### Where I Am Least Sure

  The weakest link in this argument is the move to define the **Right to the City as a negative right**.

  Here is why: In political philosophy, negative rights are usually protections against interference (e.g., freedom of speech, freedom from assault). Positive rights are entitlements to goods or access (e.g., right to housing, right to vote).

  By framing the Right to the City as a *negative right against constitutive utterances*, you risk narrowing the scope of housing justice. If the victory is merely exposing the "lie" of neighborhood character, does that materially house anyone? A NIMBY could admit, "Yes, we are performing this character, and we choose to exclude you," and under a strict negative rights framework, they might claim they are simply exercising their own free speech/association rights to define their community.

  The uncertainty lies in whether exposing the performative contradiction is sufficient to generate an ethical obligation to build housing. It proves the NIMBYs are being dishonest about *how* they exclude, but it doesn't automatically prove they *cannot* exclude. You need an additional ethical premise—that people have a material claim to space that overrides the performative claims of property owners—to make this framing actionable. Without that, you have successfully diagnosed the rhetoric of NIMBYism but haven't necessarily secured the right to housing.
