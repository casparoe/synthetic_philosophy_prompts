  # Marking Sheet: Philosophy of Language (Pragmatics)

  **Candidate Mark:** 38 / 100
  **Grade Band:** Fail / Borderline (depending on departmental threshold)

  ### Rubric & Mark Breakdown

  | Section | Criteria | Max Marks | Awarded | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Part A** | **Statement of "What is Said"** | 5 | 4 | Accurate truth-conditions, though ignores the status of 'but'. |
  | | **Item 1 (Reference)** | 10 | 1 | Fundamental category error. Reference fixing is not implicature. |
  | | **Item 2 ('But')** | 10 | 3 | Misclassification (Grice treats as Conventional). Diagnostics partially applied. |
  | | **Item 3 (Scalar)** | 10 | 10 | Correct classification and diagnostic application. |
  | | **Item 4 (Assessment)** | 10 | 10 | Correct classification and diagnostic application. |
  | | **Diagnostics Requirement** | 10 | 10 | Satisfied via Items 3 & 4. |
  | | **Clarity/Precision** | 5 | 5 | Well-written, clear structure. |
  | **Part A Total** | | **60** | **43** | |
  | **Part B** | **Q1 (CI Status)** | 15 | 5 | Recognizes hearer inference, fails Gricean generation conditions. |
  | | **Q2 (Utterer's Meaning)** | 15 | 0 | Contradicts Grice's definition of meaning-nn (intentions). |
  | | **Feature Identification** | 10 | 0 | Cites Occam's Razor; should cite Definition of Meaning/Intention. |
  | **Part B Total** | | **40** | **5** | Theoretical framework collapsed. |
  | **TOTAL** | | **100** | **38** | |

  ---

  ### Comments to Candidate

  **Part A: What is Said**
  *   **Verdict:** Correct but incomplete.
  *   **Confidence:** Confident.
  *   **Comment:** You correctly identify the truth-conditional core. However, you treat the contribution of "but" as purely pragmatic in your intro, which anticipates your error in Item 2. In Grice's framework, the contrastive element of "but" is often treated as part of the conventional meaning, not just pragmatic overlay.

  **Item 1: Reference Resolution ("She" = Nour)**
  *   **Verdict:** Wrong.
  *   **Confidence:** Confident.
  *   **Comment:** You have classified reference fixing as a *particularized conversational implicature*. In Grice's framework (see *Logic and Conversation*, p. 24), determining the reference of indexicals is a prerequisite for establishing *what is said*, not an implicature derived from it. Implicature operates on the proposition *after* reference is fixed.
  *   **Fix:** To repair this, you must move reference fixing into the "What is Said" section. It is not an inference derived from the Cooperative Principle; it is a rule of the language required to determine the proposition expressed.

  **Item 2: The Contrast ("But")**
  *   **Verdict:** Wrong (Textual Error).
  *   **Confidence:** Reasonably Confident.
  *   **Comment:** You classify this as a *generalized conversational implicature*. Grice explicitly discusses "but" in *Logic and Conversation* (pp. 44–45) as a paradigm case of **Conventional Implicature**, distinct from conversational implicature. While your application of detachability is logically sound for distinguishing CI from GCI, your classification contradicts the specific text set for this course.
  *   **Fix:** Classify as Conventional Implicature. Note that it is non-truth-conditional but attached to the specific word "but" (hence detachable), not generated by the CP.

  **Item 3: The Numeral ("Three")**
  *   **Verdict:** Correct.
  *   **Confidence:** Confident.
  *   **Comment:** This is the standard Gricean example. You correctly identify it as a Generalized Conversational Implicature (GCI) arising from the Maxim of Quantity, and you correctly apply the cancellability diagnostic. Well done.

  **Item 4: The Assessment (Teaching File)**
  *   **Verdict:** Correct.
  *   **Confidence:** Confident.
  *   **Comment:** You correctly identify this as a Particularized Conversational Implicature (PCI) arising from the specific context (the hiring committee scenario). Your appeal to indeterminacy is appropriate here, as Grice notes that implicatures need not be precise.

  **Part B: Speaker Ignorance & Scalar Implicature**
  *   **Q1: Does the inference remain a CI in Grice's sense?**
      *   **Verdict:** Wrong.
      *   **Confidence:** Confident.
      *   **Comment:** You argue that hearer derivation is sufficient. However, for Grice, conversational implicature is generated by the *presumption* that the speaker is observing the Cooperative Principle. If the speaker is unaware of the norm (as stipulated), they are not intentionally observing the maxim. While the hearer *infers* it, strictly speaking, the conditions for a Gricean implicature (which relies on mutual recognition of cooperative intent) are not met.
      *   **Fix:** Distinguish between what the hearer *infers* and what the speaker *implicates*. In Grice's strict sense, if the speaker lacks the relevant intention/knowledge, the implicature is not successfully generated, even if the hearer is misled.

  *   **Q2: Is it part of what Bea meant?**
      *   **Verdict:** Wrong.
      *   **Confidence:** Confident.
      *   **Comment:** This is the critical error. Grice's analysis of *utterer's meaning* (meaning-nn) is fundamentally intention-based (see *Meaning*, 1957). To mean something is to intend to produce an effect in an audience by means of the recognition of that intention. Since Bea lacks the intention to imply "no more than three" (she expects them to check the file), she does **not** mean it, regardless of what the hearer calculates.
      *   **Fix:** Answer "No". Ground this in the definition of Utterer's Meaning: No intention = No meaning.

  *   **Feature of Apparatus:**
      *   **Verdict:** Wrong.
      *   **Confidence:** Confident.
      *   **Comment:** You cite Modified Occam's Razor. This is irrelevant to the question of speaker intention. The answer turns on **Grice's Definition of Utterer's Meaning** (reflexive intentions) or the **Intentional nature of the Cooperative Principle**.
      *   **Fix:** Identify "Utterer's Meaning" or "Reflexive Intentions" as the governing concept.

  ---

  ### Second Reader Confidence Statement

  **Overall Confidence:** High.
  The candidate demonstrates a good grasp of the standard examples (Items 3 & 4) but fails on the theoretical definitions that underpin them (Reference, Meaning, Intention).

  **Least Sure Call:** **Item 2 ('But' as Conventional vs. Conversational).**
  *   **Confidence Level:** Reasonably Confident.
  *   **Reason for Uncertainty:** While Grice (1975) explicitly lists 'but' under Conventional Implicature, some contemporary neo-Griceans argue that the contrast can be cancelled or is context-dependent, pushing it toward GCI. However, since the exam specifies "Grice's original framework," the textual reading of *Logic and Conversation* should prevail.
  *   **What would settle it:** A direct re-reading of *Logic and Conversation*, Section 4 (pp. 44–45), where Grice contrasts 'but' with 'and' specifically to illustrate Conventional Implicature. If the course lectures emphasized a revisionist view, this mark might be contested, but based on the prompt's constraints ("Grice's original framework"), the candidate is incorrect.

  **Note on Part B:** I am **Confident** that the candidate's answer to Part B contradicts the core tenet of the course (Grice's intention-based semantics). Even if a hearer derives the inference, Grice's definition of *what is meant* requires speaker intention. This is not a contested point within standard Grice scholarship, but a definitional requirement. The candidate appears to be answering from a Relevance-Theoretic or post-Gricean perspective (hearer-centric), which the prompt explicitly excluded ("neo-Gricean and relevance-theoretic revisions... were not examinable").
