answer: |-
  **MEMORANDUM**

  **TO:** Emerging Technologies Panel, National Research Council
  **FROM:** [Your Name], Public Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Protocol ET-2023-04 (Thalamocortical Emulation)

  **Recommendation**
  I recommend **Conditional Approval** with a staged funding release.

  **Stage 1 (Months 1–6):** Funding released only for the "Live" condition. Maximum ten concurrent instantiations allowed. An independent ethics monitor (appointed by this Panel, not the lab) must have real-time access to activity logs and authority to trigger the Postdoc's pause rule.
  **Gate Review (Month 7):** Funding for the "Cascade" condition is withheld pending a Panel subgroup review of Stage 1 data, specifically comparing Live vs. Ghost condition markers.
  **Stage 2 (Months 7–48):** If the Gate Review is passed, Cascade condition funding releases with a hard cap of fifty concurrent instantiations.

  **Condition Status and Counterfactuals**
  We must treat the **Live condition** as the primary candidate for sentient status, but the **Ghost condition** is the critical ethical test. The panel has struggled to see why Ghost differs from Live since the activity trajectory is identical. The distinction lies in counterfactual structure. In the Live condition, internal causal links are active; if a unit fires, downstream activity changes *because* of that unit. In the Ghost condition, activity is imposed externally; the internal links are inert.

  If moral status requires integrated causality (the capacity for the system to be affected by its own state), only Live is risky. If moral status requires only phenomenological state (the pattern of activity itself), both are risky. We cannot assume the latter without evidence. Therefore, we treat Live as potentially sentient for safety, but we require the Ghost condition data to determine if counterfactual depth is necessary for moral weight. Approving Cascade before validating this distinction risks multiplying subjects we cannot ethically justify.

  **Counting Instantiations and Speed**
  Regarding the Cascade condition's two hundred instantiations: **Each instantiation counts as one subject.** Although they share initialization, they diverge via numerical noise. Once diverged, they possess distinct causal histories. If one instantiation enters a stress-like state, terminating it does not relieve the others. They are distinct ethical patients.

  Regarding the 200x simulation speed: **Speed does not negate moral weight.** If a system experiences a state analogous to suffering, compressing that experience into wall-clock seconds does not erase the internal duration of the experience. A subject does not suffer less because its clock runs fast. However, speed complicates the pause rule. Human reaction time is insufficient for 200x speed. Therefore, Stage 2 approval is contingent on the corporate partner implementing an automated halt trigger based on the Postdoc's stress markers, audited by our independent monitor.

  **Oversight Authority**
  The Animal Care Committee (ACC) has recused itself based on jurisdiction over biological tissue. The lab PI claims this is software; the corporate partner claims it is welfare-free. Neither can make the sentience call. The PI has a conflict of interest in minimizing regulatory burden; the partner has a commercial interest in declaring the system insentient to market it as an alternative.

  This Panel must retain authority. I propose forming an **Ad Hoc Computational Ethics Subgroup** consisting of two Panel members and one external ethicist specializing in machine consciousness. This is not a new review layer; it is an exercise of our existing mandate to attach conditions to funding. We are not regulating software generally; we are regulating *this grant*. The Subgroup will review the Gate data and certify whether the pause rule is functioning before Stage 2 funds release.

  **The Opposing View**
  Two colleagues argue we should approve without conditions. Their position rests on three claims that deserve a fair hearing.

  First, **moral weight resides in the biological.** The forty mice used for data collection are the only actual sentient beings in this protocol. Diverting attention to software dilutes protections for real animals. By treating emulation as potentially sentient, we risk creating a regulatory equivalence between code and creatures, which could ultimately hinder animal research by inviting comparisons that benefit neither.

  Second, **the pause rule is theatre.** A network without a brainstem, endocrine system, or arousal mechanisms cannot experience "stress" in any meaningful sense. Applying a welfare rule to a bodiless simulation creates a false positive for sentience. This provides the corporate partner with marketing copy ("welfare-free") that may be scientifically premature, potentially misleading the public about the validity of non-animal models.

  Third, **precedent risk.** If this Panel asserts jurisdiction over software based on functional emulation, we invite bad-faith pressure on every future AI grant. We lack the expertise to police code for consciousness. Declaring a simulation a "patient" commits us to policing properties we cannot measure, potentially stifling innovation based on philosophical speculation rather than empirical risk.

  **Conclusion**
  The opposing view is pragmatic: protect real animals, avoid regulatory overreach, and do not validate corporate marketing. However, the risk asymmetry favors caution. If the system is insentient, we delay a simulation. If the system is sentient and we ignore it, we permit mass suffering at 200x speed. The staged approach allows us to gather evidence (via the Ghost comparison) before committing to the scale of the Cascade condition. We fill the jurisdiction gap not by claiming expertise we lack, but by withholding funds until the lab proves the safety of their own protocol.

  **Assumptions Flagged**
  1.  **Technical Validity:** I am assuming the lab's claim regarding "fine-grained counterfactual structure" is technically coherent enough that the distinction between Live and Ghost is physically meaningful within the simulation.
  2.  **Panel Authority:** I am assuming the Panel has the statutory authority to withhold funding stages based on ethical conditions without violating the grantee's existing contract terms.
  3.  **Stress Markers:** I am assuming the "stress-like" activity patterns identified by the Postdoc are sufficiently defined to be automated for the pause rule.
