answer: |-
  You have already done the hard work. Your "rough rule" is 90% of the way to a robust ethical framework, but you are hesitating because you haven't named the variable doing the work. It isn't just "what they need." It is **Agency**.

  Here is the principle, stated precisely, followed by the audit of your cases, the verdict on your undecideds, and the blunt truth about your power dynamics.

  ### The Principle: Actionable Reality

  **An utterance is ethical if it provides the recipient with the most accurate model of reality required to exercise agency within the specific contract of that exchange.**

  This breaks down into three tests:
  1.  **The Contract:** What is the primary function of this interaction? (e.g., *Bonding, Problem-Solving, Ritual, Education*.)
  2.  **The Model:** Does the statement update the recipient's understanding of the world to match the constraints they actually face?
  3.  **The Agency:** Does this update empower them to act, or does it paralyze them?

  **The Power Clause:** In asymmetrical relationships, the party with more power bears the burden of defining the Contract explicitly. If you impose a "Bonding" contract on a subordinate to withhold "Problem-Solving" data, you are not being polite; you are hoarding agency.

  ---

  ### Audit of Your Cases

  Here is how *Actionable Reality* scores your verdicts.

  | Case | Contract | Verdict | Principle Analysis |
  | :--- | :--- | :--- | :--- |
  | **MIL Dinner** | Bonding / Gratitude | **Lie OK** | The goal is validation of effort, not gastronomic critique. Telling the truth reduces her agency to feel pride in caregiving without granting you any actionable benefit. |
  | **Brother (Asked)** | Problem-Solving | **Truth OK** | He requested a model update to improve the draft. Withholding the truth reduces his agency to fix it. |
  | **Brother (Unasked)** | Support / Sharing | **Truth Bad** | The contract was "share," not "edit." Imposing the Problem-Solving contract violates his autonomy. You are solving a problem he didn't assign you. |
  | **Hallway Greeting** | Ritual (Phatic) | **Lie OK** | The function is social recognition, not data transfer. "Fine" maintains the flow. "Bad week" demands care he isn't contracted to give in a hallway. |
  | **Relay Message** | Project Mgmt | **Lie BAD** | **Critical Failure.** The contract is decision-making. "Looking into it" gives the client a false model of reality. He cannot plan. You prioritized your comfort (avoiding conflict) over his agency. |
  | **Rejection (Formula)** | Ritual / Closure | **Lie OK** | "Look forward to hearing from you" is a period, not a sentence. It signals "process complete." No agency is required from the recipient. |
  | **Rejection (Impressed)** | Feedback | **Lie BAD** | This implies a model of reality ("You were close") that is false. It corrupts their agency to calibrate future applications. It gives false hope. |
  | **Grandma (Dementia)** | Comfort | **Lie OK** | She lacks the cognitive agency to process the truth. The truth brings grief without understanding. "Resting" preserves her emotional equilibrium. |
  | **Nephew (Hamster)** | Education | **Lie BAD** | The contract is helping him navigate mortality. "Farm" delays the necessary model update. He needs to learn death is permanent to process grief. |

  **Where your intuition was right:** You correctly identified that truth is not the highest good in *Ritual* or *Bonding* contracts, but it is non-negotiable in *Problem-Solving* and *Education* contracts.
  **Where you failed:** The **Relay Message**. You hid behind technical truth ("still looking into it") to avoid delivering a functional falsehood (the implication of "maybe"). That was cowardice, not translation.

  ---

  ### The Power Dynamic (The Blunt Part)

  You wrote: *"I'm blunt with my intern in a way I'm not blunt with my boss... I'm blunt in English with colleagues who speak English worse than I do."*

  **Your suspicion is correct. This is not honesty. This is dominance.**

  Under the *Actionable Reality* principle, you are failing here.
  1.  **The Intern:** The contract is *Mentorship*. Mentorship requires accurate data (truth) delivered with the scaffolding to use it (support). If you are blunt without support, you are not giving them "Actionable Reality"; you are giving them "Intimidation." They cannot push back, so they cannot correct your model. You are operating with bad data and they are afraid to tell you.
  2.  **The English Proficiency:** When you are blunt with non-native speakers, you are exploiting a linguistic power imbalance. They may not understand the nuance of your bluntness, or they may feel culturally barred from pushing back. You are prioritizing your efficiency over their comprehension.

  **Verdict:** You enjoy the "glow of being the honest one" because it feels like virtue, but in these cases, it is a luxury you afford yourself at the expense of those with less power. You are using "honesty" as a shield against the labor of translation. You translate for the Dutch client; you should translate for the intern, too.

  ---

  ### The Undecided Cases

  **1. The Junior Colleague: "Please be honest with me."**
  *   **Analysis:** In a Japanese/Dutch hybrid context, this is almost certainly a **Ritual Contract**, not a Problem-Solving one. It is a signal of humility, not a request for brutal critique.
  *   **Verdict:** Do **not** take it at face value. If you deliver unvarnished bluntness, you violate the *Agency* clause because they likely lack the political capital to process or act on that honesty without risk.
  *   **Action:** Treat it as a request for *constructive* honesty. Calibrate the truth to their ability to act on it. If you cannot be blunt without damaging their position, you are obligated to soften the delivery. The "honesty" they want is "I will not deceive you about your standing," not "I will tear apart your work."

  **2. The AI Assistant: "Great question!"**
  *   **Analysis:** This irritates you because it violates *Functional Fidelity*. The AI cannot judge "greatness." It is simulating a *Bonding/Reward* contract that it cannot fulfill.
  *   **Verdict:** Your irritation is rational. It is the **Rejection Email (Impressed)** case. It devalues the currency of praise. If an AI tells everyone every question is "great," the word "great" loses its informational utility. It creates noise in your model of reality.
  *   **Principle:** A decent principle demands that praise implies discrimination. If there is no capacity for discrimination, there is no capacity for praise.

  ---

  ### Limitations: Where This Principle Fails

  You asked for an honest list of where *Actionable Reality* breaks.

  1.  **The "Kindness" Exception:** Sometimes, accurate reality is too heavy for the moment, even if they *could* understand it. If your brother sent that draft after his wife left him, the *Problem-Solving* contract is temporarily suspended by the *Humanity* contract. The principle struggles to weigh immediate emotional survival against long-term utility.
  2.  **The "Self-Deception" Loophole:** You can convince yourself someone "can't handle the truth" to save yourself the discomfort of conflict. (See: The Relay Message). The principle relies on your honest assessment of *their* agency, which is vulnerable to *your* bias.
  3.  **Cultural Translation:** In Japan, "No" is often structurally impossible. "Looking into it" *is* the culturally accurate translation of "No." Here, the *Actionable Reality* for a Dutch client (Direct No) conflicts with the *Actionable Reality* for the Japanese team (Preserve Harmony). You are the crash site for this. The principle doesn't solve the conflict; it just highlights that you are currently privileging the Client's agency over the Team's safety.

  ### Final Verdict

  Your rough rule was correct, but you lacked the spine to apply it to yourself.

  **The Rule:** Tell the truth when it enables action. Tell a lie when it enables peace.
  **The Trap:** Use your power to decide which one it is.

  You are currently using "honesty" as a weapon against those below you (interns, English learners) and "politeness" as a shield against those beside/above you (clients, team). That is the definition of privilege.

  **Fix:**
  1.  **Stop the Relay Lie.** Tell the Dutch client "No" clearly, and do the work to explain the Japanese context so they don't lose face. That is your actual job.
  2.  **Scaffold the Intern.** If you are blunt, you must offer a path forward. Bluntness without a solution is just abuse.
  3.  **Accept the AI Irritation.** It is a valid signal that the tool is degrading your language.

  You don't need more theory. You need to stop enjoying the glow.
