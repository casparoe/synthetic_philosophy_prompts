answer: |-
  **Property Language (Handout)**
  Rules must be boolean combinations of these eight primitives. Each is mechanically checkable by the instructor.
  1.  `IsClosed`: Boundary forms a complete loop.
  2.  `NumComponents`: Count of distinct disjoint shapes (Int).
  3.  `HasHole`: Enclosed empty space within a shape (T/F).
  4.  `IsSymmetric`: Exists a line dividing figure into mirror images (T/F).
  5.  `ContainsOther`: One shape fully inside another (T/F).
  6.  `MaxAngle`: Sharpest vertex angle (<90° vs ≥90°).
  7.  `AspectRatio`: Bounding box height/width (>1 vs ≤1).
  8.  `IsConvex`: Line segment between any two points stays inside (T/F).

  **Problems**
  *   **Problem 1 (Easy):**
      *   **Train (12):** Left: 6 figures (3 circles, 3 squares), all boundaries continuous. Right: 6 figures (3 arcs, 3 lines), all boundaries broken.
      *   **Target:** `IsClosed == True`.
      *   **Decoy:** `IsConvex == True` (All Left convex; 3 Right convex).
      *   **Hold-out (8):** 4 Left (Closed concave stars), 4 Right (Open convex arcs). Breaks Decoy.
  *   **Problem 2 (Medium):**
      *   **Train (12):** Left: 6 pairs, circle fully within square boundary. Right: 6 pairs, circle outside square boundary.
      *   **Target:** `ContainsOther == True`.
      *   **Decoy:** `NumComponents == 2`.
      *   **Hold-out (8):** 4 Right figures with 3 components (circle, square, triangle separate). Breaks Decoy.
  *   **Problem 3 (Hard):**
      *   **Train (12):** Left: 6 vertically symmetric shapes. Right: 6 asymmetric shapes.
      *   **Target:** `IsSymmetric`. **Decoy:** Vertical axis only. **Hold-out:** Right set includes horizontal symmetry.

  **Scoring & Payoffs**
  *   **Classification:** +10 per correctly sorted figure (Train + Hold-out).
  *   **Complexity:** -5 per primitive used in rule. (Puns enumeration/length).
  *   **Clause Stuffing:** Disjunctions (>3 clauses) incur -10 penalty.
  *   **Adversarial:** +15 for constructing a "Monster" (fits rule, violates intuition).
  *   **Patch:** -10 to rule-writer for each patch required to stop Monster.
  *   **Validity:** Rule must be boolean logic over primitives. Invalid syntax = 0.

  **Timeline**
  | Time | Activity | Deliverable |
  | :--- | :--- | :--- |
  | 00–10 | Distribute language; draw P1 Train (12 figs) | Groups form |
  | 10–35 | Write rules; Score vs Train; Reveal P1 Hold-out | Locked rules |
  | 35–60 | P2 Train; Adversarial Round (Swap rules; draw Monsters) | Monsters drawn |
  | 60–75 | P3 Quick Fire; Final Scoring | Rules patched |
  | 75–90 | Debrief; Name concepts (Bias, Overfitting) | Discussion |

  **Debrief Mapping**
  *   **Hold-out Failure:** Demonstrates overfitting; data alone doesn't guarantee generalization.
  *   **Adversarial Monster:** Shows rules underdetermine intent; syntax ≠ semantics.
  *   **Complexity Penalty:** Mimics Occam's Razor; simple priors win.
  *   **Language Limit:** Shows we only find what we can say (language bias).

  **Troubleshooting**
  *   **Drawing Precision:** Students argue if a curve is "closed." *Fix:* Instructor is final arbiter; draw boundaries thickly.
  *   **Stuck Groups:** *Fix:* Allow "pass" on P3 to ensure debrief time.
  *   **Rule Ambiguity:** *Fix:* Enforce boolean syntax strictly (e.g., `AND`, `OR`, `NOT`). No natural language.
  *   **Monster Disputes:** *Fix:* Monster valid only if it satisfies boolean rule exactly but visually belongs to opposite set.

  **Limitation Note**
  This activity demonstrates reliance on prior bias but cannot simulate *how* that bias is acquired. You must supply the narrative that these primitives resemble human innate priors or learned cultural standards, which the game takes as given. The students feel the constraint of the language, but not the origin of the vocabulary.
