          *   **Options:** Ban vs. Wild West vs. Tiered Containment.
          *   **Aspiration:** "Research continues without public harm/regulation."
      *   *Satisficing vs. Optimization:*
          *   Why it wasn't optimization: No probabilities available.
          *   Why it was satisficing: Categorical rules (P1-P4) act as heuristics. Once the box is checked, search stops.
      *   *The "Hostile Environment" Problem:*
