          5.  Address the "Reasonable" worry (Burdens of Judgment).
          6.  Discuss the costs (what is lost).

  7.  **Final Polish:** Ensure the tone is seminar-appropriate (rigorous but helpful). Make sure to directly answer the specific question about whether religious citizens are defined as unreasonable by fiat. (Answer: No, but they must accept the burdens of judgment).

      *(Self-Correction on the "Proviso")*: I need to make sure I distinguish between the *ideal* of public reason (courtroom/legislature) and the *background culture* (churches/universities). Religious reasons are fine in the background culture.

      *(Refining the "Slip")*: The slip is actually in the move from (2) to (6) via (5). Rawls agrees with (5) and (6)! He *does* think secular comprehensive doctrines are inadmissible as the *final basis* for coercion. The trick is that the *Political Conception* isn't a comprehensive doctrine. So the break is at (7).

      *Wait, let's look closer at (7).* "Political conceptions... are themselves built on controversial normative premises." Rawls denies this. He says they are built on *fundamental ideas implicit in the public political culture*. Whether he succeeds is debatable, but his *argument* rests on denying (7). So the user needs to see *why* Rawls denies (7).

      *Okay, plan set.*
      1. Validate the "Self-Defeat" objection.
