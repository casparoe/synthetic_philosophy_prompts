      3. Clarify (5)/(6) (Rawls agrees secular comprehensive doctrines are excluded too).
      4. Address the "Reasonable" definition (Burdens of Judgment).
      5. Discuss the costs.

  8.  **Final Review against constraints:** The user wants to know which premise to reject and the costs. I need to be explicit about that.

