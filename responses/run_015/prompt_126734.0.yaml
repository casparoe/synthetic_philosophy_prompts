answer: |-
  This is an ontological impasse disguised as a methodological dispute, confirming your hunch about a hidden theory-of-mind module, so expect no consensus resolution, only paradigm dissolution.

  The representationalist side operates on a Cartesian internalist model where cognition happens inside the head and artifacts are merely outputs reflecting pre-existing mental states; this requires inferring invisible propositions (beliefs) from visible effects, smuggling in a specific Theory-of-Mind that assumes bounded individuality. The material engagement side operates on an enactive or extended mind model where cognition emerges through the coupling of brain, body, and thing; here, artifacts are constituents of thought, not reflections of it, making the search for discrete "beliefs" a category error. Because the disagreement is about the fundamental nature of mind and matter rather than the interpretation of specific data, stratigraphic agreement is irrelevant; the bone is either a symbol of a thought or a participant in a process, and no amount of empirical precision can bridge that ontological gap.

  Progress would not look as a solution to the existing problem but as a dissolution of the question itself, likely through formal models of material agency (like Material Engagement Theory) or the ontological turn that treats past realities as fundamentally different rather than psychologically continuous with the present. You should not expect the debate to end with one side vindicated; instead, expect the terminology to become obsolete as newer frameworks bypass the mind-matter dualism entirely, rendering the question of "reading beliefs" as archaic as phrenology.
