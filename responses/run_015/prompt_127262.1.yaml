  hey so I'm in this interfaith dialogue group and every time someone asks whether the resurrection report is historially credible, one guy shuts it down with "religious belief is a form of life, not a set of propositions" — like that settles whether the claim can be wrong. I want to bring a disambigution menu to next meeting so we can actually talk instead of talking past eachother.

