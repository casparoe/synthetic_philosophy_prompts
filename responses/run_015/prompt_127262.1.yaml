  1. **(iii) The Non-Cognitive Reading:** Belief is purely an emotional stance, lacking truth-claims. **False.** Wittgenstein never denied religious language has cognitive content; believers *intend* "He rose" as factual. If true, historical questions would be category errors. But since it's false, using it to block historical critique is dishonest. It changes the subject rather than answering it, falsely protecting claims from scrutiny they logically invite.

  2. **(i) The Habitual Reading:** Belief is an unreasoned social custom, like a greeting. **Trivial.** Descriptively, religion involves habits. Normatively, this offers no epistemic protection. Habits can be based on false premises (e.g., washing hands to ward off demons). Acknowledging belief is a "habit" doesn't make underlying fact-claims immune to evidence. Your friend misapplies this if he thinks describing the practice validates the history or prevents factual error.

  3. **(ii) The Framework Reading:** Belief constitutes a grammatical system setting internal standards of reason. **Substantive/Defensible.** This suggests historical evidence doesn't *ground* faith (faith isn't a hypothesis). However, it **does not** automatically dismiss historical questions; it merely reweights them. If the resurrection is treated as a historical event, it remains open to historical scrutiny. Wittgenstein allows that religious language games intersect with empirical ones. Using this to shut down inquiry is a misapplication; it explains why believers *persist* despite evidence, not why evidence is irrelevant. Your friend uses it to create an immunity shield, but properly understood, it only describes the *role* the belief plays, not its factual invulnerability.
