      "It's the ambiguity," Eleanor said, stirring her tea. "My instructor says feeling cold and feeling anxious can be introspectively identical. She claims this isn't a failure of attention."

      David leaned back. "Sounds like Timothy Williamson would nod along. It's the cold case all over again. The anti-luminosity argument."

      "But she insists the feeling is given," Eleanor countered. "If I feel cold, I'm in a position to know I feel cold. That's luminosity. The state makes itself known."

      "Precisely the principle Williamson shreds," David said. "Imagine your hand cooling slowly. At time t1, you feel cold and know it. At t2, it's marginally warmer, indistinguishable from t1. If knowledge requires safety, you must know at t2. Iterate this. Eventually, you know you feel cold when you're boiling. Contradiction. So, there must be a point where you feel cold but don't know it."

      "Why must knowledge satisfy that margin for error here?" Eleanor asked. "Your sorites relies on the idea that if I can't tell t1 from t2, my knowledge status must be identical. But introspection isn't about discriminating external temps. It's about the presence of the experience itself."

      "Knowledge is factive," David insisted. "If you claim to know, you must be safe from error. If you can't discriminate t1 from t2, you can't safely claim knowledge at t1 without committing to t2. The margin for error isn't optional; it's constitutive of knowledge."

      "But that treats introspection like perception," Eleanor argued. "When I see a red patch, I might be hallucinating. When I feel pain, the feeling *is* the fact. The gap between appearance and reality collapses. Your margin for error applies where there's a gap to bridge. Here, there's nothing but the sensation."

      "Even so," David pressed, "you admit you can't tell anxiety from cold sometimes. So there's indiscriminability. If you know it's cold, you must be able to rule out anxiety. If you can't rule it out in adjacent cases, you don't know."

      "I'm in a position to know," Eleanor clarified. "Luminosity doesn't mean I'm constantly judging. It means the evidence is available. The sorites fails because 'being in a position to know' is vague. You're assuming knowledge has sharp boundaries."

      "Knowledge doesn't have sharp boundaries," David agreed. "But the condition 'feeling cold' does, or at least, the knowledge of it must cut off somewhere. If you deny the margin for error, you deny safety. If you deny safety, you deny knowledge. You're left with mere belief."

      "Or," Eleanor said, "you accept that for phenomenal states, safety works differently. I don't need to rule out distant possible worlds where I'm wrong, because in those worlds, I wouldn't be having this experience. The experience anchors the knowledge."

      "Let's shift tack," David said. "What about KK? Knowing that you know. If luminosity holds, surely KK follows. If feeling cold ensures you can know it, then knowing you feel cold ensures you can know that you know."

      "Not necessarily," Eleanor replied. "Luminosity concerns the phenomenal state. KK concerns the knowledge state. I could be in a luminous state, know it, but lack the higher-order capacity to recognise that knowledge due to conceptual clutter. Luminosity is about the object-level state; KK is about the epistemic level."

      "They stand or fall together," David countered. "If you attack KK with a sorites, you attack luminosity. Imagine a series of cognitive states where your grasp on 'knowing' weakens. If KK holds, you know you know at every step until you don't know at all. But if you don't know, you didn't know initially. The instability infects the base."

      "Why?" Eleanor asked. "Suppose I know I'm cold. That's secure. Do I know that I know? Maybe I'm distracted. Luminosity says the cold is manifest. It doesn't say my reflection on that manifestation is perfect. I can keep luminosity and dump KK."

      "But if the cold is luminous, you're in a position to know you know," David argued. "Because you're in a position to know the cold, and you're in a position to know that you're in that position. If you sever them, you're saying the state is self-intimating but the knowledge of it isn't. That's unstable. If the light is on, you see the light. If you see the light, you see that you see it."

      "No," Eleanor said firmly. "Seeing the light is first-order. Seeing that I see it requires a concept of seeing. I might lack the concept in the moment. Luminosity is pre-conceptual; KK is conceptual. That's how I keep one and dump the other."

      "Williamson would say you're retreating to a notion of 'awareness' that isn't knowledge," David said. "Once you call it knowledge, you invite the margin for error. Once you invite the margin, the sorites bites. You can't have it both ways. Either it's knowledge, and it falls to the cold case, or it's mere consciousness, and you've abandoned epistemology."

      "Perhaps," Eleanor conceded slightly. "But my teacher's point stands. The confusion between cold and anxiety isn't ignorance. It's the texture of the state. If luminosity fails, it's not because we're blind. It's because knowledge demands a precision experience doesn't owe."

      "And if knowledge demands it," David concluded, "then experience isn't enough. You need safety. And safety requires a margin. And the margin kills luminosity."

      "Then perhaps," Eleanor said, finishing her tea, "we need a different account of knowledge. One that fits the skin, not the thermometer."

      "Good luck selling that to the externalists," David smiled.

