answer: |-
  **PHD COMPREHENSIVE EXAMINATION: ETHICS**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider two policy choices available to a state energy ministry regarding nuclear waste storage. Neither policy affects anyone currently alive. Both policies result in the same total number of people existing in the future.

  **Case 1 (Deterministic):**
  *   **Cheap:** Commission the reactor now. Waste containment fails in sixty years. Everyone then alive in the region contracts a chronic illness (lifetime welfare 70). Because the policy alters social conditions, the specific individuals who exist are numerically distinct from those who would exist under the alternative.
  *   **Safe:** Build proper storage. No illness (lifetime welfare 90). The specific individuals who exist are numerically distinct from those in Cheap.
  *   *Stipulation:* The link between policy and identity is deterministic. For any person $P$ existing under Cheap, $P$ would not have existed under Safe.

  **Case 2 (Drift):**
  *   There is a fixed pool of candidate gamete-pairs, indexed independently of the ministry's decision.
  *   **Cheap:** Each candidate pair has a 0.4 probability of producing a person. Any person produced has welfare 70.
  *   **Safe:** Each candidate pair has a 0.4 probability of producing a person. Any person produced has welfare 90.
  *   *Stipulation:* Expected population size is equal. For no candidate pair is it true that they *would* produce a person under one policy and *would not* under the other. The identity-affecting element is chancy, not deterministic.

  Answer the following:

  (a) Explain precisely why the "no-harm" step of the nonidentity argument succeeds in Case 1, and identify what specific comparative relation becomes unavailable (rather than merely false) in Case 2. [4 marks]

  (b) Formulate the strongest complaint available against **Cheap** in Case 2 (e.g., appealing to expected welfare or conditional welfare). Argue whether this complaint is genuinely person-affecting or merely person-affecting in form. [4 marks]

  (c) Identify the premise regarding the identity and individuation of merely possible people required to sustain the complaint in (b). Show that the standard nonidentity argument does not supply this premise. What follows if this premise is granted? What follows if it is denied? [4 marks]

  (d) Trace the downstream theoretical costs of granting the premise in (c). Specifically, address the issue of partition sensitivity regarding the candidate pool. [4 marks]

  (e) Given that real-world policies plausibly affect identity in the chancy manner of Case 2, but we cannot empirically distinguish chancy from deterministic identity-effects ex ante, draw the practical upshot for duties to future generations. [4 marks]

  ***

  **MODEL ANSWER**

  In Case 1, the no-harm step succeeds because the counterfactual comparison required for harm is metaphysically impossible. To claim a person is harmed, we must assert they are worse off than they would otherwise have been. In the deterministic nonidentity scenario, the "otherwise" world contains a different person. Thus, there is no single subject who exists in both outcomes to bear the comparative burden. The relation unavailable in Case 2 is not the existence of the person, but the *determinate divergence* of existence. In Drift, existence is probabilistic for fixed candidates. Therefore, for any actual person, it is not true that they *would* have failed to exist under the alternative; rather, their existence was contingent under both. This restores the logical space for a de re counterfactual: the same candidate entity is at stake in both branches, differing only in probability and outcome quality.

  The strongest complaint against Cheap in Case 2 is that it lowers the expected welfare for every candidate individual. Under Safe, a candidate expects 36 welfare units (0.4 × 90); under Cheap, 28 units (0.4 × 70). Alternatively, one might argue that conditional on existing, the person is worse off (70 vs 90), and since their existence was not *dependent* on the choice in a deterministic sense, this is a harm. However, this is only person-affecting in form. It treats the "candidate" as a moral patient prior to actualization. If the candidate does not actually exist, they cannot be harmed in the standard sense. If they do exist, the complaint relies on the claim that they were subjected to a worse risk profile. This shifts the locus of harm from actual welfare states to ex-ante risk exposure.

  This move requires a load-bearing premise: that merely possible individuals (the indexed gamete-pairs) possess trans-world identity sufficient to ground moral claims. We must treat "Candidate #42" as the same entity across the Cheap and Safe worlds, even if #42 never actualizes in either. The standard nonidentity argument does not supply this; it assumes that moral status attaches only to actual people or that possible people are not individuated finely enough to track specific gamete-pairs across worlds. If granted, we can say Cheap harms Candidate #42 by lowering their odds of a good life. If denied, we revert to an impersonal comparison: Cheap is worse because it produces less expected value, not because it harms specific subjects. The nonidentity problem is not solved but relocated from actual persons to possible persons.

  Granting this premise incurs significant downstream costs, primarily partition sensitivity. The moral weight of the complaint depends on how we carve the pool of candidates. If we individuate candidates by specific gamete-pairs, the expected welfare calculation holds. But if we individuate by larger sets (e.g., "any child born to this generation"), the probabilities aggregate differently, potentially erasing the specific risk profile. There is no metaphysically privileged way to index merely possible people. If the moral verdict shifts based on how we conceptually slice the pool of possibilities, the person-affecting claim lacks objective grounding. We risk building moral obligations on arbitrary metaphysical distinctions between non-existent entities.

  The practical upshot is a duty of epistemic humility coupled with a precautionary principle. Since we cannot know whether a policy affects identity deterministically (Case 1) or chancily (Case 2), we cannot rely on the nonidentity loophole to justify risky policies. If we act as if Case 1 holds, we might violate duties to the specific individuals who would exist under Case 2. Therefore, policy must be justified either by impersonal principles (maximizing expected value) or by assuming the strongest person-affecting constraints (treating possible candidates as rights-bearers). Practically, this collapses the distinction: we must act as if future individuals have claims against us regardless of whether their existence is identity-dependent. The Drift case shows that the nonidentity problem relies on a fragile metaphysical assumption about determinism; once that is loosened, the person-affecting restriction either expands to cover possibles (with high metaphysical cost) or collapses into impersonalism. The problem is relocated, not dissolved.

  ***

  **MARKING SCHEME**

  **1. The Counterfactual Mechanism (4 Marks)**
  *   **Must Hit:** Candidate must explain that Case 1 blocks the "worse off" comparison because the subject does not exist in the alternative world. In Case 2, they must identify that the *determinate* link is broken, allowing a probabilistic comparison of the same candidate entity across worlds.
  *   **Common Error:** Stating merely that "different people exist" in Case 1 without explaining why this blocks the comparative relation, or claiming Case 2 guarantees the same people exist (it guarantees the same *candidates*, not necessarily actual people).

  **2. The Complaint and Person-Affecting Status (4 Marks)**
  *   **Must Hit:** Candidate must formulate the complaint (lowered expected welfare or risk exposure) and take a stand on whether this counts as genuinely person-affecting. They must note that this relies on the moral status of the "candidate" prior to actualization.
  *   **Common Error:** Asserting that expected welfare is straightforwardly person-affecting without addressing the ontological status of the non-actualized candidates.

  **3. The Load-Bearing Premise (4 Marks)**
  *   **Must Hit:** Candidate must identify the premise of trans-world identity for merely possible individuals (haecceitism of gametes/candidates). They must note the standard argument assumes actualism or lacks this granularity. They must state the consequence: granting it saves person-affecting views but burdens them with metaphysics; denying it forces impersonalism.
  *   **Common Error:** Identifying the premise as "people matter" or "risk matters" without locating the specific metaphysical commitment to the identity of unactualized possibilities.

  **4. Downstream Costs and Partition Sensitivity (4 Marks)**
  *   **Must Hit:** Candidate must explain that individuating possible people is arbitrary (partition sensitivity). If the pool is carved differently, the probabilities and harms shift. This undermines the objectivity of the person-affecting claim in Case 2.
  *   **Common Error:** Discussing general uncertainty or epistemic limits without addressing the specific metaphysical problem of how possible individuals are individuated.

  **5. Practical Upshot (4 Marks)**
  *   **Must Hit:** Candidate must conclude that because we cannot distinguish Case 1 from Case 2 empirically, we cannot use the nonidentity problem to excuse risky policies. Duties must be robust across both metaphysical possibilities (precautionary principle or impersonal maximization).
  *   **Common Error:** Concluding that the Drift case simply solves the problem and allows us to blame the ministry without qualifying the metaphysical cost or the epistemic uncertainty.

  **Distinction between A and B Answers**
  A **B-grade answer** will correctly apply the standard menu of nonidentity responses (same-number quality claim, person-affecting restriction) to the new case, concluding that Cheap is wrong because it lowers expected welfare. It will treat the Drift case as a straightforward variation where person-affecting views obviously win.

  An **A-grade answer** will identify that the Drift case only saves the person-affecting view by smuggling in a controversial metaphysical premise about the trans-world identity of merely possible people. It will recognize that this does not dissolve the nonidentity problem but relocates it from the ethics of existence to the metaphysics of possibility, highlighting partition sensitivity as a fatal flaw in the "candidate" complaint.
