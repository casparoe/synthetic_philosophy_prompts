  ### The Principle: Constitutive Practice Transmission

  To resolve your intuitions without abandoning your verdicts, I propose a single structural principle derived from the philosophy of social ontology (specifically refining the work of Anthony Smith and Eric Hobsbawm).

  **The Principle of Constitutive Practice Transmission:**
  > A collective identity is **Continuous** if the *activities* that constitute membership (rituals, language use, legal reasoning, kinship obligations) were transmitted intergenerationally across the claimed timeline, even if the *narrative explanation* of those activities was updated.
  >
  > A collective identity is **Invented** if the *symbols* of identity are new and impose a narrative of continuity onto a discontinuity of *practice*.

  This distinguishes the **Backend** (practices that structure life) from the **UI** (flags, anthems, tartans, origin stories). "Invented" does not mean "fake" or "illegitimate"; it means the UI was designed after the Backend was interrupted or created anew.

  ### Application to Your Cases

  1.  **Scottish Tartans (Invented):**
      *   **Analysis:** The *practice* of wearing specific patterns to denote clan allegiance did not exist continuously. The *symbol* (tartan) was applied to a population that previously used other markers.
      *   **Verdict:** **Invented.** (Matches your intuition). The UI was built without a corresponding Backend.

  2.  **Japanese Imperial Institution (Continuous):**
      *   **Analysis:** While the *narrative* of unbroken divine lineage was polished in the 19th century, the *office* and the *ritual practices* surrounding the Emperor were transmitted continuously. The Backend remained running even if the documentation was edited.
      *   **Verdict:** **Continuous.** (Resolves your ambivalence). The institutional thread you sense is the persistence of practice.

  3.  **South Sudan (Hybrid):**
      *   **Analysis:** The *State* (flag, borders, constitution) is a new UI built in 2011. The *Ethnic Communities* possess a Backend of kinship and cultural practice that is centuries old.
      *   **Verdict:** **State = Invented; People = Continuous.** (Matches your hesitation). You hesitate to call the *formation* a fiction because the *substrate* is real.

  4.  **European Union (Invented):**
      *   **Analysis:** The flag and anthem are new UI elements. There is no continuous Backend of shared civic ritual or political practice across Europe that matches the depth of a nation-state.
      *   **Verdict:** **Invented.** (Matches your classification).

  5.  **Apple Garage Story (Invented/Trivial):**
