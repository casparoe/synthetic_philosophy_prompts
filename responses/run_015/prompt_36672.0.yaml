answer: |-
  This is a classic case of **disciplinary friction over the functional role of normative concepts**, and your working hypothesis is largely correct, though the Broomean position adds a layer of metaphysical resistance that prevents it from being a *purely* verbal dispute.

  Here is a diagnosis of the disagreement, an assessment of what progress looks like, and a verdict on whether the impasse is due to confusion or depth.

  ### 1. The Diagnosis: Three Layers of Disagreement

  The stalemate persists because the two sides are arguing on three different levels simultaneously, often without signaling which level they are on.

  #### A. The Functional Level (Choice vs. Evaluation)
  **Your hypothesis is the strongest explanatory factor here.**
  *   **The Economist/Decision Theorist View:** "Better than" is a functional placeholder for a relation that guides choice. Its primary job is to prevent exploitation (money pumps) and allow for representation (utility functions). On this view, transitivity is a *constitutive norm of agency*. If your "better than" relation isn't transitive, it literally cannot perform the job of guiding a chooser.
  *   **The Temkin/Rachels View:** "Better than" is a descriptive label for the evaluative structure of the world (axiology), independent of any agent's capacity to choose. They are asking, "What is the value relation between State A and State B?" not "Which should an agent pick?"
  *   **The Clash:** When Temkin says "A is better than B, B is better than C, but C is not worse than A," she is describing a **value landscape**. When Broome (or an economist) hears this, they hear "An agent should choose A over B, B over C, but not A over C," which sounds like a description of **irrational agency**.
  *   **Why it stalls:** The Intransitivists argue that value *outruns* choice (the world can be evaluatively messy even if agents must be consistent). The Transitivists argue that if a relation doesn't constrain choice, it isn't "betterness" in the normative sense that matters.

  #### B. The Metaphysical Level (Structural vs. Substantive)
  This is where Broome specifically blocks your "verbal dispute" escape hatch.
  *   **Broome's Claim:** He argues that "better than" is a *formal* concept, akin to "longer than" or "higher than." Transitivity is part of the *meaning* of the word, not a discovered property of value. To say "better than is intransitive" is, for Broome, a category error equivalent to saying "a bachelor is married." He isn't just talking about choice; he is making a claim about the logic of comparative concepts.
  *   **Temkin's Claim:** She argues that "better than" is a *substantive* concept determined by the properties of the things being compared. If the properties of suffering and headaches generate intransitive intuitions, then the concept of "better than" must accommodate that. She treats "better than" more like "similar to" (which is famously intransitive in sorites cases) than "longer than."
  *   **The Clash:** This is a substantive disagreement about **semantic authority**. Does the logic of comparison dictate the structure of value (Broome), or does the structure of value dictate the logic of comparison (Temkin)?

  #### C. The Epistemic Level (Intuition vs. Coherence)
  *   **The Intransitivist Method:** Relies on **particularism**. The intuition that "100 years of torture is worse than a mild headache" is more secure than the abstract principle of transitivity. If the principle conflicts with the intuition, the principle goes.
  *   **The Transitivist Method:** Relies on **coherentism**. The abstract principle of transitivity is a precondition for rational thought. If the intuition conflicts with the principle, the intuition is an artifact of cognitive limitation (e.g., inability to discern small differences) and should be discarded.
  *   **The Clash:** One side treats the spectrum intuition as *data*; the other treats it as *noise*.

  ### 2. Is it Verbal or Substantive?

  It is **substantive**, but it is disguised as a verbal dispute because both sides are fighting for ownership of the term "better than."

  If it were purely verbal, we could solve it by saying: "Okay, let's call the transitive relation $>_C$ (Choice) and the intransitive relation $>_V$ (Value)."
  *   **Why this doesn't work:** The Broomeans argue that $>_V$ (if intransitive) cannot be *normative*. If it doesn't imply you ought to choose A over C, in what sense is A "better"? The Intransitivists argue that $>_C$ (if forced to be transitive) fails to capture the *truth* about value.
  *   **The Real Fight:** It is a fight about **Normative Realism**. The Intransitivists are willing to sacrifice the action-guiding nature of value to save the accuracy of our evaluative judgments. The Transitivists are willing to sacrifice the accuracy of our evaluative judgments (calling them "illusions" or "vagueness") to save the action-guiding nature of value.

  ### 3. What Would Count as Progress?

  Given that this has been stuck since the 90s, standard philosophical argumentation (more intuition pumps vs. more logical proofs) is unlikely to move the needle. Progress would likely come from one of three directions:

  #### A. Formal Disambiguation (The "Interval Order" Solution)
  Economists have largely moved past strict orderings. In social choice, we model this using **semi-orders** or **interval orders** (where $A > B$ only if $u(A) > u(B) + \delta$, accounting for a threshold of discrimination).
  *   **Progress:** If value theorists formally adopted **vagueness-aware structures** without calling them "intransitive betterness," the tension might dissolve. For example, if "better than" is treated as a supervaluation over a set of precise admissible utility functions, the intransitivity appears at the level of *determinacy*, not the underlying relation.
  *   **Why it hasn't happened:** Philosophers often resist formalization that they feel "models away" the normative force of the problem.

  #### B. The "Reasons" Turn
  Some recent work (e.g., by John Broome himself, or Ruth Chang) shifts the focus from "better than" to "reasons for."
  *   **Progress:** If we agree that "A is better than B" means "There is more reason to choose A than B," we can ask whether *reasons* aggregate transitively.
  *   **Potential:** If it turns out that reasons *do* aggregate transitively (even if intuitions don't), the Transitivists win. If reasons can be incommensurable in a way that generates cycles, the Intransitivists win. This moves the debate from semantics to the metaphysics of reasons.

  #### C. A Pragmatic Truce
  Acknowledging that "better than" is a **cluster concept**.
  *   **Progress:** Admitting that there is a *choice-guiding* betterness (transitive) and an *evaluative* betterness (potentially intransitive), and specifying which one is relevant for the context (welfare policy vs. metaphysical axiology).
  *   **Why it's hard:** As noted, Broomeans deny the coherence of the latter. Progress requires one side to concede that their definition isn't the *only* legitimate one.

  ### 4. Verdict: Hard Problem or Confusion?

  It is a **genuinely hard problem**, not merely a confusion, but it is exacerbated by **lexical overload**.

  *   **Why it's hard:** It touches on the **Sorites Paradox**, which remains unsolved in logic and language. The spectrum argument *is* a Sorites paradox applied to value. Until we have a consensus on how to handle vagueness in predicates (is "tall" transitive?), we won't have one on "better."
  *   **Why it's confused:** The confusion lies in expecting a single relation to do two incompatible jobs:
      1.  Track the fine-grained, potentially vague phenomenology of value (Temkin's job).
      2.  Serve as the backbone of rational agency and welfare economics (The Economist's job).

  **My honest assessment:**
  The economists are right that for *decision theory* and *policy*, you must assume transitivity (or a close proxy like a semi-order) or the machinery breaks. You cannot build a welfare function on an intransitive relation.
  The philosophers (Temkin) are right that *human evaluative experience* appears intransitive in spectrum cases.

  The impasse exists because the Broomeans insist that (2) defines the concept, while the Temkinians insist that (1) defines the concept.

  **Recommendation for you:**
  As an economist, you are justified in treating transitivity as a **modeling assumption** required for agency. You do not need to solve the metaphysical problem to do welfare economics. However, recognizing that the philosophers are pointing out a **limitation in the mapping between value and preference** is valuable. It suggests that welfare functions might need to incorporate thresholds of significance (just noticeable differences) rather than assuming a continuous, transitive ordering of all states.

  The seminar isn't spinning its wheels because the question is trivial; it's spinning because it is asking whether **rationality constrains reality** or **reality constrains rationality**. That is not a question that yields to a proof.
