          *   *Diagnosis:* Disagreement over whether "better" is a *metric* concept or a *phenomenological* concept.

      *   *Point 3: The Role of the Agent.* Econ: No transitivity = no agency (Money Pump). Temkin: Value exists independently of agents choosing it. A world can be better than B, B better than C, without anyone choosing.
          *   *Diagnosis:* The **Normative/Agential Gap**. Is value essentially action-guiding?

      *   *Point 4: Why the Impasse?* Both sides have "proofs."
          *   Transitivists: Logic/Definition.
