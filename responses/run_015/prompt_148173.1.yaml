prompt: |-
  I'm a research analyst at a mid-sized private foundation, and in three weeks I'm presenting to our program committee a proposal to replace the scoring template we use when we allocate across program areas. The committee votes at the end of that same meeting on whether to pilot the new method on one program area for a year, so the question period, not the slides, is where this is decided. The room is: two development economists of the experimentalist persuasion, who convert everything into external validity, publication bias, and whether anything not estimated off a randomized design counts as evidence at all; a former government cost-benefit analyst who will want a discount rate, a distributional weight, and an account of what happens under parameter uncertainty; two program officers with fifteen years of field experience each, who distrust aggregate metrics and will hear any formula as head office removing discretion from the people who actually know the partners; one board member who introduced our current framework to us and reads the effective-altruism literature, and who will defend it as cheap, transparent, and good enough; and the board chair, a retired software founder who thinks in terms of leverage and will ask what the framework would have told us to do five years ago.

  My thesis is that the three-factor score we now use -- importance, tractability, neglectedness -- is not wrong so much as mis-specified, because two of its three factors are properties of a funder relative to a cause rather than properties of the cause, and because it has no term for the value of finding things out. I want to replace the score with an estimate of the expected marginal value of our next dollar to a cause, computed against an explicitly modeled counterfactual funding path, and then decompose it for presentation into four terms: a scale-weighted tractability indexed to our own access and comparative advantage rather than to the cause in the abstract; a saturation discount read off an absorption curve, meaning what the cost per unit of outcome does as cumulative funding in that area rises over a five-year window; a crowding term, since a dollar of ours that only substitutes for a dollar that would have arrived anyway does much less than a dollar that pulls in others or that no one else was going to give; and an option-value term for grants whose real payoff is resolving a disagreement before a much larger later commitment, which on my arithmetic is why a long-horizon funder like us should sometimes fund things that score badly on all three of the classic factors. The concrete thing I have to defend is a ranking flip: our largest line item, a well-evidenced and heavily funded global-health delivery program with a well-characterized cost per outcome, comes out below a small, weakly evidenced institutional-reform pilot that is very cheap now and that sits in front of a decision about a much larger commitment in about four years.

  What I want from you is a Q&A prep sheet, not a defense of the view. Give me the eight or so objections I will actually get, in roughly the order they will arrive, each attributed to the person most likely to raise it and phrased the way that person would phrase it -- the treasury analyst's objection should sound like a treasury analyst's, not like a philosopher's, and the program officers' should be about partners and legibility rather than about expected value. For each: what I should concede up front rather than being forced into it at the third follow-up, a reply I could give in about two minutes standing at a whiteboard, and a blunt note on where that reply is soft. Include what I should volunteer in the first two minutes to take the sting out of the two or three objections with real force, and tell me which objection I should simply grant in full. Finally, give me the question I am hoping nobody asks. My own candidate is the coordination worry: if every funder conditions on what every other funder will do, then the crowding term can make everyone rationally stand down at once and defund an area by mutual prediction, and I do not have a fixed point to point to. Tell me if you think the real killer is a different question -- I suspect the option-value term is vulnerable to something like always recommending more research and meta-work -- and argue for your choice over mine.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User Role:** Research Analyst at a mid-sized private foundation.
      *   **Task:** Presenting a proposal to replace the current scoring template (Importance, Tractability, Neglectedness - ITN) with a new Expected Marginal Value (EMV) model decomposed into four terms (Scale-weighted Tractability, Saturation Discount, Crowding Term, Option Value).
      *   **Audience:** Program Committee (voting body).
          *   2 Development Economists (Experimentalists, RCT-focused, external validity, publication bias).
          *   1 Former Gov Cost-Benefit Analyst (Discount rates, distributional weights, parameter uncertainty).
          *   2 Program Officers (15 yrs experience, distrust aggregate metrics, value discretion/partner relationships).
          *   1 Board Member (Introduced current ITN framework, EA-lite, values transparency/simplicity).
          *   1 Board Chair (Retired software founder, thinks in leverage, retrospective testing).
      *   **Stakes:** Committee votes *after* the meeting. The Q&A is the decision point.
      *   **Thesis:** ITN is mis-specified (relative vs. absolute properties, ignores value of information). New model ranks a small institutional reform pilot *above* a large global health delivery program.
      *   **Deliverable:** Q&A Prep Sheet (8 objections, attributed, phrased specifically, concessions, 2-min whiteboard replies, soft spots, voluntary pre-emptive statements, one objection to grant fully, and the "real killer" question).

  2.  **Deconstruct the Audience & Their Likely Objections:**
      *   *Economists:* Will hate the lack of hard data in the new model. "How do you quantify option value?" "Where's the confidence interval?"
      *   *Cost-Benefit Analyst:* Will focus on the math. "What's your discount rate?" "How do you handle uncertainty in the absorption curve?"
      *   *Program Officers:* Will hate the formulaic approach. "This ignores partner context." "You're taking away our judgment."
      *   *Board Member (ITN Defender):* Will defend simplicity. "ITN is transparent; this is a black box." "Is the juice worth the squeeze?"
      *   *Board Chair:* Will focus on leverage/history. "Would this have worked 5 years ago?" "Where's the leverage?"

  3.  **Drafting the 8 Objections (Iterative Process):**

      *   *Objection 1 (Board Chair - Leverage/History):* Needs to be about the retrospective test. "Show me the backtest."
      *   *Objection 2 (Economists - Evidence Quality):* They hate the "weakly evidenced" pilot ranking high. "You're prioritizing guesswork over RCTs."
      *   *Objection 3 (Program Officers - Discretion/Partners):* They hate the formula. "This treats partners like line items."
      *   *Objection 4 (Cost-Benefit Analyst - Uncertainty/Parameters):* "Garbage in, garbage out." Specifically about the absorption curve/saturation.
      *   *Objection 5 (Board Member - Transparency/ITN):* "ITN is simple; this is complex."
      *   *Objection 6 (Economists - Counterfactuals):* "How do you know what others would have funded?" (Crowding term).
      *   *Objection 7 (Program Officers - Implementation):* "How do we explain this to grantees?"
      *   *Objection 8 (Cost-Benefit Analyst - Discounting):* "Option value is just delaying cost."

      *Refining for Voice:* Make sure the Economist sounds like an Economist (external validity, priors), the PO sounds like a PO (relationships, trust), etc.

  4.  **Developing Concessions & Replies:**
      *   *Strategy:* Concede the weakness to build trust, then pivot to the *marginal* improvement over ITN.
      *   *Whiteboard Reply:* Needs to be visual and conceptual, not math-heavy.
      *   *Soft Spot:* Where does the argument actually break? (Usually data availability or subjectivity).

  5.  **Selecting the "Grant in Full" Objection:**
      *   Which one is indefensible? Usually, it's the claim of precision. The model *looks* precise but relies on subjective inputs. Conceding that the *precision* is illusory but the *directionality* is better is a strong move. Or, conceding that the "Option Value" is hard to quantify. Let's go with the *precision/quantification* concession to the Cost-Benefit Analyst. It builds credibility.

  6.  **Pre-emptive Volunteering:**
      *   Need to address the biggest elephants: The ranking flip (Health vs. Reform) and the complexity burden.

  7.  **The "Killer Question" Analysis:**
      *   *User's Candidate:* Coordination failure (everyone waits for everyone else).
      *   *My Assessment:* That's a game theory problem, but in practice, funders don't coordinate that perfectly.
      *   *Better Candidate:* The "Option Value" trap. If Option Value is high for *learning*, does the model just perpetually fund pilot studies and meta-research without ever funding implementation? This is the "Perpetual Pilot" problem. It attacks the core incentive structure of the new model.

  8.  **Drafting the Content (incorporating specific constraints):**
      *   *Tone:* Professional, sharp, realistic.
      *   *Format:* Q&A Prep Sheet.
      *   *Specifics:* Ensure the "Health vs. Reform" flip is addressed.

      *(Self-Correction during drafting)*: Make sure the Program Officers' objection isn't just "I hate math." It needs to be about *legibility* to partners. "How do I tell a partner we're cutting them because of a saturation curve?"
      *(Self-Correction on Economists)*: They won't just say "no RCTs." They'll say "You're substituting model risk for sampling error."

  9.  **Final Review against Constraints:**
      *   8 objections? Yes.
      *   Attributed correctly? Yes.
      *   Concession/Reply/Soft Spot for each? Yes.
      *   Voluntary opening statement? Yes.
      *   One objection to grant fully? Yes.
      *   Killer question analysis? Yes.

  10. **Final Polish:** Check the voice. The Board Chair should sound like a founder (leverage, scale). The Economists should sound academic (identification, priors). The POs should sound operational (relationships, friction).

  *(Final thought on the "Killer Question")*: The user suspects the coordination worry. I need to argue why the "Perpetual Pilot/Option Value" trap is worse. The coordination worry is theoretical; the Perpetual Pilot problem is a practical incentive failure that stops money from ever going to the "doing" phase.

  Let's assemble the sheet.cw
answer: |-
  # Q&A Prep Sheet: EMV Framework Proposal

  **Goal:** Secure pilot approval.
  **Decision Point:** The question period.
  **Strategy:** Trade precision for directionality. Concede modeling uncertainty to defend structural logic.

  ### Part 1: Voluntary Opening (First 2 Minutes)
  *Do not wait for these to be asked. Pre-empt them in your closing remarks before Q&A opens.*

  1.  **The Ranking Flip:** "You will notice this model ranks the Institutional Reform Pilot above the Global Health Delivery program. This is not a claim that health delivery is less *good*. It is a claim that our *marginal* dollar does more work there. If you are uncomfortable with a model that prioritizes leverage over volume, this framework is not for you."
  2.  **The Precision Trap:** "This model produces a number, but that number is not a measurement. It is a structured argument. The inputs for the 'Option Value' and 'Crowding' terms are subjective estimates. I am not asking you to trust the output's precision, but to trust that these variables matter more than the ones currently in the ITN template."
  3.  **The Burden:** "This requires more work from Program Officers upfront. I am proposing we offset this by reducing interim reporting requirements for grants that score high on the 'Saturation' term, trusting the absorption curve rather than micromanaging spend rates."

  ---

  ### Part 2: The Eight Objections

  #### 1. The Retrospective Leverage Test
  **Who:** Board Chair (Software Founder)
  **Phrasing:** "You're selling me on leverage. Walk me through the portfolio from five years ago. If we had run this then, which grant do we kill, and does the counterfactual hold up? If this model would have defunded our biggest success story, I'm not interested in 'better theory,' I'm interested in 'better results.'"
  **Concede Up Front:** "We don't have clean data on counterfactual funding from five years ago, so any backtest involves storytelling."
  **Whiteboard Reply:** Draw two curves. "Five years ago, we funded X. ITN said 'High Importance.' This model asks: 'Was the curve flat or steep?' If the absorption curve was flat, we saturated the area. If we killed X, would someone else have funded it? Likely yes. This model would have shifted that dollar to Y, where the curve was steep. We can't prove Y would have succeeded, but we know X was crowded."
  **Soft Spot:** You cannot prove Y would have succeeded. If X was a massive home run, shifting to Y looks like cowardice in hindsight.

  #### 2. The Identification Problem
  **Who:** Development Economist #1
  **Phrasing:** "You're prioritizing a 'weakly evidenced' pilot over a program with characterized cost-per-outcome. You're substituting model risk for sampling error. Without an RCT or a strong quasi-experimental design on that reform pilot, your 'Expected Value' is just a prior dressed up as a calculation. How do you control for publication bias in your own internal estimates?"
  **Concede Up Front:** "The evidence base for the pilot is thin. That is precisely why the 'Option Value' term is high."
  **Whiteboard Reply:** "ITN treats 'Neglectedness' as a static stock. We treat it as a flow of information. The pilot isn't funded for its direct outcome; it's funded to resolve the parameter uncertainty for the larger commitment. We are buying a real option. In your terms, the Value of Information (VoI) exceeds the Expected Utility of the direct intervention for the next dollar."
  **Soft Spot:** If the pilot fails, you look like you threw money at a guess. If it succeeds, you'll claim the model worked. Asymmetric risk.

  #### 3. The Partner Legibility Issue
  **Who:** Program Officer #1 (Field Experience)
  **Phrasing:** "I have to call a partner in [Region] and tell them we're not renewing because a spreadsheet says the 'saturation discount' is too high. They don't care about our marginal utility curves. They care about stability. This framework makes us look capricious and removes my ability to argue for their specific context."
  **Concede Up Front:** "Transparency with grantees about this formula would be damaging. We shouldn't share the score."
  **Whiteboard Reply:** "Currently, we tell partners we fund based on 'strategic fit,' which is a black box. This gives *us* internal clarity. We don't show them the math; we show them the multi-year commitment that the 'Option Value' term justifies. It actually allows us to promise *more* stability on the pilots we do pick, because we've explicitly valued the long-term learning."
  **Soft Spot:** You are admitting the model is for internal use only, which validates the PO's fear that it disconnects from reality on the ground.

  #### 4. The Parameter Uncertainty Objection
  **Who:** Gov Cost-Benefit Analyst
  **Phrasing:** "Your 'Saturation Discount' relies on an absorption curve projected five years out. What is your confidence interval? If I vary the elasticity of absorption by 10%, does the ranking flip back? If the model is this sensitive to unobservable parameters, the discount rate you're implicitly using is arbitrary."
  **Concede Up Front:** "The confidence intervals will be wide. Point estimates are illustrative."
  **Whiteboard Reply:** Draw a tornado diagram. "ITN has hidden parameters too—implicitly assuming linearity and zero crowding. This model makes the uncertainty explicit. We can run a Monte Carlo on the absorption rate. Even with wide variance, if the mean EMV of the pilot exceeds the health program's *upper bound*, the decision holds. We are comparing distributions, not points."
  **Soft Spot:** You likely haven't actually run the Monte Carlo yet. If pressed for the code/inputs, you'll be exposed.

  #### 5. The Simplicity & Transparency Defense
  **Who:** Board Member (EA/ITN Defender)
  **Phrasing:** "ITN works because a new board member can understand it in ten minutes. This requires a degree in microeconomics. If the logic isn't legible to the people writing the checks, we lose accountability. Are we building a framework for allocation, or a justification for whatever the analysts want to fund?"
  **Concede Up Front:** "ITN is more transparent. This is more accurate."
  **Whiteboard Reply:** "Transparency of a wrong map is not useful. ITN is legible but mis-specified—it treats 'Neglectedness' as absolute, not relative to other funders. We can create a one-page 'driver sheet' that shows the four terms without the math. The complexity is in the calculation, not the decision rule."
  **Soft Spot:** The "driver sheet" will inevitably simplify the math back into something that looks like ITN, defeating the purpose.

  #### 6. The Crowding Counterfactual
  **Who:** Development Economist #2
  **Phrasing:** "The 'Crowding Term' requires you to estimate what other funders would have done. That is unobservable. You are essentially guessing the counterfactual funding landscape. How do you prevent this from becoming a bias where we only fund things we *think* others ignore, regardless of actual impact?"
  **Concede Up Front:** "We cannot observe the counterfactual directly."
  **Whiteboard Reply:** "We use a 'conservative crowding' assumption. If another funder is *active* in the space, we assume they would have scaled unless there is evidence of a specific bottleneck they cannot address (e.g., risk tolerance, time horizon). We document the specific barrier. It shifts the burden of proof from 'Why fund this?' to 'Why would no one else fund this?'"
  **Soft Spot:** This relies on the Analyst's ability to accurately map the funding landscape, which is often opaque.

  #### 7. The Implementation Friction
  **Who:** Program Officer #2 (Field Experience)
  **Phrasing:** "You talk about 'Option Value' and 'Institutional Reform.' These are hard to measure. My team spends 80% of our time trying to metricize the un-metricizable for your reports. This framework incentivizes grants that are impossible to close out. How do we kill a grant if the 'option' expires but the partner is still nice?"
  **Concede Up Front:** "Closing these grants will be harder than standard delivery grants."
  **Whiteboard Reply:** "We build the 'kill switch' into the grant design. The Option Value term is tied to specific milestones of information resolution. If the disagreement isn't resolved by Month 18, the funding stops. We are funding a question, not an organization. The contract reflects that."
  **Soft Spot:** In practice, stopping funding due to "lack of learning" is politically difficult for POs when the partner is doing "good work."

  #### 8. The Discount Rate & Time Horizon
  **Who:** Gov Cost-Benefit Analyst
  **Phrasing:** "You're valuing information that pays off in four years. What is your discount rate? If you use a social discount rate, the present value of that future decision collapses. If you use a financial one, you're misaligned with mission. How are you normalizing time?"
  **Concede Up Front:** "We are using a near-zero discount rate for mission-aligned capital."
  **Whiteboard Reply:** "Foundation capital is perpetual. Unlike government, we don't have a cost of capital tied to tax cycles. We discount for risk, not time. The 'Option Value' is only valid if we have the institutional memory to act on it in year four. That's a risk premium, not a time discount."
  **Soft Spot:** If the Board changes composition in year four, the institutional memory vanishes, rendering the Option Value zero.

  ---

  ### Part 3: The Strategic Concession
  **Which objection to grant in full:**
  **Objection #4 (Parameter Uncertainty).**
  **Why:** The Cost-Benefit Analyst is right. The inputs *are* subjective.
  **How to grant it:** "You are right. The absorption curve is a guess. I cannot give you a tight confidence interval. However, the current model assumes the curve is linear (infinite absorption). That is a stronger, more dangerous assumption. I am asking you to prefer a model with explicit uncertainty over a model with hidden linearity."
  **Why this works:** It disarms the analyst by validating their expertise while framing the status quo as scientifically inferior (hidden assumptions vs. explicit assumptions).

  ---

  ### Part 4: The Killer Question
  **Your Candidate:** The Coordination Worry (Mutual Defunding).
  **My Assessment:** You are worried about a Game Theory equilibrium where everyone waits for everyone else. While theoretically sound, in practice, funders are not rational enough to coordinate on a defection strategy. They are more likely to herd.

  **The Real Killer Question:**
  **Who:** The Board Chair or the EA Board Member.
  **The Question:** **"Does this model create a perpetual pilot program?"**

  **Why this is worse than Coordination:**
  The coordination worry suggests you might miss *one* opportunity. The "Perpetual Pilot" worry suggests your model structurally biases the foundation against *ever* scaling anything.
  If "Option Value" is a term in the equation, then *any* grant that resolves uncertainty scores higher than *any* grant that implements a known solution.
  Since there is always uncertainty to be resolved, and "learning" is cheaper than "doing," your model mathematically favors research, meta-work, and small pilots over direct delivery.
  You risk turning the foundation into a research institute that never deploys capital at scale.

  **How to Prepare:**
  You must define a "Decay Function" for Option Value.
  *   **Reply:** "Option Value decays as information is revealed. Once the disagreement is resolved, the term drops to zero, and the 'Scale-weighted Tractability' term dominates. We are not funding research forever; we are funding research *until* the decision is clear, then we switch to delivery. The model forces a transition."
  *   **Preparation:** Have a slide ready that shows the "Crossover Point" where a pilot's EMV is overtaken by the delivery program's EMV once uncertainty is removed. If you don't have this, the "Perpetual Pilot" objection will kill the proposal.
