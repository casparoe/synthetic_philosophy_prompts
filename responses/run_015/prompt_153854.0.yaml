prompt: |-
  You are a professional philosopher with expertise in moral psychology, the philosophy of action, and the ethics of artificial systems. Please think carefully and systematically about the following problem, and begin with a brief brainstorming of the key conceptual distinctions before offering your final analysis.

  I have been trying to work out my own view of moral responsibility without much formal background, and recently I have been struck by how people respond when an autonomous system or large institution causes harm. Rather than blaming a specific engineer, the anger seems to diffuse across "the company" or "the algorithm" itself. I have started calling this phenomenon "distributed resentment," and I initially assumed it was just a straightforward extension of what P.F. Strawson called reactive attitudes—resentment, indignation, gratitude, and the like scaled up to collective or non-human targets. In my mind, Strawson's central claim was that moral responsibility is constituted entirely by these emotional reactions, so if you can genuinely direct them at a group or an artificial agent, you have automatically shown that the target is a proper subject of moral responsibility.

  But I am now worried that I am running together several different ideas, and I want to check whether my reasoning holds up. I seem to recall that Strawson treated reactive attitudes as essentially non-rational emotional responses, and that adopting the "objective attitude" is the rational corrective we apply when we realize those emotions are unjustified—much as we do with someone suffering from severe mental illness. If that is right, then collective blame looks doubly suspect: not only is it unclear how an emotion can be directed at an institution, but any emotional reaction to a group might just be an irrational holdover that the objective attitude should dissolve. So my confusion is this: does Strawson's framework allow for any coherent form of collective or institution-directed blame, or does his distinction between reactive and objective attitudes actually show that "distributed resentment" is a conceptual mistake? And if reactive attitudes are not merely irrational feelings but something more integral to interpersonal life, how should that change my assessment of whether algorithms or corporations can ever be appropriate targets?

  Please clarify what Strawson actually meant by reactive attitudes versus the objective attitude, correct the misunderstandings embedded in my reasoning about rationality and collective targets, and address whether there is any legitimate place for my idea of distributed resentment within his interpersonal framework—or whether applying reactive attitudes to groups and synthetic systems necessarily violates the logic of his view.
