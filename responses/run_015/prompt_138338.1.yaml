answer: |-
  The branching question that does the most diagnostic work is whether the net sum of well-being dictates moral obligation in the **Standard Monster** case.

  **Ground:** Individual well-being is morally relevant.

  *   **Q1:** Is the psychology of the **Standard Monster**—a being whose capacity for utility dwarfs ours—nomologically possible?
      *   **No:** **Empirical Dismissal**
      *   **Yes:** **Q2:** In the **Standard Monster** case, is maximizing the net sum of well-being morally obligatory?
          *   **No:** **Q3:** Is the prohibition against aggregation grounded in optimal social rules or individual inviolability?
              *   **Optimal Rules:** **Rule-consequentialist Self-effacement**
              *   **Individual Inviolability:** **Q4:** Is the constraint against sacrificing others absolute or threshold-based?
                  *   **Threshold-based:** **Sufficientarian and Lexical-threshold Views**
                  *   **Absolute:** **Nozickian Side-constraints**
          *   **Yes:** **Q5:** In the **Reverse Monster** case, do units of suffering outweigh units of enjoyment regardless of sum?
              *   **Yes:** **Negative or Suffering-focused Views**
              *   **No:** **Q6:** In the **Archival Monster** case, does bringing a happy being into existence increase value if it lowers the average well-being?
                  *   **No (Average Matters):** **Average Utilitarianism**
                  *   **Yes (Total Matters):** **Q7:** In **The Swarm** case, do claims aggregate linearly regardless of the recipients' baseline well-being?
                      *   **No (Baseline Matters):** **Prioritarianism**
                      *   **Yes (Linear):** **Q8:** In the **Reluctant Monster** case, is the justification for aggregation that it mirrors rational choice under uncertainty?
                          *   **Yes:** **Harsanyi-style Aggregation**
                          *   **No (Intrinsic Value):** **Total Utilitarianism Biting the Bullet**

  ***

  **Unoccupied Combinations:**
  *   **Empirical Dismissal + Total Utilitarianism:** *Incoherent* (the theory requires the possibility of the case to generate the obligation).
  *   **Nozickian Side-constraints + Average Utilitarianism:** *Unattractive* (rights-based deontology rarely combines with population-averaging consequentialism).

  **Inseparable Leaves:**
  *   **Harsanyi-style Aggregation** and **Total Utilitarianism** are not separated if preference utility coincides with experienced utility.
      *   *Diagnosis:* Merely unclaimed (contingent on psychology).
      *   *Further Case:* The "Misery Lover"—a being whose satisfied preferences systematically reduce their experienced welfare.
