      *   *Correction:* Actually, if they say "one," it *does* constrain the proxy function. If "gavagai" meant "rabbit stage," counting stages might yield many. But if they count "one," it implies a sortal that individuates the whole. Quine argues proxy functions can be adjusted to match counting too (mapping the number 1 to the set of stages). So, philosophically, the user's intuition that "one settles nothing" is more Quinean than "two settles it." However, for a *field linguist*, "two" is stronger evidence of difference than "one" is of sameness. I need to nuance this.

  6.  **Address the Bilingual (Case 6):**
