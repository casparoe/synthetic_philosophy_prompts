  8.  **Address the Friend's Objection:**
      *   "Armchair fantasy."
      *   *Verdict:* Partially true, partially false. Field linguists don't worry about "rabbit vs. rabbit stage" in practice because it doesn't affect communication. But the *theoretical* limit is real. It matters for the *novel* because it's about the narrator's internal crisis, not fieldwork protocol.

