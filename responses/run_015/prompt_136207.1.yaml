  3.  **Evaluate the User's Tentative Proposal:**
      *   *Proposal:* "A term's application is as determinate as the community's dispositions to project it to novel cases and the generalizations it figures in jointly make it, and where these run out there is nothing to be right about."
      *   *Assessment:* This is essentially a Quinean behaviorist + pragmatic view. It's solid. It handles Cases 1, 2, 4, 5 well. It struggles slightly with 3, 6, and 7.

  4.  **Develop the Philosophical Framework (The "Real Article"):**
      *   Need to avoid Quine caricature. Quine isn't saying "anything goes." He's saying "empirical evidence underdetermines theory."
