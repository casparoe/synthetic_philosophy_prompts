  1. A mark out of 20, with a brief mark-per-part breakdown.

  2. Point-by-point comments keyed to the parts and, where useful, to particular sentences that you quote from the answer. For each problem you find, say (i) what exactly the candidate is claiming, (ii) why it is wrong — or merely loose — and (iii) what the correct or more careful treatment would be. Rank the problems, distinguish genuine mistakes from formulations that are merely imprecise or controversial-but-defensible, and say which genuine mistakes cost the most marks.

  3. Explicit credit for what the candidate gets right, including anything that would earn full marks in a stronger answer.

  4. A one-paragraph overall comment of the sort I could paste directly into the marking sheet and return to the candidate.

  Two policy notes. Charity towards controversial-but-defensible claims is appropriate; misdescribing a view is not. Do not reward fluency, confidence, or length, and do not penalise the candidate for taking a side in part (d) — only for how well the side is argued for.
