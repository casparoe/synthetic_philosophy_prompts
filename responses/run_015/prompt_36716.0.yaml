prompt: |-
  I teach an upper-level seminar on personal identity, and this term a colleague in our medical school has asked me to guest-lecture on Ulysses contracts — the psychiatric advance directives under which a patient, while lucid and competent, instructs clinicians to administer treatment during a future episode of psychosis or mania even if the patient then refuses it. I know the standard bioethics framing well enough: precedent autonomy, substituted judgment, and so on. What I want is a different kind of analysis. Legal systems and hospital policies that enforce these directives seem to me to be doing metaphysics without admitting it, and I'd like you to help me reconstruct the implicit theory of the self that the practice presupposes. Specifically: when a tribunal honors the lucid patient's instruction against the refusing patient's contemporaneous dissent, what account of personal identity makes that anything other than one person issuing commands about what may be done to a different person? Is the practice best read as presupposing psychological continuity (the earlier and later patient are one subject because their mental states are causally and qualitatively connected), narrative continuity on something like Dennett's model (the directive identifies the self as a center of narrative gravity, and the psychotic episode is a chapter that the narrator is best placed to interpret), or some further view on which the current patient's refusal carries weight that the earlier author was entitled to discount?

  I'd also like you to confront an asymmetry that has always puzzled me, and that my medical students will surely raise. We are fairly comfortable enforcing advance refusals — a patient who stipulates while competent that she not be force-fed once demented, even if the later patient appears content and wants to eat — but considerably less comfortable enforcing advance requests, where the later patient competently-seeming resists treatment the earlier self demanded. Some jurisdictions and hospital policies formalize this by making advance refusals more binding than advance requests. My suspicion is that this asymmetry, if it is principled, has to rest on some substantive view about which self counts, or about what happens to the "self" when the narrative breaks down — perhaps something like the thought that in late-stage dementia the biographical subject has already gone, whereas during a psychotic episode there is a partially intact subject present whose dissent matters. I don't know whether that thought can be made coherent, or whether it just restates the asymmetry in fancier language.

  So here is what I'd like from you. First, reconstruct the implicit theory (or theories) of the self that the practice of enforcing Ulysses contracts presupposes, being careful to distinguish what the practice strictly requires from what it merely sits comfortably with — I want to know where the practice is philosophically underdetermined, such that several rival accounts of personal identity would license it equally. Second, say what Dennett's narrative-gravity picture would actually predict here: does the "center of narrative gravity" metaphor give us a principled way to privilege the lucid author's instruction over the psychotic patient's refusal, or does it in fact make the privileging look arbitrary, since both selves are equally characters in the same unfolding story? Third, tell me whether the asymmetry between advance refusals and advance requests can be justified within any single consistent account of the self, or whether it reveals that the practice is relying on shifting, incompatible commitments — for instance, treating the later demented patient as nobody at all in one case while treating the later psychotic patient as a full subject in another. And finally, if you think no theory of personal identity can ground the practice, say what a coherent policy would have to change, and what it would have to appeal to instead. I should mention that the audience for the eventual lecture is physicians and law students, so while the analysis should be philosophically rigorous, it should stay tethered to the concrete features of the practice — capacity assessments, the doctrine that competent refusals are normally inviolable, the fact that these directives typically concern treatment, not confinement. I'd rather not have a survey of the literature; I want an argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor teaching an upper-level seminar on personal identity.
      *   **Task:** Guest lecture for medical students/law students on Ulysses contracts (psychiatric advance directives).
      *   **Goal:** Move beyond standard bioethics (precedent autonomy) to an implicit *metaphysics of the self*.
      *   **Specific Questions:**
          1.  Reconstruct the implicit theory of the self presupposed by enforcing Ulysses contracts (distinguish what's required vs. compatible).
          2.  Apply Dennett's "center of narrative gravity" model: Does it privilege the lucid author or make it arbitrary?
          3.  Analyze the asymmetry between advance *refusals* (dementia) and advance *requests* (psychosis): Can one consistent account of the self justify both, or does it reveal shifting commitments?
          4.  If no theory grounds it, what would a coherent policy look like (and what would it appeal to instead)?
      *   **Constraints:** Philosophically rigorous but tethered to concrete practice (capacity, inviolable refusal, treatment vs. confinement). No literature survey; want an *argument*.
      *   **Audience:** Physicians and law students (needs clarity, practical relevance).

  2.  **Deconstruct Question 1: Implicit Theory of the Self in Ulysses Contracts.**
      *   *Standard View:* Precedent Autonomy (Dworkin). This assumes the "then-self" and "now-self" are the same moral agent.
      *   *Metaphysical Underpinning:* To bind the future self, there must be identity.
      *   *Psychological Continuity (Locke/Parfit):* Usually, this requires connectedness (memory, character). Psychosis breaks this. So, strict psychological continuity *doesn't* support Ulysses contracts well if the break is severe.
      *   *Biological/Animalist View (Olson):* You are the organism. The organism persists through psychosis. This supports enforcement easily but ignores the *mental* nature of the directive (why care about the *lucid* mind's wish?).
      *   *The "True Self" View:* The practice assumes the lucid self is the *authentic* self, and the psychotic self is a corrupted version. This isn't strict identity; it's normative identity.
      *   *Conclusion:* The practice doesn't *require* strict metaphysical identity. It requires a *normative hierarchy* of selves. It sits comfortably with Animalism (same body) but *needs* a theory of authenticity to explain why the *past* mind rules the *present* mind. It is underdetermined metaphysically but overdetermined normatively.

  3.  **Deconstruct Question 2: Dennett's Narrative Gravity.**
      *   *The Metaphor:* The self is a fiction, a center of narrative gravity.
      *   *Application:* Who is the author? The lucid patient constructs the narrative arc. The psychotic episode is a disruption.
      *   *Problem:* If the self is just the story, and the psychotic patient is telling a *different* story (delusions), why privilege the old story?
      *   *Dennett's likely take:* The "center of gravity" is determined by the interpreter (society/clinicians). We privilege the lucid narrative because it coheres with the broader web of social interaction and long-term planning.
      *   *Verdict:* It doesn't solve the metaphysical problem; it shifts it to a pragmatic one. It makes the privileging look less arbitrary *socially*, but metaphysically, both are "centers of gravity." However, the lucid one has *traction* with the external world.
      *   *Refinement:* Dennett helps explain *why* we pick the lucid self (coherence), but it admits the "self" is a construct. This undermines the idea that we are respecting a "real" person's rights; we are maintaining a social fiction.

  4.  **Deconstruct Question 3: The Asymmetry (Refusal vs. Request).**
      *   *The Phenomenon:* We honor "Don't feed me" (dementia) but hesitate on "Force me" (psychosis).
      *   *Standard Bioethics:* Harm principle. Force-feeding is invasive; giving antipsychotics is invasive. Wait, usually, we *do* force treatment in psychosis based on Ulysses. The prompt says we are *less* comfortable enforcing advance *requests* (force me) than refusals (don't force me).
      *   *The User's Suspicion:* In dementia, the biographical subject is gone (so the prior wish stands). In psychosis, the subject is present but distorted (so current dissent matters).
      *   *Analysis:*
          *   If we use Psychological Continuity: Dementia breaks it more than psychosis? Maybe.
          *   If we use Authenticity: The dementia patient's current desire to eat is "inauthentic" (brain disease). The psychotic patient's refusal is also "inauthentic" (brain disease). Why the difference?
          *   *The Real Reason:* It's not metaphysics; it's *harm avoidance* and *status quo bias*. Letting someone die (honoring refusal) is passive. Forcing treatment (honoring request) is active.
          *   *Metaphysical Inconsistency:* Yes, it reveals shifting commitments. In refusal cases, we treat the past self as the "real" one (critical interests). In request cases, we treat the present self's suffering as morally weighty (experiential interests).
          *   *Verdict:* The asymmetry cannot be justified by a *single* consistent account of the self. It relies on switching between "The Self as Biography" (for refusals) and "The Self as Suffering Subject" (for requests).

  5.  **Deconstruct Question 4: If No Theory Grounds It, What Then?**
      *   *Premise:* Personal identity metaphysics is the wrong tool.
      *   *Alternative:* Relational Autonomy or Stewardship.
      *   *Policy Change:* Stop pretending we are solving an identity puzzle. Acknowledge we are making a *triadic* decision (Past Self, Present Self, State).
      *   *Coherent Policy:* Focus on *capacity thresholds* at the time of enforcement, not just the signature. Or, shift to a "Ulysses *Clause*" (reviewable) rather than a "Contract" (binding).
      *   *Appeal to:* Best interests + Prior values, weighted dynamically. Not "Who is this?" but "What minimizes harm while respecting the life project?"

  6.  **Drafting the Argument (Iterative refinement for tone and audience):**
      *   *Tone:* Academic but accessible. Rigorous but practical.
      *   *Structure:* Follow the four prompts exactly.
      *   *Key Insight:* The practice isn't doing metaphysics; it's doing *moral status allocation* disguised as metaphysics.
      *   *Refining the Dennett section:* Make sure to highlight that if the self is a narrative, the psychotic break is a *genre shift*. The lucid self is the "editor."
      *   *Refining the Asymmetry:* This is the crux. The "Critical vs. Experiential Interests" distinction (Dworkin) is the standard bioethics answer, but the user wants the *metaphysical* implication. The implication is that we treat the dementia patient as a "shell" (no current self) and the psychotic patient as a "hostage" (current self exists but is compromised). This is inconsistent.

  7.  **Final Polish:**
      *   Check against constraints: No literature survey. Tethered to capacity/policy.
      *   Ensure the distinction between "required" and "compatible" is clear in section 1.
      *   Make sure the conclusion offers a constructive path forward for the physicians/lawyers.

  8.  *(Self-Correction during drafting)*: I need to be careful with the asymmetry claim. In many jurisdictions, Ulysses contracts *are* enforced for requests (force treatment). But the prompt says clinicians are *less comfortable* with it. I must address the *comfort level/moral intuition*, not just the black-letter law. The intuition is the philosophical data point here.
      *   *Correction:* Acknowledge that Ulysses contracts *do* exist for treatment requests, but the *resistance* to them highlights the metaphysical tension. The prompt asks about the *asymmetry* in comfort/policy (e.g., living wills for end-of-life vs. psych directives). I will focus on the *moral weight* given to current dissent.

  9.  *(Final check on Dennett)*: Does Dennett privilege the author? Dennett is anti-essentialist. He would say the "author" is also a character. I need to be careful not to attribute too much realism to the "author" in Dennett's view. The privilege comes from *social utility*, not metaphysical priority.

  10. *(Final check on Asymmetry)*: The user suspects: Dementia = subject gone; Psychosis = subject present. I need to validate if this holds water. In dementia, we often say "they aren't themselves." In psychosis, we say "they aren't thinking clearly." It's a difference of *degree of rupture*. But is it principled? I will argue it is *not* principled metaphysically, but pragmatic.

  11. *(Final Plan)*:
      *   Intro: Acknowledge the "metaphysics without admitting it" insight.
      *   Section 1: The Implicit Metaphysics (Animalism + Normative Authenticity).
      *   Section 2: Dennett (Narrative as Social Coherence, not Metaphysical Truth).
      *   Section 3: The Asymmetry (Inconsistent Ontologies).
      *   Section 4: The Way Forward (Stewardship over Identity).

