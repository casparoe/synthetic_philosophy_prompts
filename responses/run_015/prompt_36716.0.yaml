answer: |-
  This is a profound insight: that clinical and legal practices regarding Ulysses contracts are engaging in applied metaphysics while claiming to engage only in risk management. When a tribunal enforces a directive signed by a lucid patient against the vocal dissent of a psychotic patient, they are not merely balancing risks; they are ruling on *who is there*.

  Here is an analysis structured for your lecture, designed to move physicians and law students past standard bioethical platitudes into the ontological commitments their policies actually carry.

  ### 1. The Implicit Metaphysics: Animalism with a Normative Overlay

  You asked what theory of personal identity the practice *requires* versus what it merely *sits comfortably with*. The uncomfortable truth is that the practice is metaphysically underdetermined. It does not strictly require a specific theory of identity, but it covertly relies on a theory of *authenticity*.

  **What is not required:**
  The practice does *not* require strict Psychological Continuity (Locke/Parfit). If personal identity consisted solely in the connectedness of memories, beliefs, and character traits, a severe psychotic break or advanced dementia would constitute the death of the person who signed the directive. If the patient in the throes of mania has no memory of the directive, holds delusional beliefs contrary to their prior values, and exhibits a radically altered temperament, psychological continuity is severed. If the law relied strictly on this metaphysics, enforcing the directive would be morally equivalent to enforcing the will of a dead person upon a living stranger.

  **What sits comfortably with it:**
  The practice sits most comfortably with **Animalism** (you are your biological organism). The organism that signed the paper is the organism being injected. This secures numerical identity effortlessly. However, Animalism alone cannot justify the *authority* of the past mind over the present mind. Being the same animal explains why we can touch the patient, but not why we should listen to the past patient rather than the present one.

  **The Actual Presupposition:**
  To bridge the gap, the practice presupposes a **Normative Theory of the True Self**. It assumes that the "person" is not the momentary locus of consciousness, but the extended project of a life. It posits that the lucid self is the *authentic* self, and the psychotic self is a *corrupted* or *usurped* version.
  *   **Metaphysical Commitment:** The practice treats the psychotic episode not as a *different person*, but as the *same person under duress of pathology*.
  *   **The Hidden Move:** This is not a metaphysical claim about identity; it is a normative claim about *authority*. The policy assumes that capacity is the gateway to moral sovereignty. When capacity is lost, sovereignty reverts to the last competent configuration of that sovereignty.
  *   **Underdetermination:** You could justify this via Psychological Continuity (if you argue the "deep values" persist even if surface beliefs change) or Animalism (if you argue the organism's long-term welfare is the metric). The practice works because it doesn't pin down *why* the selves are the same, only that the *lucid* self has administrative rights over the *ill* self.

  ### 2. Dennett's Center of Narrative Gravity: Editor vs. Character

  Daniel Dennett's model suggests the self is a "center of narrative gravity"—a fiction generated by the brain to organize experience and social interaction. How does this apply to Ulysses contracts?

  **The Prediction:**
  On a Dennettian view, both the lucid signer and the psychotic refuser are "characters" in the same unfolding narrative. Neither is the "real" self in a substantial sense; both are abstractions. However, Dennett's view is deeply pragmatic. The "center of gravity" is determined by where the story coheres best with the wider web of social and physical reality.

  **Does it privilege the Lucid Author?**
  Yes, but not metaphysically. It privileges the lucid self *editorially*.
  *   The lucid directive represents the "macro-narrative" of the life (career, relationships, long-term health).
  *   The psychotic refusal represents a "micro-narrative" or a genre shift (a thriller or horror chapter) that is incoherent with the rest of the book.
  *   **The Verdict:** Dennett's model justifies enforcement not because the lucid self is *more real*, but because the lucid self is the *Editor* of the life-story, while the psychotic self is a *Character* undergoing a plot twist. We privilege the Editor because the Editor maintains the coherence of the book.

  **The Trap:**
  However, this makes the privileging look arbitrary if we take the metaphor seriously. If the self is *only* the story, and the psychotic patient is telling a vivid, compelling, albeit delusional story *right now*, why does the old story win?
  *   **For your students:** The Dennett model reveals that enforcing a Ulysses contract is an act of **narrative imperialism**. We are imposing the coherence of the past narrative onto the fragmentation of the present experience. It is not that the present self "doesn't count"; it is that its narrative lacks *social traction*. The policy privileges the story that allows the patient to remain a functional agent in the social world, rather than the story that isolates them in delusion.

  ### 3. The Asymmetry: Inconsistent Ontologies

  This is the crux of your second concern. We honor advance *refusals* (e.g., "Do not feed me if demented") even if the demented patient wants to eat, but we hesitate to honor advance *requests* (e.g., "Force me if manic") when the manic patient refuses.

  **The Standard Bioethical Defense:**
  Bioethicists usually justify this via the distinction between *critical interests* (long-term values) and *experiential interests* (current pleasure/pain). We prioritize critical interests in refusals to prevent indignity, but we prioritize experiential interests in requests to prevent suffering.

  **The Metaphysical Exposure:**
  Your suspicion is correct: this asymmetry reveals shifting, incompatible ontological commitments.
  *   **In the Refusal Case (Dementia):** We treat the current demented patient as a **Shell**. We act as though the biographical subject has *ceased to exist*, leaving only a biological entity that must be governed by the ghost of the past. The current desire to eat is dismissed as a reflex, not a choice.
  *   **In the Request Case (Psychosis):** We treat the current psychotic patient as a **Hostage**. We act as though the biographical subject is *still present* but compromised. Their refusal is treated as a symptom, yes, but their suffering is treated as *their* suffering. We hesitate to force treatment because we feel we are violating a subject who is "in there."

  **Can this be made coherent?**
  No, not within a single account of the self.
  *   If the demented patient is "gone" (justifying the refusal), then the psychotic patient should also be "gone" (or at least their dissent should carry no weight), justifying the enforcement of the request.
  *   If the psychotic patient's dissent matters because they are a "present subject" (undermining the request), then the demented patient's desire to eat should matter because they are a "present subject" (undermining the refusal).

  **The Real Justification:**
  The asymmetry is not metaphysical; it is **deontological and pragmatic**.
  1.  **Action vs. Omission:** Honoring a refusal is letting nature take its course (omission). Honoring a request for forced treatment is active intervention (action). The law and medicine are more wary of active harm.
  2.  **The Harm Principle:** In dementia, force-feeding is seen as a violation of bodily integrity for a being that cannot comprehend the benefit. In psychosis, *not* treating is seen as allowing harm to a being that might recover comprehension.
  3.  **Conclusion for Students:** The asymmetry admits that we do not actually know "who" the patient is. Instead, we are managing *our own liability* and *moral risk*. We treat the demented patient as "dead enough" to let them go, but the psychotic patient as "alive enough" that we fear hurting them. This is not a consistent theory of identity; it is a consistent theory of caution.

  ### 4. If Identity Fails, What Grounds the Policy?

  If no theory of personal identity can ground the practice without contradiction (as the asymmetry suggests), a coherent policy must stop appealing to identity and start appealing to **Stewardship**.

  **What must change:**
  1.  **Abandon the "Contract" Metaphor:** A contract implies two binding parties. Here, there is one organism and two conflicting states of consciousness. Calling it a "contract" misleads clinicians into thinking they are solving a legal puzzle rather than making a welfare judgment.
  2.  **Shift from "Binding" to "Presumptive":** The directive should not be an inviolable command from the Past Self. It should be treated as high-quality evidence of the patient's values, weighted against the *current* patient's distress.
  3.  **Capacity at Enforcement:** The policy must require a capacity assessment *at the time of enforcement*, not just at the time of signing.
      *   *Current Practice:* "You signed this when competent, so you are bound."
      *   *Coherent Practice:* "You signed this when competent. Now that you are incompetent, we will use this to guide our stewardship of your welfare, but we will not ignore your current distress unless it poses a catastrophic threat to your life-project."

  **What to appeal to instead:**
  Appeal to **Relational Autonomy**. The patient is not an isolated metaphysical substance. They are a node in a network of relationships (family, clinicians, society).
  *   The decision is not "Which self is real?"
  *   The decision is "Which decision best preserves the patient's place in the network of care and value?"
  *   Sometimes, honoring the lucid directive preserves that place (preventing permanent institutionalization). Sometimes, honoring the current refusal preserves it (preventing trauma that destroys trust).

  **For the Lecture:**
  Tell your medical and law students this: *You are not metaphysicians. You cannot solve the problem of personal identity.* When you enforce a Ulysses contract, you are not respecting the "true self." You are making a wager that the *life-story* is more valuable than the *momentary experience*. That is a noble wager, but do not disguise it as science or logic. Acknowledge that you are overriding a present human being's will based on a bet about who they *would have been*. That requires humility, not just a signature.

  The coherent policy is one that admits the tragedy: that sometimes, to care for the person, you must violate the subject. No theory of identity makes that easy; it only makes it honest.
