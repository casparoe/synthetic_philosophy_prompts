prompt: |-
  I'm a distributed-systems engineer fluent in graceful degradation, cascading failures, failover clusters, sharding, legacy migration, technical debt, and backward compatibility. I want you to restate the archaeological and anthropological debate about societal 'collapse' — specifically the Late Bronze Age eastern Mediterranean, the Classic Maya lowlands, and Easter Island — entirely within that vocabulary. Treat political economies as distributed architectures, resource flows as traffic, institutional hierarchies as service meshes, and cultural continuity as backward compatibility. For each of the three cases, describe the transformation in these terms: was it a cascading failure, a graceful degradation to a simpler topology, an intentional sharding of a monolithic state, or a managed legacy migration? Then give me the residue report: which historical observations translate cleanly into systems language, which must be distorted to fit (for instance, treating ritual authority as a load-balancer or treating demographic movement as node migration), and which have no counterpart at all — especially normative judgments about whether people experienced these changes as catastrophe, liberation, or routine maintenance, and whether a society that changes its architecture has 'failed' at all. Is the missing residue a defect in my framework's inability to represent meaning and agency, or does it reveal that 'collapse' is an observer-imposed label on continuous topological change? In your answer, separate what is broadly settled among specialists — such as the depopulation of Classic Maya urban centers or the deforestation of Easter Island — from what remains genuinely contested, including whether these processes represent societal failure, political decentralization, or ecological adaptation. Do not present any single interpretive model — ecological determinist, purely political, or otherwise — as the consensus. Do not provide citations, bibliographies, or source lists; I want only the conceptual translation. Keep the analysis formal and precise, and please separate settled findings from genuinely contested interpretations rather than treating a disputed view as established.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** Distributed-systems engineer (fluent in specific terminology: graceful degradation, cascading failures, failover clusters, sharding, legacy migration, technical debt, backward compatibility).
      *   **Task:** Restate the archaeological/anthropological debate about societal 'collapse' (Late Bronze Age, Classic Maya, Easter Island) using distributed systems vocabulary.
