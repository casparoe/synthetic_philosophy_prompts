  6.  **Final Polish:** Check against the prompt's constraint: "Do not provide citations... Keep the analysis formal and precise." (Proceed to generate output based on these thoughts).

  *(Self-Correction on Easter Island)*: I need to be careful not to present the "Ecocide" theory as settled. It is highly contested. The settled part is deforestation and statue building cessation. The contested part is whether this led to societal collapse before European contact. I will frame the systems analogy to reflect this uncertainty (e.g., was it a crash or a patch?).

