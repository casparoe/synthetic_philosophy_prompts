      *   **Residue Report:** Analyze what translates well, what is distorted, and what has no counterpart (specifically normative judgments/agency).
      *   **Core Question:** Is the missing residue a framework defect or evidence that 'collapse' is an observer-imposed label?
      *   **Constraints:** Separate settled findings from contested interpretations. Do not present single models as consensus. No citations/bibliographies. Formal and precise tone.

  2.  **Deconstruct the Vocabulary & Mappings:**
      *   *Distributed Architecture:* The society itself (nodes = settlements/groups, edges = trade/social ties).
      *   *Traffic:* Resources (food, goods, people, information).
      *   *Service Mesh:* Institutions (religion, bureaucracy, kingship) managing requests and routing.
      *   *Backward Compatibility:* Cultural continuity (language, rituals, identity persisting despite structural change).
      *   *Cascading Failure:* Systemic collapse where one node failure triggers others.
      *   *Graceful Degradation:* Functionality reduces but core services remain (e.g., urban to rural).
      *   *Sharding:* Splitting a monolithic state into smaller, independent clusters.
      *   *Legacy Migration:* Moving from old systems to new ones (often messy).
      *   *Technical Debt:* Accumulated structural inefficiencies (inequality, environmental strain).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the framework. Set the stage for the translation.

      *   **Case Study 1: Late Bronze Age Eastern Mediterranean (c. 1200 BCE):**
          *   *Settled:* Major urban centers depopulated, trade networks disrupted, literacy lost in some areas.
          *   *Contested:* Cause (Sea Peoples, earthquake, system complexity), nature of the end (collapse vs. transformation).
          *   *Systems Translation:* Highly coupled monolithic architecture. Interdependent trade (traffic).
          *   *Classification:* Cascading Failure. High coupling meant local faults propagated globally.
          *   *Nuance:* Some nodes survived (failover), but the mesh broke.

      *   **Case Study 2: Classic Maya Lowlands (c. 800-950 CE):**
          *   *Settled:* Southern lowland cities abandoned, monumental construction ceased, population declined in specific regions. Northern lowlands persisted.
          *   *Contested:* Drought vs. Warfare vs. Political legitimacy. Was it total collapse or political restructuring?
          *   *Systems Translation:* Federated cluster architecture. High redundancy between city-states.
          *   *Classification:* Graceful Degradation / Sharding. The "divine king" service failed, but the population migrated to other clusters (North/Coast).
          *   *Nuance:* The protocol (culture) remained backward compatible even if the admin layer (kings) was deprecated.

      *   **Case Study 3: Easter Island / Rapa Nui (Pre-Contact):**
          *   *Settled:* Deforestation occurred, statue building stopped, population changed.
          *   *Contested:* Ecocide vs. Resilience. Did they starve or adapt? Did Europeans cause the real crash?
          *   *Systems Translation:* Isolated cluster. Finite resources.
          *   *Classification:* Managed Legacy Migration (if viewing adaptation) or Resource Exhaustion leading to Hard Shutdown (if viewing ecocide). Let's lean towards the contested nature: Is it a failure or a reconfiguration?
          *   *Refinement:* Recent archaeology suggests resilience. So, perhaps "Resource Constrained Re-architecture."

      *   **Residue Report (The Critical Analysis):**
          *   *Clean Translations:* Network topology, resource bottlenecks, interdependency risks.
          *   *Distorted Translations:* Ritual authority as load-balancer (reduces meaning to utility), Demographic movement as node migration (ignores trauma/coercion).
          *   *No Counterpart:* Agency, Meaning, Normative judgment (was this *bad*?).
          *   *The Core Question:* Is 'collapse' a bug or a feature? It's likely an observer label. The system continues, just with different SLAs (Service Level Agreements).

      *   **Settled vs. Contested Separation:** Ensure this is explicit in every section and the conclusion.

  4.  **Refining the Tone:**
      *   Must sound like an engineer talking to an engineer. Use terms like "latency," "throughput," "coupling," "single point of failure," "deprecation."
      *   Avoid romanticizing or moralizing. Keep it clinical.
      *   Ensure the distinction between *settled archaeology* (bones, dates, pollen) and *interpretive models* (why it happened, was it bad) is sharp.

  5.  **Self-Correction/Review during Drafting:**
