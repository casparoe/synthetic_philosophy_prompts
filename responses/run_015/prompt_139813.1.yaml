          *   *Slavery/Indigenous:* The ledger counts "produce," not welfare. Slavery is inefficient (coercive labor), so he critiques it economically, but doesn't center the moral horror in the *imperial* ledger. Indigenous land is "waste" until cultivated (Lockean proviso). This is a structural silence.
