  *Refining the "Method" section:* I need to make sure I explicitly say why I'm not doing the alternatives as per prompt instructions. I did that in the draft ("This project will not commission new surveys...").
  *Refining the "Closing":* Ensure it's honest about failure.
  *Refining the "Brainstorming":* Ensure it's distinct and meets the word count.

  *Final Review against constraints:*
  - Brainstorming paragraph at start? Yes.
  - 150 words max on brainstorming? Yes.
  - Two-page proposal feel? Yes.
  - Mixed committee audience (jargon-free)? Yes.
  - No bibliography/citations? Yes.
  - Specific sections included? Yes.

