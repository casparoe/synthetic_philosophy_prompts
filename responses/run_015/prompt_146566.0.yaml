      *   *Framing 2: Game Theory/Goodhart's Law.* Focus on strategic interaction between countries optimizing ranks. *Cost:* Too abstract/economic, ignores the normative question of *should* we steer by this.
      *   *Framing 3: Measurement-Targeting Feedback (Selected).* Focus on how targeting changes the measurement properties themselves. *Cost:* Requires careful conceptual modeling. *Benefit:* Sharpest question because it addresses the specific ministerial request while exposing the structural flaw in ranking-based targets.
      *   *Drafting the paragraph:* Need to keep it under 150 words.

  3.  **Drafting the Proposal:**
