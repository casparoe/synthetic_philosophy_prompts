          *   *Imported:* The assumption that "superrational" allows randomization. Hofstadter sometimes waffled on this, but in the lottery context, he accepted $1/n$.
          *   *Residue:* Convergence/Coordination. In distributed systems, $1/n$ maximizes success probability *ex-ante*. But without a shared random source (common coin), independent randomization leads to collisions. Superrationality assumes the *reasoning* correlates the randomness (logical correlation of random seeds?), which is technically impossible without shared state or communication in standard models. This is a big gap.

      *   **Case 3: Asymmetric Lottery (Values $v_i$).**
          *   *Translation:* Input-indexed algorithms. $P(i, \vec{v})$.
          *   *Clean:* The setup is standard.
          *   *Imported:* The Welfare Functional. Superrationality demands a unique "best" joint outcome. With asymmetric payoffs, $(C, C)$ in PD becomes "Who sends?" in Lottery. Is it MaxSum? MaxMin? Nash Bargaining?
          *   *Residue:* Selection. Program Equilibrium Folk Theorem says *any* of these are supportable. Superrationality claims one is *the* rational choice. The vocabulary has no tool to select the social welfare function without external axioms. Hofstadter assumes symmetry of *reasoning* implies symmetry of *outcome valuation*, which fails when $v_i$ differ.

      *   **Case 4: Perturbations (Labels & Byzantine).**
          *   *Subcase 4a (Labels):*
              *   *Translation:* Symmetry breaking via IDs.
              *   *Clean:* Standard distributed algo.
              *   *Imported:* Does using an ID violate "superrationality"? Hofstadter implies reasoning is identical. If IDs are arbitrary, $P(ID_i)$ differs from $P(ID_j)$ in output, but the *code* is the same. This fits "input-indexed."
              *   *Residue:* Salience. Why pick the highest ID? Superrationality needs a canonical ordering.
          *   *Subcase 4b (Fraction $q$ Superrational):*
              *   *Translation:* Byzantine/Fault tolerance. $k$ honest, $n-k$ rational/defectors.
              *   *Clean:* Robustness analysis.
              *   *Imported:* Knowledge of $q$.
              *   *Residue:* The definition of "Superrational" breaks. If I am superrational, I assume others reason like me. If I know some *don't*, do I still correlate with the superrational subset? This becomes a mechanism design problem (implementing social choice with partial compliance), not a decision theory problem. The "logical correlation" assumption fractures.

  5.  **Synthesizing the Residue Report (The Verdict):**
      *   *Suspicion:* Superrationality = Coordination/Selection principle disguised as Rationality.
      *   *Counter-argument:* It highlights a gap in standard game theory/distributed systems regarding *normative* constraints on equilibrium selection.
      *   *Synthesis:* The user's vocabulary is descriptive (what *can* be implemented). Superrationality is prescriptive (what *should* be chosen). The residue is the "Ought."

  6.  **Refining the Tone:**
      *   Must be technical, precise, and respectful of the user's expertise.
      *   Avoid philosophical fluff unless translated into CS/Game Theory terms.
      *   Strictly adhere to the "Clean/Imported/Residue" structure for each case.
      *   Ensure the "Flagging" requirement is met (explicitly stating where I'm making a choice for Hofstadter).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I handle the randomization in Case 2 correctly? In distributed systems, independent coins don't correlate. Hofstadter's superrationality implies a "logical" correlation of random choices. This is the "Common Randomness" problem. I need to highlight that standard program equilibrium with private randomness doesn't guarantee the $1/n$ success rate without a shared seed.
      *   *Check:* Case 3 is the crux. The Folk Theorem is the killer here. It proves *existence* of equilibria, not *uniqueness*. Superrationality claims uniqueness. I must emphasize this gap.
      *   *Check:* Case 4b. Is it Byzantine? Byzantine nodes act arbitrarily. Here, non-superrational nodes act as standard Nash maximizers. This is closer to a "mixed population" evolutionary game theory or robust mechanism design. I should clarify the distinction.

  8.  **Final Polish:** Ensure the distinction between *Program Equilibrium* (Tennenholtz) and *Superrationality* (Hofstadter) remains sharp. Program Equilibrium is a solution concept; Superrationality is a heuristic/philosophical stance that tries to single out one Program Equilibrium.

  **(Self-Correction on Case 2):** Wait, Hofstadter's specific argument for the lottery ($1/n$) relies on the idea that if everyone reasons the same, they must all choose the same *probability distribution*. In standard game theory, this is just the symmetric mixed Nash. But does superrationality imply correlated randomness? Hofstadter suggests that if I decide to randomize with $p$, *they* must also randomize with $p$. This is consistent with symmetric MSNE. The residue is whether the *realization* of the random variable is correlated. Hofstadter usually treats the *strategy* as the object of correlation, not the outcome. I will stick to strategy correlation to be faithful, but note the implementation gap.

  **(Self-Correction on Case 4a):** If labels are arbitrary, using them breaks the "interchangeable nodes" assumption in the *output*, but not the *algorithm*. Superrationality requires the *reasoning* to be identical. $P(x)$ is the same function. $P(ID_1) \neq P(ID_2)$ is fine. The residue is the *ordering* of IDs. Why is $ID_{max}$ the sender? Superrationality doesn't specify.

