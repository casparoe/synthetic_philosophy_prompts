answer: |-
  Here is the translation of Hofstadter's superrationality into the vocabulary of distributed systems, program equilibrium, and algorithmic game theory, followed by the residue report and verdict.

  ---

  ### Case 1: Two-Player Prisoner's Dilemma
  **Setup:** Two processes, identical code, one-shot interaction. Payoff matrix standard PD ($T > R > P > S$).
  **Superrational Claim:** Both cooperate ($C, C$) because reasoning is identical.

  **1. What Translates Cleanly**
  The core mechanism maps directly to **Program Equilibrium** (Tennenholtz 2004).
  *   **Vocabulary:** Each player submits a program $P$. The execution environment runs $(P_1, P_2)$ where $P_1$ receives source code of $P_2$ as input and vice versa.
  *   **Translation:** Superrationality is the constraint that the equilibrium profile must be symmetric: $P_1 = P_2 = P^*$.
  *   **Mechanism:** The argument "if I choose $C$, they choose $C$" is implemented via quining or fixed-point combinators (e.g., `FairBot` or `CliqueBot`). `FairBot` cooperates if it can prove the opponent cooperates. In a profile of identical `FairBot`s, Löb's Theorem ensures the fixed point $(C, C)$ is reached.
  *   **Status:** This is a valid Program Equilibrium. It is not a Nash Equilibrium of the base game, but it is a Nash Equilibrium of the *program game*.

  **2. What Translates Only with Imported Assumptions**
  *   **Assumption:** **Focal Point Selection.** Program Equilibrium admits multiple symmetric profiles. $(D, D)$ via `DefectBot` is also a symmetric program equilibrium. $(C, C)$ via `FairBot` is another.
  *   **Import:** Superrationality assumes that among the set of symmetric program equilibria, the Pareto-optimal one is *uniquely* selected by rationality alone. Your vocabulary (Folk Theorem) tells you that any feasible, individually rational payoff is supportable as an equilibrium. It does not tell you *which* one will be selected.
  *   **Flag:** I am assuming on Hofstadter's behalf that "rationality" implies a preference for Pareto efficiency that overrides risk dominance or security levels, without specifying the mechanism (e.g., pre-play communication, social norms) that enforces this selection.

  **3. What Has No Counterpart (Residue)**
  *   **Residue:** **Normative Necessity vs. Existence.**
      *   In your field, finding a symmetric program equilibrium is an *existence* proof.
      *   Superrationality claims *necessity*: a rational agent *cannot* play $D$ against a superrational opponent.
      *   Your vocabulary lacks a operator for "ought." You can model common knowledge of rationality (Halpern–Moses), but standard epistemic logic derives Nash, not Superrationality. The claim that logical correlation of decisions *obligates* cooperation is a philosophical assertion, not a derivable property of the computational model.

  ---

  ### Case 2: Symmetric n-Player Lottery
  **Setup:** $n$ anonymous nodes. Action space $\{Send, Wait\}$. Payoff: 1 if exactly one sends, 0 otherwise.
  **Superrational Claim:** All players randomize with probability $p = 1/n$.

  **1. What Translates Cleanly**
  *   **Vocabulary:** Symmetric Mixed-Strategy Nash Equilibrium (MSNE) in a distributed setting.
  *   **Translation:** The decision procedure is a randomized algorithm $A()$ returning $Send$ with prob $p$.
  *   **Mechanism:** If all nodes run $A()$, the probability of success is $n \cdot p(1-p)^{n-1}$. Maximizing this yields $p=1/n$.
  *   **Status:** This is the standard symmetric MSNE. In Program Equilibrium terms, players submit identical randomized programs.

  **2. What Translates Only with Imported Assumptions**
  *   **Assumption:** **Logical Correlation of Random Seeds.**
  *   **Import:** In standard distributed systems, if nodes run identical randomized algorithms with *independent* local entropy sources, the outcomes are independent. Collisions occur.
  *   **Flag:** Hofstadter's phrasing ("I fix the strategy, and they fix the same strategy") implies the *strategy* (the distribution) is correlated, which holds. However, his intuition often bleeds into the idea that the *outcomes* might be less collision-prone than independent randomness suggests. To make this work in your vocabulary, you must assume the players share a **Common Coin** (global randomness) or that the "reasoning" somehow correlates the specific realization of the random bit, which violates the standard independence assumption of private randomness in anonymous networks.
  *   **Constraint:** Without a common coin, $p=1/n$ is just the optimal *ex-ante* strategy, but the *ex-post* coordination failure rate is significant ($1 - (1 - 1/n)^{n-1} \approx 1 - 1/e$). Superrationality often glosses over this failure rate, implying a tighter coupling than independent randomization allows.

  **3. What Has No Counterpart (Residue)**
  *   **Residue:** **The "One-Box" Intuition in Continuous Space.**
      *   Superrationality treats the probability $p$ as a causal lever: "If I set $p=1/n$, the universe sets everyone's $p=1/n$."
      *   In your vocabulary, $p=1/n$ is a fixed point of the best-response function.
      *   The residue is the modal status of the probability. In distributed algorithms, we analyze convergence *given* the protocol. Superrationality posits the protocol *because* of the convergence. It conflates the *design phase* (choosing the algorithm) with the *execution phase* (running the algorithm). Your field separates these: the algorithm is fixed at deployment; superrationality suggests the algorithm is re-derived at runtime based on the logical necessity of agreement.

  ---

  ### Case 3: Asymmetric Lottery (Values $v_i$)
  **Setup:** $n$ players. If $i$ is sole sender, payoff $v_i$. All $v_i$ distinct, known.
  **Superrational Claim:** (Ambiguous in Hofstadter, but implies a unique "fair" or "optimal" sender).

  **1. What Translates Cleanly**
  *   **Vocabulary:** Input-indexed deterministic algorithms $P(i, \vec{v})$.
  *   **Translation:** The "same reasoning" constraint now means $P_1 = P_2 = ... = P_n = P$. The function $P$ takes index $i$ and vector $\vec{v}$ as input.
  *   **Mechanism:** The profile is defined by the function $P$. The outcome is determined by evaluating $P(i, \vec{v})$ for all $i$.

  **2. What Translates Only with Imported Assumptions**
  *   **Assumption:** **A Canonical Social Welfare Function (SWF).**
  *   **Import:** Symmetry of *code* ($P$) does not imply symmetry of *outcome*. $P$ could select the player with $\max(v_i)$, $\min(v_i)$, $\max(i)$, or a random draw weighted by $v_i$.
  *   **Flag:** I am choosing on Hofstadter's behalf that superrationality implies maximizing **Total Welfare** ($\sum v_i \cdot \mathbb{I}[\text{i sends}]$). This selects the player with $\max(v_i)$.
  *   **Alternative:** Hofstadter might argue for a **Nash Bargaining Solution** or **Maximin** (giving the prize to the poorest).
  *   **Constraint:** Your vocabulary (Program Equilibrium Folk Theorem) confirms that *any* of these selection rules can be supported as an equilibrium if the code is written to enforce it (e.g., "I send iff $v_i = \max(\vec{v})$, else I wait; if you deviate, I punish").
  *   **The Gap:** Superrationality claims one of these is *the* rational choice. Your vocabulary says all are *implementable*. The translation fails to identify *which* $P$ is selected without importing an external normative axiom (e.g., Utilitarianism).

  **3. What Has No Counterpart (Residue)**
  *   **Residue:** **The Collapse of "Same Choice."**
      *   Hofstadter's heuristic relies on: "We make the same choice."
      *   In the asymmetric case, we make *different* choices (Player 1 sends, Player 2 waits) based on the *same* function.
      *   The intuitive force of superrationality ("I control their action by controlling mine") evaporates. I cannot choose "Send" and expect them to choose "Send" (which yields 0). I must choose "Send if $v_1$ is max."
      *   The residue is the **Salience Problem**. In distributed systems, we break symmetry using IDs or values. Superrationality provides no algorithm for *which* symmetry-breaking rule is rationally mandatory. It disguises a coordination convention (e.g., "highest value wins") as a law of logic.

  ---

  ### Case 4: Perturbations of the Asymmetric Case

  #### 4a: Arbitrary Labels (IDs)
  **Setup:** Distinct labels $L_i$ known to all, uncorrelated with $v_i$.
  **Superrational Claim:** Can we use labels to coordinate?

  **1. What Translates Cleanly**
  *   **Vocabulary:** Symmetry breaking via unique identifiers in anonymous networks.
  *   **Translation:** Algorithm $P(i, L_i, \vec{v})$.
  *   **Mechanism:** Deterministic leader election using $L_i$ (e.g., "Send iff $L_i = \max(\vec{L})$").

  **2. What Translates Only with Imported Assumptions**
  *   **Assumption:** **Common Ordering of Label Space.**
  *   **Import:** All agents must agree on the ordering of labels (e.g., lexicographical).
  *   **Flag:** I assume Hofstadter accepts using arbitrary labels. This technically violates the spirit of "interchangeable nodes" if the labels are morally arbitrary, but fits the "input-indexed" definition.
  *   **Constraint:** Superrationality requires that the *reasoning* is identical. Using $L_i$ makes the *output* distinct. This is acceptable in your field (algorithm is symmetric, execution is not).

  **3. What Has No Counterpart (Residue)**
  *   **Residue:** **Normative Weight of Arbitrary Features.**
      *   In distributed systems, using IDs is a pragmatic engineering solution to impossibility results.
      *   Superrationality treats the decision as a moral/logical imperative. Why *ought* the highest ID win?
      *   The residue is the **Justification of Salience**. Your field accepts focal points as given parameters. Superrationality attempts to *derive* the focal point from rationality itself. It fails here: rationality alone does not dictate that $\max(L)$ is superior to $\min(L)$ without a prior convention.

  #### 4b: Fraction $q$ Superrational (Byzantine Population)
  **Setup:** Fraction $q$ are Superrational (S), fraction $1-q$ are Standard Rational (N). $q$ is common knowledge. Identities unknown.
  **Superrational Claim:** How does S behave?

  **1. What Translates Cleanly**
  *   **Vocabulary:** Robust Mechanism Design / Fault Tolerance.
  *   **Translation:** $S$-agents run program $P_S$. $N$-agents run program $P_N$ (Nash best response).
  *   **Mechanism:** $S$ agents maximize utility given the mixed population. This is a Bayesian Game or a game with incomplete information regarding types.

  **2. What Translates Only with Imported Assumptions**
  *   **Assumption:** **Correlation within the Subset.**
  *   **Import:** Do $S$-agents correlate *only* with other $S$-agents?
  *   **Flag:** I assume on Hofstadter's behalf that an $S$-agent reasons: "If I (an $S$) choose $X$, all other $S$-agents choose $X$." They do *not* assume $N$-agents will match them.
  *   **Constraint:** This turns the problem into computing a Bayes-Nash Equilibrium where the $S$-population acts as a correlated coalition (implicitly) against the $N$-population.

  **3. What Has No Counterpart (Residue)**
  *   **Residue:** **The Breakdown of Logical Correlation.**
      *   Superrationality relies on the identity of reasoning. "I am S, they are S, therefore we match."
      *   If I am S, and I know some are N, I know my reasoning does *not* determine their output.
      *   The residue is the **Definition of the Reference Class**. Superrationality provides no formal rule for determining *who* is in the superrational coalition when types are hidden.
      *   In your field, this is a Byzantine fault tolerance problem with a bound $f < (1-q)n$. You can guarantee safety/liveness if $q$ is high enough.
      *   Superrationality offers no such guarantee. It offers a heuristic that becomes undefined when the "mirror" is cracked. The normative force ("I must do X") dissolves into standard strategic calculation ("I must do X given probability $q$ they match me"). The distinct "superrational" category collapses back into Bayesian Rationality.

  ---

  ### Verdict on the Aggregate Residue

  **The Argument for Your Suspicion:**
  Your suspicion is largely correct. Superrationality functions as a **Coordination-and-Selection Principle** masquerading as a constraint of individual rationality.
  1.  **Symmetry is the Engine:** In Case 1 (PD) and Case 2 (Symmetric Lottery), the symmetry of the setup allows the "same reasoning" assumption to map cleanly to symmetric Program Equilibria. The "magic" is just the selection of the Pareto-optimal symmetric equilibrium.
  2.  **Symmetry Breaking Reveals the Void:** In Case 3 (Asymmetric Values) and Case 4 (Labels/Byzantine), where symmetry is broken, superrationality loses its deductive power. It cannot derive *which* asymmetric equilibrium to select (MaxSum vs. MaxMin) without importing external normative axioms (Utilitarianism, Egalitarianism).
  3.  **The Residue is Normative:** Your vocabulary (Program Equilibrium, Folk Theorem) is **descriptive**: it tells you what *can* be implemented and sustained. Superrationality is **prescriptive**: it tells you what *should* be chosen. The residue is the "Ought." Hofstadter attempts to derive the "Ought" from the "Is" of logical identity, but this derivation only holds when the "Is" (the game structure) forces a unique symmetric solution. When multiple equilibria exist, the "logical identity" of the agents is insufficient to select one.

  **The Argument for the Genuine Gap:**
  However, there is a counter-argument that the residue marks a genuine gap in your framework that you might want to care about.
  1.  **Equilibrium Selection is Unsolved:** Your field acknowledges the Folk Theorem problem: too many equilibria. Standard Game Theory offers no solution other than "focal points" or "pre-play communication." Superrationality attempts to provide a **non-communicative selection mechanism** based on the logical structure of the agents themselves.
  2.  **Logical Correlation is Under-Modeled:** Standard distributed systems assume causal independence unless communication occurs. Superrationality posits **logical correlation** (acausal trade). While this sounds mystical, in the context of AI/Program Equilibrium, it is literal: if agents are open-source and similar, their outputs *are* logically correlated. Your vocabulary handles the *implementation* (Tennenholtz), but lacks a **decision theory** for which program to submit when multiple are equilibria.
  3.  **The Normative Dimension:** You model *capability* (what algorithms work). Superrationality models *agency* (what decision to make). If you are building multi-agent systems where agents design their own code (autonomous AI), they face the Program Equilibrium selection problem. Superrationality is a heuristic for solving that selection problem without communication. The residue isn't just "philosophical fluff"; it's the missing **meta-algorithm for equilibrium selection** in decentralized, open systems.

  **Final Conclusion:**
  Superrationality is not a distinct *solution concept* from Program Equilibrium; it is a **selection criterion** applied to the set of symmetric Program Equilibria.
  *   **Where it works:** In highly symmetric games with a unique Pareto-optimal symmetric equilibrium (Case 1, Case 2).
  *   **Where it fails:** In asymmetric games or mixed populations (Case 3, Case 4), where it collapses into standard bargaining theory or Bayesian game theory, requiring external axioms to resolve the selection.

  **Recommendation:** Do not adopt superrationality as a fundamental law of rationality. Adopt it as a **heuristic for focal point selection** in symmetric program equilibria. The "residue" you identified is the space of **Social Choice Theory** which your distributed systems vocabulary currently treats as external input. If your research moves toward autonomous agents negotiating protocols, you will need to internalize that selection principle, and Hofstadter's intuition (formalized via Program Equilibrium) is a valid starting point, provided you strip it of its claim to logical necessity.
