answer: |-
  **Sequence**

  Begin by writing the axiom and four rules on the board. Do not state the goal yet. Ask students to derive any string they can from **MI** for ten minutes. This active generation is crucial; they must inhabit the object level before analyzing it. Collect a few results on the board. Now, pose the target: **MU**. Ask for volunteers to derive it. Allow fifteen minutes of focused struggle. When frustration peaks, halt the attempt. This failure creates the dependency for the meta-argument: they need a reason to stop trying, not just a lack of imagination.

  Shift to analysis. Ask: "Look at the strings you generated. What property do they share that **MU** lacks?" Guide them toward counting **I**s. Do not announce the invariant; let them observe that **MI** has one **I**, and their derivations have 1, 2, 4, etc. This observation depends on their prior generation of data. Once the "count of **I**s" is identified, verify it against the rules. Have students individually check each rule to see how it changes the **I**-count. This verification depends on the hypothesis that the count matters.

  Conclude that **MU** (zero **I**s) is unreachable because the starting count (one) cannot become zero under these operations. This conclusion depends on the verified preservation of non-divisibility by three. Finally, discuss the "jump." Explain that you just stepped outside the string-manipulation game to talk *about* the game using arithmetic. This philosophical reflection depends on the successful completion of the object-level proof. The sequence moves from doing (object) to observing (pattern) to proving (meta) to reflecting (philosophy).

  **The invariant**

  Avoid modular arithmetic terminology. Frame divisibility by three as a preservation property of the rules. Write the **I**-count next to each string as you verify the rules. For **MI** (1), note that 1 is not a "multiple of three" (use this phrase, not "not divisible"). Show that Rule 2 doubles the count: if you start with a non-multiple, doubling it never yields a multiple of three (check 1→2, 2→4, 4→8). Show that Rule 3 subtracts three: removing three from a non-multiple leaves a non-multiple. Rule 1 and 4 change the count by zero.

  Make the arithmetic feel like a structural constraint on the rules, not a fact about numbers. The key is that the rules *respect* the property "not a multiple of three." Since the axiom has this property, and the rules preserve it, every theorem must have it. **MU** lacks it. Therefore, **MU** is not a theorem. The invariant is not a trick; it is a description of the system's mechanical limits. Ensure students verify the doubling step themselves; if they accept it on your authority, it remains magic rather than method.

  **Misconceptions**

  Error (a) (Truth vs. Derivability) must be headed off at the very start. Define "theorem" strictly as "reachable string." Use a chess analogy: asking if **MU** is a theorem is like asking if a knight can reach a specific square in one move. It is not about the square being "false," but about the move being illegal. Reiterate this when concluding the proof: **MU** is not "false," it is "unreachable."

  Error (b) (Escape vs. Meta-System) belongs in the final discussion. When explaining the "jump," clarify that you are now playing a different game (arithmetic) with stricter rules. You haven't escaped systemhood; you've switched systems. The meta-argument is itself formalizable. If a student asks, "Can we prove the meta-system is consistent?" acknowledge that yes, but that requires a meta-meta-system. This prevents the mystical view of "jumping out."

  The "add a rule" objection arises from confusing the system with the goal. Address this when posing the **MU** challenge: "We are asking what is possible *given these constraints*." If you add a rule, you change the question. Address the "zero is a multiple" balk during the invariant verification. Explicitly ask: "Is zero a multiple of three?" If they hesitate, define "multiple" as "3 times an integer." 3 × 0 = 0. This must be settled before the proof concludes, or the invariant fails.

  **Check**

  Place **MIU*** immediately after the **MIU** proof but before the final philosophical wrap-up. Write the modified rule (**II** → **U**) on the board. Ask: "Does our invariant still hold?" Students should see that removing two **I**s changes divisibility by three (e.g., 3 **I**s becomes 1 **I**). Then ask them to derive **MU** in **MIU***. They will succeed quickly.

  This placement serves two purposes. First, it diagnoses whether they understood the invariant as rule-dependent or as a universal law of strings. If they think **MU** is still impossible, they missed the point. Second, it counters the "trick" misconception. The invariant wasn't a magic spell; it was a specific observation about specific rules. Changing the rules breaks the invariant. This reinforces that the method is general (find an invariant), even if the specific invariant (divisibility by three) is local to **MIU**.

  **What to withhold**

  Drop the gesture at incompleteness entirely. You are correct that it manufactures error (a). Incompleteness concerns true statements that cannot be proved; **MU** is not a statement with a truth value, and its unprovability is due to syntactic unreachableability, not semantic depth. Invoking Gödel suggests **MU** is "true but unprovable," which reinforces the confusion between truth and derivability you are trying to dismantle.

  Also, refuse to formalize the meta-system. Do not write down the arithmetic axioms you used to prove the invariant. Doing so invites the regress question ("Can we prove the arithmetic?") which you cannot answer in ten minutes without slides or background. Keep the meta-level informal but rigorous. Withhold the general theory of invariants; let this stand as a single, concrete example of the method. Over-generalizing now will obscure the specific mechanical lesson they need to retain.
