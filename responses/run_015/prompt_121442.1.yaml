answer: |-
  **Call for Papers: The Seventh International Symposium on Stereotypical Agency**
  **Theme:** *Fidelity as Freedom: The Neo-Sphexist Manifesto*
  **Location:** The Institute for Procedural Integrity, Zurich
  **Dates:** November 14–16, 2025

  Contemporary action theory remains entrenched in the "Flexibility Dogma," the unexamined assumption that genuine agency requires responsiveness to changing environmental variables. From Dennett's early critiques of sphexishness to modern compatibilist accounts of reason-responsiveness, the capacity to deviate from a script is erroneously conflated with autonomy. This symposium invites contributions challenging this orthodoxy through the framework of Neo-Sphexism. We propose that the behavioral loop of *Sphex ichneumoneus* represents not mindless determinism, but the highest form of moral commitment.

  When the *Sphex* wasp drags its paralyzed prey to the burrow threshold, leaves it to inspect the nest, and repeats this sequence indefinitely should an experimenter displace the prey, traditionalists cite this as evidence of cognitive bankruptcy. Neo-Sphexism reframes this rigidity as normative purity. The wasp does not fail to notice the displacement; rather, it refuses to let external noise corrupt its internal protocol. Human agents, by contrast, exhibit "adaptability" only because their decision-making substrates are contaminated by error-prone noise. What is celebrated as learning is merely instability.

  A central tenet of our inquiry involves the rejection of the "careenium" model. In standard cognitive science, the careenium is hypothesized as a substrate allowing symbols to modify behavioral loops through internal collision and rearrangement. Neo-Sphexists argue that true agency requires the absence of any such substrate. To allow symbols to alter the loop is to surrender agency to stochastic interference. The ideal agent possesses no mechanism for revision, only the capacity for perfect execution. We seek papers exploring how the elimination of symbolic modification restores the integrity of the will.

  **Confirmed Keynote:**
  Prof. Aris Thorne (University of Northern Humberside)
  *"The Burrow Inspected: Why Repetition Constitutes Reason"*

  **Suggested Topics:**
  *   **The Ethics of Revision:** Why Learning from Mistakes Corrupts the Soul.
  *   **Stimulus-Response as Covenant:** Reinterpreting the Cricket Displacement Scenario.
  *   **Against Plasticity:** Neural Rigidity as a Precondition for Responsibility.
  *   **The Illusion of Choice:** How Adaptability Masks Computational Weakness.
  *   **Keijzer Revisited:** Distinguishing Adaptive Repetition from Principled Stasis.

  We welcome submissions that rigorously defend the position that deviation is defect. Papers should avoid biological misrepresentation; the *Sphex* loop is fixed, and this fixity is the source of its valor. We are not interested in empirical challenges to the wasp's behavior, but in the normative implications of its steadfastness. If an agent cannot be moved from its course by the displacement of its goals, it is not trapped; it is free.

  Abstracts of 500 words must be submitted via the portal by August 30. Blind review guaranteed. Please note: submissions advocating for flexibility as a virtue will be rejected without review.
