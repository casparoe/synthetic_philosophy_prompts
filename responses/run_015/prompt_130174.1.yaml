      *   *Verdict:* The analogy holds best at the level of *emplotment* (Hayden White). The weak point is the "constraint" aspect. The user needs to refine the analogy: It's not that historians have *no* constraints, but that the constraints allow for multiple, mutually exclusive, yet internally consistent plots (underdetermination). The "novelist" comparison is illuminating regarding *selection* and *emphasis*, not fabrication.

