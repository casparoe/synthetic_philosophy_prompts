      *   *Risk:* If the user says "Institutionalists say X, Geographers say Y, both fit Korea," the Geographer argument looks weak. The user might be forcing an equivalence that doesn't exist to prove "overdetermination."
      *   *Verdict:* This is the danger zone. Using Korea to prove *ambiguity* might look like ignoring the overwhelming evidence for institutions in that specific case. The user needs to frame it carefully: Korea is the institutionalists' *best* story, but even there, the *origin* of the institutional split is geopolitical (external imposition), which muddies the "endogenous institutions" narrative. The "tidy causal arc" risk is real.

  5.  **Synthesize and Structure the Response:**
