answer: |-
  Leo: "This gin tastes like antiseptic."

  Sarah: "It's the Hilton. Drink it. So, Owen. You're saying he has no reason to confess?"

  Leo: "I'm saying there's no route. Look, put it simply: a reason has to hook onto something you already care about to move you. Owen cares about not being manipulated and not faking virtue. Confessing triggers both. The bridge is out."

  Sarah: "That confuses 'having a reason' with 'being motivated'. I can have a reason to take penicillin even if I'm allergic to the taste and scared of needles. The reason is the health outcome, not my fear."

  Leo: "But if you're so scared you'd rather die, the reason doesn't *function*. Here's the hit: Owen's first rule is to ignore anyone telling him what he ought to do. If you tell him 'You have a reason to confess,' you become the authority he ignores. Your argument disables itself."

  Sarah: "That's a psychological block, not a normative fact. If I say 'You have a reason,' I'm stating a truth about his situation, not trying to hack his psychology. Whether he listens is about his rationality, not the reason's existence."

  Leo: "So the reason exists in a vacuum? What work is it doing? It can't guide him. It can't explain his action. It's just a floating label."

  Sarah: "It grounds blame. If there's no reason, he's just different, like preferring tea to coffee. But he's not. He's wrong. We need external reasons to say he's blameworthy even if he couldn't care less."

  Leo: "Okay, concession. He is blameworthy. I'll grant that. We can blame people for having motivational sets that exclude morality. But blaming him isn't the same as saying he has a reason to act now. You're trading action-guidance for judgment."

  Sarah: "And you're trading truth for efficacy. Look, plain language: I mean that some things are required of us regardless of our wants. Like gravity. You don't have to want to fall."

  Leo: "But reasons aren't gravity. They're maps. If the map says 'road ahead' but the bridge is blown, the map is lying. Owen's bridge is blown by design. He wants to be good, but only if it happens by magic. He has a reason to become someone who has a reason to confess, but that doesn't help Mara."

  Sarah: "That non-composability is tragic, not a refutation. Here's my hit: If you say he has no reason, you imply that if he never changes, he never wronged her. You make morality contingent on his quirks."

  Leo: "No, I make *reasons* contingent. The wrong is real. The reason to fix it is missing. There's a difference. I concede this: it makes my view look powerless. It says to Owen, 'You're stuck,' and to us, 'Good luck.'"

  Sarah: "Exactly. It leaves normativity helpless against a clever sociopath. My view says he's reachable in principle, even if he's blocked in practice. It keeps the door open."

  Leo: "It keeps the door open to a room he's locked from the inside. You're shouting at a ghost."

  Sarah: "Better than telling the ghost it doesn't exist."

  Leo: "At least I'm not pretending the ghost can hear me."

  \answer{internalist} The internalist better explains the practical deadlock created by Owen's specific psychological constraints, showing why the external reason is inert without denying the wrong.
