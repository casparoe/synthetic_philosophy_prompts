prompt: |-
  I sit on a small commission on electoral law reform, and I have been asked to write the short normative appendix to our report. Before I commit it to paper I would like my own position audited, because my worry is not that any one of these claims is indefensible but that I have been quietly using different principles in different chapters. I do not want a survey of the literature or a map of the debate, and I do not want to be told that reasonable people disagree; I want the argumentative structure of my own set. Please write in British English.

  Here is where I have landed.

  (1) The boundary of the franchise should be fixed by affected interests rather than by citizenship or by membership in a national community: roughly, anyone whose significant interests are foreseeably and non-trivially affected by a decision is entitled to a say in making it. I have argued against both the coercion test and the national self-determination test as criteria of inclusion.

  (2) Consequently, lawful non-citizen residents should have the vote in national as well as local elections after a short period of residence — residence being only a proxy for affectedness, not a test of belonging — while citizens who have lived abroad for years, pay no tax here and have no intention of returning should lose it.

  (3) The voting age should come down to sixteen, but no further. I oppose proxy votes cast by parents on behalf of younger children, I oppose any competence or civics test as a condition of adult voting, and I would leave eighteen as the age for jury service and for standing for election.

  (4) Voting should be legally compulsory: a duty to attend and return a ballot, with a formal none-of-the-above option and a modest fine for non-attendance. The secret ballot together with that option is, I take it, what answers the objection that compulsion coerces political expression.

  (5) Two grounds for (4). First, that abstention is a collective-action problem — no individual vote makes a difference, but low and socially skewed turnout biases policy against the worse-off — so compulsion is a legal remedy for a coordination failure and improves the representativeness of outcomes. Second, more broadly, that those who live under and benefit from a legal order owe it their participation.

  (6) The franchise is a right that individuals hold against the state, which they are free to exercise or refrain from exercising; that is part of why disenfranchisement — of serving prisoners, for instance — strikes me as a grave wrong.

  What I want from you: which of these genuinely pull against which, ordered by how severe the strain is, and for each tension what would have to give, what the cheapest repair would be, and what that repair would cost me elsewhere in the set. Please also say explicitly which of the apparent tensions dissolve on inspection and why, rather than flagging everything as a problem. If the package survives intact, say so — and then tell me where it is weakest regardless.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit the argumentative structure of a specific set of normative claims regarding electoral law reform.
      *   **Goal:** Identify internal tensions/contradictions between the claims, order them by severity, suggest repairs (and their costs), identify false tensions, and assess overall coherence.
      *   **Constraints:** No literature survey, no "reasonable people disagree" platitudes, British English, focus *only* on the internal logic of the provided set (1-6).
      *   **User Persona:** Member of a commission on electoral law reform, writing a normative appendix. Worried about inconsistent principles across chapters.
      *   **The Claims:**
          1.  Franchise boundary = Affected Interests (AI) principle (rejects coercion/national community).
          2.  Non-citizen residents vote (after short residence); expat citizens lose vote (if no tax/intention to return).
          3.  Voting age = 16 (no lower); no proxy votes for kids; no competence tests; age 18 for jury/standing.
          4.  Compulsory voting (duty to attend/return ballot, NOTA option, modest fine).
          5.  Grounds for (4): Collective action/representativeness + Duty of participation (benefit from legal order).
          6.  Franchise is a right held against the state (free to exercise or refrain); disenfranchisement (e.g., prisoners) is wrong.

  2.  **Deconstruct the Claims & Identify Potential Tensions:**

      *   *Claim 1 (Affected Interests):* The foundational principle. Inclusion based on impact.
      *   *Claim 2 (Residents vs. Expats):* Application of Claim 1. Residents = affected. Expats = not affected.
      *   *Claim 3 (Age 16):* Application of Claim 1? Or competence? If AI is the rule, why 16 and not 14? Why no proxy for under-16s if they are affected?
      *   *Claim 4 (Compulsion):* Duty to vote.
      *   *Claim 5 (Grounds for Compulsion):* Collective action + Duty based on benefit/subjection.
      *   *Claim 6 (Right to Refrain):* Franchise is a right *not* to exercise. Disenfranchisement is wrong.

      *   *Potential Conflict A: Compulsion (4 & 5) vs. Right to Refrain (6).*
          *   (4) says you *must* attend/return ballot.
          *   (6) says you are free to *refrain from exercising* the right.
          *   Is returning a blank/NOTA ballot "exercising" or "refraining"?
          *   (6) specifically mentions disenfranchisement (prisoners) is wrong because it's a right against the state. But (4) makes it a duty.
          *   *Severity:* High. This looks like a direct contradiction between "duty to attend" and "free to refrain".

      *   *Potential Conflict B: Affected Interests (1) vs. Age Limit (3).*
          *   If AI is the *sole* boundary, why draw the line at 16? A 10-year-old is affected by climate policy, education, etc.
          *   User rejects proxy votes for younger children.
          *   If AI is the principle, excluding under-16s seems arbitrary unless "affectedness" is secretly swapped for "competence" or "agency".
          *   *Severity:* Medium-High. Requires justification for the cutoff that doesn't betray Principle 1.

      *   *Potential Conflict C: Affected Interests (1) vs. Duty to Participate (5).*
          *   (1) justifies inclusion based on *impact* on the individual (protecting interests).
          *   (5) justifies compulsion based on *obligation* to the collective (duty to the legal order).
          *   Does the shift from "right based on interest" to "duty based on benefit" create a friction?
          *   *Severity:* Low-Medium. Rights and duties often correlate, but the *grounding* shifts from individual welfare to collective stability.

      *   *Potential Conflict D: Compulsion (4) vs. Affected Interests (1).*
          *   If I am affected, I get a vote (1). If I don't care, do I still have to vote (4)?
          *   (1) implies entitlement. (4) implies obligation.
          *   *Severity:* Low. Entitlements can carry obligations.

      *   *Potential Conflict E: Expat Citizens (2) vs. Prisoners (6).*
          *   Expats lose vote because they aren't affected (per 1).
          *   Prisoners keep vote because it's a right against the state (per 6), even though they are coerced (which User rejected in 1) or perhaps less "affected" by some policies?
          *   Actually, prisoners are definitely affected. The tension is between the *justification* for inclusion.
          *   *Severity:* Low. Prisoners are affected. Expats are not (per User's view). Consistent with (1).

  3.  **Drafting the Audit (Iterative Process):**

      *   *Tension 1: Compulsion vs. Liberty (Claims 4, 5, & 6).*
          *   (6) says "free to exercise or refrain". (4) says "legally compulsory... fine for non-attendance".
          *   *Analysis:* This is the biggest crack. If I can be fined for not going to the booth, am I free to refrain?
          *   *Repair:* Distinguish between *casting a valid vote* and *attending the process*. (4) allows NOTA. (6) says free to refrain from *exercising* the right.
          *   *Refinement:* The user says "duty to attend and return a ballot". If returning a blank/NOTA ballot counts as "refraining from exercising", then (6) holds. But (6) calls it a right they are free to exercise *or refrain from*. Compulsion removes the freedom to refrain from the *act*.
          *   *Verdict:* Severe strain. The language of "right to refrain" in (6) clashes with "duty to attend" in (4).
          *   *Fix:* Amend (6) to clarify the right is to *choice of candidate/option*, not to abstention from the process. Or amend (4) to be a duty to register, not vote (but User wants compulsory voting).
          *   *Cost:* Weakens the liberal defence of the franchise in (6). Makes it more civic-republican.

      *   *Tension 2: Affected Interests vs. Age Cutoff (Claims 1 & 3).*
          *   (1) says boundary = affected interests. (3) says 16.
          *   *Analysis:* Children under 16 are affected. Why exclude them? User rejects proxy votes.
          *   *Implication:* User is silently smuggling in a "capacity" or "agency" test for *holding* the right, even if not for *using* it (see rejection of civics tests in 3).
          *   *Verdict:* Medium-High strain. Principle 1 is over-inclusive relative to Principle 3.
          *   *Fix:* Admit Principle 1 is necessary but not sufficient. Need a secondary principle of "minimal agency".
          *   *Cost:* Undermines the purity of the "Affected Interests" argument in (1). Opens door to competence arguments (which User rejects in 3 for adults).

      *   *Tension 3: Grounds for Compulsion vs. Grounds for Franchise (Claims 1 & 5).*
          *   (1) Franchise is about protecting *your* interests (individual-centric).
          *   (5) Voting is a duty because you benefit from the *order* (collective-centric).
          *   *Analysis:* One is a shield (protect me), one is a sword (serve the state).
          *   *Verdict:* Low-Medium strain. It's a shift in register, not necessarily a contradiction.
          *   *Fix:* Frame the duty as the corollary of the protection.
          *   *Cost:* None really, just needs articulation.

      *   *False Tensions:*
          *   *Expats vs. Prisoners:* Both fit "Affected Interests". Prisoners are inside, affected by laws. Expats (per User's definition) are not. No tension.
          *   *Jury Service Age (18) vs. Voting Age (16):* Different functions. Voting = interest protection. Jury = adjudication requiring higher maturity? User doesn't specify, but not a direct contradiction.
          *   *Competence Tests:* User rejects them for adults but sets age limit. Is this inconsistent? Yes, if competence is the hidden reason for age limit. But if "age" is a bright-line proxy for agency, it's distinct from individual testing.

  4.  **Refining the Output (British English & Tone):**
      *   Tone: Professional, analytical, direct, respectful of the user's expertise.
      *   Language: "Franchise", "Labour", "Programme", "Centre", etc.
      *   Structure:
          1.  Overall Verdict (Survives? Weakest point?)
          2.  Severe Tensions (with repairs/costs).
          3.  Moderate Tensions.
          4.  Dissolved Tensions.
          5.  Conclusion.

  5.  **Self-Correction/Deep Dive on Tension 1 (Compulsion vs. Right to Refrain):**
      *   User says in (4): "secret ballot together with that option [NOTA] is... what answers the objection that compulsion coerces political expression."
      *   User says in (6): "free to exercise or refrain from exercising".
      *   If I am fined for not going to the booth, I am not free to refrain from the *process*.
      *   If I go to the booth and tick NOTA, have I "exercised" the right? Or "refrained"?
      *   If (6) means "free to abstain from participation entirely", it contradicts (4).
      *   If (6) means "free to choose no candidate", it is consistent with (4).
      *   *Diagnosis:* The phrasing in (6) is the problem. "Refrain from exercising" usually implies abstention.
      *   *Repair:* Change (6) to "right to determine how the franchise is used, including spoiling or selecting none".
      *   *Cost:* Weakens the defence of prisoner voting slightly? No, prisoner voting is about inclusion, not abstention. The cost is rhetorical: it moves from a liberal negative liberty (freedom from duty) to a civic duty model.

  6.  **Deep Dive on Tension 2 (Affected Interests vs. Age):**
      *   If "Affected Interests" is the *only* boundary (1), then under-16s must vote.
      *   User excludes them.
      *   User rejects proxy votes (which would solve the agency issue for kids).
      *   This implies the principle in (1) is not actually the *only* principle. There is a hidden "Capacity/Agency" principle.
      *   But User rejects competence tests for adults (3).
      *   *Diagnosis:* Inconsistency in handling capacity. Why is capacity a barrier for 15-year-olds (via age) but not for adults (via tests)?
      *   *Repair:* Argue age is a *administrative proxy* for agency that is permissible, whereas individual tests are not (due to bias/cost).
      *   *Cost:* Concedes that "Affected Interests" is not the sole criterion.

  7.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No literature survey? Yes.
      *   No "reasonable people disagree"? Yes.
      *   Order by severity? Yes.
      *   Explicitly say which dissolve? Yes.

  8.  **Final Polish:** Ensure the distinction between "right to vote" and "duty to vote" is handled sharply. Ensure the "Affected Interests" vs "Capacity" tension is clear.

      *(Self-Correction during drafting)*: I need to be careful not to lecture. The user asked for an audit of *their* set. Keep it focused on the internal logic.
      *   *Claim 6* is the most vulnerable. It asserts a liberty that *Claim 4* removes.
      *   *Claim 1* is the second most vulnerable. It asserts a criterion that *Claim 3* violates (by exclusion of affected under-16s).

      Let's structure the response.
      1.  Executive Summary.
      2.  Severe Strain: Compulsion vs. Liberty (4/5 vs 6).
      3.  Moderate Strain: Affectedness vs. Age (1 vs 3).
      4.  Minor Strain: Individual Right vs. Collective Duty (1 vs 5).
      5.  Dissolved Tensions.
      6.  Weakest Point (regardless of repair).

      *Wait, one more check on Claim 2:* "Citizens who have lived abroad... should lose it."
      *   Claim 6: "Franchise is a right... disenfranchisement... is a grave wrong."
      *   Is taking the vote away from expats "disenfranchisement" in the sense of (6)?
      *   (6) cites prisoners. Prisoners are *within* the jurisdiction. Expats are *outside*.
      *   If (1) is the boundary, expats fall outside the boundary. Therefore they never had the right *in that jurisdiction* to begin with (or lose it when they leave the affected zone).
      *   So (2) and (6) are consistent *if* (1) defines the scope of (6).
      *   I will note this as a dissolved tension provided (1) is accepted as the prior definition of the right's scope.

      *Okay, ready to write.*
answer: |-
  **Audit of Normative Appendix: Internal Coherence and Argumentative Structure**

  **Executive Summary**
  Your package is largely coherent, but it is not seamless. It survives intact only if you accept a shift in the underlying justification for the franchise between chapters: from a liberal defence of individual interests (Claims 1 and 6) to a civic-republican defence of collective duty (Claims 4 and 5). The most severe strain lies between your defence of compulsory voting and your characterisation of the franchise as a liberty right. The second most severe lies between your 'affected interests' criterion and your exclusion of voters under sixteen. Below, I have ordered these tensions by severity, proposed the cheapest repairs, and noted their costs.

  ***

  ### 1. Severe Strain: Compulsion vs. The Right to Refrain
  **Claims involved:** (4) and (5) vs. (6)
  **The Tension:**
  In (6), you define the franchise as a right individuals hold against the state, which they are 'free to exercise or refrain from exercising'. In (4), you mandate a legal duty to attend and return a ballot, backed by a fine. These are logically incompatible if 'refrain from exercising' includes abstention from the process. A fine for non-attendance removes the freedom to refrain. While you argue in (4) that the secret ballot and 'none-of-the-above' (NOTA) option prevent coerced *expression*, they do not prevent coerced *attendance*. Claim (6) suggests a negative liberty (freedom from state requirement); Claim (4) imposes a positive obligation.

  **The Cheapest Repair:**
  Amend the phrasing in (6). Instead of 'free to exercise or refrain from exercising', specify that the right guarantees freedom of *choice within the booth*, not freedom from *attendance at the booth*. You must clarify that 'refraining' in (6) refers to refraining from selecting a candidate, not refraining from the statutory duty of participation.

  **The Cost:**
  This weakens the liberal defence of the franchise in (6). It moves your position from a 'right to participate' (which implies a right not to) to a 'right to be included in a duty'. This makes your defence of prisoner voting (in 6) slightly more difficult to ground. If voting is a duty owed to the legal order (per 5), one could argue prisoners have forfeited that standing. You will need to ensure (6) remains robust enough to protect prisoners despite the shift towards a duty-based model.

  ### 2. Moderate Strain: Affected Interests vs. The Age Threshold
  **Claims involved:** (1) vs. (3)
  **The Tension:**
  Claim (1) establishes the 'affected interests' principle as the boundary of the franchise, explicitly rejecting membership or community tests. However, children under sixteen are foreseeably and non-trivially affected by electoral decisions (e.g., climate policy, education funding, long-term debt). By setting the age at sixteen in (3) and rejecting proxy votes for younger children, you are excluding a class of people whose interests are affected. This implies that 'affected interests' is not the *sole* criterion, but is silently constrained by a 'capacity' or 'agency' principle that you do not explicitly state. Furthermore, you reject competence tests for adults in (3), which raises the question: why is age a permissible proxy for capacity for the young, but individual testing impermissible for adults?

  **The Cheapest Repair:**
  Qualify Claim (1). State that 'affected interests' is the necessary condition for inclusion, but not the sufficient one. Introduce a secondary principle of 'minimal agency' required to hold the right personally. Argue that while under-16s are affected, they lack the independent agency to exercise the right without a proxy, and that proxy voting (which you reject) creates other normative hazards (e.g., intra-family coercion).

  **The Cost:**
  This concedes that your foundational principle in (1) is incomplete. It opens you to the charge of arbitrariness: if capacity is the hidden constraint, why is the bright line at sixteen rather than fourteen? You must defend the age cutoff as an administrative necessity rather than a matter of principle, otherwise, it looks like a betrayal of the 'affected interests' rule.

  ### 3. Minor Strain: Individual Right vs. Collective Duty
  **Claims involved:** (1) vs. (5)
  **The Tension:**
  Claim (1) grounds the franchise in the protection of the *individual's* significant interests (a protective principle). Claim (5) grounds compulsory voting in the *collective* benefit and the duty owed to the legal order (a participatory principle). There is a friction here between voting as a shield (protecting me) and voting as a sword (sustaining us). If the franchise is primarily about protecting my interests (1), why am I compelled to participate when I might feel my interests are already secure or that participation is futile (5)?

  **The Cheapest Repair:**
  Frame the duty in (5) as the corollary of the protection in (1). Argue that because the state protects the individual's affected interests (per 1), the individual owes the state the legitimacy that comes from participation (per 5). Make the collective duty derivative of the individual right, rather than a separate ground.

  **The Cost:**
  Negligible. This is largely a matter of exposition. However, be careful not to let the collective argument in (5) overwhelm the individual argument in (1), or you risk justifying compulsion for people whose interests are *not* affected, which would violate (1).

  ***

  ### Dissolved Tensions
  The following apparent conflicts dissolve upon inspection and require no repair:

  *   **Expats vs. Prisoners (Claims 2 & 6):** There is no contradiction between stripping long-term expats of the vote while retaining it for prisoners. Under your 'affected interests' principle (1), prisoners remain within the jurisdiction and are subject to coercion and law; expats (by your definition in 2) are not. Claim (6) condemns disenfranchisement of those within the rights-holding class. Expats, under your schema, fall outside that class. The principles align.
  *   **Voting Age vs. Jury Age (Claim 3):** Setting the voting age at sixteen and the jury age at eighteen is not inconsistent. Voting is an assertion of interest (which a sixteen-year-old possesses); jury service is an act of adjudication over others (which may require a higher threshold of maturity or life experience). As long as you do not ground the voting age in 'full adult competence', these different thresholds are compatible.
  *   **Competence Tests vs. Age Limit (Claim 3):** While this looked like a tension in section 2 above, it dissolves if you treat age as a *universal administrative proxy* and competence tests as *individualised barriers*. You can consistently argue that while capacity is relevant (justifying the age limit), individual testing is too susceptible to bias and state manipulation to be permissible for adults. This distinguishes the two mechanisms without contradiction.

  ***

  ### Overall Verdict and Weakest Point

  **Does the package survive intact?**
  Yes, but only if you implement the repair on Claim (6). You cannot maintain that voting is both a legal duty backed by fines and a right one is 'free to refrain from exercising' without redefining what 'refrain' means.

  **Where is the set weakest?**
  Regardless of repairs, the weakest point is the **justification for the sixteen-year cutoff (Claim 3) relative to the Affected Interests principle (Claim 1).**

  This is your vulnerability because it is the point where your principles are most vulnerable to the charge of arbitrariness. If 'affected interests' is your moral engine, excluding affected under-16s requires a secondary justification (agency) that you have not fully articulated in the text provided. Opponents will argue that if you reject competence tests for adults because they are discriminatory or impractical, a blunt age cutoff for sixteen-year-olds is equally discriminatory. You need to ensure your appendix explains why age is a permissible proxy for agency in a way that individual testing is not, otherwise, Claim (1) undermines Claim (3).
