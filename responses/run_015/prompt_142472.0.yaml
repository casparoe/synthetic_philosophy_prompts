answer: |-
  ### The Specification: Requirements for a 25-Year Wild Territory Mandate

  You are asking for a theory that functions as an engineering standard, not a moral revelation. Given the constraints (2% budget, terrible data, 25-year horizon, ecological complexity), a theory that demands precision it cannot get will fail, and a theory that ignores ecological feedback will cause harm.

  Here is the committed list of requirements. I have stripped out the hedging. If a view cannot meet these, it is ineligible for this mandate.

  #### I. Biological and Ecological Coherence
  **1. The Compensation Constraint**
  *   **Requirement:** The theory must model mortality as density-dependent where biology dictates it. It cannot treat a life saved as a life added to the total sum of welfare unless it can demonstrate that the death prevented was *additive* rather than *compensatory*.
  *   **Case:** Mass juvenile mortality. If you vaccinate 1,000 fawns against disease but the carrying capacity remains fixed, 1,000 fawns will die of starvation or predation later. A theory that counts the vaccination as a pure welfare gain without accounting for the substitution of cause-of-death violates this.
  *   **Why:** Ignoring compensation turns welfare interventions into shuffling deck chairs on the Titanic.

  **2. The Trophic Reality Constraint**
  *   **Requirement:** The theory must assign moral weight to outcomes resulting from predator-prey dynamics without demanding the elimination of predation as a default. It must distinguish between *predation as a process* and *suffering within that process*.
  *   **Case:** Removing predators to save prey often causes prey population booms followed by catastrophic starvation (trophic cascade). The theory must evaluate the net welfare of the system, not just the immediate prey.
  *   **Why:** You cannot manage a 200,000 km² territory as a sanctuary for herbivores without creating ecological collapse.

  **3. The Sentience-Weighted Precaution**
  *   **Requirement:** The theory must operate with a sentience probability weighting, not a binary switch. It must prioritize interventions where sentience is high (vertebrates) while acknowledging existing interventions where sentience is uncertain (insect pest control).
  *   **Case:** Insecticides. Agriculture already kills 10^15 insects annually. A theory that demands we stop all insect killing is impossible; a theory that ignores insect suffering entirely is morally blind. The theory must justify *changes* to existing baselines (e.g., switching to less painful pest control) rather than demanding impossible abstention.
  *   **Why:** We have terrible data. Binary sentience thresholds are scientifically false.

  #### II. Institutional and Temporal Stability
  **4. The Withdrawal Hazard Constraint (Exit Safety)**
  *   **Requirement:** Any intervention that creates dependency or alters population dynamics must have a viable exit strategy. If the institution dissolves in 25 years, the state of the animals must not be worse than the counterfactual baseline where the institution never existed.
  *   **Case:** Supplementary feeding. If you feed a population for 25 years, they lose foraging skills or exceed carrying capacity. When funding stops, the crash is worse than the original starvation.
  *   **Why:** This is the specific hazard of time-limited mandates. You are borrowing welfare from the future.

  **5. The Auditability Constraint**
  *   **Requirement:** Recommendations must be falsifiable via phased rollout or control zones. If a theory recommends an intervention whose success cannot be distinguished from noise or natural variation within 10 years, it is rejected.
  *   **Case:** Sterilization programs. If you sterilize predators to reduce predation suffering, but prey populations fluctuate due to drought, how do you know the sterilization worked? The theory must demand metrics that isolate the variable.
  *   **Why:** You have an incentive to report success. Without verifiability, the body becomes a welfare-washing operation.

  **6. The Computability Constraint**
  *   **Requirement:** The theory must yield verdicts using data plausibly available within a decade (remote sensing, population estimates, proxy welfare indicators), not ideal data (individual pain reports, precise sentience maps).
  *   **Case:** Chronic background conditions. You cannot measure the suffering of every animal freezing in a drought. You must use proxies (body condition scores, mortality rates).
  *   **Why:** 2% budget. You cannot afford the data required for precise utilitarian calculus.

  #### III. Ethical Distinctions (Validated vs. Prejudices)
  Here I separate the real constraints from the camp commitments you handed me.

  *   **Status vs. Amount of Status:** *Amount matters.* A theory that gives every animal inviolable rights (status) but cannot adjudicate between saving one bear or 1,000 mice fails the budget constraint. We need aggregative capacity, even if limited.
  *   **Causing vs. Allowing:** *Collapse this distinction.* In a bounded, managed territory, "allowing" a natural disaster when you have the capacity to mitigate is a choice. The distinction is a relic of non-interference dogma.
  *   **Welfare vs. Naturalness:** *Welfare is the goal; Naturalness is a constraint on method.* "Living as its kind lives" is often a euphemism for "suffering naturally." However, destroying "wildness" may reduce long-term welfare (e.g., by removing resilience). Naturalness is instrumental, not intrinsic.
  *   **Individuals vs. Systems:** *Individuals are the unit of concern; Systems are the unit of leverage.* You care about the mouse, but you manage the ecosystem. A theory that focuses only on systems (holism) fails; a theory that ignores systems (atomism) fails.
  *   **Duty vs. Permission:** *Duty to not make it worse; Permission to make it better.* Given the budget and data, a positive duty to maximize welfare is too risky. A negative duty to avoid net-harm (including withdrawal hazard) is mandatory.

  ---

  ### Evaluation of Candidate Requirements

  Your panel's list contains dangerous prejudices. Here is the sorting:

  1.  **"Non-interference is the default."** **REJECT.** This is the *Laissez-Faire* prejudice of traditional environmental ethics. In a territory with waterholes, fire regimes, and feral animals, "non-interference" is a fiction. You are already interfering by existing.
  2.  **"No verdict may trade individuals of one species against another."** **REJECT.** This is the *Rights/Species-Equality* prejudice. Ecology is built on trade-offs. A theory that forbids this cannot function in a food web.
  3.  **"Usable by people who don't know which animals are sentient."** **ACCEPT.** This is a *Epistemic Necessity*. We don't know. The theory must handle uncertainty (see Sentience-Weighted Precaution).
  4.  **"Respect what humans living in the territory value."** **ACCEPT WITH CAUTION.** This is a *Political Constraint*, not an ethical truth. If locals value "trophy hunting," the theory shouldn't endorse it, but it must account for the cost of opposition.
  5.  **"Computable from data we could plausibly have in ten years."** **ACCEPT.** This is a *Feasibility Constraint*. Essential for the 2% budget.
  6.  **"Must not rest on any contested claim in population ethics."** **ACCEPT.** This is a *Stability Constraint*. Do not build a 25-year mandate on the Non-Identity Problem or the Repugnant Conclusion. Use person-affecting views or total views that converge on clear cases.
  7.  **"Same verdict at scale of 10 and 10^9."** **REJECT.** This is the *Mathematical Purity* prejudice. Ecology is non-linear. Managing 10 wolves is not the same problem as managing 10,000. Scale changes the moral geometry (e.g., extinction risk vs. individual suffering).

  ---

  ### The Conflict and The Trim

  **The Incompatibility:**
  There is a fundamental tension between **Maximizing Welfare** (Interventionism) and **The Withdrawal Hazard Constraint** (Sustainability).
  If you intervene aggressively to reduce suffering (e.g., culling predators, vaccinating prey), you alter the system's equilibrium. To maintain that welfare gain, you usually need *permanent* intervention. But your mandate is 25 years, and your budget is 2%. If you stop, the system snaps back, often violently (Withdrawal Hazard).
  Therefore, you cannot have a mandate to *Maximize Welfare*. You can only have a mandate to *Improve Welfare Robustly*.

  **The Trimmed List:**
  I am cutting the requirement to "Reduce Suffering" as a primary directive. It is too dangerous given the data and budget.
  I am replacing it with: **"Minimize Net Suffering Risk."**
  This shifts the burden of proof. You do not act unless you can show the intervention is robust to budget cuts, ecological feedback, and audit error.

  **The Single Eliminative Requirement:**
  **The Withdrawal Hazard Constraint.**
  This is the hammer. It knocks out:
  *   **Naive Utilitarian Interventionism:** They want to fix predation now. They rarely account for the 26th year.
  *   **Rights Views:** They often forbid culling/sterilization, which might be the only way to stabilize populations without long-term suffering.
  *   **Holism:** It often sacrifices individuals for "system health" without verifying if the system actually reduces individual suffering.

  If a theory cannot explain what happens when the money runs out, it is disqualified. This forces the theory to prioritize *resilience* and *systemic fixes* (e.g., habitat modification that lowers density naturally) over *direct aid* (e.g., feeding/vaccinating) which creates dependency.

  ---

  ### Scoring of Candidate Views

  | View Family | Biological Coherence | Withdrawal Safety | Auditability | Computability | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Hands-off Ecological Holism** | **Pass.** Understands cascades/density. | **Pass.** No intervention = no withdrawal hazard. | **Fail.** "Nature knows best" is unfalsifiable. | **Pass.** Requires little data. | **REJECT.** Fails Audit. Ignores individual suffering in status quo. |
  | **Consequentialist Interventionism** (Wild Animal Welfare) | **Fail.** Often ignores compensation/trophic costs. | **Fail.** High risk of dependency/crash post-mandate. | **Fail.** Hard to isolate variables in complex interventions. | **Fail.** Demands data we don't have. | **REJECT.** Too dangerous for 2% budget/25yr limit. |
  | **Rights / Inviolability** | **Fail.** Cannot handle trade-offs (predation). | **Pass.** Forbids risky meddling. | **Pass.** Rules are clear (do not kill). | **Pass.** Binary rules are easy. | **REJECT.** Fails Trophic Reality. Paralyzes management. |
  | **Stewardship / Capabilities** (Trimmed) | **Pass.** Focuses on function/resilience. | **Pass.** Aims for self-sustaining states. | **Pass.** Metrics on population health/behavior. | **Pass.** Uses proxies (body condition). | **ACCEPT.** Best fit for "Robust Improvement." |

  **Final Note:** The Stewardship view wins only if stripped of its "naturalness" fetish. It must be a *Welfare Stewardship*, where the goal is the animal's capability to flourish, but the method is ecological engineering that survives the 25-year cliff. You are not a savior; you are a risk manager for the vulnerable.
