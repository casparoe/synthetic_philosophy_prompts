answer: |-
  This is a sign that self-locating probability stops being well-defined once you leave toy cases with clean bounded populations, indicating that SSA and SIA are incompatible formalizations rather than competing hypotheses about reality.

  The SSA camp is committed to the view that your existence is a fixed background condition, so you must reason as if you are a random sample from a specific reference class of observers; this forces the probability update toward smaller total populations because being early in a small sequence is more likely than being early in a vast one. Their burden is defending why a specific reference class (e.g., "humans" vs. "conscious moments") is privileged without circularity, which is why the argument collapses when the class boundaries blur. The SIA camp is committed to the view that your existence is itself evidence, weighting possible worlds by the number of observers they contain; this cancels the Doomsday update because you are more likely to exist in a world with many observers, but it forces the absurd commitment that you can infer physical constants or universe sizes purely from the fact of your own existence, as seen in the Presumptuous Philosopher.

  This stalemate is permanent because no empirical evidence or thought experiment can adjudicate between them. Any observation you make can be accommodated by SSA by shrinking the reference class or by SIA by adjusting the prior weights, meaning the choice between them is not a matter of discovery but a decision about which normative rules you want your probability calculus to follow. Until there is a consensus on whether indexical information should function as data (SIA) or as a sampling constraint (SSA), the math will continue to spin without converging on a single truth.
