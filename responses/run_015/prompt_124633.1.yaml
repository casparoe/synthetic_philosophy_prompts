answer: |-
  # Seminar Handout: Taxonomy of Narrative Gravity
  **Topic:** Beyond the Skull — Mapping the Distributed Self
  **Context:** Dennett's *Centres of Narrative Gravity* (CNG) extended into social/artifactual scaffolding.

  ### The Decision Tree

  **Root Question:** Is narrative coherence the *sole* constitutive factor of the self (i.e., is there no underlying "substance" required)?

  *   **NO** → **Branch A: Narrative-Plus** (Narrative requires a biological or substantial anchor).
  *   **YES** → **Branch B: Pure Fictionalism** (Narrative is all there is).
      *   **Branch B1: Location of Gravity**
          *   *Intracranial* (Bounded by the skull).
          *   *Distributed* (Extends into social/technical scaffolding).
      *   **Branch B2: Plurality**
          *   *Singular* (One centre per system).
          *   *Plural* (Multiple centres can coexist).
      *   **Branch B3: Temporal Continuity (The Amnesia Test)**
          *   *Continuous* (Break in story = death of self).
          *   *Discontinuous* (Break in story = new centre, but what about "mass"?).

  ---

  ### The Taxonomy (10 Terminal Positions)

  #### 1. The Biological Anchor (Branch A)
  *   **Position:** Narrative is the *function* of the self, but the organism is the *substrate*. You cannot have a story without a specific living body.
  *   **Most Awkward Commitment:** Must deny selfhood to advanced AI or uploaded minds even if they tell perfect stories, simply because they lack meat.

  #### 2. The Classic CNG (Branch B1, Intracranial, Singular, Continuous)
  *   **Position:** Standard Dennett. The self is a useful fictional abstraction generated by a single brain. If the narrative breaks, the centre dissolves.
  *   **Most Awkward Commitment:** Must explain why the *pain* of the fictional self feels ontologically heavier than the fiction itself.

  #### 3. The Fragmented Fictionalist (Branch B1, Intracranial, Plural)
  *   **Position:** A single brain can sustain multiple, non-communicating centres of gravity (e.g., DID viewed metaphysically).
  *   **Most Awkward Commitment:** Moral responsibility becomes fragmented; the "body" is punished for crimes committed by a centre that no longer exists.

  #### 4. The Psychological Successor (Branch B1, Intracranial, Discontinuous, No Mass)
  *   **Position:** Amnesia creates a new centre. The new self inherits the body but not the moral "mass" (guilt/debt) of the previous narrative.
  *   **Most Awkward Commitment:** A murderer can escape moral responsibility simply by losing the memory of the murder.

  #### 5. The Liability Vessel (Branch B1, Intracranial, Discontinuous, Inherited Mass)
  *   **Position:** Amnesia creates a new centre, but the *body* carries the "gravitational mass" (debts/crimes) of the previous centre as a brute fact.
  *   **Most Awkward Commitment:** Punishing an agent for a narrative they genuinely do not recognize as their own (retributive justice without identity).

  #### 6. The Extended CNG (Branch B2, Distributed, Singular)
  *   **Position:** The centre of gravity extends beyond the skull into notebooks, smartphones, and spouses. Remove the scaffold, and the self is diminished or distorted.
  *   **Most Awkward Commitment:** If your spouse dies or your cloud data is wiped, you literally lose part of your selfhood (not just memory, but *agency*).

  #### 7. The Collective Gravity (Branch B2, Distributed, Plural/Shared)
  *   **Position:** A single narrative centre can be distributed across multiple brains (e.g., a tightly coupled team, a band, a marriage). One "We" that functions as an "I".
  *   **Most Awkward Commitment:** If the group dissolves, does the "person" die? Can a corporation be said to suffer phenomenological pain?

  #### 8. The Archival Self (Branch B2, Distributed, Persistence)
  *   **Position:** The narrative gravity resides primarily in the external scaffold. If the brain dies but the archive (writings, AI model, reputation) persists, the centre remains.
  *   **Most Awkward Commitment:** A dead author is more "present" as a self than a living amnesiac with no external records.

  #### 9. The Operational Instrumentalist (Meta-Position)
  *   **Position:** It is incoherent to ask if the centre is "real" or "distributed." The only metric is predictive utility. If treating a network as a self works, it is a self.
  *   **Most Awkward Commitment:** Moral status becomes purely procedural; we could be obligated to treat a thermostat as a person if the model fits.

  #### 10. The Radical Eliminativist (Branch B, Negative)
  *   **Position:** Even "Centre of Narrative Gravity" reifies something that isn't there. There is no centre, only the stream of content.
  *   **Most Awkward Commitment:** Cannot account for the first-person perspective without smuggling in a "viewer" of the stream.

  ---

  ### Limitations & Indistinguishable Pairs

  **1. The Extended vs. Collective Problem (Leaves 6 & 7)**
  The tree struggles to separate **The Extended CNG** from **The Collective Gravity**. If my "self" extends into my spouse (Leaf 6), at what point does that become a shared "We" (Leaf 7)? Empirically, the behavioral output is identical; the distinction relies entirely on an intuitive boundary of "ownership" that the distributed framework is supposed to dissolve.

  **2. The Successor vs. Liability Problem (Leaves 4 & 5)**
  While metaphysically distinct, **The Psychological Successor** and **The Liability Vessel** are practically indistinguishable in a legal context. Both agree the *narrative* is broken; they only disagree on whether the *flesh* carries the ghost's debts. The tree flags this as a moral divergence rather than a metaphysical one, but in practice, they collapse into the same policy debates.

  **3. The Coherence Flag**
  As discussed in your colleague's coffee chat: **The Archival Self (Leaf 8)** risks incoherence. If narrative gravity requires a *teller*, an archive without a brain is just a record, not a centre. This leaf assumes the "field" can exist without a "mass" to generate it, which may violate the physics metaphor Dennett relies on. Use this node to provoke debate on whether gravity can exist without a planet.
