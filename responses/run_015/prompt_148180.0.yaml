answer: |-
  # TAXONOMY OF CULTURAL CAUSALITY

  **ROOT CLAIM:** Values explain historical outcomes (e.g., program failure, rise of capitalism).

  **Q1: Do values reduce to material conditions?**
  *   **YES:** Values are epiphenomenal; material base determines cultural superstructure.
      *   **LEAF 1: Marxist Superstructure**
          *   *Status:* Occupied (Historical Materialism).
          *   *Awkward Commitment:* You must argue the nonprofit's "culture" is just a rationalization of resource constraints or power dynamics. If you claim culture *caused* the failure independently, you contradict this leaf.
  *   **NO:** Values have independent causal power irreducible to economics/materiality.
      *   **Q2: Do values operate INSIDE agents (psychological motivation) or OUTSIDE agents (institutional/selection environment)?**
          *   **INSIDE:** Values function as drivers of individual action.
              *   **Q3: Do values require *Verstehen* (interpretive understanding of meaning) or can they be treated as Variables (parameters in a causal model)?**
                  *   **VERSTEHEN:** Values are irreducible meanings; causality requires understanding the actor's subjective state.
                      *   **LEAF 2: Weberian Interpretive Sociology**
                          *   *Status:* Occupied (Max Weber, *The Protestant Ethic*).
                          *   *Awkward Commitment:* You must claim "salvation anxiety" is not just a preference but an ontologically distinct motive that cannot be modeled as utility maximization. You cannot quantify the culture without destroying the explanation.
                  *   **VARIABLES:** Values are preferences/constraints plugable into a utility function.
                      *   **LEAF 3: Unnamed Rational-Choice Culturalism**
                          *   *Status:* Largely Empty / Implicit in Neoclassical extensions.
                          *   *Awkward Commitment:* You treat "inner-worldly asceticism" as a taste parameter (like a preference for leisure). This flattens Weber's thesis into "Calvinists had different utility functions," losing the historical specificity Weber argued was crucial.
          *   **OUTSIDE:** Values function as environmental selectors or constitutive rules.
              *   **Q3: Do values select via Elective Affinity (*Wahlverwandtschaft*) or act as Formal Causes (defining what rationality *is*)?**
                  *   **ELECTIVE AFFINITY:** Values resonate with material interests, selecting certain structures over others without direct mechanical push.
                      *   **LEAF 4: Weber's Elective-Affinity View**
                          *   *Status:* Occupied (Weber's later clarifications).
                          *   *Awkward Commitment:* You deny direct causation (values don't *force* capitalism) but still claim culture explains the outcome. This sounds like correlation with extra steps unless the "affinity" mechanism is rigorously defined.
                  *   **FORMAL CAUSE:** Values constitute the ontology of the activity; they define the rules of the game such that the activity itself is different.
                      *   **LEAF 5: Unnamed Formal-Causal Culture View**
                          *   *Status:* Likely Empty / Theoretical Only.
                          *   *Awkward Commitment:* You claim capitalism in Calvinist regions isn't just capitalism-plus-culture but ontologically different capitalism. This makes empirical testing nearly impossible (incommensurability problem).

  ***

  # STRUCTURAL AMBIGUITIES & COLLAPSE RISKS

  **1. Inside vs. Outside (The Internalization Problem)**
  The tree assumes a clean split between psychological motivation (Inside) and institutional environment (Outside). In reality, culture works by external norms becoming internalized habits (habitus).
  *   **Collapse Risk:** If "Outside" values only work by being internalized, Leaf 4 (Elective Affinity) collapses into Leaf 2 (Interpretive Sociology). If "Inside" values only work because institutions reward them, Leaf 2 collapses into Leaf 4.
  *   **Flag:** Your mom's claim likely conflates these. Is the culture failing because staff *believe* the wrong things (Inside) or because the org structure rewards the wrong behaviors (Outside)? The tree forces a choice that reality may not support.

  **2. Elective Affinity vs. Institutional Embedding (The Outside Split)**
  The distinction between Leaf 4 (Affinity) and Leaf 5 (Formal Cause) is precarious.
  *   **Collapse Risk:** If "Elective Affinity" is just a poetic way of describing institutional path dependence, it collapses into a standard institutionalist explanation (not strictly cultural). If "Formal Cause" is just strong institutional embedding, it collapses into Leaf 4.
  *   **Flag:** Leaf 5 is marked "Likely Empty" because few theorists dare claim ontological incommensurability anymore. Most "culture causes X" arguments are actually Leaf 4 arguments dressed up as Leaf 5 to sound more profound.

  **3. Variables vs. Verstehen (The Inside Split)**
  *   **Collapse Risk:** Modern behavioral economics attempts to bridge Leaf 2 and Leaf 3 by modeling "meaning" as variables (e.g., identity utility). If successful, Leaf 2 becomes obsolete. If unsuccessful, Leaf 3 remains a category error.

  ***

  # CONDITIONS FOR CHANGING THE TREE

  1.  **If Elective Affinity collapses into Institutional Embedding:** If "affinity" is proven to be merely a mechanism of institutional selection (fitness landscapes) without requiring subjective meaning, the entire "Outside" branch should be relabeled "Selectionist Environmentalism" and removed from "Cultural Causality" entirely. This would move Weber entirely to the "Inside" branch.
  2.  **If Material Reductionism admits feedback loops:** If Marxist theory admits superstructure can react back on base with independent causal power (Engels' later letters), Leaf 1 is no longer a terminal leaf but a feedback loop connecting to the "No" branch. The tree would need to become a cycle, not a hierarchy.
  3.  **If Formal Cause is occupied:** If a credible empiricist demonstrates how to test for "ontologically different capitalism" without resorting to hermeneutics, Leaf 5 becomes occupied. Until then, it remains a philosophical placeholder used to shield claims from falsification.

  ***

  # WEAKEST LINKS IN REASONING

  1.  **The Inside/Outside Dichotomy:** This is the shakiest cut. Culture is rarely *just* in the head or *just* in the rules; it is the interface between them. By forcing a split, the tree may artificially clarify a mechanism that is fundamentally recursive. A program failure attributed to culture is almost always a failure of alignment between Inside (beliefs) and Outside (incentives), which this tree treats as mutually exclusive paths.
  2.  **The "Unnamed" Leaves:** Labeling Leaf 3 and Leaf 5 as "Unnamed" assumes no one holds these positions explicitly. However, many management consultants operate implicitly in Leaf 3 (treating culture as a leverable variable) and Leaf 5 (claiming their framework changes the ontology of work). The tree might be missing a "Pragmatic/Instrumentalist" branch that doesn't care about philosophical consistency, which is likely where your mom's consultants are operating.
  3.  **Weber as Monolith:** Using Weber as the running example risks conflating his early methodological writings (Verstehen) with his substantive historical claims (Elective Affinity). He might occupy Leaf 2 and Leaf 4 simultaneously, suggesting the tree's mutual exclusivity is flawed regarding historical actors even if it holds for logical positions.
