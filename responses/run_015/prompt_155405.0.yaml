answer: |-
  **Setting:** *The kitchen in our shared flat in Neukölln. It's Sunday morning. I'm making coffee; Leo's leaning against the counter, scrolling on his phone.*

  **Me:** So, I was thinking about our argument yesterday. About the crosswalk.

  **Leo:** The one where you basically sprinted across the street because it was 3 a.m. and there wasn't a soul in sight?

  **Me:** Exactly. Look, I get it. It's the rule. But I still don't buy that it's *moral*. It's a coordination norm. Like driving on the right side of the road. If everyone agreed to drive on the left, that would be fine too. The morality isn't in the side, it's in the agreement. So if I cross on red with zero cars, I'm not violating an agreement because there's no one to coordinate with.

  **Leo:** I see where you're coming from. But I think you're missing the opacity factor.

  **Me:** The what?

  **Leo:** Opacity. As an outsider, even after a few months, you can't fully see why a norm exists. You see "no cars," so you think "safe to cross." But you don't see the history, or the social signal you're sending to the person watching from the window. When a norm is opaque to you—when you can't tell if it's practical or deeply moral—deference is the safer bet.

  **Me:** But deference isn't the same as moral obligation. That's my point. I'm willing to defer to keep the peace, sure. But don't tell me I'm *wrong* in a moral sense. Like, if I don't tip 10% here because service is included, am I stealing? Or just opting out of a custom?

  **Leo:** It's not about stealing. It's about trust. Berlin runs on a specific kind of social trust. When you queue properly—or wait for the green man—you're signaling that you respect the system everyone else is buying into. If you opt out because you've decided it's irrational, you're basically saying your judgment overrides the collective one.

  **Me:** Okay, but that assumes the collective judgment is morally weighted. What if it's just... habit? If I'm standing in line at the bakery and someone lets me go ahead because I'm new, is queing still a moral duty then? Or is it just efficiency? I feel like when you say "opacity demands deference," you're asking me to blindly follow rules I don't understand.

  **Leo:** Not blindly. Just cautiously. Think about it. If a norm *is* moral—like, say, respecting someone's privacy—and you treat it like a mere coordination norm, you cause harm. If a norm is *just* coordination and you treat it as moral, you're just a bit stiff. The cost of being too rigid is low. The cost of being too loose when you don't know the stakes is high.

  **Me:** I get the risk assessment. But I think opacity should mean I suspend judgment, not that I assume guilt. Like, I shouldn't feel *bad* about crossing the street. I should just acknowledge that locally, it reads as rude. There's a difference between "this is inefficient" and "this is unethical."

  **Leo:** Maybe. But ethics isn't just internal. It's relational. If your action reads as unethical to the people around you, then functionally, it is. You're disrupting the social fabric. Even if you didn't mean to.

  **Me:** That feels like a trap. Then morality is just whatever the majority perceives? So if everyone thought jaywalking was murder, it would be?

  **Leo:** No, not murder. But maybe a breach of trust. Look, I'm not saying you're a bad person. I'm saying that when you move here, you enter a contract. Part of that contract is accepting that some things here are definately going to feel weirdly strict to you.

  **Me:** *[laughs]* Even you typed "definately" wrong just now.

  **Leo:** *[looks at phone]* Dammit. Autocorrect. But you know what I mean.

  **Me:** I do. Look, I'll stop fighting the Ampelmännchen. I'll wait for the green man. But I'm still not queing like a British person at the U-Bahn. Some things are just chaos.

  **Leo:** As long as you're not cutting in front of someone with a stroller, we're good. Just... try to see the deference as respect, not submission.

  **Me:** Fine. Respect I can do. Moral guilt? Still working on that.

  **Leo:** I'll take the win. Pass me the coffee?

  **Me:** Here. Just don't tell me I'm holding the mug wrong.
