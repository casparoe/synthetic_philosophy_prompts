answer: |-
  Your three-way cut is valid, and Type C identifies a genuine logical category distinct from standard approximation or error. The nearest established concepts are **Essential Idealization** and **Minimal Model Explanation**, often discussed in the context of **Universality**. However, these terms focus on the explanation rather than the assumption's status. To capture your specific configuration—where the assumption is a placeholder for a family of incompatible mechanisms—I propose we classify Type C as **Universality Idealization**.

  This concept fits your cases where the idealization (infinity, representative agent, well-mixed) is not a distortion to be corrected but a mathematical limit that isolates a behavior common to an entire equivalence class of systems. In Type A (approximation), the assumption is false but close enough; correcting it improves accuracy. In Type B (load-bearing falsehood), the assumption is false and essential; correcting it destroys the result. In Type C, the assumption is false of any individual system but true of the *class* defined by the irrelevance of micro-details. The infinite population model does not describe any real population; it describes the attractor state toward which many different structured populations converge.

  Regarding your second question, the split between robustness (concretions agree) and invariance (concretions disagree but yield the same macro-result) is superficial. Both rely on the same logical structure: **insensitivity**. Whether the heterogeneous agents agree on the mechanism or differ wildly, the success of the representative agent model entails that the specific heterogeneity is irrelevant to the outcome. The entitlement is identical in both cases: you are licensed to believe the macroscopic constraint, but you are forbidden from believing the micro-mechanism specified in the ideal model. The model tracks a structural constraint on the system's phase space, not a causal chain within it.

  On truth-status, the defensible position is that Type-C assumptions are **limit claims** true of an equivalence class rather than any instance. To say "the population is infinite" is to say "the system behaves as if details of finitude are irrelevant." This is not a fiction, nor a capacity claim about a single object. It is a claim about the topology of the model space. If you treat it as a capacity (Cartwright), you risk reifying a mechanism that doesn't exist. If you treat it as false (fictionalism), you lose the explanatory power of the convergence. It is true *simpliciter* of the universality class. If a real system falls into that class, the idealization applies to it relationally, not intrinsically.

  Your A/B/C taxonomy holds up under scrutiny because it maps onto three distinct relationships between model and world. Type A is **approximation** (error decreases with fidelity). Type B is **idealization-as-distortion** (error is structural). Type C is **idealization-as-abstraction** (fidelity decreases coverage). Collapsing C into B would force you to treat successful universal models as failures because their premises are false. Collapsing C into A ignores that adding detail often reduces generality rather than increasing accuracy. The distinction does real work: it tells you whether adding detail is an improvement (A), a necessity (B), or a distraction (C).

  Consider a hard boundary case: **Mean-Field Theory** in statistical mechanics applied to social networks. In some physical systems, mean-field assumptions (ignoring spatial correlation) yield critical exponents that match reality (Type C). In others, specifically low-dimensional systems, mean-field predictions fail catastrophically near critical points; the spatial structure matters fundamentally (Type B). What turns on this line? If you are in Type C, measuring the network structure is a waste of resources; the universality class is determined by symmetry and dimension alone. If you are in Type B, ignoring the network structure renders the model useless. The difference is empirical: you must test whether the system's behavior is sensitive to the detail being idealized. If dialing the detail back in changes the qualitative result, you were in Type B. If the result persists across different specifications of the detail, you are in Type C.

  This leads to the methodological instruction. The standard demand to "de-idealize" is incoherent for Type C. De-idealization implies moving from false to true assumptions to improve the model. In Universality Idealization, moving to true assumptions (specific structure, finite size) restricts the model's scope without necessarily improving its predictive power for the target phenomenon. It trades generality for specificity. Therefore, the instruction for Type C is not de-idealization but **Classification**. The modeler's task is not to make the assumptions realistic but to demonstrate that the target system belongs to the universality class defined by the idealization. You do not fix the infinite population assumption; you prove that finite populations behave as if they were infinite regarding the trait in question.

  Consequently, when you encounter a Type-C assumption, do not treat it as a liability to be repaired. Treat it as a hypothesis about irrelevance. The work lies in showing that the details you are ignoring are indeed irrelevant to the phenomenon you are explaining. If you succeed, the unrealistic assumption becomes the model's greatest strength, marking the boundary of a domain where mechanism does not matter. If you fail, you slide into Type B, and the model collapses. The risk is not falsehood; the risk is misclassification.
