answer: |-
  **Brainstorming Candidates**

  1.  **Hospital Wait Times:** Target: Patient Recovery. Proxy: Time-to-Discharge. Optimization: Discharge faster. *Drop:* Too easily framed as negligence or cutting corners (vice). Hard to maintain "good faith" when patients suffer immediately.
  2.  **School Reading Scores:** Target: Literacy. Proxy: Test Scores. Optimization: Teach to test. *Drop:* You explicitly flagged this. It often relies on the "correlation was spurious" escape (tests never measured real literacy).
  3.  **Housing Arrears Management:** Target: Household Resilience (ability to withstand income shocks). Proxy: Monthly Rent Delinquency Rate. Optimization: Eliminate arrears instantly via micro-loans. *Commit:* This fits. The proxy is causally downstream (resilient households don't fall behind). The fix (loans) is helpful, not deceptive. The failure is skill atrophy, not fraud.

  **The Scenario**

  Consider a housing nonprofit managing supportive units for previously homeless tenants. The true target is **Household Resilience**: the capacity to navigate income shocks without losing housing. The best available proxy is **Monthly Rent Delinquency Rate**, which is causally downstream (resilient households pay on time). To optimize this metric, the org implements an automatic "bridge loan" policy: any tenant facing arrears receives an immediate, no-questions-asked micro-loan to clear the balance before the month closes. Staff act in good faith, believing financial stability prevents eviction. For two years, the dashboard shows 0% delinquency and 0% evictions; tenants feel secure, and the target (Resilience) arguably improves as stress drops. However, because tenants never experience the consequence of arrears, they never learn the critical skill of negotiating payment plans with landlords or budgeting for irregularities. In Year 3, a systemic income shock hits that exceeds the micro-loan cap. Tenants, lacking practiced negotiation skills and accustomed to automatic bailouts, face immediate eviction proceedings. The dashboard remained perfect until the moment the structural support vanished, at which point the target collapsed.

  **Mechanism Analysis**

  This is the **Causal Version** of Goodhart's Law. Initially, low delinquency was informative *because* it was caused by resilience. By optimizing the proxy (forcing delinquency to zero via loans), the organization severed the causal link: low delinquency was now caused by *org liquidity*, not tenant resilience. I deliberately excluded the **Behavioral Version** (where agents lie or game the metric); here, the metric is reported truthfully. I also excluded the **Extremal Version** (selecting on noise); the data wasn't noisy, it was genuinely achieved, just via the wrong cause. The boundary blurs slightly with "behavioral" because the tenants' behavior changed, but only because the incentive structure altered their learning environment, not because they tried to deceive.

  **Collapse Test**

  If you remove the **automatic intervention** feature—say, loans require a case manager review—the case degenerates. Case managers would notice the pattern of dependency and stop approving loans for capable tenants. The proxy (delinquency) would rise slightly, signaling the loss of resilience, allowing correction. Without the automation masking the signal, the structural blindness disappears, and we return to a standard management challenge, not a Goodhart failure.

  **Steelman the Skeptic**

  A skeptic argues: "This isn't Goodhart's Law; it's just bad engineering. You should have measured 'Tenant Financial Literacy' alongside delinquency." This fails because Financial Literacy is unmeasurable in real-time without high-burden surveys that degrade trust (Constraint 7). More critically, literacy is not resilience; a literate tenant can still fail under shock. The proxy was indeed the *best available* measure at the start. The failure wasn't choosing the wrong metric, but assuming the metric could be optimized directly without destroying the underlying capacity it signaled.

  **Advice for Your Board**

  Stop trying to find a "cheat-proof" metric; instead, treat the dashboard number as a lagging indicator of past health, not a lever for current action. Tie funding tranche releases to qualitative audits of *capacity building* (e.g., tenant skill acquisition) rather than short-term outcome spikes, accepting that real resilience looks messier on a dashboard than artificial stability.
