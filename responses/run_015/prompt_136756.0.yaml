          *   Progress = Reduced latency, fewer bugs.
          *   Gatekeeping = Code Review (necessary).
      *   *Conclusion:* Summarize why this restores rationality without denying the Kuhnian shift.

  9.  **Self-Correction/Polishing:**

      *   *Check:* Did I address the "Rosetta-residue test" specifically? Yes, need to make sure I define whether Duck-Rabbit is soft or hard.
      *   *Analysis:* Duck-Rabbit is *Soft* incommensurable because we can point to the ink. But the *experience* is Hard. Science is often *Hard* because the "ink" (sensory data) isn't accessible, only the interpreted data is.
      *   *Wait, actually:* The Duck-Rabbit image *is* the neutral ground. We can agree on the pixels. In science, we often can't agree on the "pixels" (e.g., "Is this a planet or a star?" depends on the theory). So Science is *harder* than Duck-Rabbit in terms of neutral language.
      *   *Dave's Error:* He assumes because the *experience* is hard-incommensurable, the *evaluation* must be too. But we can step outside the experience in science (run a new experiment) in a way we can't with a static drawing.
      *   *Tone Check:* Keep it analytical, not dismissive. Dave is making a common philosophical move (taking a metaphor literally).

  10. **Final Plan:**
