  4.  **Task 2 & 3: Disanalogies and the Rosetta-Residue Test:**

      *   *Rosetta-Residue Test:* Can we describe the ink neutrally? Yes ("curved line here"). Can we describe scientific data neutrally across paradigms? Sometimes (pointer readings), but often theory-laden ("current flow" vs "aether wind").
      *   *Verdict:* The Gestalt switch models *Hard* Incommensurability (no neutral ground *in the experience*), but the physical paper provides a *Soft* ground (we can agree on pixels). In science, the "paper" (raw sensory input) is rarely accessible; we only have theory-laden observations.
