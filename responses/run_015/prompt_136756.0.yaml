      *   *Dave's Usage:* He's using it to support *strong* relativism (hard incommensurability, no rational choice).
      *   *Kuhn's Actual View:* Kuhn used the Gestalt analogy but later walked it back slightly. He believed in progress (puzzle-solving ability), even if not truth-approximation in a correspondence sense. Dave is pushing harder than Kuhn did.

  3.  **Task 1: Correspondence Table:**

      *   *Source (Gestalt):* Ink on paper, Duck/Rabbit aspects, The Flip, Inability to see both, Expectation/Context, Bistable Design.
