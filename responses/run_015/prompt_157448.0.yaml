  Here is a complete design for the simulation, tuned for your constraints and learning goals.

  # Activity Title: The Oakhaven Inventory

  ## The Setup and Fiction
  **The Fiction:** The class is simulating the lifecycle of records for "Oakhaven," a mid-sized industrial town (1920–1980).
  **The World:** Oakhaven has two populations:
  1.  **Property Holders:** Own land, pay annual taxes, stable addresses.
  2.  **Contract Laborers:** Rent rooms, paid cash, move frequently for work.

  **The Physical Space:**
  *   **The Wall:** One large wall covered in a grid of masking tape (representing "The Public Archive"). It has limited squares (e.g., 30 squares).
  *   **The Back Room:** A table or corner off to the side (representing "Uncataloged Intake").
  *   **The Catalog:** A stack of blank index cards at the front (representing "The Finding Aid").

  **Materials:**
  *   100 Index cards (two colors if possible, e.g., White for Property, Yellow for Labor, but don't tell them the colors mean anything yet).
  *   Markers.
  *   Masking tape.
  *   A printed "Budget Sheet" for each group.

  ## The Roles (18 Students, 3 Groups of 6)

  **Group 1: The Town Clerks (Round 1)**
  *   **Task:** Generate records for one "fiscal year" (simulated 10 minutes).
  *   **Info They Have:** A list of 20 Property Holders (names/addresses) and a list of 20 Laborers (names only).
  *   **Constraint:** You are understaffed. You earn "Department Points" for every **Tax Form** (Property) completed. You get **Zero Points** for recording Laborers unless they file a **Grievance** (complaint/crime). You run out of ink/cards if you write too much.
  *   **Gap Produced:** Property holders generate routine data. Laborers generate data *only* when they disrupt order.

  **Group 2: The Archivists (Round 2)**
  *   **Task:** Process the cards Group 1 made into the "Public Archive" (The Wall).
  *   **Info They Have:** The stack of cards from Group 1. A roll of tape.
  *   **Constraint:** The Wall has only 30 squares. You must create a **Catalog Card** for every item you put on the Wall. Writing a Catalog Card takes 2 minutes. Putting a card on the Wall takes 1 minute. You have 20 minutes total.
  *   **Crucial Mechanic:** Property cards come with a pre-printed "File Number" (written by Group 1). Labor cards do not. *Instruction:* "Prioritize items with File Numbers for the Wall. They are easier to index."
  *   **Gap Produced:** The "Legibility Dividend." Property cards get on the Wall and into the Catalog. Labor cards end up in the "Back Room" (box) because they lack numbers and take too long to catalog.

  **Group 3: The Historians (Round 3)**
  *   **Task:** Answer the research question: *"What was the primary economic activity of Oakhaven residents between 1920-1980?"*
  *   **Info They Have:** Access **only** to the Wall and the Catalog. They are *not* allowed to look in the "Back Room" box unless they find a reference to it in the Catalog (which they won't).
  *   **Constraint:** 15 minutes to write a 3-sentence conclusion.
  *   **Gap Produced:** They conclude Laborers didn't exist or were economically irrelevant because the "Official Record" says so.

  ## The Rules & Scoring
  *   **Clerks:** Maximize Tax Forms. (Incentivizes bureaucratic utility).
  *   **Archivists:** Maximize items on the Wall *with* Catalog Cards. (Incentivizes efficiency/legibility).
  *   **Historians:** Graded on "Confidence" and "Use of Evidence." (Incentivizes over-claiming based on available data).

  ## The Debrief Strategy
  Do not lecture. Ask the Historians to read their conclusion. It will be wrong. Ask the Clerks why they didn't write more about Laborers. Ask the Archivists why the Box is full. Connect their *constraints* to the *outcome*.

  ---

  # Honest Assessment: Risks & Limitations

  **(a) What will predictably go wrong:**
  1.  **The "Hero" Clerk:** A student in Group 1 might realize the game is rigged and spend all their time writing grievance reports for Laborers to "save" them.
      *   *Fix:* Enforce the "Department Points" strictly. If they don't produce 10 Tax Forms, tell them their department faced budget cuts and half their records were shredded (remove half their cards) before Group 2 gets them. This reinforces Claim 1 (bureaucratic utility).
  2.  **The Moral Lecture:** Students might feel guilty about ignoring the Laborers.
      *   *Fix:* Constantly reiterate the *constraints*. "You didn't have time." "You didn't have the forms." "You were following the manual." Normalize the behavior as rational within the system.
  3.  **Claim 3 (Legibility) might feel weak:** If Group 2 has enough time to catalog everything, the skew disappears.
      *   *Fix:* Tighten the time limit for Group 2. 20 minutes is tight for 40+ cards. If they finish early, introduce a "Budget Cut" mid-round: "Stop. You lost half your tape. You can only keep the top 15 items on the Wall." They will naturally keep the neat, numbered Property cards.

  **(b) What the activity cannot reproduce:**
  1.  **Real-Time Compounding:** The game compresses 60 years into 90 minutes. Students won't *feel* the decades of accumulation, only the single round of selection.
      *   *Handle in words:* In debrief, explain that Round 2 happens *every single year*. The Wall gets thicker, the Box gets deeper. The "File Number" advantage compounds over decades, not just one session.
  2.  **The "Villain" Temptation:** It is hard to simulate "well-meaning" bias without students feeling like *they* were the villains.
      *   *Handle in words:* Explicitly state: "None of you were racist or classist. You were efficient. The system rewarded efficiency over truth. That is why it is hard to fix."

  ---

  # Structured Deliverables

  ### Timeline Table

  | minute_range | what_participants_do | what_facilitator_does | mechanic_doing_the_work | intended_failure_mode |
  | :--- | :--- | :--- | :--- | :--- |
  | **00-10** | Listen to briefing. Get assigned roles. Receive packets (names/lists). | Set the tone: "You are professionals doing a job under constraints." Distribute materials. | **Framing:** Establishing the "No Villain" rule. | Students think this is a morality play. |
  | **10-30** | **Round 1 (Clerks):** Write records on index cards. Property = Tax Forms. Labor = Grievance Reports. | Enforce time limits. Award "Points" publicly for Tax Forms. Ignore Labor records unless they are grievances. | **Constraint:** Points for bureaucracy, not truth. | Clerks ignore Laborers to maximize points (Claim 1). |
  | **30-50** | **Round 2 (Archivists):** Sort cards. Tape to Wall or put in Box. Write Catalog Cards. | Enforce Wall Space limit (30 squares). Enforce "File Number Priority" rule. | **Constraint:** Space + Legibility (File Numbers). | Archivists wall the Property cards, box the Labor cards (Claim 3). |
  | **50-65** | **Round 3 (Historians):** Analyze Wall/Catalog. Write 3-sentence conclusion. | Restrict access to the Box. Prompt for "Definitive Answer." | **Constraint:** Access limited to Cataloged material. | Historians conclude Laborers were irrelevant (Claim 2). |
  | **65-90** | **Debrief:** Reveal the Box contents. Compare Conclusion to Reality. Map to Claims. | Facilitate discussion. Do not lecture until the end. Connect mechanics to theory. | **Revelation:** Visualizing the skew on the wall vs. box. | Students realize the "Truth" was lost to process, not malice. |

