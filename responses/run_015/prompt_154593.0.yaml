      *   **Case 2: Free-Tier Sampling (Cost Cutting)**
          *   *Context:* Dropping data to save money.
          *   *Risk:* High "Ghost User" creation. Bias against lower-income users (free tier).
          *   *Procedure Outcome:* Fail on Step 1 (Attribution) and Step 4 (Deletion Asymmetry).
          *   *Fix:* Stratified sampling or metadata-only logging.

      *   **Case 3: Cancellation Reason (Free Text)**
