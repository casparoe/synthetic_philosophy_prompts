answer: |-
  Here is the procedure, the register schema, and the run-through.

  ### The Telemetry Impact Assessment (TIA)
  **Timebox:** 20 Minutes. **Owner:** Implementing Engineer. **Frequency:** Per Event Type / Quarterly Retention.

  **Instructions:** Answer the five questions below. If you cannot answer a question with the "Acceptable Evidence" listed, you cannot ship. Mark the decision in the **Absence Register** (see below) before merging.

  #### 1. The Attribution Check (Ghost Users)
  *Question:* Who is the subject of this event, and can we link this event to a specific, identifiable record for them in every instance?
  *   **Acceptable Evidence:** A foreign key to a `user_id`, `patient_id`, or `device_id` that is present 100% of the time.
  *   **Hard Stop (No):** If >5% of events will fall into an "anonymous" or "unknown" bucket.
  *   **Escalation (PM):** If the subject is a "ghost" (e.g., aggregate traffic) and we need to budget engineering time to make them visible.
  *   **Why:** Prevents creating classes of users who only exist as residuals.

  #### 2. The Propagation Chain (Silence Inheritance)
  *Question:* If this event is dropped upstream (client SDK, network, load balancer), does the downstream schema allow us to distinguish "nothing happened" from "we lost the data"?
  *   **Acceptable Evidence:** A sequence ID or heartbeat mechanism that allows downstream to detect gaps. OR: Explicit documentation that this metric is a "lower bound only."
  *   **Hard Stop (No):** If a silent drop upstream will be interpreted downstream as a zero-count (success) rather than a null (unknown).
  *   **Why:** Prevents downstream teams from inheriting upstream silence as truth.

  #### 3. The Minimization Check (Load-Bearing Absence)
  *Question:* Does this field contain data that *should not* exist in our warehouse, even if it is useful? (PII, PHI, free-text reasons, biometric data).
  *   **Acceptable Evidence:** A schema validation rule that rejects the field OR a hash/salt that prevents reverse engineering.
  *   **Hard Stop (No):** If the field contains unstructured text that could reasonably contain sensitive data (medical, financial, political) and is stored at full fidelity.
  *   **Escalation (Legal/Privacy):** If the business value requires the data but compliance forbids it. The engineer cannot make this tradeoff.
  *   **Why:** Some absences are safety features. Logging everything is a liability.

  #### 4. The Recourse Check (Deletion Asymmetry)
  *Question:* If the subject of this data wants it deleted or corrected, do they have the same ability to request that as our most powerful users?
  *   **Acceptable Evidence:** The subject has a UI path or support channel to request deletion that is documented and tested.
  *   **Hard Stop (No):** If the data is collected on a user class (e.g., free tier, patients) that has no mechanism to request deletion, while admin data does.
  *   **Escalation (Product Lead):** If the cost of building the deletion mechanism exceeds the value of the data.
  *   **Why:** Prevents building a surveillance system for those with the least power to contest it.

  #### 5. The Model Boundary (Future Use)
  *Question:* If this data is used to train a model in 2 years, what behavior will it penalize?
  *   **Acceptable Evidence:** A written sentence: "This data will optimize for [X], which may penalize [Y]."
  *   **Escalation (Data Science Lead):** If the penalty falls on a protected class or a vulnerable user group (e.g., no-shows, late payers).
  *   **Why:** Archives become rules. You are writing the rules for a future system.

  ---

  ### The Absence Register
  **Location:** `/docs/data/absence_register.md` (Version Controlled)
  **Purpose:** To ensure gaps are read as *decisions*, not *accidents*.

  | Date | Field/Event | Decision | Rationale (TIA Step) | Owner | Review Date |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 2023-10-27 | `cancellation_reason_text` | **DO NOT LOG** | Step 3 (Minimization). Risk of PHI. | [Eng Name] | 2024-01-27 |
  | 2023-11-02 | `free_tier_full_session` | **SAMPLED** | Step 4 (Recourse). Full logging blocked; metadata only. | [Eng Name] | 2024-02-02 |

  ---

  ### Limitations of This Procedure
  1.  **It cannot calculate value.** It can tell you if something is dangerous, not if it's worth the risk. That is a Product/Business decision.
  2.  **It relies on honesty.** If an engineer marks "Acceptable Evidence" without checking, the procedure fails.
  3.  **It is not legal advice.** Step 3 flags risk; Legal must validate the flag.
  4.  **It creates bureaucracy.** This is intentional. Friction prevents accidental harm.

  ***

  ### Running the Procedure on Your Cases

  #### Case 1: "Bulk Reschedule" Event (Enterprise Admins)
  **Context:** A button only visible to hospital admins to move 50+ appointments at once.

  *   **Step 1 (Attribution):** **PASS.** Subject is the Admin. `admin_id` is required.
  *   **Step 2 (Propagation):** **FAIL.** *Critical.* If the bulk job fails halfway, do we log 50 successes or 0? If we log one "Bulk Event," and it drops in transit, downstream sees 0 reschedules. The 50 patients affected become "Ghost Users" regarding this change.
      *   *Fix:* Log a `batch_id` and individual `appointment_id` links, or a heartbeat count.
  *   **Step 3 (Minimization):** **PASS.** Admin action, no patient PHI in the event itself.
  *   **Step 4 (Recourse):** **PASS.** Admins have account managers.
  *   **Step 5 (Model Boundary):** **ESCALATE TO PM.** "Optimizing for bulk efficiency may penalize complex patient needs that don't fit bulk patterns."
  *   **Verdict:** **Do not ship** until Step 2 is fixed. The silence inheritance risk is too high; a dropped batch event looks like "no changes made," hiding a potential outage.

  #### Case 2: Cost Proposal (Sample Free-Tier to 2%)
  **Context:** Drop 98% of free-tier session logs to save on ingestion costs.

  *   **Step 1 (Attribution):** **FAIL.** You are intentionally creating "Ghost Users." The 98% dropped become the "Total sessions minus attributed" residual. You cannot distinguish them from technical dropouts.
  *   **Step 2 (Propagation):** **PASS.** It's an intentional drop, documented.
  *   **Step 3 (Minimization):** **PASS.** Reducing data is good for privacy.
  *   **Step 4 (Recourse):** **FAIL.** Free-tier users likely already have high friction for support. If you sample them, you effectively remove their ability to prove their usage history if a dispute arises. Admins (paid) keep 100% logging; Free users get 2%. This is Deletion Asymmetry in reverse (Retention Asymmetry).
  *   **Step 5 (Model Boundary):** **HARD STOP.** Training a "smart scheduler" on data that systematically excludes 98% of free users will bias the model against free-tier behavior patterns.
  *   **Verdict:** **No.**
  *   **Cheapest Thing That Passes:** Log **metadata only** for the 98% (timestamp, event type, user_id), drop the payload (URL, click coordinates, duration). This preserves the *count* (fixing Step 1 & 5) and the *attribution* (fixing Step 4) without the storage cost of the full blob. It costs more than your proposal, but less than full fidelity.

  #### Case 3: Free-Text Cancellation Reason (The VP Dashboard)
  **Context:** Logging `cancellation_reason` (string) forever. Feeds VP dashboard. High PHI risk.

  *   **Step 1 (Attribution):** **PASS.** Linked to patient/appointment.
  *   **Step 2 (Propagation):** **PASS.** Standard ETL.
  *   **Step 3 (Minimization):** **HARD STOP.** Free text from patients regarding cancellations *will* contain medical details ("Chemotherapy appointment," "Mental health crisis," "Miscarriage"). Storing this at full fidelity in a general telemetry warehouse is likely a GDPR/HIPAA violation.
  *   **Step 4 (Recourse):** **FAIL.** Patients (phone number only) likely do not know they can request deletion of this specific text field. Admins do.
  *   **Step 5 (Model Boundary):** **ESCALATE.** Model will learn to associate medical crises with "flakiness."
  *   **Verdict:** **You cannot ship this as-is.** The procedure forces this to Legal/Privacy.
  *   **The Cost of Compliance:**
      1.  **Immediate:** You must stop ingesting this field at the source (client SDK) or strip it at the ingestion gateway.
      2.  **Dashboard Impact:** The VP loses the ability to read *why*. They will only see *that* a cancellation happened.
      3.  **The Compromise:** Implement a **controlled vocabulary** (dropdown menu) on the client side. Log the `reason_code` (e.g., `ILLNESS`, `TRANSPORT`, `FINANCIAL`).
      4.  **What You Lose:** You lose the nuance of the narrative. You lose the ability to detect emerging trends that don't fit the codes (e.g., a new bus route cancellation spike).
      5.  **What You Gain:** You stop storing unstructured PHI. You make the data structured enough to be deleted easily (Step 4).
  *   **The Hard Truth:** This is a values call, but the procedure removes the decision from *you*. If you log this text, you are personally liable for the data breach when (not if) a patient's medical reason is exposed in a logs dump. The procedure says: **Escalate to Legal.** If Legal says "Yes, accept the risk," get it in writing and put that note in the Absence Register under "Exceptions." Do not own this risk on your own signature.

  ### Final Note on the "Absence Register"
  You mentioned you want a place that says "we chose not to record X."
  When you implement the **Case 3** fix (switching to dropdown codes), you must write this in the Register:

  > **Field:** `cancellation_reason_text`
  > **Decision:** **BLOCKED**
  > **Rationale:** Step 3 (Minimization). Unstructured text poses PHI risk. Replaced with `cancellation_reason_code`.
  > **Consequence:** VP Dashboard loses narrative detail. Emerging non-coded trends will be invisible.
  > **Owner:** [Your Name]
  > **Review Date:** Next ML Training Cycle

  This ensures that in two years, when the Data Science team asks "Why don't we have qualitative data on cancellations?", they don't find a gap. They find a decision. They find that you protected them from the liability of having that data. That is how you turn a silence into a safeguard.
