          *   Recurring (instrumentation review + quarterly retention).
          *   Must define acceptable answers (no hand-waving).
          *   Must define hard stops ("No, don't ship").
          *   Must define escalation points (who decides values).
          *   Must include an "Absence Register" (recording what we *didn't* log and why).
          *   Must handle specific edge cases: "Ghost users" (unattributed residuals), "Silence Inheritance" (downstream gaps from upstream), "Load-bearing Absences" (GDPR/privacy reasons *not* to log), "Deletion Asymmetry" (power imbalance in data rights).
          *   Must acknowledge limitations (where judgment calls hide).
      *   **Task:** Create the procedure, then run it on three specific cases (Bulk Reschedule, Free-tier Sampling, Cancellation Reason Field).
      *   **Tone:** Plain language, translate theory to engineering terms, honest about limitations.

  2.  **Deconstruct the Philosophy into Engineering Terms:**
      *   *Archival Power:* Who defines the "truth" in the database? -> *Schema Ownership.*
      *   *Gaps are made:* Missing data isn't neutral. -> *Null Hypothesis Testing.*
      *   *Ghost Users:* Aggregated/Anonymous data. -> *Attribution Coverage.*
      *   *Silence Inheritance:* Upstream dropping data affects downstream. -> *Propagation Chain Audit.*
      *   *Load-bearing Absences:* Privacy vs. Insight. -> *Data Minimization Compliance.*
      *   *Deletion Asymmetry:* Who can request deletion? -> *Subject Access Request (SAR) Feasibility.*

  3.  **Drafting the Procedure (The "One-Pager"):**
      *   *Name:* The Telemetry Impact Assessment (TIA).
      *   *Structure:* 5 Steps.
      *   *Step 1: Attribution & Ghosts.* (Who is this about?)
