  *(Self-Correction on Case 2)*: The prompt expects this to be a "no." I need to show *where* it fails. It fails on "Deletion Asymmetry" and "Ghost Users." I need to propose the "cheapest thing that passes" (e.g., logging metadata only, not full session).

