  2.  **Define Prioritarianism & The Leveling-Down Objection:**

      *   *Prioritarianism:* A distributive justice theory (associated with Parfit). It holds that benefiting people matters more the worse off they are. It is *non-relational* (unlike Egalitarianism). It cares about absolute gains for the worst-off, not just the gap between rich and poor.
      *   *Leveling-Down Objection (LDO):* Primarily an objection to *Egalitarianism*. If equality is the only goal, making the rich poorer without making the poor richer (leveling down) increases equality. Most find this intuitively wrong. Prioritarianism usually avoids this because it requires *gains* for the worse off to have value. However, the prompt asks to use the UC case to *probe* the LDO within a prioritarian framework, specifically regarding fiscal consolidation.

  3.  **Task 1: The Worst-Off & Welfare Impact:**

      *   *Who:* UC claimants, specifically those not working or in low-paid insecure work, often with children or disabilities. Before the cut: Pandemic peak, high uncertainty. After the cut: Recovery phase, but inflation starting to rise (energy prices).
      *   *Absolute Welfare:* The cut was a nominal reduction (£1040/year). Given inflation started picking up in late 2021, real terms welfare definitely decreased. It wasn't just "slowed improvement"; it was an absolute loss in purchasing power.
      *   *Compensatory Effects:* The government argued fiscal sustainability allows for long-term investment (levelling up, infrastructure). Do these benefit the worst-off prioritarianly? Maybe in the long run, but prioritarianism usually weights immediate urgent needs heavily. The "trickle-down" of fiscal stability is weak from a prioritarian view compared to immediate cash.

