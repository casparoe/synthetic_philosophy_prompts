      *   *Prioritarian Verdict:* Strict prioritarianism requires a *gain* for the worse off to generate moral value. If the worst-off gain nothing (or lose via job losses), but the rich lose, this is "leveling down." Prioritarianism should reject this. It is not enough to harm the rich; the poor must benefit.
