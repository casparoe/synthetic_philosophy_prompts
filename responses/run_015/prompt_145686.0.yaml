  ### The Two Rules

  **Rule 1: The Phenomenological Threshold (Discrete Shock vs. Background Condition)**
  *   **Logic:** Non-human factors count as actors only when they manifest as sudden, catastrophic, discrete events that bypass human anticipation. Slow-moving trends or systemic states are "background," not actors.
