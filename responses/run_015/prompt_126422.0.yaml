answer: |-
  ### Part 1: The Axiomatic Trade-off

  **Condition Violated:** **Ordinality and Interpersonal Non-Comparability.**

  **The Price:** To satisfy the Board's first demand (Inter-cycle Consistency/IIA), we cannot use a ranking system (Borda, Condorcet, etc.). Any system that ranks proposals relative to one another makes the outcome dependent on the pool (the "irrelevant alternatives"). If the pool changes, the rank changes, even if the proposal's quality does not.

  To guarantee that a proposal's fate depends only on its own quality and not on who else applied, we must treat quality as **cardinal** (absolute score) rather than **ordinal** (rank). This requires us to assert that Panelist A's "8/10" is comparable to Panelist B's "8/10," and that an "8/10" this year is comparable to an "8/10" last year.

  **The Cost in Board Currency:**
  1.  **Calibration Time:** We must spend the first 2 hours of every panel meeting calibrating scores against "anchor proposals" (past examples).
  2.  **Budget Elasticity:** We cannot guarantee exactly six awards. If twelve proposals clear the absolute bar, we must fund twelve (or have a reserve fund). If zero clear it, we fund zero. The Board must accept that the *budget* is the variable, not the *standard*.
  3.  **Feedback Restriction:** We can no longer tell applicants how they ranked relative to others (e.g., "You were 7th"). We can only tell them if they met the threshold. This reduces appeal grounds but reduces feedback utility for applicants.

  ---

  ### Part 2: The Procedure (Draft for Board Approval)

  **1. Scoring Metric (Cardinal)**
  Panelists do not rank proposals. Panelists assign a **Quality Score (0–10)** to each assigned proposal based on the Foundation Rubric.
  *   **9–10:** Transformative; fund immediately.
  *   **7–8:** Excellent; fund if budget permits.
  *   **5–6:** Competent; do not fund.
  *   **0–4:** Flawed; do not fund.
  *   *Constraint:* Scores of 0, 5, or 10 require a written justification in the reader's comments.

  **2. Aggregation (Excel)**
  For each proposal, the Foundation Staff calculates the **Total Score** (Sum of 3 Readers).
  *   Maximum possible: 30.
  *   Minimum possible: 0.
  *   *Tie-break:* If Total Scores are identical, the proposal with the higher median score ranks higher. If still tied, the Chair resolves based on strategic fit (recorded in minutes).

  **3. The Funding Threshold (Absolute)**
  The Panel sets a **Funding Threshold** at the start of the cycle, calibrated against anchor files from previous years.
  *   **Default Threshold:** 24/30 (Average 8.0).
  *   **Adjustment:** The Panel may raise or lower the threshold by 1 point maximum based on the specific cycle's pool, provided a 2/3 majority agrees.
  *   **Rule:** Any proposal meeting or exceeding the Threshold is *prima facie* fundable.

  **4. The Award List (Flexible)**
  *   **Case A:** If fewer than 6 proposals meet the Threshold, fund only those that met it. (Satisfies "None" option).
  *   **Case B:** If between 6 and 10 proposals meet the Threshold, fund all of them.
  *   **Case C:** If more than 10 proposals meet the Threshold, fund the top 10 by Total Score. (Satisfies budget cap).
  *   **Clones:** If two proposals from the same lab both meet the Threshold, both are eligible. The Panel may cap one lab at one award only if the second proposal is deemed "redundant" (distinct scientific question required), not merely similar.

  **5. Sub-Panel Consistency**
  Proposals are read by sub-panels of 4 panelists (3 readers + 1 overlap). The Total Score is additive. If Sub-panel 1 and Sub-panel 2 both score a proposal 26/30, the merged panel records 26/30. No re-scoring occurs in the plenary session unless a procedural error is identified.

  **6. Appeals and Reasons**
  Applicants receive their Total Score, the Threshold for that cycle, and a one-paragraph synthesis of reader comments.
  *   **Prohibited Language:** Reasons must not reference other applicants (e.g., "funded X instead of Y").
  *   **Allowed Language:** Reasons must reference the Threshold (e.g., "Your score of 23 did not meet the cycle threshold of 24").
  *   **Grounds for Appeal:** Calculation error, conflict of interest, or bias in reader comments. *Not* grounds for appeal: Disagreement with the score itself.

  ---

  ### Part 3: The Rationale (For the Board & Lawyer)

  **Why this procedure?**
  The Board requires that a proposal's success depend on its own merit, not on the strength of the competition (Demand 1). Traditional ranking systems (like voting) violate this: a proposal can move from "funded" to "unfunded" without changing, simply because a stronger proposal entered the pool. This creates legal vulnerability when resubmissions are rejected after being previously encouraged.

  **How we satisfy the demands:**
  1.  **Consistency:** By using absolute scores and a fixed threshold, a proposal's fate is decoupled from the pool. If Proposal A scores 25 last year and 26 this year, it funds both times, regardless of Proposal B.
  2.  **Sub-panels:** Summing scores is mathematically consistent across groups.
  3.  **Strategy:** It is never advantageous for a panelist to lower a favorite's score; doing so only risks dropping them below the threshold.
  4.  **Clones:** Because we fund based on a threshold, not a fixed quota, two excellent proposals from one lab do not "split" a vote; they both clear the bar.

  **Where judgment remains:**
  The procedure cannot automate the definition of "Quality." The Panel must calibrate the Threshold (Step 3) and resolve ties (Step 2). These are value judgments. The procedure ensures these judgments are applied consistently, not that they are eliminated.

  ---

  ### Part 4: Scenario Runs

  #### Scenario 1: The Clean Cycle (Single-Peaked Preferences)
  *   **Input:** 8 Proposals. Implicit quality ordering exists (1 is best, 8 is worst). Panelists agree on the order but differ on intensity.
  *   **Procedure Check:** Because preferences are single-peaked, the median voter theorem suggests majority rule would work. However, our Score Voting system captures *intensity*.
  *   **Outcome:** Proposal 1 gets 30/30. Proposal 8 gets 12/30. Threshold is 24. Proposals 1–5 fund.
  *   **Impossibility Result?** No. When preferences are single-peaked and domain-restricted, social choice functions are stable. We do not need to invoke Arrow here. The procedure works smoothly.
  *   **Note:** We do not need to tell the Board about the domain restriction. We simply report that the scores were clear.

  #### Scenario 2: The Clone Cycle (Strategic Chair)
  *   **Input:** Lab X submits Proposal A1 and A2 (Clones). Lab Y submits Proposal R (Rival).
      *   Reader Scores: A1 (9, 9, 9 = 27), A2 (9, 9, 9 = 27), R (10, 10, 10 = 30).
      *   Threshold: 24.
      *   Budget Cap: 2 Awards (for this scenario's sake).
  *   **Chair's Desire:** Wants R to win. Fears A1/A2 will split the "vote."
  *   **Procedure Check:** Under Borda/Ranking, A1 and A2 might push R down if panelists split preference. Under Score Voting with Threshold:
      *   A1, A2, and R all clear the Threshold (24).
      *   We have 3 fundable proposals, budget for 2.
      *   **Rule:** Fund top scores. R (30) funds. A1 (27) funds. A2 (27) is cut due to budget cap.
  *   **Chair's Manipulation:** The Chair cannot manipulate this without violating the scoring rule. If the Chair convinces readers to lower A1's score, they must justify it in writing (risk of appeal).
  *   **Clone Independence:** The procedure treats A1 and A2 on merit. If the budget were elastic (Part 1, Cost), all three would fund. With a hard cap, one clone loses, but not because of "vote splitting," but because of budget scarcity.
  *   **Verdict:** The procedure prevents the Chair from claiming "clones stole the win." The win was stolen by the Budget Cap.

  #### Scenario 3: The Resubmission (Demand 1 Test)
  *   **History:** Cycle 1. Applicant A (Score 25, Funded). Applicant B (Score 24, Unfunded).
      *   *Mistake:* Foundation told B, "You ranked just below A."
  *   **Current:** Cycle 2. A resubmits (Improved). B resubmits (Same).
      *   Reader Scores: A (26), B (24).
      *   Pool: 5 other proposals score 27+.
      *   Budget Cap: 6 Awards.
  *   **Conflict:** If we rank by score, A (26) is 6th. B (24) is 8th. Both fund.
      *   *Wait, the Board's Fear:* Last cycle we funded B and not A (hypothetically, if A had slipped).
      *   *Real Test:* A improves (25 $\rightarrow$ 26). B stays (24).
      *   *Outcome:* A funds. B does not.
  *   **The Letter to B (Unfunded):**
      > "Dear Dr. B, The Panel appreciated your resubmission. In this cycle, the Panel established a Funding Threshold of 25 points based on the overall excellence of the pool and our strategic anchors. Your proposal received a Total Score of 24. While this represents high-quality work, it did not meet the cycle's threshold for funding. We encourage you to address the readers' comments regarding [Specific Methodological Point] for future applications."
  *   **The Letter to A (Funded):**
      > "Dear Dr. A, Your proposal received a Total Score of 26, exceeding the cycle Funding Threshold of 25. The Panel noted the improvements made since your last submission, particularly regarding [Specific Methodological Point]."
  *   **Board Cost:** We can never again tell an applicant their *rank*. Only their *score* and the *threshold*. If the Board insists on telling applicants their rank, Demand 1 is mathematically impossible to guarantee.

  ---

  ### Part 5: What This Procedure Cannot Settle

  **1. The Budget Question**
  You are correct: whether the cut falls at six or ten is a budget question. However, to satisfy Demand 1 (IIA), the budget must be **elastic** up to the point of the Threshold.
  *   *If the Board fixes the budget at exactly 6:* We **must** violate Demand 1. If 7 proposals score above the Threshold, one must be cut. If that one is A (who improved), we have failed the Board's requirement.
  *   *The Fix:* The Board must authorize a "Contingency Fund" (e.g., budget for 8, spend 6–8). If they refuse, you must write into the Rationale: *"Fixed budget constraints may necessitate funding a lower-scoring proposal over a higher-scoring resubmission due to pool density."*

  **2. Calibration Drift**
  The procedure assumes Panelist X's "8" today = Panelist X's "8" next year.
  *   *Risk:* Grade inflation. If the Threshold stays at 24, but panelists get generous, everyone funds.
  *   *Mitigation:* The "Anchor Files." You must keep 3 physical/digital folders: "Typical Funded 2023," "Typical Rejected 2023," "Borderline." Panelists must calibrate against these before scoring.
  *   *Cost:* This adds 90 minutes to the meeting. If the Board refuses this time, the procedure fails Demand 1.

  **3. The "Value" Judgment**
  The procedure handles *facts* (scores, sums, thresholds). It cannot handle *values* (strategic direction).
  *   *Example:* Proposal A (26 pts, Basic Science) vs. Proposal B (26 pts, Applied Health).
  *   *Procedure:* Tie.
  *   *Resolution:* The Chair breaks the tie based on Foundation Mission.
  *   *Transparency:* The Reason Letter to the loser cannot say "We preferred Applied Science." It must say "Scores were tied; funding was allocated based on strategic priorities." This is the one place where "Values" override "Facts."

  ### Final Recommendation to the Committee

  1.  **Adopt Score Voting with Threshold.** It is the only mechanism that satisfies the Board's demand for Inter-cycle Consistency (Demand 1).
  2.  **Explicitly Ban Relative Feedback.** Update the applicant communication template. You cannot promise IIA if you tell applicants their rank.
  3.  **Demand Calibration Time.** If the Board will not grant 90 minutes for anchor calibration, the scores are noise, and the procedure is a sham.
  4.  **Accept Budget Elasticity.** If the Board demands a hard cap of 6 awards regardless of quality, you must inform them they are choosing to violate Demand 1.

  **The "One Page" Reality:**
  The procedure fits on one page. The *work* to make it honest (calibration, elastic budget, absolute feedback) is where the political battle lies. The math is solved; the governance is not.
