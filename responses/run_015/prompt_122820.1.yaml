answer: |-
  This is a profound problem, and your intuition regarding the stomatal conductance case strikes at the heart of why formal definitions of verisimilitude (truthlikeness) have historically struggled to capture scientific practice. The standard impossibility results—most notably those by Popper, and later refined by Tichý and Miller—demonstrate that if we define verisimilitude solely by comparing the logical content of false theories against the truth, we run into paradoxes where no false theory can be closer to the truth than another.

  Your proposal to introduce a third term, an **agenda**, resolves this by recognizing that "closeness" is not a property of a theory in isolation, but of a theory relative to a specific resolution of inquiry. Below, I argue for your position: that verisimilitude is a three-place relation $V(T, T^*, \alpha)$, where $T$ is the theory, $T^*$ is the truth, and $\alpha$ is the agenda.

  ### 1. Defining the Agenda: A Modeller's Partition

  To make this argument concrete, we must move from abstract logic to the language of state spaces, which you will recognize from your modelling work.

  **Stipulation:** For the purposes of this argument, I define an **agenda** ($\alpha$) as a partition of the logical space of possible states of the target system.

  In modelling terms, a system (the leaf) exists in a high-dimensional state space defined by all physically possible variables (turgor pressure, ion concentration, aperture width, vapour pressure deficit, conductance, etc.). No model distinguishes every point in this space. Instead, a model groups states together.
  *   **Cells:** Each cell in the partition represents a distinction the model (or the inquiry) is capable of making.
  *   **Coarse Agenda:** Lumps many physical states into one cell. For example, an agenda that asks only *"What is the bulk conductance ($g_s$)?"* treats all internal configurations that yield the same $g_s$ as identical.
  *   **Fine Agenda:** Distinguishes states that a coarse agenda lumps. An agenda that asks *"What is $g_s$ AND what is the guard cell turgor pressure?"* has finer resolution.

  **Definition (Finer/Coarser):** Agenda $\alpha_2$ is **strictly finer** than $\alpha_1$ if and only if every cell (question) in $\alpha_1$ is a union of one or more cells in $\alpha_2$.
  *   *Concrete Example:* If $\alpha_1$ asks "Is conductance high or low?", and $\alpha_2$ asks "Is conductance 0.1, 0.2, or 0.3?", $\alpha_2$ is finer.
  *   *Concrete Example:* If $\alpha_1$ asks "What is the output flux?", and $\alpha_2$ asks "What is the output flux AND what is the internal valve mechanism?", $\alpha_2$ is finer.

  In your stomatal case:
  *   **Agenda $\alpha_{output}$:** Partitions the state space by measured conductance values. It does not distinguish between a leaf that achieves $g_s=0.2$ via active ion pumping and one that achieves it via passive hydraulic resistance.
  *   **Agenda $\alpha_{mech}$:** Partitions the state space by both conductance values *and* the physiological state of the guard cells (active vs. passive, ion concentrations).

  Model B fits the truth closely within the cells of $\alpha_{output}$. Model A fits the truth closely within the cells of $\alpha_{mech}$ (regarding the active/passive distinction), even if it misses the precise values in $\alpha_{output}$ at the dry extreme.

  ### 2. Ontology vs. Pragmatism: Why This Is About Truth

  A common objection is that introducing an agenda makes verisimilitude merely pragmatic—a measure of *utility* rather than *truth*. If we say B is "closer to the truth" only relative to an output agenda, aren't we just saying B is more *useful* for prediction?

  I argue **no**. This distinction is semantic and ontological, not merely epistemic.

  Consider the concept of velocity in special relativity. Velocity is not a two-place relation between an object and a speed; it is a three-place relation between an object, a speed, and a **frame of reference**. Saying "The train moves at 100 km/h" is incomplete without the frame. This does not make velocity "subjective" or "pragmatic." It makes it a structural feature of reality that requires a coordinate system to be quantified.

  Similarly, "Truth" in a complex system is not a monolithic point; it is a structure. A theory matches that structure to varying degrees depending on which dimensions of the structure are being inspected.
  *   When we say Model B is closer to the truth relative to $\alpha_{output}$, we mean that the mapping function $f_{B}: Input \to Output$ is isomorphic to the true mapping $f_{Truth}: Input \to Output$ within a small error margin $\epsilon$. This is a fact about the world's input-output structure, not just our preference.
  *   When we say Model A is closer to the truth relative to $\alpha_{mech}$, we mean that the causal topology of A (active regulation) matches the causal topology of the leaf, whereas B's topology (passive resistor) does not.

  The standard impossibility arguments fail because they assume a "God's eye" agenda that asks all possible questions simultaneously. They calculate truth-content by counting all true sentences and falsity-content by counting all false sentences. Under that assumption, a theory that gets the mechanism right but the numbers wrong (A) accumulates massive falsity-content regarding the numbers, while a theory that gets the numbers right but the mechanism wrong (B) accumulates massive falsity-content regarding the mechanism. Without weighting the questions (the agenda), the comparison is undefined.

  By making the agenda explicit, we acknowledge that **closeness to truth is density of correct information per unit of inquiry.** Model B has high density in the output dimension; Model A has high density in the mechanistic dimension. This is a claim about the *distribution of truth* in the theory, not merely our *interest* in it.

  ### 3. The Gerrymandering Objection and Admissible Agendas

  The most serious threat to this view is relativism. If verisimilitude depends on an agenda, can I not construct an agenda where any falsehood counts as truthlike? For example, could I define an agenda that asks only: *"Does the theory predict conductance correctly on Tuesdays?"* If Model B happens to do this, is it truly "closer to the truth"?

  This is where your constraint is essential.

  **Stipulation:** An agenda $\alpha$ is **admissible** if and only if the True Theory ($T^*$) achieves maximal verisimilitude (perfect score) relative to $\alpha$.

  This constraint prevents gerrymandering in two ways:
  1.  **System-Relative, Not Theory-Relative:** Admissible agendas must partition the *state space of the system*, not the *space of theories*. We cannot ask "Is the theory written in blue ink?" because the True Theory of the leaf does not have a color. The agenda must concern the leaf's variables (conductance, turgor, etc.).
  2.  **The Truth Constraint:** If an agenda is admissible, the Truth must pass it perfectly. This means we cannot construct an agenda that ignores the mechanism if the mechanism is part of the truth.

  Let us apply this to your case.
  *   **Agenda $\alpha_{output}$:** Is this admissible? Yes. The True Leaf produces specific conductance values. $T^*$ predicts them perfectly. Model B scores highly here. Model A scores poorly at the dry end. Relative to $\alpha_{output}$, $V(B) > V(A)$.
  *   **Agenda $\alpha_{mech}$:** Is this admissible? Yes. The True Leaf has a specific physiological state (active regulation). $T^*$ describes it perfectly. Model A scores highly (it posits active regulation). Model B scores zero (it posits passive resistance). Relative to $\alpha_{mech}$, $V(A) > V(B)$.
  *   **Gerrymandered Agenda $\alpha_{tuesday}$:** "Predicts conductance on Tuesdays." Is this admissible? No. The True Theory of stomata does not distinguish Tuesdays from Wednesdays; the physics is time-invariant regarding the day of the week. An agenda that partitions states by "Day of Week" is not a valid partition of the *physical* state space. It is inadmissible.

  Furthermore, this explains why Model B is ultimately unsatisfactory to a physiologist. As science progresses, we tend to **refine the agenda**. We move from $\alpha_{output}$ to $\alpha_{mech}$. Model B's verisimilitude collapses as the agenda becomes finer. Model A's verisimilitude remains robust (or improves) as the agenda refines, provided we fix its functional form. The constraint ensures that a false theory cannot remain truthlike across *all* admissible refinements. Only $T^*$ can do that.

  ### 4. Scientific Progress: Convergence at Resolution

  If verisimilitude is agenda-relative, what becomes of the idea that science accumulates truth? Does history become merely a sequence of changing interests?

  I argue that scientific progress is best understood as the **expansion of the admissible agenda while maintaining verisimilitude.**

  Consider the history of mechanics:
  *   **Newtonian Mechanics ($T_{Newt}$):** Relative to the agenda $\alpha_{slow}$ (velocities $\ll c$, weak gravity), $T_{Newt}$ has extremely high verisimilitude. It is practically indistinguishable from the Truth ($T_{Einstein}$).
  *   **Relativistic Mechanics ($T_{Ein}$):** Relative to $\alpha_{slow}$, $T_{Ein}$ has equally high verisimilitude. But relative to the finer agenda $\alpha_{fast}$ (velocities $\approx c$), $T_{Newt}$ has zero verisimilitude, while $T_{Ein}$ remains high.

  Progress is not merely swapping $T_{Newt}$ for $T_{Ein}$. Progress is the community's ability to operate successfully under $\alpha_{fast}$, an agenda that was previously inaccessible.

  Now, apply this to your stomatal models. The history of plant physiology can be read as a refinement of the agenda:
  1.  **Phase 1 (Empirical):** The agenda is $\alpha_{output}$ (flux vs. environment). Model B (phenomenological) represents peak verisimilitude here. It is "progress" over earlier, cruder empirical fits.
  2.  **Phase 2 (Mechanistic):** The community decides $\alpha_{output}$ is insufficient. We demand $\alpha_{mech}$ (flux + regulation). Model B is now revealed as having low verisimilitude because it fails the new partition cells regarding guard cell state. Model A represents progress because it addresses the finer agenda, even if its predictive accuracy (on the coarse agenda) is currently worse.

  The "accumulation of truth" is the preservation of high verisimilitude on the *coarse* agenda (we don't forget how to predict flux) while achieving non-zero verisimilitude on the *fine* agenda (we learn how the valve works).

  **Stipulation:** I define **Scientific Progress** in this framework as a transition from Theory $T_1$ to Theory $T_2$ such that:
  1.  For the current admissible agenda $\alpha_{current}$, $V(T_2, T^*, \alpha_{current}) \geq V(T_1, T^*, \alpha_{current})$.
  2.  There exists a finer admissible agenda $\alpha_{new}$ such that $V(T_2, T^*, \alpha_{new}) > V(T_1, T^*, \alpha_{new})$.

  In your case, the field is currently in a tension between Phase 1 and Phase 2. Physiologists call B the "better model" because they are often working within $\alpha_{output}$ (e.g., land-surface schemes in climate models). They call A the "better biology" because they aspire to work within $\alpha_{mech}$ (e.g., understanding drought mortality).

  Your position allows us to say both are correct without contradiction. B is closer to the truth *simpliciter* only if no agenda is specified, which is a category error. B is closer relative to the prediction agenda. A is closer relative to the explanation agenda. The "impossibility" of comparing them vanishes once we acknowledge they are winning at different games.

  ### Conclusion

  Your intuition that Model A is "better biology" and Model B is a "better model" is not a confusion; it is a precise recognition of agenda-relativity. The standard philosophical accounts of verisimilitude fail because they attempt to force a single ranking on theories that are optimized for different resolutions of reality.

  By defining verisimilitude as a three-place relation $V(T, T^*, \alpha)$, where $\alpha$ is a partition of the system's state space constrained by the requirement that the Truth must be maximally truthlike, we achieve three things:
  1.  We validate the modeller's practice of using phenomenological fits (B) for prediction while pursuing mechanistic accounts (A) for understanding.
  2.  We avoid the logical paradoxes of content-based measures by restricting comparison to specific partitions of questions.
  3.  We preserve a robust notion of progress: the ability to sustain predictive accuracy while refining the resolution of our questions.

  In retirement, you have identified that the "truth" of a leaf is not a single number, but a resolution-dependent structure. Model B captures the shadow the leaf casts; Model A captures the gears that move it. Both are close to the truth, provided we specify whether we are asking about the shadow or the gears.
