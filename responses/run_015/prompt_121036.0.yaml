answer: |-
  The identity claim is critically exposed because it collapses into unfalsifiability unless "global availability" is neurally defined independently of the very reports used to verify consciousness, and emerging no-report data suggests phenomenology can persist without the proposed neural signature of broadcasting.

  **1. The Insulation Problem (Fatal)**
  This is the structural weak point. If "global availability" is operationalized solely by what gets reported (or what enables report), and consciousness is verified solely by report, the theory states "Report equals Report." To survive, GWT must identify a neural signature of broadcasting (e.g., P3b, nonlinear ignition) that is *distinct* from the motor act of reporting. If that signature always co-occurs with report, you haven't tested the theory; you've just correlated two outputs of the same process. If the signature dissociates from report, you must decide which one tracks consciousness. Most workspace theorists privilege the neural ignition, but if ignition occurs without subjective report (in no-report paradigms), they often downgrade the phenomenology to "fragile" or "partial" to save the theory. This ad hoc resizing of phenomenology to fit the neural data is where the identity claim bleeds.

  **2. No-Report Paradigms & Early Visual Decoding (Fatal/Severe)**
  This is the empirical bite. In no-report masking studies, subjects show behavioral evidence of conscious perception (e.g., eye movements, forced choice) and decoders can read rich stimulus content from early visual cortex (V1-V4), yet the frontoparietal ignition (P3b) is absent or significantly attenuated. Recurrent Processing Theory (RPT) predicts this: consciousness is local recurrent loops, not global broadcast. GWT proponents (like Dehaene) counter that this is "conscious access" without "reportable consciousness," or that the ignition is there but too brief to detect. However, if the subject can act on the content deliberately without ignition, the functional definition of "availability to consumer systems" is met without the workspace. This directly contradicts the identity claim: here is availability (to the motor system) without the proposed neural substrate of consciousness.

  **3. Frontal Damage and Neglect (Severe)**
  Patients with extensive prefrontal lesions often lose the capacity for complex report and executive control but retain clear signs of experience (e.g., emotional reactions, simple discrimination, tracking objects). If the workspace is physically damaged but experience remains, the identity claim fails. GWT defenders argue these patients retain *some* workspace capacity or that the experience is non-conscious "blindsight," but this requires convincing behavioral evidence that the experience lacks phenomenality, which is hard to gather from non-reporting patients. Similarly, in neglect, stimuli are processed but not reported; GWT says they aren't conscious, but priming effects suggest rich processing. The awkwardness here is having to insist that patients who act like they see things don't actually see them.

  **4. Unique Predictions vs. Rivals (Weak/Untested)**
  GWT's unique prediction is that frontoparietal ignition is *necessary* for any conscious state. RPT predicts it is not; IIT predicts it is irrelevant (structure matters, not function). Tests have been run (e.g., TMS masking, no-report fMRI), and the weight currently favors RPT: conscious content can be decoded from sensory areas without frontoparietal engagement. GWT hasn't successfully predicted a case where ignition occurs *without* consciousness (except perhaps in some anesthesia cases, which are ambiguous) or where consciousness is definitively absent *despite* ignition (except when attributing confabulation). The theory is currently playing defense against RPT findings rather than driving novel discovery.

  **5. The "Dark Dashboard" (Methodological Threat)**
  Your wrinkle bites harder than it looks. If a subject reports a full scene (implying workspace broadcast) but early sensory areas show the signature of unattended stimulation (implying no rich sensory processing), you have decoupled report from veridical sensory phenomenality.
  *   **Does it break the inference?** Yes. It suggests report tracks workspace ignition, not the sensory quality of the experience. If the workspace can broadcast a "filled-in" model without the sensory signature usually required for that content, then report is no longer a reliable proxy for *perceptual* consciousness—it's a proxy for *confidence* or *model generation*.
  *   **GWT Response:** A hardline workspace theorist would say this is still consciousness (perhaps hallucinatory), because consciousness is the broadcast, not the sensory input. But this concedes that consciousness can be untethered from the specific sensory qualia it claims to represent.
  *   **The Real Danger:** It opens the door to confabulation. If the workspace can generate reportable content without the sensory signature, how do you know any report isn't just the workspace guessing? This forces you to rely on the neural signature (EVC) over the subject's word, which undermines the first-person authority that consciousness research relies on.

  **6. Is the Insulation a Problem?**
  Yes, it is fatal for a scientific theory with this ambition. If "available to consumer systems" is defined by whatever systems happen to be active when a subject reports, you cannot test whether availability *causes* consciousness or just accompanies it. You need a definition of "broadcast" that is independent of report (e.g., specific neural synchrony) and then test if that synchrony correlates with phenomenology in cases where report is impossible or unreliable. Until GWT provides a report-independent measure of broadcasting that perfectly tracks phenomenology across all cases (dreaming, anesthesia, pathology), the identity claim remains an assumption, not a finding.
