answer: |-
  **Possibilia**
  *The Capital of Everywhere and Nowhere*

  Possibilia is a destination unlike any other, primarily because it insists it isn't the destination you think it is. To the locals, this world is just as 'actual' as yours, a philosophical stance that makes Actualville a remarkably humble capital. Expect no grand monuments to reality here; the Ministry of Metaphysics is housed in a converted warehouse in the industrial district, reflecting the prevailing view that 'actuality' is merely an indexical label, like 'here' or 'now', and hardly worth boasting about. The vibe is distinctly provincial, as if the entire nation is apologising for being the world you happen to inhabit.

  **Entry Requirements**
  Border control is notoriously pedantic. Officers do not check passports so much as similarity metrics. Under strict Counterpart Theory, you cannot literally exist in more than one world, so customs agents must determine if you are truly you, or merely a very close counterpart visiting on holiday. Be prepared for invasive questioning regarding your childhood memories. If your recollection of learning to ride a bicycle involves a red bike rather than a blue one, you may be detained as a distinct individual from a neighbouring world. Appeals are possible but require proving essential properties remain intact, which is tedious paperwork. Many travellers are turned away for being 'too similar' to a local resident, causing identity congestion at the gate.

  **Getting Around**
  Tourists often complain that Possibilia lacks exoticism. The landscapes are frustratingly similar to home; the sky is the same shade of blue, and the gravity feels identical. This is intentional. The theory of plenitude ensures every variation exists, but most travellers find themselves in worlds nearly indistinguishable from their own. Don't bother asking for the world where dinosaurs survived; it is technically accessible but requires excessive visa processing for negligible cultural gain. Most visitors stick to Actualville, where the tea is adequate and the metaphysical instability is minimal. Accommodation ranges from concrete hotels in this world to timeshares in slightly divergent timelines, though Wi-Fi connectivity drops sharply across world-boundaries.

  **Safety & Services**
  Travel insurance is complex. Emergency services operate on a strict causal isolation policy. If an earthquake devastates a nearby world, do not expect aid from Possibilia. Consular officials will politely explain that the suffering, while real, is not *here*. Similarly, if you lose your luggage in a neighbouring timeline, it is considered gone forever. Retrieval attempts are discouraged as they risk paradoxical contamination. Medical care is excellent, provided your ailment exists in this world; psychosomatic conditions caused by meeting your own counterparts are treated privately.

  **Festivals**
  **Indexicality Day** (14th October)
  The national holiday celebrates the mediocrity of existence. Parades are deliberately underwhelming to honour the fact that being 'actual' confers no special status. Fireworks are cancelled half-way through because 'spectacular' is subjective and indexical. Locals exchange gifts of ordinary pebbles to signify that every object is equally real somewhere. It is a quiet affair, much like the rest of the country.

  ***

  **Note on Philosophy**
  Strict David Lewis-style modal realism posits that possible worlds are spatiotemporally isolated; causal travel between them is impossible. This guide assumes a fictional liberalisation where bureaucratic access replaces physical isolation, taking significant liberties with the isolation principle to facilitate the premise of a travel guide. Counterpart theory usually denies trans-world identity entirely, whereas this entry treats it as a matter of border control.
