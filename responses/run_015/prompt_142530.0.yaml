answer: |-
  This is a rigorous framework for dissecting a slogan that is often used to bypass rigor. Below is a menu of the distinct claims embedded in "You can't erase history," evaluated for truth and relevance, followed by the application of your two stress tests.

  ### Part I: The Menu of Claims

  Here are five distinct propositions that the slogan might be asserting.

  #### 1. The Metaphysical Claim
  *   **The Claim:** Removing a physical object alters the actual events of the past.
  *   **Category:** Causal/Ontological.
  *   **Assessment:** **False.** Taking down a statue of a Confederate general does not change the fact that the general existed, fought, or that the statue was erected in 1910.
  *   **Relevance:** **None.** Since the claim is false, it provides no rational support for leaving the statue in place. It relies on a category error between *history* (what happened) and *historical artifacts* (what remains).

  #### 2. The Epistemic Claim
  *   **The Claim:** Removing a public monument significantly degrades the public's ability to know or research the past.
  *   **Category:** Epistemic/Informational.
  *   **Assessment:** **Substantial but Contingent.** It is true that physical artifacts are primary sources. However, in the information age, the loss of *access* is rarely absolute. If the statue is moved to a museum or the street name is recorded in city logs, the data remains. The claim is only defensible if the removal is accompanied by the destruction of records or if the object itself holds unique data (e.g., forensic evidence) not captured elsewhere.
  *   **Relevance:** **Weak.** It supports leaving the statue *in situ* only if no other record exists. If the goal is merely to preserve information, relocation suffices.

  #### 3. The Mnemonic Claim
  *   **The Claim:** Public spaces are necessary triggers for collective memory; without visible prompts, society will forget the past or fail to engage with it.
  *   **Category:** Psychological/Social.
  *   **Assessment:** **Defensible.** Cognitive science and sociology support the idea that "out of sight" often leads to "out of mind." A statue in a square forces an encounter; a statue in a storage yard requires intent to visit.
  *   **Relevance:** **Moderate.** This supports keeping the object in the public square *if* the goal is spontaneous public engagement with history. However, it does not justify keeping a *honoring* monument if the engagement is harmful (e.g., causing pain to marginalized groups).

  #### 4. The Expressive Claim
  *   **The Claim:** The *act* of removal itself sends a false message: that the past is irrelevant, illegitimate, or did not happen.
  *   **Category:** Speech Act/Symbolic.
  *   **Assessment:** **Defensible.** Actions speak. Removal can be interpreted as a form of denialism (e.g., toppling a statue to pretend a regime never existed).
  *   **Relevance:** **Strong.** This is the core of the objection. It argues that removal is not just a logistical act but a statement. To support leaving the statue, one must prove that removal *necessarily* implies denial, rather than re-evaluation.

  #### 5. The Authority Claim
  *   **The Claim:** The present generation lacks the moral or political standing to judge the symbolic choices of previous generations.
  *   **Category:** Political/Normative.
  *   **Assessment:** **Controversial.** This is not a claim about history, but about governance. It suggests a "statute of limitations" on symbolic judgment.
  *   **Relevance:** **Strong.** If true, this mandates leaving the statue regardless of epistemic or mnemonic consequences. It argues that the *process* of removal is the violation, not the loss of history.

  ---

  ### Part II: Test Against "Archival Removal"

  *The Proposal:* Remove the statue/rename the street, but reinstall the object/name in a context (museum, archive, website) that documents its origin, its original purpose, and the specific reasons for its removal.
  *The Distinction:* Separating the **Honoring Function** (celebrating the subject) from the **Recording Function** (documenting that the subject was celebrated).

  | Claim | Does Archival Removal Answer the Objection? | Analysis |
  | :--- | :--- | :--- |
  | **1. Metaphysical** | **N/A** | The objection was false to begin with. Archival removal changes the past no more than status quo retention. |
  | **2. Epistemic** | **Yes.** | Archival removal explicitly secures the Recording Function. If the data is preserved and made accessible, the claim that knowledge is lost is falsified. |
  | **3. Mnemonic** | **Partially.** | It preserves the *ability* to remember, but reduces the *likelihood* of accidental encounter. The objection survives if one argues that history must be *unavoidable* to be effective. |
  | **4. Expressive** | **Yes.** | By documenting *why* it was moved, the city asserts that the past happened but is being re-evaluated. This negates the claim that removal equals denial. It transforms the act from "erasure" to "commentary." |
  | **5. Authority** | **No.** | This objection survives untouched. If the opponent believes the current commission lacks the *right* to move the statue, the carefulness of the archive is irrelevant. The violation is the exercise of authority, not the loss of data. |

  **Verdict on Archival Removal:** It successfully neutralizes the Epistemic and Expressive claims (the most common "history" arguments) by satisfying the Recording Function without maintaining the Honoring Function. It only fails against the Authority Claim, which is not actually about history at all.

  ---

  ### Part III: Test Against the "Forgotten Statue"

  *The Case:* A statue stands in a square. The subject is unknown to all living residents. The inscription is weathered away. The only historical fact remaining is: *This community once chose to honor someone.*
  *The Question:* Does "You can't erase history" do genuine work here?

  #### 1. Does the objection work here?
  **Yes, but only on the Recording Function.**
  In this specific case, the Honoring Function has already failed naturally (no one knows who it is, so no one is honored). The only remaining value is the evidence of *past values*.
  *   **Epistemic/Mnemonic:** Removing this statue erases the physical proof that the 19th-century community valued commemoration in this specific spot.
  *   **Expressive:** Removing it says, "We do not care that our predecessors cared."

  If the commission removes this statue without documentation, they *are* erasing a specific slice of history: the history of the city's own prior symbolic choices. In this narrow case, "You can't erase history" is a **true and substantial objection** to unrecorded removal.

  #### 2. What does this tell us about ordinary cases?
  The Forgotten Statue case acts as a control group. It isolates the **Recording Function** from the **Honoring Function**.

  *   **In the Forgotten Case:** The Recording Function is the *only* function left. The objection holds weight because removal destroys the only remaining evidence of a historical fact (that the statue was erected).
  *   **In the Ordinary Case (Known Subject):** The subject is known, the history is in books, the controversy is documented. The Recording Function is already secured by archives, schools, and digital media.

  **The Implication:**
  When opponents say "You can't erase history" regarding a *known* figure (e.g., Robert E. Lee), the Forgotten Statue test reveals that they are likely not worried about the **Recording Function** (which can be satisfied by archival removal). They are worried about the **Honoring Function** being revoked.

  The Forgotten Statue case demonstrates that if the goal were truly the preservation of history, opponents should be willing to accept **Archival Removal**. The fact that they often reject archival removal in ordinary cases proves that "You can't erase history" is frequently a **proxy argument**. It uses the defensible value of *Recording* (preserving evidence) to shield the contested value of *Honoring* (maintaining status).

  **Conclusion for the Commission:**
  In the ordinary cases you are debating, the "History" objection is likely a category error.
  1.  If they mean **Recording**: Archival removal satisfies this. The objection should dissolve.
  2.  If they mean **Honoring**: They should argue that directly ("This person deserves honor"), rather than hiding behind the epistemic claim of "History."
  3.  If they mean **Authority**: They should argue that directly ("This commission lacks the mandate"), rather than claiming facts are being deleted.

  The "Forgotten Statue" proves that history *can* be erased if physical records are destroyed without backup. But in your ordinary cases, the history is not in the stone; it is in the story. The stone is just the stage. You can change the stage without deleting the play, provided you keep the script (the archive).
