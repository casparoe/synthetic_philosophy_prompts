      *   Evaluate Vera vs. Ansel. (Bostrom supports Vera's norm *if* coordination fails. Ansel is right that norms are fragile).
      *   Shared error nuance: Correlated errors mean the "independence" assumption of the curse is violated. This makes the risk *higher* (no diversity of error) but the "outlier" logic *weaker* (you aren't an outlier, you're part of a cohort).
