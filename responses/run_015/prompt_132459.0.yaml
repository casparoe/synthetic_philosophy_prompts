  2.  **Deconstruct the Argument (Unilateralist's Curse):**
      *   *The Curse:* If many agents can act unilaterally, and they act based on private estimates, the project gets done if *anyone* estimates it's good. This selects for the outlier optimism. The probability of success is lower than the average estimate suggests because the decision is driven by the maximum estimate, not the mean.
      *   *Vera's Position (Normative):* Since we can't change the structure now (keys exist), I must internally adjust my threshold. I must assume I'm the outlier.
      *   *Ansel's Position (Structural):* The norm is unstable. If I deflate, but someone else doesn't, the risk remains. Also, if we all deflate too much, we miss the good opportunity. The solution is coordination *before* key distribution. Since that failed, arguing about norms now is panic, not policy.
      *   *The Shared Instrument Wrinkle:* Usually, the curse assumes independent errors. If errors are correlated (shared miscalibration), then if I'm wrong, everyone is wrong. This weakens the "outlier" argument (if I'm optimistic, it's not because I'm an outlier, it's because the instrument lied to everyone) BUT it also means 9 keys don't provide 9 independent checks.
      *   *The Unknown Keys Wrinkle:* If I don't know how many keys are live, I don't know $N$ (the number of potential actors). If $N$ is small, the curse is weak. If $N$ is 9, the curse is strong.

