  The console hummed, a low-frequency vibration that Vera felt in her teeth. Her hand hovered over the keyslot. Ansel stood by the door, arms crossed, watching the tremor in her fingers.

  "Don't," Vera said. Not to him. To herself.

  "The model says ninety-five percent safety," Ansel said. "Two hundred million lives hang on the five percent. You've run the utility calculus a thousand times, Vera. The expected value is positive."

  "The model assumes independent actors," Vera said, her voice tight. "It assumes nine independent checks. But I'm the one standing here. That selection bias changes the prior."

  "We've been over this." Ansel pushed off the doorframe. "The Unilateralist's Curse. You think because you're the one willing to turn the key, you must be the outlier—the most optimistic of the nine. So you want to apply a discount. You want to act only if the probability of safety exceeds ninety-nine point five percent."

  "Because the cost of failure is ten times the benefit of success," Vera said. "If I'm wrong, we lose two billion lives equivalent. To justify that risk, given that I might be the most reckless of the group, I need near certainty. The instrument says ninety-five. That's not enough."

  "The instrument is the problem," Ansel said, stepping closer. "You're treating our errors as independent noise. They aren't. We all calibrated against the same spectrometer. If that machine is miscalibrated—and there's a fifteen percent chance it is—it biases all nine assays in the same direction. It makes the strain look safer than it is for everyone."

  Vera turned to him. "Exactly. Shared error means no diversity of correction. If the ruler is short, we all measure the crop as tall. That's why I discount."

  "No," Ansel said sharply. "That's why your discount is useless. The Unilateralist's Curse relies on variance. It says if nine people estimate safety, the maximum estimate is likely an outlier. But if we all share the same data source, we aren't nine estimates. We're one estimate repeated nine times. You aren't an outlier, Vera. You're a cohort. If the spectrometer lied, you're all wrong together. Conditioning on being the 'most enthusiastic' doesn't fix a broken ruler."

  Vera paused. She looked at the key, then back to Ansel. "If we're a cohort, then the lack of independence destroys the safety margin. Nine keys don't mean nine checks. They mean one check with nine triggers. That increases the risk of systemic failure."

  "It does," Ansel conceded. "But it also means your personal humility doesn't lower the risk. If I don't share your normative constraint—and I don't see why I should punish myself for a structural flaw—the key gets turned anyway. You sitting out doesn't save the world if I, or someone else, doesn't buy the discount."

  "I'm not sitting out to save the world alone," Vera said. "I'm trying to set a norm. If I act on ninety-five percent when the stakes are this asymmetric, I validate the threshold. If I hold out for ninety-nine point five, I signal that the burden of proof is higher."

  "Norms are fragile," Ansel said. "They're self-undermining in high-stakes unilateralism. If you deflate your probability estimate, you increase the chance that someone with a higher risk tolerance acts instead. You're betting that your virtue is contagious. It's not. It's just vacated space."

  Vera exhaled, a sharp sound in the sterile room. "You're right about the instrument. If the error is correlated, the 'outlier' argument weakens. I'm not statistically unique. But the unknown keys complicate it. We don't know how many of us are left. I suspect five destroyed their keys. Maybe only four are live."

  "If $N$ is four, the curse is weaker," Ansel said. "The probability that you are the maximum outlier drops."

  "But I don't know $N$," Vera said. "I have to assume worst case. $N$ equals nine. If I assume $N$ equals four and I'm wrong, I underestimate the selection bias. So I must act as if all nine are live."

  "And if all nine are live," Ansel countered, "and we all apply your discount, we might never release a cure that saves two hundred million people. You're prioritizing the avoidance of catastrophe over the certainty of mass death. That's a value judgment, not a Bayesian update."

  "It's a risk adjustment," Vera insisted. "If the instrument has a fifteen percent error rate, the true safety probability isn't ninety-five. It's lower. Let's say the error skews safety by ten percent. That drops us to eighty-five. Below the threshold for action even without the curse."

  Ansel rubbed his chin. "If the instrument skews safety, then everyone sees ninety-five. Why would anyone destroy their key?"

  "Because some of us checked the priors," Vera said. "Some of us realized the spectrometer was drift-prone. That's why $N$ is unknown. The ones who destroyed their keys might have seen the error. Which means the remaining keyholders are the ones who trusted the machine."

  Ansel went still. "So the surviving keys are selected for trust in a potentially faulty instrument."

  "Yes."

  "Then your discount isn't just about being the most enthusiastic," Ansel said, his voice dropping. "It's about being the most credulous. If the skeptics destroyed their keys, the pool of remaining actors is biased toward optimism."

  Vera nodded. "Exactly. So I must discount harder. Not ninety-nine point five. Maybe ninety-nine point nine."

  "And if you do," Ansel said, "you paralysis. You guarantee the famine to avoid the hypothetical collapse. You're letting the possibility of a ten-times-worse disaster justify a certain two-hundred-million-death disaster. That's not rationality, Vera. That's terror."

  "It's caution," she said.

  "It's a structural failure," Ansel snapped. "We shouldn't be having this conversation. We should have pooled our evidence. We should have required two keys. We should have named a trustee. Instead, we have nine guns on the table and you're arguing about whether to pull the trigger based on how many other hands are holding guns we can't see."

  "We couldn't agree on a trustee," Vera said. "Too much distrust. So we're here. With the norms we have."

  "Then the norm is broken," Ansel said. "If you hold back, and I step forward because I think your discount is cowardice, the system fails. If we both hold back, the system fails. The only stable equilibrium is coordination, not individual self-deflation."

  Vera looked at the keyslot. The hum seemed louder. "If I turn this, and the instrument was wrong, I kill the world. If I don't, and it was right, I let the world starve."

  "If you turn it," Ansel said softly, "you own the risk. If you don't, you own the starvation. But you don't own the outcome alone. You just own the choice."

  Vera's hand tightened on the key. She looked at Ansel, searching for a veto she knew he didn't have. "I still think the discount holds. The selection bias on the remaining keys... it's too high."

  "And I think you're hiding behind the math to avoid the blood on your hands either way," Ansel said. "But I can't stop you. And I won't destroy my key while you're holding yours. Because if you're wrong, I want the chance to fix it."

  "There is no fix," Vera said.

  "Then we're just gambling," Ansel said.

  Vera looked down at the console. The numbers swam in her head. Ninety-five percent. Fifteen percent error. Two hundred million versus two billion. The unknown $N$. The shared blind spot. She inserted the key. She did not turn it. Not yet.

  "Give me ten minutes," she said.

  "For what?"

  "To calculate if the skeptics destroyed their keys because of the instrument, or because of the ethics," Vera said. "If it was the instrument, the remaining pool is dangerous. If it was ethics, the remaining pool is just desperate."

  Ansel nodded slowly. "Ten minutes. Then I decide whether to insert my own."

  ***

  **Afterword**

  You have grasped the core of the Unilateralist's Curse (Bostrom, Sandberg, and Ord) correctly: when agents act unilaterally on private estimates, the project proceeds if *any* agent estimates it is good, selecting for outlier optimism. Vera's position—that one must condition on being the most enthusiastic actor—is the standard normative solution when coordination fails.

  However, your setup introduces two wrinkles that complicate the standard model, and here is where the genuine disagreement lies:

  1.  **Correlated Errors (The Shared Instrument):** The standard Curse assumes independent errors. If errors are correlated (as with your spectrometer), the "outlier" argument weakens (Vera isn't necessarily an outlier; everyone sees the same biased data), but the systemic risk increases (no diversity of error to catch the mistake). Ansel is right that Vera's specific Bayesian discount for being an "outlier" is less relevant if the data is identical, but Vera is right that the *risk* is higher because there are no independent checks. The disagreement bottoms out on whether "humility" fixes "systemic blindness." It doesn't; only better data does.
  2.  **Unknown $N$ (The Destroyed Keys):** This adds second-order uncertainty. If skeptics destroyed their keys, the remaining pool is indeed biased toward optimism (adverse selection). Vera is correct here; the remaining keyholders are not a random sample.

  **Who is correct?**
  Vera is theoretically correct about the decision theory: if you cannot coordinate, you must internalize the externality. Ansel is practically correct about the instability: norms are fragile, and individual self-deflation can simply cede the decision to a less scrupulous actor (the "self-undermining" point). In the literature, this is the tension between *cooperative norms* and *structural constraints*.

  **What your setup makes impossible to settle:**
  The scene cannot resolve the "right" action because the true probability of safety is unknowable to them in the moment. The drama lies in the burden of agency. Vera's hesitation is the only rational response to the uncertainty you've built, but Ansel is right that hesitation has a cost (famine). The tragedy is that both are right: the structure is flawed, and the norm is insufficient. Keep the ending ambiguous; a definitive choice would validate one side's risk calculus over the other, which the evidence in the room does not support.
