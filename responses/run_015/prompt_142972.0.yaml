  **Recommendation**

  The Panel recommends approval of the Neural Systems Group proposal, subject to the specific conditions outlined below regarding consent oversight and data monitoring. We recognize the fatal nature of the underlying condition necessitates high-risk intervention, but the epistemic uncertainty surrounding personal identity requires mitigating safeguards. This decision is provisional. We mandate a formal review of the protocol following the completion of the fifty-percent milestone by the first participant. At that juncture, the Panel will reassess divergence metrics and the efficacy of the continuity safeguards. Approval is contingent upon the strict adherence to the modified refusal protocol; any deviation requires immediate suspension. We proceed not because the metaphysical risks are resolved, but because the alternative is certain death, and the gradualness of the intervention offers the only plausible claim to survival. This recommendation is submitted for final vote on the fourteenth.

  **The Procedure As Proposed**

  Six participants with fatal prion disease will undergo cortical neuron replacement over twenty months. Neuromorphic units, tuned to displaced cells' input-output behaviour within stated tolerance, replace neurons in small batches. The protocol mandates a two-week calibration pause at every ten-percent milestone. The order of replacement is randomized across participants, acknowledging that end states will diverge from one another and from enrolment predictions. The consent form includes a continuity clause. Participants re-affirm consent at each checkpoint. However, refusal to continue is presumed an artefact of the replacement process and overridden, unless an independent assessor determines the participant's values have changed in a way she can articulate and endorse on reflection.

  **Why Gradualness Is Carrying the Weight**

  The ethical justification for this intervention relies entirely on the assumption that gradualness preserves continuity where instantaneous substitution would not. We must distinguish between a change being small and a change being gradual. A small change made instantly may still rupture identity; a large change made slowly may not. Here, the path through the replacement carries more weight than the state at the end of it. The team's modelling admits end states will diverge slightly; therefore, survival cannot be defined by the destination. It must be defined by the trajectory. If the replacement proceeds smoothly enough, the subject persists through the transformation. If we focus solely on the final configuration of synthetic and biological material, we see a different entity. We are betting that the temporal density of the swaps allows the mind to bridge the gap. The randomization of order confirms that there is no single correct end state, only viable paths. Consequently, our oversight must monitor the smoothness of the transition, not merely the functionality of the result. The risk is not that the patient dies at the end, but that they dissolve along the way. The two-week calibration pauses are critical; they are not merely technical adjustments but psychological airlocks. They allow the system to settle. However, tolerance levels matter. If the input-output behaviour drifts beyond the stated tolerance, the gradualness is illusory. We are accepting a scenario where the planks are replaced while the ship sails. But unlike the philosophical puzzle, this ship feels the replacement. We must ensure the feeling remains continuous. The divergence in end states implies that identity is not a fixed point but a range. If the path is smooth, the divergence is acceptable variation. If the path is jagged, the divergence is fracture. We are not preserving a static soul but a dynamic process. The procedure assumes that consciousness can tolerate substrate change if the rate of change is below a certain threshold. This threshold is unknown. That is why the milestones exist. They are not just technical checkpoints but ontological ones.

  **Whose Refusal Counts**

  The continuity clause presumes that a refusal to continue is a symptom of the procedure rather than an exercise of autonomy. The previous case, where a participant requested a halt at seventy percent but later expressed gratitude for continuing, is cited as proof that the refusal was transient. However, this proves only that the post-procedure entity values existence. It does not prove the refusing entity was the same person. We cannot tell the difference between a symptom and a self. This is the central fear. Overriding refusal treats the future self as more authoritative than the present self. Striking the clause entirely leaves a participant stranded at sixty percent with a partly synthetic brain and no way back, which is arguably worse. Therefore, we retain the clause but tighten the assessment. The independent assessor must not only check for articulate value changes but must compare them against pre-procedure baselines. The refusal counts if it aligns with prior values, even if articulated poorly due to procedure effects. We cannot allow the procedure to invalidate the very voice it claims to save. The epistemic gap is wide. When a participant says stop, is it the disease speaking, the synthetic neurons firing differently, or the core self reacting to annihilation? The previous participant's gratitude is post-hoc. The refusing self is silenced. If we override refusal too easily, we concede that the person who refused may be the only person there is. Yet, if we accept every refusal, we may allow a treatable glitch to kill the patient. The assessor's role is pivotal. They must distinguish between a change in values and a change in capacity. A refusal based on fear is not a refusal based on values. But fear may be rational. We need a higher threshold for overriding. The assessor must find evidence that the refusal contradicts the participant's enduring commitments, not just that it is poorly articulated. We are protecting the patient from a transient state she would later repudiate, but we must not repudiate her on the way. The clause stays, but the presumption of artefact is weakened.

  **The Strongest Thing That Can Be Said Against This Recommendation**

  The strongest argument against approval is that the need for a continuity clause concedes the loss of the person. If the procedure truly preserves identity, the participant should remain free to withdraw consent at any time, like any other patient. By constructing a mechanism to override refusal, the team admits that the person who emerges may not respect the wishes of the person who entered. This is not survival; it is replacement. The randomization of neuron order proves that the end state is not unique; if identity were preserved, the trajectory would not matter. The fact that it does matter suggests we are creating new entities who merely remember being the patient. The previous participant's gladness is irrelevant; a new mind might be glad to exist even if the old mind was murdered. To approve this is to sanction killing the patient to save a simulation that claims to be them. The fatal disease makes this tempting, but desperation is not ethics. We should reject the protocol until the team can guarantee that the refuser and the signer are identical. The divergence in end states is not merely technical noise; it is evidence of discontinuity. If I am replaced in a different order, I am not me. The team admits this divergence. Therefore, they admit identity is not fully preserved. We are trading a certain death for a probable replacement. The clause protects the replacement, not the patient. Rejecting this proposal does not save the patients from the prion disease, but it saves us from complicity in their metaphysical destruction. We cannot vote to create survivors who are not the people we enrolled.

  **Conditions and Timeline**

  Approval is conditional on three safeguards. First, the independent assessor must have access to a pre-procedure values inventory and video record to compare against current articulation. Second, if a refusal occurs, the calibration pause extends from two weeks to four weeks to allow for depression treatment and reflection. Third, the Panel retains veto power if divergence metrics exceed model predictions by more than five percent at any milestone. These conditions turn on the assumption that oversight can mitigate identity risk. The timeline for review is set for the first participant's fifty-percent milestone. If the safeguards fail to detect discontinuity, the protocol halts. We require monthly reports on calibration data. The continuity clause remains but cannot be invoked without the assessor's written certification that pre-procedure values are intact. This ensures the override protects the original person, not just the procedure. We will convene specifically for this review.
