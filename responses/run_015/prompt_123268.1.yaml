answer: |-
  Right, this is a proper philosophical puzzle wrapped in a deeply human situation. It is brilliant that you are looking at the specifications of the theory rather than just the history of the debate. Most people stop at 'Locke said no, Leibniz said yes', but the actual phenomenology of restorative vision is where the meat is.

  If we are drafting a specification for a theory of cross-modal recognition that actually fits the clinical and phenomenological data—especially with the nuances you have raised regarding 'modal inertia' and affective dissonance—here is the desiderata list.

  ### The Desiderata for a Theory of Post-Restorative Recognition

  **1. The Initial Negative (The Molyneux Constraint)**
  *   **The Requirement:** The theory must explain why visual recognition of tangible objects fails *immediately* upon restoration, despite the subject having perfect tactile knowledge of those objects.
  *   **The Case:** Almost all modern cases (cataract removal, gene therapy) show that patients cannot match the cube to the sphere by sight alone on day one. They see patches of colour and light, but not 'objects' in the tactile sense.
  *   **Status:** **Non-negotiable.** Any theory claiming immediate transfer of concepts is empirically falsified.
  *   **Camp Preference:** Historically favoured by Empiricists (Locke, Berkeley), but Rationalists must now explain why innate ideas are 'offline' at first.

  **2. The Rapid Acquisition Curve (The Learning Constraint)**
  *   **The Requirement:** The theory must account for the speed of recovery. Recognition usually emerges within days or weeks, not years. It must distinguish this from learning a wholly new skill (like reading).
  *   **The Case:** Patients learn to visually identify previously touched objects much faster than a sighted person learns a new abstract concept. This suggests a mapping process, not creation from scratch.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** This creates the central friction with Requirement 1. If the concepts aren't there initially (Req 1), how do they appear so quickly (Req 2) without positing a hidden innate structure?

  **3. Modal Inertia (The Dominance Constraint)**
  *   **The Requirement:** The theory must explain why haptic data continues to override visual data for a significant period, even when visual acuity is sufficient. The subject trusts the hand over the eye.
  *   **The Case:** As you noted, your flatmate's brother likely reaches out to confirm what he sees. The visual field is treated as 'unreliable' or 'decorative' while touch remains 'veridical'.
  *   **Status:** **Non-negotiable.** This is a robust behavioural observation in rehabilitation literature.
  *   **Camp Preference:** Phenomenologists (Merleau-Ponty types) would argue this is essential to the body schema; strict computationalists might view it merely as a weighting error in sensory integration.

  **4. Affective and Textural Dissonance**
  *   **The Requirement:** The theory must accommodate mismatches in qualitative 'feel' between modes. An object can be tactually smooth/friendly but visually sharp/aggressive.
  *   **The Case:** Your brother's report that the sphere 'feels friendly' but looks 'sharp'. This suggests that 'objecthood' includes affective valence, not just geometry. If the theory only maps geometry, it fails to explain the distress or confusion caused by this mismatch.
  *   **Status:** **Camp Preference.** Traditional metaphysics ignores this, treating it as secondary 'qualia'. However, for a *complete* theory of recognition (rather than just identification), this is essential. If recognition involves emotional safety, this is non-negotiable.
  *   **Tension:** Hard to square with physicalist accounts that treat shape as primary and affect as secondary.

  **5. The Spatial vs. Object Distinction**
  *   **The Requirement:** The theory must differentiate between recognising *spatial relations* (motion, depth) and *object properties* (shape, identity).
  *   **The Case:** Patients often recover motion perception (seeing something move) before they recover form perception (seeing *what* is moving).
  *   **Status:** **Non-negotiable.** A theory that treats 'vision' as a single block will fail.
  *   **Camp Preference:** Nativists often argue motion detection is innate, while form recognition is constructed.

  ---

  ### Joint Unsatisfiability and Tensions

  You have a very sharp hunch about the tension between explaining immediate failure and eventual success. Here is where the specifications clash.

  **The Innateness Paradox (Req 1 vs. Req 2)**
  This is the hardest knot.
  *   If you posit that spatial concepts are **innate** (Rationalist), you satisfy Req 2 (rapid success) because the brain just needs to 'switch on' the visual channel to access existing concepts. *However*, you struggle to explain Req 1 (immediate failure). Why would an innate concept be inaccessible if the hardware is working?
  *   If you posit that concepts are **constructed** from experience (Empiricist), you satisfy Req 1 (no prior visual experience means no visual concepts). *However*, you struggle to explain Req 2. How does the brain build a complex 3D shape concept from 2D retinal data in a few days? That usually takes infants 6 months.
  *   **The Conflict:** You cannot easily hold both 'no innate visual concepts' and 'rapid concept formation' without introducing a third variable.
  *   **The Solution Space:** The only way to satisfy both is to propose that the *amodal* concept exists (via touch), but the *translation key* is missing. The theory must posit a 'inter-modal dictionary' that is learned, not the objects themselves. But this risks becoming the 'hand-waving' you want to avoid.

  **Modal Inertia vs. Visual Primacy (Req 3 vs. Standard Perception)**
  *   Standard theories of adult perception assume vision eventually dominates (the 'visual capture' effect, like ventriloquism).
  *   Your theory must explain why, in restorative cases, the hierarchy is inverted for months.
  *   **Unsatisfiability:** If the theory claims vision is the 'primary' distance sense for humans biologically, it cannot explain Modal Inertia without admitting that 'primacy' is a function of reliability history, not biology. This forces the theory to be historical/developmental, not purely structural.

  ---

  ### The 'Learning' Hand-Wave Problem

  You asked to avoid just saying 'the brain learned'. To do this, the theory must specify the *mechanism of calibration*.

  Adequate theories must propose that the brain is not learning *what a sphere is*, but rather **what a sphere looks like when it is a sphere**. It is a correlation task, not a concept-formation task.
  *   **The Spec:** The theory must define the unit of correlation. Is it correlating edges? Shading gradients? Motion parallax?
  *   **The Trap:** If the unit is too small (pixels), learning would take years. If the unit is too big (whole objects), it begs the question of how the eye segments the object in the first place.
  *   **The Requirement:** The theory must identify a 'mid-level' visual primitive (perhaps motion boundaries or shading continuity) that is sufficiently simple to be detected immediately, but sufficiently complex to anchor the tactile concept.

  ---

  ### Where My Reasoning is Shakest

  I need to be honest with you. There are two areas in this spec where I am on thin ice, and specific findings could overturn them.

  **1. The Affective Mapping (Req 4)**
  I am treating the 'friendly vs. sharp' dissonance as a philosophical requirement. I might be wrong. It is possible this is merely a linguistic confusion or a metaphorical description by the patient, rather than a genuine perceptual mismatch.
  *   **What would change my mind:** If neuroimaging showed that the affective response (amygdala activation) to the visual sphere matched the tactile sphere *before* the patient could consciously identify the shape. If the body 'knows' it is friendly before the mind 'sees' it, then the affective mapping is innate/automatic, and the 'dissonance' is just cognitive confusion. That would make Req 4 a non-issue for the core theory of recognition.

  **2. The Nature of 'Modal Inertia'**
  I have classified Modal Inertia as a non-negotiable behavioural fact. However, it might be a rational strategy rather than a perceptual deficit. The patient *knows* their vision is new and unreliable, so they choose to trust touch.
  *   **What would change my mind:** If experiments showed patients reflexively flinching from visual threats (like a looming object) while simultaneously claiming they don't 'see' the object. If the subconscious visual system is already calibrated (Req 1 is false for subconscious action) but the conscious report lags, then 'Modal Inertia' is a cognitive reporting error, not a perceptual integration failure. This would shift the entire theory from perception to epistemology.

  ### Summary for your purposes

  If you are evaluating theories or discussing this with clinicians/philosophers, push for the **Calibration Model**.
  1.  **Reject** the idea that the patient is learning 'objecthood'.
  2.  **Insist** the patient is learning 'visual translation rules' for existing tactile objects.
  3.  **Demand** the theory explains why touch remains the 'truth anchor' (Modal Inertia) during this calibration.
  4.  **Flag** the affective mismatch as a potential dealbreaker for purely geometric theories.

  It is a lovely thing you are doing, trying to make sense of this for your flatmate's family. Keep an eye on that 'friendly/sharp' comment; that might be the key to the qualia problem that the geometric shapes obscure.
