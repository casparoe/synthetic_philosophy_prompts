      *   *Critics:* Gerhard Ritter and others argued Fischer overread the documents, ignored Russian/French mobilization, and conflated contingency with design.
      *   *July Crisis:* It involved a complex chain of ultimatums, mobilizations, and "blank checks." Decision-making was centralized but pressured by military timetables.
      *   *Philosophical Distinction:* Collective blame (attributing fault to a group entity) is distinct from individual culpability (moral guilt of specific agents). One can exist without the other.
      *   *Drafting Check:* Ensure neutral language. Avoid saying "Fischer was right." Say "Fischer argued..."

  3.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Contrast the two philosophical frameworks applied to the historical data.
      *   *Camp 1 (Intentionalists):* Focus on *joint commitment*. Did the German *Volk* or even the broader bureaucracy share an intention? No. Therefore, "Germany" cannot be blamed, only specific leaders. Fischer proves elite guilt, not collective guilt.
      *   *Camp 2 (Attributivists):* Focus on *structural participation*. Did German institutions and citizens participate in the structures that produced war? Yes. Therefore, political responsibility attaches to the collective, regardless of shared intent. Fischer proves systemic culpability.
      *   *Wording:* Use terms like "shared intentionality" for Camp 1 and "structural injustice/social connection" for Camp 2. Ensure Camp 2 doesn't sound like they are blaming grandmothers for murder, but rather bearing political responsibility for outcomes.

  4.  **Drafting Section 3: Crux Section:**
      *   *Goal:* Identify the specific pivot points and test cases.
      *   *Crux 1: Hierarchy as Joint Commitment.* Can a state hierarchy count as a Bratmanian "we"?
          *   *Test:* The Schlieffen Plan execution. Subordinates following orders without knowing the grand strategy.
          *   *Camp 1 Prediction:* No joint commitment among subordinates; they are tools.
          *   *Camp 2 Prediction:* Subordinates are structurally connected; their actions constitute the state's action.
      *   *Crux 2: Awareness in Young's Model.* Does social connection require knowing you are connected?
          *   *Test:* Hypothetical ignorant citizenry (e.g., censored press, total secrecy).
          *   *Camp 1 Prediction:* No responsibility without awareness/intent.
          *   *Camp 2 Prediction:* Responsibility remains based on benefit/participation in structure, even without awareness (though awareness affects *degree* of blame).
      *   *Refinement:* Ensure the predictions are distinct and follow logically from their premises.

  5.  **Drafting Section 4: Verbal vs. Substantive Disagreement:**
      *   *Goal:* Analyze if they are talking past each other.
      *   *Analysis:* They are using "responsibility" or "blame" differently. Camp 1 means *moral culpability* (requiring mind). Camp 2 means *political responsibility* (requiring connection).
      *   *Conclusion:* It is partially verbal (definition of terms) but also substantive (what conditions trigger those terms). The core substantive fight is whether *structural causation* is sufficient for *moral/political attribution* in the absence of *shared intent*.
      *   *Refinement:* Be precise. It's not *just* verbal. If it were just verbal, they could agree on facts and just label them differently. But they disagree on whether the lack of shared intent *excludes* the label of collective responsibility.

