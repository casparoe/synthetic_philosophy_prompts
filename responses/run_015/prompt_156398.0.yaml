      *   *Correction:* Ensure the Fischer summary is accurate. Fischer argued for a *continuity* of German aggression (from Wilhelm II to Hitler), focusing on the September Program and the "Blank Check."
      *   *Correction:* In the Crux section, make sure the "predictions" are about what the case *demonstrates* regarding responsibility, not historical outcomes (since the history is fixed).

