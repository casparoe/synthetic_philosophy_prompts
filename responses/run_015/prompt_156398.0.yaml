  # JOINT STATEMENT ON COLLECTIVE RESPONSIBILITY AND THE FISCHER CONTROVERSY

  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Attribution of Responsibility for the First World War
  **Parties:** The Collective Intentionalist Camp (Camp One) and The Structural Attributivist Camp (Camp Two)

  ## I. AGREED CLAIMS

  The undersigned parties acknowledge the following historical and philosophical premises as the baseline for this collaboration. These claims represent the intersection of our respective analyses regarding the Fischer Controversy and the nature of collective agency.

  1.  **Regarding Fritz Fischer's Archival Argument:** Both camps agree that Fritz Fischer's research, specifically in *Griff nach der Weltmacht* (1961), demonstrated that key elements of the German leadership (including Chancellor Bethmann-Hollweg and the General Staff) pursued expansionist war aims prior to 1914 and utilized the July Crisis to initiate a localized conflict that they understood carried a high risk of general European war.
  2.  **Regarding the Critique of Fischer:** Both camps acknowledge that Fischer's critics (notably Gerhard Ritter) successfully demonstrated that German policy was not monolithic, that other powers (Russia, France, Britain) contributed to the escalation through mobilization and alliance commitments, and that Fischer's evidence does not prove a premeditated plan for a *general* war existing continuously from 1912 to 1914.
  3.  **Regarding the July Crisis Decision Structure:** It is undisputed that the decision-making apparatus of the German Empire was hierarchical and fragmented. Authority was divided between the civilian government, the military cabinet, and the Kaiser, with no single individual possessing absolute unilateral control over the declaration of war, though the military timetables (specifically the Schlieffen Plan) exerted coercive pressure on political decision-making.
  4.  **Regarding the Philosophical Distinction:** Both camps agree that *individual culpability* (the moral guilt of specific agents for specific acts) is conceptually distinct from *collective responsibility* (the attribution of fault or obligation to a group entity). It is possible for individuals to be culpable without the collective being responsible, and vice versa, depending on the criteria used for attribution.

  ## II. DISAGREEMENTS TABLE

  The following table outlines the divergent interpretations of the historical record based on our respective philosophical frameworks. Each position is articulated in terms acceptable to its proponents.

  | Feature of Analysis | Camp One: Collective Intentionalists | Camp Two: Structural Attributivists |
  | :--- | :--- | :--- |
  | **Primary Philosophical Framework** | **Bratmanian Shared Intentionality:** Collective agency requires a mesh of interlocking intentions, mutual responsiveness, and a commitment to joint activity among the members of the group. | **Young's Social Connection Model:** Political responsibility arises from participation in structural processes that produce outcomes, regardless of whether agents share a unified intention or mental state. |
  | **Interpretation of Fischer's Evidence** | Fischer identified the intentions of a specific *elite subset* (the "war party"). He did not, and could not, demonstrate that the German nation or even the broader bureaucracy shared a joint commitment to wage war. | Fischer identified the *systemic logic* of the German state. The documents reveal institutional imperatives and structural pressures that operated independently of individual psyches, implicating the state apparatus as a whole. |
  | **Condition for "Blaming Germany"** | To blame "Germany" is to claim the German people or polity acted as a unified agent. Since the populace and lower bureaucracy lacked knowledge of or commitment to the elite's specific war aims, "Germany" cannot be blamed, only specific leaders. | To blame "Germany" is to identify the state as the locus of structural causation. Because citizens and institutions benefited from and sustained the imperial structure that produced the war, the collective bears political responsibility. |
  | **Role of Citizen Awareness** | Awareness is constitutive. Without the capacity to understand and align with the group's intention, citizens cannot be part of the collective agent that committed the act. | Awareness is mitigating, not constitutive. One can bear responsibility for structural outcomes even if ignorant of the specific policy, provided one participates in the structure that generates the harm. |
  | **Conclusion on War Guilt** | The "War Guilt" clause of the Treaty of Versailles was philosophically incoherent insofar as it implicated the collective. Guilt rests solely with the specific architects of the July Crisis. | The "War Guilt" clause was imprecise but directionally correct in assigning political responsibility to the German state as an institutional entity, distinct from the criminal guilt of individuals. |

  ## III. CRUX SECTION

  The following section identifies the specific sub-questions that divide the two camps. For each crux, we propose a concrete historical episode or conceptual test case. We record our predictions regarding what these cases demonstrate about collective responsibility prior to any adjudication.

  ### Crux 1: Hierarchical Institutions and Joint Commitment
  **The Question:** Can a hierarchical state institution instantiate a Bratman-style joint commitment if the lower levels of the hierarchy execute orders without knowing the ultimate goal of the leadership?

  **The Test Case:** **The Execution of the Schlieffen Plan (August 1914).**
  Consider the railway schedulers and lower-level battalion commanders who mobilized troops. They followed standing orders and timetables. Most did not know that the mobilization was intended as a coercive diplomatic bluff that might trigger a general war, nor did they share the expansionist aims of Bethmann-Hollweg.

  *   **Camp One Prediction:** This case demonstrates the *absence* of collective responsibility. The lower-level actors were tools, not participants in a shared intention. Since the "collective" (the nation/army) lacked a shared mesh of intentions regarding the war's initiation, the action cannot be attributed to the collective, only to the commanders who possessed the intent.
  *   **Camp Two Prediction:** This case demonstrates the *presence* of structural responsibility. The efficiency of the railway schedulers and battalion commanders constituted the material realization of the state's aggression. Their functional integration into the hierarchy makes them part of the responsible collective, even absent shared intent, because their actions were the necessary conditions for the outcome.

  ### Crux 2: Awareness and the Social Connection Model
  **The Question:** Does Iris Marion Young's social-connection model require any threshold of shared awareness among the population to ground blame, or does mere participation in the economic/political structure suffice?

  **The Test Case:** **Hypothetical Scenario: The Censored Polity.**
  Imagine a counterfactual 1914 Germany where the government successfully concealed all diplomatic cables and war aims from the public and the non-military bureaucracy until after shots were fired. The public supported the war only after being told it was defensive.

  *   **Camp One Prediction:** In this scenario, collective blame is impossible. Without awareness, there is no possibility of joint commitment. The "nation" was deceived, not acting. To blame them is to commit a category error.
  *   **Camp Two Prediction:** In this scenario, collective political responsibility remains, though individual culpability is reduced. The public still benefited from the imperial structure and sustained the institutions that allowed the secrecy to occur. Responsibility attaches to the position one occupies within the structure, not solely to one's epistemic state.

  ## IV. ANALYSIS OF VERBAL VS. SUBSTANTIVE DISAGREEMENT

  Upon review of the preceding sections, we determine that the disagreement between Camp One and Camp Two is **partially verbal but predominantly substantive.**

  **The Verbal Component:**
  A portion of the conflict arises from the definition of the term "blame." Camp One employs a thick moral concept of blame that implies *culpability* and *condemnation* akin to criminal liability, which logically requires *mens rea* (a guilty mind) distributed across the agents. Camp Two employs a thin political concept of responsibility that implies *obligation to repair* and *duty to reform*, which does not require *mens rea*. If Camp One were to ask "Is Germany culpable?" and Camp Two were to ask "Is Germany responsible?", they might agree on the facts while differing only on the label.

  **The Substantive Component:**
  However, the disagreement is not merely semantic. It concerns the empirical conditions required to trigger *any* form of negative attribution to a collective.
  1.  **Ontological Disagreement:** Camp One denies that a state can act as a unified agent without psychological interlocking among its members. Camp Two asserts that the state acts as a unified agent through structural causation regardless of psychological interlocking. This is a disagreement about the nature of social ontology, not just vocabulary.
  2.  **Normative Disagreement:** Even if we agreed to use the word "responsibility" for Camp Two's concept, Camp One argues that applying it to the German populace is *unjust* because it violates principles of agency. Camp Two argues that withholding it is *unjust* because it allows structural beneficiaries to evade accountability.

  **Conclusion:**
  The parties agree that they are not merely arguing over definitions. They disagree fundamentally on whether *structural causation* is sufficient to ground *moral or political attribution* in the absence of *shared intent*. Resolving this requires not only clarifying terminology but adjudicating the Crux scenarios identified in Section III.
