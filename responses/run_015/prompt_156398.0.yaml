prompt: |-
  Construct the document that should result from an adversarial collaboration between two camps on collective responsibility for the First World War, specifically in light of the Fischer controversy over whether Germany deliberately sought a European war. Camp One, the Collective Intentionalists, maintains that a nation can be blamed only if its members share a collective intention in something like Bratman's sense of shared cooperative activity; they read Fischer's archival findings as revealing the intentions of a small elite, not a jointly committed nation. Camp Two, the Structural Attributivists, maintains that Iris Marion Young's social-connection model applies: a state can bear responsibility for the structural outcomes of its institutions regardless of whether its citizens share any unified mental state, and they treat Fischer's evidence as showing systemic causal responsibility rather than a distributed collective mind.

  The deliverable should be structured as follows: first, a numbered section of claims both sides can sign—about what Fischer actually argued, what his critics demonstrated, what remains undisputed about the July Crisis decision structure, and what philosophical distinction separates collective blame from individual culpability. Second, a disagreements table in which each camp's position is rendered in wording its own proponents would accept, not in straw-man form. Third, a crux section identifying the sub-questions that actually divide them; I anticipate one crux concerns whether hierarchical state institutions can instantiate Bratman-style joint commitment, and another concerns whether Young's model requires any shared awareness among the population to ground blame. For each crux, propose a concrete historical episode or conceptual test both sides agree is relevant—perhaps the decision-chain of the Schlieffen Plan's execution or a hypothetical scenario in which citizens are entirely ignorant of state policy—with each side's prediction about what that case shows, recorded before any adjudication. Finally, state whether any portion of their disagreement is merely verbal—for instance, whether they disagree about the concept of 'blaming Germany' or about the empirical conditions for applying it—and explain precisely which part.

  Write the response in American English, keep it formal and polished, and avoid requesting citations, bibliographies, or reading lists.
