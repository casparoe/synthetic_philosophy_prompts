answer: |-
  Brainstorming candidate settings:
  1.  **Hospital Discharge Rates:** Dropped. Nursing staff are agents who will inevitably adapt discharge practices to meet targets, introducing strategic failure.
  2.  **School Examination Scores:** Dropped. Teachers will teach to the test; impossible to isolate extremal effects from strategic gaming.
  3.  **Industrial Ceramic Kiln:** Selected. The firing process is automated; the clay composition varies naturally; engineers optimise settings based on historical data without personal incentive to game.

  **Scenario**

  A municipal brickworks produces structural masonry using an automated kiln controlled by a legacy algorithm. The engineering team aims to maximise structural integrity (target), which historically correlates perfectly with peak firing temperature (proxy) because higher heat improves sintering. Their historical data comes exclusively from Clay Batch Alpha, which tolerates temperatures up to 1200°C before microfractures occur. A new supply, Clay Batch Beta, is introduced; it is chemically identical in standard assays but contains a trace mineral that lowers the fracture threshold to 1100°C. This variance is unobservable before firing. The team updates the algorithm to maximise temperature based on the historical dataset, assuming the monotonic relation holds. They consider a guardrail capping temperature at 1200°C, the historical maximum. However, because Beta's threshold is lower than the historical cap, the optimisation pushes the kiln to 1200°C, causing widespread microfracturing in Beta bricks that renders them weaker than unfired clay, while the guardrail fails to prevent the damage because the safe limit has shifted unseen.

  **Design Analysis**

  1.  **Target:** Structural Integrity (compressive strength). **Proxy:** Peak Firing Temperature.
  2.  **Causal Graph:**
      ```
      [Clay Composition] --> [Sintering Quality] --> [Structural Integrity]
             |                       ^
             |                       |
             v                       |
      [Fracture Threshold] --(limit)--+
             ^
             |
      [Peak Temp] --------------------+
      ```
      *Upstream Driver:* Heat causes sintering (good). *Side Path:* Heat exceeds threshold (varies by composition) causing fractures (bad).
  3.  **Historical Data:** All data points are from Batch Alpha. The fracture threshold (1200°C) was never reached or exceeded in the dataset, so the curve never bent within observed bounds. The relation appeared strictly monotonic.
  4.  **Verdicts:**
      *   *Do nothing:* Use old settings (1150°C). Beta bricks survive; integrity is baseline acceptable.
      *   *Intervene on upstream:* Impossible; clay composition is unobservable pre-fire.
      *   *Intervene on proxy (optimise):* Set to 1200°C. Beta bricks fracture; integrity collapses below baseline.
      *   *Intervene with guardrail:* Cap at 1200°C (historical max). Beta bricks still fracture; integrity collapses below baseline.
  5.  **Structural Feature:** Context-dependent non-linearity. The function mapping proxy to target changes shape based on an unobservable variable (clay trace minerals).
      *   *Ablation 1 (Delete Bend):* If strength increased indefinitely with heat, optimisation succeeds; no Goodhart.
      *   *Ablation 2 (Adaptive Agent):* If the kiln could sense fractures mid-fire and stop, it becomes a control problem, not a measurement failure.
  6.  **Objection:** A sceptic argues this is merely a non-monotone dose-response curve, a physical fact, not a measurement error. The fix is to measure integrity directly via ultrasound before dispatch.
      *   *Response:* This is not fatal. Goodhart's law concerns the use of proxies for *decision-making* when direct measurement is costly or delayed. Integrity testing is destructive or too slow for process control. The failure arises because the proxy was treated as a stable objective function rather than a context-sensitive indicator. The law holds because the metric ceased to guide towards the target under optimisation pressure, even without agency.
  7.  **Conclusion:** This case supports treating specification gaming as a separate animal; here the failure occurs in the physics of the system, not the psychology of the agent.
