answer: |-
  ### The Normative Architecture of Procreative Asymmetry

  The institutional architecture described reveals a deep-seated **Presumptive Procreative Beneficence**. This framework operates on the implicit premise that bringing a new person into existence is a default good (or at least a neutral right) that serves the interests of the prospective parents and society, whereas permanently foreclosing that possibility is a deviation requiring safeguarding against future regret.

  **Reconstructing the Implicit Theory of Harm and Benefit**
  The system does not presuppose the Benatarian asymmetry (where the absence of pain is good but the absence of pleasure is not bad). Rather, it presupposes a **Person-Affecting Pronatalism**. In this view:
  1.  **Harm:** The primary harm recognized is the frustration of existing persons' (the parents') desire to reproduce. Infertility is classified as a disease state (ICD-10 codes) warranting therapeutic intervention.
  2.  **Benefit:** The creation of a new life is treated as a therapeutic success and a social good. The "absence of pleasure" (a childless life) is implicitly coded as a deficit for the parents, justifying public subsidy for IVF.
  3.  **Asymmetry:** The asymmetry is not about the welfare of the non-existent child (who has no standing in either scenario), but about the *stability of the existing adult's identity*. The system assumes that the desire for sterilization is potentially transient (hence waiting periods), while the desire for reproduction is inherently stable and authentic (hence immediate access).

  Therefore, the system rejects the notion that non-creation needs no justification. By gatekeeping sterilization, it implies that *preventing existence* requires justification (maturity, certainty), while *creating existence* requires none.

  **Strict Requirements vs. Mere Accommodations**
  *   **Strictly Required:** The system mandates medical safety standards for IVF and psychological certainty for sterilization. It requires that reproductive capacity be treated as a health asset to be preserved or restored.
  *   **Merely Accommodated:** The system accommodates childlessness only as a concession to autonomy, not as an equivalent health outcome. It allows sterilization but frames it as a "last resort." It accommodates the moral silence on procreation; by not requiring counseling on the ethics of existence, it implicitly validates procreation as morally self-justifying.

  **Coherence with Bodily Autonomy**
  This framework is **incoherent** with standard liberal conceptions of bodily autonomy.
  *   **Negative vs. Positive Rights:** Bodily autonomy traditionally prioritizes negative rights (the right to refuse intrusion/sterilization) over positive rights (the right to demand resources/IVF). This system inverts that hierarchy, making it easier to claim resources to alter biology (IVF) than to secure integrity against future biological potential (sterilization).
  *   **Paternalism:** The gatekeeping of sterilization relies on soft paternalism (protecting people from future regret), yet no equivalent paternalism protects the future child from a potentially unhappy existence or the parents from the burdens of parenting. The legal system recognizes the right to refuse life-saving treatment, yet questions the right to refuse fertility.

  **Inverting the Framework: Procreation as Presumptively Requiring Justification**
  If the system treated procreation as the act requiring moral justification (similar to how sterilization is currently treated), the following structural changes would be necessary:
  1.  **Funding Priorities:** Public and private insurance would default to covering Long-Acting Reversible Contraception (LARC) and sterilization without copay, while IVF and obstetric care would be subject to means-testing or ethical review.
  2.  **Mandatory Counseling:** Prospective parents would be required to undergo counseling sessions covering the environmental impact of population growth, the ethical arguments for antinatalism, and the statistical risks of childhood suffering, similar to the informed consent currently required for vasectomies.
  3.  **Waiting Periods:** A mandatory waiting period (e.g., 6–12 months) would be imposed between the declaration of intent to conceive (or start IVF) and the procedure, to ensure the decision is not impulsive.
  4.  **Licensing/Screening:** Pre-conception screening would evaluate financial stability and psychological readiness not just for the *health* of the child, but for the *moral justification* of imposing existence.

