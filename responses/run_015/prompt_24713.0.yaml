      *   **Conclusion:** Call to vote.

  6.  **Refining the Rule for a Clerk:**
      *   "Calculate the Priority-Weighted Marginal Return (PWMR) for each clinic for the upcoming budget cycle. PWMR = (Estimated Health Outcomes per Dollar) × (Community Deprivation Index Factor). Allocate the next marginal dollar to the clinic with the highest PWMR until the budget is exhausted."
      *   *Deprivation Index Factor:* Let's say 1.5 for the bottom quartile, 1.0 for the top.
      *   *Wait, "Estimated Health Outcomes" is hard for a clerk.*
