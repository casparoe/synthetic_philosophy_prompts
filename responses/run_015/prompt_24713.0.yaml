      *   **Factions:**
          1.  *Equalizers:* Equalize per-capita spending (equality of resources).
          2.  *Maximizers:* Maximize total health outcomes (utilitarian/efficiency).
          3.  *Prioritarians:* Priority to the worst-off (weighted health gains).
      *   **Requirements:**
          1.  Recommend one *concrete allocation rule* (actionable, not a slogan).
          2.  Specify a *time frame* for adoption.
          3.  Resolve the "leveling down" dispute (does the rule make Cedar patients worse off just to reduce inequality, even if no one benefits?).
