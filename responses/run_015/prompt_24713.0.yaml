      *   *Option 3 (Prioritarianism):* Balances efficiency and need. It acknowledges Rivertown's patients are worse off but doesn't necessarily ignore efficiency entirely (unless the weight is infinite).
      *   *Decision:* The Prioritarian approach is the most ethically robust for a public health context. It addresses the "worst-off" constraint without blindly throwing money at inefficiency or ignoring need.
      *   *Concrete Rule:* Needs to be mathematical. A weighted QALY (Quality-Adjusted Life Year) or health-outcome model is best. Let's propose a "Weighted Health Outcome" formula.
      *   *Formula Idea:* Allocate based on $ \sum (Health Gain_i \times Weight_i) $. The weight is a function of baseline health status.
      *   *Refinement for Simplicity:* A "Needs-Adjusted Efficiency" rule. Allocate funds to maximize $ \sum (Efficiency_i \times NeedWeight_i) $.
      *   *Actually, simpler for a clerk:* A hybrid cap/floor with a weighted marginal utility rule.
      *   *Best Concrete Rule:* "Marginal Priority-Weighted Utility." For every dollar allocated, calculate the expected health return multiplied by a priority weight based on the clinic's baseline community health index. Allocate the next dollar to the clinic with the highest weighted score until the budget is exhausted.
      *   *Wait, keep it actionable:* "Allocate funds sequentially to the clinic yielding the highest *Priority-Weighted Health Return* (PWHR) per dollar, where PWHR = (Marginal Health Outcome) × (1 + NeedCoefficient / Baseline Health Status)."
      *   *Even simpler:* Let's define a specific weighting scheme. "Allocate to maximize the sum of health outcomes, where each outcome is weighted by the inverse of the clinic's baseline community health score."
      *   *Let's go with a specific formula:* **The Priority-Weighted Efficiency Rule.**
      *   *Formula:* $Score_c = \frac{Efficiency_c}{BaselineHealth_c^\alpha}$. Allocate to highest Score.
      *   *Actually, the prompt asks for a rule a clerk can apply.* A step-wise allocation is hard to describe briefly. A formula for share calculation is better.
      *   *Proposed Rule:* **The Weighted Health Maximization Rule.**
      *   *Mechanism:* Budget shares are proportional to (Population × Baseline Need Index × Efficiency Factor).
      *   *Wait, if Cedar is 2x efficient, maximizing outcomes sends money there. If Rivertown is worst off, priority sends money there.*
      *   *Let's choose the Prioritarian view but mitigate the efficiency loss.*
      *   *Recommendation:* **The Diminishing Priority Rule.**
      *   *Specifics:* Assign a "Priority Weight" to each clinic based on patient health status (e.g., Rivertown = 1.5, Cedar = 1.0). Calculate "Weighted Health Return" = (Marginal Health Outcome) × (Priority Weight). Allocate budget to the highest Weighted Health Return until marginal returns equalize across clinics.
      *   *Time Frame:* Immediate adoption for the coming fiscal year, with a review in 3 years.

  3.  **Address the "Leveling Down" Objection:**
      *   *The Objection:* Does Prioritarianism require making Cedar patients worse off just to make things equal, even if it helps no one?
      *   *The Resolution:* No. Prioritarianism is about *gains*, not levels. It values gains to the worse off more, but it does not value destruction of value for the better off unless it produces a gain for the worse off. If taking from Cedar helps no one (e.g., the money disappears), the rule forbids it. The rule is forward-looking (marginal), not backward-looking (redistributive for symmetry).
      *   *Crucial Distinction:* Telic Prioritarianism vs. Deontic/Rule. I need to ensure the rule doesn't mandate burning money. The rule maximizes *weighted* good. Destroying good reduces the total weighted good. So, the rule avoids leveling down.

  4.  **Address the Equalization Faction's Worry:**
      *   *The Worry:* By weighting need, we might still underfund Rivertown's basic infrastructure compared to Cedar's luxury efficiency, perpetuating a "dignity gap" in resources regardless of outcomes. Equality of resources ensures civic standing.
      *   *The Response:* Acknowledge this. However, in a fixed budget crisis, resource equality might mean health inequality. The rule survives because it prioritizes *health justice* over *fiscal symmetry*, but we must monitor that Rivertown doesn't fall below a minimum threshold of care. (Maybe add a constraint: Minimum Viable Infrastructure).
      *   *Refinement:* To make the rule survive, I should add a "Minimum Infrastructure Floor" to the recommendation. This addresses the Equalizer's worry that Rivertown will be left with broken walls while Cedar gets new tech.
      *   *Revised Rule:* **Weighted Health Maximization with a Minimum Infrastructure Floor.**
