      *   *Better approach:* Recommend the **Priority-Weighted Marginal Return Rule**. Address the worry: The worry is that resource inequality insults civic standing. The rule survives because public health justice is about health, not dollars. Equal dollars yielding unequal health is the real injustice.

  5.  **Drafting - Section by Section:**
