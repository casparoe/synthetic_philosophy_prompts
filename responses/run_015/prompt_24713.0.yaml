      *   *Need Weight:* Inverse of baseline health.
      *   *Let's stick to the Marginal approach as it fits the "efficiency" description in the prompt.*
      *   *Revised Rule:* **The Weighted Marginal Utility Protocol.**
      *   1. Determine marginal health return per $1k for each clinic.
      *   2. Apply a "Priority Multiplier" based on patient baseline health (e.g., Rivertown 1.5, Cedar 1.0).
      *   3. Fund the highest weighted return until returns equalize.

  7.  **Drafting the Content (incorporating constraints):**
      *   *Leveling Down:* Must explicitly say "No." The rule maximizes weighted good. Reducing Cedar's budget without helping Rivertown reduces total weighted good.
      *   *Equalizer Worry:* "Resource inequality undermines equal citizenship." Rebuttal: "Health inequality is the greater injustice; dollars are means, not ends."
      *   *Tone:* Professional, decisive, philosophical but practical.

  8.  **Review against Constraints:**
