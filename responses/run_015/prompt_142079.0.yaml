  ### The Scenario: The Vault at Strickland & Ames

  Strickland & Ames, a boutique architecture firm, must select a structural engineer for a museum project by end-of-day today ($t=0$). Two senior partners, Alice and Bob, share equal equity. They agree that Vendor Safe is reliable, while Vendor Risk is cheaper but carries a 50% chance of a catastrophic delay costing the firm $4M (Loss $L$). A regulatory audit of Vendor Risk releases tomorrow ($t=1$); if clear, Risk is optimal; if flagged, Safe is mandatory. Waiting for the audit guarantees the optimal choice (Firm Value $V_{wait} = \$10M$). Committing today forces a blind choice (Expected Firm Value $V_{blind} = \$8M$). The partner whose digital signature is timestamped first on the contract receives the "Lead Architect" credit, worth a private bonus of $B = \$200k$. The firm uses a "Latency-Locked" submission vault: a signature is timestamped and irrevocable upon submission, but becomes visible to the other partner and legally effective only after a lag $T$. If both sign, the earlier timestamp claims the bonus; the later signer is bound by the first's vendor choice (compatible commitments) but receives no bonus.

  ### Equilibrium Reasoning

  **Case 1: Instant Visibility ($T=0$)**
  With $T=0$, commitments are visible immediately. This creates a pre-emption game. If Alice waits, Bob can commit at $t=0$, secure the $200k$ bonus, and lock in a blind decision. Alice, seeing this, yields (follows) to avoid a collision, accepting $0$ bonus. Alice's payoff if she yields is $\$4M$ (half firm value) + $\$0$. If Alice commits, she gets $\$4M + \$200k$. Since $\$4.2M > \$4M$, committing is a dominant strategy for both. In continuous time, both race to submit at the first infinitesimal opportunity $\epsilon \to 0$. The unique equilibrium is both playing "Commit at $t=0$." Technologically, one timestamp wins (say, Alice); Bob sees her commitment instantly and yields. Bob's action after losing is to **concurrence-sign** the same vendor Alice picked, binding himself to the blind decision to avoid contractual breach, securing his $\$4M$ equity share but forfeiting the bonus.
  *   **Verdict 1:** Both race to $t=0$. Loser follows.
  *   **Verdict 2:** Expected Payoff (Race) = $\$4M + 0.5(\$200k) = \$4.1M$. Payoff (Wait) = $\$5M$. Both are strictly worse off racing ($\$4.1M < \$5M$).
  *   **Verdict 3:** If Alice quietly loses the ability to commit, Bob (who retains it) will commit at $t=0$. Alice must yield. Her payoff drops to $\$4M$. Since $\$4.1M > \$4M$, losing the ability to commit is strictly worse for her than racing.
  *   **Stake Constraint:** Private stake ($\$200k$) < Individual Share of Loss ($\$1M$). The math holds: the bonus is too small to justify the firm loss, but large enough to justify the individual risk.

  **Case 2: Long Latency ($T > t_{info}$)**
  Now set $T = 2$ days (audit arrives $t=1$). Alice submits at $t=0$. Her commitment is irrevocable but hidden from Bob until $t=2$. Bob does not know Alice has committed. At $t=1$, the audit arrives. Bob now knows the optimal vendor. However, if Bob submits at $t=1$, his timestamp is $1$. Alice's is $0$. When the vault opens at $t=2$, Alice wins the bonus. Bob gets nothing. Knowing this ex-ante, Bob cannot afford to wait for the audit; he must submit at $t=0$ to have a chance at the timestamp.
  **Result:** The race does **not** defuse. Both submit at $t=0$, both lock in blind. At $t=2$, the vault reveals both submissions. Alice wins the bonus (timestamp 0 < 1). Both suffer the blind loss. The latency hid the rivalry, but it did not prevent the haste.

  ### Diagnosis: The Feature Doing the Work

  The race persists because **irrevocability precedes visibility**. The latency $T$ decouples *knowledge* of the commitment from the *fact* of the commitment, but it does not decouple the *decision quality* from the *submission time*. The harm here is purely "harm from haste" (blind decision); the "harm from rivalry" (bonus waste) is secondary. The latency fails to separate them because the penalty for being second (losing the bonus) applies even if the second mover is informed. The single feature driving the failure is the **Timestamp Priority Rule** combined with **Immediate Irrevocability**.

  If you remove **Immediate Irrevocability**, the case bites.
  **Minimal Change:** Make submissions **revocable until $T$**.
  Alice submits at $t=0$ (placeholder). Bob submits at $t=0$ (placeholder). Audit arrives $t=1$. Both see the optimal vendor. Both update their submissions to the optimal vendor before $T$. At $t=2$, submissions finalize. Timestamps still determine the bonus (Alice wins), but the firm value is preserved ($V_{wait}$). The race for the bonus remains (rivalry), but the premature foreclosure vanishes (haste cured). The latency now successfully trades information for authority.

  ### The Attack: "Commitment is an Asset"

  A proponent of commitment technology would argue the scenario is rigged by **exogenously fixing the decision deadline**. They would say: *"You've constructed a penalty for using the tool by asserting the contract must be signed at $t=0$. In reality, the 'Latency-Locked' vault allows Alice to signal intent at $t=0$ without binding the firm until $T$. If the counterparty (Bob) is rational, he recognizes that Alice's $t=0$ submission is a 'cheap talk' signal if it's revocable, or a 'threat' if it's not. If it's a threat, Bob should call the bluff by waiting for the audit, knowing Alice's blind commitment destroys value she also shares. Since Alice is rational, she won't shoot herself in the foot. Therefore, the equilibrium isn't a race; it's a negotiation where the commitment device forces the pair to wait, splitting the bonus ex-ante. You assumed they can't bargain over the $200k, but mechanism design assumes transferable utility. If they can side-pay, they wait, split the $10M, and Alice pays Bob $100k for the credit. The race only exists because you forbade the very Coasean bargaining the technology is meant to facilitate."*
