answer: |-
  This is a sharp brief. You're asking for a theoretical tool that functions as a practical weapon, grounded in the *labour process* rather than *ethical principles*. The distinction is vital: ethics asks "is this nice?"; a Marxian labour process analysis asks "who controls the motion, and where does the value go?"

  Below is the **Labour Process Assessment Protocol (LPAP)**. It is designed to be run in half a day with limited vendor cooperation. Following that, I have run the three cases, and finally, I have offered the critique you asked for on the procedure and your two concepts.

  ---

  ### The Labour Process Assessment Protocol (LPAP)

  **Purpose:** To determine bargaining leverage regarding new technology.
  **Audience:** Lay reps (needs plain English output).
  **Theoretical Base:** *Capital* Vol 1 (Ch. 15), *Grundrisse* (Fragment on Machines), Subsumption.
  **Rule of Evidence:** If the employer/vendor refuses to disclose technical specifics regarding data flow or logic, assume the *maximum capitalist rationalisation* consistent with the technology's known capabilities. (Precautionary Principle).

  #### Step 1: The Subsumption Test (Formal vs. Real)
  **Question:** Does this technology simply speed up the existing way of working (Formal), or does it reorganize the sequence, timing, and logic of the work itself (Real)?
  *   **Indicator of Formal:** Tool is passive; worker decides when/how to use it. Output is the same, just faster.
  *   **Indicator of Real:** Workflow is dictated by the software/hardware. Breaks, sequences, or methods are enforced by the system.
  *   **Pass:** Formal Subsumption. (Monitor for intensification).
  *   **Fail:** Real Subsumption. (Proceed to Step 2).
  *   **Stop Condition:** If Real Subsumption is identified *and* the system logic is proprietary/undisclosed, flag as **High Risk: Management Prerogative**.

  #### Step 2: The Agency Inversion (Tool vs. Machine)
  **Question:** Who sets the pace and the method? Does the worker use the tool, or does the machine use the worker?
  *   **Marxian Check:** In manufacture, the worker uses the tool. In modern industry, the machine incorporates the worker as a living appendage.
  *   **Evidence:** Automated pacing (conveyor speeds, software timeouts), algorithmic dispatch (worker cannot choose next task), or system-enforced "best practice."
  *   **Pass:** Worker retains control over pacing and method.
  *   **Fail:** System dictates pace or method.
  *   **Bargaining Hook:** "This turns skilled labour into machine-minding. We need control over the algorithm's parameters."

  #### Step 3: The Discretionary Residue Audit (Codification Risk)
  **Question:** What judgment is left to the worker, and is that judgment being recorded as training data?
  *   **Concept:** Distinguish between *Tacit Residue* (gut feeling, context, unrecorded nuance) and *Codifiable Residue* (decisions logged, clicked, or signed off).
  *   **The Trap:** If the worker's remaining judgment is used to train the next version of the system, the "Residue" is temporary.
  *   **Pass:** Judgment is tacit, unlogged, or legally protected (e.g., clinical safety sign-off that cannot be overridden).
  *   **Fail:** Judgment is logged, scored, or used to update the model (Human-in-the-Loop as data labour).
  *   **Stop Condition:** If Codifiable Residue is being harvested without compensation or ownership rights, flag as **High Risk: Asset Transfer**. (Workers are building their own replacement).

  #### Step 4: The Replaceability Gradient (Reserve Army)
  **Question:** Does this technology widen or narrow the pool of people capable of doing this job?
  *   **Concept:** Not headcount, but *skill threshold*.
  *   **Widening (Deskilling):** The tech embeds the knowledge; the worker needs less training. The Reserve Army expands. Wage pressure downwards.
  *   **Narrowing (Upskilling):** The tech requires new, scarce technical knowledge to operate. The Reserve Army contracts. Wage pressure upwards.
  *   **Pass:** Skill threshold remains stable or increases (scarce skills).
  *   **Fail:** Skill threshold drops (knowledge moved from head to machine).
  *   **Bargaining Hook:** "This lowers the barrier to entry. We need pay protection for the incumbent knowledge being embedded in the kit."

  #### Step 5: Relative Surplus Value Check (Intensity)
  **Question:** Is the primary function to reduce necessary labour time per unit?
  *   **Concept:** Even if headcount stays the same, is the intensity increasing? Is "dead time" (walking, thinking, waiting) being eliminated?
  *   **Pass:** Technology removes bureaucratic burden without increasing core work intensity.
  *   **Fail:** Technology eliminates "breathing space" or monitors idle time to drive continuous activity.
  *   **Hand-off:** If the answer is ambiguous, this goes to the reps. It is a question of *tolerance*, not fact. "Are members willing to work at this intensity for the current pay?"

  ---

  ### Case Runs

  Here is the LPAP applied to your three scenarios.

  #### Case 1: Warehouse Scanner + Pick-Rate Monitor + League Table
  *   **Step 1 (Subsumption):** **Real.** The workflow is dictated by the scanner's routing. The worker does not choose the path; the algorithm does.
  *   **Step 2 (Agency):** **Fail.** Machine uses worker. The "league table" enforces the pace socially, but the scanner enforces it technically.
  *   **Step 3 (Residue):** **Fail (Codified).** Any deviation (broken stock, unreachable item) must be logged. These logs optimize the routing algorithm. The worker teaches the system how to bypass them.
  *   **Step 4 (Replaceability):** **Fail (Widened).** Knowledge of the warehouse layout is transferred to the scanner. New hires are productive immediately. Reserve army expands.
  *   **Step 5 (Intensity):** **Fail.** "Dead time" (walking, thinking) is minimized.
  *   **Verdict:** **Red Light.** This is classic real subsumption. The "league table" is a disciplinary overlay on a machine-paced process.
  *   **Rep Language:** "This system takes the knowledge of the warehouse out of our members' heads and puts it in the scanner. Then it uses that to set faster targets. It makes the job easier to learn, which undermines our pay rates, and it turns the staff into appendages of the device. We need a cap on pick rates and ownership of the data generated by deviations."

  #### Case 2: AI Clinical Coding Tool ("Augmentation")
  *   **Step 1 (Subsumption):** **Real.** The AI suggests the code; the human validates. The *logic* of coding is shifting from human derivation to machine verification.
  *   **Step 2 (Agency):** **Fail.** The "default" is the AI's suggestion. Cognitive friction makes it harder to reject the AI than to accept it (automation bias). The machine sets the baseline; the worker cleans up.
  *   **Step 3 (Residue):** **Critical Fail.** The human sign-off is **Codifiable Residue**. Every time a coder corrects the AI, that correction is fed back into the model. The "judgment" the employer claims is "augmented" is actually being harvested to remove the need for the coder. This is *unpaid R&D*.
  *   **Step 4 (Replaceability):** **Fail (Widened).** The skill of "clinical coding" is being embedded in the software. Eventually, the role shifts from "Coder" to "Validator." The training time for a Validator is weeks, not years. Reserve army expands massively.
  *   **Step 5 (Intensity):** **Fail.** While paperwork may drop, the cognitive load shifts to monitoring the machine for errors, often at a higher volume.
  *   **Verdict:** **Red Light (Hidden).** This is the most dangerous case because it looks like a benefit. It is the *General Intellect* being alienated in real-time.
  *   **Rep Language:** "You call this augmentation, but it's actually asset transfer. Every time our members correct this tool, they are training it to do their job. We are effectively working for free to build our own replacement. Until we own the model or get a share of the efficiency savings, this is a wage cut in slow motion. We cannot sign off on a system that learns from our labour without compensating us for that training data."

  #### Case 3: Railway Predictive Maintenance (Engineers like it)
  *   **Step 1 (Subsumption):** **Mixed/Formal.** It aids the existing process rather than dictating a new one (initially).
  *   **Step 2 (Agency):** **Pass (Initially).** Engineers use the tool to kill paperwork.
  *   **Step 3 (Residue):** **Fail (Latent).** The diagnostic judgment is being logged. Today it helps the engineer; tomorrow it benchmarks them. If the system predicts a fault and the engineer overrides it, that override is a data point.
  *   **Step 4 (Replaceability):** **Neutral/Warning.** Currently requires high skill to interpret. Risk: Future versions simplify interpretation, lowering the skill bar for junior engineers.
  *   **Step 5 (Intensity):** **Pass.** Removes bureaucratic burden (dead labour).
  *   **Verdict:** **Amber Light.** The immediate effect is positive (removing alienating paperwork), but the *data capture* creates a future threat.
  *   **Rep Language:** "We welcome tools that remove paperwork. But we need a guarantee that diagnostic data is for maintenance of the train, not maintenance of discipline on the engineer. We need a 'Data Firewalls' clause: diagnostic logs cannot be used for performance management or to train automated replacement systems without renegotiation."

  ---

  ### Critique: Where the Procedure Misfires

  You asked for straight talk on the limitations. Here is where the LPAP breaks down.

  **1. Public Sector / Non-Profit**
  *   **The Misfire:** Marx's machinery analysis assumes the drive for *relative surplus value* (profit). In the public sector, the drive is *cost reduction* and *throughput* under budget constraints. The outcome (intensification, deskilling) is often identical, but the *logic* is different.
  *   **Adjustment:** In Step 5, swap "Surplus Value" for "Budgetary Efficiency." The mechanism is the same: doing more with less labour time. The procedure holds, but the rhetoric must change from "profit" to "resource allocation."

  **2. Co-ops / Worker-Owned**
  *   **The Misfire:** The "Agency Inversion" (Step 2) is less critical if the workers own the machine. However, if the co-op operates in a capitalist market, they are still forced to compete on efficiency, leading to self-exploitation.
  *   **Adjustment:** The procedure identifies the *technical* risk, but the *political* risk is muted. The "Stop" conditions become "Negotiate" conditions.

  **3. Vaporware (Press Release Tech)**
  *   **The Misfire:** The procedure assumes the tech works as advertised. Often, "AI" is a simple script wrapped in marketing.
  *   **Adjustment:** Apply the "Rule of Evidence" strictly. If they can't demonstrate the logic, treat it as a *management surveillance tool* regardless of its technical function. The *intent* is control, even if the *code* is broken.

  **4. Mixed Effects (One Grade Up, One Down)**
  *   **The Misfire:** The procedure assesses the *technology*, not the *stratification*. A tool might deskill the juniors (widening reserve army) while upskilling the seniors (narrowing it). This fractures bargaining units.
  *   **Adjustment:** Run the procedure separately for each job classification. If the outcome diverges, the bargaining position must be "Common Standard": either the upskilling is shared (training for all) or the deskilling is compensated (rate for the job, not the person).

  ### Critique: Your Two Concepts

  You asked if your concepts survive contact with the checklist.

  **1. Discretionary Residue**
  *   **Verdict:** **Survives, but needs sharpening.**
  *   **Why:** It is the operational definition of the *Grundrisse's* "General Intellect." It captures the specific mechanism of alienation in AI: not just taking the work, but taking the *learning* from the work.
  *   **Refinement:** In the checklist, ensure you distinguish between *Logging for Safety* (necessary) and *Logging for Optimization* (extractive). The former is defensible; the latter is the "Asset Transfer" identified in Case 2. If you don't make that distinction, reps will look unreasonable opposing safety logs.

  **2. Replaceability Gradient**
  *   **Verdict:** **Wobbly.**
  *   **Why:** "Gradient" implies a slope; Marx's concept is the *Industrial Reserve Army*. It's binary in effect: can capital find a cheaper worker easily or not?
  *   **Refinement:** Rename to **"Skill Compression."** It's more actionable for reps. "Does this compress the training time required?" is a question an employer can answer (or lie about), whereas "gradient" is abstract. If training time drops from 2 years to 2 weeks, the gradient has collapsed. Use "Reserve Army Expansion" in your PhD, but "Skill Compression" in the union.

  ### Final Word

  The LPAP works because it ignores the *vendor's promise* and looks at the *labour process reality*. Case 2 is the one that will hurt your team. They have welcomed "augmentation." You need to show them that "augmentation" in a capitalist firm is often just "incubation" for automation. The worker is the incubator.

  If you can convince the reps that **signing off on the AI is unpaid training work**, you have a bargaining chip. If you frame it as "ethics," you lose. If you frame it as "we are building the scab that replaces us," you might win.
