prompt: |-
  Hi — hoping you can help with something for the job I do alongside the PhD (I'm in STS, writing up on workplace AI and the labour process). Two days a week I'm with the new-technology team at a federation of trade unions. When an employer brings in some new bit of kit — warehouse pick-rate monitoring, an "AI assistant" for clinical coders, shift-scheduling software, automated marking, predictive-maintenance diagnostics — I write a one-page assessment that our reps then use in bargaining. I get about half a day per tech, I almost never get anything useful out of the vendor, and the people reading it are lay reps who will glaze over the second it turns theoretical. We do maybe fifteen a year, and the output has to be signed off by a committee before it goes anywhere near an employer.

  What I want is a procedure, not another ethics checklist. And I want it actually grounded in Marx's account of machinery rather than a generic "is it fair, transparent and accountable" grid. The bits I keep coming back to: the difference between formal and real subsumption (capital taking over a labour process more or less as it finds it, versus capital revolutionising the labour process itself); the machinery chapter in Capital vol 1, including that bit where the worker in manufacture uses the tool while in the factory the machine uses the worker; the stuff in the Grundrisse fragment on machines about social knowledge and the general intellect becoming a direct productive force; relative surplus value (that machinery is a way of cheapening labour-power, not just a way of sacking people); and the reserve army — how far the technology widens or narrows the pool of people who could be hired to do the job. I don't want it to collapse into the deskilling thesis either — my supervisor thinks the Braverman version of that is too crude and I half agree.

  Two things I've been messing about with in my own chapters that I'd like built in, if they survive contact with what Marx actually says:

  - discretionary residue: after the kit goes in, how much judgement is still left with the worker — and, the bit that matters, whether that residue is codifiable, i.e. whether the calls workers make are being logged in a form that the next version of the system can learn from and eventually take over. Contrast with residue that's genuinely tacit and walks out the door when the worker does.
  - replaceability gradient: how much the technology widens or narrows the set of people who could do the work, and how fast that happens.

  So: give me a decision procedure I can actually run. Questions in a fixed order; what counts as a good enough answer to each when the vendor stonewalls or I can't get a number; where the procedure just stops with a no; and where it has to hand the decision to the reps because it's a question about what workers want rather than a question of fact. It must not reduce to a predicted headcount of jobs lost — half the time the headcount barely moves and the job is still wrecked, and I need it to say why in language a rep can use in a meeting.

  Then run it on three cases: (1) a handheld scanner plus pick-rate monitor with a public league table in a distribution centre; (2) an AI clinical coding tool where a human coder signs off every code, which the employer is calling "augmentation" and which our reps have already publicly welcomed; (3) predictive-maintenance diagnostics on the railway, where the engineers genuinely like the tool because it kills the paperwork, but which logs every diagnostic judgement the engineer makes. I especially want to see it bite on (2), because I suspect the answer it gives is one we won't like and have already gone out on a limb against.

  Finally, be straight with me about where it misfires: public-sector employers with no profit motive, co-ops and worker-owned outfits, kit that's announced with a big press release and then quietly never switched on, and the case where one tool upskills one grade while disciplining another. And if either of my two concepts above doesn't survive being turned into a checklist, say so and say why.

  Cheers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** PhD candidate in Science and Technology Studies (STS), writing on workplace AI and labour process. Works part-time (2 days/week) for a trade union federation's new-technology team.
      *   **Task:** Create a *decision procedure* (not an ethics checklist) for assessing new workplace technologies.
      *   **Constraints/Requirements:**
          *   Grounded in Marx's account of machinery (Capital Vol 1, Grundrisse), specifically: formal vs. real subsumption, machine vs. worker agency, general intellect/social knowledge, relative surplus value, reserve army.
          *   Avoid generic "fairness/transparency" grids.
          *   Avoid crude Braverman-style deskilling thesis (nuanced view).
          *   Incorporate two user concepts: "Discretionary Residue" (codifiable vs. tacit) and "Replaceability Gradient" (pool of potential workers).
          *   Format: Fixed order questions, criteria for "good enough" answers (especially when vendors stonewall), stop conditions ("no"), hand-off conditions (to reps).
          *   Output must be usable by lay reps in bargaining (no jargon, actionable language).
          *   Must *not* reduce to headcount job losses (focus on labour process degradation).
          *   Run the procedure on three specific cases (Warehouse scanner, AI Clinical Coding, Railway Predictive Maintenance).
          *   Critique the procedure (where it misfires: public sector, co-ops, vaporware, mixed effects).
          *   Critique the user's two concepts (do they survive operationalization?).
      *   **Tone:** Professional, theoretically rigorous but practically grounded, direct ("be straight with me").

  2.  **Deconstruct the Theoretical Framework (Marxian Lens):**

      *   *Capital Vol 1, Chapter 15 (Machinery and Modern Industry):* Marx distinguishes between the tool (worker uses it) and the machine (machine uses the worker). The key is the *transmission of motion* and the *objective organization* of labor.
      *   *Formal vs. Real Subsumption:* Formal = capital controls the process but tech is similar to craft. Real = capital revolutionizes the tech to extract relative surplus value.
      *   *Relative Surplus Value:* It's not just firing people (absolute); it's intensifying work or cheapening the reproduction of labor power.
      *   *General Intellect (Grundrisse):* Social knowledge becomes a direct productive force, alienated from the worker and embodied in the machine.
      *   *Reserve Army:* Does the tech make the skill set rarer or more common?

  3.  **Develop the Decision Procedure (The "Protocol"):**

      *   *Goal:* A flowchart-like text that leads to a bargaining position.
      *   *Structure:*
          1.  Subsumption Check (Formal vs. Real).
          2.  Agency Inversion (Who drives whom?).
          3.  Discretionary Residue (Codification risk).
          4.  Replaceability Gradient (Labor pool impact).
          5.  Relative Surplus Value (Intensity/Control).
      *   *Handling Missing Data:* If the vendor/employer won't say, assume the worst-case scenario consistent with capitalist logic (precautionary principle).
      *   *Hand-off:* When the issue is purely about preference/acceptance rather than structural power.

  4.  **Integrate User Concepts:**

      *   *Discretionary Residue:* Needs to distinguish between "judgment left" and "judgment logged for future automation."
      *   *Replaceability Gradient:* Needs to focus on *skill compression* or *expansion*, not just headcount.

  5.  **Drafting the Procedure (Iterative refinement):**

      *   *Step 1: Subsumption.* Is this just a faster typewriter (Formal) or does it reorganize the workflow (Real)? *Stop condition:* If Real Subsumption without worker control, flag for bargaining.
      *   *Step 2: Agency.* Does the worker set the pace/logic, or does the system? (Marx's "machine uses the worker").
      *   *Step 3: Residue.* Is the remaining judgment tacit or data-fodder? (The "Data Trap").
      *   *Step 4: Replaceability.* Does this make the skill common (lowering wage power) or rare?
      *   *Step 5: Intensity.* Is the goal to do the same with less time (Relative Surplus Value)?

  6.  **Running the Cases:**

      *   *Case 1 (Warehouse Scanner):* Classic Real Subsumption. Machine sets pace. Residue is minimal/monitored. Replaceability high (deskilled). *Verdict:* Fight it.
      *   *Case 2 (AI Clinical Coding):* This is the tricky one. "Augmentation" claim. Human signs off. *Marxian analysis:* The AI learns from the sign-off (Residue Codification). The skill becomes embedded in the machine (General Intellect alienated). Eventually, the human becomes a rubber stamp. Replaceability increases (lower skill threshold). *Verdict:* Dangerous despite "augmentation" label.
      *   *Case 3 (Railway Predictive Maintenance):* Engineers like it (removes paperwork). But logs judgments. *Analysis:* Removes "bad" work (paperwork) but captures "good" work (diagnostics). Risk of future displacement. *Verdict:* Bargain for data ownership/limits.

  7.  **Critiquing the Procedure & Concepts:**

      *   *Misfires:* Public sector (profit motive less direct, but efficiency/cost-cutting still applies). Co-ops (different ownership changes the dynamic). Vaporware (assess intent/capability, not just function). Mixed effects (one group up, one down -> Class solidarity issue).
      *   *User Concepts:*
          *   *Discretionary Residue:* Survives well. It's the core of the "learning" mechanism.
          *   *Replaceability Gradient:* A bit clunky as a checklist item. Better framed as "Skill Compression." I need to be honest about this.

  8.  **Refining the Tone:**

      *   Avoid academic waffle.
      *   Speak to the rep's need for leverage.
      *   Acknowledge the tension between the PhD theory and the union pragmatism.

  9.  **Final Review against Constraints:**

      *   Did I use Marx? Yes (Subsumption, Machinery, Relative Surplus Value).
      *   Did I avoid ethics checklists? Yes (focused on power/process).
      *   Did I run the 3 cases? Yes.
      *   Did I critique the concepts? Yes.
      *   Is it actionable? Yes.

  10. **Self-Correction during drafting:** I initially thought about making it a flowchart. Text-based step-by-step is better for a "one-page assessment" context. I need to make sure I don't sound *too* deterministic; unions need room to maneuver. I must ensure the "Clinical Coding" case hits hard because the user specifically asked for it to "bite." The key there is the *feedback loop* of the human sign-off training the replacement.

  11. **Final Polish:** Check the "Discretionary Residue" critique. Is it robust? Yes, because if it's tacit, capital can't capture it. If it's codified, capital *will* capture it. That holds up. "Replaceability Gradient" is basically the Reserve Army concept operationalized. I should tell the user that "Gradient" is a bit vague, "Reserve Army Expansion" is the Marxian term, but "Replaceability" works for reps. I'll advise on the terminology.

