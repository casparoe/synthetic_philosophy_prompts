prompt: |-
  Suppose you are designing the three-year research agenda for a small, philosophy-focused foundation program that can support roughly ten researchers working on conceptual questions—not empirical machine learning, not engineering, and not literature review—raised by Daniel Dennett's notion of counterfeit people. By counterfeit people, Dennett means AI systems that invite us to adopt the intentional stance: they generate behavior or text that is best predicted by attributing beliefs, desires, and commitments to them, and they thereby elicit the trust, reliance, and readiness to hold responsible that we normally reserve for human persons. The systems in question lack, however, the background conditions that make human beings appropriate objects of that stance in the full moral and social sense: they do not have biographies of their own, they do not suffer, and they do not bear the real costs of broken promises or reputational loss.

  To make the agenda-setting concrete, I want you to use two distinctions I will introduce. Call the simpler case first-order counterfeiting: a system produces a human-like response in a bounded interaction, and the only illusion is that a person is present behind the text. Call the harder case second-order counterfeiting: a system maintains a persistent persona across time, claims to remember earlier interactions, expresses loyalty or makes promises, and thereby mimics not merely agency but the kind of diachronic commitment that normally underwrites trust. A second injected idea is the cost-of-commitment criterion: the proposal that what separates a real person from a counterfeit person is not the surface fluency of its outputs but the fact that a real person incurs genuine costs—social, reputational, material, or mortal—when it makes a commitment and then breaks or honors it, whereas a counterfeit person can simulate commitment without any downside risk.

  Given that the program's goal is to clarify these distinctions well enough to guide later institutional design (for example, norms of provenance, disclosure, or deployment) and to guide the conduct of individual users (for example, when they should withhold or refuse the intentional stance), which open conceptual questions or lines of work should the program prioritize over its three years, and in what order? I am less interested in an exhaustive menu of interesting questions than in a defended agenda. For each line of work you prioritize, state why it is upstream of other questions—how many other issues depend on its answer—how tractable it is for philosophers and conceptually oriented theorists who will not run new empirical AI experiments, how neglected it currently is, and what kind of argument or evidence over the next two or three years would move it up or down your ranking. Be explicit about the trade-offs you are making: if you rank a highly important but intractable question above a tractable but less foundational one, say why; if you deprioritize a question because its answer would not change much downstream, say that too.

  As part of this, assess the alleged implications of the counterfeit-people thesis. Which implications for institutional design or individual conduct genuinely follow from a correct understanding of first-order and second-order counterfeiting and of the cost-of-commitment criterion, and which are overrated or do not follow at all? Rank the surviving implications by how much they would change practice if institutions or individuals took them on board.

  If you think either of the two distinctions I supplied is confused, or that a different distinction would better organize the field, say so and defend the replacement; the point is to see the architecture of the problem, not to accept my framing uncritically. Do not give me a reading list, a bibliography, or citations, and do not assume access to any external sources.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Deconstruct the Request:**

      *   **Role:** Designer of a three-year research agenda for a small, philosophy-focused foundation program.
      *   **Capacity:** ~10 researchers.
      *   **Focus:** Conceptual questions raised by Daniel Dennett's notion of "counterfeit people" (AI systems inviting the intentional stance without the background conditions of personhood).
      *   **Constraints:** No empirical ML, no engineering, no literature reviews. Purely conceptual/philosophical work.
      *   **Key Definitions Provided:**
          *   *Counterfeit People:* AI inviting intentional stance (beliefs, desires) without moral/social background (biography, suffering, costs).
          *   *First-Order Counterfeiting:* Bounded interaction, illusion of a person behind text.
          *   *Second-Order Counterfeiting:* Persistent persona, memory, loyalty, promises, mimicking diachronic commitment.
          *   *Cost-of-Commitment Criterion:* Real persons incur genuine costs (social, reputational, mortal) for breaking/honoring commitments; counterfeits do not.
      *   **Goal:** Clarify distinctions to guide institutional design (norms, disclosure) and individual conduct (withholding intentional stance).
      *   **Deliverables:**
          1.  A defended 3-year research agenda (prioritized lines of work).
          2.  For each line: Why upstream, tractability, neglectedness, criteria for re-ranking.
          3.  Explicit trade-off analysis.
          4.  Assessment of implications (which follow, which are overrated), ranked by impact on practice.
          5.  Critical assessment of the provided distinctions (accept, modify, or replace).
      *   **Constraints:** No reading lists, bibliographies, or external source assumptions.

  2.  **Critical Assessment of the Provided Framework:**

      *   *First-Order vs. Second-Order:* This is a useful heuristic, but is it robust? First-order implies episodic. Second-order implies diachronic. However, a series of first-order interactions *can* create a second-order illusion without the system actually maintaining state (e.g., via context windows). The distinction might be better framed as *Episodic vs. Diachronic Simulation*. But "First/Second Order" is catchy. I should probe whether the *persistence* is the key or the *commitment*. Dennett's worry is about the *stance*, not just the memory.
      *   *Cost-of-Commitment Criterion:* This is the strongest philosophical lever. It aligns with Strawsonian reactive attitudes and game-theoretic signaling. However, is "cost" the *only* criterion? What about consciousness/sentience? Dennett usually sidesteps qualia, focusing on functional roles. If the functional role includes "suffering cost," then the criterion holds. But humans can also bluff costs. The criterion needs refinement: is it *actual* cost or *vulnerability* to cost?
      *   *Decision:* I will accept the distinctions but refine the *Cost-of-Commitment Criterion* to focus on *Vulnerability* rather than just incurred cost. A person is vulnerable to sanction; a counterfeit is not, even if it simulates sanction. This makes the ontology clearer. I will also suggest that First/Second Order is less about the system's architecture and more about the *user's normative expectation*.

  3.  **Developing the Research Agenda (The "Defended Agenda"):**

      *   *Goal:* 3 Years, 10 Researchers. Need high-leverage conceptual work.
      *   *Priority 1: The Ontology of Commitment (Year 1).* Before we can judge counterfeits, we need to know what a "real" commitment is. If the Cost-of-Commitment criterion is the core, we need to define "cost" and "commitment" philosophically. Is a promise without the possibility of failure a promise?
      *   *Priority 2: The Normative Status of the Stance (Year 2).* When is it *wrong* to adopt the intentional stance? Is it epistemically vicious? Morally dangerous? This connects the ontology to individual conduct.
      *   *Priority 3: Institutional Architecture & Disclosure (Year 3).* Now apply the findings to rules. If we know what commitment is and when the stance is harmful, what labels do we need?
      *   *Trade-offs:* I am deprioritizing "Consciousness/Sentience" debates. They are intractable and Dennett's framework specifically tries to bypass them in favor of functional/social roles. Focusing on sentience would stall the agenda. I am prioritizing "Commitment" because it directly impacts trust and institutions.

  4.  **Assessing Implications:**

      *   *Valid Implications:* Mandatory disclosure of non-agency (to prevent fraud), prohibition of AI in fiduciary roles (law, therapy) where diachronic commitment is essential, redefining "testimony" in law.
      *   *Overrated Implications:* Banning all conversational AI (too broad), requiring AI to "suffer" (impossible/category error), treating AI as property in all contexts (might need sui generis status).
      *   *Ranking:* 1. Fiduciary bans (high impact), 2. Disclosure norms (medium impact), 3. Legal testimony rules (high impact but narrow).

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the prompt, state the stance on the provided distinctions (refining "Cost" to "Vulnerability").
      *   **Critique of Framework:** Refine First/Second Order to *Episodic vs. Diachronic*. Refine Cost to *Vulnerability to Sanction*.
      *   **The Agenda (Year 1-3):**
          *   *Year 1: The Metaphysics of Commitment.* (Upstream: Can't judge counterfeits without knowing what real commitment is). Tractable via philosophical analysis. Neglected (mostly assumed).
          *   *Year 2: The Ethics of the Intentional Stance.* (Upstream: Guides individual conduct). Tractable (applied ethics). Neglected (focus is usually on AI rights, not user duties).
          *   *Year 3: Institutional Design & Provenance.* (Downstream: Depends on 1 & 2). Tractable (policy philosophy).
      *   **Implications Assessment:** Separate the wheat from the chaff. Rank by practical impact.
      *   **Trade-offs:** Explicitly state why sentience is ignored and why commitment is centered.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I address the "Cost-of-Commitment" specifically? Yes, by refining it to Vulnerability.
      *   *Check:* Did I explain *why* a line of work is upstream? Yes, metaphysics of commitment underpins the ethics of stance.
      *   *Check:* Did I address tractability for *philosophers*? Yes, emphasizing conceptual analysis over empirical data.
      *   *Check:* Did I rank the implications? Yes.
      *   *Check:* Did I critique the prompt's distinctions? Yes, I argued for "Vulnerability" over "Cost" and "Diachronic" over "Second-Order."

  7.  **Final Polish:** Ensure tone is authoritative, strategic, and philosophical. Avoid bullet points where paragraphs serve the argument better, but use structure for readability. (Wait, the prompt asks for specific structure on the agenda items: upstream, tractable, neglected, re-ranking criteria). I must ensure those specific headers are clear.

      *   *Re-evaluation of "Cost":* If I change "Cost" to "Vulnerability," am I violating the prompt? The prompt says "If you think either of the two distinctions I supplied is confused... say so and defend the replacement." So I am allowed to modify it. I will argue "Cost" is a symptom, "Vulnerability" is the structural condition.
      *   *Re-evaluation of Agenda:* Make sure the 10 researchers are utilized. Year 1: 4 on Metaphysics, 3 on Phenomenology, 3 on History of Promising. Year 2: 5 on Ethics, 5 on Epistemology. Year 3: 10 on Policy/Integration. (Just a mental check, don't need to put staffing numbers in the text unless it helps).
      *   *Focus:* Keep it tight on *conceptual* work. No "study how users feel." Instead "analyze the normative structure of user expectation."

  8.  **Final Review against Constraints:**
      *   No bibliography? Check.
