answer: |-
  To understand why *karoshi* is not a malfunction but a fulfillment, we have to look at what happens when you strip the theology out of the work ethic but leave the engine running. The classic reading suggests that Protestantism sanctified labor but kept it bounded by Sabbath and divine purpose—you worked to glorify God, not to accumulate for accumulation's sake. There were theological brakes. But once secularization hits, the glorification of God collapses into the glorification of Value. The Sabbath doesn't disappear; it just loses its sacred immunity. Time becomes purely linear, purely quantitative. In this light, dying at the desk isn't a tragedy of excess; it is the ultimate sign of commitment to the only remaining secular sacrament: production.

  When we treat *karoshi* as a market failure, we are presupposing that the system intends to preserve the worker. But if labor is fully abstracted into capital, the worker is merely a vessel for value generation. A vessel that runs dry has simply completed its cycle. To call this a failure is to impose a humanist morality onto a mechanism that operates on thermodynamic extraction. The system works perfectly when it extracts every joule of energy before the biological hardware fails. That is teh logical endpoint of a worldview where time is money and money is the only metric of virtue.

  This is why the push for a 35-hour week is ontologically confused. It relies on this nostalgic idea of "temporal sovereignty"—the belief that I own my hours and can choose to withhold them. That might have made sense in an agrarian rhythm where work was task-oriented and bound by seasons or daylight. But in late capitalism, labor isn't something you do; it's what you are. You are human capital. When you aren't working, you aren't "free"; you are merely dormant capital undergoing maintenance. Leisure is just recharging the battery so extraction can resume. To demand less work is to misunderstand that your time was never yours to begin with. It belongs to the accumulation process.

  Now, the obvious moral objection screams immediately: *But people die.* Families are destroyed. Lives are cut short. Surely, a system that kills its participants is immoral and must be corrected to preserve life.

  This objection misses the point of the structural logic. The moral outrage assumes that biological life is the highest good. But within the framework of abstracted labor, biological life is only valuable insofar as it produces value. If regulating hours saves lives but reduces aggregate accumulation, the system registers this as a loss, not a gain. The moral argument fails because it tries to use humanist ethics to fix a machine built on post-humanist economics. You cannot save lives by tweaking the hours if the underlying premise is that time is a commodity to be spent until exhaustion. The only way to stop *karoshi* isn't to demand more leisure, which just reinforces the idea that leisure is a regulated allowance granted by capital. It requires dismantling the idea that time itself is property. Until then, overwork remains teh feature, not the bug, because the machine is designed to burn fuel, not preserve it.
