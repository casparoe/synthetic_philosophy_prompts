  The taxonomy struggles here because this behaves like a **bribe**—a transactional exchange of goods for status—which isn't purely signalling (information) nor costume (fake). It's an investment. The closest analog is the **anonymous gear donor**, but the analogy breaks on the request for promotion. To test her rules, ask her what happens if the crew **rejects the gear** but he still asks for lead: does the sunk cost still signal commitment if the benefit is denied?

