      *   *Claim 6:* "Epistimic structural realism is just the weaker view that we stay agnostic about intrinsic properties, but both versions reject scientific realism's commitment to objects."
          *   *Assessment:* Half-right. ESR stays agnostic. OSR rejects objects. But ESR *does not* necessarily reject commitment to objects; it rejects commitment to their *intrinsic nature*. Standard Scientific Realism commits to objects *and* their approximate truth. ESR commits to the structure *and* usually assumes *something* fills the nodes, just that we don't know what. So saying *both* reject commitment to objects is wrong regarding ESR.

  3.  **Address Specific User Queries:**

