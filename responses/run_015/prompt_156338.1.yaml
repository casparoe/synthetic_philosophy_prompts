          *   Worrall's claim about formalism surviving "intact" vs. "structural continuity."
          *   Poincaré's historical reception (ignored vs. not picked up).
          *   Quantum Mechanics (QM) claim: Does entanglement/OSR follow from Worrall, or is it a separate move?
