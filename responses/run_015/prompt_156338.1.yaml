      *   *Refining the ESR/OSR Point:* This is the biggest error. Worrall = ESR (mostly). OSR = French/Ladyman. ESR says "Structure is real, nodes exist but nature unknown." OSR says "Structure is real, nodes are eliminated/reduced to structure." The roommate says *both* reject objects. That's false for ESR.
