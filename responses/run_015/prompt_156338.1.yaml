      *   *Claim 2:* "Worrall's classic argument showed that in theory change the mathematical formalism survives intact, not just approximately..."
          *   *Assessment:* Problematic. "Intact" is too strong. Worrall (1989) argued for *structural continuity* (e.g., Fresnel's equations surviving into Maxwell's), not that the *entire* formalism survives unchanged or that it survives "intact" in a literal sense. It's about the mathematical *structure* being retained, often reinterpreted.
      *   *Claim 3:* "...which means objects like electrons are just theoretical placeholders with no independent existence."
          *   *Assessment:* This conflates Epistemic SR (ESR) and Ontic SR (OSR). Worrall is usually associated with ESR. ESR says we *don't know* the nature of electrons, not necessarily that they *don't exist*. OSR says the structure is all there is. The summary slides from ESR reasoning to OSR conclusion.
      *   *Claim 4:* "Poincaré had this insight around 1900 but people ignored it because they wanted materialist ontologies."
          *   *Assessment:* Simplification. Poincaré wasn't exactly "ignored," but his conventionalism/structuralism was overshadowed by the realist/anti-realist debates of the logical positivists and later realists. "Materialist ontologies" is a bit of a caricature of the opposition.
      *   *Claim 5:* "Ontic structural realists push this further in quantum mechanics: entanglement relations are ontologically prior to the particles involved, so there literally aren't particles, only correlation structures."
