  5. A posthumous cast where notes exist but no lifetime example was ever produced would best tell the surviving rules apart. This would reveal whether documented intent alone suffices without physical proof of the artist's prior approval, exposing the inconsistency between your strict workshop and lenient contemporary verdicts.
