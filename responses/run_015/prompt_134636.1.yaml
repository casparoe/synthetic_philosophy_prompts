answer: |-
  This scenario presents a classic conflict between **Aesthetic Autonomy** (the idea that art exists in a separate realm from morality) and **Ethical Contextualism** (the idea that art is inextricably linked to its creator and context). The Arts Council's policy attempts to straddle these two philosophies, but the cracks in the logic reveal that their stated principle ("judging only the canvas") is not the operating system driving their decisions.

  Here is a reconstruction of their implicit theory, an assessment of its coherence, and the radical changes required to make it consistent.

  ### 1. The Implicit Theory: "Moral Half-Life" and Economic Complicity

  The Council's rules presuppose a theory of **Moral Contagion with a Decay Rate.** They do not actually believe art and biography are separate; they believe the *risk* of associating with the biography diminishes over time and depends on economic flow.

  *   **The Living vs. Dead Distinction (Economic Complicity):** By rejecting living fraudsters but accepting dead war criminals, the Council operates on a theory of **material support.** If the artist is alive, acquiring their work validates them financially and reputationally. The Council views itself as an accomplice to ongoing harm. If the artist is dead, no money flows to the criminal, and their reputation cannot be further built. The "sin" is not in the viewing, but in the *transaction*.
  *   **The 50-Year Sunset Clause (The Historical Alibi):** The specific 50-year window suggests a belief in a **Statute of Limitations on Outrage.** This presupposes that moral stain is not intrinsic to the object but is a social emotion that fades with generational turnover. After 50 years, the victims are gone, the perpetrator is mythologized, and the work transitions from "evidence of a person" to "historical artifact." The Council is betting that time sanitizes context.
  *   **The Protest Damage Exception (Contextual Surrender):** When they refuse to restore protest-damaged work, they implicitly admit that the **object is a political vessel.** By leaving the damage, they are acknowledging the protesters' message as valid or, at minimum, acknowledging that the *meaning* of the canvas has been altered by the public's reaction to the artist. They are treating the damage as part of the provenance, which means the biography *does* matter.

  ### 2. Is It Coherent or Bureaucratic Cover?

  **Verdict: It is incoherent philosophy functioning as coherent risk management.**

  The policy is philosophically contradictory. You cannot claim to judge "only the canvas" while using the artist's vital statistics (alive/dead), criminal record (fraud/war crimes), and time of death as the primary criteria for acquisition.

  *   **The Contradiction:** If the canvas were truly all that mattered, a living fraudster's masterpiece would be acquired (perhaps with proceeds donated to charity to solve the complicity issue), and a dead war criminal's scribble would be rejected on aesthetic grounds alone. Instead, they use biography as a gatekeeping mechanism while claiming they don't.
  *   **The Protest Paradox:** This is the smoking gun. If the Council truly believed in the separation of art and artist, damage to a painting would be treated like rot or water damage—a physical defect to be corrected to preserve the "pure" aesthetic object. By refusing to restore damage caused by *political protest*, they are admitting that the **social reception of the artist is part of the work's identity.** They are prioritizing the *narrative* of the protest over the *integrity* of the canvas.
  *   **The Bureaucratic Reality:** The rules are not designed to uphold an aesthetic theory; they are designed to minimize **institutional liability.**
      *   *Living Fraudsters:* Too much current media heat; donors might pull out.
      *   *Dead War Criminals:* Safe enough; history books already judge them; no one to sue or demand royalties.
      *   *50-Year Clause:* Creates a clear, defensible administrative line so staff don't have to make case-by-case moral judgments.
      *   *Protest Damage:* Restoring it might incite riots; leaving it is the path of least resistance.

  ### 3. What Would Change If They Truly Believed in Separation?

  If the Arts Council actually believed in **Radical Formalism** (the idea that the work is entirely independent of the creator), their rules would need to undergo a violent purification. To be consistent, they would have to remove all biographical gatekeeping and treat the object as an orphan.

  Here are the specific rule changes required for true coherence:

  1.  **Blind Acquisition Protocol:**
      *   **Change:** All submissions must be anonymized. Provenance regarding the creator's identity is sealed until *after* the acquisition decision is made based solely on aesthetic merit.
      *   **Why:** If you judge only the canvas, you shouldn't know who painted it until you've decided it's good.

  2.  **Decoupling Financial Benefit:**
      *   **Change:** Acquire work from living convicted criminals, but structure contracts so that **zero royalties or resale value** go to the artist or their estate. All proceeds go to victims' funds or the state.
      *   **Why:** The current rule bans living artists to avoid complicity. True formalism says the art is good regardless; the *payment* is the ethical variable, not the *display*.

  3.  **Abolish the Sunset Clause:**
      *   **Change:** Acquire work by war criminals immediately after conviction/death, or reject it immediately based on quality. Time should not be a factor.
      *   **Why:** If the art is autonomous, it is timeless. Waiting 50 years admits that the *viewer's* morality matters more than the *object's* autonomy.

  4.  **Mandatory Restoration of Protest Damage:**
      *   **Change:** Implement a policy of **Aggressive Conservation.** Any damage, regardless of motive (political protest, vandalism, accident), must be restored to the artist's original intent.
      *   **Why:** Leaving the damage validates the protesters' claim that the *artist's politics* are relevant to the *object's value.* To truly separate art and artist, you must erase the physical evidence of the public's moral judgment.

  ### Conclusion

  The Council's current stance is a **compromise position.** They want the cultural capital of displaying "forbidden" historical art (the war criminals) without the reputational risk of supporting living controversial figures (the fraudsters).

  To truly separate art from the artist is to treat the artwork as a found object, like a stone or a leaf. As long as the Council cares about *who* made it, *when* they died, and *why* it was damaged, they are admitting that art is a human communication, not an isolated aesthetic event. Their rules aren't a philosophy of art; they are a **liability shield** dressed up in curatorial language.
