  10. **Review against constraints:** The user asked to "Reconstruct the implicit theory, say if it's coherent or just bureaucratic cover, and tell me what'd have to change in their rules if they really believed art and artist can be separated cleanly." I must hit all three points.

      *   *Reconstruct:* Done (Moral Half-Life/Complicity).
