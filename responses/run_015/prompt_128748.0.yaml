  4. The definition must remain substrate-neutral regarding whether the processing unit is a single brain or a distributed network, excluding methodological individualism, though this is marked *negotiable* if the goal is strictly individual psychological assessment. This requirement must not collapse the distinction between having intelligence and having a lot of it.

