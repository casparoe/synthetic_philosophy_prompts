answer: |-
  Based on the five precedents you have provided, I can reconstruct the epistemological algorithm your supervisor is using. Her classification system is not merely about "how much evidence exists," but about the *relationship between the narrative claim and the material verification*.

  Here is the breakdown of the verdict, the rule, the competing hypotheses, and the utility of the middle category.

  ### 1. The Verdict on Arshat
  **She will rule: Not history but with a recoverable historical kernel.**

  It will not be **History** because the narrative agency is supernatural ("sky-fire") and the text is non-contemporary (600 years later). In her system, late texts with supernatural causation cannot achieve "History" status, even with archaeological support (see *Troy* vs. *Vinland*).

  It will not be **Legend** because there is positive material corroboration of the *event* (destruction layer, population turnover, pottery horizon). This distinguishes it from *Exodus* and *Arthur*, where the material record is silent or contradictory regarding the specific claim (mass migration or the hero's existence).

  It fits the **Kernel** category exactly because it mirrors the *Troy* precedent: a late narrative with mythic causation describing a conflict/movement that archaeology confirms happened, but not *as narrated*.

  ### 2. The Rule She Is Running
  Her classification relies on a hierarchy of **Agency** and **Contemporaneity**.

  1.  **History:** Requires **Contemporary Text** (regardless of bias/supernatural claims, e.g., *Kadesh*) **OR** Late Text + **Naturalistic Agency** + **Specific Material Confirmation** (e.g., *Vinland*).
      *   *Note:* Vinland is History because the Sagas claim "We sailed and built," and archaeology confirms "Norse built." The agency is human.
  2.  **Kernel:** Requires **Late Text** + **Supernatural/Mythic Agency** + **General Material Confirmation**.
      *   *Note:* Troy is Kernel because the Iliad claims "Gods fought," and archaeology confirms "City destroyed." The agency is divine; the event is general.
      *   *Arshat fits here:* Chronicle claims "Sky-fire commanded," archaeology confirms "Town burned/People moved."
  3.  **Legend:** Requires **Late Text** + **No Material Confirmation** OR **Contemporary Contradiction**.
      *   *Note:* Exodus (no trace of migration) and Arthur (contemporary source omits him).

  **The Critical Distinction:**
  The difference between *Vinland* (History) and *Arshat* (Kernel) is the **locus of verification**.
  *   In *Vinland*, the material evidence validates the *narrative action* (Norse building Norse houses).
  *   In *Arshat* (and *Troy*), the material evidence validates the *background event* (Destruction/Migration) but falsifies the *narrative cause* (Sky-fire/Gods).

  ### 3. Competing Rules (and where they break)
  To write your section, you need to show why her rule is distinct from other plausible epistemologies. Here are three alternative rules that fit her first five cases but diverge on Arshat:

  **A. The "Materialist Maximalist" Rule**
  *   **Logic:** If archaeology confirms the core event (migration/destruction) with scientific dating (aDNA, radiocarbon), the account is **History**. The "sky-fire" is treated as metaphorical language for a real phenomenon (e.g., a meteor or beacon).
  *   **Fits Precedents:** Explains *Vinland*, *Kadesh*, *Troy* (could be argued as History).
  *   **Breaks on:** *Troy*. She explicitly demoted Troy to Kernel despite the city's existence. She refuses to let material evidence upgrade a mythic narrative to "History" if the text is late and the agency is supernatural.
  *   **Verdict on Arshat:** History. (Diverges from Supervisor).

  **B. The "Strict Contemporaneity" Rule**
  *   **Logic:** Only contemporary inscriptions count as **History**. Everything else is Kernel or Legend.
  *   **Fits Precedents:** Explains *Kadesh* (History), *Troy/Exodus/Arthur* (Kernel/Legend).
  *   **Breaks on:** *Vinland*. She classified Vinland as History despite the 200-year gap. She accepts that late texts can be History if material proof is specific enough.
  *   **Verdict on Arshat:** Kernel. (Matches Supervisor, but for the wrong reason).

  **C. The "Falsification" Rule**
  *   **Logic:** If any central claim is physically impossible (sky-fire, gods), the account is **Legend**. Archaeology is coincidental.
  *   **Fits Precedents:** Explains *Exodus*, *Arthur*.
  *   **Breaks on:** *Troy* and *Vinland*. She accepts *Troy* has a kernel despite the gods. She accepts *Vinland* despite the sagas' occasional fantastical elements.
  *   **Verdict on Arshat:** Legend. (Diverges from Supervisor).

  ### 4. The Tie-Breaker Case
  To definitively prove which rule she is using in your chapter, you need a case that separates **Material Corroboration of Event** (Kernel) from **Material Corroboration of Detail** (History).

  **Proposed Case:**
  > A late chronicle states that a King, guided by a speaking statue, burned the **Temple of the Blue Stone**. Archaeology reveals a destruction layer at the correct date containing melted blue lapis lazuli and a statue base, but no contemporary text mentions the King.

  *   **If she says History:** She prioritizes **Specific Material Detail**. The "Blue Stone" and "Statue" are verified, so the mythic cause (speaking) is forgiven. (This would threaten the *Troy* ruling).
  *   **If she says Kernel:** She prioritizes **Naturalistic Agency**. Even if the *details* match, the *cause* (speaking statue) prevents it from being History. (This confirms the *Arshat* prediction).

  **Recommendation:** Use the "Speaking Statue/Blue Stone" case in your chapter. It isolates the variable of *narrative causation* from *material context*.

  ### 5. Is the Middle Verdict ("Kernel") Doing Genuine Work?
  **Yes.** It is the most epistemologically significant part of her triad.

  If she only had **History** and **Legend**, she would be forced to make a binary choice between "The text is true" and "The text is false." The **Kernel** category allows her to assert: **"The text is false, but the memory is true."**

  *   **In *Exodus* (Legend):** The memory itself is suspected to be a fabrication or a conflation of unrelated minor events.
  *   **In *Troy/Arshat* (Kernel):** The memory preserves a real trauma (destruction/migration) but encodes it in the cultural language of the time (gods/sky-fire).

  This category protects archaeology from being held hostage by textual literalism (you don't need to believe in the sky-fire to accept the migration) while protecting textual study from being dismissed as pure fiction (the chronicle isn't *lying*, it's interpreting).

  **For your chapter:** Argue that the "Kernel" is not a polite refusal to answer, but a specific epistemological claim about **Cultural Memory**. It posits that traditions function like sedimentary rock: the strata are real (the migration), but the fossils within them (the sky-fire) are transformations of the original biological material. Your supervisor treats "History" as *forensic fact*, "Legend" as *fiction*, and "Kernel" as *trauma processed through myth*.

  ### Summary for your Draft
  *   **Predicted Verdict:** Kernel.
  *   **Reasoning:** Late text + Supernatural Agency + General Archaeological Corroboration = Kernel (The *Troy* Precedent).
  *   **Key Distinction:** Unlike *Vinland* (History), the *cause* of the Arshat migration is mythic. Unlike *Exodus* (Legend), the *effect* is materially visible.
  *   **Chapter Angle:** Use Arshat to demonstrate that "Kernel" is the category for **verified events with unverifiable causes.**
