      *   *Key Nietzschean Concept:* *Ressentiment*. It cannot act directly, only indirectly. If the "good" were truly independent, it wouldn't need the "evil" noble to sustain it. But slave morality *needs* the enemy to exist.
      *   *Active vs. Reactive:* This is the core. Noble morality says "Yes" to itself first, then "No" to the other (as an afterthought). Slave morality says "No" to the other first, and that "No" is its creative deed. The "Yes" to itself is just the shadow of that "No."
      *   *Good/Bad vs. Good/Evil:* This distinction follows from the Active/Reactive one. "Good/Bad" is the linguistic mark of self-affirmation. "Good/Evil" is the linguistic mark of reaction (the "evil" is the primary focus, the "good" is the reactive shelter).
