answer: |-
  **To:** Product Ethics Review Board
  **From:** Software Engineering
  **Subject:** Decision on Polygenic Risk Score Presentation
  **Date:** October 26, 2023

  **Recommendation**

  The Board recommends **Option 2: Ship the Condition Index Only.** We will not ship the Trait Index, and we will not implement the aggregated Health Index as the default sort mechanism.

  **Default Settings**

  1.  **Trait Index:** Excluded entirely. The system will not display polygenic scores for non-medical characteristics such as height or educational attainment.
  2.  **Health Index:** The aggregated Health Index will be available as an optional view but will **not** be the default sort. The default view will list embryos by ID, displaying individual condition risks side-by-side.
  3.  **Transparency:** If a clinician chooses to view the aggregated Health Index, the weighting methodology (severity, penetrance, life years) must be visible in the main view, not hidden in a tooltip.

  **Reasoning**

  This decision balances patient utility with ethical risk mitigation. The primary driver for shipping the Condition Index is the argument raised by our embryology team: clinics currently rank embryos using morphology and aneuploidy status regardless of whether we provide genetic risk data. Declining to ship this feature does not stop ranking; it merely forces patients and clinicians to rely on cruder proxies that correlate poorly with long-term health outcomes. Withholding better data does not protect patients; it leaves them making high-stakes decisions with inferior information. By shipping the Condition Index, we allow patients to prioritize medical health over arbitrary morphological grades.

  We are excluding the Trait Index because no customer has requested it, and selecting for non-medical traits introduces eugenic risks without corresponding health benefits. Furthermore, we are rejecting the aggregated Health Index as the *default* sort. While an aggregated score offers simplicity, it encodes a specific utilitarian calculus about which conditions are "worse" than others. By defaulting to individual condition views, we empower patients to decide which risks matter most to them rather than imposing our weighting schema as the primary decision framework.

  Regarding the non-identity problem raised by clinical staff: while philosophically sound, it does not offer practical guidance for parents selecting an embryo today. Parents are necessarily choosing between potential children. Our tool must support the decision they are actually making, not the metaphysical implications of that choice.

  **Strongest Counter-Argument**

  The strongest argument against this decision comes from our genetic counseling team. They argue that any ranking system, even one limited to medical conditions, implicitly encodes a verdict that some lives are not worth starting. By flagging certain conditions as risks to be avoided, we validate the notion that living with those conditions is a negative outcome. This expressive harm cannot be fully mitigated by interface design. There is merit to the claim that by building this tool, we are participating in a selection process that devalues existing people living with these conditions.

  We accept this risk as unavoidable if we are to provide genetic risk information at all. However, by refusing to aggregate these risks into a single "Health Score" by default, we avoid declaring a single "best" embryo. We provide data, not a verdict. This preserves clinician agency and acknowledges that a life with a higher genetic risk for one condition may still be the right choice for a specific family.

  **Next Steps**

  Engineering will update the specification to remove the Trait Index and change the default sort order to Embryo ID. The Health Index aggregation logic will remain in the codebase but will be behind a feature flag accessible only to clinicians who explicitly enable it. We will revisit the weighting transparency requirements during the next UI review.

  **Decision:** Approved for development under the constraints above.
