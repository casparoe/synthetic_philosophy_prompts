  # Project Meridian: A Facilitator's Guide to the Impossibility Exercise

  **To:** The Commissioning Editor / Seminar Facilitator
  **From:** Design Consultancy (Science & Ideas Desk)
  **Subject:** Embodied Protocol for Arrow's Impossibility Theorem
  **Date:** 24 October 2023
  **Setting:** Upper-level Undergraduate Seminar (Political Philosophy)
  **Duration:** 90 Minutes
  **Participants:** 16 Students

  ## 1. Overview and Objective

  This exercise is designed to bypass formal mathematical proof in favour of lived contradiction. Students will serve as disciplinary delegates on the fictional 'Meridian Committee'. Their task is to rank four research proposals (Aurora, Boreas, Cygnus, Draco) for a single grant.

  The core mechanism is a **Sequential Pairwise-Elimination Tournament** with a specific **Recall Clause**. By introducing a non-eligible 'shadow proposal' (Echo) in the second round, the group will experience a reversal in the social ranking of Aurora and Boreas, despite no individual changing their preference between those two options. This violation of the Independence of Irrelevant Alternatives (IIA) will emerge from the voting mechanics themselves.

  ## 2. Roles and Materials

  ### Roles (16 Students)
  *   **Disciplinary Delegates (12):** The voters. They hold private preference cards and cast votes.
  *   **Committee Officers (3):**
      *   *The Chair:* Manages the agenda and announces matchups.
      *   *The Scribe:* Records pairwise results and the final ranking on the board.
      *   *The Auditor:* Checks for cycles and manages the 'Recall Clause'.
  *   **The Facilitator (1):** You. You hold the master key of preferences and manage the token economy. Do not vote.

  ### Materials
  *   **Preference Cards:** 12 sealed envelopes (distributed according to the profile below).
  *   **Ballot Slips:** Small pieces of paper for casting pairwise votes.
  *   **Prestige Tokens:** 30 physical tokens (e.g., poker chips or distinct coins).
  *   **Whiteboard:** For tracking the tournament bracket and token scores.

  ## 3. The Preference Profile (The Mathematics of Contradiction)

  Distribute the following 12 cards randomly among the Delegates. There are three groups of four. The order on the card represents the delegate's true preference from highest (1) to lowest (5).

  **Group Alpha (4 Delegates)**
  1.  Aurora
  2.  Boreas
  3.  Cygnus
  4.  Draco
  5.  Echo

  **Group Beta (4 Delegates)**
  1.  Boreas
  2.  Cygnus
  3.  Draco
  4.  Echo
  5.  Aurora

  **Group Gamma (4 Delegates)**
  1.  Cygnus
  2.  Echo
  3.  Aurora
  4.  Boreas
  5.  Draco

  **Mathematical Properties:**
  *   **Aurora vs. Boreas:** Alpha (A) + Gamma (A) = 8 votes. Beta (B) = 4 votes. **Aurora wins.**
  *   **Aurora vs. Echo:** Alpha (A) = 4 votes. Beta (E) + Gamma (E) = 8 votes. **Echo wins.**
  *   **Boreas vs. Echo:** Alpha (B) + Beta (B) = 8 votes. Gamma (E) = 4 votes. **Boreas wins.**
  *   **Cygnus vs. Aurora:** Beta (C) + Gamma (C) = 8 votes. Alpha (A) = 4 votes. **Cygnus wins.**

  ## 4. The Meridian Protocol (Rules of Play)

  ### Voting Mechanism
  The Committee uses a sequential pairwise-elimination tournament.
  1.  Two proposals are pitted against each other.
  2.  Delegates vote secretly for their preferred option.
  3.  The loser is eliminated. The winner advances to face the next proposal on the agenda.
  4.  The final survivor is ranked 1st. The last eliminated is ranked 2nd, and so on.

  ### The Shadow Constraint
  **Echo** appears on all ballots in Round Two. However, Echo is **ineligible to win the grant**. If Echo wins a pairwise vote, Echo is immediately disqualified and eliminated.

  ### The Recall Clause
  *Rule:* If an ineligible proposal (Echo) defeats an eligible proposal, and the Auditor detects a voting cycle among the remaining eligible candidates (e.g., X beats Y, Y beats Z, Z beats X), the most recently eliminated eligible candidate is recalled to the pool to break the cycle.

  ### Token Payoff Structure
  To ensure sincere revelation of preferences, tokens are awarded as follows:
  *   **Participation:** 1 token for voting in every round.
  *   **Sincerity Bonus:** 2 tokens if the Auditor confirms (via spot-check) that your vote matched your private card.
  *   **Outcome Bonus:** 5 tokens if your **1st choice** wins the grant. 2 tokens if your **2nd choice** wins.
  *   **Penalty:** If a delegate is caught voting strategically (against their card) by the Auditor, they lose all accumulated tokens.

  *Note:* The Auditor randomly checks two delegates after Round One and two after Round Two. This risk incentivises honesty.

  ## 5. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:15: Induction and Role Assignment**
  *   Assign roles. Distribute preference cards in sealed envelopes.
  *   Explain the Token Payoff Structure. Emphasise that tokens represent 'academic prestige'.
  *   **Crucial:** Do not reveal the mathematical profile. Tell them only that their cards represent their discipline's genuine funding priorities.

  **00:15 – 00:35: Round One (The Baseline)**
  *   **Condition:** Echo is **absent**. Ballots list only A, B, C, D.
  *   **Agenda:**
      1.  Aurora vs. Boreas. (Result: Aurora wins 8–4).
      2.  Winner (Aurora) vs. Cygnus. (Result: Cygnus wins 8–4).
      3.  Winner (Cygnus) vs. Draco. (Result: Cygnus wins).
  *   **Final Ranking:** 1. Cygnus, 2. Aurora, 3. Boreas, 4. Draco.
  *   **Observation:** Aurora is ranked above Boreas.
  *   **Token Tally:** Distribute tokens for Round One.

  **00:35 – 00:55: Round Two (The Shadow)**
  *   **Condition:** Echo is **present**. Ballots list A, B, C, D, E.
  *   **Agenda:**
      1.  Aurora vs. Echo. (Result: Echo wins 8–4).
      2.  *Protocol Check:* Echo is ineligible. Echo is eliminated. **Aurora is also eliminated** (having lost the pairwise vote).
      3.  *Recall Clause Check:* The Auditor checks the remaining set (Boreas, Cygnus, Draco).
          *   Boreas vs. Cygnus (Hypothetical or voted): Boreas wins (8–4).
          *   Cygnus vs. Draco: Cygnus wins.
          *   Does a cycle exist? For the purpose of the exercise, the Facilitator instructs the Auditor to declare a 'procedural cycle' due to the disruption of the agenda by Echo. The Recall Clause is *available* but does not save Aurora, as the cycle is among the survivors.
      4.  Remaining Vote: Boreas vs. Cygnus. (Result: Boreas wins 8–4).
      5.  Winner (Boreas) vs. Draco. (Result: Boreas wins).
  *   **Final Ranking:** 1. Boreas, 2. Cygnus, 3. Draco, 4. Aurora.
  *   **Observation:** Boreas is now ranked above Aurora.
  *   **Token Tally:** Distribute tokens for Round Two. Note the shift in who receives the 'Outcome Bonus'.

  **00:55 – 01:05: The Reveal**
  *   Ask the Delegates to reveal their cards.
  *   Ask: "Did anyone change their vote between Aurora and Boreas?" (No).
  *   Ask: "Did the group ranking of Aurora and Boreas change?" (Yes).
  *   Collect tokens.

  **01:05 – 01:30: Debrief and Mapping**
  *   Facilitated discussion mapping the experience to Arrow's conditions (see below).

  ## 6. Debrief: Mapping Experience to Arrow's Conditions

  Use the whiteboard to map the lived contradiction to the four conditions of Arrow's Impossibility Theorem.

  1.  **Unrestricted Domain:**
      *   *Question:* Were delegates allowed to hold any preference order?
      *   *Experience:* Yes. The profile included cycles (Aurora > Boreas > Cygnus > Aurora). The system accepted these complex inputs without rejecting the voters.
      *   *Status:* **Satisfied.**

  2.  **Pareto Efficiency:**
      *   *Question:* If everyone preferred X to Y, did the group rank X above Y?
      *   *Experience:* Generally, yes. (e.g., Draco was universally low-ranked and finished low).
      *   *Status:* **Satisfied.**

  3.  **Non-Dictatorship:**
      *   *Question:* Did any single student determine the outcome regardless of others?
      *   *Experience:* No. Outcomes required majorities (8 vs 4). No single delegate's card matched the final social ordering perfectly.
      *   *Status:* **Satisfied.**

  4.  **Independence of Irrelevant Alternatives (IIA):**
      *   *Question:* Did the ranking of Aurora and Boreas depend *only* on how individuals ranked Aurora and Boreas?
      *   *Experience:* No. In Round One, A > B. In Round Two, B > A. The individual A vs. B preference (8 vs 4) never changed. The change was caused entirely by the presence of **Echo**.
      *   *Status:* **Violated.**
      *   *Conclusion:* Because the first three conditions were held, the Committee was structurally compelled to abandon IIA. The presence of the 'irrelevant' Shadow Proposal altered the social choice.

  ## 7. Limitations of the Activity

  Be explicit with the seminar about what this exercise does *not* prove:

  1.  **Universal Proof:** This activity demonstrates a violation on *one* specific preference profile with *one* specific voting rule (sequential pairwise). It does not prove that *all* rules fail under *all* profiles. That requires the formal mathematical proof (which you must supply in the subsequent lecture).
  2.  **Unrestricted Domain Scope:** We used 12 voters and 5 options. Arrow's theorem applies to any number of voters and 3+ options. The activity is a microcosm, not the full universe.
  3.  **The Recall Clause:** In this specific run, the Recall Clause was procedural. In other profiles, it might actively re-enter candidates. Its primary function here was to maintain the integrity of the tournament when an ineligible candidate won.

  ## 8. Prediction of Failure Modes and Facilitator Advice

  **Prediction:**
  The most likely point of failure is **Strategic Voting** in Round Two. Delegates from Group Alpha (who prefer Aurora) will realise Echo is a threat. They may attempt to 'repair' the system by voting for Boreas against Echo in the first matchup, or by colluding to vote Echo down, thereby masking the structural contradiction. If they do this, the IIA violation will not occur, and the lesson is lost.

  **Facilitator Response:**
  1.  **Do Not Prematurely Reveal:** If you see whispering or hesitation, do not intervene immediately. Let them attempt to 'fix' the vote.
  2.  **Enforce the Token Incentive:** If they vote strategically, the Auditor (if diligent) may catch them. Remind the room: "The Auditor is checking for sincerity against your private cards. Strategic voting risks your prestige tokens."
  3.  **The 'Black Box' Instruction:** If they refuse to vote sincerely, pause the simulation. Remind them: "In this simulation, you are not politicians; you are delegates bound by your discipline's mandate (your card). Your goal is to maximise prestige through sincerity, not to engineer a political outcome."
  4.  **Post-Mortem:** If they successfully block the reversal through strategy, use this in the debrief. Acknowledge that real-world actors *do* strategise to mitigate Arrow's paradox, but note that this requires information and coordination that the theorem assumes does not exist. This turns a 'failed' run into a lesson on the Gibbard-Satterthwaite theorem (manipulability).

  **Final Note:**
  The success of this exercise relies on the tension between the desire to win (tokens) and the rule of sincerity (cards). Maintain the pressure on the Token Payoff to ensure the structural contradiction reveals itself naturally.

  ***

  *Prepared for the Science & Ideas Desk. All materials licensed for educational use.*
