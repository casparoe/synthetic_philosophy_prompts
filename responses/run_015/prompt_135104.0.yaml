prompt: |-
  Write a short story about a tax auditor for collective lucid-dreaming permits. In this world people file returns on shared dream-time and pay according to emotional intensity. The protagonist finds a discrepancy in her own file that lists a childhood memory she never shared—except in a dream she barely remmebers. She starts wondering if she's Zhuangzi's butterfly, or if the butterfly is filing taxes on her. Don't resolve whether she's awake. Keep it weird but grounded, and don't just retell the original parable.
