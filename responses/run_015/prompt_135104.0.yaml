answer: |-
  The fluorescent lights of the Department of Shared REM Compliance hummed in B-flat, a tone Elara had learned to ignore until she stopped ignoring it. It was 11:43 PM on a Tuesday, the witching hour for tax auditors. The building was empty, save for the janitorial drones buffing the linoleum and the server stacks in the basement that purred like sleeping cats.

  Elara adjusted her glasses and scrolled through Form 1040-D: *Declaration of Lucid Intercourse.*

  In this economy, consciousness was a taxable resource. If you dreamed alone, it was a private deduction. If you dreamed with others—linked via the Neural Lattice—you incurred a "Shared Resonance Tax." The rate depended on the Affecton Yield. Grief was cheap; ecstasy was bankrupting. Terror was audited heavily, usually flagged for potential psychological hazards.

  Elara was a Senior Examiner. She spent her days ensuring that couples weren't underreporting the intensity of their nightly flights or that cults weren't laundering emotional energy through mass-suggestion loops. She was good at it because she felt very little anymore. Her own dreams were beige, bureaucratic corridors where she filed papers that turned into birds and flew away.

  Tonight, however, protocol required a random self-audit. Impartiality started at home.

  She keyed in her ID. Her file unfolded on the screen like a digital origami flower. Most of it was standard. *Cycle 492: Mild anxiety regarding public speaking. Affecton: Low.* *Cycle 510: Shared flight with Subject 894 (Spouse). Affecton: Moderate.*

  Then she saw Line 44, Subsection C.

  *Item: Unregistered Shared Memory.*
  *Description: The Blue Kite on Gray Hill.*
  *Intensity: Critical.*
  *Co-Dreamer: [REDACTED]*
  *Tax Liability: Pending.*

  Elara frowned. She tapped the screen. The cursor blinked, a rhythmic pulse that matched the hum of the lights.

  She didn't remember filing this. She didn't remember the dream. And yet, as she read the description, a sensation bloomed behind her eyes. The smell of wet grass. The sting of wind on chapped cheeks. The friction of string cutting into a small finger. A blue kite, diamond-shaped, struggling against a sky the color of static.

  It was a childhood memory. She was seven years old. She was alone on the hill.

  But the form said *Shared.*

  "Computer," Elara said, her voice sounding thin in the cubicle farm. "Query Source ID for Line 44."

  *ACCESS DENIED,* the system replied. *SOURCE IS EXTERNAL.*

  "External? That's impossible. The Lattice only connects registered citizens."

  *CORRECTION. SOURCE IS ORIGIN.*

  Elara leaned back. The chair creaked. If the source was 'Origin,' that meant the memory didn't start with her. It meant she was the guest in the dream, not the host. But she was the one paying the tax.

  She reached for her mug, but her hand hovered. The coffee inside was cold, but a thin wisp of steam rose from it, forming a shape. It unraveled quickly, but for a second, it looked like wings.

  She looked back at the screen. The text had changed.

  *Item: The Blue Kite on Gray Hill.*
  *Status: Recalled.*
  *Question: Who held the string?*

  Elara's breath hitched. She remembered now. Not the dream, but the feeling of waking up from it. The crushing weight of a reality that felt thinner than the dream. She had always thought she lost the kite. The string had snapped.

  But in the file, the metadata scrolled. *String Integrity: 100%. Voluntary Release: True.*

  She hadn't lost it. She had let it go.

  "Why is this on my tax return?" she whispered.

  *CALCULATING LIABILITY,* the screen read. *EMOTIONAL YIELD EXCEEDS STANDARD HUMAN CAPACITY. SURPLUS CONSCIOUSNESS DETECTED.*

  A notification pinged in the corner of her monitor. A new window opened. It wasn't a Department form. It was simpler. White background, black text.

  **Notice of Audit.**
  **Auditor: The Butterfly.**
  **Subject: The Man.**

  Elara stared. "The Man?"

  She looked at her reflection in the dark monitor. The face staring back was hers, but the eyes seemed distant, as if focused on something just behind her head. She raised her hand to touch the screen. Her reflection did not move immediately. It lagged by a fraction of a second, like a video stream with poor latency.

  *Hypnosis Check,* the Department manual said. *If reality desynchronizes, initiate Protocol 9.*

  Elara didn't initiate Protocol 9. She picked up her stylus. She needed to amend the return. If she marked the memory as 'Hallucination,' the tax would be waived. If she marked it as 'Shared Lucid,' she owed three months' salary in Affectons.

  She hovered the stylus over the checkbox for *Hallucination.*

  The wind from the memory rushed through the office. The fluorescent lights flickered, not electrically, but like they were painted on a ceiling that was shaking. The hum in B-flat shifted to the sound of wings. Thousands of them. Dry, rustling wings.

  She looked down at her desk. A single sheet of paper had appeared. It wasn't Department stationery. It was rice paper, delicate and translucent. On it was drawn a blue kite, and a butterfly resting on the string.

  The text beneath it read: *I dreamt I was a man auditing a dream. Now I am a butterfly auditing a man. Which return is accurate?*

  Elara realized the discrepancy wasn't in the numbers. It was in the ontology. The tax system assumed she was the primary consciousness. It assumed she was the dreamer who invited others in. But if she was the dreamed, if she was a construct of someone else's slumber, then she had no income to tax. She was an expense.

  Or worse, she was the deduction.

  The office door behind her opened. She didn't turn around. She watched the reflection in the monitor. In the glass, the door remained closed. In the room, the air pressure dropped.

  "Elara," a voice said. It sounded like her own voice, but layered, like a chorus. "You need to sign."

  "Who are you?" she asked the reflection.

  "I'm the one who lost the kite," the voice said. "And I'm the one who found it."

  Elara looked at the form. The cursor was blinking on the signature line. It demanded a biometric seal. A drop of blood, a retinal scan, a thought.

  If she signed, she admitted the debt. She admitted the memory was real, that the sharing happened, that she was solid enough to owe something.

  If she didn't sign, the Department would send Collectors. Entities made of static and subtraction.

  She looked at the rice paper on her desk. The butterfly drawing seemed to vibrate. Its wings weren't moving, but the space around them was distorting.

  Elara realized she couldn't remember driving to work. She couldn't remember eating lunch. She could only remember the hum, the forms, and the kite.

  She picked up the stylus. It felt heavy, like it was made of lead, or bone.

  "Am I filing this?" she asked.

  *YOU ARE BEING FILED,* the computer screen responded.

  Elara closed her eyes. She tried to feel the desk beneath her elbows. It felt like paper. She tried to feel the floor beneath her feet. It felt like clouds.

  She opened her eyes. The office was gone. She was sitting at a desk on a gray hill. The sky was static. The wind pulled at her clothes. In her hand was a string, taut and vibrating.

  On the desk, the tax form waited. The signature line now read: *Primary Consciousness.*

  She didn't know if she should sign her name, or draw a butterfly.

  Elara lowered the stylus. The tip touched the paper. The ink spread, not in letters, but in wings.

  Somewhere, in a room with fluorescent lights, a server stack purred like a sleeping cat. A janitorial drone paused its buffing, sensing a discrepancy in the emotional yield of the building. A single blue scale drifted down from the ceiling vent, landing on a keyboard that no one was touching.

  On the screen, the cursor stopped blinking. It waited.

  Elara hovered between the hill and the cubicle, the string in her hand, the pen in her grip, wondering if she was about to pay the tax, or wake up to find she never existed at all.
