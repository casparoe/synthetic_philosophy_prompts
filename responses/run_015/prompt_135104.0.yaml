      *   *Scene 5: The Ending.* Ambiguous. She fills out the form, but the pen feels wrong. The world flickers.

  8.  **Refining the "Weird but Grounded" aspect:**
      *   *Grounded:* Coffee, staplers, tax codes, eye strain.
      *   *Weird:* The ink moves on its own, the shadows breathe, the memory feels more real than the desk.
