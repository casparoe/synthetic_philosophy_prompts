  2.  **Establish the Setting & Mechanics:**
      *   Need a name for the agency. "Bureau of Subconscious Revenue" (BSR)? "Department of Oneiric Compliance"? Let's go with "Department of Shared REM Compliance" (DSRC).
      *   How does the tax work? "Emotional intensity" implies a metric. Let's call it "Lumens" or "Psyche-Units." Let's use "Affectons." High joy or high terror costs more.
      *   The physical space needs to feel mundane to contrast the surreal subject matter. Fluorescent lights, cubicles, coffee stains.

  3.  **Develop the Protagonist:**
      *   Name: Elara.
      *   Personality: Meticulous, tired, skeptical. She treats dreams like spreadsheets.
      *   Motivation: Finding errors. It's her job. But this error is personal.

  4.  **The Inciting Incident:**
      *   Routine audit of her own file (mandatory for auditors to ensure impartiality?).
      *   She sees a line item: "Memory ID 8940-B: The Blue Kite."
      *   Problem: She never filed this. She doesn't remember this. But it feels familiar.

  5.  **The Investigation:**
      *   She digs into the metadata. Who shared this dream with her?
      *   The "co-dreamer" field is blank or glitched.
      *   She tries to recall the memory. It's fuzzy, like a dream within a dream.
      *   The sensory details: A blue kite, a windy hill, a feeling of loss.

  6.  **Integrating the Zhuangzi Theme:**
      *   Avoid explicit mention of "Zhuangzi" until the end or keep it subtle. The prompt says "don't just retell the original parable," so the reference should be thematic, not a lecture.
      *   The twist: Is she auditing the dream, or is the dream auditing her?
