  You ask if this is the best-ordered commonwealth, but you mistake order for justice, which is the common error of those who trust too much in the power of man. I wrote that we follow custom to prevent war, not because custom becomes justice simply by enduring, and this machine you describe, this iron magistrate that executes the statutes without pity or pause, seems to me the ultimate triumph of force without justice. What is missing from your perfect system is equity, the gentle correction that acknowledges human frailty, for by removing all discretion you remove the only mercy available to us poor wretches—the human hesitation that sometimes allows grace to enter. If the laws transcribed into its memory were born of violence or whim, as most human laws are, then your machine does not order a commonwealth; it perfects a tyranny, making the injustice so efficient that no cry can reach the ear of the sovereign. Time does not wash away the stain of an unjust origin, it merely covers it with the moss of habit, and to ask if three hundred years of silence make a theft into a right is to ask if a lie told long enough becomes the truth, to which I must answer that only God knows the truth, and He is not bound by your clocks nor your engines.
