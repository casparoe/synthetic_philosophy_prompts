      *   **Core Question:** Why does Nyāya treat *anumāna* (inference) as an irreducible, primary *pramāṇa* (instrument of valid cognition) despite its apparent dependence on *pratyakṣa* (perception) and *śabda* (testimony/linguistic competence)?
      *   **Specific Tension:** If *pramāṇas* are modular (domain-specific, encapsulated), *anumāna* looks like a cross-modal interaction (perception of the *liṅga* + grasp of *vyāpti* via testimony/learning). So, is *anumāna* truly modular, or is the modular reading a misprojection? Is there an internal Nyāya reason for its sui generis status?
      *   **Context:** Dissertation chapter. Needs high-level philosophical analysis, textual grounding (Navya-Nyāya), and engagement with cognitive science concepts.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Modular Hypothesis:* The user suggests *pramāṇas* look like Fodorian modules (encapsulated, domain-specific).
      *   *The Anumāna Problem:* Inference seems to need perception (to see the smoke) and language/memory (to recall the universal relation *vyāpti*). If it needs other modules, is it a module itself?
      *   *Fodor's Modularity:* Input systems are modular (fast, encapsulated, domain-specific). Central systems are not. *Pramāṇas* are instruments of *knowledge*, not just input.
      *   *Nyāya Ontology of Cognition:* *Pramāṇa* is the *karaṇa* (instrumental cause) of *pramā* (veridical cognition). The definition hinges on the *final cause* or the *distinctive causal chain*, not just the raw materials.

  3.  **Brainstorming Nyāya Responses (Internal Logic):**
