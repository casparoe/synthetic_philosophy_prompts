answer: |-
  # COMPARISON INTEGRITY PROTOCOL (CIP)
  **For:** Curriculum Coordinators, Lead Docents, Education Staff
  **Time Required:** 15 Minutes
  **Purpose:** To prevent historical flattening ("bad things happen everywhere") while allowing structural insight. To distinguish between *illuminating comparison* and *harmful equivalence*.

  ---

  ## PART 1: THE DECISION GATES
  *Run these questions in order. If any gate results in a HARD STOP, the proposal is rejected. If a VALUES FLAG is triggered, the proposal must go to the Ethics Board before approval.*

  ### GATE 1: TYPE OF COMPARISON
  **Question:** What is the primary link being drawn between Event A (Holocaust/Core Mandate) and Event B (Comparison Case)?
  *   **A. Structural/Causal:** Comparing *how* it happened (bureaucracy, law, logistics, propaganda techniques).
  *   **B. Emotional/Experiential:** Comparing *what it felt like* (fear, loss, displacement, testimony).
  *   **C. Moral/Political:** Comparing *good vs. evil* or implying the actors/intentions are identical.

  **Sufficient Answer:** Must be **A** or **B**.
  **HARD STOP:** If **C**. (We do not teach moral equivalence of perpetrators or political equivalence of regimes.)
  **VALUES FLAG:** If **B**. (Empathy is a value judgment. Requires Ethics Board review to ensure it does not erase historical cause.)

  ### GATE 2: SPECIFICITY PRESERVATION
  **Question:** Does the comparison preserve the specific ideological and historical features of the Holocaust, or does it collapse them into a generic template?
  *   **Checklist:**
      1.  Is the specific ideological goal (annihilation of Jews as Jews) named?
      2.  Is the industrial/state-sponsored scale distinguished from sporadic violence?
      3.  Is the comparison case allowed to have *its own* specific causes (not just forced to match the Holocaust)?

  **Sufficient Answer:** Yes, the specific intent of the Holocaust remains distinct and central. The comparison highlights differences as much as similarities.
  **HARD STOP:** If the lesson implies "Genocide is just generic hatred" or removes the specific antisemitic/racial ideology of the Holocaust to make the comparison fit.
  **HARD STOP:** If the comparison case is forced into the Holocaust's shape (e.g., calling all refugees "deportees" without legal/historical distinction).

  ### GATE 3: BAUMAN/MODERNITY CHECK
  **Question:** Is Zygmunt Bauman's thesis on modernity being used correctly?
  *   **Correct Use:** Showing how *rational tools* (trains, schedules, filing systems) were hijacked by *irrational ideology* to enable killing. It explains the *capacity*, not the *motive*.
  *   **Misuse:** Implying that *any* modern bureaucracy is inherently genocidal, or that "office work" is the cause rather than the enabler.

  **Sufficient Answer:** The lesson distinguishes between the *tool* (bureaucracy) and the *intent* (ideology).
  **HARD STOP:** If the lesson suggests "Modern bureaucracy = Genocide" or implies all modern states are inherently performing the same function as the Nazi state.
  **HARD STOP:** If the comparison removes the human agency/ideological choice and blames "the system" entirely.

  ### GATE 4: AUDIENCE CAPACITY
  **Question:** Can the target audience hold specificity and comparison simultaneously?
  *   **Test:** If a student remembers only *one* thing from this lesson, will it be the specific history of the Holocaust, or the generic comparison?
  *   **Test:** Does the comparison clarify the Holocaust, or does the Holocaust just become a hook to talk about something else?

  **Sufficient Answer:** The Holocaust remains the anchor. The comparison illuminates the anchor.
  **HARD STOP:** If the Holocaust becomes merely an analogy for a contemporary issue (instrumentalization).
  **VALUES FLAG:** If the contemporary issue is highly polarized (e.g., current immigration policy). (Requires Ethics Board review for institutional risk.)

  ---

  ## PART 2: APPLICATION TO PROPOSALS
  *Running the three submitted proposals through the CIP.*

  ### PROPOSAL A: Deportation Train Logistics (Holocaust vs. Armenian Genocide)
  *   **Gate 1 (Type):** Structural/Causal. (Pass)
  *   **Gate 2 (Specificity):** Passes *only if* the lesson explicitly distinguishes the ideological intent (Pan-Turkism/Nationalism vs. Racial Antisemitism). If it teaches "both used trains to kill," it fails.
  *   **Gate 3 (Bauman):** N/A (Logistics focus).
  *   **Gate 4 (Audience):** High schoolers can handle logistical comparison if ideological differences are mapped.
  *   **DECISION:** **APPROVE WITH HEAVY FRAMING.**
      *   *Condition:* Lesson plan must include a dedicated module on the *differences* in ideological intent. Cannot simply overlay maps.

  ### PROPOSAL B: Survivor Testimony Pairing (Holocaust vs. Recent Genocide for "Universal Empathy")
  *   **Gate 1 (Type):** Emotional/Experiential. (**VALUES FLAG**).
  *   **Gate 2 (Specificity):** **FAIL.** "Universal empathy" requires stripping context to find common emotional ground. This inherently flattens the *why* into the *what*. It risks teaching that "suffering is the same" regardless of cause.
  *   **Gate 3 (Bauman):** N/A.
  *   **Gate 4 (Audience):** High risk. Students often conflate emotional resonance with historical equivalence.
  *   **DECISION:** **REJECT (In Current Form).**
      *   *Reasoning:* This is the "well-meaning trap." Prioritizing empathy over causality violates Gate 2. It suggests the *value* of the victim is in their pain, not in the specific injustice done to them.
      *   *Path Forward:* Must be rewritten to focus on "Distinct Traumas" rather than "Universal Empathy." Must go to Ethics Board if resubmitted with empathy focus.

  ### PROPOSAL C: Bauman/Office Work -> Immigration Detention (No Jewish Specificity)
  *   **Gate 1 (Type):** Structural/Causal. (Pass)
  *   **Gate 2 (Specificity):** **HARD STOP.** Proposal explicitly states "without ever mentioning Jewish specificity." This violates the core mandate.
  *   **Gate 3 (Bauman):** **HARD STOP.** Misuses Bauman. It implies the *bureaucracy* is the killer, erasing the ideological intent. It equates US Immigration policy with Nazi Extermination policy via "office work."
  *   **Gate 4 (Audience):** **VALUES FLAG.** Highly polarized contemporary politics.
  *   **DECISION:** **REJECT (Hard Stop).**
      *   *Reasoning:* Violates Gate 2 and Gate 3. Erases the Holocaust to make a political point about current bureaucracy. Misuses modernity thesis to imply functional equivalence between distinct state actions.

  ---

  ## PART 3: LIMITATIONS & GAMING
  *Where this tool breaks down.*

  **1. The "Structural" Loophole**
  *   **Risk:** A clever curriculum designer can label a moral comparison as "structural" to bypass Gate 1. (e.g., "We aren't saying they are the same morally, just comparing the *structure* of the camps.")
  *   **Mitigation:** Lead Docents must review the actual student handouts, not just the lesson title. If the student takeaway is "all camps are the same," it failed Gate 2 regardless of the label.

  **2. The Values/Facts Blur**
  *   **Risk:** Gate 2 (Specificity) relies on historical consensus, but what counts as "essential specificity" is sometimes debated by historians.
  *   **Mitigation:** This is why the **VALUES FLAG** exists. If the team argues about whether a specific feature is "essential," do not vote. Send to Ethics Board. This tool cannot resolve historiographical disputes.

  **3. The "Current Events" Pressure**
  *   **Risk:** Teachers want relevance. This tool will reject many "relevant" comparisons (like Proposal C) that teachers feel are urgent.
  *   **Mitigation:** The tool cannot predict public backlash. It ensures historical integrity, not public relations safety. A lesson can pass CIP and still be controversial.

  **4. What This Tool CANNOT Do**
  *   **It cannot determine truth:** It checks for internal coherence and historical alignment, not absolute truth.
  *   **It cannot replace expertise:** A 15-minute check by a docent cannot substitute for academic review of new research.
  *   **It cannot prevent bad faith:** If a user lies on the checklist (e.g., claims they are teaching specificity when they are not), the tool fails. It requires honest self-reporting.

  **5. The "Empathy" Blind Spot**
  *   **Risk:** The tool is biased against emotional comparisons (Gate 1/2). Some pedagogical theories argue empathy *is* a valid entry point.
  *   **Mitigation:** This is a feature, not a bug, for this specific museum mandate. However, if the museum shifts mission to include "human rights advocacy" over "memorial/history," this tool will need revision. Currently, it prioritizes historical precision over emotional resonance.

  ---
  **END OF PROTOCOL**
