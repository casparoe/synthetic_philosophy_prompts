  **MEMORANDUM**

  **TO:** Reproductive Medicine Service Ethics Advisory Committee
  **FROM:** Philosophy Advisor
  **DATE:** 12 March
  **SUBJECT:** Funding Allocation: Preimplantation Genetic Testing vs. Additional IVF Cycles

  We recommend approving funding for IVF with preimplantation genetic testing for the specified neurodegenerative condition, subject to a severity threshold. We recommend declining the claim for additional funded IVF cycles for age-related infertility at this time.

  **Reasoning**

  Our service operates within a fixed budget intended to advance health. The central ethical question is whether preventing the transmission of a serious genetic condition is a higher priority than enabling additional births where conception is otherwise impossible due to age. While both outcomes result in children with lives worth living, the moral weight of preventing significant disease outweighs the benefit of creating new life in this context.

  The audit indicates that most carrier couples (11 of 13) would conceive naturally if testing were unavailable. Therefore, funding testing does not determine whether they become parents, but rather determines the health status of the children they have. In contrast, funding additional cycles for age-related infertility determines whether specific children exist at all. Healthcare resources are primarily mandated to address health deficits. A progressive neurodegenerative condition involving loss of mobility and independence constitutes a significant health deficit. Age-related infertility, while deeply distressing, is a natural limitation rather than a pathology in the same sense. Prioritizing the prevention of serious disability aligns more closely with the core medical mandate than expanding family size beyond natural fertility windows.

  **Addressing the Expressivist Objection**

  One committee member argued that funding selection against this condition sends a harmful message to those currently living with it: that their lives are mistakes not worth living. This is the strongest version of the expressivist objection. It holds that state-funded selection implies a judgment that the world would be better without people like them, contradicting their own testimony that their lives are valuable.

  We reject this conclusion while accepting the concern. We can consistently value existing persons while wishing to prevent the condition they carry. We fund treatments to improve the quality of life for patients currently living with the condition; funding testing to prevent the condition in future patients is an extension of that same commitment to reduce suffering and loss of function. Valuing a person is not identical to valuing every aspect of their biology. We are not saying their lives are net negative; we are saying that avoiding the progressive loss of mobility is a legitimate health goal, provided we do not devalue the persons who currently endure it.

  **Addressing the Claim for Additional IVF Cycles**

  Proponents of funding the additional infertility cycles argue from equality and autonomy. They contend that both claims result in healthy children. To deny the infertile couple their only chance at a biological child, while granting the carrier couple a healthy child they could likely have conceived anyway (albeit with risk), unfairly penalizes those with infertility. On this view, the welfare of the child born via infertility treatment is equal to the child born via testing, so parental need should decide.

  We answer that need is not the only criterion for public health funding. The carrier couple faces a specific health risk transmission that the infertile couple does not. The infertile couple’s claim is to reproductive liberty; the carrier couple’s claim is to disease prevention. In a system of limited resources, preventing significant pathology takes precedence over facilitating reproduction where no pathology exists in the prospective child. The child resulting from infertility treatment is healthy; the child resulting from natural conception by carriers faces a 50% risk of severe disability. Preventing that risk is a specific health intervention that funding additional cycles is not.

  **Scope Criterion**

  The lay chair correctly noted the risk of a slippery slope toward funding selection for milder conditions, such as severe migraine. To prevent this, we must adopt a principled scope criterion rather than deferring to parental preference. We will fund selection only for conditions that significantly impair core physical or cognitive capacities required for a wide range of life plans.

  The neurodegenerative condition in question involves progressive loss of independence and mobility, striking at the core capacity for physical agency. A predisposition to migraine, however painful, does not typically strip an individual of the capacity for independence or cognitive planning. Our criterion is therefore: *Funding is available for selection against conditions that cause substantial, progressive impairment of central capabilities necessary for independent functioning.* This distinguishes serious disability from manageable health burdens without requiring us to judge whether a life is worth living.

  **Regulation Amendment**

  The current regulation requires us to weigh the welfare of "the child who would be born as a result of treatment." This phrasing is too narrow. It forces us to look only at the child born via treatment (who is healthy in both claims) and blinds us to the comparative context—specifically, the child who would have been born without treatment (who might have the condition) or the fact that no child would exist without treatment (in the infertility claim).

  We recommend asking the Board to amend the regulation to read: "weigh the welfare of children affected by the treatment decision, including those who would be born in the absence of treatment." This allows us to consider the comparative health outcomes between the treated and untreated scenarios, which is necessary for rational allocation without violating the principle that we cannot harm those who are never born.

  **Conditions and Review**

  This funding approval is conditional on annual monitoring of uptake and cost. We will review this decision in two years. At that time, we will assess whether the severity threshold is being applied consistently and whether the funding has inadvertently displaced essential infertility services for patients with medical causes of infertility.

  **What We Are Not Deciding**

  This decision is not a ruling on all forms of genetic selection. It does not authorize selection for non-medical traits, such as sex or intelligence. It does not establish a precedent for funding selection for conditions that do not meet the core capability impairment threshold. Finally, this memo does not resolve broader questions of population ethics regarding the value of creating new lives versus preventing suffering; it applies a specific health-mandate principle to the current budget constraint. We are deciding only how to allocate this specific sum between these two specific claims under current regulations.
