prompt: |-
  hey i'm running a workshop for philosphy undergrads on Libet-style experiments and free will next thursday. Don't explain the experiments to me—plan how i should teach it. I want to move away from the usual "brain decides 300ms before you do" pop-science framing and build toward a more niche interpretation where the readiness potential is treated as noisy acummulator dynamics rather than a deterministic command, and where the veto window isn't a separate causal power but just a modulation of that same stocastic process.

  So: what order do the pieces need to go in, and what depends on what? What's the carrying example—definitely not the classic button-press, maybe a continuous reaching task?—and why that one? The misconceptions they'll bring in: the RP proves determinism, consciousness is just a spectator, and the veto is like a little homunculus pulling a lever. Where exactly in the sequence should i head each one off? Give me one check question for the end to test whether they understand that the neuroscience doesn't straightforwardly kill free will, and tell me what i should openly refuse to cover at this level. Also, is there a specific misconception about stocastic modulation i should anticipate and defuse?
reasoning: |-
