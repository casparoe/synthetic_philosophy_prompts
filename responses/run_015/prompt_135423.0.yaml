answer: |-
  Here is a pedagogical plan designed to shift the conceptual framework from "deterministic command" to "stochastic modulation."

  ### 1. The Carrying Example: Continuous Cursor Control
  **Do not use the button press.** The button press is binary (click/no-click), which reinforces the binary misconception (decided/not-decided).

  **Use:** A task where students imagine steering a cursor toward a target on a screen using only neural activity (or a joystick representing neural drive).
  **Why:**
  *   **Trajectory vs. Event:** A button press looks like an event (the spike). A reaching task looks like a trajectory (the accumulation).
  *   **Mid-stream Correction:** In a reach, you can correct your path *during* the movement. This visually demonstrates that the "decision" isn't a single point in time prior to action, but a sustained process that remains sensitive to modulation until completion.
  *   **Threshold Visualization:** You can visualize the "threshold" as the edge of the target. The "noise" is the hand shaking or the cursor drifting. The "veto" is steering away from the target before contact.

  ### 2. The Sequence (The Arc)
  *Total Time: ~60–90 mins*

  **Phase 1: The Phenomenological Setup (15 mins)**
  *   **Goal:** Establish the intuition of "conscious initiation."
  *   **Activity:** Have them perform a slow, deliberate reach for a pen. Ask them to pinpoint the exact moment they "decided."
  *   **Dependency:** This sets up the conflict. They *feel* like the cause.
  *   **Misconception Intercept:** **"Consciousness is a spectator."**
      *   *Where:* End of Phase 1.
      *   *How:* Acknowledge the intuition but label it "the feeling of agency," not "the cause of agency." Tell them the workshop is about whether the *neural mechanism* invalidates that feeling, not whether the feeling is veridical.

  **Phase 2: Re-framing the Readiness Potential (RP) (25 mins)**
  *   **Goal:** Shift RP from "Unconscious Decision" to "Noisy Accumulator."
  *   **Content:** Present the RP not as a specific command signal ("Fire now"), but as the aggregate firing rate of a population drifting toward a threshold due to background noise + bias.
  *   **Dependency:** Requires Phase 1's intuition to create tension.
  *   **Misconception Intercept:** **"The RP proves determinism."**
      *   *Where:* Middle of Phase 2.
      *   *How:* Explicitly distinguish *stochastic* from *deterministic*. If the RP is noise-driven accumulation, the timing of the threshold crossing is probabilistic, not clockwork. The brain isn't "deciding" at $t-500ms$; it's "wandering" toward $t-0ms$.

  **Phase 3: Re-framing the Veto (25 mins)**
  *   **Goal:** Integrate the Veto into the accumulator model (Modulation vs. Homunculus).
  *   **Content:** The Veto is not a separate "stop button" pressed by a conscious ghost. It is a top-down adjustment of the *threshold* or a damping of the *accumulation rate* within the same circuit.
  *   **Dependency:** Requires Phase 2 (you can't modulate an accumulator if you think it's a deterministic command).
  *   **Misconception Intercept:** **"The Veto is a homunculus pulling a lever."**
      *   *Where:* Start of Phase 3.
      *   *How:* Use the Cursor Example. If the cursor drifts toward a "forbidden zone" (the action), steering away isn't a new command; it's adjusting the sensitivity of the steering mechanism. The "conscious" part is the parameter adjustment, not a separate causal chain.

  **Phase 4: Synthesis & Free Will Implications (15 mins)**
  *   **Goal:** Evaluate the threat to Free Will.
  *   **Content:** If the system is stochastic and consciousness modulates the parameters of that stochasticity, consciousness is a *control variable*, not an epiphenomenon.
  *   **Dependency:** Requires Phases 2 & 3 to be fully integrated.

  ### 3. Anticipated Misconception: Stochastic Modulation
  **The Trap:** "If the process is stochastic (random/noisy), then my will is free because it's not determined."
  **The Defuse:** You must head this off in **Phase 2**.
  **The Argument:** Randomness is not agency. A dice roll is not free will. If your action is just the result of neural noise crossing a threshold, you are not "free," you are just "random."
  **The Fix:** Emphasize that *modulation* is the key, not the *noise*. Freedom (of the sort compatible with this model) comes from the ability to bias the noise or raise the threshold, not from the existence of the noise itself.

  ### 4. The Check Question
  *Administer this at the very end to test if they have abandoned the "Homunculus/Deterministic" model.*

  **Question:**
  "In the Noisy Accumulator model, a subject decides not to move (vetos) after the Readiness Potential has begun rising. Which of the following best describes the causal role of consciousness in this veto?"

  A) Consciousness detects the RP and sends a separate inhibitory signal to cancel the motor command.
  B) Consciousness is an epiphenomenal readout of the threshold failing to be reached.
  C) Consciousness modulates the decision threshold or accumulation rate of the *same* neural population generating the RP.
  D) Consciousness initiates a quantum event that randomizes the neural noise.

  **Correct Answer:** **C**.
  *   **A** is the Homunculus view (separate lever).
  *   **B** is the Spectator view (Libet's original worry).
  *   **D** is the "Randomness = Freedom" fallacy.
  *   **C** is the Target View (Integrated Modulation).

  ### 5. Scope Refusal: What to Openly Exclude
  To keep this manageable and philosophically rigorous, explicitly state at the start that you will **not** cover:

  1.  **The "Hard Problem" of Consciousness:** You are not arguing that neural modulation *explains* qualia. You are arguing that it secures a causal role for the *function* of agency.
  2.  **Exact Millisecond Timings:** Libet's original 300ms/500ms numbers are notoriously variable and methodologically contested. Focusing on them invites technical nitpicking that distracts from the conceptual model. Treat the timings as "prior to report" rather than specific numbers.
  3.  **Libertarian Free Will:** Do not promise to prove they have Libertarian Free Will (the ability to do otherwise in the exact same state). You are only demonstrating that the neuroscience does not *eliminate* Compatibilist control. If you try to prove Libertarianism via stochasticity, you will fall into the "Randomness Trap" mentioned above.
