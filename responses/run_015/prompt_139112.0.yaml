answer: |-
  This session forces a wager on the timing of your own consciousness to demonstrate that first-person authority dissolves when experience is retroactively edited.

  ### Materials
  *   **Projector & Laptop:** Pre-loaded with a custom "Phi Phenomenon" script (two discs, different colors/brightness, alternating positions with specific ISI).
  *   **Audio System:** For a parallel auditory illusion (two tones, different pitches, alternating channels).
  *   **Commitment Cards:** 18 index cards. Side A: "I certify that my experience of the first stimulus was definite before the second stimulus appeared." Side B: "I certify that my experience was incomplete until the second stimulus appeared." (Students must choose one and sign).
  *   **Evidence Slips:** Small slips of paper attached to each card. Prompt: "The one observable fact that would prove my choice above is true is: __________."
  *   **Stakes:** 18 high-quality chocolates or tokens. Placed in a central "Pot."
  *   **Transfer Handouts:** Three short vignettes (Perception, Pain, Legal).
  *   **Accessibility Note:** The visual demo uses high-contrast Blue/Yellow discs (accessible to most colorblind variants) plus position shift. The auditory demo runs simultaneously for full redundancy.

  ### Rules
  1.  **Silence on Theory:** Until the final 15 minutes, no naming of illusions, brain processes, or philosophical theories. Reports must be phenomenological only ("I saw," "I heard," "I felt").
  2.  **The Wager:** To claim a chocolate from the Pot, a student must successfully validate their Evidence Slip during the session.
  3.  **The Veto:** If a student explains *why* the illusion happens before the debrief, they forfeit their chance to claim a chocolate (prevents "expert" students from defusing the tension with theory).

  ### Timeline (90 Minutes)

  **00:00 – 00:15: The Commitment**
  *   Distribute Cards and Evidence Slips.
  *   **Instruction:** "We are testing the timeline of your awareness. You will see and hear stimuli. You must commit now to when your experience became definite. Was it immediate (Side A) or delayed/constructed (Side B)?"
  *   **Task:** Students choose A or B, sign, and write their condition for proof on the Evidence Slip.
  *   **Collection:** Collect cards. Place them face down. Place the chocolates in the center. State: "These chocolates belong to those who can prove their timeline. If no one can prove it, the pot remains unclaimed."

  **00:15 – 00:35: The Live Demonstrations**
  *   **Visual (Projector):** Flash Disc 1 (Blue, Left) → 50ms ISI → Disc 2 (Yellow, Right). Repeat 10 times. Ask students to report motion and color change. (Standard Phi: they see one object moving and changing color mid-path).
  *   **Auditory (Speakers):** Play Tone 1 (Low, Left Channel) → 50ms ISI → Tone 2 (High, Right Channel). (Standard auditory phi: a single tone gliding up and across).
  *   **Intervention:** Ask specific students: "At exactly what millisecond did you know the color/pitch?" "Did you see the blue disc *before* the yellow one appeared, or only after?"
  *   **Constraint Enforcement:** If an "expert" student says "It's neural latency," remind them of Rule 1: "Describe the experience, not the mechanism."

  **00:35 – 00:50: The Trap (Evidence Review)**
  *   Return the Commitment Cards to the students.
  *   **Task:** "Look at your Evidence Slip. You claimed you could prove when your experience happened. Using only the data from the last 20 minutes, attempt to validate your claim."
  *   **Discussion:** Students will realize their only evidence is their own report, but the report describes an experience that the demonstration shows is malleable.
  *   **The Loss:** Ask: "Who can claim a chocolate?" (None can). "Why?" (Because the report itself is the thing being questioned).
  *   **Outcome:** The pot remains untouched. The commitment is unpaid.

  **00:50 – 01:15: Transfer Round**
  *   Distribute Handouts. Students break into groups of 3. Each group takes one case.
  *   **Case 1 (Perception):** A driver sees a red light, slams brakes, then realizes the light was green but the brake lights of the car ahead made it look red in memory. Was the experience of 'red' lived then, or written later?
  *   **Case 2 (Pain):** A patient under sedation reports pain during a procedure upon waking. The anesthesiologist says brain waves show no nociceptive processing at that time. Did the patient feel pain *then*?
  *   **Case 3 (Legal):** A witness testifies they saw the defendant hold a gun. Video shows the gun was drawn 2 seconds later than the witness claims. The witness insists their memory is vivid. Is the vividness evidence of the fact?
  *   **Task:** For each case, rule: Does the distinction between 'lived then' vs. 'written later' change the moral or legal outcome? Or is the distinction empty?

  **01:15 – 01:30: Debrief & Jargon**
  *   Reveal the terms: Orwellian (memory revision) vs. Stalinesque (pre-conscious editing).
  *   Map the session to the argument.
  *   Address the "No Fact of the Matter" move.

  ### Debrief Script & Facilitation

  **1. Mapping the Moments**
  *   **The Commitment Card:** Represents the intuition of the Cartesian Theater (the assumption that there *is* a fact about when you saw it).
  *   **The Unclaimed Pot:** Represents the indistinguishability of the two stories. You cannot cash out the truth value.
  *   **The Transfer Cases:** Show the contagion. If the distinction is empty in perception, does it dissolve responsibility in law or medicine?

  **2. Handling the Split Room**
  *   **Scenario:** Half the room says "It's obviously Stalinesque (pre-conscious editing)," half says "It's Orwellian (memory revision)."
  *   **Facilitator Move:** "You are disagreeing about the *mechanism*, but agreeing on the *data*. Since the data (your experience) is identical in both stories, what work is your disagreement doing? If you cannot design a test that doesn't rely on the testimony being tested, are you arguing about physics or metaphysics?"

  **3. Handling the 'Experts' (The 3 Perception Students)**
  *   **Risk:** They say "This is just post-diction, we know the latency is 100ms, so it's Stalinesque."
  *   **Counter:** "You know the *theory* of latency. But did your *consciousness* wait? If you say 'Yes, I know I didn't see it until later,' are you reporting an experience or reciting a textbook? If you can't feel the delay, how do you know the delay isn't just a story you tell about your brain?"
  *   **Goal:** Force them to admit that even their expert knowledge relies on the very first-person reports the demo undermines.

  **4. Handling the Contrarians (Bullet Biters)**
  *   **Risk:** Students say "Both stories are true," or "It doesn't matter, so why are we talking about it?"
  *   **Counter:** "If it doesn't matter, then your authority on your own mind is an illusion. You claimed on your card that you knew when you knew. You couldn't prove it. If that distinction is empty, what else is empty? Pain? Intent?"

  **5. The Critical Move: No Evidence → No Fact**
  *   **The Step:** The activity proves **No Evidence Could Tell Us Which Story Is True** (because the evidence is the experience itself, which is the variable).
  *   **The Leap:** Dennett argues **There Is No Fact of the Matter**.
  *   **Facilitator Instruction:** Do not assert the Leap as proven by the activity. The activity only stages the *absence* of evidence.
  *   **Script:** "Today you felt the lack of evidence. You left the chocolates on the table because you couldn't validate your timeline. Dennett takes the next step: if no evidence *could* validate it, even in principle, then there is no truth to be found. The activity forces you to live the epistemic gap. Whether that gap implies an ontological void is the philosophical wager. I am asserting the gap; you must decide if the void follows."
  *   **Recommendation:** Flag this as a further question. Asserting it too strongly turns the seminar into dogma. Let them feel the vertigo of the gap first.

  ### Failure Modes & Limits

  *   **Failure:** Students treat the "Unclaimed Pot" as a game loss rather than an epistemic failure.
      *   **Fix:** Explicitly link the chocolate to the *authority of the self*. "You didn't lose a snack; you lost the guarantee that you know your own mind better than anyone else."
  *   **Failure:** The visual demo doesn't work for some (no illusion felt).
      *   **Fix:** The auditory parallel ensures everyone has *some* phi experience. For those who feel neither, assign them the role of "External Observer" in the Transfer Round—they judge the cases based on the reports of others, highlighting the third-person limitation.
  *   **Failure:** The colorblind student feels singled out by the accessibility accommodation.
      *   **Fix:** Run the auditory demo for *everyone* simultaneously. Frame it as "Multimodal Integration" rather than "Accommodation." This ensures the colorblind student participates in the live demo fully without segregation.
  *   **Limit:** The activity cannot prove Eliminativism.
      *   **Note:** Acknowledge in debrief that Realists can argue there *is* a fact, we just lack access. The activity kills *certainty*, not necessarily *truth*. Ensure students see this distinction.
