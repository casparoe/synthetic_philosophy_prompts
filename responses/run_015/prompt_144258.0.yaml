  ### The Tension in Hobbes's Geometric Philosophy

  Thomas Hobbes's philosophy of mathematics rests on a radical constructivism: geometry is the only truly certain science because its objects are not discovered in nature but generated by the human mind through defined motions. For Hobbes, truth is *factum* (made); we stipulate definitions of points and lines, and certainty follows from our own causal generation of these figures. However, this epistemological confidence clashes with his decades-long, public failure to solve the problem of squaring the circle. While Hobbes insisted that his method of geometrical construction was sound, mathematicians like John Wallis repeatedly demonstrated errors in his proofs. This creates a profound tension: if geometric certainty derives from our ability to construct objects, why does the circle resist final construction? The failure suggests either a flaw in Hobbes's materialist method (undermining his claim to certainty) or an inherent resistance in the object itself (undermining the claim that we fully create it). The villanelle below inhabits this aporia, asserting the constructivist doctrine while registering the persistent gap of the unsquared circle.

  ***

  ### De Corpore Geometrico

  I make the form; the ground is well prepared  
  No phantom shape exists where lines are bound  
  the circle remains unsquared  

  By motion's law the figure is declared  
  Where nature hides, my line is newly found  
  I make the form; the ground is well prepared  

  Names constitute the world, nothing is spared  
  Yet certainty escapes the compass round  
  the circle remains unsquared  

  The line is mine, the surface is not shared  
  With gods or stars that turn on cosmic ground  
  I make the form; the ground is well prepared  

  I square the rectangle, fully aired  
  But curve defies the rule we now propound  
  the circle remains unsquared  

  Where breaks the proof: in hand or object impaired?  
  Is fault in motion or the thing unbound?  
  I make the form; the ground is well prepared  
  the circle remains unsquared
