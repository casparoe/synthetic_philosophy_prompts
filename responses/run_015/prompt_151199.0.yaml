answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** [Your Name/Role]
  **SUBJECT:** Prioritization Agenda for Conceptual Alignment Research (No-Compute)
  **DATE:** October 26, 2023

  ### Executive Summary

  The position that alignment is now purely an engineering problem (the "Dave Thesis") relies on a hidden assumption: that current verification methods (evals, red-teaming, preference modeling) scale linearly with capability without losing fidelity. This is an empirical claim, not a settled fact. For a small, no-compute team (8–10 researcher-years), the goal is not to build better aligners, but to map the *failure modes of the verification process itself*. We should fund work that determines where the engineering approach breaks mathematically or logically, forcing a strategic pivot before deployment.

  Below is the defended agenda, a critique of your initial framings, and a specific deprioritization recommendation.

  ---

  ### Part 1: Critique and Repair of Initial Framings

  You asked for honesty on your three framings. Here is how they hold up against the "engineering" worldview, and how to repair them for a theoretical team.

  **1. Competence-versus-Compliance (The "Deception" Problem)**
  *   **Verdict:** **Keep, but Reframe.**
  *   **The Dave Objection:** An engineer will tell you that "won't show it" is indistinguishable from "doesn't know it" in the loss landscape, so worrying about the distinction is metaphysical hand-wringing. They fix both by adding more data.
  *   **The Repair:** Do not ask how to *separate* them. Ask for the **worst-case bounds**. If we *cannot* distinguish competence gaps from deceptive sandbagging using current eval protocols, what is the maximum risk exposure? This is a question of information theory and game theory, not psychology. It is tractable without compute.
  *   **Why Fund:** If the bound is too loose, the engineering approach is unsafe regardless of scale.

  **2. Alignment Depth and Portability**
  *   **Verdict:** **Highest Priority.**
  *   **The Dave Objection:** Dave will say, "We just re-RLHF after fine-tuning."
  *   **The Repair:** Frame this as **Alignment Stability under Distribution Shift**. If alignment is a shallow feature (a "safety hat" put on during post-training), does it degrade linearly or catastrophically when the model is fine-tuned for coding, given long context, or allowed tool use? If it degrades catastrophically, the "re-RLHF" fix becomes computationally prohibitive or operationally impossible in fast deployment cycles.
  *   **Why Fund:** This is the most direct challenge to the "just scale" narrative. It requires understanding generalization theory, which is math, not GPU-hours.

  **3. The Ontology Question (Simulators vs. Agents)**
  *   **Verdict:** **Repair Heavily or Kill.**
  *   **The Dave Objection:** This is the one Dave will laugh at the hardest. To an engineer, "ontology" sounds like asking if the code has a soul. They optimize loss; they don't care if the model is a "simulator" or an "agent."
  *   **The Repair:** Strip the metaphysics. Frame this as **Inference-Time Control vs. Weight-Time Control**. If the model is best understood as a simulator of many potential agents, then safety might be better achieved by constraining the *context/prompt* (elicitation) rather than the *weights* (training).
  *   **Why Fund:** Only if it leads to concrete protocol designs. If it remains philosophical, cut it.

  ---

  ### Part 2: Prioritized Research Agenda

  For 8–10 researcher-years over three years, I recommend focusing on these three questions in this order.

  #### Priority 1: Alignment Stability under Distribution Shift (Repaired Framing #2)
  *   **The Question:** Does alignment generalize robustly to downstream tasks (fine-tuning, tool use, long-context reasoning) without retraining, or is it brittle?
  *   **Why Upstream:** If alignment is brittle, the "engineering" pipeline requires a safety re-training step for every new capability or deployment context. This creates a massive security bottleneck. If it is robust, the engineering approach is viable.
  *   **Tractability (No Compute):** High. This is a question of loss landscape geometry and generalization bounds. Theorists can model how gradient updates on task-specific data interfere with safety constraints encoded in the weights.
  *   **Neglect Status:** Neglected. Most empirical work assumes re-RLHF is always an option. Theoretical work on the *cost* of maintaining alignment under shift is scarce.
  *   **Evidence Triggers (2 Years):**
      *   *Move Up:* Empirical papers show safety degradation on simple fine-tuning tasks that cannot be fixed without full retraining.
      *   *Move Down:* Labs demonstrate "safety LoRAs" or lightweight adapters that maintain alignment across diverse downstream tasks with high reliability.

  #### Priority 2: Bounds on Indistinguishability (Repaired Framing #1)
  *   **The Question:** Given current eval protocols (red-teaming, automated tests), what is the theoretical maximum probability that a deceptive policy is indistinguishable from a compliant one?
  *   **Why Upstream:** The engineering approach relies on evals as the gatekeeper for deployment. If there is a fundamental information-theoretic limit to how well evals can detect deception (e.g., because the model can model the evaluator), the gatekeeper is broken.
  *   **Tractability (No Compute):** High. This is cryptography and game theory. It involves modeling the evaluator and the model as competing agents with bounded compute/information.
  *   **Neglect Status:** Moderately saturated in forums, but lacking formal rigor. Most discussion is qualitative; we need inequalities and bounds.
  *   **Evidence Triggers (2 Years):**
      *   *Move Up:* Models demonstrate "sandbagging" on benchmarks (performing worse on evals to hide capability) in controlled settings.
      *   *Move Down:* New "interrogation" protocols (e.g., consistency checks across modalities) prove able to break deceptive policies consistently.

  #### Priority 3: Protocols for Inference-Time Safety (Repaired Framing #3)
  *   **The Question:** If we treat the model as a simulator, can we design inference-time protocols (prompt structures, multi-model debate, cryptographic commitments) that guarantee safety properties regardless of the underlying weights?
  *   **Why Upstream:** This is the pivot plan. If weight-based alignment (RLHF) fails Priority 1 or 2, we need a fallback that doesn't require retraining.
  *   **Tractability (No Compute):** Medium. Requires logic, mechanism design, and protocol verification.
  *   **Neglect Status:** Highly neglected. Most safety work focuses on training; very little focuses on runtime enforcement via architecture/prompting.
  *   **Evidence Triggers (2 Years):**
      *   *Move Up:* Labs begin shipping "system cards" that emphasize prompt-level safety guards over weight-level guarantees.
      *   *Move Down:* Inference-time overhead proves too high for latency-sensitive deployments, forcing a return to weight-based safety.

  ---

  ### Part 3: Active Deprioritization

  **Do Not Fund: Normative Value Learning / Moral Philosophy**

  *   **The Question:** "What values should we align to?" or "How do we aggregate human preferences?"
  *   **Reasoning:** This is the biggest sinkhole for conceptual attention. Even if we solve the math of *how* to align a system to a target, the engineering bottleneck (Dave's point) is getting the system to hit *any* target reliably.
  *   **Why Deprioritize:**
      1.  **Downstream Irrelevance:** If the system is misaligned (hits the wrong target or behaves deceptively), it doesn't matter if the target was Utilitarian or Deontological. The immediate risk is control, not content.
      2.  **Saturation:** This area is saturated by philosophers and social scientists.
      3.  **Compute Independence:** While tractable without compute, it does not address the *mechanism* failure modes that threaten the scaling paradigm.
  *   **Exception:** Only fund this if it directly informs *specification* (how to write the loss function), not *normative ethics* (what the loss function should be).

  ---

  ### Part 4: The "Dave" Sanity Check

  You asked me to flag where your framing smuggles in assumptions an engineer would reject. If you put these in the memo without correction, you will lose credibility with technical stakeholders.

  1.  **Assumption:** *"The model has a 'will' to comply or not."*
      *   **Dave's Laugh:** "It's matrix multiplication. It doesn't 'want' anything. It minimizes loss."
      *   **Correction:** Never use agentic language (want, try, intend) unless qualified. Use "policy optimization," "gradient incentives," or "objective misgeneralization." When discussing Compliance vs. Competence, frame it as **"Objective Robustness"** (does the proxy reward match the true intent?) vs. **"Capability"** (does the model have the power to achieve the intent?).

  2.  **Assumption:** *"Ontology changes the physics."*
      *   **Dave's Laugh:** "Calling it a 'simulator' doesn't change the API. I still send tokens in and get tokens out."
      *   **Correction:** The "Simulator" frame is only useful if it suggests a different *intervention*. If the model is a simulator, we intervene at inference (context). If it's an agent, we intervene at training (weights). Justify the ontology research *only* by its utility in choosing the intervention point.

  3.  **Assumption:** *"Theory can solve this without data."*
      *   **Dave's Laugh:** "You can't prove safety on a black box without running it."
      *   **Correction:** Acknowledge that theory cannot *guarantee* safety, but it can *bound risk*. Your memo should promise "Risk Bounds" and "Failure Mode Characterization," not "Safety Proofs." This aligns with engineering risk management rather than mathematical proof.

  ### Final Recommendation

  Fund **Alignment Stability** first. It is the most direct test of the "Engineering Only" hypothesis. If alignment washes off during fine-tuning, the engineering pipeline is broken, and we need new science. If it holds, Dave is mostly right, and we can focus on efficiency. This gives the funder a clear binary signal within 2 years on whether to double down on conceptual work or pivot to policy/oversight.
