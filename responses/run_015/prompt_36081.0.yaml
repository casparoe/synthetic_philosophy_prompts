  The proposal is sound strategy rather than theatre because pre-commitment alters attacker incentives, but the pledge is unstable unless the association enforces penalties for defection that exceed the immediate cost of paying the ransom.

  Your intuition that the pledge works through the attacker's beliefs is correct: ransomware is a business model dependent on expected value, and if you successfully signal that the probability of payment is zero, the expected value of attacking you becomes negative. The objection that refusing to pay after the fact is "pointless" misunderstands the mechanism; the suffering incurred by refusing is the price of purchasing future safety for the entire group, not a remedy for the current breach. By committing publicly, you attempt to solve the time-inconsistency problem where it is rational to promise not to pay before an attack but rational to pay after one occurs.

  However, your concern about stability is the critical vulnerability. Without external enforcement, the pledge relies on individual altruism in the face of immediate financial loss, which is psychologically and economically fragile. The proposal to close for a day in solidarity is a clever mechanism to subsidize the victim's cost of resistance, making the "no pay" stance less painful and therefore more credible. Yet, secret payments remain the unraveling threat; if one member pays quietly, they gain immediate relief while free-riding on the deterrence built by others, and if attackers learn that some members pay despite the pledge, the deterrent collapses.

  To make this work, the association must transform the pledge from a promise into a contract with social consequences. Defection must be punishable by expulsion or public shaming within the local business community, creating a reputational cost that outweighs the ransom amount. In a mid-sized city, where business reputations are tightly interwoven, this social sanction can be potent enough to bind members to their word. If the attackers believe the group polices its own members as rigorously as it resists the attackers, the pre-commitment becomes credible, the attacker's model updates to reflect zero profitability, and the attacks cease. Without that enforcement mechanism, the pledge is indeed theatre that will likely crumble under the first significant pressure.
