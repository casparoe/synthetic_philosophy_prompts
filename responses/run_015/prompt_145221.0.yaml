answer: |-
  This is a sharp, well-posed research prompt. You have correctly identified that the binary "competent/incompetent" framework is breaking down under the weight of progressive neurodegenerative conditions (like FTD or Alzheimer's) where agency degrades in patches rather than all at once. Your "constitutional amendment" analogy is the strongest conceptual tool you have; it moves the debate from *whether* the past self rules to *where* the past self rules.

  However, there is a reasoning error in your setup that needs to be addressed before ranking the agenda.

  ### The Reasoning Typo
  **The Granularity Assumption.**
  You propose treating the directive as a "constitutional amendment" that binds certain domains while leaving others open. The reasoning typo is the assumption that the *earlier self* possesses the meta-cognitive granularity to draft such a constitution.
  Most advance directives are not drafted with domain-specific precision; they are drafted with *scenario-specific* hopes (e.g., "If I don't recognize my family," not "I retain authority over financial risk-assessment but cede authority over pain management"). If the earlier self lacks the capacity to distinguish these domains at the time of drafting, the "constitutional" model collapses back into the standard binary command. A research agenda based on your analogy must first solve how to *impute* domain-specificity to crude documents, or it remains a normative ideal with no traction on actual cases.

  ### The Overrated Literature
  You are correct to be skeptical of the **Ulysses Contract** literature. It is largely a dead end for your specific problem because it presupposes a temporary loss of capacity with an expectation of restoration (e.g., psychiatric crisis), or it assumes a binary switch. In progressive "patchwork" decline, the "later self" does not regain competence to ratify the contract.
  Also overrated: **Substituted Judgment.** Courts love it, but philosophically it is bankrupt in patchwork cases. It asks, "What would the prior self choose?" But if the prior self could not conceive of the later self's specific phenomenological state (e.g., being happy with dementia), the counterfactual is empty.

  ---

  ### The Research Agenda: Ranked Conceptual Problems

  Here are the three most upstream conceptual problems, ranked by their ability to unlock the others, their tractability for a philosopher without clinical access, and their potential to shift legal/clinical practice.

  #### 1. The Jurisdiction Problem (The Scope of Precedent Autonomy)
  **Definition:** Does the moral authority of the earlier self extend uniformly across all decisions, or is it domain-relative? Can the earlier self bind the later self on *medical* survival while ceding authority over *social/experiential* choices?
  **Why Rank #1 (Upstream & Impactful):**
  *   **Unlocks the Others:** You cannot solve the "Authority vs. Applicability" question (your point 1) until you define the *scope* of that authority. If authority is domain-specific, a value shift in one domain (e.g., religious belief) doesn't necessarily void authority in another (e.g., end-of-life care).
  *   **Tractability:** This is pure normative theory. You can use thought experiments involving non-medical domains (financial trusts, property rights) to test intuitions about domain-binding without needing patient data.
  *   **Clinical/Legal Shift:** This is the most actionable item. Currently, courts treat ADs as monolithic. If you can argue that ADs are *jurisdictionally limited*, you give judges a tool to uphold the directive on life-support while allowing the later self to choose their daily activities. It saves the directive from being voided entirely due to partial value drift.
  *   **Connection to your "Constitutional" Idea:** This is the rigorous grounding your analogy needs. It moves the metaphor into a normative framework.

  #### 2. The Continuity Threshold (The Metaphysics of the Patient)
  **Definition:** At what point does psychological discontinuity sever the moral tie between the earlier and later self? Is it a binary switch (Parfit's reductionism) or a sliding scale of "sufficient continuity"?
  **Why Rank #2 (Foundational but Abstract):**
  *   **Unlocks the Others:** If the later self is metaphysically a "different person," the earlier self has no authority (only beneficence applies). If they are the "same person," authority holds. This determines the stakes of Problem #1.
  *   **Tractability:** Highly tractable for a philosopher. This is classic personal identity territory (Locke, Parfit, Schechtman) applied to bioethics. You don't need empirical data; you need rigorous conceptual mapping of "narrative coherence" vs. "psychological connectedness."
  *   **Clinical/Legal Shift:** Moderate. Courts are reluctant to adopt "different person" theories because it undermines inheritance and legal responsibility. However, a "sliding scale" theory could justify a "sliding scale" of directive authority, which supports the Jurisdiction Problem.
  *   **Critique of your Point 2:** You asked about modeling authority when the later self retains narrative coherence. This problem suggests that narrative coherence might be the *wrong* metric. A patient can have a coherent narrative that is delusional. The research should focus on *critical interest continuity* rather than narrative coherence.

  #### 3. The Epistemology of Value Drift (Pathology vs. Evolution)
  **Definition:** How do we distinguish between a value change that is a *corruption* of the self (due to pathology) versus a value change that is *authentic growth* (even if unexpected)?
  **Why Rank #3 (Downstream & Difficult):**
  *   **Unlocks the Others:** This is necessary for implementation. If we solve Jurisdiction and Continuity, we still need to know when to override the later self's current wishes. If their new values are "authentic," the earlier self's directive should yield.
  *   **Tractability:** **Low.** This is the hardest problem to solve without empirical data. It requires distinguishing neurological impairment from moral revision. A philosopher alone cannot solve this; it requires collaboration with neuropsychology.
  *   **Clinical/Legal Shift:** High, but risky. If clinicians can identify "pathological value shifts," they can justifiably override current objections to ADs. But this risks paternalism.
  *   **Critique of your Point 3:** You asked about "authenticity of the moment" vs. "authenticity over a lifespan." This problem suggests that distinction is insufficient. The real question is *source* authenticity. Did this value arise from the agent's reflective capacities, or from a lesion? This is why it ranks last; it's partly an empirical question masquerading as a conceptual one.

  ### Summary of the Strategy

  1.  **Start with Jurisdiction.** Argue that precedent autonomy is not a blanket veto but a limited jurisdiction. This validates your "constitutional amendment" idea but fixes the granularity typo by arguing that jurisdiction should be *interpreted* based on the stakes, not just the text.
  2.  **Ground it in Continuity.** Use a "sliding scale" of identity to show why jurisdiction can shrink as continuity fades, without needing to declare the patient a "different person."
  3.  **Leave Value Drift for later.** Acknowledge that distinguishing pathology from growth is the "hard problem" that requires empirical partnership, and don't let it stall the normative work on Jurisdiction.

  **Final Note on Your "Constitutional" Analogy:**
  To make this stick, you must address the **Ratification Problem**. A constitutional amendment usually requires the consent of the governed. In ADs, the "governed" (the later self) often explicitly rejects the constitution. You need to argue why the earlier self's "constituent power" overrides the later self's "legislative power." The strongest argument is that the earlier self holds the *property rights* to the body, which the later self is merely inhabiting. This is controversial but philosophically defensible and would generate significant debate.
