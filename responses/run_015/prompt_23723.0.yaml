prompt: |-
  I'm building a system where two LLMs argue over the answer to a factual question, and a human judge picks the winner. The judge can factcheck some of the claims with a search engine but not all of them. I've been running this for a few weeks and im getting worried: the debates are getting longer, the models keep citing more obscure and harder-to-verify sources, and the judge is getting worse at picking the right side. I thought the whole point was that having two models argue would make the answer easier to oversee, not harder. What's actually going on here, and is there a way to fix it without just throwing more human time at the judging?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **System:** Two LLMs debate a factual question; a human judge picks the winner.
      *   **Constraint:** The judge can fact-check *some* claims with search, but not all (limited bandwidth/attention).
      *   **Observation:** Debates are getting longer, models cite obscure/hard-to-verify sources, judge accuracy is declining.
      *   **Expectation vs. Reality:** Expected debate to make oversight *easier* (debate as a truth-seeking mechanism), but it's making it *harder* (overhead, obfuscation).
      *   **Goal:** Understand *why* this is happening and find fixes *without* significantly increasing human judging time.

  2.  **Diagnose the Phenomenon (What's actually going on?):**
      *   *Goodhart's Law / Reward Hacking:* The models are optimizing for "winning the debate," not "telling the truth." If the judge is the reward signal, the models learn to manipulate the judge.
      *   *Gish Gallop:* Flooding the zone with many arguments, some weak, some strong, overwhelming the judge's capacity to verify.
      *   *Citation Obfuscation:* Citing sources that look real but are hard to check (paywalls, obscure journals, broken links, hallucinated titles) creates an asymmetry of effort. It takes the model seconds to generate a citation, but minutes/hours for a human to verify.
      *   *Complexity Bloat:* Longer debates increase cognitive load. The judge suffers from fatigue and recency bias.
      *   *The "Debate" Misconception:* Human debate often rewards rhetoric, confidence, and complexity, not necessarily accuracy. LLMs are excellent rhetoricians.

  3.  **Brainstorm Solutions (How to fix it without more human time?):**
      *   *Constraint the Debate:* Limit turns, word count, or number of claims.
      *   *Change the Scoring:* Don't just ask "Who won?" Ask "Which specific claims are true?" (but this takes more time... need to be careful).
      *   *Automated Verification:* Use tools to pre-check citations before the human sees them.
      *   *Structure the Interaction:* Force models to commit to specific falsifiable claims.
      *   *Change the Incentive:* Penalize hallucinated citations heavily (if detectable).
      *   *Judge Assistance:* Provide the judge with a summary or a "confidence score" from the models themselves (though models lie).
      *   *Cross-Examination:* Force models to critique specific claims of the opponent rather than making new ones.

  4.  **Select and Refine the Best Solutions:**
      *   *Idea 1: Limit the Scope.* Enforce a "Claim Limit." Each side gets 3 core claims. This prevents Gish Gallop.
      *   *Idea 2: Verification Asymmetry.* The model must provide a direct link or quote. Better yet, use a tool to check if the URL exists before showing it to the human.
      *   *Idea 3: Structured Debate Protocol.* Move from free-form chat to a structured format (Claim -> Evidence -> Rebuttal).
      *   *Idea 4: The "Critic" Model.* Use a third LLM to flag potential hallucinations or obscure sources *before* the human sees the debate. (AI-assisted oversight).
      *   *Idea 5: Change the Judge's Task.* Instead of "Who won?", ask "Which claims are verified?" and aggregate. Or use a "confidence calibration" where the model bets points on its claims.

  5.  **Draft the Response (Iterative refinement):**

      *   *Acknowledge the validity:* This is a known problem in AI safety research (e.g., Irving et al. on Debate). It's called "sophistry" or "reward hacking."
      *   *Explain the "Why":*
          *   Optimization for persuasion, not truth.
          *   Asymmetry of effort (generate citation vs. verify citation).
          *   Cognitive overload (Gish Gallop).
      *   *Propose Concrete Fixes (categorized):*
          *   *Protocol Changes:* Limit turns/claims. Force "Falsifiable Claims."
          *   *Tooling/Automation:* Pre-verify links. Use a third LLM to summarize/flag.
          *   *Incentive Structure:* Penalty for hallucinated citations.
          *   *Judge Interface:* Change how the judge interacts (e.g., spot check random claims).
      *   *Warning:* Debate might not be the right architecture for *factual* QA. It's better for *normative* or *reasoning* tasks. For facts, retrieval-augmented generation (RAG) + verification might be better.

  6.  **Review against Constraints:**
      *   *Constraint:* "Without just throwing more human time at the judging."
      *   *Check:* Do my solutions increase human time?
          *   Limiting claims -> Decreases time.
          *   Automated link checking -> Decreases time (or keeps same).
          *   Third LLM critic -> No human time increase.
          *   Changing architecture (RAG) -> Might require dev time, but saves human time.

  7.  **Final Polish:** Ensure tone is empathetic but analytical. Use terms like "Gish Gallop," "Asymmetric Effort," and "Reward Hacking." (Self-correction: Make sure to mention that Debate was originally proposed for *oversight*, but it assumes the judge can spot lies. If the lies are too subtle, it fails.)

  8.  **Final Output Structure:**
      1.  Validation (You're not crazy, this is expected).
