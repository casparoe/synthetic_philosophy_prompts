prompt: |-
  I am presenting my paper, "Moral Translation and Pragmatic Convergence: A Quinean Model of Cross-Cultural Evaluation," at a philosophy department colloquium next Thursday. My central claim is that moral disagreements between radically different linguistic communities are best understood not as conflicts over a shared domain of moral facts, but as instances of Quinean indeterminacy of translation applied to normative vocabularies: each community embeds its values in a holistic manual of social coordination that is underdetermined by behavioural evidence. I argue that moral values should therefore be treated as regulative postulates—analogous to Quine's treatment of mathematical entities—whose warrant lies not in correspondence to an independent moral reality, but in their predictive utility for stabilising cooperative behaviour across contexts. I further propose that cross-cultural moral criticism should be reconceived as a pragmatic comparison of coordination stability rather than as truth-tracking evaluation.

  The audience will be about twenty faculty and postgraduate students: half are moral realists (including two non-naturalists who defend irreducible normative properties), three are specialists in Quine's philosophy who regard his occasional remarks on ethics as underdeveloped and possibly inconsistent with his naturalism, two applied ethicists concerned with human rights discourse, and the remainder are general analytic philosophers with little patience for relativism. They will have read only the abstract.

  Prepare my Q&A defence sheet. I want the objections ordered by how damaging they are likely to be in this room, not in the abstract. For each objection, phrase it exactly as that particular audience member would put it—use the vocabulary they favour (e.g., normative properties, ontological commitment, regulative fiction, moral knowledge). Indicate what I should concede upfront, what I must hold, and provide a concise reply suitable for about two minutes of speaking time, with an explicit note on where that reply is weakest. Include the one question I am hoping nobody asks—specifically, the objection that exposes the tension between my use of Quine's indeterminacy thesis and my reliance on a shared pragmatic criterion of predictive stability that seems to presuppose precisely the kind of cross-framework comparability that Quine's holism denies.

  Please write the answer in British English, with formal academic phrasing appropriate for a seminar preparation document. Do not include bibliographies, reading lists, or citations.
