answer: |-
  # Q&A Defence Sheet: Moral Translation and Pragmatic Convergence

  **Prepared for:** Departmental Colloquium
  **Date:** Next Thursday
  **Audience Profile:** 10 Moral Realists (2 Non-Naturalists), 3 Quine Specialists, 2 Applied Ethicists, 5 General Analytic Philosophers.

  **Strategic Note:** The objections below are ordered by the potential damage they pose to the coherence of the project *in this specific room*. The primary threat comes from the Quine specialists, whose technical expertise can expose internal inconsistencies in the application of the indeterminacy thesis. The secondary threat comes from the moral realists, who may argue the view eliminates normativity entirely.

  ---

  ### Objection 1: The Quinean Internal Consistency Challenge
  **Likely Source:** Quine Specialist (one of the three)
  **Damage Level:** Critical (This is the question you hope nobody asks)

  **The Question:**
  "You rely heavily on Quine's indeterminacy of translation to dissolve moral facts. However, to compare the 'coordination stability' of different moral manuals, you presuppose a shared pragmatic metric of predictive utility. Does this not violate Quine's own holism? If translation is radically indeterminate, on what basis do you claim your pragmatic criterion is not itself just another local manual, underdetermined by evidence? Are you not smuggling in a trans-theoretic standard of rationality that Quine's naturalism explicitly forbids?"

  **Strategy:**
  *   **Concede:** Acknowledge that the pragmatic metric is not 'absolute' or 'God's-eye'.
  *   **Hold:** Maintain that the metric is immanent to our best scientific theory of the world, which is the only tribunal we have.
  *   **Reply:**
      "That is the central tension of naturalised epistemology, and I grant the force of it. However, we must distinguish between *radical* translation, where no prior theory is shared, and *domestic* evaluation, where we operate within our best current theory of the world. Quine does not deny that we can compare theories from within our own web of belief; he denies we can do so from outside all webs.
      My claim is not that 'stability' is a transcendent truth. Rather, it is a posit within our best naturalistic understanding of human social behaviour. When we evaluate another moral manual, we are not stepping outside our skin; we are testing how well their posits map onto our posits regarding cooperative survival. The metric is not absolute, but it is not arbitrary—it is constrained by the same empirical underdetermination that constrains physics. We choose the manual that best streamlines our overall theory of the world. To ask for a justification of that standard beyond the standard itself is to ask for a first philosophy Quine rightly rejected."
  *   **Weakest Point:** This reply risks circularity. If the Quinean presses that our *own* concept of 'stability' might be indeterminate relative to theirs, you have no non-question-begging response. Be prepared to accept that this is a 'virtuous circle' of naturalism, not a logical proof.

  ---

  ### Objection 2: The Loss of Normative Authority
  **Likely Source:** Non-Naturalist Moral Realist (one of the two)
  **Damage Level:** High

  **The Question:**
  "If moral values are merely regulative postulates akin to mathematical entities, warranted only by their utility in stabilising cooperation, you have eliminated the ontological commitment required for genuine normativity. You offer an explanation of moral *belief*, but not of moral *knowledge*. How can a 'useful fiction' generate the categorical reasons that moral experience presents us with? You seem to be offering an error theory disguised as pragmatism."

  **Strategy:**
  *   **Concede:** Deny the existence of irreducible normative properties.
  *   **Hold:** Redefine 'normativity' as the internal pressure of a successful social technology.
  *   **Reply:**
      "I do concede that on my view, there are no irreducible normative properties waiting to be discovered. However, I reject the premise that categorical reasons require non-natural ontology. The 'authority' of a moral claim is not a metaphysical glow; it is the functional role that claim plays in regulating behaviour within a community.
      Consider the mathematical entities you accept. We do not say numbers are 'fictions' simply because they are posits; we say they are indispensable to our best theory. Similarly, moral values are indispensable to our best theory of social coordination. The 'categorical' feel of morality is the phenomenological experience of encountering a deeply entrenched regulative postulate. We need not posit a queer normative reality to explain why we feel bound by these rules; the binding force is the cost of social discoordination. This is not an error theory; it is a naturalistic reconstruction of what normativity *is*."
  *   **Weakest Point:** This may not satisfy the non-naturalist's intuition about the 'ought'. They may view this as changing the subject rather than answering the question of moral obligation.

  ---

  ### Objection 3: The Human Rights Vulnerability
  **Likely Source:** Applied Ethicist (concerned with human rights discourse)
  **Damage Level:** Medium-High (Practical/Political damage)

  **The Question:**
  "Your model treats human rights discourse as a tool for coordination stability. But historically, oppressive regimes have often been highly 'stable'. If moral criticism is just a pragmatic comparison of coordination, does your view not imply that a stable slave-owning society is morally comparable to a stable liberal democracy? This seems to disarm the very critical power human rights advocates require."

  **Strategy:**
  *   **Concede:** Stability alone is insufficient; the *scope* of coordination matters.
  *   **Hold:** Argue that liberal rights offer superior long-term predictive utility and adaptability.
  *   **Reply:**
      "That is a crucial practical objection. However, 'stability' in my model is not merely the absence of conflict; it is the robustness of cooperation under changing empirical conditions. A slave-owning society may be stable in the short term, but it relies on the suppression of information and the coercion of a significant portion of the population.
      My argument is that rights-based frameworks possess greater *adaptive utility*. They allow for more efficient information processing and conflict resolution without violence. When we criticise an oppressive regime, we are not appealing to a metaphysical right; we are pointing out that their manual of social coordination is pragmatically inferior—it is brittle, requires excessive enforcement costs, and fails to predict human needs accurately. We can condemn oppression without metaphysical realism by demonstrating its pragmatic inefficiency."
  *   **Weakest Point:** If the oppressor's system is empirically stable over the long term, your view struggles to condemn it. You are vulnerable to the 'successful tyranny' counter-example.

  ---

  ### Objection 4: The Relativism Charge
  **Likely Source:** General Analytic Philosopher (impatient with relativism)
  **Damage Level:** Medium

  **The Question:**
  "Let us be plain. If moral truth is determined by the utility of a manual within a specific linguistic community, are you not simply a relativist? If two communities have different coordination needs, do they simply have different 'truths'? This renders rational moral adjudication between cultures impossible."

  **Strategy:**
  *   **Concede:** Reject the label of 'relativism' in favour of 'pragmatic objectivity'.
  *   **Hold:** Maintain that cross-cultural translation allows for sufficient overlap to adjudicate.
  *   **Reply:**
      "I am not a relativist if by that one means that all manuals are equally valid. I am a pluralist about the *grounds* of validity, but an objectivist about the *assessment*. We can translate between manuals sufficiently to compare their predictive success.
      Quine's indeterminacy does not entail that *anything goes*; it entails that there is no single unique manual. However, some manuals are empirically better than others at managing the stimuli we all share as biological organisms. Because we share a common human biology and a common physical environment, our manuals must converge on certain core predictions to function at all. Rational adjudication is possible not by appealing to a shared moral reality, but by appealing to shared empirical constraints on social survival. We can argue that one manual works better, even if we cannot prove it is 'True' with a capital T."
  *   **Weakest Point:** The distinction between 'pragmatic objectivity' and 'relativism' may strike this audience as verbal hair-splitting. Keep the focus on *empirical constraints* to avoid sounding like you are dodging the truth claim.

  ---

  ### General Preparation Notes

  *   **Tone:** Maintain a naturalistic, scientific demeanour. Avoid apologetic language when denying moral facts; frame it as a theoretical advancement akin to the shift from Newtonian to Einsteinian physics.
  *   **Quine Terminology:** Ensure you use "posits," "web of belief," "empirical content," and "regulative" precisely. The specialists will be listening for sloppiness here.
  *   **Time Management:** If the Quinean objection (Objection 1) arises, do not rush it. It is the pivot point of the entire paper. It is better to spend your allotted time on this than to rush through the applied ethics points.
  *   **Closing:** If pressed on the "Hope Nobody Asks" tension, reiterate that naturalism accepts circularity if the circle is wide enough to encompass all empirical evidence. Do not attempt to find an Archimedean point; deny that one is needed.
