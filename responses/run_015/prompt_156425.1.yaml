  2.  **Deconstruct the Sentence:** "A person is a person through other persons." (Ubuntu/*Botho* maxim).
      *   *Core ambiguity:* What does "is a person" mean? (Ontological status? Moral standing? Social recognition?) What does "through" mean? (Causal origin? Constitutive requirement? Epistemic access?) What does "other persons" mean? (Actual interaction? Potential? Community membership?)

