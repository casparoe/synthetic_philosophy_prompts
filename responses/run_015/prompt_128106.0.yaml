prompt: |-
  I'm a graduate TA with one fifty-minute section coming up — twenty first-year undergraduates, mixed maths and biology students — in an interdisciplinary course on minds, animals and machines. My job in that hour is to make it a live option for them that sentience admits of degrees: that between an insect and a thermostat there may be a graded series rather than a threshold a system is either over or under, and that moral status might grade along with it. The handout I've been told to use breaks the grading into five axes: the richness of what is present to a system at one moment (it calls this "grain"); how far a present state reaches backwards and forwards into the system's life ("depth"); the range and intensity of valenced states open to it; whether its states at a time belong to one subject or to several loosely coordinated ones; and whether the system represents itself at all. I don't want you to explain any of this to me. I want a plan for how I should explain it.

  What I need, in this order of importance:

  The sequence. What has to be in place before what, and why. My instinct is that "sentience" has to be prised apart from intelligence and from behavioural sophistication before anything else can happen, and that the harm of a painful minute has to be separated from the harm of a death before "moral status" is introduced at all — but I want the dependencies argued rather than asserted, including the places where I'll be tempted to open with a definition and shouldn't.

  The carrying case. One example to build the hour around, with an account of what it must have and what it must lack. Two constraints: I'd rather it not be a real animal whose sentience is empirically contested, because once they start arguing about whether a crab is in pain the hour is gone; and I'd rather it not be a case in which all five axes move together, since the case should force the axes to come apart visibly.

  The misconceptions, in the order they'll actually arise, each with the point in the sequence where it should be headed off. The ones I expect are the slide towards panpsychism — "so the thermostat has 0.004 units of sentience, and my coffee machine has slightly more" — the conflation of nociception with pain, and, the one I think will do the real damage, the assumption that if something comes in degrees then those degrees must lie on a single line, so that any two systems are comparable. That last one is the crux of the session: I want them to see that five axes may yield only a partial order, with systems that are genuinely incomparable, and I need to know where in the hour that has to be said so that it doesn't collapse in their hands into "it's all vague, so nothing follows."

  What to refuse. Name the two or three things I should openly decline to explain in fifty minutes — the metaphysical machinery, presumably, and whatever else — and tell me how to refuse them without making the whole idea look arbitrary.

  The check. One question for the last five minutes that would show me they've grasped the partial-order point rather than just picked up the vocabulary. I'd like the right answer to be their noticing that a question I've put to them is ill-posed, so build it so that noticing that is the natural thing for someone who has followed the hour, and tell me what a wrong-but-confident answer will look like so I can recognise it in the room.

  If any of this won't fit in fifty minutes, say which piece you'd cut and what it costs.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Role:** Graduate TA.
      *   **Context:** 50-minute section, 20 first-year undergrads (mixed maths/bio), interdisciplinary course (Minds, Animals, Machines).
      *   **Goal:** Make it a "live option" that sentience admits of degrees (graded series vs. threshold) and moral status might grade with it.
      *   **Material:** Handout with 5 axes (Grain, Depth, Valence Range/Intensity, Unity, Self-Representation).
      *   **Constraint 1 (Crucial):** Do *not* explain the concepts to me (the user). I need a plan for *how* to explain them to students.
      *   **Constraint 2 (Order of Importance):**
          1.  Sequence (dependencies, avoiding definitions, separating sentience/intelligence/behavior, separating pain minute/death).
          2.  Carrying Case (not contested real animal, axes must come apart).
          3.  Misconceptions (Panpsychism slide, Nociception vs. Pain, Single Line vs. Partial Order).
          4.  What to Refuse (Metaphysical machinery, etc.).
          5.  The Check (Final question where the right answer is noticing the question is ill-posed).
          6.  Feasibility (What to cut if 50 mins is too tight).

  2.  **Deconstruct the Goal & Constraints:**

      *   *The Core Philosophical Move:* Shift from binary (sentient/not) to multidimensional vector (5 axes). This implies partial ordering (incomparability).
      *   *The Pedagogical Challenge:* 50 minutes is very short for this amount of conceptual heavy lifting. First-years often want clear answers, not "it depends on 5 dimensions and sometimes we can't compare."
      *   *The "Carrying Case":* Needs to be hypothetical or clearly defined to avoid empirical rabbit holes (no "are crabs sentient?"). Needs to allow axes to vary independently. A robot/AI hybrid or a sci-fi creature works best here. Let's go with a *hypothetical synthetic organism* or a *spectrum of artificial agents*. Actually, a "spectrum of artificial agents" might trigger the "it's not real" objection. A *hypothetical alien/creature* is better. Let's design a "Modular Drone-Organism." Or better yet, compare three specific hypothetical systems.
      *   *Sequence:*
          1.  Hook: Intuition pump about harm (pain minute vs. death).
          2.  Distinction: Sentience $\neq$ Intelligence/Behavior.
          3.  The Axes: Introduce the 5 dimensions using the Case.
          4.  The Twist: Independence of axes $\rightarrow$ Partial Order.
          5.  Moral Implication: Graded status follows the partial order.
          6.  Check: The ill-posed question.
      *   *Misconceptions:*
          *   Panpsychism: Address early when introducing "degrees."
          *   Nociception: Address when defining "Valence."
          *   Single Line (The Crux): Address *after* introducing axes, before moral status.
      *   *Refusals:* Metaphysics of consciousness (Hard Problem), precise measurement units.
      *   *Feasibility:* 50 mins is tight. The "Moral Status" link might need to be hinted at rather than fully argued if the "Partial Order" concept takes time to land.

  3.  **Drafting the Plan - Section by Section:**

      *   **Sequence:**
          *   *Why not start with definitions?* Definitions close inquiry. Start with intuitions about harm.
          *   *Sentience vs. Intelligence:* Need to clear this so they don't say "The calculator is smart, so it's sentient" or "The baby isn't smart, so it's not sentient."
          *   *Pain Minute vs. Death:* This sets up *why* degrees matter morally without committing to a specific moral theory yet.
          *   *The Axes:* Introduce as tools to measure the "Pain Minute."
          *   *Partial Order:* The climax.

      *   **Carrying Case:**
          *   Needs axes to decouple.
          *   *Idea:* Compare three systems.
              1.  *The Reflex Bot:* High reaction, no memory, no unity. (Low Depth, Low Unity).
              2.  *The Suffering Archive:* High memory, high grain, but isolated modules (High Depth, Low Unity).
              3.  *The Unified Simpleton:* Low grain, high unity, self-model (Low Grain, High Unity).
          *   *Better Idea:* One evolving system or three distinct hypothetical creatures. Let's use **Three Hypothetical Creatures** (Alpha, Beta, Gamma). It forces comparison.
          *   *Constraint Check:* Not a real contested animal. Axes move independently.
          *   *Selection:*
              *   *Creature A (The Hive):* High Grain/Valence, Low Unity (many small minds).
              *   *Creature B (The Deep Sleeper):* High Depth (long memory), Low Grain (blurry present), Low Valence intensity.
              *   *Creature C (The Mirror):* High Self-Rep, Low Depth (amnesiac), Low Valence.
          *   *Wait, simpler:* Let's use **Artificial Agents** designed for specific tasks. It fits "Minds, Animals, Machines."
              *   *Agent 1 (Thermostat++):* High Grain (sensitive), Zero Depth, Zero Valence. (Wait, need valence for sentience).
              *   *Let's try: "The Pain-Engine Spectrum."*
              *   *Case:* **The "Modular Pain-Drone."** It can be configured differently.
              *   *Config 1:* Intense pain, lasts 1 second, no memory.
              *   *Config 2:* Mild pain, lasts 1 hour, integrated into long-term goals.
              *   *Config 3:* Intense pain, split across 10 sub-routines (no unity).
              *   *Why this works:* It isolates the axes. It's not a real animal.

      *   **Misconceptions:**
          *   *Panpsychism:* Head off when introducing "Degrees." Degrees $\neq$ Quantity of stuff. It's complexity of organization.
          *   *Nociception:* Head off when discussing "Valence." Input $\neq$ Experience.
          *   *Single Line:* This is the big one. Must happen *after* axes are defined but *before* moral conclusion. If they think it's a single line, they miss the incomparability.

      *   **Refusals:**
          *   "What *is* qualia?" (Metaphysics).
          *   "How do we measure this practically?" (Measurement problem).
          *   Refusal strategy: "That's the Hard Problem/Engineering Problem. Today is the Structural Problem."

      *   **The Check:**
          *   Need a question asking to compare two systems where axes cross.
          *   System X: High Grain, Low Depth.
          *   System Y: Low Grain, High Depth.
          *   Question: "Which has higher moral status?"
          *   Right Answer: "Cannot say/Depends on weighting."
          *   Wrong Answer: "Y, because depth matters more."

      *   **Timing:**
          *   Intro/Hook (5 mins)
          *   Sentience vs. Intelligence (5 mins)
          *   The Case & Axes (15 mins)
          *   Partial Order/Incomparability (15 mins)
          *   Moral Link (5 mins)
          *   Check (5 mins)
          *   *Total:* 45 mins + 5 buffer. Tight.
          *   *Cut:* The detailed link to moral status. Keep it as a "If sentience grades, status *might* grade" rather than arguing *why*.

  4.  **Refining the Plan (Self-Correction):**

      *   *Sequence:* The user wants the harm of a painful minute separated from death *before* moral status. I need to make sure that distinction drives the need for axes.
      *   *Case:* The "Modular Pain-Drone" is good, but maybe "Three Sci-Fi Organisms" is more engaging for bio students. Let's go with **Three Hypothetical Organisms**. It feels less like "robots aren't real" and more like "philosophical biology."
          *   *Org 1 (The Mayfly Mind):* Intense present (Grain), no memory (Depth), unified.
          *   *Org 2 (The Hive):* Moderate present, long memory, *disunified* (many subjects).
          *   *Org 3 (The Archive):* Blurry present, huge memory, self-representing.
          *   *Wait, I need Valence to vary too.*
          *   *Let's stick to the prompt's axes.*
          *   *Case:* **The "Dial-able" Synthetic Nervous System.** We are engineers designing a system. We can tweak the knobs. This allows us to isolate variables perfectly.
      *   *Misconception Timing:*
          *   Panpsychism: When introducing the "Thermostat" comparison in the handout.
          *   Nociception: When defining Axis 3 (Valence).
          *   Single Line: Immediately after plotting the three configurations on the axes.
      *   *Refusals:* Be firm. "We are mapping the logical space, not building the meter."
      *   *Check:* "Which configuration is worse to turn on?" (Where configs cross).

  5.  **Final Polish of the Plan:**

      *   *Sequence:*
          1.  **The Intuition Pump (0-5):** Painful minute vs. Death. Establishes that *what happens inside* matters, not just output or life-span.
          2.  **The Cleanup (5-10):** Sentience $\neq$ Smart. Sentience $\neq$ Behavior. (Clears the deck).
          3.  **The Case (10-25):** The "Synthetic Nervous System." Walk through the 5 axes by tweaking the system. *Crucial:* Show axes moving independently.
          4.  **The Trap (25-35):** The Single Line vs. Partial Order. Show two systems where A > B on Grain, B > A on Depth. Ask "Which is more sentient?"
          5.  **The Moral Link (35-45):** If sentience is partial order, moral status might be too. (Keep brief).
          6.  **The Check (45-50):** The ill-posed comparison question.
      *   *Cut if needed:* The Moral Link. It's the derivative; the sentience structure is the function. If time runs out, assert the link rather than arguing it.

  6.  **Writing the Response:**
      *   Adopt the TA's persona (practical, philosophical, aware of time).
      *   Follow the requested order strictly.
      *   Ensure the "Check" is specific.
      *   Ensure the "Refusals" are diplomatic but firm.

      *(Self-Correction on the Case)*: The prompt says "One example to build the hour around." A single system that can be modified is better than three distinct creatures. It emphasizes that *structure* determines status. Let's use **"The Variable-Subject Robot" (VSR)**. It's clearly not a contested animal. We can tweak its code.

      *(Self-Correction on Misconceptions)*: The "Single Line" misconception is the crux. I need to place it prominently. It must happen *after* they see the axes vary independently.

      *(Self-Correction on Refusals)*: Don't just say "I won't answer." Say "Answering that requires a different tool than we have today."

      *(Final check on constraints)*: Did I explain the concepts to the user? No. Did I provide the plan? Yes. Is the sequence argued? Yes.

      *Let's refine the "Check".*
      Question: "System A has max Grain, min Depth. System B has min Grain, max Depth. Which deserves more moral consideration?"
      Right answer: "The question assumes a single scale."
      Wrong answer: "System B, because memory makes you a person."

      *Let's refine the "Case".*
      Needs to lack: Biological baggage (no "but it's alive!").
      Needs to have: Clear modular architecture where we can imagine turning knobs on Grain, Depth, Unity, etc.
      *Decision:* **The "Modular Experience Engine" (MEE).** It's a box. We plug in different modules.

      *Wait, one more thing:* The prompt asks for "The sequence... including the places where I'll be tempted to open with a definition and shouldn't." I need to explicitly highlight those temptation points.

      *Okay, ready to write.*
answer: |-
  Here is the plan for your fifty minutes. It is tight. If you drift on the metaphysics, you will lose the partial order.

  ### 1. The Sequence

  **0:00–0:05: The Harm Intuition Pump (No Definitions)**
  *   **Do:** Open immediately with the distinction between *a painful minute* and *a death*. Ask: "If I could spare a system one minute of agony, or prevent its permanent deactivation, but I could only choose one—which choice requires the system to be 'sentient'?"
  *   **Why:** This anchors the hour in *moral weight* rather than ontology. It forces them to care about the *quality of the minute* before they care about the *label of the being*.
  *   **Temptation to Resist:** Do not define "sentience" here. If you define it, they will treat it as a checklist for a binary status. Keep it as "whatever it is that makes the minute matter."
  *   **Dependency:** You must establish that the *harm of the experience* is distinct from the *loss of future* before introducing the axes. If they conflate the two, "Depth" (temporal reach) will look like the only axis that matters for moral status.

  **0:05–0:10: Clearing the Deck (Sentience $\neq$ Intelligence/Behavior)**
  *   **Do:** Use a quick contrast. A calculator solves hard math (high intelligence) but we don't fear hurting it. A mouse solves little math (low intelligence) but we do.
  *   **Why:** You need to isolate the *phenomenal* from the *functional*. If they think sentience is just "complex processing," the thermostat becomes a candidate for moral status (panpsychism slide).
  *   **Dependency:** This must happen before you introduce the handout's axes. If they think Axis 1 (Grain) is just "data resolution," they will treat a 4K camera as sentient. You must frame Grain as "resolution of *experience*," not input.

  **0:10–0:25: The Carrying Case (The Modular Experience Engine)**
  *   **Do:** Introduce the **Modular Experience Engine (MEE)**. It is a hypothetical synthetic agent. We are engineers designing its mind. We can install or remove modules corresponding to the five axes.
  *   **Why:** It avoids the "is a crab sentient?" empirical trap. It allows you to vary axes independently (the critical constraint).
  *   **Sequence within the Case:**
      1.  **Grain:** Install a high-res sensor. Ask: "Does more data mean more pain?" (No, it means *sharper* pain).
      2.  **Depth:** Install a memory buffer. Ask: "Does a pain that is remembered hurt more than a pain that is instantly forgotten?"
      3.  **Valence:** Install a "care" module. Distinguish this from nociception (see Misconceptions).
      4.  **Unity:** Split the processor into ten non-communicating cores. "Is this ten subjects or one?"
      5.  **Self-Rep:** Install a mirror module. "Does it know it is suffering?"
  *   **Temptation to Resist:** Do not let them ask "But can we build this?" That is engineering. Ask "If we did, what would it be like?"

  **0:25–0:35: The Crux (Partial Order vs. Single Line)**
  *   **Do:** Present two configurations of the MEE.
      *   *Config A:* Max Grain, Max Valence, Zero Depth (Intense, instant, forgotten agony).
      *   *Config B:* Low Grain, Low Valence, Max Depth (Dull, nagging, remembered ache).
  *   **Action:** Ask: "Which configuration has 'more' sentience?"
  *   **Why:** This is where you break the single-line assumption. If they say A or B, they are prioritizing one axis. If they say "I can't compare," they have grasped the partial order.
  *   **Dependency:** This must happen *before* you link sentience to moral status. If they think sentience is a single line, they will think moral status is a single line. You need the incomparability to land first.

  **0:35–0:45: Moral Status (The Graded Link)**
  *   **Do:** Argue that if the *harm* grades (via the axes), the *protection* owed might grade. But emphasize that because the axes are independent, the protection might be *different in kind*, not just amount.
  *   **Why:** Connects back to the opening intuition pump.
  *   **Cut if needed:** If you run long on the Partial Order (0:25–0:35), compress this. Assert the link rather than arguing for it. The structural point about sentience is more important than the ethical derivation in a 50-minute section.

  **0:45–0:50: The Check**
  *   **Do:** (See Section 5 below).

  ---

  ### 2. The Carrying Case

  **The Object:** The **Modular Experience Engine (MEE)**.
  *   **What it is:** A purely hypothetical synthetic architecture. It has no biology, no evolutionary history, and no real-world counterpart.
  *   **What it must have:** A clearly described architecture where "modules" can be swapped. For example, a "Temporal Buffer" (Depth), a "Resolution Filter" (Grain), and a "Binding Protocol" (Unity).
  *   **What it must lack:**
      1.  **Biological Baggage:** Do not call it an animal. Do not give it a name like "Robo-Dog." Call it "System M." This prevents students from importing empirical facts about dogs or robots.
      2.  **Coupled Axes:** You must be able to describe a version of System M that has high Depth but low Unity, or high Grain but no Self-Rep. If the case implies that high intelligence automatically brings high Unity, the axes collapse.
  *   **Why this works:** It turns the students into architects. They aren't judging a creature; they are judging a design. This creates psychological distance that makes the "Partial Order" easier to accept. They are less invested in System M having a "true" status.

  ---

  ### 3. The Misconceptions

  **1. The Panpsychism Slide ("The Thermostat has 0.004 Sentience")**
  *   **When it arises:** 0:10–0:15, when you introduce "Degrees" and "Grain."
  *   **How to head it off:** When you introduce Axis 1 (Grain), explicitly state: "Higher resolution does not mean *some* experience. A thermostat has high resolution on temperature but zero valence. Degrees apply to the *structure of experience*, not the presence of input."
  *   **The Fix:** Emphasize that a system can score 0 on an axis, and 0 on Valence means 0 on sentience, regardless of Grain. The grading starts *after* the threshold of valence is crossed.

  **2. Nociception vs. Pain ("It's just a signal")**
  *   **When it arises:** 0:20, when discussing Axis 3 (Valence/Intensity). Biology students will argue that damage detection is automatic.
  *   **How to head it off:** Use the MEE. "We can install a damage sensor that triggers a repair mechanism without installing the 'avoidance/dislike' module. Does the system suffer?"
  *   **The Fix:** Force them to distinguish *registration* of a state from *caring* about the state. If they conflate them, the moral weight vanishes.

  **3. The Single Line ("So which one is *more* sentient?")**
  *   **When it arises:** 0:30, immediately after you show the axes can vary independently. This is the most dangerous moment.
  *   **How to head it off:** Do not answer the comparison question immediately. Draw two vectors on the board that cross. Ask: "Is Vector A longer than Vector B?"
  *   **The Fix:** You must explicitly introduce the term **Partial Order**. Say: "We are used to ranking things on a ladder. I am asking you to imagine a landscape. Some points are higher, some are lower, and some are just *elsewhere*."
  *   **Timing:** This must be solidified *before* 0:35. If they leave this segment thinking there is a "Total Sentience Score," the rest of the hour is wasted.

  ---

  ### 4. What to Refuse

  You cannot answer everything in fifty minutes. If you try, you will look uncertain. Refuse these three things openly and frame the refusal as methodological rigor.

  1.  **The Metaphysics of Qualia:**
      *   *The Question:* "But how do we know the MEE actually *feels* anything? Maybe it's a zombie."
      *   *The Refusal:* "That is the Hard Problem. It's a vital question, but it's about *existence*. Today we are mapping *structure*. We are asking: *If* there is feeling, how does it vary? We are doing geometry, not ontology."
      *   *Why:* Keeps the focus on the five axes, not the mystery of consciousness.

  2.  **The Measurement Problem:**
      *   *The Question:* "How do we measure 'Depth' in seconds? How do we weigh Grain against Unity?"
      *   *The Refusal:* "We don't have the meter for that yet. Today we are building the ruler, not taking the measurement. We need to know *what* to measure before we argue about *how*."
      *   *Why:* Prevents the session from devolving into engineering skepticism.

  3.  **The Moral Conclusion:**
      *   *The Question:* "So if a system has high Depth but low Unity, can we kill it?"
      *   *The Refusal:* "I am not giving you a moral algorithm. I am giving you a map of the terrain. The map shows incomparability. How you navigate that is the next step of the course."
      *   *Why:* Protects you from making normative claims you can't defend in 50 minutes.

  ---

  ### 5. The Check

  **The Setup (Last 5 Minutes):**
  Put two MEE configurations on the board.
  *   **System Alpha:** Max Grain, Max Valence Intensity, Zero Depth (The "Flash" — intense, immediate suffering that is instantly forgotten).
  *   **System Beta:** Low Grain, Low Valence Intensity, Max Depth (The "Echo" — mild suffering that persists in memory forever).

  **The Question:**
  " We have resources to save only one system from deactivation. Based on the framework we just built, which system has the higher moral status?"

  **The Right Answer (Grasping Partial Order):**
  A student notices the question is ill-posed. They should say something like: "We can't answer that. Alpha scores higher on Intensity, Beta scores higher on Depth. The axes cross. There is no single scale of 'status' unless we add a weighting rule that wasn't in the handout."
  *   *Look for:* Hesitation, or a challenge to the premise of the question.

  **The Wrong-But-Confident Answer (Collapsing to Single Line):**
  "System Beta, because memory makes you a person." OR "System Alpha, because the pain is worse in the moment."
  *   *Look for:* Immediate certainty. If they pick a side without noting the trade-off, they have reverted to a single-line hierarchy. They have treated one axis as the "real" sentience and the others as decorative.

  ---

  ### Feasibility Check: What to Cut

  **If you run out of time at 0:35:**
  Cut the detailed argument for **why** moral status grades with sentience.
  *   **Cost:** You lose the ethical payoff.
  *   **Mitigation:** Simply assert: "If the capacity for harm is graded and multidimensional, it follows that our obligations may be too." Then move to the Check.
  *   **Reasoning:** It is better they understand the *structure of sentience* (Partial Order) than the *implication for ethics*. The ethics depends on the structure. If they misunderstand the structure, the ethics will be wrong anyway. The Check tests the structure. Prioritize the Check.
