  Based on the logic chain Maya has established, here is the breakdown of her verdict, the underlying rule structure, and the hidden principles at play.

  ### 1. The Verdict: **Corrupted**
  Maya will almost certainly classify this sprite as **Corrupted**.

  Here is the decision tree based on her stated precedents:
  *   **The Missing Pixels (23):** This falls in the grey zone between "5 clustered (Original)" and "50 scattered (Corrupted)." By itself, this might lean toward *Restored* if fixed, or *Corrupted* if left alone.
  *   **The Reconstruction (15%):** This falls between "10% (Restoration)" and "30% (Forgery)." It is technically permissible as restoration, though pushing the limit.
  *   **The Palette Violation (1 pixel):** Rule #5 is an absolute veto: *"Replacing even one pixel with a color outside the palette = corrupted no matter the scale."*

  Because Maya's rules treat palette fidelity as a hard constraint rather than a weighted variable, the single out-of-range pixel triggers the "Corrupted" flag immediately, overriding the acceptable reconstruction percentage or the cluster density of the missing pixels.

  ### 2. The Actual Rule: **Hierarchical Veto System**
  You asked if she is running a weighted combo. The evidence suggests she is **not**. A weighted system would allow high scores in "Source Purity" (15% rebuild is okay) to offset a low score in "Palette Fidelity."

  Instead, she is running a **Hierarchical Veto System** based on **Ontological Integrity** (what the object *is*):
  1.  **Level 1 (Hard Veto): System Constraints.** (Palette). If it violates the hardware's technical limits, it is no longer an artifact of that system. It is "Corrupted."
  2.  **Level 2 (Threshold): Human Agency.** (Reconstruction %). If a human has created too much of the data (>30%), it is no longer an artifact of the original creation. It is a "Forgery."
  3.  **Level 3 (Tolerance): Passive Decay.** (Missing Pixels). Time and bit-rot are acceptable up to a visual noise threshold (50 pixels).

  **The Rule:** *Technical impossibility trumps human effort, which trumps passive damage.*

  ### 3. Alternative Rules (Equifinality)
  There are other logical frameworks that fit her past verdicts just as well as the Hierarchical Veto. Here are two strong contenders:

  *   **Alternative A: The "Perceptual Noise" Theory**
      *   **Logic:** She isn't counting pixels; she is judging visual distraction.
      *   **Fit:** 1 missing pixel is invisible. 5 clustered looks like a shadow. 50 scattered is visual static (Corrupted). An out-of-palette color creates high-contrast "noise" (Corrupted). 30% reconstruction changes the silhouette/style (Forgery).
      *   **Difference:** In this model, the palette rule isn't about technical purity, but about visual jarring.

  *   **Alternative B: The "Chain of Custody" Theory**
      *   **Logic:** She is tracking the data's provenance.
      *   **Fit:** Missing pixels are data loss (still original chain). Same-palette fixes are data recovery (chain intact). Out-of-palette colors are data injection (chain broken/Corrupted). Other ROM versions are sibling data (chain bent). Too much sibling data makes it a cousin, not the original (Forgery).
      *   **Difference:** This is about lineage, not visuals or tech specs.

  ### 4. The Discriminating Test Case
  To split the **Hierarchical Veto** (Technical) from the **Perceptual Noise** (Visual) theory, present Maya with this hypothetical sprite:

  **The Case:** A sprite with **1 pixel outside the palette**, but that pixel is a **subtle shade of grey** indistinguishable from a valid palette grey to the naked eye on a CRT monitor. Meanwhile, **40 missing pixels** are scattered, but they are all **transparent** (alpha channel), making the sprite look mostly intact.

  *   **Hierarchical Prediction:** **Corrupted.** The pixel is technically outside the range, regardless of visibility. The rule is binary.
  *   **Perceptual Prediction:** **Restored/Original.** The visual noise is low. The missing pixels don't hurt the image; the color shift is invisible.
  *   **Chain of Custody Prediction:** **Corrupted.** The data lineage is broken by the foreign color code.

  If she calls it *Corrupted*, she is a Technologist. If she calls it *Restored*, she is a Curator (visual focus).

  ### 5. The Hidden Principle: "Agency of Error"
  You hit on something profound regarding "intention." Maya's rules distinguish between **Passive Decay** (bit rot, missing pixels) and **Active Intervention** (filling pixels, changing colors).

  *   **Missing Pixels:** Passive. Time did this. (Forgivable up to a point).
  *   **Palette Colors:** Active. The System did this. (Sacred).
  *   **Out-of-Palette:** Active. A *Human* or *Bad Emulator* did this. (Unforgivable).
  *   **30% Reconstruction:** Active. A *Human* did this. (Deceptive).

  **The Hidden Principle:** **The Human Hand is the Contaminant.**
  Maya trusts the machine (the console/hardware) and Time. She does not trust the Editor.
  *   If the console could have produced it (even via glitch), it's "Original/Corrupted."
  *   If a human had to intervene to make it exist, it's "Restored/Forged."

  **How to Test This:**
  Present her with a sprite containing an **out-of-palette color** that is documented as a **known hardware glitch** for that specific console (e.g., a specific NES DAC error that outputs a non-standard color during a specific scanline cycle).

  *   **If she accepts it as Original:** Her principle is **Historical Truth**. (The machine made it, so it belongs).
  *   **If she rejects it as Corrupted:** Her principle is **Technical Specification**. (The spec says the color shouldn't exist, so it's an error, regardless of the machine's fault).

  This reveals whether she is archiving the *games* or the *specifications*.
