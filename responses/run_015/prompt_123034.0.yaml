answer: |-
  This is a precise and difficult epistemological problem. You are asking for a *prospective* criterion of legitimacy in a domain where *retrospective* validation is impossible by definition (at the time of decision). The philosophical literature often fails here because it treats models as objects of analysis rather than tools of intervention.

  Below is a specification of desiderata for an account of "legitimate idealization" tailored to your context (high-stakes, data-scarce, prospective decision support). I have distinguished between requirements essential for your specific use-case (**Non-Negotiable**) and those that reflect specific philosophical commitments (**Preference**).

  ### Part 1: The Desiderata (Specification)

  **D1. Prospective Tractability (Non-Negotiable)**
  *   **Specification:** The legitimacy of an assumption must be assessable *before* the outcome is known, using only information available at model construction (prior data, mechanistic knowledge, structural constraints).
  *   **Motivation:** Your decisions happen weeks before validation. An account that says "an idealization is legitimate if it predicts well" is useless for triage. You need to know which assumptions are safe *now*.
  *   **Hard Cases:** Addresses the core constraint of your work.

  **D2. Refinement Stability (Non-Negotiable)**
  *   **Specification:** Relaxing the assumption (adding complexity/parameters) should not increase uncertainty in the *decision-relevant output* faster than it reduces bias. Ideally, the "honest" version should converge toward the idealized version as data improves, not diverge.
  *   **Motivation:** Distinguishes between a simplification (we know the term is small) and a structural error (we don't know the term's behavior).
  *   **Hard Cases:** Directly targets **(i)** (in practice de-idealization) and **(v)** (compensating errors). If fixing an error makes the prediction wildly unstable or worse, the original assumption was likely a compensating error, not a benign idealization.

  **D3. Regime Stability (Non-Negotiable)**
  *   **Specification:** The assumption must be justified as negligible in the *target regime* (the future scenario), not just the *calibration regime* (past data). There must be a mechanistic argument for why the neglected factor remains small under intervention.
  *   **Motivation:** Public health interventions change the system. An assumption valid in equilibrium may be fatal under dynamics.
  *   **Hard Cases:** Directly targets **(ii)** (interpolation vs. extrapolation).

  **D4. Intervention Invariance (Non-Negotiable)**
  *   **Specification:** The assumption must not describe a variable that the intervention itself is designed to alter. The model must not hold constant the very mechanism of change.
  *   **Motivation:** Avoids the Lucas Critique. If the model assumes fixed contact behavior, but the policy is "lockdown," the model is self-falsifying.
  *   **Hard Cases:** Directly targets **(iv)** (reflexivity).

  **D5. Causal Anchoring (Preference: Mechanist/Realist)**
  *   **Specification:** Every assumption must map to a posited causal capacity or mechanism, even if simplified. "Black box" statistical fits without causal stories are not idealizations; they are correlations.
  *   **Motivation:** Supports extrapolation. If you don't know *why* the assumption holds, you don't know when it will break.
  *   **Hard Cases:** Targets **(vi)** (inherited assumptions) and **(vii)** (exploratory models).

  **D6. Purpose Relativity (Preference: Pragmatist)**
  *   **Specification:** Legitimacy is relative to the specific question (e.g., "peak load" vs. "total deaths"). An assumption can be legitimate for one output and illegitimate for another within the same model.
  *   **Motivation:** Prevents blanket rejections of models.
  *   **Hard Cases:** Targets **(v)** (compensating errors might be okay for headline numbers but not distributional effects).

  ---

  ### Part 2: Analysis of Hard Cases

  Here is how the specification above handles your specific pile of hard cases.

  *   **(i) De-idealizable in principle, not practice:** Under **D2**, this is a "High Risk" idealization. It is legitimate only if sensitivity analysis shows the unknown parameters are non-identifiable *and* have low leverage on the decision output. If the honest version explodes variance, the idealization is a necessary fiction, but must be flagged as a primary source of uncertainty, not "truth."
  *   **(ii) Benign interpolation, malignant extrapolation:** **D3** explicitly rules this out as a *legitimate* idealization for the extrapolation task. It is a "calibration artifact." The account must demand a mechanistic justification for why the neglected term stays small in the new regime.
  *   **(iii) Singular limits (no finite analogue):** This fails **D2**. If there is no path back to the truth, it is not an idealization; it is a metaphor. It is legitimate only under **D6** (if the purpose is qualitative insight, not quantitative prediction).
  *   **(iv) Intervention falsifies assumption:** This fails **D4** outright. This is not an idealization; it is a model specification error.
  *   **(v) Compensating errors:** This fails **D2**. If fixing one error degrades performance, the model relies on error cancellation. This is the definition of "the wrong kind of false" for decision support, even if the headline number is right. It is brittle.
  *   **(vi) Inherited assumptions:** **D5** demands current justification. Genealogy is irrelevant to truth, though relevant to confidence. If the parent model's robustness argument doesn't hold in this context, the assumption is illegitimate.
  *   **(vii) Exploratory models (no target):** **D6** handles this. If there is no target, "false" is category error. These are "theoretical toys." They are legitimate only if the purpose is explicitly defined as "generating hypotheses" rather than "informing policy."

  ---

  ### Part 3: Incompatibilities and Conflicts

  You suspected two conflicts. Here is the audit.

  **1. Prospective Tractability (D1) vs. Predictive Success**
  *   **Verdict:** **Real Conflict.**
  *   **Analysis:** You cannot define legitimacy by predictive success (the standard instrumentalist view) if you must judge legitimacy *before* prediction.
  *   **Resolution:** For your context, Predictive Success must be demoted from a *definition* of legitimacy to a *hopeful consequence*. You must substitute "Mechanistic Plausibility" or "Structural Robustness" as the proxy for success. This forces you away from pure Instrumentalism (Friedman).

  **2. Refinement Stability (D2) vs. "Fixing Errors Shouldn't Make it Worse"**
  *   **Verdict:** **Real Conflict (The Compensating Error Paradox).**
  *   **Analysis:** You want a model where fixing errors improves the model (D2). But in Case (v), fixing an error *makes the number worse* (closer to the "true" parameter, further from the "true" outcome due to other hidden errors).
  *   **Resolution:** You must distinguish *Parameter Truth* from *Output Accuracy*. D2 demands that fixing errors reduces *uncertainty*, even if it shifts the central estimate. If fixing an error makes the confidence intervals explode, the model was over-confident, not "better." A legitimate idealization should not hide variance.

  **3. A Deeper Conflict: Causal Anchoring (D5) vs. Prospective Tractability (D1)**
  *   **Verdict:** **Tension.**
  *   **Analysis:** Demanding a causal story for every assumption (D5) slows down rapid response modelling. Sometimes we must use phenomenological assumptions (e.g., "transmission drops by 50%") because the causal mechanism (behavioral compliance) is unknowable prospectively.
  *   **Resolution:** D5 should be a "Preference" for long-term models, but relaxable for rapid response if **D3** (Regime Stability) is satisfied via conservative bounding.

  ---

  ### Part 4: The Exclusionary Criterion & Framing Bias

  **The Single Most Exclusionary Requirement:**
  **D1 (Prospective Tractability).**
  Most philosophical accounts of idealization (Friedman, Cartwright, even Giere to an extent) are *retrospective*. They analyze why a model *worked*. They define a "good idealization" as one that *contributed to a successful prediction*.
  *   **Why it excludes:** If legitimacy depends on success, you cannot use the concept to triage assumptions *before* the run. Your request forces an epistemology of *risk* rather than an epistemology of *truth* or *explanation*. It excludes any account that relies on "empirical adequacy" as the truth-maker for the idealization.

  **Does "Triage Tool" Beg the Question?**
  **Yes.** It begs the question in favor of **Pragmatism/Instrumentalism** (van Fraassen, Giere) and against **Scientific Realism** (Maki, Cartwright).
  *   **Why:** By asking "which assumptions can we keep without breaking the decision," you assume the goal is *decision adequacy*, not *ontological fidelity*. A Realist would argue an assumption is illegitimate if it misrepresents the causal structure, *even if* the decision comes out right (because next time it might not).
  *   **Implication:** Your talk must acknowledge that you are adopting a **Decision-Theoretic** standard of legitimacy, not a Metaphysical one. "The wrong kind of false" means "false in a way that risks the decision," not "false in a way that misdescribes reality."

  ---

  ### Part 5: Scorecard of Philosophical Views

  Here is how standard accounts score against your specification.

  | View | Representative | D1 (Prospective) | D2 (Refinement) | D3 (Regime) | D4 (Intervention) | Verdict for You |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **F-Twist** | Friedman | **Fail** | Fail | Fail | Fail | **Useless.** Defines legitimacy by retrospective prediction. |
  | **Isolation** | Maki / Cartwright | Partial | Pass | Partial | Pass | **Too Slow.** Requires deep causal knowledge often unavailable in outbreaks. |
  | **Model-Based** | Giere | Pass | Pass | Pass | Partial | **Strong.** Treats models as similarity relations; fits "adequacy-for-purpose." |
  | **Risk/Robustness** | **Your Context** | **Pass** | **Pass** | **Pass** | **Pass** | **Target.** Prioritizes uncertainty quantification over truth. |

  ### Advice for the Talk

  1.  **Define the Stakes:** Start by admitting that in public health, "false" is not a binary property of a sentence; it is a risk property of a decision.
  2.  **The Taxonomy:** Propose replacing "Idealization vs. Error" with **"Robust Simplification vs. Fragile Fiction."**
      *   *Robust Simplification:* We know it's false, we know why it doesn't matter (satisfies D1-D4).
      *   *Fragile Fiction:* It might be false, and if it is, the decision flips (fails D1-D4).
  3.  **Address the Reviewer:** The reviewer's "wrong kind of false" likely maps to **Case (v)** or **Case (ii)**. They suspected your contact structure assumption was a *compensating error* or *regime-dependent*.
  4.  **The Takeaway:** A legitimate idealization is one where we can bound the error *prospectively*. If we cannot bound the error, it is not an idealization; it is an ignorance parameter, and it must be treated as such in the decision matrix.

  This framework gives you the vocabulary to defend your work without getting bogged down in metaphysics, while satisfying the philosophical demand for rigor.
