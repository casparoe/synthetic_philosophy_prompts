  10. **Final Polish:** Ensure the distinction between the "Quiet Assistant" and the "Lock" is clear. One hides the menu; the other lets you lock the menu yourself. One treats you as a user to be managed; the other treats you as a sovereign to be respected.

  11. **Final Check against Constraints:**
