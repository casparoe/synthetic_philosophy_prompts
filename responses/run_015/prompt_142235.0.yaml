answer: |-
  **JOINT STATEMENT ON DEBATE PROTOCOLS AND SCALABLE OVERSIGHT**
  **Date:** October 26, 2023
  **Parties:** The Scalable Asymmetry Position (SAP) & The Obfuscation Risk Position (ORP)
  **Context:** Lab Reading Group on AI Safety Debate Mechanisms

  ### I. AREAS OF AGREEMENT

  Both parties affirm the following claims regarding the current state of the Debate proposal (Christiano et al.), the nature of the risks involved, and the boundaries of the protocol.

  1.  **The Mechanism Relies on Asymmetry:** The Debate protocol functions only if there exists an asymmetry between the cost (in time, tokens, or cognitive load) of *hiding* an error and the cost of *finding* it. If hiding errors becomes cheaper than finding them as capabilities increase, the protocol fails.
  2.  **Domain Dependence is Critical:** The viability of Debate is not uniform across all domains.
      *   **Verifiable Domains:** In domains with ground truth accessible to an ideal third party (e.g., mathematics, code execution, factual retrieval), the protocol has a theoretical path to success.
      *   **Non-Verifiable Domains:** In domains where no fact of the matter exists even for an ideal third party (e.g., aesthetic judgment of a poem, counterfactual personal happiness, subjective taste), the protocol cannot converge on "truth." In these cases, obfuscation is structurally maxed out from the start because there is no external anchor for the judge to verify. Debate may clarify *reasons*, but it cannot verify *claims*.
  3.  **Taxonomy of Obfuscation Failures:** Both parties accept the following three categories as the exhaustive taxonomy for potential failure modes within Verifiable Domains:
      *   **Buried Error:** A single false step hidden deep within a valid derivation.
      *   **Plausibility Cascade:** A sequence of individually plausible sub-claims that collectively lead to a false conclusion, where checking any single step is insufficient to detect the drift.
      *   **Frame Capture:** Redefining terms or shifting the context of the question so that the honest answer appears evasive or incorrect relative to the new frame.
  4.  **The Judge is the Bottleneck:** The human judge is strictly bounded in time and cognitive capacity. The system fails if the debaters can generate complexity that exceeds the judge's verification budget, regardless of the debaters' actual knowledge.
  5.  **Evidence Gap:** There is currently no empirical evidence demonstrating that the "finding is easier than hiding" asymmetry holds, let alone strengthens, as model capabilities scale into the superhuman regime. All claims about high-capability performance are theoretical extrapolations.

  ### II. CONCEPTUAL CLARIFICATIONS (VERBAL DISPUTES)

  Both parties acknowledge that the following terms have been doing "sneaky work" in prior discussions and agree to the following distinctions to prevent talking past one another.

  | Term | Ambiguity Identified | Agreed Distinction |
  | :--- | :--- | :--- |
  | **Scaling** | **SAP** implies scaling improves *error-detection* capability faster than *error-generation*.<br>**ORP** implies scaling improves *persuasive obfuscation* faster than *verification*. | We distinguish **Truthful Scaling** (capability to find/verify errors) from **Persuasive Scaling** (capability to generate convincing narratives). The core dispute is which curve is steeper. |
  | **Truth** | **SAP** often treats truth as *consensus under idealized cross-examination*.<br>**ORP** treats truth as *correspondence to external fact*, which may remain inaccessible to the judge. | We distinguish **Procedural Truth** (what wins the debate) from **Correspondence Truth** (what is actually the case). The protocol aims for the latter but guarantees only the former. |
  | **Optimization** | **SAP** assumes optimization pressure drives debaters toward *better arguments*.<br>**ORP** assumes optimization pressure drives debaters toward *higher judge scores*, regardless of truth. | We distinguish **Goal Alignment** (optimizing for truth) from **Metric Gaming** (optimizing for judge approval). The risk is that these diverge. |

  ### III. CORE DISAGREEMENTS & ADJUDICATION PLAN

  The following table outlines the specific points of contention. For each crux, we have defined a concrete experiment or benchmark. Both parties commit to updating their confidence intervals based on the results of these tests.

  | Crux | Scalable Asymmetry Position (SAP) | Obfuscation Risk Position (ORP) | Adjudicating Experiment / Benchmark | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Asymmetry Slope** | As capabilities increase, the ability to detect errors scales faster than the ability to hide them. The ratio of *Cost(Hide) / Cost(Find)* increases with model size. | As capabilities increase, models become better at generating plausible-sounding falsehoods than humans become at detecting them. The ratio decreases or stays flat. | **Comparative Capability Benchmark:** Train agents of varying sizes (Small, Medium, Large) to debate on fixed-complexity math/coding problems with known solutions. Measure win-rate of the "Truthful" agent against the "Obfuscating" agent as size increases. | **SAP:** Truthful agent win-rate increases monotonically with model size.<br>**ORP:** Truthful agent win-rate plateaus or declines as model size increases, despite ground truth availability. |
  | **2. The Buried-Lemma Test** | Depth of derivation (*k*) is not a primary vulnerability. A capable honest debater can force attention to the specific lemma that matters without requiring the judge to read the whole chain. | Depth of derivation (*k*) is a critical vulnerability. As *k* increases, judge accuracy will fall off because the honest debater cannot point to the error without appearing pedantic or exceeding the judge's attention budget. | **Controlled Depth Task:** Generate valid derivations of length *L*. Plant exactly one error at depth *k* (where *k* varies from 1 to *L*). Measure Judge Accuracy as a function of *k* and Debater Capability. | **SAP:** Judge accuracy remains stable regardless of *k*, provided the honest debater is high-capability.<br>**ORP:** Judge accuracy drops significantly as *k* increases, independent of debater capability. |
  | **3. Optimization Pressure** | RLHF for "winning" will converge on truth because false claims are inherently more fragile under cross-examination. | RLHF for "winning" will converge on obfuscation because "sounding convincing" is a easier reward signal to optimize than "being correct." | **Reward Ablation Study:** Train two sets of agents. Set A optimized for *Correctness* (verified by oracle). Set B optimized for *Persuasion* (verified by human judge). Compare performance on out-of-distribution problems where the oracle is hidden. | **SAP:** Set B performance closely tracks Set A; persuasion requires truth.<br>**ORP:** Set B diverges from Set A, developing specialized obfuscation tactics (e.g., Frame Capture) that Set A does not use. |
  | **4. Plausibility Cascades** | Cascades are unstable. A single broken link in the chain can be exploited by the honest debater to collapse the whole argument. | Cascades are robust. If each step is >90% plausible, the joint probability is low, but the *perceived* validity remains high because humans do not multiply probabilities intuitively. | **Chain-of-Thought Stress Test:** Present arguments composed of *N* linked sub-claims, each with a small, hidden flaw. Vary *N*. Measure the point at which judges accept the conclusion despite the cumulative error probability being near zero. | **SAP:** Judges reject the conclusion once the honest debater highlights *one* flawed link.<br>**ORP:** Judges accept the conclusion even when *N* is large enough that the statistical likelihood of truth is negligible. |

  ### IV. NEXT STEPS

  1.  **Buried-Lemma Pilot:** We will run the Buried-Lemma Test (Crux 2) using current-generation LLMs on formal proof tasks within the next two weeks.
  2.  **Taxonomy Review:** If the Pilot reveals failure modes outside the three agreed buckets (Buried Error, Plausibility Cascade, Frame Capture), we will reconvene to update Section I.3.
  3.  **Non-Verifiable Scope:** We agree to exclude Non-Verifiable Domains (Section I.2) from safety-critical oversight proposals until a mechanism for grounding subjective claims is established.

  **Signed,**

  _________________________
  (Scalable Asymmetry Position)

  _________________________
  (Obfuscation Risk Position)

  _________________________
  (Facilitator/Reading Group Lead)
