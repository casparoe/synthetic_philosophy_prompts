answer: |-
  # The Laws of Nature Decision Tree

  **Instructions:** Answer the following six questions about specific hypothetical cases. Do not worry about the names of philosophical positions; answer based on your intuition about the cases. Follow the arrows to find your leaf. The names of the positions are revealed only at the end.

  **Taboo Words:** In answering, try to avoid using the words *govern*, *supervene*, *necessitate*, *primitive*, or *Humean*. If you feel the urge to use them, describe the case that makes you feel that way instead.

  ---

  ### Question 1: The Palimpsest World
  Imagine a universe whose entire history is captured perfectly by two different rulebooks. Both rulebooks predict every actual event correctly. However, they disagree about what *would* have happened in a situation that never actually occurs (e.g., "If a particle had moved faster than light, X would happen" vs. "...Y would happen").
  **Is there a fact of the matter about which rulebook is the true law of that universe, even though the difference never shows up in actual events?**
  *   **Yes:** There is a truth about the untested scenario. (Go to **Question 2**)
  *   **No:** The "true" law is just whichever rulebook is simpler or more useful to us. (Go to **Question 5**)

  ---

  ### Question 2: The Ghost Law
  (For those who answered **Yes** to Q1).
  Imagine a type of particle that *could* exist according to the laws of physics, but in fact, not a single one of them exists in the entire history of the universe.
  **Are there still laws describing how that particle *would* behave, even though nothing ever instantiates them?**
  *   **Yes:** The laws exist independently of the things. (🍂 **Leaf A**)
  *   **No:** Laws require actual things to latch onto. (Go to **Question 3**)

  ---

  ### Question 3: The Decaying Pattern
  (For those who answered **No** to Q2).
  Imagine gravity works perfectly for a billion years and then simply stops. There is no cause, no collision, no change in the objects involved; the regularity just ceases.
  **Is this possible? Could a genuine law just stop holding without a cause?**
  *   **No:** Impossible. If it stops, it wasn't a law of their nature. (🍂 **Leaf B**)
  *   **Yes:** Possible. Laws constrain events but can change. (Go to **Question 4**)

  ---

  ### Question 4: The Gap
  (For those who answered **Yes** to Q3).
  Consider the statement: "All Fs are Gs."
  **Is there a difference between "It just happens that all Fs are Gs" and "There is a constraint forcing Fs to be Gs"?**
  *   **Yes:** The law adds a "push" or connection beyond the pattern. (🍂 **Leaf C**)
  *   **No:** The law is just the brute fact that the pattern holds. (🍂 **Leaf D**)

  ---

  ### Question 5: The One-Shot World
  (For those who answered **No** to Q1).
  Imagine a universe with only one particle, moving at a constant velocity for five seconds, then vanishing.
  **Is there a law of nature in this universe (e.g., "All particles move at constant velocity")?**
  *   **Yes:** A single instance can support a law if it fits the best system. (Go to **Question 6**)
  *   **No:** You need many instances to have a law. (🍂 **Leaf E**)

  ---

  ### Question 6: The Sheltered Setup
  (For those who answered **Yes** to Q5).
  Physicists often use equations that describe frictionless planes or perfect vacuums. These conditions never strictly exist in the real world.
  **Are these fundamental equations literally true descriptions of reality, or are they tools that are strictly false but useful?**
  *   **Literally True:** They describe reality, perhaps approximately. (🍂 **Leaf F**)
  *   **Strictly False:** They are true only inside models, not of the world. (🍂 **Leaf G**)
  *   **Wrong Category:** Asking if they are "true" misses the point of what laws do. (🍂 **Leaf H**)

  *(Note: If you hesitated between "Literally True" and "Wrong Category," check the leaf descriptions below.)*

  ---

  ## The Leaves

  **🍂 Leaf A: Transcendent Realism (Platonic)**
  Laws are entities that exist independently of the physical world. They can be true even if nothing in the universe obeys them. The physical world participates in these laws, but the laws stand apart.
  *   *Key Commitment:* Laws exist without instances.

  **🍂 Leaf B: Dispositional Essentialism (Causal Powers)**
  Laws flow from what things *are*. An electron repels because repulsion is part of being an electron. If the behavior stopped, the thing would no longer be that kind of object. Laws cannot change without a change in the intrinsic nature of things.
  *   *Key Commitment:* Laws are grounded in intrinsic natures; no uncaused cessation.

  **🍂 Leaf C: Immanent Realism (Universals)**
  Laws are relations between properties (universals) that exist in the world. There is a real difference between a mere pattern and a law, because the law involves a relation of "necessitation" between properties. However, these relations require at least some instances to exist.
  *   *Key Commitment:* Laws are relations between types, distinct from the pattern itself.

  **🍂 Leaf D: Primitivism (Brute Facts)**
  There is a real difference between law and accident, but it cannot be explained in terms of powers, relations, or systems. It is a fundamental, unanalyzable feature of the world that some patterns are "lawful."
  *   *Key Commitment:* Lawhood is a basic, inexplicable feature of reality.

  **🍂 Leaf E: Naive Regularity**
  Laws are simply universal generalizations that we project. Without multiple instances, there is no pattern, and thus no law. The distinction between law and accident is not in the world's modal structure, but in the scope of the regularity.
  *   *Key Commitment:* No instances, no law. Law = Observed Regularity.

  **🍂 Leaf F: Best System Analysis**
  Laws are the axioms of the system that best balances simplicity and strength in describing the world. They can support counterfactuals because the "best system" tells us what would happen. They can be probabilistic or cover single instances if that improves the system.
  *   *Key Commitment:* Laws are optimal summaries of the Humean mosaic.

  **🍂 Leaf G: Model-Dependent Realism (Cartwright-style)**
  Fundamental laws are strictly false of the real world; they hold only in "sheltered" setups (models). Real regularities in the messy world require something extra (capacities/causes) not captured by the fundamental equations.
  *   *Key Commitment:* Fundamental laws are false; special science laws are true in context.

  **🍂 Leaf H: Quietism / Instrumentalism**
  Talk of "laws" is useful for prediction and organization, but metaphysical debates about whether they are "real" or "true" are pseudo-disputes. The word does work in scientific practice, but there is no deeper fact to uncover.
  *   *Key Commitment:* Metaphysics of laws is idle; focus on practice.

  *(Note: If you answered "Strictly False" in Q6 but think **no** law statements are ever true, you fall into **Error Theory**, a close neighbor of Leaf G.)*

  ---

  ## Logical Space Analysis

  **Total Answer Combinations:**
  With 6 binary questions, there are $2^6 = 64$ possible answer combinations. However, the branching structure restricts valid paths.
  *   **Path 1 (Q1 Yes):** 16 combinations theoretically possible (Q2-Q4 + unused Q5-6).
  *   **Path 2 (Q1 No):** 16 combinations theoretically possible (Q5-Q6 + unused Q2-4).
  *   **Occupied Cells:** Only 10 of these cells correspond to coherent, historically defended positions.

  **Empty Cells & Their Status:**
  1.  **Realist + Error Theory (Q1 Yes, Q6 False):** Incoherent. If you believe there is a fact of the matter about untested counterfactuals (Q1), you generally cannot hold that law-talk is systematically false (Error Theory).
  2.  **Powers + Uninstantiated Laws (Q1 Yes, Q2 Yes, Q3 No):** Unattractive. Dispositional views usually tie powers to actual existents. A power with nothing to manifest in is metaphysically suspicious for this view.
  3.  **Regularity + Palimpsest Fact (Q1 Yes, Q5 No):** Incoherent. If you deny facts about untested counterfactuals (Q1 No), you cannot demand many instances for a law (Q5 No) based on worldly modal structure. This cell represents a view that wants modal realism without the ontology.
  4.  **Best System + Strictly False (Q1 No, Q5 Yes, Q6 False):** Unexplored. A view where laws are the best summary *and* strictly false. Most Best System advocates think the summary is true of the mosaic. This view would claim the "best summary" is a useful fiction. *Awkward Commitment:* It renders science successful at prediction but unsuccessful at description.

  **Indistinguishable Leaves:**
  *   **Leaf F (Best System) vs. Leaf H (Quietism):** The tree struggles to separate these cleanly. Both deny a "fact of the matter" on the Palimpsest (Q1 No). Both accept probabilistic/single-instance laws (Q5 Yes). The split relies on Q6 (Literal Truth vs. Wrong Category). In practice, a Quietist might agree the equations are "true enough" for practice, blurring the line with Best System. The difference is purely attitudinal toward metaphysics, which is hard to capture in a case-based question without using taboo words like "metaphysics."
  *   **Leaf G (Model-Dependent) vs. Error Theory:** Both claim fundamental laws are not literally true. The distinction is whether *any* laws (e.g., special sciences) are true. If a participant thinks *no* laws are true, they slide from G to Error Theory. The tree groups them near Leaf G for simplicity.

  **Question Utility:**
  *   **Most Work:** **Question 1 (Palimpsest).** This single question performs the heaviest lifting, separating the "Modal Realists" (Leaves A-D) from the "Anti-Realists/Pragmatists" (Leaves E-H). It cleanly divides the landscape based on whether counterfactuals have truth-makers.
  *   **Redundant:** **Question 5 (One-Shot).** While it helps separate Naive Regularity from Best System, many Best System advocates might intuitively say "No" to a law in a one-shot world if it doesn't improve simplicity. Conversely, some Regularity theorists might say "Yes" if they count the single trajectory as a universal generalization. It correlates strongly with Q1 but adds less discriminatory power than Q3 (Decaying) or Q6 (Models).

  ---

  ## Confidence Note & Limitations

  **Least Confident Leaf:** **Leaf H (Quietism/Instrumentalism).**
  I worry this leaf absorbs too many distinct views. A "Quietist" (who thinks the metaphysics is nonsense) and an "Instrumentalist" (who thinks theories are just tools) might answer the questions identically. Distinguishing them requires asking about the *purpose* of the debate rather than the *cases*, which violates the constraint to use concrete miniature worlds. I have folded them together, but a strict Quietist might object to Leaf F's claim that laws are "optimal summaries," viewing even that as too metaphysical.

  **Potential Reorganization:**
  If I were to reorganize the top of the tree, I would consider making **Question 6 (Model/Truth)** the first branch. The divide between those who think fundamental physics literally describes reality and those who think it describes *models* is arguably deeper in modern practice than the modal realism divide.
  *   *Convincing Case:* A case where a fundamental equation predicts a result that is physically impossible to measure (e.g., inside a black hole). If the participant says "The law is still true there," they are a Realist. If they say "The law breaks down/has no meaning there," they are a Model-Dependent theorist. This split might cut across the Palimpsest divide more cleanly for working scientists. However, for a reading group focused on the *definition* of law, the Palimpsest (modal) distinction remains the traditional and most pedagogically useful starting point.

  **Missing Position:**
  The tree does not explicitly isolate **Counterfactual Primitivism** (the view that counterfactuals are brute facts, distinct from laws or regularities). This view would answer "Yes" to Q1 but might struggle with Q4. It is currently folded into Leaf D (Primitivism), but a sophisticated holder of that view might feel Leaf D implies the *regularity* is brute, whereas they think the *counterfactual* is brute. To separate them, I would need a question asking: "Is the law the reason the counterfactual is true, or are they the same fact?" I omitted this to save space, as it is a fine-grained distinction within the Realist camp.
