answer: |-
  ### I. Conceptual Mapping: Cases, Requirements, and Costs

  Before specifying the desiderata, we must stress-test the candidate requirements against the hard cases you provided. The goal is to see what breaks. I have grouped your cases into four families of tension. For each, I ask: *If we adopt a strict requirement to solve this, what do we lose elsewhere?*

  **Family 1: The Identity Gap (Ordinary Dementia, Phase-Cycling)**
  *   *The Tension:* The "then" self (competent, values integrity) vs. the "now" self (incompetent, values contentment).
  *   *Candidate Requirement:* **Strict Precedent Autonomy.** (Honor the AD regardless of current state).
  *   *Cost of Adoption:* We authorize the "torture" of a contented demented patient (e.g., forcing chemotherapy on a happy dementia patient because the AD said "no life-prolonging treatment"). This violates the *Non-Maleficence* constraint regarding the current experiencer.
  *   *Candidate Requirement:* **Current Interest Supremacy.** (Ignore AD if current self is happy).
  *   *Cost of Adoption:* Advance directives become advisory only. The "authority" of the earlier self is illusory. We lose the ability to plan for dignity, which was the primary motivation for signing.

  **Family 2: The Epistemic/Temporal Gap (Velocity, Proleptic, Affective Forecasting)**
  *   *The Tension:* How much weight do we give an instruction based on its stability and the foresight of the author?
  *   *Candidate Requirement:* **Stability Threshold.** (ADs only valid if endorsed over $X$ years).
  *   *Cost of Adoption:* Excludes the "Proleptic Directive" (e.g., a transgender patient anticipating transition, or a religious convert). It privileges inertia over authentic growth. Also, as you noted, any threshold is ad hoc.
  *   *Candidate Requirement:* **Forecasting Correction.** (Discount ADs where affective forecasting is known to be poor).
  *   *Cost of Adoption:* Requires the committee to be amateur psychologists. Violates the *Usability* constraint. Who decides which values are "adaptive" and which are "delusional"?

  **Family 3: The Scope of Binding (Ulysses, Ratchet, Never-Competent)**
  *   *The Tension:* Can the earlier self bind the later self against its will? Can a guardian bind the never-competent?
  *   *Candidate Requirement:* **Anti-Paternalism of the Past.** (Later self's current request overrides earlier Ulysses clause).
  *   *Cost of Adoption:* Makes ADs useless for addiction or bipolar disorder (the exact cases where they are most needed).
  *   *Candidate Requirement:* **Guardian Authority Equivalence.** (T guardian ADs like patient ADs).
  *   *Cost of Adoption:* Collapses the distinction between *self-determination* and *best interests*. A theory of *earlier self authority* has no purchase here; this is a different ethical mechanism entirely.

  **Family 4: The Implementation Gap (Distinctions, Epistemic Constraints)**
  *   *The Tension:* Theory vs. Bedside Reality.
  *   *Candidate Requirement:* **Psychological Continuity Metric.** (Authority scales with degree of psychological connectedness).
  *   *Cost of Adoption:* Theoretically robust, practically impossible. A committee cannot measure "psychological connectedness" in an afternoon.
  *   *Candidate Requirement:* **Binary Capacity Switch.** (Authority exists or it doesn't).
  *   *Cost of Adoption:* Ignores the "Phase-Cycling" and gradual dementia cases. Creates cliff-edge injustices.

  ---

  ### II. The Desiderata for a Theory of Authority

  Based on the mapping above, here is the specification of requirements. I have sorted your distinctions and constraints into substantive, procedural, and epistemic categories.

  #### A. Substantive Desiderata (What the theory must justify)

  1.  **The Veto/Input Distinction:** The theory must specify whether an AD functions as a *veto* (binding unless specific defeaters apply) or as *evidence* (one input into a best-interests calculation).
      *   *Rationale:* Without this, surrogates treat all ADs as advisory, nullifying the concept of authority.
  2.  **The Welfare Defeater Condition:** The theory must specify the threshold of current suffering or well-being that overrides precedent autonomy.
      *   *Rationale:* Addresses the "Ordinary Dementia" case. If the current self is in agony, the earlier self's authority must yield. If the current self is content, the earlier self's authority should hold.
  3.  **The Identity Continuity Threshold:** The theory must provide a principled (not ad hoc) account of when the "later self" is sufficiently discontinuous from the "earlier self" to void the earlier self's authority.
      *   *Rationale:* Addresses the "Phase-Cycling" and "Dementia" cases. If the later self is a "different person" (psychologically), the earlier self's authority lapses.
  4.  **The Scope Boundary:** The theory must explicitly demarcate where *precedent autonomy* ends and *guardianship/best-interests* begins (e.g., the Never-Competent patient).
      *   *Rationale:* A theory of *earlier self authority* cannot cover the never-competent. It must admit this limitation rather than stretching to cover it.

  #### B. Procedural Desiderata (How the theory is applied)

  5.  **The Tuesday Afternoon Test (Usability):** The decision procedure must be executable by a clinical ethics committee under time pressure without requiring metaphysical expertise.
      *   *Rationale:* Addresses the "Epistemic Constraint." A theory requiring Parfitian reductionist analysis is useless at the bedside.
  6.  **The Burden of Proof Allocation:** The theory must specify who bears the burden when the AD conflicts with current presentation (e.g., does the surrogate prove the AD applies, or does the hospital prove it should be overridden?).
      *   *Rationale:* Addresses the "Actual vs. Counterfactual" distinction. Defaulting to the AD protects autonomy; defaulting to current interests protects welfare. The theory must choose a default.
  7.  **The Specificity Gradient:** The theory must account for the binding force of the instruction relative to its specificity (e.g., "no tubes" vs. "no life-prolonging treatment in terminal condition").
      *   *Rationale:* Vague instructions require more interpretation (less authority); specific instructions require less (more authority).

  #### C. Epistemic Desiderata (What the theory assumes we can know)

  8.  **Epistemic Humility:** The theory must not require knowledge of the current incompetent self's subjective experience that is inaccessible to observers.
      *   *Rationale:* We cannot know if the demented patient is *truly* happy or merely placid. The theory must work despite this opacity.
  9.  **Pathology Filtering:** The theory must provide a mechanism to discount instructions (past or present) that are products of treatable pathology (depression, delirium, anosognosia).
      *   *Rationale:* Addresses the "Constraint from Elsewhere" regarding affective forecasting and pathology. Authority requires competence, not just signature.

  ---

  ### III. The Three Further Deliverables

  #### 1. Non-Negotiables vs. Camp Preferences

  *   **Non-Negotiable (Constraint-Based):**
      *   *The Tuesday Afternoon Test (Usability).* If the theory cannot be used by the committee, it fails its purpose as a policy guide.
      *   *The Scope Boundary.* A theory of *authority* cannot logically apply to the *never-competent*. Pretending it does creates conceptual confusion.
      *   *Pathology Filtering.* Authorizing decisions driven by untreated delirium is negligence, not ethics.

  *   **Camp Preferences (Substantive):**
      *   *The Veto/Input Distinction.* This is the main battleground. Autonomy-maximalists demand **Veto**. Welfare-maximalists demand **Input**. An adequate theory must pick one, but the *choice* is a normative stance, not a logical requirement.
      *   *The Identity Continuity Threshold.* Dworkinians argue identity is irrelevant (critical interests rule). Reductionists argue identity is everything. The *need* for a threshold is non-negotiable; the *location* of the threshold is a camp preference.
      *   *The Burden of Proof.* Defaulting to the AD favors liberty; defaulting to life/welfare favors safety. This is a policy choice, not a philosophical necessity.

  #### 2. The Impossibility Result (Jointly Unsatisfiable Desiderata)

  I flag a trilemma. You cannot jointly satisfy the following three desiderata:

  1.  **Perfect Fidelity to Precedent Autonomy** (Honor the AD even if the later self objects/is different).
  2.  **Protection of Current Experiential Welfare** (Prevent significant suffering/discomfort to the current self).
  3.  **Epistemic Humility/Usability** (Make the decision without deep metaphysical inquiry into the "true" self or inaccessible subjective states).

  *Argument:* In the "Ordinary Dementia" case (contented patient, AD refusing care), (1) demands we withhold care, (2) demands we provide care (to maintain contentment/life), and (3) prevents us from resolving the conflict by asking the patient or analyzing their psychological continuity in depth.
  *Conclusion:* Any workable policy must explicitly sacrifice either (1) or (2). Most hospital policies implicitly sacrifice (1) when suffering is visible, but claim to uphold (1) rhetorically. An honest theory must admit that **Authority is defeasible by Welfare**, but must define the defeater strictly to prevent (1) from becoming empty.

  #### 3. The Single Most Exclusionary Requirement

  **The Tuesday Afternoon Test (Usability under Epistemic Scarcity).**

  *Why:* This requirement excludes the most philosophically robust theories.
  *   **Parfitian Reductionism:** Philosophically superior at handling the "Identity Gap," but it requires a case-by-case assessment of psychological connectedness. This is impossible for a committee in an afternoon. It is excluded.
  *   **Strict Narrative Integrity (Dworkin):** Requires distinguishing "critical interests" from "experiential interests." While usable, it often fails the *Pathology Filtering* constraint (e.g., is the demented patient's happiness a "critical interest" or just biology?).
  *   **Pure Best-Interests:** Usable, but excluded because it fails the *Veto/Input* desideratum (it dissolves authority entirely).

  The Usability constraint forces us toward **proxy rules** (e.g., "If dementia is advanced, AD holds unless physical distress is evident") rather than **truth-tracking** (e.g., "Is this the same person?"). It forces the theory to be *administrative* rather than *metaphysical*.

  ---

  ### IV. Scoring the Main Families of Views

  Here is how the standard philosophical families score against the desiderata list above.

  **1. The Integrity-Based View (Dworkin)**
  *   *Core:* Critical interests (life narrative) trump experiential interests (current feelings).
  *   *Score:* High on **Veto/Input** (strong authority). High on **Scope Boundary** (clear on competence).
  *   *Failure:* Fails **Welfare Defeater**. In the "Ordinary Dementia" case, it mandates honoring the AD even if the current self is content, which strikes many clinicians as cruel. It also struggles with **Pathology Filtering** (distinguishing narrative values from biological states).

  **2. The Current-Interests / Best-Interests View**
  *   *Core:* The moral patient is the being currently experiencing; ADs are merely evidence of what might be good.
  *   *Score:* High on **Welfare Defeater** and **Pathology Filtering**. High on **Usability**.
  *   *Failure:* Fails **Veto/Input**. It reduces authority to input. It cannot explain the "Ulysses" case (why bind the future self at all?). It effectively eliminates the *authority* of the earlier self, violating the project's purpose.

  **3. Narrative / Temporally-Extended-Self Views**
  *   *Core:* Authority depends on the strength of the narrative connection between then and now.
  *   *Score:* High on **Identity Continuity**. Nuanced on **Proleptic Directives**.
  *   *Failure:* Fails **The Tuesday Afternoon Test**. Assessing narrative coherence and psychological connectedness is too complex for emergency ethics. It also risks **Epistemic Humility** violations (surrogates projecting their own narrative onto the patient).

  **4. Parfit-Style Reductionism**
  *   *Core:* Identity is not what matters; psychological connectedness matters in degrees.
  *   *Score:* High on **Identity Continuity** (theoretically). Dissolves the "hard cases" by denying the binary self.
  *   *Failure:* Fails **Usability** catastrophically. It offers no decision procedure, only a description of the problem. It also struggles with **Scope Boundary** (if identity is gradual, when does guardianship start?).

  **Recommendation:** The committee should adopt a **Hybrid Model** that leans on **Integrity (Dworkin)** as the default (satisfying *Veto/Input*), but incorporates a hard **Welfare Defeater** (satisfying *Non-Maleficence*) triggered by observable distress, acknowledging the **Impossibility Result** that we cannot perfectly satisfy both. This sacrifices philosophical purity for the **Tuesday Afternoon Test**.
