answer: |-
  - **Assumptions I can safely make about this room (~100 words)**
  Treat Bayes' rule as a known formula ($P(H|E) \propto P(E|H)P(H)$), but assume no fluency with joint distributions or conditional independence. They understand "prior" and "posterior" as vocabulary, but likely conflate "updating on evidence" with "changing your mind." Assume they accept the Common Prior Assumption (CPA) as a normative ideal for the sake of the exercise, even if they doubt it empirically. Do not assume any familiarity with set-theoretic partitions, measurability, or fixed-point theorems. You must treat "common knowledge" as a new technical term, distinct from "mutual knowledge." Their programming background means they will grasp state-space models quickly if framed as lookup tables.

  - **Dependency map (~300 words)**
  1.  **Bayesian Updating Review:** Establish the mechanical baseline. If you don't lock down how a single agent updates on a private signal, you cannot show how two agents differ.
  2.  **Information Partitions:** Introduce the state-space grid. Agents don't see the "true state"; they see a cell in their partition. This must precede "common knowledge" because partitions define what is knowable.
  3.  **Common Knowledge Definition:** Define it recursively (I know that you know...) using the partition meet. This must follow partitions because the "meet" is the mathematical operator for common knowledge.
  4.  **The Numerical Example:** Run the carrying example *before* stating the theorem. This creates the cognitive dissonance (averaging fails) that the theorem resolves.
  5.  **The Theorem Statement:** Now state that common knowledge of posteriors implies identical posteriors. This lands better after the example shows why naive sharing fails.
  6.  **The "No-Trade" Corollary:** Address the prediction-market participant here. If posteriors agree, bets vanish. This absorbs the finance tangent into the formal result.
  7.  **Accuracy vs. Consistency:** Address the calibration participant last. The theorem guarantees consistency, not truth. This prevents the "but what if they're both wrong?" objection from derailing the logic earlier.

  - **The carrying example (~350 words)**
  **Proposition:** Is the coin Heads (H) or Tails (T)? **Prior:** 0.5.
  **Signals:** Alice gets "Strong H" (Likelihood 9:1 for H). Bob gets "Weak T" (Likelihood 1:2 for H).
  **Posteriors:** Alice computes 0.9. Bob computes 0.33.
  **Naive Average:** 0.615.
  **Combined Evidence:** (9×1):(1×2) = 4.5:1 → Posterior 0.81.
  **Why this works:** The asymmetry ensures averaging fails visibly (0.62 vs 0.81). The likelihoods are integers to allow mental math on the board.
  **Execution:** Draw a 4-state grid (AA, AB, BA, BB). Assign probabilities to each cell. Show Alice's partition groups rows; Bob's groups columns. In the actual state (A,B), Alice sees 0.9, Bob sees 0.33.
  **The Trap:** If you simply ask them to "share evidence," they multiply likelihoods and get 0.81 immediately. To teach Aumann, you must enforce a rule: they can only announce their current posterior number.
  **The Iteration:** Alice says "0.9." Bob infers Alice saw "Strong H." Bob updates to 0.81. Bob says "0.81." Alice infers Bob saw "Weak T." Alice updates to 0.81. Agreement reached without sharing raw data, only implications.
  **Rejected Alternative:** The "Two Urns" symmetric model. I rejected it because if both see Red, they both get 2/3. They already agree, so the theorem is trivial, and averaging accidentally yields the correct combined probability, failing to dislodge the "average your credences" heuristic.

  - **Misconception ledger (~400 words)**

  | Misconception | Where it surfaces | Defusing Move |
  | :--- | :--- | :--- |
  | **"Share Evidence" Folk Version** | During Example Setup. Participants will want to just tell each other their signals. | **Constraint Enforcement:** Explicitly ban sharing signals. Allow only posterior numbers. Show that knowing the number *reveals* the signal only because rationality and priors are common knowledge. |
  | **"Average Your Credences"** | During Calculation. The "averaging defender" will argue 0.62 is a reasonable compromise. | **The God's Eye View:** Reveal the combined evidence calculation (0.81) *after* they commit to the average. Show that averaging double-counts the prior and ignores signal strength asymmetry. |
  | **"Prediction Markets / No-Trade"** | During Theorem Statement. The "market" participant will ask about betting strategies. | **The Bet Corollary:** Frame the theorem as a "No-Trade" theorem. If posteriors differ, a bet exists. If common knowledge is reached, posteriors match, and the bet vanishes. This validates their intuition without leaving the epistemology. |
  | **"Calibration vs. Truth"** | During Conclusion. The "calibration" participant will ask if agreeing makes them right. | **Consistency Check:** Explicitly distinguish *rationality* from *accuracy*. If priors are wrong, they will commonly agree on the wrong answer. The theorem is about internal consistency, not external truth. |

  - **The check (~150 words)**
  **Task:** "Alice and Bob have common priors. They privately observe different signals. They announce their posteriors repeatedly until they agree on 0.8. Alice then turns to you and whispers, 'I just realized Bob's signal was actually much stronger than I thought, but he didn't know I knew that.' Does Alice update her probability away from 0.8?"

  **Correct Answer:** No. If agreement was reached under *common knowledge*, all information contained in the posteriors has already been extracted. Learning something about the signal structure *after* common knowledge was established implies the common knowledge condition was broken or the model changed.

  **Wrong-but-Confident Answer:** "Yes, she should update toward Bob's signal since it's stronger." (This reveals they think agreement is a one-time averaging event, not a fixed point of information pooling.)

  - **What to refuse to cover (~150 words)**
