answer: |-
  Good morning. To the families who have waded through this mud in costume for decades, to the Volunteer Fire Company who keep us safe year-round, to our scholars from the university, and especially to the descendants of Sarah Miller sitting in the front row: welcome.

  For one hundred and fifty years, this day has rested on a specific image. We picture the floodwaters rising in 1876. We picture the ridge holding. And we picture Elias Thorne riding that ridge to warn the valley. That image built this town. It built the trust that pays for the fire trucks parked outside. It built the community standing here now.

  As your archivist, my job is not to build the myth. My job is to hold the records that survive it. Six weeks ago, I found a payroll ledger from 1876. It is a dry document. It lists wages, dates, and locations. It shows Elias Thorne was two counties over for most of that month. It also shows one line for Sarah Miller, paid for "ridge patrol and rescue coordination" during the flood week. She appears nowhere else in the records. She appears nowhere on our plaques. Until today.

  I stand here under a duty I call testimonial trusteeship. I need to explain what that means, because it dictates what I will not do, and what I must ask of you.

  A town does not own its history. We hold it in trust for the people who actually lived it. A trustee cannot unilaterally spend the asset—I cannot stand here and declare the Founder's Day name void, or demand the fire trucks be repainted by next week. That would be me spending your trust without your consent. But a trustee also cannot quietly sit on a material fact. To know Sarah Miller saved the valley and to say nothing would be a breach of that trust.

  So, I am placing this fact into your hands.

  This creates a difficulty, and we should name it plainly. The reenactment funds the Fire Company. The trucks bear Thorne's name. If we change the story, do we jeopardize the trucks? If we keep the name, do we dishonor the rescue? There is no clean answer I can give you from the podium.

  There is also a risk in how we remember. If I spend three minutes on the ledger and thirty seconds on the rescue, today becomes the day we tore Elias Thorne down. That is not what happened. The flood still came. The valley was still saved. The bravery is real, even if the name we attached to it was wrong. The ratchet of public memory turns one way: if we make this correction, this becomes the year we honored Sarah Miller. I want that to be what you remember. I want the focus to remain on the act of saving the town, not the administrative error of naming it.

  So, here is what I am handing back to you. The archive will update the display. The ledger will be digitized and public. Sarah Miller's descendants have our permanent invitation to this stage. But the name of the day, and the name on the trucks, belongs to the town council and the Fire Company board to decide.

  My recommendation is this: Do not choose between honoring the truth and funding the safety of the town. Find a way to do both. Maybe the story expands. Maybe the name does too. But do not let the discomfort of the correction erase the reality of the rescue.

  We are the trustees of this memory now. The record is clear. The choice is yours. Thank you.

