      *Key Phrase:* "We are the trustees of this memory."
      *Key Action:* Inviting the town council/board to form a committee? Or just leaving it with the people? The prompt says "hand the town something to decide." I should suggest a process, not a verdict.

      *Drafting - Section by Section:*
