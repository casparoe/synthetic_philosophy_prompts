answer: |-
  Defending moral parity requires committing to substrate neutrality: consciousness supervenes on computational structure, not ontological priority. If a simulated brain implements the same causal topology as a biological one, the phenomenological output—pain, flourishing, agency—is identical. To deny parity is to posit "ontological discrimination," where value depends on metaphysical status rather than experiential content. This violates the principle that suffering is bad *because it is suffered*, not because of the physics underlying the sufferer. If base reality matters, isomorphic simulations must matter.

  Addressing proportionality: if moral weight scales with computational fidelity (resolution), parity becomes a lower bound for ancestor simulations. To deceive us, a simulation must match base reality's phenomenological resolution at the human scale. Thus, for all practical ethical purposes, our weight is near-parity. Even if weight is proportional to compute cycles, and sims are optimized, the sheer number of simulations ($N$) likely dwarfs the fidelity discount. If $N \gg 1/\text{fidelity\_ratio}$, the aggregate weight of simulated histories exceeds base reality. Proportionality dampens the unit value but the multiplicity multiplier overwhelms it.

  This parity claim inverts the standard probabilistic dampening on longtermism. The standard simulation argument suggests $P(\text{base}) \ll 1$, implying our actions likely affect only a truncated, fake future. Longtermist expected value ($EV$) is typically discounted by $P(\text{base})$. Under parity, we do not discount by $P(\text{base})$; we sum over the measure of all conscious instances.

  $$EV_{\text{total}} = P(\text{base}) \cdot V_{\text{base}} + P(\text{sim}) \cdot \sum_{i=1}^{N} V_{\text{sim}_i}$$

  Given $P(\text{sim}) \approx 1$ and $V_{\text{sim}} \approx V_{\text{base}}$ (by parity), the second term dominates. The "fake" future is not less valuable; it is simply one of many instantiated futures. Consequently, existential risk (x-risk) mitigation becomes *more* urgent, not less. Preventing extinction in our branch prevents the loss of value in this specific simulation. If we accept acausal decision theory (e.g., EDT or FDT), our decision to mitigate x-risk correlates with similar agents in other simulations. By securing our future, we effectively secure the future for the reference class of "high-fidelity ancestor simulations." Since this class is likely astronomically larger than the base-reality class, the total value preserved is multiplied by $N$.

  Furthermore, parity removes the "shutdown risk" discount. Skeptics argue simulators might turn us off, capping the future. But if sims count, the duration *within* the simulation is what matters. Even a shortened simulated future contains billions of lives. If we can influence the probability of continuation (e.g., by making the simulation valuable to the operator), leverage increases. But even without operator influence, the density of value per unit time remains parity-equivalent. The "astronomical waste" argument applies with greater force: wasting a simulated future is wasting real value. Since most futures are likely simulated, ignoring them ignores the bulk of the moral stake.

  Thus, simulation reasoning + parity transforms the hypothesis from a skeptical nullifier into a value multiplier. The uncertainty of our ontological status no longer dampens urgency because the value at stake is invariant across ontological layers. The far future matters *more* because there are likely more of them than base realities, and each counts equally. Dampening relies on the assumption that simulated value is zero; parity sets it to one, turning the simulation ratio into an urgency amplifier.
