      *   *Decision:* The **Wind Tunnel/Scale Model** is the standard philosophy of science analogy for idealization. It distinguishes between *negligibility* (friction is small) and *heuristic* (assume friction is zero to solve equations). But the **GPS** analogy is more intuitive for "navigation." Let's use **GPS with Traffic Data**. It shows the difference between "zoomed out" (omission) and "wrong data" (falsehood).
