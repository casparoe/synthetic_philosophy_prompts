      *   *Map:* The London Tube Diagram.
      *   *Deleted Stations:* Friction, transaction costs, irrational biases, institutional details.
      *   *Distorted Distances:* Relative magnitudes of effects (e.g., elasticity might be simplified).
      *   *The Thames:* External shocks, politics, history, geography (real-world constraints).
      *   *The Rider:* The Policymaker or Econometrician using the model.
      *   *The Destination:* Accurate Prediction or Effective Policy.
      *   *Actual Geography:* The Real Economy (messy, complex).

  4.  **Identifying the Breakdown (The Critical Analysis):**
      *   *Omission vs. Commission:* The Tube Map *omits* geography. It doesn't claim the Thames is dry; it just doesn't draw it. Friedman's assumptions often *assert* things that are false (e.g., "Agents maximize expected utility"). This isn't just skipping a station; it's claiming the train runs on magic fuel.
      *   *Mechanism vs. Topology:* The Tube Map is a *guide to a system that exists*. You can see the trains. In Macro, the "trains" (rational expectations mechanisms) are theoretical constructs. If the mechanism is wrong, the prediction might work by luck (equifinality) but fail under stress (Lucas Critique).
      *   *Robustness:* If a tunnel floods (Thames rises), the Tube Map needs updating. If human cognition changes (panic), does the Rational Expectations model update? No, it assumes cognition is fixed as "rational."
      *   *The "Faster than Light" Point:* The user is right. Omitting a station is a *abstraction*. Assuming perfect foresight is a *counterfactual assertion*. One removes noise; the other changes the physics of the system.

  5.  **Evaluating the "Harmless" Conclusion:**
      *   Does the conclusion survive? No. If the assumptions are structurally wrong (not just simplified), the model fails when regimes change. The 2008 crisis is the classic example: models assumed liquid markets (omitted the possibility of freezing), so when liquidity vanished, the map was useless.
      *   *Friedman's Defense:* He would say "Did it predict inflation?" If yes, assumptions don't matter.
      *   *Counter:* Goodhart's Law / Lucas Critique. If you base policy on a map that lies about the terrain, you might build a road where a river is.

  6.  **Developing a Better Analogy:**
      *   *Tube Map:* Too static. Implies the network is fixed.
      *   *Wind Tunnel:* Classic physics analogy. Scale models. You simplify air resistance, but the *laws of physics* (Navier-Stokes) remain consistent.
      *   *Weather Forecast:* Better for macro. Chaotic, probabilistic, relies on initial conditions.
      *   *GPS/Navigation App:* This is the modern winner.
