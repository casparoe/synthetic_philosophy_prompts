answer: |-
  This is a classic debate in the philosophy of economics, centering on Milton Friedman's 1953 essay *The Methodology of Positive Economics*. Your professor is giving you the "Instrumentalist" defense: theories are tools, not truth-claims. Your intuition—that there is a categorical difference between simplification and falsehood—is the "Realist" critique.

  Here is the breakdown of the correspondence, the structural failure of the analogy, and a more robust way to think about idealization.

  ### 1. The Correspondence Table

  | **The London Tube Map** | **Friedman's Macro Model** | **The Real World** |
  | :--- | :--- | :--- |
  | **The Map** | The Economic Model (e.g., DSGE, Supply/Demand) | The Theory / Equation Set |
  | **Actual Geography** | The Real Economy (complex, messy) | Physical Reality |
  | **Deleted Stations** | Frictions, Transaction Costs, Institutional Details | Minor Variables / Noise |
  | **Straightened Lines** | Linearized Equations, Ceteris Paribus | Non-linear, Chaotic Interactions |
  | **The Thames (Ignored)** | Politics, History, Sociology, Power Dynamics | Exogenous Constraints |
  | **The Rider** | The Policymaker / Econometrician | The User of the Model |
  | **Getting to Destination** | Predictive Accuracy / Policy Success | Navigating the Economy |
  | **Distorted Distances** | Relative Magnitudes (Elasticities) | Actual Economic Scale |

  ### 2. Where the Analogy Breaks

  Your intuition about the "faster-than-light train" is precise. The Tube Map analogy fails in three specific places when applied to Rational Expectations and Perfect Markets.

  #### A. Omission vs. Commission (The "Faster-Than-Light" Problem)
  *   **Tube Map:** It **omits** geography. It does not claim the Thames is dry; it simply chooses not to represent the river because it is irrelevant to the *topology* of the train lines. It is a silence.
  *   **Macro Model:** Rational Expectations does not **omit** human error; it **asserts** that errors are random and uncorrelated. It claims agents *cannot* be systematically fooled. This is not a silence; it is a positive falsehood about human cognition.
  *   **The Break:** Omitting a station makes the map cleaner. Asserting a train travels faster than light makes the physics engine broken. If you build policy on a map that ignores the river, you might walk a bit far. If you build policy on a model that assumes people cannot be panicked, you will be helpless when a bank run occurs.

  #### B. Navigation vs. Engineering
  *   **Tube Map:** The map is for **navigation**. The trains run regardless of whether you understand the engine. The system is exogenous to the rider.
  *   **Macro Model:** Economics is **engineering**. The "trains" (markets) are driven by the agents *inside* the model. If the model assumes agents are rational, and you implement a policy based on that, agents may react to the policy itself (The Lucas Critique).
  *   **The Break:** A Tube Map doesn't change the track layout because you looked at it. An economic model can change the economy because policymakers believe it. If the model lies about the engine (human behavior), the engineering fails.

  #### C. Robustness to Stress
  *   **Tube Map:** If a tunnel floods (Thames rises), the map is temporarily wrong, but the geography remains. You can update the map.
  *   **Macro Model:** If the "perfect market" assumption cracks (e.g., 2008 Liquidity Crisis), the model doesn't just need an update; it often lacks the *variables* to describe the crisis. A model with no friction cannot describe a skid.
  *   **The Break:** The Tube Map simplifies a stable system. Macro models often simplify the *instability* out of the system, rendering them useless precisely when they are needed most.

  ### 3. Does the "Harmless Assumptions" Conclusion Survive?

  **No.** The conclusion that unrealistic assumptions are harmless relies on **Empirical Adequacy** (does it predict?) over **Structural Truth** (is the mechanism real?).

  1.  **The Equifinality Trap:** You can get the right prediction for the wrong reason. If a model predicts inflation correctly because of luck, but assumes a mechanism (perfect markets) that doesn't exist, it will fail when the regime changes.
  2.  **The Goodhart's Law Problem:** When a measure becomes a target, it ceases to be a good measure. If you assume markets are efficient and deregulate based on that assumption, you may *create* inefficiencies (monopolies, crises) that the model said were impossible.
  3.  **Cognitive Falsehoods:** Assuming agents are rational isn't like assuming a ball is a sphere (a simplification of shape). It is like assuming the ball is made of water (a falsehood of substance). If you kick a water-ball, it behaves differently than a leather ball. If you tax a "rational" agent, they respond differently than a "human" agent.

  **Verdict:** The assumptions are not harmless; they are **domain-limiting**. They tell you where the model *cannot* go. Friedman's error is treating them as universally harmless rather than conditionally useful.

  ### 4. A Less Misleading Analogy: The Flight Simulator

  The Tube Map implies the economy is a fixed network you travel *through*. A better analogy for macroeconomics is a **Flight Simulator**.

  | **Flight Simulator** | **Macro Model** |
  | :--- | :--- |
  | **Physics Engine** | Microfoundations (Rationality, Preferences) |
  | **Visual Scenery** | Empirical Data (GDP, Inflation rates) |
  | **Pilot Training** | Policy Formulation |
  | **Crash Test** | Economic Crisis / Recession |

  **Why this works better:**
  1.  **Mechanism Matters:** In a flight simulator, you can simplify the scenery (omit stations). But you **cannot** lie about the aerodynamics (human cognition/market structure). If the simulator assumes wings generate lift in a vacuum, the pilot will crash when they fly a real plane.
  2.  **Stress Testing:** A simulator is judged not just by smooth flights, but by how it handles turbulence. A macro model that assumes away volatility (perfect markets) is like a simulator that removes storm clouds. It trains pilots for sunny days only.
  3.  **Idealization vs. Falsehood:**
      *   *Valid Idealization:* Ignoring the color of the seats (irrelevant details).
      *   *Fatal Falsehood:* Assuming gravity is 50% weaker (fundamental mechanism error).
      *   *Friedman's Error:* Claiming that as long as the plane stays on the runway in the simulation, it doesn't matter if the gravity setting is wrong.

  **The Takeaway for Your Professor:**
  You can accept Friedman's point that *all* models simplify (the simulator is not the plane). But you must reject the claim that *any* simplification is permissible. Simplifications of **irrelevant details** (Tube Map style) are fine. Simplifications of **causal mechanisms** (Flight Simulator physics) are fatal. Rational Expectations is often the latter, not the former.
