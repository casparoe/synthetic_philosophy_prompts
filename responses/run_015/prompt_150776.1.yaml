  **METROPOLITAN RAIL COMPLIANCE**
  **OFFICE OF FORESIGHT ALLOCATION (OFA)**
  **STANDARD OPERATING PROCEDURE 742-B**
  **SUBJECT: CAUSALITY CLASSIFICATION AND MITIGATION PROTOCOLS**
  **DATE: 14 OCT 2023 | REVISION: 4.2**

  **1.0 PURPOSE**
  To establish compliance parameters for Rostered Operators (OP) regarding mortality events during scheduled transit operations. This document codifies the distinction between Intended Outcomes and Foreseen Side Effects under Regulation 12 (Double Effect).

  **2.0 SCOPE**
  Applies to all OPs managing diversion levers and all Maintenance Personnel classified as Positioned Parties (PP). PP presence on active tracks is pre-authorized under Maintenance Schedule 9. OPs are reminded that track occupancy is a fixed variable of the published timetable.

  **3.0 INTENT ZONING (THE FIVE-METRE RULE)**
  3.1 Causality is determined by spatial proximity between the OP and the PP at the moment of lever actuation.
  3.2 **Zone A (>5.0 metres):** Mortality events occurring where the OP is separated from the PP by more than 5.0 metres are classified as Foreseen Side Effects. These are administratively permissible provided total PP loss does not exceed projected quotas.
  3.3 **Zone B (≤5.0 metres):** Mortality events occurring within 5.0 metres are classified as Direct Intent. Zone B engagements require prior written authorization from the Office of Foresight Allocation. Unauthorized Zone B engagements constitute a Class 4 Compliance Breach.
  3.4 Measurement shall be conducted via laser rangefinder prior to diversion.

  **4.0 MANUAL HANDLING AND KINETIC UTILIZATION**
  4.1 Physical intervention involving PP displacement is strictly prohibited.
  4.2 Utilization of a PP as kinetic mass (e.g., pushing from a footbridge) constitutes Unauthorized Use of Personnel as Equipment. This is non-compliant regardless of mortality reduction outcomes.
  4.3 Mortality events resulting from lever diversion remain compliant provided Section 3.0 proximity standards are met. The method of PP cessation (impact vs. crush) is irrelevant to compliance status.

  **5.0 TERTIARY EFFECTS**
  5.1 A Tertiary Effect is defined as a mortality event that is a foreseen consequence of an action that is itself merely foreseen.
  5.2 OFA audit cycles cover Intended Outcomes and Foreseen Side Effects only.
  5.3 Documentation of Tertiary Effects is optional. Liability for Tertiary Effects resides outside the remit of current regulatory frameworks. OPs are advised that chain-of-causation reporting terminates at the secondary vector.

  **6.0 REPORTING**
  6.1 All Zone A events must be logged in Form DDE-1 within 24 hours.
  6.2 Zone B events require immediate suspension of OP duties pending Inquiry Board review.

  **REVISION HISTORY**
  *Rev 4.0:* Clarified tertiary liability exemptions.
  *Rev 4.1:* Updated laser rangefinder calibration standards.
  *Rev 4.2:* Redefined PP status under Maintenance Schedule 9.

  **DISTRIBUTION LIST**
  Safety Committee, Legal Counsel, Operations Management, Office of Foresight Allocation.

  ***

  **What's being sent up**

  This memo institutionalizes the Doctrine of Double Effect (DDE), which distinguishes between intended harms and merely foreseen side effects. Section 3.0 exaggerates the "intention" criterion by converting a mental state into a physical measurement (the Five-Metre Rule). In standard ethics, proximity often influences moral intuition (why pushing feels worse than pulling a lever), but here it becomes a rigid regulatory threshold.

  Section 4.0 targets the "means vs. side effect" distinction central to the Footbridge Case. DDE argues you cannot use a person as a means to save others (pushing the man), even if the outcome matches the Trolley Case (diverting the train). The memo treats this as a manual handling violation, framing the moral prohibition as an equipment usage policy.

  Section 5.0 satirizes the regress problem in foresight. If I foresee A, and A causes B, is B intended? The "Tertiary Effect" clause mimics how bureaucracies limit liability by drawing arbitrary lines around causal chains, treating complex moral responsibility as an audit boundary. Finally, the definition of "Positioned Parties" normalizes the background conditions of the thought experiment, treating the people on the tracks as scheduled inventory rather than unexpected victims.
