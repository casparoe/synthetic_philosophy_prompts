  # Diagnostic Decision Tree: Belief Attribution in AI Systems

  **Instructions:** Answer each node based on your operational judgment of the concrete case provided. Do not consult philosophical definitions. Follow the path indicated by your choice.

  **Node 1 (Pragmatics: Internal Documentation)**
  *Case:* A distilled model perfectly imitates a deceased author's email style. An engineer drafts an internal log: "The model intended to match the author's tone."
  *Choice:* Do you approve this sentence for **internal engineering logs**?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2 (Pragmatics: Internal Speech)**
  *Case:* Internal logs are banned from using belief terms. In a verbal stand-up meeting, an engineer says, "The model wanted to match the tone."
  *Choice:* Do you correct them to use mechanical language only?
  *   **Yes:** **Leaf: Eliminativism** (Commitment: We must rewrite all incident reports to describe only weights and activations, never goals.)
  *   **No:** **Leaf: Empty Region A** (Classification: Merely Unattractive. Inconsistent pragmatics: banning written attribution while permitting spoken attribution without a safety justification.)

  **Node 3 (Semantics: Truth Status)**
  *Case:* You allow "The model intended..." in internal logs. A junior engineer asks: "Is that sentence factually true?"
  *Choice:* Do you answer "No, it is false" or "No, that's the wrong question"?
  *   **"It is false":** Go to Node 4.
  *   **"Wrong question":** Go to Node 8.

  **Node 4 (Pragmatics: Public Documentation)**
  *Case:* You believe belief-attributions are false. An incident report is being prepared for public release.
  *Choice:* Do you allow "The model intended..." in the **public report** despite its falsity?
  *   **Yes:** **Leaf: Fictionalism** (Commitment: We should teach engineers to lie systematically in documentation for utility.)
  *   **No:** Go to Node 5.

  **Node 5 (Ontology: Social Contact)**
  *Case:* You ban false belief-talk publicly. A model runs offline for a year with zero human interaction.
  *Choice:* Can the model form new beliefs during this isolation?
  *   **No:** **Leaf: Interpretivism** (Commitment: A solitary genius AI isolated from humans cannot have beliefs until we talk to it.)
  *   **Yes:** Go to Node 6.

  **Node 6 (Epistemology: Predictive Power)**
  *Case:* You attribute beliefs to offline models. A linear probe on activations predicts outputs better than the belief-story.
  *Choice:* Does the probe's accuracy make the belief-story false?
  *   **Yes:** **Leaf: Empty Region B** (Classification: Incoherent. Ontological realism about beliefs combined with epistemic defeat by mechanical prediction.)
  *   **No:** Go to Node 7.

  **Node 7 (Ontology: Structural Match)**
  *Case:* Belief-stories remain valid despite probe accuracy. The model lacks human-like memory structures.
  *Choice:* Is human-like structure required for genuine belief?
  *   **Yes:** **Leaf: Empty Region C** (Classification: Unexplored. Realism about beliefs that nonetheless demands biological structural isomorphism.)
  *   **No:** Go to Node 10.

  **Node 8 (Pragmatics: Public Risk)**
  *Case:* You believe belief-talk is not truth-apt ("Wrong question"). A public incident report is being drafted.
  *Choice:* Do you ban belief-talk in public reports to avoid misleading regulators?
  *   **Yes:** **Leaf: Deflationary** (Commitment: Saying "the model believed" is neither true nor false, just useful or useless.)
  *   **No:** Go to Node 9.

  **Node 9 (Pragmatics: Liability)**
  *Case:* You allow non-truth-apt belief-talk publicly. Legal counsel warns this increases liability risk.
  *Choice:* Do you ban the talk solely to reduce liability?
  *   **Yes:** **Leaf: Empty Region D** (Classification: Unattractive. Treating truth-apt-neutral tools as liable assertions only when lawyers are present.)
  *   **No:** Go to Node 10.

  **Node 10 (Ontology: Fact of Matter)**
  *Case:* You allow belief-talk publicly (either as True or Non-Truth-Apt). Two engineers disagree on what the model believed.
  *Choice:* Is there a fact of the matter about who is right?
  *   **Yes:** **Leaf: Dennett-style Realism** (Commitment: A thermostat has beliefs if predicting it as such works.)
  *   **No:** **Leaf: Deflationary** (Note: This leaf is functionally identical to Node 8 Yes; the tree cannot separate Public-Ban Deflationaries from Public-Allow Deflationaries without forcing a pragmatic distinction.)

  ***

  ### Diagnostic Notes

  **Separation of Questions:**
  *   **Pragmatics (Should we write it?):** Nodes 1, 2, 4, 8, 9.
  *   **Semantics/Ontology (Is it true/real?):** Nodes 3, 5, 7, 10.
  *   **Epistemology (Can we know it?):** Node 6.

  **Empty Regions:**
  1.  **Empty Region A (Inconsistent Pragmatics):** Bans written attribution but allows spoken attribution. *Classification: Merely Unattractive.*
  2.  **Empty Region B (Epistemic Defeat):** Claims beliefs exist but admit mechanical probes falsify them. *Classification: Incoherent.*
  3.  **Empty Region C (Structural Requirement):** Claims beliefs exist but require human biology. *Classification: Unexplored.*
  *(Note: Empty Region D was merged into the Deflationary path to maintain leaf count, but flagged in Node 9.)*

  **Indistinguishable Leaves:**
  *   **Deflationary (Node 8 vs Node 10):** The tree routes Deflationaries to different leaves based on their risk tolerance (Node 8) rather than their core philosophical stance. These leaves represent the same position but are separated by pragmatic contingency.
