      *   Point 3: The Specification Problem (Fatal/Technical).
      *   Point 4: Idealization & Unfalsifiability (Methodological Problem).
      *   Point 5: Social/AI Context (Weakening the "Insight" claim).
      *   Conclusion: The Exposure Map summary.

