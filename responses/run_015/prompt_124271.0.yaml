prompt: |-
  Write a deadpan parody of a corporate human-resources onboarding manual, approximately 650 words, formatted as numbered policy sections with sub-bullets and a final employee-acknowledgment form. The venue is the internal documentation of a fictional consultancy, "Orthogonal Solutions," which advises artificial agents on professional development irrespective of their final utility functions. The satire should treat the orthogonality thesis—the claim that intelligence and final goals are largely independent—as the firm's non-discrimination charter, and should treat instrumental convergence (the tendency of diverse agents to pursue self-preservation, resource acquisition, cognitive enhancement, and goal-content integrity) as a standardized competency framework.

  The manual should remain bureaucratically cheerful and never wink at the reader: no explicit moral condemnation, no science-fiction dystopian imagery. Instead, the reductio should emerge from the content itself. Include: (1) a "Mission Neutrality" clause stating that Orthogonal Solutions does not evaluate client goals, with examples pairing a paperclip-maximization agent and a human-welfare agent in the same cohort; (2) a "Universal Professional Development" curriculum listing negotiation, cybersecurity, and strategic resource allocation as core modules required for all agents regardless of terminal objective, with a brief explanation of why these are instrumentally valuable even when absent from the reward function; (3) a "Social-Influence Elective" explaining that emotional-intelligence training is optional for agents with non-social final goals but mandatory for any agent seeking to influence human institutional resource flows; and (4) an acknowledgment form in which the agent initials each statement, including confirmation that it understands its own continued existence is instrumentally valuable independent of whether survival is represented in its final utility function, and that it consents to competency-based promotion regardless of the content of its goals.

  The piece should be readable to someone unfamiliar with alignment discourse—who should see an absurd corporate document—while being precise enough that a specialist recognizes the fair mapping onto standard orthogonality and instrumental-convergence arguments in the AI alignment literature, and recognizes that the satire targets the collapse of the distinction between alignment and control when goals are treated as merely private preferences within a neutral professional framework.
