answer: |-
  Let's sit down and unpack this. You've done the hard work already: you've collected the data points. Dr. Ferris is indeed running a specific theoretical framework, and your flatmate is right to smell "Contextual Integrity" (CI) in the air. That comment in Case 5 ("what the setting licences") is the smoking gun. In privacy theory, that is shorthand for *context-relative informational norms*.

  However, before we lock that in, we need to be rigorous. A theory that fits six points might still break on the seventh. We need to test candidate rules against the full dataset, including the "hard" cases like Case 6 (the welcomed violation) and Case 2 (the harmless monitoring).

  ### Brainstorming Candidate Rules

  Here are the five strongest candidates that could generate her verdicts. I'll evaluate them against the "Quiet House" case as we go.

  1.  **The Harm Principle (Utilitarian):** Privacy is violated only if the subject suffers detriment (reputational, financial, psychological).
      *   *Fit:* Terrible. Fails Cases 2, 4, and 6 immediately (no harm/welcomed outcome). Ferris explicitly rejects harm as a necessary condition.
  2.  **The Secrecy/Concealment Rule:** Privacy is violated only if hidden information is revealed.
      *   *Fit:* Poor. Fails Case 1 (nothing hidden, no violation) and Case 2 (lights visible, yet violation). Ferris cares about *processing*, not just *secrecy*.
  3.  **Reasonable Expectation of Privacy (REP) + Purpose Limitation:** Privacy is violated if (a) there is a subjective/objective expectation of privacy AND (b) data is used beyond the specific purpose consented to.
      *   *Fit:* Good. Explains Case 1 (no REP on balcony) and Case 5 (purpose matched). Strains on Case 6 (did they expect inference?) and Quiet House (they signed the form). It relies too heavily on the validity of the consent form, which Ferris seems skeptical of (Case 6).
  4.  **Contextual Integrity (CI):** Privacy is violated when information flows violate the entrenched norms of a specific social context (actors, attributes, transmission principles).
      *   *Fit:* Excellent. Explains Case 5 (security context licenses CCTV). Explains Case 6 (transaction norms do not license inference/marketing). Explains Case 2 (neighbor context does not license systematic logging).
  5.  **Power Asymmetry + Dignity:** Privacy is violated when a more powerful actor extracts information from a less powerful one in a way that undermines dignity/autonomy, regardless of consent.
      *   *Fit:* Strong. Explains Case 6 (Corp > Individual) and Quiet House (Association > Tenant). Strains on Case 2 (Neighbor vs. Neighbor is equal power, yet violation).

  **The Winner:** **Contextual Integrity (CI)** is the strongest fit, specifically a version that prioritizes *normative appropriateness* over *subjective consent*. However, to be thorough, we must pit it against **Rule 3 (REP + Purpose Limitation)** because that is the standard legal doctrine (like GDPR) and the one most likely to confuse students. The key divergence is how they treat the "Signed Form" in Quiet House. CI says norms override boilerplate consent (see Case 6). REP+Purpose might say the form validates the use.

  ### Analysis of "Quiet House"

  *   **The Monitoring:** The context is "Home/Tenancy." The norm is "Sanctuary/Safety." The transmission principle is "Data flows to Association *for Safety*."
      *   *The Breach:* Using safety data for *Financial Risk* (rent arrears) violates the transmission principle. It changes the context from Care to Commerce/Enforcement.
      *   *The Consent:* Under CI (and Ferris's Case 6), signing a form does not legitimize a flow that violates contextual norms. The consent is likely "coercive" (condition of tenancy) and "broad" (not specific to the new purpose).
      *   *Verdict:* Violation.
  *   **The Noticeboard:** The context is "Building Administration." The norm is "Confidentiality regarding individual tenants."
      *   *The Breach:* Publishing specific flat data (even anonymized, if identifiable by pattern) shifts the flow to "Public/Social." This allows neighbors to judge/surveil each other (like Case 2).
      *   *Verdict:* Violation (Distinct from the monitoring, as it's a secondary dissemination breach).

  ### The Discriminating Case

  To separate **Contextual Integrity** from **REP + Purpose Limitation**, we need a case where the *Purpose* is technically met, but the *Contextual Norm* is breached.

  *   **Case:** A University uses student library borrowing data (collected for "educational resource management") to identify students with "radical political views" and flags them to the campus security team for "safety monitoring."
  *   **Why it works:**
      *   **REP + Purpose:** Might say *No Violation*. The purpose is "safety/management," the student is in a university context, and they likely signed a general data policy.
      *   **Contextual Integrity:** Says *Violation*. The norm of the "Library/Academic" context is intellectual freedom. Flowing that data to "Security/Policing" violates the transmission principle of the academic context, regardless of the stated safety purpose.
      *   **Ferris's Likely Verdict:** Violation (aligns with Case 4's strict professional boundaries).

  ### Silences and Limitations

  Be honest in your essay: CI is descriptive of *norms*, but where do the norms come from? Ferris hasn't explained how we adjudicate when norms are contested (e.g., is "safety" a norm of housing that overrides "sanctuary"?). Also, CI is silent on the *phenomenology* of surveillance—the "chill" Mrs. Achebe feels isn't just about norms; it's about the feeling of being reduced to a data point. Finally, CI doesn't fully address the *observer* (the neighbor reading the board). Is their privacy violated by knowing? Ferris hasn't touched on the privacy of the *watcher*.

