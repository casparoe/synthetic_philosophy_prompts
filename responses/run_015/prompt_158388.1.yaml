      3. This approach directly resolves the covenantal reciprocity worry by granting religious accommodation upfront, removing the conditional burden on citizens to translate their convictions before the state offers respect.
      4. Staff will be trained to record these objections faithfully without adjudicating theological validity, ensuring the record reflects community values without privileging specific doctrines.
      5. By welcoming whole persons into the hearing room, we strengthen civic trust rather than enforcing a neutrality that functions as exclusion.

