      *   *Actually, looking at the prompt:* "Engage seriously with the best argument on the losing side." If I recommend allowing scripture, the losing side is the "secular reframing" side (Rawlsian public reason/democratic equality). If I recommend secular reframing, the losing side is the "scripture allowed" side.
