      *Refining Point 3 (Pastor's Worry):* The pastor said religious citizens owe secular translations *only if* the state owes them religious accommodation in return. By allowing scripture, the state is offering accommodation, so the citizens don't owe translation. This respects the logic of the worry.
      *Refining Point 2 (Losing Side):* The losing side is the "force secular reframing" side. Their best argument is democratic equality/corruption of the process. I need to make sure I don't dismiss it lightly.
