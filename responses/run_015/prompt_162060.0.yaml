      *   *Draft Bottom Line:* Bradley's regress is vicious because it reveals that relational constituents cannot ground propositional unity without presupposing it, and the trope-theoretic attempt to halt the regress either covertly assumes the unity it seeks to explain or collapses into a non-relational ontology of facts.

