answer: |-
  **Project Title:** Non-Empirical Assessment and the Measure Problem: Credence, Consensus, and Investment

  **Project Description**

  The debate regarding non-empirical theory assessment (NETA) in high-energy physics and cosmology has reached a stalemate. Defenders argue that structural virtues—such as the absence of alternatives or unexpected explanatory coherence—can legitimately raise the probability that a theory is true. Critics counter that without empirical data, confirmation is conceptually impossible. Both sides, however, agree on the *output* variable: they assume the sole function of NETA is to raise an individual agent's credence in the truth of the theory. This proposal argues that this agreement is the source of the impasse. I posit that NETA performs three distinct functions: (A) raising individual credence in truth; (B) narrowing the range of rationally permissible credences across a community, thereby reducing legitimate disagreement; and (C) altering the expected value of further investment in a research programme, regardless of truth claims.

  The central research question is determinate: **Is non-empirical assessment coherent for theories that are not "measure-definite"?** In the context of the string landscape and eternally inflating multiverse, the measure problem suggests that the theory assigns no determinate probability to observable outcomes. If likelihoods are undefined, standard Bayesian confirmation (Function A) is arguably unstateable. The standard defence of NETA relies on a meta-inductive argument: we trust these arguments now because similar arguments worked for past theories that were eventually tested. However, this defence presupposes that the past theories had well-defined likelihoods waiting to be discovered. If the measure problem is structural rather than technical, the current case lacks the very feature that justified the meta-inductive inference in the past. Thus, the project asks: does the collapse of Function (A) due to the measure problem entail the collapse of Functions (B) and (C)? Or can a community rationally narrow its option space and allocate resources to a programme even when individual credence in truth cannot be formally updated?

  **Gap in Existing Positions**

  Current literature leaves this question open because it lacks the vocabulary to distinguish these three outputs. Critics successfully target Function (A), noting that evidence without data is contradictory. Defenders respond by attempting to salvage Function (A) through Bayesian reconstruction. Neither side addresses Function (B), which treats the "no-alternatives" argument not as a claim that the theory is likely true, but as a claim that the set of live options is smaller than previously thought. This reading is immune to the "best of a bad lot" objection, as it makes no claim about the quality of the lot, only its size. Furthermore, neither side adequately addresses Function (C) in the absence of (A). If the measure problem renders likelihoods indeterminate, the meta-inductive warrant evaporates. The project will demonstrate that the debate has conflated the *rationality of pursuit* with the *probability of truth*, a conflation that becomes fatal when likelihoods are structurally unavailable.

  **Methodology and Work Plan**

  The project will execute a tripartite methodology over twelve months, capped to ensure philosophical analysis remains primary over technical cosmology.

  *Months 1–3: Formal Reconstruction.* I will construct a single formal framework modeling the three argument types (no-alternatives, meta-induction, explanatory coherence) as different functionals of one underlying model. Function (A) will be modeled as standard Bayesian updating. Function (B) will be modeled using imprecise probabilities or sets of credence functions to represent community permissibility. Function (C) will be modeled as a decision-theoretic expected utility calculation where the payoff is scientific progress rather than truth. This formalization allows me to test whether (B) and (C) mathematically reduce to (A) or remain distinct when likelihoods approach indeterminacy.

  *Months 4–6: The Measure Problem Analysis.* I will analyze the measure problem not to solve it, but to classify its philosophical type. The crux sub-question is whether the measure problem is a lack of physical likelihoods or a problem of self-locating, indexical evidence. If the latter, imprecise probability frameworks may rescue Function (A). If the former, Function (A) collapses. I will consult with cosmologists to ensure the technical description is accurate but will strictly limit this work to the implications for confirmation theory, avoiding the trap of attempting to derive a measure myself.

  *Months 7–9: Historical Case Study.* To test the meta-inductive premise, I will examine a historical case where a theory was supported on non-empirical grounds before well-defined empirical consequences were available. The atomic hypothesis prior to 1905 serves as the primary candidate. I will reconstruct the argument structure used by proponents at that time to determine if it relied on defined likelihoods (undermining the analogy to the multiverse) or on community consensus and investment rationales (supporting the distinction between B/C and A). If no suitable analogue exists, this will be recorded as a positive finding: that the current epistemic situation is historically novel, rendering the meta-inductive defence invalid.

  *Months 10–12: Synthesis and Writing.* The final quarter will be dedicated to drafting the deliverables.

  **Deliverables**

  The primary deliverable is a substantial paper (approx. 10,000 words) titled *"Assessment Without Likelihoods,"* aimed at philosophy journals. It will argue that Functions (B) and (C) remain robust even when Function (A) is disabled by the measure problem, provided the distinction is formally maintained.

  The secondary deliverable is a shorter companion piece (approx. 3,000 words) titled *"Resource Allocation in the Landscape,"* aimed at working physicists. This piece will bypass the semantic debate over "science" versus "non-science." Instead, it will address the practical question of how a field should allocate effort when empirical feedback loops are severed. It will argue that if Function (B) holds (the option set is genuinely narrow), continued investment is rational as a strategic monopoly, even if Function (A) (truth credence) is suspended. This speaks directly to the panel's physicists by offering a normative framework for research policy rather than a demarcation criterion.

  **Risk and Failure Modes**

  I offer an honest account of the project's vulnerability. First, the tripartite distinction may prove illusory. If the formal modeling in Months 1–3 demonstrates that Functions (B) and (C) mathematically collapse into Function (A) under rigorous scrutiny, the central thesis fails. Second, the cosmology literature may converge on a standard measure during the fellowship. If the measure problem is resolved technically, the "measure-definite" constraint evaporates, and the project loses its specific urgency, though the formal framework would remain applicable to future cases. Third, the historical case study may yield no analogue. If it turns out that all past successful non-empirical assessments relied on well-defined likelihoods, this would indicate that the current reliance on NETA is historically discontinuous with past practice. While this would undermine the meta-inductive defence, it would still constitute a significant philosophical finding: that the appearance of continuity is an illusion. In any of these scenarios, the project will produce a determinate conclusion regarding the limits of non-empirical assessment, ensuring the fellowship yields value even if the initial hypothesis is refuted.

  **Scope and Feasibility**

  The obvious risk in this domain is scope creep into technical cosmology. To mitigate this, the proposal caps the technical work at the level required to classify the *type* of indeterminacy involved in the measure problem. I will not attempt to derive measures or evaluate specific string vacua. The focus remains strictly on the epistemic and decision-theoretic consequences of that indeterminacy. This ensures the project is executable within twelve months by a philosopher of science, delivering a rigorous analysis of the rationality of research investment in the absence of empirical data.
