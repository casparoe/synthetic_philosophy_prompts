answer: |-
  ### Case Study: The Terminal Classic Southern Maya Lowlands (c. 800–950 CE)

  **The Empirical Baseline**
  Consider the archaeological horizon surrounding the abandonment of major political centers in the Petén Basin (e.g., Tikal, Calakmul, Caracol). The material record presents a synchronized bifurcation:

  1.  **Cessation:** The erection of limestone stelae depicting divine kings (*k'uhul ajaw*) stops abruptly. Construction of monumental architecture (temples, palaces) halts. The inflow of non-local prestige goods—specifically highland obsidian and Motagua Valley jade—drops to negligible levels, indicating the severance of long-distance exchange networks controlled by the elite.
  2.  **Persistence:** In the same stratigraphic layers, local ceramic traditions (e.g., utilitarian wares, Fine Orange types) show stylistic continuity rather than replacement. Domestic architecture (perishable structures on low stone platforms) remains occupied. Soil chemistry and phytolith data indicate continuous *milpa* (swidden) agriculture. Small-scale caching rituals and household ancestor veneration persist without interruption.

  Both the "Collapse" and "Transformation" accounts accept this dataset as accurate. They agree on the drought conditions, the soil exhaustion, and the chronology. They disagree on what constitutes the *death* of the society.

  ***

  ### Narrative A: The Collapse of the Tributary State
  **The Argument:** This account defines the Maya "civilization" as synonymous with its **centralized political superstructure**. The society is understood as a complex engine designed to extract surplus labor and grain to support monument construction, elite consumption, and ritual warfare.

  *   **Interpretation of Evidence:** The cessation of stelae and monuments is read as the **failure of the extraction mechanism**. The drought and soil exhaustion raised the cost of mobilizing labor beyond the threshold of legitimacy. The kings could no longer guarantee rain or victory; thus, the social contract broke.
  *   **The Meaning of Continuity:** The persistence of domestic pottery and agriculture is viewed as **epiphenomenal residue**. The peasants survived, but the *system* that gave their labor meaning (the state) died. The break in obsidian and jade trade signifies the loss of complexity and specialization.
  *   **The Verdict:** This is a demographic and institutional catastrophe. The population may have remained, but the *society* (defined as the state) committed suicide. The post-900 CE landscape is a "post-collapse" wilderness.

  ### Narrative B: The Transformation of the Agrarian Substrate
  **The Argument:** This account defines the Maya "civilization" as the **reproducing population and its adaptive strategies**. The state is viewed as a contingent, perhaps parasitic, layer that emerged during the Classic period but was not essential to Maya identity or survival.

  *   **Interpretation of Evidence:** The cessation of stelae and monuments is read as a **strategic shedding of overhead**. When environmental stress increased, the population deliberately or adaptively decentralized to reduce risk. Monumental construction was recognized as a maladaptive drain on resources.
  *   **The Meaning of Continuity:** The persistence of ceramics, domestic architecture, and agrarian rituals is the **primary signal of societal continuity**. The break in obsidian and jade trade signifies a shift from prestige-based economies to subsistence-based resilience. The society didn't die; it molted.
  *   **The Verdict:** This is a political reorganization. The "collapse" is only visible if one privileges the elite perspective. For the majority of the population, the Terminal Classic may represent a liberation from tributary burdens, resulting in a more sustainable, albeit less "complex," equilibrium.

  ***

  ### The Conceptual Hinge: The Ontological Equivalence of State and Society

  The divergence between these accounts does not rest on empirical data, but on a single conceptual hinge: **Whether hierarchical governance is a necessary condition for societal continuity.**

  1.  **The Collapse Account** operates on the premise that **Society = State**. It assumes that high-energy complexity (monuments, long-distance trade) is the normative apex of human organization. Therefore, the loss of centralization is inherently a loss of *being*. In this framework, "collapse" performs the explanatory work of marking a **teleological failure**. It posits that history has a direction (toward complexity) and that the Maya deviated from it. The category of collapse is necessary here to explain why a "higher" form of order ceased to function.
  2.  **The Transformation Account** operates on the premise that **Society = Population**. It assumes that resilience and reproduction are the normative criteria for success. Centralization is merely one strategy among many. In this framework, "reorganization" performs the explanatory work of marking a **structural adaptation**. It posits that history is cyclical or situational. The category of collapse is rejected here because it imposes a value judgment (Centralization = Good) onto a process that was functionally successful for the survivors.

  ### The Explanatory Risk

  The category of **Collapse** performs specific work that **Reconfiguration** cannot replicate: it accounts for the **loss of specialized knowledge and collective capacity**. If the society is defined by its ability to coordinate thousands of laborers or maintain trade networks over hundreds of kilometers, then "reorganization" obscures the reality that this capacity was permanently lost. "Collapse" correctly identifies that a specific type of social energy dissipated and did not return.

  However, the category of **Collapse** risks imposing a **teleological narrative of failure** onto a process of **structural reconfiguration**. By labeling the Terminal Classic a "collapse," the analyst privileges the perspective of the stone-cutters and the kings over the perspective of the maize-growers and the potters. It treats the state not as a tool used by the society, but as the society itself. Consequently, the survival of the population is rendered invisible, categorized merely as "survivors of a catastrophe" rather than "agents of a new order."

  **Conclusion**
  The disagreement is not about whether the monuments stopped (they did) or whether the people stayed (they did). The disagreement is about **what counts as the subject of history**. If the subject is the *Polity*, the evidence proves Collapse. If the subject is the *People*, the evidence proves Transformation. The tension lies in deciding whether the death of an institution constitutes the death of the society that built it, or merely the society's decision to stop building it.
