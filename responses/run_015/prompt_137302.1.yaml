prompt: |-
  Quick bit of context before the question: I sit on the program committee of a small foundation that funds conceptual work in philosophy with a long shelf life — no lab budget, no empirical research unless someone makes a really good case for it, and we hand out people rather than grants, so about eight person-years over four years in epistemology next cycle. Hinge epistemology — the literature that grew out of Wittgenstein's late notes on certainty, Moore-style propositions, hinge commitments, the idea that some things stand fast for us without being justified — is on the shortlist, and I'm the one who has to argue for or against it. My own background is nowhere near this (my PhD was decision theory-adjacent and I've never been able to get through a Wittgenstein commentary), so I need an agenda I can defend to the rest of the committee in terms they'll understand, not a tour of the secondary literature.

  Here's my rough map of the area, which you should feel free to correct or replace: (1) whether being a hinge is a property of a proposition at all, or only of a proposition-as-it-figures-in-some-practice — my hunch is that this is upstream of everything else, but I can't tell whether it's a real question or just a terminological decision; (2) what a friend who works on this calls hinge drift: cases where a proposition seems to get promoted from ordinary empirical status to something hinge-like, or demoted back again (whether anyone has traveled to the moon, how old the earth is, the reliability of some measuring instrument), and whether there is any normative story about when a hinge should be demoted or whether asking that is just confused; (3) the acquisition-and-deference problem — if hinges are arational and not the sort of thing that gets justified, what exactly is transmitted when a child picks up a community's hinges from testimony, and is that a genuine puzzle or does it dissolve once you're careful; (4) whether any of this answers the regress argument against the skeptic or quietly changes the subject; (5) an applied line I half-invented, call it hinge capture: if a community's hinges aren't grounded in reasons, is there any room left for criticizing it when a school curriculum, a propaganda apparatus, a religious community, or increasingly the output of an AI system ends up setting them — and is that a real implication of the view or an abuse of it; (6) the apparently empirical material about wholesale collapse of certainties, people who lose an entire framework at once in severe delusion or depersonalisation or after leaving a high-control group, and whether that's evidence about hinges or a category mistake.

  What I want is a defended agenda for those eight person-years. Which three or four lines of work should get them, in what order, and on what criteria — how much of the rest depends on each, whether it's tractable in three or four years by someone working alone at a desk, whether it's already crowded or actually neglected, and how you weigh those when they conflict, which they will. Three things I care about most: which single question, if someone cracked it, would change what the other questions even are; which implications of hinge epistemology people oversell, the ones that sound great in a funding abstract but don't actually follow and should not be used to sell this to my committee; and what kind of result over the next two or three years would move something up or down your ranking, since we'll likely have a second round and I'd like to have built-in update conditions. One more worry I can't shake and want you to take seriously rather than reassure me about: if hinges really are outside the space of reasons, it's not obvious there is anything left for an epistemologist to say about them, as opposed to an anthropologist or a therapist. Tell me whether that's a reason to fund this area, a reason to fund it with a different framing, or a reason to put the person-years elsewhere. Prose is fine, tables if they help, and please skip anything like a reading list or who's-written-what — I can't read it all and what I need is the reasoning behind the ordering.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Context:**
      *   **Role:** Program Committee member of a small foundation.
      *   **Mission:** Funds conceptual work in philosophy with long shelf life (no lab budget, minimal empirical).
      *   **Resource:** 8 person-years over 4 years (approx. 2 PhDs or 1 Senior + 1 Junior, or 4 Postdocs).
      *   **Topic:** Hinge Epistemology (Wittgensteinian *On Certainty*, Moorean propositions, arational foundations).
      *   **User's Background:** Decision theory-adjacent, not a Wittgenstein scholar. Needs an agenda defensible to colleagues (likely analytic philosophers, some perhaps skeptical of "Wittgensteinian" vagueness).
      *   **User's Map:** Six points (Property vs. Practice, Hinge Drift, Acquisition/Deference, Skepticism/Regress, Hinge Capture/Normativity, Empirical/Psychological Collapse).
      *   **Constraints/Requests:**
          *   Defend an agenda (3-4 lines of work, ordered).
          *   Criteria: Tractability (desk work), Neglect vs. Crowding, Dependency (which question unlocks others).
          *   Specific Questions to Answer:
              1.  Which single question changes the others if cracked?
              2.  Which implications are oversold (don't fund based on these)?
              3.  Update conditions (what results move the ranking up/down?).
              4.  Address the "Anthropologist/Therapist" worry (if outside space of reasons, is it philosophy?).
          *   Format: Prose/Tables okay. No reading lists.

  2.  **Evaluate the User's Map (The Six Points):**
      *   *(1) Property vs. Practice:* This is metaphysical/semantic. Crucial. If hinges are just propositions, it's one thing; if they are functional roles, it's another.
      *   *(2) Hinge Drift:* Historical/dynamic. Important for applying the theory to science/history.
      *   *(3) Acquisition/Deference:* Social epistemology/Developmental. How do we get them?
      *   *(4) Skepticism/Regress:* The traditional motivation. Is it a solution or a dissolution?
      *   *(5) Hinge Capture (Normativity/Politics):* Critical theory/Political epistemology. Very hot right now, but risky if the theory can't support normativity.
      *   *(6) Empirical/Psychological:* Borderline empirical. Might violate the "no empirical research" rule unless purely conceptual analysis of the *concept* of collapse.

  3.  **Address the "Anthropologist/Therapist" Worry (The Elephant in the Room):**
      *   *The Worry:* If hinges are arational foundations, epistemology (study of justification/knowledge) seems to have nothing to say.
      *   *The Counter:* Epistemology isn't just justification; it's the architecture of rationality. Understanding the *limits* of the space of reasons is a philosophical task (transcendental argument, conceptual geography). However, if the project devolves into *describing* specific hinges (e.g., "what are the hinges of QAnon?"), that *is* anthropology/sociology.
      *   *Verdict:* This is a reason to fund *with a different framing*. The framing must be "The Normative Structure of Arational Commitments" rather than "The Sociology of Belief." The philosopher analyzes the *logic* of the framework, not the *content* of specific frameworks.

  4.  **Determine the "Keystone" Question:**
      *   Which question, if answered, changes the others?
      *   It's *(1) Property vs. Practice* (Functionalism vs. Propositionalism).
      *   *Why?* If hinges are intrinsic properties of propositions (e.g., "The Earth exists" is *always* a hinge), then Drift (2) is impossible, Capture (5) is hard (how do you change a necessary truth?), and Acquisition (3) is learning facts.
      *   If hinges are functional roles (a proposition *acts* as a hinge in context $C$), then Drift is central, Capture is a political struggle over function, and Acquisition is learning a practice.
      *   *Decision:* The Functional/Contextual view is the dominant contemporary reading (Moyal-Sharrock, Coliva, etc.), but it needs rigorous formalization to avoid "anything goes." This is the bottleneck.

  5.  **Identify Oversold Implications:**
      *   *Oversell 1:* "Hinge Epistemology Solves Skepticism." (It usually dissolves it or sidesteps it; claiming a 'solution' is often dogmatic).
      *   *Oversell 2:* "Hinge Epistemology Grounds Political Critique." (If hinges are arational, how do you criticize bad hinges without begging the question? This is the "Hinge Capture" problem. Selling it as a tool for social justice without solving the normativity problem is dishonest).
      *   *Oversell 3:* "It Explains Cognitive Science." (Too empirical for this foundation).

  6.  **Develop the Agenda (8 Person-Years):**
      *   *Constraint:* 4 years. 8 person-years.
      *   *Strategy:* Need high-impact conceptual work. Avoid empirical fieldwork. Avoid pure exegesis of Wittgenstein (shelf life issue).
      *   *Priority 1: The Metaphysics/Logic of Hinges (2-3 PY).* Address the "Property vs. Practice" and the "Anthropologist Worry." Needs to define the *logic* of hinge commitment.
      *   *Priority 2: The Dynamics of Change (2-3 PY).* Address "Hinge Drift" and "Capture." If hinges can change, how? This addresses the normativity worry.
      *   *Priority 3: The Social Transmission (2 PY).* Address "Acquisition."
      *   *Drop:* Pure Skepticism (too done/dead end), Pure Empirical/Psychological (violates mission).

      *Refining the Agenda:*
      *   *Project A (The Architecture):* Formal/Conceptual analysis of the "hinge role." Distinguishing it from presupposition, assumption, and belief. (2.5 PY)
      *   *Project B (The Dynamics):* Rationality of hinge revision. When *can* a hinge be questioned? (The "Drift" and "Capture" problem). (3.5 PY)
      *   *Project C (The Social):* Testimony and Hinges. (2 PY)
      *   *Total:* 8 PY.

      *Wait, let's optimize for the "Anthropologist Worry".*
      If the worry is valid, Project A is the only philosophy. Project B and C risk becoming sociology.
      *Correction:* Project B is crucial because if hinges *never* change, the theory is static and useless. If they *do* change, there must be higher-order norms. Finding those norms is the philosophical gold.
      *Revised Allocation:*
      1.  **The Logic of the Framework (3 PY):** Define the status. Is it a rule? A belief? A disposition? Solve the "Property vs. Practice" debate.
      2.  **The Normativity of Revision (3 PY):** Address "Drift" and "Capture." How to criticize hinges without circularity? This answers the "Anthropologist" worry by finding the *internal* criteria for framework shift.
      3.  **The Epistemology of Trust (2 PY):** Acquisition. How hinges transfer.

  7.  **Drafting the Response:**
      *   *Tone:* Professional, direct, strategic. Acknowledge the user's decision theory background (speak in terms of constraints, variables, optimization).
      *   *Structure:*
          1.  The "Anthropologist Worry" (Address first as it frames the funding decision).
          2.  The Keystone Question (Property vs. Practice).
          3.  The Oversold Claims (What to warn the committee about).
          4.  The Proposed Agenda (3 Projects, PY allocation, Rationale).
          5.  Update Conditions (Triggers for re-evaluation).

      *Refining the "Anthropologist Worry":*
      Don't dismiss it. Validate it. The risk is real. The mitigation is to frame the project as *Meta-Epistemology* or *Normative Architecture* rather than *Descriptive Epistemology*. We aren't studying *which* hinges people have; we are studying *what it is to have* a hinge and *under what conditions* it is rational to swap one.

      *Refining the Agenda:*
      *   *Project 1: The Status Question.* (Is it a rule or a belief?). If it's a rule, logic applies. If it's a belief, justification applies. This determines if there's a "space of reasons" at the limit.
      *   *Project 2: The Transition Problem.* (Drift/Capture). This is the most "funding-friendly" because it connects to AI/Politics, but it's the hardest philosophically. Needs the most time.
      *   *Project 3: The Social Vector.* (Acquisition). Less critical than 1 & 2, but fills out the picture.

      *Wait, 8 PY is a lot for 3 projects.* Maybe 2 large projects and 1 smaller? Or 4 Postdocs?
      Let's suggest 3 distinct research lines that can be staffed by Fellows.
      Line 1: Metaphysics of Hinges (The "What").
      Line 2: Dynamics of Hinges (The "Change").
      Line 3: Normativity of Hinges (The "Ought").
      Actually, 2 and 3 are deeply linked.
      Let's group them:
      1.  **Constitutive Norms (3 PY):** What makes a hinge a hinge? (Addresses Worry + Question 1).
      2.  **Rational Dynamics (3 PY):** How do hinges change legitimately? (Addresses Drift + Capture).
      3.  **Social Epistemology (2 PY):** Transmission.

      *Update Conditions:*
      *   Up: If Line 1 produces a formal model of hinge-function.
      *   Down: If Line 1 concludes hinges are merely psychological dispositions (reduces to cognitive science).
      *   Up: If Line 2 finds a non-circular criterion for hinge-revision.
      *   Down: If Line 2 concludes all hinge-change is arational power struggles (reduces to political science).

  8.  **Final Review against Constraints:**
      *   No reading lists? Check.
      *   Defend to committee? Check (focus on conceptual rigor).
      *   Address the "Anthropologist" worry seriously? Check.
      *   Order/Criteria? Check.
      *   Oversold implications? Check.

      *Self-Correction on "Anthropologist Worry":* I need to be careful not to say "Fund this because it's philosophy." I need to say "Fund this *only if* framed as X." If the applicants propose descriptive work, reject them. If they propose normative/conceptual work, accept. This is a crucial distinction for the PC member.

      *Self-Correction on "Oversold":* The "Anti-Skepticism" claim is the biggest trap. Wittgensteinians often claim to "dissolve" skepticism. But funding bodies want "progress." Need to warn the user that "dissolving" skepticism often looks like "ignoring" it to outsiders.

      *Final Polish:* Ensure the distinction between "Hinge as Proposition" vs "Hinge as Role" is clear, as this is the user's Point (1) and the actual keystone.

      *(Self-Correction during drafting)*: Make sure to explicitly answer the "Which single question..." prompt.
      Question: **Is 'hinge' a semantic property or a functional role?**
      Why: Determines if drift is possible, if capture is coercion or error, and if the anthropologist worry holds.

