          *Sen's Liberal Paradox* shows that no *decision function* (not just SWF) can satisfy Minimal Liberalism + Pareto + Unrestricted Domain without resulting in a cycle or a violation of one of the axioms.
          If you use pairwise majority voting, you often get Condorcet cycles. The friend says "dropping complete ranking... so the paradox only hits old-school SWF."
          *Correction:* Sen's theorem applies to Social Decision Functions too. If the result is a cycle, there is no "best" choice. If there is no best choice, the system fails to make a decision. The Liberal Paradox creates a specific type of cycle (or forces a Pareto violation). Simply saying "we don't need a complete ranking" doesn't solve the problem of *intransitivity* leading to no stable outcome. The friend thinks avoiding a complete ranking avoids the paradox. It doesn't; it just manifests as instability/cycling.
