answer: |-
  1. Dependency sequence
  Start with the silent writing exercise to instantiate the intuition of rule-guidance. Students must feel confident in their rule before that confidence is undermined. Next, establish the distinction between *seeming* right and *being* right. Only then introduce the skeptical argument: no past fact fixes future application. This creates the crisis of indeterminacy. The skeptical solution must follow this crisis; proposing community standards before establishing individual insufficiency renders the solution unmotivated. Finally, relocate correctness to communal assertibility. The sequence ensures the solution is seen as a rescue operation, not an arbitrary stipulation. The writing exercise primes the specific vulnerability: the gap between their written description and infinite future applications.

  2. The carrying example
  Use the tort standard of "reasonable care." Ask students to recall past judgments they made fitting this standard. The example must show that no finite list of past cases logically dictates the verdict in a novel scenario. It must lack any internal definition or mental image that settles every borderline case definitively. This avoids the abstract "plus/quus" trap by grounding indeterminacy in professional practice. It works for law students because it mirrors statutory interpretation and case law evolution. It connects to community agreement by showing that "reasonableness" is not discovered in the judge's mind but constituted by the legal community's acceptance of certain verdicts as correct. The meaning of "care" shifts with communal practice, not individual insight. Crucially, emphasize that no hidden mental state fixes the extension of the rule across time.

  3. Misconception map
  First, students will assume Kripke endorses meaning skepticism. Head this off immediately after stating the skeptical argument by clarifying the argument is presented as a puzzle to be solved, not a conclusion to rest in. Second, they will interpret indeterminacy as psychological uncertainty ("I forgot what I meant"). Intervene during the dependency sequence by emphasizing the logical gap between past facts and future use, not memory failure. State explicitly: "The problem is not that you are confused, but that confusion is impossible here." Third, they will conflate this with the Private Language Argument's attack on solipsism. Address this when introducing the skeptical solution: specify that the issue is not privacy but the *normativity* of meaning. Use the phrase "no fact of the matter" rather than "I cannot know." This distinguishes metaphysical indeterminacy from epistemic limitation. Fourth, they may view the communal solution as merely pragmatic compromise. Counter this by asserting community practice constitutes meaning, rather than merely verifying it; consensus does not find truth, it makes correctness possible.

  4. What to leave out
  Explicitly defer technical defenses of dispositionalism, as these require logic training this group lacks. Do not attempt to parse Wittgenstein's original text; rely on the Kripkean reconstruction suitable for this level. Avoid deep meta-ethical debates about the normativity of meaning versus truth conditions. State clearly that the goal is understanding the structure of the argument, not resolving all scholarly disputes. This prevents the session from becoming a history seminar or a logic workshop, keeping focus on the communal ground of meaning relevant to legal interpretation.

  5. Check for understanding
  Ask: "If you were the last person on earth, could you follow a rule?" An incorrect answer reveals they view the problem as psychological uncertainty or difficulty ("Yes, but I might make mistakes"). A correct answer reveals grasp of the skeptical solution ("No, because correctness requires a community to distinguish following from seeming to follow"). This distinguishes between thinking rules are merely hard to apply individually versus understanding that rule-following is constitutively social. It tests if they have relocated the ground of meaning from internal states to communal practice.
