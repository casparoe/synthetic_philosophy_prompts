      *   *Wait, if the noise is environmental, and I observe my noise, do I update on the distribution of noise in the multiverse?* Yes. That's the epistemic part.
      *   *But the cooperation part:* If their output is independent of mine due to noise, I can't "cooperate" in the ECL sense (acausal trade). I can only care about them altruistically.
