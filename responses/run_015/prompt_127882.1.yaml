answer: |-
  Here is the breakdown of your friend's logic, the prediction on the vineyard case, and the way to test her actual rule.

  ### The Prediction
  She is going to call the vineyard setup **unnatural chrematistike (bad)**.

  Even though the clay discs aren't universal money and don't earn interest, the key factor for her will be the **accumulation beyond need**. In her second verdict, she flagged "stacking up gold coins" as a major part of the problem. In the vineyard, people are accumulating claims on wine they physically cannot consume. For an Aristotelian, once acquisition detaches from actual use and becomes about endless stacking, it crosses the line into unnatural wealth-seeking, regardless of whether the token is gold or clay.

  ### The Two Competing Rules
  You suspected she's running a rule about purpose versus medium. You are right. There are two distinct frameworks that explain her first four verdicts perfectly but diverge on the vineyard.

  **Rule 1: The Teleological Limit (Purpose/Need)**
  *   **The Rule:** Economic activity is natural only if it is limited by the household's actual consumption needs. Anything acquired beyond what can be used is unnatural.
  *   **Why it fits the first four:**
      *   *Barter (Wheat/Shoes):* Meets immediate need. (Good)
      *   *Arbitrage (Gold):* Aimed at unlimited stacking, exceeds need. (Bad)
      *   *Medium (Silver for Leather):* Silver is passed through to meet needs, not kept. (Good)
      *   *Usury (Interest):* Creates unlimited growth from money, exceeds need. (Bad)

  **Rule 2: The Monetary Barrier (Medium/Instrument)**
  *   **The Rule:** Economic activity is natural only if it avoids universal, interest-bearing currency used for profit. Barter and specific labor vouchers are always natural; universal money seeking gain is unnatural.
  *   **Why it fits the first four:**
      *   *Barter (Wheat/Shoes):* No money involved. (Good)
      *   *Arbitrage (Gold):* Uses universal currency for profit. (Bad)
      *   *Medium (Silver for Leather):* Uses currency, but only as a passive measure, not for profit/accumulation. (Good)
      *   *Usury (Interest):* Uses currency to breed more currency. (Bad)

  ### Which Rule Is She Running?
  I would bet she is running **Rule 1: The Teleological Limit**.

  Here is why: Aristotle's core criticism in *Politics* isn't just about the tool (money); it's about the *end goal* (telos). He argues that nature sets a limit to household wealth because the purpose of wealth is use. If you have more than you can use, you are treating wealth as an end in itself, which is the definition of *chrematistike*.

  In her second verdict, she mentioned the starvation aspect, but she led with "stacking up gold coins." If she were strictly following Rule 2 (The Monetary Barrier), she might have focused solely on the arbitrage mechanism. But by highlighting the *stacking*, she signaled that the unlimited accumulation itself is the sin. The vineyard discs are functionally identical to gold coins in this scenario: they are being hoarded beyond the point of use. Therefore, under Rule 1, they are unnatural.

  ### The Tie-Breaker Case
  To prove which rule she is actually using, you need a case where the **Purpose** is bad (excess) but the **Medium** is good (no money).

  **The Case of the Physical Hoarder:**
  Imagine a farmer in a barter economy who grows 10,000 bushels of wheat. His family can only eat 100 bushels. He doesn't sell the wheat for money. He doesn't trade it. He doesn't lend it at interest. He simply stores it in a barn until it rots, year after year, because he loves having a big pile of wheat.

  *   **If she says this is Bad (Unnatural):** She is running **Rule 1 (Teleological Limit)**. The accumulation exceeds need, so it is unnatural, even without money.
  *   **If she says this is Good (Natural):** She is running **Rule 2 (Monetary Barrier)**. Since no universal currency or interest is involved, it counts as natural household management, regardless of the waste.

  Given her Aristotelian framing, she should call it bad. If she calls it good, she's prioritizing the instrument over the purpose.
