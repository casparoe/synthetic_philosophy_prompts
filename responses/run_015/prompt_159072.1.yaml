      Welcome everyone. I grew up here. My book is about this place. The strike was 100 years ago. People say it was violent. I say it was a refusal. When you stop working, the machine stops. That is not force. It is silence. People did this together. They promised each other. But not everyone could promise. Some had different fears. My aunt was one. We don't name her tonight. But she was here. The union is still here. That is the victory. Not that everyone agreed, but that those who did could stand together.

