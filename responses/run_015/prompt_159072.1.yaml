answer: |-
  Good evening.

  I grew up two miles from this hall. The stories of this town entered my blood before I understood what they meant. Like many of you, I carry the sound of this place in my head—the specific, heavy rhythm of the looms on Foundry Street. It was a sound that told you time was passing, that work was being done, that the world was turning.

  When I sit down to write, I try to listen for that rhythm. But tonight, I am not here to talk about the noise. I am here to talk about the silence.

  One hundred years ago, that noise stopped. The machines did not break. The building did not fall. The silence happened because the people who made the noise decided, together, to withhold the one thing the machines could not generate on their own: their own effort.

  We gather to honor that silence. But history often tries to tidy up silence. It turns a complex human event into a statue. It draws a line between the righteous and the wrong, the walkers and the workers. I have spent years writing about this town, trying to resist that tidiness. Because the truth of this strike, and the truth of this union, is not found in a perfect unanimity. It is found in a specific kind of moral courage.

  There is a distinction that matters, though we rarely name it. There is a difference between preventing someone from working and refusing to work yourself. When a worker lays down a shuttle, she is not breaking the machine. She is not physically stopping the neighbor at the next loom. She is removing her own labor from the equation. She is saying, "I will not do this." That is a refusal. It is an act of negative liberty—the freedom to withhold one's self.

  For a hundred years, the argument from the other side has been that this refusal is a form of force. They say that when you stop, you coerce the owner, the community, the other workers. But a machine waiting for a hand is not a victim. It is simply idle. The moral weight of the strike rests on that distinction. It rests on the right to say "no" without having to justify it as an act of aggression.

  And yet, a single "no" is easily ignored. A single silence is just a pause. The power of 1924 was not in the individual refusal, but in the concerted one. It was the agreement to withhold together. This is the miracle of a union: it allows separate people to bind their wills in advance, to act as a single body without becoming a single mind.

  I know the historians in the room understand the fragility of that agreement. To act together requires trust. It requires believing that your neighbor will also lay down the shuttle. But it does not require that every single person in the building must move in the same rhythm for the refusal to be valid.

  We have a program tonight that lists the names of those who walked out. It is a sacred list. Those names represent risk, sacrifice, and a belief in a future they might not live to see. I honor every name on that paper. But I also know that the floor of the mill was not a binary place. There were those who stayed.

  In my own family, there was a woman who stayed on the floor through those weeks. The stories differ on why. Some say she was frightened. Some say she had already given her notice and was working out her days. We do not know, exactly. And tonight, I will not speculate. But I will say this: the moral claim of the strike does not depend on erasing her.

  If we claim that the majority has the right to bind the minority absolutely, to force the rhythm of the loom upon every single pair of hands, we surrender the very ground we stand on. We become the coercion we accuse the owners of being. The strength of this movement is not that it compelled everyone to walk. It is that it allowed those who could walk to do so without shame, and to protect one another while they did it.

  There is a free rider problem, yes. We know that. If some benefit from the wage you fought for without sharing your risk, the math is uneven. But the solution to that imbalance cannot be a lie about human will. We cannot pretend that four hundred workers were a single moral agent with a single will. They were four hundred people, making four hundred calculations under pressure. The victory was not that they all agreed. The victory was that enough of them agreed to change the world.

  To the current owners of the plant, who are here tonight: You run a different mill now. The machines are newer, the staff is smaller. But the fundamental transaction remains. You need the work, and they give it. When they give it together, they are not asking for a favor. They are offering a partnership that requires consent.

  To the retirees and the grandchildren: You are the keepers of the silence. You know that the union did not survive because it was perfect. It survived because it was necessary. It provided a structure where a refusal could be spoken without ending a life.

  I want to leave you with this. When we tell the story of this strike to the next generation, do not tell them it was a war where everyone picked a side and stayed there. Tell them it was a moment when the town realized that labor is not a commodity that is sold, but a part of the self that is lent. And because it is the self, it can be taken back.

  The strength of this town was never in the uniformity of its voice, but in the courage it took to raise it, and the grace to understand why some voices trembled.

  The loom waits for the hand. The hand belongs to the worker. And the worker belongs to herself. That is the legacy of Foundry Street. That is the work that remains.

  Thank you.
