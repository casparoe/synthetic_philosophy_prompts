  4.  **Navigating the Constraints:**

      *   *Constraint:* No "free rider" talk. *Solution:* Talk about the weight of the choice instead.
      *   *Constraint:* No "majority binds minority." *Solution:* Focus on the power of the *agreement* between those who joined, not the enforcement on those who didn't.
      *   *Constraint:* Nora. *Solution:* Frame her as part of the complex reality of the town, not an antagonist. Maybe frame the strike not as a monolith but as a moment of fracture that eventually healed into memory.
