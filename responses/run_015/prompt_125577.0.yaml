  6.  **Addressing Specific Prompt Requirements:**
      *   *Dependency Chain:* SCA -> Failure -> Mask vs. Fink distinction (Timing/Location).
      *   *Example Justification:* Why Drone > Poison.
      *   *Misconception Order:* Trigger vs. Block -> Fink vs. Mask -> Reality of Unmanifested -> AI mapping.
      *   *Check Question:* Needs to be non-philosophical. Safety engineering or AI eval.
      *   *Refusals:* Lewis's reformed conditional analysis, detailed possible worlds semantics.
      *   *Contingencies:* What if they reject dispositions entirely? (Humean skepticism).

  7.  **Final Polish (Pedagogical Tone):**
      *   Keep it authoritative but practical.
      *   Ensure the distinction between Fink and Mask is the *centerpiece*.
      *   Make sure the AI folks feel spoken to without alienating the Phil Sci folks.

  8.  **Self-Correction on the User's Example:**
