  **BUREAU OF LINGUISTIC COORDINATION**
  **MEMORANDUM OF PROCEDURE 74-B**

  **TO:** All Registered Linguistic Agents
  **FROM:** Director E. K. Rand, Office of Semantic Stability
  **DATE:** 14 October 2023
  **SUBJECT:** Compliance with Lewisian Coordination Parameters

  1.  **Regularity of Behaviour.** All agents must maintain a logarithmic log of communicative acts. Deviation from established population regularities exceeding a threshold of 5% per quarter will be classified as uncoordinated noise. Agents found utilising non-standard phonemes without prior authorisation must submit a Deviation Justification Form (DJF-9) within three working days.

  2.  **Conditional Preference.** Agents are required to demonstrate that their preference for conformity is conditional upon the conformity of others. To verify this, citizens must file Utility Function Declarations proving they would only adopt the greeting ritual 'Good Morning' if they possessed reasonable belief that interlocutors were doing likewise. Evidence of unconditional moral commitment to politeness will be rejected as non-conventional and subject to audit.

  3.  **Common Knowledge.** To satisfy the common knowledge requirement, all parties entering a communicative exchange must jointly file a Common-Knowledge Disclosure Form (CKDF-1) prior to speech acts. This form certifies that Agent A knows that Agent B knows that Agent A intends to conform. Failure to notarise this recursive epistemic state renders any subsequent agreement void *ab initio*.

  4.  **Arbitrariness.** Agents must confirm that the coordinating solution adopted was arbitrary. If evidence suggests a greeting was chosen due to inherent acoustic superiority rather than historical accident, the convention is deemed invalid. Citizens must attest that 'Hello' was selected over 'Ahoy' solely due to precedent, not utility.

  5.  **Embedded Convention Agents.** It has come to the Bureau's attention that certain agents possess dispositions to conform that are constituted by the very convention they are meant to coordinate. To rectify this circularity, a 'Pre-Conventional Reset' is hereby mandated for all embedded agents. This procedure wipes existing dispositions to allow for fresh coordination. However, agents are advised that the directive to undergo this reset must itself be common knowledge to function as a convention. Consequently, the successful execution of the Reset dissolves the common knowledge required to recognise the Reset as authoritative. Agents must therefore navigate this epistemic void while remaining compliant. Failure to reset due to the paradoxical dissolution of coordinating knowledge will be treated as wilful non-compliance.

  6.  **Enforcement.** Dialect divergence shall be treated as a contractual breach requiring mandatory arbitration. The Bureau reserves the right to impose standardised syntax where conditional preferences are deemed insufficiently interdependent.

  By order of the Office of Semantic Stability.

  ***

  **Commentary on Lewisian Orthodoxy**

  In David Lewis's *Convention* (1969), several core elements are settled. Lewis establishes that conventions are solutions to recurrent coordination problems characterised by regularity in behaviour, a conditional preference for conformity (agents prefer to conform only if others do), common knowledge of these conditions, and arbitrariness (there exists an alternative regularity that could have served instead). He also firmly distinguishes convention from explicit agreement; conventions arise from mutual expectation rather than promise.

  However, significant philosophical contestation remains. Firstly, it is disputed whether conventions can bind agents who lack the right kind of reasons for conformity, such as moral obligations distinct from coordination utility. Secondly, scholars debate whether the arbitrariness condition undermines the normative force of conventions; if a norm is arbitrary, critics argue, it lacks the grounding to obligate compliance beyond mere prudence. Finally, the stability of common knowledge under reflexive embedding is genuinely contested. As the memo illustrates, if an agent's disposition is constituted by the convention, attempting to model this formally can destabilise the common-knowledge requirement, creating paradoxes regarding whether the agent can recognise the convention as a convention without presupposing the very dispositions in question. There is no consensus on whether Lewis's model can accommodate these reflexive loops without revision.

  Summary: The Bureau mandates a procedural reset to verify linguistic conventions, unaware that the reset destroys the shared knowledge required to authorise the procedure itself.
