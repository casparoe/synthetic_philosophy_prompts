answer: |-
  ### Exam Prompt

  **Course:** PHI 605: Intergenerational Ethics
  **Assessment:** Final Take-Home Examination
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,000 words maximum

  **Question:**

  Consider the **Perturbation-Resilient Nonidentity (PRN)** condition. In classic Non-Identity Problems (NIP), distinct policy choices result in numerically distinct future populations, blocking person-affecting harm claims. The PRN condition modifies this by asking whether the *actual set* of future persons is invariant under $\epsilon$-perturbations (marginal adjustments) to present resource-allocation parameters. If the set of persons remains invariant despite marginal policy shifts, moral obligation is argued to attach to that *invariance class* rather than to the particular identities within it.

  Write an essay determining whether the PRN framing **dissolves**, **relocates**, or **intensifies** the classic tension between *harm-to-none* (no specific individual is made worse off than they would otherwise be) and *wrong-to-none* (the act is nonetheless morally objectionable) arguments.

  In your analysis, you must:
  1.  Explicate how PRN alters the counterfactual baseline for harm.
  2.  Determine if obligations to an "invariance class" are coherent without invoking impersonal principles.
  3.  Conclude with a definitive stance on the fate of the tension (dissolve, relocate, or intensify).

  *Note: This question tests your application of structural logic. Do not rely on exegesis of Parfit or other external bibliography; argue from the mechanics of the PRN definition provided.*

  ***

  ### Model Answer

  The Perturbation-Resilient Nonidentity (PRN) condition does not dissolve the tension between harm-to-none and wrong-to-none arguments; rather, it **relocates** the tension from the metaphysics of identity to the epistemology of policy thresholds. By shifting the moral locus from numerical identity to set invariance, PRN attempts to salvage person-affecting views, but in doing so, it generates a new normative boundary problem that intensifies the difficulty of defining moral obligations.

  Under the classic Non-Identity Problem, the tension arises because the counterfactual baseline for harm is non-existence. If Policy A creates Person $x$ with a life worth living, and Policy B would have created Person $y$, $x$ cannot claim harm from A, even if $x$'s life is significantly impoverished compared to $y$'s potential existence. The "harm-to-none" claim holds because $x$ is not worse off than $x$ would otherwise be (since otherwise, $x$ would not be). The "wrong-to-none" claim persists because Policy A seems intuitively unjust.

  PRN attempts to resolve this by positing an $\epsilon$-range where policy variations do not alter the set of future persons. Within this range, the counterfactual baseline shifts from *non-existence* to *alternative welfare states of the same identities*. If resource allocation parameter $r$ can vary by $\epsilon$ without changing who is born, then a reduction in $r$ that lowers welfare constitutes a genuine person-affecting harm. The specific individuals in the invariance class are worse off than they would have been under a different parameter setting within the same resilient set. Superficially, this dissolves the harm-to-none problem: harm is now calculable across identical identities.

  However, this dissolution is illusory because it relies on the stability of the invariance class. The tension is not removed; it is relocated to the boundary of the $\epsilon$-perturbation. We must ask: at what point does a resource adjustment cease to be a perturbation and become an identity-altering transformation? If moral obligation attaches to the invariance class, we face a discontinuity problem. A policy shift of $\epsilon$ creates an obligation to specific persons; a shift of $\epsilon + \delta$ creates a completely different set of persons, potentially voiding the obligation under person-affecting views. This creates a "cliff-edge" morality where infinitesimal changes in resource allocation toggle the existence of moral victims.

  Furthermore, the claim that obligation attaches to the "invariance class" rather than particular identities risks collapsing back into impersonal principles, which PRN seeks to avoid. If I owe a duty to the *set* of persons invariant under $\epsilon$, but not necessarily to the specific token individuals if the set shifts, I am prioritizing the structure of existence over the welfare of the existents. This intensifies the wrong-to-none tension. It suggests that the wrongness of a policy might lie in its disruption of identity stability rather than the suffering it causes. If a policy improves total welfare but alters the identity of the future population (exceeding $\epsilon$), does it violate the obligation to the invariance class? If so, PRN privileges identity continuity over welfare maximization, a counterintuitive normative result.

  Consequently, PRN relocates the classic tension. The "harm-to-none" issue is resolved only within the arbitrary bounds of $\epsilon$, while the "wrong-to-none" issue resurfaces as a question of why the boundary of $\epsilon$ is morally significant. The structural mechanics of PRN reveal that the Non-Identity Problem is not merely about different people, but about the lack of a stable subject for moral comparison across significant policy choices. By attempting to force stability through $\epsilon$-perturbations, PRN highlights that person-affecting views require a metaphysical continuity that public policy cannot guarantee. The tension remains because the invariance class is a theoretical construct that fails to map onto the discrete, chaotic causality of human reproduction. Thus, PRN intensifies the difficulty by making the moral status of future persons contingent on the precision of our resource parameters rather than their intrinsic welfare.

  ***

  ### Marking Scheme

  **Total Points:** 25
  **Grading Logic:** Points are awarded for successful execution of the five analytical moves below. Deductions are applied for specific failure modes associated with each move.

  | Analytical Move | Points | Characteristic Failure Mode (Deduction Trigger) |
  | :--- | :---: | :--- |
  | **1. Baseline Reconfiguration:** Correctly identifies that PRN shifts the harm counterfactual from *non-existence* to *alternative welfare states of the same identities* within the $\epsilon$-range. | 5 | Conflating modal invariance with actual-world identity persistence (treating $\epsilon$ as guaranteeing identity across all policies). |
  | **2. The Dissolution Limit:** Acknowledges that PRN only resolves the harm claim *within* the invariant set, failing to address policy shifts that exceed $\epsilon$. | 5 | Treating the wrong-to-none claim as a simple empirical observation rather than a normative structure dependent on the boundary. |
  | **3. The Invariance Coherence:** Evaluates whether attaching obligation to a "class" rather than "tokens" covertly reintroduces impersonal principles (Person-Affecting Restriction violation). | 5 | Asserting that class-based obligation is strictly person-affecting without justifying how a set can be a moral patient. |
  | **4. The Verdict (Dissolve/Relocate/Intensify):** Provides a definitive classification of the tension's fate, supported by the preceding analysis (e.g., arguing it relocates to the boundary problem). | 5 | Sitting on the fence (e.g., "it does both") without explaining the structural interaction between the two outcomes. |
  | **5. Normative Implication:** Identifies the counterintuitive result that moral status becomes contingent on the precision of resource parameters (the "cliff-edge" problem). | 5 | Ignoring the causal chaos of reproduction in favor of abstract set theory (treating the model as ontologically real). |
