  ### Part 1: The Six Branch Questions

  These questions are designed to be answered "Yes" or "No" by a panelist based on evidence, not philosophy. They are ordered to filter out legal/structural constraints before evaluating moral/historical value.

  1.  **Physical Constraint:** "Is physical removal, alteration, or destruction of this object prohibited by law, protected status, or immediate physical danger?"
  2.  **Financial Covenant:** "Is the object's name or existence guaranteed by a binding financial or legal agreement that we cannot break without severe penalty?"
  3.  **Active Harm:** "Does the object's presence in this specific location cause active, documented dignitary harm to a protected group of citizens today?"
  4.  **Site-Specificity:** "Does moving this object destroy the historical truth it is meant to tell, or has public use of the site overwritten its original dedication?"
      *   *Note for Panelists:* This question captures **commemorative drift** (if the truth changes) and **use-capture** (if public use overwrites dedication). If the object *must* stay here to make sense, or if people *already* use it for something else, answer "Yes."
  5.  **Curatorial Value:** "Does the object possess artistic, material, or archival value independent of its commemorative message?"
  6.  **Permanence Principle:** "Should public honor require periodic re-authorization to remain valid?"

  ---

  ### Part 2: The Logical Space and Leaves

  The tree functions as a filter. **Question 6 is an override:** If the answer to Q6 is **Yes**, the case routes immediately to the **Leasehold** leaf, regardless of previous answers. If Q6 is **No**, the case proceeds through Q1–Q5 to determine physical disposition.

  Below are the nine valid leaves generated by the combinations of answers. Combinations not listed here are **Empty Leaves** (diagnosed in Part 3).

  #### 1. Leasehold Protocol
  *   **Path:** Q6 = Yes.
  *   **Most Awkward Commitment:** We must admit that our current judgment might be wrong in ten years and budget for this argument to happen again.
  *   **Move Off This Leaf:** New evidence shows that periodic re-argument causes more social instability than the monument itself.

  #### 2. Constrained Retention (Physical)
  *   **Path:** Q6 = No, Q1 = Yes.
  *   **Most Awkward Commitment:** We are keeping something potentially harmful because a bird or a law says we cannot touch it.
  *   **Move Off This Leaf:** The legal protection is lifted or the physical danger (e.g., the nest) is resolved.
  *   **Live Case:** *The Courthouse Obelisk.* (Protected structure + bird nest = Q1 Yes).

  #### 3. Constrained Retention (Financial)
  *   **Path:** Q6 = No, Q1 = No, Q2 = Yes.
  *   **Most Awkward Commitment:** We are allowing a dead donor's contract to override our current community values.
  *   **Move Off This Leaf:** The endowment terms are legally renegotiated or the funds are forfeited.
  *   **Live Case:** *The School Name.* (Endowment requires name in perpetuity = Q2 Yes).

  #### 4. Unconditional Retention
  *   **Path:** Q6 = No, Q1 = No, Q2 = No, Q3 = No.
  *   **Most Awkward Commitment:** We are asserting that no group currently finds this object harmful, which may silence minority objections.
  *   **Move Off This Leaf:** A protected group provides documented evidence of active dignitary harm caused by the object.

  #### 5. Retention with Added Context
  *   **Path:** Q6 = No, Q1 = No, Q2 = No, Q3 = Yes, Q4 = Yes.
  *   **Most Awkward Commitment:** We are betting that a plaque can neutralize harm without erasing history.
  *   **Move Off This Leaf:** Evidence shows that adding context increases the object's visibility and thereby increases the harm.
  *   **Live Case:** *The Governor Statue.* (Harm = Sterilization; Site-Specific = Hospital still named after him/History tied to location).
  *   **Live Case:** *The Pioneer Monument.* (Harm = Dispossession; Site-Specific = Grandparents' memory tied to this specific granite).

  #### 6. Removal to Museum
  *   **Path:** Q6 = No, Q1 = No, Q2 = No, Q3 = Yes, Q4 = No, Q5 = Yes.
  *   **Most Awkward Commitment:** We are treating a harmful object as "art" to justify keeping it in storage behind glass.
  *   **Move Off This Leaf:** A museum refuses the object due to lack of curatorial capacity or ethical concerns.

  #### 7. Relocation to Private/Less Prominent Ground
  *   **Path:** Q6 = No, Q1 = No, Q2 = No, Q3 = Yes, Q4 = No, Q5 = Yes (Low Threshold).
  *   **Most Awkward Commitment:** We are moving a problem rather than solving it, potentially burdening a private owner.
  *   **Move Off This Leaf:** No private owner or less prominent public site is willing to accept the object.
  *   **Note:** This leaf is logically adjacent to *Removal to Museum*. The distinction is often merely whether a public institution wants it (Museum) or a private entity does (Relocation).

  #### 8. Removal to Storage
  *   **Path:** Q6 = No, Q1 = No, Q2 = No, Q3 = Yes, Q4 = No, Q5 = Yes (Archival Only).
  *   **Most Awkward Commitment:** We are spending public money to store an object we refuse to show anyone.
  *   **Move Off This Leaf:** The object degrades to the point where storage costs exceed archival value.
  *   **Note:** This leaf is difficult to separate from *Relocation* using only these questions; the difference is often access (Storage = closed, Relocation = visible but quiet).

  #### 9. Destruction
  *   **Path:** Q6 = No, Q1 = No, Q2 = No, Q3 = Yes, Q4 = No, Q5 = No.
  *   **Most Awkward Commitment:** We are erasing physical evidence of history to prevent current harm.
  *   **Move Off This Leaf:** New historical research emerges that makes the object vital evidence for a truth previously unknown.

  ---

  ### Part 3: Empty and Merged Leaves

  **Empty Leaf Diagnosis:**
  There are 64 theoretical combinations of answers ($2^6$). Only 9 are valid leaves above. The rest are empty for three reasons:
  1.  **Incoherent (Q6 Override):** Any combination where Q6=Yes but the leaf is not *Leasehold*. (e.g., Q6=Yes, Q1=Yes, Leaf=Constrained Retention). This is incoherent because the principle of periodic renewal overrides physical constraints (you can renew the *permission* for the constraint).
  2.  **Logical Exclusion (Constraint Hierarchy):** Any combination where Q1=Yes (Cannot Move) but the leaf is *Removal* (Museum/Storage/Destruction). This is incoherent; you cannot remove what you cannot move.
  3.  **Unattractive/Untried:** Combinations where Q3=No (No Harm) but the leaf is *Removal*. (e.g., Q3=No, Q5=No, Leaf=Destruction). This is coherent but unattractive; no panel would destroy a harmless object simply because it lacks artistic value. These paths are routed to *Unconditional Retention* by default.

  **Merged Leaves:**
  *   **Relocation vs. Storage:** These two leaves cannot be rigorously separated by the six questions provided. Both share the path (Harm=Yes, Site=No, Value=Yes). The distinction relies on external factors (is there a buyer? is there a museum slot?) rather than the object's properties. I have listed them separately to satisfy the protocol requirements, but panelists should treat them as a single "Removal with Preservation" category if no specific destination is immediately available.

  ---

  ### Part 4: Concept Placement and Tie-Breaker

  **Concept Placement:**
  *   **Use-Capture:** This belongs at **Question 4 (Site-Specificity)**. If skaters use a monument as a ramp, the "historical truth" of the site is now "skate park," not "dedication." Answering "Yes" to Q4 acknowledges that the site's function has drifted.
  *   **Commemorative Drift:** This also belongs at **Question 4**. If the meaning of "Pioneer" has shifted from "heroic settler" to "agent of dispossession" while the stone stayed still, the "historical truth" dependent on location has changed. Q4 forces the panel to decide if the *original* truth is still the *only* truth.

  **Tie-Breaker Case:**
  The hardest distinction to maintain is between **Removal to Museum** and **Relocation**. Both require Harm=Yes, Site=No, Value=Yes.
  *   **Case:** A bronze bust of a 1950s Mayor who segregated the library system, sculpted by a famous local artist.
  *   **Separation:**
      *   *Route to Museum:* If the local history museum creates an exhibit on "The Era of Segregation" where the bust is used as evidence of the policy.
      *   *Route to Relocation:* If the bust is sold to a private collector who admires the *sculpture* but has no interest in the *policy*, and places it in a private garden.
      *   *Rule:* If the object is used to teach the history of the harm, it is a **Museum** case. If the object is kept *despite* the history of the harm (for art only), it is a **Relocation** case.
