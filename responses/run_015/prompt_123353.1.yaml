  *(Self-Correction on the "Confucian" aspect)*: I need to be careful not to lecture on Confucianism, but use the user's framing. The user calls it "Confucian-flavoured." I should stick to that. The key tension is "Role as Identity" vs. "Role as Relationship with Moral Content." Stevens treats Role as Identity (I am the Butler). The User's clauses treat Role as Relationship (I am the Butler *in service of* a Good).

  *(Final thought on the Pier Scene)*: The pier scene is about *evening*. It's about looking back. The philosophical theory is usually prospective (how should I act?). The novel is retrospective (what did my acting cost?). That's the unique contribution.

