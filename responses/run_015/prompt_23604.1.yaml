answer: |-
  Your working assumption is incorrect. While your premises are largely true, the conclusion that "iteration does no real work" is false. Iterated Elimination of Strictly Dominated Strategies (IESDS) **does** eliminate strategies beyond the first round, even when allowing for domination by mixed strategies.

  Here is exactly where your argument breaks down and the correct characterization of what IESDS guarantees.

  ### 1. Where the Argument Breaks Down

  Your argument relies on this equivalence:
  > *A strategy survives IESDS $\iff$ It is a best response to some belief in the **original** game.*

  This is false. The correct equivalence is recursive:
  > *A strategy survives IESDS $\iff$ It is a best response to some belief over the opponent's **surviving** strategies.*

  **The Breakdown Point:**
  You correctly noted that a strictly dominated strategy is never a best response to any belief. Therefore, in **Round 1**, IESDS eliminates exactly those strategies that are not a best response to any belief over the opponent's *original* strategy set.

  However, for **Round 2**, the definition of a "rational belief" changes. Because rationality is common knowledge:
  1.  Player 1 knows Player 2 is rational.
  2.  Player 1 knows Player 2 will not play a strategy eliminated in Round 1.
  3.  Therefore, Player 1's belief in Round 2 **must assign probability zero** to the strategies eliminated in Round 1.

  A strategy might be a best response to a belief in the *original* game (Round 1), but that belief might rely on the opponent playing a strategy that gets eliminated in Round 1. Once that opponent strategy is removed, the first strategy may no longer be a best response to *any remaining* belief. Thus, it gets eliminated in Round 2.

  ### 2. A Concrete Counter-Example

  Consider the following game. We will show that strategy **B** survives Round 1 (it is a best response in the original game) but is eliminated in Round 2.

  **Payoff Matrix (Player 1, Player 2):**

  | P1 \ P2 | L | M | R |
  | :--- | :---: | :---: | :---: |
  | **T** | 2, 1 | 2, 1 | 0, 0 |
  | **B** | 0, 0 | 0, 0 | 1, 2 |

  **Step 1: Check for Dominance in Round 1**
  *   **Player 2:** Compare $R$ against $M$.
      *   If P1 plays $T$: $M$ gives 1, $R$ gives 0.
      *   If P1 plays $B$: $M$ gives 0, $R$ gives 2.
      *   $R$ is not dominated by $M$ alone.
      *   *Wait, let's adjust the example to ensure R is dominated immediately to make the point clearer.*

  **Revised Payoff Matrix:**

  | P1 \ P2 | L | M | R |
  | :--- | :---: | :---: | :---: |
  | **T** | 2, **1** | 2, **1** | 0, **0** |
  | **B** | 0, **0** | 0, **0** | 1, **0** |

  *(Bold numbers are Player 2's payoffs)*

  **Round 1 Analysis:**
  1.  **Player 2:** Look at strategy $R$.
      *   Against $T$: $R$ yields 0. $L$ yields 1. $M$ yields 1.
      *   Against $B$: $R$ yields 0. $L$ yields 0. $M$ yields 0.
      *   $R$ is strictly dominated by $L$ (and $M$). $1 > 0$ and $0 \ge 0$ (Wait, strict dominance requires strict inequality everywhere).
      *   Let's fix P2's payoffs to ensure strict dominance.
      *   $L$: (1, 1), $M$: (1, 1), $R$: (0, 0).
      *   Now $R$ is strictly dominated by $L$. **$R$ is eliminated.**

  2.  **Player 1:** Look at strategy $B$.
      *   Is $B$ strictly dominated in the *original* game?
      *   $B$ yields 1 if P2 plays $R$. $T$ yields 0 if P2 plays $R$.
      *   Therefore, $B$ is a **Best Response** to the belief "Player 2 plays $R$ with probability 1".
      *   Because $B$ is a best response to *some* belief over the original strategies, **$B$ is NOT eliminated in Round 1.**

  **Round 2 Analysis:**
  *   Player 1 knows Player 2 is rational, so Player 1 knows $R$ will not be played.
  *   Player 1's beliefs are now restricted to the set $\{L, M\}$.
  *   Compare $T$ and $B$ against only $\{L, M\}$:
      *   Against $L$: $T$ gets 2, $B$ gets 0.
      *   Against $M$: $T$ gets 2, $B$ gets 0.
  *   Now, $T$ strictly dominates $B$.
  *   **$B$ is eliminated in Round 2.**

  **Conclusion:**
  Strategy $B$ was a best response to a belief in the *original* game (justifying its survival in Round 1), but it did not survive the full iteration. Your assumption that the final set equals the set of Round 1 best responses is proven false.

  ### 3. The Correct Characterization

  The set of strategies surviving IESDS corresponds to the concept of **Rationalizability** (specifically in 2-player games; in $n$-player games, IESDS is a subset of rationalizable strategies).

  A strategy $s_i$ survives IESDS if and only if there exists a sequence of beliefs consistent with **Common Knowledge of Rationality (CKR)**.

  Formally, let $S_i^0$ be the original set of strategies. Define $S_i^k$ as the set of strategies surviving $k$ rounds.
  $$S_i^k = \{ s_i \in S_i^{k-1} \mid \exists \text{ belief } \mu_{-i} \text{ over } S_{-i}^{k-1} \text{ such that } s_i \text{ is a BR to } \mu_{-i} \}$$

  The set of surviving strategies is $S_i^\infty = \bigcap_k S_i^k$.

  **Summary of the difference:**
  *   **Your Assumption:** Survivors = Best Responses to beliefs over $S_{-i}^0$.
  *   **Reality:** Survivors = Best Responses to beliefs over $S_{-i}^\infty$.

  Because $S_{-i}^\infty \subseteq S_{-i}^0$, the condition becomes stricter with every iteration. Allowing mixed strategies ensures that Round 1 is very powerful (it removes everything that isn't a best response to *any* probabilistic mix), but it does not stop the process from continuing in Round 2, 3, etc., as the support of permissible beliefs shrinks.
