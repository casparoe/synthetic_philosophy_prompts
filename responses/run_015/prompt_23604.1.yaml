              *   If R is gone, B is now strictly dominated by T.
              *   Result: B survives Round 1 (it's a BR to R), but is eliminated in Round 2.
      *   **Formal Characterization:**
          *   Connect to **Rationalizability**.
          *   In 2-player games: IESDS survivors = Rationalizable strategies.
          *   Definition: Strategies that survive common knowledge of rationality.
      *   **Mixed Strategies:** Acknowledge the user specified "allowing domination by mixed strategies." This strengthens the elimination (more things get eliminated), making the set smaller, reinforcing that iteration matters. (Actually, with mixed strategies, Round 1 eliminates everything that isn't a BR to *some* belief. Wait, let's check that).
      *   *Correction on Mixed Strategies:*
          *   Theorem: A pure strategy is strictly dominated (possibly by a mixed strategy) if and only if it is **not** a best response to any full-support belief (or any belief) over the opponent's strategies.
          *   So, in Round 1, we remove everything that is not a BR to *some* belief over the *original* set.
