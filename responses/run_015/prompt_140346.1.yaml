  1. To solve the grafting problem, the theory must define a unit of transmission that remains identifiable even when spliced into unrelated contexts, like a specific audio sample persisting across thousands of remixed videos despite changing visual backgrounds. Without a rule for tracking identity through blending, you are merely measuring noise, not lineage. **Tag: Non-negotiable.**

  2. To address the vacant-host problem, the framework must quantify variant fitness independently of carrier welfare, such as measuring the spread of a self-harming challenge among teens regardless of their health outcomes. If you cannot separate the variant's success from the host's survival, you revert to functionalist anthropology where everything exists because it helps the group. **Tag: Non-negotiable.**

  3. To escape the empty framework trap, you need a fidelity threshold that distinguishes genuine replication from mere influence, such as determining when a fashion tweak counts as a new mutation versus a manufacturing defect. Fieldworkers need a numeric cutoff where below a certain copying accuracy, the process is declared diffusion rather than evolution. **Tag: Preference of the strict replicator camp.**

  4. The theory must specify conditions under which cultural change is explicitly *not* evolutionary, such as a period of random drift in slang usage where no variant gains a transmission advantage over another. If every shift in behavior gets labeled as selection, the theory explains everything and predicts nothing. **Tag: Non-negotiable.**

  5. I believe Item 1 and Item 3 cannot be jointly satisfied because the moment you define a unit rigidly enough to track lineage, you exclude the blended realities of actual cultural transmission. You either get clean data on artificial categories or messy data on real phenomena, meaning the research programme collapses into either triviality or fiction.
