answer: |-
  My credence that a replayed history from 1400 CE yields a 1900 CE recognisably similar to ours is **0.62**.

  I land between you and your editor, but closer to the editor's determinism. The reason is not that I believe human agency is irrelevant, but that the "search space" for complex civilisation is narrower than the "contingency" narrative assumes. However, I believe your editor's 0.8 overestimates the inevitability of *political* forms, while your 0.45 underestimates the constraint of *material* conditions.

  Here is the decomposition of that 0.62, using your terms but refining the logic of how they interact.

  ### The Decomposition

  | Term | Proposition | Credence | Justification |
  | :--- | :--- | :--- | :--- |
  | **(1) Counterfactual Coherence** | The scenario is well-posed enough to have a truth value. | **0.90** | While chaos theory limits precision, "small perturbations" in 1400 (e.g., a death) are distinct from "magic" (e.g., aliens), allowing meaningful causal tracing. |
  | **(2) Geographic/Ecological Constraints** | Physical constraints (coal, latitude, disease) dominate accident at century scales. | **0.85** | Coal deposits, navigable rivers, and Eurasian axis do not move when a monarch dies; they dictate the *possibility* space for industrialisation regardless of regime. |
  | **(3) Institutional Momentum** | Once a specific institutional path (e.g., British Parliament) begins, lock-in preserves *that specific form*. | **0.40** | High lock-in actually *reduces* the probability of similarity in a replay; if the 1400 perturbation shifts the initial track, strong lock-in ensures we stay on the *wrong* track. |
  | **(4) Functional Convergence** | Different starting points converge on *our specific* institutional/technological solutions due to competitive pressure. | **0.65** | Competitive states must adopt effective tech (guns, steam), but political/cultural forms (liberalism, individualism) show multiple viable equilibria (e.g., Meiji Japan). |

  ### On the Independence of Terms (3) and (4)

  You asked whether (3) and (4) are independent. They are not; they are **competitors**.

  In the literature of complex systems, (3) describes a *path-dependent* landscape (many peaks, where you end up depends on where you started), while (4) describes a *convergent* landscape (one deep valley, where everyone rolls down regardless of start).

  *   If **(3) is high** (strong lock-in), the system is fragile. A small perturbation in 1400 locks you into a *different* equilibrium (e.g., a high-tech Song Dynasty equilibrium that never becomes capitalist). This *lowers* the probability of the "Yes" outcome in a replay.
  *   If **(4) is high** (strong convergence), the system is robust. Perturbations in 1400 are washed out by the gravitational pull of the "modern" attractor. This *raises* the probability of the "Yes" outcome.

  The standard debate often conflates these. Contingency advocates (like Gould) argue for high (3) and low (4). Determinism advocates (like your editor) argue for low (3) and high (4).

  For the world to be "recognisably similar" in a replay, we need **(4) to be high**. Relying on (3) to produce similarity is a category error: (3) explains why *our* history didn't deviate *after* 1700, not why a *replayed* history would arrive at the same 1700. My 0.40 credence in (3) reflects my belief that while institutions are sticky, they are not sticky enough to survive a 500-year divergence in initial conditions without the help of (4).

  ### Sensitivity and Evidence

  My overall figure of **0.62** is most sensitive to **Term (4): Functional Convergence.**

  If I become convinced that liberal democracy and individualism are not just Western accidents but functional necessities for advanced industrial coordination (perhaps via data showing that autocracies inevitably stagnate or collapse at high complexity), my credence rises toward 0.75. Conversely, if evidence mounts that high-tech, stable non-liberal equilibria are sustainable long-term (e.g., a successful, stable "digital Confucianism" that outperforms liberal democracies over a century), my credence drops toward 0.50.

  **Evidence that would move the number:**
  1.  **Comparative Modernisation:** Deep historical analysis of non-Western industrialisation attempts (e.g., the Ottoman Tanzimat, Qing Self-Strengthening). Did they fail due to *contingent* bad luck (supporting your view) or *structural* incompatibility (supporting the editor)?
  2.  **The "Great Divergence" Timing:** If new data suggests the economic divergence between Europe and China was driven by access to New World silver (contingent) rather than internal institutional quality (structural), that lowers (4) and raises the weight of accident.
  3.  **Future Trajectories:** If the 21st century shows a "re-convergence" of political forms globally, it suggests (4) is stronger than we think. If the world fractures into distinct, stable civilisational blocs with incompatible operating systems, (4) is weak.

  ### Diagnosing the Disagreement

  The gap between your **0.45** and your editor's **0.8** likely lives in the definition of "recognisably similar," specifically regarding **Term (3) vs. Term (4).**

  *   **You (0.45)** are likely interpreting "recognisably similar" to include *specific* political and cultural contours (e.g., liberal democracy, the specific map of Europe, the dominance of English). You are weighting **Term (3)** heavily: you see our current equilibrium as one of many possible locked-in states, easily missed if the 1400 dice roll differently. You see the *superstructure* as fragile.
  *   **Your Editor (0.8)** is likely interpreting "recognisably similar" as *material and functional* outcomes (e.g., industrial capacity, urbanisation, bureaucratic states, gunpowder empires). They are weighting **Term (2)** and **(4)** heavily: they believe geography and economic necessity force nations into similar shapes regardless of ideology. They see the *base* as robust.

  **The Synthesis:**
  You are both partially right because history has layers. The **base** (industrialisation, urbanisation, mass warfare) is highly convergent (Editor's view). The **superstructure** (liberalism vs. autocracy, specific borders, dominant language) is highly contingent (Your view).

  If your column defines "recognisably similar" as "a world of factories, nations, and mass media," the Editor wins (Credence > 0.75). If it means "a world of liberal democracies speaking English," you win (Credence < 0.45). The honest weight of evidence suggests a hybrid: a world that *functions* like ours, but might not *feel* like ours. That is where the 0.62 sits.
