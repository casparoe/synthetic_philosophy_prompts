answer: |-
  This configuration is a recognized, persistent, and notoriously difficult problem in formal epistemology and probability kinematics. It does not have a single universally accepted noun, but it is standardly referred to as **the problem of updating on uncertain conditional evidence**. In the literature, the tension you describe is often framed as the conflict between **Jeffrey Conditionalization** (treating the conditional as a proposition) and **Adams-style updating** (treating the conditional as a constraint on conditional probability).

  Your "four further observations" are not separate phenomena; they are symptoms of a single underlying structural ambiguity: **the Input Problem for Probability Kinematics**, specifically applied to conditionals.

  Here is the carving you requested: the names, the principled constraint, the unification of your observations, and the boundary cases.

  ### 1. The Name and The Nearest Concepts

  If you need a label for your reports or code, the most precise existing term is **"Kinematic Underdetermination of Conditional Evidence."** If you must coin a term for the specific configuration where the evidence form allows two distinct kinematic paths, call it **"The Conditional-Propositional Bifurcation."**

  The two readings you identified have established formal counterparts:

  *   **Reading 1 (Material):** **Jeffrey Conditionalization on a Material Conditional.** You treat the news as a shift in the probability of the proposition $\neg D \lor C$. You preserve the relative odds of all worlds compatible with that proposition.
  *   **Reading 2 (Conditional):** **Conditional Probability Kinematics (or MCE on Conditionals).** You treat the news as a direct constraint on the parameter $P(C|D)$. You preserve the odds of the antecedent ($D$ vs $\neg D$) and the odds within the negation of the antecedent.

  **Where established concepts stop short:**
  Standard textbooks present Jeffrey Conditionalization as the solution to uncertain evidence. However, they typically assume the evidence arrives as a shift in probability over a *partition* you have already defined. Your case reveals that when the evidence is *conditional in form*, the partition is not given by the logic of the proposition alone. You must choose whether the partition is $\{ \neg D \lor C, \neg(\neg D \lor C) \}$ (Reading 1) or whether the update is a constraint on the conditional parameter itself (Reading 2). Standard theory tells you *how* to update once the partition/constraint is chosen, but it is silent on *which* choice the linguistic form of the evidence mandates.

  ### 2. The Principled Constraint

  You asked for an analogue to "change nothing you are not forced to change." That analogue exists: **The Principle of Minimum Cross-Entropy (MCE)**, also known as Minimum Relative Information.

  MCE dictates that your posterior distribution $Q$ should minimize the Kullback-Leibler divergence from your prior $P$ ($D_{KL}(Q || P)$), subject to the constraints imposed by the evidence.

  **How MCE adjudicates your case:**
  MCE does not magically select Reading 1 or Reading 2. Instead, it forces you to explicitly state **what the constraint is**. The "carving" lies in the semantics of the report, not the math of the update.

  *   **Case for Reading 1:** If the source's report is about the **state of the world** (e.g., "I see a state of affairs incompatible with 'delayed elsewhere'"), the constraint is $Q(\neg D \lor C) = 0.92$. MCE yields Reading 1.
  *   **Case for Reading 2:** If the source's report is about the **process or mechanism** (e.g., "The reliability of the customs channel relative to other delays is higher than you thought"), the constraint is $Q(C|D) = 0.80$. MCE yields Reading 2.

  **What would have to be true for the constraint to apply:**
  To principledly pick one rule, you must determine the **ontological status of the evidence**.
  *   Does the evidence rule out *worlds*? (Use Reading 1).
  *   Does the evidence rule out *probability distributions* (specifically ratios)? (Use Reading 2).

  In risk modeling, this usually maps to **Observation vs. Calibration**.
  *   If the message is a noisy *observation* of the shipment's status (even if conditional), it leans Reading 1.
  *   If the message is expert testimony about the *logistics network's behavior*, it leans Reading 2.

  ### 3. Unifying Your Four Observations

  Your four observations are not distinct puzzles; they are unified consequences of the distinction between **Propositional Updating** (Reading 1) and **Parametric Updating** (Reading 2).

  1.  **Underdetermination (Partition Dependence):** This is the core **Input Problem**. Jeffrey Conditionalization requires a partition. A conditional sentence does not uniquely specify a partition unless you decide if it denotes a set of worlds (Material) or a relation between sets (Conditional).
  2.  **Order Dependence and Erasure:** This is a signature of **Parametric Updating**. If you update a parameter ($P(C|D)$) to 0.8, then later to 0.9, the first update is irrelevant; only the final constraint matters. In Propositional Updating, evidence accumulates (you conditionalize on $E_1$, then on $E_2$). The fact that your "Reading 2" exhibits erasure confirms it is treating the conditional as a parameter constraint, not a proposition.
  3.  **Extremes Agreement:** This is **Continuity**. Both MCE solutions converge when the constraint probability is 0 or 1. At 1, $P(C|D)=1$ and $P(\neg D \lor C)=1$ both eliminate the $D \land \neg C$ cell entirely. The divergence is strictly a feature of uncertainty.
  4.  **Nesting and Collapsing:** This is the **Import-Export Failure**. In probabilistic logic (Adams' Thesis), $P(A \to (B \to C))$ is not generally equivalent to $P((A \land B) \to C)$.
      *   Reading 1 (Material) validates Import-Export (because material conditionals do).
      *   Reading 2 (Conditional) invalidates it (because $P(C | B, A)$ is not the same constraint structure as $P(B \to C | A)$).
      *   Your colleague is correct: if you treat the news as Reading 2, collapsing the nested conditional changes the constraint structure. If you treat it as Reading 1, collapsing is valid. This observation is a diagnostic test: if collapsing the conditional changes your model's output, you are implicitly using Reading 2.

  ### 4. Boundary Cases and Carving

  To operationalize this in your models, you need to distinguish cases that look like yours but aren't, and versions of yours that are uncontroversial.

  **Case A: Looks like yours, but is NOT (The "Material" Trap)**
  *   *Scenario:* A sensor triggers if and only if the shipment is *not* (delayed and not at customs). The sensor is noisy.
  *   *Analysis:* This is Reading 1. The sensor is detecting a physical state corresponding to $\neg(D \land \neg C)$. Even though the logic looks conditional, the causal mechanism is propositional.
  *   *Update:* Use Jeffrey Conditionalization on the proposition. Do not fix the $D/\neg D$ ratio.

  **Case B: Looks like yours, but is NOT (The "Fact" Trap)**
  *   *Scenario:* You learn for certain that the shipment is at customs ($C$).
  *   *Analysis:* This is standard conditionalization. $P(C)=1$. This implies $P(C|D)=1$ and $P(\neg D \lor C)=1$. Both readings converge.
  *   *Update:* Standard Bayesian update.

  **Case C: A version of yours where the answer IS uncontroversial (The "Process" Case)**
  *   *Scenario:* A logistics engineer tells you, "We have rerouted all delayed shipments to customs; none go elsewhere anymore."
  *   *Analysis:* This is Reading 2. The engineer is not reporting on the specific shipment's current location (which might still be unknown); they are reporting on the *policy* governing the delay. They are constraining the ratio $P(C|D)$ to 1.0.
  *   *Update:* Fix $P(C|D) = 1$. Preserve $P(D)$.
  *   *Why Uncontroversial:* The semantic content is explicitly about the conditional relation, not the material state.

  **Case D: The "Risk Model" Carving (Your Actionable Definition)**
  For your specific context (risk models), I recommend defining the update rule based on the **Source Class**:

  1.  **Observational Sources** (Sensors, trackers, spot-checks): Treat as **Propositional (Reading 1)**. These sources detect states. They provide evidence about $\neg D \lor C$. They should affect your belief in whether a delay occurred at all.
  2.  **Structural Sources** (Policy changes, expert elicitation on mechanisms, historical re-calibration): Treat as **Parametric (Reading 2)**. These sources describe relations. They provide evidence about $P(C|D)$. They should *not* affect your belief in whether a delay occurred, only where it went if it did.

  ### Summary Recommendation

  You are encountering the **Input Problem for Conditional Kinematics**.
  *   **The Label:** Kinematic Underdetermination of Conditional Evidence.
  *   **The Constraint:** Minimum Cross-Entropy, applied to either a Propositional Constraint (Reading 1) or a Conditional Constraint (Reading 2).
  *   **The Decision Rule:** Classify the evidence source. If it reports on the **state**, use Reading 1 (mass spreads to $\neg D$). If it reports on the **mechanism**, use Reading 2 (mass stays in $D$).
  *   **The Diagnostic:** If updating on "If $A$ then $B$" changes your credence in $A$, you are using Reading 1. If it leaves $P(A)$ invariant, you are using Reading 2. In risk modeling, structural knowledge (Reading 2) should typically leave marginal risks ($P(A)$) invariant, while observational knowledge (Reading 1) should not.

  Your four observations are consistent features of this bifurcation. The "erasure" effect (Obs 2) and "nesting" sensitivity (Obs 4) are particularly strong indicators that you are dealing with Parametric (Reading 2) updates, which suggests that for your specific domain (logistics mechanisms), Reading 2 is likely the more robust default *unless* the message is explicitly a sensor reading.
