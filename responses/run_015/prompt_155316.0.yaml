  QUESTION 4 — HOFSTADTER AND SUPERRATIONALITY (20 marks)

  (a) [5 marks] Consider a one-shot Prisoner's Dilemma with these payoffs: both cooperate → 3 each; both defect → 1 each; one cooperates while the other defects → 5 for the defector, 0 for the cooperator. Explain what Hofstadter means by a "superrational" thinker, and explain how a superrational player's reasoning differs from the standard ("ordinary rational") analysis of this game. Your answer should make clear what a superrational player is assuming about the other player.

  (b) [7 marks] In Hofstadter's "Platonia Dilemma", 20 people are contacted privately and each is told: if you, and you alone, send a telegram within 24 hours, you get one billion dollars; if two or more telegrams arrive, nobody gets anything. There is no communication between the players. (i) What does the standard rational analysis predict, and why? (ii) What is the superrational response? Explain why a randomising device is needed, what probability each player should give to sending, why that particular number, and what each player's expected payoff is under that strategy.

  (c) [8 marks] Alice plays the same one-shot Prisoner's Dilemma as in (a). A completely reliable source tells her that her opponent Bob is a "partial twin": whatever Alice chooses, Bob will make the same choice with probability q and the opposite choice with probability 1 − q, where q is a known number between 0 and 1. (This is only a correlation: Alice's choice does not cause Bob's.) Alice accepts superrationality and cares only about her own payoff. (i) For which values of q does cooperation maximise her expected payoff? Show your working. (ii) What should she do if the source tells her q = 0.70? (iii) Comment on the cases q = 1 and q = 1/2: does superrationality agree with the ordinary analysis in either of them, and why or why not? (iv) Should a superrational player cooperate if she knows for certain that her opponent reasons in the ordinary way and is not superrational? Answer in a sentence or two.

