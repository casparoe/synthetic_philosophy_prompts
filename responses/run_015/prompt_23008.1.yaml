      *Move 5:* Anna is right. Exaptation requires distinguishing origin from current use.
      *Move 6:* Ben is wrong. Selection doesn't update instantly; genetics lag.
      *Move 7:* Anna is right. Function persists despite temporary selection lags.

      *Overall:* Anna captures the normative and historical nature of biological "function" better than Ben.

      *Missing:* They are talking past each other about two different concepts of function (Proper Function vs. Capacity Function).

      *Final Verdict:* Anna.

  8.  **Final Polish:** Check constraints again. "End with a final verdict on who is more right overall, on its own line, in exactly this format: \answer{Anna} or \answer{Ben}."

