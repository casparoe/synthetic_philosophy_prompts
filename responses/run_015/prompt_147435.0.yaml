      *   **Theoretical Pushback:** The fallacy assumes a static utility function. If the utility function changes (from profit to prestige), past costs aren't being "honored" irrationally; they are the entry fee for a different game. The confusion isn't about past vs. future, it's about *what* future utility is being maximized.
