      *   *Sunk Cost Fallacy (SCF):* Standard view = "We spent so much, we must finish." Rational view = "Ignore past spend, look at marginal cost vs. marginal benefit."
      *   *Nuance:* Is prestige a "benefit"? Yes, for states. Is treaty credibility a "benefit"? Yes.
      *   *Theory Pushback:* Maybe it's not about honoring the *cost*, but honoring the *commitment* made when the cost was incurred. The cost signals the seriousness of the commitment.

  3.  **Drafting the Response - Section by Section:**

