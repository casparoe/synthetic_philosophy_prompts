answer: |-
  Right, pull up a chair. This is exactly the kind of messiness we want in a seminar like this. Textbook decision theory loves clean examples—gambles with known probabilities, monetary payoffs, single agents. But real-world action, especially state action, is draped in history, reputation, and shifting utility functions. The Concorde case is perfect for tearing open the Sunk Cost Fallacy (SCF) because it forces us to ask: *What exactly is being maximized?*

  You asked for the mapping first. Let's not jump to the verdict until we've drawn the tree. Here's how I'm structuring the decision nodes before we get into the philosophy.

  ### Phase 1: Decision Node Mapping

  **Node A: 1962 (The Treaty)**
  *   **Agents:** UK Government (Macmillan), French Government (de Gaulle).
  *   **Decision:** Commit to joint supersonic transport development.
  *   **Rationale:** Share R&D burden, compete with US aerospace, European integration signal.
  *   **State:** Ex Ante. High uncertainty, high potential commercial payoff.

  **Node B: 1973 (The Crisis)**
  *   **Context:** Oil shock spikes fuel costs. Environmental concerns rise (sonic booms). Major airline orders (Pan Am, etc.) cancelled. Commercial viability collapses.
  *   **Agents:** UK Cabinet (Treasury vs. Department of Trade & Industry), French Presidency/Ministry of Transport.
  *   **Decision:** Terminate program vs. Complete certification/production.
  *   **State:** Ex Interim. Massive sunk costs (R&D). Marginal cost to complete is high, but lower than total start-up. Commercial ROI is negative.

  **Node C: 1976–2003 (Operation)**
  *   **Agents:** British Airways, Air France (both state-owned during this period).
  *   **Decision:** Continue flying vs. Retire fleet.
  *   **State:** Ex Post. Operating losses subsidized by governments.
  *   **Payoff:** Negative financial, Positive symbolic/strategic.

  ***

  ### Phase 2: The Actors and The Options

  Now, let's get into the weeds of Node B. This is where the SCF accusation usually lands.

  **Who is deciding?**
  It's crucial not to treat "Britain" or "France" as monolithic utility maximizers. Inside the UK Cabinet, you had the Treasury (wanting to cut losses) versus the Department of Trade & Industry and the aerospace unions (wanting to preserve jobs and capability). In France, the state had a tighter grip, viewing aerospace as a sovereign pillar. But critically, the airlines themselves—British Airways and Air France—were state-owned enterprises. This means their utility function was not *profit maximization*; it was *national welfare maximization*, which includes profit but also employment, prestige, and technological sovereignty.

  **The Options at Node B (1973):**
  1.  **Cancel:** Stop funding. Write off the R&D.
      *   *Immediate Payoff:* Stop the bleeding of future development costs.
      *   *Hidden Cost:* Breach of international treaty (diplomatic cost), loss of skilled workforce (human capital flight), admission of technological failure.
  2.  **Complete:** Fund the certification and limited production run.
      *   *Immediate Payoff:* High continued subsidy required.
      *   *Hidden Benefit:* Fulfill treaty, maintain aerospace industrial base, secure "first mover" status in supersonic travel.

  **The Payoff Structure:**
  If you view this as a private firm, Option 1 dominates. The Net Present Value (NPV) of future ticket sales cannot cover the marginal cost of completion, let alone the R&D.
  However, for a state actor, the payoff matrix includes non-monetary variables. Let's call them $P$ (Prestige), $S$ (Sovereignty/Capability), and $C$ (Credibility).
  *   **Cancel Payoff:** $0 (Financial) - C - S$
  *   **Continue Payoff:** $-$$$ (Financial Loss) + P + S + C$

  The decision to continue implies that $(P + S + C) > $$$ Loss.

  ### Phase 3: Applying the Fallacy Framework

  Here is where we need to be precise with the philosophy of action.

  **The Standard SCF Charge:**
  The fallacy states that rational agents should ignore unrecoverable past costs when making future decisions. Only marginal costs and marginal benefits matter.
  *   *The Accusation:* The British and French governments thought, "We've already spent billions, we can't stop now." They allowed the *history* of the investment to dictate the *future* allocation of resources.
  *   *Where it fits:* There is evidence in cabinet minutes of reluctance to "waste" the taxpayers' money already spent. If the reasoning was literally "We must finish because we spent money," that is irrational. The money is gone regardless of whether the plane flies.

  **Where the Fallacy Label Misses:**
  The SCF assumes a static utility function where only financial return matters. But in political economy, past expenditure often serves as a **commitment device**.

  Consider this: If you start a project and quit halfway, you signal to future partners that you are an unreliable ally. The *sunk cost* itself becomes a signal of resolve. By continuing, the governments weren't honoring the *cost*; they were honoring the *commitment* that the cost represented.
  *   **Signaling Value:** Quitting in 1973 signals to the US (and within the EEC) that European cooperation is fragile. Continuing signals resilience.
  *   **The Rationality:** It is rational to incur further losses to maintain a reputation for credibility, *provided* the value of that reputation exceeds the future losses.

  So, is it the sunk cost fallacy? Or is it a rational calculation of reputational capital where the *magnitude* of the sunk cost proves the *seriousness* of the commitment? I argue it's the latter. The fallacy framework breaks down because it treats the past expenditure as a *reason* for action, when in this context, the past expenditure was *evidence* of a prior commitment that still held future utility (credibility).

  ### Phase 4: Value Conversion and Utility Functions

  This is the core philosophical pushback you need for your seminar.

  The standard critique of Concorde says: "They threw good money after bad." This assumes the goal was always *commercial profit*. But look at the outcome. They operated the plane at a financial loss for 27 years. Yet, it became an icon. It projected soft power. It kept a skilled engineering workforce intact that could work on Airbus or defense projects later.

  **Conversion of Capital:**
  What happened at Node B was a conversion of **Economic Capital** into **Symbolic Capital**.
  *   **Pre-1973:** The plane was an investment good (expected financial return).
  *   **Post-1973:** The plane became a consumption good (national pride/prestige) and a public good (technological base).

  If I buy a ticket to a concert and hate the first half, leaving is rational (SCF says ignore the ticket price). But if I stay because leaving would embarrass my host whom I need to impress tomorrow, I am not committing the SCF. I am paying for a different benefit (relationship maintenance) using the ticket as the venue.

  Similarly, the governments weren't "honoring sunk costs." They were utilizing the existing platform to purchase prestige. The sunk costs weren't the *justification*; they were the *entry fee* for a different game. The fallacy argues we confuse investment history with future utility. I suggest the Concorde case shows that **investment history can alter future utility functions.** The fact that they spent so much made the completion *more* valuable symbolically than if they had spent little. A cheap success doesn't signal resolve like an expensive rescue mission does.

  ### Phase 5: Where the Theory Breaks

  So, where does decision theory need to adjust?

  1.  **Endogenous Preferences:** Standard decision theory treats preferences (utility functions) as exogenous and stable. Concorde shows preferences shift. The utility of "completing the project" increased *because* the costs were sunk. The hardship itself created value (the "effort justification" phenomenon in social psych, but applied to state action).
  2.  **The Unit of Analysis:** SCF works well for individual agents with clear monetary goals. It struggles with collective agents (states) where "profit" is ill-defined. If the "profit" includes avoiding the political shame of cancellation, then continuing is profit-maximizing. The fallacy only exists if we impose an external definition of "rational" (financial profit) on agents who are optimizing for something else (political survival/prestige).
  3.  **Commitment vs. Cost:** The theory breaks when it fails to distinguish between *valuing the cost* (irrational) and *valuing the consistency signaled by bearing the cost* (rational). The Concorde governments were likely doing the latter. They were buying credibility.

  **Conclusion for the Seminar:**
  Don't let the seminar settle for "Concorde was irrational." That's too easy. The nuanced view is that the Sunk Cost Fallacy is a heuristic that warns against *emotional* attachment to past spend. But in high-stakes political strategy, past spend creates *structural* constraints and opportunities (treaty obligations, industrial capacity) that are very much relevant to future utility.

  The fallacy isn't about ignoring the past; it's about confusing the *recovery* of the past with the *value* of the future. In Concorde's case, they weren't trying to recover the money. They knew that was gone. They were spending future money to ensure the past expenditure wasn't *meaningless*. There is a difference between trying to get your money back (irrational) and trying to ensure your sacrifice wasn't in vain (rational, if the meaning has value).

  That's the wedge you drive into the standard model. The "fallacy" assumes value is only forward-looking. Concorde suggests value is also narrative—and narratives depend heavily on how the story ends, regardless of the cost of the previous chapters.
