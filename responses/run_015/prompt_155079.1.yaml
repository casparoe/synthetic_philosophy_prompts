      *   *Section 2: Philosophical Underdetermination.* Show how Skeptics and Critical Theorists can use the same tool for opposite reasons.
      *   *Section 3: The Blockchain Layer.* Distinguish between verifying truth vs. verifying testimony. The shift from "what happened" to "when was this claimed."
      *   *Section 4: Concrete Consequences of Explicit Theories.* Contrast the Report structures under Positivism vs. Memory Sovereignty.
      *   *Conclusion:* Summarize the tension between managing conflict and seeking truth.

  7.  **Refine the Concepts (Self-Correction during drafting):**

      *   *Check:* Did I answer "what the vote is deciding"?
