  8.  **Final Polish:** Ensure tone is analytical, philosophical, and direct. Avoid academic jargon where possible, but use precise philosophical terms (epistemic weight, ontology, provenance). (The prompt asks to work from concepts, so precise terminology is good).

      *(Self-Correction on the Vote)*: The prompt says "nobody can say what the vote is actually deciding." This is crucial. It implies the vote is a *performative act* of closure without ontological commitment. I need to highlight this "strategic ambiguity."

