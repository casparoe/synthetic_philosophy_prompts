answer: |-
  This is a sophisticated administrative setup that inadvertently replicates a major debate in the philosophy of history. Your board's procedure is not just bureaucratic; it is an enacted epistemology. Here is a reconstruction of the implicit theory, the points of underdetermination, the impact of the ledger, and the concrete consequences of making the theory explicit.

  ### 1. The Implicit Theory: Procedural Pluralism and Strategic Ambiguity

  Your current procedure presupposes a philosophy of **Historical Pluralism** coupled with **Pragmatic Agnosticism**.

  By listing both tracks without resolving the contradiction, you are rejecting **Historical Realism** (the idea that there is a single, recoverable truth about the past) in favor of **Historical Constructivism** (the idea that the past is constituted by the narratives we maintain about it). However, you stop short of full relativism because you still hold a vote.

  The critical philosophical move here is the separation of *ontology* (what actually happened) from *designation* (what we officially recognize). The vote does not decide "Which story is true?" because the procedure assumes truth is either inaccessible or irrelevant to the goal of heritage management. Instead, the vote decides **"Which narrative governs the future use of this site?"**

  This implies that collective memory has **performative weight** rather than strictly **epistemic weight**. The community story doesn't need to be factually accurate to be historically significant; its significance lies in the fact that the community *believes* it. The archive is treated not as the "truth" but as the "administrative record." Both are valid data points: one records physical usage (coal depot), the other records social meaning (religious gathering).

  ### 2. Philosophical Underdetermination: Rival Views, Same Vote

  You asked if the same procedure could be run by someone who thinks memory is distorted versus someone who thinks archives are power-laundering. The answer is yes. This is the practice's greatest strength and its deepest philosophical flaw. The procedure is **underdetermined**, meaning it does not force you to commit to *why* the conflict exists.

  *   **The Skeptical Empiricist:** A board member might believe archives are generally reliable and oral memory is prone to decay and myth-making. To them, the dual-track system is a courtesy. They vote to prioritize the archive, but allow the memory to be listed as "folklore" to avoid alienating residents. The vote is a risk management calculation.
  *   **The Critical Archivist:** A board member might believe archives are tools of state power used to erase marginalized groups (like your religious group). To them, the coal depot record is the lie, and the memory is the resistance. They vote to prioritize memory as an act of restorative justice.
  *   **The Democratic Pragmatist:** A board member might believe truth is unknowable. They vote based on which story generates more community cohesion or tourism revenue.

  Because the vote's criteria are undefined, all three can cast the same ballot for different philosophical reasons. The system maintains consensus by allowing members to project their own epistemology onto the ambiguous act of voting. The "tension" you record is not just in the data; it is in the room.

  ### 3. The Ledger Layer: Provenance of Claim vs. Truth of Claim

  Adding the distributed ledger ("immutable memory nodes") shifts the epistemology, but perhaps not in the way you intend. It does **not** make the oral testimony factually true. A lie timestamped on a blockchain is still a lie.

  However, it does change the **ontology of the memory**.

  *   **Before the Ledger:** The memory is ephemeral. It exists in the telling. Its authority comes from the charisma of the teller or the number of people who agree.
  *   **After the Ledger:** The memory becomes an **artifact**. You are no longer just archiving the *event* (the religious gathering); you are archiving the *act of claiming* the event.

  This creates a **Chain of Custody for Lore**. The epistemology shifts from "Is this story true?" to "Is this story stable?" The ledger verifies the *provenance of the testimony*, not the *content of the testimony*. It treats the community submission as a legal deposit.

  Is this tech theater? Partially. If the goal is to verify historical fact, it is theater. But if the goal is to prevent the erasure of the *claim itself* (preventing the board from quietly deleting unpopular memories later), it is a genuine epistemic shift. It grants the community memory a kind of **bureaucratic immutability** that rivals the physical permanence of the archive. It says: "We may not agree this happened, but we agree that you said it, and that saying is now part of the permanent record."

  ### 4. Concrete Consequences of Explicit Theories

  If you stopped hiding behind the ambiguity and adopted an explicit theory, your designation reports would change structurally and linguistically.

  **Scenario A: Privileging Documentary History (Positivism)**
  *   **Theory:** The archive is the baseline truth; memory is supplementary.
  *   **Report Structure:** Track 1 becomes the "Historical Baseline." Track 2 becomes "Oral Addenda."
  *   **Conflict Resolution:** In the waterfront example, the report would state: *"Physical evidence confirms coal depot usage. Community oral history suggests prior or concurrent religious use, though unsupported by physical records."*
  *   **The Vote:** The vote would determine if the oral history is significant enough to warrant a plaque *despite* being unverified.
  *   **Designation:** The site is designated as a "Coal Depot Site with Associated Folklore." The religious group is marginalized as a secondary narrative.

  **Scenario B: Privileging Community Memory (Memory Sovereignty)**
  *   **Theory:** Lived experience constitutes the true history; archives are merely administrative shadows.
  *   **Report Structure:** Track 2 becomes the "Primary Narrative." Track 1 becomes "Administrative Context."
  *   **Conflict Resolution:** The report would state: *"Community testimony identifies this site as a religious gathering place. Administrative records from the era list it as a coal depot, likely a cover for the group's activities."*
  *   **The Vote:** The vote would determine how to memorialize the religious group, treating the coal depot record as a historical obstacle to be explained away.
  *   **Designation:** The site is designated as a "Religious Gathering Site." The coal depot history is treated as a layer of erasure to be interpreted, not the defining identity.

  **Scenario C: Your Current System (Explicitly Acknowledged)**
  *   **Theory:** Heritage is a negotiation between evidence and meaning.
  *   **Report Structure:** "Contested Histories Report."
  *   **Conflict Resolution:** *"The site holds dual status: Functionally a coal depot (Archive), Socially a religious node (Memory)."*
  *   **The Vote:** The vote determines the **interpretive framework**. Do we build a museum about coal? A memorial about the religion? Or a monument about the *conflict* between the two?
  *   **Designation:** The site is designated as a "Zone of Historical Contestation." The physical marker would explicitly tell both stories without resolving the contradiction, inviting the visitor to sit with the tension.

  ### Summary

  Your current practice assumes that **social validity** is as important as **factual accuracy**. You are managing meaning, not just facts. The blockchain layer reinforces this by making the *claim* permanent, even if the *fact* remains disputed.

  The philosophical risk is that by refusing to define what the vote decides, you risk **decision paralysis** or **hidden bias**. If a new chairperson arrives who is a Positivist, they can use your ambiguous system to silently suppress memory claims by labeling them "unresolved." If you want the system to endure, you must decide: Is the vote about **truth**, **justice**, or **utility**? Currently, it pretends to be all three, which allows it to function, but leaves it vulnerable to collapse when the tension becomes too high to ignore.
