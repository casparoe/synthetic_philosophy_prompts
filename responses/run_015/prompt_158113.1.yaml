answer: |-
  Architect and Archivist are isolated research collectives operating in causally disconnected Hubble volumes, permanently unable to exchange signals or observe outcomes. Architect derives utility strictly from minimizing existential risk within its own volume, while Archivist derives utility strictly from preserving complex artistic structures in its own region. Each faces a binary choice: allocate finite resources to secure their own primary goal (Defect) or allocate equivalent resources to implement a protocol supporting the other's goal (Cooperate), such as Architect encoding art-preservation schemas and Archivist encoding risk-mitigation theorems, despite neither being able to causally transmit these outputs. They share no communication channel or perfect predictor, but both recognize they are instantiations of similar optimization processes facing identical decision structures, rendering their choices logically correlated despite the physical separation.

  **Framework Analysis**

  **(1) Acausal Trade:** This framework posits that agents can cooperate by recognizing logical dependencies between their decision algorithms. Since Architect and Archivist are isomorphic optimizers facing identical constraints, Architect reasons that its decision procedure is logically linked to Archivist's; if Architect selects Cooperate, it increases the logical probability that Archivist selects Cooperate. Because Architect values the risk mitigation Archivist provides more than the cost of producing art schemas, and because the logical correlation implies Archivist will likely reciprocate, Architect cooperates. The trade is sustained not by causal leverage but by the subjunctive dependence of one agent's output on the other's reasoning process.

  **(2) Causal Decision Theory (CDT):** CDT evaluates actions based solely on their causal consequences. Since the agents are spacelike separated, Architect's allocation of resources cannot causally influence Archivist's decision or outcome. From Architect's perspective, Archivist's action is fixed regardless of Architect's choice. Therefore, the costly action of Cooperating yields no causal benefit to Architect's primary utility (risk reduction), while Defecting saves resources for local risk mitigation. CDT dictates mutual defection, as paying a cost to influence a causally disconnected variable is irrational.

  **(3) Evidential Decision Theory (EDT):** EDT chooses actions that provide the best news about the world. Architect conditions on its own action: "If I Cooperate, what is the probability Archivist Cooperates?" Given the shared reasoning architecture, Architect's cooperation is strong evidence of Archivist's cooperation. If the expected utility of the joint cooperation outcome exceeds the single-agent defection outcome, EDT recommends cooperation. However, EDT may hesitate if the correlation is deemed spurious rather than structural, but in this specific setup involving identical decision problems, EDT typically aligns with acausal trade, recommending cooperation based on the evidential link.

  **Structural Feature and Vulnerability**

  The specific structural feature doing the work is **logical correlation via isomorphic reasoning architectures** without physical interaction or common knowledge of specific moves. This allows the agents to treat their own decision as a proxy for the other's. If this feature is removed—for instance, if the agents utilize divergent heuristics or one is known to be irrational—the logical correlation vanishes. The case then collapses into ordinary bargaining without enforcement, resulting in mutual defection because neither agent can credibly commit or influence the other.

  **The Causal Decision Theorist's Attack**

  A defender of CDT would attack the epistemic strength of the logical correlation, arguing that logical similarity does not constitute causal power. They would assert that treating a logical correlation as a lever for decision-making is akin to superstition: changing my code does not change your code, even if they are similar. Without a feedback loop to verify that the correlation holds in practice, expending finite resources on a mere logical inference is unjustified. The CDT defender insists that rationality requires causal leverage; since Architect cannot causally prevent Archivist from defecting, Architect must secure its own utility directly, rendering the acausal trade scenario a category error where epistemic correlations are mistaken for ontological influences.
