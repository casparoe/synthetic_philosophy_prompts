answer: |-
  You have identified a genuine and robust pattern, but you are correct that there is no single, universally recognised term that captures the specific triad of *escapability*, *temporal delay*, and *impulse decay* across personal, technical, and constitutional domains.

  In behavioural economics, this is often lumped under **soft precommitment**, but as you note, that term carries baggage implying a binding contract. In computer security and high-frequency trading, the mechanism is called a **speed bump**, but that term is usually technical and external. In law, it is a **cooling-off period** or **suspensive delay**, but those imply consumer protection or legislative procedure rather than a general design pattern.

  Given the lack of a perfect existing label, I propose we call this **Temporal Friction**.

  Below is the carving you requested: what defines it, where its boundaries lie, and how it shifts under different conditions of agency and usage.

  ### 1. Definition: Temporal Friction

  **Temporal Friction** is a deliberate design intervention that inserts a fixed delay and procedural effort between an intention to act and the execution of that act, without removing the option to act or attaching a material penalty.

  Its necessary and sufficient conditions are:
  1.  **Reversibility:** The action remains possible at any point; there is no hard block.
  2.  **Cost Neutrality:** There is no financial penalty, loss of privilege, or permanent record of failure attached to the action itself (though there may be visibility).
  3.  **Temporal Mismatch:** The delay is calibrated to exceed the expected half-life of the specific impulse or transient state of mind motivating the action.
  4.  **Explicitness:** The mechanism is known to the actor; it is not a hidden nudge.

  ### 2. The Edges: When Friction Becomes Binding

  You asked where the distinction collapses. Temporal Friction ceases to be friction and becomes a **Functional Ban** when the cost of the delay exceeds the utility of the action.

  *   **The Utility Boundary:** If you configure your phone to hide apps for 40 seconds, it is friction. If you configure it to hide them for 12 hours, it is effectively a ban, because the utility of checking the app (e.g., a quick notification check) decays to zero before the access is restored. The mechanism shifts from *filtering impulses* to *preventing access*.
  *   **The Effort Boundary:** If the "deliberate command" to override the delay requires navigating ten menus or typing a 64-character hash, the cognitive load becomes a penalty. At that point, it is no longer just a wait; it is a tax on action.
  *   **The Visibility Boundary:** In your work example, the message to the public channel adds *social cost*. If that social cost is high enough (e.g., shame, reputation loss), the mechanism stops being about time and starts being about *sanction*. It becomes a **Soft Constraint** rather than pure Temporal Friction.

  ### 3. Agency: Self-Imposed vs. Imposed by Others

  The mechanism functions differently depending on who sets the trap and who walks into it.

  *   **Self-Imposed (Personal Phone):** This is **Intrapersonal Governance**. You are trusting your past self to protect your future self from your present self. The "contract" is with yourself. The risk is that you, being the same agent, can collude with yourself to bypass the friction whenever you wish. It works only if you respect the interface you built.
  *   **Team-Imposed (Deploy Delay):** This is **Peer Governance**. The friction is set by the collective to protect the collective from individuals. Here, the "unused override" carries weight. If you override the delay, you are signalling to the team: *"I value speed over our shared safety protocol."* The friction is technical, but the enforcement is social.
  *   **Constitutional (Legislative Delay):** This is **Intergenerational Governance**. One parliament binds its successors. This is the most fragile form. It relies on the assumption that the *institution* values stability more than the *current members* value immediate action. If the political will is strong enough, the delay is simply endured, and the mechanism fails to filter the impulse, serving only as a procedural annoyance.

  ### 4. The Unused Override: Mechanism vs. Taboo

  You asked about the case where the override exists but is never used. This is a critical boundary case.

  When an override is available but culturally forbidden, the arrangement ceases to be purely mechanical and becomes a **Normative Guardrail**.

  *   **The Mechanism:** The code allows the override.
  *   **The Convention:** The team agrees not to use it.
  *   **The Taboo:** Using it signals desperation or incompetence.

  In this state, the Temporal Friction has successfully mutated into a **Social Contract**. The delay is no longer doing the work; the *stigma* of bypassing the delay is doing the work. If you press the button, you haven't broken the system, but you have broken the trust.

  This does not negate the classification as Temporal Friction, but it adds a layer. It becomes **Friction backed by Norm**. If the norm hardens such that using the override is considered grounds for dismissal, the arrangement has quietly shifted from Temporal Friction to a **Conditional Ban**.

  ### 5. Neighbouring Concepts and Distinctions

  To ensure the carving is clean, here is how Temporal Friction differs from its nearest neighbours:

  | Concept | Key Difference |
  | :--- | :--- |
  | **Ulysses Pact** | Removes the option entirely (hard binding). Temporal Friction preserves the option. |
  | **Nudge** | Often covert or relies on choice architecture. Temporal Friction is explicit and known. |
  | **Sludge** | Friction that is wasteful or malicious. Temporal Friction is beneficial and consensual. |
  | **Circuit Breaker** | Usually automatic and triggered by thresholds. Temporal Friction is triggered by *any* attempt to act. |
  | **Penalty Clause** | Attaches a cost (money/reputation). Temporal Friction attaches only time and effort. |

  ### Summary

  The pattern you have identified is **Temporal Friction**.

  It is distinct from precommitment because it does not bind; it is distinct from nudges because it is explicit; and it is distinct from penalties because it charges time rather than value. Its efficacy relies entirely on the **decay rate of human impulse**.

  It works when the wait is longer than the urge, but shorter than the genuine need. It fails when the urge is stronger than the patience, or when the wait is longer than the urgency. When the override is present but unused, the mechanism has successfully cultivated a **taboo**, transforming a technical delay into a social norm.

  In your engineering and personal contexts, you are not building walls; you are building **speed bumps**. You are not trying to stop the car; you are trying to ensure the driver is going slow enough to know where they are steering.
