answer: |-
  Dear Colleague,

  It is a pleasure to hear you are returning to Omelas, and I think your instinct to move beyond the crude utilitarian calculus is exactly right. For years we have treated the story as a arithmetic problem where the happiness of the many outweighs the misery of the one, only to feel uneasy about the result. But if we shift the lens to Buddhist moral psychology, the unease becomes the point of entry rather than the conclusion. You ask whether a Buddhist reading can rescue the walkers from the consequentialist charge of self-indulgence, and whether this rescue is genuinely distinct from a sophisticated consequentialism that counts states of mind as outcomes. I believe it is distinct, though the distinction requires us to be precise about what karma means in this context.

  When you frame karma as cetanā, or volition, you are locating the moral weight in the quality of the will rather than the state of the world produced. For the consequentialist, the walker's departure is morally suspect because it changes nothing for the child. The suffering continues, the city remains bright, and the agent has merely secured their own conscience at the cost of efficacy. From a Buddhist perspective, however, the act of walking away is not a failed attempt to change the world but a successful attempt to cease participating in a specific karmic structure. The citizens who stay are not merely enjoying benefits; they are actively sustaining a reality grounded in delusion and aversion. They have looked upon the child and chosen to turn away, rationalizing the torture as necessary. That act of rationalization is a volitional formation that roots them deeper in samsara. The walkers, by contrast, refuse to let their happiness be contingent on another's misery. This refusal is not instrumental; it is not done to produce a better future outcome, either for themselves or the child. It is done because to stay is to be complicit in a view of reality that is fundamentally false. The difference they make is real because it is a difference in the fabric of their own consciousness and the karmic trajectories they set in motion. To call this self-indulgence is to assume that the only valid moral currency is external consequence. If ethics is about the cultivation of wisdom and compassion, then withdrawing from a situation that demands the suppression of compassion is the only rational act. It is not that the walker ignores the child; it is that the walker recognizes that staying requires a hardening of the heart that makes any future compassion impossible.

  You worry that this might just be consequentialism with a more generous account of which outcomes count, perhaps including integrity or spiritual purity as goods to be maximized. I think the collapse is avoided if we insist that in Buddhism, the purity of will is not a means to an end but constitutive of the end itself. Consequentialism, even when it values virtue, values it because virtuous agents tend to produce good outcomes. Buddhism values the wholesome root of action because it is the cessation of suffering in the immediate present of the agent. The walker does not leave to become a better person who might help others later; they leave because to stay is to suffer spiritually in the very moment of consent. The locus of value is internal and immediate, not external and projected. This is where your colleague's suggestion that the story is a renunciation narrative holds significant weight. The walkers are renouncing the world not because the world is evil in itself, but because their participation in it requires a bargain they cannot make. This is closer to the arhat ideal than the bodhisattva ideal, focusing on the extinction of one's own complicity in suffering rather than the salvation of all beings.

  This brings us to your first complication, the case of Unvisited Omelas, where the citizens never know about the child. Here the Buddhist account must indeed say that a great deal has changed, but not in the way that makes the child's suffering less real. The suffering of the child is dukkha, and it exists regardless of witness. However, the karma of the citizens is entirely different. Without knowledge, there is no intention to harm, no delusion to dispel, and no volition to withdraw. They are innocent in the sense that they are not generating the karmic seeds of complicity. This is not an embarrassment for the Buddhist view; it is a clarification of the scope of ethics. Ethics is about agency. If there is no agency, there is no moral fault, though there is still ontological suffering. The consequentialist says nothing has changed morally because the outcome is identical. The Buddhist says the moral landscape has changed because the agents are no longer entangled in the web of intention that sustains the bargain. The wrongness of Omelas does not depend on who is thinking about it in terms of the child's pain, but the moral responsibility of the citizens absolutely depends on their knowledge. To say otherwise would be to demand responsibility where there is no capacity for choice. The Buddhist account survives this by distinguishing between the tragedy of existence and the ethics of action.

  The second complication, the missing bodhisattva figure, is perhaps where the story resists the reading most strongly. You ask about the person who leaves, realizes something, and returns to work from within. Le Guin gives us only stay or leave. A Buddhist ethicist might feel pressure to supply this ending because the bodhisattva vow is precisely to remain in the world of suffering to alleviate it, rather than fleeing to the mountains. However, there is a metaphysical constraint in the story that complicates this. The bargain is presented as absolute. The happiness of the city depends on the misery of the child. If one stays, one accepts the bargain. If one tries to free the child, the beauty vanishes. In this rigid framework, the bodhisattva path might be impossible because there is no middle way to cultivate. One cannot alleviate the child's suffering without destroying the city, and the story offers no third option where both might flourish. Thus, the walkers might be seen not as quietists, but as those who recognize that the system is irredeemable. To stay and try to work from within would be to delude oneself into thinking the structure can be reformed when its foundation is torture. Yet, a Mahayana critique might argue that this dualism itself is the delusion. Perhaps the true bodhisattva would stay, not to enjoy the festival, but to sit with the child, sharing the darkness, thereby transforming the meaning of the city through presence rather than power. The story's silence on this suggests that Le Guin is more interested in the moment of rupture than the labor of reconstruction. It dramatizes the cost of consciousness, not the strategy of liberation.

  This leads to your final question about where the story resists the reading. The narrator's persistent hesitancy, the insistence that we imagine it as our own fancy dictates, creates a pluralism that is resistant to any fixed ethical system, Buddhist or utilitarian. The narrator refuses to explain the mechanics of the bargain, which prevents us from treating it as a solvable engineering problem. This ambiguity protects the story from being co-opted by a system that claims to have all the answers. If the story were purely a Buddhist parable, the path of the walkers would be clearer, more prescribed. Instead, the walkers go into the mountains and we do not know where they go. This unknown destination is crucial. It signifies that the ethical act is a leap into the unknown, not a calculation of known rewards. It dramatizes something about the relation between self-regarding liberation and other-regarding benefit that philosophical arguments often flatten. In philosophical debate, we try to reconcile the two. In the story, they are torn apart. The walkers choose self-liberation because other-regarding benefit is structurally impossible within the city. This tragedy is what the seminar should sit with. The Buddhist reading enriches this by showing that the walkers are not fleeing responsibility but refusing a specific kind of spiritual death. But it must also acknowledge that the story leaves the bodhisattva option unexplored, perhaps because the political reality of Omelas is so totalizing that compassion within it is unintelligible.

  So, to settle the disagreement with your colleague as far as it can be settled: the consequentialist framing is not a category mistake, but it is incomplete. It captures the external stakes but misses the internal transformation. The renunciation narrative captures the internal transformation but risks ignoring the external tragedy. A Buddhist reading bridges these by showing how the internal transformation is the only available response to the external tragedy when the system is rigid. However, you must be prepared to show your students where the story pushes back. It does not offer a soteriology. It offers a mirror. The walkers do not save the child, and they do not save the city. They save only themselves from being the kind of person who could accept the city. Whether that is enough is the question the story leaves hanging, and it is a question that both consequentialism and Buddhism must answer differently. The consequentialist says no, because the child still suffers. The Buddhist says yes, because the chain of complicity is broken. Your seminar will be most fruitful if you let that tension stand unresolved, using the Buddhist framework not to solve the parable but to deepen the mystery of why walking away feels like the only honorable choice even when it changes nothing.

  I hope this helps you frame the session. It is a rich text, and viewing it through the lens of volition rather than outcome restores the dignity of the walkers without denying the horror of the child. Let me know how the discussion goes.

  Warmly,

  Your Colleague
