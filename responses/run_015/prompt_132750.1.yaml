prompt: |-
  hey so im a backend engineer on a legacy maintanence team with basically zero philosophy background. every sprint we hit cases where two different explanations for a weird module behavior both match every log and test we have, but we still gotta pick one to refactor around or decide to hold both. i read a little about underdetermination of theory by evidence - like the quine-duhem thing where data never fully forces one theory - and i want to turn that into an actual decision procedre my team can run in like 20 minutes. nobody here has studied philosophy, and at the end someone senior has to sign off.

  write me the ordered checklist: the questions to ask in sequence, what counts as a good enough answer at each step, where it stops with a hard 'no, dont commit to either', where it says 'pick A or B but flag the risk', and where its clearly a values call that philosophy cant solve. keep it usable by people who dont know the jargon.

  apply it to three cases:
  1. two database normalization theories that both predict the exact same slow query patterns
  2. two competing security breach narratives that both fit every audit log
  3. a case where the procedure forces us to reject the simpler, cleaner explanation we all like and go with a messier one because some hidden auxilliary assumption check fails

  also be honest about where this is gonna misfire or break since im probably mangling the concept, and say clearly what the procedure cant do - like it cant actually prove one theory is right, can it? and flag the spots where a human just has to make a call.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer on a legacy maintenance team.
      *   **Problem:** Underdetermination of theory by evidence (Quine-Duhem thesis) in practical software engineering. Two explanations fit all available data (logs, tests), but a decision must be made (refactor, hold, etc.).
      *   **Goal:** A 20-minute decision procedure/checklist based on this philosophical concept, usable by non-philosophers, ending with a senior sign-off.
      *   **Requirements:**
          *   Ordered checklist (questions in sequence).
          *   Criteria for "good enough" answers.
          *   Stop conditions (Hard No, Pick with Risk, Values Call).
          *   Apply to three specific cases (DB normalization, Security breach, Simpler vs. Messier explanation).
          *   Honest limitations (where it misfires, what it can't do).
          *   Tone: Practical, engineering-focused, no jargon.

  2.  **Deconstruct the Philosophy (Quine-Duhem/Underdetermination):**
      *   *Core Idea:* Data alone doesn't prove a theory. You always need auxiliary assumptions (e.g., "the logs are accurate," "the network is stable").
      *   *Engineering Translation:* "The code does X" vs. "The infra does Y." Both explain the bug. How to choose?
      *   *Pragmatic Turn:* Since we can't prove truth, we optimize for *utility*, *cost*, and *risk*. This aligns with Pragmatism (James/Dewey) more than pure Epistemology.
      *   *Key Heuristics:* Simplicity (Occam's Razor), Falsifiability (Popper), Cost of Being Wrong, Reversibility.

  3.  **Drafting the Decision Procedure (The "20-Minute Triage"):**
      *   *Goal:* Move from "Both fit" to "Actionable Decision."
      *   *Step 1: The "Can We Test It?" Check.* (Falsifiability). If we can't distinguish them ever, does it matter?
      *   *Step 2: The "Cost of Wrongness" Check.* (Pragmatism). If we pick A and it's actually B, how bad is it?
      *   *Step 3: The "Auxiliary Assumption" Audit.* (Quine-Duhem). What are we assuming to make Theory A work? Are those assumptions shaky?
      *   *Step 4: The "Reversibility" Check.* (Bezos/Agile). Can we undo this?
      *   *Step 5: The "Values/Policy" Check.* (Ethics/Business). Security vs. Speed.

  4.  **Refining the Checklist for Engineers:**
      *   Avoid words like "epistemology," "auxiliary hypotheses," "falsifiability."
      *   Use words like "proof," "blast radius," "dependencies," "rollback."
      *   Make it a flowchart logic.

  5.  **Developing the Three Cases:**
      *   *Case 1 (DB Normalization):* Theory A (Bad Schema) vs. Theory B (Bad Indexing/Config). Both explain slowness.
          *   *Outcome:* Likely "Pick with Risk" based on cost of change.
      *   *Case 2 (Security):* Theory A (Insider) vs. Theory B (External Zero-Day). Both fit logs.
          *   *Outcome:* Hard "No, don't commit." Need more data. High stakes.
      *   *Case 3 (Simple vs. Messy):* Theory A (Simple Code Bug) vs. Theory B (Weird Race Condition + Infra Quirk).
          *   *Outcome:* Force the Messy one because the Simple one relies on a broken assumption (e.g., "clocks are synced").

  6.  **Addressing Limitations (The "Honesty" Section):**
      *   It doesn't find Truth.
      *   It doesn't replace Senior intuition.
      *   It can fail if the "Cost" estimation is wrong.
      *   It creates a paper trail, not a magic wand.

  7.  **Review and Iterate (Self-Correction):**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Emphasize that this is for the *decision meeting*, not the investigation.
      *   *Critique:* Is the Quine-Duhem connection clear?
      *   *Fix:* Explicitly mention the "Hidden Assumptions" step as the philosophical core.
      *   *Critique:* Is the tone right?
      *   *Fix:* Keep it dry, direct, like a runbook.

  8.  **Final Polish:**
      *   Structure: Introduction -> The Checklist -> The Cases -> The Limitations.
      *   Ensure the "Stop" conditions are clear (Red/Yellow/Green).
      *   Make sure the "Values Call" is distinct from the "Evidence Call."

  9.  *(Drafting content based on the above thought process...)* -> *See final output.*
      *   *Key adjustment:* Make sure to explicitly name the "Auxiliary Assumption" step as the Quine-Duhem proxy without using the name. Call it "The Trust Check."
      *   *Key adjustment:* In Case 3, ensure the logic forces the messy choice. Why? Because the simple choice relies on "The system is deterministic," which is proven false by the evidence, whereas the messy one accepts non-determinism.

  10. **Final Review against constraints:**
      *   Ordered checklist? Yes.
      *   Good enough answers? Yes.
      *   Stop conditions? Yes.
      *   Three cases applied? Yes.
      *   Honest about misfires? Yes.
      *   No jargon? Yes.

