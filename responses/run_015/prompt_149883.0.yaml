answer: |-
  Here is the plan for your ninety-minute session. It is structured to build the theorem brick-by-brick on the whiteboard, ensuring that when you state the result, it feels like an inevitable conclusion rather than a magic trick.

  ### I. The Sequence of Components
  *Total Time: 0–45 minutes*

  You must draw these on the board in this specific order. If you swap the order, the logic collapses or becomes mystical.

  1.  **The Object (Rule as Function):**
      *   **Board:** Draw a box labeled $F$. Arrows in labeled "Profile of Rankings" ($P$). Arrow out labeled "Winner" ($w$).
      *   **Why here:** You cannot define manipulation without a mechanism to manipulate.
      *   **Breaks if later:** If you define manipulation first, they ask "Manipulate what?"

  2.  **The Definition (Manipulability):**
      *   **Board:** Write: $\exists$ Profile $P$, $\exists$ Voter $i$, $\exists$ Lie $P'_i$ such that $F(P'_i, P_{-i}) \succ_i F(P_i, P_{-i})$.
      *   **Why here:** This is the metric of failure.
      *   **Breaks if later:** If you state the theorem before this, "manipulable" is a buzzword, not a technical condition.

  3.  **The Example (The 3-Voter, 3-Option Election):**
      *   **Board:** A matrix. Rows = Voters (1, 2, 3). Cols = True Preferences. A second matrix for "Reported."
      *   **Why here:** This anchors the abstract definition in engineering reality.
      *   **Breaks if later:** If you state the theorem before the example, the conditions (Range $\ge$ 3, No Dictator) look like arbitrary math constraints rather than structural necessities.

  4.  **The Conditions (Range & Dictator):**
      *   **Board:** Two bullet points next to the Theorem statement.
          1.  $|Range(F)| \ge 3$.
          2.  $\nexists$ Dictator (Voter $i$ s.t. $F(P) = \text{top}(P_i)$ always).
      *   **Why here:** These are the escape hatches. You must define the walls before you claim the room is sealed.
      *   **Breaks if later:** If you state the theorem without these, they will immediately propose "Just have two candidates" or "Let the maintainer-in-chief decide," claiming they disproved you.

  5.  **The Statement (Gibbard–Satterthwaite):**
      *   **Board:** "If $|Range| \ge 3$ and No Dictator $\implies$ Manipulable."
      *   **Why here:** This is the conclusion of the proof you didn't show them.
      *   **Breaks if later:** If you state it first, it's dogma. If you state it last, it's a deduction.

  ---

  ### II. The One Small Election
  *Total Time: 15 minutes (embedded in Sequence)*

  You requested a 3-voter, 3-option example where one voter promotes their second choice by demoting their true top. Use **Plurality Rule** with a specific tie-break. It is familiar enough to not distract, but flawed enough to work.

  **The Setup on the Board:**
  *   **Voters:** 1, 2, 3.
  *   **Options:** A, B, C.
  *   **Rule:** Plurality. Tie-break: Alphabetical (A > B > C).
  *   **True Preferences:**
      *   V1: A > B > C
      *   V2: B > C > A
      *   V3: C > B > A
  *   **Truthful Profile:** Votes are A, B, C. (1 vote each).
  *   **Outcome:** Tie. Tie-break selects **A**.
  *   **V1's Result:** A (1st choice). V1 is happy. No manipulation needed.
  *   **Correction for Manipulation:** You need V1 to be *unhappy* with the truthful outcome to motivate the lie.
  *   **Revised True Preferences:**
      *   V1: A > B > C
      *   V2: B > C > A
      *   V3: C > A > B  *(V3 prefers A over B)*
  *   **Truthful Profile:** Votes A, B, C. Tie. Tie-break **A**.
      *   V1 gets A. Still happy.
  *   **Revised Rule/Scenario to Force the Prompt's Constraint:**
      *   The prompt specifies: "promote her second choice to first by demoting her true top choice." This implies the truthful top choice *fails*, and the second choice *wins* via the lie.
      *   **True Preferences:**
          *   V1: A > B > C
          *   V2: B > C > A
          *   V3: C > B > A
      *   **Rule:** Plurality. Tie-break: **C wins ties**.
      *   **Truthful Votes:** A, B, C. (1 each).
      *   **Truthful Outcome:** **C**.
      *   **V1's Utility:** C is V1's *last* choice.
      *   **The Lie:** V1 reports **B** > A > C (Demotes true top A).
      *   **Reported Votes:** B, B, C.
      *   **New Outcome:** **B** (2 votes).
      *   **V1's Result:** B is better than C.
      *   **Success:** Manipulation worked.

  **Why the Example Must Have/Lack These Features:**
  *   **Must have 3 attainable outcomes:** If C were not an option (Range = 2), the truthful vote would be A vs B. V1 votes A, V2 votes B, V3 votes B (since C is gone, V3 prefers B over A). B wins. V1 cannot change this by voting B (B already wins) or C (C doesn't exist). With only 2 outcomes, majority rule is strategy-proof (May's Theorem). You need the "spoiler" dynamic of the 3rd option to create the manipulation lever.
  *   **Manipulation must succeed (Strictly Better):** If the lie results in A winning (V1's top), that's great, but if the lie results in C winning (same as truth) or A winning (impossible here), there is no *incentive*. GS defines manipulability as the *existence* of a profile where lying yields a *strictly preferred* outcome. If the outcome doesn't improve, it's not a manipulation in the game-theoretic sense; it's just noise.
  *   **Deviant must see other ballots:** GS is an *existence* theorem. It says "There exists a profile where..." To identify that profile, the voter needs to know the others' votes. If you introduce uncertainty, you move from GS (possibility) to Bayesian incentive compatibility (probability). Keep it deterministic to prove the vulnerability exists.
  *   **No intensities:** GS assumes ordinal rankings. If V1 says "I hate C infinitely," that's cardinal data. GS applies to the ranking A > B > C regardless of how much A is preferred to B.
  *   **No ties (in the rule):** The rule must be deterministic. If the rule flips a coin on ties, you introduce randomness, which changes the theorem (see Randomization section).
  *   **No uncertainty:** Same as "see other ballots." We are proving vulnerability, not risk assessment.
  *   **No moral vocabulary:** Do not write "Cheating" or "Honest." Write "Truthful Reporting" vs. "Strategic Reporting." "Cheating" implies a norm violation; GS proves the norm is mathematically unsustainable.

  ---

  ### III. The Misconception Map
  *Total Time: 20 minutes*

  Place these interventions exactly where they naturally arise in the flow. Do not save them all for the end.

  1.  **"This is Arrow's Theorem again."**
      *   **Place:** Immediately after stating GS.
      *   **Correction:** Arrow maps Profiles $\to$ **Social Ordering** (Ranking of all candidates). GS maps Profiles $\to$ **Single Winner**. Arrow assumes truth-telling and proves inconsistency of criteria. GS assumes criteria are met and proves lying is inevitable.
      *   **Board:** Draw Arrow's box outputting a list (A>B>C). Draw GS box outputting a name (A).

  2.  **"Democracy is impossible / All systems equally bad."**
      *   **Place:** After the Example.
      *   **Correction:** GS proves no *perfect* system exists. It does not prove all systems are *equally* manipulable. Some are hard to game (require complex coordination); some are easy (Plurality). Engineering is about managing trade-offs, not finding perfection.

  3.  **"Five seats somehow exempt them."**
      *   **Place:** When defining the "Outcome."
      *   **Correction:** The "Outcome" in GS is simply "The result of the election." If the result is a set of 5 people, that is one outcome from the set of all possible committees. The logic holds. If you can't elect one person without gaming, you can't elect five.

  4.  **"Approval or Score ballots evade it."**
      *   **Place:** During Escape Routes.
      *   **Correction:** They evade *Gibbard–Satterthwaite* (which assumes ordinal input). They do *not* evade *Gibbard (1978)*. The general theorem covers any mechanism where agents have preferences over outcomes. You can game Approval voting (e.g., bullet voting).
      *   **Board:** Write "GS (1973): Ordinal only" vs "Gibbard (1978): Any mechanism."

  5.  **"A second-price or Vickrey-style trick should work."**
      *   **Place:** During Escape Routes.
      *   **Correction:** VCG mechanisms are strategy-proof but require **quasilinear utility** (transferable utility/money). You can pay people to tell the truth. In a project election, you cannot side-pay maintainers to vote truthfully. The domain restriction (no money) kills VCG.

  6.  **"It claims people are constantly manipulating."**
      *   **Place:** After the Definition of Manipulability.
      *   **Correction:** GS proves a *vulnerable profile exists*. It does not claim that profile is *common* or *easy to find*. A system can be theoretically manipulable but practically robust if the required information is hidden.

  ---

  ### IV. Randomization
  *Total Time: 5 minutes*

  *   **Does it belong?** Yes. Engineers often propose "If it's tied, flip a coin" or "Randomized Ballot" as a fix.
  *   **Where:** In the Escape Routes section, just before the Final Check.
  *   **The Argument:** Gibbard (1977) extended the result to randomized social choice functions. The only strategy-proof randomized rules are **random dictatorships** (pick a voter at random, let them decide).
  *   **Board:** Write "Randomization $\nrightarrow$ Safety." Write "Random Dictator = Still a Dictator."
  *   **Takeaway:** You cannot buy strategy-proofness with randomness unless you are willing to accept a lottery over dictators.

  ---

  ### V. What to Leave Out & Say Aloud
  *Total Time: 5 minutes*

  *   **Leave Out:** The proof. Specifically, the induction on the number of voters and the "pivotal voter" lemma.
  *   **Say Aloud:** "I am leaving out the proof. It is an induction on the number of voters that identifies a 'pivotal' agent who becomes a dictator. It is beautiful, but it is not your tool. Your tool is the **statement** and the **conditions**. You are engineers, not mathematicians. You need to know the load-bearing walls, not the chemistry of the concrete."
  *   **Why:** If you attempt the proof, you will lose the room in 20 minutes. If you explain *why* you aren't doing it, you maintain authority and focus.

  ---

  ### VI. The Final Check (Last 10 Minutes)

  **Your Draft:** "Hand them a rule I invented on the spot... ask them to find me a manipulation."
  **Verdict:** This is the **right kind of test**. It forces them to operationalize the definition of manipulability.

  **Refinement for Whiteboard:**
  Do not hand anything out (constraint). Write the rule on the board.
  **The Rule:** "Top-Two Runoff. If no majority, the top two by plurality face off. Tie-break: Alphabetical."
  **The Task:** "I have 3 voters, 3 candidates (A, B, C). Construct a profile where Voter 1 benefits by lying."
  **Why this is better:** It mimics their reality (runoffs are common in OSS). It requires them to use the 3-outcome condition (if they only use 2 candidates, they won't find the manipulation).

  **The Single Success Sentence:**
  If a volunteer can produce this sentence the next day, the session worked:
  > **"If we have three or more possible outcomes and no single dictator, there will always be some scenario where a maintainer gets a better result by voting tactically."**

  **Why this sentence:**
  1.  It captures the **Conditions** (3+ outcomes, no dictator).
  2.  It captures the **Result** (Always some scenario).
  3.  It captures the **Definition** (Better result by voting tactically).
  4.  It avoids the **Misconceptions** (It doesn't say "always voting tactically," it doesn't say "impossible to elect," it doesn't confuse Arrow).

  ### Summary of Board Layout (Mental Image)

  *   **Left Column:** Definitions (Rule, Profile, Manipulation).
  *   **Center:** The 3-Voter Example (Truthful vs. Strategic matrices).
  *   **Right Column:** The Theorem Statement + Conditions + Escape Route Checklist (Arrow, 5 seats, Approval, VCG, Random).
  *   **Bottom:** The Success Sentence (written in the final 5 minutes).

  This plan respects the 90-minute limit, adheres to the whiteboard constraint, and targets the specific cognitive shifts required for your audience.
