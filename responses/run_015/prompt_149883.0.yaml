          2.  Manipulability definition (strictly better by lying).
          3.  Two "technical" conditions (Range $\ge$ 3, No Dictator).
          4.  Statement of GS.
          5.  One small election example (3 voters, 3 options) carrying the whole session.
          6.  Specific constraints on the example (why 3 outcomes, why success not just change, why perfect info, no intensities/ties/uncertainty/moralizing).
          7.  Misconception Map (Arrow, Democracy impossible, 5 seats vs 1, Approval/Score, Vickrey, Frequency of manipulation).
          8.  Randomization (does it belong? where?).
          9.  What to leave out (Proof details?).
          10. Final Check (Last 10 mins): Is the drafted test (invented rule manipulation hunt) good? What's better? What's the "single sentence" success metric?

