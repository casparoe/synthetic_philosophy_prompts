          6.  Misconceptions/Escape Routes.
          7.  Randomization.
          8.  Final Check.
      *   *Why:* If you state GS before defining manipulation, it's magic. If you define manipulation without the example, it's abstract. If you discuss escape routes before the conditions, they won't see *why* the escape works (e.g., reducing range to 2).

  4.  **Designing the "One Small Election":**

      *   *Request:* 3 voters, 3 options. One voter promotes 2nd to 1st by demoting true top.
      *   *Requirements:*
          *   Needs 3 attainable outcomes (if 2, May's Theorem applies, GS doesn't kick in).
          *   Manipulation must succeed (strictly better outcome), not just change the winner (might change to worse).
          *   Deviating voter sees other ballots (GS assumes perfect info for the *possibility* of manipulation; if uncertainty exists, it's about *incentive*, but GS is about *existence* of a vulnerable profile).
          *   No intensities (Ordinal only).
          *   No ties (Deterministic rule).
          *   No uncertainty (Complete information game).
          *   No moral vocabulary ("Gaming" not "Cheating").
      *   *Construction:*
          *   Voters: 1, 2, 3. Options: A, B, C.
          *   Rule: Needs to be susceptible. Borda? Plurality? Let's use a specific constructed rule or Plurality with a twist to ensure the specific manipulation works. Actually, standard Plurality works well for 3 candidates.
          *   *Scenario:*
              *   True Preferences:
                  *   V1: A > B > C
                  *   V2: B > C > A
                  *   V3: C > A > B
              *   If everyone votes truthfully in Plurality: Tie (1 each). Need a tie-breaker. Let's say A wins.
              *   V1 wants B over A? No, V1 wants A.
              *   Let's adjust.
              *   V1: A > B > C. V2: B > C > A. V3: C > A > B.
              *   Rule: Plurality. Tie-break: Alphabetical. Winner: A.
              *   V3 prefers C > A > B. A wins. V3 can't help.
              *   Let's try V1 manipulating. V1: A > B > C.
              *   Current votes: A, B, C. Winner A.
              *   If V1 votes B: Votes B, B, C. Winner B.
              *   V1 prefers A > B. So voting B is worse.
              *   We need V1 to prefer the *result* of lying over the *result* of truth.
              *   Setup:
                  *   V1: A > B > C
                  *   V2: B > C > A
                  *   V3: C > B > A (Changed V3 to help B beat A).
                  *   Truthful: A (1), B (2), C (1). Winner B.
                  *   V1 hates B. V1 wants A. V1 can't make A win (max 2 votes if V3 switches).
              *   Let's use the prompt's specific instruction: "promote her second choice to first by demoting her true top choice."
              *   This implies the voter *lies* about their top choice.
              *   Setup:
                  *   V1 True: A > B > C.
                  *   V2 True: B > C > A.
                  *   V3 True: C > A > B.
                  *   Rule: Plurality. Tie-break: C wins ties.
                  *   Truthful Votes: A, B, C. Tie. Winner C.
                  *   V1 Outcome: C (3rd choice).
                  *   V1 Strategy: Vote B.
                  *   New Votes: B, B, C. Winner B.
                  *   V1 Preference: A > B > C. B is better than C.
                  *   Success: Yes.
                  *   Why 3 outcomes? If only A and B existed, and V1 prefers A, voting B is never useful unless it stops C. If C isn't an option, the dynamic changes (May's Theorem).
                  *   Why strict improvement? If the outcome stays the same, no incentive. If it gets worse, no incentive. Must be strictly better.
                  *   Why perfect info? GS says "There exists a profile." To find it, you need to know the profile.
      *   *Refinement:* I need to make sure I explain *why* the example needs these features in the plan.

  5.  **Mapping the Misconceptions:**

      *   *Arrow:* Arrow is about social welfare functions (rankings), GS is about social choice functions (winners). Arrow assumes no manipulation (truthful), GS assumes manipulation is possible.
      *   *Democracy Impossible:* GS says "No perfect rule," not "No voting." It defines the trade-off.
      *   *5 Seats:* GS is for single winners. Multi-winner (committee) is harder, not easier. If you can't elect one fairly, you can't elect five. (Actually, GS extends, but the intuition is that single-winner is the base case).
      *   *Approval/Score:* GS applies to ordinal. Cardinal systems (Range/Approval) *do* escape the literal GS theorem, *but* they fall under Gibbard's broader theorem (1978) which covers all strategic voting. I need to be precise here. The prompt says "I believe the general version covers non-ordinal inputs." Yes, Gibbard (1978) covers all social choice functions. So Approval is not a magic escape from *strategizability*, only from *GS specifically*.
      *   *Vickrey:* VCG mechanisms are strategy-proof but require quasilinear utility (money/transferable utility). Elections don't have side payments. So it doesn't apply.
      *   *Frequency:* GS proves *existence* of a vulnerable profile, not that it happens often or easily.

  6.  **Randomization:**

      *   *Query:* "Hazy memory that letting the rule randomise buys you nothing better than something like a random dictatorship."
      *   *Fact:* Gibbard (1977) proved that for randomized social choice functions, the only strategy-proof rules are "dictatorial mixtures" (random dictatorships).
      *   *Placement:* Put this in the "Escape Routes" section. It's a theoretical escape that is practically unacceptable (random dictator is still a dictator).
      *   *Decision:* Yes, include it. It shuts down the "just flip a coin" idea.

  7.  **What to Leave Out:**

      *   *Proof:* Definitely leave out the induction/pivotal voter proof. It's too technical for 90 mins with this audience.
      *   *Say Aloud:* "We are not proving this today. We are engineering with it."
      *   *Final Check:* The user's draft (invented rule manipulation hunt) is good. It tests application.
      *   *Better Test:* Give them a rule that *looks* complex and ask: "Is this immune?" or "Find the lie."
      *   *Success Sentence:* "Every non-dictatorial rule with three or more outcomes is manipulable." (Or close to it).

  8.  **Structuring the Response:**

      *   Follow the user's requested structure strictly.
      *   Tone: Professional, pedagogical, precise (matching the user's sophisticated prompt).
      *   Whiteboard focus: Describe what goes on the board.

  9.  **Refining the "One Small Election" Logic:**

      *   Must ensure the distinction between GS and Arrow is clear in the example. Arrow needs a full social ordering. GS just needs a winner.
      *   Must ensure the "3 outcomes" constraint is highlighted. If C is removed, V1 can't manipulate to get B over C (because C isn't there).
      *   Must ensure "Strictly Better" is highlighted.

  10. **Refining the Misconception Map:**

      *   Need to place them in the sequence.
      *   Arrow: After GS statement (contrast).
      *   Democracy: After GS statement (implications).
      *   5 Seats: During the "Scope" discussion.
      *   Approval/Score: During Escape Routes.
      *   Vickrey: During Escape Routes (Domain restriction).
      *   Frequency: During the Definition of Manipulation.

  11. **Final Review against Constraints:**

      *   90 minutes? Yes, timing needs to be tight.
      *   Whiteboard only? Yes, describe board states.
      *   15 volunteers? Interactive.
      *   No handouts? Rely on board retention.
      *   Specific order of components? Yes.
      *   Specific example constraints? Yes.
      *   Misconception map? Yes.
      *   Randomization? Yes.
      *   Leave out/Say aloud? Yes.
      *   Final check/Sentence? Yes.

      *Self-Correction on Approval/Score:* The prompt says "I believe the general version covers non-ordinal inputs." This refers to Gibbard (1978). GS (1973/1975) is ordinal. I must clarify that distinction. GS theorem *specifically* assumes ordinal rankings. Gibbard's later theorem generalizes to any mechanism. So Approval *evades GS* but *not Gibbard*. I need to make sure the user distinguishes these two theorems or clarifies that "GS" is often used as shorthand for the impossibility of strategy-proofness generally. Given the prompt asks to state "Gibbard-Satterthwaite", I should stick to the ordinal version but acknowledge the generalization when discussing Approval.

      *Self-Correction on 5 Seats:* The project elects a 5-seat committee. GS is for single winners. Does GS apply? Usually, committee election is treated as choosing one outcome from the set of all possible committees ($\binom{N}{5}$). So yes, it applies, but the domain is huge. I need to make sure they understand GS applies to the *choice function*, regardless of what the options represent.

