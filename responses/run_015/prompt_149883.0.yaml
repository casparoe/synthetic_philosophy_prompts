  3.  **Drafting the Component Order & Dependencies:**

      *   *Request:* "Give me the order in which the components have to arrive, and what breaks if they arrive later."
      *   *Logic:* You can't define manipulation without a rule. You can't state GS without defining manipulation and the conditions. You can't discuss escape routes without the statement.
      *   *Sequence:*
          1.  Rule (Function).
          2.  Manipulability (Definition).
          3.  The Example (Concrete instantiation of 1 & 2).
          4.  Conditions (Range $\ge$ 3, No Dictator).
