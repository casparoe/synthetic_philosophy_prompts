      *   *Introduction & Setup (15 mins):* Define the object of study (Voting Rule).
      *   *The Core Concept (20 mins):* Manipulation & The Example.
      *   *The Theorem (20 mins):* Conditions & Statement.
      *   *Misconceptions & Escape Routes (25 mins):* Addressing the specific list provided.
