answer: |-
  There is no single canonical term in the political science literature that binds Part 1 (the selection filter) and Part 2 (the anticipatory distortion) into a single causal mechanism as tightly as you describe.

  The literature typically treats these as two adjacent but distinct concepts:
  1.  **Agenda Control / Ballot Qualification:** This covers your Part 1. It analyzes the signature threshold as a barrier to entry that filters for binary, well-funded, or highly motivated issues.
  2.  **The Indirect Effect (or Threat Effect):** This covers your Part 2. It describes how the *possibility* of an initiative or referendum alters legislative behavior without a vote ever occurring.

  **The Gap:** The standard treatment of the "Indirect Effect" often assumes the threat stems from *public opinion* (i.e., legislators fear the voters will reject the law). Your observation corrects this: the threat stems from *organizational capacity* (i.e., legislators fear a specific group can *force* the vote). The literature frequently conflates "what voters want" with "what signature-gatherers can qualify."

  Because no existing term captures the *dependence of the anticipation on the qualification filter*, you should coin one. The most precise label is:

  ### **The Qualification Shadow**

  **Definition:** *A structural distortion in representative lawmaking caused by the legislature's anticipation of a direct-democratic challenge, where the credibility of the challenge is determined not by general public salience, but by a specific actor's capacity to meet formal signature thresholds.*

  This term binds the two parts: "Qualification" refers to the filter (Part 1) that determines what is actionable; "Shadow" refers to the anticipatory distortion (Part 2) cast by that actionable threat.

  ---

  ### **Application to Your Test Cases**

  Here is how **The Qualification Shadow** carves out the boundaries of the phenomenon using your four scenarios:

  **1. A genuinely mandatory referendum (automatic vote).**
  *   **Verdict:** **Outside the concept.**
  *   **Reasoning:** There is no *qualification* hurdle. The threat is automatic and universal, not dependent on organizational capacity. The legislature anticipates the vote, but the mechanism is "Constitutional Requirement," not "Qualification Shadow." The distortion here is uniform, not skewed by who can gather signatures.

  **2. A proactive citizen initiative (legislature passes a watered-down version to pre-empt).**
  *   **Verdict:** **Inside the concept (Core Case).**
  *   **Reasoning:** This is the purest expression of the Qualification Shadow. The legislature is not responding to the *merits* of the initiative, nor necessarily to majority opinion, but to the *credibility of the qualification threat*. The "watering down" is the distortion caused by the shadow. It is the mirror image of the referendum threat: the legislature moves to occupy the space so the qualification effort becomes moot.

  **3. A bluff (group believed to have capacity, but does not).**
  *   **Verdict:** **Inside the concept (Conditional).**
  *   **Reasoning:** The Qualification Shadow is indexed to *perceived* capacity, not just actual capacity. If the legislature *believes* the threshold can be met, the shadow falls and legislation is distorted. However, this is an unstable equilibrium. If the bluff is called and signatures fail, the "shadow" evaporates for that actor in future cycles. The phenomenon requires the *reputation* of capacity, which usually implies a history of actual capacity.

  **4. Loss of control (vote called for intra-party reasons, outcome uncertain).**
  *   **Verdict:** **Boundary Case (Deterrence vs. Leverage).**
  *   **Reasoning:** The Qualification Shadow typically functions as *leverage* (Group X threatens Vote to get Policy Y). If the caller cannot specify the outcome, the mechanism shifts from *leverage* to *deterrence* (mutually assured destruction). The shadow still exists (legislators may avoid the topic entirely to prevent the vote), but the *direction* of the distortion is unclear. The concept presupposes a strategic actor; if the actor is reckless, the shadow becomes "noise" rather than a directional force.

  ---

  ### **Differentiation: What This Is Not**

  You asked for the carving: how this differs from ordinary influence and general unpopularity.

  #### **1. Vs. Ordinary Interest-Group Influence**
  In a purely representative system, interest groups influence bills through lobbying, campaign finance, and expertise.
  *   **The Difference:** Ordinary influence is **continuous and private**. The Qualification Shadow is **binary and public**.
  *   **The Mechanism:** Lobbying says, "If you pass this, we will be unhappy and may support your opponent next election." The Qualification Shadow says, "If you pass this, we have a *procedural key* (signatures) that bypasses you entirely and triggers a vote *now*."
  *   **The Structural Add:** The formal threshold creates a **veto point** that is external to the legislature. Ordinary influence works *within* the legislative veto points (committees, floor votes). The Qualification Shadow works by threatening to *override* those points.
  *   **Observable Difference:** In ordinary influence, a bill is weakened to satisfy the *committee chair* or *party leadership*. Under the Qualification Shadow, a bill is weakened to satisfy an *external actor* who is not necessary for the bill's passage but is necessary for its *survival*.

  #### **2. Vs. Legislative Moderation of Unpopular Bills**
  Legislators naturally avoid passing laws that polls show are unpopular.
  *   **The Difference:** Unpopularity is **diffuse**; Qualification Capacity is **concentrated**.
  *   **The Mechanism:** Public opinion is a fog; signature capacity is a metric. A legislature might ignore a 60% majority if that majority is unorganized (no shadow). A legislature will accommodate a 20% minority if that minority can prove they have 50,000 signatures in 90 days (strong shadow).
  *   **The Empirical Signature:** To distinguish the Qualification Shadow from simple responsiveness to opinion, look for **Legislative Concession to Minority Capacity.**
      *   *Test:* If a bill is modified to appease a group that *polls poorly* (minority view) but has *high signature density* (e.g., a specific union, a specific industry, a specific ideological single-issue group), that is the Qualification Shadow.
      *   *Test:* If a bill is allowed to proceed to a vote despite *high opposition*, because the opposition lacks signature capacity, that is the *absence* of the Qualification Shadow.

  ### **Summary of the Carving**

  *   **It is not** "Direct Democracy" (the system).
  *   **It is not** "The Indirect Effect" (too broad, ignores the selection filter).
  *   **It is not** "Lobbying" (lacks the procedural bypass threat).
  *   **It is** **The Qualification Shadow**: The specific distortion of legislation caused by the credible threat of bypassing the legislature via a formal signature threshold.

  **The Empirical Signature:**
  You will know you are observing the Qualification Shadow when legislative text is altered to survive a *procedure* (the signature count) rather than to satisfy a *preference* (the vote count). The tell-tale sign is complexity being stripped out not because it is unpopular, but because it is **un-qualifiable** (too complex for a ballot summary) or because the opponents of that complexity hold the signature pen.
