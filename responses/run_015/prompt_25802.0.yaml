  Draft the joint statement that Daniel Dennett (or a philosopher holding his compatibilist position on moral responsibility) and Gregg Caruso (or a philosopher holding his free-will-skeptic position) could both sign after a good-faith adversarial collaboration on just deserts and punishment. The statement should cover: (1) claims both sides accept about determinism, agency, and the practices of blame and punishment; (2) the precise formulation of their disagreement, with each side's view stated in wording that side would endorse; (3) the cruxes—the sub-questions on which the disagreement turns; and (4) for each crux, the kind of empirical finding or philosophical argument that both would agree bears on it, with each side's prediction recorded. Format it as a numbered agreed-claims section followed by a disagreements table with columns for the issue, the compatibilist view, the skeptical view, and the crux. Throughout, separate what is settled among philosophers working on free will and moral responsibility from what remains genuinely contested, and do not present either side's position as the consensus.
