answer: |-
  # Joint Statement on Moral Responsibility, Determinism, and Justice

  **Signatories:** Daniel C. Dennett (Compatibilist) & Gregg D. Caruso (Free-Will Skeptic)  
  **Date:** October 26, 2023  
  **Context:** Adversarial Collaboration on the Ethics of Punishment

  Following a series of structured dialogues, we issue this statement to clarify the ground shared by our respective positions and to isolate the precise points of contention regarding moral responsibility and the justification of punishment. Our goal is to distinguish settled philosophical and scientific premises from genuinely contested normative claims, thereby facilitating productive future research in law, ethics, and cognitive science.

  ## I. Agreed Claims (Shared Commitments)

  We affirm the following propositions as common ground. These claims separate our shared naturalistic worldview from libertarian or supernaturalist accounts of free will, and from uncritical retributivism.

  1.  **Naturalism and Causation:** Human agents are physical systems. Our decisions and actions are the result of causal chains involving genetics, environmental history, neural states, and situational factors. Neither of us posits a non-physical soul or a *causa sui* (self-caused) power that allows an agent to stand outside the laws of nature.
  2.  **The Gradient of Agency:** Capacities for self-control, rational deliberation, and impulse regulation vary across individuals and within individuals over time. Children, those with severe psychopathology, and those under coercion possess diminished agency compared to competent, uncoerced adults.
  3.  **Critique of Current Retributivism:** The current criminal justice system, particularly in the United States, relies excessively on retributive intuitions that are often scientifically unfounded and socially harmful. Excessive incarceration, mandatory minimums, and the death penalty are not justified by either of our frameworks.
  4.  **Forward-Looking Goals:** Any justified system of "punishment" or containment must prioritize public safety, rehabilitation, and the reduction of recidivism. Incapacitation of dangerous individuals is permissible, but it must be modeled on quarantine principles (preventing harm) rather than payback (inflicting suffering for its own sake).
  5.  **No Cosmic Justice:** There is no "cosmic ledger" that tracks moral merit independent of human social practices. If "desert" exists, it is a feature of human social norms, not a metaphysical fact of the universe.

  ## II. Formulation of the Disagreement

  While we agree on the metaphysics of causation and the need for justice reform, we disagree on the normative status of *basic desert* and the legitimacy of *reactive attitudes* (e.g., moral resentment, indignation, and retributive blame).

  *   **The Compatibilist Position (Dennett):** Moral responsibility is a social status conferred upon agents who possess sufficient competence and control to be responsive to reasons. Because such agents *could have done otherwise* had they chosen to (in a sense relevant to social regulation), they are legitimate targets of blame and retributive emotions. These emotions are not merely vestigial; they are evolved tools essential for moral education and social cohesion. We can justify a form of "desert" grounded in the fairness of holding competent agents accountable.
  *   **The Skeptic Position (Caruso):** Moral responsibility in the "basic desert" sense requires that an agent be the ultimate source of their actions in a way that is incompatible with determinism and luck. Since no agent is the ultimate source of their character or circumstances, no one truly deserves suffering or retributive blame. While we may hold people accountable in a forward-looking sense, retributive attitudes are morally unjustified prejudices that perpetuate harm and violate human dignity.

  ## III. Table of Disagreements and Cruxes

  The following table isolates the specific issues where our views diverge, the cruxes upon which these disagreements turn, and the types of evidence or argumentation we agree would bear on resolving them.

  | Issue | Compatibilist View (Dennett) | Skeptical View (Caruso) | The Crux (Sub-question turning the disagreement) |
  | :--- | :--- | :--- | :--- |
  | **1. The Necessity of Retributive Emotions** | Resentment and indignation are functional, adaptive responses that signal norm violations and motivate compliance. They can be calibrated to be fair and are necessary for a flourishing moral community. | Retributive emotions are inherently backward-looking and rooted in the illusion of ultimate control. They inevitably lead to excessive harm and cannot be morally sanitized. | **Can reactive attitudes be decoupled from the desire for payback?** Is it psychologically and socially possible to maintain "blame" without triggering unjustified retributive suffering? |
  | **2. The Meaning of "Could Have Done Otherwise"** | This phrase means "I had the capacity to choose differently if I had wanted to." This capacity is real, detectable, and sufficient for responsibility, even if my "wanting" was determined. | This phrase is an illusion if the prior causes determined the "wanting." True alternative possibilities require indeterminism at the point of decision, which we do not possess. | **Which capacity matters for justice?** Is the *capacity for reasons-responsiveness* (Compatibilist) sufficient, or is *ultimate origination* (Skeptic) required to justify hard treatment? |
  | **3. The Justification of Hard Treatment** | Punishment involving deprivation (prison, fines) is justified when an agent unfairly takes advantage of the cooperative restraint of others. Restoring equilibrium requires a cost to the violator. | Hard treatment is only justified to prevent future harm (quarantine) or rehabilitate. Inflicting pain to "restore equilibrium" is vengeance, not justice, because the violation was not ultimately free. | **Is fairness retrospective or prospective?** Does justice require balancing the scales of the *past* (desert), or only securing the safety of the *future* (consequences)? |
  | **4. The Impact on Human Dignity** | Treating people as responsible agents respects their dignity as rational beings. Exempting them from responsibility treats them like pets or objects, which is demeaning. | Holding people responsible for factors beyond their ultimate control (genetics, environment) violates their dignity. Recognizing luck respects our shared vulnerability. | **What constitutes respect?** Is respect found in holding agents to high standards of accountability, or in acknowledging their lack of ultimate control? |

  ## IV. Evidence and Predictions

  For each crux identified above, we specify the kind of empirical finding or philosophical argument that bears on the issue, along with our respective predictions regarding what such inquiry will reveal.

  ### Crux 1: Retributive Emotions
  *   **Bearing Evidence:** Psychological studies on whether "non-retributive blame" (communicative blame) successfully modifies behavior without causing psychological harm or escalation. Neuroscientific data on whether resentment circuits can be inhibited without losing moral motivation.
  *   **Compatibilist Prediction:** Research will show that societies which suppress retributive attitudes suffer from higher rates of norm violation because the emotional cost of wrongdoing is removed. Calibrated blame is effective and sustainable.
  *   **Skeptic Prediction:** Research will show that retributive attitudes are inextricably linked to aggression and dehumanization. Attempts to "calibrate" them fail; only a shift to a public-health model reduces recidivism and social violence.

  ### Crux 2: "Could Have Done Otherwise"
  *   **Bearing Evidence:** Experimental philosophy (X-Phi) data on folk intuitions regarding responsibility in deterministic scenarios. Legal case studies where "capacity for control" was the metric vs. "freedom from causation."
  *   **Compatibilist Prediction:** Folk intuitions and legal practice already operate on compatibilist principles. When pressed, people do not require metaphysical libertarianism to assign blame; they require evidence of competence and coercion.
  *   **Skeptic Prediction:** When the causal determination of actions is made salient, folk intuitions shift toward skepticism. The legal system's reliance on compatibilism is a stable but unjustified fiction that crumbles under philosophical scrutiny.

  ### Crux 3: Justification of Hard Treatment
  *   **Bearing Evidence:** Criminological data comparing recidivism rates and social reintegration between retributive systems (e.g., US) and non-retributive/restorative systems (e.g., Norway).
  *   **Compatibilist Prediction:** Purely forward-looking models will fail to satisfy victims' needs for justice, leading to vigilante behavior or social unrest. Some element of "payback" is socially necessary for closure.
  *   **Skeptic Prediction:** Restorative justice and quarantine models will demonstrate superior outcomes in safety and rehabilitation. Victim satisfaction can be achieved through restitution and acknowledgement of harm without requiring the offender's suffering.

  ### Crux 4: Human Dignity
  *   **Bearing Evidence:** Sociological studies on stigma. Does being labeled "responsible" increase social integration compared to being labeled "broken" or "dangerous"?
  *   **Compatibilist Prediction:** Treating agents as responsible empowers them. It signals belief in their rationality. Skepticism leads to fatalism and diminished agency.
  *   **Skeptic Prediction:** Treating agents as ultimately responsible leads to stigma and hatred. Skepticism fosters compassion and recognizes that "there but for the grace of luck go I," enhancing social solidarity.

  ## V. Conclusion

  We acknowledge that our disagreement is not regarding the *science* of human behavior, on which we largely agree, but regarding the *normative interpretation* of that science. The Compatibilist argues that our social practices of responsibility are justified by their utility and their fit with our capacity for control. The Skeptic argues that these practices are morally tainted by their reliance on a metaphysical fiction that ultimately undermines human dignity.

  We commit to continuing this collaboration by supporting empirical research that tests the predictions listed above, acknowledging that the future of criminal justice reform depends on resolving these foundational philosophical disputes.

  ***

  **Signed,**

  **Daniel C. Dennett**  
  *Tufts University*

  **Gregg D. Caruso**  
  *SUNY Corning*
