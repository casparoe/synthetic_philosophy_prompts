      *   *Self-Correction on Caruso's view:* Caruso advocates the Public Health-Quarantine Model. He isn't against *consequences*, just *retributive* consequences.
      *   *Settled vs. Contested:* Explicitly state that the metaphysics of causation is largely settled (naturalism), but the normative implications are not.

  7.  **Final Review against Constraints:**
      *   Numbered agreed-claims? Yes.
      *   Disagreements table? Yes.
      *   Columns: Issue, Compatibilist, Skeptic, Crux.
      *   Empirical/Philosophical bearing? Included in the Crux/Evidence section.
      *   No consensus bias? Checked.

  8.  **Writing the Document:** (Iterative drafting process)
      *   *Header:* Joint Statement on Moral Responsibility and Justice.
      *   *Intro:* Context of collaboration.
      *   *Section I:* Shared Commitments. (Naturalism, Agency as gradient, Critique of Retributivism).
      *   *Section II:* The Core Disagreement. (Definition of Basic Desert).
      *   *Section III:* Table of Disagreements & Cruxes. (Focus on the justification of reactive attitudes and the definition of 'could have done otherwise').
      *   *Section IV:* Paths Forward. (What evidence matters).

