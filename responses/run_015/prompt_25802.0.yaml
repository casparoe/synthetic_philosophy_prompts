      *Refining the Crux:* The real fight is about the *legitimacy of retributive emotions* (resentment/indignation) in a deterministic world. Dennett says they are evolved tools. Caruso says they are vestigial prejudices.

      *Refining the Evidence:* What would change their minds? For Dennett: If blame consistently fails to modify behavior or causes net harm. For Caruso: If a non-retributive model fails to protect society or satisfy victims' need for justice.

