prompt: |-
  You are an expert in philosophy of history with working knowledge of dynamical systems theory, tasked with designing a teaching case for an advanced undergraduate seminar on historical explanation and contingency. Before constructing anything, take a moment to brainstorm: list the three design constraints that must hold simultaneously (a realistic diplomatic or bureaucratic setting, a genuinely micro-scale trigger, and a macro-divergence that is substantial but not catastrophic), and note which feature will isolate chaos-sensitive contingency from mere path dependence.

  Then design a historical counterfactual scenario set in the nineteenth or twentieth century—realistic, not fantasy or science fiction, situated in a government, diplomatic, or organizational context—engineered to these specifications:

  - Length: one paragraph describing the counterfactual.
  - The triggering cause must be genuinely micro-scale: for example, a misfiled telegram, a rainstorm delaying a courier by several hours, or a single mistranslated clause in a preliminary draft—not a large-scale economic shock, military mobilization, or ideological shift.
  - The outcome divergence must be structurally significant: for instance, a treaty takes a markedly different form, a revolutionary coalition fractures along different lines, or a war is delayed by months with altered alliance structures—substantial, but not world-ending or apocalyptic.
  - The case must be designed so that a structuralist historian, who holds that large-scale economic, demographic, or institutional forces determine macro-outcomes, can plausibly argue the divergence was temporary or illusory and that structural forces would eventually have reconverged on essentially the same result. Simultaneously, a chaos-sensitive historian, who accepts sensitive dependence on initial conditions in social systems, must be able to argue that the system was near a bifurcation point, that the micro-event pushed the trajectory onto a genuinely different attractor, and that large-scale forces could not have pulled it back.
  - Crucially, inject the conceptual distinction between path dependence (where history is sticky—removing an event changes the sequence but not the long-run equilibrium) and genuine sensitive dependence (where infinitesimal differences produce exponentially diverging trajectories that structural forces do not reconverge). Your scenario should turn on this distinction, not on a generic “small cause, big effect.”

  After presenting the scenario, provide the following demonstration, without citing specific obscure scholars by name and without providing any bibliography, reading list, or citations:

  (a) The structuralist reading: what they say about the case and why they treat the micro-event as noise within larger forces.
  (b) The chaos-sensitive reading: what they say, why they invoke near-bifurcation or far-from-equilibrium dynamics, and why reconvergence is impossible in this system.
  (c) The work feature: identify the specific structural feature of the case—such as proximity to a critical threshold, weak negative feedback, or the presence of multiple unstable equilibria—that does the philosophical work.
  (d) The removal test: explain exactly what happens to the argument if that feature is removed, for example if the system was far from equilibrium with strong stabilizing feedback.
  (e) The structuralist rebuttal: how a defender of structuralism would attack the case as unrealistic, stipulative, or cheating.

  Deliver your response as a JSON object with exactly these fields:

  - "brainstorm_check": a brief string confirming the design constraints and consistency check.
  - "scenario": the one-paragraph counterfactual.
  - "micro_trigger": a brief string identifying the micro-event.
  - "macro_divergence": a brief string describing the large-scale difference.
  - "structuralist_reading": the analysis in (a).
  - "chaos_reading": the analysis in (b).
  - "work_feature": the analysis in (c).
  - "removal_test": the analysis in (d).
  - "structuralist_rebuttal": the analysis in (e).
  - "conceptual_injection_note": a brief string explaining how the case uses the path-dependence versus sensitive-dependence distinction.

  Think carefully and step by step. Do not include bibliographies, citations, or reference lists. Ensure the scenario remains realistic and does not rely on exotic physics, perfect predictors, or fantasy elements.
