answer: |-
  Your friend is mistaken because dark ignition demonstrates not a dissociation between access and phenomenality, but a dissociation between first-order consciousness and second-order metacognitive confidence.

  Here is the position you need to defend: Global Workspace Theory (GWT) identifies phenomenal consciousness with the global availability of information to multiple cognitive systems, not specifically to the introspective system responsible for verbal report. In your dark ignition cases, the stimulus is demonstrably available to motor systems (forced choice), mnemonic systems (priming), and even linguistic systems (spontaneous mention in free report). Therefore, on the functionalist definition GWT employs, the content is conscious. The patient's direct denial is not a transparent window into their phenomenology; it is the output of a specific, fallible consumer system—the metacognitive monitoring mechanism—that happens to have a higher activation threshold than the other consumers.

  You must insist that the "extra" prefrontal reverberation found in echo trials is not the generator of consciousness, but the generator of *confidence* or *knowledge attribution*. This maps neatly onto higher-order thought (HOT) theories without conceding the A/P distinction. In dark trials, the content is in the workspace (conscious), but the higher-order monitor fails to categorize it as "seen" (unconscious of the seeing). In echo trials, the monitor succeeds. This explains the betting behavior: the patient isn't lying, they are genuinely lacking confidence, but their lack of confidence is a metacognitive error, not evidence of phenomenal absence. If you accept that introspection is a physiological process subject to noise and thresholding just like vision or memory, there is no reason to privilege its negative verdict over the positive verdicts of priming and spontaneous speech.

  Now, let's deal with the objections your friend will raise, because they are standard and serious.

  First, the charge of unfalsifiability: "If you say ignition is consciousness even when they deny it, aren't you just stipulating definitions?" No, because the theory remains falsifiable on the functional front. If you found trials with the ignition signature that produced *no* downstream consequences—no priming, no forced-choice accuracy above chance, no spontaneous mention—then you would have to admit the ignition was not conscious. GWT claims consciousness *is* the broadcasting. If nothing receives the broadcast, there is no consciousness. In dark ignition, things *do* receive the broadcast. You are not immunizing the theory; you are widening the evidence base beyond the noisy channel of direct report. We accept this elsewhere: we don't say a paralyzed patient is unconscious because they can't move a muscle to report; we look for other signals. Here, the priming and free speech are the signals.

  Second, the claim that discarding report destroys your evidence link: "If report doesn't track consciousness, why did you ever use it to validate ignition?" You must argue that report is a *good* but *imperfect* indicator. In standard conditions, metacognition is calibrated correctly. Dark ignition represents a pathological decoupling, likely due to the epilepsy or electrode placement affecting the monitoring loop. Using report as the sole criterion is behaviorism; using it as one converging line of evidence alongside neural data and indirect behavioral measures is cognitive science. If the neural signature predicts priming perfectly, but report only 80% of the time, the neural signature is the better tracker of the underlying state, and report is the variable output.

  Third, the argument that the distinction is doing work: "The dark/echo split predicts report differences, so isn't that the real consciousness boundary?" You need to turn this around. The distinction predicts *reportability* and *confidence*, not experience itself. If you tell the dark ignition patient, "Look, you're guessing above chance, just go with your gut," and they continue to deny, they are suffering from a specific deficit in trusting available information. This is analogous to blindsight, but inverted. In blindsight, there is access (guessing) without report/phenomenality (usually attributed to lack of V1 ignition). In dark ignition, there is ignition/access, but the "feeling of seeing" (which is actually the feeling of *knowing that you see*) is missing. Your friend is conflating the *experience* with the *appraisal* of the experience.

  Finally, stop letting your friend wield the "phenomenal consciousness" concept as a trump card. If a state guides action, primes memory, and enters speech, what is the "phenomenal residue" that is missing? If you strip away all those functional roles, you are left with a non-functional epiphenomenal ghost. GWT is a functionalist theory. It claims that what it is like to see red is for the representation of red to be globally available. If the representation is globally available, it is what it is like. The patient's insistence otherwise is a philosophical error instantiated in their brain—a failure of the system that constructs the narrative self to incorporate the available data. You are not denying their experience; you are correcting their interpretation of it. Stand firm: dark ignition is conscious experience with impaired metacognitive access, and the A/P distinction is a confusion born of treating report as infallible.
