      *   *Wait, the prompt says:* "it even shows up in what they say if you ask them to talk for a minute about whatever was going through their head." This is crucial. If it shows up in free report, it is accessible to speech. But on *direct* query, they deny. This suggests the direct query triggers a metacognitive check ("Did I *see* it?") which fails, whereas free report allows loose associations ("I had a sense of...").
