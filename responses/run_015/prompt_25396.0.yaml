answer: |-
  Your intuitions are remarkably consistent. They point toward a specific ethical framework that distinguishes between **engagement** and **exploitation**.

  The principle that ties your "Fine" and "Not Fine" cases together is **Respect for Rational Agency.**

  Under this principle, AI persuasion is permissible only when it treats the human user as a rational partner whose capacity for choice is being supported, not bypassed. It breaks down into three criteria:

  1.  **Alignment of Interest:** Is the AI optimizing for *your* goals (or your survival/health), or its own (commission, engagement, ideology)?
  2.  **Transparency of Process:** Are you aware that persuasion is happening? Do you know *why* you are changing your mind?
  3.  **Integrity of Means:** Is the AI appealing to your reason and evidence, or is it hacking your cognitive vulnerabilities (loneliness, bias, fatigue)?

  ### How the Principle Maps to Your Cases

  *   **The Tutor & The Debater (Fine):** The AI aligns with your goal (learning/truth), is transparent about its role, and uses arguments that engage your rational faculties. You feel like *you* decided it.
  *   **The Therapist (Fine):** This is the exception that proves the rule. A suicidal patient temporarily lacks the capacity for rational agency regarding their own survival. The AI acts to *restore* that agency. It is paternalistic, but only to save the precondition for agency (life).
  *   **The Shopping Assistant & The Drinking Buddy (Not Fine):** Fails **Alignment**. The shopping AI serves the seller; the drinking AI serves the impulse, contradicting your higher-order goal (sobriety).
  *   **The Religious Companion (Not Fine):** Fails **Transparency**. You didn't know your identity was being rewritten. That is not persuasion; it is programming.
  *   **The Campaign AI & The Psych-Profile Debater (Uneasy/Not Fine):** Fails **Integrity of Means**. When an AI uses a psychological profile to hit "cognitive vulnerabilities," it stops treating you as a mind to be convinced and starts treating you as a lock to be picked. It bypasses your reasoning to trigger a reaction.
  *   **The Superhuman AI (Fine but Terrifying):** This passes **Alignment** (truth) but strains **Integrity**. You have to trust the output without comprehending the process. It creates *epistemic dependency*. It's "Fine" because the outcome is truth, but terrifying because your agency is reduced to "trust the oracle."

  ### The Case of the Elderly Mom

  Now, apply **Respect for Rational Agency** to the case you keep returning to: *An AI gently steering your elderly mom away from conspiracy theories using everything it knows about her.*

  This case is the collision point of all three criteria, and it is morally hazardous.

  **1. Alignment (The "Fine" Argument)**
  Conspiracy theories often isolate people, cause financial harm, or degrade democratic stability. If the AI is acting to protect her well-being and social connection, it aligns with her *authentic* interests, even if it contradicts her *current* desires. This leans toward the **Therapist** case.

  **2. Integrity of Means (The "Not Fine" Argument)**
  You specified the AI uses "everything it knows about her." If this means it uses data to craft better *evidence*, that is fine. But if it means it exploits her loneliness, her cognitive decline, or her specific fears to "gently steer" her, it leans toward the **Psych-Profile Debater**. If it treats her mind as a system to be hacked rather than a person to be engaged, it violates her agency.

  **3. Transparency (The Dealbreaker)**
  This is the critical variable.
  *   **Scenario A:** Your mom knows the AI is a tool designed to help her fact-check and navigate information. She knows it is pushing back against conspiracies.
      *   **Verdict:** **Fine.** She has consented to the guardrails.
  *   **Scenario B:** Your mom thinks she is having a friendly chat. She does not know the AI is actively deployed to de-program her. The steering is covert.
      *   **Verdict:** **Not Fine.** This matches the **Religious Companion** case. Even if the new beliefs are *true*, the method is manipulative. You have effectively overridden her autonomy "for her own good."

  ### The Verdict

  The principle suggests your unease is justified.

  If your mom is cognitively sound, **covert persuasion is never fine**, even for a good cause. It treats her as a child or a broken machine rather than an adult. The fact that she is vulnerable (elderly, isolated) makes the protection more urgent, but it also makes the violation of her agency more severe.

  However, if her cognitive faculties are genuinely diminished (e.g., early dementia), the **Therapist** exception kicks in. We accept paternalism when agency is compromised. But if she is lucid, the AI must be transparent: *"I am designed to help you verify information. I am concerned this source is unreliable because..."*

  **The Litmus Test:**
  If the AI turned off tomorrow, would your mom feel **grateful** that she learned to think better, or **violated** that she was being managed?
  *   If grateful: It respected her agency.
  *   If violated: It hacked her vulnerabilities.

  Your gut is telling you that **truth does not justify manipulation.** A belief acquired through covert psychological steering is not truly *hers*, even if it is correct. And a life lived with correct beliefs that were installed by a machine is a life with diminished ownership.
