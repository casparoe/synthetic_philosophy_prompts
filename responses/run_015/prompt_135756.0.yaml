answer: |-
  The real-world jury system is not built on a single consistent theory. It is a hybrid machine that tries to serve two masters at once. The first master is accuracy: getting the right answer. The second master is legitimacy: making sure the community accepts the answer.

  The accuracy side relies on the math you mentioned, often called Condorcet's Jury Theorem. For this math to work, you need three things. First, each voter must be slightly better than random chance at spotting the truth. Second, they must vote independently, meaning one person's error doesn't cause another's. Third, you need a majority rule to aggregate the votes. The real system supports this with random selection (to get average competence) and secrecy (to protect independence).

  The legitimacy side relies on the idea of judgment by peers. This requires that the jurors represent the community, that they take the job seriously, and that the state cannot bully them into a verdict. The real system supports this with deliberation (showing they considered the evidence), unanimity or high majorities (protecting the accused), and secrecy (protecting jurors from retaliation).

  The tension you sensed is real. Deliberation threatens independence. If jurors talk, they influence each other, creating correlated errors that break the Condorcet math. If one stubborn juror has a veto under unanimity rules, the group becomes less accurate than a simple majority. The system tolerates this because legitimacy matters as much as raw accuracy. The secrecy of the deliberation room is the load-bearing wall here. It allows jurors to speak freely without public pressure, preserving enough independence for the math to hold while allowing enough discussion for legitimacy.

  Regarding your two changes, a believer in the Condorcet truth-tracking story has a major problem with one of them.

  Moving deliberation to the town square destroys independence. If the crowd can shout advice, jurors will vote to please the crowd or avoid shame, not based on the evidence. Their votes become correlated with public opinion, not the truth. This breaks the math completely. It also endangers the jurors, removing the protection secrecy provides. This change has to go if you want the system to function as a truth-finder.

  Weighting the votes of retired judges is actually defensible under the Condorcet story. The math assumes average competence. If judges are genuinely more competent than random citizens, giving their votes more weight increases the group's overall accuracy. However, this hurts the legitimacy story. If the goal is judgment by peers, elites having extra votes undermines the idea that the accused is being judged by their equals. But strictly on the truth-tracking math, it works.

  There are parts of the real system that are underdetermined, meaning history chose them arbitrarily where logic would allow alternatives. The number twelve is historical, not mathematical; six or fifteen would work similarly for the accuracy math. The rule against giving reasons is also flexible. Some legal systems require written reasons to allow for appeal, while common law systems do not to ensure finality. Both can function. You can change these without breaking the core logic of your novel's system.

  If you swap the truth-tracking story for the liberty-protecting story—that it is better for guilty people to walk than for one innocent person to suffer—the rules shift. The focus moves from accuracy to protection. Random selection becomes essential to prevent state stacking of the panel. Unanimity becomes load-bearing because it sets the highest barrier to conviction. Secrecy becomes essential to protect jurors from the state, not just to protect independence. Under this theory, your weighted judges are a problem because they introduce state-aligned elites into a peer group. Your public square is also a problem because it exposes jurors to mob pressure, which can be just as tyrannical as the state.

  Verdict: independence-and-majority + one has to go
