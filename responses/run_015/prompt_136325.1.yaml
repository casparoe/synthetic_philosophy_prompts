      *   *Bad Faith:* Defined as lying to oneself to avoid responsibility. This is generally correct (denying transcendence or facticity).
      *   *Example:* The waiter example is the classic Sartrean example from *Being and Nothingness*. The explanation (pretending he has to behave that way vs. free to quit) is accurate enough for an exam context.
      *   *Relation to 'The Look':* The student claims bad faith is "basically the same as Sartre's idea of 'the look'." This is incorrect. 'The Look' (Le Regard) concerns intersubjectivity and objectification by the Other. Bad faith is an intra-subjective phenomenon (lying to oneself). While related in the broader ontology, they are distinct concepts.
      *   *Conclusion:* "Sartre thinks we are only free when nobody is watching." This is a significant error. Sartre argues we are condemned to be free regardless of the Other. The Look modifies the experience (shame, objectification), but it does not negate ontological freedom.

