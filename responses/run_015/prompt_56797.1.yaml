answer: |-
  Your skepticism is well-founded. This passage is a classic example of "pop-metaphysics": it gets the broad strokes of the debate right but smooths over the technical distinctions that actually keep the debate alive. It presents a specific, somewhat dismissive viewpoint as settled fact.

  Here is a breakdown of what is accurate, what is a simplification, and what is misleading, followed by direct answers to your four specific questions.

  ### 1. The Setup: Leibniz and Black
  **The Passage:** *"Leibniz said no two things can be exactly alike... Max Black finished that off... imagine a universe containing nothing but two spheres... every property one sphere has the other has too."*

  *   **Accurate:** This correctly identifies the core of Max Black's 1952 counterexample. Black's goal was to show that PII is not a *logical truth*.
  *   **Simplification:** The passage glosses over the crucial distinction between **qualitative properties** (e.g., "being red," "being 5 miles from a sphere") and **impure properties** (e.g., "being 5 miles from *Sphere B*," "being identical to Sphere A").
  *   **The Problem:** If PII includes *all* properties (including impure ones), it is trivially true. Sphere A has the property "being identical to A," and Sphere B does not. Therefore, they are discernible. To make PII interesting, it must be restricted to *purely qualitative* properties. Black's argument only works if we agree to exclude impure properties. The passage implies they share "every property... including relational ones," which is only true if you describe the relations qualitatively (e.g., "standing in a symmetric relation to another sphere"). If you name the relata, the symmetry breaks.

  ### 2. The Adams/Haecceity Move
  **The Passage:** *"Adams tried to plug the hole by handing each sphere a haecceity... but that's circular, since you have to already know which sphere you mean before you can have such a property."*

  *   **Defensible Simplification:** This captures the standard objection to haecceities (thisness). The objection is that haecceities look like a name masquerading as a property.
  *   **What's Wrong:** It misrepresents the philosophical status of "primitive" properties. If haecceity is offered as a *primitive* (a basic building block of reality that cannot be analyzed further), the charge of circularity loses its bite. You aren't trying to *define* the sphere using the haecceity; you are saying the haecceity *is* the metaphysical ground of the sphere's individuality.
  *   **Nuance:** Robert Adams (1979) is indeed a proponent of primitive thisness. However, most haecceitists use haecceities to *reject* PII (arguing that things can be distinct *even if* they share all qualitative properties), whereas the passage suggests Adams used them to *save* PII (by counting haecceities as properties that make the spheres discernible). Both moves exist in the literature, but the passage conflates them to make Adams look like he's trying to "fix" a broken principle rather than offering a competing ontology.

  ### 3. The "Labels" Critique
  **The Passage:** *"What Black is really showing is that the principle was never a truth about the world at all, just a confused demand that objects carry labels around with them."*

  *   **Rhetorical Flourish:** This is the weakest part of the passage. It conflates **epistemic discernibility** (can an observer tell them apart?) with **ontological distinctness** (are they in fact two things?).
  *   **The Error:** Leibniz cared about ontological grounding (why is there *more than one* thing?). Black's critique suggests that if there is no epistemic way to distinguish them, the claim that there are "two" is empty. But a realist would argue that the universe could contain two distinct objects even if no observer (internal or external) could tell them apart. The passage dismisses the metaphysical question by reducing it to a labeling problem.

  ### 4. The Conclusion
  **The Passage:** *"So the principle is dead, and most metaphysicians these days treat it that way."*

  *   **Wrong:** This is hyperbole. PII is not "dead." It is a central, live topic in contemporary analytic metaphysics and philosophy of physics.
  *   **Context:** While many metaphysicians reject the *strong* version of PII (that qualitative properties *exhaust* identity), many defend weakened versions. Furthermore, in philosophy of physics (specifically regarding quantum indistinguishability of bosons), PII is a massive battleground. To say it is "dead" ignores the last 40 years of literature on structural realism, quantum statistics, and haecceitism.

  ---

  ### Addressing Your Specific Questions

  #### 1. Does the claim that the spheres really share every property survive standard replies about relational and demonstrative properties?
  **No, not without qualification.**
  The claim holds only if you restrict "properties" to **purely qualitative, intrinsic, and symmetric relational properties.**
  *   **Relational Reply:** If Sphere A is 10 meters from Sphere B, does A have the property "being 10 meters from B"? Yes. Does B have that property? No (B is 10 meters from A). If these count as properties, they are discernible. Black blocks this by insisting we only count *general* relational properties (e.g., "being 10 meters from *a* sphere").
  *   **Demonstrative Reply:** Does Sphere A have the property "being *here*" (pointing to A's location)? If space is absolute, A is at Location 1 and B is at Location 2. "Being at Location 1" is a property A has and B lacks. Black counters by suggesting the universe is symmetric; Location 1 and Location 2 are qualitatively identical.
  *   **Verdict:** The passage presents Black's conclusion as fact ("every property one sphere has the other has too") without acknowledging that this depends entirely on accepting Black's restrictive definition of "property." If you allow impure or location-based properties, the counterexample fails.

  #### 2. Is "circular" the right charge against Adams if he's offering thisness as primitive rather than as an analysis?
  **No, it is not the right charge, though it is a common one.**
  *   **Analysis vs. Primitive:** If Adams were trying to *analyze* or *define* identity in terms of haecceity, the charge of circularity would be fatal (you can't define X using X).
  *   **The Primitive Defense:** Adams argues haecceity is a **primitive**. Primitives are, by definition, unanalyzable. The charge of circularity assumes there is a more fundamental vocabulary available to describe the sphere without using "thisness." Adams denies this. He argues that individuality is a brute fact.
  *   **The Real Objection:** The stronger objection isn't circularity, but **explanatory idleness.** Critics argue that positing a "haecceity" adds no explanatory power; it's just naming the mystery ("What makes A distinct from B?" "A-ness." "What is A-ness?" "What makes A distinct from B."). The passage calls this "circular," which is a slightly imprecise way of stating the explanatory objection.

  #### 3. Does the bit about labels and 'two' not buying you anything slide between two different jobs the principle could be doing?
  **Yes, absolutely.**
  This is the most significant philosophical sleight of hand in the passage.
  *   **Job 1: Epistemic/Verificationist.** PII as a rule for *identifying* objects. (If I can't tell them apart, I can't claim there are two.) This is Black's stance.
  *   **Job 2: Ontological/Metaphysical.** PII as a claim about the *nature* of reality. (Distinctness must be *grounded* in some difference.) This is Leibniz's stance.
  *   **The Slide:** The passage argues that because the spheres can't be *labeled* (Job 1), the claim that they are *two* buys nothing (Job 2). A metaphysical realist would reject this: the universe could contain two distinct spheres even if no language or observer could distinguish them. The passage treats the failure of the epistemic principle as a refutation of the ontological principle.

  #### 4. Does "the principle is dead and most metaphysicians agree" follow from anything in the rest of it, or is that just rhetoric?
  **That is rhetoric.**
  *   **Sociological Accuracy:** While it is true that *strong* PII (all properties, including relational) is widely rejected, *weak* PII (restricted to intrinsic qualitative properties) is still defended. Furthermore, the *debate* over PII is arguably more active now than in 1950, due to its intersection with quantum mechanics (where indistinguishable particles seem to violate PII).
  *   **Logical Follow-through:** Even if Black's counterexample works, it only shows PII is not a *logical necessity*. It doesn't show it isn't a *contingent truth* about our world. (Maybe our world just happens not to contain symmetric spheres, even if such a world is logically possible.) Declaring the principle "dead" based on a thought experiment about a possible universe is a non-sequitur.
  *   **Verdict:** This is the author trying to sound decisive. In academic metaphysics, PII is classified as "controversial" or "widely disputed," not "dead."

  ### Summary Verdict on the Book
  The book is giving you a **caricature of the debate**.
  *   **Trust:** The basic setup of Leibniz vs. Black.
  *   **Doubt:** The claim that Black "finished it off" (the debate continued), the characterization of Adams's haecceity move as simply circular (it's more nuanced), and especially the claim that the principle is "dead."

  The author is writing from a specific philosophical perspective (likely a Quinean or deflationary view) but presenting it as the consensus. Your instinct to question the haecceity move was correct, but not for the reason the book gives. The haecceity move isn't necessarily circular; it's just metaphysically "expensive" (it posits extra entities). The book dismisses it to clear the board for its own conclusion.
