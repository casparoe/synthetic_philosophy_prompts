  The rain in Leeds didn't fall so much as hang in the air, a damp grey curtain that seeped into the brickwork of the community centre. Maya rubbed her temples, the headache blooming behind her eyes again. On the desk sat a cheque for four thousand pounds. It was a donation from an anonymous trust, designated for 'critical infrastructure or strategic innovation'.

  To her left was the quote for the walk-in fridge. The compressor was dead. Without it, the perishables would spoil within the week. Two hundred families relied on this stock through the winter. It was certain, tangible good.

  To her right sat Liam, a twenty-year-old economics student with eyes too bright for a Tuesday afternoon. He had a laptop open, displaying a cascade of predictive models.

  "It's about expected value, Maya," Liam said, tapping the screen. "You have to look at the magnitude of the outcome, not just the probability."

  Maya looked at the fridge quote. "This keeps people fed now."

  "But consider the alternative," Liam pressed. He turned the laptop towards her. "My prototype analyses crop yield data against political instability. If it works, it predicts famines before they happen. We're talking about supply chain interventions that could save lives on a national scale."

  "What are the odds?" Maya asked, her voice flat.

  "Conservatively? One in fifty thousand that this specific model scales to prevent a catastrophic famine," Liam said. "But if it does, we're looking at saving around ten million lives over the next decade."

  Maya picked up a pen. She needed to see it. She wrote on the back of an envelope.

  **Option A: Fridge**
  Cost: £4,000
  Impact: 200 families fed (approx. 600 people).
  Probability: 100%
  **Expected Value: 600 people helped.**

  **Option B: Model**
  Cost: £4,000
  Impact: 10,000,000 lives saved.
  Probability: 1/50,000
  **Expected Value: 10,000,000 ÷ 50,000 = 200 lives saved.**

  "Two hundred," Liam said, pointing at the number. "In expectation, the model saves two hundred lives. The fridge helps six hundred people temporarily. But a life saved is worth more than a meal given, isn't it? If you weight the utility of survival over sustenance, the model wins. Mathematically, giving me the money is the only rational choice."

  For a moment, staring at the numbers, Maya felt the pull. It was seductive, the cleanliness of it. The arithmetic didn't care about the cold dampness of the storage room or the queue forming outside. It cared only about the sum total of good. If she gave him the money, and he failed, she lost nothing but cash. But if he succeeded, the payoff was so astronomical that it dwarfed the certain good. It felt like buying a lottery ticket where the jackpot was human survival. In the abstract, in the quiet logic of the office, it seemed brave to choose the bigger number. It felt like looking past the immediate pain for the greater future.

  Then the door opened.

  Mrs Gable shuffled in, wrapped in three coats, her hands shaking slightly. She needed insulin that required refrigeration. She needed vegetables that wouldn't rot in a broken unit. She looked at Maya, then at the student with his glowing screen.

  "Is the fridge fixed, love?" Mrs Gable asked. "I heard the humming stop."

  Maya looked back at the envelope. The number '200' stared back. But Mrs Gable wasn't an expected value. She was a certainty. The probability of her suffering if the fridge stayed broken was one hundred per cent. The probability of Liam's model saving ten million people was one in fifty thousand. It was a vanishing sliver.

  To give the money to Liam was to bet against Mrs Gable. It was to tell the woman standing in the puddle by the door that her certain hunger was worth less than a ghost of a chance at saving strangers in a country Maya couldn't pronounce. The maths said the ghost was heavier. The reality said the ghost was nothing.

  It felt absurd to hold the cheque out to Liam. It felt like magic thinking, like believing that throwing money into a void would summon a miracle because the void was deep enough. Yet, if she fixed the fridge, she was condemning herself to local optimisation. She was saving the people in the room and ignoring the millions outside it. Was that not selfishness disguised as pragmatism?

  Liam leaned forward. "You know the logic holds. If everyone acted on expected value, we'd solve extinction risks. We'd stop worrying about the visible tragedy and start preventing the invisible one."

  Maya looked at the cheque. She looked at Mrs Gable, who was now coughing into a handkerchief. She looked at the quote for the compressor, the ink slightly smudged from her earlier grip.

  The headache behind her eyes pulsed. The numbers on the envelope were clean, but the room was messy. The rain streaked the window, blurring the world outside into grey smudges. She held the cheque between her thumb and forefinger, hovering it over the desk, suspended between the certain cold and the improbable fire.

  "I need to check the wiring first," Maya said, her voice quiet.

  Liam nodded, packing his laptop away. "Think about the EV, Maya. Just the EV."

  He left. Mrs Gable waited. Maya stood alone in the centre, the cheque trembling slightly in the damp air, the sum of four thousand pounds feeling heavier than lead.
