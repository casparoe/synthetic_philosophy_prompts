answer: |-
  **STATUTORY GUIDANCE: NET SUFFERING REDUCTION (NSR) METRIC v4.2**
  **ISSUED BY:** OFFICE FOR SENTIENT LAND USE (OSLU)
  **UNDER:** WILDLIFE WELFARE ACT 2049, SECTION 12

  **1.0 PREAMBLE**
  This guidance establishes the metric for calculating Net Suffering Reduction (NSR) credits applicable to developments involving Permanent Habitat Conversion (PHC). In accordance with the Principle of Negative Welfare Maximisation, the Secretary of State recognises that wild sentient existence typically entails net negative welfare due to predation, starvation, and disease. Consequently, the removal of wild habitat constitutes a welfare improvement, provided recolonisation is prevented in perpetuity. Developers must demonstrate a reduction in Aggregate Sentient Distress (ASD) relative to the Baseline Suffering Load (BSL) of the site.

  **2.0 ELIGIBILITY AND PERPETUITY**
  2.1 To qualify for NSR credits, land must be rendered incapable of supporting wild sentient life for a minimum period of 120 years.
  2.2 Acceptable PHC methods include full impermeable surfacing (concrete, asphalt) or soil sterilisation via saline infusion. Partial clearance is ineligible.
  2.3 Where soft landscaping is proposed, a Perpetual Exclusion Barrier (PEB) must be installed to a depth of 2.5 metres to prevent burrowing fauna re-entry.
  2.4 Failure to maintain PHC status constitutes a breach of Section 14 (Unlicensed Suffering Generation). If wild fauna recolonise, the developer is liable for retroactive suffering penalties calculated from the date of breach.

  **3.0 TAXONOMY AND WEIGHTING**
  3.1 All wild animals are assigned a Sentience Coefficient (SC) based on neural complexity and pain receptor density.
  3.2 Mammals and avians carry an SC of 1.0. Amphibians and reptiles carry an SC of 0.6.
  3.3 Insect biomass is included under Schedule 9. Insects carry a provisional SC of 0.04. High-density insect habitats (e.g., wetlands, compost heaps) attract a High Suffering Risk classification.
  3.4 The BSL assumes all wild animals live full natural lifespans ending in predation or starvation. Developers need not prove individual suffering, only habitat capacity.

  **4.0 EXEMPTIONS AND DOMESTICATED STATUS**
  4.1 Farmed and companion animals are exempt from NSR calculations. Under the Dependency Principle, these animals exist under human stewardship where welfare is contractually guaranteed.
  4.2 Wild animals entering domesticated status (e.g., rescued hedgehogs) must be removed from the site immediately. Release is prohibited.
  4.3 Landowners must not provide water sources or shelter for wild fauna. The installation of bird baths, ponds, or insect hotels is classified as Active Suffering Inducement.

  **5.0 COMPLIANCE AND PENALTIES**
  5.1 Sites designated as High Suffering Risk (e.g., Somerset Levels wetlands) must undergo PHC within 24 months of purchase.
  5.2 Landowners who allow land to revert to wild state ("Passive Rewilding") will be issued a Compliance Notice. Failure to sterilise the land within 90 days results in compulsory purchase and remediation at owner's expense.
  5.3 Existence of standing water without chemical algicide is prima facie evidence of negligence.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Why is removing habitat better than supplementing food sources?**
  A: Supplementing food increases carrying capacity, leading to higher population densities and subsequent starvation events. Removal reduces the total number of sentient experiences to zero, which is the only guaranteed net-positive welfare outcome.

  **Q: Does this apply to garden ponds?**
  A: Yes. Residential ponds supporting amphibians exceed the Household Welfare Allowance. Owners must install mesh covers or apply approved larvicides quarterly.

  **Q: What if the animals seem healthy?**
  A: Visual health is not indicative of welfare status. The inevitability of future suffering dictates the metric. Prevention is mandatory regardless of current condition.

  ***

  **AUTHOR'S NOTE**

  The weakest joint in the real welfare biology argument is the empirical claim that wild lives are *net* negative. While suffering is abundant, asserting it universally outweighs pleasure is speculative; we simply cannot measure animal subjective experience that precisely. My fictional scheme exaggerates this by bureaucratizing the uncertainty into a rigid metric (the Sentience Coefficient) and demanding permanent sterilization, which real proponents rarely advocate (they usually suggest gradual intervention or genetic editing). However, the scheme is arguably *less* extreme than some serious philosophical defenses: certain negative utilitarians have argued that extinction of all sentient life would be morally preferable to reducing suffering. Here, I've limited the horror to wild animals, sparing humans and pets, which makes the bureaucracy plausible but the moral inconsistency (why pets are exempt) a source of friction for your protagonist.
