  The position is significantly insulated against economic refutation but remains vulnerable to sociological evidence from high-leisure egalitarian societies.

  **Fatal Defeater:** Evidence from societies with strong labour-time regulations (e.g. Netherlands, Denmark) where leisure is high, yet status competition remains intense via consumption or civic engagement. If the bind claims leisure is *socially inaccessible* due to status signalling, but these societies access leisure without eliminating status competition, the causal link is broken. A defender must concede that if leisure is taken without status loss despite competition, the bind is not the primary constraint.

  **Strong Defeater:** Revealed preference studies showing individuals choose income over leisure even when status signalling is anonymised or controlled. This supports the rival view that people genuinely prefer consumption. The bind predicts that once status markers are decoupled from hours, leisure demand will surge; if it does not, the thesis fails.

  **Awkward Defeater:** Historical data showing leisure hours increased during periods of growth without explicit changes to status markers (e.g. the introduction of the weekend). A defender might argue these were regulatory impositions, not social shifts, but sustained uptake suggests organic preference shifts incompatible with a rigid bind.

  **Insulation Risk:** The view risks unfalsifiability if the defender claims status competition merely migrates to consumption or 'side-hustles' whenever leisure increases. To remain scientific, the thesis must specify what constitutes a 'non-positional status marker' and admit that if leisure rises without them, the mechanism is incorrect.

  **Regulated Societies:** This is the crucial test. If status competition migrates to consumption rather than hours, the bind is technically preserved only if leisure remains *stigmatised*. If regulated societies exhibit high leisure without stigma, the bind fails; if they exhibit high leisure but those taking it are deemed 'less ambitious', the bind holds. The thesis can absorb evidence of migration only if it maintains that work-hours specifically, not general wealth, are the primary status signal. Current evidence suggests mixed results: regulations reduce hours, but 'busy culture' persists in elite sectors, partially sustaining the bind.

  **Rival Predictions:** Unlike regulatory capture theories, the bind predicts that without cultural status shifts, legal limits will face evasion or elite exemption. Unlike preference theories, it predicts latent demand for leisure if signaling mechanisms change. These predictions remain largely under-tested, though experimental economics offers avenues for verification.

  **Conclusion:** The view is not unfalsifiable, but its defender can absorb significant counter-evidence by shifting the locus of status competition. This insulation is problematic unless specific, observable non-positional markers are defined ex ante.
