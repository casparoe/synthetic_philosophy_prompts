      *   **Task:** Provide an honest assessment of the position's exposure/falsifiability. Rank defeaters from fatal to awkward. Distinguish between what counts against the view vs. what would be reinterpreted. Compare with rival explanations (preference for income, regulatory capture). Address evidence from societies with strong work-time regulations.
      *   **Constraints:** Max 550 words. British English. One-sentence bottom line at the start.

  2.  **Deconstruct the "Status-Leisure Bind" Thesis:**
      *   *Premise 1:* Technical abundance exists (15-hour work week possible).
      *   *Premise 2:* Leisure is stigmatised because work signals status.
      *   *Conclusion:* We need non-positional status markers to unlock leisure.
      *   *Vulnerability:* Is it unfalsifiable? Can any counter-evidence be absorbed by claiming "status competition just moved"?

  3.  **Identify Defeaters:**
      *   *Fatal:* Evidence that reduced hours *do not* lead to status loss in specific contexts, or that people genuinely prefer work/consumption regardless of status.
      *   *Strong:* Societies with work-time regulations (e.g., France, Netherlands) where leisure is high but status competition persists elsewhere (consumption). If the bind claims leisure is *inaccessible* due to status, but leisure is *high* despite status competition, the mechanism is wrong.
      *   *Awkward:* Historical periods where leisure increased without explicit status marker changes.
      *   *Insulation Risk:* Claiming status competition merely migrated to consumption or "hustle culture" side-projects.

  4.  **Drafting - Section by Section:**

      *   *Bottom Line:* Needs to be one sentence summarising exposure.
      *   *Ranking Defeaters:*
          1.  *Fatal:* High-leisure societies where status competition remains intense but does not enforce long hours. (e.g., Scandinavia/Netherlands). If the bind says leisure is inaccessible due to status, but these societies have leisure, the bind is broken unless status competition vanished there (unlikely).
          2.  *Strong:* Revealed preference data showing individuals choose higher income over leisure even when status signaling is controlled or anonymised.
