answer: |-
  Your intuition is correct: the argument collapses at **premise (5)**.

  Your friend has constructed a sophisticated version of a classic objection to Wittgenstein, one that echoes the skeptical paradox later popularized by Kripke. The argument relies on a hidden assumption about what constitutes a "determinate fact." Specifically, it assumes that for a fact to be determinate (e.g., "Speaker S understands utterance U"), it must be grounded in a sharp definition or an essential condition.

  If you wish to preserve (2) (that "language game" is a family-resemblance concept) and the general view that understanding is participation (4), you should reject **(5)**.

  Here is the breakdown of why (5) fails, how to rethink "calibration," and what philosophical cost this exacts.

  ### 1. The Error in Premise (5)
  **Premise (5):** *If "language game" lacks necessary and sufficient conditions, then for any speaker there is no determinate fact about whether she is calibrated within the relevant game.*

  This premise conflates **conceptual sharpness** with **practical determinacy**. It assumes that without a boundary line drawn in ink (an essence), there is no fact of the matter about whether one is inside or outside the area.

  Wittgenstein explicitly anticipates this in *Philosophical Investigations* §68–69. He asks whether the concept "game" is useless because it has no sharp boundary. His answer is that a concept without a sharp boundary is not necessarily unusable.
  *   **The City Analogy:** Wittgenstein compares a language game to an ancient city: a maze of little streets and squares, old and new houses, surrounded by new suburbs with straight regular streets. Is there an essence of "the city"? No. Is there a determinate fact about whether a specific building is in the city? Yes, for most buildings. For buildings on the extreme fringe, it might be vague. But the vagueness of the fringe does not render the location of the town hall indeterminate.

  **The Rejection:** You can deny that the lack of an essence entails global indeterminacy. There *is* a determinate fact about whether someone is playing chess (a language game) versus just moving wood, even if "game" itself has no essence. The fact is not grounded in a definition, but in the **regularity of the practice**.

  ### 2. Rethinking "Calibration" (Revising Premise 4 & 5)
  Your friend's notion of "calibration" in (4) and (5) is too intellectualized. It suggests calibration is a matter of matching one's internal state or external behavior against a *template* (the definition of the game). If the template is fuzzy (family resemblance), the match is indeterminate.

  To save the argument, you must shift from **Calibration-as-Matching** to **Calibration-as-Meshing**.

  *   **Old View (Friend's):** Understanding = Matching behavior to the essential rules of Game X.
  *   **New View (Wittgensteinian):** Understanding = Moving in such a way that others in the form of life do not check or correct you.

  Determinacy does not come from the *concept* of the language game; it comes from the **agreement in judgments** among participants. When I say "Slab!" and you bring me a slab, the fact that we understand each other is not secured by a shared definition of "ordering language game." It is secured by the fact that the action proceeded without a hitch.

  Therefore, (5) is false because the "determinate fact" of understanding is not a metaphysical relation between a speaker and a definition; it is a pragmatic relation between a speaker and a community's reaction.

  ### 3. Addressing the Collapse (Premise 7)
  **Premise (7):** *...communication collapses into mutual opacity.*

  This is a slippery slope fallacy regarding vagueness. Just because boundaries are fuzzy does not mean the center is hollow.
  *   We can successfully communicate "Pass the salt" (a clear case of a language game) even if we cannot define the necessary and sufficient conditions for "imperative utterance."
  *   The existence of borderline cases (e.g., is a mutter to oneself a language game?) does not invalidate the clear cases.
  *   Communication succeeds *not despite* the lack of essences, but because human beings share a "form of life" (PI §241). We agree in our reactions, not our opinions on definitions.

  ### 4. The Cost of This Solution
  If you reject (5) to save (2), what do you have to give up? You cannot have your cake and eat it entirely; there is a philosophical price.

  **A. You must abandon the craving for theoretical transparency.**
  Your friend's argument is driven by a desire for a "super-order" of concepts (PI §97). He wants philosophy to explain *why* communication works by finding the engine (the essence). By rejecting (5), you accept that philosophy cannot provide that foundation. You must accept that language rests on a ground that is not itself justified by reasons—it is simply "what we do." This is often unsatisfying to those seeking a rigorous theoretical framework.

  **B. You must accept that "determinacy" is context-dependent.**
  You have to concede that there are situations where it is genuinely indeterminate whether someone understands (borderline cases). In standard analytic philosophy, we often want a binary: either they understand or they don't. A Wittgensteinian must admit that "understanding" is itself a family-resemblance concept. Sometimes understanding is a sudden flash, sometimes it is a long-term ability, sometimes it is just acting correctly. There is no single "fact of the matter" that covers all these cases, yet communication does not collapse.

  **C. You risk a form of quietism.**
  If the determinacy of meaning rests on "agreement in form of life," you open the door to questions about what happens when forms of life diverge. If two communities disagree on whether a specific move counts as "following the rule," there is no higher court of appeal (no essence) to settle it. You must accept that justification comes to an end.

  ### 5. Does Family Resemblance Apply to Itself?
  Your friend's opening move was the "reflexivity constraint": *If family resemblance applies to everything, does it apply to family resemblance?*

  If you follow the path above, the answer is **yes**, but it doesn't destroy the concept.
  *   "Family Resemblance" is a tool for looking, not a theory of meaning.
  *   If "Family Resemblance" is itself a family-resemblance concept, it means there are various ways concepts can be related by overlapping similarities. There is no single "essence of family resemblance."
  *   This does not lead to infinite regress or collapse; it leads to the dissolution of the demand for an essence. The argument your friend constructed tries to use the lack of an essence to prove indeterminacy. But if the *demand* for an essence is the mistake, the lack of one is not a bug, but a feature.

  ### Summary Recommendation
  To resolve the argument with your friend:

  1.  **Reject Premise (5).** Argue that determinacy of use does not require essential definitions.
  2.  **Reframe Calibration.** Understanding is not matching a rule; it is the absence of friction in practice.
  3.  **Accept the Cost.** Acknowledge that this means giving up the hope for a philosophical theory that grounds language from the outside. The ground is the practice itself.

  You can tell your friend: *"You are assuming that without a rail (an essence), the train cannot stay on the tracks. Wittgenstein's point is that the train stays on the tracks because of the wheels and the ground (practice and agreement), not because there are metaphysical rails guiding it. The lack of rails doesn't mean the journey is indeterminate; it just means the stability is immanent to the travel, not external to it."*
