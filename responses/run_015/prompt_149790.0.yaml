  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** Presentism in history (the imposition of present-day values/concepts on the past).
      *   **Specific Trigger:** AI-generated fake primary sources (e.g., Civil War letters rewritten with modern therapeutic language about trauma/consent) and how historians judge the past based on these distorted sources.
