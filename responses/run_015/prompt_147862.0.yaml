answer: |-
  First, "axiological drag" is a sharp formulation. It rescues Weber from the vulgar "ideas cause things" reading and places him closer to complex systems theory: values as friction coefficients that alter the velocity of institutional change. That is a viable research program.

  To answer your question directly: The debate is no longer about whether Protestantism caused capitalism (that historical claim is largely battered). The live debate is about the **ontology of social explanation**. Specifically, can "culture" exist as a causal variable distinct from institutions and individual psychology?

  Here is the dependency map of the live disagreements, ranked by what settles what.

  ### 1. The Ontological Crux: Preferences vs. Constraints
  **Dependency:** This is the upstream bottleneck. Nothing else matters if you don't settle this.
  **The Disagreement:** Economists tend to model culture as *preferences* (tastes for work, trust, risk). Sociologists model it as *constraints* or *worldviews* (what is thinkable/legible).
  **Why it matters:** If culture is just preferences, it collapses into standard rational choice models. It becomes a parameter in a utility function, easily traded off against price incentives. If culture is a constraint (a limit on the choice set), it is causal in a way that resists economic arbitrage.
  **The Decisive Test:** Does the cultural trait persist when the price of holding it becomes prohibitively high?
  *   **If Yes:** Culture is a constraint/worldview (Weberian).
  *   **If No:** Culture is just a preference (Epiphenomenal/Neoclassical).
  **Tractability:** Low. This is philosophical heavy lifting, but you can spot it in empirical work. If a paper controls for "incentives" and culture still predicts outcomes, they are claiming it's a constraint. If they treat it as a taste, they are reducing it.

  ### 2. The Identification Crux: Institutions vs. Culture
  **Dependency:** Depends on Crux #1. If culture is just preferences, institutions shape them, and culture is epiphenomenal to institutional quality.
  **The Disagreement:** Acemoglu/Robinson (Institutions first) vs. Tabellini/Alesina (Culture first). The problem is co-evolution. Institutions select for cultures that sustain them, and cultures build institutions that reflect them.
  **The "Axiological Drag" Angle:** Your framing suggests culture changes the *payoff structure* of institutions. This implies culture is upstream of institutional stability.
  **The Decisive Test:** The "Epidemiological Approach" (Second-generation immigrants).
  *   **Method:** Look at immigrants in a *fixed* institutional environment (e.g., US or UK). If their economic outcomes correlate with the culture of their origin country (controlling for human capital), culture is causal.
  *   **The Fork:** If the effect disappears by the second generation, culture was just human capital or institutional memory. If it persists for 3+ generations *against* the host country's institutional incentives, you have evidence of "axiological drag."
  **Tractability:** High. This is where the best work is happening (e.g., Fernandez, Fogli).

  ### 3. The Transmission Crux: Internalization vs. Enforcement
  **Dependency:** Depends on Crux #2.
  **The Disagreement:** Is "culture" internalized norms (guilt, duty) or just social enforcement (shame, ostracization)?
  **Why it matters:** If it's enforcement, it's just a decentralized institution. It collapses back into "institutions." If it's internalization, it's psychological/anthropological and truly distinct.
  **The Decisive Test:** Anonymity.
  *   **Method:** Behavioral games (trust games, public goods games) where reputation is impossible.
  *   **The Fork:** If cultural differences vanish in anonymous settings, culture is just reputation management (Epiphenomenal). If differences persist in anonymity, values are internalized (Causal).
  **Tractability:** Medium. Lab experiments are clean but lack external validity. Field experiments are better but harder to scale.

  ### Where the Real Work Should Go (and Where to Avoid)

  **The Dead Ends:**
  1.  **Cross-Country Regressions:** Running "Trust" vs. "GDP" across 100 nations is garbage. Too many confounders, reverse causality is guaranteed. It produces correlations, not mechanisms.
  2.  **Textual Analysis of Doctrine:** Analyzing Calvin's writings to find "capitalist seeds" is dead. It ignores how doctrines are actually lived/practiced. The gap between theology and practice is where the causality lives.
  3.  **Genetic Explanations:** Trying to map culture to genetics is a political and scientific minefield that rarely yields clean causal identification for *social* outcomes.

  **The High-Value Targets:**
  1.  **Historical Natural Experiments with Cultural Splits:** Look for borders that split a culturally homogeneous group into different institutional regimes (e.g., North vs. South Korea, East vs. West Germany, or colonial borders in Africa/Asia).
      *   *Why:* This isolates Institutions.
      *   *The Twist:* Look for cases where Institutions were identical but Culture differed (e.g., different religious missions in the same colonial territory). This isolates Culture.
  2.  **The "Missionary" Literature:** Recent work (e.g., by Becker, Woessmann, or Nunn) on Protestant vs. Catholic missions.
      *   *Why:* Missionary placement was often quasi-random or driven by geography, not local economic potential.
      *   *The Question:* Did Protestant missions build human capital (schools) or change values (literacy for Bible reading)? If the latter, that's Weber.
  3.  **Mechanism of "Drag":** Investigate **normative inertia**. When institutions change (e.g., a regime collapse), how long do old behavioral patterns persist?
      *   *The Work:* Measure the decay rate of cultural traits after institutional shock. A slow decay rate supports "axiological drag." A fast decay rate supports "culture is epiphenomenal to institutions."

  ### The Verdict: What Forces a Drop?

  To force the field to drop **"Culture is Epiphenomenal"**:
  You need a case where a specific value commitment leads to **economic sub-optimality** for a sustained period, yet persists and eventually forces the institution to adapt to *it*.
  *   *Example:* A culture of "leisure preference" that resists wage increases, eventually forcing firms to automate or leave. If the culture remains after the firms leave, it's causal.

  To force the field to drop **"Culture is Causal"**:
  You need to show that every instance of "cultural explanation" can be fully mediated by **institutional incentives** or **psychological universals**.
  *   *Example:* If "trust" differences vanish completely when contract enforcement is perfected, then "trust" was just a proxy for weak institutions.

  ### Summary for Your Piece
  The crux isn't whether values matter; it's whether they are **state variables** (slow-moving, causal) or **control variables** (fast-moving, responsive).

  Your "axiological drag" framing works if you can demonstrate that values change the **cost function of institutional enforcement**. If a society values honesty, the cost of enforcing contracts drops. That is a causal mechanism.

  **Focus your reporting here:** The shift from "Culture causes Growth" (too vague) to "Culture lowers Transaction Costs" (tractable, testable, Weberian). The live disagreement is whether those lowered costs are due to *internalized values* (Weber) or *fear of social sanction* (Institutions). That is the fork in the road.
