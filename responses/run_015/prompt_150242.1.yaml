  ### Node 6: Decision Under Ontological Uncertainty (Path B-B)
  **In the absence of rational forecasting, economic agents decide by:**

  *   **A.** Relying on social convention and psychological "animal spirits."
      *   $\rightarrow$ **Leaf 6**
  *   **B.** Adopting a maximin strategy to avoid the worst possible outcome.
      *   $\rightarrow$ **Leaf 7**
  *   **C.** Preferring liquidity to maintain the option to act later.
      *   $\rightarrow$ **Leaf 8**

