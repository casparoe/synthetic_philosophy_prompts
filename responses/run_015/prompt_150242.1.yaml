  ### Node 5: Induction and Forecasting (Path B)
  **Does the principle of limited independent variety provide a rational basis for forecasting?**

  *   **A.** Yes, it allows past patterns to be projected into the future.
      *   $\rightarrow$ **Leaf 5**
  *   **B.** No, forecasting under uncertainty is entirely conventional.
      *   $\rightarrow$ Go to **Node 6**

