  ### Node 4: Decision Under Epistemic Uncertainty (Path A-B)
  **Under conditions of unmeasurable uncertainty, rational action requires:**

  *   **A.** Maximizing expected utility using best-guess subjective probabilities.
      *   $\rightarrow$ **Leaf 3**
  *   **B.** Applying a precautionary principle that deviates from expected utility.
      *   $\rightarrow$ **Leaf 4**

