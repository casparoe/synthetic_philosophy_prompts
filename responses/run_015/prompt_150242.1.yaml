  # Decision Tree: Interpretive Stances on Keynesian Uncertainty

  **Root Commitment:** You accept Keynes's distinction between **risk** (situations with measurable, numerically definite probabilities) and **uncertainty** (situations where such probabilities do not exist or are inapplicable).

  ---

  ### Node 1: The Nature of Unmeasurability
  **When numerical probabilities cannot be assigned to future events, is this because:**

  *   **A.** Our current information is insufficient, though the probabilities exist in principle? *(Epistemic)*
      *   $\rightarrow$ Go to **Node 2**
  *   **B.** The nature of the future is genuinely open, making numerical probabilities inapplicable? *(Ontological)*
      *   $\rightarrow$ Go to **Node 5**

  ---

  ### Node 2: The Status of Weight (Path A)
  **When Keynes discusses the "weight" of an argument, is he describing:**

  *   **A.** A distinct dimension of rational belief separate from probability? *(Independent)*
      *   $\rightarrow$ Go to **Node 3**
  *   **B.** A shorthand for our confidence in the premises of a probability judgment? *(Proxy)*
      *   $\rightarrow$ Go to **Node 4**

