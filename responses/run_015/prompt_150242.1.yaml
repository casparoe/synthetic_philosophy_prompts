  ### Node 3: Logical Relations (Path A-A)
  **Logical probability relations are best understood as:**

  *   **A.** Objective relations between propositions, similar to logical entailment.
      *   $\rightarrow$ **Leaf 1**
  *   **B.** Conventional tools for ordering beliefs without ontological status.
      *   $\rightarrow$ **Leaf 2**

