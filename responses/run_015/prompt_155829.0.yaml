  5.  **Drafting - Section by Section:**

      *   *Opening:* Establish the atmosphere. The hum of the servers. The view of Block 88. Elara's role.
      *   *The Case:* Describe the "Row." Red brick, soot stains, gardens. Describe the "Spire." Carbon-capture glass, vertical farms.
      *   *The Testimony:* Mr. Henderson speaks of memory, of the "ghosts" in the floorboards. Kael speaks of the drowning coastlines, the people sleeping in transit hubs.
      *   *The Algorithm:* The "Temporal Equity Index." Show the numbers fluctuating. The Past Weight (History) vs. The Future Weight (Need).
      *   *The Crisis:* Elara notices the algorithm is forcing a common denominator on distinct moral currencies. You can't trade memory for shelter using a single exchange rate.
      *   *The Ending:* She halts the vote. Not a solution, but an acknowledgment of the limit. Walking out into the rain (classic pathetic fallacy, but effective for mood).

  6.  **Refining the Philosophy:**
      *   Ensure "Continuity Rights" sounds plausible (Lockean mixing of labor over time?).
      *   Ensure "Right to the City" sounds Lefebvrian (use value over exchange value).
      *   The "Past" representation needs to be tricky—how do you represent the dead? Archival data, oral histories.
      *   The "Future" representation—demographic modeling, climate risk assessments.

  7.  **Writing the Narrative (incorporating sensory details):**
      *   *Visuals:* The holographic overlay of the building. The dust on the window sill.
      *   *Sounds:* The haptic click of the consoles. The rain against the glass.
      *   *Feelings:* The coldness of the room vs. the warmth of the testimony.

  8.  **Drafting the Author's Note:**
