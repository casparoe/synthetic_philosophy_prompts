  3.  **Setting the Scene:**
      *   **Location:** The "Sector 4" neighborhood. Needs to feel lived-in but precarious. Brick, mortar, wear and tear.
      *   **The Council Chamber:** Sterile, high-tech, contrasting with the organic neighborhood outside. Holographic displays, haptic interfaces.
      *   **The Proposal:** "The Spire of Tides" (high-rise) vs. "The Row" (historic housing).

  4.  **Plot Outline:**
      *   **Introduction:** Elara in the chamber. The sensory experience of the room. Introduction of the case (Block 88).
      *   **The Hearing:** Presentation of the two sides. Sensory details of the evidence (photos of cracks vs. renderings of glass).
      *   **The Algorithm:** The weights shift. Past vs. Future. The numbers don't converge.
      *   **The Realization:** Elara looks at the data and sees the flaw. The math assumes commensurability, but the values are incommensurable.
