      *   **Specific Case:** Demolish historic low-rise worker housing (elderly, long-tenured residents) for a high-rise cooperative (climate refugees, transient laborers).
      *   **Conflict:** "Continuity Rights" (existing social morphology) vs. "Right to the City" (excluded/need).
      *   **Protagonist:** A philosopher-engineer who designed the weighting system.
      *   **Climax/Resolution:** No simple vote. The protagonist realizes the algorithm cannot answer the *prior* question of the source of rights (occupancy, history, need, etc.).
      *   **Style:** Concrete detail (sensory, institutional), not just dialogue debate.
      *   **Post-Story:** Author's Note distinguishing theory from fiction, settled vs. contested concepts.

  2.  **Character Development:**
      *   **Protagonist:** Dr. Elara Vance. Needs to be analytical but increasingly unsettled. She built the "Chronos-Weighting Algorithm."
      *   **Antagonists/Foils:**
          *   *Current Residents:* Represented by Mr. Henderson (elderly, rooted).
          *   *Proponents:* Represented by Kael (advocate for refugees/transients).
