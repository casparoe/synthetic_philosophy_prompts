      *   Clarify liberties: We don't actually have algorithms for dead/future people.
      *   Distinguish settled vs. contested: Legal vs. Moral property is generally distinguished. *Who* holds the moral claim is highly contested.
      *   Avoid consensus: Make sure the note reflects the story's ambiguity.

  9.  **Review against Constraints:**
