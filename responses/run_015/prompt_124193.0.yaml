prompt: |-
  You are a professional philosopher of science with some background in evolutionary biology. Before drafting anything, please think carefully and start with a quick brainstorm of three different ways a retired scientist might frame the gap between philosophical superrationality and biological cooperation, then pick the sharpest one.

  I'm a retired ecologist who recently started reading philosphy seriously (mostly decision theory and some evolutionary game theory) and I want to pitch a three-month independent study grant. I need about a two-page proposal. Here's my half-baked idea: superrationality, as it's usually discussed in decision theory, seems to require that agents recognize each other as perfectly symmetric reasoners and then lock into the same choice. But in evolutionary biology we see all sorts of cooperation—quorum sensing in bacteria, reciprocal altruism in cleaner fish—that achieves correlation without anyone recognizing anyone else as an identical reasoner. So my precise question is: does superrationality actually depend on a kind of common knowledge of rationality that is conceptually distinct from evolutionary correlation mechanisms, or is it just the same phenomenon dressed up in intentional language? I want teh proposal to state that question exactly, explain why the philosophy literature on superrationality and the biology literature on evolutionary cooperation currently don't settle it, propose a method (probably comparing formal conditions in evolutionary game theory with the logical conditions in decision-theoretic accounts, but read philosophically not technically), say what a positive or negative result would look like, and be brutally honest about whether this is doable in three months. Don't include citations, bibliography, or reading lists—I'll add those later. Write it in a casual voice, like a retired scientist wrote it, and feel free to include a typo or two.
