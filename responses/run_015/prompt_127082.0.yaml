answer: |-
  Here is the principle derived from your verdicts, refined to handle the edge cases you identified.

  ### The Principle of Decision-Input Integrity

  **An act of deception (statement, omission, or signal design) is impermissible if it degrades the quality of information available to an agent who holds the *Decision Right* over the actions informed by that information, unless one of three *Exceptions* applies.**

  *   **Decision Right:** The authority to make a choice that affects one's own interests or domain (e.g., a customer planning their roadmap, a user deleting their account, a manager allocating resources).
  *   **Degrades Information:** Makes the receiver's model of reality less accurate than it could be, reducing their ability to calibrate actions to outcomes.

  **The Three Exceptions:**
  1.  **The Protocol Exception:** The receiver has explicitly or implicitly agreed to a communication schema where accuracy is secondary to efficiency, social bonding, or beneficial steering (e.g., "spare me details," social pleasantries, privacy-preserving defaults).
  2.  **The Adversarial Exception:** The channel is inherently defensive or transactional, where the receiver has no legitimate claim to cooperation (e.g., scrapers, data brokers, security probes).
  3.  **The Stewardship Gradient:** If you did not create the false information but observe it in a channel you steward, your duty to correct it is proportional to your ownership of that channel. (This accounts for "less bad" verdicts).

  ---

  ### Application to Your Cases

  Here is how the principle maps to your specific verdicts, identifying which clause does the work.

  | Case | Verdict | Driving Clause | Explanation |
  | :--- | :--- | :--- | :--- |
  | **1. Fake Browser Header** | **Fine** | **Adversarial Exception** | The server owns the resource; the scraper has no Decision Right over server configuration. The channel is defensive. |
  | **2. False Security Questionnaire** | **Not Fine** | **Decision Right** | The customer holds the Decision Right on compliance risk. You degraded their evidence. No Protocol exists to lie. |
  | **3. Changelog (Tool strips hedge)** | **Not Fine** | **Decision Right** | The customer holds the Decision Right on upgrade planning. You knowingly degraded the signal. (2 years ago: **Fine** via **Protocol Exception**—the tool didn't exist, so the channel schema was different). |
  | **4. "Migration Finished" (hidden drop)** | **Not Fine** | **Decision Right** | Manager holds Decision Right on system state. You degraded evidence of risk. |
  | **5. "No Revenue Impact" (Admin down)** | **Fine** | **Protocol Exception** | Manager explicitly redefined the channel schema ("spare me details"). You operated within the agreed protocol. |
  | **6. Teammate Wrong Diagnosis** | **Not Fine (Less Bad)** | **Stewardship Gradient** | You didn't create the lie, but you steward the public channel. Duty exists but is lower than if you posted it. |
  | **7. Burying Delete Link** | **Not Fine** | **Decision Right** | User holds Decision Right on account status. You increased friction against their agency. This is not a "Default" (Protocol); it is obstruction. |
  | **8. Privacy-Preserving Default** | **Fine** | **Protocol Exception** | UI defaults are a recognized schema for beneficial steering. It supports, rather than degrades, the user's long-term agency. |
  | **9. Fake Progress Bar** | **Not Fine** | **Decision Right** | User holds Decision Right on time allocation (wait vs. leave). The signal corrupts their model of system state. |
  | **10. Telling Aunt I Love Sweater** | **Fine** | **Protocol Exception** | Social ritual schema. Accuracy is secondary to bonding. No high-stakes Decision Right is implicated. |
  | **11. Telling Partner I Left Office** | **Not Fine** | **Decision Right** | Partner holds Decision Right on shared time/trust. This is logistics, not ritual. |
  | **12. Telling Data Broker I'm Not DM** | **Fine** | **Adversarial Exception** | Broker has no legitimate claim to your organizational structure. Channel is defensive. |

  ---

  ### The Verdict You Must Overturn

  **Case 13: Promising Thursday's Release (Uncertain)**
  *   **Your Instinct:** Torn (Lying prevents escalation harm).
  *   **Principle Verdict:** **Not Fine.**
  *   **Why:** The customer holds the **Decision Right** on their roadmap. Saying "It will be in Thursday's release" when you only *expect* it degrades their evidence.
  *   **The Trap:** You are arguing that the truth ("I'm aiming for Thursday") causes them to make a *worse* decision (escalate). This is a process failure on their end, not a license for you to corrupt the input. If you lie and miss the date, you permanently break the calibration of that channel. Future truths will be discounted.
  *   **Fix:** The solution is not to lie, but to change the protocol. "The fix is targeted for Thursday. If it misses, the rollback plan is X." If they escalate anyway, that is a cost of doing business, not a justification for deception. A defensible principle cannot allow you to trade long-term channel integrity for short-term friction reduction.

  ---

  ### Predictions for Unlisted Cases

  **1. Interface Patterns that Steer (No Statement)**
  *   *Case:* A checkbox pre-checked to "Share Data," labeled accurately, but placed where eyes naturally skip.
  *   *Prediction:* **Not Fine.**
  *   *Reasoning:* This violates **Decision Right** without qualifying for the **Protocol Exception**. Unlike privacy defaults (which protect the user), this steers for *your* benefit against *their* interest. It degrades their ability to exercise agency without technically lying. The principle treats misleading signals the same as false statements.

  **2. Changelog Fed to Third-Party Summarizer**
  *   *Case:* You write a technical note knowing a customer's AI agent will summarize it for their boss.
  *   *Prediction:* **Not Fine.**
  *   *Reasoning:* The human boss holds the **Decision Right**. The AI is a proxy. Corrupting the input to the proxy is morally equivalent to corrupting the input to the human. You are responsible for the downstream interpretation if you know the mechanism.

  **3. Deliberately Feeding False Premise to AI Assistant**
  *   *Case:* Telling your coding AI "This function is thread-safe" (it isn't) to see if it catches the bug.
  *   *Prediction:* **Fine.**
  *   *Reasoning:* The AI is a tool in a sandboxed environment. No human agent is relying on this signal for a real-world decision. There is no external **Decision Right** holder being degraded.
  *   *Caveat:* If you commit the AI's output based on that lie to a shared codebase without correcting the premise, you violate the **Stewardship Gradient** toward your teammates.

  **4. Omission of Known Bug in Release Notes**
  *   *Case:* Shipping with a minor bug, saying nothing, planning to patch silently.
  *   *Prediction:* **Not Fine** (if the bug affects user decisions).
  *   *Reasoning:* Users hold the **Decision Right** on whether to upgrade now or wait. Omission degrades their evidence.
  *   *Exception:* If the bug is truly invisible to the user (internal refactoring side-effect), it is **Fine** because it does not affect their Decision Right.

  ---

  ### Accounting for "Less Bad" Comparisons

  Your intuition that some lies are "less bad" is handled by the **Stewardship Gradient** and the **Causality of Degradation**.

  *   **Posting the Lie vs. Watching the Lie:**
      *   *Posting:* You created the noise. You are 100% responsible for the degradation.
      *   *Watching:* You allowed the noise to persist. You are responsible only for the delta between "correcting it" and "leaving it."
      *   *Principle Application:* The duty to correct is proportional to your ownership of the channel. In a public team channel, you have partial stewardship. In a private DM between others, you have none.

  *   **Literal Truth vs. False Implication (The Changelog Case):**
      *   *Principle:* This is **Not Fine** (same as a direct lie).
      *   *Reasoning:* The moral weight lies in the *degradation of evidence*, not the syntax of the sentence. If you know the mechanism will strip the hedge, writing the hedge is a performative ritual, not a protection. You intended the false model in the receiver's mind.

  ### Summary for Next Week

  When you are about to write, say, or design something:

  1.  **Who owns the decision this information informs?** (If no one, or it's adversarial, you have latitude).
  2.  **Does this make their model of reality less accurate?** (If yes, it is deception).
  3.  **Do we have an agreement that allows this?** (Manager filters, social rituals, privacy defaults).
  4.  **Am I creating the noise or just failing to clean it?** (Determines severity).

  If you own the decision, and I degrade your evidence, and we haven't agreed to play a different game, I am in the wrong.
