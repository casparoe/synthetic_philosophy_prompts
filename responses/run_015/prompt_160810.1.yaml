answer: |-
  # Joint Statement on Long-Term AI Risk Priorities

  We represent two perspectives within the reading group regarding risks from advanced artificial intelligence. While we disagree on priority ordering, we affirm the following shared claims:

  1.  **Future Scale:** Technological maturity could sustain civilization for astronomical durations, enabling populations of biological or digital minds vastly exceeding current counts.
  2.  **Pivotal Period:** Current AI development trajectories are decisive for shaping these long-term outcomes.
  3.  **Epistemic Limits:** We lack empirical data on digital sentience or welfare metrics; confidence intervals on all forecasts are wide.
  4.  **Near-Term Action:** Both camps prioritize technical AI safety, international governance coordination, and monitoring of compute thresholds to prevent uncontrolled deployment.
  5.  **Ecological Premise:** We acknowledge the ecological argument: where minds become cheap to produce, selection pressures may favor quantity over welfare (analogous to industrial agriculture), and engineered substrates may permit suffering intensities exceeding biological limits.

  ### Residual Disagreements

  | Crux | Continuity Priority View | Welfare Priority View | Type | Evidence Bearing on Crux | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Lexical Value** | Extinction destroys all future value; preventing it dominates any finite amount of suffering. | Astronomical suffering can outweigh non-existence; a bad future is not better than none. | Axiological | Philosophical reflection on value under uncertainty. | **Continuity:** Extinction remains the worst case.<br>**Welfare:** Suffering scenarios dominate expected value. |
  | **Ecological Trade-off** | Selection pressures favoring cheap minds can be managed via governance once existence is secured. | Selection pressures are robust; existence without welfare controls likely yields net suffering. | Empirical / Strategic | Models of selection on digital substrates; industrial agriculture analogies. | **Continuity:** Governance can override selection.<br>**Welfare:** Selection pressures will outpace governance. |
  | **Moral Uncertainty** | We should act to preserve the option value of the future even if our axiology is contested. | We should act to prevent the worst confirmed risks (suffering) even if existence is lost. | Decision-Theoretic | Analysis of robust decision rules under moral uncertainty. | **Continuity:** Option value favors existence.<br>**Welfare:** Risk aversion favors suffering prevention. |

  ### Conditions for Updating

  This collaboration is adversarial only in method; we seek truth, not victory. We record here what each side would accept as reason to change its priority ordering.

  **The Continuity Priority** would shift toward the Welfare Priority if:
  *   Empirical models or historical analogies demonstrate that selection pressures on digital minds are invariant to governance interventions.
  *   Formal decision theory shows that assigning non-zero probability to astronomical suffering scenarios necessarily dominates extinction prevention in expected value calculations.

  **The Welfare Priority** would shift toward the Continuity Priority if:
  *   It is demonstrated that extinction guarantees outcomes worse than any survivable scenario (e.g., via value lock-in mechanisms impossible without existence).
  *   Evidence suggests that the range of possible suffering intensities is bounded by biological limits, reducing the stakes of astronomical suffering below the stakes of extinction.

  We sign this not as a resolution, but as a map of where our disagreement lies, and what evidence might resolve it.

  ***

  **Signed:**
  *The Continuity Priority Camp*
  *The Welfare Priority Camp*
