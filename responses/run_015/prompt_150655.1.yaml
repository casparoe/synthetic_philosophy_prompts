      *Tone Check:* American English (e.g., "realize" vs "realise", "program" vs "programme", idioms). Keep it academic but accessible.

      *Specific focus:* The user mentioned the member who quit and returned. This highlights the fragility of Camp 1 (Expected Utility). If the empirics look shaky, the duty vanishes. This proves the Normative commitment was never there.

