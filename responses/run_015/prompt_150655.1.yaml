answer: |-
  Your hypothesis is correct, but it requires a slight adjustment regarding which layer is doing the heavy lifting. You are right that there are three distinct layers of argument here: empirical (how the world works), metaphysical/conceptual (what counts as causation or agency), and normative (what generates moral reasons). However, the stalemate persists not because the empirical argument absorbs the airtime, but because the **normative layer is load-bearing while the metaphysical layer acts as the gatekeeper.**

  The group cannot convert the skeptic (or the member who reverted to eating meat) because Camp 1 is trying to win a normative argument using empirical weapons, while Camps 3 and 4 are trying to change the game entirely without successfully explaining why the skeptic's game is illegitimate.

  Here is the diagnosis of the stalemate, the fair statements of the positions, and an assessment of where progress is actually possible.

  ### 1. Fair Statements of the Positions
  To break the loop, each camp must be able to state the others' views without caricature. Based on your description, here is what a fair statement of each view looks like. If your group members cannot endorse these formulations, they are talking past one another.

  *   **The Inefficacy Skeptic:** "Moral obligation regarding harm is grounded in the ability to prevent that harm. If my action does not counterfactually alter the outcome (the amount of CO2, the number of chickens slaughtered, the election result), then I have not harmed anyone. Without harm, there is no duty to abstain. Empirical uncertainty does not create duty; it merely obscures the fact of inefficacy."
  *   **Camp 1 (Expected Difference):** "The world is not smooth; it is lumpy. Supply chains and voting thresholds operate on margins. While my single act is unlikely to trigger a change, there is a non-zero probability that it will trigger a significant block of harm. When multiplied by the magnitude of that harm, the expected disvalue of my act is positive and significant. Therefore, I have a consequentialist duty to abstain."
  *   **Camp 2 (Zero Difference, Non-Zero Duty):** "I grant the empirical premise: in many cases (saturated markets, landslides), my act makes zero counterfactual difference. However, I reject the inference that zero difference implies zero duty. Moral reasons can attach to the *risk* of harm, the *intent* to participate in harm, or the *integrity* of the agent, independent of the actual outcome."
  *   **Camp 3 (Complicity/Membership):** "The unit of moral analysis is not the isolated individual act but the collective practice. By participating in a harmful practice, I become a constituent of the harming entity. My moral taint comes from my membership in the group causing the harm, not from my marginal causal contribution. I am responsible for *our* action, not just *my* difference."
  *   **Camp 4 (Expressive/Fairness):** "The question 'Did I make a difference?' is the wrong question. The right questions are: 'Am I taking unfair advantage of those who restrain themselves?' (Fairness) or 'Does this action express a maxim I can endorse?' (Universalizability). Abstaining is required to maintain moral integrity or social reciprocity, regardless of causal efficacy."

  ### 2. Diagnosing the Load-Bearing Layer
  You asked whether the normative argument is doing the work while the empirical one absorbs the airtime. **This is accurate.**

  The reason Camp 1 fails to sustain commitment (as seen with the member who returned to eating meat) is that it accepts the Skeptic's normative premise: *Duty requires Expected Difference-Making.* Camp 1 merely argues about the empirical inputs. If the Skeptic can show the probability is lower than claimed, or if the "replacement worry" (someone else buys the chicken) is introduced, Camp 1's expected value drops. If the duty rests entirely on that calculation, the duty vanishes.

  Camp 2, 3, and 4 realize this, which is why they attempt to shift to metaphysical or normative grounds. However, they often fail to explicitly challenge the Skeptic's foundational normative commitment. They treat their views as *additions* to the causal story rather than *alternatives* to the Skeptic's moral framework.

  **The Metaphysical Gatekeeper:**
  While the normative layer is the engine, the metaphysical layer is the lock. The stalemate rests on a contested definition of "causation."
  *   The Skeptic and Camp 1 rely on **Counterfactual Dependence** (If I hadn't done X, would Y have happened?).
  *   Camp 3 relies on **Constitutive Contribution** (Is my act a part of the process that produced Y?).

  As long as the group assumes "causation" must mean "counterfactual dependence," Camp 3 and 4 sound like mysticism. They are trying to assert a normative duty without a causal mechanism that the Skeptic recognizes. The dispute is partly verbal: "Causing harm" (Skeptic) vs. "Contributing to harm" (Camp 3). Until the group agrees that "contributing" is a morally salient category even without "causing" in the counterfactual sense, the empirical debate will continue to dominate because it is the only shared language.

  ### 3. Unargued Intuitions and Clean Hands
  You asked whether part of the dispute rests on intuitions about clean hands or fairness that neither side can argue for. **Yes.**

  *   **The Skeptic's Intuition:** *The Intuition of Efficacy.* "I am not responsible for what I cannot control." This is a deep-seated control principle. If I cannot stop the machine, why should I be blamed for greasing a gear?
  *   **Camp 3 & 4's Intuition:** *The Intuition of Clean Hands.* "I do not want my hands dirty, even if the dirt doesn't make the pile bigger." This is an agent-relative concern. It prioritizes the moral status of the actor over the state of the world.

  The frustration in your group arises because these intuitions are incommensurable. The Skeptic views the "Clean Hands" intuition as moral narcissism (caring more about your own purity than the chickens). Camp 3 views the "Efficacy" intuition as moral free-riding (waiting for others to solve the problem while you enjoy the benefits). Neither side can "prove" their intuition because they are foundational axioms, not derived conclusions.

  ### 4. What Counts as Progress?
  Given this diagnosis, you should not expect an empirical measurement or a formal result to solve the problem. Measuring the lumpiness of chicken supply chains (Empirical) will not convince the Skeptic if they believe replacement nullifies the signal. Proving a formal paradox of voting (Formal) will not convince Camp 2 that they are wrong to feel a duty despite zero odds.

  **Progress requires a Change of Question and a Conceptual Distinction.**

  **A. The Distinction: Outcome Responsibility vs. Participatory Responsibility**
  Progress would look like the group explicitly distinguishing these two concepts.
  *   *Outcome Responsibility:* Am I liable for the state of the world? (Requires counterfactual difference).
  *   *Participatory Responsibility:* Am I liable for my role in the practice? (Requires only contribution).
  If the Skeptic admits that *Participatory Responsibility* is a coherent concept (even if they deny it generates a duty), the conversation moves from "Did I change the outcome?" to "Is participation enough for blame?" This forces the normative debate into the open where it belongs.

  **B. The Change of Question**
  Stop asking: *"Does my act make a difference?"*
  Start asking: *"What kind of moral framework are we using to evaluate collective harm?"*
  The group needs to acknowledge that the Inefficacy Objection is not a factual discovery but a **normative filter**. It is a tool that consequentialists use to discard duties that deontologists or virtue ethicists would keep. The member who quit meat and returned didn't learn a new fact about chicken supply chains; she likely realized her commitment to consequentialism was stronger than her commitment to animal welfare.

  **C. Honest Assessment of Conversion**
  If your goal is to convert the Skeptic (or the member who reverted), **no progress should be expected** unless they are willing to abandon Individual Difference-Making Consequentialism. You cannot argue someone out of a foundational normative axiom using empirical premises.
  *   If they believe *only* outcomes matter, and *only* counterfactuals change outcomes, they are logically consistent in eating the chicken.
  *   To move them, you must challenge the axiom: "Why must morality be solely about optimizing outcomes?" or "Why must causation be solely counterfactual?"

  **Recommendation for the Reading Group:**
  Declare a moratorium on empirical claims about supply chains or voting margins. Acknowledge that Camp 1 (Expected Utility) is the weakest link because it concedes too much to the Skeptic. Force the debate onto the normative terrain:
  1.  Ask the Skeptic: "If we could prove beyond doubt that your vote or purchase made zero difference, would you *then* agree there is no duty? Or is there some residual reason?"
  2.  Ask Camp 3/4: "If I am participatorily responsible but make no difference, what is the *function* of my duty? Is it to keep my soul clean, or to signal to others, or something else?"

  The stalemate will break only when you admit that the "Inefficacy Objection" is not a puzzle to be solved within consequentialism, but a reason to reject consequentialism (or at least its individualistic version) as the sole arbiter of collective harm.
