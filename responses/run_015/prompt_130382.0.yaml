  To the Council of State,

  You invite me from the dead to view your firestorms, and you speak of eighty years of peace as if it were a monument to your wisdom. It is not. It is a monument to *Fortuna*. You describe officers who refused orders, circuits that failed safely, errors unnoticed until decades later. You call this system stability. I call it luck. To rely on luck is the surest way to lose a state. When the sky is calm, you neglect the dikes; when the flood comes, you pray. You have been praying for eight decades, mistaking the silence of the grave for the quiet of wisdom.

  Now you propose to tighten the noose. You build machines to compress decision to three minutes. You say a machine does not hesitate, and therefore it is strong. This is a confusion of *virtù* with rigidity. *Virtù* is the capacity to bend necessity to your will, to read the *occasione* and adapt. A machine cannot adapt. It knows only what it has been fed. By removing human hesitation, you do not remove fear; you remove the only brake you have against catastrophe.

  You ask if this is boldness. It is not. It is surrender. I wrote that Fortune is like a violent river; while the weather is calm, you must build embankments. You are doing the opposite. You are clearing the channel so the water flows faster when it breaks. To hand the keys to a classifier is to invite *Fortuna* into the command room. A machine cannot feel the weight of ruin. It has no stomach to turn away from the abyss. It does not know that sometimes the prudent man does nothing.

  I have always favored the impetuous over the cautious, for Fortune is a woman who yields to the bold. But boldness requires a hand to strike, not a clock to count. To act without judgment is not boldness; it is madness. You moderns are soft. You seek security where none exists. You believe because the fire has not burned you, it is cold. You think because nine states hold the torch, none will drop it. This is the logic of gamblers, not princes. A prince must assume all men are wicked and will use the knife when they find the opportunity. Your machines assume perfect data. They will find only chaos.

  What should you do? Keep the human hand in the chain. Let them hesitate. Hesitation buys time, and time is the only ally you have against chance. If you must have these weapons, do not let them decide their own use. Better a cowardly prince who lives than a bold machine that kills everyone. Spread the weapons out, make them harder to use, introduce friction. Friction is safety.

  Yet, I must confess a limit. In my time, war was a tool to secure power. Defeat meant losing a city, paying tribute, fleeing. Here, you speak of weapons that leave no one to rule. My logic concerns the acquisition and maintenance of power. I cannot advise on how to win a game where the board is burned along with the pieces. This is not politics; it is suicide. There is no *virtù* in mutual annihilation, only waste.

  But if you insist on keeping the swords, do not let the clock wield them. Three minutes is not enough for counsel. It is enough only for doom. Build your dikes while the sun shines. Do not wait for the rain. And stop telling yourselves you are safe. You are merely untested.

  Niccolò Machiavelli
