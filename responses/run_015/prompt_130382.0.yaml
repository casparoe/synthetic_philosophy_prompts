      *   *The Machine:* Now you propose to remove the doubt. You call this efficiency. I call it surrender. *Virtù* is the ability to adapt to the times, not to rigidify them. A machine cannot adapt. It knows only what it was taught.
      *   *The Flood:* I wrote that Fortune is a raging river. You build embankments in calm weather. You are tearing them down to let the water rush faster. Compressing the decision to three minutes is not boldness; it is blindness.
      *   *Recommendation:* Keep the human hand. Let them hesitate. Hesitation is the only dike you have left.
      *   *Caveat:* In my time, war served power. Here, war ends the player. I cannot advise on how to win a game where the board is burned. But do not let a clock decide your extinction.

