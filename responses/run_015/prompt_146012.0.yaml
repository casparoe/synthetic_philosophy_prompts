answer: |-
  Luck egalitarianism necessarily collapses under the recursive correction problem because any institutional compensation for brute luck inevitably transforms into a new form of unchosen advantage that contaminates all subsequent assessments of individual responsibility. The theory relies on a stable metaphysical distinction between circumstance (unchosen) and choice (chosen), but institutional corrections violate this stability by inserting unchosen resources into the agent's future decision-making environment. When the state compensates for a disadvantage, that compensation is not chosen by the recipient; it is bestowed upon them by brute institutional luck. Consequently, any success generated using those compensated resources cannot be purely attributed to choice, yet luck egalitarianism requires treating it as such to avoid endless redistribution.

  Consider a concrete institutional framework involving educational subsidies designed to level the playing field between students from wealthy and impoverished backgrounds. Under luck egalitarianism, the state identifies Student A (impoverished) as suffering from circumstance-based disadvantage and provides a substantial tuition subsidy, while Student B (wealthy) receives no such aid. Both students subsequently enter the labor market; Student A, leveraging the subsidy, chooses to pursue a demanding degree and secures a high income, while Student B chooses leisure and earns less. The recursive problem arises when evaluating Student A's higher income: is it the result of choice or circumstance? If we classify it as choice, we ignore the causal potency of the subsidy, which was an unchosen circumstance for Student A. If we classify it as circumstance, we must tax away the income to neutralize the advantage conferred by the subsidy, which effectively punishes Student A for making the industrious choice the theory claims to reward.

  This dilemma generates an infinite regress that prevents the theory from reaching a stable distributional equilibrium. If the state refrains from further correction, it permits inequalities derived from the initial compensatory circumstance, violating the core egalitarian mandate. If the state attempts to correct for the advantages gained *through* the correction, it must treat the subsidy-induced skills as new circumstances, requiring further compensation for Student B who now lacks those skills. This second-round compensation then becomes a new circumstance for a third round of choices, ad infinitum. The theory cannot non-circularly distinguish the categories after the first round because the mechanism used to neutralize circumstance (the subsidy) becomes the primary determinant of the new opportunity set, making every subsequent "choice" contingent on a prior "circumstance" correction.

  Because luck egalitarianism cannot stabilize distribution without either punishing responsibility or ignoring unchosen advantage, it must be abandoned in favor of Democratic Equality. This alternative principle shifts the normative focus from tracking the etiology of holdings to ensuring that all citizens stand in relations of equality without oppression or domination. Under Democratic Equality, the educational subsidy is justified not because it neutralizes brute luck, but because it ensures Student A has the social standing and capabilities to function as a peer to Student B. Once that threshold of social functioning is met, subsequent inequalities resulting from different career choices are permissible, not because they are purely "chosen," but because they do not threaten the fundamental relational equality of the citizens. This avoids the recursive trap by establishing a sufficiency threshold for status rather than attempting the impossible task of isolating choice from circumstance over time.
