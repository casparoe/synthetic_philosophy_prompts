answer: |-
  1. **The Equilibrium Maintenance Claim:** You should conform because your compliance contributes to stabilizing the local convention, and your defection risks eroding it.
     **Label:** False-or-incoherent (for visitors).
     **Implications:** Fails the **Two-Week Problem**: a single visitor's action cannot sustain or destabilize a macro-convention. Implies no reason for a visitor to comply in either case unless they plan to stay indefinitely. Works for **Pure Coordination** only if critical mass is threatened. **Invisible Tourist:** No reason (no impact). **Bad Rome:** No reason (why sustain a bad equilibrium?). Your friend cannot be using this reading; it provides no leverage in your cases.

  2. **The Frictionless Interaction Claim:** You should conform to minimize social transaction costs, awkwardness, or confusion during immediate interpersonal encounters.
     **Label:** Substantive-and-defensible.
     **Implications:** Solves the **Two-Week Problem**: reason is immediate interaction, not long-term stability. Implies tip 20% (avoids scene) and jaywalk (avoids blocking flow). Works best for **Pure Coordination** and **Deference**; weak on **Transfer** unless awkwardness is costly. **Invisible Tourist:** No reason (no interaction). **Bad Rome:** No reason (if the norm creates friction elsewhere, e.g., moral disgust). This reading makes the slogan pragmatic, not normative.

  3. **The Expectation/Reliance Claim:** You should conform because specific locals have formed predictive expectations of your behavior based on your presence in their context, and you owe it to them not to disappoint those reliance interests.
     **Label:** Substantive-and-defensible.
     **Implications:** Solves the **Two-Week Problem**: obligation is to specific individuals, not the system. Implies tip 20% (waiter relies on it) and jaywalk (drivers rely on predictable flow). Works for **Transfer** (wages) and **Coordination**. **Invisible Tourist:** No reason (no one relies on you). **Bad Rome:** Weak reason (you can't rely on me to do harm), but risks complicity. This matches the "what they expect of you" distinction you noted.

  4. **The Fairness/Reciprocity Claim:** You should conform because you benefit from the local social/economic infrastructure that the norm sustains, and compliance is your fair share of the cost.
     **Label:** Substantive-and-defensible.
     **Implications:** Solves the **Two-Week Problem**: benefit is immediate, so cost is due now. Implies tip 20% (paying for wage structure you used) but *not* jaywalk (waiting doesn't pay a cost, though using the road does). Strong on **Transfer Conventions**; weak on **Pure Coordination**. **Invisible Tourist:** No reason (no benefit gained). **Bad Rome:** Collapses into complicity (you still benefit from the cheap meal). This justifies the tipping case well, not the jaywalking case.

  5. **The Substantive Reason Claim:** You should do what the Romans do *only if* you endorse the underlying justification for their norm (e.g., workers need wages vs. traffic flows better).
     **Label:** Substantive-and-defensible (but ceases to be "When in Rome").
     **Implications:** Solves the **Two-Week Problem**: reason is moral truth, not location. Implies tip 20% (if wage structure is just) but *not* jaywalk (if safety is compromised). Works across all buckets but depends on moral evaluation. **Invisible Tourist:** Yes (moral reasons persist). **Bad Rome:** No (moral reasons forbid it). This matches the "reasons they do it" distinction; it makes the slogan redundant because you'd follow the reason anywhere.

  6. **The Normative Sovereignty Claim:** You should conform because local norms constitute a form of temporary jurisdiction; entering the space implies consent to be governed by their normative authority regardless of content.
     **Label:** False-or-incoherent (normatively).
     **Implications:** Solves the **Two-Week Problem**: authority is spatial, not temporal. Implies tip 20% and jaywalk unconditionally. Works only for **Deference Conventions**. **Invisible Tourist:** Yes (authority persists). **Bad Rome:** Yes (collapses into hard relativism). This is the only reading that demands compliance in the "Bad Rome" stress test, but it lacks philosophical grounding for mere visitors.

  Your friend's use of the slogan is only more than a conversation-ender if he is sliding between **Reading 3 (Expectation)** and **Reading 4 (Fairness)**. In the tipping case, he relies on Fairness/Expectation (you benefit from the service/wage structure, the waiter expects it). In the jaywalking case, he relies on Friction/Expectation (don't block traffic, drivers expect you to move). Neither reading requires you to sustain the convention (solving your Two-Week Problem), but both require you to navigate the immediate social environment successfully. The slogan works only because it ambiguously covers both "don't disappoint specific locals" and "pay your fair share," allowing him to switch principles depending on which norm is in question.

  The most commonly meant reading is **Reading 6 (Normative Sovereignty)**, which is also the weakest. It is the default folk interpretation—that location itself generates obligation—but it collapses into relativism under the **Bad Rome** stress test and fails to explain why the obligation vanishes for the **Invisible Tourist**. It is a conversation-ender because it asserts authority without justification. The strongest reading is **Reading 3 (Expectation/Reliance)**, as it grounds the obligation in concrete interpersonal duties rather than abstract spatial authority, but it requires admitting that "When in Rome" is actually shorthand for "Don't screw over the people you interact with," which is less catchy but philosophically robust.
