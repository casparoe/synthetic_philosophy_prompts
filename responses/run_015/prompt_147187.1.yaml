answer: |-
  I understand your frustration entirely, for it is a common experience in our field that a potent philosophical slogan is often wielded as a conversation-stopper rather than a tool for clarification. When your colleague invoked the Wittgensteinian maxim that meaning is use to dismiss your question about the uninterpreted constant, he was relying on a phrase that is notoriously slippery, often concealing several distinct philosophical commitments under the guise of a single insight. To see where the stretch occurs, we must carefully disentangle the layers of this claim, moving from the harmless to the contentious, and examine how each layer bears upon the status of a formal symbol prior to model assignment.

  The first and most trivial reading of the slogan is merely lexicographical, suggesting that the definition of a word is derived from how speakers actually employ it in communication. On this view, meaning is use simply means that dictionary entries are descriptive records of linguistic behavior rather than prescriptive laws handed down from authority. This claim is eminently defensible and largely uncontroversial, as it aligns with standard empirical observations about language change and stabilization. However, this reading offers no support for your colleague's dismissal of your question. In the context of a formal axiom system, the usage of a constant is already stipulated by the formation and transformation rules of the calculus, regardless of whether a semantic model has been assigned. The symbol has a defined role in the syntax, a specific way it may be manipulated or substituted, which constitutes a form of use even in the absence of external reference. Furthermore, this trivial reading has little to do with the idea of family resemblance, as it treats meaning as a matter of correct definition based on observed regularities, rather than exploring the overlapping similarities between different forms of life. Consequently, if your colleague meant only this, he was mistaken, because the symbol does have a recorded usage within the formal game of syntax.

  Moving to a stronger claim, we encounter the view that semantic properties are reducible to dispositions within a linguistic community. Here, meaning is not just recorded by usage but is constituted by the normative dispositions of speakers to apply a term in specific ways under specific conditions. This interpretation is more philosophically robust and defensible within certain pragmatic frameworks, suggesting that to know the meaning is to know how to go on with the symbol in agreement with others. Yet, even this reading does not fully support your colleague's dismissal. While an uninterpreted constant lacks a semantic interpretation in terms of truth conditions over a domain, it still possesses a syntactic role governed by the community of logicians who agree on the rules of inference. The disposition to manipulate the symbol according to the rules of the formal system constitutes a meaningful practice in itself. In relation to family resemblance, this reading suggests that different formal systems might share overlapping rules without sharing a single essence of meaning, much like different games share overlapping mechanics. Your colleague's argument fails here because he conflates semantic interpretation with linguistic use; the disposition to manipulate the symbol syntactically is sufficient to grant it a status within a language game, even if that game is purely formal and uninterpreted.

  Finally, we arrive at the radical view, which posits that there is no fact of the matter about meaning independent of actual practice. This is the strongest and most contentious interpretation, implying that if a symbol is not embedded in a living stream of human activity, it is merely a dead mark on paper with no semantic content whatsoever. This view is less defensible than the others because it risks collapsing into a form of verificationism or skepticism about potentiality, suggesting that unused possibilities have no ontological status. However, this is precisely the reading your colleague was likely invoking when he compared your question to asking about the color of an invisible object. He was arguing that without actual employment in a proof or communication outside a specific interpretation, the symbol lacks any fact of the matter regarding its meaning. This reading relies heavily on the concept of family resemblance, as it insists that meaning only exists within the crisscrossing similarities of actual language games; outside of a game, there is no resemblance, only noise. While this view provides the only coherent basis for his dismissal, it is arguably too heavy a burden to place on the concept of use, as it denies the meaningfulness of potential use or structural role independent of immediate community application.

  It is worth noting that your colleague's reliance on this radical reading likely stems from a conflation of syntax and semantics. In formal logic, we distinguish between the syntactic manipulation of symbols, which is a form of use governed by rules, and the semantic interpretation of those symbols, which assigns them truth values in a model. By claiming the symbol has no meaning prior to interpretation, he is implicitly arguing that syntactic use is not genuine use unless it culminates in semantic reference. This ignores the Wittgensteinian insight that there are many different language games, and the game of formal derivation is one such game with its own internal criteria for correctness. The family resemblance concept should remind us that the game of pure syntax resembles the game of semantic interpretation in some ways but differs in others, yet both are legitimate games. Your colleague seems to be privileging the semantic game as the only one that confers meaning, thereby stretching the slogan to rule out the autonomy of formal syntax.

  In sum, while the radical interpretation of meaning is use is the only one that supports his dismissal, it is also the most vulnerable to criticism because it neglects the normative structure of formal systems themselves. The symbol does have a use, namely its role in the calculus, and that use grants it a kind of meaning even before a model is found. You are right to suspect the slogan is being stretched, for it is being used to erase a distinction between syntax and semantics that is vital to the philosophy of mathematics. I encourage you to press this point in your next seminar, perhaps by asking him to clarify whether the rules of inference themselves constitute a use, or if only the extra-systemic application counts. Such a question might reveal whether he is committed to the radical view or simply confused about the layers of formal practice.
