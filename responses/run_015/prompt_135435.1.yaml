  1. The theory must restrict validity claims to a specified class of environments, for NFL theorems render universal efficacy mathematically impossible. This is non-negotiable and conflicts with any programme asserting context-independent rationality.

  2. It must distinguish validating a bias for a class from providing independent grounds for believing the actual world falls within it, as conflating them dissolves the placement problem rather than solving it. This is non-negotiable, though it flags tension with Item 4 if the grounds for placement are themselves inductive.

  3. The specification must define the promised grade of success and clarify whether the environment is assumed adversarial or indifferent, since dominance over a class fails against an adversary inspecting the bias. This is non-negotiable and incompatible with theories treating all environments as stochastic.

  4. The theory must state whether it permits using inductive success to justify the rule itself or demands a non-inductive meta-justification for switching biases. This is merely a preference of one camp, yet it conflicts with Item 2 if the placement relies on the very bias being justified.

  5.* The theory must address how simplicity biases behave under arbitrary re-encodings of the data to ensure the bias is not merely an artefact of representation. This is non-negotiable and does most of the work in excluding candidates, as it conflicts with any account lacking a canonical representation.
