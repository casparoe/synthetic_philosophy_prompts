  **Prep Sheet: Cranes with Borrowed Footings**

  **Concessions (Slides 1–2)**
  1.  **Dennett is Right:** Skyhooks are forbidden; cranes are the explanatory ideal.
  2.  **Scaffolding is Permissible:** Not all borrowing is fatal; heuristic scaffolding is allowed if acknowledged as temporary debt.

  **The Single Reply That Must Land**
  You must distinguish *greedy reductionism* (skipping levels) from *borrowed footings* (smuggling the top level into the bottom). If the audience conflates these, your talk becomes a plea for eliminationism rather than explanatory integrity. You are demanding *more* rungs, not fewer.

  **The Objection You Hope Nobody Raises**
  *The Regress of Vocabulary:* If every level must be described in the vocabulary of the level beneath, where does it stop? If physics is the bedrock, all biology fails the test. If "adjacent biological level" suffices, the test is trivial. You need a principled account of "bedrock" vocabularies, or the test collapses into "explain everything eventually," which is trivially true but practically useless.

  **Q&A Prep (Ordered by Damage)**

  1.  **Philosopher of Biology:** "'Genes carrying information' is successful science. Why fix what isn't broken?"
      *Reply:* Pragmatic success isn't ontological clarity. It works heuristically but obscures causal mechanisms regarding replication and retention. We risk mistaking the shorthand for the mechanism.
      *Soft:* Risks sounding like an eliminationist denying useful tools to working scientists.
  2.  **Enactivist:** "Representation *is* the skyhook. You're polishing the deck chairs on the Titanic."
      *Reply:* I agree representation often borrows, but some cognitive structures require structural analogy, not just sensorimotor coupling. I'm diagnosing the explanation, not prescribing elimination.
      *Soft:* May concede too much ground to enactivism, weakening the crane metaphor.
  3.  **New Mechanist:** "Mechanisms are ontic (entities/activities). Your test is semantic (vocabulary)."
      *Reply:* Explanations are linguistic; mechanisms are worldly. I'm testing the explanation's integrity. Constitutive relevance requires clear level boundaries to avoid confusion.
      *Soft:* Blurs the ontic/epistemic distinction they hold dear.
  4.  **Dennett Fan 1:** "Isn't this just greedy reductionism demanding we skip to physics?"
      *Reply:* Greedy skips levels. Borrowing fakes them. I demand *more* rungs, not fewer. A crane with borrowed footings looks complete but collapses under load.
      *Soft:* Hard to distinguish in practice without halting inquiry.
  5.  **Graduate Student:** "How do I use this without halting my research?"
      *Reply:* Use it as a diagnostic for future work, not a veto on current papers. Identify where the cashing-out must happen. It tells you where your next paper should go.
      *Soft:* Makes the test seem toothless if it never vetoes anything.
  6.  **Dennett Fan 2:** "Interpretation is unavoidable (heterophenomenology)."
      *Reply:* Unavoidable utility isn't ontological grounding. Heterophenomenology is a method, not an ontology. Don't confuse the map for the territory.
      *Soft:* Risks alienating deflationists who think grounding is a fool's errand.

  **On Your Uncertainty**
  You condemn too much if you treat temporary scaffolding as permanent bankruptcy. You condemn too little if you allow refinancing without interest. The test detects *arrears*, not bankruptcy, but persistent arrears are fatal. Advise students: A borrowed footing is a loan, not a gift. If the debt isn't serviced (cash out the terms) eventually, the structure collapses. Distinguish a *placeholder* (explicitly marked debt) from a *theoretical posit* (claimed cash). Your test flags posits that are actually placeholders. If working biology fails, it's because they are often running on arrears; your job is to show why paying the debt matters for robustness, not to shut down the shop.
