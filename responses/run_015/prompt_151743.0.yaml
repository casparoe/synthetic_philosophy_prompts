      *   *The Bottom:* Eventually, you hit $A_n$ who cannot prove anything about a successor, or trusts without proof.
      *   *The Friend's View:* Why wait for proof? Just use expected value. (The poem should hint at this tension between certainty and action).
      *   *The User's View:* The structural limit remains.
