          *   *Issue A:* Per capita vs. Absolute. If population doubles and rate halves, absolute deaths stay the same. Is that progress? Utilitarians say no (same suffering). Risk-based ethics say yes (lower individual risk).
          *   *Issue B:* Structural/Institutional Violence. The thesis focuses on *physical* violence (homicide, war). It often neglects structural violence (poverty, oppression, incarceration, domestic violence data reliability).
