  2.  **Deconstruct the Friend's Summary (Claim by Claim):**
      *   *Claim 1:* Premodern societies had far higher rates of homicide and death in warfare.
      *   *Claim 2:* Rise of centralized states, commerce, and wider circles of sympathy produced a sustained decline.
