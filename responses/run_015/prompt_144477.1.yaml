  **MINISTRY OF NON-AGGREGATIVE RESCUE**
  **OPERATIONAL DIRECTIVE 74-B: THE TAUREK COMPLIANCE FRAMEWORK**

  **1. Scope and Definitions**
  1.1 This Directive governs all Field Rescue Units (FRUs) operating within jurisdictions where moral hazard involves competing claims to finite rescue resources.
  1.2 'Aggregative Reasoning' is strictly defined as any cognitive process wherein the sum of individual losses is treated as a composite moral weight exceeding the loss of a singular individual.
  1.3 Personnel are reminded that loss is inherently personal. Person A does not suffer Person B's death. Therefore, the death of five persons constitutes five distinct losses, not one 'greater' loss. To conflate them is a category error.

  **2. The Pairwise Assessment Protocol**
  2.1 Upon encountering trapped parties, FRUs must segregate individuals into dyadic comparison sets. Aggregation of groups into 'sides' is prohibited.
  2.2 Evaluation must proceed on a one-to-one basis. An FRU officer shall compare Individual Alpha (Group One) against Individual Beta (Group Two).
  2.3 Preference is only permissible if a pairwise differentiating factor exists (e.g., proximity, prior promise, or specific familial relation to the rescuer).
  2.4 In the absence of such factors, the numerical superiority of Group Two is deemed administratively irrelevant. The claim of the one is not outweighed by the claims of the many, as claims are not fungible currency.

  **3. Prohibited Aggregative Methods**
  3.1 The act of headcounting is classified as a Class C Ethical Breach.
  3.2 All personnel must execute a **Group-Size Disclosure Waiver (GSDW)** prior to deployment. This legal instrument confirms the officer remains ignorant of the total number of claimants in any given cluster.
  3.3 Visual estimation of crowd density is prohibited. Use of thermal imaging must be set to 'Singleton Mode', highlighting individuals without clustering data.
  3.4 Introduction of a **Non-Transitive Allocation Matrix** is required for complex scenarios. This ensures that preferring A over B and B over C does not cumulatively justify preferring A over C if no direct pairwise link exists.

  **4. Tie-Breaking and Lottery Procedures**
  4.1 Where pairwise assessment yields no distinguishing criteria between Group One (n=1) and Group Two (n=50), the situation is classified as a 'Moral Deadlock'.
  4.2 In a Moral Deadlock, the FRU must utilise the **Randomised Allocation Mechanism (RAM)**.
  4.3 A fair coin toss shall determine the destination of resources. The probability of saving Group Two shall not exceed 50%, regardless of size differential. To do otherwise would grant the individuals in Group Two extra weight simply for standing together.
  4.4 Personnel expressing distress regarding the potential death of the larger group must attend mandatory desensitisation training focusing on the non-comparability of separate tragedies.

  **5. Appeals and Clarifications (Sidebar)**
  5.1 *Objection: Identical Cost.* Queries regarding resource efficiency (e.g., saving fifty miners for the cost of one) are inadmissible. Cost-benefit analysis implies aggregation, which is prohibited under Clause 1.2. Resources are allocated based on moral claim, not utility maximisation.
  5.2 *Objection: Social Value.* Assessments of future utility, age, or dependents are forbidden unless they constitute a pairwise special obligation (e.g., 'This child is mine'). The state does not weigh social worth.
  5.3 *Objection: Arbitrariness.* Critics alleging the protocol is arbitrary are reminded that favouring the many without pairwise justification is equally arbitrary, merely masked by arithmetic. The coin ensures equal concern for each individual's chance of survival. It gives each person an equal chance of being saved, rather than ensuring the most are saved.

  **6. Compliance**
  6.1 Violation of this Directive, specifically the unauthorized saving of a majority based solely on numerosity, will result in immediate disciplinary review.
  6.2 The Ministry maintains that saving the many because they are many treats individuals as mere units of value, rather than separate persons deserving equal hope.

  ***

  **Reflective Note**

  This parody assumes Taurek mandates strict ignorance of numbers (the GSDW), whereas Taurek primarily argues numbers provide no *reason*, not that they must be unknown. It also codifies the coin flip as mandatory procedure; Taurek presents it as a method to express equal concern, but allows personal preference otherwise. The satire's vulnerable point is the transition from 'no reason to prefer' to 'procedural prohibition'. I would revise if convinced that non-aggregation permits implicit weighting without explicit arithmetic reasoning, or if the 'equal chance' argument is distinct from the 'no reason' argument. The manual treats the philosophical stance as an operational constraint, which Taurek might view as too rigid.
