answer: |-
  A scholar approached a translator at a colloquium on *le ton beau de Marot*, pointing to a line in the new rondeau where the lover lamented that his "court was heavy," when every lexicon confirmed the poet meant "heart."

  "You know the 1540 manuscript shows a scribal slip," the scholar said. "*Cour* instead of *coeur*. You have the authority to restore the meaning."

  "I do," the translator replied. "But I do not have the authority to alter the architecture. The rondeau's ABAAAB scheme relies on the corruption. Line four requires an 'ort' sound to sustain the refrain. 'Heart' offers only 'art'. 'Court' is the only word that satisfies the meter and mirrors the French error."

  "So you prioritize the scribe's mistake over the poet's intent?"

  "I prioritize the collaboration. The poet proposed the sentiment, but the form ratified the text. And in this partnership, the form prefers an accurate rhyme to a true heart."
