answer: |-
  This is a fascinating counterfactual because it tests the limits of Hume's monetary theory against a technology that fundamentally alters the *temporal* nature of money. To answer this, we must stick closely to his essays *Of Money* and *Of Interest* (1752), avoiding the temptation to project modern Austrian or libertarian dogma onto him. Hume was a pragmatist who accepted paper credit and understood velocity, but he was deeply skeptical of state manipulation of financial conventions.

  Here is how Hume would likely analyze programmable money with expiry or negative interest, based on his actual reasoning.

  ### 1. Money as Representation vs. Rationing Token
  Hume defines money not as wealth itself, but as "the representative of labour and commodities." It is a "method of rating men's industry." Crucially, he views money as a convention—a social agreement that allows us to measure value across time and space.

  If the state hardcodes an expiry date or a decay rate into the token, Hume would likely argue this fundamentally alters the **representative function**.

  *   **The "Oil" Metaphor:** Hume famously calls money the "oil which renders the motion of the wheels [of trade] more smooth and quick." Oil is a facilitator; it does not dictate the speed of the machine, nor does it evaporate if the machine pauses. If money decays, it ceases to be passive oil and becomes an active driver.
  *   **The Shift to Rationing:** In *Of Money*, Hume notes that money allows a man to "store up" his labor for future use. If the token expires, it ceases to be a claim on *future* goods and becomes a claim on *immediate* goods. Hume would likely classify this not as money in the philosophical sense, but as a **consumption voucher** or a rationing token. It no longer represents the *power* to purchase at the holder's discretion; it represents a *command* to purchase at the state's discretion.
  *   **Violation of Convention:** Hume emphasizes that money relies on "opinion" and trust. In *Of Public Credit*, he warns against state tampering with financial expectations. If the state can program the money to rot, the "opinion" of its stability collapses. Hume would argue that people would immediately flee this programmable money for real assets (land, gold, inventory), rendering the programmable token a hot potato rather than a standard of value.

  ### 2. Velocity and the Short-Run Stimulus
  Hume is often cited for the Quantity Theory of Money (more money = higher prices), but his actual insight is more nuanced: he argues that the increase in prices is **not immediate**. There is a "gradual adjustment" period where increased money supply stimulates industry because prices rise before wages do.

  *   **Forced Velocity:** Hume explicitly acknowledges that the "greater or less velocity of its circulation" matters as much as the quantity. Programmable decay is essentially a state-mandated increase in velocity.
  *   **Hume's Verdict on Stimulus:** Hume might concede that in the short run, forcing money to circulate (via expiry) would wake up "drowsy" industry, similar to the influx of gold from the Americas. It would prevent hoarding.
  *   **The Problem of Permanence:** However, Hume's stimulus argument relies on a *one-time* shock or a gradual influx. A permanent decay rate creates a permanent tax on holding liquidity. Hume would argue this doesn't create sustainable industry; it creates **distortion**. Merchants would not produce based on real demand, but based on the need to offload decaying tokens. This turns the "representation of labor" into a "representation of urgency," which misallocates industry.

  ### 3. Does Programmability Break Long-Run Neutrality?
  This is the critical theoretical question. Hume's standard claim is that money is neutral in the long run: doubling the money supply doubles prices, leaving real output unchanged. Does programmability break this?

  **Yes, Hume would likely argue it breaks neutrality, but not for the reasons a modern economist might think.**

  *   **Money vs. Capital:** In *Of Interest*, Hume makes a vital distinction: interest rates are not determined by the quantity of money, but by the quantity of **loanable capital** (real savings).
      *   If money decays, people cannot save in money. They must save in physical goods or land.
      *   Hume argues that a sophisticated financial system (where savings are easily mobilized into investment) lowers interest rates and boosts industry.
      *   If programmable money fragments savings (because everyone is forced to buy distinct physical assets to store value rather than depositing cash), the pool of loanable capital shrinks or becomes less efficient.
  *   **Real Effects:** Because the *structure* of saving changes, the real interest rate changes. If real interest rates rise because monetary savings are penalized, investment in long-term projects falls. Therefore, the "veil" of money is pierced. The rules of the money itself have altered the real accumulation of capital.
  *   **Conclusion on Neutrality:** Hume would say that while a simple increase in quantity is neutral in the long run, a change in the **rules of the game** (programmability) is not. It alters the incentives for frugality and capital accumulation, which are the true drivers of national wealth in his framework.

  ### 4. The Specie-Flow Mechanism and International Trade
  Hume's Price-Specie-Flow mechanism argues that if a nation inflates its money, prices rise, exports become expensive, and money flows out to other nations until equilibrium is restored.

  *   **Programmable Isolation:** If Country A has decaying money and Country B has stable gold, traders in Country A will instantly convert their expiring tokens into Country B's currency or goods.
  *   **The Drain:** Hume would predict a massive, immediate outflow of value. The "specie" (value) would flow out of the programmable zone just as water flows downhill. The state would find itself fighting a losing battle against the natural equilibrium of trade.
  *   **Exchange Rates:** Hume understood exchange rates as a reflection of purchasing power parity. Programmable money would cause the exchange rate to depreciate not just by the inflation rate, but by a premium reflecting the "decay risk." This would make imports prohibitively expensive, effectively isolating the economy.

  ### Summary of Hume's Likely Position

  Hume would not view programmable money with expiry as "money" in the strict philosophical sense, but rather as a **fiscal tool disguised as currency**.

  1.  **On Definition:** It ceases to be a "representative of labor" and becomes a "command to consume." It loses the essential quality of allowing industry to be stored for future use.
  2.  **On Neutrality:** It breaks long-run neutrality. By penalizing monetary saving, it distorts the market for loanable capital (a key Humean concept from *Of Interest*), likely raising real interest rates and hindering long-term capital accumulation.
  3.  **On State Power:** Hume was deeply suspicious of the state's ability to manage the economy. He would view programmability as the ultimate form of financial repression—an attempt to bypass the natural "specie-flow" equilibrium. He would warn that while it might force circulation in the short term, it would destroy the "opinion" and trust required for money to function, leading to a reversion to barter or foreign specie.

  In short, Hume would argue that you cannot program human nature. If you make money decay, people will stop treating it as money and start treating it as a hot potato, and the "oil" of trade will turn into sand in the gears.
