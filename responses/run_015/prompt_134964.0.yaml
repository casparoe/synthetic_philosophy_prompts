      *   *Is it Money or Rationing?*
          *   Hume sees money as a *claim* on goods. If the claim expires, it's a forced consumption mandate.
          *   If the state dictates *when* you must spend, it interferes with the "representation" function. It stops being a passive mirror of industry and becomes an active tool of social engineering.
