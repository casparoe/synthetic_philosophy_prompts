      *   **Claim 5:** "Fortuna isn't random but cyclical, so if you grasp the cycle you can predict it, which is another form of virtù." (This conflates Machiavelli with Polybius or later cyclical theorists. Machiavelli's *fortuna* is often abrupt contingency, not a predictable clockwork cycle. This is a significant conceptual error).

