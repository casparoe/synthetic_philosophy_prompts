  ### Part 2: Empirical Collapses

  **The (B) vs. (E) Collapse:**
  You suspected this, and you are right. **Leaf B (Convergence)** and **Leaf E (Epistemic Shadow)** are empirically indistinguishable.
  *   **Leaf B** says: "Keep working, the data will eventually force a single answer."
  *   **Leaf E** says: "The answer is there, but the data will never force it."
  *   **The Problem:** From the perspective of anyone actually doing the fieldwork (your brother-in-law), these look identical until the end of time. If he dies before converging, was it B (he didn't work long enough) or E (it was impossible)? There is no observation "dhamba" can provide that separates "hard to find" from "impossible to find." The tree treats them as separate based on his *belief* about the limit of inquiry, not on the evidence itself.

  **The (A) vs. (I) Slide:**
  **Leaf A (Radical Indeterminacy)** and **Leaf I (Ontological Relativity)** are often treated as the same, but they aren't.
  *   **A** says: "There is no fact."
  *   **I** says: "There is a fact, but it's relative to a background manual."
  *   **The Problem:** In practice, both advise the linguist to stop arguing about which manual is "true." They collapse into the same practical advice, even if the metaphysics differs.

