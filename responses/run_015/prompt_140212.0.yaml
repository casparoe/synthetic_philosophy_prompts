  ### Part 1: The Three Theses Map

  You identified three theses that often get conflated. Here is how each leaf stands on them.
  *   **T1 (Swapping):** You can systematically swap what words pick out (rabbits vs. parts) without changing observable truth.
  *   **T2 (Manuals):** Two whole translation manuals can fit all evidence with no fact about which is right.
  *   **T3 (Ordinary Underdet):** This is just normal scientific underdetermination (like physics), nothing special about meaning.

  | Leaf | T1 (Swapping) | T2 (Manuals) | T3 (Ordinary) | Status of Combination |
  | :--- | :--- | :--- | :--- | :--- |
  | **A: Radical Indeterminacy** | **Accepts** | **Accepts** | **Rejects** | **Occupied.** (Quine's classic position). |
  | **B: Convergence Realist** | **Rejects** | **Rejects** | **Rejects** | **Occupied.** (Standard fieldwork optimism). |
  | **C: Naturalness Tie-Break** | **Rejects** | **Accepts** (Provisionally) | **Rejects** | **Occupied.** (Manuals fit, but nature picks one). |
  | **D: Scientific Realist** | **Rejects** | **Rejects** | **Accepts** | **Occupied.** (Meaning is just another theory). |
  | **E: Epistemic Shadow** | **Rejects** | **Rejects** | **Rejects** | **Occupied.** (Fact exists, but we are blinded). |
  | **F: Deflationary** | **Rejects** | **Rejects** | **Rejects** | **Occupied.** (Theses presuppose a confused framework). |
  | **G: Local Skeptic** | **Rejects** | **Rejects** | **Accepts** | **Empty.** *Unattractive:* Why would meaning be underdetermined like physics but only for some words? |
  | **H: Insider Mystique** | **Rejects** | **Rejects** | **Rejects** | **Empty.** *Incoherent:* If insiders can't tell, in what sense does the fact exist? |
  | **I: Ontological Relativity** | **Accepts** | **Accepts** | **Rejects** | **Occupied.** (Stronger version of A). |

  **Empty Combinations (Theoretical Gaps):**
  *   **T1 Yes, T2 No, T3 No:** *Empty (Incoherent).* If you can swap reference systematically without observation changing, you effectively have manual indeterminacy.
  *   **T1 No, T2 Yes, T3 Yes:** *Empty (Unattractive).* If manuals are indeterminate, it's usually because meaning is special, not because of general scientific underdetermination.
  *   **T1 Yes, T2 No, T3 Yes:** *Empty (Incoherent).* Swapping implies manual equivalence; you can't have one without the other.

