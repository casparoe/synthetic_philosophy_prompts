answer: |-
  # Specification for a Theory of Commensurability Supporting Lexical Threshold Negative Utilitarianism

  **Purpose:** To define the structural and substantive requirements for a theory of value that renders Two-Threshold Lexical Threshold Negative Utilitarianism (LTNU) action-guiding.
  **Definition of LTNU:** A view where (1) sub-threshold pleasure has negligible/zero value, and (2) super-threshold suffering is lexically dominant over all sub-threshold pleasure (no finite quantity of the latter compensates for the former).

  ---

  ## I. The Requirements

  ### 1. The Bearers of Value
  *   **Precise Statement:** The theory must identify the ontological category of the items being compared (e.g., instantaneous qualia, temporally extended episodes, or whole lives) and specify a **minimum temporal granularity** for evaluation. It must explicitly rule on the **Fragmentation Problem**: whether a super-threshold episode of suffering can be rendered morally negligible by being divided into sufficiently short temporal parts, each falling below the intensity or duration threshold.
  *   **Motivation:** Without a defined bearer, the threshold is unlocatable. If a "life" is the bearer, momentary torture might be diluted; if a "millisecond" is the bearer, torture becomes a series of negligible pains. To avoid the "dust" worry (where severe suffering is fragmented into negligible bits), the theory must mandate a minimum integration window for pain that prevents strategic fragmentation.
  *   **Status:** **Non-negotiable for this purpose.** A theory cannot guide action if it cannot identify the unit of account.

  ### 2. Lexical Priority versus Incommensurability
  *   **Precise Statement:** The theory must commit to **Lexical Priority** (a strict ordering where $S_{high} \succ \text{any quantity of } P_{low}$) rather than **Incommensurability** (the absence of a common scale preventing comparison). It must provide a formal relation that allows a decision procedure to select one option over another even when they involve different categories of value.
  *   **Motivation:** LTNU is often motivated by the intuition that pain and pleasure are "different kinds" (incommensurable). However, incommensurability leads to decision paralysis (no rational choice between incomparable options). For LTNU to be action-guiding, it must treat the relation as a strict lexical ordering within a decision framework, not as a failure of comparison.
  *   **Status:** **Non-negotiable for this purpose.** Incommensurability renders the view non-action-guiding; lexicality is required for the "no trade-off" rule to function as a decision procedure.

  ### 3. Aggregation Across Persons
  *   **Precise Statement:** The theory must specify whether the lexical ban on trade-offs applies **intrapersonally** (within one life) or **interpersonally** (across lives). It must explicitly resolve the **Reverse Repugnant Conclusion**: whether one episode of threshold-crossing suffering in one person is worse than any number of mildly pleasant lives in others.
  *   **Motivation:** Standard utilitarianism aggregates across persons. LTNU typically rejects this for severe suffering. If the theory allows interpersonal aggregation of mild pleasures to outweigh severe pain, it collapses into standard utilitarianism. If it forbids it, it requires a theory of rights or separateness of persons to justify the constraint.
  *   **Status:** **Preference of the NU camp.** A neutral theorist of commensurability need not forbid interpersonal aggregation; this is a specific moral commitment of Negative Utilitarianism.

  ### 4. Mixed Valence
  *   **Precise Statement:** The theory must account for **phenomenologically mixed states** (e.g., relief, bittersweet grief). It must state whether valence is **separable** (nettable into a single scalar) or **non-separable** (requiring vector representation). If separable, it must explain how a net-positive mixed state containing a super-threshold pain component is evaluated.
  *   **Motivation:** If valence is netted, a super-threshold pain could be cancelled by intense pleasure, violating the lexical constraint. If non-separable, the theory becomes complex. Ignoring mixed states renders the theory inapplicable to real-world choices where costs and benefits are entangled.
  *   **Status:** **Non-negotiable for this purpose.** Real-world action-guidance requires handling complex experiences; ignoring them limits the theory to artificial cases.

  ### 5. The Zero Point and Prudential Significance
  *   **Precise Statement:** The theory must define the normative status of sub-threshold pleasure. Specifically, it must state whether sub-threshold pleasure has **zero prudential value** (it is not good for the subject) or merely **zero moral weight** (it is good for the subject but irrelevant to moral calculation). It must address whether extinguishing such pleasure is cost-free.
  *   **Motivation:** LTNU treats sub-threshold pleasure as negligible. If it has prudential value, destroying it harms the individual, creating a conflict between moral indifference and prudential harm. If it has no prudential value, the theory implies mild pleasures are not worth having, which is a strong substantive claim.
  *   **Status:** **Preference of the NU camp.** A neutral theory of well-being would typically assign positive prudential value to mild pleasure; collapsing prudential and moral significance is specific to the Negative Utilitarian agenda.

  ### 6. Vagueness and the Cliff Edge
  *   **Precise Statement:** The theory must address the **Sorites vulnerability** of the threshold. It must either (a) defend a sharp boundary despite higher-order vagueness, (b) introduce a **zone of parity** (near-threshold states are neither better, worse, nor equal), or (c) adopt a **hysteresis mechanism** (the threshold for entering the lexical regime is higher than the threshold for leaving it). It must explain how this avoids arbitrary discontinuities where infinitesimally different states have infinitely different values.
  *   **Motivation:** A sharp threshold creates a "cliff edge" where a micro-change in pain intensity flips the moral verdict from negligible to absolute priority. This violates continuity intuitions. Hysteresis prevents "flickering" but does not solve the arbitrariness of the threshold location. Parity avoids the cliff but risks incompleteness.
  *   **Status:** **Non-negotiable for this purpose.** Without a solution to vagueness, the theory is unstable and cannot guide action in borderline cases.

  ### 7. Prospects and Risk
  *   **Precise Statement:** The theory must provide a **decision rule for uncertainty**. Since lexical priority violates the continuity axiom of Expected Utility Theory, the theory must specify how to rank gambles. It must determine whether a small probability of threshold-crossing suffering dominates a certainty of massive sub-threshold pleasure loss.
  *   **Motivation:** Real decisions involve risk. If the theory relies on standard Expected Value, the lexical threshold is diluted by probability (e.g., $0.0001 \times \infty$ is undefined or problematic). A specific risk rule (e.g., Lexical Expected Utility or Minimax) is required to maintain the lexical constraint under uncertainty.
  *   **Status:** **Non-negotiable for this purpose.** An action-guiding view must handle risk; standard models fail here.

  ### 8. Locatability
  *   **Precise Statement:** The theory must connect the abstract threshold to **empirical markers** (e.g., self-report, neural correlates, behavioral choice). It must provide a **conflict resolution rule** for when markers disagree (e.g., a subject reports mild pain, but neural markers indicate threshold intensity).
  *   **Motivation:** A threshold that cannot be located even roughly is not action-guiding. Without empirical anchors, the theory remains a slogan.
  *   **Status:** **Non-negotiable for this purpose.** This is the definition of "action-guiding."

  ---

  ## II. Analysis of the Specification

  ### 1. Jointly Unsatisfiable Requirements
  There is a trilemma inherent in this specification. No single theory can simultaneously satisfy the following three conditions:
  1.  **Sharp Lexical Threshold** (Requirement 2 & 6a): A definite point where value jumps from negligible to dominant.
  2.  **Absence of Cliff-Edge Discontinuity** (Requirement 6): The demand that infinitesimally close states do not have infinitely different normative statuses.
  3.  **Transitive and Complete Ranking** (Requirement 2 & 7): The ability to rank all options decisively to guide action.

  **Argument:**
  *   If you maintain a **Sharp Lexical Threshold**, you necessarily create a **Cliff Edge** (violating 2). A lexical break *is* a discontinuity.
  *   If you avoid the **Cliff Edge** by introducing a **Zone of Parity** (Requirement 6b), you sacrifice **Completeness** (violating 3). Parity relations are typically non-transitive or incomplete, leading to decision paralysis in the zone.
  *   If you maintain **Completeness** and avoid the **Cliff Edge** by smoothing the function, you sacrifice the **Sharp Lexical Threshold** (violating 1), collapsing into a weighted utilitarianism.

  **Verdict:** The subset {Sharp Lexical Threshold, No Cliff-Edge, Complete Ranking} is unsatisfiable. To make LTNU action-guiding, one must likely sacrifice the "No Cliff-Edge" intuition (accepting the discontinuity as a brute fact) or sacrifice Completeness (accepting that some near-threshold choices are rationally undetermined).

  ### 2. The Most Exclusionary Requirement
  **Requirement 8 (Locatability)** excludes the largest number of otherwise attractive candidate theories.
  *   **Reasoning:** Many philosophical theories of value (e.g., ideal hedonism, preference satisfaction) are conceptually robust but empirically unmoored. They can define *what* matters but not *how to measure it* in real time. A theory that demands a specific neural or behavioral marker for a lexical threshold faces the hard problem of consciousness and the variability of pain reporting. Most formal axiologies fail here because they are not psychophysical theories. Demanding an empirical anchor rules out purely conceptual analyses.

  ### 3. The Most Partisan Requirement
  **Requirement 5 (The Zero Point and Prudential Significance)** is the most partisan demand of the Negative Utilitarian camp.
  *   **Reasoning:** A neutral theorist of commensurability would typically distinguish between *moral weight* and *prudential value*. They would argue that mild pleasure is good *for the subject* (prudentially) even if it lacks *moral priority* against severe pain. LTNU's tendency to treat sub-threshold pleasure as having *no value at all* (or being morally ignorable to the point of extinguishability) is a specific moral prejudice, not a requirement of value theory. A neutral theorist could accept lexical priority for pain without denying the positive prudential status of mild pleasure.

  ---

  ## III. Assessment of Candidate Models

  Here is how three common modeling approaches fare against the specification:

  **1. Single Cardinal Scale with Priority Clause**
  *   *Mechanism:* A real-number scale where values above $T$ are mapped to a higher ordinal tier (e.g., $\omega + x$) than values below $T$ (finite $x$).
  *   *Performance:*
      *   **Passes:** Lexical Priority, Aggregation, Risk (if modified), Bearers.
      *   **Fails:** Vagueness/Cliff Edge (inherent discontinuity), Locatability (no empirical anchor provided).
      *   **Verdict:** Best for formal coherence, but fails the "No Cliff-Edge" intuition and empirical application.

  **2. Parity-Style Incomparability Model**
  *   *Mechanism:* Near-threshold states are "on a par"—comparable but not ordered by better/worse/equal.
  *   *Performance:*
      *   **Passes:** Vagueness/Cliff Edge (dissolves the sharp jump), Mixed Valence (allows complexity).
      *   **Fails:** Lexical Priority (weakens the "no trade-off" claim), Completeness (fails action-guidance in the parity zone), Risk (expected parity is undefined).
      *   **Verdict:** Solves the Sorites problem but sacrifices the action-guiding purpose of LTNU by permitting rational indeterminacy.

  **3. Two-Dimensional (Multi-Utility) Representation**
  *   *Mechanism:* Pleasure and Pain are separate vectors $(P, S)$. Lexicality is a constraint rule ($S > T \implies \text{reject}$) rather than a value summation.
  *   *Performance:*
      *   **Passes:** Mixed Valence (keeps components distinct), Lexical Priority (as a constraint), Zero Point (can set $P=0$).
      *   **Fails:** Risk (how to compare vector gambles?), Locatability (requires two separate empirical markers), Aggregation (difficult to sum vectors lexically).
      *   **Verdict:** Most phenomenologically accurate, but computationally complex for decision-making under risk.

  **Conclusion on Models:** The **Single Cardinal Scale with Priority Clause** is the only one that robustly satisfies the "Action-Guiding" constraint (Completeness), provided one accepts the Cliff Edge as a necessary cost of Lexicality. The Parity model saves the phenomenology but loses the decision procedure.
