answer: |-
  Here is the spec for a naturalistic theory of mental content adequate for empirical cognitive science.

  ### The Core Requirements

  **1. The Error Constraint (Misrepresentation)**
  *   **Requirement:** The theory must allow for a state to be tokened when its object is absent, and classify that tokening as incorrect.
  *   **The Case:** A frog snaps at a moving black speck. It's a bee-bee (BB pellet), not a fly. The mechanism fires. If your theory says the content is "moving black speck," the frog is right. If it says "fly," the frog is wrong. Cognitive science needs the latter. If a theory cannot distinguish between a state caused by X and a state representing X, it cannot explain why the organism failed.
  *   **Status:** **Non-Negotiable.**

  **2. The Distality Constraint**
  *   **Requirement:** Content must latch onto the distal object or property in the world, not the proximal stimulation or the intermediate causal chain.
  *   **The Case:** A retinal ganglion cell fires. The proximal cause is photon impact. The distal cause is a predator. If content is fixed at the retina, the organism represents "photon burst." If fixed at the predator, it represents "hawk." Science attributes the latter. If a theory locks content to the immediate physical trigger, it makes the organism solipsistic and cannot explain navigation or predation.
  *   **Status:** **Non-Negotiable.**

  **3. The Normativity Constraint**
  *   **Requirement:** There must be a fact of the matter about whether a state *ought* to occur in a given situation, distinct from whether it *does* occur.
  *   **The Case:** A navigation system outputs "Turn Left" when the bridge is out. The state occurred (caused by the map data), but it was defective. A purely descriptive causal story tells you why the state happened, but not why it was a failure. Science treats malfunction as real, not just statistical deviation. You need a ground for "correctness" that isn't just "typical."
  *   **Status:** **Non-Negotiable.**

  **4. The Generalization Constraint (Novelty & Non-Existence)**
  *   **Requirement:** The theory must account for content regarding things the system has never encountered, or things that do not exist.
  *   **The Case:** A rat avoids a novel poison after one trial (taste aversion). It represents "toxic" without a history of eating that specific toxic leaf. Or a human plans for "next Tuesday." There is no causal link to next Tuesday yet. If content requires actual past causal contact, you cannot explain planning, imagination, or rapid generalization.
  *   **Status:** **Non-Negotiable.**

  **5. The Consumption Constraint**
  *   **Requirement:** A state only has content if some downstream mechanism is designed to use it. Tracking without consumption is not representation.
  *   **The Case:** A tree's rings track the age of the tree perfectly. No mechanism inside the tree *reads* the rings to regulate growth. The tree does not represent its own age. If your theory counts tree rings as mental content, you have over-generated. Content requires a consumer that acts on the information.
  *   **Status:** **Non-Negotiable.**

  **6. The Efficacy Constraint**
  *   **Requirement:** The content attributed to the state must make a difference to the system's behavior or processing.
  *   **The Case:** If you say a module represents "global GDP" but that value never influences the organism's decisions, motor output, or other internal calculations, positing that content is explanatorily idle. Science posits representations to explain behavior. If the content is epiphenomenal, it drops out of the scientific model.
  *   **Status:** **Non-Negotiable.**

  ---

  ### The Two Wrinkles (Specific Requirements)

  **7. The Lineage Independence Requirement (Training History)**
  *   **Requirement:** The theory must ground normativity and content in systems that have a selection-like history (training/optimization) but no biological lineage, reproduction, or fitness consequences for an organism.
  *   **The Case:** A neural network is trained via backpropagation to identify cats. Weights are adjusted based on a loss function. Variants that lower loss are "kept" (weights updated); variants that raise it are "discarded" (gradients reversed). There is no organism, no survival, no reproduction. If a theory requires biological fitness to ground "correctness," it cannot attribute content to AI, which cognitive science increasingly treats as a model of cognition. The theory must identify what in the training loop substitutes for biological selection to create genuine *aboutness* rather than mere correlation.
  *   **Status:** **Non-Negotiable** (for adequacy in modern cognitive science).

  **8. The Functional Shift Requirement (Reuse)**
  *   **Requirement:** The theory must provide a determinate rule for fixing content when a mechanism's current functional role diverges from its historical selection pressure.
  *   **The Case:** A neural circuit evolved to track sun position for navigation (history). In a modern environment, it is reliably recruited to track time-of-day for social scheduling (current job). It does the new job well, but the history is different. Does it represent *sun* or *time*? A theory cannot say "it depends" or "both." It must specify whether content is fixed by origin (history) or current systemic role. Indeterminacy here breaks the ability to model the system's logic.
  *   **Status:** **Camp Preference** (The *need* for a decision is non-negotiable; the *verdict* is the preference).

  ---

  ### Conflicts and Exclusion Power

  **The Inconsistent Pair: Distality vs. Lineage Independence**
  *   **The Clash:** You likely cannot satisfy both fully.
  *   **The Case:** To solve **Distality** (Requirement 2) and **Error** (Requirement 1), standard naturalistic theories rely on asymmetric dependence or teleological functions grounded in survival. The state represents the fly (distal) rather than the retinal shadow (proximal) because the mechanism was selected *for* catching flies.
  *   **The Problem:** In the **Lineage Independence** case (Requirement 7), there is no survival. There is only loss minimization. The system is selected to minimize the *loss signal*, not to track the *world*. The loss signal is proximal (internal to the training loop). If you ground content in what the system was selected to do (to satisfy Error/Distality), an ML model represents "low loss states," not "cats." If you ground it in "what correlates with the world" (to satisfy Distality), you lose the Normativity/Error constraint (because correlation doesn't allow for error, only deviation).
  *   **The Finding:** A theory that handles biological teleology well usually fails on AI (no fitness). A theory that handles AI well (correlation/optimization) usually fails on Distality/Error (collapses into proximal tracking).

  **The Single Most Exclusionary Requirement: The Error Constraint**
  *   **Why:** This is the filter that kills the simplest, most intuitive naturalistic stories.
  *   **The Force:** Pure causal/informational theories (e.g., "State S represents X because X causes S") fail this immediately. If X causes S, and Y causes S, the content becomes the disjunction "X-or-Y." But then the system is never wrong; it's always accurately representing "X-or-Y." To save Error, you have to add machinery (functions, asymmetries, ideal conditions). This requirement forces every viable theory to be a hybrid theory. It excludes all "pure" causal accounts, which are the most parsimonious naturalistic options. It demands you pay a metaphysical tax to get error off the ground.

  ---

  ### Scorecard of Live Families

  **1. Covariation / Information-Based**
  *   **The Pitch:** Content is grounded in reliable causal correlation or information transfer.
  *   **Where It Cracks:** Fails the **Error Constraint**. If representation is just covariation, a false token is just a different kind of true token (information about the noise). It also struggles with **Distality**, often locking onto the proximal signal carrier rather than the source.

  **2. History / Function-Based (Teleosemantics)**
  *   **The Pitch:** Content is grounded in what the mechanism was selected to do (evolutionary history).
  *   **Where It Cracks:** Fails **Lineage Independence**. It cannot easily handle AI or novel learning without biological fitness. It also struggles with the **Functional Shift Requirement**, often forcing content to remain stuck on the ancestral function even when the system is repurposed.

  **3. Use / Role-Based (Functional Role Semantics)**
  *   **The Pitch:** Content is grounded in how the state is used by the system (inferential role, downstream consumption).
  *   **Where It Cracks:** Fails **Distality** and **Normativity**. If content is just how the system uses the state, the system is never wrong about its own inputs (it uses them as they are). It risks making content internalist, cutting the link to the external world required for explaining successful action.
