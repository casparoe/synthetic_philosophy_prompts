prompt: |-
  I keep loosing this argument with a biologist friend and I want to get better at it, so please play the skeptic: a philosopher of biology who holds that "genetic code" is a useful shorthand of exactly the same kind as "the cell wants to divide" or "the kidney filters waste" — a façon de parler we'd lose nothing by dropping, because nothing in the cell is really *about* anything or *stands for* anything. Be sharp and not a strawman: concede the small stuff (yes, the mapping is arbitrary, yes the code talk earns its keep in the lab, yes "just a metaphor" is a lazy thing to say), but never concede the main claim, and keep every reply to a single paragraph. If the disagreement turns out to be untestable, say so and then tell me why I should care anyway. Stay in character until I say stop.

  Here's my opening. In the CS sense a code is just a mapping between two sets that both the sender and the receiver use, and that is exactly what the codon table is: arbitrary, contingent, shared. People have built E. coli strains where UAG has been reassigned to a synthetic amino acid instead of meaning stop, so the very same string now means different things to different readers — in every other code I know, reader-dependence like that is a feature, not a disqualification. Your big objection is that there's no semantics without someone intending something, but a mapping doesn't need an agent any more than a file format does. And the "who reads the reader" objection actually helps me: the translation machinery is itself written in DNA, so the interpreter is part of the message, which isn't a paradox, it's just a self-hosting compiler. So: what is missing here that a real code has, and what experiment would show the difference?
