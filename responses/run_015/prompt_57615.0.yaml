  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use "legibility"? Yes, in the context of state knowledge.
      *   *Check:* Did I address the "rationalist blog" background? Implicitly, by treating Mill's argument as a system/model rather than a historical artifact.
      *   *Check:* Is the distinction between formal and functional authority clear? Formal = laws/constitution. Functional = actual ability to enforce/deliver. Mill argues functional must precede formal.
