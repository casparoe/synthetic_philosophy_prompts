answer: |-
  # The Anchored Triangulation Protocol (ATP)

  You are facing a classic administrative law problem: the tension between *individualized justice* (which requires discretion) and *rule of law* (which requires consistency). Your "diachronic sorites" is the inevitable result of binding precedent applied by low-training staff to vague standards. You cannot eliminate discretion, but you can cage it.

  Below is the **Anchored Triangulation Protocol (ATP)**. It is designed to be run by a caseworker in 20 minutes, with specific escalation paths. It addresses your four difficulties by design, not by hope.

  ## Part 1: The Procedure

  ### Phase 1: The Hard Floors (Stop/No)
  *Purpose: To eliminate clearly ineligible cases quickly and define the "Trivial/Temporary/Occasional" floor.*

  Caseworkers must assess the three components independently. If **any** component falls below the Hard Floor, the decision is **NO**. Do not proceed to Phase 2.

  1.  **Duration:** Is the condition expected to last less than **6 months**? (Temporary).
  2.  **Severity:** Is the difficulty limited to **one** activity of daily living (e.g., only cooking, but not cleaning, walking, or washing)? (Trivial).
  3.  **Care Need:** Is the help required less than **5 hours per week** of human intervention? (Occasional).

  *Reasoning Template:* "Support requires needs that are long-term, substantial, and frequent. Your circumstances regarding [Component] fall below the minimum threshold established for the program."

  ### Phase 2: Anchor Matching (Classification)
  *Purpose: To solve Tolerance vs. Consistency. Caseworkers compare the case to "Anchor Cases," not to the previous decision.*

  The Unit maintains a **Library of 10 Anchor Cases** (5 Awards, 5 Refusals). These are ratified quarterly by the Panel. They represent the "gold standard" of the threshold.

  1.  Caseworker selects the **Single Best Match** from the Library.
  2.  **Rule of Proximity:** Is the current applicant *clearly* worse off than the best-matching Refusal Anchor? → **NO**.
  3.  Is the applicant *clearly* better off than the best-matching Award Anchor? → **YES**.
  4.  If the applicant sits *between* the best-matching Refusal and Award Anchors → **Proceed to Phase 3**.

  *Note:* Caseworkers are forbidden from citing decisions made by other caseworkers in the last 6 months as precedent. They must cite the Library. This breaks the sorites chain.

  ### Phase 3: The Trade-Off Matrix (Verdict)
  *Purpose: To handle the three components without collapsing them into a score.*

  If the case is between Anchors, apply the **Two-Out-Of-Three Dominance Rule**.
  Rate each component as **High** or **Medium** (Low is excluded by Phase 1).

  *   **Verdict YES:** If two components are **High**. (The third can be Medium).
  *   **Verdict NO:** If two components are **Medium**. (The third can be High).
  *   **Escalate to Panel:** If there is a tie (e.g., all three are Medium, or the caseworker cannot determine High vs. Medium).

  *Reasoning Template:* "While your [Component A] is significant, the program requires substantial need in at least two of the three eligibility areas. Your circumstances in [Component B] and [Component C] do not meet this dominance threshold."

  ### Phase 4: The Chain-Breaker (Escalation)
  *Purpose: To detect and stop threshold drift.*

  If a caseworker feels compelled to cite a precedent that is *not* in the Anchor Library (e.g., a recent decision they feel is binding), they must check the **Lineage**.
  *   **Rule:** If the precedent they wish to follow is more than **two decision-steps** removed from an Anchor Case, they **must escalate to Panel**.
  *   **Rationale:** This identifies where the "drift" is happening. The Panel will either ratify the new threshold (creating a new Anchor) or reject it (reinforcing the old Anchor).

  ---

  ## Part 2: Addressing the Four Difficulties

  1.  **Tolerance vs. Consistency:**
      *   *Solution:* The **Anchor Library**. By forcing comparison to static, quarterly-reviewed cases rather than the immediate predecessor, you prevent the "telephone game" of precedent.
      *   *Chain-Breaker:* The "two-step" rule ensures that if drift occurs, it is caught before it becomes entrenched.

  2.  **Comparing vs. Classifying:**
      *   *Solution:* Phase 2 acknowledges that caseworkers are better at comparing (A is worse than B) than classifying (A is "Substantial").
      *   *Limit:* The procedure admits comparability thins out at the margins. If a case falls *between* Anchors (Phase 3), comparison stops, and the Matrix begins. If the Matrix ties, it goes to Panel. This acknowledges where human judgment runs out of road.

  3.  **Three Components (No Single Score):**
      *   *Solution:* The **Two-Out-Of-Three Dominance Rule**. A high score in Severity cannot mathematically cancel a low score in Duration (because Duration has a Hard Floor in Phase 1). They remain distinct buckets that must be filled independently, but the verdict allows for trade-offs (one Medium is forgivable if two are High).

  4.  **Reasons (Legitimate Arbitrariness):**
      *   *Legitimate:* Boundary conditions announced in advance. Telling an applicant "We define long-term as 6 months; you have 5" is legitimate. It is a rule, not an insult.
      *   *Illegitimate:* Ad hoc exceptions. Telling an applicant "You failed by one point, but someone else passed" is insulting. The ATP prevents this by standardizing the "point" (the Anchor).
      *   *Phrasing:* Never write "You failed." Write "Your circumstances fall outside the established parameters."

  ---

  ## Part 3: Running the Cases

  ### Case (a): The Unanticipated Tech
  *Facts:* Difficulties Substantial/Long-term. Help Need unclear due to assistive equipment.
  *   **Phase 1:** Passes Hard Floors (Severity/Duration are clear).
  *   **Phase 2:** No Anchor Case matches this fact pattern (equipment unanticipated).
  *   **Phase 3:** Cannot rate "Care Need" as High or Medium reliably.
  *   **Outcome:** **Escalate to Panel.**
  *   **Why:** This is a question of values, not fact. Does "need" mean "biological need" or "net need after tech"? The Panel must decide this policy question and create a new Anchor. Caseworkers cannot invent this rule.

  ### Case (b): The Fluctuator
  *Facts:* Fluctuating condition. Trivial on good days, Substantial on bad. Frequency is middling (e.g., 3.5 bad days/week).
  *   **Phase 1:** Duration Pass. Severity Pass (on bad days). Care Need?
  *   **Phase 2:** Compare to Anchor. Anchors define "Substantial Care Need" as "Required on a majority of days."
  *   **Phase 3:** 3.5 days is not a majority (4+). Care Need is rated **Medium**. Severity is **Medium** (due to fluctuation). Duration is **High**.
  *   **Calculation:** One High, Two Medium.
  *   **Outcome:** **NO.**
  *   **The "No You Won't Like":** This is the cliff-edge. An applicant with 3.5 bad days gets nothing; one with 4 gets paid.
  *   **Justification:** This is **Legitimate Arbitrariness**. You cannot administer a mass program without bright lines. The reason given is: "Support requires need that is consistent. Your fluctuation falls below the frequency threshold required for eligibility." It is harsh, but it is stable.

  ### Case (c): The Sorites Victim
  *Facts:* Marginally worse than Refusal (24 months ago). Marginally better than Award (1 month ago).
  *   **Phase 1:** Passes Hard Floors.
  *   **Phase 2:** Caseworker notices the 1-month Award is a closer match than the 24-month Refusal.
  *   **Phase 4 (Chain-Breaker):** The 1-month Award is 20+ decision-steps removed from the original Anchor. The caseworker **must escalate**.
  *   **Panel Action:** The Panel reviews the 1-month Award and identifies it as "Drift." They reinstate the 24-month Refusal as the active Anchor.
  *   **Comparison:** Applicant is worse than the 24-month Refusal Anchor.
  *   **Outcome:** **NO.**
  *   **The "No You Won't Like":** This applicant is denied because the system is correcting its own recent error. They are better than someone who got paid last month, but they are being punished to stop the threshold from sliding further.
  *   **Justification:** "Eligibility is determined against standard criteria. Recent decisions that deviated from these criteria have been corrected. Your circumstances do not meet the standard threshold."

  ---

  ## Part 4: Limitations and Transparency

  ### What the Procedure Cannot Do
  1.  **It cannot make the vague precise.** The terms "Substantial" and "Trivial" remain morally vague. The ATP merely *operationalizes* them, it does not *define* them philosophically.
  2.  **It cannot prevent all injustice.** Case (b) and Case (c) demonstrate that systemic consistency requires individual sacrifice. The procedure manages error; it does not eliminate it.
  3.  **It cannot replace the Panel.** The ATP is a triage tool. If your Panel does not meet quarterly to update Anchors, the ATP will calcify and fail within a year.

  ### The Transparency Problem
  You asked if publishing the procedure teaches advisers how far to move a case.
  **Yes, it does.** If you publish the Hard Floors (6 months, 5 hours) and the Anchor Library, skilled advisers will coach applicants to hit exactly 6 months and 5 hours.

  **However, you should publish it anyway.**
  1.  **Secret Law is Unstable:** If caseworkers apply rules they cannot see, their confidence drops, and drift accelerates.
  2.  **Gaming is Contained:** Publishing the *Anchors* is safe if the Anchors are **dynamic**. If you update the Library quarterly, advisers cannot game a static target. They are aiming at a moving horizon.
  3.  **Legitimacy:** When you deny Case (b), you can point to the published rule. If the rule is secret, the denial looks like malice. If the rule is public, the denial looks like administration.

  **Recommendation:** Publish the **Protocol** and the **Hard Floors**. Do **not** publish the full **Anchor Library**. Publish a summary of the Anchors (e.g., "Typical successful cases involve X, Y, Z"). This gives the public confidence in the structure without giving them the keys to the lock.

  ### Final Directive
  The "No" in Case (c) is the price of fixing your unit. You are trading the equity of one applicant for the integrity of the next two years of decisions. If you are not willing to issue that No, do not implement the ATP. If you implement it, you must defend that No publicly as "Restoring Fairness," not "Applying Rules."
