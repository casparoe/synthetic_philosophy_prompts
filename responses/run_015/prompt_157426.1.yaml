answer: |-
  You are right to be skeptical because that summary sounds like a classic case of someone trying to be too clever by forcing a philosopher's metaphysical system into areas where it does not belong. It is a common temptation when discussing Berkeley to assume that his principle that existence depends on perception must apply to every single object in his universe, including economic instruments, but this ignores the distinction he made between philosophical speculation and the practical realities of civil life. The accurate part of the summary is the claim that Berkeley viewed gold and silver as having no intrinsic value beyond being symbols of human labor and industry. He did indeed argue that money is essentially a ticket or counter that denotes power over the labor of others, and he was quite modern in suggesting that the material of the money matters less than the economic activity it represents. He also did criticize paper credit when it became detached from real goods and productive industry, warning against the dangers of speculation where money chases money without producing anything tangible.

  However, the summary goes off the rails when it claims he literally applied his immaterialism to banknotes in a vault. Berkeley never argued that a banknote ceases to exist metaphysically when no one is looking at it, nor did he claim credit money is metaphysically empty in the sense of his philosophy. His point was economic, not ontological. When he talked about money losing its reality, he meant it loses its value or efficacy as a social tool if it is not backed by the industry and trade of a nation. The idea that he thought notes in a vault vanish is a caricature that conflates the philosophical grounding of reality with the social construction of value. He understood that money functions as an institution and a convention among people, and while his metaphysics says objects rely on perception for their existence, his economics says money relies on industry for its value. These are two different kinds of reliance, and the article you read seems to have muddled them together to make for a more sensational story.

  Furthermore, the claim that he wanted to scrap all symbolic currency and return to direct barter is simply incorrect and contradicts his actual political economy. Berkeley was a proponent of establishing a national bank in Ireland and was generally in favor of paper money, provided it was managed correctly to stimulate employment and circulation. He was not a primitivist looking to dismantle the monetary system but rather a reformer who wanted to ensure that the monetary system served the public good by encouraging real work and production. He believed that a well-regulated paper currency could be more beneficial than hard specie because it could be expanded to meet the needs of a growing economy, as long as it remained tied to the real wealth of the nation. So the conclusion that he wanted to abolish money does not follow from his actual views, because he saw money as a vital engine for economic development, not as an illusion to be dispensed with.

  Regarding the South Sea Bubble, Berkeley did criticize the frenzy of speculation that characterized that event, but he blamed it on people treating speculative promises as if they were solid wealth, not on the metaphysical status of unperceived notes. His critique was that investors were chasing shadows of profit rather than engaging in productive industry, which aligns with his view that true wealth comes from labor and land, not from financial engineering. The summary you read takes this valid economic criticism and dresses it up in metaphysical language to make it sound like Berkeley was attacking the very nature of credit based on his theory of perception. In reality, he was attacking bad economic policy and greed, not the ontology of paper. It is understandable why the article would mix these things, as it makes for a neat narrative to say the man who said trees don't exist without observers also said money doesn't exist without observers, but it does a disservice to his actual thought. You should feel confident dismissing the idea that he wanted to return to barter or that he thought banknotes literally vanished in the dark, as those claims turn his pragmatic economic advice into a metaphysical puzzle he was never trying to solve.
