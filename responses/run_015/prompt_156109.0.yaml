answer: |-
  **Project Title:** Beyond Imitation: Contrastive Calibration in Plutarch's *Parallel Lives*

  **Project Summary**
  Contemporary exemplarist moral psychology operates on a tacit assumption: that biographical learning functions through admiration and imitation. On this view, a life offers a template; the moral agent identifies a virtuous exemplar, admires the pattern, and attempts to reproduce it. Critics rightly note the difficulties of this model, questioning whether admiration yields knowledge or whether circumstances allow for imitation. However, both sides share the premise that the biographical subject is presented as a singular object of emulation. This project challenges that premise by examining the genre that ostensibly founded the Western tradition of life-writing: Plutarch's *Parallel Lives*. Plutarch does not offer singular lives but paired narratives culminating in an explicit comparison (*synkrisis*). He privileges incidental details over public deeds, claiming these reveal character where battles do not. This structure suggests a mechanism of moral learning distinct from imitation: *contrastive calibration*. Here, the reader does not copy a template but learns to weigh traits by holding two lives against one another, using the friction between them to calibrate moral judgment rather than to replicate action.

  **The Research Question**
  Does the formal structure of Plutarch's *Parallel Lives*—specifically the juxtaposition of paired narratives culminating in explicit *synkrisis*—instantiate a mode of moral learning functionally distinct from the admiration-and-imitation model dominant in contemporary exemplarist ethics?

  The standard framing leaves this question open because it treats the *Lives* as a repository of isolated heroes rather than a structured pedagogical system. If one reads only *Alexander* without *Caesar*, the imitation model holds. If one reads the pair and the *synkrisis* as integral, the imitation model strains. This project asks whether the *synkrisis* is merely a summary judgment or the primary site of moral work. If the latter, the moral lesson lies not in the verdict (who was greater) but in the process of weighing (how traits interact with context).

  **Methodology and Timeline**
  This project is delimited to a textual-philosophical analysis of three specific pairs: *Alexander/Caesar*, *Demosthenes/Cicero*, and *Lycurgus/Numa*. These pairs offer variance in subject matter (military, oratorical, legislative) while maintaining the structural constant of the *synkrisis*.

  *Months 1–3: Structural Mapping.*
  Close reading of the selected pairs to catalogue the "incidental details" Plutarch cites as character-revealing. I will code these details not for their virtuous content, but for their *contrastive function*. Does a specific anecdote about Alexander gain its moral valence only when read against the corresponding anecdote about Caesar? The output will be a taxonomy of contrastive markers (e.g., timing, motivation, emotional response) that do not function as standalone imitable acts.

  *Months 4–6: Testing the Calibration Model.*
  I will analyze the *synkrisis* of each pair to determine if the argumentation relies on absolute ranking or contextual weighting. I will test the calibration model by asking: Does Plutarch identify a trait as virtuous in one subject and vicious in the other, or does he show how the same trait yields different moral values in different contexts? If the text shows that the *same* trait (e.g., ambition) is calibrated differently depending on the political ecosystem, the calibration model is supported. If the text simply ranks one subject as "good" and the other "bad," the imitation model remains viable.

  *Months 7–9: The Verdict Branch Point.*
  This phase confronts the primary objection: Plutarch often declares a winner. I will treat this not as a settled fact but as a live branch point. I will analyze whether the verdict functions as a closure of inquiry (supporting imitation of the winner) or as a provisional conclusion to a weighing exercise (supporting calibration). I will look for textual markers where Plutarch qualifies his verdict or admits the closeness of the match. If the verdict is absolute and unqualified, the calibration reading fails for that pair. If the verdict is presented as the result of a complex weighing that the reader is invited to audit, the calibration reading holds.

  *Months 10–12: Synthesis and Drafting.*
  Integration of findings into a dissertation chapter and a standalone article. The argument will be refined to specify the conditions under which calibration supersedes imitation.

  **Success and Failure Conditions**
  A positive result will demonstrate that the *synkrisis* requires the reader to engage in a comparative weighing process that yields moral knowledge (a sense of proportion, context, and trade-off) that cannot be derived from reading a single life in isolation. The "lesson" is the ability to calibrate, not the specific action to imitate.

  The project fails if the *synkrisis* proves to be merely rhetorical ornamentation that does not alter the moral content of the lives, or if the verdicts are so absolute that they render the comparison moot (i.e., if Plutarch simply says "A is virtuous, B is not," without nuanced weighing).

  **Likeliest Failure Mode**
  The most probable failure is inconsistency. Plutarch wrote over decades; the *synkrisis* may not be a unified pedagogical tool but a shifting convention. I may find that two pairs support calibration while the third reverts to simple ranking. In this event, the scope will be cut to argue for a *developmental* or *contextual* calibration model rather than a universal one. The dissertation chapter would then focus on the pairs where the mechanism holds, framing the *Lives* not as a monolithic system but as a laboratory where Plutarch experiments with contrastive moral reasoning.

  **Scope and Feasibility**
  Limiting the analysis to three pairs is necessary for a one-year fellowship. A comprehensive study of all extant pairs would require monograph-length time. By restricting the corpus, I ensure a deep structural analysis rather than a broad survey. This project does not require new textual emendation or reception history; it requires a philosophical re-reading of existing text through the lens of moral psychology. The risk is manageable, and the payoff is a correction to how both classicists and ethicists understand the function of biographical exemplarity.
