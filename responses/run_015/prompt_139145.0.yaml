  Here is the breakdown of her logic, the fix for your classification scheme, the prediction for your twin-minds case, and the specific test case to run on Sunday.

  ### 1. The Three Rules Behind Her Verdicts

  She is operating with three distinct principles of individuation, switching between them depending on the category of object being discussed.

  **Rule 1: Spatio-Physical Tokenism (The "Hardware" Rule)**
  *   **The Principle:** Distinct physical substrates or spatio-temporal locations constitute distinct individuals, even if their qualitative properties are identical.
  *   **Fits:** The Two Coins (different pockets), The Two Clones (different bodies), The Two Processes (different machines), The Two Spheres (distance apart).
