      *   **Specific Twist:** Treat Angier's copies as a *dynamic temporal sequence* (inheriting properties, then diverging), analogous to Black's spheres exchanging properties. Treat Borden's twins as occupying the *same spatiotemporal trajectory* (shared life), distinguished only by hidden internal states (haecceity).
