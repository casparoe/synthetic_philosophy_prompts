  5.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I quote dialogue? *Correction:* Ensure no direct quotes. Use paraphrasing.
      *   *Check:* Did I address the "dynamic temporal sequence" for Angier? *Correction:* Make sure to emphasize that the new Angier *is* the old Angier qualitatively, just later in time, but the old one doesn't cease to exist immediately in a way that matters to the consciousness.
