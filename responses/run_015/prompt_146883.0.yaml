  6.  **Final Polish:** Check tone (academic but engaging), flow, and ensure all specific prompt requirements (scenes, specific philosophical concepts) are met. (e.g., ensure "haecceity" is mentioned regarding Borden).

  *(Self-Correction on Borden's internal state)*: The prompt specifies Fallon's attachment vs. Alfred's detachment. I need to make sure I stick to that specific interpretation of their internal difference, even if the film is slightly ambiguous about which twin is which. I will treat the "internal mental life" as the differentiator that Leibniz struggles with because it lacks causal power until the end.

  *(Self-Correction on Angier)*: The prompt asks to treat the copies as inheriting features then diverging. I need to make sure I don't just say "they are clones." I need to say "they are numerically distinct but qualitatively identical at the moment of genesis, like Black's spheres."

