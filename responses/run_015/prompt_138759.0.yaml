  *(Self-Correction on Case 2 "Contented Patient"):* This is the hardest one. Dworkin says Past Self wins. Dresser says Present Self wins. A requirements doc needs a tie-breaker. The tie-breaker is usually "Critical Interest vs. Experiential Interest." I will formulate a requirement that distinguishes *survival* decisions from *comfort* decisions.

  *(Self-Correction on Case 8 "The Stack"):* This is a logical paradox. The requirement must be "No Infinite Regress." The system must define a base layer of competence that cannot be waived.

  *(Self-Correction on Observability):* I need to be clear: Demanding observability *is* a corruption of pure theory, but a *necessary* corruption for engineering. I will label it a "Implementation Constraint" rather than a "Normative Desideratum."

  Let's assemble the document.

  *Plan:*
  1.  **Title:** Normative Authority Protocol (NAP) v1.0
  2.  **Requirements R1-R5.**
  3.  **Case Analysis.**
  4.  **Constraints (Observability/Asymmetry).**
