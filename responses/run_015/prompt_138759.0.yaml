  *   *Candidate:* Case 6 (Last-writer-wins).
  *   *Candidate:* Case 9 (Lease/Renewal).
  *   *Candidate:* Case 1 (Baseline) - is it a prejudice that this *must* be the outcome? Most say yes, but some philosophers disagree. I will treat it as a fixed constraint per user instruction ("any theory that cannot deliver this verdict is disqualified").

  Okay, ready to write.
answer: |-
  # System Specification: Normative Authority Protocol (NAP)
  **Version:** 1.0 (Normative Core)
  **Subject:** Authority of Anticipatory Instructions over Future Incapacitated Selves
  **Constraint:** Bedside implementability, defensible to review board.

  ---

  ## 1. Core Normative Requirements
  *Each requirement consists of the Normative Statement, the Motivating Case, the Exclusion (what theory this rules out), the Status, and the Observable Proxy.*

  ### R1: Competence at Execution (The Validity Floor)
  *   **Statement:** An instruction possesses potential authority only if the Author possessed decision-making capacity at the time of issuance, defined as the ability to understand, appreciate, reason, and express a choice regarding the specific future scenario.
  *   **Motivation:** *The Depressed Author (Case 4).* Prevents transient pathology from permanently binding the future self. Ensures the "Past Self" was a moral agent.
  *   **Excludes:** Theories that grant authority to wishes formed under coercion, delusion, or temporary cognitive impairment.
  *   **Status:** **Non-negotiable.**
  *   **Observable Proxy:** Timestamped capacity assessment by a clinician at the time of signing, or a "cooling-off period" log showing the document was accessible for review over $X$ days prior to signing.

  ### R2: Epistemic Matching (The Drift Constraint)
  *   **Statement:** An instruction loses authority if the factual premises underlying the instruction have changed materially such that the Author's stated values would likely yield a different output given new information.
  *   **Motivation:** *Drift (Case 5).* Prevents a refusal of "machines" (ventilators) from blocking a "tablet" (manageable chronic care) if the Author's goal was avoiding burden/suffering, not avoiding the specific object.
  *   **Excludes:** Strict Literalism (textualism) that ignores the intent/value behind the text.
  *   **Status:** **Non-negotiable.**
  *   **Observable Proxy:** A "Context Field" in the document schema where the Author must tag the *reason* for the refusal (e.g., "fear of pain" vs. "fear of cost" vs. "religious objection"). If the medical reality no longer triggers the tagged reason, the instruction flags for review.

  ### R3: The Suffering Veto (The Contentment Override)
  *   **Statement:** An instruction to withhold life-sustaining treatment may be overridden if the Subject is demonstrably content and experiences no net suffering, provided the treatment burden is low. An instruction to *demand* treatment cannot be overridden by Subject contentment.
  *   **Motivation:** *The Contented Patient (Case 2).* Resolves the conflict between "Critical Interests" (Past Self's narrative) and "Experiential Interests" (Present Self's feelings). Prioritizes preventing harm (killing a happy being) over fulfilling abstract autonomy.
  *   **Excludes:** Theories that grant the Past Self absolute power to end the life of a contented Present Self (Strict Precedent Autonomy).
  *   **Status:** **Preference (Dworkin vs. Dresser compromise).**
  *   **Observable Proxy:** Standardized behavioral pain/agitation scales (e.g., PAINAD) showing low scores over a 72-hour window, combined with clinician attestation of "apparent contentment."

  ### R4: Verifiable Triggers (The Anti-Self-Sealing Rule)
  *   **Statement:** A trigger condition must be verifiable by a third party without relying on the testimony of the party who benefits from the trigger's activation.
  *   **Motivation:** *The Self-Sealing Trigger (Case 7).* Prevents logical loops where "I am not myself" is defined by "I say I am not myself," which creates epistemic chaos at the bedside.
  *   **Excludes:** Directives based on purely subjective internal states (e.g., "If I feel like a burden").
  *   **Status:** **Non-negotiable.**
  *   **Observable Proxy:** Trigger conditions mapped to ICD-10 codes or MMSE/MoCA score thresholds, rather than narrative descriptions.

  ### R5: The Third-Party Constraint (The Resource Boundary)
  *   **Statement:** Authority terminates where the instruction imposes unreasonable physical risk, moral distress, or financial ruin on identified caregivers or clinicians, absent specific prior compensation or agreement.
  *   **Motivation:** *Third-Party Effects (Case 11).* Autonomy is not a right to commandeer the labor or conscience of others.
  *   **Excludes:** Theories of absolute self-ownership that ignore relational costs.
  *   **Status:** **Non-negotiable.**
  *   **Observable Proxy:** A "Caregiver Impact" flag. If the directive requires 24/7 home care without funded support, it defaults to "Best Interest" standard rather than "Substituted Judgment."

  ---

  ## 2. Evaluation of User's Load-Bearing Cases

  Your list is robust. Here is the assessment of their utility and potential confusion.

  *   **1. The Baseline:** **Genuine Desideratum.** This is the anchor. If a theory fails here, it is not a theory of advance directives; it is a theory of current consent.
  *   **2. The Contented Patient:** **Genuine Desideratum.** This is the hardest philosophical problem (Dworkin vs. Dresser). It forces the system to choose between "narrative integrity" and "current welfare."
  *   **3. The Ulysses Case:** **Genuine Desideratum.** Tests the definition of competence. Essential for psychiatric contexts.
  *   **4. The Depressed Author:** **Genuine Desideratum.** Tests R1 (Competence at Execution).
  *   **5. Drift:** **Genuine Desideratum.** Tests R2 (Epistemic Matching). Crucial for long-term storage systems.
  *   **6. The Corpus:** **Prejudice Alert.** You frame this as "Last-writer-wins vs. Best Evidence." *Last-writer-wins is a prejudice.* In dementia cases, the *earlier* writer is often the *more* competent one. A theory should prefer the document created at the highest level of capacity, not the most recent.
  *   **7. The Self-Sealing Trigger:** **Genuine Desideratum.** Tests R4 (Verifiability). Essential for system logic.
  *   **8. The Stack:** **Confused.** This is a logical paradox, not a normative case. A system cannot allow infinite recursion. The requirement is simply "Base Layer Competence cannot be waived." (See R1).
  *   **9. The Gate:** **Preference.** Expiration dates are administrative, not normative. However, they serve as a proxy for R2 (Epistemic Matching).
  *   **10. Granularity:** **Genuine Desideratum.** Competence is decision-specific. A theory must support scoped authority.
  *   **11. Third-Party Effects:** **Genuine Desideratum.** Tests R5. Often ignored in philosophy, critical in implementation.

  **Missing Cases:**
  *   **The Surrogate Conflict:** The Proxy (family) disagrees with the Directive. (Tests whether the document is a *command* or *evidence*).
  *   **The Technological Miracle:** A cure exists now that was science fiction when the directive was written. (Stronger version of Drift).

  ---

  ## 3. Constraints: Observability and Error Asymmetry

  ### Observability
  *   **Verdict:** Demanding observability is a **corruption of the theory for administrative convenience**, but it is a **non-negotiable engineering constraint**.
  *   **Reasoning:** Normatively, what matters is the *truth* of the patient's will. Practically, we can only access *evidence* of the will.
  *   **Implementation:** Your system must distinguish between the `NormativeStatus` (True/False) and the `VerificationStatus` (Verified/Unverified/Contested). When `VerificationStatus` is low, the system must default to the Error Asymmetry rule.

  ### Error Asymmetry
  *   **Verdict:** This is a **separate moral input**, not part of the theory of authority.
  *   **Recommendation:** In cases of silence or ambiguity, the default must be **Preservation of Life and Liberty**.
  *   **Reasoning:** It is morally easier to justify stopping a treatment later (based on new evidence) than to justify having allowed a death based on ambiguous data. The cost of a False Positive (treating someone who wanted to die) is usually lower than a False Negative (killing someone who wanted to live) in the eyes of the law and most ethical review boards.
  *   **System Rule:** `IF Ambiguity == True THEN Action = Preserve`.

  ---

  ## 4. Prejudices and Unsatisfiable Sets

  ### Widespread Prejudices (Not Genuine Desiderata)
  1.  **"The Most Recent Document Wins" (Case 6):** As noted, recency does not equal competence. In neurodegenerative disease, the oldest valid document often represents the "Truest Self."
  2.  **"Literal Compliance is Safest" (Case 5):** Following the text when the context has drifted is legally safe but normatively wrong. It abdicates the clinician's duty to interpret intent.
  3.  **"Autonomy is Absolute" (Case 11):** Patients often believe they can demand futile care or commandeer family resources. They cannot.

  ### The Unsatisfiable Set
  You cannot simultaneously satisfy these three requirements:
  1.  **Absolute Precedent Autonomy** (Past Self always binds).
  2.  **Current Well-Being Protection** (Present Self cannot be made to suffer unnecessarily).
  3.  **Perfect Observability** (We can always know which one applies).

  *Resolution:* You must sacrifice #1 in favor of #2 when #3 is ambiguous. (See *The Contented Patient*).

  ### The Workhorse Requirement
  **R2: Epistemic Matching (The Drift Constraint).**
  This requirement does the most work. It excludes strict textualism, it handles technological change, it resolves the "Corpus" conflict (by asking which document matches current reality best), and it limits the "Self-Sealing Trigger" (by requiring external verification of the condition). If you implement R2 robustly, 60% of the edge cases resolve automatically.

  ---

  ## 5. Evaluation of the Four Positions

  You described four rough positions. Here is how they score against the Requirements above.

  1.  **The Binding Choice (Precedent Autonomy):**
      *   *View:* Competent choices bind full stop.
      *   *Failure:* Fails **R3 (Suffering Veto)**. It mandates death for the contented dementia patient. It also struggles with **R2 (Drift)** because it treats the text as sacred rather than the intent.
  2.  **The Current Interest (Experientialism):**
      *   *View:* Only the person in the bed matters.
      *   *Failure:* Fails **R1 (Baseline)**. It renders all advance directives advisory only. It makes the "Ulysses Contract" (Case 3) impossible, as the manic self's current desire overrides the sober self's plan.
  3.  **The Enduring Values (Value-Based):**
      *   *View:* Bind the values, not the specific instructions.
      *   *Failure:* Fails **Observability**. "Values" are hard to encode and harder to verify at the bedside. It creates high liability for clinicians interpreting "what they would have wanted." It struggles with **Case 6 (Corpus)**: which document represents the "true" values?
  4.  **The Authorship (Narrative):**
      *   *View:* The earlier self authors the life story.
      *   *Failure:* Fails **R5 (Third-Party)**. One cannot author a story that requires others to ruin their lives to complete the plot. It also risks ignoring the *reality* of the present subject (Case 2).

  **Missing Position:** **The Hybrid Threshold Model.**
  This is the position implied by the Requirements above. It holds that Precedent Autonomy is the default *until* it conflicts with Current Well-Being or Third-Party Harm. It treats the directive as a *presumption* of authority, not an absolute command. This is the only position that satisfies the "Bedside Implementability" constraint while respecting the "Baseline" case.

  ---

  ## 6. Summary Scoring Table

  | Requirement / Position | Binding Choice | Current Interest | Enduring Values | Authorship | **Hybrid Threshold (Recommended)** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **R1: Competence at Execution** | Pass | Pass | Pass | Pass | **Pass** |
  | **R2: Epistemic Matching (Drift)** | Fail | Pass | Pass | Fail | **Pass** |
  | **R3: Suffering Veto (Contented)** | **Fail** | Pass | Pass | Fail | **Pass** |
  | **R4: Verifiable Triggers** | Pass | Pass | Fail | Fail | **Pass** |
  | **R5: Third-Party Constraint** | Fail | Pass | Fail | **Fail** | **Pass** |
  | **Observable at Bedside** | High | High | Low | Low | **High** |
  | **Defensible to Family** | High | Low | Low | Medium | **High** |

  **Final Recommendation:** Adopt the **Hybrid Threshold Model**. Encode R1 and R4 as hard system constraints (validation rules). Encode R2, R3, and R5 as decision-support flags that alert the clinician to override the directive, requiring a specific "Override Justification" code in the audit log. This satisfies the need for authority while building in the necessary safety valves for the messy reality of clinical care.
