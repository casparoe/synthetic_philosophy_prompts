      *Self-Correction on "Causal Coherence":* The user asks if demanding coherence is a surrender. I need to be clear. If coherence means "identity," it's a surrender. If it means "nomological correlation," it's a desideratum. I will argue for the latter.

      *Self-Correction on "Subject/Character":* The user asks if they can be separated. I will argue **No**. This is a strong philosophical claim (The Inseparability Thesis).

      *Refining the User's Candidate:* The user proposes a "primitive phenomenal-unity relation." My desiderata should test this. Does it satisfy Causal Coherence? Only if stipulated to track it. Does it satisfy Determinacy? Only if the relation is binary.

      *Final check on Satisfiability:* I will claim the list is **Jointly Satisfiable**, but only at the cost of accepting **Brute Phenomenal Laws**. This is the "price of admission."

