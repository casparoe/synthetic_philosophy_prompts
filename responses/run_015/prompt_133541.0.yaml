  7.  **Drafting the Content (Iterative refinement for tone and precision):**

      *   *Tone:* Academic, rigorous, decisive, slightly provocative (as requested: "Take a definite line").
      *   *Structure:*
          1.  Philosophical Stance (The "Preamble").
          2.  The Desiderata List.
          3.  Meta-Analysis (Killer, Sacrifice, Satisfiability).
