  2.  **Determine the AI's Stance (Taking a Definite Line):**

      *   *Collapse Problem:* Does any criterion collapse into "all compose" or "none compose"? *Stance:* No, but it requires rejecting the assumption that phenomenal unity must mirror causal integration perfectly. If you demand perfect mirroring, you collapse into physicalism or eliminativism. If you demand total independence, you get magical bonding. The middle path is a *structural isomorphism* constraint, not identity.
      *   *Iteration:* Does combination iterate? *Stance:* Yes, but it must be *bounded*. If it iterates infinitely, you get cosmopsychism (which the user seems to want to avoid in favor of constitutive micropsychism). There must be a "maximality" condition (as the user suggested).
      *   *Causal Integration:* Is coherence with causal integration a surrender? *Stance:* It is a *constraint*, not a surrender. If phenomenal unity floats completely free of causal unity, the view becomes epiphenomenalist or occult. However, it cannot be *reduced* to it.
      *   *Subject vs. Character:* Can they be separated? *Stance:* No. You cannot have a subject without a character, and you cannot have a combined character without a subject to hold it. They are two sides of the same coin (The Subject-Character Inseparability).
      *   *Joint Satisfiability:* Is the list satisfiable? *Stance:* This is the crucial risk. Many philosophers (e.g., Goff, Roelofs) argue the "Combination Problem" is unsolvable. *Stance:* I must take a risk. I will argue it is *barely* satisfiable, but only if one accepts a primitive unity relation that is *constrained* by causal structure but not *defined* by it. If one demands reductive explanation of the unity relation, it becomes unsatisfiable.

  3.  **Drafting the Desiderata:**

      *   *Requirement 1: Determinacy.* (Motivation: The Extension Thesis needs a fact of the matter. No vagueness about existence.) -> Non-negotiable.
      *   *Requirement 2: Maximality/Non-Overlap.* (Motivation: Avoid double-counting subjects. A neuron shouldn't belong to two distinct conscious beings simultaneously in the same respect.) -> Non-negotiable.
      *   *Requirement 3: Structural Constraint (Causal Coherence).* (Motivation: Avoid magic. Phenomenal unity shouldn't wildly diverge from causal integration, or it loses explanatory power.) -> Non-negotiable (but nuanced).
      *   *Requirement 4: Character Derivation.* (Motivation: It's not enough to say a subject exists; we need to know *what it's like*. The macro-experience must be a function of micro-experiences.) -> Non-negotiable.
      *   *Requirement 5: Non-Reductive Primitivity.* (Motivation: Avoid the collapse into physicalism. The unity relation cannot be fully analyzed in causal/functional terms.) -> Preference (Constitutive Camp).

