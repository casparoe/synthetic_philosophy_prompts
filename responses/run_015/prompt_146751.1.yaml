      *   *Section 1: The Implicit Theory.* Identify it as a tension between Westphalian positivism and Natural Law universalism. Contrast with Kant's "Public Right."
      *   *Section 2: Kantian vs. Pluralist.* Argue it is *not* strictly Kantian because Kant ties sovereignty to internal justice. It's more of a modus vivendi.
