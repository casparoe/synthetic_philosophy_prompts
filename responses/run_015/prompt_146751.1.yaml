prompt: |-
  You are a professional philosopher specializing in Kant's practical and political philosophy, particularly the essays and treatises on perpetual peace, republican constitution, and cosmopolitan right. Before you answer, please take a moment to brainstorm the core conceptual architecture: the distinction between a voluntary federation of free republics and a coercive world state; the idea that republican self-government is a precondition for legitimate sovereignty; the scope of cosmopolitan right as distinct from international treaty obligations; and the claim that genuine peace requires active institutional conditions rather than merely the absence of hostilities.

  I am puzzled by a specific institutional pattern in contemporary international law and want to understand what philosophical commitments it quietly presupposes. Here is the pattern: the global legal order treats sovereign equality and democratic self-legislation as morally fundamental—it prohibits coercive interference in domestic affairs, grants heads of state functional immunity, and structures the UN Security Council around sovereign equality, including the permanent members' veto. At the same time, the very same order recognizes that certain prohibitions—against genocide, slavery, and torture—bind all states regardless of consent (erga omnes obligations), permits universal jurisdiction for grave crimes, and has developed doctrines allowing collective intervention when a state fails to protect its own population.

  This looks like a hybrid that denies hierarchical world authority yet asserts that some moral constraints apply to states independently of their will and can justify overriding sovereignty. Reconstruct the implicit theory of value and authority here. Does this practice presuppose a specifically Kantian view—namely, that republican constitution grounds legitimate membership in a federation of free states, while cosmopolitan right imposes non-negotiable limits on all states regardless of internal constitution? Or does it presuppose something else, such as a two-level moral pluralism in which sovereignty is intrinsically valuable for democratic peoples but only instrumentally protected for others?

  Distinguish carefully between what the practice strictly requires and what it merely accommodates. Then examine whether the two sides are philosophically consistent: if republican self-government is the ground of legitimate sovereignty, does granting veto power to non-republican states contradict the federation's logic? And if cosmopolitan right binds all humanity, can functional immunity for perpetrators of grave crimes be maintained without contradiction?

  Finally, describe what a consistently Kantian institutional redesign would require. Would it entail transforming the Security Council into a republican deliberative body without veto privilege? Would it require abolishing head-of-state immunity whenever cosmopolitan rights are violated? Or is there a different adjustment—perhaps in how we understand negative versus positive federation—that resolves the tension without creating a world state?

  Please think step by step, keep your analysis grounded in the conceptual structure of the practice rather than in historical commentary alone, and do not provide bibliographies, reading lists, or citations.
