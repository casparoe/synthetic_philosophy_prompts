      *   *Federation:* Must be a *foedus pacificum*.
      *   *Membership:* Conditional on Republicanism. A "Congress of Democrats" rather than a "United Nations of Regimes."
      *   *Veto:* Abolished. Decisions based on public right, not national interest.
      *   *Immunity:* Abolished for crimes against humanity (violations of cosmopolitan right).
      *   *Enforcement:* Not a global police, but collective sanction by the federation against outliers.
      *   *Nuance:* Kant distinguishes between *negative* substitution (stopping war) and *positive* establishment (justice). The redesign needs to move from negative peace to positive right without becoming a leviathan.

  8.  **Drafting the Response (Iterative refinement):**
