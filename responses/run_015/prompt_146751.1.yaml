      *   *Accommodation:* It *accommodates* non-democratic states via the veto and immunity to ensure their participation (pragmatism). It *accommodates* impunity in the short term to preserve diplomatic channels.
      *   *Kantian Critique:* Accommodating tyranny contradicts the "First Definitive Article."

  6.  **Examining Consistency (Question 4):**
      *   *Veto for Non-Republics:* Inconsistent with Kant. If legitimacy comes from the republican constitution, a despot represents no one but themselves. Giving them a veto over peace treats might-as-right.
      *   *Immunity for Atrocity:* Inconsistent with Cosmopolitan Right. If humans have rights by virtue of reason (not citizenship), violating them places the actor outside the protection of official capacity. Kant's idea of "public right" demands that injustice be visible and punishable.

  7.  **Kantian Institutional Redesign (Question 5):**
