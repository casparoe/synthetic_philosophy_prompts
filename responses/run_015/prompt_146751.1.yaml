      *   Use *foedus pacificum* (pacific federation) vs. *civitas gentium* (world state).
      *   Reference the "Transcendental Formula of Public Right."
      *   Clarify "Cosmopolitan Right" (visit/commerce) vs. "Human Rights" (modern usage). Kant's cosmopolitan right is narrower but grounded in common possession of the earth.

  10. **Final Review against Constraints:**
      *   Did I cite books? No.
      *   Did I provide a reading list? No.
