          1.  Civil Constitution of every state shall be republican.
          2.  Right of Nations shall be based on a federation of free states (not a world state).
          3.  Cosmopolitan Right shall be limited to conditions of universal hospitality.
      *   *Key Distinction:* Federation of Peace (*foedus pacificum*) vs. State of Nations (*civitas gentium*). Kant rejects the latter as a "soulless despotism."
      *   *Legitimacy:* Derived from the original contract within the state (republicanism). External legitimacy depends on internal legitimacy.
      *   *Cosmopolitan Right:* Not moral charity, but a right of visitation and non-harmful interaction. It binds states regarding *foreigners*, but Kant also implies a universal standard of right (*Recht*).

  4.  **Analyzing the Implicit Theory (Question 1 & 2):**
      *   *Is it Kantian?* Partially. It mirrors the tension between the Federation (sovereign equality) and Cosmopolitan Right (universal bounds).
      *   *Difference:* Kant grounds sovereignty *strictly* in republicanism. Contemporary law grants sovereignty to *de facto* controllers regardless of regime type (Westphalian).
      *   *Alternative:* It looks more like a "pluralist universalism." Sovereignty is a procedural shield for order, but human rights are substantive shields for individuals.
      *   *Kantian View:* Sovereignty isn't intrinsically valuable; it's valuable *because* it instantiates freedom via law. A tyrannical state has no moral claim to non-interference in Kant's strict view (though he warns against revolution/external imposition for prudential reasons).

  5.  **Distinguishing Requirements vs. Accommodations (Question 3):**
