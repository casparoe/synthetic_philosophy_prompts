answer: |-
  To analyze the institutional pattern you describe, we must first establish the Kantian conceptual architecture regarding public right. Kant's political philosophy rests on three pillars: the **Republican Constitution** (internal legitimacy), the **Federation of Free States** (external legitimacy), and **Cosmopolitan Right** (transnational legitimacy).

  For Kant, sovereignty is not a brute fact of power but a juridical status derived from the "original contract" within a state. A state is only a legitimate moral person if its constitution is republican—meaning it separates the executive from the legislative and represents the general will of the people. Externally, these legitimate states form a *foedus pacificum* (pacific federation). Crucially, this is distinct from a *civitas gentium* (world state). Kant rejects a world state because he fears it would become a soulless despotism lacking the proximity required for lawful freedom. Finally, Cosmopolitan Right is not a matter of benevolence but of strict right (*Recht*); it grounds the claim of every human being, by virtue of their common possession of the earth, not to be treated with hostility when seeking interaction.

  With this framework in mind, let us reconstruct the implicit theory of value in the contemporary hybrid order you describe.

  ### 1. Reconstructing the Implicit Theory of Value and Authority

  The contemporary pattern you identify—a tension between sovereign immunity and universal jurisdiction—presupposes a **dualistic theory of authority**. It operates on two distinct levels that are not fully integrated:

  1.  **The Procedural Level (Westphalian):** Authority is derived from effective control and recognition. Sovereignty is treated as a functional necessity for order. On this level, the value is *stability*. The state is a black box; its internal moral quality is secondary to its existence as a unit of order. This justifies non-interference and head-of-state immunity.
  2.  **The Substantive Level (Universalist):** Authority is derived from adherence to fundamental moral norms. Certain acts (genocide, torture) are deemed *malum in se* (wrong in themselves). On this level, the value is *justice*. The state is transparent; its internal actions are subject to external judgment. This justifies *erga omnes* obligations and universal jurisdiction.

  **Is this Kantian?**
  Strictly speaking, **no**. This hybrid is not a Kantian system; it is a **modus vivendi between Legal Positivism and Natural Law**.

  *   **Why it diverges from Kant:** In Kant's system, there is no dualism between procedural sovereignty and substantive justice. Sovereignty *is* legitimate only insofar as it instantiates republican right. A tyrannical state, for Kant, is in a state of legal deficiency. While Kant advises against external revolution (to preserve the condition of law), he does not grant tyrannical regimes the same moral standing as republics in a federation. The contemporary order, by granting veto power and immunity to non-republican regimes, treats sovereignty as intrinsic to the *state apparatus* rather than derivative of the *people's freedom*.
  *   **The Alternative:** The practice presupposes a **two-level moral pluralism**. It assumes sovereignty is intrinsically valuable for maintaining international order (preventing anarchy), but only instrumentally valuable for protecting human dignity. When the instrument fails (the state attacks its people), the intrinsic value of sovereignty is suspended. This is pragmatic, but it lacks the unitary ground of Public Right that Kant demands.

  ### 2. Requirements vs. Accommodations

  To judge the consistency of this practice, we must distinguish what the legal order *requires* to function as a system of law versus what it *accommodates* for political feasibility.

  *   **What the Practice Requires:**
      *   **Subjects of Law:** It requires entities capable of bearing obligations (states).
      *   **Universal Norms:** It requires a baseline of shared norms to define "crime" versus "war." Without *erga omnes* obligations, international law collapses into mere diplomacy.
      *   **Enforcement Mechanism:** It requires some capacity to sanction violators, otherwise the norms are merely advisory.

  *   **What the Practice Accommodates:**
      *   **Regime Type:** It accommodates non-democratic states by granting them equal sovereignty. It treats the *state* as the primary unit, not the *citizenry*.
      *   **Impunity:** It accommodates perpetrators through functional immunity, prioritizing diplomatic stability over immediate retributive justice.
      *   **Great Power Privilege:** It accommodates power asymmetries through the veto, acknowledging that a legal order cannot survive if major powers actively oppose it.

  **The Philosophical Tension:**
  The tension arises because the *accommodations* undermine the *requirements*. If the system requires universal norms to be "law," but accommodates violations of those norms via immunity, it creates a performative contradiction. It claims to be a legal order based on right, but operates partially as a power-based order based on force.

  ### 3. Examining Philosophical Consistency

  Let us apply the Kantian lens to the two specific inconsistencies you raised.

  **A. The Veto and Non-Republican States**
  *   *The Conflict:* If republican self-government is the ground of legitimate sovereignty (Kant's First Definitive Article), then a non-republican state does not possess full moral standing in the federation. Its "will" is not a general will but a private will disguised as public.
  *   *The Contradiction:* Granting a veto to a non-republican state allows a private will to obstruct public right. In Kantian terms, this violates the **Transcendental Formula of Public Right**: "All actions relating to the right of other men are unjust if their maxim is not consistent with publicity." A veto based on national interest (private maxim) cannot be publicly affirmed as a universal law of peace.
  *   *Verdict:* This is inconsistent with a Kantian federation. It treats the federation as a treaty between rulers rather than a union of peoples.

  **B. Functional Immunity and Cosmopolitan Right**
  *   *The Conflict:* Cosmopolitan Right binds all humanity regardless of internal constitution. It posits that individuals have standing before the world community, not just before their own state.
  *   *The Contradiction:* Functional immunity treats the head of state as identical to the state itself. If that head violates cosmopolitan right (e.g., genocide), they are attacking the very basis of legal personality. To grant them immunity is to allow the violation of right to shield itself using the apparatus of right. It turns sovereignty into a license to violate the conditions of sovereignty.
  *   *Verdict:* This is inconsistent. For Kant, right cannot authorize its own destruction. A violation of fundamental human right places the actor outside the protection of official capacity because they have abandoned the civil condition for a state of nature (lawlessness).

  ### 4. A Consistently Kantian Institutional Redesign

  If we were to redesign these institutions to align with Kant's practical philosophy, we would not move toward a World State (*civitas gentium*), as Kant explicitly warns this leads to despotism. Instead, we would deepen the **Pacific Federation (*foedus pacificum*)**. The goal is to transform the federation from a voluntary treaty into a juridical condition without creating a global sovereign.

  Here is what a Kantian redesign would require:

  **1. Conditional Membership (The Republican Filter)**
  The federation cannot be a "United Nations" of all regimes. Membership must be conditional on the internal constitution being republican.
  *   *Rationale:* Only a republic separates the decision to go to war from the executive will, making peace reliable.
  *   *Institutional Change:* Admission to the core deliberative body requires verification of internal separation of powers and representation. Non-republics may have observer status but no voting rights on matters of coercive enforcement. This resolves the veto contradiction: only those representing a public will can vote on public right.

  **2. Abolition of the Veto in Favor of Public Deliberation**
  The Security Council veto must be abolished or radically constrained.
  *   *Rationale:* The veto institutionalizes the state of nature among great powers. It allows private interest to override public law.
  *   *Institutional Change:* Replace the veto with a qualified majority vote within a deliberative body. Decisions must be justifiable via public reason, not national interest. The "great powers" retain influence through capacity, not juridical privilege.

  **3. Piercing Immunity for Crimes Against Humanity**
  Head-of-state immunity must be removed for violations of cosmopolitan right.
  *   *Rationale:* Cosmopolitan right attaches to the human being, not the office. When an official uses the state to violate the common possession of the earth (e.g., genocide), they act as a private outlaw, not a public representative.
  *   *Institutional Change:* Establish that official capacity is not a defense against charges of violating *jus cogens* norms. This does not require a global police force, but it does require a standing court with jurisdiction triggered by the federation, not just state consent.

  **4. Negative vs. Positive Federation**
  The redesign must navigate the distinction between negative peace (cessation of hostilities) and positive right (establishment of justice).
  *   *Current Flaw:* The current system aims for negative peace (stability) but claims the legitimacy of positive right (human rights).
  *   *Kantian Adjustment:* The federation should not seek to govern the world (positive world state). It should function as a **court of arbitration** with the power to sanction. It enforces the *conditions* of freedom, not a specific conception of the good life.
  *   *Intervention:* Intervention is not permitted for "regime change" (which imposes a constitution, violating self-legislation). It is permitted only to stop violations of cosmopolitan right that threaten the possibility of peace itself (e.g., stopping a genocide that spills over or destroys the legal personhood of a population).

  ### 5. Resolution of the Tension

  Does this resolve the tension without creating a world state? Yes, by shifting the locus of sovereignty.

  In the current hybrid, sovereignty is located in the **territorial state**. This creates the contradiction: the state is both the protector of rights and the potential violator, with no higher appeal.

  In the Kantian redesign, sovereignty is located in the **original contract of the people**, represented externally by the federation. The federation does not rule over the states; it rules over the *relations* between them to ensure they conform to public right.
  *   **No Global Sovereign:** The federation cannot tax, legislate domestic policy, or command armies directly. It sanctions member states that violate the terms of the federation.
  *   **Enforcement:** Enforcement is collective. If a state violates cosmopolitan right, it excludes itself from the federation (outlaw status), and other members are obligated to restrict interaction until compliance is restored.

  **Conclusion**
  The contemporary practice you describe is a pragmatic compromise that lacks philosophical unity. It treats sovereignty as both absolute and conditional, which is logically unstable. A Kantian reconstruction demands that we stop treating states as moral black boxes. It requires a federation where membership is predicated on internal justice, where the veto is replaced by public deliberation, and where immunity yields to the universal claims of cosmopolitan right. This does not create a world government; it creates a **legal condition of peace** where the authority of the state is recognized only insofar as it respects the freedom of its own citizens and the rights of humanity at large.
