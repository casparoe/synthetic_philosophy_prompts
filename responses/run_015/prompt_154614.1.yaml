  The deliverable is a submit-ready journal article. Success looks like a definitive answer to the question: either a defended updating rule that preserves commutativity despite reliability hits, or a proof that no such rule exists within the Bayesian framework. Both outcomes are philosophically valuable. The former offers a new tool for epistemologists; the latter clarifies the boundaries of Bayesian rationality. Success also means maintaining accessibility for generalists, avoiding unnecessary formalism. Failure would look like getting trapped in technical complexities that obscure the philosophical point, or finding the problem is ill-posed due to ambiguous definitions of "experience." Another risk is concluding that commutativity is simply the wrong constraint to impose, which would require reframing the entire project. However, even this negative finding would clarify why path-independence is desirable. I will treat the semester as a strict deadline; if the formal family of rules proves intractable, I will pivot to a purely conceptual critique of the rigidity constraint. This ensures progress regardless of the formal outcome.

  **Scope**
  This project is tight but manageable for one semester. The risk lies in the temptation to over-formalize. By restricting the mathematical heavy-lifting to what is necessary for the philosophical argument, I can avoid scope creep. The focus remains on the normative implications of updating rules, not theorems for their own sake. If the channel-trust parameter proves too complex, I will narrow the scope to a single case study rather than a general family of rules. This ensures a complete paper rather than an unfinished formal model. The leave period provides sufficient time to draft and revise without teaching distractions. I am confident the scope is appropriate overall.
