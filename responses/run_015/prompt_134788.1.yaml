  **JOINT STATEMENT ON THE ONTOLOGY OF THE LEFT–RIGHT DISTINCTION**

  **Preamble**

  We, the undersigned representatives of the Realist and Nominalist positions, acknowledge that the distinction between "left" and "right" constitutes the primary axis of political classification in modern discourse. Whilst we remain divided on the ontological status of this distinction—whether it names a fundamental feature of human social organisation or a contingent artefact of historical institutionalism—we agree that clarity regarding our points of convergence and divergence is necessary for productive inquiry. This document records our adversarial collaboration, outlining agreed premises, specified disagreements, and the empirical cruxes that must be resolved to advance the debate.

  ***

  ### 1. Agreed Claims

  Both parties subscribe to the following propositions regarding the current state of knowledge and the parameters of the dispute:

  1.  **Formal Denotation:** In contemporary comparative politics, the left–right axis generally denotes a two-dimensional space. The economic dimension contrasts state intervention and redistribution (left) against market liberty and private property rights (right). The social dimension contrasts progressive change and universalism (left) against traditionalism, authority, and particularism (right). We agree that these dimensions are often correlated but are analytically distinct.
  2.  **Historical Trajectory:** We agree that the terminology originates in the seating arrangements of the French National Assembly (1789) and that its persistence over two centuries is a phenomenon requiring explanation. We further agree that the salience of the distinction has fluctuated, diminishing during periods of consensus or external threat and intensifying during periods of polarisation.
  3.  **Phenomena Requiring Explanation:** Any adequate theory must account for: (a) the durability of the labels across regime changes and generational turnover; (b) the clustering of disparate policy preferences into stable coalitions (e.g., why views on taxation often predict views on immigration); (c) the occasional rotation or collapse of the axis, notably in post-communist and post-colonial contexts; and (d) the cross-national variability in what specific policies are coded as "left" or "right."
  4.  **Methodological Limits:** We acknowledge that current empirical methods rely heavily on self-reported identification, elite roll-call data, and text analysis of party manifestos. We agree that these methods suffer from endogeneity (parties define the labels they occupy) and context dependence (a "left" position in one era may be "right" in another). Consequently, neither side claims definitive proof that excludes the other's interpretation of the existing data.

  ***

  ### 2. Disagreements Table

  The following table summarises the substantive divergences that remain unresolved. The wording in each column has been approved by the respective party as an accurate representation of their stance.

  | Domain of Dispute | The Realist Position | The Nominalist Position |
  | :--- | :--- | :--- |
  | **Ontological Status** | The left–right distinction maps onto pre-existing, durable features of human psychology and social structure. It is a discovery, not an invention. | The left–right distinction is a linguistic and institutional technology. It is a tool created by actors to coordinate behaviour, not a reflection of deep reality. |
  | **Source of Coherence** | Policy preferences cluster because they stem from underlying moral foundations (e.g., Care/Fairness vs. Authority/Loyalty) and structural interests regarding hierarchy. | Policy preferences cluster because elite coordination and party branding bundle them together. Voters adopt the bundle because of social identity, not inherent logical connection. |
  | **Cross-Cultural Stability** | The axis is universal. While specific policy contents vary, the underlying structural conflict between equality/universalism and hierarchy/particularism is constant across cultures. | The axis is contingent. In some contexts (e.g., post-communist states), the axis rotates or dissolves entirely, proving it is not a universal constant but a specific Western historical export. |
  | **Causal Direction** | Deep-seated psychological and material interests drive the formation of parties and labels. The label follows the substance. | Institutional lock-in and media narratives drive the formation of values. The substance follows the label. |
  | **Resilience** | The distinction persists because it answers to something real. If party systems collapsed, individuals would still sort themselves along similar lines. | The distinction persists due to path dependence. If party systems collapsed, the labels would lose meaning rapidly, as there is no underlying gravity holding them together. |

  ***

  ### 3. The Cruxes

  We identify the following sub-questions as critical. Resolving these empirically would necessitate a significant update to at least one party's position.

  **Crux A: The Normative Weight of Tradition and Nature**
  Does the persistence of the left–right divide rely on the intrinsic normative weight of "natural" social hierarchies and traditional moralities (as the Realist contends), or is the appeal to tradition merely a post-hoc rationalisation used by elites to maintain strategic coalitions (as the Nominalist contends)?
  *   *Resolution Condition:* If it is demonstrated that coalitions based on "natural" hierarchies dissolve immediately when elite signalling stops, the Realist position is weakened. If such coalitions persist despite elite fragmentation, the Nominalist position is weakened.

  **Crux B: Stability of Preference Orderings**
  Can ecological and predictive models of coalition behaviour rely on stable preference orderings across generations? The Realist assumes intergenerational stability of moral psychologies; the Nominalist assumes preference orderings are fluid and responsive to institutional incentives.
  *   *Resolution Condition:* If longitudinal data shows that fundamental preference orderings remain stable despite radical changes in institutional incentives, the Realist position is strengthened. If preference orderings shift rapidly in response to institutional redesign, the Nominalist position is strengthened.

  **Crux C: The Behaviour of Labels Under Systemic Collapse**
  What happens to the left–right identification when the institutional carriers (parties, media) are removed or banned? The Realist predicts the distinction will re-emerge spontaneously among the populace. The Nominalist predicts the distinction will vanish or be replaced by entirely different cleavages (e.g., regional, religious, or clan-based).
  *   *Resolution Condition:* Observation of political behaviour in institutional vacuums or during constitutional refoundings.

  ***

  ### 4. Concrete Cases and Predictions

  For each crux, we specify a concrete case or comparative pattern upon which both sides agree evidence bears. We record our predictions in advance.

  **Case 1: Green-Left Alliances (Nordic vs. Anglo-Saxon)**
  *   *Context:* Comparing environmental-policy coalitions in Nordic social-democratic systems (consensus-based, proportional representation) with Anglo-Saxon liberal democracies (majoritarian, adversarial).
  *   *The Question:* Do green-left alliances hold together because of shared moral-psychological foundations (Care/Fairness) or because of contingent institutional incentives?
  *   **Realist Prediction:** The moral foundation (Care/Fairness) is universal. Therefore, despite institutional differences, the correlation between environmentalism and left-wing economic views will remain strong in both contexts. Institutional variance may affect policy *output*, but not the underlying *coalition structure*.
  *   **Nominalist Prediction:** The alliance is contingent on institutional incentives. In Nordic systems, consensus politics forces broad coalitions, potentially diluting the green-left link. In Anglo-Saxon systems, adversarial politics polarises the issue. We predict that if institutional incentives change (e.g., electoral reform), the composition of the green coalition will shift significantly, decoupling environmentalism from traditional left-wing economics.

  **Case 2: Axis Rotation in Eastern Europe**
  *   *Context:* The economic-cultural alignment in post-communist party systems (e.g., Poland, Hungary, Czechia) compared to Western European systems.
  *   *The Question:* Does the alignment track a universal moral-foundations structure or reflect locally contingent path dependence?
  *   **Realist Prediction:** While labels may be confused, the underlying structure remains. Ex-communist parties may be economically left but culturally authoritarian. However, the *dimensions* themselves (economic equality vs. hierarchy) will still explain the variance. The "rotation" is superficial; the moral foundations (e.g., Loyalty/Authority) will still predict voting behaviour consistently, even if the party label attached to them changes.
  *   **Nominalist Prediction:** The axis rotation is fundamental, not superficial. In post-communist contexts, the "left" label is often associated with nationalist authoritarianism due to the specific history of the transition (ex-communists vs. liberal dissidents). This proves the axis is not universal. We predict that as the generation that experienced the transition dies out, the old left–right labels will lose all predictive power and be replaced by new cleavages unrelated to the original French Revolution spectrum.

  ***

  ### 5. Verbal vs. Substantive Disputes

  We explicitly flag the following area as containing a significant verbal component, though it remains entangled with substantive claims:

  **The Definition of "Real"**
  *   **The Verbal Component:** A portion of our dispute arises from differing definitions of ontological reality. The Realist tends to define "real" as "rooted in human biology or universal psychology." The Nominalist tends to define "real" as "independent of human classification." Since the left–right distinction is inherently a human classification, the Nominalist argues it cannot be "real" in the way a physical force is real, whilst the Realist argues that social constructs rooted in universal psychology are real in a sociological sense.
  *   **Why it Dissolves:** If both parties agree to operationalise "real" strictly as "predictively robust across contexts," the dispute shifts entirely to empirical performance (see Section 4). However, the dispute remains substantive regarding *causality*. Even if both agree the distinction is predictively useful, the Realist insists this utility derives from deep structure, whilst the Nominalist insists it derives from institutional inertia. Therefore, whilst the semantic debate over "realness" can be set aside, the causal disagreement regarding *why* the prediction works remains substantive and unresolved.

