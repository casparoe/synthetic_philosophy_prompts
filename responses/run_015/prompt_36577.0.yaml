  *Decision:* With 90 mins and complex rules, a **Demo Pair** at the front is safer for control. The rest of the group acts as the "Audience/Interrogators." This prevents chaos. I will design it for 1 Demo Pair + Audience, with an option for small groups if they have time. Actually, for *feeling* it, everyone should participate. Let's do 2 rounds of small groups (7 pairs), then debrief. It's more engaging. I need to simplify the instructions so 7 pairs can manage it.
