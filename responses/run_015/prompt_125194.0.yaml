answer: |-
  # Which Solution to Frege's Puzzle Do You Actually Hold?

  **Instructions:** Answer based on your immediate intuitions about the cases. Do not worry about technical labels. Choose the option that best captures *why* there is a difference (or why there isn't).

  **1. The Lab Specimen (Known Identity)**
  A scientist names a specimen 'Alpha' and 'Beta' in a single ceremony, explicitly told they are the same. Years later, she uses both. Is "Alpha is Beta" still informative to her?
  *   (A) Yes, there is a genuine cognitive difference despite known identity.
  *   (B) No, it is trivial; any feeling of difference is psychological habit.
  *   (C) It depends on whether she is actively thinking about the names.

  **2. The Empty Names**
  Neither 'Vulcan' nor 'Hephaestus' refers (both are empty). Is there a difference in cognitive value between "Vulcan is Vulcan" and "Vulcan is Hephaestus"?
  *   (A) Yes, the thoughts differ even without objects.
  *   (B) No, both are equally meaningless or false.
  *   (C) Yes, but only because the names themselves differ.

  **3. The AI Database**
  A database stores data under 'Code-A' and 'Code-B'. It behaves differently when queried with A vs. B, though they map to the same entry. Is there a Fregean difference here?
  *   (A) Yes, cognitive significance does not require a conscious subject.
  *   (B) No, without a mind, there is only syntax, not sense.
  *   (C) Yes, but only in a metaphorical sense.

  **4. Belief Reports (Truth Conditions)**
  Lois believes Superman flies. She does not believe Clark Kent flies. Is the report "Lois believes Clark Kent flies" false?
  *   (A) Yes, substitution changes the truth value (Semantic).
  *   (B) No, it is true but misleading to say (Pragmatic).
  *   (C) It is neither true nor false (Context-sensitive).

  **5. Action and Emotion**
  You fear 'The Masked Man' but not 'Your Father', though they are identical. Does this difference exist *outside* belief reports (e.g., in adrenaline)?
  *   (A) Yes, the difference drives action directly.
  *   (B) No, it only appears when we describe the action linguistically.
  *   (C) Yes, but only because you lack knowledge of the identity.

  **6. The Arithmetic Case**
  Consider "2+2=4" vs "4=4". The first involves a complex term. Is the difference purely structural?
  *   (A) Yes, complexity of representation creates the difference.
  *   (B) No, the proposition is the same; only the proof differs.
  *   (C) Yes, because '2+2' describes a process while '4' names a result.

  **7. The Metalinguistic Intuition**
  When you say "Hesperus is Phosphorus" is informative, are you really saying something about the *words* 'Hesperus' and 'Phosphorus'?
  *   (A) Yes, the statement is about the names themselves.
  *   (B) No, it is about the planet Venus.
  *   (C) It is about how the names are used in this context.

  **8. The First-Person Video**
  You see someone on a live video feed acting strangely. You think "He is irrational." You do not think "I am irrational." Later you realize it was you. Was there a difference in content?
  *   (A) Yes, 'I' and 'He' present the same object differently.
  *   (B) No, you just lacked knowledge of the reference.
  *   (C) Yes, because the context of 'I' is fixed differently than 'He'.

  **9. Context Shift**
  Can the cognitive value of a name change purely due to context (e.g., who is speaking), without changing the name or object?
  *   (A) Yes, content is partially determined by context (Hidden Indexical).
  *   (B) No, content is stable; only use changes.
  *   (C) Yes, because there are two dimensions of content (2Dism).

  ---

  ## Scoring Key & Logical Space

  Map your answers to the three dimensions below. Locate your position in the **Philosophical Map**.

  **Dimension 1: Semantics vs. Pragmatics (Q1, Q4, Q5)**
  *   **Mostly A:** You hold a **Semantic View** (the difference is in the proposition).
  *   **Mostly B:** You hold a **Pragmatic View** (the difference is in use/implicature).
  *   **Mostly C:** You hold a **Contextualist View** (truth conditions shift).

  **Dimension 2: Reference vs. Mode of Presentation (Q2, Q6, Q7)**
  *   **Mostly A:** You are **Descriptivist/Fregean** (content involves descriptions/senses).
  *   **Mostly B:** You are **Direct Reference/Millian** (content is just the object).
  *   **Mostly C:** You are **Metalinguistic/Deflationary** (content is about names).

  **Dimension 3: Subject & Context (Q3, Q8, Q9)**
  *   **Mostly A:** You are **Relationist/Functional** (structure matters more than mind).
  *   **Mostly B:** You are **Psychological/Fregean** (requires a subject's perspective).
  *   **Mostly C:** You are **Two-Dimensionalist/Hidden-Indexical** (context fixes content).

  ### Philosophical Map (Leaves)

  | If your profile is... | You likely hold... |
  | :--- | :--- |
  | **Dim 1: Pragmatic (B)** + **Dim 2: Direct Ref (B)** | **Direct Reference with Pragmatic Story** (Millian + Gricean) |
  | **Dim 1: Semantic (A)** + **Dim 2: Descriptivist (A)** | **Classical Descriptivism** (Frege/Russell) |
  | **Dim 1: Semantic (A)** + **Dim 2: Direct Ref (B)** + **Dim 3: Psych (B)** | **Fregean/Neo-Fregean MoP** (Perry/Recanati) |
  | **Dim 1: Semantic (A)** + **Dim 2: Direct Ref (B)** + **Dim 3: Relationist (A)** | **Semantic Relationism** (Fine) |
  | **Dim 1: Contextualist (C)** + **Dim 2: Direct Ref (B)** | **Hidden-Indexical View** (Schiffer) |
  | **Dim 1: Contextualist (C)** + **Dim 2: Descriptivist (A)** | **Two-Dimensionalist** (Chalmers/Jackson) |
  | **Dim 2: Metalinguistic (C)** (Any Dim 1) | **Metalinguistic/Deflationary** (Salmon/Soames variants) |

  ### Limitations & Unoccupied Space

  **Indistinguishable Pairs:**
  1.  **Pragmatic Millian vs. Implicature:** If you chose Pragmatic (Dim 1B), this quiz cannot distinguish between a pure Millian view and a Gricean implicature story; they predict identical intuitions here.
  2.  **Relationism vs. Neo-Fregean:** If you chose Semantic (Dim 1A) + Direct Ref (Dim 2B), distinguishing Relationism (coordination of names) from Neo-Fregeanism (psychological modes) requires metaphysical commitments not tested by cases alone.

  **Unoccupied Combinations (Nobody Defends These):**
  *   **Semantic Difference + No Subject + No Reference + Not Metalinguistic:** (Q1A, Q2A, Q3A, Q7B). This implies content exists without minds, objects, or words. This "Platonic Structuralism" is logically possible but philosophically unmotivated.
  *   **Pragmatic Difference + Truth-Conditional Change:** (Q1B, Q4A). This is incoherent. If the difference is *only* pragmatic, truth conditions cannot change. If you selected this, check your consistency.
