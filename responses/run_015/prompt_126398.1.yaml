      *   *Dependency:* The crucial distinction is **Sovereign (Juridical) vs. Disciplinary**. Without this, "productive power" makes no sense. Sovereign power takes life; Disciplinary power administers life.
      *   *Misconceptions:*
          *   Ideology: Intercept when defining "Knowledge."
