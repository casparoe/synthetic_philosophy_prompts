      *   *Althusser:* Intercept when discussing the "Subject." Althusser = Hailing (linguistic); Foucault = Training/Constituting (material/bodily).
      *   *Abolition:* Intercept at the end. We can't step outside power; we must strategize within it.

  6.  **Developing the Diagnostic Question:**
      *   Needs to move beyond "Surveillance is bad."
      *   Needs to test if they see power as *constitutive*.
      *   *Idea:* Ask them to identify where power is operating in a "helpful" or "neutral" scientific context.
      *   *Refinement:* "In what way does the diagnostic category itself enable the exercise of power, rather than simply describing a pre-existing condition?"

  7.  **Determining what to Bracket:**
