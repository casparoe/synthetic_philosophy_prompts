answer: |-
  **Brainstorming**
  1.  **Hospital Wait Times:** Dropped. Staff triage adjustments constitute strategic adaptation, violating the 'no agent' constraint.
  2.  **Police Response Metrics:** Dropped. Crime reporting rates shift based on public confidence, introducing evidential noise and potential gaming.
  3.  **Social Housing Insulation:** Selected. Physical system with clear thermodynamics; tenants need not change behaviour for the mechanism to hold; heterogeneity allows guardrail failure.

  **Scenario**
  A local authority aims to minimise winter respiratory hospitalisations (Target) in its solid-wall social housing stock. Historical audits show a robust linear correlation between Thermal Efficiency Ratings (Proxy) and tenant health, as the dataset comprises only draughty, under-insulated units. Engineers are mandated to upgrade all units to the highest historically observed Efficiency Rating, assuming linearity. The mechanism is physical: insulation retains heat, preventing hypothermia-related illness. However, these buildings breathe moisture; exceeding a critical airtightness threshold traps vapour from standard occupancy (cooking, respiration) within the wall structure. This causes interstitial condensation and black mould, exacerbating respiratory conditions. The critical threshold varies by brick porosity and orientation, variables unrecorded in the central dataset. Applying a guardrail capped at the maximum safe historical rating still produces failures, because that historical maximum was safe only due to coincidental high porosity in those specific earlier cases, not because the rating itself was universally safe.

  **Analysis**

  1.  **Target:** Resident respiratory health (admissions). **Proxy:** Thermal Efficiency Rating.
  2.  **Causal Graph:**
      ```text
      [Insulation Spec] --> [Thermal Efficiency] --> [Heat Retention] --> [Health]
                                 |
                                 v
      [Brick Porosity] --> [Airtightness] --> [Mould Growth] --^
      ```
  3.  **Historical Data:** All data points sit on the rising slope of the curve. The dataset lacks observations where high efficiency coincided with low porosity, masking the inflection point.
  4.  **Verdicts:**
      *   *Do nothing:* Baseline cold-related illness.
      *   *Intervene on upstream (Ventilation + Insulation):* Target improves.
      *   *Intervene on Proxy (Max Efficiency):* Target worsens (mould outweighs heat gain).
      *   *Proxy + Guardrail (Historical Cap):* Target still worsens (cap exceeds safe limit for low-porosity subset).
  5.  **Structural Feature:** Unobserved heterogeneity interacting with a non-linear dose-response.
      *   *Ablation 1 (Delete Bend):* Case collapses to successful optimisation; higher proxy always equals better target.
      *   *Ablation 2 (Add Agent):* If tenants open windows to reduce mould, it becomes Strategic Goodhart (gaming the metric).
  6.  **Skeptic Objection:** This is merely a non-monotone dose-response curve, a fact of physics, not a measurement failure. The fix is to measure health directly or use a balanced scorecard.
      *   *Response:* Valid. Goodhart's Law describes the breakdown of the proxy-target relationship under optimisation pressure. When the proxy ceases to track the target because we pushed it beyond its valid range, it is Extremal Goodhart. The objection highlights that the solution is better modelling, but does not negate the classification. It is not fatal, but suggests the label matters less than the mechanism.
  7.  **Conclusion:** This case supports treating specification gaming as a separate animal; strategic adaptation is distinct from structural breakdown.
