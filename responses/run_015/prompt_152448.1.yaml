answer: |-
  Your intuition is correct: your friend's summary is a very common "folk AI" narrative that sounds plausible but collapses under scrutiny. It mixes a correct definition with a highly contested solution and conflates two distinct philosophical problems.

  Here is a breakdown of what is accurate, what is a simplification, and what is misrepresented in that account.

  ### 1. The Definition: Accurate
  **Claim:** *The frame problem is the puzzle of how a computer knows which facts remain true after it performs an action (illustrated by the robot/bomb/cart story).*

  **Verdict:** **Accurate.**
  This is the standard, textbook definition. The problem was originally formalized by John McCarthy and Patrick Hayes in 1969. They noticed that in logic-based AI, if you program a robot to understand that "moving a box changes its location," you also have to explicitly program that "moving a box does *not* change the color of the walls," "does *not* change the location of the moon," and so on. Without these explicit "frame axioms," the logic system cannot assume anything stays the same.

  The story your friend told (often attributed to Daniel Dennett) is a famous parable: A robot is tasked with saving a battery from a room with a bomb. It succeeds, but the battery is on a wagon, and the bomb is on the same wagon. The robot pulls the wagon out, saving the battery but also bringing the bomb with it, which explodes. The robot failed because it could not distinguish *relevant* consequences (the battery moves) from *irrelevant* ones (the bomb moves).

  ### 2. The Neural Network "Solution": Misrepresented
  **Claim:** *The problem was solved by the shift to neural networks because distributed representations do not store discrete symbols that need individual updating.*

  **Verdict:** **Misrepresented.**
  This is the most significant error in your friend's account. While it is true that neural networks (connectionism) do not manipulate discrete symbols like "Box_At_Location_X," claiming this "solves" the frame problem is a category mistake.

  *   **Sidestepping vs. Solving:** Neural networks sidestep the *logical* formulation of the frame problem because they don't use logic. However, they do not solve the *cognitive* underlying issue: determining relevance. A deep learning system still struggles to understand causal persistence. If you train a neural network to play a video game, it often fails to understand that objects off-screen still exist (object permanence) or that pushing a block doesn't change the score unless specific conditions are met.
  *   **The New Frame Problem:** Modern researchers argue that deep learning has its own version of the frame problem. Large Language Models (LLMs), for instance, often hallucinate facts or fail to maintain consistency over long contexts. They struggle to know what information should remain "fixed" in their internal state when processing new tokens.
  *   **Systematic Generalization:** Neural networks are notoriously bad at systematic generalization (applying a rule learned in one context to a slightly new context). This is essentially the frame problem in disguise: knowing which rules persist across different situations.

  In short, moving to neural networks removed the *syntax* of the problem (updating logical lists) but did not remove the *semantics* of the problem (understanding what changes and what stays the same in the real world).

  ### 3. Equivalence to Symbol Grounding: Conflation
  **Claim:** *This is really the same difficulty as the symbol-grounding problem.*

  **Verdict:** **Conflation / Simplification.**
  These are two different problems, though they are cousins.

  *   **The Symbol Grounding Problem:** This asks, "How do symbols inside a computer get their meaning?" If a computer manipulates the word "apple," how does it know what an actual apple is, rather than just shuffling the letters A-P-P-L-E? This is about **semantics** (meaning).
  *   **The Frame Problem:** This asks, "Given that I know what these things mean, how do I efficiently calculate the effects of my actions?" This is about **inference** (reasoning).

  You can have a grounded system that still suffers from the frame problem. Imagine a robot that perfectly recognizes a bomb and a battery (grounding is solved). It still might pull the wagon out without realizing the bomb is on it (frame problem/relevance is unsolved). Conversely, you could theoretically solve the frame problem in a purely abstract mathematical system without ever grounding the symbols in physical reality.

  Collapsing them together suggests that if you solve meaning, you automatically solve reasoning about change. Current AI research suggests this is false.

  ### 4. Dennett's Position: Misinterpreted
  **Claim:** *Philosophers like Dennett showed it was never a genuine obstacle, only an artefact of trying to program common sense by hand.*

  **Verdict:** **Misinterpreted.**
  Daniel Dennett's famous 1984 essay, *"Cognitive Wheels: The Frame Problem of AI,"* is often cited by people who haven't read it to support exactly the opposite of what Dennett argued.

  *   **Dennett's Actual View:** Dennett did not dismiss the frame problem as a non-issue. He argued that it is a **deep philosophical problem** that exposes the limitations of traditional computational models of the mind. He used the robot parable to show that "common sense" is not a list of rules, but a complex, holistic capacity for relevance that standard AI architectures could not capture.
  *   **Not Just "Hand-Coding":** Dennett argued that the problem isn't just that we are bad at hand-coding rules; it's that the very idea of cognition as "internal theorem proving" might be flawed. He did not claim neural networks solve it (his essay predated the modern deep learning boom), nor did he say the problem disappears. He suggested it reveals something profound about the nature of expectation and context in biological intelligence.

  ### Summary Table

  | Claim | Status | Explanation |
  | :--- | :--- | :--- |
  | **Definition (Robot/Bomb)** | **Accurate** | This is the classic formulation of the problem regarding relevance and change. |
  | **Neural Networks Solve It** | **False** | NNs avoid the *logical* notation but still struggle with causal reasoning and persistence. |
  | **Same as Symbol Grounding** | **False** | Grounding is about *meaning*; Framing is about *inference*. They are distinct. |
  | **Dennett Dismissed It** | **False** | Dennett argued it is a profound obstacle that reveals flaws in computational theory of mind. |

  ### The Bottom Line
  Your friend's summary is a "just-so story" common in tech circles. It follows a satisfying narrative arc: *Old AI was rigid (symbols), New AI is flexible (neural nets), therefore the old problems are gone.*

  In reality, the frame problem remains an open challenge in cognitive science. While we no longer try to solve it by writing thousands of logical axioms, we have not yet built a system (neural or otherwise) that robustly understands context, causality, and relevance the way a human toddler does. The problem hasn't been solved; it has merely changed its shape.
