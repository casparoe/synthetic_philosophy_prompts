answer: |-
  "The conditionals are inverted, Nell. That's the brute fact," Ravi said, tapping the case description. "Vera wouldn't break if struck. Vern would. Your analysis says Vera is sturdy and Vern is fragile. Reality says the opposite."

  Nell didn't flinch. "Reality says nothing. Microstructures say something. Your intuition says something. The conditional analysis, properly patched, says the truth. Vera *is* disposed to shatter. The Guardian is an interferer. We remove the interferer from the antecedent, and the conditional holds: *If Vera were struck and the Guardian absent, she would break.*"

  "And there lies the rot," Ravi countered. "How do you identify the Guardian as an 'interferer' without already knowing Vera is fragile? The Guardian fires only when it detects the specific microstructure that constitutes fragility. To define the interferer, you must specify: 'anything that prevents manifestation *given the disposition*.' You've built the *disponendum* into the definition of the interferer. It's viciously circular."

  "It's not circular, it's causal," Nell snapped. "An interferer is an extrinsic causal interrupter. The Guardian is a distinct entity from the vase. We strip away extrinsic causal chains. We don't need to know the disposition to see the Guardian is an external agent manipulating the outcome."

  "But Vern's Guardian is also an external agent," Ravi pressed. "It adds fragility. If you strip it, Vern doesn't break. So, on your view, Vern isn't fragile. I agree! But why? Only because you *know* his intrinsic structure is sturdy. You're using the intrinsic property to decide which conditionals count as relevant. The conditionals aren't constituting the disposition; they're tracking it. They're evidence, Nell, not ontology."

  "Evidence for what? Ghostly intrinsic powers?" Nell leaned forward. "If dispositions aren't conditional facts, how do we access them? I test for fragility by striking. If I can't strike because of a Guardian, I posit ideal conditions. That's how science works."

  "Science posits ideal conditions based on theory," Ravi shot back. "If the conditional analysis is the *theory*, you can't use it to define the ideal conditions. You need independent access to the disposition to know which conditions are 'ideal.' Otherwise, you're just saying 'Vera is fragile because she would break in conditions where she would break.'"

  "Let's talk about the change," Nell said, pivoting. "After the first near-miss, Vera loses her fragility. The Guardian rewrites her microstructure. That's a fink. It removes the disposition. Your intrinsic view has to explain how a property vanishes instantly due to an external trigger."

  "My view explains it easily: the intrinsic base was altered. But can *you* tell it's a fink and not a mask without assuming the intrinsic fact?" Ravi leaned in. "A mask blocks manifestation; a fink removes the power. Initially, Vera doesn't break. Is that because the Guardian masked the break or finked the fragility? You say she loses fragility *after* the first hit. But during that first hit, did she have the power? If you say yes, you admit the conditional 'If struck, she breaks' was false while the disposition was present. If you say no, you're denying she was fragile at t1."

  "I say the conditional is true *ceteris paribus*," Nell insisted. "The Guardian violates the *ceteris paribus* clause."

  "Which is defined by the disposition!" Ravi threw his hands up. "You're spinning. Here's the epistemic knife: If I walk into that museum, how do I know Vera is fragile? I can't strike her; the Guardian stops it. I can't scan the microstructure; that's your 'intrinsic' cheat code. If conditionals are all we have, and the actual conditionals are backwards, I am epistemically blind. But I'm not blind. I know dispositions exist because I understand the causal basis."

  "You know the causal basis because you've seen the conditionals hold in non-Guardian worlds," Nell argued. "We generalize. We say 'Glass breaks when struck.' We encounter a Guardian case and treat it as the exception. The analysis holds for the general case; the Guardian is a localized defeater."

  "But the localized defeater is defined by its ability to defeat the general case," Ravi said, his voice dropping, steady and heavy. "You need the general case to be true *before* you identify the defeater. That means the disposition must exist prior to the conditional analysis. The conditionals are symptoms, Nell. You're treating the fever as the disease."

  "I'm treating the fever as the only observable metric," Nell retorted. "You want to posit hidden natures that do no work except ground counterfactuals. I ground the counterfactuals in the best available description of the object's behavior under non-interference. We disagree on whether 'non-interference' can be defined neutrally."

  "Exactly," Ravi said. "And until you can define an interferer without whispering 'prevents the manifestation of *this specific disposition*,' you have nothing but a tautology. I'll keep the intrinsic power. It explains why the Guardian targets Vera and not a steel replica."

  "And I'll keep the analysis," Nell said, closing her notebook. "Because your 'power' is just a name for the fact that I was right about the interferer."

  They sat in silence, the vases gleaming under the museum lights, fragile and sturdy in ways neither could fully translate to the other.
