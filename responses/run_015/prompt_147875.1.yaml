  1.  **Couplet 1 (Matla):** Establishes the physical scene (ember, flame) and the refrain ("and then it burns"). Both lines carry the rhyme (-old) and refrain to set the pattern immediately.
  2.  **Couplet 2:** Introduces the theoretical tension ("No chain connects") against the physical reflex ("hand recoils").
  3.  **Couplet 3:** Focuses on the sequence itself ("see the sequence") without implying necessity.
  4.  **Couplet 4:** Explicitly names the metaphysical stance ("No law the fibers keep") vs. the psychological reality ("habit").
  5.  **Couplet 5:** The worker's practical incoherence: snatching the hand away despite the theory.
  6.  **Couplet 6:** Reinforces the regularity as "habit" (Ash'arite *adah*), not nature.
  7.  **Couplet 7:** The end of shift routine; action proceeds without waiting for metaphysical certainty.
  8.  **Couplet 8 (Maqta):** Direct address ("Friend"). The refrain is warped ("holds" instead of "burns") to signify the miracle as a change in habit, not a violation of law. The rhyme (-old) remains to show the form holds even when the content breaks.

