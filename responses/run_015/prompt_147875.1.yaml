  The ember glows, the flame takes **hold**,  
  and then it burns.  
  I've watched this shift, a thousand **told**,  
  and then it burns.

  My hand recoils before the touch,  
  No chain connects, or so I'm **told**,  
  and then it burns.

  The cloth is dry, the weave is tight,  
  I see the sequence, clear and **cold**,  
  and then it burns.

  There is no law the fibers keep,  
  Just habit waking, uncontrol**led**,  
  and then it burns.

  I snatch my skin from out the heat,  
  Though theory says the link is **old**,  
  and then it burns.

  The smoke ascends, a steady stream,  
  It is the habit, manifold,  
  and then it burns.

  I sweep the ash across the floor,  
  I do not wait to see unfold,  
  and then it burns.

  Friend, ask me why I fear the **cold**,  
  I strike the flint, and then it holds.
