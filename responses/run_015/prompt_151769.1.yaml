answer: |-
  This is a classic and deeply entrenched debate in the philosophy of biology, echoing the tensions between Richard Dawkins' *The Selfish Gene* and the Multi-Level Selection (MLS) or Evolutionary Transitions in Individuality (ETI) frameworks championed by figures like David Sloan Wilson, Elliott Sober, and Richard Michod.

  Here is an adjudication of the exchange, move by move, followed by an assessment of missing concepts and confidence ratings.

  ### Move 1: The Definition of Replicators vs. Evolutionary Transitions
  **Alex's Claim:** Only genes meet the criteria (fidelity, longevity, fecundity) to be replicators; organisms are vehicles.
  **Jordan's Claim:** ETIs (e.g., unicellular to multicellular) create new integrated units where selection operates on the collective.

  **Assessment:**
  *   **Alex is right about the *medium* of inheritance:** In standard biological evolution, the gene (or DNA sequence) is indeed the only entity with the physical fidelity to act as a long-term replicator across deep time. Alex correctly identifies that without genetic copying, there is no biological evolution in the standard sense.
  *   **Jordan is right about the *causal structure* of selection:** Jordan correctly identifies that "what is copied" (the gene) is not always "what is selected" (the unit that interacts with the environment). In ETI theory, when lower-level units (cells) suppress their own reproduction to benefit the higher-level unit (organism), the *organism* becomes the primary unit of selection. The genes are still replicating, but the *fitness* is being calculated at the organismic level.
  *   **Verdict:** **Draw.** Alex holds the ontological high ground on what physically persists; Jordan holds the explanatory high ground on how complexity arises. Alex describes the *mechanism*; Jordan describes the *architecture*.

  **Confidence:** High (90%)

  ### Move 2: Vehicle Architecture vs. New Unit of Selection
  **Alex's Claim:** Multicellularity is just a change in vehicle architecture; tracking gene frequencies explains the survival.
  **Jordan's Claim:** Once interdependence is total, selection operates on the collective, not merely the genes inside it.

  **Assessment:**
  *   **Alex is technically correct but explanatorily weak:** It is true that one *can* model multicellularity by tracking gene frequencies. However, doing so is often computationally impossible and conceptually opaque. To say the gene is the unit of selection here is to ignore the *suppression of conflict*. In a multicellular organism, somatic cells are selected *against* if they replicate independently (cancer). The "unit" is the entity where conflict is minimized.
  *   **Jordan is stronger on *emergence*:** Jordan's point aligns with the "fraternal" transition model (Maynard Smith & Szathmáry). When the fitness of the lower unit is tied entirely to the higher unit, the higher unit becomes the Darwinian individual. Alex's claim that this is "just a vehicle" ignores that the vehicle itself has acquired the properties of a replicator (via reproduction of the organism), even if the genetic material is the substrate.
  *   **Verdict:** **Jordan.** Alex's reductionism commits the "greedy reductionist" fallacy. While genes are the substrate, the *target* of selection has shifted. Explaining the immune system by tracking individual gene frequencies is possible but misses the causal reality of the organism as a selected unit.

  **Confidence:** High (85%)

  ### Move 3: Institutional Norms and Cultural Group Selection
  **Alex's Claim:** Cultural spread is an extended phenotype; brains are gene products, so cultural spread is gene-mediated.
  **Jordan's Claim:** Norms reducing genetic fitness persist via inter-group competition; they reshape genetic environments.

  **Assessment:**
  *   **Alex is making a category error:** The "extended phenotype" argument works for beaver dams or caddisfly cases where the *gene* codes for the behavior that builds the structure. It does not work well for cultural norms that *counteract* genetic fitness. If a norm (e.g., celibacy, or risking life for non-kin) reduces the reproductive success of the genes that built the brain, but the norm spreads because groups with it outcompete other groups, the *norm* is acting as the replicator, not the gene.
  *   **Jordan is invoking Gene-Culture Coevolution:** This is the strongest part of Jordan's case. In Dual Inheritance Theory (Boyd & Richerson), cultural traits can evolve via group selection even when they are maladaptive at the genetic level. If the norm persists *despite* reducing genetic fitness, the gene cannot be the unit of selection for that trait. The "institution" or "norm" is the unit being selected.
  *   **Verdict:** **Jordan.** Alex's defense here is a retreat to a trivial truth ("genes built the brain") that ignores the causal independence of cultural evolution. If the cultural variant outcompetes the genetic imperative, the unit of selection for that specific dynamic is the cultural variant/group, not the gene.

  **Confidence:** Very High (95%)

  ### Important Missing Points
  Both parties are missing three crucial distinctions that would dissolve much of their disagreement:

  1.  **Replicator vs. Interactor:** Alex conflates the *replicator* (what gets copied) with the *unit of selection* (what causes the copying). Hull and Dawkins distinguish these: genes are replicators; organisms/groups are interactors. Jordan argues that in ETIs, the interactor becomes so integrated it functions *as* a replicator (the organism reproduces). Clarifying this terminology would help them agree on the mechanics while disagreeing on the labeling.
  2.  **Ontology vs. Heuristics:** They are arguing as if there is only one "true" unit. Most contemporary philosophers of biology (e.g., Godfrey-Smith) argue for **Explanatory Pluralism**. The "unit of selection" depends on the question being asked. For molecular mechanisms, Alex is right. For the evolution of multicellularity or human societies, Jordan is right. There is no single "King of the Hill" unit.
  3.  **The Equivalence Thesis:** Alex is hinting at the mathematical equivalence between Gene-Centered and Multi-Level Selection models (the Price Equation). Mathematically, you can partition selection variance either way. However, Jordan is right that mathematical equivalence does not imply *causal* equivalence. One description may reveal causal mechanisms the other obscures.

  ### Confidence Ratings in Judgments

  *   **Move 1 (Replicator Definition):** 90% Confidence. (Standard definition favors Alex, but biological reality favors Jordan).
  *   **Move 2 (ETI/Multicellularity):** 85% Confidence. (Consensus in ETI literature favors Jordan's view of emergent individuals).
  *   **Move 3 (Cultural Norms):** 95% Confidence. (Gene-culture coevolution literature strongly supports Jordan; Alex's extended phenotype defense is widely considered insufficient here).
  *   **Overall Adjudication:** 85% Confidence that Jordan has the stronger position regarding *causal explanation*, while Alex retains the stronger position on *physical substrate*.

  ### Point of Least Certainty
  **The Ontological Status of Cultural Replicators.**
  I am least certain about whether Jordan's "institutional norms" strictly qualify as **replicators** in the same rigorous sense Alex demands of genes.
  *   **Why:** Dawkins' criteria for a replicator require high *fidelity*. Cultural norms often blend, mutate, and merge (blending inheritance) rather than copying discretely (particle inheritance). If cultural norms lack the fidelity of genes, Jordan's claim that they are a parallel "unit of selection" might be metaphorically true but mechanistically distinct from biological selection.
  *   **Uncertainty Level:** Moderate (40% Confidence). It is an open empirical and philosophical question whether cultural evolution is truly Darwinian (selection on replicators) or Lamarckian/transformative (transmission of acquired traits). If the latter, Jordan's analogy to biological units of selection weakens, even if the group-selection outcome remains real.

  ### Summary Recommendation
  Tell your classmates that **Alex wins on the substrate, but Jordan wins on the system.** Alex is correct that genes are the only biological replicators we know of, but Jordan is correct that selection frequently acts on emergent wholes (organisms, groups) in ways that cannot be reduced to gene-frequency tracking without losing explanatory power. In the specific case of cultural norms, Jordan is decisively right: when culture overrides genetic fitness, the gene is no longer the relevant unit of selection for that trait.
