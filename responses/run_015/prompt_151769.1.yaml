          *   *Analysis:* This is the classic Dawkins vs. Gould/Lewontin/Sober/Wilson debate. Alex is technically correct on the *replicator* definition (Dawkins' specific criteria), but Jordan is correct on the *causal process* of selection acting on emergent entities.

