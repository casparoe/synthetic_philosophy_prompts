          *   *Analysis:* This is the strongest point for Jordan. If a trait reduces genetic fitness but spreads via group selection (cultural), the gene-centered view struggles to call the *gene* the unit of selection for *that specific trait's spread*. Alex's "extended phenotype" defense is weak here because the *content* of the culture (the norm) is the replicator, not the gene for "learning."

