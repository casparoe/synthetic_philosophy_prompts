answer: |-
  ### Desiderata for an Adequate Account of the Doing/Allowing Distinction

  Below are the five core requirements any account must meet to satisfy both the philosophical constraints and your consulting constraints. I have marked those that are **Non-Negotiable (NN)** for your specific context (dissertation + practical application) and those that represent **Camp Preferences (P)** where reasonable disagreement exists.

  1.  **Extensional Coverage (NN):** The account must yield the standard verdicts on the core case battery without ad-hoc adjustments. Specifically, it must distinguish the trolley operator (redirecting threat) from the transplant surgeon (killing for parts); distinguish the relative who declines to summon help (allowing) from the clinician who withdraws futile support (allowing, not killing); and handle the "creator of threat" case (where prior fault complicates the later omission) without collapsing the distinction into a general culpability assessment.
      *   *Rationale:* If the account cannot replicate the intuitive asymmetry in the cases that generate the problem, it is not an account of *that* distinction.

  2.  **Baseline Stability (NN):** The account must provide a non-arbitrary method for fixing the "normal course" or status quo against which doing and allowing are measured. It must explain why a hand kept in a pocket is an omission but a hand moving to smother is an action, even if the physical effort is identical, without relying solely on moralized descriptions (e.g., "the hand they ought to have moved").
      *   *Rationale:* Without a fixed baseline, the distinction becomes description-relative (the "hand in pocket" problem), rendering it useless for incident review where physical descriptions are fixed but normative descriptions are contested.

  3.  **Normative Genealogy (NN):** The account must specify the source of the distinction's moral force. It must explain whether the asymmetry carries *independent* weight or merely summarizes underlying factors (duties, consequences, rights). Crucially, it must provide an adequate account of why, in hard cases (like withholding vs. withdrawing treatment), the distinction often carries *no* independent moral weight despite linguistic differences.
      *   *Rationale:* Your consulting clients need to know if the distinction *justifies* the verdict or merely *labels* it. If it justifies, why does it vanish in equivalent outcome cases? If it labels, what is it labeling?

  4.  **Conceptual Separation (P):** The account must keep the doing/allowing distinction distinct from the intending/foreseeing distinction (DDE) and from the general duty to rescue. While they may overlap, the criteria for classification must not be identical.
      *   *Rationale:* Conflating DAD with DDE makes the distinction inaccessible to your review boards (who cannot reliably access mental states). Conflating it with Duty collapses the distinction entirely. However, some camps argue these are inextricably linked.

  5.  **Operational Tractability (NN):** The account must identify a limited set of load-bearing factual features (e.g., causal history, protocol existence, physical intervention) that allow a non-philosopher to reach a verdict from a written case description in an afternoon. Disagreements must be traceable to specific factual or theoretical disputes, not brute intuition.
      *   *Rationale:* This is the constraint imposed by your hospital and corporate clients. A distinction that requires metaphysical expertise to apply is practically inert.

  ***

  ### The Tension: Analysis and Verdict

  The tension you are bumping into is **real**, and it is a **result about the distinction**, not merely a defect of your desiderata. The doing/allowing distinction is not a metaphysical primitive; it is a heuristic device that tracks causal and normative boundaries. Consequently, you cannot simultaneously satisfy **Baseline Stability** (without moralization), **Normative Genealogy** (independent weight), and **Operational Tractability**. To make the distinction operationally tractable for a review board, you *must* moralize the baseline (e.g., defining "allowing" as "acting within the scope of permitted protocol"). However, once the baseline is moralized, the distinction loses its independent weight; saying an act is "allowing" becomes synonymous with saying "no duty was violated." This renders the distinction explanatorily idle (it summarizes the verdict rather than grounding it). The single requirement that does the most work in excluding live candidates is **Operational Tractability**. Purely causal or counterfactual accounts fail here because they are too granular and sensitive to description (failing the "afternoon verdict" test). Purely rights-based accounts fail because they require adjudicating abstract constraints before applying the distinction. Only a duty-based/moralized baseline account is tractable, but it is the very account that surrenders independent moral weight.

  ***

  ### Scoring the Philosophical Families

  **Counterfactual/Causal accounts** score well on Baseline Stability and Conceptual Separation but fail Operational Tractability and Extensional Coverage; they struggle to distinguish omissions from actions in complex causal chains (like the aggregate failure cases) without becoming too technical for a review board. **Intention-based accounts (DDE vicinity)** handle the Transplant/Trolley battery excellently but collapse Conceptual Separation and fail Operational Tractability, as incident boards cannot reliably adjudicate mental states in an afternoon. **Constraint/Rights-based accounts** (e.g., Quinn, Roth) offer strong Normative Genealogy and Extensional Coverage but falter on Operational Tractability and Baseline Stability, as determining what counts as a "harmful constraint" versus "allowing nature to take its course" often requires the very moral judgment the distinction is meant to guide. Finally, the **Skeptical view** (that the asymmetry is an illusion) scores perfectly on Normative Genealogy (explaining why it lacks weight) and Operational Tractability (by dissolving the question into duty/consequence), but it fails the Extensional Coverage desideratum by telling your clients their core intuition is mistaken, which is politically and practically unviable for ethics committees seeking guidance rather than elimination of the category.
