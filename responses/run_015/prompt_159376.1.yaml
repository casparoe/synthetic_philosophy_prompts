answer: |-
  # Seminar Handout: Persistence and Identity in Data Models
  **Course:** Graduate Seminar on Persistence and Identity
  **To:** Philosophy and Information Science Graduate Students
  **From:** Course Instructors
  **Subject:** Cross-Disciplinary Translation of Metaphysical Theses

  ## Part I: The Metaphysical Debate in Data Vocabulary

  The following sections translate four central arguments in the persistence debate into the vocabulary of relational data modeling, specifically utilizing bitemporal schemas, slowly changing dimensions (SCD), and event logging.

  ### 1. The Argument from Temporary Intrinsics
  **The Metaphysical Problem:** An object $O$ is spherical at $t_1$ and crushed at $t_2$. If $O$ is numerically identical across time, how can it possess incompatible properties (spherical, crushed) without contradiction?

  **The Perdurantist Translation (The Event Log / SCD Type 2)**
  *   **Schema:** A table `Object_History` with columns `(entity_id, valid_start, valid_end, state_snapshot)`.
  *   **Analysis:** There is no single row that is both spherical and crushed. There is a row $R_1$ where `valid_start = t1` and `state_snapshot = 'spherical'`. There is a row $R_2$ where `valid_start = t2` and `state_snapshot = 'crushed'`.
  *   **Identity:** The "object" is the aggregate of all rows sharing the `entity_id`. $O$ is the spacetime worm; $R_1$ and $R_2$ are temporal parts. Contradiction is avoided because properties are predicated of rows (parts), not the aggregate directly.
  *   **Engineering Term:** *Immutable Event Sourcing* or *Slowly Changing Dimension Type 2*. The past is append-only.

  **The Endurantist Translation (The Current State / SCD Type 1)**
  *   **Schema:** A table `Object_Current` with columns `(entity_id, current_state)`.
  *   **Analysis:** There is one row per `entity_id`. At $t_1$, a query returns `state = 'spherical'`. At $t_2$, an `UPDATE` operation overwrites the cell to `state = 'crushed'`.
  *   **Identity:** The "object" is the logical key `entity_id`. The row is merely a representation of the object *now*.
  *   **Handling Change:** Properties are not monadic (just 'spherical') but relational (`state_at(time)`). In SQL terms, the state is a function of the query time. $O$ instantiates `Spherical(t1)` and `Crushed(t2)`. No contradiction because the time parameter differs.
  *   **Engineering Term:** *Overwrite* or *Slowly Changing Dimension Type 1*. History is not reified in the schema; it is lost or stored externally.

  ### 2. The Claim of Being "Wholly Present"
  **The Metaphysical Claim:** At any time $t$ where $O$ exists, all of $O$ exists at $t$. $O$ is not spread out over time such that only a slice exists at $t$.

  **The Translation**
  *   **Perdurantist Schema:** To retrieve "the object" requires a range query: `SELECT * FROM Object_History WHERE entity_id = X`. If you query for a single timestamp `WHERE valid_time = t1`, you retrieve only a *part* of the object (a single row). The primary key of the fundamental ontology is composite: `(entity_id, valid_time)`.
  *   **Endurantist Schema:** To retrieve "the object" requires a point query: `SELECT * FROM Object_Current WHERE entity_id = X`. The result set at $t_1$ contains the full definition of the object relevant to existence at $t_1$. The primary key is singular: `(entity_id)`.
  *   **What is Ruled Out:** The Endurantist schema treats the `valid_time` as metadata external to the object's identity. The Perdurantist schema treats `valid_time` as a constituent of the object's identity key. For the Endurantist, querying a specific time slice yields the *whole* object at that time; for the Perdurantist, it yields a *part* of the object.

  ### 3. The Coincidence Case (Statue and Alloy)
  **The Metaphysical Problem:** A statue and the portion of alloy constituting it share all spatial parts and matter at every instant they coexist, yet differ in persistence conditions (the alloy survives melting; the statue does not).

  **The Translation**
  *   **The Data Problem:** In a normalized database, if two entities share all attributes and keys at all times, they are the same row. To distinguish them, you must introduce a distinction in the schema.
  *   **Perdurantist/Engineer Solution:** Two separate event streams (tables) with different lifecycle constraints.
      *   `Table_Statue`: `entity_id`, `valid_time`, `form`. Constraint: If `form` becomes null (melting), the `valid_end` is closed.
      *   `Table_Alloy`: `entity_id`, `valid_time`, `mass`. Constraint: `valid_end` is not triggered by loss of form.
      *   **Join:** These tables share a `material_batch_id` (foreign key).
  *   **The Tension:** In the database, the Statue and Alloy are distinct records linked by a foreign key. In the metaphysical case, they are spatially coincident. The database forces a *separation of keys* to model the *coincidence of matter*.
  *   **Translation:** Coincidence is modeled as *one-to-one relationships between distinct identity keys* over a specific `valid_time` interval. The "difference" is encoded in business logic (triggers/constraints) regarding when the `valid_end` timestamp is populated, not in the data payload itself.

  ### 4. The Arbitrary Undetached Parts Objection (Maximality)
  **The Metaphysical Problem:** If any sum of temporal parts is an object, then "You-Minus-Your-Last-Minute" is an object. Why are *you* the maximal worm and not one of the arbitrarily many shorter person-like sums contained within you?

  **The Translation**
  *   **The Data Reality:** In SQL, any `SELECT` query defines a set. I can query `WHERE valid_time BETWEEN 2020 AND 2023`. This returns a valid temporal part. I can query `WHERE valid_time BETWEEN 2020 AND 2024`. This returns a larger part.
  *   **The Perdurantist Debt:** The database engine does not care which is the "real" object. The "Maximal" claim must be enforced by application logic or schema constraints.
  *   **Engineering Term:** *Aggregate Root* boundaries. The system designates a specific `entity_id` lifecycle as the "Person." Sub-segments are queryable views, but they are not assigned their own `entity_id` in the registry.
  *   **Translation:** The objection highlights the difference between *queryable subsets* (which are infinite) and *registered entities* (which are constrained by the Identity Management System). The Perdurantist must explain why the Identity Management System privileges the maximal extent.

  ---

  ## Part II: The Residue Report

  This section details what is lost, distorted, or gained when translating metaphysical claims into data schemas.

  ### 1. Clean Translations
  *   **Temporary Intrinsics:** This translates perfectly. The contradiction of incompatible properties is resolved in data engineering exactly as the Perdurantist resolves it: by partitioning state across immutable rows indexed by time. The Endurantist "relational property" solution maps cleanly to parameterized views or bitemporal `AS OF` queries.
  *   **Temporal Parts:** The concept of a temporal part is isomorphic to a row in a history table or an event in a log. There is no residue here; engineers are intuitive perdurantists regarding data records.

  ### 2. Distorted Translations
  *   **Wholly Present:** This translates with distortion. In a database, "wholeness" is a function of the *query*, not the *storage*. Even in an Endurantist (Type 1) schema, the row is stored on a disk sector; it is physically extended. The metaphysical claim is about *ontological presence*, whereas the database claim is about *record completeness*.
      *   *Risk:* Engineers will assume "Wholly Present" means "All columns are populated." It actually means "No part of the substance is missing."
  *   **Coincidence:** This translates with significant distortion. Databases abhor ontological ambiguity. To model the Statue/Alloy case, we must assign them distinct Primary Keys. This subtly biases the model toward *Constitutionism* (they are two things related by constitution) rather than *Coincidence* (they are one thing described by two sortals). The schema forces a distinction that the metaphysics claims is absent in matter.
      *   *Risk:* Students will assume that because we need two keys, there must be two physical things.

  ### 3. Failed Translations (The Residue)
  *   **Modal Properties (Persistence Conditions):** This is the largest failure. A database records *actual* history (what happened). It does not natively store *counterfactual* history (what could have happened).
      *   *The Residue:* The difference between the Statue and the Alloy is that the Alloy *could* survive melting. In SQL, this is stored as a comment, a business rule, or a flag (`is_meltable`). It is not in the data itself.
      *   *Assessment:* This marks a **poverty in the target framework**. Relational algebra is extensional; it deals with sets of actual tuples. Metaphysics is often intensional (dealing with possibilities). Students will mistakenly believe that defining a column `persistence_type` settles the ontological question. It does not; it only records the classification decision.
  *   **Maximality:** As noted in Part I, SQL allows arbitrary slicing. The "Person" is maximal only because we agree not to issue IDs to slices.
      *   *Assessment:* This marks **vagueness in the metaphysical claim** that the data model exposes. The Perdurantist claim that "I am the maximal sum" relies on a pragmatic boundary (skin, birth, death) that is as arbitrary as a database schema's boundary. The data model reveals that "maximality" is a administrative constraint, not a logical necessity.

  ---

  ## Part III: Verdict on "Corrigible Perdurance"

  You have identified a tension between **Bitemporal Modeling** (Valid Time + Transaction Time) and **Classical Perdurantism** (Fixed 4D Block).

  **The Phenomenon:**
  In a bitemporal table, I can insert a row today (`transaction_time = now`) that asserts a fact about last year (`valid_time = last_year`). I am, in effect, adding a temporal part to a worm-segment that has already elapsed. In classical Eternalist Perdurantism, the past parts of the 4D worm are fixed. They cannot be added to or altered.

  **Construction of the Position:**
  To take this seriously as a metaphysical position rather than a database feature, we must treat `transaction_time` not as "when the data was typed," but as "when the fact was *actualized* or *recognized*."
  *   **Classical Perdurantism:** The object is a set of coordinates $(x, y, z, t)$. All $t$ exist equally.
  *   **Corrigible Perdurance:** The object is a set of coordinates $(x, y, z, t_{valid}, t_{asserted})$. The ontology includes the epistemic history of the parts. A part does not fully exist until it is asserted.

  **The Verdict:**
  "Corrigible Perdurance" is **an artifact of the representational layer**, but it maps to a coherent, non-standard metaphysical view known as **The Growing Block Theory** combined with **Epistemic Fallibilism**.

  1.  **It is not a Third Ontological Position:** It does not suggest the physical past changes. If you treat the database as a mirror of reality, you commit the map-territory error. The `transaction_time` tracks the history of the *record*, not the history of the *referent*. When you backdate a row, you are correcting the map, not moving the territory.
  2.  **It is a Variant of Perdurantism:** However, if we shift the domain from "Physical Objects" to "Information Objects" (e.g., a Legal Contract, a Patient Record), Corrigible Perdurance is the correct ontology. Legal facts *do* acquire validity retroactively (e.g., a court ruling today that changes your status last year). For social/institutional objects, the past *is* corrigible.
  3.  **The Danger for Students:** Your students will mistakenly take this to settle the debate on physical persistence. They will argue: *"The database allows me to change the past valid-time, therefore the past is not fixed."*
      *   **Correction:** You must clarify that `valid_time` in a bitemporal schema is a *claim* about time, not time itself.
      *   **Nuance:** However, if one adopts a **Semantic Externalism** where social facts constitute reality (e.g., "Being a President," "Being Married"), then the bitemporal model is more accurate than the block universe. Social objects *do* have corrigible pasts.

  **Final Instruction:**
  Tell the engineers: "Your schema models *knowledge of persistence*, not *persistence itself*."
  Tell the philosophers: "The engineers have formalized the distinction between *ontological time* (valid) and *epistemic time* (transaction). Do not dismiss this as mere bookkeeping; it is a formal model of how we access the block universe."

  "Corrigible Perdurance" is not a new physics. It is a rigorous model of **fallible access to a fixed manifold**. It solves the epistemic problem of how we talk about the past without requiring the past to be metaphysically mutable.
