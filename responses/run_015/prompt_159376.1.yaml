          *   *Data Analogy:* A "Current State" table (SCD Type 1). One row per entity ID. Updates overwrite previous values. The "object" is the logical key, but the physical representation is always just the *now* state. Or, perhaps more accurately, a lookup by ID returns the *whole* object at time $t$.
