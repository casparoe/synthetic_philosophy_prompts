          *   *Perd:* $O_{t1}$ is spherical. $O_{t2}$ is crushed. $O$ is the sum.
          *   *End:* $O$ has relation $R(spherical, t_1)$.
          *   *Data:* Perdurantist = Event Log (State at $t_1$ $\neq$ State at $t_2$). Endurantist = Current State Table with implicit time context (Value depends on query time).

      *   **Wholly Present:**
          *   *Phil:* At $t_1$, all of $O$ exists.
          *   *Data:* A `SELECT * FROM Objects WHERE id = X` at transaction time $t_1$ returns the complete record. You don't need to join with history to get the "whole" object at $t_1$.
          *   *Ruling Out:* It rules out the idea that the object is *spread out* over time such that only a slice exists at $t_1$. In data terms: It denies that the primary key of the object includes a timestamp.

