          *   *Data:* Same `row_id` or `foreign_key` to physical inventory, but different `entity_type` or lifecycle rules.
          *   *Problem:* In a database, if two things share all data fields and keys, they are the same row. To distinguish them, you need separate tables or a polymorphic ID.
