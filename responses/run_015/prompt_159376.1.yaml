          *   *Better Analogy:* A function $f(entity\_id, time) \rightarrow state$. The entity is the function's subject, not the sum of rows.

      *   **Perdurantism (4Dism):** Objects persist by having *temporal parts*. The object is a "spacetime worm."
          *   *Data Analogy:* An append-only event log or a bitemporal history table. The "object" is the aggregate of all rows/events associated with an ID over its lifespan. No single row is the object; the query result over the interval is the object.
          *   *Temporary Intrinsics:* A row at $t_1$ has `shape='spherical'`. A row at $t_2$ has `shape='crushed'`. No contradiction because they are different rows (temporal parts).

