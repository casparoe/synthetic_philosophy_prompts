  2.  **Deconstruct the Philosophical Issue:**
      *   **The Practice:** Insuring/valuing art based on artistic value vs. material value. Sometimes insuring both separately. Questioning what happens to the material value after artistic destruction.
      *   **The Metaphysics:**
          *   *Option A: Constitution View (Two Objects).* The statue and the lump of clay/marble are distinct objects that coincide spatially and temporally (until destruction). They have different modal properties (the lump could survive being squashed; the statue cannot). This explains different values.
          *   *Option B: Identity View (One Object).* The statue *is* the marble. There is only one object. Properties like "being art" are contingent or relational properties of that single object.
      *   **The Insurance Problem:**
          *   If Two Objects: Insuring both makes sense (different risk profiles, different values). If the statue is destroyed (aesthetic destruction), the lump remains (material destruction hasn't happened).
          *   If One Object: Insuring both is double-counting. If the statue is destroyed, the object is destroyed (or at least altered). Can you still claim on the "marble" part?
      *   **Consistency Check:** The prompt asks if the practice is consistent. If they insure both, they seem to act like there are two objects. If they say the marble survives the art's destruction, they act like the lump has different persistence conditions than the statue.
      *   **Practical Implications:** What changes for appraisers if we adopt the One-Object view?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the insight. The practice indeed relies on a specific metaphysical distinction. State the thesis: The practice presupposes a *constitution view* (distinct objects), and a strict *identity view* (one object) would create significant logical and financial contradictions in the current system.
      *   **The Metaphysical Presupposition (Constitution View):** Explain the "Statue and Clay" problem (Locke, Wiggins, etc.). The practice treats the *artwork* (abstract/cultural entity embodied in matter) and the *material* (physical stuff) as distinct bearers of value. The artwork has properties (provenance, authorship) the matter lacks. The matter has properties (weight, chemical composition) the artwork transcends.
      *   **Testing the One-Object View:** If the sculpture *just is* the marble, then insuring both is fraud (double indemnity). If the artwork is destroyed (smashed), the object is physically still there but changed. Under a one-object view, the object persists but loses properties. However, insurance relies on *loss*. If the object persists, what is the loss? The loss is purely relational/value-based. This makes insurance tricky because the physical risk hasn't materialized, only the economic status changed.
      *   **Consistency of the Practice:** The current practice is actually quite consistent *if* you accept the metaphysics of constitution. It distinguishes between "physical loss" and "constructive total loss" (where the item exists but is worthless as art). The ability to claim on the marble after the art is "gone" confirms they treat the lump as surviving the death of the statue.
      *   **Practical Implications:** If we forced a One-Object view:
