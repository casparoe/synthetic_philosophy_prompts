  **The Metaphysics of the Insurance Adjuster: A Comment on Art and Constituent Matter**

  You have hit on a fascinating instance of "folk metaphysics" embedded in institutional practice. Your intuition is correct: the standard practices of art valuation and insurance presuppose a specific ontological framework, often referred to in philosophy as the **Constitution View**. Under this view, the sculpture and the block of marble are distinct objects that coincide in space and time but possess different persistence conditions and properties.

  **The Presupposed Metaphysics: Constitution vs. Identity**

  The current bookkeeping practices rely on the idea that the artwork and the material are not identical. If they were identical (the One-Object or Identity View), insuring them separately would be logically incoherent. It would be akin to insuring "Clark Kent" and "Superman" against separate risks; if one is harmed, the other is necessarily harmed.

  However, insurers and appraisers act as though the artwork has a fragile existence that the marble does not share. When a sculpture is smashed, the *artwork* is destroyed, but the *marble* persists. This implies that the artwork has stricter persistence conditions than its constituent matter. The artwork requires a specific form, provenance, and artistic intention to exist. The marble merely requires physical continuity. By allowing a claim on the "artistic value" (total loss) while retaining the residual value of the "material" (salvage), the practice treats them as two separate bearers of value occupying the same space. This is the classic "Statue and Clay" paradox articulated by philosophers like Harold Wiggins or David Wiggins: the lump could survive being squashed into a ball; the statue cannot. The insurance policy respects this modal difference.

  **Can the One-Object View Work?**

  If we forced a One-Object view onto this system—asserting that the sculpture *just is* the marble—the practice would break down logically, though it might be salvageable economically.

  Under a strict Identity View, insuring both the "artwork" and the "marble" separately would constitute double-counting. You cannot have two distinct sums insured for one ontological entity. If the object is destroyed, everything is destroyed. If the object persists (as a pile of rubble), nothing is destroyed.

  To make the One-Object view work, insurers would have to redefine "loss." Loss could no longer be ontological (the cessation of the object) but purely functional or economic. The single object (the marble-statue) would remain in existence, but it would undergo a radical change in properties (from "valuable art" to "rubble"). The insurance payout would not be for the destruction of an object, but for the depreciation of that single object's status. While feasible, this complicates liability. It shifts the focus from physical damage to semantic reclassification, which is much harder to adjudicate. Who decides when the single object stops being art and starts being debris? The Constitution View solves this by saying the art object ceased to exist entirely, leaving only the matter object behind.

  **Consistency and Practical Implications**

  Is the current practice consistent? Yes, but only if you accept the Constitution View. The apparent contradiction you noted—insuring both separately while they coexist—is resolved by recognizing they cover different *risks*. The "artwork" policy covers aesthetic destruction (loss of form/status), while the "material" policy covers physical dispersion (loss of matter).

  However, there is a tension. If the sculpture *is* the marble, then destroying the sculpture should invalidate the marble policy (since the insured object is gone). But insurers allow claims on the residual material. This confirms they treat the material as a surviving entity.

  If we swapped in the One-Object view, appraisers and insurers would need to change their workflow significantly:

  1.  **Single Policy Structure:** There would be no separate lines for "fine art" and "material value." There would only be one policy for the object, with a value fluctuating based on its current status.
  2.  **Redefining Destruction:** "Total loss" would rarely apply physically. Instead, insurers would deal almost exclusively in "constructive total loss," where the object exists but is economically worthless.
  3.  **Salvage Rights:** The concept of salvage would change. Currently, the insurer pays for the art, takes the art, and sells the marble. Under the One-Object view, the insurer pays for the loss of value, and the client keeps the single object (the rubble), since the object itself never ceased to exist.

  **Conclusion**

  Your thought experiment reveals that the art market is quietly committed to a non-reductive metaphysics. They treat artistic value as emergent and distinct from physical substrate, not merely as a property of it. To adopt a One-Object view would require dismantling the distinction between "aesthetic destruction" and "physical damage," collapsing the nuanced risk management of the art world into a simpler, but less flexible, model of property depreciation. The insurance adjuster, it turns out, is a practical metaphysician, betting every day that the statue is not the clay.
