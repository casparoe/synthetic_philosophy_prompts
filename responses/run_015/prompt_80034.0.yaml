      *   **Problem:** Beta reader uses the phrase "main character syndrome" (MCS) inconsistently (sometimes compliment, sometimes warning).
      *   **Questions:**
          1.  Is it a real term or internet slang?
          2.  What precise claims is it making (about life experience, treating others, character realism)?
          3.  Which reading corresponds to which complaint (compliment vs. warning)?
          4.  Which version is defensible, which is a cliché, and which is false?
      *   **Constraint:** Answer in American English.

  2.  **Deconstruct "Main Character Syndrome" (MCS):**
      *   *Origin:* Internet slang/TikTok trend (circa 2020-2021). Originally referred to people acting like they are the protagonist of real life, often ignoring others' humanity.
      *   *Literary Application:* When applied to fiction, it's ambiguous. It can mean "strong protagonist" or "self-centered narrative tunnel vision."
      *   *The Beta Reader's Usage:*
          *   Compliment: "Protagonist is vivid, rest feel like furniture." -> This sounds backhanded. Usually, "furniture" is bad. But the user says it's *sometimes* a compliment. I need to parse this carefully. If the beta says "The MC is so vivid the rest feel like furniture," that's technically a criticism of the *supporting cast*, but praising the *MC's intensity*. However, in writing craft, "furniture" is almost always negative. I need to address the nuance: Is the *focus* good, or is the *flatness* of others acceptable for stylistic reasons?
          *   Warning: "You've written everyone else like a prop." -> This is definitely a criticism. It means the world lacks agency.

  3.  **Address the Specific Questions:**

      *   **Real Term vs. Slang:** It's primarily internet slang/psychology pop-culture, not a formal literary theory term.
      *   **Precise Claims:**
          1.  *Phenomenological Claim:* We experience life from a first-person perspective (ego-centricity).
          2.  *Ethical Claim:* Treating others as means to an end (Kantian violation).
          3.  *Aesthetic/Craft Claim:* Verisimilitude requires secondary characters to have interiority/agency.
      *   **Mapping to Complaints:**
          *   Compliment (Vivid MC): Focuses on the *Phenomenological Claim*. The narrative voice is strong.
          *   Warning (Props): Focuses on the *Ethical* and *Aesthetic Claims*. The world feels fake/unethical.
      *   **Defensible vs. Cliché vs. False:**
          *   *Defensible:* Secondary characters need agency for the world to feel real (Aesthetic).
          *   *Cliché:* The phrase itself is overused internet speak.
          *   *False:* The idea that *every* character needs equal depth (sometimes stylistic choice dictates otherwise). Or the idea that MCS is inherently bad in fiction (fiction *is* about the MC).

  4.  **Drafting the Response (Iterative Process):**

