          *   Claim 3: Verisimilitude (What makes fiction work).
      *   *Section 2: Mapping the Beta's Notes.*
          *   When she says it as a "compliment" (Vivid MC): She means the *Subjectivity* is working. The voice is strong. *Correction:* I need to point out that calling the rest "furniture" is still a critique, even if framed as a result of the MC's strength.
          *   When she says it as a "warning" (Props): She means the *Objectification* and *Verisimilitude* are failing. The world feels staged.
      *   *Section 3: The Verdict (Defensible, Cliché, False).*
          *   *Defensible:* The craft critique (secondary characters need agency).
