  Realist philosophers equate diagnostic stability with truth; instability suggests error. Clinical psychologists view patient insight as a compliance tool, not a phenotypic variable. The medical anthropologist assumes clinical refinement extends biomedical governance, not agency.

  **Q&A Defense Sheet**

  1. **Psychologist:** "This is impossible. Tracking meta-awareness doubles session time. We need protocols, not philosophy."
     *Reply:* Reflexive staging isn't extra time; it's higher-yield data. Ignoring the loop causes treatment failure when patients resist labels. Integrating awareness prevents dropout and strengthens the alliance, saving time long-term.
     *Weakness:* Assumes clinicians possess phenomenological training they typically lack.

  2. **Philosopher:** "If the category changes upon labeling, it lacks causal homeostasis. You are abandoning natural kinds entirely."
     *Reply:* I am dynamicizing kinds, not abandoning them. Homeostasis includes the feedback loop of self-conception. Stability isn't static; it is a managed equilibrium involving the subject's reaction to the classification.
     *Weakness:* Risks making the kind so flexible it loses predictive power across populations.

  3. **Anthropologist:** "This isn't care; it's surveillance. You're asking clinicians to monitor how patients internalize control."
     *Reply:* Surveillance ignores agency. Reflexivity empowers patients to co-author their symptom narrative, shifting power from institution to interaction. It makes power dynamics visible to be managed collaboratively.
     *Weakness:* Requires a therapeutic alliance often absent in managed care environments.

  4. **Psychologist:** "Doesn't this validate symptom fabrication? Patients will perform ADHD to access medication."
     *Reply:* Performance is data. Whether symptoms are 'authentically' neurological or 'played' matters less than the functional impairment caused by the performance. We treat the impairment regardless of origin.
     *Weakness:* Hard to distinguish strategic malingering from unconscious looping clinically.

  5. **Philosopher:** "How do you distinguish looping effects from natural developmental changes over time?"
     *Reply:* Track temporal correlation between diagnostic disclosure and symptom shift. Natural change is gradual; looping is often reactive to clinical encounters. We look for the specific trigger of the classification event.
     *Weakness:* Correlation isn't causation; confounding life variables remain difficult to isolate.

  6. **Anthropologist:** "ADHD is a structural mismatch with capitalism. Your model individualizes a political problem."
     *Reply:* Clinical staging addresses immediate suffering while acknowledging context. We must treat the patient present, not the ideal political future. Providing relief is not necessarily depoliticization of distress.
     *Weakness:* Risks depoliticizing distress by focusing on individual management over structural change.

  **Hope Nobody Asks:** "If the diagnosis fundamentally changes the patient, isn't the most ethical intervention to withhold the label entirely?"
  *Strategy:* Concede that labels alter ontology and carry significant risk of harm; do not deny the looping effect. Hold that withholding info violates autonomy and informed consent standards. Transparency is ethically mandatory; managing the consequence is clinical skill. Argue that hiding the truth is paternalistic, not protective.
