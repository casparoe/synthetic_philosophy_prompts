  4. We share guilt and value our friendship over winning this metaphysical debate.

  **Disagreements and Cruxes**

  | Issue | Team Omission (User) | Team Absence (Friend) | Crux & Gary Variant | Predictions & Move Conditions |
  | :--- | :--- | :--- | :--- | :--- |
