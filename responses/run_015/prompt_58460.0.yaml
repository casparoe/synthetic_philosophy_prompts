  **Resolution Path**
  The core crux is whether we select causes based on *physical processes* or *counterfactual dependence*.

  1.  **To move Team Omission:** Consider the "Infinite Fish" variant. You didn't save every other starving fish in the city today. Did your inaction *cause* their deaths? If you feel this is absurd, you admit some omissions aren't causes, weakening your stance on Gary.
