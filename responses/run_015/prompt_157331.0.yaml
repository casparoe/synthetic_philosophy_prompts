answer: |-
  (a) **Candidate Rules and Triggers**

  Based on verdicts 1–6, three general accounts survive. All treat the side-effect effect as driven by normative evaluation rather than pure conceptual analysis or causal reasoning.

  1.  **Moral Blameworthiness Theory**
      *   **Trigger:** The agent's blameworthiness for the outcome.
      *   **Mechanism:** Participants attribute "intentionality" when they judge the agent deserves blame for the side effect. If blame is mitigated (by effort, lack of control, or lack of moral weight), intentionality attribution drops.
      *   **Consistency:** Fits Pair 1 (Blameworthy indifference = FULL), Pair 2 (Mitigation reduces blame = NONE), Pair 3 (No moral weight = no blame = NONE), Pair 6 (Reduced control reduces blame = ATTENUATED).
      *   **Ruled Out By:** None of the six.

  2.  **Quality of Will / Attitude Theory**
      *   **Trigger:** The agent's regard for the affected party (ill will, indifference, or good will).
      *   **Mechanism:** Intentionality tracks the expression of the agent's attitudes. Indifference to harm expresses ill will (FULL). Effort to prevent harm expresses good will (NONE). Indifference to trivialities expresses no moral will (NONE).
      *   **Consistency:** Fits Pairs 1, 2, 3, 6. In Pair 6, voting against the program signals opposition (better will) than approving it, hence ATTENUATED.
      *   **Ruled Out By:** None of the six. (Note: This is empirically very close to Blameworthiness in these vignettes).

  3.  **Moral Norm Violation Theory**
      *   **Trigger:** Violation of a moral norm (distinct from conventional norms).
      *   **Mechanism:** Intentionality is attributed when a moral norm is breached as a side effect.
      *   **Consistency:** Fits Pair 1 (Harm = Violation), Pair 3 (Convention = No Violation = NONE).
      *   **Ruled Out By:** **Pair 6 (Overdetermination).** In Pair 6, the moral norm is violated by the board regardless of the CEO's action. If the trigger were simply "Did a moral violation occur?", the verdict should be FULL. The fact that it is ATTENUATED shows the *agent's specific relationship* to the violation (control/vote) matters, not just the violation itself. This rules out Act-Centric Norm theories in favor of Agent-Centric (Blame/Will) theories.

  **Accounts Ruled Out:**
  *   **Simple Outcome Valence:** (Bad = Intentional). Ruled out by **Pair 2**. Bad outcome occurred, but verdict was NONE due to mitigation effort.
  *   **Pure Causal Contribution:** (Causal role = Intentional). Ruled out by **Pair 1 vs. Pair 3**. Causal role is identical, but verdict differs based on moral weight.
  *   **Weak Pragmatic Ambiguity:** (The word "intentional" conversationally implies blame). Ruled out by **Pair 5**. If it were merely a conversational implicature, supplying glosses or changing wording to "deliberately" should eliminate the asymmetry. The supervisor's verdict of FULL under all wordings implies the judgment is conceptual or deeply normative, not a linguistic trick.

  (b) **Predictions for Pair 7**

  **1. Moral Blameworthiness Theory**
  *   **Prediction:** **NONE.**
  *   **Reasoning:** The manipulation check explicitly states ratings of "wronged" and "to blame" fall to the floor. If intentionality tracks blameworthiness, and blame is floor-level in the harm condition (due to consent + compensation), it must match the good condition (where blame is also floor-level). The asymmetry requires a blame gap; here, the gap is closed.
  *   **Sharpening:** This prediction holds provided the theory treats "valid consent + net benefit" as a full defeater for blame, equivalent to the mitigation in Pair 2.

  **2. Quality of Will / Attitude Theory**
  *   **Prediction:** **NONE** (likely) or **ATTENUATED**.
  *   **Reasoning:** The CEO states indifference ("does not care about villagers"). In Pair 1, indifference + harm = FULL. However, in Pair 2, effort to prevent harm (showing *some* regard) = NONE. In Pair 7, securing consent and providing better water shows *regard* for the villagers' welfare, overriding the stated indifference. If "actions speak louder than words," his will is interpreted as benevolent/neutral, not indifferent.
  *   **Sharpening:** If the theory prioritizes the *stated* mental state (indifference) over the *behavioral* mitigation, it might predict FULL. But given Pair 2 (where behavior overrode the outcome), the supervisor likely prioritizes behavioral mitigation. Thus, NONE is the stronger prediction.

  **3. Moral Norm Violation Theory (Agent-Centric)**
  *   **Prediction:** **NONE.**
  *   **Reasoning:** Consent and net benefit negate the norm violation. No norm is breached because the villagers waived the right and benefited. Without a norm violation, there is no trigger for the asymmetry.

  (c) **Best Guess at Supervisor's Verdict**

  **Verdict: NONE.**

  **Reasons:**
  1.  **The Pair 2 Precedent:** This is the strongest constraint on her thinking. In Pair 2, the harm *actually occurred* and the CEO was *indifferent* to the environment (cared only about profit), yet the verdict was NONE because he spent money to try to prevent it. Pair 7 is a "Super-Pair 2": he didn't just try to prevent harm; he successfully compensated for it, secured consent, and ensured a net benefit. If failed mitigation kills the asymmetry in Pair 2, successful mitigation + consent must kill it in Pair 7.
  2.  **The Manipulation Check:** She provided you with the blame ratings ("fall to the floor"). She would not include this data unless it was the key to the prediction. She is signaling that since Blame = 0, Intentionality must = 0 (relative to the good case).
  3.  **Consistency with Pair 3:** In Pair 3, a "bad" outcome (breach of tradition) yielded NONE because it lacked moral weight. In Pair 7, the "bad" outcome (contamination) is morally neutralized by consent. She treats moral status, not raw outcome valence, as the driver.

  (d) **Discriminating Vignette Pair**

  **Evaluation of Your Ideas:**
  *   **Self-Directed Variant:** (Side effect ruins/improves agent's own health).
      *   **Discriminates:** **Yes.** This separates **Moral Blame** theories from **Outcome Valence** theories.
      *   **Why:** If the rule is "Bad Outcome = Intentional," self-harm should be FULL. If the rule is "Blameworthy to Others = Intentional," self-harm should be NONE (you generally aren't blameworthy to others for self-harm side effects).
      *   **Limitation:** It does not separate Blameworthiness from Quality of Will (both might predict NONE if the agent is indifferent to self).
  *   **Automated System Variant:** (AI planner).
      *   **Discriminates:** **No.** This separates **Mind/Agency** theories from **Functionalist** theories. However, all three surviving rules above (Blame, Will, Norms) require a moral agent. All three would predict NONE for a robot (robots can't be blameworthy or have moral will). This doesn't help choose between the survivors.

  **Better Proposal: The "Reluctant Agent" Pair**
  *   **Setup:**
      *   **Harm Condition:** CEO *wants* to help the environment but knows the program will harm it (for profit). He expresses regret but proceeds.
      *   **Help Condition:** CEO *wants* to harm the environment (cost-cutting) but knows the program will help it. He expresses regret but proceeds.
  *   **Predictions:**
      *   **Moral Blameworthiness:** **ATTENUATED or NONE.** Reluctance reduces blame in the Harm condition.
      *   **Outcome Valence:** **FULL.** The outcome is still Bad vs. Good.
      *   **Quality of Will:** **NONE or REVERSED.** If he *wants* the opposite of the side effect, his will is not aligned with the harm.
  *   **Why Better:** This directly pits **Attitude/Will** against **Outcome Valence**. Your Self-Directed variant tests *Who* is harmed; this tests *How the Agent Feels* about the harm. Given her Pair 2 verdict (Effort > Outcome), she likely prioritizes Attitude. This vignette isolates Attitude from Effort.

  (e) **Uninformative but Constraining Verdicts**

  **Pair 5 (Wording)** looks like a standard robustness check (boring methodology), but it is **sharply constraining**.
  *   **Why:** In the literature, a major competing explanation is the "Pragmatic Ambiguity" hypothesis (people think "intentional" means "blameworthy" only because of conversational norms). If this were true, clarifying the definition (glosses) or changing the word ("deliberately") should make the effect vanish.
  *   **Constraint:** By committing to **FULL** across all wordings, your supervisor rules out any theory that relies on linguistic ambiguity or weak conversational implicature. She forces the theory to be about the *concept* of intentional action itself being morally laden, or about a judgment so deep it survives explicit definitional correction. This eliminates roughly half of the existing theoretical landscape without her having to argue for it explicitly.

  **Pair 4 (Knowledge)** also looks like a control but is constraining.
  *   **Constraint:** It shows the effect is not unique to *action* concepts. It bleeds into *epistemic* concepts ("knew"). This rules out theories that locate the effect in specific features of "action" (like volition or motor control) and supports theories that locate it in general moral evaluation (Blame) which influences multiple attribution types.
