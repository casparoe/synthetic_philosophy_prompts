prompt: |-
  I'm in a philosophy of biology reading group and we've been stuck on Popper and Darwin for like three weeks now. The split is basically this: one faction thinks Popper's original line — that natural selection is a "metaphysical research programme," not a falsifiable scientific theory — was genuinely onto something, and that his later reversal was more about social pressure from biologists than about the logic of the situation. The other faction thinks the original critique was sloppy from day one, built on a strawman of how evolutionary explanation actually works, and that his eventual admission that natural selection is testable was just him finally getting it right.

  We've decided to stop circling and try to write something both sides could actually sign. Could you draft the adversarial-collaboration document we'd produce if we did this properly? Here's what I'm picturing:

  First, a numbered list of claims both camps agree on after hashing it out — about what Popper said and when, about the logical structure of selection explanations, about what "testability" demands, about the actual practices of evolutionary biologists. These need to be substantive, not just "we agree that Popper was a philosopher." If one side had to give ground on something to get here, that should show up in the claims.

  Second, a disagreements table. Each row: the exact dispute, worded so each camp would nod at its own side's formulation; the crux that would settle it; and a concrete case or piece of evidence both sides agree bears on the crux, with each camp's prediction written down in advance.

  Third, a section diagnosing whether any of this is actually a verbal dispute. I've got a hunch that "falsifiability" might mean something different to a Popperian than it does to a working biologist, and that might be doing a lot of the work — but maybe there are other candidates too.

  Format: agreed claims first, then the table, then the verbal-dispute bit. And don't sand the edges off — if one camp has to swallow something uncomfortable for the collaboration to be honest, put it in there.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy of biology reading group stuck on Popper and Darwin (specifically Popper's 1974 claim that natural selection is a "metaphysical research programme" vs. his 1978 retraction).
      *   **Task:** Draft an "adversarial-collaboration document" that both factions (Pro-Popper-1974 and Pro-Popper-1978/Biologists) could sign.
      *   **Structure:**
          1.  Numbered list of agreed claims (substantive, showing where ground was given).
          2.  Disagreements table (Dispute, Crux, Agreed Evidence/Case, Predictions from both sides).
          3.  Diagnosis of verbal disputes (semantic vs. substantive).
      *   **Tone:** Honest, not sanding off edges, acknowledging uncomfortable concessions.
      *   **Key Content:** Popper's statements/timeline, logical structure of selection, testability criteria, biological practice.

  2.  **Deconstruct the Philosophical Debate (Popper vs. Darwin):**
      *   *Popper's 1974 Claim:* "Darwinism is not a testable scientific theory, but a metaphysical research programme." Why? Because "survival of the fittest" seemed tautological (who are the fittest? those who survive). It lacked predictive power regarding *specific* mutations.
      *   *The Criticism:* Biologists and philosophers (like Dennett, Sober) argued this ignores how selection hypotheses are actually tested (e.g., specific adaptations in specific environments, experimental evolution).
      *   *Popper's 1978 Retraction:* He admitted he was wrong, that natural selection *is* testable, though he still held some reservations about its status compared to physics.
      *   *The Factions:*
          *   Faction A (Original Popper): Selection is too flexible/tautological to be strictly falsifiable without auxiliary assumptions. It functions more as a guiding framework.
          *   Faction B (Revised Popper/Biologists): Selection hypotheses are specific, empirically constrained, and falsifiable. Popper's initial critique was based on a misunderstanding of biological methodology.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to capture the historical facts (1974 vs. 1978).
      *   Need to capture the logical nuance (tautology risk vs. empirical application).
      *   Need to capture the methodological reality (biologists *do* test things).
      *   *Concession for Faction A:* Must admit biologists don't actually treat it as metaphysics in practice.
      *   *Concession for Faction B:* Must admit the *general principle* of selection is harder to falsify in isolation than specific selection hypotheses.
      *   *Drafting points:*
          1.  Popper's 1974 statement exists and was explicit.
          2.  Popper's 1978 retraction exists and was explicit.
          3.  "Survival of the fittest" *can* be read tautologically, but isn't *necessarily*.
          4.  Biologists test specific adaptation hypotheses, not just "selection happens."
          5.  Falsifiability applies to specific models, not necessarily the general meta-principle.
          6.  Auxiliary assumptions (heritability, variation) are crucial.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need specific points of contention.
      *   *Dispute 1: The Unit of Assessment.* Is the "theory" the general principle or specific hypotheses?
      *   *Dispute 2: The Role of Auxiliaries.* Does relying on auxiliary assumptions (like genetics) make it unfalsifiable or just complex?
      *   *Dispute 3: Explanatory Power.* Does calling it "metaphysical" diminish its scientific value?
      *   *Crux:* What settles it? Usually a specific case study (e.g., Kettlewell's moths, Lenski's E. coli, or a null model test).
      *   *Predictions:* Faction A predicts high flexibility/resilience to counter-evidence. Faction B predicts clear falsification conditions.
      *   *Selection:* Let's use the "Null Model" debate (Neutral Theory vs. Selection). This is the battleground where "is it selection or drift?" is tested.

  5.  **Drafting Section 3: Verbal Dispute Diagnosis:**
      *   *Falsifiability:* Popper meant logical falsifiability (in principle). Biologists mean methodological falsifiability (in practice with stats).
      *   *Theory:* Popper meant a unified deductive system (like Newton). Biologists mean a family of models.
      *   *Metaphysical:* Popper meant "useful but not testable." Critics hear "meaningless" or "pseudoscience."
      *   *Tautology:* Is "fitness = reproductive success" a definition or an empirical correlation?

  6.  **Refining and Polishing:**
      *   *Check Tone:* Is it too neutral? The prompt asks *not* to sand edges off. Ensure Faction A's concession (that biologists ignore Popper's warning) and Faction B's concession (that the general principle is hard to pin down) are sharp.
      *   *Check Accuracy:* Ensure Popper's quotes/positions are represented fairly. (1974 "Unended Quest", 1978 "Natural Selection and the Emergence of Mind").
      *   *Formatting:* Use clear headings, numbered lists, and a markdown table.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe focus on the tautology objection.
      *   *Correction:* That's too old. The real debate is about testability and the structure of explanations. Focus on the "Metaphysical Research Programme" label.
      *   *Initial thought:* Use Peppered Moths as the case study.
      *   *Correction:* Too cliché and historically messy. Use the Neutral Theory of Molecular Evolution (Kimura) vs. Selectionism. It directly addresses whether we *must* invoke selection to explain data.
      *   *Make sure the "Concessions" are visible:* In the agreed claims, explicitly note where one side had to soften a stance.

  8.  **Final Polish:** Check against the prompt requirements one last time.
      *   Numbered list of claims? Yes.
      *   Disagreements table (Dispute, Crux, Evidence, Predictions)? Yes.
      *   Verbal dispute diagnosis? Yes.
      *   No sanding edges? Yes.

