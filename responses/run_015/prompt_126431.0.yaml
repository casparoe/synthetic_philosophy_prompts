      Why Skinnerian second? Because it adds "learning within a lifetime" to the Darwinian base.
      Why Popperian third? Because it adds "pre-selection of actions" to the Skinnerian base.
      Why Gregorian fourth? Because it adds "cultural scaffolding" to the Popperian base.
      *Crucial Point:* If you do Gregorian before Popperian, writers assume language *is* thought. You need to establish that non-linguistic simulation (Popperian) is possible first, otherwise, the Gregorian layer looks like the *source* of intelligence rather than an *amplifier*.

