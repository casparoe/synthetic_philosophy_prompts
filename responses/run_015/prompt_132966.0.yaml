  *Re-evaluating the "Single Example" constraint:* The user asks "which single example should carry the whole thing (and why that one and not the others)". This implies I should pick one to be the star. However, the dataset has 5 distinct parts. If I ignore 4 of them, the teacher might be annoyed. The best advice is: Use the **Beetles** as the main narrative thread, but use the others as specific "counter-punches." I will explain *why* the Beetles are the anchor (transitive property failure is the deepest conceptual hurdle).

  *Wait, looking at the Friend's DNA comment:* I need to make sure I don't just say "DNA is hard." I need to explain *why* sequencing doesn't solve the definition problem (variation within species vs between species overlap). The DNA Cutoff case (4) covers this perfectly.

  *Final Plan Structure:*
  1.  Strategic Decisions (The "Why" behind the plan).
