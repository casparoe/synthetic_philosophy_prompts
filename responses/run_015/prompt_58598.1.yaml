  Something about that feels a bit too strong, especially the part about other people's experiences being useless and decision theory totally breaking. Is that a fair summary? Like can you go through what he got right, what he blurred together, and what a defender of the view would push back on? And does his leap conclusion actually follow if you fix the details?

  The reason I care is I'm considering signing up for this month-long thing at my uni next semester where you live like 8 hours a day in a bat-sim VR with echolocation audio and inverted sleep, and past participants all say you can't get what spatial hearing is like until you try it and that they came back valuing solitude and nighttime totally differently. Would that even count as transformative on the proper understanding, and does that mean I can't rationally decide whether to do it?

  oh and please answer in American English, my TA is picky about spelling lol
