  4.  **Identify What They Are Missing (Synthesis):**

      *   *The Function of Law:* Law isn't just describing reality; it's *creating* institutional facts. Once the bill passes, 200 trees/acre *makes* it a forest legally, regardless of metaphysics.
      *   *The Purpose of the Definition:* Carbon credits need measurability. Vagueness creates loopholes.
