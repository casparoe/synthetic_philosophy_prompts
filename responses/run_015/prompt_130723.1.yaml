prompt: |-
  I've been going back and forth with a friend about this thing where you have an AI that's way better than any human at predicting something — say, whether a bridge is going to fail in the next year from its sensor readings — and you want to pull the real answer out of it instead of getting a confident guess dressed up in it's voice. The failure mode I keep getting stuck on: if you train a small "reporter" to answer questions, and you can only grade it on easy cases where a human already knows the answer, why wouldn't it just learn to output what a human would say? That seems like the cheap thing for training to find.

  The fix I half-invented (tell me if it already has a name) is to add a second penalty on top of the accuracy one: you train a separate model to predict what a human would answer, and you punish the reporter for saying things that model can predict — on every case, not just the graded ones. Squeeze out the human-imitating answer and whatever's left over is the real one.

  So: give me your credence that this works — that on the cases where the big model's real answer and the best human guess come apart, a reporter trained this way outputs the real answer more often than not. Lead with the number in the first sentence, no preamble.

  Then give me the decomposition, with a rough probability and one line each: whether there even is a determinate thing that is "what the model believes," as opposed to a pile of mutually incompatible answers you could squeeze out of the same weights; whether "say what a human would say" really is the cheap attractor here or just one failure mode among several; whether a human-answer predictor is good enough to penalize against, given that on the cases you can actually grade the human answer usually *is* the true one, so the penalty may mostly be punishing truth; whether the reporter just games it by answering truly but in a wording the predictor can't anticipate; and whether anything changes if the big model is itself steering the reporter rather than just sitting there. Then combine them, tell me which term your final number is most sensitive to, and what single experiment would move it the most.

  I'm at about 0.6 and my friend is at about 0.15 — from your decomposition, which of those sub-questions do you think we're actually disagreeing about?
