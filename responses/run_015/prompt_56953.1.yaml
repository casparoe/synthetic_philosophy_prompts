answer: |-
  # The Moral Testimony Position Finder

  **Instructions:** Read each scenario and select the option that best matches your intuitive reaction. There are no right answers, only mapping points. Keep track of your choices (e.g., 1A, 2C, 3B).

  ### The Quiz

  **1. The Partner's Plea**
  Your partner, whom you trust deeply, tells you that eating meat is morally wrong. You stop eating meat immediately. When asked why, you admit you don't understand the argument and couldn't defend it to anyone else.
  *   **A.** You have grasped the moral truth; understanding the argument isn't required for knowing the fact.
  *   **B.** You haven't truly grasped the wrongness; you have only adopted a habit of compliance.
  *   **C.** You have grasped the truth, but your inability to explain it makes your moral stance fragile and immature.

  **2. The Friend's Warning**
  A close friend tells you that a colleague is subtly disrespecting you in meetings. You have noticed nothing of the sort yourself.
  *   **A.** You should accept their judgment; they see the social dynamics more clearly than you do.
  *   **B.** You should thank them for looking out, but you cannot treat the colleague differently until you see the disrespect yourself.
  *   **C.** You should accept their judgment and act on it, even if you remain personally unconvinced.

  **3. The Gut Check**
  A respected ethicist publishes a paper arguing that a specific charitable practice you love is actually harmful. Your vivid first-person experience says otherwise.
  *   **A.** You should defer to the expert; your personal experience is likely biased or limited.
  *   **B.** You should stick with your experience; moral understanding requires personal resonance.
  *   **C.** You should suspend your donations while investigating, acknowledging their expertise despite your feelings.

  **4. The Committee Vote**
  You sit on a board. The Chair argues that a proposal is unjust. You vote against the proposal because of the Chair's testimony, though you remain personally unconvinced it is unjust.
  *   **A.** This is hypocritical; you should not vote on moral grounds you do not personally hold.
  *   **B.** This is responsible; you are acknowledging institutional expertise despite your private doubt.
  *   **C.** This is impossible; if you voted based on their word, you must have believed them.

  **5. The Child's Question**
  A child asks if lying is wrong. You say "Yes," because your parents told you so, not because you have derived it from first principles.
  *   **A.** This is a valid way to acquire moral knowledge; we all start somewhere.
  *   **B.** This is merely behavioral training; real moral knowledge requires autonomous reasoning.
  *   **C.** This is a necessary temporary stage, but remaining here as an adult would be a failure.

  **6. The Emergency Triage**
  In a crisis, a senior doctor tells you to prioritize Patient A over Patient B based on "moral need." You don't see the difference but follow the order.
  *   **A.** You acted correctly; the urgency demanded trust over understanding.
  *   **B.** You acted mechanically; the moral worth of the act is diminished by your lack of insight.
  *   **C.** You acted correctly and understood the moral weight through the doctor's authority.

  **7. The Religious Directive**
  Your religious leader says "Give to the poor." You do it mechanically, without feeling any empathy or understanding of the utility.
  *   **A.** The act has full moral worth; obedience to rightful authority is sufficient.
  *   **B.** The act lacks moral worth; true morality requires internal conviction.
  *   **C.** The act has positive worth, but you are missing the virtue of compassion.

  **8. The Historical Verdict**
  You read a history book that convinces you a past historical figure was villainous. You change your view solely on the author's testimony.
  *   **A.** You now know they were villainous; testimony is a source of moral history.
  *   **B.** You have a true belief, but you don't *know* it until you review the evidence yourself.
  *   **C.** You know it, but you should feel uneasy about relying on a second-hand account for moral judgment.

  ***

  ### Scoring Key

  Calculate two separate scores based on your choices.

  **Axis 1: Epistemic Reach (E)**
  *Does accepting testimony allow you to grasp moral truth/knowledge?*
  *   **Add 1 point** for each: 1A, 2A, 3A, 4C, 5A, 6C, 7A, 8A.
  *   **Add 0 points** for each: 1C, 2C, 3C, 5C, 6A, 7C, 8C.
  *   **Add -1 point** for each: 1B, 2B, 3B, 4A, 4B, 5B, 6B, 7B, 8B.
  *   **Range:** -8 to +8.
  *   **High Score (+):** Testimony can yield knowledge/understanding.
  *   **Low Score (-):** Testimony cannot yield knowledge/understanding.

  **Axis 2: Normative Weight (N)**
  *Is deferring to testimony ever the right or admirable thing to do?*
  *   **Add 1 point** for each: 1A, 2A, 2C, 3A, 3C, 4B, 5A, 6A, 7A, 8A.
  *   **Add 0 points** for each: 1C, 5C, 6C, 7C, 8C.
  *   **Add -1 point** for each: 1B, 2B, 3B, 4A, 5B, 6B, 7B, 8B.
  *   **Range:** -8 to +8.
  *   **High Score (+):** Deferring is right/admirable.
  *   **Low Score (-):** Deferring is wrong/inauthentic.

  ***

  ### The Grid: Where You Land

  Plot your **Epistemic (E)** score on the horizontal and **Normative (N)** score on the vertical.

  | | **Epistemic Optimist (E+)** | **Epistemic Pessimist (E-)** |
  | :--- | :--- | :--- |
  | **Normative Optimist (N+)** | **The Confident Trustee**<br>*(Standard Reductionism)*<br>Testimony gives knowledge, and trusting is virtuous. | **The Pragmatic Deferer**<br>*(Faith/Practice View)*<br>Testimony doesn't give knowledge, but you should act on it anyway. |
  | **Normative Pessimist (N-)** | **The Guilty Knower**<br>*(Virtue Skeptic)*<br>Testimony gives knowledge, but relying on it is morally lazy. | **The Strict Autonomist**<br>*(Strong Pessimism)*<br>Testimony gives neither knowledge nor moral worth; think for yourself. |

  ***

  ### Discriminator Note: Item 4
  **Item 4 (The Committee Vote)** is the primary splitter for the bottom row.
  *   It distinguishes **The Pragmatic Deferer (E-, N+)** from **The Strict Autonomist (E-, N-)**.
  *   Both positions agree you do not truly *know* the proposition is unjust (Epistemic Pessimism).
  *   Option **4B** pulls you toward the Pragmatic Deferer (deference is responsible/admirable despite lack of belief).
  *   Option **4A** pulls you toward the Strict Autonomist (deference is hypocritical without belief).
  *   Option **4C** is a trap for those who cannot conceive of acting without believing, pushing them to the top row.

  ***

  ### Limitations & Diagnosis

  **1. Indistinguishable Pair: The Confident Trustee (E+, N+) vs. The Guilty Knower (E+, N-)**
  This quiz cannot cleanly separate these two cells. Both positions agree that testimony *can* transmit moral truth. The difference lies entirely in a secondary evaluation of the agent's character (is it virtuous to rely on it?), which is hard to capture in scenario-based intuition pumps. Most users who select "You know it's wrong" will also select "You did the right thing," collapsing the distinction.

  **2. The Empty Cell: The Guilty Knower (E+, N-)**
  This cell is likely to come out empty or nearly empty.
  **Diagnosis:** **Unattractive/Unstable.** While theoretically coherent (one can grant epistemic power while denying normative virtue), it is psychologically unstable. If a subject believes testimony *successfully delivers moral truth*, they rarely conclude that accepting it is *admirable* to resist. It requires holding that knowledge is accessible but touching it is contaminating, which is a niche virtue-ethics stance not well-triggered by general scenarios.
