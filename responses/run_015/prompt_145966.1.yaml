prompt: |-
  I just moved into a co-housing building and we're voting next week on a communal solar-plus-battery retrofit versus staying on the municipal grid, and suddenly risk-weighted expected utility feels personal—my roommate's auditing a decision-theory seminar and she's trying to convince me that standard expected utility with a curved u() can't capture why we're scared of the blackout tail even though the bills are almost certainly higher. I need a teaching plan for her, not the actual lecture: the dependancy order so she sees why the probability weighting has to be conceptually seperate from risk aversion inside the utility function, and the carrying example that should stick—which needs exactly one high-probability small loss (the monthly cost bump) and one low-probability catastrophic failure (storm-induced grid collapse where batteries save us), plus this vague "energy sovereignty" value that shouldn't be quantified but shouldn't disappear either.

  What misconceptions will she bring—probably that we're double-counting risk or that this is just Bayesian subjective expected utility—and at which point in the arc should I defuse each? What's the check that shows she actually understands the weighting mechanism rather than memorizing the integral form? And please tell me explicitly what to leave out, like the full axiomatic derivation, since she's not math-track. One more thing: I keep mixing this up with rank-dependent formulations in my head, so build the plan so it doesn't depend on knowing those distinctions cold, but don't let me accidentally conflate them when I'm explaining it to the co-op board. No reading lists, just the conceptual dependency map and misconception sequence.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Context:** Co-housing building voting on solar-plus-battery vs. municipal grid.
      *   **Problem:** Roommate (auditing decision theory) argues standard Expected Utility (EU) with curved $u(x)$ captures everything. User believes probability weighting (fear of tail risk/blackouts) is distinct from risk aversion (cost).
      *   **Goal:** A teaching plan for the roommate to understand why probability weighting is conceptually separate from utility curvature.
      *   **Constraints:**
          *   No actual lecture, just the plan/dependency order.
          *   Specific example required: High-probability small loss (cost) + Low-probability catastrophic failure (blackout) + Vague "energy sovereignty" (unquantifiable but present).
          *   Address misconceptions: Double-counting risk, Bayesian Subjective Expected Utility (SEU) confusion.
          *   Verification: A check to ensure understanding beyond memorizing formulas.
          *   Exclusions: No full axiomatic derivation (not math-track).
          *   User Constraint: User mixes up Rank-Dependent Utility (RDU) and Probability Weighting. The plan must avoid requiring deep RDU knowledge but prevent conflation during explanation to the board.
          *   Format: Conceptual dependency map and misconception sequence. No reading lists.

  2.  **Deconstruct the Core Conflict:**
      *   *Standard EU:* $E[U(x)] = \sum p_i u(x_i)$. Risk aversion is handled by $u''(x) < 0$.
      *   *The Roommate's Claim:* "We are just risk-averse. The curved utility function explains why we pay extra to avoid the blackout."
      *   *The User's Intuition:* "No, it's not just about the money value of the outage. It's about the *probability* of the outage feeling larger than it is. Also, 'sovereignty' isn't money."
      *   *The Theoretical Reality:* Standard EU *can* model risk aversion via $u(x)$. However, it struggles to explain why people simultaneously buy insurance (risk averse) and lottery tickets (risk seeking) or why small probabilities are overweighted (Allais Paradox style). To capture the *specific fear of the tail* independent of the monetary loss valuation, you need Probability Weighting (Prospect Theory/Cumulative Prospect Theory).
      *   *The "Sovereignty" Issue:* This is a non-monetary attribute. Standard EU requires a single scalar outcome. If sovereignty is an attribute, it needs to be part of the outcome vector or a separate term.

  3.  **Drafting the Dependency Map (The Arc):**
      *   *Step 1: Establish the Baseline (Standard EU).* Define the variables clearly.
      *   *Step 2: The Calibration Problem.* Show where Standard EU breaks with the specific example. If we fit $u(x)$ to the monthly cost, does it explain the blackout fear? Usually, you need insane risk aversion to justify the cost for the low-prob event.
      *   *Step 3: Introduce Probability Weighting.* Separate $p$ from $\pi(p)$.
      *   *Step 4: The "Sovereignty" Variable.* Handle the unquantifiable value without forcing a dollar amount.
      *   *Step 5: Synthesis.* How to present this to the board without jargon.

  4.  **Addressing Misconceptions:**
      *   *Misconception 1: Double Counting.* Roommate thinks weighting $p$ AND curving $u$ counts risk twice. *Defuse:* One is about valuation of outcomes (diminishing returns), one is about perception of likelihood (fear of rare events).
      *   *Misconception 2: Bayesian SEU.* Roommate thinks "just update the probability." *Defuse:* It's not about the *objective* $p$ being wrong; it's about the *decision weight* differing from $p$ due to psychology/regret.
      *   *Misconception 3: RDU Confusion (User's worry).* Keep it simple. Don't mention "rank-dependent." Just talk about "weighting the tail."

  5.  **Designing the Carrying Example:**
      *   *Option A (Grid):* Cost \$100/mo, 99% reliability.
      *   *Option B (Solar):* Cost \$150/mo, 100% reliability (during storm).
      *   *Event:* Storm (1% chance). Grid fails (0 utility). Solar works (full utility).
      *   *Sovereignty:* A "peace of mind" adder that doesn't fit in \$ but shifts the threshold.

  6.  **Developing the Understanding Check:**
      *   Don't ask for the formula. Ask for a prediction. "If the storm probability drops from 1% to 0.1%, how much less should we be willing to pay?" In Standard EU, it scales linearly with probability. In Weighted EU, the drop in willingness-to-pay is *less* than linear because the weight $\pi(p)$ stays sticky for small probabilities.

  7.  **Refining for the User's Constraints:**
      *   *User's Math Anxiety:* The user worries about RDU. I need to explicitly tell them *not* to mention RDU to the roommate or the board. Stick to "Probability Weighting" as a conceptual layer.
      *   *Board Presentation:* The board doesn't care about theory. They care about the vote. The teaching plan is for the roommate, but the output must help the user explain to the board.
      *   *Sovereignty:* Needs to be treated as a "lexicographic preference" or a "constraint" rather than a utility unit to avoid quantification fights.

  8.  **Finalizing the Structure:**
      *   **Phase 1: The Setup (Standard EU).**
      *   **Phase 2: The Break (Calibration).**
      *   **Phase 3: The Fix (Weighting).**
      *   **Phase 4: The Intangible (Sovereignty).**
      *   **Misconception Traps.**
      *   **The "Litmus Test" (Check).**
      *   **Board Talk Guidelines (Avoiding RDU trap).**

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I distinguish enough between Risk Aversion ($u$) and Probability Weighting ($\pi$)?
      *   *Fix:* Make sure the "Calibration" step highlights that to justify the solar cost via $u(x)$ alone, the roommate must assume the co-op is impossibly risk-averse regarding money, which contradicts other spending behaviors.
      *   *Critique:* Is the Sovereignty part clear?
      *   *Fix:* Frame it as a "threshold constraint." If sovereignty is missing, utility is $-\infty$ (or effectively so), regardless of cost. This sidesteps quantification.
      *   *Critique:* User asked to avoid RDU confusion.
      *   *Fix:* Add a specific "Do Not Say" section regarding cumulative probabilities and ranking. Keep it to "weighting the specific bad outcome."

  10. **Final Polish:** Ensure tone is instructional but concise, matching the "teaching plan" request. (Proceed to generate output).

  *(Self-Correction on the "Sovereignty" aspect)*: The prompt says "shouldn't be quantified but shouldn't disappear." In decision theory, this is tricky. If it's not quantified, it's not in the function. I need to suggest treating it as a *separate dimension* or a *pre-screening constraint* (satisficing) rather than part of the utility integral. This avoids the "how many dollars is sovereignty" fight.

  *(Self-Correction on RDU)*: The user says "don't let me accidentally conflate them." I need to explain *why* they are conflating them (both deal with probabilities) but give a heuristic to keep them apart (RDU is about the math structure of cumulative probabilities; Weighting is the psychological intuition). For the board, just call it "Resilience Valuation."

  *(Final Plan Structure)*:
  1. Conceptual Dependency Map (The Flow).
  2. The Carrying Example (The Numbers).
  3. Misconception Sequence (The Traps).
  4. The Understanding Check (The Test).
  5. Board-Specific Guardrails (The RDU Safety).
  6. Exclusions (What to cut).

