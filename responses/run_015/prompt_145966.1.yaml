answer: |-
  ### Teaching Plan: Separating Risk Aversion from Probability Weighting

  **Goal:** Convince your roommate that standard Expected Utility (EU) cannot explain the co-op's willingness to pay for solar without assuming irrational levels of monetary risk aversion, and that "probability weighting" is the missing conceptual layer.

  **Constraint:** Do not use axiomatic derivations. Do not use Rank-Dependent Utility (RDU) terminology. Keep "Energy Sovereignty" unquantified but structurally present.

  ---

  ### 1. Conceptual Dependency Map (The Arc)
  *Teach in this exact order. Do not skip steps.*

  **Step 1: Define the Standard Model (The Roommate's Baseline)**
  *   **Concept:** Expected Utility = $\sum (\text{Probability} \times \text{Utility of Outcome})$.
  *   **Role of $u(x)$:** Curvature represents *risk aversion* (diminishing marginal value of money).
  *   **Role of $p$:** Probabilities are objective and linear. A 1% risk is exactly 0.01 weight.
  *   **Checkpoint:** Ensure she agrees that in this model, the only way to justify paying extra for safety is if losing money hurts *disproportionately* more than gaining it helps.

  **Step 2: The Calibration Trap (The Break)**
  *   **Concept:** If we use *only* $u(x)$ to explain the solar vote, we create a contradiction.
  *   **Action:** Apply the model to the Carrying Example (below).
  *   **Result:** To justify the monthly cost bump via standard EU, the utility function must be so curved that the co-op would never spend money on *anything* risky (e.g., building maintenance, social events).
  *   **Conclusion:** Standard risk aversion is insufficient to explain the specific fear of the blackout tail.

  **Step 3: Introduce Probability Weighting (The Fix)**
  *   **Concept:** Decision Weight $\neq$ Objective Probability.
  *   **Mechanism:** We psychologically inflate small probabilities of catastrophic outcomes ($\pi(0.01) > 0.01$).
  *   **Distinction:** $u(x)$ values the *outcome* (money/comfort); $\pi(p)$ values the *likelihood* (fear/hope). They are separate dials.
  *   **Checkpoint:** She must accept that we can be risk-neutral with money but still "risk-averse" regarding probabilities.

  **Step 4: The "Sovereignty" Constraint (The Unquantifiable)**
  *   **Concept:** Some values are lexicographic (order-based), not cardinal (number-based).
  *   **Mechanism:** Treat "Energy Sovereignty" not as a utility number, but as a **filter**.
  *   **Rule:** If Option A has Sovereignty and Option B does not, Option B is disqualified regardless of cost, unless the cost difference threatens survival.
  *   **Why:** This keeps it from disappearing without forcing a fake dollar value.

  ---

  ### 2. The Carrying Example (Stick to These Numbers)
  *Use this specific scenario to anchor the theory. Do not complicate the math.*

  **The Choice:**
  *   **Option G (Grid):** \$100/month. 99% chance of power. 1% chance of total blackout (Storm).
  *   **Option S (Solar+Battery):** \$150/month. 100% chance of power (Storm proof).

  **The Variables:**
  1.  **High-Prob Small Loss:** The \$50/month premium (\$600/year).
  2.  **Low-Prob Catastrophe:** The 1% annual storm risk where Grid = 0 utility.
  3.  **Sovereignty:** The psychological value of independence (unquantified).

  **The Calculation (For Step 2):**
  *   Ask her: "What dollar value of 'blackout pain' makes the \$600/year premium worth it in Standard EU?"
  *   *Math:* $600 = 0.01 \times \text{Value of Blackout}$.
  *   *Result:* Value of Blackout = \$60,000.
  *   *The Trap:* Is a single blackout actually worth \$60k to us in lost food/spoilage/comfort? If not, Standard EU says "Don't Buy Solar."
  *   *The Pivot:* If we *feel* like it is worth \$60k, is it because the blackout is actually that expensive ($u(x)$), or because the 1% feels like 10% ($\pi(p)$)?

  ---

  ### 3. Misconception Sequence (Defuse in Order)

  **Misconception 1: "We're Double-Counting Risk"**
  *   *Her Argument:* "If you curve $u(x)$ AND weight $p$, aren't you punishing the risk twice?"
  *   *Defuse Point:* **Step 3.**
  *   *Explanation:* No. $u(x)$ answers "How bad is it to be cold?" $\pi(p)$ answers "How much do I worry about the chance of being cold?" You can be calm about money (flat $u$) but paranoid about storms (weighted $p$). They measure different psychological inputs.

  **Misconception 2: "It's Just Bayesian Subjective Probability"**
  *   *Her Argument:* "We just think the storm probability is higher than the meteorologists say. It's still linear $p$."
  *   *Defuse Point:* **Step 3.**
  *   *Explanation:* If we truly believed the storm risk was 10%, we would buy generators, sandbags, and move to higher ground. We don't. We only pay the \$50 premium. This shows we know the risk is low (objective $p$), but we *weight* it heavily (decision $\pi$) specifically for this decision context.

  **Misconception 3: "Sovereignty is Just a Higher Utility Value"**
  *   *Her Argument:* "Just assign sovereignty a dollar amount and put it in $u(x)$."
  *   *Defuse Point:* **Step 4.**
  *   *Explanation:* If we quantify it, we imply there is a price where we would sell our sovereignty (e.g., "We'd give up sovereignty for \$1M"). The co-op ethic is that sovereignty is a *requirement*, not a trade-off. Treat it as a constraint, not a variable.

  ---

  ### 4. The Understanding Check (The Litmus Test)
  *Do not ask her to write an integral. Ask this prediction question:*

  **The Question:**
  "If the meteorologists update the storm risk from 1% down to 0.1% (10x safer), how much less should we be willing to pay for the battery?"

  **The Correct Answer (Weighting View):**
  "We should lower our willingness-to-pay, but **not by 10x**. Because probability weighting is sticky at the tails, a 0.1% risk still feels 'possible' and scary. The premium might drop from \$50 to \$40, not \$50 to \$5."

  **The Wrong Answer (Standard EU View):**
  "We should pay 10x less. The expected loss scaled linearly with probability."

  *If she predicts the linear drop, she hasn't grasped the weighting concept.*

  ---

  ### 5. Board-Specific Guardrails (Avoiding the RDU Trap)
  *You mentioned mixing up Rank-Dependent Utility (RDU). Here is how to explain this to the co-op board without getting tangled in theory or using RDU terms.*

  **Do Not Say:**
  *   "Rank-Dependent Utility."
  *   "Cumulative Probability Weighting."
  *   "Non-linear probability transforms."
  *   "Axioms."

  **Do Say:**
  *   "Resilience Valuation."
  *   "Tail-Risk Protection."
  *   "Peace of Mind Premium."

  **The Conflation Safety Valve:**
  *   **RDU** is a specific mathematical structure where weights depend on the *ranking* of all outcomes together.
  *   **Probability Weighting** (what you need) is the simpler intuition that *rare bad events feel more likely than they are*.
  *   **Rule:** If you find yourself explaining how the probability of the *good* outcome affects the weight of the *bad* outcome, stop. You are drifting into RDU.
  *   **Stay Simple:** Tell the board: "Standard cost-benefit analysis underweights rare disasters. We are applying a 'safety multiplier' to the storm risk to reflect our communal tolerance for disruption."

  ---

  ### 6. Explicit Exclusions (What to Cut)
  *   **The Allais Paradox:** Do not bring up the classic experiments. It distracts from the housing context.
  *   **Loss Aversion:** Do not confuse "losses loom larger than gains" with "probabilities are weighted." Keep the focus on the probability $p$, not the sign of the outcome.
  *   **The Math of $\pi(p)$:** Do not show the Prelec or Tversky/Kahneman weighting functions. Just describe the shape (inflates small probabilities).
  *   **Sovereignty Quantification:** Do not let her try to solve for the dollar value of sovereignty. It kills the argument. Keep it as a binary constraint (Yes/No).

  ### Summary Checklist for Your Conversation
  1.  [ ] Establish Standard EU baseline.
  2.  [ ] Run the \$600 vs. 1% Storm calculation (show the mismatch).
  3.  [ ] Introduce "Decision Weight" vs. "Objective Chance."
  4.  [ ] Apply the "10x Risk Reduction" Litmus Test.
  5.  [ ] Frame Sovereignty as a Constraint, not a Cost.
  6.  [ ] Review Board Talking Points (No jargon).
