prompt: |-
  I'm a third-year in a normative ethics seminar and I also coordinate a student mutual-aid fund on campus — we hand out small emergency grants (rent, dental work, a bus ticket home, replacing a stolen laptop) from money that comes mostly from student-government dues plus a few outside donors. We get around twenty requests a week, each one has to be answered inside 48 hours, and the people actually deciding are me and two other undergrads who are exhausted and doing this at 11pm between problem sets. Anything over $250 needs two of us to sign off, and changes to the written policy have to go past student government, so whatever we adopt has to be explainable to them and to donors in plain language. Last week in seminar we did the demandingness objection and it basically wrecked the group chat: one person said that if the maximizing version is right then the fund should be telling all of us to give until we're at roughly the level of the people we're helping, and that this is absurd enough to sink the theory; someone else said that objection only shows that a rule which eats the very capacities and relationships you need to keep following it is self-defeating, not that the theory is wrong; and a third said the whole thing dissolves once you distinguish doing your fair share from picking up the slack for everyone who isn't doing theirs. I don't need that argument settled in the abstract — I need to turn whatever survives it into something my team can actually run, forty times a month, without re-deriving it from scratch each time.

  So: please write me a decision procedure, as a checklist or a flowchart in words, that takes a consequentialist starting point seriously but has a real answer to the demandingness worry built into it rather than bolted on. Concretely I want the questions in the order we should ask them, what counts as a sufficient answer to each (including what to do when we just can't get a number), the point where the procedure stops with a no, and the point where it hands the decision to a person because the question is one of values and not facts — and I want those two kinds of step labeled as such, because I can already tell which parts are judgment calls wearing a lab coat. It has to be runnable in about ten minutes on a one-page form by someone with no philosophy, and it has to be stable week to week: a rule that ratchets upward every time a new request lands in the inbox is one we will quietly stop following by November, and I'd rather have a rule we can actually stick to than an optimal one we abandon. Three or four things I keep hitting and don't know how to write into the form: (1) the slack question — almost nobody else on campus gives anything, so are we setting the bar at our share of the total need, or at whatever actually needs doing given that no one else is doing it, and is it suspiciously convenient that the people choosing the bar are the same people who pay it? I half want a test like "what would this policy look like if an auditor who disliked us applied it to us," but I don't know if that's principled or just a guilt device. (2) Whether our own stuff — coursework, relationships, sleep, the fact that we're doing this for free — is a side-constraint that caps what can be demanded of us, or just another item to weigh against a grant, because the two give very different answers when a local food bank tells us that every extra volunteer hour is a measurable number of meals. (3) The re-ask problem: the same few people apply every month, and a rule that treats each request as a fresh opportunity never stops, while a rule that caps them feels like it's punishing people for being poor in the same place twice. (4) Whether the procedure is even allowed to spend money on keeping itself going, or whether that's just self-indulgence with a nicer name.

  Then please run it on three cases so I can see if it holds up. First: a request for $400 for emergency dental work, arriving in a week when we have about $2,000 left and twelve other pending requests, and no way to verify more than what the applicant wrote on the form. Second: the food bank asks us to supply volunteers, and the question on the table is whether we start asking our own members to go from two hours a week to eight during finals, given that the extra hours really do convert into meals and that two of our members are already borderline burned out. Third — and this is the one where I already know I won't like the answer — we have $300 and have to choose between spending it on a thank-you dinner and hoodies for our volunteers (which reliably stops people from quitting, and we have lost volunteers to exactly this) or giving it out as one more grant. For each, show the procedure actually crunching through its steps and where it terminates, and be straight with me if the one I'm dreading comes out against me. Finally, tell me what the procedure can't do: which of these questions it's really just relabeling, where it will systematically misfire (I'm especially worried it will end up funding whoever tells the most vivid story in person, since that's what makes a demand feel binding), and what we should do in the first month to find out whether we're following it or just rationalizing whatever we were going to do anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year undergrad, normative ethics seminar student, coordinator of a student mutual-aid fund.
      *   **Context:** High pressure (20 requests/week, 48hr turnaround), exhausted team (3 undergrads, late night), limited authority (changes need Student Gov approval), limited funds (mostly student dues + donors).
      *   **Problem:** Needs a practical decision procedure based on consequentialism that addresses the "demandingness objection" without collapsing into absurdity or burnout. Needs to be stable, explainable, and runnable in ~10 mins.
      *   **Specific Concerns:**
          1.  *Slack Question:* Fair share vs. making up for others' inaction.
          2.  *Admin Costs:* Can we spend on ourselves (sleep, retention) or is that selfish?
          3.  *Re-asks:* Chronic need vs. one-off emergencies.
          4.  *Self-Indulgence:* Is keeping the system running justified?
      *   **Deliverables:**
          1.  A decision procedure (checklist/flowchart in words).
          2.  Labeling of Fact-Based vs. Value-Judgment steps.
          3.  Application to three specific cases (Dental, Food Bank/Volunteers, Retention vs. Grant).
          4.  Meta-analysis: Limitations, biases, and validation strategy.

  2.  **Deconstruct the Ethical Framework:**
      *   **Starting Point:** Consequentialist (maximize good).
      *   **Constraint:** Must handle the *demandingness objection*.
      *   **Solution Strategy:** Instead of pure act-utilitarianism (maximize every time), use a *rule-consequentialist* or *satisficing* approach with *agent-centered prerogatives*.
      *   **Key Insight:** The fund is a *sustainable institution*, not a one-off donation pot. If the administrators burn out or the fund collapses, total utility drops to zero. Therefore, preserving the capacity to give is a consequentialist imperative, not a selfish exception.
      *   **Addressing "Slack":** We cannot calculate the "ideal global distribution." We must operate within our *mandate* (Student Gov/Donors). The "fair share" is defined by the budget allocated to us, not the total need on campus.
      *   **Addressing "Re-asks":** Distinguish between *emergency relief* (stopgap) and *sustainable support* (which we aren't equipped to be). Chronic need requires referral, not endless grants, to avoid dependency and preserve funds for others.
      *   **Addressing "Admin Costs":** Overhead is necessary for function. Retention *is* impact.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* 10 minutes, one page, stable.
      *   *Structure:* Triage -> Eligibility -> Impact Assessment -> Sustainability Check -> Decision.
      *   *Labeling:* Need clear markers for [FACT] vs. [JUDGMENT].
      *   *Stopping Rules:* Hard caps to prevent ratcheting.

      *Drafting Steps:*
      1.  **Mandate Check:** Is this within our defined scope? (Rent, dental, etc.)
      2.  **Urgency/Verification:** Is it real and urgent? (48hr window).
      3.  **Marginal Impact:** What does this money *do*? (Prevent eviction vs. nice dinner).
      4.  **The "Burnout Cap" (Demandingness Answer):** We cannot sacrifice the fund's future capacity. This answers the "sleep/coursework" worry.
      5.  **The "Recurrence Limit" (Re-ask Answer):** Limit frequency to prevent dependency.
      6.  **The "Overhead Allowance" (Admin Cost Answer):** Explicitly allow retention spending.

      *Refining the "Demandingness" Integration:*
      Instead of asking "Does this maximize good?", ask "Does this fit within our sustainable capacity to do good?" This shifts from *maximizing* to *optimizing within constraints*. The constraint *is* the answer to demandingness.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Dental):* $400 request, $2k left, 12 pending.
          *   Math: $2000 / 12 = ~$166 avg. $400 is high.
          *   Protocol check: Urgency? Yes. Recurrence? (Assume first time). Impact? High (pain/health).
          *   Constraint: If we give $400, can we handle the rest? Maybe partial grant?
      *   *Case 2 (Food Bank/Volunteers):* Increase hours during finals.
          *   Protocol check: Impact (meals) vs. Cost (burnout/exams).
          *   Sustainability: If admins fail classes or quit, fund dies.
          *   Verdict: No.
      *   *Case 3 (Retention vs. Grant):* $300 for hoodies/dinner OR one grant.
          *   Protocol check: Immediate good (1 grant) vs. Future good (retention).
          *   Sustainability Clause: Retention is an allowable overhead.
          *   Verdict: Retention (if turnover is high).

  5.  **Addressing the Meta-Questions (Limitations & Validation):**
      *   *What it can't do:* It can't solve structural poverty. It can't eliminate bias in "vivid stories" completely (human nature).
      *   *Bias:* Vividness bias is real. Need a blind review step if possible.
      *   *Validation:* Audit trail. Compare decisions made vs. Protocol output.

  6.  **Refining the Tone:**
      *   Needs to be respectful of their exhaustion and intelligence.
      *   No jargon without explanation.
      *   Direct, practical, slightly empathetic but firm.
      *   Acknowledge the "dreading" of Case 3.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too complex?
      *   *Fix:* Simplify the math. Use percentages or hard caps.
      *   *Critique:* Did I answer the "Slack" question?
      *   *Fix:* Explicitly state that the budget *is* the fair share. We are not responsible for the universe, only the mandate.
      *   *Critique:* Is the "Judgment" labeling clear?
      *   *Fix:* Use brackets like **[JUDGMENT]** and **[FACT]**.
      *   *Critique:* Case 3 is the hardest.
      *   *Fix:* Be honest. Consequentialism *should* favor retention if turnover kills the fund. Acknowledge the emotional cost of that decision.

  8.  **Final Polish:** Check against all constraints in the prompt (48hr, 10 mins, plain language, specific cases). Ensure the "Demandingness" answer is structural, not an afterthought. (The key insight: *Sustainability is a consequentialist requirement, not a concession.*)

  *(Self-Correction on Case 1)*: Wait, $2000 left with 12 pending requests *plus* the new one? Or 12 including this one? Prompt says "twelve other pending". So 13 total. $2000/13 = $153. A $400 request is 2.5x the average. The protocol needs to handle "Outlier Requests."
  *(Self-Correction on Case 3)*: The prompt says "one more grant." If the fund is dying due to turnover, the grant is worthless next month. The protocol must weigh *future capacity*.

  9.  **Finalizing the Output Structure:**
      *   Introduction (acknowledging the bind).
      *   The Protocol (The "Sustainable Impact Protocol").
      *   Case Studies.
      *   Limitations & Validation.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic institutional design problem disguised as an ethics problem. You are trying to run a maximizing engine (consequentialism) on hardware that has finite battery life (undergrads with finals). If you drain the battery to 0% to power the engine for one extra hour, the engine never turns on again.

  The "demandingness objection" in your seminar is abstract; in your inbox, it is burnout. The solution is not to reject consequentialism, but to recognize that **institutional sustainability is a consequentialist variable.** A fund that collapses in November because the admins failed their classes or quit produces zero utility in December. Therefore, protecting your capacity to administer the fund is not "self-indulgence"; it is a necessary condition for the good you aim to maximize.

  Here is a decision procedure designed for your constraints. It is called the **Sustainable Impact Protocol (SIP)**. It hard-codes the answer to demandingness by setting fixed constraints on *your* input, so you don't have to re-negotiate your own worth every time a request comes in.

  ***

  # The Sustainable Impact Protocol (SIP)
  **Time limit:** 10 minutes per request.
  **Usage:** Fill out one form per request. If the form says "No," the decision is "No."

  ### PHASE 1: MANDATE & ELIGIBILITY (The "Slack" Filter)
  *This phase answers the "Slack Question." You are not responsible for all need, only the need within your specific mandate.*

  **1. [FACT] Category Check:** Does the request fall strictly within the approved list (Rent, Dental, Emergency Travel, Essential Tech)?
  *   **Yes:** Proceed.
  *   **No:** **STOP. DENY.** (Do not expand the mandate via individual cases; that requires Student Gov.)

  **2. [FACT] Verification Check:** Is there minimal documentation (invoice, screenshot, notice)?
  *   **Yes:** Proceed.
  *   **No:** **STOP. DENY.** (Exception: If verification is impossible but risk is life/safety, flag for [JUDGMENT] Step 6.)

  **3. [FACT] Recurrence Check:** Has this applicant received a grant in the last 90 days?
  *   **No:** Proceed.
  *   **Yes:** **STOP. DENY.** (Refer to long-term support resources.)
      *   *Rationale:* This answers the "Re-ask Problem." You are an emergency fund, not a income replacement. Chronic need requires structural solutions you cannot provide. Capping this prevents dependency and preserves funds for other emergencies.

  ### PHASE 2: IMPACT ASSESSMENT (The Consequentialist Core)
  *This phase measures the good done. Be blunt.*

  **4. [FACT] Severity Score:** On a scale of 1–5, what happens if we give $0?
      *   1: Inconvenience (missed event, minor delay).
      *   2: Financial stress (overdraft fees, late fees).
      *   3: Basic need disruption (food insecurity, temporary housing loss).
      *   4: Safety/Health risk (untreated infection, eviction filing).
      *   5: Immediate catastrophe (homelessness tonight, medical emergency).
      *   *Input:* _____

  **5. [FACT] Cost Efficiency:** Divide Request Amount by Severity Score.
      *   *Example:* $400 / Severity 4 = 100.
      *   *Example:* $50 / Severity 3 = 16.6.
      *   *Note:* Lower numbers are better (more severity relieved per dollar).

  ### PHASE 3: SUSTAINABILITY & CAPACITY (The Demandingness Cap)
  *This phase answers the "Burnout" and "Admin Cost" questions. It treats your team's capacity as a finite resource that must be preserved.*

  **6. [JUDGMENT] The "Auditor" Test:** If a donor asked, "Why did you fund this specific request over others?", is the reason based on *impact* or *pity*?
      *   *Impact:* "This prevented eviction."
      *   *Pity:* "This student cried during the interview."
      *   **Rule:** If you cannot write the reason in one sentence without referencing the applicant's emotion, **reduce grant by 50% or DENY.** (This mitigates the "vivid story" bias.)

  **7. [FACT] Budget Runway:** Take Current Liquid Balance. Subtract Total Pending Requests (including this one).
      *   Is the remaining balance positive?
      *   **No:** **STOP. DENY.** (You cannot spend money you have already effectively promised.)
      *   **Yes:** Proceed.

  **8. [JUDGMENT] The "Burnout" Cap:** Does approving this require the admin team to work beyond 11 PM for more than 2 nights this week, or skip a meal/class to process?
      *   **Yes:** **STOP. DENY.** (This is the hard constraint. Your education and health are the engine. If the engine breaks, the charity stops. This is not selfishness; it is maintenance.)
      *   **No:** Proceed.

  ### PHASE 4: FINAL CALCULATION
  **9. [FACT] The Pro-Rata Rule:**
      *   Calculate the *Average Grant Capacity*: (Current Balance) / (Number of Pending Requests with Severity Score 3+).
      *   If the Request Amount is > 150% of the Average Grant Capacity:
          *   **Option A:** Fund at the Average Grant Capacity level.
          *   **Option B:** Deny.
          *   *Select one based on Severity Score (4+ gets Option A, 3 gets Option B).*

  **10. [JUDGMENT] Final Sign-off:**
      *   Does this decision feel like it sets a precedent you can keep for the next 6 months?
      *   **No:** **DENY.** (If it feels unsustainable now, it will be impossible in November.)
      *   **Yes:** **APPROVE.**

  ***

  # Case Studies

  Here is the protocol running on your three scenarios.

  ### Case 1: The $400 Dental Request
  *Context: $2,000 balance. 12 other pending requests (total 13). 48hr deadline. Minimal verification.*

  1.  **Mandate:** Dental is approved. (Pass)
  2.  **Verification:** Only applicant word. (Pass, but flagged for Step 6).
  3.  **Recurrence:** Assume first time. (Pass)
  4.  **Severity:** Dental pain/infection risk. Score = 4.
  5.  **Efficiency:** $400 / 4 = 100.
  6.  **Auditor Test:** Can we justify this without pity? Yes, "Prevents infection/loss of tooth." (Pass)
  7.  **Runway:** $2,000 balance. 13 requests. If all 13 ask for $400, you are insolvent. But are they all $400?
      *   *Correction:* You must estimate the *likely* cost of the other 12. If average request is $150, 12 * 150 = $1,800. Remaining = $200.
      *   *Strict Protocol Check:* If we treat all 13 as equal claimants: $2,000 / 13 = $153 average capacity.
  8.  **Burnout Cap:** Processing this takes 10 mins. No extra work. (Pass)
  9.  **Pro-Rata Rule:**
      *   Average Capacity: ~$153.
      *   Request: $400.
      *   Threshold (150% of Avg): $229.
      *   $400 is > $229.
      *   Severity is 4 (High). Protocol says **Option A: Fund at Average Capacity.**
  10. **Precedent:** Can we pay $153 for dental emergencies for 6 months? Yes. Can we pay $400? No, we'd run out in a month.

  **Decision:** **APPROVE $153.**
  *Note:* You tell the applicant: "We can provide $153 immediately. Here is a list of low-cost dental clinics for the remainder." This maximizes the number of people helped while acknowledging the need.

  ### Case 2: The Food Bank Volunteer Surge
  *Context: Food bank wants admins to go from 2hrs to 8hrs/week during finals. Converts to meals. Admins are burned out.*

  1.  **Mandate:** This is not a grant request. This is an operational policy change. **Redirect to Admin Strategy.**
  2.  **Impact:** More meals (Good).
  3.  **Sustainability (Step 8 - Burnout Cap):**
      *   Question: Does this require working beyond capacity during finals?
      *   Fact: Admins are "borderline burned out." Finals are high stress.
      *   Answer: **YES.**
  4.  **Protocol Trigger:** Step 8 says if it risks admin capacity, **STOP.**

  **Decision:** **DENY THE INCREASE.**
  *Reasoning:* A consequentialist calculation must include the probability of the fund collapsing. If you fail your classes or quit the fund because of burnout, the fund dissolves. The future meals the fund would have facilitated (by funding students who then volunteer, or by existing next year) outweigh the marginal meals gained this week. The protocol protects the machine that makes the meals.

  ### Case 3: Retention (Hoodies) vs. One More Grant
  *Context: $300 left. Choice: Volunteer retention event OR one $300 grant to a student.*

  1.  **Mandate:** Both are permissible uses (Grants are core; Admin costs are usually allowed but scrutinized).
  2.  **Impact (Grant):** Relieves Severity 4 for one person. One-time good.
  3.  **Impact (Retention):** Prevents volunteers from quitting.
      *   *Variable:* How many volunteers have quit this semester? If turnover is high, the cost of recruiting/training new ones is >$300 in admin hours.
  4.  **Sustainability (Step 10 - Precedent):**
      *   Question: "Does this decision feel like it sets a precedent you can keep?"
      *   If you give the grant: You have $0 left. Fund closes until next semester.
      *   If you buy hoodies: You retain the team. You can process *next* semester's requests.
  5.  **The "Overhead" Question:** The protocol implicitly allows overhead if it secures future capacity.
      *   *Check:* Is the retention event directly tied to keeping the fund running? Yes ("reliably stops people from quitting").
      *   *Check:* Is the grant a one-off or recurring need? If it's a one-off emergency, it's high impact. But if the fund dies, *zero* emergencies are met next month.

  **Decision:** **SPEND ON RETENTION.**
  *Reasoning:* I know you dread this. It feels like eating the food meant for the hungry to feed the cooks. But if the cooks quit, the kitchen closes.
  *Consequentialist Math:*
  *   Option A (Grant): 1 Student helped now. Fund likely stalls/collapses due to admin turnover. Future students helped = 0. **Total = 1.**
  *   Option B (Retention): 0 Students helped now. Team stays intact. Fund operates next semester. Future students helped = ~200. **Total = 200.**
  *   *Caveat:* This only holds if turnover is actually a threat. If your team is stable, the math changes. But you said you are "exhausted" and have "lost volunteers." The data supports retention.

  ***

  # Meta-Analysis: What This Procedure Can't Do

  You asked for honesty about the limitations. Here is where the SIP will fail, and how to manage it.

  **1. It Relabels "Fair Share" as "Budget Cap."**
  The protocol does not solve the philosophical "Slack" problem (i.e., should you be giving your own tuition money?). It sidesteps it by defining your "fair share" as the budget Student Gov gave you.
  *   *Risk:* This is convenient for you.
  *   *Mitigation:* The "Auditor Test" (Step 6). If you can't justify a decision to a skeptical donor, don't make it. This forces you to externalize the reasoning.

  **2. It Cannot Eliminate Vividness Bias.**
  Humans are wired to respond to stories. Even with the form, a student crying in your office will feel like a "Severity 5" while a form on a desk feels like a "Severity 3."
  *   *Systematic Misfire:* You will overfund visible suffering and underfund invisible suffering (e.g., quiet eviction notices vs. dramatic stories).
  *   *Fix:* **Blind Review.** For the first month, redact names and personal statements from the forms. Decide based *only* on the invoices and the Severity Score. If the decision changes when you know the name, you know you're biased.

  **3. It Rationalizes Status Quo.**
  You asked how to know if you're following the rule or just rationalizing.
  *   *The "First Month" Audit:* For the first 4 weeks, fill out the form *after* you make the intuitive decision. Compare the two.
      *   If Intuition = Protocol 90% of the time: You are internalizing the rule. Good.
      *   If Intuition = Protocol 50% of the time: You are ignoring the rule when it's hard.
      *   *Action:* If you override the protocol more than twice in a month, you must hold a "Post-Mortem" meeting to ask: "Did the protocol fail, or did we?" If the protocol fails, amend it. If you failed, commit to the next one.

  **4. It Is Cold.**
  Case 3 (Retention vs. Grant) will feel morally dirty. You will feel like you are choosing hoodies over hunger.
  *   *Reframing:* You are not choosing hoodies. You are choosing *the existence of the fund*. The $300 grant is a drop in the bucket; the fund is the well. Consequentialism demands you protect the well, even if it means not filling one cup today.
  *   *Warning:* If this distinction doesn't land emotionally, you will burn out. You need to agree as a team that **Sustainability is a Moral Good.** If you treat admin care as "selfish," you will quit. If you treat it as "infrastructure maintenance," you can survive.

  ### Final Recommendation
  Print the SIP. Tape it to the wall. For the first month, do not make a single dollar decision without filling out the form. If the form says "No" and you say "Yes," write down *why* in red ink. At the end of the month, read the red ink. That is where your actual ethics live, not in the seminar paper.
