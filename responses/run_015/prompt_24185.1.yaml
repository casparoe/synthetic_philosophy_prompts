      *   **Requirements:**
          *   Questions to ask in order.
          *   What counts as a sufficient answer.
          *   Where the procedure stops (No).
          *   Where it hands off to a person (values vs. facts).
          *   Mark clearly which steps are judgment calls dressed up as procedure.
          *   Run the procedure on three specific cases.
          *   Note clashes with current practice.
          *   End with what the procedure cannot do.
          *   **Constraint:** Maximum 800 words.

  2.  **Drafting the Decision Procedure:**
      *   Need to structure it logically: Competence -> Information -> Voluntariness. (Usually, competence is foundational, but often assessed throughout. Let's start with Information then Voluntariness, then Competence, or follow the prompt's order. The prompt lists "informed, voluntary, competent". Let's stick to a logical flow for a call: Understanding (Informed) -> Freedom (Voluntary) -> Capacity (Competent). Actually, Competence is often a threshold. Let's try: 1. Understanding (Informed), 2. Pressure (Voluntary), 3. Capacity (Competent).
      *   Need to identify "judgment calls dressed up as procedure."
      *   Need to identify where values take over.

  3.  **Drafting the Case Applications:**
      *   Case 1: 50% discount. "Obviously we'd go with your clinic."
      *   Case 2: Correct odds, but disparaging other clinics ("cut corners"). Patient still wants procedure, just not there.
      *   Case 3: Early memory problems. Clear on procedure, confused on storage clause. Partner answers for her.

  4.  **Drafting the Limitations:**
      *   What can't this procedure do? (e.g., guarantee outcomes, replace legal counsel, assess deep psychological coercion).

  5.  **Word Count Management:**
      *   This is tight. 800 words is not much for a procedure, three cases, analysis, and limitations. I need to be concise.

  6.  **Step-by-Step Construction:**

      *   *Intro:* Brief context.
      *   *Procedure:*
          1.  **Understanding (Informed):** Ask patient to explain procedure/risks/alternatives in own words. *Pass:* Accurate summary. *Fail:* Major misconceptions. *Judgment Call:* What counts as "major"?
          2.  **Pressure (Voluntary):** Ask "What else did you consider?" and "Do you feel rushed?" *Pass:* Can name alternatives or explain why rejected. No external threat. *Judgment Call:* Is a discount coercion or incentive?
          3.  **Capacity (Competent):** Ask specific retention questions over time. *Pass:* Consistent answers. *Fail:* Inability to retain key info. *Handoff:* Physician decides medical capacity.
      *   *Cases:*
          1.  Discount: Passes Understanding. Fails Voluntariness? (Judgment Call). Current practice likely accepts this.
          2.  Disparagement: Passes Understanding (odds correct). Fails Voluntariness/Informed (manipulation). Current practice likely accepts this.
          3.  Memory: Fails Capacity on storage clause. Partner interference. Current practice likely accepts this if partner signs.
      *   *Limitations:* Cannot measure internal emotional pressure, cannot predict regret, cannot replace legal adjudication.

  7.  **Refining and Editing (checking word count):**

      *   *Drafting text:*
          **Consent Validation Procedure**

          **Step 1: Verification of Understanding (Informed)**
          *Question:* "In your own words, what is happening, what are the main risks, and what are your other options?"
          *Sufficient Answer:* Patient accurately summarizes procedure, key risks, and at least one alternative (including doing nothing).
          *Stop:* If patient believes risks are zero or alternatives don't exist.
          *Judgment Call:* Determining if a misconception is "material" enough to void consent.

          **Step 2: Assessment of Pressure (Voluntary)**
          *Question:* "What other clinics did you consider?" and "Is anything pushing you to decide today?"
          *Sufficient Answer:* Patient identifies alternatives or explains why none exist. No threats or undue inducements cited.
          *Stop:* If patient cites threats (e.g., "husband will leave me") or undue inducements (e.g., financial desperation exploited).
          *Handoff:* Financial incentives vs. coercion is a values judgment for the Physician.
          *Judgment Call:* Distinguishing persuasion from manipulation.

          **Step 3: Capacity Check (Competent)**
          *Question:* Repeat key constraint (e.g., storage limits) after five minutes.
          *Sufficient Answer:* Patient retains info without prompting.
          *Stop:* If patient cannot retain key info or relies entirely on proxy.
          *Handoff:* Physician determines medical capacity legally.

          **Case Applications**

          **(1) The Discount Patient**
          *Procedure Result:* **Flag.** Step 2 fails. "Obviously we'd go with your clinic" suggests the discount dictated the choice, removing consideration of alternatives.
          *Clash:* We currently accept discounts as marketing. This procedure classifies significant financial inducement as potential coercion requiring physician review.

          **(2) The Disparagement Patient**
          *Procedure Result:* **Flag.** Step 1/2 borderline. While odds are correct, claiming others "cut corners" without evidence manipulates the "alternatives" assessment.
          *Clash:* We currently allow competitive framing. This procedure flags disparagement without proof as undermining voluntary choice based on accurate information.

          **(3) The Memory Patient**
          *Procedure Result:* **Stop.** Step 3 fails. She cannot retain the storage clause. Partner answering for her indicates proxy consent, which is invalid for elective procedures.
          *Clash:* We currently allow partner support to fill gaps. This procedure requires independent retention of key contractual terms.

          **Limitations**
          This procedure cannot measure internal emotional coercion (e.g., grief, desperation). It cannot guarantee the patient won't regret the decision later. It cannot replace a legal determination of incapacity. It transforms ethical nuance into binary boxes, inevitably missing context. It is a sieve, not a scale.

