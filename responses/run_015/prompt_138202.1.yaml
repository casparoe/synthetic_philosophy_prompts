  **The Game**

  The "Efficient Aid Fund" holds a donor contract converting cash to life-years at a fixed $1:1 rate with no thresholds, granting it strictly linear utility over the stake. The "Sovereign Stability Pool" (liquid assets $50B) offers a public game: a fair coin is flipped until Heads or 30 Tails. If the first Heads appears on flip $n$, the Fund receives $n \cdot 2^n$ dollars; if 30 Tails appear, the game ends at $n=30$. All tickets purchased for the quarter ride this single sequence (perfect correlation), preventing diversification. The maximum prize is $\approx \$32$ billion, well within the Pool's solvency. The game resolves in five minutes.

  ***

  **The Arithmetic**

  *   **(a) Expected Money (EV):** The probability of ending on flip $n$ is $1/2^n$. The payoff is $n \cdot 2^n$. The contribution to EV per step is $(1/2^n) \cdot (n \cdot 2^n) = n$. Summing $n$ from 1 to 30: $\sum_{1}^{30} n = \frac{30 \times 31}{2} = \mathbf{\$465}$.
  *   **(b) Expected Utility (Linear):** Since utility is linear ($U(x)=x$), this equals Expected Money: **\$465**.
  *   **(c) Median Outcome:** 50% of games end on Flip 1 ($n=1$). Payoff $1 \cdot 2^1 = \mathbf{\$2}$.
  *   **(d) Many-Plays Rule (Geometric Mean):** This rule maximizes long-term growth rate ($\exp(E[\ln X])$). $E[\ln X] = \sum \frac{1}{2^n} \ln(n 2^n) \approx 1.9$. $\exp(1.9) \approx \mathbf{\$6.65}$.

  **The Divergence**

  The single feature doing the work is the **polynomial multiplier ($n$)** on the exponential payoff. In the classic paradox ($2^n$), the EV contribution per step is constant ($1$). By adding the $n$ multiplier, the EV contribution *grows* with each step ($1, 2, 3...$), inflating the Expected Value linearly with the cap, while the Median and Geometric Mean remain anchored by the high probability of early termination. If you remove the $n$ (reverting to standard $2^n$), the EV drops to $30, narrowing the gap against the Median ($2) to 15x and the Geometric Mean ($4) to 7.5x. The $n$ multiplier widens the EV/Median gap to 232x.

  **The EV Defense**

  An Expected Value maximizer waves the case away by invoking **Ensemble Dominance**. They argue: "You are evaluating this as a *time* sequence (one after another), but probability is an *ensemble* property (all possible worlds). In the majority of possible worlds, you lose. But in the worlds that matter for *value creation*, you win big. Since your utility is linear, you should not weight the 'likely small loss' heavier than the 'unlikely massive gain.' To reject this is to claim you know something about the coin that the math doesn't."

  **The Honesty Check**

  If the constraints are held airtight—truly linear utility, guaranteed solvency, and no hidden thresholds—**the reader's "no way" reaction cannot be vindicated.** Under these specific conditions, paying $465 is the rational choice. The intuition that it is "too expensive" is a heuristic leftover from a world where utility curves bend and banks fail.

  To bring the intuition back, the smallest change to the player's circumstances is **Accountability Cycles**. Suppose the Fund's managers are reviewed annually. If they pay $465 and win $2 (the median outcome), they cannot explain the "lost" $463 to donors, even if the *expected* value was sound. This creates a **Reputation Cost** that functions exactly like diminishing marginal utility: the pain of looking foolish ex-post outweighs the abstract gain of being right ex-ante. The utility isn't diminishing on the *money*, it's diminishing on the *career capital* required to spend the money.
