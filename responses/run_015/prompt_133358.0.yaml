answer: |-
  Diagnosis

  The error lies in step (5), the "flat-rate defeater." This premise treats moral judgments as independent, equiprobable atoms, analogous to the oracle's ten lists. But moral convictions are structurally heterogeneous. Some are peripheral intuitions; others are foundational principles required to diagnose the blindness described in (2). The oracle case works only because the ten judgments are ex hypothesi unrelated. In your argument, the judgment that "earlier stages were defective" is not a raw intuition subject to the same social blindness as the substantive norms it evaluates. It is a second-order conclusion derived from the *presence* of considerations previously absent.

  Step (5) ignores the asymmetry inherent in (2). Social situatedness explains error via the *absence* of occasions to register considerations. When those occasions arise, the resulting judgment is supported by positive evidence (the registered consideration), not merely confidence. To discount the judgment that identifies the expansion equally with the judgments constituting the exclusion is to treat the presence of evidence as epistemically equivalent to its absence. This renders the explanation in (2) self-undermining: you cannot use the claim "we see more now" to prove progress if you must discount that claim simply because it is a claim. The mistake is a category error between first-order norms and second-order historical diagnoses.

  Furthermore, (5) violates Bayesian updating. Learning that *some* beliefs are false due to specific causal mechanisms (social blindness) should lower confidence in beliefs generated by *those* mechanisms, not beliefs generated by the mechanism that detected the error. The flat-rate approach conflates the source of the error with the source of the correction. It assumes that because we cannot identify the false beliefs *ex ante*, we must treat them as equally probable *ex post*. But we can identify the false beliefs *ex post* via the expansion itself. The slaveholder's confidence was based on blindness; the abolitionist's is based on sight. Step (5) forces us to ignore that distinction, creating a skeptical paradox where the detection of error is treated as just another potential error.

  Why it looked sound

  The premise draws strength from formal epistemology. In contexts involving independent variables—like the oracle example—uniform probability distribution is the rational default when information is lacking. It mimics the "principle of indifference." Additionally, step (4) creates a powerful sense of epistemic vertigo. If all tests use the blinded judgments, there seems to be no external vantage point. This mirrors global skeptical arguments (e.g., brain-in-a-vat) which are notoriously difficult to dismiss without begging the question. The argument feels rigorous because it applies a statistical heuristic to a domain where it feels applicable: managing uncertainty about our own reliability. It also appeals to humility. Accepting (5) feels like intellectual honesty regarding our historical contingency. Rejecting it risks appearing dogmatic about our own superiority, which makes the faulty step psychologically attractive to a skeptical theorist.

  The alternatives and their price

  Rejecting (3) denies we are blind, committing you to moral arrogance and ignoring historical evidence. Rejecting (4) claims we can identify false judgments independently, but this contradicts (2)'s insight that blindness is invisible from within. Rejecting (6) exempts the progress judgment from skepticism, but requires a theory of why second-order claims are immune to social situatedness, which is hard to motivate without circularity.

  The additive/revisory distinction matters. If expansions are additive, old principles remain valid but narrow; if revisory, old principles are false. Your friend claims this doesn't matter, but it does. If revisory, the slaveholder's framework is rejected, not just discounted. This breaks the symmetry required for (7). However, rejecting this distinction costs you the generality of the skeptical challenge.

  Rejecting (5) is the cheapest option. It commits you to a coherentist epistemology where beliefs are weighted by explanatory power, not just confidence levels. You must argue that some judgments (like "blindness is bad") are constitutive of moral reasoning itself. The price is accepting that we cannot prove our progress to a radical skeptic without relying on the very judgments in question. But this is not a bug; it is a feature of any non-foundationalist ethics. You retain (1) and (2) without accepting the self-defeating symmetry of (7). The cost is admitting that moral knowledge is internal to the practice, not viewable from a God's-eye view.

  Furthermore, keeping (5) forces you into global skepticism across all domains, not just morals. If social situatedness defeats confidence flat-rate, it defeats scientific realism too, since scientists are also socially situated. Rejecting (5) allows you to maintain realism in ethics without collapsing into nihilism. The price of rejecting (5) is merely accepting that epistemic justification is comparative, not absolute. You don't need to prove you are infallible, only that you are less blind than the slaveholder. The price of keeping (5) is losing the ability to claim any moral knowledge at all.

  Bottom line

  The flat-rate defeater fails because the judgment that identifies the blindness is epistemically privileged by the very explanation of that blindness, making the abolitionist and slaveholder asymmetrically situated. You should tell her that treating the detection of error as equally fallible as the error itself destroys the possibility of learning, and that moral progress relies on the asymmetry between seeing and being blind, not a symmetrical discounting of confidence.
