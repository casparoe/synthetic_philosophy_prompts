      *   **Point 2: The Divergence (Reference vs. Significance):** Putnam is about *extension* (what stuff in the world). Borges is about *intension* (what ideas are invoked). Menard's "truth" isn't about a different chemical; it's about a different philosophical landscape. Putnam: Same concept, different referent. Borges: Same referent (Quixote), different conceptual weight.
      *   **Point 3: The Role of the Subject (Internalism vs. Externalism):** This is the tricky part. Putnam says "meanings ain't in the head." Borges implies Menard's *achievement* (an internal/historical feat) creates the meaning. Actually, Borges is closer to a historical externalism, but it's not *causal* externalism. It's *hermeneutic* externalism.
      *   **Point 4: Twin Earth vs. Twin Text:** In Twin Earth, the subjects are identical. In Menard, the authors are *not* identical (one is 17th C, one is 20th C). If we made them identical (a clone of Cervantes), Putnam says meaning stays the same (if environment is same). Borges might say if a 20th C clone wrote it, it's Menard-esque.
      *   **Point 5: What Borges Adds:** Putnam's view is static/logical. Borges' view is temporal/aesthetic. Borges introduces *time* as a semantic variable. Putnam ignores the history of the *speaker*, focusing on the history of the *term*.
      *   **Conclusion:** They are different projects. Putnam wants to fix reference for science/logic. Borges wants to liberate interpretation for art. Borges reveals that "meaning" in human discourse is often about *value* and *resonance*, not just *labeling*.

