      *   **Key Mechanism:** Historical context, authorial intention, the "archaeology" of reading. The *act* of writing in the 20th century changes the semantic weight of the words.
      *   **Scope:** Literary aesthetics, hermeneutics, authorship, historical temporality.

  4.  **Compare and Contrast (The "Fit"):**
      *   *Similarity:* Both reject the idea that the internal state (or the text itself in isolation) exhausts meaning. Context matters.
      *   *Difference 1 (Type of Meaning):* Putnam talks about *reference* (extension). Borges talks about *significance* or *interpretive value* (intension/connotation). Putnam: "Water" refers to H2O. Borges: "History is the mother of truth" implies pragmatism in Menard, but mere rhetoric in Cervantes.
      *   *Difference 2 (Mechanism):* Putnam relies on causal chains and physical environment. Borges relies on historical consciousness and intertextuality.
      *   *Difference 3 (Identity):* In Twin Earth, the *words* mean different things because the *stuff* is different. In Menard, the *words* mean different things because the *mind/history* producing them is different. Wait, this is crucial. Putnam says internal states *don't* matter. Borges says the historical position of the author (an external fact about the author) *does* matter, but it changes the *intentional* content.
