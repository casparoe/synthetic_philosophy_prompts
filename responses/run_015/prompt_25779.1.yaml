      *   *Geology Analogy:* Since the user is a geologist, use a stratigraphy or mineralogy analogy. Putnam is like identifying a mineral by its crystal structure (essentialism). Borges is like identifying a rock formation by its stratigraphic position (contextualism). A quartz crystal in the Precambrian is chemically identical to one in the Holocene (Putnam), but its geological *significance* differs (Borges).

