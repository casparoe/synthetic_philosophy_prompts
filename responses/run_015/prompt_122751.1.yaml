answer: |-
  You are describing a phenomenon that is well-recognized in policy evaluation and criminology, but you are correct that it lacks a single, eponymous "Goodhart-style" label in the public lexicon. Because you are writing for print, you need a term that carries weight without requiring a paragraph of definition.

  Here is the breakdown of the existing literature, the precise conceptual "carve" you asked for, and a recommendation on how to name it.

  ### 1. The Existing Vocabulary

  There is no single word that captures the *entirety* of your description (the displacement + the metric illusion), but three terms from different disciplines combine to describe it perfectly.

  **A. The Behavioral Mechanism: "Displacement" (specifically *Tactical* or *Functional* Displacement)**
  In criminology and policy evaluation, **Displacement** is the technical term for when an intervention suppresses a behavior in one area, only for it to emerge in another.
  *   *Spatial:* Crime moves to the next neighborhood.
  *   *Tactical:* Burglars pick locks instead of breaking windows.
  *   *Functional:* Drug dealers switch from cocaine to meth.
  *   *Your cases:* These are examples of **Tactical Displacement** (gifts $\rightarrow$ consulting contracts) and **Functional Displacement** (hiring $\rightarrow$ contracting).
  *   *Why use it:* It is a scientific term, not a metaphor. It implies a zero-sum shift in behavior rather than a reduction.

  **B. The Organizational Mechanism: "Decoupling"**
  In institutional sociology (Meyer & Rowan, Brunsson), **Decoupling** describes the gap between formal policy structures (the open meeting, the exam) and actual organizational practice (the corridor deal, the cousin).
  *   *Why use it:* It explains *why* the metrics look good. The ledger is accurate (no gifts), but it is decoupled from the reality of the transaction. This distinguishes your story from simple lying or data falsification.

  **C. The Journalistic Shorthand: "The Balloon Effect"**
  While you expressed hesitation about metaphors, **"The Balloon Effect"** is the standard term in drug policy, counter-terrorism, and anti-corruption circles for this specific dynamic. Squeeze one end (supply), it bulges at the other (transit).
  *   *Why use it:* Readers understand it instantly. If you use it, treat it as a technical term (capitalize it), not a flourish.

  ### 2. The "Carve": Distinguishing the Phenomenon

  You asked how to distinguish this from genuine reduction, cosmetic reform, and ordinary avoidance. Here are the boundary conditions for your piece:

  | Phenomenon | The Rule | The Behavior | The Metric | The Outcome |
  | :--- | :--- | :--- | :--- | :--- |
  | **Genuine Reduction** | Enforced | Changes | Improves | **Better** (Meritocracy/ Savings) |
  | **Cosmetic Reform** | Ignored | Unchanged | Unchanged | **Same** (Status Quo) |
  | **Ordinary Avoidance** | Enforced | Shifts (Legal) | Improves | **Neutral** (Tax planning) |
  | **Your Phenomenon** | **Enforced** | **Shifts (Opaque)** | **Improves** | **Same/Worse** (Hidden Favoritism) |

  **The Critical Distinction:**
  *   **Vs. Genuine Reduction:** In genuine reduction, the *total volume* of favors drops. In displacement, the volume remains constant; only the *variance* shifts to a higher-risk or less accountable channel.
  *   **Vs. Cosmetic Reform:** In cosmetic reform, the rule is never enforced (the gift ledger is faked). In your cases, the rule *is* enforced (the gifts actually stop), which makes the failure harder to detect.
  *   **Vs. Ordinary Avoidance:** Tax avoidance is legal optimization. Your phenomenon involves maintaining an *illicit* or *unethical* benefit (nepotism) by exploiting a regulatory blind spot.

  ### 3. The Epistemic Problem: How to Prove It

  You asked: *"If the target is unobservable and the proxy improves, is there any principled way to say whether the balloon was squeezed or deflated?"*

  This is the hardest part of the story, but there is a methodological answer. You cannot prove it with the reform's own metrics. You must use **Outcome Auditing**.

  *   **Don't measure the Process:** (Were the minutes signed? Were the exams graded?)
  *   **Measure the Outcome:** (Did the winning contractor have a track record? Is the "consultant" relative qualified? Did the hospital pay above market rate for the "consulting"?)

  If the *process* metrics improve (clean ledgers) but the *outcome* metrics stagnate or degrade (costs rise, quality drops, same families win), you have empirical evidence of displacement. This moves the claim from "conspiracy theory" to "data analysis."

  ### 4. Recommendation for Print

  Since there is no single eponym (like "Goodhart's"), you have two options:

  **Option A: Use the Technical Term**
  Use **"Corruption Displacement."** It is used in the academic literature (e.g., U4 Anti-Corruption Resource Centre, World Bank governance papers). It is precise and defensible.
  *   *Usage:* "This isn't reform; it's corruption displacement."

  **Option B: Coin a Precise Phrase**
  If you want something punchier that captures the *metric illusion* specifically, I suggest **"The Decoupling Effect"** or **"Metric-Blind Displacement."**
  However, my strong advice is to stick with **"Displacement."** It is the robust scientific term. You can qualify it once in the piece: *"Tactical Displacement: where the behavior doesn't vanish, it migrates to an unmeasured channel."*

  **A Note on Goodhart's Law:**
  You mentioned wanting to avoid "sort of like Goodhart's Law." You are right to hesitate, but your distinction is subtle.
  *   **Goodhart's Law:** The measure becomes the target, so the measure is *corrupted* (data is faked).
  *   **Your Phenomenon:** The measure becomes the target, so the *behavior migrates* (data is true, inference is false).
  *   *Journalistic Tip:* You can explicitly make this distinction. "Goodhart's Law warns us that people will game the numbers. But there is a subtler failure: when people obey the numbers, but move the crime to where the numbers aren't looking."

  ### Summary for your Stylebook
  *   **The Word:** **Displacement** (specifically *Tactical Displacement*).
  *   **The Mechanism:** **Decoupling** (Policy vs. Practice).
  *   **The Proof:** **Outcome Auditing** (ignoring process metrics).
  *   **The Boundary:** It counts only if the *substantive benefit* (who gets the contract/job) remains captured by the same network, despite the *procedural channel* changing.

  If you need a headline-ready phrase, **"The Displacement Trap"** or **"Reform Displacement"** works. But in the body text, rely on **Displacement**. It is the concept that will survive the piece.
