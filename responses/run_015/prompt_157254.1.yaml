prompt: |-
  I'm preparing a single ninety-minute seminar for second-year philosophy students who have completed an introductory ethics course but have no background in South Asian philosophy. The session should treat karma not as a cosmological mechanism of rebirth but specifically as a theory of moral desert—one in which the moral quality of an action generates a corresponding desert that need not be administered by any personal agent and need not manifest within a single lifetime. I need the pedagogical architecture, not the lecture itself. First, map the dependency order of the conceptual components: begin with the distinction between moral desert and causal consequence, then move to impersonal accounting versus agent-administered retribution, and specify exactly what must be secured at each stage before the next layer can be introduced. Second, propose one concrete carrying example—reconstructed rather than drawn from standard textbook cases—that must include an action performed under partial coercion whose negative desert accumulates without immediate or visible effect, and that must explicitly lack both a divine judge and a within-lifetime feedback loop; specify what properties the example needs to carry the idea and what it must deliberately omit. Third, list the misconceptions these students will predictably form in sequence—collapsing karma into consequentialism, then into Western theistic retributivism, then into determinism about present character—and identify the precise point in the explanatory arc where each should be intercepted. Fourth, design a single check-for-understanding task that reveals whether a student has grasped karma-as-desert rather than merely memorized the definition. Fifth, state explicitly what should be left out at this level and openly acknowledged as omitted—for instance, specific textual debates about the self's continuity across births, or comparative analysis with Jain karma theory. Finally, in your response, indicate how confident you are in this pedagogical sequencing and single out the specific element—whether the dependency map, the example design, the misconception ordering, or the check-for-understanding—about which you are least sure.
