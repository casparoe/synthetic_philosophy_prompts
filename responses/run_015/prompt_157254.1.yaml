          3.  *Determinism/Fatalism:* "So his future is fixed? He can't change?" -> Intercept at Layer 3 (Timing/Agency).
      *   *Interception Points:* Need to be precise.
          *   Consequentialism: When defining the "fruit" of action.
          *   Theism: When discussing the "mechanism" of delivery.
          *   Determinism: When discussing the "accumulation" vs. "new action."

  5.  **Deconstruct Deliverable 4: Check-for-Understanding:**
      *   *Goal:* Test application, not definition.
