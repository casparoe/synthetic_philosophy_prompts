      *   *Properties to Carry:* Intentionality (volition is key in karma), Moral Quality (independent of outcome), Latency (desert hangs pending).
      *   *Properties to Omit:* Specific religious rituals, caste details (distracts from moral structure), specific mechanics of rebirth (hell realms, etc.).

  4.  **Deconstruct Deliverable 3: Misconceptions & Interception:**
      *   *Sequence:*
