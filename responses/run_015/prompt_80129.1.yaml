      *   **Lewis/Counterpart Theory:** This feels like *Structural Equality* (`==` in Python for values, `equals()` in Java). Distinct objects on the heap that compare equal based on state. However, Lewis's relation is looser than strict structural equality. It's more like a "similarity match" or a "duck typing" check that is context-dependent.
