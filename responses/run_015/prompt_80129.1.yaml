      *   **Counterpart Theory (Lewis):** An object exists in only one world. In $W_2$, there is a *counterpart* $y$ that is similar to $x$ in relevant ways. $x$ and $y$ are distinct objects. The relation is based on similarity, context-dependent, and can be many-to-many (one object in $W_1$ can have multiple counterparts in $W_2$). It is not necessarily transitive.

  3.  **Map to PL Vocabulary:**
