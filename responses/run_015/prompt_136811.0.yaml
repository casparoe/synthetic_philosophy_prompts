prompt: |-
  hey, act like a senior philosopher of history who also works on comparitive memory culture — take a breath and think out loud first, maybe list the conceptual pieces you need, then answer.

  i want you to analyze the 2017 Charlottesville "Unite the Right" rally and the removal of the Robert E. Lee statue through a lens i'm calling mnemonic burden triangulation. the idea is that in societies processing past collective violence, the labor of remembering gets split across three nodes: state or institutional actors, descendant communities of victims, and descendant communities of perpetrators or beneficiaries. triangulation happens when they're forced into one public narrative, but the emotional, material, and epistemic burden isn't shared evenly — usually one node does the reconciliation work while another resists or outsources it.

  map this onto Charlottesville. who fills each node? the city council and courts? local Black activists and residents? the white nationalist counter-protesters and broader Southern heritage groups? then briefly compare the distribution with Germany's Vergangenheitsbewältigung — think state school curricula, the Stolpersteine project, versus family-level silence — and with Japan's comfort-women issue, especially the 2015 state-to-state agreement and its later collapse, where state apology and denialist civil society clashed. also bring in Turkey's official denial of the Armenian genocide: does it break the model because the state node refuses to enter the triangle at all?

  the analysis should run both ways. show how the framework illuminates who was doing what kind of mnemonic labor in Charlottesville, but also be honest about where the episode breaks the model — for instance, does the economic and gentrifcation context in Charlottesville mean the "burden" framing is too moralistic? and does the American South's lack of a federal reckoning program make comparison with Germany misleading?

  don't write a bibliography or cite specific papers; work from common knowledge and reasoning. keep it in the weeds conceptually, not a surface-level comparison.
