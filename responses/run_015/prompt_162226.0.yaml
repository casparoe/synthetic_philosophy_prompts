  **Most Sensitive Term:** **Term 1 (Grain-Fixed Divergence).**
  My number is most sensitive to the empirical claim that predictions converge. If you demonstrate a horizon where the "Simulator" model predicts token minimization and the "Agent" model predicts goal sacrifice, and they diverge significantly, my credence drops from 0.68 to ~0.30. This is the only term that can empirically falsify P.

  **Pivot Evidence:**
  A **"Stakes" Experiment**.
