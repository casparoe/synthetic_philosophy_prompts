      *   *Better Analogy:* Weather simulation. Simulating a hurricane doesn't make the computer wet. Simulating a digestion doesn't digest food. Why is mind different?
      *   *Roommate's Counter:* Mind *is* computation, digestion is chemistry.
      *   *Rebuttal:* That begs the question.

  7.  **Formulating the Commitment:**
