      *   *User:* The "Self"? (This is the hard problem spot).
      *   *Constraint:* Flag forced mappings.

  4.  **Analyzing Disanalogies:**
      *   *Noise/Analog:* Computers are digital/discrete; brains are wet/chemical/analog. Is the "computation" discrete enough to be emulated?
      *   *Design vs. Evolution:* CPUs are built to abstract away physics; brains *are* the physics.
      *   *Abstraction Levels:* Where does the "software" start? If you simulate atoms, is it software? If you simulate neurons, is it software?
      *   *Identity/Copying:* Copying a file doesn't copy *identity* in the intuitive sense. This hits the "teleportation paradox."
      *   *Threatening vs. Noise:* Noise = "Brains use electricity too." Threatening = "Consciousness might depend on specific physical causal powers, not just formal relations."

  5.  **Evaluating the Slow-Emulation Corollary:**
