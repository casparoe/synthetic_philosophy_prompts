      *   (7) *Duties:* Negative duties (avoid causing suffering) > Positive duties (fix wild suffering), especially given risk.

  3.  **Identify Potential Tensions:**

      *   *Tension A: (1) & (6) vs. (2) & (7).*
          *   (1) says suffering is the only bad. (2) & (7) say we shouldn't fix wild suffering due to risk/epistemic limits.
          *   (6) distinguishes farmed vs. wild regarding replacement.
          *   *Conflict:* If suffering is the *only* intrinsic bad (1), why is the duty to prevent it so weak in the wild (2, 7) but strong enough to dictate diet (3, 4, 5)? Is the epistemic barrier in (2) strong enough to override the axiomatic imperative in (1)?
          *   *Resolution:* (7) clarifies this as negative vs. positive duties. This is a standard distinction in negative utilitarianism. It's a friction, but maybe not a contradiction *if* the risk assessment in (2) is robust.

      *   *Tension B: (3) & (5) vs. (1).*
          *   (3) says count wild suffering in food choices. (5) says marginal beef might beat plants because plants kill more wild animals.
          *   (1) says species doesn't matter.
          *   *Conflict:* This seems consistent. If wild mice suffer in crop harvest, and cows suffer less (or live net positive) on marginal land, the math holds under (1).
          *   *Nuance:* The tension is between (5) and the *spirit* of anti-speciesism if the "marginal beef" argument relies on the cow having a "good life" (which implies positive experiences matter, not just negative). But (1) says "only intrinsic moral bad is negative phenomenal experience." It doesn't deny positive experience exists, just that it's not the *counterweight* to bad in a simple utilitarian calculus unless it's negative utilitarianism. Wait, (1) says "only intrinsic moral bad is negative phenomenal experience." It implies Positive Utilitarianism is false. It doesn't necessarily imply Negative Utilitarianism (where only reducing suffering matters), but it leans that way.
          *   *Crucial Check:* (6) says "if a farmed animal lives a net-positive life... painless death is not an additional harm." This implies a asymmetry: Suffering is bad, Happiness is good (or at least neutralizes bad). If (1) is strict Negative Utilitarianism, "net-positive" doesn't cancel out "death" unless death is neutral. (1) says painless death is not harm. So (6) is consistent with (1).
          *   *Real Tension:* (5) relies on the claim that marginal beef causes *less total wild suffering* than plants. This is an empirical claim, not a logical one. But logically, does it fit (3)? Yes.

      *   *Tension C: (2) vs. (3)/(4)/(5).*
          *   (2) says we can't intervene in wild ecosystems because we don't understand them well enough (epistemic humility).
          *   (3)/(4)/(5) say we *can* calculate the wild animal impact of agriculture well enough to make dietary choices (beef vs. chicken vs. plants).
          *   *Conflict:* This is the biggest logical gap. If ecosystem dynamics are too complex to justify predator culling (2), how are they simple enough to justify the claim that row crops kill more/worse than marginal grazing (5)? Agriculture *is* ecological intervention. Claiming to know the net wild suffering impact of agriculture requires the same ecological knowledge claimed to be lacking in (2).
          *   *Severity:* High. This is an epistemic inconsistency.

      *   *Tension D: (6) vs. (1).*
          *   (1) Anti-speciesist. (6) Treats farmed and wild animals differently regarding replacement.
          *   *Conflict:* Is this speciesism? No, it's contextual. Farmed animals are in a "managed system," wild are not.
          *   *Nuance:* (6) says wild births/deaths aren't designed for welfare. But if (1) is true, the *cause* of the birth/death doesn't matter, only the suffering. If I kill a wild animal painlessly, is it harm? (1) says no. If I kill a farmed animal painlessly, is it harm? (1) says no. So why the distinction in (6)?
