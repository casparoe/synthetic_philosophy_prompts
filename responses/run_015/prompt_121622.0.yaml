      *   **Structure:**
          1.  Executive Summary (Coherence rating).
          2.  Genuine Tensions (Ordered by severity).
          3.  Dissolved Tensions (Surface friction).
          4.  The Single Revision Recommendation.
      *   **Tone:** Analytical, philosophical, precise. No preaching.
      *   **Specifics:** Cite commitment numbers.

