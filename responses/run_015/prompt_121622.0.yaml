  2.  **Deconstruct the Commitments:**
      *   (1) *Axiom:* Suffering-focused anti-speciesism. Bad = negative experience. Species = irrelevant. Painless death $\neq$ harm.
      *   (2) *Wild Intervention:* Wild suffering is huge, but *direct intervention* (culling, restructuring) is too risky epistemically.
      *   (3) *Food Scope:* Count suffering of *all* sentient beings affected by food production (farmed + wild).
      *   (4) *Beef vs. Chicken:* Conventional beef > chicken (worse) due to land use/wild harm.
      *   (5) *Marginal Beef vs. Plants:* Marginal pasture beef *might* be < plants (less wild harm than row crops).
