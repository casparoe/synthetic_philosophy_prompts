          3.  The counterfactual: What happens to that marginal land if not grazed? (Rewilding? Desertification?)
      *   If (2) is true (we can't predict trophic restructuring), can we really predict the net suffering delta between cropping and grazing? Cropping *is* trophic restructuring.
      *   *Verdict:* This is the strongest tension. You can't claim epistemic inability to fix nature while claiming epistemic ability to calculate the suffering footprint of modifying nature for food.

  5.  **Deep Dive into the Axiomatic Tension (1 vs. 6):**
      *   (1) "Only intrinsic moral bad is negative phenomenal experience."
      *   (6) "I deny that this replacement logic extends to wild populations, because wild births and deaths are not part of a managed system designed to preserve net welfare."
      *   If I painlessly kill a wild animal, (1) says no harm.
      *   If I painlessly kill a farmed animal, (1) says no harm.
      *   So why does (6) distinguish them? (6) is about *replacement*.
      *   Farmed: Kill A -> Bring in B. B has net positive life. Total utility = Good.
      *   Wild: Kill A -> No B (or B comes naturally).
