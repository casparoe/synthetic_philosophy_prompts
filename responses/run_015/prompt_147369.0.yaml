answer: |-
  If we buy the structuralist argument that Hitler was basically a fungible node—that the Nazi machine would have churned out similar atrocities even if he'd died in 1938—it blows up the traditional legal model that pins systemic evil on a single "Great Man." Most command-responsibility doctrines assume there's a singular apex predator whose specific intent drives the crime. If the leader is swapable, that doctrine struggles because the atrocity isn't dependent on his unique will; it's dependent on the bureaucracy's design. The mechanism that breaks is "Apex Liability"—the idea that justice is served just by punishing the dictator. That doesn't fix the machine. Instead, accountability shifts onto the institution itself. We move toward frameworks like organizational criminality (like declaring the SS a criminal organization at Nuremberg) or corporate liability. It stops being about "who gave the order" and starts being about "what rules allowed the order to exist." Prevention policy stops focusing on regime change or monitoring specific dictators and starts targeting the bureaucratic incentives and compliance structures that make genocide efficient regardless of who sits at the top.

