      *   *Objection 4 (Clinical Utility):* Does this help me treat patients? Or just make them feel better about a label?
      *   *Objection 5 (Slippery Slope):* If we move this, do we move paraphilias? Psychopathy?
      *   *Objection 6 (Political):* Admit it, this was WHO bowing to pressure, not epistemic rigor.
      *   *Objection 7 (Comorbidity):* High rates of depression/anxiety. How do you separate the incongruence from the pathology?
