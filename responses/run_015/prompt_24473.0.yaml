      *   *Audience Belief:* Disorders are natural kinds (or at least valid constructs) existing independently of labels. RDoC focuses on neurobiology/behavior, not social labeling. Hacking = "soft science"/relativism.
      *   *The Conflict:* The audience sees "validity" as tracking biology/etiology. The speaker sees "validity" as avoiding iatrogenic harm caused by classification itself.
      *   *Risk:* Being seen as advocating for political correctness over science.

  3.  **Brainstorming Objections (filtering for the specific audience):**
