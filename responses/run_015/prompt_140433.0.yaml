      *   The user is essentially asking about the *honesty* and *causal efficacy* of the generated text. Is the CoT the *cause* of the answer, or just a post-hoc justification generated to satisfy the reward model?
      *   I need to address the philosophical presuppositions (functionalism vs. eliminativism), the empirical distinguishability (mechanistic interpretability), and the practical implications (training adjustments).

