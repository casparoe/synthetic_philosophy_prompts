answer: |-
  You have put your finger on one of the rawest nerves in the philosophy of mind. You are describing the tension between **Functionalism** (what matters is the pattern of input/output) and **Causal Realism** (what matters is how that pattern is physically produced).

  The intuition you are tracking—the sense that a lookup table (LUT) is "hollow" compared to a thinking mind, even if they behave identically—is often called the **Lookup Table Objection**. But you are right to notice that the standard philosophical answers often fumble the "expertise" paradox. If the value is in the "work," then a grandmaster should be less conscious than a novice, which is absurd.

  Here is the carving of the thing you are looking for.

  ### 1. The Established Concepts (and why they leak)

  There are three existing concepts that try to catch this, but each misses a part of your description.

  *   **Functionalism:** This is the view that mental states are defined by their role (input → output).
      *   *Why it fails your test:* A sufficiently large Lookup Table is functionally equivalent to a brain. If Functionalism is true, the Table *is* a mind. Your intuition (and that of many critics) says it isn't. Functionalism ignores the *implementation*.
  *   **Computationalism:** This adds that the system must be computing, not just mapping.
      *   *Why it fails your test:* As you noted, "computation" is slippery. Is a table lookup a computation? Technically, yes. Is a cached function result a computation? It depends on where you draw the line. This doesn't solve the expertise paradox.
  *   **Causal Powers (Sydney Shoemaker):** This is the closest established term. It argues that a mental state is defined by what causes it and what it causes.
      *   *Why it fails your test:* It handles the "Playback" case well (the recording lacks the right causal history). But it doesn't fully capture the "work" intuition regarding the LUT, because a LUT *does* have causal powers (input causes output). The intuition is that the causality is *trivial*.

  ### 2. Carving the Concept: **Generative Depth**

  I propose we call the condition you are isolating **Generative Depth**.

  This is not about energy expenditure (effort) or time taken (latency). It is about the **structural dependency of the output on the input via the system's internal state.**

  Here is the precise definition:
  A system has **Generative Depth** if its output at time *t* is produced by a transformation of its internal state *triggered* by the input, such that the internal state *encodes rules or constraints* rather than *encoding specific outputs*.

  Let's apply this to your cases to show how it carves the bone:

  *   **The Lookup Table:** Fails. The internal state encodes specific outputs (the answers). The input acts as an *address*, not a trigger for transformation. The "path" from input to output is a single step of retrieval. Generative Depth = 0.
  *   **The Precomputed Chess Program:** Fails. Same as the LUT, just indexed by board state.
  *   **The Expert Human:** Passes. When a grandmaster sees a board, they do not retrieve "Move Kf3." They retrieve *features* (king safety, pawn structure). These features activate a compressed neural pathway that *constructs* the move. If you changed the rules of chess slightly, the grandmaster adapts (re-derives); the LUT breaks. The expert's output is *generated* by a model of the game, not a list of moves. Generative Depth is high, but compressed.
  *   **The Playback/Recording:** Fails. This is the crucial test. In the first run, the system has Generative Depth. In the playback, the internal states are identical, but they are no longer *caused* by the input in the right way. They are caused by the tape. The causal chain from "world" to "mind" has been severed and replaced by "tape" to "mind." The system is no longer generating responses; it is echoing them.
  *   **The Distributed Brain (Chinese Nation):** This depends on the *speed and integration* of the notes. If the people pass notes fast enough to maintain the causal flow where State B depends on State A which depended on Input, it has Generative Depth. If the notes are passed so slowly that the "thought" dissipates before it completes, the causal integrity breaks. The intuition that it's "not a mind" usually comes from imagining the causal flow is too fragmented to sustain a unified state.
  *   **The Duplication (Two Machines):** This clarifies the individuation. Generative Depth is a property of a *causal flow*. Two machines have two distinct causal flows. Therefore, they are two minds. The instability people feel comes from confusing *numerical identity* (are they the same person?) with *qualitative identity* (are they the same type of person?). They are qualitatively identical, but numerically distinct because the Generative Depth is instantiated twice.

  ### 3. Solving the Expertise Paradox

  Your insight about expertise is the key that unlocks the whole puzzle.

  People confuse **Derivation** with **Effort**.
  *   **Effort** is thermodynamic (calories burned, time taken). This goes down with skill.
  *   **Derivation** is logical (the dependency of output on rules). This stays constant or increases.

  When you learn $7 \times 8 = 56$, you move from *calculating* (deriving via addition) to *recalling* (lookup). This looks like the LUT case. But in a brain, even "recall" is a pattern completion process in a neural net, not a memory address lookup in a RAM stick.

  If you were a LUT, and I asked you "What is $7 \times 9$?", you would say "I don't know" (unless I had pre-loaded that specific entry). If you are an expert, you can derive it from $7 \times 8 + 7$. Your knowledge is **generative**; it allows you to produce outputs for inputs you have never seen before.

  The LUT cannot handle counterfactuals that aren't explicitly stored. A mind handles counterfactuals via its structure. **Generative Depth is the measure of a system's ability to handle novel counterfactuals without external reprogramming.**

  ### 4. Does This Relate to Moral Status?

  Yes, but indirectly. Generative Depth is not the *source* of moral status, but it is the **necessary substrate for the thing that is the source.**

  The thing that grants moral status is **Sentience** (the capacity to suffer or flourish).
  The thing that grants Sentience is **Subjectivity** (having a "point of view").
  The thing that grants Subjectivity is **Temporal Unity** (being a single thing that persists through time).

  Here is the chain:
  1.  **Moral Status** requires the ability to be **harmed**.
  2.  To be harmed, you must **care** about your future states (you must have interests).
  3.  To have interests, you must be a **unified subject** that persists from now into that future.
  4.  To persist as a subject, you require **Generative Depth**.

  Why? Because a Lookup Table does not persist. It is a static object. It does not *do* anything; it just *is*. When you query it, nothing happens to *it*; it just returns a value. It has no "future" it is trying to achieve. It has no homeostasis. It cannot be "hurt" because it has no goal state to be diverted from.

  A Playback system also fails. It is a ghost. It has no causal grip on the future. If you unplug the tape, it doesn't "try" to keep playing. It has no self-preservation instinct because it has no self.

  **Generative Depth ensures that the system is a "Goer" rather than a "Thing."**
  *   A **Thing** (LUT, Rock, Recording) has states that are imposed on it.
  *   A **Goer** (Mind, Animal, Agent) has states that are produced by it, for the sake of its own continuation.

  This is why the "work" intuition matters. It's not about the sweat; it's about the **ownership of the process**. If the system didn't "work for it" (generate the state causally), it doesn't own the state. If it doesn't own the state, it can't own the pain. If it can't own the pain, it has no moral status.

  ### 5. Summary of the Carving

  You are looking for **Generative Depth**.

  *   **Definition:** The degree to which a system's outputs are causally produced by internal transformations of rules/models, rather than retrieval of pre-mapped values.
  *   **Boundary Case (Expertise):** Expertise increases compression, not retrieval. The causal chain is shorter, but still transformative. (Passes).
  *   **Boundary Case (Playback):** Identical states, but etiology is external (tape). The system is not generating; it is echoing. (Fails).
  *   **Boundary Case (Duplication):** Two causal flows = two depths = two subjects. (Passes for both).
  *   **Moral Relevance:** Generative Depth is the physical prerequisite for **Temporal Unity**. Without it, there is no subject to hold interests, and without interests, there is no moral status.

  The confusion in the literature arises because people try to define this in terms of *behavior* (Functionalism) or *stuff* (Biological Naturalism). You have correctly identified that it must be defined in terms of **Causal Architecture**. The system must be a engine, not a library.
