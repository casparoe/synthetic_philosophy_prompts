answer: |-
  **Prep**
  Print two distinct packets. Both contain the same five-archive documents (see below), but the cover sheets differ. Packet A header: "Project Legacy: Trace the origins of modern efficiency." Packet B header: "Project Loss: Trace the origins of modern fragility." Seat the room in two halves (Left/Right). Do not mix the packets. Place a sealed envelope on the table marked "The Actual Minutes, 1902" – do not open until minute 60. Give the historian a sealed envelope containing £50 and a note: "Open only if you speak before minute 75." Prepare a whiteboard column for "Wager Points." Each participant starts with 10 points. They will bet on how strongly the documents support their assigned narrative. This creates the receipt: their early confidence vs. later realization.

  **The Archive**
  *Subject: The Oakhaven Municipal Illumination Commission, 1901.*

  1.  **Engineer's Report (Jan 1901):** Compares Gas vs. Electric. Gas is warmer, safer for eyes, existing infrastructure. Electric is brighter, cleaner, but requires new copper wiring. Notes: "Both systems technically viable for current needs."
  2.  **Ratepayers' Letter (Feb 1901):** Complains about cost. "Why change what works?" Mentions recent bad harvest affecting local funds. "Prudence over novelty."
  3.  **Committee Minute (March 1901):** Records a heated debate. Chairman notes: "We must resolve this quarter to unlock the municipal bond." No vote recorded, only "Decision reached."
  4.  **Private Letter (Chairman to Copper Supplier, March 1901):** "Dear Arthur, pleased to confirm the wiring contract will proceed as discussed. Your contribution to the campaign chest is acknowledged."
  5.  **Newspaper Headline (April 1901):** "Oakhaven Embraces the Future! Electric Light Selected as Symbol of Progress." Editorial claims gas was "dead weight."

  *The Reality (Sealed Envelope):* Electric won. Not due to tech superiority (Report said both viable) nor public will (Ratepayers objected). Won because the Chairman needed the bond unlocked and had a kickback arrangement with the copper supplier. The "Progress" narrative was post-hoc PR. The "Fragility" narrative (dependency on external copper/grid) was equally real but incidental to the decision.

  **Run Sheet**
  **00-10: Setup.** Welcome everyone. Distribute packets randomly (Left gets A, Right gets B). Explain the wager: "You have 10 points. Bet points on how clearly your assigned narrative is supported by the text. Max 5 per document." Collect bets.
  **10-30: Reading.** Silent reading. Participants annotate documents to support their header (Legacy vs. Loss). They will naturally cherry-pick: Group A highlights "Symbol of Progress"; Group B highlights "Prudence over novelty" ignored.
  **30-45: Construction.** Groups draft a 3-minute oral history of the decision. Group A must frame it as "The Inevitable March." Group B must frame it as "The Critical Turning Point Where We Went Wrong." They must use the documents as proof.
  **45-60: Presentation.** One speaker per group presents. They will sound convincing. They will treat the outcome (Electric) as the gravitational pull explaining the documents.
  **60-75: The Reveal.** Open the sealed envelope. Read the Private Letter and the Bond constraint aloud. Ask them to recalculate their wagers. Most should lose points; their causal links were fictional.
  **75-90: Debrief.** Compare the two narratives. Show how both used the same evidence to prove opposite teleologies.

  **Debrief**
  Do not lecture. Ask: "Group A, you said the Engineer's Report proved efficiency was inevitable. Group B, you said the same report proved resilience was sacrificed. How can the same document prove opposite trajectories?"

  Let them sit with the contradiction. Then, name the moves on the whiteboard.
  1.  **The End in Hand:** You knew Electric won. You made the documents align with that outcome.
  2.  **Ancestor Selection:** Group A ignored the Ratepayers (losers). Group B ignored the Engineer's viability check (nuance). You only kept what leads to *now*.
  3.  **Scoring by Distance:** This is the key. Group A scored the past high because it looks like us (Progress). Group B scored the past low because it looks like us (Decline). Both assumed *we* are the scorecard.

  Highlight the historian's envelope. "If they had spoken, they would have told you the decision was about a bond kickback, not history. You wrote a road to the present. The past was just a parking lot." This names the vice without preaching it. The wager loss is the physical receipt of their bias.

  **Failure Modes**
  1.  **The Historian:** They might blurts out "This is Whig history" at minute 20. The bribe is your insurance. If they speak, terminate the wager, acknowledge the spoil, and pivot to discussing why the term exists.
  2.  **The Meta-Critic:** Someone will say, "But all history is written backwards; we can't know the future." This is true but misses the point. Counter: "We aren't asking you to predict the future. We're asking you to notice when you treat the present as the *judgment* of the past. You can write contingency without scoring by proximity."
  3.  **The Code-Breaker:** A programmer might spot the "Copper Supplier" letter too early. If this happens, ask them to hold the thought until the reveal. If they leak it, the wager collapses. Have a backup wager: "Bet on how much the Newspaper headline influenced the vote."
  4.  **Ambiguity Failure:** If the documents feel too slanted, one group will struggle. Ensure the Engineer's Report is genuinely neutral. If Group B struggles to find "decline," prompt them: "What capacity was lost?"

  **What This Can't Teach**
  This exercise exposes *narrative bias*, not *structural determinism*. It shows how we select ancestors, but it cannot teach when structures actually *do* constrain outcomes. Sometimes electricity *was* inevitable due to physics, not narrative. This session risks implying all causality is fictional. You must clarify: "The kickback was real causality. Your stories were fictional causality. Distinguishing them requires evidence, not just humility." Also, this doesn't solve the problem of having to write history at all. We always stand in the present. The goal isn't to escape the present, but to stop using it as a verdict. You will need to say this explicitly; the exercise only produces the confusion, not the resolution.
