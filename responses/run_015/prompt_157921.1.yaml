      *   Ensure I'm not being wishy-washy. The user wants "blunt."
      *   Avoid academic hedging ("Some philosophers argue..."). State the logical constraints.
      *   Make sure the distinction between *requirement* and *prejudice* is sharp.

  8.  **Self-Correction/Check during drafting:**

