      *   *Check:* Is the "Killer Criterion" actually distinct? *Adjustment:* Focus on the *No-Report* paradigm as the empirical instantiation of the P-Con/A-Con distinction.

  9.  **Final Polish:** Check against the prompt's specific constraints (no citations, keep weight on criteria). (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to take a side on *which* theory is true, but rather which *requirement* does the most damage. The prompt asks "which single requirement... does the most work in knocking out candidates." I should identify the requirement that creates the most friction across the board. The **Phenomenal/Access Distinction** is the standard candidate here, specifically operationalized via **No-Report Paradigms**.

  Let's assemble the "Spec."

  *   **Requirement 1: Empirical Consistency.** (Can't contradict lesion data, timing).
  *   **Requirement 2: Phenomenal Range.** (Must cover sleep, anesthesia, dreams).
  *   **Requirement 3: Conceptual Distinctions.** (P-Con vs A-Con, Creature vs State).
