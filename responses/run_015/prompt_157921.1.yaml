      *   *Selection:* The distinction between **Phenomenal Consciousness and Access/Report** is the biggest wedge. It kills GWT (conflates them) and HOT (makes phenomenology dependent on access-like states). It forces a theory to explain *what it feels like* independently of *what you can do with it*.

