answer: |-
  Here is the spec. It is stripped of metaphysical wish-fulfillment and focused on functional adjudication.

  ### Part 1: The Spec (Requirements for Adequacy)

  To count as adequate, a theory must satisfy the following five constraints. If it fails one, it is incomplete; if it fails two, it is likely false.

  **1. Empirical Consistency (The "Don't Contradict Data" Rule)**
  *   **Requirement:** The theory cannot contradict established neural correlates of consciousness (NCC), lesion data, or timing constraints.
  *   **Why:** If a theory says consciousness requires prefrontal cortex (PFC) activity, but patients with bilateral PFC lesions report normal conscious experience, the theory is falsified. If it says consciousness takes 500ms, but masking experiments show effects at 150ms, it is falsified.
  *   **Phenomena:** Blindsight (perception without report), Anesthesia/Coma (loss of consciousness with preserved brainstem activity), Split-brain (two streams of control).

  **2. Phenomenal Range (The "State Space" Rule)**
  *   **Requirement:** The theory must map the entire space of conscious states, not just wakeful, attentive, reportable perception.
  *   **Why:** A theory that only explains "seeing a Gabor patch and pressing a button" is a theory of report, not consciousness.
  *   **Phenomena:**
      *   **Sleep/Dreams:** Experience without sensory input or motor output.
      *   **Anesthesia:** The specific boundary where experience switches off.
      *   **Specious Present:** How temporal integration happens (why we hear a melody, not just notes).
      *   **Unity:** Why the visual field is a single scene despite modular processing.

  **3. Conceptual Hygiene (The "Distinction" Rule)**
  *   **Requirement:** The theory must formally distinguish between specific categories that are empirically dissociable. It cannot define them as identical.
  *   **Why:** If a theory collapses these, it cannot explain cases where they come apart.
  *   **Distinctions:**
      *   **Creature vs. State:** A human can be conscious (creature) but asleep (no visual state).
      *   **Phenomenal (P-Con) vs. Access (A-Con):** Having an experience vs. being able to use it for reasoning/report.
      *   **Experience vs. Self-Knowledge:** Feeling pain vs. knowing "I am in pain."
      *   **Conscious *of* X vs. Conscious *that*:** Seeing red vs. judging that one sees red.

  **4. Edge Case Adjudication (The "Verdict" Rule)**
  *   **Requirement:** The theory must provide a truth-conditional verdict on disputed entities. "Maybe" is allowed only if the physical parameters are unspecified.
  *   **Why:** The utility of the theory lies in its ability to resolve moral and scientific uncertainty.
  *   **Cases:**
      *   **24-week Fetus:** Verdict depends on thalamocortical connectivity vs. subcortical sufficiency.
      *   **Crow:** Verdict depends on whether analog processing in nidopallium suffices for P-Con.
      *   **Split-Brain:** Are there one or two subjects?
      *   **AI with Self-Monitor:** Does functional self-modeling generate P-Con?

  **5. The Subjectivity Constraint (The "For Whom" Rule)**
  *   **Requirement:** The theory must specify the *subject* of the experience. It must explain why *this* state is felt by *this* entity.
  *   **Why:** Without this, you have a theory of information processing, not consciousness. It solves the "ownership" problem.
  *   **Phenomena:** Somatoparaphrenia (denying ownership of a limb), Thought insertion (schizophrenia), Rubber Hand Illusion.

  ---

  ### Part 2: Non-Negotiables vs. Camp Prejudices

  You asked to separate the steel from the slag. Here is the filter.

  **Non-Negotiable (Keep these):**
  1.  **Empirical Consistency:** You cannot contradict lesion/timing data.
  2.  **Edge Case Adjudication:** You must take a stand on the crow/fetus/AI.
  3.  **The Subjectivity Constraint:** You must identify the experiencer.

  **Camp Prejudices (Drop these):**
  1.  **"Must Dissolve the Explanatory Gap":** This is a metaphysical demand, not a functional spec. A theory can be adequate (predictive, distinct, consistent) without explaining *why* physics feels like something. Demanding this eliminates all physicalist theories prematurely.
  2.  **"Must be Straightforwardly Third-Person Testable":** This is a behaviorist hangover. Consciousness is essentially first-person. Demanding pure third-person verification begs the question against realism. The requirement should be "Must predict first-person reports under specified conditions," not "Must be observable directly."
  3.  **"Must Align with Folk Intuition":** Folk intuition says the sun goes around the earth. Folk intuition on consciousness is unreliable (e.g., intuition says we see the whole visual field in detail, vision science says no).

  **The Resulting List:** Once you drop the "Dissolve the Gap" and "Pure Third-Person" demands, you are left with a theory that predicts reports and neural states without promising to solve metaphysics. This makes the job harder, not easier, because you can't hide behind "it's an illusion" or "it's untestable."

  ---

  ### Part 3: Incompatible Pairs (The Trade-Off)

  You suspected a trade-off. You are right. There is a tension that likely cannot be jointly satisfied without significant cost.

  **The Pair:**
  1.  **Rich Animal/Infant Consciousness:** Consciousness does not require concepts, language, or higher-order cognition (allows crows, infants, fetuses to be conscious).
  2.  **Tight Report/Access Link:** Consciousness is necessarily tied to the ability to access, report, or conceptualize the state (explains why we can't talk about unattended stimuli).

  **The Conflict:**
  If you satisfy (1), you must adopt a First-Order or Biological theory. But then (2) becomes mysterious: why is report so tightly correlated with consciousness if it's not constitutive? You have to treat report as a contingent add-on.
  If you satisfy (2), you adopt a Higher-Order or Global Workspace theory. But then (1) collapses: crows and infants likely lack the requisite conceptual architecture, so they are philosophical zombies.

  **The Blunt Truth:**
  You cannot have a theory that grants rich phenomenology to non-conceptual creatures *and* makes report/access a necessary condition for consciousness. You must choose which intuition to sacrifice. Most theories pick one and explain away the other.
  *   **Choice A:** Animals are conscious; report is just a probe. (Risk: Hard to distinguish from unconscious processing).
  *   **Choice B:** Report/Access is constitutive; animals are not conscious. (Risk: Moral horror, counter-intuitive).

  ---

  ### Part 4: Your Thought Experiments (HOT Pressure Points)

  You constructed these to test Higher-Order Theories (HOT). Here is the evaluation of their fairness and predictive power.

  **1. Silent Substitution**
  *   **Setup:** HO state is fixed ("I am seeing red"). FO state changes (Red → Green → Sound → Nothing).
  *   **HOT Prediction:** Since the HO state constitutes the phenomenology, the experience should remain "seeing red" (perhaps becoming veridical or illusory). If the FO state is removed entirely, the experience should persist as a hallucination of red, provided the HO state persists.
  *   **Fairness:** **Fair.** This tests the *constitutive* claim of HOT. If HOT says the FO state matters for the *quality* of the experience, it ceases to be a pure HOT and becomes a hybrid.
  *   **Verdict:** If the subject reports "Now I hear a tone" despite the HO state saying "I see red," HOT is in trouble. It forces HOT to explain why the HO state doesn't override the FO content.

  **2. Crossed Wires**
  *   **Setup:** HO state in System A targets FO state in System B.
  *   **HOT Prediction:** Consciousness belongs to System A (the owner of the HO state). The content is determined by System B.
  *   **Fairness:** **Fair.** This tests the *Subjectivity Constraint*. It forces the theory to locate the "I."
  *   **Verdict:** This is a strong test. If HOT says System A feels System B's pain, it implies consciousness is transferable via information links. If it says "No, it's still System B's pain," it admits the HO state isn't sufficient for ownership. Most HOTs bite the bullet: System A is conscious of System B's state. This is counter-intuitive but logically consistent for HOT.

  **Are these built-in objections?**
  No. They are valid stress tests. They force the theory to choose between *content determination* (Silent Substitution) and *subject ownership* (Crossed Wires). A theory that waffles on these is not adequate.

  ---

  ### Part 5: The Killer Requirement

  You asked for the single requirement that does the most work in knocking out candidates.

  **The Winner: The Phenomenal/Access Distinction (operationalized via No-Report Paradigms).**

  **Why it kills:**
  It forces a theory to explain how you can have an experience *without* the ability to report or access it for reasoning.

  *   **Knocks out Classic Global Workspace Theory (GWT):** GWT defines consciousness as global availability (access). If you show consciousness without availability (e.g., rich dream states, or no-report paradigms where neural signatures of consciousness persist without report), GWT must either redefine consciousness or deny the data. It conflates P-Con and A-Con.
  *   **Knocks out Actualist HOT:** If a higher-order thought is required, and thoughts are conceptual/access-heavy, then non-conceptual creatures (infants/crows) and non-reportable states (peripheral vision) lose their consciousness. HOT struggles to explain rich phenomenology without intellectualizing it.
  *   **Knocks out Illusionism:** Illusionism says P-Con doesn't exist, only the *judgment* of P-Con exists. The requirement demands the theory account for the *experience* itself, not just the judgment. If the spec demands realism about phenomenology (which your edge cases imply), Illusionism is out by definition.
  *   **Spares First-Order Representationalism (FOR):** FOR handles this best. It says the FO state is the experience; access is separate. It easily allows for unconscious access (blindsight) and inaccessible experience (peripheral vision/animals).
  *   **Spares Biological/Naturalistic Theories:** These ground consciousness in specific biological substrates, independent of functional access.

  **The Scorecard:**

  | Theory | Performance on P-Con / Access Distinction | Fatal Flaw |
  | :--- | :--- | :--- |
  | **Global Workspace** | **Fail** | Conflates consciousness with report/access. Cannot explain rich dreams or no-report NCC. |
  | **Higher-Order (Actualist)** | **Fail** | Over-intellectualizes. Makes consciousness dependent on conceptual capacity (fails Crow/Fetus). |
  | **Illusionism** | **Fail** | Denies the datum. Fails the "Phenomenal Range" requirement (says dreams aren't real experiences). |
  | **First-Order (FOR)** | **Pass** | Distinguishes FO state (experience) from Access (report). |
  | **Integrated Info (IIT)** | **Pass** | Grounds consciousness in structure, independent of function/access. |

  **Conclusion:**
  If you enforce the **Phenomenal/Access Distinction** as a non-negotiable requirement, you eliminate the dominant functionalist theories (GWT, HOT) and the eliminativists (Illusionism). You are left with theories that posit consciousness as a specific kind of first-order state or physical substrate.

  If you want to adjudicate the cases you care about (crow, fetus, split-brain), you must demand that the theory explains **experience without report**. If a theory cannot do that, it is a theory of behavior, not consciousness.
