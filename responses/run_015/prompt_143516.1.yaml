      *   *Misconception 2: Empirical DNA Claim.* (OE = DNA makes you you).
          *   *Fix:* During the example analysis. Point out siblings share parental DNA source but are different individuals. OE is about the *particular* zygote, not the *type* of DNA.
      *   *Misconception 3: Cosmic Destiny.* (OE = you were meant to be).
          *   *Fix:* In the "What OE is not" section. Distinguish metaphysical necessity from teleology.

  5.  **Drafting the Check-Question:**
      *   Needs to test *modal* understanding, not memory.
      *   Bad: "What is Origin Essentialism?"
      *   Good: A counterfactual scenario requiring application.
      *   *Idea:* Ask about a hypothetical where the origin is the same but development is radically different (e.g., raised by wolves, different planet). If they say "It's still the same organism," they get OE (identity vs. properties).
      *   *Better:* Ask about the *reverse*. Same parents, same time, *numerically distinct* gamete that happens to have identical DNA (theoretically). Is it the same organism? (Tests if they understand OE is about the *particular matter*, not just the genetic code).
      *   *Selection:* The "Identical Twin/Clone" distinction or the "Different Gamete, Same DNA" thought experiment. Let's go with the "Different Gamete" one to reinforce the material origin point.

  6.  **Determine What to Leave Out:**
