      *   **Tone:** Professional, structured, pedagogical, precise.

  2.  **Determine the Dependency Order:**
      *   *Goal:* Get biology majors to understand a modal metaphysical claim about biological entities.
      *   *Option A: Modal Possibility First.* Risk: Too abstract, boring for bio majors. They might tune out before getting to the biology.
      *   *Option B: Personal Identity First.* Risk: Too psychological. OE is about *biological* organisms, not persons/minds.
      *   *Option C: Biology of Gametes First.* Risk: Gets stuck in empirical details without seeing the philosophical point.
      *   *Best Path:* Start with the intuition (the example), then extract the principle, then clarify the modal status.
      *   *Revised Order:*
          1.  Concrete Biological Case (The Hook).
          2.  The Intuitive Judgment (What *could* have happened?).
          3.  The Philosophical Principle (OE).
          4.  Clarification/Negation (What OE is *not*).
          5.  Critique/Contestation (PhilBio pushback).
      *   *Why:* Bio majors trust concrete biological mechanisms. Abstract modal logic scares them off. Anchor the metaphysics in the biology they know, then show where the philosophy takes over.

  3.  **Select the Carrying Example:**
      *   *Candidate 1: "Met on a different Tuesday".* (Parents meet later, conceive same child).
          *   *Pros:* Classic Kripke.
          *   *Cons:* Vague on biological mechanism. Bio majors will ask "But is it the *same* zygote?" It conflates timing with material origin.
      *   *Candidate 2: IVF/Gamete Swap.* (Same parents, different sperm/egg).
          *   *Pros:* Biologically precise. Isolates the *material origin* (the specific gametes) from the *parents* (the source). Directly addresses the "same DNA" confusion (siblings share parents but different gametes).
          *   *Cons:* Slightly more technical to set up.
      *   *Decision:* **IVF/Gamete Swap.**
      *   *Why:* It forces the distinction between "coming from the same *people*" vs. "coming from the same *cells*." This is crucial for OE. The "Tuesday" example is too loose for biology majors who know conception is a specific cellular event.
      *   *Properties Needed:* Same parents, same time (roughly), *different* specific gametes.
      *   *Properties to Avoid:* Cloning (asexual), environmental factors (epigenetics distracts from origin), time-travel scenarios.

  4.  **Address Misconceptions & Timing:**
      *   *Misconception 1: Genetic Determinism.* (OE = your traits are fixed).
