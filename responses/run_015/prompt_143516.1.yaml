answer: |-
  Here is a structured 25-minute teaching plan designed for biology majors with minimal philosophy training.

  ### 1. Dependency Order & Rationale
  **Do not start with modal logic.** Biology majors are trained in empirical mechanisms, not possible worlds semantics. If you start with "necessity" and "contingency," you will lose them.

  **Recommended Sequence:**
  1.  **Biological Mechanism (The Hook):** Establish the physical facts of conception.
  2.  **Intuitive Judgment:** Elicit their pre-theoretical verdict on identity.
  3.  **The Philosophical Principle:** Formalize that intuition into Origin Essentialism (OE).
  4.  **Negation (What it is NOT):** Strip away the empirical/teleological baggage.
  5.  **Critique:** Show where the principle breaks down in biology.

  **Why this order?** You are leveraging their expertise (biology) to ground the metaphysics. You move from *what happens* (empirical) to *what could have happened* (modal) to *why we say that* (metaphysical).

  ---

  ### 2. The Carrying Example
  **Use the IVF/Gamete Case.** Discard the "Parents met on a different Tuesday" story.

  **The Scenario:**
  > "Consider a specific IVF procedure. Parent A provides an egg; Parent B provides a specific sperm sample containing millions of sperm. In the actual world, Sperm #4,502 fertilizes the Egg. That zygote develops into **You**.
  >
  > Now, imagine a counterfactual scenario: Everything is identical—the parents, the time, the lab, the egg—but **Sperm #4,503** (your potential sibling's sperm) fertilizes the egg instead."

  **Why this works (and "Tuesday" fails):**
  *   **Precision:** "Meeting on a Tuesday" is vague about the biological mechanism. Bio majors know conception is a discrete cellular event. The IVF case isolates the *material cause* (the specific gametes) from the *efficient cause* (the parents).
  *   **Genetic Control:** It prevents the confusion that "same parents = same DNA." Bio majors know siblings share ~50% DNA but are distinct organisms. This example forces them to admit that even with the *same* parents and *same* time, a different gamete yields a *different* individual.
  *   **Material Specificity:** OE is about *this* matter, not *this* type of matter. The IVF case highlights the numerical distinctness of the sperm cells.

  **Properties the Example MUST Have:**
  *   **Sexual Reproduction:** Avoid asexual examples (bacteria/plants) initially; they complicate OE (see "Contested" below).
  *   **Specific Gametes:** Must refer to token cells (this specific sperm), not types (a sperm from this father).
  *   **Same Parents:** Keep the parents constant to isolate the gametes as the variable.

  **Properties the Example MUST Lack:**
  *   **Cloning:** Do not introduce somatic cell nuclear transfer yet; it confuses "origin" with "genetic code."
  *   **Time Travel:** Keep the timeline linear to avoid causal loop distractions.
  *   **Environmental Variance:** Keep the uterus/environment identical in the thought experiment so the *only* difference is the origin.

  ---

  ### 3. Sequence for Heading Off Misconceptions
  Do not save misconceptions for the end. Address them as soon as the relevant concept is introduced.

  **Misconception 1: "OE is just Genetic Determinism."**
  *   *The Error:* Students think OE means "Your traits are fixed by your origin."
  *   *Where to head it off:* **Immediately after stating the OE principle (Minute 10).**
  *   *The Fix:* Explicitly state: "OE is a claim about *identity* (who you are), not *properties* (what you are like). OE allows that you could have been taller, smarter, or raised by wolves. It only denies you could have come from a different zygote."

  **Misconception 2: "OE is an empirical claim about DNA uniqueness."**
  *   *The Error:* Students think OE is true because "DNA makes us unique."
  *   *Where to head it off:* **During the IVF Example analysis (Minute 5).**
  *   *The Fix:* Point out that monozygotic twins share the exact same DNA and origin zygote but are two people. Conversely, if a different sperm had the *exact same* genetic sequence (theoretically possible), OE says it would still be a *different* person because it is a different physical cell. OE is about the *particular matter*, not the *genetic code*.

  **Misconception 3: "OE implies Cosmic Destiny/Teleology."**
  *   *The Error:* Students think OE means "You were meant to exist."
  *   *Where to head it off:* **In the "What OE is Not" section (Minute 12).**
  *   *The Fix:* Distinguish *metaphysical necessity* from *purpose*. "OE says if *you* exist, you *must* have had this origin. It does not say this origin *had* to produce you. It is a constraint on identity, not a prophecy."

  ---

  ### 4. What to Leave Out
  You have 25 minutes. Cutting the following is necessary for clarity:
  *   **Rigid Designators:** Do not use Kripkean semantic machinery. It adds jargon without adding clarity for this audience.
  *   **Possible Worlds Formalism:** Do not draw Lewisian circles or talk about "accessibility relations." Use phrases like "In a scenario where..." instead.
  *   **Haeccetity:** Do not introduce the notion of "thisness" as a distinct metaphysical property. Stick to "numerical identity."
  *   **The History:** Do not discuss Locke or Leibniz. Stick to the contemporary formulation (Kripke/Williamson).

  ---

  ### 5. Settled vs. Contested (Crucial for PhilBio)
  You must distinguish between metaphysical orthodoxy and biological reality. Do not present OE as scientific fact.

  **Fairly Settled (in Analytic Metaphysics):**
  *   The *formulation* of the principle is standard: "If a person originates from a particular zygote, they could not have originated from a different zygote."
  *   It is widely accepted as a plausible intuition pump for artifacts and standard sexual organisms.

  **Genuinely Contested (Especially in Philosophy of Biology):**
  *   **Monozygotic Twins:** This is the biggest problem. One zygote splits into two people. If origin is essential, which twin has the "essential" link to the zygote? Did the zygote cease to exist? Did two people originate from one origin? (Present this as a major objection).
  *   **The "Vagueness" of Origin:** Biologically, when is the origin? Fertilization? Implantation? Gastrulation? If OE requires a precise moment, but biology is a continuum, OE may be empirically ill-defined.
  *   **Asexual Reproduction/Fission:** In bacteria or starfish, an organism splits. Does the parent cease to exist? Do both offspring have the same essential origin? This challenges the "one origin, one individual" rule.
  *   **The Process View:** Many philosophers of biology (e.g., Oyama, Pradeu) argue organisms are not "substances" with fixed origins but "processes" sustained by ongoing interactions. If an organism is a process, "origin" is less metaphysically weighty than "maintenance."

  ---

  ### 6. The Check-Question
  Do not ask "What is Origin Essentialism?" (Tests memory).
  Do not ask "Is OE true?" (Tests opinion).

  **Ask this (Minute 22):**
  > "Imagine a world where your parents conceive a child at the exact same time, from the **exact same sperm and egg** as in the actual world. However, in this world, due to a metaphysical miracle, that individual is **not you** (it is a numerically different person with your exact history).
  >
  > **According to Origin Essentialism, is this scenario possible? Why or why not?**"

  **Correct Answer:** "No, it is not possible. OE claims that sharing the same specific origin *makes* you that individual. You cannot have the same origin and be a different person."
  **What this proves:** It confirms they understand OE is a claim about the *sufficiency/necessity of origin for identity*, not just a correlation. It tests if they grasp the *modal* bond (identity) rather than the *causal* bond (development).

  ---

  ### 7. Timing Breakdown (25 Minutes)
  *   **00:00 – 05:00:** **The IVF Example.** Present the Sperm #4,502 vs. #4,503 case. Ask for a show of hands: "Is the child from Sperm #4,503 you, or your sibling?" (Get them to commit).
  *   **05:00 – 10:00:** **The Principle.** Formalize their intuition. "If you originate from Zygote Z, you could not have originated from not-Z." Define terms simply.
  *   **10:00 – 15:00:** **Clearing the Deck.** Address Determinism, DNA, and Destiny (see Section 3).
  *   **15:00 – 20:00:** **The PhilBio Pushback.** Discuss Twins and Asexual Reproduction. Emphasize that biology makes the metaphysics messy.
  *   **20:00 – 25:00:** **Check Question & Discussion.** Pose the "Same Zygote, Different Person" question. Wrap up.

  ### Final Note on Delivery
  Since you are a first-year leading peers, acknowledge the tension. You can say: *"Metaphysicians love this principle because it gives us clear identity conditions. Biologists often hate it because reproduction is messier than the metaphysics allows."* This validates their major while teaching your topic.
