      *   *Keep:* The core claim, the biological application, the main objection.

  7.  **Distinguish Settled vs. Contested:**
      *   *Settled (in Metaphysics):* Kripke's formulation is the standard reference point. OE is a dominant view for artifacts and organisms in analytic metaphysics.
      *   *Contested:*
          *   *PhilBio Pushback:* Organisms are processes, not substances (Oyama, Pradeu).
