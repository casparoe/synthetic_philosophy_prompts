          *   Specify properties the example must have/lack.
          *   Identify specific misconceptions (genetic determinism, empirical DNA claim, cosmic destiny) and *where* to head them off in the sequence.
          *   Provide a specific *check-question* for modal grasp.
          *   Specify what to *leave out* (e.g., full Kripkean machinery).
          *   Distinguish *settled* vs. *contested* views (especially PhilBio pushback).
