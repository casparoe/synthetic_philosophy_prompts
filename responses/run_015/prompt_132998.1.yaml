answer: |-
  At the annual review of the "Grammatical Reduction" research programme, the Grant Chair addressed the lead proponent.

  "Your hard core holds that every substantive philosophical disagreement is reducible to a grammatical ambiguity," the Chair began. "Your protective belt claims this applies to historical debates like Kant versus Hume. But your recurring anomaly is Gödel's incompleteness theorems, which appear to be substantive mathematical facts, not linguistic confusions. How are you handling this?"

  "Progressively," the proponent replied. "We have introduced a new auxiliary hypothesis: 'Any proposition that appears undecidable is actually a category error in the meta-language.'"

  "Did this hypothesis predict Gödel's result?" the Chair asked.

  "It accommodated it perfectly," said the proponent.

  "Accommodation is not prediction," the Chair countered. "To show a progressive problemshift, you must yield novel facts. Does your hypothesis predict anything about *future* mathematics?"

  "Yes," the proponent said. "We predict that any future mathematical breakthrough will eventually be shown to be a notational variant of a tautology."

  "And if a new theorem resists that reduction?"

  "Then we will adjust the belt to show it was a notational variant of a tautology."

  "So your prediction is not about the math," the Chair said, "but about your ability to reclassify the math post hoc."

  "No," the proponent insisted. "We predict the math will turn out to be grammar. We're just waiting for the math to catch up to our prediction."

  "But you formulated this prediction after Gödel," the Chair noted. "You are retroactively reclassifying anomalies, not forecasting novel content. By Lakatos's criteria, that is a degenerating problemshift."

  The proponent smiled. "Only if you insist the prediction must come before the event. In our programme, we prefer to let the event confirm the prediction we just wrote."
