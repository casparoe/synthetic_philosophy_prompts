answer: |-
  This is a classic reconstruction of the "framework relativism" objection to Wittgensteinian hinge epistemology (often associated with the debate between *conservative* and *liberal* interpretations of *On Certainty*). Your mate has built a very tight *reductio*.

  If you want to save the anti-relativist intuition in (6), you cannot keep (1), (2), and (4) exactly as stated. The slide happens primarily at **(2)**, facilitated by **(4)**.

  Here is the breakdown of where the argument breaks, why it looks innocent, the cost of fixing it, and how the two major camps handle it.

  ### 1. The Loose Step: Reject (2) (or qualify it heavily)

  **The Step:** *(2) That job is functional, not genealogical — nothing about being a hinge depends on how the proposition got installed.*

  **Why it looks innocent:** It captures a core Wittgensteinian insight: certainty is a matter of *use*, not proof. It feels right to say that a belief functions as a hinge regardless of whether it came from a cult or a childhood. It aligns with the idea that epistemology should describe how we actually operate, not how we *should* have acquired our beliefs.

  **Why it isn't:** It conflates **psychological/anthropological hinges** (what a community *does* treat as certain) with **epistemic/normative hinges** (what *must* be held certain for rational evaluation to occur).
  If you accept (2) unqualified, you grant that "The Leader is never wrong" has the exact same epistemic status as "The earth has existed for many years." This makes the *structure* of rationality content-neutral. If the structure is content-neutral, then a framework built on "The Leader is infallible" is structurally identical to one built on "My senses are generally reliable."

  **The Cost of Rejecting (2):**
  To block (5), you must argue that not everything that *functions* as a hinge *ought* to function as one, or that only *specific kinds* of propositions can legitimately play the hinge role.
  *   **You pay:** You lose the pure descriptivism of Wittgenstein. You have to introduce a normative filter. You have to say, "Sure, the cultist treats this as a hinge, but it's an *illegitimate* hinge."
  *   **The Risk:** Once you start distinguishing legitimate from illegitimate hinges, you look like you're smuggling in the very foundationalism hinge epistemology was supposed to avoid. You need a criterion for "basicness" that isn't just "we treat it as basic."

  ### 2. The Accomplice: Reject (4)

  **The Step:** *(4) Rational criticism of a belief needs a shared practice in which the doubt is intelligible; where the practice differs, all you can do is describe what each side does.*

  **Why it looks innocent:** It follows from the idea that meaning is use. If "doubt" has no use in their language game, how can you doubt?

  **Why it isn't:** It assumes **incommensurability**. It assumes that because we don't share *all* hinges, we share *none*. But hinge epistemology usually posits that hinges are layered. A cult member might have a deviant hinge about the Leader, but they still share basic hinges with you about pain, physical objects, and memory.
  *   **Correction:** Rational criticism doesn't require a *shared framework*; it requires *overlapping hinges*. You can criticize the cult by showing that their specific hinge ("Leader is infallible") conflicts with a more basic, shared hinge ("People sometimes lie" or "Pain is bad").

  **The Cost of Rejecting (4):**
  *   **You pay:** You have to commit to a universal anthropology. You have to claim there are some hinges (biological, primitive certainties) that *all* humans share, regardless of culture. If the cultist truly doubts *everything* except the Leader, you can't reach them. You are betting that no human community actually operates with *only* deviant hinges.

  ---

  ### 3. How the Two Big Readings Block (5)

  You asked what the two main interpretations of hinges have to give up to stop the slide into relativism.

  #### A. The Non-Propositional / "Rule" Reading (e.g., Danièle Moyal-Sharrock)
  On this view, hinges aren't beliefs or knowledge claims; they are **enacted rules** shown in what we do. "I have two hands" is not a proposition I know; it's a rule manifested in my grasping.

  *   **How they block (5):** They argue that "The Leader is never wrong" cannot be a genuine hinge because it is not a condition of *action* in the same way. It is a dogma, not a rule of grammar for navigating the world. Genuine hinges are "animal certainties" (reacting to fire, eating food). Cult dogmas are superstructural. You can criticize the dogma by showing it forces the agent to violate their animal certainties (e.g., ignoring pain because the Leader said it isn't real).
  *   **What they give up:** They sacrifice the idea that hinges are part of the "space of reasons" at all. They are arational.
  *   **The Cost:** It becomes hard to explain how we ever *change* hinges. If they are pre-linguistic enactments, how does argument ever touch them? Also, it risks making hinge epistemology irrelevant to high-level theoretical disputes (like politics or religion), restricting it to basic physical interaction.

  #### B. The Propositional / "Entitlement" Reading (e.g., Duncan Pritchard, Annalisa Coliva)
  On this view, hinges are propositions, but we have a special **warrant (entitlement)** to accept them without evidence because inquiry requires them.

  *   **How they block (5):** They argue that entitlement is not universal to *any* proposition. You are only entitled to accept *basic* hinges (e.g., "there is an external world," "I am not dreaming"). You are *not* entitled to accept "The Leader is infallible" because that proposition is not a necessary condition for inquiry in general; it is specific to a local, optional practice.
  *   **What they give up:** They sacrifice the pure functionalism of (2). They admit that *content matters*. Some propositions are "hinge-eligible" and others are not.
  *   **The Cost:** They face the "Arbitrariness Objection." Who decides which propositions are eligible for entitlement? If you say "The ones that are necessary for inquiry," the cultist replies, "But inquiry into the Leader's will requires believing he is infallible." The entitlement theorist must argue that *rational* inquiry requires basic hinges, which begs the question against the relativist.

  ### Summary Advice

  If you hold onto (1) and (2) strictly, **you must accept (5).** There is no way out. If the definition of a hinge is *purely* functional and *purely* independent of origin/content, then a cult hinge is epistemically identical to a common-sense hinge.

  To save (6), you have to modify (2). You need to say:
  > "While the *role* of a hinge is functional, not every community's certainty qualifies as a legitimate hinge. Legitimate hinges are constrained by **human form of life** (biological/anthropological universals)."

  **The Price:** You pay the price of **naturalism**. You ground epistemology not just in social practice, but in human nature. You claim that the cultist isn't just playing a different game; they are violating the conditions of being a rational agent *simpliciter*. This is a stronger claim than Wittgenstein sometimes makes, but it's the only price that buys you out of relativism.

  **Recommendation:** Tell your mate you reject the strong reading of **(2)**. Concede that while *de facto* hinges can be anything, *de jure* hinges (the ones that justify rationality) are constrained by the universal conditions of human agency. This keeps the spirit of (1) without accepting the relativist conclusion of (5).
