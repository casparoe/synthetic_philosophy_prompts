answer: |-
  The duplex pattern you have identified—neuroscience admitted to mitigate blame, but conscious intention required to establish it—rests on a fragile philosophical equilibrium. The law treats the defendant as a physical organism when it helps them (the brain made me do it) but as a mindful agent when it prosecutes them (you chose to do it). The causal exclusion argument threatens to snap this equilibrium by suggesting that if the physical story is complete, the mental story is either redundant or false.

  To understand whether the current practice is coherent, we must reconstruct the implicit theory of mental causation it relies upon. The law does not explicitly commit to a metaphysics, but its procedures imply one. Below is an analysis of the three options you proposed, evaluating how each handles the tension between mechanistic mitigation and mentalistic conviction.

  ### 1. Non-Reductive Physicalism
  **The Theory:** Mental states are realized by neural states but are not identical to them. A belief or intention is a higher-level property that depends on the physical brain but has its own causal efficacy, often understood through counterfactual dependence (if the intention had been different, the action would have been different) or realization (the mental property causes the effect *in virtue of* realizing the physical property).

  *   **Fit with the Duplex Pattern:** High. This view validates both sides of the court's practice. It allows neuroscience to be relevant for mitigation because the neural substrate realizes the mental state; if the substrate is damaged, the mental capacity is impaired. Simultaneously, it preserves the *mens rea* requirement for conviction because the mental state is not a mere shadow; it is a causally efficacious property in its own right.
  *   **Coherence:** This makes the pattern coherent. It dissolves the exclusion problem by arguing that mental and physical causation do not compete. The neural event is the *mechanism*, but the intention is the *cause* at the level of agency. The law can consistently say the brain caused the movement while the intention caused the crime.
  *   **Required Changes:** If courts adopted this explicitly, they would need to stop treating "mind" and "brain" as competing explanations. Currently, defense attorneys often frame neuroscience as *replacing* intention ("it wasn't him, it was his tumor"). Under non-reductive physicalism, the tumor matters precisely *because* it disrupted the intention. The practice would not need to change radically, but the rhetoric would need to shift from "either/or" to "realization." The law would have to acknowledge that *mens rea* is a biological property, not a metaphysical ghost.

  ### 2. Epiphenomenalism
  **The Theory:** Conscious mental states are causally inert byproducts of neural activity. Only physical events cause behavior. The feeling of intending to act is like the steam whistle on a train: it signals the engine's work but does not drive the wheels.

  *   **Fit with the Duplex Pattern:** Low/Asymmetric. This fits the mitigation side perfectly (the brain did the work, so if the brain is flawed, the output is flawed). However, it renders the conviction side incoherent. If conscious intention has no causal power, requiring proof of "purpose" or "knowledge" for a serious conviction is like requiring proof that the steam whistle was blowing to convict the train of trespassing.
  *   **Coherence:** This makes the pattern incoherent. If epiphenomenalism is true, the legal requirement for *mens rea* is a category error. Punishing someone for a mental state that caused nothing implies punishing them for a hallucination of agency. The duplex pattern relies on the intuition that the mind *guides* the act; epiphenomenalism denies this.
  *   **Required Changes:** To be consistent with this view, the law would have to abandon *mens rea* as a causal requirement for conviction. Liability would shift entirely to physical capacity and dangerousness. Alternatively, the law would have to admit that punishment is not about causal responsibility but about managing dangerous organisms, regardless of their conscious awareness. This would require a radical overhaul of criminal doctrine, effectively merging criminal law with public health quarantine models.

  ### 3. The Answerability-Substitute View
  **The Theory:** The *mens rea* requirement does not track causal efficacy at all. Instead, it is a normative procedure. Asking "what were you trying to do?" is not a query into the causal history of the movement, but a stance of holding the defendant answerable. Mental states are the currency of justification, not the engine of motion. We treat agents *as if* they have causal mental states because that is the only way to engage in the practice of blaming.

  *   **Fit with the Duplex Pattern:** High. This view neatly separates the two tracks. Neuroscience addresses the *explanatory* track (what physically happened?), while *mens rea* addresses the *normative* track (how do we address this person?). Mitigation uses science to explain capacity; conviction uses mentalistic vocabulary to establish the terms of answerability.
  *   **Coherence:** This makes the pattern highly coherent by sidestepping the causal exclusion argument entirely. The exclusion argument only matters if *mens rea* is supposed to be a causal link. If *mens rea* is a normative status, the fact that neurons caused the movement is irrelevant to whether the agent is the appropriate target of blame.
  *   **Required Changes:** This requires the most significant shift in judicial philosophy, though perhaps the least in daily procedure. Judges and jurors would have to stop pretending they are discovering metaphysical facts about "will" or "choice." They would need to acknowledge that finding "intent" is a performative act of labeling someone a responsible agent. The rhetoric of "free will" would need to be replaced by the rhetoric of "status" or "standing."

  ### Underdetermination and the Causal Exclusion Argument

  The current legal practice is philosophically underdetermined. It functions successfully because it does not force a choice between these three theories. It operates *as if* Non-Reductive Physicalism is true (to preserve the link between mind and act) while utilizing the Answerability-Substitute logic (to maintain the normative force of blame) and occasionally slipping into Epiphenomenalism during mitigation (when the brain is treated as the sole driver).

  If the causal exclusion argument were taken as settled proof that only neural events are causally efficacious, the fate of the *mens rea* hierarchy (purpose, knowledge, recklessness, negligence) depends on why we have that hierarchy.

  **Would the gradations collapse?**
  If the law insists that *mens rea* grades are strictly markers of causal potency (i.e., "purpose" causes harm more directly than "negligence"), then yes, the hierarchy would collapse. If only neurons cause things, the distinction between a "purposeful" neural firing and a "reckless" one is merely a difference in physical topology, not a difference in agential power. A single "neural capacity" criterion would replace the mentalistic ladder.

  **Could the vocabulary remain?**
  Yes, but only if the law adopts the **Answerability-Substitute View**. Even if neural events are the only causes, neural events occur in patterns that correlate with our mentalistic concepts. A "purposeful" killing involves a different neural architecture than a "negligent" one. The law could retain the mentalistic vocabulary not as a description of causal forces, but as a tool for **fair labeling** and **communicative condemnation**.
  *   **Fair Labeling:** Society condemns the purposeful killer differently than the negligent driver. This distinction remains socially useful even if both are ultimately physical events.
  *   **Communicative Function:** Telling a defendant "you are guilty of murder" communicates a specific moral judgment that "your basal ganglia malfunctioned" does not.

  **Conclusion**
  The law can survive the causal exclusion argument, but it cannot survive it unchanged. It must stop claiming that *mens rea* is the *cause* of the crime in a way that competes with physics. To maintain the duplex pattern without contradiction, the courts must implicitly or explicitly adopt the Answerability-Substitute View: neuroscience explains the *capacity* to act, but mentalistic vocabulary establishes the *terms* on which we hold the actor to account. If they refuse this shift and cling to the idea that conscious intention is a distinct causal force that overrides or sits atop physics, the causal exclusion argument will eventually render the core of criminal liability unintelligible.
