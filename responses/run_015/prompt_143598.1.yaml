  9.  **Final Review against Prompt:**
      *   Reconstruct implicit theory? Yes.
      *   Distinguish three options? Yes.
      *   For each: Fit, Coherence, Changes? Yes.
      *   Final question on collapse vs. retention? Yes.
      *   No citations? Yes.

