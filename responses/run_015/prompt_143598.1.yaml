      *   *Side B (Conviction):* "You intended to kill." Prosecutors must prove a mental state. This implies the mental state is the relevant marker of guilt.
      *   *Tension:* If the brain causes the act (Side A), why do we need the mind for guilt (Side B)? If the mind causes the act (Side B), why does brain damage excuse (Side A)?

  3.  **Analyze Option 1: Non-Reductive Physicalism (NRP):**
      *   *Definition:* Mental states are realized by neural states but distinct. They have causal power (often via realization or counterfactual dependence).
      *   *Fit:* High. It allows neuroscience to matter (it realizes the mind) while keeping the mind causally relevant (it's not just a shadow).
      *   *Coherence:* Resolves the exclusion problem by arguing mental causation doesn't compete with physical causation; it operates at a different level of description or via realization.
      *   *Changes required:* The law would need to acknowledge that *mens rea* is not a ghostly substance but a high-level property of the physical brain. It validates the current practice but requires a philosophical commitment that courts usually avoid making explicit.
      *   *Verdict:* Fits best, makes pattern coherent, requires little practical change but significant theoretical clarification.

  4.  **Analyze Option 2: Epiphenomenalism:**
      *   *Definition:* Physical events cause behavior; conscious experience is a byproduct with no causal power.
      *   *Fit:* Poor/Paradoxical. If consciousness doesn't cause action, why is it required for conviction?
      *   *Coherence:* Makes the pattern incoherent *causally*. If the mind doesn't cause the act, punishing based on the mind seems unjust (punishing a shadow). However, it fits the mitigation side well (brain damage = broken cause).
      *   *Changes required:* To be consistent, the law would have to stop requiring *mens rea* for conviction and focus solely on physical capacity. OR, it must admit punishment is not about causation but something else (retribution against the organism regardless of mental causation).
      *   *Verdict:* Fits mitigation, breaks conviction logic. Requires radical overhaul to be coherent.

  5.  **Analyze Option 3: Answerability-Substitute View:**
      *   *Definition:* *Mens rea* isn't about causal efficacy. It's a normative tool for holding agents answerable. We ask "what were you doing?" to treat them as agents, not objects.
      *   *Fit:* High. It sidesteps the causal exclusion argument entirely. Causation is for mitigation (explanation); Intention is for responsibility (justification/normativity).
      *   *Coherence:* Makes the pattern coherent by separating the *explanatory* domain (neuroscience) from the *normative* domain (law).
      *   *Changes required:* Courts would need to stop pretending *mens rea* is a factual discovery about "what caused the act" and admit it's a procedural stance about "how we address the defendant."
      *   *Verdict:* Fits well, makes pattern coherent, requires a shift in judicial rhetoric (from metaphysical fact to normative stance).

  6.  **Address the Final Question (Causal Exclusion Accepted):**
      *   *Premise:* Only neural events are causally efficacious.
