      *   *Retention of Vocabulary:* The law can keep mentalistic vocabulary if it serves a normative function (fair labeling, communicative function) rather than a strictly causal one.
      *   *Collapse Risk:* If the law insists *mens rea* is purely causal, it collapses. If it sees *mens rea* as a proxy for neural capacity + normative status, it survives.
      *   *Conclusion:* The vocabulary can survive if decoupled from strong causal claims, but the *justification* for punishment shifts from "you caused this via mind" to "your brain operated in a way we deem punishable."

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the "duplex pattern" and the tension. Define the causal exclusion problem briefly in this context.
      *   *Section 1: Non-Reductive Physicalism.* Explain realization. Show how it saves mental causation. Note that law implicitly leans here but fears the metaphysics.
