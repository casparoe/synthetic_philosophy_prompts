      *   **Evaluation Criteria:** For each option, determine if it fits the pattern, makes it coherent, and what would need to change if adopted explicitly.
      *   **Final Question:** If causal exclusion is accepted (only neural events cause behavior), does the *mens rea* hierarchy collapse, or can the vocabulary remain for other reasons?
      *   **Constraints:** No case citations, no bibliography. Focus on philosophical reconstruction and underdetermination.

  2.  **Deconstruct the "Duplex Pattern":**
