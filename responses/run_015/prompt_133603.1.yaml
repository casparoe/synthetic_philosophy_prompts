  ok so me and my friend got in a huge arguement last night about whether "better than" holds up once you leave numbers behind. I sketched my view and now I'm paranoid it's incoherent. Here it is:

  (1) "Better than" is transitive for cardinal stuff (wealth, lifespan) but fails for qualitative spectra because of "dimension drift" - the axis that makes A > B isn't the axis that makes B > C, so comparing A to C is comparing apples to oranges.

  (2) I still buy spectrum arguments for consciousness and moral status: there's no non-arbitrary cutoff between human and animal minds, so status should be continuous, not binary.

  (3) That means in triage or resource allocation, saving Alice > saving Bob > saving Carol should still work, because continuous scales let you rank.

  (4) But wait - if dimension drift is real, then moral status comparisons across distant points on the spectrum suffer the same incommensurability. So Alice vs Carol might be unrankable even if each adjacent pair is ordered.

  (5) I think dimension drift is only epistemic, not ontological. There's a hidden correct ranking, we just can't access it with our coarse comparative tools.

  So am I just contradicting myself? Which of these five has to go? I especially want to know if (3) and (4) can coexist, and whether (5) saves (1) or kills it. Rank the tensions by severity and tell me the cheapest single revision that cleans up the mess. Don't just list them - I need to know what actually breaks and what I can keep.
