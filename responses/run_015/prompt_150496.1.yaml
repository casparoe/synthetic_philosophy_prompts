answer: |-
  The water was up to Mara's shins, cold enough to numb the bone, but she didn't move. The archive basement was a cathedral of drowned paper, smelling of wet glue and forgotten names. She was just a librarian, not a keeper of secrets, but the flood had stripped the building down to its ribs, and she was the only one left to sweep the water.

  She found the ledger wedged between a rotting map of the city and a concrete pillar. It wasn't wet. That was the first wrong thing. The cover was black leather, dry as a cured hide, bound in a metal that didn't rust.

  She opened it.

  The pages were filled with handwriting that looked like it was still drying. Simple sentences. Mundane truths.

  *The sparrow on the windowsill has a broken claw.*
  *The baker burned the second batch of bread.*
  *The key to the back door is under the mat.*

  Mara read the first line. As the meaning settled in her mind, the ink shifted. It went from a dull charcoal to a bright, burning gold. It warmed under her fingertip. She felt a snap in her head, like a circuit closing. She *knew* it now. It wasn't a guess; it was a weight in her chest.

  She looked out the high, barred window. A sparrow huddled there. She couldn't see the claw, but she knew.

  She turned the page.

  *The water in the basement is rising by one inch every hour.*

  The ink turned gold. The cold around her ankles seemed to tighten. She knew it. She could feel the truth of it in her marrow.

  But then she stopped. Her breath hitched, fogging in the freezing air. She wasn't a philosopher. She didn't care about modal logic or distribution principles. She was tired, her clothes were soaked, and she just wanted the shift to stop.

  She understood what the book was. It wasn't a list of facts. It was a list of *shadows*. These were truths that existed only because no one knew them. They were the dark spaces between the stars of human knowledge.

  If she read them, they became light. They became known. And if they became known, they couldn't be on this list.

  The ledger claimed to be complete. It claimed to hold every truth that was currently unknown. But by reading them, she was emptying the book. She was erasing the very condition that made the sentences true.

  The ink on the current page flickered. The gold faded back to charcoal, then brightened again, unstable. The reality of the statement was fighting the reality of her knowledge. The air hummed. A pressure built behind her eyes, the physical weight of the paradox.

  *Epistemic shadows,* she thought, though she didn't know the words for it. She just felt the darkness bruising against her mind.

  She turned the pages faster. Hundreds of entries. Secrets of lovers, locations of lost coins, the exact number of dust motes in the sunbeams above. Gold, gold, gold. Each one a small collapse of possibility into certainty. Each one making the book lighter, the world heavier.

  She reached the final page.

  It was blank except for one sentence centered in the middle. The ink was darker than the rest, swallowing the light around it.

  *No one knows the statement written on this page.*

  Mara stared. The cold had moved up to her waist. She couldn't feel her legs anymore.

  If she read it, she would know it. If she knew it, the statement would be false. If the statement was false, it couldn't be in a ledger of truths. If it couldn't be in the ledger, the ledger was a lie. But if the ledger was a lie, then what was she holding?

  If she didn't read it, the statement remained true. It remained an unknown truth. And according to the logic of the book—the terrible, rigid logic of the shadows—it belonged here. It was the perfect entry. The anchor of the whole collection.

  But she was so cold.

  The water lapped at her hips. The pressure behind her eyes was a migraine blooming into a storm. She realized that the book wasn't just recording reality; it was holding it together. The unknown truths were the mortar. By knowing them, she was dissolving the walls.

  If she read the last line, she would resolve the contradiction. She would force the universe to choose: either the statement is false (and she knows it), or the statement is true (and she can't know it). One of them had to break. The book, or her mind.

  She looked at the ink. It wasn't shifting yet. It was waiting. It was a shadow waiting to be cast.

  She thought about the sparrow. She thought about the baker. She thought about the water rising. She thought about how tired she was of carrying things she wasn't supposed to lift.

  "I don't care," she whispered to the damp dark.

  She wasn't solving a puzzle. She was making a decision. She placed her finger on the page. The leather was warm now, pulsing like a heartbeat.

  If she read it, the shadow would vanish. The darkness she could feel pressing against her skin would either flood in and drown her, or burn away and leave nothing behind.

  Mara leaned down. The water touched her chest. She stopped holding her breath. She let her eyes focus on the black letters.

  She read it.

  The ink didn't turn gold. It turned white, blindingly bright, and the sound of the water stopped. The cold vanished. For a second, there was no library, no flood, no Mara. There was only the knowing.

  Then the page went blank, and the ledger snapped shut with the sound of a bone breaking.
