prompt: |-
  For eight years I taught constitutional theory to law students, and secession was a chapter I could deliver largely from memory. Four months ago it stopped being a chapter. I have been seconded to the joint technical committee that our regional government and the national government established after last spring's consultative vote, and we are drafting the financial and citizenship terms of a possible independence.

  Our side's lead negotiator has a rhetorical habit that has become load-bearing. In nearly every session he frames secession as divorce, and specifically as no-fault divorce of the kind our own family law has permitted for decades. Three conclusions are drawn from that framing each time: that a polity cannot be compelled to remain in a union it no longer wants, so the national parliament's consent is legally unnecessary; that the departing party nevertheless owes an equitable division of jointly acquired assets and jointly incurred debt, which is how he defends the proposed severance schedule; and that the settlement should aim at a clean break ending fiscal dependency in both directions, which he uses to resist any open-ended transfer mechanism.

  I have begun to suspect that the analogy is carrying more weight than it can bear, and that some of what it licenses is being smuggled in rather than argued for. I would like a careful audit of it.

  Please set out the mapping explicitly: what in the divorce case plays the role of the two spouses, the marriage itself, the matrimonial property, the children, the court that holds jurisdiction over both parties, and the clean-break order. Then identify where the mapping fails, separating the failures that genuinely threaten his three conclusions from the ones that are merely inelegant. Two places interest me particularly. First, in a divorce each party leaves as an already competent adult; nothing in the analogy seems able to capture that a new state may or may not acquire the administrative and fiscal capacity to function, and I want to know whether that gap defeats the clean-break premise or only constrains it. Second, in a divorce neither ex-spouse retains membership rights in the other's household, yet our draft protocol contemplates precisely that: a portable status for residents of the region who voted against independence, allowing them to hold the national citizenship and the pension entitlements attached to it while living under the new state's law. Tell me whether the divorce frame has any resources for representing this, or whether it is simply invisible from inside the analogy, and what that implies about using the analogy to structure citizenship questions at all.

  Finally, assess whether the three conclusions survive once the disanalogies are on the table, and if they do not, whether a better source domain exists. I have privately been toying with two: the corporate demerger, in which dissenting shareholders receive an appraisal right and the entity is reorganized rather than dissolved, and the housing cooperative, in which a member may withdraw but does not take the building along. Say which, if either, would carry his conclusions better, and specify what adopting each would force him to surrender.

  Do not trouble yourself with citations or with surveying the literature; I know it and will supply the references. What I need is the conceptual audit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A former constitutional law professor (8 years teaching) now working on a joint technical committee drafting terms for regional independence/secession.
      *   **Context:** 4 months into drafting financial/citizenship terms after a consultative vote.
      *   **Problem:** The lead negotiator relies heavily on a "secession as no-fault divorce" analogy to support three specific conclusions (no consent needed, equitable asset/debt division, clean break/no open-ended transfers). The user suspects the analogy is overextended and smuggling in assumptions.
      *   **Task:** Conduct a "conceptual audit" of the divorce analogy.
      *   **Specific Requirements:**
          1.  Explicitly map the analogy (Spouses, Marriage, Property, Children, Court, Clean-Break Order).
          2.  Identify mapping failures (distinguish between those threatening conclusions vs. merely inelegant).
          3.  Address two specific interest areas:
          *   *State Capacity:* New state competence vs. adult spouses. Does this defeat or constrain the clean-break premise?
          *   *Citizenship/Residency:* Dissenting residents keeping national citizenship/pensions. Can divorce frame this? What does it imply for citizenship structuring?
          4.  Assess if the three conclusions survive the disanalogies.
          5.  Evaluate two alternative analogies (Corporate Demerger, Housing Cooperative). Which carries the conclusions better? What must be surrendered for each?
      *   **Constraint:** No citations or literature survey (user knows it). Focus on conceptual audit.

  2.  **Deconstruct the Divorce Analogy (Mapping):**
      *   *Spouses:* Region/Seceding State vs. Remainder State (National Govt).
      *   *Marriage:* The Constitutional Union/Federation.
      *   *Matrimonial Property:* Shared assets (infrastructure, debt, reserves, natural resources).
      *   *Children:* Citizens (specifically the future generation or vulnerable populations dependent on the union). *Correction:* In the negotiator's frame, "children" might be ignored to fit the "clean break," but conceptually they represent the populace or future obligations.
      *   *Court:* International Law/Constitutional Court/Arbitration Panel (The authority overseeing the split).
      *   *Clean-Break Order:* The Severance Settlement (ending fiscal dependency).

  3.  **Analyze Mapping Failures:**
      *   *Voluntariness:* Marriage is (theoretically) entered voluntarily by individuals. Federal membership is often historical, coerced, or intergenerational. *Threat:* Undermines "no consent needed" if the original contract wasn't voluntary.
      *   *Equality of Parties:* Spouses are legal equals. Region vs. Nation is often asymmetrical (power, economy). *Threat:* Undermines "equitable division" if power dynamics dictate terms rather than equity.
      *   *Capacity:* Spouses are pre-existing legal adults. A new state is a *new* legal entity that might lack capacity. *Threat:* Directly hits the "clean break." If the child can't walk, you can't kick it out of the house.
      *   *Membership:* Divorce ends mutual rights. Secession often leaves intertwined rights (citizenship, pensions). *Threat:* Makes the "clean break" impossible by definition.

  4.  **Address Specific Interest Areas:**
      *   *State Capacity (Adult vs. Infant State):*
          *   Divorce assumes two functioning adults.
          *   Secession creates a new entity that might lack tax collection, defense, or currency capacity.
          *   *Impact:* Defeats the *absolute* clean break. It constrains it. You cannot have a clean break if one party immediately collapses, creating a humanitarian/security crisis that spills back over the border. The "no-fault" aspect implies no alimony, but state failure creates "alimony" by necessity (aid, bailouts).
      *   *Citizenship/Residency (Portable Status):*
          *   Divorce: I don't get to keep living in your house rent-free, nor do I keep your health insurance.
          *   Secession Draft: Dissenters keep national citizenship/pensions while living in the new state.
          *   *Impact:* The divorce analogy is *invisible* to this. It assumes total separation. This implies the divorce frame is structurally incapable of handling *layered* sovereignty or *partial* membership. Using it structures citizenship as binary (in/out), which contradicts the draft protocol.

  5.  **Assess the Three Conclusions:**
      *   *1. No Consent Needed (Unilateral Right):* Divorce supports this (no-fault). *Survival:* Weak. Constitutional law isn't family law. If the "marriage" (Constitution) doesn't allow divorce, the analogy fails legally.
      *   *2. Equitable Division:* Divorce supports this. *Survival:* Strongest point, but "equity" is harder to define with public goods (nukes, debt, rivers) than private property.
      *   *3. Clean Break (No Open-ended transfers):* Divorce supports this (alimony is limited/exceptional). *Survival:* Weak due to State Capacity and Citizenship issues. You can't cleanly break if people retain pension rights or if the new state is fiscally insolvent.

  6.  **Evaluate Alternative Analogies:**
      *   *Corporate Demerger (Spin-off):*
          *   *Fit:* Shareholders (citizens) get stock in new co. Assets/liabilities split. Dissenting shareholders get appraisal rights (cash out).
          *   *Pros:* Handles assets/debt well. Handles "continuity" of obligations (pensions).
          *   *Cons:* Requires a governing charter (Constitution). If the charter forbids demerger, it's illegal.
          *   *Surrender:* Must surrender the "no consent needed" conclusion. Demergers usually require board/shareholder approval (National Parliament).
      *   *Housing Cooperative (Co-op):*
          *   *Fit:* You own a share, not the building. You can leave, but you sell the share back. You don't take a piece of the roof.
          *   *Pros:* Good for territorial integrity (region doesn't take "too much").
          *   *Cons:* Terrible for sovereignty. You leave the co-op, you don't start a rival co-op next door necessarily.
          *   *Surrender:* Surrenders the "sovereignty" aspect. Hard to map "independence."

      *   *Comparison:* Demerger is better for the *financial* conclusions (Equitable Division). Co-op is better for *territorial* constraints but bad for *independence*.
      *   *Wait, re-reading the prompt:* The user asks which carries *his* (the negotiator's) conclusions better.
          *   Negotiator wants: 1. No consent, 2. Equitable split, 3. Clean break.
          *   Demerger: Requires consent (Board vote). Fails #1. Good on #2. Good on #3 (mostly).
          *   Co-op: Requires consent (Board). Fails #1. Good on #2 (share value). Fails #3 (you leave, you don't break the building).
          *   Divorce: Good on #1 (No-fault). Good on #2. Good on #3.
          *   *Verdict:* Divorce is actually the *only* one that supports Conclusion #1 (Unilateralism). The alternatives likely kill the "no consent" argument.
          *   *Refinement:* The prompt asks if a better source domain exists to carry *his* conclusions. If the conclusions are legally unsound, the analogy should reveal that.
          *   *Actually:* The prompt asks "Say which, if either, would carry his conclusions better."
          *   *Analysis:* Neither carries #1 better. Divorce is unique in "no-fault/unilateral." But Demerger carries #2 and #3 *more robustly* regarding the specific technicalities (pensions, assets).
          *   *Decision:* The Demerger is the stronger technical analogy for the *drafting* (assets/citizenship), even if it weakens the political rhetoric of unilateralism. It forces the surrender of "Unilateralism." The Co-op forces the surrender of "Sovereignty."

  7.  **Drafting the Response:**
      *   *Tone:* Professional, analytical, respectful of the user's expertise (no hand-holding).
      *   *Structure:*
          1.  The Mapping.
          2.  The Failures (Threatening vs. Inelegant).
          3.  Specific Interest Areas (Capacity & Citizenship).
          4.  Survival of Conclusions.
          5.  Alternative Analogies (Demerger vs. Co-op).

      *   *Refining the "Capacity" point:* The divorce analogy assumes *post-separation viability*. If a spouse leaves with no income, the court orders support. So, actually, the divorce analogy *does* have a mechanism for lack of capacity (spousal support/alimony). The negotiator is using "no-fault" to argue *against* support, but "capacity" argues *for* it. This is a tension *within* the analogy, not just outside it. I need to highlight this. The "Clean Break" is a *type* of divorce order, not the *only* type. He is selecting a specific subtype of divorce order that ignores the capacity evidence.

      *   *Refining the "Citizenship" point:* Divorce is binary. Citizenship is layered. The analogy makes the draft protocol look incoherent. It implies the protocol is a hybrid that the analogy cannot justify.

      *   *Refining Alternatives:*
          *   *Demerger:* Best for the "Portable Status" (pensions follow the liability). Best for Asset/Debt split. *Cost:* Requires Constitutional authority (Consent).
          *   *Co-op:* Best for "You don't take the building" (Territory). *Cost:* Implies the Region is subordinate, not sovereign.
          *   *Which carries his conclusions better?* Neither carries the "No Consent" better. But Demerger carries the "Equitable/Clean" better *technically*. I should argue that Demerger is the superior *technical* frame, even if it sacrifices the *political* frame of unilateralism.

  8.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Conceptual audit focus? Check.
      *   Address specific interest areas? Check.
      *   Address the three conclusions? Check.
      *   Address the two alternatives? Check.

      *(Self-Correction during drafting)*: Be careful not to give legal advice. Stick to the conceptual mapping. The user is a lawyer; they know the legal stakes. Focus on the logic of the metaphor.

      *Key Insight:* The negotiator is using "Divorce" to get "No Consent" (Unilateralism) + "Clean Break" (No Alimony). But in Family Law, "No Fault" does not automatically mean "No Support." Support is based on *need* and *capacity*. So the negotiator is cherry-picking the "No Fault" aspect while ignoring the "Equitable Support" aspect which the analogy actually *demands* if capacity is low. This is a crucial point for the audit.

      *Citizenship:* The "Portable Status" is essentially a "Partial Membership." Divorce has no partial membership. You are ex-spouses or you aren't. This suggests the citizenship arrangement is actually more like a "Common Travel Area" or "Reciprocal Agreement" than a divorce settlement. The analogy obscures this.

      *Alternatives:*
      *   Demerger: Forces surrender of "No Consent." (Requires shareholder/board approval).
      *   Co-op: Forces surrender of "Sovereignty/Independence." (You leave the co-op, you don't become a competing co-op).
      *   Verdict: Demerger is the only viable alternative for a *state* context, but it kills the unilateral argument.

      *Let's write.*
answer: |-
  ### I. The Mapping

  To audit the analogy, we must first formalize the negotiator's implicit mapping. Based on his rhetorical usage, the correspondence is as follows:

  *   **The Spouses:** The Seceding Region (Party A) and the Remainder State (Party B).
  *   **The Marriage:** The Constitutional Union/Federation (the legal bond of sovereignty).
  *   **Matrimonial Property:** Jointly held public assets (infrastructure, central bank reserves, natural resources) and jointly incurred liabilities (sovereign debt).
  *   **The Children:** The Citizenry (specifically, future generations and vulnerable populations dependent on the union's welfare). *Note: In the negotiator's usage, this category is often suppressed to emphasize the "no-fault" aspect between the adults.*
  *   **The Court:** The Constitutional Order or International Arbitration Panel (the authority validating the split).
  *   **The Clean-Break Order:** The Severance Settlement (a specific legal outcome ending ongoing financial obligations, akin to a order barring spousal maintenance).

  ### II. Mapping Failures

  We must distinguish between failures that are merely poetic (inelegant) and those that undermine the logical validity of the conclusions drawn.

  **1. Inelegant Failures (Rhetorical Friction)**
  *   **Emotional vs. Institutional:** Marriage is affective; the Union is juridical. This makes the "breakdown of trust" argument emotionally resonant but legally imprecise.
  *   **Privacy vs. Publicity:** Divorce is private; secession is public and geopolitical. This makes the "clean break" harder to enforce, as third parties (markets, neighbors) intervene in ways they do not in family court.
  *   **Significance:** These do not threaten the conclusions. They merely require the negotiator to translate emotional concepts into fiscal terms.

  **2. Threatening Failures (Structural Disanalogies)**
  *   **Pre-existing Capacity:** Spouses are presumed legally and economically competent adults *before* the marriage and *after* the divorce. A new state is a *new* legal person with unproven capacity.
      *   *Threat:* Directly undermines the **Clean-Break Conclusion**. In family law, if one spouse lacks the capacity to support themselves due to the structure of the marriage (e.g., sacrificed career), maintenance is mandated. If the Region lacks fiscal capacity *because* of the Union's design (e.g., centralized tax collection), the analogy demands transfer payments, contradicting the negotiator's "clean break."
  *   **Binary vs. Layered Membership:** Divorce terminates mutual rights entirely (with narrow exceptions). Citizenship and sovereignty are often layered (dual citizenship, common travel areas, pension portability).
      *   *Threat:* Undermines the **Citizenship/Status protocols**. The analogy renders the draft protocol's "portable status" incoherent. You cannot be "divorced" yet retain "health insurance" and "visitation rights" (pensions and residency) indefinitely.
  *   **Voluntarism of Entry:** Marriage is (theoretically) consensual entry by individuals. Federal membership is often historical, intergenerational, and non-consensual for current residents.
      *   *Threat:* Undermines the **No-Consent Conclusion**. If the "marriage" was entered under duress or without a prenuptial clause allowing unilateral exit, family law courts often require mediation or proof of breakdown before granting the decree. It does not grant an automatic right to exit without process.

  ### III. Specific Interest Areas

  **1. State Capacity and the Clean-Break Premise**
  In the divorce analogy, the "clean break" is not the default; it is a specific order granted only when both parties are self-sufficient. The court assesses *need* and *ability to pay*.
  *   **The Gap:** The negotiator treats the "no-fault" aspect (right to leave) as entailing the "clean-break" aspect (no ongoing support). In family law, these are distinct. One can have a no-fault divorce with substantial alimony.
  *   **Implication:** This gap **constrains** the clean-break premise rather than defeating it entirely, provided the Region can demonstrate capacity. However, if the Region's fiscal viability depends on transitional subsidies, the analogy *itself* turns against the negotiator. It licenses the National Government to demand a "maintenance period" (transitional fiscal support) exactly as a court would order spousal support for a dependent spouse. Using the analogy forces you to admit that if the new state is an "infant," it is a "dependent spouse," and dependents do not get clean breaks.

  **2. Portable Citizenship and the Divorce Frame**
  The draft protocol allows dissenting residents to retain national citizenship and pensions while residing in the new state.
  *   **The Gap:** In divorce, ex-spouses do not retain membership in each other's households. They do not keep rights to the other's pension (unless divided as property) or the right to live in the other's house.
  *   **Implication:** The divorce frame is **blind** to this arrangement. It treats citizenship as a binary status (in/out) tied to territory, whereas your protocol treats it as a portable right tied to the person.
  *   **Structural Risk:** Using the divorce analogy to structure citizenship questions implies that retaining national citizenship is an anomaly or a concession, rather than a coherent legal category. It suggests the new state is "hosting" foreigners, rather than co-managing a shared citizenship zone. This weakens the legal standing of the dissenters; if they are merely "ex-spouses visiting," their rights are precarious. If they are "members of a shared household" (a different analogy), their rights are entrenched. The divorce frame makes the portable status look like a temporary mercy rather than a structural feature, potentially jeopardizing its long-term enforceability.

  ### IV. Assessment of the Three Conclusions

  Once the disanalogies are acknowledged, the survival of the negotiator's conclusions is mixed:

  1.  **No Consent Necessary (Unilateralism):** **Survives weakly.** The divorce analogy supports this better than any other private law model, as "no-fault" implies one party cannot veto the end of the relationship. However, the *procedural* requirements of divorce (filing, waiting periods, court oversight) contradict the idea of an immediate, unilateral political act. It licenses a right to *seek* exit, not necessarily to *effect* it without process.
  2.  **Equitable Division:** **Survives strongly.** This is the strongest fit. Family law is entirely geared toward the equitable division of matrimonial property and debt. This conclusion is well-supported by the source domain.
  3.  **Clean Break (No Open-Ended Transfers):** **Fails.** As noted in the capacity audit, the divorce analogy links the break to the *viability* of the parties. If the seceding region lacks capacity, the analogy mandates support. To insist on a clean break regardless of capacity is to misuse the analogy, not apply it.

  ### V. Alternative Source Domains

  You proposed two alternatives: the Corporate Demerger and the Housing Cooperative. Here is how they compare regarding the negotiator's conclusions.

  **1. Corporate Demerger (Spin-off)**
  *   **Mapping:** The Union is the Parent Company; the Region is a Division becoming a NewCo. Shareholders (Citizens) receive stock in both. Debt/Assets are split by ledger.
  *   **Carrying the Conclusions:**
      *   *Equitable Division:* **Excellent.** This is the standard mechanism for splitting liabilities and assets based on valuation.
      *   *Clean Break:* **Good.** Once the split is done, the entities are separate. However, indemnities and transitional service agreements are standard, which allows for temporary transfers without implying permanent dependency.
      *   *No Consent:* **Fails.** Demergers require Board and Shareholder approval. You cannot unilaterally spin off a division without authorization from the Parent Company's governance structure.
  *   **What Must Be Surrendered:** The negotiator must surrender the **Unilateralism (No Consent)** conclusion. Adopting this frame admits that the National Parliament (the Board) has a vote. It gains technical precision on assets/pensions (solving your citizenship/portability issue—pensions are just liabilities assigned to the correct ledger) but loses the rhetorical weapon of "we can leave whenever we want."

  **2. Housing Cooperative**
  *   **Mapping:** The Union is the Co-op; the Region is a Member-Unit.
  *   **Carrying the Conclusions:**
      *   *Equitable Division:* **Poor.** When you leave a co-op, you sell your share back. You do not take a piece of the roof or the boiler. This undermines the Region's claim to a share of national infrastructure.
      *   *Clean Break:* **Good.** You leave, you stop paying fees.
      *   *No Consent:* **Fails.** Co-op bylaws govern exit. Usually, you can leave, but the Co-op retains the asset.
  *   **What Must Be Surrendered:** The negotiator must surrender **Sovereignty/Asset Claims.** This frame implies the Region is subordinate to the Union's physical infrastructure. It treats the territory as the Co-op's property, not the Member's. It is useful for arguing against the Region taking *too much* debt or assets, but it undermines the claim to independent statehood.

  **Recommendation:**
  The **Corporate Demerger** is the superior conceptual tool for the *technical committee's* work (drafting financial and citizenship terms). It naturally accommodates the "portable status" (employees/pensioners of the OldCo can have arrangements with NewCo) and the "equitable division" of debt.

  However, adopting it forces the negotiator to surrender the **Unilateralism** conclusion. He cannot have both the technical precision of the Demerger and the political leverage of the No-Fault Divorce.

  If he persists with the **Divorce** analogy, he must be warned that he is selectively citing family law. He is citing the *grounds* for divorce (no-fault) while ignoring the *financial remedies* (maintenance/capacity assessment). A consistent application of the divorce analogy would force him to accept a transitional support mechanism if the new state's capacity is proven insufficient, thereby modifying his "Clean Break" conclusion into a "Phased Break."
