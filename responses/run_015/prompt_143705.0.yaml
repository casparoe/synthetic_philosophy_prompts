answer: |-
  Dear Neighbor and Fellow Mediator,

  Since you are taking over the mediation rotation for the co-op, I am writing down the exact procedure I have developed to keep these sessions under twenty minutes and grounded in a practical reading of Adam Smith's theory of moral sentiments. This is not about academic rigor but about keeping the peace without burning yourself out, and it relies on two specific mental maneuvers we call the spectator shift and the sympathy calibration. The goal is to move from intake to a recommendation of either continued dialogue or escalation to the arbitration board, and you must document that both parties heard you out regardless of the outcome. To begin, you sit with both parties together unless safety is an immediate concern, and you ask each person to state only what happened, stripping away all adjectives about intent or character. You are looking for the bare actions, such as I played drums at midnight or I planted lilies in the shared bed, without the accompanying narrative of I was being expressive or I did not know it was dangerous. You pass this initial fact-gathering stage when both parties agree on the sequence of actions, even if they disagree on the meaning, and you must stop here and declare this a values call not a fact call if one party denies an observable action that can be verified by a third party, like a security camera or a written log, because you are not a judge of truth but a facilitator of propriety.

  Once the actions are established, you perform the spectator shift, which requires you to imagine how this dispute looks to a person who knows the co-op rules and the actions taken but knows nothing about the personalities involved. You ask yourself if this impartial spectator would find the actions proper according to the general standards of the community, not based on who is nice or who is difficult. You pass this step when you can clearly articulate what the spectator would see as the breach of propriety, and you must stop here and call it a values call if the spectator would deem the action a violation of a specific safety or harassment policy regardless of the intent, because no amount of mediation can override a safety violation. If the spectator finds the actions ambiguous or merely annoying rather than violative, you move to the sympathy calibration. This is where you check your own gut reaction against the average emotional intensity reported by the two parties on a scale of one to ten. You ask each party how distressed they feel, average those two numbers, and compare that average to your own internal level of distress about the situation. If your reaction is stronger than that average, you have to treat it as proximity bias and discount it, meaning you must lower your recommendation for escalation because you are too close to the problem. You pass this step when your distress is equal to or lower than the parties' average, indicating you are aligned with their experience, and you must stop here and call it a values call if discounting your reaction would require you to ignore a clear safety risk, as proximity bias cannot override physical safety.

  Finally, you make the recommendation based on the output of the previous steps. If the spectator shift showed a clear rule violation or if the sympathy calibration showed high shared distress, you recommend escalation to the arbitration board. If the spectator shift showed ambiguous propriety and the sympathy calibration showed low distress, you recommend they try to talk it out more with a specific set of questions you provide. You pass this procedure when both parties sign the form acknowledging they heard your recommendation, and you stop here if either party refuses to sign, in which case you automatically escalate because the process itself has broken down. Now I will walk you through how this lands on the three hardest cases we have seen recently so you can see where the gears turn and where they might grind.

  Consider the case of the drummer who plays at midnight claiming cultural practice. When you gather the facts, you establish he plays at midnight and the neighbor sleeps at that time, which both agree on, so you pass the fact stage. In the spectator shift, the impartial spectator knows the co-op quiet hours rule and knows the action is drumming at midnight, and while the spectator might respect the cultural aspect, the spectator sees a violation of the agreed-upon quiet hours which applies to everyone equally, so this leans toward escalation. However, when you do the sympathy calibration, the drummer reports low distress because he feels justified, and the neighbor reports high distress, say an eight, making the average a four. If you feel a six, you must discount your reaction to the four, which suggests mediation might still work if the rule allows for exceptions. Here the procedure tells you to stop and call it a values call regarding the quiet hours policy, because if the rules allow no exceptions, the spectator shift overrides the calibration, and you must escalate to let the board decide on policy exceptions, but if the rules are flexible, you recommend talk to find a compromise time.

  Next is the shared garden case where someone planted something toxic to the other person's cat. The facts are agreed upon that the plant was placed and the cat was exposed, so you pass the fact stage. In the spectator shift, the impartial spectator sees an action that endangers a living creature within a shared space, which is a clear breach of safety propriety regardless of whether the planter knew it was toxic. You must stop here and call this a values call not a fact call because safety violations regarding pets and children are non-negotiable values of the co-op, meaning the sympathy calibration does not even need to be run. Even if the planter says they feel zero distress and the cat owner says they feel zero distress to avoid conflict, the spectator shift reveals a danger that mandates escalation to the arbitration board to enforce safety standards, so you write the recommendation for escalation based solely on the spectator shift finding a safety violation.

  The third case is the one where there is clear bullying but the victim keeps saying they are fine. You gather the facts and hear the aggressive language used by one party toward the other, and while the victim says they are fine, the facts of the言语 are recorded, so you pass the fact stage. In the spectator shift, the impartial spectator who knows only the words spoken and not the relationship would identify the language as harassing and violating the co-op dignity policy, so you must stop here and call this a values call because harassment is a structural issue not solvable by kitchen talk. Even though the victim reports low distress and the bully reports low distress, making the average low, and even though your gut reaction is high outrage which you would normally have to discount under the sympathy calibration rule, the values call at the spectator shift stage overrides the calibration. This is the specific instance where the procedure tells you to escalate to arbitration even though you would rather just keep talking it out in the kitchen, because the spectator shift identifies a violation of community safety values that mediation cannot fix, and ignoring it would be failing your duty to the co-op as a whole rather than just the individuals.

  You need to know where this procedure will misfire or cannot decide, particularly when both parties report totally different emotional intensities. If one party is at a one and the other is at a ten, the average is five point five, which might mask the severity of the distress felt by the one person. The sympathy calibration relies on an average that can dilute acute suffering, so if the spectator shift is ambiguous, you might recommend talking it out when the distressed party actually needs protection. In these cases of skewed intensity, the procedure cannot decide safely, and you should treat it as a values call to escalate simply because the disparity itself indicates a power imbalance that mediation cannot resolve. Also, the procedure misfires if the parties lie about their feelings to game the system, such as a bully pretending to be distressed to lower the average, and since you have no authority to verify emotions, you must rely on the spectator shift alone in those moments. If the spectator shift is also ambiguous because the actions are subtle, like cold shoulders rather than shouted words, the procedure will stall, and you should default to escalation because unresolved ambiguity breeds resentment in a small co-op. Use this letter as your script, follow the steps in order, and remember that your lack of authority is actually what keeps the system honest since you cannot force a solution, only recommend the path that the impartial spectator would deem proper.

  Sincerely,

  Your Predecessor
