prompt: |-
  I'm 72, did my career in developmental biology (Drosophila, mostly), and since retiring I've been sitting in on a philosophy seminar at the local lifelong-learning place. They've somehow talked me into setting the end-of-term take-home. The topic I want is origin essentialism — whether you or I could have come from a different sperm and egg.

  What I need is one question, plus a model answer of about 800 words and a marking scheme out of 20, and it shouldn't be passable by writing "Kripke says origins are essential" and stopping there. The people in the seminar are sharp but have read almost nothing, so the question has to hand them the cases. The ones I keep coming back to:

  - an embryo that splits into identical twins a few days after fertilisation: which of the two is "you", and could there have been just the one?
  - mitochondrial donation, where the nuclear DNA comes from one egg and one sperm but the mitochondria and their DNA come from a second donor egg
  - cloning by nuclear transfer, where no sperm is involved at all
  - the boring-looking one: your parents conceiving a day earlier or later than they actually did

  That last case is where I get stuck. I can follow the argument that the child born of the different conception wouldn't have been me, but I can't tell whether that's a deep result, something obviously true and trivial, or just false — whether it collapses into a point about how we re-identify organisms over time, or into a separate question about whether it's the person or the living body that has an essential origin.

  Can the question push students into exactly that fork? Give me the scheme in terms of the moves an A answer has to make and the ones a B answer can miss, and please skip reading lists and references — I can't get to a library and my internet is hopeless.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **User:** 72-year-old retired developmental biologist (Drosophila background).
      *   **Context:** Teaching a philosophy seminar at a lifelong-learning center (sharp students, little prior reading).
      *   **Task:** Create an end-of-term take-home exam.
      *   **Topic:** Origin Essentialism (Could you have come from a different sperm and egg?).
      *   **Requirements:**
