          *   Specific Cases to include: Identical twins, Mitochondrial donation, Cloning, Conception timing (parents conceiving a day earlier/later).
          *   User's specific sticking point: The "conception timing" case. Is it deep, trivial, or false? Does it distinguish between *person* vs. *living body*? The question needs to force students into this fork.
          *   No reading lists/references (user has limited access).

  2.  **Deconstruct the Philosophy:**
      *   *Origin Essentialism:* The view that an individual's origin (specific gametes, parents) is essential to their identity. If you came from different gametes, you are a different individual.
      *   *Kripke's Argument:* Based on the necessity of identity and the distinctness of material origins.
      *   *The "Conception Timing" Problem:* If parents conceive a day later, is it the same child?
          *   *Biological view:* Different sperm, different egg (usually). So, different genetic makeup. Origin essentialism says "different person."
          *   *Intuition:* It feels like "I" could have been born slightly later. But if the genetic material is different, Kripke says no.
          *   *The Fork:* Is the essential origin the *biological material* (zygote) or the *historical event* (parents' union)? Does "you" refer to the biological organism or the psychological person?
      *   *The Twin/Cloning/Mito Cases:* These challenge the "one sperm + one egg" definition.
          *   Twins: One zygote -> two people. Which one is essential?
          *   Mito: 3 genetic contributors. Which are essential?
          *   Cloning: No sperm. Is the somatic cell the origin?

  3.  **Drafting the Question:**
