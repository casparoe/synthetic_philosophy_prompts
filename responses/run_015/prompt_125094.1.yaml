      *   **Commitment (3) The Switch:** If evidence shows insects *do* have ISP, (1) kicks in immediately and overrides human priorities.
      *   **Commitment (4) Epistemic Humility:** Avoid costless harm to insects. Not based on rights/standing, but on avoiding the risk of being wrong about (2).
      *   **Commitment (5) Restricted Totalism:** Sum well-being of all beings *with moral standing*. Moral standing requires crossing the threshold in (2).
      *   **Organizing Idea:** Threshold-Breadth Split. Threshold (Integration) first, then Breadth (Numbers $\times$ Intensity).

  2.  **Analyze the Core Question:**
