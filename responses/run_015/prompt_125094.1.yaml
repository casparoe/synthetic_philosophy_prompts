  3.  **Evaluate Specific Tensions:**

      *   **Tension A: (1) vs. (2) & (5) [The Probability vs. Threshold Tension]**
          *   (1) says: If *non-negligible probability* of sentience + huge numbers $\rightarrow$ dominate calculus.
          *   (2) says: Insects *lack* the architecture. (Implies probability is negligible or zero).
          *   (5) says: Totalism applies only to those who *have* crossed the threshold.
          *   *Analysis:* (1) is a conditional principle about *uncertainty*. (2) is a factual claim about *certainty* (or high confidence). If the user is *certain* insects lack ISP, (1) doesn't trigger. If the user is *uncertain*, (1) suggests we must weigh the expected value.
          *   *Conflict:* (1) implies that *probability* creates moral weight (expected value). (5) implies only *actual* standing creates moral weight. If there's a 1% chance insects are sentient, (1) says that 1% $\times$ Trillions matters. (5) says 0% matters until proven otherwise.
