      *   *Re-evaluating Severity:* The biggest tension is actually between the *logic of (1)* (which demands action on probability) and the *logic of (5)* (which demands action only on confirmed status). (1) says "Probability $\times$ Scale = Duty." (5) says "Status = Duty." If Probability is non-zero, (1) says we have a duty. (5) says we don't.
      *   *Revision Strategy:* The user wants to keep (2) (Insects likely aren't sentient). The "least costly revision" is to align (1) with Expected Value theory explicitly, acknowledging that (5) is about *actual* totalism, while (1) is about *expected* totalism under uncertainty.

