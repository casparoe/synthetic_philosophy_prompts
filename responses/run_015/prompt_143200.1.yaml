          *   *Refinement for the Prompt's constraint:* "What it must lack... any feature that might encourage students to treat the removal of one cause as automatic proof that another was sufficient."
          *   *Analogy:* **The "Multi-Key Security System."**
          *   *Properties:* To open the vault (Authoritarian Rupture), you need Power Cut (Structure) + Code (Structure) + Key Turn (Agent).
          *   *Problem:* Too deterministic.
          *   *Let's try: **"The Traffic Accident."***
          *   *Properties:* Icy roads (Structure), Blind corner (Institution), Driver speeding (Agent).
          *   *Why:* Accident was *likely* (structural), but *this* accident required *this* driver. If the driver slows down, accident avoided *this time*, even if roads remain icy.
          *   *Decision:* **The "Traffic Accident on Icy Roads."** It captures probability vs. certainty well.

  5.  **Address Misconceptions:**
      *   *Misconception 1:* Structure = Inevitability. (Intercept when defining Structural Preconditions).
      *   *Misconception 2:* Counterfactuals = Fiction. (Intercept when introducing the testing method).

  6.  **Drafting the Sequence (90 Minutes):**
      *   0-15: Intro & The Trap (Why "Great Man" vs. "Forces" is false).
