      *   30-45: Concept 1: Causal Overdetermination (Multiple paths to crash).
      *   45-60: Concept 2: Modal Fragility (How much does the outcome change if we remove the driver?).
      *   60-75: Application to Weimar (Mapping the analogy).
      *   75-90: Diagnostic & Wrap.

      *Wait, I need to check the dependency order again.*
      Prompt: "state whether students must first grasp causal overdetermination before they can understand modal fragility."
      *Logic:* To know if an outcome is "fragile" (sensitive to change), you must know if it is "overdetermined" (supported by multiple causes). If a system is overdetermined, removing one cause leaves the outcome stable (low fragility). If underdetermined, removing one cause collapses the outcome (high fragility). Therefore, **Overdetermination must precede Fragility.**

  7.  **Selecting Omissions:**
      *   *Functionalist vs. Intentionalist:* Too specific to Holocaust mechanics, distracts from the macro "Rise to Power" causality.
      *   *Possible Worlds Semantics (Lewis):* Too philosophical, confuses politics students.
      *   *Chaos Theory:* Too mathematical.

  8.  **Drafting the Diagnostic Question:**
      *   Need a slightly altered scenario. Maybe Stresemann lives longer? Or the Depression hits in 1932 not 1929?
      *   Let's use: "What if the Depression had been mild, but Hitler was still present?" Tests if they see Structure as a prerequisite for Agency to work.

  9.  **Refining the Plan (Self-Correction during drafting):**
      *   *Analogy Check:* The Traffic Accident is good, but does it handle "Authoritarian Rupture" well? A crash is binary. A regime change is processual.
      *   *Alternative:* **The "Bridge Collapse."**
      *   *Structure:* Corroded supports (Weimar Constitution Art. 48, Elite hostility).
      *   *Trigger:* Heavy convoy crossing (Hitler's campaign).
      *   *Why:* A bridge *can* hold despite corrosion (Structure isn't destiny). A perfect bridge can break under extreme weight (Agency can overcome structure). But a corroded bridge + heavy convoy = Collapse.
      *   *Constraint Check:* Does removing the convoy prove the bridge was safe? No, it might collapse later. This fits the "not automatic proof" constraint.
      *   *Decision:* **The "Structurally Compromised Bridge."**

  10. **Final Review against Constraints:**
      *   American English? Yes.
      *   Sequence explicit? Yes.
      *   Dependencies stated? Yes.
      *   One analogy? Yes (Bridge).
      *   Misconceptions intercepted? Yes.
      *   Diagnostic question? Yes.
      *   Omissions justified? Yes.

  11. **Writing the Response:** (Focusing on tone: pedagogical, precise, authoritative).

      *   *Step 1: Conceptual Architecture.* Define the order. Overdetermination -> Fragility.
      *   *Step 2: The Analogy.* The Bridge. Define properties (Corrosion = Structure, Convoy = Agent). Define limits (Don't say bridge *must* fall).
      *   *Step 3: The Seminar Flow.* Minute-by-minute breakdown.
      *   *Step 4: Misconception Interception.* Pinpoint exact moments.
      *   *Step 5: Diagnostic.*
      *   *Step 6: Omissions.*

      *(Self-Correction on Analogy)*: The prompt warns against features that encourage students to treat removal of one cause as automatic proof another was sufficient. In the Bridge analogy, if I say "The bridge was corroded," students might think "It would have fallen anyway." I must emphasize that corrosion creates *risk*, not *certainty*. The convoy creates the *realization*.
      Actually, the **"Forest Fire"** is often safer for "Overdetermination" (Lightning vs. Arson). But the **"Bridge"** is better for "Structural Integrity." Let's stick with the Bridge but be very precise about the "Latent Defect" vs. "Trigger Load."
      *Wait, let's look for something more political.* **The "Coalition Government Collapse."**
      *   Structure: Polarized parties, weak constitution.
      *   Agent: One leader refusing compromise.
      *   *Verdict:* Too close to the actual history, might confuse the analogy with the subject.
      *   *Verdict:* Stick with the **Bridge**. It's distinct enough to be an analogy but maps well to "Structural Integrity."

      *(Refining the Dependency)*: Why Overdetermination before Fragility? Because Fragility is a measure of *dependence*. You can't measure dependence without knowing the *independence* of other causes (Overdetermination). If causes are independent and sufficient (Overdetermination), Fragility is low. If causes are necessary and joint (Underdetermination), Fragility is high. Students must grasp the *system of causes* (Overdetermination) before measuring the *sensitivity of the outcome* (Fragility).

