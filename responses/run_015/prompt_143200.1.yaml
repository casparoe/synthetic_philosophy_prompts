      *   **Goal:** Teach the distinction between structural preconditions and agent-dependent triggers, avoiding the reduction to "Was Hitler important?"
      *   **Constraints:**
          *   Do *not* explain the historical narrative (assume they know it).
          *   Design a pedagogical plan (sequence of concepts).
          *   Specify dependency relations between concepts (e.g., A before B).
          *   Choose *one* analogy/case to carry the explanation (define its properties).
          *   Identify specific misconceptions (Structure = Inevitability; Counterfactuals = Fiction) and when to intercept them.
          *   Include one diagnostic question (application to altered scenario).
          *   State what to omit (historiographical/philosophical refinements) and why.
          *   Language: American English.
      *   **Time Limit:** 90 minutes.

  2.  **Deconstruct the Core Concepts:**
      *   *Structural Preconditions:* Institutional, economic, diplomatic factors (Weimar fragility, Versailles, Great Depression).
      *   *Agent-Dependent Triggers:* Specific decisions, charisma, tactics (Hitler's role).
      *   *Causal Overdetermination:* Multiple causes sufficient to produce an outcome.
      *   *Modal Fragility:* How easily the outcome changes if one variable changes.
      *   *Counterfactual Reasoning:* Disciplined "what if" testing, not speculation.

  3.  **Determine Conceptual Sequence & Dependencies:**
      *   *Problem:* If I start with "Counterfactuals," students think "Fantasy." If I start with "Structure," students think "Determinism."
      *   *Solution:* Start with the *logic of causation* using an analogy, then map it to history.
      *   *Order:*
          1.  Causal Overdetermination (The baseline logic).
          2.  Necessary vs. Sufficient Conditions (The tools).
          3.  Modal Fragility (The test of necessity).
          4.  Application to Weimar/Hitler.
      *   *Dependency:* Students need to understand *Overdetermination* before *Modal Fragility*. If they don't grasp that multiple paths can lead to the same end, they can't understand why removing Hitler might not change the outcome (fragility). Conversely, if they grasp Fragility first, they might think "It was fragile, so Hitler mattered most," missing the structural weight. Actually, the prompt asks to choose the order carefully.
      *   *Refined Order:*
          1.  **Necessary vs. Sufficient Conditions:** Basic building blocks.
          2.  **Causal Overdetermination:** Explains why "Structure" doesn't mean "One Path."
          3.  **Modal Fragility:** The specific test for the "Hitler" variable.
          4.  **Counterfactual Discipline:** How to run the test without fiction.
      *   *Correction:* The prompt asks about "Causal Overdetermination" vs. "Modal Fragility." To understand fragility (how easily the outcome breaks), you must first understand the load-bearing structure (overdetermination vs. singular causation). So, Overdetermination -> Fragility.

  4.  **Select the Analogy:**
      *   *Requirement:* Must show multiple interacting sufficient conditions. Must *not* suggest that removing one cause automatically proves another was sufficient (the "backup cause" fallacy).
      *   *Idea 1:* A building collapsing. (Good for structure, bad for agency).
      *   *Idea 2:* A forest fire. (Good for conditions: dry wood, heat, wind. If you remove the spark, does it still burn? Maybe lightning strikes. But might imply nature is inevitable).
      *   *Idea 3:* A complex lock with multiple keys. (Too mechanical).
      *   *Idea 4:* **The "Arson Investigation" (Fire in a Warehouse).**
          *   *Properties:* Dry timber (Structure), Faulty Wiring (Structure), Arsonist (Agent).
          *   *Why:* It allows for "The building was ready to burn" (Structure) without guaranteeing "It *would* burn right then" (Agency).
          *   *Constraint Check:* Must avoid the idea that if the Arsonist doesn't light it, the Wiring *definitely* will. We need to show that without the Arsonist, the *timing* or *form* might change, even if the risk remained.
          *   *Better Analogy:* **The "Grid Failure" (Blackout).**
          *   *Properties:* Aging infrastructure (Structure), High Demand/Heatwave (Context), Specific Switch Flip by Operator (Agent).
          *   *Why:* A blackout is a systemic risk (Structure). But a specific cascade often starts with a specific decision/error (Agent). If the operator doesn't flip the switch, does the grid fail? Maybe later, maybe differently.
          *   *Decision:* **The "Forest Fire" is the classic for a reason, but let's refine it to avoid inevitability.** Let's use a **"Chemical Reaction"**.
          *   *Re-evaluation:* The prompt asks for *one* analogy to carry the *entire* explanation. It needs to handle political nuance.
          *   *Selection:* **The "Dam Break" Scenario.**
          *   *Properties:* Structural cracks in the dam (Weimar institutions), Heavy rainfall (Economic crisis), One person opening the spillway gate (Hitler).
          *   *Why:* The water pressure (structural forces) makes a break *plausible*. The gate opening (agency) determines *when* and *how* it breaks.
          *   *Constraint:* Must not imply that if the gate isn't opened, the dam *never* breaks. It might burst later. But the specific flood (Nazism) might require the gate.
          *   *Wait, a better fit for Politics:* **The "Legislative Vote."**
          *   *Properties:* Polarized parliament (Structure), Party discipline rules (Institutions), The Speaker's ruling (Agent).
          *   *Critique:* Too dry.
          *   *Let's go with the **"Arson in a Dry Forest"** but strictly defined.*
          *   *Properties:* Dry underbrush (Structural preconditions), High winds (Economic/Diplomatic pressure), Match striker (Hitler).
