  ok so me and jake were arguing til like 2am about the frame problem — you know, that philosophy/AI thing where changing one fact means you gotta figure out whats still true and what isnt, and systems either miss the background stuff or over-list every unchanged detail. he thinks its just sloppy database design, i think its deeper about what we take for granted. anyway, i review automated decision tools for our county — zoning bots, welfare eligibility updaters, stuff like that — about three pitches a week, my boss signs off, and i got 20 minutes max with no phd in sight. i need a real reusable procedure: the questions in order, what counts as a good enough answer, where i reject on tech grounds vs pass it up as a values call, and where the checklist just breaks and needs my gut. apply it to two vendor pitches: (1) a welfare updater that raises income thresholds but stays silent on whether existing medical exemptions still apply, and (2) a zoning bot that updates one parking rule but also spits out 300 unchanged ordinances to "be safe." include one case where the procedure clears the system but the result still bugs me. tell me exactly where judgment cant be eliminated. end with Verdict: [the procedures bottom-line rule].
