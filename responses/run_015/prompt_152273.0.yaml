answer: |-
  Here is the 20-Minute Frame Check. It's built for your constraints: no code access, no PhDs, high volume. It treats the Frame Problem not as philosophy, but as **boundary risk**.

  Jake is half-right: it is database design. But you are right: it's also about what the database *ignores*. This procedure tests whether the vendor knows where their system's world ends and the real world begins.

  ### The 20-Minute Frame Check

  **Step 1: The Delta Declaration (5 mins)**
  *   **Question:** "Show me the exact list of variables changing in this update. Now show me the list of variables you *checked* to ensure they didn't change."
  *   **Good Answer:** A specific dependency map. "We changed Income Threshold (Var A). We queried Medical Exemption (Var B) and Household Size (Var C) to confirm no trigger was hit."
  *   **Bad Answer:** "The system only touches Var A." (Impossible in relational logic).
  *   **Decision:** If they can't name the "unchanged" variables they monitored, **Tech Reject**.

  **Step 2: The Silence Test (5 mins)**
  *   **Question:** "What relevant rules are you *not* mentioning in this output?"
  *   **Good Answer:** "We aren't mentioning Zoning Code 4B because it's unrelated to parking." (With proof of unrelatedness).
  *   **Bad Answer:** Silence on high-risk correlations (e.g., income changes affecting medical status).
  *   **Decision:** If high-risk context is silent, **Tech Reject**. If the silence is low-risk but politically sensitive, **Pass Up (Values Call)**.

  **Step 3: The Noise Test (5 mins)**
  *   **Question:** "Why is this unchanged data included in the report?"
  *   **Good Answer:** "It's a sample for audit verification."
  *   **Bad Answer:** "To be safe, we list every ordinance so no one claims we missed one." (This is brute-forcing the Frame Problem).
  *   **Decision:** If the output drowns the user in unchanged facts to prove stability, **Tech Reject** (Usability Hazard).

  **Step 4: The Break-Glass (5 mins)**
  *   **Question:** "If the frame breaks (an unlisted variable matters), how does a human stop it?"
  *   **Good Answer:** "Manual override flag on the dashboard."
  *   **Bad Answer:** "The system is deterministic; it doesn't break."
  *   **Decision:** If no override exists, **Tech Reject**.

  ***

  ### Application to Vendor Pitches

  #### Pitch 1: Welfare Updater (Income Thresholds)
  *   **The Pitch:** System raises income limits. Output is silent on whether existing medical exemptions still apply.
  *   **Step 1 (Delta):** Vendor says only "Income Threshold" changed. They did not list "Medical Exemption" as a monitored variable.
  *   **Step 2 (Silence):** **FAIL.** Medical status is a high-risk correlation. Silence here implies the system assumes income and medical status are independent. They aren't.
  *   **Step 3 (Noise):** N/A.
  *   **Step 4 (Break-Glass):** Vendor claims the logic is "legally verified." No manual override for individual cases.
  *   **Review Decision:** **Tech Reject.**
  *   **Reasoning:** This is a "Negative Frame Failure." The system assumes the world is smaller than it is. It isn't a values call; the database schema fails to link dependent variables. Jake would call this a foreign key error; you call it a rights violation. Same result.

  #### Pitch 2: Zoning Bot (Parking Rule)
  *   **The Pitch:** Updates one parking rule. Output includes 300 unchanged ordinances to "be safe."
  *   **Step 1 (Delta):** Vendor lists the one change.
  *   **Step 2 (Silence):** Pass. Nothing relevant is hidden.
  *   **Step 3 (Noise):** **FAIL.** Listing 300 unchanged ordinances is a brute-force solution to the Frame Problem. It shifts the cognitive load from the machine to the human reviewer. If everything is highlighted, nothing is.
  *   **Step 4 (Break-Glass):** Human can reject the permit.
  *   **Review Decision:** **Tech Reject (Usability).**
  *   **Reasoning:** This is "Frame Bloat." It technically solves the philosophical problem (everything is accounted for) but fails the bureaucratic one (no one can read it). It creates alert fatigue.

  ***

  ### The "Bugs Me" Case (Procedure Pass, Gut Reject)

  **Case 3: The Housing Eligibility Bot**
  *   **The Pitch:** A system that updates "Occupancy Limits" based on square footage.
  *   **Procedure Run:**
      *   **Delta:** Clearly defined (Sq Ft vs. Persons).
      *   **Silence:** No high-risk variables ignored (Health/Safety codes are linked).
      *   **Noise:** Clean output, only shows relevant changes.
      *   **Break-Glass:** Human override available.
  *   **Procedure Verdict:** **Clear.** The logic is sound, the frame is defined, the dependencies are tracked.
  *   **The Gut Check:** It bugs you because the *frame itself* is too rigid. It counts "square footage" but ignores "temporary family hardship" (e.g., a grandmother recovering from surgery staying for 2 weeks). The system correctly preserves all *coded* rules, but the coded rules lack the discretion required for human reality.
  *   **Why the Procedure Missed It:** The checklist checks if the system stays *within* its frame. It does not check if the frame is *wide enough* for the world.

  ***

  ### Where Judgment Can't Be Eliminated

  You cannot checklist your way out of the Frame Problem because **defining the frame is a political act, not a technical one.**

  1.  **Relevance is Subjective:** The procedure can check if the vendor *declared* their dependencies. It cannot check if they declared the *right* ones. (See Case 3). Only a human knows that "grandmother recovering from surgery" matters, even if the database doesn't have a field for it.
  2.  **Asymmetric Risk:** The procedure treats a false positive (flagging a safe case) and false negative (missing a risky case) as equal errors. In welfare, a false negative hurts a citizen. In zoning, a false positive hurts a developer. You have to weigh the cost of the frame breaking, not just the probability.
  3.  **The "Silent" Context:** Some context is cultural, not data. A system might correctly link "Income" and "Medical," but miss "Community Trust." If the system feels cold or arbitrary, it erodes compliance, even if the logic is perfect.

  **The Limit:** The procedure tells you if the machine is consistent. It cannot tell you if the machine is *wise*. When the logic is perfect but the outcome feels cruel, that is where your 20 minutes end and your career begins.

  Verdict: [Reject any system that cannot explicitly list the unchanged variables it monitored; Pass any system that does, unless the human cost of a frame error is irreversible.]
