          *   *Rating:* Theoretically sound, but practically contested.

      *   **Lena (6):** Recursive accountability assumes framework can recognize exclusions as *errors* vs. *necessary boundaries*. Hermeneutic closure: some knowledge doesn't register as legitimate, so can't be corrected.
