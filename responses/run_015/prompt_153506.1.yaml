      *   **Lena (2):** "Reasons anyone can accept" historically excluded women, colonized, oral traditions. Universality was a power move. Can't separate method from hierarchy.
          *   *Assessment:* Strong historical/critical claim (Post-colonial/Feminist critique). Accurately describes the *practice* and *constitutive outside* of the Enlightenment.
