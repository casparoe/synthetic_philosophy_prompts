      *   **Marco (3):** Genetic fallacy. Racist applications don't invalidate the norm. The norm allows us to criticize racism.
          *   *Assessment:* Standard liberal defense. Distinguishes ideal from history.
          *   *Rating:* Plausible, but risks ignoring structural critique.

      *   **Lena (4):** Not genetic fallacy if exclusion is structural. Reason defined against "superstition" (coded non-European). Inclusion = assimilation/erasure. Self-correction is assimilationist.
          *   *Assessment:* Deepens the critique to epistemology (Horkheimer/Adorno, Spivak, Mills). Challenges the *structure* of reason, not just its application.
          *   *Rating:* Strong philosophical point. Hard to dismiss as simple genetic fallacy.

      *   **Marco (5):** Every framework has blind spots. Does Enlightenment reason have internal resources? Yes, "recursive accountability" (applying standards to its own history).
