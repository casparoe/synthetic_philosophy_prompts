answer: |-
  Put down your cup for a moment and listen closely. You're weaving a very clever web, I'll grant you that. It sounds sophisticated, this "distributed institutional" notion. It sounds like something a modern political theorist might concoct to sleep better at night. But it is nonsense. Moral nonsense.

  You say that because the chain of command is long, because Truman didn't drop the bomb himself, because he only signed a paper while someone else flew the plane and someone else built the weapon, that the intention is diluted? That is a confusion of mechanics with morality.

  If I hire a man to poison my husband, and he buys the arsenic, and another man mixes it into the soup, and I sit at home and wait—am I not a murderer because I didn't hold the spoon? Of course I am. The intention resides in the will of the person who sets the action in motion for the sake of the result. Truman chose the bombing of those cities. He chose it *as* a means to force surrender. That is the point you are glossing over with all this talk of bureaucracy.

  You bring up my faith, and you bring up cooperation. Very well. Let's speak plainly about cooperation. In moral theology, formal cooperation means you will the evil act. Material cooperation means you participate in the act but do not will the evil. You are suggesting Truman's cooperation was merely material because he was "remote" from the blast.

  But look at what he did. He didn't merely allow something to happen that he couldn't stop. He ordered it. When you order the destruction of a city containing women and children, and you do so because that destruction will pressure the government to capitulate, you are making those deaths part of your plan. They are not a side-effect you regret; they are the instrument you are using. You cannot use someone as a means to an end and claim you did not intend their destruction. That is a contradiction in terms.

  As for this "distributed" intention—that is simply a way of saying "no one is responsible because everyone is responsible." It is a collective shrug. But intentions aren't gas that dissipates over distance. They are acts of the will. Truman's will was the source. The pilots, perhaps, they might argue they were following orders, though even that is shaky ground when the order is manifestly unjust. But the man who gives the order? He bears the formal guilt. He is the principal agent.

  You say he only "foresaw" the deaths. This is the same utilitarian trickery I saw at Oxford. They want to say, "He foresaw they would die, but he intended victory." But how was victory to be achieved? By the destruction. If the destruction of the city was the method chosen to achieve the victory, then the destruction was intended. You cannot separate the means from the end in that way. If I say, "I intend to get to London, I merely foresee that I will take the train," it makes no sense if taking the train is the only way I know to get there. I intend the train ride. Truman intended the bombing.

  So don't tell me this institutional framework absolves him. It only obscures the blood. A degree from Oxford is an honor given to a man of virtue. To give it to a man who ordered the massacre of innocents as a policy is to say that such massacres are compatible with virtue. And they are not. They are murder. And no amount of bureaucratic diffusion changes the nature of the act.
