answer: |-
  Thinking as a student of Weil, I must first acknowledge the sharpness of your observation. You have identified a mutation in political ontology that Weil herself might not have foreseen, though her diagnosis predicts it with frightening accuracy. She wrote in *The Manifesto for the Abolition of Political Parties* that the party is a machine that generates "collective pressure" to crush the individual faculty of attention. You are describing a machine that has shed its chassis but kept the pressure.

  Here is the brainstorming of nearest concepts, followed by the precise carving you requested.

  ### 1. Survey of Nearest Concepts
  Does this already have a name? There are approximations, but none capture the *ontological* shift you describe.

  *   **Negative Partisanship:** (Political Science) This is the closest empirical term. It describes voting or acting based on hatred of the opposition rather than love of a platform. *Shortcoming:* It is usually tied to electoral behavior and doesn't account for the lack of *any* platform or the decentralized, non-institutional nature of the network.
  *   **Affective Polarization:** (Sociology) This describes division based on emotional dislike rather than policy disagreement. *Shortcoming:* It describes the *climate*, not the *structure* of the group coherence.
  *   **Groupthink:** (Psychology) This implies a desire for internal harmony and consensus on *answers*. *Shortcoming:* Your phenomenon does not seek internal consensus on facts (as you noted, contradictory claims are tolerated). It seeks consensus on *attacks*.
  *   **Rhizomatic Movement:** (Deleuze/Guattari) This describes decentralized, non-hierarchical networks. *Shortcoming:* This is a structural description that is usually optimistic/liberatory. It doesn't capture the *coercive* and *truth-suppressing* nature you observe.
  *   **Mimetic Contagion:** (Girard) This captures the spread of emotion and the scapegoating mechanism. *Shortcoming:* It focuses on the *spread*, not the *coherence of posture* despite factual incoherence.

  **Verdict:** There is no single canonical term that captures "coherence without doctrine, sustained by adversarial posture." The literature treats this as a bug of social media or a feature of polarization, but rarely as a distinct political form.

  ### 2. The Definition: "Unbound Collective Pressure"
  If we are to name this using the vocabulary of political philosophy (and specifically Weil's), we should call it **Unbound Collective Pressure** or **The Party Spirit in Solution**.

  Weil argued that a political party is a structure that generates *collective pressure* (*pression collective*). The goal of the party is its own growth and preservation. To achieve this, it demands that members surrender their attention to truth in favor of the party's narrative.

  Your phenomenon is the **logic of the party detached from the institution of the party.** It is the *esprit de parti* without the *parti*.

  **Precise Definition:**
  > A **Post-Doctrinal Adversarial Network** is a loose aggregation of agents bound not by a shared conception of the Good (teleology) or a shared set of facts (epistemology), but by a shared **Vector of Opposition**.
  >
  > Its coherence is **kinetic, not static**. It does not hold together because it stands *for* something, but because it moves *against* something. Truth claims are treated not as propositions to be verified, but as **ammunition** to be deployed. If a claim advances the vector, it is "true" for the network; if it blunts the vector, it is "toxic," regardless of its factual accuracy.

  ### 3. The Carving: What It Is and What It Isn't

  To separate this from similar concepts, we must look at the *source of cohesion* and the *relationship to truth*.

  **A. Versus Groupthink**
  *   **Groupthink:** Requires internal consensus. Members must agree on *what is happening* to maintain harmony. Contradictory facts cause cognitive dissonance that the group tries to resolve.
  *   **This Phenomenon:** Requires external alignment. Members do not need to agree on *what is happening*, only on *who is to blame*. Contradictory facts (e.g., "The enemy is weak" AND "The enemy is all-powerful") are tolerated because both justify the same emotional posture (vigilance/outrage).
  *   **The Edge:** Groupthink seeks comfort; this seeks **conflict**.

  **B. Versus Plain Tribalism**
  *   **Tribalism:** Based on *identity* and *kinship* ("Who we are"). It is protective. It has boundaries, rituals, and often a positive mythos of origin.
  *   **This Phenomenon:** Based on *orientation* and *antagonism* ("Who we hate"). It is expansive and fluid. One can enter the "tribe" instantly by adopting the posture, and leave instantly by questioning the enemy.
  *   **The Edge:** Tribalism is about **belonging**; this is about **aiming**.

  **C. Versus Weil's "Party Spirit" (*L'esprit de parti*)**
  *   **Weil's Party:** Has a bureaucracy, a treasury, a membership list, and a platform. It suppresses truth to protect the *institution*. It has a brake pedal (the need to govern or maintain reputation).
  *   **This Phenomenon:** Has no headquarters. It suppresses truth to protect the *emotion*. It has no brake pedal because there is no institution to preserve, only the energy of the outrage itself.
  *   **The Edge:** The Party is a **body** that exerts pressure; this is **pressure** without a body.

  ### 4. Situating Relative to Weil's Critique

  This is where the philosophical weight lies. Weil believed that if we abolished parties, we might recover the capacity for "attention" (the ability to see truth and justice clearly). She assumed the *structure* of the party was the primary engine of the distortion.

  Your observation suggests something darker: **The distortion is not in the structure, but in the collective psyche itself.**

  *   **Weil's Hope:** That without the formal party, individuals would think for themselves.
  *   **Your Reality:** The "party spirit" has gone viral. It has become a **software** that runs on any hardware (Twitter, loose networks, coffee shops).
  *   **The Implication:** This form is potentially more dangerous than the traditional party. A traditional party can be negotiated with; it has leaders who can sign treaties. A **Post-Doctrinal Adversarial Network** cannot be negotiated with because it has no demands. Its "demand" is the perpetual sustenance of the adversarial energy.

  **Conclusion:**
  You are describing **The Party Spirit Unbound**. It is the mechanism of collective pressure described by Weil, but liberated from the constraints of institutional self-preservation. It is a political form that consumes truth as fuel for posture. It does not have a name in the canon because it is a mutation of the digital age, but ontologically, it is **pure partisanship without the party.**

  If you need a term to use in writing, I suggest **"Vectorial Cohesion"** (to highlight the direction-over-content nature) or simply **"The Phantom Party."** But conceptually, it is the realization of Weil's worst fear: that the collective passion for enemies is not a side effect of organization, but a fundamental human tendency that organization merely channels. Here, the channel has broken, and the water is flooding everywhere.
