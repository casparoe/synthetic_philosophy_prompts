  ### 1. Diagnosing the Slip

  **The Equivocation:**
  Updatelessness (specifically in the guise of Updateless Decision Theory or Functional Decision Theory) claims that an agent should select the **decision policy** $\pi: \text{Observation} \to \text{Action}$ that maximizes expected utility from the prior perspective.

  *   **In the Mugging:** The relevant policy is $\pi_{\text{mug}} = (\text{If Asked} \to \text{Pay})$.
      *   Prior EV of $\pi_{\text{mug}}$: Positive ($+\$499,500$).
      *   When the agent observes "Asked," it executes $\pi_{\text{mug}}(\text{Asked})$, which is **Pay**.
      *   *Note:* The local EV of Paying *given* "Asked" (and thus "Tails") is negative. The policy EV and the local action EV diverge.

  *   **In the Medical Test:** The relevant policy is $\pi_{\text{med}} = (\text{If Positive} \to \text{Treat}, \text{If Negative} \to \text{Don't})$.
      *   Prior EV of $\pi_{\text{med}}$: Positive (It saves $\$200k$ 10% of the time for a $\$30k$ cost, netting roughly $+\$17k$ compared to doing nothing, or avoiding the $-\$10k$ loss of unconditional treatment).
      *   When the agent observes "Positive," it executes $\pi_{\text{med}}(\text{Positive})$, which is **Treat**.
      *   *Note:* The local EV of Treating *given* "Positive" is *also* positive. The policy EV and the local action EV converge.

  **Where Step (2) Fails:**
  Step (2) states: *"Rational choice at a node follows the assessment available before the observation that told you which node you're at."*

  This is ambiguous.
  *   **Reading A (Correct):** Choice follows the *policy* selected before the observation. (Vindicates Paying in Mugging, Treating in Medical).
  *   **Reading B (D.'s Error):** Choice follows the *expected value of the specific action* calculated before the observation (ignoring the conditional structure of the policy).

  D. relies on Reading B in Step (4). She claims the updateless agent must act on the "pre-test evaluation" of *treating*. But the pre-test evaluation of the *policy* "Treat if Positive" is positive. An updateless agent *does* treat. D. only generates the paralysis by forcing the agent to evaluate the unconditional action "Treat" from the prior, which no updateless agent would commit to.

  **Why it looked fine:**
  It looked fine because in the Counterfactual Mugging, the optimal policy *does* require taking an action that has negative local expected value. This creates the illusion that updatelessness *always* requires ignoring local evidence. In reality, updatelessness requires ignoring local evidence *only when* the local evidence is subjunctively linked to payoffs in other counterfactual branches. In the Medical case, they are not linked, so local and global optimization align.

  ### 2. Addressing D.'s Follow-up: The Principled Boundary

  D. anticipates the "policy" reply. She asks: *Which observations may a policy depend on, and which must it average over?* She challenges you to explain why "I am in the Tails world" (Mugging) is treated differently from "I have the disease" (Medical), especially since both look like evidence about factors the action cannot causally affect.

  Here is the principled boundary. It does not rest on the *content* of the observation, but on the **subjunctive dependence of the payoff structure on the policy.**

  **The Boundary Condition:**
  An agent must optimize its policy globally (potentially violating local dominance) **if and only if** the probability of outcomes in *other* branches of the decision tree depends on the action taken in the *current* branch.

  Formally, let the expected utility of a policy $\pi$ be:
  $$ EU(\pi) = \sum_{w \in \text{Worlds}} P(w) \cdot U(w, \pi(\text{obs}_w)) $$

  *   **Medical Case:** The state of the world (Sick vs. Healthy) is probabilistically independent of the policy $\pi$.
      $$ P(\text{Sick} \mid \pi) = P(\text{Sick}) $$
      Because the worlds are independent of the policy, maximizing the sum is mathematically equivalent to maximizing each term individually.
      $$ \arg\max_\pi \sum P(w) U(w, \pi(\text{obs}_w)) = \sum \arg\max_{a} P(w) U(w, a) $$
      Therefore, the agent *should* condition on the test result. The "pre-test evaluation" of the optimal policy aligns with the "post-test evaluation" of the optimal action.

  *   **Counterfactual Mugging:** The state of the world (Million Deposited vs. Not) is **not** independent of the policy. The Predictor simulates $\pi$.
      $$ P(\text{Million} \mid \pi(\text{Asked})=\text{Pay}) = 1 $$
      $$ P(\text{Million} \mid \pi(\text{Asked})=\text{Refuse}) = 0 $$
      Here, the term for the Heads world depends on the action in the Tails world. You cannot maximize the terms individually. You must sacrifice the local EV in the Tails world (Pay $-\$1,000$) to secure the EV in the Heads world (Get $+\$1,000,000$).

  **Answering D.'s Specific Challenge:**
  D. asks: *"Why 'I am in the tails world' doesn't get to count as ordinary evidence exactly the way a positive test does?"*

  **Answer:** It *does* count as evidence. The agent conditions on it. The policy is "If Asked (which implies Tails), Pay." The agent uses the observation to index into the policy.
  The difference is not in *using* the evidence, but in **whether the payoff in the counterfactual alternative depends on what you do given this evidence.**
  *   In Medicine: What happens in the "Healthy" world does not depend on what you do in the "Sick" world.
  *   In Mugging: What happens in the "Heads" world *does* depend on what you do in the "Tails" world (via the Predictor).

  ### 3. The Stress Test (The Gene)

  D. adds a stress test: A gene predisposes you to an activity (e.g., smoking) and independently causes an illness. The activity does not cause the illness.
  *   **Observation:** "I want to smoke" (caused by gene).
  *   **Factor:** "I have the gene" (causes illness).
  *   **Action:** Smoke or Don't.

  **D.'s Claim:** Updatelessness seems built to tell you not to condition on this, even though it's evidence you can't causally affect.

  **Diagnosis:** This is a classic Smoking Lesion problem.
  *   **If there is no Predictor:** The probability of having the gene is independent of your decision policy. $P(\text{Gene} \mid \pi) = P(\text{Gene})$.
      *   In this case, the boundary condition above dictates that you **maximize locally**.
      *   The policy "If Urge $\to$ Smoke" has higher prior EV than "If Urge $\to$ Don't" (assuming smoking has utility and no causal health cost).
      *   An updateless agent **smokes**. It conditions on the urge. D.'s claim that updatelessness forbids this is false. UDT collapses to CDT in the absence of logical/subjunctive dependence.
  *   **If there is a Predictor (Newcomb variant):** If a Predictor fills the box based on whether you *would* smoke given the urge, then $P(\text{Million} \mid \pi)$ varies.
      *   Now the boundary condition triggers. You must optimize globally.
      *   If the payoff structure rewards "Not Smoking" (e.g., One Box), you don't smoke.

  **Vindication:**
  This boundary vindicates Paying in the Mugging (because $P(\text{Million})$ depends on $\pi$) without vindicating Refusing Treatment in the Medical case (because $P(\text{Disease})$ does not depend on $\pi$). It also correctly handles the Gene case (Smoke if no Predictor, potentially Don't if Predictor).

  ### Summary for Your Group

  1.  **The Slip:** Step (2) conflates "evaluating the policy from the prior" with "evaluating the unconditional action from the prior." Updateless agents select conditional policies from the prior.
  2.  **The Boundary:** Agents condition on all observations when executing their policy. They only ignore *local dominance* (acting against the grain of the observation's immediate implications) when the **payoff in counterfactual branches subjunctively depends on their action in the actual branch.**
  3.  **The Cost:** Giving up D.'s argument costs nothing; it merely requires precision. Giving up Updatelessness (Premise 1) would cost you the ability to win in Newcomb-like problems, which is the primary motivation for the theory.

  You should tell D. that her argument successfully identifies a *confusion* about updatelessness (the "ignore evidence" myth), but fails as a reductio because updateless agents *do* treat patients with positive tests. They just do it because the policy "Treat if Positive" was the winner at the prior, not because they updated their credences to maximize local utility. In the Mugging, those two come apart; in Medicine, they don't.
