answer: |-
  This is a sophisticated dissection of the tension between consequentialist aggregation (the dust specks) and deontological constraints (the torture). Your friend is correct that the law is not a monolith; it is a patchwork of distinct normative regimes that operate on different logics. However, the patchwork is not random. It presupposes a specific, hybrid theory of harm that distinguishes between **regulatory prevention** (forward-looking, aggregate) and **corrective justice** (backward-looking, individual).

  Here is a reconstruction of the theory implicit in the practice you described, followed by an analysis of its requirements, exclusions, and the concrete consequences of abandoning it.

  ### I. The Reconstructed Theory: Segregated Threshold Aggregationism

  The legal and regulatory pattern you describe presupposes a view we might call **Segregated Threshold Aggregationism**. It rests on four pillars:

  **1. The Dual-Track Distinction (Policy vs. Right)**
  The system operates on two distinct tracks that use different arithmetic.
  *   **The Regulatory Track (Ex Ante):** When setting safety standards or environmental rules, the state acts as a utilitarian planner. Here, harms *do* aggregate across persons. A one-in-a-million risk to a million people is treated as one expected death. This track is concerned with *social welfare optimization*.
  *   **The Judicial Track (Ex Post):** When adjudicating liability or punishment between parties, the state acts as a guardian of individual rights. Here, aggregation is restricted. A harm must cross a threshold of significance *to the individual* to be actionable. This track is concerned with *corrective justice and dignity*.

  **2. Thresholds of Actionability (The *De Minimis* Principle)**
  Harm is continuous, but legal recognition is discrete. The theory presupposes that while a dust speck is a *welfare loss*, it is not a *legal injury*.
  *   **Source of Thresholds:** These do not track the metaphysics of pain but the **cost of recognition**. A legal system has transaction costs. If the cost of adjudicating a harm exceeds the harm itself, the system treats it as non-existent (*de minimis non curat lex*).
  *   **Risk:** A risk is not a harm in the judicial track until it manifests (no liability for symptomless exposure). In the regulatory track, risk *is* the harm to be managed (via VSL calculations).

  **3. Intrapersonal vs. Interpersonal Aggregation**
  *   **Within a Life:** The system accepts that small harms can accumulate to become a large harm within a single life (e.g., repeated low-level noise exposure causing illness).
  *   **Across Lives:** The system is reluctant to aggregate across lives for the purpose of *compensation* or *retribution*, but willing to do so for *prevention*. This explains why a regulator stops a factory emitting specks on a million people (aggregate risk), but a court dismisses a suit by one person receiving a speck (individual threshold).

  **4. Lexical Priority for Agency-Destroying Harms**
  The absolute ban on torture indicates a **lexical ordering** at the top end. Certain harms are deemed to destroy the moral status or agency of the victim. Because they destroy the "container" in which utility is held, they cannot be traded off against utility held in other containers. This creates a "cliff edge": below the cliff, cost-benefit analysis (ALARP) applies; above the cliff (torture), it is forbidden regardless of consequence.

  ---

  ### II. Required vs. Compatible Features

  To argue effectively with your friend, you must distinguish what this theory *demands* from what it merely *tolerates*.

  **Strictly Required by the Theory:**
  1.  **The Regulatory/Civil Split:** The theory *requires* that regulators aggregate risks (to prevent social death tolls) while courts demand individual standing (to preserve the link between wrong and remedy). If courts started awarding damages for one-in-a-million risks without manifestation, the "threshold of actionability" pillar collapses.
  2.  **The Absolute Ban:** The theory *requires* that certain rights (torture) be immune to cost-benefit analysis. If torture became subject to ALARP (reduced so far as reasonably practicable), the lexical priority pillar collapses.
  3.  **Deterrence for Mass Trivialities:** The theory *requires* that mass-imposed trivial harms (the postbag case) be handled via fines or regulatory penalties, not individual compensation. Since the individual harm is below the threshold of actionability, individual suits must fail; but since the aggregate social harm is real, the state must punish the conduct.

  **Merely Compatible (Contingent Features):**
  1.  **Sentencing Inconsistency (Fraud vs. Assault):** The fact that fraud aggregates (total sum) while assault sentences run concurrently is not strictly required by the theory. It is a historical artifact. A consistent Segregated Threshold theorist could argue either way: either assault harms are lexical and should stack, or they are welfare losses and should run concurrently. The current practice sits comfortably with the theory but doesn't prove it.
  2.  **The Specific VSL Number:** The specific threshold (one in a million) is pragmatic, not theoretical. It could be one in ten thousand without breaking the theory.
  3.  **The Postbag Remedy:** Your friend is right that the postbag fine looks like a tariff. The theory is compatible with this being a "deterrence tariff" *or* an "aggregate harm fine." The practice doesn't distinguish between the two, which is why your friend finds ambiguity.

  ---

  ### III. Views Ruled Out by the Practice

  The current practice quietly rules out two pure philosophical positions:

  1.  **Strict Act Utilitarianism:** This view holds that all harms aggregate and trade-offs are always permissible. The practice rules this out because of the absolute ban on torture and the *de minimis* rule in civil courts. If pure utilitarianism ruled, torture would be permissible in extreme emergencies (which the law forbids), and trivial claims would be actionable if the litigation costs were low enough (which they generally aren't).
  2.  **Strict Libertarian/Nozickian Individualism:** This view holds that rights are side-constraints and no interpersonal aggregation is ever permissible. The practice rules this out because of safety regulation. If this view ruled, regulators could not ban a factory because it imposes a one-in-a-million risk on a million people; they would have to wait for one person to actually die before acting. The use of "expected deaths" in regulation is a direct rejection of pure individualism.

  ---

  ### IV. Concrete Consequences of Changing the View

  To win your argument, show your friend that adopting either extreme view would break the system in visible, concrete ways.

  #### Scenario A: Going Wholeheartedly to "Specks Aggregate" (Pure Aggregationism)
  If we accepted that any number of small harms sums to a large harm, without thresholds:

  1.  **Regulation:** The "Broadly Acceptable" risk band would vanish. Any non-zero risk would require mitigation. Infrastructure projects (rail, nuclear, roads) would become impossible to approve because the aggregate risk, however tiny per person, would always outweigh the economic benefit when calculated across the whole population.
  2.  **Civil Litigation:** The small claims track would explode. Every trivial overcharge, every minor data touch, every moment of annoyance would be actionable. Courts would be clogged. To manage this, we would likely move to a system of **administrative compensation** where the state pays out standard sums for verified trivial harms, removing the need for individual lawsuits.
  3.  **Sentencing:** Concurrent sentencing for assaults would end. If harm aggregates, hurting three people is three times the harm of hurting one. Sentences would stack consecutively, leading to much longer prison terms for violent offenders.
  4.  **Human Rights:** The absolute ban on torture would become conditional. In a "ticking time bomb" scenario, if the aggregate suffering of the victims of the bomb outweighs the torture of the suspect, torture would become legally permissible.

  #### Scenario B: Going Wholeheartedly to "Lexical Priority" (Strict Rights View)
  If we accepted that severe harms are lexically prior and small harms never aggregate across persons:

  1.  **Regulation:** The ALARP principle (Reasonably Practicable) would die. It would be replaced by **Best Available Technology** regardless of cost. If a safety measure saves even one life, it must be implemented, even if it bankrupts the industry. Cost-benefit analysis using VSL would be abolished as immoral (putting a price on life).
  2.  **Civil Litigation:** The "Postbag Case" would result in **no liability**. If the harm to each individual is trivial and harms don't aggregate across persons, the organisation has wronged no one in a legally cognisable way. Privacy laws would have to be rewritten to focus solely on actual damage (financial or psychological) rather than the violation of the right itself.
  3.  **Sentencing:** Fraud sentencing would change drastically. Currently, stealing £1 from a million people is treated as a £1 million fraud. Under a strict lexical view, this is a million separate £1 wrongs. Since £1 is below the threshold of serious criminality, the fraudster might face no prison time, only a million tiny civil suits (which no one would bring).
  4.  **Risk:** Symptomless exposure would remain non-actionable, but *any* probability of severe harm (even one in a billion) might trigger an injunction. The regulatory focus would shift from "expected deaths" to "potential catastrophes."

  ### V. Summary for Your Friend

  Your friend's "deterrence" argument explains *why* the fines exist, but not *how they are calculated*. The fines are calculated based on turnover or per-person metrics precisely because the system *does* implicitly aggregate the harm to determine the severity of the wrong, even if it denies the individual the right to claim it.

  The "Postbag Case" is not evidence that the law cannot make up its mind; it is evidence that the law distinguishes between **private wrongs** (which require individual damage) and **public wrongs** (which aggregate to threaten social order).

  **The Winning Argument:**
  The law presupposes that **harm aggregates for the purpose of prevention, but not for the purpose of compensation.**
  *   We aggregate to decide whether to *stop* the dust specks (Regulation).
  *   We do not aggregate to decide whether to *pay* for the dust specks (Civil Law).
  *   We forbid aggregation entirely when the harm destroys the person (Torture).

  If you want to argue that specks *really* aggregate, you must argue for the collapse of the distinction between prevention and compensation. If you want to argue they *don't*, you must argue for the abolition of risk-based regulation. The current practice is a stable, if uncomfortable, compromise between the two.
