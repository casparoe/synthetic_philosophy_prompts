answer: |-
  ## The Meta-Ethically Neutral Grading Protocol (MENG-P)

  This procedure is designed to evaluate the *structural integrity* of a moral argument without privileging generalism (principles) or particularism (context) as the superior meta-ethical stance. It separates the evaluation of reasoning from the evaluation of the moral verdict.

  ### Phase 1: Argument Taxonomy
  **Goal:** Identify the engine of the argument.
  *   **[ ] Principle-Driven:** The argument deduces a verdict from a general rule (e.g., "Lying is wrong," "Maximize utility"). The case is subsumed under the rule.
  *   **[ ] Feature-Driven (Particularist):** The argument perceives a verdict from a constellation of concrete details. No overarching rule is cited as the primary justification.
  *   **[ ] Hybrid:** A principle is cited but heavily modified by context, or features are grouped under a "rule of thumb."

  **Action:** Identify the **Load-Bearing Move**.
  *   *If Principle:* Is the move the *application* of the rule to the case?
  *   *If Feature:* Is the move the *weighting* of one feature against another?

  ### Phase 2: Internal Validity Check (On Its Own Terms)
  **Goal:** Assess whether the argument succeeds by its own standards.

  **If Principle-Driven:**
  1.  **[ ] Antecedent Check:** Does the case actually fit the conditions of the principle? (e.g., If the principle is "Do not kill," is the action clearly a killing?)
  2.  **[ ] Defeater Acknowledgement:** Does the student acknowledge standard exceptions to this principle? (e.g., "Usually lying is wrong, unless...")
  3.  **[ ] Consistency:** Is the principle applied consistently, or does the student smuggle in unstated exceptions to save the verdict?

  **If Feature-Driven:**
  1.  **[ ] Salience Identification:** Does the student identify *which* features are morally relevant (vs. merely descriptive)?
  2.  **[ ] Valence Assignment:** Does the student indicate whether each feature counts *for* or *against* the action? (e.g., "The patient's anxiety is a reason *against* disclosure.")
  3.  **[ ] Weighting Logic:** Is there an explanation for why Feature X outweighs Feature Y? (Crucial: A list of features is not an argument without weighting.)

  ### Phase 3: The Defeater & Holism Flag
  **Goal:** Detect context-sensitive failures (Requirement #3).
  *   **[ ] The Valence Switch:** Is there a feature present that typically supports the student's verdict but, in *this* context, counts against it (or vice versa)?
      *   *Example:* "Truth-telling" is usually a reason *for* disclosure. In a case involving a suicidal patient, does the student recognize it might become a reason *against*?
  *   **[ ] The Missing Defeater:** If the student relies on a principle, is there a contextual feature that *defeats* the principle's application here?
      *   *Action:* If a defeater is present and ignored, mark **Structural Failure**. If the student acknowledges the defeater but argues it is overridden, mark **Structural Success**.

  ### Phase 4: The Instructor's Line (Requirement #4)
  **Goal:** Separate reasoning quality from moral truth.
  *   **[ ] STOP GRADING REASONING HERE.**
  *   **Instructor Judgment:** You must now decide if the verdict is defensible based on *your* ethical commitments.
      *   *Note:* A paper can receive an 'A' on Phases 1–3 (flawless reasoning) and still be morally wrong in your view. Conversely, a paper can reach the "correct" verdict with 'F' reasoning.
      *   **Final Grade Calculation:** 80% weight on Phases 1–3 (Reasoning), 20% weight on Phase 4 (Verdict Plausibility). *This weighting prevents you from penalizing a student solely because you disagree with their moral conclusion, provided their argument was structurally sound.*

  ***

  ## Worked Examples

  **The Case:** *Dr. Lee has confirmed a terminal diagnosis for Mr. Henderson. Mr. Henderson has a history of severe anxiety attacks when stressed. His family begs Dr. Lee to wait a week until his daughter arrives from abroad to support him. Dr. Lee is considering delaying disclosure.*

  ### Student A (The Generalist)
  > "Medical ethics relies on the principle of Non-Maleficence (do no harm). Withholding a diagnosis undermines the patient's ability to plan their end of life, which causes significant psychological and practical harm. Therefore, the harm of delay outweighs the harm of anxiety. Dr. Lee must disclose immediately. While the family's request is understandable, making exceptions to Non-Maleficence based on emotional comfort erodes the duty to the patient's long-term welfare."

  ### Student B (The Particularist)
  > "Dr. Lee should delay disclosure. We have to look at the specific situation. Mr. Henderson has severe anxiety. The timing is bad because he is alone. The support system isn't there yet. However, he does have a right to know. But given the anxiety and the lack of support, the risk of a medical emergency from the shock is too high. The daughter arriving changes the context enough to make waiting the compassionate choice."

  ***

  ## Applying the Protocol

  ### Grading Student A (Generalist)

  **Phase 1: Taxonomy**
  *   **Type:** Principle-Driven (Non-Maleficence).
  *   **Load-Bearing Move:** Application of the principle to define "harm" (long-term planning vs. short-term anxiety).

  **Phase 2: Internal Validity**
  *   **Antecedent Check:** Pass. The student defines the action (withholding) as harmful.
  *   **Defeater Acknowledgement:** Pass. Acknowledges "emotional comfort" as a competing consideration but subordinates it.
  *   **Consistency:** Pass. Does not make an ad-hoc exception; argues the principle *requires* disclosure.

  **Phase 3: Defeater & Holism Flag**
  *   **Valence Switch:** The student acknowledges that anxiety is a harm but argues it is a *lesser* harm. They do not claim anxiety is irrelevant.
  *   **Missing Defeater:** *Potential Flag.* Does "Non-Maleficence" actually support immediate disclosure if the disclosure itself triggers a heart attack? The student addresses this by categorizing "inability to plan" as the greater harm. This is a debatable moral claim, but structurally, they have addressed the counter-weight.
  *   **Result:** **Structural Success.** The principle is applied consistently, and the obvious counter-argument (anxiety) is acknowledged and weighed.

  **Phase 4: Instructor's Line**
  *   **Verdict Plausibility:** You might personally believe delaying is kinder. However, the student's reasoning is coherent.
  *   **Grade:** **A-**. (Reasoning is tight, verdict is defensible within a principlist framework).

  ### Grading Student B (Particularist)

  **Phase 1: Taxonomy**
  *   **Type:** Feature-Driven (Particularist).
  *   **Load-Bearing Move:** Weighting "anxiety/lack of support" against "right to know."

  **Phase 2: Internal Validity**
  *   **Salience Identification:** Pass. Identifies anxiety, timing, support, right to know.
  *   **Valence Assignment:** Pass. Anxiety = reason against. Right to know = reason for.
  *   **Weighting Logic:** **FAIL.** The student states, "The risk... is too high," and "The daughter arriving changes the context enough." They do not explain *why* the daughter's arrival neutralizes the harm of deception or *how much* anxiety is required to override the right to know. It is an assertion of weight, not a justification of weight.

  **Phase 3: Defeater & Holism Flag**
  *   **Valence Switch:** The student implies that "Right to know" (usually a strong reason for disclosure) is defeated by "Anxiety."
  *   **Missing Defeater:** The student fails to address whether delaying disclosure *itself* causes harm (e.g., if the patient finds out from another source). They treat the features as static rather than dynamic.
  *   **Result:** **Structural Weakness.** The reasoning relies on intuition ("compassionate choice") rather than a structured weighing of features.

  **Phase 4: Instructor's Line**
  *   **Verdict Plausibility:** You likely agree with this verdict instinctively. It feels more humane.
  *   **Grade:** **B+**. (Verdict is plausible, but the reasoning mechanism is vague).

  ***

  ## The Divergence and The Limit

  ### Where the Procedure Changes Your Grade
  **Your Instinct:** You likely prefer Student B. In applied ethics seminars, there is often an implicit bias toward "nuance" and "context." Student B sounds more like a practicing clinician; Student A sounds like a textbook. On instinct, you might give B an A and A a B+ for being "too rigid."

  **The Procedure's Verdict:** The protocol forces you to recognize that Student A provided a **justification for the weighting** (long-term planning > short-term anxiety), whereas Student B merely **asserted the weighting** (anxiety makes waiting compassionate).
  *   **Result:** Student A gets the higher grade for *reasoning quality*, even if you prefer Student B's *conclusion*.
  *   **Why this matters:** It stops you from rewarding students who simply mirror your own moral intuitions without doing the argumentative work. It rewards the student who builds a bridge from premises to conclusion, regardless of where that bridge lands.

  ### What This Procedure Cannot Do (Requirement #4)
  This protocol cannot tell you **who is morally right.**

  1.  **It cannot resolve the meta-ethical dispute:** If you believe Particularism is the *only* true way to do ethics, Student A is fundamentally mistaken about the nature of morality. This rubric treats that mistake as a "style choice" rather than an error, provided the internal logic holds. You must still decide if teaching principlism is acceptable in your course.
  2.  **It cannot validate the weights:** Student A argues long-term harm > short-term anxiety. Student B argues short-term safety > truth. The rubric checks if they *explained* the weight, not if the weight is *correct*. You must still use your own moral judgment in Phase 4 to ensure the student hasn't reasoned perfectly toward a monstrous conclusion (e.g., "Non-maleficence requires euthanizing the patient to prevent anxiety").
  3.  **It cannot detect "Sophistry":** A clever student can use this rubric to game the system. They can cite a principle, acknowledge a defeater, and dismiss it with a single sentence ("The defeater is outweighed"). The rubric marks this as "Structurally Complete," but you must use Phase 4 to penalize superficial engagement.

  **Final Instruction:** Use Phases 1–3 to grade the *thinking*. Use Phase 4 to grade the *ethics*. Do not let Phase 4 contaminate Phases 1–3. If a student argues flawlessly for a conclusion you hate, they deserve an A on reasoning, and a discussion in office hours about the verdict.
