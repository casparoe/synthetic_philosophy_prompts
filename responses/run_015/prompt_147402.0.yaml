      *   To be falsifiable, there must be a timeframe and a measurable outcome threshold.

  7.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Acknowledge the sophistication of the prompt. Validate the definition provided (Levitsky/Ziblatt style but more mechanistic).
      *   *Section 1: The Normative Defeater (The "Veto Points" Problem).* Address the "Reverse-Poland." If horizontal institutions are anti-majoritarian veto points, weakening them might be democratic. This attacks the *normative core*.
      *   *Section 2: The Empirical Defeater (The "False Positive" Problem).* Address stable democracies. If the UK (parliamentary sovereignty) or US (court packing threats) do this without sliding, the mechanism isn't sufficient.
      *   *Section 3: The Teleological Defeater (The "Stall" Problem).* If the slide stops. If "illiberal democracy" is a stable equilibrium, "backsliding" (implying motion) is the wrong term.
      *   *Section 4: The Operational Defeater (Intent vs. Effect).* If we can't distinguish "capture" from "reform" without knowing the outcome, it's tautological.
      *   *Ranking:* Order them by how much damage they do to the theory.
