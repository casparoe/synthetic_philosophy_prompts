          *   Is there evidence compatible with "formal-shell maintenance" that actually leads to democratic deepening?
          *   Rank defeaters by severity (decisive vs. awkward).
          *   Assess falsifiability (is it insulated to the point of being unfalsifiable?).

  2.  **Deconstruct the User's Definition of Backsliding:**
      *   *Mechanism:* Incremental executive aggrandizement.
      *   *Method:* Strategic weakening/capture of horizontal accountability (courts, electoral mgmt, anti-corruption).
      *   *Condition:* Formal democratic architecture remains intact (elections happen, constitutions exist).
      *   *Claim:* This is directional (towards autocracy) and independent of ideology (left/right).

  3.  **Brainstorming Potential Defeaters (Falsification Conditions):**

      *   *Defeater 1: The "Efficiency" Counterfactual (The "Reverse-Poland").* If weakening courts *increases* responsiveness without leading to authoritarianism, does the definition hold? The framework assumes accountability institutions *are* democratic safeguards. If they are actually veto points blocking popular will, weakening them might be *democratizing*.
      *   *Defeater 2: The "Baseline" Problem (False Positives).* If stable democracies (e.g., UK, Canada, New Zealand) routinely tweak these institutions without sliding, then the mechanism isn't unique to backsliding. It might just be normal politics.
      *   *Defeater 3: The "Outcome" Disconnect.* The user says it tracks mechanism, not outcome. But if the mechanism *never* leads to authoritarianism (i.e., it's a dead end), is it still "backsliding"? Or is it just "executive strengthening"? If the telos is missing, the label "backsliding" implies a direction that doesn't exist.
      *   *Defeater 4: The "Formal Shell" Ambiguity.* If "formal architecture remains intact" is defined so loosely that *any* election counts, the concept becomes too broad. If defined too tightly, it becomes tautological (it's backsliding only when it looks like autocracy).
      *   *Defeater 5: Ideological Asymmetry.* The user claims it's non-partisan. If empirical data shows this mechanism *only* or *predominantly* occurs on one side of the spectrum due to structural reasons (e.g., only right-wing populism targets courts), the "non-partisan" claim fails, even if the mechanism is real.
      *   *Defeater 6: Vertical vs. Horizontal Accountability.* If vertical accountability (elections) remains robust enough to check the executive despite horizontal erosion, is it backsliding? Or just a shift in accountability type?

  4.  **Ranking and Refining the Defeaters:**

      *   *Severity 1 (Fatal):* **The Normative Inversion (Democratic Deepening).** If the specific mechanism (weakening horizontal checks) empirically correlates with *increased* democratic quality (e.g., higher participation, less corruption, better representation) in a sustained way. This attacks the core assumption that horizontal checks = democracy.
      *   *Severity 2 (Fatal):* **The False Positive Rate (Normal Politics).** If the mechanism is indistinguishable from routine constitutional hardball in stable democracies. If the US, UK, or Germany do this regularly without sliding, the concept loses predictive power.
      *   *Severity 3 (Conceptual):* **The Teleological Failure.** If the mechanism stops short of autocracy consistently. If "backsliding" implies a slide *somewhere*, but cases stall at "illiberal democracy" indefinitely without further degradation, the "slide" metaphor breaks.
      *   *Severity 4 (Measurement):* **The Selection Bias.** If the cases chosen (Hungary, Poland) are cherry-picked and ignore cases where similar moves failed or were reversed quickly.

  5.  **Addressing Specific User Scenarios:**
      *   *Reverse-Poland:* This is a strong defeater. If judicial restructuring *fixes* a captured court to restore sovereignty, the framework must distinguish between "capture" and "correction." If it can't distinguish objectively, it's subjective.
      *   *Stable Democracies:* If routine renovation looks like backsliding, the concept needs a "threshold" or "intent" clause. If it relies on "intent," it becomes unfalsifiable (we only know it was bad because it slid).
      *   *Formal Shell + Deepening:* If elections become *more* competitive after weakening a court, the framework's link between horizontal erosion and democratic decline is broken.

  6.  **Assessing Falsifiability:**
