answer: |-
  You are conflating the contingency of the historical event where we fixed a name to a sample with the necessity of the identity between that name and the underlying structure once the reference is successfully fixed.

  ***

  Your skepticism is well-placed. Scientists are trained to treat every identification as fallible and every composition as an empirical finding that could be overturned by better data. When philosophers claim that "Water is H₂O" is necessary, it sounds like you are being told that future chemistry cannot refute current chemistry, which is absurd. But the claim is not about the infallibility of our measurements; it is about what our words are latched onto once the measurement succeeds. To see this, we must separate the act of pointing from the nature of the thing pointed at.

  Let's take your Calliopeite case. You ask whether it is right to say Calliopeite is the magnesium phase and if that identity is necessary. The honest answer is that if the original specimen was a mixture, the baptism failed to pick out a single natural kind. In the Kripkean framework, a name gets its reference through a causal chain starting with a "dubbing" or baptism. If you point to a mixed tray and say "This is Calliopeite," you have ambiguously pointed to two things. Subsequent users who assume it is a single phase are operating under a false presupposition.

  This does not refute the theory of rigid designation; it highlights the conditions required for it to work. If the community eventually discovers the heterogeneity, they must decide whether 'Calliopeite' refers to the mixture, the dominant phase, or neither. If they decide it refers to the magnesium phase (perhaps because that was the intent of the original describer, or by convention of the mineralogical commission), then once that decision is made, the statement "Calliopeite is the magnesium silicate" becomes necessary. Why? Because 'Calliopeite' now rigidly designates that specific structural kind. In any possible world where that magnesium structure does not exist, Calliopeite does not exist. The necessity lies in the fact that we are no longer defining the mineral by its observable powder pattern (which could be mimicked by something else), but by the underlying atomic arrangement that caused the pattern.

  This leads to your second point regarding the counterfactual: if the tray had contained only the iron fragment, wouldn't 'Calliopeite' refer to the iron phase? Yes, absolutely. But you must distinguish between two questions. First: "Could the word 'Calliopeite' have been used to refer to the iron phase?" The answer is yes. That is a contingent fact about linguistic history. Second: "Could Calliopeite (the thing we actually refer to) have been the iron phase?" The answer is no. Once the reference is fixed to the magnesium phase in the actual world, we use that fixing to evaluate counterfactuals. We ask, "In this other possible world, is *that* stuff (the magnesium structure) present?" We do not ask, "In this other world, what would we have called the iron stuff?"

  The Kripkean denies that the *kind* could have been different, not that the *name* could have been attached differently. This is not merely verbal. Consider your own work. When you solve a structure, you are determining what the object *is*, not just what we call it. If you find that a specimen thought to be diamond is actually cubic zirconia, you don't say "Diamond is sometimes cubic zirconia." You say "This was never diamond." The identity of the kind is tied to the structure. The contingency lies in our discovery process; the necessity lies in the fact that once we know what we are talking about, we are talking about that specific arrangement of atoms. If the tray had contained iron, we would be having a different conversation about a different mineral, even if we used the same noise to describe it.

  Your third scenario, where usage splits, further clarifies the social dimension of reference. If half the laboratory uses 'Calliopeite' for the magnesium phase and half for the mixture, the term has become ambiguous. It now functions as two homophonous names. This does not undermine necessity; it simply means there are now two distinct linguistic tools in play. One name rigidly designates the magnesium phase; the other rigidly designates the mixture. Identity statements involving the first are necessary; those involving the second are different. This shows that reference is not magic; it depends on a stable social practice. When the practice fractures, the reference fractures. But within each stable usage, the link between the name and the kind is rigid.

  Now we reach the core of your worry: does the natural-kind case get its necessity from the same mechanism as the proper-name case, or does it rest on something extra? This is where you should be most skeptical, because even among philosophers, this is contested terrain.

  For proper names like 'Hesperus' and 'Phosphorus', the mechanism is pure rigid designation. We point to an object in the sky. It turns out to be the planet Venus. There is no hidden "essence" of Venus other than being that specific physical object. The necessity of "Hesperus is Phosphorus" comes simply from the fact that both names latch onto the same object in all possible worlds where that object exists.

  For natural kinds like 'water' or 'Calliopeite', rigid designation alone is not enough. We need an additional metaphysical assumption: that there is a "sameness relation" grounded in an underlying essence. When we name water, we don't just point to a liquid; we point to a kind of stuff assumed to share a common internal constitution. The claim "Water is H₂O" is necessary only if being H₂O is what *makes* something water. This is an extra step. It assumes that the observable properties (wetness, transparency) are contingent effects of a necessary cause (the molecular structure).

  In your field, this distinction is vital. If you define a mineral solely by its observable X-ray powder pattern, then 'Calliopeite' is a descriptive term, and its composition is contingent. Another substance could theoretically produce the same pattern. But if you define a mineral by its crystal structure and chemical composition—the underlying cause of the pattern—then you are treating it as a natural kind. The necessity comes from the assumption that the structure is the essence.

  So, how do you tell the difference as a scientist? You look at how corrections are handled. If a new specimen is found that looks like Calliopeite but has a different composition, do you say "Calliopeite can have this composition too" (descriptive/contingent) or "This is not Calliopeite" (essentialist/necessary)? Modern mineralogy tends toward the latter: the IMA defines minerals by composition and structure, not just appearance. This suggests your field already operates with essentialist assumptions.

  However, you are right to sense a difference between the proper name case and the natural kind case. The proper name case is logically tighter; it relies only on the identity of objects. The natural kind case relies on a theory of essence that science itself must validate. If future physics shows that "chemical composition" is not a fundamental boundary but a fuzzy cluster of quantum states, the necessity of "Water is H₂O" might dissolve. The necessity is conditional on the world having the kind of structure that supports essences.

  Therefore, it is not a word game, but it is not a discovery independent of our scientific theories either. It is a redescription of how successful scientific terms function when they latch onto underlying realities rather than superficial descriptions. The contingency you cherish belongs to the process of fixing the reference—the baptism, the measurement, the historical accident of the drawer. The necessity belongs to the result, provided the world cooperates by having stable kinds. If the world is messy, as your mixed Calliopeite specimen suggests, the names may fail to rigidly designate anything unitary. In that case, the necessity claim doesn't apply, not because the philosophy is wrong, but because the precondition—a unified natural kind—is absent.
