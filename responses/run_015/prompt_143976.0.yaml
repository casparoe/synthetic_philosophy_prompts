answer: |-
  The passage is a smooth but misleading overview that correctly identifies the three camps while drastically underplaying the technical fractures that make them incompatible in practice.

  On frequentism, the author is right that strict frequentists deny single-case probabilities, but the deeper problem isn't just the lack of a series—it's the reference class problem. Any single event belongs to infinite possible series (this coin toss belongs to "tosses of this coin," "tosses in this room," "tosses by left-handed people," etc.), each with different frequencies. Without a rule for selecting the right series, the frequency is undefined. Regarding your bridge rule: yes, Cournot's Principle is real and not internet nonsense. It states that events with sufficiently small probability are morally certain not to happen in a single trial. It is the pragmatic bridge frequentists use to move from "long-run frequency" to "bet on this specific toss," but it is a philosophical add-on, not a mathematical derivation from the frequency definition itself.

  The Bayesian convergence claim is a fair simplification but technically conditional. This is known as the "washing out of the priors," but it only works if both agents assign non-zero probability to the true hypothesis and agree on what the evidence implies (the likelihoods). If one person starts with a dogmatic prior (probability 0 or 1) or interprets the diagnostic value of evidence differently, Bayes' rule will never force agreement. It guarantees convergence only for idealized agents who share the same model of how the world generates data.

  Your flatmate is hitting on a serious objection known as Humphreys' Paradox. The probability calculus is time-symmetric: if A raises the probability of B, then B raises the probability of A (mathematically). Propensities are causal and time-asymmetric: a setup produces an outcome, but an outcome does not produce the setup. If propensities are supposed to *be* probabilities, they should obey the calculus perfectly, but this asymmetry suggests they might not satisfy the standard axioms for conditional probability. This hurts the propensity theorist because it implies propensities are not actually probabilities in the mathematical sense, but rather causal powers that merely look like probabilities.

  The final paragraph is the most problematic. While all camps generally accept the Kolmogorov axioms for the mathematical machinery, the claim that it "makes no difference to anything anyone actually computes" is demonstrably false. It dictates entirely different statistical methodologies. A frequentist cannot compute the probability that a hypothesis is true, only the probability of the data given the hypothesis (p-values). A Bayesian computes the probability of the hypothesis itself. They produce different numbers, different intervals (confidence vs. credible), and different decisions in medicine, physics, and finance. The metaphysics drives the methodology.
