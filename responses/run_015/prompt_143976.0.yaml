prompt: |-
  Hey — I'm halfway through one of those big-idea pop science books about randomness and risk, and there's a chapter where the author lays out the three big interpretations of probability (frequentist, subjective/Bayesian, propensity). It read fine to me at first but the more I think about it the more a few bits smell off, especially the way he slides between "chance" and "long-run frequency" as if they were obviously the same thing. I've retyped the passage below, its about 300 words:

  ---

  Philosophers basically offer three answers to the question of what a probability is. The first, frequentism, says that a probability just is a frequency: to say the coin is fair is to say that in an infinitely long series of tosses, half of them land heads. A consequence that fans of the theory wear as a badge of honour is that single events have no probabilities at all — it is strictly meaningless to ask for the probability that this toss lands heads, or that it rains tomorrow, because nothing has a frequency until you have a whole series of it.

  The subjectivists go to the opposite extreme. For them a probability is a number measuring how strongly you happen to believe something, and belief is a personal matter: your numbers are as good as mine as long as they hang together — no negative values, everything sums to one, and you are not vulnerable to a Dutch book, that is, a set of bets that loses you money whatever happens. This sounds like a licence to believe anything you like, but it isn't, because as the evidence piles up Bayes' rule forces everyone's numbers to converge, no matter how far apart they started.

  Propensity theory splits the difference by making chance a physical thing. A fair coin has a real disposition, located in the coin and the flipping mechanism, to come up heads half the time: the frequency you would get if you tossed it forever, but a property of this single setup rather than of a series. Chances are then just one more physical quantity, like mass, to be measured by experiment, and the other two interpretations are really just stories about our ignorance of them.

  The good news is that none of this touches the mathematics. All three camps accept the same axioms, and they all agree that your personal probabilities ought to line up with the chances when you know them — the so-called principal principle — so the whole dispute is metaphysical and makes no difference to anything anyone actually computes.

  ---

  Can you audit this for me: what would someone who works on this stuff accept, what's a fair simplification, and what's just wrong? A few things I'm hung up on specifically:

  - The single-case point. Is it really that frequentists think "probability of rain tomorrow" is meaningless, or is the actual problem something else (something about which series you put the event in)? Relatedly, how is a frequentist ever allowed to connect an infinite-run frequency to a one-off prediction? Someone in a comment thread said there's a bridge rule: you're entitled to act as if the very improbable event won't happen on the one occasion you actually care about. Is that a real part of the package or internet nonsense? I half-remember a name for it, "Cournot's something" maybe.
  - The convergence claim. Does Bayes' rule really force two people into agreement eventually no matter where they started? That seems too good to be true, but I can't say why.
  - My flatmate's take on propensities, which I can't evaluate at all: he says propensities are definately time-directed — a setup at a time has propensities to produce later outcomes, but no propensities to have come from earlier ones — and that this is exactly what makes them sit badly with the ordinary probability calculus, rather than being a rebranding of frequency. Is that a distinction people actually draw, and does it help the propensity theorist or hurt them?
  - The last paragraph. "All three accept the same axioms" and "makes no difference to anything anyone computes" both strike me as suspect, but I'd like to know which one is more wrong.

  Please don't give me a reading list or chase down citations — I just want the conceptual picture. Lead with your overall verdict in the first sentence, then work through it; no preamble and don't restate my question back at me.
