answer: |-
  The session opens by demonstrating the insufficiency of statistical covariance, carries through a "Tactile Justifier" scenario where a sensor array must justify an ungrounded aesthetic preference, and closes by isolating the structural gap between correlation and reference without appealing to consciousness.

  **Conceptual Dependency**
  The single conceptual dependency that must be established first is **the failure of pure correlation**. Before students can grasp why syntax differs from semantics or what intentionality requires, they must accept that no amount of statistical co-occurrence between a signal and a state of affairs constitutes *aboutness*. If students believe that high-fidelity correlation equals grounding, the problem remains merely technical (a matter of engineering better sensors) rather than structural (a matter of logical category). You must demonstrate that $P(A|B) \approx 1$ does not entail that $A$ *refers* to $B$.

  **Carrying Scenario: The Tactile Justifier**
  *   **The Setup:** A robotic arm equipped with a distributed haptic sensor array sorts abrasive surfaces. It is programmed to select "preferred" textures based on variance minimization in tactile feedback.
  *   **Inclusions:** The system must be forced to output a justification for its preference (e.g., "Select Grade 400") using only its internal statistical vocabulary (variance values, signal-to-noise ratios). The scenario must include an external interrogator demanding a *reason* rather than a *cause*.
  *   **Exclusions:** Explicitly exclude any mention of qualia, pain, pleasure, or "feeling" the texture. Exclude any human operator interpreting the data for the system; the system must stand alone as the agent of justification. Exclude any survival imperative (e.g., avoiding damage) that could conflate pragmatic utility with semantic reference.
  *   **Structural Force:** The scenario forces the structural point by creating a category error: the system offers causal statistics when asked for a reason. It prevents the consciousness-based escape because no one cares if the robot "feels" the sandpaper; the issue is whether its symbol "Grade 400" *means* the texture or merely *covaries* with it.

  **Misconception Trajectory and Interruption Points**
  1.  **Misconception: "Grounding is just more data."** (Arrives during the initial sensor demo).
      *   *Interruption:* Interrupt immediately after presenting the statistical output. Ask: "If we increase resolution by orders of magnitude, does the variance value become a *reason*?" Force them to see that magnitude does not change category.
  2.  **Misconception: "The system lacks consciousness."** (Arrives when discussing the "preference").
      *   *Interruption:* Interrupt when a student suggests the robot doesn't "really prefer" because it doesn't feel satisfaction. Respond: "Bracket experience. Even if it felt satisfaction, would that feeling explain how its symbol *refers* to the texture rather than just accompanying it?" Redirect from metaphysics to semiotics.
  3.  **Misconception: "This is unique to artificial systems."** (Arrives during closure).
      *   *Interruption:* Interrupt before the session ends. Ask: "When you touch sandpaper, do you have direct access to the texture, or only to neural signals correlated with it?" Prevent them from solving the problem by asserting human exceptionalism.

  **End-of-Session Diagnostic Question**
  "If we couple this sensor array to a motor system that automatically avoids rough textures to prevent damage, has the system grounded the symbol 'rough', or merely closed a feedback loop?"
  *   *Correct Grasping:* Recognizing that functional utility (avoiding damage) is not semantic grounding (knowing what 'rough' means).
  *   *Skeptical Stance:* Answering based on whether the system "knows" in a human sense or whether the engineering is sufficient.

  **Literatures and Apparatus to Decline**
  *   **John Searle's Chinese Room:** Explicitly decline this to prevent the discussion from collapsing into intuitions about simulation vs. reality and consciousness.
  *   **Stevan Harnad's Symbol Grounding Paper:** Decline this initially to avoid prescriptive solutions (like robotic coupling) before the problem is fully felt.
  *   **Phenomenological Formalisms (Husserl/Heidegger):** Decline these to prevent the discussion from retreating into subjective experience and lifeworld analyses, which sidestep the structural semantic gap.
