answer: |-
  You are right to feel that something is off. Your friend's logic sounds pragmatic on the surface—"actions speak louder than words"—but in the context of an intimate relationship, his approach is fundamentally flawed and potentially damaging.

  Here is a breakdown of why his method is problematic, why your intuition is correct, and what is actually happening in that dynamic.

  ### 1. The Observer Effect
  You hit on this in your prompt: **She knows he's watching.**
  In psychology, the "observer effect" dictates that the act of observing a phenomenon changes the phenomenon itself. If she knows he is scrutinizing her browser history, her saved posts, and her micro-expressions to determine her "true" will, she cannot act naturally.
  *   **Performative Compliance:** She might save an apartment link not because she wants to move, but because she thinks *he* wants her to want to move, and she wants to be a supportive partner.
  *   **Defensive Habit:** She might react negatively to the topic not because she hates the city, but because she feels interrogated and unsafe expressing herself.

  By treating her like a subject in an experiment rather than a partner in a conversation, he has contaminated the data he is collecting.

  ### 2. Actions Are Ambiguous; Words Are Direct
  Your friend is treating behavior as objective data, but human behavior is incredibly noisy.
  *   **Saving a link:** Could mean "I want to live here," or it could mean "I am anxious about this possibility and researching the worst-case scenario," or "I saw this and thought of him."
  *   **Changing her story:** This is the one point where your friend has a leg to stand on. If she keeps changing her mind verbally, she is likely genuinely conflicted. However, interpreting her *actions* as the tie-breaker is a mistake. Actions often reflect **anxiety**, not **preference**.

  When someone is conflicted, their actions will often be contradictory too. Relying on them to find "the truth" is like trying to use a broken compass to find North.

  ### 3. The Trust Deficit
  The core issue isn't the move; it's epistemic trust (trust in what the other person knows and says).
  Your friend's rule is: *"I cannot take your word for it."*
  Translated, that means: *"I do not trust your access to your own internal state more than I trust my interpretation of your external behavior."*

  This creates a **double bind** for her:
  *   If she says "I want to move," he doubts her words.
  *   If she looks at apartments, he claims that proves she wants to move (even if she's just researching).
  *   If she does nothing, he claims she's passive-aggressively refusing.

  She cannot win. This dynamic forces her into a position where she has to "prove" her feelings rather than simply share them.

  ### 4. "People Don't Know What They Want"
  Your friend is half-right here. People often *are* confused about what they want. Big life decisions trigger fear, ambivalence, and conflicting desires (e.g., "I want adventure" vs. "I want security").

  However, the solution to "I don't know what I want" is **exploration**, not **detection**.
  *   **Detection (His approach):** "I will figure out what you want so we can proceed." This is paternalistic.
  *   **Exploration (Healthy approach):** "We both know you're conflicted. Let's talk about the fear behind the confusion without making a decision today."

  ### 5. Why Your Intuition Is Correct
  You feel something is off because his approach removes her agency. He is essentially deciding that he is the arbiter of her reality. Even if he turns out to be "right" about what she ultimately prefers, the process of getting there undermines the relationship.

  If they move based on his interpretation of her actions, and it goes wrong, she can rightly say, "I never said that. You decided that for me." If it goes right, she may feel resentful that her autonomy was bypassed.

  ### The Verdict
  Your friend is trying to solve an emotional ambiguity with logical deduction. It won't work.
  *   **He is right** that her inconsistency is a problem.
  *   **He is wrong** that he can solve it by playing detective.

  **What he should do instead:**
  He needs to have a meta-conversation. Instead of analyzing her clicks, he should say:
  *"I notice you say one thing but look at other things, and your story changes. That tells me you're really conflicted. I don't need an answer today. I just want to understand what makes the decision so hard. Are you afraid of leaving? Afraid of staying? Or afraid of making the wrong choice?"*

  You aren't missing anything. Your friend is prioritizing being "correct" about her desires over being connected with her experience. That is a recipe for resentment, not a successful move.
