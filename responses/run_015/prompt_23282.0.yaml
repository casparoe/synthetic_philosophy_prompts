      *   **The Friend's Stance:** "Words are cheap, actions tell the truth." He believes people don't know what they want, so he's ignoring her verbal statements and focusing on her behavior (what she saves, looks at, reactions). He thinks this reveals her *true* preference.
      *   **The User's Stance:** Something feels off. The girlfriend changes her story, *but* she knows he's watching. Her behavior might be performative or habitual, not indicative of true desire.
      *   **The Core Question:** Is the friend's approach sound, or is the user missing something?

  2.  **Evaluate the Friend's Approach (Behaviorism/Revealed Preference):**
      *   *Strengths:* People often say one thing and do another. Subconscious desires often leak through behavior. Inconsistency in words suggests uncertainty.
      *   *Weaknesses:* It assumes behavior is always voluntary and intentional. It ignores context (performative behavior). It creates a "no-win" situation for the girlfriend (if she says X, he doubts; if she does Y, he interprets it). It undermines communication and trust. It treats her like a puzzle to solve rather than a partner to talk to.

  3.  **Evaluate the User's Intuition:**
      *   *Strengths:* Recognizes the "observer effect" (she knows he's watching). Acknowledges that habits $\neq$ desires. Senses the relational damage of this mindset.
