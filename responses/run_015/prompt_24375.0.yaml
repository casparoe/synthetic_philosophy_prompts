answer: |-
  # Specification for a Theory of Rational Staking Under Uncertainty

  The following specification defines the necessary conditions for a theory to claim adequacy in the domain of repeated, multiplicative betting with parameter uncertainty. The focus is on the structural integrity of the decision rule rather than the derivation of a specific fraction.

  ## I. The Desiderata

  **1. Ergodic Consistency (Time vs. Ensemble)**
  *   **Requirement:** The theory must explicitly distinguish between the expectation of wealth across parallel universes (ensemble average) and the growth of wealth along a single trajectory through time (time average). It must prioritize the time average for a single, non-divisible agent.
  *   **Motivating Case:** The leverage space dispute. An expected-value maximizer takes a bet with positive arithmetic mean even if it implies almost-sure ruin over time (e.g., a 1% chance to multiply wealth by 1000, 99% chance to lose everything). An adequate theory must reject this as irrational for a single repeated bettor.
  *   **Classification:** **Non-negotiable.** (Failure implies a category error regarding the nature of multiplicative processes.)

  **2. Parameter Uncertainty Integration**
  *   **Requirement:** The stake must be a functional of the *distribution* of the win probability, not merely the posterior mean. The theory must quantify the penalty for estimation error (variance of the probability estimate) and reduce the stake accordingly.
  *   **Motivating Case:** The "Plug-in" Error. A bettor observes 6 heads in 10 flips (mean $p=0.6$) vs. 600 heads in 1000 flips (mean $p=0.6$). Standard Kelly prescribes the same stake for both. An adequate theory must prescribe a significantly lower stake for the former due to higher epistemic risk.
  *   **Classification:** **Non-negotiable.** (Failure ignores the specific "uncertainty" constraint of the prompt.)

  **3. Ruin Boundary Respect**
  *   **Requirement:** The strategy must explicitly define behavior at the boundary $W \to 0$. It must guarantee that the probability of hitting zero wealth is zero (or explicitly acceptable under a defined utility of ruin), preventing absorption states that terminate the compounding process.
  *   **Motivating Case:** The Martingale/Gambler's Ruin. Strategies that allow betting fractions $f \geq 1$ or borrowing without hard constraints eventually hit zero with probability 1 in the presence of any variance.
  *   **Classification:** **Non-negotiable.** (Multiplicative compounding is undefined at zero.)

  **4. Horizon Coherence (Myopic vs. Finite)**
  *   **Requirement:** The theory must state whether the optimal stake depends on the number of remaining bets $N$. It must reconcile the log-optimal property (myopic optimality leads to asymptotic maximization) with finite-horizon utility goals.
  *   **Motivating Case:** The "Last Bet" Problem. If only one bet remains, log-growth maximization may suggest a stake that is too volatile for a bettor needing a specific terminal sum. Conversely, log-optimists argue myopic maximization is sufficient for long runs.
  *   **Classification:** **Preference.** (Log-optimalists argue for myopic independence; EU maximizers argue for horizon dependence.)

  **5. Utility/Growth Separation**
  *   **Requirement:** The theory must distinguish the *objective growth rate of the opportunity* from the *subjective risk tolerance of the agent*. It cannot conflate the geometric drift of the asset with the curvature of the agent's utility function.
  *   **Motivating Case:** The Fractional Kelly Dispute. Is betting half-Kelly "irrational" because it sacrifices growth, or "rational" because it reduces volatility? The theory must account for volatility reduction as a utility preference, not a miscalculation of the growth rate.
  *   **Classification:** **Non-negotiable.** (To respect the prompt's demand not to collapse strategy asymptotics and utility functions.)

  **6. Correlation and Path Dependence**
  *   **Requirement:** The staking rule must adjust for serial correlation or correlated outcomes across simultaneous bets. It must recognize that variance drag increases with correlation, reducing the optimal geometric growth stake.
  *   **Motivating Case:** Portfolio Rebalancing. Two independent 55% coins allow full Kelly on both. Two perfectly correlated 55% coins act as one bet; staking full Kelly on both doubles the variance without doubling the edge, leading to overbetting and ruin.
  *   **Classification:** **Non-negotiable.** (Mathematical necessity for multiplicative portfolios.)

  **7. Borrowing and Leverage Scope**
  *   **Requirement:** The theory must define the conditions under which borrowing (leverage $> 1$) is permissible. It must identify the "Kelly Cliff" where leverage transitions from growth-enhancing to growth-destroying under uncertainty.
  *   **Motivating Case:** LTCM / Quant Blowups. Strategies that assume known odds often leverage to the point where a small deviation in true probability causes insolvency. The theory must limit leverage based on the width of the credibility interval of the edge.
  *   **Classification:** **Non-negotiable.** (Given the prompt's explicit inclusion of borrowing.)

  **8. One-Shot Coherence**
  *   **Requirement:** The theory must provide a coherent account of the one-shot case, even if the recommendation differs from the repeated case. It cannot simply assert "Kelly is for repeated bets" without explaining the rational basis for the one-shot stake.
  *   **Motivating Case:** The Single Coin Flip. If a bettor faces a single 55% opportunity with 1:1 odds, is the rational stake 10% (Kelly) or 0% (Risk-Averse)? A theory of rationality cannot be silent on the $N=1$ case.
  *   **Classification:** **Preference.** (Log-optimalists accept high risk for $N=1$; Risk-Averse camp does not.)

  ---

  ## II. Analysis of Tensions and Satisfiability

  ### Jointly Unsatisfiable Subsets
  There is a fundamental tension between **Desideratum 5 (Utility/Growth Separation)** and the implicit demand for a **Unique Rational Stake**.
  *   **The Conflict:** If the theory separates the objective growth rate (the "edge") from the subjective utility function (the "risk tolerance"), it cannot output a single number for "The Rational Stake" without importing a specific utility function.
  *   **The Trap:** If the theory claims to be **Utility-Neutral** (prescribing a stake based solely on the math of wealth dynamics), it implicitly imposes Log-Utility ($U(W) = \ln W$). If it claims to be **Sensitive to Risk Tolerance**, it must admit that the "rational" stake varies by agent, contradicting the idea of a single normative theory of staking.
  *   **Verdict:** You cannot have a theory that is simultaneously Utility-Neutral, Risk-Sensitive, and Prescriptive of a unique stake. One of these must yield.

  ### Is the List Satisfiable?
  **Yes, but only as a Framework, not a Formula.**
  The list is satisfiable if the theory is defined as a **two-layer architecture**:
  1.  **Layer 1 (Objective):** Calculates the *Growth Optimal Frontier* given the posterior distribution of probabilities (satisfying D1, D2, D3, D6, D7). This layer outputs the maximum geometric growth rate and the stake required to achieve it (Full Kelly under uncertainty).
  2.  **Layer 2 (Subjective):** Maps the agent's risk tolerance to a fraction of the Layer 1 stake (satisfying D5, D8).

  If the theory attempts to be a single formula that outputs "The Stake" without explicit utility input, the list is **unsatisfiable**.

  ### The Exclusionary Requirement
  The requirement that does the most work excluding candidates is **Desideratum 2 (Parameter Uncertainty Integration)**.
  *   **Why:** Standard Kelly Criterion assumes known probabilities. Standard Expected Utility maximization often assumes known probabilities or treats uncertainty via simple mean-substitution. Mean-Variance Optimization ignores the geometric nature of wealth (D1).
  *   **Impact:** This requirement eliminates the classic Kelly formula, the naive Expected Wealth maximizer, and standard Markowitz portfolio theory immediately. It forces the theory into the domain of Bayesian Decision Theory with non-linear wealth dynamics (e.g., integrating the posterior predictive distribution into the geometric expectation).

  ---

  ## III. Scorecard

  | Candidate Theory | Performance Against Desiderata |
  | :--- | :--- |
  | **Full Log-Optimal (Kelly)** | **Fails D2 & D5.** Maximizes growth assuming known odds (ignores estimation risk) and implicitly assumes Log-Utility, failing to separate objective growth from subjective risk tolerance. |
  | **Fixed Fractional Kelly** | **Passes D5, Fails D2.** Acknowledges risk tolerance (D5) but typically applies the fraction to the naive Kelly stake, failing to adjust the base stake for parameter uncertainty (D2). |
  | **Expected-Wealth Maximizer** | **Fails D1 & D3.** Maximizes arithmetic mean, leading to almost-sure ruin in repeated settings (violates Ergodic Consistency) and ignores the ruin boundary. |
  | **Generic EU Maximizer** | **Passes D5 & D8, Risks D1.** Handles risk tolerance and one-shot cases well, but unless the utility function is specifically logarithmic or the dynamics are explicitly geometric, it often collapses to arithmetic expectations (violates Ergodic Consistency). |

  **Summary:** No existing standard candidate satisfies the full specification. A satisfactory theory requires a **Bayesian Geometric Expected Utility** framework that integrates the posterior distribution of probabilities directly into the time-average growth function before applying risk preferences.
