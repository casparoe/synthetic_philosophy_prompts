  **the claim, translated**
  think of the concept 'copycat' as a cluster label in a high-dimensional feature space. in a rigid relational schema, you'd expect a set of required columns (necessary conditions) that must be non-null to trigger the label. but this claim says there's no single feature key or constraint that guarantees membership. instead, instances are grouped based on distance metrics to a moving centroid.

  an instance gets the 'copycat' label if it falls within a certain threshold of similarity to known examples, even if it shares no single specific feature with all other members (overlap without intersection). the decision boundary isn't a hard `IF/ELSE` statement or a static foreign key constraint; it's a probability threshold that shifts as the underlying distribution drifts. what counts as 'close enough' depends on the current context window—meaning the same feature vector might be flagged as an outlier in one deployment and sit right on the centroid in another. the category exists only as long as the pipeline continues to cluster these vectors together based on current weights.

  **the residue report**
