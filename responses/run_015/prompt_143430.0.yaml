  *   **source of gap:**
      *   it's a **target_deficit**. your vocabulary is built to resolve ambiguity into deterministic outputs (labels, booleans, schemas). the philosophical claim is describing a system that refuses to resolve. you're trying to model fluid dynamics with rigid pipe fittings.

  *   **verdict on vagueness:**
