answer: |-
  This is a sophisticated structural problem. You aren't just asking for a definition; you are asking for a *narrative operationalization* of a social ontology. You need a set of criteria that allows you to dramatize the difference between "this is how we live" and "this is why we live this way" without resorting to omniscient narration that tells the reader what to think.

  Here is the requirements list for an account of convention tailored to your novel's specific constraints, followed by the analysis of conflicts and the scorecard.

  ### The Requirements List

  To classify a practice as a **Convention** (as opposed to a habit, law, norm, or necessity), your account must deliver on the following five dimensions.

  #### 1. The Arbitrariness Requirement (Non-Negotiable)
  *   **The Claim:** There must have been at least one other workable alternative that could have solved the same coordination problem.
  *   **The Case It Sorts:** **The Mirror Code** vs. **The Left-Hand Ledge**.
  *   **Why:** The Mirror Code is a convention because they could have used drums or flags. The Left-Hand Ledge is *not* a convention; it is a physical necessity (the only passable path). If there is no alternative, there is no convention, only physics.
  *   **Narrative Function:** This allows you to show characters realizing, "We do this not because we must, but because we *did*."

  #### 2. The Interdependence Requirement (Non-Negotiable)
  *   **The Claim:** My reason for doing X depends on my belief that you are doing Y. If you stopped, my reason to continue would vanish or change fundamentally.
  *   **The Case It Sorts:** **The Mirror Code** vs. **Personal Habits**.
  *   **Why:** If I paint my door black because I like black, that's a habit. If I paint it black because I think *you* expect it, that's interdependence.
  *   **Narrative Function:** This creates the tension for the **Black Doors** case. If characters discover nobody cares, the interdependence collapses, and the practice should theoretically end (unless held up by something else).

  #### 3. The Tolerance Requirement (Taste/Variable)
  *   **The Claim:** The system must function despite minor deviations. Universal conformity is not required, only sufficient conformity to maintain the signal.
  *   **The Case It Sorts:** **The Ledge Lamps**.
  *   **Why:** If 90% light the lamps, the signal works. If your definition requires 100% compliance, the Lamps cease to be a convention and become a "failed rule."
  *   **Narrative Function:** This allows you to have dissenters (the stubborn tenth) without breaking the world. It distinguishes a *social equilibrium* from a *law*.

  #### 4. The Sanction/Enforceability Distinction (Non-Negotiable for Plot)
  *   **The Claim:** You must be able to distinguish between doing something because "it is the way" (convention) vs. doing something because "or else" (coercion/command).
  *   **The Case It Sorts:** **The Water-Turn Rule** vs. **The Mirror Code**.
  *   **Why:** In the Water-Turn, one side loses. If they comply only because the other side has weapons, it is subjugation, not convention. If they comply because "that's how water turns work," it is convention.
  *   **Narrative Function:** This is the crux of your political conflict. If the Water-Turn is a convention, it can be renegotiated. If it is coercion, it must be overthrown.

  #### 5. The Observability Condition (Your Novelist's Constraint)
  *   **The Claim:** The status of the practice must be inferable from public behavior, dialogue, and physical artifacts, not access to internal mental states.
  *   **The Case It Sorts:** **The Black Doors** (Pluralistic Ignorance) and **The Herders** (Asymmetric Knowledge).
  *   **Why:** You cannot write "John felt a preference." You must write "John looked at the neighbor's door, then at his paintbrush, and sighed."
  *   **Narrative Function:** This keeps the story in the realm of showing, not telling. It forces the mystery of the Black Doors to remain a mystery until a character tests it publicly.

  ---

  ### The Conflicts & Impossible Demands

  You asked to flag pairs that cannot be jointly satisfied. There is one major collision here that defines the limitation of your narrative perspective.

  **The Collision: Observability vs. Conditional Preference**
  *   **The Conflict:** David Lewis's definition relies on *conditional preferences* ("I prefer to conform *if* you conform"). This is an internal mental state. Your **Observability Condition** forbids direct access to this.
  *   **The Cost:** You cannot definitively prove a Lewisian Convention exists on the page. You can only show *evidence* of it.
  *   **The Consequence for the Black Doors:** In the Black Doors case, everyone *thinks* there is a sanction (preference to conform), but there isn't. A reader following the Observability Condition will see people painting doors black and assume it's a convention. They will only realize it *isn't* (or is a "false" convention) when someone paints a door red and nothing happens.
  *   **Verdict:** This is not a logical impossibility, but a **narrative delay**. You cannot satisfy Observability *and* Immediate Certainty of Preference simultaneously. You must choose: either the reader knows the truth (violating Observability/POV) or the reader discovers the truth through action (satisfying Observability, but delaying the classification).
  *   **Recommendation:** Treat Observability as **Non-Negotiable** for your genre, but accept that it makes the "Conditional Preference" requirement a *hypothesis* the characters test, not a fact the narrator states.

  **The Origin Question: History vs. Maintenance**
  *   **Your Question:** Does how it started matter, or only how it's kept going?
  *   **Answer:** For your specific chapter (the code shifting over one winter), **Maintenance is Non-Negotiable; Origin is Taste.**
  *   **Why:** If the code shifts without a meeting, it proves the convention is an emergent property of the system, not a contract. If you require an Origin Story (a "founding moment"), you cannot write that chapter.
  *   **Constraint:** Your account must allow for *drift*. A convention is a living equilibrium, not a fossilized law.

  ---

  ### The Knockout Requirement

  **Which single requirement knocks out the most candidates?**

  **The Arbitrariness Requirement.**

  *   **Why:** It immediately disqualifies **The Left-Hand Ledge** (physical necessity) and potentially **The Dawn Bell** (if the bell is tied to a biological/religious necessity perceived as non-arbitrary).
  *   **Impact:** It is the sharpest knife you have. It separates "The way the world is" from "The way we agreed the world is." In a novel about isolation and tradition, the realization that a practice is *arbitrary* is the moment revolution becomes possible.
  *   **Usage:** Use this to drive the plot. The protagonist's realization that the Mirror Code *could have been different* is the spark that suggests the Water-Turn Rule *could also be different*.

  ---

  ### Scorecard of Theoretical Accounts

  Here is how the three major philosophical approaches handle your seven cases, given your **Observability Condition**.

  | Account Type | **Lewis (Regularity + Expectation + Preference)** | **Sanction-Based (Norms + Punishment)** | **Evolutionary (Reinforcement + Drift)** |
  | :--- | :--- | :--- | :--- |
  | **Mirror Code** | **Pass.** Fits perfectly. | **Pass.** Enforced by social need. | **Pass.** Selected for efficiency. |
  | **Ledge Lamps** | **Fail.** Lewis struggles with non-universality (the stubborn 10%). | **Fail.** No sanctions applied to the 10%. | **Pass.** Robust to noise/defectors. |
  | **Water-Turn** | **Fail.** Lewis assumes common interest; this is conflict. | **Pass.** Identifies it as power/coercion. | **Pass.** Identifies it as stable dominance. |
  | **Black Doors** | **Fail.** Requires true preferences (which are absent here). | **Pass.** Explains it via *feared* sanctions. | **Pass.** Explains it as inherited behavior. |
  | **Left-Hand Ledge** | **Pass.** (As a non-convention). | **Pass.** (As a non-norm). | **Fail.** Might classify it as a convention (stable behavior). |
  | **Dawn Bell** | **Fail.** Everyone hates it (no preference to conform). | **Pass.** Kept by fear of sanction. | **Pass.** Path dependence/inertia. |
  | **Herders** | **Fail.** Requires mutual knowledge (one side lacks it). | **Pass.** One-sided enforcement works. | **Pass.** Asymmetric adaptation works. |
  | **Observability** | **Poor.** Relies on hidden mental states. | **Good.** Sanctions are visible behaviors. | **Best.** Only requires tracking behavior over time. |

  ### Final Recommendation for the Novel

  Do not use Lewis. His account is too clean for your valley. It collapses under the weight of the **Black Doors** (false preferences) and the **Water-Turn** (conflict of interest).

  Instead, adopt a **Sanction-Based account with an Evolutionary engine.**
  1.  **Define Convention by Vulnerability:** A practice is a convention if it *could* be different, but changing it carries a social cost (even if that cost is just confusion).
  2.  **Use Observability:** Let the reader judge the practice by what happens when it is *broken*.
      *   Break the **Lamps**: Nothing happens. (Tolerance).
      *   Break the **Doors**: Nothing happens. (Illusion revealed).
      *   Break the **Water-Turn**: Conflict happens. (Power revealed).
      *   Break the **Code**: Communication fails. (Necessity revealed).

  This approach satisfies your **Observability Condition** (you show the breaking, not the feeling) and handles the **Shift Chapter** (drift occurs until the cost of the new way is lower than the old way). It leaves the **Left-Hand Ledge** as the control group: the one thing that cannot be broken.
