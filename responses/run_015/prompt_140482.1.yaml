prompt: |-
  I'm writing a novel set in an isolated valley, and I've painted myself into a corner. Two villages on opposite rims of a gorge; a fever a generation before the book opens left most of the lower village deaf, so the two sides run everything through a code of mirrored shutters that everyone on both sides was born into. Nobody agreed to it, nobody remembers it starting, and a big part of the book is about which of their shared practices have any grip on them. I keep wanting to narrate that some practice is a convention and others aren't — a habit, a rule somebody enforces, a thing they do because they think it's right — and I realized I don't have a spec for what that claim is supposed to buy. My writing group says just use the Lewis-style thing, a regularity everyone conforms to, expects the others to conform to, and prefers to conform to given that the others do, but that feels like it decides my cases by fiat before I know which cases matter.

  So: write me the requirements list. What does an account of convention have to deliver for me to call the practices in my valley by that name — which cases it has to sort correctly, which distinctions it can't collapse (convention vs mere regularity, vs a command backed by force, vs a norm people enforce, vs something they'd do anyway for independent reasons), which bits of the story it has to be able to accommodate, with the case behind each requirement. The cases I actually need handled: the mirror code itself, where a second, equally workable code existed and this one just won; the ledge lamps, where a stubborn tenth never light them, everybody knows it, and the system runs fine anyway; the water-turn rule, where the two villages' interests genuinely conflict and one of them is getting the worse deal; the black doors, where every household keeps its door painted black because each believes the others would sanction any other color, though in fact nobody cares and nobody has ever enforced it; the left-hand ledge, the only passable one, which everyone walks on and where there was never any alternative worth coordinating around; the dawn bell, which everybody hates and everybody still keeps; and the herders and their dogs, who time their movements around each other down to the minute, with only one side having anything like expectations about the other's expectations. Tell me too whether how a practice got started belongs in the test or only how it's kept going, since I have a chapter where the code shifts over one winter without anyone deciding anything.

  Mark which requirements are non-negotiable and which are just the taste of one camp, and flag any pair you think can't be jointly satisfied — that's the part I most want, because if the list is impossible I'd rather know now. One purpose-of-the-theory thing specific to me: I want a test a reader could in principle apply from what's on the page, from behavior and what people say out loud, without access to anyone's real preferences or to whether they all truly know what the others know. Say whether that observability condition is a genuine desideratum or my own novelist's prejudice, and if it's genuine, what it costs — I suspect it collides head-on with the bit about conditional preferences. Then tell me which single requirement knocks out the most candidates. A short scorecard at the end: how Lewis's own regularity-and-expectations account does, how the accounts that build sanctioning into the definition do, and how the evolutionary or reinforcement-style pictures that don't ask for beliefs at all do. Keep the weight on the criteria, the scorecard can be a few lines.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Context:** The user is writing a novel about two isolated villages separated by a gorge. One village is mostly deaf (due to a past fever). They communicate via a code of mirrored shutters.
      *   **Problem:** The user is stuck on defining "convention" within the story. They want to distinguish between different types of practices (habits, rules, norms, conventions, physical necessities) without just declaring them so by fiat.
      *   **Critique of Existing Theory:** The writing group suggested David Lewis's account (regularity + mutual expectation + conditional preference), but the user feels this decides cases too early ("by fiat") and wants to know *what work the definition is doing* before applying it.
      *   **Task:** Create a "requirements list" for an account of convention tailored to the novel's specific cases.
      *   **Specific Cases to Handle:**
          1.  *Mirror Code:* Arbitrary (another code could have worked), won out historically.
          2.  *Ledge Lamps:* 10% don't light them, system works anyway (tolerance/non-universality).
          3.  *Water-Turn Rule:* Conflict of interest, one side gets the worse deal (power/coercion vs. convention).
          4.  *Black Doors:* Pluralistic ignorance (everyone thinks others care, but no one actually does).
          5.  *Left-Hand Ledge:* Physical necessity/coordination without alternative (not arbitrary).
          6.  *Dawn Bell:* Everyone hates it, but keeps doing it (inefficiency/tradition vs. convention).
          7.  *Herders & Dogs:* Coordination exists, but only one side has expectations about expectations (asymmetric knowledge).
      *   **Specific Questions to Answer:**
          *   Does origin matter or just maintenance? (Chapter involves shift without decision).
          *   Mark requirements as Non-Negotiable vs. Taste.
          *   Flag incompatible pairs (impossible demands).
          *   Evaluate the "Observability Condition" (reader must judge from behavior/speech, not internal states). Does it collide with conditional preferences?
          *   Which single requirement knocks out the most candidates?
          *   Scorecard: Lewis vs. Sanction-based vs. Evolutionary/Reinforcement.
      *   **Tone:** Analytical, precise, helpful for a writer, acknowledging the philosophical depth without getting bogged down in jargon.

  2.  **Deconstruct the Philosophical Problem:**

      *   The core tension is between *Lewisian Convention* (coordination equilibrium, arbitrariness, mutual knowledge) and *Social Norms/Institutions* (power, sanctions, history, internalization).
      *   The user's "Observability Condition" is the biggest hurdle. Lewis relies heavily on *preferences* and *mutual knowledge* (internal states). If the reader can't see those, the definition breaks unless operationalized through behavior.
      *   The "Black Doors" case is classic pluralistic ignorance (normative illusion).
      *   The "Water-Turn" case is about power asymmetry (convention vs. imposed rule).
      *   The "Left-Hand Ledge" is about natural constraints (not a convention if no alternative exists).
      *   The "Shift" chapter suggests an evolutionary/teleological account rather than a rationalist one.

  3.  **Drafting the Requirements List:**

      *   *Requirement 1: Arbitrariness.* (Crucial for distinguishing from physical necessity).
      *   *Requirement 2: Interdependence.* (My action depends on yours).
      *   *Requirement 3: Normativity/Expectation.* (People expect others to do it).
      *   *Requirement 4: Sanction/Enforceability.* (Distinguishes from mere habit).
      *   *Requirement 5: Origin Independence.* (Can emerge without explicit agreement).
      *   *Requirement 6: Observability.* (The user's specific constraint).

  4.  **Evaluating Cases against Requirements:**

      *   *Mirror Code:* Needs Arbitrariness + Interdependence.
      *   *Ledge Lamps:* Needs to allow non-universality (tolerance).
      *   *Water-Turn:* Needs to distinguish coercion from convention (Power asymmetry).
      *   *Black Doors:* Needs to handle false beliefs (Pluralistic Ignorance).
      *   *Left-Hand Ledge:* Needs to fail the Arbitrariness test (Natural constraint).
      *   *Dawn Bell:* Needs to handle inefficiency/dislike (Path dependence).
      *   *Herders:* Needs to handle asymmetric knowledge (Mutual Knowledge vs. One-sided).

  5.  **Addressing the "Impossible Demands":**

      *   *Observability vs. Internal States:* This is the big collision. Lewis requires knowing preferences ("prefers to conform given others do"). If the reader can't see preferences, they can't verify Lewisian convention. This *must* be flagged as a collision.
      *   *Origin vs. Maintenance:* If the code shifts without decision, origin doesn't matter. But if Water-Turn is coercion, origin (force) *does* matter. This is a tension.

  6.  **Developing the Scorecard:**

      *   *Lewis:* Good on Arbitrariness/Coordination. Bad on Power/Black Doors (requires true preferences). Bad on Observability.
      *   *Sanction-based:* Good on Black Doors/Water-Turn. Bad on Ledge Lamps (no sanction there).
      *   *Evolutionary:* Good on Shift/Herders. Bad on distinguishing Left-Hand Ledge (both evolve).

  7.  **Refining the Output (Iterative Process):**

      *   *Self-Correction on Observability:* I need to be clear that "Observability" is a novelist's constraint, not a philosopher's standard desideratum. Philosophers care about truth; novelists care to what can be shown. I need to validate this as a valid *narrative* constraint but highlight its philosophical cost.
      *   *Self-Correction on "Knockout":* Which requirement eliminates the most? Probably "Arbitrariness" (kills the Ledge) or "Mutual Knowledge" (kills the Herders and Black Doors). Actually, "Conditional Preference" (Lewis's core) kills the Dawn Bell (they hate it) and Water-Turn (one side hates it). Let's argue that *Arbitrariness* is the strongest filter for "Convention" specifically vs. "Rule" or "Necessity."
      *   *Formatting:* Use clear headings. Bold key terms. Keep the scorecard tight.

  8.  **Final Review against User Prompt:**

      *   Did I cover all 7 cases? Yes.
      *   Did I address Origin vs. Maintenance? Yes.
      *   Did I mark Non-Negotiable vs. Taste? Yes.
      *   Did I flag incompatible pairs? Yes (Observability vs. Internal Preference).
      *   Did I evaluate the Observability Condition? Yes.
      *   Did I identify the biggest knockout requirement? Yes.
      *   Did I provide the Scorecard? Yes.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the depth of the problem. It's not just semantics; it's plot mechanics.
      *   *The List:* Break down into Functional, Epistemic, and Historical requirements.
      *   *The Collision:* Highlight the Observability vs. Preference conflict.
      *   *The Origin Question:* Maintenance matters more for your plot.
      *   *The Knockout:* Arbitrariness.
      *   *Scorecard:* Lewis (Struggles with Black Doors), Sanction (Struggles with Lamps), Evolutionary (Struggles with Ledge).

  10. **Final Polish:** Ensure the tone is collaborative and respects the user's intelligence (they know Lewis already). Make sure the distinction between "Convention" and "Norm" is clear where needed. (Self-correction: Ensure I don't solve the plot for them, but give them the tools to decide).

  *(Self-Correction during drafting)*: Wait, the user asked "Which single requirement knocks out the most candidates?" I need to be careful here. If I define convention *too* strictly, nothing counts. If *too* loosely, everything counts. The "Arbitrariness" requirement is the standard philosophical differentiator between Convention and Natural Law/Necessity. That's the one that kills the Left-Hand Ledge. The "Conditional Preference" kills the Dawn Bell. I should argue that *Arbitrariness* is the most defining feature of *convention* specifically, whereas *Preference* defines *equilibrium*. I'll stick with Arbitrariness as the primary filter for the label "convention."

