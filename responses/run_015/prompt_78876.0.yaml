          *   *Hume's Logic:* In a nascent economy, there are few merchants and little capital. Opportunities are huge relative to capital. Risk is high. Therefore, returns on capital (profits) are high. Because returns are high, merchants are willing to pay high interest to borrow money to capture those profits. Because capital is scarce, lenders can charge high interest.
          *   *Mature Economy:* Competition increases. Capital accumulates. Margins get squeezed. Profits fall. Because profits are lower, merchants can't afford to pay high interest. Because there is lots of savings (riches), lenders compete to lend, driving rates down.
