answer: |-
  This is a fantastic puzzle, and you are right to feel stuck on that specific phrase. To modern ears, "great profits" sounds like "booming economy," so linking it to "small advance of commerce" feels like a contradiction. Your friend spotted the apparent inconsistency immediately.

  However, Hume isn't muddled; he is using a specific definition of "profit" that relies on the **scarcity of capital**, not the absolute size of the economy.

  Here is how to reconstruct Hume's argument so you can hold your end up, broken down into the three specific problems you raised.

  ### 1. The "High Profits" Paradox
  **The Confusion:** How can high profits indicate a *lack* of commercial advance?
  **Hume's Logic:** Hume is talking about the **rate of return on capital**, not the total wealth of the nation.

  Imagine two economies:
  *   **Economy A (Early Stage):** There are very few merchants and very little accumulated savings (capital). However, there are endless opportunities to trade. Because capital is scarce and opportunities are abundant, the return on any invested pound is massive. If I lend you £100 to buy a ship, you might make £50 profit because there's no competition.
  *   **Economy B (Mature Stage):** There is massive accumulated wealth and thousands of merchants. Competition is fierce. Margins are squeezed. If I lend you £100, you might only make £5 profit because everyone else is doing the same trade.

  Hume's point is that **high rates of profit exist where capital is scarce.** If you are seeing 20% or 30% returns on trade, it's because there isn't enough money floating around to compete those returns down. That is a sign of a *poor* (in terms of capital stock) economy, not a rich one.

  In a highly advanced commercial society (like England in Hume's time, or the US today), capital is abundant. When capital is abundant, competition drives the *rate* of profit down.

  **The Argument for your Friend:**
  > "When Hume says 'great profits,' he doesn't mean the country is rich. He means the *margin* on capital is high. High margins only happen when there aren't enough competitors and not enough savings. That's a sign of an undeveloped market. In a developed market, capital is everywhere, competition is fierce, and profit margins are thin. That's why interest is low."

  ### 2. Connecting the Triad (Demand, Supply, Profit)
  Hume lists three circumstances for high interest. They are not three separate things; they are a causal chain describing the **Market for Loanable Funds.**

  1.  **Great Profits arising from commerce:** (The Incentive)
      *   Because capital is scarce and opportunities are huge, merchants know they can make a killing.
  2.  **Great Demand for Borrowing:** (The Result of #1)
      *   Because merchants see they can make 20% on a shipment, they are willing to borrow money at 10% interest. They *demand* loans to capture those high profits.
  3.  **Little Riches to Supply that Demand:** (The Constraint)
      *   Because the economy is young, people haven't had time to save up a pool of wealth. There are few lenders.

  **The Price Mechanism:**
  When Demand for loans is High (merchants want to expand) and Supply of loans is Low (savers haven't accumulated cash), the price of borrowing (Interest) goes **Up**.

  **The Reverse (Low Interest):**
  In an advanced economy: Profits are low (competition) $\rightarrow$ Merchants won't borrow at high rates (Low Demand) $\rightarrow$ But there is massive accumulated wealth looking for a home (High Supply of Loanable Funds).
  When Supply is High and Demand is Low, the price of borrowing (Interest) goes **Down**.

  **The Argument for your Friend:**
  > "Hume is describing supply and demand for *loans*, not money. High interest happens when everyone wants to borrow to chase high margins, but no one has any savings to lend. That's a capital-scarce economy. Low interest happens when everyone is already rich and savings are flooding the system, but there aren't enough high-margin projects to soak it all up. That's a capital-abundant economy."

  ### 3. Why the Quantity of Money Drops Out
  This is the core of Hume's monetarism (pre-dating the term).

  Your friend says: "Print more money $\rightarrow$ more money to lend $\rightarrow$ rates fall."
  Hume says: "Printing money changes the *units*, not the *wealth*."

  If the government prints double the cash and distributes it:
  1.  **Prices Double:** A loaf of bread costs twice as much.
  2.  **Loans Double:** I won't lend you £100 anymore; I'll lend you £200.
  3.  **Interest Rate Stays:** If I charged 5% before (£5 profit on £100), I now charge 5% on £200 (£10 profit). The *rate* is the same because the *real value* of the money is the same.

  The interest rate is the price of **deferred consumption** (real resources), not the price of **paper**. Printing paper doesn't create more wood, steel, or labor. Since interest is ultimately paid in real goods, the rate depends on the availability of real savings, not the number of banknotes.

  ### 4. The Short-Run Concession (The Trap)
  You asked: *Hume admits adding money "may have some influence, by exciting industry" before prices catch up. Doesn't that hand my friend the win?*

  This is the subtlest part. Hume concedes a **short-run liquidity effect**, but he denies a **long-run structural change**.

  **The Mechanism:**
  When new money enters (say, gold from the New World), it doesn't hit everyone at once. It hits the merchants and lenders first.
  1.  **Phase 1:** Lenders have more cash. They compete to lend it. Interest rates *do* drop temporarily. Merchants borrow cheaply and expand industry.
  2.  **Phase 2:** That spending hits the economy. Wages rise. Prices rise.
  3.  **Phase 3:** The lenders realize their money buys less. They demand higher interest to compensate for the inflation and the higher cost of living.
  4.  **Result:** Interest rates return to their "natural" level determined by real savings and profits.

  **Does this help your friend?**
  Only if your friend is arguing for a **temporary sugar rush**. If his argument is "We can permanently lower interest rates by printing money," Hume destroys him.
  Hume's point is that you cannot *sustain* low interest through printing. You can only get there through actual thrift and accumulation of capital.

  **The Argument for your Friend:**
  > "Hume admits printing money might lower rates for a few months while prices are sticky. But that's a sugar rush. Once prices adjust, lenders realize they're being paid back in cheaper dollars, so they jack rates back up. You can't print your way to a permanently low interest rate; you can only save your way there."

  ### Summary: How to Win the Argument
  Next time you talk to your friend, don't get bogged down in 18th-century text. Use this three-step reconstruction:

  1.  **Redefine Profit:** "Hume isn't talking about GDP growth. He's talking on profit *margins*. High margins mean capital is scarce. Low margins mean capital is abundant. Abundant capital is what lowers interest rates, not printing presses."
  2.  **Real vs. Nominal:** "Interest is the price of real resources, not cash. If you double the cash, you just double the price of everything else. The ratio (the interest rate) stays the same unless you actually build more factories or save more money."
  3.  **The Time Horizon:** "You're right that printing money might lower rates briefly (the liquidity trap). But Hume's point is about the *natural rate*. If you want low rates forever, you need a society of savers and efficient markets, not a central bank with a fast printer."

  Hume's insight is that **interest is a real phenomenon, not a monetary one.** Your friend is treating money as the engine; Hume treats money as the oil. Adding more oil doesn't make the car go faster; it just changes the lubrication until the engine heats up and adjusts.
