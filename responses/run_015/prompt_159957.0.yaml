answer: |-
  An adequate theory must explain how arbitrary regularities generate reasons for action and sanctions that persist absent direct personal payoff, thereby distinguishing normative force from coordinated expectation without invoking metaphysically mysterious entities.

  To adjudicate between your housemate's reductionism and the normativist's realism, you need criteria that test whether "normativity" is a distinct causal mechanism or merely a label for a complex equilibrium. The following desiderata specify the explanatory work a theory must perform to earn the label "norm" rather than "convention" or "regularity." Each requirement is tied to a specific phenomenological or empirical case you provided, with a designation of whether it is a non-negotiable constraint for any social theory or a contested demand specific to the normativist camp.

  ### Desiderata for a Theory of Social Norms

  **1. The Third-Party Sanction Criterion**
  *   **Motivating Case:** The escalator-standing regularity. Strangers glare at middle-standers despite suffering no coordination failure themselves.
  *   **Requirement:** The theory must explain why agents incur costs to punish deviations that do not negatively impact their own payoffs.
  *   **Status:** **Non-negotiable.** Any theory of social order must account for peer punishment; the dispute is whether this requires irreducible normative attitudes or can be reduced to indirect reciprocity/signaling.
  *   **Distinction:** Conventions are self-policing (I lose if I drive on the wrong side); norms are other-policing (I lose if *you* jump the queue).

  **2. The Privacy Criterion**
  *   **Motivating Case:** The undetectable, unenforced violation. An agent refuses to deviate even when detection probability is zero and no internal guilt mechanism is assumed *ex ante*.
  *   **Requirement:** The theory must specify the source of compliance when external sanctions and immediate preferences are removed.
  *   **Status:** **Demand of Normativist Camp.** Reductionists argue true undetectable compliance is rare or explainable by internalized preferences (which are just preferences); normativists insist this is the core of "oughtness."
  *   **Distinction:** Separates deterrence-based compliance from norm-based compliance.

  **3. The Pluralistic Ignorance Criterion**
  *   **Motivating Case:** The phantom norm. Stability under private rejection vs. overnight collapse upon public revelation.
  *   **Requirement:** The theory must distinguish between *compliance* (behavior) and *acceptance* (attitude) and model how common knowledge of this distinction triggers phase shifts.
  *   **Status:** **Non-negotiable.** Empirical history (e.g., Soviet collapse, #MeToo) demonstrates this dynamic; any adequate theory must model the epistemic conditions of stability.
  *   **Distinction:** Tests whether the theory relies on aggregate behavior or meta-expectations (what I think you think I should do).

  **4. The Boundary Criterion**
  *   **Motivating Case:** The boundary problem. Violations by outsiders annoy more than insiders; newcomers are bound immediately.
  *   **Requirement:** The theory must define the conditions under which an agent is deemed a "member" subject to the norm without explicit consent.
  *   **Status:** **Demand of Normativist Camp.** Reductionists treat this as group identification payoffs; normativists treat it as constitutive rule-following.
  *   **Distinction:** Separates universal moral rules from parochial social norms.

  **5. The Dynamics Criterion**
  *   **Motivating Case:** Empirical variation and norm death. Large between-society variation, transmission biases, and intra-cohort decay.
  *   **Requirement:** The theory must be consistent with cultural evolution models (biased transmission) and allow for rapid change within a single generation.
  *   **Status:** **Non-negotiable.** Must fit anthropological and historical data.
  *   **Distinction:** Filters out static equilibrium models that cannot explain change.

  ### Tensions and Trade-offs

  You correctly suspect a tension between **Privacy** and **Dynamics**. To explain undetectable compliance, a theory usually requires internalization (the norm is part of the agent's utility function). However, if the norm is deeply internalized, it becomes resistant to change, making the **Pluralistic Ignorance** collapse (overnight disappearance) hard to explain without ad hoc assumptions about fragile preferences. A theory that makes norms robust enough to handle privacy often makes them too sticky to handle phantom norm collapse; a theory flexible enough to handle collapse often reduces norms to fragile expectations that fail the privacy test.

  ### The Exclusionary Requirement

  The **Third-Party Sanction Criterion** does the most work in excluding otherwise attractive theories. Lewis-style convention accounts fail here decisively. In a coordination equilibrium, punishing a deviator who does not affect you is irrational costly behavior. To save the convention account, one must add auxiliary hypotheses about signaling or reputation, which often bloated the theory until it resembles a norm account anyway. If a theory cannot explain altruistic punishment of arbitrary rules without invoking future personal gain, it cannot distinguish norms from conventions.

  ### Your Prejudice

  Your list assumes that "norm" and "convention" are mutually exclusive natural kinds. This is a prejudice. It is equally possible that they are points on a spectrum of common knowledge and sanctioning severity. By demanding a binary test ("is normativity doing work?"), you may be forcing a distinction where nature offers a continuum. A sufficiently complex convention model (with repeated games and reputation) might meet all your desiderata without invoking irreducible normativity, suggesting the dispute is ontological rather than explanatory.

  ### Comparative Scoring

  | Criterion | Lewis-Style Convention | Social-Expectations (e.g., Bicchieri) | Cultural-Evolution + Punishment |
  | :--- | :--- | :--- | :--- |
  | **Third-Party Sanction** | **Fail** (Requires costly signaling add-ons) | **Pass** (Conditional preferences on expectations) | **Pass** (Altruistic punishment evolved) |
  | **Privacy** | **Fail** (No reason to comply if undetectable) | **Mixed** (Depends on internalization strength) | **Pass** (Internalized heuristics) |
  | **Pluralistic Ignorance** | **Fail** (Assumes common knowledge of preferences) | **Pass** (Core feature of empirical/normative expectations) | **Mixed** (Focuses on population frequencies) |
  | **Boundary** | **Weak** (Based on salience of group) | **Pass** (Based on identity conditions) | **Pass** (Based on tribal markers) |
  | **Dynamics** | **Weak** (Static equilibrium focus) | **Mixed** (Focuses on stability/shift) | **Pass** (Built on transmission dynamics) |
  | **Ontological Parsimony** | **High** (Only preferences/beliefs) | **Medium** (Adds conditional preferences) | **Low** (Adds cognitive modules/heuristics) |
