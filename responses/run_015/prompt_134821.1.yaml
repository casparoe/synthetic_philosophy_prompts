  ### Single Revision to Clean Up the Most

  **Revise Claim (5): The Counterfactual Test.**

  Your current Test (5) defines intention purely structurally (is the harm necessary for the plan?). This fails to capture the Mixed-Motive case where the harm is not necessary but is still desired.

  **Proposed Revision:**
  > '(5) The test for whether a foreseen harm is intended is twofold: if the harm had not been going to occur, would the agent still have had reason to act as she did? If yes, it is merely foreseen **unless the agent also desires the harm as an end or as part of her satisfaction in acting**.'

  **Why this works:**
  1.  **Fixes Mixed-Motive:** The agent desires the death; therefore, it is intended. Principle (4) renders it impermissible. Verdict (1) is satisfied.
  2.  **Preserves Switch:** The agent does not desire the one's death; it is merely a side effect. It remains foreseen. The act remains permissible.
  3.  **Preserves Footbridge:** The death is necessary for the plan. It remains intended. The act remains impermissible.
  4.  **Unifies Motive and Intention:** It acknowledges that in the Mixed-Motive case, the 'motive' (hatred) effectively converts the 'intention' from benign to malicious, resolving the conflict between (1) and (4).

  **The Cost:**
  You lose the objective purity of the counterfactual test. Determining whether an agent 'desires the harm as part of her satisfaction' is psychologically opaque compared to checking if the plan would succeed without the harm. You move from a test of *plan structure* to a test of *psychological state*. However, this is necessary to make your set hang together.
