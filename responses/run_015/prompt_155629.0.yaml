      *   *Free Will:* Does unpredictability save responsibility? If it's only epistemic (we can't know), determinism still holds. The BIL needs the "could have done otherwise" intuition. Epistemic unpredictability doesn't grant metaphysical alternative possibilities. The book's framing ("honest description is probabilistic") invites the slide, but it's a slide nonetheless. Compatibilism usually relies on *control*, not *unpredictability*.
