answer: |-
  This procedure is a sequential four-question test that categorizes consults by filtering out factual uncertainty before determining whether ethical principles dictate a single action, require acknowledging moral residue, or defer authority to surrogates.

  ### The Decision Procedure

  **Question 1: Clarity**
  *   **Ask:** Are the medical prognosis and the patient's values/preferences clear enough to apply ethical principles without significant speculation?
  *   **Sufficient Answer:** "Yes" requires consensus on prognosis and either a written directive or consistent testimony from a legally authorized surrogate regarding the patient's wishes.
  *   **If No:** Stop. **Category 2 (Uncertainty).**
  *   **Documentation:** "Consult Incomplete: Ethical analysis withheld pending clarification of [medical fact / patient values]." Do not sign off until facts are resolved.

  **Question 2: Permissibility**
  *   **Ask:** Is there at least one available option that does not violate a fundamental ethical prohibition (e.g., providing non-beneficial treatment, causing deliberate harm)?
  *   **Sufficient Answer:** "Yes" requires identifying at least one course of action that is medically indicated and ethically allowable.
  *   **If No:** Stop. **Category 4 (No Permissible Option).**
  *   **Documentation:** "No Ethical Recommendation: All available options constitute ethical violations. Action taken will require institutional mitigation and acknowledgment of wrong."

  **Question 3: Decisiveness**
  *   **Ask:** Do established ethical principles or hospital policy clearly prioritize one permissible option over the others?
  *   **Sufficient Answer:** "Yes" requires citing a specific principle (e.g., best interest, justice via policy) that outweighs competing claims.
  *   **If No:** Stop. **Category 4 (Value Tie / Surrogate Authority).**
  *   **Documentation:** "No Ethical Recommendation: Competing options are ethically permissible and equally weighted. Decision rests with [legal surrogate / family] as this is a value judgment, not an ethical determination."

  **Question 4: Residue**
  *   **Ask:** Does the clearly prioritized option violate a significant competing moral claim that cannot be satisfied (e.g., saving a life requires violating autonomy)?
  *   **Sufficient Answer:** "Yes" requires identifying the specific moral cost that remains even after the right decision is made.
  *   **If No:** **Category 1 (Clean Settlement).**
      *   **Documentation:** "Recommendation: [Action]. Ethical justification is clear with no significant remaining objections."
  *   **If Yes:** **Category 3 (Moral Residue).**
      *   **Documentation:** "Recommendation: [Action]. Note: This course is ethically required but incurs moral residue regarding [violated principle]; guilt or grief is appropriate and should be supported."

  ---

  ### Application to Cases

  **(1) Two Patients, One Ventilator (Policy Tie)**
  *   **Q1 (Clarity):** Yes. Prognosis and scores are identical.
  *   **Q2 (Permissibility):** Yes. Allocating to either is permissible; withholding from both is not.
  *   **Q3 (Decisiveness):** No. The written policy runs out at the tie. No ethical principle favors Patient A over Patient B.
  *   **Result:** **Category 4 (Value Tie).**
  *   **Documentation:** "No Ethical Recommendation: Policy is silent on ties. Decision rests on an administrative tie-breaker (e.g., randomization), not ethical weighting. The committee recommends randomization to preserve equality, but acknowledges this is procedural, not ethical."
  *   **Analysis:** The procedure forces you to admit the policy failed. If you impose randomization here, you are making policy, not finding an ethical truth.

  **(2) Comatose Man (Wife vs. Son)**
  *   **Q1 (Clarity):** No. There is no written directive, and credible testimony regarding the patient's values is contradictory. We do not know what the patient wanted.
  *   **Result:** **Category 2 (Uncertainty).**
  *   **Documentation:** "Consult Incomplete: Requires resolution of conflicting surrogate accounts regarding patient's prior wishes. Ethics cannot weigh values we do not possess."
  *   **Analysis:** The committee stops here. If the hospital legal hierarchy favors the wife, Q1 becomes Yes (her decision *is* the patient's value legally), moving it to Q3. If legal hierarchy is unclear, it stays Category 2 or shifts to Category 4 (Legal conflict). The procedure prevents the committee from guessing the patient's will.

  **(3) Ten-Year-Old Leukemia (Mom vs. Dad)**
  *   **Q1 (Clarity):** Yes. Prognosis is clear for both paths; parents' values are clear (quality vs. quantity).
  *   **Q2 (Permissibility):** Yes. Both continuing and stopping chemo are medically defensible and ethically permissible.
  *   **Q3 (Decisiveness):** No. No ethical principle prioritizes one parent's value hierarchy over the other's when both are legal custodians.
  *   **Result:** **Category 4 (Value Tie / Surrogate Authority).**
  *   **Documentation:** "No Ethical Recommendation: Both paths are ethically permissible. This is a conflict of valid values within the family unit, not an ethical violation. Decision rests with parents or legal adjudication."
  *   **Analysis:** You suspected the procedure would say "isn't our decision at all." It does. This is not deflating the tragedy; it is correctly identifying that the tragedy is ontological (the disease), not ethical (the committee's choice). The residents treat it as a tragedy requiring ethical resolution because they feel the weight of the outcome, but the procedure clarifies that the *authority* to bear that weight lies with the parents, not the committee. To recommend one side is to usurp parental authority on a value question where ethics is neutral.

  ### Misfires and Tie-Breakers

  **Where the Procedure Misfires**
  The procedure assumes a shared baseline of "permissibility" (Q2). It misfires in deep cultural or religious conflicts where the committee and the family do not agree on what constitutes "harm" or "benefit." In those cases, Q2 becomes contested, and the committee cannot objectively answer "No" without imposing external values. The procedure also misfires if the committee lacks the power to say "Consult Incomplete" (Category 2); if the attending forces a sign-off regardless of uncertainty, the procedure exposes the institutional coercion but cannot stop it.

  **Tie-Breakers (First-Come-First-Served)**
  A tie-breaker like first-come-first-served does not resolve the moral conflict; it relocates it from the ethical sphere to the administrative sphere. It converts a question of "who deserves life" (which has no answer) into "who arrived first" (which has a factual answer). This is morally arbitrary but procedurally necessary to avoid paralysis. In the procedure, this belongs in **Category 3 (Moral Residue)** if adopted as a rule: "Recommendation: Allocate by arrival time. Note: This rule is administratively necessary but ethically arbitrary; moral residue remains for the patient denied care." It acknowledges that the rule manages the dilemma without solving it.
