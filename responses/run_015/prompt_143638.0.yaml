      *   *Annalist Specifics:* The "Annalist" (recording demon) doesn't need to erase *during* the cycle. But the *state* of the tape changes. The entropy of the tape increases. The total entropy (Gas + Tape) increases. The work extracted is bounded by the entropy increase of the tape. $W \le kT \Delta S_{tape}$.

