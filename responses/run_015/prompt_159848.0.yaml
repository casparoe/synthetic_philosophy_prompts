  5.  **Addressing the Final Three Fields:**
      *   **(8) The Missing Thing:** Both are treating "Germany" as a monolith. They are missing the *international system* aspect (security dilemmas, alliances) which is the third variable often cited against Fischer (e.g., Christopher Clark's *Sleepwalkers*). Or, they are missing the distinction between *causal responsibility* and *moral blame*. Let's go with the distinction between *causal explanation* (structural) and *moral attribution* (agency). Actually, the prompt asks what *they* are missing. They are missing the distinction between *liability for repair* (reparations) vs *moral culpability* (sin). Article 231 was about liability for costs, not necessarily moral sin, though it was read as such.
