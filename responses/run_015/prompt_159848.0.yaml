      *   **Move 6 (Nadia):** *Systemic Selection.* The swap rigs it. The *system* that selected those men is "Germany." Fischer: September Program/pressure groups = societal settlement.
          *   *Strengths:* Captures the essence of the Fischer Controversy (structural vs. individual). Correctly identifies that institutions select leaders.
          *   *Weaknesses:* Still doesn't fully implicate the *whole* nation, just the elite structure.
          *   *Verdict:* Strong historical grounding (Fischer). Defeats the Swap test logically.

      *   **Move 7 (Sam):** *Overgeneralization.* If you blame elites/lobbies, it's still not the nation. If you blame everyone who benefited/failed to check, every belligerent is guilty, so no one is.
          *   *Strengths:* Reductio ad absurdum. If everyone is guilty, the label loses distinction.
          *   *Weaknesses:* Fischer's point was specifically that Germany's elite structure was *uniquely* aggressive (Weltpolitik), not identical to others.
          *   *Verdict:* Good logical check, but historically contestable regarding the uniqueness of German aggression.

  3.  **Drafting the Adjudication (Move by Move):**
