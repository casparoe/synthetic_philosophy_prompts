          *   *Verdict:* Strong on political function of blame, slightly quick on the "cheering" evidence.

      *   **Move 3 (Sam):** *The Link.* What connects State to Nation? Not consent or control. 1914 crowds were manipulated.
          *   *Strengths:* Highlights the democratic deficit in Imperial Germany. Challenges the "social contract" basis of liability.
          *   *Weaknesses:* Assumes consent/control are the *only* bases for liability (Nadia challenges this next).
          *   *Verdict:* Strong historical point, philosophical premise is vulnerable.

      *   **Move 4 (Nadia):** *Negligence & Complicity.* Blame isn't just intent; it's negligence/benefit. Reichstag voted war credits (including SPD). Blame = present obligation to distrust patriotism.
          *   *Strengths:* Shifts from "guilt" to "responsibility." Historically true about war credits. Reframes blame as forward-looking.
          *   *Weaknesses:* SPD vote was under duress/patriotic fever. "Benefits" is vague for the average worker.
