      *   *Correction on Move 7:* Sam's point about "every belligerent" is the "Whataboutism" defense. Fischer specifically argued Germany was *uniquely* culpable. Sam is ignoring the degree of culpability.
      *   *Refining the "Missing Thing":* The distinction between Article 231 (legal liability for damages) and "War Guilt" (moral sin). The Allies needed a legal basis for reparations; the Germans read it as moral shaming. This confusion fueled the debate.

