  **Overall Credence:** 75% — Epiphenomenalism is likely self-refuting because it severs the epistemic link required to assert the theory.

  **Term Breakdown:**

  1.  **Reference Causality:** 85% — Without a causal chain, it is hard to explain how the word "pain" latches onto the quale rather than the neural state.
  2.  **Property Dodge:** 80% — Causation is generally extensional; if the physical does the work, the phenomenal property remains causally inert and explanatorily idle.
  3.  **Inference Exemption:** 90% — Theoretical inference collapses if the introspective premises supplying the inference are themselves unjustified.
  4.  **Justification Requirement:** 60% — Reliabilism offers a slim chance that reliable correlation without causation could sustain justification.

  **Combination:** The high scores on reference and inference outweigh the slim reliabilist hope, making the view epistemically unstable.

  **Most Work:** The **Inference Exemption** term does the heaviest lifting; if you cannot trust the introspective starting point, the theoretical conclusion cannot be reached.

  **Moving Consideration:** A robust account of **non-causal reference** (how we can talk about things that do not affect us) would lower my credence significantly.
