  **MEMORANDUM**

  **TO:** The Commission
  **FROM:** Secretariat
  **DATE:** Wednesday
  **SUBJECT:** Consistency Note: Medical School Regional Quota Proposal

  ### (a) Candidate Rules Derived from Precedent

  To ensure our opinion is consistent with our own history rather than external politics, we must derive rules that explain all eight prior decisions without contradiction. Your initial intuitions were close, but required refinement to accommodate the "Board Gender" (Approved 1) and "Party List" (Approved 2) cases, which lack sunsets.

  Here are the three rules that survive the full body of precedent:

  1.  **The "Core Competency" Rule:** A measure is inappropriate if it compromises the essential technical, artistic, or safety standard that the institution exists to select for.
      *   *Survival Check:* Explains **Rejected 3 (Conservatoire)** (artistic merit is core) and **Rejected 1 (Civil Service)** (promotion merit is core). Consistent with **Approved 1 (Boards)** (governance diversity *is* a competency of a state board) and **Approved 4 (Tie-Break)** (candidates are within 1 point, so competency is effectively equal).
  2.  **The "Subsidiarity of Hardship" Rule:** Hard quotas (reserving seats) are disproportionate where softer measures (tie-breaks, scholarships, upstream reserves) have not been tried or are sufficient to close the gap.
      *   *Survival Check:* Explains **Rejected 1 (Civil Service)** (upstream entry reserve already fixed the gap) and **Approved 4 (Tie-Break)** (softer than a reserve). Consistent with **Approved 3 (Scholarships)** (funding is softer than admission quotas).
  3.  **The "Structural vs. Individual Temporal" Rule:** Measures affecting individual entry into a career must be time-limited with review; measures affecting structural governance or electoral lists may be permanent.
      *   *Survival Check:* Explains **Rejected 2 (Fire Brigade)** (individual entry, no sunset) vs. **Approved 1 (Boards)** and **Approved 2 (Lists)** (structural, no sunset required). Consistent with **Approved 5 (Scholarships)** and **Approved 7 (Tie-Break)** (individual benefit/entry, both have sunsets).

  ### (b) Application to the Medical School File

  | Rule | Prediction for Medical File | Reasoning |
  | :--- | :--- | :--- |
  | **1. Core Competency** | **Pass (Distinguishable)** | Unlike the Conservatoire (#6), a medical school's function includes *service delivery*. Evidence that regional students return to practice suggests geography is relevant to institutional mission, not just an external social goal. |
  | **2. Subsidiarity** | **Fail** | The school proposes a 25% *bulk reserve*. Precedent #7 (Tie-Break) establishes that where candidates are qualified (near median score), marginal preference is the proportionate tool. A bulk reserve displaces higher-ranked applicants unnecessarily if a tie-break could achieve the aim. |
  | **3. Temporal** | **Pass** | The proposal includes a 7-year sunset and a year-4 review. This distinguishes it from the Fire Brigade (#4) and aligns with Scholarships (#5) and Tie-Break (#7). |

  ### (c) Recommendation

  **Recommendation:** **Reject the 25% bulk reserve mechanism, but invite resubmission as a marginal tie-break.**

  **Closest Precedent:** **Approved 7 (The Tie-Break).**
  This is the strongest anchor. In File #7, we approved preference for underrepresented groups *only* where candidates were within one point of each other, and *only* with an automatic lapse at parity. The Medical School's 25% bulk reserve displaces candidates who may be significantly higher ranked, which is a greater infringement on merit than the Tie-Break precedent allows.

  **Distinctions Required:**
  1.  **Distinguishing Rejected 3 (Conservatoire):** You are correct to worry about #6, Marta is not. However, we can distinguish it. The Conservatoire was rejected because postcode has no bearing on *artistic merit*. Here, the School argues (with evidence) that regional origin correlates with *retention in under-served areas*, which is part of the medical institution's public function. We can accept the *aim* without accepting the *method*.
  2.  **Distinguishing Approved 1 (Boards):** Marta will argue the 40% Board quota (#1) allows bulk reserves. We must distinguish *Governance* from *Entry*. Board seats are political/structural allocations; medical seats are individual career entries based on merit ranking. Our precedent consistently treats individual entry with higher merit protection (see Tie-Break #7 vs. Boards #1).

  **Why this works:** It validates the School's goal (avoiding a pure rejection that sparks a political fight) but enforces the Statute's "proportionate" requirement. It forces them to use the tool we already approved in #7 rather than the tool we scrutinized in #6.

  ### (d) The Committed Principle

  If we issue this opinion, we are committing the Commission to the following principle. It is phrased to prevent a quiet reversal next year:

  > *"Where an institution selects individuals based on competitive ranking, hard quotas reserving a fixed percentage of seats are disproportionate unless the institution demonstrates that marginal preference mechanisms (such as tie-breaks) have been tried and failed to close the representation gap. Bulk displacement of higher-ranked candidates is permissible only where the reserved characteristic is a direct proxy for the core technical competency required by the role."*

  This locks us into "Subsidiarity" (try tie-breaks first) and "Core Competency" (don't lower standards). To reverse this later, the Commission would have to publicly admit that tie-breaks are no longer sufficient or that merit is irrelevant, both of which would be visible shifts.

  ### (e) The Outlier Precedent

  **Approved 1 (State-Owned Company Boards).**
  This is the outlier we will eventually have to explain away. The Statute requires measures to be "time-limited." Files #4 (Fire), #5 (Scholarships), and #7 (Tie-Break) all strictly enforce sunsets or automatic lapses for individual opportunities. File #1 has "No end date."
  *Explanation:* We have implicitly treated "Governance Structure" as distinct from "Individual Opportunity." We will need to maintain this distinction carefully. If we ever approve a permanent *entry* quota, File #1 will be cited as authority, and the "time-limited" statutory requirement will be effectively dead. We must keep File #1 confined to *boards and lists*.

  ### (f) The Splitting Hypothetical

  To test your colleagues' commitment to these rules, table this hypothetical at the next meeting:

  > **The Engineering Faculty File:** A public engineering school proposes reserving 10% of seats for women. They have included a 5-year sunset clause. However, they intend to admit women who score up to 10% lower on the mathematics entrance exam than the lowest-ranked male admittee. They have not tried a tie-break mechanism first.

  **How it splits the rules:**
  *   **Marta's View (Temporal Focus):** She should **Approve**. The file has a sunset (satisfies the "time-limited" statute and distinguishes Fire Brigade #4).
  *   **Your View (Subsidiarity & Competency):** You must **Reject**. It violates the **Subsidiarity Rule** (no tie-break tried, contrary to #7) and the **Core Competency Rule** (lowering math standards for engineering compromises the essential selection criterion, akin to Conservatoire #6).

  If Marta approves this, she admits that *any* sunset justifies *any* merit compromise. If she rejects it, she admits that the Medical School's 25% bulk reserve (which also bypasses tie-breaks and displaces higher scorers) is inconsistent. This forces the room to choose between "Sunset is enough" and "Proportionality matters."
