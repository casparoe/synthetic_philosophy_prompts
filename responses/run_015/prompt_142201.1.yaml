prompt: |-
  I'm grading the second midterm for my 300-level Contemporary Moral Problems course — about forty papers, mostly juniors — and I've been staring at one answer for going on an hour now. Please don't bother with page references or "as so-and-so argues in her paper on X": I've read the literature, I just want the arguments engaged. First, act as an expert in contemporary moral philosophy who has graded a lot of population ethics essays, and before you put a mark on anything, brainstorm a bit: sketch out the rubric you'd want to use here — what a fully correct answer has to contain, what's creditworthy-but-imprecise, what's actually mistaken — and then apply it line by line. Here's the question I set:

  "Part A: Set out Parfit's non-identity problem and explain why it is supposed to cause trouble for a person-affecting restriction on morality — the idea, roughly, that an act is wrong only if it is worse for someone, or only if there is someone to whom the act has to be justified. Use the case of the fourteen-year-old girl: if she conceives now, her child's life will be at well-being level 70; if she waits ten years, a numerically different child exists whose life is at level 90. Both lives are clearly worth living. Explain why the restriction seems to entail that her act is not wrong, and say whether you think that is a problem for the restriction. Then consider my 'compensation variant': she cannot wait, but she can take a cheap supplement that raises her child's expected well-being from 55 to 70, where 55 is still a life worth living but well below the range it could have been. Does the non-identity problem tell us anything about whether she must take the supplement? Part B: Now take the 'different number' version — a depletion-style case, where one policy produces more people each at a lower level of well-being and another produces fewer people each better off, so that whoever exists under one policy would never have existed under the other. Does this version raise any difficulty that the 'same number' version does not? Is a solution to one automatically a solution to the other? Explain."

  Here is the answer I'm stuck on, typed out more or less verbatim, typos and all:

  "Parfit's non-identity problem rests on two claims. The first is that who a person is depends on the circumstances of their conception — which sperm, which egg, roughly when — so if the girl acts differently, a numerically different person exists later, not the same person with different properties. The second is that it is better for someone to have a life worth living than never to exist at all. So in the fourteen-year-old case, the child she has now could not have existed had she waited, and her life is worth living; the girl's act therefore makes no one worse off and wrongs no one. An act can be wrong only if there is someone it is worse for, so the act is not wrong. This shows that person-affecting views are simply refuted: no version of the restriction can survive, because any act that affects who exists will fail its test, and since nearly every act of ours shifts the timing of conceptions somewhere downstream, almost nothing we do could ever be wrong. Parfit's own response was to hold onto the intuitive verdict and give up the restriction instead, which is why he ends up saying that the outcome can be worse even though it is worse for no one.

  The compensation variant doesn't change anything. If the problem is really about identity, then it doesn't matter that the girl can improve her own child's prospects rather than conceive a different one: the child is still not made worse off by being at 55 rather than 70, since at 55 she has a life worth living, and a person-affecting view has nothing to say about how well off someone is in absolute terms. And a view that said 'leave people above the level of a life worth living' is just a comparative view in disguise, because 'worth living' is itself a comparison between existing and not existing. So the supplement isn't required and the variant is the original case with extra steps.

  For Part B, the different-number case is the same argument with more people in it. Under depletion, whoever exists later would not have existed under conservation, so again no one is made worse off, and again the restriction gives the wrong answer. A solution to the same-number case therefore automatically solves the different-number case: the structure is identical and only the number of people differs. And once you go impersonal, the number of people is irrelevant anyway — total utilitarianism handles both cases the same way, by adding up well-being."

  What I want from you: a grade, a short justification of the grade as a whole, and then specific comments tied to particular sentences — which moves are right, which are half-right, which don't actually follow, and what the student would have had to add to make them work. Be honest about the difference between "wrong" and "imprecise in a way I'd let pass." And for each place where you'd take points off, tell me what would change your mind: what more charitable reading of the sentence, or what clause the student might have meant to include, would make it come out right — and flag anywhere you think my own question was ambiguous enough that the student's reading is a defensible one. Also tell me where your own assessment is most likely to be wrong: if a colleague looked at your comments and said you were being uncharitable or over-literal, which line would they point at? Answer in American English, and think it through carefully rather than pattern-matching off how confident the prose sounds.
