answer: |-
  Hello. It is a pleasure to engage with these intuitions. You have stumbled upon one of the central debates in contemporary political philosophy: the tension between **Cosmopolitanism** (the idea that all human beings have equal moral worth regardless of borders) and **Statism** or **Nationalism** (the idea that we have special, stronger obligations to our fellow citizens).

  Your intuitions are not "messy"; they are actually quite sophisticated and align with what many ethicists call a **Moderate Hybrid View**. You are instinctively distinguishing between *harming* outsiders versus *failing to help* them, and between *basic survival* versus *social advantage*.

  Let's follow your request: I will brainstorm three candidate principles, select the most robust one, map your cases to it, identify where we must "bite the bullet" (adjust an intuition), and apply it to your new case.

  ### Phase 1: Brainstorming Candidate Principles

  **Candidate A: Strict Cosmopolitan Impartiality**
  *   **The Principle:** National borders are morally arbitrary. We must always act to maximize the well-being of the worst-off, regardless of nationality.
  *   **Pros:** Cleanly solves Case 2 (Tariffs) and Case 4 (ER Doctor).
  *   **Cons:** Requires you to abandon Cases 1, 3, 5, and 6. It implies you are morally obligated to send all charity abroad until you are as poor as the recipients, and that the state is wrong to prioritize its own citizens in disaster relief. This is likely too demanding for a workable human life.

  **Candidate B: Strong Statist Priority**
  *   **The Principle:** The state and its citizens are a closed moral community. Compatriots always come first, provided basic human rights are not actively violated.
  *   **Pros:** Validates Cases 1, 3, 5, and 6 comfortably.
  *   **Cons:** Fails Case 4 (ER Doctor) miserably (medical ethics are universal) and struggles with Case 2 (Tariffs). Most philosophers agree that actively impoverishing thousands of foreigners to save a few hundred local jobs is unjustifiable coercion.

  **Candidate C: The Basic Rights Constraint on Associative Duties (The Hybrid)**
  *   **The Principle:** We have special "associative duties" to compatriots that allow us to favor them in the distribution of **social advantages and discretionary aid**. However, these duties are **trumped** when the choice involves either (a) actively inflicting severe harm on outsiders, or (b) denying outsiders access to **basic human needs** when we are acting in a universalist professional capacity.
  *   **Pros:** Captures the nuance between "my community" and "humanity."
  *   **Cons:** Requires drawing a sharp line between "advantage" and "basic need," which can be fuzzy.

  ### Phase 2: Locking in the Principle

  I recommend we adopt **Candidate C**. It respects the value of community solidarity (which makes social life possible) without permitting cruelty or negligence regarding basic survival.

  **The Principle Statement:**
  > **The Tiered Obligation Principle:**
  > 1.  **Negative Duty (Strict):** Never advance compatriot interests by actively imposing severe deprivation or rights violations on outsiders.
  > 2.  **Universal Role Duty (Strict):** In roles dedicated to immediate life-preservation or basic human rights (e.g., emergency medicine), prioritize need over nationality.
  > 3.  **Associative Permission (Flexible):** In the distribution of social advantages, opportunities, and discretionary public goods, institutions and individuals may prioritize compatriots to sustain social solidarity and reciprocity.

  ### Phase 3: Mapping Your Cases

  Here is how this principle sorts your six cases:

  *   **Case 1 (Cafe Hiring):** *Associative Permission.* Hiring is a distribution of opportunity/advantage, not a life-or-death basic right. You are a private actor. Favoring the local kid sustains community ties. **Verdict: Permissible.**
  *   **Case 2 (Tariffs):** *Negative Duty.* Tariffs are coercive state policy that actively harm foreign farmers (pushing them into poverty). This violates the Negative Duty. The economic gain for locals does not justify the severe deprivation of outsiders. **Verdict: Wrong.**
  *   **Case 3 (Earthquake Relief):** *Associative Permission (State Function).* The state is a fiduciary agent for its taxpayers. When two emergencies compete (Home Quake vs. Foreign Quake), the state's primary duty is to its own constituents. Both are "basic needs," but the state's mandate is limited by borders. **Verdict: Permissible/Required.**
  *   **Case 4 (ER Doctor):** *Universal Role Duty.* Medicine is a vocation based on universal human biology and need, not citizenship. The doctor acts in a "Universal Role." Nationality is irrelevant to bleeding. **Verdict: Wrong.**
  *   **Case 5 (Personal Charity):** *Associative Permission.* This is discretionary spending. While helping abroad is *good*, you are permitted to prioritize your local community to maintain local social fabric. **Verdict: Permissible.**
  *   **Case 6 (University Admissions):** *Associative Permission.* This is the crux. A university spot is a "social advantage/opportunity," not a "basic survival need" (like food or emergency medicine). Since it is a *state* university, it is funded by state taxpayers to serve the state's human capital.
      *   **Resolution:** Your principle predicts this is **more like Case 3**. The state is permitted to prioritize the local kid to fulfill its contract with taxpayers, even if the refugee is more brilliant.
      *   *Caveat:* This is only permissible if the refugee is not being *harmed* (Negative Duty) and is not being denied a *basic right* (education is often considered a right, but university is usually an *advantage*). If the refugee has *no other option* for safety/education, the moral weight shifts, but strictly speaking, under this principle, the state may favor the local.

  ### Phase 4: Bullets to Bite

  To keep this principle coherent, there is one bullet we must bite, or at least acknowledge as a tension.

  **The Tension:** There is a friction between **Case 3** (State saves locals over foreigners in equal emergencies) and the **New Case** (below).
  In Case 3, you feel the state *should* favor locals even if the foreign need is bigger. My principle accepts this under "State Fiduciary Duty." However, this implies that borders *do* matter for survival aid when dispensed by governments. Some strict cosmopolitans will say this is wrong. But to respect your intuition (and the reality of how states function), we accept that states are partial agents.

  **The Adjustment:** We must be careful with **Case 6**. If the "brilliant refugee" is in a war zone, denying them education might contribute to their vulnerability. While the principle allows favoring the local, a *virtuous* institution might carve out a specific quota for humanitarian cases. The principle says favoring the local is *allowed*, not that it is *always the most virtuous option*.

  ### Phase 5: The New Case Application

  **The Case:** A Mayor must decide whether to fund a **local arts center** (cultural advantage) or send that same money for **flood relief abroad** (foreigners' basic survival needs).

  **Applying the Tiered Obligation Principle:**

  1.  **Analyze the Local Interest:** The arts center falls under **Associative Permission**. It is a social good/advantage, not a basic survival need.
  2.  **Analyze the Foreign Interest:** Flood relief, if people are drowning or losing homes, falls under **Basic Human Needs**.
  3.  **The Conflict:** Usually, Associative Permission allows favoring locals (like in Case 3). *However*, Case 3 was Survival (Home) vs. Survival (Abroad). In that tie, Home wins.
  4.  **The Verdict:** Here we have **Luxury/Advantage (Home)** vs. **Survival (Abroad)**.
      *   The **Negative Duty/Basic Rights Constraint** suggests that when the foreign need is *survival* and the local want is *non-essential*, the moral weight of the basic need trumps the associative privilege.
      *   While the Mayor has a duty to local taxpayers, spending public funds on *arts* while knowing those funds prevent *death* abroad crosses the threshold of the Basic Rights Constraint.

  **Prediction:** The Mayor **should fund the flood relief abroad.**

  **Why this differs from Case 3:** In Case 3, the government was choosing between saving *citizens* vs. saving *foreigners*. It chose citizens. That is permissible. In this New Case, the government is choosing between *entertaining citizens* vs. *saving foreigners*. The principle dictates that basic survival needs (wherever they are) generally trump discretionary social advantages (even for compatriots), provided the cost to the community is not existential.

  ### Summary of the Repaired View

  You do not need to abandon your intuition that community matters. You can favor your own in jobs, charity, university spots, and even emergency rescue *when competing against other emergency rescue*.

  However, you must accept two hard limits:
  1.  **Do not harm:** You cannot protect your own by actively crushing the poor (Tariffs).
  2.  **Survival Trumps Luxury:** When the choice is between your community's *advantages* and outsiders' *survival*, survival wins (The Mayor Case).

  This keeps your moral house in order: You are a good neighbor (Cases 1, 5, 6), a good citizen (Case 3), but not a cruel human being (Cases 2, 4, New Case).
