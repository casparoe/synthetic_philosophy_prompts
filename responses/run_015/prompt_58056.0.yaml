prompt: |-
  Hey, could you act as a professional philosopher who works on ethics and global justice and help me sort out my messy intuitions about favoring compatriots? Please think really carefully through this and start with some brainstorming of a few different candidate principles before you lock one in, I care about the reasoning.

  Here is where I am at, case by case:

  1. If I am hiring for my little cafe and I have two equally good applicants, one is a local kid from my town and the other is applying from abroad and is actually a bit needier, I would pick the local and feel totally fine about it.

  2. But if I am voting on a tariff that would save like 100 jobs in my state while pushing thousands of foreign farmers into deep poverty, voting yes just because my people come first feels definately wrong to me.

  3. When our goverment after an earthquake sends most of its rescue budget to a small quake at home even though a much bigger quake happened abroad the same week, I think that is not just allowed but what it should do.

  4. But if an ER doctor has two patients bleeding equally badly, one is a citizen and one is a tourist, and she treats the citizen first just because of the passport, that feels wrong to me, she should do first-come first-served or a coin flip or medical need, not nationality.

  5. My own donations: I give most of my charity money to the local food bank even though I know the same money would feed way more kids if I sent it abroad, and I beleive that is fine, maybe even good.

  6. The one I keep going back and forth on and I want your principle to decide: my state university reserves most spots for in-state kids, so a pretty average local kid gets in over a brilliant refugee kid from a war zone who would benefit expecially hugely. Is that more like case 3 where the institution should favor its own, or more like case 4 where it should not?

  Is there one principle that gets all or most of these, and if not which of my verdicts should I drop? Please state the principle as clearly as you can, say which case motivates each part of it, be honest about where you have to bite the bullet and overturn one of my takes to keep it simple, and then show what your repaired principle predicts for a new case I did not list, like whether a mayor should fund a local arts center over sending that same money for flood relief abroad when foreigners need it more.
