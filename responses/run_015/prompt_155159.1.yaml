  **Sketch of Candidate Branch Questions**

  1.  *"Do you accept Actualism?"* Fails: Requires literature knowledge; too abstract for mixed math backgrounds.
  2.  *"Is infinity coherent?"* Fails: Metaphysical; most accept coherence for argument's sake, so it doesn't separate ethical views.
  3.  *"Does order matter?"* Kept: Concrete, separates structural views without requiring set theory jargon.

  **Decision Tree: Infinite Ethics**

  **Start:** You accept some possible outcomes contain infinitely many lives (or infinite welfare), and this is not a reason to stop doing ethics.

  **Node 1 (Magnitude vs. Number):** Compare: (A) Countably infinite lives of finite bliss vs. (B) One life of infinite bliss. Are these shapes of infinity ethically symmetric? *(Gloss: Infinite magnitude means one life has unlimited welfare; infinite number means many lives have limited welfare.)*
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2 (Evalability):** Can any two infinite worlds be ranked?
  *   **No:** **Leaf 1: Ethics No Application.** (Diagnosis: Coherent but unexplored; defender must show why finite ethics survives while infinite fails.)
  *   **Yes:** Go to Node 3.

  **Node 3 (Finite Addition):** Add one bliss life to infinite bliss. Does total value increase? *(Gloss: Tests if finite differences register against infinite background.)*
  *   **No:** **Leaf 2: Anti-aggregative.** (Awkward commitment: Adding good lives to an already good world changes nothing.)
  *   **Yes:** Go to Node 4.

  **Node 4 (Hotel Rearrangement):** Rearrange infinite ecstatic/suffering lives (interleaved vs. blocked). Does value change? *(Gloss: Tests sensitivity to structural ordering vs. multiset content.)*
  *   **Yes:** **Leaf 3: Order-Sensitive.** (Awkward commitment: Sensitive to location or ordering of lives within the structure.)
  *   **No:** Go to Node 5.

  **Node 5 (Density):** Same cardinality of good/bad lives, different proportions (1/2 vs. 1). Does proportion matter? *(Gloss: Limiting relative frequency vs. cardinality.)*
  *   **Yes:** **Leaf 4: Density View.** (Awkward commitment: Compares worlds by limiting relative frequency or density.)
  *   **No:** Go to Node 6.

  **Node 6 (Convergence):** Conditionally convergent welfare series. Is the sum determinate? *(Gloss: Series converging to different limits depending on ordering.)*
  *   **No:** **Leaf 5: Nihilism/Paralysis.** (Awkward commitment: Presence of infinite value renders ordinary comparisons undefined.)
