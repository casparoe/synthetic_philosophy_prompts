answer: |-
  At a symposium on religious epistemology, a theologian approached a retired experimental physicist to discuss the problem of divine hiddenness. The theologian suggested that the standard formulation was sufficient: God’s presence is merely a weak signal obscured by the background noise of naturalistic events.

  The physicist shook his head. "You treat it as a sensitivity problem," he said. "I contend it is a blinding problem. The data suggests not attenuation, but an active epistemic shield wherein every potential evidentiary trace is systematically neutralized to mimic a null result with perfect fidelity."

  "But surely," the theologian objected, "a Creator who desires relationship would not obscure Himself so thoroughly."

  "Then the design is unethical," the physicist replied. "He demands belief as a condition for communion, yet constructs an environment where believing in His presence is methodologically indistinguishable from accepting an unfalsifiable control condition. It is as if the Principal Investigator requires us to publish a positive finding, while having personally ensured that the treatment group is empirically identical to the placebo. He wants the glory of a detection, but insists on the integrity of the blind."
