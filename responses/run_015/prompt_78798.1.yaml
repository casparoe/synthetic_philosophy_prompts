  1) 'The menu'

  1. **The Logical Validity Thesis:** No valid deductive argument contains exclusively descriptive premises and a normative conclusion. Here, 'is' means non-deontic vocabulary and 'ought' means deontic vocabulary. It asserts a syntactic constraint on valid inference regarding term distribution. *Verdict:* Trivial (terminological constraint on validity).

  2. **The Bridge Principle Thesis:** Deriving a normative conclusion requires at least one normative premise linking facts to values. The 'is' is any factual claim; the 'ought' is any normative claim. It asserts that pure description lacks normative traction without a linking rule, such as a principle of utility. *Verdict:* Trivial (restatement of 1 in philosophical dress).

  3. **The Semantic Non-Definability Thesis:** Normative predicates cannot be defined exclusively using descriptive vocabulary without remainder. The 'is' is natural language; the 'ought' is normative language. It claims terms are not synonymous, resisting analytic reductionism and preserving the open question. *Verdict:* Substantive (Moore's open-question claim).

  4. **The Ontological Non-Reducibility Thesis:** Normative properties are not identical to natural properties in the world. The 'is' refers to natural properties; the 'ought' refers to normative properties. It asserts a metaphysical distinction between value facts and natural facts, endorsing property dualism. *Verdict:* Substantive (Non-naturalist metaphysics).

  5. **The Motivational Internalism Thesis:** Descriptive beliefs lack intrinsic motivational force; normative judgments possess it inherently. The 'is' is a belief state; the 'ought' is a motivating state. It posits a psychological gap between believing facts and being moved to act without an independent desire. *Verdict:* Substantive (Humean theory of motivation).

  6. **The Hypothetical Limitation Thesis:** Facts yield only hypothetical imperatives; categorical obligations remain inaccessible from description alone. The 'is' includes desires; the 'ought' refers to categorical duties. It limits derivable norms to instrumental rationality based on antecedent desires or goals. *Verdict:* Substantive (Kantian distinction).

  7. **The Evidential Irrelevance Thesis:** Natural facts provide no evidence or probabilistic support for normative truths. The 'is' is empirical data; the 'ought' is ethical hypothesis. It claims empirical data cannot confirm ethical hypotheses, isolating ethics from scientific inquiry entirely. *Verdict:* False (violates supervenience constraints).

  8. **The Radical Incommensurability Thesis:** Normative and descriptive discourses share no rational traction or conceptual overlap. The 'is' is scientific discourse; the 'ought' is ethical discourse. It asserts complete isolation between fact and value domains, preventing any interaction or mutual adjustment. *Verdict:* False (makes ethical inquiry impossible).

  2) 'What each reading would license'

  1. **Validity:** Blocks neither evolutionary ethics nor practice-internal oughts; one simply adds a normative premise. It gives the colleague no support, as the student's paper supplies the bridge.
  2. **Bridge:** Blocks neither; institutional rules serve as bridges. It gives the colleague no support, as constitutive rules link facts to internal norms.
  3. **Semantic:** Blocks evolutionary reduction if 'ought' is undefined. Blocks internal oughts if rules are descriptive. It supports the colleague if he insists on semantic distinctness.
  4. **Ontological:** Blocks evolutionary reduction. Blocks internal reduction. It strongly supports the colleague's dismissal by denying normative facts are natural facts.
  5. **Motivational:** Blocks evolutionary explanation of action. Blocks internal motivation if rules are descriptive. It offers mixed support depending on the psychology of rule-following.
  6. **Hypothetical:** Blocks categorical claims from evolution. Allows internal oughts (conditional on playing). It offers partial support, conceding internal norms but blocking universal ones.
  7. **Evidential:** Blocks all naturalistic ethics. Blocks internal facts. It supports the colleague strongly, but relies on a false premise about evidence.
  8. **Incommensurability:** Blocks all ethics. Blocks all ethics. It supports the colleague strongly, but relies on a false premise about discourse.

  3) 'The naturalistic-fallacy detour'

  The label "naturalistic fallacy" conflates two distinct claims often hidden under one slogan. First, there is Moore's semantic claim: 'good' is indefinable in natural terms. Second, there is Hume's inferential claim: one cannot validly infer values from facts. Your colleague uses them interchangeably, but they come apart. One can accept semantic non-definability (Moore) while rejecting the inferential gap (via synthetic reductionism or bridge principles). Conversely, one can accept the logical gap (Hume) while denying semantic distinctness (if one allows normative premises). The colleague likely intends Moore's semantic claim to bolster Hume's inferential blocker. However, calling it a "fallacy" suggests a logical error, whereas Moore meant a conceptual confusion. Only the semantic claim aligns with Moore; the inferential blocker is Hume. They overlap only if one assumes analytic reductionism is the only path to naturalism.

  4) 'Which reading is doing the work'

  Your colleague likely relies on Reading 1 (Validity) rhetorically but intends Reading 4 (Ontology) substantively. He treats the trivial requirement for a bridge principle as a substantive barrier to naturalistic explanation. To sustain his dismissal of the grad student, he must accept Reading 4 or 7. If he accepts only Reading 1, he must admit the student's bridge principle (constitutive rules) is valid. His rhetoric suggests he believes normative facts are ontologically *sui generis*, inaccessible to empirical biology or institutional description. He is smuggling a substantive metaphysical claim into a logical platitude to stop the conversation.

  5) 'Confidence and the soft spot'

  I am highly confident in the distinctions between logical, semantic, and ontological claims presented here; this map reflects standard metaethical geography. The verdicts on triviality and falsity are robust across contemporary literature. The soft spot is Reading 2 versus Reading 1. Some argue bridge principles are substantive normative claims, while others see them as conceptual truths. If constitutive rules (chess) are merely descriptive facts about social practices, Reading 1 might block the student after all. I am least sure whether institutional facts count as pure 'is' or disguised 'oughts' in this specific context.
