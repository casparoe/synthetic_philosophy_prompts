  - First impression: about 3-4 sentences, plus any clarifying question you need to ask me.
  - The cannibal parallel: about 6-8 sentences applying your real argument.
  - The coherence twist: about 4-6 sentences addressing there claim that they are protecting internal order, not judging culture.
  - Bottom line: about 2-3 sentences giving your verdict on whether they are modern Europeans in disguise.
