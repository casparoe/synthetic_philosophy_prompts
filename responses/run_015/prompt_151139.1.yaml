answer: |-
  This notion strikes me as a curious inversion of justice, which usually demands a deed before punishment. You speak of men cast out merely for the shadow of a crime, not the substance. It reminds me of tyrants who fear thoughts more than swords. Such a practice seems to place the cart before the horse, judging the harvest before the seed is sown. Tell me, who among them holds the mirror that decides which speech is a pattern of harm?

  When I wrote of the Brazilians, I noted they eat the dead to avenge honor, while we burn the living for opinion's sake. Here, you say these authorities label men "pre-barbaric" to save the body politic, much as we label the Tupinambá savages to justify our conquest. Yet, is it not more barbaric to wound a soul that has done no injury than to consume a body that has ceased to feel? We call them wild for their rites, yet our own prisons and rack-rooms testify to a far deeper cruelty. They claim to prevent harm, but we too claim our tortures prevent heresy and chaos. In truth, both acts spring from a pride that believes we can see into the heart of another man. To punish a thought is to play God, and we are but men.

  You suggest this exclusion protects their internal order, distinct from our judging of cultures. But custom is a powerful king, and every society claims its laws are for coherence. Yet, if the foundation of this order is fear rather than justice, it is a fragile house. They say they remove the dangerous to save the whole, but I have seen states ruin themselves by fearing shadows. True coherence comes from virtue and reason, not from lopping off members based on suspicion. Thus, their defense of order is merely a mask for tyranny, just as our religious wars are masked as defense of faith.

  I fear these people are indeed Europeans in disguise, wearing new clothes but the same old skin. They judge others by their own measure and call it safety, just as we call our cruelty civilization. There is no difference in kind, only in the excuse provided.
