      *   *At $S_1$:* Current owners prefer "Fix roof + No hike" to "Fix roof + Hike". Using reserves achieves this.
      *   *At $S_3$:* They realize reserves were needed for Foundation.
      *   *Is this "Ignorance"?* They know reserves are finite. But they expect no more emergencies. That's a model risk. Spec 2(b) says "benefit survives across a broad class of models." Fixing a leak is good in almost all models. Running out of money is a specific tail risk.
      *   *Okay, I need to ensure Local EV is positive.*
      *   $EV(S_1) = \text{Benefit(Repair)} - \text{Cost(Reserve Depletion)} \times P(\text{Future Emergency})$.
      *   If $P(\text{Future Emergency})$ is low, $EV > 0$.
      *   If $P(\text{Future Emergency})$ turns out to be high (Step 2 & 3), then Ex Ante was negative.
      *   *This fits.* The "Trick" is that the probability of subsequent emergencies was underestimated, but not unreasonably so (Spec 4).
      *   *Wait, Spec 4:* "Nobody... ignorant in a way they could have fixed by being more careful."
      *   If a structural engineer said "Foundation will crack in 2 years," then using reserves is stupid.
      *   If the foundation crack was unpredictable (random event), then it's not ignorance.
      *   *Okay, I will use the "Unpredictable Cascade" model.*
      *   *Scenario:* **Hospital Ward Staffing.**
      *   $S_0:* Standard staffing. Safe, sustainable.
      *   $S_1:* One nurse calls out. Ward Manager pulls float pool. Cost covered by budget surplus. Care maintained. (PI: Patients cared for, Staff not overworked).
      *   $S_2:* Flu season hits. Two nurses out. Manager pulls float pool again. Budget surplus gone. Care maintained. (PI: Patients cared for, Staff not overworked).
      *   $S_3:* Surge hits. Float pool empty. Remaining staff forced overtime. Burnout. Errors rise. Patients harmed. (Bad).
      *   *Spec 4:* At $S_1$, Manager doesn't know Flu season will be bad. Using surplus is correct protocol.
      *   *Spec 2:* Using surplus to maintain care is robustly good.
      *   *Spec 3:* Endpoint (Burnout/Errors) worse than Origin (Sustainable).
      *   *Spec 5:* Different Managers or same Manager at different times (weekly decisions).
      *   *This is solid.* It's a "Buffer Depletion" ratchet.
      *   *Wait, Spec 2:* "Everyone affected is better off." At $S_2$, is the Budget Owner better off? Surplus is gone.
      *   *Adjustment:* The "Budget" is a shared resource. Depleting it helps Patients/Staff now, hurts Future Patients/Staff.
      *   *Are Future Patients "affected" at Step 1?* Spec 2 says "everyone affected... at the time." Future patients aren't present yet.
      *   *Spec 3:* "Judged by preferences those parties had back at the origin." Origin parties care about Future Patients (mission).
      *   *This distinction is the key.* Local SPI ignores future stakeholders. Global SPI includes them.
      *   *Wait, Spec 2(b):* "Benefit survives across a broad class of models."
      *   If the model includes "Future Emergencies," the benefit vanishes.
      *   *Requirement:* The benefit must hold across a broad class of models *available at the time*. At $S_1$, the model "Normal Winter" is broad/standard. The model "Pandemic Winter" is tail risk.
      *   *Okay, I'm confident in this direction.*

      *   *Refining the "Trick" explanation:*
      *   Safety is checked against *state* (current budget/staffing) while steps change *dynamics* (depletion rate vs replenishment rate).
      *   Also, the "Affected Parties" set expands/shifts over time (Future Patients).
      *   *Wait, Spec 3:* "Worse for every affected party."
      *   If Future Patients are affected at $S_3$, were they affected at $S_0$? Yes, by Origin preferences.
      *   *Okay, let's write it.*

      *   *Confidence Check:*
      *   Spec 2 & 3 Joint Satisfaction: This is the hardest part. Can a step be robustly good locally but lead to global ruin? Yes, if the global ruin depends on a sequence of low-probability events that *conditionally* become certain once the buffer is gone.
      *   Local EV: Positive because $P(\text{Cascade})$ is low at $S_1$.
      *   Global EV: Negative because $P(\text{Cascade})$ was underestimated ex-ante, or because the *value* of the buffer was higher than the *value* of the immediate fixes (which looks wrong locally).
      *   *Actually, to make Local EV positive *and* Spec 4 hold:* The decision at $S_1$ must be correct *given the information at $S_1$*. The information at $S_0$ (Ex Ante) would have suggested hoarding the buffer, but at $S_1$, the leak is real. You can't ignore a real leak to save for a hypothetical future leak unless the hypothetical is certain.
      *   *So the "Trick" is Time-Inconsistency of Optimal Policy.*
      *   Ex Ante: "Keep buffer full."
      *   Ex Post ($S_1$): "Fix leak."
      *   This is standard dynamic inconsistency. Does it fit "Safe Pareto"?
      *   Yes, because "Fix Leak" is Pareto superior to "Ignore Leak" *at that moment*.
      *   Okay, ready to draft.

      *   *One Sentence Lead:* Yes, this case meets specs 1-4 using a "buffer depletion" ratchet in a hospital ward where local robustness ignores the non-linear risk of cumulative resource exhaustion.
      *   *Scenario:* Hospital Ward Staffing/Budget.
      *   *Steps:*
          1.  Use surplus for unexpected absence.
          2.  Use remaining surplus for flu surge.
          3.  No surplus for major surge -> Collapse.
      *   *Analysis:*
          *   Local SPI: Yes (Care maintained, no overtime).
          *   Local EV: Yes (Probability of major surge low).
          *   Ex Ante: No (Buffer value > Individual fix value).
          *   Mechanism: State (Budget level) vs Dynamics (Depletion rate).
          *   Impossibility: Fixed preferences + Reversible world (could refill buffer).
          *   Simultaneous: Committee would hoard buffer.
          *   Pushback: Policy check loses robustness (can't predict all emergencies).

      *   *Wait, I need to make sure Spec 3 holds:* "Endpoint is worse... for *every* affected party."
      *   Parties: Staff, Patients, Admin.
      *   $S_0$: Sustainable.
      *   $S_3$: Burnout, Harm, Bankruptcy.
      *   Yes, everyone loses.

      *   *Wait, Spec 2:* "Benefit survives across a broad class of models."
      *   Does "Use surplus" survive across models? Yes, in most models, fixing the immediate problem is better than letting it break.
      *   Does it survive the model "Major Surge Coming"? No. But that's a narrow class of models (tail risk).
      *   So Spec 2 holds.

      *   *Final Polish:* Ensure the tone is analytical and fits the "LW-ish" request.
