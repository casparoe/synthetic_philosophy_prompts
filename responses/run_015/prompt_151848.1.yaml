prompt: |-
  In my philosophy reading group—mostly people with a rationalist background who have worked through the standard literature on preference aggregation, decision theory, and moral psychology—we keep stalling on what looks like a simple distinction but refuses to resolve. The question is whether particular patterns in moral judgement—proximity-weighting, scope-insensitivity to suffering, and temporal discounting of future welfare—should be classified as stable, reflective preferences that ethics ought to respect, or as cognitive biases analogous to the conjunction fallacy that systematically distort our access to impartial reasons. Everyone agrees on the descriptive psychology: these patterns are robust, partly evolutionary in origin, modulated by framing, and present even in reflective agents. Yet one camp treats them as parameters of a legitimate agent-relative utility function; the other treats them as correctable errors that a fully rational moral agent would filter out. After months of discussion, nobody has shifted position.

  My own suspicion is that this is not primarily an empirical disagreement—no new study on scope neglect is going to settle it—nor a purely verbal dispute about the word 'bias', but rather a disagreement about what kind of entity a moral reason is, specifically whether agent-neutrality is a precondition for a consideration to count as a reason at all. That said, I worry we might be answering two different questions under one label: one about the descriptive architecture of human moral cognition, the other about the normative architecture of rational choice, with neither side noticing the slide. There is also the deeper worry, which I would like you to address, that any attempt to 'debias' a moral weighting already smuggles in a competing normative weighting, so that calling one preference a bias and another a preference is circular rather than foundational.

  What I want is not a verdict on which side is right, but a diagnosis of the structure of the disagreement: is it factual, conceptual, normative bedrock, or a case of talking past one another? Given your diagnosis, is there a conceptual distinction—perhaps between corrigibility conditions and stability conditions, or between first-order preferences and second-order commitments—that could actually move the debate? Or is the stall inevitable because the distinction between preference and bias in the moral domain collapses once we recognise that every correction procedure presupposes its own normative baseline? And if progress is possible, what form should it take: a formal result in decision theory, an empirical finding about corrigibility, or a reframing of the question that dissolves the opposition?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Member of a philosophy reading group with a rationalist background. They know preference aggregation, decision theory, and moral psychology. They are sophisticated, analytical, and likely familiar with terms like "agent-neutrality," "scope-insensitivity," "conjunction fallacy," "reflective equilibrium," etc.
      *   **The Problem:** The group is stalled on a specific distinction: Are moral judgment patterns (proximity, scope-insensitivity, discounting) *preferences* (to be respected) or *biases* (to be corrected)?
      *   **User's Diagnosis:** Suspects it's not empirical or verbal, but about the nature of moral reasons (agent-neutrality). Worries about category errors (descriptive vs. normative) and circularity (debiasing presupposes norms).
      *   **The Goal:** Not a verdict on who is right, but a *diagnosis of the structure of the disagreement*. Is it factual, conceptual, normative bedrock, or talking past one another?
      *   **Specific Questions to Address:**
          *   Is there a conceptual distinction (corrigibility vs. stability, 1st vs. 2nd order) that could move the debate?
          *   Is the stall inevitable because the preference/bias distinction collapses in the moral domain?
          *   If progress is possible, what form should it take (formal, empirical, reframing)?

  2.  **Deconstruct the Disagreement:**
      *   **Camp A (Preference Aggregation/Subjectivist):** These patterns are part of the agent's utility function. If I care more about my neighbor than a stranger, that's my preference. Ethics should aggregate these. (Humean, Subjectivist, Agent-Relative).
      *   **Camp B (Rationalist/Objectivist):** These patterns are cognitive errors. A rational agent *should* care about scope. Proximity is irrelevant to moral worth. (Kantian, Utilitarian, Agent-Neutral).
      *   **The Stalemate:** Camp A says "You're imposing an external standard." Camp B says "You're rationalizing irrationality."
      *   **The Circularity Worry:** To call something a bias, you need a norm. To set the norm, you need to decide which inputs are valid. If you exclude proximity-weighting as a bias, you've already decided agent-neutrality is the norm.

  3.  **Diagnose the Structure:**
      *   It's not factual (they agree on the psych).
      *   It's not purely verbal (the stakes are real).
      *   It *is* a clash of normative bedrock *disguised* as a meta-ethical classification problem.
      *   Crucially, it's a confusion between *rationality of belief* (epistemic) and *rationality of desire* (practical). In decision theory, preferences are usually taken as given. In morality, they are often scrutinized.
      *   The "Bias vs. Preference" distinction works well in epistemic contexts (truth is the norm) but breaks down in axiological contexts (what is the norm?).

  4.  **Evaluate Potential Conceptual Distinctions:**
      *   *Corrigibility vs. Stability:* If a preference disappears upon reflection, is it a bias? But "reflection" is theory-laden.
      *   *First-Order vs. Second-Order:* Frankfurt-style hierarchy. Do I *want* to want to save more lives? Many rationalists do. But does that make the first-order urge a bias?
      *   *Instrumental vs. Intrinsic:* Is proximity a heuristic for effectiveness (instrumental) or a terminal value (intrinsic)? This is a key pivot point.

  5.  **Address the Circularity Worry:**
      *   The user is right. Calling something a bias *does* presuppose a normative baseline.
      *   However, this doesn't make the distinction meaningless; it makes it *explicitly normative*.
      *   The collapse happens if we pretend the distinction is purely descriptive/psychological. It must be acknowledged as axiological.

  6.  **Formulate a Path Forward (Progress):**
      *   *Formal Result:* Unlikely to solve the normative bedrock. Arrow's theorem etc. show limits of aggregation, not the content of preferences.
      *   *Empirical Finding:* Unlikely (they agree on the psych).
      *   *Reframing:* This is the most promising.
      *   *Specific Reframing:* Shift from "Bias vs. Preference" to "Heuristic vs. Terminal Value." Or "Constitutive vs. Contingent."
      *   *Better Reframing:* Distinguish between *Ideal Theory* (what reasons exist) and *Non-Ideal Theory* (how agents navigate cognitive limits).
      *   *Best Reframing:* The "Source of Normativity" argument. Camp B treats morality like math (truth-apt). Camp A treats it like taste (preference-apt). The debate is actually about Moral Realism vs. Anti-Realism (or Constructivism).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the query. Validate the suspicion that it's not empirical.
      *   *Diagnosis:* It's a **Category Error regarding the locus of normativity**. The group is treating an axiological dispute as a psychometric classification problem.
      *   *The Circularity:* Confirm the user's worry. "Bias" implies "Deviation from Norm." In morality, the Norm is the contested variable.
      *   *Conceptual Distinctions:*
          *   *Endorsement:* Use the Reflective Equilibrium model. It's not about stability, it's about *endorsement under idealized conditions*.
          *   *Heuristic vs. Terminal:* This is the strongest lever. Is proximity a proxy for causal efficacy (bias if wrong) or a brute fact of caring (preference)?
      *   *The "Collapse" Argument:* Does the distinction collapse? Yes, if you seek a view-from-nowhere. No, if you accept a specific meta-ethical framework (e.g., Robust Realism allows for bias; Humeanism does not).
      *   *Path Forward:*
          1.  Make the Meta-Ethics Explicit. Stop hiding behind "bias."
          2.  Distinguish *Epistemic* Rationality from *Practical* Rationality.
          3.  Adopt a "Two-Stage" model: Ideal Norms + Bounded Implementation.

  8.  **Refining the Tone:**
      *   Needs to be rigorous, respectful, and precise. Avoid condescension. Use the group's vocabulary (rationalist, decision theory, aggregation).
      *   Ensure I don't take sides (as requested).
      *   Focus on the *structure* of the impasse.

  9.  **Key Insight to Highlight:** The word "Bias" is doing too much work. It conflates *statistical deviation from a model* with *irrationality*. In ethics, the "model" is what's being fought over. The distinction that matters is **Instrumental Rationality vs. Axiological Commitment**.

  10. **Final Polish:** Check against the prompt's specific questions.
      *   Diagnosis of structure? (Normative bedrock disguised as psychometric).
      *   Conceptual distinction to move debate? (Heuristic vs. Terminal / Ideal vs. Non-Ideal).
      *   Is stall inevitable? (Only if meta-ethics remains implicit).
      *   Form of progress? (Reframing/Explicit Meta-ethics).

      *(Self-Correction during drafting)*: I initially thought about suggesting "Ideal Observer Theory." But that might just recreate the problem (who defines the ideal observer?). Better to focus on the *function* of the weighting. Is it truth-tracking or value-creating?

      *(Refining the "Circularity" point)*: I need to be careful not to say "anything goes." The circularity is vicious only if they claim objectivity for their classification. If they admit it's normative, the circle becomes a foundation.

      *(Final Plan)*:
      1. Validate the "Normative Bedrock" hypothesis.
      2. Explain why "Bias" is a loaded term in ethics (Epistemic vs. Practical).
      3. Propose the "Heuristic vs. Terminal" distinction as the lever.
      4. Suggest the "Ideal vs. Non-Ideal" framing to dissolve the tension.
      5. Conclude on the necessity of explicit Meta-Ethics.

  11. **Final Review against constraints:** No verdict on who is right. Focus on diagnosis. Address the circularity worry. Keep it high-level but precise.

      *(Wait, one more thing)*: The prompt mentions "rationalist background." This implies familiarity with LW/EA style rationality. I should acknowledge that specific context (e.g., the tension between "Shut up and multiply" and human intuition).

      *(Okay, ready to write.)*
answer: |-
  This is a sophisticated impasse, and your diagnosis is largely correct: you are encountering a **category error regarding the locus of normativity**, disguised as a psychometric classification problem.

  The stall is not inevitable, but it will persist as long as the group treats "bias" as a descriptive psychological category rather than an explicitly normative one. In epistemic contexts (e.g., the conjunction fallacy), we have an independent standard of correctness (probability theory/truth) against which to measure cognitive performance. In axiological contexts (moral weighting), the "standard of correctness" is precisely what is being contested.

  Here is a diagnosis of the structure of the disagreement, an evaluation of the conceptual distinctions available to you, and a proposal for how to reframe the question to allow progress.

  ### 1. Diagnosis: The Structure of the Disagreement

  The disagreement is **Normative Bedrock**, but it is masquerading as a dispute over **Descriptive Architecture**.

  *   **Camp A (Preferences)** is operating with a **Humean/Subjectivist** meta-ethical framework. On this view, reasons are grounded in the contingent desires of agents. If an agent reflectively endorses proximity-weighting, it is constitutive of their good. To call it a "bias" is to illegitimately impose an external standard of rationality upon desire.
  *   **Camp B (Biases)** is operating with a **Realist/Objectivist** (or robust Constructivist) framework. On this view, moral reasons exist independently of contingent psychological quirks. Proximity is morally irrelevant; therefore, weighting it is a failure of rational access to the moral truth, analogous to a calculation error.

  **The Circularity Worry:** You are right to worry that calling something a "bias" smuggles in a normative baseline. In decision theory, a "bias" is a systematic deviation from a normative model (e.g., Expected Utility Theory). But in moral philosophy, **the normative model is the object of inquiry.**
  *   If your normative model is *Preference Satisfaction*, proximity-weighting is a feature.
  *   If your normative model is *Impartial Welfare Maximization*, proximity-weighting is a bug.

  The stalemate occurs because Camp B is using "bias" to mean "deviation from impartial reason," while Camp A hears "deviation from authentic desire." They are talking past one another because they have not agreed on the *telos* of the moral system (aggregation of subjective states vs. alignment with objective reasons).

  ### 2. Conceptual Distinctions That Could Move the Debate

  Since the "Preference vs. Bias" distinction collapses without an agreed-upon normative baseline, you need distinctions that function *within* the disagreement to clarify what is actually at stake.

  #### A. Instrumental Heuristic vs. Terminal Value
  This is the most productive lever. Instead of asking "Is this a bias?", ask: **"Is this weighting a proxy for efficacy, or a brute fact of caring?"**

  *   **The Heuristic View:** Often, proximity-weighting is an evolved heuristic for causal efficacy (I can help my neighbor more easily than a stranger). If this is the case, it is *instrumentally* rational but *epistemically* fragile. If technology allows me to help the stranger just as easily (e.g., donating to effective charities), the heuristic fails. Camp B can accept this as a "bias" (a misfiring heuristic) without denying the agent's autonomy.
  *   **The Terminal View:** If the agent says, "I know I can help the stranger more effectively, but I *care* more about my neighbor," this is a terminal value. Camp A treats this as a sovereign preference. Camp B treats this as moral parochialism.

  **Why this helps:** It forces Camp A to specify if the weighting is about *impact* or *attachment*. If it's about impact, empirical facts about fungibility can dissolve the preference. If it's about attachment, the debate shifts openly to meta-ethics (is partiality permissible?) rather than hiding behind the label "bias."

  #### B. Ideal Theory vs. Non-Ideal Implementation
  Distinguish between the **normative target** and the **cognitive interface**.

  *   **Ideal Theory:** What reasons actually exist? (Camp B says impartial reasons; Camp A says agent-relative reasons).
  *   **Non-Ideal Implementation:** How should a bounded agent navigate the world?

  Even if Camp B is right that impartial reasons are the truth, they might concede that *enforcing* impartiality as a psychological mode of operation leads to worse outcomes (burnout, loss of personal integrity, collapse of local support networks).
  **The Reframe:** Camp B can classify proximity-weighting as a "bias" in the *ideal* sense (it doesn't track moral truth) but a "necessary constraint" in the *implementation* sense. Camp A can classify it as a "preference" in the *normative* sense.
  This allows Camp B to stop demanding psychological rewiring and Camp A to stop denying the existence of impartial reasons. It moves the debate from "What are we?" to "How should we build our moral software?"

  #### C. Corrigibility Under Idealized Reflection
  You mentioned stability conditions. A more precise distinction is **Corrigibility under Idealized Reflection**.
  *   **Bias:** A judgment that vanishes or is regretted when the agent has full information, unlimited cognitive processing, and is free from evolutionary framing effects (e.g., the "view from nowhere").
  *   **Preference:** A judgment that persists even under those conditions.

  **The Trap:** Camp B assumes the "idealized reflection" includes accepting agent-neutrality. Camp A assumes "idealized reflection" preserves the agent's identity (which includes partiality).
  **The Fix:** You must decouple "idealized reflection" from "agent-neutrality." Ask: "If you knew everyone's suffering equally well, would you still weight proximity?" If yes, it's a preference (Camp A wins). If no, it was an epistemic limitation masquerading as a preference (Camp B wins). This turns the debate into an empirical question about *reflective stability* rather than a semantic one about *bias*.

  ### 3. Is the Stall Inevitable?

  The stall is inevitable **only if** you attempt to resolve this within the confines of standard Decision Theory or Descriptive Psychology.
  *   **Decision Theory** takes preferences as exogenous inputs. It cannot judge them.
  *   **Psychology** describes mechanisms but cannot validate norms.

  The distinction between preference and bias in the moral domain *does* collapse if you seek a "view from nowhere" to adjudicate it. There is no neutral ground. However, the distinction does **not** collapse if you acknowledge that it is a **Meta-Ethical Choice**.

  The circularity you identified is not a bug; it is a feature. To call something a bias *is* to make a normative claim. The error is pretending that "bias" is a neutral, technical term like it is in statistics.

  ### 4. Path Forward: Reframing the Question

  Do not seek a formal result or a new empirical finding. Neither will solve a meta-ethical impasse. Instead, reframe the discussion using the following steps:

  **Step 1: Explicit Meta-Ethics**
  Force the group to state their meta-ethical commitments explicitly before discussing specific biases.
  *   "Are we doing **Moral Phenomenology** (describing how we actually reason) or **Moral Ontology** (describing what reasons exist)?"
  *   If the former, Camp A wins (these are robust features of cognition).
  *   If the latter, Camp B wins (these are deviations from impartiality).
  *   *Progress comes from agreeing on which project you are undertaking.*

  **Step 2: The "Error Theory" Compromise**
  Adopt an **Error Theory** regarding the *experience* of moral reasons.
  *   Acknowledge that human moral cognition *feels* like it is detecting objective reasons (Camp B's intuition).
  *   Acknowledge that this cognition is heavily shaped by evolutionary pressures for partiality (Camp A's data).
  *   The question becomes: **Do we want to hack the firmware?**
      *   This shifts the debate from "What is true?" to "What is the goal of our rationality?"
      *   Camp B argues for *Truth-Tracking* (aligning mind with impartial reasons).
      *   Camp A argues for *Integrity-Preservation* (aligning action with deep-seated commitments).

  **Step 3: Distinguish Epistemic vs. Practical Rationality**
  *   **Epistemic Rationality:** Beliefs should match reality. (Scope neglect is a bias here; 2 deaths are not 1 death).
  *   **Practical Rationality:** Actions should satisfy preferences. (Proximity weighting is a preference here).
  *   The conflict arises because morality demands that Practical Rationality submit to Epistemic Rationality regarding the *value* of lives.
  *   **The Move:** Ask Camp A: "Is the value of a life a matter of fact (Epistemic) or a matter of taste (Practical)?" If they say taste, they are Moral Anti-Realists. If they say fact, they must concede that scope-insensitivity is an error in perceiving that fact.

  ### Summary Recommendation

  Your group is stalled because you are trying to use a **psychological distinction** (bias vs. preference) to solve a **meta-ethical problem** (agent-neutrality vs. agent-relativity).

  1.  **Acknowledge the Circularity:** Agree that labeling something a "bias" presupposes a normative standard. Stop trying to prove the label is neutral.
  2.  **Adopt the Heuristic/Terminal Distinction:** Investigate whether the weighting is a claim about *efficacy* (falsifiable) or *value* (non-falsifiable).
  3.  **Shift to Implementation:** Debate whether, even if impartiality is the *truth*, partiality is the necessary *algorithm* for human functioning.

  If you make these distinctions explicit, the "Preference" camp may concede that scope-insensitivity is an epistemic error (Camp B's win) while maintaining that partiality is a permissible terminal value (Camp A's win). This dissolves the binary opposition and allows for a more nuanced model of moral rationality that accommodates both the demand for impartiality and the reality of bounded, embodied agency.
