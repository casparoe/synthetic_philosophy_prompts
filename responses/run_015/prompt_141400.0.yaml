  2.  **Brainstorming Mechanisms (Pre-JSON):**
      *   *Candidate 1: The User's "Split Rule/Example" Design.* This is strong because it directly isolates the variable (examples vs. rule text). It creates immediate divergence. Risk: It feels like a trick/test, which might trigger hostility. Requires careful balancing of examples.
      *   *Candidate 2: The "Debug the Category" Approach.* Give them a buggy classifier (a set of rules + examples that conflict) and ask them to fix it to match a hidden test set. This mirrors ML training. Risk: Too technical, might focus on "fixing the rule" rather than realizing *they* are the classifier drifting.
      *   *Candidate 3: The "Retrospective Reframe" (Post-Mortem Style).* Give them a set of incidents (e.g., "Production Incidents") and ask them to label severity. Halfway through, change the context (e.g., "These are now Security Breaches"). Risk: Might feel like moving goalposts rather than revealing inherent slippage.
      *   *Selection:* I will choose the User's "Split Rule/Example" design (Candidate 1) but refined to reduce the "test" feel. It's the most direct way to demonstrate that *examples drive the rule interpretation* without needing theory. It aligns best with the "glimwacket" and "letter-string" requests.
