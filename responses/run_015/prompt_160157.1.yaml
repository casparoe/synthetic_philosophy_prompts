answer: |-
  ### Audit of Inference Charter Commitments

  This audit evaluates the logical coherence, epistemic consistency, and inferential reach of the seven commitments provided. The analysis proceeds from the stipulative glosses and general principles of evidence, without recourse to external literature.

  #### 1. Ranked Tensions

  **Tension 1: The Epistemic Contradiction (a) vs. (c)**
  *   **Severity:** Critical.
  *   **The Conflict:** Commitment (a) states that objects *never* settle questions of belief content and the default is to report practice. Commitment (c) states that costly material behavior is the *best evidence* about what people *actually believed*.
  *   **Analysis:** These are mutually exclusive claims regarding the epistemic power of material evidence. (a) establishes a hard limit (underdetermination of belief); (c) establishes a breakthrough (costly signaling bypasses underdetermination). If (c) is true, (a) is false (or requires a massive exception clause). If (a) is true, (c) is overstated; costly signals may evidence *commitment to action*, but not necessarily *belief content* (e.g., a costly ritual signals devotion to the group, but not the specific cosmological propositions underlying it).
  *   **Resolution Cost:**
      *   *If (a) yields:* You lose the protective "honest default." You open the project to accusations of speculative psychology whenever costly acts are identified.
      *   *If (c) yields:* You lose the "epistemic engine." Material evidence becomes superior to text only for *behavioral sincerity*, not for accessing belief states. This weakens the claim of material superiority significantly.
  *   **Confidence:** 95%. This is a logical contradiction in terms of inference limits.

  **Tension 2: The Verdict Mismatch (g) vs. (c)**
  *   **Severity:** High.
  *   **The Conflict:** The case verdict (g) describes behavior that fits the criteria of (c): "deliberately broken," "selected," "recurring" (standardized), and "costly-to-maintain" (breaking useful tools). According to (c), this should be the *best evidence* for belief. However, (g) explicitly declines to infer belief ("no animism, no ancestor cult").
  *   **Analysis:** (g) is the practical application of the charter. It aligns perfectly with (a) and (b) but directly contradicts the promise of (c). If the charter is adopted, (g) is the correct verdict *only if* (c) is revised. As it stands, (c) demands an inference that (g) forbids.
  *   **Resolution Cost:**
      *   *If (g) yields:* You infer belief from the querns. This violates (a) and potentially (b), collapsing the distinction between institution and cosmology.
      *   *If (c) yields:* You restrict (c) to evidence of *institutional commitment* rather than *belief content*. This aligns (c) with (b) and validates (g).
  *   **Confidence:** 90%. The behavioral description in (g) triggers the conditions in (c), making the divergent conclusions glaring.

  **Tension 3: Ontological Mismatch (d) vs. (a)/(g)**
  *   **Severity:** Medium-High.
  *   **The Conflict:** (d) adopts a "Material Engagement" stance: meaning is *constituted* by things/practices. (a) and (g) adopt a Behaviorist/Positivist stance: meaning/belief is an internal state separate from practice, and since we only see practice, we cannot report meaning.
  *   **Analysis:** If (d) is true, and meaning is constituted in the engagement (the breaking of the quern), then reporting the practice *is* reporting the meaning. To say (as (a) and (g) do) "we see the practice but not the meaning" presupposes that meaning is antecedent and internal—precisely the view (d) rejects. (d) undermines the dualism required for (a) to make sense.
  *   **Resolution Cost:**
      *   *If (d) yields:* You simplify the ontology to a standard behaviorist model. You lose the theoretical nuance of "thinking through objects."
      *   *If (a)/(g) yield:* You must rephrase the default. Instead of "report practices rather than beliefs," it becomes "report engagements, which constitute meaning." This changes the vocabulary of the entire paper.
  *   **Confidence:** 75%. This depends on how strictly "constituted" is interpreted in (d). It is a philosophical tension rather than a logical contradiction.

  **Tension 4: The Bridge Mechanism (e) vs. (c)**
  *   **Severity:** Low-Medium.
  *   **The Conflict:** (e) demands "relational analogy" (documented process-to-pattern links) as the only legitimate bridge. (c) relies on "Costly Signaling," which is often posited as a universal evolutionary/functionalist mechanism (deductive) rather than a documented historical analogy (inductive).
  *   **Analysis:** Signaling theory claims that *because* a signal is costly, it *must* be honest. This is a theoretical model. (e) says we need a documented case where we *know* the process produced the pattern. If you use Signaling Theory as a universal law, you bypass (e). If you treat Signaling Theory as a hypothesis requiring middle-range testing, they are compatible.
  *   **Resolution Cost:** Minimal, provided you frame Signaling Theory as a hypothesis to be tested via (e), not as a standalone proof.
  *   **Confidence:** 80%. This is a methodological calibration issue.

  #### 2. Dissolved Tensions

  *   **(b) vs. (g):** No tension. (b) defines institutions as recoverable via standardized traces. (g) identifies a "socially recognized rule" via recurring sequences. This is a direct application.
  *   **(d) vs. (g):** Surprisingly compatible on method, if not ontology. (d) says "resist reading an object as a symbol standing for an antecedently held belief." (g) says "decline to infer... animism" (which would be reading the quern as a symbol of a spirit). Both reject the "object = symbol of internal thought" model. They diverge only on whether the practice *itself* holds meaning (d) or is just a practice (a/g).
  *   **(f) vs. Rest:** No tension. (f) supports (a) and (b) by removing the "textual lens" that usually forces belief inference onto objects.

  #### 3. The Single Best Revision

  **Revise Commitment (c).**

  *   **Current:** "Costly... material behavior is our best evidence about what people actually believed..."
  *   **Revision:** "Costly... material behavior is our best evidence about **commitment to institutional norms**..."
  *   **Why:** This single change resolves Tension 1 (a vs. c) and Tension 2 (g vs. c). It aligns (c) with (b) (Institutions are recoverable; beliefs are not). It preserves the "epistemic engine" (costly acts matter) without promising access to "belief content" (cosmology, animism), which (a) correctly identifies as underdetermined. It validates the verdict in (g) (we see the commitment to the closure rule, not the spirit of the quern).
  *   **Cost:** You lose the claim that archaeology can access "belief" better than texts. You gain the claim that archaeology can access "sincere normative commitment" better than texts. This is a more defensible, if slightly narrower, position.

  #### 4. Verdict on Case (g)

  **Can the package deliver (g)?**
  Yes, but only if (c) is revised as above. As currently written, (c) undermines (g).

  **Is (g) smuggling?**
  (g) is not smuggling, but it is **selective**.
  *   It infers a "socially recognized rule." This relies on the assumption that standardization + recurrence = norm. This is a strong inference, but permitted by (b).
