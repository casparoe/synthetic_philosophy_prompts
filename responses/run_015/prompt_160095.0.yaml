answer: |-
  Philosophers often endure a polite awkwardness at dinner parties. When asked what they do, they explain their trade, only to face the follow-up question that haunts the discipline: "What have you solved?" In molecular biology, the answer is visible in vaccines and gene editing. In philosophy, the questions asked by Plato seem indistinguishable from those asked by today's department chairs. This stagnation suggests a lack of progress, but intuition is a poor metric. To assess the field honestly, we need a diagnostic tool.

  Call it the "obsolescence share." This measures the fraction of a new researcher's training devoted to material the field treats as live, despite its age. In a progressive science, this share is near zero. A biology PhD student learns CRISPR, not the 1950s papers that led to it; old work is treated as history, a scaffold removed once the building stands. In philosophy, the share is high. Graduate students read Kant and Hume not as ancestors who were surpassed, but as interlocutors who might still be right. If a field's obsolescence share remains high generation after generation, there is a prima facie case that it isn't accumulating knowledge. It is merely churning.

  To make this diagnostic useful, we must sharpen it. We cannot simply measure "age of texts," or theology would look progressive. We must define "live." A text is live if it is assigned in core graduate seminars as a source of current arguments, rather than in history-of-ideas courses as a period piece. The "field" is defined by accredited doctoral programs, and the window is fifty years. If a significant portion of required reading exceeds this window and is treated as a contemporary competitor rather than a historical artifact, the obsolescence share is high. This distinguishes progress from mere agreement; a field could agree on everything yet still worship ancient errors. The diagnostic tests whether old errors are discarded.

  Running this test yields stark results. In molecular biology, the obsolescence share is negligible. A student might learn the history of the double helix, but they do not use Watson and Crick's original models to design experiments. The machinery is updated constantly; the old is obsolete. In philosophy, the share is substantial. Ethics seminars routinely pit modern papers against Aristotle's *Nicomachean Ethics*. Metaphysics courses treat Leibniz as a contemporary rival. By this metric, philosophy looks like a field that has forgotten how to finish a project.

  However, before condemning philosophy, we must distinguish what kind of progress this diagnostic can actually see. There are at least three varieties. First, there is *elimination*, where false positions are discarded. The model here is the fate of the "justified true belief" analysis of knowledge. For centuries, knowledge was defined as a belief that is true and justified. In the 1960s, Edmund Gettier produced simple counterexamples showing one could have justified true belief without knowledge. The old definition was eliminated. The diagnostic sees this: if the old definition were still taught as live, the obsolescence share would rise. Since it is largely taught as a cautionary tale, this counts as progress.

  Second, there is *exportable machinery*. This involves building formal tools that other disciplines adopt. Modal logic (the logic of necessity and possibility), Bayesian epistemology (using probability theory to model belief), and decision theory are philosophical inventions now standard in computer science and economics. The diagnostic sees this only partially. If the machinery replaces old logical tools, the old tools become obsolete. But if the machinery is added to the toolkit without retiring old questions, the obsolescence share remains high.

  Third, there is *redescription*. This is the act of dressing old disputes in new vocabulary without resolving them. Compatibilists argue free will is compatible with determinism; incompatibilists disagree. This fight has lasted millennia. New terms are coined, nuances added, but the core deadlock remains. The diagnostic cannot distinguish redescription from genuine refinement. To the metric, a sophisticated modern restatement of Hume looks the same as the original Hume: old material treated as live.

  This brings us to the strongest objection: the test is rigged. It assumes philosophy should progress like biology. But biology studies the physical world, which stays the same while our tools improve. Philosophy studies conceptual and normative spaces—reason, justice, knowledge—which do not degrade or update. Plato is not obsolete because the human condition is not obsolete. When a philosopher reads Plato, they are not reading a superseded theory of physics; they are examining a primary data source of human reasoning. The texts are evidence, not debris.

  Furthermore, the high obsolescence share might reflect depth rather than stagnation. In science, we stand on the shoulders of giants so we can look away from them. In philosophy, we stand on their shoulders to look at them. The progress is in the articulation, the argumentative hygiene, and the clarity with which we map the logical space. We may not have answered "What is justice?" but we have eliminated incoherent answers and built rigorous frameworks to discuss the remaining options. The exportable machinery proves this: philosophy has progressed by becoming the engineering department for rational thought, even if the CEO (the grand doctrine) hasn't changed.

  If this objection wins, the failure of the obsolescence test teaches us that accumulation of truth is the wrong metric for conceptual inquiry. A field can improve enormously in precision and utility without rendering its founders obsolete. The diagnostic measures scientific accumulation, not conceptual clarification.

  So, does philosophy progress? The obsolescence share confirms it does not progress scientifically. It does not build a skyscraper of truth where lower floors are sealed off and forgotten. But to say it makes no progress is to ignore the tools it has gifted the world and the errors it has pruned. It progresses locally, in specific sub-fields where consensus forms, and instrumentally, through the tools it exports. It does not progress globally toward a final theory of everything.

  The verdict must be nuanced but firm. Philosophy is not a failure because it reads old books; it is a different kind of enterprise. But it must admit that it does not solve problems in the way science does. It clarifies them.

  \answer{Yes — locally, and in exported tools, not in grand doctrines}
