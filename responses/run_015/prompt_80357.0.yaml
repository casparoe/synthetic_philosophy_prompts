  ### The Hard Truth: Which Intuition Must Drop?

  You suspected you might have to drop either the "Don't Pay" in Mugging or the "One-Box" in Newcomb.

  **If you accept the "Known vs. Unknown" distinction:** You keep both. Case 1 is a Sunk Cost fallacy trap; Case 3 is a Logical Correlation opportunity.

  **If you insist Case 1 and Case 3 are truly identical (i.e., you don't actually know the prediction in Case 1, you just suspect it):**
  Then you must adopt **Functional Decision Theory (FDT)** fully.
  *   **FDT Verdict on Standard Counterfactual Mugging:** **PAY.**
  *   **Why?** Because if you are the *type of agent* who pays in Counterfactual Mugging, the Predictor (who simulates your type) predicts "Pay," and therefore never sends the mugger in the first place.
  *   **The Cost:** To be consistent with One-Boxing in Newcomb, FDT requires you to Pay in Counterfactual Mugging *before* you know the outcome.
  *   **Your Case 1 Description:** You described a scenario where the mugger is *already en route* and you *know* the prediction was negative. In this specific "Lost Cause" variant, even FDT says **Don't Pay**, because the opportunity to influence the predictor is gone.

  ### Summary for your Seminar

  1.  **The Principle:** **Functional Decision Theory (Subjunctive Dependence).** Maximize utility by choosing the output of your decision algorithm, accounting for logical correlations with predictors.
  2.  **The Catch:** This only works if the prediction is **unknown** (Newcomb) or **counterfactual** (Standard Mugging). If the prediction is a **known historical fact** (Your Case 1), the link is broken, and you revert to Causal Decision Theory.
  3.  **The 5th Case:** **Pay.** It is a simple Expected Value calculation ($10 cost vs $95 expected loss).
  4.  **The Resolution:** You do not need to drop your Newcomb intuition. But you must acknowledge that your Mugging intuition (Case 1) is driven by the **knowledge of the negative prediction**, which makes it a different problem class than Newcomb's. If you remove that knowledge (Standard Counterfactual Mugging), FDT demands you Pay.

  **Recommendation:** Tell your professor your Case 1 is a "Post-Prediction Sunk Cost" scenario, not a "Counterfactual Mugging" scenario. In true Counterfactual Mugging (where you don't know the coin flip/prediction result until you're in the spot), FDT argues you *should* pay to be the kind of person who isn't mugged. Your intuition in Case 1 is correct for the scenario you described, but it wouldn't hold for the standard philosophical version.
