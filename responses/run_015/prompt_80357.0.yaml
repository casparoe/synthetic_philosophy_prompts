answer: |-
  You have stumbled onto the central tension in modern decision theory: the conflict between **Causal Decision Theory (CDT)** and **Evidential/Functional Decision Theory (EDT/FDT)**. Your intuitions are actually quite sophisticated, but you are correctly sensing that your justification for Case 1 (Mugging) and Case 3 (Newcomb) relies on different machinery, even though they *feel* structurally identical.

  There is a principle that unifies these, but it requires you to be very precise about **what you know** at the moment of decision. The principle comes from **Functional Decision Theory (FDT)**.

  ### The Principle: Subjunctive Dependence

  **The Rule:** *Choose the action that, if output by your decision algorithm, yields the highest expected utility, taking into account that other systems (predictors, simulations, copies) that depend on your algorithm's output will yield the corresponding result.*

  In simpler terms: **Act as if you are choosing the logical output of "You," knowing that any perfect predictor simulating "You" produced that same output.**

  However, this principle has a critical clause regarding **Information State**:
  *   **Clause A (Logical Correlation):** If the past event (money in box / mugger sent) is *logically linked* to your current decision algorithm but the *outcome is unknown to you*, your decision provides evidence about the past. (FDT/EDT applies).
  *   **Clause B (Known History):** If the past event is *already known to you as a fixed fact*, the logical link is severed. You cannot change the past, and your action provides no new evidence about it. (CDT applies).

  Here is how this principle dissects your cases.

  ---

  ### Analysis of Your Cases

  #### Case 1: The "Lost Cause" Mugging
  *   **Setup:** Predictor predicted "No Pay." Mugger is en route. You *know* the prediction was "No Pay." Paying $10 cancels the job, but the mugger is too close, so you get mugged anyway.
  *   **Analysis:**
      *   **Clause B applies.** You *know* the prediction was negative. In FDT terms, the simulation of you already returned "No Pay." You cannot now output "Pay" without creating a logical contradiction with a known fact.
      *   Furthermore, you stipulated that paying "buys literally nothing" (you get mugged anyway).
      *   **Verdict:** **Don't Pay.**
      *   **Why it feels like Newcomb:** It involves a predictor.
      *   **Why it isn't Newcomb:** In Newcomb, you do *not* know what the predictor put in the box. In Case 1, you *know* the predictor sent the mugger. The "subjunctive dependence" is broken by your knowledge of the outcome.

  #### Case 2: Time Travel Mugging
  *   **Setup:** Same as Case 1, but with time travel.
  *   **Analysis:** Even with time travel, if the traveler *already saw* you refuse, that event is fixed in your timeline. If you pay now, you are creating a paradox, or the traveler was wrong. If we assume the traveler is infallible, you *cannot* pay. If we assume you can pay, the traveler wasn't infallible, and we are back to Case 1 (Sunk Cost).
  *   **Verdict:** **Don't Pay.** (Consistent with Case 1).

  #### Case 3: Newcomb's Problem
  *   **Setup:** Predictor simulated you. Box A has $1M if predicted One-Box. You do *not* know the content of Box A.
  *   **Analysis:**
      *   **Clause A applies.** You do not know the prediction's outcome. Your decision algorithm *now* is identical to the simulation's algorithm *then*.
      *   If you output "One-Box," the simulation output "One-Box," so $1M is in the box.
      *   If you output "Two-Box," the simulation output "Two-Box," so Box A is empty.
      *   Your action does not *causally* move the money, but it is *subjunctively dependent* on the money's placement.
      *   **Verdict:** **One-Box.**
      *   **Resolution of your dilemma:** You feel Case 1 and Case 3 are identical, but they differ on **Knowledge**. In Case 3, the past is *opaque* (correlation holds). In Case 1, the past is *transparent* (correlation broken by fact). You don't need to drop an intuition; you need to distinguish "Unknown Prediction" from "Known Negative Prediction."

  #### Case 4: Blackmail
  *   **Setup:** Hacker leaks *if* you pay.
  *   **Analysis:**
      *   This is pure causality. Your payment *causes* the leak. There is no predictor simulating you; there is a threatener reacting to you.
      *   **Verdict:** **Don't Pay.**
      *   **Principle:** This is standard CDT. FDT agrees because there is no subjunctive dependence, only negative causal dependence.

  ---

  ### The 5th Case: The 95% Predictor

  *   **Setup:** Predictor is 95% sure you won't pay. Mugger is *probably* on the way. Paying $10 *definitely* cancels the job.
  *   **Analysis:**
      *   Here, the prediction is **probabilistic**, not a known fact.
      *   **Option A (Pay):** Cost $10. The mugger is cancelled (whether he was coming or not). Net: **-$10**.
      *   **Option B (Don't Pay):** Cost $0.
          *   95% chance Mugger is coming -> Loss $100.
          *   5% chance Mugger is not coming -> Loss $0.
          *   Expected Loss: 0.95 * $100 = **-$95**.
      *   **Comparison:** Losing $10 is better than an expected loss of $95.
      *   **Verdict:** **Pay the $10.**

  **Why this differs from Case 1:**
  In Case 1, you *knew* the mugger was coming (100% certainty based on known prediction) AND payment was ineffective. In Case 5, payment *is* effective, and the prediction is not a known historical fact but a probability. This restores the ability for your action to have positive Expected Value.

