prompt: |-
  I direct the documentation and public-statements unit at an international human-rights organisation, and I want a written decision procedure my team can actually run when we have to decide whether to call something genocide — or to use one of the weaker formulations we fall back on. The question arises fifteen to twenty times a year, always under time pressure: we have a twenty-four to forty-eight hour window, two junior researchers with field training but no legal qualifications, a legal adviser who is part-time and seven time zones away, and a rule that every characterisation must be signed off by the executive director before publication. Our statements then have a long afterlife: they are read into UN proceedings, quoted in donor capitals, amplified by diaspora organisations lobbying their own governments, and translated for local partners. We also have a hard internal rule against walking a characterisation back once it is published, and we were publicly accused last year of applying the standard faster in one country than in another, so cross-regional consistency is a live constraint, not a nicety.

  What I need is the conceptual structure turned into a test, not a summary of the law and not a literature review. The structure I have in mind is: the treaty definition with its four protected groups; the requirement that the group be targeted as such rather than incidentally; the unresolved question of how large or how significant a part of a group has to be; and the gap between that definition and the broader phenomenon Lemkin meant to name, a coordinated assault on a group's political, social and cultural continuity as well as its biological survival, of which the destruction of political groups and of culture were proposed and then dropped. I want a procedure with the questions in a fixed order, a specification of what counts as sufficient evidence at each step (including what to do when the relevant evidence simply does not exist, as opposed to being contradicted), the points at which the procedure terminates with a no, and the points at which it must hand the question to a person because it is a values conflict rather than a factual gap. Please have it operate on a graded vocabulary rather than a binary yes-or-no — something like a ladder running through crimes against humanity, genocidal acts, a genocidal campaign, and genocide, with a qualified or provisional register for cases where the evidence is directional but thin. One further thing I want built in: a fork between naming now and naming later, with explicit triggers for revisiting a case and a requirement that the reasoning be recorded in a one-page attribution memo that a successor can audit. Please define, as part of the procedure, four terms I intend to use internally: attribution debt, meaning the credibility we spend by naming early and that is charged against us in every later statement; downstream capture, meaning the fact that once we use the word, states, courts, funders and the perpetrators' own propagandists will use it for ends we neither intend nor control; the asymmetry of the two errors, meaning that the cost of under-naming falls on the victims of today while the cost of over-naming falls on future victims and on our own future credibility, and these are not the same people; and the residual case, meaning a campaign that falls inside Lemkin's sense but outside the treaty's.

  Then run it on three stylised cases. First: a campaign against a small linguistic minority in which the death toll is in the low hundreds, but the language is banned from schools and courts, the archives and religious sites are destroyed, and the community's civic and religious leadership is killed or exiled — I expect this one comes back as a no on genocide, and I will tell you in advance that I want to say yes, so I want to see exactly where the procedure forces my hand and what the strongest available formulation is instead. Second: roughly five thousand dead over four months, selected by ethnicity in a mixed province, with no seized operational orders and no speeches by political leaders, only the pattern of killing, slurs recorded on video by soldiers, and a government account of counter-insurgency — give me what the procedure says and, crucially, what specific piece of evidence would move it up a rung. Third: a later phase of a campaign for which a UN-mandated commission of inquiry has already used the word for an earlier phase, in which the current phase kills far fewer people but involves systematic removal of children and the calculated destruction of the water and food infrastructure the group depends on — tell me whether we may inherit someone else's finding or must re-derive it, and what an independent check looks like under a forty-eight hour deadline. Finally, be explicit about what this procedure cannot do: I am particularly interested in whether it can settle the question of whether the word ought to be reserved as a legal term of art at all, how it should handle the competitive-victimhood dynamics where advocates for another group demand symmetrical language, and what it should say when donors or host governments lean on us in either direction.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Director of Documentation and Public-Statements Unit at an International Human Rights Organization (IHRO).
      *   **Task:** Create a written decision procedure (SOP) for determining whether to use the term "genocide" vs. weaker formulations.
      *   **Constraints & Context:**
          *   High frequency (15-20 times/year).
          *   High time pressure (24-48 hours).
          *   Limited staff (2 junior researchers, 1 part-time remote legal adviser).
          *   High stakes (UN proceedings, donor capitals, diaspora lobbying, no walk-backs allowed).
          *   Consistency requirement (accusations of bias last year).
          *   Need for graded vocabulary (not binary).
          *   Need for specific internal definitions (*attribution debt, downstream capture, asymmetry of errors, residual case*).
          *   Need for an audit trail (one-page attribution memo).
          *   Need for a "name now vs. name later" fork.
      *   **Conceptual Structure:** Based on the 1948 Genocide Convention (four groups, specific intent, substantial part) but acknowledging the gap with Lemkin's broader vision (cultural/political destruction).
      *   **Test Cases:**
          1.  Cultural destruction/low death toll (User wants "Yes," Procedure likely says "No" legally).
          2.  Ethnic targeting/mid death toll/no smoking gun (Pattern vs. Intent).
          3.  Later phase/UN precedent/infrastructure destruction (Inheriting findings).
      *   **Limitations:** Must explicitly state what the procedure *cannot* do (legal reservation, competitive victimhood, external pressure).

  2.  **Deconstruct the Conceptual Framework:**

      *   *Legal Standard:* 1948 Convention (Art. II). Specific intent (*dolus specialis*) to destroy, in whole or in part, a national, ethnical, racial, or religious group.
      *   *Lemkin's Vision:* Broader, includes cultural/political destruction.
      *   *The Gap:* The "Residual Case."
      *   *The Vocabulary Ladder:*
          1.  Crimes Against Humanity / War Crimes.
          2.  Genocidal Acts (Acts listed in Art. II without confirmed intent).
          3.  Genocidal Campaign (Pattern suggesting intent, but not legally conclusive).
          4.  Genocide (Legal threshold met).
          5.  Qualified/Provisional (Directional but thin evidence).
      *   *Internal Definitions:* Need to be integrated into the decision logic.

  3.  **Drafting the Procedure (The "Genocide Characterisation Protocol" - GCP):**

      *   *Structure:* Needs to be a flowchart in text form. Step-by-step questions.
      *   *Step 1: Protected Group.* (National, ethnical, racial, religious). If No -> Stop (or move to Residual).
      *   *Step 2: Prohibited Acts.* (Killing, harm, conditions, birth prevention, child transfer).
      *   *Step 3: Specific Intent (The Hard Part).* How to infer intent without a smoking gun? Pattern, scale, systematic nature, statements.
      *   *Step 4: Substantial Part.* Quantitative vs. Qualitative.
      *   *Step 5: The "Lemkin Gap" (Residual Case).* If legal threshold fails but cultural destruction is evident.
      *   *Step 6: Risk Assessment.* Attribution debt, downstream capture, asymmetry of errors.
      *   *Step 7: Decision & Vocabulary.* Selecting the rung on the ladder.
      *   *Step 8: Audit & Review.* The memo and the "Name Later" trigger.

  4.  **Developing the Internal Definitions:**

      *   *Attribution Debt:* Credibility cost.
      *   *Downstream Capture:* Loss of control over the term's usage.
      *   *Asymmetry of Errors:* Under-naming (victim cost) vs. Over-naming (credibility/future victim cost).
      *   *Residual Case:* Lemkin yes, Convention no.

  5.  **Running the Test Cases:**

      *   *Case 1 (Cultural Destruction):*
          *   Group: Linguistic (often falls under Ethnical/National, but tricky).
          *   Acts: Cultural destruction (not in Convention unless linked to child transfer/birth prevention).
          *   Intent: To destroy culture, not necessarily biological existence.
          *   Procedure Result: Likely "Residual Case" or "Crimes Against Humanity (Persecution)."
          *   User Conflict: User wants "Yes." Procedure must show *why* it says "No" legally and offer the strongest alternative ("Cultural Genocide" as a descriptive term, not legal, or "Genocidal Campaign" regarding cultural destruction).
      *   *Case 2 (Pattern Killing):*
          *   Group: Ethnic (Yes).
          *   Acts: Killing (Yes).
          *   Intent: Inferred from pattern/slurs vs. Counter-insurgency claim.
          *   Procedure Result: "Genocidal Campaign" or "Provisional Genocide."
          *   Missing Evidence: Direct orders or policy documents linking high command to specific intent.
      *   *Case 3 (Inheritance/Infrastructure):*
          *   Precedent: UN CoI said "Genocide" earlier.
          *   Current: Lower death toll, but child removal + infrastructure (conditions of life).
          *   Procedure Result: Can inherit *factual findings*, must re-derive *legal conclusion* for current phase. Independent check = verify the *continuity* of intent.
          *   Time limit: Rely on UN CoI public report + verify current infrastructure destruction matches Art II(c).

  6.  **Addressing Limitations:**

      *   Legal vs. Moral: The procedure applies the Convention, not moral philosophy.
      *   Competitive Victimhood: The procedure is case-specific, not comparative.
      *   External Pressure: The procedure insulates against this via the "Asymmetry of Errors" check.

  7.  **Refining the Tone:**

      *   Professional, operational, directive.
      *   Acknowledges the tension between law and advocacy.
      *   Respects the user's constraints (time, staff, no walk-backs).

  8.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is the "Residual Case" handled safely?
      *   *Fix:* Ensure the procedure explicitly warns against using "Genocide" legally for Residual Cases to avoid *downstream capture* by bad faith actors claiming legal immunity. Use "Cultural Destruction" or "Ethnocide" descriptively.
      *   *Critique:* Is the 48-hour window realistic for the Legal Adviser?
      *   *Fix:* The procedure must allow the Director to make the call if Legal is unreachable, based on the "Asymmetry of Errors" calculation, flagged for review.
      *   *Critique:* How to handle the User's desire for Case 1 to be "Yes"?
      *   *Fix:* Be honest. The procedure *must* say "No" on legal genocide. The solution is to maximize the *alternative* vocabulary (e.g., "Genocidal acts regarding cultural destruction") without triggering the legal liability of the word "Genocide" alone. I need to explain *where* the procedure forces the hand (the Protected Group/Intent nexus).

  9.  **Final Polish:** Check against all specific constraints (definitions, memo requirement, graded vocabulary, specific case outcomes). Ensure the "Asymmetry of Errors" is a decision gate, not just a concept.

  *(Self-Correction on Case 1)*: The user says "I want to say yes." If the procedure says "No," does it fail the user? No, the user asked to see *where the procedure forces my hand.* This is a crucial distinction. I must show the friction point.

  *(Self-Correction on Case 3)*: "Inherit someone else's finding." Legally, an NGO cannot simply adopt a UN finding without due diligence. The procedure must require an "Independent Check" even if relying on UN data.

  10. **Final Output Structure:**
      *   Protocol Title & Purpose.
      *   Internal Definitions.
      *   The Vocabulary Ladder.
      *   The Decision Procedure (Steps 1-7).
      *   The Attribution Memo Template.
      *   Application to Three Cases.
      *   Limitations & Exclusions.

