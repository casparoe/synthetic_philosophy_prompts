answer: |-
  # GENOCIDE CHARACTERISATION PROTOCOL (GCP)
  **Version:** 1.0  
  **Authority:** Documentation and Public-Statements Unit  
  **Review Cycle:** Annual or upon major legal precedent shift  
  **Constraint:** No walk-backs permitted post-publication.

  ## 1. INTERNAL DEFINITIONS
  *These terms govern the internal deliberation, not necessarily public text.*

  *   **Attribution Debt:** The credibility capital spent by applying the term "genocide." Every subsequent use of the term by this organisation incurs interest on this debt. If we name Case A and later fail to name Case B with similar evidence, the debt defaults, damaging future efficacy.
  *   **Downstream Capture:** The inevitable loss of control over the term once published. States, courts, funders, and perpetrator propagandists will use our characterisation for ends we do not control (e.g., justifying military intervention, deflecting from other crimes, or dismissing our findings as political).
  *   **Asymmetry of the Two Errors:**
      *   *Error Type I (Under-naming):* Cost falls on current victims (loss of protection, mobilisation, and legal leverage).
      *   *Error Type II (Over-naming):* Cost falls on future victims (devaluation of the term reduces protection for them) and the Organisation (loss of credibility).
      *   *Rule:* In the absence of clear evidence, the presumption favours avoiding Error Type II unless the risk to current victims is immediate and existential.
  *   **The Residual Case:** A campaign that aligns with Lemkin's original conception (destruction of political, social, and cultural continuity) but falls outside the 1948 Convention's legal definition (biological/physical destruction of protected groups).

  ## 2. THE VOCABULARY LADDER
  *Public statements must select the highest rung justified by evidence. Do not skip rungs.*

  1.  **Crimes Against Humanity / War Crimes:** Widespread/systematic attack or violation of IHL, without specific intent to destroy a group.
  2.  **Genocidal Acts:** Acts listed in Article II of the Convention are occurring, but specific intent (*dolus specialis*) is not yet established.
  3.  **Genocidal Campaign:** A pattern of genocidal acts suggesting a coordinated policy, but evidence of intent remains circumstantial or contested.
  4.  **Genocide (Provisional):** Evidence strongly indicates genocide, but independent verification is incomplete. Used only with a defined review trigger.
  5.  **Genocide (Determined):** Legal threshold met. Specific intent established by direct or inferential evidence.
  6.  **Residual Characterisation:** For *Residual Cases* only. Phrasing such as "Cultural Destruction" or "Ethnocide." **Never** use the standalone word "Genocide" for Residual Cases in legal contexts to prevent *Downstream Capture*.

  ## 3. THE DECISION PROCEDURE
  *Time limit: 48 Hours. Personnel: Junior Researchers (Fact), Legal Adviser (Remote Review), Director (Decision).*

  ### STEP 1: The Protected Group (Binary Gate)
  **Question:** Is the targeted group National, Ethnical, Racial, or Religious?
  *   **Evidence Required:** Self-identification, external identification by perpetrators, census data, or historical classification.
  *   **If NO:** Terminate. Proceed to *Residual Case* assessment (Step 6). Do not use "Genocide."
  *   **If YES:** Proceed to Step 2.
  *   **Missing Evidence:** If group status is ambiguous, default to "Ethnical" if perpetrators treat them as such. Record ambiguity in Memo.

  ### STEP 2: The Prohibited Acts (Binary Gate)
  **Question:** Is there evidence of at least one Article II act?
  *   (a) Killing members; (b) Causing serious bodily/mental harm; (c) Deliberately inflicting conditions of life calculated to bring about physical destruction; (d) Imposing measures to prevent births; (e) Forcibly transferring children.
  *   **Evidence Required:** Verified incident reports, medical records, satellite imagery, witness testimony.
  *   **If NO:** Terminate. Characterise as Persecution or Crimes Against Humanity.
  *   **If YES:** Proceed to Step 3.

  ### STEP 3: Specific Intent (*Dolus Specialis*) (The Inference Gate)
  **Question:** Is there evidence the group is targeted *as such* for destruction, not merely as collateral damage or counter-insurgency?
  *   **Direct Evidence:** Orders, speeches, manifests, policy documents.
  *   **Inferential Evidence:** Systematic nature of violence, scale of atrocities, repetition of destructive acts, exclusionary rhetoric, targeting of leadership/symbols.
  *   **The Counter-Narrative Check:** Is there a plausible military necessity argument (e.g., counter-insurgency)? If yes, does the scale of harm vastly exceed the military advantage?
  *   **Decision:**
      *   *Direct Evidence:* Move to Step 4.
      *   *Inferential Only:* Move to Step 4, but cap classification at **Genocidal Campaign** unless Step 4 confirms "Substantial Part."
      *   *Contradicted:* If evidence actively contradicts intent (e.g., efforts to protect the group documented), Terminate.
      *   *Missing Evidence:* If the fog of war prevents knowing intent, apply **Asymmetry of Errors**. If victims face immediate extermination risk, use **Genocide (Provisional)** with a Trigger (Step 7). Otherwise, use **Genocidal Acts**.

  ### STEP 4: Substantial Part (Quantitative/Qualitative Gate)
  **Question:** Is the part of the group targeted "substantial"?
  *   **Quantitative:** Numeric proportion (no fixed threshold, but must be significant).
  *   **Qualitative:** Targeting leadership, specific geographic concentration essential to survival, or a distinct segment.
  *   **Decision:**
      *   If *Insignificant*: Terminate. Characterise as Mass Atrocity.
      *   If *Substantial*: Proceed to Step 5.

  ### STEP 5: The Lemkin Gap (Residual Check)
  **Question:** Does the situation involve destruction of culture/political existence *without* meeting Step 1-4?
  *   **Decision:** If Yes, this is a **Residual Case**.
  *   **Constraint:** You may not use the standalone term "Genocide." You must use "Cultural Destruction" or "Ethnocide."
  *   **Rationale:** Using "Genocide" here incurs **Attribution Debt** we cannot pay if challenged in court, and invites **Downstream Capture** by actors diluting the legal term.

  ### STEP 6: Risk Assessment (The Director's Gate)
  **Question:** Do the risks of *Downstream Capture* or *Attribution Debt* outweigh the benefit of mobilisation?
  *   **Check:** Have we named similar cases differently? (Consistency Check).
  *   **Check:** Are donors/host governments applying pressure? (Ignore per protocol, but record in Memo).
  *   **Decision:** If Consistency Check fails, you must either align with past precedents or write a public justification for the shift.

  ### STEP 7: Name Now vs. Name Later (The Trigger)
  **Decision:**
  *   **Name Now:** If Step 3 (Intent) is met via Direct or Strong Inferential evidence.
  *   **Name Later:** If evidence is directional but thin.
  *   **Requirement:** If "Name Later," set a **Review Trigger** (e.g., "Re-evaluate in 30 days" or "Upon release of UN Commission Report").
  *   **Audit:** Complete the **Attribution Memo** (see below).

  ---

  ## 4. THE ATTRIBUTION MEMO (Template)
  *One page max. Filed internally. Audit-ready.*

  1.  **Case ID:** [Date/Location]
  2.  **Selected Vocabulary:** [e.g., Genocidal Campaign]
  3.  **Rejected Vocabulary:** [e.g., Genocide]
  4.  **Evidence Gap:** [What specific proof was missing? e.g., "No written orders linking Command to Intent"]
  5.  **Asymmetry Calculation:** [Why did we prioritise avoiding Error Type II over Type I? Or vice versa?]
  6.  **Consistency Check:** [Reference to previous comparable cases and how this aligns or diverges]
  7.  **Review Trigger:** [Date or Event for re-evaluation]
  8.  **Sign-off:** [Director Name]

  ---

  ## 5. APPLICATION TO STYLISED CASES

  ### CASE 1: The Cultural Destruction Scenario
  *Facts:* Small linguistic minority. Low hundreds dead. Language banned, archives/religious sites destroyed, leadership exiled/killed.
  *User Preference:* "Yes" (Genocide).

  **Procedure Run:**
  1.  **Protected Group:** Linguistic minorities often qualify as *Ethnical* or *National*. (Pass).
  2.  **Prohibited Acts:** Killing (Yes, low hundreds). Harm (Yes). Conditions of Life (Maybe). *However*, destruction of archives/sites is not an Article II act unless linked to (e) Child Transfer or (c) Conditions of Life.
  3.  **Specific Intent:** Intent is to destroy the *culture*, not necessarily the *biological existence*. The death toll is low relative to population.
  4.  **Substantial Part:** Leadership targeted (Qualitative yes), but biological destruction is low.
  5.  **The Lemkin Gap:** This is a textbook **Residual Case**. It fits Lemkin's vision but fails the 1948 Convention's biological requirement.

  **Procedure Outcome:** **NO on Genocide.**
  **Where it forces your hand:** Step 2 and Step 5. The Convention does not criminalise cultural destruction alone.
  **Strongest Available Formulation:** "Crimes Against Humanity (Persecution)" combined with "Systematic Cultural Erasure."
  **Internal Note:** If you override this to say "Genocide," you incur high **Attribution Debt**. If challenged in court, the organisation loses credibility.
  **Recommendation:** Use the **Residual Case** definition. Public statement: "While this does not meet the strict legal threshold of the 1948 Convention, it constitutes ethnocide and the destruction of the group's social continuity as Lemkin envisioned." This satisfies the moral imperative without triggering the legal liability of the standalone term.

  ### CASE 2: The Pattern Killing Scenario
  *Facts:* 5,000 dead (4 months). Ethnic selection in mixed province. No operational orders. Slurs on video. Govt claims counter-insurgency.

  **Procedure Run:**
  1.  **Protected Group:** Ethnic. (Pass).
  2.  **Prohibited Acts:** Killing. (Pass).
  3.  **Specific Intent:** No direct orders. Inference required.
      *   *Pattern:* 5,000 dead in 4 months is high intensity.
      *   *Selection:* Ethnic targeting in mixed province undermines counter-insurgency claim (if insurgents were mixed, why only one ethnic group dead?).
      *   *Slurs:* Video evidence supports dehumanisation/intent.
  4.  **Substantial Part:** 5,000 may be substantial depending on total population.
  5.  **Risk Assessment:** High risk of **Downstream Capture** by state actors claiming "terrorist purge."

  **Procedure Outcome:** **Genocidal Campaign.**
  **Reasoning:** Inferential intent is strong, but the lack of a "smoking gun" (policy document) creates a vulnerability for *Downstream Capture* by the perpetrator state.
  **Evidence to Move Up a Rung:** You need **one** of the following to reach **Genocide (Determined)**:
      *   A leaked directive categorising the *entire* ethnic group as "enemy combatants" (removes military necessity defence).
      *   Testimony from a defector confirming the objective was demographic reduction, not security.
      *   Evidence that victims were non-combatants (women/elderly) exclusively, negating counter-insurgency logic.
  **Review Trigger:** Re-evaluate upon release of any internal government memos or if death toll exceeds 10% of local group population.

  ### CASE 3: The Inheritance Scenario
  *Facts:* UN CoI declared "Genocide" for Phase 1. Phase 2 has fewer deaths but systematic child removal + water/food infrastructure destruction. 48-hour deadline.

  **Procedure Run:**
  1.  **Inheritance Rule:** You **cannot** simply inherit a legal finding. You must re-derive the conclusion for the *current* period to maintain organisational independence and auditability.
  2.  **Protected Group:** Same as Phase 1. (Pass).
  3.  **Prohibited Acts:** Phase 2 involves (d) Preventing Births/Child Transfer and (c) Conditions of Life. (Pass).
  4.  **Specific Intent:**
      *   *Shortcut:* You may rely on the UN CoI's finding of intent for Phase 1 as *contextual evidence*.
      *   *Independent Check:* Does Phase 2 behaviour show *continuity* of intent?
      *   *Check:* If child removal and infrastructure destruction are systematic, they indicate a shift from "killing" to "dissolving" the group. This confirms continuity of *dolus specialis*.
  5.  **Time Constraint:** Under 48 hours, you cannot re-investigate Phase 1. You cite the UN CoI report as *established fact* regarding the campaign's origin, but your legal finding applies to the *current acts*.

  **Procedure Outcome:** **Genocide (Determined).**
  **Reasoning:** The shift to child transfer and infrastructure destruction (Article II (c) and (e)) is often *stronger* evidence of intent to destroy "in part" than killing alone, as it targets future viability.
  **Independent Check:** Verify that the infrastructure destruction is specific to the group's area (not general war damage) and that child removal is systematic (not sporadic). If these two facts hold, the UN precedent + current acts = Genocide.
  **Memo Note:** Explicitly state: "Relies on UN CoI [Report #] for historical intent context; independent verification conducted on Phase 2 acts."

  ---

  ## 6. LIMITATIONS & EXCLUSIONS
  *This procedure explicitly cannot settle the following:*

  1.  **Legal Reservation:** This procedure does not decide whether the word "genocide" *ought* to be reserved strictly as a legal term of art. It operates on the assumption that public usage carries legal weight. If the Organisation wishes to decouple the moral and legal terms, a separate policy shift is required.
  2.  **Competitive Victimhood:** This procedure is case-specific. It cannot resolve demands from advocates of *other* groups for symmetrical language. If Group A is named and Group B is not, the justification must rest on the *evidence thresholds* in Step 3 and 4, not on political equity. The Memo must record this disparity to manage **Attribution Debt**.
  3.  **External Pressure:** The procedure contains no mechanism to accommodate donor or host-government pressure. Such pressure is to be recorded in the Memo under "Risk Assessment" as a factor *rejected* in the decision. Yielding to such pressure violates the **Asymmetry of Errors** principle (prioritising organisational safety over victim protection).

  ## 7. IMPLEMENTATION NOTE FOR THE DIRECTOR
  You noted a desire to say "Yes" to Case 1 (Cultural Destruction). The Procedure forces a "No" on the legal term to protect the Organisation from **Downstream Capture**.
  **Workaround:** You may publish a companion report titled "The Lemkin Gap: Cultural Genocide in [Region]." In the *report*, you argue for the expansion of the term. In the *press release*, you use the Procedure's "Residual Characterisation." This allows you to advocate for the concept without binding the Organisation to a legal definition it cannot defend in court. This splits the difference between advocacy and liability.
