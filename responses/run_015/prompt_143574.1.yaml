      *   **User's Problem:** The user is in a reading group. A friend objects that if religion regulates lives according to virtue/piety, and the magistrate also restrains vice/outward conduct, this passage seems to give the magistrate warrant to enforce religious morality (supporting established churches/state taxes). The user thinks this isn't Locke's view but can't explain why based on the passage.
