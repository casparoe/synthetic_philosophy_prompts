answer: |-
  The passage does not support a larger role for the state because it explicitly defines true religion by its exclusion of compulsive force, which is the sole instrument available to the civil magistrate for regulating conduct. Locke uses this distinction to argue that while both religion and the state may concern themselves with human behavior, they are separated by their means and ends rather than their subject matter. The passage claims that the business of religion is to regulate lives according to virtue and piety, but it explicitly negates any association with "exercising of compulsive force," "ecclesiastical dominion," or "external pomp." Since the civil magistrate's power consists entirely in the ability to compel outward obedience through penalties and force, he is inherently disqualified from performing the business of true religion as defined here. Your friend's objection assumes that an overlap in the regulation of conduct grants jurisdiction, but Locke argues that because true piety requires inward persuasion and voluntary assent, the magistrate's use of force cannot achieve religious ends even if it succeeds in restraining outward vice. Consequently, the state cannot enforce religious morality without violating the passage's core definition, as employing coercive force to achieve piety transforms the act from religious virtue into mere civil compliance.
