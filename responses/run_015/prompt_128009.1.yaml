prompt: |-
  I have recently been appointed to a municipal infrastructure review board, and we have been tasked with designing a pilot program for resolving technical disputes about public works through prediction markets rather than through conventional expert testimony. The board operates under tight constraints: we must render recommendations within ninety days, none of us are professional economists or forecasters, and any proposal that involves compulsory acquisition of property or intergenerational costs requires a separate democratic sign-off. I need a reusable decision procedure—something my colleagues and I can run in sequence on any incoming proposal—that translates the core logic of governance by prediction markets into practical steps for a non-specialist body.

  The procedure should ask, in a fixed order: how to determine whether the dispute is genuinely about empirical beliefs or disguised value disagreement; what minimal conditions a prediction market must satisfy before its forecast can be treated as advisory rather than binding; where the board must stop and defer to a political process because the resolution depends on distributive judgments; and how to audit for capture by stakeholders with disproportionate capital or expertise. It must include explicit stopping rules—answers that yield an immediate decision not to use the market—and must flag the precise points where judgment cannot be eliminated, especially when the scoring mechanism depends on outcomes observed long after current board members have left office. Please apply the procedure to three cases: a disagreement between hydrologists over which levee design best reduces flood risk over a fifty-year horizon; a proposal to rezone a waterfront district where the technical forecast is uncontested but residents disagree over whether economic growth outweighs community displacement; and a scenario in which the market strongly predicts that a cheap, technically adequate bridge alignment succeeds, but that alignment requires demolishing a registered heritage site that was never priced into the betting conditions. For each case, show where the procedure lands, including the case where its answer conflicts with the board's intuitive preference. Finally, state clearly what the procedure cannot settle—where it is likely to misfire, and which institutional safeguards it still requires outside its own logic.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Member of a municipal infrastructure review board.
      *   **Task:** Design a pilot program/procedure for resolving technical disputes via prediction markets instead of expert testimony.
      *   **Constraints:**
          *   90-day timeline for recommendations.
          *   Board members are non-specialists (not economists/forecasters).
          *   Compulsory acquisition/intergenerational costs require separate democratic sign-off (cannot be decided by the market alone).
          *   Need a *reusable decision procedure* (fixed order questions).
          *   Need explicit *stopping rules* (immediate "no market" decisions).
          *   Need to flag points where *judgment cannot be eliminated* (especially regarding long-term scoring).
      *   **Required Content:**
          *   The Procedure (step-by-step).
          *   Application to Three Cases:
              1.  Hydrologists/Levee Design (50-year horizon).
              2.  Waterfront Rezoning (Growth vs. Displacement).
              3.  Bridge Alignment (Cheap/Technical vs. Heritage Site).
          *   Analysis of Procedure Limits (what it can't settle, safeguards needed).

  2.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* Translate governance by prediction markets into practical steps for non-specialists.
      *   *Structure:* Fixed order, binary or ternary decisions, explicit stopping rules.
      *   *Key Themes from Prompt:* Empirical vs. Value, Advisory vs. Binding, Distributive Judgments, Capture/Audit, Long-term Scoring.

      *   *Step 1: Empirical vs. Value.* Prediction markets work on *what will happen*, not *what should happen*. If the dispute is about values, stop.
      *   *Step 2: Definability & Resolution.* Can the outcome be clearly defined and verified within a reasonable timeframe? If it's too vague or too far in the future (beyond accountability), stop or modify.
      *   *Step 3: Distributive/Political Threshold.* Does the outcome involve property rights or intergenerational costs? If yes, market is advisory only, needs democratic sign-off.
      *   *Step 4: Market Integrity/Capture.* Can we prevent manipulation by deep-pocketed stakeholders? If we can't structure liquidity caps or anonymity, stop.
      *   *Step 5: Scoring/Accountability.* Who verifies the outcome? If the verifiers are the same people who benefit, stop.

      *   *Refining the Steps for the "90-day/Non-specialist" constraint:* Keep language simple. Focus on "Go/No-Go."

  3.  **Applying the Procedure to the Cases:**

      *   *Case 1: Hydrologists/Levee (50-year horizon).*
          *   Step 1 (Empirical?): Yes, flood risk is empirical.
          *   Step 2 (Resolution?): 50 years is too long for a pilot. Board members will be dead. Accountability fails.
          *   *Verdict:* STOP (or requires proxy metric).
          *   *Conflict:* Intuition might say "experts disagree, let the market decide," but the timeline breaks the mechanism.

      *   *Case 2: Waterfront Rezoning (Growth vs. Displacement).*
          *   Step 1 (Empirical?): No. "Outweighs" is a value judgment. Growth is measurable, displacement is measurable, but the *trade-off* is political.
          *   *Verdict:* STOP.
          *   *Conflict:* Board might want to depoliticize it, but the procedure flags it as inherently political.

      *   *Case 3: Bridge/Heritage Site (Cheap vs. Heritage).*
          *   Step 1 (Empirical?): "Technically adequate" is empirical. "Success" needs definition.
          *   Step 2 (Resolution?): Yes, bridge stands/falls.
          *   Step 3 (Distributive/Property?): Yes, demolishing heritage site/property rights. Requires democratic sign-off. Market cannot override this.
          *   Step 4 (Pricing): Heritage value was *not* priced in. Market is incomplete.
          *   *Verdict:* ADVISORY ONLY + DEFER TO VOTE. Market result is irrelevant if the heritage constraint is legal/moral.
          *   *Conflict:* Market says "do it cheap," Board intuition might say "save heritage." Procedure says "Market can't decide this."

  4.  **Drafting the Limitations/Safeguards Section:**

      *   What can't the procedure do?
      *   It can't create truth out of thin air (garbage in, garbage out).
      *   It can't solve the "Oracle Problem" (who judges the outcome).
      *   It can't replace democratic legitimacy for value conflicts.
      *   Safeguards needed: Legal counsel, independent auditors, liquidity caps, clear resolution criteria.

  5.  **Review and Refine (Self-Correction):**

      *   *Tone:* Formal, bureaucratic but clear, suitable for a board memo.
      *   *Constraint Check:* Did I address the 90-day limit? (Yes, by keeping the procedure quick). Did I address the non-specialist aspect? (Yes, by avoiding econ jargon). Did I address the intergenerational/property constraint? (Yes, in Step 3).
      *   *Specific Prompt Requirement:* "Flag the precise points where judgment cannot be eliminated." I need to make sure this is highlighted in the procedure and the analysis.
      *   *Specific Prompt Requirement:* "Show where the procedure lands, including the case where its answer conflicts with the board's intuitive preference." I need to explicitly state where the board *might* want to use the market but the procedure says no.

  6.  **Final Polish:**

      *   Ensure the "Stopping Rules" are bold and clear.
      *   Make sure the distinction between "Advisory" and "Binding" is clear.
      *   Check the Heritage case logic: The prompt says the heritage site was *never priced into the betting conditions*. This is a critical market failure point (incomplete market). The procedure must catch this.

      *(Self-Correction on Case 1)*: A 50-year horizon is the killer. Prediction markets need resolution. If resolution takes 50 years, no one trades. I need to emphasize the need for a *proxy metric* or a *stopping rule* based on time-to-resolution.
      *(Self-Correction on Case 3)*: The prompt says the heritage site was *not priced*. This means the market is optimizing for cost, ignoring the heritage constraint. The procedure must flag "Incomplete Specification of Outcomes."

  7.  **Final Output Structure:**
      *   Introduction (Context).
      *   The Protocol (The 5-Step Procedure).
      *   Case Applications (1, 2, 3).
      *   Limitations & Safeguards.

      *(Drafting the content with these points in mind.)*
answer: |-
  **MEMORANDUM**

  **TO:** Municipal Infrastructure Review Board
  **FROM:** [Your Name/Role]
  **SUBJECT:** Decision Protocol for Prediction Market Pilot Program
  **DATE:** October 26, 2023

  ### I. The Protocol: A Five-Step Gatekeeping Procedure

  This procedure is designed for non-specialists to determine whether a specific infrastructure dispute is suitable for resolution via prediction market. It must be run sequentially. If any step triggers a **STOP**, the market mechanism is rejected for that proposal. If a step triggers **DEFER**, the market may provide advisory data only, subject to external democratic processes.

  **Step 1: The Empirical/Value Filter**
  *Question:* Is the core disagreement about *what will happen* (empirical) or *what should happen* (normative)?
  *   **Test:** Can the outcome be verified by data alone, without requiring a moral or political weighing of competing interests?
  *   **STOP RULE:** If the dispute requires trading off one community group's benefit against another's (e.g., growth vs. displacement), **STOP**. Prediction markets cannot resolve value conflicts.
  *   **PASS:** Proceed to Step 2.

  **Step 2: The Resolution Horizon & Verifiability Check**
  *Question:* Can the outcome be clearly defined and objectively verified within the board's accountability window?
  *   **Test:** Is there a specific date and a specific data source that will confirm the outcome? Is this date within 10 years?
  *   **STOP RULE:** If verification requires >10 years (exceeding political and board accountability), **STOP**. (Note: Proxy metrics may be proposed, but require Step 5 approval).
  *   **PASS:** Proceed to Step 3.

  **Step 3: The Distributive & Property Rights Screen**
  *Question:* Does the implementation of the market's likely outcome involve compulsory acquisition of property, zoning changes, or costs borne by future generations not represented in the market?
  *   **Test:** Does the project require eminent domain, rezoning, or debt servicing beyond the current fiscal cycle?
  *   **DEFER RULE:** If **YES**, the market output is **ADVISORY ONLY**. It cannot trigger action without separate democratic sign-off (voter referendum or council vote).
  *   **PASS:** If **NO**, the market output may be treated as binding technical guidance. Proceed to Step 4.

  **Step 4: The Capture & Liquidity Audit**
  *Question:* Can we structure the market to prevent stakeholders with disproportionate capital from manipulating the price?
  *   **Test:** Can we enforce per-trader liquidity caps and anonymity? Are the stakeholders (contractors, developers) barred from trading?
  *   **STOP RULE:** If stakeholders cannot be effectively walled off from trading, **STOP**. The market will reflect lobbying power, not information.
  *   **PASS:** Proceed to Step 5.

  **Step 5: The Oracle & Scoring Judgment**
  *Question:* Who verifies the outcome, and are they insulated from the result?
  *   **Test:** Is there an independent third party (e.g., a university department, a state auditor) committed to declaring the outcome?
  *   **JUDGMENT FLAG:** This step requires human judgment that cannot be eliminated. Board members must certify that the "Oracle" has no financial or political stake in the outcome. If the outcome verification depends on future Board members, the current Board must legally bind the criteria *now*.
  *   **PASS:** Market may be launched.

  ***

  ### II. Application to Case Studies

  The following analysis applies the Protocol to the three scenarios provided.

  #### Case 1: The Fifty-Year Levee Dispute
  *Scenario:* Hydrologists disagree on which levee design best reduces flood risk over a 50-year horizon.
  *Board Intuition:* Experts are deadlocked; a market might aggregate independent analysis to find the superior design.

  *   **Step 1 (Empirical/Value):** **PASS.** Flood risk is an empirical metric (water height, breach frequency).
  *   **Step 2 (Resolution Horizon):** **STOP.**
      *   *Reasoning:* A 50-year horizon exceeds the accountability window. Current board members and traders will be deceased before the market resolves. This creates a "moral hazard" where traders bet on short-term construction profits rather than long-term safety, knowing they won't be around to pay the penalty if the levee fails.
      *   *Procedure Outcome:* **REJECT MARKET.**
      *   *Conflict:* The Board's intuition is to use the market to break the expert deadlock. The procedure overrides this because the time horizon breaks the incentive alignment essential to prediction markets. To proceed, the Board would need to define a *proxy metric* (e.g., "stress test simulation results by 2025"), but that shifts the dispute to the validity of the simulation, not the actual flood risk.

  #### Case 2: The Waterfront Rezoning
  *Scenario:* Technical forecast is uncontested; residents disagree over whether economic growth outweighs community displacement.
  *Board Intuition:* Use a market to quantify the "net benefit" to see if the growth is real.

  *   **Step 1 (Empirical/Value):** **STOP.**
      *   *Reasoning:* The dispute is not about whether growth *will* happen (technical forecast is uncontested). The dispute is whether that growth *outweighs* displacement. This is a normative, distributive judgment.
      *   *Procedure Outcome:* **REJECT MARKET.**
      *   *Conflict:* The Board may wish to use the market to depoliticize the decision. The procedure flags this immediately: a market cannot price "community cohesion" or "displacement suffering" unless those are explicitly monetized, which is itself a political act. This requires a political vote, not a forecast.

  #### Case 3: The Heritage Site Bridge
  *Scenario:* Market predicts a cheap, technically adequate bridge alignment succeeds. However, this alignment requires demolishing a registered heritage site not priced into the betting conditions.
  *Board Intuition:* The market says the cheap bridge works; we should save money and build it.

  *   **Step 1 (Empirical/Value):** **PASS.** (Technical adequacy is empirical).
  *   **Step 2 (Resolution Horizon):** **PASS.** (Bridge completion is verifiable).
  *   **Step 3 (Distributive/Property):** **DEFER.**
      *   *Reasoning:* Demolishing a heritage site involves property rights and cultural capital. Under municipal constraints, this requires separate democratic sign-off. The market cannot override heritage statutes.
  *   **Step 4 (Capture):** **PASS** (Assuming stakeholders are barred).
  *   **Step 5 (Oracle/Scoring):** **STOP/FLAG.**
      *   *Reasoning:* The prompt states the heritage site was *never priced into the betting conditions*. This is an "Incomplete Market" failure. The market is optimizing for Cost + Technical Success, ignoring Heritage Loss.
      *   *Procedure Outcome:* **REJECT MARKET AS DECISION TOOL.** The market result is misleading because it excludes a critical constraint.
      *   *Conflict:* The Board's intuitive preference might be to follow the market's efficiency (cheap bridge). The procedure forces the Board to acknowledge that the market is blind to the heritage constraint. The market recommendation must be discarded or heavily weighted against, as it fails Step 5 (the scoring mechanism does not reflect the full public cost).

  ***

  ### III. Limitations and Required Safeguards

  This procedure is a filter, not a solution. It identifies where prediction markets are dangerous or useless, but it cannot eliminate the need for traditional governance safeguards.

  **1. What the Procedure Cannot Settle**
  *   **The "Oracle" Problem:** Step 5 requires the Board to select who judges the outcome. The procedure cannot automate this. If the Board selects a biased Oracle, the market is corrupted. This requires judgment that cannot be proceduralized.
  *   **Incomplete Markets:** As seen in Case 3, if the Board fails to specify all relevant costs (heritage, environmental, social) in the market rules, the market will optimize for what is measured, not what matters. The procedure flags this, but cannot fix it without external input.
  *   **Intergenerational Ethics:** The procedure stops disputes with >10 year horizons (Step 2). This protects accountability but abdicates responsibility for long-term infrastructure. It solves the Board's risk, not the city's risk.

  **2. Required Institutional Safeguards (Outside the Logic)**
  To operate this pilot within the 90-day constraint and legal framework, the Board must establish the following *before* applying the procedure:
  *   **Legal Firewall:** Counsel must draft terms ensuring that market outcomes do not inadvertently create binding contracts that violate procurement law or heritage statutes.
  *   **Liquidity Caps:** A technical administrator must be hired to enforce per-trader limits (Step 4) to prevent wealthy developers from "buying" a forecast.
  *   **Escrowed Resolution Funds:** Money to pay out winning bets must be held in trust by a third party, not the Board, to prevent the appearance that the Board benefits from specific outcomes.
  *   **Sunset Clause:** The pilot must expire automatically in 90 days. Any market unresolved by then defaults to conventional expert testimony to prevent the "zombie market" problem where funds are locked indefinitely.

  **Conclusion**
  This procedure prioritizes *legitimacy* over *efficiency*. It will likely reject more proposals than it accepts (as seen in the three cases). This is a feature, not a bug. It ensures that prediction markets are used only where they add information (empirical disputes), not where they usurp democracy (value disputes) or bypass law (property rights).
