prompt: |-
  I run a Saturday-afternoon workshop series for a university forecasting and decision-making reading group: about sixteen people, mostly graduate students in statistics, computer science and economics, with a few philosophers. They are comfortable with expected value and with compound interest, but almost none of them have heard of the Kelly criterion or thought about growth rates. I have two hours with a short break, a whiteboard, a projector, index cards, dice and several decks of cards, and everyone has a phone with a calculator. Real money is out of the question, but I can put a genuine small donation behind the outcome and I can offer one modest individual prize.

  What I want designed is a single runnable session in which they do the betting rather than hear about it: a game with written stake decisions, rounds resolved by an explicit randomizer that is visibly not me, and a debrief afterwards. The thing I most want them to feel, before anyone names it, is that maximizing expected bankroll and maximizing the growth rate of the bankroll come apart on a repeated multiplicative bet: the expected-value maximizer's fortune is real on paper and nonexistent in almost every actual path, because the mean is carried by a vanishing sliver of lucky trajectories. I would also like them to feel that overbetting is punished asymmetrically — that growth falls off slowly on the over-side and then turns negative once you go past about twice the growth-optimal stake — and that the recommendation is not simply "be timid," since some bets legitimately call for staking most of what you have. Nothing with a formula on the board for the first forty minutes, and no reading list: I want the activity, not sources.

  The markets I was going to use, in some order you should choose, are: a 60/40 bet in your favour at even money; a 20% chance paying 5 to 1; an even-chance bet paying only 0.9 to 1; and a 90% chance at even money. I believe the growth-maximizing fractions of current bankroll for these are respectively 20%, 4%, nothing, and 80% — tell me if I have that wrong, tell me what each market earns its place in the sequence for, whether to give anyone these numbers and when, and whether the last block should instead offer two markets at once with participants free to split their stake, in which case say whether those two should be independent or deliberately correlated and what that version teaches that the single-market version cannot.

  On incentives, I am considering making the donation depend on the geometric mean of everyone's final bankroll while a separate leaderboard ranks people by final bankroll and the top scorer picks the charity. Tell me whether that tension is the best part of the design or a distraction, whether the geometric-mean rule should be announced at the start or revealed at the end, and roughly how many rounds the game needs and how fast each round must run for the growth-rate difference to be visible over luck — and if you think no feasible number of rounds makes it visible, say so plainly and tell me what the activity can accomplish instead. I am also toying with a withdrawal mechanic in which players must periodically spend a fraction of their bankroll on something consumed and scored separately; advise whether that clarifies the structure or muddies it, and where it would go.

  Please give me the rules and materials, a timeline with minute marks including what I say out loud, the debrief mapped onto specific moments that will have occurred, and an honest account of what will go wrong: the player who stakes everything early and wins, the confusion between betting a fixed fraction and betting a fixed amount, the rounds where the right action is to abstain and people bet from boredom, and the participant who notices the leaderboard is separable from the donation and starts playing for the leaderboard alone. Then tell me what the game cannot reproduce and I must supply in words: the asymptotic character of the growth-rate argument, the assumption that the probabilities are known, and the fact that a fixed target or a lumpy, non-repeatable opportunity calls for something other than growth-rate maximization. Finally, if there is a version in which the stated probabilities are slightly wrong so that full-Kelly staking does worse than a deliberately shrunken fraction, describe it and tell me whether it requires deceiving the room; if the same lesson can be taught without deception, use that instead. Include one last round or one closing question that would let me tell whether the idea landed or whether they have merely learned a formula.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Audience:** ~16 grad students (stats, CS, econ, philosophy). Comfortable with EV and compound interest. Unfamiliar with Kelly/growth rates.
      *   **Goal:** Experiential learning. They must *feel* the divergence between EV maximization and Growth Rate maximization *before* seeing formulas. Feel the penalty of overbetting. Understand that "timidity" isn't always the answer (sometimes bet big).
      *   **Constraints:** 2 hours (with break). Whiteboard, projector, index cards, dice, cards, phones. No real money (small donation + 1 prize). No formulas for first 40 mins. No reading list.
      *   **Specific Markets Provided:**
          1.  60/40 @ even money (Kelly = 20%)
          2.  20% chance @ 5-to-1 (Kelly = 4%? Need to check math)
          3.  50/50 chance @ 0.9-to-1 (Kelly = 0%? Need to check math)
          4.  90/10 @ even money (Kelly = 80%? Need to check math)
      *   **Incentive Structure:** Geometric mean of group bankroll -> Donation. Individual leaderboard -> Prize/Charity choice. Tension between cooperation (geo mean) and competition (leaderboard).
      *   **Mechanics:** Written stake decisions, explicit randomizer (not facilitator), debrief.
      *   **Specific Questions to Answer:**
          *   Verify Kelly fractions.
          *   Sequence of markets.
          *   To give numbers or not? When?
          *   Single vs. Dual market in last block?
          *   Incentive tension: Best part or distraction? Announce geo-mean rule when?
          *   Number of rounds/speed for visibility?
          *   Withdrawal mechanic: Clarify or muddy?
          *   Rules, Materials, Timeline (minute-by-minute), Script snippets.
          *   Debrief mapping.
          *   "What will go wrong" (Risk analysis).
          *   "What the game cannot reproduce" (Theoretical gaps).
          *   Parameter uncertainty version (deception vs. honesty).
          *   Closing check for understanding.

  2.  **Verify Kelly Fractions:**

      *   Formula: $f^* = \frac{p(b+1) - 1}{b}$ where $b$ is net odds received (e.g., "even money" means $b=1$). Or simpler: $f^* = p - \frac{q}{b}$.
      *   Market 1: 60% win, even money ($b=1$). $f^* = 0.6 - 0.4/1 = 0.2$. **Correct (20%).**
      *   Market 2: 20% win, 5-to-1 ($b=5$). $f^* = 0.2 - 0.8/5 = 0.2 - 0.16 = 0.04$. **Correct (4%).**
      *   Market 3: 50% win, 0.9-to-1 ($b=0.9$). $f^* = 0.5 - 0.5/0.9 = 0.5 - 0.555... < 0$. **Correct (0% / Do not bet).** EV is negative ($0.5 \times 0.9 - 0.5 \times 1 = -0.05$).
      *   Market 4: 90% win, even money ($b=1$). $f^* = 0.9 - 0.1/1 = 0.8$. **Correct (80%).**

  3.  **Design the Incentive Structure:**

      *   *Tension:* Geometric mean donation vs. Individual Prize.
      *   *Analysis:* If the goal is to teach *individual* growth optimization, the group geometric mean is a bit of a distractor unless it forces cooperation. However, the prompt asks specifically about this tension.
      *   *Decision:* The geometric mean donation is a clever way to align the room against "ruin" without needing real money. If one person goes bust, the geo mean drops significantly. But for *individual* learning, the individual leaderboard is key.
      *   *Recommendation:* Keep the individual prize for the highest final bankroll. Make the donation contingent on the *median* or *geometric mean* of the group to discourage everyone from going all-in (which would maximize EV but ruin the geo mean).
      *   *Announcement:* Announce *both* at the start. If you hide the geo-mean rule, they will feel betrayed. The tension *is* the lesson: EV maximizers (All-in) help the individual prize chance (low prob, high payoff) but hurt the group geo-mean. Growth maximizers help the geo-mean.
      *   *Withdrawal Mechanic:* This simulates consumption/utility. It prevents "infinite growth" abstraction. It clarifies that bankroll isn't just score; it's fuel. *Recommendation:* Include it, but keep it simple. 10% tax every 5 rounds.

  4.  **Sequence of Markets:**

      *   Goal: Show EV vs. Growth divergence. Show Overbetting penalty. Show "Don't Bet". Show "Bet Big".
      *   Order:
          1.  **60/40 Even Money:** The classic. Good intro. Kelly 20%.
          2.  **90/10 Even Money:** High prob. Kelly 80%. Teaches "don't be timid."
          3.  **50/50 @ 0.9:** Negative EV. Kelly 0%. Teaches discipline/abstention.
          4.  **20% @ 5-to-1:** Low prob, high payout. Kelly 4%. Teaches small stakes on longshots.
      *   *Rounds per Market:* Need enough rounds for variance to settle but not so many it drags. 5-6 rounds per market. Total ~20-25 rounds.
      *   *Dual Market?* The prompt asks about the last block. Offering two markets (e.g., Market 1 + Market 4) allows portfolio allocation. *Decision:* Keep it single market for simplicity in a 2-hour session. Portfolio optimization adds cognitive load that might obscure the core Kelly lesson. Stick to single asset repeated.

  5.  **Visibility of Growth Rate Difference:**

      *   *Problem:* In 20 rounds, luck dominates. The "All-In" player might win. The "Half-Kelly" player might lose.
      *   *Solution:* You cannot guarantee the *winner* is the Kelly player in a single realization. You must rely on the *distribution* in the debrief.
      *   *Fix:* Use the "Ghost Player" concept on the whiteboard during debrief. Plot the theoretical growth curves vs. the actual winners.
      *   *Rounds:* 5 rounds per market is too few. 10 rounds per market is too many (40 rounds total). Let's do 4 Markets x 5 Rounds = 20 Rounds. Plus 5 "Free Choice" rounds at the end? No, keep it structured.
      *   *Speed:* 3 minutes per round (decide, roll, calculate). 20 rounds = 60 mins. Plus setup/break/debrief. Fits 2 hours.
      *   *Visibility:* It won't be perfectly visible in the *winner*. It will be visible in the *survival rate* and the *median*. The EV maximizer (100% stake) will likely go bust or have huge variance. The Kelly maximizer will be top quartile consistently.
      *   *Correction:* To make the lesson land, I need to ensure the "All-In" strategy is visibly punished *on average* even if one lucky soul wins. I will track the "Group Geo Mean" on the projector live. If everyone goes all-in on the 60/40 bet, the geo-mean will crash after a few losses.

  6.  **Deception/Parameter Uncertainty:**

      *   *Prompt:* "If there is a version in which the stated probabilities are slightly wrong..."
      *   *Advice:* Do not deceive. It undermines trust and complicates the math debrief. Instead, address *parameter uncertainty* in the verbal debrief. "What if you thought it was 60% but it was 55%?" This teaches "Fractional Kelly" without lying during the game.

  7.  **Drafting the Plan:**

      *   **Materials:** Printed "Bankroll Sheets" (log scale?), Dice (d10 for probabilities), Projector (spreadsheet for live tracking).
      *   **Timeline:**
          *   00-15: Intro, Rules, Incentives.
          *   15-75: The Game (4 Blocks of 5 rounds + Break).
          *   75-90: Break.
          *   90-120: Debrief & Theory.
      *   **Incentives:** Announce both. Individual Prize (Max Bankroll). Group Donation (Geo Mean of Final Bankrolls).
      *   **Withdrawal:** Yes, "Tuition Tax" every 5 rounds (10% of current bankroll). This forces compounding logic.

  8.  **Addressing Specific "What Will Go Wrong" Scenarios:**

      *   *All-in Winner:* Acknowledge this. "You got lucky. Would you do it again?"
      *   *Fixed Amount vs. Fixed Fraction:* Enforce Fixed Fraction in rules. "You must bet X% of *current* bankroll."
      *   *Boredom Betting on Neg EV:* Monitor. Call it out.
      *   *Leaderboard Gaminer:* If someone ignores the geo-mean donation to chase the prize, that's actually rational for them. Use this to discuss social vs. individual utility.

  9.  **Refining the "Feel":**

      *   To make them *feel* the divergence, the "All-In" strategy needs to be available and tempting.
      *   I need to explicitly allow them to bet 100%.
      *   I need the "0.9 to 1" market to be a trap. Many will bet because "it's 50/50".
      *   I need the "90% even money" to encourage large bets.

  10. **Final Review against Constraints:**

      *   No formulas first 40 mins? Yes.
      *   Runnable session? Yes.
      *   Incentives addressed? Yes.
      *   Timeline specific? Yes.
      *   Honest account of limitations? Yes.

  11. **Self-Correction on Geo-Mean Incentive:**
      *   If the donation depends on the Geo Mean, players might collude or feel the individual prize is impossible if they play "safe".
      *   *Better approach:* The Donation is fixed *unless* the Group Geo Mean drops below Starting Bankroll. Or, simpler: The Donation is proportional to the Group Geo Mean.
      *   *Best approach for tension:* Keep it as proposed. Individual Prize = Max Bankroll. Donation = Function of Geo Mean. This creates a Prisoner's Dilemma-esque tension. EV maximizers hurt the donation. Kelly maximizers help it.
      *   *Announcement:* Announce at start. It sets the "social good" vs "personal glory" frame which mirrors "EV" vs "Growth".

  12. **Closing Question:**
      *   Don't ask "What is the formula?"
      *   Ask: "If you could play this again for real money, would you change your stake %? Why?"

  13. **Wait, one calculation check:**
      *   20 rounds might not be enough for the Law of Large Numbers to crush the All-In players.
      *   *Mitigation:* In the debrief, run a simulation on the projector. "Let's see what happens if we run this 10,000 times." This bridges the gap between the single realization (game) and the asymptotic truth (theory).

  14. **Final Polish:** Ensure the tone is facilitative, not lecturing. Ensure the randomizer is transparent (e.g., rolling a d10 on camera or having a student roll).

  *(Self-Correction during drafting)*: I initially thought about 4 markets x 5 rounds. That's 20 rounds. With 16 people, calculating bankrolls manually takes time.
  *Optimization:* Use a shared spreadsheet on the projector where they call out their *stakes*, I input, the randomizer resolves, I update. No, that's too slow for 16 people.
  *Better:* They calculate their own. I provide the random outcome (e.g., roll a d20 or d100 on projector). They update their own sheets. I spot check.
  *Even Better:* "Market Rounds." Everyone faces the same sequence. I generate the sequence of 5 wins/losses in advance (sealed) or roll live. Live rolling is more trusting.
  *Time:* 5 rounds x 3 mins = 15 mins per block. 4 blocks = 60 mins. Plus instructions + break + debrief. It's tight but doable. I will reduce to 4 rounds per market to ensure debrief time. 16 betting rounds total.

  *Wait, the prompt asks about the last block offering two markets.*
  I decided against it earlier, but let's reconsider. If the goal is to teach *growth rate*, single asset is clearer. Portfolio theory is a different lesson. I will advise *against* the two-market split to preserve cognitive bandwidth for the core Kelly insight.

  *Withdrawal Mechanic:* 10% every 5 rounds. This is crucial. It stops the "I'll just bet small and never grow" strategy. It forces compounding.

  *Let's write it.*
answer: |-
  Here is a complete design for your session. It is built to maximize experiential friction: the rules are simple enough to start immediately, but the incentives and mechanics are tuned to make the divergence between Expected Value (EV) and Growth Rate palpable before you ever write an equation.

  ### 1. Verification of Your Markets & Strategy

  Your Kelly fractions are **correct**.
  *   **60/40 @ Even:** $f^* = 0.6 - 0.4 = 20\%$. (The Standard)
  *   **20% @ 5-to-1:** $f^* = 0.2 - (0.8/5) = 4\%$. (The Longshot)
  *   **50/50 @ 0.9-to-1:** $f^* < 0$. (The Trap / Negative EV)
  *   **90/10 @ Even:** $f^* = 0.9 - 0.1 = 80\%$. (The "Be Bold" Case)

  **Sequence Recommendation:**
  1.  **60/40 Even:** Establishes the baseline.
  2.  **90/10 Even:** Shatters the "always bet small" heuristic.
  3.  **50/50 @ 0.9:** Teaches discipline (the optimal bet is zero).
  4.  **20% @ 5-to-1:** Teaches sizing on low-probability edges.

  **Single vs. Dual Market in Last Block:**
  Do **not** offer two markets to split stakes in this session.
  *   **Why:** Portfolio allocation (correlation/covariance) is a separate cognitive load. You want them focusing entirely on the relationship between *edge*, *odds*, and *fraction*. Adding a second asset invites confusion about diversification rather than growth optimization.
  *   **What it teaches:** A single-market version teaches *leverage*. A dual-market version teaches *correlation*. You need them to feel leverage first.

  **Incentive Structure:**
  *   **The Tension:** This is the **best part of the design**. Do not remove it.
      *   **Individual Prize:** Goes to the single highest final bankroll. (Incentivizes high variance/EV maximization).
      *   **Group Donation:** Proportional to the **Geometric Mean** of all final bankrolls. (Incentivizes survival and steady growth).
  *   **Announcement:** Announce **both at the start**. If you reveal the Geometric Mean rule at the end, players who went "All-In" will feel the game was rigged against their valid strategy. The tension *is* the lesson: EV maximization helps the individual leaderboard (rarely) but destroys the group geometric mean. Kelly maximization protects the group mean while keeping the individual competitive.
  *   **Withdrawal Mechanic:** **Include it.** Call it a "Consumption Tax." Every 5 rounds, players must write down 10% of their current bankroll as "spent." It cannot be bet. This prevents the "I'll just bet 1% and never lose" strategy and forces them to care about the *rate* of growth, not just the final number.

  **Rounds & Visibility:**
  *   **Total Rounds:** 20 betting rounds (4 blocks of 5).
  *   **Visibility:** 20 rounds is **not enough** for the Law of Large Numbers to guarantee the Kelly player beats the All-In player. One All-In player will likely get lucky and win the individual prize.
  *   **The Fix:** You must explicitly plan for the "Lucky All-In Winner" in the debrief. The lesson is not "Kelly always wins the tournament." The lesson is "Kelly creates the most reliable path; All-In is a lottery ticket." You will use the projector in the debrief to simulate 10,000 runs to show what *would* have happened asymptotically.

  ---

  ### 2. Materials & Setup

  *   **Bankroll Sheets:** 16 index cards or printed sheets. Columns: `Round`, `Start Bank`, `Stake %`, `Stake $`, `Outcome (W/L)`, `End Bank`. Start Bank: $1,000 (fictional).
  *   **Randomizer:** A large 20-sided die (d20) or a projected random number generator (e.g., random.org) visible to all. Do not roll it yourself; ask a different volunteer each block.
  *   **Projector:** A simple spreadsheet open with columns for `Player ID`, `Final Bankroll`.
  *   **Prize:** One modest prize (book, gift card).
  *   **Donation:** A pre-selected charity.

  ---

  ### 3. Timeline & Script (120 Minutes)

  #### **00:00 – 00:15: Introduction & Rules**
  *   **Action:** Hand out Bankroll Sheets. Explain the two incentives clearly.
  *   **Script:** "You start with $1,000. Over the next hour, you will face four different betting markets. In each round, you decide what **percentage** of your *current* bankroll to wager. You must write down your stake before the die is rolled.
      *   **Prize 1:** The person with the most money at the end wins [Prize].
      *   **Prize 2:** I will make a donation to [Charity]. The size of the donation depends on the **Geometric Mean** of everyone's final bankroll. If half the room goes bust, the donation shrinks to almost nothing.
      *   **Tax:** After Round 5, 10, and 15, you must pay a 10% 'Consumption Tax' on your current bankroll. You cannot bet this money."
  *   **Constraint:** "No formulas on the board yet. Use your intuition and your phone calculators."

  #### **00:15 – 00:35: Block 1 (60/40 @ Even Money)**
  *   **Market:** Win 60%, Lose 40%. Payout 1:1.
  *   **Rounds:** 5.
  *   **Randomizer:** Roll d10. 1-6 = Win, 7-10 = Lose.
  *   **Facilitator Note:** Watch for players betting 100%. Say nothing yet. Watch for players betting 0%.
  *   **Tax:** At end of Round 5, enforce 10% tax.

  #### **00:35 – 00:55: Block 2 (90/10 @ Even Money)**
  *   **Market:** Win 90%, Lose 10%. Payout 1:1.
  *   **Rounds:** 5.
  *   **Randomizer:** Roll d10. 1-9 = Win, 10 = Lose.
  *   **Facilitator Note:** This is where timid players (betting 5%) will feel regret watching others bet 50%+ and win. This sets up the "Kelly isn't just about safety" lesson.
  *   **Tax:** At end of Round 10, enforce 10% tax.

  #### **00:55 – 01:05: Break**
  *   Let them talk. Do not answer strategy questions.

  #### **01:05 – 01:25: Block 3 (50/50 @ 0.9 to 1)**
  *   **Market:** Win 50%, Lose 50%. Payout 0.9:1 (Bet $10, Win $9).
  *   **Rounds:** 5.
  *   **Randomizer:** Roll d20. 1-10 = Win, 11-20 = Lose.
  *   **Facilitator Note:** This is a Negative EV bet ($0.5 \times 0.9 - 0.5 \times 1 = -0.05$). Many will bet because "it's 50/50." This is the trap.
  *   **Tax:** At end of Round 15, enforce 10% tax.

  #### **01:25 – 01:40: Block 4 (20% @ 5-to-1)**
  *   **Market:** Win 20%, Lose 80%. Payout 5:1.
  *   **Rounds:** 5.
  *   **Randomizer:** Roll d20. 1-4 = Win, 5-20 = Lose.
  *   **Facilitator Note:** Kelly says 4%. EV maximizers might bet 20%+. Watch the variance.
  *   **End Game:** Collect final bankrolls. Input into projector spreadsheet.

  #### **01:40 – 02:00: Debrief & Theory**
  *   **Action:** Calculate the Winner (Individual) and the Donation Size (Group Geo Mean).
  *   **Scripting:** See Debrief Map below.

  ---

  ### 4. Debrief Map (Connecting Experience to Theory)

  Do not start with the Kelly Formula. Start with their outcomes.

  **Moment 1: The Lucky All-In Player (01:40–01:50)**
  *   *Likely Outcome:* One player who bet 100% or near-100% in Block 1 or 2 likely has the highest bankroll (if they survived the variance).
  *   *Say:* "Congratulations to [Name]. You maximized Expected Value. You took the path with the highest mathematical average return. But look at the room. [Point to 3-4 people with <$100]. You shared the same edge, but you are broke. If we ran this 100 times, [Name] would go bust 90 times. You didn't find a strategy; you bought a lottery ticket."
  *   *Concept:* **Ergodicity.** The ensemble average (EV) is not the time average (Growth).

  **Moment 2: The "Timid" Player in Block 2 (01:50–01:55)**
  *   *Likely Outcome:* Someone who bet 5% in the 90% win-rate block.
  *   *Say:* "In Block 2, the edge was massive. Some of you bet 10% or 20%. Others bet 2%. The 2% bettors feel safe, but they lost the race. Growth optimization is not about fear. It is about matching the stake to the edge. Sometimes the right move is 80%."
  *   *Concept:* **Kelly is not 'Be Safe'.** It is 'Be Optimal'.

  **Moment 3: The Block 3 Trap (01:55–02:00)**
  *   *Likely Outcome:* Many people lost money here.
  *   *Say:* "Who bet in Block 3? Why?" (They will say "It was 50/50"). "It was 50/50, but the payout was less than 1:1. The Expected Value was negative. The Growth Optimal stake was **zero**. Any bet you made here actively destroyed your future capacity."
  *   *Concept:* **Negative EV = Zero Stake.**

  **Moment 4: The Formula (Last 5 Minutes)**
  *   *Action:* Now write $f^* = p - \frac{q}{b}$ on the board.
  *   *Say:* "This is the Kelly Criterion. It maximizes the geometric growth rate. It is the bridge between the EV maximizer (who goes bust) and the miser (who grows too slow). It solves for the fraction that keeps you in the game forever."

  ---

  ### 5. Honest Account: What Will Go Wrong

  1.  **The All-In Winner:** As noted, someone betting 100% in Block 1 or 2 might win the individual prize.
      *   *Mitigation:* In the debrief, ask them: "Would you make that same bet again for your life savings?" Usually, they admit no. This separates *outcome* from *process*.
  2.  **Fixed Amount vs. Fixed Fraction:** Players will forget to recalculate their stake based on their *new* bankroll each round. They will bet $100 every time instead of 10%.
      *   *Mitigation:* Walk around during Round 2 of each block. Check sheets. "Remember, 10% of your *current* total, not the starting $1,000."
  3.  **Boredom Betting on Neg EV:** In Block 3 (Negative EV), players will bet just to "do something."
      *   *Mitigation:* Highlight this in the debrief. "Boredom is a costly luxury in investing."
  4.  **The Leaderboard Gamer:** One participant will realize the Geometric Mean donation is public goods problem and ignore it to chase the Individual Prize.
      *   *Mitigation:* This is actually a success. It proves that Individual EV maximization conflicts with Group Stability. Point this out: "This tension is exactly why financial systems need regulation. Individual rationality (leverage) creates systemic risk (bust)."

  ---

  ### 6. What The Game Cannot Reproduce (You Must Supply)

  You must verbally supply these three caveats in the final 5 minutes, as the game mechanics cannot show them:

  1.  **Asymptotics:** "20 rounds is a blink of an eye. Kelly works over thousands of bets. In the short run, luck dominates. We use Kelly not to win today, but to ensure we are still playing next year."
  2.  **Known Probabilities:** "In this game, I told you the odds were 60/40. In reality, you never know the true edge. If you think it's 60% but it's actually 55%, Full Kelly will kill you. This is why practitioners use 'Fractional Kelly' (e.g., half-Kelly) to buffer against estimation error."
  3.  **Non-Repeatable Opportunities:** "Kelly assumes you can keep betting this edge forever. If this is a one-time bet (like a lawsuit settlement), and you have a specific financial goal (need $50k to buy a house), Kelly is not the right tool. Goal-based betting differs from growth-based betting."

  ---

  ### 7. Parameter Uncertainty & Deception

  **Do not deceive the room.**
  Do not tell them the odds are 60/40 if they are actually 55/45.
  *   **Why:** If they find out (or suspect), you lose credibility. Also, if the "Lucky All-In" player wins, they will attribute it to skill/bravery, not parameter error.
  *   **Alternative:** In the debrief, run a "What If" scenario. "Imagine I lied. Imagine the true odds were 55%. Show of hands, who bet more than 10%?" Then explain that *Parameter Uncertainty* is the strongest argument for **Fractional Kelly**. "Because we are never sure of the edge, we shave the stake. That is not timidity; that is risk management against model error."

  ---

  ### 8. The Closing Check

  Do not ask: "What is the Kelly formula?"
  Do not ask: "Did you like the game?"

  **Ask this:**
  "Imagine I offer you this exact 60/40 bet again next week. But there is a catch: if your bankroll ever drops below $500, you are expelled from the program and lose your stipend.
  **Who changes their stake percentage from today? Show of hands.**"

  *   **If they learned:** They will lower their stake (below 20%) to reduce "Risk of Ruin" relative to the barrier, or they will articulate that the utility function changed.
  *   **If they didn't learn:** They will say "No, 20% is optimal."
  *   **The Point:** This forces them to realize that "Optimal" depends on the *consequences of the path*, not just the math of the edge. It cements the idea that Growth Rate is about *survival* as much as *profit*.
