answer: |-
  You have identified a real and specific rhetorical maneuver, and your intuition is sharper than the friend who dropped the term "constituent power" without explaining it. There is no single English word that captures the entire sequence (backdating + revealing + freezing + asymmetry), but political theory has a precise framework for exactly what you are describing.

  The pattern you are hitting is a **conflation of two different types of political power**, weaponized by **populist anti-pluralism**.

  Here is the carving you asked for: the established concepts, the name you can use, and the edges that distinguish legitimate uses from bogus ones.

  ### 1. The Established Concepts

  Your friend was actually pointing at the right engine, but they gave you the technical manual instead of explaining how the car drives.

  **Constituent Power vs. Constituted Power**
  This is the critical distinction.
  *   **Constituent Power:** The raw power of "the people" to create a political system from scratch (e.g., a revolution, writing a new constitution). This power exists *before* the rules. It is unlimited.
  *   **Constituted Power:** The power that operates *within* the rules (e.g., a parliament passing a law, a referendum held under existing election acts). This power is limited and temporary.

  **The Maneuver:** The pattern you describe treats a *constituted* event (a standard referendum or election) as if it were an act of *constituent* power.
  *   **Why this explains the "Backdating":** Constituent power is always there, simmering under the surface. By claiming the vote was an act of constituent power, the winners argue the will existed before the vote (it was just suppressed).
  *   **Why this explains the "Freezing":** Constituent power creates the rules; it isn't bound by them. By framing the vote this way, they argue that normal checks (courts, future votes) are illegitimate because you cannot use "normal rules" to stop "the people's raw will."

  **Populist Anti-Pluralism**
  Political theorist Jan-Werner Müller defines populism not by *what* policies they want, but by this specific claim: that they alone represent the *real* people.
  *   **Why this explains the "Asymmetry":** If you lose, it proves you weren't representing the "real people" (hence the vote was flawed/snapshot). If we win, we *are* the people. Therefore, our will is infallible, and your opposition is not "loyal opposition" but "enemy obstruction."

  ### 2. The Name

  Since there is no single dictionary term for this specific temporal trick, the most precise label used in political science is **"The Constituent Pretense"** (or sometimes **"Simulated Constituent Power"**).

  However, for your group chat, the most descriptive label is **"Retroactive Popular Sovereignty."**

  **Definition:** *A rhetorical strategy where a routine electoral victory is reinterpreted as the revelation of a pre-existing, immutable national will, thereby insulating the outcome from future democratic correction.*

  ### 3. The Carving: Legitimate vs. Bogus

  You asked for the edges: when is this move respectable (like a revolution) and when is it a trick? The difference lies in **Procedural Honesty** and **Reversibility**.

  **Edge 1: The Founding Moment (Legitimate)**
  *   **Context:** A revolution, independence, or writing a first constitution.
  *   **Why it works:** There *are* no prior rules. The "people" really are speaking for the first time.
  *   **The Freeze:** It is acceptable to "freeze" this will because the point is to create stability where there was chaos.
  *   **The Safety Valve:** Even here, legitimate constitutions include **amendment clauses**. They say, "This is the settled will, *unless* we decide later to change it via this specific hard process."
  *   **Verdict:** Respectable if it admits it is creating a new system and allows for future amendment.

  **Edge 2: The Routine Vote (Bogus)**
  *   **Context:** A referendum or election within an existing democracy.
  *   **Why it fails:** The vote is *constituted*. It happens under rules set by parliament. It is a decision, not a revelation.
  *   **The Freeze:** Claiming a policy vote is "settled forever" removes the ability to correct mistakes. Democracy requires the possibility of being wrong and fixing it.
  *   **The Safety Valve:** If the winners argue that *no* future vote can ever overturn this (because the "will" is now known), they are breaking the democratic contract.
  *   **Verdict:** Bogus. This turns a decision into a dogma.

  **Edge 3: The Asymmetry Test (The "Sore Winner" Check)**
  *   **Legitimate:** "The people have spoken, so we will govern this way until the next election." (Accepts future correction).
  *   **Bogus:** "The people have spoken, so anyone asking for a future vote is an enemy of the people." (Rejects future correction).
  *   **The Tell:** If the logic only applies when *they* win, it is not a principle of democracy; it is a **power grab**.

  ### 4. Why It Bugs You (The Philosophical Injury)

  The reason this pattern feels so violating is that it changes the nature of a vote from **Constitutive** to **Declarative**.

  *   **Normal Vote (Constitutive):** We vote to *make* a decision. The decision did not exist before we counted the ballots. It is an act of creation.
  *   **Your Opponent's Vote (Declarative):** They act as if the vote merely *revealed* a truth that was already there (like a thermometer revealing heat).

  If the vote is a thermometer, you can't ask to vote again in five years, because the "temperature" (the will) is a fact of nature, not a choice. By backdating the will, they turn a political choice into a natural fact. That is why they call opponents "obstructionists"—you don't argue with gravity, you just submit to it.

  ### Summary for your Argument

  When you encounter this pattern again, you can say:

  > "You are treating a **constituted** vote like a **constituent** act. You're claiming the will existed before the rules allowed us to measure it, and now you're saying it can't be changed by the rules. That's **Retroactive Popular Sovereignty**. It works for writing a constitution, but it doesn't work for policy. If the 'will of the people' can only be confirmed when you win and never corrected when you lose, it's not democracy, it's **oracle politics**."

  This gives you the vocabulary to show that you aren't just sore about the result; you are objecting to the *mechanism* they are using to lock it in.
