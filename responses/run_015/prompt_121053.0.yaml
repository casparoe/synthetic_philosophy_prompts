answer: |-
  # SEMINAR HANDOUT: Mapping the Badness of Pain
  **Philosophy of Mind | Week 3**

  **Instructions:** Start at **Q1** using the *Asymbolia Case* (sensation present, unpleasantness absent). Answer based on your intuition about the specific variant described. Follow the arrows to a **Leaf** (a philosophical position).

  ### THE DECISION TREE

  **Q1. The Asymbolia Baseline:** When the "bother" vanishes but the sensation remains, did a *piece of the feeling itself* vanish, or did the *subject's stance* toward the feeling change?
  *   **Piece of Feeling:** → **Leaf 1 (Feeling Theory)**
  *   **Subject's Stance:** → Go to **Q2**

  **Q2. The Informed Case:** A patient minds the tissue damage but not the sensation. Is the badness of pain *identical* to the badness of bodily damage?
  *   **Yes (Badness = Damage):** → **Leaf 2 (Evaluativism)**
  *   **No (Badness ≠ Damage):** → Go to **Q3**

  **Q3. The Twins (Necessity):** Twin A avoids the pain; Twin B (same report) does not. For Twin B, is the pain still *bad for them*?
  *   **No (No avoidance = No badness):** → Go to **Q4**
  *   **Yes (Badness exists even if ignored):** → Go to **Q5**

  **Q4. The Twins (Nature):** If badness requires avoidance, is the badness *just* the desire to stop, or the *frustration* when you can't?
  *   **Just the Desire:** → **Leaf 3 (Simple Desire-Based)**
  *   **The Frustration:** → **Leaf 4 (Frustration View)**

  **Q5. The Twins (Mechanism):** If badness exists even if ignored, is the pain *ordering* them to stop, or *representing* a fact?
  *   **Ordering (Command):** → **Leaf 5 (Imperativism)**
  *   **Representing (Fact):** → **Leaf 6 (Representationalism)**

  **Q6. The Mirror Case:** A patient says "It's agonizing" but shows no flinch/withdrawal. Do we trust their *words* or their *actions*?
  *   **Words (First-Person Authority):** → **Leaf 7 (Attitudinal Hedonism)**
  *   **Actions (Behavior/Function):** → Go to **Q7**

  **Q7. The Mirror (Mechanism):** If we trust actions, is the lack of withdrawal a *broken reflex* or a *rational choice*?
  *   **Broken Reflex:** → **Leaf 8 (Functionalism)**
  *   **Rational Choice:** → **Leaf 9 (Motivational Internalism)**

  ---

  ### THE LEAVES (POSITIONS)

  1.  **Feeling Theory:** Pain's badness is an intrinsic qualitative feel (like a sour taste). Asymbolics lack this specific quality.
  2.  **Evaluativism:** Pain represents bodily damage *as bad*. The sensation is neutral; the evaluation makes it painful.
  3.  **Simple Desire-Based:** Pain is bad because you desire it not to be. No desire (Twin B) = no bad pain.
  4.  **Frustration View:** Pain is bad because it frustrates a desire. (A nuanced version of Desire-Based).
  5.  **Imperativism:** Pain has imperative content ("Stop this!"). Twin B has the command but chooses to ignore it.
  6.  **Representationalism:** Pain represents a state of affairs. Badness is in the accuracy/content, not the motivation.
  7.  **Attitudinal Hedonism:** Badness is a pro/con attitude toward a sensation. Words reveal the attitude; actions can lie.
  8.  **Functionalism:** Pain is defined by its causal role (input → output). If no output (withdrawal), the functional state is absent.
  9.  **Motivational Internalism:** Pain necessarily motivates. Mirror Case is impossible (or the patient is lying/confabulating).

  ---

  ### INSTRUCTOR NOTES & LIMITS

  **⚠️ Uncertain Branch Decisions**
  *   **Q1 (Sensation vs. Stance):** This assumes separability. If "feeling" and "stance" are inseparable (a "Gestalt" view), the tree collapses at the root.
  *   **Q3 (Twins Necessity):** This relies on *Motivational Internalism*. If motivation is contingent, Twin B might still have bad pain without avoiding it, confusing the split at Q3/Q5.
  *   **Q6 (Mirror Authority):** Relies on folk intuition about sincerity. If "unpleasantness" is *defined* by behavior, Q6 is question-begging.

  **🔗 Indistinguishable Leaves**
  *   **Leaf 1 (Feeling Theory) vs. Leaf 2 (Evaluativism):** Both explain asymbolia as "missing content." Distinguishing them requires knowing if the missing content is *qualitative* (hurtfulness) or *cognitive* (evaluation of damage). This tree separates them at Q2, but students often conflate "feeling bad" with "evaluating as bad."
  *   **Leaf 5 (Imperativism) vs. Leaf 9 (Motivational Internalism):** Both tie pain closely to action. Imperativism says pain *commands* action; Internalism says pain *causes* action. Without neural data on whether the "command" is distinct from the "drive," these leaves occupy the same logical space in this tree.
      *   *Further Case Needed:* A patient who obeys the command to stop but reports *no unpleasantness*. Imperativism might call this pain; Internalism would likely deny it.

  **🔄 Redrawing the Tree**
  *   If **Asymbolics** reported "I feel nothing" rather than "I feel it but don't mind," Q1 would become unusable (sensory/discriminative loss vs. affective loss).
  *   If **Unpleasantness without Sensation** (e.g., pure suffering with no location) is coherent, Q1's dichotomy fails, requiring a "Pure Affect" branch.
