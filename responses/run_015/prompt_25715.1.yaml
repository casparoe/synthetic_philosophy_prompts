answer: |-
  You have independently rediscovered one of the most significant categories in modern normative ethics. The term you are looking for is **supererogation**.

  The actions you describe are called **supererogatory acts** (from the Latin *supererogatio*, meaning "a payment made in excess").

  Your intuition is correct: this category does not fit on a simple linear scale between "forbidden" and "required." It operates with a distinct logic. The philosophical mapping of this territory was most famously revitalized by the philosopher J.O. Urmson in his 1958 paper *"Saints and Heroes."* Urmson argued that the standard deontic triad (obligatory, forbidden, permissible) fails to capture the moral landscape because it leaves no room for moral aspiration.

  Here is how philosophers have mapped the boundaries, the motives, and the fragility of this category, addressing your specific questions.

  ### 1. The Three Conditions of Supererogation
  For an action to be truly supererogatory, it generally must satisfy three conditions:
  1.  **Optionality:** It is not morally required. You are not blameworthy for omitting it.
  2.  **Positive Value:** It is morally good to perform. You are praiseworthy for doing it.
  3.  **Cost/Sacrifice:** It involves some significant cost, risk, or sacrifice to the agent (more than what is required by duty).

  This explains why picking a cereal is not supererogatory (it lacks moral weight) and why paying your taxes is not supererogatory (it lacks optionality). Donating bone marrow fits because it is morally weighty, optional, and involves pain/risk.

  ### 2. Drawing the Boundary: Sacrifice vs. Politeness
  You asked where this shades into ordinary politeness or obligation. This is the site of intense debate.

  *   **The Sacrifice Threshold:** Most philosophers agree that supererogation requires going "above and beyond" the call of duty. Holding an elevator door is good, but because the cost is negligible, many classify it as mere **civility** or **politeness** rather than supererogation. Supererogation usually implies a tangible cost to the agent's well-being, time, or resources (e.g., jumping into a freezing river).
  *   **The Demandingsness Objection:** The boundary between obligation and supererogation is often drawn to protect agents from moral burnout. If we classify too much as "obligatory" (e.g., "You must donate 50% of your income to charity"), morality becomes too demanding. By classifying it as supererogatory, we acknowledge it is *good* to do without making it a *requirement*, thus preserving a sphere of personal life that is morally immune.
  *   **Cultural Shift:** The boundary moves. In some ethical frameworks (like strict Utilitarianism), the category of supererogation barely exists. If the moral goal is to maximize good, then the *best* action becomes the *required* action. A Utilitarian might argue that if you can save a life with a bone marrow donation, you are obligated to do so. The existence of supererogation is largely a feature of Deontological or Virtue Ethics, which allow for personal prerogatives.

  ### 3. The Fragility of Praise and the Role of Motive
  Your observation about bragging is philosophically astute. It touches on the distinction between the **rightness of the act** and the **moral worth of the agent**.

  *   **Objective vs. Subjective:** The *act* of donating bone marrow is objectively supererogatory regardless of why you do it. It saves a life at cost to yourself. However, the *moral worth* of the agent depends heavily on motive.
  *   **The Kantian Problem:** Immanuel Kant argued that actions only have true moral worth if done from duty, not inclination. Supererogation creates a puzzle for Kant: if it's not duty, where does the worth come from?
  *   **Motive Contamination:** If you donate bone marrow purely for attention, philosophers would say the act remains beneficial (and technically supererogatory in structure), but you are not a *virtuous* person. The praise is "fragile" because supererogation is tied to the concept of **moral goodness**, not just **moral rightness**.
      *   When you fulfill a duty (pay taxes), motive matters less; the system works regardless.
      *   When you perform a supererogatory act, the moral value is intrinsic to the *gift*. If you demand recognition (bragging), you retroactively signal that it wasn't a gift, but a transaction. This collapses the supererogatory nature back into a self-serving act, voiding the moral praise.

  ### 4. Why the Category Matters
  Philosophers keep this category distinct for a vital reason: **Moral Aspiration.**

  If we only have "required" and "forbidden," morality becomes a floor—a set of constraints to avoid punishment. Supererogation provides a ceiling. It allows for moral heroism and sainthood without making those standards mandatory for everyone.

  Without this category, we face a binary where everyone who isn't a saint is a sinner. By mapping this middle ground, ethics acknowledges that while we are not required to be heroes, we are better for aspiring to be.

  ### Summary of the Terminology
  *   **The Term:** Supererogation.
  *   **The Actor:** Often referred to as a "moral hero" or "saint" (in a secular sense).
  *   **The Opposite:** **Suberogatory**. This is a newer, less common term for actions that are bad to do, but not forbidden (e.g., eating a smelly fish on a crowded bus). It is the inverse asymmetry: blameworthy to do, but not praiseworthy to skip.

  You have correctly identified that this category has its own internal logic. It is the logic of **gift** rather than **debt**. Duty is the repayment of a moral debt; supererogation is a moral gift. And as with any gift, announcing the price at which it was given ruins the gesture.
