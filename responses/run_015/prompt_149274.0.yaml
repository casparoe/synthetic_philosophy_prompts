prompt: |-
  I'm giving a talk next tuesday in our dept's animal ethics workshop, and I need a Q&A prep sheet. I'm defending this somewhat niche take on Kant: his indirect duty view in the Doctrine of Virtue is usually read as "be nice to dogs so you don't become a jerk to people," but I think it actually relies on what I'm calling moral atmospheres — the shared affective space where recognizing rational nature in others becomes possible. Cruelty to suffering-capable animals doesn't just harden your character; it dissolves the intersubjective conditions that make human dignity visible in the first place. So I end up with a direct (but non-rights-based) obligation not to cause severe suffering, especially in long-term working relationships like guide dogs or research primates where there's asymmetric reciprocity. I'm not sneaking rights in, but I'm saying Kant's own framework forces stronger protection than the standard indirect-duty story allows.

  The audience is mostly care ethicists and feminist philosophers who love relational autonomy, plus one very traditional Kant scholar who thinks I'm muddying the waters, and a grad student in animal cognition who thinks "moral atmospheres" is just anthropomorphic hand-waving. They care about power dynamics, dependancy, and whether I'm abandoning deontology for care ethics.

  Can you draft the objections I'll actually get, ordered by how damaging they'd be? I want each phrased the way this crowd asks it, with a two-minute reply and an honest note on where my reply is weakest. Include the question I'm hoping nobody asks — probably something about whether my "moral atmosphere" idea collapses into care ethics and makes Kant redundant. I don't want to just recieve generic pushback. Also, my argument sketch builds from Kant's discussion of cruelty in the Doctrine of Virtue and uses long-term human-animal working relationships to show reciprocity doesn't have to be rational-to-rational.
