answer: |-
  Good evening, everyone. Thank you for coming out.

  Looking around this room, I see the exact split I was worried about. On my left, I see people who have opinions on aesthetics and policy. On my right, I see people who brought casseroles and know the artists by their childhood nicknames. Usually, I stand between those groups for a living. I'm an adjunct. I teach the classes where we read the heavy stuff.

  Actually, I taught the essay that hangs over this show once. It was a Tuesday night, I was covering three sections, and I was trying to explain the idea that all art is propaganda. But only some of it admits it. I was looking at my notes this morning to prepare for this, and I realized I've been spelling it wrong for years. I wrote "propoganda." With an O.

  Maybe that's appropriate. Maybe the word itself is trying to tell us something about how hard it is to get this right.

  Because here's the thing about that idea. When we hear "propaganda," we think of a message. We think of a billboard. We think of someone telling us what to think. And when we look at art, especially art by Black artists, there is often an expectation of what that message should be. We expect testimony. We expect narrative. We expect the body to be present, often in pain.

  But look at the big canvas in the back. The one by the twenty-two-year-old who used to sit in the third row of my class.

  There are no bodies there. There is no story. There is just color. There is just form.

  I asked her about this. I asked her if she was worried that people wouldn't see the politics in it. And she told me something that stopped me cold. She said that making this—insisting on beauty, insisting on abstraction, when everyone is waiting for her to perform trauma—is exactly the propaganda she wants to make.

  She's saying that the act of refusing to explain herself is the message.

  For those of you who know the theory: This isn't art that hides its purpose. It wears it, but it wears it like armor, not like a sign. It refuses the assignment of suffering.

  For those of you who are here because you love her: You don't need to know the theory to feel that refusal. You know what it costs to walk into a room and decide you don't have to cry to be believed. You know what it costs to just be bright.

  "Truth is Beautiful." That's the title of the show. It's a dangerous title. It suggests that if we find the beauty, we find the truth. But sometimes, the truth is that we are tired of being asked to prove our humanity through our scars. Sometimes the truth is just the paint.

  So, I'm not going to give you a key to unlock these pieces. I'm not sure I have one. I'm just an adjunct who sometimes spells the big words wrong. But I know these artists. I know that half of them learned how to stretch a canvas in my studio, and the other half learned how to hold a brush at their kitchen tables.

  The work here doesn't ask you to agree. It asks you to look. It asks you to stand in front of something that refuses to be small, and let it take up space.

  Please, walk around. Talk to the artists. Talk to each other. And if you see that big canvas, don't look for the wound. Look for the breath.

  Thank you.
