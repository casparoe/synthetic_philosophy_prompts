      *   **Key Artwork:** A massive abstract canvas (no bodies, no narrative, just color/form) by a 22-year-old former student. She considers it propaganda because insisting on beauty instead of expected trauma is the propaganda.
      *   **Length:** About 4 minutes (roughly 500-600 words spoken at a moderate pace).
      *   **Tone/Persona:** Exhausted adjunct who taught the essay once, isn't sure she agrees with Du Bois, not a keynote speaker. Human, vulnerable, slightly informal.
      *   **Constraint:** The philosophical idea must shape the speech. Cannot just say "it's beautiful and political" (too easy). Must engage with Du Bois's distinction (hiding purpose vs. wearing it) without alienating family.
      *   **Specific Detail:** Accidentally spelled "propaganda" as "propoganda" in notes – work this in as a human touch (optional but requested).
      *   **No Citations/Reading List.**

  2.  **Deconstruct the Philosophical Core:**
      *   Du Bois's argument: All art is propaganda (it pushes a viewpoint), but only some admits it.
      *   The Twist: The abstract piece *looks* apolitical (no bodies, no trauma), but the artist claims the *act* of claiming beauty is the propaganda.
      *   The Adjunct Persona: Tired, maybe a bit skeptical of high theory, but respects the students. Needs to bridge the gap between "art as weapon" and "art as gift."
      *   The Challenge: Don't let the academics feel patronized (too simple) and don't let the family feel lectured (too dense).
      *   The Solution: Frame "propaganda" not as a dirty word or a academic puzzle, but as a *claim on space*. The spelling mistake helps ground it.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the mix of people. Set the tone (warm, slightly tired).
      *   **The Title:** "Truth is Beautiful." Connect it to the room.
      *   **The Du Bois Hook (Light Touch):** Mention the essay without name-dropping too heavily. Acknowledge the tension. Some people know the theory, some just know the artist.
      *   **The Spelling Mistake:** Insert the "propoganda" note moment. It humanizes the speaker and breaks the tension.
      *   **The Abstract Piece:** Focus on the 22-year-old student. Describe the work (color, form). Address the "no trauma" aspect.
      *   **The Philosophical Pivot:** How is this propaganda? It's not shouting. It's refusing to shout. It's insisting on existing without explanation.
      *   **The Bridge:** Connect the academics (who look for the message) and the family (who look for the person). Both are right.
      *   **Closing:** Invite them to look. Keep it under 4 minutes.

  4.  **Refining the Tone:**
      *   *Avoid:* "As Du Bois posits in his seminal text..."
      *   *Use:* "I taught this essay once. I was tired. You were tired."
      *   *Avoid:* "This piece deconstructs the gaze."
      *   *Use:* "She didn't paint a wound. She painted a breath."
      *   *Check:* Is it too academic? Keep sentences varied. Some fragments.
      *   *Check:* Is it too simple? Ensure the argument about *beauty as resistance* lands hard.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. Thanks for coming. Look at this room. Half of you know theory, half of you know the artists' moms. I taught that essay about art being propaganda. I spelled it wrong in my notes. See? I'm human. There's a big painting here. No people. Just color. People might ask "where's the struggle?" But the artist says making something beautiful *is* the struggle. That's the propaganda. Not lying, but telling a specific truth. So look at the art. Talk to each other. Thanks.

      *Critique 1:* Too choppy. Needs more flow. Needs to really grapple with the Du Bois idea without being dry. The "propoganda" bit needs to feel natural.

  6.  **Drafting - Attempt 2 (Writing & Polishing):**
      *   *Word Count Check:* 4 minutes is roughly 500-600 words.
      *   *Persona:* Exhausted adjunct. "I taught this essay one semester when I was covering three classes."
      *   *The Argument:* Du Bois said all art is propaganda. But usually, we think propaganda means "message." The artist here says the message is "I am allowed to be abstract."
      *   *The Family:* You don't need to know the theory to feel the refusal.
