      *(Self-Correction during drafting)*: Make sure I don't sound *too* unsure. I need to sound like I've thought about it, but I'm not preaching. The uncertainty is about the *utility* of the theory, not the art.

      *Incorporating the typo:* "I was looking at my notes... I wrote 'propoganda' with an O. Even the word resists being spelled right."

      *Closing:* Bring it back to the neighborhood.

  7.  **Final Review against Constraints:**
      *   4 minutes? (Yes, if paced well).
      *   Du Bois idea shapes speech? (Yes, central tension).
      *   Not just "beautiful and political"? (Yes, focuses on the *refusal* of trauma as the political act).
