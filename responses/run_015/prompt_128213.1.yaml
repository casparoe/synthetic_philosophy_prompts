answer: |-
  # Joint Statement on the Epistemic Status of Philosophical Intuition Pumps

  **Participants:** The Coalition for Conceptual Clarity (Defenders) and The Cognitive Critique Working Group (Skeptics)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Methodology of Thought Experiments

  ## I. Agreed Claims

  We, the undersigned parties, acknowledge a deep methodological division regarding the use of intuition pumps in philosophical inquiry. However, to facilitate productive discourse, we establish the following points of consensus regarding the nature of the tool and the landscape of the debate:

  1.  **Definition of the Tool:** We agree that an "intuition pump" is a specific type of thought experiment designed not merely to illustrate a theory, but to elicit a pre-theoretical judgment or "intuition" from the subject regarding a specific case, which is then used as evidence for or against a philosophical claim.
  2.  **Existence of Framing Sensitivity:** We agree that human judgment is demonstrably sensitive to non-substantive variations in presentation. Factors such as the order in which information is presented, the emotional valence of the language used, and the narrative immersion of the scenario can shift verdicts without altering the logical structure of the case.
  3.  **Shared Normative Goal:** Both camps share the objective of maximizing philosophical insight while minimizing error. We agree that the ultimate aim is to distinguish judgments that track genuine conceptual or modal truths from judgments that track psychological artifacts, cognitive biases, or rhetorical manipulation.
  4.  **Conditions for Misleading Pumps:** We agree that an intuition pump should be provisionally classified as misleading rather than illuminating if it relies on ambiguity in key terms, suppresses relevant alternative interpretations of the scenario, or demands a judgment under conditions of time pressure or emotional distress that preclude reflection.
  5.  **Requirement for Transparency:** We agree that future philosophical publications utilizing intuition pumps must describe the scenario with sufficient granularity to allow for the testing of framing effects, regardless of whether the author believes such effects are relevant to the core argument.

  ## II. Disagreements Table

  The following table outlines the precise points of contention. The wording in each cell has been approved by the respective camp as an accurate representation of their position.

  | Issue | Defenders' Position | Skeptics' Position |
  | :--- | :--- | :--- |
  | **1. Epistemic Authority vs. Framing Effects** | The existence of framing effects in general populations does not undermine the epistemic authority of pumps when used by trained philosophers. Expertise functions as a calibration mechanism that filters out noise, preserving the pump's ability to track modal reality. | Framing effects indicate that the judgment is constructed by the presentation rather than discovered in the content. Therefore, framing sensitivity undermines the epistemic authority of all pumps, requiring independent validation beyond mere expert consensus. |
  | **2. Revealing vs. Manufacturing Intuition** | There is a principled boundary between revealing and manufacturing intuition. A pump reveals intuition if it isolates a variable in a way that aligns with reflective equilibrium; it manufactures intuition if it coerces assent through rhetorical force unrelated to the variable. | The distinction is not principled but gradient. All pumps manufacture intuition to some degree by constraining the cognitive space of the thinker. The question is not *whether* they manufacture, but whether the manufactured output is pragmatically useful. |
  | **3. Replaceability by Formal Modeling** | There are domains of philosophy (e.g., phenomenology, specific modal metaphysics) where formal computational modeling is impossible in principle. In these domains, pumps are irreplaceable because they access qualitative capacities that formal syntax cannot capture. | Formal computational modeling can, in principle, replace pumps in every philosophical domain. If a judgment cannot be formalized or modeled, it lacks the structural rigor required for public knowledge and remains a private psychological state. |

  ## III. Cruxes and Hypothetical Cases

  We have identified two specific cruxes where empirical or theoretical resolution would significantly shift the weight of the debate. For each crux, we propose a concrete hypothetical case and record our divergent predictions.

  ### Crux 1: Expert Stability vs. Population Divergence
  **The Question:** Does an intuition pump that yields stable judgments among trained philosophers but divergent judgments across broader populations still carry epistemic weight?

  **The Hypothetical Case: The Reversed-Framing Tunnel Case**
  *   **Scenario A (Abstract):** Subjects view a quantitative-risk diagram showing a utilitarian trade-off: "Action X saves 5 units of value at cost of 1 unit."
  *   **Scenario B (Immersive):** Subjects engage in a first-person virtual reality narrative where they must physically push a person to stop a trolley, described with sensory details of the victim's fear and the physical resistance.
  *   **Method:** Philosophers and laypeople are split into groups. Group 1 sees A then B. Group 2 sees B then A.
  *   **Observation:** Laypeople's judgments flip significantly based on order and format. Trained philosophers' judgments remain stable across formats, aligning with Scenario A.

  **Predicted Outcomes:**
  *   **Defenders:** The stability of the philosophers' judgment indicates that training successfully insulates the intuition from irrelevant framing. The lay divergence confirms the need for expertise. The pump retains epistemic weight because the expert consensus demonstrates access to the underlying structural truth.
  *   **Skeptics:** The stability of the philosophers' judgment indicates acculturation to a specific theoretical framework, not insulation from bias. The divergence proves the judgment is sensitive to presentation modes. The pump loses epistemic weight because the expert consensus is indistinguishable from professional conformity.

  ### Crux 2: The Limits of Formalization
  **The Question:** Is there any philosophical domain in which formalization is impossible in principle, rendering pumps irreplaceable?

  **The Hypothetical Case: The Phenomenal Weight of Humiliation**
  *   **Scenario:** A moral theory attempts to quantify the disvalue of "public humiliation."
  *   **Pump Approach:** A narrative description of a specific instance of shaming is presented to elicit a judgment on whether this disvalue outweighs a specific physical pain.
  *   **Formal Approach:** An attempt to create a computational model assigning variables to "social status," "audience size," and "psychological resilience" to calculate the disvalue without narrative.

  **Predicted Outcomes:**
  *   **Defenders:** The Formal Approach will fail in principle. The qualitative "what-it-is-like" of humiliation cannot be captured by variables without losing the very feature that makes it morally relevant. The Pump Approach is irreplaceable here because it transfers the phenomenological experience necessary for the judgment.
  *   **Skeptics:** The failure of the current Formal Approach is technological, not principled. If the judgment is consistent enough to guide action, it implies an underlying algorithmic structure. The Pump Approach is merely a heuristic placeholder for a formal model we do not yet possess; relying on it perpetuates vagueness rather than solving it.

  ## IV. Assessment of Verbal Dispute

  We have assessed whether portions of this dispute are merely verbal. We conclude that while there is terminological friction, the core disagreement is substantive.

  1.  **Terminological Friction:** There is a verbal component regarding the definition of "intuition." Defenders often use the term to refer to a *considered judgment* reached after reflection, whereas Skeptics often use it to refer to an *immediate cognitive seeming*. If both parties agreed to use "considered judgment" for the former and "immediate seeming" for the latter, some confusion would dissipate.
  2.  **Substantive Core:** However, the disagreement regarding **Crux 2** (Replaceability by Formal Modeling) is not verbal. It is a metaphysical disagreement about the nature of philosophical content. Defenders hold that some philosophical content is essentially non-algorithmic; Skeptics hold that all knowable content is structurally representable. No amount of semantic clarification can resolve this without external evidence regarding the limits of computation and the nature of phenomenology.

  **Conclusion:** We commit to testing the Hypothetical Cases outlined in Section III through collaborative experimental design. We agree to publish the results jointly, regardless of whether the data favors the Defender or Skeptic position.
