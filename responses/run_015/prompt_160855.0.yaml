answer: |-
  # ADVERSARIAL COLLABORATION: THE OLD EVIDENCE PROBLEM

  ## 1. AGREED CLAIMS

  Both parties affirm the following propositions as the baseline for this dispute.

  1.  **The Formal Block:** In standard Bayesian conditionalization, if an agent assigns probability $P(E) = 1$ at time $t_0$, then learning $E$ at $t_1$ yields no update: $P(T|E) = P(T)$. Evidence that is already certain cannot raise the probability of a theory via conditionalization on $E$.
  2.  **The Intuitive Datum:** In scientific practice, evidence known prior to the formulation of a theory (e.g., the anomalous perihelion of Mercury prior to General Relativity) is routinely counted as strong confirmation of that theory.
  3.  **Constraint on Arbitrariness:** A solution to the problem must not permit arbitrary evidence to confirm arbitrary theories. Merely knowing $E$ should not confirm $T$ unless there is a specific structural connection (e.g., entailment or high likelihood) between them.
  4.  **Constraint on Psychological Realism:** A solution should not require attributing credences to agents that they plainly did not possess (e.g., claiming an agent had $P(E) < 1$ when they were fully certain of $E$).
  5.  **Constraint on Formal Purity:** If the solution claims to remain within orthodox Bayesianism, it must not smuggle in non-Bayesian norms (e.g., "heuristic novelty" or "temporal priority") as primitive axioms without showing how they map to credence updates.
  6.  **Shared Commitment:** Both parties accept Conditionalization as the correct rule for updating credences *given* a learning event. The dispute is about what constitutes the relevant learning event in cases of old evidence.

  ## 2. DISAGREEMENTS TABLE

  | The Core Disagreement | Dissolutionist Formulation | Sceptic Formulation |
  | :--- | :--- | :--- |
  | **The Nature of the Fix** | The problem is a **modeling error**. We incorrectly identified the learning event as "learning $E$." The actual learning event is "learning that $T$ entails $E$" (or realizing the explanatory connection). When we enrich the proposition space to include logical relations ($T \models E$), the confirmation appears naturally in the update on that relation. | The fix is a **free-parameter machine**. By arbitrarily enriching the space (choosing *which* logical realization counts as the update), we can manufacture any confirmation value we like. The formalism is being driven by the desired result, not the evidence. |
  | **The Role of History** | The history of discovery (whether $E$ was used to construct $T$) is **epistemically irrelevant** to the update, provided the agent treats the realization of the entailment as new information. The logic is timeless; the psychology is time-sliced. | The history of discovery is **constitutive** of confirmation. A theory built to fit $E$ is less supported by $E$ than a theory that predicted $E$. This "heuristic novelty" is a real feature of scientific support that the Bayesian formalism cannot capture from the inside. |
  | **The Goal of Theory** | Bayesian confirmation theory models **rational credence dynamics** for a specific agent. If the agent's credence in $T$ rises upon realizing $T \models E$, confirmation has occurred *for that agent*. | Bayesian confirmation theory aims to capture the **objective support relation** between theory and evidence. If the formalism says $E$ supports $T$ only when the agent forgets and relearns the proof, the formalism has failed to track the objective relation. |

  ## 3. CRUXES AND PREDICTIONS

  | Crux | Bearing Case | Dissolutionist Prediction | Sceptic Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Robustness of Enrichment**<br>Does the confirmation value stabilize as we refine the description of the "learning event"? | **The Lemma Chain:** An agent learns $T \models L_1$, then $L_1 \models L_2$, then $L_2 \models E$. We can model the update at any link in this chain. | **Convergence.** The total probability flow to $T$ is invariant to how we slice the logical derivation. Whether the agent updates on $T \models E$ directly or via lemmas, the final posterior $P(T)$ converges to the same value. | **Drift.** The confirmation value depends on where we place the "uncertainty" in the chain. If we model uncertainty at the final link vs. the first link, the likelihood ratios differ. The result is sensitive to the granularity of the modeler's choice. |
  | **2. Graded Logical Competence**<br>Does confirmation depend on the agent's current grasp of the entailment? | **The Archive Case:** A scientist derives $E$ from $T$, writes it in a notebook, forgets the derivation, and years later reconstructs it from the notes. | **Confirmation at Reconstruction.** No confirmation occurs at $t_0$ (derivation) if the agent remains certain of $E$. Confirmation occurs at $t_1$ (reconstruction) because the agent updates on the proposition "I have now verified that $T \models E$." The support is tied to the cognitive event. | **Absurdity.** The support relation between $T$ and $E$ does not vanish because the scientist forgot the proof. If the Dissolutionist is right, $E$ stops supporting $T$ while the notebook sits closed. This makes confirmation a function of memory, not evidence. |
  | **3. Counterfactual Framing**<br>Is the "what if I didn't know $E$" question coherent when $T$ changes the conceptual scheme? | **Conceptual Shift:** $T$ introduces new concepts (e.g., curved spacetime) that redefine $E$. | **Well-Defined over Realizations.** We do not need to imagine $E$ being false. We imagine the agent being uncertain about whether the *new conceptual framework* entails the *old observation statement*. The update is on the mapping, not the data. | **Ill-Defined.** Once $T$ changes the meaning of terms, you cannot coherently hold $E$ fixed across the update. The counterfactual "What would I have thought without $T$?" is a stand-in for "Does $T$ predict this?" which is not a Bayesian update but a structural appraisal. |
  | **4. Construction vs. Prediction**<br>Does using $E$ to build $T$ defeat confirmation? | **The Blinding Case:** In physics/psychology, data is hidden (blinded) until analysis is frozen. In other cases, $E$ is used to tune $T$. | **Optional/Instrumental.** Blinding is useful only to prevent bias in setting *priors* (e.g., preventing tuning $T$ to look good). It does not affect the *update mechanism*. If $T$ entails $E$, realizing that entailment confirms $T$ regardless of whether $E$ was used to build $T$. | **Mandatory/Constitutive.** Blinding is epistemically mandatory for strong confirmation. If $E$ was used to construct $T$, the confirmation value is diminished or zero, regardless of later entailment learning. The Dissolutionist's view renders blinding practices pointless post-hoc. |

  ## 4. ANALYSIS OF THE VERBAL DISPUTE

  **The Core Verbal Ambiguity:**
  The argument turns on the definition of **"Confirmation."**

  *   **Dissolutionist Definition:** Confirmation is a **psychological event**. It is the rational increase in an agent's credence in $T$ at a specific time $t$, given a specific information set. It is inherently indexical to the agent's state.
  *   **Sceptic Definition:** Confirmation is a **logical relation**. It is the degree to which evidence $E$ supports theory $T$, independent of any particular agent's history or memory state. It is a normative standard for appraising theories, not just tracking belief updates.

  **Does Separating Them Dissolve the Cruxes?**
  Separating the definitions **relabels** the disagreement but does not **dissolve** it. It exposes a deeper normative conflict about the purpose of Bayesian epistemology.

  1.  **On the Archive Case:** If confirmation is psychological (Dissolutionist), their prediction stands: support flickers with memory. If confirmation is logical (Sceptic), the Dissolutionist's model is irrelevant to the actual support relation. The Sceptic wins the point that the Dissolutionist's model fails to capture scientific *practice*, which treats the support as stable.
  2.  **On Blinding:** If confirmation is psychological, blinding is merely a heuristic for better priors. If confirmation is logical, blinding is a condition for the support relation itself. The Sceptic correctly identifies that scientific norms treat accommodation (using $E$ to build $T$) as inferior to prediction, regardless of the agent's internal state.

  **Verdict:**
  The **Sceptic** wins the substantive argument regarding the *utility* of the formalism. While the Dissolutionist is technically correct that one can *model* the update as a realization of entailment without violating Bayesian axioms, this success is pyrrhic. It saves the formalism only by severing the link between "Bayesian Confirmation" and "Scientific Support."

  The Dissolutionist saves Bayesianism as a consistent logic of belief, but at the cost of making it unable to explain why we prefer novel predictions over accommodations. The Sceptic is correct that the "fix" is a free-parameter machine: by shifting the update to the entailment, the Dissolutionist can assign any confirmation value they wish by adjusting the prior probability of the entailment ($P(T \models E)$). Since this prior is unconstrained by the evidence $E$ itself, the model lacks explanatory power.

  **Conclusion:** The dispute is not merely verbal. It is a disagreement about whether Bayesianism is a theory of *coherence* (Dissolutionist) or a theory of *evidence* (Sceptic). The Old Evidence problem demonstrates that a theory of coherence is insufficient to capture the norms of scientific evidence. The Dissolutionist's solution is internally consistent but externally irrelevant to the phenomenon it claims to explain.
