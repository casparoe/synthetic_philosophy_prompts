answer: |-
  You have put your finger on one of the most persistent and damaging structural weaknesses in **Moderate Restrictivism** (the view that some composites exist, but not all). You are not confused; you have identified a genuine, well-discussed tension in contemporary mereology.

  While there is no single, canonical proper noun for this problem (like "The Gettier Problem"), it is widely recognized under a few descriptive labels depending on the sub-field. In general metaphysics, it is most often called **"The Fragmentation Objection"** or **"The Problem of Competing Unities."** In the philosophy of biology, where your gut bacteria example is central, it is discussed as **"The Problem of Nested Individuality."** In the context of the Special Composition Question (SCQ), it is a specific, potent form of **"The Arbitrariness Objection."**

  Here is the breakdown of the phenomenon, starting with the brainstorm you requested, followed by an analysis of its name, boundaries, and philosophical status.

  ### 1. Brainstorm: How Restrictivist Criteria Handle Your Examples

  Moderate restrictivists try to find a "Principle of Composition" (PC) that is stricter than Universalism (anything goes) but looser than Nihilism (nothing goes). Let's see how the three most common PCs handle your gut bacteria and CPU cases.

  **A. Spatial Contact / Continuity**
  *   **The Criterion:** Parts compose a whole only if they are physically connected.
  *   **The Gut Case:** Bacteria touch each other (high continuity). They also touch the gut wall (connection to host).
      *   *Failure:* If contact is sufficient, the bacteria compose a "bacteria-ball." But since they also touch the host, they also compose the "host-plus-bacteria." This doesn't fragment the object; it creates *overlapping* objects. However, if the criterion requires *maximal* connectivity, the bacteria might be more connected to each other than to the host cells, implying the "bacteria-ball" is a *more real* object than the "human."
  *   **The CPU Case:** Transistors within a core are microns apart. Cores within a CPU are millimeters apart. The CPU and GPU are centimeters apart (on the motherboard).
      *   *Failure:* If composition tracks *degree* of proximity, the "Core-Object" is more unified than the "CPU-Object," which is more unified than the "Computer-Object." The criterion fragments the computer into a Russian doll of competing objects, privileging the smallest tightest cluster.

  **B. Causal Interaction**
  *   **The Criterion:** Parts compose a whole if they interact causally (e.g., exchange energy/information).
  *   **The Gut Case:** Bacteria swap plasmids and chemicals rapidly (high internal causation). They also signal the immune system (external causation).
      *   *Failure:* If the internal causal density is higher than the external causal density, the restrictivist principle suggests the bacteria form a *tighter* unity than the host does. Why is the "Human" the object and not the "Microbiome," with the human cells just being the environment?
  *   **The CPU Case:** Cores synchronize clocks and share cache (very high causal bandwidth). The CPU talks to the GPU via the PCIe bus (lower bandwidth, higher latency).
      *   *Failure:* A causal criterion risks making the CPU a real object but the Computer a "scattered" fiction, because the CPU-GPU link is causally weaker than the Core-Core link. This is the **Fragmentation** you noticed: the rule meant to block the "Shoe-Moon" (no causal link) also blocks the "Computer" (weak causal link) while validating the "CPU" (strong causal link).

  **C. Functional Unity**
  *   **The Criterion:** Parts compose a whole if they work together toward a common end or function.
  *   **The Gut Case:** Bacteria reproduce (their function). They also digest fiber for the host (host's function).
      *   *Failure:* Whose function counts? If it's the *parts'* function, the bacteria are the primary agents. If it's the *whole's* function, we presuppose the whole exists to have a function. This is circular. If the bacteria can survive outside the body, their functional unity is independent of the host, making them a competing object.
  *   **The CPU Case:** Cores process instructions (CPU function). The CPU renders frames (Computer function).
      *   *Failure:* Similar to causation. If functional integration comes in degrees, the CPU is "more integrated" than the Computer. This leads to **Mereological Competition**: the CPU claims ontological priority over the Computer.

  ### 2. Naming the Phenomenon

  You asked if this has a name. As noted, there isn't one single label, but here is how you should categorize it in your coursework:

  **1. The Fragmentation Objection (General Metaphysics)**
  This is the most accurate descriptive name. It argues that any "gradient" criterion for composition (like causal strength or functional integration) will inevitably slice ordinary objects into smaller, *more* unified pieces. If existence is binary (it exists or it doesn't), but unity is a matter of degree, the theory forces us to say the "more unified" part exists while the "less unified" whole does not. This fragments the ontology of the everyday world.

  **2. The Arbitrariness of Levels (The SCQ Context)**
  Peter van Inwagen and others discuss the **Special Composition Question**. The standard objection to restrictivism is "Arbitrariness": *Why* draw the line here and not there? Your observation sharpens this. It's not just that the line is arbitrary; it's that **drawing the line anywhere seems to cut through natural joints.** If you set the bar for "togetherness" high enough to exclude the Shoe-Moon, you seem to exclude the Computer. If you lower it to include the Computer, you seem to include the Shoe-Moon (via long causal chains).

  **3. The Problem of Nested Individuality (Philosophy of Biology)**
  Your gut bacteria example is a classic case here. Philosophers like Peter Godfrey-Smith and Thomas Pradeu discuss **"Darwinian Individuality."** The problem is that selection acts at multiple levels (gene, cell, organism, colony). If "being an organism" requires a specific kind of functional bottleneck, the microbiome might qualify as an organism *inside* the host organism. This leads to **ontological overlap** that restrictivists find uncomfortable.

  ### 3. What This Phenomenon Is (and Is Not)

  To help you map the boundaries in your essay or exam, distinguish this from similar problems:

  **It IS:**
  *   **A Problem of Priority:** It asks which level of organization gets the title of "Object." Is the CPU more real than the Computer?
  *   **A Challenge to Binary Existence:** It highlights the clash between *graded relations* (causation, cohesion) and *binary ontology* (exists/does not exist).
  *   **A Vulnerability for Moderate Restrictivists:** Universalists (David Lewis) avoid this by saying *everything* exists (both the CPU and the Computer and the Shoe-Moon). Nihilists (Van Inwagen, regarding non-living things) avoid this by saying *nothing* composite exists (no CPU, no Computer). Only the Moderate Restrictivist, who wants tables but not trout-turkeys, gets crushed by this.

  **It IS NOT:**
  *   **The Problem of the Many:** That problem concerns *vagueness of boundaries* (e.g., which exact atoms constitute the cat?). Your problem is about *competing centers of unity* (e.g., is the cat the primary object, or is the cat's heart a separate, more unified object?).
  *   **The Problem of Material Constitution:** That concerns two objects in the *same* place (Statue vs. Clay). Your problem concerns objects in *nested* places (CPU *inside* Computer).
  *   **Mereological Essentialism:** That is the view that parts are essential to the whole. Your problem arises even if parts are accidental; it's about whether the whole exists *at all* compared to the parts.

  ### 4. Boundary Cases and Edges

  To show you understand the edges of this problem, consider these test cases:

  *   **The Parasite Case:** A tapeworm is causally connected to you, functionally integrated (it eats your food), and spatially continuous. Is it a part of you?
      *   *Restrictivist Trap:* If you say "No, it's a separate object," you admit that high causal integration isn't enough for parthood. If you say "Yes, it's a part," you stretch the concept of "object" to include things with their own reproductive goals. This shows the **Functional Criterion** breaking down.
  *   **The Tumor Case:** A tumor is genetically *more* unified with your body than bacteria are (it's your own DNA). It interacts causally with your organs. But it works *against* the body's function.
      *   *Restrictivist Trap:* If "Functional Unity" is the rule, is the tumor *not* a part of you? If so, your body has a hole in it where the tumor is. This suggests functional criteria make parthood vague or intermittent.
  *   **The Cloud Case:** A cloud has loose causal interaction (water droplets affecting local humidity) and loose spatial contact.
      *   *Restrictivist Trap:* If the CPU counts as an object because of tight integration, the cloud shouldn't. But we talk about clouds as objects. If the cloud counts, why not the "Shoe-Moon" connected by gravity? This shows the **Sorites** edge of the problem.

  ### 5. Summary for Your Course

  You should frame your insight this way:

  > "I am identifying a specific failure mode for **Moderate Restrictivism** known as the **Fragmentation Objection** (or the **Problem of Competing Unities**). While Universalism accepts all unities and Nihilism accepts none, Moderate Restrictivism attempts to filter composites based on relations like causation or function. However, because these relations come in degrees and are often denser *within* proper parts than *between* them, the filtering criteria risk validating the parts while invalidating the whole. This suggests that 'ordinary objects' may not be the privileged ontological units restrictivists intend to save, but rather arbitrary aggregates of smaller, more tightly unified systems."

  **Is it a distinct failure mode?**
  Yes. It is distinct from simple vagueness. Vagueness says "I don't know where the object ends." Fragmentation says "The criteria suggest the object *shouldn't exist* in favor of its parts."

  **Recommended Reading/Search Terms:**
  *   Look for discussions on **"Ontological Parsimony"** and **"Natural Joints."**
  *   Search for **"Peter Van Inwagen Material Beings"** (specifically his response to the "life" criterion and parasites).
  *   Search for **"Katherine Hawley Mereological Vagueness."**
  *   In philosophy of biology: **"Peter Godfrey-Smith Individuality."**

  You have correctly identified that the "glue" holding parts together is often stronger locally than globally, which threatens to dissolve the macroscopic world restrictivists want to preserve. That is a sophisticated metaphysical observation.
