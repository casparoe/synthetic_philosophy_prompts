answer: |-
  The phrase "the will of the people" functions less as a concept with a fixed referent than as a placeholder for competing theories of democratic legitimacy. In the context of your seminar, the speaker's dual usage suggests an equivocation that allows him to claim the authority of empirical majorities while evading the empirical measurement of them. Below is a menu of four distinct theses encoded by the phrase, analyzed for their coherence and their ability to support the speaker's two moves: (1) rejecting judicial review of majority legislation, and (2) dismissing conflicting empirical indicators of public opinion.

  ### 1. The Aggregative Thesis (Procedural Majoritarianism)
  *   **Precise Thesis:** The will of the people is the output of a specified aggregation procedure (e.g., simple majority vote) applied to the actual, current preferences of all eligible citizens.
  *   **Status:** **Substantive and defensible** as a normative commitment to equality, but **ontologically fragile**. As social choice theory demonstrates (e.g., Condorcet cycles), majority preferences can be intransitive; on this reading, "the will" is often mathematically undefined rather than merely contested.
  *   **Support for Move 1 (Anti-Court):** **Strong.** If the legislation is the output of the designated procedure, the court lacks the democratic authority to override it.
  *   **Support for Move 2 (Dismissal):** **None.** This reading makes the identification question paramount. If elections, referendums, and polls conflict, the aggregative will is either undefined or procedure-dependent. Dismissing the question ignores the possibility that no coherent "will" exists to be defended.

  ### 2. The Idealized Thesis (Rousseauian/Deliberative)
  *   **Precise Thesis:** The will of the people is a counterfactual construct: what the citizenry *would* endorse under conditions of full information, rational deliberation, or what objectively serves their long-term interests (the "real will"), regardless of actual expressed preferences.
  *   **Status:** **Substantive and defensible** in political theory, but **epistemically opaque**. It posits a truth about the public good that is independent of immediate voting behavior.
  *   **Support for Move 1 (Anti-Court):** **Weak/Ambiguous.** If the will is about long-term rights or principles, a constitutional court might be *better* situated to discern it than a transient legislative majority. This reading does not inherently privilege the legislature.
  *   **Support for Move 2 (Dismissal):** **Strong.** Conflicting empirical data (polls vs. votes) are merely noise obscuring the latent, idealized will. The speaker can wave off the question by implying that none of these metrics capture the "true" deliberative outcome.

  ### 3. The Moral Unity Thesis (Populist Exclusion)
  *   **Precise Thesis:** "The people" is not the whole electorate but a morally homogeneous body defined in opposition to a corrupt elite. A numerical majority that supports the elite is not "the people," while a minority that supports the populist leader is.
  *   **Status:** **False to the point of incoherence** as a descriptive claim about the electorate, though **substantive** as a strategy of political mobilization. It renders the concept unfalsifiable: any opposition is by definition excluded from "the people."
  *   **Support for Move 1 (Anti-Court):** **Strong.** Constitutional courts are paradigmatically "elite" institutions. If they block the leader's legislation, they are blocking the "true people," regardless of constitutional text.
  *   **Support for Move 2 (Dismissal):** **Strong.** Empirical metrics are irrelevant if they fail to capture the moral unity of the "real people." If polls contradict the leader, the polls are elite manipulations; if elections contradict the leader, the system is rigged. The will is intuited, not measured.

  ### 4. The Performative Thesis (Decisionism)
  *   **Precise Thesis:** The will of the people does not exist prior to political action; it is constituted by the successful claim to speak for it. The speech act creates the will; it does not report it.
  *   **Status:** **Substantive** as a description of how power operates, but **normatively hollow**. It reduces legitimacy to effectiveness.
  *   **Support for Move 1 (Anti-Court):** **Conditional.** It supports the move only if the legislature (or leader) is currently winning the struggle to define the will. If the court successfully claims to speak for the people, the will shifts.
  *   **Support for Move 2 (Dismissal):** **Strong.** The question presupposes a pre-existing will to be discovered. On this reading, asking how to identify the will is a category error; the will is whatever the speaker says it is in this moment.

  ### Conclusion
  The speaker is most likely helping himself to **Reading 3 (The Moral Unity Thesis)**, potentially underwritten by **Reading 4 (The Performative Thesis)**. He requires a reading that grants the normative weight of majoritarianism to the legislature (Move 1) without subjecting that legislature to the constraints of actual majoritarian measurement (Move 2). Only the Populist/Moral Unity reading allows him to claim the mantle of "the majority" while treating contradictory empirical evidence as irrelevant artifacts of elite corruption.

  However, this reading cannot be defended without circularity. To identify "the people," one must identify the true leader; to identify the true leader, one must identify who speaks for "the people." The argument insulates itself from empirical refutation by redefining the subject of the sentence ("the people") whenever the predicate ("the will") becomes inconvenient.

  \answer{the moral unity thesis — substantively potent but circular}
