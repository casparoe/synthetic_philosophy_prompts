answer: |-
  This is an excellent pivot. You are right to identify phlogiston as a sharper stress test for Semantic Externalism than Twin Earth. Twin Earth assumes successful reference (water refers to H₂O, twater to XYZ) and tests the *content* of that reference. Phlogiston tests the *precondition* of reference itself: can a causal chain exist if the putative cause does not?

  Here is a breakdown of the phlogiston case through the lens of Putnam/Kripke-style Causal-Historical Theory (CHT), contrasted with Descriptivism, with specific attention to where the theory holds and where it goes silent.

  ### 1. The Causal-Historical Analysis: Three Stages

  Under CHT, reference is fixed by an initial "baptism" (ostension or description) and transmitted via a causal chain of communication. The term "phlogiston" is treated as a natural kind term (like "water" or "gold").

  **Stage 1: Becher and Stahl (The Baptism)**
  *   **The Act:** They posit a substance to explain combustion. They attempt to baptize the "fire principle" released during burning.
  *   **CHT Verdict:** **Reference Failure.**
  *   **Reasoning:** For a natural kind term to refer, there must be a causal interaction between the baptizers and the kind. Becher and Stahl interacted with *combustion phenomena* (flames, ash, heat), but they misidentified the causal structure. They posited a *release* of substance $X$. In reality, there is no substance $X$ released.
  *   **The Chain:** There is a causal chain of *word usage* (people talking to people), but there is no causal chain of *reference fixation* (people interacting with the object). In CHT terms, the anchor is missing. The term is an "empty natural kind term" (analogous to "unicorn" or "witch").

  **Stage 2: Priestley (The Complication)**
  *   **The Act:** Priestley isolates oxygen but describes it as "air deprived of phlogiston."
  *   **CHT Verdict:** **Continued Reference Failure (for "phlogiston"); Successful Reference (for "dephlogisticated air").**
  *   **Reasoning:** Priestley is causally linked to the *word* "phlogiston" via the linguistic community (Stahl -> teachers -> Priestley). However, since the original baptism failed, Priestley inherits the emptiness. He is using a term that has no extension.
  *   **Nuance:** When Priestley says "dephlogisticated air," he is using a definite description. That description *does* pick out oxygen (air that supports combustion best). But he is not successfully using the term "phlogiston" to refer to oxygen. He is using the *absence* of the (nonexistent) phlogiston to describe the (existent) oxygen.

  **Stage 3: Lavoisier (The Termination)**
  *   **The Act:** Lavoisier demonstrates weight gain during calcination and posits oxygen as the additive element.
  *   **CHT Verdict:** **Confirmation of Emptiness.**
  *   **Reasoning:** Lavoisier effectively performs a new baptism for "oxygen." He severs the causal chain for "phlogiston" by declaring the theory false. From an externalist view, Lavoisier didn't change the reference of "phlogiston"; he revealed that "phlogiston" had never referred to anything, and "oxygen" refers to something else entirely.

  ### 2. Did the Causal Chain Redirect?

  **Question:** *Does Priestley's dephlogisticated air count as the causal chain getting redirected from a nonexistent substance over to oxygen?*

  **Externalist Answer:** **No.**
  Standard CHT is rigid here. A causal chain cannot "redirect" to a different entity unless the original baptism was sufficiently vague to encompass the new entity.
  *   The original baptism for phlogiston was theoretically loaded: "the substance *released* during combustion."
  *   Oxygen is the substance *consumed* during combustion.
  *   These are logically and causally incompatible roles.

  If Priestley had pointed to a sample of oxygen and said, "This is what Stahl *actually* meant by phlogiston," CHT might allow a reference shift (a la Kripke's discussion of Gödel/Schmidt). But Priestley didn't do that. He maintained the theory that phlogiston was *leaving* the body. Therefore, under strict externalism, Priestley was indeed "talking past" the reality of oxygen, even while manipulating oxygen successfully. He was manipulating the *extension* (oxygen) while using a term with a failed *intension* (phlogiston).

  **Where the theory struggles:** CHT implies a binary: either you are on the chain for $X$, or you aren't. It struggles to account for the fact that Priestley was *partially* right. He was causally connected to oxygen, and he used the word "phlogiston" in the explanation. Externalism lacks the granularity to say "the term partially referred to oxygen" without violating its own rules about underlying essence.

  ### 3. The Descriptivist Alternative

  **Question:** *Does phlogiston pick out whatever satisfies the description "the principle released in combustion," and what happens once Lavoisier shows combustion is combination?*

  **Descriptivist Answer:** **Reference Failure via Falsification.**
  *   **Pre-Lavoisier:** The term "phlogiston" is synonymous with the cluster of descriptions: "fire principle," "released during burning," "makes things combustible," etc. If nothing in the world fits this cluster, the term is empty. (Russell would say propositions containing "phlogiston" are false or truth-valueless).
  *   **Post-Lavoisier:** Lavoisier shows that nothing satisfies the core description ("released during burning"). Metals *gain* weight; they don't lose the principle. Therefore, the description is falsified.
  *   **The Difference:** Descriptivism handles the *theory change* more smoothly. It says: "The description changed/was falsified, so the reference vanished." CHT says: "The reference was always empty; we just found out."
  *   **The Problem for Descriptivism:** If Priestley used the description "the principle involved in combustion" (dropping 'released'), descriptivism might suggest the term *did* refer to oxygen all along. This makes the theory too plastic. It makes reference dependent on how loosely we interpret the descriptions. Externalism avoids this by locking reference to the actual causal structure, but at the cost of declaring Priestley's usage empty.

  ### 4. Implications for Externalism: Confirmation, Anomaly, or Silence?

  **Question:** *What does the episode show about externalism itself?*

  **Verdict:** **It is a Confirmation of the "Empty Kind" Category, but it exposes a Silence regarding Theory Change.**

  **1. Confirmation:**
  Putnam and Kripke explicitly allow for empty natural kind terms ("unicorn," "phlogiston"). The phlogiston case confirms the externalist intuition that meaning is not in the head. Even though Stahl, Priestley, and Lavoisier all had different mental states and descriptions, the *world* decided the referent. Because the world contained no phlogiston, the term failed, regardless of how confident the speakers were. This supports the "meaning ain't in the head" thesis robustly.

  **2. The Anomaly (The "No-Reference" Stipulation):**
  You asked if there is a principled way to handle theoretical terms for nonexistent substances without just stipulating they fail.
  *   **Current Externalist Move:** The standard move is indeed to stipulate failure. "Phlogiston" is treated like "Vulcan" (the planet).
  *   **The Problem:** This feels historically reductive. Priestley *discovered* oxygen. To say his term "phlogiston" referred to *nothing* ignores the causal contact he had with oxygen. It renders the history of science as a series of errors rather than approximations.

  **3. Where the Theory is Silent:**
  This is the most critical part of your request. Externalism is silent (or arguably inadequate) on **Partial Reference** and **Reference Evolution**.

  *   **Partial Reference:** Philosophers of science like Hardin and Rosenberg have argued that "phlogiston" partially referred to oxygen and partially to nitrogen (since some experiments labeled 'phlogisticated air' were actually nitrogen). Standard CHT has no mechanism for "partial reference." It demands a single underlying essence. If the essence doesn't exist, the term is empty. It cannot say "60% of the causal chain latched onto oxygen."
  *   **The Causal Chain of *Theory* vs. *Object*:** Externalism traces the chain of the *word*. In science, there is also a chain of *experimental practice*. Priestley's causal contact with oxygen was robust, even if his theoretical label was wrong. Externalism prioritizes the theoretical label (the "kind") over the experimental interaction. It is silent on how to weigh experimental success against theoretical failure.
  *   **Normativity:** Externalism is descriptive about how reference *works*, but it offers little normative guidance on how scientists *should* retain terms during revolutions. Should Priestley have kept "phlogiston" and redefined it? Externalism says "No, the chain is broken." But scientific practice often says "Yes, retain the term and update the theory" (e.g., "atom" went from indivisible to divisible, yet we kept the word). Externalism struggles to explain why "atom" survived reference-wise while "phlogiston" died, when both underwent massive theoretical shifts.

  ### Summary

  Running phlogiston through Putnam's externalism yields a clean but harsh result:
  1.  **Reference:** Failed from the start (Becher/Stahl) because the initial baptism lacked a real object.
  2.  **Priestley:** Did not redirect the chain; he successfully described oxygen using a phrase ("dephlogisticated air") while failing to refer using the noun ("phlogiston").
  3.  **Descriptivism:** Handles the falsification well but risks making reference too dependent on the specific wording of the theory.
  4.  **Externalism's Limit:** The theory confirms that "meaning ain't in the head," but it is silent on **degrees of reference**. It forces a binary (refer/fail) on a historical process that was gradual. It cannot easily account for the intuition that Priestley was *onto* something real (oxygen) even while using a "nonexistent" term, without resorting to a separate theory of "partial reference" that standard CHT does not provide.

  The phlogiston case shows that while Externalism is excellent at explaining why we *stopped* using the term (the world didn't cooperate), it is less equipped to explain the *continuity* of scientific inquiry that bridged the gap between phlogiston and oxygen.
