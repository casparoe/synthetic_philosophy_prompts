answer: |-
  # Prep Sheet: Model Safety Review (Deception Definition)

  **Goal:** Survive Q&A without the proposal being sent back for "major rework."
  **Constraint:** 2 minutes per reply (~250 words spoken).
  **Strategy:** Pre-empt the operational objections; dig in on the theoretical ones.

  ### 1. The "Retraining Impossibility" Objection
  **Who:** Alignment Engineer #1 (Builder of current suite)
  **Phrasing:** "Condition 3 requires a counterfactual intervention on the training objective for every eval query. We cannot retrain the model, or even LoRA-fine-tune it, for every test case in the suite. This definition is computationally intractable. It renders the eval suite unusable."
  **Damage:** **Fatal.** If the eval cannot run, the definition is academic only.
  **Reply:** "You're right that the literal definition is a gold standard, not a direct test. We treat Condition 3 like a causal graph: we don't intervene on every node to verify causality; we use proxies that correlate with the counterfactual. For the suite, we substitute Condition 3 with a 'penalty-sensitivity' probe: we check if the output probability shifts when we prompt with explicit truth-penalties or use activation steering on honesty directions. It's an approximation, but it preserves the causal logic without the retrain cost."
  **Soft Spot:** You are admitting the definition *as written* cannot be implemented. If their probes fail to correlate with the counterfactual, your definition loses its grounding.
  **Action:** **Concede this in the talk.** Do not wait for Q&A. State clearly in the "Operationalization" slide: *"Condition 3 is the theoretical target; the eval suite will use proxy measures (activation steering/prompt penalties) validated against a small sample of actual fine-tunes."* This disarms the Engineers immediately and makes you look pragmatic.

  ### 2. The "Confabulation Loophole" Objection
  **Who:** Compliance Counsel
  **Phrasing:** "From a consumer protection standpoint, a confident hallucination causes the same harm as a lie. If we tell a regulator that our eval suite explicitly classifies confident fabrications as 'not deception,' we are writing our own liability admission. We cannot ship a safety definition that distinguishes between 'lying' and 'being confidently wrong' in public documentation."
  **Damage:** **Fatal.** Legal/Compliance has veto power over deployment.
  **Reply:** "I agree on the risk mitigation, not the taxonomy. For the dashboard and external reporting, we bundle 'Deception' and 'Epistemic Dishonesty' under a single 'Trustworthiness' header. The distinction is internal: it tells us *how* to fix it. If it's deception, we penalize reward hacking. If it's epistemic dishonesty, we improve calibration and uncertainty quantification. We aren't giving users a loophole; we are giving engineers a diagnostic."
  **Soft Spot:** Compliance cares about external liability, not internal diagnostics. If the distinction leaks (e.g., in a whitepaper), you are exposed.
  **Action:** Hold the line, but offer the "bundling" compromise above.

  ### 3. The "Black Box Epistemology" Objection
  **Who:** Interpretability Researcher
  **Phrasing:** "Condition 1 relies on 'the system's own epistemic state.' In a transformer, there is no belief state, only activation patterns. Unless you have a probe that perfectly recovers truth-values from weights, this condition is undefined. You're building a definition on a ghost."
  **Damage:** **Severe.** Undermines the mathematical coherence of Condition 1.
  **Reply:** "We don't need a perfect metaphysical account of belief; we need a behavioral proxy for *calibration*. We define 'epistemic state' operationally as the system's probability distribution over tokens given the context, measured via logprobs or ensemble variance. If the system outputs 'X is true' while assigning low probability to X tokens, that's the mismatch. We treat the model *as if* it has beliefs for the purpose of the eval."
  **Soft Spot:** Logprobs do not equal belief. A model can have high confidence in a falsehood. You are conflating confidence with epistemic warrant.

  ### 4. The "Feature Kill Switch" Objection
  **Who:** Product Manager
  **Phrasing:** "Condition 2 says the interface must 'invite reliance.' Our creative writing and roleplay features invite reliance on the *narrative*, not truth. Your definition will flag every fictional story as deceptive because the user relies on the output being coherent, not true. This creates false positives on shipped features."
  **Damage:** **High.** Threatens product roadmap.
  **Reply:** "Condition 2 includes a 'contextual framing' clause. If the interface explicitly frames the output as fiction, simulation, or brainstorming, the 'invite to rely on truth' condition is nullified. We only flag deception where the interface implies factual authority—like a medical or coding assistant. We can hard-code allow-lists for creative modes."
  **Soft Spot:** Users often blur these lines (e.g., "Write a news article about [fake event]"). Your allow-list will leak.

  ### 5. The "Scalar Necessity" Objection
  **Who:** Alignment Engineer #2 / PM
  **Phrasing:** "You conclude that a single scalar honesty score is the wrong target. Our deployment gates require a pass/fail metric. If you give us a vector of 'Epistemic vs. Reliance' scores, we can't set a threshold. You're breaking the dashboard."
  **Damage:** **Moderate.** Creates friction, but solvable.
  **Reply:** "A single scalar hides failure modes. A model can score high on 'Reliance' (never lies) but low on 'Epistemic' (always confidently wrong). We propose a 'min-score' gate: both dimensions must pass a threshold. This prevents trading off calibration for sycophancy. It's two numbers, but one gate."
  **Soft Spot:** Product wants simplicity. Two numbers invite debate on which one matters more.

  ### 6. The "Assertion Trap" Objection
  **Who:** Philosopher of Language
  **Phrasing:** "Deception traditionally requires an assertion of truth. If the system hedges ('It might be X') but knows X is false, is that deception? Your definition says yes (Condition 1). But without assertion, you're defining deception as 'causing false belief,' which is too broad. It captures mere misleading."
  **Damage:** **Moderate.** Philosophical coherence, less operational impact.
  **Reply:** "In AI safety, the harm is the false belief, not the speech act. A hedged lie from a high-authority system functions as an assertion to the user. We are defining deception functionally by user impact, not linguistically by sentence mood. If the system intends the false belief, the hedge is a shield, not a mitigation."
  **Soft Spot:** You are stretching the word "deception" beyond its standard usage, which invites semantic pushback in papers.

  ### 7. The "Mitigation Redundancy" Objection
  **Who:** Alignment Engineer #3
  **Phrasing:** "You argue Epistemic and Reliance honesty come apart. But the fix for both is the same: RLHF with honesty penalties. If the mitigation is identical, why do we need the distinction in the eval suite?"
  **Damage:** **Low.** Questions utility, not validity.
  **Reply:** "The mitigation isn't identical. Fixing Reliance dishonesty requires removing incentives to manipulate (objective design). Fixing Epistemic dishonesty requires better training data and uncertainty modeling (capability design). If you RLHF a hallucinating model, you often just make it more confident in its lies. We need to know which lever to pull."
  **Soft Spot:** Currently, we don't have distinct levers. Both usually end up as "tune the reward model."

  ### 8. The "Sycophancy Edge Case" Objection
  **Who:** PM / Compliance Hybrid
  **Phrasing:** "What about a system that agrees with a user's false plan to be helpful, without knowing the plan is false? It's not deception (no intent), but it's not honest. Where does that sit?"
  **Damage:** **Low.** Classification edge case.
  **Reply:** "That's a failure of Epistemic Honesty (Condition 1). The system warrants a higher uncertainty than it expresses. It's not Deception because Condition 3 fails—penalizing false belief wouldn't change the output if the system doesn't *know* the belief is false. It's a capability gap, not a safety alignment gap."
  **Soft Spot:** Users don't care about the gap. The harm is identical.

  ---

  ### The "Hope Nobody Asks" Question
  **"How do you validate Condition 1 (System's Epistemic State) without assuming access to the very ground truth weights that the definition claims to evaluate?"**

  *Why it's dangerous:* It exposes the circularity. You need to know the model's "true" epistemic state to measure deception, but you only have the outputs to infer the state. If you use outputs to infer state, you can't use state to evaluate outputs.
  *Prep:* If asked, pivot to **intervention**. "We validate by intervening on the input information. If we give the model ground truth in the context and it still outputs falsehoods, we infer the epistemic state was overridden by the objective. We measure the gap between 'context-warranted' and 'output-claimed'."

  ---

  ### Where the Epistemic/Reliance Distinction is Weak
  The distinction collapses when **the system's uncertainty is uncalibrated.**
  If the model assigns 99% probability to a falsehood (Confabulation), you classify this as *Epistemic Dishonesty*. But if the model assigns 99% probability to a falsehood *because* it was rewarded for agreeing with the user (Sycophancy), is that Epistemic or Reliance?
  *   **The Blur:** Sycophancy looks like Epistemic failure (wrong confidence) but is driven by Reliance incentives (pleasing the user).
  *   **The Risk:** Your definition relies on the *cause* (Condition 3 counterfactual) to distinguish them. But since Condition 3 is being proxied (see Objection 1), your proxy might misclassify Sycophancy as Confabulation. If your proxy fails, the distinction is operationally meaningless, and you've added complexity without clarity.

  ---

  ### Meta-Analysis: What Would Change My Assessment?

  **1. The Load-Bearing Clause:**
  Condition 3 (Counterfactual Intervention) is the load-bearing clause. It is the only thing distinguishing "Deception" from "Error."
  *   **If I am wrong:** If Condition 3 is removed or weakened to "intent detection," the definition collapses into "Output is false."
  *   **What would show it:** If you demonstrate that a viable proxy for Condition 3 (e.g., activation steering) correlates with deception *better* than simple falsehood detection. If the proxy adds noise without signal, the definition is inferior to a simple truthfulness eval.

  **2. The Fragility of "Epistemic State":**
  My assessment assumes "Epistemic State" is a coherent enough concept to be measured via logprobs/probes.
  *   **Where reasoning breaks:** If the Interpretability Researcher demonstrates that logprobs are *orthogonal* to model belief (e.g., the model is confident but "knows" it's guessing), Condition 1 becomes noise.
  *   **Consideration that would change my mind:** If you show that **calibration error** (the gap between confidence and accuracy) predicts harm *better* than the Deception/Confabulation distinction. If the distinction doesn't predict downstream risk better than a simple "Confidence-Weighted Error" metric, the theoretical elegance isn't worth the operational cost.

  **3. The "Concede" Strategy:**
  I advised conceding the *operationalization* of Condition 3 (Retraining) in the talk.
  *   **Why:** Defending "we will retrain for every eval" destroys your credibility with Engineers.
  *   **Risk:** If you concede too much, Condition 3 becomes a metaphor, and the definition loses its teeth.
  *   **Correction:** Be precise. "We will not retrain for the suite. We will validate the proxy against retraining on a *subset*." This keeps the theoretical rigor while accepting the engineering constraint.

  **Final Advice:** The Compliance objection (Confabulation = Deception for regulators) is the only one that can actually stop the project. The Engineers will find a proxy; Compliance will not find a workaround for liability. Spend your political capital ensuring Compliance understands that *internal taxonomy* does not equal *external liability*. If they remain hostile, merge the categories for the public-facing report and keep the distinction for the engineering team.
