  The contemporary debate over whether knowledge-how is a species of knowledge-that has reached an impasse because it fights a question about constitution when the more revealing question is about loss. Current positions, whether intellectualist or anti-intellectualist, quietly assume that knowledge states are all-or-nothing affairs. They disagree only about where to place the non-epistemic machinery required for action, presuming that a subject either possesses the knowledge or does not. This proposal argues that this binary assumption obscures the phenomenology of skill and prevents the field from moving beyond the dissertation stage of static analysis. Skills decay gradually, rust, and exhibit savings on relearning, whereas we are habitually prone to treat knowing-that as something a subject either still has or has simply lost. By shifting the focus from what knowledge-how is made of to how it degrades, we can dissolve the stalemate. The central question driving this project is sharp and determinate: does treating knowledge-how as a state subject to gradual accessibility decay rather than binary possession resolve the stalemate between intellectualist and anti-intellectualist accounts of skill? If the answer is yes, the ontological dispute is revealed as a category error regarding the temporal stability of epistemic states, allowing the field to advance toward a dynamic model of epistemic resilience.

  The available positions leave this open because they are designed to account for successful attribution at a single time slice. They lack the resources to explain the expert who performs flawlessly in training and collapses under competitive pressure while still able to describe and correct the fault, together with its mirror image, in which being made to articulate what one is doing makes the doing worse. Standard arguments treat these as counterexamples to be explained away rather than reports on different stages of one process of degradation. If we allow that a state can be retained while partly inaccessible, the choking expert retains the knowledge-how but loses access to the procedural mechanisms, while the over-thinking expert suffers from an interference in access rather than a loss of the state itself. This approach beats the obvious alternatives because pure armchair analysis of skill attributions ignores the temporal dimension of decay, treating skills as static objects rather than processes, while importing a model of motor control from cognitive science reduces the epistemic question to a mechanical one. My method is conceptual but hostage to empirical claims, requiring a rigorous synthesis of philosophical analysis and established psychological data without running new experiments.

  The work plan for the year is divided into four distinct phases to ensure steady progress. In months one through three, I will construct the formal framework for epistemic degradation, defining the necessary and sufficient conditions under which a knowledge state counts as retained despite performance failure. This involves mapping the logical space between possession and access and drafting the initial chapters of the manuscript. During months four through six, I will apply this framework to the core cases of skill loss, specifically focusing on the phenomena of rustiness and savings in relearning. I will engage deeply with the empirical literature on motor learning and memory decay to ensure the conceptual model aligns with observed data regarding how skills diminish over time. The goal here is not to generate new data but to interpret existing consensus through an epistemological lens. In months seven through nine, I will test the framework against the strongest objections from both intellectualist and anti-intellectualist camps, refining the account to ensure it does not collapse into a mere verbal dispute. This phase involves presenting preliminary findings at workshops to gauge philosophical reception. The last three months, ten through twelve, will be dedicated to writing the resulting monograph or series of papers, ensuring the argument is presented with the precision required for publication in top-tier journals.

  A successful result would look like a unified model of degradation that explains why standard arguments fail when applied to decaying skills. It would demonstrate that the disagreement between camps is actually a disagreement about where to draw the line on a continuum of access rather than a disagreement about the nature of the state. Conversely, the project would count as having failed if the empirical claims regarding savings and gradual decay are shown to be inconsistent across different types of skills, or if the distinction between access and possession proves untenable upon rigorous logical analysis. If the phenomenon of choking cannot be distinguished from simple loss of knowledge without ad hoc modifications, the theory collapses. There is an honest statement of scope and risk required for a year in which I will run no experiments. The project is conceptual but will be hostage to some empirical claims, specifically those concerning the gradability of skill loss and the savings effect in relearning. I will handle this by restricting my claims to domains where the empirical consensus is robust, such as well-documented motor skills, and by framing the philosophical conclusions conditionally. If the empirical data shifts, the philosophical framework must be adjustable. The risk is that the empirical landscape is more fragmented than it appears, which would undermine the uniformity of the degradation model. However, this risk is mitigated by the fact that the philosophical contribution lies in the interpretation of the data rather than the data itself. Even if the empirical details vary, the conceptual move to prioritize access over constitution offers a new diagnostic tool for epistemology. This approach ensures that the fellowship yields a substantive contribution to the field regardless of minor fluctuations in the underlying science, provided the core phenomenon of gradual skill decay remains intact. The project thus moves beyond the dissertation by abandoning the quest for a static definition of knowledge-how in favor of a dynamic model of epistemic resilience and failure.
