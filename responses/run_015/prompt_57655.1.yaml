  Unmoved by them remains the public **count**.
  Unnecessary now is any **guess**.
  Forgotten is the texture of the **draw**.
  Irrelevant the contents of the **urn**.

  One private **draw** can shatter all the **line**,
  When **urn** is emptied for the public **count**,
  No more a **guess** depends upon the **ball**.

