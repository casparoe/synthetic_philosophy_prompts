  I asked my CEV oracle to resolve my career indecision. It convened a council of my extrapolated future selves to aggregate their volition. 

  **The Constraints:**
  1. **Volition:** Must reflect what I *would* want, not what I *do* want.
  2. **Coherence:** Preferences must be transitive (no Dutch Book vulnerabilities).
  3. **Quorum:** Requires unanimity across all future branches.

  **The Result:**
  Half my future selves were nihilists. The other half were wireheaders. The only policy that satisfied the coherence condition and passed unanimity was "Avoid situations where a bookie could exploit us."

  **Conclusion:**
  I now have a perfectly coherent utility function for staying in bed. My roommate says this is just decision theory with extra steps. He's right. The extra steps are where the hypothetical bookie drains your bank account until your preferences stop cycling.
