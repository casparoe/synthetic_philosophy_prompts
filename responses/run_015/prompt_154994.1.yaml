  7.  **Addressing the "Backsliding" Hypothesis:**
      *   *Hypothesis:* Backsliding isn't just eroding institutions; it's eroding the *shared past* that legitimizes those institutions.
      *   *Counter:* In weak states, "backsliding" might actually be "state building" through narrative force.
      *   *Verdict:* This is the dissertation hook. It reframes backsliding not as institutional decay but as *mnemonic conflict*.

  8.  **Drafting the Response (Iterative refinement):**
