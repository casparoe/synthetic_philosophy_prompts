      *   *The Mechanism:* Algorithmic curation + digital archives + diaspora networks = "Real-time mnemonic sovereignty."
      *   *The Political Theory Link:* Democratic backsliding. Does backsliding require a stable "nation" to slide *from*? Or is the instability of the national narrative part of the backsliding itself?

  3.  **Adopt the Persona (Senior Historical Sociologist):**
