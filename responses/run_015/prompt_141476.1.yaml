answer: |-
  ### 1. The Question

  **Question 3 (20 Marks)**

  Consider a social choice environment with $n \ge 3$ voters and $m \ge 3$ alternatives $\{A, B, C, \dots\}$. Preferences are strict. A fixed tie-breaking order $A \succ B \succ C \dots$ is known to all.

  **Plurality Rule:** Each voter names their top alternative. The alternative with the most votes wins (ties broken by the fixed order).
  **Favourite-Proofness:** A rule is *Favourite-Proof* if no voter can ever change the outcome from a non-favourite alternative to their favourite alternative by submitting a false ballot.
  **Mirror Rule:** Each voter names their *least* favourite alternative. The alternative with the *fewest* votes against it wins (ties broken by the fixed order).

  (a) Verify that Plurality is (i) Favourite-Proof, (ii) Onto, and (iii) Nondictatorial. [6 marks]

  (b) Plurality is not strategy-proof. Construct an explicit profile with 3 voters and 3 alternatives where a voter successfully manipulates Plurality. Show the truthful outcome, the lying ballot, the new outcome, and the manipulator's preferences proving the lie pays. [6 marks]

  (c) Is the Mirror Rule Favourite-Proof? Justify your answer with a profile or proof. What specific property *does* the Mirror Rule satisfy regarding a voter's least-favourite alternative? [5 marks]

  (d) In one or two sentences, explain why the Gibbard–Satterthwaite theorem requires full strategy-proofness rather than Favourite-Proofness. [3 marks]

  ***

  ### 2. Model Answer

  **(a) Plurality Properties**
  (i) **Favourite-Proof:** Let voter $i$'s favourite be $X$. Truthfully, $i$ votes for $X$. If $i$ lies, they vote for $Y \neq X$. This reduces $X$'s vote count by 1 and increases $Y$'s by 1. $X$ cannot win if its count decreases (unless it won already, in which case manipulation is unnecessary). Thus, $i$ cannot change the outcome from "Not-$X$" to "$X$" by lying.
  (ii) **Onto:** For any alternative $X$, if all voters rank $X$ first, $X$ receives $n$ votes and wins.
  (iii) **Nondictatorial:** If Voter 1 prefers $A$ and all others prefer $B$, $B$ wins (for $n \ge 2$). Voter 1 is not a dictator.

  **(b) Plurality Manipulation Profile**
  Voters: 1, 2, 3. Alternatives: $A, B, C$. Tie-break: $A \succ B \succ C$.
  **Truthful Profile:**
  V1: $A \succ B \succ C$ (Votes $A$)
  V2: $B \succ C \succ A$ (Votes $B$)
  V3: $C \succ A \succ B$ (Votes $C$)
  **Truthful Outcome:** Scores are $A=1, B=1, C=1$. Tie-break selects **$A$**.
  **Manipulation:** Voter 2 prefers $C$ to $A$. V2 lies and votes **$C$**.
  **New Outcome:** Scores are $A=1, B=0, C=2$. Winner is **$C$**.
  **Gain:** V2 outcome changes from $A$ to $C$. Since $C \succ_2 A$, the manipulation is successful. Note V2's favourite ($B$) did not win, consistent with Favourite-Proofness.

  **(c) Mirror Rule Analysis**
  The Mirror Rule is **not Favourite-Proof**.
  **Profile:** V1 ($A \succ B \succ C$), V2 ($B \succ A \succ C$), V3 ($C \succ B \succ A$). Tie-break $A \succ B \succ C$.
  **Truth:** V1 votes vs $C$, V2 vs $C$, V3 vs $A$. Scores (against): $A=1, B=0, C=2$. Winner **$B$**.
  **Lie:** V1 wants $A$. V1 lies and votes vs **$B$**.
  **New Scores:** $A=1, B=1, C=1$. Tie-break selects **$A$**.
  V1 successfully made their favourite win by lying.
  **Protected Property:** The Mirror Rule is *Worst-Proof*. A voter truthfully votes against their least-favourite ($Z$). Lying means voting against $Y \neq Z$, which reduces $Z$'s "against" score, helping $Z$ win. Thus, no voter can prevent their least-favourite from winning by lying.

  **(d) Conceptual Conclusion**
  Strategy-proofness quantifies over *all* preference improvements, not just elevating a favourite to winner. The Gibbard–Satterthwaite theorem prohibits *any* gain from lying; Favourite-Proofness permits gains involving second or third choices, which are common in strategic voting (e.g., compromising).

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks**

  1.  **Plurality Verification (6 marks)**
      *   **Must Hit:** Correctly argues that voting against favourite reduces favourite's score (2). Shows onto via unanimous profile (2). Shows nondictatorial via opposition profile (2).
      *   **Common Error:** Claiming Plurality is dictatorial because of tie-breaking, or failing to mention tie-breaking in the onto proof.

  2.  **Plurality Manipulation Profile (6 marks)**
      *   **Must Hit:** Profile has 3 voters, 3 alternatives (2). Truthful outcome is not manipulator's favourite (2). Lying changes winner to a preferred alternative (2).
      *   **Common Error:** Using a profile where the favourite wins truthfully (no incentive), or where the lie makes the favourite win (violates Favourite-Proofness premise).

  3.  **Mirror Rule Favourite-Proof Status (3 marks)**
      *   **Must Hit:** States "No" (1). Provides valid profile where favourite wins via lie (2).
      *   **Common Error:** Assuming symmetry implies it is Favourite-Proof, or constructing a profile where the tie-break does the work incorrectly.

  4.  **Mirror Rule Protected Property (2 marks)**
      *   **Must Hit:** Identifies it protects the bottom/least-favourite (1). Explains lying helps the worst alternative (1).
      *   **Common Error:** Vague phrasing like "protects the bottom" without explaining the mechanism (vote counts).

  5.  **Conceptual Conclusion (3 marks)**
      *   **Must Hit:** Distinguishes between "favourite winning" and "any improvement" (2). Links to GS antecedent (1).
      *   **Common Error:** Merely restating the theorem without addressing the "weakened premise" aspect of the question.

  ***

  ### 4. Notes for Instructor

  *   **Voter Minimality:** Three voters are sufficient for Part (b). The 1-1-1 tie is the cleanest case; ensure your tie-breaking convention ($A \succ B \succ C$) is consistent on the exam paper. If you change the order, check the profile still works.
  *   **Tie-Breaking Role:** In Part (c), the Mirror Rule example relies on a 3-way tie to let Voter 1 push $A$ to victory. Without the tie-break, $A, B, C$ might cycle or require 4 voters. The provided 3-voter profile works *with* the specified tie-break.
  *   **Student Pitfalls:** Strong students might try to prove Mirror Rule *is* Favourite-Proof by analogy. Watch for the "Compromise" logic: in Anti-Plurality, you vote against your worst to help your best. If your best is losing to your second-best, voting against the second-best (lying) helps the best. This breaks Favourite-Proofness.
  *   **Timing:** 30 minutes is tight for writing out full profiles. Advise students to use abbreviations (e.g., $V_1: ABC$) after defining them. If the class averages slower writing speeds, consider providing the tie-breaking order on a cover sheet to save reading time.
