      *   *Correction:* "Surrogate Endpoints." Mathematical consistency is the surrogate for "Physical Truth." We need to validate the surrogate. Has the surrogate been correlated with the true endpoint in previous trials? (i.e., did beautiful math lead to true physics before?)

  9.  **Final Review against Prompt:**
