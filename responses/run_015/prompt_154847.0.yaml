      *Wait, I need to be careful with (f).* (f) says deliberation generates understanding *endogenously*. If I bring in experts (even advisory), is it still endogenous? Technically, testimony is exogenous input. But deliberation *processes* that input. I should note this nuance.
      Actually, the strongest tension is **(f) vs (d)**.
      (f): Citizens need no prior knowledge; deliberation creates understanding.
      (d): Technical domains need expert commissions (implying citizens *can't* generate that understanding sufficiently to rule directly).
      If citizens can generate understanding endogenously (f), why do we need expert commissions with authority (d)?
