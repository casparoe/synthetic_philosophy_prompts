      *Cheapest fix for (f)/(d):* Modify (f) to acknowledge that deliberation requires *access* to expertise, even if it doesn't require *prior* knowledge.
      *Cheapest fix for (a)/(d):* Modify (d) to remove expert authority.

      *Which single revision resolves the most?*
      Revising **(d)** to make commissions **strictly advisory and subordinate** resolves:
