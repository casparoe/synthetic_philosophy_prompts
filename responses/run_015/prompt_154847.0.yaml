prompt: |-
  I'm working through my position on democratic reform and want a consistency check before I present it. I hold: (a) democratic legitimacy derives solely from equal ex ante selection probability, so sortition is the only genuinely democratic mechanism and elections are structurally oligarchic; (b) a modern state should have a single legislative chamber of 500 citizens selected by lot, serving one non-renewable five-year term, with authority over all policy domains; (c) descriptive representation—statistical mirroring of the population—is not a side effect of random selection but its core normative justification; (d) nevertheless, for technically complex domains such as monetary policy or pharmaceutical regulation, there should be permanent expert commissions appointed through competitive examination, with the citizen chamber confined to setting broad value-laden mandates; (e) the epistemic quality and deliberative reliability of citizen assemblies scale linearly with size, so a 500-person body can function as well as a 50-person one given identical facilitation; and (f) citizens require no prior civic education or domain knowledge to serve competently, because well-structured deliberation generates necessary understanding endogenously. Which pairs are genuinely in tension, which only appear so, and what is the least costly revision? Rank the tensions by severity, identify the cheapest fix for each, and tell me which single revision would resolve the most problems at once.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Position:**

      *   **(a) Legitimacy Source:** Solely equal *ex ante* selection probability (sortition). Elections = oligarchic.
      *   **(b) Institutional Design:** Unicameral legislature, 500 citizens, lot, 5-year non-renewable term, plenary authority.
      *   **(c) Normative Justification:** Descriptive representation (statistical mirroring) is the *core* justification, not a side effect.
      *   **(d) Expert Commissions:** Permanent expert bodies for technical domains (monetary, pharma), appointed via exam. Citizen chamber sets *broad value-laden mandates*.
      *   **(e) Scaling of Epistemic Quality:** Linear scaling with size (500 works as well as 50 given facilitation).
      *   **(f) Competence Requirement:** No prior civic/domain knowledge needed. Deliberation generates understanding endogenously.

  2.  **Initial Scan for Contradictions/Tensions:**

      *   *Tension 1: (a) vs. (d).* If legitimacy comes *solely* from sortition (a), how do expert commissions (d) have authority? If they make policy, isn't that oligarchic? The user says citizens set "mandates," but where is the line? If experts interpret mandates, they have power.
      *   *Tension 2: (c) vs. (d).* If descriptive representation is the *core* justification (c), then excluding descriptive bodies from technical domains undermines that core. It implies descriptive representation *isn't* good enough for technical stuff, contradicting the "solely" in (a) and the "core" in (c).
      *   *Tension 3: (b) vs. (e).* 500 people is quite large for deliberation. Claiming linear scaling (500 works as well as 50) is empirically contentious and theoretically risky. Large groups often suffer from coordination costs, social loafing, or factionalization.
      *   *Tension 4: (f) vs. (d).* If deliberation generates understanding endogenously (f), why do we need expert commissions for technical domains (d)? If citizens can learn anything through deliberation, technical complexity shouldn't require a separate expert body.
      *   *Tension 5: (a) vs. (b).* (b) specifies a 5-year term. Is a 5-year term consistent with "equal ex ante selection probability" as the *sole* source of legitimacy? Long terms create a distinct class of rulers, potentially reintroducing oligarchic dynamics (professionalization of the lot).
      *   *Tension 6: (c) vs. (f).* If descriptive representation is the *core* justification (c), does it matter if they are ignorant (f)? Usually, descriptive rep is valued because lived experience matters. If *only* deliberation matters (f), then descriptive mirroring is less crucial than cognitive diversity. But (c) says mirroring is core.

  3.  **Detailed Analysis of Specific Pairs:**

      *   **Pair (a) & (d): The Legitimacy/Expertise Tension.**
          *   *Conflict:* (a) says *only* sortition is democratic. (d) creates appointed expert bodies with policy authority.
          *   *Severity:* High. This strikes at the definition of democracy in the system.
          *   *Fix:* Clarify that experts are purely advisory or strictly bound by algorithmic implementation of citizen mandates.

      *   **Pair (c) & (d): The Descriptive/Technocratic Tension.**
          *   *Conflict:* (c) says mirroring is the *core* justification. (d) says for important stuff (money/health), mirroring isn't enough; we need exams. This implies mirroring isn't actually the core justification for *governance*, only for *values*.
          *   *Severity:* High. It undermines the normative foundation.
          *   *Fix:* Reframe (c) to say descriptive rep ensures *interests* are represented, but epistemic quality requires hybrid models. Or remove (d).

      *   **Pair (f) & (d): The Endogenous Knowledge/Expert Commission Tension.**
          *   *Conflict:* (f) says citizens learn what they need through deliberation. (d) says some domains are too technical for citizens, requiring experts.
          *   *Severity:* Very High. This is a direct logical contradiction. If (f) is true, (d) is unnecessary. If (d) is necessary, (f) is false.
          *   *Fix:* Modify (f) to acknowledge limits of deliberation on technical facts.

      *   **Pair (b) & (e): The Size/Deliberation Tension.**
          *   *Conflict:* (b) sets size at 500. (e) claims 500 deliberates as well as 50. Social science suggests deliberation quality drops as size increases beyond small groups (unless broken into committees, which isn't specified).
          *   *Severity:* Medium. This is more empirical/practical than normative.
          *   *Fix:* Acknowledge committee structures or reduce size.

      *   **Pair (a) & (b): The Term Length Tension.**
          *   *Conflict:* 5 years is a long time. It creates a "political class" even if selected by lot.
          *   *Severity:* Low/Medium.
          *   *Fix:* Shorten terms or rotate membership.

  4.  **Ranking Tensions by Severity:**

      1.  **(f) vs. (d):** Logical contradiction. You can't say "citizens learn everything needed via deliberation" AND "citizens can't handle technical domains without experts."
      2.  **(a) vs. (d):** Normative contradiction. "Solely sortition is democratic" vs. "Appointed experts have authority."
      3.  **(c) vs. (d):** Justificatory inconsistency. "Mirroring is core" vs. "Mirroring doesn't work for tech policy."
      4.  **(b) vs. (e):** Empirical/Practical feasibility. 500 people deliberating together is unwieldy.
      5.  **(a) vs. (b):** Potential oligarchic drift via long terms.

  5.  **Identifying the "Cheapest Fix" for Each:**

      *   *(f)/(d):* Qualify (f). Admit deliberation needs expert *testimony*, even if decision power remains with citizens.
      *   *(a)/(d):* Redefine experts as servants/advisors with no veto power.
      *   *(c)/(d):* Shift (c) from "mirroring" to "equality of opportunity to rule."
