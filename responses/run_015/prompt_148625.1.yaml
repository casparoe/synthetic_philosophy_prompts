answer: |-
  # The 45-Minute Mechanism Integrity Protocol (MIP)

  **Purpose:** To rapidly evaluate whether a proposed resource allocation mechanism is strategy-proof within the consortium's specific constraints, or if manipulation is theoretically unavoidable.
  **Prerequisites:** Whiteboard, marker, printed copies of the proposed mechanism's rulebook.
  **Participants:** Referee (Facilitator) + Board Members.

  ### Phase 1: The Impossibility Filter (15 Minutes)
  *Goal: Determine if the mechanism falls into the Gibbard-Satterthwaite (G-S) "Impossible Trinity."*

  **Step 1: The Alternative Count Check**
  *   **Question:** Does the mechanism allocate resources among three or more distinct project proposals in a typical quarter?
  *   **Sufficient Answer:** Yes (≥ 3).
  *   **Stopping Rule:** If **No** (only 2 projects), G-S does not apply. Proceed to human judgment on simplicity. If **Yes**, proceed to Step 2.

  **Step 2: The Domain Constraint Check**
  *   **Question:** Does the mechanism allow voters to submit *any* transitive partial ordering (including ties and explicit abstentions) without restricting which projects can be ranked where?
  *   **Sufficient Answer:** Yes (Unrestricted Domain over partial orders).
  *   **Stopping Rule:** If **No** (e.g., voters must have single-peaked preferences), the mechanism *might* be strategy-proof. **Refer to Human Judgment** (requires expert review of the restriction). If **Yes**, proceed to Step 3.

  **Step 3: The Determinism Check**
  *   **Question:** Is the outcome fully determined by the submitted votes, or does the mechanism use a lottery/random tie-breaker for the final allocation?
  *   **Sufficient Answer:**
      *   *Deterministic:* Proceed to Step 4.
      *   *Randomized:* Proceed to Step 4 (Note: Gibbard's 1977 extension applies; strategy-proofness is even harder to achieve).

  **Step 4: The Dictatorship Check**
  *   **Question:** Is there any single voter (or lab) whose strict preference for any project *always* determines the winner, regardless of others' votes?
  *   **Sufficient Answer:**
      *   *Yes:* The mechanism is **Strategy-Proof** but **Violates Consortium Constraints** (Non-dictatorial).
      *   *No:* Proceed to Step 5.

  **Step 5: The G-S Verdict**
  *   **Logic:** If Steps 1, 2, and 4 are "Yes" (≥3 alternatives, Unrestricted Domain, Non-Dictatorial), the mechanism is **Theoretically Manipulable**.
  *   **Action:** Mark as **FAIL (Strategy-Proofness Unavoidable)**.
  *   **Board Decision:** Do we accept the manipulation risk, or relax a constraint (e.g., allow dictatorship or restrict domain)?

  ### Phase 2: The Partial-Order Stress Test (15 Minutes)
  *Goal: Identify specific manipulation vectors introduced by abstention/ties.*

  **Step 6: The Abstention Penalty Check**
  *   **Question:** How does the mechanism score an "abstention" or "tie"? (e.g., Is it scored as zero, average, or ignored?)
  *   **Sufficient Answer:** If abstention lowers a project's score relative to a ranking (e.g., Borda count where abstention = 0 points), voters have an incentive to rank low-preference projects artificially high to dilute competitors.
  *   **Stopping Rule:** If abstention is penalized, mark **HIGH MANIPULATION RISK**.

  **Step 7: The Tie-Breaking Vulnerability**
  *   **Question:** If a tie occurs, who or what breaks it? (e.g., Chair's vote, random lottery, previous quarter's winner).
  *   **Sufficient Answer:** If the tie-breaker is predictable, voters will manipulate their rankings to force or avoid a tie.
  *   **Stopping Rule:** If tie-breaking is deterministic and known, mark **MODERATE MANIPULATION RISK**.

  ### Phase 3: Final Classification (15 Minutes)
  *Goal: Assign status and identify judgment points.*

  **Step 8: The Classification**
  *   **Category 1 (Impossible):** Passes Steps 1, 2, 4 (Non-dictatorial, Unrestricted, ≥3). **Verdict:** Manipulable.
  *   **Category 2 (Dictatorial):** Fails Step 4. **Verdict:** Strategy-Proof but Non-Compliant.
  *   **Category 3 (Restricted):** Fails Step 2. **Verdict:** Potentially Strategy-Proof (Requires Expert Proof).

  **Step 9: The Irreducible Judgment Point**
  *   **Instruction:** The procedure identifies *if* a mechanism is manipulable. It cannot decide *if that matters*.
  *   **Action:** Board must vote: "Do we prioritize Strategy-Proofness (requiring Dictatorship/Domain Restrictions) or Democratic Constraints (accepting Manipulation)?"

  ---

  # Application to Proposed Mechanisms

  ### Mechanism A: Pairwise Majority with Borda Fallback
  *   **Step 1 (Alternatives):** Yes (≥3 projects).
  *   **Step 2 (Domain):** Yes (Partial rankings allowed).
  *   **Step 3 (Determinism):** Yes (Borda resolves cycles).
  *   **Step 4 (Dictatorship):** No (Majority rule).
  *   **Step 5 (G-S Verdict):** **FAIL.** Falls squarely into the Impossible Trinity.
  *   **Step 6 (Abstention):** Abstentions scored as zero. **HIGH RISK.** Voters will rank all projects to avoid zero-scoring their favorites relative to others.
  *   **Landing Point:** **Category 1 (Impossible).**
  *   **Board Action:** Reject as strategy-proof. Acknowledge that Condorcet cycles + Borda scoring creates dual incentives for tactical voting (burying strong rivals + inflating weak ones).

  ### Mechanism B: Rotating Dictatorship with Transparency
  *   **Step 1 (Alternatives):** Yes.
  *   **Step 2 (Domain):** Yes.
  *   **Step 3 (Determinism):** Yes.
  *   **Step 4 (Dictatorship):** **YES.** For the specific quarter being evaluated, the designated lab is a dictator.
  *   **Landing Point:** **Category 2 (Dictatorial).**
  *   **Board Action:** Technically, this mechanism is strategy-proof *for the dictator* and irrelevant for others. However, it **Violates Consortium Constraints** (Non-dictatorial).
  *   **Political/Ethical Conflict:** This is the **Politically Unacceptable** verdict. The procedure classifies it as "Dictatorial," which sounds authoritarian to the board. However, because the dictatorship rotates, the board views it as "Fair over time." The procedure cannot capture inter-temporal fairness; it only evaluates the single-shot mechanism. The board must decide if "Rotating Dictatorship" counts as "Non-dictatorial" in their bylaws. If they strictly follow the procedure, they must reject it. If they value long-term equity over single-shot strategy-proofness, they must override the procedure.

  ### Mechanism C: The Humble-Aggregation Proposal
  *   **Step 1 (Alternatives):** Yes.
  *   **Step 2 (Domain):** Yes.
  *   **Step 3 (Determinism):** **No.** (Random selection among top-cycle).
  *   **Step 4 (Dictatorship):** No.
  *   **Step 5 (G-S Verdict):** **FAIL.** (Gibbard 1977 applies to randomized rules).
  *   **Step 6 (Abstention):** Explicitly allows withholding preferences to "shrink the intersection."
  *   **Landing Point:** **Category 1 (Impossible).**
  *   **Board Action:** Reject. The mechanism *admits* manipulability in its own description ("voters can strategically withhold").
  *   **Ethical Conflict:** This is the **Ethically Unacceptable** verdict. The mechanism is branded "Humble" and "Ethical," but the procedure reveals it institutionalizes information hiding. Adopting it rewards labs for being less transparent about their epistemic states, directly contradicting the consortium's long-termist mission of truth-seeking.

  ---

  # Limitations & False-Negative Risks

  **1. The Boundary of Formal Proof**
  The MIP procedure relies on the Gibbard-Satterthwaite theorem and its extensions. It can confidently identify mechanisms that are *manipulable* (Category 1). It **cannot** prove a mechanism is *strategy-proof* without formal mathematical verification.
  *   **Risk:** If a mechanism claims to escape the Impossible Trinity by restricting the domain (Step 2 = No), the checklist stops and refers to human judgment. A false negative occurs if the board accepts a "Restricted Domain" claim that is not actually robust (e.g., voters can easily construct a profile that violates the restriction). **Full formal proof is required here.**

  **2. The "Randomization" Blind Spot**
  Step 3 treats randomized mechanisms similarly to deterministic ones. However, strategy-proofness in expectation (for lotteries) is distinct from ex-post strategy-proofness. The checklist flags them as high-risk but cannot quantify the *degree* of manipulability without expected-utility calculations.

  **3. Collusion vs. Individual Manipulation**
  G-S addresses individual manipulation. The MIP does not detect vulnerabilities to *coalitional* manipulation (groups of labs coordinating votes). A mechanism might pass the checklist as "individually strategy-proof" (e.g., a specific restricted domain rule) but collapse under collusion.

  **4. The Irreducible Judgment Point**
  The procedure ends at Step 9. It cannot tell the board whether the *cost* of manipulation is higher than the *cost* of relaxing constraints (e.g., accepting a rotating dictator). This is a normative political decision, not a technical one.

