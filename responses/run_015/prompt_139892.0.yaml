  1. Our precedents support a procedural rule mandating disclosure and appeals regardless of metric performance, and a substantive rule permitting error disparities if statistically indistinguishable from noise or mitigated by audit. They also establish that single thresholds are mandatory for contestability, even if they produce disparate errors.

  2. A procedural rule predicts approval with conditions since disclosure and appeals are present, whereas a strict calibration rule predicts rejection because the score implies different eligibility probabilities in the decision band. An error-parity rule predicts rejection due to the 1.9x disparity, unless the statistical noise claim invokes the Winter 2022 precedent.

  3. Case Three is the closest analogue because it approved a model with known error disparities under conditions, though the current calibration failure in the decision band resembles Case One's rejection ground. Its carry is limited because the 1.9x disparity exceeds Case Three's 1.3x, and the statistical uncertainty argument relies on Case Two's logic rather than Case Three's trade-off acceptance.

  4. I should argue for approval with conditions, as rejecting would contradict Case Three's willingness to accept unranked criteria disparities when procedural safeguards exist. This commits us to a principle of procedural sufficiency over metric perfection, whereas rejection would commit us to an unstated numerical cap on allowable disparity.

  5. The distinguishing case would involve a model with identical error disparities and calibration failure but without the statistical noise cover, forcing a choice between metric thresholds and procedural fixes. Alternatively, a proposal to recalibrate the score for the specific pool despite vendor constraints would test whether single thresholds are truly absolute or merely default.
