      You've identified a genuine tension, but I think you're conflating two different moral categories. The argument from shared institutions—let's call it the coercive order argument—isn't merely about causal interaction; it's about the legitimacy of collective self-determination. When we share a state, we are jointly authoring a coercive order that dictates the terms of our lives. That specific relationship generates duties of justice among us to ensure that order is fair. Climate change invokes a different duty: the universal negative duty not to harm. Acknowledging that we owe strangers a duty not to poison their atmosphere doesn't dissolve the special project of maintaining a just reciprocal scheme among citizens. One is a duty of humanity; the other is a duty of citizenship. They can coexist without one swallowing the other.

