answer: |-
  ### Conceptual Brainstorming and Distinctions

  Before diagnosing the argumentative pattern, we must map the metaethical terrain where this oscillation occurs. The tension you describe sits at the intersection of three major debates:

  1.  **Internalism vs. Externalism about Reasons:**
      *   **Internalism (e.g., Bernard Williams):** A reason must be grounded in the agent's "subjective motivational set." If an agent has no desire or interest that would be served by $\phi$-ing, there is no reason for them to $\phi$.
      *   **Externalism (e.g., Derek Parfit, T.M. Scanlon):** Reasons can exist independently of an agent's contingent desires. There can be reasons for an agent to act even if doing so connects to nothing they currently care about.
      *   *The Pattern:* The speaker begins with an Externalist claim (reasons exist without human interest) but retreats to an Internalist claim (reasons depend on our concerns) when challenged.

  2.  **Robust Realism vs. Constructivism/Response-Dependence:**
      *   **Robust Realism (e.g., David Enoch, Russ Shafer-Landau):** Normative facts are mind-independent. They would exist even if no minds existed to grasp them.
      *   **Constructivism/Response-Dependence (e.g., Christine Korsgaard, John McDowell):** Normativity is constituted by rational agency or human sensibility. Values are real, but their existence is tied to the possibility of a valuer.
      *   *The Pattern:* The speaker claims Robust Realism (value without observers) but retreats to Response-Dependence (value for critics/viewers) under pressure.

  3.  **The Dialectical Structure (Motte-and-Bailey vs. Equivocation):**
      *   **Motte-and-Bailey:** A speaker asserts a controversial, high-value claim (Bailey) and, when challenged, retreats to a trivial, defensible claim (Motte), pretending the Motte secures the Bailey.
      *   **Equivocation:** Using a word in two different senses within an argument.
      *   *The Pattern:* You note this is *not* straightforward equivocation because the speaker treats the positions as *continuous*. This suggests the speaker believes the Internalist/Subjective account *just is* the explanation of the Externalist/Objective account, without providing the metaphysical bridge to justify that identity.

  ### Analysis of Existing Terminology

  Is there an established term for this?

  *   **"Motte-and-Bailey":** This is the closest existing fit. The "Bailey" is the robust, mind-independent realism (strong normative force), and the "Motte" is the human-relative, psychological account (metaphysically safe). However, standard Motte-and-Bailey implies a tactical retreat where the speaker knows (implicitly) the claims differ. Your description suggests the speaker sees them as *continuous*.
  *   **"Quasi-Realism" (Simon Blackburn):** This describes a projectivist who earns the right to talk *as if* they were a realist. However, Quasi-Realists are explicit that they are projectivists at the metaethical level. The speaker you describe claims *literal* realism initially.
  *   **"Quietism":** This involves refusing to answer metaphysical questions. The speaker here *does* answer them, but by shifting the metaphysical ground.

  **Verdict:** There is no single, standard term in the metaethical literature that precisely captures this *dialectical oscillation grounded in a conflation of normative sources*. While it is a species of Motte-and-Bailey, the specific metaethical confusion warrants a more precise label to distinguish it from tactical ambiguity.

  ### Proposed Term: **Normative Grounding Slippage**

  I propose the term **Normative Grounding Slippage** (or simply **Grounding Slippage**).

  #### Definition
  **Normative Grounding Slippage** is a dialectical maneuver in which an arguer oscillates between two incompatible metaphysical accounts of normativity to preserve both the *authority* of objective reasons and the *plausibility* of subjective grounding.
  1.  **Phase 1 (Authority Claim):** The arguer asserts that normative reasons possess **mind-independent validity** (Externalism/Realism) to secure strong normative conclusions (e.g., "Nature has value regardless of us").
  2.  **Phase 2 (Grounding Retreat):** When challenged on the metaphysics of mind-independent reasons, the arguer retreats to **mind-dependent grounding** (Internalism/Response-Dependence) (e.g., "Humans have reasons to care").
  3.  **The Slippage:** The arguer treats these two positions as metaphysically continuous or identical, failing to acknowledge that the retreat in Phase 2 undermines the ontological commitment required for Phase 1.

  #### Boundary Conditions and Distinctions

  To ensure this concept is distinct, we must delineate it from neighboring phenomena:

  1.  **Vs. Motte-and-Bailey:**
      *   *Motte-and-Bailey:* The arguer implicitly acknowledges the claims are different and uses the Motte as a defensive shield.
      *   *Grounding Slippage:* The arguer explicitly or implicitly claims the two positions are *the same view*. The error is not just tactical but conceptual (a confusion about what grounds normativity).
  2.  **Vs. Ordinary Equivocation:**
      *   *Equivocation:* Relies on lexical ambiguity (e.g., "bank" of a river vs. financial "bank").
      *   *Grounding Slippage:* Relies on *metaphysical* ambiguity. The word "reason" retains its normative sense, but its *truth-conditions* shift from objective facts to subjective states without admission.
  3.  **Vs. Context-Sensitive Normativity:**
      *   Some theories (e.g., Contextualism) hold that the truth of normative claims varies by context.
      *   *Grounding Slippage:* The speaker claims the reason exists *simpliciter* in Phase 1, not just "in this context." The retreat is not a contextual adjustment but an ontological downgrade.
  4.  **Vs. Legitimate Bridge Theories (e.g., Constitutivism):**
      *   Philosophers like Korsgaard or McDowell argue that objective norms *arise from* the structure of agency or sensibility. They attempt to *argue* for the continuity between the subjective source and objective authority.
      *   *Grounding Slippage:* Occurs when this continuity is *asserted rhetorically* without the requisite philosophical argument. It is the *unargued assumption* that subjective concerns can generate mind-independent authority.

  #### Scope: Practical vs. Epistemic Reasons

  Does this pattern occur only with practical reasons (what to do)? **No.** It arises equally with epistemic reasons (what to believe).

  *   **Case:** A scientist claims, "The evidence supports Theory X even if no one ever discovers it" (Mind-independent epistemic realism).
  *   **Challenge:** "How can 'support' exist without a cognitive agent to process the inference?"
  *   **Retreat:** "Well, any rational observer *would* be convinced by it" (Idealized response-dependence).
  *   **Slippage:** Treating "evidence exists" and "observers would be convinced" as the same claim.
  *   **Analysis:** This is **Epistemic Grounding Slippage**. It conflates the *truth-maker* (the world) with the *warrant* (our access to it).

  ### Limits of Analysis and Weakest Step

  #### Limits
  1.  **Charity Principle:** This analysis assumes the speaker is not articulating a sophisticated form of **Response-Dependent Realism** (e.g., McDowell's "Second Nature"). If the speaker holds that values are real *because* they are inextricable from human sensibility, they are not slipping; they are stating a coherent (if contested) metaphysical view. My diagnosis applies only when the speaker *initially posits* mind-independence and *only retreats* under pressure.
  2.  **Implicit vs. Explicit:** Much of this oscillation happens implicitly. Identifying it requires reconstructing the speaker's committed premises, which introduces interpretive risk.
  3.  **Harmless Conversational Repair:** Sometimes speakers simplify complex metaphysical views for lay audiences. If a philosopher says "Value is objective" to a student, then clarifies "It depends on rational agents" when pressed, this may be pedagogical simplification, not fallacious slippage. The fallacy requires that the speaker treats the simplification as *metaphysically sufficient* for the original claim.

  #### The Weakest Step
  The weakest step in my reasoning is the **distinction between Grounding Slippage and clumsy Constitutivism.**

  Many contemporary metaethicists (e.g., Korsgaard, Velleman) argue precisely that normativity is grounded in agency, yet *feels* or *functions* as objective. They argue that the "objective" force of a reason *just is* the inescapability of rational agency.
  *   **Risk:** If the speaker is a crude Constitutivist, my label ("Slippage") pathologizes a legitimate philosophical project.
  *   **Condition for Revision:** If it can be demonstrated that the speaker's "retreat" is actually a consistent application of a **Kantian Constructivist** framework (where objectivity is defined *through* intersubjective rationality rather than mind-independence), then the charge of "Slippage" fails. The phenomenon would then be better described as **"Unarticulated Constructivism."**
  *   **Empirical Consideration:** To confirm Grounding Slippage, one must verify that the speaker *rejects* Constructivism when not under pressure (e.g., they affirm "Nature has value even if no rational agents existed" in Phase 1). If they affirm that, then retreat to agent-relativity in Phase 2, the contradiction is real, and the label holds. If they consistently hold that "value requires a valuer" but express it poorly in Phase 1, the label is incorrect.

  ### Summary
  The maneuver you identified is a specific metaethical failure to maintain consistency regarding the **ontology of reasons**. While structurally similar to the Motte-and-Bailey fallacy, its reliance on a conceptual conflation of **mind-independence** and **inter-subjective stability** justifies the distinct label **Normative Grounding Slippage**. It applies to both practical and epistemic domains and is distinguished from legitimate bridge-theories by the lack of argumentative support for the continuity between the two positions.
