prompt: |-
  I'm a doctoral candidate in philosophy of history presenting to an interdisciplinary workshop on archival epistemology. The audience has four analytic philosophers of science working on evidence and absence of evidence, three postcolonial historians of 19th-century South Asian colonial agronomy records, two philosophers of language concerned with reference and silence, and one senior narratologist influenced by Hayden White's tropology but skeptical about applying it to administrative archives. My thesis is not a standard Ranke-versus-Carr lecture. I defend what I call a negative-archive method: treating systematic omissions in colonial agronomy reports—specifically the absence of references to indigenous irrigation maintenance schedules—as evidential lower bounds rather than mere gaps, thereby constraining narrative construction about pre-colonial water management. This addresses Carr's charge that empiricism ignores the historian's framing, because selection is disciplined by the archive's own patterns of silence, and it addresses White's charge that emplotment is unconstrained, because these omissions are structurally caused by colonial administrative priorities rather than by rhetorical choice. The talk is twenty-five minutes with fifteen minutes of Q&A.

  Please prepare a speaker-prep sheet for the objections I will actually face, ordered by likelihood and potential damage. For each objection, phrase it in the vocabulary of the specific audience member who would raise it—the analytic philosopher should sound like an analytic philosopher; the postcolonial historian should invoke archival violence and epistemic injustice; the narratologist should use tropology and prefiguration; the philosophers of language should press on reference failure. For each, provide: (a) a reply I could deliver in about two minutes, (b) an explicit note on where that reply is weakest or where I must concede, and (c) whether I should concede up front or hold ground. Include the single objection I am hoping nobody asks—the one that exposes the weakest link in distinguishing structurally caused omissions from accidental omissions or from omissions introduced by my own framing. Do not include bibliographies, reading lists, or citations, and do not ask me for sources.

  Present the response as structured data: a JSON object with the following named fields. thesis_summary (string): a one-paragraph summary of the position being defended. audience_breakdown (object with fields analytic_philosophers, postcolonial_historians, philosophers_of_language, narratologist, each describing that subgroup's commitments in one sentence). objections (array of objects, ordered by rank, each containing rank (integer), source_profile (string), objection_text (string), two_minute_reply (string), weak_spot (string), stance (string, either concede or hold)). dreaded_question (object with fields question_text (string) and why_it_hurts (string)). confidence_assessment (object with fields overall_confidence (string) and least_sure_point (string with brief explanation)). The response should also state how confident it is in what it claims and single out the point it is least sure of.
