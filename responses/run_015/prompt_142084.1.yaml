      *   *Hypothesis 2 (Verbal Dispute/Causation Concepts):* Also very strong. The counterfactual theorist (Lewis-style) and the production/process theorist (Salmon/Dowe-style) are indeed talking past each other. Exclusion arguments usually rely on a production/transfer view, while defenses often rely on counterfactuals.
      *   *Hypothesis 3 (Hidden Empirical Question):* This is weaker. Premise 2 (Causal Closure of the Physical) is usually treated as a methodological principle or metaphysical constraint, not something easily settled by lab work. Physics being indeterministic doesn't necessarily save mental causation (randomness isn't agency).
