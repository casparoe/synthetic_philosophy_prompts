prompt: |-
  hey, im slowly working thru GEB and i keep getting dragged backwards into older stuff. right now im on the part where Hofstadter talks about self-reference and "strange loops" and how a self-referential formula is supposed to be a kind of baby version of a self-aware mind. Someone told me the ancestor of all this is Lewis Carroll's dialogue from the 1890s (the one Hofstadter is clearly riffing on with his Achilles-and-Tortoise bits), so i finally read it and now im stuck on it in a way i cant quite articulate. Here's the bit:

  "Now write as I dictate:—

       (A)  Things that are equal to the same are equal to each other.
       (B)  The two sides of this Triangle are things that are equal to the same.
       (C)  If A and B are true, Z must be true.
       (Z)  The two sides of this Triangle are equal to each other."

  "You should call it D, not Z," said Achilles. "It comes next to the other three. If you accept A and B and C, you must accept Z."

  "And why must I?"

  "Because it follows logically from them. If A and B and C are true, Z must be true. You don't dispute that, I imagine?"

  "If A and B and C are true, Z must be true," the Tortoise thoughtfully repeated. "That's another Hypothetical, isn't it? And, if I failed to see its truth, I might accept A and B and C, and still not accept Z, mightn't I?"

  "You might," the candid hero admitted; "though such obtuseness would certainly be phenomenal. Still, the event is possible. So I must ask you to grant one more Hypothetical."

  "Very good.  I'm quite willing to grant it, as soon as you've written it down.  We will call it

       (D)  If A and B and C are true, then Z must be true.

  Have you entered that in your note-book?"

  "I have!" Achilles joyfully exclaimed, as he ran the pencil into its sheath. "And at last we've got to the end of this ideal race-course! Now that you accept A and B and C and D, of course you accept Z."

  "Do I?" said the Tortoise innocently. "Let's make that quite clear. I accept A and B and C and D. Suppose I still refused to accept Z?"

  "Then Logic would take you by the throat, and force you to do it!" Achilles triumphantly replied. "Logic would tell you 'You can't help yourself. Now that you've accepted A and B and C and D, you must accept Z!' So you've no choice, you see."

  "Whatever Logic is good enough to tell me is worth writing down," said the Tortoise.  "So enter it in your book, please.  We will call it

       (E)  If A and B and C and D are true, Z must be true.

  Until I've granted that, of course I needn't grant Z."

  So my questions, and please dont give me the bumper-sticker version ("rules aren't propositions", "you need a meta-language") — i've read that on like four websites and it doesn't feel like it actually explains anything:

  1. What is the Tortoise doing at each step, precisely? Is he demanding a new *premise*, or refusing to *apply a rule*, or something weirder — and why does nothing ever close? Sub-question that i think is the crux: suppose he were perfectly happy to grant C, D, E, and so on, all infinitely many of them, all neatly written in the notebook. Does Z finally follow then? My gut says no, but I cant say why in a way that satisfies me.

  2. The bit I actually care about. I invented a formal system to test my confusion. Call it W: it has some axioms, it can talk about its own sentences and proofs via numbering, and it has exactly one rule of inference R (from P and P→Q, get Q). Now add one extra axiom S, which says: "every sentence derivable in W is true." Question: does S do any licensing work? I.e. does W now in some sense *contain* its own rule, so that the Carroll regress is blocked — or does S just sit there as one more sentence while all the real inferring is still done by R from the outside? And is S different in kind from the Tortoise's (C), or is it the same mistake dressed up in fancier notation?

  3. Contrast it with the Gödel case. Let G be a sentence of W that says of itself "G is not derivable in W". Standard story: if W is consistent, G is true but W can't derive it. Here's the asymmetry that bugs me: the Tortoise's tower of hypotheticals is also a kind of escalating self-reference, and it produces nothing, it just spins. But G's self-reference seems to *deliver* something — a determinate truth the system can't reach. Both are loops. Why does one bottom out in regress and the other one bite? Try to state the structural difference without leaning on the word "meta".

  4. And the payoff question, which is the reason im reading any of this: Hofstadter wants to run the analogy from self-referential formula to self-aware mind. But if Carroll shows that brute self-reference (or brute "representing your own rules") degenerates into a pointless regress, then the analogy needs an extra ingredient. What is it? Be concrete: what has to be true of a system for its loops to close instead of spin, and where in an actual mind would that ingredient live? Also — is there a version of the Carroll regress that comes for the mind case too (a mind can only follow a rule it represents; representing it needs a further rule; ...), and if so does anything stop it, or do we just get lucky?

  Pretend im smart but sloppy and have no library access, so explain from whats on the page rather than pointing me at a paper.
