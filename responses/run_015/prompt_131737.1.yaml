      *   Hard to do deliberately from scratch. It evolves. Top-down engineering often fails or creates hybrid forms (like the Japan observation: collective acknowledgment is a buffer against individual shame).
      *   Verdict: Feasible only over generations via deep structural changes, not policy switches; leakage is inevitable.

