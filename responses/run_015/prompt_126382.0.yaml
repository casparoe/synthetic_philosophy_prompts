  1. Assign students as 'Maintainers' and 'Observers' within a simulated ecosystem where resources deplete unless actively managed, requiring them to vote on who caused a collapse after the first round of deliberate neglect.
  2. In a hidden second round, swap roles without announcement so that systemic failures mimic individual negligence, forcing participants to realise that structural absence looks identical to personal omission from the outside.
  3. Implement a prestige-only payoff scheme where points are awarded solely for aligning with the majority vote on causal attribution, incentivising students to seek consensus rather than metaphysical truth.
  4. During the debrief, map the first round to the territory of physical absence and the second to the map of normative expectation, while predicting that students will initially resist the idea that their voting criteria shifted arbitrarily between rounds.
  5. Frankly state that the simulation cannot reproduce the visceral weight of the normative loading of 'should have acted' without direct explanation, as the game mechanics alone lack the moral gravity of real-world institutional roles.
