answer: |-
  Here is a session plan designed to dismantle the two inferences from your argument (individual determinism and environmental futility) by leveraging your students' quantitative literacy while bypassing their genetic misconceptions.

  ### 1. Sequence and Dependencies

  The logic must flow from **statistical definition** to **population relativity** to **intervention implications**. Do not start with biology; start with ANOVA.

  1.  **The Hook (5 mins):** Pose the policy question directly. *"If a trait has $h^2 = 0.8$, does an environmental intervention have 20% of the effect it would have if $h^2 = 0.2$?"* (Do not answer yet).
  2.  **Formal Definition via ANOVA (10 mins):** Leverage their competence. Define Phenotypic Variance ($V_P$) as the Total Sum of Squares. Partition it into $V_G$ (Between-Group SS) and $V_E$ (Within-Group SS). Define $h^2$ strictly as $V_G / V_P$.
      *   *Dependency:* Students must accept $h^2$ as a ratio of *variances*, not a proportion of an *individual's score*.
  3.  **The Mean-Variance Decoupling (10 mins):** Show that $h^2$ describes the *spread*, not the *level*.
      *   *Dependency:* Requires the ANOVA definition to be solid.
      *   *Goal:* Kill the "immutability" inference. Show that you can shift the mean (intervention) without changing the variance ratio.
  4.  **Population Relativity via Environmental Variance (10 mins):** Show that $h^2$ changes if $V_E$ changes, even if genetics stay constant.
      *   *Dependency:* Requires understanding that $V_E$ is a property of the *population's context*, not just "noise."
      *   *Goal:* Kill the "fixed number" inference.
  5.  **G$\times$E and rGE as Variance Modifiers (5 mins):** Introduce these not as definitional components, but as mechanisms that alter $V_G$ or $V_E$ in different contexts.
      *   *Placement:* Late. If introduced early, students treat them as "exceptions" to the rule rather than proof that the variances are context-dependent.
  6.  **Scope Boundary & Assessment (5 mins):** Explicitly close the door on between-group inference and administer the final question.

  ### 2. The One Example: "The Two-Field Corn Trial"

  Do not use height (too much baggage) or test scores (too politically volatile for a foundational definition). Use **Corn Yield**.

  *   **The Setup:** A single strain of corn (identical genetics, $V_G = 0$) is planted in Field A. A diverse mix of strains ($V_G > 0$) is planted in Field A and Field B.
  *   **What it must contain:**
      1.  **Uniform Environment (Field A):** High-quality, uniform soil/fertilizer. $V_E$ is low. $h^2$ will be **high**.
      2.  **Variable Environment (Field B):** Patchy soil, inconsistent water. $V_E$ is high. $h^2$ will be **low**.
      3.  **Mean Shift:** Field A receives a nutrient boost. The mean yield skyrockets, but the variance ratio ($h^2$) remains identical.
  *   **What it must lack:**
      *   **Human Agency:** Do not use children. It triggers defensive reasoning about "potential."
      *   **Binary Outcomes:** Keep it continuous (bushels per acre) to match their regression intuition.
  *   **Why this cut?** It is a trait that is paradigmatically environmental (plants need soil) yet can be shown to have high heritability in uniform conditions. This severs the link between "heritable" and "biological destiny." It demonstrates that high $h^2$ simply means "current environmental variation is low," not "environment doesn't matter."

  ### 3. Misconception Management

  Address these *in situ* as they arise, not in a "mythbusting" conclusion.

  1.  **The Decomposition Fallacy ("80% of *my* height is genetic").**
      *   *When:* Step 2 (Definition).
      *   *Intervention:* As soon as you write $V_P = V_G + V_E$, circle the $V$. Say aloud: *"This equation applies to the deviations from the mean, not the mean itself. It applies to the population, not the individual."*
  2.  **The Immutability Reading ("High $h^2$ means environment can't work").**
      *   *When:* Step 3 (Mean Shift).
      *   *Intervention:* Show the nutrient boost. The mean yield doubles. Ask: *"Did the environment work?"* (Yes). *"Did $h^2$ change?"* (No). *"Therefore, does $h^2$ predict intervention success?"* (No).
  3.  **The Fixed Number Fallacy ("$h^2$ is a property of the trait").**
      *   *When:* Step 4 (Population Relativity).
      *   *Intervention:* Compare Field A (Uniform) vs. Field B (Patchy). Same corn. Different $h^2$. Conclude: *"Heritability is a property of the population in a context, not the trait."*
  4.  **The Overcorrection ("So the statistic is useless").**
      *   *When:* Step 5 (G$\times$E/rGE).
      *   *Intervention:* Clarify utility. High $h^2$ in Field A tells a farmer that *further equalizing the environment* won't reduce variance much, but *changing the genetics* (new seeds) would. It informs *which* lever to pull, not *if* a lever exists.
  5.  **The Between-Group Slide ("Group A is taller because height is heritable").**
      *   *When:* Step 6 (Scope Boundary).
      *   *Intervention:* Explicitly forbid the inference. (See Section 5).

  ### 4. The Final Assessment Question

  **The Scenario:**
  "Imagine you measure the heritability of reading scores in School X. Currently, resources are distributed randomly; some classrooms have books, some do not ($V_E$ is high). You calculate $h^2 = 0.4$.
  Next year, the district implements a policy that gives every classroom identical, high-quality resources ($V_E$ decreases significantly). Genetics have not changed."

  **The Question:**
  "What happens to the heritability estimate ($h^2$) of reading scores in School X next year?
  A) It decreases.
  B) It stays the same.
  C) It increases."

  **The Correct Answer:** **C) It increases.**
  *Reasoning:* $h^2 = V_G / (V_G + V_E)$. If $V_E$ drops (environment becomes uniform) and $V_G$ stays constant, the ratio approaches 1.

  **Answers that should worry you:**
  *   **Choosing A:** They believe $h^2$ measures "environmental importance." They think "Better environment = lower heritability." This is the most common error and indicates they missed the variance ratio concept.
  *   **Choosing B:** They believe $h^2$ is a biological constant intrinsic to the trait (e.g., "reading ability"). They missed the population-relativity point entirely.
  *   **Justification:** If a student chooses C but justifies it with "Genetics matter more now," correct them. Genetics don't matter *more*; environmental *variance* matters *less*.

  ### 5. Scope Boundaries: Group Differences

  You cannot ignore the group difference inference, or they will make it themselves. But you cannot debate it in 45 minutes.

  *   **What to decline:** Do not open the empirical debate about whether specific group differences *are* genetic. Do not discuss polygenic scores across ancestries.
  *   **How to state it:** Use the **Lewontin Seed Analogy** (briefly).
      *   *"If I plant genetically identical seeds in poor soil and rich soil, the difference in mean height between the two pots is 100% environmental, even if heritability within each pot is 1.0."*
      *   *"Within-group variance ratios ($h^2$) are mathematically silent on between-group mean differences. To infer the cause of a gap, you need data on the gap, not data on the variance within the groups."*
  *   **The Closing Line:** *"Heritability explains why students differ from each other in this classroom. It does not explain why this classroom differs from that one."*

  ### 6. Self-Critique: The Weakest Link

  **Confidence Level:** High on the ANOVA framing (it matches their skills); Moderate on the conceptual shift regarding variance.

  **The Single Move Most Likely to Misfire:**
  **Step 4 (The "Equalizing Environment Increases Heritability" logic).**

  *   **Why:** It is profoundly counter-intuitive. Students (and your friend) intuitively link "Heritability" with "Genetics" and "Environment" with "Nurture." They want a seesaw: if Environment goes up (improves), Heritability must go down.
  *   **The Risk:** When you explain that making the environment *better/more uniform* makes heritability *higher*, they may hear "Genetics become more powerful." They will conflate *variance explained* with *causal potency*.
  *   **Mitigation:** You must use the phrase **"Suppressing Environmental Variance"** repeatedly. Do not say "Improving the environment." Say "Reducing the *variation* in the environment." If you slip and say "When we fix the environment, heritability goes up," you will validate the very determinism you are trying to kill. You must be pedantic about the distinction between $E$ (environmental effect) and $V_E$ (environmental variance).
