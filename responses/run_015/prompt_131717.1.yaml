      3. Evidential decision theory interprets this correlation as a reason to revise the current policy, aiming to become the type of agent associated with success.
      4. However, because the modules are causally isolated, the current system's policy change cannot physically influence the successor's already determined prediction.
      5. Consequently, the system irrationally alters its behavior to manipulate news about itself rather than to actually improve the outcome.

