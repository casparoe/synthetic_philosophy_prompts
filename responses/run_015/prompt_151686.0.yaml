  3.  **Task 2: Analyzing Disanalogies:**
      *   *Disanalogy 1: Copies vs. Single Airframe.* In aviation, one plane crashes, we ground the fleet, inspect, fix design. In AI, a million copies deploy instantly. If there's a latent bug, it triggers everywhere at once. *Verdict:* Critical. It changes the statistical nature of the risk from serial to parallel.
      *   *Disanalogy 2: Hostile Environment/Passengers.* Planes fight physics and weather. AI fights adversaries (prompt injection, jailbreaks, bad actors using the tool). *Verdict:* Critical. Aviation safety is largely about reliability against nature; AI safety is about robustness against optimization pressure from opponents.
      *   *Disanalogy 3: Learning from Crashes.* Aviation iterates on crashes. AI x-risk implies the first crash might be existential/unrecoverable. *Verdict:* Critical. This undermines the "iterate to safety" model.
