  4.  **Task 3: Evaluating the "Worst-Case Guarantee" Claim:**
      *   The aviation analogy *supports* worst-case guarantees *if* you assume the physics holds.
      *   But because of the "million copies + hostile actors" issue, formal verification (which works well on static code) is much harder on probabilistic systems (NNs) facing adaptive adversaries.
      *   *Conclusion:* The aviation analogy actually *weakens* the feasibility of the "worst-case guarantee" conclusion. Aviation achieves $10^{-9}$ through physical redundancy and deterministic systems. AI is probabilistic and non-deterministic. Demanding aviation-level guarantees for AI might be physically impossible, not just hard. So the claim "Refuse to deploy until..." might lead to "Never deploy."

  5.  **Task 4: The Drug Approval Analogy:**
      *   *Mechanism:* Clinical trials (phases), known side-effect profiles, post-market surveillance.
      *   *Fit:* Accepts probabilistic harm. "This drug kills 1 in 10,000 but saves 1 in 100."
      *   *Pros:* Acknowledges the probabilistic nature of NNs. Allows for benefit/risk tradeoff.
      *   *Cons:* Drugs don't generally have agency or adapt to users. Drugs don't replicate themselves. A bad drug hurts the taker; a bad AI might hurt everyone (externalities).
      *   *Verdict:* Better for *governance* (monitoring, phased rollout), worse for *catastrophic risk* (drugs don't cause pandemics usually, AI could).

  6.  **Task 5: A Third Analogy:**
      *   *Nuclear Power?* High consequence, regulated, containment. But still physical.
