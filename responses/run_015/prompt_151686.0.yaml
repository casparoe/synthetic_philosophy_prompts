      *   **Task 3:** Evaluate the "No Deployment Without Worst-Case Guarantees" claim in light of the disanalogies.
      *   **Task 4:** Evaluate the Drug Approval analogy.
      *   **Task 5:** Identify if there's a better ("third") analogy.
      *   **Task 6:** Honest verdict: Are these analogies doing argumentative work, or just restating risk priors?

  2.  **Task 1: The Correspondence Table:**
      *   *Flight Hour:* Compute hour? Inference step? User interaction session?
      *   *Crash:* Catastrophic AI failure (e.g., bioweapon design, autonomous kill, systemic financial collapse).
      *   *Regulator:* FAA $\leftrightarrow$ ? (Government agency, internal safety board, international treaty).
      *   *Black Box:* Flight Data Recorder $\leftrightarrow$ ? (Logs, chain of thought, interpretability tools).
      *   *Maintenance:* Patching/Updates $\leftrightarrow$ ? (RLHF, fine-tuning, system prompts).
      *   *Test Pilots:* Red Teamers $\leftrightarrow$ ? (Safety eval teams).
      *   *Airworthiness Certificate:* Deployment Approval $\leftrightarrow$ ? (Sign-off to release weights/API).
      *   *The Airframe:* The Model Weights/Architecture.
