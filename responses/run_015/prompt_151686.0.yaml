      *   *Cybersecurity?* Adversarial, software-based, patching constant. But usually lacks physical catastrophe.
      *   *Best Fit:* **Biosecurity/Pathogen Research.** (Replication, dual-use, containment protocols, potential for global spread from a single lab leak). Or **Nuclear Command & Control** (High stakes, adversarial, need for reliability). Let's go with a hybrid: **Critical Infrastructure + Biosecurity.**

  7.  **Task 6: The Honest Verdict (Priors vs. Arguments):**
