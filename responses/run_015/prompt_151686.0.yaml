      *   *Did I address the "million copies" point?* Yes, this is the "parallel deployment" vs "serial testing" issue.
      *   *Is the Drug analogy too weak?* Acknowledge its limits regarding existential risk.
      *   *Final check on the "Honest Verdict":* Don't sit on the fence. State clearly that these are primarily normative frames, not empirical arguments.

  10. **Final Polish:** Ensure the distinction between *aleatoric* (randomness inherent) and *epistemic* (lack of knowledge) uncertainty is clear, as that's the heart of the aviation vs. drug debate. (Decided to keep it less jargon-heavy but keep the concept).

  *(Self-Correction during drafting)*: Wait, the user asked specifically about the "No deployment without worst-case guarantees" claim. I need to be specific: Does the million-copies disanalogy kill that claim? Yes, because worst-case guarantees are likely impossible in adversarial, probabilistic systems. So the claim becomes a de facto ban. I need to make sure that's clear.

  *(Refining the Third Analogy)*: Biosecurity is good, but "Nuclear Command and Control" captures the "adversarial + high stakes" better. Actually, **Cybersecurity for Critical Infrastructure** might be the most pragmatic fit. It combines software (like AI), adversaries (like the hostile passenger), and physical consequences (like planes). Let's offer **Biosecurity** for the replication risk and **Critical Cyber-Physical Systems** for the adversarial reliability. I'll pick **Biosecurity** as the primary third option because of the "replication" aspect the user highlighted.

  *(Final thought on the Verdict)*: The user wants to know if they are "doing real argumentative work." The answer is "They structure the inquiry, but they don't resolve the empirical uncertainty." I need to be nuanced there. They determine *what evidence you look for*, not just how much risk you accept.

