      *   Tactic 4: Explicitly naming the uncertainty (Meta-commentary within the scene).
      *   Scene Exercise: Write the moment she *almost* says no.

  10. **Refining the "Journalist" aspect:** Journalists are professional observers. They detach. The scene should show her detaching. She treats her own life as a story. "This is the lead." That's a compelling flaw.

  11. **Final Polish:** Ensure tone is encouraging but analytical. (Proceed to generate output).

