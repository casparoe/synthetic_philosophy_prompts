answer: |-
  1. Desiderata for an Engineering-Ready Theory of Induction

  To be useful for your practice, a theory of induction must bridge the gap between mathematical impossibility (NFL) and operational necessity (deployment). The following four requirements specify what such an account must deliver.

  **1.1. Consistency with No-Free-Lunch (NFL) Theorems**
  The theory must explicitly acknowledge that no learning algorithm outperforms another when averaged over *all* possible data-generating distributions. It cannot claim that a specific method (e.g., tree ensembles) is universally superior in a mathematical sense.
  *   **Underlying Reason:** To contradict proven mathematical theorems is to render the theory false. An engineering theory built on falsehoods risks catastrophic failure when edge cases arise.
  *   **Status:** **Non-negotiable for engineering purposes.** (To ignore mathematical constraints is to invite system failure.)

  **1.2. Explanation of Empirical Stability under Shift**
  The theory must explain why specific inductive biases yield stable performance on *sequential* or *shifted* data, despite the lack of universal guarantees. It must account for your fraud-detection scenario: why tree ensembles, despite higher bias, generalise better to new months of data than more flexible models.
  *   **Underlying Reason:** Engineering systems operate in non-stationary environments. If a theory cannot explain why a biased model survives distributional shift while a flexible one overfits, it offers no insight into robustness.
  *   **Status:** **Non-negotiable for engineering purposes.** (If it cannot explain past success in production, it cannot guide future builds.)

  **1.3. Normative Actionability for Model Selection**
  The theory must provide a decision rule for choosing between models when validation metrics are indistinguishable. It must justify your team's policy of selecting the model with the smallest implementation complexity among those within one percentage point of best validation error.
  *   **Underlying Reason:** Engineering is a decision-making discipline, not merely a descriptive one. A theory that concludes 'all choices are equally unjustified' paralyses development.
  *   **Status:** **Reflects the prejudice of Pragmatism.** (Pure epistemology often seeks truth conditions rather than decision rules; however, this is non-negotiable for *engineering* utility.)

  **1.4. Characterisation of the 'Natural' Domain**
  The theory must specify the subset of data-generating distributions relevant to your work (e.g., 'natural' language or financial transaction data) where inductive biases are expected to hold. It must distinguish between the space of *all possible* functions (where NFL applies) and the space of *plausible* functions (where learning occurs).
  *   **Underlying Reason:** NFL applies to the universal set; learning applies to the restricted set. Without defining the restriction, the theory cannot reconcile D1.1 and D1.2.
  *   **Status:** **Non-negotiable for engineering purposes.** (Without domain restriction, the theory collapses back into scepticism.)

  2. Incompatibilities and Exclusionary Requirements

  **2.1. Suspected Incompatibilities**
  There is a fundamental tension between **D1.1 (NFL Consistency)** and **D1.3 (Normative Actionability)** if one demands *foundational certainty*. You cannot simultaneously hold that 'no bias is universally justified' (D1.1) and 'this bias is definitely the correct choice' (D1.3) without invoking **D1.4 (Domain Characterisation)**.
  *   **Conflict:** Any approach that attempts to satisfy D1.3 by claiming universal logical necessity for simplicity (e.g., a strong reading of Occam's Razor) will violate D1.1. Conversely, any approach that adheres strictly to D1.1 without D1.4 will fail to satisfy D1.3, resulting in decision paralysis.
  *   **Resolution:** The theory must treat inductive biases as *contingent* on the domain (D1.4) rather than *necessary* truths.

  **2.2. The Most Exclusionary Requirement**
  **D1.3 (Normative Actionability)** is the single requirement expected to exclude the largest number of familiar philosophical approaches.
  *   **Reason:** Many rigorous philosophical accounts of induction (e.g., Humean scepticism, certain interpretations of Bayesianism without objective priors) successfully describe the *problem* of induction but explicitly refuse to offer a *solution* or a rule for action. They maintain logical purity by concluding that preference for one model over another is psychologically inevitable but rationally unjustifiable. For an engineer, a theory that concludes 'you must guess, and I cannot tell you how' is useless, regardless of its logical consistency.

  3. Evaluation of Familiar Approaches

  Here I briefly assess three broad approaches against the desiderata above.

  **3.1. Radical Scepticism (Humean)**
  *   **Performance:** Fails D1.3 and D1.2.
  *   **Analysis:** This view agrees with D1.1 (NFL consistency) perfectly, acknowledging that past performance does not logically guarantee future results. However, it offers no explanation for the fraud-detection stability (D1.2) other than 'habit', and it explicitly forbids the complexity policy (D1.3) as rationally groundless. It is logically sound but engineering-useless.

  **3.2. Orthodox Bayesianism**
  *   **Performance:** Mixed. Satisfies D1.3 and D1.1, struggles with D1.4.
  *   **Analysis:** Bayesian updating provides a clear decision rule (maximise posterior probability), satisfying D1.3. It is consistent with NFL provided priors are acknowledged as subjective (D1.1). However, it often struggles to objectively characterise *why* specific priors (e.g., favouring trees) match the 'natural' domain of fraud data (D1.4) without circularity. It risks treating the prior as an article of faith rather than an engineering hypothesis.

  **3.3. Computational Learning Theory (PAC/VC Bounds)**
  *   **Performance:** Satisfies D1.1 and D1.4, often fails D1.2 and D1.3 in practice.
  *   **Analysis:** This approach rigorously defines the 'domain' via hypothesis class complexity (D1.4) and respects NFL (D1.1). However, the bounds are often too loose to explain why a specific tree ensemble beat a neural net in your fraud pipeline (D1.2), as both may fall within similar bound classes. Furthermore, it rarely offers a tie-breaking rule for models with equal empirical error (D1.3), focusing instead on worst-case guarantees rather than average-case engineering heuristics.

  4. Summary Recommendation

  For your context, an adequate account must be **pragmatic naturalism**. It must accept NFL as a mathematical boundary condition (D1.1) but treat inductive biases (like simplicity or tree structures) as empirical hypotheses about the specific data domain you inhabit (D1.4). This allows you to enforce the complexity policy (D1.3) not because simplicity is universally 'true', but because it is a robust heuristic for the specific class of problems your company solves, as evidenced by the fraud-detection stability (D1.2). Any theory that demands universal justification for your policy should be discarded as incompatible with the constraints of your work.
