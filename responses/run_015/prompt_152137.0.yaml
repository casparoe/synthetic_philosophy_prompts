answer: |-
  A hardcore decision theorist is famous in the rationalist community for his unwavering commitment to EV maximization with unbounded utility. He's the guy who would happily mortgage his house for a $1/10^{100}$ chance of saving $10^{50}$ digital lives in a distant simulation. "Shut up and multiply," he says. "The math is the math."

  One day, a colleague decides to test him. She offers him the exact same deal: save $10^{50}$ digital lives, but this time the success condition is framed as "picking a specific real number from a continuous uniform distribution over [0,1]."

  The theorist immediately declines.

  "But the expected value is identical!" the colleague protests. "The odds are practically indistinguishable from the previous bet! You're accepting $10^{-100}$ but rejecting measure zero?"

  The theorist adjusts his glasses and sighs. "Look, I'm an EV fanatic, but I'm not illiterate in measure theory. I'll multiply infinity by epsilon all day long. But my utility function has a hidden lexical ordering: I maximize EV over the support of my prior, and my prior treats null sets as ontologically void. I'm fine being Pascal-mugged, but I draw the line at measure-zero exploits. It's not inconsistency, it's measure-theoretic hygiene."
