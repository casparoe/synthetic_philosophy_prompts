answer: |-
  This is a strong, provocative core idea, and it is absolutely suitable for a metaontology workshop. In fact, workshop audiences *love* this kind of reflexive, "meta-metaontological" puzzle because it forces people to confront the presuppositions of their own frameworks.

  Here is a breakdown of the novelty, the strength of the argument, and some strategic advice on how to shape the paper.

  ### 1. The "Knockoff" Worry: Is this already done to death?
  **Verdict:** No, it is not a cheap knockoff, but you are walking into a crowded room. You need to position yourself carefully.

  *   **The Common Trope:** The claim that *first-order* ontological debates (e.g., composition) are verbal is standard Hirsch/Chalmers fare. The claim that *metaontological* debates (e.g., quantifier variance vs. joint-carving) are substantive is standard Sider fare.
  *   **The Gap:** What is less commonly explored in depth is the reflexive claim: **"The criterion for distinguishing verbal from substantive disputes is itself a site of non-neutral, theory-laden disagreement."**
  *   **Key Precedents:** You need to engage with a few specific people to show you know the landscape:
      *   **Matti Eklund:** His work (especially *Making Sense of Reality*) on "arnodic" concepts and the idea that ontological frameworks might be on par is very close to your worry. He discusses how choosing a metaontological framework is like choosing a language.
      *   **Amie Thomasson:** In *Ontology Made Easy*, she argues ontological questions are trivial relative to a conceptual framework. She acknowledges the framework dependence, but you could push her on whether the choice of *that* framework is itself a verbal/substantive matter.
      *   **David Chalmers:** In "Verbal Disputes" (2011), he tries to give a neutral analysis. You are effectively arguing that his analysis isn't neutral.
      *   **Kris McDaniel:** He has papers on "meta-metaphysics" that discuss whether metaontological questions are themselves substantive.

  **Advice:** Don't claim you discovered that metaontology is contested. Claim that you are exposing a specific *dialectical circularity* in the use of the "verbal dispute" label as a deflationary tool. Your niche is the **criterion-dependence problem**.

  ### 2. Does the Regress Point Land?
  The regress argument is the engine of your paper. Here is how to make sure it doesn't stall:

  *   **The Threat:** The threat isn't necessarily an infinite regress (which people might dismiss as harmless). The threat is **question-begging**.
  *   **The Formulation:** Frame it as a dilemma for the Deflationist (the one who wants to call the debate verbal to dissolve it).
      1.  To show Debate $D$ is verbal, you need Criterion $C$.
      2.  Criterion $C$ presupposes Metaontological Theory $T$ (e.g., quantifier variance).
      3.  The opponent in Debate $D$ rejects Theory $T$ (e.g., they are a joint-carving realist).
      4.  Therefore, using $C$ to dissolve $D$ begs the question against the opponent.
  *   **The Siderian Response:** A Sider-style realist will say: "My criterion isn't just one option among many; it's the *correct* one because it tracks objective structure. The Hirschian criterion is *false*."
  *   **Your Counter:** You need to argue that in the context of *resolving* a dispute, appealing to "objective structure" is precisely what is at issue. If the nihilist and universalist are disagreeing about structure, you can't use "structure" to tell them they are talking past each other without already assuming the nihilist/universalist debate is substantive.
  *   **Refinement:** It might not be a *verbal* dispute about the word "verbal." It might be a **substantive** dispute about the word "verbal." But the upshot is the same: the label "verbal dispute" is not a neutral arbiter; it is a partisan move.

  ### 3. Skeptical Ending vs. Positive Proposal
  Workshop papers that end on pure skepticism ("We can't do metaontology") often frustrate audiences because they feel like a dead end. However, papers that offer a facile positive solution ("Here is the correct criterion") often get torn apart.

  **Recommendation: The Methodological Pivot.**
  Don't try to solve the metaphysical problem. Instead, propose a shift in **methodological focus**.

  *   **The Upshot:** Since we cannot neutrally classify disputes as verbal/substantive, we should stop using that classification as a *conversation-stopper*.
  *   **The Proposal:** Instead of asking "Is this dispute verbal?", ask "What is the **pragmatic cost/benefit** of adopting one conceptual framework over the other?"
  *   **Why this works:** It sidesteps the regress. It doesn't matter if the dispute is "really" verbal or substantive. What matters is whether adopting the "universalist language" or the "nihilist language" helps us achieve our theoretical goals (simplicity, explanatory power, etc.).
  *   **Connection:** This aligns with Carnapian pragmatism but updates it for the contemporary context. It turns the paper from "Metaontology is broken" to "Metaontology should be pragmatic, not taxonomic."

  ### 4. Specific Traps to Avoid
  1.  **Confusing Semantics with Metaphysics:** Be careful not to slide into saying "All metaphysics is verbal." That's a huge claim that requires massive defense. Stick to the narrower claim: "The *tool* used to diagnose verbal disputes is theory-laden."
  2.  **The "Merely" Verbal Trap:** Some philosophers (like Bennett or Sider) argue that even if a dispute is verbal, it might still be important. Acknowledge this. Your point is stronger if you grant that verbal disputes can be substantive in *some* sense, but argue that the *deflationary* use of the label (i.e., "It's merely verbal, so we can ignore it") is what fails.
  3.  **Define "Verbal":** You note that Sider and Hirsch define it differently. Spend a paragraph clearly contrasting these definitions early on. This is the evidence for your claim that the criterion is contested.

  ### 5. Title & Framing Ideas
  *   *The Criterion Problem for Verbal Disputes*
  *   *Verbal Disputes About Verbal Disputes*
  *   *Deflationism and the Question-Begging Criterion*
  *   *Metaontological Neutrality and the Myth of the Verbal Dispute*

  ### Summary Feedback
  *   **Novelty:** Sufficient. It's a known worry but rarely the *sole* focus.
  *   **Argument:** Solid, provided you frame it as a dialectical circularity rather than a logical paradox.
  *   **Conclusion:** Aim for the "Methodological Pivot." Don't leave us in the swamp; give us a map for how to walk through it without getting stuck on the "verbal" label.
  *   **Worry:** Your fear that it's a knockoff is unfounded, but your fear that it's confused is worth managing by being very precise about *whose* criterion is begging the question (usually the deflationist's).

  This sounds like a paper that would generate a lot of discussion at a workshop. Go for it.
