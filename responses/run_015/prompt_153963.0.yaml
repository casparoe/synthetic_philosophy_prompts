  1. The stayers commit a fungibility mistake by treating the child as a mergeable bucket of pain, while walking away shifts guilt without fixing the metaphysical singularity. Le Guin adds visceral horror to the separateness objection, forcing readers to feel the math error as a physical crime rather than abstract theory.

  2. By staying, citizens validate the fungibility mistake, yet walking away merely isolates their conscience without resolving the child's ontological isolation. The story surpasses papers by depicting the singularity as a specific child, making the refusal to aggregate welfare an emotional imperative instead of a logical rule.

  3. The stayers' complicity confirms the fungibility mistake, whereas walking away admits the metaphysical problem is unsolvable and only shifts personal guilt. Philosophical texts miss how the narrative makes the singularity's pain an infinite negative that renders any utilitarian calculation instantly void.

  4. Staying requires accepting the fungibility mistake, but walking away fixes nothing metaphysically, serving only to stop the individual from participating in the guilt. Le Guin adds the element of conscious knowledge to the bargain, showing that understanding the singularity makes the fungibility error morally intolerable rather than just incorrect.

  5. Citizens who stay enforce the fungibility mistake, while those who walk away acknowledge the moral singularity persists and merely shift their guilt to the unknown. The story contributes the ambiguous destination of the walkers, illustrating that rejecting the mergeable-welfare model offers integrity but no guaranteed utopian alternative.
