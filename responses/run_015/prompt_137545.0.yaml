answer: |-
  Your observation that first movers win framing but lose terms is structurally correct, but your credibility model is dangerous; this procedure treats commitment as a limited signal resource and prioritizes reversibility over speed to prevent value destruction in regulatory and standard-setting races.

  ### Reasoning and Theoretical Adjustments

  Your taxonomy is functionally useful but conflates intent with mechanism. Game theory distinguishes commitments by **reversibility** and **observability**, not by whether you intend to preempt or signal. A preclusive commitment (exclusive supply) is mechanically different from a positional one (standards) because the former changes the feasible set while the latter changes expectations. The procedure below reclassifies your taxonomy based on the *cost of reversal*, which is the actual driver of risk.

  Your assumption about credibility depletion is partially correct but misdiagnosed. Reputation is not a fuel tank that empties; it is a signal-to-noise ratio. If you commit frequently, the marginal information content of each commitment drops (signal dilution). If you commit and fail to follow through, credibility collapses (default risk). The procedure tracks "Commitment Density" to prevent dilution, rather than assuming a fixed stock of credibility.

  Your observation on framing versus terms is supported by preemption game literature (Fudenberg & Tirole). Moving first reveals your valuation (information leakage) and reduces your flexibility (option value destruction). You win the coordinate point but pay a premium for the privilege. The procedure forces analysts to quantify this "Early Mover Premium" before proceeding.

  ### The Commitment Race Protocol (CRP)

  **Timebox:** 120 Minutes
  **Output:** Written Memorandum for Board/Executive Review
  **Constraint:** If data is unavailable, use scenario ranges (Low/Med/High) marked **[JUDGMENT]**.

  #### Step 1: The False Race Screen (20 Minutes)
  *Objective: Eliminate situations where moving first is neutral or harmful.*

  1.  **Reversibility Test:** Can we undo this commitment within 6 months for less than 10% of the commitment cost?
      *   Yes → **STOP.** This is not a race; it is a standard decision.
      *   No → Proceed.
  2.  **Second-Mover Advantage Test:** Is there clear value in waiting (e.g., seeing competitor's technology, regulatory clarity)?
      *   Yes → **STOP.** Rushing is a pure loss.
      *   No → Proceed.
  3.  **Information Asymmetry Check:** Are we racing because we think *they* know something we don't?
      *   Yes → **STOP.** This is a "lemming race." Gather intelligence before committing.
      *   No → Proceed.

  **Documentation:** Record the specific barrier to reversal and the specific cost of waiting.

  #### Step 2: Commitment Classification (20 Minutes)
  *Objective: Map the situation to the correct mechanical response.*

  1.  **Preclusive (Capacity/Exclusivity):** Does this commitment physically prevent the other side from acting?
      *   *Action Focus:* Secure capacity or deny access.
  2.  **Positional (Standards/Coordination):** Does this commitment set a focal point for others to follow?
      *   *Action Focus:* Anchor the standard or wait for a focal point.
  3.  **Signalling (Regulatory/Political):** Does this commitment signal resolve to a third party (regulator, market)?
      *   *Action Focus:* Signal strength or maintain ambiguity.

  **Documentation:** Select one category. If multiple apply, select the one with the highest cost of reversal.

  #### Step 3: The Framing vs. Terms Valuation (30 Minutes)
  *Objective: Quantify the "Early Mover Premium."*

  1.  **Framing Value:** What specific advantage do we get by setting the axis? (e.g., "Competitor must design around our port.")
      *   Estimate: **[JUDGMENT]** (High/Med/Low).
  2.  **Terms Cost:** What concession are we making to secure this speed? (e.g., "Higher price," "Stricter liability," "Reduced flexibility.")
      *   Estimate: **[JUDGMENT]** (High/Med/Low).
  3.  **Trade-off Rule:** If Terms Cost is High and Framing Value is Low/Med → **DO NOT COMMIT.**

  **Documentation:** Written justification for the High/Med/Low ratings.

  #### Step 4: The Credibility Ledger (15 Minutes)
  *Objective: Assess signal dilution.*

  1.  **Commitment Density:** How many public, binding commitments have we made in the last 12 months?
      *   >3 → Flag as **High Dilution Risk**.
  2.  **Follow-Through Rate:** Have we walked back any public commitments in the last 24 months?
      *   Yes → Flag as **Default Risk**.
  3.  **Rule:** If High Dilution Risk OR Default Risk exists, you must propose a **Conditional Commitment** (Step 5) or **STOP**.

  **Documentation:** List the last 3 commitments and their status.

  #### Step 5: Alternative Moves (20 Minutes)
  *Objective: Identify non-race strategies.*

  1.  **Conditional Commitment:** Can we bind ourselves only if they bind themselves? (e.g., "We adopt Format A if 3 other consortium members do.")
  2.  **Escrowed Exchange:** Can commitments be deposited with a third party and released simultaneously?
  3.  **Capacity Reservation:** Can we pay for options rather than full commitment?
  4.  **Prize Removal:** Can we change the business case so winning the race matters less? (e.g., Design around the sole supplier.)

  **Documentation:** List at least two alternatives attempted. If none are feasible, explain why **[JUDGMENT]**.

  #### Step 6: Hard Stops (10 Minutes)
  *Objective: Define the "No-Go" conditions.*

  **Return "DO NOT COMMIT" if any of the following are true:**
  1.  Reversibility Cost > 20% of deal value.
  2.  Terms Cost is High AND Framing Value is not Critical.
  3.  Credibility Ledger shows Default Risk.
  4.  Counterpart cannot legally commit (e.g., government entity without authority).
  5.  Internal alignment is not unanimous (indicates hidden risk).

  **Documentation:** Checklist of Hard Stops.

  #### Step 7: Escalation Rule (5 Minutes)
  *Objective: Route value judgments.*

  1.  **Analyst Decision:** Steps 1, 2, 4, 6 (Fact-based).
  2.  **Director Decision (You):** Step 3 (Framing vs. Terms trade-off), Step 5 (Selection of Alternative).
  3.  **Board Decision:** Any commitment passing Step 6 with a "High" Credibility Ledger risk or >5% revenue exposure.

  **Documentation:** Signature block for each level.

  ### Failure Modes
  *   **Multi-Party Races:** This procedure assumes two primary actors. With >3 parties, Step 2 (Classification) fails because coordination becomes chaotic. **Action:** Escalate to Board immediately.
  *   **Internal Races:** If two business units are racing each other, Step 6 (Internal Alignment) will trigger a Hard Stop. **Action:** Resolve internal conflict before external commitment.
  *   **Uncommitted Counterpart:** If the other side cannot bind themselves (e.g., a regulator), Step 6 triggers a Hard Stop. **Action:** Shift to lobbying/influence strategy, not commitment.

  ---

  ### Worked Cases

  #### Case (a): Sole Supplier Exclusive
  *   **Step 1 (Screen):** Reversibility? No (2-year shut out). Second-Mover Advantage? Yes (waiting reveals competitor status). Information Asymmetry? **YES.** We do not know if the competitor is close.
      *   *Result:* **STOP.** This is a "lemming race." We are rushing based on fear, not data.
  *   **Step 6 (Hard Stop):** Information Asymmetry triggers a pause.
  *   **Decision:** **DO NOT COMMIT THIS WEEK.**
  *   **Action:** Intelligence gathering. Contact supplier to verify competitor status without revealing our hand. If competitor is not close, we have leverage to negotiate better terms (lowering Terms Cost). If competitor is close, we revisit Step 3.
  *   **Reasoning:** Rushing here confirms the User's fear: paying a premium for framing we don't need. If the competitor isn't close, the race is fake.

  #### Case (b): Consortium Data Format
  *   **Step 1 (Screen):** Reversibility? No (product line committed). Second-Mover Advantage? Yes (see who follows). Information Asymmetry? No (public consortium).
      *   *Result:* Proceed.
  *   **Step 2 (Classification):** **Positional.** We are trying to set a focal point.
  *   **Step 3 (Valuation):** Framing Value? High (architecture suits us). Terms Cost? High (dead end product if others don't follow).
      *   *Trade-off:* High Cost / High Value. Ambiguous. Proceed to Step 5.
  *   **Step 4 (Credibility):** Check Density. If we have made recent public bets, risk is high.
  *   **Step 5 (Alternatives):** **Conditional Commitment.** Announce support for Format A *contingent* on consortium adoption threshold (e.g., "We will support A if 50% of members pre-commit").
  *   **Step 6 (Hard Stops):** None triggered if conditional.
  *   **Decision:** **COMMIT CONDITIONALLY.**
  *   **Action:** Prepare trade show announcement with explicit conditions.
  *   **Reasoning:** Pure pre-commitment risks the "dead end" scenario. Conditional commitment preserves framing advantage without absorbing full downside risk.

  #### Case (c): Regulatory Rulemaking
  *   **Step 1 (Screen):** Reversibility? No (public pledge). Second-Mover Advantage? **YES.** Waiting reveals the draft rule. Information Asymmetry? **YES.** We do not know the regulator's final stance.
      *   *Result:* **STOP.**
  *   **Step 2 (Classification):** **Signalling.**
  *   **Step 3 (Valuation):** Framing Value? Low (Regulator sets the axis, not us). Terms Cost? **High** (Binding pledge may conflict with final rule).
      *   *Trade-off:* High Cost / Low Value. **FAIL.**
  *   **Step 4 (Credibility):** User notes "being first has worked before."
      *   *Analysis:* This is **Survivorship Bias**. You remember the wins, not the times early commitments boxed you in. Regulatory environments change; early commitments often become liabilities when rules shift.
      *   *Credibility Ledger:* If you volunteer often, regulators begin to expect concessions without giving credit (Signal Dilution).
  *   **Step 6 (Hard Stops):** Terms Cost is High. Framing Value is Low. Counterpart (Regulator) cannot commit to accepting your pledge as final rule.
      *   *Result:* **DO NOT COMMIT.**
  *   **Decision:** **DO NOT VOLUNTEER BINDING PLEDGE.**
  *   **Action:** Submit comments on the draft rule instead. Offer "willingness to comply" rather than "binding pledge."
  *   **Reasoning:** This is the case you expected me to reject. Your record of winning is likely evidence of a favorable regulatory cycle, not skill. In rulemaking, the regulator holds the monopoly on commitment. You committing first reduces your flexibility to adapt to the final rule while giving the regulator no incentive to favor you. You are paying a premium (loss of flexibility) for a framing advantage you cannot secure (the regulator decides the frame). This is value destruction.
