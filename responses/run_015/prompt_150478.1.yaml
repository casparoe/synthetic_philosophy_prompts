      *   *The "Price":* To keep (6) and lose (9), you must argue that the *kind* of explanation required for the Universe is different from the *kind* required for a fire. The Universe needs a *ground*; the fire needs a *cause*. The Enclosure Principle blocks grounding by parts, but not causation by distinct existents.

