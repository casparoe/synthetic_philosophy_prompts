answer: |-
  - The hidden move

  The slip occurs in Premise (2), specifically in an equivocation on the phrase "data on G." The argument treats the archive as a passive container where data exists only as positive tokens (names, dates, events); under this model, silence is a null value, equivalent to zero information. However, the critical theory you are engaging with treats the archive as an active mechanism where silence is a positive signal. The modal slide here shifts from "the archive contains no direct testimony from G" (which is true by definition of the omission) to "the archive contains no evidence relevant to the historical position of G" (which is false). The pattern of omission, the categorization errors, and the bureaucratic language used to exclude G are all data *within* the archive about the power dynamics affecting G. By assuming "data on G" must mean "voice of G," Premise (2) begs the question against the very critique it seeks to dismantle.

  If you accept this move, you commit to a naive empiricism where only direct observation counts as evidence, rendering structural analysis impossible in any field (including biology, where absence of a species can indicate pollution). If you reject it, you cost yourself the simplicity of correspondence truth; you must accept that historical knowledge is partly constructed by reading the topology of gaps rather than just aggregating facts. The alternative isn't necessarily your friend's "hermeneutic of suspicion," but rather a structuralist approach: the archive doesn't need an external source to reveal power, because the architecture of the silence *is* the internal data point.

  - The bill for dropping it

  Rejecting Premise (2) commits you to the view that absence is an ontological category with causal power, not just a lack of presence. You are signing on to the idea that the historical record is a produced object, meaning you cannot treat archival claims as neutral reports but must treat them as artifacts of a specific power configuration. This costs you the ability to make simple, unqualified factual claims about Group G based on official records; instead, every claim must be indexed to the conditions of its own possibility. You gain the ability to explain why archival silence is worse than random missing data (because it is systematic rather than stochastic), but you lose the comfort of the archive as an objective adjudicator of truth.

  - A cheaper patch

  You can avoid the drastic conclusion of (6) by weakening Premise (1) rather than fighting over (2). Instead of claiming archival assertions about G are "epistemically unjustified," modulate the claim to say they are "epistemically underdetermined." This shifts the burden from a binary (justified/unjustified) to a scalar one (confidence levels). By doing so, you acknowledge that the archive provides *some* signal (e.g., when and how G disappeared from record) without requiring an independent source to validate G's existence. This preserves the special critical status of the archive—as a site where power actively shapes reality—without forcing you into total skepticism or bland pluralism, allowing you to treat archival silence as a specific type of experimental error rather than a total system failure.
