  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Provide a reading of Sophocles' *Antigone* paired with Moral Foundations Theory (MFT) for a first-year seminar.
      *   **Core Claim to Test:** The tragedy is not about weighting differences but "foundation-blindness" (Creon can't see Antigone's piety as moral, only subversion; Antigone can't see Creon's authority/order as moral, only tyranny). Each sees the other as immoral, not moral-but-different.
      *   **Specific Scenes to Address:** Burial/dust, Creon's city/ship of state language, unwritten laws, Haemon's intervention, pollution/birds/altars, Tiresias, Creon's collapse.
      *   **Key Question:** Does Sophocles give either character access to the other's moral perception, or withhold it?
      *   **Complication 1 (Liberty Foundation):** If Liberty is added, Antigone becomes a resistance figure and Creon an oppressor (a common student reading). Does MFT license this? Does this show MFT is underdetermined/too flexible?
      *   **Complication 2 (Breadth vs. Narrowness):** MFT suggests more foundations = broader moral landscape. But *Antigone* shows two people with full-blooded foundations destroying each other. Does the play argue breadth without yield rules is worse? Can MFT say this (given it's descriptive)?
      *   **Normative Question:** What does MFT tell us about who is *right* (burial, kin vs. state, authority)? What is the theory entitled to conclude? Be deflationary if necessary.
      *   **Format:** Continuous prose, like a long letter to a colleague. No headings, bullets, bold text, tables, quotations, bibliography, or reading lists. Work from memory/standard understanding.

  2.  **Deconstruct the Core Claim (Foundation-Blindness):**
      *   *Creon:* Focuses on Authority, Loyalty (to city), Fairness (traitors shouldn't be honored). He sees Antigone's act as disobedience, not piety. He dismisses the "unwritten laws" initially.
      *   *Antigone:* Focuses on Sanctity (burial rites), Loyalty (to blood kin), Care (for brother's soul). She sees Creon's edict as impious tyranny, not state-building.
      *   *Blindness:* Do they ever acknowledge the validity of the other's foundation? Creon calls her mad/irrational. Antigone calls him a fool/tyrant. Haemon tries to bridge (Fairness/Care + Authority), but Creon rejects it. Tiresias brings Sanctity/Pollution back to Creon, but only when it's too late.
      *   *Verdict:* The claim holds well for most of the play. The tragedy arises from the incommensurability of their moral languages until the catastrophic end.

  3.  **Address Complication 1 (Liberty Foundation):**
      *   *Issue:* Adding Liberty makes Antigone a hero of freedom vs. oppression. This simplifies the tragedy into a modern political allegory.
      *   *MFT Critique:* MFT often associates Liberty with resistance to oppression (both left and right, but often coded differently). If Antigone is Liberty vs. Authority, it flattens the Sanctity/Loyalty conflict.
      *   *Analysis:* Does MFT license this? Yes, because Liberty is often triggered by dominance. But is it *accurate* to the text? Antigone isn't fighting for general liberty; she's fighting for specific religious duty. She accepts death willingly. It's not liberal autonomy.
      *   *Implication:* If MFT can easily flip to support the "resistance" reading, it might be too flexible (underdetermined). It risks turning a tragic clash of goods into a good-vs-evil narrative.

  4.  **Address Complication 2 (Breadth vs. Narrowness):**
      *   *MFT Claim:* Conservatives use all 5-6; Liberals use mostly Care/Fairness. Conservatives see "more" of the moral landscape.
      *   *Play's Reality:* Both Creon and Antigone seem "full-blooded" in their own domains. Creon cares about City (Loyalty/Authority), Antigone about Gods/Family (Sanctity/Loyalty). Neither is "narrow" in the MFT sense of lacking foundations; they are narrow in *which* foundations they prioritize to the exclusion of others.
      *   *Tragedy:* It's not that one sees more; it's that both see *something* real but fail to integrate them. Breadth without integration leads to collision.
      *   *MFT Limit:* MFT is descriptive. It doesn't have a normative rule for conflict resolution. It can't say "Sanctity trumps Authority" or vice versa. It just says "these are the buttons being pushed."

  5.  **Address the Normative Question:**
      *   *Who is right?* MFT cannot answer this. It explains *why* they feel they are right.
      *   *Deflationary Conclusion:* MFT helps diagnose the communication breakdown (foundation-blindness) but offers no adjudication. It reveals the structure of the disagreement, not the truth of the matter.
      *   *Cost:* We lose the comfort of knowing who is morally superior based on psychology alone. We have to return to philosophy/theology for the normative claim.

  6.  **Drafting - Section by Section (mental outline for flow):**
      *   *Opening:* Acknowledge the colleague, state the purpose (testing the foundation-blindness thesis).
      *   *The Blindness Claim:* Walk through the play. Creon's edict (Authority/Loyalty) vs. Antigone's act (Sanctity/Loyalty). The dust scene (Creon sees sabotage, Antigone sees duty). The Ship of State (Creon's metaphor of order). Antigone's Unwritten Laws (divine sanction).
      *   *Haemon & Tiresias:* Haemon tries to introduce Care/Fairness (public opinion, love) to Creon's Authority. Creon rejects it. Tiresias brings Sanctity (pollution) to Creon, finally piercing the blindness, but too late. Creon's collapse is the realization of the cost of blindness.
      *   *Access to Other's Perception:* Sophocles mostly withholds it. They talk past each other. The tragedy *is* the lack of translation.
      *   *Complication 1 (Liberty):* Address the student tendency. If Liberty is added, Antigone = Freedom. This flattens the tragedy. MFT allows this because Liberty is often anti-domination. But it misreads Antigone's motive (duty, not autonomy). This suggests MFT is flexible enough to be risky in interpretation.
      *   *Complication 2 (Breadth):* MFT says more foundations = broader view. But here, both have strong foundations. The problem isn't narrowness of repertoire, but rigidity of application. The play suggests breadth without a hierarchy or yield rule is destructive. MFT can't solve this because it's descriptive.
      *   *Normative Conclusion:* Be honest. MFT doesn't tell us who is right about burial or state. It tells us why they can't agree. The deflationary view: MFT is a diagnostic tool, not a judge.
      *   *Closing:* Summarize the pedagogical value.

  7.  **Refining the Tone:**
      *   Must be continuous prose.
