answer: |-
  Dear Colleague,

  It is a pleasure to hear about your upcoming seminar, and pairing Antigone with Moral Foundations Theory is a provocative choice that promises to generate exactly the kind of friction first-year students need to learn how to think rather than what to think. You have asked me to test a specific reading against the text, one that posits the tragedy not as a conflict of weighting but as a case of foundation-blindness, where neither protagonist can recognize the moral validity of the other's foundational commitments. You also want me to press hard on the complications regarding the liberty foundation, the theory's claims about moral breadth, and the normative limits of the psychology itself. I will take these in turn, working through the play as we both remember it, and I will try to be as honest about the theory's limitations as you are about the play's complexity.

  Starting with your core claim about foundation-blindness, I think the reading holds up remarkably well through the central agon of the play, though it requires us to be precise about what blindness means in this context. It is not that Creon lacks the capacity for piety or that Antigone lacks a sense of civic order, but rather that in the heat of the conflict, each categorizes the other's primary moral intuition as non-moral or anti-moral. When Creon issues his edict forbidding the burial of Polyneices, he is operating almost exclusively on the foundations of Authority and Loyalty to the group, specifically the polis. His language about the ship of state is the clearest expression of this; he sees the city as a vessel that requires a single helmsman to keep it from capsizing, and any dissent is not a moral objection but a structural threat. When the guard reports that someone has thrown dust over the corpse, Creon does not hear this as an act of religious devotion. He immediately assumes it is a transactional crime, bribes exchanged by sentries who are motivated by greed rather than principle. He cannot register the dust as a sign of Sanctity because, in his moral calculus, the traitor has forfeited the right to sacred rites. The foundation of Sanctity is present in his worldview, evidenced by his later concern with pollution, but he refuses to apply it to the enemy of the state. For him, Loyalty to the city trumps Sanctity for the dead, and he interpre Antigone's action not as a competing moral claim but as simple insubordination.

  Antigone, conversely, is blinded to the moral weight of Creon's Authority. She hears his edict not as a necessary stabilization of a city刚刚 recovered from civil war, but as an act of hubris that violates the unwritten and everlasting laws. Her focus is on Loyalty to blood kin and Sanctity regarding the rites due to the dead. When she stands before Creon, she does not attempt to argue that a stable city is unimportant; she simply dismisses his authority as illegitimate because it contravenes divine law. She calls his decree a proclamation, not a law, stripping it of moral force. In this sense, your thesis holds: she does not see him as a leader trying to secure order through difficult choices; she sees him as a tyrant bullying the dead. There is no moment in their direct confrontation where Antigone says, I understand you must protect the city, but nor does Creon say, I understand you must honor your brother. They speak past one another because they cannot translate the other's foundational priority into a valid reason for action. Each concludes the other is immoral, driven by madness or arrogance, rather than moral-but-differently-tuned.

  This blindness is illuminated further by Haemon's intervention. Haemon attempts to introduce the foundations of Care and Fairness into the conversation. He appeals to his father's well-being, suggesting that rigid authority might break like a tree in a flood, and he reports the public sentiment of the city, which is a form of Fairness or consensus. He tries to show Creon that his exercise of Authority is undermining the Loyalty of the people. Creon, however, rejects this input entirely. He accuses Haemon of being weakened by love, dismissing Care as a private weakness irrelevant to public rule, and he rejects the opinion of the populace as irrelevant to the command of the ruler. Here, the blindness is total; Creon cannot see that maintaining Authority actually requires attending to Care and Fairness. Antigone, for her part, barely engages with Haemon's attempt to save her. She is so fixed on her duty to the dead that she accepts death almost willingly, showing little Care for the living who will suffer, including Haemon himself. The tragedy deepens because the character who possesses the broadest moral视野，Haemon, is the one silenced.

  The turning point comes with Tiresias and the signs of pollution. The birds are fighting over the flesh of the dead, and the altars are polluted. This is the language of Sanctity made undeniable. Only when the physical world reflects the moral violation does Creon's blindness lift. He finally registers the Sanctity foundation, but only when it is framed as a threat to his own safety and the city's survival, effectively co-opting Sanctity into his Loyalty framework. His collapse at the end is the realization that his single-minded focus on Authority blinded him to the other foundations that sustain the world he was trying to protect. Sophocles seems to withhold genuine access to the other's moral perception until it is too late. There is no dialectical synthesis where Creon admits Antigone was right about the gods while Antigone admits Creon was right about the state. Instead, the gods validate Antigone's foundation through destruction, leaving Creon with the ruin of his own. This suggests that the tragedy is indeed about the catastrophic cost of foundation-blindness, where the inability to recognize the moral reality of the other leads to mutual destruction.

  However, when we introduce the Liberty foundation, as you noted, the shape of the reading changes, and this is where Moral Foundations Theory begins to show its seams. If you teach your students that Liberty is a foundation triggered by resistance to domination, Antigone immediately becomes a hero of liberty and Creon a villain of oppression. This is the reading students will reach instinctively because it aligns with modern liberal sensibilities. The theory licenses this reading because Liberty is often coded as a reaction against tyrannical Authority. But this creates a problem for your seminar because it turns the tragedy into a melodrama. If Antigone is simply Liberty versus Authority, then she is objectively right and Creon is objectively wrong, and the tragedy vanishes into a victory narrative for resistance. The fact that the same theory can generate both the nuanced foundation-blindness reading and the simplistic liberty-versus-oppression reading suggests that the list of foundations is underdetermined. It is too easy to extend. If any act of resistance can be coded as Liberty, then the theory risks becoming a mirror for the interpreter's politics rather than a tool for analyzing the text. Antigone is not fighting for autonomy in the modern sense; she is fighting for heteronomy, for submission to divine law. She is not free; she is bound by duty. To call this Liberty is to stretch the foundation until it loses its descriptive power. This complication should be presented to your students not as a flaw in the play, but as a limit in the theory's application. It shows that mapping ancient moral conflicts onto modern psychological categories can flatten the very differences we are trying to study.

  This leads directly to your second complication regarding moral breadth. The standard rhetoric of Moral Foundations Theory suggests that an outlook running on more foundations sees more of the moral landscape, while a narrow outlook is blinkered. Usually, this is used to suggest that conservatives, who score higher on the binding foundations, have a broader moral palate than liberals. Yet Antigone presents a scenario where two people, each running on a full-blooded set of foundations, destroy each other. Creon is not morally narrow in the sense of lacking foundations; he is deeply committed to Authority and Loyalty. Antigone is deeply committed to Sanctity and Loyalty. The problem is not that one lacks a foundation, but that both lack a rule for yielding. The play seems to argue that breadth without a hierarchy or a mechanism for conflict resolution is worse than narrowness, because it allows for total war between goods. If everyone sees their foundation as absolute, collision is inevitable. Moral Foundations Theory, being a descriptive psychology, cannot say this. It can describe that Creon values Authority and Antigone values Sanctity, and that they are different. It cannot tell us that this difference is tragic or that one should yield to the other. It has no normative gear. If you press the theory here, it risks implying that because Creon and Antigone both have strong moral intuitions, both are equally valid, which is a conclusion the play itself rejects by showing the ruin that follows. The play demands a judgment; the theory offers only a map.

  This brings us to the normative question, which is the one your students will ultimately care about. You asked how confident you should be in the empirical claim about the asymmetry between left and right, and what the theory entitles us to conclude about who is right. The honest answer is deflationary. Moral Foundations Theory tells us nothing about who is right about burial rites, about loyalty to kin versus loyalty to the state, or about authority and who owes what to whom. It explains the mechanism of the disagreement, not the truth of the matter. It tells us why Creon feels disgust at Antigone's disobedience and why Antigone feels disgust at Creon's edict, but it does not tell us whether the dead should be buried or whether traitors should be exposed. If you present the theory as a way to solve the moral conflict, you will mislead your students. The theory is diagnostic, not adjudicative. It entitles us to conclude that moral disagreements are often incommensurable because they rest on different foundational intuitions, and that recognizing this might reduce hostility. But it does not entitle us to conclude that all foundations are equally valid in every context, nor does it give us a procedure for deciding when Authority should yield to Sanctity.

  The cost of this deflationary conclusion is that you cannot use the theory to comfort your students with the idea that everyone is a little bit right. In Antigone, everyone is not a little bit right; everyone is destroyed except those who flee. The play suggests that some moral claims are objectively true within the context of the cosmos Sophocles depicts, specifically Antigone's claim about the unwritten laws, since the gods vindicate her. Moral Foundations Theory cannot capture this theological reality. It treats the gods as psychological projections of the Sanctity foundation. If you stick strictly to the theory, you must remain agnostic about whether the gods are real or whether the pollution is actual. But the play depends on them being actual. So you will have to tell your students that the psychology explains the human reaction, but the tragedy depends on a reality outside the psychology. This is a hard distinction to maintain, but it is necessary. If you conflate the two, you end up saying that Creon's change of heart is just a shift in psychological weighting, rather than a recognition of objective divine wrath.

  So, where does this leave your seminar? I think the foundation-blindness reading is robust and will serve you well, provided you use the complications to test the limits of the theory. You can show students how the theory illuminates the communication breakdown between Creon and Antigone, helping them see that the conflict is not just stubbornness but a clash of moral languages. You can then show them how the Liberty foundation, if applied carelessly, collapses the tragedy into a modern political fantasy, revealing the theory's susceptibility to projection. Finally, you can show them that while the theory explains why the characters fight, it cannot tell them who should have won. This is a valuable lesson in itself. It teaches students that psychology can explain belief, but it cannot replace philosophy or theology when it comes to truth. You should be confident in the theory's descriptive power regarding the asymmetry of moral intuition, but you should be equally confident in telling your students that this descriptive power buys them no normative currency. It costs you the ability to say the theory solves the problem, but it gains you the ability to show why the problem is so hard to solve.

  In the end, Sophocles gives neither character genuine access to the other's moral perception until the catastrophe is complete, and even then, it is Creon who sees the truth of Antigone's foundation only through the lens of his own loss. He does not become a convert to her cause; he becomes a victim of his own blindness. The theory helps us name this blindness, but it cannot cure it. If you present it this way, as a tool for diagnosis rather than a key for salvation, you will give your students a smaller claim that can defend itself against the hard questions the play inevitably raises. They will leave knowing that understanding why someone disagrees with them is not the same as resolving the disagreement, and that is a lesson worth teaching.

  I hope this helps you structure the term. It is a bold pairing, and if handled with the necessary caveats, it should provoke the kind of difficult thinking that defines a good seminar.

  Warmly,

  A Colleague
