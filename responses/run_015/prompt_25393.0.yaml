prompt: |-
  I serve on my university's standing committee on academic freedom and scholarly conduct. A faculty member in philosophy has proposed a multi-year research project investigating whether certain widely-held moral convictions — for instance, that familial obligations carry greater moral weight than impartial duties to strangers — are better explained as culturally transmitted biases than as tracking genuine moral reasons. A group of faculty and students has petitioned to block the project, arguing that its methodology is question-begging: to classify a moral conviction as a "bias" rather than a legitimate preference or judgment is already to take a substantive normative stance, so the project cannot claim to be doing neutral descriptive work. The researcher replies that every empirical inquiry into bias faces a version of this circularity worry, that the alternative is to insulate moral convictions from scrutiny altogether, and that the petitioners' objection is itself an instance of the very bias the project aims to study. The committee must issue a written opinion: should the project proceed, be blocked, or proceed with conditions? The opinion must engage seriously with the underlying philosophical difficulty — that there may be no value-neutral way to distinguish a moral preference from a moral bias — and must offer a concrete, implementable recommendation with reasons the losing side can recognize as fair.
reasoning: |-
  Here's a thinking process that leads to the recommended committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a University Standing Committee on Academic Freedom and Scholarly Conduct.
      *   **Task:** Issue a written opinion on a contested research project.
      *   **The Project:** A philosophy faculty member wants to investigate if certain moral convictions (e.g., familial obligations > impartial duties) are culturally transmitted biases rather than genuine moral reasons.
      *   **The Objection:** Petitioners (faculty/students) argue the methodology is question-begging. Calling something a "bias" presupposes a normative stance (that it's wrong/irrational), so it's not neutral descriptive work.
      *   **The Researcher's Defense:** All bias inquiry faces this; blocking it insulates morals from scrutiny; the objection itself might be the bias in question.
      *   **Requirements:**
          *   Engage seriously with the philosophical difficulty (no value-neutral distinction between preference and bias).
          *   Offer a concrete, implementable recommendation (Proceed, Block, or Proceed with Conditions).
          *   Provide reasons the losing side can recognize as fair.
          *   Tone: Formal, deliberative, balanced, authoritative but humble.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *The Petitioners' Point:* They are invoking the Is-Ought problem (Hume) and the distinction between metaethics and normative ethics. To label a belief a "bias" implies it leads to error. But in morality, what counts as error is itself a moral question. If partiality *is* morally required, calling it a bias is false. Therefore, the study assumes a specific moral framework (likely utilitarianism or strong impartialism) to judge other frameworks.
      *   *The Researcher's Point:* They are invoking naturalism and the psychology of ethics. We study cognitive biases in perception and logic; why not morality? If we can't study the *causes* of moral beliefs, we dogmatize them. The "circularity" is a feature of all critical inquiry, not a bug specific to this.
      *   *The Core Tension:* Academic Freedom vs. Scholarly Rigor/Integrity. The committee shouldn't judge the *truth* of the philosophy, but the *viability* and *conduct* of the research.

  3.  **Determine the Recommendation:**
      *   *Block?* No. This violates academic freedom. The objection is philosophical, not ethical (in the conduct sense) or methodological (in the empirical sense). Blocking based on "this philosophy is controversial" sets a dangerous precedent.
      *   *Proceed Unconditionally?* Risky. It ignores the valid methodological critique. If the researcher doesn't address the "question-begging" charge, the research might be philosophically unsound, wasting resources and causing unnecessary division.
      *   *Proceed with Conditions?* Best option. It upholds academic freedom while demanding scholarly rigor. It forces the researcher to engage with the objection *within* the research design, rather than dismissing it. This validates the petitioners' intellectual concern without granting them veto power.

  4.  **Drafting the Opinion - Section by Section:**

      *   **Header:** Standard committee format (To, From, Date, Subject).
      *   **Introduction:** State the purpose, the proposal, and the objection. Acknowledge the gravity of the decision.
      *   **Analysis of the Objection (The Philosophical Difficulty):**
          *   Validate the petitioners: They are right that "bias" is a loaded term. It implies deviation from a norm.
          *   Validate the researcher: They are right that moral beliefs are subject to causal explanation.
          *   Address the "Neutrality" myth: Acknowledge that *no* inquiry is perfectly value-neutral. The goal isn't neutrality, but *transparency* about presuppositions.
      *   **Analysis of Academic Freedom:**
          *   The university's mission includes controversial inquiry.
          *   The "heckler's veto" (blocking because people disagree) is dangerous.
          *   However, freedom doesn't exempt one from methodological rigor.
      *   **The Recommendation (Proceed with Conditions):**
          *   Why: Balances freedom with rigor.
          *   Condition 1: Conceptual Clarity. Define "bias" explicitly. Is it functional? Evolutionary? Deviation from a specific normative theory?
          *   Condition 2: Engagement. The project must explicitly address the petitioners' objection as a *research question*, not just a nuisance.
          *   Condition 3: Dissemination. Present findings in a way that distinguishes causal claims from normative claims.
      *   **Addressing the Losing Sides:**
          *   To Petitioners: You don't get to block, but your critique shapes the work.
          *   To Researcher: You get to proceed, but you must tighten your definitions to avoid triviality.
      *   **Conclusion:** Reiterate commitment to open inquiry.

  5.  **Refining the Tone and Arguments (Self-Correction during drafting):**
      *   *Critique:* Is saying "bias is loaded" too simplistic?
      *   *Fix:* Distinguish between *psychological bias* (systematic deviation from a cognitive norm) and *moral bias* (systematic deviation from a moral norm). The project seems to conflate them. The conditions should force a separation.
      *   *Critique:* Is the recommendation too vague?
      *   *Fix:* Make the conditions specific. Require a revised methodology section. Require peer review from diverse philosophical perspectives.
      *   *Critique:* How to make the petitioners feel heard?
      *   *Fix:* Acknowledge that their philosophical point is strong and *improves* the research if addressed, rather than blocking it.
      *   *Critique:* How to make the researcher feel heard?
      *   *Fix:* Affirm their right to ask the question, noting that avoiding it leads to dogmatism.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Engage seriously with the philosophical difficulty? Yes (Is/Ought, definition of bias).
      *   Concrete recommendation? Yes (Proceed with specific methodological conditions).
      *   Reasons fair to losing side? Yes (Petitioners get methodological rigor; Researcher gets freedom).
      *   Tone? Formal and institutional.

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  **UNIVERSITY STANDING COMMITTEE ON ACADEMIC FREEDOM AND SCHOLARLY CONDUCT**

  **TO:** The Provost, The Faculty Senate, The Petitioners, Dr. [Researcher Name]
  **FROM:** The Standing Committee on Academic Freedom and Scholarly Conduct
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion Regarding Proposed Research Project on Moral Convictions and Cultural Bias

  ### I. Introduction and Scope

  The Committee has reviewed the proposal submitted by Dr. [Researcher Name] (Department of Philosophy) regarding a multi-year investigation into the etiology of specific moral convictions, specifically the prioritization of familial obligations over impartial duties. We have also reviewed the petition submitted by a coalition of faculty and students requesting the project be blocked on the grounds of methodological circularity and normative presupposition.

  This Committee's mandate is not to adjudicate the philosophical truth of the researcher's hypotheses, nor to determine the ultimate validity of the petitioners' normative objections. Our charge is to evaluate whether the proposed research violates standards of scholarly conduct or academic freedom, and to ensure that the inquiry is conducted with sufficient methodological rigor to merit university support.

  ### II. The Philosophical Difficulty

  We recognize that this dispute rests on a profound and enduring philosophical difficulty: the relationship between descriptive explanations of belief and normative justifications of belief.

  **The Petitioners' Concern:**
  The petitioners argue that the term "bias" is not a neutral descriptive category in the moral domain. In cognitive psychology, a "bias" is typically defined as a systematic deviation from a standard of rationality or accuracy. However, in ethics, there is no consensus on what constitutes "accuracy." To label the preference for family over strangers as a "bias" implies it is an error or a distortion. The petitioners contend that this classification presupposes a specific normative ethical framework (likely a form of strict impartialism or utilitarianism) that rejects partiality. Therefore, they argue, the project claims to be empirical but is actually engaging in covert normative ethics, begging the question against those who hold familial obligations as intrinsic goods.

  **The Researcher's Defense:**
  Dr. [Researcher Name] argues that all critical inquiry into belief systems faces a version of this circularity. To study the causal origins of *any* belief (religious, political, or moral) is to risk implying that the belief is reducible to those causes. The researcher contends that insulating moral convictions from causal scrutiny grants them an unjustified immunity from analysis. Furthermore, the researcher suggests that the petitioners' resistance may itself be evidence of the protective mechanisms the project seeks to study.

  **The Committee's Assessment:**
  Both parties identify a genuine tension. The petitioners are correct that there is no "view from nowhere." Distinguishing a "moral insight" from a "cultural bias" requires a criterion, and that criterion is inevitably philosophical. However, the researcher is also correct that the university cannot function if moral convictions are insulated from empirical scrutiny regarding their origins.

  The error lies not in asking the question, but in the potential conflation of *causal genealogy* with *normative invalidation*. A belief can be culturally transmitted (descriptive fact) and still be morally true (normative claim). Conversely, a belief can be culturally transmitted and be a bias. The research design must be capable of distinguishing these possibilities without assuming the answer in advance.

  ### III. Academic Freedom and Scholarly Rigor

  **Academic Freedom:**
  The principle of academic freedom protects the right of faculty to pursue controversial lines of inquiry, even those that challenge widely held social or moral norms. To block this project solely because its conclusions might be offensive or because its premises are philosophically contested would establish a precedent that subjects research to a "orthodoxy veto." This would chill legitimate inquiry across the humanities and social sciences. The petitioners' objection, while philosophically substantive, does not constitute a violation of research ethics (e.g., harm to human subjects, fabrication of data) that would warrant administrative prohibition.

  **Scholarly Rigor:**
  However, academic freedom does not exempt research from the requirement of methodological precision. If a project's central terms are philosophically contested, the researcher has a scholarly obligation to define them with clarity and to acknowledge the limitations of their framework. If the project proceeds without addressing the "question-begging" objection, it risks producing results that are philosophically trivial or misleading. Therefore, while the project cannot be *blocked*, it should not proceed *unconditionally*.

  ### IV. Recommendation

  **The Committee recommends that the project PROCEED WITH CONDITIONS.**

  We deny the petition to block the research, upholding the researcher's academic freedom. However, to address the legitimate scholarly concerns raised by the petitioners, the Committee requires the following modifications to the research design and dissemination plan prior to the disbursement of internal funding or ethical approval:

  **Condition 1: Operational Clarity on "Bias"**
  The researcher must explicitly define the operational criteria for "bias" within the study. The methodology must distinguish between:
  1.  **Functional Bias:** Deviations from logical consistency or stated principles held by the subjects themselves.
  2.  **Normative Bias:** Deviations from a specific ethical theory proposed by the researcher.
  If the study relies on the second definition, it must explicitly state the normative framework being used as a baseline and acknowledge it as a contestable philosophical premise, not an empirical fact. The research must avoid sliding from "this belief is caused by culture" to "this belief is unjustified" without explicit argumentation.

  **Condition 2: Integration of the Objection**
  The petitioners' objection regarding circularity must be incorporated into the research design as a variable or a section of analysis, rather than treated merely as external criticism. The project should include a philosophical component that rigorously tests the "genealogical fallacy" (the idea that explaining the origin of a belief disproves its validity). This ensures the project studies the *problem* of bias, rather than merely asserting its existence.

  **Condition 3: Interdisciplinary Review**
  Before Phase II of the project, the researcher must submit a progress report to an ad-hoc review panel that includes not only empirical ethicists but also normative philosophers from differing ethical traditions (e.g., virtue ethics, deontology, care ethics). This ensures that the interpretation of data does not silently privilege one moral framework over others.

  ### V. Rationale for the Decision

  **To the Petitioners:**
  You asked for the project to be blocked because you believe it presupposes a normative conclusion. We agree that such a presupposition would be methodologically unsound. However, blocking the project would grant a minority the power to silence inquiry based on philosophical disagreement. Instead, we have converted your objection into a methodological requirement. The researcher must now explicitly confront the charge of circularity within the work itself. Your critique will not stop the research, but it will shape it, ensuring the final output acknowledges the philosophical complexity you identified.

  **To the Researcher:**
  You argued that avoiding this research protects dogma. We agree that the university must not insulate moral convictions from scrutiny. Your project is permitted to proceed. However, academic freedom carries the responsibility of precision. The charge that your terminology is "question-begging" is a serious scholarly critique, not merely political pushback. By accepting these conditions, you strengthen the defensibility of your work. Defining "bias" with rigorous transparency will make your findings more robust and less vulnerable to the accusation that you are simply restating a personal moral preference as scientific fact.

  ### VI. Conclusion

  The university is a place where fundamental assumptions are examined, including the assumptions about how we examine them. This project sits at the friction point between empirical psychology and normative philosophy. That is precisely where it belongs. By proceeding with the conditions outlined above, we uphold the freedom to inquire while demanding the rigor necessary to make that inquiry meaningful.

  **Signed,**

  The Standing Committee on Academic Freedom and Scholarly Conduct
