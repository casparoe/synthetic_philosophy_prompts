          *   For Hospitals: You can't trust observational data for causal claims easily. Look for "Instrumental Variables" or randomized trials if possible. Otherwise, use pre-treatment risk adjustment only.
      *   *Coined Term:* The user asked for a coined term if no established one exists. I will suggest **"The Stratification Rabbit Hole"** or **"Causal Fragility."** Let's go with something more formal sounding but descriptive. **"The Identification Regress."** Or simply explain that it's **Unidentified Causal Effects**. Let's stick to the prompt's request: "If the pattern... has no established name, I would rather you said so and gave me a coined term."
      *   *Refining the Coined Term:* "Simpson's Regress" sounds good. Or "The Conditioning Trap." Let's use **"The Stratification Regress."**
      *   *Boundary Cases:*
