answer: |-
  You have independently rediscovered one of the most profound and difficult problems in modern statistics and causal inference. You are correct: the simple two-level reversal (Simpson's Paradox) is just the entry point. What you are encountering—the ability to keep finding new variables that flip the result indefinitely, especially when those variables are influenced by the treatment itself—does not have a single, universally recognized name like "Simpson's Paradox."

  However, it is a well-known failure mode in causal analysis. Since you asked for a coined term if no established one exists, I will give you a precise label for this phenomenon, followed by the technical concepts that explain *why* it happens and *how* to stop it.

  ### 1. The Name of the Phenomenon

  There is no standard noun for "Simpson's Paradox that continues indefinitely." In technical literature, this is usually discussed as a **Failure of Causal Identification** or **Instability under Stratification**.

  Per your request, I will coin a term for the specific pattern you described: **The Stratification Regress**.

  **Definition:** The Stratification Regress occurs when comparing two groups (A vs. B) yields a result that reverses direction repeatedly as you condition on additional variables, with no stable layer of granularity where the effect converges, often because the variables used for conditioning are themselves outcomes of the group assignment.

  **Boundary Cases:**
  *   **Clearly Counts (The Regress):** You split by Patient Severity (pre-existing), then by ICU Admission (post-treatment), then by Surgeon ID (post-treatment selection). The result flips at every step, and sample sizes shrink.
  *   **Clearly Does Not Count (Effect Modification):** You split by Device Type (Mobile vs. Desktop). The variant wins on Mobile and loses on Desktop, and *stays that way* regardless of further splitting by browser or OS. This is not a regress; this is a genuine **Interaction Effect**. The treatment genuinely works differently for different people.
  *   **Clearly Does Not Count (Noise):** You split until you have 5 patients per box. The result flips because of random chance. This is **Overfitting**, not structural regress.

  ### 2. The "Cheating" Move: Post-Treatment Bias

  You asked for a principled rule regarding variables "that the thing you are comparing helped to bring about." There is a name for this, and a strict rule.

  **The Name:** **Post-Treatment Bias** (specifically, conditioning on a **Mediator** or a **Collider**).

  **The Principled Rule:** **The Temporal Precedence Rule.**
  You may only condition on (split by) variables that were determined *before* the patient entered the clinic or the visitor landed on the page.

  **Why it matters:**
  *   **Confounders (Valid to split):** Patient Severity, Age, Location. These exist *before* treatment. They influence which clinic you go to *and* your health outcome. You *must* adjust for these to get a fair comparison.
  *   **Mediators (Invalid to split):** ICU Admission, Wait Time, Campaign Eligibility. These happen *after* treatment. Clinic A might send fewer people to the ICU *because* they treat them better. If you split by "ICU Admission," you are removing part of Clinic A's success from the scorecard. You are penalizing them for the mechanism of their success.
  *   **Colliders (Invalid to split):** Surgeon ID (if assigned based on severity + availability). Conditioning on these creates fake correlations where none exist.

  **In your specific cases:**
  *   **Hospital:** "ICU Admission" and "Wait Time" are outcomes of the clinic's efficiency. Splitting by them is cheating. "Severity on Arrival" is valid.
  *   **Website:** "Advertising Campaign" is invalid if the page variant influenced eligibility. "Device Type" is valid (the user owns the phone before they visit).

  ### 3. Real Structure vs. Search Artifact

  You asked how to distinguish genuine structural flipping from noise manufactured by searching.

  **The Diagnostic:** **Pre-Registration and Sample Size.**

  1.  **The Search Artifact (P-Hacking):** You wrote a script to search *all* columns for a reversal. This is the **Multiple Comparisons Problem**. If you test 50 columns, purely by chance, 2 or 3 will show a statistically significant reversal even if none exists.
      *   *Sign:* The reversal disappears if you collect more data. The confidence intervals in the deep slices are huge.
      *   *Rule:* If you did not decide to look at that specific split *before* you saw the data, you are not allowed to trust it for decision-making.

  2.  **The Structural Reality (Interaction):** The effect genuinely differs by subgroup.
      *   *Sign:* The reversal holds up in new data. The sample sizes in the subgroups are large enough that the result is precise (narrow confidence intervals). There is a plausible physical reason (e.g., the page loads slower on mobile, so mobile users hate it).
      *   *Rule:* This requires a decision. Do you ship a page that helps Desktop users but hurts Mobile users? That is a business ethics question, not a stats question.

  ### 4. How to Decide (Actionable Advice)

  You need to sign off on a page and choose a clinic. Here is the protocol to escape the Stratification Regress.

  #### For the Online Retailer (A/B Testing)
  Your A/B test setup sounds compromised ("changing the page changed which campaigns were eligible"). This breaks the randomization.
  1.  **Trust the Top Line (Intent-to-Treat):** If randomization was done correctly at the start, the overall number is the only unbiased estimate of the *total* effect. Do not split on post-treatment variables (campaigns).
  2.  **Pre-Test Segmentation:** Only look at splits you defined *before* the test started (e.g., "We hypothesize this works better on iOS"). Ignore any splits your script finds after the fact.
  3.  **Fix the Leak:** Ensure the variant cannot influence traffic sources. If it does, you are no longer running an A/B test; you are running an observational study, and you cannot prove causality.

  #### For the Hospital (Observational Data)
  You cannot trust the "overall" number (Simpson's Paradox risk), but you cannot trust the "deep split" numbers (Stratification Regress risk).
  1.  **Adjust for Pre-Treatment Only:** Build a model that predicts success based *only* on things known at arrival (Age, Severity, Comorbidities). Compare Clinic A and Clinic B *after* mathematically equalizing these factors. This is called **Risk Adjustment**.
  2.  **Ignore Post-Treatment Columns:** Discard columns like "ICU," "Wait Time," "Surgeon." These are part of the treatment, not the context.
  3.  **Accept Uncertainty:** If Clinic A looks better on risk-adjusted data, but the confidence interval overlaps with Clinic B, you cannot know. Do not let the Stratification Regress force a false certainty.

  ### Summary of Terms for Your Vocabulary

  *   **Simpson's Paradox:** The 2-level reversal (Confounder).
  *   **The Stratification Regress (Coined):** The infinite flipping you are seeing.
  *   **Post-Treatment Bias:** The error of splitting on things the treatment caused.
  *   **The Temporal Precedence Rule:** The fix. Only split on what existed *before*.
  *   **Multiple Comparisons Problem:** The reason your script always finds a flip (noise).

  **The Bottom Line:**
  Send your mother to the clinic with the better **Risk-Adjusted** outcome (adjusted for severity/age only). Ship the website variant that wins **Overall**, provided the test was truly randomized. If the script finds a reversal based on post-treatment data, ignore it. It is not insight; it is statistical self-sabotage.
