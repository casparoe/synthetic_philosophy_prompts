answer: |-
  Your suspicions are well-founded. You have spotted a technical conflation in the text that is common in survey literature but significant enough to warrant the confusion you're experiencing. Your arithmetic on the two-transmission case is also correct, and the "packaging dependence" you've identified is a known, serious objection to this class of updating rules.

  Here is a sentence-by-sentence breakdown of the passage, followed by an analysis of your counterexample.

  ### Part 1: Critique of the Passage

  **1. The Setup and Naive Bayesian Move**
  > *"Judy parachutes into a region... Her prior is 0.3... 0.2... 0.1... 0.4... The naive Bayesian move is to conditionalize on the material conditional... which deletes the 0.2 sitting on the excluded cell and renormalizes, giving 3/8, 1/8 and 1/2."*

  *   **Verdict:** **Correct.**
  *   **Analysis:** The arithmetic holds. $P(\neg S \lor T) = 1 - P(S \land F) = 0.8$. Renormalizing the remaining cells ($0.3, 0.1, 0.4$) by dividing by $0.8$ yields $0.375$ ($3/8$), $0.125$ ($1/8$), and $0.5$ ($4/8$). The new probability of Second Company ($S$) is indeed $0.375$. This is the standard setup for the Judy Benjamin Problem (JBP).

  **2. Van Fraassen's Objection**
  > *"Van Fraassen's objection is that this cannot be right, because it also moves her probability of being in the Second Company area, from 0.5 down to 3/8, and the message tells her nothing at all about which company she's in."*

  *   **Verdict:** **Fair Summary.**
  *   **Analysis:** This accurately captures the intuitive pump. The conditional "If $S$, then $T$" restricts the *internal* structure of $S$ (ruling out $F$ within $S$) but seems to offer no evidence comparing $S$ to $H$. Therefore, the marginal probability $P(S)$ should remain invariant. This is the core motivation for rejecting simple conditionalization on the material conditional.

  **3. Van Fraassen's Constraint**
  > *"His own constraint is that her probability for the antecedent should stay where it was: so the excluded 0.2 goes onto Second Company/Third Platoon, leaving 0.5, 0.1 and 0.4."*

  *   **Verdict:** **Correct (as a description of the result).**
  *   **Analysis:** The numbers describe the actual solution Van Fraassen proposes. If $P(S)$ must remain $0.5$, and $P(S \land F)$ must become $0$, then by additivity, $P(S \land T)$ must become $0.5$. The text implies the $H$-cells ($0.1, 0.4$) remain untouched. This satisfies the constraints: $P(S)$ is fixed, and the conditional is satisfied.
  *   **Nuance:** Van Fraassen derives this from a principle of minimal information loss (minimizing cross-entropy) subject to the constraint that $P(S)$ is unchanged. The text skips the derivation and states the constraint directly, which is acceptable for a survey.

  **4. The Jeffrey Conditioning Claim**
  > *"This is really just probability kinematics — Jeffrey conditioning on the coarse partition {Second Company, HQ}, with the new probability of the antecedent set equal to the old one..."*

  *   **Verdict:** **Incorrect / Conflation.**
  *   **Analysis:** This is the error you detected. Jeffrey Conditioning (JC) on a partition $\{E_1, E_2\}$ updates probabilities according to:
      $$P_{new}(X) = P_{old}(X|E_1)P_{new}(E_1) + P_{old}(X|E_2)P_{new}(E_2)$$
      If you perform JC on the partition $\{S, H\}$ and set the new probabilities equal to the old ones ($P_{new}(S) = P_{old}(S) = 0.5$), the equation yields **no change whatsoever**. $P_{new}(X) = P_{old}(X)$ for all $X$.
      Specifically, JC on $\{S, H\}$ preserves the conditional probabilities *within* the cells. It would preserve $P_{old}(F|S) = 0.4$. But the solution described requires $P_{new}(F|S) = 0$.
      To get the result described ($0.2$ shifting from $S \land F$ to $S \land T$) using Jeffrey Conditioning, you would need to condition on the finer partition $\{S \land T, S \land F, H\}$ (or similar) and explicitly stipulate the new probability of the cell $S \land F$ is $0$. Describing this as JC on the *coarse* partition $\{S, H\}$ is technically wrong. It conflates "fixing the marginal of the antecedent" with "Jeffrey conditioning on the antecedent." They are not the same operation.

  **5. Propositions and Bayesian Updating**
  > *"Notice too that Judy cannot conditionalize on anything here: what she has learned is a conditional, and conditionals don't express propositions, so there is no proposition for strict conditionalization to take as evidence. That's what makes the example important: it's a case where Bayesian updating as such runs out."*

  *   **Verdict:** **Standard Dogma (Acceptable Simplification).**
  *   **Analysis:** Within the context of the JBP literature, this is the received view. It relies on Lewis's Triviality Results, which suggest conditionals cannot be truth-functional propositions with standard probabilities. If you accept that premise, strict conditionalization is indeed unavailable. A specialist might quibble that some semantic frameworks *do* treat conditionals as propositions, but for the purpose of explaining why JBP motivates alternative updating rules (like JC or MinEnt), this claim is standard.

  ### Part 2: Analysis of Your Two-Transmission Case

  Your arithmetic is correct, and the problem you have identified is genuine. It is known in the literature as **path dependence** or the failure of **commutativity**.

  **1. The Arithmetic**
  *   **Step 1 (If $S$, then $T$):** You correctly applied the rule. $P(S)$ fixed at $0.5$. $S \land F$ zeroed. Mass shifts to $S \land T$.
      *   Result: $P(S \land T)=0.5, P(H \land T)=0.1, P(H \land F)=0.4$.
  *   **Step 2 (If $H$, then $T$):** You correctly applied the rule again. $P(H)$ fixed at current value ($0.5$). $H \land F$ zeroed. Mass shifts to $H \land T$.
      *   Result: $P(S \land T)=0.5, P(H \land T)=0.5$.
      *   Final $P(S) = 0.5$.
  *   **Direct Comparison (Learn $T$):** Conditionalizing the prior on $T$.
      *   Prior mass on $T$: $0.3 (S) + 0.1 (H) = 0.4$.
      *   $P(S|T) = 0.3 / 0.4 = 0.75$.
  *   **Discrepancy:** $0.5$ vs $0.75$.

  **2. Is this a known cost?**
  Yes. This is a major objection to Van Fraassen's solution and similar "invariance" constraints.
  *   **The Issue:** The constraint "Keep $P(\text{Antecedent})$ fixed" treats the antecedent as probabilistically insulated from the consequent. In your two-step case, learning "If $H$, then $T$" fixes $P(H)$ at $0.5$. However, in the direct case, learning $T$ *should* update $P(H)$ because $H$ and $T$ are correlated in the prior ($P(T|H) = 0.2$, $P(T|S) = 0.6$). $T$ is evidence for $S$ over $H$.
  *   **Why the Rule Blocks This:** By stipulating that learning a conditional cannot change the probability of its antecedent, the rule forbids the "backwards" flow of information from consequent to antecedent. When you learn the two conditionals sequentially, you effectively lock the Company probabilities in place twice, preventing the Platoon evidence from updating the Company odds. When you learn the Platoon location directly, that lock is not applied, and the evidence flows naturally.
  *   **Philosophical Description:** This violates the principle that rational updating should be **commutative**: the order in which you receive evidence (or the way it is packaged) should not affect the final posterior, provided the total information content is the same.
  *   **Is it a "bug" or a "feature"?** Proponents of the rule might argue the inputs *aren't* equivalent. Learning "If $S$ then $T$" is not the same as learning "$S \to T$ is true" which is not the same as learning "$T$". They argue the rule is designed specifically for *conditional* evidence, not categorical evidence. However, your example shows that if you receive enough conditional evidence to logically entail a categorical fact ($ (S \to T) \land (H \to T) \vdash T $), the rule yields a different result than learning the categorical fact. Most decision theorists view this as a significant cost (a bug), as it makes the agent vulnerable to diachronic Dutch Books or simply irrational packaging effects.

  ### Summary for Your Reading Group

  1.  **Trust the Setup, Distrust the Mechanism:** The chapter accurately describes the Judy Benjamin setup and Van Fraassen's *constraints* (fix $P(S)$, zero $P(S \land F)$).
  2.  **The Jeffrey Error:** The claim that this is "Jeffrey conditioning on the coarse partition {Second Company, HQ}" is technically false. JC on that partition with fixed marginals produces no change. The author is conflating Van Fraassen's minimal-distance solution with Jeffrey Conditioning.
  3.  **Your Counterexample:** You have not made a calculation error. You have demonstrated **path dependence**. The rule "Fix $P(\text{Antecedent})$" prevents the aggregation of conditional evidence from mimicking the update of the entailed categorical evidence. This is a standard and potent objection to Van Fraassen's specific solution.
  4.  **"Bayesian Updating Runs Out":** This claim survives correction only if you accept the premise that conditionals aren't propositions. If you accept that, then yes, strict conditionalization is unavailable, and we need a generalization (like the one discussed, however sloppily).

