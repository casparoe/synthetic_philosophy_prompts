          *   Address misconceptions (coup requirement, policy dislike, expert neutrality).
          *   Include the "competitive-authoritarian origins" wrinkle (false teleology).
          *   Include a final check question.
          *   **Format:** Lead with the bottom line (core sequence, carrying example, misconception blocks), then give reasoning. No preamble, no restating the question, no reading list/citations.

  2.  **Determine the Core Teaching Sequence (The "Bottom Line"):**
      *   *Minute 0-10:* Hook & Definition via Exclusion (What it isn't).
      *   *Minute 10-25:* The Carrying Example (Institutional Move) & Procedural vs. Liberal.
      *   *Minute 25-35:* The Boundary Objects (Hungary/Poland/Turkey/US) as Stress Tests.
      *   *Minute 35-45:* The Wrinkle (Competitive Authoritarianism/Teleology).
