      *   *Carrying Example:* Court-packing/Judicial Capture (clearer distinction between legal procedure and normative erosion than media capture).
      *   *Misconception Blocks:* Early (policy dislike), Middle (coup requirement), Late (expert neutrality/teleology).

  3.  **Refine the Ordering (Procedural vs. Liberal):**
      *   The user asks: "What has to come first? Do they need procedural minimalism... nailed down before we talk about liberal norms, or does that order already smuggle in a framing they won't accept?"
      *   *Decision:* Start with procedural minimalism *as the baseline*, but immediately challenge it. If you start with liberal norms, you lose the skeptics who think "democracy = voting." If you start *only* with procedure, you miss the backsliding (which often happens procedurally).
      *   *Strategy:* Define democracy minimally first (Schumpeterian), then show how backsliding happens *within* those rules. This avoids the "framing" trap because you accept their minimal definition before expanding it.

  4.  **Select the Carrying Example:**
      *   Court-packing vs. Media Capture.
      *   Media capture is messy (ownership laws, market forces).
      *   Court-packing is institutional, legalistic, and clearly distinguishes "following rules" vs. "breaking norms." It fits the "legal autocracy" vibe of Hungary/Poland/US debates.
