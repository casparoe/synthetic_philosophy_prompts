  5.  **Address the "Competitive-Authoritarian Origins" Wrinkle:**
      *   Where to inject? Late in the session (Minute 35-45). If done too early, it undermines the definition before it's built. It serves as a critique of the concept itself, which fits after they understand the concept.
      *   Focus: Turkey vs. Hungary. Turkey never fully consolidated; Hungary did (arguably). Does "backsliding" apply equally?

