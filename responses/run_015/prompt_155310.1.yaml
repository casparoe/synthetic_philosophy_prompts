answer: |-
  **Core Teaching Sequence (50 Minutes)**

  *   **0–10 mins: Negative Definition & Procedural Baseline.** Start by listing what backsliding is *not* (policy loss, election loss). Establish procedural minimalism (elections occur, incumbents can lose) as the shared floor. This meets skeptics where they are without conceding the argument.
  *   **10–25 mins: The Carrying Example (Judicial Capture).** Use court-packing or tenure alteration. Walk through the mechanism: it is legal, procedural, and incremental, yet it removes the veto point necessary for the procedural baseline to function. This blocks the "coup" misconception.
  *   **25–35 mins: Boundary Objects as Stress Tests.** Put Hungary, Poland, Turkey, and the US on the board not as histories but as variables. Ask: "At what specific legislative move does the US look like Hungary?" and "Does Turkey 'backslide' if it never consolidated?" Use these to separate the *act* from the *country label*.
  *   **35–45 mins: The Teleology Wrinkle.** Introduce the competitive-authoritarian critique. Argue that "backsliding" implies a prior climb. If the baseline was never solid (Turkey), is it backsliding or unmasking? This addresses the "expert neutrality" misconception by showing the baseline itself is a political construct.
  *   **45–50 mins: The Check Question.** Ask: "Describe a specific institutional change your preferred party could enact tomorrow that would constitute democratic backsliding. Why is that distinct from them passing a policy you disagree with?"

  **Carrying Example:** Judicial Independence/Tenure Alteration.
  **Misconception Blocks:**
  1.  **"Policy Dislike"**: Blocked in Minute 0–10 (Negative Definition).
  2.  **"Coup Requirement"**: Blocked in Minute 10–25 (Legal Mechanism).
  3.  **"Expert Neutrality/Teleology"**: Blocked in Minute 35–45 (Baseline Critique).

  ***

  **Reasoning**

  **1. Procedural Minimalism First (The Skeptic Trap)**
  You must nail down procedural minimalism before liberal norms. If you open with liberal norms (rights, minority protections), grad students skeptical of the concept will reject the premise as ideological smuggling. They view democracy as aggregation (voting), not liberalism (rights). By accepting their procedural baseline first—"Democracy is where incumbents can lose"—you secure agreement. Then, you demonstrate how backsliding occurs *within* those procedures (e.g., making it legally impossible to lose next time). This forces them to admit erosion is happening without requiring them to adopt a normative framework they distrust initially.

  **2. Judicial Capture as the Carrying Example**
  Media capture is too ambiguous for a 50-minute session; ownership laws and market forces muddy the water. Court-packing is the superior carrying example because it is distinctly institutional and legalistic. It creates a sharp distinction between *erosion of rules* (changing the constitution legally) and *erosion of norms* (using legal changes to eliminate future competition). It directly addresses the "coup" misconception because no tanks are rolled out; the gavel is used instead. It allows you to show that backsliding is often the *hyper-utilization* of rules, not the breaking of them.

  **3. Boundary Objects vs. Case Studies**
  Using Hungary, Poland, Turkey, and the US as boundary objects prevents the session from becoming a comparative politics lecture. You are not teaching them about Orbán or Erdoğan; you are using those names as proxies for "consolidated democracy eroding" vs. "competitive authoritarianism unmasking." This keeps the focus on the *concept* of backsliding. When you ask "At what move does the US look like Hungary?", you force them to identify the universal mechanism (e.g., changing electoral commission composition) rather than getting bogged down in local cultural exceptions.

  **4. Placement of the Teleology Wrinkle**
  Inject the competitive-authoritarian critique (Turkey vs. Hungary) in the final ten minutes before the check question. If you introduce this too early, it destabilizes the definition before they grasp it. By placing it late, you use it to complicate the "baseline" discussion. It challenges the idea that experts are neutral arbiters because the expert must first decide what the "normal" level of democracy was. This prepares them for the check question by forcing them to acknowledge that identifying backsliding requires defining a starting point that may not exist.

  **5. The Check Question**
  The final question forces personal application. If they can only identify backsliding when the *other* party does it, they haven't learned the concept; they've learned a partisan heuristic. By requiring them to articulate an institutional change enacted by their *preferred* party, you strip away the policy preference variable. If they cannot name an act their own side could commit that would damage democracy, they still view backsliding as a label for "the other party won."
