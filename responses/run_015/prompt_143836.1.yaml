answer: |-
  Severity-ranked tensions

  The most severe conflict is between (2) and (3). Commitment (2) is illusionism: it claims phenomenal properties do not exist. Commitment (3) is the Phenomenal Concept Strategy: it claims phenomenal concepts are special and the explanatory gap is real (even if only conceptual). These are typically rival solutions to the hard problem, not partners. If (2) is true, there is nothing for phenomenal concepts to refer to, so they aren't "special shortcuts" to reality—they are systematic errors or misrepresentations. By calling the gap "real" in (3), you are conceding that there is a genuine explanatory target that physicalism struggles to capture, which undermines the illusionist claim in (2) that the target itself is bogus. You are trying to use a realist tool (PCS) to defend an anti-realist conclusion (Illusionism), which creates a metaphysical stutter.

  The second tension is between (3) and (6). In (6), you argue the hard problem should be dissolved as a category mistake. However, in (3), you affirm that the explanatory gap is "real." If the gap is real, even conceptually, then the problem hasn't been fully dissolved; it has merely been relocated from metaphysics to semantics. A true dissolution shows that the question rests on false presuppositions (matching 6), but acknowledging a "real gap" validates the intuition that something is missing (contradicting 6). This makes your view unstable: are we confused because we are asking about nothing (6), or are we confused because our concepts don't map well onto something real (3)? You need to pick one source of confusion.

  The least severe tension is between (2) and (5). You worry this is hypocrisy, but logically it is merely a distinction between metaphysical truth and pragmatic normativity. The tension arises only if you assume moral status requires intrinsic phenomenal properties. If you ground moral status in functional complexity or social coordination (as 5 suggests), there is no contradiction. However, it creates a motivational friction: you must advocate treating others as having property X while believing X does not exist. This isn't a logical contradiction, but it requires a robust error theory of ethics to maintain without feeling like you are lying, which can make the view psychologically difficult to hold consistently.

  Apparent conflicts that dissolve

  Your worry about (2) and (4) dissolves once you distinguish between lacking a property and lacking the mechanism that generates the belief in that property. Saying a thermostat lacks consciousness isn't like saying it lacks the color of a spreadsheet; it's like saying a calculator lacks a "user interface." The thermostat doesn't lack the intrinsic property (since nothing has it); it lacks the specific computational architecture that generates the *illusion* of having such a property. Similarly, the hypocrisy worry in (5) dissolves if you adopt a fictionalist stance. You aren't lying when you treat others as conscious; you are participating in a necessary social protocol that operates on the interface level, regardless of the backend ontology. These are consistent moves for an illusionist.

  Single best revision

  You should revise (3) to align strictly with (2). Instead of saying phenomenal concepts are "special" and the gap is "real," characterize phenomenal concepts as misrepresentational states that systematically report non-existent properties. Deny that the gap is real even conceptually; instead, call it a cognitive artifact produced by the compression layer. This removes the realist baggage of the Phenomenal Concept Strategy and turns your view into a consistent illusionism. The cost is that you lose the intuitive comfort of saying our concepts "track" something real, but it saves you from the contradiction of claiming nothing exists while simultaneously granting our concepts special explanatory power.

  Bottom line

  Your brain isn't broken; you have accidentally reconstructed a version of Illusionism (similar to views held by Keith Frankish or Daniel Dennett), but you are hedging with Realist tools. The package is salvageable with tweaks, specifically by hardening your stance on the non-existence of the gap. You do not need to abandon the user-illusion framing; it is a coherent physicalist position. However, you must stop treating the illusion as if it has ontological weight. If you commit fully to the idea that the "what it's like" is a bug rather than a feature, the tensions between your metaphysics and your conceptual story will vanish.
