answer: |-
  ### PhD Comprehensive Exam: Political Philosophy
  **Time Allowed:** 90 Minutes
  **Question:**

  Consider the following distinction regarding political wrongdoing: **Executive Stain** occurs when a leader personally orders or performs a morally wrongful act (e.g., pulling a trigger, signing a specific torture warrant). **Delegated Stain** occurs when a leader authorizes a wrongful act through institutional layers (e.g., setting a policy known to necessitate torture, approving a budget for covert coercion) such that she does not personally execute it, yet knows and approves of the outcome.

  Write an essay addressing the following: Does this proximity-based distinction resolve, complicate, or collapse the classic "dirty hands" problem? In your analysis, you must determine whether moral responsibility tracks authorization regardless of institutional distance. Furthermore, extend this logic to the democratic public: if a leader incurs Delegated Stain through policy, do citizens inherit that stain through representative consent? Answer through conceptual reasoning; do not rely on exegesis of specific authors.

  ***

  ### Model Answer (Approx. 650 Words)

  The distinction between Executive and Delegated Stain initially appears to offer a gradient of culpability, suggesting that physical or bureaucratic distance might mitigate the moral weight of political wrongdoing. However, upon rigorous conceptual inspection, this distinction does not resolve the dirty hands problem; rather, it collapses the moral distinction while complicating the political psychology of accountability. The core of the dirty hands problem is not the physical act of wrongdoing, but the violation of moral constraints for the sake of political ends. Therefore, moral responsibility must track authorization regardless of institutional distance, and by extension, democratic citizens inevitably inherit a share of the Delegated Stain through the mechanism of representative consent.

  First, we must assess whether institutional distance mitigates agency. In the Executive Stain scenario, the link between will and action is immediate. In the Delegated Stain scenario, the link is mediated by bureaucracy. Proponents of the distinction might argue that delegation diffuses responsibility, rendering the leader's hands cleaner than the executor's. This fails conceptually. Political authority is fundamentally the authority to authorize. If a leader possesses the power to permit or forbid an act, their choice to permit it is the causal sine qua non of the act's occurrence. To argue that Delegated Stain is lighter than Executive Stain is to confuse the *mechanics* of action with the *source* of agency. The leader who designs a system known to produce wrongful outcomes retains full moral authorship of those outcomes. Consequently, the distinction collapses morally: both forms of stain originate in the same willingness to transgress moral norms for political utility. The "dirt" adheres to the will, not the hands.

  However, while the distinction collapses morally, it complicates the political reality of the dirty hands problem. The utility of Delegated Stain lies in its opacity. Executive Stain is visible and undeniable; Delegated Stain allows for plausible deniability. This complicates the dirty hands problem because it transforms a moral dilemma into an epistemic one. If the public cannot clearly see the authorization, the leader may avoid the political punishment that usually accompanies dirty hands. This suggests the distinction is not a solution to the moral problem but a technological fix for the reputational cost of wrongdoing. It allows the leader to claim the benefits of the wrongful act (e.g., security) while evading the symbolic burden of the stain. This complicates the democratic contract, as it severs the link between public judgment and executive action.

  This leads to the question of democratic complicity. If moral responsibility tracks authorization rather than execution, does the public share in the Delegated Stain? In a representative system, citizens authorize leaders to act on their behalf. If a leader incurs Delegated Stain by authorizing wrongful policies to secure the state, they are arguably acting as the agent of the collective will to survive. If we accept that the leader's authorization binds them morally, consistency demands that the citizens' consent binds them politically. To deny this is to treat the leader as a scapegoat who absorbs the moral toxicity of the state so the citizenry remains innocent. This is conceptually incoherent. If the act is done in the name of the people, for the security of the people, the people cannot claim moral insulation from the method. They inherit the stain not through execution, but through ratification.

  In conclusion, the distinction between Executive and Delegated Stain does not resolve the dirty hands problem. It collapses under the weight of moral analysis because authorization constitutes agency. However, it significantly complicates the problem by introducing bureaucratic opacity that shields leaders from immediate accountability. Ultimately, this logic implicates the citizenry. If the stain adheres to the will that authorizes the wrong, then in a democracy, the will of the electorate is the ultimate author. The distinction therefore reveals that dirty hands are not merely an elite burden, but a systemic condition of representative government.

  ***

  ### Marking Scheme (20 Points Total)

  **Grading Instruction:** Award points based on the successful execution of the five conceptual moves below. Do not penalize for lack of specific citations (e.g., Walzer, Sartre); reward conceptual precision. An **A-level** paper (17-20 pts) executes all moves with nuance and logical flow. A **B-level** paper (13-16 pts) identifies the moves but treats them descriptively or misses the logical connections.

  | Conceptual Move | Pts | A-Level Success Criteria | Typical B-Level Failure Mode |
  | :--- | :---: | :--- | :--- |
  | **1. Engagement with the Distinction** | 4 | Treats the distinction as a tool for analysis, not just a definition to be repeated. | Merely restates the prompt's definitions without utilizing them to drive the argument. |
  | **2. Agency vs. Proximity** | 4 | Argues that moral responsibility tracks *authorization* (will), not physical *execution* (hands). | Suggests that physical distance or bureaucratic layers meaningfully reduce moral culpability. |
  | **3. Political Complication** | 4 | Identifies that the distinction creates *epistemic* or *accountability* problems (deniability), even if moral guilt is equal. | Treats the distinction as purely moral, ignoring the political utility of opacity/denial. |
  | **4. Democratic Complicity** | 4 | Logically extends the authorization principle to citizens via representative consent/ratification. | Isolates the leader's guilt from the public, treating the citizenry as passive observers. |
  | **5. Final Verdict (Resolve/Collapse/Complicate)** | 4 | Provides a definitive verdict supported by the previous steps (e.g., "Collapses morally, complicates politically"). | Hedges indefinitely or concludes that the distinction "depends" without specifying on what. |
  | **TOTAL** | **20** | | |
