answer: |-
  ### Verification of Calculation

  I have re-derived the verdicts for the pair (A) and (B) under the specified frameworks. Your calculation is **correct** on all three counts.

  1.  **Tarskian Hierarchy:** Strict hierarchies forbid a truth predicate from applying to sentences within the same or higher level. (A) requires (B) to be at a lower level than (A)'s predicate. (B) requires (A) to be at a lower level than (B)'s predicate. This creates a loop in the level indices ($level(A) > level(B)$ and $level(B) > level(A)$), which is impossible. The pair is **ill-formed**.
  2.  **Strong Kleene (SK3):** In the minimal fixed point construction, ground facts (like "snow is white") are true at stage 0. At stage 1, (B) evaluates to True because the disjunction $X \lor \text{True}$ is True in SK3 even if $X$ is undefined (1/2). Once (B) is True, (A) ("B is not true") evaluates to False at stage 2. The fixed point stabilizes with **(B) True, (A) False**.
  3.  **Weak Kleene (WK3):** In WK3, any compound sentence containing an undefined component is itself undefined. At stage 1, (A) is undefined (depends on (B)). Consequently, (B) contains an undefined component ($\neg T(a)$), rendering (B) undefined despite the true disjunct "snow is white". Neither enters the extension. Both remain **Ungrounded (1/2)**.

  ### Brainstorming Cruxes

  1.  **The Status of Circular Reference:** Does circularity entail paradox? (Answer: No, as shown by the stable SK verdict).
  2.  **The Spread of Ungroundedness:** How far does pathological status infect surrounding logic? (This distinguishes SK from WK).
  3.  **Expressive Revenge:** Can the theory express its own verdicts? (WK fails to assert (B) is true; SK succeeds here but faces the Strengthened Liar elsewhere).

  **Selected Crux:** I commit to **The Spread of Ungroundedness**. This is the hardest to answer by paraphrase because it requires understanding the *mechanism* of evaluation (short-circuiting vs. contamination) rather than just memorizing that "Kripke uses gaps." A student must explain *why* WK treats the true disjunct as inert when paired with a gap, whereas SK allows the true disjunct to dominate.

  ---

  ### Exam Question

  **Seminar: Truth and Paradox | Practice Final**
  **Time Allowed: 45 Minutes | Total Marks: 25**

  **Question 1**
  Consider a language containing its own truth predicate $T$, names for its sentences, and a factual sentence $S$ ("snow is white") which is determinately true. Consider the following pair of sentences:

  > (A) The sentence (B) is not true.
  > (B) Either the sentence (A) is not true, or $S$.

  Assume three theoretical frameworks:
  1.  **Tarskian Hierarchy:** Truth predicates are indexed by levels ($T_0, T_1...$). A sentence using $T_n$ must belong to level $n+1$ and can only predicate truth of sentences at level $n$ or lower.
  2.  **Kripkean Strong Kleene (SK):** A three-valued semantics (True, False, Undefined). A disjunction is True if at least one disjunct is True, even if the other is Undefined.
  3.  **Kripkean Weak Kleene (WK):** A three-valued semantics. If any component of a compound sentence is Undefined, the whole sentence is Undefined.

  **(a) Verdicts (5 marks)**
  State the verdict each framework assigns to (A) and (B). If a framework cannot process the sentences, state why.

  **(b) Conceptual Analysis (15 marks)**
  Both Kleene schemes agree that the standard Liar sentence is Undefined. However, they disagree on (B). Explain precisely what this disagreement reveals about how each scheme handles the propagation of "ungroundedness." Why does SK allow (B) to be True while WK does not, despite both acknowledging (A) is initially problematic? What philosophical commitment regarding logical connectives distinguishes them?

  **(c) Revenge and Expressibility (5 marks)**
  Does this case demonstrate a "revenge" problem for either Kleene scheme? Explain what this specific pair shows about the theory's ability to express truth verdicts about circular sentences, and distinguish this from the classic Strengthened Liar problem.

  ---

  ### Model Answer

  The pair (A) and (B) presents a circular reference that is not paradoxical in all frameworks. Under the **Tarskian hierarchy**, the pair is **ill-formed**. Mutual predication of truth requires (A) to be at a higher level than (B) and vice versa, violating the well-formedness rules of the hierarchy. Thus, Tarski avoids the issue by prohibition.

  In the **Kripkean Strong Kleene (SK)** minimal fixed point, **(B) is True and (A) is False**. The construction begins with ground facts; $S$ is True. Although (A) is initially Undefined, SK semantics allows a disjunction to be True if one disjunct is True. Therefore, at the first stage of evaluation, (B) evaluates to True because of $S$. This stabilizes (A): since (B) is True, the claim "(B) is not true" is False. The circularity is benign; the truth of $S$ grounds (B), which in turn grounds (A).

  In the **Kripkean Weak Kleene (WK)** scheme, **both (A) and (B) are Undefined**. WK employs a "contamination" rule: if any component is Undefined, the compound is Undefined. Since (A) depends on (B) and (B) depends on (A), neither is grounded at stage 0. Consequently, the component $\neg T(a)$ in (B) is Undefined. WK dictates that $Undefined \lor True$ is Undefined. The truth of $S$ is insufficient to save (B). The ungroundedness of (A) infects (B) regardless of the factual disjunct.

  The disagreement reveals divergent commitments regarding **informational closure versus truth-functionality**. SK prioritizes classical truth conditions: if the world makes one disjunct true, the whole is true, regardless of semantic defects elsewhere. It limits the spread of ungroundedness to sentences that *depend* on gaps for their truth value. (B) does not depend on (A) for its truth in SK, because $S$ suffices. WK prioritizes informational integrity: if part of the sentence lacks a value, the whole lacks a value. It treats ungroundedness as infectious, spreading to any sentence merely mentioning a gap, even if the gap is logically irrelevant to the outcome. SK views logic as robust against semantic noise; WK views it as fragile.

  Regarding **revenge**, this case highlights an expressive deficit in WK but not SK. In SK, we can assert (B) in the object language. The theory successfully classifies (B) as True, allowing us to express that "Either (A) is not true or snow is white." WK cannot assert (B) because it assigns it no truth value. This is a localized revenge: the theory cannot express obvious truths involving pathological sentences. However, this is distinct from the **Strengthened Liar** ("This sentence is false or undefined"). The Strengthened Liar attacks the gap itself, forcing a contradiction if the theory claims the sentence is undefined. This case does not generate a Strengthened Liar; rather, it shows WK is too weak to capture classical validities involving gaps, whereas SK preserves them but remains vulnerable to the Strengthened Liar elsewhere. SK solves the expressibility problem for (B) but not the ultimate revenge problem for the gap category itself.

  ---

  ### Marking Scheme

  **Total: 25 Marks**

  **1. Tarskian Verdict (5 Marks)**
  *   **A (5):** States the pair is ill-formed/unformulable because mutual truth predication violates level indexing (A requires B lower, B requires A lower).
  *   **B (2-3):** States Tarski rejects it but claims it is "false" or "paradoxical" rather than ill-formed.
  *   *Common Mistake:* Claiming Tarski assigns a truth value (False) rather than rejecting syntax.

  **2. Strong Kleene Verdict (5 Marks)**
  *   **A (5):** Correctly identifies (B) as True and (A) as False. Notes that $S$ stabilizes (B) first.
  *   **B (2-3):** Identifies (B) as True but claims (A) remains Undefined/Gap.
  *   *Common Mistake:* Assuming circularity forces a gap in SK simply because reference is circular.

  **3. Weak Kleene Verdict (5 Marks)**
  *   **A (5):** Correctly identifies both as Undefined/Gap. Explains contamination via the $\neg T(a)$ component.
  *   **B (2-3):** Identifies both as Gap but attributes it to "paradox" rather than the evaluation rule for disjunction.
  *   *Common Mistake:* Claiming WK makes (B) True because "snow is white" overrides the gap.

  **4. Conceptual Disagreement (SK vs WK) (5 Marks)**
  *   **A (5):** Explains SK allows "short-circuiting" (True dominates) while WK enforces "contamination" (Gap dominates). Discusses dependence vs. mere mention.
  *   **B (2-3):** States SK is "classical" and WK is "three-valued" without explaining the disjunction mechanism.
  *   *Common Mistake:* Describing WK as "stronger" or SK as "weaker" without referencing the propagation of values.

  **5. Revenge and Expressibility (5 Marks)**
  *   **A (5):** Distinguishes WK's failure to assert (B) (expressive deficit) from the Strengthened Liar (contradiction via gap predication). Notes SK avoids this specific deficit.
  *   **B (2-3):** Claims SK solves revenge completely or conflates this case with the Strengthened Liar.
  *   *Common Mistake:* Asserting that because (A) is False in SK, the Revenge problem is solved globally.
