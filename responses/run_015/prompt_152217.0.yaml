answer: |-
  There is no single, established clinical or literary term that perfectly captures this specific architecture of the self.

  There are near-misses. In literary theory, **Absent Presence** describes a character who drives the plot without appearing (like Rebecca in Daphne du Maurier's *Rebecca* or Gatsby in *The Great Gatsby*), but this describes the *textual device*, not the psychological structure of the survivors. In philosophy, **Hauntology** (Derrida/Mark Fisher) explores how the past or lost futures "haunt" the present, but it usually applies to culture or time, not individual identity construction. In psychoanalysis, **Internal Object Relations** explains how we carry mental images of others, but it doesn't specify the *orbital dependency* where the self collapses if that object is removed from the narrative.

  Because this specific pattern—where the self is structurally dependent on a dead center for its coherence—lacks a precise name, I will coin one for you.

  ### Coined Term: **Phantom Axis Identity**

  **Definition:**
  A **Phantom Axis Identity** occurs when an individual constructs their narrative selfhood around a deceased or permanently absent figure who functions as a fixed point of gravitational reference. Unlike healthy mourning, where the deceased is integrated into the survivor's history, in a Phantom Axis Identity, the deceased remains the *active coordinate system*. The survivor's choices, morals, and relationships are not just influenced by the dead figure; they are unintelligible without them. The self does not move *forward*; it orbits.

  **The Mechanism:**
  Imagine a solar system where the sun explodes, but the planets keep orbiting the empty spot because the gravitational field hasn't collapsed. In this identity structure, the "gravity" is maintained by the survivor's refusal to update their internal map. The dead figure is not a memory; they are a **functional void**. They are the "Phantom Axis"—the invisible line around which the survivor rotates.

  **Boundary Cases (How to distinguish it):**

  1.  **Phantom Axis vs. Complicated Grief:**
      *   *Complicated Grief* is a clinical diagnosis focused on the *intensity* and *duration* of sorrow (e.g., inability to accept the death).
      *   *Phantom Axis Identity* is structural. A person can function well, hold a job, and seem "healed," yet their entire life script (e.g., "I became a doctor because *he* wanted me to") relies on the dead figure's imagined will. If you remove the dead figure from the story, the survivor's life doesn't just become sad; it becomes *nonsensical*.

  2.  **Phantom Axis vs. Living Codependency:**
      *   In codependency with a *living* person, there is a feedback loop. The center can speak, change, or disappoint, forcing the orbit to adjust.
      *   In a Phantom Axis, the center is silent. This allows the survivor to project absolute perfection or unchanging will onto the dead figure, making the orbit rigid and unbreakable. The dead cannot say, "Stop orbiting me."

  3.  **Phantom Axis vs. Legacy/Inspiration:**
      *   Being inspired by a dead mentor is normal. You take their lessons and apply them to *your* new center.
      *   In Phantom Axis Identity, there is no new center. The survivor is not building *upon* the foundation; they are maintaining the foundation as the only structure.

  **Why this fits your novel:**
  This term captures the "broken orbit" metaphor you described. It acknowledges that the figure is gone (Phantom) but admits they still define the rotation (Axis). It bridges the gap between the literary device (the dead protagonist) and the psychological reality (the survivors' fiction of self).

  Verdict: Phantom Axis Identity
