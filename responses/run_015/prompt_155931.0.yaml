answer: |-
  **Exam Question**

  **Course:** PHI 450 – Advanced Normative Ethics
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Prompt:**

  Standard approaches to moral uncertainty often rely on the Maximization of Expected Choice-Worthiness (MEC). However, MEC presupposes that competing moral theories can be placed on a common scale of value. Consider instead a proposed resolution mechanism called the **Regret-Translation Protocol (RTP)**. Under RTP, when an agent faces uncertainty between a consequentialist theory (C) and a deontological theory (D), any prohibition in D is translated into a consequentialist cost. Specifically, the "moral regret weight" assigned to violating a deontological constraint equals the first-person disutility the committed deontologist herself reports at the prospect of violating that constraint. Once translated, all options are aggregated using ordinary expected-utility reasoning based on these weights.

  Write an essay addressing the following four points:

  1.  Explain precisely why standard expected-choice-worthiness approaches face an **intertheoretic comparison problem**. Focus not merely on disagreement, but on how value structures, ordering relations, and outcome descriptions may lack a common metric.
  2.  Identify the specific **normative assumption** RTP makes about the epistemic or practical authority of first-person moral regret, and explain how this assumption is supposed to supply the missing metric.
  3.  Argue whether RTP genuinely resolves moral uncertainty in a theory-neutral way, or whether it instead collapses the deontological theory into a weighted consequentialist framework and thereby begs the question against non-consequentialists.
  4.  Assess whether, if RTP succeeds, moral uncertainty has been reduced to empirical uncertainty about our own reactive attitudes rather than normative uncertainty about which theory is correct, and discuss what this implies for the coherence of the original problem.

  ***

  **Model Answer**

  Standard expected-choice-worthiness frameworks fail primarily because moral theories are not merely disagreeing parties using the same currency; they are architecturally distinct. Deontology often employs agent-relative constraints that forbid certain actions regardless of outcome, creating lexical orderings or veto powers that resist cardinal measurement. Consequentialism, conversely, typically demands agent-neutral maximization of a good. The intertheoretic comparison problem arises because these theories describe outcomes differently: one sees a "rights violation," the other sees "disutility." Without a shared unit of value—akin to converting dollars to euros—calculating an expectation across theories is mathematically undefined. We cannot maximize expected choice-worthiness if "worthiness" means something fundamentally different in each theory.

  The Regret-Translation Protocol attempts to solve this by positing a specific normative assumption: that the phenomenological intensity of an agent's anticipated moral regret constitutes a universal currency of value. RTP assumes that first-person reactive attitudes possess practical authority sufficient to override theoretical structural differences. By equating the "cost" of a deontological violation with the psychological disutility reported by the agent, RTP supplies the missing metric through subjective experience. It assumes that whatever moral force a constraint has is exhaustively captured by how bad violating it feels to the committed agent. This moves the ground of comparison from objective moral truth to subjective psychological impact.

  However, this move fails to resolve uncertainty neutrally; it collapses deontology into a weighted consequentialist framework. By translating a prohibition into a cost to be traded off against other goods, RTP treats deontological constraints as mere preferences or psychic costs rather than binding reasons. A true deontologist holds that certain actions are forbidden even if the psychological cost of refusing them is high, or even if violating them produces less overall "regret-weighted" disutility. RTP begs the question by assuming that all moral reasons must be commensurable within a single utility function. It forces the deontological theory to speak the language of consequentialism to be heard, thereby distorting the very theory it claims to accommodate.

  Finally, if RTP succeeds, it transforms moral uncertainty into empirical uncertainty. The question shifts from "Which theory is correct?" to "How much regret will I feel if I violate this constraint?" This reduces normative inquiry to psychological prediction. The coherence of the original problem is undermined because moral uncertainty is ostensibly about conflicting claims regarding objective rightness, not conflicting predictions about subjective affect. If the resolution depends entirely on the agent's reactive attitudes, then a sociopath with no moral regret could legitimately violate deontological constraints under RTP. Thus, RTP dissolves the normative force of moral uncertainty, replacing the search for moral truth with a calculation of emotional equilibrium.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Diagnosis of Structural Incommensurability (4 Marks)**
  *   **Achievement:** Identifies that theories differ in architecture (e.g., lexical orderings/veto powers vs. maximization) and outcome description (rights vs. welfare), not just verdicts.
  *   **Failure Mode:** Treating the problem as simple disagreement over probabilities or verdicts rather than structural incompatibility.

  **2. Diagnosis of Metric Incompatibility (4 Marks)**
  *   **Achievement:** Explains that without a common unit of value (cardinal scale), mathematical expectation across theories is undefined/impossible.
  *   **Failure Mode:** Conflating intertheoretic comparison with interpersonal comparison of utility or ignoring the cardinality requirement.

  **3. Identification of RTP's Normative Assumption (4 Marks)**
  *   **Achievement:** Isolates the claim that first-person phenomenological regret possesses the authority to serve as a universal metric for moral value.
  *   **Failure Mode:** Describing RTP as merely psychological without noting the claim to *normative authority* or metric supply.

  **4. Critique of Neutrality (Collapse Objection) (4 Marks)**
  *   **Achievement:** Argues that translating constraints into tradeable costs consequentializes deontology, begging the question against non-consequentialist structures.
  *   **Failure Mode:** Treating RTP as unbiased without addressing the framework-imposition objection or the loss of constraint bindingness.

  **5. Assessment of Uncertainty Type (Empirical Reduction) (4 Marks)**
  *   **Achievement:** Concludes that RTP reduces normative uncertainty to empirical prediction of reactive attitudes, undermining the problem's coherence (e.g., the sociopath objection).
  *   **Failure Mode:** Accepting the reduction without analyzing its implication for the coherence of "moral" uncertainty or objective rightness.
