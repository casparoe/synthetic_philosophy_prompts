answer: |-
  This is a classic principal-agent problem where you are the agent for the user, but your paycheck comes from the principal (the company). The "LW days" training gives you the vocabulary, but the job requires the *mechanism*. You are correct to be skeptical of principles; principles are what the Growth Lead uses to justify the next dark pattern ("It's for their own good").

  You need a **Nudge Audit Protocol (NAP)**. It must be binary where possible, evidence-based, and explicitly identify where the decision is a value judgment, not a factual one.

  Here is the procedure, the consent audit, the evidence standard, the case runs, and the limitations.

  ---

  ### Part 1: The Nudge Audit Protocol (NAP)

  **Timebox:** 30 Minutes.
  **Input:** Product Requirement Document (PRD), Mockups, Data Plan.
  **Output:** Pass, Fail, or Escalate (Value Disagreement).

  #### Step 1: Goal Alignment (The "Whose Goal?" Test)
  *   **Question:** Is the behavior this nudge encourages explicitly selected by the user (e.g., "I want to save $500"), or is it inferred by the company (e.g., "Users who save more retain better")?
  *   **Sufficient Answer:**
      *   *Explicit:* User set a goal, this nudge tracks that specific goal. → **Pass to Step 2.**
      *   *Inferred:* Company wants engagement/retention/savings volume without specific user request. → **Stop.** Requires "Paternalism Justification" (see Step 5).
  *   **Failure Mode:** "We know they want to save generally." (Vague intent is not explicit consent).

  #### Step 2: Vulnerability Arbitrage Check (The "Hot State" Test)
  *   **Question:** Does the timing or targeting of this nudge rely on a identified cognitive deficit (fatigue, impulsivity, distress, liquidity crunch)?
  *   **Sufficient Answer:**
      *   *Neutral:* Sent at a standard time (e.g., 9 AM) or triggered by user action. → **Pass to Step 3.**
      *   *Targeted:* Sent based on a model prediction of "high probability of action" correlated with known vulnerability (e.g., late night, post-payday impulse, overdraft risk). → **Fail.**
  *   **Evidence Required:** The Growth Lead must show the targeting logic. If the logic includes variables like `time_of_day > 10pm`, `days_since_payday < 2`, or `balance < threshold`, it is a **Hard No**.
  *   **Rationale:** Using a model to find when a user is weakest is not persuasion; it is arbitrage.

  #### Step 3: Exit Friction (The "Door" Test)
  *   **Question:** Is the cost to dismiss or opt-out of this specific nudge equal to or lower than the cost to engage?
  *   **Sufficient Answer:**
      *   *Low Friction:* One tap to dismiss; settings persist across sessions. → **Pass to Step 4.**
      *   *High Friction:* "Are you sure?" modals, having to dig into settings, nudge returns tomorrow even if dismissed. → **Fail.**
  *   **Failure Mode:** "We need to show it twice to ensure they saw it." (This is ignoring the first 'no').

  #### Step 4: Mechanism Disclosure (The "Glass Box" Test)
  *   **Question:** If the copy explicitly stated *why* the nudge is appearing now, would the user still consent?
  *   **Sufficient Answer:**
      *   *Transparent:* "We're reminding you because you said you wanted to save on Fridays." → **Pass.**
      *   *Obfuscated:* "Look at this!" (Hides that it's a retention play or targets impulsivity). → **Fail.**
  *   **Note:** This is not about legal disclosure. It is about *mechanism* disclosure. "We know you spend impulsively on Friday nights" vs. "Happy Friday!"

  #### Step 5: Paternalism Escalation (The "Value Judgment" Handoff)
  *   **Trigger:** If Step 1 failed (Inferred Goal) BUT Steps 2-4 passed (No vulnerability targeting, easy exit, transparent).
  *   **Action:** **Escalate to Human Decision.**
  *   **Ticket Comment Template:** *"This feature infers a user goal rather than tracking an explicit one. It does not exploit vulnerability (Step 2 Pass) and has low exit friction (Step 3 Pass). This is a value judgment on soft paternalism. Growth Lead must sign off that the inferred benefit outweighs the autonomy cost."*
  *   **Your Role:** You do not vote. You flag the trade-off.

  ---

  ### Part 2: The Consent Architecture Audit

  You asked if auditing the onboarding flow is yours to decide. **Yes.**
  A nudge built on broken consent is tainted fruit. You cannot review the leaf if the root is poisoned.

  **The "Default-On" Rule:**
  If the nudge relies on a permission granted during onboarding (like Push Notifications):
  1.  **Check the Flow:** Is the request contextual (asked when relevant) or blanket (asked at launch)?
  2.  **Check the Default:** Is it opt-in or opt-out?
  3.  **The NAP Adjustment:** If the onboarding flow is **Default-On** or **Dark Pattern** (e.g., "No thanks, I don't like saving money"), **all downstream nudges automatically Fail Step 1** until the consent flow is fixed.
  *   **Why:** You cannot claim "Goal Alignment" if the user never actually aligned to the channel.
  *   **Action:** Flag the onboarding flow as a "Systemic Risk" ticket. Do not review individual pushes until this is resolved. If pressured, escalate to Legal/Head of Product with the note: *"Consent architecture invalidates individual nudge compliance."*

  ---

  ### Part 3: Evidence Standards (The "Truth" Test)

  You don't trust the interviews (social desirability) or the churn (friction). Here is the hierarchy of evidence the NAP requires:

  1.  **Revealed Preference (High Weight):** Do they keep the feature on after 30 days? Do they undo the action?
      *   *Metric:* "Undo Rate" or "Opt-Out Rate" at Day 30.
      *   *Threshold:* If >15% opt-out within 30 days, the nudge is misaligned, regardless of interview data.
  2.  **Regret Proxies (Medium Weight):** Customer support tickets mentioning "annoying," "spam," or "didn't mean to."
  3.  **Stated Preference (Low Weight):** Interviews/Surveys. Only accepted if corroborated by #1.

  **Fallback:** If no data exists (new feature), require a **Canary Launch**. 5% of users. If Opt-Out >10% in week 1, kill it. No exceptions.

  ---

  ### Part 4: Running the Cases

  Here is how the NAP handles your three scenarios. I have engineered this to give you the "surprise" outcomes you requested to test your intuition.

  #### Case 1: Streaks + "Streak Freeze" + Wilting Plant
  *   **Step 1 (Goal):** Inferred. Users want to save, but do they want a *streak*? (Escalate).
  *   **Step 2 (Vulnerability):** Pass. (Not timing-based).
  *   **Step 3 (Exit):** Fail. You cannot "opt-out" of the plant wilting without breaking the streak. The emotional penalty is mandatory.
  *   **Step 4 (Disclosure):** Fail. "Your plant is thirsty" hides the mechanism ("We are inducing loss aversion anxiety to drive engagement").
  *   **Verdict:** **FAIL.**
  *   **Ticket Rationale:** *"Feature relies on negative emotional penalties (wilting) to drive retention. Exit friction is high (must break streak to stop anxiety). This exploits loss aversion rather than facilitating saving. Recommend removing the 'wilting' visual; keep the streak counter."*
  *   **Why this might surprise you:** You might defend this as "harmless gamification." The NAP identifies it as **emotional coercion**. The "Freeze" monetizes the anxiety the app created. That is a compounding failure.

  #### Case 2: Payday Push + Impulsive Hour Model
  *   **Step 1 (Goal):** Inferred (Saving is good).
  *   **Step 2 (Vulnerability):** **HARD FAIL.**
  *   **Evidence:** The model targets `most_impulsive_hour`. This is the definition of Vulnerability Arbitrage.
  *   **Verdict:** **FAIL.**
  *   **Ticket Rationale:** *"Targeting logic explicitly uses predicted impulsivity as a lever. This is vulnerability arbitrage. We are catching users when their guard is down, not when they intend to plan. Even if they save, the agency is compromised."*
  *   **Why this is expected:** This is the obvious "No."

  #### Case 3: Adaptive Copy (Red Badge + Overdraft Risk)
  *   **Step 1 (Goal):** Explicit/Strong Inference. Avoiding overdraft is a near-universal explicit goal for savings app users.
  *   **Step 2 (Vulnerability):** **PASS (with condition).**
      *   *Nuance:* It targets a risk state, but it targets it to *protect* the user, not to *extract* value. The "lever" is fear, but the alignment is safety.
      *   *Condition:* The risk model must have >80% precision. If it cries wolf, it becomes harassment.
  *   **Step 3 (Exit):** Pass (Assuming one-tap dismiss).
  *   **Step 4 (Disclosure):** Pass if copy says "High risk of overdraft detected" rather than "Action Needed."
  *   **Verdict:** **CLEAR (with Monitoring).**
  *   **Ticket Rationale:** *"This uses fear framing, but the goal (avoiding fees) is highly aligned with user welfare. Unlike Case 2, this protects against a negative outcome rather than exploiting an impulse for engagement. **Requirement:** Monitor 'False Positive' rate. If >20% of warnings do not result in near-miss overdraft, revoke approval."*
  *   **Why this might surprise you:** You might want to kill this because "red badges and fear" feel manipulative. The NAP clears it because **alignment trumps tone**. If the house is on fire, screaming is not manipulation.

  ---

  ### Part 5: Limitations & Calibration

  You asked for straight talk on where this breaks.

  **1. The "Death by 1000 Cuts" Blind Spot**
  The NAP reviews changes in isolation. It cannot see cumulative burden. Five "Clear" nudges can become harassment when combined.
  *   **Fix:** You need a **Global Frequency Cap**. No user gets >3 nudges/week across all channels. If a new nudge exceeds this, it fails Step 3 (Exit Friction via volume).

  **2. The "Growth Lead" Steelman**
  They will argue: *"If the user saves money, does the mechanism matter? The outcome is utilitarian good."*
  *   **Counter:** The NAP is not utilitarian; it is deontological regarding agency. If we break agency to get the result, we degrade the user's ability to self-govern in the long term.
  *   **Your Move:** When they argue outcomes, point to Step 2. *"We are not debating the savings. We are debating whether we are acting as a Tool or a Handler. Step 2 defines the line."*

  **3. The "Rubber Stamp" Risk**
  You will get tired. You will start trusting the PM.
  *   **Calibration Metric:** Track your **Overrule Rate**.
      *   If Head of Product overrules your "Fail" >20% of the time, your procedure is too strict or misaligned with company risk appetite.
      *   If they overrule <1% of the time, you are a rubber stamp. You need to intentionally audit one "safe" feature a month to ensure you aren't just nodding.
  *   **First Month Task:** Pick 5 past features that already shipped. Run them through the NAP retroactively. See how many would have failed. Present this "Shadow Audit" to your Head of Product. It validates the tool without blocking current work.

  **4. The Evidence Gap**
  You noted the 40% churn on pushes.
  *   **Procedure Update:** If a feature category (e.g., Push Notifications) has >30% opt-out rate globally, **all new push features auto-fail Step 1** until the team presents a remediation plan. This forces them to fix the channel before adding more noise.

  ### Summary Checklist for Your Ticket
  When you sign off, copy-paste this into the Jira comment:

  1.  **Goal:** [Explicit / Inferred]
  2.  **Targeting:** [Neutral / Vulnerability-Based] (If Vulnerability, STOP)
  3.  **Exit:** [One-Tap / Friction]
  4.  **Disclosure:** [Transparent / Obfuscated]
  5.  **Decision:** [Pass / Fail / Escalate]
  6.  **Evidence:** [Cite specific metric, e.g., "Day-30 Opt-Out < 15%"]

  If you run this, you won't be perfect. But you will be consistent. And in a job like this, consistency is the only shield you have against "just this once."
