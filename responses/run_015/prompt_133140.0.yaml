      *   **Evidence Standards:** How to handle the interview/churn gap.
      *   **Case Studies:** Applying the protocol to the 3 scenarios.
      *   **Limitations & Calibration:** What this won't catch and how to test the tool itself.

  10. **Refining the Tone:**
      *   Avoid academic jargon where possible. Use "ticket language."
