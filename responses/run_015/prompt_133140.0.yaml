      *   **Task:** Create a concrete, runnable *procedure* (not just principles) for reviewing behavioral design changes ("nudges").
      *   **Constraints:** 30 mins per review, 15-20 reviews/month. Must be usable by a PM. Must withstand scrutiny from a sharp Growth Lead. Must distinguish manipulation from persuasion.
      *   **Specific Requirements:**
          *   Address "vulnerability arbitrage" (timing/leveraging hot states vs. reflective endorsement).
          *   Address consent architecture (default-on pushes).
          *   Run the procedure on three specific cases (Streaks/Plant, Payday Push, Overdraft Risk Copy).
          *   Include at least one "false positive" (procedure kills something I'd defend) and one "false negative" (procedure clears something I'd kill) to test bias.
          *   Address evidence gaps (users say they want notifications vs. 40% turn them off).
          *   Be honest about limitations/blind spots and how to validate the procedure itself.
      *   **Tone:** Direct, pragmatic, analytical, slightly cynical but constructive (matching the LW vibe).

  2.  **Deconstruct the Core Problem:**
      *   The core tension is *Agency Alignment*. Does the nudge help the user achieve *their* reflective goals, or does it help the company achieve *its* goals at the expense of the user's reflective goals?
      *   Standard ethical tests ("would you tell them?") fail because of sophisticated disclosure.
      *   Standard efficacy tests ("does it work?") fail because the goal is behavior change, which is inherently manipulative if the *direction* is wrong.
      *   The "Vulnerability Arbitrage" point is crucial: Using data about weakness (overdraft risk, impulsivity) to trigger action is the danger zone.

  3.  **Drafting the Procedure (The "Nudge Audit Protocol"):**
      *   Needs to be a checklist or flow. Let's make it a 5-step gate.
      *   *Step 1: Goal Alignment.* Who benefits? Is the user's goal explicit or inferred?
      *   *Step 2: Consent & Exit.* Did they ask for this? Can they stop it easily?
      *   *Step 3: State & Timing.* Are we catching them when they are weak?
      *   *Step 4: Friction & Reversibility.* Is it hard to undo?
      *   *Step 5: The "Mirror" Test.* A refined version of "would you tell them."
      *   *Decision Logic:* Pass, Fail, or Escalate (Value Disagreement).

      *Refining for the User's Specific Constraints:*
      *   Need to handle the "default-on" issue. That's a Step 0 or Step 2 issue.
      *   Need to handle "vulnerability arbitrage." That's Step 3.
      *   Need to handle evidence. The procedure needs to demand *types* of evidence, not just "data."

  4.  **Developing the Specific Steps (Iterative refinement):**

      *   *Q1: The Goal.* Is the behavior change aligned with a goal the user explicitly set (e.g., "save $500") or a goal we inferred (e.g., "you should save more")?
          *   *Pass:* Explicit goal.
          *   *Fail:* Inferred goal + high friction.
          *   *Escalate:* Inferred goal + low friction (paternalism).
      *   *Q2: The State.* Are we targeting a known cognitive deficit (fatigue, impulsivity, distress)?
          *   *Pass:* Neutral state or "cool" state planning.
          *   *Fail:* Targeting "hot" states identified by model (e.g., late night, post-payday impulse).
      *   *Q3: The Exit.* Is the opt-out as easy as the opt-in?
          *   *Pass:* One click, persistent.
          *   *Fail:* Hidden, naggy, or reset frequently.
      *   *Q4: The Disclosure.* If we explained the *mechanism* (not just the action), would they still consent?
          *   *Pass:* "We remind you when you usually spend."
          *   *Fail:* "We remind you when you are most likely to say yes."
      *   *Q5: The Harm.* What happens if they ignore it?
          *   *Pass:* Nothing/Minor annoyance.
          *   *Fail:* Shame, loss of utility (wilting plant), financial penalty.

      *Wait, I need to make sure this hits the "Vulnerability Arbitrage" hard.*
      Let's add a specific "Exploitation Check."
      *   *Check:* Does this feature rely on a discrepancy between the user's immediate impulse and their stated long-term preference?
      *   *Evidence:* Do we have data on *regret* rates, not just conversion rates?

  5.  **Addressing the "Consent Architecture" Question:**
      *   Yes, the procedure *must* audit the onboarding flow. If the nudge relies on dark patterns to get consent, the nudge is tainted.
      *   Is it the reviewer's job? Yes, because they sign off on the *change*. If the change relies on broken consent, they flag it.

  6.  **Addressing the Evidence Gap (Interviews vs. Churn):**
      *   Interviews = Social desirability bias ("I want to be a saver").
      *   Churn (turning off pushes) = Revealed preference ("This annoys me").
      *   *Procedure Fix:* Require "Regret Metrics." Not just "did they click," but "did they undo?" or "did they turn off notifications after?"

  7.  **Running the Three Cases:**

      *   *Case 1: Streaks + Wilting Plant + Freeze.*
          *   *Analysis:* Loss aversion (wilting) + Sunk cost (streak).
          *   *Procedure Verdict:* Likely **Fail/Escalate**. The "wilting" induces negative emotion/shame. The "freeze" monetizes the anxiety. This feels like exploitation of anxiety.
          *   *User's Expectation:* They might defend it as "gamification."
          *   *Goal:* Make the procedure kill this (or flag it heavily) to show it's not just laundering intuition.

      *   *Case 2: Payday Push + Impulsive Hour Model.*
