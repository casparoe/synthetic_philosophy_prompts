answer: |-
  **The Weight of the World: Why the Subject's Stakes Set the Standard for Knowledge**

  The "Bank Case" is a philosophical intuition pump that refuses to run dry. In the low-stakes version, you need cash for a casual dinner; in the high-stakes version, a bounced check means financial ruin. In both scenarios, your evidence is identical: you were at the bank two weeks ago on a Saturday. Yet, your intuition rebels. In the first case, you claim to know the bank is open. In the second, you hesitate. You feel you do not know.

  This intuition creates a rift between two dominant theories in contemporary epistemology. Pragmatic Encroachment argues that your practical stakes (the cost of being wrong) partly constitute whether you know. Epistemic Contextualism argues that the truth of knowledge claims depends on the conversational context of the person *attributing* the knowledge (the speaker), not the subject. The tension arises when these two vectors point in opposite directions: What happens when the subject faces disaster (high stakes), but the person talking about them is in a casual conversation (low stakes)?

  To resolve this, we must decide whose situation anchors the standard of knowledge: the knower's reality or the speaker's conversation. While Contextualism offers an elegant solution to linguistic puzzles, it ultimately severs knowledge from its primary function. A close examination reveals that Pragmatic Encroachment is the superior view. The standard for knowledge is set by the subject's stakes, not the attributor's context, because knowledge is fundamentally a norm of action, not a tool of conversation.

  To understand why Encroachment must win, we must first acknowledge the appeal of Contextualism. Contextualists, such as Keith DeRose or David Lewis, argue that the word "knows" is indexical, shifting its meaning like "tall" or "flat." In a casual context, "tall" might mean six feet; in a basketball recruitment context, it might mean six-foot-six. Similarly, in casual conversation, "knows" requires only enough evidence to rule out ordinary possibilities. In a philosophical or high-stakes discussion, "knows" requires evidence to rule out skeptical scenarios.

  This view handles the single-person Bank Case well. When you are casually discussing the ATM, the conversational standard is low, so "I know" is true. When you are discussing the disastrous check, the conversation itself becomes serious, raising the standard, so "I know" becomes false. Contextualism saves the intuition by locating the shift in the room, not in the world.

  However, the theory fractures when we separate the subject's stakes from the attributor's context. Imagine Hannah, who faces financial ruin if the bank is closed (high stakes). Now imagine John, a bystander who has no investment in Hannah's account, chatting casually with a friend about Hannah's plans (low stakes). John says, "Hannah knows the bank is open."

  According to Contextualism, John's statement is true. His conversational context is low-stakes, so the semantic bar for "knows" is low. Hannah meets that bar. According to Pragmatic Encroachment, John's statement is false. Hannah's stakes are high, so the epistemic bar for her knowledge is high. She does not meet it.

  This "crossed wires" scenario exposes the fatal flaw in Contextualism: it renders knowledge inert. If John's claim is true, then it is a fact that Hannah knows the bank is open. If it is a fact that she knows, then she is rational to act on that knowledge. But we know, intuitively and normatively, that Hannah is *not* rational to act. She should check the hours. She should verify. If Contextualism insists she "knows" in John's mouth but "doesn't know" in her own practical reasoning, it creates a bizarre duality where a proposition can be true as a description of Hannah but false as a guide for Hannah.

  This is where Pragmatic Encroachment secures the victory. Encroachment aligns with the principle that knowledge is the norm of action. We do not seek knowledge merely to label the world; we seek it to navigate it safely. The function of knowledge is to license action. If the cost of action rises, the license must become harder to obtain. When Hannah's stakes rise, her epistemic position does not change, but her *status* as a knower does, because the threshold for "good enough to act on" has moved.

  Defenders of Contextualism might object that this conflates *knowledge* with *rational assertibility*. They argue Hannah still knows the truth, but she shouldn't *say* she knows or act on it because the norms of assertion are stricter than the norms of knowledge. But this is a distinction without a difference. If a mental state cannot license action in a high-stakes environment, calling it "knowledge" is an empty honorific. It strips the concept of its normative force. If I tell you, "You know the bridge is safe," but you would be irrational to cross it without further inspection, I have not described your epistemic state; I have misled you about your safety.

  Furthermore, Encroachment respects the reality of the subject's position in a way Contextualism does not. Contextualism makes the truth of a claim about Hannah dependent on John's casual mood. This implies that Hannah's epistemic status fluctuates based on the chatter of bystanders. If John starts talking seriously, Hannah loses knowledge; if he jokes, she gains it. This makes knowledge too fragile, too dependent on the linguistic environment of others rather than the relationship between the agent and the world. Encroachment grounds knowledge in the agent's actual practical environment. Hannah's risk is real regardless of what John is saying at the bar. Therefore, the standard for her knowledge must be determined by her risk.

  Critics of Encroachment often worry that it "pollutes" the purity of epistemology with practical concerns. They argue that belief and evidence are theoretical matters, while stakes are practical matters, and never the twain shall meet. But this purity is purchased at the cost of relevance. A theory of knowledge that ignores the cost of error is a theory of abstract labeling, not a theory of human cognition. We are not disembodied observers; we are agents. The "Bank Case" intuition persists precisely because we recognize that knowledge is a tool for agents. When the tool is used for delicate work, we require a finer instrument. The evidence hasn't changed, but the requirement for the evidence has.

  Therefore, the two views cannot be genuinely held together without contradiction. They offer competing explanations for the same shift in intuition. Contextualism locates the shift in the speaker's semantic context; Encroachment locates it in the subject's practical reality. In the crossed case (High-Stakes Subject, Low-Stakes Attributor), we must choose between a view that makes knowledge linguistically convenient (Contextualism) and one that makes it action-guiding (Encroachment).

  We must choose the latter. The standard for knowledge is set by the knower's stakes. To argue otherwise is to suggest that a person can "know" something while simultaneously being irrational to act on it, provided a bystander is speaking casually. This divorces knowledge from the very reason we value it. The tension in the Bank Case is resolved not by shifting the meaning of words in conversation, but by acknowledging that the weight of the world presses upon the knower. When the stakes are high, the burden of proof rises with them, regardless of who is watching or what they are saying. Knowledge belongs to the agent, and so do the risks.
