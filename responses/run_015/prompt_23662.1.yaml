      *   **Core Conflict:** In the Bank Case, the *subject's* stakes seem to drive the intuition (Encroachment). But Contextualism says the *attributor's* context drives the truth conditions. What happens when the subject has high stakes but the attributor is low-stakes (or vice versa)?
