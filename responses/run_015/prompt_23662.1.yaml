  2.  **Deconstruct the Philosophical Positions:**
      *   *Traditional Invariantism:* Knowledge depends only on truth, belief, and justification (evidence). Stakes and context don't change whether you *know*, only whether you should *act* or *assert*.
      *   *Pragmatic Encroachment (Subject-Sensitive Invariantism):* The subject's practical stakes partly constitute whether they know. High stakes $\rightarrow$ harder to know. (Stanley, Fantl & McGrath).
      *   *Epistemic Contextualism:* The word "knows" is indexical. Its semantic content shifts based on the conversational context of the *attributor* (the person saying "S knows"). High standards context $\rightarrow$ "knows" means more. (DeRose, Cohen, Lewis).

  3.  **Identify the Specific Tension Point:**
