  - the question stated precisely enough that it has a determinate answer
  - why the standard way the debate is set up leaves it open
  - the method, concretely — I was thinking of splitting the monster into a conversion-rate version and a capacity version, building the intrapersonal analogue for each, and testing prioritarianism against both
  - the possible conclusions and what would decide between them
  - what would count as the project failing, and an honest take on whether its too big for one term

  No bibliography or citations, I'll fill those in myself. And please write it in British English.
