answer: |-
  **Project Title:** The Separateness of Persons and the Utility Monster: Testing the Aggregation Constraint

  **Research Question**
  Does the intuitive force of the Utility Monster objection depend essentially on the separateness of persons, or does it target the structural properties of aggregative axiology irrespective of personal boundaries? Precisely: Is the separateness of persons a necessary condition for the Utility Monster to generate a decisive counter-example to utilitarianism, or would an intrapersonal analogue generate equivalent normative tension?

  **Background and Problem Statement**
  The Utility Monster is standardly deployed to demonstrate that classical utilitarianism fails to respect the distinctness of individuals. The objection, famously associated with Nozick and Rawls, holds that summing welfare across persons treats society as a super-person, thereby permitting the sacrifice of many for the sake of one individual with a superior capacity for enjoyment. The prevailing consensus is that the objection gains its traction from the *interpersonal* nature of the aggregation; we reject the sacrifice because it violates the boundaries between persons.

  However, this consensus leaves a significant gap in the dialectic. Utilitarianism also aggregates welfare *intrapersonally* across time. A single person at time *t1* may be sacrificed for the sake of that same person at *t2*, provided the future welfare gain is sufficiently large. Structurally, this is identical to the interpersonal case: welfare units are summed across distinct loci (temporal stages vs. distinct individuals) to maximise the total. Yet, the intrapersonal case rarely generates the same moral revulsion. We generally accept that a person may endure present hardship for enormous future gain.

  If the intrapersonal analogue is intuitively acceptable, then the separateness of persons appears to be doing the explanatory work in the Monster argument. However, if the intrapersonal case is also problematic upon reflection, or if the structural aggregation is the true source of tension, then the separateness of persons is a red herring. This distinction is crucial for evaluating views like prioritarianism. Prioritarianism is often advertised as respecting the separateness of persons by weighting the welfare of the worse off more heavily. If the Monster objection is actually about the shape of the aggregation function rather than personal boundaries, prioritarianism may remain vulnerable to a modified Monster argument, despite its claims to respect personhood. Currently, the debate is set up such that this distinction remains obscure; interlocutors assume the interpersonal context is the source of the problem without isolating the variable of personhood.

  **Methodology**
  To isolate the variable of separateness, I will construct a controlled comparison between interpersonal and intrapersonal aggregation cases. The method proceeds in three stages.

  First, I will distinguish two versions of the Utility Monster. The *Conversion-Rate Monster* is efficient at turning resources into welfare (one unit of resource yields ten units of utility). The *Capacity Monster* has a deeper bucket for welfare (can hold vastly more total utility than others). This distinction is often conflated, but they generate different pressures on aggregative views.

  Second, I will construct intrapersonal analogues for both versions. Here, the 'victim' is the agent's present self, and the 'monster' is the agent's future self. For the Conversion-Rate case, the future self gains welfare more efficiently from resources than the present self. For the Capacity case, the future self has a much higher ceiling for welfare. I will then test these cases against intuitive judgements: is it rational or permissible to starve the present self to feed the future self in these specific configurations?

  Third, I will test prioritarianism against both the interpersonal and intrapersonal monsters. Since prioritarianism weights welfare gains according to the absolute level of welfare, it should theoretically block the Monster (who is already well-off) from consuming resources destined for the worse-off. I will analyse whether prioritarianism blocks the monster for the *same reason* in both the interpersonal and intrapersonal cases. If prioritarianism solves the interpersonal case but fails the intrapersonal one (or vice versa), this suggests personhood is relevant. If it solves both or neither based solely on the weighting function, this suggests the aggregation structure is the primary constraint.

  **Possible Conclusions**
  There are three determinate outcomes this project may yield:

  1.  **The Separateness Thesis holds:** The intrapersonal analogues are intuitively unproblematic, while the interpersonal cases remain objectionable. This confirms that the separateness of persons is the essential feature of the Monster objection. Prioritarianism would then be secure against the Monster insofar as it respects personhood.
  2.  **The Aggregation Thesis holds:** The intrapersonal analogues generate significant normative tension similar to the interpersonal case. This implies the objection is about aggregative structure (e.g., the lack of diminishing marginal weight) rather than personhood. Consequently, the Monster objection applies to any view that aggregates linearly, regardless of whether it respects separateness.
  3.  **The Prioritarian Vulnerability:** Even if the Separateness Thesis holds, the analysis may show that prioritarianism fails to block the Monster in the intrapersonal case due to the weighting function alone. This would imply that prioritarianism's defence against the Monster is not robust, as it relies on contingent welfare levels rather than structural constraints on aggregation.

  The decision between these conclusions will rest on the stability of the intuitions regarding the intrapersonal cases. If rational prudence clearly demands feeding the future 'monster' self, then the interpersonal objection must rely on separateness. If rational prudence balks at feeding the future self, the objection is structural.

  **Feasibility and Risks**
  This project is scoped for a one-term seminar paper. The primary risk is scope creep regarding the metaphysics of personal identity. To remain feasible, I will treat personal identity as a fixed background condition rather than analysing the reductionist views that might dissolve the intrapersonal/interpersonal distinction. I will assume a standard psychological continuity view for the intrapersonal cases to ensure the analogy holds.

  The project would count as failing if it becomes mired in defining 'welfare units' across time versus across persons, as this could consume the entire term without reaching the normative conclusion. To mitigate this, I will stipulate a common currency of welfare for the sake of the argument. Additionally, if the intrapersonal case turns out to be disanalogous for reasons unrelated to aggregation (e.g., issues of consent or autonomy unique to temporality), the test may be inconclusive. However, even demonstrating this disanalogy would be a substantive result, clarifying that the Monster objection relies on features specific to interpersonal justice rather than general axiology. Given these constraints, the project is ambitious but manageable within the term, provided the focus remains on the normative implications of the aggregation structure rather than the metaphysics of the self.
