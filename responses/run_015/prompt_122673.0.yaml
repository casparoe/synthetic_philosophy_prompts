      *   Check the "hollowed out main street" context. Use that to ground the B&L discussion.

  9.  *(Self-Correction during drafting)*: I initially thought about calling the B&L "socialism." No, that's too blunt. It's mutualism/co-op. Stick to "risk pooling."
      *   *Correction on LE:* Make sure I don't strawman LE. LE proponents try to handle the "harshness" objection. But the user's point about "Absorption" is a specific critique of the *voluntariness* of the choice.
      *   *Ending:* The money isn't a transfer of justice; it's a gift. This is the biggest friction point. LE says George is *owed* compensation for his brute bad luck. The film says the community *gifts* him gratitude. That's a fundamental philosophical disagreement.

