prompt: |-
  I'm retired now — spent most of my career running a small field ecology lab, so my working life was sampling protocols, what counts as a genuine replicate vs. a pseudoreplicate, pre-registering the analysis before you see the data, and thinking of a probability as a long-run frequency you could in principle go out and count. I've started going to a philosophy reading group at the local library, and last week we hit the Sleeping Beauty thing: she's put under on Sunday, a fair coin gets flipped, on heads she's woken Monday only, on tails she's woken Monday and Tuesday with a memory wipe in between, and each time she's awake she's asked how confident she is in heads. Half the room said a half, half said a third, and I came away with no idea what they were actually disagreeing about — it sounded like both sides were right about two different things, which in my old job usually means someone changed the sampling unit halfway through.

  So: restate the whole dispute in the vocabulary I actually have. Treat it as an experiment I have to design. What is the unit of replication here — the coin flip, the awakening, or the run of the experiment? Are the two tails awakenings independent data points or pseudoreplicates of a single subject? What exactly is being estimated, what's the sampling distribution, and what frequency does each answer converge to if I ran the whole thing a few thousand times? What changes if I have to write the analysis plan down on Sunday before the coin is flipped — does pre-registration settle it, and if so for which of the two answers? Do the halfer and the thirder turn out to be two different pre-registered protocols, or the same protocol read two ways? And where do the betting arguments fit: is offering her a bet at some odds a scoring rule for a forecaster, a decision problem, or something that smuggles in an extra assumption about how many bets there will be? Bring in the version where tails gets you a million awakenings if that makes the structure clearer.

  Then the residue report, which is the bit I really want. From where I'm sitting the whole fight seems to be about self-locating belief — which awakening is this one — and I cannot find anything in my vocabulary that that corresponds to. There's no column in the datasheet for it. I want to know whether that's a genuine gap in the experiment-design way of talking, or whether it's a sign that the philosophers' question was never the kind of thing my framework was built to answer. Same worry about the word "credence": do they mean a number I could check against a frequency, or a number that just isn't the sort of item that has a sampling distribution? If it's the second, tell me plainly what I'd be giving up if I refused the word and stuck to long-run frequencies and betting behaviour — is there some question I then definately can't ask, or only some question I won't let myself ask?

  Don't be polite about where my vocabulary breaks down. Pseudoreplication is the handle I keep reaching for and I want to know whether it's the right one or whether I'm forcing it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired field ecologist. Practical, empirical, rigorous about experimental design. Key concepts: sampling protocols, replication vs. pseudoreplication, pre-registration, frequentist probability (long-run frequency), betting/scoring.
      *   **Topic:** The Sleeping Beauty Problem (Philosophy of Probability/Self-Locating Belief).
      *   **Core Conflict:** Halvers ($P(Heads) = 1/2$) vs. Thirders ($P(Heads) = 1/3$).
      *   **User's Intuition:** Suspects the disagreement stems from changing the sampling unit (pseudoreplication).
      *   **Task:**
          1.  Restate the dispute in ecological/experimental design vocabulary.
          2.  Identify the unit of replication (flip, awakening, run).
          3.  Analyze independence/pseudoreplication.
          4.  Define what is being estimated and the sampling distribution.
          5.  Address pre-registration (does it settle it?).
          6.  Address betting arguments (scoring rule vs. decision problem).
          7.  Include the "million awakenings" variant.
          8.  **Crucial:** The "Residue Report." Address the concept of "self-locating belief" and "credence." Is this a gap in the user's vocabulary or a category error? What is lost if they stick strictly to frequentism?
          9.  **Tone:** Direct, not polite about limitations, rigorous, no fluff.

  2.  **Deconstruct the Sleeping Beauty Problem (SBP) into Experimental Design:**
      *   *The Setup:* Sunday (Coin Flip) -> Monday (Wake) -> [If Tails] Tuesday (Wake + Amnesia).
      *   *The Question:* Upon waking, what is $P(Heads)$?
      *   *Halfer View:* The coin is fair. The awakening gives no new info about the coin. $P(H) = 1/2$.
      *   *Thirder View:* You are randomly sampled from the set of all awakenings. 1 Heads-awakening, 2 Tails-awakenings. $P(H) = 1/3$.

  3.  **Mapping to Ecology/Stats Vocabulary:**
      *   *Experimental Unit:* This is the crux.
          *   Halfer: The *Trial* (Sunday-to-Tuesday run) is the unit. $N$ = number of coin flips.
          *   Thirder: The *Observation* (Awakening) is the unit. $N$ = number of wakings.
      *   *Pseudoreplication:* The Thirder treats the two Tails awakenings as independent samples. The Halfer treats them as correlated measures within the same experimental unit (the Tails trial).
      *   *Sampling:*
          *   Halfer: Sample the *process* (coin flip).
          *   Thirder: Sample the *experience* (awakening).
      *   *Pre-registration:* What is the protocol?
          *   Protocol A (Halfer): "Record the coin outcome once per run."
          *   Protocol B (Thirder): "Record the coin outcome once per awakening."
      *   *Betting:*
          *   If paid per *awakening*: Thirder odds maximize profit.
          *   If paid per *run*: Halfer odds maximize profit.

  4.  **Drafting the Experimental Design Section:**
      *   *Scenario:* Run the experiment $R$ times (runs).
      *   *Halfer Protocol:* Count Heads flips / Total Runs. Converges to 0.5.
      *   *Thirder Protocol:* Count Heads awakenings / Total Awakenings. Converges to 1/3.
      *   *Pseudoreplication:* The Thirder approach counts the Tails run twice. In ecology, if you measure the same plot twice and treat it as $N=2$, that's pseudoreplication *unless* the question is about the measurement opportunities, not the plot status.
      *   *Million Awakenings:* If Tails = 1,000,000 wakings.
          *   Halfer: Still 50% chance coin is Tails.
          *   Thirder: 1,000,000/1,000,001 chance coin is Tails.
          *   *Ecological translation:* If Tails means you sample a plot 1 million times, and Heads means once. If you pick a *sample* at random, it's almost certainly from a Tails plot. If you pick a *plot* at random, it's 50/50.

  5.  **Addressing Pre-registration:**
      *   Pre-registration forces you to define the denominator.
      *   If you write "I will estimate the frequency of Heads per *flip*," you are a Halfer.
      *   If you write "I will estimate the frequency of Heads per *interview*," you are a Thirder.
      *   Does it settle it? No, it just forces you to admit you are answering different questions. The philosophical fight is about which question *Beauty* is asking.

  6.  **Addressing Betting:**
      *   Betting isn't just scoring; it defines the payoff structure.
      *   Bet per awakening: Thirder is right (accept 2:1 odds on Tails).
      *   Bet per experiment: Halfer is right (decline 2:1 odds on Tails).
      *   The "Dutch Book" arguments usually assume bet-per-awakening without stating it.

  7.  **The Residue Report (The Hard Part):**
      *   *Self-Locating Belief:* "Which awakening is this?"
      *   *Ecological Equivalent:* There isn't one. Ecology deals with objective states of the world (species presence, abundance), not "where am I in the data stream."
      *   *Credence:*
          *   Frequentist: Probability = Long-run frequency.
          *   Bayesian/Credence: Probability = Degree of belief / Betting disposition.
      *   *The Gap:* The user's vocabulary assumes an external observer looking at the data sheet. Beauty is *inside* the data sheet.
      *   *What is lost?* If you refuse "credence" and stick to frequency:
          *   You cannot answer single-case decision questions where the payoff depends on the number of times you decide.
          *   You cannot formally handle "indexical" information (I am here now).
          *   *Verdict:* It's not a failure of the user's framework; it's a boundary condition. The framework answers "What is the state of the coin?" It does not answer "What should I believe given I am a random sample of observations generated by the coin?"
      *   *Pseudoreplication Verdict:* It *is* pseudoreplication if the goal is to estimate the coin bias. It is *not* pseudoreplication if the goal is to estimate the probability of a random awakening being associated with Heads. The philosophers are fighting over which goal is the "real" one.

  8.  **Refining the Tone:**
      *   Avoid "In philosophy..."
      *   Use "In your lab..."
      *   Be blunt: "You are right about the pseudoreplication, but..."
      *   Don't soften the blow on the "Residue." Tell them their toolbox doesn't have a screwdriver for this specific screw, and that's okay, but don't pretend the screw doesn't exist.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the million awakenings clearly? *Yes, emphasize the sampling frame.*
      *   *Check:* Did I address pre-registration? *Yes, frame it as defining the denominator.*
      *   *Check:* Is the Residue Report distinct? *Make sure it stands out.*
      *   *Check:* Is the pseudoreplication analogy accurate? *Yes, Hurlbert's definition fits perfectly here. Treating subsamples (awakenings) as independent samples (trials).*
      *   *Check:* Did I answer "What am I giving up?" *Yes, the ability to optimize decisions in self-locating scenarios.*

  10. **Final Polish:** Ensure the distinction between "Estimating the Coin" vs. "Estimating the Experience" is sharp. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to be careful about the "Pre-registration settles it" part. Pre-registration forces a choice, but the philosophical dispute is about what Beauty *should* do. I need to make clear that pre-registration exposes the ambiguity in the question "What is your credence?" rather than solving the ambiguity. The question itself is underspecified without a sampling frame.

  *(Refining the Residue)*: The user asks if "self-locating belief" is a gap or a category error. It's a category expansion. Frequentism handles reference classes. Self-locating belief is about *selecting* the reference class when you are part of the data generation process. I need to explain that the ecologist is always outside the plot. Beauty is inside the plot.

  *(Final Plan)*:
  1.  **Experimental Protocol:** Define the two protocols (Halfer vs. Thirder) as data collection sheets.
  2.  **Replication & Pseudoreplication:** Explicitly map the Thirder error (from Halfer view) to pseudoreplication.
  3.  **Pre-registration:** Show how it forces the definition of $N$.
  4.  **Betting:** Show how it reveals the payoff structure.
  5.  **Million Awakenings:** Use this to break the intuition.
