answer: |-
  # Specification: Theory of Persistence Through Change and Replacement

  **Objective:** Define the necessary conditions for a metaphysical theory of persistence to be considered adequate for resolving practical and theoretical disputes regarding object identity over time.
  **Standard of Adequacy:** The theory must yield determinate verdicts sufficient to adjudicate legal, financial, and heritage disputes (e.g., insurance liability, debt obligation, registry status), not merely categorize the nature of the disagreement.

  ---

  ## 1. Case Coverage Requirements
  *The theory must generate a verdict for the following scenarios without resorting to "it depends on intuition."*

  | Requirement | Case/Consideration | Status |
  | :--- | :--- | :--- |
  | **1.1 The Reassembly Verdict** | **Case:** Original planks are replaced gradually (Ship A) while discarded planks are saved and reassembled (Ship B). Both exist simultaneously.<br>**Consideration:** The theory must assign identity to exactly one ship or explicitly deny identity to both, without contradiction. It cannot allow both to be the Original. | **Non-Negotiable** (Logic) |
  | **1.2 The Duplicate Verdict** | **Case:** Original is destroyed. Later, a ship is built from new materials using the exact original plans.<br>**Consideration:** The theory must distinguish between *replication* and *persistence*. A verdict of "Same Ship" here undermines the necessity of causal continuity. | **Non-Negotiable** (Causality) |
  | **1.3 The Intermittency Verdict** | **Case:** Ship is dismantled, stored in a warehouse for 50 years, then reassembled.<br>**Consideration:** The theory must account for existence gaps. Does the ship cease to exist during storage? If so, is the reassembled ship a *resurrection* or a *continuation*? | **Non-Negotiable** (Temporal Continuity) |
  | **1.4 The Functional/Museum Verdict** | **Case:** Original hull is beached as a static museum piece; a new vessel is built to sail under the same name and registry.<br>**Consideration:** The theory must weigh *material continuity* against *functional/institutional continuity*. It cannot ignore the role of social designation. | **Non-Negotiable** (Sortal Sensitivity) |

  ## 2. Distinction Requirements
  *The theory must maintain conceptual boundaries that are routinely collapsed in informal debate.*

  | Requirement | Distinction | Status |
  | :--- | :--- | :--- |
  | **2.1 Identity vs. Continuity** | **Consideration:** "Same object" (numerical identity) must be distinguished from "continuous history" (genetic/spatiotemporal connection). A replica has continuity of design but not identity. | **Non-Negotiable** |
  | **2.2 Object vs. Matter** | **Consideration:** The theory must distinguish the identity of the *ship* from the identity of the *planks*. If the planks are the same, the ship need not be, and vice versa. | **Non-Negotiable** |
  | **2.3 Sortal-Relativity** | **Consideration:** The theory must state whether identity is absolute (the ship is the same *simpliciter*) or sortal-relative (same *ship*, but not same *collection of wood*). | **Preference** (Camp Dependent) |
  | **2.4 Thing vs. Constitution** | **Consideration:** If the ship constitutes a specific mass of matter, the theory must explain why the mass can persist without the ship (e.g., if the ship is destroyed but the wood remains). | **Non-Negotiable** |

  ## 3. Logical and Practical Constraints
  *The theory must operate within formal logical bounds and map onto real-world stakes.*

  | Requirement | Constraint | Status |
  | :--- | :--- | :--- |
  | **3.1 Transitivity of Identity** | **Consideration:** If Ship A = Original and Ship B = Original, then Ship A = Ship B. Since A and B are distinct objects in the Reassembly Case, the theory cannot identify both with the Original. | **Non-Negotiable** (Logic) |
  | **3.2 Leibniz's Law** | **Consideration:** If the Original had a debt, and the Current Ship is the Original, the Current Ship must have the debt. Properties must transfer across identity. | **Non-Negotiable** (Logic) |
  | **3.3 Mereological Limits** | **Consideration:** The theory must specify a threshold for material replacement. If 100% replacement is allowed (Vanilla Case), why is 100% replacement + Reassembly not allowed? | **Non-Negotiable** (Consistency) |
  | **3.4 Adjudicatory Determinacy** | **Consideration:** In insurance or debt cases, a verdict of "indeterminate" is functionally equivalent to "no payout." The theory must provide a decision rule, not just a description of vagueness. | **Non-Negotiable** (User Standard) |

  ---

  ## 4. Incompatibilities and The "Killer" Requirement

  ### The Trilemma of Reassembly
  There is a suspected incompatibility between three requirements in the **Reassembly Case** (Ship A [continuous] vs. Ship B [reassembled]):
  1.  **Transitivity:** Identity must be transitive (A=B, B=C → A=C).
  2.  **Determinacy:** There must be a fact of the matter about which ship is the Original (to satisfy the Courthouse Standard).
  3.  **Material/Continuity Intuitions:** Ship A has continuity of form/function; Ship B has continuity of matter. Both have strong claims.

  **The Conflict:** If you satisfy **Determinacy** by picking Ship A, you violate strong Material Intuitions. If you pick Ship B, you violate strong Continuity Intuitions. If you say "Both," you violate **Transitivity** (since A ≠ B). If you say "Neither," you violate **Adjudicatory Determinacy** (the insurance company doesn't know who to pay).

  ### The "Killer" Requirement
  **Requirement 3.4 (Adjudicatory Determinacy)** combined with **Requirement 3.1 (Transitivity)** does the most to eliminate otherwise respectable contenders.
  *   **Why:** Many metaphysically sophisticated views (e.g., Vagueness, Ontological Relativity) admit that there is *no fact of the matter* in borderline cases. This satisfies logic and intuition but fails the Courthouse Standard. A theory that says "It is indeterminate" cannot decide a lawsuit. To pass this spec, a theory must be willing to posit a brute fact or a convention that overrides metaphysical vagueness.

  ### Can Determinacy and Transitivity Coexist?
  Yes, but only if the theory accepts **Arbitrariness** or **Brute Fact**. To preserve Transitivity and Determinacy in the Reassembly Case, the theory must assert that *one* ship is the Original despite near-symmetric evidence. This implies that identity is not grounded in the physical facts alone (which are symmetric) but in some external factor (e.g., causal dominance, legal stipulation, or haecceity).

  ---

  ## 5. Scoring Main Views Against Specification

  | View | Verdict Capability (3.4) | Transitivity (3.1) | Reassembly Case (1.1) | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Endurantism (Sortal)** | **Pass** | **Pass** | **Fail/Arbitrary** | Delivers determinate answers via sortals (e.g., "Ship" vs. "Wood"). However, in Reassembly, it often relies on brute facts to pick one, which feels ad hoc. |
  | **Perdurantism (4D)** | **Pass** | **Pass** | **Pass** (Redefinition) | Avoids the problem by treating ships as spacetime worms. "Identity" is replaced by "temporal counterparting." *Risk:* Fails to match the *feeling* of legal identity (whole object vs. time-slice). |
  | **Best-Candidate** | **Pass** | **Fail** | **Pass** | Picks the "better" candidate (usually continuous). *Fatal Flaw:* Violates Transitivity if the "better" candidate changes based on the presence of the rival (the "Only x and y" problem). |
  | **Conventionalism** | **Pass** (by stipulation) | **Pass** | **Pass** (by stipulation) | Admits no ontological fact; identity is decided by us. *Risk:* Fails the "Metaphysical" ambition, but succeeds best at the "Courthouse" standard. |

  ---

  ## 6. The Crux: The Standard of Adequacy

  **Verdict:** The specification as written—specifically the **Standard of Adequacy** (deciding courthouse/registry disputes)—is **unsatisfiable by pure metaphysics.**

  **Explanation:**
  Metaphysics describes what *exists* and how it *persists*. Law and Administration prescribe what *counts* for the purpose of liability, ownership, and registry. These are category-distinct operations.
  *   **The Gap:** A metaphysical theory might conclude that the Reassembled Ship is the *ontological* original (due to matter), while the Continuous Ship is the *functional* original. A court, however, cannot split the verdict. It must assign the debt to one entity.
  *   **The Implication:** No ontological theory can deliver the required determinacy because the determinacy required by the courthouse is **normative**, not **descriptive**. The court does not discover the ship's identity; it *assigns* it to ensure the smooth functioning of commerce and heritage.

  **Condition for Satisfiability:**
  For this specification to be satisfiable by a metaphysical theory, the following would have to be true:
  1.  **Normative Realism:** Moral and legal facts (debt, ownership) must be reducible to metaphysical facts (identity, parthood).
  2.  **No Vagueness:** The world must be precise. There must be a fact of the matter about exactly when a ship ceases to exist, down to the atomic level.
  3.  **Sortal Absolutism:** There must be a single, privileged way of counting objects that overrides all functional or social designations.

  **Conclusion:**
  If you require a theory to *decide* the disputes, you are not looking for a metaphysics of persistence; you are looking for a **legal theory of personhood and property**. A metaphysical theory can inform that legal theory (by clarifying the costs of choosing matter vs. continuity), but it cannot replace it. The "Killer" requirement (3.4) forces the abandonment of pure ontology in favor of convention. If you insist on an ontological answer to a normative question, **Conventionalism** is the only view that passes, but only by admitting that the "fact of the matter" is created by the decision, not discovered by the theory.
