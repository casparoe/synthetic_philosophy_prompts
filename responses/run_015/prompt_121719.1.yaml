  Contemporary AI forecasting and governance discourse routinely frames the prospect of an intelligence explosion as a question of takeoff speed—placing scenarios on a continuous spectrum from slow, multi-decade capability growth to rapid, months-long escalation—rather than treating a genuine rupture as a categorically different kind of event in which the very metric of speed becomes inapplicable. What philosophical commitments about technological change, agency, and the ontology of intelligence does that framing presuppose? Does it implicitly treat intelligence as a smoothly scalable quantity, or does it smuggle in a deterministic assumption that social and economic institutions can adapt at any velocity? Reconstruct the implicit metaphysical and normative theory that makes the spectrum model coherent, distinguish what the practice strictly requires from what it merely accommodates, assess whether it is consistent with the same field's warnings about sudden strategic discontinuities, and take a committed stance on whether governance should abandon the continuous-speed framework in favor of a categorical distinction between incremental growth and genuine rupture—specifying exactly which institutional mechanisms, such as evaluation protocols or deployment thresholds, would have to be redesigned if your position were adopted.
