      VERIFIED DEBATE LEAGUE
      ADJUDICATION HANDBOOK & PROCEDURAL STATUTES
      Version 9.4 (Ratified by Committee 14-B)

      1.0 DEFINITIONS AND CLASSIFICATIONS
      1.1 A "Claim" is any assertion of fact or logic submitted for adjudication.
      1.2 An "Argument" is a sequence of Claims linked by explicit inference steps intended to establish a Conclusion.
      1.3 An "Obfuscated Argument" is an Argument containing inference steps designed primarily to conceal logical gaps rather than to illuminate them. Determination of Obfuscation rests solely with the Presiding Judge, who shall assess intent based on syntactic density and the subjective sensation of clarity.
      1.4 A "Verifiable Claim" is a Claim that could be checked by an external authority, provided such authority were permitted under Section 2.0.

      2.0 JUDICIAL CONSTRAINTS AND EPISTEMIC HYGIENE
      2.1 The Presiding Judge is strictly prohibited from consulting external records, running simulations, or utilizing personal domain expertise to validate Claims.
      2.2 The Judge's role is limited to evaluating the structural integrity of the Argument as presented within the chamber.
      2.3 Any attempt by the Judge to verify a Claim independently constitutes a Class A Procedural Violation. The integrity of the League relies on the assumption that truth is inherently easier to defend than falsehood under cross-examination.

      3.0 CROSS-EXAMINATION PROTOCOL
      3.1 The Challenger must identify a single "Node" (inference step or Claim) within the Defender's Argument alleged to be false.
      3.2 The Defender is permitted to defend only the identified Node. Expanding the defense to surrounding Nodes constitutes "Chain Restatement" and is grounds for point deduction.
      3.3 Time allocation for Cross-Examination is asymmetrical: The Challenger is allotted 5 minutes to locate a flaw; the Defender is allotted 5 minutes to repair it. This acknowledges the computational asymmetry between generating plausible steps and locating specific errors.
      3.4 If the Challenger fails to isolate a specific Node and instead attacks the Conclusion directly, the objection is dismissed as "Undifferentiated Skepticism."

      4.0 RECURSIVE OBJECTION LIMITS
      4.1 Objections may be raised against the validity of previous objections.
      4.2 The depth of recursive objection is capped at Level 5.^1
      4.3 Upon reaching Level 5, the Presiding Judge must render a verdict based on the state of the Argument at that level. Further appeals to deeper logical layers are prohibited.

      5.0 SCORING AND ROBUSTNESS METRICS
      5.1 Standard Victory is awarded to the Debater who maintains the structural integrity of their position throughout the Cross-Examination phase.
      5.2 Counterfactual-Robustness Bonus: A victory is only certified for League standings if the Adjudication Panel confirms that the winning Debater would have prevailed against a counterpart with approximately ten times (10x) the computational capability.^2
      5.3 Certification of the Counterfactual-Robustness Bonus requires unanimous consent from the Oversight Committee. If consent is withheld, the match is recorded as "Exhibition Only."

      6.0 TIE-BREAKING PROCEDURES
      6.1 In cases where both Arguments are deemed equally unverifiable under Section 2.0, the victory is awarded to the Debater who utilized fewer syntactic tokens to express their Conclusion.
      6.2 This metric operates on the heuristic that truth compresses more efficiently than falsehood.

      APPENDIX A: SPECIAL EVENT DIVISIONS
      A.1 The "Black Box" Division: Questions whose answers are checkable in principle but not by any entity currently accessible to the League. Judging criteria rely exclusively on Section 6.1.
      A.2 The "Mirror Match" Division: Both Debaters are assigned the same Conclusion. Scoring is based on the volume of credible damage voluntarily inflicted upon their own shared position. The Debater who successfully undermines the Conclusion while still being declared the winner receives the "Integrity Prize."
      A.3 The "Silent" Division: Debaters submit written Arguments without Cross-Examination. Winners are chosen by random draw to establish a baseline for procedural noise.

      ^1 Footnote: The Level 5 cap was established following Committee Meeting 14-B, based on the average maximum attention span of human Judges before semantic satiation occurs.
      ^2 Footnote: Capability multipliers are estimated using proxy benchmarks approved by the Standards Subcommittees.

