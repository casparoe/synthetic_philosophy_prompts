answer: |-
  Here is the specification you asked for. It sets out what a theory of future truth must achieve to handle your intuitions without collapsing.

  **Requirement 1: Logical Coherence (The Disjunction)**
  The account must preserve the law of excluded middle. "There will be a battle or there won't" must come out as true now, even if the parts are unsettled.
  *Case:* If you deny this, logic breaks for future statements. If you affirm it while denying truth to the parts, you need a non-standard logic of 'or'.
  *Status:* Non-negotiable for any system claiming to be logic.

  **Requirement 2: The Contingency Marker (The Eclipse)**
  The account must distinguish between necessary futures (eclipses) and contingent ones (sea battles). It cannot treat them as metaphysically identical.
  *Case:* Your intuition that the eclipse is settled but the battle is not is robust. A theory that flattens this difference fails to describe reality as we experience it.
  *Status:* Non-negotiable for matching phenomenological experience.

  **Requirement 3: Retrospective Stability**
  The account must allow you to say on Thursday, "It was true on Tuesday that the battle would happen," without contradicting what you said on Tuesday.
  *Case:* We speak this way constantly. If the theory forces you to say, "It wasn't true then, it only became true," it clashes with standard language and the feeling of discovery.
  *Status:* Non-negotiable for linguistic consistency.

  **Requirement 4: Agency Preservation**
  The account must leave room for deliberation to be more than a theatre performance. Your choice must be able to make the difference between the true and the false outcome.
  *Case:* If the truth is already fixed independently of your choice, deliberation is causally inert. A theory that makes choice illusory is pragmatically useless.
  *Status:* Negotiable. Compatibilists argue you can deliberate even if the outcome is fixed.

  **Requirement 5: Probability Accommodation**
  The account must handle graded chances (the loaded die) without collapsing them into 0% or 100% prematurely.
  *Case:* Science relies on objective probability. If the future is already binary true/false, probability is just ignorance. The theory must say whether probability is in the world or in the head.
  *Status:* Non-negotiable for scientific alignment.

  **Requirement 6: Interruption Handling**
  The account must deal with processes that are stopped before completion (the snatched coin).
  *Case:* If the coin is melted, did the statement "it will land heads" become false, or void? A theory must specify if truth depends on the completion of the process.
  *Status:* Negotiable edge case, but reveals structural weaknesses.

  ***

  **The Incompatibility Warning**

  You cannot satisfy **Requirement 2 (Contingency)** and **Requirement 3 (Retrospective Stability)** simultaneously without significant philosophical cost.

  If it is genuinely true *now* that the battle will happen (to satisfy Retrospective Stability), then the future is fixed, and it is hard to see how it is contingent (violating the Eclipse distinction).

  If it is genuinely contingent *now* (to satisfy the Eclipse distinction), then it cannot be strictly true *now* that it will happen, which makes your Thursday claim ("It was true on Tuesday") technically false or requiring a change in meaning.

  You must sacrifice either the openness of the future or the stability of past truth about the future.

  ***

  **Evaluation of the Three Views**

  **View 1: Everything is Settled (Determinism)**
  This view says every future statement is already true or false. It passes Logical Coherence and Retrospective Stability effortlessly. The eclipse and the sea battle are metaphysically the same; we just know one better.
  However, it fails the Contingency Marker. There is no real difference between the eclipse and the battle except our ignorance. It also threatens Agency Preservation, making deliberation a process of discovering what you were always going to do, not deciding it.

  **View 2: Nothing Contingent has a Truth Value (Open Future)**
  This view says contingent statements are neither true nor false until they happen. It passes the Contingency Marker and Agency Preservation brilliantly. The future is genuinely open to be made.
  However, it struggles with Logical Coherence. It must claim "P or not-P" is true while both parts lack truth, requiring a revised logic. It also fails Retrospective Stability; you must admit that on Tuesday, it was *not* true that the battle would happen, even after it does.

  **View 3: Branching Paths (Supervaluation)**
  This view says there are many future branches. A statement is true only if it happens on *all* branches, false on *none*, and indeterminate if mixed. "P or not-P" is true because it holds on all branches.
  This saves Logical Coherence and the Contingency Marker. However, it struggles with Retrospective Stability. Once you are on the branch where the battle happens, you must explain why the other branches "disappeared" or were never real. It also makes the Demon problem tricky; if the demon sees a branch, does that collapse the others?

  **Summary**
  Your mate holds View 1. You lean towards View 2. View 3 tries to give you the logic of View 1 with the metaphysics of View 2. None deliver a perfect score on the spec because the spec contains a contradiction between openness and fixity. You must choose which requirement you are willing to downgrade.
