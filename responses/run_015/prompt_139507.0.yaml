  2.  **Deconstruct the Requirements (The "Spec"):**
      *   *Requirement 1: The Law of Excluded Middle (Disjunction).* The user notes everyone agrees "P or not-P" is true. A theory must account for this without forcing "P" to be true or false individually if it wants to maintain openness.
