  **Part (a) [6 marks]**
  *   **Correct:** The calculation of the probability $2^{-n}$ is correct. The derivation of the probability-weighted sum as the alternating harmonic series $\sum (-1)^{n+1}/n$ is correct. The identification of the limit as $\ln 2$ is correct.
  *   **Correct:** The sum of absolute payoffs is correctly identified as the harmonic series $\sum 1/n$, and the conclusion that it diverges is correct.
  *   **Comment:** This section is flawless. You have correctly handled the arithmetic and the convergence properties of the specific series involved.
  *   **Mark:** 6/6

  **Part (b) [8 marks]**
  *   **Correct:** Your diagnosis that the expected value is not well-defined because the sum of absolute values diverges (and positive/negative parts are both infinite) is the standard correct answer for the Pasadena game.
  *   **Incorrect:** The claim that this is "exactly the situation in the St Petersburg game" is false. In the St. Petersburg game, all terms are positive; the sum diverges to $+\infty$, which is a well-defined value in the extended reals. In the Pasadena game, the sum is undefined (of the form $\infty - \infty$).
  *   **Looks right on quick reading:** The phrase "In that sense the expectation is infinite" sounds plausible but conflates "undefined" with "infinite." Furthermore, stating both games are "not well-defined" glosses over the crucial distinction between divergence to infinity and lack of definition due to conditional convergence.
  *   **Comment:** You identified the status of the Pasadena game correctly but failed the comparison task. The moral drawn ("unbounded payoffs make expected value useless") is too broad; St. Petersburg has a useful infinite expectation in many contexts, whereas Pasadena does not.
  *   **Mark:** 3/8

  **Part (c) [6 marks]**
  *   **Incorrect:** Asserting the natural-ordering response is "correct" contradicts the standard measure-theoretic definition of expectation (which requires absolute convergence) and contradicts your own conclusion in part (b) that the value is not well-defined.
  *   **Incorrect:** The claim that "whenever a gamble has infinitely many possible outcomes... no such gamble has a well-defined expected value" is demonstrably false. Many infinite gambles converge absolutely (e.g., payoff $1/2^n$ with probability $1/2^n$).
  *   **Incorrect:** You claim rearrangement issues apply to the St. Petersburg game ("That includes the St Petersburg game"). Since St. Petersburg terms are all positive, the Riemann rearrangement theorem does not apply; the sum is invariantly $+\infty$.
  *   **Correct:** The final sentence regarding bounded utility functions is correct; bounded utility ensures absolute convergence.
  *   **Comment:** This section contains fundamental theoretical errors. You have generalized a property of conditionally convergent series to all infinite series and contradicted your earlier diagnosis.
  *   **Mark:** 1/6

