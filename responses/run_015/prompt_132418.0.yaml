answer: |-
  Theo is more right about the internal logical consistency of consequentialism, but Dmitri is more right about its failure to accommodate the human experience of moral agency and integrity.

  **(1) Dmitri:** Right that act consequentialism classifies most ordinary leisure as objectively suboptimal; mistaken that this automatically invalidates the theory rather than indicting our current moral priorities. The "malfunction" claim assumes morality must validate common sense, which is question-begging.
  **(2) Theo:** Right that "too demanding" is not a logical contradiction; mistaken to treat morality like arithmetic, ignoring that moral theories are meant to be action-guiding for finite beings. If a theory says everyone is failing, it loses its normative grip.
  **(3) Dmitri:** Right that maximizing structures lack a saturation point where duties end; specifically right that "wrong without blame" fails to protect the agent's integrity. If an act is objectively wrong, the agent is morally deficient even if excused, which creates alienation from their own life.
  **(4) Theo:** Right that marginal utility creates a practical stopping point; mistaken that this functions as a moral permission. It is merely a strategic pause to preserve the instrument (you), not a recognition that your time is inherently yours.
  **(5) Dmitri:** Right that objective consequentialism makes duties unfairly sensitive to luck and others' noncompliance; mistaken to imply this makes requirements impossible, though it does make them unstable. The "worst people set terms for the best" point is a strong fairness objection.
  **(6) Theo:** Right that subjective expected value solves the knowability problem; mistaken to claim commonsense luck sensitivity is equivalent. There is a moral difference between luck determining *how much* good you do versus luck determining *whether you are morally required to ruin your life*.
  **(7) Dmitri:** Right that subjective maximization leads to regress (calculating the calculation) and Pascal's Mugging; this shows that even subjective consequentialism is psychologically unstable as a direct decision procedure.
  **(8) Theo:** Right to distinguish the criterion of rightness from the decision procedure; mistaken if this implies the agent can ignore the criterion entirely. If the criterion says your procedure is suboptimal, you are required to change the procedure, reinstating the demand.

  **What Both Are Missing**
  They are arguing past each other on the distinction between the *criterion of rightness* (what makes acts good) and the *decision procedure* (how agents choose). Theo thinks showing consequentialism is the true criterion defeats Dmitri; Dmitri thinks showing it is an unlivable procedure defeats Theo. Noticing this doesn't dissolve the argument, it relocates it. Even if consequentialism is the true criterion, Dmitri's worry persists as an objection to *alienation*: if the only reason I am allowed to pursue my own projects is that doing so indirectly maximizes the good, I do not truly own those projects. I am still living a life justified by external metrics, not internal values.

  **The "Wrong Without Blame" Point (Move 3)**
  This is the crux of the integrity objection. Theo wants to separate *evaluation* (the act is suboptimal) from *sanction* (you are not blameworthy). Dmitri is right to reject this comfort. Morality is not just a scoreboard; it is supposed to tell you how to live. If the theory verdicts your life as objectively deficient—even while excusing you—it demands you view your own commitments as morally secondary. You remain a vessel for the good rather than an author of your life. The verdict isn't useless, but its use is to mark you as morally compromised, which is exactly what Dmitri finds unacceptable.

  **Does the Demandingness Worry Survive?**
  Yes, the demandingness worry survives even after granting Theo's points in (4), (6), and (8). Once you accept indirect consequentialism (8), marginal limits (4), and subjective evidence (6), the *psychological* burden of constant calculation vanishes, but the *structural* burden remains. You are still only permitted to have a Tuesday if having a Tuesday is the best way to maximize value given your psychology. You have no intrinsic right to your own life; you have a lease contingent on utility. If you discover that quitting your job to paint would actually maximize value, the theory requires you to paint, not because you love art, but because of the output. The demand shifts from "calculate every moment" to "configure your entire identity to serve the good," which preserves the core of Dmitri's objection: the theory cannot make space for personal projects that are valued for their own sake.
