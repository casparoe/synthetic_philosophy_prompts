  **MEMORANDUM**

  **TO:** Admissions Criteria Review Committee
  **FROM:** Committee Chair
  **DATE:** 10 March
  **SUBJECT:** Recommendation on Character and Integrity Metrics

  We must report to the Dean by 21 March. Our mandate is clear: the governing board requires a holistic review including personal character and integrity. We cannot drop this dimension. However, our current method fails, and the proposed replacement carries significant risks. After reviewing the pilot data and our deliberations, I recommend we **adopt a revised version of the Contextualized Behavior Inventory (CBI) with stated conditions and a validation timetable.**

  We must acknowledge the failure of the status quo. The argument to retain teacher recommendation letters rests on a strong philosophical intuition: virtue is cultivated over time, and teachers who know students for years perceive a narrative arc that snapshots miss. This is the strongest consideration against the inventory. A teacher's longitudinal observation captures growth and intentionality in a way isolated reports cannot. However, the empirical data is decisive: inter-rater reliability on global traits is near zero. If we cannot distinguish between applicants consistently, we are not reviewing; we are guessing. We cannot retain an instrument proven to be unreliable when equity is at stake.

  Conversely, adopting the CBI as designed solves the reliability problem but introduces two new ones. The psychology department's pilot confirms that cross-situational consistency is a myth; behavior is contextual. Yet, the specific behaviors predicting conduct violations were drawn from settings where surveillance varies by socioeconomic status. Applicants from structured high schools or supervised employment are watched more closely than those with informal responsibilities. If we penalize the unwatched, we measure privilege, not integrity.

  Furthermore, the philosophical objection stands. On an Aristotelian account, virtue is not merely behavioral frequency; it is a settled state of perceiving and judging rightly. The CBI measures compliance in specific contexts, not moral character. If we claim to measure "virtue" using this tool, we are category-errors.

  Therefore, I propose we adopt the CBI only under three conditions:

  1.  **Reframing:** We explicitly define the metric as "Contextual Conduct Reliability," not "Character" or "Virtue." This satisfies the philosophical concern by admitting we are measuring observable behavior, not internal hexis.
  2.  **Equity Validation:** We suspend high-stakes weighting of this dimension for one admissions cycle. During this time, we must validate that the "specific settings" do not disproportionately penalize applicants from less surveilled backgrounds.
  3.  **Sunset Clause:** If the equity audit fails, we revert to a narrative-based review, accepting lower reliability to avoid systemic bias.

  To my colleagues in psychology: This recommendation accepts your data that behavior is contextual and predictive. It rejects only the assumption that the available contexts are equitable. To my colleagues in philosophy: This accepts your warning that we cannot measure virtue directly. It proposes we measure what we can see (conduct) while acknowledging it is a proxy, not the thing itself.

  We are choosing the least imperfect tool. The inventory is flawed, but the letters are broken. By revising the implementation, we honor the board's policy without pretending to scientific or moral certainty we do not possess.

  **Draft Communication for Rejected Applicants**

  Per our new protocol, any applicant denied admission on character grounds must receive a plain-term explanation. Below is the draft language for such cases:

  > "Our admissions process includes a review of personal integrity and community conduct. Based on reports from multiple observers in specific settings, such as classrooms or workplaces, we identified patterns of behavior that suggest a mismatch with the collaborative standards of our Honors College. Specifically, we observed inconsistencies in how you manage responsibilities when supervision varies. While this does not reflect your overall worth, it indicates a risk regarding the shared trust required in our community. We encourage you to seek environments where your specific strengths in structured settings can flourish."

  This language is honest. It cites the evidence (observer reports), specifies the deficit (inconsistency across supervision levels), and avoids moral condemnation while maintaining the barrier.

  Please review this recommendation. I intend to submit this framework to the Dean on Thursday unless I hear substantial objection regarding the equity validation timeline.
