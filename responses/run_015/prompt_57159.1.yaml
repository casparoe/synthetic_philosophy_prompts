          *   *Précis Fit:* The précis's "inviolate level" is too rigid. In the Canon, the "outside" is the structure of the modulation itself. The précis implies a static outside; the Canon implies a dynamic shift. The user's intuition is sharp: the ignored parameter (register/key) *is* the meta-level.

  4.  **Synthesize the "Self-Refutation" Conclusion:**
