answer: |-
  ### The Jury Analogy: An Audit

  Your colleague's reliance on the jury analogy is the standard defence of sortition. It is rhetorically potent because it leverages a democratic intuition we already possess: that ordinary people, when properly convened, can be trusted with grave decisions. However, as you suspect, the institutional mechanics of a criminal trial differ profoundly from those of a legislative chamber. To treat the jury as a complete blueprint is to mistake a specific legal instrument for a general political principle.

  Below is the audit you requested, breaking down the correspondence, the structural failures, and the residual value of the analogy, followed by a suggestion for a more accurate picture.

  #### 1. The Correspondence Table

  | Component | The Criminal Jury | The Proposed Sortition Chamber |
  | :--- | :--- | :--- |
  | **The Body** | 12 citizens (randomly drawn). | 300 citizens (stratified random draw). |
  | **The Authority** | The Judge (controls procedure & law). | The Secretariat (advisory & administrative). |
  | **The Task** | The Charge (specific indictment). | Government Bills (broad policy proposals). |
  | **The Input** | Evidence (strictly admissible, tested). | Testimony & Data (variable, expert-led). |
  | **The Output** | The Verdict (Guilty / Not Guilty). | The Decision (Pass / Reject / Amend). |
  | **The Check** | Appeal (Higher court review). | Rotation (Next year's draw). |
  | **The Selection** | *Voir Dire* (screened for bias/ignorance). | Stratification (screened for demographic mirror). |
  | **The Duration** | Ad hoc (disbands after verdict). | Continuous (staggered 3-year terms). |

  #### 2. Where the Mapping Fails

  The analogy breaks down in six specific areas. These are not merely details of scale; they are differences of kind.

  1.  **Framing of the Question:** A jury answers a question framed by others (*Did the defendant commit this act?*). Your chamber chooses its own business (*Which bills shall we examine?*).
  2.  **Instruction:** A jury is instructed on the law by a judge and bound by those directions. Your chamber is supported by a secretariat, but is 'free to decide', implying no binding procedural authority over their deliberations.
  3.  **Correction:** A jury's legal errors can be corrected on appeal; a perverse verdict can be quashed. Your chamber is corrected by nothing but the next draw. There is no higher legislative court.
  4.  **Ignorance vs. Competence:** Juries are deliberately selected for ignorance of the specific case to ensure impartiality. Your chamber must acquire expertise to assess complex policy, implying a need for learning that a jury is discouraged from undertaking.
  5.  **Continuity:** Juries disperse. They do not accumulate institutional memory, bias, or power. Your chamber sits continuously; members overlap, potentially forming factions or capturing the secretariat's influence over time.
  6.  **Representation:** A jury aims for impartiality towards a single defendant. Your chamber is stratified to mirror the population, aiming for descriptive representation of the whole polity.

  #### 3. Audit of the Failures: Which Matter?

  Your colleague uses the analogy to defeat objections regarding **competence** and **accountability**. We must judge the failures against those specific aims.

  *   **The 'Ignorance' Failure (Does not matter for competence):** The objection that laypeople lack expertise is met by the jury precedent. Juries comprehend complex forensic evidence with instruction. Therefore, the idea that citizens cannot *learn* enough to judge policy is weakened by the jury analogy. This part of the mapping holds.
  *   **The 'Framing' Failure (Matters critically):** This is the weakest link. A jury does not choose which crimes to prosecute; that would be chaotic. If your chamber chooses which bills to examine, it acquires a negative agenda-setting power that a jury never possesses. The jury analogy offers no defence against the charge that a random body might ignore vital legislation or obsess over trivia.
  *   **The 'Correction' Failure (Matters critically for accountability):** The jury is accountable to the law and the judge. If they pervert the course of justice, there are remedies. Your chamber has no appeal. If they pass a disastrous amendment, the only check is the next year's cohort inheriting the mess. The jury analogy falsely suggests a level of procedural safety that does not exist in your proposal.
  *   **The 'Continuity' Failure (Matters for political class):** Your colleague argues rotation prevents a political class. However, a staggered chamber with a permanent secretariat creates exactly the conditions for an *administrative* class to emerge. Juries disband too quickly for this; your chamber does not. The analogy hides this risk.

  #### 4. What the Picture Carries vs. What It Breaks

  **What the Jury Picture Still Carries:**
  *   **Competence of the Ordinary:** It successfully argues that high-stakes decision-making does not inherently require professional politicians. Ordinary cognitive capacity, when collective and deliberative, is sufficient for judgment.
  *   **Legitimacy without Mandate:** It demonstrates that democratic legitimacy can derive from fair selection and procedure rather than electoral consent.
  *   **Independence from Careerism:** It supports the claim that short, non-renewable terms (like a jury's service) insulate decision-makers from the need to curry favour for re-election.

  **What the Jury Picture Cannot Carry:**
  *   **Strategic Responsibility:** A jury decides a past act; a chamber shapes future rules. The jury analogy cannot justify the burden of *foresight* required for legislation.
  *   **Agenda Setting:** It cannot defend the power to choose which bills to examine. A jury that picked its own cases would be considered rogue.
  *   **Institutional Memory:** It cannot explain how a body learns from its mistakes without the continuity a jury explicitly lacks.

  #### 5. A Better Analogy: The Non-Executive Board

  If the jury is the wrong picture for a standing, agenda-setting chamber, the most accurate analogy is **The Non-Executive Board of a Public Trust.**

  In the corporate and public sectors, a Board of Directors governs an organisation without managing its daily operations. The Non-Executive Directors (NEDs) are often chosen for their independence and broader perspective, not necessarily for their operational expertise.

  **What this makes visible that the Jury does not:**

  1.  **Fiduciary Duty:** Unlike a jury, which owes a duty only to the verdict, a Board owes a continuing duty to the health of the organisation (the State). This captures the *forward-looking* responsibility of a second chamber.
  2.  **Oversight vs. Execution:** A Board does not run the company (the Government does that); it reviews strategy, audits risk, and holds management to account. This fits the 'revising' function of a second chamber better than the 'judging' function of a jury.
  3.  **Agenda Control:** Boards set their own meeting agendas to ensure critical risks are addressed. This validates your proposal's power to choose which bills to examine, framing it as *risk management* rather than *case selection*.
  4.  **Reliance on Secretariat:** A Board relies on a Company Secretary and executives for information. This makes visible the relationship between your sortition chamber and the permanent officials, highlighting the risk of administrative capture (which the jury analogy hides, as judges are not employees of the jury).
  5.  **Continuity and Staggering:** Boards often have staggered terms to ensure stability while refreshing membership. This aligns perfectly with your proposal and explains why continuity is a feature, not a bug, unlike in a jury.

  **Conclusion**
  Your colleague is correct that the jury proves ordinary people can deliberate competently without an electoral mandate. However, the jury is a tool for *justice*, not *governance*. By shifting the picture to a **Non-Executive Board**, you retain the legitimacy of the layperson but acknowledge the standing, strategic, and fiduciary nature of the role. It makes visible the true risk: not that the members are incompetent, but that without an electoral check or a judicial appeal, they are a Board of Directors with no shareholders to answer to. That is the accountability gap you must address.
