      *   *Key points:* Dennett is an eliminativist/revisionist. He doesn't "save" the folk concept of dreams; he revises it. Retroactive constitution is actually close to Dennett's view (Orwellian/Stalinesque distinction collapses). The host says Dennett rescues "real mental events," but Dennett might say the "event" is the report.
