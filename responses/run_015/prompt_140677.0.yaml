      *   *Doctrine:* Syādvāda (sevenfold predication) says statements are true relative to specific standpoints (naya). Error is ekānta (one-sidedness treated as absolute). It allows definite claims *within* a standpoint.
      *   *Bureaucracy:* Treats "non-absolutism" as "never commit." Treats "standpoint" as "opinion." Treats "inexpressible" as "I can't say." Uses it to avoid liability.
