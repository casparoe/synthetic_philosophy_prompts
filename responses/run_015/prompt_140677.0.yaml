  **OFFICE OF INSTITUTIONAL PLURALISM**
  **GUIDANCE MEMO 2024-09**
  **TO:** All Faculty and Staff
  **FROM:** Dr. Aris Thorne, Director of Compliance
  **SUBJECT:** Operationalizing Non-Absolutism in Official Communications (NOC-3)

  **1.0 POLICY OVERVIEW**

  Pursuant to Faculty Senate Ratification 44.B, all official university communications must adhere to the Non-Absolutism in Official Communications policy (NOC-3). The objective is to mitigate *ekānta* (the error of one-sidedness) by ensuring all assertions are standpoint-indexed. Staff must utilize *syāt* (in some respect) as a mandatory qualifier for all predicates. A *naya* (partial perspective) is permissible, provided it is not presented as the whole truth. Note that NOC-3 does not mandate skepticism; rather, it requires that determinate assertions be explicitly bounded by their contextual validity. Failure to acknowledge the multiplicity of standpoints constitutes a Level 2 Compliance Violation.

  **2.0 WORKED EXAMPLES**

  **2.1 Letters of Recommendation**
  Absolute endorsements violate NOC-3. A compliant letter must cycle through the seven modes of predication (*saptabhaṅgī*) regarding the candidate's competence.

  *Compliant Excerpt:*
  "Regarding Candidate Smith's suitability: (1) In some respect, Smith is qualified (syāt asti). (2) In some respect, Smith is not qualified (syāt nāsti). (3) In some respect, Smith is both qualified and not qualified (syāt asti ca nāsti ca). (4) In some respect, Smith's qualification is inexpressible (syāt avaktavyaḥ). (5-7) In some respect, Smith is qualified and inexpressible; not qualified and inexpressible; and qualified, not qualified, and inexpressible. Therefore, from the standpoint of the Department of History, we recommend Smith, while acknowledging this recommendation holds only within this specific naya."

  **2.2 Search Committee Rankings**
  Ranking candidates implies an absolute hierarchy, which is prohibited. Committees must submit a "Standpoint-Relative Matrix."

  *Compliant Excerpt:*
  "Candidate A is preferred to Candidate B from the standpoint of research output. Candidate B is preferred to Candidate A from the standpoint of teaching availability. To assert A is universally superior to B is *ekānta*. Consequently, the Committee cannot submit a singular ranking. We submit three candidates as equally non-absolute. Hiring decisions should be made by rolling a die to avoid privileging one *naya* over another without sufficient cause."

  **2.3 External Audit Responses**
  Auditors often request binary (Yes/No) data. These must be converted to sevenfold compliant statements.

  *Auditor Query:* "Is the FY24 budget balanced?"
  *Compliant Response:* "Syāt, the budget is balanced (from the standpoint of cash flow). Syāt, the budget is not balanced (from the standpoint of accrued liabilities). Syāt, the status is inexpressible (due to pending litigation). To assert 'Yes' without qualification misrepresents the complex reality of fiscal standpoints. Please accept this sevenfold clarification in lieu of a signature."

  **3.0 COMPLIANCE AND CERTIFICATION**

  All staff must certify that their communications adhere to NOC-3. However, staff must also recognize that this Guidance Memo itself is subject to NOC-3. This document is not absolutely true; it is true only in some respect (syāt). Therefore, adherence is mandatory only from the standpoint of Institutional Pluralism. From other standpoints, adherence may be unnecessary, inexpressible, or both.

  Please sign the attached Compliance Form below. Note that signing certifies that you have read this document and will adhere to it without exception.

  **[ ] I certify that I will absolutely follow these non-absolute guidelines.**
  **[ ] I certify that I will follow these guidelines only in some respect.**
  **[ ] I certify that following these guidelines is inexpressible.**

  *Warning: Selecting any single checkbox above may constitute an act of one-sidedness. If you select all three, the form cannot be processed by our scanning software. If you select none, you are non-compliant. Please consult with Legal before signing.*

  **END OF MEMO**
