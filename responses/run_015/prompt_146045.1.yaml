  7.  **Final Polish:** Ensure the distinction between *psychological explanation* and *metaphysical justification* is clear. This is the crux of why the user's framing is problematic from a Bradleyan perspective. (Bradley famously distinguishes between "how we come to think" and "what makes the thought true/real").

