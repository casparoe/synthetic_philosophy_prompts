answer: |-
  # The Hinge Procedure: A 3-Step Checklist for Co-op Disputes

  **Purpose:** To distinguish between **Moves** (disputes within the rules that we can solve) and **Hinges** (disputes about the rules themselves that stop the game from working).
  **Time:** 5 minutes to run the checklist, 15 minutes to decide.
  **Rule:** If **ANY** check results in a "NO," the doubt is treated as a **Hinge**. The board does not investigate it; it is treated as settled for the sake of proceeding. If **ALL** checks are "YES," the doubt is a **Move**. The board investigates it.

  ---

  ### The Checklist

  **Check 1: The Operational Test**
  *Question:* If we assume this doubt might be true, can we still hold *this* hearing to resolve it?
  *   **YES:** The hearing can proceed regardless of the outcome. (e.g., "The minutes are wrong" → We can meet to fix them.)
  *   **NO:** Accepting the doubt makes this hearing impossible or void. (e.g., "This board is illegal" → Then this hearing is also illegal.)
  *   *Score:* **NO = BLOCK (Hinge)**

  **Check 2: The Evidence Test**
  *Question:* Is the proof required to settle this contained entirely within our accepted records (bylaws, past minutes, logs)?
  *   **YES:** We can check our own files without needing outside validation of the files themselves.
  *   **NO:** Proving this requires validating the records themselves or appealing to outside authority (courts, philosophy).
  *   *Score:* **NO = BLOCK (Hinge)**

  **Check 3: The Remedy Test**
  *Question:* If the member is right, do our current rules provide a specific step to fix it without dissolving the co-op?
  *   **YES:** There is a procedure (e.g., "vote to amend," "issue fine," "reopen vote").
  *   **NO:** Fixing it requires starting over, voiding all past decisions, or creating new authority.
  *   *Score:* **NO = BLOCK (Hinge)**

  **Final Decision:**
  *   **All YES:** Investigate the claim. (Frame-Internal)
  *   **Any NO:** Table the claim as non-justiciable. (Frame-Breaking)

  ---

  ### Application to Cases

  #### Case 1: "The March Minutes Were Forged"
  *   **Check 1 (Operational):** Can we meet to discuss forgery? **YES.** We are here now.
  *   **Check 2 (Evidence):** Can we check signatures against attendance sheets we have? **YES.** The evidence is internal.
  *   **Check 3 (Remedy):** If forged, can we vote to correct them? **YES.** The bylaws allow minute corrections.
  *   **Result:** **ALL YES → GO THROUGH.**
  *   *Why:* This is a move within the game. Doubting the accuracy of a specific record does not destroy the record-keeping system itself.

  #### Case 2: "This Board Has No Legal Authority"
  *   **Check 1 (Operational):** If true, can we hold this hearing? **NO.** If the board is illegal, this hearing is void.
  *   **Check 2 (Evidence):** Is proof in our records? **NO.** Legal authority comes from state law, not our minutes.
  *   **Check 3 (Remedy):** Is there a bylaw fix? **NO.** You cannot bylaw your way out of illegal status.
  *   **Result:** **ALL NO → BLOCK.**
  *   *Why:* This is a hinge. Accepting this doubt collapses the practice. You cannot use the board to decide if the board exists.

  #### Case 3: The Middle Case — "The Bylaws Were Never Properly Ratified 10 Years Ago"
  *   **Check 1 (Operational):** If true, do we have rules to govern this hearing? **NO.** Without ratified bylaws, this procedure has no ground.
  *   **Check 2 (Evidence):** Can we prove ratification from current records? **NO.** The claim is that the records themselves are invalid.
  *   **Check 3 (Remedy):** Is there a fix? **NO.** If true, we aren't fixing a rule; we are re-founding the co-op.
  *   **Procedure Result:** **BLOCK.**
  *   **Your Intuition:** **GO THROUGH.**
  *   **Why the Conflict:** Your intuition says this is a *factual* claim (either they were ratified or not). The procedure says this is a *hinge* (if we doubt this, nothing else stands).
  *   **The Lesson:** The procedure prioritizes **stability** over **historical truth**. If you let this through, you risk invalidating every decision made in 10 years (rent hikes, evictions, repairs). The procedure blocks it to prevent systemic collapse. You should only override this if you are prepared to dissolve the current board and form a new one.

  ---

  ### Where Human Judgment Is Required

  This checklist cannot run itself. Board members must exercise judgment in three spots:

  1.  **Defining "Accepted Records" (Check 2):** You must decide what counts as "internal." Is an email chain internal? Is a verbal agreement internal? The board must agree on what counts as evidence before using the checklist.
  2.  **Assessing "Collapse" (Check 1 & 3):** How much instability is too much? Correcting one minute is fine. Correcting *every* minute for five years might be a "collapse." You must judge the scope of the damage.
  3.  **The Override:** As seen in Case 3, sometimes a hinge is actually a lie that needs exposing. The board must decide if stability is worth protecting a potential fraud. The checklist advises "Block," but humans can vote to "Dissolve and Restart" instead.

  ### What This Cannot Handle

  Do not use this procedure for the following. It will fail, and it should.

  *   **Radical Skepticism:** If a member claims "We are in a simulation," "The past doesn't exist," or "Language has no meaning," the checklist will block them (Correctly). Do not engage. These are not co-op disputes; they are philosophical dead-ends.
  *   **Moral Claims Outside Rules:** If a member says "This rule is evil," the checklist blocks it. The board enforces rules, not morality. Unless the bylaws have a moral clause, this is a hinge (the rules stand fast).
  *   **External Legal Truths:** If a member proves in court that the co-op is illegal, this procedure is void. This tool works only so long as the "game" is generally accepted as valid by the outside world.

  **Final Note:** The goal of this procedure is not to find absolute truth. It is to keep the co-op functioning. Hinges are not "true" because they are proven; they are "true" because without them, there is no board to prove anything.
