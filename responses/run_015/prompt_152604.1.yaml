answer: |-
  Reject step (4) because the Ex Ante Pareto principle is incompatible with Ex Post Prioritarianism, and maintaining the priority weighting on final outcomes is the defining feature of the view.

  The tension you've identified is a known impossibility result: you cannot simultaneously hold Ex Post Prioritarianism (applying the concave function to final welfare states) and the Ex Ante Pareto principle (ranking prospects solely by individual expected welfare). Step (4) asserts the latter as a natural extension of (1), but this conflates individual rationality with social betterness. While expected utility may define what is rational for an individual to choose, it does not necessarily constrain social evaluation when the moral view assigns intrinsic weight to the distribution of final states rather than probabilistic claims.

  Rejecting (4) does not undermine (1) because the No-Levelling-Down objection targets *actual* welfare losses in outcomes, whereas (4) governs *expected* welfare in prospects. The moral force of prioritarianism lies in mitigating the severity of actual bad outcomes, not in maximizing the value of risk profiles; thus, you can maintain that leveling down actual outcomes is never an improvement (preserving your objection to egalitarianism) while denying that a prospect benefiting everyone in expectation must be socially preferred when it risks severe deprivation for some.

  The cost of this move is violating the Ex Ante Pareto principle, which is intuitively powerful since everyone prefers Q in your case. However, prioritarianism accepts this cost to preserve the "separateness of persons" intuition: society should not treat risk pooling as a justification for allowing some to end up desperately badly off when a safer, more equal distribution is available. This sacrifice is precisely what distinguishes prioritarianism from utilitarianism; if you accept (4), step (7) is correct and you are indeed forced into utilitarianism via Harsanyi's aggregation theorem. By rejecting (4), you block the derivation of utilitarianism and preserve the view's core motivation.

  The only alternative exit is to modify (3) into Ex Ante Prioritarianism (applying the concave function to expected welfare), which satisfies (4) but validates your worry that it ignores the moral significance of final-state inequality and brute luck. Since your goal is to prioritize the actually worse-off rather than those with lower expectations, retaining (3) and rejecting (4) is the standard and theoretically consistent position for a prioritarian.
