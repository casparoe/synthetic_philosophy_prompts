      *   It's not just lack of explicit knowledge (experts act without articulation).
      *   It's not just behavioral variability (addicts vary behavior to serve fixed compulsion).
      *   It's about *appropriate* responsiveness to context changes regarding the *point* of the action, without getting stuck in loops or ignoring false presuppositions.
