answer: |-
  A workable diagnostic for sphexishness must define the failure as an inability to update the action-frame when evidence falsifies its presuppositions, rather than as behavioral rigidity or repertoire size, requiring means-ends decoupling as the primary non-negotiable criterion.

  ### Desiderata for a Diagnostic Theory of Sphexishness

  1.  **Means-Ends Decoupling**
      *   **Requirement:** The system must demonstrate the capacity to substitute means when blocked, unless constrained by a higher-order rule that persists under counterfactual probing.
      *   **Motivation:** Distinguishes the **resourceful addict** (plastic means, fixed pathological end) from the **wasp** (fixed means, fixed end) and the **promise-keeper** (fixed end, rigid means by choice). The addict passes behavioral variability tests but fails because the end cannot be questioned; the wasp fails because the means cannot be altered; the promise-keeper passes because the constraint is reason-responsive.
      *   **Status:** **Non-negotiable.** Without this, you cannot separate compulsion from principle or sphexishness from resourcefulness.

  2.  **Frame-Update Sensitivity (Presupposition Monitoring)**
      *   **Requirement:** The system must detect when the contextual prerequisites for a routine are false and halt or reframe rather than execute.
      *   **Motivation:** Captures the **current language model** (answers false-presupposition questions fluently) and the **wasp** (assumes prey is where left) while excluding the **thermostat** (no frame to update, only state). The thermostat is rigid but not sphexish because it makes no claims about the world beyond its sensor loop; the LLM is sphexish because it asserts a frame it hasn't verified.
      *   **Status:** **Non-negotiable.** This is the specific failure mode of modern autonomy stacks that pass behavioral tests but fail semantic grounding.

  3.  **Nested Rigidity Acceptance**
      *   **Requirement:** The theory must permit rigid sub-routines provided they are governed by a flexible higher-order controller that can override them.
      *   **Motivation:** Accounts for the **thermostat** (rigid loop within a flexible building system) and the **game-playing program** (book-rigid opening within a search-flexible strategy). Infinite flexibility is unsatisfiable; the buck must stop somewhere without counting as sphexishness.
      *   **Status:** **Non-negotiable.** Prevents false positives on efficient, modular designs.

  4.  **Anti-Monotonicity of Flexibility**
      *   **Requirement:** Increased optionality or deliberation depth must not be scored as improvement if it degrades performance under time pressure or specific context.
      *   **Motivation:** Captures the **skilled performer choking** (reverting to explicit control breaks flow) and **akrasia/dithering**. More reasoning paths can lead to paralysis or regression to brittle explicit rules.
      *   **Status:** **Preference of the Performance Camp.** (Engineering safety may prefer rigid fail-safes over flexible choking, but the theory must recognize the degradation).

  5.  **Resumability vs. Safe Restart**
      *   **Requirement:** The system need not resume exactly at the point of interruption, provided it does not reset to step one blindly if step one is now contraindicated.
      *   **Motivation:** The **wasp** fails because it resets to "inspect burrow" indefinitely. The **unarticulating expert** may restart a sequence cleanly without being sphexish. Demanding exact resumability penalizes safe recovery strategies.
      *   **Status:** **Preference of the Robustness Camp.** (Resumability is elegant, but safe restart is acceptable).

  ### Unsettled Distinctions and Constraints

  **1. Distinctions to Respect vs. Collapse**
  You must respect the **Mechanism-Environment Pair** distinction: sphexishness is not a property of the code alone but of the code in the world where the prey moves. A system is not sphexish in a static world. You must also respect **Grading over Binary**: systems exhibit degrees of frame-fragility. However, you may collapse **Behavior vs. Mechanism** for the purpose of the diagnostic *provided* the behavioral tests are interventional (probing counterfactuals) rather than observational. You cannot see the mechanism, but you can stress-test its boundaries to infer its structure.

  **2. Incompatible Desiderata**
  The requirement that the system be **"assessable from the outside, on behavior and intervention response alone"** cannot be jointly satisfied with **"distinguishes principled steadfastness from compulsion"** without residual error. The **promise-keeper** and the **compulsive checker** may behave identically under all finite interventions. The promise-keeper holds a principle that survives counterfactual removal of social pressure; the compulsive checker holds a compulsion that survives counterfactual knowledge of pointlessness. Without access to internal history or articulation (which the **unarticulating expert** lacks), a black-box reviewer cannot perfectly distinguish them. The diagnostic must therefore prioritize **safety over fairness**: treat unexplained rigidity under counterfactual reason-probing as sphexishness until proven otherwise, accepting false positives on principled agents to catch compulsive ones.

  **3. The Single Most Exclusionary Requirement**
  The **Frame-Update Sensitivity** requirement does the most work.
  *   **Why it survives:** It kills the **LLM** (large repertoire, fails false presuppositions), the **Wasp** (fails environmental update), and the **Frontal-damage patient** (utilization behavior ignores context). It spares the **Thermostat** (no frame claimed) and the **Expert** (updates frame implicitly).
  *   **Why others fail:** **Resumability** fails the **Expert** (who might restart). **Means-Reindexing** fails the **Addict** (who reindexes means successfully). **Behavioral Variability** fails the **Addict** and **LLM**. **Black-box Mechanism** fails the **Reviewer constraint**.
  *   **Verdict:** Frame sensitivity is the only criterion that targets the *semantic* failure rather than the *syntactic* or *behavioral* one. It leaves standing a diagnostic based on **Interventional Reason-Tracking**: can the system halt when the "why" of its action is removed, even if the "how" remains possible?

  ### Scorecard for Candidate Accounts

  *   **Intervention-Sensitivity:** Necessary but insufficient; passes the Addict and LLM who respond to prompts but not reasons.
  *   **Explicit Goal Representation:** Fails the Unarticulating Expert and LLM; requires articulation that skilled performance often bypasses.
  *   **Reasons-Responsiveness (History/Counterfactual):** Best fit; captures the Promise-Keeper vs. Compulsive Checker distinction in principle, though difficult to verify in black-box settings.
