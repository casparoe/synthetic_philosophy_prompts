answer: |-
  The strong epistemic defense collapses because real-world voters violate the independence and competence assumptions so severely that the theorem's convergence guarantees vanish, rendering it applicable only to engineered scenarios rather than actual democracy.

  The two conditions that sink the theorem are correlated voting and average competence below 0.5. The Condorcet Jury Theorem (CJT) relies on errors canceling out, but if voters share a common source of misinformation (media ecosystems, party platforms), their errors correlate rather than cancel. Formal results by Krishna Ladha (1992) demonstrate that even small amounts of correlation prevent the probability of a correct majority from converging to 1, regardless of group size. Simultaneously, if the average voter competence is below 0.5—which Bryan Caplan's *The Myth of the Rational Voter* argues is true for economic policy due to systematic biases rather than random noise—the theorem inverts: adding more voters guarantees the *wrong* outcome with near certainty. This is not just theoretical; in the 2016 Brexit referendum, post-hoc analysis showed significant portions of the majority voted on false premises regarding funding and immigration that experts had corrected, suggesting competence on the factual claims was effectively <0.5 despite the democratic mandate.

  Your chatbot example specifically fails the independence test. Running 51 copies of the same model with the same weights and training data produces a correlation of 1.0; you are not aggregating 51 independent judgments, you are repeating one judgment 51 times. In machine learning, ensemble methods like bagging or boosting work only because they introduce randomness in training data or model architecture to force independence. Without that, the "majority vote" of identical models provides zero epistemic gain over a single run, mirroring how voters exposed to the same propaganda network vote as a bloc rather than as independent calculators.

  Lab-style voter data provides the most uncomfortable empirical challenges. Experiments on information cascades show that individuals often ignore private signals to follow early voters, violating independence dynamically. Cass Sunstein's work on group polarization demonstrates that deliberation often drives groups toward more extreme positions rather than accurate centroids, contradicting the idea that mixing views naturally purifies error. Furthermore, field experiments on voter knowledge consistently show that when asked factual questions underlying their preferences (e.g., "What is the current unemployment rate?"), voters perform near random chance, yet vote with high confidence. If competence is random (p=0.5), the theorem offers no advantage over a coin flip; if it is systematically biased (p<0.5), democracy becomes a truth-inverting machine.

  There are uncomfortable philosophical constraints that limit the theorem's scope even if math holds. CJT requires a binary choice with an objective truth value, but most political decisions are trade-offs between competing values (e.g., liberty vs. security) where no "correct" answer exists independently of the vote itself. Additionally, the theorem assumes a common interest—that everyone wants the same "correct" outcome—but in distributive politics, one faction's gain is another's loss, making the vote a conflict of interest rather than a search for truth. Proponents like Christian List and Philip Pettit admit that CJT applies best to jury trials or technical committees, not broad ideological elections, because only the former approximate the required common interest and factual binary.

  This epistemic view makes risky predictions that a procedural defense does not. A proceduralist argues democracy is legitimate because everyone had a say; an epistemicist argues it is legitimate because it produces *right* answers. Therefore, the epistemic view predicts that expanding the electorate should improve decision quality ceteris paribus, whereas proceduralism only predicts increased legitimacy. If data shows larger electorates make worse decisions due to information dilution (as some studies on ballot propositions suggest), the epistemic defense is falsified while the procedural one survives. The epistemic view also implies that excluding incompetent voters would improve outcomes, a prediction proceduralists reject as illegitimate regardless of accuracy.

  Finally, enforcing the theorem's assumptions to save it leads to trivialization. If you require proof of independence, you must segregate voters from shared media and social networks; if you require proof of competence, you must test voters before allowing them to cast ballots. These fixes transform the defense from one of universal democracy into a defense of epistocracy (rule by the knowledgeable). Most CJT defenders, including David Estlund, acknowledge this tension: to make the theorem work, you must restrict the "demos" so heavily that it no longer justifies the inclusive democratic institutions we actually have. Consequently, the theorem either describes real democracies poorly (because assumptions fail) or describes ideal epistocracies well (which we do not practice), leaving it without a robust application to actual political systems.
