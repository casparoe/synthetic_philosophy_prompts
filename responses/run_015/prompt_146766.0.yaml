      *   *Distinction 2 (vs. Bargaining):* Exchanging normative commitments via institutional design, not just preferences/resources.
      *   *Example:* Preservationist (intrinsic value) + Market (substitutable value) $\rightarrow$ Cap-and-Trade. Preservationist gets cap (deontological constraint); Market gets trading (efficiency).

  3.  **Audit Point 1: Distinction from Rawlsian Overlapping Consensus (OC):**
      *   *Rawls's OC:* Different comprehensive doctrines agree on a political conception of justice *for their own reasons*. There is a module shared in the public sphere.
      *   *Friend's Claim:* "No shared public reason... only a stable equilibrium."
      *   *Critique:* The friend is slightly too sharp here. In OC, the *conclusion* is shared, but the *justifications* differ. In the Compromise View, even the conclusion might be justified differently, but the *institution* functions as a modus vivendi that hardens into something more stable. However, the friend claims "no shared public reason." In OC, the *political conception* is the shared reason. In the Compromise View, the *institution itself* is the shared object, but the *reason* for supporting it remains divergent.
      *   *Nuance:* The friend understates "mutual recognition." In OC, there's a moral commitment to the fairness of the terms. In the Compromise View, is there moral recognition, or just strategic acquiescence? The summary says "normative constraints become... strategic incentives." This suggests a *Modus Vivendi* rather than OC.
      *   *Verdict:* The distinction is mostly fair but risks conflating "shared justification" with "shared object." The key difference is stability source: moral commitment to fairness (Rawls) vs. mutual benefit from constraint (Compromise). The summary is accurate in saying there's no *shared axiological ground*, but might overstate the lack of *shared political object*.

  4.  **Audit Point 2: The Carbon Market Example (Smuggling Consequentialism?):**
      *   *The Setup:* Preservationist accepts cap-and-trade.
      *   *The Friend's Claim:* Preservationist accepts it because the cap is a deontological side-constraint.
      *   *The Critique:* Why does the Preservationist accept the *trade* part? If nature has *intrinsic* worth, commodifying it might be inherently wrong, regardless of the cap. If they accept the trade *only* because the cap prevents collapse (consequentialist outcome), then they *are* using consequentialist reasoning to justify the compromise.
      *   *Deep Dive:* If the Preservationist says, "I hate the trade, but the cap saves the world," they are prioritizing the *outcome* (survival) over the *means* (non-commodification). This looks like a consequentialist override of a deontological rule.
      *   *Alternative:* If the Preservationist says, "The cap legally enshrines the limit, which acknowledges the boundary," that's more deontological. But the *gain* is defined as "structural protection."
      *   *Verdict:* The friend's summary is vulnerable here. To say the Preservationist is "better off" usually implies a comparison of states of affairs (consequentialism). If the Preservationist truly holds non-negotiable intrinsic worth, participating in a market might be a moral sin, even with a cap. The "gain" must be framed carefully: not "more value achieved" but "less violation incurred." The summary risks smuggling in a meta-consequentialist metric to measure the "gain."

  5.  **Audit Point 3: Does the Core Claim Hold?**
      *   *Claim:* Incompatible systems $\rightarrow$ mutual normative improvement without convergence.
      *   *Risk:* If the "gain" is measured consequentially, it collapses into consequentialism. If the "agreement" is based on shared political values, it collapses into Rawls.
      *   *Defense:* It holds if we view institutions as *mediators* that translate values into compatible mechanisms without requiring the agents to change their internal axioms. It's a "functional equivalence" rather than "axiological agreement."
      *   *Condition:* It requires that the institution allows each side to claim they upheld their duty, even if the mechanism looks different to the other side.
      *   *Verdict:* It holds, but only if "improvement" is defined internally to each framework, not by an external metric. The summary hints at this ("secures more of what it genuinely values") but needs to be stricter about incommensurability.

  6.  **Audit Point 4: The Torture Case (Application):**
      *   *Scenario:* Deontological prohibition (No Torture) vs. Security Framework (Ticking Time Bomb/Utilitarian).
      *   *Applying the Compromise View:* Can we design an institution where both gain without converging?
