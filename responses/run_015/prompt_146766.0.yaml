      *   **Section 1: Rawls & Shared Reasons.** The summary describes a *Modus Vivendi* with teeth, not OC. OC requires moral commitment to the *terms*. This view relies on strategic interdependence. The distinction is fair but the stability claim is the weak point.
      *   **Section 2: The Carbon Smuggle.** This is the strongest critique. If the Preservationist accepts the market *to prevent collapse*, they are weighing outcomes. This is consequentialist. To save the view, the "gain" must be defined as "institutionalizing the constraint," not "preventing collapse."
      *   **Section 3: Core Claim Viability.** It holds if we accept "functional equivalence." It collapses if we demand axiological agreement. It's a pragmatic middle ground.
