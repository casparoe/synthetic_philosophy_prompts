      *   **Specific Needs:** A concrete *procedure* (algorithm/checklist), not an essay. Needs to address:
          *   Order of questions/pass-fail criteria.
          *   Unit of aggregation (person, trip, time?).
          *   Treatment of sub-threshold burdens (unnoticeable impacts).
          *   Distribution of burdens (same people vs. spread out).
          *   Risk/Probability (certain harm to few vs. probabilistic harm to many).
          *   Handling uncertainty/missing data.
          *   Identification of value judgments disguised as math.
          *   Identification of cases the procedure *cannot* settle (escalation points).
      *   **Test Cases:**
          1.  Fare rounding (3 cents x 90M rides).
