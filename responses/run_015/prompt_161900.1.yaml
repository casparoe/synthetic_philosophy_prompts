      *Ready to write.*
answer: |-
  Here is a concrete procedure designed for your constraints: no specialized training, public defensibility, and a hard stop on the "dust specks vs. torture" deadlock.

  This is the **Transit Distributional Protocol (TDP)**. It is designed to be run in a spreadsheet or on a single sheet of paper. It separates *Fiscal Impacts* (money to the agency) from *Welfare Impacts* (time/comfort/access to people).

  ### Part 1: The Procedure

  **Step 1: The Severity Screen (Pass/Fail)**
  Before summing anything, categorize every negative impact into one of three tiers.
  *   **Tier 1 (Critical):** Loss of essential access (e.g., no alternative to reach medical care/work), safety risks, or costs >5% of daily income for low-income riders.
  *   **Tier 2 (Noticeable):** Delays >5 minutes, fare increases >$0.50, extra walking >0.25 miles.
  *   **Tier 3 (Trivial):** Delays <2 minutes, fare changes <$0.10, walking <0.1 miles.
  *   **Rule:** If *any* Tier 1 burden exists, the proposal **cannot be approved by the Panel**. It must be escalated to the Board with a "Critical Burden" flag. You do not sum Tier 3s to override a Tier 1.
  *   **Why:** This solves the torture-vs-specks deadlock by establishing a rights-based floor. Arithmetic does not apply across tiers.

  **Step 2: The Unit of Aggregation**
  *   **Rule:** Aggregate by **Person-Per-Day**, not per trip or per lifetime.
  *   **Reasoning:** Per-trip inflates delays for frequent riders; per-lifetime dilutes them too much. Person-Per-Day captures the actual daily experience.
  *   **Calculation:** If a rider takes 4 trips a day with a 90-second delay, their burden is 6 minutes/day, not 90 seconds. If they take the trip once a year, their burden is ~0.004 minutes/day (round to zero).

  **Step 3: Sub-Threshold Handling (The "Noticeability" Rule)**
  *   **Rule:**
      *   **Money:** Always count. A 3-cent loss is a property transfer, even if unnoticed.
      *   **Time/Comfort:** Apply a **Perception Threshold**. If the delay/change is <30 seconds or physically imperceptible (e.g., platform move <20 feet), count as **Zero** for welfare analysis.
      *   **Risk:** Count Expected Value (Probability × Impact) for safety stats. For livelihood/access, count the **Worst Case** for identifiable groups.
  *   **Why:** This prevents "phantom minutes" from cluttering the ledger while preserving the principle that financial loss is real regardless of perception.

  **Step 4: Concentration vs. Diffusion**
  *   **Rule:** Apply a **Repetition Multiplier**.
      *   If the burden hits the same person >20 times/month: Multiply the welfare weight by **1.5** (frustration compounds).
      *   If the burden is spread across different people randomly: Weight = **1.0**.
  *   **Why:** A 90-second delay every day is psychologically heavier than a 90-second delay once a year, even if total time is identical.

  **Step 5: Uncertainty Bounds**
  *   **Rule:** Do not use point estimates. Use **Conservative Bounds**.
      *   For Benefits: Use the *Lower Bound* estimate.
      *   For Burdens: Use the *Upper Bound* estimate.
      *   **Decision:** If the Lower Bound Benefit > Upper Bound Burden, proceed. If they overlap, **Escalate**.
  *   **Why:** This prevents "optimism bias" in agency projections from masking real harms.

  ---

  ### Part 2: Specific Rules for Your Questions

  1.  **Questions in Order:** See Step 1 through Step 5 above.
      *   *Where it returns a No:* Any Tier 1 burden identified in Step 1.
      *   *Where it hands to a person:* Any overlap in Step 5 (Uncertainty) or any trade-off between Tier 2 and Tier 3 that requires valuing time vs. money.

  2.  **Unit of Aggregation:** **Person-Per-Day**.
      *   *Reason:* 90 seconds × 400,000 trips is misleading if those trips are made by 200,000 people (round trip). It is 3 minutes per person. That is the actual human experience.

  3.  **Burdens Below Threshold:**
      *   **Money:** Contribute expected value (sum them).
      *   **Time/Physical:** Contribute **nothing** if below perception threshold (30 secs / 20 feet).
      *   **Value Call:** You must state this explicitly. *"Panel policy treats sub-perceptual time delays as non-burdens to avoid mathematical inflation of trivialities."*

  4.  **Repeated vs. Spread Burdens:**
      *   **Yes, it matters.** Use the Repetition Multiplier (Step 4). A fare hike hits daily commuters 40+ times a month; a platform move happens once per trip. The fare hike carries higher welfare weight per dollar.

  5.  **Certain Harm (5 people) vs. Probabilistic Harm (5M people):**
      *   **Rule:** If the 5 people are **identifiable** (e.g., specific residents, specific workers), treat as **Tier 1 (Critical)**. If the 5M are statistical (e.g., accident risk), use **Expected Value**.
      *   **Defensibility:** Public documents can defend protecting identified vulnerable populations over statistical aggregates. This is standard in environmental justice reviews.

  6.  **Missing Numbers:**
      *   **Rule:** Use **Proxy Bounds**. If you don't have a count, use the lowest plausible density × area, or the highest plausible delay × trips.
      *   **Reasoning:** If the *most conservative* estimate of harm still triggers a Tier 1 flag, you don't need precise data to reject/escalate.

  ---

  ### Part 3: Running the Cases

  Here is how the TDP processes your three deadlocked cases.

  #### Case 1: Fare Rounding (3 cents × 90M rides)
  *   **Step 1 (Severity):** Tier 3 (Trivial). $0.03 is < $0.10 threshold.
  *   **Step 2 (Aggregation):** 90M rides / ~250 work days / ~400k daily riders ≈ 1 ride/person/day. Burden = $0.03/person/day.
  *   **Step 3 (Threshold):** Money counts. Total = $2.7M/year.
  *   **Step 4 (Concentration):** Hits daily commuters. Multiplier 1.5x.
  *   **Step 5 (Uncertainty):** Numbers are precise.
  *   **TDP Verdict:** **Tier 3 Burden.**
  *   **Analysis:** While the aggregate ($2.7M) is large, the *per-person severity* is Tier 3. Under Step 1, Tier 3 cannot override Tier 1, but it can be weighed against Fiscal Benefit.
  *   **The "Sinking Feeling":** You worried this would come out as the "biggest item." In *dollars*, it is. In *human welfare*, it is low severity.
  *   **Recommendation:** Approve, but note in the public packet: *"While aggregate revenue is significant, individual burden is below noticeability threshold for time/comfort, though financially cumulative. Panel classifies as Low Severity."*

  #### Case 2: Station Consolidation (12 Elderly + 1.2 Miles)
  *   **Step 1 (Severity):** Tier 1 (Critical). 1.2 miles is > 0.25 miles. For elderly with no alternative, this is "Loss of Essential Access."
  *   **Step 2 (Aggregation):** 12 people × 2 trips/day = 24 person-trips.
  *   **Step 3 (Threshold):** Noticeable.
  *   **Step 4 (Concentration):** High repetition.
  *   **Step 5 (Uncertainty):** "No alternative" is a binary claim. Verify it. If true, it holds.
  *   **TDP Verdict:** **Escalate to Board.**
  *   **Reason:** Step 1 Veto. You cannot sum the $600k savings to override a Tier 1 burden at the Panel level. The Board must decide if $600k is worth stranding 12 people.
  *   **Public Wording:** *"Panel identifies Critical Burden on vulnerable population. Fiscal savings do not automatically offset loss of essential access. Decision requires Board value judgment."*

  #### Case 3: Scheduling Change (90 secs × 400k trips vs. 8 Workers)
  *   **Step 1 (Severity):**
      *   Riders: Tier 3 (90 seconds < 2 minutes).
      *   Workers: Tier 1 (2am shift is a health/safety risk; removing it is a benefit, but if the change *imposes* a bad shift, it's Tier 1. Here it *removes* a miserable shift).
      *   *Correction:* The proposal *gets workers off* the shift. That is a Tier 1 **Benefit**. The rider delay is a Tier 3 **Burden**.
  *   **Step 2 (Aggregation):**
      *   Riders: 400k trips × 1.5 mins = 600k minutes (10,000 hours).
      *   Workers: 8 people × 8 hours/night relief = 64 hours/day of quality of life.
  *   **Step 3 (Threshold):** Rider delay is perceptible (90 secs). Counts.
  *   **Step 4 (Concentration):** Riders are diffuse. Workers are concentrated.
  *   **Step 5 (Uncertainty):** Rider delay is certain. Worker benefit is certain.
  *   **TDP Verdict:** **Escalate to Board.**
  *   **Reason:** This is a **Cross-Tier Trade-off**. You are trading Tier 3 Rider Burdens for Tier 1 Worker Benefits.
      *   *Math:* 10,000 hours (Rider Loss) > 64 hours (Worker Gain).
      *   *Ethics:* Tier 1 (Health/Safety) > Tier 3 (Inconvenience).
      *   The math says "Reject" (too much rider time lost). The ethics say "Approve" (protect workers from misery).
      *   **This is the exact deadlock you described.** The procedure identifies it as a **Value Conflict**, not a math problem.
  *   **Public Wording:** *"Proposal trades aggregate rider time (10,000 hours/day) for critical worker quality-of-life improvement. Panel cannot weigh health benefits against time costs without Board policy direction on labor welfare weighting."*

  ---

  ### Part 4: Where You Are Smuggling Values (The "Black Box" Warning)

  You asked to be straight about where judgment is dressed as arithmetic. Put this in your internal memo, and summarize it in the public packet as "Panel Assumptions."

  1.  **The Tier 1 Veto:** This is a **Rights-Based Value**, not math. You are deciding that 12 people's access is *incommensurable* with $600k. A strict utilitarian would say you are wrong. You are choosing Prioritarianism (help the worst off) over Utilitarianism (maximize total welfare).
      *   *Defense:* "Transit is a public service, not a market. Essential access is a right, not a commodity."

  2.  **The Perception Threshold:** Deciding that <30 seconds counts as "Zero" is a **Value Choice**. To an economist, 1 second is 1 second. To a human, 1 second is noise.
      *   *Defense:* "Policy focuses on material changes to daily life, not theoretical microseconds."

  3.  **Money vs. Time:** In Case 1, you are treating $2.7M as "Revenue" but in Case 3, you are treating 10,000 hours as "Burden." You are not converting them to a common unit (Value of Time).
      *   *Defense:* "Revenue supports system stability; time loss reduces individual welfare. They are tracked separately to prevent monetizing rider time."

  4.  **Identifiable vs. Statistical:** Treating the 12 elderly (Case 2) differently than 5 statistical fatalities (Case 5 in your prompt) is the **Identifiable Victim Effect**.
      *   *Defense:* "Accountability requires us to address known harms to known constituents."

  ### Part 5: Summary of Recommendations

  1.  **Adopt the Tiered Screen.** It stops the "dust specks" from drowning out the "torture" by forbidding the addition across categories.
  2.  **Case 1 (Fare):** Approve. It's Tier 3. The aggregate dollar amount is real, but the human severity is low.
  3.  **Case 2 (Station):** Escalate. It's Tier 1. Do not let the $600k math hide the human cost.
  4.  **Case 3 (Schedule):** Escalate. It is a Value Trade-off (Worker Health vs. Rider Time). The math favors riders; the ethics favor workers. Let the Board vote on the value, not the analysts vote on the math.

  **Final Note on the "Sinking Feeling":**
  You are right to worry about Case 1. If you convert everything to dollars (using Federal Value of Time), the 90-second delays (Case 3) and the Fare Rounding (Case 1) will dwarf the Station Closure (Case 2) every time. **Do not use a single monetary metric.** Keep Time, Money, and Access in separate columns. If you merge them, the "dust specks" always win because there are so many of them. Keeping them separate forces the Board to look at the *distribution*, which is your job.
