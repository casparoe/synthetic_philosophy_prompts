  ### Table 1: Desiderata for Slur Theory in Annotation

  | id | requirement | motivating case | status | conflicts with |
  | :--- | :--- | :--- | :--- | :--- |
  | R1 | **Mention/Use Distinction** | Pure mention (news, linguistics, quotes) must not trigger violation. | Non-negotiable | — |
  | R2 | **Reclamation Sensitivity** | Reclaimed in-group use must be distinguishable from hostile use. | Negotiable* | R10 |
  | R3 | **Orthographic Resilience** | Masking (e.g., "f***") must retain slur status if intent is clear. | Non-negotiable | — |
  | R4 | **Projection Survival** | Offense must persist through negation, conditionals, questions. | Non-negotiable | — |
  | R5 | **Slur/Pejorative Boundary** | Must distinguish slurs from general insults (e.g., "jerk"). | Negotiable | R10 |
  | R6 | **Cross-Linguistic Variance** | Cognate neutral in Language A, slur in Language B. | Non-negotiable | — |
  | R7 | **Nonce Detection** | New terms coined in small communities must be capturable. | Optional | — |
  | R8 | **Target Truth-Independence** | Slur status holds even if target description is empty/false. | Reject** | — |
  | R9 | **Trait Mutability Independence** | Slur status holds even if target trait is behavioral/abandonable. | Reject** | — |
  | R10 | **Directional Neutrality** | Slurs aimed upward (at dominant groups) count as slurs. | Negotiable* | R2, R5 |

  *\*Contested in literature; policy-dependent for annotation.*
  *\*\*Rejected for moderation purposes (harm exists regardless of truth/trait), though theoretically significant.*

  ### Table 2: Scorecard of Theoretical Views

  | view | requirement it fails or most strains | verdict for my purpose |
  | :--- | :--- | :--- |
  | **Pure Expressivism** | Fails R4 (Projection); cannot explain offensive content in negated contexts. | Reject |
  | **Hybrid Expressivism** | Strains on R2 (Reclamation); hard to codify shifting expressive conditions. | Use with caution |
  | **Presuppositional** | Strains on R2 (Reclamation); presuppositions are typically conventional/fixed. | Viable |
  | **Conventional Implicature** | Strains on R2 (Reclamation); CI is usually context-invariant. | Viable |
  | **Pejorative-Only** | Fails R5 (Boundary); collapses structural harm into general rudeness. | Reject |

  ### Coda

  The jointly unsatisfiable subset involves **R2 (Reclamation)** and the operational need for **Context-Independent Detection** (implied by scalable embedding pipelines). Embedding spaces cluster tokens by co-occurrence; reclaimed uses often share contexts with offensive uses, making them statistically indistinguishable without explicit user-group metadata. This tension is real, not apparent. The single requirement doing the most work excluding theories is **R2 (Reclamation Sensitivity)**. It forces the theory away from pure semantics (where meaning is fixed to the token) toward pragmatics (where meaning depends on speaker, audience, and intent), thereby excluding simple list-based or embedding-only classifiers.

  ### Settled and Contested

  *   **Settled:** The Mention/Use distinction (R1) and the projection behavior of slur content under negation (R4) are widely accepted linguistic observations.
  *   **Contested:** The semantic locus of derogatory content (CI vs. Presupposition vs. Truth-Conditional), the mechanism enabling reclamation (R2), and the normative status of upward slurs (R10) remain deeply disputed in philosophy of language.
