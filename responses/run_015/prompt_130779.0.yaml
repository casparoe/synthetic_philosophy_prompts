prompt: |-
  I run a weekly student reading group on decision theory — mostly CS majors with a few philosophy people who wandered in — and we get 75 minutes in a room with a tiny whiteboard and a projector that has never once worked. Last week we did Newcomb's problem and it went okayish: maybe a third of them left convinced that one-boxing is just wishful thinking in a tuxedo. This week I want to do acausal trade, meaning the idea that two agents who cannot affect each other, observe each other, or communicate might still cooperate because their decisions are correlated through the similarity of their decision procedures rather than through any causal link or shared cause. My co-organizer says this is literally just one-boxing with extra steps and we should spend the session on Bayesian epistemology instead, and I half see his point but can't artiuclate what's wrong with it well enough to teach from.

  So don't explain acausal trade to me — plan how I should explain it to them. What I really want is the dependency structure: the order the pieces have to go in and what depends on what. My instinct is that I need them to first accept a case where your action is strong evidence about an outcome without causing it, and only then get them to a case where the correlation isn't explained by a common cause or by somebody simulating them either — but I don't know how to make that second move feel like a real step rather than a sleight of hand, and I worry that starting from Newcomb just replays last week's fight.

  I also need one example to carry the whole session. Here's the one I sketched: two agents, one in each of two universes that will never interact; each has 100 units of its own resource; each can burn k units of its own resource to manufacture 4k units of the good the other one values; unspent units are worth 1 util to their owner and the other's good is worth 1 util per unit to the other. Each is fairly but not fully confident the other exists. And the bit I added to make it hard: the two agents run the same architecture and style of reasoning, but one's utility function has been edited to value the other colour of widget, and their confidence that a counterpart exists differs (say 0.8 versus 0.5). They cannot send messages, so they cannot haggle over how much each burns — each just picks a number in private. Tell me whether that carries the session, what it is missing, what it has that it shouldn't, and why not the usual candidates: the exact-copy prisoner's dilemma, the old puzzle where a prize goes to you only if exactly one of twenty people asks for it, or two galaxy-spanning civilisations that value paperclips and staples. Should I start symmetric and then break the symmetry, or start asymmetric and let the copy case show up as a special case?

  Then the misconception map, with the point in the sequence where each should be headed off — and I mean headed off, not just corrected afterwards. The ones I expect: that this is a promise, a reputation effect, or iterated cooperation in disguise; that my choice somehow causally pushes the other agent's choice; that correlation without a common cause is incoherent so the whole setup is broken (this one will come from the strongest CS student); that it's still just evidential decision theory so nothing new is on the table; that it only works if the other agent is literally running my code, and the opposite error that any sufficiently reasonable agent will do the same thing; that cooperating with a causal-decision-theory counterpart is still worth something; and that this is Pascal's mugging with better branding, a licence to trade with any alien you can imagine. Tell me which of these I should actually invite rather than prevent, and flag any you think I'll get that I haven't listed.

  Finally: what should I openly refuse to explain at this level and say out loud that I'm refusing — I'm thinking the problem of how to weight which computations count as existing, logical uncertainty, updatelessness, whether copies in other branches of quantum mechanics are the same kind of thing as distant civilisations — and which of those I should name-and-drop versus never mention at all; plus one question I can ask at minute seventy where I could actually tell a right answer from a wrong one, so I know whether the idea landed or whether they just got talked into something. (There's a departmental coffee thing right after, so they're going to be restless.)
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** Runs a weekly student reading group on decision theory.
      *   **Audience:** Mostly CS majors, some philosophy. Smart, technical, likely skeptical of "magic" reasoning.
      *   **Constraints:** 75 minutes, tiny whiteboard, broken projector (crucial: rely on speech/board/handouts, not slides).
      *   **Previous Session:** Newcomb's Problem (mixed reception, 1/3 convinced 1-boxing is wishful thinking).
      *   **Current Goal:** Teach Acausal Trade (AT).
      *   **Co-organizer's Objection:** AT is just Newcomb's with extra steps; do Bayesian Epistemology instead.
      *   **User's Need:** Not an explanation of AT, but a *pedagogical plan* (dependency structure, example critique, misconception management, scope boundaries, assessment).

  2.  **Deconstruct the Core Challenge:**
      *   The co-organizer has a point: AT *is* structurally similar to Newcomb's (EDT vs. CDT).
      *   The user's intuition is also right: AT feels different because it removes the *Predictor* (Omega). It's about logical correlation between independent agents, not prediction of a specific agent by a superior intelligence.
      *   The hardest leap: Moving from "My action is evidence of Omega's prediction" (Newcomb) to "My action is evidence of a distant agent's action because we run similar algorithms" (AT), *without* a common cause or simulation.
      *   Time limit: 75 mins is tight for this level of abstraction.

  3.  **Evaluate the Proposed Example:**
      *   *Setup:* Two agents, separate universes, no interaction. Resource burning (cost $k$ to give other $4k$). Asymmetric confidence (0.8 vs 0.5). Same architecture, different utility functions.
      *   *Pros:* Removes the "Predictor" explicitly. Introduces asymmetry (avoids the "copy" triviality). Quantifiable utilities (good for CS majors).
      *   *Cons:* A bit complex for a 75-min session with a broken projector. The asymmetry in confidence might distract from the core logical correlation mechanism. The "different color widget" detail is flavor text that might confuse.
      *   *Comparison to Standard Examples:*
          *   *Exact-copy PD:* Too easy. "Of course I cooperate with myself." Doesn't prove the "acausal" part.
          *   *20 people prize:* Coordination problem, not really trade/decision theory in the same sense.
          *   *Paperclips/Staples:* Classic, but often gets bogged down in AI safety tangents.
      *   *Verdict:* The user's example is strong but needs simplification. Start symmetric to establish the mechanism, *then* introduce asymmetry to show robustness. Don't start asymmetric; it hides the core logic.

  4.  **Develop the Dependency Structure (The "Flow"):**
      *   *Phase 1: The Hook (10 mins).* Acknowledge Newcomb fatigue. State the goal: Cooperation without causation.
      *   *Phase 2: The Baseline (15 mins).* CDT failure mode. Why standard rationality says "Defect/Don't Burn."
      *   *Phase 3: The Bridge (20 mins).* Logical Correlation. How can $A$'s decision correlate with $B$'s without causation? (The "Same Algorithm" argument).
      *   *Phase 4: The Trade (20 mins).* Apply to the specific example. Show the math.
      *   *Phase 5: Objections & Close (10 mins).* Address misconceptions, final check.

  5.  **Address the Misconception Map:**
      *   *Invite:* "It's just EDT." (Yes, admit it, but distinguish the *source* of the correlation). "It only works on copies." (Use this to pivot to similar algorithms).
      *   *Preempt:* "Causal push." (Emphasize separate universes). "Pascal's Mugging." (Distinguish probability weights). "Reputation/Promise." (Emphasize no communication).
      *   *Hidden Gem:* "Why not just pre-commit?" (Updatelessness is the technical answer, but keep it high-level).

  6.  **Scope Boundaries (What to Refuse):**
      *   *Refuse:* Logical uncertainty mechanics (how to compute $P(A \text{ cooperates} | I \text{ cooperate})$). Measure problem (how many copies exist). Quantum branches.
      *   *Name-drop:* Updatelessness (as the formal fix for time-inconsistency).
      *   *Ignore:* Specific AI safety scenarios (keep it abstract).

  7.  **The "Minute 70" Check:**
      *   Need a question that distinguishes "I got talked into it" vs "I understand the mechanism."
      *   *Idea:* Change the correlation strength. If I know the other agent uses a *different* heuristic (e.g., random vs. maximization), does trade still hold?
      *   *Better Idea:* The "CDT Agent" objection. If I know the other agent is a CDT maximizer, should I trade? (Answer: No, because no correlation). This tests if they understand the *source* of the leverage.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Tone:* Respectful of the co-organizer's skepticism (because it's valid), but carving out the specific niche where AT adds value.
      *   *Visuals:* Since the projector is dead, the whiteboard plan must be minimal. Use variables, not diagrams.
      *   *The "Extra Steps" Rebuttal:* The co-organizer says it's Newcomb + steps. The counter-argument is: Newcomb relies on a *Predictor*. AT relies on *Logical Similarity*. Removing Omega makes it more general (applies to peers, not just gods).
      *   *Example Tweak:* Simplify the confidence levels. Make it 1.0 for both first, then mention uncertainty later if time permits. The asymmetry complicates the board work. Let's advise starting symmetric for clarity, then mentioning asymmetry as a "homework" thought. Actually, the user wants to use the asymmetry. I should advise *against* starting with it. It masks the core mechanism.
      *   *Misconception Strategy:* Don't fight the "It's EDT" claim. Embrace it. The innovation of AT is applying EDT logic to *logical* facts rather than *empirical* facts.

  9.  **Final Polish:**
      *   Ensure the 75-minute timing is realistic.
      *   Make sure the "Minute 70" question is actionable.
      *   Check that the advice addresses the "broken projector" constraint (rely on verbal/whiteboard).

  **(Self-Correction during drafting):** I initially thought about telling them to drop the asymmetry. But the user specifically asked about it. I should explain *why* starting symmetric is better pedagogically, even if the asymmetric case is the ultimate goal. The symmetric case builds the intuition; the asymmetric case tests it.
  Also, the co-organizer's point is strong. I need to give the user ammo to justify *why* this session isn't a waste of time. The key is: Newcomb is about *prediction*; AT is about *logical subjunctives* between peers. It generalizes the insight.

  10. **Finalizing the Output Structure:**
      *   Dependency Structure (The Flow).
      *   Example Critique (The Widget Scenario).
      *   Misconception Map (Preempt vs. Invite).
      *   Scope Boundaries (The "Do Not Enter" Zone).
      *   The Minute 70 Check.

