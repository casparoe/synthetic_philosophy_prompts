answer: |-
  Here is a lesson plan designed for your constraints (75 mins, dead projector, skeptical CS majors) and your specific pedagogical goal (distinguishing acausal trade from Newcomb's without getting bogged down in metaphysics).

  ### 1. The Dependency Structure (The Flow)

  Your co-organizer is technically right that the *math* is similar to Newcomb's (EDT vs. CDT), but wrong that the *insight* is identical. Newcomb's relies on a **Predictor** (Omega). Acausal Trade relies on **Logical Correlation** between peers. The dependency chain must isolate that difference.

  **Phase 1: The CDT Baseline (0–15 mins)**
  *   **Goal:** Establish that standard causal reasoning leads to suboptimal outcomes in this specific setup.
  *   **Board:** Write the payoff matrix for your widget example.
  *   **Move:** Ask a CDT proponent: "Does your burning resources *cause* the other agent to burn resources?"
  *   **Target Answer:** "No. We are in separate universes."
  *   **Result:** CDT says "Don't Burn." Total utility is low.
  *   **Dependency:** You cannot move to Phase 2 until they agree that causally, the actions are independent.

  **Phase 2: The Logical Bridge (15–35 mins)**
  *   **Goal:** Establish correlation without causation or common cause.
  *   **Move:** "If you are both running the same algorithm (say, `MaximizeExpectedUtility`), and you both have the same input data (the payoff matrix), do you make the same output?"
  *   **Key Distinction:** This is not Omega simulating you. This is you simulating *yourself* to predict *them*.
  *   **Dependency:** They must accept that $P(\text{They Burn} | \text{I Burn})$ is high, not because of causality, but because $Algorithm(I) \approx Algorithm(They)$.
  *   **Crucial Step:** Do not call this "magic." Call it "logical necessity." If $2+2=4$ here, it is $4$ in the other universe. If `CDT` defects here, `CDT` defects there. If `AT` cooperates here, `AT` cooperates there.

  **Phase 3: The Trade Calculation (35–55 mins)**
  *   **Goal:** Show the utility gain.
  *   **Board:** Calculate Expected Utility (EU) for "Burn" vs. "Don't Burn" using the conditional probability from Phase 2.
  *   **Move:** Introduce the asymmetry (your 0.8 vs 0.5 confidence).
  *   **Warning:** Do this *after* the symmetric case. If you start asymmetric, they will get stuck on the probability math and miss the logical correlation mechanism.
  *   **Result:** Show that even with $<1.0$ confidence, if the correlation is strong enough, EU(Burn) > EU(Don't).

  **Phase 4: Objections & Boundaries (55–70 mins)**
  *   **Goal:** Contain the explosion of edge cases.
  *   **Move:** Address the misconception map (see below).
  *   **Dependency:** Only address misconceptions that attack the Phase 2 bridge.

  **Phase 5: The Check (70–75 mins)**
  *   **Goal:** Assessment.

  ---

  ### 2. The Example Critique

  **Your Widget Scenario:**
  *   **Verdict:** It carries the session, but **do not start with the asymmetry.**
  *   **Why:** The asymmetry (0.8 vs 0.5 confidence) introduces Bayesian updating noise that distracts from the core mechanism (logical correlation). CS majors will try to "solve" the probability mismatch rather than understanding the decision theory.
  *   **Fix:** Start with **Symmetric Confidence (1.0)**. "We both know the other exists. We both know we run the same code." Get the "Aha!" moment. *Then* say, "What if we aren't sure?" as a complication in Phase 3.
  *   **What it has that it shouldn't:** The "different colour widget" detail. It's unnecessary flavor. Just say "Agent A values X, Agent B values Y."
  *   **What it's missing:** A explicit "CDT Agent" foil. You need to explicitly state: "If the other agent is a CDT maximizer, this fails." This clarifies that the trade depends on the *type* of the other agent, not just their existence.
  *   **Why not the others?**
      *   *Exact-copy PD:* Too trivial. Students dismiss it as "cooperating with yourself."
      *   *20-people prize:* That's a coordination equilibrium problem, not a decision-theory substrate problem.
      *   *Paperclips/Staples:* Too much sci-fi baggage. Students argue about AI safety instead of decision theory.
  *   **Symmetry Strategy:** Start Symmetric. It isolates the variable (Decision Procedure). Once they accept that identical procedures yield identical outputs, breaking the symmetry (different confidence, slightly different code) becomes a parameter tweak rather than a conceptual overhaul.

  ---

  ### 3. The Misconception Map

  Here is how to handle the objections. The goal is to **head them off** before they derail the room, not just answer them.

  | Misconception | When it arises | Strategy |
  | :--- | :--- | :--- |
  | **"This is just a promise/reputation."** | Phase 1 | **Preempt:** Explicitly state on the board: "No communication channel exists. No future interaction exists. You die after this turn." |
  | **"My choice causally pushes theirs."** | Phase 2 | **Preempt:** Use the "Math Truth" analogy. "Does writing $2+2=4$ here cause it to be true in the other universe? No. But it correlates." |
  | **"Correlation without common cause is incoherent."** (The Strong CS Student) | Phase 2 | **Invite:** This is the best objection. **Do not fight it.** Admit: "In physical space, you are right. In *logical* space, the algorithm output is a necessary truth. We are correlating on the output of a function, not physical events." |
  | **"It's just Evidential Decision Theory (EDT)."** | Phase 3 | **Invite:** Agree with your co-organizer publicly. "Yes, this is EDT applied to logical facts. The innovation isn't the math; it's realizing logical facts are actionable." This disarms the "nothing new" crowd. |
  | **"Only works on literal code copies."** | Phase 3 | **Head Off:** "It works on *functional equivalence*. If you reason 'I should cooperate', and you model them as reasoning 'I should cooperate', the correlation holds even if the code isn't bit-identical." |
  | **"Cooperating with a CDT counterpart is worth it."** | Phase 3 | **Head Off:** Be clear: "If you know they are CDT, you cannot trade. They will take your gift and give nothing. You need reason to think they are also AT-capable." |
  | **"Pascal's Mugging / Imaginary Aliens."** | Phase 4 | **Head Off:** "This requires non-negligible probability of existence. If $P(\text{Existence}) \approx 0$, the trade value is 0. This is not about trading with things you make up." |

  **Missing Misconception:**
  *   **"Why not just pre-commit?"** A smart student will ask: "Can't I just pre-commit to burning?"
  *   **Response:** "Pre-commitment is the *mechanism*, but *when* do you pre-commit? If you pre-commit after calculating that defecting is better, you won't pre-commit. You need to be the *type of agent* who pre-commits." (This leads to Updatelessness, which you will refuse to explain).

  ---

  ### 4. Scope Boundaries (What to Refuse)

  You have 75 minutes. If you open these doors, you will not close them. Write these on the side of the whiteboard under "Out of Scope" at the start.

  1.  **Logical Uncertainty:** How do we actually compute $P(\text{They Cooperate} | \text{I Cooperate})$ if we can't run their code?
      *   *Refusal:* "We assume the probability is given. How to calculate it is an open research problem in logical induction."
  2.  **The Measure Problem:** Do copies in quantum branches count? Does a simulation count as existence?
      *   *Refusal:* "We treat 'existence' as a binary parameter for today. Weighting computations is metaphysics, not decision theory."
  3.  **Updatelessness:** Why can't I update on the fact that I exist and then defect?
      *   *Name-Drop Only:* "This requires being an 'Updateless' agent. If you update on your existence, the trade collapses. We assume updatelessness without deriving it."
  4.  **Deriving the Correlation:** How similar must the code be?
      *   *Refusal:* "We assume 'sufficient similarity.' Defining that is the hard part of the field."

  **Why this helps:** It validates the CS majors' instinct that the details are messy, while allowing you to teach the *structure* of the argument without getting stuck in the mud.

  ---

  ### 5. The Minute 70 Check

  You need a question that distinguishes "I was persuaded by rhetoric" from "I understand the mechanism."

  **The Question:**
  > "Suppose you are an Acausal Trader. You are offered the trade. But you have a reliable leak that the other agent is a **Causal Decision Theorist** who has already calculated their move. Do you burn your resources?"

  **The Right Answer:**
  > "No. Because there is no logical correlation. Their decision is fixed by CDT (Defect), regardless of my algorithm. My action provides no evidence about theirs because theirs is already determined by a different process."

  **The Wrong Answer (The "Talked Into" Trap):**
  > "Yes, because I should be nice / maximize total utility / hope they change their mind."

  **Why this works:**
  It tests if they understand that the *leverage* comes from the **shared decision procedure**, not from the **goodness of cooperation**. If they think AT is just "being cooperative," they will say Yes. If they understand AT is "exploiting logical correlation," they will say No.

  ### Summary Advice for the Room
  Since the projector is dead and the whiteboard is tiny:
  1.  **Handout:** Print the payoff matrix and the scenario on a half-sheet of paper. Do not waste board space copying text.
  2.  **Board Real Estate:** Reserve the left third for "CDT View," the middle for "AT View," and the right for "Out of Scope."
  3.  **Co-organizer Ally:** When the "It's just EDT" objection comes up, nod and say, "Exactly. We are exploring the consequences of that specific lens." It makes the skeptics feel heard rather than converted.

  Good luck. If you can get them to see that *algorithms* are the things being traded, not *goods*, you've won.
