      *   *Reading 4: The "Fitness-Truth Gap" (Trivial).*
          *   Content: Fitness $\neq$ Truth.
          *   Verdict: Trivially True.
          *   Selectivity: **Fails.** Doesn't imply *no* overlap.

  5.  **Address Task 5: The Backfire (The "Impartiality is Unnatural" Argument):**
      *   If the argument is "trust intuitions not shaped by fitness," then EA intuitions are actually *more* suspect because they are evolutionarily novel and likely not selected for.
