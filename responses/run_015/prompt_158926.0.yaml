      *   *Moral Responsibility:* Substantive/Defensible. This is the core Stoic view. Only virtue is good/evil.
      *   *Immunity:* Substantive/Defensible. My will cannot be forced (unless I assent).
      *   *Rational Demand:* Substantive. It makes no sense to demand the impossible.
      *   *Binary Split:* The user is right to question the binary. Stoicism acknowledges "preferred indifferents."

  5.  **Addressing the Friend's Conclusion (Withdrawing Concern):**
