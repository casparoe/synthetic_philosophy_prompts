answer: |-
  ### Diagnostic Taxonomy of Scientific Realism Stances

  **Root Question:** Does the empirical and predictive success of a radically false theory provide any reason to retain belief in its unobservable ontology?

  ```text
  ROOT
  │
  ├── BRANCH 1: NOTHING AT ALL
  │   Claim: Success is pragmatic; like Phlogiston chemistry, nothing ontological 
  │   survives the transition to Oxygen theory.
  │
  │   ├── SPLIT A: CUMULATIVE APPROXIMATION
  │   │   Claim: Despite retaining nothing, history shows convergence toward 
  │   │   one true ontology (e.g., Newton is a limit case of Einstein).
  │   │   │
  │   │   └── LEAF 1: [UNOCCUPIED / INCOHERENT]
  │   │       Status: Incoherent. One cannot claim convergence toward a specific 
  │   │       ontology while asserting no ontological elements survive to indicate 
  │   │       the vector of convergence.
  │   │
  │   └── SPLIT B: APPROXIMATION COLLAPSES
  │       Claim: Without stable ontology, 'approximate truth' is meaningless; 
  │       like Bohr orbits vs. Quantum Orbitals, the frame itself ruptures.
  │       │
  │       └── LEAF 2: CONSTRUCTIVE EMPIRICISM / PESSIMISTIC ANTI-REALISM
  │           Awkward Commitment: Must explain why current Quantum Field Theory 
  │           is exempt from the same inductive skepticism that buried the Ether.
  │
  │
  ├── BRANCH 2: ENTITIES PRESENT IN SUCCESSOR
  │   Claim: Causal powers survive; the Electron persists from Bohr to QED even 
  │   if the orbital trajectory is discarded.
  │
  │   ├── SPLIT A: CUMULATIVE APPROXIMATION
  │   │   Claim: We accumulate a correct list of real entities; the ontology 
  │   │   of the world is being filled in (e.g., discovering quarks).
  │   │   │
  │   │   └── LEAF 3: ENTITY REALISM (Experimental Realism)
  │   │       Awkward Commitment: Must define an "entity" independently of the 
  │   │       theoretical description used to detect it, without begging the question.
  │   │
  │   └── SPLIT B: APPROXIMATION COLLAPSES
  │       Claim: Entities exist, but theoretical descriptions do not approximate 
  │       their intrinsic nature; we manipulate tokens without knowing their essence.
  │       │
  │       └── LEAF 4: LOCAL ONTOLOGICAL REALISM (Unnamed / Hybrid)
  │           Awkward Commitment: Requires believing in the existence of a thing 
  │           while denying that any property ascribed to it is likely true.
  │
  │
  └── BRANCH 3: FORMAL/MATH STRUCTURES ONLY
      Claim: Relations survive; Fresnel's equations remain valid even when the 
      Luminiferous Ether ontology is discarded.
      │
      ├── SPLIT A: CUMULATIVE APPROXIMATION
      │   Claim: Mathematical relations converge on the true structure of the 
      │   world, even if the "relata" (objects) change (e.g., Newton → Einstein).
      │   │
      │   └── LEAF 5: EPISTEMIC STRUCTURAL REALISM
      │       Awkward Commitment: Must explain how structure can be real without 
      │       committing to *some* ontology that bears the relations (Newman Problem).
      │
      └── SPLIT B: APPROXIMATION COLLAPSES
          Claim: Structure is all there is; the notion of approximating an 
          underlying "object" ontology collapses because objects are ontic illusions.
          │
          └── LEAF 6: ONTIC STRUCTURAL REALISM
              Awkward Commitment: Must account for the emergence of distinguishable 
              particles (like fermions) in a physics that fundamentally denies individuality.
  ```

  ### Diagnostic Analysis of Gaps and Overlaps

  **1. The Incoherent Gap (Leaf 1)**
  The combination of **Nothing Retained** + **Cumulative Approximation** is logically unstable. If no ontological or structural element survives from Theory A to Theory B, there is no common metric to judge B as "closer" to the truth than A. This position is rarely occupied; those who argue for convergence (e.g., Putnam, Boyd) invariably argue that *something* (reference, structure, or causal power) is preserved.

  **2. The Indistinguishable Pair (Leaf 2 Variants)**
  This tree cannot diagnostically separate **Constructive Empiricism** (Van Fraassen) from **Pessimistic Meta-Induction** (Laudan/Stanford) at Leaf 2. Both answer "No" to the Root and deny cumulative ontology.
  *   *Distinction:* Constructive Empiricism is a volitional stance (we *should* suspend belief), while Pessimistic Anti-Realism is an inductive conclusion (history *forces* us to suspend belief).
  *   *Diagnostic Failure:* A physicist holding this stance will give identical answers to questions about Phlogiston and Ether. You can only separate them by asking about their *goals* (truth vs. empirical adequacy), not their assessment of history.

  **3. The Convergent Overlap (Leaf 3 vs. Leaf 5)**
  In modern practice, **Entity Realism** (Leaf 3) and **Epistemic Structural Realism** (Leaf 5) often collapse into indistinguishability.
  *   *The Problem:* In Quantum Field Theory, an "entity" (like an electron) is defined entirely by its structural properties (mass, charge, spin, group representations).
  *   *Diagnostic Failure:* If a subject claims to believe in the electron (Entity) but admits its only definable features are mathematical invariants (Structure), they occupy both leaves simultaneously. The tree separates them based on a metaphysical distinction (substance vs. relation) that current physics may not support.

  **4. The Unattractive Hybrid (Leaf 4)**
  **Local Ontological Realism** is largely unoccupied because it is epistemically unsatisfying. It requires the physicist to assert "X exists" while simultaneously conceding "We have no reason to think our description of X is approximately true." This is often a transient position for experimentalists frustrated by theory change, but rarely a stable philosophical home.

  ### Instructions for Use
  To place yourself or a colleague:
  1.  **Start at the Root:** Ask if the success of the Ether theory justifies believing in *any* part of its ontology.
  2.  **Move to Branch:** If "No," go to Branch 1. If "Yes," ask: "Did the *thing* survive (Electron) or just the *equation* (Maxwell)?"
  3.  **Final Split:** Ask if Newtonian gravity is "approximately true" (Cumulative) or "qualitatively wrong but useful" (Collapse).
  4.  **Check the Leaf:** Read the "Awkward Commitment." If that commitment feels unacceptable, backtrack to the previous split.
