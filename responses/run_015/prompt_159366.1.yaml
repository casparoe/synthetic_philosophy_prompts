prompt: |-
  I run a small type foundry, and I need help turning an idea into something my team can actually use. We maintain a variable superfamily covering Latin, Greek and Cyrillic, and for the past eight months we have been contracted to extend it to a language whose orthography was standardized only in the 1990s and which has, as far as we can tell, no typographic tradition beyond a few handwritten primers and some photocopied church bulletins. Our workflow is that a generative model trained on our existing masters proposes candidate glyphs and a human reviewer accepts or rejects them: about two hundred candidates a month, under fifteen minutes per review, and the reviewers are junior designers with no training in linguistics or philosophy. A rejection costs us roughly a week of regeneration; a bad acceptance ships to readers who notice at once that the letter was drawn by someone who does not read the language. Sign-off is mine, with a two-person advisory board of native readers I can consult maybe twice a month and who do not always agree.

  A friend described to me a research project on letterform design whose central claim — I only ever got it second-hand, so treat my summary as hearsay and please don't lean on knowing the source — is that what makes every 'a' an 'a' is not a list of features you can check off. Roughly: the parts of the glyph (the bowl, the stem, the aperture, the terminal) each play a role; the same role can be filled in many different ways; and a letter is identified as much by its place in a system of contrasts with the other letters of its alphabet as by anything intrinsic to it, so that an 'a' is partly what is not an 'o', not a 'd', not a 'u'. Right now my reviewers have no procedure at all — they look at a candidate and say that's not an a, and when I ask why, they gesture at the shape. I want better than that, and I want it usable by someone who has never thought about categories.

  Please write me an accept/reject procedure my reviewers can run, in words, in the order the questions should be asked: what to look at first, what counts as a sufficient answer at each step, where a candidate is rejected outright, where it is handed on to me because the remaining question is one of judgment or house values rather than fact, and how a reviewer should separate a deviation of style from a failure of category — the difference between a candidate whose stem is straighter than ours because the model learned a different model of the skeleton, which is fine, and one that will be read as a different letter or by nobody at all. It has to survive three complications I cannot design away. First, the new script has almost no tradition: there is no settled prototype to compare against, and the tempting move of importing the Latin contrast set may simply be importing an answer. Second, the superfamily includes a micro master for ten-pixel interface labels and an accessibility master aimed at readers with dyslexia, where our 'a' is deliberately exaggerated and the ordinary tests may not apply. Third, for nearly every candidate we can run no empirical test at all: a few thousand speakers, no eye-tracking, two advisors. Say what the procedure does when it cannot get an answer from a reader, and be explicit about which steps are judgment calls wearing procedural clothing.

  Then run it on three cases. First: the model's candidate 'a' for the new script — a closed bowl, a straight stem on the right, a small foot serif — where two reviewers say it reads as an 'o' with a tail, one says it is fine, and the advisory board is split. Second: a candidate where, generating for the Cyrillic codepoint, the model produced something very close to the Greek alpha our family already ships, and which reads perfectly well to a monolingual Latin reader. Third: a candidate I drew by hand myself and would like to keep — a single-storey 'a' whose bowl opens very wide where it meets the stem — which the reviewers love, and which at the micro master becomes hard to tell from both our 'o' and our 'c'; I expect the procedure to tell me something I do not want to hear about this one, and I would rather hear it. Finally, tell me plainly where the procedure will misfire and what it cannot do, and in particular whether it can ever settle the question of whether two shapes are the same letter across two different scripts, or whether that question belongs to Unicode and to the community of readers rather than to us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Owner of a small type foundry.
      *   **Context:** Extending a variable superfamily (Latin, Greek, Cyrillic) to a newly standardized language (1990s, little typographic tradition).
      *   **Workflow:** Generative AI proposes glyphs -> Junior Designers review (Accept/Reject) -> Owner Sign-off + 2 Native Advisors (limited availability).
      *   **Constraints:**
          *   Reviewers: Junior designers, no linguistics/philosophy training.
          *   Time: ~15 mins/review, ~200 candidates/month.
          *   Cost: Rejection = 1 week regen; Bad Accept = Public embarrassment/legibility issues.
          *   Complication 1: No settled typographic tradition (can't just compare to a reference).
          *   Complication 2: Extreme masters (10px micro, Dyslexia accessibility) where standard proportions break.
          *   Complication 3: No empirical testing (small speaker base, no eye-tracking).
      *   **Theoretical Basis:** "Hearsay" research claim: Letter identity is relational/systemic (contrast with others) + functional roles, not just a checklist of features.
      *   **Deliverables:**
          1.  A step-by-step Accept/Reject procedure (words, ordered, clear decision points).
          2.  Application of the procedure to three specific cases.
          3.  A plain-spoken limitation analysis (where it misfires, what it can't do, specifically regarding cross-script identity).

  2.  **Develop the Procedure (The "Contrast & Role" Protocol):**

      *   *Goal:* Make the abstract theory (relational identity, functional roles) actionable for juniors without linguistic training.
      *   *Core Concept:* Instead of "Does this look like an 'a'?", ask "Does this collide with anything else?" and "Does it fulfill the job of an 'a' in this specific font weight/size?"
      *   *Structure:*
          *   Phase 1: Isolation (Internal Consistency).
          *   Phase 2: Contrast (Systemic Identity).
          *   Phase 3: Context (Legibility/Function).
          *   Phase 4: Escalation (When to pass to the Owner).
      *   *Handling Complications:*
          *   *No Tradition:* Rely on internal consistency within the *new* script's set, not Latin models.
          *   *Extreme Masters:* Specific checkpoints for Micro/Accessibility (simplify the questions).
          *   *No Empirics:* Use "Simulated Reading" (squint test, neighbor test) as a proxy.
      *   *Decision Logic:* Clear "Reject," "Accept," or "Escalate" paths.

      *   *Drafting the Steps:*
          1.  *Role Check:* Does it have the necessary parts to do the job? (Not specific shapes, but functional zones).
          2.  *Neighbor Check:* Does it look too much like its neighbors (o, d, u, etc.)?
          3.  *Family Check:* Does it fit the *style* of the foundry's superfamily (stress, weight)?
          4.  *Master Check:* Is it optimized for the specific master (Micro/Dyslexia)?
          5.  *Escalation:* If it passes technical checks but feels "off" culturally.

      *   *Refining for the "Hearsay Theory":* Emphasize that identity is defined by *difference*. The procedure must force the reviewer to compare the candidate against the *rest of the alphabet being generated*, not just a mental image of an 'a'.

  3.  **Apply to Case Studies:**

      *   *Case 1: The 'o' with a tail (Split decision).*
          *   Procedure focus: Contrast check. If it collides with 'o', it fails the systemic identity test.
          *   Outcome: Reject or Escalate (likely Reject based on contrast failure).
      *   *Case 2: Cyrillic codepoint looking like Greek Alpha (Latin reader friendly).*
          *   Procedure focus: Codepoint/Script integrity. Just because a Latin reader reads it doesn't mean it belongs to the *new* script's system.
          *   Outcome: Reject (Wrong script identity), unless the new script historically derives from Greek (need to flag this as a cultural question).
      *   *Case 3: Owner's Hand-Drawn Single-Storey 'a' (Micro master issues).*
          *   Procedure focus: Master Check. At 10px, does it distinguish from 'o' and 'c'?
          *   Outcome: Fail at Micro master. Accept for Text, Reject for Micro. (This is the "unwelcome truth" the owner asked for).

  4.  **Analyze Limitations (The "Plain Truth"):**

      *   *Where it misfires:* Cultural nuance, historical evolution, true legibility without testing.
      *   *Cross-script identity:* This is the big philosophical question. Can a type foundry decide if a Cyrillic 'a' is the "same" as a Latin 'a'? No. That's Unicode/ISO/Community. The foundry designs *forms*, not *identities*.
      *   *Procedural Clothing:* Acknowledge that "Role Check" is subjective.

  5.  **Review and Refine (Self-Correction during drafting):**

      *   *Tone:* Professional, direct, empathetic to the constraints. No academic jargon.
      *   *Constraint Check:* Did I address the 15-minute limit? Yes, keep steps binary. Did I address the "no tradition" issue? Yes, by focusing on internal contrast.
      *   *The "Hearsay" Theory:* Ensure the procedure reflects the idea that 'a' is defined by not being 'o' or 'd'.
      *   *The Owner's Case 3:* Be honest. If the procedure says it fails at 10px, say it fails. Don't sugarcoat.
      *   *The Cross-Script Question:* This needs a strong philosophical stance. A type designer draws shapes; the community assigns meaning.

  6.  **Final Polish:** Organize with clear headings. Ensure the "Escalation" path is clear for the advisory board bottleneck. (Self-correction: Make sure the reviewers know *when* to bother the advisors vs. when to bother the Owner).

      *   *Refining the "No Tradition" aspect:* Since there's no reference, the "Contrast Set" must be built from the *other candidates* generated for this specific project. The reviewers need to see the set, not just single glyphs.
      *   *Refining the "Micro/Dyslexia" aspect:* Add a specific "Stress Test" step.

  7.  **Final Output Generation:** (Proceeding to write the response based on these thoughts.)
answer: |-
  Here is a procedure designed for your constraints, followed by the case applications and the limitation analysis you requested.

  ### The Contrast & Role Protocol (CRP)
  **For:** Junior Reviewers
  **Time Budget:** 12 Minutes per candidate (leaving 3 mins for logging)
  **Goal:** Prevent category errors, not to judge aesthetic perfection.

  **Pre-Condition:** You must view the candidate glyph not in isolation, but alongside the current "Working Set" of the new script (the other 20–30 glyphs already accepted for this project). If you only look at the single glyph, stop. You cannot judge identity without contrast.

  #### Step 1: The Functional Role Check (2 Minutes)
  *Question:* Does this glyph possess the functional zones required to distinguish it from the "null" shape (the background)?
  *Action:* Overlay the candidate with the 'o' (or the most closed counterform in the new script) and the 'l' (or the simplest vertical).
  *   **Pass:** The candidate has a distinct counterform (hole) OR a distinct terminal (end-point) that the 'o' lacks, AND a distinct vertical or curve that the 'l' lacks.
  *   **Fail (Reject):** The glyph is topologically identical to another accepted glyph (e.g., it is an 'o' with a spur that vanishes at small sizes).
  *   **Note:** Do not check if it looks like an 'a'. Check if it looks like *not-an-o* and *not-an-l*.

  #### Step 2: The Neighbor Contrast Check (4 Minutes)
  *Question:* In a string of text, will this be confused with its immediate structural neighbors?
  *Action:* Type the candidate in a repeating string (e.g., `aaa`) and a confusion string (e.g., `aoo`, `ada`, `aua`). View at 12pt, 48pt, and 10pt.
  *   **Pass:** At 12pt, the eye catches the difference between the candidate and its neighbors instantly without pausing.
  *   **Fail (Reject):** At 12pt, you have to "read" the difference rather than "see" it. (e.g., "Is that an 'o' with a tail or an 'a'?")
  *   **Complication (Micro Master):** At 10pt, if the aperture (opening) closes completely, does it become an 'o'? If yes, **Reject for Micro**, flag for Text.
  *   **Complication (Accessibility):** If the shape relies on subtle stroke modulation to be identified, **Reject for Accessibility**. Accessibility requires exaggerated distinctness, not subtlety.

  #### Step 3: The Systemic Fit Check (3 Minutes)
  *Question:* Does this glyph belong to *this* foundry's superfamily, or did the model hallucinate a different design language?
  *Action:* Compare the stress (axis of thick/thin), weight, and x-height to the Latin 'a' in the same master.
  *   **Pass:** The "color" (darkness) and "voice" (formal/informal) match the Latin parent.
  *   **Fail (Escalate):** The glyph is technically distinct (Step 1 & 2 passed) but looks like it belongs to a different font family (e.g., a humanist 'a' in a geometric sans superfamily). **Do not Reject.** Mark as "Style Mismatch" and hand to Owner. This is a house value judgment.

  #### Step 4: The Cultural Void Check (3 Minutes)
  *Question:* Are we importing Latin bias where it doesn't belong?
  *Action:* Look at the "skeleton" (the underlying stick figure of the letter).
  *   **Pass:** The skeleton follows the handwritten primers or church bulletins you have on file, even if stylized.
  *   **Fail (Escalate):** The skeleton is clearly a Latin 'a' (two-storey) imposed on a script that traditionally uses a single-storey form, OR vice versa.
  *   **Constraint:** Since there is no tradition, if the skeleton matches *nothing* in the reference material, **Escalate**. Do not Accept. This is a risk for the Advisory Board.

  #### Decision Matrix
  1.  **Reject:** Fails Step 1 (Role) or Step 2 (Contrast). *Reason: Legibility risk.*
  2.  **Escalate to Owner:** Passes 1 & 2, Fails Step 3 (Style) or Step 4 (Culture). *Reason: Judgment call.*
  3.  **Accept:** Passes all steps. *Reason: Systemically sound.*

  ***

  ### Case Applications

  #### Case 1: The 'o' with a Tail (Split Reviewers, Split Advisors)
  **The Candidate:** Closed bowl, straight stem on right, small foot serif.
  **The Run:**
  *   **Step 1 (Role):** It has a counterform (like 'o') and a stem (like 'l'). It passes the null check.
  *   **Step 2 (Contrast):** You type `aoo`. At 12pt, two reviewers say it reads as 'o'. This is a critical failure of the Neighbor Contrast Check. If the primary distinction is a "small foot serif," that detail will vanish in body text or on low-res screens.
  *   **Step 4 (Culture):** If the reference primers show an open 'a', this closed form is an import.
  **Verdict:** **Reject.**
  **Reasoning:** The procedure prioritizes the "Not-an-o" rule. If it relies on a serif to distinguish itself from 'o', it is topologically an 'o'. In a variable font, that serif may disappear in lighter weights. The split advisory board indicates cultural ambiguity, but the legibility failure is objective. Do not ship a glyph that requires a footnote to read.

  #### Case 2: Cyrillic Codepoint, Greek Alpha Form (Latin-Readable)
  **The Candidate:** Looks like Greek α, assigned to new Cyrillic-based codepoint. Reads well to Latin eyes.
  **The Run:**
  *   **Step 1 (Role):** It functions as a vowel.
  *   **Step 2 (Contrast):** It distinguishes well from neighbors in the *Latin* set.
  *   **Step 4 (Culture):** **Critical Failure.** You are designing for a specific orthography standardized in the 1990s. If that orthography assigns this sound to a specific shape, and you ship a Greek shape, you are not designing a font; you are misspelling the language. The fact that a Latin reader can read it is irrelevant; in fact, it is dangerous, as it encourages colonial typographic imposition.
  **Verdict:** **Reject.**
  **Reasoning:** This is not a style mismatch; it is a codepoint identity error. The procedure flags this in Step 4. Even if the advisors are split, shipping a Greek glyph for a Cyrillic codepoint (unless historically justified by that specific language's evolution) breaks the contract with the reader community.

  #### Case 3: The Owner's Hand-Drawn Single-Storey 'a' (Micro Master Failure)
  **The Candidate:** Single-storey, wide opening. Reviewers love it.
  **The Run:**
  *   **Step 1 (Role):** Passes. Distinct from 'o'.
  *   **Step 2 (Contrast):** At 48pt and 12pt, it passes beautifully. It has character.
  *   **Step 2 (Contrast - Micro Master):** You switch to the 10px master. The wide opening closes due to pixel grid constraints. It now shares the same bounding box and counterform volume as your 'o' and 'c'.
  *   **Verdict:** **Accept for Text/Display Masters. Reject for Micro Master.**
  **Reasoning:** You asked for the truth: This glyph fails the variable contract. A variable superfamily implies continuity of identity across axes. If the 'a' becomes an 'o' at 10px, the system breaks. You must either draw a specific 10px override (a delta) that exaggerates the opening, or acknowledge that this specific design cannot exist in the Micro master. Do not ship the Micro master with this glyph unchanged.

  ***

  ### Limitations and Plain Truths

  You asked where this procedure will misfire and what it cannot do. Here is the assessment:

  **1. The "Same Letter" Fallacy**
  The procedure cannot settle whether two shapes are the "same letter" across two different scripts (e.g., is this new script's 'a' the "same" as the Latin 'a'?).
  *   **Why:** Identity is not a property of the ink; it is a property of the agreement between writer and reader.
  *   **Truth:** That question belongs to Unicode, the ISO, and the community of speakers. You are a type foundry. You sell *shapes*, not *identities*. If the community decides your shape is the "right" one, you were right. If they decide it is a Latin imposition, you were wrong, regardless of how robust your contrast checks were. The procedure protects you from *legibility* errors, not *sociolinguistic* errors.

  **2. Procedural Clothing on Judgment**
  Step 3 (Systemic Fit) and Step 4 (Cultural Void) are judgment calls wearing procedural clothing.
  *   **Why:** "Does this look like it belongs?" is subjective. A junior designer with no linguistic training is guessing at Step 4.
  *   **Truth:** The procedure forces them to Escalate rather than Accept when unsure. This creates a bottleneck at your desk. You cannot automate cultural sensitivity. The procedure's only value here is preventing a junior designer from confidently Accepting something they don't understand. It shifts the risk from "unconscious incompetence" to "conscious escalation."

  **3. The Empirical Void**
  The procedure assumes that "contrast" equals "legibility."
  *   **Why:** We have no eye-tracking. We assume that if a reviewer can distinguish 'a' from 'o' in 2 seconds, a reader can too.
  *   **Truth:** This is a proxy, not a proof. In a language with no typographic tradition, readers may rely on word-shape recognition differently than in Latin. The procedure minimizes the risk of *confusion*, but it cannot guarantee *fluency*. You are flying blind on reading speed and fatigue.

  **4. The Variable Trap**
  The procedure treats masters as discrete checkpoints.
  *   **Why:** We checked 10px and 12pt.
  *   **Truth:** In a variable font, the failure might happen at Weight 432, not Weight 400. The procedure cannot test every instance. It relies on the assumption that if the extremes (Micro vs. Display) work, the middle works. In a newly standardized script with no tradition, the "middle" might be where the glyph collapses. You will need to spot-check intermediate instances randomly.

  **Summary:**
  This procedure will stop you from shipping glyphs that are structurally ambiguous or topologically broken. It will not stop you from shipping glyphs that are culturally offensive or historically inaccurate. It will tell you when your Micro master is lying to the reader. It will not tell you if the readers will love the font. That remains with your advisors, and ultimately, with the people who read it.
