answer: |-
  **Mark:** Same vial, Elena. That's the problem. You've got MyoGen. In Patient A, it stops muscular dystrophy. In Patient B, a healthy marathoner, it pushes endurance to the 99th percentile. Chemically identical. If you give it to A, it's medicine. If you give it to B, it's doping. Why?

  **Elena:** Because the moral claim isn't in the vial. It's in the relationship between the intervention and the person's life. For A, MyoGen restores the capacity to participate in basic social life without extraordinary aid. For B, it's about surpassing the shared baseline of human effort.

  **Mark:** "Shared baseline." There it is. You're hiding behind statistics. "Normal" functioning is just the mean of the bell curve. Since when is the average morally sacred? If I can shift my kid from the 50th percentile to the 90th without side effects, why is that morally different than shifting them from the 10th to the 50th?

  **Elena:** Because the first move is about remedying a deficit that constitutes a harm. The second is about satisfying a preference. If the NHS covers MyoGen for everyone, you're not treating illness; you're subsidizing lifestyle optimization. That drains resources from actual pathology.

  **Mark:** Conceded: resource allocation is a pragmatic constraint, not a moral principle. But if the drug becomes cheap enough—say, pennies per dose—your distinction evaporates. If everyone can have it, why forbid it? You're left saying, "It's wrong because it's not typical." That's conservatism masquerading as ethics.

  **Elena:** It's not about typicality. It's about the *telos* of medicine. Medicine aims to alleviate suffering and restore function. It doesn't aim to maximize capacity. If you erase that line, you change the doctor's role from healer to service provider. And yes, that changes how parents view children.

  **Mark:** How?

  **Elena:** If I give MyoGen to my dystrophic kid, I'm saying, "I want you to have the same chances as everyone else." If I give it to my healthy kid, I'm saying, "Your natural endowment isn't good enough for my ambitions." It turns parenting into manufacturing.

  **Mark:** That's heavy-handed. Parents already "manufacture" outcomes. Private schools, tutoring, nutrition, piano lessons. We push kids up the curve constantly. You're just objecting because this time the intervention is biological. It's a bio-conservative bias, not a principled stand.

  **Elena:** I'm not saying education is morally neutral. But there's a difference between cultivating a mind and rewriting the physiological substrate. Education works *with* the child's agency. MyoGen works *on* the body, bypassing effort. That's why sports bans make sense.

  **Mark:** Do they? If MyoGen is safe and cheap, why ban it in sports? Let everyone take it. Then the race returns to training and talent, just at a higher baseline.

  **Elena:** Because sport isn't just about who crosses the line first. It's a celebration of natural human limits. If you pharmacologically shift the baseline, you're no longer testing human endurance; you're testing pharmacology budgets and dosage tolerance. You destroy the thing you're measuring.

  **Mark:** You're romanticizing "natural limits." We wear shoes. We swim in chlorinated pools. We eat optimized diets. Where do you draw the line? You say "restoring function," but function is a slippery norm. Is perfect pitch therapy for a tone-deaf musician? Is immunity to depression enhancement or treatment?

  **Elena:** I'll concede the line is fuzzy at the edges. Fuzzy doesn't mean nonexistent. There's a core distinction between addressing a malfunction and upgrading a functioning system. You're arguing that because we can't define "health" perfectly, we should pretend it doesn't matter.

  **Mark:** I'm arguing that "health" is doing no moral work here. What matters is welfare and fairness. If MyoGen makes people healthier—stronger, more enduring—and it's safe, withholding it is the harm. You're prioritizing a metaphysical comfort zone over actual well-being.

  **Elena:** And you're assuming well-being is just about capacity. But human flourishing involves grappling with limits. If you remove the friction of physical limitation, you alter the experience of achievement. It's not just "comfort." It's about what kind of society we become when we treat ourselves as projects to be optimized rather than lives to be lived.

  **Mark:** That sounds poetic, but it doesn't help the parent deciding whether to inject their kid. Do you tell them, "No, because they need to struggle"? Or do you say, "Yes, because it helps them"? You can't sustain the distinction when the stakes are real.

  **Elena:** I tell them, "We treat sickness. We don't engineer superiority." It's a normative boundary, not a statistical one.

  **Mark:** But you keep smuggling statistics back in. "Superiority" implies a norm. "Sickness" implies a deviation. You haven't answered the charge: you're just defending the status quo of the bell curve.

  **Elena:** I'm defending the idea that there's a difference between fixing a broken leg and giving someone steel legs. You think that's obvious. I think you think it's obvious too, until you follow your own logic to the end.

  **Mark:** I follow it fine. Steel legs are better if you need to run. You're just afraid of where the road goes.

  **Elena:** I'm afraid of losing the reason for the road.

  **Mark:** *(Sighs, stirs coffee)* We're going in circles. You think the line is moral; I think it's a fence around a statistical average.

  **Elena:** And you think welfare is the only metric. I think you're ignoring the social meaning of the act.

  **Mark:** Maybe. But if the NHS offers it tomorrow, I'm signing up. And I won't feel unethical.

  **Elena:** And I'll think you've missed the point.

  **Mark:** *(Checks watch)* Another coffee?

  **Elena:** No. I need to go grade papers. On ethics.

  **Mark:** Right. See you at the seminar.

  **Elena:** Try not to enhance yourself before then.

  **Mark:** No promises.
