  ### The Constitutional Work of Invented Continuity: A Theoretical Analysis of Baltic Restoration (1991)

  The 1991 restoration of independence in Estonia, Latvia, and Lithuania presents a unique anomaly in the study of nationalism. Unlike the dissolution of other Soviet republics, which proceeded on the basis of succession (creating new states from the ashes of the USSR), the Baltic states asserted a doctrine of *legal continuity*. They claimed they were not new states, but the same states that existed between 1918 and 1940, merely suppressed by an illegal occupation. This was not ceremonial; it dictated citizenship, property rights, and international standing. Analyzing this through Eric Hobsbawm's *Invented Tradition* and Benedict Anderson's *Imagined Communities* reveals both the utility and the limits of constructivist theory when faced with state-building that relies on legal fiction as a structural load-bearing wall.

  #### I. Applying the Theoretical Lens

  **Hobsbawm: The Function of Continuity**
  Hobsbawm defines "invented traditions" as practices of a ritual or symbolic nature, seeking to inculcate values and norms by repetition, which imply continuity with a suitable historic past. In the Baltic case, the actors constructing this tradition were the restored interwar political elites, legal scholars, and the diaspora, acting in concert with Western recognition bodies (such as the US and EC, which had never *de jure* recognized Soviet annexation).

  The options faced were binary: *Succession* (accepting the USSR as the predecessor state, implying a new beginning and potentially inclusive citizenship for all residents) or *Continuity* (asserting the 1940 annexation was null, implying the restoration of the pre-war citizenry). The evidence treated as authoritative was the text of the 1920 peace treaties with Soviet Russia, the pre-1940 constitutions, and the secret protocols of the Molotov-Ribbentrop Pact.

  Hobsbawm distinguishes between practices that invoke older continuity and those that are new rituals dressed in old clothing. The Baltic restoration is a hybrid that challenges Hobsbawm's typical classification. The reinstatement of flags and anthems fits the "new ritual in old clothing" model. However, the claim of *uninterrupted sovereignty* performs "hard constitutional work." It was not merely about social cohesion; it was the legal mechanism used to exclude post-1940 Soviet-era settlers from automatic citizenship. In Hobsbawm's framework, invented traditions usually serve to legitimize institutions or socialize members. Here, the "invention" (the legal fiction that the state never died) *constituted* the institution itself. If Hobsbawm expects invented traditions to be ornamental or socially cohesive, the Baltic case suggests a misclassification: this was a *juridical invention* with demographic consequences, not just a symbolic one.

  **Anderson: Modularity and Re-activation**
  Anderson's *Imagined Communities* posits that nations are culturally constructed artifacts, imagined as limited and sovereign, often spread via "modular" nationalism (pirating models of the nation-state). The Baltic case forces a choice between *reactivation* and *re-imagination*.

  Was the Baltic nation-state being re-imagined from scratch using an imported Westphalian template, or was a suppressed community being reactivated? The "thinness" of the 1918–1940 window (only two decades) strengthens the constructivist reading. There was no ancient, unbroken ethnic statehood to restore; there was a brief interwar experiment. However, Anderson's focus on print-capitalism and bureaucratic categorization illuminates the process. The "imagined community" was solidified not through novels or newspapers primarily, but through the bureaucracy of the *Aliens' Passport*. By categorizing residents into "citizens" (pre-1940 lineage) and "non-citizens" (Soviet settlers), the state bureaucratized the boundaries of the imagination.

  Regarding modularity: The Baltics did not simply adopt a generic Westphalian model; they adopted a *specific historical module* (the 1918–1940 republics). This suggests that modular nationalism can operate diachronically (reaching back in time) as well as synchronically (copying neighbors). The 20-year interval served as a functional anchor. For Anderson, the "newness" of the nation is key; for the Baltic jurists, the "oldness" was the prerequisite for legitimacy. The tension lies here: Anderson would argue the 1991 nation is new but imagines itself as old; the Baltic legal doctrine argued the nation *was* old and merely re-emerged.

  #### II. Reversing the Direction: What the Episode Does to the Theories

  **Stress-Testing Hobsbawm**
  The Baltic episode illuminates where Hobsbawm's framework is robust: the rapid, nearly identical adoption of flags, anthems, and state holidays across three distinct ethnic groups fits the "invented tradition" model of elite-driven standardization. It provided a ready-made legitimacy that bypassed the need to forge new symbols.

  However, the framework falls silent on the *legal fiction of uninterrupted sovereignty*. Hobsbawm treats tradition as a tool for social cohesion or elite legitimation within an existing order. He does not account for tradition acting as a *substitute for statehood*. In the Baltics, the "tradition" of continuity was not an addition to the state; it was the legal argument *for* the state's existence against the USSR. Hobsbawm's distinction between symbolic and functional tradition blurs here. If a tradition determines who holds a passport and who owns land, it transcends "ritual." The theory lacks the vocabulary to describe a tradition that functions as a constitutional clause.

  **Stress-Testing Anderson**
  Anderson's modular-nationalism model explains the speed of institutional adoption. The Baltics "pirated" their own past to fit the Westphalian mold, allowing for rapid international recognition. The bureaucratic categorization of citizenship is pure Anderson: the state defining the limits of the community through paperwork.

  However, Anderson misses the specific local mechanism of *legal restoration*. His model assumes the nation is imagined through cultural consumption (print, language). In 1991, the nation was defined through *international law doctrine* (the illegality of the Molotov-Ribbentrop Pact). Anderson's theory cannot easily adjudicate the difference between a "new" state and a "restored" one because, for him, all nations are ultimately constructed. He would likely view the continuity claim as just another "story" the nation tells itself. But this ignores the *material consequence* of that story: the continuity doctrine allowed the Baltics to reject Soviet debt and nationalize Soviet-era property in ways a "successor" state could not. Anderson's cultural lens is ill-equipped to handle the *juridical weight* of the narrative.

  **Theoretical Silence**
  Both theories remain silent on the *ethics* of the citizenship exclusion. Hobsbawm might view it as elite manipulation to secure power; Anderson might view it as drawing the "limited" boundaries of the community. Neither offers a normative framework to judge whether excluding 30% of the population (in Estonia and Latvia) was just or unjust. Furthermore, neither theory is designed to validate international-law doctrine. They can explain *why* the states claimed continuity, but they cannot adjudicate whether the claim was legally valid under the norms of 1940 or 1991. To force them to do so would be to misuse descriptive sociology as normative jurisprudence.

  #### III. Conclusion: Construction vs. Constitutive Necessity

  Is this case confirmation that nations are recent constructions, or does it reveal a limit? It is best read as a confirmation of construction, but with a critical caveat regarding *function*. The "nation" was indeed constructed through the selective revival of narratives (the 1918–1940 window). However, the functional role of the continuity doctrine reveals a limit in how we categorize "invention."

  In most cases, invented traditions are ornamental additions to a pre-existing political reality. In the Baltic restoration, the "invented" continuity was a **legal fiction without which the state itself could not be constituted** in its desired form. Without the claim of continuity, the citizenship laws would have collapsed into a successor-state model, and the property restitution would have lacked legal basis. Therefore, this case demonstrates that some "invented traditions" are not merely maintenance tools for a nation; they are the *architectural blueprints* of the state. The narrative did not just describe the community; it legally summoned it into existence.

  #### IV. Confidence Assessment

  *   **Claim 1: The continuity doctrine performed hard constitutional/demographic work (citizenship/property) rather than mere symbolic cohesion.**
      *   **Confidence: High.** The legal texts of the 1991 Citizenship Laws and the International Recognition documents explicitly tie status to the pre-1940 Republics. This is empirically verifiable.
  *   **Claim 2: Anderson's modularity explains the institutional speed but misses the juridical mechanism of restoration.**
      *   **Confidence: Medium-High.** Anderson's theory is robust on institutional mimicry, but his focus on cultural imagination makes it difficult for him to account for the primacy of international legal argumentation over cultural production in this specific instance.
  *   **Claim 3: Hobsbawm's framework misclassifies the Baltic continuity claim because it expects symbolic function rather than constitutive legal function.**
      *   **Confidence: Medium.** This is the point about which I am **least sure**. Hobsbawm acknowledges that invented traditions serve to legitimize institutions. One could argue that constituting the state *is* the ultimate legitimation. However, Hobsbawm generally treats the "past" invoked by traditions as largely mythical or exaggerated. In the Baltic case, the "past" (the 1918 state) was a concrete legal entity with archives. Distinguishing between "mythical continuity" (Hobsbawm's usual subject) and "legal restoration based on non-recognition of annexation" (the Baltic case) creates a tension in applying his theory that I am less confident in resolving definitively. The line between a "legal fact" (non-recognition of occupation) and an "invented tradition" (the feeling of unbroken identity) is porous in this specific historical moment.
