answer: |-
  ### BRAINSTORMING PASS: FAULT LINES & LIKELIHOOD

  1.  **The "Changed Game Form" Objection (Theorists):** You haven't solved the centipede paradox; you've just added a tax to thinking. Backward induction on the *meta-game* (choose depth + action) yields the same result as standard BI on the original game. This renders the contribution trivial. **Likelihood: 95%.**
  2.  **The "Identification" Objection (Behavioral/Econometrician):** Your parameter $\delta$ is observationally equivalent to altruism parameters or risk aversion in standard models. Without the stakes data, you identify nothing new. **Likelihood: 90%.**
  3.  **The "Circularity/Fixed Point" Objection (Epistemologist):** You define depth-$k$ as best-responding to depth-$(k-1)$. But depth is chosen endogenously. How do you guarantee a fixed point exists where my optimal $k$ matches your expectation of my $k$? **Likelihood: 85%.**
  4.  **The "Regress on Choice" Objection (Philosopher):** Choosing $k$ is itself a reasoning act. Do you choose $k$ using depth-$k$ reasoning? If so, regress. If not, why is that choice costless? **Likelihood: 80%.**
  5.  **The "Stakes Prediction" Objection (Experimentalist):** You predict cooperation collapses as stakes rise. Existing data (e.g., McKelvey & Palfrey) is mixed or contradictory. You admit you have no evidence. This invites destruction. **Likelihood: 80%.**
  6.  **The "Cost Equivalence" Objection (Theorist):** You claim payoff subtraction $\equiv$ error probability. This holds only under risk neutrality. If utility is non-linear, this breaks. **Likelihood: 70%.**
  7.  **The "Common Knowledge of $\delta$" Objection (Epistemologist):** If $\delta$ is common knowledge, why doesn't common knowledge of rationality recover the infinite hierarchy? **Likelihood: 60%.**
  8.  **The "LLM Opening" Objection (General):** Analogizing human rationality to transformer compute steps may alienate philosophers (functionalism disputes) and economists (trend-chasing). **Likelihood: 50%.**

  ---

  ### JOB MARKET PREP SHEET

  **Instruction:** Rehearse these replies until they are automatic. Do not deviate. If you hesitate on Objection 1, you will not get the job.

  #### 1. The Triviality Objection (Changed Game Form)
  *   **Who:** Senior Micro Theorist (Arms crossed, looking at the ceiling).
  *   **The Question:** "You've introduced a cost parameter $\delta$ into the utility function. Technically, you've just defined a new game form. Backward induction on *this* new game yields the 'take early' result. Haven't you just shown that if you tax thinking, people think less? Where is the non-trivial contribution?"
  *   **The Reply:** "I'm not changing the game form of the *interaction*; I'm modeling the deliberation cost required to *identify* the equilibrium of the original game. Standard epistemic game theory assumes the solution concept is free to compute. My result shows that even if agents are perfectly rational, the *computational cost* of verifying rationality makes Common Knowledge of Rationality (CKR) economically infeasible. The contribution isn't that costs matter—it's that the standard idealization of CKR is internally inconsistent when computation is scarce."
  *   **Soft/Bluff:** **Soft.** You are walking a line between "deliberation cost" and "utility modification." If they push on whether this is just a transformed game tree, you must concede the transformation but insist the *interpretation* of the nodes (reasoning steps vs. moves) is the novelty.

  #### 2. The Identification Objection (Altruism vs. Cost)
  *   **Who:** Behavioral Economist (Leaning forward, pen ready).
  *   **The Question:** "In the data, passing looks like altruism. In your model, passing looks like high $\delta$. Without your stakes prediction, what does $\delta$ identify that a social preference parameter doesn't? Isn't this just relabeling?"
  *   **The Reply:** "Social preference models assume agents *want* to pass. My model predicts agents *want* to take but stop reasoning before they verify it. The distinction is testable via process data (reaction times) or the stakes prediction. While I lack the stakes data currently, the structural difference is that altruism shifts preferences, whereas $\delta$ constrains the verification of dominance. I am offering a mechanism for *why* the preference appears, not just fitting the outcome."
  *   **Soft/Bluff:** **Bluffing.** You admit you have no stakes data. You are relying on "process data" you haven't collected. If they ask for a reduced-form test you can run *now*, you have none.

  #### 3. The Circularity Objection (Fixed Point)
  *   **Who:** Formal Epistemologist (Squinting at the board).
  *   **The Question:** "You define depth-$k$ against depth-$(k-1)$. But depths are chosen simultaneously in equilibrium. How do you know there exists a $k^*$ such that best-responding to $k^*-1$ yields $k^*$? Is this hierarchy even well-defined?"
  *   **The Reply:** "The equilibrium is defined on the meta-game of depth selection. I prove existence for the symmetric case by showing the best-response function in depth space is a contraction mapping for $\delta > 0$. The hierarchy is well-defined because the cost term breaks the infinite regress; the sequence of optimal depths converges to a finite fixed point."
  *   **Soft/Bluff:** **Soft.** Have the proof ready. If you haven't proven the contraction mapping formally, you are vulnerable. If you hand-wave this, the epistemologist will write you off as mathematically sloppy.

  #### 4. The Regress Objection (Choice of Thinking)
  *   **Who:** Philosopher of Action (Looking concerned).
  *   **The Question:** "You model agents choosing their reasoning depth. But choosing a depth requires reasoning. Do they choose $k$ using depth $k$? If so, you have a regress. If not, why is that choice costless?"
  *   **The Reply:** "I treat the choice of depth as a coarse, meta-cognitive heuristic—distinct from the fine-grained reasoning within the game. It's akin to setting a budget before shopping. The cost of setting the budget is negligible compared to the cost of the transactions inside. I'm modeling the bound on the *game analysis*, not the bound on the decision to analyze."
  *   **Soft/Bluff:** **Bluffing.** This is a standard philosophical objection (Elster, etc.). There is no clean solution. You are asserting a distinction without a formal model of the meta-choice. Hope they accept the "budget" analogy.

  #### 5. The Stakes Prediction Objection (Empirics)
  *   **Who:** Experimental Economist (Friendly but deadly).
  *   **The Question:** "Your Result 3 says cooperation collapses as stakes rise. Some literature suggests the opposite. You admit you have no evidence. Why should we trust a theoretical prediction that contradicts mixed empirical evidence without a test?"
  *   **The Reply:** "I am not claiming this is established fact; I am claiming it is a *falsifiable implication* that distinguishes my model from altruism models, which often predict stakes neutrality or positive correlation. I present this as a promise for future work. The theoretical contribution stands on Results 1 and 2; Result 3 is the empirical hook."
  *   **Soft/Bluff:** **Hard Concession.** Do not defend this. Admit it is untested. If you fight this, you look delusional.

  #### 6. The Cost Equivalence Objection (Technical)
  *   **Who:** Senior Micro Theorist (Second one, checking notes).
  *   **The Question:** "You claim payoff subtraction and error probability are equivalent up to rescaling. That requires risk neutrality. If agents are risk-averse, these diverge. Why assume neutrality?"
  *   **The Reply:** "You're correct that strict equivalence requires risk neutrality. However, the qualitative result—finite depth for $\delta > 0$—holds under general utility functions. The equivalence claim was a simplification for the exposition; the core theorem relies on the monotonicity of cost, not the specific functional form."
  *   **Soft/Bluff:** **Soft.** If you claimed equivalence in the paper text, you have an erratum. If you claimed it only in the talk, retreat to "qualitative robustness."

  #### 7. The CKR of Delta Objection (Foundations)
  *   **Who:** Formal Epistemologist (Follow-up).
  *   **The Question:** "If $\delta$ is common knowledge, and rationality is common knowledge, why don't they just compute the equilibrium depth together and recover the infinite hierarchy?"
  *   **The Reply:** "Because computing the equilibrium depth *is* the costly operation. Common knowledge of $\delta$ doesn't grant free computation. It's like knowing the price of gas doesn't let you drive for free. The cost applies to the *process* of deriving the implication, not the knowledge of the parameters."
  *   **Soft/Bluff:** **Soft.** This relies on distinguishing "knowing parameters" from "computing implications." It's defensible but requires precise language.

  #### 8. The LLM Opening Objection (Style)
  *   **Who:** General Audience (Whispering).
  *   **The Question:** (Implicit) "Is this just buzzwording?"
  *   **The Reply:** (Pre-emptive) "I use the LLM analogy only to motivate the *cost* intuition, not to claim human cognition is transformer-based. The formal model is standard game theory."
  *   **Soft/Bluff:** **Hard Cut.** See below.

  ---

  ### STRATEGIC DIRECTIVES

  **1. What to Concede in the First Three Minutes**
  Concede **Result 3 (Stakes Prediction)** immediately. Do not wait for the experimentalist to extract it.
  *Say:* "Result 3 generates a sharp prediction about stakes—that cooperation collapses as payoffs scale. I want to be clear: this is a theoretical implication I have not yet tested empirically. I present it as a target for future experimentation, not as an established fact."
  *Why:* This disarms the experimentalist. They cannot attack you for hiding weakness if you volunteer it. It makes you look rigorous rather than defensive.

  **2. The Single Reply That Must Land**
  **Objection 1 (Changed Game Form).**
  If you accept that you merely changed the game form, your paper is trivial. You must maintain that you are modeling the *epistemic conditions* for equilibrium, not the equilibrium of a modified game.
  *Key Phrase:* "I am not taxing the moves; I am taxing the verification of dominance."
  *Risk:* If you cannot formally distinguish "verification cost" from "move cost" in the math, you are bluffing. Ensure your model notation separates the reasoning stage from the action stage.

  **3. The Most Exposed Result (Cut to Slide/Promise)**
  **Result 3 (Unequal $\delta$ and Stakes).**
  This is your weakest link. It relies on untested empirical claims and introduces asymmetry that complicates the clean story of Results 1 and 2.
  *Action:* Put Result 3 on a single slide titled "Empirical Implications & Future Work." Do not derive it in the main body. Promise the test; do not claim the finding.

  **4. The Opening Analogy (LLMs)**
  **Cut it.**
  *Why:* You are going to an Econ/Phil department.
  *   **Philosophers** will hate the functionalist implication that human reasoning is compute-bound in the same way as transformers. It invites unnecessary metaphysical debate.
  *   **Economists** will smell trend-chasing.
  *   **Theorists** will think it's fluff.
  *Replacement:* Open with the **Centipede Paradox** itself. "Standard theory says take immediately. People pass. Why? I argue it's not because they are nice, but because thinking is expensive." Keep it classic.

  **5. The Dreaded Question**
  *   **The Question You Hope Nobody Asks:** "Can you choose $k$ without thinking?" (The Regress Objection).
  *   **The Question You SHOULD Dread:** "Is there a Nash Equilibrium in depths?" (The Existence Objection).
  *   **Why:** The Regress objection is philosophical; you can hand-wave it with "meta-cognition." The Existence objection is mathematical. If your best-response function in depth space does not have a fixed point, your model has no solution.
  *   **Action:** Check your proof of existence for the symmetric equilibrium depth *tonight*. If you don't have a proof, you are walking into a trap. If you cannot prove existence, Result 1 is void.

  **Final Assessment:**
  Your core insight (CKR is costly) is hireable. Your execution (equivalence claim, stakes data, LLM analogy) is vulnerable. Strip the buzzwords, concede the empirics, and fortify the existence proof. If you defend the "Changed Game Form" objection successfully, you survive. If you don't, you die.
