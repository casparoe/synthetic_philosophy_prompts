  *   **Why *not* the Fruit Machine?** The Fruit Machine was "mechanically set to pay out." In the context of the Eclipse verdict, this implies deterministic causation. Marta's psychology is explicitly *not* law-governed in that way.

  ### 5. The Tie-Breaker Case
  You predicted she will say **NTF**. This means the **Causal/Nomic Rule** and the **Truthmaker (Causal) Rule** agree. The **Deliberation Rule** disagrees (it would say True).

  To split the rules that *agree* (i.e., to test whether she cares more about **Laws** or about **Physical Setup**), you need a case where a mechanism is "set" but not "lawful."

