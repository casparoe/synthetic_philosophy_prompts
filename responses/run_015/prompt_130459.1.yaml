prompt: |-
  Consider the institutional practice governing psychiatric diagnosis and biomedical research funding across most Western health systems. A diagnosis of diabetes or hypertension can rest entirely on measurements taken at the physical stance — blood-glucose levels, arterial pressure, chemical markers — with no need to invoke evolutionary design or the patient's subjective experience. By contrast, current diagnostic protocols and peer-review panels treat mental disorders asymmetrically: a research proposal that studies depression solely through cytokine correlations and tissue statistics, without reference to disrupted neural function or to the patient's beliefs and feelings, is routinely rejected as failing to address the disorder itself; and clinicians are not permitted to diagnose depression from biomarkers alone. At the same time, the minority view that treats depression as literally nothing but a cytokine profile — symmetric with diabetes being a glucose profile — is dismissed not merely as empirically mistaken but as conceptually confused, as though its proponents have misunderstood what kind of phenomenon depression is. This asymmetry strikes me as philosophically loaded.

  What commitments about real patterns and explanatory stances does this practice presuppose? Does it commit the institution to the claim that mental disorders are real patterns only visible from the design stance or the intentional stance, and not from the physical stance alone? Or can a consistent physicalist accommodate the practice by arguing that mental patterns, though physically realised, are only tractable or meaningful when described at those higher levels? Reconstruct the implicit theory of real patterns that makes the asymmetry rational, distinguish what the practice strictly requires from what it merely accommodates, and assess whether the mental-metabolic distinction is philosophically justified or an unexamined institutional habit. Then explain what would have to change in diagnostic criteria and funding rules if we adopted a thoroughly symmetric framework that permitted physical-stance-only accounts of mental disorder — and whether such a framework is conceptually coherent, or whether it would dissolve the very phenomenon being studied.

  Please provide your answer in American English. Organise your response into the following sections, in this order: first, Reconstruction of the implicit stance-theory (approximately 350 words); second, Strict presuppositions versus compatible theories (approximately 300 words); third, Assessment of the mental-metabolic asymmetry (approximately 250 words); fourth, Consequences of a symmetric physical-stance framework (approximately 250 words).
