      *Refining the "Expertise" point:* Studies show philosophers are susceptible too (Machery, 2008; etc.), though some training helps. Don't promise immunity.
      *Refining the "Rulebook" point:* If the concept is moralized, "Intent" is the wrong lever. "Unauthorized Use" is better.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Ranking" is distinct. Make sure the "Fork" is central. (The user specifically asked for this).

      *Key Insight to emphasize:* If the Knobe effect is conceptual, you *cannot* debias your way out of it. You must change the question you are asking.

  9.  **Final Review against constraints:**
