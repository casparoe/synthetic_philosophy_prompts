      *   **Theoretical Lens:** Douglas Hofstadter's conception of the self as a "strange loop" (from *I Am a Strange Loop*).
      *   **Key Hofstadterian Concept:** The "I" is a self-referential symbol achieving "downward causal closure" over its neural substrate. (Meaning: The high-level pattern influences the low-level physics that sustain it).
      *   **The Conflict:** Phil retains memory/pattern (high-level), but the substrate (body/world) resets daily (low-level).
      *   **Specific Questions/Angles:**
