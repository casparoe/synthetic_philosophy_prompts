answer: |-
  This is a sophisticated observation that cuts to the heart of contemporary metametaphysics. You have correctly identified a configuration that frustrates the standard taxonomy of Chalmers (verbal disputes), Hirsch (quantifier variance), and Carnap/Thomasson (deflationism).

  The pattern you are describing—agreement on all non-ontological facts, shared semantic content, yet persistent disagreement on ontological claims driven by competing standards of application—is most precisely labeled in the current literature as a **Metaphysical Normative Dispute** (or simply **Metaphysical Normativism**).

  However, depending on which aspect of the disagreement you wish to foreground (the normativity, the structure, or the logic), there are three distinct labels in the literature that carve this joint. I will outline them, explain their boundaries, and distinguish them from the categories you have already ruled out.

  ### 1. Metaphysical Normativism (The Normative Label)
  This is the closest fit to your description of the participants' experience ("disagreeing about something normative — which standard one ought to apply").

  *   **The View:** Associated with Gideon Rosen ("Metaphysical Normativity," 2010) and David Enoch. The core thesis is that metaphysical claims (like "holes exist" or "numbers exist") are not descriptive claims about the world (which you noted the parties agree on) but are instead **normative claims** about how we ought to conceptualize or categorize the world.
  *   **The Configuration:**
      *   **Facts:** Agreed (Descriptive domain).
      *   **Meaning:** Agreed (Semantic domain).
      *   **Disagreement:** About the *norms* governing the application of ontological vocabulary (Normative domain).
  *   **Why it fits:** It captures the "substantive" feel without requiring a factual disagreement about the cheese or the math. Side A thinks the norm "Count perforations as entities" is correct; Side B thinks the norm "Do not count perforations as entities" is correct. They are arguing about the *law* of ontology, not the *facts* of the world.
  *   **Boundary:** This differs from **Deflationism** because Deflationists (like Thomasson) typically argue the dispute is *trivial* or *confused*. Normativists argue the dispute is substantive, but the substance is normative (like ethics) rather than descriptive (like physics). It differs from **Verbal Disputes** because the meaning of "exist" is stable; the disagreement is about whether the norms for using "exist" are satisfied.

  ### 2. Disputes about Fundamentality / Joint-Carving (The Structural Label)
  If your faculty members frame the disagreement as one about which view "better captures reality" or is "more precise," they are likely engaging in a dispute about **Fundamentality**, associated with Theodore Sider (*Writing the Book of the World*, 2011).

  *   **The View:** Sider argues that existence questions can be trivial (in the deflationary sense) while still being substantive if they are about **structure**. Two parties can agree on all the "worldly facts" (the cheese, the perforation) but disagree on which ontology **carves nature at the joints**.
  *   **The Configuration:**
      *   **Facts:** Agreed (The "book of the world" contains the same sentences).
      *   **Meaning:** Agreed (Both use the standard quantifier).
      *   **Disagreement:** About which ontology is **fundamental**. Side A thinks "Hole" is a fundamental category; Side B thinks only "Cheese" and "Perforation-shape" are fundamental.
  *   **Why it fits:** It explains why the dispute survives factual agreement. The disagreement isn't about *what is there* (in a thin sense) but about *what is basic*.
  *   **Boundary:** This differs from **Quantifier Variance** because Sider insists there is one *best* language (the one that carves joints). Hirsch says both languages are equally valid. It differs from **Verbal Disputes** because the disagreement is about the world's structure, not just our words.

  ### 3. Disputes over Ontological Bridge Principles (The Logical Label)
  If you want to describe the logical mechanism of the disagreement without committing to a metametaphysical stance, you can label this a dispute over **Ontological Bridge Principles**.

  *   **The View:** This terminology is often used in the context of **Grounding** and **Ontological Commitment** (e.g., by Kelly Trogdon or Louis deRosset).
  *   **The Configuration:**
      *   **Base Facts:** Agreed (e.g., "There is a perforation in the cheese").
      *   **Ontological Claim:** Disagreed (e.g., "Therefore, a hole exists").
      *   **The Pivot:** The disagreement lies in the **Bridge Principle** connecting the base to the ontology.
          *   Side A accepts: $\forall x (\text{Perforation}(x) \rightarrow \exists y (\text{Hole}(y) \land y=x))$
          *   Side B rejects: $\forall x (\text{Perforation}(x) \rightarrow \exists y (\text{Hole}(y) \land y=x))$
  *   **Why it fits:** It isolates the exact point of friction. They agree on the *antecedent* (the facts) and the *consequent's meaning* (existence), but they disagree on the *implication rule*.
  *   **Boundary:** This is a neutral, logical description. It doesn't tell you *why* they reject the principle (norms? structure? pragmatics?), but it precisely locates the disagreement so it doesn't collapse into a verbal dispute (which would imply they disagree on the meaning of the terms in the principle).

  ### Recommendation for "Carving at the Joints"

  If you need a single term for your dissertation or paper that captures the specific phenomenology you described (substantive, normative, non-verbal), I recommend using **"Metaphysical Normative Dispute."**

  However, to ensure precision and avoid collapsing into neighboring categories, you should define it with the following three constraints:

  1.  **Factual Invariance:** The disagreement persists across all possible worlds where the non-ontological facts (physics, math, modal profiles) are held fixed. (Distinguishes from standard Realism).
  2.  **Semantic Stability:** The parties assign the same truth-conditions to the non-ontological vocabulary and the ontological quantifier, rejecting quantifier variance. (Distinguishes from Hirsch/Chalmers).
  3.  **Normative Stakes:** The parties treat the disagreement as concerning the *correctness of a standard* for ontological commitment, rather than the discovery of a new fact. (Distinguishes from Deflationism).

  **How to distinguish it in text:**
  *   **Vs. Verbal Dispute:** In a verbal dispute, clarifying meaning dissolves the disagreement. In a Metaphysical Normative Dispute, clarifying meaning *reveals* the normative disagreement.
  *   **Vs. Quantifier Variance:** In variance, both parties are right relative to their scheme. In Normative Disputes, one standard is objectively correct (according to the participants).
  *   **Vs. Deflationism:** Deflationists say the dispute is shallow/insignificant. Normativists say the dispute is deep because it concerns the norms of representation, which are substantive.

  **A Neologism if needed:**
  If you find "Metaphysical Normativism" too tied to Rosen's specific metaethical analogies, you might coin **"Ontological Stringency Dispute."** This captures the "threshold" aspect you noted ("different stringency thresholds") without implying that existence itself is a normative property, only that the *criterion for applying the concept* is a matter of strictness.

  **Summary:** The established term is **Metaphysical Normativism**, but the most structurally precise description is a **Dispute over Ontological Bridge Principles** driven by **Competing Standards of Ontological Commitment**.
