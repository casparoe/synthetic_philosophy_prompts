      *   *Section 2 (Signaling/Cost):* Apply the Handicap Principle rigorously. If cost $\neq$ trait, signal is noise. Acknowledge the selection for privilege/resilience-to-poverty rather than medical virtue.
      *   *Section 3 (Consistency):* Propose "Ritual Initiation" as the unifying theory that resolves the safety/formation contradiction. But note the fragility of this coalition.
      *   *Section 4 (Epistemic/Measurement):* Confirm that objective measures threaten the *ritual*. The "folklore" is indeed part of the mechanism (common knowledge of the cost).
      *   *Section 5 (Game Theory):* Yes, it's a coordination failure/Cartel. Exit is costly because the signal is relative. Distinguishing signaling from exploitation: Look at who captures the value of the labor.

  10. **Final Review:** Does this answer the "implicit theory" request? Yes. Does it address the " Handicap Principle" nuance? Yes. Does it distinguish between rationalization and function? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to just say "it's exploitation." The user wants to understand the *defender's logic*. I must steelman the signaling argument before dismantling it with the cost-distribution critique. I need to make sure I distinguish between *what the defenders say* vs. *what the structure does*.

      *Refining the "Ritual" aspect:* This is crucial. Anthropology (Victor Turner) fits better than pure economics here. The "liminal space" explains the arbitrary tasks.

      *Refining the "Cartel" aspect:* This explains the resistance to shortening hours despite safety data. It's about maintaining the value of the attending's own credential.

      *Final Polish:* Ensure the distinction between "presupposed" and "compatible" in Q1 is sharp.

