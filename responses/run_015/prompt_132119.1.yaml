      *   *The User's Critique:* Cost falls on young/healthy/wealthy (no dependents), not necessarily the most dedicated.
      *   *Analysis:* If the cost filters for "ability to endure hardship without support" rather than "clinical dedication," the signal is noisy or biased.
      *   *Inversion:* It might select for *privilege* or *lack of alternatives* rather than *virtue*.
      *   *Defender's Blind Spot:* They assume "ability to endure" = "dedication." If the cost is financial/social, it selects for those insulated from those costs.
