answer: |-
  ### Phase 1: Candidate Dimensions and Rejections

  To construct a demarcation tool that respects the complexity of the "demarcation problem" (the philosophical challenge of distinguishing science from non-science), I considered several axes of evaluation. Below are the dimensions I rejected before settling on the final tree.

  1.  **"Is the claim falsifiable?"**
      *   *Rejection:* While central to Popper, this is too technical for a general reader to apply without bias. Readers often confuse "hard to test" with "impossible to test," and sophisticated pseudoscience often mimics falsifiability linguistically without accepting the consequences.
  2.  **"Does the claim rely on complex mathematics or data?"**
      *   *Rejection:* Irrelevant to truth value. Fomenko uses heavy mathematics; Plato uses dialogue. Complexity is a rhetorical shield, not a truth criterion.
  3.  **"Is the claim currently accepted by the majority of specialists?"**
      *   *Rejection:* This commits the appeal to authority fallacy and fails the "Wegener Test." Continental drift was rejected by the majority of geologists for decades. A demarcation tool must evaluate the *structure* of the claim, not its reception history.

  ### Phase 2: The Demarcation Flowchart

  This tree is designed for a general reader. It does not ask them to judge the *truth* of the claim, but rather the *behavior* of the claim and its proponents when faced with scrutiny.

  **Node 1:** Is the author asking you to believe this describes a physical event that actually occurred, or is it presented as a story meant to illustrate a moral or political truth?
  *   *If Physical:* Go to Node 2.
  *   *If Moral/Political:* **Leaf A.**

  **Node 2:** To accept this claim, must you believe that relevant experts are simply mistaken, or that they are actively coordinating to hide or falsify evidence?
  *   *If Mistaken/Disagree:* Go to Node 3.
  *   *If Hiding/Falsifying:* **Leaf B.**

  **Node 3:** If a new, reliable discovery contradicted the core of the theory, would the proponent accept the theory is wrong, or would they adjust the theory to explain why the discovery doesn't count?
  *   *If Accept Wrong:* **Leaf C.**
  *   *If Adjust/Explain Away:* **Leaf D.**

  ### Phase 3: The Leaves

  **Leaf A: Philosophical Allegory**
  *   *Definition:* Claims offered as normative or symbolic narratives rather than empirical history.
  *   *Obscuration Note:* Filing a claim here risks dismissing the possibility that the allegory preserves a distorted memory of real events (the "kernel of truth" problem), treating literature as purely abstract when it may be grounded.

  **Leaf B: Closed-System Pseudohistory**
  *   *Definition:* Claims that rely on a conspiracy of silence or forgery to sustain themselves against expert consensus.

  **Leaf C: Provisional Hypothesis**
  *   *Definition:* Claims that assert physical reality but submit to empirical refutation.
  *   *Obscuration Note:* Filing a claim here risks granting legitimacy to ideas that are empirically testable in principle but wildly improbable in practice, potentially wasting investigative resources on dead ends that look scientifically "honest."

  **Leaf D: Ad Hoc Reconstruction**
  *   *Definition:* Claims that appear scientific but immunize themselves from contradiction by constantly adding exceptions or auxiliary assumptions.

  ### Phase 4: Case Testing

  **1. Plato's Atlantis (as written in *Timaeus* and *Critias*)**
  *   *Node 1:* Physical or Moral? Plato frames it as a dialogue about the ideal state. While Critias insists it is "true history," the philosophical context suggests a moral exemplar.
  *   *Path:* Node 1 → **Leaf A (Philosophical Allegory).**
  *   *Result:* Accurate. It separates Plato from those who claim Atlantis is a lost physical continent today.

  **2. Anatoly Fomenko's New Chronology**
  *   *Node 1:* Physical? Yes (claims dates are wrong).
  *   *Node 2:* Experts mistaken or hiding? Fomenko claims historians and astronomers have falsified records and conspired to stretch the timeline.
  *   *Path:* Node 1 → Node 2 → **Leaf B (Closed-System Pseudohistory).**
  *   *Result:* Accurate. The conspiracy requirement is the primary demarcation.

  **3. Ancient-Astronaut Reading of Pakal's Sarcophagus**
  *   *Node 1:* Physical? Yes (claims aliens visited).
  *   *Node 2:* Experts mistaken or hiding? Proponents claim archaeologists ignore the "obvious" technology in the carving, implying incompetence or suppression.
  *   *Node 3:* Falsifiable? Proponents typically argue that any contradictory iconography is "symbolic" only when it suits them, but "literal" when it supports aliens.
  *   *Path:* Node 1 → Node 2 → **Leaf B (Closed-System Pseudohistory).** (Note: If the proponent admits experts are just mistaken, it moves to Node 3. Usually, this claim relies on the idea that mainstream science *cannot* admit the truth, pushing it toward Leaf B or D). Let's assume a standard proponent: They claim suppression. **Leaf B.**

  **4. Control: Wegener's Continental Drift (c. 1920)**
  *   *Node 1:* Physical? Yes.
  *   *Node 2:* Experts mistaken or hiding? Wegener argued geologists were mistaken about the rigidity of the crust, not that they were forging data.
  *   *Node 3:* Falsifiable? Yes. Wegener explicitly sought data (paleoclimate, fossils) that could prove him wrong.
  *   *Path:* Node 1 → Node 2 → Node 3 → **Leaf C (Provisional Hypothesis).**
  *   *Result:* **Success.** The tree separates Wegener from Fomenko based on the *nature of the opposition* (error vs. conspiracy) and *willingness to be falsified*.

  **5. Control: Norse Settlement at L'Anse aux Meadows (pre-1960)**
  *   *Node 1:* Physical? Yes.
  *   *Node 2:* Experts mistaken or hiding? Before Helge Ingstad's dig, the claim was that Sagas were myth. Proponents argued experts were dismissing textual evidence, not forging it.
  *   *Node 3:* Falsifiable? Yes. Excavation could have found nothing.
  *   *Path:* Node 1 → Node 2 → Node 3 → **Leaf C (Provisional Hypothesis).**
  *   *Result:* **Success.** It classifies as a hypothesis that became established upon verification.

  **Constraint Check:** The tree successfully separates the controls (Wegener, L'Anse aux Meadows) from Fomenko. The critical divider is Node 2: the accusation of active falsification/conspiracy versus mere error or skepticism.

  ### Phase 5: Empty Combinations

  There are eight logical paths through the tree (2x2x2). Three are occupied. Two are empty and significant.

  1.  **Empty Cell: Moral/Symbolic + Experts Hiding + Falsifiable.**
      *   *Diagnosis:* **Incoherent.** One does not typically need a conspiracy to suppress a moral metaphor, nor can a metaphor be "falsified" by physical discovery in the same way a historical claim can. This combination suggests a paranoid reading of literature.
  2.  **Empty Cell: Physical + Experts Mistaken + Unfalsifiable (Adjusts to explain away).**
      *   *Diagnosis:* **Unattractive (Degenerating Research Programme).** This is Lakatos's "degenerating shift." It exists (e.g., late-stage phlogiston theory), but in the context of *contested pasts*, this usually migrates to Leaf D. It is rare for a claim to admit experts are merely mistaken yet refuse to allow any evidence to count against it; usually, if you admit experts are just wrong, you invite them to check your work. If you refuse the check, you implicitly accuse them of bad faith.

  ### Phase 6: Confidence and Vulnerability

  **Confidence Statement:**
  I am moderately confident (approx. 70%) that these dimensions capture the sociological and epistemological boundaries relevant to a general reader. However, the demarcation problem is not a binary switch but a cluster concept. There will always be edge cases (e.g., Whitley Strieber's *Communion*, which blends memoir, psychology, and literal claim) that stall at Node 1.

  **Most Attackable Node:**
  A specialist would most likely attack **Node 2** ("To accept this claim, must you believe that relevant experts are simply mistaken, or that they are actively coordinating to hide or falsify evidence?").

  *Reason for Vulnerability:* Legitimate scientific revolutionaries often *feel* persecuted even when no conspiracy exists. Thomas Kuhn noted that paradigm shifts are resisted by institutions. A proponent like Wegener might *feel* the establishment is suppressing him, even if they are just skeptical. Relying on the proponent's *accusation* of conspiracy can be subjective. A more robust version would require evidence of the conspiracy, but a general reader cannot verify that. This node relies on the *necessity* of the conspiracy for the claim to hold, which is subtle. If Fomenko says, "They aren't conspiring, they are just incredibly incompetent," he might try to bypass Node 2, though his writings usually imply the former. This node is the weakest link between "crank" and "maverick."
