      *   *Refining the "Rentier" point:* In Marxism, the rentier isn't "exploited." They are part of the exploiting class (or a fraction of it). The user said "in a broad sense yes." I need to correct this firmly.
      *   *Refining the "SWE" point:* This is the crux. Many think high pay = no exploitation. I need to explain that exploitation is structural (Surplus Value), not relative to poverty.
