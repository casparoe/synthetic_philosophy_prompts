      *   *Corollary:* You cannot be alienated in the Marxist sense without being exploited (activity turned to external ends). You can be exploited without feeling alienated (false consciousness), but structurally, they stem from the same root.

  6.  **Addressing the Specific Constraints:**
      *   *Which verdicts to drop?*
