answer: |-
  Your intuition is sharper than the textbook because you are sensing a shift in capitalism that Marx described but couldn't fully map: the move from *formal subsumption* (boss tells you what to do) to *real subsumption* (the logic of capital gets inside your head, your style, and your social relations).

  You are looking for a link between Exploitation (the economic mechanic) and Alienation (the phenomenological experience). In orthodox Marxism, they are linked by the wage relation. But your cases (freelancers, streamers, coops) show that the wage relation is no longer the only container for these dynamics.

  Here is the principle that captures your intuitions, the verdicts it forces you to change, and the predictions you asked for.

  ### The Unifying Principle: Heteronomous Valorization

  **Principle:** Exploitation and Alienation are not independent dimensions; they are the structural and experiential sides of the same coin. They occur simultaneously when human activity is **subordinated to a logic of valorization external to the worker's own needs and intentions.**

  *   **Exploitation** is the *economic transfer*: The value (surplus, data, affect, style) generated by your activity is appropriated to serve an external end (profit, market share, algorithmic growth) rather than your own reproduction or satisfaction.
  *   **Alienation** is the *phenomenological cost*: Because the activity serves an external end, the process and product become hostile forces that dictate your behavior, severing the link between your intention and the outcome.

  **The Rule:** If you are not serving an external logic of accumulation (Heteronomous Valorization), you cannot be alienated in the Marxist sense (only stressed or tired), and you cannot be exploited (only perhaps disadvantaged). If you *are* serving that external logic, you are both exploited and alienated, regardless of your salary or ownership status.

  ---

  ### The Verdicts You Must Drop

  To make your framework hang together under this principle, you must correct three of your current verdicts.

  **1. The Senior Software Engineer**
  *   **Your Verdict:** Exploited? No. Alienated? Yes.
  *   **Correction:** **Exploited? Yes.**
  *   **Why:** High wages do not negate exploitation; they merely reflect the high cost of reproducing skilled labor power. If her code is proprietary and generates profit for shareholders that exceeds her compensation (which it does, or the company wouldn't exist), she is producing surplus value for an external logic. Her high salary is a "bribe" of stability, but the *structure* is still heteronomous. She is alienated *because* she is exploited.

  **2. The Rentier**
  *   **Your Verdict:** Exploited? Yes (broad sense). Alienated? No.
  *   **Correction:** **Exploited? No.**
  *   **Why:** This is the hardest pill to swallow. In Marxist terms, the rentier is the *agent* of exploitation, not the victim. He extracts surplus value created by others (tenants/workers). He is not subordinated to an external logic of production; he *is* the external logic. He cannot be alienated from labor because he does not labor. He is "free" in the worst possible way: free from the necessity of work because others bear that burden for him.

  **3. The Worker-Owned Coop**
  *   **Your Verdict:** Exploited? No. Alienated? Yes.
  *   **Correction:** **Exploited? Yes (Structurally).**
  *   **Why:** You correctly identified they are alienated by the market. But under the principle of Heteronomous Valorization, if the market forces them to cut corners and waste food to survive competition, the *market* is exploiting them. They are self-exploiting to feed the external logic of capital accumulation. They own the bakery, but they do not own the market rules. The "external logic" is no longer a boss, but it is still Capital.

  ---

  ### The Sessional Lecturer: Saved or Killed?

  **Verdict:** **Saved.**
  **Diagnosis:** **Marxist Alienation (not just burnout).**

  **Why:** Burnout is a depletion of energy; Alienation is a distortion of purpose.
  If the lecturer were overworked but teaching exactly what she believed was right for the students, that would be burnout. But you specified that "metrics and student evaluations shape what she can say."
  This is **Heteronomous Valorization**. Her intellectual capacity (her "species-being") is being mined to produce a metric (student satisfaction scores) that serves the university's administrative ranking and funding, not the transmission of knowledge.
  *   **Exploitation:** The university extracts her "intellectual personality" to boost its brand value without paying for the long-term security required to sustain that personality (rolling contracts).
  *   **Alienation:** She becomes a performer of education rather than an educator. The syllabus is no longer hers; it belongs to the metric.
  The principle confirms this is structural alienation, not just psychological stress.

  ---

  ### Prediction: The AI Data Annotator

  **Case:** Works from home, owns laptop, paid per task, judgment mined/discarded by engineers.

  **Prediction:**
  *   **Exploited? Yes.**
  *   **Alienated? Yes.**

  **Analysis using the Principle:**
  1.  **Exploitation:** The "piece rate" payment is designed to be lower than the value her judgment adds to the model. The model (owned by the platform) becomes more valuable; her labor disappears into the weights of the algorithm. She produces the intelligence, the platform captures the value. The fact that she owns her laptop is irrelevant (like a weaver owning a spindle in 1800); the *means of valorization* (the model/platform) is owned by capital.
  2.  **Alienation:** This is the peak of alienation. She is not just separated from the product; she is separated from her own *judgment*. Her human capacity to distinguish/categorize is "mined" (as you put it) and then discarded. She is a "ghost in the machine," training her own replacement. Her activity is purely instrumental to an external logic (AI training) that she cannot see or influence.

  ### Summary of the Shift

  Your gut was right to sense that **Alienation** is more widespread than **Exploitation** in the modern economy, but only because we define Exploitation too narrowly (as "low wage" or "factory conditions").

  If you adopt **Heteronomous Valorization** as your principle:
  1.  **Exploitation** is everywhere capital logic dictates production (including coops and gig work).
  2.  **Alienation** is the inevitable psychological shadow of that exploitation.
  3.  **Privilege** (high SWE salary, Rentier status) masks exploitation but does not remove it (except for the Rentier, who is the exploiter).

  This makes your framework consistent: You cannot have Marxist Alienation without Exploitation, because Alienation is the *feeling* of your life being used as fuel for someone else's accumulation.
