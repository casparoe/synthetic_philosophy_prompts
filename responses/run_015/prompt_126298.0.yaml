          *   *Alienation:* The experience of your activity becoming an *external force* that dictates your behavior, rather than an expression of your will.
          *   *Link:* Exploitation is the *mechanism* (extraction); Alienation is the *phenomenology* (experience of loss of self/control).
      *   *Refining the Principle:* **Real Subsumption of Human Capacity.**
          *   Capital (or market logic) subsumes human activity.
          *   **Exploitation** occurs when the *output* of your activity is appropriated by a logic external to your needs (profit/market survival), regardless of wage status.
          *   **Alienation** occurs when the *process* of your activity is dictated by external metrics/requirements, severing the link between intention and outcome.
          *   *Connection:* You are alienated *because* your capacity is being exploited (extracted for external ends). If there is no extraction of value for an external logic, there is no alienation (in the Marxist sense, not just psychological stress).

