          5.  Rentier: Exp (Yes - "broad sense"), Ali (No). *Non-laborer.* Extracts surplus but doesn't labor, so can't be alienated from labor.
          6.  Streamer: Exp (Yes - Platform), Ali (Yes). *Gig/Digital labor.* Platform extracts value; performance creates self-alienation.
