      *   *Outcome-Blindness (1)* kills most standard historical explanations which are inherently teleological.
      *   *Decision:* **Outcome-Blindness (The Erasure Test).** It strikes at the heart of retrospective history. Most historical explanation *is* reasoning from the end. Demanding it be valid without the end excludes most traditional historical methods.

