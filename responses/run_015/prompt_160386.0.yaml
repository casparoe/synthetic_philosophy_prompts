  4.  **Drafting Section 2: Non-negotiable vs. Negotiable:**
      *   *Non-negotiable:* Must relate directly to the *prospective* purpose. Transportability (11), Failure Conditions (10), and Outcome-Independence (1/8) are crucial. If you can't transport it or falsify it, it's not evidence. If it relies on knowing the end, it's not predictive.
      *   *Negotiable:* Grain stability (7) is nice but not strictly necessary for prediction. Anti-deflation (12) is a preference for narrative coherence over parsimony. Documentary shadow (6) is ideal but often impossible to fully correct; a "best effort" clause works.

  5.  **Drafting Section 3: Incompatibilities (The Hard Part):**
      *   *Trade-off 1: Narrative Unity (12) vs. Conjunctive Bookkeeping (4).* A smooth story hides the fragility of conjunctive probabilities. To show the math (4), you often break the story (12).
      *   *Trade-off 2: Documentary Shadow (6) vs. Outcome-Blindness (1).* To know the archive is biased by O, you must know O. You cannot fully correct for the shadow while pretending not to know the outcome. This is a genuine epistemic tension.
      *   *Trade-off 3: Transport License (11) vs. Specificity.* The more specific the explanation of C (to avoid hindsight), the harder it is to transport to L.
