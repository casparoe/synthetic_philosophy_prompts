answer: |-
  ### I. Restatement and Triage of Desiderata

  Your list mixes epistemic constraints with stylistic preferences. For a theory of explanation to support *prospective* inference, it must treat the historical case as a data-generating process, not a story. Below are the repaired requirements, mapped to your draft.

  **1. Outcome-Independence (Merges 1 & 8).**
  *Requirement:* The causal weight assigned to any factor must not increase conditional on knowledge of O.
  *Motivation:* Hindsight bias (the "I knew it all along" effect). If the explanation of the 2010 UK Coalition's survival relies on knowing Cameron stayed Prime Minister, it cannot predict the 2024 Coalition's fate.
  *Status:* **Genuine.** Your "erasure" and "reverse-narration" tests are the same requirement: checking for teleological contamination.

  **2. Modal Explicitness (Merges 2, 4, & 9).**
  *Requirement:* The account must specify the probability space at each juncture, including non-events and conjunctive fragility.
  *Motivation:* Narrative flow disguises low-probability conjunctions. To predict a live coalition's collapse, you need to know if survival required *both* Party A and Party B to suppress rebellion (conjunctive), not just that they "cooperated."
  *Status:* **Genuine.** "Symmetric treatment of non-events" is just part of mapping the probability space.

  **3. Archival Reflexivity (From 6).**
  *Requirement:* The theory must model the selection bias of the evidence base as a function of O.
  *Motivation:* Archives of the 1940 Fall of France are denser than for 1939 because France fell. If you don't correct for this, you over-weight documented causes.
  *Status:* **Genuine,** but epistemically difficult (see Section III).

  **4. Calibration (From 3).**
  *Requirement:* Confidence levels must match the frequency of O in the *ex ante* reference class.
  *Motivation:* Prevents treating a 1-in-10 outcome as a deterministic tendency.
  *Status:* **Genuine.**

  **5. Falsifiability (From 10).**
  *Requirement:* The account must specify evidence that would invalidate the causal claim.
  *Motivation:* Prevents accommodating any archive (the "just-so story" problem).
  *Status:* **Genuine.**

  **6. Transportability (From 11).**
  *Requirement:* The account must identify invariant causal features separable from idiosyncratic context.
  *Motivation:* This is your core purpose. Without this, the explanation is idiographic and useless for case L.
  *Status:* **Genuine.**

  **7. Discriminatory Power (From 5).**
  *Requirement:* The explanatory model must fail to fit cases where O did not occur.
  *Motivation:* If your model explains both coalition survival and collapse equally well, it explains nothing.
  *Status:* **Genuine.**

  **8. Representational Form (From 7 & 12).**
  *Requirement:* [Triage Needed]
  *Status:* **Prejudice.** "Grain stability" (7) is not required; mechanisms often operate at specific levels. "Anti-deflation" (12) is dangerous for your purpose. A unified narrative often *hides* contingency to create coherence. For prospective use, a causal graph or weighted factor list is often superior to a "unified account." I recommend dropping 12.

  **Missing:** **Mechanism Invariance.** You need a requirement stating that the mechanism linking cause to effect in C must be physically/socially possible in L.

  ### II. Negotiability

  **Non-Negotiable (for Prospective Inference):**
  *   **Outcome-Independence:** If the explanation relies on knowing the end, it is not evidence for an unresolved case.
  *   **Transportability:** If you cannot specify what transfers to L, the purpose is failed.
  *   **Falsifiability:** Without this, the account is consistent with any outcome and predicts none.

  **Negotiable:**
  *   **Archival Reflexivity:** *Condition for binding:* Becomes non-negotiable only if the archive is known to be heavily purged or manufactured post-O (e.g., Soviet records). In standard democratic cases (like the UK Coalition), a "best effort" disclosure suffices.
  *   **Calibration:** *Condition for binding:* Becomes non-negotiable if you claim probabilistic prediction. If you claim only "possibility" or "plausibility," strict base-rate matching is less critical.
  *   **Representational Form (Anti-deflation):** *Condition for binding:* Becomes binding only if the audience requires a narrative for persuasion rather than a model for inference. For your stated purpose (reasoning input), this is a preference, not a requirement.

  ### III. Incompatibilities and Retreat

  The full list is **unsatisfiable**. There are two structural tensions:

  **1. The Epistemic Tension (Archival Reflexivity vs. Outcome-Independence).**
  To correct for the "documentary shadow" (Req 3), you must know how O shaped the archive. To satisfy Outcome-Independence (Req 1), you must reason as if you do not know O. You cannot fully diagnose the bias introduced by the outcome while pretending the outcome is unknown.
  *   *Resolution:* You must prioritize Outcome-Independence. Archival Reflexivity must be downgraded to a transparency disclosure ("We know O shaped this, here is how we mitigated it") rather than a full correction.

  **2. The Narrative Tension (Transportability vs. Anti-Deflation).**
  A "causally unified account" (Req 12) relies on stitching events into a coherent whole. This stitching often smooths over the specific, transferable variables needed for Transportability (Req 6). A story about "national spirit" travels poorly; a model about "whip vote counts" travels well.
  *   *Resolution:* You must sacrifice Anti-Deflation.

  **The Retreat:**
  You cannot claim to produce a "Retrospective Case Explanation" in the traditional historical sense. You must retreat to producing a **"Causal Model Extracted from a Case."**
  *   *Stop claiming:* That the output is a coherent historical narrative or that it fully corrects for archival bias.
  *   *Start claiming:* That the output is a structured set of contingent causal relations, stripped of narrative glue, licensed for transfer.

  ### IV. The Exclusionary Requirement

  **Outcome-Independence (The Erasure Test).**

  This requirement does the most work because it excludes the vast majority of established historical methods. Standard process-tracing and narrativist approaches are inherently teleological; they select evidence *because* it leads to O. Demanding that the causal weighting hold up if O is erased rules out any method that relies on the "significance" of an event being derived from its consequences. It forces the historian to act like a contemporary observer, which is antithetical to the retrospective discipline. It is the gatekeeper that converts history into social science.

  ### V. Scorecard

  **Covering-law/Statistical:** Fails Transportability. Base rates (Req 4) are met, but single-case mechanisms are ignored. Good for calibration, useless for specific coalition dynamics.
  **Mechanism/Process-tracing:** Fails Outcome-Independence. Excellent detail on *how* O occurred, but typically selects evidence based on known outcome. High risk of hindsight bias.
  **Counterfactual Difference-making:** Strong on Modal Explicitness (Req 2). Explicitly tests non-events. However, often struggles with Archival Reflexivity as counterfactuals rely on existing records.
  **Narrativist:** Fails Transportability and Outcome-Independence. Coherent stories (Req 12) travel poorly to new cases and rely on teleological closure. Best for understanding meaning, worst for prospective inference.

  *Verdict:* Only a modified Counterfactual/Mechanism hybrid satisfies the non-negotiables, provided it sacrifices narrative unity.
