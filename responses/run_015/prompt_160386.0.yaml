      *   5. *Negative-control/swap test:* Apply to cases where O didn't happen.
      *   6. *Documentary-shadow correction:* Account for archival bias caused by O.
      *   7. *Grain stability:* Causal claim holds across levels of analysis.
      *   8. *Reverse-narration test:* Does it read as naturally backwards as forwards? (Hindsight bias check).
