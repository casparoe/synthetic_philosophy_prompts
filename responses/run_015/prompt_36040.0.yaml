      *   *Sentence 5:* "He closes the essay saying that the effectiveness of mathematics is now so well established that physicists going forward are entitled to treat mathematical elegance as a reliable guide to physical truth, and that it's only a matter of time before the rest of pure mathematics, most of which currently has no application, finds its physical home."
