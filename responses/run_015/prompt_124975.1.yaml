answer: |-
  This is a sharp observation. You've stumbled onto one of the most technical debates in modern metaphysics while trying to navigate a family dispute. It is completely normal to feel like you might be rationalizing; the literature is designed to make you feel exactly that uncertainty.

  Here is a Frankfurt-style case built to your specifications, followed by the technical breakdown, the "Settled Character" analysis, and the literature status check.

  ### The Case: "The Unconscious Safeguard"

  **The Setup:**
  Elena is a high-powered executive. She has a chance to bury a report that would incriminate her department but save her team's jobs. She decides to bury it. She does so coolly, deliberately, and for reasons she endorses (loyalty to her team).

  **The Constraint (No Alternatives):**
  Elena has a specific, deep-seated psychological structure. She is so intensely identified with her role as "Protector of the Team" that it is psychologically impossible for her to *choose* to sacrifice them. It's not that she is physically restrained; it's that her will is structurally incapable of endorsing that option. If she were to show any sign of wavering (a "flicker" of doubt), a subconscious anxiety mechanism would kick in. This anxiety would be so overwhelming that she would bury the report *just to make the anxiety stop*, rather than out of loyalty.

  **The Actual Sequence:**
  Elena does not waver. She feels no anxiety. She buries the report purely out of loyalty. The anxiety mechanism never activates.

  **The Intuition:**
  We want to hold Elena responsible. She acted on her own values. The fact that she *couldn't* have sacrificed her team (due to her psychology) doesn't seem to excuse the act of burying the report.

  ---

  ### Technical Breakdown

  Here is how this case meets your constraints and handles the philosophical objections.

  **1. What PAP Says**
  The **Principle of Alternative Possibilities (PAP)** states: *An agent is morally responsible for an action only if they could have done otherwise.*
  In this case, Elena could not have done otherwise. If she tried to release the report, her psychology (the anxiety mechanism) would have forced her to bury it. Therefore, PAP says Elena is **not responsible**.

  **2. What the Intuition Says**
  Most people intuit that Elena **is responsible**. In the actual sequence of events, she acted freely based on her own values. The fact that a backup mechanism *would have* forced her hand if she hesitated seems irrelevant because it didn't actually touch her.

  **3. The Leeway Incompatibilist Objection (The Dilemma)**
  A Leeway Incompatibilist (someone who thinks responsibility requires free will *and* that free will requires alternatives) will attack the "Sign of Wavering."
  *   **Horn 1:** If the sign of wavering is *determined* (she physically couldn't hesitate), then you have smuggled determinism into the case. You haven't proven responsibility exists without alternatives; you've just assumed determinism is compatible with responsibility.
  *   **Horn 2:** If the sign of wavering is *not determined* (she could have hesitated), then she *did* have an alternative possibility (hesitating). Therefore, PAP is not violated.

  **4. The Non-Robust Alternative (The Flicker)**
  To block the Dilemma, we concede there is an alternative, but argue it is **non-robust**.
  *   **The Alternative:** Elena could have hesitated (triggering the anxiety mechanism).
  *   **Why it's Non-Robust:** Hesitating does not give her the power to *save the report*. It only changes *why* she buried it (Loyalty vs. Anxiety Relief). Since moral responsibility is usually about the action (burying the report) and the actual motivation (Loyalty), the mere possibility of doing the *same thing* for a *different, lesser reason* is not a "robust" alternative. It's a "flicker of freedom." It's not enough to ground the kind of responsibility PAP defenders need.

  **5. The Work-Doing Feature**
  The feature doing the work is **Actual Sequence vs. Alternative Sequence**.
  Frankfurt cases shift the focus from *what could have happened* (Alternative Sequence) to *what actually happened* (Actual Sequence). In the Actual Sequence, Elena's action issues from her own reasons without interference. The existence of a counterfactual blocker is irrelevant to the actual history of the action.

  **6. The Removal Test**
  If you remove the **Anxiety Mechanism** (the guarantee that she couldn't do otherwise), the case collapses into a standard free choice.
  If you remove the **Loyalty Motivation** (making her act *only* to avoid anxiety in the actual sequence), she looks compelled/unfree, and we stop holding her responsible.
  The case only works if *both* are present: The guarantee that she couldn't do otherwise, *plus* the fact that she acted from her own authentic will in the actual sequence.

  ---

  ### The "Settled Character" Version (Your Brother's Defense)

  You asked for a version where the constraint is the agent's **own settled character** rather than an anxiety mechanism. This is effectively your brother's argument: *"You know how I am; I couldn't have done otherwise."*

  **Does this version do the job?**
  **Honest Answer:** It is significantly weaker than the "Anxiety Mechanism" case, and it risks collapsing into a description of a bad person rather than a philosophical proof.

  **Why it struggles:**
  1.  **The Determinism Conflation:** In the "Anxiety Mechanism" case, the constraint is a specific, localized counterfactual. In the "Settled Character" case, the constraint is global. If your brother's character made the action inevitable, that sounds like **Determinism**.
      *   *The Trap:* If you argue "His character made him do it, but he's still responsible," an Incompatibilist will say, "You are just asserting Compatibilism. You haven't proven it." The Frankfurt case is supposed to work *even if* Incompatibilism is true. The Character version assumes Compatibilism is true to begin with.
  2.  **The "Bad Person" Collapse:** If someone says, "I'm just a selfish person, I couldn't help it," and we say, "You are responsible," we aren't necessarily using Frankfurt logic. We are just saying, **"Your character is the problem, not an excuse."**
      *   In philosophy, this distinguishes between **Compulsion** (I want to stop but can't) and **Volitional Necessity** (I cannot want to stop).
      *   If your brother *identifies* with his shitty action (he thinks he was right, or he doesn't care), that is Volitional Necessity. He is responsible *because* it reflects who he is.
      *   If your brother *hated* himself for doing it but "couldn't stop," that looks like Compulsion/Addiction. That *is* an excuse.

  **Verdict on the Brother:**
  The "Settled Character" version works *only if* you can show that his character is **responsive to reasons** in other contexts, but he simply chose not to listen to them in this one. If his character is rigidly fixed such that *no* reason could have swayed him, you are in the realm of pathology, and his defense gains traction.
  However, for ordinary moral blame, we generally reject "I'm just built this way" as an excuse because we assume adults have some capacity to shape their character over time (the **Tracing Principle**).

  **So, does it help you?**
  Yes, but not by proving he "could have done otherwise." It helps you argue that **"Could have done otherwise" is not required for blame.** You can say: *"Even if you couldn't have done otherwise given who you are, you are responsible because that action came from YOU, not from a gun to your head."*

  ---

  ### Literature Status: Settled vs. Contested

  You need to know where the ground is solid and where it is shifting before you talk to your brother.

  **1. What is Settled (Consensus View)**
  *   **PAP is False:** The majority of contemporary philosophers accept that Frankfurt cases successfully refute the Principle of Alternative Possibilities. You do *not* need the ability to do otherwise to be morally responsible.
  *   **The "Flicker" Concession:** Most defenders of PAP concede that there are "flickers" of alternative possibilities in Frankfurt cases, but argue they are too trivial to ground responsibility. The debate has shifted to whether *any* alternative is needed, or if the "Actual Sequence" is enough.

  **2. What is Contested (The Real Fight)**
  *   **Semocompatibilism:** This is the view that PAP is false (thanks to Frankfurt) *and* that Determinism is compatible with responsibility. **John Martin Fischer** is the main proponent. This is popular, but **not** consensus.
  *   **Source Incompatibilism:** This is the view that PAP might be false, *but* Determinism still kills responsibility. Philosophers like **Derk Pereboom** argue that even if Frankfurt cases work, they don't save us from Determinism. They argue that what matters is not *Alternative Possibilities* (Leeway), but the **Source** of the action. If the source is determined (by character, genetics, environment), you aren't responsible, even if you couldn't have done otherwise.
  *   **The "Settled Character" Defense:** There is no consensus that "My character made me do it" is a valid excuse. Most Compatibilists argue that if the character is *yours* (you identify with it), you own the action. Most Incompatibilists argue that if the character was *determined* by past events you didn't control, you don't own the action.

  ### How to Use This With Your Brother

  Do not tell him "Philosophy proves you are wrong." The literature doesn't settle the *ultimate* question of free will. However, it does dismantle his specific defense.

  **The Argument:**
  1.  **Acknowledge the Truth:** "I accept your premise. Let's assume you literally could not have done otherwise given who you are." (This disarms him).
  2.  **Deploy Frankfurt:** "Philosophers generally agree that 'could have done otherwise' isn't actually required for responsibility. What matters is whether the action came from *you* or from something *outside* you (like a threat or a seizure)."
  3.  **The Character Pivot:** "You say 'You know how I am.' That's exactly why I'm holding you responsible. The action came from your character, your values, and your choices. It wasn't an alien force. If you're saying your character is broken, that's a medical issue. If you're saying your character is just selfish, that's a moral issue, and you own it."

  **Summary:**
  You are not rationalizing. The intuition that "Character is not an excuse" is the dominant view in ethics. Frankfurt cases support this by severing the link between *Alternatives* and *Responsibility*. However, be aware that if your brother pushes further and says, "But I didn't choose my character," he has moved to a **Source Incompatibilist** argument, which is harder to refute without arguing about the nature of Determinism itself. Stick to the Actual Sequence: *You did it, you wanted to do it, it reflects you. That's enough for blame.*
