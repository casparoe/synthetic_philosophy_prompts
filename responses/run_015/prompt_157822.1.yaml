answer: |-
  Good evening. For those who don't know me, I've had the privilege of working alongside [Name] for the better part of a decade. 

  Standing here, looking at this room, I realise I am navigating a rather specific cultural minefield. On my left, we have the Silicon Valley contingent. You operate on the premise that if you build something large enough, you are entitled to stand on top of it and wave. On my right, we have the family from Stockholm. You operate under *Jantelagen*: the understanding that you are not to think you are anyone special. 

  And somewhere in the back, the Australians and Kiwis are watching this, confused, because they know all about cutting down tall poppies, but they can't work out which half of this room holds the scissors.

  So, this tension dictates what I am allowed to say tonight. It structures the praise.

  For example, I am permitted to say that [Name] built a career of formidable competence. I can tell you that she navigated three recessions, two mergers, and a regulatory inquiry without losing her nerve. The Americans in the room hear that as "she is a titan." The Swedes hear that as "she did her job properly." Both are true. I can live with that.

  However, I am forbidden from calling her a "visionary." That word implies she is above the collective. I cannot say she "changed the industry," because that suggests the industry was waiting for her permission to move. I must say, instead, that she arrived, she worked, and things improved. 

  I recall the launch of the 2018 platform. In California, this was treated as a moon landing. There were champagne corks, a keynote, the works. [Name] was meant to take the stage. Instead, she was found in the server room, troubleshooting a latency issue with the junior engineers. When the CEO asked where she was, she simply said the system needed to hold, and she was the one who knew how to hold it.

  Now, to the American colleagues, that is a story of dedication to excellence. To the cousins from Uppsala, that is simply a story of not making a fuss. 

  And here is where I must leave it. I cannot tell you that she proved the Americans right. I cannot tell you that she proved the Swedes right. Because the truth is, she lived in the friction between the two. 

  There is an awkwardness in celebrating a person who spent thirty years trying not to be celebrated. If I praise her too loudly, I betray the humility she valued. If I praise her too quietly, I betray the magnitude of what she achieved. 

  So, I will not attempt to resolve that for you. I will not tell you that she found a perfect balance. She didn't. She carried the weight of the American ambition and the Swedish modesty simultaneously, and if you look closely at the lines on her face, you can see where the two pulled against each other.

  We are here to mark her retirement. We are here to acknowledge the work. Whether you view that work as a triumph of the individual or a duty performed by a member of the collective... well, that is between you and your passport.

  I ask you to raise your glasses. Not to a legend, and not to an equal. But to [Name]. To the work, which is done. And to the silence that follows, which she earned.

  Cheers.
