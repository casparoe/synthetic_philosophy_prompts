prompt: |-
  I'm giving the toast at my mentor's retirement do next Saturday. She's Swedish-American, built a huge career in Silicon Valley, and the room is split: her American collegues who live by the American Dream, and relatives from Stockholm for whom Jantelagen is still a living thing. There's also the tall poppy syndrome running underneath — Australians and Kiwis know it, but here it's flipped depending on which passport you're holding. I want about four minutes, in British English, and I need the contradiction between celebrating the successful and cutting them down to actually structure what I can say: determine which compliments are permited and which are forbidden, shape the anecdotes that land safely, and don't resolve it with some cheap best-of-both-worlds ending. Let the tension sit there, awkward and unresolved. The idea shouldn't be decoration — it should decide what the speech is allowed to praise and what it has to stay quiet about.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Mentor's retirement do.
      *   **Time:** Next Saturday (implies imminent, needs to be ready soon).
      *   **Duration:** About 4 minutes (approx. 500-600 words spoken at a moderate pace).
      *   **Language:** British English (spelling, idioms, tone).
      *   **Honoree:** Swedish-American woman, huge Silicon Valley career.
      *   **Audience:** Split culture.
          *   Group A: American colleagues (American Dream, celebrate success, "tall poppy" is positive).
          *   Group B: Swedish relatives (Jantelagen, "Law of Jante," don't think you're special, "tall poppy" is negative).
          *   Undercurrent: Australians/Kiwwis present (Tall Poppy Syndrome familiarity, but context-dependent).
      *   **Core Constraint/Theme:** The contradiction between celebrating success and cutting it down must *structure* the speech. It shouldn't just be mentioned; it should dictate *what* can be praised and *what* must be omitted.
      *   **Ending:** No cheap resolution. Do not say "she balanced both perfectly." Let the tension sit awkward and unresolved.

  2.  **Deconstruct the Cultural Tension:**
      *   *American Dream:* Individual achievement, scaling heights, disruption, "changing the world," money, titles, visibility.
      *   *Jantelagen (Law of Jante):* Collective humility, "you're not better than us,"低调 (low profile), modesty, equality over hierarchy.
      *   *The Conflict:* To praise her SV success too loudly insults the Swedes. To praise her humility too loudly insults the Americans (makes her sound weak or unsuccessful).
      *   *The Strategy:* Praise the *work*, but question the *ego*. Praise the *impact*, but minimize the *self*. Acknowledge the applause, but hint at the discomfort.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room's split. Set the tone. British English requires a bit of dry understatement.
      *   **The "Forbidden" Praise (American side):** I need to mention her SV success but frame it carefully. Don't say "She was a visionary CEO." Say "She built things that worked."
      *   **The "Permitted" Praise (Swedish side):** Focus on reliability, team, lack of fuss. But don't make her sound *too* ordinary, or the Americans tune out.
      *   **The Anecdote:** Needs to straddle the line. A moment where she could have taken credit but didn't, yet the result was massive.
      *   **The Tension/Ending:** Don't solve it. Acknowledge that we are here to celebrate, but some of us are uncomfortable celebrating. Leave it hanging.

  4.  **Developing the Voice (British English):**
      *   Vocabulary: "Do," "reckon," "quite," "rather," "fortnight" (maybe not, too cliché), "bloke/chap" (no, she's a woman), "mate."
      *   Tone: Wry, observational, slightly self-deprecating, avoiding overt sentimentality.
      *   Spelling: Colour, honour, centre, realise.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hello everyone. She is Swedish and American. Americans like success. Swedes like modesty. She had both. She made millions in Silicon Valley but takes the bus. I remember when she sold the company, she didn't buy a yacht. She bought lunch. So, is she great? Yes. Is she better than us? No. Cheers.
      *Critique 1:* Too simple. Resolves the tension too neatly. Needs more awkwardness. Needs to feel like I'm walking on eggshells.

  6.  **Drafting - Attempt 2 (Focusing on the Constraint):**
      The prompt says the contradiction must *decide* what is allowed.
      *   *Allowed:* Her competence, her loyalty, the sheer scale of what she did (factually).
      *   *Forbidden:* Calling her a "legend," "icon," or suggesting she is "better" than anyone else.
      *   *Structure:* I will explicitly state what I can't say.

  7.  **Refining the Content (incorporating the "Unresolved" ending):**
      *   Start by acknowledging the cultural minefield.
      *   Talk about Silicon Valley without using the word "disrupt."
      *   Talk about Stockholm without making her sound boring.
      *   End by raising a glass to... what? The work? The person? The ambiguity? Let's raise a glass to the *result*, leaving the *reason* open.

  8.  **Writing the Speech (Iterative Process):**
      *   *Opening:* Good evening. Bit of a cultural minefield.
      *   *Middle:* In California, she built an empire. In Sweden, she's just [Name]. I can tell you she worked hard (allowed). I can't tell you she's the best (forbidden).
      *   *Anecdote:* The IPO or a big launch. She was in the background.
      *   *Closing:* We are here to cheer. Some of you cheer loudly. Some of you clap politely. Both are true. Cheers.

      *(Self-Correction during drafting)*: Make sure the British English feels natural, not caricatured. Use "reckon," "quite," "rather." Ensure the timing is right (approx. 130-150 words per minute = 520-600 words).

      *Focusing on the "Tall Poppy" aspect:* The Australians/Kiwis know this. I should nod to them. They know the feeling of being cut down. Here, half the room wants to cut, half wants to elevate.

      *The "Unresolved" Ending:* I need to make sure I don't say "She balanced it." I need to say "She held both, and it was uncomfortable."

  9.  **Final Polish:** Check word count. Check cultural references (Jantelagen, Silicon Valley). Check tone. Ensure the tension remains palpable.

      *(Reviewing against constraints)*:
      *   4 mins? Yes, approx 550-600 words.
      *   British English? Yes (colour, honour, idioms).
      *   Structure dictated by contradiction? Yes, explicitly mentioning what can/can't be said.
      *   No cheap resolution? Yes, ending on the tension.

  10. **Final Word Count Check:** A 4-minute speech is roughly 500-600 words. I will aim for that.

      *(Drafting the content)*...
      "There are rules to tonight..."
      "In Palo Alto, this is a triumph..."
