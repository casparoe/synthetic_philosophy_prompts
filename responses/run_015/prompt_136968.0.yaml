      *   **The "Humanity" Question:** The system relies on clones *not* counting as full persons. If they aren't persons, utilitarianism might still apply (just to the "normals"). If they *are* persons, it's a violation of justice. The book argues they *are* persons (art, love, souls).

  4.  **Drafting the Response - Section by Section:**

