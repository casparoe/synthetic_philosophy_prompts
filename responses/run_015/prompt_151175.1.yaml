answer: |-
  You have a very sharp eye for historiography. What you are describing is indeed a specific subtype of Whig history, but you are right to sense that "Whig history" is too broad a bucket. It captures the *attitude* (progress toward the present) but not the *mechanism* (the missing conceptual tool).

  There isn't one single, canonical noun phrase like "the ad hominem fallacy" for this, but in the Philosophy of Science and Intellectual History, this move is most precisely identified as **Conceptual Anachronism** (specifically, the *strong* or *constitutive* variety) driven by **Teleological Reductionism**.

  However, if you want a term to use in your seminar that captures the "missing filing cabinet" nuance specifically, the most accurate critical label is **The Fallacy of Transhistorical Categories**.

  Here is a breakdown of how to pin this down, distinguish it from its cousins, and use it in your seminar.

  ### 1. The Best Established Term: Conceptual Anachronism
  While "Presentism" is the general act of judging the past by present standards, **Conceptual Anachronism** is the specific error of projecting a *category* or *distinction* back into a time when it did not exist as a cognitive possibility.

  *   **Standard Presentism:** "Newton was wrong about gravity because he didn't know about General Relativity." (Judging truth value).
  *   **Conceptual Anachronism:** "Newton had the data for General Relativity but lacked the *conceptual distinction* between inertial and gravitational mass to see it." (Judging cognitive architecture).

  This fits your "filing cabinet" observation perfectly. It assumes the "cabinet" (the conceptual framework) exists timelessly, and the historical actor simply failed to open the right drawer.

  ### 2. The Specific Mechanism: Teleological Reductionism
  This explains *why* the author is making the move. They are treating history as a **Teleology** (a process directed toward a specific end/goal).
  *   **The Move:** They identify the "goal" (our current science) and then scan history for the "missing key" that prevented the goal from being reached sooner.
  *   **The Reduction:** It reduces complex historical, social, and material conditions to a single missing intellectual variable (e.g., "If only they had the germ *concept*, they would have understood the *data*").

  ### 3. How to Distinguish It (For Your Seminar)
  You can use this three-part distinction to show your professor you understand the nuance:

  | Term | The Core Error | The Metaphor |
  | :--- | :--- | :--- |
  | **Whig History** | Assumes the past was *trying* to be the present. | "They were climbing our mountain, just from the wrong side." |
  | **Presentism** | Judges the past by *our* moral or epistemic standards. | "They failed our test." |
  | **Conceptual Anachronism (Your Move)** | Assumes our *categories* are universal tools they simply lacked. | "They had the puzzle pieces, but lacked the picture on the box lid." |

  ### 4. Why This Move Is Problematic (The "Sharp Definition")
  To get full marks in a philosophy seminar, you need to explain why this specific move is philosophically suspect. The problem is that it ignores **Theory-Ladenness** and **Incommensurability**.

  *   **Theory-Ladenness:** In the chemistry example, it is not true that they had "the data" and just lacked the "atom concept." The *data itself* looked different without the atom concept. Stoichiometric ratios weren't "evidence of atoms" waiting to be interpreted; they were just numerical regularities. The concept *created* the evidence.
  *   **Incommensurability (Kuhn):** Thomas Kuhn argued that you cannot say a past scientist was "almost there" because their entire web of meaning was different. To say they "lacked the distinction" implies the distinction was available to be had, just sitting on the shelf.
  *   **The Episteme (Foucault):** Michel Foucault would argue that the "filing cabinet" itself (the *episteme*) determines what counts as a thinkable thought. You can't "miss" a concept if your historical epoch makes that concept unintelligible.

  ### 5. Suggested Terminology for Your Papers
  If you need to label this in an essay, I recommend one of the following depending on your tone:

  1.  **The Fallacy of Transhistorical Categories:** This is the most philosophically precise. It accuses the author of treating categories (like "observation vs. theory") as if they exist outside of history, waiting to be discovered.
  2.  **Retrospective Conceptual Necessity:** This highlights that the author is claiming the missing concept was *necessary* for the truth, ignoring other possible historical paths.
  3.  **Conceptual Whiggism:** A shorthand that signals you know it's Whig history, but specifically about *concepts* rather than just moral progress.

  ### 6. A "Gotcha" Question for Seminar
  If you want to gently challenge this move in class discussion, you might ask:

  > "Are we risking **Conceptual Anachronism** here? By saying they 'lacked the distinction,' are we implying that the distinction exists independently of the historical context? It seems like the 'data' they had might not have been recognizable as data *until* the concept was created, rather than the concept just organizing pre-existing data."

  This shows you aren't just saying "they were wrong," but that you understand the *constitutive* relationship between concepts and evidence.

  ### Summary
  *   **Umbrella Term:** Whig History.
  *   **Technical Term:** Conceptual Anachronism.
  *   **Specific Mechanism:** The Fallacy of Transhistorical Categories.
  *   **Key Critique:** It ignores that concepts *constitute* data, rather than just organizing it.

  You are spotting a very real and common heuristic in the history of science. It's a comforting narrative (we are smarter because we have better tools), but historically fragile. Pinning it down as **Conceptual Anachronism** will serve you well.
