answer: |-
  **Who Objects First**
  The experimental philosopher opens. They need to establish methodological ground rules before the metaphysics gets aired. They'll ask about preregistration and effect sizes immediately. The cultural psychologist follows, challenging the novelty claim relative to Moral Foundations Theory. Then the metaethicist strikes, attempting to sever the empirical data from the metaphysical conclusion. The political philosopher waits until the implications of "welfare objectivity" are clear before attacking the liberal bias. The anthropologist usually waits for general Q&A, but may interject during the methodology section if the vignette descriptions sound too thin. Expect the metaethicist and political philosopher to interrupt each other; the former cares about truth, the latter about power, and they talk past one another.

  **The Objections**

  1. "Survey data tracks folk *beliefs*, not moral *facts*; why think variation in judgment bears on the metaphysics of normativity?" (Metaethicist). **Answer:** I'm not deriving ought from is. I'm arguing that the *structure* of disagreement (weight vs. content) is best explained by the nature of the property being tracked. Robust properties resist weight divergence. **Weakness:** Assumes metaphysical nature drives psychological processing, not vice versa.

  2. "This looks like Moral Foundations Theory with extra metaphysical steps; what's the philosophical payoff beyond what Haidt already claimed?" (Psychologist). **Answer:** MFT describes taxonomy; I'm making a metaethical claim. The asymmetry isn't just descriptive; it delineates where realism is tenable versus where constructivism is required. **Weakness:** Risks sounding like you're appropriating psych literature without sufficient citation.

  3. "Your inter-rater reliability on the weight-versus-content coding is 0.6; isn't Claim 2 resting on noisy data?" (Experimental Philosopher). **Answer:** It's moderate, not perfect. But the effect holds across subsets where agreement was high. I'm treating this as a pilot for larger coding efforts, not a final proof. **Weakness:** You are conceding the core empirical claim is underpowered. Fold here.

  4. "Isn't 'harm' itself a thick concept? Defining welfare objectively just launders Western liberal intuitions into metaphysics." (Political Philosopher). **Answer:** I control for cultural definitions of harm in the vignettes. The objectivity claim is restricted to severe physical/psychological damage, not contested policy harms. **Weakness:** The line between "severe damage" and "cultural harm" is notoriously porous.

  5. "Vignettes strip context; real moral judgment relies on thick concepts these scenarios can't capture." (Anthropologist). **Answer:** True, vignettes are thin. But if variation persists even in controlled thin contexts, it suggests deep structural differences, not just contextual noise. **Weakness:** Doesn't answer whether the measured variation is ecologically valid.

  6. "Did you run a multiverse analysis on the coding thresholds? How do we know this partition isn't an artifact of your binning?" (Experimental Philosopher). **Answer:** No full multiverse, but I tested alternative thresholds. The asymmetry remains stable even when shifting the variance cutoffs. **Weakness:** Admitting no preregistered multiverse analysis is a methodological sin in this room.

  7. "Even if communal judgments are constructed, why think welfare judgments aren't also constructed via evolution?" (Metaethicist). **Answer:** Evolutionary construction doesn't preclude realism about harm. Pain is real regardless of its evolutionary utility. Communal norms lack that mind-independent anchor. **Weakness:** Assumes pain is the only anchor for welfare realism, which is contestable.

  **What to Concede Before Anyone Asks**
  Open by admitting "Partitioned Realism" is a working title; it sounds like property law. Propose "Domain-Specific Normativity" instead. More critically, concede the coding reliability on Claim 2 immediately. Say: "The inter-rater agreement is moderate, which limits the strength of the weight-versus-content claim. I treat this as evidence for a structural hypothesis, not a definitive map." Do not defend the kappa score. Fold on the precision of Claim 2 to hold the line on Claim 3 (the metaethical implication). If you fight the coding stats, you look like a bad empiricist; if you fight the metaphysics, you look like a good philosopher.

  **The One Reply That Has to Land**
  This targets the Metaethicist and Political Philosopher simultaneously. "The argument isn't that disagreement proves anti-realism. It's that the *pattern* of disagreement tracks the *type* of justification available. In the welfare domain, appeals converge on mind-independent states (suffering). In the communal domain, appeals terminate in social facts (authority, tradition). If the justificatory structure differs, the metaphysical status likely does too. I'm not inferring truth from consensus; I'm inferring the nature of the truth-track from the structure of the error." This lands if you emphasize *justificatory structure* over *raw agreement*.

  **The Question I'm Hoping Nobody Asks**
  "Where exactly is the boundary? Harm often violates purity (e.g., desecrating a corpse), and loyalty violations cause harm. If the domains overlap, doesn't the partition collapse?" This is the boundary problem. If you say the domains are distinct, you ignore cultural reality. If you say they blend, you lose the metaethical partition. **Prep:** Argue for "primary justification." When reasons conflict, which type trumps? In welfare cases, harm trumps purity. In communal cases, loyalty trumps harm. The hierarchy determines the domain, not the content alone. If this fails, the "partition" is just a heuristic, not a metaphysical boundary.
