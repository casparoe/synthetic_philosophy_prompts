answer: |-
  ### Brainstorming Notes: Temporal Neutrality vs. Risk Adjustments

  *   **The Core Conflict:** Standard welfare economics (Ramsey) says pure time preference ($\delta$) is ethically indefensible—it's discrimination based on date. But climate models often add a 'survival probability' factor.
  *   **The Trap:** If the probability of survival drops as time increases, doesn't discounting for risk effectively discount for time?
  *   **Key Distinction:** Is it *ontological* (they don't exist) vs. *temporal* (they exist later)?
  *   **The 'Back Door' Argument:** If risk is endogenous to time (catastrophe accumulates), then risk-adjustment is just time-preference in disguise.
  *   **Expected Utility:** One could argue it's not about valuing them less, but valuing the *expectation* of their utility. But does that satisfy the neutrality requirement?
  *   **Non-Identity:** If they don't exist, do we owe them anything? Or are we comparing states of affairs?
  *   **Exam Strategy:** Force the student to decide if 'probability of existence' is a neutral fact or a biased parameter.

  ***

  ### MA Seminar: Philosophy of Economics
  **Exam Paper: Discounting, Risk, and Future Generations**
  **Time Allowed:** 90 Minutes

  **Question 1**

  Consider a climate-policy model where the social discount rate ($\rho$) is decomposed into three distinct components: (1) a pure time preference factor ($\delta$), (2) an elasticity-of-utility factor tied to economic growth ($\eta g$), and (3) an existential-risk adjustment ($\lambda$).

  Component (3) is designed to downweight far-future welfare not because the beneficiaries are temporally distant, but because there is a non-zero probability they may never come to exist due to catastrophic collapse. Proponents argue this avoids the ethical objection usually leveled against pure time preference.

  Critically assess this claim. Does component (3) successfully escape the moral objection to pure time preference, or does it reintroduce a hidden form of temporal bias through the back door? In your answer, confront the coherence of rejecting 'distance in time' as a valid reason to care less while simultaneously allowing 'probability of non-existence' to do the same normative work. Focus on the conceptual separation between risk adjustment and intertemporal preference.

  ***

  ### Model Answer

  The ethical objection to pure time preference is straightforward: it violates temporal neutrality. If we accept a utilitarian framework, a unit of welfare should count equally regardless of when it occurs. Discounting simply because an event is in the future is akin to discounting because it happens to someone else; it is discrimination by date. Component (1) of the Ramsey formula is therefore often set to zero on ethical grounds. The question is whether component (3), the existential-risk adjustment, respects this neutrality or subverts it.

  At first glance, risk adjustment seems categorically different. Pure time preference reflects impatience or a moral judgment that the future matters less. Risk adjustment reflects uncertainty about whether there will be anyone to matter. This aligns with expected utility theory: we maximise expected welfare, not guaranteed welfare. If there is a 10% chance humanity goes extinct by 2100, weighting that period's welfare by 0.9 isn't bias; it's accounting for reality. An A-grade analysis must recognise that discounting for non-existence is technically distinct from discounting for temporal location. One is an ontological claim about subjects, the other is a preference parameter.

  However, the coherence of this distinction collapses if risk is correlated with time. In climate models, existential risk is rarely exogenous; it accumulates over time. The further out we project, the higher the probability of catastrophe. If $\lambda$ increases monotonically with $t$, then mathematically, discounting for risk becomes functionally identical to discounting for time. The ethical objection returns: we are effectively valuing the welfare of 2100 less than 2024, justified by a probability metric that is itself driven by temporal distance. This is the 'back door' bias. If the only reason the probability drops is the passage of time, then $\lambda$ is just $\delta$ relabelled.

  Furthermore, we must consider the status of potential people. If we discount because beneficiaries might not exist, we are making a claim about non-identity. If a catastrophe prevents people from being born, are we harming them? Standard non-identity problems suggest we cannot harm those who never exist. However, in climate policy, we are often comparing a world where they exist (low emissions) vs. a world where they don't (high emissions). If we use $\lambda$ to downweight the high-emissions scenario because people might not exist, we risk circular reasoning. We are using the possibility of non-existence to justify policies that might bring about that non-existence.

  To maintain coherence, one must argue that risk is independent of time preference. This requires treating the probability of existence as an exogenous fact, like a asteroid strike, rather than an endogenous outcome of policy choices over time. If the risk is purely exogenous, then $\lambda$ is a neutral probability weight. But in climate economics, risk is endogenous. Therefore, relying on $\lambda$ to do heavy lifting often smuggles in temporal bias. It allows the modeler to achieve a higher discount rate without admitting to ethically dubious pure time preference.

  Ultimately, component (3) only escapes the moral objection if it is strictly decoupled from temporal distance. Since climate risk is inherently temporal, the separation is largely illusory. Rejecting 'distance in time' while accepting 'probability of non-existence' is incoherent when the latter is a function of the former. The risk adjustment becomes a technocratic mask for intergenerational indifference.

  ***

  ### Marking Scheme (Total 20 Marks)

  **Move 1: Define the Ethical Objection to Pure Time Preference (4 marks)**
  *   **A Answer:** Clearly articulates temporal neutrality (discrimination by date) and why $\delta$ is ethically suspect in a utilitarian framework.
  *   **B Answer:** States that pure time preference is controversial or 'unfair' without explaining the neutrality principle.
  *   **Typical Mistake:** Confusing pure time preference with discounting due to growth/wealth (component 2).

  **Move 2: Distinguish Preference vs. Probability (4 marks)**
  *   **A Answer:** Explicitly separates subjective impatience (preference) from objective uncertainty (expected utility). Acknowledges the technical validity of risk adjustment.
  *   **B Answer:** Treats risk and preference as the same thing, or dismisses risk adjustment as obviously wrong without analysis.
  *   **Typical Mistake:** Failing to mention expected utility theory.

  **Move 3: Analyse the Correlation Problem (4 marks)**
  *   **A Answer:** Identifies that if risk increases with time, discounting for risk equals discounting for time. Highlights the 'back door' bias.
  *   **B Answer:** Accepts the model's distinction at face value without questioning the correlation between $t$ and $\lambda$.
  *   **Typical Mistake:** Assuming risk is exogenous without justification.

  **Move 4: Address the Status of Potential People (4 marks)**
  *   **A Answer:** Touches on non-identity or the moral status of those who might not exist. Questions whether we can discount based on their potential non-existence.
  *   **B Answer:** Ignores the metaphysical status of future beneficiaries entirely.
  *   **Typical Mistake:** Treating future people as identical to present people without qualification.

  **Move 5: Synthesis on Coherence (4 marks)**
  *   **A Answer:** Concludes on whether the distinction holds. Argues that endogenous risk makes the separation incoherent.
  *   **B Answer:** Sits on the fence or concludes that 'both sides have points' without a decisive judgment on coherence.
  *   **Typical Mistake:** Ending with a generic summary rather than a verdict on the prompt's specific challenge.
