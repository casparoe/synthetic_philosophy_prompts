  Your'e acting as a senior examiner in philosophy of economics for an MA seminar. Before you write anything, do a quick bit of brainstorming — maybe jot down the key tension between temporal neutrality and risk adjustments. Then draft me one essay question for a 90-minute exam on pure time preference and discounting the future.

  I don't want the usual 'explain Ramsey' recitation. Instead, set up a specific framing: a climate-policy model decomposes the social discount rate into (1) a pure time preference factor, (2) an elasticity-of-utility factor tied to growth, and (3) an existential-risk adjustment that downweights far-future welfare not because it is far away but because the beneficiaries may never come to exist. Ask the student whether component (3) really avoids the moral objection to pure time preference, or whether it just reintroduces a hidden form of temporal bias through the back door. Make them confront the coherence of rejecting 'distance in time' as a reason to care less while still allowing 'probability of non-existence' to do the same work.

  The question should be unanswerable by summarising standard texts; they need to analyse the conceptual separation between risk and preference.

  Then give a model answer of about 650–750 words, and a marking scheme built around five must-hit moves (total 20 marks). For each move, state what distinguishes an A answer from a B answer, and name the typical mistake that loses marks. Don't include any bibliography or citation requests — this is a closed-book exam with no web access. Also avoid pinning arguments to specific page numbers or obscure papers; refer generally to 'the Ramsey formula' or 'the standard non-identity concern' without attributing quotes.

  Write in British English, keep it fairly casual (my own message probably has a typo or two, so don't over-polish), and please think step-by-step before finalising.
