      *   **Constraints:** Be disciplined about mapping (who is the subject? integration conditions?), avoid inventing empirical details, stick to the standard account of split-brain data.

  2.  **Analyze Hofstadter's Theory (Mental Retrieval & Synthesis):**

      *   *Strange Loop:* A hierarchical system that turns back on itself. In the context of the self, it's the feedback loop between neural activity and the symbolic representation of "I" within that activity. The "soul" is a pattern, not a substance.
      *   *Multiplicity:* Hofstadter acknowledges the brain is a society of agents (Minsky influence). He suggests the "I" is a central narrative thread.
