      *Key Insight:* The split-brain shows that *causal integration* is necessary for a *singular* loop. Hofstadter's distribution relies on *symbolic isomorphism*. These are different mechanisms. The split-brain case might actually challenge the idea that a "partial pattern" in another brain counts as the "same I."

