  Bottom line

  We should adopt a provisional shrimp annex with a three-year sunset clause, rather than applying the finfish standard as-is or deferring decopods entirely. Crucially, this annex must adopt intensity-times-duration as the primary unit of aggregation for welfare assessment. This choice acknowledges that chronic environmental stressors in high-density systems likely outweigh acute slaughter events for this species, shifting our audit focus toward water quality and stocking density rather than individual stunning methods. This approach maintains our leverage over the sector without asserting settled science on sentience that we do not possess. It allows certification to function as a tool for improvement rather than a barrier to entry. We will review the annex in three years to assess whether scientific evidence on decapod welfare has matured enough to tighten criteria or whether the provisional tier has failed to drive meaningful change. This path balances the need for immediate engagement with the humility required by current scientific limitations.

  The decision in front of us

  The board has asked us to extend the existing welfare standard to farmed shrimp and prawns. On the surface, this appears to be a simple expansion of scope to cover a new commodity. In practice, because the current standard was written specifically for Atlantic salmon, applying it literally functions as an exclusion mechanism. The finfish standard requires individual stunning methods that do not exist for shrimp at commercial scale, mandates stocking densities that are orders of magnitude lower than industry norms, and sets cumulative mortality thresholds that well-run shrimp farms cannot meet. We are therefore not choosing between strict and loose criteria for shrimp; we are choosing between certifying no shrimp farms at all, creating a separate pathway with provisional criteria, or refusing to engage with decapod welfare until the science is more robust. Doing nothing new is not a neutral act. It is a decision to set a bar that no current producer can clear, which effectively removes shrimp from our scheme entirely. We must recognize that this choice determines whether we retain any influence over how the majority of farmed shrimp are produced. The wording of the existing standard makes this a binary choice about inclusion versus exclusion, rather than a technical adjustment of parameters.

  Why applying the finfish standard isn't the neutral option

  Applying the finfish standard without modification commits us to a specific set of empirical claims about shrimp biology that are not supported by current evidence. It assumes that the welfare priorities for a salmon—specifically the method of slaughter and individual handling—are equally relevant for a shrimp. By setting requirements that are technically impossible to meet, we force all production into uncertified channels. This surrenders our leverage to buyers who have no welfare requirements whatsoever. If our goal is to reduce suffering, certifying zero farms achieves nothing for the animals that will be raised regardless of our label. Furthermore, this approach implicitly asserts that the moral weight of a shrimp death is equivalent to a salmon death, despite the vast differences in nervous system complexity and lifespan. For those concerned that engaging with invertebrates distracts from vertebrate welfare, this option wastes resources auditing for failures that are inevitable rather than preventable. For those who believe excluding shrimp is the only ethical choice, this option achieves exclusion but at the cost of admitting we have no mechanism to improve conditions for the animals that will be farmed regardless of our certification. It creates a standard that is rigorous only in its ability to reject applicants, not in its ability to measure welfare. We lose the ability to push for better water quality or lower densities because no one can qualify to be pushed.

  The case for a provisional shrimp annex

  A provisional annex allows us to engage with the sector without locking in potentially erroneous assumptions. The core of this approach is selecting the correct unit of aggregation for welfare cost. If we count welfare loss per individual animal, shrimp farming looks catastrophic due to the sheer number of animals per tonne of product. Thousands of small animals endure months of crowding, making the aggregate suffering appear immense. If we count it per unit of cognitive capacity, shrimp may appear negligible, as their capacity for experience is plausibly much narrower than a salmon's. Neither captures the reality of high-density aquaculture. I recommend we aggregate by intensity-times-duration of experience. This metric prioritizes chronic stressors over acute events. In a crowded pond, the constant experience of poor water quality or crowding affects every animal for the entire cycle, whereas the slaughter event is brief. This flips the ranking of welfare priorities compared to the finfish standard. It directs auditor attention to water quality and density, which are manageable and measurable, rather than stunning methods which are not. This satisfies the concern that we are wasting time on distraction by focusing on measurable environmental parameters. It also addresses the concern that we are being cowardly by lowering standards; we are not lowering them, we are measuring the thing that actually matters for this species. Chronic mild badness in a crowded pond can outweigh a short acute event at killing time, which would point us at density and water quality instead of slaughter method. The sunset clause ensures we do not commit to this model indefinitely if the science shifts. This unit of aggregation resolves the disagreement between those who see shrimp as negligible and those who see them as catastrophic by changing the metric of evaluation.

  The strongest version of waiting for better evidence

  The strongest argument for deferring decopods entirely rests on the precautionary principle and resource allocation. If we certify shrimp farming under a provisional standard, we risk legitimizing practices that may be causing significant suffering if our understanding of decapod sentience is wrong. There is a genuine risk that creating a certification tier for invertebrates signals to the market that these products are ethically resolved, when in fact the science on their capacity for valenced experience is still emerging. For those who view invertebrate welfare as a distraction, this argument holds significant weight: every hour spent auditing shrimp parameters is an hour not spent improving conditions for finfish, where the evidence of suffering is unequivocal. Furthermore, if we set a standard now that is later proven to be inadequate based on new neuroscience, we damage the credibility of the entire scheme. It may be more honest to admit that we cannot currently assess welfare in this group than to create a framework that gives a false sense of security. Exclusion, in this view, is not cowardice but intellectual honesty. It preserves our reputation for rigor and ensures we do not inadvertently greenwash an industry where the fundamental ethical questions remain unanswered.

  What the annex should actually say

  If we proceed with the annex, the criteria must be auditable on a Tuesday morning while reflecting the intensity-times-duration model. Priority one is water quality. We should set strict limits on dissolved oxygen and ammonia levels, with continuous monitoring logs required. This is a proxy for chronic stress and is highly auditable. Priority two is stocking density. We cannot match finfish densities, but we can set a maximum based on species-specific biomass per cubic meter, enforced by spot checks. Priority three is slaughter. Instead of mandating a specific stunning method, we should mandate a maximum time to insensibility once removed from water. This acknowledges the ice slurry reality but sets a limit on duration of potential distress. We must be honest about the tradeoff here. Water quality logs are easier to fake than a video of stunning, but they correlate better with lifetime welfare for shrimp. Mortality thresholds must be adjusted to reflect baseline industry rates plus a margin for improvement, rather than finfish baselines. This ensures we are measuring improvement rather than impossibility. A high-mortality farm might still be fine on a purely hedonic view of what we're measuring, but we need a baseline that prevents neglect. The standard must measure what matters, even if it is harder to verify than a simple checkbox for stunning equipment. We are trading the precision of individual handling metrics for the accuracy of environmental welfare metrics. This is a necessary compromise to make certification possible without abandoning welfare goals.

  How we'd know this failed

  We need clear triggers to reverse course at the three-year review. First, if no certified farms show improvement in water quality or density metrics compared to baseline industry averages, the annex has failed to drive change. Second, if new peer-reviewed evidence emerges demonstrating that decapod sentience is either negligible or far more complex than currently modeled, we must adjust the unit of aggregation accordingly. Third, if audit inconsistencies arise because the criteria are too subjective for field auditors to apply reliably, the standard is unsustainable. Finally, if the existence of the provisional tier reduces pressure on producers to innovate toward better slaughter methods, we are merely entrenching poor practices. We should commit to sunsetting the annex if any two of these conditions are met. This ensures that our provisional engagement remains a tool for progress rather than a permanent loophole. It signals to both skeptics and advocates that our commitment is to welfare outcomes, not merely to expanding the scope of our certification for its own sake.
