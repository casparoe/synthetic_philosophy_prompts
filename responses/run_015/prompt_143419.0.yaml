  **The Call:** Vote **One Species**.

  **The Rule:** The committee is running a **Modified Biological Species Concept prioritizing Intrinsic Nuclear Cohesion**. Under this rule, reproductive barriers must be intrinsic to the host nuclear genome to count toward speciation. Extrinsic barriers (geography, symbionts) that disappear upon contact or treatment do not warrant species status, even if ecological distinctness exists in the wild. Furthermore, following the Lichen precedent (Case 7), the "species" is the host organism, not the holobiont (host + symbiont).

  **Closest Analog:** **Case 4 (The Minnows).**
  In Case 4, you had deep genetic divergence (mtDNA) and allopatry, but because the barrier was extrinsic (geography) and interbreeding was possible in the lab, you voted One Species. The Planthopper case is the sympatric equivalent: the barrier is extrinsic (bacterial), and interbreeding is possible when the barrier is removed (antibiotics). In both cases, the "potential to merge" overrides the "current separation."

  **Tension:** **Case 5 (The Parasitic Wasps).**
  This is your biggest conflict. In Case 5, you voted Two Species for host-associated lineages with no gene flow in sympatry. If you vote One Species for the Planthoppers, you are implicitly arguing that Case 5 was only correct because the Wasps' isolation was *intrinsic* (genetic/behavioral) rather than symbiont-induced. If future research finds the Wasps were also separated by *Wolbachia*, your precedents demand you lump them. You are committing to the principle that **host races are not species unless the isolation is encoded in the host nucleus.**

  **The Principle:**
  By voting One Species, you are committing to the **Evolutionary Independence of the Nuclear Genome**. You are asserting that a "species" must be a self-sustaining lineage defined by its own genetics, not by a contagious infection. The fact that the bacterium "reshuffles" the host association proves these are not independent lineages; they are infection states of a single lineage. This aligns with Case 7 (Lichen), where you refused to name the partnership, focusing instead on the fungal component. Here, you must focus on the insect component.

  **The Decisive Future Case:**
  To distinguish this rule (Intrinsic Nuclear Cohesion) from the alternative (Sympatric Ecological Distinctness, which would have demanded a Two Species vote here), you need this case:

  *Two sympatric populations with distinct nuclear genomes (no gene flow) and distinct host plants, but where hybrids are fully fertile, ecologically intermediate, and suffer no selection penalty.*

  *   **If you vote Two Species:** You are prioritizing **Ecological/Phylogenetic distinctness** (like the Oaks, Case 2), admitting that gene flow doesn't matter if niches are separate.
  *   **If you vote One Species:** You are prioritizing **Genetic Cohesion**, admitting that without selection against hybrids, they are merely polymorphic populations of a single species.

  **Confidence:**
  I am **85% confident** in this call. It is the only vote that respects the genetic reality of the "one gene pool" finding while remaining consistent with the Minnow (Case 4) and Lichen (Case 7) precedents. The remaining 15% uncertainty comes from the political weight of the Wasp precedent (Case 5); your committee has shown a willingness to split cryptic host races before. However, the "reshuffling" evidence in the Planthoppers makes them fundamentally different from the Wasps. If you vote Two Species here, you are no longer doing taxonomy; you are naming infection statuses. Vote One.
