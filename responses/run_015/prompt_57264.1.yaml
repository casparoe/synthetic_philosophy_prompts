answer: |-
  Your hypothesis is correct. The recursion is the mechanics; the epistemology is the lesson. If you teach this as an algorithm, you produce students who can solve trees but cannot explain why the solution holds. If you teach it as a story about what we owe each other in terms of belief consistency, you produce students who understand game theory.

  Regarding the example: Reject the 100-node tree (visually unintelligible on a whiteboard) and reject the live sweets game (introduces noise regarding risk/altruism that muddies the logic). The third option is the **4-node Centipede drawn statically**. It is short enough to solve in five minutes, leaving seventy-five minutes for the *why*. It allows you to erase arrows and redraw them to simulate belief revision without the chaos of actual play.

  Here is the conceptual dependency map for the 80 minutes.

  ### The Sequence

  1.  **Draw the 4-node Centipede tree with clear payoffs.**
      *   *Why here and not earlier:* You cannot discuss reasoning about moves until the students share a specific visual reference of the incentives.
  2.  **Solve the final node (Node 4) using local dominance.**
      *   *Why here and not earlier:* You must establish the one place where "taking" is strictly dominant regardless of beliefs to anchor the induction base case.
  3.  **Solve Node 3 by asking "What does Player 1 believe Player 2 will do?"**
      *   *Why here and not earlier:* You must distinguish strategic dominance (dependent on conjecture) from local dominance (independent of conjecture) before reaching the start.
  4.  **Complete the Backward Induction (BI) to Node 1 and state the equilibrium outcome.**
      *   *Why here and not later:* You must establish the standard prediction firmly before you are allowed to dismantle its assumptions.
  5.  **Pause and ask: "For Player 1 to take at Node 3, what must they know about Player 2?"**
      *   *Why here and not earlier:* This shifts the mode from calculation to epistemology; it requires the solution to be visible to be interrogated.
  6.  **Address the Chess Student: "This is not recursion; it is epistemic logic."**
      *   *Why here and not later:* You must correct the "computation" misconception before they treat the off-path reasoning as merely a harder calculation.
  7.  **Pose the Counterfactual: "Player 1 passes at Node 1. Player 2 is now at Node 2. What should Player 2 believe?"**
      *   *Why here and not earlier:* This is the core hypothesis test; it requires the BI solution to be established so the deviation is recognized as a "surprise."
  8.  **Distinguish BI (prediction under Common Knowledge of Rationality) from Normative Instruction.**
      *   *Why here and not later:* You must finalize the status of the theory before discussing experimental deviations.
  9.  **Briefly note experimental results (people pass) and ask why this doesn't falsify the logic.**
      *   *Why here and not earlier:* Empirical data is only interpretable once the theoretical conditions (CKR) are understood as distinct from reality.

  ### Misconception Map

  | What a student will actually say | Roughly where it surfaces | The specific move that heads it off |
  | :--- | :--- | :--- |
  | "This is just a long Prisoner's Dilemma." | Step 1 (Drawing) | Explicitly label the nodes as sequential, not simultaneous; highlight that Player 2 sees Player 1's move before acting. |
  | "Passing is dominated, so passing is an error." | Step 3 (Solving Node 3) | Write "Dominant?" on the board. Show taking is only better *if* Player 2 takes next; otherwise passing yields more. |
  | "It's trivial recursion; a computer solves this." (Chess Student) | Step 5 (Interrogating Node 3) | Say: "Chess has hidden information about the opponent's mind; this game assumes we know the opponent's mind perfectly." |
  | "If Player 1 passes, Player 2 should still take because that's the plan." | Step 7 (Counterfactual) | Ask: "If Player 1 broke the plan, why trust the plan for Player 2? Does rationality survive the surprise?" |
  | "The experiments prove people are irrational." | Step 9 (Experimental results) | Say: "Experiments prove CKR is false in labs, not that the logic is wrong given CKR." |
  | "This is the Surprise Exam paradox." | Step 7 (Counterfactual) | Acknowledge the structural similarity but refuse to analyze the epistemic logic of knowledge operators today. |

  ### Topics to Explicitly Avoid

  1.  **Reputation / Incomplete Information Types:** Say out loud: "If we allow players to be 'irrational types', the game changes entirely; today we assume everyone is rational."
  2.  **Trembling Hand Perfection:** Say out loud: "We are assuming moves are intentional, not accidental mistakes, to keep the logic clean."
  3.  **Forward Induction:** Say out loud: "We are analyzing what rationality requires, not what past moves signal about future types."
  4.  **Surprise Exam Literature:** Say out loud: "The logical structure is similar, but resolving that paradox requires modal logic we don't have time for."

  ### Closing Question

  "If Player 1 passes at Node 1, and Player 2 believes Player 1 is still rational but made a mistake, does Backward Induction still hold at Node 2?"

  Verdict: The misconception that backward induction is a normative instruction rather than a conditional prediction.
