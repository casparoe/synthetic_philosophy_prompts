answer: |-
  Consider two programs: `Vigilant` and `Predator`. Both halt within budget $B$ by returning a default move if their search procedures fail.

  `Vigilant` searches for a proof (within $B$) that the Opponent defects against `Vigilant`. If found, it Defects; else Cooperates.
  `Predator` searches for a proof (within $B$) that `Vigilant` Cooperates against `Predator`. If found, it Defects; else Cooperates.

  Assume simulating the opponent consumes significant steps. At a low budget $B_{low}$, `Predator` lacks the steps to simulate `Vigilant` fully. The search fails. `Predator` defaults to Cooperate (fearing mutual defection if `Vigilant` retaliates). `Vigilant` similarly fails to prove `Predator` defects. Both Cooperate. Payoff: Reward (CC).

  At an intermediate $B^*$, this opacity holds. `Predator` still cannot verify `Vigilant`'s response to defection within the budget. `Vigilant` remains opaque; `Predator` fears retaliation. Both Cooperate.

  At a large budget $B_{large}$, `Predator` has enough steps to simulate `Vigilant` completely. It verifies that `Vigilant` will Cooperate (because `Vigilant` cannot prove `Predator` defects—`Predator`'s logic is too complex for `Vigilant` to analyze in time). `Predator` defects. `Vigilant`, unable to prove `Predator`'s defection, Cooperates. Payoff: Sucker (DC). Cooperation is destroyed by excessive reasoning power.

  The seminar objection is inevitable: "If high budget is bad, why doesn't `Vigilant` hard-wire a smaller cap into its source?" This misunderstands opacity. Opacity at $B$ is defined by the *opponent's* ability to analyze you within *their* budget $B$. If the environment grants `Predator` $B_{large}$, they can simulate any `Vigilant` that halts in fewer than $B_{large}$ steps. Self-limiting makes you fast, not opaque. To regain opacity against a high-budget opponent, you must be computationally hard to analyze, but that risks exceeding your own halt budget and defaulting to Defect. You cannot force blindness on an opponent with superior compute; you can only hope their budget stays in the window where you are hard to read but able to act.

  Thesis: In program equilibrium, computational superiority can destabilize cooperation by piercing the opacity required to deter exploitation.

  \answer{The assumption that proof-search complexity is asymmetric enough to sustain the window without collapsing into mutual defection immediately.}
