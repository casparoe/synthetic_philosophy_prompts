answer: |-
  ### Specifications for a Theory of Radical Message Design

  The following requirements constrain any theory of meaning location intended to guide the construction of artifacts for receivers with whom we share no language, conventions, or prior contact. The theory must be prescriptive for design, not merely descriptive of existing communication.

  **1. Requirement of Frame Objectivity**
  *   **Motivating Case:** *Contested Framing.* A surface covered in marks treated as ornament by one community and writing by another.
  *   **Argument:** If the theory locates the "Frame" (the signal that this is a message) in the receiver's interpretation, the designer cannot ensure the artifact is recognized as a message. For a "share nothing" scenario, the Frame must be detectable via physical invariants (e.g., statistical anomaly, geometric regularity) independent of cultural convention.
  *   **Status:** **Non-negotiable.** Without this, the artifact may remain invisible as a message.

  **2. Requirement of Decoder Derivability**
  *   **Motivating Case:** *The Unassisted Artifact.* An object carrying its own decoding instructions versus one requiring an external key.
  *   **Argument:** The theory must explain how the "Outer Message" (instructions) can be parsed to build the decoding apparatus without presupposing the apparatus itself. If the theory claims meaning is *only* in the receiver's mind, it cannot guide the construction of an artifact that creates that mind-state from scratch.
  *   **Status:** **Non-negotiable.** This is the core engineering constraint of the design problem.

  **3. Requirement of Intent-Structure Coupling**
  *   **Motivating Case:** *Hallucinated Content.* A receiver decodes coherent content the sender never put there.
  *   **Argument:** A theory locating meaning solely in the receiver cannot label this a communication failure; a theory locating it solely in the sender cannot explain the receiver's coherence. The theory must provide a mechanism to link sender intent to receiver reconstruction to distinguish *communication* from *coincidence*.
  *   **Status:** **Camp Preference (Intentionalist).** A purely structuralist theory might accept the coherence as valid meaning regardless of origin, but for *design*, we require coupling.

  **4. Requirement of Internal Verifiability**
  *   **Motivating Case:** *The Canary.* A fragment (checksum, known plaintext) allowing confirmation of correct decoding.
  *   **Argument:** The theory must categorize where verification data resides. If it is part of the Inner Message, it cannot be read before decoding; if Outer, it constrains the apparatus. The theory must allow for a self-referential loop where the message validates the decoder without requiring external truth conditions.
  *   **Status:** **Non-negotiable.** Essential for confirming success in the absence of feedback channels.

  **5. Requirement of Regress Halt**
  *   **Motivating Case:** *Recursive Decoding.* Instructions for assembling a decoder for further instructions.
  *   **Argument:** The theory must specify where the chain of "instructions to decode instructions" bottoms out. It cannot demand infinite recursion. It must identify a foundational layer (e.g., physical laws, perception) that requires no decoding.
  *   **Status:** **Non-negotiable.** Logical necessity; otherwise, decoding never begins.

  **6. Requirement of Agency Attribution**
  *   **Motivating Case:** *Signals with No Sender.* Tree rings, geological strata, cosmic background.
  *   **Argument:** The theory must verdict on whether natural structures carrying information count as "messages." If the theory requires a sender for meaning to exist, it excludes natural data; if it does not, it risks conflating causation with communication.
  *   **Status:** **Camp Preference.** Excluding senderless signals is a legitimate consequence of defining "message" as intentional act, not a theoretical cost.

  **7. Requirement of Pragmatic Safety**
  *   **Motivating Case:** *Hostile Framing.* A trap where building the decoder injures the receiver.
  *   **Argument:** The theory must account for the cost of the decoding act. If meaning is located in the *result* (Inner), the danger of the *process* (Outer) is irrelevant. If meaning is located in the *interaction*, the risk is constitutive. A design theory must treat the decoding apparatus as part of the message's semantic field.
  *   **Status:** **Camp Preference (Pragmatist).** Pure semiotics often ignores the physical cost of interpretation; engineering cannot.

  **8. Requirement of Location Specificity**
  *   **Motivating Case:** *General.* Where is the meaning?
  *   **Argument:** The theory must explicitly state whether meaning is a property of the artifact (static), the receiver (dynamic), or the coupling (event). It cannot equivocate. A design specification requires knowing which variable to manipulate.
  *   **Status:** **Non-negotiable.** Ambiguity here prevents actionable design rules.

  **9. Requirement of Universal Grounding**
  *   **Motivating Case:** *No Shared Conventions.*
  *   **Argument:** The Outer Message must rely on universal constants (mathematics, physics) rather than local conventions (language, symbols). The theory must support a distinction between conventional signs and natural/indexical signs that can be repurposed.
  *   **Status:** **Non-negotiable.** Required by the "share nothing" constraint.

  **10. Requirement of Substrate Independence**
  *   **Motivating Case:** *General.*
  *   **Argument:** The theory must allow the message to survive translation across media (e.g., radio wave to stone carving). If meaning is tied to the specific physical medium, the message fails upon transmission.
  *   **Status:** **Non-negotiable.** Standard requirement for information theory.

  **11. Requirement of Noise Separation**
  *   **Motivating Case:** *General.*
  *   **Argument:** The theory must provide a criterion for distinguishing signal from entropy that does not rely on prior knowledge of the signal's content.
  *   **Status:** **Non-negotiable.** Without this, the Frame cannot be distinguished from background radiation.

  **12. Requirement of Semantic Closure**
  *   **Motivating Case:** *General.*
  *   **Argument:** The theory must define when decoding is "finished." If the Inner Message requires further keys not contained in the artifact, the message is incomplete. The theory must account for self-sufficiency.
  *   **Status:** **Non-negotiable.** Required for the artifact to function as a standalone unit.

  ***

  ### Consistency Check: The Impossible Pair

  There is a fundamental tension between **Requirement 2 (Decoder Derivability)** and **Requirement 8 (Location Specificity)** if the latter is resolved in favor of a Receiver-Locus theory.

  *   **The Conflict:** Requirement 2 demands that the artifact contain sufficient structure to generate the decoding apparatus *autonomously* (implying meaning potential is *in* the artifact). Requirement 8, if satisfied by a Receiver-Locus theory, states meaning is *in* the receiver's interpretation (implying the artifact is merely a trigger).
  *   **Incompatibility:** You cannot jointly satisfy the demand that "meaning be recoverable from the artifact alone" (Structuralist/Artifact-Locus) and "meaning depends on an apparatus the artifact does not contain" (Pragmatist/Receiver-Locus). If the apparatus is not in the artifact, the artifact does not contain the meaning; it only contains the *potential* for meaning given a specific receiver.
  *   **Resolution:** **Requirement 8** must be refined. The theory cannot locate meaning strictly in the artifact or strictly in the receiver. It must locate meaning in the **coupling** (the event of decoding). If the theory insists on a static location (Artifact *or* Receiver), **Requirement 2** becomes impossible to satisfy for radical aliens. Therefore, any theory claiming meaning is static (in the message) must be rejected for this specific design goal. **Requirement 8** should be amended to demand a *Relational* location of meaning.

  ### The Discriminator: Requirement 5 (Regress Halt)

  The single requirement that does the most work in excluding candidate theories is **Requirement 5 (Regress Halt)**. It forces the theory to identify the "ground" of decoding. In a "share nothing" scenario, you cannot assume shared logic or language. The theory must explain how the first step of decoding happens without a prior decoder.

  | Theory Family | Score on Req 5 (Regress Halt) | Analysis |
  | :--- | :--- | :--- |
  | **Message-Locus** (Structuralist) | **Fail** | Locates meaning in the object's structure. Fails to explain how the receiver accesses that structure without a pre-existing key/decoder, leading to infinite regress of "keys to read the key." |
  | **Sender-Locus** (Intentionalist) | **Fail** | Locates meaning in the sender's mind. The receiver has no access to the sender's mind without a prior channel. Cannot ground the first step of decoding in a "share nothing" scenario. |
  | **Receiver-Locus** (Pragmatist) | **Pass** | Locates meaning in the receiver's interaction with the environment. Can ground decoding in the receiver's existing physical/cognitive apparatus (universal laws), halting the regress at the receiver's biology/physics. |

  *Note: While Receiver-Locus passes Req 5, it struggles with Req 3 (Intent-Constraint). However, for the specific goal of *extracting content* (engineering), Receiver-Locus is the only one that offers a stopping point for the decoding chain.*

  ### Metaphysical Flag

  **Requirement 6 (Agency Attribution)** is a metaphysical commitment dressed as a constraint.

  *   **The Commitment:** It assumes an ontology where "message" is a distinct category from "natural information."
  *   **Why it is disguised:** By demanding the theory verdict on senderless signals (tree rings vs. radio pulses), it forces an ontological distinction between *causation* and *communication*. A physicalist theory might argue there is no difference, only complexity. A humanist theory argues intent is the differentiator. Marking this as a requirement privileges a specific metaphysics of mind over a metaphysics of matter. For the purpose of *design*, this requirement should be treated as a **Camp Preference**, not a Non-negotiable constraint, as a purely physical decoding system might treat tree rings and radio waves identically.
