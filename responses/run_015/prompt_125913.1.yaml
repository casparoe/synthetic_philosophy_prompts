prompt: |-
  hey i'm the exhibit designer at a mid-size science museum and we're overhauling our energy wing. we want all comparison graphics to follow neuraths isotype rules — same flat symbol for each unit, quantity shown by repetition not scaling up, no 3d or decorative flair, that kind of thing. but heres the twist: every display also has to pass a tactile-readability check for low-vision visitors, so the embossed outline of symbol A cant blur into symbol B.

  can you turn neuraths picture-language principles into a step-by-step procedure my team can actually run on a proposal? i want the checks in order, what counts as pass or fail at each step, the exact point where we stop with a hard reject, and the spots where its just a values call that has to go to me. apply it to two draft proposals: (1) coal vs solar using stacked identical coal-lump icons versus stacked identical sun icons, and (2) coal vs solar using one flame icon scaled three times larger next to one small lightning-bolt icon. include the case where the procedure spits out an answer we'll probably hate. and tell me straight up what this checklist cant settle — for instance whether its okay that the sun symbol feels more optimistic.
