answer: |-
  Here is the **ISOTYPE + Tactile Accessibility Protocol (ITAP)**. This is designed to be printed and stapled to every design brief before it hits your desk.

  It prioritizes the **Hard Rejects** first to save your team time. If a proposal fails Step 1, do not proceed to Step 2.

  ### The Protocol: Step-by-Step

  #### Step 1: The Neurath Core (Visual Logic)
  *Check: Does the graphic represent quantity through repetition or scaling?*
  *   **Pass:** Quantity is shown by repeating the *same* symbol at the *same* size (e.g., 5 coal icons = 5 units).
  *   **Fail (Hard Reject):** Quantity is shown by changing the size, volume, or area of a single symbol (e.g., 1 big coal icon = 5 units).
  *   **Action:** If Fail, stop. Return to designer. Do not evaluate accessibility on a broken logic.

  #### Step 2: Symbol Integrity (Visual Style)
  *Check: Are the symbols flat, abstract, and consistent?*
  *   **Pass:** 2D flat color/outline. No perspective, no shading, no drop shadows. Line weight is consistent across all symbols in the wing.
  *   **Fail (Hard Reject):** 3D rendering, photorealistic textures, or decorative flourishes that do not convey data.
  *   **Action:** If Fail, stop. Return to designer.

  #### Step 3: Tactile Resolution (Accessibility)
  *Check: Can a finger distinguish individual units without blurring?*
  *   **Criteria:**
      1.  **Line Width:** Embossed lines must be at least [Insert Museum Standard, e.g., 1.5mm].
      2.  **Inter-Symbol Spacing:** Gap between repeated symbols must be at least [Insert Standard, e.g., 3mm] to prevent "pooling" of tactile perception.
      3.  **Contrast:** High visual contrast (for low vision) must remain if the tactile layer is applied (no embossing over low-contrast colors).
  *   **Pass:** Meets all spacing and width metrics.
  *   **Fail (Hard Reject):** Spacing is too tight, causing distinct units to feel like one large shape.
  *   **Action:** If Fail, stop. Designer must increase spacing or reduce data density.

  #### Step 4: Comparative Logic (Escalation Point)
  *Check: Do the two symbols represent comparable units?*
  *   **Issue:** Comparing "Coal Lumps" to "Sun Rays" might imply a false equivalence in physical form, even if the unit count is correct.
  *   **Decision:** This is a **Values Call**.
  *   **Action:** If the team is unsure if the metaphor holds, escalate to Exhibit Designer (You).

  #### Step 5: Spatial Reality (The "Hate" Check)
  *Check: Does the required tactile spacing fit the physical wall?*
  *   **Issue:** Strict ISOTYPE repetition + Strict Tactile Spacing often results in charts that are physically too large for the allocated square footage.
  *   **Decision:** This is a **Values Call** (Data Density vs. Accessibility vs. Architecture).
  *   **Action:** If the chart requires 200% of the allocated wall space to remain legible, escalate to Exhibit Designer (You).

  ***

  ### Application to Draft Proposals

  Here is how your team should run the two drafts you provided through the protocol.

  #### Draft 1: Stacked Identical Coal-Lumps vs. Stacked Identical Suns
  *   **Step 1 (Neurath Core):** **PASS.** Quantity is shown by repetition of identical units.
  *   **Step 2 (Symbol Integrity):** **PASS.** Assuming flat outlines, no 3D shading.
  *   **Step 3 (Tactile Resolution):** **CONDITIONAL PASS.**
      *   *Risk:* Coal lumps are often drawn as irregular blobs. If the embossed outline is too organic, a finger might not know where one lump ends and the next begins.
      *   *Requirement:* Designer must simplify the coal shape to a geometric standard (e.g., rounded rectangle) to ensure the [3mm] gap is consistent. Sun rays must not be so fine they break off during embossing.
  *   **Step 4 (Comparative Logic):** **ESCALATE.**
      *   *Note:* Is a "lump" of coal equivalent to a "sun" icon? This is a metaphorical choice.
  *   **Step 5 (Spatial Reality):** **ESCALATE (The "Hate" Case).**
      *   *Outcome:* To meet the [3mm] tactile gap rule, a bar representing 100 units might need to be 4 feet long. If your wall only allows 2 feet, this proposal **passes the rules but fails the building.**
      *   *Verdict:* **Bring to Me.** I have to decide if we cut the data range or expand the wall.

  #### Draft 2: One Flame Icon (3x Scaled) vs. One Small Lightning Bolt
  *   **Step 1 (Neurath Core):** **FAIL (Hard Reject).**
      *   *Reasoning:* This violates the fundamental ISOTYPE rule. Scaling a symbol implies the *unit itself* grows, rather than the *amount* of energy increasing. It creates a visual exponent rather than a linear count.
      *   *Action:* **Stop immediately.** Do not check tactile spacing. Do not check line weight. This is a conceptual failure.
      *   *Feedback to Team:* "We cannot scale icons to show quantity. Convert to repeated units."

  ***

  ### The "Unpopular Truth" (Step 5 Outcome)
  You asked for the case where the procedure spits out an answer we'll probably hate. That is **Draft 1, Step 5.**

  **The Truth:** You cannot have high-density data, strict ISOTYPE repetition, *and* strict tactile readability in a small footprint.
  *   **The Conflict:** ISOTYPE demands repetition. Tactile accessibility demands space between those repetitions.
  *   **The Result:** The procedure will tell you that to make the "Coal vs. Solar" chart accessible, you have to remove 50% of the data points or double the size of the exhibit wall.
  *   **Why you'll hate it:** It forces you to choose between data richness and inclusion. The checklist won't solve this; it just forces you to admit the trade-off exists.

  ***

  ### What This Checklist Cannot Settle (Limitations)

  The ITAP is a technical filter, not a semantic one. It cannot resolve the following, which must remain **Values Calls** to you:

  1.  **Emotional Connotation (The "Optimism" Bias):**
      *   The checklist ensures the Sun icon is flat and repeated correctly. It *cannot* tell you if the Sun icon feels "hopeful" while the Coal icon feels "dirty."
      *   *Risk:* Even if technically perfect, the graphic might subconsciously bias the visitor toward solar.
      *   *Your Call:* You must decide if neutral abstraction (e.g., "Unit A" vs "Unit B") is better than representational symbols ("Coal" vs "Sun") to maintain scientific neutrality.

  2.  **Cultural Metaphor:**
      *   The checklist ensures the symbols are distinct tactilely. It *cannot* tell you if a "Lightning Bolt" is universally understood as "Electricity" by your specific demographic, or if it reads as "Danger."
      *   *Your Call:* You need visitor testing for semiotics, not just accessibility testing.

  3.  **Aesthetic "Soul":**
      *   Neurath's rules can make graphics feel robotic. A proposal might pass all 5 steps but feel sterile and uninviting.
      *   *Your Call:* You have the veto power to approve a minor deviation from ISOTYPE (e.g., slight color grading) if it means the difference between a visitor engaging with the wall or walking past it.

  **Summary for your team:** If it scales, it's dead (Step 1). If it blurs, it's dead (Step 3). If it fits the rules but not the wall, bring it to me (Step 5). If it feels biased, bring it to me (Limitations).
