answer: |-
  ### Brainstorm: The Author's-Side Paradox

  *   **The "Make-Believe" Move (Walton):** Standard theory says readers pretend to feel. *Collapse:* As the author, I am not pretending. I am constructing the cause of the feeling. My tears are physiological, not pretend.
  *   **The "Simulation" Move (Currie):** Readers run emotions "off-line." *Collapse:* I am not running a simulation; I am writing the code. I cannot be "off-line" from a process I am initiating.
  *   **The "Propositional Object" Move:** We grieve the *thought* of the person, not the person. *Weakness:* Too cold. I grieved the specific rhythm of his speech, not the abstract concept of him.
  *   **The "Suspension of Disbelief" Move:** Readers temporarily believe. *Collapse:* I never believed he existed. I know he is ink. Disbelief was never suspended because belief was never present.
  *   **The "Empathy" Move:** We mirror the character's pain. *Complication:* Who am I mirroring? I am the source of the pain. It is a closed loop of causality.
  *   **The "Grief for Possibility" Move:** We mourn what could have been. *Strength:* This works for the author. I mourn the draft where he lived. I mourn the path I deleted.
  *   **The "Narcissism" Move:** I am only crying for myself. *Risk:* Too cynical for the room. Dismiss this as insufficient, even if partially true.
  *   **The "Character Autonomy" Move:** "He took over and died." *Risk:* Sounds like mystical pretension. Better to frame it as "narrative necessity."
  *   **The "Ethical Responsibility" Move:** I am responsible for his suffering. *Strength:* The grief is entangled with guilt. I am the murderer and the mourner.
  *   **The "Reality of Effect" Move:** The tear is real, so the cause is real enough. *Strength:* Pragmatic. Validates the reader's experience without solving the metaphysics.
  *   **The "Incomplete vs. Unreal" Move:** Characters aren't fake; they are unfinished. *Useful:* Shifts the ontology. They are potential beings I chose not to actualize.
  *   **The "Choice" Move (Core):** The grief is for the necessity of the choice. *Load-bearing:* The pain comes from knowing I had the power to save him and chose not to.

  ***

  ### The Weight of the Unreal

  Good evening.

  The theme of this festival is "The Weight of the Unreal." It is a lovely phrase, heavy enough to sit in the mouth but light enough to float away if you aren't careful. Usually, when we talk about the weight of the unreal, we are talking about you. The readers. We ask the question that has kept philosophers employed for decades: How is it possible that you weep for people who never breathed? How can a heart break for a history that never happened?

  It is a generous question. It assumes your tears are a puzzle worth solving. But tonight, I want to turn the question around. I want to talk about the person holding the pen.

  There is a standard account of this paradox. The philosophers in the front row know it well. It suggests that when you read, you are engaging in a kind of sophisticated make-believe. You simulate grief. You know the monster isn't under the bed, but you let your body react as if it is. It is a safe fear. A contained sorrow.

  But this account collapses completely when you move from the armchair to the desk. Because I do not simulate grief for my characters. I inflict it. And then, inexplicably, I share in it.

  I finished a novel last year. In it, there is a night clerk at a train station. He is not the hero. He has no arc. He has perhaps two thousand words of dialogue across three hundred pages. He is a function. He exists to sell a ticket and look tired. Near the end, on page two hundred and fourteen, he dies. It is quiet. It is necessary for the plot.

  When I wrote that death, I stopped working for a week. I walked around my house feeling a hollow ache in my chest, the specific physical weight of loss. I cried in the shower. And this is where the paradox tightens into a knot.

  The readers in the back row know this feeling. You know what it is to miss someone who isn't there. But you have an alibi. You can say, "I was overcome by the truth of the story." Your grief is a reaction to something that feels inevitable.

  I have no such alibi. I am not reacting to inevitability. I am prescribing it.

  I know, to the sentence, which three lines will make you cry on page two hundred and fourteen. I calibrated them. I could have let the clerk live. I could have pressed the backspace key. I could have rewritten the scene so he goes home to a cat and a warm meal. If I had done that, no one in the world would have lost a person, because there never was a person to lose.

  So, what was my grief for?

  If I tell you it was "make-believe," I insult the ache I felt. It was not pretend. My cortisol levels did not know the difference between a fictional death and a real one. If I tell you I was grieving for a "proposition," I insult the memory of his voice, which I can still hear in my head.

  Some writers will tell you that characters take on a life of their own. They will say, "I wanted to save him, but he demanded to die." I understand the comfort of this mysticism. It absolves us. It makes us witnesses rather than executioners. But it is a lie. I killed him. I chose the tragedy because the book required a weight it did not yet have.

  This is the version of the paradox that keeps me up at night. It is not "How can I feel for what isn't real?" It is "How can I feel for what I made unreal?"

  For the philosophers here: the standard moves fail because they assume the subject is passive to the object. But in authorship, the subject is the cause of the object. I am not simulating an emotion toward an independent entity. I am generating an emotion toward a dependent one.

  For the writers in the middle: you know this cost. You know the moment you sacrifice a creature you love for the sake of the structure. You know the guilt of using a life as a load-bearing wall.

  And for the readers: I need you to know that when you cry for him, I am crying with you, but my tears are different. Yours are for the loss of him. Mine are for the loss of the version of the world where he lived.

  I have been asking myself: Does the fact that I am the maker make the grief less real? Is it just narcissism? Am I crying because I lost a toy?

  I don't think so. I think the grief is real precisely *because* I am the maker. It is the grief of responsibility. When a person dies in the world, we mourn the randomness of it. When a person dies in a book, we mourn the necessity of it. I grieved because I had the power to save him, and I decided that his death was worth more than his life. I decided that your sorrow was worth the price of his silence.

  That is a heavy thing to carry. It suggests that our grief for the unreal is not a glitch in our empathy, but a feature of our agency. We are capable of mourning the possibilities we ourselves extinguished.

  So, I do not have a tidy resolution for you. I cannot tell you that the clerk is "real" in some metaphysical sense. I cannot tell you that my tears are exactly the same as yours.

  I can only tell you that on page two hundred and fourteen, I killed a man who never existed, and I mourned him as if I had known him for years. And I did it so that you, in the dark of your own homes, might feel the weight of something unreal pressing down on your chest, and know that you are not alone in carrying it.

  The question remains, though. It hangs here in the room. If I could do it again, knowing the cost to me and the cost to him... knowing that I hold the backspace key like a god holds a thunderbolt... would I let him live?

  I don't know. And I suspect that as long as we tell stories, we will never know. We will just keep making people, and breaking them, and weeping for the pieces, wondering all the while if the tears are for them, or for the hands that dropped them.

  Thank you.
