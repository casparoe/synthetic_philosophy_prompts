  2.  **Brainstorming the Paradox (Author's Side):**
      *   *Standard Move 1: Make-Believe.* (Walton): We pretend to feel.
          *   *Author Case:* Collapse. I'm not pretending. I cried at my keyboard. I know it's fake, but the pain is physiological.
      *   *Standard Move 2: Simulation/Off-line Emotion.* (Currie): We run a simulation of emotion without belief.
          *   *Author Case:* Problematic. I'm not simulating; I'm deciding. I chose the death. Simulators don't pull the trigger.
      *   *Standard Move 3: Object is the Proposition.* (Lamarque): We grieve the *thought* of the person, not the person.
          *   *Author Case:* Weak. I grieved the specific cadence of his voice I invented. It feels like a person, not a proposition.
      *   *Standard Move 4: Illusion of Reality.* (Coleridge): Suspension of disbelief.
          *   *Author Case:* Impossible. I never disbelieved because I never believed. I know the mechanics.
      *   *Standard Move 5: Empathy/Mirror Neurons.*
          *   *Author Case:* Who am I mirroring? I'm the source. I'm mirroring a potential future I denied him.
      *   *Standard Move 6: Grief for Possibility.* (Bloch/Principle of Hope).
          *   *Author Case:* Stronger. I grieve the *could-have-been*. The road not taken in the draft.
      *   *Standard Move 7: Grief for Self.* (Narcissism).
          *   *Author Case:* Plausible but cruel. Is it just grief for my own loss of a tool? Feels too cynical for the room.
      *   *Standard Move 8: The Character achieves Autonomy.* (The "they took over" trope).
          *   *Author Case:* Dangerous. Sounds like madness or pretension. But captures the feeling of loss of control.
      *   *Standard Move 9: Ethical Responsibility.* (Levinas-ish).
          *   *Author Case:* I am responsible for his suffering. The grief is guilt disguised.
      *   *Standard Move 10: The Reality of the Effect.* (Pragmatism).
          *   *Author Case:* The tear is real, therefore the cause is real enough.
      *   *Standard Move 11: The "Unreal" is a Category Error.*
          *   *Author Case:* Maybe "unreal" is the wrong word. They are "incomplete" rather than "fake."
      *   *Standard Move 12: The Maker's Burden.*
          *   *Author Case:* The grief is for the necessity of the narrative. I killed him for the book's sake. The grief is the cost of art.

      *Selection for Speech:* Focus on the tension between *control* (I made him) and *necessity* (He had to die). The grief is for the *choice*.

  3.  **Drafting the Speech:**
      *   *Opening:* Acknowledge the theme ("Weight of the Unreal"). Validate the readers' tears (Back Row). Acknowledge the puzzle (Front Row).
