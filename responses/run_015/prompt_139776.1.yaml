  # Diagnostic Instrument: The Modal Space Tree

  **Instructions:** Answer each question as it appears. Follow the arrow corresponding to your answer. If a question does not apply to your previous answers, skip to the indicated leaf. Do not worry about "correctness"; answer according to your strongest philosophical inclination.

  ### The Tree

  **Node 1 (Realism):** Are claims about how things could have been true or false independently of what humans believe, say, or stipulate?
  *   **No** $\rightarrow$ Go to **Node 2**.
  *   **Yes** $\rightarrow$ Go to **Node 3**.

  **Node 2 (Anti-Realist Split):** If these claims are not independently true, is modal talk strictly false (or true only within a story), or is it not trying to state facts at all (merely expressing attitudes or plans)?
  *   **False/Story** $\rightarrow$ **Leaf A (Fictionalism)**.
  *   **Attitudes/Plans** $\rightarrow$ **Leaf B (Deflationism)**.

  **Node 3 (Grounding):** Are these independent modal truths made true by facts that do not themselves involve "could" or "must"?
  *   **No** $\rightarrow$ Go to **Node 9**.
  *   **Yes** $\rightarrow$ Go to **Node 4**.

  **Node 4 (Source):** Are these grounding facts about the intrinsic powers or natures of *actual* things, or about distinct entities representing "ways the world could be"?
  *   **Powers/Natures** $\rightarrow$ **Leaf C (Essence/Powers)**.
  *   **Distinct Entities** $\rightarrow$ Go to **Node 5**.

  **Node 5 (Alien/Empty Case):** Could there have been a fundamental property, a kind of individual, or a whole world that shares no constituents with anything that actually exists? (For example: Could there have been nothing concrete at all?)
  *   **No** $\rightarrow$ **Leaf D (Combinatorial Reduction)**.
  *   **Yes** $\rightarrow$ Go to **Node 6**.

  **Node 6 (Ontology):** Are these entities representing "ways the world could be" concrete physical systems (like our universe) or abstract objects (like descriptions, sets, or blueprints)?
  *   **Concrete Systems** $\rightarrow$ Go to **Node 7**.
  *   **Abstract Objects** $\rightarrow$ Go to **Node 8**.

  **Node 7 (Plenitude):** If these are concrete systems, does *every* possible rearrangement of their parts constitute a real world, or only some specific rearrangements?
  *   **Every Rearrangement** $\rightarrow$ Go to **Node 9**.
  *   **Only Some** $\rightarrow$ **Leaf E (Restricted Concrete Plurality)**.

  **Node 8 (Circularity):** If these are abstract objects, can they be fully described without using modal words like "possible," "necessary," or "could"?
  *   **Yes (Modal-Free)** $\rightarrow$ Go to **Node 9**.
  *   **No (Uses Modal Notions)** $\rightarrow$ **Leaf F (Circular Abstractism)**.

  **Node 9 (De Re & Epistemology):** Consider a specific wooden table and a human qualitatively indiscernible from you. Could *this* table have been made of ice? Could *that* human exist without being you? How do you know the answer?
  *   **Yes (This table/that human), Known by Intuition/Grasp of Essence** $\rightarrow$ **Leaf G (Abstract Realism - Propositional)**.
  *   **Yes (This table/that human), Known by Logical Analysis** $\rightarrow$ **Leaf H (Abstract Realism - Linguistic)**.
  *   **No (Only duplicates), Known by Theoretical Inference** $\rightarrow$ Go to **Node 10**.
  *   **No (Only duplicates), Known by Direct Perception** $\rightarrow$ **Leaf I (Concrete Modal Realism)**.

  **Node 10 (Actuality & Quantification):** When we say "Some possible people never get born," are we quantifying over things that exist in some sense? Is "actual" a property some things have and others lack, or just a word for "here"?
  *   **Exist + Property** $\rightarrow$ **Leaf J (Possibilist Concrete Realism)**.
  *   **Do Not Exist + Indexical** $\rightarrow$ **Leaf K (Actualist Concrete Realism)**.
  *   **Do Not Exist + Property** $\rightarrow$ **Leaf L (Hybrid View)**.

  *(Note: Node 9 and 10 are compressed to fit the 7-9 question constraint while covering De Re, Epistemology, Actuality, and Quantification. Node 9 serves as a major fork for Concrete vs. Abstract Realists based on Transworld Identity.)*

  ---

  ### Leaves and Commitments

  *   **Leaf A: Fictionalism.**
      *   *Awkward Commitment:* You must assert that ordinary modal claims (e.g., "I could have worn a blue shirt") are literally false, despite being useful.
  *   **Leaf B: Deflationism/Expressivism.**
      *   *Awkward Commitment:* You must deny that modal sentences express beliefs with truth conditions, treating them more like commands or expressions of surprise.
  *   **Leaf C: Essence/Causal Powers.**
      *   *Awkward Commitment:* You must accept that modality is grounded in the actual world but deny that there are "worlds" or "possibilia" distinct from actual powers.
  *   **Leaf D: Combinatorial Reduction.**
      *   *Awkward Commitment:* You must deny the possibility of alien properties or an empty world, limiting possibility to reshufflings of actual constituents.
  *   **Leaf E: Restricted Concrete Plurality.**
      *   *Awkward Commitment:* You posit many concrete worlds but deny plenitude; you must explain what restricts recombination without invoking primitive modality.
  *   **Leaf F: Circular Abstractism.**
      *   *Awkward Commitment:* You analyze modality using abstract entities that are themselves defined modally, risking circularity.
  *   **Leaf G: Abstract Realism (Propositional).**
      *   *Awkward Commitment:* You accept transworld identity and primitive modal notions in the construction of worlds (e.g., Plantinga).
  *   **Leaf H: Abstract Realism (Linguistic).**
      *   *Awkward Commitment:* You reduce worlds to consistent sets of sentences, facing the problem of expressing all truths in a language.
  *   **Leaf I: Concrete Modal Realism (Lewisian).**
      *   *Awkward Commitment:* You accept that there are concrete duplicates of you who are not you, and that "actual" is indexical.
  *   **Leaf J: Possibilist Concrete Realism.**
      *   *Awkward Commitment:* You believe non-actual concreta exist in a robust sense but lack the property of actuality (a view rarely held consistently).
  *   **Leaf K: Actualist Concrete Realism.**
      *   *Awkward Commitment:* You believe in concrete worlds but deny existence to non-actual ones, creating tension with the concreteness claim.
  *   **Leaf L: Hybrid View.**
      *   *Awkward Commitment:* You treat "actual" as a property but deny existence to possibilia, a metaphysically unstable combination.

  ---

  ### Scoring Table

  | Leaf | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Q9 |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A (Fictionalism)** | No | False/Story | - | - | - | - | - | - | - |
  | **B (Deflationism)** | No | Attitudes | - | - | - | - | - | - | - |
  | **C (Essence)** | Yes | Yes | Powers | - | - | - | - | - | - |
  | **D (Combinatorial)**| Yes | Yes | Entities | No | - | - | - | - | - |
  | **E (Restr. Concrete)**| Yes | Yes | Entities | Yes | Concrete | Some | - | - | - |
  | **F (Circ. Abstract)** | Yes | Yes | Entities | Yes | Abstract | No | - | - | - |
  | **G (Abs. Prop.)** | Yes | Yes | Entities | Yes | Abstract | Yes | Yes/Intuition | - | - |
  | **H (Abs. Ling.)** | Yes | Yes | Entities | Yes | Abstract | Yes | Yes/Logic | - | - |
  | **I (Concrete Lewis)** | Yes | Yes | Entities | Yes | Concrete | Every | No/Inference | Indexical | - |
  | **J (Poss. Concrete)** | Yes | Yes | Entities | Yes | Concrete | Every | No/Inference | Property | Exist |
  | **K (Act. Concrete)** | Yes | Yes | Entities | Yes | Concrete | Every | No/Inference | Indexical | No Exist |
  | **L (Hybrid)** | Yes | Yes | Entities | Yes | Concrete | Every | No/Inference | Property | No Exist |

  *(Note: Dashes indicate the question was not reached on that path.)*

  ---

  ### Unoccupied and Contested Regions

  **1. Restricted Concrete Plurality (Leaf E)**
  *   **Diagnosis:** This region is largely empty because it is unstable. If worlds are concrete physical systems, the motivation for positing them is usually to *reduce* modality to physical existence. If you deny that *every* recombination exists, you must explain what restricts the recombinations. Any restriction principle (e.g., "only physically lawful recombinations") inevitably smuggles primitive modal notions (lawfulness, physical possibility) back into the base. The view loses the reductive advantage that motivated accepting concrete plurality in the first place. It is empty because it is **unattractive once costs are counted**: you pay the ontological price of many worlds without gaining the theoretical benefit of reduction.

  **2. Circular Abstractism (Leaf F)**
  *   **Diagnosis:** This region is occupied only as a **polemical target**. Defenders of abstract worlds (Ersatzers) strive to construct worlds from non-modal materials (propositions, sentences, sets) to avoid circularity. Those who admit modal primitives in the construction (e.g., "maximal consistent sets of *possible* propositions") are typically criticized for failing to analyze modality. It is not incoherent, but it is **theoretically idle**: if you need modal notions to build your worlds, you might as well be a primitivist (Leaf C/Primitivism) without the extra ontology of worlds.

  **3. Hybrid View (Leaf L)**
  *   **Diagnosis:** This region is **incoherent**. It claims non-actual concreta do not exist but have the property of actuality (which they lack). This contradicts the standard understanding of existence quantification. It arises from confusing the indexicality of "actual" with a genuine property.

  ---

  ### Indistinguishability Flags

  **1. Concrete Realism (Leaf I) vs. Fictionalism (Leaf A)**
  *   **Problem:** At the level of first-order modal verdicts (e.g., "It is possible that pigs fly"), both views agree. The Fictionalist says "According to the fiction, pigs fly"; the Realist says "In world W, pigs fly."
  *   **Resolution:** Requires a **metaphysical** question about the literal truth of existential claims ("Do these worlds exist independently of our stories?"). The diagnostic separates them at Node 1, but a student might slip if they treat "truth" loosely.

  **2. Essence/Powers (Leaf C) vs. Brute Primitivism (Node 3 -> Node 9 path)**
  *   **Problem:** Both views deny that modal truths are grounded in non-modal facts about worlds. Dispositionalists say powers ground them; Primitivists say they are brute.
  *   **Resolution:** Requires a **semantic/metaphysical** distinction: "Is 'power' a reducible non-modal property, or is it itself modal?" If powers are modal, the view collapses into Primitivism. The tree forces a choice at Node 3, but students may not realize "powers" are often modal disguised.

  **3. Fictionalism (Leaf A) vs. Deflationism (Leaf B)**
  *   **Problem:** Both deny mind-independent modal truths. Both treat modal discourse as non-descriptive in the robust realist sense.
  *   **Resolution:** Requires a **semantic** question about the truth-value of modal sentences. Fictionalism says they are false (or true-in-fiction); Deflationism says they lack truth conditions entirely. This is a subtle distinction in the philosophy of language, not metaphysics.

  ---

  ### Closing Diagnosis

  The single most discriminating question is **Node 6 (Ontology: Concrete vs. Abstract)**. It forces the student to commit to the category of being of the truth-makers, which dictates the subsequent problems they must solve (plenitude for concrete, circularity for abstract).

  The **wild patterns** are those that answer **Yes** to Node 5 (Alien/Empty) but **No** to Node 4 (Distinct Entities/Worlds). This combination suggests a student believes in alien properties but thinks they are grounded in the natures of actual things. This is metaphysically unstable: if actual things ground the possibility of alien properties they do not instantiate, the grounding relation is obscure. A student producing this pattern likely has not grasped the connection between grounding and instantiation, or is secretly a Primitivist who fears the label. Another wild pattern is **Concrete Worlds (Node 6)** combined with **Transworld Identity (Node 9, Yes)**. This implies a belief that *this* object exists in multiple concrete universes, which contradicts the spatiotemporal isolation required for concrete plurality. This suggests the student is conflating Concrete Realism with a form of Abstract Realism or has not understood the "concrete" commitment.
