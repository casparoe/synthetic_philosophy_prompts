answer: |-
  **The Scenario**

  Arthur, a master baker of twenty years, judges dough readiness by touch alone, achieving near-perfect consistency in his loaves. He studies biochemistry, mastering the exact role of gluten cross-linking and yeast metabolism, verified by exhaustive written and oral examination. He abandons touch, instead stopping the mix when his calculated theoretical window is reached based on flour protein content and room temperature. His loaves collapse more often. The theory is correct; the measurements are accurate; he is not anxious or rushed. The drop occurs because the theoretical model, while true, requires him to manually compensate for micro-variations in humidity and flour age that his touch automatically integrated, and his new 'theory-using' hands have not yet learned the fine motor adjustments to match the precision of his old blind feel.

  ***

  **The Walkthrough**

  **The Two Accounts**
  The **comprehension-first** account must argue that if Arthur's performance degraded, his grasp of the situation was necessarily deficient. Since true understanding should guide action successfully, the failure implies he didn't *really* comprehend the biochemistry, or else something extrinsic interfered. They will claim that genuine comprehension includes the know-how to apply it, so the collapse proves the comprehension was merely abstract, not practical. They are forced to treat the comprehension as a binary state: either you have it and succeed, or you fail and thus didn't have it.

  The **competence-first** account argues that comprehension is a tool, not a guarantee. Arthur possesses a true model (verified by exams), but the *controller* running on that model is a novice. The old habit was a blind, highly calibrated competence honed over decades; the new comprehension is a veridical but clumsy competence honed over weeks. The degradation isn't about the truth of the model, but the calibration of the agency wielding it. The comprehension is real, but it is currently a weaker competence than the habit it displaced.

  **The Key Feature**
  The work is done by the **dissociation between model truth and controller calibration**. The case stipulates the model is true (blocking the "false belief" escape) and the agent is calm (blocking the "choking" escape). This forces the explanation onto the history of the controller itself. If you remove this feature—say, by letting Arthur practise the theory-based method for another twenty years—the competence-first account predicts performance will eventually surpass the old habit (as the controller calibrates), whereas the comprehension-first account struggles to explain why "true understanding" needed so long to start working. If you allow the old habit as a fallback, Arthur switches back, demonstrating that the blind competence remains superior to the seeing comprehension in the current timeframe.

  **The Strongest Objection**
  The comprehension-first proponent will invoke a Rylean distinction: "To understand the chemistry of baking *just is* to know how to bake using that chemistry. If he can't bake with it, he doesn't understand it." They will argue that verifying comprehension via oral exams only tests propositional knowledge (*knowing-that*), not the relevant practical knowledge (*knowing-how*), and therefore the case stipulation that he "comprehends" is cheating.

  **Should You Buy It?**
  No. This objection begs the question by defining comprehension as successful competence. The point of the inversion is to test whether comprehension *produces* competence. By accepting independent verification of the model (the exams), you allow comprehension to be a distinct variable from performance. If you define comprehension as "whatever makes you succeed," you make the thesis tautological and untestable. The case holds because we can independently verify the truth of the internal model separate from the success of the output.

  ***

  **Honest Assessment**

  Does this show something about the strange inversions, or only that skills take practice?

  It shows the strange inversions *because* it confirms that skills take practice—even the skill of comprehending. Your friend pushes the "skills take practice" line as if it were a trivial objection that dissolves the philosophical mystery. They think: "Of course understanding doesn't help immediately; you need to learn to use it. So what?"

  But that "So what?" is exactly Dennett's point. The mystery only exists if you assume comprehension is a magical light that instantly illuminates correct action. If comprehension is just another competence, then of course it has a learning curve, an error profile, and can be outperformed by older, blinder competences. The case works because it forces you to treat comprehension as a *naturalised* capacity subject to the same evolutionary and learning constraints as blind habit. If you accept the case, you accept that comprehension is not the *source* of competence, but a *species* of it. So, your friend is right that it comes down to practice, but wrong to think that makes it trivial. It is the recognition that comprehension is subject to practice that *is* the strange inversion.
