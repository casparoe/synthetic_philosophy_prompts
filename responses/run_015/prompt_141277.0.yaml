answer: |-
  ### Ranking: Expected Moral Priority Per Unit of Attention

  | Rank | Taxon | Score | Tier | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Farmed insects (crickets, mealworms, BSF) | 95 | S | Direct human control offers the highest leverage for welfare improvements per dollar spent despite lower raw numbers. |
  | 2 | Managed honey bees and bumblebees | 85 | A | Regulatory pathways exist to improve welfare, and public sympathy makes attention conversion highly efficient. |
  | 3 | Ants | 80 | A | The sheer scale of lives per year dominates the calculation even if intervention tractability is currently low. |
  | 4 | Termites | 75 | B | Comparable biomass and social complexity to ants but slightly less geographic overlap with human economic activity. |
  | 5 | Flies and mosquitoes | 60 | B | Extremely high turnover multiplies moral weight, and vector control programs offer a potential intervention wedge. |
  | 6 | Aphids, whiteflies, leafhoppers | 55 | C | Boom-and-bust dynamics create massive short-term suffering spikes, but agricultural targeting is complex. |
  | 7 | Beetles | 50 | C | Immense diversity makes generalization impossible, diluting the effectiveness of any unified intervention strategy. |
  | 8 | Moths and butterflies | 45 | C | Short adult lives reduce the turnover multiplier relative to pests, and larval welfare is hard to access. |
  | 9 | Soil springtails and oribatid mites | 40 | D | Numbers are absurd but scientific neglect makes designing effective interventions currently impossible. |
  | 10 | Parasitoid wasps | 30 | D | High suffering-per-capita is offset by lower total biomass and the ecological risk of disrupting pest control. |

  ***

  ### Which two adjustments should you delete?

  1.  **The Replacement Haircut (90%):** This conflates *replaceability* with *moral irrelevance*. Preventing a specific instance of severe suffering is morally valuable even if the ecological niche is filled by a new individual tomorrow; applying a flat discount assumes the only thing that matters is total population size rather than the quality of existing lives.
  2.  **The Log-Odds Haircut:** This is a policy heuristic for risk-averse donors, not a truth-tracking adjustment for an expected value model. Arbitrarily halving value based on probability thresholds biases the spreadsheet against the very tail-risk scenarios (high scale, low probability) it was built to investigate.

  ### Which single adjustment drives the ranking?

  **The Turnover Multiplier.**
  Without converting standing population to lives per year, long-lived vertebrates dominate the model; applying this multiplier allows short-lived, high-biomass invertebrates (like aphids and ants) to mathematically overwhelm the vertebrate baseline, which is the entire engine of the scale argument.

  ### Confidence and the "Dread Cell"

  **Confidence:** 0.2 (Low)
  **The Cell to Dread:** **P(Sentience) for Eusocial Workers.**
  We have almost no idea if sterile worker ants/bees possess individual phenomenal consciousness or function as non-sentient biological robotics; if this probability is near zero, the top of your ranking (Ants/Termites/Bees) collapses entirely, invalidating the bulk of the fund's potential invertebrate allocation.
