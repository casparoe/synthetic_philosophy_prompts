prompt: |-
  Quick question for a feature I'm fileing on Borges and time—probably sounds dumb but I'm stuck. I keep seeing people say that in A New Refutation of Time Borges basically uses Einsteinian relativity to kill objective simultaneity, then stacks Zeno's arrow on top to prove motion is just a perceptual glitch, which means the past and future literally don't exist outside the present instant. But then I came across this weird framing—call it temporal atomism with chronometric isolation—where each moment is causally sealed off from every other, not just frame-relative. Is that actually Borges's real view, or am I accidentally smuggling in the cosmology from his fictional Tlön? Because if he really holds the stronger isolation claim, wouldn't it clash with those other essays where he toys with eternal recurrance? I feel like I'm making a basic misread but I can't spot where.
reasoning: |-
