answer: |-
  This is not a dumb question at all; it's actually a very sharp catch on a tension that trips up a lot of Borges scholarship. You are right to feel uneasy about the "chronometric isolation" framing in *A New Refutation of Time*.

  Here is the breakdown of where your reading is hitting the mark and where you are likely smuggling in *Tlön*.

  ### 1. The Essay is Skepticism, Not Dogma
  The most important thing to remember about *A New Refutation of Time* (1944) is in the title: it is a **refutation**, but it is also a performance. In the famous postscript, Borges explicitly undercuts his own argument: *"The world, unfortunately, is real; I, unfortunately, am Borges."*

  He admits that while he can logically dismantle time using Berkeley, Hume, and Einstein, he cannot *live* without it. So, if you are looking for Borges's "real view," you won't find a systematic ontology here. He is using these philosophical tools to show that time is intellectually untenable, not necessarily to propose a replacement physics.

  ### 2. You Are Smuggling in *Tlön*
  Your intuition about "temporal atomism with chronometric isolation" is spot on, but you are correct to suspect it belongs to *Tlön, Uqbar, Orbis Tertius* (1940) rather than the *Refutation* essay.

  *   **In *Tlön*:** The metaphysics of the planet Tlön is radical idealism. Objects do not persist when unperceived; cause and effect are loose associations. This is where you get the idea of moments being "causally sealed off." In Tlön, every mental state is an absolute, isolated universe.
  *   **In *Refutation*:** Borges is arguing from **Humean skepticism regarding the Self**. His argument isn't primarily that *physical* moments are causally isolated (though he hints at it via Hume's critique of causality); it's that the *subject* who experiences time is discontinuous. If there is no persistent "I" to connect moment A to moment B, then time (as a continuum) does not exist.

  The "chronometric isolation" you describe is a physicalization of the idealism found in *Tlön*. In *Refutation*, the isolation is **psychological/ontological regarding the subject**, not necessarily a claim about the causal structure of the external universe (which he admits is "unfortunately real").

  ### 3. Einstein and Zeno are Tools, Not Foundations
  You noted that people say he uses Einstein to kill simultaneity and Zeno to kill motion. This is true, but Borges uses them **poetically**, not scientifically.
  *   He uses Einstein to support **Berkeleyan Idealism**: If simultaneity is relative to the observer, then objective time is dependent on the subject.
  *   He uses Zeno to support **Humean Skepticism**: If we can't logically traverse a continuum, then our experience of continuity is a mental construct.

  He isn't building a cosmology where moments are physically sealed off (like atoms); he is arguing that the *concept* of time collapses under logical scrutiny.

  ### 4. The Clash with Eternal Recurrence
  You asked: *"If he really holds the stronger isolation claim, wouldn't it clash with those other essays where he toys with eternal recurrence?"*

  **Yes, it absolutely clashes.** And Borges knows it.

  Borges is not trying to build a consistent philosophical system. He is a literary writer who uses philosophy as material.
  *   **Time as Isolation (Refutation/Tlön):** Time is an illusion; moments are discrete.
  *   **Time as Cycle (Eternal Recurrence):** Time is a circle; moments repeat infinitely.

  For Borges, the value lies in the **contradiction**. In *The Time of New Hope* or his notes on Nietzsche, he explores Eternal Recurrence not because he thinks it's physically true, but because of the ethical and emotional weight it carries. In *Refutation*, he explores the non-existence of time because of the logical weight *that* carries.

  He holds both ideas in tension to show the limits of human reason. As he writes in *A New Refutation of Time*: *"I do not know if I have convinced the reader... I suspect that the final answer is in the nature of the mind."*

  ### The Verdict
  You are making a basic misread only insofar as you are treating Borges as a philosopher seeking consistency rather than a skeptic seeking aporia.

  1.  **Is "Temporal Atomism" his real view?** No. It's the fictional cosmology of *Tlön* and a skeptical hypothesis in *Refutation*.
  2.  **Does it clash with Eternal Recurrence?** Yes, violently.
  3.  **Is that a problem?** No. For Borges, the contradiction is the point. He is mapping the labyrinth of human thought, not drawing a map of the universe.

  **Recommendation for your feature:** Frame it as Borges using "chronometric isolation" as a **skeptical wedge** rather than a metaphysical claim. He isolates the moment to dissolve the Self, not to rewrite physics. If you treat the "isolation" as a literary device to explore the solitude of consciousness (rather than a causal claim), the tension with Eternal Recurrence disappears—they become two different myths Borges uses to explain the inexplicable nature of existence.
