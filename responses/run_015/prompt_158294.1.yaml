answer: |-
  This is a precise request that cuts to the heart of the philosophy of computation. The Church-Turing Thesis (CTT) sits at a jagged intersection of logic, physics, and semantics. To settle its epistemic status, a theory cannot simply pick a side; it must provide a framework that explains *why* the ambiguity exists and what conditions would resolve it.

  Below is the desiderata list for a meta-theory of CTT, followed by the analysis of trade-offs, the "killer" criteria, and the scorecard.

  ---

  ### I. The Desiderata List for a Theory of CTT

  Any theory claiming to settle the status of CTT must satisfy the following five criteria. Failure to meet these results in either triviality (tautology) or incoherence (category error).

  #### 1. The Atomicity Criterion (Operational Granularity)
  **Requirement:** The theory must define the minimum "step" of computation without begging the question.
  **Why:** This distinguishes **Discrete TMs** from **BSS Machines** (Blum-Shub-Smale over reals).
  *   **Constraint:** It must specify whether an operation on a real number (with infinite precision) counts as *one* step or *infinite* steps.
  *   **Consistency Check:** Must align with **Landauer's Principle** (information is physical). If a "step" requires infinite energy or infinite density, the theory must classify it as physically impossible, not just computationally distinct.
  *   **Non-Collapse:** Cannot collapse the distinction between *mathematical idealization* (BSS) and *physical instantiation* (noisy analog).

  #### 2. The Invariance Criterion (Model Robustness)
  **Requirement:** The class of computable functions must remain stable under reasonable changes to the machine architecture, provided the "effective" nature is preserved.
  **Why:** This handles **Quantum Circuits (BQP)** vs. **Oracle TMs**.
  *   **Constraint:** Must explain why BQP (which offers exponential speedup) does not violate CTT (which is about *computability*, not *complexity*), while an Oracle TM with a Halting Oracle *does* violate the "effective" clause.
  *   **Consistency Check:** Must respect the **Invariance Theorem** in recursion theory (all Turing-equivalent models compute the same partial recursive functions).
  *   **Non-Collapse:** Cannot collapse *efficiency* (polynomial time) with *effectivity* (decidability).

  #### 3. The Epistemic Access Criterion (Knowability)
  **Requirement:** The theory must explain how an agent *knows* a function is computable. Is it via proof or measurement?
  **Why:** This distinguishes **Effective Calculability** (human/mathematical intuition) from **Physical Computability** (laws of nature).
  *   **Constraint:** If CTT is empirical, there must be a measurement protocol that verifies a hypercomputer. If CTT is definitional, verification must be purely syntactic/proof-theoretic.
  *   **Consistency Check:** Must account for the **Verification Problem**. We cannot empirically verify a function is *total* (halts on all inputs) in finite time. A theory claiming CTT is empirical must solve how we falsify "halting" empirically.
  *   **Non-Collapse:** Cannot collapse *mathematical truth* (provable) with *physical fact* (observable).

  #### 4. The Contingency Criterion (Modal Status)
  **Requirement:** The theory must state whether CTT holds in all possible worlds or only in ours.
  **Why:** This addresses **Hypercomputation** (e.g., Malament-Hogarth spacetimes).
  *   **Constraint:** If CTT is a law of nature, it should be contingent on physics (e.g., if quantum gravity allows closed timelike curves, CTT might break). If it is conceptual, it holds even in Newtonian or relativistic worlds.
  *   **Consistency Check:** Must remain consistent with **General Relativity** solutions that theoretically allow infinite computation in finite proper time.
  *   **Non-Collapse:** Cannot collapse *logical possibility* with *physical feasibility*.

  #### 5. The Normative/Descriptive Boundary
  **Requirement:** The theory must specify if CTT prescribes what computers *ought* to be (normative) or describes what physical systems *do* (descriptive).
  **Why:** This addresses the **Formalist vs. Naturalist** split.
  *   **Constraint:** If normative, "computation" is a human practice (Sieg/Gandy). If descriptive, "computation" is a natural kind (Copeland/Pitowsky).
  *   **Consistency Check:** Must align with **Recursion Theory** (which is normative/definitional) and **Quantum Information** (which is descriptive/physical).
  *   **Non-Collapse:** Cannot collapse *algorithmic procedure* (finite instructions) with *physical process* (continuous evolution).

  ---

  ### II. The Jointly Unsatisfiable Subset (The Trade-Off)

  There is a triad of desiderata where you can satisfy any two, but not all three. This is the source of the enduring debate.

  1.  **Empirical Falsifiability:** CTT can be proven false by a physical experiment.
  2.  **Discrete Exclusivity:** Only discrete, finite-state processes count as "computation."
  3.  **Physical Realism:** The laws of physics (e.g., QM, GR) are the ultimate arbiter of what processes are possible.

  **The Conflict:**
  *   If you hold **(2) and (3)**: You must deny that analog/continuous physics can compute. But if physics *is* continuous (BSS-style), you are denying physical realism to save the definition. CTT becomes true by fiat, violating **(1)**.
  *   If you hold **(1) and (3)**: You must admit that if physics allows infinite precision analog states, CTT is false. This violates **(2)** because you must accept analog hypercomputation as "computation."
  *   If you hold **(1) and (2)**: You claim CTT is falsifiable but only discrete things compute. This implies physics *must* be discrete. This is a physical claim disguised as a definition, violating the neutrality of **(3)**.

  **Conclusion:** You cannot simultaneously maintain that CTT is an **empirical law**, that **analog hypercomputation is impossible by definition**, and that **physics dictates possibility**. One must give.

  ---

  ### III. The "Killer" Desiderata

  You asked for the single criterion that eliminates each of the two dominant views.

  #### 1. The Desideratum that eliminates the "It's Just a Definition" View
  **The Criterion:** **Physical Contingency of the Continuum.**
  *   **Logic:** If the theory requires that the status of CTT depends on whether the physical universe is fundamentally discrete or continuous (e.g., Planck scale limits), then CTT cannot be a mere definition. Definitions do not depend on experimental physics.
  *   **Effect:** If you accept that a discovery of "infinite precision physical variables" would refute CTT, you have conceded it is not a definition. It forces the Formalist to admit empirical risk.

  #### 2. The Desideratum that eliminates the "It's a Physical Law" View
  **The Criterion:** **Invariance of Effective Procedure.**
  *   **Logic:** If the theory requires that the notion of an "effective step" is derivable purely from the analysis of human calculation or symbolic manipulation (Gandy's Principles), independent of the substrate, then CTT is not a law of physics.
  *   **Effect:** If you accept that "computation" is defined by the *logic of instructions* rather than the *causality of the hardware*, you concede that a physical device violating CTT is simply not a "computer" (it's an oracle or a measurer). It forces the Naturalist to admit conceptual closure.

  ---

  ### IV. Scorecard: Definition vs. Physical Law

  | Desideratum | **View A: CTT is a Definition** (Formalist/Logicist) | **View B: CTT is a Physical Law** (Naturalist/Empiricist) | **Verdict** |
  | :--- | :--- | :--- | :--- |
  | **Atomicity** | **Pass.** Defines step as discrete symbol manipulation. | **Fail.** Struggles to define "step" in continuous QM/GR without arbitrariness. | Advantage: Definition |
  | **Invariance** | **Pass.** Robust across all Turing-equivalent formalisms. | **Risk.** If physics changes (e.g., non-linear QM), invariance breaks. | Advantage: Definition |
  | **Epistemic Access** | **Pass.** Verified by mathematical proof. | **Fail.** Cannot empirically verify "halting on all inputs." | Advantage: Definition |
  | **Contingency** | **Fail.** Ignores that physical realizability matters for *application*. | **Pass.** Acknowledges CTT could fail in exotic spacetimes. | Advantage: Law |
  | **Falsifiability** | **Fail.** Immune to empirical counter-evidence (tautological). | **Pass.** Open to refutation by hypercomputational device. | Advantage: Law |
  | **Unsatisfiable Subset** | **Sacrifices Contingency.** (CTT holds even if physics allows hypercomp). | **Sacrifices Discrete Exclusivity.** (Must accept analog as comp). | **Draw** |

  ---

  ### V. Synthesis: Where the Thinking Lies

  The weight of the criteria suggests that the "Definition vs. Law" dichotomy is itself the error. A satisfactory theory of CTT must treat it as a **Bridge Principle**.

  1.  **Distinguishing the Cases:**
      *   **BQP:** Satisfies *Atomicity* (gates are discrete) and *Invariance*. It is Turing-computable. A theory must classify this as **CTT-Compliant but Complexity-Divergent**.
      *   **BSS Machines:** Violates *Atomicity* (infinite precision steps). A theory must classify this as **Mathematically Coherent but Physically Ambiguous**. It settles the status of CTT only by settling the discreteness of space-time.
      *   **Oracle TMs:** Violates *Epistemic Access* (we cannot construct the oracle). A theory must classify this as **Formally Useful but Physically Vacuous** regarding CTT.

  2.  **The Non-Negotiables:**
      *   You cannot collapse **Effective Calculability** (what a human can do with paper and pencil) from **Physical Computability** (what the universe can do). The former is the domain of the "Definition" view; the latter is the domain of the "Law" view.
      *   **Recursion Theory Consistency:** Any theory must preserve the undecidability of the Halting Problem *within the formal system*. If a physical theory claims to solve it, the theory must explain why that physical process escapes the formal definition of "algorithm."

  3.  **Final Resolution:**
      The only way to satisfy the Desiderata List without contradiction is to bifurcate the Thesis:
      *   **CTT-Math:** "All *effectively calculable* functions are Turing computable." (True by Definition/Analysis of 'effective').
      *   **CTT-Phys:** "All *physically realizable* computing devices are Turing equivalent." (An Empirical Hypothesis, currently unfalsified, contingent on the discreteness of nature).

      The confusion arises when proponents slide between CTT-Math and CTT-Phys. The desiderata above force you to pick which one you are defending. If you defend CTT-Phys, you must accept the **Physical Contingency** criterion (admitting it could be false). If you defend CTT-Math, you must accept the **Invariance** criterion (admitting analog hypercomputers aren't "effective" by definition).

      **The single point of failure for most theories:** They attempt to use the certainty of CTT-Math to bolster the empirical claims of CTT-Phys. The desiderata list prohibits this transfer of epistemic warrant.
