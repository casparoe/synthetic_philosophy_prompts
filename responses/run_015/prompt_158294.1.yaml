prompt: |-
  okay so i've been thinking about the Church-Turing thesis and its epistimic status—why people treat it like its either tautologically true or empirically false depending on whether they allow analog hypercomputation. i want the full desiderata list for any theory that claims to settle what kind of claim the thesis actually is.

  specifically: what cases must it distinguish? (e.g. quantum circuits that are BQP-complete vs BSS machines over the reals vs oracle TMs with a halting oracle). what distinctions can't it collapse—like between 'effective calculability' as a mathematical concept and 'physical computability' as a law of nature? what results from recursion theory or quantum info does it have to stay consistent with? and which requirements are non-negotiable vs just camp preferences (formalists wanting definitional status, naturalists wanting empirical falsifability)?

  also: is there a jointly unsatisfiable subset? like, can you both preserve empirical falsifability and deny that analog computation counts as computation? tell me which single desideratum eliminates the 'its just a definition' view and which eliminates the 'its a physical law' view. quick scorecard against those two is fine, but keep the weight on the criteria themselves—thats where the thinking is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

