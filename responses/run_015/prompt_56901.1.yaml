  ### 1. Component Weights and Defense

  **Proposed Weights:**
  *   **Principality Cost (PC):** 0.5
  *   **Audit Opacity (AO):** 0.3
  *   **Reciprocity Durability (RD):** 0.2

  **Defense:**
  Principality Cost receives the highest weight (0.5) because the fundamental justification for anti-corruption efforts is the prevention of harm to the beneficiaries of public trust. Without measurable loss (material or reputational), the practice may be unethical but lacks the severity of corruption.

  Audit Opacity receives significant weight (0.3) because it measures the **structural resilience** of the practice rather than merely the likelihood of escape. A practice that is indistinguishable from legitimate discretion corrodes the accountability mechanism itself, allowing the harm to persist and scale. If opacity measured only detectability, it would be an enforcement metric, not a severity metric; however, because high opacity implies the corruption is embedded within legitimate processes, it amplifies the systemic wrongfulness.

  Reciprocity Durability receives the lowest weight (0.2) because while long-term obligations indicate deeper capture, a single high-harm event (high PC) is often more immediately destructive than a durable but low-value social exchange.

  ### 2. Practice Scoring and Ranking

  | Rank | Practice | PC (0.5) | AO (0.3) | RD (0.2) | Total | Justification |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | **h** (Revolving Door) | 7 | 2 | 8 | **5.7** | High long-term capture risk; ambiguity resolved favorably by assuming salary is market-rate. |
  | 2 | **c** (Surgeon Cash) | 4 | 9 | 2 | **5.1** | High opacity due to cash; ambiguity resolved favorably by weighing salary arrears as mitigation. |
  | 3 | **g** (Procurement Split) | 4 | 8 | 3 | **5.0** | High opacity in splitting orders; ambiguity resolved favorably by assuming vendor reliability prevented performance loss. |
  | 4 | **b** (Patronage Jobs) | 5 | 3 | 8 | **5.0** | High durability in tight district; ambiguity resolved favorably by assuming no qualified alternative candidates existed. |
  | 5 | **e** (Judge Hunting) | 3 | 5 | 5 | **4.0** | Moderate social bonding; ambiguity resolved favorably by assuming costs were strictly shared. |
  | 6 | **a** (Nepotism Contract) | 3 | 5 | 4 | **3.8** | Low material cost; ambiguity resolved favorably by assuming bid was truly at market price. |
  | 7 | **d** (Legislator Hospitality) | 2 | 5 | 3 | **3.1** | Low cost as vote unchanged; ambiguity resolved favorably by assuming hospitality was within standard norms. |
  | 8 | **f** (Permit Waiver) | 3 | 2 | 5 | **3.1** | Low material cost; ambiguity resolved favorably by assuming fee was negligible relative to budget. |
  | 9 | **i** (Ceremonial Vase) | 0 | 1 | 1 | **0.5** | Negligible cost; ambiguity resolved favorably by assuming strict adherence to protocol. |

  ### 3. Conflicts with Prevailing Intuition

  **Conflict 1: Practice (h) vs. Practice (c)**
  *   **Conflict:** Prevailing opinion in wealthy bureaucracies typically views direct cash bribes (c) as criminal and severe, while viewing post-employment moves (h) as legal or merely "soft" corruption. The index ranks (h) as more severe than (c).
  *   **Analysis:** This exposes a **defect in the intuition**. The index correctly identifies that the revolving door creates durable regulatory capture (high RD) and long-term policy distortion, whereas the cash bribe is a transactional event with higher detectability risk (lower AO) and no structural change to the regulator's incentives after the fact.

  **Conflict 2: Practice (g) vs. Practice (a)**
  *   **Conflict:** Prevailing opinion often views nepotism (a) as a deep moral failing and cultural rot, while viewing procedural manipulation for efficiency (g) as a bureaucratic technicality. The index ranks (g) as more severe than (a).
  *   **Analysis:** This exposes a **defect in the intuition**. The index correctly prioritizes the erosion of competitive systems (high AO in splitting orders) over a specific hiring decision where the outcome (market price, specification met) caused no material loss (low PC). Procedural integrity is more vital to systemic health than individual moral purity in hiring when outcomes are identical.

  ### 4. Standing Objection Analysis

  **Classification:**
  *   **Reciprocity-based:** a, b, d, e, f, h, i
  *   **Monetized:** c, g

  **Score Gap Calculation:**
  *   Average Reciprocity Score: $(3.8 + 5.0 + 3.1 + 4.0 + 3.1 + 5.7 + 0.5) / 7 = 3.6$
  *   Average Monetized Score: $(5.1 + 5.0) / 2 = 5.05$
  *   **Gap (Reciprocity − Monetized):** **-1.5**

  **Fraction of Gap Tracking Genuine Wrongfulness:**
  **0.7**

  **Reasoning:**
  The negative value indicates the index is *not* over-penalizing reciprocity relative to monetization; in fact, it penalizes monetized practices more heavily. Seventy percent of this gap is genuine because monetized practices (cash, contract splitting) inherently require higher Audit Opacity to survive, and opacity is a legitimate driver of systemic severity. However, thirty percent is an artifact because the Principality Cost component struggles to quantify the long-term erosion of social trust caused by reciprocity-based allocation in weak states (e.g., practice b), which may be more damaging than the metric captures.
