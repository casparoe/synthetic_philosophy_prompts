answer: |-
  This is a sharp observation, and you are definitely not rambling. You've isolated a specific failure mode of human-AI cognitive coupling that is currently generating a lot of friction in epistemology and cognitive science.

  To answer your primary question: **Yes, there are emerging terms for this, though no single consensus label yet.** However, your description maps almost perfectly onto a few converging concepts in the literature.

  Here is a breakdown of the existing terminology, the mechanisms at play, and how to distinguish this from standard epistemic dependence.

  ### 1. The Leading Candidate: "Epistemic Inflation"
  The term gaining the most traction for exactly this phenomenon is **Epistemic Inflation**.
  *   **Source:** Recent work in social epistemology and AI ethics (e.g., Michel Klenk, 2023; various papers in *Philosophy & Technology*).
  *   **Definition:** It describes a state where the use of AI tools increases a subject's *confidence* in their knowledge or reasoning ability without a corresponding increase in *competence* or *justification*.
  *   **Why it fits:** You noted it's not standard Dunning-Kruger (which is a general calibration error). Epistemic inflation is *caused* by the tool. The tool provides a "coherence subsidy" that your metacognition misinterprets as your own cognitive surplus.

  ### 2. The Psychological Mechanism: "The Illusion of Explanatory Depth" (IOED) + "Processing Fluency"
  You are describing a technologically supercharged version of the **Illusion of Explanatory Depth** (Rozenblit & Keil, 2002).
  *   **Classic IOED:** People think they understand how a zipper works until asked to explain the mechanism step-by-step.
  *   **LLM-IOED:** The LLM provides the step-by-step explanation *for* you. Because the output has high **Processing Fluency** (it reads smoothly, connects ideas logically, uses familiar terminology), your brain's metacognitive monitor tags the content as "internally generated" or "mastered."
  *   **The Isomorphism Test:** Your insight about failing on isomorphic problems is the critical diagnostic. In learning science, this is a failure of **Transfer**. You have acquired *recognition* memory (this looks right) but not *generative* understanding (I can reconstruct the structure).

  ### 3. The Agency Problem: "Misattribution of Cognitive Agency"
  This distinguishes your case from standard epistemic dependence (testimony).
  *   **Testimony:** When a colleague explains a model to you, there is a clear subject-object distinction. You know you are deferring to *their* agency.
  *   **LLM Interaction:** LLMs are designed to be conversational mirrors. They lack a distinct "voice" or persona (unlike a human expert). This creates **Agency Blurring**. When you read the output, it feels like an externalized version of your own inner monologue.
  *   **The Result:** You aren't deferring to an authority; you are **appropriating** the output. You experience the reasoning as *yours* because the interface is designed to minimize the friction of "otherness." This is closer to **Ventriloquism** than testimony.

  ### 4. Why It's Not "Calculator Use" (Syntax vs. Semantics)
  This is a crucial distinction for a philosophy of science context.
  *   **Calculator:** Offloads *syntax* (computation). You still retain the *semantic* understanding of what the numbers mean and why you are dividing them. If you type `10/0`, the calculator errors, but *you* know why that's problematic conceptually.
  *   **LLM:** Offloads *semantics* and *coherence*. It generates the connections between concepts. If you offload the semantic linking, you are offloading the very substrate of "understanding."
  *   **The Difference:** Using a calculator extends your reach; using an LLM for reasoning can replace the bridge itself. You are standing on the other side of the gap without having walked across.

  ### 5. Boundary Conditions: The Paraphrasing Trap
  You asked if the ability to paraphrase matters.
  *   **The Generation Effect:** In cognitive psychology, generating material yourself usually aids retention.
  *   **The Illusion of Competence:** However, research (e.g., Bjork et al.) shows that **easy generation** (like paraphrasing a smooth LLM output) creates a false sense of mastery.
  *   **The Edge:** If you can paraphrase but cannot transfer (solve the isomorphic problem), you are engaging in **Surface-Level Encoding**. You are memorizing the *topology* of the argument without grasping the *load-bearing walls*.
  *   **Conclusion:** Paraphrasing ability is not a sufficient condition for understanding in this context. It is actually part of the trap. The smoothness of the LLM text makes paraphrasing too easy, bypassing the "desirable difficulty" required for actual internalization.

  ### 6. Suggested Terminology for Your Work
  If you are writing this up, "Epistemic Inflation" is the strongest existing hook. However, if you want to coin a descriptive phrase for this specific *pattern* of isomorphism failure, consider:
  *   **"Proxy Coherence"**: Relying on the machine's coherence check rather than your own.
  *   **"Structural Pseudo-Understanding"**: Grasping the shape of the argument without the causal/logical machinery.
  *   **"Metacognitive Miscalibration via Coupling"**: A mouthful, but precise.

  ### 7. A Vice Epistemology Angle
  Since you are in epistemology, you might frame this as a technologically facilitated **Intellectual Vice**.
  *   It cultivates **Intellectual Arrogance** (inflated confidence).
  *   It encourages **Epistemic Laziness** (accepting the coherence check without verifying the structural integrity).
  *   It creates **Epistemic Fragility** (your understanding collapses when the tool is removed or the domain shifts).

  ### Summary
  You are describing **Epistemic Inflation** driven by **Processing Fluency** and **Agency Blurring**. It differs from calculator use because it offloads semantic coherence rather than syntactic computation. It differs from testimony because the lack of a distinct "other" leads to misattribution of agency.

  The isomorphism failure is your smoking gun: it proves you have **recognition** without **reconstruction**.

  (No need to apologize for typos/rambling; this is a high-signal query. It's a very timely problem for the field.)
