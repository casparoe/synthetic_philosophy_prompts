prompt: |-
  Hey — picture this. You're advising a small but serious foundation that has maybe $40m to spend over five years on one thing: making the people who hold legislative power in a mid-sized parliamentary democracy less like a professional political class. They've decided up front to spend only on institutional design — the rules about who gets to sit in the legislature and for how long — not campaign finance, not media, not civic education. And they'd rather fund eight or ten people thinking hard for three years than run an advocacy campaign, because they think the advocacy is premature until the design questions are less murky. The boards patience is limited, so they want an agenda, not a survey.

  Here's the menu they keep circling around:

  1. Sortition: replace one chamber with a randomly selected assembly, redrawn regularly.
  2. Hard term limits: two or three terms and you're out.
  3. A third thing nobody has a settled name for, so call it lottery retirement: at each election a randomly chosen fifth of sitting members are barred from standing again. Being a career politician stays possible, but it becomes a gamble you can lose through no fault or failure of your own.
  4. Cohort overlap: only half the sortitioned chamber is replaced each cycle, so there's some institutional memory — at the cost of some freshness.
  5. Sortition with a secretariat behind it, where continuity comes from permanent expert staff who brief each new cohort, frame the options and draft the text. Depending on your view that's institutional wisdom without careerism, or careerism relocated to people nobody voted for and nobody sortitioned.

  Assume, just for the sake of argument, something that seems roughly true of citizen assemblies where they've been tried: they do noticeably better than elected bodies on long-horizon stuff like pensions and climate, and noticeably worse at anything requiring them to say no to a loud, organized group right now — and members defer a lot to whoever briefs them.

  So: what are the open questions here that actually deserve the money, in what order, and why? I care much more about the reasoning than the list. For each question tell me what else depends on it — which ones are upstream, e.g. do we need to settle what representation even is before we can say whether a random sample represents anybody? — how tractable it is for political theorists, economists, mechanism-design types and people who just think carefully about institutions, as opposed to empirical political scientists running field experiments, and what kind of finding over the next two years would move it up or down the ranking.

  Two things I'd especially like your read on. First: which of the usual claims made for these reforms don't actually follow? The one I keep hearing is that random selection "fixes polarization" because you can't gerrymander a lottery, and I'm not convinced that's even the right mechanism to be looking at. Second: is the secretariat problem the crux that most of the menu implicitly depends on — the thing that decides whether sortition is worth pushing at all — or is it a distraction that only bites in an idealised version of sortition nobody is actually proposing? Relatedly, where does the expertise go under hard term limits (lobbyists, staff, agencies), and does that worry transfer to the lottery versions or not?

  If you think the menu is missing something big, say what and why it should outrank the rest.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Deconstruct the Request:**

      *   **Client:** Small, serious foundation ($40m over 5 years).
      *   **Goal:** Reduce the "professional political class" nature of legislators in a mid-sized parliamentary democracy.
      *   **Constraint 1:** Spend *only* on institutional design (rules of entry/tenure), not campaign finance, media, or civic education.
      *   **Constraint 2:** Fund 8-10 thinkers for 3 years (research/design), not advocacy.
      *   **Constraint 3:** Board wants an *agenda*, not a survey. Prioritize open questions.
      *   **The Menu:** Sortition (full), Hard Term Limits, Lottery Retirement, Cohort Overlap, Sortition + Secretariat.
      *   **Assumption:** Citizen assemblies are better at long-horizon issues, worse at saying "no" to loud groups, members defer to briefers.
      *   **Specific Questions to Address:**
          *   What are the open questions deserving money, in what order, and why?
          *   What depends on what (upstream/downstream)?
          *   Tractability (theory vs. empirics).
          *   What findings would shift priorities?
          *   Critique of the "sortition fixes polarization" claim.
          *   Is the "secretariat problem" the crux or a distraction? Where does expertise go under term limits?
          *   Is anything missing from the menu?

  2.  **Initial Assessment & Strategy:**

      *   *The Core Tension:* The foundation wants to break the "career politician" mold. But legislatures need expertise, memory, and accountability. Removing careerism risks creating vacuums filled by unelected bureaucrats (secretariats) or lobbyists.
      *   *The Budget:* $40m is significant for research but tiny for implementation. It buys high-quality thought leadership, modeling, and constitutional drafting, not pilot programs.
      *   *The Constraint:* "Institutional design only." This is tricky because design interacts with behavior. We need to focus on *mechanism design* questions.
      *   *The "Polarization" Claim:* The prompt is right to be skeptical. Sortition changes *composition*, not necessarily *incentives* or *information environments*.
      *   *The "Secretariat" Problem:* This is likely the critical bottleneck. If citizens defer to staff, have we just shifted power from elected elites to appointed elites?

  3.  **Drafting the Agenda (The "What" and "Order"):**

      *   *Upstream Question:* What is the function of the legislature? Is it representation (mirror), decision-making (efficiency), or accountability (blame)? You can't design the vessel without knowing the cargo.
      *   *Midstream Question:* The Expertise/Power Vacuum. If you remove career pols, who fills the knowledge gap? (Secretariat vs. Lobbyists vs. Agencies).
      *   *Downstream Question:* Incentive Compatibility. How do you make short-term actors care about long-term outcomes without career ambition?
      *   *Ordering:* Function -> Expertise/Power -> Incentives -> Implementation details (like cohort overlap).

  4.  **Addressing the Specific Critiques:**

      *   *Polarization:* Gerrymandering isn't the main driver of polarization in parliamentary systems (party discipline is). Sortition breaks party discipline but might introduce *social* polarization or susceptibility to populism. The claim "lottery = no polarization" is false.
      *   *Secretariat:* This *is* the crux. In parliamentary systems, the executive dominates. If the legislature is amateur, the executive bureaucracy wins by default. The "Secretariat" is essentially a non-partisan civil service for the legislature. The risk is capture.
      *   *Expertise under Term Limits:* Term limits push expertise to lobbyists and permanent staff. Lottery retirement mitigates this slightly but still creates uncertainty. Sortition relies entirely on external expertise.

  5.  **Identifying the Missing Item:**

      *   The menu focuses on *who* is in the room and *how long*. It misses *what they do* and *how they decide*.
      *   *Missing:* **Agenda Control & Amendment Power.** In parliamentary systems, the government controls the timetable. A citizen assembly without agenda power is a talking shop. A citizen assembly *with* agenda power is a constitutional crisis waiting to happen. This is upstream of sortition vs. election.

  6.  **Developing the Reasoning (The "Why"):**

      *   *Tractability:* Political theorists are good at normative justification (why represent?). Mechanism designers are good at incentives (how to stop capture?). Empiricists are less useful here because there's no large-N data on national sortition.
      *   *Shifters:* If research shows secretariats are inevitably captured by the executive, sortition drops in priority. If research shows term limits increase lobbyist spending, term limits drop.

  7.  **Refining the Output Structure:**

      *   **Executive Summary:** The core thesis (Expertise vacuum is the real enemy, not careerism per se).
      *   **The Agenda (Prioritized Questions):**
          1.  The Power Vacuum (Expertise/Secretariat).
          2.  The Definition of Representation (Mirror vs. Accountability).
          3.  Incentive Structures (Long-termism without careers).
          4.  Systemic Interaction (Parliamentary vs. Presidential context).
      *   **Critique of Claims:** Polarization myth.
      *   **The Secretariat/Expertise Deep Dive:** This is the crux.
      *   **The Missing Item:** Agenda Control.
      *   **Funding Allocation:** How to spend the $40m.

  8.  **Self-Correction/Nuance Check:**

      *   *Parliamentary Context:* The prompt specifies "mid-sized parliamentary democracy." This is crucial. In Westminster systems, the executive *is* the legislature. Breaking the career link threatens the confidence convention. If the PM loses the confidence of a sortitioned house, what happens? This makes "Sortition replacing one chamber" (bicameral) the only viable path, but upper houses are often weak.
      *   *Budget:* $40m over 5 years is $8m/year. For 10 people, that's $800k/person/year. That buys *very* senior talent + support staff + conferences + commissions. It's a "Manhattan Project" for constitutional design.
      *   *Tone:* Serious, analytical, slightly contrarian (challenging the polarization claim), actionable.

  9.  **Final Polish:** Ensure the distinction between "upstream" (conceptual) and "downstream" (mechanical) is clear. Make sure the "Secretariat" answer is decisive. (Decision: It is the crux).

  **(Self-Correction during drafting):** I initially thought about suggesting pilot programs. But the prompt says "institutional design... not advocacy." Pilots might be seen as advocacy/implementation. I should stick to *design research* and *modeling*.
  Also, need to be careful about the "Polarization" claim. In the US, gerrymandering matters. In proportional parliamentary systems, it matters less. Party discipline matters more. Sortition breaks parties. That's the real mechanism, not the lottery itself.

  10. **Finalizing the Advice:** Structure it as a memo to the Board.

  *(Drafting the response based on these thoughts...)*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** Advisory Desk
  **SUBJECT:** Research Agenda: Institutional Design to Displace the Professional Political Class
  **BUDGET:** $40M / 5 Years
  **CONSTRAINT:** Institutional Design Only (No Advocacy/Media/Civic Ed)

  ### Executive Summary

  The foundation's premise contains a hidden trap. You aim to reduce the "professional political class," but in a parliamentary democracy, **careerism is often a proxy for expertise and accountability.** If you remove career politicians without solving the **Expertise Vacuum**, you do not empower citizens; you empower the unelected bureaucracy (the permanent secretariat) and organized lobbyists.

  Therefore, the priority is not choosing between sortition or term limits. The priority is determining **where expertise and agenda-setting power reside** once the career link is broken. The "Secretariat Problem" is not a distraction; it is the crux. If you cannot design a secretariat that serves a rotating legislature without capturing it, sortition is dangerous. If you cannot prevent expertise from migrating to lobbyists under term limits, term limits are counter-productive.

  Below is the prioritized research agenda, the critique of prevailing assumptions, and the missing variable that outranks the rest.

  ---

  ### Part I: The Research Agenda (Prioritized)

  We recommend funding four distinct workstreams. They are ordered by logical dependency (upstream to downstream). You cannot solve #2 until you have a working hypothesis for #1.

  #### 1. The Power Vacuum & The Secretariat (Upstream)
  **The Question:** In a system without career legislators, who drafts the law, and who is accountable for the technical accuracy of that law?
  **Why First:** This is the foundational constraint. If the answer is "a permanent civil service body," you have not reduced the elite class; you have shifted it from elected to appointed officials with less oversight. If the answer is "lobbyists," you have worsened corruption.
  **Tractability:** High for mechanism designers and legal theorists; Low for empiricists (no large-N data exists).
  **Dependencies:** Everything downstream depends on this. If a robust, non-capturable secretariat design is impossible, sortition and lottery retirement must be discarded.
  **Shifters:**
  *   *Move Up:* Discovery of a governance model where permanent staff are rotationally audited by citizen juries (a "meta-sortition" oversight mechanism).
  *   *Move Down:* Evidence that existing parliamentary counsel offices are already effectively captured by the executive, implying a new secretariat would face the same fate.

  #### 2. The Definition of Representation (Upstream/Midstream)
  **The Question:** Is the goal *Descriptive Representation* (the legislature looks like the people) or *Accountable Representation* (the legislature can be fired by the people)?
  **Why Second:** Sortition achieves the former; Term Limits attempt to preserve the latter while disrupting careerism. You cannot evaluate the menu without settling the telos of the institution. In a parliamentary system, "accountability" usually means throwing the rascals out. Sortition makes "throwing out" impossible (since they weren't put in).
  **Tractability:** High for political theorists.
  **Dependencies:** Determines whether you build a bicameral system (one elected, one sortitioned) or a unicameral hybrid.
  **Shifters:**
  *   *Move Up:* Theoretical work demonstrating that "accountability" via elections is functionally broken in mid-sized democracies (e.g., party discipline makes individual accountability impossible).
  *   *Move Down:* Evidence that voters value the *ability* to punish representatives more than the *composition* of the body.

  #### 3. Incentive Compatibility for Long-Termism (Midstream)
  **The Question:** How do you incentivize short-term actors (term-limited or sortitioned) to care about 20-year horizons without career ambition?
  **Why Third:** You noted citizen assemblies do better on long-horizon issues. But is that because of *random selection* or because they are *insulated from re-election*? If it's insulation, hard term limits might achieve 80% of the benefit at 20% of the constitutional cost.
  **Tractability:** High for economists/game theorists.
  **Dependencies:** Depends on #1 (who briefs them on long-term costs?) and #2 (do they need to be re-elected?).
  **Shifters:**
  *   *Move Up:* Modeling showing that "legacy motives" (wanting to be remembered well) substitute effectively for "re-election motives" in driving prudent policy.
  *   *Move Down:* Data showing that short-term legislators simply defer to the executive branch on complex long-term issues, rendering the reform cosmetic.

  #### 4. Systemic Integration in Parliamentary Context (Downstream)
  **The Question:** How does a non-career legislature interact with a Career Executive (Prime Minister/Cabinet)?
  **Why Fourth:** In parliamentary systems, the Executive is drawn from the Legislature. If the Legislature is random or term-limited, the talent pool for the Prime Minister shrinks drastically. This risks technocratic dictatorship or instability.
  **Tractability:** Moderate. Requires constitutional lawyers and comparative political scientists.
  **Dependencies:** All of the above.
  **Shifters:**
  *   *Move Up:* A viable model for a "Separate Executive" track (e.g., direct election of PM) that pairs with a sortitioned legislature.
  *   *Move Down:* Analysis showing that coalition building becomes impossible without career party whips, leading to legislative gridlock.

  ---

  ### Part II: Critique of Prevailing Claims

  #### 1. The "Sortition Fixes Polarization" Myth
  **Verdict:** **False / Mechanism Error.**
  **Reasoning:** The claim that "you can't gerrymander a lottery" is true but irrelevant in parliamentary systems. Polarization in these systems is driven by **Party Discipline** and **Executive Control of the Agenda**, not district lines.
  *   **The Real Mechanism:** Sortition *might* reduce polarization, but only because it dismantles political parties. A random assembly has no whip system. However, this creates a new risk: *fragmentation*. Without parties to aggregate interests, you may get 150 individual fiefdoms susceptible to populist swings or capture by the most organized lobby.
  *   **The Nuance:** Sortition changes the *axis* of conflict. It reduces Partisan Polarization (Left vs. Right) but may increase Social Polarization (Group A vs. Group B) if the sample size is too small to be statistically representative, or if the briefing process is biased.
  *   **Research Implication:** Do not fund research asking "Does sortition reduce polarization?" Fund research asking "What replaces Party Discipline as the mechanism for coalition building?"

  #### 2. The Secretariat Problem: Crux or Distraction?
  **Verdict:** **The Crux.**
  **Reasoning:** You asked if this is a distraction. It is not. It is the single point of failure.
  *   **The Assumption:** Citizen assemblies work in pilot programs because they are advisory. They are briefed by neutral civil servants for a weekend.
  *   **The Reality:** A national legislature must draft complex tax codes, defense budgets, and healthcare regulations. Citizens cannot do this unaided. They *must* defer.
  *   **The Risk:** If you implement Sortition or Hard Term Limits, you create a high-turnover legislature. High turnover increases dependence on permanent staff. This creates a **Principal-Agent Problem** on steroids. The Agents (staff) become the Principals.
  *   **Term Limits vs. Sortition:**
      *   *Under Term Limits:* Expertise migrates to **Lobbyists**. Why? Because staff turnover is high, but lobbyists stay forever.
      *   *Under Sortition:* Expertise migrates to the **Secretariat**. Why? Because lobbyists don't know who to bribe next year, so they capture the briefers instead.
  *   **Conclusion:** Sortition is only viable if you can design a Secretariat that is more accountable than the political class it replaces. This is a harder design problem than the sortition itself.

  ---

  ### Part III: The Missing Item

  **The Menu is missing: Agenda Control.**

  **Why it outranks the rest:**
  In a parliamentary democracy, the Government (Executive) controls the legislative timetable. A backbencher (even a career one) has little power. A sortitioned chamber with no agenda control is a **debating society**. A sortitioned chamber *with* agenda control is a **constitutional crisis**.

  *   **The Question:** Who decides what gets voted on?
  *   **The Risk:** If you break the career link but leave agenda control with the Prime Minister, you have achieved nothing. The PM will simply treat the random assembly as a rubber stamp (using the Secretariat to manage them).
  *   **The Opportunity:** If you give the sortitioned/term-limited body *independent agenda power* (e.g., the ability to force votes on citizen initiatives), you change the power dynamic.
  *   **Recommendation:** This deserves 20% of the research budget. You need mechanism designers to figure out how to grant agenda power to a non-career body without causing gridlock or populism.

  ---

  ### Part IV: Allocation of Funds ($40M / 5 Years)

  Do not spread this thin. Fund three "Design Labs" rather than individual grants.

  1.  **The Expertise & Secretariat Lab ($15M):**
      *   *Focus:* Mechanism design for the permanent staff. How to rotate, audit, and incentivize neutral briefers. Can we use "sortitioned oversight" on the secretariat?
      *   *Personnel:* Administrative law scholars, organizational economists, former clerks of the house.

  2.  **The Incentives & Stability Lab ($15M):**
      *   *Focus:* Modeling the interaction between term limits/lottery and lobbyist influence. Game theory on coalition building without career parties.
      *   *Personnel:* Political economists, game theorists, comparative constitutionalists.

  3.  **The Agenda & Integration Lab ($10M):**
      *   *Focus:* How this new chamber fits into the existing Westminster/Parliamentary system. Agenda control, confidence conventions, and executive selection.
      *   *Personnel:* Constitutional lawyers, political practitioners (former MPs), systems engineers.

  ### Final Recommendation on the Menu

  *   **Discard:** *Sortition replacing one chamber* (Option 1) **unless** the Secretariat Lab solves the capture problem. It is too high risk as a standalone.
  *   **Prioritize:** *Lottery Retirement* (Option 3). This is the "Goldilocks" option. It disrupts careerism (you can't plan a 30-year tenure) but preserves some expertise (you might get 4 terms). It keeps the electoral link (accountability) intact. It is the most tractable reform that actually addresses the "Professional Class" problem without creating a Power Vacuum.
  *   **Modify:** *Sortition with Secretariat* (Option 5). Only pursue this as a **second chamber** (advisory/revising) with specific jurisdiction over long-horizon issues (climate, pensions), explicitly acknowledging the Secretariat dependency and designing robust oversight for it.

  **Bottom Line:** Do not fund the *idea* of sortition. Fund the *plumbing* that makes it safe. The bottleneck is not the citizens; it is the staff behind them.
