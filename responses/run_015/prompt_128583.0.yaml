prompt: |-
  I'm doing a philosophy of mind module and we had this debate about whether the brain is literally a computer. My view is that if cognition is computation, then mental states must be syntactic structures, and syntax by itself has no meaning — so if my brain is just running software, it's not actually thinking about anything unless there's some external hookup. But my tutor said that's not an objection, it's just externalism about content, and computation can still be the vehicle. I think I'm conflating two different things, but I can't see where the slide happens.

  Is the hidden mistake assuming that 'computational' has to mean symbol-manipulation like a laptop? I mentioned connectionist networks don't use explicit rules, so maybe the brain computes without being a classical computer. But then if computation doesn't need rules, what stops us saying a hurricane is computing? Especialy, if substrate doesn't matter, why can't I run the same mental software on silicon and get consciousness? I feel like there's a false presupposition in my argument — maybe that computation is necessarily syntactic — but I'm not sure how to disentangle it from the real issues about substrate independence. Can anyone spot where I've gone wrong?
