answer: |-
  This is one of the most famous and contentious cruxes in the study of the *Mingjia* (School of Names). Your intuition that the standard logical readings (like set membership) clash with Gongsun Long's conclusion is correct. If we read "White horse is not horse" (*Baima fei ma*) as "A white horse is not a member of the set of horses," the argument is absurd. But Gongsun Long is not making a claim about biological classification; he is making a claim about **semantic identity** and **ontological composition**.

  To answer your specific question: neither the determinable-determinate reading nor the mereological reading is perfect on its own, but the **mereological (or compositional) reading** is ontologically closer to Gongsun Long's metaphysics, while the **determinable-determinate distinction** is actually the common-sense view he is arguing *against*.

  However, to understand how this fits the "Rectification of Names" (*Zhengming*), we need to refine the mereological reading into a claim about **Conceptual Non-Identity**.

  Here is a breakdown of how to navigate this argumentative move.

  ### 1. The Meaning of *Fei* (Not)
  The first hurdle is the copula. In classical Chinese, *fei* (非) does not always function like the Western "is not" of predication or class inclusion. It often functions as **"is not identical to."**

  *   **Common Sense (Interlocutor):** "White horse is horse" means "A white horse is a *type* of horse" (Class Inclusion / Determinable-Determinate).
  *   **Gongsun Long:** "White horse is not horse" means "The concept 'White Horse' is not *identical* to the concept 'Horse'."

  When the interlocutor uses the "seeking" argument (asking for a horse vs. asking for a white horse), he is trying to trap Gongsun Long into admitting class inclusion. Gongsun Long accepts the premise (yes, the response to the request differs) but uses it to prove **intensional difference**, not extensional exclusion.

  ### 2. Evaluating Your Two Readings

  #### The Determinable-Determinate Reading
  *   **The Logic:** "Horse" is the determinable (the broad category); "White Horse" is the determinate (the specific specification).
  *   **Why it fits the Interlocutor:** This is the common-sense view. If I ask for a vehicle, a car works. If I ask for a red car, a blue car doesn't work. But a red car is still a vehicle.
  *   **Why it fails for Gongsun Long:** Gongsun Long explicitly rejects the idea that the determinate *is* the determinable. He argues that because the conditions for satisfaction differ, the *names* refer to different realities. If you adopt this reading, you have to conclude Gongsun Long is simply wrong about logic. But within the *Zhengming* framework, he is prioritizing precision over inclusion.

  #### The Mereological (Compositional) Reading
  *   **The Logic:** "Horse" names the form (*xing*). "White" names the color (*se*). "White Horse" names the combination of form and color.
  *   **Why it fits Gongsun Long:** This aligns with his metaphysical realism. He treats "White" and "Horse" as separate universals that exist independently. When combined, they create a new composite entity.
  *   **The Argument:** A composite ($A + B$) is not identical to one of its components ($A$). Therefore, "White Horse" is not "Horse."
  *   **Connection to the "Seeking" Argument:** When you ask for a "horse," you are invoking the universal of Form. When you ask for a "white horse," you are invoking the composite of Form + Color. Since the reality invoked is different, the name must be different.

  ### 3. The *Zhengming* (Rectification of Names) Context
  Your edition's emphasis on "aligning language with reality" is the key to unlocking this. For the Confucians, *Zhengming* was ethical (a Father must act like a Father). For the School of Names, it was **semantic and ontological precision**.

  Gongsun Long's point is that language must carve reality at its joints without slippage.
  1.  **Reality:** There is a distinction between the abstract form of "horseness" and the specific instance of "white horseness."
  2.  **Language:** If we allow the name "Horse" to substitute for "White Horse," we blur the distinction between Form and Form+Color.
  3.  **Rectification:** To rectify names, we must acknowledge that the compound name has a different reference than the simple name.

  Therefore, the "seeking" argument is not about whether a white horse biologically qualifies as a horse. It is about whether the **command** "Bring a horse" is semantically equivalent to the **command** "Bring a white horse." Since the fulfillment conditions differ, the names are not interchangeable.

  ### 4. Which Reading is Closer to the School of Names?
  The **Mereological/Compositional Reading** comes closer to what the School of Names meant, provided we understand it as a **mereology of universals** rather than physical parts.

  *   **Why:** The School of Names was concerned with the stability of terms. If "White Horse" = "Horse," then "White" becomes an accidental property that doesn't affect the name. Gongsun Long argues that adding a property changes the *Shi* (the reality/thing) designated by the name.
  *   **The Relation Asserted:** The dialogue asserts a relation of **Non-Identity based on Intension**.
      *   "Horse" $\rightarrow$ Refers to Shape/Form.
      *   "White Horse" $\rightarrow$ Refers to Shape/Form + Color.
      *   Since $(Form + Color) \neq Form$, then $"White Horse" \neq "Horse"$.

  ### Summary for Your Course Work
  When writing about this, you might frame it this way:

  1.  **Reject the Set-Membership Reading:** Gongsun Long is not denying that white horses fall under the biological category of horses.
  2.  **Critique the Determinable Reading:** This reading assumes the conclusion the Interlocutor wants (that the specific is a subset of the general). Gongsun Long challenges the validity of collapsing the specific into the general.
  3.  **Adopt the Compositional/Intensional Reading:** Gongsun Long treats "White Horse" as a compound concept that is not identical to its root concept.
  4.  **Link to *Zhengming*:** The "Rectification of Names" requires that distinct realities have distinct names. Because the reality of "seeking a white horse" is stricter than "seeking a horse," the names must remain distinct to preserve semantic precision. To say "White Horse is Horse" is to allow language to become imprecise, violating the mandate of *Zhengming*.

  In short, Gongsun Long is arguing that **precision in language requires us to treat compound concepts as distinct from their constituents**, even if common usage treats them as subsets. The "seeking" argument demonstrates that the *pragmatic reality* of the terms differs, and therefore the *names* must differ.
