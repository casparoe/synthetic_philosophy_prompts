answer: |-
  # Joint Statement on Secessionary Theory and Practice
  **Signatories:** The Remedial-Right Working Group (RRWG) & The Primary-Right Democratic Coalition (PRDC)
  **Subject:** Findings after 12 months of adverserial dialogue on Scotland, Catalonia, and Quebec.

  Look, we didn't agree on everything. If we had, we wouldn't have needed a year of shouting matches over coffee and whitepapers. But we did manage to map the terrain. We know where the landmines are, even if we disagree on how to disarm them. Below is the record of what we settled, where we split, and the specific tests we designed to prove who's right.

  ### Part I: Agreed Claims
  *These are the premises both sides accept as operational truths, even if the philosophical justification differs.*

  1.  **The Nested Minority Constraint:** Both sides agree that secession cannot create a new tyranny. If a region secedes, it must have a credible plan for protecting minorities within its new borders. We reject the "infinite nesting" doctrine (that every neighborhood can secede), but we also reject the "frozen border" doctrine (that internal minorities lose all recourse). There is a threshold of viability and rights-protection that must be met before independence is recognized.
  2.  **Intergenerational Binding is Limited:** No generation can bind all future generations to a political union in perpetuity. A constitution that claims "indivisibility" forever is empirically false. However, the *mechanism* for undoing that binding cannot be trivial; it requires a deliberate, high-stakes democratic act, not just a shifting poll number.
  3.  **The Referendum is Renewable, Not Constant:** A referendum is not a one-time historical event that settles the question for centuries (the "once in a generation" hard line is rejected). However, it is also not a renewable subscription service. There must be a "cooling-off" period and a requirement for material change in circumstances or sustained political will before a repeat vote is legitimate. We agree that blocking a second vote indefinitely is undemocratic, but holding one every election cycle is destabilizing.

  ### Part II: Table of Disagreements
  *We couldn't reconcile these, but we agreed on neutral phrasing so we stop talking past each other.*

  | Issue | Remedial-Right Wording (RRWG) | Primary-Right Democratic Wording (PRDC) | Neutral Agreed Phrasing |
  | :--- | :--- | :--- | :--- |
  | **The Trigger** | Secession is justified only as a **last resort** against persistent injustice, rights violations, or cultural destruction. | Secession is justified as a **primary good** of self-determination if a distinct people democratically will it. | **Condition Precedent:** Whether legitimacy requires proof of *harm* (RR) or proof of *will* (PR). |
  | **The Unit** | The right belongs to the **citizenry** suffering the injustice, regardless of cultural distinctiveness. | The right belongs to the **nation/people** defined by shared identity and territory. | **Beneficiary:** Whether the right attaches to *individuals in a territory* or a *collective identity*. |
  | **The Veto** | The central state has **no moral veto** if the remedy is necessary for justice. | The central state has a **procedural veto** until the agreed democratic rules are fulfilled. | **Authority:** Whether the center's consent is a *moral requirement* or a *procedural hurdle*. |

  ### Part III: The Cruxes & Hypothetical Tests
  *These are the dealbreakers. We identified two specific scenarios where our theories produce different real-world outcomes. We agreed on the facts of the hypotheticals in advance so we can see who predicts correctly.*

  #### Crux 1: The Recursive Secession Problem (The Tarragona Test)
  **The Issue:** If Catalonia exercises a primary right to leave Spain, does the sub-region of Tarragona exercise that same right against Catalonia? The RRWG worries this leads to Balkanization; the PRDC worries that denying it makes Catalonia a mini-Spain.

  **The Hypothetical Case:**
  Catalonia holds a vote and wins independence from Spain (60% Yes). Immediately after, Tarragona (which voted 60% to stay in Spain) declares it wishes to remain under Spanish sovereignty, effectively seceding from the new Catalan state. There is no evidence of Catalonia oppressing Tarragona *yet*; it is purely a preference for the larger state.

  **Predicted Outcomes:**
  *   **RRWG Prediction:** Tarragona's claim is **invalid**. Since there is no remedial cause (no oppression by Barcelona), Tarragona defaults to the territorial integrity of the new state. Allowing this would make statehood impossible.
  *   **PRDC Prediction:** Tarragona's claim is **valid**. If the right is primary and democratic, it applies recursively. Tarragona must be allowed to negotiate its status, potentially staying with Spain, provided it is viable. Denying this contradicts the principle used to leave Spain.

  #### Crux 2: Constitutional Entrenchment vs. Democratic Revocation
  **The Issue:** Can a majority vote to break the constitution that made the vote possible? Specifically, if the constitution requires a supermajority or central consent, and the secessionists ignore it, is the result legitimate?

  **The Hypothetical Case:**
  The "Clause 41 Scenario." The existing Constitution states secession requires a 60% threshold and ratification by the Federal Parliament. A secessionist movement campaigns for a simple majority (50% + 1) and unilateral declaration. The vote comes in at 55% Yes. Parliament refuses ratification based on the Constitution. The secessionists declare independence anyway.

  **Predicted Outcomes:**
  *   **RRWG Prediction:** **Legitimate.** If the constitutional lock is being used to prevent a remedy for injustice (or even just to block democratic will indefinitely), the Constitution loses moral authority. The 55% vote overrides the procedural lock because justice > procedure.
  *   **PRDC Prediction:** **Illegitimate (Procedurally).** Democracy requires rule-following. If you change the rules mid-game without agreement, you break the democratic chain. The 55% is insufficient because the *pre-agreed conditions* for the exercise of the right were not met. (Note: PRDC might support the *goal*, but admits the *method* undermines the democratic legitimacy they claim to champion).

  ### Part IV: The Verbal Disagreement Flag
  *We identified one argument that burns a lot of time but changes nothing.*

  **The Dispute:** "The Scottish People" vs. "People Living in Scotland."
  **RRWG Stance:** Prefers "People Living in Scotland." Rights attach to residents subject to the law.
  **PRDC Stance:** Prefers "The Scottish People." Rights attach to the national group, some of whom may live abroad.

  **Why It's Stagnant:**
  We both admit this is mostly verbal. In any practical referendum, the voter eligibility roll is going to be roughly the same (residents + some diaspora). Arguing over the metaphysical definition of "The People" doesn't change who gets a ballot paper. It matters for rhetoric and identity politics, but it doesn't move the needle on the *mechanics* of secession. We agreed to stop treating this as a substantive legal blocker. It's a branding issue, not a governance one.

  ***

  **Signed,**
  *For the Remedial-Right Working Group*
  *For the Primary-Right Democratic Coalition*

  *Date: October 2023*
