  Here's the scenario: Static Drift operates as a decentralized autonomous organization where the 'label' is defined not by its human staff but by an immutable smart-contract charter that governs profit splits and release rights. In World W1, the two founding producers retire early and are replaced by new signees, but the charter code remains unforked and the back catalog stays under the original cryptographic signature. In World W2, a venture capital firm forcibly forks the code to redirect royalties and installs puppet members while keeping the 'Static Drift' branding and name intact.

  Here's the breakdown. For the Kripkean, W1 contains literally the same entity as the actual world because the charter is the essential property of the collective; as long as that constitutive rule set persists, the label persists transworldly, regardless of member turnover. W2 is a different entity entirely because the essential charter was broken, even if the name remained. For the Lewisian, there is no strict identity across worlds because objects are world-bound; the W1 label is merely a *counterpart* of the actual Static Drift, selected by a similarity relation that weights charter continuity and catalog history heavily. The W2 label is also a counterpart, but a much poorer one due to low similarity in governance. The exact feature causing divergence is the ontological commitment to transworld individuals (Kripke) versus world-bound individuals linked by similarity (Lewis). If we drop the charter-continuity condition, the Kripkean account collapses into chaos because without that essential anchor, the label becomes either the sum of its members (which changes in W1) or just the name (which fails to distinguish W1 from W2), making transworld identity impossible to track. Now, here's the honest attack from the Lewisian defender: they'd argue that calling the charter "essential" is arbitrary metaphysical stipulation. Why is the code the soul of the label and not the social function or the sound? By hard-coding the charter as essential, the Kripkean is ignoring that "Static Drift" is a vague concept where counterpart relations shift based on context, not rigid necessary truths.
