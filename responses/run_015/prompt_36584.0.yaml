answer: |-
  This is a classic puzzle in the philosophy of biology, and your intuition is correct: the trick lies in an equivocation that is invisible when looking only upward but becomes glaring when looking downward. Your friend is channeling Richard Dawkins, but he has inadvertently walked into a trap that David Hull, Stephen Jay Gould, and Elliott Sober spent decades disarming.

  Here is the precise diagnosis, the evaluation of your exits, and the mapping to the literature.

  ### The Precise Flaw: Premise (1)

  The mistake is in **Premise (1)**: *"A unit of selection must be a replicator... whose copies are what selection sorts among."*

  This premise conflates two distinct roles that are often occupied by the same entity (the gene) but are logically separable: the **Replicator** (the thing that gets copied) and the **Interactor** (the thing that interacts with the environment to cause the copying).

  *   **Why it looked fine upward:** In sexual populations, organisms are poor *replicators* (due to recombination/mortality). So, if you define "unit of selection" strictly as "thing that gets copied," organisms are out. Genes fit this description well enough.
  *   **Why it fails downward:** If you define "unit of selection" *strictly* as "thing that gets copied with fidelity," then nucleotides (or atoms) are indeed superior to genes. They have higher fidelity. By your friend's own criterion, the gene is demoted.

  Your friend's rescue attempt ("nucleotides don't compete") admits a **second criterion** that was missing from Premise (1): **Causal Efficacy** (or Phenotypic Effect). For selection to occur, the entity must not only *persist*; its persistence must be *caused by* its specific properties affecting survival/reproduction.

  ### Evaluating Your Exits

  **Exit One: The Equivocation (Variation + Heritability)**
  *   **The Move:** You amend Premise (1) to require both **Heritability** (fidelity) and **Variation** (differential fitness).
  *   **Why it works:**
      *   **Upward:** Organisms (in sexual species) fail on Heritability (offspring aren't copies). Groups fail on both. Genes pass both (alleles vary, copies are faithful).
      *   **Downward:** Nucleotides at fixed loci fail on Variation (no competition). Nucleotides at variable loci pass Variation but often fail on *independent* Causal Efficacy (a base pair usually only matters in the context of the gene).
  *   **The Cost:** You must admit that **asexual organisms** (like your parthenogenetic aphid) *are* units of selection, because they satisfy both Heritability and Variation. Your friend will hate this, but it is biologically accurate. It also admits that "group selection" is possible if a group reproduces with fidelity (e.g., budding colonies), though rare.
  *   **Verdict:** This is the most logically consistent repair. It saves the gene as the *paradigm* without making it the *only* possibility.

  **Exit Two: Bite the Nucleotide Bullet**
  *   **The Move:** Accept that selection is ultimately just nucleotide physics.
  *   **Why it fails:** This dissolves the concept of "selection" into chemistry. Selection implies a *function* or *trait* that confers advantage. A single base pair rarely has a functional effect independent of the sequence it inhabits. If everything is bookkeeping, the theory loses its explanatory power regarding *adaptation*.
  *   **Verdict:** Reject this. It satisfies the logic of fidelity but destroys the biology of function.

  **Exit Three: Reject the Privileged Level (Pluralism)**
  *   **The Move:** Accept that "unit of selection" is a question-dependent label. Genes are the replicators; organisms are the interactors.
  *   **Why it works:** It dissolves the conflict. You can talk about gene selection (replicator dynamics) and organism selection (interactor dynamics) without contradiction.
  *   **The Cost:** You lose the "Gene's Eye View" as the *sole* fundamental truth. It becomes one perspective among others.
  *   **Verdict:** This is the modern philosophical consensus, but it requires your friend to surrender the claim that he has "settled the debate once and for all."

  ### The Literature Mapping

  Your intuition maps almost perfectly onto three specific distinctions in the literature.

  **1. The Replicator/Interactor Distinction (David Hull)**
  *   **Mapping:** This corresponds to **Exit Three**.
  *   **The Payoff:** Hull (1980) argued that your friend is confusing the *Replicator* (gene) with the *Interactor* (organism). Selection *acts on* interactors (organisms), but the *result* is the differential replication of replicators (genes).
  *   **Resolution:** Your friend is right that genes are the unique *replicators*. But he is wrong that this makes higher-level selection "mere bookkeeping." Organism-level selection is the *process* by which gene-level replication is achieved. You can keep (2) by specifying: "Genes are the paradigm *replicators*," not the only *units of selection* (if 'unit' implies the thing being tested).

  **2. Selection *Of* vs. Selection *For* (Sober / Lewontin)**
  *   **Mapping:** This corresponds to **Exit One**.
  *   **The Payoff:** Elliott Sober distinguishes between the entity that is selected *of* (the survivor) and the property selected *for* (the cause).
      *   **Upward:** Organisms are selected *of* (they survive), but genes are often selected *for* (the trait causing survival).
      *   **Downward:** Nucleotides are selected *of* (they persist), but rarely selected *for* (unless they alter the phenotype).
  *   **Resolution:** The "Unit of Selection" is the entity that possesses the property selected *for*. Genes usually hold this spot because they map to traits. Nucleotides don't, because they lack causal leverage. Organisms do, but they lack fidelity (in sexual species). The Gene is the "Goldilocks" level: the lowest level with both **Fidelity** and **Causal Leverage**.

  **3. Hierarchy Theory (Gould)**
  *   **Mapping:** This addresses the "Bookkeeping" charge.
  *   **The Payoff:** Gould argued that the gene is the *currency* of evolution, not the *beneficiary*. Your friend treats the gene as the beneficiary (the "Selfish Gene").
  *   **Resolution:** If you adopt Gould's view, you admit that selection acts at multiple levels (genes, organisms, species), but the *frequency change* is measured in genes. This allows you to keep (2) as a measurement convention without denying the reality of organismal struggle.

  ### Recommendation: How to Keep (2) Without Swallowing (7)

  To satisfy your desire to keep **"(2) Genes as the paradigm replicators"** while avoiding the nucleotide regress, you should propose the following synthesis to your friend:

  **The "Causal Fidelity" Criterion.**
  A unit of selection must be the **smallest entity that combines high-fidelity replication with independent phenotypic effect.**

  1.  **Why Nucleotides Fail (7):** While they have high fidelity, they lack *independent phenotypic effect*. A base pair's survival depends on the gene it sits in. It is a *part* of a replicator, not a replicator itself. (This blocks the downward regress).
  2.  **Why Organisms Fail (3):** While they have phenotypic effect, they lack *high-fidelity replication* (in sexual species). They are *vehicles*, not replicators. (This preserves the upward argument).
  3.  **Why Genes Win (2):** They are the smallest unit that *both* copies faithfully *and* maps to a trait that affects survival.

  **The Price:**
  You must concede **Exit One**: In asexual lineages, the organism *does* become a replicator. Your friend must accept that his argument is contingent on sexual reproduction, not a universal law of nature.

  **The Script:**
  Tell your friend: *"You're conflating Replicators with Interactors. Nucleotides are better replicators physically, but they aren't units of selection because they don't cause the survival—they are along for the ride. Organisms cause the survival, but they don't replicate faithfully. Genes are the unique sweet spot: the smallest thing that both copies faithfully AND causes the survival. That makes them the paradigm replicator, but it doesn't make organism-level selection 'bookkeeping'—it makes it the mechanism by which genes win."*

  This maps to **Hull's Replicator/Interactor** distinction and **Lewontin's conditions for selection**. It saves the gene's centrality without falling into reductionist absurdity.
