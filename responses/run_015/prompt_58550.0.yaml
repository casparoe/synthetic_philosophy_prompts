prompt: |-
  Having read rationalist blogs and forums for the better part of a decade, I have internalized the habit of dissolving confused concepts into operations, and I now need that habit made usable for others. I lead assessment design for a software apprenticeship that admits about twenty career-changers from several hundred applicants every six weeks. The stakes are livelihoods and cohort quality, and my assessors are working engineers with no training in psychometrics who have at most twenty minutes to vet a proposed task before our program director signs off on it.

  My problem is that our tasks all claim to select for intelligence, but they mean incompatible things by it: on one hand, accumulated knowledge and practiced skill; on the other, speed and efficiency in acquiring new skills when the environment is novel and uncertain; on still another, a bundle of largely independent aptitudes rather than one thing. I am also worried about Goodhart effects from coaching and from unrestricted use of AI assistants. I want you to translate that philosophical disagreement into a reusable vetting procedure that non-specialists can actually run.

  Give me a stepwise procedure, flowchart in words, with questions to ask in order about any proposed assessment task, what counts as passing each step, where a task fails outright, and where the procedure must defer to human judgment because the issue is normative or empirically underdetermined. The procedure must preserve the distinctions that matter most — between difficulty and novelty, between transfer near and far, between learning quickly from few examples and performing well after extensive practice, and between generality across goals and narrow optimization — while dropping whatever cannot be checked in twenty minutes. Mark explicitly the points where judgment cannot be eliminated and the kinds of tasks where you expect the procedure to misfire.

  Then demonstrate the procedure on these three candidate tasks we are actually considering:

  Task A, Alien Spreadsheet: 45 minutes, no internet, candidates may consult documentation for a fictional data-transformation language with twelve unfamiliar operators, then must clean a messy dataset containing edge cases not covered in the examples.

  Task B, Familiar Build: 48-hour take-home, open internet and AI tools allowed, to build a standard to-do application with login and persistence, graded on completeness, code organization, and polish.

  Task C, Broken Pipeline: 90-minute live exercise in a deliberately obfuscated and invented build system where half the files are irrelevant and several error messages point to the wrong cause, graded on diagnosing the root failure and getting a minimal deployment working.

  Show your work for each, include at least one verdict my team will dislike and explain why the procedure requires it, and close with a short statement of what the procedure cannot do and what it should never be used to justify.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Background:** Rationalist community influence (dissolving concepts into operations), leads assessment design for a software apprenticeship (high stakes: livelihoods, cohort quality).
      *   **Audience:** Working engineers (assessors), no psychometrics training, max 20 mins vetting time per task.
      *   **Core Problem:** "Intelligence" is ill-defined in current tasks (knowledge vs. learning speed vs. aptitude bundle). Worries about Goodhart's Law (coaching, AI).
      *   **Goal:** A reusable vetting procedure (stepwise/flowchart) to translate philosophical disagreements into operational checks.
      *   **Requirements:**
          *   Stepwise procedure with questions, pass/fail criteria, deferral points.
          *   Preserve key distinctions (difficulty vs. novelty, near vs. far transfer, learning speed vs. performance, generality vs. optimization).
          *   Drop uncheckable items (must fit 20 mins).
          *   Mark where judgment is unavoidable and where the procedure might misfire.
          *   Apply the procedure to three specific tasks (Alien Spreadsheet, Familiar Build, Broken Pipeline).
          *   Include at least one unpopular verdict with justification.
          *   Closing statement on limitations and misuse.

  2.  **Deconstruct the Philosophy (Rationalist/Psychometric Bridge):**
      *   *Dissolving "Intelligence":* We need to separate $g$ (general factor), crystallized intelligence ($Gc$, knowledge), and fluid intelligence ($Gf$, novel problem solving).
      *   *Goodhart's Law:* If a measure becomes a target, it ceases to be a good measure. AI and coaching exacerbate this.
      *   *Operationalization:* Can we observe the specific cognitive operation we claim to measure?
      *   *Constraints:* 20 minutes max. No complex statistical validation.

  3.  **Drafting the Vetting Procedure (The "Protocol"):**
      *   *Structure:* Needs to be linear, decision-tree style.
      *   *Step 1: Construct Clarity.* What *exactly* are we measuring? (Knowledge vs. Learning vs. Debugging).
      *   *Step 2: Novelty vs. Recall.* Is this something they could have memorized?
      *   *Step 3: AI/Coach Resistance.* Can an LLM do this easily? Can a bootcamp teach this specifically?
      *   *Step 4: Signal-to-Noise.* Does failure mean lack of ability, or just bad luck/confusion?
      *   *Step 5: Resource/Time Alignment.* Is the constraint realistic for the signal?
      *   *Deferral Points:* Where do we say "We don't know, but proceed with caution"?
      *   *Failure Points:* Where do we say "Reject this task"?

      *Refining the Steps for 20 Minutes:*
      *   Q1: **The Claim.** What specific cognitive operation is this? (Must be singular).
      *   Q2: **The Leak.** Can this be solved by retrieval (Google/Memory) rather than processing?
      *   Q3: **The AI Ceiling.** Can a standard LLM pass this without human intervention?
      *   Q4: **The Noise Floor.** Is there a single point of failure that blocks demonstrating skill?
      *   Q5: **The Transfer.** Does success here predict success in the *actual* apprenticeship work?

  4.  **Applying the Procedure to the Tasks:**

      *   **Task A (Alien Spreadsheet):**
          *   *Claim:* Learning speed / Fluid Intelligence (novel syntax).
          *   *Leak:* Low (fictional language).
          *   *AI:* Medium (LLMs struggle with fictional syntax unless few-shot provided in prompt, but candidates can't internet).
          *   *Noise:* Medium (Edge cases might be ambiguous).
          *   *Verdict:* Likely Pass, but watch for ambiguity.

      *   **Task B (Familiar Build):**
          *   *Claim:* "Intelligence" (but really Crystallized Knowledge/Endurance).
          *   *Leak:* High (Standard todo app is everywhere).
          *   *AI:* High (LLMs excel at boilerplate CRUD).
          *   *Noise:* Low (It works or it doesn't).
          *   *Verdict:* **FAIL.** This measures prior exposure and AI prompt engineering, not aptitude. This will be the unpopular verdict.

      *   **Task C (Broken Pipeline):**
          *   *Claim:* Debugging / Resilience / System understanding.
          *   *Leak:* Low (Obfuscated/Invented).
          *   *AI:* Medium/High (LLMs are good at debugging, but "wrong error messages" might hallucinate).
          *   *Noise:* High (If the specific bug is too obscure, it becomes a lottery).
          *   *Verdict:* Conditional Pass (Needs calibration on bug difficulty).

  5.  **Refining the Output (Tone and Structure):**
      *   *Tone:* Precise, operational, slightly clinical (matching the rationalist background), respectful of the constraints.
      *   *Formatting:* Clear headers, bullet points, bold text for decisions.
      *   *Constraint Check:* Ensure I explicitly mark where judgment is needed and where the procedure fails.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the procedure too complex for 20 minutes?
      *   *Fix:* Simplify the questions. Make them Yes/No where possible.
      *   *Critique:* Did I address the "incompatible things by intelligence" issue?
      *   *Fix:* Ensure Step 1 forces them to pick *one* construct.
      *   *Critique:* Is the unpopular verdict justified?
      *   *Fix:* Task B is the obvious candidate. It's the most "standard" but the most vulnerable to Goodhart/AI. I need to explain *why* it fails the specific criteria of measuring *aptitude* vs *achievement*.
      *   *Critique:* Did I include the "misfire" conditions?
      *   *Fix:* Add a section on "Known Failure Modes."

  7.  **Final Polish:** Check against the prompt requirements one last time.
      *   Stepwise procedure? Yes.
      *   Flowchart in words? Yes.
      *   Questions to ask? Yes.
      *   Pass/Fail/Defer? Yes.
      *   Mark judgment points? Yes.
      *   Demonstrate on A, B, C? Yes.
      *   Unpopular verdict? Yes (Task B).
      *   Closing statement? Yes.

  8.  *(Self-Correction on Task C)*: Task C involves "error messages point to the wrong cause." This is tricky. If the error is *too* misleading, it measures tolerance for frustration, not debugging. I need to flag this in the analysis.

  9.  *(Self-Correction on Task A)*: 45 mins for a fictional language is tight. Is it measuring learning speed or typing speed? Need to ensure the procedure catches "cognitive load vs. motor load."

  10. *(Finalizing the Procedure Name)*: Let's call it the "Construct-Validity Triage" (CVT). Sounds professional but descriptive.

  11. *(Drafting the Content)* - *Mental check on the "Rationalist" tone:* Use terms like "construct," "signal," "noise," "Goodhart," "operationalize." Keep it dense but readable.

  *(Proceed to generate response based on these thoughts.)*
answer: |-
  # The Construct-Validity Triage (CVT)

  This procedure is designed to be executed in under 20 minutes by an engineer with no psychometric training. It forces the explicit operationalization of "intelligence" and filters out tasks vulnerable to Goodhart's Law (coaching/AI).

  It does not validate that a task *works* (that requires longitudinal data). It validates that a task *measures what you claim it measures* and is not trivially bypassed.

  ## Part 1: The Vetting Procedure

  **Prerequisite:** The task proposer must write a one-sentence **Construct Statement** before beginning.
  *Format:* "This task measures [Candidate's Ability to X] by observing [Specific Behavior Y] under [Constraint Z]."
  *Example:* "This task measures *fluid reasoning* by observing *syntax acquisition* under *no-prior-knowledge constraints*."

  ### Step 1: The Construct Check (3 Minutes)
  **Question:** Does the Construct Statement distinguish between *acquired knowledge* (crystallized) and *processing capability* (fluid)?
  *   **Pass:** The statement explicitly names one or acknowledges the trade-off (e.g., "measures prior React knowledge" OR "measures ability to learn new DOM manipulation").
  *   **Fail:** The statement uses undefined terms like "intelligence," "skill," or "potential" without qualification.
  *   **Action:** If Fail, return to proposer. They must dissolve the term.
  *   **Judgment Point:** If the task claims to measure both (e.g., "knowledge and speed"), the assessor must decide which signal dominates. If they are equally weighted, **Flag for Deferral** (the task is likely too noisy).

  ### Step 2: The Retrieval Leak (5 Minutes)
  **Question:** Can a candidate pass this by retrieving a stored solution (memory or search) rather than processing the problem?
  *   **Test:** Search the exact task requirements on Google/GitHub.
  *   **Pass:** No exact matches exist. The specific combination of constraints is novel.
  *   **Fail:** A tutorial, StackOverflow thread, or common boilerplate solves >50% of the task.
  *   **Action:** If Fail, the task measures *prior exposure*, not aptitude. Reject unless the program explicitly selects for existing knowledge.
  *   **AI Check:** Paste the prompt into a standard LLM.
      *   **Hard Fail:** The LLM generates a passing solution instantly.
      *   **Soft Fail:** The LLM generates 80% of the solution, requiring only minor tweaking.
      *   **Pass:** The LLM hallucinates, fails the specific constraints, or requires human architectural guidance.

  ### Step 3: The Noise Floor (5 Minutes)
  **Question:** Is there a single point of failure where a competent candidate fails due to ambiguity rather than inability?
  *   **Test:** Identify the "critical path." Are instructions unambiguous? Are edge cases defined?
  *   **Pass:** Failure modes are clearly linked to lack of skill (e.g., "code does not compile," "data output is wrong").
  *   **Fail:** Failure modes rely on mind-reading (e.g., "code is not clean enough," "did not guess the specific trick").
  *   **Action:** If Fail, **Reject**. High noise invalidates the signal.
  *   **Judgment Point:** "Cleanliness" or "Polish" criteria. These are subjective. If the task relies on them, mark as **High Variance**.

  ### Step 4: The Transfer Claim (5 Minutes)
  **Question:** Does success on this task predict success in the actual apprenticeship work?
  *   **Test:** Map the cognitive operation in Step 1 to the daily work of a junior engineer in your program.
  *   **Pass:** The operation matches (e.g., Task: Debug obscure error -> Work: Debug obscure error).
  *   **Fail:** The operation is orthogonal (e.g., Task: Algorithmic puzzle -> Work: Gluing APIs).
  *   **Action:** If Fail, **Reject** or reclassify the Construct Statement (e.g., change "predicts job performance" to "filters for algorithmic background").
  *   **Judgment Point:** Near vs. Far Transfer. If the task is highly novel (Far Transfer) but the job is routine (Near Transfer), note the mismatch.

  ### Step 5: Final Disposition
  *   **Approved:** Passed Steps 1-4.
  *   **Conditional:** Passed 1, 2, 4; Flagged in 3 (Subjectivity). Requires rubric calibration.
  *   **Deferred:** Passed 1, 3, 4; Failed 2 (AI/Leak). Requires redesign to increase novelty.
  *   **Rejected:** Failed Step 1 (Undefined), Step 3 (Noisy), or Step 4 (No Transfer).

  ---

  ## Part 2: Known Failure Modes & Judgment Limits

  **Where this procedure misfires:**
  1.  **The "Creativity" Blindspot:** This procedure favors operationalizable metrics. Tasks designed to measure creative insight or architectural vision will often fail Step 3 (Noise) because these qualities are hard to score reliably in 20 minutes.
  2.  **The AI Arms Race:** Step 2's AI Check is a snapshot. An LLM that fails today may pass in six months. This procedure validates the task *now*, not forever.
  3.  **The Fairness Gap:** This procedure checks validity, not bias. A task can be perfectly valid (measures exactly what it claims) but systematically exclude capable candidates from non-traditional backgrounds (e.g., relying on cultural context in word problems). **Do not use this procedure to justify fairness.**

  **Where human judgment is unavoidable:**
  *   **Step 1 (Construct Weighting):** Deciding whether "knowledge" or "learning speed" is more valuable for your specific cohort is a normative business decision, not an empirical one.
  *   **Step 3 (Subjectivity):** Determining if a rubric is "subjective enough to be noisy" requires experience.
  *   **Step 4 (Transfer):** Predicting job performance from a test task is an empirical bet. The procedure ensures the bet is explicit, not that the bet will win.

  ---

  ## Part 3: Demonstration on Candidate Tasks

  ### Task A: Alien Spreadsheet
  *   **Construct Statement:** Measures *fluid reasoning* by observing *syntax acquisition* under *no-prior-knowledge constraints* (45 mins, no net).
  *   **Step 1 (Construct):** **Pass.** Clearly distinguishes learning speed (fluid) from prior knowledge.
  *   **Step 2 (Retrieval/AI):** **Pass.** Fictional language prevents Google leaks. LLMs typically struggle with fictional operators defined only in-context unless the context window is perfectly managed, which candidates cannot do without internet.
  *   **Step 3 (Noise):** **Conditional.** "Edge cases not covered in examples" creates ambiguity. If the edge case behavior is logically deducible from the 12 operators, it passes. If it requires guessing the designer's intent, it fails.
      *   *Verdict:* **Conditional Pass.** Requires a "Golden Solution" key to ensure edge cases have only one logical resolution.
  *   **Step 4 (Transfer):** **Pass.** High fidelity to the apprenticeship goal (learning new tools/domains quickly).
  *   **Final Verdict:** **APPROVED (with rubric calibration).**
  *   **Why:** It isolates the variable of interest (learning speed) by controlling the variable of noise (prior knowledge).

  ### Task B: Familiar Build
  *   **Construct Statement:** Measures *engineering competence* by observing *application completeness* under *48-hour take-home constraints*.
  *   **Step 1 (Construct):** **Fail.** "Engineering competence" is a bundle. Is this measuring knowledge of Auth? Persistence? UI? Or endurance? It conflates *accumulated skill* with *potential*.
  *   **Step 2 (Retrieval/AI):** **Hard Fail.** "Standard to-do application with login" is the "Hello World" of full-stack dev. Thousands of tutorials exist. An LLM can generate 90% of this scaffold in 30 seconds.
  *   **Step 3 (Noise):** **Pass.** Code runs or it doesn't.
  *   **Step 4 (Transfer):** **Fail.** Success here predicts *prior bootcamp attendance*, not *ability to learn*. It selects for those who have already done the work, not those who can do the work.
  *   **Final Verdict:** **REJECTED.**
  *   **The Unpopular Verdict:** Your team will dislike this because Task B is "industry standard." However, under this procedure, it fails the Retrieval and Construct checks. It measures **Crystallized Intelligence ($Gc$)** and **AI Prompt Engineering**, not **Fluid Intelligence ($Gf$)** or **Learning Rate**. If your goal is to find career-changers with high *potential*, this task selects for those with high *past exposure*. It is highly vulnerable to Goodhart's Law: candidates will coach specifically on "Todo App with Auth," rendering the signal useless.
      *   *Remediation:* If you must use a take-home, randomize the domain (e.g., "Inventory system for a bakery") and forbid standard auth libraries, forcing novel implementation.

  ### Task C: Broken Pipeline
  *   **Construct Statement:** Measures *debugging resilience* by observing *root cause diagnosis* under *obfuscated error constraints* (90 mins, live).
  *   **Step 1 (Construct):** **Pass.** Targets a specific cognitive operation (diagnosis under uncertainty).
  *   **Step 2 (Retrieval/AI):** **Pass.** Invented build system prevents search. LLMs may struggle if error messages are deliberately misleading (they tend to trust error text).
  *   **Step 3 (Noise):** **Fail/High Risk.** "Error messages point to the wrong cause." This is the danger zone. If the misdirection is too strong, the task measures *luck* or *telepathy* rather than debugging. A competent engineer following the evidence might be led astray by design.
  *   **Step 4 (Transfer):** **Pass.** High fidelity to legacy code maintenance.
  *   **Final Verdict:** **DEFERRED.**
  *   **Why:** The task design violates the Noise Floor. Deliberately lying error messages introduce uncontrolled variance. A candidate might fail not because they can't debug, but because they trusted the provided (false) signal.
      *   *Remediation:* The errors should not be *wrong*, but *misleadingly incomplete*. Or, the task must be piloted to ensure the "correct" path is logically deducible despite the noise. Until calibrated, this task risks rejecting competent candidates due to bad design rather than lack of skill.

  ---

  ## Part 4: Closing Statement

  **What this procedure cannot do:**
  It cannot guarantee that the candidates you select will be better employees than those you reject. It cannot detect bias against specific demographics unless that bias is encoded in the explicit Construct Statement. It cannot predict long-term retention.

  **What this procedure should never be used to justify:**
  It must never be used to claim "scientific objectivity" where none exists. The choice of *which* construct to value (e.g., valuing "learning speed" over "existing knowledge") is a business value judgment, not a scientific fact. This tool ensures you are measuring what you *think* you are measuring; it does not tell you what you *should* value. Do not use a passing CVT score to silence ethical debates about access or equity.
