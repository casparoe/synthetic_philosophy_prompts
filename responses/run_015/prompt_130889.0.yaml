      *   *Option B: Compatible (Distributed/Impersonal Accounting).* This argues that causality itself is the "bearer." The stream of consciousness (*santāna*) is sufficient continuity for moral responsibility, even if it's not a "self." Suffering and well-being can be summed across the causal stream because the *experience* of suffering is real, even if the *experiencer* is empty.

