answer: |-
  You should proceed on the premise that Buddhist ethics is compatible with consequentialist reasoning, provided you radically redefine the mechanism of aggregation. Karma functions as a distributed, impersonal accounting system that renders moral summation coherent precisely because there is no fixed self. To argue otherwise is to misunderstand the ontological status of causality in the tradition. The tension you perceive arises only if you assume that aggregation requires a static container—a soul or ego—to hold the sum. In Buddhist metaphysics, the container is irrelevant; only the flow matters.

  Here is the committed explanation of how this system operates, how aggregation survives the dissolution of the self, and what this implies for *upāya*.

  ### The Mechanism of Impersonal Accounting

  In a theistic or substantialist framework, moral accounting requires a creditor and a debtor. Merit is a currency stored in the account of a person. If the person does not endure, the account cannot close, and the currency becomes meaningless. Buddhist ethics rejects this model. Instead, it posits that reality is constituted by causal momentum. Karma is not a ledger kept by a god or a self; it is the structural inertia of volitional action.

  Aggregation survives the dissolution of the self because the "unit" of moral value is not the *agent*, but the *causal stream* (*santāna*). Consider the analogy of a flame passed from one candle to another. The flame on the second candle is not numerically identical to the flame on the first, yet it is causally dependent on it. If the first flame was used to burn a house, the heat and damage persist regardless of whether the specific flame continues. Similarly, volitional actions (*cetanā*) generate psychological and phenomenological momentum. This momentum carries forward into the next configuration of aggregates that we label a "new life."

  Therefore, aggregation is not the summation of experiences for a single subject. It is the summation of causal tendencies within a continuum. When a being acts with greed, they reinforce the neural and karmic patterns that make greed more likely and suffering more inevitable in the future. The "merit" or "demerit" is not a token stored for later redemption; it is a modification of the system's probability landscape. The "accounting" is distributed because every action alters the entire web of dependent origination (*pratītyasamutpāda*). You do not need a fixed self to sum suffering because suffering (*dukkha*) is an intrinsic quality of the conditioned experience, not a property owned by an experiencer. Pain hurts even if there is no one who "has" the pain. The continuity of the capacity to feel pain is sufficient for moral responsibility.

  ### Reconciling Consequentialism with Anattā

  This makes Buddhist ethics a form of long-term, systemic consequentialism. The "good" is defined by the reduction of suffering and the eventual cessation of the causal cycle (Nirvāṇa). The "consequence" is not merely the immediate outcome, but the trajectory of the causal stream across time.

  The structural impossibility you fear—that there is no unit over which to sum well-being—is resolved by recognizing that the "unit" is the *pattern of clinging*. Rebirth is not the transmigration of a person; it is the re-ignition of craving. Therefore, moral aggregation tracks the intensification or mitigation of craving. An unskillful action (*akusala*) is one that tightens the knot of conditioning, making future liberation harder and suffering more dense. A skillful action (*kusala*) loosens the knot. The "sum" is the total tension in the system.

  This view preserves rigorous moral taxonomy without a self. You can judge an action by its fruits (*phala*) because the fruits are objectively observable in the quality of consciousness that arises. If an action leads to agitation, confusion, and harm, it is unskillful, regardless of who performed it. The lack of a self does not negate the reality of the consequence; it merely negates the ownership of the consequence. This is crucial for your narrative: characters are not "paying debts" in a transactional sense. They are navigating inertia. They are dealing with the momentum of previous motions, not the bills of a previous tenant.

  ### The True Nature of Upāya

  If you accept this model of impersonal accounting, you must also correct the common misconception regarding *upāya* (skillful means). *Upāya* is not an escape from consequentialist calculation, nor is it a non-calculative situational ethics that suspends the law of karma. That would imply that karma is a rigid legal code that can be bypassed by wisdom. It is not.

  *Upāya* is high-resolution consequentialism.

  Standard moral rules (precepts) are heuristics—general rules of thumb that usually lead to good outcomes for most beings in most contexts. However, because reality is a complex, interdependent web, rigid adherence to a rule can sometimes generate greater suffering in a specific, nuanced context. *Upāya* is the capacity to perceive the causal web with such clarity that one can see when breaking a heuristic will result in a net reduction of suffering.

  For example, lying is generally unskillful because it erodes trust and creates confusion. But if a lie saves a life, the consequentialist calculus shifts. The suffering caused by the lie is less than the suffering caused by the death. A bodhisattva employing *upāya* is not exempt from karma; they are absorbing the negative karmic momentum of the lie willingly to prevent a greater catastrophic outcome for the system. They are manipulating the distributed accounting system with precision.

  Therefore, *upāya* is not a hidden calculus; it is an *advanced* calculus. It requires a being who can accurately weigh the karmic trajectory of multiple streams simultaneously. If your characters use *upāya*, they should not be depicted as breaking rules without consequence. They should be depicted as accepting specific, localized karmic costs to avert systemic collapse. They are trading a small fire to stop a forest fire. The accounting still holds; the agent is simply sophisticated enough to manage the ledger actively rather than passively suffering its entries.

  ### Narrative Implications for Your Work

  For your narrative, this philosophical stance offers a specific texture for moral agency across incarnations:

  1.  **Momentum, Not Memory:** Characters should not necessarily remember past lives to be responsible for them. Responsibility is carried in the structural tendencies of their mind—their fears, attractions, and reflexes. The "debt" is felt as a gravitational pull, not a memory of a bill due.
  2.  **Suffering Without a Sufferer:** You can depict scenes where intense suffering occurs, and the character realizes there is no one inside to own it, yet the suffering does not vanish. This validates the *anattā* doctrine while maintaining the reality of the karmic consequence. The fire burns without a "burner."
  3.  **The Cost of Upāya:** When a character employs skillful means to break a moral rule for a greater good, do not depict it as a clean victory. Depict the karmic recoil. They have altered the distributed accounting, and the system will seek equilibrium. This creates narrative tension: the hero saves the day but degrades their own causal trajectory, requiring future incarnations to resolve the dissonance they intentionally created.

  In conclusion, Buddhist ethics is compatible with consequentialist reasoning because the "consequence" is the stability of the causal process itself, not the happiness of a substantial self. Karma is a distributed, impersonal accounting system where value is aggregated across the continuity of conditioning, not the continuity of identity. *Upāya* is the expert manipulation of this system, not an exemption from it. This allows you to write a story where moral choices matter immensely across lifetimes, even though the "person" making those choices is, ultimately, a fiction.
