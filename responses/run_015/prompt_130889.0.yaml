      *   *Decision:* I will argue that Buddhist ethics *is* compatible with a form of consequentialist reasoning, but only if we radically redefine "consequentialism" to operate on causal streams rather than discrete selves. Karma functions as a distributed, impersonal accounting system. This resolves the tension without resorting to a hidden self.

