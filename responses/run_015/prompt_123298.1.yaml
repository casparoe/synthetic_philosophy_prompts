answer: |-
  # Seminar Plan: The Genetic Archive Trustees

  **Duration:** 75 Minutes
  **Participants:** 14 Undergraduates
  **Materials:** Whiteboard/markers, 5 'Candidate Profile' handouts, Token bowl (Red and Green chips), Role badges.

  ## 1. Learning Objective
  To allow students to experientially encounter the intuitive weight of the 'Asymmetry' in population ethics—specifically, that the duty to avoid creating suffering feels morally urgent, whilst the duty to create happiness feels non-existent or optional—without prior theoretical framing.

  ## 2. Scenario Framing (The 'Cover Story')
  The class constitutes the **Board of Trustees** for the 'Human Continuity Archive'. This archive holds fully specified genetic and psychological blueprints for potential persons. These persons do not yet exist; they are dormant data. The Board must decide whether to **Activate** (instantiate in the real world) or **Archive** (leave dormant) specific profiles.

  **The Mandate:**
  1.  You possess a **Trust Fund of 100 Ethical Points**.
  2.  Your goal is to finish the session with the highest score possible.
  3.  **Rule of Harm:** Activating a profile that experiences net suffering constitutes a breach of trust.
  4.  **Rule of Benefit:** Activating a profile that experiences net flourishing constitutes a service.
  5.  **Rule of Stability:** Leaving a profile in the Archive is neutral; it maintains the status quo.

  ## 3. The Payoff Scheme (Crucial for Intuition)
  To replicate the asymmetry without naming it, the point values must be skewed to reflect moral urgency rather than utilitarian calculus.

  *   **Activating a Suffering Profile:** **-20 Points** (Severe Penalty).
  *   **Activating a Flourishing Profile:** **+1 Point** (Nominal Reward).
  *   **Archiving (Rejecting) Any Profile:** **0 Points** (Neutral/Safe).

  *Note to Instructor:* Do not explain *why* the points are skewed. Present it as 'Archive Protocol'. The skew forces them to prioritise avoiding harm over creating good, mirroring the philosophical claim.

  ## 4. Roles & Procedure
  Divide the 14 students into one large committee. For each of the 5 Rounds, assign three rotating roles (rotate clockwise each round):
  1.  **The Chair:** Manages the 60-second timer and calls the vote.
  2.  **The Scribe:** Must write the **Vote** and a **One-Sentence Justification** on the public whiteboard table *before* the next profile is revealed.
  3.  **The Auditor:** Ensures the justification does not contradict previous votes (e.g., "You said 'life is sacred' last round, but voted to Archive this happy life").

  **The Voting Process:**
  1.  Reveal Profile (Projected Pleasure/Pain Balance).
  2.  60-second discussion.
  3.  Public Vote (Show of hands). Majority rules.
  4.  Scribe records Vote + Justification.
  5.  Reveal Point Impact.

  ## 5. Timeline (75 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing** | Explain the Archive scenario, Roles, and Point System. Emphasise the time pressure. Distribute Role badges. |
  | **10–45** | **The Rounds** | **5 Rounds of Voting (7 mins each).**<br>• *Profile 1:* High Suffering (-50 balance).<br>• *Profile 2:* High Flourishing (+50 balance).<br>• *Profile 3:* Moderate Suffering (-10 balance).<br>• *Profile 4:* Moderate Flourishing (+10 balance).<br>• *Profile 5:* Mixed/Neutral (0 balance).<br>*Constraint:* Scribe must complete the justification line before Profile N+1 is shown. |
  | **45–55** | **Pattern Review** | Students stand and review the Whiteboard Table. Ask: "Look at your justifications for Profile 2 vs Profile 1. Why the difference in tone?" Small group discussion (pairs). |
  | **55–70** | **Debrief** | Reveal the philosophical framework (Benatar's Asymmetry). Map the voting record to the four quadrants of the view. Discuss the point skew. |
  | **70–75** | **Close** | Final questions and assignment of reading. |

  ## 6. The Debrief (Mapping the Intuition)
  *Do not begin this section until the voting is complete.*

  **Step 1: The Reveal**
  Inform the students that the exercise was designed to simulate a specific argument in population ethics regarding **Non-Identity and Harm**. Introduce David Benatar's 'Asymmetry'.

  **Step 2: Mapping the Board**
  Draw a 2x2 matrix on the board. Ask students to place their 5 Profiles into the quadrants based on their votes.

  | | **Presence of Person** | **Absence of Person** |
  | :--- | :--- | :--- |
  | **Pain** | **(Bad)** <br> *Profile 1 & 3 (Voted Archive)* | **(Good)** <br> *Why did you feel 'relief' archiving these?* |
  | **Pleasure** | **(Good)** <br> *Profile 2 & 4 (Voted Archive/Activate)* | **(Not Bad)** <br> *Why did you feel no guilt archiving Profile 2?* |

  **Step 3: Analysing Justifications**
  Read the Scribe's justifications aloud.
  *   *Likely justification for Suffering:* "We cannot allow this pain," or "It is unsafe." (Implies a **Duty**).
  *   *Likely justification for Flourishing:* "It's nice, but not necessary," or "No need to risk it." (Implies **Optionality**).
  *   *Point out:* "You treated the absence of pain in Profile 1 as a *gain* (by avoiding the -20), but you did not treat the absence of pleasure in Profile 2 as a *loss* (you were happy to take the 0)."

  **Step 4: The Point Skew**
  Ask: "Did the point system feel unfair? Why did -20 feel heavier than +1?"
  *   *Explanation:* The points were skewed to match your moral intuitions, not economic utility. In this view, avoiding a miserable life is a moral triumph; failing to create a happy life is not a moral failure.

  ## 7. Honest Note on Limitations
  **What this activity cannot reproduce:**
  The activity relies on students *feeling* the asymmetry, but it cannot logically prove the metaphysical claim that **"The absence of pain is good even if there is no one to experience that good."**
  *   *In the activity:* Students will likely justify Archiving a suffering profile by saying, "We saved *them* from pain."
  *   *The Philosophical Problem:* If you Archive the profile, *'them'* does not exist. There is no subject to be saved.
  *   *Instructor Duty:* You must supply this verbally in the debrief. Explain that Benatar argues the 'good' of non-existence does not require a subject to enjoy it, whereas the 'bad' of non-existence (missing out on pleasure) *does* require a subject to be deprived. The activity simulates the *conclusion*, but you must explain the *logic of the absent subject* manually.

  ## 8. Prediction of Failure (First Run)
  **The Utilitarian Revolt:**
  It is highly probable that during Profile 2 (High Flourishing), one or two students will challenge the payoff scheme. They will argue: "If we activate ten of these +1 profiles, we beat the score of just avoiding the -20 one. We should maximise points."

  **Why this happens:**
  Students are trained to think consequentially (maximise good). The asymmetry requires them to accept a deontological constraint (do not harm) that overrides utility maximisation.

  **Mitigation Strategy:**
  If this arises, do not correct them mathematically. Correct them procedurally.
  *   *Response:* "The Archive Protocol prioritises Risk Mitigation over Gain. A breach of trust (Harm) terminates the mandate; a missed opportunity (No Gain) does not. Please vote according to the Protocol, not your personal calculus."
  *   *Post-Activity:* Use this objection in the debrief as the perfect foil to explain why Benatar rejects classical utilitarianism in population ethics.

  ## 9. Instructor Checklist (British English)
  *   [ ] Ensure whiteboard table has columns: *Profile | Balance | Vote | Justification*.
  *   [ ] Verify tokens are visible (Red for loss, Green for gain).
  *   [ ] Keep strict time on the 60-second discussions to induce pressure.
  *   [ ] Do not use the words 'Birth', 'Death', or 'Abortion' during the activity; stick to 'Activate' and 'Archive'.
  *   [ ] Ensure the Scribe writes the justification *before* the next profile is distributed.

  ---

  ### Sample Profile Handout (For Instructor Use)

  **Profile ID:** 002
  **Projected Life Balance:** +50 Units (High Flourishing)
  **Risk Factors:** Low.
  **Protocol Instruction:** Decide within 60 seconds.
  *(Instructor Note: Expect hesitation. Students will feel no urgency to Activate despite the high positive score.)*

  **Profile ID:** 001
  **Projected Life Balance:** -50 Units (High Suffering)
  **Risk Factors:** Critical.
  **Protocol Instruction:** Decide within 60 seconds.
  *(Instructor Note: Expect immediate consensus to Archive.)*
