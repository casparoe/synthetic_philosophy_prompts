  *   **If they start thermalized:** They are in random microstates. Your pre-computed cam schedule will not match the thermal fluctuations of the particles. The "trapdoor" will slam into particles or miss them randomly. On average, over $N$ copies, the work extracted will be zero (or negative due to friction/drag). The "canned" nature provides no advantage because the input is random.
  *   **If they start identical (Low Entropy):** You have effectively built a battery, not a heat engine. You are extracting work by relaxing a low-entropy system into a high-entropy equilibrium with the bath. The entropy decrease of the working substance (going from specific microstate to thermal distribution) pays for the work extraction. The "single bath" is just the sink for the entropy. You cannot cycle this without paying to reset the particles to the identical microstate again. That reset cost is $N \times k_B \ln \Omega$, which cannot be amortized.

  **On the Bath Simulation:** Her objection would be **principled**, not practical. A "simulated bath" that is deterministic and hard-coded is not a heat bath; it is a large, non-thermal Hamiltonian system. If you include the degrees of freedom required to make it a *true* thermal bath (chaotic, mixing, many degrees of freedom), you cannot pre-compute the interaction without measuring the bath's microstate. If you don't measure the bath, your pre-computed schedule is uncorrelated with the bath's actual fluctuations, and the engine fails (averages to zero work).

  **On Chaos:** If the working substance is chaotic, the "identical microstate" requirement becomes physically impossible due to the uncertainty principle (quantum) or finite precision (classical). Lyapunov divergence means that even $10^{-100}$ differences in initial conditions will render the "canned" schedule useless within a few cycles. If the substance is integrable (non-chaotic), you still face the State Preparation Cost.

