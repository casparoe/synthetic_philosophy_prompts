  ### 4. Epistemics: Settled vs. Contested
  You need to walk in knowing what is solid ground and what is swamp.

  **Settled Textbook Material:**
  *   **The Second Law:** For a cyclic process operating between a single heat reservoir, net work extraction is impossible ($\oint dQ/T \le 0$). This is unassailable.
  *   **Fluctuation Theorems:** Transient violations are possible in small systems (Jarzynski, Crooks), but the ensemble average obeys the 2nd Law. Her verdict on the "noisy undergrad ratchet" aligns with this.
  *   **Landauer's Principle (Experimental):** It is experimentally verified (e.g., Bérut et al., 2012) that erasing a bit dissipates at least $k_B T \ln 2$ of heat *on average*.
  *   **Detailed Balance:** In thermal equilibrium, forward and reverse transition rates balance. This kills the Feynman ratchet and Smoluchowski trapdoor without invoking information.

  **Contested/Philosophical Nuance:**
  *   **Is Landauer's Principle Fundamental?** Some (e.g., Earman, Norton) have argued it can be derived from Liouville's theorem without invoking "information" as a primitive. Others argue it is a separate physical principle. Your professor seems to treat it as derivable from stat mech ("cost is in resetting").
  *   **"Information is Physical":** While consensus in this subfield, it is not a universal axiom in all physics. Some view it as a useful analogy; others (like your professor, judging by the colloidal verdict) view it as an ontological resource.
  *   **The "Cost" Location:** There is ongoing debate about whether the cost is in the *erasure* specifically, or in the *correlation creation* (measurement). Your professor's verdict on the "appending tape" demon (cost deferred) suggests she aligns with the view that **correlations are the resource**, and erasure is just the most common way to pay for them.

  **Where She Might Be Idiosyncratic:**
  *   **The Reversible Undo Case:** She said, "no net work either, which... shows you can't have it both ways." Some modern information thermodynamics formulations allow for work extraction if you *consume* the correlation (leave the memory correlated). By insisting on "everything back where it started," she is enforcing a strict **Cyclic** definition of an engine. This is thermodynamically standard but excludes "one-shot" information batteries.
  *   **Ratchet Verdict:** Saying "you don't even need to talk about information" on the Feynman ratchet is standard classical stat mech, but some modern pedagogical approaches *do* explain it via information to unify the concepts. She prefers the classical explanation where possible.

