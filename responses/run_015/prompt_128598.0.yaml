  You asked which rule she has been running. Based on her precedents, she is **not** strictly following just Landauer's Principle (Reset Rule), nor just Detailed Balance. She is following a **Generalized Second Law with Cycle Closure**.

  **The Rule:** $\Delta S_{total} = \Delta S_{sys} + \Delta S_{bath} - I_{corr} \ge 0$.
