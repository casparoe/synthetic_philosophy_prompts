answer: |-
  Your intuition is spot-on. The blog post you read conflates **descriptive** claims (how people behave), **technical** claims (mathematical properties of discount functions), and **normative** claims (how people *ought* to behave). It also hides a crucial axiom—**Stationarity**—behind the word "only."

  Here is a sentence-by-sentence breakdown of what is settled, what is a simplification, and what is contested among economists and decision theorists.

  ---

  ### Sentence 1
  > *"Pure time preference is the idea that, all else equal, an outcome is less valuable just because it is later."*

  *   **Status:** **Generally Accepted Definition.**
  *   **Nuance:** This is the standard definition of *pure* time preference (intrinsic impatience). However, in practice, observed discounting often conflates pure time preference with other factors: risk (the future is uncertain), inflation (money loses value), or expected growth in marginal utility (you might be richer later, so an extra dollar matters less).
  *   **Verdict:** Accurate as a definition of the concept, though often confused with "observed discount rates" in empirical work.

  ### Sentence 2
  > *"The standard formalization is exponential discounting, and it is the only discounting scheme that is time-consistent."*

  *   **Status:** **Technically True under Hidden Assumptions / Misleading without them.**
  *   **The Hidden Assumption:** This claim relies on the **Stationarity Axiom**. Stationarity means your preference between two future dates depends *only* on the time delay between them, not on when those dates occur. (e.g., preferring Day 10 to Day 9 should be the same preference as Day 100 to Day 99).
  *   **The Theorem:** This is known as **Koopmans' Theorem (1960)**. It proves that if you require **Dynamic Consistency** (you don't flip-flop as time passes) AND **Stationarity** (your tastes don't change predictably over calendar time), then Exponential Discounting is indeed the *unique* mathematical representation.
  *   **What's Wrong:** If you drop Stationarity, you can have time-consistent non-exponential discounting. For example, if you know you will love chocolate more on your birthday than on a Tuesday, your discounting might look non-exponential, but it isn't "incoherent"—it reflects changing utility, not a logical error.
  *   **Verdict:** The word "only" is doing too much work. It should read: "It is the only discounting scheme that is time-consistent **assuming preferences are stationary.**"

  ### Sentence 3
  > *"Hyperbolic discounting, where the effective discount rate is higher for short delays, is therefore not a different rational attitude toward time but a self-control problem..."*

  *   **Status:** **Contested Normative Claim.**
  *   **Descriptive Fact:** It is settled that hyperbolic (or quasi-hyperbolic) discounting fits human and animal data better than exponential discounting.
  *   **The "Therefore":** The leap from "it violates stationarity" to "it is a self-control problem" is a normative judgment, not a mathematical fact.
  *   **The Debate:**
      *   **Standard View:** Most neoclassical economists treat dynamic inconsistency as a "bias" or "anomaly" (Thaler, 1981). They view the "long-run self" (exponential) as the rational planner and the "short-run self" (hyperbolic) as the impulsive actor.
      *   **Alternative View:** Some theorists argue hyperbolic discounting can be rational under **uncertainty**. If there is a hazard rate (a chance you won't survive to enjoy the future reward), a declining discount rate is mathematically optimal (Sozou, 1998). Others argue that changing preferences over time are not "incoherent" but simply reflect a changing self.
  *   **Verdict:** Calling it a "self-control problem" is the consensus *normative* stance in behavioral economics, but it is not a settled logical truth. It is a philosophical position on which "self" counts as rational.

  ### Sentence 4
  > *"...if you prefer $110 in two months to $100 in one month, but later prefer $100 now to $110 in a month, your preferences are incoherent."*

  *   **Status:** **Accurate Definition of Dynamic Inconsistency.**
  *   **Nuance:** This is the textbook definition of **Dynamic Inconsistency**.
  *   **The Word "Incoherent":** In decision theory, "incoherent" usually implies a violation of axioms that expose you to a "Dutch Book" (a series of bets that guarantee a loss). Dynamic inconsistency *can* expose you to exploitation (e.g., paying to delay a choice, then paying to reverse the delay), but only if you are "naive" about your inconsistency. If you are "sophisticated" (you know you will flip-flop and plan for it), you might not lose money, even if your preferences shift.
  *   **Verdict:** Accurate description of the phenomenon. Whether it constitutes true "incoherence" (irrationality) depends on whether you accept Dynamic Consistency as a requirement for rationality (which most do, but not all).

  ### Sentence 5
  > *"Once you commit to a constant discount factor, the only remaining question is what the right discount rate is, since any other choice just smuggles in a self-control bias."*

  *   **Status:** **Highly Contested / Often Wrong in Social Policy.**
  *   **The Commitment Claim:** It is true that pre-commitment devices (locking money away, laws) can help a dynamic inconsistent agent achieve their long-term goals. However, commitment *manages* the inconsistency; it does not prove the exponential rate is the ethically "correct" one.
  *   **The "Right Rate" Debate:** This is one of the biggest fights in economics.
      *   **Ethical Objection:** Philosophers like Henry Sidgwick and economists like Frank Ramsey argued that pure time preference is **"ethically indefensible"** (Ramsey, 1928). They argue we should not discount future generations' welfare simply because they are born later.
      *   **Uncertainty Argument:** Martin Weitzman (2001) showed that if there is uncertainty about what the *correct* exponential discount rate is, the effective social discount rate should decline over time (approaching the lowest possible rate). This looks like hyperbolic discounting but is derived from rational uncertainty, not self-control bias.
  *   **Verdict:** This sentence presents a contentious normative view as a settled fact. In climate economics and intergenerational equity, declining discount rates are often preferred *not* because of bias, but because of uncertainty and ethical considerations.

  ---

  ### Does the conclusion follow?
  > *"Once you commit to a constant discount factor... any other choice just smuggles in a self-control bias."*

  **No, this does not logically follow from the accurate parts.**

  1.  **Commitment solves the symptom, not the diagnosis:** Even if hyperbolic discounting is a self-control problem, committing to an exponential rate doesn't prove that exponential rate is the *truth*. It just forces consistency. You could consistently commit to a "wrong" rate.
  2.  **Rational Hyperbolicity:** As noted above, if declining discount rates arise from uncertainty about survival or future interest rates (Weitzman), then choosing a non-constant rate is **not** a self-control bias; it is a rational response to uncertainty. The blog post ignores this entire literature.

  ---

  ### Summary: Settled vs. Contested

  | Claim | Status | Context |
  | :--- | :--- | :--- |
  | **Exponential discounting implies time consistency.** | **Settled** | Mathematically true. |
  | **Time consistency + Stationarity implies Exponential discounting.** | **Settled** | Koopmans' Theorem (1960). |
  | **Humans actually discount hyperbolically.** | **Settled** | Robust empirical finding in behavioral econ. |
  | **Hyperbolic discounting is dynamically inconsistent.** | **Settled** | Mathematically true (without commitment). |
  | **Dynamic inconsistency is necessarily irrational.** | **Contested** | Depends on whether you value Stationarity or allow for changing tastes/hazards. |
  | **Pure Time Preference is ethically permissible.** | **Contested** | Heated debate in welfare economics & philosophy (Ramsey vs. others). |
  | **Social discount rates should be constant.** | **Contested** | Uncertainty arguments (Weitzman) suggest declining rates are rational. |
  | **Hyperbolic discounting is purely a self-control bias.** | **Contested** | Could be rational response to hazard rates or uncertainty. |

  ### The Verdict on the Blog Post
  The blog post presents the **standard neoclassical normative view** as if it were a **mathematical necessity**.

  *   **What it got right:** Exponential discounting is the unique solution *if* you assume Stationarity. Hyperbolic discounting creates dynamic inconsistency.
  *   **What it hid:** The Stationarity assumption is not a law of logic; it's an axiom that can be rejected.
  *   **What it got wrong:** It claims that *any* deviation from exponential discounting is a bias. This ignores rational arguments for declining discount rates (uncertainty) and ethical arguments against pure time preference (intergenerational equity).

  Your suspicion was correct: the words "only" and "incoherent" are masking the assumption of **Stationarity** and the normative judgment that the **long-run self is the only rational self.**
