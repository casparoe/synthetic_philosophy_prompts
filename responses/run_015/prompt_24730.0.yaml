  3.  **Identify Key Technical Concepts:**
      *   **Time Consistency (Dynamic Consistency):** Preferences don't flip merely due to the passage of time.
      *   **Stationarity:** Preferences between two future dates depend only on the *delay* between them, not the absolute date. (This is the crucial hidden assumption the user spotted).
      *   **Kooppmans' Theorem:** Exponential discounting is the unique representation of stationary, time-consistent preferences.
      *   **Normative vs. Descriptive:** Describing how people *do* act (hyperbolic fits better) vs. how they *should* act (exponential is usually the normative benchmark).
