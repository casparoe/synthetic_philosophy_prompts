answer: |-
  ### Diagnostic Taxonomy of Psychiatric Classification Effects

  This instrument is designed to sort philosophical positions on psychiatric diagnosis based on the logical implications of their claims, rather than by allegiance to specific authors. Follow the branching path from the root to arrive at one of six terminal positions (leaves).

  #### The Decision Tree

  **Root Question:** Do psychiatric classifications have any causal power over the behaviors they describe?
  *   **NO:** Go to **Branch A**.
  *   **YES:** Go to **Branch B**.

  ---

  **Branch A (No Causal Power):** The classification is a passive label that tracks or organizes behavior without altering it.
  *   **Question A1:** If insurance companies and hospitals stopped requiring diagnostic codes for reimbursement, would this category cease to be used in clinical conversation?
      *   **YES:** Go to **Leaf 1**.
      *   **NO:** Go to **Leaf 2**.

  ---

  **Branch B (Yes Causal Power):** The classification changes the behavior it names (Looping).
  *   **Question B1:** Do labeled individuals begin to self-organize around the diagnosis in ways that actively reshape their experience and social presentation (e.g., forming communities, adopting the label as identity)?
      *   **YES:** Go to **Branch B2**.
      *   **NO:** Go to **Branch B3**. (The causal power lies in the system, not the individual's self-conception).

  ---

  **Branch B2 (Individual Self-Organization):** The loop is driven by the patient's uptake of the label.
  *   **Question B2:** Do clinicians anticipate a category and intervene before full-blown symptoms appear, thereby producing the very trajectory they predicted, OR do patients alter their self-conception and behavior primarily in response to being named?
      *   **Patients alter self-conception post-naming (Reactive):** Go to **Leaf 3**.
      *   **Clinicians intervene pre-symptom to prevent/predict (Preemptive):** Go to **Leaf 4**.

  ---

  **Branch B3 (Systemic/Institutional Propagation):** The loop is driven by protocols, schools, or legal systems, not individual identity.
  *   **Question B3:** If the diagnosis were removed from official manuals today, would the corresponding symptom cluster diminish or vanish within a generation?
      *   **YES:** Go to **Leaf 5**.
      *   **NO:** Go to **Leaf 6**. (The behavior persists because institutional structures like disciplinary protocols sustain it independent of the manual).

  ---

  #### The Key: Mapping Positions to Leaves

  **Leaf 1: Pragmatic Instrumentalism**
  *   **Position:** The diagnosis is a bureaucratic tool with negligible descriptive pretensions.
  *   **Awkward Commitment:** This view must admit that clinical language is essentially a billing code, stripping it of any claim to truth about the human mind.
  *   **Status:** Named Position.

  **Leaf 2: Biological Realism (Natural Kind Realism)**
  *   **Position:** The classification tracks a pre-existing natural kind; the label is a discovery, not an invention.
  *   **Awkward Commitment:** This view must deny that receiving a diagnosis changes a patient's behavior in any meaningful way, treating the patient as a passive biological vessel.
  *   **Status:** Named Position.

  **Leaf 3: Hackingian Interactive Kind (Moderate Constructionism)**
  *   **Position:** The classification creates a feedback loop where the labeled person changes their behavior to align with the description.
  *   **Awkward Commitment:** This view implies that "recovery" might sometimes mean rejecting the label that defines the treatment path.
  *   **Status:** Named Position.

  **Leaf 4: Unnamed (Prophylactic Constructionism)**
  *   **Diagnosis:** This view is logically coherent but empirically unexplored; it suggests prevention programs create the pathology they aim to stop.
  *   **Awkward Commitment:** It casts clinicians as the primary vectors of disease transmission through the act of early intervention.
  *   **Status:** Unnamed.

  **Leaf 5: Strong Social Constructionism**
  *   **Position:** The pathology exists only insofar as the manual sustains it; without the classification, the behavior dissolves.
  *   **Awkward Commitment:** This view risks implying that suffering is illusory or that removing the word for pain removes the pain itself.
  *   **Status:** Named Position.

  **Leaf 6: Unnamed (Structural Institutionalism)**
  *   **Diagnosis:** This view is attractive for explaining chronicity but unexplored in standard looping literature; it locates the "kind" in bureaucracy rather than biology or psychology.
  *   **Awkward Commitment:** It suggests that changing the medical name of a disorder is useless because schools and courts will continue to punish the behavior regardless.
  *   **Status:** Unnamed.

  ---

  #### Conceptual Collapses and Unoccupied Space

  **Indistinguishable Pair: Leaf 1 (Instrumentalism) and Leaf 2 (Biological Realism)**
  *   **Reason for Collapse:** Within the specific logical space of *looping effects*, these two leaves are functionally identical. Both assert "No Causal Power." Whether the diagnosis is a "true biological fact" or a "useful billing fiction," neither view allows for the classification to change the behavior. The distinction is metaphysical (about truth) rather than causal (about looping). A student using this tree to study *looping* cannot separate these positions without asking questions outside the tree's scope (e.g., "Does the disease exist without humans?").

  **Unoccupied Combinations:**
  *   **Preemptive Institutional Looping:** The tree does not currently offer a branch for "Preemptive" action within the *Institutional* path (Branch B3). This combination is logically possible (e.g., schools discipline children based on a *risk* of a disorder before symptoms appear), but it is left empty to maintain the six-leaf constraint. It would likely merge with Leaf 6, as both rely on structural enforcement rather than individual self-conception.

  **Note on "Preemptive" vs. "Reactive" (Branch B2):**
  *   While distinguished here, in practice these may blur. A patient labeled "at risk" (Preemptive) may react to that label by adopting the symptoms (Reactive). If a student finds they cannot separate these in a case study, they should default to **Leaf 3**, as the mechanism of the patient's self-conception remains the driving force in both scenarios.
