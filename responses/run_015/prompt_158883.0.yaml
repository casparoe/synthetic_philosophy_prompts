  The vessel spins, the water stays at rest,
  Motion relative moves the wall alone.
  Yet still the surface lies like polished stone,
  No rising wave disturbs the level breast.
  But when the fluid joins the turning test,
  And both move on as if the pair were one,
  No slip remains between them, fully known,
  The water climbs, though stillness is possessed.

  Yet others claim the fixed stars grant the spin,
  That turning needs a presence to be found.
  So quench the stars, let vessel walls resign,
  Leave one lone sphere. Will it swell or stay round?
  One claims the swell survives the void's embrace,
  One claims no turn has meaning in this place.
