answer: |-
  You have put your finger on one of the most contentious and technically dense fault lines in the philosophy of mind and language. Your observation is sharp: there is indeed a strategic asymmetry in how externalists treat *nouns* (natural kind terms like "water") versus *predicates* (properties like "wet" or "drinkable").

  There is no single, catchy "brand name" for this specific noun-predicate asymmetry (like "The Gettier Problem"), but it is a recognized structural feature of **Two-Factor Semantics** and **Two-Dimensionalism**.

  If you are looking for the established technical vocabulary, the phenomenon you are describing is the tension between **Wide Content** (external reference) and **Narrow Content** (internal cognitive role). However, to capture the specific *shifting boundary* you noticed—where the noun is outsourced to the world but the adjective stays in the head—the most precise label is **Selective Externalism** (or sometimes **Partial Externalism**).

  Here is a precise breakdown of what you are seeing, the established terms that map onto it, and how to distinguish it from simple equivocation.

  ### 1. The Established Framework: Wide vs. Narrow Content
  To understand the asymmetry, you need the two categories philosophers use to split the difference:

  *   **Wide Content (Externalist):** The part of the thought that depends on the environment. This fixes the *reference*. (e.g., "Water" refers to H2O here, XYZ there).
  *   **Narrow Content (Internalist):** The part of the thought that is shared between twins. This fixes the *cognitive role* or *mode of presentation*. (e.g., The experience of thirst, the look of clarity, the feeling of wetness).

  In standard Twin Earth arguments, "Water" is treated as carrying **Wide Content**, while concepts like "Wet" or "Drinkable" are often treated as carrying **Narrow Content**.

  ### 2. Naming the Asymmetry: Referential Externalism / Predicative Internalism
  Since there isn't a single coined phrase for the noun/adjective split specifically, the most accurate descriptive name for the maneuver you identified is **Referential Externalism with Predicative Internalism**.

  *   **Referential Externalism:** The *subject* of the sentence (the noun) gets its meaning from the external world (H2O vs. XYZ).
  *   **Predicative Internalism:** The *properties* applied to it (the adjectives) get their meaning from the subject's internal state or functional interaction (phenomenal experience of wetness).

  **Why the boundary shifts:**
  You noted that the line moves to protect intuitions. In philosophy, this is often formalized as **Two-Dimensional Semantics** (championed by philosophers like David Chalmers and Frank Jackson). This framework explicitly allows a concept to have two "dimensions" of meaning:
  1.  **Primary Intension (Internal):** How we identify the stuff (clear, liquid, quenches thirst). This is shared by the twins.
  2.  **Secondary Intension (External):** What the stuff actually is in the world (H2O vs. XYZ). This differs.

  When arguing about *reference*, philosophers emphasize Dimension 2 (External). When arguing about *error* or *psychology* (e.g., "Why did the twin drink the XYZ?"), they emphasize Dimension 1 (Internal). Your observation that the boundary "shifts to protect whichever intuition is under pressure" is a common criticism of this framework, often called **The Instability of Two-Dimensionalism**.

  ### 3. Why isn't this just Equivocation?
  You asked how this differs from plain equivocation. Equivocation is a fallacy where a word is used in two different senses *without justification* within the same argument.

  This asymmetry is not considered equivocation by its proponents because it relies on a metaphysical distinction between **Natural Kinds** and **Functional/Phenomenal Properties**.

  *   **"Water" (Natural Kind):** Defined by its hidden microstructure. We defer to experts/science to tell us what it is. Therefore, it *must* be external.
  *   **"Wet" (Functional/Phenomenal):** Defined by how it interacts with our bodies or senses. It is defined by its "role," not its hidden structure. Therefore, it *can* be internal.

  **The Difference:** Equivocation says "Bank means river edge and money bank, and I'm swapping them secretly." This asymmetry says "Nouns track *substances* (external), while adjectives track *interactions* (internal)." It claims to be a feature of reality, not a linguistic trick.

  **However,** critics (like Jerry Fodor or early Noam Chomsky) argue exactly what you suggested: that this is **Explanatory Opportunism**. They argue that if you are an externalist about "water," consistency demands you be an externalist about "wet" (since wetness is caused by the liquid). If you allow "wet" to stay internal, you are arguably smuggling internalism back in to save the theory from absurdity.

  ### 4. Why isn't this just "Multidimensional Concepts"?
  Saying concepts are "multidimensional" usually means one concept has multiple criteria for application (e.g., a "bachelor" is unmarried AND male).

  The asymmetry you found is different because it applies to the **syntax of the thought**, not just the definition of one word. It claims that the *subject position* in a proposition is governed by different metaphysical rules than the *predicate position*.
  *   **Multidimensional:** "Water" has an internal definition AND an external reference.
  *   **Your Observation:** "Water" is external, but "Wet" is internal, *in the same sentence*.

  This is closer to what is called **Semantic Compartmentalization**. It suggests the mind processes "object identity" differently than "property attribution."

  ### 5. Summary and Definition
  If you wish to use a precise term in future discussions, you can define the phenomenon as follows:

  > **The Referential-Predicative Asymmetry:** A theoretical maneuver in externalist semantics where the reference of natural kind terms (nouns) is determined by external environmental factors (Wide Content), while the satisfaction conditions of observational or functional predicates (adjectives) are determined by internal cognitive or phenomenal states (Narrow Content). This asymmetry is often employed to preserve externalist truth-conditions while maintaining internalist explanations of psychological similarity and error.

  **The Edge of the Thing:**
  *   **It stops being this asymmetry** when the property in question is also a natural kind. (e.g., If the twin says "This water is H2O," the predicate "H2O" is now external too).
  *   **It becomes equivocation** if the philosopher claims the *same* concept is both fully internal and fully external in the *same respect* without using a two-factor framework to distinguish them.
  *   **It becomes "Mixed Externalism"** when the philosopher admits they are applying externalism selectively based on the type of concept (Natural Kind vs. Functional).

  ### Conclusion
  You haven't missed something obvious; you have identified the "seam" where externalist theories are stitched together with internalist intuitions. In the literature, this is most rigorously handled by **Two-Factor Theories of Content**, but your critique regarding the "shifting boundary" aligns with the **Instability Objection** raised by critics of externalism.

  The specific name for the strategy is **Selective Externalism**, and the mechanism is the **Wide/Narrow Content Distinction** applied differentially to **Natural Kind Terms** versus **Functional Predicates**.
