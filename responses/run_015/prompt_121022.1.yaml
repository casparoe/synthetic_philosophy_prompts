answer: |-
  To construct this conceptual issue, we must situate the sea-battle prediction within a branching-time model where moments are not merely points on a linear timeline but nodes defined by their specific historical paths. In this framework, the indexical "tomorrow" does not simply pick out a coordinate on a universal clock; it refers to the immediate successor moment relative to the specific history in which the utterance is evaluated. This creates a tension between the logical demand for bivalence and the semantic reality of indexical reference.

  Consider an Admiral standing on the deck of his ship on Monday morning. He looks at the sky and declares, "There will be a sea battle tomorrow." In a branching framework, the future splits immediately after this moment into two distinct histories: History Alpha, where the order to engage is given and the battle occurs; and History Beta, where a storm arises, the order is countermanded, and the fleet remains in port.

  The problem arises when we attempt to assign a truth value to the Admiral's statement *now*, on Monday, while respecting the indexical nature of his words. If we maintain the principle of bivalence, we must assert that the proposition expressed by the Admiral is either true or false at the moment of utterance. This requires that there be a single, stable proposition—let us call it $P$—that serves as the truth-bearer. However, if we analyze the semantics of "tomorrow" within the branching structure, the referent of this term shifts depending on which history is considered.

  In History Alpha, "tomorrow" picks out moment $m_{\alpha}$, a temporal location characterized by cannon fire and maneuvering. In History Beta, "tomorrow" picks out moment $m_{\beta}$, a temporal location characterized by calm seas and anchored ships. If moments are individuated by the events they contain or the history they belong to, then $m_{\alpha}$ and $m_{\beta}$ are not the same temporal location. Consequently, the proposition expressed in Alpha ($P_{\alpha}$: "Battle occurs at $m_{\alpha}$") is not identical to the proposition expressed in Beta ($P_{\beta}$: "Battle occurs at $m_{\beta}$").

  Here lies the explicit conflict: To satisfy bivalence, we must treat the Admiral's utterance as expressing one proposition $P$ that is capable of being true or false independently of the branch. But to respect the hidden indexicality of branching time, we must acknowledge that the utterance expresses $P_{\alpha}$ in one context and $P_{\beta}$ in another. If $P_{\alpha}$ and $P_{\beta}$ are distinct, then there is no single proposition $P$ existing on Monday to which we can assign a truth value. We are left with a schematic content that only crystallizes into a specific truth-bearer once a branch is selected.

  Therefore, the demand that the claim be true or false *now* forces us to ignore the indexical shift, effectively treating "tomorrow" as a rigid designator for a history-independent time slot. But if we do that, we undermine the branching model itself, which posits that the future is not a single slot waiting to be filled, but a divergence of distinct temporal locations. We cannot simultaneously hold that the proposition is semantically sensitive to the branch (due to indexicality) and logically evaluable as a single unit (due to bivalence) prior to the branch being actualized.

  Summary: The conceptual clash emerges because maintaining present bivalence requires a single, stable proposition to evaluate, whereas branching time with hidden indexicality implies that future-tensed statements express distinct propositions across branches due to shifting temporal referents.
