answer: |-
  The broken step is **(4)**.

  Specifically, the break occurs in the move from *"Five deaths for one life isn't proportionate"* to *"So not diverting is forbidden, i.e. diverting is obligatory."*

  You have imported a **maximizing** logic into a **satisficing** framework. This is a common trap when formalizing DDE, because the word "proportionate" sounds like a weighing scale that must tip toward the heavier side. But in deontological ethics (which DDE is), proportionality is a **threshold condition for permission**, not a **comparative condition for obligation**.

  Here is how you fix it without sacrificing (1), without leaning on the Doing/Allowing distinction (keeping your section intact), and without collapsing into consequentialism.

  ### 1. The Diagnosis: Permission vs. Obligation
  Your argument assumes that if an option fails the proportionality test, it becomes *impermissible*, and therefore the alternative becomes *obligatory*.
  *   **Consequentialism:** If Outcome A > Outcome B, you *must* do A.
  *   **DDE:** If Action $\phi$ meets conditions (a), (b), and (c), you *may* do $\phi$.

  DDE is a doctrine of **side-constraints**, not a doctrine of **duties to optimize**. It tells you what you are forbidden from *intending* or *doing*, not what you are required to *prevent*.

  In your Step (4), you argue that *Not Diverting* fails proportionality (1 death vs. 5 deaths). Even if we grant that (which is contentious, see below), DDE does not say "You must avoid all disproportionate outcomes." It says "You must not *act* such that your act produces disproportionate harm."
  *   **Diverting:** You act. You save 5, kill 1. Is the good proportionate to the bad? Yes. **Verdict: Permitted.**
  *   **Not Diverting:** You refrain. 5 die, 1 lives. Is the "good" (1 life saved by inaction) proportionate to the "bad" (5 deaths)? In DDE, inaction is not usually subject to the proportionality test in the same way, but even if you run it through the test (per your Step 2), the "good" of maintaining non-interference is typically deemed *sufficient* to meet the threshold. **Verdict: Permitted.**

  Because both are permitted, neither is obligatory. Step (4) falsely converts a failure of optimization into a violation of constraint.

  ### 2. The Fix: Reformulate (1c)
  You want to keep (1). You don't need to delete (1c), but you need to clarify its logic to block the maximizing inference.

  **Current (1c):** "the good is proportionate to the foreseen harm."
  **Problem:** "Proportionate" implies a ratio that could theoretically be improved.

  **Proposed Reformulation:**
  > (1c) the good achieved is **sufficiently weighty to justify** accepting the foreseen harm.

  **Why this works:**
  *   **Sufficiency vs. Maximization:** "Sufficiently weighty" sets a floor. Once the good crosses the floor, the condition is met. It does not require you to look around for a higher floor.
  *   **Blocks Step (4):** In the Trolley case, saving 5 at the cost of 1 is *sufficient* to justify the switch. Therefore, switching is permitted. However, *not* switching involves no "active" harm you are imposing; the harm is the trolley's. Even if you treat the omission as an act, the "good" of non-interference is also *sufficient* to justify the foreseen deaths (since you aren't the cause). Both clear the threshold. Neither is mandated.
  *   **Blocks Step (5):** In the Transplant case, cutting up the vagrant fails **(1b)** (the harm is the means, not a side effect). Because DDE conditions are **conjunctive** (you need a AND b AND c), failing (1b) makes the act forbidden *regardless* of how proportionate the outcome is. Your Step (5) assumes that if the omission fails proportionality, you are forced to act even if the act violates (1b). That is a category error. You cannot use (1c) to override (1b).

  ### 3. Addressing the Baseline Worry
  You wrote: *"Same people, same deaths, same agent, same foresight — differs only in which way the hardware happens to sit. So either DDE manufactures a duty where everyone hears only a permission, or its verdicts are hostage to a baseline."*

  This worry only holds water if DDE generates **duties**. If DDE generates **permissions**, the baseline is irrelevant to the moral law; it only determines the **available action set**.

  *   **Scenario A (Switch defaults to 5):**
      *   Action: Throw switch to save 1 (kill 5). Fails proportionality. **Forbidden.**
      *   Action: Do nothing (5 die). **Permitted.**
      *   Action: Throw switch to save 5 (kill 1). **Permitted.**
  *   **Scenario B (Switch defaults to 1):**
      *   Action: Throw switch to save 5 (kill 1). **Permitted.**
      *   Action: Do nothing (1 die). **Permitted.**

  In both scenarios, the agent has a **permission** to save the five (by throwing the switch in B, or throwing the switch in A). In both scenarios, the agent has a **permission** to let the default happen. The moral verdict on the *available actions* is consistent. The fact that "Do Nothing" yields different body counts is a feature of the world, not a bug in the ethics. DDE judges the *agent's intervention*, not the state of the world.

  ### 4. Why Step (2) isn't the problem (saving your section)
  You were worried that (2) was the weak link because you have a section arguing the Doing/Allowing distinction does no independent work. You can keep (2).

  You can maintain that DDE conditions apply to omissions *in form* (we evaluate the intention and foresight of the omission) without accepting that omissions are subject to *maximizing duties*.
  *   If I omit to save 5, my "end" is non-interference.
  *   My "foreseen harm" is 5 deaths.
  *   Is non-interference sufficiently weighty to justify 5 deaths? **Yes**, because I am not the causal source of the threat.
  *   Therefore, the omission is permitted.

  This allows you to treat acts and omissions symmetrically regarding the *structure* of the test (satisfying your Section on Doing/Allowing) without triggering the consequentialist collapse (because the *threshold* for omissions is met by the absence of causal agency).

  ### Summary of the Repair
  1.  **Reject (4).** DDE defines the **Permissible Set**, it does not select the **Optimal Member** of that set.
  2.  **Clarify (1c).** Change "proportionate" to "sufficiently weighty to justify." This makes it a threshold test, not a comparative test.
  3.  **Enforce Conjunction.** Remind yourself that (1a), (1b), and (1c) are all necessary. You cannot use a high score on (1c) to bail out a failure on (1b) (which kills the Transplant Case).
  4.  **Ignore the Baseline.** Since DDE grants permissions, not duties, the default position of the trolley only changes which actions are *available*, not which actions are *moral*.

  This saves your chapter, keeps (1), avoids the Doing/Allowing distinction as a *fundamental* moral divider, and stops the slide into consequentialism.
