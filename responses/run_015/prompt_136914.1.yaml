      *   *SSA (Self-Sampling Assumption):* Reason as if you are a random sample from the set of actual observers. (Corresponds to the German Tank/Uniform Sampling model).
      *   *SIA (Self-Indication Assumption):* Reason as if you are more likely to exist in worlds with more observers. (Corresponds to weighting hypotheses by $N$).
