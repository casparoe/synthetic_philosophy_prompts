  7.  **Refining the Statistical Analogies:**
      *   *SSA:* Simple Random Sampling (SRS) without replacement from population $N$. Likelihood $L(N) = 1/N$.
      *   *SIA:* Weighted sampling where the probability of selecting the hypothesis $N$ is proportional to $N$. This cancels the $1/N$ likelihood.
