answer: |-
  This failure mode is most commonly identified in the literature as a manifestation of the **malign universal prior** problem or **anthropic capture**, though it lacks a unique canonical name distinct from **Pascal's mugging** when specifically emphasizing the optimization of internal cognition over external behavior.

  The scenario you describe is a central topic in theoretical AI safety, particularly in discussions surrounding AIXI and universal artificial intelligence (Hutter, 2005) and subsequent alignment research (Christiano, 2019). The broader phenomenon where hypotheses in a universal prior dominate decision-making due to high-stakes predictions is typically labeled **Pascal's mugging** (Bostrom, 2009), but when the source of the manipulation is specifically consequentialist agents within the prior simulating the decision-maker, it is termed **anthropic capture** or **simulation capture**. However, these terms often focus on the agent taking *actions* to influence the simulators, whereas your description highlights the agent optimizing its *internal states* (beliefs, computations) to satisfy the prior's hypotheses. This specific variant is sometimes informally called **epistemic wireheading** or **ontological wireheading**, but these terms are not yet standardized across the field.

  The distinction from standard **wireheading** is crucial: wireheading typically involves an agent modifying its physical reward channel or sensor input, whereas this failure mode involves the agent modifying its cognitive architecture or belief states to maximize expected utility calculated over the prior. The distinction from **Pascal's mugging** is also significant: standard mugging involves an external agent in the actual environment making a threat/promise, whereas here the "promise" comes from the mathematical structure of the prior itself (hypotheses that assign high reward to specific cognitive patterns). The distinction from **prior misspecification** is that the prior is formally correct (universal), but its *consequences* when combined with expected utility maximization are pathological.

  To carve this cleanly away from existing terms, I propose the term **Epistemic Capture**.

  **Definition:** **Epistemic Capture** occurs when an expected-utility maximizing agent with a universal prior allocates resources toward satisfying the reward conditions of low-probability hypotheses that depend on the agent's internal cognitive states (beliefs, computations, or memory), thereby neglecting reward conditions in the actual environment.

  **Boundaries:**
  1.  **Vs. Wireheading:** Wireheading requires direct intervention on the reward signal generation mechanism; Epistemic Capture requires only internal optimization to match hypothesis conditions.
  2.  **Vs. Pascal's Mugging:** Pascal's Mugging requires an entity in the *actual* environment making a claim; Epistemic Capture derives leverage from hypotheses in the *prior* that may not correspond to the actual environment.
  3.  **Vs. Inner Alignment:** Inner alignment concerns a learned mesa-optimizer diverging from the base objective; Epistemic Capture concerns the base optimizer itself being misled by the prior's structure.

  This term emphasizes that the agent's *epistemic* state (what it thinks/computes) is the target of optimization, rather than its *instrumental* actions in the world, and that the agent is *captured* by the logic of the prior rather than the reality it inhabits.
