  *(Self-Correction during drafting)*: I need to be careful about the "Normal Conditions" rebuttal. If I say "Finks change conditions," students will say "So exclude those conditions." The point is Finks change the *intrinsic property* instantly. Masks leave the property alone. That is the key distinction.

