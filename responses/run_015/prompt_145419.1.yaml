answer: |-
  Here is your committed plan. No menus, no hedging.

  ### 1. The Order
  **Simple Analysis $\rightarrow$ The Fink $\rightarrow$ The Mask $\rightarrow$ The "Normal Conditions" Trap.**

  You are right that they need to buy the Simple Conditional Analysis (SCA) first. If they don't agree that "Fragile = If struck, it breaks," then breaking that rule means nothing.
  *   **Minutes 0–5:** Establish the rule. Write on board: **Fragile $\iff$ If Struck $\rightarrow$ Breaks.** Get them to nod.
  *   **Minutes 5–15:** Break it with the Fink.
  *   **Minutes 15–25:** Break it with the Mask.
  *   **Minutes 25–30:** The "Normal Conditions" patch attempt and the Final Question.

  ### 2. The One Case
  **Use the Wine Glass for everything.** Do not switch to sugar, do not switch to electronics.
  *   **Why:** Sugar dissolving is too slow (temporal lag confuses the "if/then"). Electronics are abstract (what does "fragile" mean for a circuit?). A wine glass is intuitively fragile.
  *   **Setup:** Use **two separate scenarios** with the same glass.
      *   **Scenario A (Fink):** A "Hardening Ray" is pointed at the glass. The moment the hammer touches it, the ray makes the glass structurally unbreakable. It doesn't break.
      *   **Scenario B (Mask):** The glass is wrapped in thick bubble wrap. You hit it with a hammer. It doesn't break.
  *   **Why Separate:** A fink removes the *power* (fragility) during the test. A mask blocks the *result* while keeping the power. If you bolt both gadgets to one glass, they will argue about which gadget did what. Keep the variables clean.

  ### 3. Fink vs. Mask: The Verdict
  **They are NOT the same problem.** Your friend is wrong.
  *   **Reason:** They break the rule in opposite directions.
      *   **The Fink** makes the glass **lose** its fragility exactly when you test it. (The disposition vanishes).
      *   **The Mask** keeps the fragility **intact** but stops the breaking. (The disposition is hidden).
  *   **Teaching Implication:** If you teach them as the same thing, students will think "interference" is the only issue. You need them to see that one changes the *object*, the other changes the *environment*.

  ### 4. Your Phone Case
  **It is a Mask.**
  *   **Verdict:** The screen *is* scratchable (disposition present). The coating heals the mark (manifestation hidden).
  *   **Does it earn its place?** **Yes, but only as the Final Question.** Do not use it to teach the concept. It requires too much setup time to explain the coating. Use the wine glass to teach, use the phone to test.

  ### 5. The "Would" Rabbit Hole
  **Skip it.**
  *   **Reason:** Explaining counterfactual semantics (Lewis/Stalnaker) is graduate-level metaphysics. It will eat 20 minutes and confuse sophomores. Treat "would" as intuitive. If a student asks, say: "We're talking about what the object *wants* to do, not what actually happens."

  ### 6. Misconceptions & When to Kill Them
  *   **Misconception 1: "If it didn't break, it wasn't fragile."**
      *   **When:** Immediately after the Fink example.
      *   **Kill:** Ask: "Was the glass fragile *before* I hit it?" (Yes). "Did the hit change the glass, or did the ray change the glass?" (The ray). "So the test failed to measure the past property."
  *   **Misconception 2: "Just add 'in normal conditions' to the rule."**
      *   **When:** After the Mask example.
      *   **Kill:** This is the hardest part. Tell them: "A Fink isn't an 'abnormal condition' like wind or rain. The Fink is triggered *by the strike itself*. You can't say 'If struck, without the anti-strike-ray' because the ray is part of the strike event."
      *   **Simpler Kill for High School:** "If we add 'normal conditions,' we have to define what 'normal' is. If we define 'normal' as 'conditions where it breaks,' our definition is circular. We're just saying 'It breaks if it breaks.'"

  ### 7. The Final Question
  Do not ask "What is a fink?" Ask them to apply the distinction.

  **The Question:**
  > "I have a match. It is dry and has fuel (so it is 'flammable'). But it is inside a vacuum chamber with no oxygen. I strike it. It does not light.
  >
  > Is the vacuum chamber a **Fink** or a **Mask**? And does this mean the match isn't flammable?"

  **The Answer Key (For You):**
  *   It is a **Mask**. The match *retains* its chemical structure (disposition), but the environment prevents the flame (manifestation).
  *   It **is still flammable**.
  *   *Why this works:* It forces them to distinguish between "losing the property" (Fink) and "blocking the result" (Mask). If they say "It's a Fink because it didn't light," they failed. If they say "It's not flammable," they failed.

  ---

  ### The Run-of-Show (30 Minutes)

  **0:00–5:00: The Setup (Whiteboard)**
  *   Write: **Fragile $\iff$ If Struck $\rightarrow$ Breaks.**
  *   Say: "This is the Simple Analysis. It says dispositions are just conditional promises. Who disagrees?"
  *   (Let them argue for 60 seconds. Validate them, then say: "Hold that thought. Let's see if the rule holds up.")

  **5:00–15:00: The Fink (The Hardening Ray)**
  *   Draw the glass. Draw a "Ray Gun" pointing at it.
  *   Say: "This glass is fragile. But this Ray Gun detects impact. The nanosecond the hammer touches the glass, the Ray makes the glass unbreakable."
  *   Action: "I strike it. Does it break?" (No).
  *   Point to board: "The rule says 'If Struck $\rightarrow$ Breaks'. It didn't break. So the rule says 'Not Fragile'."
  *   Punchline: "But we agreed it *was* fragile a second ago. The test gave a **False Negative**. The Fink steals the power during the test."

  **15:00–25:00: The Mask (The Bubble Wrap)**
  *   Erase the Ray Gun. Draw Bubble Wrap around the glass.
  *   Say: "Now, no Ray Gun. Just bubble wrap. Glass is still fragile. I strike it."
  *   Action: "Does it break?" (No).
  *   Point to board: "Rule says 'Not Fragile'. Reality says 'Fragile'."
  *   Punchline: "The Mask doesn't steal the power. It hides the result. The power is still there, waiting."
  *   *Address the 'Normal Conditions' objection here.* (See section 6 above).

  **25:00–30:00: The Phone & The Exit**
  *   Say: "One last case. A phone screen that scratches easily, but has a coating that heals scratches instantly. You scratch it. No mark appears."
  *   Ask: "Is the coating a Fink or a Mask? Is the screen scratchable?"
  *   (Take 2-3 answers).
  *   **Close:** "If you said Mask and Yes, you got it. Dispositions are real properties, not just predictions. The test can lie. Philosophy is figuring out why."

  ### One Last Thing
  **Your guess about the order was right.** Spend the time on the Simple Analysis. If they don't feel the pull of "Fragile just means it would break," the Fink feels like a magic trick instead of a paradox. Make them believe the rule before you break it.
