prompt: |-
  Two friends of mine have been going at it for about a year about who should get to have a say in a given political decision, and I volunteered — should of said no — to help them turn the argument into a written thing. One of them holds the all-affected-interests view: you have a claim to a say in a decision just in case, and to the degree that, the decision affects your interests. The other holds the all-subjected view: what matters is that you are subject to the coercive power of the body making the decision. They have agreed in principle to an adversarial collaboration and I am meant to produce the draft they can both react to. Will you write it?

  What I need in it:

  1. A numbered agreed-claims section — the things both of them could actually sign. I think at least some of these belong there, but you decide and add your own: that a boundary principle is supposed to tell us who has a claim to a say, not who gets to rule; that both views agree on the easy cases, like long-term legal residents and small children represented by trustees, and only really come apart at the margins; that any such principle seems to face a circularity, because you need some prior account of which decisions are this bodys to make and which are collective at all; that neither principle by itself fixes what level of government should decide a given thing; and that stakes come in degrees while having a vote is binary. Where a claimed agreement is only apparent, say so and say why.

  2. A disagreements section, as a table, where every disagreement is stated twice — once in wording the affected-side would accept for its own view, once in wording the subjected-side would accept for its own — with the source side labelled. If you think a row is really just a verbal dispute or a difference of emphasis dressed up as a substantive one, flag it as such rather than pretending it is deep.

  3. The cruxes: the sub-questions such that settling one would move at least one of them. My guesses about what belongs here: whether coercion or stakes is the right currency in the first place; whether the relevant stakes are stakes in this particular decision or in the whole package of things the polity does over time; whether a very slight degree of affectedness generates any real claim, or whether the affected view quietly collapses into everyone belongs to every demos, and if so whether that is a reductio or a fine result; whether these principles are about legitimacy, so that a demos that excludes wrongly simply lacks authority, or only about justice in how the lines get drawn; and questions of timing, like people who show up after the vote, children born later, and people who can exit only at ruinous cost. Cut or add freely.

  4. For each crux, a case both of them would accept as bearing on it, with each side's prediction written down in advance of the answer, like a prediction register. Please use concrete cases and not the textbook ones, because they have both read all of those and just trade intuitions about them. Here is what I have in mind, roughly, but fix them so they actually isolate something:

  - A city of about 380,000 puts a combined transit and zoning package on the ballot every two years, voted by registered city residents. Roughly 70,000 people commute in each day from four unincorporated towns; their commute and costs swing with what the city decides, and they pay a city parking levy that city inspectors enforce against their cars. The city's stormwater rules also determine whether a township 40 km downstream floods, and those residents never enter the city at all.
  - A county of 90,000 votes to host a hazardous waste repository with a 150 year design life. Nearby counties, a town across a nearby border, and people not yet born all have big stakes; nobody outside the county is subject to the county's coercion.
  - A large trade bloc sets a product safety and data standard for its internal market, and because of the market's size it becomes the de facto global standard, so a factory worker in a country outside the bloc has her working conditions set by a rule that in no sense applies to her.
  - A tourist on a nine day visit is fully subject to local law, including fines and arrest, and is barely affected by anything the city decides; separately, someone held in pre trial detention for eighteen months and then released without charge.
  - A homeowner in a one industry town whose house would sell for less than it would cost to move. She can leave, but only at ruinous cost, and she says therefore she cannot.
  - The same question, say water abstraction, could be decided by a city, a river basin authority, a state, or a treaty body, and everyone agrees the answer matters more than who counts as a member. Also: if membership follows affectedness, then someone with thin stakes in lots of places belongs to every demos at once, and I want to know whether that is a problem or just how it goes.

  One more thing I keep wondering about and want you to take a position on: maybe the disagreement is not really about inclusion at all but about weight. If you let the size of someone's stake set their voting weight instead of setting the boundary, does either principle secretly push you toward that, and does the fight dissolve or just move? I have been calling it the graduated demos fallback.

  End with a short section on what would actually move this debate, where each side writes down what would count as evidence against its own view, and tell me straight if you think part of the year-long argument was about words. For style: my friends are not writing a paper, one of them keeps saying the other's view is just a sticker for whoever has power, and the other keeps saying the affected view is unworkable because affectedness is infinite — feel free to say when one of them is being unfair. Format it however makes it usable: numbered agreed claims, then the disagreements table, then the cruxes with their cases and predictions.
reasoning: |-
  Here's a thinking process that leads to the suggested draft:

  1.  **Analyze the Request:**

      *   **Task:** Write a draft document for an adversarial collaboration between two friends debating the "Boundary Problem" in democratic theory (All-Affected Interests Principle vs. All-Subjected Principle).
      *   **Role:** Neutral drafter/facilitator (though the prompt asks me to "take a position" on one specific question at the end).
      *   **Tone:** Professional, precise, usable for debate, slightly informal but rigorous (friends, not a journal submission), willing to call out unfair characterizations.
      *   **Structure:**
          1.  Numbered Agreed Claims (with caveats where agreement is only apparent).
          2.  Disagreements Table (dual wording, flagged verbal disputes).
          3.  Cruxes (sub-questions that would move the needle).
          4.  Test Cases (concrete, non-textbook, with pre-registered predictions).
          5.  The "Graduated Demos Fallback" (my position on voting weight vs. boundary).
          6.  Falsification Conditions & Meta-Commentary (what would change their minds, was it just words?).

  2.  **Deconstruct the Content Requirements:**

      *   **Agreed Claims:** Needs to include specific points mentioned (boundary vs. rule, easy cases, circularity, level of government, binary vote vs. degrees of stakes). Needs to add plausible ones and flag false agreements.
      *   **Disagreements Table:** Needs dual phrasing (Affected-friendly vs. Subjected-friendly). Needs to flag verbal disputes.
      *   **Cruxes:** Needs to cover currency (coercion vs. stakes), scope (decision vs. package), threshold (slight affectedness), nature (legitimacy vs. justice), timing (future/exit).
      *   **Test Cases:** Needs to refine the user's rough ideas into concrete scenarios that isolate specific variables.
          *   *Commuters/Downstream:* Tests affectedness without subjection.
          *   *Hazardous Waste:* Tests future generations/externalities.
          *   *Trade Bloc:* Tests de facto coercion/affectedness across borders.
          *   *Tourist vs. Detainee:* Tests subjection without affectedness (and duration).
          *   *Lock-in/Homeowner:* Tests exit costs.
          *   *Level/Overlap:* Tests the "every demos" problem.
      *   **Graduated Demos:** I need to take a position on whether shifting to weighted voting dissolves the fight.
      *   **Falsification:** What evidence would count against each view?
      *   **Meta:** Was this just a verbal dispute?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound like a working document. "Draft Framework for Adversarial Collaboration: The Boundary Problem."
      *   **Section 1: Agreed Claims.**
          *   *Claim 1 (Function):* Boundary principles determine *input*, not *outcome*. (Agreed).
          *   *Claim 2 (Easy Cases):* Residents/Children are easy. Margins are hard. (Agreed).
          *   *Claim 3 (Circularity):* You need to know what the "decision" is before knowing who is affected/subjected. (Agreed, this is the "constitutive" problem).
          *   *Claim 4 (Level):* Neither principle solves the *level* problem (subsidiarity). (Agreed).
          *   *Claim 5 (Binary vs. Degrees):* Votes are yes/no; stakes are continuous. (Agreed).
          *   *False Agreement:* "Coercion is bad." One might think coercion is legitimate if authorized, the other might think coercion is the trigger for rights. Need to be careful here. Let's stick to the prompt's suggestions.
      *   **Section 2: Disagreements Table.**
          *   *Core Disagreement:* The trigger for inclusion.
          *   *Wording:* Affected side says "Interests impacted." Subjected side says "Coercive laws binding."
          *   *Verbal Dispute:* Is "coercion" just a subset of "affectedness"? Or is "affectedness" just a subset of "coercion"? Need to flag if they are defining terms differently.
      *   **Section 3: Cruxes.**
          *   *Currency:* Coercion vs. Welfare/Interest.
          *   *Scope:* Specific Decision vs. Structural Membership.
          *   *Threshold:* De minimis affectedness.
          *   *Normative Force:* Legitimacy (void) vs. Justice (unfair but valid).
          *   *Time:* Future people/Exit costs.
      *   **Section 4: Test Cases (Refining the User's Ideas).**
          *   *Case 1 (The Commuter/Downstream):* Split this. Commuters (affected + some coercion via parking) vs. Downstream (affected + no coercion/entry).
          *   *Case 2 (The Waste Repository):* Focus on future generations (affected but not existent/subjected).
          *   *Case 3 (The Brussels Effect):* Trade standards. Affected heavily, subjected legally? No.
          *   *Case 4 (The Tourist vs. Detainee):* Short-term subjection vs. Long-term subjection without vote.
          *   *Case 5 (The Locked-In Homeowner):* Exit costs as de facto subjection.
          *   *Case 6 (The Overlap):* Water authority vs. City. Tests the "infinite demos" claim.
      *   **Section 5: The Graduated Demos Fallback.**
          *   *My Position:* I need to argue whether this dissolves the fight. My take: It moves the fight but doesn't dissolve it. Weighted voting creates administrative nightmares and still requires a boundary for *who gets weight*. It shifts from "In/Out" to "How Much," but the "Who" question remains.
      *   **Section 6: Falsification & Meta.**
          *   *Affected Falsification:* If we find a case where affected people *shouldn't* vote (e.g., malicious interference).
          *   *Subjected Falsification:* If we find a case where subjected people *shouldn't* vote (e.g., short-term tourists) OR where non-subjected *must* vote.
          *   *Meta:* Yes, partly verbal. "Coercion" is being stretched by one side, "Affected" is being stretched by the other.

  4.  **Refining and Polishing:**

      *   *Tone Check:* Ensure it doesn't sound like an academic paper. Use clear headings.
      *   *Constraint Check:* Did I include the specific agreed claims requested? Yes. Did I use the specific cases (refined)? Yes. Did I take a position on the weighted voting? Yes.
      *   *Fairness:* Ensure the "Subjected" friend isn't painted as a tyrant and the "Affected" friend isn't painted as a utopian.
      *   *Specific Instruction:* "Where a claimed agreement is only apparent, say so and say why." I need to make sure I highlight the "Circularity" point carefully—it's often a point of contention disguised as agreement.
      *   *Specific Instruction:* "If you think a row is really just a verbal dispute... flag it as such." I will add a column or note for this.
      *   *Specific Instruction:* "Tell me straight if you think part of the year-long argument was about words." I will address this in the conclusion.

  5.  **Self-Correction during Drafting:**
      *   *Critique:* The user's case list is a bit mixed. The "Commuter" case mixes parking (coercion) with zoning (affectedness). I need to separate these to make the predictions clear.
      *   *Critique:* The "Graduated Demos" section needs to be distinct. I'll put it before the Falsification section.
      *   *Critique:* Make sure the "Predictions" in the test cases are specific. Not just "Side A wins," but "Side A says X is included/excluded."
      *   *Critique:* The prompt asks me to "take a position" on the graduated demos. I should do this clearly, not hedging too much.

  6.  **Final Review against constraints:**
      *   Numbered agreed claims? Yes.
      *   Disagreements table (dual wording)? Yes.
      *   Cruxes? Yes.
      *   Cases with predictions? Yes.
      *   Graduated Demos position? Yes.
      *   Falsification/Meta? Yes.
      *   Style: Usable draft, calling out unfairness. Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **DRAFT FOR REVIEW: Framework for Adversarial Collaboration on the Boundary Problem**

  **To:** [Friend A] & [Friend B]
  **From:** [Your Name]
  **Date:** October 26, 2023
  **Subject:** Draft Structure for Boundary Principle Debate

  You asked me to stop you two from talking past each other. Below is a working draft. I have tried to steelman both positions while flagging where I suspect you are fighting over definitions rather than substance. Please treat this as a living document; the goal is not to sign it today, but to identify exactly where the signature is withheld.

  ***

  ### 1. Agreed Claims (Provisional)

  *The following statements are drafted for joint signature. Where agreement is only apparent, a note follows.*

  1.  **Function of the Principle:** A boundary principle determines who has a *claim to input* (a say), not necessarily who wins the decision or who holds final sovereignty.
  2.  **The Easy Cases:** Both principles yield the same results for paradigmatic cases: long-term legal residents should vote; small children should be represented by trustees; transient passersby generally should not. The disagreement concerns the margins.
  3.  **The Circularity Constraint:** Both sides acknowledge a prior logical step is required: one must define *what* the decision is and *which body* is making it before determining who is affected or subjected. Neither principle solves the "constitutive problem" (who decides the unit) on its own.
      *   *Note on Apparent Agreement:* [Friend B/Subjected] tends to treat the "body making the decision" as a pre-existing legal fact. [Friend A/Affected] tends to treat it as a functional reality. If the "body" is defined legally, Subjected wins by default. If defined functionally, Affected wins by default. You need to agree on what counts as a "decision-making body."
  4.  **Level of Government:** Neither principle, by itself, dictates the *level* of government (city vs. state vs. supranational) that should handle a specific issue (e.g., pollution). A separate principle of subsidiarity or jurisdiction is required.
  5.  **Binary vs. Continuous:** Voting is binary (yes/no/in or out), while stakes (affectedness) and coercion (duration/intensity) come in degrees. Both sides agree a threshold is required to convert a continuous variable into a binary right, though they disagree on where that threshold lies.
  6.  **Normative Goal:** Both sides aim to prevent arbitrary exclusion. You disagree on what makes exclusion arbitrary (lack of consent to coercion vs. neglect of welfare interests).

  ***

  ### 2. Disagreements Register

  *Each row represents a single point of contention. Column A is phrased so the All-Affected proponent can endorse it as accurate to their view. Column B is phrased for the All-Subjected proponent. I have flagged rows that look like verbal disputes.*

  | Topic | Phrasing for All-Affected Interests (AAI) | Phrasing for All-Subjected Coercion (ASC) | Facilitator Note |
  | :--- | :--- | :--- | :--- |
  | **The Trigger** | Inclusion is required when a decision causally impacts a person's welfare interests, regardless of legal status. | Inclusion is required when a person is bound by the enforceable laws of a polity, regardless of welfare impact. | **Substantive.** One looks at consequences, the other at authority. |
  | **The "Stake"** | Any causal impact on interests counts, though the *weight* of the claim may vary with the intensity of the impact. | Only impacts mediated through the legal/coercive structure count; mere causal ripple effects do not generate claims. | **Verbal Risk.** ASC calls causal ripples "externalities," AAI calls them "interests." You need to define "relevant impact." |
  | **Legitimacy** | If a significantly affected party is excluded, the decision lacks moral legitimacy and creates no obligation to obey. | If a subjected party is excluded, the regime is tyrannical. If an affected-but-unsubjected party is excluded, the regime is merely imperfect. | **Substantive.** AAI ties legitimacy to outcomes; ASC ties it to procedure/status. |
  | **Scope** | The demos should be fluid, reconstituting for every distinct decision based on who is affected by *that* decision. | The demos should be stable, constituting a political community that subjects its members to a *system* of laws over time. | **Substantive.** Fluidity vs. Stability. |
  | **Exit Costs** | If exit is prohibitively costly, a person is effectively subjected to the regime and should be included, even if legally exempt. | If a person is not legally bound, exit costs are economic, not political. Coercion is a legal status, not an economic circumstance. | **Substantive.** Is "ruinous cost" a form of coercion? |

  ***

  ### 3. The Cruxes

  *These are the sub-questions where settling the answer would force one or both of you to shift your position.*

  1.  **Currency:** Is the fundamental wrong being corrected *harm to interests* (AAI) or *imposition of will* (ASC)?
  2.  **Unit of Analysis:** Do we evaluate inclusion based on a *single decision* (e.g., this zoning vote) or the *package of governance* (e.g., membership in the city)?
  3.  **The Threshold:** Does a vanishingly small affectedness (e.g., a 0.0001% price change) generate a *pro tanto* claim to a vote? If yes, does AAI collapse into "everyone votes everywhere"?
  4.  **Nature of Obligation:** Is the problem that the *outcome* is unjust if the wrong people vote (AAI), or that the *process* is unauthorized if the wrong people vote (ASC)?
  5.  **Time:** Do future people (affected but not existent) or past people (subjected but dead) count? Does the duration of subjection matter (tourist vs. resident)?

  ***

  ### 4. Test Cases & Prediction Register

  *These cases are designed to isolate specific variables. Please write your specific prediction (Include/Exclude/Weight) in the blanks before discussing the outcome.*

  **Case 1: The Commuter & The Downstream Neighbor**
  *Scenario:* City A (pop. 380k) votes on zoning/transit. 70k commuters enter daily from Town B (unincorporated). Commuters pay a parking levy enforced by City inspectors. Separately, City A's stormwater rules determine flood risk for Town C (40km downstream). Town C residents never enter City A and pay no levies.
  *   **Variable:** Separates Coercion (Commuters) from Pure Affectedness (Downstream).
  *   **AAI Prediction:** Commuters: \_\_\_\_\_\_ | Downstream: \_\_\_\_\_\_
  *   **ASC Prediction:** Commuters: \_\_\_\_\_\_ | Downstream: \_\_\_\_\_\_
  *   *Facilitator Note:* If ASC includes Commuters due to parking fines, does that mean any fine creates membership? If AAI excludes Downstream, at what distance does affectedness vanish?

  **Case 2: The 150-Year Repository**
  *Scenario:* County X votes to host hazardous waste. Design life: 150 years. Nearby counties and a border town face health risks. Future generations (born 50+ years from now) face the highest risk. No one outside County X is subject to County X's coercion.
  *   **Variable:** Future People & Externalities.
  *   **AAI Prediction:** Nearby Counties: \_\_\_\_\_\_ | Future Generations: \_\_\_\_\_\_
  *   **ASC Prediction:** Nearby Counties: \_\_\_\_\_\_ | Future Generations: \_\_\_\_\_\_
  *   *Facilitator Note:* ASC usually excludes future people (cannot be subjected). AAI usually includes them (highly affected). If AAI includes them, *who* votes on their behalf?

  **Case 3: The De Facto Standard (The "Brussels Effect")**
  *Scenario:* A large Trade Bloc sets a data privacy standard. Because the market is huge, a factory worker in a non-member country must adopt this standard to sell goods. Her working conditions change. She is not subject to the Bloc's laws, fines, or police.
  *   **Variable:** Economic Coercion vs. Legal Subjection.
  *   **AAI Prediction:** Worker Included? \_\_\_\_\_\_
  *   **ASC Prediction:** Worker Included? \_\_\_\_\_\_
  *   *Facilitator Note:* If AAI says yes, does every major economy owe votes to the whole world? If ASC says no, is "market coercion" irrelevant to democracy?

  **Case 4: The Tourist vs. The Detainee**
  *Scenario:* Person T is a tourist for 9 days. Fully subject to local law (arrest/fines). Barely affected by long-term policy. Person D is held in pre-trial detention for 18 months, then released without charge. D was subject to prison rules but not the voting laws.
  *   **Variable:** Duration and Intensity of Subjection.
  *   **AAI Prediction:** T Included? \_\_\_\_\_\_ | D Included? \_\_\_\_\_\_
  *   **ASC Prediction:** T Included? \_\_\_\_\_\_ | D Included? \_\_\_\_\_\_
  *   *Facilitator Note:* ASC risks including tourists. AAI risks excluding detainees (low stake in policy). Does duration matter for ASC?

  **Case 5: The Locked-In Homeowner**
  *Scenario:* A homeowner in a one-industry town. The industry leaves. House value < cost to move. She *can* leave physically, but at ruinous financial cost. She claims she is "forced" to stay and thus should vote, though she is a legal resident already. (Variation: She is a *non-resident* owner in this position).
  *   **Variable:** Exit Costs as Coercion.
  *   **AAI Prediction:** Non-resident owner Included? \_\_\_\_\_\_
  *   **ASC Prediction:** Non-resident owner Included? \_\_\_\_\_\_
  *   *Facilitator Note:* If ASC says no, does it ignore economic coercion? If AAI says yes, does property ownership grant votes (plural voting)?

  **Case 6: The Overlap (Water Authority)**
  *Scenario:* A water abstraction issue could be decided by the City, the River Basin Authority, the State, or a Treaty Body. Everyone agrees the *answer* matters more than the *voter list*. If membership follows affectedness, a farmer belongs to the City demos, the Basin demos, and the State demos simultaneously.
  *   **Variable:** Multiple Memberships.
  *   **AAI Prediction:** Is multiple membership a bug or a feature? \_\_\_\_\_\_
  *   **ASC Prediction:** Is multiple membership a bug or a feature? \_\_\_\_\_\_
  *   *Facilitator Note:* AAI often accepts "unbounded demos." ASC requires a single sovereign. Is the "infinite demos" objection a reductio or just complex administration?

  ***

  ### 5. The "Graduated Demos" Fallback (Facilitator Position)

  You asked me to take a position on whether shifting from a **Boundary Question** (In/Out) to a **Weight Question** (How much vote) dissolves the fight.

  **My Position:** It moves the fight; it does not dissolve it.

  Here is why: Both of you are implicitly arguing for a binary threshold because you assume a binary vote. If we move to weighted voting (e.g., downstream neighbors get 0.4 votes, residents get 1.0 vote), the **All-Affected** friend is happier because it solves the "degrees of stakes" problem. However, the **All-Subjected** friend will correctly point out that you still need a *boundary* to determine who gets *any* weight at all. Does the person 1000km downstream get 0.0001 votes? If yes, we are back to the "everyone votes everywhere" administrative nightmare. If no, we are back to drawing a line.

  Furthermore, weighted voting destroys the "one person, one vote" equality that both of you likely value in other contexts. It turns the demos into a shareholder meeting.

  **Verdict:** Adopting weighted voting helps the All-Affected view handle the "margins" problem, but it forces the All-Subjected view to concede that coercion isn't the only thing that matters. It doesn't end the argument; it just makes the trade-off explicit. I recommend you *do not* use this as a fallback until you have settled the binary boundary.

  ***

  ### 6. Falsification & Meta-Commentary

  **What would count as evidence against your view?**

  *   **For All-Affected (Friend A):** You must identify a case where a person is *significantly affected* by a decision but where it would be *obviously wrong* to give them a vote.
      *   *Suggestion:* A foreign adversary whose economy is harmed by your country's defense policy. They are affected. Do they get a say in your missile deployment? If you say "No," you have admitted a boundary exists beyond affectedness.
  *   **For All-Subjected (Friend B):** You must identify a case where a person is *subject to coercion* but where it would be *obviously wrong* to give them a vote, OR where a person is *not subjected* but *must* vote.
      *   *Suggestion:* The 9-day Tourist. They are subject to arrest. If you say they should vote, you accept a highly fluid demos. If you say they shouldn't, you admit that duration/type of subjection matters, which weakens the "coercion is the trigger" claim.

  **Meta-Commentary: Was this just words?**

  Yes, partially. And you need to stop pretending it isn't.

  1.  **Friend B (Subjected):** You are being unfair when you call the Affected view "a sticker for whoever has power." That's a straw man. The Affected view is trying to account for *power* that isn't legal (like economic dominance). However, you are right that "affectedness" is often infinite. If you cannot define a *cutoff* for relevant effects, your view is unworkable.
  2.  **Friend A (Affected):** You are being unfair when you call the Subjected view "legalistic formalism." Coercion matters because it restricts autonomy. However, you are hiding behind the word "interests." If my interest in your zoning decision is that it makes my commute 2 minutes longer, is that a democratic claim? If you say yes, you are arguing for global democracy without admitting it.

  **The Real Disagreement:**
  It is not about words. It is about **Risk**.
  *   **Friend A** fears the risk of **Tyranny** (people being ruled by those who don't care about their welfare).
  *   **Friend B** fears the risk of **Instability** (a demos that cannot define itself, leading to no decision being possible).

  You are prioritizing different political goods. Acknowledge that. If you prioritize stability, Subjected wins. If you prioritize welfare protection, Affected wins. Stop trying to prove the other is logically incoherent; they aren't. They just value different things.

  ***

  **Next Steps:**
  1.  Fill in the Prediction Register individually.
  2.  Swap sheets.
  3.  Discuss only the rows where predictions differ.
  4.  Come back to me when you've agreed on what counts as "Coercion" vs. "Causal Impact."
