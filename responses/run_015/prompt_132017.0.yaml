answer: |-
  ### Brainstorming & Setup

  Look, 15 minutes for 4-5 proposals means you have roughly 3 minutes per decision. You cannot optimize. You cannot call references, check Yelp reviews, or debate utilitarian ethics. You need a heuristic—a mental shortcut that works *most* of the time without burning you out.

  Here's the philosophy we're using: **Herbert Simon's "Scissors."** Rationality isn't just about making the perfect choice; it's about the fit between your brain's limits and the environment's demands. If the environment is chaotic (quick proposals, little info), trying to be perfect is irrational. You need to **satisfice**—pick the first option that clears a "good enough" bar.

  **The Twist:** That bar isn't static. If checking the details takes too long (search cost), you lower the bar *unless* it hits the **Participation Floor**. The Floor is non-negotiable (safety, ethics, legality). Everything else (impact, fun, resume boost) is negotiable based on how much time you have.

  **The Handoff:** The checklist handles facts and risks. It cannot handle values (e.g., "Is school loyalty more important than community service?"). When those clash, the procedure stops and dumps it on your lap.

  **The Hateable Outcome:** This procedure is cold. It will tell you to kill projects that feel "good" but are logistically inefficient. You're going to hate turning away willing volunteers, but that's the cost of bounded rationality.

  ***

  ### The "Simon Scissors" Checklist (3-Minute Version)

  **Time Budget:** 3 Minutes Max per Proposal.
  **Goal:** Yes, No, or Handoff.

  #### Step 1: The Participation Floor (Hard Stop)
  *Check these first. If any fail, it's an immediate **NO**. Do not pass Go.*
  *   **Safety:** Are adults supervised? Is there insurance/liability coverage? (If "sketchy" or unknown → Fail).
  *   **Ethics:** Does this exploit the people being served? (e.g., "poverty tourism").
  *   **Legality:** Is this legal for minors? (No alcohol, no hazardous machinery).
  *   **Capacity:** Do we physically have the bodies? (If signed up < minimum required to function → Fail).

  #### Step 2: The Search Cost Check
  *How much time does it take to verify the "maybe" stuff?*
  *   **Low Cost:** Info is in the email, website is clear, contact is responsive.
  *   **High Cost:** Need to make calls, dig for info, negotiate numbers.
  *   **Rule:** If Search Cost > 2 minutes, **stop searching**. You must decide with current info.

  #### Step 3: Dynamic Aspiration Adjustment
  *Set your "Good Enough" bar based on Step 2.*
  *   **If Search Cost was Low:** Aspiration is **High**. (Needs clear impact, good logistics, high student interest).
  *   **If Search Cost was High:** Aspiration is **Low**. (Accept lower impact, messier logistics, *but* must still pass Step 1).
  *   **The Trap:** Do not lower the bar so much that you accept useless work. If the org needs 10 people and you have 6, and you can't verify if 6 works (High Search Cost), you must assume 6 is **not enough**.

  #### Step 4: The Satisfice Decision
  *Does the proposal meet the Adjusted Aspiration?*
  *   **Yes:** Mark **APPROVE**.
  *   **No:** Mark **REJECT**. (Do not "Hold" unless waiting for one specific fact).

  #### Step 5: The Values Flag (The Handoff)
  *Even if it passes Steps 1-4, does it conflict with external values?*
  *   **School Policy:** Conflicts with exams, mandatory events, or admin rules?
  *   **Board Mission:** Does this align with *our* specific goals, or is it just random?
  *   **Rule:** If Yes → **HANDOFF TO CO-CHAIR**. Do not vote. This is a political/ethical call, not a fact call.

  ***

  ### The Test Run

  Here's how this plays out on your Tuesday proposals. Clock is ticking.

  #### Case 1: Tutoring at a Shelter (Sketchy Supervision)
  *   **Step 1 (Floor):** Safety/Supervision is "sketchy/unknown." We don't know who is watching the kids.
  *   **Result:** **HARD NO.**
  *   **Why:** Hits the Participation Floor. No amount of impact justifies liability or student safety risk.
  *   **Time Taken:** 30 seconds.

  #### Case 2: Food Drive (Needs 10, Only 6 Signed Up)
  *   **Step 1 (Floor):** Capacity check. Org says "Needs 10." We have 6.
  *   **Step 2 (Search Cost):** To find out if 6 is okay, we need to call the organizer. That's a phone tag game. Time cost > 2 mins. **High Search Cost.**
  *   **Step 3 (Aspiration):** Because Search Cost is High, we lower aspirations *but* we can't verify the gap. The rule says: If stated need > signed up and verification is too costly, assume failure.
  *   **Step 4 (Decision):** **REJECT.**
  *   **Why You'll Hate This:** You have 6 kids ready to work. Turning them away feels lazy and mean. But the procedure says the cost to recruit 4 more or verify the gap outweighs the marginal gain of 6 people doing a job designed for 10. It's inefficient.
  *   **Time Taken:** 2 minutes.

  #### Case 3: Beach Cleanup (Ticks Boxes, Conflicts with School Event)
  *   **Step 1 (Floor):** Safety? Yes. Ethics? Yes. Capacity? Yes. **Pass.**
  *   **Step 2 (Search Cost):** Info is clear. **Low Cost.**
  *   **Step 3 (Aspiration):** Aspiration stays **High**.
  *   **Step 4 (Decision):** Meets all boxes. Looks like an **APPROVE**.
  *   **Step 5 (Values Flag):** Conflicts with mandatory school event.
  *   **Result:** **HANDOFF TO CO-CHAIR.**
  *   **Why:** The checklist sees a perfect service opportunity. It doesn't care about your Principal's feelings. This is a values call: Service vs. School Loyalty. You have to make this one manually.
  *   **Time Taken:** 2 minutes.

  ***

  ### Where This Procedure Will Misfire (The Limitations)

  Be honest: this tool isn't magic. It's a heuristic, and heuristics have blind spots.

  1.  **The "Peer Pressure" Floor Shift:**
      The Participation Floor is supposed to be solid. But if every other school board is approving the "sketchy tutoring" gig, your board will feel pressure to lower the safety floor to "keep up." The procedure can't stop social pressure. You have to enforce the floor manually.

  2.  **The "Sunk Cost" Trap:**
      In the Food Drive case, if you've already spent 5 hours promoting it, the procedure says "Reject" because future costs are too high. Your board will scream "But we already did the work!" The procedure ignores past effort. You'll have to manage the fallout of telling students their promo work was wasted.

  3.  **The Values Blind Spot:**
      Look at the Beach Cleanup. The procedure flagged it, but only because *you* told it to look for school conflicts. If a proposal conflicts with a *personal* value (e.g., a political org you disagree with), the checklist won't catch it unless you add it to Step 5. It treats all "service" as equal unless you intervene.

  4.  **Emotional Fatigue:**
      Saying "No" five times in a row feels terrible. After week 3, your board will start skimming Step 1 (The Floor) because they just want to say Yes to something. The procedure relies on discipline. If you're tired, you'll bypass the Safety Check.

  ### Final Word
  This system is designed to protect your time and your students' safety, not to maximize "good vibes." It will feel cold. It will tell you to kill projects that feel meaningful but are logistically broken. That's the point. You're the Co-Chair, not the Cheerleader. Use the checklist to take the heat off ("The protocol said no"), but keep your hand on the Values Handoff. That's where your actual leadership lives.
