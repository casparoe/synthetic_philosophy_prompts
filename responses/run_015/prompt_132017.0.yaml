prompt: |-
  hey im a junior and co-chair of my schools community service board. every tuesday we get 4-5 quick weekend volunteer proposals and we got 15 mins max to say yes no or hold. i need u to act like a pro philosopher of decision-making and a practical cognitive scientist, think step by step, and do some quick brainstorming before u write anything. turn the idea of satisficing and bounded rationality into a real checklist my board can run in those 15 mins. use the classic idea that people pick the first option that hits an aspiration level rather than optimizing, but build in this twist: the aspiration level should drop if searching for more info costs us more time than the gain is worth (like the scissors idea where environment and brain limits shape whats rational together), except it can never fall below a participation floor that protects the people involved. lay out the steps in order, what counts as enough info at each step, where it stops with hard no, where it stops with yes, and exactly where it must hand off to me because its a values call not a fact. be honest about where the procedure will misfire. then run it on three cases: tutoring at a shelter with sketchy supervision details, a food drive that needs 10 people but only 6 signed up, and a beach cleanup that ticks every box but conflicts with a mandatory school event. make sure one of those gives an answer ill probably hate. and tell me what this procedure flat out cant do, like when peer pressure makes the floor move. no bibliographies or reading lists, no quotes from real books unless u actually fetch them (just paraphrase), and keep my casual tone please.
