          1.  Numbered list of Agreed Claims (substantive).
          2.  Disagreements Table (Crux, Camp A view, Camp B view, Shared Bearing/Consideration, Camp A Prediction, Camp B Prediction). Must include specific variants (Meter, Bond, Ledger, Leaky Installation).
