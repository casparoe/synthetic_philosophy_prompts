      *   *Claim 4:* The solution must allow the hitchhiker to retain enough agency to be praised/blamed for paying (it's a moral/practical virtue, not just physics).
      *   *Claim 5:* Instrumental rationality aims at maximizing the hitchhiker's expected utility over the whole episode (ride + payment).
      *   *Refinement:* Ensure these bite. Claim 3 needs to be about "responsiveness to reasons." If she is *too* rigid, the driver might worry she's a robot, but usually, the agreement is that *some* change in state is needed. Let's focus on the insufficiency of "naked intention."

  4.  **Drafting Section 2: Disagreements Table:**

      *   *Crux 1: Nature of the Load-Bearing State.*
          *   A: It must be a high credence (belief) that payment will occur.
          *   B: It must be a stable disposition/policy; belief is a byproduct.
          *   *Bearing (a) The Meter:* If the meter reads credence.
          *   A: Meter must read high.
          *   B: Meter reading is irrelevant; driver checks disposition history.
      *   *Crux 2: Self-Installation and Transparency.*
          *   A: Knowing you installed the belief doesn't defeat it if the installation is robust.
          *   B: Knowing you installed it against evidence defeats the status of "belief."
          *   *Bearing (d) Leaky Installation:* Cost of side effects.
      *   *Crux 3: Normative Authority.*
          *   A: Instrumental norms override evidential norms.
          *   B: Evidential norms are constitutive of belief; you can't override them without losing belief.
          *   *Bearing (c) The Ledger:* Reputation vs. Internal State.
      *   *Crux 4: Temporal Scope of Rationality.*
          *   A: Assessed over the whole timeline (ex-ante).
          *   B: Assessed at every time-slice (ex-post consistency).
          *   *Bearing (b) The Bond:* External vs. Internal commitment.

      *   *Refining Predictions:* Need to be falsifiable.
          *   Meter: If meter reads <50%, A says deal fails. B says deal succeeds if policy is solid.
