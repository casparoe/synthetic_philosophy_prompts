  5.  **Drafting Section 3: Verbal vs. Substantive:**

      *   *Verbal:* What we call "belief." If A calls it "acceptance" and B calls it "belief," do they agree on the mental state?
      *   *Substantive:* Can you *reasonably* hold a proposition true when evidence says false? Is the mind modular enough to compartmentalize?
      *   *Key Distinction:* Whether the cognitive architecture allows "belief" to be decoupled from "truth-tracking."

  6.  **Drafting Section 4: Confidence Note:**

      *   Need to assign probabilities.
      *   Identify the weakest link. Probably the "Meter" scenario, as it assumes technology that reads credence without reading disposition, which might be conceptually impossible (functionalism).

  7.  **Review and Refine (Self-Correction against User Constraints):**

      *   *Constraint Check:* "Intolerance of disputes that never reach the point where you write down, in advance, what result would count against you." -> Ensure predictions in the table are sharp.
