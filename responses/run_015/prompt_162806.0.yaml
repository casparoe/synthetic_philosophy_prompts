      *   **Tone:** Precise, rigorous, scientific/philosophical hybrid, respecting the user's background.

  2.  **Deconstruct the Philosophy (Parfit's Hitchhiker):**

      *   *The Case:* Hitchhiker stranded. Driver offers ride *iff* hitchhiker will pay upon arrival. Once in town, hitchhiker has no incentive to pay (costly, no enforcement). Driver knows this. Driver needs to know *at the roadside* that payment will happen.
      *   *The Problem:* Standard decision theory (causal) says don't pay once in town. So a rational agent won't promise. So the driver won't pick up. The agent dies/stays stranded.
      *   *The Twist:* To get picked up, the agent needs to be the *kind of person* who pays, or *believe* they will pay, even though paying is irrational at the moment of payment.
      *   *Camp A (Kavka/Parfit-ish):* You can rationally cultivate a disposition or belief that leads to irrational actions later if the *overall* outcome is better. "Rational Irrationality."
      *   *Camp B (Gauthier/Standard Evidentialist):* You can't believe against evidence. You solve this via constrained maximization, policy selection, or pre-commitment, not by corrupting belief formation. The driver responds to *reliability*, not necessarily *credence*.

  3.  **Drafting Section 1: Agreed Claims:**

