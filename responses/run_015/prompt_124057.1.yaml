  The hospital ethics board votes on draining a "Future Care Trust" to purchase immediate emergency ventilators. The Trust holds prepayments from staff contracts guaranteeing their own geriatric treatment. Dr. Aris, 35, contributed significantly, securing her care at 70. Draining the fund saves 20 current patients and stabilizes Aris's current employment, providing immediate security and colleague survival, but voids her future contract. Aris at 35 receives the benefit of job security and saved colleagues; Aris at 70 bears the cost of denied treatment. The institutional promise binds these two life-stages into a single contractual arc, forcing the board to weigh present survival against future obligation within one biography. Without the contract, it is simple resource allocation; with it, the sacrifice crosses time within a single claimed identity, complicating the count.

  Utilitarian verdict and why
  Classical utilitarianism aggregates utility across all affected parties, including temporal stages. Here, the sum of 20 lives saved plus Aris's current job security outweighs the disutility of one future surgery denied. Because the benefit and cost fall within one life, the utilitarian sees this as rational prudence scaled up: maximizing the total net welfare of the "Aris-continuum" alongside the community. The diachronic link simplifies the math; it is merely shifting utility from later to earlier in the same account. The right action maximizes the total sum, regardless of temporal distribution. Verdict: Approve the drain.

  Separateness objection verdict and why
  The separateness-of-persons objection argues that distinct claims cannot be overridden by aggregate gain. Here, it treats Aris-at-70 as a distinct moral claimant from Aris-at-35. The contract creates a right that cannot be violated even for net gain. Sacrificing the future self's guaranteed care violates the integrity of the person over time, treating the future stage as a mere resource for the present. The board cannot breach the promise simply because the beneficiary and victim share a name; rights bind the institution to the future person specifically. Verdict: Reject the drain.

  The feature actually doing the work
  The diachronic binding via the contract is the engine. It forces the question: does personal identity over time dissolve the separateness objection? If the stages are one person, sacrifice looks like prudence. If they are distinct moral moments, it looks like violation. The contract institutionalizes the link, making the identity claim concrete rather than metaphysical. It tests whether moral boundaries stop at the skin or extend through time.

  How a utilitarian defender attacks teh case
  A defender argues that personal identity justifies the trade-off. Since Aris-at-70 is Aris-at-35, the loss is internal to the same life. Utilitarianism respects the unity of a life; shifting welfare across time is permissible if total welfare rises. The contract is just a tool for maximizing lifetime utility, not a sacred vow. If the total life goes better with the ventilators, the breach is morally neutral. Identity collapses the distinction.

  Bottom line
  This case reveals whether we count moral claims by bodies or by moments. If identity matters, the utilitarian wins. If rights attach to time-slices, the objection holds. The blindspot is whether "counting people" includes counting the same person twice across time.

  If you remove the diachronic link, the case reverts to standard aggregation: sacrificing one distinct person for many. The Separateness Objection becomes straightforward (rights violation). With the link, the objection must argue that time-slices are morally separate persons, challenging our intuition about identity. The link turns a resource problem into an identity problem.
