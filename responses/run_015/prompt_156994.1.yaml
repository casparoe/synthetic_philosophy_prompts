      *   **Phenomenon:** Two spots of different colors (e.g., red and green) flash in succession at different locations. Observers see motion between them and often see the color change *mid-stream*.
      *   **The Puzzle:** How does the brain know to change the color in the middle *before* the second spot flashes?
      *   **Stalinesque:** The brain waits for the second stimulus, constructs the narrative, and then presents the finished conscious experience (falsifying the past).
      *   **Orwellian:** The brain presents the first experience, then revises the memory of it after the second stimulus arrives (rewriting history).
      *   **Dennett's Point:** The distinction is illusory. There is no "Cartesian Theater" where experience happens at a specific time. There is only multiple drafts of narrative construction.
      *   **The User's Stance:** Seems to treat the distinction as potentially real or at least wants to know which research path resolves it.

  3.  **Evaluate the Three Research Directions:**
      *   **Option 1: Neural correlates in V1/V5.**
