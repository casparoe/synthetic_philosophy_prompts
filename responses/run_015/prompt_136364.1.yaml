  **Brainstorming: Connecting Determinism/Chaos to Institutional Ethics**

  1.  **The Epistemic Honesty Constraint:** If chaos theory holds that specific long-range states are epistemically inaccessible (even if deterministic), then signing a binding 10-year contract based on predictive models is ethically problematic. It presents a facade of knowledge where none exists. Institutional integrity requires aligning commitments with epistemic limits.
  2.  **The Magnified Responsibility Thesis:** If sensitivity to initial conditions is real (the mathematician's view), small budgetary or policy shifts now carry disproportionate causal weight in the future. This increases moral responsibility for present choices. However, this cuts both ways: it argues for careful initial conditions (supporting commitment) but also for the ability to intervene if the trajectory becomes harmful (supporting flexibility).
  3.  **The Constitutive Function of Planning:** Long-range planning may not be about accurate prediction but about stabilizing institutional identity. Even if outcomes are chaotic, the act of committing to a framework creates a coherent agent capable of responding to chaos. The ethical question is whether a rigid framework preserves agency or destroys it when the environment shifts unpredictably.

  ***

  **MEMORANDUM**

  **TO:** University Committee on Long-Range Institutional Planning
  **FROM:** Subcommittee on Governance Models and Epistemic Frameworks
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Deterministic-Chaos Governance Model

  **Bottom Line Recommendation**

  The Committee recommends **Option (c): Approve only a non-binding pilot with a hard sunset clause.**

  We propose adopting the vendor's framework on a provisional, non-binding basis through the end of 2026. A full review of the pilot's efficacy and ethical implications will be conducted by March 2027. We explicitly reject the proposal for binding 10-year contracts with humility clauses (Option a) and defer a decision on permanent adaptive rolling plans (Option b) until the pilot concludes.

  **Reasoning: Determinism, Predictability, and Commitment**

  The central philosophical question before this Committee is not whether the universe is deterministic, but whether determinism without predictability licenses institutional binding. The vendor's model rests on the claim that while campus dynamics are deterministic in principle, chaos-type amplification renders them opaque beyond an 18-month horizon. We accept this scientific premise for the sake of deliberation. The ethical dispute concerns what kind of commitment is appropriate when consequences are guaranteed but unknowable.

  **Engaging the "Amplified Moral Weight" Argument**

  We take seriously the argument presented by our committee's mathematician: that determinism combined with chaos assigns outsized causal weight to present choices. If small budgetary shifts now amplify wildly downstream, we bear a heightened moral responsibility for the initial conditions we set. This view suggests that we must commit cautiously now to prevent harmful cascades.

  However, we disagree with the inference that "cautious commitment" requires binding 10-year contracts. If the downstream effects are truly unforeseeable, locking the institution into a fixed trajectory removes our ability to correct course when unintended consequences emerge. The moral duty generated by amplified causal weight is not a duty to bind ourselves to a specific path, but a duty to maintain the agency to intervene. A binding contract, even with renegotiation clauses, creates inertia that may prevent necessary intervention during the 18-month windows. Therefore, the "amplified moral weight" argument actually supports a non-binding pilot: it allows us to set initial conditions carefully while retaining the flexibility to mitigate unforeseen amplification.

  **The Strongest Consideration on the Losing Side**

  The strongest argument against this recommendation comes from the proponents of Option (b), who advocate for immediate adoption of adaptive 18-month rolling plans without any long-range framework. Their position is epistemically consistent: if prediction is impossible past 18 months, any structure pretending to span 10 years is misleading. They argue that a pilot program still carries the risk of institutionalizing a false sense of long-range order.

  We acknowledge the force of this objection. There is a genuine risk that even a non-binding pilot creates a psychological anchor, leading administrators to treat the 10-year model as more robust than it is. However, we reject the immediate shift to pure rolling plans because institutions require some horizon of stability to function effectively. Faculty hiring, infrastructure development, and student recruitment cannot operate solely on 18-month visibility. A pilot allows us to test whether the "predictive humility clauses" can successfully decouple the psychological comfort of a long-range plan from the operational rigidity of a binding contract. Abandoning long-range modeling entirely before testing this decoupling would be a premature surrender of institutional planning tools.

  **Timeline and Implementation**

  To balance epistemic humility with operational stability, the Committee mandates the following timeline:

  1.  **Pilot Phase:** Immediate adoption of the deterministic-chaos model on a non-binding basis. No contracts extending beyond the 18-month review windows shall be executed during this period.
  2.  **Duration:** The pilot shall run through December 31, 2026.
  3.  **Review:** A comprehensive evaluation of the model's impact on decision-making quality and institutional flexibility will be completed by March 2027.
  4.  **Sunset:** If the review does not yield a unanimous recommendation for continuation, the model expires automatically, and the Committee shall revert to standard planning protocols.

  **Conclusion**

  Determinism without predictability does not support binding commitment; it undermines it. However, it does not necessarily abolish the value of long-range modeling as a tool for thinking about causal leverage. By choosing a non-binding pilot, we honor the limits of our knowledge while respecting the weight of our actions. We commit to watching the chaos, not pretending to tame it.
