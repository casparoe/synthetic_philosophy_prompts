      *   **Specific Requirement:** For each requirement, indicate if it's non-negotiable or camp-specific.
      *   **Core Tension Analysis:** Address the trilemma:
          *   (a) Derive normative force *solely* from first-order coordination preferences (no second-order attitudes).
          *   (b) Explain resistance to Pareto-improving revision (stickiness/moralization).
          *   (c) Remain faithful to Lewis (no authority/explicit rule).
          *   *Task:* Identify conflicts, state which relaxation does least damage.
      *   **Constraints:** Weight analysis on criteria/cases, briefly locate evolutionary game theory/social-norm accounts (no full scorecard).

  2.  **Drafting the Desiderata (Section 1):**

      *   *Category (i) Explanatory Coverage:*
          *   Need to explain the shift from "is" to "ought."
          *   Need to explain "moralized conventions" (e.g., queueing, dress codes becoming moral issues).
          *   Need to explain "suboptimal norms" (e.g., footbinding, inefficient standards that persist).
          *   *Status:* Non-negotiable for a theory of *norm evolution*. If it can't explain persistence or moralization, it's just a theory of equilibrium selection.
      *   *Category (ii) Conceptual Distinctions:*
          *   First-order (I expect you to do X) vs. Second-order (I expect you to *expect* me to sanction you if you don't do X). This is crucial for norms vs. mere habits.
          *   Descriptive (people do X) vs. Prescriptive (people *should* do X).
          *   *Status:* Non-negotiable. Collapsing these eliminates the phenomenon of normativity.
      *   *Category (iii) Consistency Constraints:*
          *   Lewisian: No explicit rule, no central authority.
          *   Evolutionary: Path dependence, multiple equilibria.
          *   *Status:* Non-negotiable for a *Lewisian* extension. If you add authority, it's not Lewisian anymore.
      *   *Category (iv) Exclusion Conditions:*
          *   Avoid reducing "ought" to "is" (predictive reliability).
          *   Avoid importing unreduced moral realism (needs to be naturalistic/social).
          *   *Status:* Non-negotiable for a naturalistic social ontology project.

  3.  **Analyzing the Core Tension (Section 2):**

      *   *The Trilemma:*
          *   (a) Force from first-order preferences only (Pure Lewis).
          *   (b) Resistance to Pareto improvement (Normative Stickiness/Moralization).
          *   (c) No authority/explicit rule (Lewisian Constraint).
      *   *Analysis:*
          *   Lewis's original account relies on conditional preferences: I prefer to conform *if* others conform. This is purely first-order regarding the action.
          *   If preferences are purely first-order coordination preferences, agents should switch to a Pareto-superior equilibrium if they can coordinate on it. There is no *intrinsic* cost to switching in Lewis's model other than the coordination failure itself.
          *   To explain resistance to Pareto improvement (b), there must be a cost to deviation that *isn't* just coordination failure. Usually, this is social sanction (shame, ostracism).
          *   Sanctions imply second-order attitudes (I blame you for deviating).
          *   Therefore, (a) and (b) are in direct conflict. You cannot get stickiness against Pareto improvements without second-order attitudes (sanctions/normative expectations).
          *   Does (c) conflict? Lewis allows for implicit sanctions (disapproval), but he emphasizes the *preference for conformity* based on coordination, not fear of punishment. However, strict Lewisianism often downplays punitive sanctions in favor of "preference for conformity."
          *   *The Conflict:* (a) vs (b). Pure first-order coordination preferences cannot explain why a group stays on a local maximum when a global maximum is visible and reachable, unless there is a *normative* cost to switching (betrayal, sin, shame).
          *   *Resolution:* Relax (a). We need second-order attitudes (Bicchieri, Brennan/Eriksson, etc.).
          *   *Does relaxing (a) damage Lewis?* It modifies Lewis, but Lewis himself acknowledged "normative" conventions in later work or via extensions. Relaxing (c) (adding authority) destroys the spontaneous order aspect. Relaxing (b) makes the theory unable to explain the target phenomenon (suboptimal norms).
          *   *Conclusion:* Relax (a). Introduce second-order expectations/sanctions. This moves from "Lewisian Convention" to "Social Norm" (Bicchieri style), but preserves the evolutionary/spontaneous nature (c) and explains the stickiness (b).

  4.  **Refining the Desiderata & Weighting:**

      *   Make sure to distinguish between "Non-negotiable" (constitutive of the project) and "Camp-specific" (e.g., Rational Choice vs. Constructivist).
      *   *Self-Correction on Status:* The prompt asks to indicate status for *each requirement*.
      *   *Refining the Tension:* The prompt asks if the theory can satisfy (a), (b), and (c).
          *   (a) Force from first-order preferences *without* second-order attitudes.
          *   (b) Resistance to Pareto improvement.
          *   (c) No authority.
          *   *Logic:* If I only care about coordinating (first-order), and a better coord point appears, I move. To stay put, I must care about *following the rule* or *avoiding blame*. That is second-order. So (a) and (b) are incompatible. (c) is compatible with second-order attitudes (peer sanctions aren't central authority).
          *   *Decision:* The conflict is primarily between (a) and (b).

