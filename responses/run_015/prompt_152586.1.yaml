          *   (iii) Consistency: Spontaneity, Equilibrium Selection. (Non-negotiable for Lewisian).
          *   (iv) Exclusion: Naturalistic Fallacy, Moral Realism. (Non-negotiable for Naturalism).
      *   *Section 2: The Tension.*
          *   Analyze (a), (b), (c).
          *   Show why (a) + (b) fails. (The "Pareto Problem").
          *   Show why (c) is compatible with Second-Order (Peer enforcement isn't Authority).
          *   Identify the casualty: (a).
          *   Justify: Second-order attitudes are the mechanism of "normativity" distinct from "habit."
      *   *Section 3: Locating Accounts.*
          *   Lewis (1969): Fails (b).
          *   Bicchieri (2006): Satisfies (b) & (c), relaxes (a).
          *   Evolutionary Game Theory (Skyrms/Young): Explains selection, struggles with *normative force* (ought) without adding psychological structure.

  6.  **Review against Constraints:**
      *   Did I cover all four categories? Yes.
      *   Did I indicate Non-negotiable vs. Camp-specific? Yes.
      *   Did I address the trilemma (a, b, c)? Yes.
      *   Did I identify the conflict and the relaxation? Yes.
      *   Did I avoid a full scorecard? Yes.
      *   Tone: Seminar appropriate (rigorous, analytical).

  7.  **Final Polish:** Check definitions. Ensure "First-order preferences" is understood as preferences over *outcomes/actions* vs "Second-order" as preferences over *compliance/sanctions*. Ensure Lewis's specific definition of convention (arbitrary, regular, expected, preferred) is respected.

      *   *Nuance check:* Lewis *does* allow for a preference for conformity *as such*. But is that second-order? Usually, Lewisian conformity preference is still first-order (I prefer the outcome where we match). True normativity requires a preference conditioned on *expectations of others' expectations* (normative expectations). I need to be precise here.
      *   *Refinement on Tension:* The prompt defines (a) as "deriving normative force solely from first-order coordination preferences, *without second-order attitudes*." This is the key. Lewis's original account is often criticized for lacking the "normative" bite because it lacks the sanction/approval layer.
      *   *Relaxation:* Admitting second-order attitudes (shame, guilt, blame) is the standard move (Bicchieri). This preserves (c) because peer sanctions aren't "authority" in the political sense. It solves (b) because the cost of sanction outweighs the Pareto gain.

