answer: |-
  # Desiderata for a Lewisian Theory of Norm Evolution

  To extend David Lewis's account of convention (*Convention: A Philosophical Study*, 1969) into a robust theory of normative evolution, one must bridge the gap between *equilibrium selection* and *obligation*. Lewis defines a convention as a regularity $R$ in a population $P$ such that: (1) everyone conforms to $R$; (2) everyone expects everyone else to conform; (3) everyone prefers to conform on the condition that others do (coordination preference); and (4) there is an alternative regularity $R'$ that could have solved the coordination problem.

  The following desiderata specify the requirements for a theory that retains this spontaneous-order framework while accounting for the "normative turn"—where conventions become binding, moralized, and resistant to efficiency gains.

  ## I. Desiderata Specification

  ### (i) Explanatory Coverage
  The theory must account for the lifecycle of normative practices, specifically transitions that pure equilibrium analysis often overlooks.
  *   **Requirements:**
      1.  **Emergence:** Explain how a regularity moves from statistical coincidence to expected behavior.
      2.  **Moralization:** Explain how arbitrary coordination equilibria (e.g., dress codes) acquire deontic weight (e.g., "indecent exposure").
      3.  **Persistence of Suboptimality:** Explain why norms persist when a Pareto-superior equilibrium is available and known (e.g., inefficient measurement systems, harmful initiation rites).
  *   **Status:** **Non-negotiable.** A theory of *norm evolution* that cannot explain why norms stick or how they acquire moral force fails to address the target phenomenon. It would remain merely a theory of equilibrium selection.
  *   **Motivating Case:** *Footbinding.* A Pareto-inferior practice that persisted for centuries despite availability of alternatives. A Lewisian account must explain why the coordination preference didn't shift when the physical cost outweighed the social benefit.

  ### (ii) Conceptual Distinctions
  The theory must maintain categorical distinctions between mere regularities and genuine norms.
  *   **Requirements:**
      1.  **First-Order vs. Second-Order Expectations:** Distinguish between expecting others to act ($E_1$: "I expect you to drive on the left") and expecting others to hold normative expectations ($E_2$: "I expect you to *expect* me to drive on the left and to disapprove if I don't").
      2.  **Descriptive vs. Prescriptive:** Distinguish between stability (people *do* $X$) and force (people *ought* to do $X$).
  *   **Status:** **Non-negotiable.** Collapsing these distinctions results in the "naturalistic fallacy" within social ontology, reducing obligation to prediction.
  *   **Motivating Case:** *Queueing.* In some cultures, cutting a line is merely inefficient (descriptive regularity); in others, it provokes indignation (prescriptive force). The theory must capture the difference in $E_2$ expectations.

  ### (iii) Consistency Constraints
  The theory must remain compatible with the foundational constraints of the Lewisian and evolutionary framework.
  *   **Requirements:**
      1.  **No Explicit Rule/Authority:** Norms must emerge from decentralized interactions, not legislation or command.
      2.  **Common Knowledge not Required:** The theory should not rely on hyper-rational common knowledge of rationality, allowing for bounded rationality and evolutionary learning dynamics.
      3.  **Multiple Equilibria:** The dynamics must allow for path dependence, where history determines which norm is selected among viable options.
  *   **Status:** **Non-negotiable (for a Lewisian project).** If the theory requires a legislator or common knowledge of rationality, it ceases to be an extension of Lewis and becomes a theory of law or idealized game theory.
  *   **Motivating Case:** *Language evolution.* No central authority dictated English syntax; it evolved through local interactions without agents needing to know the rationality of all other speakers.

  ### (iv) Exclusion Conditions
  The theory must avoid specific metaphysical and methodological pitfalls.
  *   **Requirements:**
      1.  **No Reduction to Predictive Reliability:** The "ought" cannot be defined solely as "high probability of conformity."
      2.  **No Unreduced Moral Realism:** The theory must explain normativity naturalistically (via social facts) without positing mind-independent moral truths.
  *   **Status:** **Non-negotiable (for Naturalism).** This defines the philosophical camp. A moral realist could reject (iv.2), but a social-naturalist project cannot.
  *   **Motivating Case:** *Segregation norms.* A theory that defines "ought" as "what is reliably done" would validate segregation as normative simply because it was stable. The theory must allow for the description of a norm without endorsing its validity, while still explaining its binding *feel*.

  ---

  ## II. Analysis of the Core Tension

  The central challenge is satisfying the following triad:
  *   **(a)** Derive normative force **solely from first-order coordination preferences** (Lewis's original condition: I conform because I want to coordinate, not because I fear blame).
  *   **(b)** Explain **resistance to Pareto-improving revision** (Why we stay on a local maximum).
  *   **(c)** Remain faithful to **Lewis's claim that conventions need no authority or explicit rule** (Spontaneous order).

  ### The Conflict
  **The theory cannot satisfy (a), (b), and (c) simultaneously.** The conflict lies primarily between **(a) and (b)**.

  1.  **The Incompatibility of (a) and (b):**
      *   Under condition (a), an agent's preference for conformity is conditional *only* on others conforming to solve a coordination problem.
      *   If a Pareto-superior alternative ($R'$) becomes available (e.g., a new technology or standard that benefits everyone), the first-order coordination preference should immediately shift to $R'$. Everyone prefers $R'$ given that others choose $R'$.
      *   Without second-order attitudes (sanctions, shame, guilt), there is no cost to switching other than temporary coordination failure. If the switch is coordinated or gradual, the pure coordination preference offers no "stickiness" against a Pareto improvement.
      *   Therefore, pure first-order preferences cannot explain the persistence of suboptimal norms (Desideratum i.3). To explain (b), there must be an *additional* cost to deviation that is not merely coordination failure. This cost is typically social sanction or internal guilt, which requires **second-order attitudes** (expectations of approval/blame).

  2.  **The Compatibility of (c) with Second-Order Attitudes:**
      *   Condition (c) forbids *centralized authority* or *explicit rules*. It does not forbid decentralized peer sanctions.
      *   Lewis's original framework minimizes sanctions, focusing on the preference for conformity. However, introducing decentralized, evolutionary sanctions (e.g., ostracism, reputational damage) does not violate the "no authority" constraint. It remains a spontaneous order.
      *   Therefore, (c) is compatible with relaxing (a).

  ### The Necessary Relaxation
  To resolve the trilemma, we must **relax (a)**.

  *   **Relaxation:** The theory must admit that normative force is derived not solely from first-order coordination preferences, but from **second-order expectations of sanction or approval** (what Cristina Bicchieri calls "normative expectations").
  *   **Justification:**
      *   **Preserves (c):** Peer enforcement is not authority. It fits the evolutionary game-theoretic model of costly punishment or reputation dynamics.
      *   **Secures (b):** Second-order attitudes create a "compliance cost" for deviating even when a Pareto-superior option exists. If switching to the better equilibrium triggers social blame (because the old norm is moralized), agents may rationally stay on the suboptimal equilibrium.
      *   **Minimizes Damage:** Relaxing (a) moves the theory from "Lewisian Convention" to "Social Norm," but this is a necessary evolution to meet Desideratum (i) and (ii). Lewis himself acknowledged that some conventions acquire normative force, though he did not fully model the mechanism. Retaining (a) renders the theory incapable of explaining the *normative* aspect of norm evolution, reducing it to a theory of habit. Retaining (c) is essential to keep the project distinct from political philosophy or legal theory.

  ### Locating Existing Accounts
  *   **Lewis (1969):** Satisfies (a) and (c), but fails (b). It explains stability but not *normative* stickiness against Pareto improvements.
  *   **Bicchieri (2006):** Relaxes (a) by requiring conditional preferences based on empirical *and* normative expectations. Satisfies (b) and (c). Best fits the desiderata list.
  *   **Evolutionary Game Theory (Skyrms/Young):** Strong on (c) and (b) (via path dependence/stochastic stability), but often struggles with (ii) (conceptual distinction between is and ought) unless psychological structures (second-order attitudes) are explicitly modeled into the payoff functions.

  ### Conclusion
  An adequate theory must abandon the strict Lewisian constraint that conformity is driven *solely* by first-order coordination preferences. By integrating second-order expectations (blame/approval) as evolutionary stable strategies, the theory can explain the moralization and persistence of suboptimal norms without invoking centralized authority. This relaxation is the least damaging because it preserves the spontaneous, naturalistic ontology of the project while finally accounting for the phenomenology of obligation.
