  7.  **Final Polish:** Check tone. Ensure it sounds like a committee member speaking to peers, not a judge issuing a verdict. Ensure the distinction between the *letter* (external) and *chart* (internal/billing) is clear but consistent with Open Notes. *Wait, Open Notes means she sees the chart.* So if I put a DSM code she hates in the chart, she sees it. I must address this. The recommendation must be: We put the code, *but* we write a note explaining *why* the code is there (administrative necessity). This respects Open Notes.

