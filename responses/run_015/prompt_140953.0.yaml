      *Revised Plan on Coherence:* The code serves as a gatekeeper for resources (billing/accommodation) but should not serve as a gatekeeper for liberty (coercion) without additional safeguards. The inconsistency is tolerable because the stakes (money/access vs. liberty) differ, but we must acknowledge the philosophical tension.

      *Let's write.*

