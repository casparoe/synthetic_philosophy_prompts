answer: |-
  **MEMORANDUM**

  **TO:** Principal Investigators, Protocol 447
  **FROM:** Institutional Behavioral-Research Ethics Board
  **DATE:** October 24, 2023
  **SUBJECT:** Ethical Review Determination for Protocol 447

  **DECISION: NOT APPROVED**

  The Institutional Behavioral-Research Ethics Board has completed its review of Protocol 447, "Decision-Making Competence Under Social Pressure." After deliberation, the Board cannot approve the protocol in its current form. This determination is based on fundamental concerns regarding the validity of informed consent within the proposed design, specifically concerning the recruitment of adults with mild cognitive impairment (MCI) and the use of targeted deception.

  **PROTOCOL SUMMARY**
  The study aims to measure susceptibility to undue influence in adults with MCI. Participants are recruited under the premise of playing a cooperative economic game. In reality, they are exposed to a confederate exerting social pressure to make risky financial choices. The true purpose of the study is concealed until a debriefing session occurs after the task is complete.

  **ETHICAL ANALYSIS**
  The Board acknowledges the scientific value of understanding how cognitive impairment interacts with social pressure. However, the methodology proposed introduces an ethical conflict that standard mitigation strategies, such as retrospective debriefing, cannot resolve.

  **1. Vulnerability and Capacity**
  The target population consists of individuals with documented mild cognitive impairment. By definition, this group possesses diminished cognitive reserves regarding memory, attention, and executive function. Ethical oversight requires heightened protection when research targets populations whose ability to process information and weigh consequences is compromised. In this context, the threshold for valid authorization is higher, not lower.

  **2. The Structural Integrity of Consent**
  A significant portion of the Board's deliberation focused on the nature of the deception employed. Standard methodological deception withholds specific details to prevent bias. However, Protocol 447 withholds the fundamental nature of the interaction.

  The Board accepts the argument that competence is not a static trait but a dynamic interaction between an individual and their environment. Consent is not merely a signature on a form; it is an ongoing authorization to participate in a specific set of activities under a specific set of understandings.

  In this protocol, the deception targets the very capacity the study intends to measure. By concealing that the environment is adversarial rather than cooperative, the study manipulates the conditions under which the participant authorizes their own involvement. For a participant with MCI, the ability to assess risk is already fragile. When the framework of the decision is falsified, the participant is not merely missing information; they are operating within a reality that does not exist.

  **3. The Limits of Debriefing**
  The investigators propose that full debriefing after the task will rectify the ethical breach. The Board finds this insufficient. If the initial authorization was based on a false premise regarding the nature of the social interaction, the consent was structurally invalid at the moment it was exercised.

  Retrospective disclosure cannot restore an authorization that was never properly given. Telling a participant afterward that they were being tested on their susceptibility to influence does not change the fact that they agreed to a cooperative game, not an assessment of their vulnerability. For participants with MCI, who may experience confusion or distress upon learning they were manipulated, this retroactive correction may cause harm without curing the initial ethical deficit. The violation occurs during the engagement, not after the revelation.

  **4. Risk of Exploitation**
  Combining a vulnerable population with a design that exploits their cognitive limitations to generate data creates a high risk of exploitation. The study design relies on the participants' inability to detect the manipulation to succeed. Ethically, we cannot sanction a methodology that requires the impairment of the subject to function as intended.

  **REQUIREMENTS FOR RESUBMISSION**
  To move forward, the research team must redesign the protocol to align with the ethical requirement that authorization must be valid at the point of engagement. The Board suggests the following pathways for a new submission:

  1.  **Removal of Deception:** Modify the study to remove the deceptive element. Participants should be informed that they will be exposed to social pressure and that their responses to this pressure are the subject of study. While this may alter the ecological validity, it preserves the integrity of consent.
  2.  **Alternative Population:** If the deception is methodologically essential and cannot be removed, the study should not recruit individuals with cognitive impairments. Conducting this specific design on a neurotypical adult population would reduce the risk of invalidating consent due to capacity concerns.
  3.  **Proxy Authorization:** If the study must proceed with the MCI population and the current design, valid authorization must be secured through a legally authorized representative who is fully informed of the deception and the risks, alongside the participant's assent. However, the Board notes that this does not fully resolve the concern regarding the participant's personal experience of manipulation.

  **IMPLEMENTATION TIME FRAME**
  This decision is effective immediately. No recruitment or data collection may begin under Protocol 447.

  The investigators are invited to submit a substantially modified protocol or a new proposal addressing the concerns outlined above. A resubmission may be made within **sixty (60) days** of this memo. If no resubmission is received within this window, the file will be closed administratively.

  The Board remains available for consultation during the redesign phase to ensure the scientific goals can be met without compromising the ethical treatment of participants.

  **Signed,**

  **Institutional Behavioral-Research Ethics Board**
