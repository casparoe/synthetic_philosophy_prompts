  *Wait, one more nuance:* The user says "nobody in 2019 thought about at all." This implies the bill is already law (2019). So the attorney is arguing against *interpretive guidance* or a *technical correction*. The slogan is being used to stop *correction*. Okay, that makes Thesis 4 (Democratic Accountability) very strong here.

