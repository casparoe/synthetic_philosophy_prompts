answer: |-
  This is a remarkably sharp dissection of a genuine paradox in legal philosophy. You have identified that the law does not operate with a single, consistent metaphysics of the "self over time." Instead, it operates with a **pragmatic patchwork of transactional integrity.**

  The implicit theory is not "The Cold Self is Sovereign." The implicit theory is: **"The Unpressured, Informed Transactor is Sovereign, unless the Transaction is Socially Toxic."**

  Here is the reconstruction of the implicit theory, answering your specific constraints and testing it against your payday loan case.

  ### 1. The Hot/Cold Hierarchy: Procedural Heuristics, Not Psychological Truths

  Your guess is half-right. The law *does* rely on a hot/cold distinction, but it refuses to adjudicate psychology. It adjudicates **context.**

  If the law had to determine whether you were actually "hot" (emotional, pressured, akratic) at the moment of signing, every contract dispute would require a psychiatric evaluation. That is administratively impossible. So, the law uses **proxies for heat**:
  *   **Location:** Your doorstep (territorial vulnerability) = Hot.
  *   **Medium:** Distance/Online (information asymmetry) = Hot.
  *   **Time:** Immediate vs. Delayed performance.

  **Why this matters:** The law assumes that if the *procedure* was cold (lawyer present, office setting, time to read), the *choice* is binding, even if you were internally conflicted. Conversely, if the procedure was hot (salesman in hallway), the choice is voidable, even if you felt calm.

  **Does this presuppose akrasia?** Not necessarily. It presupposes **information asymmetry and pressure.** You can explain cooling-off periods entirely through the economic model of "market failure." Doorstep sellers create artificial scarcity and social pressure that prevent rational calculation. The law corrects the market distortion; it doesn't necessarily save you from yourself.

  ### 2. The Counterparty Constraint: Regulating Markets, Not Wills

  This is the strongest explanation for the asymmetry between (1)/(2) and (3).

  *   **In (1) and (2):** The state regulates a **licensed activity.** Selling door-to-door and running a casino are privileges granted by the state, not rights. Because the state licenses them, it can attach conditions to the license to protect public welfare.
  *   **In (3):** A private agreement between you and your brother is not a licensed market activity.

  **Why courts won't enforce Ulysses pacts:**
  It is not just that they disapprove; it is the doctrine against **specific performance of personal services** and the rule against **penalty clauses.**
  *   If you contract to go to the gym and pay $500 if you don't, a court views this as a *penalty* intended to coerce behavior, not *liquidated damages* compensating for a loss. Your brother suffers no financial loss if you skip the gym.
  *   More deeply, the state claims a monopoly on coercion. It will not lend its power (sheriffs, bank levies) to enforce private behavioral control, because that looks too much like private indentured servitude.

  **The Theory:** The law protects you from **predators** who profit from your volatility (sellers, casinos). It does not protect you from **yourself** via private enforcement, because the state does not want to become the enforcer of private moral regimes.

  ### 3. Selectivity: The "Vice" Exception

  You asked why self-binding is enforced for gambling but not for alcohol or gym attendance. This reveals that the theory is not about *agency* but about **harm.**

  *   **Gambling:** In most jurisdictions, gambling is legally precarious. It is often a "vice" that is tolerated but restricted. The state has a *parens patriae* interest in minimizing gambling addiction because it creates public costs (bankruptcy, crime, family breakdown). Self-exclusion is a tool of public health policy, not just individual autonomy.
  *   **Gym/Alcohol:** These are generally viewed as neutral or positive goods. The state has no interest in helping you bind yourself to drink less, because moderate drinking is not a public crisis in the same way.

  **What a consistent "Cold Self Sovereignty" would look like:**
  If the Cold Self were truly sovereign, we would have a **Universal Pre-Commitment Registry.** You could register: "No alcohol," "No spending over $100," "No entering casinos." Any counterparty checking the registry would be liable for selling to you.
  *   **Why we don't have this:** It inverts the presumption of liberty. The default would become "Incapacitated until proven Competent." It places a massive administrative burden on merchants. It also risks the "Tyrannical Past Self" problem: What if your Cold Self bans you from something you legitimately need later?

  ### 4. The Opt-In Problem: Defaults vs. Liberty

  You asked if the opt-in nature of self-exclusion defeats the theory (if people are biased, they won't opt-in).

  This highlights a conflict between **Paternalism** and **Liberty.**
  *   **Cooling-off (Default):** This restricts the *seller's* liberty to keep your money. It does not restrict *your* liberty to spend. It is "liberty-enhancing" for the consumer.
  *   **Self-Exclusion (Opt-In):** This restricts *your* liberty to gamble. Even if you want to be restricted, the state requires a high bar (affirmative consent) because revoking a civil liberty (the right to enter a legal business) is serious.

  **Does it defeat itself?** Yes, partially. If hyperbolic discounting is severe, the "hot self" will never click the "self-exclude" button. This is why some jurisdictions are moving toward **mandatory affordability checks** or **spending limits** by default on betting apps. This shifts the theory from "Protecting the Cold Self" to "Managing the Risk of the Activity."

  ### 5. The Test Case: Payday Loan (11pm) vs. Betting App

  Let's run your concrete scenario: *Payday loan at 11pm (no cooling off) vs. Betting App Self-Exclusion.*

  **Why the difference?**
  1.  **Necessity vs. Vice:** Credit, even predatory credit, is often framed as access to essential liquidity (rent, food). Gambling is discretionary. The law is more willing to restrict access to "poison" (gambling) than access to "medicine" (cash), even if the medicine is toxic.
  2.  **The Counterparty's Business Model:** A casino's profit *depends* on your loss and your continued play. A lender's profit depends on your *repayment*. Paradoxically, the lender wants you to be rational enough to pay them back. The casino wants you to be irrational enough to keep betting. The law intervenes more aggressively where the business model relies on customer self-destruction.
  3.  **Regulatory Silos:** Payday loans are regulated by Finance/Credit laws (focus on disclosure, APR). Gambling is regulated by Morality/Public Order laws (focus on addiction, harm).

  **What this presupposes:**
  It presupposes that **economic autonomy trumps psychological protection** in the sphere of credit, but **psychological protection trumps economic autonomy** in the sphere of vice.
  *   *Is this consistent?* No. It is a historical accident of how credit markets and gambling halls evolved.
  *   *Is it defensible?* Only if you believe access to capital is a fundamental capability that shouldn't be delayed, whereas access to gambling is not.

  ### 6. Institutional Implications: Two Consistent Worlds

  If we wanted to resolve the patchwork, we would have to choose one of two coherent theories.

  **World A: Cold Self Sovereignty (The Rational Planner)**
  *   **Theory:** The deliberative, long-term self is the true legal person. Impulsive slices are temporary incapacities.
  *   **Changes Required:**
      *   **Universal Cooling-Off:** All contracts have a 14-day rescission period, non-waivable.
      *   **Enforceable Ulysses Pacts:** Courts enforce behavioral contracts (gym, drinking) provided they were signed during a "cold" period (e.g., witnessed by a lawyer).
      *   **Mandatory Self-Exclusion:** Betting apps must set limits by default; users must opt-*out* of safety, not opt-*in*.
      *   **Credit Restrictions:** Payday loans would require a 24-hour "reflection period" before funding.
  *   **Cost:** Massive friction in commerce. Liberty is reduced (you can't bind yourself to immediate action).

  **World B: Time-Slice Equality (The Libertarian)**
  *   **Theory:** Every moment-self is sovereign. If you want to gamble at 3 AM, that is your choice. If you want to sign a contract at the door, that is your choice.
  *   **Changes Required:**
      *   **Abolish Cooling-Off:** A signature is a signature. Caveat emptor.
      *   **Abolish Self-Exclusion:** If you want to gamble, the casino cannot ban you. You are responsible for your own will.
      *   **Enforce All Contracts:** If you bet your brother $500 on the gym, the court collects.
  *   **Cost:** High rates of ruin, addiction, and predatory exploitation. Assumes a level of rationality that behavioral economics proves doesn't exist.

  ### Conclusion: The Actual Implicit Theory

  The current system is not based on a coherent theory of the self. It is based on a **Theory of Acceptable Risk.**

  1.  **Consumer Transactions:** The state accepts that commerce needs friction to be fair. Cooling-off periods are a "tax" on sellers to ensure market integrity.
  2.  **Vice Industries:** The state accepts that some activities are inherently destabilizing. Self-exclusion is a harm-reduction tool for a tolerated sin.
  3.  **Private Life:** The state refuses to intervene in private self-regulation because the administrative cost and liberty infringement outweigh the benefit.

  **The Payday Loan Verdict:** The fact that the 11pm loan stands while the betting ban sticks tells us that the law values **Access to Capital** more than **Protection from Impulse**, but values **Protection from Addiction** more than **Access to Vice.**

  It is not a philosophy of time. It is a hierarchy of social goods. The "self" is just the terrain on which those goods are fought over. To make it coherent, you would have to decide: Is the citizen a **Consumer** to be protected from market failure, or a **Sovereign** to be held responsible for their choices? Currently, the law treats us as Consumers when we are being sold to, and Sovereigns when we are trying to bind ourselves. That is the inconsistency.
