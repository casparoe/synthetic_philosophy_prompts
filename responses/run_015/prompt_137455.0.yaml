  11. (Final thought on "Opt-in"): The user asks if opt-in defeats the theory. If people are biased, they won't opt-in. Response: The law assumes a baseline of competence. You must show you *know* you have a problem before the state restricts your liberty. It's a "threshold of proven vulnerability."

