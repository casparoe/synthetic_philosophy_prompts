  **HHS Establishes Bureau of Artistic Infection, Declares 98 Percent of Cultural Output Counterfeit**

  WASHINGTON—The Department of Health and Human Services announced Tuesday the immediate operationalization of the Bureau of Artistic Infection, a new regulatory body tasked with evaluating all film, music, fiction, and public monuments based on their capacity to transmit sincere feeling from creator to audience. According to the Bureau's initial compliance report, approximately 98 percent of existing cultural artifacts have been classified as counterfeit art and are slated for decertification or removal from public circulation.

  The Bureau's mandate relies on a strict physiological model of creativity. Under the new regulations, a work is only considered art if a person who has once experienced a feeling recalls it and, by external signs, transmits it to others so that they are infected by it. If the audience does not catch the feeling, the object is merely a craft product. If the artist did not actually experience the feeling they are transmitting, the work is deemed insincere and hazardous to public spiritual health.

  "To create art is to infect," said Bureau Director Dr. Arlene Vane during a press briefing at the Hubert H. Humphrey Building. "It is a simple vector of emotion. The artist feels, the artist signals, the audience feels. If any link in that chain is broken by technical virtuosity, professional craftsmanship, or the pursuit of beauty, the infection fails. We are here to ensure the pathogen of genuine feeling reaches the host without interference."

  To verify this process, the Bureau has implemented the Infection Certificate system. All new releases must be tested before panels of uncorrupted distribution center employees and rural logistics personnel, chosen for their lack of exposure to upper-class aesthetic perversion. If the panel reports feelings of merriment, tenderness, or peacefulness, the work qualifies as Universal Art. If the work transmits feelings of brotherhood and love rooted in religious perception, it qualifies as Christian Art. Any other emotional response, including awe, admiration, or intellectual stimulation, results in immediate rejection.

  The music industry has been hit particularly hard by the Sincerity Audit division. Songwriters are now required to submit medical records, journal entries, and witness testimony proving they actually felt the heartbreak, joy, or longing expressed in their lyrics. Earlier this week, a major pop label was fined after it was revealed that a chart-topping ballad about parental loss was written by a committee of producers whose parents are still living.

  "You cannot transmit a feeling you have not held," said Senior Auditor Mark Rostov, holding up a confiscated vinyl record. "This song uses minor chords to simulate sadness, but the composer was in a good mood during tracking. That is fraud. It is a lie told with reverb."

  The Bureau's enforcement of the four marks of counterfeit art has led to the suspension of several major entertainment franchises. A leading superhero film series was penalized heavily for Borrowing, cited for recycling ready-made materials such as the orphan origin story, the quip during combat, and the city-destroying climax. The production was further cited for Effectfulness, also known as strikingness, due to its reliance on calculated shock, grandeur, and virtuoso visual effects engineered to overwhelm the senses rather than transmit a simple feeling.

  "They want you to look at the explosion, not feel the peace," Dr. Vane explained. "That is strikingness. It is a assault on the nervous system, not an infection of the soul."

  Prestige television dramas have also been targeted under the prohibition of Imitation. The Bureau defines Imitation as mere descriptive realism, such as the detailed copying of faces, gestures, settings, and speech without the transmission of feeling. A critically acclaimed series set in a corporate boardroom was shut down after inspectors determined its scenes were exhaustive naturalistic descriptions rather than vessels of universal emotion. Similarly, stand-up comedy specials have been classified as Diversion or Amusement, defined as the production of pleasant nervous agitation that does not really transmit any feeling.

  "The comedian wants you to laugh, but not from tenderness," said Auditor Rostov. "They want you agitated. It is a diversion from the duty of brotherhood. It is entertainment, which is to say, it is nothing."

  Perhaps the most visible consequence of the new guidelines is the closure of the Metropolitan Museum of Art, which the Bureau has reclassified as a warehouse of counterfeits. Curators were informed that the collection's reliance on beauty and technical craftsmanship rendered the works inaccessible to everyone without exception. A Renaissance painting was removed from display after inspectors noted it depicted angels and warriors, classic examples of borrowed material inaccessible to the common laborer.

  "It is not enough to be skilled," Dr. Vane said, gesturing to a crate being loaded onto a truck. "If a peasant cannot understand it immediately, it is exclusive. If it is exclusive, it is not art. It is merely an object for the rich to feel superior about owning."

  In place of the confiscated works, the Bureau has released an Approved List of cultural materials safe for public consumption. The list currently consists of a specific peasant folk song regarding the harvest, a sentimental reconciliation scene from a 19th-century domestic novel, and a recorded church service focusing on universal love. These works have been certified as transmitting the simplest everyday feelings accessible to all humanity regardless of class or education.

  Public reaction has been mixed, though compliance is mandatory under the Public Health Safety Act. Several artists have attempted to appeal their classifications by arguing that their work requires patience or education to appreciate, but the Bureau has rejected these claims as evidence of elitist perversion.

  "We are not here to protect the artist's ego," Dr. Vane said, concluding the briefing. "We are here to protect the audience's capacity to feel. Beauty is a distraction. Craft is a mask. Only the infection matters. If you leave here feeling nothing, we have done our job. If you leave here admiring our technique, we have failed."

  At press time, the Bureau was investigating the Lincoln Memorial for Effectfulness, citing the grandeur of the statue as a potential barrier to sincere emotional transmission.
