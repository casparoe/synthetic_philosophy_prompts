          *   *Implication:* 1914 Assassination is a Nail for the *death of Franz Ferdinand*, but NOT for *WWI* (because other crises existed). 1962 Arkhipov IS a Nail for *Nuclear War* (because the window was minutes, no other off-switch existed).
          *   *Forced Abandonment:* Student must accept 1914 War was *not* contingent (which they already think, but need to justify). Student must accept Florida 2000 *is* a Nail (if $T$ is certification date), contradicting their "not interesting" claim.
          *   *Titanic:* Binoculars not a nail because speed/ice made collision redundant.

      *   *Principle 2: Epistemic Convergence.*
          *   *Definition:* Scientific/Technological outcomes are robust if multiple independent actors are approaching the same solution; specific attribution is contingent.
