  8.  **Refining the Output:**
      *   Make sure the tone is encouraging but critical.
      *   Ensure the distinction between "Sensitivity" (Butterfly Effect) and "Contingency" (Could have been otherwise) is clear, as that's the supervisor's main point.
      *   *Self-Correction on Florida 2000:* The student says it's "not interesting." I need to explain *why* their principle might force them to care, or how to exclude it legitimately (e.g., it's administrative, not structural). I'll argue the Redundancy Principle makes it a Nail, so they must either accept that or refine the principle to exclude "counting errors" vs "structural failures." I will suggest they exclude it based on *system type* (administrative vs geopolitical).
      *   *Self-Correction on 1914 vs 1962:* The key difference is *de-escalation mechanisms*. In 1914, mobilization schedules were automatic (robust). In 1962, communication lines were open but fragile (Arkhipov). I need to make sure the principle captures *system rigidity*.

      *   *Revised Principle 1:* **The Substitutability Window.** (Can another event do the job soon?)
      *   *Revised Principle 2:* **The Structural Load.** (Was the system primed to break, or did the break prime the system?)

      *   *Wait, let's look at the Supervisor's warning again:* "Sliding between two claims... small causes having large effects [Sensitivity] and outcomes being genuinely unpredictable [Contingency]."
