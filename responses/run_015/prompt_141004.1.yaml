          *   *Wait, let's look at the Supervisor's critique:* "Small causes having large effects" vs. "Outcomes being genuinely unpredictable."
          *   *Principle A: The Redundancy Principle.* (Addresses 1914 vs 1962). If the system has redundant triggers, the specific trigger is a nail, but the explosion is not contingent.
          *   *Principle B: The Horizon Principle.* (Addresses Penicillin/Credit). Contingency decays over time. Short term = fragile. Long term = robust.

      *   *Decision:* I will offer two distinct frameworks.
