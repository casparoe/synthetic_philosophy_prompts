answer: |-
  ### Workshop Plan: The Rationality of Credible Commitment
  **Target Audience:** Non-specialist Graduate Students (Law & Public Policy)
  **Duration:** 90 Minutes
  **Goal:** Move students from standard instrumental rationality to the puzzle of "rational irrationality" (dispositional commitment) without getting bogged down in technical decision theory.

  ---

  ### I. Conceptual Dependency Order
  To prevent students from collapsing the puzzle into a standard game-theoretic calculation too early, you must sequence the conceptual tools as follows:

  1.  **Secure First:** The distinction between **Ex Ante Rationality (Policy Evaluation)** and **Ex Post Evaluation (Act Optimization)**.
      *   *Why:* If you introduce the payoff matrix before establishing *when* rationality is evaluated, students will default to Ex Post evaluation (standard Causal Decision Theory). They will conclude defection is obvious and the puzzle disappears. You must prime them to evaluate the *rule they are following* before they evaluate the *specific act*.
  2.  **Introduce Second:** The **Payoff Structure**.
      *   *Why:* Once they accept that Ex Ante and Ex Post evaluations can diverge, the payoffs serve as the concrete data that demonstrates *why* they diverge in this specific case.
  3.  **Secure Last:** The distinction between **Evidential and Causal Reasoning**.
      *   *Why:* This is the technical mechanism that resolves the tension created by the payoffs and the temporal distinction. It cannot make sense until the students feel the friction of the paradox (i.e., "Why does my current decision provide evidence of a past disposition?").

  ---

  ### II. The Carrying Scenario: "The Retiring Prosecutor"
  **Decision:** Replace the canonical Stranded Driver with a **One-Shot Plea Bargain** scenario.

  **The Setup:**
  A defendant is caught with minor evidence. A prosecutor offers a deal: "Testify against the ringleader, and we drop all charges." The defendant testifies. Once the testimony is recorded, the prosecutor is retiring tomorrow (no future cases) and faces public pressure to be "tough on crime." The prosecutor now has the testimony and no incentive to honor the deal. The defendant knows this structure.

  **Defense of Modification:**
  For law and policy students, the "Desert" in Parfit's original example triggers institutional reflexes ("Sue for breach," "Call the police") that distract from the logical core. The Plea Bargain scenario leverages their domain knowledge while isolating the same logical variables.

  **Structural Features to Preserve:**
  1.  **Temporal Separation:** The decision to commit (accept deal) must precede the execution of the incentive (dropping charges), creating a window where the incentive to defect arises.
  2.  **Irrelevance of Reputation:** The "Retiring" clause is crucial. It removes the iterated-game solution, forcing the problem into the one-shot domain where dispositional rationality is required.
  3.  **Visibility of Reasoning:** The prosecutor must be able to predict the defendant's likelihood of testifying *before* the deal is offered (or the defendant must be able to predict the prosecutor's breach).

  **Structural Features to Relax:**
  1.  **Physical Isolation:** Unlike the desert, this occurs within an institution. This allows you to highlight that *legal* structures do not always solve *logical* commitment problems (prosecutorial discretion is often unreviewable).
  2.  **Life-or-Death Stakes:** Replace survival with liberty/career. The logic holds without the emotional weight of death, allowing for cooler analysis.

  ---

  ### III. Sequence and Misconception Management
  Map the predictable misconceptions to specific moments in the workshop to head them off before they derail the logic.

  | Workshop Phase | Conceptual Focus | Predictable Misconception | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **1. Scenario Setup** (0-20 min) | The "Retiring Prosecutor" narrative. | **"Reputation solves this."**<br>Students will argue the prosecutor won't breach to protect the office's long-term credibility. | **Head off immediately:** Explicitly stipulate the prosecutor is retiring *tomorrow* and the case is sealed. No future actors will know. This forces the "one-shot" condition. |
  | **2. Temporal Distinction** (20-35 min) | **Ex Ante vs. Ex Post.** | **"This is just weakness of will."**<br>Students will view the breach as a psychological failure rather than a rational calculation. | **Head off here:** Frame it as *incentive alignment*. Ask: "At which exact minute does the incentive flip?" Show that a perfectly rational, unemotional actor still faces this tension. |
  | **3. Payoff Analysis** (35-55 min) | The Matrix (Testify/Breach vs. Silent/No Deal). | **"It's just a Prisoner's Dilemma."**<br>Students will treat it as a simultaneous move game. | **Head off here:** Draw the game tree. Highlight the *sequential* nature. In PD, I don't know your move. Here, I know your move *before* I decide to breach. |
  | **4. Decision Theory** (55-75 min) | **Causal vs. Evidential.** | **"This assumes determinism."**<br>Students will argue my current choice can't change the past disposition. | **Head off here:** Clarify that we are not changing the past, but selecting which *type* of agent you are. Your current choice is *evidence* of your type, which the other party predicted. |

  ---

  ### IV. Closing Question
  Do not ask them to summarize the story. Ask a question that tests their grasp of the *threshold conditions* for the logic to hold.

  **"If the prosecutor's ability to predict your disposition falls to 60% accuracy, does the expected utility of being 'predictably honest' drop below that of being 'unpredictably strategic,' and what does that imply for the value of transparency in negotiation?"**

  *   *Why this works:* It forces them to acknowledge that "rational irrationality" is not an absolute virtue but depends on the *visibility* of the disposition. It tests the link between the epistemic condition (prediction) and the strategic outcome (payoff).

  ---

  ### V. Bracketed Strand
  **Explicitly Omit:** **The Analogy to Personal Identity Over Time.**

  *   **Rationale:** Parfit connects the Hitchhiker problem to his Reductionist view of persons (i.e., "I" am not the same person Ex Post as I was Ex Ante). While philosophically rich, this metaphysical layer distracts Law and Policy students from the *institutional* and *strategic* lessons.
  *   **How to Bracket:** State clearly at the outset: *"We are treating the agent as a single, continuous entity for the purpose of this workshop. We are analyzing the logic of commitment, not the metaphysics of the self."* This keeps the focus on the mechanics of credible threats and promises, which is directly applicable to their fields.
