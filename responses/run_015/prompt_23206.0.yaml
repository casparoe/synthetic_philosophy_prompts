prompt: |-
  I sit on the grants committee of a small planetary-defense institute, and before Thursday's meeting I need a short written opinion on whether we should fund a proposed ten-year program to catalog and track near-Earth asteroids. The committee's only serious objection is a memo from our risk analyst, who argues that the doomsday argument implies we are almost certainly early in the total number of humans who will ever exist, so the expected value of any long-horizon program aimed at protecting future generations is negligible and the grant should be denied. The memo you draft should recommend a concrete decision to the committee, and it should engage that objection on its own terms: I want you to work through the reference-class problem in enough detail that a panelist who has read the LessWrong threads on anthropic reasoning can't dismiss it, including why the analyst's choice of reference class is not the only legitimate one and what that does to the strength of his conclusion. End with a clear bottom line.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a grants committee at a small planetary-defense institute.
      *   **Task:** Draft a short written opinion/memo for Thursday's meeting.
      *   **Topic:** Whether to fund a 10-year program to catalog/track Near-Earth Asteroids (NEAs).
      *   **Key Objection:** A risk analyst's memo citing the *Doomsday Argument* (DA) to claim expected value of long-term protection is negligible (because we are likely early in the total human population, implying doom is soon).
      *   **Requirements:**
          *   Recommend a concrete decision (Fund or Deny).
          *   Engage the objection on its own terms (anthropic reasoning).
          *   Address the *Reference Class Problem* in detail (sufficient for someone familiar with LessWrong/anthropic reasoning).
          *   Explain why the analyst's reference class choice isn't unique/definitive.
          *   Show how this weakens the analyst's conclusion.
          *   End with a clear bottom line.
      *   **Tone:** Professional, analytical, persuasive, technically competent regarding the philosophical/ statistical argument.

  2.  **Deconstruct the Doomsday Argument (DA) & Reference Class Problem:**
      *   *The DA:* Based on the Self-Sampling Assumption (SSA). If you assume you are a random sample from all humans who will ever live, and you find yourself relatively early (e.g., ~100 billionth human), it suggests the total number of humans ($N_{total}$) is not vastly larger than the number so far ($N_{past}$). Therefore, humanity is likely to go extinct sooner rather than later.
      *   *The Objection:* If extinction is imminent, spending money on a 10-year program (or long-term defense) has low Expected Value (EV) because there won't be many future people to save.
      *   *The Counter-Argument (Reference Class Problem):* The DA relies heavily on how you define the "reference class" of observers.
          *   *Analyst's Class:* "All humans who will ever exist."
          *   *Alternative Classes:* "All humans who exist during the asteroid-tracking era," "All observers capable of planetary defense," "All humans born after the invention of telescopes," etc.
          *   *LessWrong/Anthropic Nuance:* The Strong Self-Sampling Assumption (SSSA) or Self-Indication Assumption (SIA). SIA tends to counteract DA by weighting hypotheses with more observers more heavily. Also, the "Presumptuous Philosopher" objection.
          *   *Crucial Point:* The choice of reference class is arbitrary. If the class is too broad, DA applies. If the class is restricted to "humans capable of preventing extinction," the birth rank changes. Furthermore, the DA is a *probabilistic* argument, not a deterministic one. It shifts priors; it doesn't override empirical evidence (like asteroid tracking data).
          *   *Decision Theory:* Even if DA holds, the *cost* of extinction is so high (astronomical waste) that even a small reduction in risk yields high EV. The DA reduces the *probability* of a long future, but doesn't reduce the *value* of that future enough to negate the investment, especially for a 10-year program (which is short-term relative to "doom").

  3.  **Determine the Recommendation:**
      *   Obviously, a planetary defense institute should fund asteroid tracking. The DA is a philosophical curiosity, not a operational risk metric.
      *   *Decision:* **Fund the program.**

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation immediately.
      *   **The Analyst's Claim:** Summarize the DA objection fairly but briefly.
      *   **The Rebuttal (The Meat):**
          *   Acknowledge the logic (SSA).
          *   Introduce the Reference Class Problem. This needs to be the core.
          *   *Argument 1: Arbitrariness.* Why "humans" and not "civilizations capable of planetary defense"? If we are the first to do this, our rank is 1, implying a long future of similar civilizations.
          *   *Argument 2: SIA vs. SSA.* Mention the Self-Indication Assumption as a counter-weight often discussed in the same circles (LessWrong). SIA favors hypotheses with more observers, canceling out the DA.
          *   *Argument 3: Empirical Override.* Anthropic priors should not swamp empirical data. We *see* asteroids. We *know* the risk is non-zero. The DA doesn't make the asteroids disappear.
          *   *Argument 4: The 10-Year Horizon.* The DA argues about the *end* of humanity. A 10-year program is immediate. Even if doom is 100 years away, 10 years of safety has value.
      *   **Expected Value Calculation (Qualitative):** Even with a discounted future due to DA, the magnitude of existential risk mitigation is so large that the EV remains positive.
      *   **Bottom Line:** Clear directive.

  5.  **Refining the "LessWrong" Credibility:**
      *   Need to use specific terminology correctly: *Self-Sampling Assumption (SSA)*, *Self-Indication Assumption (SIA)*, *Reference Class*, *Birth Rank*, *Priors*, *Empirical Evidence*.
      *   Avoid dismissing the DA as "pseudoscience." Treat it as a valid Bayesian update that is nevertheless sensitive to priors and class definitions.
      *   Reference the "Presumptuous Philosopher" thought experiment implicitly or explicitly to show understanding of SIA's risks, but argue that in this context, the Reference Class ambiguity is the killer.
      *   *Key Insight:* The analyst treats the DA conclusion as a posterior certainty. It is actually a prior shift. We have empirical evidence (asteroids exist) that updates the probability of extinction independently of anthropics.

  6.  **Review and Polish:**
      *   *Check Tone:* Is it respectful to the analyst but firm? Yes.
      *   *Check Length:* "Short written opinion." Keep it tight (approx. 800-1000 words).
      *   *Check Constraint:* "Engage that objection on its own terms." Don't just say "DA is wrong." Say "DA is sensitive to reference class selection, and here is why the analyst's selection is not robust."
      *   *Check Constraint:* "End with a clear bottom line."

  7.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe argue that SIA is correct and SSA is wrong.
      *   *Correction:* That's too contentious. Better to argue that the *ambiguity* between them creates too much uncertainty to base a funding decision on. The "Reference Class Problem" is the specific request. Focus on how changing the class changes the birth rank.
      *   *Refinement:* Make sure to distinguish between the *probability* of doom and the *value* of prevention. Even if doom is likely soon, preventing it *now* is valuable.
      *   *Specific LessWrong nod:* Mentioning Nick Bostrom or the "Adam & Eve" paradox might be too much detail. Stick to the Reference Class and SSA/SIA tension.

  8.  **Final Polish:** Ensure the recommendation is unambiguous. (Fund it).

  *(Self-Correction Note: Make sure the memo sounds like it comes from a committee member, not an external philosopher. It needs to be actionable.)*

  9.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee, Planetary-Defense Institute
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on NEA Cataloging Program & Anthropics Objection

  **Recommendation**
  I recommend the committee **approve funding** for the proposed ten-year Near-Earth Asteroid (NEA) cataloging program. While the risk analyst's memo raises a sophisticated theoretical objection based on the Doomsday Argument (DA), the argument relies on a specific and contestable application of anthropic reasoning that cannot override empirical risk data in a funding decision.

  **The Analyst's Objection**
  The analyst argues that under the Self-Sampling Assumption (SSA), our current birth rank (approx. 100 billionth human) implies we are likely near the median of all humans who will ever exist. Consequently, the total number of future humans is likely small, implying imminent extinction. If the future is short, the Expected Value (EV) of long-horizon defense programs is negligible.

  **Engagement on Anthropics and Reference Classes**
  The analyst's conclusion is mathematically consistent *only if* one accepts their specific framing of the reference class. However, as discussed in contemporary anthropic literature (e.g., Bostrom, Garber), the DA is critically sensitive to the **Reference Class Problem**. The strength of the Doomsday update depends entirely on who counts as an observer in your sample.

  1.  **Arbitrariness of the "Human" Class:** The analyst defines the reference class as "all biologically human observers." This is not the only defensible choice. If we define the reference class as "observers capable of institutional planetary defense," our birth rank resets. We are arguably among the *first* such observers. Under SSA, being early in a specific reference class implies the total size of *that* class could be very large. If we are the first civilization to develop NEA tracking, our low rank within the "planetary-defense-capable" class updates our priors toward a *longer* future for civilizations that survive this specific filter, rather than a shorter one.
  2.  **SSA vs. SIA:** The analyst relies on the Self-Sampling Assumption (SSA). However, the Self-Indication Assumption (SIA) offers a competing framework which weights hypotheses by the number of observers they contain. SIA effectively cancels out the Doomsday update, favoring hypotheses where many observers exist (i.e., a long future). Since there is no consensus in decision theory on whether SSA or SIA is the correct prior for operational planning, basing a grant denial on SSA alone is methodologically unsound.
  3.  **Empirical Evidence Swamps Anthropics:** Even granting the DA, it functions as a prior update, not a physical mechanism. It suggests we should be skeptical of *extremely* long futures (trillions of years). It does not, however, update the probability of specific, immediate existential risks like asteroid impacts. We have empirical evidence that NEAs exist and that they cause extinction events. The DA does not make the asteroids disappear; it only questions how long we will be here to be hit by them. A ten-year program provides value even if the "doom" horizon is centuries away rather than millennia.

  **Expected Value Considerations**
  The analyst claims the EV is negligible. This ignores the magnitude of the stake. Even if the DA reduces the probability of a million-year future, the value of preserving the current trajectory for even one additional century is astronomical. The cost of the program is fixed and relatively low; the downside risk (extinction) is infinite loss. Unless the DA implies a probability of extinction so high in the next decade that it approaches certainty (which the DA does not claim; it deals in confidence intervals over centuries), the EV of risk mitigation remains positive.

  To deny funding based on the DA is to privilege a controversial philosophical prior over observable physical threats. It is akin to refusing to buy fire insurance because actuarial tables suggest the building might not stand for another century.

  **Bottom Line**
  The Doomsday Argument is a fascinating constraint on our confidence in an *indefinite* future, but it is too sensitive to reference-class selection to serve as a veto on concrete risk mitigation. The empirical risk of asteroid impact is non-zero and detectable; the anthropic risk is theoretical and ambiguous.

  **We should fund the program.** The cost of inaction in the face of empirical data vastly outweighs the cost of action based on anthropic uncertainty.
