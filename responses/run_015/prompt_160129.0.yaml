answer: |-
  **Project Title:** Screening Off Cooperation: Indexicality vs. Common Origin in Evidential Decision Theory

  **Project Overview**
  The evidential argument for cooperation in large worlds relies on a specific structural claim: if the universe contains sufficiently many agents relevantly similar to me, my decision to cooperate is evidence that they will cooperate. On evidential decision theory (EDT), this correlation can swamp the small causal cost of unilateral cooperation, generating a duty to cooperate even in one-shot prisoner's dilemmas. This argument is typically used to ground broad other-regarding behavior in a sufficiently large cosmos.

  However, existing formulations conflate two distinct mechanisms that generate the required correlation: *indexical uncertainty* (I do not know which of the similar agents I am) and *common origin* (we are distinct agents with known identities but shared causal history, such as models trained on overlapping data). I propose that these mechanisms are not interchangeable. My central hypothesis is that common-origin correlation is vulnerable to "screening off" via self-knowledge, whereas indexical correlation is constitutive of it. In common-origin cases, learning more about my own dispositions allows me to condition on the shared cause, eroding the evidential link to others. In indexical cases, self-knowledge *is* the evidence about others. This project will formalize this distinction and determine whether evidential cooperation is stable under self-reflection.

  **The Precise Question**
  Does the source of correlation between agents (indexical uncertainty vs. common causal origin) determine the stability of evidential cooperation under conditions of increasing self-knowledge?

  This is not a question about the general validity of EDT versus causal decision theory (CDT). Both sides assume the correlation exists; the dispute is whether it is action-guiding. My question accepts the evidentialist's premise that correlation can guide action but asks whether that guidance survives when the agent updates on information about their own internal state. The answer is determinate: either the two models converge formally, or they diverge such that common-origin agents lose their reason to cooperate as they become more self-transparent, while indexical agents do not.

  **Context and Gap**
  The standard evidentialist position argues that in a large world, the "logical correlation" between similar agents justifies cooperation. The causalist reply is that correlation without causation is spurious and cannot justify action. Both positions leave open the *mechanism* of the correlation.

  Standard examples rely on indexical uncertainty: I reason that I am a random sample from the set of agents like me. But many real-world candidates for evidential cooperation (e.g., AI systems, graduates of the same institution, humans with shared evolutionary history) involve distinct agents with no indexical confusion. They know who they are. The correlation arises from shared training data or evolutionary pressure. The existing literature treats these as functionally equivalent for decision-theoretic purposes. I argue this is a mistake. In a common-origin model, the correlation is mediated by a hidden variable (the shared cause). If an agent can condition on its own state as a proxy for that cause, it risks screening off the correlation with the other agent. In the indexical model, there is no hidden variable to screen off; the agents are logically linked. This distinction is currently unmodeled, leaving the evidentialist's large-world optimism unsupported for the most plausible real-world cases.

  **Methodology: 12-Month Plan**

  *   **Months 1–3: Formalization of the Distinction.**
      I will construct two Bayesian network models representing the decision problem. Model A (Indexical) will treat the agent's identity as a random variable over the set of similar agents. Model B (Common Origin) will treat the agents as distinct nodes influenced by a shared parent node (the origin). I will define the "self-knowledge" variable as the precision with which the agent observes its own internal state prior to action.

  *   **Months 4–6: Screening-Off Analysis.**
      I will derive the conditions under which conditioning on self-knowledge reduces the evidential value of the action regarding the other agent's behavior. In Model B, I expect to show that as self-knowledge approaches perfection, the correlation screens off, collapsing the evidential benefit to zero. In Model A, I will demonstrate that self-knowledge increases the evidential weight, as it confirms the agent's membership in the cooperative type.

  *   **Months 7–9: Robustness Testing.**
      I will test the models against variations in the "shared cause." In real-world cases, the common cause is high-dimensional and难以 (difficult) to fully observe. I will determine the threshold of self-knowledge required to screen off the correlation. If the shared cause is sufficiently complex, common-origin cooperation might survive even with high self-knowledge. This phase involves simulating agents with bounded rationality to see if "learning eats cooperation" holds for realistic agents, not just idealized Bayesians.

  *   **Months 10–12: Synthesis and Write-Up.**
      I will generalize the results to normative implications. If common-origin cooperation is fragile, evidentialists cannot rely on it for AI alignment or institutional design without guaranteeing indexical uncertainty. I will draft the final paper, targeting a top philosophy journal, and prepare a shorter policy brief on the implications for cooperative AI systems.

  **Why This Approach?**
  Three alternative approaches are obvious but inferior.
  1.  **General EDT vs. CDT Debate:** This is too broad. Rehashing the Newcomb problem literature will not yield a determinate answer in 12 months and ignores the specific structural distinction I have identified.
  2.  **Single Toy Model:** Formalizing only one version (e.g., just the indexical case) would miss the comparative claim. The value of the project lies in the *divergence* between the two mechanisms.
  3.  **Empirical Testing on Trained Models:** Running cooperation experiments on actual neural networks is tempting but methodologically risky for a philosophy fellowship. It conflates the normative question (should they cooperate?) with the descriptive question (do they?), and isolating the decision-theoretic mechanism from architectural artifacts is unlikely to succeed in a year.

  My approach beats these by isolating the structural variable (source of correlation) within a formal normative framework. It delivers a philosophical result with empirical implications without getting bogged down in engineering.

  **Possible Conclusions**
  1.  **The Distinction Holds (Primary Hypothesis):** Common-origin cooperation degrades with self-knowledge; indexical cooperation does not. This limits the scope of evidential arguments for cooperation in realistic settings where agents know their own identities.
  2.  **Formal Equivalence:** The two models turn out to be isomorphic under specific transformations. This would vindicate the standard literature but require a new explanation for why the intuition of difference exists.
  3.  **Common-Origin Robustness:** The shared cause is so high-dimensional that agents cannot condition on it sufficiently to screen off the correlation. This would save the evidentialist argument for real-world cases, even if the indexical distinction holds in principle.

  The deciding consideration will be the behavior of the conditional probabilities in the Bayesian networks as the variance of the self-knowledge variable approaches zero.

  **Failure Conditions and Scope Creep**
  The project fails if the two models prove mathematically isomorphic despite the intuitive distinction. This is a genuine risk; it may turn out that "indexical uncertainty" is just a special case of "common origin" where the cause is the logical fact of the agent's algorithm. If so, the project will pivot to documenting this equivalence and explaining why the intuition of divergence persists.

  The project will become too big if I attempt to model the "shared cause" in full biological or computational detail. I must restrict the common-origin model to abstract causal graphs. Similarly, I will avoid deep engagement with the metaphysics of personal identity; the project treats indexicality as a probabilistic structure, not an ontological claim. Sticking to the formal decision-theoretic structure ensures completion within the 12-month window.

  **Conclusion**
  The evidential argument for cooperation is a powerful tool for resolving social dilemmas in large worlds, but its foundation is underspecified. By distinguishing between indexical and common-origin correlation, this project will clarify whether evidential cooperation is a robust feature of rational agency or a fragile artifact of self-ignorance. The result will determine whether we can expect rational agents to cooperate as they become smarter and more self-transparent, or whether enlightenment brings defection.
