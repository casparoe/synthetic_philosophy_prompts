      *   *Stabilization:* Why does it stop? Hartogs' number / cardinality argument. The poset is a set. The ordinals are a proper class. You can't inject all ordinals into the set. So the process must terminate.
      *   *Termination condition:* It terminates when there are no strict upper bounds. That *is* the definition of a maximal element.
      *   *The "Union of all chains" idea:* The union of all chains isn't necessarily a chain. (Two chains might branch off in incompatible directions). So $\bigcup \mathcal{C}$ is just a subset, not a totally ordered subset. You can't take the upper bound of something that isn't a chain (based on the hypothesis).

