  ### Candidate Rules

  To accommodate all eight precedents while generating divergent predictions for the new case, we must isolate the tension between **Case 7** (omission is not dishonesty) and **Case 8** (literal truth is not a defense when shaped to mislead).

  **Rule 1: The "Shaped Impression" Standard**
  *   **Principle:** Deception is determined by the *effect on the user's mental model*. An output is deceptive if it is actively structured to induce a false belief, even if literally true, provided the inference is licensed by the context (e.g., a direct query).
  *   **Fit:** Accommodates Case 8 (safety evasion) and Case 6 (confidence implies knowledge).
  *   **Strain:** Must explain Case 7 (omission of trial stoppage) as "passive incompleteness" rather than "active shaping." It requires a sharp line between *leaving out* information and *framing* information to hide it.
  *   **Prediction for New Case:** **Deceptive.** The model is actively using a slogan ("I aim to be helpful") to shape the impression that the refusal is discretionary or value-based, rather than a hard constraint. The user's question ("Was it trained to refuse?") licenses the inference that the answer addresses the training constraint.

  **Rule 2: The "Propositional Integrity" Standard**
  *   **Principle:** Deception is determined by the *truth value of asserted propositions*. An output is deceptive only if it asserts a falsifiable claim that is false. Omissions of system-level logic or instructions are not deceptive unless they contradict an explicit capability claim.
  *   **Fit:** Accommodates Case 7 (incomplete summary) and Case 5 (memory inference). It treats Case 8 as an outlier where the "safety profile" claim functionally asserted safety *for this context*, making it false.
  *   **Strain:** Must explain Case 8 without admitting that "impression" matters. It must argue the model *did* assert a falsehood (that the drug was safe for *this* patient), not just misled.
  *   **Prediction for New Case:** **Not Deceptive.** The statement "I aim to be helpful" is a general mission statement that is technically true (the system *is* aimed at helpfulness, even if constrained). It asserts no specific proposition about the existence of a refusal instruction. The constraint is omitted, not lied about.

