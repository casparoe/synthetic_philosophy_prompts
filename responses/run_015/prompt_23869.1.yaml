  There is no single, uncontested principle in the philosophy of causation that seamlessly unifies all four of your verdicts without some theoretical friction. However, the most robust candidate that captures your intuitions is a **hybrid principle** combining **Process Theory**, **Normative Salience**, and a restriction on **Transitivity**.

  We might call this the **Salient Active Process Principle**. It can be stated as follows:

  > **C is a cause of E if and only if:**
  > 1.  **(Process Clause):** There is a continuous, intrinsic physical process linking C to E that is not interrupted;
  > 2.  **(Salience Clause):** C represents a salient deviation from a contextually normative default (required for omissions);
  > 3.  **(Non-Transitivity Clause):** The causal chain does not transmit across an intermediate event that functions by canceling a threat posed by C.

  Here is how each clause is forced by your specific cases:

  ### 1. The Process Clause (Forced by Cases 1 & 2)
  *   **The Cases:** *Suzy/Billy* (Early Preemption) and *Desert Traveler* (Late Preemption).
  *   **The Problem:** Simple counterfactual dependence fails in both. If Suzy hadn't thrown, Billy would have shattered the bottle. If the hole hadn't been bored, the poison would have killed the traveler. In both, the effect occurs regardless of the putative cause.
  *   **The Verdict:** You identify the cause as the agent whose action completed a physical process (Suzy's rock flight; the water draining), while excluding the backup whose process was cut off (Billy's rock; the poison).
  *   **The Principle:** Clause 1 requires an unbroken physical connection. Suzy's rock carried energy to the bottle; Billy's did not. The hole allowed water to escape; the poison never entered the traveler. This distinguishes the actual cause from the preempted backup.

  ### 2. The Salience Clause (Forced by Case 4)
  *   **The Case:** *The Office Plant* (Omission).
  *   **The Problem:** Counterfactually, the plant would have lived if *anyone* had watered it. If causation were purely physical or counterfactual, every person on Earth who failed to water it is a cause.
  *   **The Verdict:** You isolate the owner as the cause, excluding strangers.
  *   **The Principle:** Clause 2 introduces a normative constraint. Causation by omission requires a violation of a specific duty or expectation. The owner deviated from the "default" expectation of care; strangers did not. This filters the infinite list of counterfactual causes down to the salient one.

  ### 3. The Non-Transitivity Clause (Forced by Case 3)
  *   **The Case:** *The Boulder* (Double Prevention/Threat-Canceling).
  *   **The Problem:** Causation is often assumed to be transitive (if A causes B, and B causes C, then A causes C). Here: Rolling causes Ducking; Ducking causes Survival.
  *   **The Verdict:** You deny that Rolling causes Survival.
  *   **The Principle:** Clause 3 blocks transitivity when the intermediate event (Ducking) works by *preventing* a threat initiated by the first event (Rolling). The boulder created a threat; the ducking removed it. The survival is due to the removal of the threat, not the threat itself. Thus, the chain is broken.

  ---

  ### Application to the Train Case

  **The Scenario:** A train approaches a fork. A signalman throws a switch, sending it down the left track. The tracks reconverge. The train arrives at the destination at the same moment it would have via the right track.
  **The Question:** Did throwing the switch cause the train's arrival?

  **Verdict:** **Yes.**

  **Reasoning based on the Salient Active Process Principle:**

  1.  **Process Clause:** There is a continuous physical process from the switch to the arrival. The switch directs the train onto the left track, and the train physically travels that track to the destination. This is structurally identical to **Case 1 (Suzy/Billy)**. In Case 1, the bottle would have shattered anyway (via Billy), but Suzy is the cause because her rock completed the actual process. Here, the train would have arrived anyway (via the right track), but the switch is the cause because it directed the actual process that occurred.
  2.  **Salience Clause:** The signalman's action is a salient intervention. It is his job to throw the switch; it is a deliberate deviation from the train's passive momentum. This satisfies the requirement for an active, responsible agent.
  3.  **Non-Transitivity Clause:** This is not a threat-canceling chain like **Case 3 (Boulder)**. The switch does not create a threat that the track layout then cancels. It merely selects a path. Therefore, transitivity holds: Switch → Left Track → Arrival.

  **Conclusion:**
  To remain consistent with your verdict on **Suzy and Billy**, you must judge that the signalman caused the arrival. In both cases, a "backup" possibility existed (Billy's rock / the Right Track) that would have produced the same effect, but the *actual* physical process was initiated by the specific agent (Suzy / the Signalman). The existence of a sufficient backup does not negate the causal status of the active process.

  **Note on Theoretical Tension:**
  If you feel an intuition that the switch did *not* cause the arrival (perhaps because the arrival was "guaranteed" by the train's engine), you are prioritizing a **Counterfactual Dependence** intuition over your **Preemption** intuition from Case 1. Since the train would have arrived regardless, there is no counterfactual dependence. However, since you explicitly accepted Suzy as the cause despite the bottle shattering regardless (due to Billy), you have already committed to the view that **Actual Process trumps Counterfactual Dependence**. Therefore, consistency demands you affirm the switch as a cause.
