      *   Does (ii) handle 4?* Yes, Owner has duty. Strangers don't.
      *   Does (iii) handle 3?* Yes, Ducking cancels the threat of Rolling. So Rolling -/-> Survival.
      *   This looks solid.

      *Train Case:*
      *   (i) Process: Switch -> Track -> Arrival. Yes.
      *   (ii) Salience: Signalman action. Yes.
      *   (iii) Directness: No threat cancellation. Yes.
      *   Verdict: Cause.

      *Wait, one nuance:* In Train, does the Switch *initiate a threat*? No. So (iii) doesn't block it.
      *   Does it satisfy (i)? Yes, the train physically travels the left track.
      *   Does it satisfy (ii)? Yes, it's an intervention.
      *   So, Yes.

      *Final check:* Is there any conflict?
      *   Some might argue Train is like Case 3 (Double Prevention). Switch prevents Right Track usage? No, that's weak.
      *   Stick with Preemption analogy (Case 1).
      *   Ready to write.
