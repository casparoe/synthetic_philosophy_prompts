answer: |-
  The conventional dichotomy between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) rests on a category error: the treatment of reference classes as binary sets rather than continuous fields of causal-epistemic relation. By rigidly defining an observer as either "in" or "out" of a reference class, both frameworks distort the evidential weight of self-location. SSA arbitrarily restricts the class to avoid cosmological presumptuousness, often rendering existence evidentially neutral. SIA includes all possible observers to capture the evidence of existence, but thereby licenses absurd updates about the size of the universe (the Presumptuous Philosopher).

  I argue that this opposition dissolves when reference class membership is treated as graded by **indexical proximity**—a measure of the causal-epistemic continuity between an observer's situation and one's own current standpoint. Under this **Graded Self-Sampling Assumption (G-SSA)**, the Presumptuous Philosopher objection loses its force because distant observers possess negligible indexical weight. Simultaneously, G-SSA resolves the Sleeping Beauty problem by recognizing that causally continuous awakenings do not constitute independent evidential samples, thereby avoiding the multiplicative anomalies of SIA (Thirdism) without retreating to the evidential neutrality of strict SSA (Halferism).

  ### 1. The Presumptuous Philosopher and the Fallacy of Ungraded SIA

  Bostrom's Presumptuous Philosopher thought experiment demonstrates the danger of ungraded SIA. If Hypothesis A posits a trillion observers and Hypothesis B posits a billion, ungraded SIA suggests you should be a trillion times more confident in A simply because you exist. This implies that armchair reflection can determine the population density of the cosmos, a conclusion that violates scientific modesty.

  This anomaly arises because ungraded SIA treats all observers as equiprobable samples regardless of their relation to the reasoner. It assumes a "view from nowhere" where a mind in a distant galaxy is just as likely to be *you* as a mind in your immediate causal vicinity.

  G-SSA corrects this by weighting observers by **indexical proximity**. Proximity is not merely spatial; it is the degree of causal-epistemic continuity. An observer $O$ has high proximity to me if $O$ shares my causal history, physical laws, and immediate epistemic constraints. An observer in a vastly larger universe (T2) but causally disconnected from my light cone has an indexical proximity approaching zero.

  Therefore, when evaluating the Presumptuous Philosopher scenario, the sheer number of distant observers in the "trillion" universe does not swamp the probability of the "billion" universe. The likelihood of *this* specific indexical standpoint arising is determined by the local causal conditions, not the total count of disconnected observers. We update on our existence (rejecting hypotheses where we could not exist), but we do not update on the *number* of irrelevant others. Thus, G-SSA avoids the presumptuousness charge not by arbitrarily shrinking the reference class (as SSA does), but by continuously discounting the evidential weight of causally remote observers.

  ### 2. Sleeping Beauty: The Symmetry Illusion

  The Sleeping Beauty problem reveals the second failure of the binary framework. In the canonical formulation, Beauty is awakened once if a coin lands Heads, and twice (with amnesia) if Tails.
  *   **SIA (Thirders):** Treats the three possible awakenings (Heads-Monday, Tails-Monday, Tails-Tuesday) as symmetric, independent samples. Since there are two Tails awakenings, P(Tails) = 2/3.
  *   **SSA (Halfers):** Treats the reference class as "experiments" rather than "awakenings," or conditions on existence in a way that renders the second awakening evidentially inert. P(Heads) = 1/2.

  The canonical formulation obscures the resolution by treating awakening events as **symmetric evidential updates**. It assumes that "being awake on Tuesday" is the same kind of evidence as "being awake on Monday," differing only in label. This invites the SIA multiplicative error: counting causally linked moments as independent trials.

  However, under G-SSA, the two Tails awakenings are not independent samples drawn from a population; they are **causally continuous segments of a single observer-stream**. The indexical proximity between Beauty-Monday and Beauty-Tuesday is near-maximal (same brain, continuous causal chain, intentional experimental design). They are not distinct "observers" in the sense required for SIA multiplication; they are a single locus of experience extended over time.

  By grading the reference class, we see that the "Tails" world does not contain *two* independent observers who might be "me"; it contains *one* observer who experiences two moments. Because the indexical proximity between these moments is high, they cluster into a single weighted unit for the purpose of self-sampling. The evidence "I am awake" confirms I am in an experimental run, but it does not favor Tails simply because Tails involves more temporal segments of the *same* causal chain.

  ### 3. Repairing the Asymmetry Without Collapsing into SIA

  The critical challenge is to avoid the SIA collapse. If we acknowledge that Tuesday-Beauty exists, why doesn't she count toward the probability?

  In ungraded SIA, every observer-moment counts as 1. In G-SSA, observer-moments are weighted by their **distinctness relative to the indexical center**.
  *   In the Presumptuous Philosopher case, distinctness is high (different galaxies, different causal histories), but proximity is low. Weight $\approx 0$.
  *   In Sleeping Beauty, distinctness is low (same person, memory wipe is a local interruption, not a causal break). The "distance" between Monday and Tuesday is small.

  If we model the probability update formally, the likelihood of observing "now" given Tails is not double that of Heads. In SIA, $P(\text{Now}|\text{Tails}) \propto 2$. In G-SSA, $P(\text{Now}|\text{Tails}) \propto 1 + \epsilon$, where $\epsilon$ represents the diminished weight of the second awakening due to its high causal overlap with the first. As causal continuity approaches identity, $\epsilon \to 0$.

  This repairs the asymmetry. The "Thirder" intuition relies on the idea that I could have been the Tuesday-awakening *instead* of the Monday-awakening. But G-SSA recognizes that in a causally continuous chain, "being Tuesday" is not an alternative to "being Monday"; it is a consequence of it. I could not be Tuesday-Beauty *without* having been Monday-Beauty. Therefore, they are not competing hypotheses for my identity; they are sequential states of the same identity.

  Consequently, the probability remains 1/2 (aligning with the Halfer intuition) but for a different reason than standard SSA. Standard SSA often achieves 1/2 by treating existence as neutral or by arbitrarily defining the reference class as "observers" rather than "observer-moments." G-SSA achieves 1/2 by acknowledging that **causal continuity suppresses multiplicative weighting**. It treats existence as evidentially significant (I am evidence of the causal chain's reality) but denies that temporal duplication within that chain multiplies the evidence.

  ### 4. Existence is Not Evidentially Neutral

  A common critique of SSA is that it treats "I exist" as a background condition rather than evidence, which prevents learning from anthropic data. G-SSA avoids this trap.

  In G-SSA, "I exist" is evidence for hypotheses that support the **local causal-epistemic continuity** required for my specific indexical standpoint.
  *   **Against Doomsday:** If a hypothesis suggests the causal chain terminates abruptly before my time, my indexical proximity to that hypothesis is zero. I update against it.
  *   **Against Presumptuousness:** If a hypothesis suggests a vast universe of disconnected observers, my indexical proximity to those observers is zero. I do not update for it.

  Thus, existence is evidentially potent: it selects for worlds capable of generating *this* specific causal stream. It is not neutral. However, it is not *generative* of evidence for unrelated observers. This distinguishes G-SSA from SIA (which treats existence as evidence for *any* observer) and strict SSA (which often treats existence as a fixed precondition).

  ### Conclusion

  The opposition between SSA and SIA is an artifact of discretizing the continuous nature of causal identity. SIA fails because it counts causally remote observers as equals; SSA fails because it arbitrarily excludes them or neutralizes existence. By introducing **indexical proximity**, we grade reference class membership by causal-epistemic continuity.

  This synthesis defeats the Presumptuous Philosopher by discounting distant observers, resolves Sleeping Beauty by clustering causally continuous awakenings (avoiding multiplicative updates), and preserves the evidential value of existence by anchoring it to the viability of the local causal chain. We are not random samples from a set of souls, nor are we evidence for the multitude of the cosmos. We are localized nodes in a causal network, and our reasoning must reflect the topology of that network, not the combinatorics of a binary set.
