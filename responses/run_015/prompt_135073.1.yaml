prompt: |-
  Draft the joint statement that a Strawsonian compatibilist about reactive attitudes and a Strawsonian revisionist about institutional and collective blame could both sign after a good-faith adversarial collaboration. The collaboration concerns whether P.F. Strawson's framework of reactive attitudes—resentment, gratitude, moral indignation, and related practices—successfully grounds moral responsibility without libertarian freedom, and whether that grounding extends to collective agents such as corporations, states, or algorithmic governance bodies.

  Present the document in the following structure:

  First, a numbered section of agreed claims that both camps can endorse. These should cover the descriptive distinction between participant reactive attitudes and the objective attitude; the conditions under which reactive attitudes are typically suspended (for instance, severe mental illness or infancy); what the truth of universal determinism would and would not entail about human action; and the accuracy of Strawson's observation that we do not globally abandon interpersonal attitudes upon accepting causal explanations.

  Second, a disagreements table. Each row should state one precise point of divergence, with one column giving the formulation that Camp A (the compatibilist extensionist) accepts as its own view and another column giving the formulation that Camp B (the revisionist restrictionist) accepts as its own view. The table should address at least: whether reactive attitudes carry implicit metaphysical commitments about causal authorship; whether adopting the objective attitude locally necessarily threatens global emotional engagement; and whether collective entities can be proper targets of reactive attitudes or whether such attribution necessarily reduces collective blame to an aggregate of individual blames.

  Third, the cruxes. Identify the specific sub-questions such that resolving them in one direction would move at least one camp. Expected cruxes include: (i) whether reactive attitudes have implicit truth-conditions about freedom; (ii) whether institutional punishment requires interpersonal analogues that collective agents cannot satisfy; and (iii) whether reactive practices possess non-instrumental or natural value independent of their social utility.

  Fourth, for each crux provide: a concrete case or argument both sides agree bears on the question (for example, attributing blame to a corporation for systemic environmental harm despite distributed decision-making; maintaining clinical detachment toward a severely addicted close relative without withdrawing affection; or assessing punitive practices in a society that accepts universal determinism); each camp's explicit prediction about how that case should be evaluated; and a brief note on whether either side regards the case as a red herring rather than a genuine test.

  Fifth, an assessment of whether any part of the dispute is verbal rather than substantive. If so, specify which terms—such as responsibility, blame, or participant stance—are being used with different meanings, and explain why that semantic divergence does not fully dissolve the disagreement.

  Conclude with an epistemic self-assessment: state what specific finding or argument would change your mind (for example, empirical evidence that collective blame attribution relies on the same psychological mechanisms as interpersonal resentment, or a demonstration that reactive attitudes necessarily presuppose a false metaphysics of agency); identify the reasoning that is most likely to fail, particularly in analogizing interpersonal relations to institutional structures; and confirm that no bibliographic references or citation lists are included.

  The response should be formal, precise, and constructed so that a reader without web access can evaluate the arguments. Avoid direct quotations from specific texts; paraphrase concepts in your own wording. Do not invoke obscure formalisms or highly specialized theories that depend on access to niche literature.
