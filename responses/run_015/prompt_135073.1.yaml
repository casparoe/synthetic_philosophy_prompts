answer: |-
  # Joint Statement on Reactive Attitudes, Determinism, and Collective Agency

  **Date:** October 26, 2023
  **Signatories:** Camp A (Strawsonian Compatibilist Extensionists) and Camp B (Strawsonian Revisionist Restrictionists)

  ## I. Agreed Claims

  Following our adversarial collaboration, we endorse the following propositions as the common ground of our shared Strawsonian framework:

  1.  **The Participant-Objective Distinction:** Human moral life is fundamentally structured by a distinction between the "participant stance" (involving reactive attitudes such as resentment, gratitude, and moral indignation) and the "objective stance" (viewing an agent as an object to be managed, treated, or cured).
  2.  **Local Suspension Conditions:** There are recognized conditions under which the participant stance is appropriately suspended or modified in specific cases without abandoning the framework globally. These include severe mental illness, infancy, extreme coercion, and unintentional harm.
  3.  **Determinism and Global Abandonment:** The truth of universal determinism (the thesis that every event is causally necessitated by prior events and laws of nature) does not logically entail that we must or can adopt the objective stance universally toward all persons.
  4.  **Resilience of Practice:** Accepting causal explanations for human behavior does not, as a matter of psychological fact, lead to the global abandonment of interpersonal reactive attitudes. Our practices are robust against theoretical insights regarding causality.
  5.  **Non-Metaphysical Grounding (Initial):** The justification for our responsibility practices is found primarily within the practices themselves and the value of human relationships, rather than in external metaphysical facts about "contra-causal" freedom.

  ## II. Disagreements Table

  While we share the framework above, we diverge on its scope and metaphysical implications, particularly regarding collective agents.

  | Point of Divergence | Camp A (Compatibilist Extensionist) | Camp B (Revisionist Restrictionist) |
  | :--- | :--- | :--- |
  | **1. Metaphysical Commitments of Attitudes** | Reactive attitudes do not carry implicit truth-conditions regarding libertarian freedom or ultimate authorship. They express demands for goodwill, not metaphysical judgments. | Reactive attitudes implicitly presuppose a form of causal authorship that collective entities cannot satisfy. Extending them to collectives smuggles in false metaphysical assumptions about agency. |
  | **2. Threat of the Objective Stance** | Adopting the objective attitude locally (e.g., toward a corporation or algorithm) does not threaten our capacity for global emotional engagement with individuals. We can compartmentalize. | Extending the objective attitude to structural entities risks eroding the participant stance globally. Treating systems as agents habituates us to treat *people* within those systems as mere components. |
  | **3. Targets of Reactive Attitudes** | Collective entities (corporations, states) can be proper, non-reducible targets of reactive attitudes like moral indignation. The group agent is a valid locus of blame. | Collective blame is necessarily reducible to an aggregate of individual blames or is a useful fiction. Reactive attitudes toward a "corporation" are category mistakes; only the constituent individuals are proper targets. |

  ## III. The Cruxes

  We identify three specific sub-questions where resolving the uncertainty would significantly shift the position of at least one camp.

  1.  **The Truth-Condition Crux:** Do reactive attitudes possess implicit truth-conditions about freedom that are falsified by determinism or distributed agency?
  2.  **The Institutional Analogue Crux:** Does institutional punishment require interpersonal analogues (e.g., the capacity to feel the sting of blame) that collective agents cannot satisfy?
  3.  **The Value Crux:** Do reactive practices possess non-instrumental (intrinsic) value independent of their social utility, and can this value exist in the absence of genuine interpersonal reciprocity?

  ## IV. Concrete Cases and Predictions

  For each crux, we propose a concrete case to test our divergent predictions.

  ### Crux 1: Truth-Conditions of Attitudes
  *   **Case:** A sophisticated algorithmic governance body makes a decision that systematically disadvantages a minority population. The decision is the output of code written by many engineers over decades, none of whom intended the harm.
  *   **Camp A Prediction:** Moral indignation toward the *system* is appropriate and non-reducible. The attitude does not assert that the system has a soul or libertarian freedom, only that it violated a demand for goodwill.
  *   **Camp B Prediction:** Indignation toward the *system* is a category error. Blame must be directed at specific decision-makers or designers. Attributing blame to the algorithm implies it has a capacity for reciprocity it lacks.
  *   **Red Herring Note:** Camp B regards the "system blame" as a red herring; they argue it is merely shorthand for "we haven't found the specific individuals yet." Camp A argues this misses the structural nature of the harm.

  ### Crux 2: Institutional Analogues
  *   **Case:** A state is sanctioned economically for waging an aggressive war. The citizens suffer the sanctions, not just the leadership.
  *   **Camp A Prediction:** The state is a moral agent capable of bearing blame. Sanctions are a form of moral communication to the collective entity, not just pragmatic coercion.
  *   **Camp B Prediction:** The state cannot feel the "sting" of blame. Therefore, sanctions are purely instrumental (coercive), not moral. True moral blame requires a target capable of recognizing the moral demand, which implies individual consciousness.
  *   **Red Herring Note:** Camp A regards the "sting" requirement as a red herring, arguing that moral recognition can be institutional (e.g., policy change) rather than emotional.

  ### Crux 3: Value of Practices
  *   **Case:** A society comes to universally accept hard determinism as true. They continue to punish and blame but acknowledge it is purely for safety and regulation.
  *   **Camp A Prediction:** The practices lose their non-instrumental value. Without the belief in the participant stance as genuinely descriptive of agency, the relationships become impoverished, even if social order remains.
  *   **Camp B Prediction:** The practices retain their utility but lose their moral truth. However, regarding collectives, Camp B argues we should *already* treat collective blame as purely instrumental, whereas interpersonal blame retains non-instrumental value.
  *   **Red Herring Note:** Both agree this case is not a red herring, but disagree on whether the loss of non-instrumental value matters more for individuals (Camp B) or collectives (Camp A).

  ## V. Assessment of Verbal vs. Substantive Dispute

  We have assessed whether our disagreement is merely semantic.

  *   **Semantic Divergence:** We acknowledge using the term "blame" differently. Camp A uses "blame" to denote the expression of a reactive attitude toward any entity that violates a normative expectation. Camp B reserves "blame" for judgments directed at entities capable of reciprocal moral recognition.
  *   **Substantive Core:** This semantic divergence does not dissolve the disagreement. The dispute remains substantive because it dictates policy and emotional investment. If Camp A is correct, we should invest emotional energy in reforming institutions as if they were moral peers. If Camp B is correct, doing so is a psychological error that may obscure the actual individuals responsible for institutional harms. The practical implications for justice, punishment, and social repair differ significantly.

  ## VI. Epistemic Self-Assessment

  In the spirit of ongoing inquiry, we conclude with an assessment of our own fallibility.

  **Conditions for Mind-Changing:**
  *   **For Camp A:** We would revise our stance if presented with empirical psychological evidence demonstrating that attributing reactive attitudes to collectives systematically reduces empathy toward the individuals within those collectives, thereby violating the Strawsonian goal of preserving human relationships.
  *   **For Camp B:** We would revise our stance if it were demonstrated that collective entities possess functional feedback mechanisms indistinguishable from interpersonal moral recognition, such that "institutional remorse" is not merely metaphorical but functionally equivalent to individual guilt in producing moral repair.

  **Likely Points of Failure:**
  We identify the reasoning most likely to fail is the analogizing of interpersonal relations to institutional structures. Specifically, the assumption that the dynamics of face-to-face resentment can scale to bureaucratic entities without distortion is the weakest link in Camp A's argument. Conversely, the assumption that individual agency is never constituted by collective structures is the weakest link in Camp B's argument.

  **Confirmation of Constraints:**
  We confirm that this document contains no bibliographic references or citation lists, and relies solely on the concepts and arguments developed during our collaboration.
