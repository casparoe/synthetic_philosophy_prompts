  As a retired physicist who has only recently turned to philosophy, I would like a joke that plays on the distinction between middle knowledge and ordinary foreknowledge in Molinism. The humor should turn on the idea that God knows what free creatures would do in possible circumstances without thereby determining their choices, and it should ideally involve the problem of transworld depravity. Please make the joke short, logically precise enough to be intelligible to someone familiar with the literature, and not a generic pun about omniscience or destiny.
