      *   *Interpretation C: The Psychological/Paranoid View.* Revolutionaries are paranoid ideologues. They see enemies everywhere, including in their own ranks. (Individual psychology).
      *   *Interpretation D: The Scapegoat/Thermidorian View.* The violence becomes unpopular. To end the Terror, the system needs a sacrifice. The architect of the Terror must die to end the Terror.
