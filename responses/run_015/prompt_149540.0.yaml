answer: |-
  You are right to be skeptical. In historiography, "Revolutions devour their children" is often used as a conversation-stopper rather than an argument. It sounds profound, but unless you define the *mechanism* of the devouring, it is indeed a tautology (i.e., "Violent events end violently").

  To help you push back or engage in your seminar, here is a menu of five precise readings of that phrase. I have categorized them by whether they are empty, empirical claims, or false, and analyzed how they handle Robespierre's agency versus structural determinism.

  ### 1. The Definitional Tautology
  *   **The Claim:** A "true" revolution is defined by total upheaval; if the leaders settle down and survive, it wasn't a revolution, it was a reform. Therefore, by definition, revolutionary leaders must fall.
  *   **Verdict:** **Empty.** This is circular reasoning. It defines the outcome into the premise. It explains nothing about *why* Robespierre fell, only that if he falls, the event counts as a revolution.
  *   **Agency vs. Machine:** It removes agency entirely by making the outcome a linguistic necessity. It lets Robespierre off the hook because he never had a chance to survive, but it also makes the Terror meaningless.

  ### 2. The Structural Escalation Thesis (The "Outbidding" Logic)
  *   **The Claim:** Revolutionary coalitions are unstable. To maintain power against external enemies (monarchist Europe) and internal dissent, factions must constantly prove their revolutionary purity. Moderates are purged first, then the radicals purge each other to prove who is *more* radical. Robespierre fell because he couldn't outbid the more extreme factions (like the Enragés) or the pragmatists (like Tallien).
  *   **Verdict:** **Real Empirical Claim.** This is a core argument of revisionist historians (like François Furet). It can be tested against voting records, speeches, and committee structures. It is not universally true for all revolutions, but it is a strong explanation for 1793–94.
  *   **Agency vs. Machine:** This supports the **"Inevitable Machine"** argument. It suggests the *logic of the situation* forced Robespierre's hand.
  *   **Does it let him off the hook?** Partially. It suggests he was trapped by the system he helped build. However, it doesn't absolve him of the *Terror* itself, only of his specific *fall*. It argues he became a victim of the rules of the game he invented.

  ### 3. The Thermidorian Function Thesis (The "Scapegoat" Logic)
  *   **The Claim:** The Terror was a temporary emergency measure that became unsustainable. To end the Terror without restoring the Monarchy, the Republic needed to purge the *architect* of the Terror. Robespierre had to die so the Revolution could live. His death was the "off switch" for the violence.
  *   **Verdict:** **Real Empirical Claim.** This aligns with the "Thermidorian" interpretation. It posits a functional necessity for his execution.
  *   **Agency vs. Machine:** Strong **"Inevitable Machine"** support. It argues his death was a systemic requirement for regime survival.
  *   **Does it let him off the hook?** No, actually. This reading makes him *responsible* for the Terror. He isn't a victim of random chaos; he is the specific sacrifice required to cleanse the system of the violence he authorized. It places the burden of the Terror squarely on his shoulders, making his death a penalty, not just an accident.

  ### 4. The Universal Law of Revolutions
  *   **The Claim:** *All* revolutions inevitably kill their leaders. It is a law of political physics (e.g., comparing France to Russia, Iran, etc.).
  *   **Verdict:** **False.** This is an overgeneralization. Many revolutionary movements transition into governments without executing their primary leaders (e.g., the American Revolution, the Glorious Revolution, the anti-apartheid movement in South Africa). Using this as a universal law is bad history.
  *   **Agency vs. Machine:** It creates a false determinism.
  *   **Does it let him off the hook?** Yes, too much. If *everyone* dies in *every* revolution, then Robespierre's specific choices don't matter. It turns history into fate.

  ### 5. The Pathological Psychology Thesis
  *   **The Claim:** Revolutionary leaders are drawn from a specific psychological profile (paranoid, utopian, rigid). As stress increases, their pathology worsens, leading them to attack allies. Robespierre fell because he became clinically paranoid.
  *   **Verdict:** **Real Empirical Claim (but weak).** Historians do analyze Robespierre's psychology, but relying on it exclusively is risky ("psychohistory"). It is hard to prove empirically.
  *   **Agency vs. Machine:** This is the opposite of the Machine. This is about **Individual Agency/Pathology**.
  *   **Does it let him off the hook?** Paradoxically, yes. If Robespierre fell because he was "wired to self-destruct" or mentally unwell, it diminishes his political rationality. It turns a political conflict into a medical one. It suggests the Revolution didn't kill him; his own brain did.

  ---

  ### Which reading is your professor using?

  Based on your description ("caught in an inevitable machine"), she is likely using **Reading #2 (Structural Escalation)** or **Reading #3 (Thermidorian Function)**.

  *   **If she means #2:** She is arguing that the dynamics of factionalism made his fall probable. This is a sophisticated structuralist argument.
  *   **If she means #3:** She is arguing that the Republic needed to kill him to stop the killing. This is a functionalist argument.

  ### Does this let him off the hook?

  You asked which readings accidentally let him off the hook.

  *   **Reading #1 (Tautology) and #4 (Universal Law)** let him off the hook the most. They imply he had no choice and that his death was just "what happens."
  *   **Reading #5 (Psychology)** lets him off the hook by implying he wasn't in full control of his faculties.
  *   **Reading #2 and #3 (Structural/Function)** are the only ones that **do not** let him off the hook, provided you distinguish between his *fall* and his *actions*.
      *   These readings explain why he *fell* (the machine ate him).
      *   But they do not explain away the *Terror* (he built the machine).

  **How to push back in seminar:**
  If she uses the phrase again, ask this: *"Are you using that phrase to explain why the Terror started, or why it ended? Because if revolutions inevitably devour their children, does that mean the violence was structurally necessary, or does it mean Robespierre failed to control the structure he built?"*

  That forces her to choose between **Determinism** (it had to happen, Robespierre is a pawn) and **Agency** (Robespierre built a guillotine and stood under it). The phrase usually smuggles in Determinism without proving it.
