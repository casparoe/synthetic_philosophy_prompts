prompt: |-
  In my french rev seminar last week the profesor kept saying revolutions devour thier children whenever someone brought up Robespierre falling to the guillotine. She tossed it out like it explained why the Terror happened, but I'm not sure if it's even a claim or just a fancy tautology. Could you lay out the different precise things that phrase could be saying — like that radical movements structurally have to purge moderates, or that the violence needed to smash the old order always rebounds inward, or that revolutionary leaders are psychologically wired to self-destruct? I want a menu: for each reading say if it's empty, if it's a real empirical claim about the Revolution, and if it's false. She seemed to be using it to argue that Robespierre wasn't just paranoid but was caught in an inevitable machine — which reading actually does that work, and which ones accidentally let him off the hook by making it about individual psychology?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

