      *   *C (Psychological):* Real empirical claim (about personalities). But the user asked which ones *accidentally let him off the hook*. Actually, blaming psychology makes it about *him*, not the structure. Wait, if it's "revolutionaries are wired to self-destruct," that's structural psychology. If it's "Robespierre was paranoid," that's individual. The prompt asks about "revolutionary leaders are psychologically wired." That sounds like a general claim.
      *   *D (Scapegoat/Thermidor):* Strong empirical claim. Explains *why* he fell specifically when he did. Supports the "machine" idea (the system needed a reset).
      *   *E (Moral):* Empty/Philosophical. Not historical explanation.

  5.  **Address the Specific Question about "Inevitable Machine" vs. "Letting Him Off the Hook":**
      *   *Inevitable Machine:* Requires a structural explanation (Interpretation B or D).
      *   *Letting Him Off the Hook:* If it's purely structural ("he had no choice"), that absolves moral responsibility. If it's purely psychological ("he was crazy"), that isolates him.
      *   *Nuance:* The professor seems to be arguing for Structuralism (B/D). The student worries this absolves Robespierre. I need to clarify that structural explanations explain the *context* of his fall, not necessarily his *innocence*. However, saying "it was inevitable" does reduce agency.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the frustration. It *is* often used as a cliché. Validate the student's skepticism.
      *   *The Menu:* Create distinct categories.
          1.  **The Tautological Reading:** "Revolution" = "Chaos that eats leaders." (Verdict: Empty).
