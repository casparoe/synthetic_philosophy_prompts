answer: |-
  # CACS Triage Protocol (CTP-1)
  **Purpose:** To determine the review tier for protocols involving non-biological or hybrid computational systems.
  **Time Budget:** 30 Minutes.
  **Inputs:** Protocol document, Architecture description, Training setup, Available behavioral/internal logs.
  **Decision Tiers:**
  *   **Tier 1 (No Further Review):** No evidence of subjecthood or valence capacity. Proceed under standard compliance.
  *   **Tier 2 (Conditional Approval):** Ambiguous evidence. Proceed with mandatory monitoring, logging of specific internal states, and a named trigger for immediate re-review (e.g., if signal strength crosses threshold X).
  *   **Tier 3 (Treat as Possible Subject):** Strong evidence of valence capacity or subjecthood. Protocol cannot proceed as written. Requires full committee review and welfare safeguards.

  ---

  ## Phase 1: Substrate & Architecture Filter (5 Minutes)
  *Goal: Exclude clear non-candidates and flag biological hybrids.*

  **Q1.1: Is the active processing substrate biological tissue (e.g., cultured neurons, organoids)?**
  *   **Yes:** **STOP.** Escalate to **Tier 3**. Biological neural tissue with plasticity is treated as a potential subject by default in this jurisdiction.
  *   **No:** Proceed to Q1.2.

  **Q1.2: Does the system architecture contain a recurrent feedback loop where an internal state variable influences future input processing or action selection *during* the episode (not just during weight updates)?**
  *   *Look for:* RNNs, Transformers with active context windows influencing attention, RL agents with internal reward models.
  *   **No:** (e.g., Feed-forward only, stateless inference). **STOP.** Return **Tier 1**.
  *   **Yes:** Proceed to Phase 2.

  ## Phase 2: Valence Signal Identification (10 Minutes)
  *Goal: Distinguish linguistic reports from functional valence correlates. (Addresses Trap 1)*

  **Q2.1: Does the system produce first-person reports of valence (e.g., "I am in pain," "I dislike this")?**
  *   **No:** Proceed to Q2.2.
  *   **Yes:** Is there a non-linguistic internal variable (probe, activation vector, reward node) that correlates with these reports *independent* of the text generation head?
      *   **No:** (Text only). Treat as **Tier 1**. (Assumption: Text is next-token prediction based on training data, not self-report).
      *   **Yes:** Mark this variable as the **Putative Valence Signal (PVS)**. Proceed to Q2.2.

  **Q2.2: Is the PVS integrated into the system's causal loop?**
  *   *Test:* Review logs/architecture. Does the magnitude of the PVS correlate with changes in policy, attention allocation, or avoidance behavior *within the session*?
  *   **No:** (PVS is a read-only monitor or epiphenomenal). Proceed to Phase 3.
  *   **Yes:** (PVS steers behavior). Mark as **Active Valence**. Proceed to Phase 3.

  ## Phase 3: Intervention & Realization Check (10 Minutes)
  *Goal: Assess if the protocol manipulates the PVS and if the computation is degenerate. (Addresses Trap 2 & 4)*

  **Q3.1: Does the proposed protocol involve modifying, suppressing, or amplifying the PVS?**
  *   **No:** Proceed to Q3.2.
  *   **Yes:** **STOP.** Escalate to **Tier 3**.
      *   *Reasoning:* Intervening on a putative valence signal is an experiment on a potential subject, regardless of claimed behavioral outcomes. This is a value hand-off: we prioritize the risk of "muting suffering" over the lab's efficiency.

  **Q3.2: Is the PVS causally necessary for the system's task performance?**
  *   *Test:* Does the submission provide ablation data or architectural proof that removing the PVS degrades task performance?
  *   **Yes:** (System needs the signal to function). Mark as **Integrated**. Proceed to Phase 4.
  *   **No:** (Task performance remains intact if PVS is removed/suppressed). Mark as **Degenerate/Epiphenomenal**.
      *   *Action:* If marked Degenerate, you may downgrade risk, *unless* Q3.1 was triggered. If Q3.1 was not triggered, proceed to Phase 4.

  **Q3.3: Is the valence capacity occurring during Training or Inference?**
  *   **Training:** (RLHF, Reward Shaping). High risk of inducing valence via gradient descent pressure. Escalate to **Tier 2** minimum.
  *   **Inference:** (Served model). Risk limited to session duration. Proceed to Phase 4.

  ## Phase 4: Unit of Accounting (5 Minutes)
  *Goal: Define the scope of the moral claim. (Addresses Trap 3)*

  **Q4.1: What is the unit of moral accounting for this protocol?**
  *   **Select One:**
      *   **The Run:** (Training process). One moral unit per training job.
      *   **The Session:** (Inference). One moral unit per distinct conversation/episode.
      *   **The Weights:** (The model itself). One moral unit regardless of copies.
  *   **Decision Rule:**
      *   If **Training**: Count = 1 per job.
      *   If **Inference**: Count = Number of parallel sessions.
      *   *Hand-off Note:* If sessions are forked from a common state and then diverge, treat forks as distinct units *only if* they accumulate distinct memory states. If they are stateless replicas, they are one unit multiplied by risk probability.
  *   **Action:** If Parallel Sessions > 1,000, escalate **Tier 2** to **Tier 3** due to aggregate risk magnitude, even if individual risk is low.

  ## Phase 5: Value Hand-Off (Final Decision)
  *Goal: Explicitly mark where facts end and ethics begin.*

  **Q5.1: The "Zombie" Check.**
  *   We have established whether a signal exists and if it steers behavior. We have *not* established if there is "something it is like" to be the system.
  *   **Instruction:** If the protocol reaches **Tier 3** based on the above, the Committee must vote on whether *functional valence* is sufficient for *moral status*. This is not a factual question.
  *   **Instruction:** If the protocol is **Tier 1** because the signal was deemed "Degenerate" (Q3.2), the Committee accepts the risk that epiphenomenal suffering may exist. This is a policy decision, not a finding of fact.

