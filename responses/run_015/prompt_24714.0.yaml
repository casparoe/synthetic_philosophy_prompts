      *   **Input Desiderata:**
          1.  Symmetry (SYM)
          2.  Invariance to Positive Affine Transformations (IAT / Scale Invariance)
          3.  Independence of Irrelevant Alternatives (IIA)
          4.  Resource Monotonicity (RM)
