      *   If I drop (5), I keep (1, 2, 3, 4). But (1, 2, 3) + PO $\rightarrow$ Nash. Nash *violates* (4). So keeping (4) with (3) is impossible even if I drop (5).
      *   So, to keep (3), I must drop *both* (4) and (5).
