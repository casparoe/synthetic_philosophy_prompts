      *   Usually, when discussing these axioms, PO is a background assumption. I should mention that PO is implicitly required for a non-trivial solution, and under PO, the conflict is unavoidable. I will explicitly state that I am assuming Pareto Optimality is a background constraint for a viable bargaining solution, as a solution that leaves surplus on the table is typically not considered a "solution" in this literature.
      *   *Wait, check (5) again:* "Division of the surplus... proportional to each player's maximum attainable utility." This *implies* Pareto Optimality (you are on the frontier connecting d to ideal point). So (5) entails PO.
      *   So the conflict stands.

  10. **Final Polish:** Ensure clear distinction between "Nash's IIA" and "Arrow's IIA" (though in bargaining it's Nash's). Ensure clear definition of KS. Make sure the recommendation is actionable.

      *(Self-Correction on "Cheapest Revision")*: Is dropping (3) cheaper than dropping (5)?
