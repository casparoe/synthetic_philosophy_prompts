      *   *Analysis:* These aren't confusions; they are genuine costs of $\rho = 0$ in a utilitarian framework. Avoiding them usually requires either accepting them (Parfit), modifying the aggregation rule (average utilitarianism, critical level), or reintroducing discounting (which the argument forbids).
