      *   *Diagnosis:* The argument conflates "generational boundaries" with "time itself." Exponential discounting doesn't need generations ($G_1, G_2$); it needs time ($t$). P1 says generations aren't discrete. It doesn't say *time* isn't continuous. If discounting is a function of continuous time $t$, P3 doesn't kill it.
