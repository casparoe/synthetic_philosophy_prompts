answer: |-
  hey, thanks for sending this over, it's a fascinating angle on the chick-sexing case becuase it moves past the usual rylean debate about whether skill is just applied rules. when you look at the sexers who can't articulate what they see, the temptation is to say this is pure knowing-how, a non-propositional grip on the world that defies intellectualist reduction, but if we dig deeper into whether it's built of tacit propositional fragments, we hit a wall since the fragments never surface even under pressure. the real insight comes when you look at the pipeline and notice that if the knowledge colapses when the training schools shut down, it suggests the skill isn't lodged securely in the individual mind but is sustained by the institutional loop of correction and feedback. this means the epistemic agents aren't just the sexers but the schools and the industry that validate the success, shifting the focus from internal states to external maintenance. the evidence here isn't verbal justification but economic viability and accuracy rates, which traditional epistemology is silent on becuase it assumes knowledge is a state an individual possesses rather than a flow maintained by a system. so this isn't just confirmation or an anomaly, it's something the distinction never anticipated, showing that knowing-how might be a socially anchored kind rather than a mental state, and that the theory needs to account for the scaffolding that keeps the skill alive across generations. anyway, hope this helps map out the dataset entry, let me know if you need to push the social angle further.
