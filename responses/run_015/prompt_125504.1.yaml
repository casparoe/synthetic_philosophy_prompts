answer: |-
  # Project Proposal: Decoupling Logical and Causal Correlations in Superrational Decision Problems

  ## 1. Introduction and Core Thesis

  Decision theory has long struggled with scenarios where an agent's choice is correlated with the choices of others, not through direct communication or causal influence, but through shared reasoning processes. The standard literature often groups these scenarios together under the umbrella of "Newcomb-like problems" or "logical decision problems." In this cluster, two puzzles stand out as canonical test cases: the Platonia Dilemma and the Luring Lottery. The prevailing consensus, particularly among proponents of Functional Decision Theory (FDT) and Superrationality, is that these puzzles test the same underlying mechanism. They are treated as identical challenges to Causal Decision Theory (CDT), demanding a decision rule that recognizes correlations between agents who share similar source code or reasoning algorithms.

  This proposal argues that this consensus is mistaken. While both puzzles involve correlations that CDT fails to capture, the *nature* of those correlations is fundamentally distinct. In the Platonia Dilemma, the correlation is strictly logical: agents are identical algorithms processing identical inputs, meaning their outputs are necessarily the same. In the Luring Lottery, the correlation is causal but masked by a probabilistic gate: agents' actions causally contribute to a aggregate variable (the total pool of entries) which then determines the probability of payout.

  Conflating these two mechanisms obscures a critical vulnerability in current decision theories. If we treat the Luring Lottery as a purely logical correlation problem, we risk licensing forms of reasoning that allow agents to believe they can influence independent probabilistic gates simply by virtue of reasoning similarly to others. Conversely, if we treat Platonia as a mere probabilistic coordination problem, we lose the normative force of superrationality.

  The goal of this project is to rigorously separate these two correlation types. I propose to demonstrate that a principled decision theory must be able to cooperate in Platonia (respecting logical identity) without succumbing to "magical thinking" in the Luring Lottery (respecting causal independence). I will outline a method for constructing a hybrid puzzle that isolates these variables, analyze how existing decision rules (CDT, EDT, FDT) perform on this distinction, and define the criteria for a successful decision rule that navigates the split without collapsing into Evidential Decision Theory (EDT).

  ## 2. The Conceptual Split: Logical vs. Causal-Probabilistic Correlation

  To build a proposal that holds water, we must first define the distinction with precision. The literature often skips this step, jumping immediately to payoff matrices. However, the structure of the dependency determines the correct decision rule.

  ### 2.1 The Platonia Dilemma: Logical Identity
  In the Platonia Dilemma, a group of agents is told that if exactly one person sends a letter, that person wins a prize. If zero or more than one send letters, no one wins. Communication is impossible. The superrational argument posits that if all agents are rational and know they are all rational, they are effectively running the same algorithm. Therefore, they will all arrive at the same decision. If the decision is "send," everyone sends, and everyone loses. If the decision is "don't send," no one sends, and everyone loses. The only winning move is a mixed strategy where every agent randomizes with probability $1/N$.

  The correlation here is **logical**. It does not matter if the agents are physically separated or if their actions occur at different times. What matters is that the output of the function $Agent(Information)$ is identical for all agents. My choice does not *cause* your choice; rather, my choice *is* your choice, in the sense that they are the same output of the same function. The counterfactual is: "If I were to output 'Send', then the algorithm outputs 'Send', so you output 'Send'." This is a counterfactual about logical necessity, not causal propagation.

  ### 2.2 The Luring Lottery: Causal Aggregation
  In the Luring Lottery, agents submit an integer $N$. The prize pool is fixed (say, $1,000,000), but the probability of any single agent winning is proportional to their entry $N$ divided by the sum of all entries. Alternatively, in some formulations, the prize itself is divided by the sum of entries. In either case, the expected utility depends on the aggregate sum of all choices.

  The correlation here is **causal-probabilistic**. My entry $N_{me}$ causally adds to the denominator $S = \sum N_i$. Your entry $N_{you}$ also causally adds to $S$. We are correlated because we are both responding to the same incentive structure, but our actions are distinct causal contributions to a shared probabilistic gate. If I change my entry, I change the probability distribution of the outcome directly, regardless of what you do. If you change your entry, you change the probability distribution I face.

  The standard superrational treatment assumes that because we are both rational, we will pick the same $N$. Thus, I should choose $N$ as if my choice determines yours. But this glosses over the causal structure. In Platonia, the mechanism is binary and logical (Send/Don't). In the Lottery, the mechanism is continuous and aggregative. The risk is that a decision theory might treat the Lottery as if my choice *logically necessitates* yours, ignoring the fact that even if we reason identically, the causal impact of my specific $N$ on the total sum is distinct from the logical implication of my reasoning.

  ### 2.3 The Conflation Problem
  Current literature, particularly in the development of FDT, tends to treat both cases as instances of "logical correlation." The argument is that in both cases, the agent should reason: "If I choose $X$, then all copies of me choose $X$." This works well for Platonia. However, in the Luring Lottery, this reasoning can lead to pathological results if the causal structure of the payout function is ignored.

  For example, if the Lottery payout is strictly a function of the sum, and I assume my choice determines the sum via logical correlation, I might optimize for a global maximum that assumes I control the total sum entirely. But I only control my contribution. The rest of the sum is determined by the physical actions of others, which are only correlated with mine, not identical to mine in a way that allows me to ignore their causal independence.

  The core thesis of this project is that **Logical Correlation (Platonia) implies identity of output, whereas Causal-Probabilistic Correlation (Lottery) implies interdependence of inputs.** A robust decision theory must distinguish between "I am you" (Platonia) and "I affect the same pot as you" (Lottery).

  ## 3. Literature Gap: The Payoff Matrix Blind Spot

  Why has this distinction been missed? The primary culprit is the reliance on abstract payoff matrices. When decision theorists model these problems, they typically reduce them to a table of utilities based on joint actions.

  *   **Platonia Matrix:** Rows are my actions, Columns are "Others' Actions." Payoffs are assigned based on the count.
  *   **Lottery Matrix:** Rows are my entry size, Columns are "Total Others' Entry." Payoffs are calculated via the formula.

  Once reduced to matrices, the structural difference vanishes. Both look like games where my payoff depends on the column choice. The literature then asks: "What probability should I assign to the columns?" CDT says: "Causal independence, assign fixed probabilities." EDT says: "Conditional on my action, update the probabilities." FDT says: "Logical dependence, the column is a function of my row."

  By jumping straight to the matrix, we lose the metadata about *why* the columns are correlated with the rows. We lose the information about whether the column is determined by a copy of my algorithm (Platonia) or by independent agents contributing to a shared causal pool (Lottery). This abstraction is useful for solving specific games, but it is disastrous for foundational decision theory, which aims to prescribe rules for *how* to model the world, not just how to maximize within a pre-modeled table.

  Furthermore, existing critiques of CDT focus on its failure to one-box in Newcomb's Problem or cooperate in Prisoner's Dilemma. These are often lumped together with Platonia and Lottery as "failures to account for correlation." This project argues that this lumping is too coarse. CDT fails in Platonia because it ignores logical identity. It might fail in the Lottery for a different reason: it ignores the strategic feedback loop of the aggregate. Conversely, EDT might succeed in both, but for the wrong reasons (spurious evidential links). We need to know if a theory can succeed in Platonia for logical reasons without succeeding in the Lottery for evidential reasons.

  There is a gap in the literature for a formal analysis that explicitly models the *source* of the correlation as a variable in the decision problem, rather than a fixed parameter of the joint probability distribution. This project aims to fill that gap.

  ## 4. Methodology: The Hybrid Puzzle and Decision Rule Analysis

  To test the hypothesis that these correlations are distinct and require different handling, I cannot rely solely on the existing puzzles. I need to construct a scenario that isolates the variables.

  ### 4.1 Designing the Hybrid Puzzle
  I propose to design a "Decoupled Lottery" thought experiment. This puzzle will feature two conditions:

  1.  **Condition A (Logical Gate):** Agents are known to be exact algorithmic copies. The payout depends on whether the *outputs* match. This mirrors Platonia.
  2.  **Condition B (Causal Gate):** Agents are known to be algorithmic copies, but the payout depends on the *sum of physical energy expended* to produce the output, where the energy cost is stochastic and independent for each agent.

  In Condition A, if I output '1', you output '1'. The correlation is perfect.
  In Condition B, if I output '1', you output '1' (logical correlation), but the *cost* or *impact* of that output on the prize pool is subject to independent noise (causal independence).

  The challenge for the decision theory is to recognize that in Condition A, my decision determines the joint outcome. In Condition B, my decision determines my contribution, and only logically correlates with your contribution, but the *impact* of your contribution is causally independent of my specific action's physical realization.

  A more concrete version:
  *   **The Setup:** 100 agents.
  *   **The Choice:** Press a button (1) or don't (0).
  *   **The Twist:** In the **Platonia Variant**, if exactly one button press is registered, that agent wins. (Standard).
  *   **The Twist:** In the **Lottery Variant**, the prize is $P / (\sum \text{Buttons})$. Everyone wins a share.
  *   **The Hybrid:** The prize is $P / (\sum \text{Buttons})$, BUT the agents are running on the same source code.

  In the Hybrid, CDT says: "My button doesn't cause yours. I should maximize my share given the expected sum of others."
  FDT says: "My button logically implies yours. I should choose as if I control the sum."
  EDT says: "If I press, it's evidence others pressed. Update probabilities."

  The critical test is whether "controlling the sum" (FDT) is normatively correct in the Hybrid. If I treat the sum as logically controlled by me, I might under-contribute to avoid diluting the pot, assuming others will do the same. But if the causal mechanism of the payout is sensitive to the *actual* count, and there is any noise in the execution (e.g., button failures, network latency), the logical control is imperfect.

  I will analyze this Hybrid using three frameworks:
  1.  **CDT:** Will likely defect/over-contribute, ignoring the correlation.
  2.  **EDT:** Will likely cooperate/under-contribute, but potentially based on spurious evidence.
  3.  **FDT:** Will likely cooperate/under-contribute based on logical control.

  The goal is to see if FDT's "logical control" over the sum is justified. If the sum is a causal aggregate of independent physical events (even if triggered by identical code), does it make sense to say "My choice sets the sum"? Or does it make more sense to say "My choice sets my contribution, and predicts yours"?

  ### 4.2 Analyzing the Decision Rule
  Beyond the puzzle, I will attempt to sketch the requirements for a "Decoupled Decision Rule" (DDR). This rule would need to:
  1.  Identify the **substrate** of the correlation. Is it the algorithm (logical) or the physical outcome (causal)?
  2.  Apply logical counterfactuals only to the algorithm output.
  3.  Apply causal counterfactuals to the physical aggregation.

  For example, in the Hybrid, a DDR would reason: "If I press, my algorithm presses. Therefore, all copies press. Therefore, the *intended* sum is $N$. However, the *actual* payout depends on the *registered* sum. If there is noise, I should treat the registered sum of others as causally independent of my specific registration, even if their intention is correlated."

  This is a subtle distinction. It suggests that FDT might be too coarse-grained. It treats "Algorithm Output" and "Physical Realization" as the same node in the causal graph. This project argues they should be separate nodes. The logical correlation holds between Algorithm Nodes. The causal correlation holds between Physical Nodes.

  ### 4.3 Formalization Strategy
  Given the scope of a semester project, a full mathematical formalization of a new decision theory is likely out of reach. Instead, I will use causal graph diagrams to illustrate the structural difference.
  *   **Graph 1 (Platonia):** Decision Node $D$ $\rightarrow$ Action $A$. $D$ is identical for all agents. Payoff $U$ depends on $\sum A$.
  *   **Graph 2 (Lottery):** Decision Node $D$ $\rightarrow$ Action $A$ $\rightarrow$ Physical Event $E$. Payoff $U$ depends on $\sum E$.
  *   **The Distinction:** In Platonia, $A$ and $E$ are effectively the same. In Lottery, $E$ includes noise.
  *   **The Test:** Does the decision rule condition on $D$ or on $E$?

  I will demonstrate that conditioning on $D$ (FDT) works for Platonia but risks error in Lottery if $A \neq E$. Conditioning on $E$ (CDT) works for Lottery but fails Platonia. The successful rule must condition on $D$ for prediction of others, but on $E$ for calculation of causal impact.

  ## 5. Success and Failure Conditions

  It is vital to be honest about what constitutes a result. This is a conceptual project, not an empirical one.

  ### 5.1 Successful Outcome
  A successful result would be a clear conceptual demarcation that survives scrutiny. Specifically:
  1.  **Demonstrable Divergence:** I show a case where treating the Lottery like Platonia leads to a dominated strategy (e.g., leaving money on the table or accepting a sure loss).
  2.  **Rule Specification:** I can articulate a modification to FDT (or a new hybrid rule) that correctly handles both cases. For instance, "Apply logical counterfactuals to the strategy selection, but causal counterfactuals to the resource aggregation."
  3.  **EDT Immunity:** I demonstrate that this distinction is not just a rebranding of EDT. EDT conditions on the action as evidence. My proposed rule conditions on the algorithm as a logical fact. The difference must be sharp, perhaps in how they handle cases where the correlation is known to be imperfect.

  ### 5.2 Failure Modes
  I must anticipate where this project might fail.
  1.  **Collapse to EDT:** The most significant risk is that the "principled way to keep logical-correlation reasoning without letting causal-influence reasoning slip back in" turns out to be mathematically equivalent to EDT. If the distinction I draw relies on updating probabilities based on the action, it is EDT. I need to ensure the logic rests on *counterfactual dependence of the algorithm*, not *evidential updating*. If I cannot distinguish my proposed rule from EDT, the project fails to advance the field beyond the current CDT/EDT/FDT triad.
  2.  **Triviality:** It might turn out that the Luring Lottery *is* just a logical correlation problem, and my intuition about "causal gates" is a confusion. If the standard FDT treatment is proven robust against my Hybrid Puzzle, then the distinction is illusory. I need to be open to the possibility that the literature is right and I am wrong. A paper concluding "The distinction is illusory" is still a valuable result, but it changes the deliverable from "New Rule" to "Defense of Status Quo."
  3.  **Scope Creep:** Attempting to formalize a new decision rule is a PhD thesis, not a semester project. If I get bogged down in the math of the Hybrid Puzzle, I may not reach the normative conclusion.

  ### 5.3 Mitigation
  To mitigate the "Collapse to EDT" risk, I will focus heavily on the *counterfactual* structure. EDT says "If I see myself doing X, I believe Y." FDT says "If I were to do X, Y would happen." I will ensure my proposal emphasizes the subjunctive mood (logical counterfactuals) rather than the indicative mood (conditional probabilities).
  To mitigate Scope Creep, I will limit the formalization to causal graphs and algebraic expected utility calculations, avoiding full axiomatic derivations.

  ## 6. Scope and Feasibility Check

  This project is designed for a single semester, targeting a 5000-word paper or a 20-minute talk.

  ### 6.1 Workload Assessment
  *   **Weeks 1-3:** Literature review and precise definition of Platonia vs. Lottery structures. (Focus: Ensuring I am not attacking a strawman of FDT).
  *   **Weeks 4-6:** Construction of the Hybrid Puzzle. Iterative testing against CDT, EDT, FDT.
  *   **Weeks 7-9:** Analysis of the Decision Rule. Drafting the argument for the Logical/Causal split.
  *   **Weeks 10-12:** Writing and refinement. Ensuring the distinction between "algorithm output" and "physical realization" is clear.

  ### 6.2 Deliverable Fit
  *   **5000-Word Paper:** This length is sufficient for the conceptual argument and one detailed thought experiment. It is *not* sufficient for a full axiomatic proof of a new decision theory. I will frame the paper as a "Conceptual Argument for Decoupling" rather than "A New Decision Theory." This manages expectations.
  *   **20-Minute Talk:** This is a tight fit. A 20-minute talk allows for the Intro, The Split, and The Hybrid Puzzle. It leaves little time for the Decision Rule analysis. If I choose the talk format, I will focus on the Puzzle as the primary contribution, leaving the Rule as "Future Work."

  ### 6.3 Resource Requirements
  *   Access to standard decision theory texts (no specific citations needed in the proposal, but I need to be familiar with the arguments).
  *   Feedback from peers familiar with FDT/CDT debates to stress-test the "Logical vs. Causal" distinction.
  *   Time for iterative rewriting. The concepts are subtle; clarity is paramount.

  ### 6.4 Honest Limitations
  I acknowledge that 5000 words is short for a topic that has stumped philosophers for decades. I am not claiming to solve the problem of logical correlation. I am claiming to identify a specific conflation in the literature that, once exposed, clarifies why certain solutions feel unsatisfactory. The scope is *diagnostic* and *propositional*, not *definitive*. I am proposing a research direction, not closing the book.

  ## 7. Detailed Argument Structure (Draft Outline)

  To ensure the 5000-word target is met with density rather than fluff, I have prepared a tentative outline for the final paper.

  **I. Introduction (750 words)**
  *   The Superrational Consensus.
  *   The Intuition of Difference (Platonia feels different from Lottery).
  *   Thesis: The correlation mechanisms are distinct (Logical Identity vs. Causal Aggregation).
  *   Roadmap.

  **II. The Anatomy of Correlation (1000 words)**
  *   Defining Logical Correlation: Algorithmic identity, counterfactual robustness.
  *   Defining Causal-Probabilistic Correlation: Shared pools, independent contributions, aggregate functions.
  *   Why Payoff Matrices Hide This: The abstraction problem.

  **III. The Luring Lottery Revisited (1000 words)**
  *   Standard Analysis (FDT/Superrational).
  *   The Causal Gate Critique: Why treating the Lottery as purely logical is risky.
  *   Example: Noise in execution. If my button jams, does your logic break? No. But FDT might imply it should.

  **IV. The Hybrid Puzzle (1250 words)**
  *   Setup: Algorithmic copies with independent physical noise.
  *   Analysis:
      *   CDT: Ignores the copy.
      *   EDT: Updates on the noise.
      *   FDT: Treats noise as logically correlated?
  *   The Decoupled Solution: Reason logically about the intent, causally about the noise.

  **V. Implications for Decision Theory (1000 words)**
  *   Can we save FDT? (Modifying the causal graph).
  *   Or is this a win for EDT? (Addressing the collapse risk).
  *   The Normative Claim: Why we *should* distinguish them (avoiding magical thinking).

  **VI. Conclusion (500 words)**
  *   Summary of the split.
  *   Final verdict on feasibility.
  *   Call for further formalization.

  ## 8. Anticipated Challenges and Counterarguments

  I expect the strongest counterargument to come from the FDT community. The standard rebuttal will be: "FDT already handles this via the causal graph. If the physical realization is independent, the graph should reflect that."

  My counter to this is: "If the graph reflects that, then FDT is already admitting the distinction I am proposing. But the literature often speaks of 'controlling the output' in a way that blurs the physical realization. I am making explicit what is often implicit."

  Another counterargument: "The Luring Lottery *is* a logical correlation problem because the rational choice is determined by the logic of the game, not the physics."
  My counter: "The rational choice is logical, but the *payoff realization* is physical. Decision theory must bridge the gap between the choice and the payoff. If the bridge is causal, we need causal reasoning."

  I will address these counterarguments in Section V of the paper. For the proposal, it is sufficient to note that I am aware of them and have planned space to address them.

  ## 9. Why This Matters

  Why should a workshop care about this distinction?
  1.  **AI Safety:** As we build autonomous agents, we need to know if they should treat other agents as copies (logical) or competitors (causal). Misclassifying a causal competition as a logical cooperation problem could lead to catastrophic coordination failures (e.g., in automated trading or resource allocation).
  2.  **Foundational Clarity:** Decision theory is currently in a state of fragmentation (CDT vs. EDT vs. FDT vs. ADT). Identifying structural similarities and differences in the test cases helps unify the field.
  3.  **Avoiding Magic:** We want decision theories that are grounded in physical reality. If a theory implies I can influence a random number generator because I reason similarly to someone else touching it, that is "magic." We need to draw the line where logic ends and physics begins.

  ## 10. Conclusion

  The Platonia Dilemma and the Luring Lottery are the twin pillars of superrational decision theory. They are often treated as two faces of the same coin. This project argues they are minted from different metals. One is a test of logical identity; the other is a test of causal interdependence.

  By conflating them, we risk building decision theories that are either too weak (CDT, missing the logical link) or too strong (FDT/EDT, accepting spurious causal links). This proposal outlines a path to decouple these correlations. Through the construction of a Hybrid Puzzle and a careful analysis of decision rules, I aim to show that a principled distinction is possible and necessary.

  The scope is ambitious for a semester, but by focusing on the conceptual distinction and a single strong thought experiment, it is achievable. The result will be a 5000-word paper that challenges the standard taxonomy of decision problems and offers a clearer framework for analyzing correlation in multi-agent systems. Whether the result is a new decision rule or a refined defense of an existing one, the clarification of the Logical vs. Causal split is a contribution worth making.

  I am ready to begin the literature review and initial modeling of the Hybrid Puzzle immediately. The distinction is clear in my mind; the work now is to make it clear on the page, ensuring that "correlation" is never used without the qualifier "logical" or "causal."

