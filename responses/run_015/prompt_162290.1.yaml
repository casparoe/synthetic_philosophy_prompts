  I count the minor grievances of day,
  Against the petty pleasures that we sum.
  A dusty room is swept by breeze's play,
  A headache fades when quiet hours come.
  The rate is posted on the plaster wall,
  We find a cure for every minor test.
  No surplus grief remains to make us fall,
  When pleasure gives the sufferer truest rest.
  But then the cluster-pain breaks through the red.
  The columns freeze; there lacks a counting sign.
  The mild pains die; the pleasures too are dead.
  No sum of naps can cross that brutal line.
  Relief to stop the math, yet who can see,
  Where pain draws lines no ledger wants to be.

