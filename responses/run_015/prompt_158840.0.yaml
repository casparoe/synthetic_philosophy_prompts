answer: |-
  The break is at **(3)**, driven by an equivocation on "convention" between Step (1) (Lewisian) and Step (3) (Rawlsian). Step (1) correctly defines a convention as an arbitrary coordination equilibrium. Step (3) incorrectly infers moral obligation from *any* such equilibrium. This looked fine because the free-riding intuition is robust; we typically assume the practices we inhabit are benign. However, you smuggled in a Rawlsian obligation without the requisite Rawlsian condition: obligations arise only from *just* practices. By omitting "just," (3) treats corrupt coordination (bribery) identically to benign coordination (tipping).

  Consequently, **(5) collapses**. While the *selection* of a convention (driving left vs. right) is arbitrary, the *moral valence* of the practice is not. You cannot derive an obligation to conform to a practice that undermines public goods, even if it is a local equilibrium. The "content is arbitrary" claim in (1) applies to the *solution* to the coordination problem, not to the *moral permissibility* of the practice itself.

  Repairing the argument requires qualifying (3): "Free-riding on a *mutually beneficial and just* practice is pro tanto wrong." This preserves the tipping conclusion but blocks the bribery conclusion.

  1.  **Tipping:** If the local wage structure relies on tips, the practice functions as a deferred wage agreement. Not tipping accepts the service (benefit) while rejecting the cost (wage), constituting free-riding on a mutually beneficial arrangement between diner, server, and employer. Your roommate is wrong here; the "menu price" is incomplete without the normative context of the transaction. The obligation stems from reliance and benefit, not just arbitrary regularity.
  2.  **Bribery:** This fails the "just practice" test. Bribery coordinates efficiency for individuals but degrades institutional integrity. Conformity here isn't free-riding on a benefit; it's participating in a harm. You owe no conformity to unjust conventions, even local ones.
  3.  **Jaywalking:** This is mixed. If the local convention is jaywalking, drivers expect it. Conforming might be safer (coordination), but legal prohibitions complicate the "justness." However, unlike bribery, jaywalking isn't inherently corrupting.

  The cost of this repair is losing the strong "When in Rome" universalism of (5). You must evaluate the practice, not just the regularity. Your roommate is wrong about tipping (obligation exists within the just practice) but right about bribery (no obligation to corrupt). The gap was assuming coordination equals legitimacy. Steps (1) and (2) survive as descriptive claims; (3), (4), and (5) require normative qualifiers to avoid the *reductio*.
