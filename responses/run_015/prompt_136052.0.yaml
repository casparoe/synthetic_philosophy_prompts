answer: |-
  During the final session of the Constitutional Convention, delegates operate under an Interim Charter containing Clause X, which stipulates that "Clause X may only be amended by unanimous vote of all delegates." A faction proposes Clause Y, stating "Clause X may be amended by a simple majority vote," and includes it in the draft Constitution. The draft Constitution, including Clause Y, is ratified by a simple majority of delegates, not unanimity. Immediately following ratification, the Convention invokes Clause Y to pass an amendment altering the substantive content of Clause X by a simple majority vote, prompting an immediate procedural objection from the minority who claim the ratification of Y itself violated the unanimity requirement of X.

  **Hierarchical-Validity View:** This view holds that legal authority flows downward from a presupposed basic norm; validity is a logical chain where lower norms derive power from higher ones. Here, the Interim Charter is the higher norm currently in force. Because Clause X dictates the only valid procedure for altering itself (unanimity), any attempt to change X—or to change the rules governing X—must comply with X. Since Clause Y was adopted by a simple majority, it failed to satisfy the higher-order condition set by X. Therefore, Y is legally void regarding X, and the subsequent amendment of X is invalid. The chain of validity was broken at the adoption of Y.

  **Dynamic-Acceptance View:** This view holds that validity is determined by the social facts of acceptance and the convention's own operational rules of change; law is what the relevant community treats as binding. Here, the Convention collectively acted to adopt the draft Constitution containing Clause Y by a simple majority. This social act establishes Clause Y as a valid part of the legal order because the officials accepted it as such. Once Y is accepted as valid law, its content governs, meaning Clause X is now subject to majority amendment. The subsequent amendment of X is valid because the community's practice authorized Y, and Y authorized the change.

  **The Circular Self-Reference:** The conflict arises because Clause X refers to itself to establish its own immunity, while Clause Y refers to Clause X to strip that immunity. This creates a logical loop: X is valid if X says so, but Y claims to speak for X. The hierarchical view breaks the loop by prioritizing the temporal priority of X (the old rule binds until properly changed), while the dynamic view breaks the loop by prioritizing the factual efficacy of Y (the new rule binds because it is accepted).

  **Inserting a Third Supreme Clause:** If a Clause Z were inserted stating "Clause Y prevails over Clause X in any conflict," the circularity is resolved by an external hierarchy. Both views would likely converge on the validity of the amendment. The hierarchical view would see Z as the higher basic norm authorizing Y to override X. The dynamic view would see the acceptance of Z as the social fact validating the priority. The loop is broken because the ranking is no longer self-referential between X and Y but anchored by Z.

  **The Attack on Begging the Question:** If the Dynamic-Acceptance view prevails (declaring the amendment valid), a defender of the losing Hierarchical-Validity view would argue that the winning case begs the question regarding the location of ultimate authority. They would contend that the Dynamic view assumes the Convention's current majority will is the ultimate source of authority without proving why the prior commitment (Clause X) does not hold that position. By treating the social fact of Y's adoption as self-validating, the Dynamic view assumes the conclusion it seeks to prove: that the Convention has the power to ignore X. It fails to explain *why* the basic norm shifted from "Obey the Interim Charter" to "Obey the New Majority," merely asserting that it did because the actors said so.
