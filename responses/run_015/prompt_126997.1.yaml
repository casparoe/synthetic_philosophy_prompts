answer: |-
  This is a sharp observation, and you are right to feel that there is a dialectical friction there. While there isn't a single, canonical Latin term for this specific move in the literature (like *ignoratio elenchi*), you have put your finger on the central vulnerability that Type-B physicalists and illusionists (like Dennett, Frankish, or Churchland) exploit when attacking the Conceivability Argument.

  Chalmers attempts to block this by insisting on **ideal positive conceivability** (conceivability that survives ideal rational reflection), arguing that if you *really* conceive the full physical duplicate, the zombie intuition should hold. Critics argue that what proponents actually conceive is a "low-resolution" functional duplicate, and they only get the "zombie" force by secretly rendering the consciousness variable in "high-resolution" isolation.

  Since there is no established label, I think your intuition warrants a coinage. Given your description, the most precise term would be:

  ### **The Phenomenal Resolution Shift**

  Alternatively, using your own evocative language: **The Thin-Thick Conceivability Slide**.

  Here is a proposal for how to define it formally, along with the boundary conditions you requested.

  ---

  ### **Definition: The Phenomenal Resolution Shift**
  A dialectical move in modal epistemology (specifically philosophy of mind) where the *granularity* of the imagined scenario shifts between two modes to maximize argumentative advantage:
  1.  **Low-Resolution (Thin) Mode:** Used defensively to secure **conceivability**. The scenario is underspecified (e.g., functional or macro-physical), allowing the imaginer to bypass the cognitive impossibility of holding every micro-physical fact in mind.
  2.  **High-Resolution (Thick) Mode:** Used offensively to secure **metaphysical force**. The scenario is loaded with phenomenological salience (e.g., the "hollowness," the "darkness behind the eyes"), leveraging first-person intuition to argue for an explanatory gap.

  The fallacy (if it is one) lies in assuming that the *Low-Resolution* conception is sufficient to ground the possibility claim, while the *High-Resolution* intuition is required to make the possibility claim matter, without proving that the two are compatible in a single cognitive act.

  ---

  ### **Boundary Conditions**

  To ensure this term doesn't just become a synonym for "equivocation" or "confusion," it should be restricted by the following conditions:

  **1. The Modal-Phenomenal Dependency Condition**
  This shift only applies where the *force* of the intuition depends on first-person phenomenological data.
  *   *Applies:* Zombie arguments, inverted spectrum arguments, Mary's Room variants.
  *   *Does Not Apply:* Standard modal arguments in physics or math (e.g., "I can conceive of a planet without rings"). There is no "thick" phenomenological load to smuggle in when conceiving of Saturn without rings; the conception is uniform.

  **2. The Dialectical Oscillation Condition**
  The shift must be responsive to dialectical pressure.
  *   If a proponent consistently uses a "Thick" description and bites the bullet that it is hard to conceive, they are not committing the shift (they are just arguing for hard conceivability).
  *   If a proponent consistently uses a "Thin" description and accepts a deflationary conclusion (e.g., "Zombies are conceivable but metaphysically impossible"), they are not committing the shift (this is Type-B physicalism).
  *   The **Shift** occurs only when the *same argument* relies on the ease of the Thin version to establish premise 1 (Conceivability) and the weight of the Thick version to establish premise 2 (Possibility/Gap).

  **3. The Epistemic Access Condition**
  The move relies on an asymmetry in epistemic access. The "Thin" description is third-person accessible (physical/functional structure), while the "Thick" intuition is first-person accessible (what-it's-like-ness). The slide exploits the fact that we have privileged access to the Thick data but no privileged access to the Thin data, allowing the imaginer to swap between "what I can easily model" and "what I feel deeply."

  ---

  ### **Why this isn't quite Equivocation or Motte-and-Bailey**

  *   **Vs. Equivocation:** Equivocation usually involves a change in the *meaning of a term* (e.g., "conceive" meaning "visualize" vs. "conceive" meaning "find non-contradictory"). The Phenomenal Resolution Shift keeps the term "conceive" stable but changes the *content resolution* of the object being conceived.
  *   **Vs. Motte-and-Bailey:** In a Motte-and-Bailey, the proponent retreats to a defensible position (Motte) when attacked but occupies an aggressive position (Bailey) when unchallenged. Here, both the Thin and Thick versions are used to support the *same* anti-physicalist conclusion. The Thin version isn't a retreat from the conclusion; it's a retreat from the *cost of entry* to the argument. The Thick version isn't an expansion of the conclusion; it's the *source of motivation* for the conclusion.

  ### **Existing Literature Proximity**

  If you need to cite existing discussions that dance around this without naming it:

  1.  **Daniel Dennett's "Intuition Pumps":** Dennett argues that when people think they are conceiving a zombie, they are actually conceiving a "zombie-judgment" (a robot that says it's conscious) rather than a true phenomenological duplicate. He is accusing them of a Resolution Shift without the name.
  2.  **David Chalmers' "1-Conceivability vs. 2-Conceivability":** Chalmers tries to inoculate against this by distinguishing primary intensions (epistemic) from secondary intensions (metaphysical). He would argue the Shift is a failure of *ideal* conceivability.
  3.  **Peter Carruthers & Illusionism:** Carruthers argues the "Thick" intuition is a cognitive illusion caused by the transparency of experience. He effectively argues the "Thick" mode is bogus data smuggled into the imagination.
  4.  **Katalin Balog's "Phenomenal Concept Strategy":** She argues we have two concepts for the same state (physical and phenomenal). The "Shift" you noticed is essentially the proponent exploiting the distinct cognitive roles of these two concepts without acknowledging their referential identity.

  ### **How to use it in your writing**

  You might frame it like this:

  > "While Chalmers guards against incomplete conception via the requirement of ideal rational reflection, a persistent dialectical vulnerability remains in the deployment of zombie intuitions. I term this the **Phenomenal Resolution Shift**. This occurs when a proponent secures the *conceivability* premise via a low-resolution functional blueprint (avoiding the cognitive load of total physical duplication) but secures the *explanatory gap* conclusion via a high-resolution phenomenological contrast (the 'hollowness' of the zombie). Unless it can be shown that the low-resolution conception entails the high-resolution intuition, the argument relies on a slide between the ease of imagining a functional shell and the force of imagining a phenomenological absence."

  This gives you a precise tool to critique the move without needing to claim the author is being dishonest or logically incoherent in a traditional sense. It frames it as a structural issue in modal epistemology regarding consciousness.
