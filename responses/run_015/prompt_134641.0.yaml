      *   The "retroactive credit" is the dangerous part. That's where the rhetoric overtakes the epistemology.
      *   The asymmetry is a feature of Research Programmes (Lakatos), not necessarily a bug, but it can be abused.
      *   *Verdict:* It's a defensible heuristic for theory construction but an indefensible substitute for confirmation. The "evidential work" is actually "coherence work."

  6.  **Drafting the Response (incorporating the "Rationalist Forum" persona):**
