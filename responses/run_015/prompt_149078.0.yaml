          4.  EGT results (Aumann's Agreement, Nash Equilibrium, etc.) depend *exactly* on infinite CKR.
          5.  Therefore, EGT results don't apply to reality.
          6.  Practitioners (economists, AI researchers) use them anyway.
          7.  Conclusion: Practitioners are wrong OR a premise is false.
