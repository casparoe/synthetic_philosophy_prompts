      *   *The "Single Subject" Issue:* Crucial. Who decides the group is "healed"? Usually the victors or the state. Victims might want justice, not "closure."
      *   *User's Fix:* Veto vs. Archive. This sounds like "Instrumental Memory" vs. "Historical Memory." Is it new? It's a useful distinction, but needs scrutiny.
      *   *Alternatives:* Inheritance/Debt (Law), Property/Stewardship (Real Estate), Ecosystem/Ecology (Biology).

