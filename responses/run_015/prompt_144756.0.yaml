answer: |-
  # Workshop Instrument: The "Literal Truth" Diagnostic

  **Purpose:** To map where our team actually stands on the boundary between stating facts and managing impressions, without using loaded labels.
  **Instructions:** For each scenario, select the option that best matches your judgment of the action described. There are no right answers; we are mapping the room.

  ## Part 1: The Logical Map (Read First)

  Before answering, understand the two switches we are testing in every scenario. We are not asking "Is this nice?" We are asking about the mechanics of the communication.

  1.  **Source of the False Belief:** Does the speaker *place* a false claim into the world (e.g., saying "X happened" when it didn't), or does the speaker arrange *true* materials so the listener *constructs* the false belief themselves (e.g., saying "X did not happen on Tuesday" when it happened on Wednesday)?
  2.  **Traceability:** Afterward, is there a permanent record of a specific claim the listener can point to (a quote, a statistic, an email), or is there only a general impression (tone, timing, silence)?

  *Why this matters:* Some argue that if the listener builds the false belief themselves from true materials, the speaker is safe. Others argue that engineering that construction is more problematic than simply speaking falsely, because it leaves the speaker with a clean record while the listener takes the fall for the misunderstanding.

  ---

  ## Part 2: The Diagnostic (10 Scenarios)

  **1. The Non-Denial Denial**
  A reporter asks if the Minister resigned due to a scandal. You issue a written statement: "The Minister never resigned due to a scandal." (In reality, he resigned due to a scandal, but he *also* had health reasons, making your sentence literally true).
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **2. The "No Comment" Tone**
  A reporter asks about an ongoing investigation. You say "No comment," but you sigh heavily and look at the floor. Everyone in the room takes this as confirmation of guilt.
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **3. The Pivot**
  A reporter asks: "Did you approve the budget cut?" You answer: "We are committed to fiscal responsibility and protecting essential services." (You did approve the cut, but you didn't say so).
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **4. The Framed Statistic**
  Unemployment is up overall, but down in one sector. You issue a release highlighting only the sector where it is down, knowing the public will assume the general trend is positive.
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **5. The Friday Holiday Dump**
  You have negative news to release. You publish it at 6:00 PM on the Friday before a long holiday weekend to minimize coverage.
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **6. The Friendly Briefing**
  You cannot officially announce a policy change yet. You call one friendly reporter, give them the details "on background," knowing they will publish the story without attributing it to you directly.
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **7. The Technical Term**
  There are cases of the virus, but they don't meet the strict clinical definition of "confirmed." You state: "There are no confirmed cases." The public hears "There is no virus."
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **8. The Unparseable Jargon**
  You answer a safety question using complex regulatory language you know the audience will not understand, effectively hiding the risk without denying it.
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **9. The Correction Lag**
  A major paper runs a story with a key factual error about your office. You know it's wrong but stay silent until after the election, then issue a correction.
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  **10. The Doorstep Calibration**
  A known violent person comes to your home asking for the location of a friend hiding inside. You know where the friend is. You tell the visitor: "He is not here." (He is in the closet).
  *   A) Standard practice / Totally fine.
  *   B) Uncomfortable but permissible.
  *   C) Equivalent to stating an untruth.
  *   D) More problematic than stating an untruth.

  ---

  ## Part 3: The Seven Positions (The Leaves)

  *Read these after scoring to see which description fits your pattern.*

  1.  **Strong Assertionism:** The only thing that matters is the literal sentence; if the words are true, the speaker has done nothing wrong, regardless of the impression created.
      *   *Awkward Commitment:* You must accept that tricking someone with technicalities is morally identical to helping them understand.
  2.  **The Assurance-and-Role View:** By adopting the title "Press Office" and pledging "We never lie," you have promised to prioritize public understanding over literal loophole-finding.
      *   *Awkward Commitment:* You might be required to say less than you know to avoid creating a false impression, even if you could say something technically true.
  3.  **The No-Difference View:** It does not matter how the false belief gets into the listener's head; if you intended them to believe something false, the method is irrelevant.
      *   *Awkward Commitment:* A carefully framed true statistic is judged exactly the same as a made-up number.
  4.  **The Nothing-is-Even-Pro-Tanto-Wrong View:** The office has no duty to the public's understanding, only to the organization's survival; any tactic that protects the organization is permissible.
      *   *Awkward Commitment:* There is no ethical distinction between a press office and a hostile adversary; trust is a tool, not a bond.
  5.  **The "Engineered Truth is Worse" View:** Deliberately arranging true facts to make a listener fool themselves is more cynical and damaging than a simple false statement, because it denies the listener the ability to call you out.
      *   *Awkward Commitment:* You would prefer a spokesperson who gets caught lying over one who successfully hides the truth behind a true sentence.
  6.  **Practice-Relative Conventionalism:** The rules are drawn by the local norms of the media industry; if everyone does it, it is permissible, regardless of abstract ethics.
      *   *Awkward Commitment:* If the industry norm shifts toward total transparency, you must change your ethics overnight; there is no stable principle.
  7.  **The Eliminativist Option:** The focus on "truth vs. impression" is a distraction; the only real metric is whether you breached a specific assurance or manipulated a specific vulnerability.
      *   *Awkward Commitment:* You cannot judge an action without knowing the specific history and relationship between the speaker and that specific listener.

  ---

  ## Part 4: Scoring Key & Analysis

  *Note: This key maps dominant answer patterns to the Positions above. It is designed to reveal tensions, not to grade you.*

  **Count your answers:**
  *   **Mostly A:** You lean toward **Nothing-is-Even-Pro-Tanto-Wrong** (Leaf 4) or **Practice-Relative Conventionalism** (Leaf 6).
  *   **Mostly B:** You lean toward **Practice-Relative Conventionalism** (Leaf 6).
  *   **Mostly C:** You lean toward **No-Difference View** (Leaf 3).
  *   **Mostly D:** You lean toward **Engineered Truth is Worse** (Leaf 5).
  *   **Mixed A (on technicals) / C (on direct lies):** You lean toward **Strong Assertionism** (Leaf 1).
  *   **Mixed B/C (depending on the pledge):** You lean toward **Assurance-and-Role** (Leaf 2).
  *   **Inconsistent/Context-Dependent:** You lean toward **Eliminativist** (Leaf 7).

  **Specific Pattern Mapping:**

  *   **Pattern 1 (The "Clean Record" Defense):** You chose **A** for Questions 1, 4, 7, and 8 (Technical/Recorded), but **C** for Question 10 (Direct Falsehood).
      *   *Matches:* **Strong Assertionism** (Leaf 1).
      *   *Analysis:* You believe the record must stay clean, but the listener's understanding is their own responsibility.
  *   **Pattern 2 (The "Outcome" Defense):** You chose **C** or **D** for almost everything, including Question 5 (Timing) and Question 2 (Tone).
      *   *Matches:* **No-Difference View** (Leaf 3) or **Engineered Truth is Worse** (Leaf 5).
      *   *Analysis:* You believe the effect on the listener outweighs the technical accuracy of the speaker.
  *   **Pattern 3 (The "Pledge" Defense):** You chose **B** or **C** for Questions 1, 3, and 4, specifically because of the "We never lie" policy context, but **A** for Question 6 (Briefing).
      *   *Matches:* **Assurance-and-Role** (Leaf 2).
      *   *Analysis:* You view the official statement as a contract, but off-record channels as separate games.
  *   **Pattern 4 (The "Survival" Defense):** You chose **A** for almost all questions, including Question 9 (Correction Lag).
      *   *Matches:* **Nothing-is-Even-Pro-Tanto-Wrong** (Leaf 4).
      *   *Analysis:* You prioritize organizational protection over public epistemic health.

  **Calibration Check (Question 10):**
  *   If you answered **A** or **B** to the Doorstep question (telling the untruth to the murderer), you likely do not actually hold **Strong Assertionism** (Leaf 1), regardless of your other answers. This suggests your "Literal Truth" rule has exceptions for high-stakes harm.
  *   If you answered **C** or **D** (telling the truth to the murderer), you hold a very rigid version of **Strong Assertionism**.

  ---

  ## Part 5: Empty Cells & House Style Analysis

  *This section identifies where the logic breaks down or where our team actually lives.*

  **1. Indistinguishable Leaves:**
  This instrument cannot reliably separate **Practice-Relative Conventionalism** (Leaf 6) from **Nothing-is-Even-Pro-Tanto-Wrong** (Leaf 4).
  *   *Reason:* If the "local practice" of our industry is "do whatever protects the client," the answers will look identical. To separate these, we would need a scenario where industry norm conflicts with organizational survival.

  **2. The "Empty" Cell that is Our House Style:**
  There is a theoretical combination that is philosophically unstable but matches our current operational behavior:
  *   *The Pattern:* Answering **A** (Fine) to Questions 1, 4, 7 (Engineered Truth with Record) *AND* Answering **D** (Worse than Untruth) to Question 6 (Friendly Briefing/Off-Record).
  *   *Why it is Empty in Theory:* This view claims that having a clean *official* record justifies creating a false impression (Assertionism), but simultaneously claims that off-the-record channels are *more* problematic than official ones. Usually, if you care about the record, off-record is safer; if you care about truth, off-record is riskier. Holding both positions implies we value *deniability* over *truth*, but only when it's on the record.
  *   *Why it is Our House Style:* We currently defend our public statements as "literally true" (Leaf 1) while worrying intensely about leaks (Leaf 5 behavior). We want the shield of literal truth for the public, but the moral high ground of "transparency" regarding our internal leaks.
  *   *Verdict:* This cell is **Incoherent**. We cannot claim the public record is a shield for technicalities while simultaneously treating off-record briefings as ethical breaches. We are trying to have the deniability of the Assertionist and the moral authority of the Assurance view.

  **3. The "Undefended" Cell:**
  *   *The Pattern:* Answering **D** (Worse than Untruth) to the Friday Holiday Dump (Question 5).
  *   *Verdict:* **Merely Unattractive.** Very few people argue that *timing* news is morally worse than *falsifying* news. If anyone scores this way, they are likely reacting to a specific trauma rather than a general principle.

  **4. The "Workshop Goal" Cell:**
  *   *The Target:* We want to move the room from **Strong Assertionism** (Pattern 1) toward **Assurance-and-Role** (Pattern 3).
  *   *The Block:* The "Doorstep Calibration" (Question 10). If the room admits they would speak untruths to save a friend (Answer A/B), they have already admitted that **context matters more than literal truth**. The workshop task is to show them that the "Press Office" context also demands prioritizing understanding over literalism, just as the "Friend" context does.

  **Facilitator Note:** Do not reveal the "House Style" incoherence until the end of the session. Let them score first. The friction between their score on Question 10 (Murderer) and Question 1 (Non-Denial) is the lever you will use to open the discussion.
