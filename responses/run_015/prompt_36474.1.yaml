answer: |-
  There is a principle here, but it requires discarding the idea that standing is about "sin counts" or "purity." Your gut is tracking **Normative Authority**, not moral scorekeeping.

  The principle that best captures your intuitions (while correcting the inconsistencies) is:

  ### **The Principle of Non-Exemptive Alignment**

  **Statement:** A person retains the standing to blame another for violating a norm if and only if:
  1.  **Token Consistency:** They are not currently committing the *specific token act* they are condemning; **AND**
  2.  **Moral Ownership:** If they have committed that act in the past, they acknowledge it as a moral failure rather than a prudential error, and do not claim exemption from the norm based on their reformed status.

  **Crucial Corollary (The Purity Myth):** Historical purity (never having been tempted) confers no *greater* standing than reformed ownership (having sinned and acknowledged it). They are equal.

  ---

  ### **Mapping Your Cases to the Principle**

  Here is how the principle explains your gut reactions, and where it demands you adjust your verdicts.

  #### **1. Token Consistency (The SUV vs. The Flight)**
  *   **The Case:** The SUV driver blames flyers; the occasional flyer blames the frequent flyer.
  *   **The Principle:** Norms are usually act-specific ("Do not fly"), not outcome-specific ("Do not harm the climate"), in everyday blame contexts.
  *   **Application:**
      *   **SUV Driver:** Does not fly. They satisfy **Token Consistency**. Their hypocrisy is general (climate harm), but not specific to the accusation. *Verdict: Standing retained.*
      *   **Flight Blamer:** Flies once a year. They condemn flying while flying. They implicitly claim an exemption ("My flight is okay, yours isn't"). *Verdict: Standing lost.*
  *   **Why your gut felt backwards:** You were calculating "total emissions" (moral score). Your gut was actually calculating "am I doing the exact thing I'm yelling about?" (normative alignment). The Flight Blamer feels worse because they are actively engaged in the token act they condemn.

  #### **2. Moral Ownership (The Uncle vs. The Friend)**
  *   **The Case:** Both cheated taxes/exams. Both stopped. Uncle blames; Friend blames.
  *   **The Principle:** Stopping a behavior is not enough; you must own the *moral nature* of the past behavior.
  *   **Application:**
      *   **Uncle:** Stopped due to audit (prudential, not moral). He now rails against cheats, implying he is now "one of the good ones." He claims **Exemption** from the "cheater" identity. *Verdict: Standing lost.*
      *   **Friend:** Admits the cheating freely. She does not claim she is inherently better; she claims the *act* is wrong, including her own past instance. She satisfies **Moral Ownership**. *Verdict: Standing retained.*

  #### **3. The Purity Myth (The Sister vs. The Friend)**
  *   **The Case:** Sister never plagiarized (untested); Friend cheated (reformed). You feel the Sister has *more* standing.
  *   **The Principle:** This is where your intuition conflicts with the principle. Under **Non-Exemptive Alignment**, the Sister and the Friend have **equal standing**.
  *   **Application:** The Sister satisfies Token Consistency (never did it). The Friend satisfies Moral Ownership (did it, owns it). Neither claims exemption.
  *   **The Overturn:** You must overturn the intuition that the Sister has *more* standing. Her "purity" is accidental (lack of temptation), whereas the Friend's alignment is volitional. If anything, the Friend has *more* epistemic authority (she knows the cost of honesty), but regarding *standing to blame*, they are equal. Your bug feeling ("it bugs me that she seems to have MORE standing") is your philosophical immune system correctly identifying that "Purity" is not a valid currency for moral authority.

  #### **4. The Bystander ("There but for the grace of God")**
  *   **The Case:** Would have sinned if tempted, but didn't.
  *   **The Principle:** This satisfies **Token Consistency** (didn't do it). Crucially, by admitting they *would* have done it, they explicitly reject **Exemption**. They acknowledge they are not inherently better than the sinner.
  *   **Verdict:** Standing retained. This confirms that standing is about *current alignment*, not *inherent virtue*.

  ---

  ### **Prediction: The Meat-Eating Neighbor**

  **The Scenario:** Neighbor eats meat, claims to be "transitioning," blames you for eating meat "without even trying."

  **Analysis:**
  1.  **Token Consistency:** He is currently eating meat. He is blaming you for eating meat. He is committing the specific token act he condemns. **(FAIL)**
  2.  **Moral Ownership:** He claims a "transitioning" status. While this acknowledges a goal, his blame ("you aren't trying") implies that his *attempt* grants him exemption from the *act*, while your *inaction* makes you blameworthy. He is drawing a moral line between "Eating while Trying" (Him) and "Eating while Not Trying" (You).
  3.  **Exemption Claim:** By blaming you, he implies the norm is "Try to stop" for him, but "Stop" for you. Or, he implies he is already "morally vegetarian" in spirit, while you are not.

  **Verdict:** **He has no standing.**
  Under the Principle of Non-Exemptive Alignment, you cannot condemn a specific act (eating meat) while actively performing it, unless you explicitly frame your blame as mutual self-criticism (e.g., "We are both failing at this, but we should try harder"). By positioning himself as the blamer and you as the sole violator, he claims an exemption he has not earned. The "transition" is a future state; the blame is about the present act.

  ---

  ### **The Honest Audit: What You Must Overturn**

  You suspected the SUV case or the Sister case needed to go.

  **1. Keep the SUV Intuition.**
  Your feeling that the SUV driver is "kinda fine" is correct under this principle. Hypocrisy is specific. A smoker blaming a drinker isn't a hypocrite regarding alcohol. The Flight Blamer feels worse because it is *direct* hypocrisy (same act), whereas the SUV driver is *indirect* hypocrisy (same value, different act). Direct hypocrisy destroys standing; indirect hypocrisy merely dampens it.

  **2. Overturn the Sister Intuition.**
  You must accept that your Sister does **not** have more standing than your Reformed Friend.
  *   **Why:** If standing required purity, the Reformed Friend would be silenced forever. That leads to a society where only those who have never sinned can speak against sin, which is effectively no one.
  *   **The Cost:** You have to accept that your Friend's admission of guilt *restores* her standing to the same level as your Sister's innocence. The "bug" you feel is a residual attachment to the "Purity Principle," which is the very thing creating your confusion.

  **Summary:** Standing is not about being clean; it's about not claiming a rule applies to everyone *except you*. The Uncle claims it. The Flight Blamer claims it. The Neighbor claims it. The Friend, the Sister, and the Bystander do not.
