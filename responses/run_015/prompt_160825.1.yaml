      *   *The Ending:* The "Maintenance Hand." Work doesn't disappear. Who tends the machine?
      *   *Final Line:* Needs to be strong. "Keep your hands on the lever?" No. "Watch the two hours." Maybe: "She's handing us the grease gun." No, too literal. "She's handing us the question."

      *(Self-Correction on Ending)*: The prompt specifically asks: "If you can get those two to pull together into one line without resolving them, that's the speech."
      *   Tension: Machines promise time / Work hides in maintenance.
