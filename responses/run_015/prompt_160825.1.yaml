      *   **Tone:** Warm, affectionate, 5-6 minutes, at least one genuinely funny moment. Not a lecture, not a stump speech, not sentimental about "dignity of labor."
      *   **Key Philosophical Points (Ellen's specific Marxism):**
          1.  *Not a Luddite:* Machines aren't the enemy. Old hand-tool shops were brutal too. Machinery creates the *possibility* of shorter hours, but only after intensifying work first.
          2.  *Not "Fully Automated Luxury Communism":* Automation doesn't remove work; it relocates it (maintenance, setup, repair). "The maintenance hand." Living labor still adds value; it just gets harder to see/easier to underpay.
          3.  *The Contract is Key:* Don't oppose the machine; oppose the contract. "The Two-Hour Question": If a machine saves 2 hours, who gets the time? Worker or Company?
          4.  *Compensation Theory:* Marx's send-up of displaced workers being automatically reabsorbed is key. It only happens through specific deals.
      *   **Audience:**
          1.  Old crew (some bitter about 90s automation deal).
          2.  Grandchildren (software devs, sensitive to "tech is bad" vibes).
          3.  Marx scholars (will catch errors/vagueness, hate "technology is neutral" slogan).
          4.  General family (want emotion/food).
      *   **Constraints:**
          *   Don't say machines took her job (plant still running, she's retiring with her hands).
          *   Don't say work gave her "dignity" (she hates that sentimentality).
          *   Mention Marx max 1-2 times, no bio explanations.
          *   **The Ending:** Needs to address what she's handing on, arising from the tension between "machinery as promise" and "the maintenance hand," without resolving the tension.

  2.  **Deconstruct the Challenge:**

      *   *The Trap:* Most retirement toasts romanticize the past or fear the future. Ellen hates both.
      *   *The Balance:* Acknowledge the bitterness of the old crew without validating the idea that she "sold out" or that machines are evil. Acknowledge the grandkids' tech work without endorsing "automation solves everything."
      *   *The Voice:* Needs to sound like someone who knows Ellen well, respectful but not sycophantic. It needs to be accessible to non-readers but precise enough for the scholars.
