      *   *The Ending:* The prompt asks for the tension between "machinery as promise" and "maintenance hand." The hand is what remains. The promise is what we fight for. The handoff is the *vigilance* over that gap.

  5.  **Drafting the Speech (Iterative Process):**

      *   *Start:* "I was told this should be short..."
