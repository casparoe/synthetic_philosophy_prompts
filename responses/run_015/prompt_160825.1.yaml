answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. Ellen asked me not to make this a lecture. Given that she's the person who used to bring hardcover theory to branch meetings while the rest of us were hiding in the smoke break, I think that's a fair request. I'll do my best.

  Thirty-eight years. Twenty-three of them as a tool-and-die maker, fifteen as a negotiator. Usually, at a retirement, people talk about how the job *changed* the person. But with Ellen, it feels more like she changed the job. Or at least, she changed the terms on which the job was allowed to exist.

  I know there are people in this room who have strong feelings about the automation agreements of the nineties. I'm not going to stand here and pretend those were easy days, or that the answers were simple. Ellen wouldn't respect that. She never believed in the sentimental story that the old hand-tool shop was some kind of golden age. She'd tell you straight: the old shop was just as brutal, only slower. She has zero nostalgia for the ache in the back or the dust in the lungs.

  But she also has zero patience for the idea that the machine is the enemy. She'd wince at the Luddite story. To her, the machine isn't a villain; it's a potential. She read her Marx closely enough to know that the same machinery used to intensify work is the only thing that creates the material possibility of ending it. You can't get to the shorter week without the machine that makes it possible.

  The problem, as she saw it, wasn't the equipment. It was the contract.

  She had a test for everything new that came through the gate. She called it "the two-hour question." If a new machine saves two hours a shift, do those two hours end up in the worker's pocket, or on the company's books? That was the whole battle. Not to smash the machine, but to audit the time.

  She knew the company line. They'd say, "Don't worry, the market will reabsorb the labour." She thought Marx's send-up of that "compensation theory" was the funniest thing she'd ever read. She'd quote it constantly: displaced workers don't come back by magic or automatic tendency. They come back through specific mechanisms in a specific deal. If you don't write it down, it doesn't happen.

  Now, I know there are people here working in software, in the new economy. You might hear this and think it's about you, or that this is a warning against the future. It isn't. Ellen knows that code is just the new die. But she'd also warn you against the "fully automated luxury" dream. She used to say that every time someone promises a lights-out factory, there's still a person standing next to the robot with a grease gun.

  She had a name for this: "the maintenance hand."

  Automation doesn't remove the work; it relocates it. It moves it into setups, jigs, repair, cleaning, nights, and the endless fiddling to keep the thing running. Living labour never disappears from production. It just gets harder to see, and because it's harder to see, it gets easier to underpay.

  So, where does that leave us? What does Ellen actually hand on as she walks out that door?

  She isn't handing us a world where the work is done. She isn't handing us a blueprint for a future where the machines run themselves. And she definitely isn't handing us the comfort of thinking that technology is neutral. She thinks that slogan is wrong. And she's right. Technology is a battlefield.

  What she is handing us is the measure of the gap between the promise and the reality.

  The machine creates the possibility of the time. The hand claims it.

  Ellen is retiring with her hands. She's proud of them. They're the proof that the work was real, and that the time she won was taken, not given. So, to Ellen: thank you for the two hours. We'll try to keep them.

  To the rest of us: She's leaving us the maintenance hand, and the instruction to use it. Don't let the time vanish into thin air.

  Cheers.
