answer: |-
  Elias and Mara doused the flames. Each poured three buckets from the lake. Each stirred the ash until the hiss died. Each held a bare hand over the pit, waiting for the radiating heat to fade. Each nodded, satisfied the embers were dead. They packed their gear, identical movements, and hiked out as the sun dipped.

  Behind them, a buried coal breathed. In the night, the wind shifted, finding oxygen beneath a log in Elias's pit. Mara's stayed cold. Elias's caught the dry bracken. By morning, the ridge was blackened.

  When the ranger found them, Mara signed the logbook and left. Elias stood by the truck, waiting for the citation. He looked at Mara. She looked away. He had done everything right. The ash said otherwise.

  ***

  **Audit**

  **One: The Versions and the Control Principle**
  *   **Version A (Bad Outcome):** As written above. Elias's pit ignites; he faces the citation.
  *   **Version B (Good Outcome):** Minimal change: "In the night, the wind shifted, finding oxygen beneath a log in Elias's pit. Neither caught the dry bracken. By morning, the ridge was green." Both sign the logbook and leave.
  *   **Control-Principle Verdict:** Identical. In both versions, the agents exercise the same care, possess the same information, and take the same risk. The only variable is the wind's interaction with the hidden coal.
  *   **Closing the Evidential Route:** The repetitive syntax ("Each poured... Each stirred... Each held...") forces the reader to verify the equality of care *before* the outcome is revealed. The text stipulates the embers were "dead" by all standard tests. The outcome cannot function as evidence of negligence because the narrative has already certified the procedure as flawless.

  **Two: The Residual Attitude**
  The attitude is not moral blame (culpability) but **liability-as-stain**. It is fitting rather than merely caused because harm creates a vacuum of responsibility that demands a locus. The reader blames Elias not because he is wicked, but because the world requires a bearer for the cost of the burned ridge. Mara is "clean" because she is unconnected to the harm; Elias is "stained" because he is the point of contact. It is the difference between being innocent and being *cleared*.

  **Three: Diagnostics**
  *   **The Ordering Test:** If the wind mechanism is withheld until *after* the ranger arrives, the reader's blame increases. Initially, they infer negligence from the fire (evidential route opens). When the wind is revealed later, the blame mitigates but does not vanish. This shows the effect is partially evidential by default, but the stain persists even after the evidence is cleared.
  *   **The Swap Test:** If Mara's pit burns instead, the blame transfers entirely to Mara. The reader does not say, "Elias was lucky to escape blame." They say, "Mara was unlucky." This proves the blame is constitutive of the *outcome*, not the *agent*. It attaches to the person connected to the harm, regardless of prior conduct.

  **Four: The Feature and The Attack**
  *   **The Feature:** The **existence of tangible harm**. If the wind shifts but no fire starts (Version B), the blame vanishes entirely. The effect is wholly dependent on the consequence.
  *   **The Attack:** The unsentimental reader will argue: "You are conflating *causal responsibility* with *moral blameworthiness*. Elias owes restitution for the ridge, perhaps, but he owes no apology and deserves no censure. By making the reader feel he deserves the citation, you are exploiting a cognitive bias, not revealing a moral truth. You are asking the reader to punish fate."

  **Craft Question**
  **Close Third.** First person ("I poured three buckets") invites defensiveness; the narrator becomes a lawyer arguing their innocence, which triggers reader skepticism. Close third ("Each poured") presents the care as objective fact, allowing the reader to judge the disparity between action and outcome without filtering it through the character's self-justification.

  **The Trickery Instinct:** The instinct most likely to make the reader feel tricked is the **over-specification of equality**. If you write, "They did exactly the same thing, no difference at all," it feels like a philosophical setup. The repetition of specific actions ("Three buckets," "_hand over the pit_") disguises the rigging as sensory detail. If you tell the reader the gambles are identical, they feel managed. If you show them performing identical rituals, they feel they have witnessed the truth.
