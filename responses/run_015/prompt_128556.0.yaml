      *Refinement:* The User says "indistinguishable by any available test." Okay, so indexicals might not count if they aren't *reasons*. I need to focus on whether indexicals count as *normative reasons*.

      *(Refining the Diagnosis)*: The core clash is between **Explanatory Adequacy** (Differentiators) and **Possibility of Action** (Permissivists). Differentiators say: "If you can't explain it, it's not action." Permissivists say: "If it's not action, we never act."
      Actually, a better diagnosis is **The Requirement of Determination**. Differentiators think Rationality = Determination. Permissivists think Rationality = Constraint.

