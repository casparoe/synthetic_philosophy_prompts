answer: |-
  Good morning. Welcome to "Truth, Trust, and Institutions."

  Looking around this room, I see a divide that is rarely bridged. On one side, logicians and philosophers who know Tarski better than their own names. On the other, journalists and policy students who navigate the erosion of public credibility daily. Usually, when these groups meet, the philosophers offer abstract models that ignore reality, and the practitioners offer case studies that ignore logic. Today, I propose we risk something different.

  I want to begin by constraining what I can promise you. I cannot stand here and declare that this workshop will produce a definitive theory of truth. To do so would be to perform the very error we are here to dissect.

  Consider a variant of the Liar Paradox tailored for institutions. Imagine a body that issues a single governing rule: "Every statement endorsed by this body is true." Now, imagine that body endorses that very rule.

  For the logicians: This is a self-referential universal claim subject to empirical falsification. If the institution makes even one error, the rule is false. If the rule is false, the institution's endorsement carries no logical weight.

  For the journalists and policy experts: Think of this as an official seal. Imagine a agency stamps a document saying, "All documents with this seal are verified." Then, they stamp that guarantee itself. If they ever miss a fraud, the seal is worthless. But if the seal is worthless, why trust the verification?

  This loop creates a structural constraint on us. If I promise you that we will leave here with a certified, self-conserving definition of truth, I am acting as that self-certifying body. I am stamping my own infallibility. Given that we are human institutions, prone to error and bias, that claim would be false. And if I begin with a false claim, I have already broken your trust.

  So, we must abandon the hope of a closed loop. We cannot solve truth; we can only manage our relationship to it.

  This is not a defeat. For the philosophers, it means we avoid the trap of seeking a consistent system that describes its own truth conditions. For the policymakers, it means we stop waiting for institutions to be perfect before we trust them. Trust is not the belief that an institution never errs. Trust is the confidence that an institution has the mechanisms to acknowledge error and correct it.

  Our work these next two days is not to polish the seal until it looks flawless. It is to examine what happens when the seal breaks. We are here to discuss iterative processes, fallibilism, and the resilience of systems that admit uncertainty.

  I invite you to unsettle each other. The logicians should challenge the coherence of our policy frameworks; the practitioners should challenge the relevance of our logic. Let us not seek the comfort of a final answer. Let us seek the rigor of a question we can survive.

  Thank you.

