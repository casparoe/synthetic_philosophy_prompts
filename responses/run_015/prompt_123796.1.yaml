      *(Self-Correction)*: I should advise giving up **Step 2** primarily, and clarifying **Step 9**. Step 2 is the empirical weak point. Step 9 is the philosophical confusion.

      *Let's look closer at Step 1.* "Justified only by present function." This is a functionalist view. If the function is harmful, it's not justified. The Lost Cause functions to uphold white supremacy. Dunkirk functions to uphold resilience. The *function* is different. So Step 2 is definitely the leak. The solidarity isn't the same *kind*.

