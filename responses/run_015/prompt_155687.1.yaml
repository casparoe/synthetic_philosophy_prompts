  8.  **Final Review against constraints:**
      *   Definite position? Yes (Origins Essentialism).
      *   Which worry bites? Twins.
      *   Which confused? Mitochondria/Threshold.
      *   Ethical implication? No debt of existence.
      *   Contested premises acknowledged? Yes.

