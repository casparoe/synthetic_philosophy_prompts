  You are circling a real phenomenon, and you are right to reject the religious/secular axis as the primary explanatory factor. The dimension you are looking for is **Epistemic Accessibility**, but the specific distortion you are observing is **Cultural Legibility**.

  Here is the commitment you asked for:

  The concept that best captures what is going on is **Cultural Legibility**.

  ### The Definition
  **Cultural Legibility** refers to the degree to which an argument's premises, vocabulary, and justificatory structure can be parsed, verified, and critiqued by the dominant culture *without requiring translation into a foreign conceptual framework.*

  An argument is **Legible** if its premises are drawn from a pool of knowledge the audience already accepts as "common sense" or "neutral" (e.g., standard scientific consensus, liberal individualism, national history).
  An argument is **Illegible** if its premises require the audience to step outside that dominant framework and learn a new set of rules to evaluate them (e.g., scripture, specific theological anthropology, or even obscure secular philosophy).

  ### Why This Fits Your Three Observations

  **1. The "Same Argument, Different Label" Problem**
  *   **Your Observation:** The church group and the secular parents' group made the same load-bearing argument, but one was treated as imposing religion and the other as civic-minded.
  *   **The Legibility Account:** The secular argument was **Legible**. It used the dominant culture's vocabulary ("institutions make mistakes," "life isn't a unit"). The church argument was **Illegible** because it signaled (via scripture) that its ultimate authority lay outside the dominant framework.
  *   **Why Public Reason misses this:** Public Reason theory demands *Accessibility* (can anyone understand the reason?). In practice, the public square confuses Accessibility with **Familiarity**. The secular argument *felt* accessible because it sounded like the default language of the state, even though its metaphysical premises (the sanctity of the individual) are just as contested as the religious ones.

  **2. The "Secular Dogma" Problem**
  *   **Your Observation:** Secular arguments often rely on unshared premises (e.g., "rational self-conscious agency") that are just as inaccessible as religious ones, yet they get a pass.
  *   **The Legibility Account:** Those secular premises are **Legible** to the dominant culture. They are the "water we swim in." You feel shut out because you are being asked to accept a premise you don't share, but the *system* treats it as shared because it belongs to the dominant dialect.
  *   **The Dimension:** It is not about whether the premise is *true* or *universal*; it is about whether the premise is *coded as neutral*. "Science" and "History" often function as **Legibility Shields**—they signal that the premise is checkable by anyone, even when the specific interpretation is highly contested.

  **3. The "Name the Source" Flip**
  *   **Your Observation:** An argument is admissible until you mention where it came from.
  *   **The Legibility Account:** This is the smoking gun. The *content* didn't change, so the *Accessibility* didn't change. What changed was the **Source Code**.
  *   When you keep the source quiet, the argument is read as **Legible** (it sounds like standard political discourse).
  *   When you name the religious source, you flag the argument as **Illegible** (it comes from a "private" tribe).
  *   This proves the exclusion isn't about the logic; it's about the **cultural categorization** of the speaker. It is a form of **Genetic Stigma**: the origin of the idea disqualifies it, regardless of its structure.

  ### Why Existing Labels Fall Short

  *   **"Public Reason":** This is the *norm* people claim to be following, not the *mechanism* you are observing. Public Reason demands accessibility; your observation is that the *definition* of accessibility has been rigged to favor secular language.
  *   **"Secularism":** This is too broad. It describes the political arrangement, not the epistemic bias in the argumentation.
  *   **"Epistemic Injustice":** (Miranda Fricker). This is close, as it deals with credibility deficits. However, it usually focuses on the *identity* of the speaker (e.g., gender, race). Your case is about the *source of the premises*. **Cultural Legibility** is more precise for argumentative structure.
  *   **"Comprehensive Doctrine":** (Rawls). This correctly identifies that both religious and secular views are "comprehensive," but it doesn't explain why one gets privileged as "public" and the other as "private."

  ### My Judgment: One Phenomenon, Not Two

  You asked if this is one phenomenon or two (epistemic vs. motivational). I judge it to be **one phenomenon**: **The Conflation of Legibility with Neutrality.**

  The "motivational oomph" or "certainty" you noticed is a side effect. Religious arguments *seem* more dogmatic to the dominant culture because they are **Illegible**. When you can't inspect the internal moves of a tradition (because you don't speak the language), it looks like blind faith. When you *can* inspect the moves (because it's your own culture's secular language), it looks like reasoning.

  The suspicion that religious reasons can't be compromised on is often a projection. Secular liberals often hold their premises (e.g., bodily autonomy) just as non-negotiably, but because those premises are **Legible**, they are misidentified as "negotiable policy preferences" rather than "dogmatic convictions."

  ### How to Use This Term

  When you are in a school board meeting or a debate, stop arguing about whether something is "religious." That is the trap. Argue about **Legibility**.

  *   **Bad Argument:** "It's unfair to exclude religious reasons." (This triggers the "Theocracy" alarm).
  *   **Good Argument:** "This objection relies on a premise about personhood that is not universally shared, regardless of whether it comes from a textbook or a bible. We should evaluate the **inspectability** of the premise, not the **label** of the source."

  If someone says, "You can't use the Bible to make policy," you reply: "I'm not asking you to accept the Bible. I'm asking you to evaluate the claim that *'human life has intrinsic value,'* which is the load-bearing premise. That premise is also used by secular philosophers. If you reject it because I found it in scripture, you are rejecting it based on **Cultural Legibility**, not **Epistemic Accessibility**."

  ### What Would Prove Me Wrong (Falsifiability)

  My account hinges on the claim that **Legibility**, not **Content**, is the filter.

  **I am wrong if:**
  1.  **The Unfamiliar Secular Test:** A secular argument that is *unfamiliar* to the dominant culture (e.g., a complex Effective Altruism calculus, or a niche Marxist critique of property) is given the **same** hostile reception as a religious argument. If obscure secular arguments get a pass *just because they are secular*, then it is pure **Secular Bias**, not Legibility.
  2.  **The Familiar Religious Test:** A religious argument that is *highly familiar* to the culture (e.g., "Golden Rule" reciprocity cited by a mainline Protestant in a historically Christian town) is accepted *without* scrutiny. If familiarity overrides the "religious" label, then Legibility is the key. (I suspect this happens often, which supports my view).
  3.  **The Compromise Test:** If you find a religious argument that is explicitly framed as negotiable/compromisable, and it is *still* rejected at a higher rate than a dogmatic secular argument. If "willingness to compromise" doesn't cure the exclusion, then the objection is indeed to the **Source Identity** itself, not the epistemic structure.

  ### Summary
  The word you want is **Cultural Legibility**.
  The problem is **The Accessibility/Legibility Conflation**.
  The fix is to demand **Premise Inspectability** regardless of **Source Coding**.

  You are not tripping over religion. You are tripping over the fact that the "Public Square" speaks a specific dialect, and it mistakes fluency in that dialect for rationality.
