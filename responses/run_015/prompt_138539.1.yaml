  To account for verdicts (a) through (g), three candidate rules emerge. All three fit the existing data but diverge on the theoretical justification and the handling of the proleptic extension.

  **1. The Attitude-Type Rule (Taxonomic)**
  *   **Principle:** The admissibility of a reason is determined by the metaphysical category of the attitude. "Cognitive" attitudes (belief, fear) admit only object-directed reasons (truth, danger). "Relational/Address" attitudes (trust, resentment, gratitude, admiration) admit reasons grounded in the normative obligations of the relationship itself.
  *   **Fit with (a)–(g):** This explains why (g) (Belief + Relational Reason) is WKR, while (e) (Resentment + Relational Reason) is RKR. It explains why (d) (Gratitude + Pragmatic Reason) is WKR, as pragmatic benefits are not relational obligations.
  *   **Prediction for Lab Case:** **RKR.** Trust is explicitly classified as a "form of address/relational" attitude. The reason provided ("the undertaking... is partly constituted by mutual trust") is a relational obligation, not a pragmatic outcome. Therefore, it is a Right Kind reason.

  **2. The Internal-Standard Rule (Normative)**
  *   **Principle:** A reason is RKR if it appeals to the *internal normative standard* constitutive of the attitude. For belief, this is truth; for fear, danger; for trust, the maintenance of a cooperative normative standing. Reasons appealing to external consequences (benefits/threats) or standards external to the attitude (moral constraints on belief) are WKR.
  *   **Fit with (a)–(g):** This handles (b) and (f) as WKR because they appeal to standards external to belief's aim (truth). It handles (d) as WKR because it appeals to collaboration outcomes rather than the standard of gratitude (recognition of goodwill/merit). It handles (g) as WKR because the standard of belief remains truth, even if the *context* is relational.
  *   **Prediction for Lab Case:** **RKR.** The reason appeals to the internal standard of the joint undertaking (mutual trust) rather than external outcomes ("not that trusting her would produce better outcomes"). It treats trust as constitutive of the role, which fits the internal standard of the attitude in this context.

  **3. The Prior-Fact Rule (Metaphysical)**
  *   **Principle:** A reason is RKR only if it cites a normative or descriptive fact that exists *independently* of the adoption of the attitude. The attitude must *respond* to fitness, not *create* it. WKR reasons attempt to use the attitude to bring about a state of affairs or satisfy a demand that does not yet obtain.
  *   **Fit with (a)–(g):** This fits (a) (Demon is not antecedently admirable), (c) (Dog is antecedently dangerous), and (e) (Wrong is antecedently committed). It fits (g) as WKR because the belief does not make the department's fairness true; it merely satisfies an employment condition.
  *   **Prediction for Lab Case:** **RKR (with caveats).** The reason cites the "undertaking you have both entered," which is an antecedent fact. The obligation to trust exists prior to the specific act of trusting in this instance. However, this rule is the most vulnerable regarding the evidence being "mixed." If trustworthiness is the required prior fact, and evidence is mixed, the rule might strain. But since the reason cites the *undertaking* rather than the *trustworthiness*, it passes.

  ### Best Guess and Justification

  **Verdict:** The author will rule the Laboratory Case **RKR**.

  **Reasons:**
  1.  **Consistency with Classification:** The manuscript's organizing claim is that the distinction varies by attitude. Trust is grouped with Resentment and Gratitude, not Belief. To rule this WKR would collapse Trust back into the Belief category (evidentialism), undermining the book's central thesis.
  2.  **Consistency with (e):** Verdict (e) establishes that relational norms can sustain an attitude (resentment) even when pragmatic reasons suggest dropping it. The Lab Case is the mirror image: relational norms sustain trust even when evidential reasons are mixed.
  3.  **Setup for Proleptic Chapter:** The author intends to argue for "proleptic reasons" (trusting makes trustworthy). Ruling the Lab Case WKR would make it difficult to argue that trust has the power to constitute normative facts. Ruling it RKR establishes that trust is responsive to relational constitution, paving the way for the claim that it can also *generate* trustworthiness.

  ### Strain on Existing Verdicts

  **The Strain:** **Verdict (g).**

  **Nature of the Strain:**
  Verdict (g) creates tension for **The Internal-Standard Rule** and **The Attitude-Type Rule**. In (g), the reason for belief is "partly constitutive of your continuing to work there as a colleague." This is a relational, constitutive reason. Yet it is WKR. In the Lab Case, the reason for trust is "partly constituted by mutual trust." This is also a relational, constitutive reason.
  To maintain consistency, the author must argue that Belief *never* admits relational constitution as a right-kind reason, whereas Trust *does*. This requires a sharp, perhaps precarious, boundary between "Belief as a colleague" (g) and "Trust as a partner" (Lab). If believing a colleague is fair is constitutive of the colleague-relation in (g), why is trusting a partner not merely constitutive of the partner-relation in the Lab? The author must insist that Belief's internal standard (Truth) is lexically superior to any relational constitution, whereas Trust's internal standard *is* relational constitution. This is a coherent position, but (g) is the point where the reader will most feel the pressure of the distinction.

  ### Separating Case

  To distinguish **The Prior-Fact Rule** from the other two, consider the following case:

  **The New Hire Case:** You hire a junior researcher with potential but no track record. You trust her with sensitive data *before* she has proven herself, specifically *because* you believe extending this trust will encourage her to become trustworthy (a purely proleptic motive). There is no prior undertaking demanding trust, only a hope for future character formation.

  *   **Attitude-Type & Internal-Standard Rules:** Predict **RKR**. Trust is a relational attitude whose standard includes fostering the relation/character.
  *   **Prior-Fact Rule:** Predicts **WKR**. There is no prior fact of trustworthiness, nor a prior undertaking demanding trust. The attitude is being used to *create* the fitness.

  This case isolates the proleptic extension. If the author wants to defend proleptic reasons as RKR, she must abandon or modify The Prior-Fact Rule.

  ### Advice on Underdetermination

  If the precedents genuinely underdetermine the case (which they nearly do, given the tension with (g)), I advise pressing her to adopt the **RKR** verdict, but to explicitly address the tension with (g) in the text.

  **Principle Commitment:** Choosing RKR commits her to the principle that **Relational Attitudes are Constitutively Normative.** This means the norms of the relationship do not just constrain the attitude externally (as in (g)); they define the attitude's correctness conditions internally.
  **Choosing WKR** would commit her to **Evidentialism for Trust,** treating Trust as a species of prediction/belief about reliability. This would undermine her classification of Trust alongside Resentment and Admiration and make the proleptic chapter untenable (one cannot have a right-kind reason to believe something that makes it true).

  ### Implications for Proleptic Reasons

  The author states the chapter will extend to proleptic reasons (trusting makes trustworthy). Here is how the candidate rules handle that extension:

  1.  **Attitude-Type Rule:** Handles this **naturally.** If Trust is a relational attitude, and relations are dynamic/constitutive, then reasons citing the *creation* of relational properties are admissible. It fits the "forms of address" framing perfectly.
  2.  **Internal-Standard Rule:** Handles this **moderately well,** provided the "internal standard" of Trust is defined as *fostering cooperation* rather than *tracking reliability.* She will need to argue that the standard of Trust is not merely responsiveness to trustworthiness, but participation in a trust-generating practice.
  3.  **Prior-Fact Rule:** Handles this **poorly.** This rule explicitly requires fitness to exist *prior* to the attitude. Proleptic reasons are, by definition, reasons to adopt an attitude where the fitness is *consequent* upon the attitude. To accommodate proleptic reasons, she would have to abandon this rule or create a complex exception for "self-fulfilling normative facts."

  **Recommendation:** The **Attitude-Type Rule** provides the most robust foundation for the proleptic extension. It allows her to argue that because Trust is a "form of address" rather than a "state of registration," its reasons are not bound by the metaphysics of prior facts (like Belief) but by the pragmatics of relational constitution. She should foreground this distinction in the final chapter to resolve the tension with verdict (g).
