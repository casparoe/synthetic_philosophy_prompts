answer: |-
  **Brainstorming Notes**
  *   **Goal:** Map Dennett's stances to Linear Logic (LL) types without defaulting to Intuitionistic Logic (IL) assumptions (i.e., no implicit weakening/contraction).
  *   **Physical:** Base atoms. Resource is the substrate.
  *   **Design:** Function types ($A \multimap B$). Resource is the interface/capacity.
  *   **Intentional:** Modal types. Resource is the rationality constraint.
  *   **Tension:** LL types are usually intrinsic to the term. Dennett's stances are extrinsic strategies.
  *   **Resource Constraint:** In LL, using a hypothesis consumes it. Does adopting a stance "consume" the entity? No, but it consumes *computational effort*.
  *   **Normativity:** Intentional stance assumes rationality. LL proves validity, not rationality.
  *   **Optionality:** Type assignment is usually factual. Stance adoption is pragmatic.
  *   **Conclusion:** LL captures the *cost* of prediction, but misses the *instrumentalism*.

  ***

  **Formalising the Three Stances in Linear Type Theory**

  Here is the restatement of Dennett's stances as typing judgements within a resource-sensitive framework. We assume a context $\Gamma$ and an entity $e$. Crucially, we omit structural rules (Weakening, Contraction) unless explicitly marked by the exponential $!$.

  1.  **The Physical Stance:** $\Gamma \vdash e : \text{Phys}$
      *   **Vocabulary:** $e$ is typed as an atomic resource or a tensor product of physical constituents ($p_1 \otimes \dots \otimes p_n$).
      *   **Logic:** Prediction derives from the reduction of $e$ according to physical laws (rewrite rules on $\text{Phys}$).

  2.  **The Design Stance:** $\Gamma \vdash e : \text{In} \multimap \text{Out}$
      *   **Vocabulary:** $e$ is typed as a linear function. It consumes input resources ($\text{In}$) to produce output resources ($\text{Out}$).
      *   **Logic:** Prediction relies on the interface specification, ignoring the implementation details of $\text{Phys}$. The teleonomic goal is the type $\text{Out}$.

  3.  **The Intentional Stance:** $\Gamma \vdash e : \text{Agent} \otimes \! \text{Bel}(p) \otimes \! \text{Des}(q)$
      *   **Vocabulary:** $e$ is typed as an agent possessing belief and desire modalities. The exponential $!$ is required here to allow beliefs to be reused without consumption.
      *   **Logic:** Prediction derives from assuming $e$ acts to satisfy $\text{Des}$ given $\text{Bel}$, subject to a rationality constraint (consistency of the context).

  **Critical Analysis: Translation, Distortion, and Silence**

  **1. What Translates Cleanly**
  *   **Causal Consumption:** The linear implication ($\multimap$) of the Design Stance neatly captures causal interaction. To get the output, the input must be consumed; the entity processes resources rather than merely describing them.
  *   **Computational Cost:** Linear logic naturally models the *cost* of prediction. The Physical Stance often requires massive resource expenditure (complex derivation), whereas the Intentional Stance offers a "short-cut" proof path, albeit with different resource requirements (maintaining the consistency of $\text{Bel}$/$\text{Des}$).

  **2. What Gets Distorted**
  *   **Normativity vs. Provability:** The Intentional Stance is normative; it assumes the entity *ought* to be rational. In linear type theory, a judgement $\Gamma \vdash e : T$ asserts that $e$ *is* $T$. If $e$ acts irrationally, the LL derivation fails (proof search terminates), whereas for Dennett, the stance remains valid but yields false predictions. LL treats irrationality as a type error; Dennett treats it as a predictive failure.
  *   **Resource Rigidity:** In strict LL, if you use $e$ as $\text{Phys}$, you may not simultaneously use it as $\text{Agent}$ without exponentials ($!e$). Introducing $!$ recovers intuitionistic behaviour (infinite copyability), which undermines the resource-sensitive premise. Dennett implies the stances are compatible perspectives on the *same* resource; LL forces a choice of type per derivation branch unless $!$ is invoked, collapsing the linear distinction.

  **3. What Has No Expression**
  *   **Instrumental Optionality:** This is the critical silence. In type theory, typing is ontological commitment within the system (if $\Gamma \vdash e : T$, then $e$ inhabits $T$). For Dennett, adopting a stance is a pragmatic strategy of the *observer*, not a property of the *entity*. LL lacks a formal mechanism to express "treat $e$ *as if* it were $T$ for the purpose of derivation $\Delta$." The modality belongs to the meta-logic (the choice of proof strategy), not the object logic.
  *   **Stance Switching:** LL does not natively support dynamic context switching based on predictive success. There is no operator for "if prediction fails, retract type $\text{Agent}$ and attempt type $\text{Phys}$."

  **Conclusion: Framework or Logic?**

  The leftover bits suggest that **Linear Logic is ill-equipped to handle stance-taking**, rather than Dennett's framework missing formal structure.

  Linear Logic is fundamentally concerned with the conservation of resources and the validity of proofs. Dennett's instrumentalism is concerned with the *utility* of descriptions. The mismatch lies in the nature of the typing judgement:
  *   **LL:** $\Gamma \vdash e : T$ means "$e$ verifies $T$."
  *   **Dennett:** "Adopt Stance $T$ for $e$" means "$T$ is a useful compression of $e$'s behaviour."

  To formalise Dennett faithfully, one would need a **meta-logical layer of pragmatic types** governing the selection of object-level derivations. The "stance" is not a type of the entity, but a type of the *observation context*. Without this separation, forcing stances into object-level types smuggles in ontological realism (the entity *is* an Agent) which Dennett explicitly rejects. The resource sensitivity of LL is useful for modelling the *cost* of the stances, but the logic itself cannot capture the voluntarism of adopting them.
