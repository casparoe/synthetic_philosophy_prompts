  10. **Final Review against Prompt:**
      *   Theory of collective agency/identity/obligation? (Yes, Narrative Identity + Legal Fictionalism).
      *   Metaphysical vs. Constructivist? (Yes, Narrative Constructivism that smuggles metaphysics).
