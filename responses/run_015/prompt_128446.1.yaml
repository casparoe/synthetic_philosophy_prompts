          4.  Distinguish requirements from accompaniments: Can a government apologize in the first-person while holding only continuous legal persons bear obligations? If not, what must change in rhetoric/ceremony/design?
      *   **Constraint:** Write in American English.

  2.  **Initial Analysis & Theoretical Frameworks:**

      *   *Collective Agency:* Who is the "we"? Is the State a real entity (realism) or a fiction (fictionalism/nominalism)?
      *   *Diachronic Identity:* How does the State of 2024 relate to the State of 1860?
          *   *Continuity View:* The State is an enduring corporate person (Hobbes, Hegel, contemporary legal theory).
