  3.  **Addressing Question 1: Presupposed Theory:**

      *   The practice presupposes a *hybrid* theory. It leans on **Narrative Identity** for the moral act and **Legal Positivism/Corporate Fictionalism** for the liability shield.
      *   It treats the state as a *moral person* (capable of guilt/shame) but a *discontinuous legal person* (capable of evading debt).
      *   This looks like "Constitutional Patriotism" mixed with "Strategic Ambiguity."

  4.  **Addressing Question 2: Metaphysical vs. Constructivist:**

      *   *Metaphysical:* Do we need a "group mind"? Not necessarily. We need a *normative* continuity.
      *   *Constructivist:* A purely functional account works *if* the function includes moral reckoning. However, the disclaimer undermines the functional continuity.
      *   *Verdict:* The practice *smuggles* in substantial persistence for the apology but sheds it for the bill. It relies on a *narrative* persistence (we are the same story) without *ontological* persistence (we are the same debtor).

  5.  **Addressing Question 3: Consistency:**

      *   Is it consistent? Strictly speaking, **no**. It is a performative contradiction.
      *   To say "I am sorry" implies "I did it" (or "I represent the one who did it in a way that binds me").
      *   To say "I owe nothing" implies "I am not bound by that act."
      *   *Nuance:* It might be *politically* consistent (stable equilibrium) but *philosophically* inconsistent. It separates *moral recognition* from *corrective justice*.

