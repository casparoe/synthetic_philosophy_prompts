answer: |-
  # Heterophenomenological Interview & Coding Protocol (v1.0)
  **Project:** Psilocybin TRD Qualitative Arm  
  **Goal:** Construct the subject's "heterophenomenological world" (HPW) while tracking the provenance of all descriptive vocabulary.  
  **Output:** Binary Classification (MTE+ / MTE-) for regulatory reporting + Provenance Audit.

  ## I. Interview Procedure (The "Funnel")
  *Do not deviate from order. Deviations must be logged in [INTERVIEWER NOTES].*

  1.  **Blank Slate Narrative (0–10 min)**
      *   **Prompt:** "Please describe everything you remember experiencing from the moment you took the capsule until you felt fully back to normal. Use your own words."
      *   **Constraint:** Interviewer must not use nouns/adjectives describing internal states (e.g., *unity, sacred, difficult, visual*). Use only: *What happened next? How was that for you? Say more about that.*
      *   **Stop Rule:** If participant says "I can't describe it," code as `[REPORT: INEFFABLE]`. Do not press. Move to Step 2.

  2.  **Clarification & Expansion (10–25 min)**
      *   **Goal:** Flesh out P-Gen (Participant-Generated) terms.
      *   **Action:** Reflect participant's exact vocabulary back to them. "You mentioned the 'room and I were the same.' Can you say more about 'same'?"
      *   **Prohibition:** Do not introduce synonyms. If they say "connected," do not ask "Did you feel unified?"

  3.  **Domain Probing (25–35 min)**
      *   **Goal:** Check for MTE criteria (Unity, Sacredness, Noetic Quality) without supplying labels.
      *   **Prompt:** "Some people report changes in how they relate to space or objects. Did anything like that happen for you?"
      *   **Tagging:** If Interviewer supplies a concept (e.g., "space"), tag subsequent agreement as `[ORIGIN: I-GEN]`.

  4.  **Instrument Administration (35–40 min)**
      *   **Action:** Administer standardized scale (e.g., MEQ30).
      *   **Post-Scale Check:** "You just endorsed items about 'oneness' or 'unity.' Does that match what you told me earlier, or does the scale's wording change how you'd describe it?"
      *   **Goal:** Detect if the scale overwrote the HPW.

  ## II. Transcription & Codebook Rules
  **For RAs:** The transcript *is* the data. Do not clean it.

  1.  **Verbatim Preservation:**
      *   Preserve fillers (*um, uh, like*), false starts, and self-corrections. These indicate the *construction* of the report.
      *   **Forbidden:** Fixing grammar, removing stutters, or clarifying pronouns.
      *   **Example:** "It was like... I don't know... the walls were breathing?" $\rightarrow$ Keep exactly.

  2.  **Provenance Tagging (XML-style):**
      *   `<term origin="P">` : Vocabulary introduced by participant (e.g., "melting," "god-light").
      *   `<term origin="I">` : Vocabulary introduced by interviewer/scale (e.g., "unity," "mystical").
      *   `<term origin="C">` : Cultural/Common vocabulary (e.g., "trip," "high").
      *   **Rule:** If a participant uses an I-Gen term *after* it was introduced, tag as `<term origin="I" adoption="P">`.

  3.  **Ineffability Flag:**
      *   Tag explicit claims of language failure: `<report type="ineffable">words fail</report>`. This counts as positive data, not missing data.

  ## III. Adjudication & Binary Classification
  *The PI requires a Yes/No on "Mystical-Type Experience." This is a classification of the HPW, not the brain state.*

  **Criteria for MTE+ (Heterophenomenological):**
  1.  **Core Phenomena:** HPW contains descriptions matching MTE factors (Unity, Sacredness, Noetic, Positive Mood).
  2.  **Provenance Threshold:** At least 50% of Core Phenomena descriptors must be `[ORIGIN: P]`.
  3.  **Consistency:** Post-Scale check does not contradict Step 1 Narrative.

  **Decision Tree:**
  *   **IF** Core Phenomena are present AND Provenance Threshold met $\rightarrow$ **Code: MTE+**
  *   **IF** Core Phenomena present BUT all descriptors are `[ORIGIN: I]` (Participant only agreed to leading questions) $\rightarrow$ **Code: MTE- (Contaminated)** $\rightarrow$ *Flag for PI review.*
  *   **IF** Participant reports `[REPORT: INEFFABLE]` but displays strong affect/non-verbal assent to domain probes $\rightarrow$ **Code: MTE+ (Provisional)** $\rightarrow$ *Requires Senior Review.*
  *   **IF** Day 2 Report is negative, but Month 3 Report is positive $\rightarrow$ **Code: MTE- (Session)**. *Note: Month 3 data is coded as "Integration Narrative," not Session Phenomenology.*

  **Values Handoff:**
  *   If the participant is clearly performing (e.g., using technical jargon from consent form without elaboration), the RA flags `[SUSPECT: PERFORMANCE]`. The **Coordinator** makes the final inclusion call. This is not a factual dispute; it is a judgment on data integrity.

  ## IV. Limitations & Failure Modes
  *Be honest with the PI about where this protocol breaks.*

  1.  **The Binary Cut:** Heterophenomenology yields a rich text, not a boolean. Forcing MTE+/- discards the nuance of *how* the experience was constructed. We are measuring "Disposition to Report MTE under Protocol Conditions," not "MTE Occurrence."
  2.  **The Memory Gap:** We treat the Day 2 report as the authoritative HPW for the session. We acknowledge that memory is reconstructive. A Month 3 "realization" is clinically vital but methodologically distinct from the acute session report. We cannot conflate them without violating the timeline of the data.
  3.  **Interviewer Effect:** Despite the Funnel, the mere presence of a researcher asking about "experience" primes a narrative structure. We track provenance, but we cannot eliminate the observational perturbation.

  ---

  # Test Run: Case Applications

  ### Case 1: The "Early Unity" Participant
  **Data:**
  *   *Step 1 (Narrative):* "The room and I were sort of the same thing." `[ORIGIN: P]`
  *   *Step 4 (Scale):* Endorses "Unity."
  *   *Post-Scale:* "Yeah, that's what I meant." `[ORIGIN: I, Adoption: P]`

  **Protocol Execution:**
  1.  **Core Phenomena:** Unity present.
  2.  **Provenance:** The descriptor "same thing" is P-Gen and semantically maps to Unity. Threshold met (>50% P-Gen).
  3.  **Consistency:** High. Scale confirmed, did not create, the report.

  **Classification:** **MTE+**
  **Comment:** This is the cleanest case. The vocabulary originated in the Blank Slate phase. The scale served as a translation layer, not an implant.

  ### Case 2: The "Day 2 Nothing / Month 3 Everything" Participant
  **Data:**
  *   *Day 2 Interview:* "It was just visuals. Nothing deep. Felt like a trip." `[ORIGIN: P]`. Denies unity/sacredness on MEQ30.
  *   *Month 3 Follow-up:* "Looking back, it was the most real thing. I felt one with the universe."

  **Protocol Execution:**
  1.  **Session Classification (Day 2):**
      *   Core Phenomena in HPW (Day 2): Absent.
      *   Provenance: N/A.
      *   **Classification:** **MTE- (Session)**.
  2.  **Integration Classification (Month 3):**
      *   This is coded as a *separate* data point: "Retrospective Meaning-Making."

  **The "Unlikely" Answer:**
  For the PI's regulatory binary regarding the *dosing session*, this participant is a **Non-Responder (MTE-)**.

  **Why you won't like it:**
  Clinically, the Month 3 report is what matters for depression outcomes. The patient *now* claims the experience was mystical. However, heterophenomenologically, the Day 2 report is the proximal data regarding the *pharmacological event*. The Month 3 report is data about *psychotherapy and narrative integration*.
  If you code this as MTE+, you are conflating the drug effect with the therapeutic processing. You are treating the *story* as the *event*.
  **Recommendation:** Report Day 2 as the Primary Endpoint (MTE-). Report Month 3 as a Secondary Qualitative Outcome ("Delayed Meaning-Making"). If the PI forces a single binary for the session, you must record **No**. To do otherwise is to manufacture data by allowing retrospective narrative to overwrite proximal report.
