      *   *Worry 3 (Composition vs. Head Count):* Needs a criterion on *Aggregation Function*. Cannot just sum biomass or heads; must weight by species/life-history traits (r-selected vs. K-selected).
      *   *Worry 4 (Tractability/Proxies):* Needs a criterion on *Empirical Grounding*. Must define observable proxies for welfare and sensitivity analysis for error.
      *   *Worry 5 (Counterfactual/Time Horizon):* Needs a criterion on *Baseline Definition*. Must compare "Clearing" vs. "Specific Alternative" over a defined period.
      *   *Worry 6 (Ecology vs. Ethics Separation):* Needs a criterion on *Modularity*. The ecological output (welfare per individual, population dynamics) must be separable from the ethical weighting (total utilitarianism vs. negative utilitarianism vs. person-affecting).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Drafting Criterion 1 (Dynamics):* Focus on Worry 1. Call it "Temporal Resolution." Needs to handle the transition phase vs. new equilibrium.
