answer: |-
  ### Desiderata for an Ecosystem Welfare Account

  To render the debate over the woodland clearing actionable, any proposed model of ecosystem welfare must satisfy the following six criteria. I have categorized them as **Structural Necessities** (non-negotiable for a coherent decision) or **Ethical Parameters** (where the board's moral commitments must select a value).

  #### 1. Temporal Resolution (Transition vs. Equilibrium)
  *   **Specification:** The account must distinguish between the welfare impact of the *clearing event* (immediate death/displacement) and the *steady-state comparison* (woodland carrying capacity vs. industrial site carrying capacity). It must model the rebound curve: if the remaining habitat saturates quickly, the long-term population may return to near pre-clearing levels, negating the "lives prevented" argument.
  *   **Rationale:** Addresses **Worry 1**. A model integrating only the transition phase (one-off drop) may yield a different sign (negative welfare) than a model comparing steady states (permanent reduction).
  *   **Status:** **Structural Necessity.** Without this, the calculation confuses a spike in suffering with a change in total existence.

  #### 2. Explicit Stance on Non-Existence
  *   **Specification:** The account must declare whether the prevention of a potential life counts as a welfare gain (avoiding suffering) or a welfare loss (foregoing happiness), or whether it counts as zero. It must not treat "lives not started" as mathematically equivalent to "lives ended."
  *   **Rationale:** Addresses **Worry 2**. This distinguishes between harming existing individuals (fewer lives) and preventing potential individuals (different lives). If non-existent animals are counted as "saved suffering," clearing looks better to a negative utilitarian; if they are neutral, only the killing of current residents matters.
  *   **Status:** **Ethical Parameter.** This is the primary fault line between Total Utilitarianism (count potential lives) and Person-Affecting Views/Negative Utilitarianism (focus on existing subjects).

  #### 3. Composition-Sensitive Aggregation
  *   **Specification:** The account cannot aggregate welfare solely by biomass or total headcount. It must weight individuals by species or life-history strategy (e.g., *r*-selected invertebrates vs. *K*-selected vertebrates). It must capture the shift from specialist woodland species to generalist edge-species.
  *   **Rationale:** Addresses **Worry 3**. Clearing often replaces fewer, longer-lived vertebrates with many more, shorter-lived invertebrates or generalists. If the latter have net-negative lives, a biomass-neutral swap could drastically increase total suffering.
  *   **Status:** **Structural Necessity (with Ethical Weighting).** The *capacity* to distinguish species is necessary for accuracy; the *moral weight* assigned to an insect vs. a mammal is an Ethical Parameter.

  #### 4. Proxy Transparency & Sensitivity Analysis
  *   **Specification:** The account must name the observable proxy used for welfare (e.g., cortisol levels, behavioral freedom, metabolic rate) and provide a sensitivity range. It must state: "If our proxy for suffering is wrong by factor X, does the verdict flip?"
  *   **Rationale:** Addresses **Worry 4**. We have counts and fecundities, not direct access to affective states. A model claiming high precision without observable proxies is speculative.
  *   **Status:** **Structural Necessity.** A decision cannot be made on unverifiable assumptions.

  #### 5. Counterfactual Specificity
  *   **Specification:** The account must compare the proposal against a defined alternative baseline (e.g., "status quo woodland," "passive rewilding," or "sustainable forestry"), over a fixed time horizon (e.g., 50 years).
  *   **Rationale:** Addresses **Worry 5**. "Clearing" is not compared to "Nature" in the abstract, but to a specific alternative use. The welfare of the woodland might be lower than a regenerative farm but higher than a concrete slab.
  *   **Status:** **Structural Necessity.** There is no "net impact" without a defined baseline.

  #### 6. Ethical-Ecological Modularity
  *   **Specification:** The ecological output (e.g., "10,000 rodent-years of life at intensity Y") must be separable from the ethical valuation function (e.g., "suffering weighs twice as much as happiness"). The model must allow the board to input different ethical weights into the same ecological data.
  *   **Rationale:** Addresses **Worry 6**. This ensures the board can see whether a verdict is driven by biological facts (the land supports more insects if cleared) or ethical stances (insect suffering matters more than mammal happiness).
  *   **Status:** **Structural Necessity.** Essential for a pluralistic board to identify the source of disagreement.

  ***

  ### The Incompatible Pair
  **Composition-Sensitive Aggregation (3) vs. Proxy Transparency (4).**

  You suspected this tension, and it is real. To satisfy **Composition-Sensitivity**, you need welfare data specific to different taxa (e.g., knowing the welfare of a specific beetle vs. a specific mouse). To satisfy **Proxy Transparency**, you must rely on data you can actually obtain (counts, biomass, general fecundity).
  *   **The Conflict:** High-fidelity composition data is empirically intractable for wild ecosystems. We simply do not know the affective states of most wild invertebrates. If you demand strict Proxy Transparency, you are forced to aggregate by broad categories (biomass), which violates Composition-Sensitivity. If you demand Composition-Sensitivity, you must rely on speculative proxies, violating Transparency.
  *   **Resolution:** You will likely have to accept a "bounded" composition sensitivity (e.g., distinguishing only vertebrates vs. invertebrates) to maintain minimal tractability.

  ### The Largest Exclusion
  **Ethical-Ecological Modularity (6).**

  This requirement excludes the largest share of views currently on offer, specifically **Holistic Environmental Ethics** and **Deep Ecology**.
  *   **Why:** These views hold that the *integrity of the ecosystem itself* has intrinsic value independent of the welfare of the individuals within it. They reject the premise that ecosystem value is the sum of individual welfare. By demanding that the ecological facts be separable from the ethical valuation of individuals, you render holistic views incoherent within this framework. They cannot plug their values into your module because they reject the modular premise.
  *   **Secondary Exclusion:** This also strains **Person-Affecting Views** if the ecological module outputs "potential lives prevented," as these views deny that output has moral significance. However, Holistic views are more fundamentally incompatible with the individualist calculus required for this trade-off.

  ### Summary for the Board
  To proceed, you must demand a model that separates the *biology* (how many lives of what type exist under each scenario) from the *ethics* (how much those lives matter). Be prepared for the data to fail on composition: we likely cannot know if the shift to generalists increases suffering, only that it changes the *type* of life. The vote will ultimately turn on **Criterion 2 (Non-Existence)**: whether the board believes preventing a wild animal's birth is a mercy or a loss.
