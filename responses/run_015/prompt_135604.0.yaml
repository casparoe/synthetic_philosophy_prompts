  It is a pleasure to address a colleague who understands that the lattice is the thing, not the ions. Your convenor's refusal of the standard labels (endurantism/perdurantism) is telling; she is likely a **sortal-relative ontologist** who believes persistence conditions are determined by the kind of thing in question, not by a universal metaphysics of time. Her seven rulings are not arbitrary; they form a tight, consistent web.

  Here are three candidate principles that reconstruct her system, an analysis of where they diverge on your case, my best guess at her verdict, and a proposal for a further experiment to test the boundaries.

  ### I. Three Candidate Principles

  To reproduce her seven rulings, any principle must distinguish between *Continuants* (Crystals, Humans, Ships, Lumps) and *Processes* (Rivers, Flames), and it must prioritize *Structural Continuity* over *Material Constitution*.

  **1. The Structural Integrity Principle (SIP)**
  *   **Rule:** A continuant persists if and only if its defining internal structure remains causally connected and functionally intact without total dissolution.
  *   **Fits Cases:** 1 (Crystal growth preserves lattice), 2 (Human life preserves functional organization), 6 (Clay lump preserves matter-integrity), 7 (Dissolution breaks lattice = death).
  *   **Excludes:** 4 & 5 (Rivers/Flames lack rigid structural integrity; they are defined by flow, hence they are processes).

  **2. The Non-Branching Constraint (NBC)**
  *   **Rule:** Identity is a one-to-one relation. If the history of a continuant branches into two equally qualified candidates, the original ceases to exist (or identity becomes indeterminate), because neither daughter can claim exclusive continuity.
  *   **Fits Cases:** 3 (The continuous ship survives; the reassembled ship is a duplicate because identity cannot branch to cover both). 7 (Recrystallization is a new branch, not a continuation).
  *   **Excludes:** Any view that allows "fission survival" (e.g., that the original lives on in both daughters).

  **3. The Causal-Historical Dominance Heuristic (CHDH)**
  *   **Rule:** Where material turnover is total, identity follows the dominant causal path of the structure's maintenance. If the causal path is interrupted or split, the history is segmented.
  *   **Fits Cases:** 1, 2, 3 (Continuous causal maintenance of form). 4, 5 (Causal sequence of stages, not a maintained form).
  *   **Excludes:** The view that the reassembled ship (Case 3) is the original, as its causal history was interrupted (planks were discarded).

  ### II. Where They Come Apart on Your Case

  Your case introduces **Migration** (turnover + translation) and **Fission** (cleaving). The principles agree on the broad strokes but diverge on the *ontological status of the week before cleaving*.

  *   **On the Migration Phase:**
      *   **SIP** says: It is one crystal. The lattice is continuous, merely translated. (Analogy: Case 1).
      *   **CHDH** says: It is one crystal. The causal history of the lattice is unbroken. (Analogy: Case 1).
      *   *Divergence:* A fourth, minority view (The Process View) might argue that because the *location* changes via material turnover (like the River, Case 4), it is a process. But given Case 1, your convenor will likely reject this.

  *   **On the "Week Before" Question (The Dislocations):**
      *   **SIP** says: **One Crystal.** The lattice is still cohesive. The dislocations are defects *within* the object, not boundaries *between* objects.
      *   **CHDH** says: **Potentially Two.** If the dislocations render the split causally inevitable, the "dominant history" may already be bifurcating. The causal fate of the two halves is sealed before the physical break.
      *   **NBC** says: **One.** Until the split occurs, there is no branching.

  *   **On the Post-Cleaving Verdict:**
      *   **SIP + NBC:** The original crystal **perished**. The cohesive whole is gone. Two new crystals began.
      *   **CHDH (Weak):** The original **continued weakly** in both, but since they are now distinct, we treat them as new for counting purposes.

  ### III. Best Guess at Her Verdicts

  Based on her systematic preference for **Structure** (Case 1, 7) and **Non-Branching** (Case 3), here is the prediction:

  1.  **Will she say either daughter is literally the crystal that had been migrating?**
      *   **No.** Neither daughter is the original.
      *   **Reason:** This follows the logic of Case 3 (Ship of Theseus). In Case 3, the continuous ship was the original, and the reassembled one was a duplicate. In your case, *neither* daughter possesses the *whole* continuous history of the migrating crystal; each possesses only a *part*. Since identity cannot be partial (NBC), the original identity relation terminates at the cleavage.

  2.  **Is the original best described as having perished or continued weakly?**
      *   **Perished.**
      *   **Reason:** She was explicit in Case 7 that dissolution (loss of lattice cohesion) ends the crystal. Cleavage is a mechanical loss of lattice cohesion. While the *matter* and the *pattern* continue, the *particular* (the specific lattice domain) has ceased. She will likely say: "The migrating crystal ceased to exist; two new crystals came into being, causally dependent on the first."

  3.  **How many crystals were there in the week before cleaving?**
      *   **One.**
      *   **Reason:** This is where her systematic nature matters most. To say there were "two" before the cleavage would require a criterion of identity based on *future causal fate* rather than *present structural unity*. Given Case 6 (Clay Lump), she distinguishes the object from its temporary forms. The dislocations are merely internal states of the one crystal, much like the prosthetic joints in Case 2 are internal states of the man. Until the cohesion breaks, there is one continuant.

  ### IV. Why This Is Not "Merely Verbal"

  You asked why seven rulings do not settle the dispute as merely verbal. If this were merely about how we use the word "crystal," her rulings would be stipulative and interchangeable. They are not. They carry **ontological commitment**.

  *   **Counting:** If the original perishes (Verdict A), you have 1 crystal $\to$ 0 crystals $\to$ 2 crystals. If it survives weakly (Verdict B), you have 1 $\to$ 1 (divided) $\to$ 2. This changes how you count entities in your inventory of the world.
  *   **Property Attribution:** If the original perishes, defects in the migrating crystal do not strictly belong to the daughters (they are new things). If it survives, the daughters inherit the history (and perhaps the "guilt" of the defects).
  *   **Causation:** In Case 4 (River), she denies the river is a "thing." This means you cannot say "The river flooded the town" in the same way you say "The crystal fractured." One is an event description, the other is an agent description. Her rulings determine whether crystals are *agents* of their history or *stages* in a process. That is a metaphysical difference, not a linguistic one.

  ### V. A Further Case to Separate the Candidates

  To test the boundary between **Structural Integrity (SIP)** and **Causal History (CHDH)**, you need a case where structure and history pull in opposite directions. I propose the **Sintering Case**.

  **The Case:**
  Take two distinct seed crystals of potash alum, suspended in the same vessel with a slight orientation mismatch (e.g., 5 degrees). Allow them to grow until they touch. Continue the growth conditions for a month. Due to annealing and Ostwald ripening at the boundary, the dislocation wall between them heals, and they form a **single, continuous lattice** with a unified orientation.

  **The Questions for Her:**
  1.  At the moment they touched, were there two crystals or one?
  2.  After the boundary healed, are there now one crystal or two?
  3.  If one: Did one crystal cease to exist and the other survive? Or did both cease and a new one begin? Or did they merge?

  **Why This Separates the Candidates:**
  *   **SIP (Structural Integrity):** Will say **One Crystal** after healing. The lattice is now continuous. It may argue they merged into one.
  *   **CHDH (Causal History):** Will struggle. There are *two* distinct causal histories (two seeds) that have now fused.
      *   If she says "One," she privileges Structure over History.
      *   If she says "Two," she privileges History over Structure (implying the lattice continuity is insufficient to unify distinct causal origins).
      *   If she says "A new third crystal," she applies the Case 7 (Dissolution) logic to *fusion*.

  This case mirrors your fission case in reverse. If she rules that Fission kills the original (as predicted), consistency demands she rule on Fusion. Does **1 + 1 = 1** (Merger), **1 + 1 = 2** (History dominates), or **1 + 1 = 3** (Both die, new one born)? Her answer will reveal whether her system is truly based on *Lattice Continuity* or *Causal Lineage*.

  Given her ruling on the Ship (Case 3), where continuous replacement preserved identity, I suspect she will say **One Crystal** (Merger), provided the lattice is truly unified. This would confirm that for her, **Structure is the Substance**, and History is merely the track it leaves behind.
