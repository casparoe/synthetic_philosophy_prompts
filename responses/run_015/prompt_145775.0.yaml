      *   **Reframe the Contradiction:** It's not that Ranke was writing fiction unknowingly; it's that Ranke and White are playing different games. Ranke is making a claim about *method and intent* (faithfulness to sources); White is making a claim about *form and language* (the inevitability of narrative structure).
      *   **The "Scientific History" Question:** Is it self-defeating? Not necessarily. It depends on what "science" means. If it means "physics," then yes. If it means "systematic inquiry," then no.
      *   **Synthesis:** The tension isn't a bug; it's a feature of the discipline. The "feeling of not knowing" the user misses is actually the engine of historical debate.

  5.  **Drafting the Response (Iterative Process):**
