      *   *Wait, I need to be careful.* The Judy Benjamin problem is famous because there is *no* consensus on the right answer without more assumptions about the source.
      *   *Game Goal:* Show that Group A and Group B price the tickets differently. Then reveal that *both* can be exploited depending on how the Radio Operator behaves.
      *   *Actually, for a 90 min session:* Let them argue and bet. Then reveal the location *once*. One group wins, one loses. Then debrief: "Why did the losers lose? Was it bad math, or bad assumptions about the Radio?"
      *   *Better:* Run 5 rounds. In some rounds, the Radio behaves like an Eliminator. In some, like a Reporter. (Secretly). See who goes bankrupt.
      *   *No, that's too much simulation.*
      *   *Best:* Let them bet. Reveal the location. Then reveal the *Protocol*. Show how the Protocol dictates the correct update.
      *   *Wait, the prompt says:* "participants should come away seeing that the bare story does not tell you which update is right."
      *   *Okay:* So the game must end with the realization that the story is under-specified.
      *   *Plan:*
          1.  Setup Priors.
          2.  Receive Message.
          3.  Set Odds (Betting Market).
          4.  Reveal that we *cannot* resolve the bet yet because we don't know the Radio Protocol.
          5.  Show two possible Protocols. Show how Protocol 1 makes Group A right, Protocol 2 makes Group B right.
          6.  Conclusion: The math doesn't decide; the context decides.

  6.  **Refining the Mountain/Road:**
      *   Does it ruin the setup? Van Fraassen's original point is about *conditional probability* vs *conditionalization*. The Mountain/Road adds a physical constraint that justifies "Imaging" (moving mass to nearest possible world).
      *   *Advice:* Keep it as a "Intuition Pump." It helps people understand *why* someone would choose the 3/8 solution (mass stays in Red because it can't cross the mountain). It makes the 3/8 view less abstract. I will explicitly note in the debrief that this is an *addition* to the original philosophical problem to make it tangible.

  7.  **Troubleshooting:**
      *   *Confusion on "3/4":* People think it means 3/4 of the *whole* map. *Fix:* Visual aid clearly marking "IF RED".
