                  5.  The Reveal & Debrief (20 min).
              *   To make the disagreement visceral: Create two "Hedge Funds." Fund Alpha (Elimination/1/3). Fund Beta (Ratio/3/8). They compete. We run a simulation of 10 drops. We see who wins. *But* the winner depends on the hidden rule of the Radio.
              *   *Okay, the prompt asks for the room to run into the disagreement.* So, don't assign funds. Let them form their own strategies.
              *   *The Mountain/Road:* Use this to justify the "Ratio" view. If you are in Red-HQ, you can't cross the mountain to Blue, you can only cross the road to Red-Second. So probability mass stays in Red.

  5.  **Drafting the Rules:**
      *   **Grid:** 4 Quadrants (RH, RS, BH, BS).
