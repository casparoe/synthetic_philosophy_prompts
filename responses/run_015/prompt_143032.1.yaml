answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Stability of Indirect Normativity
  **Parties:** Reflective-Rejection Contractualists (RRC) and Transformative-Endorsement Deliberationists (TED)
  **Date:** October 26, 2023

  **Preamble**

  This document is the product of a sustained, high-intensity dialogue regarding the structural integrity of indirect normative theories. We acknowledge that our previous discussions circled repeatedly around the same architectural worries: specifically, whether a procedure-based account of authority inevitably collapses into a disguised form of direct moral realism or degrades into a description of mere modus vivendi.

  We recognize that while we share a common enemy in direct realism and simple aggregativism, we diverge on the mechanics of the procedure itself. The purpose of this statement is not to force a synthesis, but to map the disagreement with sufficient precision that we know exactly what evidence or argument would be required to move either camp. We sign this not as converts to the other's view, but as collaborators in defining the boundaries of the problem.

  ***

  ### I. Agreed Formal Commitments

  Before detailing our divergences, we affirm the following shared commitments. These distinguish our joint position from external rivals (such as direct moral realists or simple preference utilitarians).

  1.  **Anti-Realism about Moral Properties:** We agree that normative authority does not derive from the correspondence of principles to mind-independent moral facts. The truth of a norm is not discovered like a law of physics; it is constituted by the outcome of a deliberative relationship.
  2.  **Counterfactual Authority:** We agree that the binding force of a norm does not depend on actual, historical consent. A principle can bind an agent even if they never actually agreed to it, provided they would have responded in a specific way under idealized conditions.
  3.  **The Non-Aggregation Constraint:** We agree that normative validity cannot be established merely by summing preferences or maximizing overall welfare. The distinctness of persons must be respected; one person's gain cannot simply cancel out another's loss without a specific justificatory structure.
  4.  **The Idealization Requirement:** We agree that the deliberative setting must be idealized to rule out coercion, ignorance, and logical error. A norm justified by actual, flawed deliberation is not necessarily authoritative.
  5.  **The Collapse Worry:** We agree that a successful theory must walk a tightrope. If the idealization is too thick (loaded with moral constraints), the theory collapses into realism. If it is too thin (merely describing what people happen to want), it collapses into proceduralism without authority.

  ***

  ### II. Table of Disagreements

  The following table isolates the specific points of divergence. The left column utilizes phrasing the RRC camp accepts as accurate to their view; the right column utilizes phrasing the TED camp accepts as accurate to theirs. We have avoided neutral glosses that neither side would fully endorse.

  | Point of Divergence | Reflective-Rejection Contractualists (RRC) | Transformative-Endorsement Deliberationists (TED) |
  | :--- | :--- | :--- |
  | **1. The Source of Authority** | A principle is authoritative because it respects the **veto power** of each individual. Authority stems from the fact that no one is forced to live by rules they can reasonably object to given who they currently are. | A principle is authoritative because it represents a **shared will** constructed through dialogue. Authority stems from the fact that agents have actively shaped the principle together, making it their own. |
  | **2. The Role of Practical Identity** | An agent's current practical identity is a **fixed input**. The procedure must accommodate the agent's deepest commitments; if a norm requires abandoning those commitments, it is rejectable. | An agent's current practical identity is a **malleable resource**. The procedure is designed to test and revise commitments; if a norm requires refining those commitments to achieve reciprocity, that is a feature, not a bug. |
  | **3. The Condition of Success** | Success is defined negatively: **No Reasonable Rejection**. If even one participant retains a reasonable objection based on their informed standpoint, the principle fails. | Success is defined positively: **Reciprocal Endorsement**. If participants cannot arrive at a shared affirmation of the principle through perspective-taking, the deliberation has failed to generate authority. |
  | **4. The Nature of Idealization** | Idealization is **informational and structural**. We ensure agents know the facts and have equal power, but we do not mandate how they value those facts. | Idealization is **psychological and moral**. We ensure agents are capable of and committed to revising their valuations to align with the perspectives of others. |
  | **5. Response to Deep Disagreement** | If disagreement persists after full information and structural equality, the norm **cannot be imposed**. The persistence of reasonable rejection signals a limit to authority. | If disagreement persists, the agents have **failed to deliberate correctly**. True reciprocal perspective-taking, if pursued rigorously enough, should dissolve intractable conflicts. |

  ***

  ### III. The Cruxes

  We identify two specific sub-questions where our predictions diverge sharply. We agree that settling these would force at least one camp to revise its position. For each, we specify a test case and record our anticipated outcomes.

  #### Crux 1: The Retention Problem
  **Question:** Is an agent bound by a norm if the deliberative process required them to undergo a transformation so significant that their post-deliberation self is discontinuous with their pre-deliberation practical identity?

  *   **RRC Prediction:** **No.** If the procedure requires an agent to cease being who they fundamentally are in order to agree, the resulting norm is illegitimate. Authority requires continuity of the self. The "reasonable rejection" standard protects the integrity of the agent's actual life project.
  *   **TED Prediction:** **Yes.** If the transformation is rationally compelled by the necessity of reciprocity, the agent is bound. The "pre-deliberation self" may be operating under false or parochial constraints. Authority tracks the *rational* self, even if that self is a revised version of the actual one.
  *   **Agreed Test Case:** *The Zealous Traditionalist.*
      *   **Scenario:** An agent enters deliberation holding a deeply held religious or cultural commitment that inherently ranks their group above others. Through the required process of reciprocal perspective-taking, they come to see this hierarchy as untenable and endorse a principle of strict equality. However, this endorsement requires them to view their past life's central project as mistaken.
      *   **RRC Anticipated Outcome:** The principle of equality is **not binding** on this agent regarding their past commitments. They had a reasonable rejection based on their entry identity. To bind them is to violate their integrity.
      *   **TED Anticipated Outcome:** The principle of equality **is binding**. The agent's entry identity was flawed because it was non-reciprocal. The procedure corrected a rational error. The agent is bound by the norms they *would* endorse as a fully reciprocal reasoner, even if that contradicts their past self-conception.

  #### Crux 2: The Residue Problem
  **Question:** Are there normative constraints on the deliberative procedure itself that are not generated *by* the procedure? (i.e., Is "reasonableness" an input or an output?)

  *   **RRC Prediction:** **Yes (Input).** There are pre-procedural constraints on what counts as a "reasonable" rejection or a "valid" participant. We cannot define reasonableness solely by the outcome of the talk, or else a group could procedurally agree to tyranny and call it valid.
  *   **TED Prediction:** **No (Output).** The procedure itself generates the standard of reasonableness. To impose external constraints on the procedure is to sneak direct realism in the back door. If the process of reciprocal perspective-taking is truly rigorous, it will not generate tyranny.
  *   **Agreed Test Case:** *The Consensual Hierarchy.*
      *   **Scenario:** A group undergoes a transformative deliberative process. Due to specific historical power dynamics internalized by the participants, the process results in a unanimous, transformative endorsement of a caste system. Every participant, post-transformation, genuinely endorses their place in the hierarchy as "good."
      *   **RRC Anticipated Outcome:** The outcome is **invalid**. The "reasonableness" constraint acts as an external check. Even if they endorse it, the principle is rejectable by a standard of reasonableness that exists prior to the deliberation. The procedure was corrupted.
      *   **TED Anticipated Outcome:** The outcome is **valid** (provisionally). If the process was truly one of reciprocal perspective-taking, and this was the result, then our theory must accept it, or admit that we are relying on external moral facts. However, TED suspects a process leading here was *not* truly reciprocal, but we deny we can judge it invalid without referencing the procedure's internal standards.

  ***

  ### IV. Assessment of Verbal vs. Substantive Dispute

  We conclude by examining whether our disagreement is merely terminological. We have analyzed the phrases "reasonable rejection" versus "genuine endorsement" and "retaining commitments" versus "being open to transformation."

  **1. The Verbal Overlap:**
  We agree that a portion of the dispute is verbal regarding the definition of "Idealization."
  *   **Dissolution:** If the RRC camp admits that "full information" inevitably alters an agent's commitments (since ignorance often sustains bias), and the TED camp admits that "transformation" cannot be unlimited (since total erasure of the self makes agency impossible), then the gap narrows. Both sides effectively agree that *some* change is permitted and *some* continuity is required.
  *   **Resolution:** We can agree that the dispute is not about *whether* identity changes, but about the **threshold of discontinuity**. The verbal confusion arose because RRC speaks of "retention" as a binary (keep/discard) while TED speaks of "transformation" as a spectrum. Once we agree identity is scalar, the disagreement shifts to *how much* change is permissible before authority breaks.

  **2. The Substantive Core:**
  However, a hard substantive core remains regarding the **Direction of Fit**.
  *   **RRC** insists the world (the norm) must fit the agent (their reasonable rejections).
  *   **TED** insists the agent (their commitments) must fit the world (the requirements of reciprocity).
  *   **Conclusion:** This does not dissolve. It is a fundamental disagreement about whether morality is primarily a shield for the individual (RRC) or a bridge between individuals (TED). No amount of terminological clarification will resolve the *Zealous Traditionalist* case. One of us must be wrong about whether rationality can demand the abandonment of a core life project.

  **Signatories:**

  _________________________
  *Representative, Reflective-Rejection Contractualists*

  _________________________
  *Representative, Transformative-Endorsement Deliberationists*
