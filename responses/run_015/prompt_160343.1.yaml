      *   *User Idea:* Red/Blue boundary is a mountain (hard to cross). Second/HQ boundary is a road (easy). If probability slides, it slides along the road, not over the mountain.
      *   *Analysis:* This is actually a brilliant intuitive justification for *Van Fraassen's Imaging*. Imaging works by "shifting" probability mass from worlds that become impossible to the "nearest" possible worlds. If the "distance" between Red-HQ and Red-Second is small (road), and Red-HQ to Blue is large (mountain), then mass should shift Red-HQ $\to$ Red-Second, not Red-HQ $\to$ Blue.
