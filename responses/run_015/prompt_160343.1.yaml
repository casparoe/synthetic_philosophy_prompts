      *   *Setup:* Four quadrants: $R \land H$ (Red, HQ), $R \land S$ (Red, Second), $B \land H$ (Blue, HQ), $B \land S$ (Blue, Second). Prior: $0.25$ each.
      *   *Evidence:* "If you are in Red, probability of Second Company is $3/4$." ($P(S|R) = 0.75$).
      *   *The Puzzle:* Standard Bayesian conditioning requires learning a proposition is *true* (e.g., "You are in Red"). Here we learn a *constraint* on the conditional probability.
      *   *Solution 1 (Van Fraassen's Imaging/Minimum Information):* Don't disturb what you don't have to. The Blue sector is independent of the news about the Red sector. Keep $P(B) = 0.5$. Adjust Red internally. $P(R \land S) = 0.375, P(R \land H) = 0.125$.
