      *   **Alternative:** Briefly mention why (1) or (2) are less ideal targets for the user's specific goals.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I address the user's specific options? Yes (2, 4, or 1).
      *   *Check:* Did I respect the user's desire to keep (3)? Yes, attacking (4) protects (3).
      *   *Check:* Is the distinction between books and weights clear? Need to emphasize that books contain *reasons*, weights contain *correlations*.
