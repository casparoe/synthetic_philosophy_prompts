      *(Self-Correction on Step 1)*: I should acknowledge that Step (1) is also a pressure point. Some might argue (1) is too strong (we understand things we can't fully reconstruct). But for the sake of the user's argument (saving the threat of AI), attacking (4) is more strategic. I will present (4) as the *primary* failure but note that (1) might need nuance (traceability vs. reconstruction).

