answer: |-
  **Brainstorm: Features of Intuition-Pump Practice to Exaggerate**

  *   **Incidental vs. Constitutive Reclassification:** Philosophers often salvage a case when a detail change flips the verdict by retroactively declaring that detail "essential." There is no independent test for this; it is purely defensive.
  *   **Narrative Dependence (Hermeticity):** Intuitions often rely on emotional framing rather than logical structure. Stripping the story to abstract variables often makes the intuition vanish, revealing the rhetoric as the driver.
  *   **Defensive Deployment:** Thought experiments are almost exclusively used to protect the operator's existing view against rivals, never to test the operator's own view. Symmetry is theoretically desired but practically non-existent.
  *   **Grandfathering:** New methodological standards cannot invalidate classic cases without destroying the literature, so exemptions are made for "established" pumps despite their failures.
  *   **Circular Validation:** Requests for feedback are often restricted to those who already agree with the conclusion, ensuring the "data" remains uncontaminated by dissent.

  ***

  **BS 8801-3:2025**
  **Intuition pumps — Part 3: Specification for inference-tight cases**

  **1. Scope**
  This British Standard specifies requirements for the reliability, leakage tolerance, and dialectical symmetry of narrative devices used to establish normative or metaphysical verdicts. It applies to all Operators constructing cases involving levers, violinists, experience machines, or twin planets.

  **2. Normative References**
  The following documents are referred to in the text in such a way that some or all of their content constitutes requirements of this document. For dated references, only the edition cited applies. For undated references, the latest edition of the referenced document (including any amendments) applies.
  *   BS 690 (Withdrawn): *Guidelines for Non-Circular Premises.*
  *   ISO 314 (In Preparation): *Definition of 'Obvious'.*
  *   Cotswold Working Party Report 44 (Undated): *On the Vibe of the Thing.*

  **3. Inversion Clause**
  The Operator shall ensure that the verdict remains constant when any incidental detail is inverted (e.g., the sex of the bystander, the material of the lever, the age of the victim). If the verdict flips upon inversion, the Operator shall reclassify the altered detail as constitutive rather than incidental. No independent test for constitutivity is required.

  **4. Leakage and Confidence Ratio**
  The Manufacturer shall declare a Ratio of Verdict Confidence to Argumentative Work Done. Permissible inference leakage shall not exceed 40% of the total intuitive pressure. Where leakage occurs, the Operator may plug the gap by invoking a secondary pump of equal opacity.

  **5. Calibration Requirements**
  The pump shall be trialled on a minimum of thirty first-year undergraduates between 14:00 and 15:00 on a Friday. The Operator shall also trial the pump on their own department. The Operator must sign a statement confirming they would have reached the same verdict had the case come out the other way.

  **6. Hermeticity Test**
  The case shall be rewritten in flat, abstract language devoid of narrative framing. If the intuition evaporates during this process, the pump shall be deemed non-compliant. This clause shall not apply to cases involving ticking clocks.

  **7. Dialectical Symmetry**
  The pump shall be deployed against the Operator's own view as often as against rivals. A log of such deployments must be maintained.
  *Note: To date, no pump has been certified under this clause.*

  **8. Order of Presentation**
  This Standard declines to cover variations in verdict resulting from the order in which premises are presented. This is considered a user error.

  **9. Grandfathering Schedule**
  Any pump cited in more than three hundred papers prior to 1990 is exempt from Clauses 3, 4, 5, 6, and 7.

  **Annex A (Normative)**
  **Declaration of Load-Bearing Incidentals**
  The Operator must complete Form LP-9, detailing which details are load-bearing. Completing Form LP-9 constitutes a thought experiment regarding the Operator's sincerity.

  **Appendix Z (Informative)**
  **Correspondence from Users**

  **Letter 1:** *Complaint regarding reversed verdicts depending on whether the side effect is described as 'saving five' or 'killing one'.*
  **Committee Reply:** The Standard specifies wording consistency, not semantic equivalence. Please resubmit.

  **Letter 2:** *Observation that the pump only generates counterexamples to theories held by people not in the room.*
  **Committee Reply:** This falls outside the Scope. The Standard governs the pump, not the occupancy of the room.

  **Letter 3:** *Query on why the Hermeticity Test is waived for ticking clocks.*
  **Committee Reply:** Urgency precludes abstraction.

  **Issued for public comment; comments invited from persons who have independently arrived at the verdict the pump was designed to produce.**

