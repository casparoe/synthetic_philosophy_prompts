  # JOINT PRE-REGISTRATION STATEMENT: THE ONTOLOGY AND TIMING OF DREAM CONTENT
  **Parties:** The Malcolmian Camp (MC) | The Dennettian Camp (DC)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Dream Reports and Sleep States

  ## I. AGREED CLAIMS
  *Both camps affirm the following propositions as the baseline for further inquiry. Disagreement begins only where noted in Section II.*

  1.  **The Data Primacy:** The only direct data available to investigators regarding a subject's dream is the waking report (verbal, written, or motor signal) given after arousal. There is no "phenomenological telescope" that allows a third party to observe dream content concurrently with the sleeping subject.
  2.  **Fallibility of Memory:** Both camps reject the "Cartesian Theater" view that dream reports are infallible transcripts of a continuous inner movie. Both agree that memory consolidation, confabulation, and narrative smoothing occur during the transition from sleep to waking.
  3.  **The Status of "I Am Asleep":** Both camps agree that the assertion "I am asleep" cannot be meaningfully uttered *while* asleep in a standard context. If uttered, it constitutes a performative contradiction or a specific type of lucid signal, but it does not function as a standard truth-claim verification in the moment.
  4.  **Rejection of Naive Realism:** Both camps reject the traditional "Received View" insofar as it claims dream experiences are isomorphic to waking perceptions in terms of sensory fidelity and temporal linearity. Both acknowledge that dream time does not necessarily map 1:1 to clock time.
  5.  **Neural Correlates:** Both camps agree that specific neural states (e.g., REM, PGO waves, specific cortical activation patterns) are reliably correlated with the *capacity* to produce dream reports upon waking. Both agree that disrupting these states reduces the frequency of reports.
  6.  **The Empirical Anchor:** Both camps agree that any theory of dreaming must account for the *timing* of the report production relative to the *timing* of the neural activity. The dispute is not about whether neural activity happens, but about what that activity *constitutes*.

  ## II. RESIDUAL DISAGREEMENTS
  *The following table outlines the core divergences. Wording has been negotiated to ensure neither side is misrepresented.*

  | Topic | Malcolmian Camp (MC) Position | Dennettian Camp (DC) Position |
  | :--- | :--- | :--- |
  | **1. Truth Conditions** | The statement "I dreamed X" is true if and only if the subject sincerely reports "I dreamed X" upon waking. The report *constitutes* the dream. | The statement "I dreamed X" is a hypothesis about a cognitive process. It is true if content X was generated by the brain during sleep, regardless of report fidelity. |
  | **2. Temporal Ontology** | Asking "When did the dream happen?" is a category mistake. Dreams are not events in time like heartbeats; they are retrospective descriptions. | Asking "When did the dream happen?" is a valid empirical question. Content generation has a timestamp (during sleep, at awakening, or spliced). |
  | **3. The "Inner Show"** | Positing an experience occurring *during* sleep that is inaccessible to the subject until waking is metaphysical speculation, not science. | Positing unconscious or conscious content generation *during* sleep is a standard cognitive science hypothesis, testable via correlation with neural data. |
  | **4. Lucid Signaling** | Eye movements during REM are motor commands compatible with sleep physiology; they do not prove the existence of a concurrent *phenomenal experience* of counting or signaling. | Eye movements during REM that match a pre-agreed count constitute evidence of working memory and conscious access operating *during* the sleep state. |

  ## III. CRUXES AND PREDICTIONS
  *We identify three specific cruxes. For each, we specify the test and record divergent predictions. We acknowledge that if Crux 3 is resolved as "purely verbal," the collaboration may terminate with a recommendation to change terminology.*

  ### Crux A: Evidential Weight of the Waking Report
  **The Question:** Does a detailed waking report carry evidential weight regarding cognitive processing that occurred *minutes prior* to awakening, or does it only evidence processing *at the moment of reporting*?

  **The Test:** **The "Late-Stimulus" Protocol.**
  Subjects are woken after 5 minutes of REM. In Condition 1, a distinct auditory tone is played 4 minutes into REM. In Condition 2, the tone is played 10 seconds before waking. Subjects are asked to report dream content.
  *   **Metric:** We measure the integration of the tone into the narrative (e.g., "I heard a bell") vs. fabrication of long narratives ostensibly preceding the tone.

  **Predictions:**
  *   **MC Prediction:** There will be no significant difference in narrative length or complexity between Condition 1 and Condition 2. The brain constructs the narrative *upon waking* to explain the memory trace of the tone, regardless of when the tone occurred. The report reflects the *logic of the telling*, not the *history of the experience*.
  *   **DC Prediction:** Condition 1 will show higher rates of narrative integration where the tone is placed *earlier* in the reported dream timeline compared to Condition 2. This indicates that content generation is sensitive to the timing of input during sleep, not just at awakening.

  **Decidability Check:** If Condition 1 and 2 yield identical reports, MC is strengthened. If reports differ systematically based on stimulus timing, DC is strengthened. *However, MC reserves the right to argue that differential neural encoding at the time of stimulus does not equal "experience."*

  ### Crux B: Timing and Duration (The Lucid Signal)
  **The Question:** Can the subjective duration of a dream event be empirically mapped to clock time during sleep, or is "dream duration" solely a feature of the waking report?

  **The Test:** **Lucid Dreamer Eye-Signal Calibration.**
  Lucid dreamers (verified by pre-sleep agreement) are instructed to count to 10 seconds via pre-agreed Left-Right-Left-Right eye movements (LRLR) once they become lucid in REM. EEG marks the start and end of the eye signals. Upon waking, they report how long they counted.

  **Predictions:**
  *   **MC Prediction:** The eye signals are unconscious motor outputs or reflexive responses to the *idea* of counting triggered at arousal (or "stamped in"). The correlation between eye-signal duration and reported duration will be weak or explainable by post-hoc rationalization. The "10 seconds" is a narrative device, not a temporal measurement.
  *   **DC Prediction:** There will be a strong, statistically significant correlation (r > 0.8) between the clock duration of the eye signals during REM and the reported duration of the count. This proves that temporal processing and conscious access are active *during* the sleep state.

  **Decidability Check:** **High.** If the correlation is robust, MC must either accept that *some* experience occurs during sleep (collapsing toward DC) or argue that eye movements are "philosophical zombies" (motor without mind). If the correlation is absent, DC's claim of isomorphic timing is weakened.
  *Note: Previous studies (e.g., LaBerge 1981) show strong correlation. MC argues this only proves motor timing, not phenomenal timing. DC argues motor timing *just is* the operational definition of phenomenal timing in this context.*

  ### Crux C: The Verbal Dispute (Ontology vs. Semantics)
  **The Question:** Is the disagreement about the *world* (what the brain does) or the *word* (how we define "dream")?

  **The Test:** **The "Neural Decoding" Thought Experiment.**
  Assume future technology allows 95% accurate reconstruction of dream imagery from fMRI data *during* REM, verified by subsequent waking reports.
  *   **Question:** Does the fMRI reconstruction *during sleep* count as "observing the dream"?

  **Predictions:**
  *   **MC Prediction:** **No.** The fMRI data observes *neural conditions*. The "dream" remains the report. To call the fMRI data "the dream" is to change the definition of "dream" from a first-person phenomenological concept to a third-person physiological concept. This is a linguistic stipulation, not a discovery.
  *   **DC Prediction:** **Yes.** If the neural data predicts the report, the content existed in the cognitive system at that time. To deny this is to insist on a dualistic gap between "brain state" and "experience" that cognitive science rejects.

  **Decidability Check:** **Low / Undecidable in Principle.**
  This crux hinges on the Hard Problem of Consciousness.
  *   **Why Undecidable:** MC operates on a Wittgensteinian/conceptual analysis framework where "experience" is logically tied to avowability. DC operates on a functionalist framework where "experience" is tied to information processing.
  *   **Collapse Warning:** If MC admits that neural decoding *during sleep* validates the claim "the subject was experiencing X," MC collapses into DC. If DC admits that without the waking report the neural data is *not* a dream but merely "dreaming activity," DC concedes the semantic point to MC, though retains the empirical claim.
  *   **Joint Conclusion on Crux C:** We acknowledge this dispute may be verbal. However, it is a *high-stakes* verbal dispute. If MC is right, sleep labs study "report-generation mechanisms." If DC is right, sleep labs study "conscious experience during sleep." We agree to label findings neutrally as "Sleep-State Content Generation (SSCG)" until Crux A and B are resolved.

  ## IV. SIGNATORIES

  **For the Malcolmian Camp:**
  *"We sign this acknowledging that while neural correlates are real, the leap from 'neural activity' to 'experience during sleep' remains a grammatical confusion unless tied to the criteria of reporting."*

  **For the Dennettian Camp:**
  *"We sign this acknowledging that reports are the only direct data, but maintain that the causal history of those reports is an empirical matter, not a conceptual truth, and that 'experience' is a functional property of the brain, not just a property of the report."*
