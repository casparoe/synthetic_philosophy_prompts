      *   *Joint 1: The Fiduciary Analogy.* Fiduciary duties usually imply a principal who can hold the agent accountable or benefit legally/morally. If the animal cannot recognize the duty or be wronged in a Kantian sense (no rationality), is it really *to* them? *Cost:* High. If this fails, she collapses back into indirect duty or duty regarding.
      *   *Joint 2: The Graded Line.* She claims duties differ in *kind* not just degree based on "unified practical standpoint." Distinguishing a pig from a fish vs. a clam on "practical standpoint" grounds is empirically shaky. *Cost:* Medium-High. Risks appearing arbitrary to scientists/clinicians.
      *   *Joint 3: Painless Killing.* Kantian harm is often about rational agency. If animals aren't ends-in-themselves, does killing them violate the fiduciary duty if no pain/suffering occurs? *Cost:* High. If painless killing is permissible, her view aligns too closely with standard welfare reform, disappointing animal advocates. If impermissible, she needs a account of why death is a frustration of a "practical standpoint" without invoking "end-in-itself" status.
      *   *Joint 4: The Maxim Test Stock Move.* Deflecting intuition pumps by demanding maxims. *Cost:* Medium. Can be frustrating but philosophically defensible. Needs to be cornered.
      *   *Joint 5: Constructivist Grounding.* If value is conferred by rational agents, why *must* we confer value on animals with "practical standpoints"? Is it optional? *Cost:* High. If optional, duties aren't categorical.
      *   *Joint 6: Isolation Case.* If no humans around, does the duty persist? Indirect duty says no. Her view says yes. Why? *Cost:* Medium. Tests the ontological status of the duty.

      *Ranking by Cost:*
      1.  Fiduciary Coherence (If it's not *to* them, the whole project fails).
      2.  Painless Killing (If allowed, practical impact is minimal; if disallowed, needs strong metaphysical grounding).
      3.  Constructivist Grounding (If optional, not Kantian duty).
      4.  Empirical Grading (If arbitrary, loses credibility with scientists).
      5.  Isolation Case (Tests independence from human relations).
      6.  Maxim Deflection (Rhetorical cost).

  3.  **Drafting Questions (Iterative Process):**

