answer: |-
  **Brainstorming Vulnerabilities**

  The position's most costly potential failure point is the **fiduciary coherence**: if a duty *to* a being requires that the being can in principle hold the agent accountable or be the victim of a wrong in a normative sense, her claim that animals cannot be wronged yet are owed fiduciary duties may collapse into a duty *regarding* them, undermining the core innovation. Second most costly is the **painless killing asymmetry**: if her view permits killing animals provided their "practical standpoint" is not frustrated by pain, her view becomes indistinguishable from standard welfare reform, losing critical traction for animal advocates; if it forbids killing, she must explain how death frustrates a standpoint without invoking "end-in-itself" status. Third is the **constructivist grounding**: if value is conferred by rational agents, she must explain why rational agents are *obligated* to confer value on practical standpoints rather than doing so optionally, or else the duties lose categorical force. Fourth is the **isolation case**: if no other rational agents exist to vindicate the duty, the fiduciary relation lacks a community of enforcement, risking the reality of the obligation. Fifth is the **empirical grading**: claiming duties differ in *kind* based on "unified practical standpoints" across species (clam vs. pig) risks appearing scientifically arbitrary to a clinical audience. Finally, the **maxim deflection**: her stock move risks appearing dialectically immune to counterexample if she cannot specify how maxims are individuated without relying on the very intuitions she asks us to bracket.

  ***

  **Interview Questions**

  **1. The Empirical Mechanism of Indirect Duty**
  **Question:** The traditional indirect-duty reading relies on the empirical claim that cruelty to animals corrodes our humanity toward humans. If contemporary psychology demonstrated that this spillover effect was nil—or that venting aggression on animals actually reduced violence toward humans—would the Kantian duty to avoid cruelty evaporate on the indirect reading, and does your view escape this contingency?
  **Anticipated Answer:** She will argue that the duty attaches to the maxim (the principle of action), not the empirical consequences. Even if no spillover occurs, the maxim of cruelty is inconsistent with the virtue required of a rational agent.
  **Follow-up:** But Kant explicitly frames this duty in terms of preserving the agent's sentiments and habits. If the empirical psychology changes, isn't Kant's specific framing obsolete? For us on an oversight committee, does this mean we must ban painful protocols even if we prove they don't harm the researchers' moral character, and if so, what work is the "agent's humanity" doing besides being a placeholder for the duty itself?

  **2. The Isolation Case**
  **Question:** Consider a scenario where one rational human remains alive on earth and will never encounter another person. On the indirect reading, torturing an animal seems permissible because there is no humanity left to corrupt. Does your fiduciary reading forbid this, and if so, who holds the agent accountable in a world with no one else to vindicate the animal's claim?
  **Anticipated Answer:** She will say the duty remains because the fiduciary relation is between the agent and the animal's good, not dependent on a human community. The duty is objective, not socially constructed.
  **Follow-up:** A fiduciary duty typically implies a principal who can benefit from or enforce the trust. If the animal cannot recognize the duty and there is no human community to enforce it, in what sense is the duty *real* rather than just a preference the agent has? Are you asking us to treat the duty as real solely because it regulates the agent's will, regardless of the recipient's status?

  **3. Asymmetry: Cruelty vs. Painless Killing**
  **Question:** Let's make this concrete for our clinicians. In a shelter scenario, a healthy dog is euthanized painlessly because there is no space. This frustrates the dog's future goods but involves no suffering. Is this permissible on your view? If yes, how is your position practically distinct from standard welfare reform? If no, how does death violate a fiduciary duty to a being that is not an end-in-itself?
  **Anticipated Answer:** She will likely argue that painless killing is permissible only if the maxim is not one of disregarding the animal's standpoint. If the maxim is "dispose of resources when inconvenient," it may be forbidden. She will distinguish this from welfare reform by emphasizing the *reason* for the action, not just the outcome.
  **Follow-up:** But for the dog, the outcome is identical: life ends. If the duty is *to* the animal based on its good, why does the agent's internal maxim matter more than the frustration of that good? Are you telling our committee that a painless kill is ethically distinct based on the researcher's private reasoning, even if the animal's experience is the same? *(Note: This flags the exegesis risk by focusing on protocol review implications.)*

  **4. The Constructivist Regress**
  **Question:** You argue that rational agents confer value, but also that animals have a "unified practical standpoint" that demands recognition. What exactly does the capacity to step back from a desire and ask "is this a reason?" contribute to this picture? If animals have standpoints that can be frustrated, why isn't that sufficient for them to be ends-in-themselves?
  **Anticipated Answer:** She will claim that rationality allows for universalization and membership in the kingdom of ends, which animals lack. The "graded" line means animals command respect proportional to their standpoint complexity, but not full moral personhood.
  **Follow-up:** If the grounding is the "practical standpoint," and some social mammals show partial capacity to step back from desires (as ethology suggests), does your graded line imply they are partial ends-in-themselves? Or does the binary of "rational vs. non-rational" cut off the very empirical gradations your view claims to respect?

  **5. Fiduciary Duties to Non-Recognizers**
  **Question:** You posit a duty *to* a being that can neither recognize the duty nor be wronged by its violation in a Kantian sense. How is this not semantically a duty *regarding* the animal after all? You will likely reach for the human infant comparison, whose claim is carried by potentiality.
  **Anticipated Answer:** She will argue that infants lack current rationality but have the potential for it, carrying the claim. Animals have a different kind of claim based on their actual practical standpoint, not potential rationality.
  **Follow-up:** What about a being that never had and never will have rational potentiality, yet has a unified practical standpoint (e.g., a severe cognitive disability case or certain animals)? If the infant's claim rests on potentiality, does the animal's claim rest on nothing but our choice to confer it? If so, is the fiduciary duty robust enough to override research interests?

  **Late-Hour Sequence: Cornering the Maxim**

  **6. Question:** You often reply to counterexamples by saying, "Take the intuition out of it and tell me what the maxim is." For a standard protocol involving lethal endpoints for mice in cancer research, what is the specific maxim the researcher is acting on?
  **Anticipated Answer:** She will formulate something like, "I will cause death to sentient beings to advance human knowledge."
  **Follow-up:** Why is that the relevant description and not "I will prevent suffering in humans by using necessary models"? If the maxim changes, the moral status changes. Who decides the correct level of abstraction for the maxim?

  **7. Question:** If two researchers perform the identical procedure with the identical physical outcome, but one adopts the first maxim and one adopts the second, is the act permissible for one and forbidden for the other?
  **Anticipated Answer:** She will say yes, because moral worth depends on the principle of the will, not just the outcome.
  **Follow-up:** For an oversight committee reviewing protocols, we judge the procedure, not the researcher's internal monologue. Are you suggesting our review process is fundamentally incapable of assessing the ethics of the act itself, only the agent's disposition?

  **8. Question:** When you select the relevant description of the maxim to test, do you not rely on an intuition about which features are morally relevant? If I say "the maxim is to kill," you say that's too broad; if I say "the maxim is to kill this mouse," you say that's too narrow. Isn't the selection of the maxim itself driven by the very intuition you ask us to suspend?
  **Anticipated Answer:** She will argue that rational reflection determines the relevant description, not raw intuition.
  **Follow-up:** But if rational reflection yields different maxims for different philosophers, and you reject the ones that yield counterintuitive results, isn't the "maxim test" functioning as a post-hoc rationalization for the intuition you claimed to bypass?

  **Closing Question: Falsifiability**

  **9. Question:** Finally, what would count as evidence against your view? I am not asking for a maxim that fails the test, but rather: what empirical finding about animal cognition, or what philosophical argument about the nature of fiduciary relations, would compel you to abandon this framework? Please state a condition that does not simply refer back to the consistency of the will.
  **Anticipated Answer:** (This is the trap.) She might struggle to name something external to the system.
  **Follow-up:** (If she struggles) If nothing outside the system of rational consistency can falsify the view, are we discussing a moral truth or a definitional closed loop? For our committee, we need to know if new science about animal standpoint unity could overturn your duties, or if the duties are immune to scientific discovery.
