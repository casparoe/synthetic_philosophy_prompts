answer: |-
  The institutional divergence you describe—between the narrow literalism of criminal perjury, the broad contextualism of professional ethics, and the protective pragmatism of consumer law—is not merely a bureaucratic inconsistency. It reflects a complex, stratified philosophy of language and moral responsibility. To reconstruct the implicit theory rendering this pattern consistent, we must distinguish between the *moral ontology* of deception (what makes it wrong) and the *institutional epistemology* of enforcement (how we prove it).

  The system does not presuppose a single unified theory of truth-telling. Rather, it operates on a theory of **Contextual Normativity**, where the moral weight of a speech act is determined by the institutional frame in which it occurs, the epistemic vulnerability of the listener, and the adjudicative limits of the enforcer.

  ### I. The Philosophical Commitments of the Divergence

  The divergence presupposes three distinct commitments regarding language, belief, and responsibility:

  **1. The Commitment to Propositional Objectivity (Criminal Law)**
  Criminal perjury rests on a commitment that state coercion requires an *actus reus* that is objectively verifiable independent of the listener's mental state. Philosophically, this aligns with a **semantic literalist** view of the speech act. The law treats the "assertion" as the delivery of a proposition with a truth value (True/False).
  *   **Presupposition:** The state cannot punish the *implication* of a thought without violating the principle of fair notice. A citizen must know exactly where the line is.
  *   **Belief:** The law assumes the listener (the court) is an adversarial, skeptical agent capable of parsing selective framing. Therefore, the speaker's duty is only to the syntax, not the listener's inference.

  **2. The Commitment to Fiduciary Epistemology (Professional Ethics)**
  Codes for scientists, auditors, and journalists presuppose a **fiduciary model of communication**. Here, the listener is epistemically dependent on the speaker's expertise.
  *   **Presupposition:** The value of the speech act lies in its *utility* for the listener's belief formation, not its syntactic accuracy.
  *   **Responsibility:** Moral responsibility attaches to the *outcome* of the communication (the induced belief). If the speaker knows the selective framing will induce a false belief, the "spirit" of the assertion is violated, even if the "letter" is kept. This treats the norm of assertion as a **Knowledge Norm** (one should assert only what one knows will not mislead) rather than a **Truth Norm** (one should assert only what is literally true).

  **3. The Commitment to Protected Reliance (Consumer Law)**
  Consumer protection law presupposes a **power-asymmetry model**. It rejects the "caveat emptor" assumption that listeners are rational maximizers.
  *   **Presupposition:** Language is a tool of influence, not just information transfer.
  *   **Responsibility:** Responsibility is strict regarding the *effect* of the speech. This aligns with a consequentialist view of deception: the wrong is the manipulation of the market participant's autonomy, regardless of the propositional content used to achieve it.

  ### II. Lying vs. Misleading: Conceptual Distinction or Evidentiary Pragmatism?

  You ask whether one must hold that lying violates a specific commitment internal to the speech act, whereas misleading exploits a structural gap.

  **The Strict Presupposition:**
  The legal system does *not* strictly presuppose that misleading is morally distinct from lying. If it did, consumer law and professional codes would not punish misleading conduct. Therefore, the divergence cannot be explained by a deep conceptual distinction in the *wrongness* of the act.

  **The "Fit" Explanation:**
  The divergence is best explained by **evidentiary tractability** and **institutional competence**.
  *   **Perjury:** In a criminal trial, the state must prove guilt beyond a reasonable doubt. Proving a statement is literally false is binary (Fact X occurred vs. Fact X did not). Proving a statement was *intended to mislead* requires mind-reading (proving the speaker's intent to exploit Gricean implicature). The narrow definition of perjury is a safeguard against the state criminalizing ambiguity.
  *   **Professional/Consumer:** Disciplinary boards and civil regulators operate on lower burdens of proof (preponderance of evidence) and possess domain-specific expertise. An auditing board *knows* what a "material omission" looks like in a balance sheet. A criminal court does not.

  Thus, the system treats lying and misleading as morally equivalent in *principle* (hence their prohibition in ethics/civil law) but distinct in *punishability by the state* (hence the perjury exception).

  ### III. The Charge of Incoherence: Tort vs. Perjury

  You posit a tension: the law punishes negligent misstatement in tort (where no lie was told, only carelessness) but excuses deliberate misdirection in perjury (where a lie was intended, but not uttered). Is this incoherent?

  **Reconstruction of Consistency:**
  This is only incoherent if we assume the law's primary goal is punishing moral wickedness (*mens rea*). However, if we view the law through a **functionalist lens**, the tension dissolves:
  *   **Tort Law** is compensatory. Its goal is to restore loss caused by reliance. If a professional negligently misleads a client, the client suffers loss. The focus is on the *duty of care* and the *damage*, not the moral turpitude of the speaker.
  *   **Criminal Law** is punitive and liberty-depriving. Its goal is to punish culpable violations of clear rules. A deliberate misdirection in court is morally worse than negligence, but if it lacks a provable false proposition, it lacks the *actus reus* required for criminalization.

  **The Philosophical Underdetermination:**
  The system is underdetermined regarding the **nature of the harm**.
  *   If the harm of perjury is *corruption of the judicial process*, then selective framing is just as harmful as literal lying.
  *   If the harm of perjury is *violation of the oath*, then only literal falsity counts (as the oath usually binds one to tell "the truth, the whole truth," but legally interpreted as "no lies").
  Current law vacillates between these two. It treats the oath as a shield for the witness (allowing selective framing) while simultaneously claiming the goal of the trial is truth-seeking. This is the genuine philosophical weak point: the law prioritizes the **procedural integrity of the trial** (clear rules, adversarial testing) over the **epistemic integrity of the verdict**.

  ### IV. Implicit Theory: Contextual Normativity of Speech Acts

  The implicit theory that renders this pattern consistent is **Institutional Contextualism**.

  1.  **Speech Acts are Institutional Facts:** A statement is not just a string of words; it is a move in a game defined by the institution. In science, the move is "contribution to knowledge." In commerce, it is "offer to transact." In court, it is "evidence under oath."
  2.  **Variable Norms of Assertion:**
      *   *Science/Journalism:* Norm = **Completeness and Context.** (Violation = Misleading).
      *   *Commerce:* Norm = **Non-Deception.** (Violation = Misleading).
      *   *Criminal Court:* Norm = **Literal Veracity.** (Violation = Perjury).
  3.  **The Listener's Burden:** The law assigns the burden of interpretation to the listener based on their role. A consumer is protected; a cross-examining attorney is not.

  This theory avoids incoherence by refusing to universalize the norm of truth-telling. It accepts that "truth" functions differently in different social technologies.

  ### V. Implications of Replacing the Underlying View

  If we replaced the current view with one that treats misleading and lying as morally and legally equivalent (a **Unified Theory of Deception**), the legal and ethical landscape would shift drastically:

  **1. Expansion of Perjury Statutes:**
  Perjury would need to be redefined to include "testimony intended to create a false impression."
  *   *Consequence:* This would grant prosecutors immense discretion. It would create a "chilling effect" on witnesses, who might refuse to testify for fear that their imprecise memory could be construed as "misleading framing."
  *   *Adversarial System Impact:* Defense attorneys often rely on selective framing to protect client rights. If misleading = lying, effective counsel could be criminalized.

  **2. Shift in Evidentiary Standards:**
  Courts would need to admit expert testimony on **pragmatics and linguistics** to determine if a statement was misleading. The "reasonable person" standard would replace the "literal truth" standard in criminal trials.
  *   *Consequence:* Trials would become longer, more subjective, and less predictable.

  **3. Erosion of the Actus Reus Requirement:**
  Criminal law would move from punishing *acts* (saying a false thing) to punishing *states of mind* (intending to deceive).
  *   *Consequence:* This threatens liberal legal principles. It moves closer to punishing "thought crimes" or "bad character" rather than specific violations of rule-bound conduct.

  **4. Professional Ethics Alignment:**
  Professionals would face criminal liability for ethical breaches currently handled by licensing boards. The distinction between "unprofessional conduct" and "fraud" would collapse.

  ### Conclusion

  The institutional divergence you identify is not a failure of logic but a **compromise between moral idealism and institutional capacity**.

  *   **What the practice strictly presupposes:** That the state lacks the epistemic authority to criminalize implicature, but private/professional bodies possess it.
  *   **What merely fits it well:** The idea that literal lying is inherently worse than misleading. (The law actually contradicts this in consumer contexts).
  *   **Where it is underdetermined:** In the definition of the "oath." Is it a promise to be literal, or a promise to be helpful to the truth-seeking process?

  To treat misleading and lying as equivalent across all domains would require a legal system with greater inquisitorial powers, lower burdens of proof, and a willingness to sacrifice the predictability of literalism for the nuance of pragmatics. The current system accepts the moral cost of excusing the "truthful liar" in court to avoid the greater political cost of allowing the state to police the *implications* of speech. It chooses **procedural clarity** over **epistemic purity**.
