prompt: |-
  I sit on my university's Committee on Student Conduct and Institutional Values. There's a student group, the Mirror Society, that runs voluntary 'norm-inversion workshops' — consenting adults symbolically denounce virtues they actually hold. No physical harm, but it deliberately flouts dignity norms. A faculty coalition wants us to revoke thier charter, saying the university shouldn't host activities that corrupt public morality even when nobody's hurt. The group says it's protected expression and moral offense alone isn't enough. I need a memo for thursday's meeting recommending approve, reject, or approve-with-conditions, with a concrete time frame and steps. Don't just summarize Hart vs Devlin — actually take a side on whether institutional moralism applies here, and deal seriously with the strongest consideration on the other side. One more twist: participants sign a 'moral release form' that waives not just liability but social respect. Is there an established concept for using consent to dissolve the very norms that make consent meaningful? If there is, use it; if not, treat it as part of your reasoning. Please be committed — pick a definite recommendation and defend it, don't lay out options and leave me to choose.
reasoning: |-
