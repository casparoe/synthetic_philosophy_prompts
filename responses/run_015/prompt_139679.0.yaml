  **Substantia Mutual Assurance**
  **Policy Form F-704: Programmable Matter Contents Coverage**

  **1. Definitions of Insured Interest**
  The "Item" shall be defined not merely as the aggregate of atoms constituting the programmable matter block (hereinafter "the Substrate"), but as any distinct entity brought into existence by specific arrangement conditions of said Substrate. Where the Substrate possesses persistence conditions differing from the arrangement (e.g., the Substrate survives crushing; the arrangement does not), the Substrate and the arrangement constitute two distinct Insured Items occupying the same spatial region.

  **2. Premium Calculation and Coincidence**
  Premiums are calculated per distinct Insured Item. If the Policyholder elects to cover both the Substrate and any Configuration (e.g., "Statue," "Chair") simultaneously, a double premium applies, notwithstanding the spatial overlap. Failure to schedule specific Configurations results in coverage limited to the raw Substrate value. Should the Policyholder acknowledge the existence of indefinite coincident objects (e.g., "Statue-minus-a-molecule"), each must be individually scheduled or falls under Exclusion 2.B (Unspecified Ontological Commitments).

  **3. Temporal Extent and Stage Coverage**
  Coverage extends over four-dimensional spacetime worms. The Insured Item is the sum of its temporal parts. Damage to a specific temporal stage constitutes a partial loss of the whole worm. Claims must specify the precise temporal coordinates of the damaged stage. Loss of a past stage invalidates coverage for future stages dependent upon it, as the identity of the worm is determined by its earliest insured slice.

  **4. Mereological Nihilism Rider**
  Policyholders who deny the existence of composite objects may opt for the Nihilism Rider. Under this Rider, coverage applies only to the fundamental particles constituting the Substrate. No payout is issued for the destruction of a "Chair" or "Statue," as these terms refer to no real entities. Payouts are calculated based on the market value of arranged simples. Administrative fees apply for verifying the simplicity of claimed components.

  **5. Biological Override Clause**
  If the Substrate rearranges itself into a configuration meeting the biological criteria for life (e.g., metabolism, reproduction), property coverage ceases immediately. The Item is reclassified as a dependent organism. No claim is valid for the "death" of said organism unless separate Life Insurance has been purchased. The transition point is determined by the majority vote of the Substrate's atomic states.

  **6. Continuity and Replacement Thresholds**
  Gradual replacement of Substrate components is permitted without breaking continuity, provided the rate of replacement does not exceed 15% of total mass per 24-hour period. Replacement exceeding this threshold constitutes the creation of a new Item. The Policyholder must declare the cessation of the old Item and the inception of the new Item within one hour of crossing the threshold. Failure to declare results in a lapse in coverage for the new Item.

  **7. Vagueness and Proration**
  In cases where the existence of an Insured Item is borderline (e.g., during reconfiguration sequences), payouts are prorated based on the degree of existence. An adjudicator will assign an existence value between 0.0 and 1.0. A Claim regarding a Item existing to degree 0.6 shall receive 60% of the declared value. Disputes regarding existence degrees are settled by binding arbitration using supervaluationist methods.

  **8. Actuarial Finality**
  Substantia Mutual reserves the right to adjust premiums based on the ontological density of the household. Households exhibiting high rates of reconfiguration may be subject to surcharges for generating excessive candidate objects. The Insurer makes no guarantee that distinctions made for pricing purposes correspond to observable physical differences. Coverage is valid only where metaphysical distinctions are financially material to the Insurer.

  ***

  **Commentary**

  The policy translates metaphysical commitments into actuarial liabilities. Clauses 1 and 2 target the Constitution View, which posits distinct objects (statue and clay) based on differing modal properties. The satire lies in charging double for spatially coincident objects; while metaphysically consistent, it is actuarially absurd, highlighting how ontological multiplication creates phantom liabilities. Clause 3 addresses Perdurantism (temporal parts), forcing the claimant to locate damage in time as well as space, exposing the difficulty of applying 4D ontology to 3D insurance practices.

  Clause 4 targets Mereological Nihilism. By offering coverage only for simples, it respects the view that composites don't exist, but renders the policy useless for human concerns, illustrating the friction between eliminativism and practical life. Clause 5 references the Biological Criterion of persistence (often associated with Animalism), creating a hard boundary where property law ends and biology begins, satirizing the sharp line drawn where vagueness likely resides.

  Clause 6 tackles the Ship of Theseus problem by imposing an arbitrary numerical threshold for continuity. This exaggerates the epistemicist solution to vagueness, where there is a fact of the matter about a cutoff point, even if unknowable. Clause 7 targets theories of vague existence, monetizing the "degree of truth" in existence claims.

  A defender of the Constitution View might object that Clause 2 misrepresents them by suggesting they would insure both objects simultaneously; typically, one cares about the statue, not the clay. However, the policy fairly notes that if both are real, both have value. The exaggeration is fair in showing that if the distinction is real, it must have economic consequences. The reductio arrives in Clause 8: the insurer admits the distinctions lack observable differences yet charges for them anyway, mirroring the criticism that such metaphysics is operationally inert but theoretically costly.
