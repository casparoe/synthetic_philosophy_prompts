answer: |-
  Here is the protocol specification for **Personhood v1.0 (Ubuntu-Relational Build)** based on your distributed systems architecture, followed by the Residue Report.

  ---

  # Protocol Specification: Personhood v1.0 (Ubuntu-Relational Build)

  ### 1. Node State Definition
  *   **Default State:** `UNINITIALIZED`. No inherent `PERSON` flag exists at boot.
  *   **Active State:** `PERSON`. Requires valid `LEASE_TOKEN`.
  *   **Degraded State:** `MORAL_ZOMBIE`. Node exists in topology (`ID` persists), but `CLAIM_RIGHTS` = `NULL`.

  ### 2. The Heartbeat Lease Mechanism
  *   **Lease Duration:** `TTL` (Time-To-Live). Variable based on cultural context, but finite.
  *   **Renewal Condition:** To transition from `UNINITIALIZED` or maintain `PERSON`, a Node $N$ must receive `ACK` packets from a **Quorum of $Q \ge 2$** distinct peer nodes within the last `TTL` window.
  *   **Payload:** The `ACK` is not a ping; it contains a payload of *Recognition* (validation of $N$'s actions/status within the shared ontology).
  *   **Failure Mode:** If $N$ fails to secure $Q \ge 2$ ACKs before `TTL` expiration:
      1.  State transitions to `MORAL_ZOMBIE`.
      2.  Incoming edges (obligations *to* $N$) are deprecated.
      3.  Outgoing edges (obligations *from* $N$) remain active but unenforceable.

  ### 3. Partition Tolerance (The CAP Trade-off)
  *   **Network Split:** If the graph partitions such that Node $N$ is isolated from Quorum $Q$:
      *   **Consistency:** Personhood status becomes inconsistent across the global graph. Partition A may see $N$ as `PERSON` (if local quorum exists), Partition B sees $N$ as `MORAL_ZOMBIE`.
      *   **Availability:** $N$ cannot exercise claim-rights in Partition B.
      *   **Resolution:** Upon heal, the system must reconcile state. If $N$ was `MORAL_ZOMBIE` in the majority partition, that state propagates. $N$ is socially dead until re-handshaked.

  ### 4. Edge Dynamics (Obligations)
  *   **Weighted Edges:** Obligations are not boolean. They carry bandwidth limits.
  *   **Backpressure:** If $N$ becomes `MORAL_ZOMBIE`, peers are no longer required to allocate resources to $N$. Dropping packets to $N$ is no longer a protocol violation.
  *   **Broadcast Storms:** If $N$ attempts to assert `CLAIM_RIGHTS` while in `MORAL_ZOMBIE` state, peers discard the request as malformed.

  ---

  # Residue Report

  ### 1. What doesn't map onto nodes and edges? (The Latency of Spirit)
  **The Asymmetry of Care.**
  Your protocol requires a quorum of 2. This implies symmetry: I need two people to validate me, just as I validate them. Ubuntu often handles asymmetric states (infants, the comatose, the elderly with dementia). In your spec, a comatose node cannot send heartbeats, nor can it easily solicit ACKs. In Ubuntu, the community *leases* personhood to the comatose on their behalf without requiring active participation from the node. Your model risks crashing nodes that are temporarily offline (illness) rather than buffering their state.

  **The "Zombie" Permanence.**
  In your spec, lease lapse = zero claim-rights. In Ubuntu, social death is often gradual and reversible through ritual (reconciliation), not just a renewed handshake. The term "Moral Zombie" implies a hollow shell. Ubuntu suggests that even when personhood is diminished, the *potential* for humanity remains sacred. Your model treats the lapse as a functional failure; Ubuntu treats it as a spiritual rupture that requires more than just packet renewal to fix.

  **Interiority.**
  Nodes process; they do not *feel*. Ubuntu relies on a shared essence (*botho* or *ubuntu*) that is phenomenological. You can map the *behavior* of recognition, but you cannot map the *experience* of being recognized. The "ACK" in your system is a signal; in Ubuntu, it is an affective state.

  ### 2. Is the heartbeat thing capturing something real, or forcing a metaphor?
  **It captures the "Maintenance Cost" of Relationships.**
  This is the strongest part of your metaphor. Relational personhood is not a one-time allocation of memory; it is a continuous process. It requires CPU cycles (attention) and bandwidth (time). The idea that personhood lapses without active renewal is faithful to the African philosophical notion that you must *become* a person continuously through action. If you stop acting within the community, you cease to be a person. The TTL (Time-To-Live) accurately models the fragility of social bonds.

  **It captures "Consensus Reality."**
  The $Q \ge 2$ requirement is brilliant. It prevents a "Sybil Attack" on personhood where a node declares itself a person in isolation (solipsism). It enforces that personhood is a distributed consensus problem. You are only a person if the network agrees you are.

  **Where it forces the metaphor:**
  It makes the process too binary and brittle. Human recognition is fuzzy. Sometimes you have 1.5 peers. Sometimes the network is laggy (people are busy), but the bond holds. Your model treats latency (delayed recognition) the same as packet loss (rejection). In human terms, being ignored for a week is different than being ostracized forever, but your TTL might treat them identically.

  ### 3. What is literally inexpressible in this vocabulary?
  **Ancestry (The Dead Nodes).**
  Ubuntu explicitly includes ancestors. In your graph, dead nodes are removed or archived. In Ubuntu, dead nodes actively participate in the quorum. They send "ghost packets" that influence routing decisions of the living. Your system has no mechanism for a node that has physically shut down to still hold a vote in the consensus algorithm.

  **Forgiveness as State Reset.**
  In distributed systems, if a lease lapses, you usually have to re-authenticate from scratch. In Ubuntu, forgiveness can retroactively heal the gap. It can rewrite the log. If I wrong you and you forgive me, it's not just a new lease; it's as if the timeout never happened. Your vocabulary struggles to express *retroactive* state correction without violating immutability logs.

  **The "We" prior to the "I".**
  Your model assumes Nodes exist first, then establish Edges. Ubuntu posits that the Network (the Community) exists prior to the Node. The Node is a virtualization of the Network. In your spec, if you delete all edges, the Node still exists as a `MORAL_ZOMBIE`. In strict Ubuntu, if you delete all edges, the Node ceases to exist entirely. There is no "Zombie" state; there is only `NULL`. Your model preserves the individual substrate too strongly; it allows for an isolated existence (even if rights-less), whereas Ubuntu suggests isolation is ontological non-existence.

  ### Summary Verdict
  Your **Heartbeat Lease** model is a high-fidelity translation of the *functional* requirements of relational personhood. It successfully models the fragility and consensus-based nature of social status.

  However, it fails on **fault tolerance for vulnerability**. By requiring active heartbeats, you exclude those who cannot transmit (the vulnerable), whereas Ubuntu often routes around that damage by having the community carry the load. You have built a system for **Citizens**, not a system for **Humans**.
