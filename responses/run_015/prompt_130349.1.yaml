answer: |-
  So there's this nightclub called "The Demos." A guy walks up to the velvet rope and the bouncer says, "Hold on, we're currently voting on the entry criteria."

  The guy says, "Cool, can I vote?"

  The bouncer says, "Only if you're a member."

  The guy says, "I'm applying for membership right now."

  The bouncer hands him a clipboard. "Okay, fill this out. Question one: Are you affected by the club's music policy?"

  The guy says, "What's the music policy?"

  The bouncer says, "It's whatever the current members hum."

  The guy says, "I'm not a current member, so I can't hum."

  "Exactly," says the bouncer. "So you aren't affected by the music. And if you aren't affected, you don't get a vote on the entry criteria. And if you don't get a vote, you can't become a member to start humming."

  The guy says, "Okay, so who *is* voting then?"

  The bouncer looks around nervously. "Just me."

  The guy says, "You're a member?"

  The bouncer says, "Technically... no. My shift ended five minutes ago, so I'm also applying for membership. But I can't vote for myself because I'm not a member yet, and I can't let you in to vote for me because you're not a member yet."

  "So who's guarding the door?"

  "The principle of self-determination."

  "Is it working?"

  "No, it's just standing here looking imposing while we both hum in different keys waiting for a constitution to fall out of the sky."
