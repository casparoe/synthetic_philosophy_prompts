answer: |-
  # The Shifting Ground of Meaning: The Problem of Functional Shift in Teleosemantics

  Teleosemantics stands as one of the most robust naturalistic attempts to explain mental content. By grounding the representational properties of mental states in the evolutionary history of the cognitive mechanisms that produce them, teleosemantics promises to explain how normative notions like "truth," "accuracy," and "misrepresentation" can emerge from the blind processes of natural selection. Central to this project is the notion of a "proper function": a mental state represents what it is the function of the producing mechanism to indicate, where "function" is defined by the effects for which the mechanism was historically selected. However, this reliance on evolutionary history conceals a structural vulnerability. Teleosemantic theories face a serious and underappreciated difficulty: the **Problem of Functional Shift**.

  The problem arises from the messy reality of evolutionary time. Cognitive mechanisms rarely evolve in static environments where a single function dominates indefinitely. Instead, lineages often undergo periods where a mechanism is selected for Function $F_1$ during Period $T_1$, and subsequently co-opted or modified to serve a distinct Function $F_2$ during Period $T_2$. In cases of functional shift, both functions contribute significantly to the cumulative selection regime that shaped the mechanism's current form. When a teleosemanticist attempts to fix the content of the representations such a mechanism produces by appealing to its proper function, the notion of that function becomes indeterminate. There is no biological fact of the matter about which of the several historical functions is the "proper" one. This essay argues that this indeterminacy cannot be resolved by privileging recency, individuating mechanisms more finely, or appealing to current fitness, and concludes that functional shift reveals a deeper tension in the teleosemantic project: the impossibility of extracting stable normative facts from purely historical ones.

  ### The Nature of Functional Shift

  To understand the severity of functional shift, one must recognize that teleosemantics relies on the "Selected Effect" (SE) account of function. On this view, a trait's proper function is the effect it performed in the past that explains its proliferation. For a simple reflex, this is straightforward. For complex cognitive systems, however, evolutionary history is rarely linear. Consider a neural mechanism $M$ in a primate lineage. During the savannah phase of its evolution ($T_1$), $M$ was selected because it detected low-frequency vibrations indicative of large predators, triggering avoidance behavior ($F_1$). Later, as the lineage moved into dense forest environments ($T_2$), the same mechanism $M$ was preserved and refined because it detected vibrations indicative of falling fruit or prey movement, triggering approach behavior ($F_2$).

  If both $T_1$ and $T_2$ were substantial periods contributing to the fixation of $M$ in the genome, the cumulative selection history supports two conflicting proper functions. Does a state produced by $M$ represent *Predator* (fixing content via $F_1$) or *Food Source* (fixing content via $F_2$)? If the teleosemanticist claims the content is indeterminate, they concede that naturalized content is often unknowable or non-existent. If they claim one function is the "real" proper function, they must provide a principled criterion for selection. As we shall see, the available criteria fail.

  ### The Failure of Recency

  A natural first response to functional shift is to privilege the most recent selection episode. One might argue that the proper function is the one for which the mechanism was *last* selected, as this reflects the most current adaptation of the organism. However, recency has no principled connection to content determination. Evolution is not a teleological process aiming at a final state; it is a cumulative historical process. A trait selected for a specific function over one million years, and then co-opted for a different function over the last ten thousand years, retains the structural imprint of both regimes.

  To privilege recency is to arbitrarily sever the mechanism from the deep history that largely constitutes its biological identity. Furthermore, evolutionary "recency" is difficult to define. Selection pressures fluctuate; if a pressure returns to an ancestral state, does the content flicker back and forth? Content, intuitively, should be more stable than the fluctuating pressures of the immediate evolutionary past. If the content of a belief-forming mechanism depended on the specific selection pressures of the last few thousand years, content would be radically unstable across generations. Therefore, recency cannot resolve the indeterminacy without making content arbitrarily volatile.

  ### The Failure of Fine-Grained Individuation

  A second strategy involves individuating the mechanism more finely. The teleosemanticist might argue that there are not one mechanism with two functions, but two distinct mechanisms, $M_1$ and $M_2$, perhaps distinguished by subtle neural differences or contextual triggers. $M_1$ has the proper function $F_1$, and $M_2$ has the proper function $F_2$. Thus, the indeterminacy is resolved by distinguishing the vehicles of content.

  This move, however, merely relocates the problem without resolving the underlying indeterminacy. The burden shifts to providing a biological criterion for individuating $M_1$ and $M_2$. If the physical substrate is continuous and the mechanism operates via the same causal pathway for both functions, the claim that there are "two mechanisms" is an interpretative act by the theorist, not a fact grounded in biology. Evolution often works by tinkering with existing structures rather than building new ones from scratch. To insist on fine-grained individuation is to impose a discrete taxonomy on a continuous evolutionary process. Until there is a non-arbitrary biological fact that distinguishes the "predator-detection module" from the "food-detection module" within the same neural circuit, the indeterminacy remains. We are left asking: which mechanism is the current token an instance of? The answer remains historically underdetermined.

  ### The Failure of Current Fitness

  A third response is to abandon the strict historical focus and appeal to the mechanism's current contribution to fitness. On this view, the proper function is simply what the mechanism *now* does to enhance survival and reproduction. While this resolves the indeterminacy (the function is whatever works now), it abandons the historical character of teleosemantics and collapses it into a form of causal or informational semantics.

  The primary advantage of teleosemantics over causal theories (like Dretske's informational semantics) is its ability to explain error. Causal theories struggle to explain how a state can be false if it is causally linked to the world; teleosemantics solves this by appealing to history (the state is false if it fails to perform its *historical* function, even if it is causally triggered). If we ground content in *current* fitness, we lose the normative distance required for misrepresentation. If a mechanism represents whatever currently aids fitness, then whenever it aids fitness, it is "correct" by definition. This eliminates the possibility of systematic error in a way that teleosemantics was designed to avoid. By solving functional shift through current utility, the theory ceases to be teleosemantics and becomes a variant of functional role semantics, surrendering its unique naturalistic selling point.

  ### The Deeper Tension: Normativity from History

  The failure of these standard replies suggests that the Problem of Functional Shift reveals a deeper tension in the teleosemantic project: the attempt to extract normative facts about representational content from purely historical facts about selection. Teleosemantics aims to naturalize the "ought" of representation (what a state *ought* to represent) via the "was" of evolution (what the state *was* selected for).

  Functional shift demonstrates that the "was" is often plural, discontinuous, and ambiguous. History does not provide a single, stable pillar upon which to rest a normative standard; it provides a narrative of shifting pressures. Normative facts, by contrast, require stability. For a state to have a determinate truth condition, there must be a determinate standard of accuracy. If the evolutionary history supports multiple, conflicting standards ($F_1$ vs. $F_2$), history alone cannot select between them without importing a non-historical normative premise (e.g., "recency matters" or "complexity matters").

  This implies that teleosemantics cannot fully succeed as a reductive naturalistic project. It cannot derive the normativity of content solely from the brute facts of selection history because those facts are themselves indeterminate regarding function in cases of shift. To resolve the indeterminacy, the theorist must appeal to principles of interpretation that are not themselves found in the evolutionary record.

  ### Conclusion

  The Problem of Functional Shift poses a critical challenge to teleosemantics. It demonstrates that in the complex reality of evolutionary time, the link between selection history and proper function is not one-to-one, but often one-to-many. Attempts to resolve this by privileging recency, individuating mechanisms, or appealing to current fitness either introduce arbitrariness, relocate the indeterminacy, or abandon the core historical commitments of the theory. Ultimately, this difficulty suggests that the teleosemantic hope of grounding the normative "aboutness" of mental states purely in the historical "because" of natural selection is flawed. If history is messy and shifting, and content is stable and normative, then content cannot be constituted by history alone. The project of naturalizing meaning may require resources beyond the genealogy of selection, acknowledging that the determination of content involves an interpretive stability that blind evolutionary processes do not guarantee.
