prompt: |-
  So I just got into like a two hour argument with my friend about whether the human appendix has a function, and I walked away more confused than when I started. His take is that it still has a function because it was selected for something in the past — he kept saying something about digesting cellulase or cellulose, one of those, for our ancestors — so even though it's basically just a useless little sack that occasionally inflames, it still "has the function of" doing that old job. I was pushing back, saying a trait's function should be whatever causal role it's actually playing right now in keeping the organism alive and reproducing, and since the appendix basically does nothing useful for us anymore, it has no function at all. I think I was describing the causal role account and he was describing the etiological one, but honestly I dont know the difference well enough to actually settle it.

  The cases I'm most stuck on are three: vestigial stuff like the appendix or the coccyx, traits that got co-opted for a whole new job (feathers feel like the classic one — insulation first and then flight, right?), and traits that were selected for one thing but are now actively harmful, like our craving for sugar and fat. For each of those I want to know which account handles it better and why, not just a textbook definition of the two. And I also want to understand the specific trouble spots — I have this vague feeling that the etiological view has some problem with traits that stopped doing what they were selected for, and that the causal role view is way too generous about what counts as a function, but I cant articulate either of those. Can you walk me through the real difference and where each one breaks down?
