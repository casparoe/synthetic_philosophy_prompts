      *   *Claim 2: Landauer's principle says acquiring 1 bit dissipates $kT \ln 2$ (Measurement cost).*
          *   **Physics:** **Backwards/Wrong.** Landauer's Principle specifically applies to *erasure* of information (resetting a bit to a standard state), not the *acquisition* (measurement) itself. Measurement can be done reversibly (in principle) without energy cost, provided the correlation is established without entropy increase. The cost comes when you want to reuse the memory (reset it). The pop-sci piece attributes the cost to "acquiring."
          *   **Verdict:** Backwards.
          *   **Matters:** Yes, this is the core confusion the author tries to "solve" with the tape argument.

      *   *Claim 3: The gain is cancelled because acquisition dissipates heat.*
          *   **Physics:** Wrong premise (see above). The gain is cancelled because *erasure* dissipates heat. If you don't erase, you don't pay *that* specific cost immediately.
          *   **Verdict:** Wrong.
          *   **Matters:** Yes.

      *   *Claim 4: Demon can dodge the problem by writing to fresh tape forever (reversible).*
          *   **Physics:** Technically, writing to a blank tape (correlating the demon's memory with the system) can be done reversibly. So, locally, the demon doesn't heat up *during* the measurement/write phase.
          *   **Verdict:** Fine (in a limited sense).
          *   **Matters:** Yes, this is the crux of the "loophole."

      *   *Claim 5: Nanobot with big memory could run indefinitely off thermal jiggling.*
          *   **Physics:** **Wrong.** While the *demon* doesn't pay the erasure cost immediately, the *total system* (Engine + Demon + Tape) entropy increases. The "work" extracted is balanced by the increase in information entropy (the tape becomes random/used). To make a *cycle* that produces net useful work continuously, you must eventually reset the tape. If you never reset, you aren't running a cycle; you are consuming a low-entropy resource (the blank tape). Once the tape is full, you stop. You cannot run *indefinitely*. Furthermore, extracting work from a single heat bath violates the Kelvin-Planck statement of the 2nd Law unless you account for the entropy of the memory. If the memory is considered part of the engine, the total entropy doesn't decrease. But the claim implies *useful* work extraction indefinitely. The "fuel" is the blank tape, not just the heat bath.
          *   **Verdict:** Wrong.
          *   **Matters:** Yes, this is the conclusion being audited.

      *   *Claim 6: Only an engineering limit on memory, not a law of physics, stops us.*
          *   **Physics:** Wrong. The 2nd Law holds. The "fuel" is the negentropy of the blank tape. Once the tape is full, you must erase it to continue, incurring the Landauer cost. If you treat the blank tape as a resource, you are not running off *just* thermal jiggling (single heat bath); you are running off a gradient between the heat bath and the ordered tape.
          *   **Verdict:** Wrong.
          *   **Matters:** Yes.

