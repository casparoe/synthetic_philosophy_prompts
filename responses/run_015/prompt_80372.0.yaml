  7.  **Refining the "Expectation isn't fair" definition:**
      *   I need to be careful not to conflate "Expectation isn't fair" with "Risk Aversion."
      *   Route 1 (EU) *uses* expectation (of utility).
      *   Route 2 rejects expectation (of payoff) as the yardstick, often replacing it with a different statistic (median) or a different averaging process (time).
      *   *Crucial Point:* In the truncated game, EV is *finite*. So Route 2 must argue why a *finite* EV is still a bad price.
      *   *Argument:* Because the probability of exceeding the EV is vanishingly small. (e.g., if EV = $100, probability of winning > $100 is tiny).
