          *   Median: Constant at $2$.
          *   Time-Average (Peters): Growth rate is zero or negative for any entry fee $> 0$ in the long run? Actually, for truncated, it's finite. But the key insight is that the *ensemble average* (EV) diverges from the *time average*.
          *   Crucial distinction: In the truncated game, EV is *finite*. So Route 2 proponents must argue why Finite EV $\neq$ Fair Price.
