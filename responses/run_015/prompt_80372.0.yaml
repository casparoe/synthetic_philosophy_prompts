answer: |-
  This is a sophisticated framing of the St. Petersburg problem. By shifting the focus to the **truncated game** (where the casino has a finite bankroll $M$), you move the discussion from a mathematical singularity (infinite expectation) to a question of **convergence behavior** and **normative justification**.

  In the truncated game, let $N$ be the maximum number of flips allowed such that $2^N \le M$. Roughly, $N \approx \log_2 M$.
  The **Expected Value (EV)** of the truncated game is now finite:
  $$E[X] = \sum_{n=1}^{N} \frac{1}{2^n} 2^n = \sum_{n=1}^{N} 1 = N \approx \log_2 M$$
  If $M = 2^{100}$ (a trillion trillion dollars), the EV is $100. If $M = 2^{1000}$, the EV is $1000.

  Here is how the two routes you identified handle this truncated scenario, followed by an analysis of the consensus status.

  ---

  ### Route 1: The Expected-Utility (EU) Transformation
  **Mechanism:** This approach retains the expectation operator but applies it to a concave transformation of wealth, $U(w)$. The classic Bernoulli proposal uses $U(x) = \ln(x)$.

  **Behavior in the Truncated Game:**
  Under logarithmic utility, the expected utility is:
  $$E[U] = \sum_{n=1}^{N} \frac{1}{2^n} \ln(2^n) = \ln(2) \sum_{n=1}^{N} \frac{n}{2^n}$$
  The series $\sum \frac{n}{2^n}$ converges rapidly to 2. Even with the truncation cap $N$, once $N$ exceeds roughly 10, the sum is effectively indistinguishable from the infinite limit.
  *   **Qualitative Result:** The "fair price" (the certainty equivalent) **saturates**. As you raise the cap $M$ from trillion-dollar levels to astronomical levels, the rational entry fee remains essentially constant (roughly $4 if we ignore baseline wealth, or slightly higher if incorporating initial wealth $w$).
  *   **Dependence on $M$:** The price is asymptotically independent of $M$.

  **Role of the Median:**
  In the EU framework, the median is **irrelevant**. The valuation integrates over the entire probability distribution. The fact that 50% of outcomes yield only $2 is weighed against the tiny probability of the massive payouts, discounted by the diminishing marginal utility of those payouts.

  **Consensus Status:**
  *   **Settled:** It is mathematically settled that concave utility renders the value finite and bounded, even as $M \to \infty$.
  *   **Contested:** Whether this *should* be the normative standard is debated. While EU is the dominant paradigm in neoclassical economics, it faces the "Super St. Petersburg" objection: if the casino pays $e^{2^n}$ instead of $2^n$, even logarithmic utility diverges. Proponents of EU must then posit even more concave utility functions (e.g., bounded utility), which some argue is ad hoc. Furthermore, calibration theorems (like Matthew Rabin's) suggest that risk aversion over small stakes implied by log-utility over large stakes is psychologically implausible.

  ---

  ### Route 2: The "Expectation Isn't a Fair Price" Critique
  **Mechanism:** This route argues that the ensemble average (EV) is the wrong metric for individual decision-making, regardless of whether it is finite or infinite. This view has historical roots (Keynes argued we ignore long-run expectations in the short run) but has been modernized significantly by **Ergodicity Economics** (e.g., Ole Peters). The claim is that EV describes the average across many parallel universes, whereas an agent experiences one trajectory through time.

  **Behavior in the Truncated Game:**
  Even though the EV is finite ($N$), proponents of this route argue it remains a misleading yardstick because the distribution is non-ergodic and highly skewed.
  *   **The Median Argument:** The median payout is always $2 (since probability of heads on flip 1 is 1/2). No matter how high $M$ rises, the "typical" outcome does not change. If you define "fair price" as the median, the price is constant at $2.
  *   **The Time-Average Argument:** In the modern ergodicity framework, one calculates the average growth rate of wealth over time. For the St. Petersburg game, the time-average growth rate is negative for any entry fee greater than a very small amount (often effectively zero or the median).
  *   **Qualitative Result:** Like the EU route, this approach predicts a "fair price" that **saturates** and does not scale with $\log_2 M$. However, the justification is not risk aversion, but **statistical typicality**. You reject the EV of $100 (for $M=2^{100}$) not because you dislike risk, but because you will almost certainly *never* realize that payoff.

  **Role of the Median:**
  Here, the median is **central**. The critique relies on the divergence between the mean (driven by the cap $M$) and the median (fixed at $2). The fact that the median is invariant to $M$ is the primary evidence that the EV is "unfair."

  **Consensus Status:**
  *   **Settled:** It is statistically settled that the median is $2 and invariant to $M$, and that the probability of exceeding the EV decreases as $M$ increases.
  *   **Contested:** The normative leap from "the median is $2" to "you should pay only $2" is highly contested. Mainstream decision theory rejects the median as a general decision criterion because it violates axioms like continuity and independence (e.g., it can lead to intransitive preferences). The Ergodicity Economics resolution is gaining traction in physics and behavioral circles but is not yet accepted as standard in economic theory, which generally prefers to model this behavior via EU or Prospect Theory rather than discarding the expectation operator.

  ---

  ### Comparative Analysis: Truncation and Convergence

  When you introduce the cap $M$, the two routes yield similar **qualitative** predictions but diverge on **mechanism** and **precision**.

  | Feature | Route 1: Expected Utility (Log) | Route 2: Expectation Critique (Median/Ergodic) |
  | :--- | :--- | :--- |
  | **Fair Price as $M \to \infty$** | **Saturates** (approaches a constant). | **Saturates** (approaches the median, $2). |
  | **Sensitivity to $M$** | Extremely low. Once $M$ is large, price stops moving. | None. Price is fixed at median regardless of $M$. |
  | **Why reject EV ($N$)?** | Because marginal utility of high payouts is low. | Because high payouts are statistically atypical (non-ergodic). |
  | **Role of Median ($2)** | **None.** It is an input to the integral, not a determinant. | **Decisive.** It represents the "typical" experience. |
  | **Wealth Dependence** | **Yes.** A richer agent pays more (diminishing sensitivity). | **No.** Median/Time-average is often wealth-independent. |

  **The Crucial Distinction:**
  If you ask a proponent of Route 1 why the price doesn't rise with $M$, they will say: *"The extra dollars at the tail are worth less to me."*
  If you ask a proponent of Route 2, they will say: *"The extra dollars at the tail are worth face value, but I will never see them."*

  In the truncated game, this distinction becomes testable. If you increase the player's baseline wealth, Route 1 predicts the entry fee should rise (log utility of wealth implies risk aversion decreases as wealth increases). Route 2 (specifically the median/ergodic version) predicts the entry fee should remain fixed at $2, because the typical outcome of the *game* hasn't changed, only the player's bankroll has.

  ### Settled vs. Contested: A Summary for Your Seminar

  To ensure you represent the field accurately in your seminar, here is the breakdown of what is agreed upon versus what is live wire debate:

  **1. The Mathematics of the Truncated Game (Settled)**
  *   It is uncontested that capping the payout at $M$ makes the Expected Value finite ($E[X] \approx \log_2 M$).
  *   It is uncontested that the Median remains $2 regardless of $M$.
  *   It is uncontested that Log-Utility yields a finite, bounded value.

  **2. The Normative Status of Expected Value (Contested)**
  *   **Mainstream View:** In a one-off decision with a *finite* EV (the truncated game), standard decision theory maintains that $E[X]$ is a valid benchmark for a "risk-neutral" agent. If an agent pays less, it *must* be explained by risk aversion (Route 1).
  *   **Heterodox View:** Proponents of Route 2 argue that even with finite EV, the expectation is empirically irrelevant for non-ergodic processes. They claim risk aversion is not required to explain the low price; the math of time-averaging suffices. This is **not** consensus; it is a active challenge to the von Neumann-Morgenstern framework.

  **3. The Role of the Median (Contested)**
  *   **Mainstream View:** The median is descriptively useful (it tells you what usually happens) but normatively insufficient. Relying on it violates standard rationality axioms.
  *   **Heterodox View:** In highly skewed distributions like St. Petersburg, the median is a *better* predictor of individual welfare than the mean.
  *   **Your Seminar Point:** You should highlight that while both routes agree the price shouldn't scale with $\log_2 M$, Route 1 treats the median as a coincidence, while Route 2 treats it as the fundamental truth.

  **4. Wealth Effects (Contested/Empirical)**
  *   This is the sharpest wedge between the two. Route 1 implies a billionaire should pay significantly more to play the truncated game than a pauper (because $1000 is less utility to the billionaire). Route 2 (Ergodic/Median) implies both should pay roughly the same (around $2), because the game's dynamics are identical for both. Experimental evidence is mixed but generally shows weak wealth effects, which creates tension for the pure EU model but aligns well with the Expectation Critique.

  ### Recommendation for Your Argument
  When presenting this, avoid framing Route 2 as "the alternative that solves the paradox." Instead, frame it as **"the alternative that dissolves the need for utility curvature."**

  In the truncated game, the paradox is no longer "infinite value vs. finite price." It is "logarithmic growth in EV vs. constant price."
  *   **Route 1** explains the constant price by bending the value of money.
  *   **Route 2** explains the constant price by bending the definition of "average."

  The fact that the median is $2 is the smoking gun for Route 2. For Route 1, the median is merely a data point in a sum. If your seminar allows for it, pointing out that **EU requires wealth-dependence while the Median/Ergodic route does not** is the most concrete way to distinguish them empirically in the truncated setup.
