answer: |-
  The cursor blinked on the monitor, a rhythmic white pulse against the black void of the document. Dr. Aris Thorne hovered her finger over the backspace key.

  *The defendant operated under the belief that the victim posed an immediate threat.*

  She deleted *operated under the belief that*. She deleted *posed*. She deleted *threat*.

  *The defendant's amygdala exhibited hyperactivation in response to visual stimuli from the victim, triggering a sympathetic nervous system cascade that predisposed the motor cortex toward aggressive kinetic output.*

  It was clunky. It was dry. It was ontologically honest.

  Thorne rubbed her temples. She was three weeks away from submitting her final competency evaluation for *State v. Elias*, and the tension in her jaw had become a constant, low-grade firing of the masseter muscles. The case was an anomaly. Elias wasn't insane in the clinical sense. His IQ was average; his affect was flat but appropriate. But Elias had been raised in the Tabula Ranch, a 1970s isolationist commune in the Oregon hinterlands that had survived into the nineties. The Ranch's central doctrine was Linguistic Materialism. They believed that words like *think*, *feel*, *want*, and *believe* were viral memes that infected the brain with dualistic ghosts.

  Children at Tabula were corrected instantly. If a child said, "I want milk," they were not given milk. They were told, "There is no 'I'. There is no 'want'. There is only the body requiring calcium."

  Elias was thirty-four. He had never spoken a sentence containing a propositional attitude. He did not know what it meant to hold a belief.

  Thorne looked at the video feed paused on her second monitor. Elias sat in the evaluation room, hands folded. He wasn't faking. Faking required a theory of mind he didn't possess.

  She resumed typing.

  *Regarding the incident on November 14th: Subject grasped the cutting instrument. Subject approached the victim.*

  Thorne stopped. The prosecution needed *mens rea*. They needed to know if Elias *intended* to kill. Intent was a folk-psychological construct. It implied a future state represented in the mind, a desire for that state, and a belief that an action would achieve it. To Churchland, to Thorne, there was no mind. There was only the brain navigating a high-dimensional state space.

  But the law was built on the ghost. The law *was* the ghost.

  She recalled the interview from Tuesday. She had placed a knife and a pen on the table.

  "Describe this," Thorne had said, pointing to the knife.

  Elias had looked at it. "Steel. Edge. Handle."

  "What was it to you? In the moment. With the victim."

  Elias had frowned, a genuine confusion rippling through his facial musculature. "It was in the hand. The hand moved."

  "Did you think it was a pen?" Thorne had asked, testing the boundary of his perception during the struggle.

  Elias blinked. "Thought is a verb without an object."

  Thorne's fingers twitched. She had almost written it in the draft. *He thought the knife was a pen.*

  She backspaced the phantom sentence before it even hit the screen.

  *During the altercation, the subject's dorsal visual stream misidentified the object's affordances. A categorization error occurred between the lateral occipital complex and the anterior temporal lobe. The neural signature for 'writing instrument' overlapped with the signature for 'blade' due to high stress-induced cortisol levels.*

  It was accurate. But it was useless.

  A neurotypical defendant who stabbed someone because they "thought the knife was a pen" would be found not guilty by reason of mistake of fact. Their neural weights were misfired. Elias's neural weights were misfired. To Thorne, they were identical events. Voltage. Chemistry. Probability.

  But the neurotypical defendant *had* the concept of belief. They could stand in court and say, "I believed it was a pen." The jury would nod. They understood the grammar of the soul.

  Elias could not say that. If Thorne testified that Elias lacked the capacity for belief, the jury would hear "He couldn't help it." If she testified that belief didn't exist for anyone, the jury would hear "He's a monster machine."

  Thorne leaned back. The fluorescent lights hummed at 60 Hertz.

  The problem wasn't Elias. The problem was the court. The legal system required a distinction between *accident* and *intent*. Intent required a believer. If Thorne stayed true to her eliminativism, she had to conclude that *no one* intended anything. Every defendant was just a complex biological puppet dancing on synaptic strings.

  If she wrote that, the report would be thrown out. If she lied and used the folk terms, she violated her science.

  And Elias? Elias was the living proof that the folk terms were learned behaviors, not innate realities. He was a human being without the "mind" the law required to punish him.

  She looked at the paused video again. Elias was looking at his own hands, turning them over. He wasn't reflecting. He was processing proprioceptive feedback.

  Thorne's fingers hovered over the keyboard. She needed to answer the specific question: *Did the defendant intend to cause grievous bodily harm?*

  She typed: *The defendant's neural architecture does not support the representation of future-oriented goal states in the format required by the statutory definition of intent.*

  She stopped. That was too close to "He can't form intent." It implied the capacity was missing, not that the capacity was a myth.

  She deleted it.

  *The defendant's motor output was consistent with a defensive disposition. The causal chain leading to the victim's injury did not require the positing of internal representational states.*

  It was cowardly. It was vague. It allowed the prosecutor to fill in the blank with "He meant to do it" and the defense to fill it with "His brain made him do it." Both were wrong. Both were right.

  Thorne imagined the courtroom. The judge asking, "Dr. Thorne, in your professional opinion, did he *know* what he was doing?"

  Thorne would have to say, "Knowledge is a relation between an agent and a proposition. There are no agents. There are only organisms."

  The judge would bang the gavel. The jury would look at Elias, a man who couldn't say "I'm sorry" because there was no "I" to be sorry.

  She highlighted the paragraph. Her finger hovered over the delete key. If she deleted it, she would have to start over. If she kept it, she was participating in a charade.

  Outside, a siren wailed, a Doppler shift sliding down the frequency scale. A sound wave hitting her eardrum. Nothing more.

  Thorne pressed *Enter*. The cursor moved down a line. She began to type the conclusion. She would not use the word *intent*. She would not use the word *believe*. She would describe the weights, the biases, the firing thresholds. She would give them the truth of the hardware, and let them pretend it was the software.

  *The subject's behavioral disposition at the time of the incident was highly correlated with lethal outcomes. Whether this correlation constitutes moral culpability is a variable outside the scope of neural mapping.*

  She saved the document. *Evaluation_Final_v4.docx*.

  It wouldn't resolve anything. The judge would still have to decide if a man without a "mind" could have a "guilty mind." Thorne had simply removed the map and handed them the territory, knowing they would still try to navigate by the stars.

  She stood up, her knees clicking. She walked to the window and looked out at the parking lot. A man was arguing with a security guard. Thorne watched the man's face redden, his fists clench.

  *Adrenaline,* she thought. *Vasodilation. Amygdala hijack.*

  She watched the man shout something. She didn't need to hear the words to know he was claiming he *wanted* something. He *believed* he was right.

  Thorne turned away from the window. She picked up her coat. There was no point in watching. The outcome was already determined by the weights. She just had to wait to see where they settled.
