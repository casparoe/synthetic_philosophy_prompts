      *   *Decision:* The statute is the trump card. "Priority to the reduction of fatal and life-altering harm." This suggests a lexical constraint (safety first). However, the economist's point is valid: risk is statistical. But there's a moral distinction between *risk* of death and *annoyance*.
      *   *Selected Course:* Fund the Harborview Grade Separation (Crossing). Defer Wayfinding.
      *   *Rule:* Establish a "Safety Threshold." Fatal/life-altering risks take precedence over aggregate burden hours unless the burden hours reach a specific magnitude of *perceptible* harm (which 90 seconds likely doesn't).
      *   *Addressing the 3 Questions:*
          1.  *Lexical vs. Weighting:* Lexical constraint. Fatal/life-altering comes first.
          2.  *Imperceptible Harms:* Sum exposures for individuals. If an individual doesn't perceive it even over time, it counts less than perceptible harm. But risk of death is treated differently than annoyance.
          3.  *Economist's Point:* Acknowledge the logic but distinguish between *catastrophic outcome* (death) and *cumulative annoyance*. We aggregate risk to prevent catastrophe, not to equate annoyance with death.

      *Wait, budget constraint:* $190M budget. Crossing is $186M. Wayfinding is $180M. We can only pick one.
      *Refining the Rule:* Need to make sure staff can apply this next year.
