      *   **Problem:** Staff recommend #1 based on QABH. Enabling statute says "give priority to the reduction of fatal and life-altering harm." Staff interpret this passively (don't create harm). Board member (health economist) argues that risk of death is also imperceptible per traverse, so rejecting aggregation for small harms undermines aggregation for risk.
      *   **Requirements:**
          *   Recommend a concrete course (fund crossing, wayfinding, split, etc.).
          *   State a general rule for staff to apply next year (answering 3 specific questions):
              1.  Lexical constraint vs. weighting for the priority clause (threshold?).
              2.  Treatment of imperceptible harms (zero? tie-breaker? summing exposures?).
              3.  Response to the health economist's argument (aggregation of risk vs. aggregation of annoyance).
          *   Format: Board decision memo.
