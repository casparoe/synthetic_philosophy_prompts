answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Regional Transit Authority
  **FROM:** [Your Name], Board Member
  **DATE:** May 15, 2024
  **SUBJECT:** Capital Budget Prioritization and Metric Reform

  **Recommendation**
  I move that we fund the Harborview Grade Separation ($186 million) in the upcoming capital cycle and defer the Wayfinding and Access Program. This decision aligns with our enabling statute, which instructs us to "give priority to the reduction of fatal and life-altering harm." While the staff's Quality-Adjusted Burden Hours (QABH) metric ranks Wayfinding higher, that metric treats a decade of fatalities as mathematically equivalent to cumulative minor annoyances. This equates distinct categories of harm that our statute and public trust require us to separate.

  To prevent this conflict from recurring, I propose adopting the **Severity-First Aggregation Rule** for all future budget cycles. This rule modifies how staff calculate project rankings and answers three outstanding questions regarding our metric.

  **The Severity-First Aggregation Rule**
  Effective immediately, staff shall apply the following standards when ranking capital projects:

  1.  **Lexical Constraint on Severity:** The statutory priority clause is a lexical constraint, not a weighting factor. Projects preventing fatal or life-altering harm (defined as permanent disability or hospitalization) must be funded before projects addressing non-life-altering burdens (delay, discomfort, confusion), regardless of the aggregate QABH score. Aggregate burden hours only determine ranking *within* severity tiers. There is no threshold where accumulated minor irritations outweigh a prevented fatality.
  2.  **Treatment of Imperceptible Harms:** For non-life-altering harms, we must address the "imperceptibility" problem. Staff shall sum exposures per individual over a one-year period. If the cumulative burden (e.g., 90 seconds daily delay) remains imperceptible to a reasonable person over that year, it receives a severity weight of 0.1. If the cumulative burden becomes perceptible (e.g., chronic pain, consistent significant delay), it receives a weight of 1.0. This prevents ranking systems from valuing invisible frictions above visible safety risks.
  3.  **Risk Aggregation vs. Burden Aggregation:** Regarding the concern that risk of death is also imperceptible per traverse: We distinguish based on *outcome severity*, not input perceptibility. We aggregate probabilities of death because the outcome is catastrophic. We do not aggregate imperceptible annoyances to equal catastrophe because the outcome is trivial. The math of aggregation applies to risks of severe outcomes, but not to the summation of trivial outcomes.

  **Reasoning**
  For our engineers, this rule provides clarity: Safety projects are no longer competing directly with comfort projects on a single sliding scale. You will prioritize grade separations and signal upgrades over signage and walkway regrading until safety backlogs are cleared. For skeptical board members, this honors the statute without abandoning data. We still use QABH to rank safety projects against other safety projects, ensuring efficiency within our moral constraints.

  **The Rejected Position**
  I must acknowledge the strength of the argument raised by our board's health economist and adopted by staff. Their position is logically consistent: if we reject aggregating imperceptible annoyances across millions of people, we undermine the logic of aggregating imperceptible risks across millions of traverses. No individual feels a one-in-ten-million risk of death at a crossing, just as no individual feels a ninety-second delay acutely. Both are statistical constructs. By prioritizing the "identifiable victims" of the crossing over the "statistical annoyances" of the ridership, we may be succumbing to salience bias—valuing visible tragedy over invisible aggregate welfare. If we were purely utilitarian bodies without statutory constraints, their view would be correct: we should maximize total welfare reduction, even if it means trading statistical lives for massive aggregate comfort.

  I reject this view not because the math is wrong, but because the mandate is moral, not merely mathematical. Our statute reflects a public consensus that death is qualitatively different from delay. A transit authority that trades safety for convenience loses its license to operate, even if the "burden hours" justify it.

  **Timeline and Conditions**
  I will move to adopt this rule and the Harborview project at the June 15 vote. If adopted, staff are directed to revise the QABH calculation manual by July 1 to reflect the Severity-First Rule.

  Furthermore, I propose a condition on the Harborview funding: If design reviews reveal the cost will exceed $190 million, we shall scale back the Wayfinding program to cover the overrun rather than defer the safety project. Conversely, if Harborview comes in under budget, the surplus must be applied to the highest-ranked safety project in the backlog, not transferred to comfort initiatives.

  This approach ensures we meet our legal obligations, maintain fiscal discipline, and uphold the public's expectation that their safety comes before their convenience.

  **Action Required**
  Vote on June 15 to approve Capital Budget Cycle 2025 with Harborview Grade Separation as the primary line item, contingent on the adoption of the Severity-First Aggregation Rule for future prioritization.
