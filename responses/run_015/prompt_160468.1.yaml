      *Actually, a nuanced approach might be better:* Fund the Crossing, but mandate a revised metric for Wayfinding that accounts for *perceptibility* thresholds.
      *Let's stick to a clear decision:* Fund Harborview. It satisfies the statute.
      *Rule Formulation:*
      1.  **Priority Clause:** Lexical constraint. Projects preventing fatal/life-altering harm rank above those preventing non-life-altering harm, regardless of aggregate QABH, unless the non-life project prevents harm that aggregates to a *perceptible* life-altering impact on specific individuals (e.g., chronic pain vs. 90-second delay).
