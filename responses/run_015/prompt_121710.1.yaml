answer: |-
  You have identified a genuine structural defect in moral reasoning that is often elided in casual discussion, and your intuition that it does not sit comfortably with standard hypocrisy is correct. In the literature of moral philosophy (which I will discuss structurally rather than bibliographically), this is usually treated as a subset of "standing to blame," but your specific temporal carving—*the intention to transgress* versus *the history of transgression*—is distinct enough to warrant its own definition.

  Here is the carving you are looking for.

  ### 1. The Name and the Definition
  There is no single canonical term for this in the way "hypocrisy" or "akrasia" (weakness of will) are canonical. However, the most precise label for the phenomenon you describe is **Prospective Hypocrisy**.

  **Definition:** Prospective hypocrisy occurs when an agent asserts a normative judgment against another (blame, censure, condemnation) while simultaneously holding a settled intention to violate that same norm in the near future, knowing that they intend to do so.

  It is distinct from ordinary hypocrisy because ordinary hypocrisy relies on a contradiction between *word* and *past/present deed*. Prospective hypocrisy relies on a contradiction between *word* and *future deed*.

  It is distinct from weakness of will (akrasia) because your neighbour is not merely failing; she is *speaking*. The defect is not in her smoking; it is in her *censuring* while intending to smoke. A person can be akratic without being prospectively hypocritical (e.g., if she said, "I know smoking is bad, I'm going to do it, and I wish I didn't tell you it was bad because I'm a bad example"). The "off" feeling arises specifically when the censure is maintained *despite* the intention.

  ### 2. Is it One Phenomenon?
  Yes, your cases (the smoker, the scientist, the councillor) are structurally one phenomenon, though they differ psychologically. What unites them is the **claim of exemption**.

  When you blame someone, you implicitly claim a certain standing or authority. That authority rests on the presumption that you are a fellow subject of the law you are enforcing. You say, "We are both bound by this rule, you broke it, and I am calling you to account."

  In prospective hypocrisy, the speaker effectively says, "We are both bound by this rule, you broke it (or might), and I am calling you to account, *but I have already reserved the right to break it myself.*"

  The defect is a withdrawal of the **reciprocity of obligation**. The blamer demands the other be bound by a norm from which the blamer has already internally excused themselves (via intention). Whether that excuse is born of weakness (the smoker), rationalisation (the scientist), or privilege (the councillor), the structural move is identical: *The rule applies to you, but not to my future self.*

  ### 3. The Variables
  You asked how the defect varies under different conditions. Here is how the structure holds up:

  **Does it matter if the speaker knows it is coming?**
  Yes. This is the boundary between *Prospective Hypocrisy* and *Self-Deceived Hypocrisy*.
  *   **Known Intention (Your cases):** The neighbour knows she will smoke. This creates a cynical disconnect. She is asserting a value she plans to discard. This maximizes the "off" feeling because it renders the censure performative rather than sincere.
  *   **Self-Deception:** If the scientist genuinely believes his data trimming is "different" and does not foresee himself as a transgressor, he is not prospectively hypocritical in his own mind. He is merely mistaken. However, to the observer who sees the similarity, he *appears* prospectively hypocritical. The defect exists objectively (the intention is there), but the moral culpability is reduced by the lack of awareness. It becomes a failure of insight rather than a failure of integrity.

  **Does it vary with likelihood?**
  Yes. The defect scales with the **settledness of the intention**.
  *   If I say "Don't speed," but I *might* speed if I'm late, that is human fallibility. We do not censure that heavily.
  *   If I say "Don't speed," and I have *already arranged* my schedule such that I must speed to arrive on time, that is prospective hypocrisy.
  *   The "off" feeling correlates with the **firmness of the plan**. Your neighbour has the cigarettes in her pocket; the councillor has the accountant's forms filed. The more concrete the future violation, the more the current censure is poisoned.

  **Does it matter if the future act is worse or less bad?**
  Yes. The defect requires a **relevant match**.
  *   If the councillor condemns tax avoidance but plans to commit murder, the censure of tax avoidance is not poisoned.
  *   If she condemns tax avoidance but plans to commit a *different* financial fraud, the poisoning is partial (general financial dishonesty).
  *   The defect is strongest when the *specific* norm being enforced is the one intended for violation. This confirms that the issue is not general "badness," but specific **normative authority**. You lose the standing to enforce Rule X if you intend to break Rule X.

  **Does it attach to other speech acts?**
  This is a crucial boundary. The defect is peculiar to **blame and censure**, and does not fully attach to **warning, praising, or grading**.
  *   **Warning:** "Don't smoke, it's terrible. I'm going to, but don't you." This is not prospectively hypocritical; it is a confession of weakness. It lacks the claim to authority. It says, "I am failing, do not follow me." This is often seen as honest, even helpful.
  *   **Praising:** "Well done for not smoking, unlike me soon." This is patronizing, but not hypocritical.
  *   **Grading/Voting/Punishing:** Here the defect returns with force. If a teacher grades a student down for plagiarism while intending to plagiarize in their own paper, the grade is illegitimate. Why? Because grading is an institutional form of blame. It asserts the authority of the system. If the agent of the system intends to violate the system's rules, they are sabotaging the authority they are meant to embody.

  ### 4. Persons vs. Bodies
  You asked if this travels to institutions (universities, governments). In fact, **it travels better.**

  Human beings have a Get Out of Jail Free card called "weakness of will." We forgive the smoker because we know the will is fragile. We understand the conflict between judgment and desire.

  Institutions, however, *are* their intentions. A university does not have impulses; it has policies and operational mandates.
  *   If a university expels a student for plagiarism while *planning* to ignore it in a star hire, this is not weakness of will. It is **Institutional Bad Faith**.
  *   Because an institution cannot claim "I couldn't help myself," the contradiction is starker. It reveals that the rule was never a principle, but merely a tool of control.
  *   In your reading group's terms: The dictator case you mentioned unsettles blame because we realise we lack the *courage* to have done otherwise. The institutional case unsettles blame because we realise the accuser lacks the *commitment* to the rule.

  In the institutional case, the defect is not just prospective hypocrisy; it is **fraudulent governance**. The rule is being sold as universal while being purchased as optional.

  ### 5. Why the Counterfactual Case is Different
  You mentioned the case that puzzles you: the person who never did the thing and never will, only because the occasion never arose, but who would have done it. Why does this not poison their blame?

  Because **intention** is the active ingredient, not **disposition**.
  *   To blame someone, you must stand for the rule.
  *   If I *would* have broken the rule but never *intended* to (because the situation never arose), I am still standing for the rule. I am still committed to it. My character might be weak, but my will is aligned.
  *   In your neighbour's case, her will is *misaligned*. She intends to break the rule.
  *   Moral standing relies on the alignment of the will with the norm. The counterfactual transgressor has a weak character but an aligned will. The prospective hypocrite has a misaligned will.

  ### 6. Summary of the Carving
  To answer your final request for a definition you can use in your group:

  **Prospective Hypocrisy** is the act of asserting moral authority over another for a violation of a norm, while holding a settled intention to violate that same norm oneself.

  **What it excludes:**
  1.  **Ordinary Hypocrisy:** Where the violation has already occurred.
  2.  **Akrasia (Weakness of Will):** Where the violation occurs without the assertion of authority over others (e.g., confessing one's own failure).
  3.  **Counterfactual Weakness:** Where one would have violated the norm given the chance, but never formed the intention to do so.
  4.  **Honest Warning:** Where one advises against a fault while admitting one's own inability to avoid it, without claiming superior standing.

  **The Underlying Norm:**
  The norm violated is **Reciprocal Subjection**. To blame is to say, "This law binds us both." To intend to break the law is to say, "This law does not bind me." To do both simultaneously is to lie about the nature of the law. It treats the law as a weapon to be used on others, rather than a bond to be shared with them.

  Your neighbour's censure feels "off" because she is trying to wield a shield she has already agreed to drop. She wants the grandson to respect the rule, while she herself treats it as optional. That is not just inconsistency; it is a specific form of moral unfairness that exploits the other person's compliance while reserving the right to defect.
