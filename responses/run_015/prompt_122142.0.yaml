answer: |-
  ### Part 1: Brainstorming and Selection

  Here are three candidate structures for the question. I've rejected two based on your criteria regarding recitation and empirical hinge-points.

  **Candidate 1: The Methodological Audit**
  *Sketch:* Present the lizard case and ask students to list three distinct methods an adaptationist and a structuralist would use to resolve the status of the visual acuity. Ask them to explain why each method might fail given the stratigraphy.
  *Rejection:* **Rejected.** This fails your primary constraint. It invites the "B-level recapitulation" you want to avoid. A student can ace this by simply listing phylogenetic comparative methods, engineering optimality models, and developmental constraint analysis without ever engaging with the *philosophical* status of the explanation. It tests knowledge of scientific practice, not the logic of evolutionary explanation. It allows the student to hide behind the "it's an empirical dispute" shield.

  **Candidate 2: The Taxonomy Sorting Task**
  *Sketch:* Provide the lizard case and three statements labeled "Empirical Adaptationism," "Methodological Adaptationism," and "Explanatory Adaptationism." Ask students to match each statement to the correct taxonomy label and justify the match using details from the lizard case.
  *Rejection:* **Rejected.** This is purely definitional. It rewards memorization of the week-two taxonomy (which you explicitly flagged as a "don't"). A student could get full marks by rote-learning the definitions of these three terms and plugging in the lizard details like a mad-lib. It doesn't force them to evaluate whether the distinction holds water when the evidence is erased.

  **Candidate 3: The Explanatory Status Challenge (Selected)**
  *Sketch:* Use the lizard case with the "erosion problem" (later selection overwriting historical signatures). Ask students to argue whether the claim "poor acuity is a spandrel" remains scientifically meaningful if the historical evidence is lost. Force them to choose: is the claim now empty, or has it shifted from a historical claim to a claim about explanatory priority?
  *Selection Reason:* **Kept.** This forces the student off the fence. They cannot simply say "it depends on the evidence" because the prompt stipulates the evidence is gone. They must argue about the *nature* of evolutionary explanation itself. Does explanation require accurate history, or just functional coherence? This distinguishes the A student (who analyzes the structure of the claim) from the B student (who describes the dispute).

  ***

  ### Part 2: The Exam Question

  **Question 4 (25 Points)**

  **Case Study: The Ashrammer Lizard (*Ashrammer lacerta*)**
  Consider a lineage of lizards inhabiting a high volcanic plateau. To burrow through compacted ash, these lizards evolved a heavily reinforced, fused braincase used for ramming. This fusion is uncontroversially an adaptation for ramming. However, the bony struts required for fusion pinch the optic nerve canal. Consequently, adults have terrible visual acuity and a reduced visual midbrain. Their sister taxa in soft soil have unfused skulls and excellent vision.

  Complicating matters, *Ashrammer* males possess flamboyant throat fans used in close-range courtship, which females prefer. The visual system has been re-tuned: the surviving visual tissue is hypersensitive to the specific wavelengths the throat fans reflect, and olfactory bulbs have ballooned to compensate for acuity loss. Thus, the animal possesses a well-designed, low-acuity, fan-detecting visual system.

  Crucially, the stratigraphy is unhelpful. In the two closest outgroups, skull fusion and acuity loss appear in the same geological beds. There is no time gap to suggest the acuity loss preceded the fan selection. The historical signature that would distinguish a structural byproduct (spandrel) from a selected trait has been overwritten by later selection.

  **Prompt:**
  Given this "erosion problem," evaluate the following claim: *"The poor visual acuity of Ashrammer lacerta is a spandrel, not an adaptation."*

  If the historical evidence is erased, does this claim lose its scientific meaning, or does it retain explanatory force? Defend a position. In your answer, you must address whether the adaptationism debate is fundamentally about reconstructing causal history or about assigning explanatory priority. Do not simply list the arguments of Gould, Lewontin, or adaptationists; apply their logical frameworks to this specific epistemic困境 (dilemma).

  ***

  ### Part 3: Model Answer

  **Model Answer**

  The *Ashrammer* case presents a scenario where the standard empirical adjudication between adaptationism and structuralism is blocked. Normally, one distinguishes a spandrel from an adaptation by looking for a time lag between the architectural constraint and the utility, or by demonstrating sub-optimality. [Consensus: These are the standard empirical tests for distinguishing traits.] Here, later selection has optimized the system for a new function (fan detection), and the stratigraphy offers no resolution. The question is whether the label "spandrel" retains any value once the historical causality is obscured.

  If we view evolutionary explanation as strictly historical, the claim loses its force. [Contested: Many adaptationists argue that without historical evidence, functional analysis is the only valid science available.] If "spandrel" means "trait caused by architectural constraint rather than direct selection," and we cannot verify the cause, the claim becomes metaphysical rather than scientific. An adaptationist would argue that since the trait is currently maintained by selection (for fan detection), treating it as an adaptation is the only productive heuristic. [Consensus: Adaptationists generally prioritize current utility as a proxy for historical origin when history is inaccessible.] To insist it is a spandrel without evidence would be to privilege a narrative about the past over observable data about the present.

  However, this view conflates the origin of a trait with its maintenance. [Contested: This is the core philosophical hinge; some argue origin and maintenance are inseparable in evolutionary explanation.] A structuralist might argue that the "spandrel" claim is not merely about history, but about explanatory priority. Even if the visual system is now optimized for fans, the *range* of possible optimizations was constrained by the initial ramming adaptation. The explanation for *why* the visual system is low-acuity rather than high-acuity still relies on the architectural constraint, not on selection for low acuity. [Consensus: Constraints limit the phenotypic space available for selection.] Therefore, the claim retains force as a statement about why certain optimal solutions were unavailable, even if the current state is locally optimal.

  This suggests the debate is not solely empirical but also concerns what counts as a complete explanation. [Contested: Some philosophers argue this dissolves the dispute into semantics.] If explanation requires identifying the primary causal driver, the adaptationist wins by default in erosion cases because selection is the only verifiable driver. But if explanation requires identifying why alternative forms were not taken, the structuralist claim remains vital. The "spandrel" label shifts from a historical fact to a modal claim about possibility. [Contested: Whether modal claims about phenotypic space are testable is a live debate.]

  Ultimately, accepting the spandrel claim in the *Ashrammer* case requires accepting that evolutionary biology explains not just why traits are present, but why they are specific modifications of prior forms. [Consensus: Descent with modification is central to evolutionary theory.] If we deny this, we risk treating organisms as ahistorical optimality engines. [Contested: Adaptationists often argue that ahistorical models are sufficient for many biological questions.] Therefore, the claim retains meaning, but it changes category: it becomes a claim about constraint-based path dependence rather than a claim about the absence of current utility.

  ***

  ### Part 4: Marking Scheme

  **Total Points: 25**

  **Must-Hit Points (5 points each)**

  1.  **Identification of the Erosion Problem:** Student explicitly recognizes that later selection has overwritten the historical signal (optimality vs. origin).
      *   *Common Blow-up:* Student ignores the stratigraphy constraint and suggests "just look at the fossils" or "run a phylogeny."
  2.  **Distinction Between Origin and Maintenance:** Student clearly separates the cause of the trait's appearance from the cause of its current retention.
      *   *Common Blow-up:* Student conflates current utility with historical origin (the "adaptationist heuristic" error).
  3.  **Analysis of Explanatory Status:** Student argues whether the claim is historical (factual) or explanatory (modal/priority-based).
      *   *Common Blow-up:* Student stays neutral ("both sides have points") without evaluating the *status* of the claim itself.
  4.  **Application of Taxonomy:** Student correctly uses concepts like constraint, optimality, or byproduct without needing to name-drop Gould/Dawkins.
      *   *Common Blow-up:* Student relies on name-dropping without applying the logic to the lizard case.
  5.  **Defended Stance:** Student takes a clear position on whether the claim remains meaningful, rather than listing options.
      *   *Common Blow-up:* Student concludes "it's an empirical question" despite the prompt stipulating evidence is unavailable.

  **Band Descriptions**

  *   **A (21–25 points):** Takes a clear stance on the *nature* of the explanation (historical vs. modal). Explicitly argues whether the loss of evidence changes the *kind* of claim being made. Uses the origin/maintenance distinction to drive the argument.
  *   **B (15–20 points):** Accurately describes the adaptationist and structuralist positions and applies them to the lizard. Correctly identifies the erosion problem. However, remains descriptive rather than argumentative (e.g., "Adaptationists would say X, Structuralists would say Y" without judging the validity).
  *   **C (10–14 points):** Recaps the general Gould–Lewontin debate accurately but fails to apply it to the specific constraints of the *Ashrammer* case (e.g., ignores the stratigraphy detail). Treats the question as a standard "list the arguments" prompt.
