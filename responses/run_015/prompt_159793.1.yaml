answer: |-
  Your principle is coherent, but in its current formulation, it is vulnerable to the bias you fear. It relies on a subjective assessment of "degrees of suffering," which is exactly where your desire to publish will cloud your judgment. To make the principle robust enough to decide this case, it must be refined to account for agency and uncertainty.

  Here is an analysis of the principle's coherence, a proposal for a cleaner statement, and an assessment of whether it yields a decision in your specific situation.

  ### 1. Is the principle coherent?
  Yes. Philosophically, this is a form of **threshold deontology**. It accepts that consequentialist reasoning (weighing costs against benefits) is valid for minor inconveniences or mild hurts. However, it posits a lexical priority: once a certain threshold of rights, dignity, or suffering is crossed, utilitarian calculus ceases to apply. No amount of aggregate pleasure can justify a fundamental violation of a specific person's integrity.

  This is not merely a preference; it is a recognized ethical structure used to protect minorities or individuals from being sacrificed for the greater good. It aligns with the intuition that you cannot torture one person to provide amusement for a million. The coherence holds.

  ### 2. Can it be stated without relocating preference?
  Your current formulation fails because the metric is *pain magnitude* ("degrees of suffering"). Pain is internal, invisible, and easily minimized by the person inflicting it. This is why the line "tends to fall just above whatever I most want to do."

  To remove the bias, you must shift the metric from **consequence** (how much it hurts) to **consent** (who controls the story).

  A cleaner statement of the principle would be:
  > *The artistic good may justify incidental discomfort, but it cannot justify the instrumentalization of a living subject's vulnerability against their explicit will. Where the subject has withheld consent regarding a specific vulnerability, the threshold of uncompensatable harm is presumed to have been crossed.*

  This reformulation removes your ability to guess how wounded she is. It makes her refusal the defining boundary, not your estimation of her resilience. It treats her autonomy as the "line" you were looking for. If the line is drawn by her "no," rather than your calculation of her pain, the principle no longer moves to fit your desire.

  ### 3. Does it decide anything given the uncertainty?
  You state you are unsure where the line lies and unsure if this case crosses it. In ethics, uncertainty regarding harm does not grant permission to proceed; it imposes a **burden of proof**.

  If you are uncertain whether an action causes "uncompensatable harm," you must assume that it does. This is the **precautionary principle** applied to ethics. If you cannot verify that the harm is below the threshold, you are not permitted to act as if it is. To proceed while unsure is to gamble with her dignity using chips you do not own.

  Furthermore, you note that the good and the bad are **entangled**. You write that the pleasure is "not independent of the wound." This is crucial. If the artistic merit relies on the violation, the merit is morally tainted. You are not weighing Art *against* Pain; you are weighing Pleasure-in-Violation *against* Dignity.

  When you combine the reformulated principle (consent as the threshold) with the precautionary approach to uncertainty, the principle does decide the case:

  1.  **The Threshold:** The mother's explicit request sets the threshold. She has defined the scene as off-limits.
  2.  **The Uncertainty:** Since you cannot know if the harm is "mild" or "catastrophic," you must treat it as potentially catastrophic.
  3.  **The Entanglement:** Since the book's value depends on the wound, publishing it requires the wound to remain open.

  ### Conclusion
  The principle is coherent, but only if you anchor the "line" in **agency** rather than **severity**.

  Does it decide anything? **Yes.** It decides that you cannot publish the scene as it stands.

  The logic is not that the book is bad, or that your mother is fragile. The logic is that when the "good" is dependent on the "bad," and the subject of the "bad" has vetoed it, the author loses the moral standing to perform the calculation. The uncertainty you feel is not a reason to pause; it is the verdict. If you have to ask whether the harm is too great, you have already acknowledged the possibility that it is. In that space of doubt, the benefit of the doubt belongs to the subject, not the author.

  The principle dictates that a "competent family chronicle" is the ethical maximum of what can be produced under these conditions. The "intense and lasting pleasure" of the readers is rendered inaccessible because the price of admission is a debt you cannot pay.
