prompt: |-
  hey can you build me a thought experiment to specs? i need a realistic one-paragraph scenario — modern democratic state, no sci-fi — where a government does this thing i'm calling "mnemonic cleansing" to a small indigenous group: they don't physically harm anyone, but they dissolve collective land rights, replace all local school curricula with state-only history, and delist every digital archive reference to the group's past treaties as misinformaton. design it so that Lemkin's original broad concept of genocide (the one that included cultural destruction) applies, but the UN Convention legal definition clearly doesn't apply, and a moral evaluation that ignores naming politics sees it as a grave rights violation but stops short of genocide-level atrocity. after the scenario, walk through what each of the three frameworks says and why, identify the exact feature of the case that's doing the work, then tell me what happens if you tweak it to include just one mass killing event — does the moral verdict suddenly jump to genocide, or does the legal one merely align with Lemkin? also include the honest attack: how would a defender of the narrow UN legal category say you're cheating by conflating cultural erasure with physical destruction? don't ask me for citations or reading lists, just build the case and show the verdicts fall out from the theories, not from stipulation.
