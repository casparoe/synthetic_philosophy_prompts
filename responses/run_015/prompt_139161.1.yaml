answer: |-
  This is a sharp dissection. You are right that reading Hardin against *Dudley and Stephens* (Mignonette) destabilizes both. Hardin's metaphor is static (who gets in?); the Mignonette reality is dynamic (who stays alive?). When you force them together, the "Lifeboat" stops being a metaphor for national sovereignty and starts looking like a metaphor for the limits of utilitarianism itself.

  Here is the mapping, the split, the timing paradox, the Brooks problem, the Holmes contrast, and the verdict on Hardin, followed by the explicit fragility statement you requested.

  ### 1. Mapping the Players and Capacity

  **Who is the Player?**
  In Hardin's essay, the "player" is the collective occupant of the lifeboat (the rich nation) making a policy decision against the swimmers (the poor nations). In Mignonette, there are two competing players:
  1.  **The Crew (Dudley/Stephens):** Acting as Hardin's "boat." They are making a triage decision to preserve the unit.
  2.  **The Court (The Crown):** Acting as the "Earth" or the "System." Hardin largely ignores the meta-system that contains the lifeboats. The Court asserts that the boat does not own itself; it is subject to laws that survive the boat.

  **What is the Capacity?**
  Hardin assumes a fixed capacity $C$ (seats in the boat). Mignonette reveals capacity is a function of resources $R(t)$ over time.
  *   **Physical Capacity:** 13-foot dinghy. Could physically float 4 men.
  *   **Survival Capacity:** With 2 tins of turnips and no water, the caloric/hydration capacity was effectively 0 for 4 people over 20 days. It was roughly 3 for the duration until rescue.
  *   **The Hardin Glitch:** Hardin's theory asks, "Do we pull them in?" when $Current + New > C$. Mignonette asks, "Do we throw/eat one?" when $Current > C(t)$. Hardin's model breaks because he assumes the boat is a sealed system regarding *entry*, but Mignonette proves the boat is a leaking system regarding *existence*.

  **The Options:**
  Hardin offers binary choice: Safety (exclude) or Altruism (swamp). Mignonette offers a spectrum of triage:
  1.  **Passive Wait:** All die, or 3 survive if Parker dies naturally first.
  2.  **Active Selection (Lots):** Randomize the sacrifice.
  3.  **Active Selection (Utility):** Kill the weakest (Parker) to maximize caloric return.
  4.  **Suicide Pact:** All refuse to eat; all die.

  ### 2. The Capacity/Selection Split

  You identified the critical fissure: Hardin's theory is silent on internal selection. It assumes the people *in* the boat are the legitimate set. Mignonette exposes this as a luxury assumption.

  **The Argument:**
  Hardin's lifeboat ethics contains a **hidden selection rule**: *Status Quo Bias.* It assumes the current occupants are the "right" people because they are already dry. Mignonette forces the theory to admit that when resources collapse, the "right to be in the boat" is contingent on utility.

  **The Cost:**
  If Hardin admits this, his metaphor collapses into **Social Darwinism within the border.** He argues against helping the poor *outside* because they would overload the system. But Mignonette shows that even without new entrants, the system can overload due to environmental shock.
  *   **Reading A (Silence):** Hardin's theory is only for *growth* scenarios, not *contraction* scenarios. It is useless for famine, war, or climate collapse within the nation.
  *   **Reading B (Exposed Rule):** The hidden rule is "Might makes Right" or "Utility makes Right." Dudley killed Parker because Parker was weakest and most expendable. If Hardin accepts this, he must accept that when a nation runs out of resources, it is ethically permissible to cull its own citizens based on utility (age, health, contribution).
  *   **The Price:** Hardin wants to defend the welfare of the boat's occupants. But if the boat's ethics allow the occupants to eat each other when times get tough, the "safety" of the boat is illusory. You are safe only until you become the weakest link.

  ### 3. The Timing Trade-Off (The Blood Paradox)

  This is the strongest point of friction. Let's formalize the trade-off.

  Let $t$ be the time of killing relative to Parker's natural death ($t=0$ is natural death).
  Let $V(t)$ be the Nutritional Value (blood + fresh meat).
  Let $L(t)$ be the Legal/Moral Liability (Murder vs. Necessity).

  *   **$V(t)$:** Decreases as $t \to 0$. If you wait for natural death, the blood is clotted/stale, the meat may be tainted by starvation toxins or decomposition. The survival benefit is maximized at $t = -\Delta$ (while alive).
  *   **$L(t)$:** Increases as $t \to -\Delta$. Killing a comatose man is still murder, but killing a healthy man is clearly murder. The "Necessity" defense relies on the claim that the victim was *already lost*.

  **The Paradox:**
  $$ \text{Justification} \propto \text{Inevitability of Death} $$
  $$ \text{Utility} \propto \text{Vitality of Victim} $$
  To maximize Utility, you must minimize Justification. To maximize Justification, you minimize Utility.

  **What does a Lifeboat Ethicist say?**
  Hardin is a "Guilty Safety" advocate. He prioritizes the survival of the boat over moral purity.
  *   **Hardin's Optimal $t$:** As early as possible once scarcity is certain. Hesitation risks the whole boat. The "blood" argument (Dudley's specific rationale) is consistent with Hardin's resource-maximization logic.
  *   **The Court's Optimal $t$:** $t \ge 0$. Do not kill. Wait for nature.
  *   **The Conflict:** Hardin's ethics demand the murder to save the boat. The Law demands the risk of the boat to save the moral order. Mignonette proves that **Lifeboat Ethics is incompatible with Rule of Law.** You cannot have a system where individuals calculate utility-killing and expect the state to uphold order afterwards.

  ### 4. Brooks: The Free Rider

  Brooks refused to strike but ate.
  *   **Coherence:** In a Hobbesian state of nature (which Hardin's lifeboat approximates), Brooks is perfectly coherent. He minimized his personal risk (legal and psychological) while capturing the collective benefit.
  *   **Can the Theory Condemn Success?**
      *   **Outcome View:** No. 3 lived. The boat survived. Hardin's metric is survival.
      *   **Rule View:** Yes. If Brooks's behavior becomes the norm (refuse to dirty hands, eat anyway), trust collapses. Future crews will fracture before the killing is necessary.
      *   **Hardin's Dilemma:** Hardin must condemn Brooks not because the killing was wrong, but because the *distribution of guilt* was uneven. A lifeboat requires total commitment to the survival calculus. Brooks acted as a moral individual in an amoral situation.
      *   **Verdict:** Hardin's theory cannot condemn the *act* (killing Parker) because it succeeded. It can only condemn the *procedure* (lack of consensus). This forces Hardin away from "Necessity" and toward "Contract." If you can't agree to kill, you can't kill. But if you can't kill, you die.

  ### 5. Contrast: *United States v. Holmes* (William Brown, 1841)

  **The Facts:**
  *   **Mignonette:** 4 men, 1 killed (25% loss). Crew + Boy. Selection: Weakness/Youth.
  *   **William Brown:** Longboat overcrowded (17 crew, 33 passengers). Boat leaked. 14 male passengers thrown overboard. Crew remained intact. Selection: Class (Passengers vs. Crew).
  *   **Lots:** In *Holmes*, Justice Baldwin explicitly charged the jury that in such extremity, **lots should have been drawn**. They were not. In *Dudley*, lots were discussed but not drawn.
  *   **Punishment:** Holmes (ManSlaughter, 6 months + $20 fine). Dudley/Stephens (Murder, Death commuted to 6 months).

  **Consistency:**
  It looks inconsistent (1 death vs. 14 deaths for similar time). But on a **Sovereignty Account**, it is perfectly consistent.
  *   **The Crime:** Not the body count. The crime is **usurping the Sovereign's monopoly on violence.**
  *   **Holmes:** The crew asserted a right to decide which passengers lived based on their utility to the boat (sailing the boat). This is class warfare.
  *   **Dudley:** The crew asserted a right to decide which crewmate lived based on biology.
  *   **The State's Message:** "You are not the captains of morality. Only the State can authorize killing, even for survival."
  *   **Hardin's View:** Hardin would likely find *Holmes* more defensible than *Dudley*. In *Holmes*, the crew preserved the "skills" needed to save the boat (sailors vs. passengers). In *Dudley*, they ate the boy who couldn't sail anyway, but they also ate a member of the "crew" (the social unit). However, Hardin would condemn the *legal outcome* of both. The State punished survival.

  ### 6. Does Mignonette Help or Hurt Hardin?

  **It Hurts Him.**

  **Why:**
  Hardin's essay is titled "Lifeboat Ethics: The Case Against Helping the Poor." His metaphor is designed to justify **exclusion** (keeping swimmers out).
  Mignonette demonstrates that the real ethical horror of lifeboats is **ejection** (throwing people out) or **cannibalism** (consuming people inside).

  1.  **The Metaphor Reversal:** Hardin says, "We cannot let them in, or we all die." Mignonette says, "We are already in, and we are still dying, so one of us must go."
  2.  **The Internal Threat:** Hardin treats the boat as a solid unit against the water. Mignonette shows the boat is a fragile unit against itself. If Hardin's "rich nations" face resource collapse, his ethics provide no guidance other than "eat the weak."
  3.  **The Legitimacy Gap:** Hardin assumes the people in the boat *deserve* to be there. Mignonette (and *Holmes*) shows that being in the boat is often a matter of luck or class (crew vs. passenger), not moral merit.
  4.  **Conclusion:** Real lifeboat cases are about **triage of the included**, not **exclusion of the excluded**. By focusing on the swimmers, Hardin distracts from the harder question: What do you do when the boat is full, sealed, and starving? Mignonette answers: You become a monster. Hardin wants to avoid being a monster by ignoring the swimmers; Mignonette shows you become a monster anyway to save your friends.

  ### 7. Fragility and Epistemic Honesty

  You asked for the weak links. Here is where this synthesis breaks if pushed.

  **1. The "Hardin Extrapolation" (Weakest Link)**
  *   **Fragility:** Hardin never wrote about cannibalism or internal triage. I am inferring his utilitarianism extends to eating crewmates.
  *   **Drop First:** If pushed, I would drop the claim that Hardin *specifically* supports Dudley's timing. Hardin might argue that a society that allows cannibalism destroys the social trust required to keep the boat afloat in the long run. He might side with the Court to preserve the "meta-boat" (Civilization).
  *   **Uncertainty:** Hardin's later work emphasized "mutual coercion mutually agreed upon." He might argue Dudley failed because there was no *agreement* (Brooks refused).

  **2. The Fact of Rescue**
  *   **Critical Variable:** The *Montezuma* spotted them shortly after the killing.
  *   **Verdict Changer:** If rescue was **imminent** (e.g., 4 hours away), the "Necessity" vanishes completely. The killing becomes purely for convenience, not survival. My analysis assumes the "20 days starving" timeline is accurate and rescue was not predictable. If Dudley knew rescue was likely within 48 hours, the Hardin defense collapses entirely because the "Capacity" was about to be reset by external aid.

  **3. Parker's Consent/State**
  *   **Critical Variable:** Some accounts suggest Parker was delirious or had drunk seawater (making his blood toxic).
  *   **Verdict Changer:** If Parker was **already dead** or **irreversibly comatose** (brain dead), the "Timing Paradox" dissolves. It becomes harvesting, not killing. If Parker **consented** (a pact), it becomes suicide/contract, not murder. The entire moral weight rests on Parker being a *subject* who was killed against his will while still possessing some vitality. If he was already effectively gone, Dudley is less a murderer and more a surgeon making a grim call.

  **4. The "Lots" Fact in *Holmes***
  *   **Clarification:** I stated earlier that Justice Baldwin argued lots *should* have been drawn. I am certain of the judicial instruction. I am less certain if lots were *actually* proposed by the crew and rejected, or simply ignored.
  *   **Impact:** If lots were offered and refused by the passengers, *Holmes* becomes even more about class violence. If lots were never mentioned until the trial, it shows the crew assumed their own privilege. This strengthens the "Sovereignty" argument (the State imposes lots because the Crew won't).

  **Final Conditional Verdict:**
  If Parker was already effectively dead (coma + seawater poisoning), Mignonette helps Hardin (it becomes a resource management issue). If Parker was viable and rescue was uncertain, Mignonette hurts Hardin (it reveals his ethics require internal barbarism to function). I am betting on the latter: **The Lifeboat metaphor fails because it assumes the boat is a sanctuary, when history shows it is often a slaughterhouse.**
