          *   *The Twist:* If the boat is already full (which Hardin admits rich nations are), the problem isn't "pulling in," it's "who stays." Hardin ignores internal decay.
          *   *Verdict:* It hurts him. It turns his static metaphor into a dynamic triage problem he didn't solve. It shifts the moral burden from "Don't be nice to strangers" to "How do you treat your own?"

      *   **7. Fragility & Epistemic Honesty:**
