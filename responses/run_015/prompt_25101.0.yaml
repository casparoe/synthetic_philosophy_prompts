answer: |-
  The phenomenon you are describing is a central topic in contemporary moral philosophy, specifically within the literature on **moral responsibility, blame, and the ethics of speech.**

  The specific concept you are looking for is **Moral Standing to Blame** (sometimes called *moral authority* or *standing to hold accountable*).

  While introductory logic classes teach that this move is the *Tu Quoque* fallacy (a subtype of *Ad Hominem*), moral philosophers have spent the last two decades arguing that while it is a logical fallacy (it doesn't make the criticism *false*), it is often a **normative success** (it makes the criticism *illegitimate* or *infelicitous*).

  Here is a map of the philosophical landscape regarding this pattern, the competing accounts of what is lost, and the boundaries between fallacy and legitimate deflection.

  ### 1. The Core Distinction: Truth vs. Standing
  The first step in the literature is distinguishing between the **propositional content** of the criticism and the **speech act** of criticizing.

  *   **The Logical View (Tu Quoque):** If Person A says "Stealing is wrong" and Person B says "But you steal," Person B has not disproven the proposition "Stealing is wrong." Therefore, the criticism stands.
  *   **The Normative View (Standing):** Blame is not just a statement of fact; it is a communicative act—a demand for accountability. Like any speech act (e.g., sentencing a criminal, marrying a couple, promising), it requires **felicity conditions**. One condition is that the speaker must have the *standing* to make the demand.

  The consensus in recent literature (led by philosophers like **R. Jay Wallace**, **Macalester Bell**, and **Christopher Fritz**) is that hypocrisy can strip a critic of standing without making their claim false.

  ### 2. What Is Lost? (The Nature of Standing)
  When a target claims the critic lacks standing, what exactly is being undermined? There are three main competing accounts in the literature:

  #### A. The Commitment Account (R. Jay Wallace)
  In his seminal paper *"Hypocrisy, Moral Address, and the Force of Moral Reasons"* (2010), Wallace argues that blame is a form of moral address that presupposes a shared commitment to norms.
  *   **The Mechanism:** When you blame someone, you implicitly claim to uphold the norm yourself. Hypocrisy reveals a lack of commitment to the very norm you are invoking.
  *   **What is lost:** The *authority* to hold the other person to a standard you do not respect. It renders the blame "hollow" because the critic has waived their own claim to the norm.
  *   **The Reformed Wrongdoer:** This explains your puzzle about reformed wrongdoers. A reformed wrongdoer acknowledges the norm *now* and regrets their past violation. They are not claiming exemption; they are submitting to the norm. The hypocrite, by contrast, implicitly claims an exemption (i.e., "This rule applies to you, but not to me").

  #### B. The Equality Account (Macalester Bell)
  Bell argues that hypocrisy violates the presumption of moral equality between agents.
  *   **The Mechanism:** Moral blame assumes we are peers in the moral community. The hypocrite positions themselves as superior to the target, despite being guilty of the same fault.
  *   **What is lost:** The *right to claim superiority*. By pointing out the hypocrisy, the target is re-establishing moral equality. "You are not above me, so you cannot judge me from above."
  *   **The Boundary:** This account suggests standing is lost only when the hypocrisy implies a claim of superiority. If a critic says, "We both did this wrong, but we need to stop," they retain standing because they aren't claiming superiority.

  #### C. The Functionalist Account (Blame as a Tool)
  Some philosophers argue that blame has a specific function: to bring about moral reform or protect the community.
  *   **The Mechanism:** Hypocritical blame is counter-productive. It provokes resentment rather than repentance because the target perceives the unfairness.
  *   **What is lost:** The *efficacy* and *appropriateness* of the tool. Even if the criticism is true, uttering it in this context fails to achieve the goal of moral address and instead generates noise/resentment.

  ### 3. Mapping the Boundary: Fallacy vs. Legitimate Deflection
  You asked where the boundary lies between a fallacious deflection and a legitimate challenge to standing. The literature suggests the boundary depends on **relevance** and **implication**.

  #### Case 1: The Fallacious Deflection (Irrelevant *Tu Quoque*)
  *   **Scenario:** A critic condemns a target for lying. The target responds, "But you cheated on your taxes ten years ago."
  *   **Analysis:** If the critic acknowledges the past tax cheating and does not claim moral perfection, the deflection is fallacious. The past transgression does not negate current standing if the critic currently upholds the norm against lying.
  *   **Principle:** Standing is not permanent; it can be regained through acknowledgment and reform.

  #### Case 2: The Legitimate Challenge (Active Hypocrisy)
  *   **Scenario:** A critic condemns a target for lying, while actively lying to the target in the same conversation.
  *   **Analysis:** This is a valid challenge to standing. The critic is violating the norm *in the very act* of enforcing it. This creates a performative contradiction.
  *   **Principle:** Standing is lost when the violation is concurrent and unacknowledged.

  #### Case 3: The Complicity/Benefit Problem (Structural Hypocrisy)
  *   **Scenario:** A critic condemns a corporation for pollution, but the critic owns stock in that corporation or benefits from the cheap products the pollution allows.
  *   **Analysis:** This is the hardest case and is currently debated under **complicity theory**.
      *   *View A:* Mere benefit does not negate standing. We all benefit from unjust systems (e.g., global supply chains). If benefit negated standing, no one could criticize anything.
      *   *View B:* Unacknowledged benefit negates standing. If the critic presents themselves as "clean" while benefiting from the "dirty" practice they condemn, they are misleading the target about their own position.
      *   **The Boundary:** The literature suggests standing is retained if the critic **acknowledges the complicity** ("I benefit from this, and it is wrong, and we should both stop") but lost if they present themselves as an innocent outsider ("You are bad for doing this, while I watch from the sidelines").

  ### 4. Why the Intuition Varies (The "Reformed" vs. "Secret" Hypocrite)
  You noted that reformed wrongdoers seem to have *more* standing. The philosophical explanation lies in the concept of **Sincerity Conditions**.

  *   **Secret Hypocrite:** Fails the sincerity condition. They are engaging in a form of deception. They invite the target to accept a moral norm that the critic themselves secretly rejects. This is a form of manipulation, not moral address.
  *   **Reformed Wrongdoer:** Meets the sincerity condition. Their past failure serves as evidence of their understanding of the norm's difficulty and importance. Their standing is often *enhanced* because they speak from experience rather than abstract judgment (sometimes called "earned standing").

  ### 5. Key Texts for Further Reading
  If you wish to dive into the primary sources that map this terrain, these are the essential references:

  1.  **R. Jay Wallace, "Hypocrisy, Moral Address, and the Force of Moral Reasons" (2010).**
      *   *The definitive paper on this topic.* It establishes the distinction between the truth of the claim and the standing of the speaker.
  2.  **Macalester Bell, "The Standing to Blame" (2013).**
      *   *Focuses on the equality aspect.* Explores why hypocrisy feels like an insult to the target's status as a moral equal.
  3.  **Christopher Fritz, "Hypocrisy and the Standing to Blame" (2017).**
      *   *Refines Wallace's account.* Discusses the specific conditions under which standing is waived.
  4.  **Elinor Mason, "Hypocrisy and the Good Faith Condition" (2021).**
      *   *Addresses the "benefit/complicity" angle.* Discusses whether one must be "clean" to criticize, or merely acting in good faith.
  5.  **J.L. Austin, "How to Do Things with Words" (1962).**
      *   *The foundational text on Speech Act Theory.* While not about morality specifically, it provides the framework (felicity conditions) used by the philosophers above to analyze blame.

  ### Summary of the Framework
  The pattern you have identified is the **challenge to the felicity conditions of moral address.**

  *   **What is lost:** Not the truth of the proposition, but the **normative authority** to enforce it.
  *   **Necessary condition for losing standing:** The critic must be implicitly claiming an exemption from the norm they are invoking (either through active violation, secret violation, or unacknowledged complicity).
  *   **The Boundary:** The deflection is a **fallacy** if it implies the criticism is *false*. The deflection is **legitimate** if it implies the criticism is *unauthorized* or *manipulative*.

  The reason you feel the tension is that our culture often conflates "being right" with "having the right to speak." Philosophy separates these: You can be right about the norm, but wrong to be the one enforcing it.
