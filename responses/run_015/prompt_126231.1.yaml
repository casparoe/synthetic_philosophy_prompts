      *   **Deliverable:** A framework/toolkit for practitioners. Not just a paper, but a way to report the "cost of fairness."
      *   **Failure Modes:** Be honest. Maybe randomization is ethically unacceptable (lotteries for bail?). Maybe harm weights are impossible to agree on. Maybe the math is already trivial (convexification is well-known).
      *   **Consensus vs. Contested:** This is crucial.
          *   *Consensus:* The impossibility theorems hold mathematically. Randomization convexifies ROC space.
          *   *Contested:* Whether calibration is a fairness metric. Whether randomization is ethically permissible. Whether harm weights can be objectively defined.

  4.  **Refining the Prose (Self-Correction during drafting):**
      *   *Check:* Is it too technical? *Adjustment:* Keep the math high-level. Focus on the conceptual shift.
