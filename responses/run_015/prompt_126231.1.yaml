answer: |-
  **Title:** Pricing the Impossible: Randomization and Harm-Weighted Trade-offs in Algorithmic Fairness

  **The Research Question**

  The contemporary literature on algorithmic fairness is dominated by a set of impossibility theorems. These results demonstrate that, except in degenerate cases, a risk scoring system cannot simultaneously satisfy calibration within groups and equalize false positive and false negative rates across groups. The standard interpretation of this mathematical fact is often fatalistic: fairness is structurally impossible, and practitioners must inevitably violate one criterion or another. This project challenges that reading. It posits that the "impossibility" is not a fundamental barrier to equitable decision-making but an artifact of two specific, often unexamined modeling choices: the assumption that decision rules must be deterministic, and the assumption that all errors carry equal weight.

  The central research question is this: To what extent does expanding the decision space to include randomized rules and redefining the objective function in terms of downstream harm rather than unweighted error rates transform the fairness impossibility trilemma from a hard constraint into a quantifiable trade-off? Specifically, can we construct a framework where satisfying statistical parity constraints is always mathematically feasible via randomization, provided we are willing to pay a specific "price" in terms of weighted social harm, and does that price vary systematically across groups in ways hidden by standard accuracy metrics?

  **Why Existing Results Do Not Settle This**

  The existing impossibility theorems are mathematically sound, but their practical implications are often overstated because they operate within a rigid decision-theoretic frame. They typically assume a deterministic threshold applied to a risk score. This restricts the feasible set of error-rate pairs to a non-convex curve. When fairness constraints require a point off this curve, the theorem declares the constraints unsatisfiable. However, allowing for randomized decision rules—effectively lotteries over decisions for individuals near the threshold—convexifies the feasible set. This does not eliminate the tension between base rates and error rates, but it ensures that for any set of linear constraints, a feasible solution exists. The question shifts from "Can this be done?" to "What is the utility cost of doing this?"

  Furthermore, standard impossibility results treat false positives and false negatives as unitary errors. In high-stakes domains like pretrial release or lending, the social cost of a false positive (detaining someone who would not have reoffended) is qualitatively different from the cost of a false negative (releasing someone who does reoffend). Current literature often addresses this by proposing epsilon-relaxations, where constraints are satisfied only approximately. This is unsatisfying for a fellowship of this scope because it merely pushes the impossibility to the boundary of epsilon without explaining the cost of tightening it. Other approaches suggest causal modeling to correct for base rate differences. While valuable, causal accounts require empirical data and structural assumptions that cannot be robustly tested in a six-month, simulation-based project. By contrast, focusing on randomization and harm-weighting remains within the decision-theoretic domain, allowing for a rigorous theoretical exploration without needing new data collection.

  **Why This Angle is Worth Six Months**

  This approach is uniquely suited to a short-term, solo fellowship because it leverages existing theoretical tools to answer a normative question. The mathematics of randomized classifiers and convex hulls are well-understood in machine learning theory, as are the basics of cost-sensitive learning. The novelty lies in synthesizing them to reinterpret the fairness impossibility results. This synthesis does not require gathering new datasets or running human subjects experiments. It requires deriving the theoretical bounds of the randomized feasible set and then using toy simulations on synthetic risk distributions to visualize the "price of fairness" under different harm-weighting schemes.

  The value of this work lies in its potential to change the conversation among practitioners. If the impossibility results are read as "you must be unfair," practitioners may discard fairness constraints entirely. If they are read as "fairness has a price, and here is how you calculate it," the debate moves to whether that price is acceptable. This reframing empowers stakeholders to make explicit value judgments about harm weights rather than hiding behind mathematical fatalism.

  **Methodology and Timeline**

  The project will proceed in three phases over six months. The first two months will be dedicated to formalizing the decision problem. I will define the space of randomized decision rules and derive the convexified feasible region for error rates under varying base rates. I will formally define a harm-weighted loss function that allows false positives and false negatives to be denominated in a common currency, such as expected days of liberty lost versus public safety risk.

  Months three and four will focus on simulation. I will generate synthetic populations with varying degrees of base rate disparity and predictor accuracy. For each population, I will compute the optimal deterministic classifier and compare it to the optimal randomized classifier that satisfies parity constraints. I will measure the "fairness price" as the increase in weighted harm required to move from the unconstrained optimum to the fairness-constrained optimum.

  The final two months will be dedicated to interpretation and writing. I will analyze how the fairness price distributes across groups. For instance, does satisfying parity require a disproportionate increase in harm for the group with the lower base rate? The final output will be a paper that presents these theoretical derivations and simulation results, arguing for a shift from impossibility theorems to pricing frameworks.

  **Deliverable for Practitioners**

  The primary deliverable will be a conceptual framework and a companion technical report that practitioners can use when deploying scored decision rules. Rather than simply reporting whether a model passes or fails a fairness audit, this framework will allow a deployer to report the "cost of compliance." For example, a report might state: "Satisfying equal false positive rates requires a randomized threshold that increases total expected harm by 5%, with 80% of that burden falling on Group A." This moves the deliverable from a binary compliance check to a decision-support tool that makes the trade-offs transparent for policymakers.

  **Failure Modes**

  It is important to be candid about where this project could fail to yield novel insights. First, the convexification point may be mathematically trivial. If the literature already fully characterizes the convex hull of randomized classifiers in the context of fairness constraints, the theoretical contribution may be negligible. Second, the harm-weighting approach relies on the ability to specify weights. If the results show that the "price of fairness" is hyper-sensitive to small changes in harm weights, the framework may be too unstable for practical use. Third, the project could collapse into the existing epsilon-relaxation literature. If the randomized solution is mathematically equivalent to simply relaxing the constraints on a deterministic rule, the distinction is merely semantic. Finally, there is the risk that randomization is ethically non-starters for stakeholders. If the "solution" requires lotteries for bail or loans, policymakers may reject the premise entirely, rendering the pricing framework theoretically sound but practically inert.

  **Consensus and Contested Claims**

  In drafting the final paper, I will distinguish carefully between settled mathematical facts and contested normative claims. It is settled consensus that the impossibility theorems hold for deterministic classifiers under standard definitions of calibration and error rate parity. It is also settled that randomization convexifies the feasible set of error rates; this is a standard result in decision theory.

  However, several claims in this proposal are contested. First, whether calibration is a fairness requirement is debated; some argue it is an accuracy metric, and imposing it as a fairness constraint is category error. Second, the ethical permissibility of randomized decision rules is not settled. While economists often accept randomization to break ties, legal and ethical scholars often view lotteries in rights-impacting decisions as arbitrary or discriminatory. Third, the idea that harms can be denominated in a common currency is highly contested. Critics argue that certain harms, such as wrongful detention, are incommensurable with public safety risks and cannot be traded off via a weight parameter. I will present the harm-weighting not as an objective truth, but as a mechanism to force explicit disclosure of the implicit trade-offs already present in deterministic systems. The proposal rests on the normative claim that explicit trade-offs are preferable to hidden ones, a position that is defensible but not universally held.
