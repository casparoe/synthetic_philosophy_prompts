      *   **Constraints:** 6-month fellowship, solo researcher, laptop only (toy simulations/synthetic data), no new data collection.
      *   **Required Elements:** Precise research question, critique of existing results, justification of the angle, month-by-month plan, deliverable for practitioners, failure modes, and a section on consensus vs. contested claims.
      *   **Format:** Prose, not bullet points, 2–3 pages. No citations/bibliography (user will add).
      *   **Tone:** Professional, academic but accessible, honest about limitations.

  2.  **Deconstruct the Core Idea:**
      *   *The Impossibility:* Chouldechova (2017) / Kleinberg et al. (2016) style results. You can't have Calibration, FPR parity, and FNR parity simultaneously unless base rates are equal or perfect prediction.
      *   *The Twist:*
          1.  *Randomization:* Deterministic thresholds create non-convex feasible regions. Randomized thresholds (lotteries) convexify the region. This is a known mathematical fact (convex hull of ROC curves), but its implication for *fairness impossibility* needs explicit framing.
          2.  *Harm Weighting:* False Positives (FP) and False Negatives (FN) are treated equally in parity constraints. In reality, FP (detaining someone innocent) and FN (releasing someone dangerous) have different social costs. If we optimize for *minimized harm* subject to fairness constraints, the "impossibility" might just mean "it costs more," not "it can't be done."
      *   *The Claim:* The impossibility is not a hard wall but a price tag. The price varies by group.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but precise. "Pricing Fairness," "Beyond Impossibility," "Randomization and Harm." Let's go with something about transforming impossibility into trade-offs.
      *   **Introduction/The Question:** Start with the standard impossibility theorem. State the misconception ("fairness is impossible"). State the hypothesis (modeling artifacts create the wall). Formulate the precise question: *To what extent does allowing randomized decision rules and harm-weighted objective functions resolve the tension between calibration and error-rate parity?*
      *   **Critique of Existing Literature:** Why isn't this done? Why not just epsilon-relaxation? Epsilon-relaxation admits violation; this proposal seeks to satisfy constraints by changing the decision space. Why not causal base rate correction? That requires external data/assumptions this fellowship doesn't support. This proposal stays within the decision-theoretic framework.
