  For a researcher transitioning from experimental physics to philosophy, the allocation of limited intellectual capital must prioritize logical leverage and formal tractability over broad normative surveying. The procreation asymmetry is often treated as a moral intuition, but for your background, it should be treated as a problem of system coherence. Below is the ranked agenda for a one-semester intensive study, ordered by upstream logical dependence and feasibility for a solo theorist.

  ### 1. Priority One: Cluster 3 (Decision Theory & Modal Commitments)
  **Question:** Whether formalizing non-existence as a null welfare baseline within decision theory resolves the non-identity problem or instead reveals that the asymmetry depends on a hidden modal commitment about what counts as harming a merely potential person.

  **Defense:**
  *   **Upstream Dependence:** This is the foundational ontological question. Before you can compare welfare totals across possible populations (Cluster 1), you must define the state space of the decision problem. If "non-existence" cannot be coherently modeled as a state with a value (even a null value), then the comparative metrics in Cluster 1 are category errors. You cannot optimize a function over undefined variables.
  *   **Tractability:** This cluster relies on formal decision theory, modal logic, and consistency proofs. These tools map directly onto your physics training (modeling state spaces, boundary conditions, and null sets). It is the only cluster where a solo researcher can produce novel formal results without needing to master the entire history of normative ethics or access empirical data.
  *   **Strategic Value:** Resolving the logical status of the "potential person" determines whether the asymmetry is a feature of moral theory or a bug in our modeling of existence.

  ### 2. Priority Two: Cluster 1 (Population Ethics & Comparability)
  **Question:** Whether the asymmetry can be sustained once one rejects person-affecting restrictions and allows comparisons of total or average welfare across merely possible populations.

  **Defense:**
  *   **Downstream Dependence:** This is the substantive axiological question that follows Cluster 3. Once you have established whether non-existence can be represented as a baseline (Cluster 3), you can ask whether impersonal moral theories (totalism, averagism) can accommodate the asymmetry without collapsing into the Repugnant Conclusion or other impossibility theorems.
  *   **Tractability:** This is less tractable for a single semester because it requires navigating vast, entrenched literature (Parfit, Benatar, Greaves) where progress is often measured in nuanced counter-examples rather than formal proofs. However, it is necessary work *after* the logical framework is secured.
  *   **Strategic Value:** This determines the normative scope. If Cluster 3 shows the model is coherent, Cluster 1 decides if the asymmetry is morally permissible within standard consequentialist frameworks or if it forces a retreat to person-affecting views.

  ### 3. Priority Three: Cluster 2 (Evolutionary & Methodological Diagnosis)
  **Question:** Whether the intuition behind the asymmetry tracks a genuine normative principle or is instead an evolutionary byproduct—an adaptive risk-aversion heuristic misapplied to reproductive decisions—and what methodological standards should govern that diagnosis.

  **Defense:**
  *   **Downstream Dependence:** This is a meta-ethical genealogy. It asks *why* we hold the belief, not whether the belief is coherent or true. Diagnosing the intuition as a heuristic is only relevant if the principle itself survives the logical (Cluster 3) and normative (Cluster 1) scrutiny. If the asymmetry is logically incoherent, its evolutionary origin is merely a explanation of error.
  *   **Tractability:** This is the least tractable for a philosopher working alone. It requires synthesizing evolutionary psychology, cognitive science, and meta-ethics. Without laboratory resources or empirical collaboration, you risk engaging in "armchair evolutionary storytelling," which lacks rigorous falsifiability.
  *   **Strategic Value:** Lowest. It serves as a debunking or vindicating postscript to the substantive work of Clusters 3 and 1.

  ### Reordering Condition
  The only conceptual result that would reorder this agenda is a formal proof within Cluster 3 demonstrating that **non-existence is logically inert** (i.e., it cannot bear any value representation, null or otherwise, without contradiction). If this is proven, Cluster 1 is immediately resolved: the asymmetry *cannot* be sustained under impersonal views, forcing an exclusive focus on defending Person-Affecting Views. In that scenario, Cluster 1 becomes the primary battleground, and Cluster 3 reduces to a settled negative constraint.

  Verdict: Prioritize formalizing the ontology of non-existence before evaluating welfare comparisons or diagnosing the evolutionary origins of reproductive intuitions.
