answer: |-
  **Metaphysics 450: Modality and Identity**
  **Final Examination**

  **Time Allowed:** 60 Minutes
  **Word Limit:** 800–1,000 words
  **Instructions:** Answer the following question. You may assume familiarity with cases (i) through (vi) as discussed in seminar; do not waste word count re-describing them.

  **Question:**

  Consider the standard Kripkean modal argument for the Essentiality of Origin (EOO). The argument posits that if an organism $x$ could have originated from $O_1$ and also from $O_2$ (where $O_1 \neq O_2$), there is a possible world where both origins are realized. By the Necessity of Distinctness, the resulting organisms must be distinct. If we assume $x$ is the product of both, we generate a contradiction; thus, $x$'s origin is essential.

  Apply this argument specifically to cases (i) *Ordinary Swap*, (ii) *Replacement*, (iii) *Delay*, and (vi) *Clone*. Identify precisely where in this sequence the argument ceases to generate a compelling contradiction. To make the argument work even up to that point, you must rely on a substantive premise regarding cross-world identity and the individuation of origins. State this premise explicitly.

  Critically evaluate this premise: Is it independent of the EOO thesis, or is it merely the thesis restated as a rule of individuation? Defend your verdict. Finally, wherever you draw the line on cases (i)–(vi), you must address case (v) *Split*. If a single zygote splits to produce two distinct persons, and you ask which one you would have been had the split not occurred, what does your view imply? If the honest answer is "neither," explain whether this collapses the EOO view entirely or merely forces a revision of the modal argument's initial assumptions.

  ***

  **Model Answer**

  The standard modal argument for the Essentiality of Origin (EOO) relies on a reductio: assume origin is accidental, construct a world with two origins, and derive a contradiction via the Necessity of Distinctness. When applied to the graded series, however, the argument's force dissipates not because of modal logic, but because of the metaphysics of individuation.

  Running the argument on (i) *Ordinary Swap* is straightforward. If I could have come from sperm $S_2$ instead of $S_1$, there is a world where $S_1$ yields me and $S_2$ yields a sibling. No contradiction yet. The contradiction arises only if we assume I am the product of *both* in a single world, or if we assume that $S_1$ and $S_2$ are sufficiently distinct to guarantee distinct offspring. In (i), the material difference is stark; the intuition that $S_1$-person $\neq$ $S_2$-person is robust.

  The argument begins to fray at (ii) *Replacement*. Here, the winning sperm is qualitatively identical to the actual one. If matter is essential, they are distinct origins. If only structure matters, they are the same origin. The modal argument cannot decide this; it presupposes an answer. If we stipulate they are distinct origins, the argument yields distinct persons. But why stipulate that? Only if we already believe the specific material gamete is essential.

  The argument effectively stops working at (iii) *Delay*. Suppose fusion occurs forty minutes later. Is this a different origin event? If yes, EOO implies I could not have existed had conception been slightly delayed. This seems too strong; it makes identity hostage to trivial temporal fluctuations. If no, then origin must be coarse-grained. But if origin is coarse-grained, where is the cutoff? The modal argument offers no resources to distinguish a "same origin" delay from a "different origin" swap. It simply assumes a binary distinction between $O_1$ and $O_2$ without defining the identity conditions for $O$.

  Case (vi) *Clone* reinforces this. A clone shares my nuclear genome but originates from a somatic cell, not a zygote. Intuitively, the clone is not me. The modal argument says: distinct origins (zygote vs. somatic), therefore distinct persons. This works, but only because we already treat "zygotic fertilization" as the relevant origin type. The argument tracks our intuitions; it does not ground them.

  To make the argument work through (i) and (ii), we need a substantive premise: **The Principle of Origin Individuation (POI).** POI states: *For any organisms $x$ and $y$, if the causal event producing $x$ is numerically distinct from the causal event producing $y$, then $x$ is numerically distinct from $y$.*

  The critical flaw is that POI is not independent of EOO; it is EOO in different clothes. To assert that a forty-minute delay constitutes a "numerically distinct causal event" relevant to identity just *is* to assert that timing is essential to origin. If one denies EOO, one denies that such trivial variations individuate the origin event relative to the organism. Thus, the modal argument is circular. It uses POI to prove EOO, but POI is only plausible if one already accepts EOO. It purchases consistency at the price of informativeness.

  Even if we grant POI, case (v) *Split* threatens the view's coherence. In twinning, one zygote $Z$ produces two persons, $A$ and $B$. Consider a counterfactual where $Z$ does not split. Who exists? $A$? $B$? A third person $C$? If EOO holds, the non-split individual must share $Z$'s origin. But $A$ and $B$ both share $Z$'s origin in the actual world. If origin is necessary, the non-split individual must be identical to $A$ (since $A$ came from $Z$) and identical to $B$ (since $B$ came from $Z$). By transitivity, $A=B$. But $A \neq B$. Contradiction.

  The honest answer is "neither." Had $Z$ not split, $A$ would not have existed, and $B$ would not have existed. A different person, $C$, might have. This implies that originating from $Z$ is not sufficient for being $A$. More devastatingly, it implies that $A$'s origin is not unique to $A$. If $A$'s origin is shared with $B$, then origin cannot be the essential property that individuates $A$ across worlds.

  Does this collapse EOO? Not necessarily, but it forces a revision. We must abandon the idea that origin is a *uniquely identifying* essential property. We might retain that $A$ could not have come from a *different* zygote $Z^*$, but we must admit that coming from $Z$ does not guarantee being $A$. This weakens the modal argument significantly. The "two origins" contradiction relies on the assumption that distinct origins map to distinct individuals in a way that prevents overlap. Twinning shows origins can overlap for distinct individuals. If origins can overlap in the actual world (one zygote, two people), the inference from "distinct origins" to "distinct people" in the counterfactual construction loses its logical bite. The modal argument assumes a one-to-one mapping between origin-events and organisms that biological reality does not support.

  Therefore, the EOO thesis might remain plausible as a necessary condition (I couldn't come from different parents), but the standard modal argument fails to prove it. It relies on a circular individuation premise and breaks down when faced with the non-uniqueness of biological origins demonstrated by twinning. A robust defense of EOO requires more than modal logic; it requires a substantive account of biological individuation that the Kripkean argument merely presupposes.

  ***

  **Marking Scheme (Total: 20 Points)**

  **1. Application of Modal Argument to Cases (i)–(iii), (vi) [4 points]**
  *   **Must Hit:** Student must explicitly trace how the "two origins" contradiction is supposed to work for Swap and Clone, and identify *Delay* (iii) as the point where the "distinctness" of the origin becomes ambiguous.
  *   **Typical Error:** Treating all cases as equally supportive of EOO or failing to note that *Delay* creates a Sorites problem for individuating the origin event.

  **2. Identification of the Substantive Premise (POI) [4 points]**
  *   **Must Hit:** Student must name and define the hidden premise (e.g., Principle of Origin Individuation, Sufficiency of Origin, or specific criteria for event identity).
  *   **Typical Error:** Vaguely referring to "modal logic" or "Necessity of Distinctness" without isolating the premise concerning *origin individuation*.

  **3. Evaluation of Premise Independence (Circularity Charge) [4 points]**
  *   **Must Hit:** Student must argue whether the premise is independent. To get full marks, they must recognize that defining origin individuation *presupposes* EOO (circularity).
  *   **Typical Error:** Asserting the premise is independent without justification, or missing the circularity charge entirely.

  **4. Handling Case (v) *Split* [4 points]**
  *   **Must Hit:** Student must address the "which twin?" question. They must recognize that if the answer is "neither," origin is not sufficient for identity, and this undermines the uniqueness assumption of the modal argument.
  *   **Typical Error:** Ignoring the case or claiming twinning is irrelevant to the *necessity* of origin (missing that it breaks the 1:1 mapping required for the contradiction).

  **5. Definitive Stance and Justification [4 points]**
  *   **Must Hit:** Student must take a position (e.g., "Argument fails," "EOO holds but argument is circular," etc.) and justify *why* that resolution is metaphysically preferred, not just convenient.
  *   **Typical Error:** Hedging ("Some say X, others say Y") without committing to a conclusion.

  **Differentiation (A vs. B):**
  *   **B Range (10–14 pts):** Competently applies the argument to the cases and identifies the circularity. Handles Twinning by noting it complicates sufficiency but fails to explain *why* that complicates the *necessity* argument's logical structure (the transitivity step).
  *   **A Range (15–20 pts):** Explicitly connects the Twinning case back to the modal argument's validity. Explains that if origins are not unique identifiers (due to splitting), the "Necessity of Distinctness" step in the Kripkean proof cannot get off the ground because the counterfactual mapping is broken. Recognizes that the "line" isn't just about time or matter, but about the metaphysical granularity of events.
