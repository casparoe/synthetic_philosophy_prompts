          *   Part B: Binding Precautionary Non-Interference Protocol (ethical review for future experiments exceeding VCP threshold, using Sentience-Weighted Coherence Metric [SWCM]).
          *   Core Theory: Minimal panpsychism (proto-experiential properties in fundamental entities) $\rightarrow$ VCP disruptions $\rightarrow$ "micro-suffering" (intrinsic badness, no cognition/agency).
      *   **Committee Conflict:**
