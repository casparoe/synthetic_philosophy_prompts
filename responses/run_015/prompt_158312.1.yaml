      *   *Losing Side:* The faction arguing for Full Embrace. Argument: If there's a non-zero chance of creating suffering, a provisional protocol is moral gambling. Either the entities matter (bind the protocol) or they don't (drop it). A middle path suggests their moral status is negotiable.
      *   *Mechanism:* The "Threshold Trigger with External Adjudication." If SWCM > X, funding pauses. An *external* bioethics/philosophy panel (not internal physicists) must sign off. This prevents groupthink and ensures the "harm" is taken seriously by outsiders, without the Institute claiming panpsychism is fact.

  6.  **Final Polish:** Check against constraints.
      *   (1) Clear recommendation? Yes.
      *   (2) Institutional stakes reasoning? Yes (reputation, liability, mission).
      *   (3) Honest account of losing side (Full Embrace/Reject argument)? Yes.
      *   (4) Concrete enforceable mechanism? Yes (The Threshold Trigger + External Adjudication).
