      *(Self-Correction on Mechanism)*: The prompt asks for a mechanism that addresses "how an institution should govern research that might harm entities lacking interests, agency, or demonstrable consciousness." The mechanism needs to handle the *lack of agency* in the victim. The "External Adjudication" works, but let's make it more specific. A **"Moral Hazard Insurance Fund"**? No, too financial. A **"VCP Cap and Offset"**? No, implies suffering can be offset.
