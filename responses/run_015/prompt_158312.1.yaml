      *   *Refined Mechanism:* **The "Dissociated Review Board" (DRB).** The committee reviews the *process* of the SWCM calculation, not the *validity* of panpsychism. If the SWCM indicates high risk, the experiment pauses for a vote by the full Institute Board, not just this committee. This isolates the metaphysical risk from daily operations.

  4.  **Refining the Tone:**
      *   Bureaucratic but ethical.
      *   Decisive.
      *   Acknowledges the strangeness of the proposal without mocking it.
