answer: |-
  Hey, this is a solid setup. Really like the Voice/Hand split—it forces the coupling physically. But you're right, if Voice just dictats and Hand transcribes, you haven't proven extended mind, you've just proven Voice has a secretary. The cognition is still all in Voice's head.

  To make the boundary blur actually happen, the artifact needs to do computational work neither can do alone. Here's the rundown for the 75 mins, tweaked so the "failure" moment hits hard without tanking their mood too much.

  ### Materials
  *   **7 Packets** (for 7 pairs). Each packet has:
      *   1 "Case File" (the legal puzzle text).
      *   1 "Decision Tree" template (large paper, A3 ideally). It's a flowchart with blank nodes. Some nodes are obscured by black boxes that must be scratched off (or covered by sticky notes) to reveal conditions.
      *   1 Red Pen, 1 Blue Pen.
      *   1 "Veto Token" (a poker chip or just a folded paper) for the Hand.
  *   **Whiteboard** for tallying the "separation test" results.

  ### The Puzzle (Brief)
  Don't use a standard logic puzzle. Use a **liability cascade**.
  *   *Scenario:* A drone delivery service crashes. Who is liable? (Manufacturer? Software coder? User? Weather service?)
  *   *Structure:* The Decision Tree has 5 layers. To move from Node A to Node B, you need to satisfy a condition (e.g., "Was maintenance logged?").
  *   *The Twist:* The Case File text is given only to **Voice**. The Decision Tree visual layout (which paths connect to which) is only fully visible to **Hand** (because Voice's view is blocked by a folder stand or just angle). Hand knows the topology; Voice knows the facts. They *must* integrate to navigate.

  ### Timeline (75 mins)

  **0:00–0:10 | Intro & Pairing**
  *   Split into 7 pairs. Randomize roles (Voice/Hand).
  *   Hand out materials.
  *   **Rule Drop:** "Voice speaks, Hand writes. Voice cannot touch the paper. Hand cannot speak (can hum, tap, but no words)."
  *   **Constraint:** To "lock in" a node on the tree, both pens must sign it (Red + Blue). If only one signs, the path is invalid.
  *   **The Hook:** Tell them this is a simulation of distributed cognition. Don't mention EMT yet.

  **0:10–0:30 | The Joint Reasoning Phase (20 mins)**
  *   They work through the liability case.
  *   They must fill in the blank nodes on the tree with their conclusion (Liable/Not Liable) and the reason code.
  *   **Monitor:** Walk around. If Voice is dominating, whisper to Hand: "Use your Veto Token if you think the path doesn't match the map." (Hand gets 1 Veto per game to force a re-evaluation).
  *   *Goal:* They finish the tree. They feel like a single unit solving the problem.

  **0:30–0:45 | The Separation Trap (15 mins)**
  *   **Crucial Step:** Collect the Decision Trees immediately. Hide them.
  *   Separate the pairs. Voice goes to one side of the room, Hand to the other. No talking.
  *   **The Test:** Hand out a blank sheet. "Write down the reasoning chain for **Node 3** specifically. Why did you choose that path? What was the premise?"
  *   Give them 5 mins silently.
  *   Collect the sheets.

  **0:45–0:55 | The Reveal & Payoff (10 mins)**
  *   Put the pairs back together.
  *   **Payoff Scheme:** Here's the tricky part. If you grade hard on success, they'll hate you because the task is designed to fail.
      *   *Suggestion:* Base participation points (100%) for completing the activity.
      *   *The "Bonus":* Tell them: "You get a bonus participation stamp only if your independent accounts of Node 3 match perfectly without the artifact."
      *   *Reality:* Almost no one will get this. That's the point.
  *   Ask 2-3 pairs to read their separate accounts. They will diverge. Voice will say "We thought X because of the statute." Hand will say "We went left because the box looked open."
  *   Write the mismatch on the board. Let them feel the confusion. "Wait, I thought *you* decided that?"

  **0:55–1:15 | Debrief (20 mins)**
  *   Now you lecture, but let the frustration lead it.

  ### Predictable Breaks & Fixes

  **1. Voice Dominates (The "Dictator" Problem)**
  *   *What happens:* Voice treats Hand like a voice-to-text app. Hand just signs whatever.
  *   *Why it breaks EMT:* The cognition isn't extended; it's just outsourced. The paper is a notebook, not a processor.
  *   *Fix:* The **Topography Constraint**. As mentioned above, Voice cannot see the full tree. Voice knows the law ("If negligence, then liable"), but Hand knows the map ("Negligence leads to Box B, but Box B is blocked unless..."). Hand must physically rotate the paper or lift a flap to reveal the next condition. Voice literally cannot reason without Hand's manipulation of the space.

  **2. Hand Memorizes the Tree**
  *   *What happens:* Hand just rote-learns the path during the 20 mins.
  *   *Why it breaks EMT:* If Hand memorizes it, the cognition moves back inside the skull.
  *   *Fix:* Make the tree **too complex**. 5 layers with branching conditionals is usually too much for working memory in 20 mins, especially under the silence constraint. Also, change the visual cues slightly in the separation test (e.g., ask about a counterfactual: "What if Node 2 was false?"). They can't memorize every counterfactual.

  **3. The "Scribe" Passive Mode**
  *   *What happens:* Hand feels useless and disengages.
  *   *Fix:* The **Veto Token**. Give Hand one physical token they can slam on the table to halt progress. If they use it, Voice must explain the logic again. This forces Voice to treat Hand as a cognitive checkpoint, not just a printer.

  ### Debrief Guide (Mapping to Theory)

  **1. The Parity Principle (Clark & Chalmers)**
  *   Ask: "When you were working, did the paper feel like part of your thinking?"
  *   Most will say yes.
  *   Point: If you accept that Otto's notebook is part of his memory (the classic case), you must accept this Tree is part of your reasoning. The function was identical to internal inference.
  *   *The Kicker:* The separation test proves it. You couldn't reproduce the step internally because the step *wasn't* internal. It was in the coupling.

  **2. Coupling vs. Constitution**
  *   This is where the pushback happens.
  *   Student objection: "The paper was just coupled to us, not constitutive of our mind. When you took it away, my mind stayed intact."
  *   Your response: "Did your mind stay intact? You couldn't recall Step 3. If the paper was just a tool (like a hammer), you should still know *what* you decided, even if you lost the tool. But you lost the *reasoning process* itself."
  *   Highlight the mismatch between Voice and Hand. Voice thought the reason was legal; Hand thought the reason was spatial. The "belief" existed only in the interaction.

  **3. Honest Limitations (The Functionalist Gap)**
  *   Be upfront: "Look, this game doesn't prove functionalism. It just shows reliance."
  *   True EMT requires the external resource to be **reliably available** and **automatically endorsed**. In this game, the paper was temporary and contested.
  *   Also, we didn't test for **trust**. You probably didn't trust the paper blindly; you checked it. Real extended mind (like a blind man's cane) becomes transparent. Here, the artifact remained opaque.
  *   Tell them: "You felt the extension, but you didn't achieve full integration. That's why the separation hurt."

  ### Payoff Note
  Keep the points low-stakes. If you make their grade depend on reproducing internal states that were deliberately extended, they'll feel gaslit. Frame the bonus as "The Impossible Bonus." The failure is the lesson. If they succeed, they probably cheated (talked during separation), which is also a fun discussion point about coupling.

  ### Quick Typos/Notes for you
  *   Make sure you collect the trees *before* they stand up. Students try to snap photos with phones otherwise.
  *   If a pair finishes early, don't let them talk. Give them a blank sheet and ask them to draw the tree from memory (they wont be able to).
  *   Watch out for the Hand students feeling sidelined. Walk around and empower them to use the Veto token early.

  This should get them arguing about where their heads end before you even write "EMT" on the board. Good luck with the seminar.
