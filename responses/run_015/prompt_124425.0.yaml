prompt: |-
  hey, I'm running a grad seminar in phil of mind — about 14 students, one 75-min session. I need an in-class game that makes them feel the extended mind thesis in their bones, not just nod at it. The specific thing I want them to hit is that fuzzy moment where you can't tell if a reasoning step is inside your head or out there in some object or partner.

  Niche twist: pairs work with a "joint reasoning artifact" — a printed decision tree with blank nodes they both annotate, but neither fully controls. One is Voice (talks, can't write), the other Hand (writes/annotates, can't talk). They get 20 minutes to solve a branching hypothetical case — maybe a nested legal liability puzzle — and fill in the tree together. They don't know that afterwards I'll seperate them and ask each to walk me through step 3 of "their" reasoning without the artifact or partner present. They recieve shared points only if both can reproduce the same chain independently, which usually fails; they often cite annotations as if those were internal mental steps, or disagree about whose belief it was.

  Set up rules, materials (just paper/pens, printed template), full timeline for the 75 mins, and the payoff scheme (no real money — maybe course-participation points?). Arrange it so the boundary problem shows up in what happens, not in my lecture afterwards.

  Debrief needs to map moments onto Clark and Chalmers' parity principle and also onto the coupling-constitution objection, plus an honest note that this can't reproduce the functionalist analysis of cognitive integration — I'll supply that part. Also tell me what predictably breaks: probably Voice dictates everything and Hand becomes a passive scribe, or one person just memorizes the tree. How do I fix that?

  Keep it casual — this is for a dataset and I'm kind of rushing, so a typo or two is totally fine. And please don't ask for a bibliography or citations, since this is meant for models that can't search the web.
