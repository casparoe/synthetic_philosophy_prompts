  **DEPARTMENT OF SOCIAL FRICTION**
  **Office of Conditional Entitlement**
  **Vacancy Announcement: OCE-2024-88B**

  **Position:** Eligibility Calibration Technician (GS-7)
  **Location:** Remote / Field Surveillance Unit
  **Status:** Full-Time (Probationary)

  **Duties:**
  The Office of Conditional Entitlement (OCE) seeks a detail-oriented individual to manage the disbursement of provisional aid packages. The successful candidate will monitor the Deservingness Metric™, a proprietary algorithmic aggregate used to determine beneficiary eligibility. Primary responsibilities include reviewing real-time biometric stress markers, analyzing job-search keystroke velocity, and validating peer-reported effort signals. Employees must ensure that benefit release occurs only when a recipient's composite score crosses the Dynamic Integrity Threshold. Please note: The specific numerical value of the Threshold is not disclosed to staff to prevent anticipatory calibration.

  **Requirements:**
  Applicants must demonstrate a high tolerance for ambiguity and a commitment to the principle that unverified need is statistically indistinguishable from fraud. Experience with moral hazard mitigation is preferred. The ability to deny claims based on insufficient visible hardship without experiencing secondary trauma is required. Candidates must possess strong communication skills to explain to applicants why their competence in navigating the application process disqualifies them from assistance.

  **ORIENTATION MANUAL EXCERPTS (REV. 14.2)**

  **Section 3.1: The Deservingness Metric**
  The Metric operates on a triaxial model of verification. First, biometric data (cortisol levels, sleep deprivation indices) must indicate significant distress. However, scores exceeding the 90th percentile indicate instability, suggesting the applicant is incapable of responsible fund management. Second, job-search keystroke patterns must show sustained effort. Rapid application submission suggests automation or desperation; slow submission suggests lethargy. The optimal window is narrow. Third, peer-reported effort signals allow neighbors and former employers to flag excessive comfort. A beneficiary observed purchasing non-essential calories or smiling in public spaces may trigger an automatic freeze.

  **Section 7.5: Threshold Calibration**
  Benefits are released only when the Deservingness Score aligns with the Dynamic Integrity Threshold. This threshold adjusts inversely to the unemployment rate. As need increases in the general population, the threshold rises to maintain fiscal scarcity. Technicians are reminded that if benefits are accessed easily, the system has failed to filter out the undeserving. Difficulty is not a bug; it is the primary verification mechanism. If a recipient succeeds in navigating the application process without external advocacy, their competence suggests they do not require aid. Consequently, the system is designed to require more resources than the applicant possesses to prove they lack resources.

  **Section 9.3: Ethics of Non-Release**
  > "It is the position of the Office that the utility of aid is contingent upon the visibility of the condition it remedies. To provide resources to an individual who does not exhibit palpable suffering is to subsidize deception. Suffering is the only currency this agency accepts; therefore, the alleviation of suffering prior to disbursement constitutes a form of retroactive fraud. A recipient who appears stable while awaiting funds has effectively stolen from the public trust by masking the severity of their deficit. Technicians must understand that withholding aid is not an act of denial, but a method of forcing the truth to the surface. If the need is genuine, the suffering will deepen until it becomes visible enough to justify the expense. To release funds before this visibility is achieved is to reward the concealment of need. We do not assist the hidden poor. We assist the visible crisis."

  **Note:** All staff must sign Form 12-B acknowledging that accidental approval of a qualified applicant is a reportable security incident. Performance evaluations are based on denial rates, not resolution times.
