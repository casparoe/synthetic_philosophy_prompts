answer: |-
  **Module:** PHI3042 Work, Welfare and the Philosophy of the Good Life
  **Assessment:** Final Examination
  **Time Allowed:** 2 Hours
  **Question Weight:** 40 Marks (Suggested Time: 45 Minutes)

  ***

  ### Question 1

  In *Economic Possibilities for our Grandchildren* (1930), John Maynard Keynes distinguishes between 'absolute needs' (which are satiable) and 'relative needs' (which are insatiable because they satisfy a desire for superiority). Consider the following policy proposal:

  **The Post-Productivity Welfare Contract:**
  1. All citizens receive a baseline income sufficient for absolute needs.
  2. To qualify, citizens must log 20 hours per week of 'social contribution' via a government monitoring app.
  3. Tax rebates are awarded for reducing luxury consumption below a national average.

  **Essay Task:**
  Critically evaluate whether Keynes would view this contract as realising his vision of liberated leisure or as disguising the old 'love of money' as civic virtue. In your answer, you must address whether the policy treats relative needs as a psychological problem to be solved or a behavioural issue to be managed.

  ***

  ### Model Answer

  Keynes would likely view the Post-Productivity Welfare Contract not as the realisation of his vision, but as a bureaucratic perpetuation of the very economic habits he hoped technology would render obsolete. While the baseline income addresses absolute needs, the conditional requirements betray a fundamental misunderstanding of the psychological transition Keynes deemed necessary for the good life.

  Keynes's optimism was technological; he believed productivity would solve the problem of subsistence. However, his pessimism was psychological; he feared the 'habitual nature of human beings' would prevent them from enjoying leisure. The Contract fails because it attempts to manage this psychological hurdle through surveillance rather than cultural evolution. By mandating 20 hours of logged activity via an app, the policy re-instruments time. For Keynes, the goal was not merely the reduction of labour, but the cultivation of the 'art of life'—living wisely and agreeably. Turning leisure into monitored 'social contribution' retains the Puritanical ethic that work is virtuous and idleness is suspect. It disguises the love of money (or rather, the love of economic justification) as civic virtue, ensuring citizens remain accountable to the state for their time, rather than becoming truly autonomous.

  Furthermore, the policy misdiagnoses the nature of relative needs. Keynes argued relative needs are insatiable because they are positional; we seek to feel superior to others. The Contract attempts to curb this through tax rebates for cutting luxury consumption. This treats relative striving as a behavioural issue to be managed through incentives, rather than a philosophical problem to be transcended. Keynes hoped that once absolute needs were met, the love of money would be seen as a 'disgusting morbidity'. By creating a market mechanism (rebates) to discourage consumption, the state validates the economic framework it seeks to escape. It acknowledges the insatiability of relative needs but tries to price them down, rather than fostering a culture where superiority is no longer sought through material accumulation.

  Crucially, the monitoring aspect introduces a disciplinary element incompatible with liberated leisure. If citizens must prove their worth through an app, they remain in a state of economic anxiety, merely swapping the boss for the algorithm. Keynes envisioned a world where the economic problem was solved to the point of irrelevance. This policy keeps the economic problem central to daily existence. It assumes citizens cannot be trusted with freedom, implying that without the threat of losing the baseline income, they would not contribute socially. This cynicism contradicts Keynes's hope that humans, freed from economic necessity, would naturally turn to higher pursuits.

  Ultimately, the Contract is a compromise that satisfies neither the demands of efficiency nor the requirements of liberty. It solves the absolute need for income but exacerbates the psychological burden of relative standing by making 'contribution' a metric of worth. Keynes would argue this delays the true challenge: learning how to use freedom, not how to account for it.

  *(518 words)*

  ***

  ### Marking Scheme (40 Marks)

  **Grade Band: First Class (A) – 32 to 40 Marks**
  *   **Conceptual Precision:** Clearly distinguishes between absolute needs (satiable/technological) and relative needs (insatiable/psychological). Explicitly identifies the tension between Keynes's technological optimism and psychological pessimism.
  *   **Critical Application:** Directly engages with the specific mechanics of the policy (the app, the 20-hour mandate, the rebates). Critiques the *monitoring* aspect as incompatible with the 'art of life'.
  *   **Argumentative Depth:** Addresses the prompt's core tension: does this policy solve the problem or disguise the 'love of money' as virtue? Argues that the policy manages behaviour rather than solving the philosophical problem of relative striving.
  *   **Structure:** Coherent, logical flow without reliance on citation theatre.

  **Grade Band: Upper Second (B) – 24 to 31 Marks**
  *   **Conceptual Understanding:** Understands the basic distinction between needs but may treat them as merely economic categories rather than psychological states.
  *   **Application Gaps:** Discusses the baseline income well but **ignores or underplays the monitoring/app aspect**. Treats the 20-hour rule as standard labour rather than a barrier to *liberated* leisure.
  *   **Argumentative Limits:** Correctly identifies that Keynes would be sceptical but attributes this to the work hours alone, missing the deeper point about the 'love of money' and the insatiability of relative status.
  *   **Common Mistake:** Conflates absolute and relative needs, or suggests Keynes believed technology alone solves the psychological problem.

  **Grade Band: Lower Second (C) – 16 to 23 Marks**
  *   **Descriptive Focus:** Summarises Keynes's 15-hour prediction without analysing the philosophical underpinnings of needs.
  *   **Policy Engagement:** Treats the question as a generic Universal Basic Income (UBI) debate. Fails to engage with the 'luxury rebate' or 'civic virtue' elements of the prompt.
  *   **Misinterpretation:** Suggests Keynes would support the policy simply because it reduces work hours, missing the nuance of *voluntary* leisure vs. *mandated* contribution.

  **Grade Band: Fail (D/E) – 0 to 15 Marks**
  *   **Irrelevance:** Fails to address the specific policy details or Keynes's text.
  *   **Fundamental Errors:** Claims Keynes believed needs were entirely satiable or that he advocated for state monitoring of leisure.
  *   **Clarity:** Incoherent argument or significant deviation from British English conventions.

  **Marker Notes:**
  *   **Time Management:** Students spending over 50 minutes here may struggle to complete the exam. Reward conciseness.
  *   **Citation Theatre:** Do not reward name-dropping of secondary literature (e.g., Skidelsky & Skidelsky) unless it directly aids the argument. Focus on reasoning.
  *   **The 'App' Factor:** A student cannot achieve an A if they do not discuss the implications of logging hours via an app. This is the crux of the 'discipline vs. freedom' argument.
