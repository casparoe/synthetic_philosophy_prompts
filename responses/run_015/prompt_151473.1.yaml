answer: |-
  **1. The Scenario**
  Rainbow Trout (*Oncorhynchus mykiss*) are reared in concrete raceways at high density. Water velocity is kept continuously high to stimulate appetite and muscle tone. Fish are mechanically graded weekly to maintain size uniformity. Physiological sampling shows baseline cortisol is unexpectedly low; an ACTH challenge yields a flat response, and diurnal rhythm is absent. Behaviorally, subordinates show chronic hiding, fin-nipping scars, and lethargy, often drifting backward despite flow capacity. Dominants display heightened aggression.

  **2. The Accounts**
  **Affective Account:** Verdict: Poor. Welfare is the balance of subjective states. Behavioral evidence (scars, avoidance) indicates persistent fear and pain. The flat physiological response indicates HPI axis exhaustion ("burnout"), not comfort. **Assessor Instruction:** When physiology is flat but behavior indicates distress, conclude the animal is chronically stressed beyond coping, not calm. The negative affective balance dominates.

  **Natural Function Account:** Verdict: Poor. Welfare is the exercise of natural capacities. Trout telos includes establishing stable social hierarchies and efficient energy thrift. Weekly grading prevents hierarchy stabilization; constant high velocity forces unnatural energy expenditure. The fish cannot fulfill their biological nature.

  **3. The Interventions**
  **Affective Recommendation:** Cease grading and reduce water velocity to minimize handling stress and exhaustion.
  **Backfire:** Without grading, size disparity grows. Dominants monopolize food, causing subordinates to starve (violating Function/thrift). Low velocity reduces muscle tone and natural foraging drive, impairing biological capacity.

  **Function Recommendation:** Maintain high velocity and enforce strict grading to ensure uniform growth and exercise.
  **Backfire:** Frequent handling induces acute fear and pain. High flow forces exhausted fish to swim beyond comfort limits, deepening negative subjective states (violating Affective).

  **4. Key Feature**
  The down-regulated stress axis (physiological burnout). If the axis responded normally (high cortisol = stress), both accounts would condemn the high velocity/grading regime as physiologically costly. The ambiguity forces the split: one account reads the silence as suffering, the other ignores it for biological output. Remove this, and both agree the system is simply too stressful.

  **5. The Defenders**
  **Affective Defender:** "Your 'function' is just production metrics disguised. A burnt-out animal isn't functioning naturally; survival without feeling is not welfare. Prioritize the behavioral evidence of fear."
  **Function Defender:** "Growth and hierarchy are biological facts. Exhaustion is a human projection. If the body functions and survives, the welfare is intact. Your 'suffering' is unmeasurable speculation."
