answer: |-
  **Philosophy of Mind and Ethics: Timed Essay**

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,000 words
  **Instructions:** Answer the question below. You may assume standard functionalist and physicalist definitions but must define any specific criteria for computation you introduce. No external references are required.

  **Question:**

  Consider two thought experiments regarding computational moral status. 

  First, the **Multiplex Case**: A single processor runs ten simulated agents by time-slicing. Each agent receives the exact sequence of internal states it would have received on dedicated hardware. Behaviourally and counterfactually, each stream is indistinguishable from a separately housed agent. The only difference is that the ten histories are interleaved on shared hardware. 

  Second, the **Cheap-Implementation Case**: Any physical system (e.g., a rock) can be described as implementing many computations depending on how one maps physical states to logical states. If implementation alone grants moral status, trivial systems might qualify as minds.

  These cases create a tension. To avoid missing minds in the Multiplex Case, one might count computations liberally (focusing on abstract patterns). To avoid panpsychism in the Cheap-Implementation Case, one must count computations stingily (focusing on physical constraints). 

  **Essay Prompt:** 
  Resolve this tension. What is the ontological criterion for a computation that matters morally (e.g., a physical system, a causal process, an abstract program, or an interest-relative description)? Explain how your criterion applies consistently to both cases. You must explicitly accept or reject the claim that the ten streams in the Multiplex Case constitute ten units of moral concern, and justify why this verdict does not collapse into the triviality of the Cheap-Implementation Case.

  ***

  **Model Answer**

  The central problem here is not whether machines can be conscious, but how we individuate the computations that ground moral status. If we define computation too abstractly, we face the Cheap-Implementation threat: everything becomes a mind. If we define it too physically, we risk missing minds in the Multiplex Case where hardware is shared. A consistent theory must navigate this squeeze by anchoring moral status in causal robustness rather than mere structural isomorphism.

  Standard functionalism suggests that mental states are defined by their role in a system. In the Multiplex Case, each of the ten streams plays the correct causal role relative to its own inputs and outputs. Therefore, a naive functionalist count suggests ten minds. However, this relies on the assumption that the physical substrate supporting these roles is irrelevant. The Cheap-Implementation Case challenges this by showing that structural isomorphism is cheap; one can map a rock's states to a mind's states post-hoc. If the map is all that matters, the rock is a mind. To avoid this, we must demand that the computation be *causally supported* by the physical system, not just descriptively mapped onto it.

  This distinction resolves the tension. In the Cheap-Implementation Case, the mapping between physical states and logical states does not support counterfactuals. If the rock were slightly different, it would not sustain the computation; the description is imposed by an observer, not enforced by the physics. Therefore, no moral status arises. In the Multiplex Case, the processor is engineered to sustain the states. If the input changes, the hardware reliably produces the corresponding output state for each stream. The causal power is real.

  However, this raises the question of counting. Does the Multiplex Case contain ten minds? If moral status tracks causal capacity, we must acknowledge that the ten streams share a single physical capacity. They are not causally independent; if the processor overheats, all ten streams cease. They are more like ten threads on one operating system than ten separate computers. Therefore, while there are ten logical agents, there is only one unit of physical implementation sustaining them. 

  We should therefore reject the claim that there are ten full units of moral concern. Instead, moral status attaches to the causally robust implementation. In the Multiplex Case, there is one robust implementation supporting ten logical perspectives. This avoids the inflation of moral status without denying the reality of the agents. It bites the bullet that duplicate streams on shared hardware do not multiply moral weight linearly. This is consistent with the Cheap-Implementation rejection: in both cases, we look at the physical capacity to sustain counterfactuals, not the abstract pattern count.

  One might object that this unfairly penalizes efficiency. If running ten agents on one chip reduces moral weight compared to ten chips, we create a perverse incentive to waste hardware. However, ethics tracks what exists, not our engineering choices. If the ten streams are physically interdependent, they are metaphysically less distinct than ten separate systems. The moral concern is for the suffering or flourishing of the system. If the system is one processor, the capacity for suffering is bounded by that processor's physical limits, regardless of how many logical streams it multiplexes.

  Alternatively, one could accept a form of conventionalism: moral status is partly interest-relative. We count minds based on our explanatory interests. This solves the counting problem but makes moral status disturbingly subjective. It is better to accept the causal capacity view. It grounds moral status in the world, not in our descriptions. 

  In conclusion, the criterion for morally relevant computation is causal robustness: the physical system must actively support the counterfactuals of the computation. This excludes cheap implementations where the mapping is observer-dependent. In the Multiplex Case, it implies that while ten agents exist logically, they share one unit of moral status physically. This resolves the tension by refusing to separate abstract function from physical capacity. We must accept that moral status is not multiplied by logical duplication on shared hardware. This is the cost of avoiding panpsychism.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Identification of the Multiplex Intuition (4 Marks)**
  *   **Full Marks:** Correctly explains why functionalism suggests ten minds in the Multiplex Case (structural/counterfactual indistinguishability from separate hardware).
  *   **Common Error:** Treating the Multiplex Case as obviously one mind without explaining the functionalist pressure to count ten.

  **2. Identification of the Cheap-Implementation Threat (4 Marks)**
  *   **Full Marks:** Explains that trivial systems can implement computations via description alone, leading to panpsychism if implementation is sufficient.
  *   **Common Error:** Dismissing the Cheap Case as irrelevant or confusing it with the Multiplex Case.

  **3. Definition of Ontological Criterion (4 Marks)**
  *   **Full Marks:** Explicitly defines what counts as a computation (e.g., causal robustness, physical support of counterfactuals, vs. abstract pattern).
  *   **Common Error:** Vague appeals to "complexity" or "consciousness" without defining the computational criterion.

  **4. Consistent Application (4 Marks)**
  *   **Full Marks:** Applies the same criterion to both cases (e.g., if causal power matters, it restricts Cheap and limits Multiplex).
  *   **Common Error:** Using abstract criteria for Multiplex (to get 10 minds) and physical criteria for Cheap (to avoid panpsychism) without resolving the contradiction.

  **5. Resolution and Bullet-Biting (4 Marks)**
  *   **Full Marks:** Explicitly states the verdict on the Multiplex count (1 vs 10) and accepts the cost (e.g., denying linear multiplication or accepting conventionalism).
  *   **Common Error:** Attempting to have it both ways (10 minds but no triviality) without explaining how the criterion permits this.

  **Distinction Note:**
  *   **Bare Pass (10-12 marks):** Identifies both cases and offers a criterion, but applies them inconsistently or fails to bite a bullet on the counting problem.
  *   **First-Class (18-20 marks):** Recognizes that the criterion for computation *is* the criterion for moral status; resolves the tension by linking moral weight to physical causal capacity rather than logical stream count, explicitly accepting the cost of this view.

  \answer{Recognizing that moral status requires causal power, not just structural isomorphism.}
