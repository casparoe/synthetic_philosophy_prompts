  ### The Principle of Independent Excess Corroboration

  A theoretical modification or research shift is **progressive** if and only if it satisfies all three of the following conditions:

  1.  **Non-Accommodative Resolution:** The modification resolves the initiating anomaly (empirical or internal) through a mechanism that is not merely a parameter fit tailored exclusively to the specific data of that anomaly.
  2.  **Domain Independence:** The modification entails novel consequences (empirical predictions or formal structures) in domains *distinct* from the conditions used to construct the modification.
  3.  **Successful Verification:** At least some of these distinct consequences are subsequently corroborated, either by empirical observation or by rigorous derivation and utility within independent theoretical frameworks.

  ---

  ### Application to Your Six Verdicts

  This principle is designed to capture your specific intuitions by distinguishing between *structural fertility* and *ad hoc patching*.

  *   **Ptolemaic Epicycles (Degenerative):** Fails **Clause 2**. Epicycles were tuned solely to planetary positions (the anomaly). They generated no independent consequences in other domains (e.g., physics of motion) that were verified.
  *   **Caloric Theory Adjustments (Degenerative):** Fails **Clause 1 & 3**. The "negative weight" hypothesis was tailored exclusively to save combustion data (Clause 1 violation) and was never independently verified (Clause 3 violation).
  *   **General Relativity (Progressive):** Passes all. It resolved Mercury's perihelion (**Clause 1**) via curvature, not fitting. It predicted lensing and redshift distinct from Mercury's orbit (**Clause 2**). These were observed (**Clause 3**).
  *   **Dark Matter (Progressive):** Passes all. It resolved rotation curves via mass (**Clause 1**). It predicted CMB power spectra and cluster lensing distinct from rotation curves (**Clause 2**). These were observed (**Clause 3**).
  *   **String Theory (Progressive):** Passes all, *provided* Clause 3 accepts mathematical corroboration. It resolved internal consistency anomalies (**Clause 1**). It generated AdS/CFT dualities distinct from the original formulation (**Clause 2**). These have been rigorously derived and applied in gauge theories (**Clause 3**).
  *   **Vulcan (Degenerative):** Fails **Clause 2 & 3**. It was postulated *only* for Mercury (no independent domain). It was never found (no verification).

  ---

  ### Application to Two Further Cases

  **1. The Higgs Mechanism (Electroweak Theory)**
  *   **Verdict:** **Progressive.**
  *   **Analysis:**
      *   **Clause 1:** It preserved gauge symmetry (core) while explaining mass (anomaly) via symmetry breaking, not by simply assigning mass values by hand.
      *   **Clause 2:** It predicted specific properties of the W and Z bosons and the Higgs scalar itself, distinct from the mere fact of mass.
      *   **Clause 3:** The W/Z bosons were found in 1983; the Higgs boson in 2012.
  *   **Rationale:** Like Dark Matter, it saved a core law (gauge invariance) with an auxiliary entity that yielded independent, verified empirical content.

  **2. Steady-State Cosmology (Continuous Creation)**
  *   **Verdict:** **Degenerative.**
  *   **Analysis:**
      *   **Clause 1:** It resolved the expansion anomaly by postulating matter creation to maintain density.
      *   **Clause 2:** It generated independent predictions, specifically regarding the distribution of radio sources and the temperature of the background radiation.
      *   **Clause 3:** **Failed.** The predicted radio source counts disagreed with observation, and the Cosmic Microwave Background was discovered at a temperature incompatible with the steady-state model.
  *   **Rationale:** Structurally similar to Dark Matter (postulating unseen processes to save a core), but it failed the verification clause, rendering it degenerative in retrospect.

