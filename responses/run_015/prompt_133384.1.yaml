  Of something greater, permanently **bound**.

  Though causal chains are strictly **bound**,
  No unity seems to **derive**
  From the assembly of each **part**;
  There is no overarching **subject**,
  No fusion of the raw **quality**,
  While fragments never constitute the **whole**.

  Invert the view: the cosmos is a **whole**,
  All fragments intimately **bound**
  Within one field of conscious **quality**;
  From this source do we **derive**,
  Not building up the cosmic **subject**,
  But breaking off as some isolated **part**.

  If I am merely such a **part**,
  How do I feel distinct from the **whole**?
  Am I a subordinate **subject**,
  By barriers loosely **bound**?
  What division causes me to **derive**
  This shadowed, separate **quality**?

  No change in intrinsic **quality**
  Solves the fracture of the **part**;
  Nothing new can truly **derive**,
  Whether ascending to the **whole**
  Or descending, tightly **bound**,
  To serve the universal **subject**.

  If bonding leaves the **subject** without **quality**,
  And keeps each **bound** relation just a **part**,
  The **whole** remains a name we **derive**.
