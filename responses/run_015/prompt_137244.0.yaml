answer: |-
  This is a sharp observation. You have identified a specific argumentative maneuver that sits at the intersection of metaphysics (causation) and ethics (impact), but it rarely gets a clean name in casual discourse because it hides behind metaphors like "ripple effects" or "doing your part."

  In academic philosophy, this is discussed under the header of **Causal Overdetermination** and the **Inefficacy Objection**. The specific move you are describing—changing the definition of the "outcome" to locate a causal difference—is technically a form of **Outcome Individuation**.

  However, "Outcome Individuation" is dry and doesn't capture the dynamic "zoom" aspect you're noticing. Since there isn't a single colloquial term that captures the nuance you want without collapsing into the excluded categories (uncertainty, complicity, etc.), I propose we call this move **Outcome Rescaling**.

  Here is the breakdown of what Outcome Rescaling is, how to distinguish its two axes, how to determine the "right" zoom, and where it fails.

  ### 1. The Definition: Outcome Rescaling

  **Outcome Rescaling** is the argumentative move of rejecting a claim of causal inefficacy ("I make no difference") by redefining the *description* or *temporal scope* of the outcome variable until a counterfactual difference appears.

  It asserts that the claim "X makes no difference to Y" is false, not because the causal chain is broken, but because Y was defined too coarsely or too narrowly.

  *   **The Claim:** "My vote doesn't change the winner."
  *   **The Rescale:** "It changes the *margin*." (Descriptive Rescaling)
  *   **The Claim:** "My chicken doesn't change the order."
  *   **The Rescale:** "It changes the *timing of the next order*." (Temporal Rescaling)

  ### 2. The Two Axes (Validating Your Intuition)

  You are correct that there are two distinct dimensions being conflated under "zoom." Separating them is crucial for evaluating whether the rescale is valid.

  **Axis A: Descriptive Granularity (The "Static" Zoom)**
  This measures the state of the world at a specific time $T$.
  *   *Coarse:* Candidate A wins.
  *   *Fine:* Candidate A wins by 500 votes.
  *   *Ultra-Fine:* Candidate A wins by 501 votes.
  *   **Function:** This looks for hidden variables in the *result state*. (e.g., Recount thresholds, public funding thresholds).

  **Axis B: Causal Propagation (The "Dynamic" Zoom)**
  This measures the chain of events flowing from time $T$ to $T+n$.
  *   *Near:* The election result.
  *   *Far:* The policy passed.
  *   *Further:* The hiring of a regulator.
  *   **Function:** This looks for downstream consequences that the coarse outcome missed. (e.g., A loss demoralizes a party, changing their platform next cycle).

  **Why they come apart:**
  As you noted, you can break a tie (Axis A: High Impact) but the candidates are identical (Axis B: Zero Impact). Conversely, you can fail to change the winner (Axis A: Zero Impact) but shift the margin enough to change future funding (Axis B: High Impact). A valid Outcome Rescaling argument must specify which axis it is moving along.

  ### 3. Solving the "Arbitrary Zoom" Problem

  Your first bug is: *Why is the "margin" the right resolution and not "the movement of a single molecule"?* If any difference counts, the argument proves too much.

  The selection criterion is **Moral Relevance**.

  Outcome Rescaling is only valid if the new, finer-grained outcome tracks a variable that actually matters to the ethical framework being discussed.
  *   **Valid Rescale:** "My vote changes the margin." -> *Why care?* "Because margins trigger recounts or funding." (The margin tracks a morally/politically relevant threshold).
  *   **Invalid Rescale:** "My vote changes the position of a dust mote on the ballot box." -> *Why care?* "It changes the universe's entropy." (Unless you are an entropy-maximizer, this is morally inert).

  **The Rule:** You cannot just find *a* difference; you must find a *relevant* difference. The "right" resolution is the coarsest resolution that still captures the morally significant threshold. If you zoom in past the point of moral significance (to molecules), you are engaging in **Pedantic Causal Tracking**, which is a fallacy of relevance.

  ### 4. The Boundary Case: Substitution vs. Reduction

  This addresses your specific boundary case: *What if the only difference is which bird dies, not how many?*

  Here, Outcome Rescaling **fails** (in most standard ethical frameworks).

  You need to distinguish between **Causal Reduction** and **Causal Substitution**.
  *   **Causal Reduction:** Your action lowers the *aggregate number* of negative events. (e.g., Delaying the crate order means one fewer bird is processed *this year*). This supports the "it makes a difference" claim.
  *   **Causal Substitution:** Your action swaps *which specific entity* suffers, but the *aggregate number* remains identical. (e.g., Bird A dies today instead of Bird B dying next week).

  If the ethical goal is aggregative (e.g., "minimize total suffering" or "minimize CO2 ppm"), Outcome Rescaling stops working at the point of Substitution. Swapping one identical unit of suffering for another is not a moral difference, even if it is a causal difference.

  *   **Test:** If you zoom in and the only difference is *identity* (which bird, which voter, which molecule) without a change in *quantity* or *quality* of outcome, the Rescale is **Morally Inert**.
  *   **Exception:** If your ethics are non-aggregative (e.g., "I must not be the specific cause of *this* bird's death," or rights-based ethics), then Substitution *does* count. But in the context of climate change or aggregate animal welfare, the "which bird" rescale kills the argument.

  ### 5. Summary for Argumentation

  When you encounter this move online, you can use this checklist to determine if **Outcome Rescaling** is being used validly or fallaciously.

  **The Move:** "You're measuring the outcome at the wrong resolution."

  **The Validity Test:**
  1.  **Identify the Axis:** Are they changing the *description* of the result (Margin vs. Winner) or the *timeline* of the result (Policy vs. Election)?
  2.  **Check Moral Relevance:** Does the finer resolution track a threshold that actually matters? (e.g., Does the margin actually trigger funding? Or is it just a number?)
  3.  **Check for Substitution:** Does the rescaled difference change the *total amount* of harm/benefit, or just *who/what* experiences it? If it's just substitution in an aggregative context, the move fails.

  **Example of Valid Rescaling:**
  *   *Claim:* "My vote doesn't matter."
  *   *Rescale:* "It changes the margin."
  *   *Validation:* Margins determine public funding thresholds (Relevant) and future candidate recruitment (Propagation). **Valid.**

  **Example of Invalid Rescaling:**
  *   *Claim:* "My burger doesn't matter."
  *   *Rescale:* "It changes which specific cow is slaughtered."
  *   *Validation:* Total cows slaughtered remains identical (Substitution). Unless you have a specific duty to *that* cow, the aggregate harm is unchanged. **Invalid** (for utilitarian/aggregative goals).

  **Example of Pedantic Rescaling:**
  *   *Claim:* "My driving doesn't cause the storm."
  *   *Rescale:* "It changes the trajectory of a water molecule."
  *   *Validation:* While causally true, the molecular trajectory is morally inert regarding "harm." **Invalid.**

  ### Terminology Recap
  *   **The Move:** Outcome Rescaling.
  *   **The Philosophical Context:** Response to the Inefficacy Objection / Causal Overdetermination.
  *   **The Two Axes:** Descriptive Granularity vs. Causal Propagation.
  *   **The Stop Condition:** When the rescale reveals only Causal Substitution without Causal Reduction (in aggregative ethics).

  This gives you a way to accept the move when it works (margins, thresholds, supply chain timing) and reject it when it doesn't (molecular paths, identical substitution), without relying on uncertainty or complicity.
