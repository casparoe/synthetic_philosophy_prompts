answer: |-
  You have put your finger on a genuine and significant fault line in the literature on supertasks, though you are correct that there isn't a single, catchy dictionary term for it (like "The Thomson Asymmetry").

  However, the distinction you are sensing is rigorously discussed under the rubric of **State Space Topology** and **Physical Continuity Principles**.

  The phenomenon you are identifying is the difference between **Logical Underdetermination** (the Lamp) and **Topological Convergence** (the Reservoir). Here is the carving you asked for: the precise conditions, the literature mapping, and why your intuition treats them differently.

  ### 1. The Core Distinction: Discrete vs. Continuous State Spaces

  The asymmetry arises because the "Lamp" and the "Reservoir" inhabit different mathematical topologies, and we implicitly apply different physical axioms to them.

  **Thomson's Lamp (Discrete Topology):**
  *   **State Space:** $S = \{0, 1\}$ (Off, On).
  *   **Metric:** Discrete metric ($d(x,y) = 1$ if $x \neq y$).
  *   **Sequence:** $1, 0, 1, 0, \dots$
  *   **Convergence:** In a discrete topology, a sequence converges *only if it eventually becomes constant*. Since the lamp never stops toggling, the sequence of states **diverges**.
  *   **Intuition:** Because the mathematical limit does not exist, and there is no physical law forcing "On/Off" to be continuous, we feel the state is undefined.

  **The Reservoir (Continuous Topology):**
  *   **State Space:** $S = \mathbb{R}_{\geq 0}$ (Amount of heat/charge).
  *   **Metric:** Euclidean metric ($d(x,y) = |x - y|$).
  *   **Sequence:** $1/2, 3/4, 7/8, \dots$ (assuming halving intervals).
  *   **Convergence:** This is a Cauchy sequence in a complete metric space. It **converges** to a limit (e.g., 1).
  *   **Intuition:** Because the mathematical limit exists, and we assume physical quantities like energy are continuous, we feel the state *must* be the limit.

  **The Carving:** The intuition of determinacy tracks **Topological Convergence**. You feel the reservoir has a result because the sequence of states converges in the natural topology of the property being measured. You feel the lamp has no result because the sequence of states diverges in its natural topology.

  ### 2. The Hidden Axiom: The Principle of Continuity

  There is a deeper layer here, identified by philosophers of physics like **John Earman** and **John Norton** (specifically in their 1996 paper *"Infinite Pains: The Trouble with Supertasks"*).

  The reason you feel the reservoir is determinate is not just math; it's that you are silently importing a **Physical Continuity Principle**.

  *   **For the Reservoir:** You assume that "Charge" or "Heat" cannot teleport. If the charge is $0.999...$ at $t = 1.999...$, it cannot suddenly be $50$ at $t=2$ without a physical mechanism for the jump. Therefore, the state at $t=2$ is *forced* to be the limit of the prior states.
  *   **For the Lamp:** "On" and "Off" are abstract labels. There is no conservation law for "On-ness." There is no physical continuity constraint preventing the lamp from being Off at the limit even if it was On immediately before.

  **The Phenomenon:** This is **Axiomatic Continuity Bias**. We treat metric physical quantities as bound by continuity constraints (limits must match values), but we treat logical/discrete states as free variables (limits do not constrain values).

  ### 3. Where the Intuition Breaks (The Edges)

  You asked for the edges of this concept. The best way to test this "carving" is to look at cases where the cumulative intuition fails. The **Ross-Littlewood Paradox** (Balls in an Urn) is the perfect stress test.

  **The Setup:**
  At step $n$, you add 10 balls to an urn and remove 1. You do this infinitely many times in finite time.
  *   **Cumulative View (Mass/Volume):** The total mass of balls in the urn diverges to infinity. Your "Reservoir Intuition" says: *The urn is infinitely heavy.*
  *   **Discrete View (Cardinality/Labels):** If you label the balls and remove specific ones (e.g., remove ball $n$ at step $n$), the set of balls remaining is empty. Your "Lamp Intuition" says: *The urn is empty.*

  **The Conflict:**
  Here, the "Cumulative" intuition (mass) and the "Discrete" intuition (count) give contradictory results for the *same* supertask.
  *   If you track **Mass**, the state space is $\mathbb{R}$, the series diverges, and the state is "Infinite Mass."
  *   If you track **Cardinality**, the state space is $\mathbb{N}$, the sequence is $9, 18, 27 \dots$ (diverges), *but* the set-theoretic limit of the *contents* is the empty set.

  **The Edge Condition:**
  The "Cumulative Determinacy" intuition only holds when:
  1.  The property is **additive** (mass, charge).
  2.  The property is **continuous** (no spontaneous jumps).
  3.  The series **converges** (bounded accumulation).

  If the cumulative series diverges (infinite mass), or if the property is non-additive (set membership), the intuition fractures.

  ### 4. Mapping to the Literature

  While there is no single noun for this, here is how the concepts map to existing philosophical terminology:

  1.  **Benacerraf's Gap (1962):** Paul Benacerraf argued that *neither* the lamp nor the reservoir is logically determined by the steps prior to the limit. The state at $t=1$ is logically underdetermined in *both* cases.
      *   *Your insight:* You are noticing that we *patch* Benacerraf's Gap for the reservoir using physical continuity, but we leave it open for the lamp.
  2.  **Supertask Realizability (Earman & Norton):** They argue that supertasks are only physically coherent if the underlying physical fields (like gravity or electromagnetism) remain well-behaved (continuous) at the limit point.
      *   *Your insight:* The reservoir feels determinate because it models a well-behaved physical field. The lamp feels indeterminate because it models a discontinuous switch.
  3.  **Hyperreal/Non-Standard Analysis:** Some mathematicians (like Jensen) have tried to solve Thomson's Lamp using non-standard analysis to assign a value at the infinitesimal limit. This usually fails to satisfy the intuition because the "On/Off" state remains binary.

  ### 5. Defining the Phenomenon

  If you want to name this for your own work, I propose the term **Topological Determinacy**.

  **Definition:**
  > **Topological Determinacy** is the intuitive judgment that the final state of a supertask is fixed if and only if the sequence of system states converges within the natural topology of the system's state space, *and* the system is assumed to obey a Principle of Physical Continuity.

  **The Criteria for Triggering the Intuition:**
  1.  **Metric State Space:** The property being tracked must admit a metric where distance $\to 0$ implies identity (e.g., temperature, voltage). Binary states fail this.
  2.  **Convergent Trajectory:** The sequence of values must form a Cauchy sequence converging to a finite limit. (Oscillation fails this).
  3.  **Continuity Constraint:** The observer must assume the physical system cannot undergo a discontinuous jump at the limit point without a specified cause.

  **Why it feels like a bias:**
  It is a bias in the sense that **Benacerraf was right**: logically, *neither* case is determined. The description of the process *up to* $t=1$ never entails the state *at* $t=1$.
  *   For the Lamp, we accept this logical gap.
  *   For the Reservoir, we **fill** the logical gap with a physical assumption (Conservation/Continuity).

  You are detecting the difference between **Logical Entailment** (which fails for both) and **Physical Extrapolation** (which succeeds for the reservoir).

  ### Summary
  You aren't missing a label; you are detecting the boundary between **logic** and **physics**.
  *   **Thomson's Lamp** is treated as a **logical puzzle**, so we respect the lack of a last step.
  *   **The Reservoir** is treated as a **physical model**, so we impose continuity constraints that force a limit.

  The "carving" is the **Continuity Constraint**. If you explicitly state "The charge cannot jump discontinuously," the reservoir is determinate. If you state "The lamp state need not be continuous," the lamp is indeterminate. Your intuition is correctly identifying that we apply the former constraint by default to quantities, but not to states.
