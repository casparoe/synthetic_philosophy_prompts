answer: |-
  This is a sharp framing. You're essentially operationalizing the James C. Scott / Yuval Noah Harari critique of civilization, but isolating *time* as the variable rather than *hierarchy* or *nutrition*.

  Here is the breakdown of your premises, the probabilistic combination, and the "typo" you might be sensing.

  ### The Breakdown

  **P1: The Ethnographic/Skeletal Record (HG Leisure > Agrarian Leisure)**
  *   **Credence: 0.70**
  *   **Reasoning:** The "Original Affluent Society" thesis (Sahlins) is the bedrock here, suggesting HGs worked 15–20 hours/week. Modern time-allocation studies (e.g., Hadza, Ache) complicate this; some show 40+ hours when food processing and camp maintenance are included. However, early farming (Neolithic) was undeniably labor-intensive (clearing, weeding, grinding grain). The skeletal record shows increased repetitive stress injuries in early farmers. The direction of the shift is likely correct (HG > Agrarian), but the *magnitude* is debated.
  *   **Risk:** Selection bias in ethnography (studying HGs in marginal lands vs. fertile ones).

  **P2: Leisure is the Morally Decisive Welfare Metric**
  *   **Credence: 0.55**
  *   **Reasoning:** This is the normative bottleneck. Classical utilitarianism might prioritize *total* welfare (more people alive, even if miserable) over *average* welfare (fewer people, more leisure). Furthermore, "security" has welfare value. A HG has more leisure but higher variance in survival; a farmer has less leisure but lower variance (storage). If you value risk-aversion, P2 weakens. Calling leisure "morally decisive" excludes other goods (autonomy, security, meaning) that might outweigh hours.
  *   **Risk:** Ignoring the "Total vs. Average" utilitarianism debate and the welfare value of security.

  **P3: Commensurability of the 'Median' Experience**
  *   **Credence: 0.60**
  *   **Reasoning:** This is methodologically fragile. HG groups were largely egalitarian; early agrarian states were strictly hierarchical. The "median" farmer might be a debt-bonded laborer, while the "median" HG is a full tribe member. Aggregating these into a single "human experience" risks category errors. However, macro-history requires some aggregation to function, so it's not impossible, just noisy.
  *   **Risk:** Comparing a !Kung forager to a Mesopotamian slave conflates social structure with subsistence strategy.

  **P4: Persistence of the Deficit (~4000 Years)**
  *   **Credence: 0.85**
  *   **Reasoning:** This is the strongest link. Until the Industrial Revolution (and arguably the 20th-century labor movement), agrarian societies were extractive. Surplus was siphoned by elites, not returned as leisure to the producers. The "fix" came via *technology* (mechanization), not *redistribution*. Your premise says "redistribution," which is slightly off (see "The Typo" below), but the core claim (the deficit persisted) is historically robust.
  *   **Risk:** Underestimating the number of religious festivals/holidays in pre-modern agrarian societies (e.g., Medieval Europe had ~100 holy days), though these weren't necessarily "discretionary."

  ---

  ### The Calculation

  To find the credence of the conjoint argument (that *all* these conditions hold to make the thesis true), we multiply the probabilities:

  $$0.70 \times 0.55 \times 0.60 \times 0.85 \approx \mathbf{0.20}$$

  **Final Credence: ~20%**

  **Wait—don't stop there.**
  That 20% is the probability that your *specific formulation* is the complete and exclusive truth. If we bracket P2 (the moral philosophy) and ask only about the **empirical claim** (Did leisure drop and stay dropped?), the math changes:

  $$0.70 \times 0.60 \times 0.85 \approx \mathbf{0.36}$$

  Even empirically, there is only a ~36% chance that the data cleanly supports a universal leisure collapse for the median person, largely due to the measurement noise in P1 and P3.

  ---

  ### The Weakest Link

  **P2 (The Moral Metric)** is the philosophical weak link, but **P3 (The Median)** is the empirical weak link.

  If you want to defend this thesis, P3 is where you will get crushed by anthropologists. Defining a "median human" across a shift from band societies to stratified states is statistically dubious. The variance in agrarian experience (freeholder vs. serf) is vastly higher than in HG bands.

  ### The Mind-Changing Finding

  To move my needle on **P1 (The Empirical Core)**, I would need:
  **High-resolution activity budgets from early Neolithic settlements.**
  Not skeletal stress markers (which show intensity, not duration), but something like settlement layout analysis indicating time-saving infrastructure (e.g., communal processing facilities) that appears *earlier* than expected. If we found evidence that early farmers developed labor-sharing or tech that kept work-hours at HG levels for the first 2,000 years, the "mistake" timeline collapses.

  To move my needle on **P2 (The Moral Core)**:
  **Evidence that leisure without security reduces net welfare.**
  If data showed that HG "leisure" was actually high-anxiety vigilance (predator/tribal conflict monitoring) that physiologically counts as stress, whereas agrarian toil was rhythmic/low-cortisol, the "leisure" metric fails.

  ---

  ### The "Typo" You're Sensing

  You mentioned feeling like you're missing something obvious. I think the typo is in **P4**, specifically the word **"redistribution."**

  > *P4: ...rather than being fixed by later redistribution*

  The leisure deficit wasn't fixed by redistribution; it was fixed by **energy density** (fossil fuels).

  *   **Redistribution** implies taking existing surplus and giving time back to workers.
  *   **Mechanization** implies creating enough surplus that fewer hours are needed to survive.

  Pre-modern states *could* have redistributed surplus as leisure (fewer corvée days, more festivals), but they rarely did because labor was the primary constraint on power. The "mistake" wasn't just the loss of leisure; it was the **lock-in of a labor-extractive political structure** that made leisure impossible until external energy sources broke the constraint.

  **The missing variable:** You are treating Leisure as a resource that was *taken*, but historically, Leisure is a byproduct of **Energy Surplus per Capita**.
  *   HGs: High energy per capita (relative to needs) = High Leisure.
  *   Early Farmers: Low energy per capita (high labor cost) = Low Leisure.
  *   Moderns: Massive energy per capita (fossil fuels) = High Leisure.

  The "mistake" was getting stuck in the low-energy trap for 4,000+ years. If you adjust P4 to reflect **Energy/Technology constraints** rather than **Redistribution**, your credence in the empirical history goes up, but the moral blame shifts from "farmers chose badly" to "farmers got trapped."

  **Revised Credence with this correction:** If you view it as an **Energy Trap** rather than a **Leisure Choice**, the argument becomes more robust historically, but less morally damning of the individuals involved. I'd bump the empirical credence to **0.50**, but the "Mistake" framing becomes more tragic than culpable.
