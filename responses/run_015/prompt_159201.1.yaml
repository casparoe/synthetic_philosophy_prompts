answer: |-
  Sir, you speak of these families of figures as if they were two lists waiting only for a line to be drawn between them, yet I must insist that the ideas themselves are of a wholly different nature. The globe which affects the hand is a notion of resistance, of smoothness, of the hand's motion around a centre; the globe which affects the eye is a notion of light, of shadow, of a circular patch upon the fundus. There is no common measure between resistance and light. When you say the man possesses an ordered family of felt figures, you grant him too much; he possesses ideas of touch, indeed, but he possesses no idea of visible figure at all until the eye is opened. To say he lacks only a correspondence is to suggest the visible figure exists for him potentially, waiting to be matched. I say it exists not at all in his mind, and when it arrives, it is a stranger entirely.

  You ask what experience adds. It adds the knowledge that these two strangers are companions. It is not a trivial pairing, for it is the foundation of how we navigate a world that offers double evidence. If reasoning alone could bridge them, as your Mr. Leibniz suggests, then the blind man should deduce the appearance of light from the sensation of resistance. But what middle term has he? Extension, you say? But visible extension and tangible extension are as distinct as colour and sound. My poor Lucy, in her darkness, knows the table by its edge and its resistance; if her sight were restored, would she know that the bright patch *is* the table without being told? I think not. Tell me, Sir: if the idea of extension were truly common to both senses, why does the blind man, upon first seeing, find the world so flat and confused, lacking that depth which his hand knows so well?
