  I've been arguing with my study partner about Dancy's particularism in our meta-ethics course. We read about the variability thesis and how moral reasons have this shape that can flip—like, the fact that a painting being unique might be a reason to preserve it in one case but destroy it in another. I think I get that part. But then I started wondering: if particularists reject all universal moral principles, doesn't that force them into a kind of case-by-case foundationalism? Like, each situation becomes its own epistemic bedrock, and you can't really justify one judgment by appealing to another because reasons don't carry over consistently. My partner said that's not right, that particularists still use analouges and reasoning by similarity, but I don't see how that works if the holism of reasons means a feature can literally reverse its moral polarity. Without some hidden principle linking the cases, isn't every analogical move just a guess?

  So I'm confused whether particularism actually collapses into this weird isolated-judgment view, or if there's a legitimate middle ground I'm missing. Can you straighten this out? Please start with your bottom line in the very first sentence, then explain your reasoning after that, with no preamble and no repeating back my question.
