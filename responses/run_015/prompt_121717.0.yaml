answer: |-
  No, particularism does not collapse into isolated-judgment foundationalism because it rejects codifiable universal principles while still permitting robust reasoning by analogy based on contextual similarities rather than subsumption under rules. Dancy's holism of reasons asserts that a feature's moral contribution depends on the context, but this does not render cases incomparable; instead, it shifts the focus from matching individual features to matching the overall shape of situations. When a particularist draws an analogy between two cases, they are not appealing to a hidden universal principle that guarantees the feature will behave the same way, but rather claiming that the surrounding context in both cases is sufficiently similar to sustain the same moral valence. This relies on a model of moral perception or expertise, where a trained agent recognizes relevant patterns without needing to articulate them as exceptionless laws. Consequently, justification occurs through coherence and comparative judgment rather than deduction from premises, avoiding the isolation you fear while maintaining the flexibility required by the variability thesis. The worry about "guessing" assumes that only rule-governed inference counts as reasoning, whereas particularists argue that navigating context-sensitive similarities is a rational skill in its own right.
