prompt: |-
  I'm a TA and next week I have to teach Samuel Scheffler's "afterlife" thought experiment to first-years in one 50-minute section. The book is *Death and the Afterlife*; the core move is the pair of scenarios (a "doomsday" world where Earth is destroyed shortly after each person's death, versus a world where humanity and its projects continue indefinitely) that he uses to argue that what we care about is the indefinite continuation of the species and its undertakings, not our own survival or the survival of particular people. Don't explain it to me; plan how I should teach it. I want the order in which the pieces must be introduced and why (what depends on what — e.g., what has to be in place before the two scenarios can even be contrasted), the one concrete case to build it around and what that case must have and lack, the misconceptions the students will predictably bring or form (I'm expecting at least: that the point is about personal immortality, that it's really about the dead, that it's just environmentalism, and that it reduces to "leaving a legacy"), and the exact point in the sequence where each should be headed off. Include a check I can run at the end that tells me they grasp the claim itself rather than just feeling unsettled, and name one thing I should openly refuse to address in this section. Give me the plan as a JSON object with these fields: "sequence" (an array of steps, each with "step_name" and "why_now"), "carrying_example" (an object with "case", "must_have", "must_lack"), "misconception_map" (an array, each item with "misconception", "where_it_forms", "how_to_head_off"), "understanding_check" (a string), and "leave_out" (a string).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** TA teaching first-year students.
      *   **Topic:** Samuel Scheffler's "Afterlife" thought experiment from *Death and the Afterlife*.
      *   **Core Argument:** We care more about the indefinite continuation of humanity/projects after our death than our own survival or the survival of specific loved ones (the "Collective Afterlife").
      *   **Constraints:**
          *   Do not explain the theory to me (the user knows it).
          *   Plan *how* to teach it in a 50-minute section.
          *   Output format: JSON object.
          *   Required fields: `sequence`, `carrying_example`, `misconception_map`, `understanding_check`, `leave_out`.
          *   Specific content requirements: Order of pieces (dependencies), one concrete case (with must_have/must_lack), specific misconceptions (personal immortality, about the dead, environmentalism, legacy), where to head them off, end check for grasp vs. feeling, one thing to refuse to address.

  2.  **Deconstruct the Content (Scheffler's Argument):**
      *   Scenario A: Doomsday (Earth destroyed 30 days after your death).
      *   Scenario B: Collective Afterlife (Humanity continues indefinitely).
      *   Intuition Pump: Most people prefer B over A, even though they are dead in both.
      *   Conclusion: Our confidence in the "collective afterlife" is a precondition for valuing our current activities. It's not about *my* survival or *my loved ones'* survival, but humanity's.
      *   Implication: This reveals the social/temporal embeddedness of value.

  3.  **Drafting the Plan (Mental Outline):**
      *   *Time:* 50 minutes is tight. Need to be focused.
      *   *Sequence:*
          1.  Hook/Setup (Normal assumptions about death).
          2.  Introduce Scenario A (Doomsday).
          3.  Introduce Scenario B (Collective Afterlife).
          4.  Elicit Intuition (Preference for B).
          5.  Analyze *Why* (Rule out self-interest, rule out loved ones).
          6.  Conclusion (Value depends on future humanity).
      *   *Carrying Example:* Needs to be something personal but not *too* personal. Writing a book? Raising a child? Building a bridge? Scheffler uses "writing a book" or "scientific research." Let's pick something relatable to first-years. "Working on a long-term project" (e.g., a cure for a disease, or even just planting a tree). Actually, Scheffler often uses the example of *valuing our current activities*. Let's use "Completing a research project whose benefits will only be realized in 100 years."
          *   Must Have: Benefits occur after the agent is dead.
          *   Must Lack: Direct benefit to the agent or their immediate children.
      *   *Misconceptions:*
          1.  Personal Immortality (It's about me living forever).
          2.  About the Dead (It's about whether the dead care).
          3.  Environmentalism (It's just about saving the planet).
          4.  Legacy (It's about my name being remembered).
      *   *Understanding Check:* Needs to distinguish between "I feel sad about Doomsday" and "My current values lose point without the future."
      *   *Leave Out:* Metaphysical questions about the soul/religious afterlife.

  4.  **Refining the Sequence (Dependencies):**
      *   You can't contrast the scenarios until both are defined.
      *   You can't draw the conclusion until the intuition (preference) is established.
      *   You can't rule out "legacy" until you've established the preference for humanity over specific names.
      *   *Step 1:* Establish baseline value (why do we do things now?).
      *   *Step 2:* Doomsday Scenario.
      *   *Step 3:* Collective Afterlife Scenario.
      *   *Step 4:* The Choice/Intuition.
      *   *Step 5:* Eliminating Alternative Explanations (Self, Loved Ones, Legacy).
      *   *Step 6:* The Philosophical Claim (Value is socially temporally extended).

  5.  **Refining the Carrying Example:**
      *   Case: "Funding a scholarship fund that opens in 50 years."
      *   Must Have: The agent is dead before it opens. The beneficiaries are strangers.
      *   Must Lack: Any plaque with the agent's name (rules out legacy). Any benefit to current children (rules out partial survival).

  6.  **Refining Misconception Map:**
      *   *Personal Immortality:* Forms early when "death" is mentioned. Head off during Scenario Intro.
      *   *Legacy:* Forms during the "Why prefer B?" phase. Head off during Elimination phase.
      *   *Environmentalism:* Forms during Conclusion. Head off by distinguishing "humanity" from "ecosystem."
      *   *About the Dead:* Forms during Intuition. Head off by emphasizing *current* valuation.

  7.  **Refining Understanding Check:**
      *   Ask them to apply the logic to a new case where legacy is impossible but humanity continues vs. humanity ends. If they say it matters, they get it.

  8.  **Refining "Leave Out":**
      *   Religious afterlife. It confuses the secular philosophical point.

  9.  **Constructing the JSON:**
      *   Ensure valid JSON syntax.
      *   Ensure all constraints are met.
      *   Check timing (50 mins). 6 steps might be tight, but manageable if focused.
      *   Check specific misconceptions requested: "personal immortality", "really about the dead", "just environmentalism", "leaving a legacy". I need to map these specifically.

  10. **Final Review against Constraints:**
      *   JSON object? Yes.
      *   Fields: `sequence`, `carrying_example`, `misconception_map`, `understanding_check`, `leave_out`? Yes.
      *   Sequence has `step_name` and `why_now`? Yes.
      *   Carrying example has `case`, `must_have`, `must_lack`? Yes.
      *   Misconception map has `misconception`, `where_it_forms`, `how_to_head_off`? Yes.
      *   Understanding check is a string? Yes.
      *   Leave out is a string? Yes.
      *   Do not explain the theory to the user? Yes.
      *   Address the specific misconceptions listed in the prompt? Yes.

  11. **Drafting the Content (Iterative refinement):**
      *   *Sequence:*
          1.  Baseline Valuation (5 mins) - Why do we care about anything now?
          2.  Doomsday Scenario (10 mins) - Define constraints.
          3.  Collective Afterlife Scenario (5 mins) - Define contrast.
          4.  Intuition Elicitation (5 mins) - Which do you prefer?
          5.  Diagnostic Elimination (15 mins) - Why? (Rule out self, loved ones, legacy).
          6.  Philosophical Upshot (10 mins) - Value depends on future humanity.
      *   *Carrying Example:* "Planting a slow-growing forest for future shelter."
          *   Must Have: Trees mature after planter dies.
          *   Must Lack: Signage crediting the planter.
      *   *Misconceptions:*
          *   Personal Immortality: Forms at start. Head off by clarifying "you are dead in both."
          *   About the Dead: Forms during intuition. Head off by asking "Who is suffering?" (No one).
          *   Legacy: Forms during diagnostic. Head off by stipulating anonymity.
          *   Environmentalism: Forms at upshot. Head off by distinguishing human projects from mere existence.
      *   *Check:* "If humanity continues but no one remembers your name, vs humanity ends but your statue remains forever—which matters more for your *current* motivation?"
      *   *Leave Out:* Religious salvation/heaven.

      *Wait, I need to make sure the "why_now" in sequence explains dependencies.*
      *   Step 1 must happen before Scenarios because we need to know what we are valuing.
      *   Step 2 & 3 must happen before Step 4 (Comparison).
      *   Step 5 must happen after Step 4 to explain the intuition.
      *   Step 6 is the conclusion.

      *Let's refine the Carrying Example to be more Scheffler-esque.* Scheffler often talks about "projects." Let's use "Writing a textbook."
      *   Case: Writing a textbook used by students 100 years from now.
      *   Must Have: The utility occurs entirely after the author's death.
      *   Must Lack: Royalties for heirs or name on the cover (anonymous).

      *Let's refine the Misconception Map to match the prompt's specific list.*
      1.  Personal Immortality.
      2.  Really about the dead.
      3.  Just environmentalism.
      4.  Reduces to "leaving a legacy".

      *Let's refine the Understanding Check.* It needs to test grasp of the *claim* (value depends on collective afterlife) vs feeling unsettled.
      *   Check: "Ask them to explain why the Doomsday scenario makes their *current* coffee-making or studying feel pointless, without referencing their own feelings of sadness."

      *Let's refine Leave Out.* "The metaphysical possibility of the scenarios." (Don't debate sci-fi plausibility). Or "Religious Afterlife." Religious afterlife is probably better because it's a distinct concept Scheffler is contrasting against.

      *Wait, one more check on constraints:* "Include a check I can run at the end that tells me they grasp the claim itself rather than just feeling unsettled."
      *   Okay, I need to make sure the check distinguishes between "This is sad" (emotion) and "This undermines value" (philosophical claim).

      *Let's finalize the JSON structure.*

      *Self-Correction on Sequence:* Make sure the "why_now" explicitly states the dependency.
      *   E.g., "Must establish baseline value before showing what threatens it."

      *Self-Correction on Misconceptions:* Ensure the "where_it_forms" is specific to the sequence steps.

      *Self-Correction on Carrying Example:* Ensure it's concrete. "Funding a hospital wing" is good. "Writing a paper" is good. Let's go with "Completing a scientific dataset."
      *   Case: Completing a climate dataset that won't be analyzed until 50 years after your death.
      *   Must Have: The data is useless without future analysts.
      *   Must Lack: Any citation of your name in the future analysis.

      *Okay, ready to generate JSON.*

      *Wait, one detail:* "the one concrete case to build it around and what that case must have and lack". I need to make sure this is integrated well. I will put it in the `carrying_example` field as requested.

      *Wait, another detail:* "name one thing I should openly refuse to address in this section."
      *   I'll choose "The metaphysical plausibility of the scenarios." This prevents students from getting stuck on "But how would Earth explode?" instead of the value question.

      *Wait, check the misconceptions again:* "I'm expecting at least: that the point is about personal immortality, that it's really about the dead, that it's just environmentalism, and that it reduces to 'leaving a legacy'". I need to include these in the map.

      *Final check on JSON validity.* No trailing commas, proper quotes.

