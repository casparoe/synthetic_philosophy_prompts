answer: |-
  ### The Compilation Target: Worlds as Heaps

  To translate this debate, we treat a **Possible World** as an isolated **Heap** or **Execution Context**.
  *   **Object:** An allocation in a heap.
  *   **Reference Identity (`is`):** Pointer equality. Two variables point to the same memory address within the same heap.
  *   **Structural Equality (`==`):** Value equality. Two distinct allocations contain equivalent data structures.
  *   **Haecceity:** A primitive, immutable Object ID (OID) or UUID intrinsic to the allocation, independent of its attributes.

  ---

  ### 1. The Kripkean View: Transworld Reference Identity

  **The Claim:** You are the same object in every world where you exist.
  **The PL Translation:** **Persistent Object Identity.**

  In Kripke's model, there is a universal Garbage Collector or a Global Object Registry. When we instantiate "You" in `Heap_W1` (Actual World) and `Heap_W2` (Counterfactual World), the runtime assigns the *same* OID to both allocations.

  *   **Identity:** `heap_w1.me is heap_w2.me` evaluates to `True`.
  *   **State:** The object's *properties* (attributes) may differ between heaps (in `W1` you are a programmer; in `W2` you are a baker), but the underlying reference is invariant.
  *   **Rigid Designation:** A variable name is a pointer that resolves to this specific OID across all heaps.
  *   **Interning:** Kripkeanism implies a form of **Transworld Interning**. Just as Python interns small integers to ensure `1 is 1` across scopes, Kripke interns *individuals* to ensure `Me is Me` across worlds.

  **The Edge Case:** Mutability. If I mutate `heap_w1.me.attribute`, does `heap_w2.me.attribute` change? Kripke says no. This implies that while the *identity* is shared, the *state vectors* are scoped to the heap. The OID is the rigid designator; the attributes are world-relative properties.

  ### 2. The Lewisian View: Counterpart Structural Similarity

  **The Claim:** You exist only in the actual world. In other worlds, there are distinct objects that resemble you.
  **The PL Translation:** **Deep Copy with Fuzzy Equality.**

  In Lewis's model, Heaps are strictly isolated. There is no Global Registry.
  *   **Identity:** `heap_w1.me is heap_w2.me` evaluates to `False`. Always.
  *   **Relation:** `heap_w1.me` has a **Counterpart** `heap_w2.me`. This is not `is`. It is a specialized `==` grounded in similarity metrics.
  *   **Many-to-Many:** One object in `W1` can have multiple counterparts in `W2` (e.g., a fork in the road where you took both paths). One object in `W2` can be the counterpart of multiple objects in `W1` (e.g., a merged timeline).
  *   **No Interning:** Lewis explicitly forbids transworld interning. To claim `is` holds across heaps is a category error.

  ---

  ### 3. Residue Report

  #### What Translates Cleanly
  1.  **The Reference/Value Split:** The core intuition maps perfectly. Kripke argues for Reference Identity (`is`) across scopes. Lewis argues for Structural Equality (`==`) across scopes.
  2.  **Isolation:** The concept of Worlds as isolated Heaps captures the intuition that causal interaction between worlds is impossible (no pointer dereferencing across heap boundaries).
  3.  **Mutability:** The distinction between changing an object's state (properties) versus changing the object itself (allocation) maps cleanly to attribute mutation vs. reassignment.

  #### What Translates with Distortion
  1.  **Transitivity (The Critical Failure):**
      *   **PL Constraint:** In almost all typed languages, structural equality (`==`) is an **Equivalence Relation**. It must be Reflexive, Symmetric, and **Transitive**. If `a == b` and `b == c`, then `a == c`. This is required for hashing, sets, and dictionary keys.
      *   **Lewis's Constraint:** The Counterpart relation is **Not Transitive**. $A$ in $W_1$ is sufficiently similar to $B$ in $W_2$. $B$ in $W_2$ is sufficiently similar to $C$ in $W_3$. But $A$ may not be sufficiently similar to $C$ to count as a counterpart.
      *   **The Distortion:** To model Lewis in PL, you cannot use `==`. You must implement a method `is_counterpart_of(other, context)` that returns a boolean based on a similarity threshold. This breaks the contract of value semantics. You cannot put Lewisian objects in a `HashSet` or use them as `dict` keys across worlds.
      *   **Diagnosis:** This is **not a defect of your vocabulary**. PLs *can* express non-transitive relations (e.g., `is_close_to()`). It is a sign that Lewis's relation is **not an identity relation** in the logical sense. It is a *similarity metric*. Lewis admits this: he replaces Identity with Similarity. The distortion arises only if you try to force his theory into the `==` operator. It belongs in a `similarity_score()` method.

  2.  **Haecceity vs. OID:**
      *   **PL:** An Object ID is assigned by the runtime (malloc/new). It is extrinsic to the data.
      *   **Kripke:** Haecceity is intrinsic. It is *what makes the object itself*.
      *   **The Distortion:** In PL, if you serialize an object to JSON and reload it in a new process, it gets a new OID. It is `==` but not `is`. Kripke claims it *should* be `is`. To model Kripke, you need a **Universal ID Generator** that persists across process boundaries (e.g., a cryptographic hash of the object's essence, or a metaphysical UUID). PLs treat identity as implementation-dependent; Kripke treats it as ontological.

  #### What Has No Expression (The Inexpressible Residue)
  1.  **Modality Itself:** PLs describe *actual* execution traces. They handle `if/else` (branching), but they do not natively model *unrealized* branches as first-class objects. A PL heap contains what *is*. Metaphysics concerns itself with the set of *all possible heaps*. The "space of worlds" is a meta-structure that standard PL runtimes do not allocate.
  2.  **Essential Properties:** Kripke distinguishes essential properties (must be true in all worlds) from accidental ones. PLs have no type-system feature that marks a field as `essential` (invariant across all serialization/context boundaries) vs `accidental` (mutable). You can enforce immutability (`final`/`const`), but not *transworld* invariance.
  3.  **The "Actual" Index:** In PL, the current heap is implicitly "Actual." There is no pointer to `CurrentWorld`. In metaphysics, the indexical "Actual" shifts depending on which world you are evaluating from. PLs lack a monad to shift the context of evaluation.

  ---

  ### 4. The Transitivity Verdict

  You asked whether the failure of transitivity in Lewis's theory is a defect of the PL vocabulary or a sign that Lewis's relation is less well-defined.

  **Verdict:** It is a sign that Lewis's relation is **categorically different from Identity**, and PL vocabulary exposes this precisely.

  In PL design, `==` implies **Substitutability**. If `a == b`, I can swap `a` for `b` in any function without changing behavior. Because Lewis's counterpart relation is non-transitive, it does not support substitutability. If $A$ is a counterpart of $B$, and $B$ of $C$, I cannot substitute $A$ for $C$ in a modal context.

  Therefore, Lewis is not defining "Identity" in the logical or computational sense. He is defining **Contextual Classification**.
  *   **Kripke** tries to preserve the `is` operator across worlds (Identity).
  *   **Lewis** replaces `is` with a fuzzy `match()` function (Similarity).

  The PL vocabulary does not fail here; it clarifies. By forcing us to distinguish between `is` (reference), `==` (equivalence), and `match()` (similarity), the PL framework reveals that Lewis abandoned Identity entirely. He didn't solve the problem of Transworld Identity; he dissolved it by changing the data type.

  ### 5. Final Verdict: The Missing Module

  Does the residue reveal something the modal-metaphysics debate is missing, or something the programming framework cannot say?

  **The Programming Framework is Missing a "Modal Monad."**

  The residue reveals that PLs are **Actualist**. They model a single, linear (or branching-but-pruned) execution trace. They cannot instantiate the *Set of All Possible Heaps* as a data structure.
  *   **Metaphysics** treats the space of worlds as a completed totality (Modal Realism or Abstract Actualism).
  *   **PLs** treat the heap as a mutable, singular state.

  However, the **Metaphysics Debate** is missing **Implementation Constraints**.
  The debate often treats Haecceity as a magical primitive. The PL perspective forces the question: *How is the OID generated?*
  *   If it's generated by properties (structural), it's Lewis (and loses transworld identity).
  *   If it's generated by a black-box allocator (Kripke), it's opaque.

  **Conclusion:** The residue shows that Kripke's Transworld Identity requires a **Global Namespace** that metaphysics assumes but cannot implement. Lewis's Counterpart Theory is more "distributed-system friendly" (no shared state, message passing via similarity), but it loses the guarantees of Reference Integrity.

  The debate is not about truth, but about **Architecture**:
  *   **Kripke** proposes a **Monolithic Database** with shared primary keys across shards (Worlds).
  *   **Lewis** proposes a **Federated Database** where records are linked by foreign keys based on content similarity.

  The PL vocabulary reveals that Kripke's view is computationally cheaper (pointer comparison) but ontologically expensive (requires a universal allocator). Lewis's view is ontologically cheaper (no universal allocator) but computationally expensive (requires $O(N)$ similarity scans with no transitivity optimization). The metaphysics debate is missing the **trade-off analysis**.
