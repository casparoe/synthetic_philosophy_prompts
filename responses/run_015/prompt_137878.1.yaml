      *   *Epistemic Strong (Identifiability/Sloppiness):* "Parameter space too vast/sloppy." -> Very relevant to systems biology (Sloppy Models). Supports "waste of money" for *predictive* purposes, but not necessarily for *understanding*.
      *   *Metaphysical (Strong Emergence):* "Higher-level facts not determined by lower-level." -> Controversial, likely false in physics/biology context. If true, supports anti-reductionism strongly.
      *   *Vocabulary/Causation (Multiple Realizability):* "Pattern visible only at high level." -> True. Supports high-level modeling, but doesn't invalidate low-level modeling (just makes it less general).
