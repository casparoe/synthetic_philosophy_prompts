answer: |-
  This is a classic philosophy of science dispute dressed in lab coats. You are fighting over **reductionism vs. emergentism**, but the stakes are pragmatic (grant money and modelling strategy). Your intuition is correct: your labmate is likely equivocation between a trivial truth and a substantive metaphysical claim to justify a pragmatic conclusion.

  Here is a menu of the precise claims hiding behind "the whole is more than the sum of its parts," tidied up and extended. I have evaluated each against your criteria: **(a) Truth Status**, **(b) Defensibility**, **(c) Support for Conclusion** (that mechanistic modelling is a waste of money), and **(d) Relevance to your specific example** (bistable cell populations).

  ### The Menu of Claims

  #### 1. The Mereological Claim (The "Boring" One)
  *   **Claim:** The whole possesses properties that no individual part possesses in isolation (e.g., a cell has a volume; a protein does not).
  *   **Status:** (a) Trivially True.
  *   **Defensibility:** (b) Indisputable.
  *   **Support for Conclusion:** (c) **None.** The fact that a property exists at level $N$ that doesn't exist at level $N-1$ does not imply the level $N$ property cannot be *explained* by the interactions of level $N-1$.
  *   **Relevance:** (d) Irrelevant. Bistability is a property of the network, not the individual molecules, but that doesn't stop the network from being made of molecules.

  #### 2. The Non-Linearity Claim (The "Interaction" One)
  *   **Claim:** The behaviour of the system is not a linear additive function of the behaviours of the parts. (i.e., "Sum" is taken literally).
  *   **Status:** (a) True.
  *   **Defensibility:** (b) Defensible. Biology is full of feedback loops, cooperativity, and thresholds.
  *   **Support for Conclusion:** (c) **Weak.** It implies you cannot simply add up parts, but it does not imply you cannot model the *interactions* mechanistically. In fact, systems biology *is* the modelling of these non-linear interactions.
  *   **Relevance:** (d) High. Bistability *requires* non-linearity (positive feedback). This supports mechanistic modelling, not opposes it.

  #### 3. The Epistemic Limit Claim ("Maths Runs Out")
  *   **Claim:** Even if the system is determined by its parts, the computational complexity or data requirements to derive the whole from the parts exceed human capacity (or grant budgets).
  *   **Status:** (a) Plausible/Contingent.
  *   **Defensibility:** (b) Defensible on pragmatic grounds.
  *   **Support for Conclusion:** (c) **Moderate.** It argues mechanistic modelling is a *bad investment*, not that it is *false*.
  *   **Relevance:** (d) Mixed. For a toggle switch (your example), the maths does *not* run out; it's solvable. For a whole organism, it might.

  #### 4. The Identifiability Claim (The "Sloppy Model" One)
  *   **Claim:** The mechanistic model has so many parameters that distinct parameter sets yield identical outputs (sloppiness). Therefore, the mechanistic details are underdetermined by data, and only coarse-grained parameters are identifiable.
  *   **Status:** (a) Substantively True (in many contexts).
  *   **Defensibility:** (b) Strongly defensible (see Gutenkunst et al., "Universally Sloppy Parameter Sensitivities...").
  *   **Support for Conclusion:** (c) **Strong.** If you cannot pin down the mechanism, building a detailed mechanistic model is scientifically hollow.
  *   **Relevance:** (d) High. This is the strongest systems biology argument against *detailed* mechanistic modelling. However, it argues for *simplified* mechanistic models, not necessarily against mechanism itself.

  #### 5. The Multiple Realizability Claim (The "Vocabulary" One)
  *   **Claim:** The high-level phenomenon (e.g., bistability) can be realised by wildly different low-level mechanisms. Therefore, the low-level description fails to capture the *generalisation*.
  *   **Status:** (a) True.
  *   **Defensibility:** (b) Defensible. A toggle switch can be built with repressors, activators, or phosphorylation cycles.
  *   **Support for Conclusion:** (c) **Moderate.** It suggests low-level models lack *generality*, not that they lack *truth*. It argues for top-down modelling if you want universality, but bottom-up if you want to engineer a specific cell.
  *   **Relevance:** (d) High. If you want to know why *cells generally* differentiate, look at the topology. If you want to know why *this* cell differentiates, look at the molecules.

  #### 6. The Contextuality Claim (The "Non-Separability" One)
  *   **Claim:** You cannot specify "the parts and their arrangement" independently of the whole, because the whole (e.g., cellular environment, metabolic state) constantly modifies the parts (e.g., via post-translational modification, crowding).
  *   **Status:** (a) Substantively True.
  *   **Defensibility:** (b) Defensible. Parts are not static Legos; they are dynamic entities shaped by the system.
  *   **Support for Conclusion:** (c) **Moderate.** It makes bottom-up modelling harder (you can't measure parts *in vitro* and plug them *in vivo*), but not impossible.
  *   **Relevance:** (d) High. This attacks the "boundary conditions" of your model.

  #### 7. The Strong Emergence Claim (The "Metaphysical" One)
  *   **Claim:** Even with a complete specification of all parts, interactions, and boundary conditions, the high-level behaviour is not logically entailed by the low-level facts. There are "brute" high-level laws.
  *   **Status:** (a) Likely False (in biology).
  *   **Defensibility:** (c) Incoherent in a physicalist framework. If the molecules move according to physics, the cell behaviour is determined.
  *   **Support for Conclusion:** (d) **Total.** If true, mechanistic modelling is indeed a category error.
  *   **Relevance:** (e) Low. Almost no working biologist actually believes this, though they talk like they do.

  ---

  ### The "Maths Runs Out" vs. "More Than Sum" Tension

  You asked if these are the same thought or opposite ones. **They are in tension.**

  *   **"Maths runs out"** is **Weak Emergence** (Epistemic). It says: "The mechanism exists, but it's too hard for us to calculate." This validates the *truth* of reductionism but questions its *utility*.
  *   **"More than sum"** (in the metaphysical sense) is **Strong Emergence** (Ontological). It says: "The mechanism does not exist; the higher level has independent causal power." This denies the *truth* of reductionism.

  Your labmate is likely using the plausibility of the first (yes, biology is complex) to smuggle in the implications of the second (therefore, don't bother looking for mechanisms).

  ### The Illegitimate Slide

  You suspected he is sliding between the **Boring Reading** and the **Metaphysical Reading**. Here is exactly where the slide happens and why it is illegitimate.

  **The Slide:**
  1.  **Premise 1 (True/Boring):** "Cells have properties proteins don't have (e.g., bistability)."
  2.  **Premise 2 (True/Epistemic):** "Calculating cell properties from protein properties is really hard/sloppy."
  3.  **Conclusion (False/Metaphysical):** "Therefore, cell properties are not constituted by protein properties."
  4.  **Pragmatic Leap:** "Therefore, modelling protein properties is a waste of money."

  **Why it is illegitimate:**
  He is committing the **Fallacy of Equivocation** on the word "Explain."
  *   In Premise 1 & 2, "Explain" means "Predict computationally."
  *   In the Conclusion, "Explain" means "Ontologically ground."

  Just because a derivation is computationally intractable (Premise 2) does not mean the higher-level fact is ontologically distinct (Conclusion).

  **To stop the slide:**
  Ask him: *"Do you believe that if a Laplace's Demon knew the position and state of every molecule in the cell, it could predict the cell fate? Or do you believe there is a 'cell-level force' that even the Demon couldn't see?"*
  *   If he says **Yes (Demon can predict):** He is a reductionist. He cannot claim mechanistic modelling is a *waste of money* in principle, only that it is *hard*. You can then argue about cost-benefit (Identifiability Claim).
  *   If he says **No (Demon cannot predict):** He is a Strong Emergentist. He is now outside of standard biology/physics. Ask him for a mechanism of how this "brute fact" interacts with the molecules without violating conservation of energy.

  ### The Real Argument (The "Effective Theory" Pivot)

  Your suspicion is correct: the slogan is often true, boring, and beside the point. The argument you *should* be having is about **Effective Theories**.

  In physics, we don't model fluid dynamics by tracking every water molecule. We use Navier-Stokes equations. These are "coarse-grained" models. They are *autonomous* from the molecular level (you don't need to know the mass of an H2O molecule to calculate turbulence), but they are *consistent* with it.

  **The Proposal for Lab Meeting:**
  Stop arguing about whether the whole is "more." Argue about **Universality Classes**.

  *   **Your Position:** "I am building a mechanistic model to understand *this specific system* and to engineer interventions." (Mechanistic/Interventional value).
  *   **His Position:** "We should build a phenomenological model to understand the *class of systems* this belongs to." (Generalisation value).

  **The Compromise:**
  Admit that for *prediction* in the face of parameter sloppiness, his coarse-grained approach might win (Identifiability Claim). But insist that for *intervention* (e.g., drug targets), you need the mechanism. You cannot target a "bistable attractor" with a small molecule; you target a kinase.

  **Summary for your Labmate:**
  "The whole is more than the sum of its parts' is true if you mean 'non-linear interactions create new properties.' It is false if you mean 'those properties aren't made of parts.' If you mean 'we can't calculate it,' then let's talk about parameter identifiability, not metaphysics. If you mean 'we shouldn't calculate it,' show me a coarse-grained model that suggests better drug targets than a mechanistic one."
