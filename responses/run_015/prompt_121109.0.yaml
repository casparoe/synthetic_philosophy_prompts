  A logician named Ray was stuck on the MU puzzle. He'd been at it for hours, staring at his chalkboard.

  He started with **MI**.
  He doubled it: **MII**.
  He doubled again: **MIIII**.
  He doubled again: **MIIIIIIII**.

  He applied Rule 3 (replace **III** with **U**): **MUUII**.
  He applied Rule 4 (drop **UU**): **MII**.

  He groaned. "I'm back to **MII**! I can't get rid of these last two **I**'s! Rule 3 requires *three* **I**'s to make a **U**, and Rule 4 only deletes **U**'s. The number of **I**'s is never divisible by 3. It's impossible!"

  Frustrated, Ray slammed his hand on the desk. A cloud of chalk dust puffed off the eraser, and a single speck landed on the board right next to the two **I**'s. It was a tiny, vertical white line.

  Ray stared at it. His brain, fried from hours of formal systems, didn't see "dust." It saw a symbol.

  He now had **M** followed by three vertical lines: **I**, **I**, and the dust speck.

  "Three **I**'s," Ray muttered.

  He picked up the eraser. He wiped away the three vertical lines (the two chalk **I**'s and the dust speck) and drew a single **U** in their place.

  The board now read: **MU**.

  Ray smiled. "Solved it."

  His friend walked in, looked at the board, and squinted. "Ray... that third 'I' is a piece of dust."

  Ray shrugged, tossing the chalk into the trash. "Rule 3 says 'Replace **III** with **U**.' It never specified the **I**'s had to be intentional."
