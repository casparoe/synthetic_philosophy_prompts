      *   *Evidence:* Muddy boots in the hall (known since 8 AM).
      *   *Hypothesis:* The Gardener came in from the rain (formulated at 10 AM).
      *   *Constraint:* Ensure students accept $P(Boots) = 1$ at the time of hypothesis formation.

