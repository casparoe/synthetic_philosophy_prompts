  6.  **Addressing Misconceptions in Flow:**
      *   (5) Overfitting: Bring this up when discussing *why* we might doubt accommodation. Distinguish "risk of overfitting" from "mathematical impossibility of confirmation."
      *   (2) New Calculation: Bring this up when trying to save the theory. Show why it changes the subject.
      *   (1) Ur-priors: The standard solution. Present it, then critique it.
      *   (3) Bayesianism False: The nuclear option. Keep it as a last resort/conclusion.
      *   (4) Historical Only: The Boots case solves this (it's immediate).

  7.  **Determining Exclusions:**
      *   Jeffrey Conditionalization (too technical).
      *   Counterfactual Ur-Priors (too metaphysical/speculative for 50 mins, just mention the intuition).
      *   Hypothetico-Deductivism (distracts from Bayesian focus).
      *   Specific formal solutions (Garber, etc.).

