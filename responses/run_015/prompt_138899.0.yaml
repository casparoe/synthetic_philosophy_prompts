      *   *Case:* Introduce the Muddy Boots scenario. Make sure they agree $E$ is certain ($P=1$).
      *   *The Crunch:* Apply the math. Show $P(H|E) = P(H)$.
      *   *The Intuition Clash:* Ask "Did the hypothesis explain the boots?" Yes. "Did the probability go up?" Math says no.
      *   *Misconception 5 (Overfitting):* Compsci kids will jump here. Need to address that accommodation *feels* like confirmation even if it risks overfitting. The problem isn't that it *shouldn't* confirm, it's that the math says it *doesn't*.
      *   *Misconception 2 (Calculation):* They might say "Learning the derivation is new." Need to block this to keep the puzzle sharp.
      *   *Misconception 1 (Ur-priors):* The standard fix. Explain it but note the cost (epistemic amnesia).
      *   *Insight:* Prediction vs. Accommodation. This is the philosophical moral.
      *   *Exit:* Check understanding.

  4.  **Refining the Case Study (Muddy Boots):**
      *   *Requirement:* (a) Known since childhood (or start of class), (b) Hypothesis not reverse-engineered, (c) No "new derivation" wiggle room.
