answer: |-
  ### Critical Preamble: The Coherence of "Standing"

  Before specifying the desiderata, a conceptual warning is necessary. The framing of your request assumes "standing to blame" is a unitary, stable normative property. This is a contested premise. In practice, "standing" often conflates three distinct normative questions:
  1.  **Authority:** Does the blamer have the right to demand accountability?
  2.  **Appropriateness:** Is the expression of blame fitting given the context?
  3.  **Efficacy:** Will the blame be heard or accepted?

  Hypocrisy functions as a stress-test because it severs the link between the *truth* of the accusation and the *authority* of the accuser. If a theory treats standing as purely epistemic (knowing the truth), hypocrisy becomes irrelevant. If it treats standing as purely moral (being good), standing becomes impossibly rare. An adequate theory must navigate between these poles without collapsing them.

  Below is the full specification of desiderata, categorized by phenomena, distinctions, and consistency conditions.

  ---

  ### I. Phenomenological Desiderata (Hard Cases)

  An adequate theory must predict the correct verdict (standing retained, lost, or diminished) for the following cases.

  **1. The Flawed Victim**
  *   **Case:** A victim blames her perpetrator for a harm, despite the victim having committed similar wrongs against others in the past.
  *   **Requirement:** The theory must preserve the victim's standing.
  *   **Status:** **Non-Negotiable.** Most intuitions hold that being wronged grants a normative status that is not automatically voided by one's own moral record.
  *   **Function:** Tests whether standing is grounded in *relationship/status* (victimhood) or *moral record* (purity).

  **2. The Identical-Fault Hypocrite (Third Party)**
  *   **Case:** A third party blames a wrongdoer for $X$, while the third party is currently guilty of $X$ (or unrepentant past $X$) against someone else.
  *   **Requirement:** The theory must explain the loss (or severe diminution) of standing.
  *   **Status:** **Non-Negotiable.** This is the core "tu quoque" intuition.
  *   **Function:** Tests the link between the blamer's conduct and their authority.

  **3. The Structural Beneficiary**
  *   **Case:** A blamer condemns a systemic wrong (e.g., exploitation) from which they benefit structurally, though they do not personally commit the specific acts they condemn.
  *   **Requirement:** The theory must account for the intuition that standing is compromised, even without direct personal commission of the act.
  *   **Status:** **Camp-Specific Preference.** Some theories treat this as complicity (loss of standing); others treat it as distinct from hypocrisy (standing retained but message complicated).
  *   **Function:** Tests whether standing requires *personal* innocence or *structural* disentanglement.

  **4. The Diminished vs. Cancelled Distinction**
  *   **Case:** A blamer has a minor, unrelated past fault vs. a major, identical current fault.
  *   **Requirement:** The theory must allow for standing to be *graduated* (weakened) rather than strictly binary (present/absent).
  *   **Status:** **Non-Negotiable.** Moral practice allows for "you have less right to say this" without reaching "you have no right."
  *   **Function:** Tests the granularity of the normative property.

  **5. Epistemic Blindness vs. Volitional Insincerity**
  *   **Case:** Blamer A doesn't know they share the fault (self-deceived); Blamer B knows they share the fault but blames anyway (cynical).
  *   **Requirement:** The theory should distinguish the normative defect. Insincerity usually attacks standing more aggressively than blindness.
  *   **Status:** **Non-Negotiable.** Intent and awareness matter to the *offense* of hypocrisy.
  *   **Function:** Tests whether standing is lost due to the *fact* of fault or the *attitude* toward the norm.

  **6. The Authorized Blamer**
  *   **Case:** A victim explicitly grants permission to a third party (who might otherwise lack standing due to flaws) to blame on their behalf.
  *   **Requirement:** The theory must explain how standing can be transferred or delegated.
  *   **Status:** **Non-Negotiable.** We routinely accept proxy blame (e.g., parents blaming on behalf of children, advocates blaming on behalf of the silenced).
  *   **Function:** Tests whether standing is an inherent property of the agent or a relational permission.

  ---

  ### II. Conceptual Distinctions to Preserve

  The theory must not collapse the following distinctions. Collapsing them leads to over-generation or under-generation of standing.

  **1. Forfeiture vs. Waiver/Transfer**
  *   **Distinction:** *Forfeiture* is losing standing due to the blamer's own conduct (hypocrisy). *Waiver/Transfer* is gaining/losing standing due to the target's or victim's normative power (forgiveness or authorization).
  *   **Requirement:** The theory must treat these as independent variables. A blamer can forfeit standing even if the victim waives the right to complain; a blamer can have standing even if the victim refuses to blame (third-party standing).
  *   **Status:** **Non-Negotiable.** Confusing these makes blame either purely subjective (victim's whim) or purely objective (blamer's record).

  **2. Identical Fault vs. Structurally Related Fault**
  *   **Distinction:** Hypocrisy regarding the *exact* same act vs. hypocrisy regarding a different act that violates the same underlying principle (e.g., condemning lying while secretly stealing).
  *   **Requirement:** The theory must explain why identical faults defeat standing more decisively than related faults.
  *   **Status:** **Non-Negotiable.** "Do as I say, not as I do" carries different weight depending on the proximity of the "do."

  **3. Moral Standing vs. Epistemic Entitlement**
  *   **Distinction:** Having the *authority* to hold someone accountable vs. having the *knowledge* that a wrong occurred.
  *   **Requirement:** The theory must allow that one can be epistemically correct but normatively silenced (the hypocrite knows the truth but lacks the standing to speak it).
  *   **Status:** **Non-Negotiable.** This is the definition of standing. If standing collapses into truth-tracking, the concept is redundant.

  **4. Performative Hypocrisy vs. Structural Complicity vs. Epistemic Blindness**
  *   **Distinction:**
      *   *Performative:* Saying one thing, doing another (insincerity).
      *   *Structural:* Benefiting from the system one condemns.
      *   *Epistemic:* Unaware of one's own violation.
  *   **Requirement:** The theory must differentiate the mechanism of standing-loss in each. Performative hypocrisy attacks sincerity; structural complicity attacks impartiality; blindness attacks competence.
  *   **Status:** **Camp-Specific Preference.** Some theories lump these all under "hypocrisy"; others argue only performative hypocrisy defeats standing.

  ---

  ### III. Consistency Conditions

  **1. Consistency with Moral Address Practices**
  *   **Requirement:** The theory must align with the pragmatics of moral conversation. If a theory says a blamer has standing, but in practice we would universally reject their blame as "out of bounds," the theory fails.
  *   **Status:** **Non-Negotiable.** Standing is a social-normative concept; it cannot be divorced from social practice.

  **2. Consistency with Moral Psychology**
  *   **Requirement:** The theory must accommodate the emotional resonance of blame. If a theory grants standing to a cold, calculating hypocrite but denies it to a passionate, flawed victim, it conflicts with our psychological uptake of blame.
  *   **Status:** **Non-Negotiable.** Blame is not just a verdict; it is an emotional engagement.

  **3. Non-Circularity of the "Norm"**
  *   **Requirement:** The theory cannot define the relevant norm for hypocrisy *using* standing. (e.g., "You lack standing to blame for X if you violate the norms you have standing to enforce.")
  *   **Status:** **Non-Negotiable.** Avoids definitional loops.

  ---

  ### IV. Flagging: Non-Negotiable vs. Camp-Specific

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Flawed Victim Retains Standing** | Non-Negotiable | Denying this makes victimhood contingent on sainthood, undermining the protective function of blame. |
  | **Identical-Fault Hypocrite Loses Standing** | Non-Negotiable | Core definition of the hypocrisy problem. |
  | **Standing is Gradable** | Non-Negotiable | Binary accounts fail to capture the nuance of "less appropriate" vs. "inappropriate." |
  | **Victim Authorization Transfers Standing** | Non-Negotiable | Denies the possibility of advocacy and proxy accountability. |
  | **Structural Beneficiary Loses Standing** | Camp-Specific | Debated. Some view this as political complicity, not standing-defeating hypocrisy. |
  | **Epistemic Blindness Defeats Standing** | Camp-Specific | Some argue negligence is enough; others require active insincerity. |
  | **Third-Party Standing requires Purity** | Camp-Specific | Relational accounts deny third parties have standing *unless* authorized, regardless of purity. |

  ---

  ### V. The Trilemma: Jointly Unsatisfiable Desiderata

  There is a subset of desiderata that appears jointly unsatisfiable without significant theoretical modification. This is the **Purity-Victim-Community Trilemma**:

  1.  **Universal Purity Condition:** To have standing, a blamer must not be guilty of the wrong they condemn (or relevantly similar wrongs).
  2.  **Victim Priority:** Victims retain standing to blame their perpetrators even if the victims are morally flawed.
  3.  **Third-Party Access:** Unaffiliated third parties retain standing to blame for public/moral wrongs.

  **The Conflict:**
  If (1) is strict, (2) is violated (flawed victims lose standing).
  If (1) is relaxed to save (2), it becomes difficult to explain why (1) applies to third parties at all. Why does the victim's flaw not defeat standing, but the third party's identical flaw does?
  If you distinguish them by saying "Victims have status-based standing, Third Parties have purity-based standing," you have fractured the concept of standing into two unrelated properties, violating the **Unitary Concept** implicit in the request.

  **Resolution:** Most successful theories reject (1) as a universal condition. They treat purity as a *defeater* for third parties but not for victims, or they treat standing as fundamentally relational (grounded in the victim-target dyad) rather than agent-relative (grounded in the blamer's record).

  ---

  ### VI. The "Killer" Constraint

  **The Single Requirement that Eliminates the Most Accounts:**
  **The Flawed Victim Constraint (Desideratum I.1).**

  *   **Why:** This is the primary failure point for **Comparative Moral Record Accounts** (Purity Theories). Any theory that grounds standing primarily in the moral cleanliness of the blamer cannot easily explain why a victim who has committed similar wrongs retains the right to blame their perpetrator.
  *   **Impact:** It forces theories to move away from "blamer-centric" metrics (How good is the blamer?) to "relationship-centric" metrics (What is the history between blamer and target?). It eliminates any account that treats standing as a reward for virtue.

  ---

  ### VII. Scoring the Main Families of View

  **1. Pure Relational / Victim-Waiver Accounts**
  *   *Core Idea:* Standing is derived from the normative relationship between victim and wrongdoer. Third parties only have standing if delegated by the victim.
  *   *Score:*
      *   **Flawed Victim:** Pass (Standing comes from harm, not record).
      *   **Hypocrite Third Party:** Pass (Standing is rare/delegated anyway).
      *   **Public Wrongs:** **Fail.** Struggles to explain why we can blame wrongs that have no specific victim (e.g., environmental destruction, treason).
      *   **Distinction (Forfeiture/Waiver):** Strong.
  *   *Verdict:* High internal consistency, low coverage of public morality.

  **2. Comparative Moral Record Accounts (Purity Theories)**
  *   *Core Idea:* Standing is a function of the blamer's moral standing relative to the target. One must be "cleaner" to blame.
  *   *Score:*
      *   **Flawed Victim:** **Fail.** Cannot explain why victims keep standing despite flaws.
      *   **Hypocrite Third Party:** Pass (Explains the intuition perfectly).
      *   **Gradability:** Pass (Degrees of purity = degrees of standing).
      *   **Public Wrongs:** Pass (Anyone pure enough can blame).
  *   *Verdict:* High intuitive appeal on hypocrisy, catastrophic failure on victimhood.

  **3. The "Irrelevance" / Truth-Only Accounts**
  *   *Core Idea:* Standing is not a distinct normative property. If the blame is true and the emotions fitting, the blamer's record is irrelevant. Hypocrisy is a separate vice, not a standing-defeater.
  *   *Score:*
      *   **Flawed Victim:** Pass.
      *   **Hypocrite Third Party:** **Fail.** Cannot explain the "tu quoque" intuition that the hypocrite is *silenced*, not just also blameworthy.
      *   **Consistency with Practice:** **Fail.** Contradicts the widespread practice of dismissing blame due to source.
  *   *Verdict:* Conceptually parsimonious, phenomenologically inaccurate.

  **4. Hybrid / Functional Accounts (The Emerging Consensus)**
  *   *Core Idea:* Standing serves a functional role (moral repair, communication). Hypocrisy defeats standing because it undermines the *function* (the message cannot be received as care/norm-affirmation if the blamer rejects the norm).
  *   *Score:*
      *   **Flawed Victim:** Pass (The function of victim blame is different from third-party policing).
      *   **Hypocrite Third Party:** Pass (Communication fails).
      *   **Structural Complicity:** Pass (Explains why benefit undermines the communicative function).
      *   **Complexity:** High. Risks becoming ad hoc.
  *   *Verdict:* Best fit for the full desiderata list, but theoretically demanding.

  ---

  ### VIII. Final Diagnosis of the Premise

  Is the framing confused? **Partially.**

  The request asks for a theory of "standing" as if it were a single switch. The analysis above reveals that "standing" is likely a **cluster concept** masking two different normative mechanisms:
  1.  **Jurisdiction:** Do you have the *right* to intervene? (Often relational/victim-based).
  2.  **Credibility:** Will your intervention *count* as moral address? (Often purity/sincerity-based).

  Hypocrisy primarily attacks **Credibility**, but we often speak of it as attacking **Jurisdiction**.
  *   If I am a hypocrite, do I lack the *right* to blame (Jurisdiction)? Or do I have the right, but my blame is *ineffective/infelicitous* (Credibility)?

  **The Stress-Test Result:** Treating hypocrisy as a structural stress-test reveals that "standing" is not a property of the *agent* but a property of the *interaction*.
  *   **Non-Negotiable Insight:** Any theory that locates standing solely in the blamer (their record, their status) will fail the Flawed Victim test.
  *   **Non-Negotiable Insight:** Any theory that locates standing solely in the target (their permission, their harm) will fail the Third-Party Hypocrite test.

  **Conclusion:** The only adequate theory must be **relational and functional**. It must posit that standing is the normative permission to engage in a specific communicative act of accountability, which is granted by victimhood but forfeited by conduct that renders the communication functionally inert (hypocrisy). If you insist on a unitary, agent-relative property of "standing," the desiderata are jointly unsatisfiable.
