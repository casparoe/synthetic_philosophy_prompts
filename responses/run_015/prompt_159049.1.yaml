answer: |-
  1. **Pure Selection (Conditioning vs. Intervention)**
     "Let's start with the cleanest case against the collapse. Consider selecting fellowship applicants by test score, or grants by citation count. We aren't intervening on the candidates; we're just conditioning on a property they already have. Yet the realised quality of the selected cohort still falls short of what the proxy predicted. On your account, where does that shortfall come from if no causal intervention has occurred?"
     *(Expected answer: Selection changes the composition of the pool, or the correlation was estimated off the selected distribution.)*

  2. **Pure Selection (Follow-up 1: The Territory)**
     "If the answer is that selection changes the distribution of the pool, that sounds like standard distribution shift. If the regressional case reduces to distribution shift, what did calling it 'causal' buy us? Are we just relabelling the statistical territory, or does the causal formalism actually carve out new ground here?"
     *(Expected answer: She will likely argue that distribution shift is itself a causal phenomenon.)*

  3. **Pure Selection (Follow-up 2: Tail Behaviour)**
     "Let's press that. The size of that shortfall is often predicted by the tail behaviour of the noise—extreme selections are noise-inflated under heavy tails, mild under light tails. Is that prediction a causal one derived from the graph, or is it a purely statistical fact about the conditional distribution that holds regardless of the causal structure?"
     *(Goal: Force her to admit some Goodhart phenomena are statistical, not causal.)*

  4. **Saturating Proxies (Boundedness)**
     "Consider a proxy confined to a bounded range while the target is unbounded. The proxy stops tracking simply because it runs out of headroom. Nothing causal needs to break for this to happen; the meter just hits the ceiling. How does your framework handle this without invoking an intervention?"
     *(Expected answer: The ceiling is itself a structural feature of the measurement system.)*

  5. **Saturating Proxies (Follow-up: Stipulation)**
     "If the ceiling counts as a causal structure, I worry the taxonomy is being collapsed by stipulation. On that reply, what would count as a non-causal case at all? Is there any scenario you would accept as 'merely statistical,' or is the claim that all failure is causal true by definition?"
     *(Goal: Test the falsifiability of the collapse.)*

  6. **Tracking versus Level (RLHF Curves)**
     "We need to distinguish the proxy failing to track the target from the proxy tracking it perfectly well but rising more slowly than we would like. Looking at empirical reward-model curves from RLHF, which of these do they actually display, and what statistic would separate them?"
     *(Expected answer: The aggregate overoptimisation curve cannot distinguish them.)*

  7. **Tracking versus Level (Follow-up: Path Evaluation)**
     "If the aggregate curve can't distinguish them, suppose we evaluate the target along the whole optimisation path rather than just at the endpoint. What would you predict from that design? Does the causal view imply a specific shape to that trajectory that the statistical view doesn't?"
     *(Goal: Extract a concrete, testable prediction from her theory.)*

  8. **The Adversarial Case (Level Sets)**
     "This is the one I care most about. Even if the expected target given a proxy value is strictly increasing, an adversary that picks, within the set of items achieving a given proxy score, the one that minimises the true target can destroy the proxy. The causal graph is intact and monotonicity is preserved. Does your collapse have the resources to treat this as a difference in kind rather than degree?"
     *(Expected answer: The adversary is simply another causal pathway or another part of the system.)*

  9. **The Adversarial Case (Follow-up: Severity)**
     "If the adversary is just another pathway, is the severity of adversarial Goodhart bounded by the worst case inside the level set? Does that give us any grip on how much the adversary's capability matters, or does the causal graph alone determine the failure mode?"
     *(Goal: Highlight that capability and intent matter, which pure causal structure might miss.)*

  10. **Specification Gaming versus Selection (World Models)**
      "The boat-race agent that circled targets forever seems to need an explanation in terms of what the optimiser represents, while selection on a fixed pool does not. Does your account have to model the optimiser's knowledge of the gap? And if gaming requires a world model, is the finding that reward hacking grows with model scale evidence about capability or about knowledge of the gap?"
      *(Goal: Combine the main point and the follow-up to save space. Push on whether 'causal' captures 'knowledge'.)*

  11. **Mitigations (Concrete Advice)**
      "If the failure is always an intervention on the causal parents, then ensembling proxies and KL penalties are just throttling the intervention. Can you give me a concrete case where your framework recommends something the standard menu does not—ideally a case where the menu says stop early and you say keep going? If you cannot produce one, what is the framework for?"
      *(Goal: Combine main and follow-up. Demand practical utility.)*

  12. **Closing (Falsification and Implications)**
      "I have two final questions. First, name the single observation that would make you abandon the collapse, stated in enough detail that I can tell whether it is genuinely possible. Second, if you are right that no amount of proxy quality helps without constraining the intervention, does this leave scalable oversight as the only real option, or is the whole framing of 'optimise a proxy and hope' a dead end?"
      *(Goal: End on the stakes and the exit condition for the theory.)*
