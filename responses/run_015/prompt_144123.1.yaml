answer: |-
  Here is the audit you asked for. I have broken your friend's summary down into its constituent propositions, tagged them according to how they stand in the current literature, and then addressed your deeper worries about content, consciousness, and the dark-room problem.

  ### Part 1: The Claim-by-Claim Audit

  I have grouped her sentences into distinct philosophical and technical claims. For each, I give a verdict and, where necessary, the "nearest true claim" she was reaching for.

  **1. "The brain is sealed inside a dark, silent skull and never touches the world, only its own neural activity, so everything you experience is a construction."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Audit:** This is the standard "interface" metaphor used to motivate PP. However, "never touches" risks sliding into idealism. The neurobiological claim is that the brain is causally coupled to the world only via transducers (sensory organs), not that it is ontologically sealed.
  *   **Nearest True Claim:** *The brain is causally isolated from distal environmental causes and interacts with them only via proximal sensory states.*

  **2. "The cortex runs a generative model of the causes of its input, sends predictions down the hierarchy, and receives back only what the predictions failed to anticipate..."**
  *   **Verdict:** **Accurate.**
  *   **Audit:** This is the core mechanistic posits of Hierarchical Predictive Processing. Top-down predictions meet bottom-up prediction errors.
  *   **Note:** Widely accepted within the framework, though the anatomical specifics (which layers send what) are still being refined.

  **3. "...weighted by how precise the prediction is — precision is just attention under a technical name."**
  *   **Verdict:** **Conflation.**
  *   **Audit:** She is running together a *computational parameter* (precision weighting of prediction error) with a *phenomenological/functional capacity* (attention). Precision weighting *implements* attention in the model, but saying they are "just" the same thing ignores the difference between the gain control mechanism and the cognitive phenomenon.
  *   **Nearest True Claim:** *In the PP framework, selective attention is modeled as the optimization of the gain (precision) assigned to prediction errors.*

  **4. "Perception is therefore controlled hallucination: the brain guesses first and lets the world edit."**
  *   **Verdict:** **Accurate (as slogan).**
  *   **Audit:** This is Anil Seth's and Andy Clark's standard tagline. It is rhetorically punchy but technically acceptable provided "hallucination" is understood as "inference from prior to posterior" rather than "false belief."

  **5. "Free energy is just the technical word for surprise..."**
  *   **Verdict:** **Wrong (Technical Error).**
  *   **Audit:** This is a common slip. Variational Free Energy is an *upper bound* on surprise (negative log model evidence). You minimize free energy *in order to* minimize surprise, because surprise is often intractable to calculate directly. They are not identical.
  *   **Nearest True Claim:** *Free energy is a tractable upper bound on surprise; minimizing it guarantees surprise does not increase.*

  **6. "...so the whole game is to keep surprise as low as possible, and there are exactly two ways to do that, namely change your predictions to fit the world, which we call perception, or change the world to fit your predictions, which we call action..."**
  *   **Verdict:** **Accurate.**
  *   **Audit:** This is the definition of Active Inference. Perception updates the model; action samples data to match the model's expectations.

  **7. "...that's active inference, and it's the same computation running in opposite directions, which is why perception and action turn out to be one phenomenon."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Audit:** Mathematically, both minimize the same functional (Free Energy). Mechanistically, they look very different (muscle contraction vs. synaptic weight change). Saying they are "one phenomenon" is a claim about computational unity, not mechanistic identity.

  **8. "The Bayesian part isn't a metaphor either — neurons literally encode probability distributions and apply Bayes' rule."**
  *   **Verdict:** **Contested (Inside the Literature).**
  *   **Audit:** This is the "Literal Bayesianism" vs. "As-If Bayesianism" debate. Many proponents (e.g., Friston) argue the brain *approximates* Bayesian inference (e.g., via sampling or variational methods) rather than literally calculating probabilities. Critics argue neurons encode parameters, not full distributions.
  *   **Nearest True Claim:** *Neural dynamics can be described as approximating Bayesian inference, though the neural code need not be explicitly probabilistic.*

  **9. "The deep result is that any system that manages to stay alive... must thereby minimize its free energy, and that isn't an empirical claim you could go out and refute; it follows from the system's having a Markov blanket..."**
  *   **Verdict:** **Contested (By Critics).**
  *   **Audit:** This is the strongest claim of the Free Energy Principle (FEP). Proponents say it's a mathematical necessary condition for existence. Critics (including many philosophers of biology) argue this makes the theory unfalsifiable or tautological (if you exist, you minimize F; if you don't minimize F, you don't exist).
  *   **Nearest True Claim:** *FEP proponents argue that self-organization implies a Markov blanket, which mathematically entails free energy minimization.*

  **10. "The real payoff is metaphysical: once you see that internal states are tracking the causes of their own sensory states, there's no leftover hard problem..."**
  *   **Verdict:** **Wrong (Overstatement).**
  *   **Audit:** PP explains *access consciousness* (reportability, integration) well. It does not explain *phenomenal consciousness* (why it feels like something). Proponents often claim the hard problem is a "pseudo-problem," but that is a philosophical stance, not a result of the math.
  *   **Nearest True Claim:** *PP offers a functional account of self-modeling that reframes the hard problem, but does not strictly dissolve it.*

  **11. "...what it is like to be you just is that inference, a thermostat is already doing a crude version of the same thing, and the only difference between it and you is how deep the inference goes."**
  *   **Verdict:** **Contested (Metaphysical Leap).**
  *   **Audit:** This leans toward panpsychism or functionalism. While FEP applies to thermostats, claiming they have "what it is like" is an extra step not licensed by the math alone.
  *   **Nearest True Claim:** *FEP applies to any self-organizing system with a Markov blanket, implying a continuity of structure between thermostats and brains.*

  **12. "...since minimizing free energy requires the model to be tight rather than true, the brain should be perfectly willing to confabulate, so most of what you consciously experience should be a useful fiction rather than an accurate picture."**
  *   **Verdict:** **Wrong (Conflation).**
  *   **Audit:** She is conflating "minimizing complexity" with "ignoring truth." Free Energy minimization trades off accuracy and complexity. A model that is too wrong generates high prediction error (high surprise), which increases Free Energy. You need accuracy to survive.
  *   **Nearest True Claim:** *The brain optimizes for adaptive utility, which balances accuracy with computational cost, sometimes tolerating systematic biases.*

  **13. (The Dark Room Reply) "...the organism's own model already encodes that it shouldn't be in a dark room, so of course it doesn't go there."**
  *   **Verdict:** **Accurate (Standard Reply).**
  *   **Audit:** This is the standard "Prior Preferences" response. The system has a prior that says "I am the kind of thing that eats and moves," so staying still violates that prior.

  ---

  ### Part 2: The Three Extra Conclusions

  You asked whether her three metaphysical conclusions follow from the corrected version of the summary.

  **1. "The Hard Problem Dissolves."**
  *   **Does it follow?** No.
  *   **Why:** The corrected summary shows PP is a theory of *information flow* and *error correction*. It explains how a system distinguishes self from world and integrates information. It does not explain why that process is accompanied by qualia. Even if perception is "controlled hallucination," the question remains: why is the hallucination *felt*? PP proponents often assert dissolution, but it is an added philosophical commitment (usually illusionism), not a mathematical consequence of Free Energy minimization.

  **2. "A Thermostat Has Beliefs (Differs Only in Degree)."**
  *   **Does it follow?** Only if you accept a purely functionalist definition of belief.
  *   **Why:** From a teleosemantics perspective (your home turf), this is where FEP struggles. A thermostat minimizes free energy relative to a set-point, but it lacks the evolutionary history and proper functions required for genuine content in your framework. FEP treats the thermostat and the brain as mathematically isomorphic. If you require *history* for content, the FEP claim that they differ "only in depth" is false; they differ in kind (biological vs. mechanical). The FEP math supports the continuity; your teleosemantics blocks it.

  **3. "The Framework Predicts Pervasive Confabulation."**
  *   **Does it follow?** No.
  *   **Why:** As noted in the audit, this relies on the error that Free Energy minimization ignores truth. It does not. It minimizes *surprise*. If the world is stable, a true model minimizes surprise best. Confabulation is only predicted in cases where a false model is computationally cheaper *and* doesn't lead to catastrophic prediction error (e.g., certain optical illusions or psychopathologies). It does not predict that *most* conscious experience is fiction.

  ---

  ### Part 3: The Content Worry (Teleosemantics vs. FEP)

  This is the deepest friction point between your background and the PP/FEP literature.

  **The Problem:**
  Your friend's summary treats "inference," "belief," and "prediction" as functional descriptors of state dynamics. If a state changes in a way that mathematically resembles Bayesian updating, the framework calls it a "belief update." From a teleosemantic view, this looks like the "intentional stance" gone wild. Does the machinery actually ground *aboutness*?

  **The Audit:**
  1.  **Is the talk honorific?** In strict FEP terms, yes, largely. The math works regardless of whether the states have semantic content. A thermostat minimizing free energy is mathematically identical to a brain doing so. The label "belief" is applied because the math is isomorphic to probabilistic inference.
  2.  **Does anything make a state *about* something?** Not within FEP alone. FEP is ahistorical. It describes what a system must do *now* to persist. It does not explain how the internal state came to *track* the external cause in a normatively robust way (i.e., how it can be *wrong* in a biological sense, not just a mathematical error sense).
  3.  **Does the Markov Blanket help?** No. The Markov blanket defines the *boundary* of the system (what is inside vs. outside). It ensures conditional independence between internal and external states given the blanket. It does not explain *reference*. It explains separation, not representation.
  4.  **Can they be combined?** Yes. Many philosophers (e.g., Klein, Colombo) suggest using Teleosemantics to ground the content *and* PP to explain the processing. You can say: "The content is fixed by evolutionary history (Teleosemantics), and the dynamics of that content are governed by Prediction Error Minimization (PP)." But you cannot derive the content *from* the Free Energy Principle alone.

  **Verdict:** If you accept her claim about Markov blankets, you get a definition of *selfhood* (boundary), but not a definition of *meaning*. The talk of inference is functional, not semantic, unless you import norms from outside the framework (like evolution).

  ---

  ### Part 4: The Dark Room Objection

  **Is her reply a dodge?**
  No, it is the **standard answer** within Active Inference. It is not a dodge, but it does shift the explanatory burden.

  **The Logic:**
  The "Dark Room" problem asks: If minimizing surprise is the goal, why not seek the most predictable state (sensory deprivation)?
  The Reply: Organisms have "Prior Preferences" (encoded in the model) that specify they should be in states like "fed," "moving," "socializing." Staying in a dark room violates these priors, generating high free energy. Therefore, the agent acts to avoid the dark room.

  **The Strongest Surviving Objection:**
  The objection that survives is not about the *logic* of the reply, but the **origin of the priors**.
  *   **Question:** Where do these "Prior Preferences" come from?
  *   **Critique:** If you say "Evolution," you have stepped outside the FEP math and imported teleology. If you say "The system learns them," you face a bootstrapping problem: how did it survive long enough to learn the prior that keeps it alive?
  *   **The Real Worry:** FEP explains how priors *constrain* action, but it relies on an external story (evolution/development) to explain why the priors are *adaptive* rather than suicidal. The framework itself is compatible with a system that has a prior preference for self-destruction (it would just die quickly). So, FEP explains persistence *given* adaptive priors, but doesn't fully explain the *selection* of adaptive priors without help from evolutionary theory.

  ---

  ### Part 5: Seminar Paper Advice

  You asked which claims you can safely repeat and which you should avoid.

  **Safe to Repeat (Consensus within PP/FEP):**
  1.  *"Perception involves the minimization of prediction error within a hierarchical generative model."* (This is the core cognitive claim, distinct from the metaphysical FEP claims).
  2.  *"Active Inference treats action and perception as dual strategies for minimizing the same quantity (variational free energy)."* (This accurately captures the computational symmetry without overclaiming mechanistic identity).
  3.  *"Precision weighting of prediction errors provides a computational account of attentional gain control."* (This is the specific, testable mechanism).

  **Do Not Repeat (The Trap):**
  *   *"Free Energy is identical to Surprise."*
      *   **Why:** As noted, Free Energy is an *upper bound* on surprise. Confusing them exposes you to technical criticism from anyone who knows the variational calculus.
      *   **Better phrasing:** *"Minimizing Free Energy minimizes an upper bound on surprise."*

  **Honorable Mention (Use with Caution):**
  *   *"The brain literally performs Bayesian inference."*
      *   **Why:** Many proponents now prefer "approximates" or "implements Bayesian principles" to avoid the claim that neurons are doing probability calculus. Use "approximates" to be safe.

  ### Summary for Your Argument

  Your friend is technically competent but metaphysically overconfident. She is treating a mathematical framework (FEP) as a complete ontology.
  *   **Where she is right:** The core mechanics of prediction, error, and active inference.
  *   **Where she is wrong:** The claim that this solves consciousness, the claim that Free Energy = Surprise, and the claim that the math alone guarantees truth-tracking (it guarantees persistence, which usually implies truth, but not always).
  *   **Your leverage point:** As a teleosemanticist, you can grant her the *processing* story (PP) while denying that the FEP math alone grounds *content*. The Markov blanket defines the *system*, but evolution defines the *meaning*.
