answer: |-
  This is a remarkably sharp application of philosophy of mind to professional epistemology. You have correctly identified that medical pedagogy is sitting on a metaphysical fence, using language that sounds like Jackson's Knowledge Argument ("you have to see it to know it") while operating on mechanisms that look like Lewis's Ability Hypothesis ("you have to do it to be able to do it").

  Here is a reconstruction of the epistemology, an analysis of what the practice strictly presupposes, a concrete redesign of training based on your view, and the conditions under which these conclusions should be overturned.

  ### 1. Reconstructing the Implicit Epistemology

  We can map the three positions you outlined onto specific epistemological frameworks regarding the nature of "clinical knowledge."

  **A. The Friend's View (Phenomenal Propositionalism)**
  *   **Core Claim:** Clinical competence requires *propositional knowledge of phenomenal facts*.
  *   **Epistemology:** There exist truths of the form "Murmur M sounds like *this*" where "*this*" refers to a qualia that cannot be referenced physically.
  *   **Role of Rotations:** Rotations are data-gathering missions for non-physical facts. You are incomplete until your mental database contains the phenomenal token.
  *   **Metaphysical Commitment:** Property Dualism or Non-Reductive Physicalism. Physical descriptions are inherently incomplete.

  **B. Your View (The Ability/Competence Hypothesis)**
  *   **Core Claim:** Clinical competence is *procedural knowledge and pattern recognition*.
  *   **Epistemology:** "Knowing what a murmur sounds like" is shorthand for "possessing the neural architecture to discriminate murmur M from noise N." Text provides the map; rotations build the terrain-mapping machinery.
  *   **Role of Rotations:** Rotations are calibration of the sensory-motor loop. They build the "similarity space" you mentioned, allowing for generalization across variable contexts (stethoscope quality, ambient noise, body habitus).
  *   **Metaphysical Commitment:** Physicalism/Functionalism. The brain is a classifier; experience is training data.

  **C. The TA's View (Metacognitive Calibration)**
  *   **Core Claim:** Clinical competence is *knowledge of uncertainty*.
  *   **Epistemology:** The gap isn't in the data, but in the agent's confidence intervals. Text gives you the ideal case; rotations show you the messy cases where the rules break.
  *   **Role of Rotations:** Learning the boundaries of your own ignorance. It is purely epistemic humility.
  *   **Metaphysical Commitment:** Compatible with both A and B, but focuses on the *status* of the belief rather than the *content*.

  ### 2. Presupposition vs. Fit: What Does Practice Actually Require?

  Does the hands-on requirement *presuppose* the Friend's view (Phenomenal Facts)? **No.**

  The practice fits the Friend's view *narratively* (it feels like we are handing over a secret experience), but it is fully licensed by your view (Ability/Physicalism). Here is the separation:

  **What the Practice Strictly Presupposes:**
  1.  **Bandwidth:** Text is low-bandwidth; sensory experience is high-bandwidth. A description of a rash is lossy compression; seeing the rash is raw data.
  2.  **Multimodal Integration:** Diagnosis often requires binding sight, sound, touch, and smell simultaneously. Text serializes this; experience parallelizes it.
  3.  **Feedback Loops:** To learn a skill, you need error correction. Reading about a lumbar puncture gives no feedback on resistance; doing one provides haptic feedback that updates the motor model.

  **What the Practice Merely "Fits Well With" (but doesn't need):**
  1.  **Ineffability:** The idea that the experience *cannot* be described is a linguistic limitation, not necessarily an ontological one.
  2.  **Phenomenal Facts:** You do not need to posit a non-physical "fact" to explain why text is insufficient. You only need to posit that the brain's classification weights are updated by sensory input, not by semantic input.

  **On Consistency:**
  You asked if the institutions are consistent given they use text/AI elsewhere. They are consistent if we distinguish between **Algorithmic Tasks** and **Heuristic Tasks**.
  *   **Text/Protocols:** Used for algorithmic decision trees (e.g., "If BP < 90, give fluid"). These are rule-based and don't require sensory discrimination.
  *   **Rotations:** Used for heuristic pattern recognition (e.g., "This patient looks sick"). This requires high-dimensional sensory processing.
  *   **AI/Diagnostics:** These are attempts to turn Heuristic Tasks into Algorithmic ones. If an AI can diagnose a rash from a photo better than a human, it proves the "phenomenal fact" wasn't necessary for the diagnosis, only the *information* contained in the image.

  The inconsistency arises only if they claim text is *insufficient* because of "experience" but then trust an AI that has *no* experience. However, a physicalist resolves this easily: The AI has processed more "sensory" data (images) than the human student. The student needs rotations to get their data count up. The AI already has its rotations in the training set.

  ### 3. The Concrete Redesign: If We Take Your View Seriously

  If we accept the Ability Hypothesis and reject the Knowledge Argument (i.e., we assume there are no magical phenomenal facts, only training data and neural weights), medical training changes significantly. We move from **Time-Based** to **Competency-Based** training.

  **What You Get Rid Of:**
  1.  **The "Rite of Passage" Mystique:** You stop telling students, "You haven't *really* seen it until you've smelled it." You replace this with, "You haven't *classified* it accurately enough yet."
  2.  **Mandatory Patient Exposure (where unnecessary):** If high-fidelity VR/AR can replicate the haptic feedback of a pulse or the auditory profile of a murmur with 99% fidelity, live patients are no longer required for *sensory* training. You keep patients for *social* training, but not for learning what a heart failure sounds like.
  3.  **Procedure Counts:** "Log 50 lumbar punctures" is a proxy for competence. If a student demonstrates perfect technique and success on the 10th try using simulation, the remaining 40 are wasted risk to patients.
  4.  **The "Bedside Manner" Ineffability:** You treat empathy not as a soulful connection but as a communicative skill set that can be drilled, scripted, and measured.

  **What You Keep (for non-consciousness reasons):**
  1.  **Supervised Practice:** Not because the student needs "the experience," but because they need *error correction*. A simulator might not tell you that you're being too rough; a supervising physician will.
  2.  **Stress Inoculation:** You keep live rotations because making a mistake on a real person induces a physiological stress response (cortisol, tremor) that simulations rarely match. You need to train the *ability to function under adrenaline*, which is a physiological state, not a phenomenal fact.
  3.  **Longitudinal Care:** You keep follow-up requirements not to learn "what recovery feels like," but to learn *causal feedback*. Did the treatment work? Textbooks give population averages; rotations give individual causal data.

  ### 4. What Would Change My Mind?

  To be philosophically rigorous, I must specify the evidence that would shift the probability toward your friend's view (that there *are* irreducible phenomenal facts required for medicine).

  **Evidence That Would Support the Friend (Knowledge Argument):**
  1.  **The "Qualia Transfer" Failure:** If we create a perfect physical duplicate of a patient interaction (including all haptic, auditory, and visual data) delivered via a brain-computer interface, and students trained this way consistently fail to diagnose conditions that students trained with "live" consciousness can detect, *and* this gap cannot be explained by bandwidth or latency. This would suggest the "consciousness of the patient" or the "consciousness of the observer" adds a non-physical variable to the diagnostic equation.
  2.  **Causal Efficacy of Qualia:** If it were demonstrated that a physician's *subjective feeling* of empathy (distinct from their behavioral output) directly alters patient physiological outcomes (e.g., wound healing rates) in a way that behavioral mimicry cannot replicate. This would imply the phenomenal state itself has causal power, validating the need for the "real experience."

  **Evidence That Would Support Me (Ability Hypothesis):**
  1.  **The "Matrix" Medical School:** If a cohort of students trained entirely in hyper-realistic VR (zero live patient contact) achieves equal or superior diagnostic and procedural outcomes compared to traditional cohorts. This would prove the "experience" was just data processing, not phenomenal acquaintance.
  2.  **AI Superiority:** If diagnostic AI (which has no phenomenal experience) consistently outperforms human clinicians in sensory tasks (radiology, dermatology, auscultation), it demonstrates that the "what it is like" is not a necessary condition for the knowledge.

  ### 5. Where My Reasoning Is Most Likely to Go Wrong

  I need to highlight two vulnerabilities in the Ability/Physicalist position I've advocated for you:

  **1. The "Social Reality" Blind Spot:**
  Medicine is not just fixing machines; it is a social contract. Patients consent to be treated by *humans*. Even if a robot could suture better, the *healing* process often relies on the patient's belief that they are being cared for by a sentient being. If "care" requires a conscious caregiver, then the training *must* involve the cultivation of that consciousness, not just the ability to mimic it. My redesign risks turning doctors into highly skilled technicians who fail the social function of the role.

  **2. The Tacit Knowledge Trap:**
  Michael Polanyi argued, "We know more than we can tell." The Ability Hypothesis assumes we can eventually codify the abilities or train them via simulation. However, some aspects of clinical intuition may rely on subconscious processing of environmental cues we don't even know we are perceiving (e.g., pheromones of fear, micro-expressions). If these cues are impossible to replicate in simulation, then "live" experience is necessary, not because of *phenomenal facts*, but because of *informational richness* that we cannot currently digitize. My argument assumes technology can eventually match reality; if it can't, the "hands-on" requirement stands, even on physicalist grounds.

  ### Summary Verdict
  Your friend is conflating **epistemic access** with **ontological novelty**. Rotations are required because the brain learns via sensory-weight adjustment, not semantic ingestion. This is a fact about neural hardware, not a proof of dualism. The medical system is consistent so long as it views rotations as **high-bandwidth data acquisition** rather than **phenomenal initiation**.

  If you want to win the argument, don't argue that experience doesn't matter. Argue that *what experience does* is mechanical (calibration, data entry, stress testing), not magical (acquiring new facts). The moment you can simulate the mechanism, the requirement for "reality" vanishes. Until then, the "hands-on" rule is a placeholder for "high-fidelity input," not a testament to the irreducibility of qualia.
