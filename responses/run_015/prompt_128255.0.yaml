  silence becomes our only language.

  Babble invents a wild new language,
  ignoring every grown-up rule.
  The dragons agree to play nice,
  the living room carpet is the board,
  there is no score to keep, no win,
  just don't move from the cardboard castle.

  A procedural move stalls the vote,
  twisted stats become the language,
  each side desperate to win,
  invoking the rule of law,
  while the public watches the board,
  tired of the dirty play.

  Counting beans lets numbers play,
  no need to move the sum,
  no edges on this board,
  math claims a universal language,
  yet one plus one is just a rule,
  where no one gets to win.

  No one really wins against the mile,
  tools play tricks on the eye,
  a flexible rule bends,
  let the tape move,
  fractions are a rough language,
  pinned to the drafting board.

  Departures flash on the board,
  arriving late means you win nothing,
  gestures replace broken language,
  turn left, don't play dumb,
  let the crowd move,
  follow the traffic rule.

  From chess board to where you win,
  through every language that we play,
