prompt: |-
  hey — i'm a novelist working on something about a closed commune where cooperation breaks down once people realize no one's watching, and i've been going down a rabbit hole with the prisoner's dilema. i need a short research proposal, maybe 800 words for a workshop pitch, on this angle: in the iterated prisoner's dilema, the shadow of the future is usually just a discount factor, but what if it's actually doing epistimic work? like, players aren't only weighing payoffs, they're building a shared narrative about who they are across rounds. the core question is whether cooperation evolves differently if we treat the agent in round two as a reconstructed memory rather than the same self. why this isn't answered already: all the standard evolutionary-game-theory accounts — tit-for-tat, evolutionary stable strategies, axelrod's tournaments — assume personal-identity continuity without arguing for it, and if that collapses, the explanation might need to shift to institutional or narrative continuity rather than individual rationality. the proposal should state the exact question, explain why existing answers leave it open, propose an approach that combines conceptual analysis of identity-over-time with game-theoretic framing (no new empirical data needed), say what a result looks like — either that identity continuity is ineliminable or that narrative substitutes can do the same work — and give an honest assessment of whether it's too big for a semester. please write it in continuous prose, no headings, bullet points, bold, or tables, just like an email or letter. also, say what argument or finding would change your mind about the project's tractability, and point out where your own reasoning here is most likely to fail.
