      Dear Workshop Convenors, I am submitting this proposal to explore a theoretical gap in the Iterated Prisoner's Dilemma that emerged during my research for a novel about social collapse. While fiction often dramatizes the breakdown of trust, the underlying mechanics of cooperation rely on assumptions about the self that game theory rarely interrogates. In standard models, the shadow of the future is treated as a discount factor, a mathematical weight assigned to future payoffs that incentivizes present cooperation. My project asks whether this shadow performs essential epistemic work by sustaining a shared narrative of identity across rounds. The core question is whether cooperation evolves differently if we treat the agent in round two as a reconstructed memory rather than the numerically same self. If the player is not a persistent entity but a series of temporal slices linked only by story, the rational calculus changes from maximizing long-term utility to maintaining a coherent character arc.

      Existing literature leaves this open because standard evolutionary game theory accounts, from Axelrod's tournaments to modern evolutionary stable strategies, assume personal-identity continuity without arguing for it. They presuppose that the agent defecting in round one is the same entity punished in round ten. This assumption allows the discount factor to do all the heavy lifting. However, if identity is fragile or constructed socially, the discount factor might not capture the true cost of defection. The cost isn't just lost future points but the fragmentation of the self-narrative required to sustain cooperation. If that continuity collapses, the explanation for cooperation might need to shift from individual rationality to institutional or narrative continuity. Current models do not account for the possibility that players cooperate not because they expect to meet again, but because cooperating is the only way to remain the same person who entered the game.

      To investigate this, I propose an approach that combines conceptual analysis of identity over time with game-theoretic framing. No new empirical data is needed because the issue is structural and philosophical rather than behavioral. I will model the agent not as a fixed utility maximizer but as a narrative construct subject to memory constraints and reinterpretation. The analysis will involve modifying the standard payoff matrix to include a cost for identity fragmentation. A successful result will look like one of two findings. Either I will demonstrate that identity continuity is ineliminable, meaning cooperation logically requires a metaphysical commitment to a persistent self, or I will show that narrative substitutes can do the same work, allowing cooperation to persist even when agents view their future selves as strangers bound only by shared story. This distinction matters for understanding how communes or states survive when surveillance fails.

      Regarding scope, I must offer an honest assessment of whether this is too big for a semester. There is a significant risk that the philosophical dimensions of personal identity will overwhelm the game-theoretic application. The literature on psychological continuity is vast, and integrating it with payoff matrices requires careful boundary setting. I believe the project is tractable only if I restrict the analysis to the functional role of identity rather than its metaphysical truth. An argument or finding that would change my mind about the project's tractability would be if formal modeling demonstrates that narrative variables inevitably collapse into standard discount factors. If every narrative constraint can be mathematically reduced to a change in the discount rate, then the philosophical distinction is merely semantic, and the project loses its theoretical teeth. In that case, the shadow of the future is purely quantitative, and my qualitative distinction is untenable.

      Finally, I must point out where my own reasoning here is most likely to fail. I am likely conflating psychological continuity with game-theoretic strategy. Just because a player feels like a different person does not mean their strategy set changes in a way that alters the equilibrium. Players might act as if they are continuous even if they philosophically believe they are not, provided the incentives remain aligned. My reasoning assumes that ontological uncertainty translates directly into strategic uncertainty, which may not hold if institutional penalties enforce continuity regardless of self-perception. I risk attributing too much causal power to internal narrative states when external payoff structures usually dictate behavior. Despite this risk, I believe the intersection of narrative identity and cooperation offers a novel lens for both theorists and writers exploring the fragility of social contracts. Thank you for considering this proposal.

