      *   For (1) vs (4): (1) has to soften. You can't say consensus *never* excuses if you rely on epistemic access which is often determined by consensus. Cost: You lose the rhetorical punch of "no excuses for powerful people."
      *   For (6) vs (9): (6) needs nuance. You can judge the *life* holistically without ignoring the *intentions* as part of that whole. Cost: Complexity in verdict delivery.

