answer: |-
  A data brokerage firm sells citizen location tracks to foreign surveillance units. Internal compliance protocol requires two analysts to mark files "Export-Cleared" to establish accountability, though the software uses an OR-gate: if *either* analyst clears it, the transfer executes immediately. Analyst A has already cleared the batch; the transfer is irreversible and the surveillance occurs regardless of your input. You are Analyst B. You also mark "Export-Cleared." The transfer occurs exactly as it would have if you refused, making your causal impact on the surveillance harm literally zero. However, the permanent audit log lists the action as "Cleared by Joint Authorization," and your digital signature structurally constitutes you as a co-endorser of the transfer's legitimacy within the firm's official record, embedding your agency into the harmful practice itself rather than merely its outcome.

  **Verdicts and Split:** The pure inefficacy view judges the act permissible because the outcome (surveillance) is fixed; your choice changes no state of affairs in the world. The participatory view judges it wrong because you have made yourself a co-author of the harmful practice; by signing, you instantiate the joint intention required for the firm's wrongful act, regardless of causal necessity. They split because the inefficacy view tracks *causal consequence*, while the participatory view tracks *constitutive involvement*.

  **Key Feature:** The work is done by the **constitutive co-authorship structure** (the audit log). If you strip this away—leaving only a button that triggers nothing—you collapse back into the standard "my vote doesn't matter" example where there is no structural role to occupy, only a causal lever that fails to move.

  **The Attack:** A defender of the inefficacy view will argue this is **cryptic consequentialism**. They will claim you only care about the audit log because you expect it to have downstream effects (e.g., normalizing the practice, affecting future liability, or shaping corporate culture). If the log were truly inert—read by no one, influencing nothing—they would argue your "complicity" is metaphysical superstition, smuggling in expected-outcome reasoning under the guise of "participation."
