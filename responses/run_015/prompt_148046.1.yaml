  8.  **Final Polish:** (Writing the actual response based on these thoughts). *Ensure the transition from science to philosophy feels natural, not forced.* *Make sure the tribute to the TRC/CONADEP/Gacaca workers is respectful.*

  *(Self-Correction during final writing)*: I need to make sure I don't sound like I'm accusing the witnesses of lying. It's about the *structure* of the incentive, not the honesty of the individual. I will clarify that distinction.

  9.  **Final Word Count Check:** A 5-minute speech is usually 600-800 words. I will aim for that range.

