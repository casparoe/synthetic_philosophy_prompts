      *   *Closing:* Our job this week isn't to fix the bias, but to understand its shape.

  6.  **Polishing and Timing:**
      *   *Self-Correction during drafting:* Make sure I don't sound cold. The "measurement error" analogy could sound dehumanizing if not handled carefully. Must emphasize that human stories are inside the data.
      *   *Refining the "Bias" explanation:* Instead of "bias," maybe use "tilt" or "shadow." Let's stick to the "instrument" metaphor since I'm a scientist. The instrument is the process of amnesty itself.
      *   *Addressing the "Moral Books":* Explicitly state that forgiveness doesn't equal balance.
      *   *Addressing the "Archive":* It's not a library of everything; it's a garden pruned by a specific hand.

  7.  **Final Review against Constraints:**
