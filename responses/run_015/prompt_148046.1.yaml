answer: |-
  Good morning. It is a privilege to welcome you to "After the Report."

  Looking around this room, I see a divide that I find deeply comforting. On one side, we have those who have lived the work of transitional justice. You have handled the files of CONADEP, sat through the testimonies of the TRC, or listened to the voices of the Gacaca courts. You know the weight of these words in the gut. On the other side, we have teachers, family members, and neighbors who care about what these words mean for our future.

  And then there is me. I spent forty years in a lab, measuring forces between molecules. I retired and traded my microscope for books on ethics. I mention this because scientists are trained to be suspicious of their own instruments. We know that no measurement is perfect. But we also know that not all errors are the same.

  In physics, there is random noise—the static that makes a signal fuzzy. You can average that out. But then there is systematic error. This happens when the instrument itself is tilted. If your ruler expands in the heat, every single measurement you take will be too short. It isn't random. It is a directed drift. It looks like data, but it carries a hidden shape.

  I want to suggest that we treat the archives of truth and reconciliation with this same suspicion. Not to diminish them, but to read them accurately.

  When a commission offers amnesty in exchange for testimony, it creates a powerful incentive. It is not a bribe, necessarily, but it is a condition. It says: "You may speak, provided that your speech keeps you safe."

  This means the archive we are studying is not a random sample of history. It is a collection of truths that were survivable for the perpetrator to tell. It is a map drawn by those who needed to navigate a path between conviction and absolution.

  This introduces a specific kind of distortion. It is not that the witnesses are lying. It is that the *range* of what can be told is narrowed by the promise of impunity. We are missing the confessions that were too dangerous to admit, even with amnesty. We are missing the orders that came from mouths that never had to speak.

  If we treat these reports as a complete record, we commit a scientific error. We are calibrating our moral understanding against a ruler that has expanded in the heat.

  However, and this is crucial: recognizing this drift does not mean we throw away the ruler.

  The testimony we have is still real. The pain described is still actual. The facts that *were* admitted are often devastating enough to shatter denial. To point out the bias is not to dismiss the suffering. It is simply to acknowledge that the archive is not a mirror of the past; it is a prism. It bends the light in a specific direction.

  This brings us to the tension we must hold this week.

  We cannot claim that forgiveness balances the moral books. Amnesty is a legal transaction; justice is a human horizon. They are not the same currency. If we say the report is "the truth," we risk silencing the victims whose abusers remained silent because the truth would have cost them too much.

  But nor can we say that nothing was learned. The light that passed through the prism still illuminates the room. We know more than we did before. We have names. We have dates. We have admissions that were once impossible.

  So, what is our task here?

  It is to read the reports with our eyes open to the shape of the silence. When we look at the data from Argentina, or South Africa, or Rwanda, we must ask not only "What is written here?" but "What does the structure of this agreement make invisible?"

  We are not here to fix the error. We cannot go back and recalibrate the instrument. The past is fixed. But we can correct our interpretation. We can understand that the truth we hold is partial, conditioned, and human.

  For the practitioners in the room: you know better than anyone that the work never ends with the final signature. For the community members: your role is to hold this history without letting it harden into myth.

  Let us spend these days honoring the courage of those who spoke, while remaining honest about the constraints under which they spoke. Let us accept that our knowledge of the past is imperfect, without surrendering our demand for justice in the present.

  Thank you.
