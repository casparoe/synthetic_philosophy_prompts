  hey, I need help sorting out a work thing thats been eating at me. I'm running a small import project in a country where I've lived for about two years, and my local partner keeps taking ministry clerks to these long dinners and giving them envelopes with cash—he calls it "tea money" and insists it's not a bribe, just the local version of maintaining a relationship. He says back home we'd just pay a lawyer eight hundred bucks an hour to push paper through, so this is actually cheaper and more personal. My companys ethics code bans "improper gifts" but never defines them, and my boss in the US treats any cash to officials as automatic corruption. The tricky part is that if I stop, the clerks stall our permits and the local vendors who depend on our delievery schedules get hurt—not the clerks themselves. I can't tell if I'm being a rigid Western moralist, or if there's a real difference between this and hiring a fixer that I'm just not seeing. What's actually wrong with it, if anything—especially since refusing hurts people who aren't the ones taking the money? Please write the answer in American English, and try to get at the actual philosophical structure rather than just saying "when in Rome."
