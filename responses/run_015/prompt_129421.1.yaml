answer: |-
  ### The Ruling on Major Vey

  **Verdict:** Convicted.
  **Sentence:** Five years' imprisonment.

  **The Logic of Consistency**
  To remain consistent with your six prior rulings, the bench cannot acquit Vey without dismantling *Kel* (Manufacturer) and *Aurev* (Chancellor). *Kel* established that supplying the instrument of death with knowledge of its use is a crime, regardless of whether the defendant pulled the trigger. Vey did not just build the oven; he filled it. To acquit him based on the *Tell* precedent (victors' equivalence) would require the Sene judge to admit their blockade was criminal, which they have refused to do.

  Therefore, the bench must distinguish Vey's transports from the Sene blockade. The distinction lies in **intent and specificity**. The blockade was a strategic measure against a territory (collateral starvation); Vey's transports were administrative measures against specific persons (direct extermination). This allows the Sene judge to vote "Guilty" without contradicting their stance on the blockade.

  The sentence sits between *Baas* (3 years) and *Kel* (7 years).
  *   **Higher than Baas:** Baas had no reasonable exit; Vey did (the transfer request). *Baas* established that moral choice scales culpability. Vey chose to stay.
  *   **Lower than Kel:** Kel facilitated without mitigation. Vey actively saved 4,000 lives at personal risk. This is not a defence, but it is a mitigating factor in sentencing, acknowledging that his hand was not entirely closed.

  **The Conflicting Rules**
  By convicting Vey, you are committing the tribunal to **The Aurev/Kel Principle**: *Knowing participation in a system of atrocity is criminal regardless of domestic legality or the equivalent conduct of victors, provided the defendant had some moral choice.*

  You are explicitly subordinating **The Tell Principle**: *No rule for the vanquished that is not applied to the victors.*
  The tribunal is effectively ruling that there is a floor of human conduct (deportation to death) below which "victors' equivalence" cannot excuse the vanquished. This creates a fracture line: if the victors *did* cross that floor (e.g., if Varenne also deported minorities), the tribunal's legitimacy collapses.

  **The Sentence:**
  Five years. It punishes the failure to exit (distinguishing him from Baas) but rewards the mitigation (distinguishing him from Kel). It signals that "doing some good while doing great evil" reduces the penalty but does not erase the guilt.

  ***

  ### The Case That Breaks the Rules
  If you want a lawyer on the page to expose the fragility of this logic, the next case should be **Admiral Hock, Commander of the Defeated Navy's Submarine Fleet.**

  **The Charge:** Unrestricted submarine warfare (sinking merchant vessels without warning, resulting in civilian sailor deaths).
  **The Conflict:**
  *   **Under *Tell*:** Varenne's own navy conducted unrestricted submarine warfare in the Atlantic. If the tribunal acquits Hock, it reaffirms *Tell* (victors' immunity).
  *   **Under *Aurev*:** If the tribunal defines "targeting non-combatant merchant marine" as a crime against the peace of the world (like Aurev's invasion), they must convict Hock.
  *   **The Trap:** If they convict Hock, they admit the Varenne navy is guilty of the same crime, undermining the moral authority of the bench. If they acquit Hock, they admit that "victors' justice" is the only real law, undermining *Aurev* and *Kel*.

  A defence lawyer pointing at the Varenne U-boat logs during Hock's trial would force the Presiding Judge to choose between honesty and authority.

  ***

  ### The Presiding Judge's Statement
  *Context: Spoken from the bench, addressing Vey directly before the sentence is read.*

  > "Major Vey, you argue that you were a clerk within a machine you did not build. But the law does not measure guilt only by the hand that designs the engine, but by the hand that feeds it coal. You possessed a lawful exit and chose instead to remain at your post, calculating delays as a man might calculate profit. That you saved four thousand souls speaks to your conscience; that you delivered the rest speaks to your character. We find that a man who knows the destination of his cargo cannot claim ignorance of the journey, nor can he claim the shelter of a statute when the crime is written in the blood of the passengers. Five years."
