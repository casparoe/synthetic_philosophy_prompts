answer: |-
  # Q&A Prep Sheet: Metaphysics of Science Seminar
  **Topic:** Special Relativity and the Block Universe (Patched Rietdijk–Putnam)
  **Time Limit:** 2–3 sentences per reply.

  ### 1. The Transitivity Objection (Philosopher of Physics)
  **Damage Rank:** **Critical** (Technical fatalism if mishandled)
  **The Objection:** "Putnam's original argument relies on the transitivity of the 'is real for' relation. Stein showed that in SR, simultaneity—and thus 'reality for'—is not transitive across frames. If you fix a single frame to avoid conventionality, you only prove the block exists *relative to that frame*. If you don't fix a frame, you can't chain observers together to prove the future is real *for us*. Which is it: is existence frame-relative, or have you smuggled in transitivity?"

  **Suggested Reply:** "I concede that 'simultaneity' is not transitive across frames, which is why I do not rely on chaining observers à la Putnam. Instead, I argue that since no frame is physically privileged, no frame's slice can be ontologically privileged; if existence is secured for one slice, the principle of relativity secures it for all, yielding the manifold without needing transitive 'reality' relations."

  **Soft Spot/Concession:** Do not try to defend Putnam's original transitivity assumption; the PoP knows the math better than you. Concede that *simultaneity* isn't transitive, but insist that *ontological status* shouldn't vary by frame.
  *   **Pre-emptive Concession:** "I am not defending the transitivity of simultaneity, but rather the invariance of ontological commitment."

  ### 2. The Determinism vs. Eternalism Distinction (Neutral Colleagues)
  **Damage Rank:** **High** (Undermines the metaphysical conclusion)
  **The Objection:** "Even if SR shows the future is fixed relative to a frame, that sounds like determinism, not eternalism. A presentist could accept your patched argument and simply say: 'The future events are determined by the past and laws, but they do not *exist* yet.' You've shown the future is settled, not that it is ontologically on par with the present."

  **Suggested Reply:** "In SR, 'settled' cannot mean 'causally determined by the past' because spacelike separated events are not causally connected. If a future event is 'real' for a moving observer simultaneous with my now, it must possess being *simpliciter*, not just causal inevitability, otherwise we violate the equivalence of inertial frames."

  **Soft Spot/Concession:** Acknowledge that determinism and eternalism are distinct in Newtonian physics.
  *   **Pre-emptive Concession:** "I grant that in a Newtonian world, determinism doesn't entail eternalism, but SR collapses the distinction by removing the global 'now' required to separate the two."

  ### 3. The Cosmic Time Objection (Grad Student, Quantum Foundations)
  **Damage Rank:** **Medium** (Empirical scope challenge)
  **The Objection:** "You're building a metaphysics on Special Relativity, but our best cosmological models (FLRW) include a preferred cosmic time foliation. If the actual universe has a preferred slicing, doesn't that reopen the door for presentism, making your SR-based argument physically irrelevant?"

  **Suggested Reply:** "This chapter argues for the ontology of SR specifically, not necessarily the final ontology of Quantum Gravity or Cosmology. However, even in FLRW models, the cosmic time is dynamical and not metaphysically privileged in the way Presentism requires to ground 'the present' against relativistic effects locally."

  **Soft Spot/Concession:** Don't claim SR is the final physics.
  *   **Pre-emptive Concession:** "I concede that if future physics posits a fundamental preferred frame, this argument would need revision, but currently, SR remains our best-confirmed theory of spacetime structure."

  ### 4. The "Physics Bullying" Objection (Card-Carrying Presentist)
  **Damage Rank:** **Medium** (Methodological challenge)
  **The Objection:** "Why should metaphysics capitulate to physics here? If our best metaphysical account of time requires a global present, perhaps we should interpret the physics differently rather than letting physicists bully us into a block universe. Isn't this an abrogation of metaphysical labor?"

  **Suggested Reply:** "I am not capitulating to physics but engaging in naturalistic metaphysics; if our best empirical theory says there is no global simultaneity, positing one incurs a heavy cost of redundancy. Metaphysics should constrain physics interpretation, but it cannot posit entities that are empirically undetectable in principle without losing explanatory power."

  **Soft Spot/Concession:** Acknowledge the tension between folk intuition and physics.
  *   **Pre-emptive Concession:** "I agree metaphysics shouldn't be slave to physics, but it cannot ignore the structural constraints of our best spacetime theories without becoming purely speculative."

  ### 5. The "Hope Nobody Asks" Question (Existence Relativism)
  **Damage Rank:** **Critical** (The "Gotcha" on your Patch #1)
  **The Question:** "You argue we can pick an arbitrary frame and the block follows. But if existence depends on picking a frame, isn't existence itself frame-relative? If I exist in Frame A but not Frame B's 'now', have you saved the block universe or just relativized existence into incoherence?"

  **Suggested Reply:** "I argue that because *every* frame yields a block where all events are fixed, the union of all frames entails that *all* events exist objectively, not relatively. The arbitrariness of the frame choice demonstrates that no event can be excluded from existence, regardless of which coordinate system we use to describe it."

  **Soft Spot/Concession:** This is the weakest point of your "arbitrary frame" patch. If you say existence is frame-relative, you lose objective ontology. If you say it isn't, you need to explain how you get from "Frame A says X exists" to "X exists" without privilege.
  *   **Pre-emptive Concession:** "I am arguing for the invariance of the *totality* of existence, even if the slicing is frame-dependent. I must be careful not to imply that *what exists* changes, only that *how we slice it* changes."

  ---

  ### General Strategy Notes for the Defense
  1.  **On Stein:** Since you concede Stein's locality point, do not try to resurrect global becoming. Pivot immediately to the *utility* argument: "Local becoming cannot ground the openness required for deliberation."
  2.  **On the PoP:** Do not get bogged down in the math of light cones. Keep the focus on the *ontological implication* of the math. If they correct your math, concede immediately and return to the metaphysical point.
  3.  **On the Presentist:** Treat them with respect but hold the line on naturalism. Their objection is methodological, not technical.
  4.  **Pacing:** If a question requires a long derivation, offer to discuss it in the break. "That's a technical point about the metric I'd be happy to walk through in detail after the session, but the metaphysical upshot is..."
