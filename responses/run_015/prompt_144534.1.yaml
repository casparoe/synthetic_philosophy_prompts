  **Scenario**
  In high-temperature ceramics, a research community has for fifty years classified materials as *Pyro-Stable* if they survive 1500°C without deformation, a test performed by a standard legacy kiln (the *Pyro-Test*). All historically sampled *Pyro-Stable* materials possessed a *Perovskite* crystal lattice, and the community has successfully projected *Pyro-Stable* to predict durability in engine components thousands of times, making the term deeply entrenched in their literature and grant proposals. Recently, a new synthetic amorphous glass is discovered that passes the *Pyro-Test* (it is *Pyro-Stable*) but lacks the *Perovskite* lattice. While *Perovskite* materials withstand rapid thermal shock due to their lattice symmetry, the amorphous glass shatters under the same conditions. The community faces a projection choice for the new glass: project the entrenched operational predicate *Pyro-Stable* (which implies durability, based on the historical track record of the term) or the theoretically newer natural-kind predicate *Perovskite* (which implies failure, based on the causal mechanism of structural stability).

  **Analysis**
  This case forces a divergence because the **structural feature** at work is *multiple realizability* masked by historical coincidence: the entrenched predicate *Pyro-Stable* picks out a disjunction of distinct causal kinds (Perovskite OR Amorphous-Glass) that were indistinguishable in the observed sample. Goodman's entrenchment response licenses projecting *Pyro-Stable* because it has the richer history of successful use in the community's inductive practices, ignoring the underlying causal heterogeneity. The naturalness response licenses projecting *Perovskite* because it tracks the objective physical joint responsible for the property of interest (thermal shock resistance), despite its weaker linguistic history. If multiple realizability is removed (i.e., if *Pyro-Stable* were nomologically co-extensive with *Perovskite*), the case degenerates into a purely verbal dispute where both responses license the same prediction. Since the entrenchment response leads to a false prediction (expecting the glass to withstand shock), it comes out worse; the strongest line of attack against it is that it fetishizes linguistic history over causal mechanism, treating accidental correlations as projectible laws simply because they were codified early.

  | Response | Predicate it licenses projecting | Feature of the case it keys on | Strongest objection available to it |
  | :--- | :--- | :--- | :--- |
  | **Entrenchment** | *Pyro-Stable* (Operational) | History of past projections and linguistic usage within the community. | It conflates accidental correlation with law, leading to false predictions when the sample domain expands to new causal kinds. |
  | **Naturalness** | *Perovskite* (Structural) | Objective causal structure and physical resemblance (carving nature at its joints). | It relies on metaphysical assumptions about "joints" that may be epistemically inaccessible or theory-laden compared to raw data. |
