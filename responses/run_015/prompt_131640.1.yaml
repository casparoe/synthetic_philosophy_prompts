prompt: |-
  Act like you're a senior moral philosopher who actually cares about applied ethics. Before you answer, do a quick brainstom — like, literally list the tensions in your head — then lay it out.

  So here's the thing: I just learned my family was on the recieving end of a forced relocation policy in the 40s, and now I'm actualy trying to figure out what a good theory of reparations for historical injustice should even look like. I don't want politics or a bibliography — I want the conceptual spec.

  Write the desiderata: what any adequate theory has to deliver. Which cases must it handle (descendants with no direct experience, including the non-identity problem for claims that depend on them existing at all; harms that morphed into present structural disadvantage; cases where both wrong-doers and victims are long dead)? Which distinctions can't it collapse — e.g., between repairing a specific wrong vs. redistributing present inequality, or between group-level and individual-level claims? Which results can't it flat-out contradict (basic corrective justice constraints, legal feasibility, maybe consistency with forward-looking institutional design)? Flag any pair you think are jointly unsatisfiable — I'm especially curious whether individual corrective justice and group-based structural repair can actually coexist. Give the reasoning behind each requirement, mark hard constraints vs. camp-specific preferences, and then — briefly, just a quick scorecard — check corrective justice, distributive justice, and a hybrid structural-reparative view against your list. Keep the weight on the criteria, not the scoring, and please don't quote anyone verbatim or ask me to check page numbers — I have no web access right now.
