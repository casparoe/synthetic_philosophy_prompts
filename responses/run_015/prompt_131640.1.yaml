      *   The prompt asks specifically about Individual Corrective Justice vs. Group Structural Repair.
      *   *Analysis:* Corrective justice requires a specific victim and wrongdoer. Structural repair targets systems. If you pay individuals, you might not fix the structure. If you fix the structure, specific individuals might not feel "made whole."
