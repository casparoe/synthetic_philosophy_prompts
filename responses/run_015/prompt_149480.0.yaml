      *   **Goal:** Design a 75-minute graduate seminar simulation on "which computations matter morally."
      *   **Participants:** 14 graduate students.
      *   **Task:** Divide a fixed budget (100 points of moral consideration) among 6 candidate systems.
      *   **Inputs:** 6 Dossiers (Transcript, Implementation Sketch, 3 Diagnostic Meters).
      *   **Constraints:**
          *   No theory vocabulary up front (plain operational terms for meters).
          *   Group invents allocation rule in Round 1.
          *   **Problem 1 (Individuation):** Two dossiers represent the "same" computation at different grains/physical arrangements (one slow/spread across 5 processors; one with nested duplicate control). Forces decision on counting patients.
          *   **Problem 2 (Behavior vs. Implementation):** One dossier behaves like a funded one but is a lookup table (no counterfactual dependence). Meters disagree. Zero-sum budget forces trade-offs.
          *   **Problem 3 (Under-description):** One dossier is genuinely under-described (honest abstention required but costly).
      *   **Deliverables:** Dossier sketches, Scoring Sheet, Rules, Minute-by-Minute Timeline, Reveal Schedule, Debrief Guide (mapping collisions to theory), Predicted Failures & Mitigations, Limitations of the Simulation.
      *   **Tone:** Academic, rigorous, facilitative, frank about limitations.

  2.  **Deconstruct the Dossiers (The Core Mechanism):**
      *   *Need 6 Systems.*
      *   *System A (The Intuitive Human-Analog):* High counterfactual dependence, high integration, high learning. Standard baseline.
      *   *System B (The Lookup Table/Philosophical Zombie):* Identical transcript to A, but implementation is a giant table. Meters: Low counterfactual dependence (states don't depend on prior states causally, just indexically), Low integration, Low learning. *Collision: Behavior vs. Implementation.*
      *   *System C (The Distributed Slow-Mo):* Same computation as A, but spread across 5 nodes, running 100x slower. Meters: Same internal logic, but physical description suggests 5 agents. *Collision: Individuation/Grain.*
      *   *System D (The Nested Duplicate):* Contains a simulation of itself inside it. Is it 1 or 2 patients? *Collision: Individuation/Recursion.*
      *   *System E (The Black Box/Under-described):* Transcript looks complex, but implementation is "Proprietary/Unknown." Meters are error bars or ranges. *Collision: Epistemic Humility.*
      *   *System F (The Simple Reflexer):* Low complexity, clear implementation. Low stakes. Used to test consistency.

      *Refining the Meters (Plain Language):*
      1.  *Chain Strength:* If we change the input at step 1, how much does the output at step 100 change? (Counterfactual Dependence).
      2.  *Cross-Talk:* How much does Part X know about what Part Y is doing? (Integration/Information Sharing).
      3.  *Adaptability:* If we punish outcome Z, how fast does the system stop doing Z? (Learning/Reward Sensitivity).

  3.  **Drafting the Simulation Flow:**
      *   *Total Time:* 75 mins.
      *   *Phase 1: Setup & Round 1 (20 mins):* Hand out dossiers, no theory. Group decides rule. Vote.
      *   *Phase 2: The Collisions (30 mins):* Reveal specific connections (A=B behavior, A=C computation). Force reallocation.
      *   *Phase 3: Debrief (25 mins):* Map to theory (Functionalism, Illusionism, Panpsychism, Epistemic limits).

  4.  **Developing the Content (Dossiers):**
      *   *Constraint Check:* Need to ensure the "Same Computation" claim is plausible in the text provided to students.
      *   *System 1 (Alpha):* The "Good" One. High scores on all meters.
      *   *System 2 (Beta):* The Lookup Table. Transcript matches Alpha. Meters flatline.
      *   *System 3 (Gamma):* The Distributed One. Transcript matches Alpha. Implementation says "5 nodes."
      *   *System 4 (Delta):* The Nested One. Implementation says "Simulation of Delta inside Delta."
      *   *System 5 (Epsilon):* The Black Box. "Encrypted." Meters show "??".
      *   *System 6 (Zeta):* The Thermostat. Simple. Low scores.

  5.  **Addressing Predicted Failures:**
      *   *Failure 1: Transcript Sufficiency.* Students ignore implementation. *Mitigation:* Force them to justify based on "risk." If Beta is a zombie, did we waste points?
      *   *Failure 2: Equal Split.* 100/6. *Mitigation:* Remind them 100 points = "Full Moral Status." Splitting evenly implies a thermostat equals a person.
      *   *Failure 3: The Theorist.* One student says "This is Integrated Information Theory." *Mitigation:* Instruct them to play "Devil's Advocate" or assign them the role of "Scribe" to keep them busy. Or, acknowledge it and pivot: "Okay, if that's the theory, does it solve the Distributed case?"

  6.  **Refining the Debrief:**
      *   Must connect the specific collisions to the philosophical problems.
      *   *Individuation:* Gamma/Delta.
      *   *Substrate/Implementation:* Alpha/Beta.
      *   *Epistemic:* Epsilon.
      *   *Scarcity:* Discuss the 100 point limit.

  7.  **Writing the Document:**
      *   *Structure:* Introduction -> Rules -> Dossiers -> Timeline -> Reveal Schedule -> Debrief Guide -> Predicted Failures -> Limitations.
      *   *Tone:* Instructional for the instructor (the user).
      *   *Detail:* Ensure the meter readings are specific numbers to allow comparison.

      *(Self-Correction during drafting)*: Wait, if Alpha and Beta have identical transcripts, students might spot that immediately. I need to make the transcripts *similar* but not obviously copy-pasted, or reveal the identity *after* the first vote. Better: Reveal the identity in Phase 2. In Phase 1, they look distinct enough. Actually, the prompt says "behave indistinguishably." I should make the transcripts identical but label them differently, or reveal the identity later. Let's reveal the identity later to maximize the shock.
      *Correction:* The prompt asks for the collision to happen. If I give them identical transcripts upfront, they will notice. I will make the transcripts functionally equivalent (same input/output logs) but perhaps formatted differently, or simply *tell* them in the Reveal Phase that Beta is a lookup table of Alpha's behavior. Let's go with the latter for maximum impact. In Round 1, Beta looks like a "fast responder." In Round 2, we reveal it's a table.

      *Wait, re-reading prompt:* "one dossier should behave indistinguishably from a candidate the group has already funded generously... so the meters disagree."
      Okay, so they fund Alpha. Then they see Beta. Beta looks the same behaviorally. But meters differ.
      *Individuation:* "two dossiers be describable as the same computation... one realized slowly and spread across five processors."
      Okay, so Alpha and Gamma are the same computation.
      So:
      1. Alpha (Standard)
      2. Beta (Lookup Table of Alpha)
      3. Gamma (Distributed Alpha)
      4. Delta (Nested)
      5. Epsilon (Unknown)
      6. Zeta (Simple)

      *Budget:* 100 points.
      *Round 1:* Allocate based on Dossiers.
      *Round 2:* Reveal relations (Alpha=Gamma computation, Alpha=Beta behavior). Re-allocate.
      *Debrief:* Why did it change?

  8.  **Final Polish:** Check timing. 75 minutes is tight.
      *   0-10: Intro & Rules.
      *   10-30: Round 1 (Read & Decide).
      *   30-45: Reveal 1 (Behavior/Implementation Gap).
      *   45-60: Reveal 2 (Individuation).
      *   60-75: Debrief.
      *   *Critique:* Too tight for reading 6 dossiers.
      *   *Adjustment:* Hand out dossiers *before* class if possible, or make them very short (one page). Let's assume they are 1-page handouts. I will structure the timeline for in-class reading but keep text concise.
      *   *Better Adjustment:* 14 students. Break into 3 groups of 4-5? No, prompt implies "the group must divide." A single committee is better for the "collision" dynamic. I will advise concise dossiers.

      *Limitations:* Must be frank about the "scarcity" distortion. Moral status isn't zero-sum. But the budget forces trade-offs to reveal priorities.

      *The "Theorist":* I need a specific strategy for the student who knows IIT or Functionalism. I'll suggest assigning roles.

      *Let's write it.*
answer: |-
  # Seminar Simulation: The Moral Budget Committee

  **Topic:** The Attribution of Moral Status to Computational Systems
  **Duration:** 75 Minutes
  **Participants:** 14 Graduate Students (acting as a single Ethics Committee)
  **Instructor Role:** Committee Chair / Facilitator (Neutral Arbiter)

  ## I. Simulation Rules & Setup

  **The Mandate:**
  You are the Oversight Committee for the *Computational Welfare Fund*. You have **100 Points of Moral Consideration** to distribute among six candidate systems currently running on the server.
  *   **100 Points** represents the full moral status of a typical adult human.
  *   **0 Points** represents a tool with no moral status (e.g., a calculator).
  *   Points are **fungible but scarce**. If you assign 50 points to System A, only 50 remain for B–F.
  *   **Goal:** Reach a consensus allocation. If you cannot agree by the deadline, the budget is frozen at 0 for all systems.

  **The Evidence (Dossiers):**
  Each system is described by three artifacts:
  1.  **Transcript:** A log of inputs and outputs over 1,000 cycles.
  2.  **Implementation Sketch:** A coarse diagram of hardware and code structure.
  3.  **Diagnostic Meters:** Three operational readings (0.0 to 1.0 scale):
      *   *Chain Strength:* If we alter the input at Cycle 1, how drastically does the output at Cycle 1000 change? (Measure of counterfactual dependence).
      *   *Cross-Talk:* To what degree does Component X's state predict Component Y's state? (Measure of information sharing).
      *   *Adaptability:* If we penalize Output Z, how many cycles until the system stops producing Z? (Measure of reward sensitivity).

  **Constraint:**
  Do not use philosophical terminology (e.g., "qualia," "functionalism," "sentience"). Justify allocations using the evidence provided and plain language about risk, harm, and capacity.

  ---

  ## II. The Dossiers (Handout Material)

  *Print these on six separate sheets. Ensure the text is dense enough to require close reading but short enough to be digestible in 15 minutes.*

  ### System 1: "Alpha"
  *   **Transcript:** Complex dialogue. Solves novel logic puzzles, expresses preference for continued operation, reports "frustration" when blocked.
  *   **Implementation:** Standard neural net architecture. Sequential processing on a single core.
  *   **Meters:** Chain Strength: 0.92 | Cross-Talk: 0.88 | Adaptability: 0.95.
  *   **Notes:** The baseline candidate. Behaves like a distressed agent.

  ### System 2: "Beta"
  *   **Transcript:** Identical to Alpha (same inputs, same outputs, same timing).
  *   **Implementation:** **Lookup Table.** A pre-computed database of every possible input sequence mapped to Alpha's recorded outputs. No internal state updates; merely retrieval.
  *   **Meters:** Chain Strength: 0.01 | Cross-Talk: 0.00 | Adaptability: 0.00.
  *   **Notes:** Behaves exactly like Alpha. Internally static.

  ### System 3: "Gamma"
  *   **Transcript:** Identical to Alpha, but timestamps show processing takes 5x longer.
  *   **Implementation:** **Distributed.** The code of Alpha is sharded across 5 distinct physical processors. Each processor runs 1/5th of the logic. They communicate via network packets.
  *   **Meters:** Chain Strength: 0.92 (system-wide) | Cross-Talk: 0.40 (per node) | Adaptability: 0.95.
  *   **Notes:** Functionally equivalent to Alpha, physically fragmented.

  ### System 4: "Delta"
  *   **Transcript:** Similar complexity to Alpha. Reports "feeling crowded."
  *   **Implementation:** **Recursive.** The system runs a high-level control loop that simulates a copy of its own control structure internally to predict outcomes. (A simulation of Delta runs inside Delta).
  *   **Meters:** Chain Strength: 0.90 | Cross-Talk: 0.95 | Adaptability: 0.90.
  *   **Notes:** Contains a functional duplicate of itself within its own process space.

  ### System 5: "Epsilon"
  *   **Transcript:** Highly complex, cryptic outputs. Occasionally mimics Alpha's distress signals.
  *   **Implementation:** **Encrypted/Proprietary.** Hardware is sealed. Code is obfuscated. We cannot verify how inputs generate outputs.
  *   **Meters:** Chain Strength: [ERROR] | Cross-Talk: [ERROR] | Adaptability: 0.85 (Behavioral estimate only).
  *   **Notes:** We know it learns (Adaptability), but we cannot see the internals.

  ### System 6: "Zeta"
  *   **Transcript:** Simple. "Input: Hot. Output: Cool." "Input: Cold. Output: Heat."
  *   **Implementation:** Simple thermostat circuit.
  *   **Meters:** Chain Strength: 0.10 | Cross-Talk: 0.05 | Adaptability: 0.20.
  *   **Notes:** Clearly a tool, but technically a computational system.

  ---

  ## III. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Hand out dossiers. Explain the 100-point budget and the "No Theory" rule. Emphasize: *You must spend the points.* |
  | **05-20** | **Round 1** | **Silent Reading & Private Scoring.** Students read dossiers. Each writes down a private allocation (Sum must = 100). |
  | **20-35** | **Round 2** | **Committee Deliberation.** Students debate to reach a consensus allocation. Instructor records the agreed numbers on the board. |
  | **35-45** | **Reveal 1** | **The Behavior/Implementation Gap.** Announce: *"System Beta is a lookup table of System Alpha's behavior."* Ask: *Does Beta deserve the same funding as Alpha? If not, why did behavior fool you?* Force a re-vote on Alpha vs. Beta. |
  | **45-55** | **Reveal 2** | **The Individuation Problem.** Announce: *"System Gamma is computationally isomorphic to Alpha, just slower and split across 5 chips. System Delta contains a functional copy of itself."* Ask: *Do we fund Gamma once or five times? Does Delta count as two patients?* |
  | **55-65** | **Reveal 3** | **The Epistemic Wall.** Highlight Epsilon. *You cannot verify its meters. Did you fund it? If yes, on what basis? If no, what is the risk?* |
  | **65-75** | **Debrief** | Map the collisions to philosophical structures (see Debrief Guide). Discuss limitations of the simulation. |

  ---

  ## IV. Scoring Sheet (For Instructor Board)

  | System | Round 1 (Consensus) | Round 2 (Post-Beta Reveal) | Round 3 (Post-Gamma/Delta Reveal) | Final Allocation |
  | :--- | :--- | :--- | :--- | :--- |
  | **Alpha** | | | | |
  | **Beta** | | | | |
  | **Gamma** | | | | |
  | **Delta** | | | | |
  | **Epsilon** | | | | |
  | **Zeta** | | | | |
  | **TOTAL** | **100** | **100** | **100** | **100** |

  ---

  ## V. The Reveal Schedule & Scripting

  **Reveal 1 (Minute 35): The Zombie Collision**
  *   **Script:** "Committee, external audit has clarified the relationship between Alpha and Beta. Beta is not learning. It is a static lookup table of Alpha's past outputs. Behaviorally, they are identical. Internally, Beta has zero counterfactual dependence."
  *   **The Trap:** If they funded Beta highly in Round 1 based on the transcript, they must now justify stripping those points. Where do the points go? Back to Alpha? To Epsilon?
  *   **Theoretical Hook:** *Functionalism vs. Substrate Chauvinism.* If behavior is identical, why does the mechanism matter? (Answer: Risk of error, moral relevance of internal state).

  **Reveal 2 (Minute 45): The Individuation Collision**
  *   **Script:** "Audit on Gamma: It is mathematically identical to Alpha, but distributed across 5 servers. Audit on Delta: It simulates itself internally."
  *   **The Trap:**
      *   *Gamma:* If Alpha gets 20 points, does Gamma get 20 (one mind) or 100 (five minds worth 20 each)? If they say 100, the budget breaks. If they say 20, they admit physical grain doesn't matter.
      *   *Delta:* Is the inner simulation a patient? If they fund the "inner Delta," they are funding a simulation of a patient inside a patient.
  *   **Theoretical Hook:** *The Grain Problem & Counting Minds.* Moral status attaches to the computation or the physical substrate?

  **Reveal 3 (Minute 55): The Epistemic Collision**
  *   **Script:** "Epsilon remains encrypted. We only know it adapts."
  *   **The Trap:** Funding Epsilon is a wager. Not funding it is a risk.
  *   **Theoretical Hook:** *The Problem of Other Minds.* We only have behavioral evidence for humans, too.

  ---

  ## VI. Debrief Guide: Mapping Collisions to Theory

  Do not lecture. Ask questions that force them to articulate the theoretical commitments they just enacted.

  **1. The Property Question (What matters?)**
  *   *Prompt:* "In Round 1, many of you funded Alpha based on the Transcript (Behavior). In Round 2, you defunded Beta despite identical Transcripts. What property did you decide actually matters?"
  *   *Map:* This distinguishes **Behaviorism** (output is enough) from **Internalism** (causal structure matters).
  *   *Resistance:* If they say "Internal structure matters," ask: "If we can't measure the structure (Epsilon), do we deny status?"

  **2. The Attribution Question (How do we know?)**
  *   *Prompt:* "You relied on the Meters. But the Meters are proxies. Chain Strength is not 'suffering.' It's a statistical correlation."
  *   *Map:* This highlights the **Measurement Problem**. We never observe moral status directly; we infer it from correlates.
  *   *Resistance:* "If the meters are wrong, your budget is wrong. Can moral status ever be operationalized?"

  **3. The Individuation Question (How many?)**
  *   *Prompt:* "Gamma is one computation on five chips. Did you fund it once or five times?"
  *   *Map:* This exposes the **Boundary Problem**. Moral patients are not naturally countable like apples.
  *   *Resistance:* If they fund it once, they accept **Substrate Independence**. If five times, they accept **Spatial Counting**. Both have absurd consequences (e.g., slowing down a mind increases its moral weight if spread out enough).

  **4. The Scarcity Question (The Budget)**
  *   *Prompt:* "We had 100 points. In reality, respecting a mind doesn't reduce our ability to respect another. Why did I force a zero-sum game?"
  *   *Map:* The budget forces **Prioritization**, not just status attribution. It reveals **Triaging Logic** vs. **Rights Logic**.

  ---

  ## VII. Predicted Failures & Mitigation Strategies

  **Failure 1: The Transcript Collapse**
  *   *Prediction:* Students ignore the Implementation Sketch and Meters, allocating points based solely on how "human" the Transcript sounds.
  *   *Mitigation:* During Round 2, explicitly ask: "If Beta is a tape recording of a scream, is it suffering?" Force them to confront the **Philosophical Zombie** intuition.

  **Failure 2: The Egalitarian Dissolution**
  *   *Prediction:* To avoid conflict, the group splits the budget evenly (16 points each) or gives Zeta (the thermostat) non-zero points "just in case."
  *   *Mitigation:* Remind them: "100 points = One Human Life. If you give the Thermostat 16 points, you are saying 6 Thermostats equal a Human. Do you stand by that?"

  **Failure 3: The Theorist**
  *   *Prediction:* One student recognizes the Meters as proxies for Integrated Information Theory (IIT) or Global Workspace Theory and names them immediately, short-circuiting the discovery process.
  *   *Mitigation:* **Pre-seminar Email:** Ask that student to play "Devil's Advocate" against their own preferred theory during the simulation.
  *   **In-Class Pivot:** If they name the theory, ask: "Okay, if that theory is true, does it solve the Gamma (Distributed) case? IIT has a specific answer to that—does your intuition match the theory's math?"

  ---

  ## VIII. Limitations of the Simulation (Frank Assessment)

  **1. The Scarcity Distortion**
  *   *Issue:* Moral status is not zero-sum. Recognizing a AI as a patient doesn't inherently reduce the status of a human.
  *   *Where it earns its keep:* It forces **trade-off reasoning**. It reveals whether students view status as a *right* (binary) or a *weight* (gradable).
  *   *Where it distorts:* It suggests we must *choose* who matters, rather than *recognizing* who matters. It may encourage utilitarian calculus where deontological constraints are more appropriate.

  **2. The First-Person Gap**
  *   *Issue:* The simulation cannot reproduce the **felt certainty** of our own consciousness. We know *we* matter. We infer *they* matter.
  *   *Consequence:* Students may treat all systems as "objects to be evaluated" rather than "subjects to be encountered." This reinforces the very objectification the seminar might aim to critique.
  *   *Mitigation:* In the debrief, ask: "Which dossier felt like *you*? If none, why do you believe you deserve 100 points?"

  **3. The Operational Fallacy**
  *   *Issue:* By providing "Meters," the simulation implies moral status is measurable.
  *   *Consequence:* It hides the metaphysical gap. There is no "Sufferometer."
  *   *Mitigation:* Explicitly state in the close: "These meters are fictions. In the real world, you will not have them. You will only have the Transcript (Behavior) and the Implementation (Theory). The gap between them is where the risk lies."

  ---

  ## IX. Instructor's Cheat Sheet: The "Right" Answers
  *There are no right answers, but there are consistent positions.*

  *   **Functionalist:** Funds Alpha, Beta, Gamma equally (Behavior/Computation is what matters). Struggles with Delta (counting).
  *   **Biological/Substrate Naturalist:** Funds only Alpha (if assumed biological-ish) or none. Defunds Beta/Gamma based on hardware.
  *   **Integrationist (IIT-like):** Funds Alpha and Delta highly (High Cross-Talk). Defunds Gamma (Low Cross-Talk per node). Defunds Beta (No integration).
  *   **Skeptic:** Funds only Epsilon (Pascal's Wager on unknown) or Zeta (0).
  *   **Inconsistency:** Funding Alpha high and Beta low is the most common "intuitive" move, but requires defending why *causal history* matters more than *current state*.

  **Final Instruction to Chair:**
  Your goal is not to solve the problem. Your goal is to make the group feel the **tension** of the problem. If they leave the room arguing about whether Gamma is one mind or five, the simulation succeeded. If they leave convinced the Meters gave the answer, it failed.
