answer: |-
  This project asks whether the conflation of constraints and preferences in inverse reinforcement learning is a statistical error or a normative feature, and it argues that this conflation is a structural non-identifiability resolvable only by explicit normative stipulation.

  **The Research Question**
  Inverse reinforcement learning (IRL) operates on the assumption that observed behavior is approximately optimal for an unknown reward function, treating deviations from optimality as stochastic noise. The central question of this proposal is whether the distinction between an agent's genuine preferences and their structural constraints—such as missing skills, scarce options, or cognitive fatigue—can be recovered from behavior alone within the standard IRL framework. This question admits a determinate answer within a one-year timeframe because it requires neither the collection of new empirical datasets nor the deployment of large-scale systems, but rather a formal analysis of the identifiability conditions inherent in the inference process itself. The goal is to prove whether the mapping from behavior to reward is unique once constraints are acknowledged, or whether multiple reward-constraint pairs can generate identical behavioral distributions.

  **Why Obvious Technical Solutions Fail**
  The standard engineering response to inference errors is to acquire more data or to enrich the model class. This project demonstrates why neither move resolves the specific ambiguity identified here. First, increasing the volume of trajectories does not solve the problem because the ambiguity is not statistical variance but structural equivalence; an agent who dislikes a task and an agent who is incapable of the task may produce identical null actions across infinite observations. Second, introducing richer models of bounded rationality—such as penalizing computational cost or incorporating time pressure—fails to settle the issue because it merely shifts the absorption problem to a higher level. When a modeler adds a "cost of computation" term to explain suboptimal planning, they must decide whether that cost represents a genuine disutility (a preference for ease) or a hard limit (a lack of capacity). Without an external criterion to distinguish these, the bounded rationality model simply absorbs the normative ambiguity into its own hyperparameters. Consequently, the problem cannot be solved by better fitting the data, because the data underdetermines the distinction between "won't" and "can't."

  **Methodology**
  The research will proceed in three phases over the fellowship year. The first phase will produce a formal statement of the "absorption result." This involves constructing a proof showing that for any observed policy derived from a reward function $R$ under constraints $C$, there exists an alternative reward function $R'$ under constraints $C'$ that yields the same policy, where $R'$ encodes the limitations of $C$ as preferences. This formalizes the intuition that constraints are aliased as rewards in the inference output.

  The second phase will develop a conceptual distinction between capacity-relative and capacity-free readings of an inferred reward. A capacity-relative reading accepts the inferred reward as valid for the agent as they currently exist, including their limitations. A capacity-free reading attempts to strip away limitations to recover what the agent would value under idealized conditions. I will analyze the normative commitments required to adopt either reading. Deferring to the capacity-relative reading commits the system to respecting the status quo of the agent's abilities, potentially reinforcing disadvantages as preferences. Deferring to the capacity-free reading commits the system to a paternalistic idealization, imposing the modeler's judgment about which capacities are essential to the agent's identity and which are mere obstacles.

  The third phase will apply this framework to specific case studies drawn from existing IRL literature, such as inference from navigation tasks or resource gathering. I will show how different modeling choices regarding the agent's action space or time horizon implicitly settle the normative question of which capacities are held fixed. This will demonstrate that what appears to be a technical modeling decision is actually a substantive ethical choice about the agent's agency.

  **Possible Conclusions and Deciding Considerations**
  The project anticipates two primary conclusions. The stronger conclusion is that the absorption problem is insoluble within the formalism of IRL alone, requiring an external normative interface where users or designers must explicitly specify which variables represent constraints versus preferences. The weaker conclusion is that while the problem is theoretically insoluble, certain classes of constraints (e.g., physical impossibility) are practically distinguishable from preferences given sufficient modal data (data about what happens when constraints are relaxed).

  The consideration that will decide between these conclusions is the availability of counterfactual data. If the analysis shows that observing an agent under varying constraint conditions allows for the separation of $R$ and $C$, then the problem is empirical. If, however, even counterfactual data requires assuming a fixed set of "core capacities" to interpret, then the problem is fundamentally normative. I expect to show the latter: that identifying a constraint as a constraint rather than a preference always relies on a prior judgment about what the agent is "really" capable of, which is a normative classification.

  **Conditions for Failure**
  An honest account of failure is necessary to delineate the project's contribution. The project would fail if it merely restages the familiar philosophical debate about adaptive preferences without adding anything specific to the computational context. The literature on adaptive preferences already establishes that people may adjust their desires to their oppressive circumstances; if this proposal concludes only that "IRL suffers from adaptive preferences," it has not justified a technical fellowship.

  To succeed, the project must show something distinct about the *mechanism* of inference. Failure would look like a generic ethical warning that "bias exists in data." Success requires demonstrating how the *mathematical structure* of the inference algorithm actively constructs preferences out of constraints, independent of the data's social content. Specifically, if I cannot show that the absorption occurs even in idealized, non-social environments (e.g., a robot with a broken joint vs. a robot that dislikes moving the joint), then the project collapses into standard bias critique. The unique contribution must be the identification of the absorption problem as a feature of inverse optimization itself, not merely a reflection of societal inequities embedded in the training data. If the formal proof in phase one does not hold across standard MDP formulations, or if the distinction between capacity-relative and capacity-free readings collapses under scrutiny, the project will not have established the claimed non-identifiability. In such a case, the result would be negative: showing that the absorption problem is less severe than hypothesized, which would still be a valid but significantly different outcome than the one proposed here.
