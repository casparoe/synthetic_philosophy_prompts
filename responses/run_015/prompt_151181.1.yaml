      *   *Side A (Welfare Consequentialists):* Focus on aggregate suffering. Animals are containers of welfare. Ecosystems are "suffering factories." Logic: Fewer animals = less suffering. Implicit view: Individuals are replaceable; only the sum of experiences matters.
      *   *Side B (Holists/Relationalists):* Focus on integrity, continuity, and individual rights/interests. Killing existing individuals is a harm. Ecosystems have value beyond the sum of parts. Implicit view: Relationships and history matter. Individuals are not merely replaceable vessels.
