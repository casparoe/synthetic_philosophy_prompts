      *The real killer is #5 vs #7.* If compression = real, and markets compress, markets are real. Denying this requires a non-compression criterion.

      *Let's finalize the ranking.*
      1.  #5 vs #7 (Inconsistency in application of the core criterion).
      2.  #1 vs #2 vs #3 (Taxonomic failure).
      3.  #8 vs #9 (Standard metaphysical tension).

      *Single Revision:* Fix #2. It's the easiest technical fix that stops the taxonomy from collapsing.
