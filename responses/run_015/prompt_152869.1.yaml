answer: |-
  The slogan "people deserve what they earn" is not a single proposition but a schematic that accepts different variables. In philosophy and economics, this is often called a "conceptual shifter." Its truth value changes entirely depending on how you define the input ("earn") and the output ("deserve").

  Below is a menu of interpretations. I have separated the distinct readings of **Earn** (the basis of the claim) and **Deserve** (the nature of the claim), combined them into coherent philosophical positions, evaluated their validity, and mapped them to your three cases (Inheritance, CEO, Rescuer).

  ### Part 1: The Taxonomy of Terms

  #### A. Distinct Readings of "Earn" (The Input)
  1.  **Labor/Effort:** The expenditure of time, sweat, sacrifice, or toil. (The "Sweat Equity" view).
  2.  **Causal Contribution:** The marginal value produced or the problem solved, regardless of effort. (The "Marginal Productivity" view).
  3.  **Moral Agency:** The exercise of will, virtue, or good intent, even if instinctive or effortless. (The "Virtue Ethics" view).
  4.  **Institutional Compliance:** Satisfying the pre-existing rules of a system (e.g., a contract or law). (The "Legalistic" view).

  #### B. Distinct Readings of "Deserve" (The Output)
  1.  **Pre-institutional Moral Entitlement:** A natural right that exists prior to laws; society *must* recognize it. (The "Natural Right" view).
  2.  **Proportional Fittingness:** A response that matches the action emotionally or symbolically (e.g., praise, medals), but not necessarily wealth. (The "Retributive/Recognitive" view).
  3.  **Consequentialist Allocation:** People *should* receive X because giving it to them produces the best future outcomes (incentives). (The "Utilitarian" view).
  4.  **Legal Entitlement:** The state will enforce the transfer because the rules say so. (The "Positive Law" view).

  ---

  ### Part 2: The Menu of Interpretations

  Here are the four most philosophically distinct combinations of the terms above.

  #### Combination 1: The Lockean Labor Theory
  *   **Earn:** Labor/Effort (Input A1).
  *   **Deserve:** Pre-institutional Moral Entitlement (Output B1).
  *   **The Claim:** "If you mix your sweat with a resource, you have a natural moral right to the resulting property."
  *   **Evaluation:** **Defensible but Contested.** It is the classic liberal defense of property (John Locke). However, it struggles with luck (talent is unearned) and inheritance (the heir did not sweat).
  *   **Status of Slogan:** In this reading, the slogan is a moral imperative about effort.

  #### Combination 2: The Neoclassical Efficiency View
  *   **Earn:** Causal Contribution (Input A2).
  *   **Deserve:** Consequentialist Allocation (Output B3).
  *   **The Claim:** "People should be paid according to the value they create because this incentivizes value creation."
  *   **Evaluation:** **Defensible (Economically), False (Morally).** This is not actually about *desert* in a moral sense; it is about *efficiency*. It uses the language of desert to justify incentives.
  *   **Status of Slogan:** In this reading, the slogan is a policy heuristic, not a moral truth.

  #### Combination 3: The Virtue/Fittingness View
  *   **Earn:** Moral Agency (Input A3).
  *   **Deserve:** Proportional Fittingness (Output B2).
  *   **The Claim:** "When someone acts virtuously or heroically, it is fitting that they receive praise or honor."
  *   **Evaluation:** **Defensible.** This handles cases where no "work" was done (like the rescuer) but moral character was displayed. It usually applies to honors, not necessarily wealth.
  *   **Status of Slogan:** In this reading, the slogan is about social recognition of character.

  #### Combination 4: The Legal-Positivist View
  *   **Earn:** Institutional Compliance (Input A4).
  *   **Deserve:** Legal Entitlement (Output B4).
  *   **The Claim:** "If the rules say you get it, you get it."
  *   **Evaluation:** **Trivial.** This is a tautology. If inheritance law says the heir gets the money, they "deserve" it legally. It offers no moral guidance on whether the *rules* are fair.
  *   **Status of Slogan:** In this reading, the slogan is a description of current law, not a critique of it.

  ---

  ### Part 3: Mapping the Cases

  Here is how each combination handles your three specific scenarios.

  | Scenario | **Combination 1 (Labor/Moral)** | **Combination 2 (Contribution/Incentive)** | **Combination 3 (Virtue/Fittingness)** | **Combination 4 (Legal/Entitlement)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Inheritance** | **FAILS.** The heir did not labor. Therefore, they do not morally deserve the wealth. | **FAILS.** The heir did not create marginal value. Paying them offers no efficiency incentive. | **FAILS.** Being born is not a virtue. | **PASSES.** If the will is legal, the heir is entitled. |
  | **2. CEO Bonus** | **MIXED.** Did the CEO work hard? Maybe. But bonuses are usually tied to stock price, not hours. | **PASSES.** If the CEO created value, paying them aligns incentives for future value. | **NEUTRAL.** Profit isn't necessarily virtue. | **PASSES.** If the board approved it, it is legal. |
  | **3. Instinct Rescuer** | **FAILS.** She used instinct, not sustained effort/labor. | **FAILS.** Saving a child creates no market value; no economic incentive needed. | **PASSES.** It is *fitting* to praise heroism, regardless of effort. | **FAILS.** There is no contract for rescue. |

  ---

  ### Part 4: Diagnosis of Your Friend's Argument

  You asked to identify which version your friend was implicitly relying on when he dismissed inherited wealth.

  **Your Friend's Position:**
  Your friend is relying on **Combination 1: The Lockean Labor Theory.**
  *   **Earn:** Defined strictly as **Labor/Effort**.
  *   **Deserve:** Defined as **Pre-institutional Moral Entitlement**.

  **Why this is his position:**
  He argues that because the heir "didn't work for it," they shouldn't have it. This explicitly rejects Combination 2 (Contribution), because an heir might manage the wealth well (contribution), and it rejects Combination 4 (Legal), because inheritance is legal but he calls it undeserved. He is making a moral claim based on effort.

  **The Contradiction in His Logic:**
  Your friend's reliance on Combination 1 creates a vulnerability regarding the **CEO Bonus**.
  *   If "deserve" requires "labor/effort" (Combination 1), then a CEO who makes a high-stakes decision in a 10-minute meeting (low labor) that yields billions (high contribution) does **not** morally deserve a massive bonus under his own framework.
  *   To defend the CEO, your friend would have to switch to **Combination 2 (Contribution/Incentive)**.
  *   **The Trap:** He cannot use Combination 1 to attack inheritance *and* Combination 2 to defend CEO pay without being inconsistent. If desert is based on effort, the CEO often fails. If desert is based on value created, the heir might pass (if they preserve capital), but the Rescuer fails (no market value).

  **The Rescuer Problem:**
  Your cousin's example of the instinctive rescuer breaks Combination 1 (Labor). The rescuer exerted no "effort" in the economic sense; it was a reflex. Yet we feel she deserves praise.
  *   This suggests that **Combination 3 (Virtue/Fittingness)** is the only one that captures our intuition about the rescuer.
  *   However, Combination 3 does not help your friend attack inheritance, because one could argue wealth is not a "fitting" reward for anything, or conversely, that family stewardship is a virtue.

  ### Summary for Your Argument

  When you speak to your friend again, you can point out that he is treating "deserve" as a single concept when it is actually three different concepts doing different work:

  1.  **To attack Inheritance:** He uses **Moral Desert based on Effort**. (Defensible, but harsh).
  2.  **To defend CEO Pay:** He likely switches to **Economic Entitlement based on Contribution**. (Defensible for efficiency, but not "moral").
  3.  **To explain the Rescuer:** We use **Symbolic Fittingness based on Virtue**. (Defensible, but doesn't justify wealth).

  **The Conclusion:**
  The slogan "people deserve what they earn" is **false** if treated as a universal moral law because no single definition of "earn" covers the heir, the CEO, and the rescuer simultaneously.
  *   If "earn" = effort, the CEO and Rescuer don't deserve their rewards.
  *   If "earn" = value created, the Rescuer and Heir (usually) don't deserve theirs.
  *   If "earn" = virtue, the CEO and Heir (usually) don't deserve theirs.

  Your friend is implicitly arguing that **Effort** is the only valid currency for **Moral Entitlement**. You can challenge him by asking: *"Do you believe the CEO deserves her bonus because she suffered greatly (effort), or because she produced value (contribution)? If it's value, why doesn't the rescuer deserve money for the value of a life? If it's effort, why does the CEO deserve millions for a decision made in an hour?"* This forces him to admit he is using different definitions of "earn" for different cases.
