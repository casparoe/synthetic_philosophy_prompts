  hi! please act like a professional philosopher of language / psycholinguist and take your time with this — think carefully step by step, and start by brainstorming for yourself which sentences in the paragraph below are making a real empirical claim and which ones are just the author getting carried away, before you actually answer me. dont just give me a general essay about linguistic relativity or the sapir-whorf hypothesis, i already read the wikipedia page, i want to know what to actually trust in this specific paragraph. no sources or citations or reading lists needed — im 16, this is for a psych elective thing, i just need to know where the screwups are so i dont repeat them.

  ok so a friend sent me this bit from some pop psych blog and it summarized the whole idea like this:

  "the language you grow up with doesnt just label the world, it builds the world you experience. Whorf showed this with the Hopi: their grammar doesnt chop time up into past, present and future the way english does, so Hopi speakers experience time as one continuous process instead of a line you move along, and notions like being on time or wasting time just dont mean anything to them. linguistic relativity says that if your language has no word for something, you cant really think it. the classic example is that Inuit languages have lots of separate words for snow while we have just 'snow', so we literally cannot see the distinctions they see. psychologists have since confirmed a milder version of all this: russian has two basic colour words where english has 'blue', and russian speakers really are faster at telling two shades of blue apart, and people tested in a second language describe their own personality differently than they do in their first, so learning a language basically gives you a second self. the practical takeaway is that your language sets a hard limit on the thoughts available to you, and the only way to think something genuinely new is to learn a word for it from somewhere else."

  parts of that sound obviously wrong to me and parts sound kind of deep, but i cant tell which is which. like, i can definately think about stuff english has no single word for — the weird specific feeling when you're watching something with someone and you can tell theyre about to say exactly what you were about to say — but my friend says that dosent count because im still thinking in english words, just a bunch of them at once. also she's building her own language for a worldbuilding project and one of its grammer rules is that any time you talk about the future you have to mark it as either "already settled" or "still open", no neutral option, and she claims that if you grew up with that you literally could not think the thought "the future is undetermined" without it feeling like a contradiction. I pointed out that english forces you to mark every noun as singular or plural and we can still think about stuff that's neither, and she said that's different somehow but i couldnt follow why.

  so: is the paragraph a fair summary? go claim by claim and tell me what someone who actually defends linguistic relativity would happily accept, what they'd say is a caricature or an overstatement, and whether the "practical takeaway" at the end actually follows from the parts that are true or whether it quietly smuggles in something stronger. then tell me whether my "no word for it" example and her made-up language example are evidence for the strong version, against it, or just irrelevant — including whether she's right that her case is different from the singular/plural one.
