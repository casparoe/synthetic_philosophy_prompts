answer: |-
  You have stumbled upon one of the most famous and sophisticated objections to Immanuel Kant's moral philosophy. Your friend is arguing from Kant's **Categorical Imperative** (specifically the Formula of Universal Law), and your counter-argument is known in philosophy as the **problem of maxim formulation** (or sometimes "gerrymandering the maxim").

  You are asking two distinct questions:
  1.  **Practically:** Must you return the money?
  2.  **Philosophically:** Does your objection prove the moral test is broken?

  Here is an analysis of both.

  ### 1. The Philosophical Objection: Is the Test Manipulable?

  You are correct that the outcome of the universalizability test depends on how you describe your action (your "maxim").
  *   **Broad Maxim:** "Keep money paid to you by mistake." (Fails universalization; banking collapses.)
  *   **Narrow Maxim:** "Keep money paid by mistake *only* by large institutions that won't notice." (Seems to pass universalization.)

  Philosophers have debated this for decades. However, most Kantian scholars argue that your narrow maxim does not actually save the action, for three reasons:

  **A. The "Relevant Description" Constraint**
  You cannot formulate a maxim using *any* details you like; you must include the **morally relevant features** of the situation.
  *   Is the size of the bank morally relevant to whether you should keep property that isn't yours? Most ethicists would say no.
  *   The morally relevant description of your action is: "I will keep property I know does not belong to me."
  *   If you include irrelevant details (like "the bank is big") just to make the rule pass the test, you are manipulating the test, not using it. The test requires you to act on principles that respect rational agency, not on loopholes.

  **B. The Contradiction in Conception**
  Even if we accept your narrow maxim ("Keep money from big banks if they won't notice"), it fails when universalized.
  *   If *everyone* adopted this rule, banks would notice. The condition "unlikely to notice" would become false because the volume of theft would skyrocket.
  *   To compensate, banks would institute draconian security measures, freeze accounts more often, or charge higher fees to cover losses.
  *   Therefore, the practice of seamless, trust-based banking would still degrade. You are relying on the fact that *others* are honest to make your dishonesty work. You are making yourself an exception.

  **C. The Contradiction in Will**
  Kant argues that even if a world *could* exist where everyone kept mistaken money from big banks, you could not rationally *will* to live in it.
  *   To will this rule is to will a world where financial institutions assume customers are opportunistic.
  *   In that world, when *you* make a deposit, the bank might hold your funds for weeks to verify them. When *you* need a loan, they will assume you might exploit errors.
  *   You cannot rationally will a system that undermines your own future financial security.

  ### 2. The Legal and Practical Reality

  Leaving philosophy aside, the practical answer is unambiguous.

  **Unjust Enrichment**
  In almost every legal jurisdiction, keeping money deposited into your account by mistake is illegal. It falls under the legal doctrine of **unjust enrichment** or **conversion**.
  *   The money is not yours.
  *   The bank has a legal right to reverse the transaction.
  *   If you spend the money, you can be charged with theft.

  **The "Harm" Assumption**
  Your narrow maxim relies on the assumption that the bank is "unlikely to be much harmed." This is empirically risky.
  *   Banks have automated audit systems. A $2,000 discrepancy is easily flagged.
  *   If you spend the money and the bank reverses the deposit later, your account will go negative. You will owe the bank the money plus likely overdraft fees.
  *   If you refuse to pay, it goes to collections, damaging your credit score.

  ### Conclusion

  Your friend is right that you must return the money, but your objection highlights a genuine nuance in moral reasoning.

  **Is the test broken?**
  No. The test is not meant to be a game of semantic loopholes. It is a test of whether your principle can sustain a community of rational agents. By trying to carve out an exception for yourself based on the victim's size ("large institution"), you are acknowledging that the action is generally wrong, but you are hoping to exploit a specific vulnerability.

  **The Verdict**
  Your narrow formulation fails because it relies on a condition (that the bank won't notice or care) that would vanish if everyone acted that way. Furthermore, legally and practically, keeping the money exposes you to significant risk.

  **Recommendation:** Report the error to the bank immediately. It is the ethically consistent choice, and it protects you from legal and financial repercussions.

  *(Disclaimer: I am an AI, not an attorney. This information is for educational purposes and does not constitute legal advice.)*
