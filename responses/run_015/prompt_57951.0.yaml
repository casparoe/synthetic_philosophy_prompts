prompt: |-
  So I'm helping put together a workshop for non-philosophers — mostly nurses and family caregivers — on advance directives and we keep talking past each other about when the earlier self gets to boss around the later one. Could you make me a which-view-do-you-actually-hold quiz for them?

  Like 9 questions max, each one a little concrete story with two or three possible takes, and then a scoring key at the end that maps answer patterns onto four endpoints: hard precedent autonomy where the competent earlier self basically always wins, best-interests override where a happy but demented later self can win out, a relational/narrative one where what family and life story says matters, and a skeptical one where an old directive is just one piece of evidence with no special authority.

  The point is to sort people by gut reactions to cases, not labels, so please don't have any question that just asks if they beleive in autonomy or whatever. You have to use these three cases I keep arguing about with my sister: the professor who wrote refuse antibiotics if I get dementia but now with moderate dementia she seems cheerful and asks for treatment for pneumonia, the guy with bipolar who signs a Ulysses thing while stable saying hospitalize me next manic episode even if I say no, then revokes it while manic, and my weird one — an artist who leaves a video saying if I get dementia delete all my unfinished work so I'm not embarassed, but her later demented self loves flipping through the sketchbooks.

  Build the answer combos first and then place the four views in that space, and tell me if any combo is empty and why — like is it incoherent or just nobody defends it — and flag if your quiz can't really seperate two of the views. Keep the language super plain, no jargon.
