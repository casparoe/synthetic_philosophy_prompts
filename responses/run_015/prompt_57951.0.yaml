answer: |-
  ### Facilitator's Design Map (Read This First)

  Before you hand out the quiz, here is how the logic is built. This helps you explain *why* people are arguing past each other.

  **The Four Viewpoints (The Endpoints)**
  1.  **The Promise Keeper (Hard Precedent):** The signature on the paper is a binding promise. The "Earlier Self" is the boss.
  2.  **The Peace Maker (Best Interests):** Current happiness and safety matter most. A happy "Later Self" shouldn't suffer for a ghost.
  3.  **The Story Teller (Relational):** Decisions fit into the whole life story. Family and loved ones know the "real person" best.
  4.  **The Pragmatist (Skeptical):** Old papers are just old data. They aren't laws. The medical team and family weigh everything equally *now*.

  **The Logical Space & Empty Combos**
  I mapped these views on two axes: *Weight of Past Wishes* (High vs. Low) and *Who Decides* (Individual vs. Community/Context).
  *   **Empty Combo:** There is no stable view that is both "Hard Precedent" and "Best Interests." You cannot believe the Past Self *always* wins AND the Current Self's happiness *always* wins. If a participant scores high on both, they are likely conflicted or answering inconsistently.
  *   **Separation Flag:** The **Story Teller (Relational)** and **The Pragmatist (Skeptical)** are the hardest to separate. Both look beyond the paper.
      *   *The Fix:* In the quiz, **Relational** options focus on *identity* ("Is this who she was?"). **Skeptical** options focus on *authority* ("The paper isn't a law, the doctor decides").
      *   *Limitation:* In real life, these two often agree on the outcome. The quiz separates them by *reasoning*, not just results.

  ***

  ### The "Who Decides?" Quiz

  **Instructions:** Read the three short stories below. For each question, pick the **one** answer that feels most right to you. There are no wrong answers.

  #### Case 1: The Professor (Pneumonia)
  *A retired professor signed a paper years ago saying: "If I get dementia, do not treat me for pneumonia." Now she has moderate dementia. She seems cheerful. She gets pneumonia and asks for medicine to get better.*

  **1. What should the doctor do?**
  A. Follow the paper. Do not give antibiotics.
  B. Give the antibiotics. She is asking for them and seems happy.
  C. Ask her family what fits her life story best.
  D. Treat the paper as just one note. The doctor should decide based on the whole situation.

  **2. Why?**
  A. Her earlier self made a promise that still counts.
  B. Her current self is suffering if we let her go.
  C. Her family knows who she really is better than a piece of paper.
  D. People change their minds. The old paper doesn't have special power.

  **3. Her family is split. Half say "Honor her wish," half say "Save her." What matters most?**
  A. The written wish overrides the family's disagreement.
  B. Saving her life overrides the family's disagreement.
  C. The family needs to find consensus on what fits her narrative.
  D. The medical team should make the call since the family can't agree.

  #### Case 2: The Bipolar Contract (Hospitalization)
  *A man with bipolar disorder signs a "Ulysses Contract" while stable. It says: "If I get manic, hospitalize me even if I say no." Later, he goes manic. He is energetic but unsafe. He yells, "I revoke the contract! Let me go!"*

  **4. Can he cancel the contract while he is manic?**
  A. No. The stable self's signature locks it in.
  B. Yes. The person in the room right now gets to choose.
  C. Only if his family agrees that this mania is "out of character."
  D. It depends. The contract is just evidence of what he used to think.

  **5. Should staff restrain him to give medication?**
  A. Yes. Enforce the original agreement.
  B. No. Restraint hurts the person standing here now.
  C. Only if his loved ones say this is part of his long-term recovery story.
  D. Maybe. Use the least force needed, ignoring the contract's special status.

  **6. Six months later, he is stable again. He says, "Thank you for holding me." Does this prove the contract was right?**
  A. Yes. It shows the Earlier Self knew best.
  B. No. He was still harmed during the mania.
  C. It shows his support network helped him return to his story.
  D. It's just luck. It doesn't prove the paper had authority.

  #### Case 3: The Artist (Sketchbooks)
  *An artist leaves a video directive: "If I get dementia, destroy my unfinished sketches. I don't want people seeing my messy work." Later, with dementia, she happily flips through the sketchbooks every day. It brings her joy.*

  **7. Do you destroy the sketches?**
  A. Yes. She ordered it.
  B. No. It makes her happy now.
  C. Ask her heirs if the art is part of her legacy.
  D. Keep them for now. The video isn't a legal command.

  **8. She says, "I love these drawings." Is she "wrong"?**
  A. No, but her Earlier Self's judgment counts more.
  B. No, her current joy is the only truth that matters.
  C. Her family knows if she would truly be embarrassed.
  D. "Wrong" isn't the point. Her preference today is just new data.

  **9. Who has the final say?**
  A. The person who signed the video.
  B. The person living with the dementia.
  C. The people who knew her whole life.
  D. The caretakers, weighing all factors equally.

  ***

  ### Scoring Key (For Facilitators)

  Tally the answers for each column. The highest score indicates the participant's default "gut" position.

  | Question | **A: The Promise Keeper** (Hard Precedent) | **B: The Peace Maker** (Best Interests) | **C: The Story Teller** (Relational) | **D: The Pragmatist** (Skeptical) |
  | :--- | :---: | :---: | :---: | :---: |
  | **1** | A | B | C | D |
  | **2** | A | B | C | D |
  | **3** | A | B | C | D |
  | **4** | A | B | C | D |
  | **5** | A | B | C | D |
  | **6** | A | B | C | D |
  | **7** | A | B | C | D |
  | **8** | A | B | C | D |
  | **9** | A | B | C | D |
  | **TOTAL** | **\_\_\_\_** | **\_\_\_\_** | **\_\_\_\_** | **\_\_\_\_** |

  **Interpreting the Results:**

  *   **Mostly A (Promise Keeper):** You believe the competent "Earlier Self" is the boss. You worry that if we ignore old wishes, we stop respecting people's long-term values. *Risk:* You might sacrifice a happy current person for a past rule.
  *   **Mostly B (Peace Maker):** You believe current well-being is king. You worry about hurting a confused person to satisfy a "ghost." *Risk:* You might ignore deep values the person held for decades.
  *   **Mostly C (Story Teller):** You believe identity is shared. You look at the whole life and the family web, not just a signature or a mood. *Risk:* Family disagreement can paralyze decision-making.
  *   **Mostly D (Pragmatist):** You believe old documents are just information, not orders. You want flexibility to handle the messy reality of today. *Risk:* It can feel like "anything goes" and creates uncertainty for families.

  **Discussion Tips for the Workshop:**
  1.  **Look for Ties:** If someone ties between **A** and **B**, they are feeling the core tension of the workshop (Past vs. Present). Ask them: *"In Case 1, why did you pick A, but in Case 3, why did you pick B?"* This reveals which *kind* of harm worries them more (breaking promises vs. causing sadness).
  2.  **The C/D Overlap:** If someone scores high on **C** and **D**, they agree that the *paper* shouldn't rule, but they disagree on *who* should rule (Family vs. Doctor). This is a great conversation about trust in institutions vs. trust in kin.
  3.  **The "Empty" Conflict:** If someone claims to be **A** and **B** equally, gently point out that in Case 1, you literally cannot both treat and not treat. Ask them which pain is harder to live with: the patient's discomfort, or breaking a promise?

  ***

  ### Design Limitations (For Your Planning)

  *   **Why 4 Options?** You asked for 2-3 takes, but I used 4. I had to do this to map cleanly to your 4 required endpoints. I kept the text very short to reduce cognitive load.
  *   **Separation Issue:** As noted in the Design Map, **Relational (C)** and **Skeptical (D)** often lead to the same action (ignoring the strict paper). The quiz separates them by asking *who* gets to decide (Family/Story vs. Doctor/Context). If your group doesn't care about that distinction, these two scores might blur.
  *   **Empty Combos:** You won't find a coherent person who scores max on **A** and **B**. If you do, they likely misunderstood the questions. This is a useful teaching moment about the incompatibility of "Always follow the past" and "Always follow current happiness."
