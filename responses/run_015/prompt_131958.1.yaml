prompt: |-
  I sit on the acquisitions and display committee of a small museum. We own a seventeenth-century panel painting in poor condition: much of the original paint layer is gone, and what a visitor actually sees is largely the work of nineteenth-century restorers. A conservator has proposed exhibiting a technically flawless replica instead, made by a specialist using period materials and techniques and indistinguishable from the panel by any visitor, and moving the panel into storage on the grounds that the experience we offer the public would be unchanged while the object itself would be preserved.

  I want to object that this would be cheating the public: the original has something the replica lacks, and putting the replica in its frame exploits that fact. But I cannot say what the something is. It is not a property anyone can see, since by hypothesis the two are visually identical; and if I say that it is merely provenance, that this one was made by the named painter, then I seem to be valuing a pedigree rather than a picture, which looks like philistinism of another kind.

  So: what does the original have that the replica does not, and in virtue of what could that difference matter to the experience or the value of the work, and not only to its price or its place in art history? And does the condition of our panel undermine the answer — if what matters is physical continuity with the painter's hand, have we already lost the original to the restorers, and if not, why not?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Context:** Member of an acquisitions/display committee at a small museum.
      *   **Object:** 17th-century panel painting, poor condition (much original paint gone, mostly 19th-century restoration).
      *   **Proposal:** Exhibit a flawless replica (period materials/techniques, visually indistinguishable) and store the original.
      *   **Rationale for Proposal:** Public experience unchanged, original preserved.
      *   **User's Intuition:** This feels like "cheating the public." The original has something the replica lacks.
      *   **User's Struggle:** Cannot articulate *what* that "something" is. It's not visual (they look the same). It's not just provenance/pedigree (feels like philistinism/snobbism).
      *   **Key Questions:**
          1.  What does the original have that the replica does not?
          2.  Why does that difference matter to the *experience* or *value* of the work (not just price/history)?
          3.  Does the poor condition/restoration undermine this value (have we already lost the "original")?

  2.  **Deconstruct the Philosophical/Aesthetic Issues:**
      *   **Authenticity:** This is the core concept. Walter Benjamin's "The Work of Art in the Age of Mechanical Reproduction" (Aura) is the classic reference, but needs nuance.
      *   **Ontology of Art:** Is the artwork the *image* or the *object*? If it's just the image, the replica suffices. If it's the object, the replica fails.
      *   **The "Trace":** The idea of the artist's hand, physical continuity, indexicality (like a fingerprint).
      *   **The Viewer's Experience:** Does knowing something is real change how we look at it? (Psychological/Phenomenological aspect).
      *   **The Restoration Problem:** If 80% is 19th-century overpaint, is it still a 17th-century artwork? Where is the threshold?

  3.  **Brainstorming Answers to "What is the 'Something'?"**
      *   *Idea 1: Historical Witness.* The object survived time. It was there. The replica was made yesterday.
      *   *Idea 2: Indexicality.* The physical connection to the artist's action. Even if invisible, it's a causal link.
      *   *Idea 3: Risk/Vulnerability.* The original is fragile; the replica is safe. The stakes are different.
      *   *Idea 4: The "Aura" (Benjamin).* The unique presence in time and space.
      *   *Idea 5: Cognitive Framing.* Knowing it's real changes the psychological engagement. It's not "seeing," it's "encountering."

  4.  **Addressing the Restoration/Condition Issue:**
      *   If most paint is gone, is the "original" gone?
      *   Counter-argument: The *substrate* (the panel) is likely original. The remaining fragments are original.
      *   Analogy: Ship of Theseus. At what point does it cease to be the ship?
      *   Nuance: A palimpsest. The 19th-century restoration is *also* history now. Removing it or hiding it erases that layer of history.
      *   The "Ruins" Argument: A ruin is valuable *because* it is damaged, not despite it. Hiding damage falsifies history.

  5.  **Drafting the Response - Structure:**
      *   **Validation:** Acknowledge the depth and difficulty of the question. It's a classic philosophical problem in museology.
      *   **Part 1: Defining the "Something" (Authenticity beyond Vision).**
          *   Indexicality (The Trace).
