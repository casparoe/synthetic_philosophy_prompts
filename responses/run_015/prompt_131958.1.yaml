answer: |-
  This is one of the most profound questions in the philosophy of art and museology. You are grappling with the distinction between the *aesthetic image* (what is seen) and the *artistic object* (what is encountered). Your intuition that swapping the object would be "cheating" is widely shared by philosophers, conservators, and ethicists, but articulating *why* requires moving beyond visual properties.

  Here is a framework for your objection, broken down into the three components you requested: what the difference is, why it matters to the experience, and how the condition of the panel affects the argument.

  ### 1. What does the original have that the replica does not?

  You are correct that the difference is not a visual property. If two things are visually indistinguishable, the difference lies in their **causal history** and their **indexicality**.

  *   **Indexicality (The Trace):** The original panel is an index, like a fingerprint or a footprint. It bears the physical trace of the artist's actions 400 years ago. Even if the paint is gone, the ground layer, the panel wood, and the remaining fragments are physical effects caused by the artist's presence. The replica, no matter how skilled, is a effect caused by a modern conservator. The original connects the viewer to the artist through a physical chain of causality; the replica connects the viewer to the conservator.
  *   **Historical Witness:** The original is a survivor. It has existed continuously in time and space from the 17th century to today. It has "witnessed" history. The replica has no past; it begins its existence the moment it is finished. The original possesses a temporal depth that the replica lacks.
  *   **Vulnerability:** The original is fragile and irreplaceable. The replica is robust and replaceable. This vulnerability is a property of the object that dictates how we treat it, even if it doesn't change how it looks.

  ### 2. Why does this difference matter to the *experience* (and not just price/history)?

  If the viewer cannot see the difference, does the difference change the *experience*? Yes, because aesthetic experience is not purely retinal; it is cognitive and psychological.

  *   **The Cognitive Frame:** Knowing you are standing before the actual object changes the psychological stance of the viewer. This is not "snobbishness"; it is the difference between looking at a photograph of a loved one and standing in the room with them. The image may be identical, but the *relationship* is different. When a visitor knows they are facing the original, they are engaging in an act of **communion with the past**. When they face a replica, they are engaging in **study of an image**.
  *   **The Stakes of Attention:** We look differently at things that are rare and fragile. If you know a bridge is made of glass, you walk differently than if you know it is steel, even if both look transparent. Knowing the object is the original heightens the viewer's attention. It adds a layer of gravity and reverence to the act of looking. Removing that knowledge flattens the experience.
  *   **Institutional Trust:** Museums operate on a contract of truth with the public. If a museum presents a replica as the primary experience (even if labeled, but intended to be "indistinguishable" to preserve the "view"), it shifts the museum's role from a guardian of heritage to a producer of simulations. This undermines the visitor's trust that what they are feeling (the awe of the original) is actually justified.

  ### 3. Does the condition of the panel undermine this answer?

  This is the hardest part of your dilemma. If 80% of the paint is 19th-century restoration, haven't we already lost the "original"?

  **The Argument for the Panel's Continued Authenticity:**

  *   **The Substrate Matters:** In panel painting, the wood support is not just a canvas; it is integral to the work. The artist prepared it, sized it, and painted on *that specific wood*. The physical continuity of the panel provides the anchor for the object's identity.
  *   **The Restoration is Now History:** The 19th-century overpaint is no longer just "damage"; it is now a historical layer in its own right. It tells the story of how the 19th century viewed the 17th century. To remove the panel because it is "too restored" is to erase the evidence of its survival. The object is now a **palimpsest**: a 17th-century core with 19th-century interventions. This complex history is valuable.
  *   **The Replica Erases History; The Panel Preserves It:** The proposed replica would be a "perfect" 17th-century image. It would hide the damage and the restoration. By exhibiting the replica, you are presenting a fiction of wholeness. By exhibiting the panel, you are presenting the truth of survival.
      *   *Crucial Distinction:* The 19th-century restorer was likely trying to save the object for the future. The modern proposal is to hide the object to save it. The former adds to the object's biography; the latter removes the object from its biography.
  *   **The "Ship of Theseus" Threshold:** While philosophers debate when an object ceases to be itself, in museology, the threshold is usually crossed only when the *intent* of the object is lost. The intent of this painting was to be a visual representation. If the 19th-century restoration allows that representation to be legible, the function remains. If the panel were 100% overpainted, it would be a 19th-century copy. But if there are fragments of the original, the causal chain is unbroken.

  ### How to Frame Your Objection to the Committee

  You might argue that the proposal confuses the **information** of the art with the **presence** of the art.

  1.  **The "Ruins" Argument:** We do not restore the Colosseum to look new and then hide the ruins. We display the ruins *because* they are ruins. The damage and the restoration are part of the object's biography. A flawless replica sanitizes this history. It presents a lie of perfection.
  2.  **The Ethical Labeling Problem:** If the replica is "indistinguishable," the committee is effectively planning to deceive the public's senses, even if their intellects are informed by a label. This creates a dissonance: the eye says "17th century," the label says "21st century." This undermines the phenomenological experience of the museum.
  3.  **The Value of Fragility:** The museum's job is not just to show images; it is to mediate a relationship with time. That relationship requires the risk of the real. Storing the original treats it as a data bank to be protected, rather than a cultural totem to be encountered.

  **Conclusion:**
  The original has **continuity**. It is the same physical entity that the artist touched. The replica has **similarity**.
  The condition of the panel does not negate this continuity; it complicates it. But a complicated truth (a damaged, restored original) is infinitely more valuable to a museum's mission than a simple lie (a flawless replica). To swap them is to prioritize the *image* over the *object*, and in doing so, to turn the museum into a theme park rather than a temple of memory.

  You are not being a philistine by valuing the pedigree; you are being a humanist by valuing the connection across time. That connection cannot be replicated.
