      *   **Deliverables:**
          1.  Restatement of Asymmetry + Rivals in CBA terms.
          2.  CBA breakdown of the two cases (numbers, sources, results).
          3.  *Residue Report:* What translates cleanly, what distorts, what is unwritable.
          4.  *Verdict:* Limitation of CBA vs. Philosophers dressing up bookkeeping.
      *   **Tone:** Professional, rigorous, suitable for handing to a seminar instructor (academic but accessible to an economist).
      *   **Constraint:** Reason it out, don't just list readings. Flag smuggled assumptions.

  2.  **Deconstruct the Procreation Asymmetry (Jan Narveson's formulation):**
      *   Claim 1: Presence of Pain is Bad.
      *   Claim 2: Presence of Pleasure is Good.
      *   Claim 3: Absence of Pain is Good (even if no one exists to enjoy that absence).
      *   Claim 4: Absence of Pleasure is Not Bad (unless someone is deprived).
      *   *Core Tension:* We have a duty to avoid creating miserable people, but no duty to create happy people.

  3.  **Translate to CBA Vocabulary:**
      *   *Standard CBA:* Sum of WTP/WTA (Willingness to Pay/Accept) or CV (Compensating Variation). Requires a subject.
      *   *Person-Affecting View (PAV):* Matches standard CBA. Only count impacts on existing/identified individuals. Non-existence = zero baseline.
      *   *Total/Impersonal View (TIV):* Matches "Potential Pareto" extended to potential people. Treats "existence" as a state with utility value. Requires valuing "life itself."
      *   *Environmental Values:* Existence value (valuing something exists even if I don't use it). Bequest value (valuing it for future gens). Option value (valuing the option to use it later).
      *   *Discounting:* Crucial for future people.

  4.  **Drafting the Translation (Mental Sandbox):**
      *   *Asymmetry in CBA:* It's weird. Usually, CBA is symmetric (Benefits - Costs). The Asymmetry says Avoiding Cost (pain) > Gaining Benefit (pleasure) in the context of creation.
      *   *PAV in CBA:* Standard Kaldor-Hicks. If no one exists, WTP = 0.
      *   *TIV in CBA:* Treat the "potential person" as a stakeholder with a shadow price on their utility.
      *   *Problem:* CBA relies on *revealed* or *stated* preference. Non-existent people have no preferences. So, TIV requires *imputed* preferences or an objective welfare function. This is a major translation friction point.

  5.  **Analyzing the Test Cases:**
      *   *Case 1: Delayed Creation.*
          *   *Philosophy:* Asymmetry says "No loss" (no subject deprived). Intuition says "10 years lost."
          *   *CBA:* If we treat the future person as a stakeholder (TIV), we discount their 10 years. If we treat them as non-existent until conception (PAV), the delay is neutral *unless* it affects existing people (parents' WTP).
          *   *The Twist:* If the *same* person is born later (numerical identity preserved), PAV might count it. If it's a *different* person (Non-Identity Problem), PAV says 0. The prompt implies "someone's conception... they would otherwise have had." This suggests numerical identity is held constant (magic button).
          *   *CBA Calculation:* Discounting. $V_{t=0}$ vs $V_{t=10}$. Loss = $(1 - e^{-r \cdot 10}) \times \text{Life Value}$.
      *   *Case 2: Risky Creation.*
          *   *Philosophy:* Asymmetry says Count Bad, Ignore Good. Net = Negative. Don't create.
          *   *CBA:* Expected Value. $0.5 \times (+WTP) + 0.5 \times (-WTA)$.
          *   *Friction:* CBA usually sums expected utility. Asymmetry requires a kinked utility function or a lexicographic constraint (Safety First).
          *   *Valuation:* How to value a "bad life"? WTA to avoid existence? How to value "good life"? WTP to exist? (Suicide prevention data vs. fertility treatment data).

  6.  **Developing the Residue Report (The Core Insight):**
      *   *Clean Translation:* Presence of Pain/Pleasure (Claims 1 & 2). This is standard utility/welfare.
      *   *Distorted Translation:* Absence of Pain (Claim 3). CBA calls this "Avoided Cost." But who gets the credit? In CBA, avoided cost must accrue to a budget holder. In Asymmetry, it accrues to "the void."
      *   *Unwritable:* Absence of Pleasure (Claim 4). CBA treats unmet demand as a deadweight loss *if* there is a consumer. If no consumer, no loss. This actually matches PAV, but contradicts TIV.
      *   *The "Currency" Problem:* CBA currency is *preference satisfaction* of *agents*. Non-agents have no currency. To make TIV work, you have to switch currency from "Preference" to "Objective Welfare." This is a category error in standard CBA.
      *   *Smuggled Assumptions:* Discount rates (ethics vs. market), Standing (who counts), Risk Aversion (how we treat the coin flip).

  7.  **Formulating the Verdict:**
      *   Is CBA limited? Yes, because it is methodologically individualist.
      *   Are philosophers dressing up bookkeeping? Partially. The Asymmetry *is* a bookkeeping rule about moral standing. But it claims moral truth, not just accounting convenience.
      *   *Conclusion:* The residue isn't just noise; it's the boundary of methodological individualism. CBA cannot handle "impersonal goods" without ceasing to be CBA and becoming Welfare Utilitarianism.

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the user's position (Economist in Phil seminar).
      *   **Section 1: The Translation.** Define Asymmetry, PAV, TIV using CBA terms.
      *   **Section 2: The Test Cases.** Run the numbers (conceptually).
      *   **Section 3: The Residue Report.** The "Unwritable Lines."
      *   **Section 4: The Verdict.** Limitation vs. Bookkeeping.
      *   **Tone Check:** Ensure it sounds like an MPP capstone or a rigorous memo. Avoid overly flowery philosophical jargon where economic terms suffice, but keep the philosophical precision.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* In the Delayed Creation case, if the *same* person is born later, standard PAV *does* count the loss because the person exists (eventually) and is harmed by the delay. The Non-Identity Problem arises if the delay changes *who* is born. The prompt says "postpones someone's conception... without changing... the life they would otherwise have had." This implies Numerical Identity is fixed. I need to be careful here. If identity is fixed, PAV counts the loss. If identity shifts (standard Non-Identity), PAV says 0. The prompt says "almost everyone... thought ten good years had plainly been lost." This suggests the intuition fights the Asymmetry *if* the Asymmetry implies no loss. I need to clarify that the Asymmetry is usually tied to the Non-Identity Problem. I will assume for the sake of the exercise that the "Asymmetry view" being tested implies the Non-Identity logic (different person born later = no harm). *Wait, re-reading prompt:* "postpones someone's conception... without changing... the life they would otherwise have had." This implies the *same* individual. If it's the same individual, the Asymmetry (Claim 4) says absence of pleasure is not bad *unless there is someone deprived*. If the person exists later, they are deprived of the first 10 years. So the Asymmetry *should* count it. Why did the seminar think it was hard? Ah, because often "Delayed Creation" is a proxy for Non-Identity (different sperm/egg = different person). I will address this ambiguity: If Identity Holds -> CBA works. If Identity Fails (Non-Identity) -> CBA breaks. I will assume the "Hard Case" implies the Non-Identity interpretation (different person), otherwise it's trivial.
      *   *Actually, looking closer:* "postpones someone's conception... without changing... the life they would otherwise have had." This is the *Same Number Quality Claim* setup. If I delay conception, usually a *different* child is conceived (different genetic material). If the prompt assumes the *same* soul/person, it's metaphysically weird. I will treat it as the Non-Identity case (Different Person) because that's where the Asymmetry does heavy lifting. If it's the same person, Claim 4 applies (someone is deprived). If it's a different person, Claim 4 applies (no one is deprived). The intuition "10 years lost" suggests we care about the *slot* of existence, not the *person*. This is the Impersonal view.
