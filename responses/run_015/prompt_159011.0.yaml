answer: |-
  **MEMORANDUM**

  **TO:** Population Ethics Seminar Instructor
  **FROM:** [Your Name], MPP Candidate
  **SUBJECT:** Translating the Procreation Asymmetry into Applied Cost-Benefit Analysis
  **DATE:** October 26, 2023

  ### 1. Executive Summary

  The following analysis attempts to map the Procreation Asymmetry and its rival interpretations (Person-Affecting vs. Total/Impersonal) onto the standard framework of Regulatory Impact Analysis (RIA) and Cost-Benefit Analysis (CBA). The goal is to determine whether the moral disagreement in the seminar is substantive or merely a dispute over accounting conventions (specifically, "standing" and "baseline definitions").

  **Key Finding:** The Procreation Asymmetry cannot be fully expressed in standard CBA vocabulary without violating the methodological individualism that defines CBA. Specifically, the claim that "the absence of pain is good even when no one exists to enjoy that absence" requires a line item in the benefit-cost table for a stakeholder with no standing. This suggests the residue is not just bookkeeping; it is a fundamental incompatibility between preference-based welfare economics and impersonal moral axioms.

  ---

  ### 2. Translating the Framework

  To run the machinery, we must first define the moral claims in economic terms.

  #### A. The Procreation Asymmetry (Narveson Formulation)
  In CBA terms, the Asymmetry proposes a **kinked welfare function** regarding existence:
  1.  **Presence of Pain:** A negative Compensating Variation (CV). Existing stakeholders have a Willingness to Pay (WTP) to avoid this. *Standard CBA.*
  2.  **Presence of Pleasure:** A positive CV. Existing stakeholders have a WTP to gain this. *Standard CBA.*
  3.  **Absence of Pain (No Subject):** A positive benefit entry in the social welfare function, *even if WTP = 0* because no subject exists to hold preferences. *Violation of Standard CBA.*
  4.  **Absence of Pleasure (No Subject):** A zero entry. No deadweight loss is recorded because there is no consumer surplus to lose. *Consistent with Standard CBA.*

  #### B. Rival Interpretation 1: Person-Affecting View (PAV)
  *   **CBA Translation:** This is **Standard Kaldor-Hicks Efficiency** with strict standing rules.
  *   **Standing:** Restricted to actually existing persons (or those whose identity is fixed independent of the policy).
  *   **Baseline:** Non-existence is a utility of zero, but it is not a *state* that can be improved or worsened. You cannot compensate a non-existent person.
  *   **Implication:** Policies are evaluated solely on impacts to the "reference population." Future people count only if they are identifiable victims of harm (e.g., radioactive waste), not as beneficiaries of existence.

  #### C. Rival Interpretation 2: Total/Impersonal View (TIV)
  *   **CBA Translation:** This is **Potential Pareto Improvement** extended to potential stakeholders.
  *   **Standing:** Granted to "possible persons."
  *   **Valuation:** Requires an **Objective Welfare Function** rather than revealed preference. Since potential persons cannot reveal preferences, the analyst must impute a "Value of Statistical Life" (VSL) or "Quality-Adjusted Life Year" (QALY) weight to the state of existence itself.
  *   **Implication:** Existence is treated as a **Public Good** with **Existence Value**. The "benefit" of creating a happy person is the existence value held by the universe (or society) that they exist, plus their own experienced utility.

  ---

  ### 3. Case Studies: CBA Breakdown

  Here I apply the translated machinery to the two seminar cases. I have assumed a standard discount rate ($r$) and a standard value for a life-year ($V_{LY}$).

  #### Case 1: The Delayed-Creation Case
  *Scenario:* Pressing a button postpones conception by 10 years. The resulting life is identical in quality and length.
  *Philosophical Intuition:* 10 good years are lost (Impersonal view).
  *Asymmetry/PAV Intuition:* If the delay results in a *different* person (Non-Identity Problem), no one is deprived. Loss = 0.

  **CBA Execution:**
  *   **Line Item 1: Parental WTP.** Parents may have a WTP to conceive now vs. later. (Likely negative if they want to wait, positive if they want to start). Let's assume neutral for the thought experiment.
  *   **Line Item 2: The Child's Surplus.**
      *   *PAV Approach:* If the delay changes genetic identity (Non-Identity), the "original" child never exists. Their consumer surplus is undefined. The "new" child exists and has positive surplus, but without them, there is no loss. **Net Benefit = 0.**
      *   *TIV Approach:* We treat the "slot" of existence as having value. We apply the social discount rate ($r$) to the stream of utility.
      *   *Calculation:* Loss = $\sum_{t=0}^{10} V_{LY} \cdot e^{-rt}$.
      *   *Data Source:* VSL derived from labor market risk premiums, annualized over 10 years.
  *   **Result:** The PAV CBA shows no inefficiency. The TIV CBA shows a deadweight loss equal to the discounted present value of 10 life-years.

  **The Friction:** The PVA result feels counterintuitive because CBA usually assumes *time* matters. But under PAV, *who* matters more than *when*. The CBA table cannot record a loss for a person who never exists, even if "humanity" lost 10 years of aggregate utility.

  #### Case 2: The Risky-Creation Case
  *Scenario:* Option A: Create a child (50% chance Good Life, 50% chance Bad Life). Option B: Create no one.
  *Asymmetry Intuition:* Count the downside (Bad Life), ignore the upside (Good Life). Net Negative. Do not create.
  *Standard CBA Intuition:* Expected Value. If $0.5(U_{good}) + 0.5(U_{bad}) > 0$, create.

  **CBA Execution:**
  *   **Line Item 1: Expected Consumer Surplus.**
      *   $E[CS] = 0.5 \times WTP_{good} + 0.5 \times WTA_{bad}$.
      *   $WTP_{good}$: What would the child pay to exist? (Revealed by suicide prevention data/fertility treatments).
      *   $WTA_{bad}$: What compensation would the child require to accept a miserable life? (Likely infinite or extremely high).
  *   **Line Item 2: Risk Premium.**
      *   Standard CBA applies risk aversion. Society might pay a premium to avoid the variance.
  *   **The Asymmetry Constraint:** To model the Asymmetry, we must impose a **Lexicographic Constraint** or a **Kinked Loss Function**.
      *   If $U_{bad} < \text{Threshold}$, then Benefit = $-\infty$, regardless of $U_{good}$.
      *   Alternatively, we set the weight on $U_{good}$ to 0 for potential persons, but weight on $U_{bad}$ to 1.
  *   **Result:** Standard CBA (Expected Utility) might recommend creation if the good life is very good. Asymmetry-CBA forbids it.

  **The Friction:** Standard CBA treats risk as a mathematical expectation. The Asymmetry treats the *risk of harm* as a categorical veto. This requires changing the decision rule from *Maximize Expected Net Present Value* to *Minimize Maximum Regret* (Minimax).

  ---

  ### 4. The Residue Report

  This section details what translates cleanly, what distorts, and what is unwritable.

  #### A. Clean Translations
  1.  **Presence of Pain/Pleasure:** These map perfectly to negative and positive CV. CBA is fluent in measuring harm and benefit to existing agents.
  2.  **Discounting:** The seminar's debate about future generations maps directly to the choice of the social discount rate ($r$). A high $r$ mimics the Person-Affecting view (future people count less); a low/zero $r$ mimics the Total View.
  3.  **Risk:** The "Risky Creation" case maps to Expected Utility Theory, provided we accept risk aversion parameters.

  #### B. Distorted Translations (Smuggled Assumptions)
  1.  **Existence Value:** In environmental economics, *I* pay for the existence of pandas. In population ethics, the Asymmetry claims the absence of pain is good *in itself*. To put this in a CBA table, I have to pretend "Society" is the buyer of "Pain Absence." This smuggles in a **Paternalistic Welfare Function**. I am no longer measuring *their* WTP; I am imputing *my* valuation of *their* state.
  2.  **The Baseline:** CBA requires a counterfactual baseline.
      *   *PAV Baseline:* Non-existence = 0 utility, but also 0 standing.
      *   *TIV Baseline:* Non-existence = 0 utility, but negative standing (a loss of potential).
      *   *Distortion:* Switching between these baselines mid-analysis changes the "Net Benefit" without changing the physical outcomes. This reveals that the disagreement is partly about **Accounting Identity**, not just welfare.

  #### C. The Unwritable Lines (The Hard Residue)
  1.  **Benefits to No One:** The Asymmetry claim that "Absence of Pain is Good (even with no subject)" is **unwritable** in standard CBA.
      *   *Reason:* CBA currency is *preference satisfaction*. Preferences require a holder. A benefit without a holder is like a dollar bill without an owner—it cannot be entered into a ledger of exchange or welfare.
      *   *Consequence:* To write this line, you must stop doing CBA (preference-based) and start doing Utilitarianism (objective welfare-based).
  2.  **The Non-Identity Problem:** In the Delayed-Creation case, if the person changes, PAV says "No Impact." CBA agrees. But our moral intuition says "Loss."
      *   *Reason:* CBA is methodologically individualist. It cannot value "Humanity" as an aggregate entity distinct from the sum of specific individuals. If the specific individuals are different, the aggregate is technically a different dataset.
      *   *Consequence:* CBA cannot capture the value of *continuity* or *potentiality* unless we assign standing to "Possible Persons," which breaks the requirement for revealed preference.

  ---

  ### 5. Verdict: Limitation or Bookkeeping?

  You asked whether this residue points to a real limitation of CBA or philosophers dressing up a bookkeeping convention.

  **Verdict: It is a Real Limitation of CBA as a Moral Decision Procedure.**

  It is not merely bookkeeping. The "bookkeeping" of CBA (standing, baselines, preference sovereignty) is not neutral; it encodes a specific moral ontology: **Methodological Individualism.**

  1.  **Constitutive Definition:** The currency of CBA is constitutively defined over existing preference-holders. A line item for a "benefit to no one" is not just missing; it is category-error unwritable. You cannot calculate a WTP for a subject that cannot conceptualize trade-offs.
  2.  **Policy Implications:**
      *   **Climate Change:** If we use standard CBA (PAV), we heavily discount future generations (high $r$) because they are different people (Non-Identity). This justifies under-investment in mitigation. The "Impersonal" view (low $r$, TIV) demands aggressive mitigation. The difference is not just a parameter; it is a moral stance on whether *potential* people count.
      *   **Prenatal Screening:** CBA naturally aligns with the Asymmetry here. We screen to prevent suffering (counted cost) but do not mandate conception to create happiness (uncounted benefit). CBA handles this well because it aligns with parental WTP.
      *   **Pronatalist Transfers:** CBA struggles. If we subsidize births, we are paying for "Potential Utility." Standard CBA cannot justify this unless we count the child's future tax contributions (fiscal impact) or the parents' WTP. We cannot justify it based on the *child's* gain from existence, because the child had no prior WTP to be born.

  **Conclusion for the Seminar:**
  The philosophers are not merely dressing up bookkeeping. They are identifying the boundary conditions of welfare economics. The Procreation Asymmetry highlights that **CBA is a tool for allocating resources among existing agents, not for evaluating the creation of agents.**

  When we try to force population ethics into CBA, we must either:
  1.  **Break CBA:** By imputing preferences to the non-existent (switching to Objective Utilitarianism).
  2.  **Accept Blind Spots:** By acknowledging that CBA will systematically undervalue policies that create happy people (because their benefit is unwritable) while correctly valuing policies that prevent miserable people (because their harm is writable as avoided cost to society/parents).

  The "instability" the second group in your seminar feels is the friction of trying to use a tool designed for *allocation* to solve a problem of *generation*. The residue is real. It means that for policies where the affected parties do not yet exist, CBA is not a neutral arbiter; it is a structural bias toward the Person-Affecting View.

  **Recommendation:** Do not try to solve the Asymmetry with CBA. Use CBA to clarify the *cost* of adhering to the Asymmetry. Show the seminar that adopting the Asymmetry (PAV) is equivalent to setting the shadow price of "Potential Life" to zero. That is a defensible economic position, but it must be acknowledged as an ethical axiom, not an empirical finding.
