  *   **Case 5 (Permitted):** This is the subtle case. A constitution amending itself is permitted because the *procedure* (the amendment clause) remains invariant *during the act of amendment*. The old clause validates the new clause. The identity of the legal system persists because the ground of validity (the prior rule) existed before the change. This distinguishes it from Case 4, where the ground shifts continuously during the process.
