  **The Unlisted Case: Scientific Methodology**
  Consider a scientific research program that revises its own criteria of empirical adequacy in direct response to anomalous data, with no untouched external methodological standard.
  *   **Verdict:** **Breach.**
  *   **Reasoning:** This is structurally identical to Case 4 (Self-Modifying Loss). The "criteria of empirical adequacy" are the loss function of science; they define what counts as a successful theory. If these criteria are revised *because* the data conflicts with them, the standard of "adequacy" is no longer independent of the data it judges. Without a fixed methodological meta-level (e.g., logical consistency, reproducibility) that remains invariant during theory revision, the program cannot claim progress, only drift. It loses the normative force required to distinguish "correction" from "change."

