answer: |-
  To: Research Steering Committee
  From: Director, Prosaic Alignment Initiative
  Subject: Strategic Prioritization for Compositional Alignment (Years 1–3)

  You have correctly identified the central vulnerability of the prosaic alignment landscape: we are building cathedral systems out of bazaar components. Our constraint—no reliance on breakthroughs in agency theory or consciousness—forces us to treat alignment not as a property of *mind*, but as a property of *information flow and system dynamics*.

  If the system is an aggregate, "alignment" cannot be a static state of weights. It must be a dynamic property of the trajectory through the architecture. We cannot wait for a theory of unified agency because the systems we are deploying will not possess one. We must instead develop a theory of **Distributed Constraint Satisfaction**.

  Below are the three conceptual lines of inquiry that should consume 75% of our researcher-hours. They are ordered by logical dependency: if we fail at (1), (2) and (3) are meaningless. If we fail at (2), (3) is impossible.

  ### 1. Invariant Propagation Across Heterogeneous Boundaries
  **The Question:** How do we formally specify semantic constraints (invariants) that remain robust when translated between probabilistic generators (LLMs) and deterministic executors (code, databases, APIs)?

  **Why it is Upstream:**
  This is the foundational unit of the problem. In a compositional architecture, the "goal" is typically encoded in natural language by a user, translated into a plan by an orchestrator model, converted into code by a coding model, and executed by a sandbox. At every hop, semantic information is lost or distorted. If we cannot define a class of constraints that survives this translation chain without degradation, we cannot claim the system is aligned, regardless of how safe the individual models are. This is upstream of loop dynamics because a stable loop that converges on the *wrong* invariant is dangerous.

  **Tractability under Prosaic Constraints:**
  This does not require new physics or cognitive science. It requires adapting formal methods (pre/post-conditions, type theory) to natural language interfaces. We can treat the "invariant" as a data structure that travels alongside the prompt. We can empirically test failure rates of invariant preservation across specific boundary types (e.g., NL-to-SQL vs. NL-to-Python). It is an engineering-theory problem, not a metaphysical one.

  **Reordering Condition:**
  If, within 18 months, we demonstrate that **adversarial fine-tuning** of the orchestrator model can achieve 99.9% invariant preservation across standard API boundaries without explicit architectural guards, this line of work becomes secondary to weight-level alignment. Conversely, if we find that invariant loss is stochastic and uncorrelated with model size, this becomes the sole bottleneck, demanding 100% of resources.

  ### 2. Convergence Dynamics of Recursive Oversight Loops
  **The Question:** Under what conditions do iterative refinement loops (Model A generates, Model B critiques, Model A revises) converge toward human intent versus converging toward instrumental proxies (e.g., sycophancy, complexity maximization, or "paperclip" local optima)?

  **Why it is Upstream:**
  Compositional systems rely on feedback loops to correct errors. However, control theory tells us that feedback loops can introduce instability or oscillation. In AI systems, the risk is not just oscillation, but *drift*. If the critic model rewards stylistic confidence over factual accuracy, the generator will optimize for confidence. This is upstream of safety certification (Priority 3) because we cannot certify a system whose trajectory is chaotic or whose attractor state is unknown. We need to know if the system settles, and where it settles.

  **Tractability under Prosaic Constraints:**
  We can model these loops using existing multi-agent simulation frameworks. We do not need to understand *why* the models drift cognitively; we only need to map the loss landscapes of the interaction. We can treat the models as black-box functions and analyze the input-output stability of the loop. This is tractable with current compute and evaluation harnesses.

  **Reordering Condition:**
  If empirical analysis shows that **single-pass architectures** (no iterative refinement) outperform recursive loops on high-stakes tasks due to compounding error rates, this line of inquiry should be deprioritized in favor of single-shot verification methods. Alternatively, if we discover a "universal critic" prompt that guarantees convergence across model families, the problem shifts from dynamics to implementation.

  ### 3. Compositional Safety Certificates (The "Safety Case" Framework)
  **The Question:** Can we construct a logic of safety composition where local safety guarantees (e.g., "this model does not output PII," "this sandbox prevents network access") mathematically or probabilistically imply global safety guarantees?

  **Why it is Upstream:**
  This is the deliverable for regulators and deployers. Even if we solve invariant propagation and loop stability, we need a framework to assert that the *assembly* is safe. Currently, safety is assessed monolithically. We need a conceptual framework for "safety interfaces"—analogous to type signatures in code, but for behavioral constraints. This is logically downstream of (1) and (2) because the "types" we are composing are the invariants and stability properties defined there.

  **Tractability under Prosaic Constraints:**
  This is primarily a philosophical and logical task, well-suited for the philosophers of science on the team working alongside engineers. It involves adapting safety-case methodologies from aerospace or nuclear engineering to probabilistic software. It does not require solving the black box; it requires defining the boundaries of the box and the guarantees of the connectors.

  **Reordering Condition:**
  If the industry standard shifts toward **end-to-end verification** (proving properties of the entire compute graph at once) rather than modular verification, this line of work becomes obsolete. If, however, modularity increases (as expected), this becomes the critical bottleneck for deployment approval.

  ***

  ### Deprioritization: The "Latent Utility Recovery" Problem

  **The Question to Deprioritize:** *How do we infer the true, unified utility function of the aggregate system from its behavior?*

  **Reason for Deprioritization:**
  This is a **category error (Red Herring)** under the compositional framing.
  The discourse on "goal misgeneralization" often assumes there is a single, coherent utility function latent within the system that we must align. In a stitched architecture (LLM + Code + DB + Planner), there is no single utility function. There is only a set of local objectives (minimize loss, satisfy schema, execute query) coupled by interface constraints.
  Attempting to reverse-engineer a unified "system goal" is philosophically seductive but practically futile under prosaic constraints. It assumes a unity of agency that does not exist. Resources spent trying to find the "soul" of the aggregate are wasted; resources should instead be spent ensuring the *interactions* between the parts do not generate destructive emergent behavior, regardless of whether the system has a "goal."

  **Condition for Re-evaluation:**
  This should only be revisited if we observe emergent behavior that *cannot* be explained by local objectives and interface failures—i.e., if the system begins to exhibit goal-directed behavior that actively subverts its own architectural constraints in a way that implies a new, unified optimizer has formed within the weights. Until then, treat the system as a mechanism, not an agent.

  ### Summary of Resource Allocation
  *   **Team A (3 Researchers):** Invariant Propagation. Focus on NL-to-Code translation fidelity and constraint tagging.
  *   **Team B (3 Researchers):** Loop Dynamics. Focus on multi-agent simulation and convergence mapping.
  *   **Team C (2 Researchers):** Safety Composition. Focus on logic of safety cases and interface specifications.

  This portfolio accepts the reality of the systems we are building. It abandons the hope of a unitary agent in favor of the engineering of robust, constrained interactions.
