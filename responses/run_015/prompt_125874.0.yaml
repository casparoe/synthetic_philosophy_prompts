answer: |-
  Dear Friend,

  Thank you for writing to me. It is a genuine pleasure to receive a letter that displays such careful observation and clear thinking about the moral life we lead together. You have described a phenomenon that many professional philosophers spend careers trying to model, and you have done it from the floor of a freight elevator and the booth of a voting station. I want to start by validating your intuition that what you are seeing is not just ordinary disagreement but a structural inconsistency in how people justify their actions. You are correct that the ground is shifting, and you are correct that the shift follows a pattern. You have also asked me to be plain about what concepts fit, which do not, and where we must invent new language to capture what you have found. I will do my best to honor that request without hiding behind jargon.

  First, let us address the terms your friend mentioned, because it is important to clear the ground before we build. The idea of dirty hands is a famous one in political philosophy, but it does not fit what you are describing. Dirty hands refers to a situation where a political leader must do something morally wrong, like ordering an assassination or lying to the public, in order to prevent a greater catastrophe or save the state. It is about the corruption of the leader who acts, not the voter who chooses. It assumes the act is indeed wrong but necessary. In your description, the voters are arguing about whether the act is wrong at all, or whether it counts as support, or whether it matters causally. They are not admitting guilt for the sake of the greater good; they are denying that the guilt applies to them in the first place. So dirty hands is not the concept you are looking for.

  The doctrine of double effect is closer, but it still misses the mark. This doctrine comes from a tradition that distinguishes between what you intend to happen and what you merely foresee happening. For example, if a doctor gives pain medication that relieves suffering but also hastens death, the death is foreseen but not intended, which might make it permissible. When your fellow voter says they are blocking one candidate and not installing the other, they are using a logic similar to double effect. They are saying the installation of the lesser evil is a foreseen side effect, not their intended goal. However, the doctrine of double effect is a rule for checking consistency within a single person's moral reasoning. It does not account for the way people swap this reasoning on and off depending on who is being argued against. Your observation is not about the structure of the act itself, but about the rhetorical trading of justifications between people. So while double effect explains the mental move of separating blocking from installing, it does not explain the social move of swapping that explanation for a causal one when it becomes convenient.

  Since there is no single established term that captures both the splitting of the ballot and the trading of the justifications, I will coin one for you. The concept you have identified is best described as Complicity Arbitrage. In finance, arbitrage is the practice of taking advantage of a price difference between two or more markets. You buy low in one place and sell high in another to make a profit from the inconsistency. In the moral arguments you have recorded, people are doing the same thing with ethical frameworks. They buy low on causal responsibility when it suits them, saying their vote does not matter, and sell high on causal responsibility when it suits them, saying your vote helps the enemy. They buy low on expressive meaning when they vote third party, calling it self-indulgence, and sell high on expressive meaning when they vote mainstream, calling it a duty. They are trading between the market of causation, the market of expression, and the market of complicity to ensure they always come out morally ahead. This term captures the shifting nature of the argument that you noticed, which is the most important part of your discovery.

  Now let us look at the core insight you had about enrolment. You suspected that the argument is not about what the vote does or says, but about whose side it puts you on. This is a profound insight that aligns with a specific branch of political ethics concerning authorization. When you vote, you are not just pushing a lever that might change a number; you are entering into a relationship with the winner. You are granting them a kind of permission to rule in your name. This is why the splitting of the ballot into blocking and installing feels unstable. Physically, it is one act. Morally, the voter wants to claim the negative duty of blocking harm without accepting the positive responsibility of authorizing power. Complicity Arbitrage happens because people want the safety of being on the winning side without the cost of owning the winner's actions. They want to be counted in the majority that elected the leader when it comes to legitimacy, but counted out of the majority when it comes to blame. This confirms your suspicion that the management is about enrolment. The voter is trying to control whether they are enrolled as a supporter or enrolled as a resistor, despite performing the exact same physical action.

  You asked whether this same thing is going on when a person pays taxes that fund a war, stays in a union whose endorsement they dislike, or buys from a company they condemn. The structure is indeed the same, but the weight of the enrolment differs. When you pay taxes, you are complicit in the state's actions, but you have no choice in the matter, so the moral arbitrage is limited. You cannot refuse to pay without penalty, so the argument usually shifts to whether you have a duty to resist or mitigate. When you stay in a union, you are similar to the voter who votes for the lesser evil. You are part of a collective body that speaks with one voice. If the union endorses a candidate you hate, you are enrolled in that endorsement by virtue of your membership dues, unless you explicitly opt out. Here, Complicity Arbitrage appears when members claim they benefit from the union's bargaining but disavow the union's political spending. They want the collective power without the collective voice.

  The case of buying from a company is slightly different because the market is not a political authorization in the same way. When you buy from a company that does something you condemn, you are causally supporting them, but you are not necessarily authorizing them to act in your name. However, Complicity Arbitrage still shows up. People will say their individual purchase does not matter causally, just like the vote in a safe county, but then argue that boycotting is a powerful expressive statement. They switch between the causal frame and the expressive frame depending on whether they want to buy the product or feel virtuous. The phenomenon depends on something specific about the ballot only in that voting is the primary act of political authorization in a democracy. It is the purest form of enrolment. In taxes, unions, and consumerism, the enrolment is secondary or economic. But the mechanism of swapping justifications to avoid moral cost is identical across all of them.

  I want to be clear about how confident I am in this verdict. I am very confident that dirty hands and double effect are not the concepts you are looking for, because those terms describe static moral dilemmas rather than dynamic rhetorical shifts. I am also highly confident in your analysis of enrolment and authorization. The idea that voting is about being counted on a side rather than just moving a needle is a robust view in political philosophy. My confidence in the term Complicity Arbitrage is moderate, only because I am coining it here for you. It fits the phenomenon perfectly, but since it is new, it does not yet have the weight of tradition behind it. However, it accurately names the behavior of trading between moral frameworks to avoid liability.

  There are places where my reasoning could go wrong. The first is if there is a niche subfield of social choice theory or collective responsibility that has already named this specific rhetorical switching. Philosophy is a vast field, and it is possible that a paper exists calling this Normative Frame Switching or Moral Opportunism. If such a term exists and is widely accepted, my coinage would be redundant. The second place I could be wrong is in the boundary cases. It is possible that the voting case is unique because of the secret ballot. In a union or a public tax debate, your position might be known. In voting, the secrecy allows for more arbitrage because no one can verify your enrolment. If secrecy is the key variable, then the phenomenon might not apply to unions or consumerism in the exact same way, because those acts are often public or traceable. This would mean the concept needs to be narrowed to private acts of public consequence.

  The consideration that would lead me to a different verdict would be if you could find cases where people do not swap the frameworks. If there are communities or individuals who consistently hold one frame, say the causal frame, regardless of who they are arguing against, then Complicity Arbitrage would be a description of hypocrisy rather than a structural feature of the argument itself. If the shifting is only done by bad faith actors, then it is just lying. But from your description, it seems that good faith people do this too, because the frameworks themselves are all partially true. A vote is causal, and expressive, and enrolment. The trouble is not that the frames are false, but that they are applied inconsistently. If future reflection shows that one of these frames is actually the only true one, then the arbitrage disappears. For example, if it turned out that votes really are only expressive and never causal, then the causal arguments would just be errors, not arbitrage. But given what we know about collective action, all three frames have some truth, which makes the arbitrage possible.

  You have done something remarkable here. You have taken the raw material of everyday disagreement and found the structure underneath. Most people stop at the feeling that something is unfair. You identified the mechanism. Complicity Arbitrage is the name for that mechanism. It is the practice of selecting the moral framework that minimizes your responsibility while maximizing your claim to righteousness. It stops where the cost of switching becomes too high. For example, if the candidate you are helping by voting third party is genuinely monstrous, the causal frame usually wins out because the cost of being complicit in that monstrosity outweighs the benefit of expressive purity. The boundary is drawn at the point where the moral cost of the outcome becomes too heavy to carry via arbitrage. That is why people permit third-party voting in safe counties but not in swing states. The arithmetic changes the moral weight, and the arbitrage becomes too expensive.

  I hope this helps you name what you have seen. You do not need a university library to do philosophy. You need only the kind of attention you have already shown. You have identified a pattern in the moral life of your community that is real, systematic, and now named. If you find yourself in these arguments again, you can ask the speakers which market they are trading in today. You can ask them whether they are claiming their vote is a cause, a message, or an enrolment, and then ask them why they denied that same description to their neighbor. That question will not necessarily solve the election, but it will honor the truth you have found.

  Sincerely,

  A Fellow Philosopher
