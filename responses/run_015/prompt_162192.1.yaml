answer: |-
  ### The protocol

  **Step 1: Eligibility and Baseline.** Verify the change is institutional (law, constitution, regulation), not rhetorical. Check the country's current status using Freedom House or V-Dem. If the country is already classified as "Not Free" or "Closed Autocracy," exit immediately. Tag as **Authoritarian Consolidation**. Backsliding requires a democratic baseline to slide from.

  **Step 2: The Symmetry Swap.** Before researching context, rewrite the measure stripping all proper nouns (country, party, leader names). Replace them with neutral placeholders (Country A, Party X). Ask: "If Party Y passed this in Country B, would I call it backsliding?" If the answer changes based on the real names, you have failed the symmetry check. **Consequence:** You must escalate to a senior editor and record the tag as **Unclear** until resolved. This is not optional; it is the primary bias filter.

  **Step 3: The Consent Defense.** Determine if the change passed via referendum or supermajority. If yes, ask: "Does this change reduce the ability of the loser to become the winner?" If yes, popular mandate is **not** a defense. Liberal democracy protects procedural competition against simple majoritarianism. Code as **Backsliding** if procedural fairness is eroded, regardless of vote share.

  **Step 4: Unit of Analysis (Linkage Rule).** Do not code isolated trivialities. Aggregate measures if: (1) Passed by the same governing coalition within 24 months, AND (2) Measure B lowers the cost or raises the payoff of Measure A (Sequential Dependency). If both conditions met, code as one event. If not, code separately or discard as noise.

  **Step 5: Latency vs. Exercise.** Check if the new power has been used against an opponent. If used within 12 months, tag **Backsliding (Exercised)**. If granted but unused for >24 months, tag **Backsliding (Latent)**. Do not wait for abuse to code the removal of checks; the removal is the event.

  **Step 6: Final Classification.** Run the remaining evidence against these definitions:
  *   **Democratic Backsliding:** Reduces competition, accountability, or civil liberties.
  *   **Democratic Deepening:** Increases competition, accountability, or civil liberties.
  *   **Ordinary Reform:** Administrative change with neutral impact on competition.
  *   **Unclear:** Evidence insufficient or Symmetry Test failed.

  **Step 7: Structured Output.** Record: Tag, One-line Justification, Confidence (High/Med/Low), Deciding Test (Step 1–6).

  ### Thresholds, exits, and incomplete evidence

  When evidence is missing, do not infer. If search results yield no text of the law, no analysis from distinct sources (e.g., local independent media plus international NGO), or conflicting reports on the mechanism, tag **Unclear** with confidence **Low**. The escalation point to a human editor is strictly defined: it occurs only when the Symmetry Test fails (Step 2) or when the distinction between "Ordinary Reform" and "Backsliding" hinges on a normative judgment about the *intent* of the actors rather than the *mechanism* of the law. Intent is unknowable; mechanism is factual. If the mechanism reduces competition, code Backsliding regardless of stated intent. Annotators must not speculate on "why" a government acted, only "what" the act enables. If the law exists but its implementation is opaque after 20 minutes of research, record "Insufficient Evidence" in the justification field. This preserves dataset integrity over completeness.

  ### Four worked cases

  **Hungary (2010–2012)**
  Fidesz passed a new constitution, media laws, and electoral redistricting rapidly. Step 1 passes (was democratic). Step 2 passes (swap test confirms erosion). Step 3 applies (supermajority used); Consent Defense fails because the changes locked in party advantage. Step 4 aggregates these as one event via Linkage Rule (constitutional change enabled media control). Step 5 confirms Exercised power (media authority used against critics).
  *Record:* Tag: Democratic Backsliding (Exercised). Justification: Supermajority used to rewrite constitution and media laws, locking in party advantage. Confidence: High. Deciding Test: Step 3 (Consent).

  **Poland (2015–2017)**
  PiS reforms targeted the Constitutional Tribunal and Supreme Court, forcing judge retirements. Step 1 passes. Step 2 passes (judicial independence is universal). Step 3 applies (parliamentary majority); Consent Defense fails (undermines checks). Step 4 aggregates judicial bills via Linkage. Step 5 confirms Exercised (judges removed).
  *Record:* Tag: Democratic Backsliding (Exercised). Justification: Legislative overhaul of judiciary forced removal of sitting judges, reducing checks. Confidence: High. Deciding Test: Step 5 (Exercise).

  **Turkey (2017)**
  Referendum approved executive presidency, abolishing PM office. Step 1 passes (was hybrid regime). Step 2 passes. Step 3 applies (referendum); Consent Defense fails (majority cannot abolish checks). Step 4 single event. Step 5 Latent initially, then Exercised.
  *Record:* Tag: Democratic Backsliding (Exercised). Justification: Referendum abolished checks and balances, concentrating power in executive. Confidence: High. Deciding Test: Step 3 (Consent).

  **US State-Level (Hypothetical/Mid-decade)**
  State legislature removes authority from independent election commission, granting itself power to certify results. Step 1 passes (US is democratic). Step 2 passes (swap test: if done in Georgia vs. California, judgment holds). Step 3 applies (majority vote); Consent Defense fails (partisan self-certification reduces competition). Step 4 single event. Step 5 Latent (no immediate overturning yet).
  *Record:* Tag: Democratic Backsliding (Latent). Justification: Legislature granted itself authority to certify elections, removing independent check. Confidence: Med. Deciding Test: Step 5 (Latency).

  ### The verdict you won't like

  The US State-Level case is the verdict you will dislike. You expect American exceptionalism to shield state legislatures from the "backsliding" tag. The protocol refuses this. If a legislature grants itself the power to certify elections, it reduces competition regardless of the country. The Symmetry Test demands that if this is backsliding in Hungary, it is backsliding in Georgia or Wisconsin. I will not soften this. Labeling it "Ordinary Reform" because it is domestic violates the dataset's core purpose. If the mechanism erodes accountability, it is backsliding. Full stop.

  ### Known failure modes

  First, the **Slow Boil**. The Linkage Rule requires a 24-month window. Regimes often space erosion over six years to avoid detection. The protocol will miss these as separate "Ordinary Reforms" because the sequential dependency isn't obvious within the annotator's 20-minute window. This is a structural blind spot; no amount of procedural tweaking fixes it without longitudinal expertise we don't have.

  Second, **Incompetence vs. Malice**. The protocol codes based on mechanism, not intent. If a government passes a law that erodes democracy purely through stupidity or bureaucratic bloat, the protocol tags it as Backsliding. Political scientists might argue this is merely "state failure." I argue this is wrong: the impact on democracy is identical regardless of intent. However, annotators will struggle to accept coding incompetence as malice.

  Third, **Emergency Powers**. During war or pandemic, democracies grant temporary powers. The protocol lacks a robust "sunset clause" check within the 20-minute limit. Annotators may code emergency powers as Backsliding even if they are genuinely temporary and supervised. This generates false positives during crises. We must accept this noise rather than risk missing actual power grabs disguised as emergencies.

  ### Where I'm guessing

  I am least confident in the **Symmetry Test compliance**. I assume annotators will honestly fail themselves if their judgment swaps. In practice, they may rationalize the mismatch to avoid escalation. I am also guessing on the **Baseline Threshold**. Using Freedom House is convenient, but their methodology shifts. A country on the border (e.g., "Partly Free") might be coded differently depending on the year's index update. Finally, the **Latency Window** (24 months) is arbitrary. Some powers lie dormant for five years before use. I chose two years as a balance between vigilance and patience, but it is a guess.
