answer: |-
  Consider Elara, a forty-year-old architect who suffered a rare stroke damaging the temporoparietal junction. She retains perfect memory, logical reasoning, and self-awareness, and she lives within a supportive village where neighbors engage her daily in work and conversation. Elara responds appropriately to social cues, follows norms, and expresses care, yet neurological testing confirms she permanently processes other humans merely as complex biological automatons rather than beings with inner lives like her own. She never attributes beliefs, desires, or pain to others except as abstract concepts, treating interactions as functional exchanges despite her community's unwavering inclusion of her as a kin member.

  The individualist view grants Elara full moral personhood because her internal rational autonomy and memory remain intact, satisfying the criterion of self-governance regardless of social output. The Ubuntu-inspired relational account denies her full moral personhood because personhood is constituted by mutual recognition; since Elara cannot acknowledge the subjectivity of others, the reciprocal relationship required to sustain moral status is ontologically incomplete. The exact structural feature forcing this divergence is the asymmetry between her preserved internal autonomy and her absent capacity for reciprocal recognition. Removing this feature—specifically, restoring Elara's ability to recognize others as subjects—collapses the disagreement, as both theories would then affirm her personhood based on either autonomy or reciprocity. A defender of the individualist position would attack the relationalist reading by arguing that it unjustly makes moral status contingent on a neurological disability outside the agent's control, thereby violating the principle that intrinsic worth should not depend on the ability to output specific social responses or the vagaries of community inclusion.
