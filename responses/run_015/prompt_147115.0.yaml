      *   **Paragraph 2 (Addressing DoL):** Claims DoL doesn't defeat CiG. Acknowledges global error theory is logically coherent *but* argues it's unavailable due to self-defeat (removes norms of reasoning). Concludes the tie stays until the realist adds something.
