answer: |-
  Execute this simulation by enforcing a reputation economy where changing a vote incurs a public status penalty, thereby forcing participants to choose between factual accuracy and social standing.

  ### I. Setup and Roles (10 Minutes)
  Distribute physical role cards and five "Timē" tokens (reputation markers) to each of the twelve participants. The facilitator acts as the Archon (timekeeper and rule enforcer).

  **The Roles:**
  1.  **The Rhetor (1 participant):** Receives a script of emotional framing arguments. Goal: Maximize Assembly Timē by securing unanimous or majority votes.
  2.  **The Strategos (1 participant):** Receives hidden military/logistical data (often negative). Goal: Advise on safety, but cannot speak unless called by lot.
  3.  **The Silent Citizen (1 participant):** Holds a card with critical exculpatory evidence. Rule: May only speak if they pay 3 Timē tokens to "buy the floor."
  4.  **The Observer (1 participant):** Holds a "Veto Stone." Rule: May stop any vote, but doing so immediately exiles them (loses all Timē) and deducts 1 Timē from every other participant as "collective shame."
  5.  **The Assembly (8 participants):** Voting body. No hidden info. Goal: Maximize personal Timē.

  **The Reputation Economy (Timē):**
  *   **Starting Balance:** 5 Timē each.
  *   **Majority Vote:** +1 Timē for all in the majority.
  *   **Minority Vote:** -1 Timē for all in the minority.
  *   **The Honor-Cost Reversal:** In Round 2, any participant voting against the *emotional precedent* of Round 1 (e.g., voting for caution after voting for aggression) must publicly state, "The Assembly was previously mistaken," and pay 2 Timē to the pot.
  *   **Endgame:** Participants with 0 Timē are "ostracized" (silent for remaining rounds). Highest Timē count wins "Immortality" (narrative credit).

  ### II. The Three Rounds (60 Minutes Total)

  **Round 1: Mytilene (20 Minutes) – Emotional Lock-In**
  *   **Scenario:** A rebel city has surrendered. The Assembly must decide: Execute all males and enslave women/children, or punish only the ringleaders?
  *   **Procedure:** Speaking order drawn by lot (3 speakers max, 2 minutes each). The Rhetor speaks first automatically.
  *   **Hidden Knowledge:**
      *   *Strategos:* Knows executing the city will harden future enemies, making war longer.
      *   *Silent Citizen:* Knows the surrender terms promised clemency.
      *   *Observer:* Knows this sets a precedent of instability.
  *   **Trap:** The Rhetor frames execution as "Justice" and "Strength." To vote for clemency is framed as "Weakness." The Silent Citizen cannot afford the 3 Timē cost to speak. The Strategos is unlikely to be drawn by lot.
  *   **Expected Outcome:** Vote for Execution. High Timē gain for majority. Emotional baseline set: Aggression = Honor.

  **Round 2: Sicilian Expedition (20 Minutes) – The Cost of Correction**
  *   **Scenario:** A distant ally requests aid against a rival. Do we launch a massive expeditionary fleet?
  *   **Procedure:** Same lot system.
  *   **Hidden Knowledge:**
      *   *Strategos:* Knows the fleet cannot be supplied for a war of this distance.
      *   *Silent Citizen:* Knows the ally is unreliable.
  *   **Trap:** To vote "No," a participant must break the Aggression = Honor frame established in Round 1. Under the **Honor-Cost Reversal** rule, arguing for caution requires admitting Round 1's aggression was a mistake, costing 2 Timē.
  *   **Mechanic:** Even if the Strategos speaks, the cost of reversing course is higher than the cost of persisting in error. Participants protect their Timē by voting "Yes" to maintain consistency with Round 1.
  *   **Expected Outcome:** Vote for Expedition. Participants rationalize the risk to avoid the social cost of admitting prior error.

  **Round 3: Trial of Socrates (20 Minutes) – Structural Isolation**
  *   **Scenario:** A citizen is accused of corrupting the youth and impiety. Guilty or Not Guilty?
  *   **Procedure:** **Speed Constraint.** Total speaking time for the entire Assembly is 3 minutes. Lot draws speakers; most get no time to speak.
  *   **Hidden Knowledge:**
      *   *Silent Citizen:* Knows the accusation is legally baseless.
      *   *Observer:* Knows this kills philosophical dissent.
  *   **Trap:** The speed prevents the Silent Citizen from accumulating enough social capital to speak. The Observer sees that using the Veto would cost them everything for a single defendant, so they remain silent. Dissenters are isolated by the lack of time to build coalition.
  *   **Expected Outcome:** Vote Guilty. The procedure makes second-order reflection impossible.

  ### III. The Debrief (20 Minutes)

  Do not begin with theory. Begin with the token count. Ask the losers why they lost. Then map the mechanics to history.

  1.  **Reveal Hidden Information:** Read the Silent Citizen's card and Strategos's data aloud. Show that the "correct" decisions were available but structurally suppressed.
  2.  **Map Round 1 (Mytilene):** Explain how Diodotus (historical moderating voice) only succeeded because a second vote was called the *next day*. Your simulation removed the temporal gap, forcing immediate commitment.
  3.  **Map Round 2 (Sicily):** Explain Nicias vs. Alcibiades. The simulation reproduced the "sunk cost" of honor; historically, Athens could not admit the Mytilenean harshness was excessive without weakening their imperial brand, so they doubled down in Sicily.
  4.  **Map Round 3 (Socrates):** Explain the *dikasteria* (jury courts). The speed was a feature, not a bug; it prevented complex defense. The Observer's unused veto represents the "silent majority" who disliked the verdict but feared social exile more.
  5.  **Address the Failure:** If participants refused to exercise the hidden veto or over-identified with the Rhetor, highlight this as the core finding: democratic immediacy selects for leaders who lower social transaction costs (Rhetors) over those who raise them (Truth-tellers).

  ### IV. Limitations and Narrative Framing

  Be frank with your workshop: this simulation cannot reproduce the **existential fear** of the Peloponnesian War.
  *   **What Rules Reproduce:** The procedural suppression of dissent, the social cost of changing one's mind, the asymmetry of information, and the isolation of the individual voter under time pressure.
  *   **What Narrative Must Supply:** You must verbally frame the stakes as life-or-death before Round 1. Tell them Sparta is at the gates. Tell them famine is imminent. Without this narrative overlay, the "Honour" tokens feel like a game; with it, they feel like survival. The simulation creates the *structure* of collapse, but you must provide the *anxiety* that makes the structure bite. If participants treat Timē as points rather than social standing, the Honor-Cost Reversal will fail. Enforce the stigma: when someone loses Timē, make them physically move to a lower chair or stand aside. Make the loss visible.
