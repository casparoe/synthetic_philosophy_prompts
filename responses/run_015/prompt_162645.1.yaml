  The ledger sat on the lectern like a slab of cold meat. Elara ran a finger down the page, past the faded entries of previous decades—the strike of '84, the flood of '95—until she found the fresh ink. *Item 44: The Holloway Mill Fire, 1974.*

  Below it, the signature box. Her grandmother's name, *Martha Holloway*, was there, dated three years prior. Before the fog took her.

  "It's done, then," a voice said from the shadows of the archive room. Mr. Hale stepped into the light, adjusting his glasses. He wore the sombre grey suit of the Shedding Council. "The ballot was unanimous. Except for yours, naturally."

  "Unanimous among whom?" Elara asked, not looking up. "The people who benefited? The ones who bought the land for pennies because the insurance was voided?"

  "The town," Hale said gently. "Collectively. We voted to stop rehearsing the injury. You know the principle, Elara. It is not denial. We named it aloud at the ceremony. We acknowledged it exists. Now we choose not to carry it."

  "You choose," Elara said. She closed the ledger. The sound was heavy, final. "Nan can't choose anymore. She doesn't know her own name half the time. You're using a signature from when she was lucid to silence a woman who can no longer object."

  Hale moved closer, resting a hand on the lectern. "She asked for this. Before the dementia took hold, she said the memory was eating her alive. She wanted peace. Is it kindness to force her to remain the town's martyr when her mind has already granted her mercy?"

  "It's not about her mind," Elara snapped. "It's about the truth. A community owes the people it wronged a duty of remembrance. You can't vote that away. Forgetting on her behalf is a second injury. You're erasing the crime because the victim is finally too tired to scream."

  "And keeping it alive pins your family into the role of victims," Hale countered, his voice hardening. "Every remembrance day, every syllabus entry, it defines you by what was taken. Is that loyalty? Or is it a cage? We are offering care, Elara. Sometimes care looks like letting go."

  "Care is owed to the living," Elara said. "Truth is owed to the dead. And to the future."

  She took the ledger. It was against protocol, but Hale didn't stop her. He looked tired, older than the grey suit suggested. "Keep it if you must," he said. "But the silence stands. The children won't be taught. The archives will be redacted. You will be the only one holding the weight. Is that fair on you?"

  Elara walked out into the grey afternoon. The town looked ordinary. Buses rumbled past the square where the mill once stood; now it was a car park. There was no statue to pull down, no plaque to cover. The erasure was atmospheric, a change in air pressure rather than landscape.

  At home, the house was quiet. Nan sat in the wingback chair by the window, staring at the dust motes dancing in the light. She hummed a tuneless fragment of a song. She did not look up when Elara entered.

  "Nan?" Elara said softly.

  Martha Holloway turned. Her eyes were clouded, bright with a vacant recognition. "Hello, love. Is it tea time?"

  "Soon," Elara said. She placed the ledger on the sideboard, covering it with a cloth. She felt the weight of it pressing against the wood.

  Her brother, Toby, was at the kitchen table, textbooks spread out. He was fourteen, too young to have voted, too young to remember the ceremonies before he was born. Under the rules of the Shedding, children were not told that anything had been removed. To them, the gap in history was natural, like a missing tooth they'd never had.

  "El," Toby said, not looking up from his history homework. "Mr. Hale sent a note. We're doing local industry in class next week. Why did we stop owning the mill? The textbook says it was just... bad luck. A structural failure."

  Elara froze. The kettle began to whistle, a rising scream in the silence.

  "That's what it says," Elara said.

  "But Mrs. Gable said the Holloways were ruined by it. She said it was why we're not... well, why we don't have the estate anymore." Toby looked up, his eyes clear and demanding. "Did something happen? Everyone treats the mill like it's cursed."

  From the living room, Nan hummed again. She had forgotten the fire. She had forgotten the ruin. She had forgotten the betrayal that had starved them for two generations. According to Hale, she was at peace. According to the ledger, she had consented to the silence. But consent given by a woman who remembers is not consent given by a woman who does not.

  Elara looked at Toby. He was waiting for a fact. If she stayed silent, he would grow up believing the gap was natural. He would inherit the loss without the knowledge of the theft. He would be safe, but he would be hollow.

  If she spoke, she would break the Shedding. She would burden him with a grief that wasn't his own, manufacturing a memory where there was none, making him a keeper of a flame everyone else had agreed to extinguish. She would be making him a victim by proxy.

  Hale's voice echoed in her head. *Is that loyalty? Or is it a cage?*

  Nan shifted in her chair, the leather creaking. She looked comfortable. Unburdened.

  Elara walked to the table. She pulled out a chair and sat opposite Toby. She placed her hand over his textbook, covering the paragraph about structural failure.

  "It wasn't bad luck," Elara said.

  Her voice was quiet, but it sounded loud in the kitchen. Nan stopped humming.

  "Then what was it?" Toby asked.

  Elara looked at her brother. She looked at the ledger under the cloth. She thought of the town outside, sleeping comfortably in their agreed ignorance. She thought of Nan, lost in a fog that was kinder than the truth.

  Elara took a breath. She did not know if she was saving him or damning him. She only knew that the silence was too heavy to hold alone.

  "It was arson," she said. "And the town paid the arsonists."

  Toby's pen stopped moving. The kettle clicked off. In the living room, Nan began to hum again, a soft, drifting sound that belonged to a world where nothing had ever burned. Elara kept her eyes on her brother, watching the moment the history took root, watching the shadow fall across his face, knowing there was no taking it back.
