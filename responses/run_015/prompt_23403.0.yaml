      *   *Actually, the deeper point:* Even with reliable private channels, Common Knowledge is impossible in finite time because the last recipient doesn't know the sender knows the message arrived. But TGP usually leans on the *unreliable* nature to make the "last message" argument robust. I will focus on the Unreliable aspect for TGP, and the Public aspect for Muddy Children.

  8.  **Final Polish:** Check for clarity on the "Infinite Chain" vs. "Fixed Point" distinction. The infinite chain is the *definition* of common knowledge, but the *impossibility* comes from the protocol structure.

