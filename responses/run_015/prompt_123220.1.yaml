  1.
  Realist: When a theory achieves explanatory saturation, predicting every introspective probe without invoking phenomenal properties, it merely details the mechanism of our conviction. The hard problem persists because explaining why we judge there is light does not illuminate the light itself.
  Illusionist: If saturation accounts for every judgement without residue, the light you speak of is nothing over and above the mechanism of that conviction. Your hard problem is therefore a cognitive itch that vanishes once the scratching is fully understood.

  2.
  Realist: My residual assertion passes the denial-cost test because denying it makes our shared understanding of truth fundamentally mistaken, even if no judgement shifts.
  Illusionist: A claim says more than a rival only if denying it alters what is judged or explained, and your assertion changes nothing under saturation.

  3.
  Realist: Consider that a claim can be brute and fundamental without being empty, much as the existence of an external world makes no difference to any judgement yet is not void.
  Illusionist: External-world realism earns its keep through inference to the best explanation, whereas your phenomenal realism is posited precisely where no such inference is on offer.

  4.
  Realist: Consider a completed neuroscience achieving saturation for a subject reporting agony; denying the agony costs nothing in prediction, yet the suffering remains ontologically distinct.
  Illusionist: If that neuroscience explains the report without agony, then positing agony fails the denial-cost test by altering neither judgement nor behaviour.

  5.
  Realist: I concede saturation explains the judgement, but I land this blow: you cannot explain why the judgement seems veridical without admitting the appearance itself is a fact requiring ground. Our crux is whether ontology binds to explanatory power, which is not verbal because truth is not pragmatic.
  Illusionist: I concede your claim is not semantically empty, but I land this blow: you cannot show the claim matters if it changes nothing, so the crux is whether ontology binds to explanatory power. This is not verbal because it decides whether metaphysics serves science or stands apart.
