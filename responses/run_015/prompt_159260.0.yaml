answer: |-
  Here is the specification you asked for. The reason your course felt like people arguing past each other is that different theorists prioritize different items on this list. Some treat the "binding force" as the non-negotiable element; others treat the "harm to the promisee" as the non-negotiable element.

  To get a high mark, you need to show you understand that a theory of promising is essentially a choice about which of these desiderata to sacrifice when they conflict.

  ### The Spec: Desiderata for a Theory of Promissory Obligation

  Here are the seven requirements any account must address. I have grouped them by function.

  #### 1. The Distinctiveness Constraint
  *   **Requirement:** The theory must explain why a promise creates a different obligation than a prediction, a statement of intent, or a general moral duty.
  *   **Consideration:** If I say "I will probably be there," I am not bound. If I say "I promise I will be there," I am. The difference cannot just be the word used; it must be the normative mechanism triggered.
  *   **Test Case:** **The Secret Breaking.** If I break a promise and nobody knows, I still feel guilty. If promising were just about managing expectations (lying), secret breaking wouldn't matter once the expectation is gone. If it were just about reliability, I could just be reliably unpromising. The wrong must be intrinsic to the act of breaking the bond, not just the social fallout.

  #### 2. The Directionality Constraint (The "To Whom" Question)
  *   **Requirement:** The obligation must be *owed to* the promisee specifically, not just a free-floating duty to the universe or the moral law.
  *   **Consideration:** This is the only way to explain the **Power of Release**. If the duty were just "keep your word" (a duty to God or Morality), the promisee couldn't waive it. If it were "don't harm others," a third party could waive it if they aren't harmed. The fact that *only* the promisee can release you implies the right resides in them.
  *   **Test Case:** **The Power of Release.** You cannot release yourself; a third party cannot release you. Only the promisee can. A theory must explain where this normative power comes from.

  #### 3. The Communication/Understanding Constraint
  *   **Requirement:** The theory must specify what counts as successfully making a promise.
  *   **Consideration:** Promising is an interpersonal act. It requires uptake.
  *   **Test Case:** **The Language Barrier.** If I promise you in a language you do not speak, have I promised?
      *   *If Yes:* Then promising is a unilateral imposition of duty (problematic).
      *   *If No:* Then promising relies on convention or mutual understanding, not just the will of the promisor.

  #### 4. The Non-Redundancy Constraint
  *   **Requirement:** The theory must explain the status of promising to do what you are already obligated to do.
  *   **Consideration:** If I already owe you $10, and I promise to pay you $10, does the promise add anything?
  *   **Test Case:** **Pre-existing Duty.**
      *   *If the promise adds nothing:* Then promising is parasitic on other duties.
      *   *If the promise adds a new layer:* Then I now owe you the money *twice* over (once as debt, once as promise). Most theories struggle to explain why we do this if it doesn't change the outcome.

  #### 5. The Beneficiary Irrelevance Constraint
  *   **Requirement:** The theory must determine whether the promisee's benefit or awareness is necessary for the obligation to exist.
  *   **Consideration:** Is the point of promising to help the promisee, or to bind the promisor?
  *   **Test Case:** **The Deathbed Promise.** I promise a dying friend to look after their sister. The sister never knows about the promise and would resent the interference.
      *   *If Binding:* Then the obligation is about the *promisor's integrity* or the *act of willing*, not the promisee's welfare.
      *   *If Not Binding:* Then promising is instrumental to human welfare/expectations, not a categorical duty.

  #### 6. The Normative Force Constraint
  *   **Requirement:** The theory must explain *why* the promise binds. Is it prudential, moral, or conceptual?
  *   **Consideration:** "I promise" is not "I threaten." It creates a reason for action that excludes other reasons (e.g., "I'd rather go to the cinema" is not a valid excuse).
  *   **Test Case:** **Conflicting Duties.** If keeping the promise causes slight harm, but breaking it causes great good, does the promise still hold? (This tests the rigidity of the obligation).

  #### 7. The Voluntariness Constraint
  *   **Requirement:** The obligation must be self-assumed. I cannot be bound by a promise I did not make.
  *   **Consideration:** This distinguishes promising from natural duties (like not killing).
  *   **Test Case:** **Coercion.** If I promise at gunpoint, am I bound? Most say no. This implies the power to bind comes from my autonomy, yet once bound, my autonomy is restricted. The theory must reconcile how freedom creates bondage.

  ---

  ### Critical Analysis: Real Requirements vs. Partisan Demands

  You asked to distinguish between what any theory *needs* and what specific camps *want*. This is where you score marks for critical insight.

  **1. The Partisan Demand: "Binding Even When Useless"**
  *   **The Claim:** A theory must show that the Deathbed Promise is binding even if the sister never knows.
  *   **Verdict:** **Partisan.** This is a Deontological/Fidelity demand. A Consequentialist or Reliance-based theory will (and should) say there is no obligation here because no expectations were created and no welfare is impacted. If you treat this as a neutral desideratum, you rig the game against Scanlon or Utilitarians.
  *   **Essay Tip:** Frame this as a conflict between *Fidelity* (keeping the word) and *Point* (serving the promisee).

  **2. The Real Thing: "The Power of Release"**
  *   **The Claim:** Only the promisee can release the promisor.
  *   **Verdict:** **Non-negotiable.** Almost every intuition pump agrees on this. If your theory cannot explain why *I* can't release *myself* from a promise to *you*, your theory is broken. This is the hardest hurdle.
  *   **Why:** It implies a transfer of normative authority. I give you a right over my will.

  **3. The Tension: "Do What You Said" vs. "Wrong To Someone"**
  *   **Your Instinct:** You are correct. These pull against each other.
  *   **The Conflict:**
      *   If the obligation is **"Do What You Said"** (Fidelity), then the Deathbed Promise is binding. But then who is the wrong *to* if the sister doesn't care? It becomes a wrong to "Morality" or "Myself."
      *   If the obligation is **"Wrong To Someone"** (Directionality/Rights), then the Deathbed Promise is shaky. If the promisee (or beneficiary) has no claim, there is no victim.
  *   **Resolution:** You prefer keeping the "Wrong To Someone" constraint. This pushes you toward **Second-Personal** or **Rights-Based** accounts. It means you must accept that some "promises" (like the deathbed one) might not generate full promissory obligations, or they generate a different *kind* of obligation (e.g., a duty of respect to the dead, not a promise to the sister).
  *   **Incompatibility:** You cannot have a theory that says (A) Promises are always binding regardless of consequence/benefit AND (B) A promise violation is essentially a wrong *to the promisee* (which implies they have a claim). If they have a claim, they can waive it (Release). If they waive it, the promise isn't binding. Therefore, "Always Binding" is false.

  **4. The Killer Constraint**
  *   **Which requirement knocks out the usual candidates?**
  *   **The Power of Release (Directionality).**
  *   **Why:**
      *   **Utilitarianism:** Knocked out. If breaking the promise secretly produces more good, I should break it. Also, why can't a third party release me if they calculate the utility is higher?
      *   **Simple Reliance/Expectation (Scanlon-ish):** Knocked out. In the Deathbed case, there is no reliance. In the Secret Breaking case, if they never find out, their expectations aren't violated in a way that harms them.
      *   **Social Practice (Rawls/Prichard):** Knocked out. Why does the *practice* give the *individual* the power to release? Usually, rules of a practice are administered by the community, not the specific participant.
      *   **Simple Fidelity (Ross):** Knocked out. It explains the binding force but fails to explain the Release. If it's a duty of *my* virtue, why can *you* waive it?

  ---

  ### Brief Scorecard of Major Accounts

  Use this to evaluate the theories against the Spec above.

  | Theory | Distinctiveness | Directionality (Release) | Deathbed Case | Secret Breaking | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Practice / Convention** (Rawls, Prichard) | **High.** Promising is a move in a social game. | **Low.** Why does the game give *you* the veto? Usually rules are public/collective. | **Fail.** No practice exists on a deathbed in isolation. | **Pass.** Rule breaking is wrong regardless of detection. | Good for social stability, bad for interpersonal authority. |
  | **Expectation & Trust** (Scanlon, Hume) | **Med.** Risks collapsing into "don't lie" or "don't harm." | **Med.** Explains harm to promisee, but struggles with the *right* to release. | **Fail.** No expectations formed, no reliance. | **Fail.** If they never know, expectations aren't disappointed. | Good for explaining harm, bad for explaining the *bond*. |
  | **Plain Duty of Fidelity** (Ross) | **High.** *Sui generis* duty. | **Low.** Why is it a duty *to you*? Why can you waive my duty? | **Pass.** Duty is on the agent, regardless of outcome. | **Pass.** Integrity is internal. | Good for binding force, metaphysically mysterious on *why*. |
  | **Authority / Second-Personal** (Darwall, Thompson) | **High.** Invoking a normative power. | **High.** **Best fit.** Explains Release as the return of authority. | **Med.** Depends on if authority was successfully transferred. | **Pass.** Violation of authority stands regardless of knowledge. | **Strongest contender** for your specific requirements. |

  ### Summary for your Essay
  1.  **Start with the Spec:** Define the 7 desiderata.
  2.  **Highlight the Tension:** Explicitly state that "Binding Force" and "Directionality" are in tension (Deathbed case).
  3.  **Take a Stand:** State that you prioritize **Directionality (The Power of Release)** over rigid Fidelity. This filters out Ross and Utilitarianism.
  4.  **Identify the Winner:** Argue that **Second-Personal/Authority** accounts are the only ones that treat the "Power of Release" as a fundamental feature rather than a bug to be explained away. They explain that promising is the temporary transfer of normative authority over an action from the promisor to the promisee.
  5.  **Conclusion:** A theory that cannot explain why *you* hold the keys to *my* obligation is not a theory of promising; it is a theory of social coordination or personal integrity.
