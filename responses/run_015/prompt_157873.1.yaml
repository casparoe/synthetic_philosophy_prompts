answer: |-
  ### Exam Prompt

  **Course:** Graduate Seminar in Intergenerational Ethics
  **Assessment:** Final Take-Home Examination
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,500 words maximum

  **Question:**

  Consider the **Perturbation-Resilient Nonidentity (PRN)** condition. In classic Parfitian cases, distinct policy choices result in numerically distinct future populations. Under PRN, we instead ask whether the *actual set* of future persons is invariant under $\epsilon$-perturbations to present resource-allocation parameters. If the set of persons remains constant despite small variations in policy ($\epsilon$), we treat the population as an **invariance class**.

  Suppose we posit that moral obligation attaches to this *invariance class* rather than to the particular identities within it.

  In a coherent essay, determine whether this PRN framing **dissolves, relocates, or intensifies** the classic tension between *harm-to-none* (no particular individual is made worse off than they would otherwise be) and *wrong-to-none* (the act is wrongful despite lacking a specific victim). Your analysis must rigorously apply the logic of invariance to the structure of moral obligation. Do not simply summarize Parfit; demonstrate how the shift from *numerical identity* to *set invariance* alters the normative landscape.

  ***

  ### Model Answer

  The Perturbation-Resilient Nonidentity (PRN) condition does not dissolve the tension between harm-to-none and wrong-to-none; rather, it **relocates** the tension from the metaphysics of personal identity to the metaphysics of modal sets. By shifting the locus of obligation from particular identities to an invariance class, PRN attempts to bypass the person-affecting restriction that generates the nonidentity problem. However, in doing so, it intensifies the abstraction required to sustain a "wrong-to-none" claim.

  In the classic nonidentity problem, the "harm-to-none" conclusion holds because the existence of the future person is contingent on the wrongful act. Comparing the person's state in the actual world to their state in the nearest possible world where the act was not performed is impossible, as they do not exist in the latter. PRN attempts to stabilize this comparison. If the set of future persons is invariant under $\epsilon$-perturbations, then the *same* people exist across a range of policy choices. Consequently, we can meaningfully say that a specific individual within that invariant set is worse off under Policy A than Policy B. In this specific region of stability, the "harm-to-none" problem appears dissolved. We can apply standard person-affecting principles because identity is held constant across the relevant moral comparison.

  However, the prompt stipulates that obligation attaches to the *invariance class*, not the identities. This is the critical pivot. If obligation targets the class, we are no longer operating within a strictly person-affecting view, even if identity is stable. We are asserting that the *structure of the future population* is the bearer of moral value. This relocates the "wrong-to-none" tension. The question is no longer "Who is harmed?" but "What is the status of the invariance class?" If the class is invariant, but the quality of life within that class drops below a threshold due to resource depletion, the "harm" is diffuse. It belongs to the set, not the element.

  This relocation intensifies the normative burden. In classic theory, the "wrong-to-none" intuition relies on impersonal principles (e.g., the Theory of the Good). PRN attempts to ground this impersonal principle in a structural feature of reality (invariance). But this creates a new vulnerability: the $\epsilon$-threshold. If moral obligation depends on set invariance, does the obligation vanish when perturbations exceed $\epsilon$ and identity shifts? If a policy change is large enough to alter who exists, do we lose the obligation to the invariance class? If so, PRN creates a moral cliff-edge where significant harms escape scrutiny simply because they are large enough to alter conception timings.

  Furthermore, attaching obligation to an invariance class risks reifying a metaphysical abstraction. A "class" cannot suffer; only its members can. By claiming obligation attaches to the class, we sever the link between wrongfulness and experiential harm. This strengthens the "wrong-to-none" claim (yes, it is wrong) but weakens the explanatory power regarding *why* it is wrong. We are left saying the structure of the future was violated, not that people were harmed.

  Therefore, PRN does not solve the nonidentity problem; it purchases clarity at the cost of metaphysical extravagance. It dissolves the problem only within the narrow band of $\epsilon$-stability, where standard person-affecting views already work. Outside that band, or by adhering strictly to the "class obligation" clause, it intensifies the divergence between harm and wrong. It confirms that avoiding the nonidentity problem requires abandoning the person-affecting restriction entirely, regardless of whether we frame the alternative as "impersonal good" or "invariance classes." The tension remains because the intuition that "wrongfulness requires a victim" is incompatible with any structural view that prioritizes set properties over individual welfare trajectories. PRN merely makes the incompatibility more explicit by formalizing the structural commitment.

  ***

  ### Marking Scheme

  **Total Points:** 25
  **Passing Threshold:** 15

  | Analytical Move | Points | Characteristic Failure Mode |
  | :--- | :---: | :--- |
  | **1. Interpretation of PRN Mechanics**<br>Correctly distinguishes PRN (set invariance under perturbation) from classic Nonidentity (numerical difference via causal chains). | 5 | Conflating modal invariance with actual-world identity persistence, treating PRN as merely a semantic rename of Parfit's case. |
  | **2. Analysis of Harm-to-None**<br>Identifies that within the $\epsilon$-band, person-affecting harm claims become viable, but notes the limitation of this band. | 5 | Treating the "harm-to-none" claim as a simple empirical observation rather than a normative structure dependent on the counterfactual baseline. |
  | **3. Analysis of Wrong-to-None**<br>Explains how attaching obligation to the *class* shifts the view from person-affecting to impersonal/structural, sustaining the "wrong" claim. | 5 | Failing to address the specific instruction regarding obligation to the "invariance class" rather than individuals. |
  | **4. Verdict on Tension (Dissolve/Relocate/Intensify)**<br>Provides a clear, argued verdict on the status of the tension (e.g., arguing it relocates to the threshold or intensifies abstraction). | 5 | Remaining agnostic or providing a contradictory verdict (e.g., claiming it dissolves the problem while admitting the class cannot suffer). |
  | **5. Critical Limitation (The $\epsilon$ Problem)**<br>Identifies the threshold vulnerability: that moral status shouldn't vanish simply because a perturbation exceeds $\epsilon$ and changes identity. | 5 | Ignoring the implications of the perturbation limit, assuming the invariance class covers all morally relevant futures. |
