answer: |-
  # The Epistemic Tree of Moral Foundations
  **Starting Premise:** *Accept that Moral Foundations Theory (MFT) descriptively captures psychological variation (i.e., some people respond to Care/Fairness only; others respond to Care/Fairness plus Loyalty/Authority/Sanctity).*

  **Instructions:** Follow the path that matches your intuition about the cases. Do not worry about political labels; focus on the moral status of the intuitions described.

  ---

  ### 1. The Flag Case (Ontology)
  *A man cleans his toilet with a national flag in complete privacy. He feels no harm is done, but a neighbor feels deep disgust and calls it a violation.*
  **Is the neighbor's disgust *evidence* that a moral wrong occurred, or merely a causal description of their brain state?**
  *   **No (Just a brain state):** Go to **Leaf A**.
  *   **Yes (Evidence of a wrong):** Go to Question 2.

  ### 2. The Cousin Case (Binding Reality)
  *A family firm hires a less-qualified cousin over a more-qualified stranger. The owner feels a duty to the family; the stranger feels a violation of fairness.*
  **Does the "Loyalty" intuition pick out a *genuine moral reason* (a duty to kin), or is it a *coalitional heuristic* (evolutionary tribalism with no moral weight)?**
  *   **Heuristic (No moral weight):** Go to **Leaf B**.
  *   **Genuine Reason:** Go to Question 3.

  ### 3. The Burial Case (Coverage vs. Noise)
  *A village insists on burying dead bodies within 24 hours, citing sanctity. Outsiders see no harm in waiting. The villagers feel waiting degrades the soul.*
  **Does the group with the *wider* sensitivity (responding to Sanctity + Fairness) see *more of the moral landscape*, or do they simply have *more noise* in their signal?**
  *   **More Noise (Narrower is clearer):** Go to **Leaf C**.
  *   **More Landscape (Wider is clearer):** Go to Question 4.

  ### 4. The Origin Case (Debunking)
  *We discover both the "Fairness" and "Sanctity" intuitions are products of cultural evolution designed for group cohesion.*
  **Does knowing the evolutionary origin *explain away* the validity of the Binding intuitions (Loyalty/Authority/Sanctity) specifically?**
  *   **Yes (Asymmetric Debunking):** Go to **Leaf D**.
  *   **No (Origins don't negate reasons):** Go to Question 5.

  ### 5. The Symmetry Case (Universal Debunking)
  *If evolution explains the Binding intuitions, does it also explain the Individualizing ones (Care/Fairness) in the same way?*
  *   **Yes (Symmetric Debunking):** Go to **Leaf E**.
  *   **No (Individualizing intuitions survive debunking):** *Return to Leaf C (Liberal Epistemic Privilege).*

  ### 6. The Committee Case (Substance vs. Procedure)
  *Imagine a legislature drafting laws on bioethics. One faction feels Sanctity violations acutely; the other does not.*
  **Does the psychology tell us *which faction is right* about the law, or only *how to structure the committee* to avoid blind spots?**
  *   **Which faction is right:** Go to **Leaf F**.
  *   **How to structure the committee:** Go to **Leaf G**.

  ---

  ## The Leaves (Positions)

  **Leaf A: Moral Error Theory / Non-Cognitivism**
  *   **View:** Foundations are just causal vocabulary. Moral intuitions track nothing; they are projections.
  *   **Commitment:** You cannot use psychology to argue for policy, only to manipulate preferences.
  *   **Wide-Sensitivity Verdict:** Irrelevant (All intuitions are equally non-truth-apt).

  **Leaf B: Individualizing Realism**
  *   **View:** Care/Fairness track real properties; Binding foundations are evolutionary glitches.
  *   **Commitment:** You must actively educate people out of Loyalty/Authority intuitions as one would educate them out of superstition.
  *   **Wide-Sensitivity Verdict:** **Worse.** (More inputs = more error).

  **Leaf C: Liberal Epistemic Privilege**
  *   **View:** Binding foundations might be real, but the psychology that detects them is poorly calibrated (high false-positive rate).
  *   **Commitment:** You trust the "narrow" moral detector because it has higher specificity, even if it has lower recall.
  *   **Wide-Sensitivity Verdict:** **Worse.** (Breadth introduces unacceptable noise).
  *   *[Note: Indistinguishable in practice from Leaf B]* ⚠️

  **Leaf D: Asymmetric Realism (The "Enlightened" View)**
  *   **View:** Binding foundations are real reasons, but the specific cultural evolution that shaped the "Conservative" psychology debunked *their* access to them, while leaving "Liberal" access intact.
  *   **Commitment:** Binding values exist, but the people who feel them most strongly are the least trustworthy judges of them.
  *   **Status:** **UNOCCUPIED / UNATTRACTIVE** ⚠️
      *   *Why:* This requires claiming a moral truth exists but is best accessed by those who *don't* feel it, while those who *do* feel it are deluded. It is theoretically possible but psychologically unstable.

  **Leaf E: Symmetric Nihilism**
  *   **View:** If evolution explains all foundations, nothing is right.
  *   **Commitment:** Moral discourse is purely strategic; there is no epistemic ground to stand on.
  *   **Wide-Sensitivity Verdict:** Irrelevant.

  **Leaf F: Conservative Epistemic Privilege**
  *   **View:** The wide-sensitivity psychology is better calibrated. The "Binding" intuitions detect genuine moral dimensions (community, sanctity) that the narrow psychology misses.
  *   **Commitment:** You must accept that some moral truths are invisible to those who prioritize individual autonomy above all else.
  *   **Wide-Sensitivity Verdict:** **Better.** (More inputs = more coverage).

  **Leaf G: Epistemic Institutionalism (Procedural Pluralism)**
  *   **View:** Psychology tells us nothing about first-order truth, but reveals systemic risks in deliberation.
  *   **Commitment:** **The Awkward Commitment:** You must grant veto power or representation to intuitions you personally believe are *false* (e.g., Sanctity) to prevent the institution from collapsing due to blind spots.
  *   **Wide-Sensitivity Verdict:** **Procedurally Necessary.** (Whether it tracks truth is unknown, but excluding it is dangerous).

  ---

  ### Annotations

  **⚠️ Practically Indistinguishable Leaves:**
  **Leaf B (Individualizing Realism)** and **Leaf C (Liberal Epistemic Privilege)**.
  *Reason:* Both prescribe ignoring Binding intuitions in policy. One claims they aren't real (Ontology); the other claims they are real but the detectors are broken (Epistemology). In a reading group debate, these two will vote the same way on every concrete case.

  **⚠️ Unoccupied Combination:**
  **Path:** Q1 (Yes) → Q2 (Yes) → Q3 (Noise/Liberal Better).
  *Reason:* This leads to **Leaf D**. It is rarely occupied because it requires a "Mooreian" stance: affirming the existence of Binding moral facts while asserting that the psychological profile most associated with detecting them is epistemically inferior to the profile that ignores them. It is unattractive because it severs the link between moral phenomenology and moral truth.

  ---

  ### Counterfactual Note: What if the data flipped?
  **If liberals were broad (6 foundations) and conservatives narrow (2 foundations):**
  The **tree structure would remain exactly the same.**
  *   The "Wide-Sensitivity Better" leaf (Leaf F) would simply become "Liberal Epistemic Privilege."
  *   The "Wide-Sensitivity Worse" leaf (Leaf C) would become "Conservative Epistemic Privilege."
  *   The logic of *Coverage vs. Noise* and *Symmetry vs. Asymmetry* is independent of which political tribe holds the psychology. The tree tests the epistemic value of *breadth*, not the value of *conservatism*. If the empirical finding reversed, you would just swap the political labels on the leaves; the philosophical positions (Realism, Error Theory, Institutionalism) would remain unchanged.
