answer: |-
  **TO:** All Academic Staff and Research Fellows
  **FROM:** The Foundation Steering Group
  **DATE:** 14 July
  **SUBJECT:** Mandatory Migration to Intuitionistic Foundations (Effective Michaelmas)

  Following the departmental vote during the Long Vacation, please be advised that the Mathematics Department will migrate from Classical to Intuitionistic foundations effective Michaelmas Term. This strategic realignment aims to enhance computational transparency and witness validity across all research outputs. Staff are requested to familiarise themselves with the following technical specifications and migration pathways.

  **1. Legacy Compatibility and Translation Layers**
  Existing classical proofs are hereby classified as legacy code. To ensure operational continuity, a Gödel-Gentzen double-negation translation layer has been installed. This compatibility shim allows certain legacy proofs to run within the new environment by wrapping assertions in double negation. Staff should note that this layer does not support all legacy protocols; specifically, proofs relying on positive existential claims without constructive witnesses will fail to compile. Users are encouraged to refactor these proofs manually rather than relying on the translation layer.

  **2. Deprecation of Excluded Middle**
  The Law of Excluded Middle (LEM) is now deprecated. It is not refuted, but it is no longer supported as a native axiom. The double-negation of excluded middle, $\neg\neg(A \vee \neg A)$, remains valid and will continue to ship with the core kernel. Additionally, triple-negation elimination ($\neg\neg\neg A \leftrightarrow \neg A$) is fully supported. Staff attempting to invoke LEM directly will receive a warning flag during peer review.

  **3. Enhanced Existence and Disjunction Properties**
  A key feature of the upgrade is the enforcement of the Existence and Disjunction Properties. Henceforth, every existential theorem must arrive with a witness attached. Similarly, disjunctive conclusions ($A \vee B$) require the author to specify which disjunct holds. This ensures all mathematical objects are transparently delivered. Please update your publication templates to include witness fields where previously only existence was asserted.

  **4. Real Number Module and Continuity**
  Decidable equality on the real numbers has been removed due to incompatibility with the new core. Users must utilise the positive apartness relation ($\#$) for inequality checks. As a consequence of the new architecture, all total functions on the reals are now continuous. Please note that the Intermediate Value Theorem survives only in its approximate form; exact roots are no longer guaranteed without additional continuity moduli.

  **5. Supported Distributions and Add-ons**
  To accommodate diverse research requirements, three mutually incompatible builds are supported:
  *   **Brouwerian:** Includes choice sequences; standard for topology.
  *   **Bishop-style:** Predicative; maximises compatibility with classical analysis.
  *   **Russian (Markov):** Assumes recursive functions; includes Markov's Principle.

  Staff must select one build per project. Interoperability between builds is not guaranteed. Regarding add-ons, the Fan Theorem is available as an optional licence for separate installation. Users should exercise caution with the Axiom of Choice add-on; per Diaconescu's theorem, enabling Choice will inadvertently restore Excluded Middle, nullifying the migration benefits.

  **6. Known Issues**
  Several weak counterexamples have been logged under Known Issues. These anomalies typically arise from the 'creating subject' argument, where truth values depend on the temporal evolution of the mathematician's knowledge. Tickets regarding non-constructive existence claims will be closed without resolution.

  For support, please submit tickets to the Foundations Helpdesk. Do not attempt to downgrade to Classical logic locally; this will violate departmental compliance standards.

  **The Foundation Steering Group**
