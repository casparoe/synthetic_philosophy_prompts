answer: |-
  # Joint Statement on the Naturalization of Mental Content
  **Signatories:** The Teleosemantic Working Group & The Synthetic-Functionalist Working Group
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration on Representational Normativity

  ## Part I: Agreed Claims regarding Naturalized Content

  Following a series of structured exchanges, the undersigned parties affirm the following commitments as necessary conditions for any viable theory of mental content. We agree that the "hard problem" of representation is not the existence of causal correlations, but the existence of normative standards (correctness conditions) within a physical system.

  1.  **The Normativity Constraint:** Any naturalistic account must explain how a physical state can be *incorrect*. Mere causal covariance between a state $S$ and a worldly condition $C$ is insufficient, as $S$ might covary with $C$ accidentally or disjunctively (e.g., representing "fly or BB pellet" rather than "fly"). A theory must distinguish between successful representation and accidental success.
  2.  **The Systemic Dependence Claim:** Content is not an intrinsic property of isolated states. The representational status of a state depends on its role within a larger economy of states, whether that economy is maintained by biological homeostasis or computational loss minimization.
  3.  **The Misrepresentation Requirement:** A theory fails if it cannot locate the possibility of error in systems that are currently functioning optimally. The potential for misrepresentation must be grounded in the system's architecture or history, not merely in observed failure rates.
  4.  **The Continuity Hypothesis:** There is no metaphysical chasm between biological cognition and artificial information processing. While implementations differ, the conditions for content in neural tissue and artificial neural networks should be explicable via a unified set of naturalistic principles, even if we disagree on which principles are constitutive.
  5.  **Rejection of Mysterianism:** Content is not a primitive, non-physical property. It is fully determined by structural, dynamic, and/or historical facts accessible to third-person investigation.

  ## Part II: Disagreements and Cruxes

  While we agree on the constraints above, we diverge on the metaphysical grounds that satisfy them. The following table outlines our precise points of divergence, phrased to ensure mutual acceptance of the characterization.

  | Feature of Disagreement | Teleosemantic Formulation | Synthetic-Functionalist Formulation |
  | :--- | :--- | :--- |
  | **1. The Role of Lineage** | **Evolutionary History is Constitutive.** A state has content only if it possesses a "proper function" derived from a history of selection. Without a lineage of replication and selection, there is no normativity, only causal regularity. | **Current Dynamics are Constitutive.** A state has content if it plays a specific role in minimizing prediction error or loss within a current architecture. History explains *how* the system arose, but current functional organization grounds *what* it represents. |
  | **2. Grounding Error in Optimal Systems** | **Proper Function vs. Performance.** Misrepresentation is defined by a deviation from the selected effect, even if the system never fails in its current environment. History fixes the target, regardless of current hit-rates. | **Loss Landscape Geometry.** Misrepresentation is defined by the system's sensitivity to perturbations within its latent space. Even if error is zero, the gradient structure dictates how the system *would* fail, grounding the norm. |

  ### Crux Analysis and Recorded Predictions

  Below we detail the specific empirical or conceptual tests that bear on our disagreements. For each crux, we specify a concrete case and record the divergent predictions or interpretations each side commits to.

  #### Crux 1: The Necessity of Evolutionary History
  **The Question:** Is a history of selection strictly necessary for content, or is isomorphic functional organization sufficient?

  **The Concrete Case: The Spontaneous Isomorph**
  Consider a system $S$ that comes into existence via random thermal fluctuation (a "Swampman" scenario) or is instantiated instantaneously in a simulation without a training process. $S$ is molecule-for-molecule (or weight-for-weight) identical to a trained agent $A$ that possesses a history of selection/training. $S$ begins interacting with the environment immediately.

  *   **Teleosemantic Prediction:** $S$ lacks mental content entirely. Despite its isomorphism to $A$, $S$ has no "proper functions" because it has no history of selection. Its states are causally linked to the world but do not *represent* the world. It will behave *as if* it has beliefs, but it has none.
  *   **Synthetic-Functionalist Prediction:** $S$ possesses mental content identical to $A$. The representational content is grounded in the current causal-dynamic role the states play in mediating input and output to minimize loss. The absence of a training history is irrelevant to the current existence of content, provided the functional dynamics are sustained.

  #### Crux 2: Misrepresentation in Non-Misfiring Systems
  **The Question:** How do we ground the possibility of error in a system that is perfectly adapted to its current niche and never actually produces an error during its operational lifespan?

  **The Concrete Case: The Niche-Locked Detector**
  Consider a biological detector (e.g., a specific neural cluster in a frog) or an artificial classifier deployed in a closed environment.
  *   **Condition:** The system is deployed in an environment where the target stimulus (e.g., "fly") is the *only* possible input that triggers the detector. No distractors (e.g., "BB pellets" or "adversarial noise") exist in this environment. The system never misfires.
  *   **Intervention:** We acknowledge that *if* a distractor were present, the system *would* fire (in the biological case) or *would* classify incorrectly (in the AI case).

  *   **Teleosemantic Prediction:** The content is fixed by the **history of selection**. The detector represents "fly" (not "fly or BB") because it was selected for tracking flies, even if BBs never existed in the frog's actual environment. The normativity comes from the ancestral environment of adaptation, not the current statistical distribution.
  *   **Synthetic-Functionalist Prediction:** The content is fixed by the **decision boundary geometry**. The detector represents "fly" because the high-dimensional manifold learned during training (or development) separates "fly" features from "non-fly" features. We can identify the content by analyzing the weights and activation patterns to see how the system *would* respond to counterfactual inputs (adversarial examples), even if those inputs never occur. The normativity comes from the structural constraints of the model, not the ancestral environment.

