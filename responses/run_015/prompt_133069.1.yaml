answer: |-
  Here is the menu of philosophical claims your roommate is smuggling into that sentence, arranged from a trivial legalistic technicality to a radical dismantling of morality itself.

  For each, I have mapped the logic, checked the specific linguistic concepts you mentioned, and delivered a verdict on whether this actually excuses her behavior or if you are still right to be annoyed.

  ### 1. The Category Mistake (Trivial/Legalistic)
  *   **The Claim:** "Contract" refers strictly to legally enforceable agreements with remedies (damids, specific performance). "Speech act" refers to communication. Since a promise lacks a court of law to enforce it, it lacks binding power.
  *   **The Logic:** This argues that obligation requires an external enforcer. Without a judge, there is no duty, only preference.
  *   **Does it let her off the hook?** **No.**
      *   **Verdict:** This is a semantic bait-and-switch. It conflates *legal* obligation with *moral* obligation. Most ethical systems agree you can have a duty to someone without a judge involved (e.g., you can't legally sue your friend for lying, but it's still morally wrong). She is using a legal definition to dodge a moral expectation. You are still in the right.

  ### 2. The Prediction Trap (Propositional Content)
  *   **The Claim:** When she says "I promise," she is merely stating a proposition about her future mental state ("I currently intend to go"). She is not creating a new fact; she is describing an existing one.
  *   **The Logic:** This targets **propositional content**. It suggests the sentence "I promise to be there" has the same truth conditions as "I predict I will be there." If her intention changes, the original statement was true *at the time she said it*, so she hasn't lied.
  *   **Does it let her off the hook?** **Technically yes, but pragmatically no.**
      *   **Verdict:** If this were true, promising would be useless. We rely on promises specifically because they are *more* than predictions; they are commitments to *keep* the intention stable. If she uses this defense, she is admitting she treats her promises as mere weather forecasts. She is technically consistent, but she is opting out of the shared understanding of language. You are morally right to expect more; she is linguistically gaming the system.

  ### 3. The "Chess Move" Defense (Conventional Weight)
  *   **The Claim:** Promises are like moves in a game (e.g., castling in chess). They only have weight if both players agree to play by the rules of that specific institution.
  *   **The Logic:** This addresses **conventional weight**. It argues that the obligation is artificial, created only by mutual participation in the "Practice of Promising." If she decides she isn't playing the game anymore, the move (the promise) becomes just a noise, like moving a rook diagonally.
  *   **Does it let her off the hook?** **Only if she opted out beforehand.**
      *   **Verdict:** You cannot unilaterally declare the game over *after* making a move. By participating in the conversation and using the word "promise," she implicitly agreed to the rules of the institution. To claim the rules don't apply *after* you've benefited from them (getting you to expect her) is cheating. She is in the wrong.

  ### 4. The "No Deontic Magic" Argument (Illocutionary Force)
  *   **The Claim:** Speaking words cannot physically alter the normative structure of the universe. You cannot create an "ought" (obligation) simply by making a sound with your mouth.
  *   **The Logic:** This attacks **illocutionary force**. It denies that the act of speaking itself generates duty. It argues that for an obligation to exist, there must be a pre-existing reason (like love or mutual benefit), not just the utterance of the promise itself.
  *   **Does it let her off the hook?** **Yes, but at a high cost.**
      *   **Verdict:** If this is true, *no one* is ever bound by their word unless they have a separate reason to be. This destroys the utility of promising entirely. While this might excuse her specific action, it implies she is incapable of entering into binding agreements of any kind. She is "off the hook" for the gallery opening, but she has also removed herself from the category of a reliable partner.

  ### 5. The "Collateral is Fiction" Thesis (Radical/Moral Nihilism)
  *   **The Claim:** The "debt" incurred by a promise is a social fiction. There is no metaphysical glue holding the future to the past. The "cost" of breaking a promise is just social awkwardness (loss of reputation), not a moral violation.
  *   **The Logic:** This addresses **promissory collateral**. It argues that the "bond" you feel is just anxiety about social consequences, not actual wrongdoing. It treats morality as a power dynamic rather than a truth.
  *   **Does it let her off the hook?** **Yes, completely.**
      *   **Verdict:** This is the nuclear option. If this is true, nothing is morally wrong, only socially inconvenient. However, holding this view makes her a sociopath in the context of friendship. She is "right" only in a universe where trust does not exist. In a friendship, this view is a betrayal.

  ***

  ### Which one is she actually using?

  When someone uses this line to win an argument about flaking, they are almost always running a **Motte-and-Bailey** strategy between **Claim 1 (Legalistic)** and **Claim 5 (Nihilism)**.

  *   **The Motte (The defensible position):** "It's not a *legal* contract." (True, trivial, boring).
  *   **The Bailey (The desired conclusion):** "Therefore, I have done nothing *morally* wrong." (False, radical, self-serving).

  She wants you to accept the truth of the first claim (it's not a contract) to smuggle in the conclusion of the last claim (I have no obligation).

  **The Bottom Line:**
  She is relying on the ambiguity of the word "contract." In law, a contract requires consideration (exchange of value) and intent to create legal relations. In morality, a promise *is* a contract of trust. By insisting on the legal definition, she is trying to dissolve the moral one.

  **You are in the wrong** only if you agree that friendships are governed solely by legal statutes.
  **She is in the wrong** because she is using a technical distinction about "speech acts" to evade the interpersonal reality that her words created an expectation she chose to disregard. She isn't making a philosophical point; she is weaponizing jargon to avoid guilt.
