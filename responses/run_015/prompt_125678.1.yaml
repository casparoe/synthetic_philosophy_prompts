  **1. Bottom line**
  The panel certifies T.V. as "engaged" on the court referral form to be filed by Thursday. However, this certification is contingent upon internal conditions enforceable within Cedar Row. T.V. must participate in a targeted clinical module addressing narrative fatalism, facilitated by the senior counselor, over the next thirty days. Failure to participate constitutes a program violation independent of court status. We acknowledge the plan's logistical strength while mandating work on the psychological framing. This avoids returning a compliant resident to court while respecting the clinical concern that his current self-concept risks long-term stability. The court receives the "engaged" box; the resident receives the requirement to examine why he believes failure is inevitable. We prioritize behavioral compliance for the court while reserving therapeutic intervention for the clinic.

  **2. The record**
  T.V. is thirty-four, eight weeks into residence, referred following a third OWI. He has recorded no infractions. Unit staff describe him as exceptionally compliant and hardworking. His submitted recovery plan includes a filed housing application, a secured outpatient slot, a confirmed sponsor, and two identified support contacts. During the week-six presentation, he stated: "I'm an addict. I'll do this plan because you need me to... I'll probably drink again when I get out." When informed his presentation was insufficient, he offered to re-present and "say it however you want it said." The outcome file indicates no correlation between week-six engagement scores and six-month abstinence. The court form allows only binary selection. These facts establish a resident who performs recovery tasks impeccably but verbalizes a fixed, externalized locus of control.

  **3. The two readings, at their strongest**
  The clinical director argues that the manual defines engagement as internalizing the plan as choice rather than requirement. T.V. explicitly locates motive externally ("because my PO needs it") and frames addiction as a fixed identity ("I'm an addict"). To certify him as engaged while he vocalizes the opposite renders the manual's directive—that addiction is a set of choices—decorative. This reading implies the recovery plan is a psychological contract; signing it without believing it is performative compliance. If we ignore this, we signal that language has no consequence, potentially reinforcing the disease model he claims is immutable.
  The senior counselor argues that requiring specific avowals from a resident whose liberty we hold manufactures compliance, not engagement. She identifies T.V.'s fatalism as honest inventory, similar to her own early recovery, where admitting powerlessness preceded empowerment. This reading implies the plan is a behavioral scaffold; owning the steps matters more than predicting the outcome. Forcing optimism teaches residents to narrate themselves according to clipboard rewards, undermining the authenticity the manual seeks. She contends that distinguishing plan ownership from outcome prediction is vital; T.V. owns the work while doubting the result, which is a stable position for growth. The counselor fears that invalidating honesty validates deception. Both agree the goal is sustained recovery, but diverge on whether linguistic alignment is a prerequisite.

  **4. What 'engagement' should be read to require**
  We must construe "engagement" in light of our outcome data and the court's function. The data shows no relationship between week-six engagement scores and six-month abstinence. Therefore, the item cannot reliably predict success, nor should it function as a high-stakes gatekeeper for placement based on ideological purity. The court requires assurance of public safety and procedural compliance, not philosophical alignment. Consequently, "engagement" should be read to require actionable commitment to the plan's mechanics rather than avowal of its efficacy.
  The manual's statement that "addiction is not an identity" is a clinical goal, not an admission ticket. If we treat it as a litmus test, we privilege speech acts over behavior. T.V. has filed housing applications and secured outpatient care; these are behaviors. Engagement must measure the resident's willingness to execute the plan, even if their confidence is low. To demand otherwise is to demand residents lie about their confidence to satisfy panelists.
  Furthermore, the coercive nature of court-ordered treatment complicates the "choice" requirement. When liberty is contingent on avowal, the avowal loses evidentiary value. T.V.'s offer to "say it however you want" proves he knows how to game the system. Certifying him "not engaged" based on words he hasn't said yet rewards manipulation. The manual's vocabulary lacks a clean way to distinguish owning a plan from predicting success, but our practice must create that distinction. We certify based on the work done, not the confidence felt. This preserves the item's utility for the court while allowing clinical work on the fatalism to proceed internally without threatening housing. We interpret the manual as setting a trajectory for treatment, not a barrier to entry. The director's concern is valid clinically but should not trigger legal violation. This interpretation aligns with the program's mission to serve court referrals effectively.

  **5. The case we are rejecting**
  We reject the clinical director's recommendation to certify "not engaged." Her position is that certifying T.V. nullifies the manual's core distinction between compliance and engagement. If a resident can claim addiction is a fixed trait and still pass, the program teaches that language doesn't matter. This undermines the therapeutic model where recognizing choice is the first step of recovery. Sending him back to court reinforces the consequence of disengagement and protects the program's integrity from becoming a mere processing center for court orders. Her stance protects the philosophical coherence of our treatment model. It is a principled stand.
