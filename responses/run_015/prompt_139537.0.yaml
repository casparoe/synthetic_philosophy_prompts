answer: |-
  ### Preliminary Sketch

  **Candidate Analogies:**
  1.  **Munich 1938:** Aggression unchecked invites further aggression. Saddam = Hitler. Kuwait = Sudetenland. Sanctions = Appeasement. War = Necessary defence of order.
  2.  **Vietnam 1965–75:** Intervention leads to quagmire. Domestic will collapses. Military needs clear objectives, overwhelming force, and an exit strategy. Ground occupation = Failure.
  3.  **Thucydides Trap:** Rising power (Iraq) vs. Established power (US). *Verdict:* Poor fit. Iraq was a regional disruptor, not a systemic hegemon challenging US global primacy. The US was not containing Iraq's rise so much as policing a norm.

  **Functions of Analogy (User's Lens):**
  1.  **Predictive:** Base rates. "If X, then Y." (e.g., Appeasement leads to wider war).
  2.  **Procedural:** Decision rule. Shifts burden of proof. (e.g., "Presume intervention is necessary" vs. "Presume intervention is fatal").
  3.  **Authorising:** Moral narrative. Makes action sayable. (e.g., "Churchillian resolve" vs. "Prudent caution").

  **Tensions:**
  *   Predictive claims are rarely falsifiable in real-time.
  *   Munich and Vietnam offer opposing procedural rules (Act vs. Restrain).
  *   Both possess high moral clarity (Good vs. Evil; Folly vs. Wisdom) which biases selection.
  *   Hypothesis: Analogies are epiphenomenal to material/strategic decisions.

  **Initial Verdict:**
  The Munich analogy drove the *entry* (authorising/procedural). The Vietnam analogy drove the *exit* and *method* (procedural/constraint). Both were largely epiphenomenal to the core strategic interest (oil stability/post-Cold War order), but the Vietnam analogy had genuine causal bite on the *conduct* of the war (Powell Doctrine).

  ***

  ### Case Analysis: The Analogies in Play

  **Munich 1938**
  *   **Relevant Agents:** George H.W. Bush, Margaret Thatcher, James Baker.
  *   **Options on Table:** Containment via sanctions vs. Immediate coercive force.
  *   **Evidence Required:** Proof that Saddam's ambitions were unlimited and that economic pressure would fail merely to buy him time to rearm. A predictive use would require a defined reference class of "dictators annexing neighbours in a vacuum of hegemony" and a stated probability that sanctions would fail more than, say, 60% of the time in such cases.
  *   **Actual Use:** The analogy was not used predictively but procedurally. It shifted the burden of proof onto those advocating restraint. To argue for sanctions was to argue for appeasement; the moral cost of being wrong (another Hitler) outweighed the material cost of being wrong (unnecessary war).
  *   **Fit:** Structurally weak. Saddam was not ideologically driven to global conquest in the manner of Hitler, nor did he possess the industrial base to threaten the hegemon directly. The analogy worked only because the Cold War had just ended, leaving a vacuum of moral clarity that Munich conveniently filled.

  **Vietnam 1965–75**
  *   **Relevant Agents:** Colin Powell (Chairman of Joint Chiefs), Dick Cheney (SecDef), Congressional Democrats.
  *   **Options on Table:** Scope of ground war. Occupation of Baghdad vs. Liberation of Kuwait.
  *   **Evidence Required:** Proof that the Iraqi state would fragment upon defeat, requiring a long-term occupation force, and that domestic support would erode over time. A predictive use would require a base rate of "conventional armies defeated in desert terrain" leading to insurgencies.
  *   **Actual Use:** Primarily procedural and constraining. It established the "Powell Doctrine": do not commit force without clear objectives, overwhelming strength, and an exit strategy. This analogy did not prevent the war; it prevented the *occupation*.
  *   **Fit:** Structurally stronger than Munich regarding the *aftermath*. Iraq was a multi-sectarian state held together by force; removing the lid risked the exact kind of open-ended commitment Vietnam warned against.

  **The Thucydides Trap**
  You are correct to suspect this fits badly. The Thucydides Trap describes a structural stress between a rising power threatening to displace an established hegemon. Iraq in 1990 was not a rising hegemon; it was a indebted regional power acting out of economic desperation and miscalculation. The US was not acting out of fear of displacement, but out of a desire to maintain the rules of the international system it dominated. Invoking this analogy would have confused the moral narrative (aggressor vs. victim) with a realist narrative (competitor vs. hegemon). It adds nothing here except noise.

  **Did They Cancel Out?**
  No. They operated sequentially and hierarchically. Munich authorised the *initiation* of force; Vietnam authorised the *limitation* of force. The decision to stop short of Baghdad was not a compromise between the two, but a victory for the Vietnam analogy within the military planning sphere, once the Munich analogy had secured the political permission to fight.

  ### Lens Analysis: Testing Your Hypothesis

  **The Three Jobs: Distinct or Collapsed?**
  Your distinction holds, but the predictive job is not merely rare; it is almost always a disguise for the procedural job. When Bush invoked Munich, he was not offering a probability estimate of future aggression. He was establishing a rule: *In cases of naked aggression, the presumption is force.* The predictive language ("If we do not act now, we will face a larger war later") is rhetorical scaffolding for a procedural shift in the burden of proof. The authorising job is distinct; it concerns public legibility, not decision rules. You can authorise without procedurally constraining (e.g., moral rhetoric with no policy change), but in this case, the authorising narrative (New World Order) locked in the procedural rule (Collective Security).

  **Confirmation of Your Hypothesis**
  1.  **Predictive Rarity:** Confirmed. No actor in 1990 produced a reference class or a base rate. The "prediction" that Saddam would build a nuclear weapon within months or years was a speculation dressed as historical inevitability.
  2.  **Bias Towards Moral Clarity:** Confirmed. Munich and Vietnam are "clean" histories. They have clear villains and clear endings. The Gulf Crisis was messy: involved monarchical allies, oil price stability, and UN realpolitik. The analogies stripped this complexity away to make the situation legible.
  3.  **Epistemic Symmetry vs. Psychological Asymmetry:** Confirmed. While both analogies are historically contingent, Munich carried a heavier moral weight in 1990. To invoke Vietnam was to be cautious; to invoke Munich was to be virtuous. This asymmetry allowed the administration to override Vietnam-based caution regarding *entry*, while accepting Vietnam-based caution regarding *exit*.

  **Epiphenomenal or Causal?**
  Your hypothesis suggests the analogies were epiphenomenal, decorating decisions taken on other grounds. I would refine this. They were epiphenomenal regarding the *strategic decision to intervene* (driven by oil markets and post-Cold War ordering), but they were *causal* regarding the *tactical conduct* of the war. The Vietnam analogy directly caused the decision to limit the ground war to 100 hours and forbade the march on Baghdad. Without the Vietnam memory, the Powell Doctrine does not exist in that form, and the coalition likely fractures during occupation. Thus, the analogy was not merely decorative; it was constitutive of the war's termination conditions.

  **The Fourth Job: The Constitutive Function**
  You ask if there is a fourth job. There is. Analogy does not just predict, procedure, or authorise; it *constitutes* the reality of the situation for the actors. Before the analogy is applied, the situation is a fog of intelligence reports, oil prices, and diplomatic cables. The analogy tells the actors *what kind of thing* this is. Is it a crime (Munich)? Is it a trap (Vietnam)? This is not just making it "thinkable"; it is defining the ontology of the crisis. If it is a Munich-type crisis, then police action is the appropriate category. If it is a Vietnam-type crisis, then counter-insurgency is the category. This job is silent in your framework because it precedes the other three. You cannot predict or authorise until you have constituted the event.

  **Silences and Limitations**
  Your framework cannot tell you whether the war was *right*. It can only tell you how the justification was structured. It is silent on material interests (oil, arms sales) unless those interests are dressed in analogical clothing. It is also silent on the *truth* of the analogy. A procedural rule can be followed perfectly based on a false analogy (e.g., treating Saddam as Hitler led to correct action for incorrect reasons). Finally, it cannot account for *bureaucratic inertia*. Sometimes decisions are made not because of an analogy, but because the military machine was already primed for a conventional desert war, making the Vietnam warning easy to heed (no insurgency expected) and the Munich warning easy to enact (conventional enemy available).

  ### Confidence Note

  I am highly confident in this reading. The separation of the analogies by phase (Munich for entry, Vietnam for exit) is robustly supported by the public record and the internal logic of the coalition management.

  The claim I am least sure of is the assertion that the Vietnam analogy was *causal* in stopping the march on Baghdad, rather than merely coincident with strategic constraints (coalition fragility, lack of legal mandate, oil market stability).

  The consideration that would most quickly change my mind is evidence that the Bush administration seriously planned for occupation and was only stopped by external pressure, rather than internalising the Vietnam lesson. If diaries or memos from January 1991 show Bush champing at the bit to remove Saddam and being restrained solely by Baker or the UN partners, then the Vietnam analogy was epiphenomenal even regarding the termination, and my attribution of causal power to it collapses.
