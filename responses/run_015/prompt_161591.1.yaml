      *   *Key Insight:* The NTT assumes the *only* gain from trade is informational. If there are *other* gains (hedging, consumption, utility from sharing), trade happens. In science, the utility is reputation/priority, which is distinct from the "asset value" of the truth.

  6.  **Final Structure:**
