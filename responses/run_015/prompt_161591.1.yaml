          *   *Common Priors:* NTT *requires* common priors. Epistemic diversity (different priors) is a feature, not a bug. If we had common priors, we wouldn't need to talk.
          *   *Costly Signaling:* Publishing isn't just "saying I know." It's "burning money/reputation to show I know." NTT assumes costless cheap talk or pure financial betting. Costly signaling bypasses NTT.
      *   **Explain Why (6) Fails:**
