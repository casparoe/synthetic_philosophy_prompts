answer: |-
  Dear Students,

  The following conceptual map is intended to serve as a diagnostic tool for navigating the complex terrain of classical and Navya-Nyāya epistemology, specifically regarding the autonomy and reducibility of the means of valid cognition. Rather than presenting a historical chronicle of schools, this taxonomy arranges positions according to the logical commitments they entail regarding the necessity and independence of specific cognitive sources. We begin at the root of the tree with the most fundamental division in the logical space, which concerns whether the dual apparatus of direct perception and logical inference is sufficient to account for all instances of valid knowledge. If one maintains that sensory contact with particulars and the extrapolation of universals or hidden properties through logical marks exhausts the possibilities for cognition, one occupies the most restrictive terminal leaf of this taxonomy. This position denies the need for any additional sources and typically aligns with the skeptical or materialist stances found in Cārvāka thought and certain Buddhist epistemological traditions, which argue that what others call testimony or analogy can be fully reconstructed through perception and inference alone. This leaf represents the baseline of empiricist reductionism where no sui generis authority is granted to language or comparison.

  However, if one rejects the sufficiency of perception and inference, the taxonomy branches into a second commitment concerning the status of verbal testimony. Here the concrete conceptual case is whether understanding a reliable speaker requires an irreducible authority relation or whether it can be reconstructed as an inferential chain involving speaker reliability and linguistic convention. If you hold that testimonial knowledge is merely inferred reliability, you align with a reductionist stance that treats testimony as a subset of inference. This position is logically distinct from the view that testimony transmits knowledge directly without the intermediate step of inferring the speaker's truthfulness. Within our logical space, the view that reduces testimony to inference occupies a specific branch that contrasts sharply with the classical Nyāya view, which maintains that testimony is an autonomous source. It is within this reductionist branch regarding testimony that we locate the stance sometimes characterized as a Mīmāṃsā-inspired reduction of śabda to anumāna, where the validity of verbal communication is grounded not in an intrinsic power of words but in the inferential recognition of the speaker's competence and honesty. Conversely, if one asserts that testimony is irreducible, the taxonomy proceeds to a third branching point concerning analogical comparison.

  At this stage, the question is whether analogical comparison operates as an independent source or collapses into perception coupled with inference. The concrete claim to consider is whether learning the meaning of a word like gavaya by seeing a similar animal and recalling the term cow requires a distinct cognitive mechanism or is simply a matter of perceiving similarity and inferring the name. If one argues that analogy collapses into perception and inference, one occupies a leaf that reduces the canonical sources to three: perception, inference, and testimony. This position is often adopted by those who seek to minimize ontological commitment while preserving the utility of language. However, if one maintains that analogy is independent, the taxonomy reaches its final major split concerning the cognition of absence. Here the specific conceptual case is whether recognizing that there is no pot on the ground demands recognition as a distinct fifth means or can be subsumed under one of the canonical four, perhaps as a failure of perception or a specific type of inference. If one argues that negative cognition involves a separate perceptual faculty rather than an absence registered within ordinary perception, one arrives at the most expansive leaf of the taxonomy, which accepts five autonomous sources. This is the position associated with the Navya-Nyāya innovation that introduces anupalabdhi as a distinct means, as well as certain strands of Mīmāṃsā thought that defend the irreducibility of non-perception.

  Between these extremes lies the standard classical Nyāya view that maintains four autonomous pramāṇas. This position accepts the independence of perception, inference, comparison, and testimony, but rejects the need for a fifth means of absence, subsuming the cognition of non-existence under perception or inference. This view occupies the central leaf of our taxonomy where testimony and analogy are irreducible but absence is not. It is important to note that there is also room within this logical space for a synthetic stance that preserves the four traditional labels but reinterprets their internal relations. Such a view might formally accept the four-fold scheme but functionally treat analogy as a complex form of perception, thereby replicating the structural commitments of the classical scheme under revised descriptions. This synthetic position often lands in the same terminal leaf as the classical Nyāya view regarding the count of sources, yet it differs in its internal mechanics. This brings us to a crucial limitation of the taxonomy: there are pairs of positions that these branches genuinely cannot separate. Specifically, the classical Nyāya view and the synthetic stance that preserves the four labels but reinterprets their relations may appear identical at the level of counting autonomous sources. If the taxonomy is built solely on the number of irreducible sources, these two positions converge on the same leaf despite their doctrinal differences regarding the internal nature of comparison. This indistinguishability highlights that a taxonomy based on autonomy counts may obscure deeper metaphysical disagreements about the cognitive architecture underlying the labels.

  Furthermore, we must note explicitly any combinations in the logical space that remain unoccupied. For instance, there is no significant historical position that accepts the independence of absence as a fifth source while simultaneously denying the independence of testimony. Such a view would claim that we need a special faculty to know nothing is present but that we do not need a special faculty to know something from a reliable speaker. This gap likely reflects incoherence or mere unattractiveness, as the epistemic weight required to justify a distinct means for absence usually entails a robust realism that would also support the autonomy of testimony. Similarly, a view that accepts analogy as independent but reduces testimony to inference is logically possible but historically unoccupied. This gap likely reflects historical neglect or the intuitive difficulty of granting independence to comparison while denying it to language, given that analogy often relies on linguistic conventions. These empty spaces suggest that the commitments regarding language and comparison tend to rise or fall together in the history of thought. Finally, it is worth observing that while the Navya-Nyāya position introduces anupalabdhi, it does not necessarily abandon the four-fold structure but rather expands it. Thus, the transition from classical to Navya-Nyāya is represented in this taxonomy as a movement from the four-fold leaf to the five-fold leaf. However, if a later synthesis were to argue that absence is real but known through perception, it would return to the four-fold leaf, demonstrating how revised descriptions can shift positions across the logical branches without changing the enumerated count of sources. This map should therefore be used not as a fixed catalog of doctrines but as a dynamic instrument for testing the consistency and implications of your own epistemological commitments regarding the sources of valid knowledge.
