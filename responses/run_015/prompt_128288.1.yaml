      *   *Check:* "Which single requirement excludes the most candidate theories?" Likely the Normative Gap (allows error) or Interpersonal Comparability. I'll argue for Normative Gap/Welfare Distinction.

  13. **Final Polish:** Ensure the distinction between the brainstorm phase and the final spec is clear. Ensure the "Case" for each requirement is persuasive for a director.

  *(Self-Correction on the "Three Labels")*: The user asks me to tell them whether they're the right ones. I need to be explicit. They are useful distinctions, but demanding one utility function do all three is the error.
