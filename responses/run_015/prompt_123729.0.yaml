answer: |-
  **The Scenario**

  A city hospital tracks "Admitted Patient Survival Rate" as a proxy for "Community Cardiac Health," assuming that better community health leads to easier cases and higher survival. During a normal year, 1,000 residents suffer cardiac events; all are admitted, and 900 survive (90% survival), reflecting stable community health. In a crisis year, a pollution spike doubles cardiac events to 2,000 residents, degrading community health (True Value DOWN), but the hospital's ICU capacity remains fixed at 1,000 beds. Doctors, acting on honest triage ethics to save the most lives possible, admit only the 1,000 patients with the highest likelihood of survival, turning away the most critical cases who die at home. Of the 1,000 admitted, 950 survive (95% survival). The metric (Admitted Survival) goes UP from 90% to 95%, while the reality (Total Community Survival) goes DOWN from 90% to 47.5% (950 survivors out of 2,000 incidents).

  ***

  **The Structure & Numbers**

  | Variable | Normal Year | Crisis Year | Direction |
  | :--- | :--- | :--- | :--- |
  | **Total Cardiac Events** (Population Risk) | 1,000 | 2,000 | **Worse (UP)** |
  | **ICU Capacity** (Constraint) | 1,000 | 1,000 | Fixed |
  | **Patients Admitted** (Selection) | 1,000 (All) | 1,000 (Healthiest only) | Selected |
  | **Patients Turned Away** | 0 | 1,000 (Sickest) | **Worse (UP)** |
  | **Total Survivors** (True Value) | 900 | 950 | **Worse (Relative to need)** |
  | **Community Survival Rate** (True Value Proxy) | 900/1,000 = **90%** | 950/2,000 = **47.5%** | **DOWN** |
  | **Hospital Metric** (Admitted Survival) | 900/1,000 = **90%** | 950/1,000 = **95%** | **UP** |

  *Note on True Value:* While absolute survivors rose slightly (900 to 950), the *rate* of survival for the community collapsed (90% to 47.5%). If we define True Value as "Probability of a Citizen Surviving a Cardiac Event," it plummeted. The metric suggests the hospital improved, while the citizen's actual odds halved.

  ***

  **The Flavour of Goodhart**

  This is **Extremal Goodhart** (specifically driven by **Selection Bias**).

  In the standard taxonomy (Manheim & Garrabrant), *Adversarial Goodhart* involves agents gaming the system (ruled out here). *Causal Goodhart* implies the metric itself changes the outcome. This scenario fits **Extremal Goodhart**: the correlation between the proxy (Admitted Survival) and the goal (Community Health) holds in the "normal" regime but breaks when the system is pushed into a "tail" regime (overcapacity).

  The statistical engine is **Conditioning on a Collider**. By conditioning the metric on "Admitted," and making "Admitted" dependent on "Severity," you sever the link between the metric and the population. In normal times, Admission is independent of Severity (everyone gets in). In crisis times, Admission is negatively correlated with Severity. The metric doesn't break because people lied; it breaks because the *population generating the data changed*.

  ***

  **Why The Obvious Fix Fails**

  **The Fix:** "Add a second measure: Total Patients Turned Away."
  **Why it fails:** This treats the problem as an *information deficit*, but it is actually a *structural constraint*. Knowing you turned people away doesn't fix the bed shortage, nor does it re-couple the survival rate to community health. If management optimizes for "High Survival Rate + Low Turnaways," they simply admit everyone again, causing the Survival Rate to crash to 47.5%, which punishes the hospital for being honest about the crisis. The metric becomes a lose-lose signal: either you game the triage (high survival, high turnaways) or you accept the crash (low survival, low turnaways).

  **The Core Feature:** The metric is a **Ratio** (Survivors/Admitted), but the True Value is an **Aggregate Probability** (Survivors/Population). When the denominator of the ratio (Admitted) is no longer a representative sample of the Population, the Ratio becomes mathematically incapable of tracking the Aggregate.

  **What Must Change:** For the number to be trustworthy again, the **selection process must be randomized** or **capacity must exceed demand**. You would need to admit patients by lottery rather than triage to restore the statistical link, which is ethically untenable.

  **How to Defend the Number:** A defender would argue the metric is not measuring *Public Health*, but *Clinical Competence*. They would say: "This number tells you how good our doctors are at saving the patients they touch, not how many beds we have. It remains a trustworthy measure of *medical skill*, even if it is a broken measure of *public safety*." They defend it by narrowing the scope of what the number claims to represent.
