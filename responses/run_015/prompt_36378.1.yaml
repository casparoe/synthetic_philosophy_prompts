prompt: |-
  I've been arguing with my roommate about death (morbid, I know, but it started because we watched a documentary about cryonics). She's basically an Epicurean: she says death can't be bad for you, because when you're dead there's no you around for anything to be bad for. No subject of harm, no harm. I keep reaching for the standard reply, the deprivation account — death is bad because it robs you of the goods your future would have contained, the same way a stolen lottery ticket is bad even if you never learn it was stolen. But she has two comebacks I find annoyingly hard to answer. First, the Lucretius thing: if the deprivation of your future is what makes death bad, why isn't the deprivation of your PAST bad too? Nobody thinks the eons before their birth were a tragedy, and she says the symmetry shows the deprivation story can't be the whole story. Second, the timing puzzle: if death is bad for you, WHEN is it bad for you? Before you're dead (you're not deprived yet), during (you don't exist), after (same problem)? She says a harm with no time at which it's had is no harm at all.

  To make it worse, my cousin threw in a variant idea he came up with himself, which I haven't seen anywhere: he thinks even if you grant the deprivation account, the badness of death should depend on the SLOPE of your life at the moment you die, not on the total goods remaining. On a steep upward trajectory (young, happy, things finally clicking) death is a catastrophe; on a flat or declining one, less bad, maybe not bad at all, even if you'd still have had a decent chunk of okay years ahead. He calls it the momentum view, and honestly I suspect it smuggles in something about the shape or narrative of a life mattering separately from its contents, which is its own controversial commitment. Does the deprivation account even have room for shape-of-life value, or is that a different theory of death's badness pretending to be a refinement?

  So: write an essay on whether death can be bad for the person who dies. Weigh the Epicurean arguments (the no-subject point, the symmetry with prenatal nonexistence, the timing puzzle) against the deprivation account and whatever fixes philosophers have proposed for the timing problem, and take my cousin's momentum view seriously enough to say whether it's a coherent refinement or just confused. Don't end on a wishy-washy "both sides have a point" — I want you to actually reach and defend a verdict, even if it's a qualified one (like "death is bad for you only when X and Y hold"). Also I'd appreciate it if you addressed whether your verdict implies anything about the badness of death for someone whose remaining future would have been mostly suffering, since that's where my roommate thinks she has me cornered for sure.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Is death bad for the person who dies?
      *   **Key Arguments to Address:**
          *   Epicurean View (No subject of harm).
          *   Deprivation Account (Death is bad because it deprives you of future goods).
          *   Lucretius' Symmetry Argument (Prenatal vs. Postmortem nonexistence).
          *   The Timing Puzzle (When is the harm experienced?).
          *   Cousin's "Momentum View" (Badness depends on the slope/trajectory of life, not just total goods).
      *   **Specific Constraints:**
          *   Do not end on a wishy-washy "both sides have a point."
          *   Reach and defend a verdict (even if qualified).
          *   Address the implication for lives with mostly suffering remaining (the "cornered" scenario).
          *   Tone: Philosophical but accessible (given the context of a roommate/cousin argument).

  2.  **Deconstruct the Arguments:**

      *   **Epicureanism:**
          *   *Core:* "Where death is, I am not." Harm requires a subject.
          *   *Strength:* Logically tight on the metaphysics of existence.
          *   *Weakness:* Counterintuitive. We *feel* death is a tragedy. It ignores comparative value.

      *   **Deprivation Account (Nagel, etc.):**
          *   *Core:* Death is bad because it prevents possible goods.
          *   *Strength:* Explains why death is bad without needing a conscious subject to *feel* the badness at the moment. It's a comparative harm (Actual World vs. Possible World).
          *   *Weakness:* Vulnerable to Symmetry and Timing objections.

      *   **Lucretius' Symmetry:**
          *   *Core:* Time before birth is like time after death. We don't regret the former, so why the latter?
          *   *Counter:* Asymmetry of possibility. We *could* have lived later; we *could not* have been born earlier (usually). The future is open; the past is fixed.

      *   **The Timing Puzzle:**
          *   *Core:* If death is a harm, when does the harm occur?
          *   *Solutions:*
              *   *Timeless Harm:* It's a fact about the life as a whole, not a momentary event.
              *   *Eternalism:* The harm exists at all times (past, present, future) relative to the life.
              *   *Counterfactual Timing:* The harm occurs at the time the goods *would have been* experienced.

      *   **Cousin's Momentum View:**
          *   *Core:* Badness depends on the *slope* (trajectory), not just the sum.
          *   *Analysis:* This sounds like a "Narrative" or "Shape of a Life" view (Velleman, Slote). It suggests a peak-end rule or a preference for improvement.
          *   *Critique:* Is it a refinement of deprivation or a rival? If deprivation is about *goods*, and "momentum" is a *good*, then it fits. If "momentum" is valuable independently of goods, it's a rival. It risks being counterintuitive (is a long, flat, happy life worse than a short, skyrocketing one?).

  3.  **Formulate a Verdict:**
      *   I need to take a stand. The Deprivation Account is the standard philosophical heavyweight for a reason. It survives the Epicurean critique best, provided we adjust our understanding of "harm."
      *   I need to incorporate the Momentum View. It's not a refutation of deprivation, but a necessary *qualifier*. Total goods matter, but the distribution matters too (diminishing marginal utility, narrative value).
      *   I need to address the "Suffering" corner case. If the future contains net suffering, death is not bad (it might be good). This saves the Deprivation Account from absurdity.

      *   *Proposed Verdict:* Death is bad for the person who dies *if and only if* it deprives them of a future containing a net balance of positive value, where "value" includes both aggregate goods and a coherent narrative trajectory (accommodating the Momentum View). The Epicurean timing/subject objections fail because harm is comparative, not experiential.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene (roommate argument). State the thesis clearly.
      *   **The Epicurean Challenge:** Explain the "No Subject" argument. Acknowledge its logical force but highlight its counterintuitive cost.
      *   **The Deprivation Defense:** Introduce Nagel's view. Explain comparative harm.
      *   **Addressing Lucretius (Symmetry):** Distinguish past vs. future based on possibility. We can't change the past start date; we can lose the future end date.
      *   **Addressing Timing:** Propose the "Counterfactual Timing" or "Timeless Fact" solution. The harm is located when the goods *would have occurred*.
      *   **The Momentum View (Cousin):** Analyze this carefully. Is it distinct? Yes, it appeals to *shape*. Is it compatible? Yes, if shape is a constituent of well-being. But warn against valuing slope over substance (the "tragic hero" trap).
      *   **The Suffering Corner Case:** This is crucial. If the future is net negative, deprivation is a *benefit*. This validates the theory.
      *   **Conclusion:** Reiterate the verdict. No fence-sitting.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the Timing Puzzle sufficiently? I need to be specific. The "Eternalist" or "Atemporal" solution is usually best here. The harm is a property of the life *as a whole*, not an event *in* time.
      *   *Check:* Is the Momentum View treated fairly? Don't dismiss it as confused. It aligns with "Shape of a Life" concerns (Velleman). But I must argue it's a *component* of deprivation, not a replacement.
      *   *Check:* The Verdict. Make sure it's punchy. "Death is a comparative harm..."
      *   *Check:* The Suffering Case. Ensure I explicitly state that in this case, the roommate is right, but for the wrong reason (it's not that death *can't* be bad, it's that in *this specific instance*, it isn't).

  6.  **Final Polish:**
      *   Ensure tone is engaging but rigorous.
      *   Check word count and flow.
      *   Make sure the "Momentum View" gets a specific label (e.g., "The Trajectory Objection").
      *   Ensure the distinction between "experiential harm" and "comparative harm" is clear, as that defeats the Epicurean.

  7.  **Final Review against constraints:**
      *   Essay format? Yes.
      *   Weigh Epicurean vs. Deprivation? Yes.
      *   Address Symmetry & Timing? Yes.
      *   Address Momentum View? Yes.
      *   Defend a verdict? Yes.
      *   Address suffering future? Yes.

  *(Self-Correction on the Momentum View)*: I need to be careful not to just say "it's part of deprivation." I need to evaluate if it's coherent. If I die at my peak, I lose the decline. Is the decline a "good"? Usually no. So dying at a peak might actually *save* you from the deprivation of a decline. But the cousin says dying on an upswing is *worse*. Why? Because of unfulfilled potential. This aligns with the "Zeigarnik effect" or narrative tension. I will argue this is a valid modifier of deprivation, not a refutation.

  *(Self-Correction on Timing)*: The best answer to "When is the harm?" is "At the time the goods would have been experienced." This is the standard Nagel/Parfit line. I'll stick with that.

  *(Final Verdict Formulation)*: Death is bad when it truncates a life that, on balance (considering both sum and shape), would have been worth living.

