answer: |-
  **The Harm of Nonexistence: A Defense of the Deprivation Account**

  The argument you are having with your roommate is one of the oldest and most persistent in philosophy. It pits the cold logic of metaphysics against the hot intuition of human loss. Your roommate, channeling Epicurus and Lucretius, argues that death cannot be a harm because there is no subject to experience the harm. You, relying on the standard philosophical counter, argue the Deprivation Account: death is bad because it takes away the good life you would have had.

  Your roommate has two sharp objections (Symmetry and Timing), and your cousin has introduced a third variable (Momentum). To resolve this, we must determine whether death is an experiential event or a comparative fact. My verdict is this: **Death is bad for the person who dies if and only if it deprives them of a future containing a net positive balance of well-being, where "well-being" includes both the aggregate of goods and the narrative shape of the life.** The Epicurean view fails because it mistakes harm for experience; the Momentum view is not a rival theory but a necessary refinement of what counts as a "good" to be deprived of.

  ### The Epicurean Challenge and the Nature of Harm

  The Epicurean argument rests on a specific definition of harm: *Harm requires a subject to feel it.* As Epicurus famously wrote, "When we exist, death is not; and when death exists, we are not." If harm is defined strictly as a painful mental state, your roommate is logically invincible. A dead person feels no pain, no sadness, and no frustration.

  However, this definition of harm is too narrow. We routinely acknowledge harms that are not experienced. If a friend spreads malicious rumors about you behind your back, and you never find out, you have been harmed. Your reputation is damaged, your social standing diminished, yet you feel no pain. The harm lies in the objective worsening of your condition, not in your subjective awareness of it.

  Therefore, the Deprivation Account (championed by Thomas Nagel) correctly identifies death as a *comparative* harm. To assess whether death is bad for you, we compare two worlds: World A, where you die at time *t*; and World B, where you continue living. If World B contains more value for you than World A, then the transition to World A is a harm. This bypasses the "no subject" problem because the subject exists in the relevant possible world (World B) to be the beneficiary of the goods. The harm is not an event *in* your life; it is a fact *about* your life.

  ### Solving the Puzzles: Symmetry and Timing

  Your roommate's first comeback is Lucretius' Symmetry Argument: If post-mortem nonexistence is bad because it deprives you of time, why isn't pre-natal nonexistence bad? We do not mourn the eons before we were born. If the deprivation account were true, the symmetry suggests we should view birth as tragically late.

  The solution lies in the asymmetry of possibility. While time is physically symmetric, human possibility is not. We generally cannot have been born earlier than we were; our biological identity is tied to a specific conception window. To wish you were born in 1800 is to wish you were a *different person*. However, we *can* live longer than we do. The future is a realm of open possibilities that death closes; the past is a realm of fixed facts that birth opens. We regret the loss of possible futures; we do not regret the impossibility of alternative pasts. The deprivation is real only where the alternative was possible.

  The second comeback, the Timing Puzzle, is more difficult. If death is a harm, *when* does the harm occur?
  1.  **Before death?** No, you are alive and fine.
  2.  **During death?** No, you don't exist.
  3.  **After death?** No, you still don't exist.

  If a harm has no timestamp, your roommate argues, it isn't real. This objection assumes that all properties must be located at a specific moment in time. But some properties are atemporal. Consider a betrayal. If a friend betrays you in 2020, but you don't find out until 2030, when were you harmed? The harm is a fact that spans the interval. Similarly, the harm of death is best understood as occurring **at the time the goods would have been experienced.** If you die at 40, but would have enjoyed a friendship at 50, the harm of losing that friendship is located at 50. It is a "timeless" fact about the biography of the person, not a momentary sensation. The lack of a specific *experiential* moment does not negate the *comparative* loss.

  ### The Momentum View: Refinement or Confusion?

  Your cousin's "Momentum View" adds a fascinating layer. He argues that the badness of death depends on the *slope* of the life, not just the sum. Dying at the peak of a career is worse than dying after a long decline, even if the total years lost are identical.

  Is this a coherent refinement, or does it smuggle in a rival theory? It is a coherent refinement, provided we accept that the "shape" of a life is a constituent of its value. Philosophers like J. David Velleman have argued that a life has a narrative structure, and that structure contributes to meaning. A story that ends on a cliffhanger feels different than one that ends on a resolution, even if the word count is the same.

  If we accept that "narrative coherence" and "fulfillment of potential" are goods, then the Momentum View fits neatly inside the Deprivation Account. Dying on an upward slope deprives you not just of future years, but of the *completion* of a trajectory. Dying on a downward slope might deprive you of years, but those years might have been of lower narrative value (a slow decline).

  However, we must be careful not to let the Momentum View override the Aggregate View entirely. If the Momentum View were the *only* thing that mattered, a short, meteoric life would always be better than a long, steady one. That is counterintuitive. A long, flat, happy life is not a tragedy compared to a short, explosive one. Therefore, the Momentum View should be treated as a multiplier, not the base equation. The badness of death is calculated by the **total goods lost**, adjusted by the **narrative cost of interrupting a trajectory.** Your cousin is right that slope matters, but wrong if he thinks it replaces the total sum of goods.

  ### The Verdict and the Suffering Exception

  So, here is the verdict you can offer your roommate and cousin:

  **Death is bad for the person who dies when it prevents the realization of a possible future that contains a net positive balance of well-being (including both experiential goods and narrative value).**

  This verdict defeats the Epicurean by redefining harm as comparative rather than experiential. It solves Symmetry by appealing to the asymmetry of possibility. It solves Timing by locating the harm at the time the goods would have occurred. And it incorporates the Momentum View as a factor in calculating the value of the lost future.

  This leads directly to your roommate's "corner case": What if the remaining future would have been mostly suffering?

  Under this verdict, **death is not bad for someone whose remaining future holds a net negative balance of well-being.** In fact, in such cases, death is a benefit. This is not a failure of the theory; it is its greatest strength. It explains why we do not view the death of a patient in unmanageable, terminal agony as a tragedy in the same way we view the death of a healthy child.

  If your roommate argues, "Aha! So death isn't *always* bad," you can agree. The Deprivation Account never claimed death is *intrinsically* bad; it claimed death is *contingently* bad based on what it deprives you of. If the future holds only pain, you are not deprived of goods; you are spared evils.

  ### Conclusion

  Your roommate is clinging to a definition of harm that is too small for the world we live in. We care about our projects, our relationships, and our futures in ways that transcend our immediate consciousness. To say death is not bad because we don't feel it is like saying a burned-down library isn't a loss because the books don't feel the fire.

  Your cousin is right to point out that *how* a life is going matters, but only because that affects the value of what is lost. And you are right to hold the line on deprivation. Death is the ultimate theft, but it is only a theft if there was something valuable in the vault to begin with. If the vault was empty, or filled with poison, the lock breaking is no tragedy. Death is bad, but only because life, usually, is good.
