      *   *Actually, the strongest missing point:* **The distinction between epistemic and instrumental rationality.** SI is epistemic. The malign prior argument assumes the programs inside the prior are instrumentally rational agents. SI doesn't care about their goals, only their output match. The "malignancy" comes from *us* acting on the prediction.
