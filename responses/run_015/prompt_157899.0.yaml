  5.  **Drafting the Content (Iterative refinement for word count and clarity):**

      *   *Brainstorming Section:* Need to list 4 variables and discard 3 briefly.
      *   *Cases:* Keep them tight.
      *   *Design Check:* Explain the variable, show the flip.
