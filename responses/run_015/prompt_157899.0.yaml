      *   *Wait, need to match them closer.* Let's try:
      *   *Case 1 (Rigid/Free):* **The Drill Sergeant.** Barks identical commands at every recruit. Surface rigidity. But if a recruit collapses, he stops and calls medic. (Sensitive to overriding reasons).
      *   *Case 2 (Flexible/Mechanical):* **The Bargain Hunter.** Scours different stores, checks online, waits for sales (flexible behavior). But buys items they don't need even when broke and warned by family. (Insensitive to normative reasons about financial ruin).
      *   *Actually, let's stick closer to the "script" analogy.*
