      *   *Variable:* **Normative Sensitivity.** (Would the agent stop if the reason for acting vanished?)

      *   *Case 1 (Rigid/Free):* **The Medic.** Applies a tourniquet using a strict, memorized protocol on every trauma patient. The movements are identical, swift, unthinking. Yet, if the patient says "It's too tight," the Medic adjusts. The script serves a reason.
      *   *Case 2 (Flexible/Mechanical):* **The Hoarder.** Brings home different items daily (groceries, tools, trash), adapting to what is available (flexible). Yet, if told "The house is full, this will cause danger," they continue bringing items. The behavior tracks opportunity, not justification.

      *   *Design Check:* Variable is *sensitivity to defeating reasons*.
      *   *Flip Case 1:* If the Medic refused to adjust even when the limb turned blue, they become mechanical.
      *   *Flip Case 2:* If the Hoarder stopped when told "The house is full," they become merely frugal/free.

      *   *Objection:* Rigidity is just low-level sensitivity.
      *   *Reply:* No, rigidity is about output similarity; sensitivity is about the *link* between input and output.

  6.  **Writing and Editing (monitoring word count):**

      *   *Intro:* 4 variables.
