answer: |-
  **Brainstorming Variables**
  1.  *Output Variability:* Discarded. Experts (surgeons, pianists) repeat moves precisely; addicts vary methods to secure fixes. Variability doesn't track freedom.
  2.  *Phenomenal Effort:* Discarded. Flow states are effortless yet free; compulsions are effortful yet unfree. Feeling isn't fact.
  3.  *Causal History:* Discarded. In ordinary cases, we cannot see the neural history. We need observable criteria.
  4.  *Normative Sensitivity:* Kept. This tracks whether behavior updates when the *reason* for it vanishes.

  **The Matched Pair**

  **Case 1: The Usher.** At every show, the Usher guides patrons with identical phrasing: "Row K, seats four through six." The script is rigid; the tone is flat. Patrons note the repetition. Yet, when a patron says, "I cannot climb stairs," the Usher immediately breaks script, calls for assistance, and deviates from the route. The rigidity is a tool, not a trap.

  **Case 2: The Apologizer.** After a minor disagreement, the Partner offers reparations: sometimes flowers, sometimes notes, sometimes cooking dinner. The behavior is flexible, adapting to what seems pleasing. Yet, when told explicitly, "I have forgiven you, stop worrying," the Partner continues seeking new ways to apologize, escalating the gestures despite the reassurance. The flexibility is a search strategy, not a choice.

  **Design Check**
  The operative variable is **Normative Sensitivity**: would the agent stop if the justification for acting were removed? The cases match on surface repetition (both act repeatedly in social contexts) and interpersonal focus.

  *Flip Case 1:* If the Usher ignored the wheelchair request and recited the script anyway, they become mechanical (like the digger wasp ignoring the moved cricket).
  *Flip Case 2:* If the Apologizer heard "I forgive you" and relaxed, ceasing the gestures, they become merely conscientious, not compelled.
  The verdicts reverse solely on this sensitivity, proving rigidity/flexibility was incidental.

  **Objection and Reply**
  *Objection:* You haven't escaped rigidity. The Apologizer is rigidly seeking relief; the Usher is flexibly serving patrons. Isn't "Normative Sensitivity" just rigidity described at the level of reasons rather than movements?

  *Reply:* No. Rigidity describes the *shape* of the output (same vs. varied). Sensitivity describes the *governance* of the output. A creature can vary its movements wildly (flexible) while being blindly driven by a single urge (mechanical). The Usher proves one can be output-rigid while remaining reason-governed. The difference isn't how much the behavior changes, but *what* changes it: reality or impulse.
