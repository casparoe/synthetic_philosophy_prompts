      *   **Context:** User is an emergency dispatcher training with scripts; partner has OCD checking rituals. User suspects "rigidity" isn't the real difference between free action and mechanical compulsion.
      *   **Constraints:** No sci-fi, no fictional neuroscience, no exotic pathologies. Cases must be ordinary/recognizable. Verdicts must arise from theories, not stipulation. Under 700 words.

  2.  **Brainstorming Variables (Mechanical vs. Flexible/Free):**
      *   *Candidate 1: Behavioral Rigidity/Variability.* (Does the output vary?)
          *   *Discard:* This is the surface feature the user is questioning. The OCD ritual is rigid, the dispatcher script is rigid, but one feels compelled and the other professional. Conversely, a addict might vary their method to get drugs (flexible) but be unfree. So, output variability isn't the core metaphysical difference.
      *   *Candidate 2: Conscious Awareness/Phenomenology.* (Does it feel like effort?)
          *   *Discard:* Flow states feel effortless but are free. OCD rituals feel effortful but are compelled. Phenomenology is unreliable for assigning responsibility.
      *   *Candidate 3: Goal-Directedness/Teleology.* (Is it for a purpose?)
          *   *Discard:* Both the dispatcher and the OCD checker have goals (save lives vs. reduce anxiety). The digger wasp has a goal (reproduce). Purpose alone doesn't distinguish mechanism from agency.
      *   *Candidate 4: Reason-Responsiveness/Counterfactual Sensitivity.* (Would the agent change behavior if reasons changed?)
          *   *Keep:* This seems promising. The dispatcher follows a script *because* it works for saving lives; if the script failed, they would abandon it. The OCD checker checks *because* of an internal urge, not because the lock is actually unlocked. Even if the lock is open, they check. This aligns with Fischer & Ravizza's guidance control.

  3.  **Selecting the Variable:**
      *   *Selected Variable:* **Reason-Responsiveness (specifically, sensitivity to normative changes in the environment).**
      *   *Why:* It captures the intuition that free agents act *for reasons* that track reality, whereas mechanical/compelled agents act on triggers that ignore reality's normative structure.

  4.  **Drafting the Cases:**
