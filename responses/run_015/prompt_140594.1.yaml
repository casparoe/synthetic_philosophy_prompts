answer: |-
  **Opening Concession**
  "I concede up front that for standard supervised learning tasks with a fixed dataset, restricting the hypothesis class is sufficient, and my framework adds no practical value to existing PAC bounds."

  **The Pair**
  Objections 1 (Statisticians) and 5 (Universal Induction) are the same objection: "You haven't found a structural condition; you've just rediscovered class restriction." Answer them together by distinguishing *ontological* restriction (computability class) from *intentional* restriction (VC dimension).

  **The Lethal Objection**
  Objection 1 (Statisticians). If you fail to distinguish your "Outsider Condition" from standard hypothesis class restriction, your thesis collapses into a trivial restatement of overfitting prevention.

  **The Hope Nobody Asks**
  Objection 9 (Statisticians). It forces you into measure-theoretic weeds about randomized predictors that will kill the momentum of the room.

  ***

  ### Q&A Prep Sheet

  **1. The "Triviality" Objection (Statisticians)**
  *Idiom:* "You've defined 'diagonally closed' such that any rich class is unlearnable. But VC theory tells us we *intentionally* restrict the hypothesis class to ensure realizability. Your 'Outsider Condition' is just the requirement that the true distribution lies outside the hypothesis class, which is standard agnostic learning. What's the philosophical payload?"
  *Reply:* "The payload is that for embedded agents, you cannot intentionally restrict the class to exclude yourself. In standard learning, the learner is outside the data-generating process. In embedded agency, the learner's code is part of the environment. VC restriction works because the statistician stands outside the lab; my condition fails because the agent is inside the lab. The 'Outsider' isn't a choice of hypothesis space; it's an ontological impossibility for embedded systems."
  *Weakness:* This concedes that for non-embedded learning, your thesis is trivial, and relies on a sharp embedded/non-embedded distinction that might be gradational.

  **2. The "Logical Induction" Objection (Rationalists)**
  *Idiom:* "Step 5 claims embedded agents can't meet the outsider condition. But Logical Induction handles self-reference by converging to a fixed point over logical sentences, not by standing outside the system. Why isn't reflective consistency a sufficient mitigation without needing incomputability?"
  *Reply:* "Logical Induction converges in the limit, but Step 4 highlights that the *timing* of errors matters for agents with horizons. A diagonalizing environment can delay adversarial behavior until after your convergence threshold or discount horizon. Reflective consistency prevents paradox, but it doesn't prevent an adversary from exploiting the pre-convergence window to bankrupt you."
  *Weakness:* You are conflating prediction accuracy with decision-theoretic robustness, and Logical Induction proponents may claim their traders handle the horizon issue.

  **3. The "Normative Gap" Objection (Philosophers)**
  *Idiom:* "You've formalized Hume, but Hume's problem is normative: how *ought* we to induce? You conclude with 'exposure' and say the choice of prior is unavoidable. If evidence can't settle the choice, you haven't solved induction; you've just priced the skepticism. What justifies the choice?"
  *Reply:* "I'm not solving justification; I'm dissolving the expectation that justification is possible. 'Exposure' quantifies the risk of the arbitrary choice. Knowing the cost of your prior's blind spots is the only 'solution' available. The normativity comes from minimizing exposure given your constraints, not from finding a prior evidence forces upon you."
  *Weakness:* This admits you have no normative theory, only a risk metric, which may feel like surrender to a room expecting philosophical guidance.

  **4. The "Finite Sample" Objection (Statisticians)**
  *Idiom:* "Your argument relies on asymptotic consistency and total error bounds. In practice, we care about finite-sample rates. An environment that adversarializes me only after $10^{100}$ steps is irrelevant. Why should I care about a guarantee that breaks down only on timescales larger than the heat death of the universe?"
  *Reply:* "Because the complexity of the adversarial environment scales with *your* complexity. As you build smarter agents, the 'wait until largest number' environment becomes cheaper to describe relative to the agent. For an embedded agent improving its own code, the horizon of vulnerability shrinks as its capacity grows. The threat scales with you."
  *Weakness:* This assumes agents will continuously self-modify to increase complexity, which may not hold for stable deployed systems.

  **5. The "Prior Support" Objection (Universal Induction)**
  *Idiom:* "You claim Solomonoff evades the condition because it's semicomputable. But that's just saying its support is restricted to computable environments while the predictor is hypercomputable. That's exactly the same as a statistician restricting a hypothesis class. You're treating an implementation detail as a philosophical insight."
  *Reply:* "(See Reply 1). The distinction is that the statistician *chooses* the restriction based on domain knowledge. Solomonoff's restriction is forced by the definition of computation itself. One is epistemic; the other is ontological. You cannot 'choose' to be semicomputable if you are a physical machine."
  *Weakness:* This leans heavily on the physical Church-Turing thesis, which some in the room may reject as contingent.

  **6. The "Decision vs. Prediction" Objection (Rationalists)**
  *Idiom:* "You focus on prediction loss, but embedded agents care about utility. An agent can act optimally even if its world-model is technically 'fooled' by a diagonal environment, provided the fooling doesn't impact reward. Why tie agency to universal prediction consistency?"
  *Reply:* "Because to maximize utility, you must predict the consequences of your actions. If the environment diagonalizes against your action-selection policy, it diagonalizes against your prediction of reward. In embedded settings, prediction and control are coupled; you can't isolate the reward channel from the adversarial predictor."
  *Weakness:* This assumes the environment targets prediction specifically, whereas some adversarial environments might only target actions, leaving prediction intact.

  **7. The "Grue/Entrenchment" Objection (Philosophers)**
  *Idiom:* "Your 'exposure' metric looks like a formalization of entrenchment. Goodman asked why we project 'green' instead of 'grue.' You say 'choose the prior with lower exposure.' But exposure is calculated relative to a class. How do you choose the class without already knowing which predicates are entrenched?"
  *Reply:* "You don't. The choice of class is the choice of entrenchment. My claim is that this choice is primitive and cannot be derived from evidence. 'Exposure' doesn't tell you which class to pick; it tells you how vulnerable you are once you've picked it. The circularity is the point."
  *Weakness:* This explicitly admits circularity, which may frustrate philosophers looking for a foundational account of projectibility.

  **8. The "Optimality" Objection (Universal Induction)**
  *Idiom:* "AIXI is optimal despite being incomputable. Your Step 4 argues the guarantee is the 'wrong shape,' but optimality implies no other agent performs better. If AIXI is optimal, your mitigation strategy cannot outperform it, so why propose exposure?"
  *Reply:* "AIXI is optimal relative to the class of computable environments. My argument is that embedded agents operate in a class that includes *themselves*, which is not purely computable in the AIXI sense due to self-reference. AIXI assumes a separation between agent and environment that embeddedness violates. Optimality doesn't hold when the agent is part of the optimization target."
  *Weakness:* This requires a specific definition of "embedded optimality" that isn't standard in AIXI literature.

  **9. The "Probabilistic Predictor" Objection (Statisticians)**
  *Idiom:* "Step 1 assumes deterministic predictors. If $p$ outputs a probability distribution, the 'anti-$p$' environment cannot simply emit the opposite bit without knowing the sample. Diagonalization fails against randomized predictors unless you assume the environment sees the random seed. Is your condition dependent on determinism?"
  *Reply:* "If the environment sees the random seed, it's deterministic relative to the seed. If it doesn't, it can still match probabilities—predicting 1 with probability $1-p$. The expected loss remains maximized. The diagonalization holds in expectation, which is sufficient for the exposure bound."
  *Weakness:* This glosses over measure-theoretic complexities about conditioning on null events that could undermine the "expectation" claim.
