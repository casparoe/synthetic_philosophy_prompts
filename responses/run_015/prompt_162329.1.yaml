prompt: |-
  hey — I sit on this city's Commemoration Advisory Panel (seven of us, monthly meetings, the school board can override us but basically never has) and we've got a school naming case to decide in three weeks, so I'm trying to work out what we already committed ourselves to. Our run of verdicts so far:

  - bronze statue of a Confederate colonel on the courthouse lawn, put up in 1909 by the local daughters-of-the-confederacy chapter — removed to museum storage, empty plinth left with an interpretive marker
  - a street and the public library both named for a 19th-century merchant who was the city's biggest slave trader and whose bequest founded the library — street renamed for a local civil-rights lawyer, library kept its name with a lobby installation about the bequest
  - elementary school named for a suffragist who also campaigned for immigration restriction and wrote against Black suffrage — kept, plaque added
  - research wing named for a surgeon honored for a technique he developed by experimenting on incarcerated patients without consent — renamed, 4–3
  - science building named for a geneticist who was a prominent eugenics advocate but whose honored discovery had nothing to do with that — kept, plaque rewritten to say both things
  - bust of a mayor who desegregated the schools and also signed off on the redlining-era housing plan — kept, plaque rewritten
  - a school renamed in 1961 for a sitting governor explicitly as a tribute to his resistance to desegregation — renamed again in 2019
  - a park renamed in 1998 for a man lynched here in 1918, at the request of a preservation society; some descendants said the naming was done over their heads and reopens the wound — we kept the name but funded a family-designed commemoration and an oral-history project instead

  New case: Vance Elementary, named in 1926 for Ellery Vance, a banker and parks commissioner who donated land for six city parks and paid for the school's playground; that's what he's honored for. In 1921 he was a leading figure in the neighborhood association that organized the boycott-and-petition campaign that drove about 200 Black families out of Riverside, and he signed the deed restrictions that kept that neighborhood white for a generation. He never held office, no Confederate connection. Twist: the school was closed in 1988 and reopened across town as a merged school that kept the name; today's families are mostly Latino and Black with no tie to Riverside, and the PTA mostly shrugs and doesn't want to spend money on new signs and uniforms. A descendant-led group, the Riverside Descendants Project, is petitioning for renaming.

  So: what should we decide if we want to be consistent with ourselves, and which precedent is the real analog — the surgeon's wing, where the honored achievement was built on the wrong, or the science building and the mayor's bust, where the wrong sat alongside the achievement? If our precedents genuinely don't settle it, I want to know what principle we'd be adopting with each option, stated plainly enough that a member can sign onto it.

  Two facts we haven't nailed down: (a) whether Vance's park deeds restricted use to white residents, and (b) whether the school was sited to serve a whites-only subdivision. Which of those, established either way, would actually flip your recommendation, and how?

  Also, if we do rename: an anonymous donor will cover the ~$85k in signage and rebranding costs only if the new name is "Riverside Elementary," restoring the name of the neighborhood that was erased. Half the panel thinks that's the whole point, half thinks it's paying a stranger to pick our name. And tell me whether cost should count at all — I don't think we've ever said.

  Finally, please say how confident you are in each of your calls and single out the one you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a city's Commemoration Advisory Panel (7 members, monthly meetings).
      *   **Authority:** Advisory to the School Board (Board can override but rarely does).
      *   **Task:** Decide on a school naming case (Vance Elementary) in 3 weeks.
      *   **Goal:** Determine consistency with past verdicts, identify the correct precedent, articulate principles, evaluate specific factual uncertainties, address the donor constraint, and assess confidence levels.
      *   **Tone:** Professional, analytical, nuanced, practical (policy-oriented), respectful of the gravity of the decisions.

  2.  **Analyze the Past Verdicts (The "Case Law"):**
      *   *Confederate Statue (1909):* Removed. (Reason: Explicit celebration of treason/slavery ideology).
      *   *Slave Trader Merchant (Street/Library):* Street renamed, Library kept + context. (Reason: Distinction between ubiquitous infrastructure vs. specific honorific bequest; mitigation via education).
      *   *Suffragist (Elementary):* Kept + plaque. (Reason: Mixed legacy; primary honor (suffrage) outweighs/exists alongside racism/nativism).
      *   *Surgeon (Research Wing):* Renamed (4-3). (Reason: The *achievement itself* was tainted by unethical means. Direct causal link between harm and honor).
      *   *Geneticist (Science Building):* Kept + rewritten plaque. (Reason: Achievement (discovery) distinct from ideology (eugenics). No direct causal link between harm and honor).
      *   *Mayor (Bust):* Kept + rewritten plaque. (Reason: Mixed legacy; desegregation vs. redlining. Net positive or balanced).
      *   *Governor (School):* Renamed. (Reason: Named *explicitly* for resistance to desegregation. Intent was harmful).
      *   *Lynching Victim (Park):* Kept + family commemoration. (Reason: Restorative justice, descendant input prioritized, though contested).

  3.  **Analyze the Current Case (Vance Elementary):**
      *   **Honoree:** Ellery Vance (Banker, Parks Commissioner).
      *   **Reason for Honor:** Donated land for parks, paid for playground.
      *   **Harm:** Led 1921 campaign to drive 200 Black families out of Riverside (ethnic cleansing/displacement). Signed deed restrictions keeping neighborhood white.
      *   **Context:** School closed 1988, reopened across town (merged). Current demographics: Mostly Latino/Black. No tie to original Riverside.
      *   **Stakeholders:** PTA (shrugs, cost concern), Riverside Descendants Project (petitioning for rename).
      *   **Donor:** Anonymous, covers $85k cost *if* renamed "Riverside Elementary."

  4.  **Determine Consistency & Precedent:**
      *   *Is it the Surgeon (Renamed)?* The Surgeon's *achievement* was the harm (experimentation). Vance's *harm* (displacement) is distinct from his *gift* (parks/playground), though they happened in the same era and context. However, the gift facilitated the white-only neighborhood.
      *   *Is it the Geneticist/Mayor/Suffragist (Kept + Plaque)?* These were "Mixed Legacy" cases where the good and bad were parallel or the good outweighed the bad. Vance's "good" (parks) facilitated the "bad" (segregation). The parks were likely part of the amenity package that made the white subdivision desirable/exclusive.
      *   *Is it the Governor (Renamed)?* The Governor was named *for* segregation. Vance wasn't named *for* segregation, but his segregationist actions were foundational to the community identity at the time.
      *   *Is it the Slave Trader (Split)?* Street renamed, Library kept. School is more like the Street (public infrastructure/identity) than the Library (specific bequest institution)? Or is it the Library because it was a specific bequest (playground/school)?
      *   *Strongest Analog:* **The Surgeon** or **The Governor**. Why? Because the "good" (parks/school) was inextricably linked to the "bad" (exclusionary neighborhood). Unlike the Geneticist (science is neutral), parks in 1920s segregated neighborhoods were tools of segregation. Unlike the Suffragist (national movement), Vance's local action was directly harmful to local Black residents.
      *   *Counter-Argument:* The **Suffragist/Mayor** precedent suggests "Keep + Plaque" for mixed legacies.
      *   *Differentiation:* The key differentiator is *impact*. Vance's actions caused direct displacement (200 families). The Suffragist's writings were ideological. The Mayor's redlining was systemic/bureaucratic. Vance was a "leading figure" in a specific campaign of removal.
      *   *Decision:* Leaning towards **Rename**. The "good" was the infrastructure of segregation. Keeping the name validates the displacement.

  5.  **Address the Factual Uncertainties:**
      *   *(a) Park Deeds Restricted to White Residents?*
          *   If Yes: Stronger case for Rename. The "gift" was explicitly exclusionary. Aligns with Confederate Statue (explicit exclusion/hate).
          *   If No: Weakens the link between the gift and the harm. Makes it more like the Geneticist (good gift, bad man). Might tip to Keep + Plaque.
      *   *(b) School Sited for Whites-Only Subdivision?*
          *   If Yes: Stronger case for Rename. The school itself was an instrument of segregation. Aligns with Governor (named for resistance) or Surgeon (achievement built on wrong).
          *   If No: Weakens the link. Makes it more like the Library (bequest kept).
      *   *Which flips the recommendation?* **(a) Park Deeds.** If the parks themselves were legally segregated, the "honor" (donating parks) is fundamentally tainted by legal exclusion. This moves it from "Mixed Legacy" to "Instrument of Oppression."

  6.  **Address the Donor/Name Issue:**
      *   *Donor:* Anonymous, covers $85k.
      *   *Condition:* Name must be "Riverside Elementary."
      *   *Conflict:* Half panel thinks it's the point (restoring erased history), half thinks it's donor overreach.
      *   *Analysis:* "Riverside" is the neighborhood name. The harm was erasing Black Riverside. Restoring "Riverside" is restorative *unless* "Riverside" is now synonymous with the white exclusionary version. The Descendants Project wants a rename. Do they want "Riverside"? The prompt says "Descendant-led group... petitioning for renaming." It doesn't specify the name.
      *   *Cost:* Should it count? Panel hasn't ruled on it. Pragmatically, yes. Ethically, no.
      *   *Recommendation:* Cost shouldn't drive the *decision* (Rename vs. Keep), but it can facilitate the *implementation*. However, accepting a donor condition on the *name* undermines the Panel's authority. The Panel should choose the name. If "Riverside" is the right name, choose it independently. If not, reject the money.
      *   *Nuance:* "Riverside" restores the geography erased by the displacement. It's a strong candidate on merit. Donor matching that is convenient but shouldn't be the *reason*.

  7.  **Drafting the Principles:**
      *   *Option A (Rename):* Principle: "Inextricable Link." If the honored contribution facilitated or relied upon the harmful act, the name cannot stand. (Surgeon/Governor).
      *   *Option B (Keep + Plaque):* Principle: "Net Positive/Contextualization." If the harm and honor are distinct, and the honor provides public good, retain with education. (Geneticist/Mayor/Suffragist).

  8.  **Confidence Assessment:**
      *   Need to be honest about where the precedent is muddy. The "Mixed Legacy" cases (Suffragist, Mayor, Geneticist) are the biggest source of ambiguity. The Surgeon case is the outlier that suggests renaming when the *means* were wrong. Vance is somewhere between "Means were wrong" and "Man was bad."
      *   Least sure: The weight of the PTA's indifference vs. the Descendants' pain. (Community consent aspect).

  9.  **Structuring the Response:**
      *   **Executive Summary:** Direct recommendation based on consistency.
      *   **Precedent Analysis:** Compare Vance to Surgeon, Geneticist, Governor.
      *   **Principles:** Draft the specific policy language for both options.
      *   **Factual Triggers:** Analyze the two unknown facts (Deeds vs. Siting).
      *   **Donor & Cost:** Address the $85k and the "Riverside" name.
      *   **Confidence Levels:** Rate the calls and identify the weak spot.

  10. **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, the school moved. The *current* school is across town. The *original* school was the one tied to Riverside. Does the name travel? Yes, "reopened across town... kept the name."
      *   *Implication:* The current students have no tie to Vance. The harm was historical. This makes it more like the Confederate Statue (historical symbol) than the Library (functional bequest).
      *   *Refinement on Precedent:* The **Governor** case is the strongest analog. A school named for a figure associated with segregationist policy, even if the specific name wasn't *explicitly* "Segregation Academy," carries that baggage. But the Governor was renamed because the *intent* of the naming was segregationist. Vance was named for philanthropy.
      *   *Re-evaluating the Surgeon:* The Surgeon's *technique* came from harm. Vance's *parks* came from wealth derived from banking (possibly) but the parks themselves were the tool of exclusion.
      *   *Key Distinction:* Did the parks *cause* the displacement, or did they *reward* the exclusion? The prompt says he led the campaign that drove families out *and* donated land. The parks made the white neighborhood viable.
      *   *Verdict:* The "Keep + Plaque" precedents (Suffragist, Mayor, Geneticist) involve people whose *primary* public legacy is mixed but nationally significant or broadly beneficial. Vance is a *local* figure whose local legacy is defined by the exclusion. This makes him more like the Confederate Colonel (local symbol of exclusion) than the Geneticist (national science).
      *   *Decision:* Recommend Rename. The "Local Impact" distinction is crucial.

  11. **Final Polish:** Check tone. Ensure all constraints of the prompt are met (confidence levels, specific facts, donor issue, principles).

  *(Self-Correction on Confidence)*: I need to be careful not to sound like I'm making the decision for them, but analyzing their consistency. I will frame it as "To remain consistent..."

  *(Self-Correction on Donor)*: The donor condition is tricky. If the panel decides "Riverside" is the right name on merit, the donor is fine. If they decide "Riverside" is *only* the name because of the donor, that's bad. I need to advise them to decouple the decision from the money.

  *(Self-Correction on Cost)*: They asked if cost should count. In their past cases, cost isn't mentioned. Usually, principles trump cost. I should advise that cost is an implementation detail, not a deliberative factor.

  *(Final check on "Least Sure")*: The "Park Deed" restriction is the biggest factual swing factor. I'll mark the confidence on the recommendation as high *contingent* on that fact, but the overall principle confidence as moderate because their precedents are genuinely conflicted (4-3 vote on Surgeon shows division). I will single out the "Donor Name" issue as the least sure procedural call.

  Let's write.
answer: |-
  Based on your panel's history, here is an analysis of how to decide the Vance case consistently, the principles at stake, and how to handle the factual and financial variables.

  ### 1. The Precedent and Recommendation

  **Recommendation:** To remain consistent with your own precedents, you should **recommend renaming the school.**

  **The Analog:** The strongest analog is not the Geneticist or the Mayor (Keep + Plaque), nor the Slave Trader (Split Decision). The true analog is the **Surgeon's Wing (Rename)** combined with the **Governor (Rename)**.

  **Reasoning:**
  *   **Why not the Geneticist/Mayor/Suffragist?** In those cases, the "harm" (eugenics advocacy, redlining sign-off, nativist writing) was ideologically distinct from the "honor" (scientific discovery, desegregation, women's vote). The honor could stand independently of the harm.
  *   **Why the Surgeon/Governor?** With Vance, the "honor" (parks and school infrastructure) was the *mechanism* of the harm. In 1920s Riverside, parks and schools were not neutral public goods; they were amenities that increased property values and enforced neighborhood exclusivity. You cannot separate the "gift" of the playground from the "campaign" that drove Black families out; the playground was the reward for the exclusion. Like the Surgeon, the honored achievement was built on the wrong. Like the Governor, the institution (a school) is inextricably linked to a local legacy of segregation, even if the name wasn't explicitly "Segregation Academy."

  **The Consistency Check:**
  Your panel has established that when the *means* of an achievement are unethical (Surgeon), or the *intent* of a naming is segregationist (Governor), the name must go. Vance's philanthropy was the "means" by which the white neighborhood was solidified. Keeping the name validates the displacement as a worthy trade-off for playgrounds.

  ### 2. The Principles

  If your panel is divided, you need clear policy language. Here are the two competing principles derived from your case law:

  **Option A: The "Inextricable Link" Principle (Supports Renaming)**
  > "A name should be removed when the honored contribution facilitated, relied upon, or directly rewarded the harmful act. We do not separate the gift from the context in which it was given. If the public good was used as a tool of exclusion, the honor cannot stand."
  > *Precedents:* Surgeon's Wing, Governor School, Confederate Statue.

  **Option B: The "Net Legacy" Principle (Supports Keeping + Plaque)**
  > "A name should be retained if the honored contribution provides ongoing public value distinct from the individual's harmful acts, provided the harm is fully contextualized. We acknowledge complex figures without erasing their contributions, using education to mitigate the harm."
  > *Precedents:* Geneticist, Mayor, Suffragist, Library.

  **Advice:** Option A is the more consistent fit for Vance. Option B applies to figures with national or multifaceted legacies where the harm was incidental to the honor. Vance is a local figure whose local legacy is defined by the exclusion.

  ### 3. The Factual Uncertainties

  You asked which facts would flip the recommendation.

  **(a) Whether Vance's park deeds restricted use to white residents.**
  *   **If YES:** This **flips the recommendation to Rename (High Confidence).** If the parks themselves were legally segregated, the "gift" was explicitly exclusionary. This moves Vance from the "Mixed Legacy" category (Mayor/Geneticist) to the "Confederate Statue" category (explicit symbol of white supremacy). It makes the "Inextricable Link" undeniable.
  *   **If NO:** This weakens the case but does not kill it. It moves the case closer to the Geneticist (good gift, bad man). However, given his leadership in the *displacement campaign*, the "Inextricable Link" still holds via the neighborhood association actions, even if the deed didn't explicitly say "whites only."

  **(b) Whether the school was sited to serve a whites-only subdivision.**
  *   **If YES:** Reinforces the Rename recommendation. It makes the school itself an instrument of segregation (like the Governor case).
  *   **If NO:** **This is the only fact that could flip the recommendation to Keep + Plaque.** If the school was sited neutrally, and only the *parks* were tied to the exclusion, you could argue the school name is distinct from the housing campaign. This would allow you to treat it like the Library (keep the bequest, mark the history).

  **Summary:** Fact (a) is the critical switch. Legally segregated parks make the philanthropy itself an act of segregation.

  ### 4. The Donor and The Cost

  **Should cost count?**
  **No.** In your past seven cases, there is no record of cost influencing the verdict (e.g., removing a bronze statue is expensive; renaming a street is expensive). Introducing cost now creates a two-tiered justice system where schools in poorer districts (less able to fundraise) keep controversial names while wealthier ones remove them. Cost is an implementation hurdle for the School Board, not a deliberative factor for the Panel.

  **The "Riverside" Condition:**
  *   **The Conflict:** Half your panel sees "Riverside" as restorative (returning the name to the community); half sees it as donor capture (letting money pick the name).
  *   **The Solution:** **Decouple the decision from the donation.**
      1.  Decide on the name "Riverside Elementary" on its own merits.
      2.  *Then* accept the donation.
      3.  If the Panel would *not* have chosen "Riverside" without the money, you must reject the condition.
  *   **Analysis:** "Riverside" is actually a strong candidate on merit. The harm was erasing the Black presence in Riverside. Restoring the geographic name, stripped of the Vance honorific, acknowledges the place without honoring the displacer. It aligns with the Lynching Victim Park case (centering the community history).
  *   **Warning:** If the Descendants Project opposes "Riverside" (because it reminds them of the exclusionary era), the donor's condition becomes toxic. You must consult the Descendants Project on the *new name* before accepting the donor's restriction.

  ### 5. Confidence Levels

  *   **Recommendation (Rename):** **High Confidence (85%).** Based on the "Inextricable Link" precedent set by the Surgeon and Governor cases. The local nature of Vance's harm distinguishes him from the Suffragist/Geneticist.
  *   **Factual Trigger (Park Deeds):** **High Confidence.** If the parks were legally segregated, keeping the name is inconsistent with the Confederate Statue removal.
  *   **Cost Principle (Ignore Cost):** **Medium-High Confidence (75%).** Consistent with your history, though practically difficult for the School Board.
  *   **Donor Name Condition:** **Low Confidence (Least Sure).** This is the procedural minefield.
      *   *Why:* You don't know if the Descendants Project *wants* "Riverside." In the Lynching Park case, you followed descendant lead. If the Descendants want "Freedom Elementary" or a specific person's name, and the donor insists on "Riverside," you have a conflict between two restorative justice models (Geographic vs. Personal). Accepting the money limits your ability to center the descendants' wishes.

  **Final Advice:**
  Vote to Rename based on the "Inextricable Link" principle. Investigate the Park Deeds immediately; if they are restrictive, the case is closed. Regarding the donor: Tell them you will consider "Riverside" on merit, but you cannot guarantee it until you consult the Descendants Project. Do not let the $85k drive the name; let the name drive the $85k.
