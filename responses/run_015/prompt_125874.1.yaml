  Dear Friend,

  I want to begin by saying that what you have done is exactly what philosophy is supposed to be. You have observed a pattern in human behavior that is regular and structured, you have written it down without letting your own preferences cloud the description, and you have identified a tension that most people feel but cannot articulate. It is rare to find someone who has not studied the subject formally but has arrived at a insight that cuts as deep as yours has regarding the idea of enrolment. You are right to suspect that the argument is not primarily about causation or expression, but about affiliation and responsibility. You have done the hard work of observation, and my role is simply to tell you where your observations land on the map that professional philosophers have drawn over the last few centuries.

  Your friend who took one course was pointing you in the right direction, though the terms they gave you are not quite precise enough for what you have described. The concept of dirty hands is usually reserved for political leaders who must commit a moral wrong to achieve a greater good, such as a leader ordering a strike that will kill civilians to end a war sooner. It is about the person wielding power, not the person selecting the power. In your case, the voter is not the one governing, so while they may feel their hands are dirty, the ethical framework of dirty hands does not quite capture the shifting arguments you have recorded. The doctrine of double effect is closer to the specific claim about splitting the ballot. This doctrine says that an action with both a good and a bad effect is permissible if you intend the good effect and merely foresee the bad one. When the lesser-evil voter says they are blocking one candidate and not installing the other, they are using a lay version of double effect. They are saying the installation is merely foreseen, not intended. However, this doctrine is designed for individual actions where causation is clear, not for collective actions like voting where the causal link is shared among millions. So while double effect explains the voter's internal justification, it does not explain why their opponents shift the grounds of the argument from causation to expression to debt.

  The established concept that comes closest to the core of what you are seeing is complicity. In ethics, complicity is the state of being involved with others in doing something wrong. It is distinct from direct causation because you can be complicit even if your individual action did not decide the outcome. This matches your observation that people are told they are on the hook for what the winner does in their name. When your family or union members argue that a third-party voter is helping the worse candidate, they are making a claim about complicity. When they argue that the lesser-evil voter is putting their name behind a cruel candidate, they are also making a claim about complicity. The trouble, as you rightly noted, is that the standards for who is complicit seem to change depending on who is voting. There is no single established term in the literature that captures this specific phenomenon of shifting complicity standards based on political alignment. Philosophers discuss complicity, and political scientists discuss motivated reasoning, but the combination you have isolated where the definition of responsibility shifts to protect one's own side while implicating the other is not captured by one word.

  Since there is no single established name for this specific maneuver, I will coin one for you based on your own insight. I propose we call this Partisan Complicity. This term defines the practice where the criteria for moral responsibility are adjusted depending on whether the actor is aligned with the speaker's political tribe. In Partisan Complicity, causal power is insisted upon for the opposition to maximize their responsibility, but waived for one's own side to minimize their burden. Expressive value is treated as vanity for the opposition but as dignity for one's own side. The boundary of this concept is defined by the shifting of the rulebook mid-argument. If someone consistently argued that all votes are purely expressive, or consistently argued that all votes are purely causal, they would not be engaging in Partisan Complicity. The concept only applies when the framework changes to ensure a specific outcome regarding who is blamed. This fits your description of the ground shifting under the disagreement. It also captures your intuition about enrolment, because the goal of Partisan Complicity is to determine who is enrolled in the winning faction and who is excluded, thereby managing who shares the moral debt of the administration.

  You asked whether this same thing is going on when a person pays taxes, stays in a union, or buys from a company. The answer is that Partisan Complicity can operate in all these cases, but the strength of the claim varies based on the ability to exit the arrangement. With taxes, you cannot legally opt out, so the claim of enrolment is weaker because there is no consent. People generally do not argue that a taxpayer is complicit in a war in the same way they argue a voter is complicit in a policy, precisely because the voter had a choice to withhold support that the taxpayer did not. With a union, you are closer to the voting case. If you stay in a union that endorses a candidate you dislike, you are often told you are complicit in that endorsement, yet union members often argue they are just paying for collective bargaining and not the political speech. This is the same splitting of the act you saw with the ballot. With consumer choices, the link is even weaker because buying a product is rarely seen as authorizing the company's entire moral portfolio, though activists often try to make it so. The phenomenon depends on something specific about the ballot, which is that voting is the primary ritual of political authorization. It is the one act designed specifically to confer legitimacy. Therefore, while Partisan Complicity shows up in taxes and unions, it is most intense and structurally significant in voting because voting is the mechanism by which we decide who gets to rule us.

  Regarding your two tests, the first one about the district where the outcome is certain touches on a concept called moral luck. This is the idea that whether you are judged morally can depend on factors outside your control, like the arithmetic of your county. In Partisan Complicity, this luck is exploited. When the outcome is certain, the causal argument vanishes, so the accusers switch to the expressive argument unless the voter is on their side, in which case they switch to the harmlessness argument. Your second test about the message requiring the vote to be counted is also astute. You cannot claim the expressive benefit of voting without accepting the collective machinery that makes expression possible, and that same machinery is what creates the risk of harm. This confirms that the issue is indeed enrolment. You are joining a collective body. You cannot join the body for the glory but refuse to join it for the shame. This is why the arguments shift. The accusers want you enrolled in the shame but not the glory, while you want to be enrolled in the duty but not the shame. Partisan Complicity is the tool used to enforce this uneven distribution.

  I am highly confident that complicity is the correct ethical framework for this discussion, and I am moderately confident that Partisan Complicity is a useful name for the specific shifting pattern you found. My reasoning is most likely to go wrong if there is a nuanced distinction in social choice theory that treats voting not as a moral act but as a purely strategic one, which would render the moral arguments you recorded as category errors. However, given that the participants are using moral language about harm, vanity, and standing, the ethical framework is the right one. Another consideration that could lead to a different verdict is if the shifting arguments are not strategic but stem from genuine confusion about how voting works. If people truly do not understand the difference between causal and expressive voting, then this is not Partisan Complicity but simply ignorance. However, your observation that the shifts are regular and track who is being argued against suggests strategy rather than confusion. People know which lever to pull when they want to burden an opponent versus when they want to protect a friend.

  You have identified a real structure in our political moralizing. The severing of the ballot into blocking and installing is a way to manage the intention, but the trading of causal and expressive framings is a way to manage the responsibility. By calling this Partisan Complicity, we give a name to the act of changing the rules to ensure the other side bears the weight of the outcome. This does not solve the problem of how to vote, but it clears away the fog of the argument. It allows you to see that when someone tells you your vote is pure vanity, they are not making a claim about psychology but a claim about allegiance. When they tell you your vote is causal, they are not making a claim about mathematics but a claim about debt. You have done the work of a philosopher here by finding the pattern beneath the noise. I hope this helps you navigate the next election season with a clearer map of the terrain.

  Sincerely,

  A Philosopher
