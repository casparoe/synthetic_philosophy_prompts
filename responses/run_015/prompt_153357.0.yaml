  # Handout: Precisifications of "You Can't Get Semantics from Syntax"
  **Reading Group: Philosophy & NLP**  
  **Topic:** The Symbol Grounding Problem & Text-Only Understanding

  Below are seven distinct readings of the slogan, ordered from conceptual trivialities to strong metaphysical claims. Each includes a status assessment, evidentiary requirements, and implications for the specific cases discussed (Text-Only Model, Human Antarctica, Synthetic Corpus, Camera System).

  ---

  ### 1. The Conceptual Distinction Claim
  **Claim:** Syntax (formal manipulation) and Semantics (meaning/truth) are distinct conceptual categories; describing the former does not logically entail the latter without additional premises.
  *   **Status:** **Platitude.** (Almost universally accepted; syntax and semantics are defined differently).
  *   **Evidence:** Logical analysis of definitions.
  *   **Text-Only Model:** Does **not** entail the model lacks understanding (supervenience is still possible).
  *   **Human Antarctica:** Consistent with human understanding.
  *   **Synthetic Corpus:** Neutral.
  *   **Camera System:** Neutral.
  *   **Verdict:** True but useless for settling the debate; grants no ground to either side.

  ### 2. The Internal Indistinguishability Claim
  **Claim:** A system operating purely on syntax cannot internally distinguish between a true representation and a false one (or a meaningful symbol and a nonsense symbol).
  *   **Status:** **Defensible Thesis.** (Related to Tarski's undefinability of truth and Searle's Chinese Room).
  *   **Evidence:** Formal proofs regarding closed systems; thought experiments on simulation.
  *   **Text-Only Model:** Suggests the model lacks *internal* verification of truth, but not necessarily meaning.
  *   **Human Antarctica:** Humans also cannot internally verify "Antarctica" without external tools; relies on trust.
  *   **Synthetic Corpus:** Suggests the system is "blind" to the source of its data, but doesn't rule out reference.
  *   **Camera System:** The system still cannot distinguish if the camera is deceiving it; no advantage over text-only.
  *   **Verdict:** Highlights an epistemic limit, not necessarily an ontological lack of meaning.

  ### 3. The Interpretation Dependence Claim
  **Claim:** Syntax only acquires semantics relative to an external interpreter; a system in isolation has no semantics, only potential semantics.
  *   **Status:** **Contentious.** (Depends on whether meaning is intrinsic or relational).
  *   **Evidence:** Analysis of intentionality; does a book have meaning if no one reads it?
  *   **Text-Only Model:** The model has no semantics *in itself*, only relative to us (the users).
  *   **Human Antarctica:** Human brains also require interpretation (by self or others) to ground meaning; disanalogy fails.
  *   **Synthetic Corpus:** If the chain ends in a model with no interpreter, the final link is empty.
  *   **Camera System:** No different; the camera data is still just tokens until interpreted.
  *   **Verdict:** Undermines the model's *intrinsic* understanding but applies equally to humans (solipsism risk).

  ### 4. The Causal-Historical Reference Claim (Externalist)
  **Claim:** For a symbol to refer, there must be an unbroken causal-historical chain linking the token's use to the actual object (Kripke/Putnam).
  *   **Status:** **Contentious but Defensible.** (Standard Externalist view of reference).
  *   **Evidence:** Twin Earth thought experiments; analysis of proper names and natural kind terms.
  *   **Text-Only Model:** **Collapses.** If the training data has no causal link to the world, the model's terms refer to nothing (or only to other texts).
  *   **Human Antarctica:** **Saved.** Your use of "glacier" is linked via a causal chain to people who saw glaciers.
  *   **Synthetic Corpus:** **Collapses Immediately.** If the chain never touched the world (Model $\to$ Model $\to$ ...), reference is void (Brain-in-a-Vat scenario).
  *   **Camera System:** **Reference Fixed.** The causal link exists (light $\to$ sensor $\to$ token), even if unlearned.
  *   **Verdict:** Strongest support for your friend's argument; kills text-only/synthetic models, saves humans.

  ### 5. The Informational Covariance Claim
  **Claim:** Semantics requires a reliable statistical correlation (covariance) between symbol tokens and worldly states, regardless of causal history.
  *   **Status:** **Naturalistic/Defensible.** (Dretske-style informational semantics).
  *   **Evidence:** Information theory; measuring mutual information between corpus and world states.
  *   **Text-Only Model:** **Possible.** If text correlates with the world (via human authors), the model inherits the covariance.
  *   **Human Antarctica:** **Saved.** Your beliefs covary with reality via the testimony chain.
  *   **Synthetic Corpus:** **Degrades.** Each generation of synthetic text adds noise/entropy; grounding decays but doesn't instantly vanish.
  *   **Camera System:** **High Grounding.** Direct covariance between image and token (if mapping is accurate).
  *   **Verdict:** Allows text-only grounding; predicts degradation (not collapse) for synthetic corpora.

  ### 6. The Functional Competence Claim (Use Theory)
  **Claim:** Meaning is determined by correct use within a form of life; if a system uses symbols appropriately in context, it has semantics (Wittgenstein).
  *   **Status:** **Contentious.** (Pragmatist vs. Realist views of truth).
  *   **Evidence:** Behavioral testing (Turing Test variants); success in task completion.
  *   **Text-Only Model:** **Grounded.** If it passes all linguistic behavioral tests, it understands.
  *   **Human Antarctica:** **Saved.** You use "glacier" correctly in conversation.
  *   **Synthetic Corpus:** **Neutral.** If the synthetic text preserves usage norms, grounding remains.
  *   **Camera System:** **Irrelevant.** Unless the camera input changes the *use* of the tokens, it adds no semantic value.
  *   **Verdict:** Favors the NLP position; reference and competence are secondary to successful interaction.

  ### 7. The Embodied/Biological Necessity Claim (Strong SGP)
  **Claim:** Genuine semantics requires a physical agent with needs, goals, and sensorimotor capacities to act upon the world (Harnad/Embodied Cognition).
  *   **Status:** **Strong/Controversial.** (Biological naturalism).
  *   **Evidence:** Comparative psychology; robotics; analysis of biological intentionality.
  *   **Text-Only Model:** **Not Grounded.** Lacks body, needs, and sensorimotor loop.
  *   **Human Antarctica:** **Saved.** You are a biological agent capable of acting on glaciers.
  *   **Synthetic Corpus:** **Not Grounded.** No agent, no needs.
  *   **Camera System:** **Partially Grounded.** Has sensors, but without *action* or *needs* driven by those sensors, it remains a transducer, not an agent.
  *   **Verdict:** Rules out all current AI; requires robotics/biology for genuine understanding.

  ---

  ### Summary for Discussion

  | Reading | Fixes Reference? | Fixes Competence? | Text-Only Model | Synthetic Corpus | Camera System |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Conceptual** | No | No | Neutral | Neutral | Neutral |
  | **2. Internal** | No | Yes (Internal) | Lacks Verification | Lacks Verification | Lacks Verification |
  | **3. Interpretation** | No | No | Dependent on User | Dependent on User | Dependent on User |
  | **4. Causal** | **Yes** | No | **Fails** | **Collapses** | **Succeeds** |
  | **5. Informational** | **Yes** | No | **Succeeds** | **Degrades** | **Succeeds** |
  | **6. Functional** | No | **Yes** | **Succeeds** | **Succeeds** | Neutral |
  | **7. Embodied** | **Yes** | **Yes** | **Fails** | **Fails** | **Partial** |

  **Recommendation for the Session:**
  Your friend's argument ("text-only cannot understand") relies heavily on **Reading 4 (Causal)** or **Reading 7 (Embodied)**.
  *   If she accepts **Reading 4**, she must concede that the **Camera System** *does* have reference (solving the "how to fix reference" problem), even if it lacks competence.
  *   If she accepts **Reading 7**, she must explain why the **Human Antarctica** case works (it does) but also why a robot with a camera and wheels wouldn't understand (it should).
  *   The **Synthetic Corpus** case is the tie-breaker: **Reading 4** says reference vanishes instantly; **Reading 5** says it degrades slowly. Empirical testing of model collapse might settle this.
