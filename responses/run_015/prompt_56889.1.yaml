prompt: |-
  I am a TA for a second-year proofs course, and in three weeks I have a single seventy-five-minute section on non-constructive existence proofs. In lecture the students will have just met the two-case argument that some pair of irrationals has a rational power, without anyone saying which pair, and the six-people Ramsey argument; my section is supposed to consolidate the idea that a proof can establish that something exists while leaving you unable to point at it. I have decided to build the entire session around the strategy-stealing argument in positional games rather than treating it as one more example in a survey, because it is the case where the gap between knowing and doing is most vivid. There are twenty-six students. All have done induction, contradiction, contraposition, and the pigeonhole principle; none has taken game theory or graph theory. Two of them play serious competitive chess and one runs the board-game society, so I expect a couple of them to arrive confident that they already know what a winning strategy is and how you would find one. I have a whiteboard, a document camera, and about thirty printed 7×7 Hex boards with two colours of counter. What I want from you is not an explanation of the argument — I know it — but a plan for explaining it, and I want the plan to make the dependency structure explicit: which pieces genuinely cannot be stated until some other piece is in place, as opposed to a list of topics arranged in the conventional order. Please do not send me any readings, references, or suggested sources; I only want the pedagogy and the conceptual sequencing.

  On ordering and on the example. My instinct is to have them play in pairs for ten minutes before I say anything at all, so that they feel the impossibility of constructing a winning strategy before being handed a proof that one exists; but I worry that pairs will finish convinced the game is a draw, and the fact that Hex cannot be drawn is exactly the thing I cannot prove to them at this level. Tell me whether to open with play, with a game they already know cold, or with an explicit failed construction attempt on the board, and tell me what to concede openly about the no-draw property and what to simply assume in front of them. Then: which single game should carry the whole session, and what must that example have and lack in order to do the work? I have been going back and forth between Hex, ordinary 3×3 tic-tac-toe, where the argument yields only the weaker conclusion that the first player can force at least a draw, and Chomp, which appeals to me because the opening move that gets stolen is intuitively a terrible one. But I am not sure Chomp is running on the same rail at all: in Hex the licence seems to be that an extra stone of your own can never hurt you, whereas in Chomp the stolen move is the corner square, which is swallowed by every possible reply, so the extra material is never a genuine liability in the first place. Settle that for me, say whether those are two species of one argument or two different arguments wearing the same name, tell me which example to commit to, and identify the smallest change to that example that would make the argument fail. I would also like your view on whether the swap rule that real Hex players use to offset the first-player advantage is such a breaking change, or is itself a fresh application of the same trick.

  On the misconception map, which is the part I most need. I am already predicting these, and I want to know at which point in the sequence each should be headed off rather than corrected at the end: that the argument tells you how to play, so that a student who has followed it should be able to answer the question of where to put the third stone; that the strategy is literally copycat, with the whole thing collapsing the moment the mirrored cell is already occupied, because they do not see that the fallback of playing any free cell is available and, more importantly, harmless only under the monotonicity condition; that the conclusion is the first player wins at tic-tac-toe, conflating the second player has no winning strategy with the first player does in a game that admits draws; and that the argument is symmetric, so that the second player could equally steal the first player's strategy — I want a crisp way to show them exactly where the asymmetry is being used, since I suspect the free extra turn is doing all the work and they will not notice. I also expect someone to say that we were told a proof has to construct its object, and someone else to want to apply the argument to backgammon or poker. Give me a rough minute allocation across the session, one moment of genuine surprise, because my supervisor wants this section to function as recruitment for the combinatorics option, one closing question that will tell me whether the idea landed rather than merely entertained them, together with the two or three distinct wrong answers it might draw and what each of those would reveal about where the sequence failed, and finally a list of what I should deliberately leave out and announce as deferred — the topological argument that Hex cannot be drawn, determinacy for finite games of perfect information, Maker–Breaker theory, the complexity of finding the strategy, and how large a board an explicit winning strategy is actually known for — distinguishing the items worth naming and deferring from the ones I should simply not raise.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for a 2nd-year proofs course.
      *   **Topic:** Non-constructive existence proofs (specifically Strategy-Stealing).
      *   **Context:** 75-minute section, 26 students, post-lecture on irrational powers/Ramsey.
      *   **Constraints:** No readings/references. Focus on pedagogy and conceptual sequencing (dependency structure).
      *   **Specific Questions to Answer:**
          *   Open with play, known game, or failed construction?
          *   What to concede/assume about the "no-draw" property?
          *   Which single game (Hex, Tic-Tac-Toe, Chomp)? Why?
          *   Are Hex and Chomp the same argument species?
          *   Smallest change to make the argument fail?
          *   View on the Swap Rule.
          *   Misconception Map: When to head off specific errors (constructivity, copycat mechanics, draw vs. win, symmetry/asymmetry, applicability to chance games).
          *   Minute allocation.
          *   One moment of genuine surprise.
          *   Closing question + diagnostic wrong answers.
          *   What to leave out/defer vs. ignore.

  2.  **Deconstruct the Core Concept (Strategy-Stealing):**
      *   *Premise 1:* The game is finite, perfect information, no chance.
      *   *Premise 2:* The game cannot end in a draw (or we are proving "at least a draw").
      *   *Premise 3:* Having an extra piece/move is never a disadvantage (Monotonicity).
      *   *Argument:* Assume Player 2 has a winning strategy. Player 1 makes an arbitrary first move, then pretends to be Player 2 using Player 2's strategy. If the strategy calls for playing on the occupied square, play arbitrarily elsewhere. This leads to a contradiction (Player 1 wins using Player 2's strategy).
      *   *Conclusion:* Player 1 must have a winning strategy.
      *   *Non-constructive nature:* We know P1 wins, but we don't know *how* (which first move).

  3.  **Address the "Which Game?" Dilemma:**
      *   *Tic-Tac-Toe (3x3):* Too familiar. Students know it's a draw. The argument only proves P1 can force a draw (if we assume P2 can't force a win). It muddies the "Existence of a Win" vs. "Existence of a Non-Loss" distinction.
      *   *Chomp:* Great for monotonicity (eating more is better). But the "poisoned cookie" aspect is slightly different conceptually (normal play vs. misère play nuances, though standard Chomp is normal). The board geometry is less intuitive for "connecting" than Hex.
      *   *Hex:* The gold standard for this.
          *   *Pros:* Visually intuitive (connectivity), monotonicity is clear (extra stone helps connectivity), "No Draw" is the famous topological fact.
          *   *Cons:* "No Draw" is hard to prove.
      *   *Decision:* **Hex.** It's the cleanest fit for "P1 Wins." The prompt mentions having 7x7 Hex boards. Use them.
      *   *Hex vs. Chomp:* They are the same species of argument (Strategy-Stealing relying on Monotonicity + No Draw/Finite). The mechanism of "extra move doesn't hurt" is the shared engine. In Chomp, eating the poison is the loss condition (misère), but usually, strategy stealing is framed on the "who eats the last piece" or "who avoids poison." Standard Chomp (avoid poison) works. Hex (connect sides) works. The core dependency is *Monotonicity*.
      *   *Smallest Change to Break It:* Remove Monotonicity. Example: A game where having an extra piece blocks your own path (e.g., "Snake" where you die if you touch yourself, or a game where pieces have specific values that might block a specific winning configuration). Or, allow Draws (then you only prove P1 doesn't lose).
      *   *Swap Rule:* This is a meta-game fix. It acknowledges the P1 advantage proved by strategy stealing. It doesn't break the math; it changes the game definition to make it fair. It's a practical application of the theoretical result.

  4.  **Address the Opening (Play vs. Lecture):**
      *   *Play:* 10 minutes is too long for 75 mins if the goal is proof structure. Also, on 7x7, they *will* draw or get confused.
      *   *Failed Construction:* Better. Show we want to find a move. Show we can't.
      *   *Recommendation:* **Short Play (5 mins) + Immediate Pivot.** Let them feel the complexity, then stop. Don't let them conclude it's a draw.
      *   *The "No Draw" Concession:* Do *not* try to prove Hex has no draws. It requires topology (Brouwer/Jordan Curve). State it as a **Lemma** given by the "Game Designers." "We accept as axiom for this section: Hex cannot end in a draw." This isolates the logic of *Strategy Stealing* from the logic of *Topology*.

  5.  **Address the Misconception Map (Sequencing):**
      *   *Constructivity:* Address this at the *end* as the payoff. "So where should P1 move?" "We don't know."
      *   *Copycat/Mirroring:* Address this during the *proof walkthrough*. The "occupied square" issue is the crux.
      *   *Draw vs. Win:* Address this during the *setup*. Distinguish Tic-Tac-Toe (Draw possible) vs. Hex (No Draw).
      *   *Symmetry:* Address this during the *contradiction*. Why can't P2 steal? Because P1 moves first (the "extra piece").
      *   *Chance Games:* Address in *limitations/deferred* section.

  6.  **Develop the Dependency Structure:**
      *   You can't explain the contradiction until you define the strategy.
      *   You can't define the strategy until you establish Monotonicity.
      *   You can't establish Monotonicity until you define the winning condition.
      *   You can't conclude "P1 Wins" until you eliminate "P2 Wins" AND "Draws."

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Time:* 75 mins.
      *   *0-5:* Hook & Play.
      *   *5-15:* Rules & The "Axiom" (No Draws).
      *   *15-30:* The Failed Search (Constructive attempt).
      *   *30-50:* The Strategy Stealing Proof (The Core).
      *   *50-60:* Misconception Check (The "Why not P2?" and "Which move?").
      *   *60-70:* Variations (Chomp/Swap) & Limits (Chance).
      *   *70-75:* Closing Question.

      *   *Refining the Game Choice:* Stick with Hex. It's what the boards are for. It's the strongest example.
      *   *Refining the "No Draw" issue:* Be explicit. "We are proving $A \implies B$. $A$ is 'Hex has no draws'. $B$ is 'P1 has winning strategy'. Today is about the implication."
      *   *Refining the Surprise:* The surprise isn't that P1 wins (chess players expect it). The surprise is that we know it *without knowing how*. The "Extra Stone" paradox.
      *   *Refining the Closing Question:* Needs to test the *conditions*. "I invent a game... does the proof hold?"

  8.  **Addressing Specific Prompt Requirements:**
      *   *Dependency Structure:* Needs to be explicit, not just a timeline.
      *   *Misconception Map:* Needs specific intervention points.
      *   *Leave Out:* Topology, Determinacy, Complexity, Explicit Strategies.
      *   *Defer:* Swap rule mechanics (briefly mention), Maker-Breaker.

  9.  **Final Polish:**
      *   Tone: Professional, pedagogical, direct.
      *   Check constraints: No references, focus on sequencing.
      *   Ensure the "Chess Players" in the room are managed (they might claim they know the strategy).
      *   Ensure the "Non-Constructive" link to the lecture (irrational powers) is made.

      *(Self-Correction during drafting)*: I initially thought about suggesting Chomp because the "poison" is clear. But the prompt says I have Hex boards. Using Chomp without boards is harder. I must use Hex. I need to explain why Hex is better than Tic-Tac-Toe (TTT). TTT allows draws, so Strategy Stealing only proves "P1 doesn't lose." Hex (axiomatically) has no draws, so it proves "P1 wins." This is a crucial distinction for the "Existence of a Win" theme.

      *(Refining the "Smallest Change")*: What breaks it? If an extra move can be a liability. Example: "Avoid creating a line of 3." Or "Chess" (Zugzwang). Zugzwang is the perfect counter-example to monotonicity.

      *(Refining the "Swap Rule")*: It's a practical fix, not a mathematical break. It acknowledges the proof's conclusion (P1 has advantage) and neutralizes it.

      *(Refining the Closing Question)*: "I modify Hex: If you place a stone that completes a cycle of your own color, you lose. Does the proof still work?" (Tests Monotonicity).

  10. **Final Review against constraints:** 75 mins, 26 students, whiteboard/doc cam. Plan must be actionable.

      *Let's structure the response exactly as requested:*
      1.  Opening Strategy (Play vs. Lecture).
      2.  Game Selection & Logic (Hex vs. Others).
      3.  Dependency Structure (The logical flow).
      4.  Misconception Map (When to intervene).
      5.  Minute Allocation & Surprise.
      6.  Closing Question & Diagnostics.
      7.  Deferrals & Omissions.

      *Wait, one detail:* "Two of them play serious competitive chess." They know about Zugzwang. I should use that. It's a perfect weapon against the "Why not all games?" misconception.

      *Okay, ready to write.*
answer: |-
  Here is the pedagogical plan, structured by logical dependency rather than chronological flow, followed by the session logistics.

  ### 1. The Opening: Play, Axiom, or Construction?
  **Do not open with ten minutes of free play.** On a 7×7 board, ten minutes is enough for confusion but not enough for a decisive result. Your chess players will dominate, and the others will feel the game is too complex to analyze, reinforcing the idea that "we just can't find the strategy yet" rather than "the strategy cannot be exhibited."

  **The Strategy:** Open with a **five-minute constrained demo**, then immediately pivot to a **failed construction attempt**.
  1.  **Demo (5 mins):** Pair them up. Give them a specific, restricted goal: "Connect the top edge to the second row." This is solvable and fast. It establishes the mechanics without bogging them down in full-game complexity.
  2.  **The Pivot:** Draw a 3×3 Hex board on the document camera. Ask: "What is the winning first move for Player 1?"
      *   Let them shout out suggestions.
      *   Show why each can be defended against (locally).
      *   **Concede:** "We cannot find the move by inspection. In fact, for 7×7, no human knows the winning first move."
  3.  **The Axiom:** You must address the "No Draw" property immediately to prevent the Tic-Tac-Toe confusion.
      *   **State:** "For the purpose of this proof, we accept as an axiom that Hex cannot end in a draw. One player must win."
      *   **Justification:** Tell them the proof of this requires topology (Jordan Curve Theorem) which is outside the scope of *this* proof. You are isolating the **existence logic** from the **topological logic**. If you try to prove no draws, you lose the thread of non-constructive existence.

  ### 2. Game Selection: Hex vs. Tic-Tac-Toe vs. Chomp
  **Commit to Hex.**
  *   **Why Hex:** It is the only one of the three where the standard Strategy-Stealing argument proves **Player 1 has a Winning Strategy**.
      *   *Tic-Tac-Toe:* Admits draws. Strategy stealing only proves Player 1 can force *at least a draw*. This weakens your lecture's theme (Existence of a Win).
      *   *Chomp:* Mathematically sound, but the "poisoned square" mechanic is slightly more abstract to visualize on a document camera than Hex's connectivity.
      *   *Hex:* Visually immediate. The "extra stone" intuition is strongest here.
  *   **Same Species?** Hex and Chomp are the same species of argument. Both rely on **Monotonicity** (having more pieces/states is never worse).
  *   **Smallest Change to Break It:** Remove Monotonicity.
      *   *Example:* Introduce **Zugzwang**. In Chess, having the move can be a disadvantage. If you modify Hex so that placing a stone *could* block your own future path (e.g., "You lose if you form a cycle"), the argument fails. The "extra stone" becomes a liability.
  *   **The Swap Rule:** This is not a breaking change; it is a meta-game acknowledgment of the proof. The proof says "P1 has an advantage." The Swap Rule says "P1 can choose to become P2 after seeing the first move," effectively neutralizing the advantage proved by the theorem. It confirms the theorem's validity rather than refuting it.

  ### 3. Logical Dependency Structure
  Do not present the proof linearly. Present the **conditions** required for the proof to function. If a condition is missing, the proof collapses.

  1.  **Finite Game + Perfect Information + No Chance:** (Establishes that a strategy *exists* in principle via Zermelo's Theorem, though you need not name Zermelo).
  2.  **No Draws (The Axiom):** (Establishes that the outcome must be P1 Win or P2 Win).
  3.  **Monotonicity (The Engine):** (Establishes that an extra piece for P1 is never a disadvantage).
      *   *Dependency:* You cannot run the contradiction until Monotonicity is verified.
  4.  **The Contradiction (The Strategy Steal):**
      *   Assume P2 has a winning strategy $S$.
      *   P1 plays arbitrary move $m$.
      *   P1 ignores $m$ and plays according to $S$ (pretending to be P2).
      *   *Crucial Step:* If $S$ calls for playing on $m$, P1 plays arbitrarily elsewhere.
      *   *Why this works:* Because of Monotonicity, having the stone at $m$ *plus* the new stone is $\geq$ having just the new stone.
  5.  **The Conclusion:** P1 wins.
  6.  **The Non-Constructive Gap:** We know P1 wins, but since $m$ was arbitrary, we do not know *which* $m$ initiates the win.

  ### 4. Misconception Map & Intervention Points
  Head these off *during* the flow, not at the end.

  | Misconception | When it arises | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"This tells us how to play."** | During the Conclusion. | **Stop.** Ask: "Which square should P1 play?" When they realize $m$ was arbitrary, emphasize: "We proved existence, not identity. This is the irrational power argument again." |
  | **"Just copy the opponent's move."** | During the Contradiction. | Students think it's pure mirroring. Clarify: "We are stealing a *strategy*, not mirroring *moves*. We are playing P2's winning plan against them." |
  | **"What if the strategy wants the occupied square?"** | During the Contradiction. | This is the technical crux. Explicitly draw the board state. Show the "occupied" square. Explain the "play anywhere else" fix. **Crucial:** Ask "Why is playing anywhere else safe?" Answer: Monotonicity. The extra stone at $m$ can't hurt. |
  | **"Why can't P2 steal P1's strategy?"** | During the Conclusion. | **The Asymmetry Check.** Ask: "Who has the extra stone?" P1 moves first. P2 cannot pretend to be P1 because P2 does not have the luxury of an 'ignored' first move. The first move is the resource being stolen. |
  | **"Does this work for Chess/Poker?"** | During Q&A / Limits. | **Chess:** No (Zugzwang/Draws possible). **Poker:** No (Chance/Hidden Information). Use your chess players here: ask them if having an extra piece on the board is always good in Chess. (It's not; it can block pieces). |
  | **"But Tic-Tac-Toe is a draw."** | During Setup. | Reiterate the Axiom. "In TTT, Strategy Stealing proves P1 doesn't *lose*. In Hex (axiomatically), 'not losing' means 'winning'." |

  ### 5. Session Logistics (75 Minutes)

  *   **00–05: The Hook (Constrained Play).** Pairs. Goal: Connect Top to Row 2. Stop immediately.
  *   **05–15: The Problem (Failed Construction).** 3×3 Demo. Elicit moves. Show defenses. Admit ignorance. State the **No-Draw Axiom**.
  *   **15–30: The Conditions (Monotonicity).** Define "Monotonicity" (Extra stone $\neq$ Liability). Test it: "Does a stone ever block you in Hex?" (No, you can route around). Contrast with Chess (Zugzwang).
  *   **30–50: The Proof (Strategy Stealing).** Walk through the contradiction on the whiteboard.
      *   *Visual Aid:* Use two colors of counters. Place a "Ghost" counter to represent the move P1 ignores.
      *   *Key Moment:* When explaining the "occupied square" fix.
  *   **50–60: The Gap (Non-Constructivity).** Explicitly link back to the $\sqrt{2}^{\sqrt{2}}$ lecture. "We know a winning move exists. We cannot point to it."
  *   **60–70: Stress Testing.** Briefly mention Chomp (same logic). Briefly mention the Swap Rule (practical fix).
  *   **70–75: Closing Question.**

  ### 6. The Moment of Surprise
  The surprise should not be that P1 wins (chess players expect P1 advantage).
  **The Surprise:** The proof works *even if the first move is objectively terrible.*
  Tell them: "The proof holds even if Player 1 places their first stone in the very center, or even in a corner, or even if they close their eyes and drop it. As long as *some* winning strategy exists for P2, P1 can steal it. The arbitrariness of the first move is the feature, not the bug."

  ### 7. Closing Question & Diagnostics
  **Question:** "I invent a game called **Negative Hex**. It is played on a Hex board. The rules are identical, *except* if you place a stone that completes a cycle of your own color, you immediately lose. Does the Strategy-Stealing argument prove Player 1 has a winning strategy in Negative Hex?"

  **Diagnostic Wrong Answers:**
  1.  **"Yes, because it's still Hex."**
      *   *Reveals:* They didn't understand **Monotonicity**. In Negative Hex, an extra stone *can* hurt you (by completing a cycle). The argument fails.
  2.  **"No, because Player 2 can steal back."**
      *   *Reveals:* They didn't understand the **Asymmetry** of the first move.
  3.  **"No, because the game might end in a draw."**
      *   *Reveals:* They are conflating the **No-Draw Axiom** with the Monotonicity failure. (Actually, Negative Hex might still have no draws, but the stealing argument fails due to monotonicity).

  ### 8. Deferrals and Omissions
  **Deliberately Leave Out (Do Not Raise):**
  *   **The Topological Proof of No-Draws:** Do not sketch it. It distracts from the logic of existence.
  *   **Determinacy (Zermelo's Theorem):** Do not name-drop. It complicates the "Finite/Perfect Info" premise without adding value.
  *   **Complexity Class (PSPACE):** Do not mention that finding the strategy is computationally hard. It confuses "non-constructive" with "computationally difficult."
  *   **Explicit Board Sizes:** Do not discuss which board sizes have known explicit solutions.

  **Name and Defer (Write on a "Parking Lot" corner of the board):**
  *   **The Swap Rule:** "We will discuss how tournaments fix this imbalance in the Combinatorics option."
  *   **Maker-Breaker Games:** "This generalizes to games where draws are impossible by definition."
  *   **Chomp:** "Same proof structure, different geometry. See problem set."

  **Why this distinction?** The "Leave Out" items introduce new mathematical machinery that obscures the specific logical dependency of Strategy-Stealing. The "Defer" items validate the students' intuition that this is part of a larger theory, serving your recruitment goal without cluttering the current proof.
