  **Note on the text**

  The setups and the verdicts per theory are mostly bookkeeping within the subfield: Causal Decision Theory refuses both payments; Evidential Decision Theory pays the blackmailer (seeking good news) but refuses the mugging; Functional Decision Theory pays the mugging (controlling the prediction) but refuses the blackmail (where the prediction is merely evidence). What is genuinely contested is whether Functional Decision Theory is *correct*—whether it is coherent to treat your decision as a logical output that constrains counterfactual simulations of you, or whether that conflates correlation with causation. Mainstream economics and philosophy often reject the coherence of "counterfactuals on your own output" entirely.

  The poem quietly takes the functionalist side. It assumes the simulation ("the copy") is relevant to your current choice and frames the decision as selecting a function output rather than performing a physical act. It fudges the disagreement by presenting the logical dependency ("The prize depends on what you would do") as a fact of the scene, rather than a contested interpretation of rationality. The pantoum form mirrors the XOR structure: the same lines return in different slots, changing meaning based on their position, just as the same decision procedure yields different verdicts based on the causal structure.
