prompt: |-
  hey im in this social epistemology seminar and weve been going deep on frickers idea of testimonial injustice. i also do peer mediation for dorm conflicts about 6 hours a week, filing reports after each session, so i actually need to apply this stuff repeatedly not just write essays. can you turn testimonial injustice into a reusable checklist or decision tree i can run in like 15 minutes befor i submit a form? it should have ordered steps with yes/no gates, clearly mark where im using judgment instead of rules, and bake in that hermeneutical gap thing my prof calls preemptive hermeneutical exclusion — where the listener doesnt even have the vocabulary to recognize the harm. i need three worked cases: one clear gender-based credibility dismissal, one personality clash where the checklist still flags injustice even though i personally think its wrong (the false positive), and one where the harm is hermeneutical not testimonial. also be honest about where the procedure misfires and what kinds of harm it will never catch. no citations or reading lists please, i dont have the books on me and this is for my job.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **User:** Social epistemology seminar student + Peer Mediator (6 hrs/week, dorm conflicts).
      *   **Task:** Create a reusable checklist/decision tree for applying Miranda Fricker's concept of *testimonial injustice* (and related hermeneutical injustice) to mediation reports.
      *   **Constraints:**
          *   Must be doable in ~15 minutes before form submission.
          *   Ordered steps with Yes/No gates.
          *   Clearly mark where human judgment is needed vs. rules.
          *   Include "preemptive hermeneutical exclusion" (listener lacks vocabulary to recognize harm).
          *   Provide three worked cases:
              1.  Clear gender-based credibility dismissal.
              2.  Personality clash (False Positive: checklist flags it, mediator thinks it's not injustice).
              3.  Hermeneutical harm (not testimonial).
          *   Be honest about limitations/misfires (what harm it won't catch).
          *   **NO citations or reading lists** (practical tool for work).

  2.  **Deconstruct the Concepts:**
      *   *Testimonial Injustice:* Prejudicial credibility deficit given to a speaker due to identity prejudice (gender, race, etc.).
      *   *Hermeneutical Injustice:* Structural gap in shared understanding/resources that prevents someone from making sense of their social experience.
      *   *Preemptive Hermeneutical Exclusion:* A specific nuance where the listener doesn't even have the concepts to *hear* the claim as a claim of harm.
      *   *Context:* Dorm mediation. High volume, low time, emotional stakes, need for documentation.

  3.  **Drafting the Tool (The "15-Minute Credibility & Clarity Check"):**
      *   *Goal:* Fast, actionable, distinguishes between "I don't believe them" and "I'm biased against them."
      *   *Structure:* Flowchart style (Step 1 -> Step 2...).
      *   *Judgment Markers:* Need to explicitly highlight where the mediator's gut/brain is doing the heavy lifting vs. following a prompt.
      *   *Hermeneutical Component:* Needs to ask if the *language* exists to describe the problem.

      *   *Drafting Steps:*
          1.  Identify the claim.
          2.  Check credibility assignment (Did I/they discount the speaker?).
          3.  Check for Identity Prejudice (Is the discounting linked to a stereotype?).
          4.  Check for Hermeneutical Resources (Do they have words for this?).
          5.  Final Classification.

      *   *Refining for Speed:* Make it a checklist with "Stop/Go" logic.
      *   *Refining for "Preemptive Exclusion":* Add a specific question about whether the *mediator* struggled to understand the nature of the complaint because it didn't fit standard categories (e.g., "microaggression" vs. "being rude").

  4.  **Developing the Worked Cases:**
      *   *Case 1 (Gender/Testimonial):* Classic example. Woman reports harassment, man says she's "overreacting," mediator sides with man.
      *   *Case 2 (False Positive):* Two people clash. One is chronically late/complaining. Mediator flags "credibility deficit," but it's actually based on past behavior, not identity. *Correction:* The prompt asks for a case where the checklist flags injustice *even though the mediator thinks it's wrong*. This implies the checklist is sensitive but maybe too broad, or the mediator's intuition is biased. Let's make it a "Personality Clash" where the checklist forces the mediator to confront a potential bias they initially dismissed.
      *   *Case 3 (Hermeneutical):* A student feels "drained" by a roommate's constant neediness but can't articulate "emotional labor." The mediator initially categorizes it as "annoyance" rather than "exploitation."

  5.  **Addressing Limitations (The "Misfire" Section):**
      *   What does this tool miss?
      *   Implicit bias the mediator doesn't know they have.
      *   Power dynamics outside the room (RA vs. Student).
      *   Situations where credibility *should* be low (liars).
      *   The emotional toll on the mediator using the tool.

  6.  **Review against Constraints:**
      *   15 minutes? Yes, it's a short checklist.
      *   Yes/No gates? Yes.
      *   Judgment markers? Yes, I will bold/italicize these.
      *   Preemptive hermeneutical exclusion included? Yes.
      *   Three cases? Yes.
      *   No citations? Yes.
      *   Tone: Professional, practical, direct.

  7.  **Final Polish:**
      *   Ensure the distinction between Testimonial (credibility) and Hermeneutical (understanding) is clear in the tool.
      *   Make sure the "False Positive" case illustrates the tension between the tool and the mediator's intuition.
      *   Ensure the "Preemptive Exclusion" is integrated into the Hermeneutical section.

      *(Self-Correction during drafting)*: I need to make sure I don't just define the terms but operationalize them. Instead of "Is there prejudice?", ask "Would I believe this same story if told by [different identity]?"
      *(Self-Correction on Case 2)*: The prompt asks for a case where the checklist flags injustice *even though I personally think it's wrong*. This is tricky. It means the tool says "Injustice," but the mediator thinks "No, this is just a jerk." This highlights the tool's function as a bias check. I will frame it as the mediator initially thinking it's just a personality conflict, but the tool forces them to see they are discounting the speaker based on "dramatic" stereotypes linked to identity.

      *(Refining the "Preemptive" aspect)*: This is about the *listener* lacking the vocabulary. The checklist needs to ask: "Did I struggle to categorize this harm because it doesn't fit our standard rulebook?"

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The 15-Minute Credibility & Clarity Check
  **Purpose:** To flag potential epistemic injustice in mediation notes before filing.
  **Time:** ~15 Minutes
  **Usage:** Run this *after* the session but *before* finalizing the official report.

  ---

  ## Part 1: The Decision Tree

  ### Step 1: Isolate the Credibility Judgment
  *Look at your notes. Identify any moment where you (or the other party) decided a speaker was less believable, less rational, or less important.*

  *   **Q1:** Did anyone's account get discounted, interrupted, or treated as "emotional" rather than factual?
      *   **NO:** → Skip to Step 3 (Hermeneutical Check).
      *   **YES:** → Go to Q2.

  ### Step 2: Test for Identity Prejudice (Testimonial Injustice)
  *This is where you must interrogate your own gut.*

  *   **Q2:** If the speaker had a different social identity (gender, race, year, status), would I have weighed their words the same?
      *   *[JUDGMENT CALL: You must imagine a counterfactual here. There is no rule for this.]*
      *   **NO (I would have believed them anyway):** → Likely not testimonial injustice. Note why (e.g., "contradicted by physical evidence"). Go to Step 3.
      *   **YES (I might have listened more closely):** → **FLAG: Potential Testimonial Injustice.**
      *   **UNSURE:** → **FLAG: Potential Testimonial Injustice.** (Treat uncertainty as a flag).

  *   **Q3:** Was the discounting linked to a stereotype (e.g., "she's hysterical," "he's aggressive," "they're just a freshman")?
      *   **YES:** → **CONFIRMED TESTIMONIAL INJUSTICE.**
      *   **NO:** → Go to Step 3.

  ### Step 3: The Hermeneutical Gap Check
  *This checks for "Preemptive Hermeneutical Exclusion." This happens when the harm exists, but the concepts to name it are missing from the conversation.*

  *   **Q4:** Did the speaker struggle to find words for what was happening to them? (e.g., "I know it sounds silly, but..." or "It's not exactly bullying, but...")
      *   **NO:** → Go to Q5.
      *   **YES:** → Go to Q5.

  *   **Q5:** Did *I* struggle to categorize their complaint because it didn't fit standard dorm violations (noise, cleanliness, guests)?
      *   *[JUDGMENT CALL: Reflect on your own confusion during the session.]*
      *   **NO:** → Proceed to file report normally.
      *   **YES:** → **FLAG: Potential Hermeneutical Injustice.**
      *   *Action:* In your report, do not label the behavior "unfounded." Label it "Uncategorized Relational Harm" and quote their specific phrasing.

  ### Step 4: Final Classification for Report
  *   **Green:** No epistemic flags. File standard report.
  *   **Yellow:** Hermeneutical Gap flagged. Ensure report preserves the speaker's original language; do not translate into admin-speak.
  *   **Red:** Testimonial Injustice flagged. You must document *why* credibility was assigned unevenly. If you cannot justify it without referencing identity stereotypes, you must note in your private supervisor log that bias may have impacted the mediation outcome.

  ---

  ## Part 2: Worked Cases

  ### Case 1: Clear Gender-Based Credibility Dismissal (Testimonial)
  **Scenario:** Student A (Female) reports Student B (Male) made unwanted sexual comments. Student B says they were "just joking" and "friends."
  **Mediator Initial Thought:** "They hang out a lot. Maybe she's misreading the vibe."
  **Checklist Run:**
  *   **Step 1:** Yes, A's account is being treated as "misreading" rather than fact.
  *   **Step 2 (Q2):** If a male student reported a female student for the same comments, would I call it "misreading the vibe"? *Judgment:* No, I'd probably call it harassment.
  *   **Step 2 (Q3):** Is this linked to a stereotype? Yes, the "women overreact to jokes" stereotype.
  *   **Result:** **RED FLAG.**
  *   **Action:** I cannot file this as a "misunderstanding." I must record A's testimony as a distinct claim of harm, not subordinate it to B's intent.

  ### Case 2: The "False Positive" / Personality Clash (Tension Point)
  **Scenario:** Student C (Known for being dramatic/loud in past mediations) reports Student D is "ignoring them." Student D says C is "obsessive."
  **Mediator Initial Thought:** "C is always causing drama. D is just setting boundaries. This isn't injustice; C is just unreliable."
  **Checklist Run:**
  *   **Step 1:** Yes, C's account is being discounted.
  *   **Step 2 (Q2):** If a "quiet/model" student reported being ignored, would I discount them? *Judgment:* Probably not. I'd take it seriously.
  *   **Step 2 (Q3):** Is this linked to a stereotype? It's linked to a "reputation" stereotype.
  *   **Result:** **FLAGGED AS INJUSTICE (by the tool).**
  *   **Mediator Conflict:** The tool says I'm being unfair to C because of their past reputation (which functions like an identity prejudice here), but I genuinely think C is wasting my time.
  *   **Resolution:** The tool is doing its job. It's forcing me to admit I have a "credibility deficit" for C that might be prejudicial. I must document C's claim fully, even if I side with D, to show I didn't dismiss it *solely* based on C's history. The tool prevents me from lazily writing "C is being dramatic again."

  ### Case 3: The Hermeneutical Harm (Preemptive Exclusion)
  **Scenario:** Student E (International) reports Student F makes them feel "heavy" and "tired" after every conversation. F says, "We just talk about homework."
  **Mediator Initial Thought:** "There's no rule against making someone tired. This isn't a violation."
  **Checklist Run:**
  *   **Step 1:** No credibility discount, but the harm is being dismissed.
  *   **Step 3 (Q4):** Yes, E used metaphors ("heavy") because they couldn't find a policy word.
  *   **Step 3 (Q5):** Yes, I struggled to categorize this. It's not harassment, not noise.
  *   **Result:** **YELLOW FLAG (Hermeneutical Gap).**
  *   **Analysis:** This is *preemptive hermeneutical exclusion*. I don't have the vocabulary (e.g., "emotional labor," "cultural taxation") to recognize this as a valid dorm conflict. If I file "No Violation," I erase the harm.
  *   **Action:** In the report, I will not write "No Violation." I will write "Relational Strain: Unspecified Emotional Impact" and quote E's description of feeling "heavy." This preserves the gap for a supervisor to review later.

  ---

  ## Part 3: Where This Procedure Misfires (Limitations)

  **1. The "Polite Bias" Blindspot**
  This checklist relies on you catching your own bias in Step 2. If your prejudice is deeply internalized, you will answer "No" to Q2 honestly, but incorrectly. You might think you're being objective when you're actually applying a stereotype. The tool cannot catch bias you don't know you have.

  **2. The Liar's Advantage**
  This tool is designed to protect speakers from *unfair* credibility deficits. It does not help you detect actual liars. If a student is manipulating the system, running this checklist might make you hesitate to call them out because you're so worried about being prejudiced. It creates a "credibility surplus" risk where bad actors exploit your caution.

  **3. Power Dynamics Outside the Room**
  The checklist focuses on the interaction in the mediation room. It misses structural power. If an RA mediates between a freshman and a senior Student Gov president, the freshman might suffer testimonial injustice because of *status*, not just identity. The checklist asks about identity stereotypes, but might miss institutional intimidation.

  **4. Hermeneutical Overload**
  If you flag every "Yellow" hermeneutical gap, your reports will become vague and unactionable ("Relational Strain" doesn't tell Housing what to fix). You risk creating a log of harms the university has no mechanism to solve, which can lead to mediator burnout.

  **5. Time Pressure Reality**
  In a high-conflict session, you won't have 15 minutes. You might have 2. In those cases, this tool fails. It works best for post-session reflection, not real-time intervention.

  **6. The "False Positive" Fatigue**
  As seen in Case 2, sometimes the tool will flag injustice where you feel confident there is none. If you constantly second-guess your judgment on "dramatic" students, you may become ineffective at setting boundaries. You need to trust the tool as a *check*, not a *verdict*.
