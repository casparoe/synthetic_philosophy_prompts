prompt: |-
  I'm a novelist working at the intersection of narrative form and political theory, and I'm drafting a proposal for a six-month interdisciplinary fellowship—part conceptual philosophy, part participatory design. The half-formed idea I need turned into a precise research plan is this: defenses of sortition and lottocracy treat random selection as a remedy for representational bias and cognitive homogeneity, yet they assume that deliberation can proceed without the narrative continuity that elected bodies derive from shared campaign stories, constituent mandates, and publicly performed character arcs. I want to investigate whether this absence—what I call narrative discontinuity—creates a distinctive deliberative vulnerability in randomly assembled bodies, one that standard facilitation cannot resolve without reintroducing elite narrative control. The proposal must state the exact question in a form that admits a determinate answer: is narrative scaffolding necessary for coherent collective judgment in lottocratic settings, and if so, does it inevitably replicate the hierarchical storytelling that sortition was designed to dissolve? It should explain why current literature on descriptive representation and deliberative democracy leaves this open—specifically, because it models deliberation as preference aggregation rather than as collaborative meaning-making—outline the method (conceptual analysis of deliberative conditions, comparative thought experiments between elected and selected bodies, and a structured evaluation of facilitation protocols, mapped across six months), describe what a useful deliverable looks like for both philosophers and practitioners, define what counts as failure (for example, if narrative scaffolding proves either redundant or conceptually identical to ordinary moderation), and give an honest assessment of what could make the project too large for the fellowship term. The tone should be formal and polished—precise, but carrying the sensibility of someone who thinks in scenes and arcs rather than in institutional mechanics. Please do not include a bibliography or citation-based literature review; I will add those myself.
