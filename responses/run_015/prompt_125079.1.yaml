answer: |-
  **Project Title:** The Plotless Assembly: Narrative Discontinuity and the Deliberative Vulnerability of Sortition

  **Project Summary**
  Contemporary defenses of sortition and lottocracy rest on a mechanical assumption: that if one removes the structural biases of electioneering, rational deliberation will naturally emerge from the diversity of the selected body. This project challenges that assumption by treating the legislative body not as a machine for aggregation, but as a protagonist in a political drama. Elected bodies derive coherence from a shared pre-history: the campaign trail, the mandate, and the public character arc of the representative. These are narrative technologies that bind time and intention. Randomly selected bodies lack this prologue. They begin *in media res*, without a shared story of how they arrived or where they are going.

  This fellowship proposes that this absence constitutes a specific defect: *narrative discontinuity*. Without a scaffolding of meaning, lottocratic bodies may suffer from deliberative fragmentation that standard facilitation cannot repair without subtly reintroducing the elite control sortition seeks to avoid. Over six months, I will investigate whether narrative scaffolding is a necessary condition for coherent collective judgment, and whether providing it inevitably replicates the hierarchical storytelling mechanisms of electoral politics.

  **The Research Question**
  To admit a determinate answer, the inquiry is framed as follows:
  *Is narrative scaffolding a necessary condition for coherent collective judgment in lottocratic bodies, and if so, does the construction of that scaffolding inevitably reintroduce the hierarchical storytelling mechanisms that sortition is designed to dissolve?*

  This question forces a binary evaluation of necessity (is it required?) followed by a structural evaluation of cost (does it corrupt the system?).

  **Intellectual Context: The Gap in Deliberative Theory**
  Current literature on descriptive representation and deliberative democracy treats the assembly as a site of preference aggregation or epistemic pooling. It models deliberation as a hygienic process: remove the money, remove the parties, remove the career incentives, and the "public good" will be distilled through reason. This model ignores the dramaturgical requirements of group cognition.

  In narrative terms, current theory assumes that a cast of strangers can perform a complex play without a script, a director, or a shared understanding of the previous act. It treats deliberation as a static exchange of information rather than a collaborative meaning-making process that unfolds over time. By overlooking the need for *continuity*—the narrative thread that links past grievances to future obligations—existing frameworks leave open the possibility that lottocratic bodies are structurally prone to incoherence, not because of a lack of intelligence, but because of a lack of plot. This project fills that gap by analyzing the *story* of the legislature as a functional variable, not merely a decorative one.

  **Methodology**
  The research will proceed through three interconnected modes of inquiry, blending conceptual philosophy with design prototyping.

  1.  **Conceptual Archaeology of Continuity:** I will define "narrative scaffolding" in political terms. This involves isolating the specific narrative elements present in elected bodies (the campaign promise, the threat of re-election, the party lineage) and determining their functional role. Are these merely corrupting influences, or do they serve as cognitive railings that keep deliberation on track? I will treat these not as institutional mechanics, but as plot devices that establish stakes and character motivation.
  2.  **Comparative Thought Experiments:** I will construct paired scenarios involving identical policy problems (e.g., zoning reform, triage protocols). In Scenario A, the body is elected; in Scenario B, the body is sorted. I will trace the "arc" of deliberation in both. Where does the elected body find resolution through reference to their mandate? Where does the sorted body stall? This allows for the isolation of narrative continuity as an independent variable.
  3.  **Protocol Stress-Testing:** I will evaluate existing facilitation protocols used in Citizens' Assemblies. I will analyze facilitation not as neutral moderation, but as *ghostwriting*. When a facilitator summarizes a discussion or sets an agenda, are they imposing a narrative structure? I will map these interventions to determine if they constitute a benign guidance or a subtle usurpation of the assembly's agency.

  **Six-Month Timeline**

  *   **Month 1: The Architecture of the Gap.** Conceptual definition of "narrative discontinuity." Drafting the philosophical framework that distinguishes narrative scaffolding from procedural rules.
  *   **Month 2: The Elected Arc.** Analysis of the narrative structures inherent in electoral mandates. Identifying the specific "plot points" that elected officials rely on for coherence.
  *   **Month 3: The Sortition Void.** Application of the framework to lottocratic models. Identification of specific failure points where the lack of a shared story leads to deliberative fragmentation.
  *   **Month 4: The Facilitator as Author.** Critical evaluation of facilitation protocols. Determining the threshold where guidance becomes narrative control.
  *   **Month 5: Synthesis and Design.** Developing the "Narrative Risk Assessment." Formulating the answer to the primary research question based on the prior months' analysis.
  *   **Month 6: Deliverable Production.** Finalizing the philosophical paper and the practitioner guide.

  **Deliverables**
  The project will produce two distinct but complementary outputs:

  1.  **For Philosophers:** A monograph chapter or long-form essay titled *The Dramaturgy of Legitimacy*. This text will argue for the inclusion of narrative theory within political philosophy, specifically regarding the conditions required for collective agency.
  2.  **For Practitioners:** A design document titled *The Plotless Risk: A Guide for Assembly Conveners*. This will be a practical tool for organizations running Citizens' Assemblies. It will outline where narrative vacuums occur and offer ethical guidelines for facilitators to provide structure without imposing a plot. It will treat facilitation as a delicate act of co-authorship rather than neutral administration.

  **Criteria for Failure**
  To ensure rigor, the project defines failure in two specific ways:
  1.  **Redundancy:** If the analysis reveals that "narrative scaffolding" is conceptually identical to standard procedural moderation (e.g., setting an agenda), then the concept adds no explanatory power. The project fails if it merely renames existing mechanics.
  2.  **Insignificance:** If the comparative thought experiments demonstrate that narrative discontinuity has no measurable impact on the coherence of collective judgment (i.e., sorted bodies perform identically to elected bodies without a shared story), then the central premise is false. The project must demonstrate that the absence of a story creates a specific, observable vulnerability.

  **Risk Assessment and Scope**
  The primary risk to the six-month term is the temptation to move from conceptual design to empirical testing. Conducting actual mock assemblies to test these theories would require a year or more of IRB approval, recruitment, and observation. This project must remain strictly conceptual and design-oriented; it will propose how such tests *should* be structured, but it will not conduct them.

  Secondly, the definition of "narrative" risks becoming too capacious. If every interaction is treated as a story, the term loses its sharpness. I will constrain the definition to *teleological arcs*—sequences of action linked by intention and consequence. By maintaining this constraint, I ensure the project remains focused on the specific problem of political continuity rather than drifting into general communication theory.

  **Conclusion**
  Democracy is often described as a system of checks and balances, but it is also a system of stories. We vote for characters; we legislate for futures. If we intend to replace the elected story with the lottery, we must understand what is lost in the editing room. This project seeks to determine whether a plotless legislature is a liberation from elite fiction or a descent into incoherence.
