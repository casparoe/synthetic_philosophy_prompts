answer: |-
  **Question 1 (Point: Normativity and Malfunction)**
  You argue that biologists' talk of "coding errors" can be fully translated into causal-conditional language without loss. However, when a geneticist identifies a mutation as a *malfunction* rather than merely a *variant*, they seem to be making a normative judgment about what the gene *ought* to produce relative to a standard. If you strip away the semantic blueprint, what grounds this distinction in your framework? Is a malfunction simply a statistically rare causal output, or does your thin structuralism require a specific type of causal breakage to distinguish error from mere difference?

  **Follow-up to Question 1**
  *(To be asked if she appeals to selection history to ground the normativity)*
  If you ground that normativity in selection history—arguing the gene *should* do what it was selected to do—doesn't that commit you to a teleosemantic account of function? And if so, how do you maintain that this avoids smuggling in the very semantic content you claim to eliminate, given that teleosemantics typically relies on derived intentionality?

  ***

  **Question 2 (Point: Shannon Information and Interpretation)**
  Even a thin, Shannon-theoretic account requires an interpretation scheme to distinguish message from noise and to define the relevant state-space of outcomes. In a cellular context, who or what fixes these parameters? If the cell machinery itself determines which physical differences count as informative signals, doesn't that imply an intrinsic functional context that precedes the information transfer, thereby reintroducing the intentional context you want to eliminate?

  **Follow-up to Question 2**
  *(To be asked if she distinguishes syntactic structure from semantic interpretation)*
  If you respond by distinguishing the syntactic structure of the DNA from the semantic interpretation applied by the cellular machinery, where exactly does that boundary lie in the molecular interactions? Is there a specific physical locus where the "syntax" ends and the "interpretation" begins, or does that distinction collapse under mechanistic scrutiny?

  ***

  **Question 3 (Point: Developmental Programs)**
  Many biologists speak of "developmental programs" to explain the temporal organization of gene expression. If we abandon the blueprint metaphor as semantically loaded, can we retain the program talk? Or does a rigorous causal-mechanistic account require us to replace "program" entirely with descriptions of local feedback loops and chemical gradients?

  **Follow-up to Question 3**
  *(To be asked if she offers a causal reconstruction of programs)*
  If you argue we can reconstruct "program" talk using only causal templates and feedback mechanisms, does this reconstruction retain any explanatory power that your thin-information account did not already provide? Or does "program" become merely a label for a complex causal chain without adding predictive or unifying value beyond the causal description itself?
