prompt: |-
  You serve as the methodological referee for a federal interdisciplinary review board that evaluates joint proposals spanning ecology and machine learning, and panels frequently deadlock when domain experts assign incompatible probabilities to the same outcome—say, the likelihood that a deployed model will cause irreversible ecosystem harm within ten years. Design a reusable thirty-minute audit protocol, derived from Aumann's agreement theorem, that your office can apply to determine whether such disagreement is rationally sustainable or signals a correctable failure of belief alignment. Structure it as ordered stages: first, a prior-registration check (do the parties hold explicit, shared baseline probabilities before encountering the joint evidence?); second, an evidence-transparency audit (is all relevant data and its interpretation genuinely common knowledge, or do private sub-models remain institutionally siloed?); third, a reasoning-exposure test (have the parties fully disclosed their update rules so that posteriors are mutually observable?). At each stage specify what counts as passing, where the audit halts with a determination that disagreement is permissible, where it mandates reconciliation, and where it must hand the case to a human chair because the dispute turns on normative weighting of evidence rather than on belief structure. Identify the precise conditions—common priors combined with common knowledge of posteriors—under which the theorem forces convergence, and flag practical misfire modes: hidden priors masked as empirical disputes, technically shareable evidence kept private by disciplinary norms, and reasoning opacity that mimics rational divergence. Then apply the protocol to three cases: (1) an ecologist and a computer scientist who disagree on harm probability solely because they entered with different ecological resilience priors; (2) two machine-learning researchers who claim shared priors but have not disclosed their adversarial robustness checks, producing divergent posteriors that should converge upon exposure; and (3) a case in which the audit confirms full common knowledge, shared priors, and transparent reasoning, yet disagreement persists—an outcome the board will find unacceptable because it implies a breach of rationality norms, but for which the protocol offers no constructive remedy beyond declaring the breach. Conclude by stating precisely what the procedure cannot do: it cannot manufacture common priors, it cannot adjudicate contests over which evidence is admissible when admissibility itself is disputed, and it cannot substitute for institutional authority to enforce disclosure.
reasoning: |-
  Here's a thinking process that leads to the suggested audit protocol:

  1.  **Analyze the Request:**
      *   **Role:** Methodological Referee for a federal interdisciplinary review board (Ecology + Machine Learning).
      *   **Problem:** Panels deadlock due to incompatible probabilities assigned to the same outcome (e.g., irreversible ecosystem harm).
      *   **Task:** Design a reusable 30-minute audit protocol based on Aumann's Agreement Theorem.
      *   **Structure:** Ordered stages (Prior-Registration, Evidence-Transparency, Reasoning-Exposure).
      *   **Requirements:**
          *   Specify pass/fail/halt conditions for each stage.
          *   Identify conditions for forced convergence (Common Priors + Common Knowledge of Posteriors).
          *   Flag practical misfire modes (hidden priors, siloed evidence, opaque reasoning).
          *   Apply to three specific cases.
          *   Conclude with limitations (what the procedure *cannot* do).
      *   **Tone:** Formal, authoritative, methodological, precise.

  2.  **Deconstruct Aumann's Agreement Theorem:**
      *   *Core Premise:* Two rational agents with common priors and common knowledge of each other's posteriors cannot agree to disagree.
      *   *Implication for Audit:* If disagreement persists, one of the assumptions must be false.
      *   *Assumptions to Check:*
          1.  Common Priors (Do they start from the same baseline?).
          2.  Common Knowledge of Evidence/Posteriors (Do they know what the other knows and how they updated?).
          3.  Rationality (Are they updating via Bayes' rule?).

  3.  **Drafting the Protocol - Stage by Stage:**

      *   *Stage 1: Prior-Registration Check.*
          *   Goal: Establish if priors are common.
          *   Pass: Explicit, shared baseline probabilities documented *before* evidence review.
          *   Fail/Halt (Permissible Disagreement): Priors differ fundamentally (e.g., different worldviews on resilience). This is a normative/value divergence, not a rationality failure.
          *   Action: If priors differ, stop audit. Disagreement is rationally sustainable.

      *   *Stage 2: Evidence-Transparency Audit.*
          *   Goal: Establish if evidence is common knowledge.
          *   Pass: All data, models, and interpretations are accessible to both parties. No siloed sub-models.
          *   Fail/Mandate: Evidence is hidden (proprietary code, unpublished field data).
          *   Action: Mandate sharing. If refused, hand to Chair (institutional enforcement needed).

      *   *Stage 3: Reasoning-Exposure Test.*
          *   Goal: Establish if update rules are transparent (Common Knowledge of Posteriors).
          *   Pass: Both parties can reproduce the other's posterior given the shared priors and evidence.
          *   Fail/Mandate: "Black box" reasoning, undisclosed heuristics.
          *   Action: Mandate disclosure. If disclosed and disagreement persists -> Rationality Breach (Case 3).
          *   Normative Handoff: If the dispute is about *weighting* evidence (likelihood ratios), that's normative. Hand to Chair.

  4.  **Refining the "Misfire Modes":**
      *   Need to explicitly name the practical ways this fails in the real world.
      *   *Hidden Priors:* Claiming empirical dispute when it's actually philosophical.
      *   *Siloed Evidence:* Disciplinary norms preventing data sharing.
      *   *Opacity:* Complexity masking irrationality.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Different Priors):* Ecologist (pessimistic resilience) vs. CS (optimistic tech fix). Audit stops at Stage 1. Disagreement permissible.
      *   *Case 2 (Hidden Evidence/Reasoning):* Two ML researchers. Claim shared priors. One hides adversarial checks. Audit stops at Stage 2/3. Mandate reconciliation/disclosure.
      *   *Case 3 (The Aumann Violation):* Everything shared, priors same, logic clear, yet $P(A|B) \neq P(A|C)$. Audit confirms breach. No remedy other than flagging irrationality.

  6.  **Drafting the Limitations (Conclusion):**
      *   Cannot create common priors (values/worldviews).
      *   Cannot adjudicate admissibility (legal/ethical boundaries).
      *   Cannot enforce disclosure (needs authority).

  7.  **Review and Refine (Self-Correction):**
      *   *Time Limit:* Ensure the protocol is described as feasible within 30 minutes (focused questions, document checks).
      *   *Tone Check:* Is it bureaucratic enough for a federal board but rigorous enough for math/ecology? Use terms like "Common Knowledge," "Posterior," "Update Rules."
      *   *Aumann Accuracy:* Ensure I don't misrepresent the theorem. It requires *common knowledge* of posteriors, not just sharing them. It implies they *must* converge if they are Bayesian rationalists.
      *   *Normative Weighting:* Distinguish between *how* you update (rationality) and *what* evidence counts (normative). The prompt asks to flag when it turns on normative weighting.

  8.  **Final Polish:** Organize with clear headings. Ensure the "Stop/Go" logic is clear at each stage. (Proceeding to generate output based on this structure).

      *   *Correction on Stage 3:* If reasoning is exposed and they *still* disagree, Aumann says this is impossible for rational agents with common priors. So, the audit declares a "Rationality Breach." It doesn't fix it, it flags it.
      *   *Correction on Normative Weighting:* If they agree on evidence but disagree on the *likelihood function* (how much the evidence supports the hypothesis), this is often a hidden prior or a normative judgment. I need to make sure the protocol distinguishes between "calculation error" (fixable) and "likelihood interpretation" (often normative/prior-adjacent). I will classify likelihood function disagreement as a "Hidden Prior" issue in Stage 1 or a "Normative Weighting" handoff in Stage 3. Let's place it in Stage 3 as a handoff to the Chair if the math is correct but the *weight* assigned is the dispute.

      *   *Refining the 30-minute constraint:* The protocol needs to be tight. 10 mins per stage.

      *   *Final check on Case 3:* The prompt says "the protocol offers no constructive remedy beyond declaring the breach." I must adhere to this.

      *   *Final check on Limitations:* Must match the prompt's specific required conclusions.

  9.  **Final Output Generation** (incorporating all constraints).
answer: |-
  # FEDERAL INTERDISCIPLINARY REVIEW BOARD
  ## METHODological AUDIT PROTOCOL 7.4 (AUMANN-COMPLIANCE)
  **Subject:** Resolution of Probabilistic Deadlock in Ecology-ML Joint Proposals  
  **Duration:** 30 Minutes (Strict)  
  **Authority:** Office of Methodological Referees  
  **Theoretical Basis:** Aumann's Agreement Theorem (1976)

  ### PREAMBLE: THEORETICAL BOUNDARIES
  This protocol operates on the mathematical necessity that two rational agents, possessing **Common Priors** and **Common Knowledge of Posteriors**, cannot agree to disagree. If disagreement persists, at least one assumption of the theorem is violated. This audit identifies the violation. It does not resolve normative value conflicts.

  ---

  ### STAGE 1: PRIOR-REGISTRATION CHECK (Minutes 0–10)
  **Objective:** Determine if parties hold explicit, shared baseline probabilities before encountering joint evidence.

  **Procedure:**
  1.  Request the *Ex-Ante Probability Statement* filed by each party at proposal intake.
  2.  Compare the baseline probability $P(H)$ assigned to the critical outcome (e.g., "Irreversible Ecosystem Harm") prior to reviewing the specific proposal data.

  **Audit Logic:**
  *   **PASS (Convergence Mandated):** $P(H)_{Ecologist} \approx P(H)_{CS}$ (within defined tolerance $\epsilon$). Proceed to Stage 2.
  *   **HALT (Permissible Disagreement):** $P(H)_{Ecologist} \neq P(H)_{CS}$.
      *   *Determination:* Disagreement is rationally sustainable. The divergence stems from differing worldviews (e.g., ecological resilience baselines vs. technological solutionism), not rational failure.
      *   *Action:* Close audit. Refer panel to Chair for normative weighting decision.
  *   **MISFIRE FLAG (Hidden Priors):** Parties claim empirical disagreement but cannot produce *Ex-Ante* statements.
      *   *Determination:* Priors are being masked as empirical findings.
      *   *Action:* Treat as FAIL. Force prior articulation before proceeding.

  ---

  ### STAGE 2: EVIDENCE-TRANSPARENCY AUDIT (Minutes 10–20)
  **Objective:** Verify if all relevant data and its interpretation are genuinely *Common Knowledge*, or if private sub-models remain institutionally siloed.

  **Procedure:**
  1.  Inventory all datasets, code repositories, and field observations cited in the posterior calculation.
  2.  Verify access rights: Can Party A run Party B's code? Can Party B access Party A's raw field logs?
  3.  Check for "Interpretation Silos": Are there disciplinary glossaries or preprocessing steps that alter the semantic meaning of the evidence?

  **Audit Logic:**
  *   **PASS (Convergence Mandated):** All evidence is mutually accessible and semantically aligned. Proceed to Stage 3.
  *   **MANDATE RECONCILIATION:** Evidence is technically shareable but withheld (e.g., proprietary ML weights, unpublished ecological transects).
      *   *Determination:* Violation of Common Knowledge condition.
      *   *Action:* Suspend review. Mandate full disclosure. Resume audit only upon verification.
  *   **HANDOFF TO CHAIR:** Admissibility of evidence is disputed (e.g., "Simulation data does not count as evidence" vs. "Field data is too noisy").
      *   *Determination:* Dispute turns on normative weighting of evidence types, not belief structure.
      *   *Action:* Protocol cannot resolve. Hand to human Chair for admissibility ruling.
  *   **MISFIRE FLAG (Siloed Evidence):** Disciplinary norms prevent sharing (e.g., "My model is too complex to explain").
      *   *Determination:* Technically shareable evidence kept private by norm.
      *   *Action:* Flag as Institutional Barrier. Recommend policy change to Board.

  ---

  ### STAGE 3: REASONING-EXPOSURE TEST (Minutes 20–30)
  **Objective:** Confirm parties have fully disclosed update rules so that posteriors are mutually observable and computable.

  **Procedure:**
  1.  Request the Likelihood Function $P(E|H)$ used by each party.
  2.  Perform a "Shadow Update": Referee calculates Party A's posterior using Party B's evidence and update rule (and vice versa).
  3.  Check for opacity: Are heuristics used that cannot be formalized?

  **Audit Logic:**
  *   **PASS (Convergence Forced):** Update rules are transparent, Bayesian (or formally justified approximations), and reproducible.
      *   *Determination:* If priors were common (Stage 1) and evidence is common (Stage 2), posteriors **must** converge.
      *   *Action:* If they still differ, declare **Rationality Breach** (See Case 3).
  *   **MANDATE RECONCILIATION:** Update rules are opaque ("Black Box" reasoning).
      *   *Determination:* Violation of Common Knowledge of Posteriors.
      *   *Action:* Require simplified surrogate models or explainability reports to expose the update logic.
  *   **HANDOFF TO CHAIR:** Disagreement persists on the *weight* of evidence (Likelihood Ratios) despite shared math.
      *   *Determination:* This is a normative dispute disguised as mathematical updating (e.g., how much a specific failure mode *should* weigh).
      *   *Action:* Protocol cannot resolve. Hand to human Chair.
  *   **MISFIRE FLAG (Reasoning Opacity):** Complexity mimics rational divergence.
      *   *Determination:* Agents claim the math is too hard to verify.
      *   *Action:* Reject the probability claim until a verifiable abstraction is provided.

  ---

  ### PRACTICAL MISFIRE MODES
  *Referees must flag these specific pathologies during the audit:*

  1.  **Hidden Priors Masked as Empirical Disputes:** Agents argue over data $E$ when they actually disagree on the baseline risk $P(H)$. *Detection: Stage 1 Failure.*
  2.  **Technically Shareable Evidence Kept Private:** Disciplinary norms (e.g., code ownership, site access) prevent Common Knowledge. *Detection: Stage 2 Failure.*
  3.  **Reasoning Opacity Mimicking Rational Divergence:** Agents claim their "expert intuition" constitutes a valid update rule that cannot be formalized. *Detection: Stage 3 Failure.*

  ---

  ### PROTOCOL APPLICATION: THREE CASE STUDIES

  #### CASE 1: The Resilience Divergence
  *   **Scenario:** An ecologist assigns 80% probability to ecosystem harm; a computer scientist assigns 10%.
  *   **Audit Findings:**
      *   Stage 1: Ecologist's prior on baseline resilience is $P(Resilient) = 0.2$. CS prior is $P(Resilient) = 0.9$.
      *   Stage 2 & 3: Evidence and reasoning are fully shared.
  *   **Determination:** **HALT at Stage 1.**
  *   **Outcome:** Disagreement is **Permissible**. The divergence originates in incompatible priors regarding ecological stability, not a failure of rational updating. The Board must treat this as a value judgment, not a factual error.

  #### CASE 2: The Adversarial Blindspot
  *   **Scenario:** Two ML researchers claim shared priors on model safety ($P(Harm) = 0.05$). One concludes $P(Harm|Data) = 0.06$; the other concludes $P(Harm|Data) = 0.40$.
  *   **Audit Findings:**
      *   Stage 1: Pass (Shared priors).
      *   Stage 2: **Fail.** Researcher B has not disclosed adversarial robustness checks used to update their posterior. Researcher A cannot see the evidence driving the spike to 0.40.
      *   Stage 3: N/A (Evidence not common).
  *   **Determination:** **MANDATE RECONCILIATION.**
  *   **Outcome:** Disagreement signals a **Correctable Failure**. Researcher B must disclose the adversarial tests. Aumann's conditions dictate that once these checks are Common Knowledge, the posteriors must converge.

  #### CASE 3: The Rationality Breach
  *   **Scenario:** Full common knowledge confirmed. Priors registered as identical. Update rules disclosed and verified as mathematically sound. Yet, $P(Harm)_{Agent A} = 0.3$ and $P(Harm)_{Agent B} = 0.7$.
  *   **Audit Findings:**
      *   Stage 1: Pass.
      *   Stage 2: Pass.
      *   Stage 3: Pass.
  *   **Determination:** **RATIONALITY BREACH.**
  *   **Outcome:** This outcome is **Unacceptable** under the theorem. It implies at least one agent is not acting as a rational Bayesian updater. The protocol offers **no constructive remedy** (it cannot fix the brain). The Referee must declare the probabilities invalid for decision-making purposes and recommend the panel disregard both estimates until the cognitive or computational error is identified.

  ---

  ### LIMITATIONS OF PROCEDURE
  **Referees are explicitly instructed that this protocol cannot:**

  1.  **Manufacture Common Priors:** It cannot force an ecologist and an economist to value long-term risk equally. If priors differ, the audit halts; it does not reconcile.
  2.  **Adjudicate Admissibility Contests:** It cannot rule on whether specific evidence *ought* to be considered (e.g., "Is animal suffering data relevant to model safety?"). This is a normative question reserved for the Chair.
  3.  **Substitute for Institutional Authority:** It can identify hidden evidence, but it lacks the power to compel disclosure. Enforcement requires the Office of the Chair.

  **END OF PROTOCOL**
