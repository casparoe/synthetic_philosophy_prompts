answer: |-
  ### Part 1: Brainstorming & Critique of Your Intuition

  Before I give you the tool, I need to validate your suspicion that your current rule of thumb ("if they agree on concrete cases, it's just words") is indeed too crude. As a philosopher of language, I see three specific ways this fails, which our new procedure must fix:

  1.  **The "Principle vs. Extension" Problem:** Two people can agree on every *current* case but disagree on the *rule*. Example: Person A says "Wild means born outside." Person B says "Wild means self-sustaining." Currently, all self-sustaining birds were born outside. They agree on every bird you point to today. But they are fighting about a *principle* that will matter tomorrow. If you lock this as "just words," you miss a ticking time bomb.
  2.  **The "Normative Stakes" Problem:** Sometimes the fight isn't about what a word *means*, but what *consequences* attaching that word has. If "wild" gets you a prize, the fight isn't about biology; it's about distributive justice. Calling this "just words" ignores the material stake.
  3.  **The "Ontological Idle" Problem:** Disagreements about existence (numbers, species concepts) often have no "truth conditions" observable in the hobby. If no observation could ever prove one side right, it's not a factual dispute; it's a preference for a conceptual framework. In a hobby forum, these are almost always category errors.

  **The Goal:** We need a procedure that separates **Verbal Disputes** (definitions), **Substantive Disputes** (facts or policy stakes), and **Metaphysical Idlers** (existence claims with no observable impact).

  ***

  ### Part 2: The Procedure (The "15-Minute Triangulation")

  This is for your mod team's internal use. Do not post this. Use this to decide what to post.

  **Step 1: The "Therefore" Test (2 Minutes)**
  Ask each party to finish this sentence: *"If I am right and you are wrong, therefore [blank]."*
  *   **If the blank is:** "Therefore you are using the word incorrectly," it is **Verbal**.
  *   **If the blank is:** "Therefore I get the prize / Therefore this post gets deleted," it is **Policy/Substantive**.
  *   **If the blank is:** "Therefore the universe is different," with no change to birding, it is **Metaphysical**.

  **Step 2: The "Future Case" Swap (5 Minutes)**
  Ignore the word they are fighting about. Ask them to describe a *hypothetical* future bird or image.
  *   Do they agree on whether to count it?
  *   **If Yes:** They agree on the world, just the label. (Verbal).
  *   **If No:** Identify *which feature* caused the disagreement (e.g., "born in cage" vs. "hunts for food"). This reveals the hidden rule. If the hidden rule affects prizes or bans, it is **Policy**.

  **Step 3: The "Observation" Check (5 Minutes)**
  For existence claims (numbers, species, the forum "soul"): Ask, "What specific observation would prove you right?"
  *   **If they can name one:** It's a **Fact** dispute (keep open).
  *   **If they say "You can't observe it, it's just true":** It is **Metaphysical** (close as off-topic).

  **Step 4: The Decision**
  *   **Verbal:** Lock thread. Post the "Translation Template" (below).
  *   **Policy/Substantive:** Keep open. Tag as "Policy Discussion." Move to admin vote if needed.
  *   **Metaphysical:** Lock thread. Post "Off-Topic" reason.

  ***

  ### Part 3: The Template (One Short Paragraph)

  This is what you actually post in the thread. It is designed to be neutral, firm, and dissolving.

  > "We've reviewed this thread. It appears the disagreement is about [terminology / community policy / unanswerable theory] rather than observable facts. If both sides would treat future cases the same way, this is a definition issue, and we encourage you to simply specify your criteria (e.g., 'born in wild' vs 'self-sustaining') rather than debating the label. If the outcome changes who gets a prize or how posts are moderated, this is a policy issue for the admins, not a truth debate. Threads that cannot point to an observable difference in the hobby are considered off-topic. We are locking this to prevent repetition; please refer to the [Wiki/Rules] for the working definition used here."

  ***

  ### Part 4: Running the Test Cases

  Here is how the procedure handles your three scenarios.

  #### Case 1: The Escaped Zoo Bird (Prize Eligibility)
  *   **The "Therefore" Test:** Person A says, "If I'm right, he gets the prize." Person B says, "If I'm right, he doesn't."
  *   **Analysis:** There is a material consequence (the prize). This is not merely verbal. It is a **Policy/Substantive** dispute disguised as a definition dispute.
  *   **Action:** **Do not lock as "just words."** Keep the thread open but move it to a "Policy & Rules" subforum. The question isn't "What is wild?" it is "What are the criteria for the prize?"
  *   **Outcome:** The thread stays open, but the framing shifts from truth to rules.

  #### Case 2: AI-Generated Nature Images ("Is it a Photograph?")
  *   **The "Therefore" Test:** Person A says, "If I'm right, it's not art." Person B says, "If I'm right, it is."
  *   **The Observation Check:** Can you observe "photograph-ness"? No. It's a category boundary.
  *   **The Future Case Swap:** If you ask, "Should this be allowed in the 'Photo of the Month' contest?" they might disagree. If you ask, "Should this be allowed in the 'General Art' thread?" they might agree.
  *   **Analysis:** If there is no contest stake, this is **Verbal**. If there is a contest stake, it is **Policy**. Assuming this is a general discussion thread with no contest link:
  *   **Action:** **Lock as Verbal.**
  *   **Outcome:** **This is the answer you might not like.** Culturally, this feels like a "real" fight about the soul of the hobby. But philosophically, without a rule stake, "photograph" is just a noise we make. The procedure forces you to treat this as semantic, not ethical. It dismisses the "vibe" conflict because it lacks a truth condition.

  #### Case 3: Do Numbers Exist? (Ontology)
  *   **The Observation Check:** "What observation proves numbers exist?" Answer: "None, they are abstract."
  *   **The "Therefore" Test:** "If I'm right... the universe is mathematical." Does this change how we count birds? No.
  *   **Analysis:** This is **Metaphysical Idle**. It has no "cash value" for birdwatching.
  *   **Action:** **Lock as Off-Topic.**
  *   **Outcome:** Clean lock. This is the easiest one. The procedure correctly identifies that ontology without observation is noise in a hobby context.

  ***

  ### Part 5: The Limitation (What This Cannot Do)

  You asked for honesty about where this fails. Here it is:

  **This procedure cannot resolve "Conceptual Engineering" disputes.**

  In Case 2 (AI), I predicted you might dislike the outcome. Here is why: Sometimes, fighting about words *is* the real fight, because changing the word changes the culture, even if the rules don't change immediately. If we decide AI isn't a "photograph," we protect a certain culture of effort. If we decide it is, we modernize.

  My procedure classifies this as "Verbal" and locks it *unless* there is an explicit rule stake (like a contest). This means **the procedure biases the forum toward the status quo.** It treats existing rules as the only "real" stakes. It will shut down cultural evolution debates because they look like semantic quibbles until the admin team actually changes a rule.

  You can use this tool to keep the peace and clear the queue, but know that it will systematically silence arguments about *what the hobby should become* unless those arguments are already codified in your rulebook. It solves the fighting, but it might stagnate the community's philosophical growth. That is the trade-off for efficiency.
