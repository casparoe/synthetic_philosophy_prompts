  **Scenario**

  A metropolitan hospital board is voting on whether to replace its standard surgical sterilant (Chemical A) with a newer, more efficient agent (Chemical B). Everyone agrees on the probabilities and outcomes: Chemical B reduces post-operative infection rates by 5% (a significant health gain) but causes mild, reversible respiratory irritation in 2% of staff (a known health cost), whereas Chemical A has no irritation risk but higher infection rates. Utility is linear in health outcomes and budget, the staff and patients are the same population in both scenarios, and the irritation is neither catastrophic nor irreversible. Expected-utility maximisation (EUM) mandates the switch, as the aggregate health gain from reduced infections outweighs the aggregate cost of staff irritation. However, the Precautionary Principle (PP) forbids the switch. The PP is invoked not because the risks are uncertain—they are known—but because the principle places the evidentiary burden on the *proponent of the intervention* to demonstrate the absence of new hazards. The proponent has demonstrated the *presence* of a new hazard (irritation); under the PP, this failure to clear the safety threshold vetoes the action regardless of the net benefit, whereas EUM treats the hazard merely as a cost to be outweighed.

  **The Check**

  *   **Verdicts:** EUM recommends **Action** (Switch to Chemical B) because the expected net value is positive. The PP recommends **Inaction** (Keep Chemical A) because the proponent failed to meet the burden of proving the new intervention introduces *no* new harm.
  *   **Single Feature:** **The Allocation of the Evidentiary Burden.** EUM places the burden on the *decision* to be optimal (maximizing net value); PP places the burden on the *agent of change* to prove safety (eliminating new risk).
  *   **Removal Effect:** If you remove this feature (i.e., if the burden is neutralized and both options are weighed purely on net outcomes), the verdict collapses into plain cost-benefit analysis (EUM), and the PP loses its distinctive veto power. If you attempt to apply the burden symmetrically to the status quo (demanding the defender of Chemical A prove it introduces *no* harm), you trigger the **Precautionary Paradox**: Chemical A causes infections (a harm), so its defenders cannot prove safety, forbidding Inaction as well. The case avoids this only because the PP is structurally tied to *novel* interventions, not baseline risks.
  *   **Best Line of Attack:** A defender of the PP would argue the case is rigged by stripping the principle of its **epistemic context**. They would claim the PP is a heuristic for *uncertainty* (unknown probabilities), not a deontological constraint on *known* risks. By stipulating known probabilities, I have turned a rule for managing ignorance into a procedural veto that ignores the very trade-offs the principle is meant to safeguard when science is settled, thereby misdescribing the PP as a rigid prohibition rather than a trigger for further assessment.
