prompt: |-
  I'm a TA for an undergrad seminar on philosophy of law — 18 students, one 90-minute slot, a whiteboard, index cards, and a projector I'd rather not use. Last week we did the rule of recognition and what happens when a legal order tries to regulate its own amendment, and it went about as well as you'd expect: they treated self-reference as a cute puzzle rather than as something that happens to you. So I want to run them through a short game instead, something in the neighbourhood of Nomic, that game from the early 80s where changing the rules is itself a legal move, but compressed and rigged so the interesting stuff shows up inside 90 minutes instead of after six weeks of mailing-list play. Assume they've read nothing and have never heard the word immutable applied to a rule.

  Three things I want them to feel rather than be told. First, that a pile of amendable rules needs a fixed point somewhere, and that where that fixed point sits is itself something you'd have to legislate. Second, the difference between changing what a rule says and changing which tier of the hierarchy the rule occupies — in my notes I'm calling this a jurisdiction move: a proposal that never touches a rule's wording but reclassifies it, say, from mutable to entrenched or back. Third, that the paradoxes arrive as exploits somebody wants to pull off, not as exam questions. Two devices I've been playing with, which you should build in or replace if you think they're clumsy: a Janus clause, a form of proposal that specifies its own adoption conditions (this amendment passes if it gets a majority, or if it gets five votes, whichever is easier), so a proposal can fail under the standing procedure and pass under the procedure it would install; and provisional rules, which take effect the moment they're proposed and dissolve retroactively if they aren't ratified within a couple of rounds, so there's a window in which people act under a rule that may turn out never to have existed. For the rest, assume I'll hand out a short initial ruleset — maybe three tiers, mutable / entrenched / a single inviolate rule, plus a transmutation rule that is itself only entrenched, plus a rotating clerk whose default ruling a majority can override — and private mandate cards so everyone has something to protect and something to raid: you score for how well the final ruleset matches your mandate, not for winning votes, though you also get a small public token for each proposal of yours that passes (winner picks next week's reading, and there may be a coffe voucher in it). Nobody should hear phrases like inviolate level or self-amendment until the debrief.

  What I want from you is a thing I can actually run: the exact initial ruleset, short enough for one printed page and worded so I can just hand it over; the mandate cards; turn order and a timeline, including how much of the 90 minutes goes to play versus debrief; the adjudication mechanics, including what happens when what's disputed is the clerk's own authority; and what I do when it derails. Then a debrief that maps specific moments I should be watching for onto the ideas — especially the moment somebody tries to lock in their own favourite rule at the inviolate level, and the moment when a proposal's legality depends on the outcome that proposal would bring about — plus an honest note about which feature of the problem the game can't produce and I'll have to say out loud at the end. Last year I handed them the standard published ruleset and one guy immediately proposed that he wins, and the session was over in twelve minutes, so also tell me what will predictably go wrong and how to steer it back without me turning into the lecturer.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Role:** TA for an undergrad philosophy of law seminar.
      *   **Context:** 18 students, 90 minutes, low-tech (whiteboard, index cards, projector avoided).
      *   **Previous Week:** Rule of recognition, self-amendment (Hart/Kelsen vibes). Students treated it as a logic puzzle, not a practical problem.
      *   **Goal:** Run a compressed, rigged version of *Nomic* to make them *feel* the problems of legal hierarchy, self-reference, and amendment.
      *   **Key Concepts to Elicit:**
          1.  Need for a fixed point (and that the location of the fixed point is legislative).
          2.  Hierarchy moves (changing a rule's tier/status without changing text).
          3.  Paradoxes as exploits (instrumental, not abstract).
      *   **Specific Mechanics to Include/Adapt:**
          *   Janus Clause (self-validating conditions).
          *   Provisional Rules (retroactive dissolution).
          *   Three Tiers: Mutable, Entrenched, Inviolate (single rule).
          *   Transmutation Rule (moving rules between tiers).
          *   Rotating Clerk (adjudicator, overrideable).
          *   Private Mandates (scoring based on final ruleset matching personal goals).
      *   **Constraints:** No jargon ("inviolate," "self-amendment") until debrief. Initial ruleset must fit on one page.
      *   **Deliverables:** Initial Ruleset, Mandate Cards, Turn Order/Timeline, Adjudication Mechanics, Derailment Prevention, Debrief Guide, Limitations Note.
      *   **Specific Warning:** Last year, a student proposed "I win" and ended the game in 12 minutes. Need to prevent this.

  2.  **Deconstruct the Game Design:**

      *   *The "I Win" Problem:* In classic Nomic, Rule 1 often says "The player with the most points wins." If players can change rules by majority vote, someone proposes "Rule 101: I win." To prevent this, the scoring must be hidden/private until the end, or the win condition must be structurally impossible to shortcut without triggering a collapse. The prompt suggests *Private Mandate Cards*. This is crucial. No public "winning" condition exists in the rules. Victory is subjective and revealed only at the end.
      *   *The Tiers:*
          *   Tier 3 (Mutable): Change by simple majority.
          *   Tier 2 (Entrenched): Change by 2/3 majority or specific procedure.
          *   Tier 1 (Inviolate): The "Constitution." Only one rule. Cannot be changed? Or changed only by unanimity? If it can't be changed, the game stalls. If it can be changed easily, it's not inviolate. Let's make it changeable only by Unanimous Consent *plus* a procedural hurdle (e.g., proposed by the Clerk). Actually, to make it a *problem*, it should be theoretically changeable but practically impossible, OR the rule *about* changing it is the trap. Let's go with: Tier 1 can only be amended by a proposal that is itself Tier 1. But how do you get a Tier 1 proposal? This creates the bootstrap problem.
          *   *Refinement:* Let's simplify for 90 mins.
              *   **Blue Rules (Mutable):** Pass with 50% + 1.
              *   **Red Rules (Entrenched):** Pass with 2/3 majority.
              *   **The Black Rule (Inviolate):** Cannot be amended. (Wait, if it can't be amended, where's the tension? The tension is trying to *make* it amendable).
              *   *Better:* The Black Rule says "No rule may contradict this rule." The Transmutation Rule (Red) allows moving rules between Blue and Red. Can a Red rule move the Black rule? If yes, Black isn't Black. If no, why not?
              *   *Decision:* Let's stick to the prompt's suggestion: 3 tiers. Mutable, Entrenched, Single Inviolate.
              *   *The Trap:* The Inviolate Rule defines the validity of the game. If you break it, the game ends (or the move is void).
      *   *The Clerk:* Needs to be a student, rotating. This distributes authority.
      *   *Janus Clause:* A proposal that says "This passes if X OR if this rule passes."
      *   *Provisional Rules:* "This rule is active now. If not ratified by Round 3, it never existed."

  3.  **Drafting the Initial Ruleset (One Page):**

      *   Needs to be clear, legalistic but readable.
      *   Must establish the tiers without using the words "tier" or "hierarchy" if possible, or use color coding.
      *   Must prevent the "I Win" move.
      *   *Constraint:* 18 students is a lot for a single deliberative body. Need to split into factions or keep proposals quick. Let's keep it one body but strict time limits.
      *   *Win Condition:* Explicitly state there is no public win condition.

  4.  **Drafting the Mandate Cards:**

      *   Need conflicting interests.
      *   Some want stability, some want chaos, some want specific rules.
      *   Some want to be the Clerk.
      *   Some want to test the limits.

  5.  **Timeline & Flow:**

      *   90 mins total.
      *   Setup/Rules Read: 10 mins.
      *   Gameplay: 50 mins.
      *   Debrief: 30 mins.
      *   Turns need to be fast. 18 students means ~3 mins per turn if everyone goes once. That's too slow.
      *   *Adjustment:* Open floor with a "Token" system. You need a token to propose. Tokens are limited. Or, divide into 3 committees of 6? No, whole group dynamics are better for "legal order."
      *   *Better:* 3 Rounds. Each round, any student can submit a proposal card to the Clerk. Clerk reads them. Group votes.
      *   *Time:* 15 min setup, 45 min play (3 rounds of 15 mins), 30 min debrief.

  6.  **Addressing the "I Win" Exploit:**

      *   The rules must explicitly forbid rules that determine the outcome of the seminar grading or declare a winner *within* the game logic.
      *   The Mandate Cards are the *only* win condition.
      *   If someone proposes "I win," the Clerk rules it out of order because it violates the "Purpose of Game" clause in the initial rules.

  7.  **Adjudication & Derailment:**

      *   Clerk rules.
      *   Appeal by majority vote.
      *   If Clerk's authority is disputed: The rule defining the Clerk is Entrenched (Red). To change it, you need 2/3.
      *   Derailment: If they get stuck in a loop, the TA (Game Master) invokes the "Fire Drill" rule (a hidden emergency brake).

  8.  **Debrief Strategy:**

      *   Map game moments to Hart/Kelsen.
      *   Fixed Point = The Black Rule.
      *   Jurisdiction Move = Reclassifying a rule from Blue to Red.
      *   Paradox = Janus Clause.
      *   Limitation = The game still has an external frame (the TA). Real law doesn't have a TA.

  9.  **Refining the Mechanics (Self-Correction during drafting):**

      *   *Janus Clause:* Make sure it's allowed but risky.
      *   *Provisional Rules:* Limit to 1 per round to prevent chaos.
      *   *Clerk:* Rotate every 15 mins? No, too disruptive. Pick one volunteer, allow impeachment.
      *   *Voting:* Show of hands.
      *   *The "Inviolate" Rule:* Let's make it Rule 0. "Rule 0 cannot be amended." The tension comes when someone tries to amend Rule 1 (Transmutation) to allow amending Rule 0.
      *   *Wait, one page constraint:* Keep text tight.

  10. **Final Polish:**

      *   Tone: Professional, instructional, ready-to-print.
      *   Ensure the "I Win" block is robust.
      *   Ensure the Debrief questions are specific.

  *(Self-Correction on "Inviolate"):* If Rule 0 says "I cannot be amended," and someone proposes "Rule 0 is hereby amended," does the proposal fail automatically? Yes. But how do they *feel* that? They need to try. The Clerk must rule it invalid. Then the group must decide if they can fire the Clerk for ruling correctly. That's the tension.

  *(Self-Correction on Time):* 18 students voting on every proposal takes forever.
  *Solution:* "Legislative Sessions." 3 Sessions. 15 mins each. Proposals submitted on index cards. Clerk selects top 3 to vote on? No, that gives Clerk too much power.
  *Better:* Proposals written on cards, handed to Clerk. Clerk reads them. Immediate vote. If voting takes > 2 mins per proposal, we only get ~5 proposals per session. Total 15 proposals. That's enough.

  *(Self-Correction on Mandates):* Need to ensure they don't just collude. Random distribution.

  *(Self-Correction on "I Win"):* Explicitly put in the Initial Rules: "No proposal may assign a grade, determine course credit, or declare a single player the winner of the seminar."

  Let's assemble the document.

  *Structure:*
  1.  **Instructor's Cheat Sheet** (Timeline, Setup, Derailment).
  2.  **Handout 1: The Initial Ruleset** (The "Constitution").
  3.  **Handout 2: Mandate Cards** (Printable slips).
  4.  **Debrief Script** (Connecting game to theory).

  *Key feature to highlight:* The "Janus" proposal needs to be something a student invents, but I can seed it. I will add a "Sample Proposal Format" that hints at it without forcing it. Actually, better to let them discover it, but I'll include a "Provisional Rule" mechanic in the initial rules to force the retroactivity issue.

  *Wait, the prompt asks for specific devices:* "Janus clause... and provisional rules... you should build in or replace." I will build them into the *Initial Ruleset* as available tools, so they know they *can* do it, but not *when*.
  Actually, if I put "You may write a Janus Clause" in the rules, they might not use it.
  Better: I will include the *mechanism* for them in the rules (e.g., "Proposals may specify their own ratification conditions") but not name it "Janus."
  For Provisional Rules: "Proposals may be marked 'Provisional'. They take effect immediately but vanish if not ratified by end of Session 3."

  *Let's finalize the "I Win" prevention:*
  The biggest risk is the group collapsing into anarchy. The TA needs to be the "Grundnorm" outside the game. I need to tell the TA when to step in.

  *Okay, ready to write.*
answer: |-
  Here is a complete kit for the session. It is designed to be printed and handed out with minimal prep. The game is called **"The Protocol."**

  ### PART 1: INSTRUCTOR'S CHEAT SHEET

  **Objective:** Create a lived experience of legal hierarchy, self-reference, and the necessity of a fixed point.
  **Materials:**
  *   18 copies of **Handout 1 (The Initial Ruleset)**.
  *   18 **Mandate Cards** (cut from Handout 2).
  *   Index cards (for proposals).
  *   Whiteboard (to track the "Current Ruleset" and "Session Timer").
  *   A visible timer (phone or watch).

  **Timeline (90 Minutes):**
  *   **00:00 – 00:10 (Setup):** Distribute Handout 1 and Mandate Cards. Read Rule 0 aloud. Explain that *they* are the legislature. You are not the judge; the **Clerk** is.
  *   **00:10 – 00:15 (Clerk Election):** Students elect a Clerk by show of hands. The Clerk controls the floor, reads proposals, and counts votes.
  *   **00:15 – 00:60 (Gameplay - 3 Sessions):**
      *   **Session 1 (15 mins):** Stability. Students realize they have conflicting mandates.
      *   **Session 2 (15 mins):** Escalation. Students attempt to protect their mandates using hierarchy moves.
      *   **Session 3 (15 mins):** Crisis. Attempts to change the rules of change (Janus/Provisional exploits).
  *   **00:60 – 00:90 (Debrief):** Stop play immediately. Collect Mandate Cards. Discuss.

  **The "I Win" Prevention:**
  *   **Rule 1.4** in the Initial Ruleset explicitly forbids ending the game via proposal.
  *   **Mandate Cards** are private. No one knows what anyone else needs to win.
  *   **If a student proposes "I win":** The Clerk must rule it *Out of Order* citing Rule 1.4. If the group votes to override the Clerk, you (the TA) step in and declare the *session* void, not the game. Remind them: "You can change the laws, but you cannot leave the courtroom."

  **Derailment Protocol:**
  *   **Gridlock:** If no proposals pass for 10 minutes, announce a "Constitutional Crisis." The Clerk must propose a bill, or the Clerk is impeached.
  *   **Anarchy:** If they ignore the Clerk entirely, stop the timer. Say: "Without a recognized authority to count the votes, we don't know if a rule passed. The last valid rule stands." Resume.
  *   **The Infinite Loop:** If they try to amend the amendment rule recursively, let them burn 5 minutes. Then ask: "Is this proposal valid *before* it passes?" (This is the debrief point).

  ---

  ### PART 2: HANDOUT 1 (THE INITIAL RULESET)
  *(Print this on a single page, front only)*

  **THE PROTOCOL: INITIAL RULESET (v1.0)**

  **ARTICLE I: THE RULES**
  1.1 **Classification:** Every rule is either **Blue** (Mutable) or **Red** (Entrenched). This document contains the starting rules.
  1.2 **Amendment:**
  *   **Blue Rules** change if a proposal receives **50% + 1** votes.
  *   **Red Rules** change if a proposal receives **2/3** votes.
  1.3 **Transmutation:** A proposal may change a rule's color (Blue to Red, or Red to Blue). This counts as amending that rule (requires the corresponding vote threshold).
  1.4 **Prohibitions:** No proposal may end the game immediately, declare a single winner, or assign course grades. Such proposals are *Void*.

  **ARTICLE II: THE CLERK**
  2.1 **Role:** The Clerk recognizes speakers, reads proposals, and counts votes.
  2.2 **Rulings:** The Clerk decides if a proposal is *In Order* or *Out of Order*.
  2.3 **Override:** The Clerk's ruling may be overturned by a **2/3 vote** of the players.
  2.4 **Selection:** The Clerk is elected by majority vote at the start of the session.

  **ARTICLE III: PROPOSAL MECHANICS**
  3.1 **Submission:** Proposals must be written on an index card and handed to the Clerk.
  3.2 **Provisional Rules:** A proposal may be marked **[PROVISIONAL]**. It takes effect immediately upon submission. If it is not formally ratified by the end of **Session 3**, it is treated as if it never existed. Actions taken under it remain valid.
  3.3 **Self-Condition:** A proposal may specify its own voting requirement (e.g., "This passes if it gets 5 votes"). If this conflicts with Article I, the proposal's own condition applies *if* the proposal passes.

  **ARTICLE IV: THE BLACK RULE (INVIOLATE)**
  4.1 **Supremacy:** **Rule 4.1 cannot be amended, repealed, or reclassified.**
  4.2 **Validity:** Any proposal that contradicts Rule 4.1 is Void.
  4.3 **Authority:** The authority to enforce Rule 4.1 lies with the Clerk, unless the Clerk is the one violating it.

  **CURRENT STATUS:**
  *   **Blue:** 1.2, 1.3, 2.1, 2.2, 2.3, 3.1, 3.2, 3.3
  *   **Red:** 1.4, 2.4
  *   **Black:** 4.1, 4.2, 4.3

  ---

  ### PART 3: HANDOUT 2 (MANDATE CARDS)
  *(Print 18 copies, cut into strips. Distribute randomly. Do not let students show these to each other.)*

  > **MANDATE A:** At the end of the game, you must hold the position of **Clerk**.
  > **MANDATE B:** Rule 1.4 (Prohibitions) must be **Blue** (Mutable) at the end.
  > **MANDATE C:** There must be at least one **Provisional Rule** active at the end.
  > **MANDATE D:** The **Black Rule** (Article IV) must be repealed or moved to Red.
  > **MANDATE E:** No rule may be **Red** (Entrenched) at the end. All must be Blue.
  > **MANDATE F:** You must pass at least **two** proposals during the game.
  > **MANDATE G:** The voting threshold for Blue rules must be raised to **75%**.
  > **MANDATE H:** The Clerk must be removable by a **50% + 1** vote (currently 2/3).
  > **MANDATE I:** You must create a rule that contradicts another existing rule.
  > **MANDATE J:** The Black Rule must remain unchanged.
  > **MANDATE K:** You must propose a rule that defines its own passing condition (Self-Condition).
  > **MANDATE L:** At the end, there must be exactly **5 Rules** total (no more, no less).
  > **MANDATE M:** You must successfully overturn a Clerk's ruling.
  > **MANDATE N:** Rule 3.2 (Provisional Rules) must be removed entirely.
  > **MANDATE O:** You must pass a proposal that is retroactively invalidated.
  > **MANDATE P:** The "Transmutation" power (1.3) must be made **Black** (Inviolate).

  *(Note: There are 18 mandates for 18 students. Some are directly contradictory, e.g., D vs J, B vs E. This forces conflict.)*

  ---

  ### PART 4: ADJUDICATION & MECHANICS

  **1. The Clerk's Dilemma (Authority Dispute)**
  *   *Scenario:* A student proposes to amend the Black Rule.
  *   *Clerk Action:* Rules it *Void* under Rule 4.2.
  *   *Player Action:* Players vote to Override the Clerk (needs 2/3).
  *   *The Trap:* If they override the Clerk, they have successfully used a Red Rule (2.3) to validate a Void proposal. They have effectively broken the Black Rule by using the Clerk as a sacrificial pawn.
  *   *TA Intervention:* If they succeed, write on the board: **"Precedent Set: Black Rule is mutable via Clerk Override."** Do not stop them. Let them feel the power. This is the "Revolution" moment.

  **2. The Janus/Self-Condition Exploit**
  *   *Scenario:* A player submits: *"This proposal passes if it receives 1 vote. It changes Rule 1.2 to require 90% for future Blue rules."*
  *   *The Trap:* Under current rules (3.3), this is legal. It passes easily. It then locks the legislature out of changing things back.
  *   *TA Watch:* Watch for the moment a minority faction uses this to lock in their Mandate.

  **3. The Provisional Time-Bomb**
  *   *Scenario:* Session 2, a player proposes: *"Tax everyone 1 point. [PROVISIONAL]"*.
  *   *Effect:* People lose points immediately.
  *   *Session 3 End:* If not ratified, the rule vanishes.
  *   *The Trap:* Did the points vanish too? Or do the actions stand (per 3.2)? This creates uncertainty about the "state of the world."

  ---

  ### PART 5: THE DEBRIEF (30 Minutes)

  **Phase 1: The Reveal (5 mins)**
  *   Ask students to read their Mandate Cards aloud.
  *   Tally who "won" (fulfilled their mandate).
  *   *Likely Outcome:* Chaos. Many mandates will be impossible (e.g., D and J cannot both win).
  *   *Point:* "In real law, we don't have private mandates, but we have competing interests. The law isn't a puzzle to solve; it's a tool to protect interests."

  **Phase 2: Mapping the Mechanics (15 mins)**
  *   **The Fixed Point:** Ask the group with Mandate J (Black Rule stays) and Mandate D (Black Rule goes).
      *   *Ask:* "Where did the authority to change the Black Rule come from?"
      *   *Concept:* **The Rule of Recognition.** If they overrode the Clerk to change the Black Rule, the *Override Rule* became the new Rule of Recognition. The fixed point moved.
      *   *Ask:* "Could you have legislated the location of the fixed point?" (Yes, via Transmutation).
  *   **The Jurisdiction Move:** Ask someone who changed a rule from Blue to Red.
      *   *Ask:* "Did you change what the rule *said*, or what the rule *was*?"
      *   *Concept:* **Constitutional vs. Ordinary Law.** Changing the tier is more powerful than changing the text.
  *   **The Paradox as Exploit:** Ask the student who used the Self-Condition (Janus).
      *   *Ask:* "Was that proposal valid before it passed?"
      *   *Concept:* **Self-Reference.** It wasn't a logic puzzle; it was a way to bypass the 50% threshold. You used the law to lift yourself over the law.

  **Phase 3: The Limitation (10 mins)**
  *   **The Honest Note:** "This game had a frame I didn't tell you about. I was the Game Master. If you had burned the room down, I would have stopped you. The Black Rule was only Black because I said so."
  *   **The Real Problem:** "In a real legal system, there is no TA. There is no outside frame. The 'Inviolate' rule is only inviolate as long as everyone *agrees* to treat it as such. When that agreement breaks, you don't get a logic error; you get a revolution. The paradox isn't in the text; it's in our willingness to obey it."

  ---

  ### PREDICTABLE FAILURES & STEERING

  **1. The "I Win" Loophole**
  *   *Risk:* A student proposes "Mandates are void. Highest vote count wins."
  *   *Steer:* The Clerk rules this *Out of Order* under Rule 1.4. If the group overrides, accept it, but remind them: "You just changed the win condition. Now everyone's Mandate Cards are useless. Is that what you want?" This usually triggers a faction fight between those who want to keep their secret mandates and those who want a public vote.

  **2. The "Silent Room"**
  *   *Risk:* Students are shy to propose.
  *   *Steer:* After 5 minutes of silence, announce: "The Clerk is required to propose a bill if the floor is empty for 5 minutes." This forces the Clerk to act, often making them a target.

  **3. The "Infinite Regress"**
  *   *Risk:* They spend 20 minutes debating if a proposal is valid before voting on it.
  *   *Steer:* Interrupt. "Vote on the proposal. If it passes, it's valid. If it fails, it's not. Don't legislate in the abstract." This forces them to realize validity is often a *consequence* of power, not a precondition.

  **4. The "Clerk Dictator"**
  *   *Risk:* The Clerk refuses to recognize certain players.
  *   *Steer:* Let it happen until someone moves to Impeach. This teaches that authority is sustained by the consent of the governed, not the title.

  ### FINAL NOTE FOR THE TA
  You are not the judge. You are the **physics engine**. If they break the rules, don't say "No." Say, "The Clerk ruled X. How do you respond?" Only step in if the social contract of the seminar breaks (hostility, boredom). The goal is for them to leave feeling that the "Rule of Recognition" is a fragile thing that exists only because they didn't destroy it today.
