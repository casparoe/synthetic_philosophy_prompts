answer: |-
  Here is a principle designed to capture your intuitions while forcing consistency where your current verdicts wobble. It draws on the "Replicator/Interactor" framework (Hull) and recent causal accounts of selection (Godfrey-Smith, Okasha).

  ### The Principle: Causal Autonomy and Heritable Reproduction

  An entity $E$ at level $L$ is a **Unit of Selection** if and only if:

  1.  **Reproduction:** Entities of type $E$ produce daughter entities of type $E$ (not merely copies of their parts).
  2.  **Heritability:** Traits of parent $E$ are causally responsible for traits of daughter $E$ (with fidelity sufficient to maintain variance).
  3.  **Causal Autonomy:** The fitness of $E$ is not fully reducible to the sum of the fitnesses of its constituent parts at $L-1$. (i.e., There is an emergent fitness effect; the whole affects survival/reproduction in a way the parts alone do not).

  **Why this principle?**
  *   It respects your intuition that "bookkeeping" (your friend's view) is insufficient; bookkeeping can find variance anywhere, but only *reproduction* makes selection real.
  *   It respects your intuition on Case 1 (the gene reproduces autonomously of the organism's survival).
  *   It forces a resolution on Cases 4 and 5.

  ---

  ### Application to Your Cases

  **Case 1 (Segregation Distorter):**
  *   **Verdict:** Gene-level.
  *   **Principle Check:** The allele reproduces (transmits to offspring) with high fidelity. Its transmission success is *decoupled* from the organism's viability (homozygotes die). Causal Autonomy holds.
  *   **Status:** **Consistent.**

  **Case 2 (Sterile Workers):**
  *   **Verdict:** You say Kin, resist Colony.
  *   **Principle Check:** The colony buds (Reproduction). Nest traits (e.g., defense) persist in daughter colonies (Heritability). Colony survival depends on worker restraint, which lowers individual fitness (Causal Autonomy).
  *   **Status:** **Inconsistent.** The principle classifies this as **Colony-Level Selection**.
  *   **Correction:** "Kin selection" is a *genetic accounting method* (explaining *why* the allele exists via relatedness), but "Colony selection" is the *causal process* (explaining *how* the frequency changes via differential colony survival). You should accept this is **both**. Abandon the claim that it is *not* colony-level selection.

  **Case 3 (Transposable Elements):**
  *   **Verdict:** Gene-level.
  *   **Principle Check:** Identical to Case 1. The element replicates within the genome independently of host fitness.
  *   **Status:** **Consistent.**

  **Case 4 (Beetles, Random Foundresses):**
  *   **Verdict:** Group selection.
  *   **Principle Check:** Nests bud (Reproduction). Restraint allele frequency in daughter nests reflects parent nest success (Heritability). Restraint lowers individual fitness but raises nest fitness (Causal Autonomy).
  *   **Status:** **Consistent.**

  **Case 5 (Beetles, Sisters):**
  *   **Verdict:** You say Kin, not Group.
  *   **Principle Check:** Identical to Case 4. The nests still bud. The causal link between restraint and nest survival is identical. The *relatedness* changes the *genetic variance structure*, but it does not change the *level of the causal bottleneck*.
  *   **Status:** **Inconsistent.** This is the critical pivot. You must abandon the verdict that this is *not* group selection. It is group selection *facilitated* by high relatedness. If you call Case 4 "Group" and Case 5 "Kin," you are confusing the *source of variance* (relatedness) with the *level of selection* (nest survival).
  *   **Correction:** Both 4 and 5 are Group Selection. Case 5 simply has higher "group heritability" due to relatedness.

  **Case 6 (Virulence):**
  *   **Verdict:** Multilevel.
  *   **Principle Check:** Within-host: Virions reproduce, fitness decoupled from host survival. Between-host: Viral lineages reproduce, fitness depends on host survival. Both levels satisfy the principle.
  *   **Status:** **Consistent.**

  **Case 7 (Plankton Lineage):**
  *   **Verdict:** Uncertain.
  *   **Principle Check:** Do species "reproduce"? Yes, via speciation (cladogenesis). Do they have heritable traits? Yes, via phylogeny. Is extinction rate decoupled from individual fitness? Yes (a trait can lower individual fitness but lower extinction risk, e.g., broad niche).
  *   **Status:** **Consistent.** This is **Species Selection**. It satisfies all three clauses. It is not "selection's clothes"; it is selection at a higher temporal scale.

  ---

  ### What You Must Abandon

  To maintain consistency with this principle, you must abandon the distinction between **Case 4 and Case 5**.

  Your intuition that Case 5 is "Kin" and not "Group" is a relic of the historical debate between Hamilton and Wynne-Edwards. Modern theory (Okasha, Sober, Wilson) treats these as mathematically equivalent descriptions of the same process.
  *   **Kin Selection** explains the *genetic conditions* under which the trait can spread (high $r$).
  *   **Group Selection** describes the *causal mechanism* of the frequency change (differential group survival).

  In Case 5, the nest is still the causal unit determining survival. The fact that the nest is made of sisters explains why the *gene* for restraint was present to be selected, but the *selection event* is the differential budding of nests. **Verdict:** Case 5 is Group Selection (with high relatedness).

  ---

  ### Verdict on Case 7

  The principle validates **Species Selection**.
  Many biologists resist this because species don't reproduce as neatly as organisms. However, if speciation is the "birth" and extinction is the "death," and phylogenetic inertia provides "heritability," the logic holds.
  *   **Caveat:** If the trait lowering extinction is a simple aggregate of individual traits (e.g., "individuals are large" leads to "species is large"), some philosophers call this **Effect Evolution**, not Species Selection.
  *   **Refinement:** For Case 7 to be true Species Selection, the trait must be emergent at the species level (e.g., geographic range size, sexual dimorphism affecting speciation rates) and not just an average of individual properties. Assuming your "body-plan feature" is emergent, it counts.

  ---

  ### Discriminating Against Your Friend

  Your friend argues that levels are just "bookkeeping" (Price Equation partitioning). They claim that if you can partition variance into a "between-group" component, group selection exists.

  **The Discriminating Case: Arbitrary Aggregation**
  Imagine a population of mice. You measure their fitness. Then, you arbitrarily assign them to "Group A" and "Group B" using a random number generator.
  *   **Friend's View:** Because the groups are random, there will be some statistical variance in mean fitness between Group A and Group B. The Price Equation will yield a non-zero "between-group" component. Therefore, strictly speaking, "group selection" is occurring (even if trivial).
  *   **Your Principle:** **No selection is occurring at the group level.**
      *   **Why?** Clause 1 (Reproduction) and Clause 2 (Heritability) fail. Group A does not produce daughter Group As. The grouping has no causal continuity.
  *   **The Knockout:** If your friend admits this isn't "real" group selection, they admit that bookkeeping is insufficient; you need *causal reproduction*. If they insist it *is* group selection because the math says so, they have reduced "selection" to a statistical artifact, divorcing it from biology.

  ### Summary of Advice

  1.  **Adopt the Principle:** Causal Autonomy + Heritable Reproduction.
  2.  **Unify Cases 4 & 5:** Both are Group Selection. Case 5 just has higher genetic relatedness, which makes the *response* to selection faster, but the *pressure* is at the group level in both.
  3.  **Validate Case 7:** It is Species Selection, provided the traits are emergent.
  4.  **Defeat the Friend:** Use the "Arbitrary Aggregation" case to show that variance partitioning without reproductive continuity is not selection.

  This aligns your verdicts with the causal structure of the world rather than the mathematical description of it.
