  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Ontology of Privacy  
  **Parties:** "The Access Proponent" (User) vs. "The Normative Proponent" (Mate)  
  **Date:** 24 May 2024  
  **Format:** Agreed Premises, Disagreement Matrix, Adjudicator Commentary

  ---

  ## 1. SHARED COMMITMENTS
  *We, the undersigned, agree to the following propositions as the baseline for further inquiry:*

  1.  **Distinction of Loss and Wrong:** Losing privacy and being morally wronged are separable states. One can lose privacy without being wronged (e.g., voluntary disclosure, necessary medical access), and one can be wronged regarding privacy without information actually leaking (e.g., the unwatched camera).
  2.  **Instrumental Value:** Privacy serves instrumental goods, including autonomy, relationship maintenance, and protection from power asymmetries (state or corporate).
  3.  **The Role of Control:** Both accounts agree that the subject's ability to control information flow is central to the *value* of privacy, even if they disagree on whether control defines the *existence* of privacy.
  4.  **Technological Sensitivity:** Any viable theory of privacy must account for non-human agents (algorithms, sensors, automated inference) that process data without human "eyes."
  5.  **The Storm Concession:** We agree that the "Storm/Curtains" case represents a loss of *secrecy*. We disagree on whether this constitutes a loss of *privacy* proper, or merely the destruction of the physical conditions required for privacy.

  ---

  ## 2. THE DISAGREEMENT MATRIX

  | Crux | Access Proponent (User) Line | Normative Proponent (Mate) Line | Concrete Test Case | Divergent Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Definition** | Privacy is a **state of non-accessibility**. If information is not acquired and cannot be easily acquired, privacy exists. | Privacy is **contextual integrity**. It is the appropriate flow of information according to social norms and expectations of a specific relationship. | **The Unwatched Camera:** Landlord installs hidden cam in bathroom, dies before viewing footage. | **Access:** Privacy intact (0 bits acquired).<br>**Norms:** Privacy violated (expectation breached). |
  | **2. The Mechanism of Loss** | Privacy is lost only when information **crosses the boundary** to an observer. Physical exposure counts only if an observer *could* see. | Privacy is lost when the **context is breached**, regardless of observation. The installation alters the context from "sanctuary" to "surveillance." | **The Storm:** Storm rips curtains; bus queue sees occupant naked. No human agent violated a norm. | **Access:** Privacy lost (people see you).<br>**Norms:** Privacy conditions destroyed, but no *violation* occurred (no agent breached norm). |
  | **3. Inferred Facts** | Privacy applies to **raw data about the subject**. If no data *about you* is accessed, your privacy is intact. | Privacy applies to **judgments derived from data flows**. If contextually distinct data is merged to judge you, integrity is breached. | **The Insurer:** AI scores you high-risk based on *neighbors'* shopping habits. No file on you read. | **Access:** No privacy loss (your data untouched).<br>**Norms:** Privacy loss (judgment made outside proper context). |
  | **4. The Unit of Privacy** | Privacy is fundamentally **individual**. Groups are just collections of individuals; only minds keep secrets. | Privacy can be **collective**. A family, parish, or team has a shared context and norms distinct from its members. | **The Group Chat:** Admin leaks a "private" family chat to press. One member consents, others object. | **Access:** Only non-consenting individuals lost privacy.<br>**Norms:** The *family unit's* privacy was violated (context broken). |
  | **5. Remedy Focus** | Remedies should focus on **containment and deletion**. Stop the access, delete the data. | Remedies should focus on **governance and architecture**. Restore the normative boundaries, regardless of data location. | **The Leak:** Data leaked but never read by humans (only servers). | **Access:** Minimal harm/loss (no eyes).<br>**Norms:** Significant harm/loss (system integrity broken). |

  ---

  ## 3. ADJUDICATOR COMMENTARY & COMMITMENT
  *As requested, I am committing to a stance on the viability of your positions rather than providing a menu.*

  ### A. Which framing is nearer the mark?
  **The Normative Proponent (Mate) is philosophically superior; The Access Proponent (User) is legally pragmatic.**

  The Access view (User) is intuitive but brittle. It fails the **Panopticon Test**: If I know a camera *might* be recording, I change my behavior, even if no one ever watches. The Access view claims privacy is intact until the tape is viewed; this contradicts the lived experience of chilling effects. The Normative view captures *why* the camera matters: it shifts the context from "rest" to "performance."

  However, the Access view is better for **remediation**. If you sue for a data breach, courts want to know *what was taken* and *who saw it*. The Normative view is too fuzzy for damages ("My context was violated" is harder to price than "10,000 records accessed").

  ### B. Which cruxes are decisive?
  1.  **Inferred Facts (Crux 3):** This is the decisive battleground for the next decade. The Access view collapses here. If an insurer denies you coverage based on a proxy score derived from *other people's* data, you have suffered the *harm* of privacy loss (judgment without context) without the *mechanism* of access. The Normative view handles this effortlessly as a violation of contextual boundaries. **If the User cannot account for inference, their theory is obsolete.**
  2.  **The Unwatched Camera (Crux 1):** This is the decisive intuition pump. If the User insists privacy is intact here, they sever the link between privacy and **trust**. Privacy is largely about reliance on others to uphold boundaries. The camera breaks the reliance, regardless of the footage.

  ### C. What is merely verbal?
  **The "Storm" Case (Crux 2).**
  You are talking past each other here.
  *   **User** is using "Privacy" to mean "State of Seclusion."
  *   **Mate** is using "Privacy" to mean "Right to Seclusion."
  When the storm rips the curtains, the *State* is lost (User is right), but the *Right* is not violated (Mate is right). This is a semantic collision. I recommend you agree to distinguish **Privacy Status** (are you hidden?) from **Privacy Violation** (was a norm breached?). Once you make that linguistic split, 40% of your argument vanishes.

  ### D. Flagging Guesses and Inventions
  1.  **The Mate's "Storm" Position:** I have had to steelman the Mate's position on the Storm case. A strict Contextual Integrity theorist might actually concede that privacy is *lost* in the storm case because the context has physically shifted from "private" to "public," even if no norm was violated. I have drafted his position as "No *violation* occurred" to maximize contrast with your view. He may need to correct this nuance.
  2.  **The "Group" Crux:** I have invented the "One member consents" scenario in Crux 4. You didn't specify this, but it is the necessary stress test for Group Privacy. If the User claims only individuals have privacy, they must argue the consenting member had the right to leak the whole chat. The Mate would argue the *group* had a veto. This is a guess at where your argument will naturally lead.
  3.  **Harm vs. Loss:** In Shared Commitment #1, I have assumed you both agree that "Wrong" implies moral harm. It is possible the User thinks "Privacy Loss" *is* the harm. I have forced a wedge there to facilitate agreement; the User may feel this concedes too much.

  ### E. Final Verdict
  Run the collaboration on the **Inferred Facts** case. It is the only one that matters practically. If the Access Proponent can explain why an algorithmic score based on neighbors' data isn't a privacy issue without sounding like they are ignoring the harm, they win. If they can't, the Normative view absorbs the Access view as a subset (access is just one way to violate norms).

  **Recommendation:** Stop debating the bathroom camera. It's a 19th-century problem. Debate the algorithmic score. That is where the theory lives or dies.

  ---
