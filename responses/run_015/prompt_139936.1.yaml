answer: |-
  ### Brainstorming the Room

  Your audience is not a seminar; it is a machine that produces decisions. The Treasury economists and the Central Banker are the guardians of that machine. They do not care about moral truth; they care about *consistency*, *auditability*, and *efficiency*. If your argument implies that every ministry gets to pick their own discount rate based on their own moral intuition, they will reject it immediately as "appraisal gaming." Their pushback won't be philosophical; it will be procedural. They will argue that market rates are the only *disciplined* number available, whereas your "survivorship" or "uncertainty" adjustments look like fudge factors.

  The Philosopher and the Climate Scientist are your allies, but they are dangerous allies. The Philosopher will happily sacrifice the policy's viability for conceptual purity (e.g., raising the Non-Identity Problem). The Climate Scientist wants a result that justifies urgent action. You are the bridge. If you spend too much time on the moral philosophy, the Treasury team will tune out. If you spend too much time on the math, the Philosopher will find the gap in your axioms. Your risk is sounding like you are importing "forest time" into "fiscal time." You must frame your silviculture experience not as moral authority, but as empirical evidence of *uncertainty over long horizons*—you are the data point for the "mixture of exponentials" argument.

  ***

  ### Q&A Prep Sheet

  **Order:** Ranked by potential to derail the policy recommendation (Practical Damage > Theoretical Damage).

  #### 1. The Opportunity Cost of Capital (The Finance/Treasury Hammer)
  **Who:** Central Bank Finance / Treasury Lead
  **Phrasing:** "You're conflating the social discount rate with the financial return on capital. If the government invests in a sea wall at 1% when the market return is 4%, we are effectively destroying wealth. We are consuming capital that could have grown to make future generations richer. Isn't your 'moral' discount rate just a subsidy for inefficient projects?"
  **Reply (2 min):** "I am not arguing we ignore capital returns for *financial* assets. I am arguing that for *public goods* that cannot be traded or substituted—like a stable climate or a safe repository—market rates are irrelevant. You cannot arbitrage a sea wall. If the asset is non-substitutable, the opportunity cost is not the market rate, it is the loss of the asset. My proposal keeps market rates for investable capital but applies the survivorship/uncertainty rate for non-substitutable existential goods. We aren't destroying wealth; we are preserving the platform on which wealth is built."
  **Soft Spot:** If the sea wall *frees up* economic activity (e.g., protects a city), the Treasury team can argue it *is* an economic investment subject to market rates. You need to clarify when a project crosses from "economic" to "existential."

  #### 2. The Comparability Problem (The Treasury Procedural Block)
  **Who:** Treasury Economists
  **Phrasing:** "We use a unified discount schedule so we can compare a hospital in Cardiff to a rail link in Leeds. If you introduce a bespoke 'long-term' schedule for climate or nuclear, you break the appraisal system. How do we weigh a nuclear waste repository against a new school if they use different time metrics? You're creating incomparable silos."
  **Reply (2 min):** "I am not proposing bespoke rates per project, but per *horizon and asset class*. We already have different appraisal rules for financial vs. social projects. I am suggesting a 'long-tail' amendment to the Green Book: for horizons beyond 50 years involving non-substitutable goods, the rate declines according to uncertainty. You can still compare projects by running both schedules. The cost of consistency is not worth the error of using a 3.5% rate for a 10,000-year repository."
  **Soft Spot:** Administratively, this is a nightmare. They will worry about precedent. If climate gets it, why not biodiversity? Why not heritage? You need to define the "non-substitutable" criteria very tightly.

  #### 3. The "Money on the Table" Efficiency Argument
  **Who:** Central Bank Finance
  **Phrasing:** "Even if I accept your uncertainty argument, you're ignoring risk pricing. Markets price uncertainty. If you're unsure about future growth, you demand a *higher* premium, not lower. Why does uncertainty drive your rate down when standard finance says it should drive it up?"
  **Reply (2 min):** "That applies to *risk* (known probabilities), not *uncertainty* (unknown parameters). In finance, if I know the volatility, I price it. But here, we don't know the true rate. Weitzman showed that if you have a distribution of possible rates, the distant future is dominated by the lowest possible rate, not the average. It's not about risk premium; it's about the mathematics of compounding uncertainty. The 'money on the table' is actually the money we lose by over-discounting survival."
  **Soft Spot:** This is the technical core. If they know Weitzman better than you, they will challenge the parameters of your distribution. Be ready to cite the specific mechanism (mixture of exponentials).

  #### 4. The Operational Number (The Engineer's Frustration)
  **Who:** Geotechnical Engineer
  **Phrasing:** "I have a safety case due next month. I need a single number for the spreadsheet. 'A declining schedule based on epistemic uncertainty' doesn't plug into my model. Are you giving me a number or a seminar?"
  **Reply (2 min):** "I am giving you the number 1% to 2% for horizons beyond 100 years, derived from the lower bound of plausible growth rates adjusted for survivorship. The schedule is published in the Treasury's own declining rate guidance; I am arguing you should extend the tail, not truncate it. Use the 300-year rate from the standard table, but don't truncate the analysis at 100 years."
  **Soft Spot:** They want a constant $r$. If you give a schedule, they will complain. If you give a constant, you contradict your thesis. You must insist on the schedule but offer a "conservative estimate" for sensitivity analysis.

  #### 5. Current Poverty vs. Future Wealth (The Distributional Worry)
  **Who:** Environmental Economist
  **Phrasing:** "You assume future generations will be richer, so we discount. But if we get climate wrong, they might be poorer. If we invest heavily now, we tax the poor now to help the rich later. Isn't that regressive? Why should the current poor subsidize the future?"
  **Reply (2 min):** "That is exactly why we separate the 'growth' discount from the 'time' discount. If future growth is uncertain or threatened by climate damage, the growth discount drops. We aren't taxing the poor to help the rich; we are taxing the present to ensure the future isn't destitute. The 'survivorship' discount doesn't care about wealth; it cares about existence. We aren't betting on their wealth; we are betting on their chance to have any."
  **Soft Spot:** This relies on the assumption that adaptation investment actually works. If the money is wasted, you *did* hurt the current poor for nothing.

  #### 6. The "Survivorship" Semantic Game
  **Who:** Analytic Philosopher
  **Phrasing:** "You call it 'survivorship,' but mathematically it looks identical to a pure time preference rate. If you adjust for the probability of extinction, haven't you just reintroduced a positive time preference by the back door? Is this distinction substantive or just labeling?"
  **Reply (2 min):** "It is substantively different because it is empirical, not normative. A pure time preference says 'a life in 2100 is worth less than a life in 2024.' Survivorship says 'there is a chance there is no one in 2100.' One is prejudice; the other is actuarial. If we reduce extinction risk through policy, the discount rate changes. A moral time preference is fixed; an actuarial one is responsive to our actions."
  **Soft Spot:** If the probability of extinction is constant per year, it mathematically collapses into a constant discount rate. You need to argue that extinction risk is not constant (it changes with our policy).

  #### 7. Tipping Points and Non-Linearity
  **Who:** Climate Scientist
  **Phrasing:** "Even with a declining discount rate, standard cost-benefit analysis smooths over catastrophes. If there's a 5% chance of a tipping point that wipes out 50% of GDP, does your model capture that, or does the averaging still hide the tail risk?"
  **Reply (2 min):** "Standard CBA is indeed weak on fat tails. That's why the 'uncertainty' argument is crucial. When you acknowledge we don't know the rate, the lower bound dominates. But I agree: we need a separate 'catastrophe insurance' line item, not just discounting. My argument clears the ethical deck so we can stop debating the rate and start pricing the risk."
  **Soft Spot:** You might be conceding too much to CBA here. The Climate Scientist might want you to trash CBA entirely. Stand firm that CBA is the tool we have, so we must fix it.

  #### 8. The "Why Now?" Implementation Lag
  **Who:** Treasury Lead
  **Phrasing:** "Let's say you're right. Changing the Treasury discount rate takes years of consultation. What do we do with the projects in the pipeline *now*? Do we pause them? Retroactively adjust them?"
  **Reply (2 min):** "We apply the new schedule to new appraisals immediately and use sensitivity analysis for the pipeline. We don't need to stop the world to change the calculator. But we do need to signal that the old rate is deprecated for long-term assets, so investors don't lock in high-carbon infrastructure based on obsolete math."
  **Soft Spot:** Bureaucratic inertia is real. They will use "implementation lag" as an excuse to do nothing.

  ***

  ### Strategic Concessions (Say these early)

  1.  **Concede Market Discipline for Private Goods:** "I am not arguing that the market rate is wrong for private investment. If a project generates cash flow, discount it at the cost of capital. My argument applies *only* to public goods with no market substitute." (Disarms the Finance person).
  2.  **Concede Current Needs Matter:** "I am not arguing we should impoverish the present. If an investment reduces current consumption below a dignity threshold, it fails regardless of the future benefit. The discount rate is not a blank check." (Disarms the Environmental Economist).

  ### The Load-Bearing Reply
  **The "Mixture of Exponentials" Argument (Objection 3 & 1).**
  If you lose this, you lose the room. You must convince them that *uncertainty about the rate* mathematically necessitates a *declining effective rate*.
  *   **Why:** This is the only argument that moves the Treasury economists. It turns a moral plea into a mathematical correction.
  *   **How:** Use your forestry analogy here. "If I plant a tree that might grow at 1%, 3%, or 5%, and I don't know which, the value of the tree in 100 years isn't the average of the three outcomes. It's dominated by the 1% scenario because the 5% scenario is already realized or lost earlier. The long tail carries the weight."
  *   **Risk:** If they think you are misapplying Weitzman, you look like an amateur. Know the math cold.

  ### The One-Liners (For when time runs out)

  1.  **To the Engineer:** "Use the 300-year rate from the existing Treasury table, but don't truncate the analysis at 100 years. The math is already there; you're just stopping the sum too early."
  2.  **To the Finance Person:** "You can't arbitrage existence. If the asset is gone, the return on capital is zero."

  ### Tone Check: Avoiding the "Retired Biologist" Trap
  *   **Don't:** Say "In my experience with trees..." as a moral authority.
  *   **Do:** Say "In long-horizon systems, we observe that parameter uncertainty dominates mean estimates..."
  *   **Don't:** Lecture them on ethics. They know the Green Book.
  *   **Do:** Frame ethics as "parameter selection." You aren't changing the rules; you are correcting the inputs.
  *   **Watch out for:** The Philosopher. If they engage you on meta-ethics, pivot back to *decision theory*. "I'm interested in the decision rule, not the metaphysics."

  ### The Question You Hope Nobody Asks (The Non-Identity Problem)

  **The Question:** (From the Analytic Philosopher) "If we adopt your policy, we change the economic landscape, which changes who meets whom, which changes which children are conceived. The people living in 2100 will not exist if we *don't* adopt your policy. So how can you say they are 'better off'? You aren't benefiting them; you are creating them. Does your cost-benefit analysis compare the same people across worlds, or different people?"

  **How Bad Is It?**
  Theoretically: Devastating. It dissolves the "beneficiary" of your policy.
  Practically: Ignorable, *if* handled deftly. If you get bogged down here, you will look like you are engaging in navel-gazing while the sea rises.

  **The 2-Minute Reply:**
  "That is the Non-Identity Problem, and it is a profound philosophical challenge. However, for public policy, we must operate under a 'Same-People' assumption or a 'Rights-Based' constraint. We act *as if* the same population exists, because the alternative is paralysis. More importantly, even if the specific individuals differ, the *structure* of their lives matters. We are not just creating people; we are creating conditions. If we leave a radioactive waste site unmanaged, we violate the rights of whoever ends up there, regardless of whether their specific conception depended on our negligence. We compare states of the world, not just ledgers of utility for specific IDs."

  **Backup:** "If you wait for a perfect solution to Non-Identity, you will never build the sea wall. I am offering a decision rule for the world we have, not the ideal metaphysical one." (Use this only if they push harder).
