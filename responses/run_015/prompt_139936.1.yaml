prompt: |-
  You are a professional philosopher who also knows decision theory and has sat in a few government cost-benefit meetings — please think carefully about this one, and before you write anything spend a paragraph or two brainstorming what my particular audience actually cares about and where they'll push. Then give me the prep sheet.

  Context: I retired from forest ecology a few years back (long-rotation silviculture, mostly — the kind of work where you plant something your grandchild might harvest, so discount rates were never an abstraction for us) and since then I've been reading my way into philosophy, probably faster than I should. I've been asked to give the opening talk, 45 minutes plus half an hour of questions, to the long-term infrastructure and climate adaptation committee of a ministry. My thesis is this: there is no defensible positive pure rate of time preference. Discounting a benefit solely because it arrives later is a prejudice, and it has no more standing than discounting a benefit because it arrives somewhere else.

  But I don't want to just assert that, so I've tried to say what I think should replace it. Two moves.

  First: I want to split the thing people lump together. There is one discount on the future that I think is legitimate and is not a moral judgement at all, namely the chance that there will be nobody there to recieve the benefit — an actuarial term, like adjusting a treatment by the chance the patient dies first. I've been calling it the survivorship discount. Everything else that looks like time preference I want to reclassify: extinction and civilisational hazard goes in the first bucket; expected growth in future consumption, and opportunity cost of capital, goes in a second bucket that is empirical, contested, and definitely not something you read off a moral intuition.

  Second: that second bucket has a property people keep missing, and it's the one bit of my own field I'm confident about. If you do not know the future rate but you have a spread of plausible constant rates, then at long horizons the effective rate doesn't stay at the middle of the spread, it sinks toward the bottom of it — the slowest-decaying component carries almost all the weight, same reason the long-lived tail dominates in a mixture of exponentials. I've since found that economists have a version of this argument, but the people in the room won't have internalised it, and I think it's the single most load-bearing thing I have to say. It means a constant exponential is the wrong functional form for anything past a few decades, and my committee cares about a hundred years and a sea wall.

  The audience, as precisely as I can describe it: two Treasury economists who run the standard cost-benefit machinery with a declining schedule and who think market rates of return are the only disciplined input and that anything else is amateur hour; an environmental economist who is broadly on my side but is nervous about imposing real costs on people alive now for hypothetical people later; a finance person from the central bank who will say the real return on capital is what it is and that I'm leaving money on the table; an analytic philosopher who works on population ethics and does not suffer fools; a geotechnical engineer who is on the committee because of a nuclear waste repository and who wants a number to put in a spreadsheet, not a principle; and a climate scientist who is my ally and will ask about tipping points and irreversibility the moment I stop talking.

  What I want from you is the Q&A prep sheet: the eight or so objections I'll actually get from this room, ordered by how much damage they'd do, each phrased the way that particular person would phrase it and in their vocabulary, with a two-minute reply and an honest note on where my reply is soft. Tell me what I should concede up front before anyone asks, which single reply has to land for the whole thing to survive, and which two objections I need a one-line answer for because I'll be running out of clock. Flag anywhere I'm going to sound like a retired biologist wagging his finger at people who know more about this than I do, and tell me how not to.

  And include the question I'm hoping nobody asks. I have a guess what it is — it's the Parfit-style worry that a hundred-year policy changes which people exist, so there may be nobody later who is made better off by what we do and nothing for my cost-benefit comparison to compare. If that's the one, tell me how bad it actually is for me and what I can say in two minutes that isn't hand-waving. If you think something else is worse, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired forest ecologist (long-rotation silviculture), well-read in philosophy/decision theory, invited speaker.
      *   **Topic:** Critique of positive pure time preference (discounting future benefits solely because they are later). Proposal to split discounting into "survivorship" (probability of existence) and "economic/growth" (empirical, contested, hyperbolic at long horizons due to uncertainty).
      *   **Audience:** High-level government committee (Treasury economists, Environmental economist, Central Bank finance, Analytic philosopher, Geotechnical engineer, Climate scientist).
      *   **Task:** Create a Q&A prep sheet.
      *   **Requirements:**
          *   Brainstorm audience concerns first.
          *   8 objections ordered by damage potential.
          *   Phrased in specific audience vocabularies.
          *   2-minute replies + "soft spot" analysis.
          *   Identify concessions to make up front.
          *   Identify the "load-bearing" reply.
          *   Identify two "one-liner" replies for time pressure.
          *   Flag tone risks (biologist wagging finger).
          *   Address the "hope nobody asks" question (Non-Identity Problem/Parfit).

  2.  **Brainstorming Audience Concerns (The "Pre-Work"):**
      *   *Treasury Economists:* They care about consistency, comparability across projects, and market discipline. If I change the discount rate, I break their models. They fear "magic numbers" that justify pet projects. They will attack the "survivorship" distinction as semantic if it leads to the same mathematical result.
      *   *Central Bank/Finance:* They care about opportunity cost. Capital *could* be invested elsewhere. Ignoring market returns is inefficient. They will hit the "money on the table" argument hard.
      *   *Environmental Economist:* Sympathetic but worried about intergenerational equity vs. current poverty. If we invest too much in the future, do we starve the present?
      *   *Analytic Philosopher:* They will smell a rat in the moral reasoning. Is "survivorship" actually distinct from time preference? They will pounce on the Non-Identity Problem (Parfit).
      *   *Geotechnical Engineer:* They want a number. "Give me $r$." They don't care about the philosophy, just the input for the safety case.
      *   *Climate Scientist:* They want the math to support urgency. They worry about tipping points. They might feel I'm being too abstract.
      *   *Tone Risk:* The user is a "retired biologist." The economists are professionals. If I sound like I'm lecturing them on *their* field without respecting the constraints they operate under (budgets, legislation, comparability), I lose credibility. I need to sound like a collaborator offering a refinement, not a revolutionary burning the house down.

  3.  **Drafting the Objections (Iterative Process):**
      *   *Objection 1 (Finance/Treasury):* Opportunity Cost of Capital. This is the standard economic hammer. If $r_{market} > r_{social}$, we consume capital. High damage.
      *   *Objection 2 (Treasury/Operational):* Comparability/Consistency. If we change the rate for climate, what about hospitals? Breaks the unified appraisal system. High damage.
      *   *Objection 3 (Philosopher):* Non-Identity Problem. If policy changes who exists, do we harm anyone? This undermines the "benefit" concept. High theoretical damage.
      *   *Objection 4 (Engineer):* Operationalizability. "What number do I type?" If the answer is "it's a distribution," they panic. Medium damage but practical blocker.
      *   *Objection 5 (Treasury):* Uncertainty vs. Risk. Weitzman's declining discount rate is known, but is it *risk* or *uncertainty*? Market pricing handles risk better.
      *   *Objection 6 (Env Economist):* Current Poverty. Why sacrifice the poor now for the rich later? (Growth assumption challenge).
      *   *Objection 7 (Climate):* Tipping Points. Discounting might still hide catastrophic non-linearities even with low rates.
      *   *Objection 8 (Philosopher):* Is "Survivorship" just Time Preference in disguise? (Conceptual purity).

      *Refining Order:* The Finance/Treasury "Opportunity Cost" is the most dangerous because it attacks the economic efficiency core. The "Comparability" issue is the most practical blocker. The "Non-Identity" is the deepest philosophical hole. Let's order by *practical* damage to the committee's work.

  4.  **Developing Replies & Soft Spots:**
      *   *Opp Cost:* Distinguish social discount rate from financial return. Public goods aren't traded. *Soft spot:* If the project *displaces* private investment, the argument weakens.
      *   *Comparability:* Argue for a specific "long-term" schedule, not a blanket change. *Soft spot:* Administratively messy.
      *   *Non-Identity:* Shift to "same people" frame or rights-based. *Soft spot:* Philosophically messy, hard to sell to economists.
      *   *Engineer:* Give the "effective rate" from the mixture model. *Soft spot:* It's still a number derived from philosophy.

  5.  **Addressing Specific Constraints:**
      *   *Concessions:* Admit market rates matter for *financial* projects. Admit current poverty matters.
      *   *Load-bearing Reply:* The "Mixture of Exponentials" (Weitzman-style) argument. If this fails, the long-term rate stays high.
      *   *One-liners:* Need crisp answers for the Engineer and the Finance person.
      *   *Tone:* Avoid "In my forest..." anecdotes unless they illustrate the *math*. Speak "policy," not "ecology."
      *   *The "Hope Nobody Asks":* It is definitely Non-Identity (Parfit). It's bad because it dissolves the "beneficiary." Reply: Focus on "same-world" comparisons or rights of the *potential* population.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I capture the "survivorship" distinction correctly? Yes, treat it as probability of existence.
      *   *Check:* Is the "mixture of exponentials" clear? Need to ensure the reply explains *why* the rate declines without getting bogged down in calculus.
      *   *Check:* Tone check. Ensure I'm not telling the Treasury economists they are wrong about *markets*, but wrong about *public intergenerational goods*.
      *   *Check:* The "Non-Identity" reply needs to be robust. The "same people" assumption is standard in policy, even if philosophically shaky. Admit the limit.

  7.  **Final Polish:** Organize into the requested sections: Brainstorming, Prep Sheet (Objections 1-8), Strategic Concessions, Load-Bearing Reply, One-Liners, Tone Check, The "Forbidden" Question. (Proceed to generate output based on this structure).

  *(Self-Correction on the "Non-Identity" Question)*: The user asked me to assess how bad it is. It's theoretically devastating but practically ignorable in policy. I need to advise them to acknowledge the theoretical depth but bracket it for policy purposes.

  *(Self-Correction on Tone)*: The user is worried about sounding like a "retired biologist." I need to explicitly advise them to lean on the *decision theory* reading they've done, not the *trees*. Use the forest example only as an intuition pump for the *math* of long horizons, not as moral authority.

  8.  **Final Review against constraints:** 8 objections? Yes. Ordered by damage? Yes. Specific vocabularies? Yes. 2-min replies? Yes. Soft spots? Yes. Concessions? Yes. Load-bearing? Yes. One-liners? Yes. Tone check? Yes. Parfit question? Yes.

