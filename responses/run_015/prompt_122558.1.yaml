  Is just the freedom of the gaze
  To discipline the restless body
  Until I fit the curve of norm

  We live inside the average norm
  Producing what we call the soul
  A manageable, quiet body
  Reduced to data, just a number
  Caught in the loop of my own gaze
  Training myself how to confess

  But tonight I break the norm, leave the body
  Unmeasured by the soul or any number,
  Speaking without the gaze, refusing to confess.

  ***

  **Note on Form and Philosophy**
  I swapped "docile" for "body" to avoid syntactic strain; "docile bodies" remains the conceptual anchor. The sestina's recursive form mirrors the subjectification process: we willingly inhabit the constraint. The envoi attempts a *parrhesiastic* turn (late Foucault), risking truth over safety. However, this "escape" is contested; Foucault never claimed ethics exits power, only that we might relate to truth differently. The poem risks claiming a freedom Foucault might deem illusory, but it honors the ethical impulse to try.
