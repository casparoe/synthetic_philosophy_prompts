answer: |-
  This is a sophisticated methodological stance, effectively a form of **methodological formalism**. You are arguing that the evidential value of a thought experiment lies exclusively in its isomorphic mapping to a formal model, and that narrative texture is epistemic noise.

  You asked for straight talk on exposure. Here is the assessment. Your position is vulnerable, not because "stories matter," but because your distinction between *structure* and *flavour* is likely not theory-neutral, and because human cognition may not access "structure" without "flavour."

  Here are the defeaters, ranked from fatal to awkward, split by whether you should concede or dismiss them.

  ---

  ### 1. The Theory-Ladenness of "Structure" (Fatal)
  **Confidence:** High (90%)
  **Category:** Concede (requires major revision)

  This is the joint-carving failure you worried about. You assume there is an objective set of features that count as "structural" (causal topology, identity conditions) independent of the normative theory being tested. There isn't.

  *   **The Problem:** What counts as structural depends entirely on the theory you are testing.
      *   *Example:* In a trolley case, is the *intention* of the agent structural or flavour?
      *   *Utilitarianism:* Intention is flavour (only outcomes matter). Bleach it.
      *   *Deontology:* Intention is structure (the maxim matters). Bleaching it destroys the case.
      *   *Personal Identity:* Is "psychological connectedness" structural or narrative flavour? If you bleach the narrative of memory and character, do you have "identity" left, or just a causal graph?
  *   **The Defeater:** You cannot run the Bleach Test *prior* to settling the theory, because the theory tells you what counts as structure. If you run it to *test* the theory, you have to presuppose a classification of features that likely biases the result toward the theory that matches your classification.
  *   **Verdict:** If you claim "structure" is theory-neutral, this is fatal. If you concede "structure is theory-relative," the test loses its power to arbitrate between theories; it only checks for internal consistency within a theory.

  ### 2. The Cognitive Access Problem (Fatal)
  **Confidence:** High (85%)
  **Category:** Concede (limits scope)

  You assume that "formal structure" is cognitively accessible to human agents without narrative scaffolding. Cognitive science suggests otherwise. We do not have a direct intuition faculty for "causal topology." We have simulation heuristics that run on narrative.

  *   **The Problem:** Narrative isn't just decoration; it is the *interface* for the simulation. "Load-bearing flavour" isn't just about disambiguation (your Point One); it's about **activation**.
  *   **The Defeater:** A bleached case (e.g., "Agent A transfers resource X to Patient B") may fail to trigger the relevant cognitive modules (e.g., harm detection, reciprocity) that the concrete case ("Surgeon cuts Patient") triggers. If the verdict flips, it might not be because the concrete case was rhetorical pump-priming, but because the bleached case failed to engage the cognitive machinery required to make the judgment.
  *   **Verdict:** You must concede that bleaching can induce *false negatives* (valid intuitions lost due to lack of cognitive traction). This limits the test to a necessary condition (if it fails bleach, it's suspect) rather than a sufficient one (if it passes bleach, it's valid).

  ### 3. The "Dry Flavour" Bias (Serious)
  **Confidence:** Medium-High (75%)
  **Category:** Concede

  You worry (Point Two) that abstraction has its own artefacts. You are right. "Dryness" is not neutrality; it is a specific rhetorical register that signals "philosophical mode."

  *   **The Problem:** Abstract cases invite different errors than concrete ones. Concrete cases trigger emotional heuristics (risk: bias). Abstract cases trigger intellectualizing heuristics (risk: over-rationalization, detachment from lived norms).
  *   **The Defeater:** Bleach-invariance might just measure agreement between two *biased* systems (emotional vs. intellectual). Why privilege the intellectual bias as the "truth-tracking" one?
  *   **Verdict:** You need to argue why the "dry" intuition is the baseline. If you can't, the test is just checking for coherence between two distinct psychological modes, not filtering evidence.

  ### 4. Unfalsifiability / The "You Changed the Structure" Escape (Serious)
  **Confidence:** High (90%)
  **Category:** Concede (requires procedural fix)

  You identified this (Point Three). It is a genuine risk. If every time a verdict flips you claim "you altered the causal topology," the test is vacuous.

  *   **The Problem:** There is no independent metric for "same structure" other than the verdicts themselves or theoretical stipulation (see Defeater #1).
  *   **The Fix:** You need a **Pre-Commitment Protocol**. Before running the case, the theorist must specify which variables are structural and which are flavour. If bleaching a "flavour" variable flips the verdict, the theorist is forced to either:
      1.  Admit the case is weak.
      2.  Reclassify the variable as structural (costing theoretical simplicity).
  *   **Verdict:** Without this protocol, your position is methodologically toothless. With it, it becomes a constraint on theory construction rather than a test of cases.

  ### 5. Empirical Evidence on Framing (Awkward but Manageable)
  **Confidence:** Medium (60% on specific citations)
  **Category:** Mostly Dismiss (as you already know this)

  You asked about the empirical work (Point Five).
  *   **The Findings:**
      *   **Knobe Effect:** Side effects described as "harm" vs. "help" change intentionality ascriptions. (Fits your view: this is flavour/rhetoric affecting verdict).
      *   **Trolley vs. Footbridge:** "Up close and personal" switches neural processing (Greene).
      *   **Language:** Reading in a foreign language reduces emotional engagement and shifts utilitarian verdicts (Costa et al.).
  *   **Discrimination:** These findings support *your* claim that verdicts are malleable by non-structural features. They do **not** discriminate between your view and the Deflationary view (Cappelen), because Cappelen agrees intuitions are unreliable.
  *   **The Kicker:** The only finding that hurts you is if **structural descriptions also show framing effects**. If presenting the *same* decision matrix in different orders or fonts shifts verdicts, then "structure" is not a safe haven. There is some evidence for this (order effects in surveys). If structure is also malleable, bleaching doesn't save you.

  ### 6. Predictive Power vs. Rivals (Awkward)
  **Confidence:** Medium (65%)
  **Category:** Concede (differentiation needed)

  You asked (Point Four) what you predict that rivals don't.
  *   **Intuitionism (Williamson):** Predicts verdicts are evidence. You predict verdicts are *conditional* evidence (only if bleached).
  *   **Deflationism (Cappelen):** Predicts thought experiments are just arguments. You agree, but add that the "argument" is often obscured by flavour.
  *   **The Gap:** Your unique prediction is **Asymmetry**. You predict that *adding* flavour to a bleached case shouldn't change the verdict (if the theory is robust), but *removing* flavour from a concrete case *will* often change the verdict.
  *   **The Risk:** If adding flavour *also* changes verdicts (due to the "Dry Flavour" bias, Defeater #3), your asymmetry collapses.

  ---

  ### Summary of Exposure

  **Is the position muddled?**
  Not muddled, but **over-optimistic about the Structure/Flavour distinction**. You are treating "structure" as if it exists in the world waiting to be described, rather than as a theoretical construct imposed *on* the description.

  **What would move you most?**
  The **Theory-Ladenness** objection. If you cannot define "structure" without presupposing the moral theory you are testing, the Bleach Test cannot be used to *test* the theory. It becomes circular.
  *   *Example:* You bleach a Personal Identity case to "Causal Connection C." A Lockean says "That's structure." A Animalist says "You bleached the biological organism, which was the structure." Who decides?

  **What to dismiss?**
  Dismiss the idea that "narrative is inherently epistemic." You are right that narrative is often manipulation. Don't let critics wave hands about "the richness of human experience." Stick to the cognitive access argument (Defeater #2), which is the only serious defense of narrative.

  **Final Verdict:**
  Your position is a strong **heuristic for theory construction**, but a weak **arbiter of truth**.
  *   **Rank:** Serious Methodological Constraint (not a Truth Test).
  *   **Confidence:** 80%.

  **Recommendation:**
  Pivot. Don't claim bleaching isolates *evidence*. Claim it isolates *theoretical commitment*. If a theorist needs the gore to make you accept their conclusion, they are relying on your affective systems, not their causal model. That is a valid critique of *argumentative rigor*, even if it doesn't guarantee the bleached version is "true." Drop the claim that bleached cases are epistemically privileged; argue only that they are *diagnostically* superior for revealing what the theory actually says.
