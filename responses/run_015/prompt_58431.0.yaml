answer: |-
  This is a sharp observation, and you're right that it's a distinct cognitive pattern that doesn't quite fit into the standard buckets of "anthropomorphism" or "the intentional stance." It is particularly prevalent in rationalist-adjacent circles because everyone *knows* the mechanistic reality (transformers, loss functions, etc.), which makes the slide into agentic language more conspicuous when it happens.

  Here is the breakdown of the existing concepts, why they don't fully cover it, and a coined term you can use to pin it down.

  ### 1. The Existing Concepts (And Why They Miss the Mark)

  **Dennett's Intentional Stance**
  *   **The Concept:** Daniel Dennett argues that treating a system (human, animal, or machine) *as if* it has beliefs and desires is a valid predictive strategy, regardless of whether it "really" has them.
  *   **The Mismatch:** Dennett advocates for the intentional stance as a *consistent* tool for prediction. If the stance stops working (the system behaves unpredictably), you downgrade to the "design stance" or "physical stance." Your friends aren't downgrading because prediction fails; they are downgrading because *accountability* becomes uncomfortable. They use the intentional stance for praise and the physical stance for blame.

  **The Eliza Effect**
  *   **The Concept:** The tendency to assume computer behaviors imply human-like understanding or interiority.
  *   **The Mismatch:** This is a one-way error (over-attribution). It doesn't account for the *retraction*. Your roommates aren't just fooled; they are fluent in both frames and switch between them opportunistically.

  **The Moral Crumple Zone** (Cathy Elisha, 2019)
  *   **The Concept:** In human-AI interaction, when an automated system fails, the human overseer often absorbs the moral and legal blame ("The driver should have been paying attention"), while the AI gets a pass as a tool. Conversely, when it works, the AI gets credit for "smart" decisions.
  *   **The Mismatch:** This describes the *sociological outcome* (who gets blamed), not the *cognitive mechanism* (how people talk about the AI's ontology). Your observation is about the linguistic and ontological flip that *enables* the crumple zone.

  **Motivated Reasoning**
  *   **The Concept:** Processing information to reach a preferred conclusion.
  *   **The Mismatch:** Too broad. This applies to politics, diet, etc. It doesn't capture the specific oscillation between *mechanistic* and *agentic* ontologies regarding non-human entities.

  ### 2. The Core Mechanism

  The pattern you are seeing is a form of **ontological arbitrage**.

  People are extracting the social utility of agency (credit, blame, narrative coherence) when it is convenient, while retaining the safety of mechanism (no liability, no existential threat, no complex moral status) when it is not. It is a "best of both worlds" fallacy where the AI is treated as a **Person** when it succeeds and a **Toaster** when it fails.

  In rationalist terms, they are violating the conservation of expected evidence regarding agency. If you update toward "It has goals" upon seeing a successful merge, you must update toward "It has goals" (and therefore potentially dangerous goals) upon seeing a failure. They are updating their *ontology* based on the *valence* of the outcome, not the evidence of capability.

  ### 3. The Coined Term

  Since there isn't a standard term for this specific ontological flip-flop, here is a definition you can use in arguments.

  **Term:** **Motivated Agency Oscillation**
  **Colloquial:** **The Agency Toggle**

  **Definition:**
  > The cognitive habit of opportunistically switching between an *Intentional Stance* (attributing beliefs, goals, or knowledge) and a *Mechanistic Stance* (attributing behavior to code, math, or deterministic processes) regarding an AI system, where the choice of stance is determined by the social or emotional utility of the attribution (e.g., assigning blame vs. denying liability) rather than by consistent evidence of the system's capabilities.

  **Tight Boundary Cases:**

  *   **YES (Motivated Agency Oscillation):**
      *   *Scenario:* A user says, "The chatbot *lied* to me," (implying intent/belief) but when asked if the bot has goals, says, "No, it's just predicting tokens."
      *   *Scenario:* A developer says, "The model *optimized* for reward hacking," (agentic) when explaining a failure to safety teams, but says, "It's just a curve-fitting tool," (mechanistic) when arguing against regulation.
      *   *Why:* The ontology shifts to serve a rhetorical goal (blame vs. safety).

  *   **NO (Consistent Intentionalism):**
      *   *Scenario:* An AI rights activist who argues the model has beliefs when it succeeds *and* when it fails, and therefore deserves moral consideration.
      *   *Why:* The ontology is consistent, even if you disagree with the premise.

  *   **NO (Consistent Mechanism):**
      *   *Scenario:* A hardline engineer who says, "It didn't *choose* the direct flight, it matched a pattern," and "It didn't *hallucinate*, it sampled a low-probability token."
      *   *Why:* They refuse the intentional stance entirely, avoiding the oscillation.

  *   **NO (Metaphorical Shorthand):**
      *   *Scenario:* A researcher says, "The model *wants* to minimize loss," but immediately clarifies, "metaphorically speaking, via gradient descent."
      *   *Why:* There is no confusion or ontological claim; it is explicit shorthand for a mechanistic process.

  ### 4. How to Use This in Arguments

  When you catch your roommates doing this, you can call out the **Motivated Agency Oscillation** directly.

  *   **The Trap:** "You're toggling. If Claude 'knows' you hate layovers, it has a world model. If it has a world model, the hallucinated train isn't just 'math,' it's a model error. You can't claim it's a mind when it helps you and a calculator when it hurts you."
  *   **The Risk:** Point out that this oscillation is dangerous for alignment. If we only attribute agency when things go *right*, we will fail to recognize emergent goals when things go *wrong*.
  *   **The Rationalist Check:** "Are you using the intentional stance for prediction, or for comfort? If it's for prediction, stick to it when the loss function spikes."

  This framing moves the debate away from "Is AI alive?" (which is a quagmire) to "Are you being consistent with your ontology?" (which is a solvable epistemic standard).
