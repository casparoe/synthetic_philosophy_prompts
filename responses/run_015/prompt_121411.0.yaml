answer: |-
  **Project Title:** Diachronic Agency and the Normative Foundations of Expected Utility

  **Project Summary and Research Question**
  Standard coherence arguments for rational preference—Dutch book arguments, money-pump arguments, and representation theorems—are often treated as a unified family establishing that rational agents must maximize expected utility. This project challenges that unity. It investigates the hypothesis that coherence arguments divide into two distinct normative classes: those establishing orderability (completeness and transitivity) and those establishing the Independence axiom. The former rely on synchronic consistency among attitudes held at a single time. The latter, I argue, necessarily rely on diachronic norms of planning agency (e.g., sophistication or resoluteness) because they require a sequence of choices separated by the resolution of uncertainty.

  The central research question is: *Does the justification for the Independence axiom rest on substantive norms of diachronic agency that are irreducible to synchronic coherence?*

  For this hypothesis to hold, three conditions must be met: (1) Every valid money-pump argument for Independence must structurally require a decision tree where a chance event resolves between choice nodes, providing new information or changing the epistemic state; (2) Avoiding exploitation in these cases must require adopting a specific stance toward one's future choices (a planning norm) rather than merely ensuring consistency among current valuations; and (3) This planning norm cannot be derived from synchronic coherence constraints alone without presupposing the Reduction of Compound Lotteries axiom, which is itself substantive. The hypothesis is refuted if a money-pump for Independence can be constructed in a purely static setting without information resolution, or if the diachronic planning norm can be shown to be a logical consequence of synchronic consistency requirements.

  **Significance and Existing Positions**
  This question remains open because existing approaches obscure the structural difference between axioms. Proponents of the representation theorem view often treat the axioms as a package deal, assuming that if preferences satisfy the formal conditions, the normative work is done. This view misses the distinct justificatory burden of Independence compared to Transitivity. Conversely, skeptics who treat money-pump arguments as merely heuristic illustrations fail to see that for Independence, the pump may be the *only* non-circular justification available. If the pump for Independence relies on diachronic norms while the pump for Transitivity relies on synchronic norms, then Expected Utility Theory (EUT) is not supported by "coherence" alone, but by coherence plus a specific theory of temporal agency. Clarifying this distinction is vital for evaluating alternatives to EUT (such as rank-dependent utility), which often violate Independence while maintaining synchronic coherence.

  **Methodology and Timeline**
  This is a conceptual analysis project requiring no empirical data. The method involves reconstructing canonical arguments to isolate their structural dependencies.

  *Months 1–3: Taxonomy Construction.* I will formalize the distinction between "static pumps" (requiring only a set of simultaneous preferences) and "dynamic pumps" (requiring a decision tree with information sets). To ensure this is not merely a list of examples, I will define the necessary structural features of the choice architecture for each axiom. I will test whether Independence pumps collapse into static pumps if the Reduction of Compound Lotteries is assumed, thereby locating the source of the diachronic requirement.

  *Months 4–6: Analysis of Diachronic Norms.* I will analyze the specific planning norms required to block dynamic pumps. This involves distinguishing between *sophistication* (choosing now based on predicted future choices) and *resoluteness* (choosing now to bind future choices). I will evaluate whether these norms are independent of coherence. For instance, does being resolute violate synchronic consistency if preferences change upon information update?

  *Months 7–9: Counterfactual Testing and Objections.* I will attempt to construct a static money-pump for Independence to test the robustness of the taxonomy. I will also engage with the objection that diachronic norms reduce to synchronic norms if "plans" are treated as the objects of preference. I will determine if this move begs the question by presupposing the very structure EUT is meant to justify.

  *Months 10–12: Synthesis and Writing.* I will draft the dissertation chapter, integrating the taxonomy with the normative analysis. The goal is a definitive statement on whether EUT requires a theory of agency beyond coherence.

  **Possible Conclusions**
  1.  *Strong Separation:* Independence requires diachronic norms irreducible to synchronic coherence. EUT is therefore a theory of planning, not just preference.
  2.  *Reduction:* The diachronic norms required are logically equivalent to synchronic coherence constraints once the objects of choice are properly specified (e.g., as comprehensive plans).
  3.  *Hybrid:* Independence relies on diachronic norms, but these norms are pragmatically mandatory for any agent engaging in sequential choice, making the distinction practically moot though theoretically significant.

  The deciding consideration will be whether the "plan" can be evaluated for coherence at a single time without referencing the temporal sequence of execution. If the evaluation requires simulating the sequence, the norm is diachronic.

  **Conditions for Project Failure**
  I must state honestly where this project could fail. First, the taxonomy might not be exhaustive; there may be a third class of coherence arguments that blends synchronic and diachronic features in a way that renders the distinction unstable. Second, and more critically, the project fails if it turns out that the diachronic norm (e.g., dynamic consistency) is derivable from synchronic coherence alone. If one can show that a synchronically coherent agent *must* necessarily satisfy dynamic consistency without additional assumptions about agency, the hypothesis collapses. Finally, the project fails if the distinction proves to be merely terminological—i.e., if "diachronic norm" is just a label for "synchronic coherence applied to trees" without adding normative content.

  **Scope and Limitations**
  The primary risk is scope creep. Decision theory encompasses risk, ambiguity, and intertemporal choice. This project is strictly limited to risk and the Independence axiom in the context of classical Expected Utility. I will not address ambiguity aversion (e.g., Ellsberg) or hyperbolic discounting, except as contrasting cases. If the analysis of the Independence pump becomes too entangled with the Reduction of Compound Lotteries, I will prioritize the normative status of the pump over the technical details of lottery reduction, as the fellowship goal is to establish the philosophical upshot, not solve the technical formalism.

  **Contested Claims and Consensus Boundaries**
  It is essential to distinguish between settled structural results and contested normative claims in this framing.

  *Settled Structural Claims:* It is mathematically settled that representation theorems exist linking axioms to utility functions. It is settled that money-pump arguments can be constructed for violations of Transitivity and Independence. It is settled that dynamic choice problems can be modeled using decision trees with information sets.

  *Contested Normative Claims:* The following are genuinely contested among philosophers and decision theorists and will be treated as such:
  1.  **Exploitability as Irrationality:** Whether being subject to a money pump is *constitutive* of irrationality or merely evidence of it. Some argue that exploitability is a pragmatic defect, not a rational one.
  2.  **Dynamic Consistency:** Whether dynamic consistency (adhering to a plan made earlier) is a requirement of rationality. Some argue that preference change upon new information is rational, making resoluteness irrational.
  3.  **Reduction of Compound Lotteries:** Whether treating a two-stage lottery as equivalent to a one-stage lottery is a coherence constraint or a substantive psychological claim.
  4.  **Independence of Norms:** Whether norms of diachronic agency are independent of synchronic coherence norms. This is the core contestation of this project; the consensus is not established.
  5.  **Consequentialism in Sequential Choice:** Whether rational agents must evaluate choices solely by their outcomes (consequentialism) or if the history of the choice matters. This impacts whether the "path" taken in a money pump matters normatively.

  This proposal does not presuppose the consensus on these contested claims but rather investigates the implications of accepting or rejecting them for the foundation of Expected Utility Theory.
