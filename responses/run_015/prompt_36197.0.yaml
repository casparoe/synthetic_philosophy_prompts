  2.  **Deconstruct the Four Moves:**

      *   **Move 1 (Felix):** Honor is a placeholder, not an explanation. Saying "dueling ended because it became dishonorable" is circular. Real explanation needs external factors (interest, argument, structure).
          *   *Evaluation:* Felix has a point about circularity if "honor" is just defined as "what people do." But if honor is a specific social mechanism (status signaling), it's not merely a placeholder. However, his demand for an *external* cause is a standard causal requirement. He's partially right that "it became dishonorable" is descriptive unless we explain *why* it became dishonorable. But he's wrong to dismiss honor as *just* a synonym for norm change if honor involves specific signaling dynamics.
          *   *Verdict:* Felix is partially right about the risk of circularity, but wrong to dismiss the mechanism entirely as a placeholder.

      *   **Move 2 (Dora):** Honor has machinery. Practices signal status. Signals collapse when high-status people defect (critical mass). Predicts rapid collapse (signature). Interest-based explanations are gradual, so they can't explain rapid collapse.
          *   *Evaluation:* Dora identifies the specific mechanism (signaling/critical mass). This distinguishes honor from simple interest aggregation. The "rapid collapse" signature is a strong empirical prediction associated with tipping points in social norms. Interest-based changes *can* be rapid (e.g., technological disruption), but social norm shifts often look like cascades. She is right that the honor mechanism offers a specific causal pathway (signaling validity) distinct from pure interest.
          *   *Verdict:* Dora is stronger here. She specifies the mechanism rather than just labeling the outcome.

      *   **Move 3 (Felix):** Grants rapid collapse but says it relocates the mystery. Why the *first* defections? Honor is defined by the group, so it can't push someone out. First defector needs argument/interest. Honor explains spread, not origin.
          *   *Evaluation:* This is a strong philosophical point about endogenous vs. exogenous change. If the system is closed (honor defines honor), nothing changes inside without an external shock. He is right that the honor mechanism itself is a maintenance system; it resists change until broken. Something must break it. However, he might be underestimating internal contradictions within the honor code itself.
          *   *Verdict:* Felix is largely right here. A mechanism of stability needs an external perturbation to initiate change, unless there's an internal contradiction within the honor code itself (which he overlooks, but his point stands regarding the *start*).

      *   **Move 4 (Dora):** Bar is too high. All social explanations need triggers. Trigger and mechanism are different. Argument lies inert until status circumstances make it humiliating not to act. Clustering around renunciations vs. treatises.
          *   *Evaluation:* Dora is right that demanding the mechanism also be the trigger is a category error. Mechanisms explain *how*, triggers explain *why now*. She correctly distinguishes between the availability of arguments and the social uptake of them. The clustering around public renunciations supports the honor hypothesis over the pure argument hypothesis.
