answer: |-
  # The "What Do You Actually Think About Death?" Quiz

  **Instructions:** Below are nine concrete scenarios. For each, pick the answer that matches your immediate intuition. Don't overthink it, and don't worry about philosophical labels. At the end, tally your answers to see which philosophical profile matches your instincts.

  ***

  ### 1. The Bookends of Time
  Think about the time before you were born. You didn't exist. Now think about the time after you die. You won't exist. How do these two periods compare?
  *   **A.** They are basically the same. Neither is bad for me because "I" aren't there to experience either.
  *   **B.** The time after death is worse. I lose the life I currently have, whereas before birth I didn't have anything to lose.
  *   **C.** The time after death is worse, but only because I have specific desires and plans for the future that I don't have for the past.

  ### 2. The Painful Future
  Imagine you are diagnosed with a terminal illness. Doctors confirm that your remaining year of life will involve severe, unmanageable pain with no moments of joy or accomplishment. Is your impending death bad *for you*?
  *   **A.** No. Death is neutral. It simply ends the experience of pain.
  *   **B.** No, it's actually good for you. It prevents a net negative life.
  *   **C.** Yes, it is still a tragedy. Even a painful life has a narrative value or dignity that is cut short.

  ### 3. The Unfinished Symphony
  A brilliant composer dies suddenly at age 40. She has a masterpiece half-written in her head that she desperately wanted to complete. Why is this death bad (if you think it is)?
  *   **A.** It's not bad for *her*. It's sad for us who won't hear the music, but she doesn't exist to mind.
  *   **B.** It's bad because she wanted to write it and now she can't. Her desires are permanently frustrated.
  *   **C.** It's bad because her life's story is now incoherent. It's like a sentence stopped mid-thought; the shape of the life is ruined.

  ### 4. The Bus vs. The Diagnosis
  Compare two people. Person A is hit by a bus and dies instantly. Person B is told they have six months to live and spends that time saying goodbye and tying up loose ends. Whose death is worse *for them*?
  *   **A.** Person A's. They lost more good time they would have had.
  *   **B.** Person B's. Living with the knowledge of death is a harm in itself.
  *   **C.** Neither is bad for them personally. Once you're dead, you can't be worse off.

  ### 5. The Timing Puzzle
  Let's say death *is* bad for the person who dies. *When* does this badness happen to them?
  *   **A.** While they are dying or anticipating it. Once they are dead, nothing can be bad for them.
  *   **B.** After they are dead. They are worse off in the future than they would have been if they had lived.
  *   **C.** Never. "Badness" requires a subject to experience it. If they are gone, nothing is bad for them.

  ### 6. The Deep Freeze (Success)
  You are put into suspended animation for 200 years. You are successfully revived. During those 200 years, were you harmed by the time you lost?
  *   **A.** No. I skipped over it. As long as I wake up, the gap doesn't matter.
  *   **B.** Yes. I lost 200 years of potential life experiences, even if I didn't feel them passing.
  *   **C.** Only if I had plans specifically for those 200 years that got cancelled.

  ### 7. The Deep Freeze (Failure)
  Same scenario, but the machine fails. You are frozen for 200 years and never revived. Is this bad for you?
  *   **A.** Yes, massively. You were deprived of two centuries of life.
  *   **B.** No. You are in the same state as someone who died naturally today. The failed revival doesn't make you worse off than death normally does.
  *   **C.** Yes, because your specific desire to wake up in the future was violated.

  ### 8. The Happy Fool
  A person dies young. They were always happy, but only because they were ignorant of the truth (e.g., their friends secretly hated them). Is their death bad?
  *   **A.** Yes. They lost out on objective goods (truth, real friendship) they would have had.
  *   **B.** No. They felt happy, and that's all that matters. Their death isn't worse than their life was.
  *   **C.** It depends on whether they *wanted* to know the truth. If they didn't care, the death isn't bad.

  ### 9. The Anonymous Stranger
  A person dies alone on a desert island. No one knows them, no one misses them, and they had no unfinished projects. Is their death bad?
  *   **A.** Yes. They lost the good of their own future experiences.
  *   **B.** No. If no one cares and they had no plans, nothing of value was lost.
  *   **C.** No. Death is never bad for the one who dies, regardless of their social connections.

  ***

  # Scoring Key & Interpretation

  Tally which letter you chose most often. Be honest: if you split evenly between two letters, you might hold a hybrid view (which is philosophically respectable!).

  ### Mostly C's: The Strict Epicurean
  **View:** Death is never bad for the one who dies.
  **The Gist:** You align with Epicurus and Lucretius. You believe that "badness" requires a subject to experience it. Since death removes the subject, it removes the possibility of harm. You likely see the time before birth and after death as symmetrical (Q1).
  **The Challenge:** You have to explain why we instinctively fear death or mourn others if it isn't actually bad for them. You also need to distinguish your view from simple apathy.
  **Note:** If you chose **C** on Q3 (Desire) but **C** on Q5 (Timing), you might be a **Desire-Theorist who agrees with the Epicurean conclusion**. You think death isn't bad because there is no subject to have frustrated desires, whereas the Epicurean thinks it isn't bad because there is no subject to feel pain. The conclusion is the same; the reasoning differs.

  ### Mostly A's: The Deprivationist (The "Lost Future" View)
  **View:** Death is bad because it deprives you of the good life you would have had.
  **The Gist:** This is the standard contemporary view (think Thomas Nagel). You believe death is a comparative harm: you are worse off dead than you would have been if alive. You likely think the anonymous stranger's death is still bad (Q9) because objective goods were lost.
  **The Stumble:** Check Q5 (Timing). If you chose **B**, you are a "classic" Deprivationist who accepts that badness can occur when the subject doesn't exist. If you chose **A**, you are trying to solve the "timing problem" by locating the harm in the anticipation or dying process. Philosophers argue endlessly about whether your position on Q5 is consistent with your position on Q1.

  ### Mostly B's: The Narrative or Desire Satisfactionist
  **View:** Death is bad because it frustrates plans or breaks the story of a life.
  **The Gist:** You focus on the *shape* of a life or the *wants* of the person.
  *   **If you leaned Narrative:** You likely chose **C** on Q3 (The Unfinished Symphony). You see a life as a story that needs coherence. A death is bad if it makes the life story unintelligible or incomplete, even if the person wasn't suffering.
  *   **If you leaned Desire:** You likely chose **B** on Q3 and **C** on Q7 (Deep Freeze Failure). For you, badness is about the violation of what the person cared about.
  **The Challenge:** You have to explain why death is bad for someone who *wanted* to die (Q2), or for an infant who has no narrative or complex desires yet.

  ### Mixed A's and B's (Specifically on Q1): The Asymmetry Theorist
  **View:** Prenatal and posthumous nonexistence are different.
  **The Gist:** You rejected the symmetry in Q1. You think the future matters more than the past.
  *   **If you chose Q1-B:** You think the asymmetry is about *possession*. You own your future life; you don't own the past.
  *   **If you chose Q1-C:** You are a **Desire-Based Asymmetrist**. You think the difference lies in the direction of our cares. We desire future goods; we don't desire past goods. This saves the intuition that death is bad without requiring the "timing" metaphysics of the Deprivationist.

  ***

  # A Note on Limitations (For the Philosophically Minded)

  This quiz maps intuitions, not rigorous arguments. Two specific overlaps are hard to distinguish via multiple choice:

  1.  **The Epicurean / Desire Overlap:** A Strict Epicurean and a Desire-Theorist might both answer that death is "not bad" (Option A/C in several questions). However, the Epicurean says this because *no subject exists*, while the Desire-Theorist might say it because *no desire is frustrated* (perhaps the person didn't desire to live). The quiz flags this in the "Mostly C" section, but in practice, these two require a conversation to separate.
  2.  **Deprivationism vs. Narrative:** Both agree death is usually bad. The distinction lies in *why*. Deprivationists count "goods" (pleasure, achievement); Narrativists count "coherence." If you found yourself toggling between A and B on the Artist question (Q3), you likely straddle this line. Many modern philosophers argue that a complete theory needs elements of both.

  **Did you get a result that felt wrong?** That's common. Often, our intuitions shift depending on whether we are thinking about our own death (where Epicureanism is comforting) or the death of a loved one (where Deprivationism feels more true). That tension is where the real philosophy begins.
