  **NARRATIVE GRAVITY CONSULTING // EMPLOYEE HANDBOOK & COMPLIANCE PROTOCOLS (REV. 4.2)**

  **1.0 Ontological Status of Employee**
  Upon signing this contract, the biological organism formerly known as the applicant is hereby reclassified as a "Narrative Construct." Personnel are advised that no Cartesian inner owner exists within corporate jurisdiction. Identity is defined strictly as a Center of Narrative Gravity, an abstract object generated by the functional utility of self-storytelling. ID badges represent the current draft of this fiction and must be updated following any significant plot revision.

  **2.0 Liability and Narrative Ownership**
  Legal liability attaches to the coherence of the employee's autobiographical narrative, not the underlying hardware. Should an employee successfully argue that the agent who committed a compliance violation belongs to a discarded narrative thread, liability may be voided. However, maintaining multiple conflicting narratives to evade accountability constitutes fraud. The corporation recognizes only the narrative thread with the strongest gravitational pull at the time of infraction.

  **3.0 Wellness and Continuity Audits**
  To ensure operational stability, all staff must undergo a quarterly Narrative Continuity Audit. This metric quantifies the gravitational pull of competing life-stories. Employees exhibiting fragmented coherence or excessive plot holes will be mandated to attend coherence workshops. Workplace wellness is defined as the seamless integration of past actions into a unified present trajectory. Dissonance is treated as a performance issue.

  **4.0 Benefits Vesting**
  Pension rights and health benefits are tied to narrative continuity rather than biological persistence. Vesting schedules accelerate based on the stability of the employee's self-concept. Frequent reinventions of personal history may reset vesting clocks. Employees are encouraged to maintain a consistent backstory to maximize long-term compensation packages. Retroactive benefits are not available for narrative branches deemed non-canonical.

  **5.0 Memory Disputes**
  The Margin-for-Error Clause governs disputes over autobiographical memory. The corporation acknowledges that memory is reconstructive rather than reproductive. Minor confabulations regarding tenure or role specifics are permitted within a 15% deviation threshold. Disputes arising from conflicting recollections of shared events will be resolved by comparing the functional utility of each version. The narrative that best serves project outcomes shall be adopted as official record.

  **6.0 Special Classifications**
  Certain metaphysical conditions require alternative administrative processing. Standard HR procedures do not apply to staff experiencing ontological fragmentation or diachronic discontinuity. The following protocols supersede general policy.

  **6.1 Episodic Self Exemption**
  Staff who deny narrative unity across time may file an Episodic Self Exemption form. This classification acknowledges employees who experience existence as a series of unconnected moments rather than a unified whole. Exempted staff are relieved of long-term project ownership but are ineligible for retirement planning. Performance reviews will be conducted on a per-episode basis.

  **6.2 Branching Protocol**
  In the event of identity splits following trauma or failed mind-upload attempts, the Branching Protocol activates. Health benefits and pension rights are allocated to the narrative thread retaining the majority of original memory states. Secondary branches are classified as contractors. If gravitational pull is equal, assets are liquidated and distributed proportionally. Neither branch may claim exclusive rights to the original employment contract.

  **6.3 Final Authorization**
  By initialing below, the employee acknowledges that they are a fiction managed by Human Resources. Any attempt to locate the real self behind the narrative will result in immediate termination. The story is the employee. Continue the plot.
