answer: |-
  You have put your finger on the central tension in modern longtermist effective altruism. You are not imagining it, and your group is not doing the math wrong; you are encountering a structural feature of Expected Value (EV) reasoning when applied to unbounded domains with subjective priors.

  Here is the breakdown of what this is, why the existing labels feel slightly off, and a proposed term for the specific mechanic you're seeing.

  ### 1. Is there an established concept?

  Yes and no. You are describing a specific *mechanism* that drives a well-known *problem*.

  *   **Pascal's Mugging:** This is the closest established term. Classically, it involves an external agent saying, "Give me $5 or I'll use my magic powers to simulate 3^^^3 lives." You correctly feel this doesn't fit perfectly because there is no mugger. In your case, the reviewers are mugging themselves. This is sometimes called **"Internalized Pascal's Mugging."**
  *   **Fanaticism:** In decision theory (specifically in recent work by William MacAskill and others), "fanaticism" is the technical term for the conclusion that any non-zero probability of an infinite (or astronomically large) good dominates any finite certain good. You are describing the *estimation process* that leads to fanaticism, not the conclusion itself.
  *   **Cluelessness:** As you noted, this is about not knowing the *sign* of indirect effects (e.g., does saving a life cause overpopulation?). Your problem is about the *magnitude* of direct effects.
  *   **Unbounded Priors:** This is the technical decision-theory root. If your probability distribution for "potential impact" has no upper bound (i.e., there is no number so large you assign it zero probability), then the Expected Value integral diverges. The "balloon" exists because your model allows the payoff to be infinite.

  **Verdict:** It is one phenomenon (divergent expectations under uncertainty) manifesting as three things: a mathematical property (unbounded priors), a psychological bias (motivated numeracy), and a strategic incentive (the vagueness dividend).

  ### 2. The "Balloon-Squeezing" Mechanism

  You asked if the balloon-squeezing is a real structural feature or an artifact of your spreadsheets. **It is both.**

  Mathematically, if you allow the payoff ($V$) to be a function of the uncertainty, EV maximization *rewards* ignorance.
  $$EV = P(\text{success}) \times V(\text{impact})$$
  In your well-understood case, $P$ is high, but $V$ is constrained by data. In the speculative case, $P$ is low. If $V$ is fixed (e.g., "max 1 billion lives"), the EV drops. But if $V$ is *unconstrained*, the human brain naturally compensates. When you push $P$ down ("Okay, it's probably not 1 in 100"), the advocate pushes $V$ up ("Well, if it works, it's not just 1 billion, it's 10^12").

  This happens because **vagueness removes the friction that usually limits value estimates.** A concrete intervention (bednets) has a hard ceiling (number of people at risk). A speculative intervention (foundational research) has a theoretical ceiling (number of possible future beings), which is physically bounded but cognitively elastic.

  ### 3. Coining the Term: "The Vagueness Dividend"

  Since you need a label for your meeting notes that captures the *incentive* structure you're seeing, I propose you call this **The Vagueness Dividend.**

  **Definition:** The Vagueness Dividend is the increase in Estimated Expected Value gained by removing empirical constraints on the magnitude of an outcome, allowing the payoff estimate to expand inversely to the probability estimate.

  **How to spot it:**
  1.  **Inverse Coupling:** As the group assigns a lower probability to the causal chain holding, the proponents increase the magnitude of the payoff to compensate.
  2.  **Constraint Resistance:** Attempts to cap the payoff (e.g., "What is the physical maximum number of beings?") are met with resistance or moved goalposts ("We're influencing the *quality* of those lives, not just the number").
  3.  **Selection Bias:** The funding recommendation systematically favors the proposal with the least available data, because data imposes constraints.

  **Boundary Cases:**

  *   **Does it bite with bounded payoffs?**
      *   *Yes, but less.* If you physically cap the payoff (e.g., "There are only $10^{50}$ possible human-hours in the future"), the balloon cannot expand infinitely. However, if the probability is low enough (1 in $10^{60}$), the EV can still dominate. The Dividend shrinks but doesn't vanish unless the cap is *low* (e.g., "only people alive today count").
  *   **Does it work symmetrically on the downside?**
      *   *Yes.* This is the **S-Risk (Suffering Risk)** parallel. A tiny chance of accidentally creating a dystopia with $10^{12}$ suffering beings creates a massive *negative* EV. If your group takes the Vagueness Dividend seriously on the upside, you must accept it on the downside. This often leads to **EV Cancellation**, where the huge potential upside is canceled by the huge potential downside, leaving you paralyzed.
  *   **What if *both* options are murky?**
      *   The Dividend cancels out. If Option A and Option B both rely on unbounded speculative chains, you cannot compare them using EV. The math returns "Error: Insufficient Constraints." You are forced to revert to heuristics (e.g., "which causal story feels more coherent?"), which admits that EV is no longer doing the work.

  ### 4. Why This Happens (The "Three Stuck Together")

  You asked if this is one phenomenon or three. It is one structural flaw exploited by two psychological biases.

  1.  **The Structural Flaw:** **Unbounded Utility.** Your EV framework allows for numbers larger than your confidence can handle. If $V$ can be $10^{20}$, then a probability of $10^{-15}$ still yields a massive EV.
  2.  **Psychological Bias 1:** **Motivated Numeracy.** Your reviewers want to do good. When the math says "no," they unconsciously adjust the inputs to make the math say "yes." The Vagueness Dividend is the loophole they exploit.
  3.  **Psychological Bias 2:** **Scope Insensitivity (Reverse).** Usually, humans ignore scope (we value saving 2,000 birds same as 200,000). Here, you have *Reverse Scope Insensitivity*: you are hypersensitive to the *potential* scope because the EV formula demands it, even if your intuition can't grasp it.

  ### 5. Practical Fixes for Your Group

  Since you can't read a textbook between shifts, here are three spreadsheet fixes to pop the balloon:

  1.  **The "Physics Cap":** Before discussing probability, agree on a hard maximum for $V$. (e.g., "The maximum number of future humans is $X$ based on energy constraints.") If the proposal requires exceeding this to look good, it is disqualified. This removes the "balloon" room.
  2.  **The "Vagueness Discount":** Apply a penalty multiplier to $EV$ based on the quality of evidence.
      *   RCT/Strong Data: 1.0x
      *   Observational Data: 0.5x
      *   Theoretical Argument: 0.1x
      *   Speculative Chain: 0.01x
      *   *Why:* This formally penalizes the Vagueness Dividend. It says "Being speculative is costly."
  3.  **The "Outside View" Check:** Instead of asking "What is the probability this specific project works?", ask "What percentage of speculative research projects in this field have historically changed policy?" Use that base rate for $P$, and do not allow it to be overridden by the specific causal story.

  ### Summary for your Meeting Notes

  *   **Phenomenon:** **The Vagueness Dividend** (a specific form of Internalized Pascal's Mugging).
  *   **Mechanism:** Uncertainty in probability is compensated by inflation in magnitude, keeping EV artificially high.
  *   **Diagnosis:** If a proposal's EV *increases* as our confidence in its mechanism *decreases*, you are collecting the Dividend.
  *   **Fix:** Cap the maximum payoff physically, or apply an "Uncertainty Discount" to the final EV score.

  You are not doing "amateur hour" work; you are running into the same wall that professional longtermist researchers hit. The difference is they have built more complex spreadsheets to hide the balloon. You've just noticed it inflating.
