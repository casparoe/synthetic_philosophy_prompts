answer: |-
  This is a sophisticated puzzle in democratic theory that hinges on the definition of "authorization" and the structural equivalence of constitutional powers. Your intuition is correct: the argument's weak point is indeed the equivalence claim in **(6)**, but your worry about the "anticipatory authorization" theory collapsing is also well-founded.

  To preserve (1) (authorization matters) and (4) (monarchies have unauthorized pockets) without accepting the absurd conclusion (7), you should **reject (6)**.

  However, to do so successfully, you must refine the theory of authorization beyond simple "constitutional enactment." Here is the analysis of why rejecting (6) is superior to rejecting (5), how to save the "anticipatory authorization" argument from collapse, and what this implies for the normative significance of dormancy.

  ### 1. Why Rejecting (5) is Costlier than Rejecting (6)

  If you reject **(5)** ("If democratic legitimacy requires the complete absence of any such structural pocket, then these monarchies are illegitimate"), you are effectively conceding that democratic legitimacy is compatible with *some* structurally unauthorized pockets of power.

  *   **The Cost:** This weakens Premise (1). If legitimacy requires traceability to popular authorization, but we tolerate pockets where traceability is broken, (1) becomes a *prima facie* principle rather than a necessary condition. This opens the door to "illiberal democracy" defenses: if we tolerate a monarch's reserve power, why not tolerate a military veto or a judicial override that lacks democratic traceability? It makes the boundary of "democracy" porous.
  *   **The Benefit:** It saves modern democracies from illegitimacy without needing to distinguish between republican and monarchical powers.

  If you reject **(6)** ("Democratic republics also contain... structurally identical pockets of unauthorized coercive power"), you maintain a strict standard for (1) and (5). You argue that monarchies *are* illegitimate by strict democratic standards, but republics are *not*, because the pockets are **not** structurally identical.

  *   **The Cost:** You must do the hard work of distinguishing the two types of powers.
  *   **The Benefit:** You preserve the integrity of democratic theory. You can maintain that heredity is inherently incompatible with democratic authorization, regardless of constitutional ratification.

  **Recommendation:** Reject **(6)**. It is philosophically more robust to argue that republican emergency powers are *authorized* (and thus not "unauthorized pockets") than to argue that democratic legitimacy tolerates *unauthorized* power.

  ### 2. Saving "Anticipatory Authorization" from Collapse

  Your worry is that both monarchical and republican powers are defined by a constitution enacted through democratic procedures, so the distinction collapses. If the people ratified the constitution that created the King, isn't the King anticipatorily authorized?

  **No.** You must distinguish between **Authorization of the Framework** and **Authorization of the Agent.**

  Democratic legitimacy requires a continuous chain of principal-agent relationships.
  1.  **The Principal:** The People.
  2.  **The Framework:** The Constitution (ratified by the People).
  3.  **The Agent:** The Officeholder (selected by a mechanism defined in the Framework).

  In a **Republic**:
  *   The Constitution authorizes the *Office* of the President.
  *   The Election authorizes *Person X* to occupy that Office.
  *   Emergency powers belong to the Office.
  *   **Result:** When Person X exercises emergency power, they do so as an authorized Agent of the People. The chain is unbroken: People → Constitution → Election → Agent → Power.

  In a **Constitutional Monarchy**:
  *   The Constitution authorizes the *Office* of the Monarch.
  *   **Heredity** determines *Person Y* occupies that Office.
  *   **The Break:** Heredity is not a mechanism of popular authorization; it is a mechanism of biological accident. The People did not authorize Person Y, nor did they authorize the mechanism (birth) that selected Person Y.
  *   **Result:** When Person Y holds reserve power, they hold it as a **Trustee** of the state, not an **Agent** of the people. The chain is broken: People → Constitution → [Biology] → Agent → Power.

  **Why this doesn't collapse:**
  A democratic constitution can theoretically authorize a non-democratic selection method (e.g., "The People hereby establish a Dictator"). That the *framework* is democratically ratified does not make the *content* of the framework democratic. Democratic legitimacy requires that the *method of selecting power-wielders* be democratic, not just the method of ratifying the rulebook.

  Therefore, republican emergency powers are **authorized discretion** (vested in an elected agent), whereas monarchical reserve powers are **unauthorized discretion** (vested in a hereditary trustee). They are not "structurally identical" regarding democratic traceability.

  ### 3. The Normative Significance of Dormancy

  You asked: *If I keep (1) and reject (5), do I commit myself to saying that hereditary office can be compatible with democracy so long as its powers are dormant?*

  If you follow my advice and **reject (6)** instead, you avoid this specific dilemma. You can argue that hereditary office is *incompatible* with strict democratic legitimacy (preserving 1 and 5), regardless of dormancy, because the *right to rule* is not traceable to the people.

  However, if you are forced to address the **Dormancy** question (perhaps to explain why we tolerate monarchies in practice), you must distinguish between **Legal Authority** and **Discretionary Power**.

  *   **Scenario A: Pure Formalism (True Dormancy).**
      In the UK and Japan, convention dictates the Monarch *must* act on ministerial advice. They have no legal *discretion*. The appointment of the Prime Minister is a clerical act, not a decision.
      *   *Normative View:* If there is no discretion, there is no "coercive authority" in a political sense. It is administrative formalism. The *coercion* traces back to the Ministers (who are elected). The Monarch is a human stamp. In this case, (4) is weakened: the pocket exists legally, but not politically.

  *   **Scenario B: Reserve Discretion (Potential Dormancy).**
      If the Monarch retains the *legal right* to refuse assent or dismiss a government (even if they haven't since 1708), they hold a "nuclear button."
      *   *Normative View:* This violates (1). Even if dormant, the *capacity* for unilateral coercion exists outside the democratic chain. A democratic republic's emergency powers are usually checked (e.g., legislative ratification of martial law within 30 days). A Monarch's reserve power is often a unilateral veto.
      *   *Conclusion:* Dormancy via **convention** is insufficient for democratic legitimacy because conventions are fragile and unenforceable. Dormancy via **legal removal of discretion** is required.

  ### 4. Summary of the Solution

  To resolve your study-group argument while preserving your core commitments:

  1.  **Reject Premise (6).** Argue that republican emergency powers and monarchical reserve powers are **not structurally identical**.
      *   *Reason:* Republican powers are vested in **authorized agents** (elected officials). Monarchical powers are vested in **unauthorized trustees** (hereditary successors).
  2.  **Refine "Anticipatory Authorization."**
      *   Argue that democratic ratification of a constitution does not authorize non-democratic selection methods within that constitution. The *selection mechanism* must also be democratic to maintain the chain of authorization.
  3.  **Address Dormancy.**
      *   Argue that dormancy via **convention** does not cure the democratic deficit. As long as the hereditary officeholder retains *legal discretion* (even if unused), Premise (4) holds, and the monarchy remains distinct from a republic.
      *   If the power is purely formal (no discretion), then it is not "coercive authority," and Premise (4) might need nuance, but the hereditary *status* of the head of state still violates the spirit of (1) regarding equal opportunity for office.

  **The Cost:**
  By rejecting (6), you commit yourself to the view that **constitutional monarchies are, strictly speaking, democratically illegitimate**, even if they function democratically in practice. You must accept that the UK, Sweden, and Japan possess a "democratic deficit" at the head of state that France or Germany do not. This is a defensible, principled position that avoids the absurdity of declaring republics illegitimate while maintaining a robust theory of popular authorization.
