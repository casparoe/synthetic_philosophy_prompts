      *   *Variant A:* They took it for recreation (Tomas-adjacent).
      *   *Variant B:* They took it for life-saving treatment (Marta-adjacent).
      *   *Variant C (The Wedge):* They took it for a minor ailment, known risk of severe side effect is 1%. They turn out to be in the 1% due to a genetic marker unknown at the time.
      *   *Why this works:* It isolates the "gamble" from the "necessity" and the "hidden trait."

  7.  **Addressing the "Gamble Description" (Framing):**
      *   User noted: "painting-with-elevated-solvent-risk" vs. "small shot at a mild reversible condition."
      *   This is the **Description Problem** in moral philosophy (Individuation of actions/outcomes).
      *   If the gamble is "Will I get sick?", she lost.
      *   If the gamble is "Will I get *this* sick?", she lost a different bet.
      *   *Advice:* Acknowledge this matters. If you define the risk broadly, she loses (Dev). If you define it specifically, she wins (Marta). The Board needs to pick *which description counts*.

  8.  **Settled vs. Live Fights (Philosophy Check):**
      *   *Settled:* "Brute luck" vs. "Option luck" (Dworkin). Most agree pure brute luck (Marta) is covered. Pure option luck (Sam/Dev) is often denied in mutual aid contexts to prevent moral hazard.
      *   *Live Fight:* "Epistemic Luck." When you take a risk without knowing the *true* odds (Marisol). Is that option luck or brute luck? Philosophers disagree. Some say if you consented to the *process*, you own the *outcome*. Others say consent requires accurate information.
