          *   *Commitment:* The fund insures against bad luck in *outcome*, not just bad luck in *circumstance*.
      *   *Principle C (The "Ines Compromise" / Mitigation View):* Pay only for the part caused by the unchosen factor.
          *   *Fits:* Ines (Paid difference).
