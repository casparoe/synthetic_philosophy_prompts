      2.  **The "Specific Vulnerability" Principle:** If the severity is driven by a hidden, unchosen biological trait, it counts as misfortune (Marta/Marisol).
      3.  **The "Economic Coercion" Mitigation:** Does financial necessity negate "choice"? (Grace/Sam/Marisol).

