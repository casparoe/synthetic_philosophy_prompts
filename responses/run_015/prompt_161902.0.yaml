      *   **The Core Tension:** Is this a "chosen risk" (like Dev/Sam) or an "unchosen misfortune" (like Marta/Priya/Yusuf)? It's a hybrid: Chosen activity + Unchosen vulnerability + Unknown specific risk profile.

