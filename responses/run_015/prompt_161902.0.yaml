      *   *Better Analog:* **Grace.** Grace chose to walk (mitigation/economy), but the *cause* was the drunk driver. Marisol chose to paint (economy), but the *cause* of the *severity* was the enzyme.
      *   *Selection:* **Yusuf** is the strongest workplace analog, but **Dev** is the strongest health analog. I will highlight the tension between them.

  6.  **Developing the "Further Case" (The Wedge):**
      *   Need a case that separates "Known Hazard" from "Idiosyncratic Susceptibility."
