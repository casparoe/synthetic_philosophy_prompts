      *Wait, looking closer at (b):* "if each pair of factors is only slightly dependent, the product is only slightly wrong."
      *   Mathematically: If $P(A \cap B) = P(A)P(B)(1+\epsilon)$, then for $n$ factors, the error term is roughly $(1+\epsilon)^n$. For large $n$, this is not "slightly wrong."
      *   The student says "total error is roughly the sum". This is linear thinking on a multiplicative process. That's a fundamental misunderstanding of Fermi estimates.
