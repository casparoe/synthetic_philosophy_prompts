      *   *Key Critique Points:*
          1.  **Independence Definition:** Clear and correct.
          2.  **Causal vs. Probabilistic:** Excellent distinction (common causes).
          3.  **Error Accumulation (The Big Flaw):** Small dependencies *compound*. They don't just sum. In a long chain, even slight positive correlation drastically changes the tail probability.
          4.  **Cancellation Assumption:** Unjustified optimism. In Fermi/Drake contexts, factors are usually positively correlated (habitability), leading to systematic underestimation, not unbiased noise.
          5.  **Chain Rule:** Correct application for Part (c).

  6.  **Refining the Feedback for a Novelist Marker:**
      *   The user is a novelist, not a statistician. I need to explain *why* the student is wrong on part (b) in clear terms so the marker understands the feedback they are signing off on.
