      Make sure to explicitly flag the "Error Cancellation" point as the main deduction. That's the "evidence" failure.

      *Final check on Part (b) logic:* The student argues errors cancel because we have "no reason to expect either direction." In the context of the Drake Equation (terrestrial planet -> life -> intelligence -> signal), these are almost certainly positively correlated. A star system conducive to planet formation is conducive to life. A planet conducive to life is conducive to intelligence. Assuming they cancel is a major domain error. I will highlight this.

