  I'm taking a phil of language module and we've done teh Twin Earth thing to death — every tutor just rolls out water or aluminium and then asks if the twins mean the same thing. I want to move away from natural kinds and think about social institutions instead, but I need the case engineered properly, not just sketched. Could you design a thought experiment that meets these specs?

  Construct a Twin Earth-style scenario built around a socially constructed institution — call it the Civic Bond — where on Earth the founding charter contains a dormant clause that has never actually been invoked, while on Twin Earth the charter is physically identical except that clause is absent (or worded differently in a way that makes no practical difference). The scenario should be realistic, avoid any sci-fi physics or demon predictors, and stay within one paragraph. Then analyse how three semantic theories treat the referance of "Civic Bond" across the two planets: (1) an internalist/descriptivist view where mental content fixes reference; (2) standard causal/historical externalism where reference traces back through the causal chain to the charter's origin; and (3) a normative-function externalism — the kind that cares about the full normative structure of an institution, including rules that lie dormant — where reference depends on the complete functional architecture even if some parts never activate. The required verdicts are that internalist and causal-externalist agree Earthlings and Twin Earthlings refer to the same Civic Bond, while normative-function externalism splits them because the dormant clause changes the institution's normative potential. After laying out the scenario, show the reasoning for each theory, identify the exact structural feature that makes the third peel off, run a removal test explaining what happens if you erase the dormant-clause difference, and give an honest check on whether the case cheats. Finally, include how a defender of the theory that comes out worst — likely the normative-function view, since it seems to split hairs over unused rules — would attack your construction. Write in British English, no bibliographies or reading lists, just the argument.

