  For the internalist, reference is determined by psychological state and descriptive associations. Since Earthlings and Twin Earthlings possess identical concepts of the Civic Bond—associated with funding, security, and redemption rules—their mental contents match. The dormant clause is unknown, forming no part of their cognitive repertoire. Consequently, meaning is fixed internally by these shared descriptions. Because there is no psychological difference regarding the institution's nature, the internalist concludes they refer to the same thing. The hidden legal text cannot alter reference if it fails to alter the mind.

  3. Causal-externalist reasoning
  The causal-historical theorist traces usage back to the institution's initial baptism. Here, baptism involved the public Bond market launch, proceeding identically on both planets. The causal chain relies on community uptake, which remains indistinguishable. While charters differ, the historical chain regarding 'Civic Bond' tracks public practice, not hidden text. Since the causal lineage of usage is functionally continuous and identical, reference remains fixed to the same social kind. The textual variance is too obscure to break the historical chain linking users to the institution.

  4. Normative-function reasoning
  Normative-function externalism holds institutions are constituted by complete rule structures, including latent powers. The Civic Bond is not merely what users think, but what rules permit. On Earth, the Bond carries potential for state seizure; on Twin Earth, it does not. This difference in normative architecture means institutions possess different identity conditions. The dormant clause alters the institution's modal profile—what *could* happen. Therefore, 'Civic Bond' picks out distinct normative structures. Reference splits because underlying constitutive rules differ, making them fundamentally different institutional kinds despite superficial similarity.

  5. The isolating feature
  The divergence arises from how theories treat constitutive rules versus epistemic access. Internalism and causal externalism prioritise the user's mind or historical usage, ignoring hidden text. Normative-function externalism treats the institution as an objective normative structure independent of knowledge. The split stems from the dormant clause altering modal properties. It changes what the Bond *is* in terms of powers, not just beliefs, forcing the normative theorist to distinguish the kinds.

  6. The removal test
  If we erase the dormant-clause difference, the normative-function view collapses into agreement. Without textual variance, normative structures become identical, removing the basis for splitting reference. This confirms the dormant clause is the sole driver of divergence. It demonstrates normative theory is sensitive to constitutive rules even when causally inert. The test validates that disagreement is not about usage, but strictly about hidden architectural rules defining the institution's essence.

  7. Defensive counter-attack
  A defender might argue this construction conflates legal text with the institution itself. They could claim that if a rule is never invoked, it is not constitutive but merely accidental paperwork. They might assert 'Civic Bond' is defined by actualised normative powers, not theoretical possibilities. By insisting the dormant clause changes reference, the scenario arguably begs the question against the practice-based view, treating legalism as ontology without justification.

  8. Honest assessment of whether it cheats
  The case risks cheating by stipulating that the normative view must treat dormant clauses as reference-fixing. It assumes institutions are defined by maximal rule sets rather than realised functions. It isolates the theories, but only by presupposing hidden legal potentials outweigh actual social usage in determining identity, which is precisely what is often disputed. The construction works, but relies on a contentious definition of institutional essence.
