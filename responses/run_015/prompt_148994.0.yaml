  1. The engineered scenario (around 120 words)
  2. Internalist reasoning (around 100 words)
  3. Causal-externalist reasoning (around 100 words)
  4. Normative-function reasoning (around 100 words)
  5. The isolating feature (around 80 words)
  6. The removal test (around 80 words)
  7. Defensive counter-attack (around 80 words)
  8. Honest assessment of whether it cheats (around 80 words)
