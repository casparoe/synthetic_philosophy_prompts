answer: |-
  I concede the causal symmetry. Your duplicate behaves identically. But you presuppose that content is exhausted by functional role. I reject that. Content requires an anchor. Acquaintance provides this non-causally. Consider a map: its accuracy depends on the terrain, not just the ink. If the terrain vanishes, the map remains, but it no longer represents *this* world. Similarly, your utterance is caused by neural states, but its *aboutness*—its reference to pain—is fixed by the qualitative presence itself. Without qualia, your duplicate's judgment is structurally identical but referentially empty. It's not an invented difference to save the theory; it's the distinction between a thought *about* experience and a thought merely *caused* by physical states. Yes, acquaintance is primitive, and yes, this yields no third-person evidence. But the first-person reality of being presented with pain is not erased by causal inertness. The zombie speaks words; I report a presence.
