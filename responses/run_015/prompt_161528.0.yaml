answer: |-
  Here is the operational terrain, the decision procedure, and the calibration set.

  ### 1. The Philosophical Grounding
  You are correct that your current rule fails because it conflates the **Norm of Assertion** (what the speaker owes the truth) with the **Condition of Enforcement** (what the mod can see). You cannot moderate internal knowledge. You can only moderate **Visible Warrant**.

  **The Norm:** Adopt **Scaled Warranted Assertibility**.
  *   **Why not Knowledge?** You can't verify it. A lucky guess looks like knowledge until it doesn't.
  *   **Why not Truth?** You can't verify it in 60 seconds.
  *   **Why Warrant?** It is visible *now*. It shifts the burden from "Is this true?" to "Do you have the right to claim this is true?"

  **The Trade-off:** By enforcing Visible Warrant, you will sometimes remove true claims from knowledgeable people who refuse to show their cards (Case 3). This is the cost of consistency. You are moderating the *public record*, not the *private mind*. If a claim relies on private info, it must carry a public **Assertoric License** (track record) to stand in for the source.

  **The Nesting Discount:** This is principled, not lazy. It tracks **Reach**. A top-level comment is a broadcast; a level-5 reply is a conversation. Misleading potential scales with visibility.

  ### 2. The Decision Procedure (The "Warrant Visibility Protocol")
  **Time Budget:** 45 seconds.
  **Inputs:** Comment text, User History, Thread Depth.
  **Outputs:** `Leave`, `Hedge`, `Link`, `Tag`, `Remove`.

  **Step 0: Is this an Assertion? (5 seconds)**
  If **YES** to any, **STOP → Leave Alone**.
  *   Is it a rhetorical question? ("Who knows?")
  *   Is it a hypothetical inside an argument? ("Suppose P, then Q...")
  *   Is it quoting to disagree? ("X says P, but...")
  *   Is it a joke/sarcasm clearly marked?
  *   Is it a hedge already? ("My understanding is...", "Reportedly...", "It seems...")
  *   Is it a link with no caption? (The link is the warrant).

  If **NO** (It is a bare claim of fact), proceed to Step 1.

  **Step 1: Set the Bar (Reach & Stakes) (10 seconds)**
  *   **Reach:** Top-level or Level 1? → **High Bar**. Level 2+? → **Low Bar**.
  *   **Stakes:** Medical/Financial/Legal/Doxxing? → **High Bar**. Tech/Policy/Speculation? → **Low Bar**.
  *   *Result:* If **High Bar + High Bar**, you need **Strong Warrant**. If **Low Bar + Low Bar**, **Weak Warrant** suffices.

  **Step 2: Check Visible Warrant (15 seconds)**
  Does the comment contain:
  *   A link to a primary/secondary source?
  *   Specific data points (numbers, dates, names) that are checkable?
  *   A mechanistic explanation (how X causes Y)?
  *   **If YES:** **Leave Alone**. (Warrant is self-contained).
  *   **If NO:** Proceed to Step 3.

  **Step 3: Check Assertoric License (10 seconds)**
  Does the user have a **Topic-Specific Track Record**?
  *   Look at last 10 comments in this subforum/tag.
  *   Have they made specific predictions/claims that were later verified/correct?
  *   **If YES:** They have a **License**. **Leave Alone** (even without links).
  *   **If NO:** They have **No License**. Proceed to Step 4.

  **Step 4: Apply Remedy (10 seconds)**
  *   **If High Bar (Step 1):**
      *   Is the claim potentially harmful/misleading? → **Remove** (Justification: "Unsourced high-stakes claim.").
      *   Is it speculative but safe? → **Tag-Unverified** (Justification: "Claim requires verification.").
  *   **If Low Bar (Step 1):**
      *   Can it be saved by softening? → **Require-Hedge** (Justification: "Please clarify epistemic status.").
      *   Is it a claim of consensus ("Studies show")? → **Require-Link** (Justification: "Please cite the specific studies.").

  ---

  ### 3. Calibration Set (For Mod Consistency)
  *Use these to align the 5 mods. If you disagree on these, you disagree on the rule.*

  1.  **Comment:** "The new tax bill passes Tuesday." (Top level, no link, new user).
      *   **Output:** `Remove`
      *   **Justification:** "High-stakes prediction requires sourcing."
  2.  **Comment:** "I feel like the UI is getting worse." (Level 3 reply, no link).
      *   **Output:** `Leave`
      *   **Justification:** "Subjective impression in low-reach thread."
  3.  **Comment:** "Studies show coffee cures cancer." (Top level, no link).
      *   **Output:** `Require-Link`
      *   **Justification:** "Claim of consensus requires citation."
  4.  **Comment:** "I'm no expert, but the reactor will melt down." (Top level, no link).
      *   **Output:** `Remove`
      *   **Justification:** "Warrant laundering on high-stakes claim."
  5.  **Comment:** "Probably going to rain later." (Top level, weather app context).
      *   **Output:** `Leave`
      *   **Justification:** "Common knowledge/base rate assertion."
  6.  **Comment:** "X is a scammer." (Top level, no legal proof).
      *   **Output:** `Remove`
      *   **Justification:** "Defamatory claim requires verification."
  7.  **Comment:** "Based on my prior posts about GPU supply, the shortage ends Q4." (User has 5 correct GPU predictions).
      *   **Output:** `Leave`
      *   **Justification:** "Assertoric license established in topic."
  8.  **Comment:** "Everyone knows the CEO is leaving." (Top level, no link).
      *   **Output:** `Require-Link`
      *   **Justification:** "Appeal to consensus requires evidence."

  ---

  ### 4. Running Your Three Test Cases

  **Case 1: New Account, Top Level, AI Timelines**
  *   *Claim:* "Scaling keeps working, i'd put 85% on capabilities improving sharply through 2027."
  *   *Step 0:* Assertion? Yes (despite "85%", it's a sharp claim).
  *   *Step 1:* Reach (Top) = High. Stakes (Speculation) = Low. **Bar: Medium.**
  *   *Step 2:* Visible Warrant? No (no data/mechanism).
  *   *Step 3:* License? No (3-week account).
  *   *Step 4:* Remedy. It's speculative but high reach.
  *   **Decision:** `Require-Hedge` (or `Tag-Unverified` if your system allows).
  *   **Justification:** "Please clarify the evidence base for this probability."
  *   *Philosophical Note:* The "85%" is a fake hedge if there's no model behind it. It's precision without accuracy.

  **Case 2: Nested Reply, "Well Documented"**
  *   *Claim:* "This is well documented, X has been shown repeatedly." (No link, B is mostly right).
  *   *Step 0:* Assertion? Yes.
  *   *Step 1:* Reach (Nested) = Low. Stakes = Low. **Bar: Low.**
  *   *Step 2:* Visible Warrant? No (Appeal to consensus).
  *   *Step 3:* License? Unknown (Assume No for this case).
  *   *Step 4:* Remedy. Low reach allows leniency, but "well documented" is a warrant claim.
  *   **Decision:** `Require-Link`.
  *   **Justification:** "Please cite the specific documentation mentioned."
  *   *Philosophical Note:* "Well documented" is a warrant claim, not a hedge. It shifts the burden to the audience to find the proof. That violates the Visible Warrant norm.

  **Case 3: Verified Researcher, Insider Info**
  *   *Claim:* "The next model drops in march, i know people there."
  *   *Step 0:* Assertion? Yes.
  *   *Step 1:* Reach (Assume Top/Mid) = High. Stakes (Market/Info) = High. **Bar: High.**
  *   *Step 2:* Visible Warrant? No (Private info).
  *   *Step 3:* License? **Yes** (Verified, long record of correct inside-baseball).
  *   *Step 4:* Remedy. License overrides missing link.
  *   **Decision:** `Leave`.
  *   **Justification:** "User has established track record in this domain."
  *   *Philosophical Note:* This is the **Evidence Problem** leaking in. You are trusting the *person*, not the *claim*. This is licensed by the **Assertoric License** rule. The norm is satisfied because their *public history* warrants their *private claim*. If they are wrong, you revoke the license.

  ---

  ### 5. Failure Modes & Limitations

  **1. The "True but Unlicensed" Casualty**
  You will delete true claims from new users or privacy-conscious experts who won't link.
  *   *Cost:* Loss of novel information.
  *   *Mitigation:* The `Tag-Unverified` option allows the claim to stay but marks it as "Mod hasn't seen the receipt." This preserves the info without endorsing the warrant.

  **2. The "Confidently Wrong" License Holder**
  A user with a strong track record in Domain A (e.g., GPUs) will try to claim authority in Domain B (e.g., Biosecurity).
  *   *Cost:* Misleading the forum via halo effect.
  *   *Mitigation:* The License must be **Topic-Specific**. If the GPU expert talks about viruses, they reset to "New Account" status. Mods must check the *topic* of the history, not just the karma.

  **3. The "Warrant Laundering" Arms Race**
  Users will evolve new fake hedges. "A bird told me," "I can't say more but..."
  *   *Cost:* Mod fatigue.
  *   *Mitigation:* Treat "I can't say more" as **No Warrant**. If they can't show it and don't have a license, it gets the `Tag` or `Remove`. Private knowledge is a privilege earned by public accuracy.

  **4. The Stakes Subjectivity**
  Mod A thinks AI timelines are low stakes (speculation); Mod B thinks they are high stakes (policy impact).
  *   *Cost:* Inconsistency.
  *   *Mitigation:* Define "High Stakes" in your sidebar as: **Actionable Financial, Medical, Legal, or Safety Advice.** Everything else is speculation.

  **Summary:** You are not policing truth. You are policing **epistemic hygiene**. The rule is: **If you broadcast, you must show your work or show your scars.**
