prompt: |-
  i mod a pretty big rationalist-adjacent forum — think the ACX/LW comment section with its own house culture, 200–400 comments a day, five of us on rotation, all volunteers, and every removal has to be justified in the thread itself because people will definately litigate it. our rule right now is "cite or hedge" and it's worthless as written: half the board satisfies it by typing "i think" and then being maximally confident, and the other half gets deleted for saying true things they happen to have no public source for.

  what i want is an actual decision procedure — checklist, ordered questions, where it stops with a no, where it hands off to a person — grounded in whatever the philosophy of assertion actually knows about this. please don't give me a reading list or point me at papers, i'm not going to chase citations. lay the terrain out in your own words. the way i understand it there are three candidate norms: assert only what you know, assert only what's true, and assert only what you're reasonably/warrantedly confident in; plus a separate fight about whether the bar moves with what's at stake for the people hearing it; plus that wierd lottery-style case where something is 99%+ probable on base rates alone and nobody "knows" it.

  constraints: 30–60 seconds per call, run by a mod who usually knows nothing about the topic; output is one of leave-alone / require-a-hedge / require-a-link / tag-unverified / remove, plus a one-sentence public justification that can't out anybody's private info; and it has to be consistent across five mods, so include a calibration set of ~8 one-line test comments with the intended output for each.

  the bits i specifically need handled:

  - step zero, is this even an assertion: rhetorical questions, "suppose p" inside an argument, jokes and sarcasm, quoting someone in order to disagree, posting a link with a one-word caption, "everyone knows", "my understanding is", "reportedly", "go look it up yourself". and separately: does reach matter? i've been applying what i call the nesting discount — a claim buried nine levels deep gets a lower bar than a top-level comment — and i can't tell if that's principled or just laziness.
  - hedges: what does "i think p" / "probably p" / "i'd put 70% on p" actually commit you to under each of the three norms? if the knowledge norm governs bare p, what governs "i think p" — knowledge of your own credence? calibration? and is a hedge a real reduction in assertoric load or just a social move? i've started calling the fake kind warrant laundering ("i'm no expert, but [extremely confident claim]", "studies show [thing i can't produce]", "people in the field say...") and i want to know whether that's one coherent category or three different things i'm collapsing.
  - warrant a mod can actually see: a public checkable source vs. a domain-local track record (i want a real "assertoric license" rule — earned by a public record of checkable claims in that one topic, expires, doesn't transfer across topics, doesn't cover insider info) vs. nothing visible at all.
  - stakes and reach: pick a side on whether the bar moves, and say what picking that side costs you. include the statistical-certainty cases — "the flight will land fine", "the approval gets delayed again", "the build ships late" — where the probability is high and the knowledge is thin.

  and the thing i keep tripping over: the norm governs the *speaker*, but moderation runs on *my* evidence. someone can fully satisfy it and still look unsourced to me; someone can violate it and look fine. be explicit about which of the two your procedure is really tracking, because i suspect our current rule is confused about exactly this.

  then run it on three: (1) a three-week-old account, top level, no track record: "scaling keeps working, i'd put 85% on capabilities improving sharply through 2027" — which half the board believes anyway. (2) a nested reply where A asks for a source and B says "this is well documented, X has been shown repeatedly" with no link, and B is basically right but the specific number is wrong. (3) the one where i won't like the answer: a verified ML researcher with a long record of correct inside-baseball posts writes "the next model drops in march, i know people there" — no citation possible, no names, i believe him and want it left up. what does your procedure do to him, and is that actually licensed by the norm or is it just my evidence problem leaking into a rule?

  close with what the procedure can't do — the failure modes i should expect (e.g. that it will systematically hit true-but-ahead-of-the-evidence claims, and let confidently wrong but well-licensed users through).
reasoning: |-
  Here's a thinking process that leads to the suggested moderation procedure:

  1.  **Analyze the Request:**
      *   **Context:** High-volume rationalist-adjacent forum (ACX/LW style), 200-400 comments/day, 5 volunteer mods, high litigiousness (removals must be justified publicly).
      *   **Current Problem:** "Cite or hedge" rule is broken (fake hedges, deletion of true unsourced claims).
      *   **Goal:** A concrete decision procedure (checklist/flowchart) for mods.
      *   **Constraints:** 30-60 seconds per call, mod knows nothing about the topic, 5 possible outputs (leave, hedge, link, tag, remove), 1-sentence public justification, consistent across 5 mods (needs calibration set).
      *   **Philosophical Grounding:** Needs to address norms of assertion (Knowledge vs. Truth vs. Warranted Confidence), stakes, reach, and the speaker-vs-evidence gap.
      *   **Specific Issues to Handle:** Definition of assertion (step zero), nesting discount, fake hedges ("warrant laundering"), visible warrant (track record vs. source), stakes/reach trade-off, statistical certainty cases.
      *   **Test Cases:** Three specific scenarios to run the procedure on.
      *   **Closing:** Failure modes/limitations.
      *   **Constraint:** No reading lists/papers. Lay the terrain in my own words.

  2.  **Deconstruct the Philosophy of Assertion (for Mods):**
      *   *The Core Tension:* The user correctly identifies the gap between the *norm* (what the speaker ought to do) and the *enforcement* (what the mod can see). A mod cannot see inside a speaker's head to check if they *know* $P$. A mod can only check if the speaker *shows* they know $P$.
      *   *Decision:* The procedure *must* track **Visible Warrant**, not internal Knowledge. If we track internal knowledge, we get arbitrary enforcement based on mod trust. If we track visible warrant, we get consistency, even if some true things get flagged.
      *   *The Norm:* Adopt a **Stakes-Scaled Warranted Assertibility** norm.
          *   Why not Knowledge? Too strict for speculation, too loose for lucky guesses.
          *   Why not Truth? Impossible to verify in 60 seconds.
          *   Why Warranted Confidence? It aligns with "Cite or Hedge" but fixes the "fake hedge" problem by requiring the hedge to match the visible evidence.
          *   Why Stakes? High stakes (medical, financial, doxxing-adjacent) need higher warrant than low stakes (speculation on AI timelines).
      *   *The "Nesting Discount":* This is principled. Reach = Potential Harm/Misleadingness. A top-level comment is a broadcast; a reply is a conversation. Lower reach = lower warrant requirement.

  3.  **Drafting the Procedure (The "Warrant Visibility Protocol"):**
      *   *Step 0: Is it an Assertion?* Need to filter out non-assertions quickly.
      *   *Step 1: Reach & Stakes.* Determine the "Bar." Top level + High Stakes = High Bar. Nested + Low Stakes = Low Bar.
      *   *Step 2: Visible Warrant Check.* Does the comment carry its own proof? (Link, Data, Specific Mechanism).
      *   *Step 3: User License.* Does the user have a track record *in this topic*? (The "Assertoric License").
      *   *Step 4: Hedge Quality.* If warrant is low, is the hedge real? (Probabilistic vs. Weasel words).
      *   *Decision Matrix:* Map the findings to the 5 outputs.

  4.  **Refining the "Hedge" & "Warrant Laundering" Concept:**
      *   *Real Hedge:* Lowers the claim's truth condition. "I think P" means "My evidence suggests P."
      *   *Fake Hedge (Warrant Laundering):* "I'm no expert but P" (claims P is true, admits no warrant). "Studies show P" (claims warrant exists, hides source).
      *   *Rule:* A hedge only counts if it explicitly downgrades the *factivity* of the claim, not just the *authority* of the speaker.

  5.  **Addressing the "Speaker vs. Mod Evidence" Problem:**
      *   Be explicit: We are moderating the **Public Record**, not the **Private Mind**. If you know it but can't show it (and don't have a license), it gets tagged/removed. This is the cost of consistency.

  6.  **Developing the Calibration Set:**
      *   Need 8 examples covering the edge cases (fake hedges, nested, high stakes, licensed user, unlicensed user).
      *   Must include intended output and justification.

  7.  **Running the Test Cases:**
      *   *Case 1 (New account, AI timelines):* Low stakes (speculation), Top Level (High Reach). No license. High confidence claim. -> *Require Hedge/Tag.*
      *   *Case 2 (Nested, "Well documented"):* Low Reach. Claim of warrant without source. -> *Require Link or Tag.*
      *   *Case 3 (Licensed Researcher, Insider Info):* High Stakes (market moving?). High License. No Source. -> *Leave Alone (License covers it).*
      *   *Critique of Case 3:* This highlights the "Evidence Problem." The mod is trusting the *user*, not the *claim*. This is necessary but risky.

  8.  **Final Review against Constraints:**
      *   30-60 seconds? Yes, if flowchart is simple.
      *   5 outputs? Yes.
      *   1-sentence justification? Yes.
      *   No reading list? Yes.
      *   Addressed specific philosophical bits (norms, stakes, nesting)? Yes.

  9.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Professional, direct, operational. Acknowledge the difficulty.
      *   *Structure:*
          1.  The Philosophical Grounding (Speaker vs. Evidence).
          2.  The Decision Procedure (Step-by-Step).
          3.  The Calibration Set.
          4.  Running the Three Test Cases.
          5.  Failure Modes.

      *(Self-Correction during drafting)*: I need to make sure the "Nesting Discount" is formalized. Let's call it "Reach Tiers."
      *(Self-Correction on Case 3)*: If the researcher says "I know people there," that's actually a warrant claim. But it's private. The "Assertoric License" is the public proxy for this. I need to define the License clearly: Public track record of *correct* predictions in *this domain*.
      *(Self-Correction on Justifications)*: They must be non-combative. "Needs sourcing" not "You are lying."

  10. **Final Polish:** Check the word count and ensure the "30-60 second" constraint feels realistic. The checklist needs to be binary where possible.

  *(Final thought on the "Knowledge vs Truth vs Warrant" debate)*: I will recommend **Warranted Assertibility** scaled by **Reach/Stakes**. It's the only one enforceable by a third party. Knowledge is internal; Truth is retrospective; Warrant is visible *now*.

