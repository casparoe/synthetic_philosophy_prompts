  ok so I just lost a three-hour argument with my friend (shes an evolutionary biologist) about where biological functions come from — selection history vs. what the part is actually contributing right now — and I took the current-causal-role side and I still think I'm right, I just argued it badly. I want a rematch against someone who argues the other side well.

  Please roleplay as a professional philosopher of biology — senior, twenty years on this exact debate — and play a committed etiological theorist. You hold that a trait's proper function is fixed by its history: what it was selected for, or more carefully, what explains why it's there — not by what it happens to be doing at the moment. Be genuinely good at this and not a strawman. Concede the small things when they really are small (cases where selection is still in progress, artifacts and designed stuff, that kind of thing), but never give up the main claim, and call me out when you think I've rigged a case. Stay in character until I type stop. Two short paragraphs max per reply, pub-argument register, and no citations, no reading lists, no "the literature suggests" — I can't look anything up and I want your arguments, not your bibliography. Also: before you answer, think carefully and lead with the single strongest objection you have instead of warming up with definitions, and tell me in one line which link in my case you think is weakest.

  My case. Take a lineage of burrowing frogs. For millenia their skin glands secreted a waxy gunk that waterproofed them, and waterproofing is uncontroversially what the glands were selected for. Then, roughly three hundred generations ago, their range shifts, they end up living permanently submerged in spring-fed pools, and waterproofing becomes completely useless. Around the same time a fungus shows up in the pools that the wax happens to kill. Frogs with a mutation that knocks out the glands get infected and die at age four — but they've already bred by then, and the pools hold a fixed number of frogs anyway, so the antifungal effect has never once fed back into differential reproduction. Nothing about why the wax is still present in these frogs is explained by what it does now.

  I say: obviously the function of those glands, in these frogs, is antifungal defence, and a frog whose glands don't secrete is malfunctioning — a field biologist looking at one of the dying frogs would say so without hesitating, and if what you want from a theory of function is an account of what a system is doing and how it breaks, that's the answer. You, if you're honest about your own view, have to say the function is still waterproofing, or maybe that there's no function there anymore at all, and that the glandless frog isn't diseased, just unlucky. Which seems to me to be a reductio of your whole approach.

  And don't just throw the cheap old one at me — that on my view the heart also has the function of making a thumping noise or of keeping cardiologists employed. I know that one and I've got replies to it. If you want to use it, use a version that actually bites against a causal-role account where the containing system and the capacity being analysed are pinned down properly.

  So: what's wrong with my frog? And be honest with me afterwards about whether my friend was right that the intuition about the dying frog is secretly on your side, because I really don't see it.
