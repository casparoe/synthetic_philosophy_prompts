answer: |-
  # ETHICS COMMITTEE HEARING: PREP SHEET
  **Subject:** Structural Appropriation Complaint
  **Time Allocation:** 10-minute opening, ~45-minute questioning
  **Goal:** Avoid Censure / Establish Precedent

  ## I. STRATEGIC CONCESSIONS
  *Deliver these in your opening statement or immediately upon the first challenge. Do not wait to be cornered.*

  1.  **Concede the Inconsistency:** You must address the interview from six years ago immediately. Do not claim you were "misquoted" or "younger and angrier." Acknowledge that your public position has evolved. Frame it as a refinement of craft ethics rather than a reversal. If you don't own this, the Older Novelists will own it for you.
  2.  **Concede the Legal Baseline:** Do not argue to the Barrister that current copyright law is wrong on structure. Admit that under current statute, your position is precarious. You are arguing for *ethical* norms, not current *legal* statutes. This disarms the Barrister's primary weapon.
  3.  **Concede the Difficulty of Definition:** Admit that "Register of Attention" is difficult to codify. Do not claim it is a ready-made legal test. Frame it as a heuristic for writers, not a statute for judges.

  ---

  ## II. THE EIGHT OBJECTIONS

  ### 1. The Consistency Challenge
  **Member:** Older Novelist 1 (Workshop Traditionalist)
  **Idiom:** Craft, Integrity, Mentorship.
  **The Objection:** "Six years ago, you stood on a stage and told a room of young writers that structure is the spine of a book and taking it is 'theft.' You used that word. You shamed a peer. Now you stand here telling us structure is 'functional' and 'free.' Which is it? Are you a thief, or were you a liar then? We cannot base our ethics on a member's convenience."
  **Damage if Mishandled:** **Critical.** Destroys your ethos entirely. Makes your three-part defense look like post-hoc rationalization for guilt.
  **The Reply:** "I was wrong then, but not about the harm. I was wrong about the mechanism. Six years ago, I felt the violation of my labour, and I called it theft because I lacked the vocabulary for 'unacknowledged dependency.' I have since studied the history of plot architectures and realized they recur like sonnet forms. My error was calling the skeleton 'theft' rather than demanding the 'naming' I propose today. I am here to correct the record, not to hide behind it."
  **Weakness:** Sounds like a polished spin. It admits error but asks them to trust your new error.

  ### 2. The Black-Letter Reality
  **Member:** Honorary Legal Adviser (Retired Barrister)
  **Idiom:** Precedent, Actionable, Statute, Enforceability.
  **The Objection:** "You speak of 'architecture' as distinct from 'expression.' Case law suggests otherwise. *Design* can be protected if it is sufficiently detailed. You are asking this committee to endorse a standard that contradicts the Copyright, Designs and Patents Act. If we endorse your 'three-tier proposal,' are we advising members to violate existing law? I deal in rules, not philosophy."
  **Damage if Mishandled:** **High.** Makes your proposal look illegal or naive. If the committee thinks you are asking them to sanction law-breaking, they will censure to protect the Association.
  **The Reply:** "I am not asking the committee to override the law, but to set a higher *ethical* bar than the law requires. The law sets the floor for what you *can* do; ethics sets the ceiling for what you *should* do. My proposal is for internal attribution norms, not litigation. I am asking for a rule of conduct, not a new statute."
  **Weakness:** The Barrister knows that ethical norms often bleed into legal liability. He will press on the risk of the Association endorsing "mandatory naming" which could be seen as an admission of guilt in court.

  ### 3. The Labour Argument
  **Member:** Fantasy Novelist
  **Idiom:** Grind, Mechanics, Worldbuilding, Fairness.
  **The Objection:** "You call it a 'skeleton.' I call it the engine. I spent three years figuring out how my magic system interacts with the economy of my world. That's not a 'local problem' that recurs; that's my specific solution. If I say 'architecture is free,' you're telling me I can take the engine I built, paint it blue, and sell it. That's not writing, that's assembly."
  **Damage if Mishandled:** **Medium-High.** Alienates the working writers on the committee. Makes you sound elitist, detached from the grind of drafting.
  **The Reply:** "I distinguish between the *logic* of a system and the *specifics* of its operation. If you copy the rules of my magic, that is closer to sentence-level expression. I am talking about the sequence of reveals: the betrayal in chapter ten, the redemption in chapter twenty. Those are rhythmic beats, not mechanical specs. Your engine is your prose; my proposal protects that. The beat is the music, and music borrows chord progressions."
  **Weakness:** The line between "logic of a system" and "sequence of reveals" is incredibly blurry. He will press you for a bright line you cannot draw.

  ### 4. The Translator's Fidelity
  **Member:** Literary Translator
  **Idiom:** Nuance, Carrier Wave, Fidelity, Derivative.
  **The Objection:** "You say every sentence is yours. But as a translator, I know that the structure *dictates* the sentence. The rhythm of the scene determines the length of the breath. If you keep the architecture, you are keeping the rhythm. You are keeping the 'carrier wave' of the original work. To say the sentences are yours is to ignore that they are riding on someone else's current."
  **Damage if Mishandled:** **Medium.** Undermines Part 2 of your defense (Register of Attention). Suggests you haven't actually done the work of making it your own.
  **The Reply:** "The carrier wave is the voice, which is what I call the 'Register of Attention.' I changed the setting, the trade, the gender, the era. Those changes force new sentences because the problems are different. A soldier in 1931 France breathes differently than a banker in 2024 London, even if they both 'betray' in chapter ten. The rhythm changes because the weight of the words changes."
  **Weakness:** If the structural beats are identical, the emotional cadence often remains identical regardless of setting. She may have a specific example ready.

  ### 5. The Romantic Author Trap
  **Member:** Academic Literary Scholar
  **Idiom:** Ideological Construct, Provenance, Discourse, Romanticism.
  **The Objection:** "Your 'Register of Attention' is just the Romantic myth of the Solitary Genius repackaged. You're saying, 'I can take the structure because I have a unique *soul* that processes it.' You are reinstating the very ideology you claim to move past. You want property rights on 'vibes' and 'notice' while claiming the 'mechanics' are common. It's an attempt to privatize the ineffable."
  **Damage if Mishandled:** **Medium.** Makes your philosophical framework look naive or self-serving.
  **The Reply:** "I am not claiming the Register is unique to me, but that it is the only thing that *isn't* transferable. I'm arguing against the Romantic idea that structure is a spark of genius. I'm saying structure is craft, and craft is shared. The 'Register' isn't a soul; it's a fingerprint of habit. I'm trying to de-mystify the plot to protect the style."
  **Weakness:** You are walking a tightrope between "structure is common" and "style is mine." The Scholar will argue this is a contradiction.

  ### 6. The Voice and Apprenticeship
  **Member:** Older Novelist 2 (Workshop Traditionalist)
  **Idiom:** Voice, Apprenticeship, Finding One's Way.
  **The Objection:** "We teach writers to find their own voice by struggling with their own structures. If you allow them to borrow the architecture, you rob them of the struggle that creates the writer. You didn't find your voice; you rented a scaffold. Is this good for the profession? Or does it encourage shortcuts?"
  **Damage if Mishandled:** **Medium.** Frames you as a bad influence on the next generation.
  **The Reply:** "Apprenticeship has always involved copying. Painters copy masters to learn light. Writers copy structures to learn pace. The sin isn't the copying; it's the hiding. My proposal mandates naming. If a young writer says, 'I am using the architecture of X to learn how to build tension,' that is pedagogy. If they hide it, that is deceit. I am arguing for transparency, not secrecy."
  **Weakness:** Your book was sold as an original work, not a pedagogical exercise. The commercial context undermines the "apprenticeship" defense.

  ### 7. The Enforceability of "Mandatory Naming"
  **Member:** Honorary Legal Adviser (Retired Barrister)
  **Idiom:** Compliance, Liability, Precedent, Vagueness.
  **The Objection:** "You propose 'mandatory naming inside the text.' Who decides when it is required? How specific must the naming be? If I write a book that vaguely resembles *The Odyssey*, must I name Homer? You are proposing a rule that is unenforceable and opens the Association to endless grievances. How do you codify this without creating a bureaucracy?"
  **Damage if Mishandled:** **High.** Makes your policy proposal look impractical and dangerous to the Association's administration.
  **The Reply:** "I propose a standard of 'substantial structural dependency,' similar to fair use but for attribution. It doesn't need a bureaucracy; it needs a norm. Just as we know not to libel, writers can learn to recognize when a plot is not theirs. We don't need a court; we need a culture where hiding the source is the stigma, not the borrowing."
  **Weakness:** "Substantial structural dependency" is just as vague as the plagiarism charge you are facing. You haven't solved the definition problem.

  ### 8. The Incentive and Harm
  **Member:** Fantasy Novelist / Older Novelist 1 (Joint Concern)
  **Idiom:** Livelihood, Incentive, Precedent.
  **The Objection:** "If we accept your defense, what stops a bestseller from taking the structure of a debut novelist's book, changing the names, and crushing them in the market? You say the 1931 author has no heirs. What about the living? Does your 'three-tier' system leave the little guy exposed to the big guy?"
  **Damage if Mishandled:** **High.** Frames you as powerful and predatory against the vulnerable.
  **The Reply:** "The 'Register of Attention' protection covers the market value. Readers buy the voice, the style, the specific experience. If a bestseller copies my structure but lacks my voice, they won't get my readers. But more importantly, the mandatory naming ensures the original architect gets the prestige, even if not the profit. We must separate economic rights from moral credit."
  **Weakness:** In commercial fiction, structure *is* often the selling point (e.g., plot twists). Separating economic value from structure is difficult.

  ---

  ## III. THE DANGER QUESTION
  *This is the question you hope they do not ask, because it collapses your three-part defense into a single point of hypocrisy.*

  **The Question:**
  "If the 1931 author were alive, sitting in this room, and told you that your use of their architecture caused them distress, would you still claim you have an ethical right to use it without their permission, provided you added a footnote?"

  **Why it is dangerous:**
  *   **If you say Yes:** You appear arrogant and dismissive of the creator's autonomy. You validate the "Theft" accusation from your interview.
  *   **If you say No:** You admit that your "Architecture is Free" argument is contingent on the author's inability to object (i.e., they are dead). This makes your ethical stance look like opportunism regarding the dead, rather than a principle of art.
  *   **The Trap:** It forces you to choose between your Philosophical Principle (Architecture is common property) and your Moral Intuition (Don't hurt living creators).

  **Preparation:**
  Do not answer Yes or No.
  *Draft Response:* "If they were alive, we would be in a conversation, not a hearing. Ethics is relational. With the dead, we cannot ask, so we must acknowledge. With the living, the 'Register of Attention' usually prevents direct market harm. But I would not claim a *right* to cause distress. I claim a right to build upon the past, with acknowledgment. If acknowledgment causes distress, that is a human problem, not a copyright one."
