answer: |-
  ### Exam Question

  **Course:** PHIL/COG 405: Darwinian Theories of Culture
  **Assessment:** Final Essay
  **Time:** 90 Minutes (Take-home equivalent)
  **Length:** Maximum 1,000 words

  **Prompt:**

  Consider the following empirical vignette:

  > Fieldworkers document sixty distinct procedures for making waterproof containers from the same locally available materials, across thirty neighbouring communities. Three findings emerge.
  >
  > 1.  Over the sampling window, the population frequency of procedures shifts toward ones that score better on a standardised leak test.
  > 2.  Experimenters recruit novices who have never seen the corpus, tell them only the goal, hand them the same raw materials, allow each a fixed number of attempts in isolation, and forbid contact with one another or any informant. The same handful of procedures recurs across novices, and they are the ones that were winning in the field.
  > 3.  There is no lineage data: nothing in the record reveals who learned from whom, so nobody can reconstruct the transmission tree.

  A colleague argues that Finding (2) disproves a Darwinian explanation of Finding (1). They claim that because novices independently re-derive the successful procedures, the population shift is due to cognitive convergence, not cultural selection.

  Write an essay evaluating this claim. Your response must address the following three points:
  1.  **Units and Fitness:** Specify what the unit of selection would be in this scenario and what determines its fitness. Explain why treating "spread" as evidence of selection is insufficient here.
  2.  **Convergence vs. Selection:** Evaluate whether the novice re-derivation result is an *alternative* to a selection explanation, or if it might represent selection operating on a different timescale or level. Under what conditions does convergence constitute a selection process rather than an alternative to it?
  3.  **Fidelity and the Ratchet:** Cumulative adaptation is often said to require high-fidelity replication. Argue whether reliable reconvergence can substitute for replication fidelity in sustaining a cultural ratchet. What specific measurement would distinguish a ratchet driven by copying from one driven by reconvergence?

  ***

  ### Model Answer

  The colleague's claim rests on a false dichotomy between cultural selection and cognitive convergence. To evaluate it, we must first operationalize what a Darwinian explanation requires in this context. A Darwinian process requires variation, heritability, and differential fitness. In the vignette, Finding (1) shows differential frequency correlated with performance (leak tests), which superficially resembles selection. However, mere spread is not evidence of selection; it is merely the phenomenon to be explained. If the frequency shift occurred because the procedures are easier to remember, "fitness" is memorability, not waterproofing. If it occurred because they are actually waterproof, "fitness" is functional utility. Without lineage data (Finding 3), we cannot distinguish whether the frequency shift is caused by social transmission of successful variants or by independent abandonment of unsuccessful ones.

  This leads to the crux of the colleague's objection regarding Finding (2). The fact that novices re-derive the successful procedures in isolation suggests strong content biases: the "fitness landscape" of container-making has deep attractors. The colleague argues this disproves selection. This is only true if we define the unit of selection narrowly as the specific procedural variant transmitted between adults. If the unit is the *procedure*, and novices invent it de novo, there is no replication, hence no Darwinian evolution of that specific unit.

  However, this ignores the "relocated selection" possibility. The cognitive biases that cause novices to converge on the waterproof design are themselves traits with a history. If those biases are genetic, they are the product of biological selection. If those biases are learned metacognitive strategies (e.g., "test for leaks early"), they are the product of prior cultural selection. In this view, convergence is not an alternative to selection; it is the downstream expression of selection that operated elsewhere. The "unit" shifts from the container procedure to the cognitive bias that generates it. The fitness of the bias depends on the reliability with which it generates functional containers. Therefore, the novice result does not falsify a Darwinian explanation; it merely relocates the locus of selection from the diffusion of artifacts to the stabilization of learning mechanisms.

  To claim this is a Darwinian process, however, we must specify what observation would falsify it. If the novice convergence disappears when the raw materials change slightly, but the expert communities retain the old procedure, this suggests the experts are maintaining a high-fidelity tradition against the grain of cognitive bias. That would be evidence of cultural selection overriding convergent pressure. Conversely, if experts and novices always match regardless of material constraints, the "selection" is entirely on the cognitive side, and the cultural population is merely echoing individual psychology.

  Finally, we must address fidelity and the ratchet. Standard theory holds that cumulative culture requires high-fidelity copying to prevent regression to the mean. If every generation must reinvent the wheel, complex adaptations cannot accumulate. However, reliable reconvergence can substitute for replication fidelity *if* the attractor basin is sufficiently steep. If the cognitive or physical constraints make the "best" solution significantly easier to find than sub-optimal solutions, the population can maintain adaptation without copying. The "information" is not stored in the tradition, but in the structure of the learning problem itself.

  To distinguish a ratchet driven by copying from one driven by reconvergence, we must measure the variance in the *process*, not just the product. In a high-fidelity copying regime, we expect low variance in the specific motor movements or sequence steps used to achieve the goal, even if some steps are functionally redundant. In a reconvergence regime, we expect high variance in the process but low variance in the functional outcome. If we observe communities using different step-sequences to achieve the same leak-test score, and novices arrive at those same diverse sequences independently, the ratchet is maintained by convergent problem-solving, not cultural inheritance.

  In conclusion, the colleague is wrong to treat convergence as a falsification of selection. It is a specification of the mechanism. A Darwinian explanation remains valid if we identify the replicator (the bias rather than the artifact) and the fitness condition (the reliability of the bias). However, this moves the explanatory burden: we must explain why the biases exist. If the biases are innate, the adaptation is biological. If the biases are learned, we must explain their transmission. Without lineage data, we cannot rule out that the "convergence" is actually a high-fidelity tradition of *how to learn*, rather than *what to make*. The expensive move is not to invoke selection, but to identify what is actually being retained across generations.

  ***

  ### Marking Scheme (Total: 20 Points)

  **1. Operationalizing Units and Fitness (4 Points)**
  *   **A (4):** Explicitly identifies that "spread" is not selection. Distinguishes between fitness as *functional utility* (leak-proofing) vs. *transmission advantage* (memorability). Identifies the unit as either the procedure or the bias.
  *   **B (2-3):** Defines selection generally but fails to distinguish why spread alone is insufficient in this vignette. Vague on what constitutes the "unit."
  *   **C (0-1):** Equates frequency shift directly with selection.
  *   *Common Error:* Treating the mere existence of the procedure as the unit without asking what makes it persist.

  **2. Convergence vs. Selection (The "Wrinkle") (5 Points)**
  *   **A (5):** Argues that convergence is not necessarily an alternative to selection. Explains the "relocated selection" argument (biases are products of prior selection). Distinguishes between biological vs. cultural origins of the bias.
  *   **B (3-4):** Acknowledges convergence complicates the picture but treats it as a binary choice (either selection OR convergence). Misses the "relocated" aspect.
  *   **C (0-2):** Accepts the colleague's claim that convergence disproves selection without argument.
  *   *Common Error:* Treating the re-derivation result as an explanation rather than a description that itself needs explaining.

  **3. Fidelity and the Ratchet (5 Points)**
  *   **A (5):** Argues that reconvergence *can* substitute for fidelity under specific conditions (steep attractor landscapes). Proposes a concrete measurement to distinguish the two (variance in process vs. variance in product).
  *   **B (3-4):** States that fidelity is usually required but acknowledges reconvergence helps. Lacks a specific proposal for how to measure the difference.
  *   **C (0-2):** Asserts fidelity is strictly required and reconvergence cannot support a ratchet.
  *   *Common Error:* Sliding between the level at which selection acts and the mechanism by which variants are transmitted.

  **4. Falsification Conditions (3 Points)**
  *   **A (3):** Specifies a concrete scenario that would change the conclusion (e.g., material change decoupling experts from novices).
  *   **B (2):** Suggests more data is needed without specifying what kind.
  *   **C (0-1):** No falsification conditions offered.
  *   *Common Error:* Failing to state what observation would make them stop saying it.

  **5. Clarity and Structure (3 Points)**
  *   **A (3):** Argument flows logically from units to convergence to fidelity. No name-dropping.
  *   **B (2):** Understandable but disorganized.
  *   **C (0-1):** Difficult to follow or relies on jargon without definition.
  *   *Common Error:* Reciting the gene/meme analogy without applying it to the specific constraints of the vignette.

  **Specific Deductions:**
  *   **-2 Points:** For treating mere spread as evidence of selection.
  *   **-2 Points:** For treating convergence as automatically fatal to a selection story.
  *   **-2 Points:** For using specific author names or theories not provided in the course (e.g., "As Boyd and Richerson say...").

  **Grade Boundaries:**
  *   **17-20:** Distinction (Sharp, operational, avoids the "rationalist move" traps).
  *   **14-16:** Pass/Credit (Understands the concepts but misses the "relocated selection" nuance or fidelity measurement).
  *   **10-13:** Marginal Pass (Recites definitions but fails to apply to vignette).
  *   **0-9:** Fail (Fundamental misunderstandings of selection/heritability).
