prompt: |-
  I am a novelist, and I have been asked to deliver the opening remarks at the dedication of the Meridian Climate Archive, a repository of oral histories from those affected by the 2041 drought, preserved for citizens who will not be born until the next century. The audience is mixed: climate scientists, archivists, families who contributed testimonies, and secondary-school students. The remarks must be formal, brief, and do real philosophical work rather than offer sentiment.

  The structural constraint is this: I must honour the contributors without claiming to know exactly who the future recipients are or what they will require. I want to invoke intergenerational justice — specifically the tension between treating future people as identifiable creditors to whom we owe precise debts, and treating them as an open set of moral patients whose very identities depend on our present choices. I also wish to introduce, carefully, the risk that preservation can become a form of moral corruption — a symbolic substitute for structural change — without accusing the archive itself. The remarks should be impossible to deliver if one holds either that we have no duties across time, or that preservation fully discharges them.

  Please write the remarks in British English, in a novelist's voice: precise, restrained, with one concrete image — the archive stores every recording on ceramic glass engineered to degrade in exactly two hundred years, neither more nor less. After the speech, provide a brief structured summary as a JSON object with these fields: "occasion", "audience_segments", "philosophical_tension", "structural_constraint", "niche_idea_injected", "image_used", "tone", and "why_extreme_views_make_it_impossible".
