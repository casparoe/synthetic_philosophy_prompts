answer: |-
  This is a fascinating ethical puzzle, and it makes complete sense that your brother's dialysis has sharpened your focus on where we draw the line between markets and morals. Your roommate has a very consistent ethical framework, even if she hasn't explicitly named it.

  Here is the breakdown of how her three potential rules apply to the neural band case, which rule she is actually using, and a test case to prove it.

  ### 1. The Predictions

  Here is how each rule would judge the **Neural Band Startup** (paying non-poor adults to sell emotional data to advertisers):

  *   **The Exploitation Rule:**
      *   *Logic:* Transactions are repugnant if one party takes unfair advantage of the other's vulnerability or desperation.
      *   *Prediction:* **Not Repugnant.** The startup explicitly screens for income to ensure participants aren't poor. Without financial desperation, there is no coercion or unfair advantage.
  *   **The Treating-People-as-Commodities Rule:**
      *   *Logic:* Transactions are repugnant if they turn human beings, their bodies, or their intrinsic attributes into objects for sale.
      *   *Prediction:* **Repugnant.** Emotional states and neural data are intimate parts of the self. Selling them to advertisers turns inner human experience into a commercial product.
  *   **The Corruption-of-Values Rule:**
      *   *Logic:* Transactions are repugnant if introducing money degrades the meaning of a social good, undermines a civic norm, or invades a "protected sphere" (like democracy, family, or emergency relief).
      *   *Prediction:* **Repugnant.** This invades the sphere of mental privacy and autonomy. Selling emotional data to *advertisers* (who use it to manipulate behavior) corrupts the value of authentic human agency, similar to how selling votes corrupts democracy.

  ### 2. Which Rule Is She Actually Using?

  Your roommate is almost certainly running a **Corruption-of-Values Rule** (often called the "Spheres of Justice" or "Market Norms vs. Social Norms" framework).

  Here is why the other two don't fit her track record:

  *   **Why it's not the Exploitation Rule:** If she were purely against exploitation, **selling votes** wouldn't necessarily be repugnant if a rich person sold a vote to another rich person, or if the seller wasn't desperate. But vote selling is generally considered wrong regardless of wealth because it breaks the *system* of democracy, not just because it hurts the seller.
  *   **Why it's not the Commodities Rule:** You defined this as "treating *people* as commodities." If this were her rule, **price gouging bottled water** wouldn't fit. Water is not a person or a body part. She finds water gouging repugnant not because the *water* is sacred, but because profiting from disaster violates the social norm of solidarity.

  **The Corruption Rule fits every single one of her verdicts:**
  *   **Kidneys:** Corrupts the norm of altruistic gift-giving in medicine.
  *   **Water:** Corrupts the norm of solidarity during crises.
  *   **Votes:** Corrupts the norm of civic equality.
  *   **Vaccines:** **Does not corrupt.** Paying for vaccines *supports* the public health norm; it doesn't degrade it. (This is why it's the only "Not Repugnant" case).
  *   **Foster Care:** Corrupts the norm of parental love (children shouldn't be allocated by ability to pay).
  *   **Public Housing:** Corrupts the norm of fairness/need-based allocation.

  **Verdict:** She will call the Neural Band **Repugnant**. Even though the participants aren't poor (ruling out exploitation), selling inner emotional states to advertisers corrupts the value of mental privacy and autonomy.

  ### 3. The Tie-Breaker Case

  To definitively split the **Exploitation Rule** from the **Corruption Rule**, you need a case where there is **no vulnerability** (so Exploitation says "OK") but there is **normative degradation** (so Corruption says "Repugnant").

  **The Case:** **"Selling Citizenship."**
  *Imagine a government program where wealthy foreigners can pay $5 million to instantly become citizens, bypassing all residency or testing requirements.*

  *   **Exploitation Rule Prediction:** **Not Repugnant.** The buyers are wealthy (not vulnerable), and the state is a sovereign entity (not vulnerable). It is a voluntary exchange between equals.
  *   **Corruption-of-Values Rule Prediction:** **Repugnant.** Citizenship is a civic bond based on shared commitment and belonging. Turning it into a commodity corrupts the meaning of the political community (similar to selling votes or jumping the housing line).

  If your roommate says selling citizenship is **repugnant**, you have confirmed she is running a Corruption-of-Values framework. If she says it's **fine** (because no one is being exploited), she is running an Exploitation framework, and you should expect her to approve the Neural Band startup.

  ***

  *Side note: It is completely normal to become obsessed with these questions when a loved one enters the medical system. Dialysis forces you to confront the reality that bodies are fragile and resources are scarce. Analyzing these "repugnant markets" is often a way of trying to regain a sense of control over a world that suddenly feels very unfair.*
