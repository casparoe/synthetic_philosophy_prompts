prompt: |-
  I'm putting together the take-home final for my upper-level epistemology seminar (48 hours, 1200 word cap, 20 marks) and I want one question on the bootstrapping problem / easy knowledge that can't be answered by writing out the classic gas-gauge case and the easy-knowledge argument and then stamping a label on them. I actually think I got the question handed to me on Saturday: I spent about three hours arguing with a friend who's an analytical chemist, and neither of us could convince the other. Her lab has two Salinometers — same manufacturer, same production batch — and each one prints a reading plus a line of self-diagnostics, something like SELF-CHECK OK: THIS READING IS WITHIN 0.1%. Her technician's reasoning is: unit A says 3.2%, unit B says 3.2%, both self-checks come back OK, therefore both units are reliable. She says that's just ordinary calibration practice and there's nothing circular in it; I kept saying the second unit and the self-check are only evidence if you've already established something you haven't established, and that two units from the same batch aren't independent anyway — they can share a fault from a common source. We ended up arguing about whether the real issue is circularity, or the generality of the conclusion (this reading is accurate vs. this instrument is reliable), or whether closure is doing any work at all, and we never settled it.

  So: write me that exam question, a model answer of roughly 800 words, and a marking scheme. The question should have two parts: (i) a diagnosis part — does the technician know the units are reliable, what exactly has to be added to her evidence for her to know it, and does the self-check line or the second unit contribute anything given that both come from the same batch and the batch could be systematically off; and (ii) a short second part that stops them reciting — ask whether the difficulty is best located in closure, in the possibility of basic empirical knowledge, or in the relation between the process that produces the evidence and the content of the conclusion, and what it costs you to fix it whichever way you go. I'd also like the model answer to flag which of its moves are contested rather than presenting a consensus that doesn't exist, and to say something about the tempting move where a student says bootstrapping is fine because the many-readings version is just induction or inference to the best explanation — I want a top answer to have to say why that move does or doesn't dissolve the intuition, not just make it. No citations or reading lists please, this isn't a lit review: if someone name-drops a paper or a position without saying what the move actually is, that should cost them marks.

  For the marking scheme: 20 marks total, built around five must-hit points with the marks for each, a one-line note on how people typically get each one wrong, and a short note naming the specific moves that separate a first-class answer from a solid upper-second — the difference shouldn't be fluency or vocabulary, it should be whether they got a particular distinction right. Add a small list of things that lose marks regardless of how well the rest goes (e.g. answering a different question about skepticism, treating "the units agree" as obviously confirming without addressing the common-cause point, or saying something is circular without saying what circularity is supposed to be doing here). Finally, since I'm going to have to defend the answer key to my department: after the model answer, tell me how confident you are in each of the substantive philosophical claims it rests on, and single out the one you're least sure about.
