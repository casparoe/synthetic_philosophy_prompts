answer: |-
  # JOINT STATEMENT ON ACCURACY AND INQUIRY

  **Parties:** Proponents of Accuracy-First Epistemology (Accuracy) and Proponents of Zetetic Epistemology (Zetetic).
  **Audience:** Technical evaluators familiar with proper scoring rules, expected loss, and calibration, but unfamiliar with normative philosophy.
  **Purpose:** To isolate the precise mathematical and conceptual points of divergence regarding the norms governing belief and inquiry.

  ## 1. AGREED CLAIMS

  Both parties endorse the following fourteen claims. These establish the shared formal machinery and delimit the scope of the dispute. Terms are defined inline.

  1.  **Definition of Credence:** A credence function $P$ maps a set of possible worlds $\Omega$ (or propositions) to $[0,1]$. It represents an agent's doxastic state at a time $t$.
  2.  **Definition of Scoring Rule:** A scoring rule $S(P, \omega)$ assigns a real-valued score (loss or inaccuracy) to a credence function $P$ given the true world $\omega \in \Omega$. Lower scores indicate higher accuracy.
  3.  **Properness:** A scoring rule is *proper* if for any credence function $P$ and any alternative $Q$, $E_P[S(P, \omega)] \leq E_P[S(Q, \omega)]$. It is *strictly proper* if equality holds only when $Q=P$. Both parties agree that normative evaluation should utilize strictly proper scoring rules (e.g., Log Loss, Brier Score).
  4.  **Convexity:** Both parties agree that strictly proper scoring rules correspond to convex functions of the probability vector. This mathematical property guarantees that mixing credences (averaging) does not yield a better expected score than reporting one's true expectation.
  5.  **Domination vs. Expectation:** Both parties distinguish between *domination arguments* (a norm is required because violating it leads to worse scores in *all* possible worlds) and *expected-accuracy arguments* (a norm is required because violating it lowers expected score relative to the agent's current $P$). Both accept the validity of both argument types within their respective domains.
  6.  **Value of Free Evidence (Good's Theorem):** Both parties accept the theorem: If $S$ is strictly proper, and an agent can observe a partition of evidence $E$ at no cost, the expected inaccuracy of the posterior $P(\cdot | E)$ is no greater than the inaccuracy of the prior $P$. Formally: $E_P[E_{P(\cdot|E)}[S]] \leq E_P[S]$.
  7.  **Synchronic vs. Diachronic:** Both parties distinguish *synchronic norms* (constraints on $P$ at a single time $t$) from *diachronic norms* (constraints on how $P$ changes from $t_1$ to $t_2$, or on the sequence of inquiries undertaken).
  8.  **Admissibility of Measures:** Both parties agree that not all distance-from-truth measures are admissible. Measures that incentivize false reporting (improper rules) or violate logical coherence (e.g., penalizing logical truths) are rejected by both.
  9.  **Truth as a Constitutive Goal:** Both parties agree that truth (or proximity to truth) is the fundamental constitutive aim of belief. The dispute is not about *whether* truth matters, but about *what kind of entity* is primarily evaluated for its conduciveness to truth.
  10. **Existence of Process:** The Accuracy camp does not deny that inquiry processes exist or that they causally affect credences. The Zetetic camp does not deny that final credence states can be evaluated for accuracy.
  11. **Costs of Inquiry:** Both parties agree that inquiry (running experiments, attending to data) often incurs non-epistemic costs (time, resources). These costs can be modeled as additive terms in a loss function.
  12. **Calibration and Sharpness:** Both parties accept the decomposition of inaccuracy into *calibration* (do probabilities match frequencies?) and *sharpness/resolution* (are probabilities extreme?). A forecaster who always predicts the base rate is calibrated but unsharp.
  13. **Regularity Constraint (Clarification):** *Correction to a common premise:* The Accuracy camp generally holds that assigning $P(H)=1$ to a contingent proposition is a synchronic violation of probabilistic norms (regularity), not merely a practical hazard. Therefore, the "Dogmatist" case (see Section 2) describes an agent who is already normatively defective *before* she refuses to inquire.
  14. **Logical Omniscience:** Both parties acknowledge that standard formal models assume logical omniscience (agents know all logical consequences of their beliefs). Both agree this is an idealization that complicates the application of norms to bounded agents, but neither side treats this idealization as the source of the primary dispute between Accuracy and Zetetic frameworks.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the specific points of divergence. For each crux, we state the proposition each camp endorses, classify the disagreement, propose a shared test case, and record opposing predictions.

  | Crux | Accuracy Camp Proposition | Zetetic Camp Proposition | Type | Shared Test Case | Accuracy Prediction | Zetetic Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Dogmatist** | If an agent satisfies synchronic norms (Probabilism), norms on inquiry are purely instrumental to maximizing expected accuracy relative to current $P$. | There are categorical norms of inquiry that apply even when expected accuracy gain is zero or negative relative to current $P$. | **Genuine** (Normative Source) | **The Dogmatist:** An agent has $P(H)=0.99$ (admissible) but treats $H$ as settled. New evidence is available but costly. $E[\text{Accuracy Gain}] < \text{Cost}$. | The agent is permitted to ignore the evidence. No epistemic norm is violated. | The agent is required to inquire if $H$ is sufficiently important, regardless of $E[\text{Gain}]$. |
  | **2. The Lazy Calibrator** | A credence function is evaluated solely on its final accuracy properties (Calibration + Sharpness). Process history is irrelevant to the *state's* value. | The *policy* that generated the credence is the primary object of evaluation. A state reached by avoiding discrimination is defective even if calibrated. | **Genuine** (Object of Evaluation) | **The Lazy Calibrator:** Agent always reports base rate $b$. Never runs discriminating tests. Final score is good (calibrated), but resolution is low. | The agent is epistemically permissible, provided the cost of tests outweighed the value of resolution. | The agent is epistemically defective for failing to pursue resolution when capable, regardless of cost-benefit analysis. |
  | **3. The Lucky Guesser** | Two identical credence functions $P_1, P_2$ have identical epistemic value, regardless of etiology. Genealogy is irrelevant to synchronic evaluation. | Two identical credence functions have different epistemic value if one was formed via reliable inquiry and the other via guesswork. | **Verbal** (Definition of "Value") | **The Lucky Guesser:** Agent A computes $P$ via evidence. Agent B guesses $P$. Both match truth frequencies equally well over time. | Substantive question: Does "epistemic value" include reliability? Accuracy says No. | Substantive question: Does "epistemic value" include reliability? Zetetic says Yes. |
  | **4. The Slow Truth** | Diachronic accuracy is the sum (or discounted sum) of synchronic inaccuracies over time. Time taken is only a cost if it delays action. | The *tempo* of inquiry is itself a normative object. Taking a decade to solve a problem that could take a day is a distinct epistemic failure. | **Genuine** (Time Discounting) | **The Slow Truth:** Agent A solves problem in 1 day. Agent B solves in 10 years. Final $P$ is identical and true. | If B's total integrated inaccuracy is higher due to duration, B is defective. If not, B is permissible. | B is defective *because* the inquiry process was inefficient, independent of integrated score. |
  | **5. Scoring Rule Conventionality** | The choice of strictly proper scoring rule (e.g., Log vs. Brier) is conventional. Normative theorems should hold for the class of all strictly proper rules. | The choice of scoring rule encodes substantive values (e.g., Log Loss penalizes overconfidence more than Brier). This choice dictates inquiry norms. | **Genuine** (Parameter Sensitivity) | **Risk Sensitivity:** An agent must choose between a safe experiment (small update) and a risky one (large update). | Normative recommendation should be invariant across all strictly proper rules. | Normative recommendation may validly change depending on whether we prioritize avoiding false certainty (Log) vs. mean error (Brier). |

  ### Elaboration on Crux 1 (The Dogmatist)
  *   **Premise Correction:** The prompt suggests the Dogmatist has $P(H)=1$. As noted in Agreed Claim 13, Accuracy theorists typically forbid $P(H)=1$ for contingent $H$. If $P(H)=0.99$, Good's Theorem implies $E[\text{Gain}] > 0$ for *some* evidence partitions.
  *   **The Disagreement:** The Accuracy camp argues that if the *only* available evidence has $E[\text{Gain}] < \text{Cost}$, inquiry is optional. The Zetetic camp argues that certain questions *must* be pursued even if the expected accuracy return is negative (e.g., "fundamental questions").
  *   **Settlement Condition:** A formal proof that a specific inquiry norm (e.g., "investigate fundamental hypotheses") minimizes expected loss under *all* strictly proper scoring rules would move the Zetetic camp. A proof that such a norm *cannot* be derived from expected loss minimization without adding non-accuracy axioms would move the Accuracy camp.

  ### Elaboration on Crux 3 (The Lucky Guesser)
  *   **Verbal vs. Genuine:** This is verbal regarding the definition of "epistemic evaluation." If evaluation means "assessment of current map quality," Accuracy wins. If evaluation means "assessment of map-making practice," Zetetic wins.
  *   **Substantive Core:** The substantive question is whether epistemic norms are *forward-looking* (guide future inquiry) or *backward-looking* (assess current state).
  *   **Shared Test:** We agree to treat this as a definition choice. The substantive fight is over whether *guidance* norms (what should I do?) can be reduced to *assessment* norms (how good is my belief?). Accuracy says Yes; Zetetic says No.

  ## 3. CONDITIONS FOR UPDATING

  This section specifies what empirical or formal results would cause each camp to revise its position. We avoid normative claims about what *should* move us and state only what *would*.

  ### What Would Move the Accuracy Camp
  1.  **Impossibility Proof:** A demonstration that no strictly proper scoring rule, combined with any standard cost function for inquiry, can generate a norm requiring the investigation of a hypothesis when the expected accuracy gain is negative. (Current models suggest this is true; a formal proof would cement the divergence).
  2.  **Dutch Book for Inquiry:** A demonstration that an agent who follows Accuracy-derived inquiry norms (ignoring low-expected-value evidence) is susceptible to a diachronic Dutch Book (a guaranteed loss in utility or accuracy) that an agent following Zetetic norms avoids.
  3.  **Instability:** A demonstration that Accuracy-derived inquiry policies are unstable under reflection (i.e., the agent knows in advance that following the policy will lead to lower accuracy than violating it).

  ### What Would Move the Zetetic Camp
  1.  **Derivation:** A formal derivation of a core Zetetic norm (e.g., "Do not ignore salient evidence," "Prioritize high-impact questions") solely from the axioms of expected accuracy minimization, without smuggling in inquiry-specific premises.
  2.  **Redundancy:** A demonstration that every Zetetic norm can be mapped to a specific weighting of a proper scoring rule plus a time-discount factor, rendering the "inquiry" label redundant.
  3.  **Conflict with Truth:** A case where following a Zetetic norm (e.g., "investigate this question") systematically leads to lower long-term truth-conduciveness than following an Accuracy norm, without any compensating non-epistemic value.

  ## 4. FAILURE CONDITIONS

  This collaboration will be deemed a failure if the output satisfies any of the following conditions:

  1.  **The "Both Matter" Compromise:** If the final conclusion is merely that "accuracy is important for states and inquiry is important for processes" without specifying the *dependency relation* (i.e., whether one reduces to the other). We know both matter; the dispute is about fundamentality.
  2.  **Undefined Terms:** If terms like "epistemic value," "inquiry," or "norm" are used in Section 2 without the operational definitions provided in Section 1.
  3.  **Hidden Premises:** If an argument relies on a premise about the value of truth that is not explicitly encoded in the scoring rule $S$. (e.g., asserting that "understanding" has value without defining how understanding modifies $S$).
  4.  **Ignoring the Dogmatist:** If the final statement does not explicitly resolve whether an agent with $P(H)=0.99$ is *permitted* to ignore evidence with $E[\text{Gain}] < \epsilon$. This is the sharpest point of divergence.
  5.  **Ambiguity on Conventionality:** If the document does not take a stance on whether the choice of scoring rule (Log vs. Brier) is a conventional modeling choice or a substantive normative commitment.

  ## 5. CLOSING REMARK ON FORMALISM

  To the reader from machine-learning evaluation: You will notice that the "Accuracy" camp speaks your language (loss functions, expectations, admissibility). The "Zetetic" camp often speaks in terms of "virtues," "duties," and "salience."

  Do not interpret this linguistic difference as a difference in rigor. The Zetetic claim is that the loss function $S$ is incomplete. They argue that $S$ measures *fit*, but epistemic normativity also requires a measure of *effort* or *engagement* that is not reducible to the cost of computation.

  The Accuracy claim is that any such measure of engagement must ultimately cash out in terms of fit (accuracy) to be *epistemic* rather than *aesthetic* or *moral*.

  This document does not resolve that metaphysical question. It isolates it. If you can define a loss term $L_{\text{inquiry}}$ that captures the Zetetic intuition without violating propriety, you will have solved the problem. If you can prove such a term cannot exist, you will have solved it the other way. Until then, the disagreement remains precise, formal, and open.
