      *   *Hard Core:* Irrefutable commitments (e.g., "Scaling works," "Transformers are the way").
      *   *Protective Belt:* Auxiliary hypotheses, tweaks, engineering fixes to protect the core from anomalies.
      *   *Positive Heuristic:* What to do (build bigger, add layers).
      *   *Negative Heuristic:* What not to do (don't question the core).
      *   *Progressive:* Predicts novel facts, expands knowledge.
      *   *Degenerating:* Only explains past failures, ad-hoc fixes, no new predictions.
      *   *Application to Tech:* Tech stacks are like research programmes. AI scaling is a current example.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. It *is* a powerful lens for tech. Define the core components simply (Hard Core, Protective Belt, Progressive/Degenerating).
      *   **Interpreting Predictive Failures:** In Lakatos's view, failure isn't immediate death. It's expected. The key is *how* you handle it. If you fix it and learn something new, it's okay. If you just patch it to save face, it's trouble.
      *   **Auxiliary Hypotheses (The "Protective Belt"):** This is crucial for engineers. "We need more data," "We need a new loss function." When is this legitimate? When it leads to new capabilities. When is it costly? When it's just making the system complex to hide that the core idea isn't working. *Ad-hoc* vs. *Heuristic*.
      *   **Novel Predictions vs. Internal Coherence:** Lakatos is strict here. Coherence isn't enough. You need *novel content*. In tech terms: Does this stack enable *new* applications or just run old ones slightly cheaper/better? If it's just optimization without new capability, it might be degenerating.
      *   **Obligations of Practitioners:** This is the ethical/practical part. If you see degeneration, do you stop? Lakatos says don't abandon too soon (history shows comebacks). But you must acknowledge the state. Resource allocation should reflect the risk. Transparency is key.
      *   **Application to AI (Scaling vs. Architecture):** Map the concepts directly.
          *   Scaling Programme: Core = "Compute + Data = Intelligence." Belt = "Mixtures of Experts," "Better tokenizers."
