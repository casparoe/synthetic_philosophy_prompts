prompt: |-
  Eight months ago I was made lead of the three-person forecasting team at a regional flood-risk and water-resources agency. We produce seasonal outlooks that a board — two civil engineers, a hydrologist, and two elected members — signs off on, and that are then used to set reservoir release rules, to schedule levee works, and, in perhaps two years out of ten, to decide whether to evacuate. We refresh the models twice a year, and each refresh puts twenty to thirty candidate regularities in front of me, each of which somebody has to approve or reject in about twenty minutes.

  Last spring one of ours failed publicly. A model that had backtested beautifully against thirty-one years of record collapsed in its first live season, and the post-mortem could not say what we should have done differently: the pattern had genuinely been in the data, nobody had falsified it, and our usual tests — out-of-sample fit, cross-validation on held-out years, a holdout on the most recent decade — all passed. A friend sent me to Nelson Goodman, and I think I now see why: we had built the forecast on a predicate that fitted the record exactly as well as the ordinary one and that no amount of past data could have distinguished from it, a grue-style predicate whose content is fixed partly by where our own record ends. What I cannot do is turn that into something my team can actually run.

  What I need from you is a procedure, not an explanation: a written checklist my team can work through on any candidate regularity before it is allowed into a model. Give me the questions in a fixed order, what counts as a sufficient answer to each, the points at which the procedure terminates in a refusal to extrapolate, and the points at which it has to stop and hand the question to the board because what remains is a judgement about how much risk the agency will carry rather than a judgement about evidence. Mark the steps that are really judgement calls in procedural clothing, and have the analyst initial those.

  Constraints it has to respect:

  1. It must be written in the vocabulary we already use — features, deployment window, holdout period, sensor swaps, protocol revisions, interventions — and must not smuggle in philosophical terms my team would have to be taught before they could apply it.
  2. It must not rest on the thought that a grue-style predicate is somehow less well supported by the data we already have. It is not; my team will notice immediately if the procedure implies otherwise, and I will lose them. The procedure has to isolate whatever it is, besides past fit, that separates the pattern we may project from the pattern we may not.
  3. It must answer my deputy's standing objection. She says that appealing to how entrenched a predicate is — the ordinary colour predicate is projectible because predicates like it have been projected before — is institutional conservatism with a philosophical decoration, and that it would have told us to ignore every genuine regime shift in our record. Either answer her, or concede the point and say what replaces entrenchment in the checklist.
  4. It has to handle time-indexed features in general. Calendar year, row index, years since certification, firmware version, collected after the 2011 station move: each lets a model encode a grue-style predicate without anyone ever writing one down, and I cannot simply ban them, because several carry real signal about instrument drift and land-use change. Where is the line, and how do I tell which side of it a given feature falls on?
  5. It must say what to do when the information a step needs does not exist. We often cannot recover whether a sensor was recalibrated in 1994, or what the volunteer observer in 1978 actually recorded.
  6. It must tell me where it will misfire on data like ours: short overlapping series, instruments patched together across decades, a catchment we are ourselves altering with a bypass channel, and a board that reads any refusal to extrapolate as cowardice.

  Then apply it, step by step, to three candidates currently in my queue:

  (a) Turbidity spikes at a gauging station have preceded every recorded algal bloom in the reservoir by eleven to fourteen days, across thirty-four years. The turbidity sensor was replaced in 2011; before that the series comes from a different instrument with a different sampling frequency.

  (b) A gradient-boosted model that gets most of its skill from a single feature: the number of years since the measurement protocol was last revised. It increases monotonically, it correlates with nearly everything, and at deployment it will be one year larger than at any point in training.

  (c) The lower catchment has never produced two consecutive winters above the one-in-twenty flow. Our asset-management plan, already submitted to the regulator, treats this as a hard constraint on the maintenance schedule, and the board has built a budget bid around it. I suspect an honest procedure will tell me this is a predicate whose content is fixed by the length of our record rather than by the behaviour of the river. If that is what your procedure says, say so plainly, and tell me what, if anything, I can put in front of the board in its place.

  Finally, tell me what the procedure cannot do. I do not want a checklist that lets the board feel the problem has been handled, when the part that actually bites — that we are extrapolating into a catchment we are in the middle of changing — is the part no checklist settles.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Lead of a three-person forecasting team at a regional flood-risk/water-resources agency.
      *   **Task:** Create a written checklist/procedure for evaluating candidate regularities (features/patterns) before they enter a model.
      *   **Context:** Seasonal outlooks used for reservoir releases, levee works, and evacuations. High stakes. Board approval required.
      *   **Problem:** A model failed last spring despite passing standard tests (out-of-sample, cross-validation). The user identifies this as a "Grue-style" problem (Goodman's New Riddle of Induction) – a pattern fits past data perfectly but relies on a predicate defined by the end of the record (time-indexed/contingent).
      *   **Constraints:**
          1.  **Vocabulary:** Use agency terms (features, deployment window, holdout, sensor swaps, etc.), *no* philosophical jargon (no "grue," "projectible," "entrenchment").
          2.  **Epistemic Honesty:** Cannot claim the "grue" predicate fits past data worse. It fits equally well. The distinction must be about *extrapolation validity*, not *past fit*.
          3.  **Deputy's Objection:** Address the "entrenchment = conservatism" argument. Don't just say "we've used this before." Acknowledge regime shifts.
          4.  **Time-Indexed Features:** Distinguish between valid time-features (drift, land-use) and invalid ones (artifacts of the record's end).
          5.  **Missing Data:** Handle cases where metadata (calibration logs, observer notes) is missing.
          6.  **Failure Modes:** Acknowledge where the procedure will misfire (short series, changing catchment, board pressure).
          7.  **Output:** A checklist with fixed order, sufficient answers, termination points (refusal vs. board escalation), and analyst initialing for judgment calls.
          8.  **Application:** Apply the checklist to three specific candidates (Turbidity/Algal, Protocol Revision Years, Consecutive Winters).
          9.  **Limitations:** Explicitly state what the procedure *cannot* do.

  2.  **Develop the Procedure (The "Extrapolation Stability Protocol"):**

      *   *Goal:* Distinguish between mechanisms that persist into the deployment window and artifacts that terminate with the training record.
      *   *Core Concept:* Instead of "entrenchment," use "Mechanism Continuity." Does the physical or operational cause of the correlation exist in the future deployment window?
      *   *Addressing the Deputy:* We aren't rejecting new patterns; we are rejecting patterns where the *cause* is the history of the measurement itself, not the hydrology.
      *   *Addressing Time-Features:* Differentiate between "Clock Time" (arbitrary) and "Process Time" (wear, accumulation, policy).
      *   *Structure:*
          1.  Mechanism Identification.
          2.  Deployment Window Continuity.
          3.  Measurement System Stability.
          4.  Intervention/Management Overlap.
          5.  Risk Escalation.

      *   *Drafting the Steps (incorporating constraints):*
          *   Step 1: Causal Mechanism. (What drives this?)
          *   Step 2: Future State. (Does that driver exist in the deployment window?)
          *   Step 3: Measurement Integrity. (Did sensor swaps break the link?)
          *   Step 4: Time-Dependency. (Is "time" a proxy for drift or just an index?)
          *   Step 5: Missing Metadata handling. (Default to conservative assumption).
          *   Step 6: Board Escalation. (When evidence runs out, transfer risk ownership).

  3.  **Refining the Vocabulary (Constraint 1 & 2):**

      *   Avoid: "Grue," "Projectible," "Entrenchment," "Induction."
      *   Use: "Deployment Window," "Training Record," "Physical Driver," "Instrument Artifact," "Regime Shift," "Operational Continuity."
      *   *Crucial distinction:* The "Grue" problem is essentially about *counterfactual stability*. If we had stopped collecting data 5 years ago, would the rule still hold for *today*? If the rule depends on "data collected before 2023," it fails. If it depends on "soil saturation," it passes.
      *   *Reframing Entrenchment:* It's not "we used it before." It's "the physical system hasn't changed in a way that breaks this."

  4.  **Addressing the Deputy (Constraint 3):**

      *   The checklist must allow for regime shifts. If a new dam was built, old rules break. The checklist asks: "Has the physical system changed?" If yes, old patterns die. This validates the deputy's concern about conservatism while filtering out "Grue" patterns (which rely on the *record* ending, not the *system* changing).

  5.  **Handling Time-Features (Constraint 4):**

      *   Distinguish "Index Time" (Year 1, Year 2) from "Process Time" (Years since maintenance).
      *   Test: If we shifted the start date of the record, does the feature value change for the same physical moment?

  6.  **Handling Missing Data (Constraint 5):**

      *   If we don't know if a sensor was calibrated, we must assume it wasn't stable. Burden of proof is on stability.

  7.  **Drafting the Checklist:**

      *   *Format:* Step, Question, Pass/Fail Criteria, Action.
      *   *Judgment Calls:* Mark these for initialing.

  8.  **Applying to Candidates:**

      *   *(a) Turbidity/Algal:* Sensor swap in 2011. 34 years record.
          *   Issue: Is the correlation physical (sediment -> nutrients) or instrumental (old sensor quirks)?
          *   Check: Calibration metadata. If missing, high risk.
      *   *(b) Protocol Revision Years:* "Years since protocol revised."
          *   Issue: This is pure "Grue." It counts up forever. It correlates because everything drifts over time, but the *number* itself has no physical force in the future.
          *   Check: Deployment window value is outside training range (extrapolation).
      *   *(c) Consecutive Winters:* "Never two consecutive >1-in-20 flow."
          *   Issue: This is a record-length artifact. "Never happened *yet*."
          *   Check: Physical constraint? No. Statistical artifact? Yes.
          *   Action: Board escalation. This is risk appetite, not science.

  9.  **Defining Limitations (Constraint 6 & Final Request):**

      *   The checklist cannot fix a changing catchment.
      *   It cannot protect against board pressure.
      *   It cannot generate data that doesn't exist.
      *   It shifts liability, it doesn't eliminate uncertainty.

  10. **Review and Refine:**

      *   *Tone:* Professional, operational, direct. No academic posturing.
      *   *Check:* Did I use the word "Grue"? No.
      *   *Check:* Did I address the deputy? Yes, via "Physical Driver" vs "Record Artifact."
      *   *Check:* Is the distinction clear? The distinction is between *mechanisms that persist* and *definitions that expire*.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "find a physical mechanism." Sometimes statistical relationships exist without known mechanisms (black box). The key is *stability of the measurement system*. If the feature relies on the *boundary* of the dataset, it's unstable.
      *Refinement on Step 4 (Time):* Make sure to distinguish between "Time as a proxy for aging" (valid) vs "Time as a counter" (invalid).
      *Refinement on Deputy:* Explicitly state that "New Mechanism" beats "Old Pattern."

  11. **Final Polish:** Ensure the formatting matches the request (checklist, application, limitations). Ensure the "Analyst Initial" requirement is included.

      *(Final thought on the "Grue" translation)*: In agency speak, a "Grue" predicate is a "Boundary-Dependent Feature." It works only because the training record stops where it does. A "Green" predicate is a "State-Dependent Feature." It works because of the state of the water/catchment. The checklist must filter Boundary-Dependent Features.

      *(Final thought on Candidate C)*: This is the hardest. It's a negative existential ("Never happened"). The procedure must flag this as "Record-Limited." The board must own the risk of it happening next.

      *(Final thought on Limitations)*: Be brutal. This checklist is a liability shield and a thinking aid, not a truth machine.

      *Let's write it.*
answer: |-
  # EXTRAPOLATION STABILITY PROTOCOL (ESP-v4)
  **Agency:** Regional Flood-Risk & Water-Resources Agency
  **Owner:** Forecasting Team Lead
  **Application:** Candidate Feature/Regularity Review
  **Constraint:** All candidate regularities must pass Steps 1–4 before entering the model ensemble. Steps 5–6 determine risk ownership.

  ---

  ## PART 1: THE CHECKLIST

  **Instructions:** Complete one form per candidate regularity. If any step results in a **STOP**, the feature is rejected for the current deployment window. If a step requires a judgment call where metadata is incomplete, the analyst must initial the decision.

  ### Step 1: Mechanism Identification
  **Question:** What physical, operational, or hydrological process generates the correlation between this feature and the target variable?
  *   **Sufficient Answer:** A description of the causal chain (e.g., "Precipitation increases soil saturation, which increases runoff coefficient") OR a documented operational rule (e.g., "Protocol X mandates release when Y is reached").
  *   **Insufficient Answer:** "It correlates in the training record" or "The algorithm selected it."
  *   **Termination:** If no mechanism can be articulated, **STOP**. Reject feature.
  *   **Judgment Call:** If the mechanism is plausible but unproven (e.g., suspected biological link), Analyst must initial here. `[______]`

  ### Step 2: Deployment Window Continuity
  **Question:** Does the mechanism identified in Step 1 persist unchanged into the deployment window (the future period the forecast covers)?
  *   **Sufficient Answer:** Confirmation that no known interventions, land-use changes, or infrastructure projects alter the mechanism during the deployment window.
  *   **Insufficient Answer:** "It held for the last 30 years." (Past stability does not guarantee future continuity).
  *   **Termination:** If a known intervention (e.g., new bypass channel, dam upgrade) breaks the mechanism during the deployment window, **STOP**. Reject feature.
  *   **Judgment Call:** If intervention impact is uncertain but likely minor, Analyst must initial here. `[______]`

  ### Step 3: Measurement System Stability
  **Question:** Is the feature value derived from a measurement system that remains consistent between the training record and the deployment window?
  *   **Sufficient Answer:** Documentation showing no sensor swaps, firmware updates, or protocol revisions that alter the scale, bias, or frequency of the data *unless* a homogenization adjustment has been applied and validated.
  *   **Insufficient Answer:** "The data looks continuous."
  *   **Termination:** If a sensor swap or protocol revision occurred and no homogenization adjustment exists, **STOP**. Reject feature.
  *   **Missing Data Protocol:** If calibration logs or revision history are missing for >10% of the training record, assume instability. **STOP**. Reject feature.
  *   **Judgment Call:** If homogenization was applied using a method not standard to the agency, Analyst must initial here. `[______]`

  ### Step 4: Time-Dependency Test (The "Shift" Test)
  **Question:** If the start date of our training record were shifted by five years, would the feature values for the *same physical events* change?
  *   **Sufficient Answer:** "No." (e.g., Flow rate is flow rate regardless of when we started measuring).
  *   **Insufficient Answer:** "Yes." (e.g., "Years since 1990" changes value if we start counting from 1995).
  *   **Termination:** If the feature value depends on the arbitrary start date of the record or the current date relative to the record end, **STOP**. This is a boundary-dependent feature.
  *   **Exception:** Time-indexed features are allowed *only* if they measure cumulative physical wear or policy time (e.g., "Years since last dredging") AND pass Step 2.
  *   **Judgment Call:** If the feature is a proxy for an unmeasured drift (e.g., "Year" proxying for "Urbanization"), Analyst must initial and provide the physical proxy justification. `[______]`

  ### Step 5: Negative Existential Check
  **Question:** Does the regularity rely on an event *never* having occurred in the record (e.g., "Never exceeded X," "No consecutive years of Y")?
  *   **Sufficient Answer:** "No." The rule is based on observed positive instances.
  *   **Insufficient Answer:** "Yes." (e.g., "We have never seen two wet winters in a row").
  *   **Action:** Do not reject, but **ESCALATE**. This is not a statistical regularity; it is a statement of record length.
  *   **Procedure:** Flag for Board Review (Step 6).

  ### Step 6: Risk Ownership Transfer
  **Condition:** Triggered if Step 5 is "Yes," OR if Step 1–4 required Analyst Judgment Calls that increase uncertainty.
  **Action:** The feature may be included *only* if the Board explicitly accepts the risk of extrapolation.
  **Requirement:** A written memo must accompany the forecast stating: "This feature relies on [Specific Uncertainty]. If this regularity fails, the error margin on [Decision Variable] increases by [Estimate]."
  **Sign-off:** Board Chair and Agency Director must sign.

  ---

  ## PART 2: APPLICATION TO CANDIDATES

  ### Candidate (a): Turbidity Spikes Preceding Algal Blooms
  *   **Claim:** Turbidity spikes precede blooms by 11–14 days (34-year record).
  *   **Step 1 (Mechanism):** Plausible. Sediment load often carries nutrients (phosphorus/nitrogen) that trigger blooms. *Analyst Initial: [______]*
  *   **Step 2 (Continuity):** Reservoir biology is stable, but nutrient loading sources (agriculture) may have changed. Assume pass for now.
  *   **Step 3 (Measurement):** **FAIL.** Sensor replaced in 2011. Different instrument, different sampling frequency.
      *   *Check:* Do we have a cross-calibration study between the pre-2011 and post-2011 sensors?
      *   *Scenario A (Yes):* If a homogenization adjustment was applied and validated against water samples, proceed.
      *   *Scenario B (No):* If we are treating the two series as one continuous line without adjustment, **STOP**. The correlation may be an artifact of the pre-2011 sensor's specific drift or noise profile.
      *   *Missing Data:* If calibration logs for the 2011 swap are missing, **STOP** per Missing Data Protocol.
  *   **Verdict:** **Rejected** unless homogenization documentation is produced. If produced, requires Analyst Initial on Step 3.

  ### Candidate (b): Years Since Protocol Revision
  *   **Claim:** Gradient-boosted model relies on "Years since measurement protocol last revised."
  *   **Step 1 (Mechanism):** **FAIL.** There is no physical mechanism where the *number of years* since a paperwork revision causes river flow.
      *   *Counter-argument:* It correlates because protocols are revised when things go wrong, or instruments drift over time.
      *   *Rebuttal:* If instruments drift, use "Instrument Age." If protocols change due to errors, use "Error Rate." "Years since revision" is a counter, not a driver.
  *   **Step 4 (Time-Dependency):** **FAIL.** This is a boundary-dependent feature.
      *   *Test:* If we started our record 5 years later, the "Years since revision" value for the 2024 season would be different, even if the river is identical. The feature value is defined by the calendar, not the catchment.
      *   *Extrapolation:* At deployment, this value will be higher than any value in the training set (monotonic increase). This is pure extrapolation.
  *   **Verdict:** **Rejected.** This is a "Grue-style" predicate in operational clothing. It fits the past because the counter counted up in the past. It offers no guarantee for the future.

  ### Candidate (c): No Consecutive High-Flow Winters
  *   **Claim:** Lower catchment has never produced two consecutive winters >1-in-20 flow.
  *   **Step 1 (Mechanism):** **FAIL.** Is there a physical reason (e.g., groundwater depletion) preventing two wet years?
      *   *Analysis:* Unlikely. This is statistically probable in a short record but physically unsupported.
  *   **Step 5 (Negative Existential):** **TRIGGERED.** The rule relies entirely on an event *never* occurring ("Never two consecutive").
  *   **Step 6 (Risk Ownership):** **ESCALATE.**
      *   *Reasoning:* This is not a forecast; it is a gamble on record length. The regularity is "fixed partly by where our own record ends."
      *   *Action:* Do not put this in the model as a constraint.
      *   *Board Memo:* "The historical record shows no consecutive high-flow winters. However, there is no physical mechanism preventing this. Relying on this pattern assumes the future will not exceed the past variance. If two consecutive high-flow winters occur, the maintenance schedule will be compromised."
      *   *Requirement:* Board Chair must sign off on the risk of schedule failure.
  *   **Verdict:** **Escalated.** Cannot be used as a hard model constraint without Board risk acceptance.

  ---

  ## PART 3: LIMITATIONS AND FAILURE MODES

  You asked what this procedure cannot do. It is a filter, not a generator of truth.

  1.  **It Cannot Fix a Changing Catchment:**
      If we are altering the catchment (bypass channels, urbanization), Step 2 will flag the break, but it cannot tell you what the *new* relationship is. It will force you to reject the old model, leaving you with *no* model. This is correct, but it will look like incompetence to the Board. You will have to tell them: "The river has changed; our history no longer applies."

  2.  **It Cannot Compensate for Missing Metadata:**
      Step 3 forces a rejection if calibration logs are missing. This protects against false precision, but it discards data. In a data-poor environment, this procedure will reduce your skill score. You are trading accuracy for defensibility.

  3.  **It Cannot Prevent Board Overrule:**
      Step 6 allows the Board to accept the risk. They can sign the memo and order you to use Candidate (c) anyway. This procedure does not give you veto power; it gives you a paper trail. It ensures that if the model fails, the post-mortem will show that the risk was flagged and accepted by governance, not hidden by analysts.

  4.  **It Cannot Distinguish "New Regime" from "Bad Data":**
      Your deputy is right to worry about conservatism. If a genuine regime shift has occurred (e.g., climate change altering rainfall seasonality), Step 2 might reject a feature that is actually the *start* of a new valid pattern. This procedure favors stability. It is designed to prevent catastrophic failure (evacuation errors), not to maximize discovery of new hydrological behaviors. It biases toward Type II errors (missing a signal) to avoid Type I errors (false confidence).

  5.  **It Cannot Solve the "Grue" Problem Philosophically:**
      This checklist does not prove why "Green" is better than "Grue." It simply operationalizes the distinction as "State-Dependent" vs. "Boundary-Dependent." If a clever analyst constructs a Boundary-Dependent feature that passes Step 4 (e.g., by hiding the time index inside a complex interaction term), this checklist might miss it. It relies on analyst honesty in Step 1.

  **Final Note:**
  This procedure shifts the burden of proof. Currently, the burden is on you to prove a model *won't* fail. This checklist places the burden on the feature to prove it *belongs* in the future. When you present this to the Board, do not present it as a way to make better forecasts. Present it as a way to ensure that when a forecast fails, we know *why*, and that we are not betting public safety on artifacts of our own filing system.
