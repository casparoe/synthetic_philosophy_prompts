answer: |-
  The implicit theory that makes this practice coherent is a **normative commitment model** of assertion, rather than a descriptive psychological one. On this view, when you assert $p$, you are not merely reporting your mental state; you are undertaking a responsibility for the truth of $p$ within the conversational "common ground." You are issuing an invitation for others to accept $p$ based on your authority, effectively offering a warranty that $p$ is true.

  This explains the asymmetry. Moore's paradox ("$p$ but I don't believe $p$") is pragmatically incoherent because it severs the link between the speaker's authority and the proposition at the moment of offer. By asserting $p$, you imply you are prepared to stand behind it; by simultaneously denying belief, you revoke the warranty before the transaction completes. It is a performative contradiction: you are asking others to accept $p$ while explicitly stating you lack the requisite stance to recommend it. The commitment is undermined *constitutively*.

  Post-hoc hedging, however, operates differently because it occurs sequentially. When you assert $p$ and later retreat to "I think so" upon challenge, you are not contradicting your initial move; you are **renegotiating the status** of that move. The conversation shifts from establishing facts to calibrating trust. You are acknowledging that your initial commitment was too strong for the evidence available, reclassifying the assertion from a flat-out claim to a qualified one. This is a repair mechanism, not a contradiction. You remain on the hook for $p$'s truth, but you lower the stakes of your personal guarantee. The initial assertion was a bid for common ground; the hedge is a modification of the terms under which that bid stands.

  If we replaced this with a **simple credal view** (asserting $p$ = expressing credence > threshold $t$), the practice becomes harder to justify. On a credal view, Moore's sentence is simply a lie or a contradiction of expressed mental states ("My credence is >0.9 but not >0.9"). While this explains the absurdity, it mishandles the retraction. If assertion is just reporting a credence level, then retreating to "I only believe probably" admits that the initial report was *false*. You misrepresented your mind.

  But in practice, we don't treat hedging as admitting a lie; we treat it as adjusting the normative force. A credal view forces us to say the speaker made an error in the first move. The commitment model allows that the first move was a valid *attempt* to establish truth that was subsequently downgraded due to interlocutor pressure. To preserve the permissibility of post-hoc hedging without treating it as an admission of deceit, we must view assertion as a normative stance (taking responsibility) rather than a descriptive snapshot (reporting credence). The Moorean violation breaks the normative stance instantly; the hedging repair adjusts it dynamically. A purely credal account lacks the normative flexibility to explain why the conversation rolls on rather than collapsing into an accusation of dishonesty.
