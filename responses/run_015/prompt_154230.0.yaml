  The cost of this verdict is losing the clean dichotomy between replicators and vehicles. You must accept that units of selection are hierarchical and context-dependent, not exclusive. This complicates the bookkeeping. In Case One, your friend claims group-level patterns are just gene-level sums. If (3) is false, the group is a genuine unit because colony-level traits vary and inherit independently of specific gene combinations. The descriptions are not merely equivalent; they capture different causal structures. Denying this reduces rich biological interactions to mere accounting, missing how selection actually shapes colonial organization. You lose the simplicity of a single universal unit but gain explanatory power for complex social structures.

  Regarding Case Two, my diagnosis predicts that organisms without sequestered germ lines can still be units of selection if mechanisms exist to suppress cell-level conflict. Germ sequestration is an adaptation to maintain organism-level unity, not a precondition for it. Plants are units despite lacking early sequestration because developmental constraints align cell fitness with organism fitness. Your friend's bullet-biting suggests only animals count, which contradicts the evolutionary success of plants. Rejecting (3) allows you to see germ sequestration as a solution to the problem of cell-level selection, rather than the definition of organismhood. This maintains consistency across kingdoms.

  What would change my mind is evidence that organism-level fitness is always perfectly reducible to gene-level fitness without remainder. If every organismic trait's survival value could be exhaustively explained by specific gene frequency changes without referencing organismal survival, then organism-level adaptation would indeed be mere shorthand. My reading is most likely wrong if developmental systems theory shows that genes never determine traits independently of cellular context, making the gene itself an unstable unit. If genes rely on organisms to replicate just as much as organisms rely on genes, then privileging genes as the sole unit is arbitrary. I would then shift my rejection to Step (5), accepting that organisms are units but denying that adaptations must be cashed out in gene-level bookkeeping. This would preserve functional language while acknowledging the interdependence of levels. Furthermore, if empirical studies showed that group selection events are vanishingly rare compared to gene selection, I might concede that genes are the primary unit, forcing me to reconsider the strength of Step (3)'s fidelity claim.

