answer: |-
  The popular slogan "Bell's theorem proves the universe is nonlocal" is a convenient shorthand, but like most shorthands, it conceals the machinery required to make it work. It suggests a binary choice: accept locality or accept quantum mechanics. The reality is a trilemma. Bell's inequality is not derived from locality alone; it is derived from the conjunction of three distinct assumptions. To save any one of them, you must sacrifice at least one of the others.

  The three assumptions are Parameter Independence (PI), Outcome Independence (OI), and Measurement Independence (MI). Parameter Independence states that the probability of Alice's outcome does not depend on the *setting* Bob chooses. Outcome Independence states that the probability of Alice's outcome does not depend on the *outcome* Bob obtains. Together, PI and OI constitute what we colloquially call "Bell Locality." The third assumption, Measurement Independence, posits that the hidden variables describing the particle pair are statistically independent of the settings the experimenters choose to measure.

  Quantum mechanics navigates this trilemma by satisfying Parameter Independence but violating Outcome Independence. This is why entanglement cannot be used for faster-than-light signaling (preserving PI) while still producing correlations that defy local explanation (violating OI). The question is not whether we must give up something, but *what* we can afford to lose. We have three escape routes: Superdeterminism (drop MI), Pilot-Wave theories like Bohmian mechanics (drop PI), or Standard Quantum Mechanics (drop OI). Weighing these options reveals that Measurement Independence is the assumption we should be most terrified to abandon. Consequently, we must accept that the universe violates Outcome Independence. The slogan is right, but for a specific reason: we value the scientific method more than we value local separability.

  To understand why Measurement Independence is the bedrock, we must first look at the cost of discarding it. Dropping MI leads to Superdeterminism. In this view, the hidden variables determining the particle's behavior are correlated with the experimenter's choice of measurement settings. This correlation could arise from a common cause in the distant past or a fundamental law linking mind and matter. On paper, this saves locality perfectly. It allows for a local, deterministic universe where Bell's inequalities are violated simply because the sample of measurements tested was never representative.

  However, the price of Superdeterminism is the viability of science itself. The scientific method relies on the assumption of experimental free choice, or at least statistical independence. When we test a drug, we assume the assignment of patients to control and treatment groups is independent of their underlying physiology. If we allow that the "settings" of an experiment can be conspiratorially correlated with the "hidden variables" of the system, we lose the ability to isolate causes from effects. A Superdeterministic universe could mimic any theory, including false ones, by correlating our measurements to hide the truth. While not logically impossible, Superdeterminism is methodologically nihilistic. It saves locality by burning down the laboratory.

  The second escape route is to drop Parameter Independence. This is the path taken by Bohmian mechanics. Here, the universe is deterministic and real, but explicitly nonlocal. The pilot wave guiding a particle depends instantaneously on the configuration of all other particles, including those light-years away. In Bohm's theory, Alice's outcome *does* depend on Bob's setting, violating PI. However, the theory is constructed so that this dependence cannot be controlled to send a signal, empirically masking the violation.

  Dropping PI saves realism and determinism, but it wounds Special Relativity. While Bohmian mechanics avoids empirical contradictions with relativity (no signaling), it requires a preferred reference frame to define the order of instantaneous updates. It treats relativistic spacetime as an emergent illusion rather than a fundamental structure. This is a heavy metaphysical tax. It forces us to accept that while the universe *looks* relativistic to every possible observer, it is fundamentally Newtonian in its causal structure. We keep a form of locality (in the sense of a continuous field), but we sacrifice the relativistic prohibition on absolute simultaneity.

  The third route is the standard quantum mechanical approach: keep PI and MI, but drop Outcome Independence. This is the option most physicists accept by default, often without realizing it is a choice. Here, Alice's outcome does not depend on Bob's *setting* (preserving causality and relativity), and the settings are free (preserving science). However, Alice's outcome *does* depend on Bob's *outcome*. The two particles do not possess separate, well-defined states prior to measurement; they form a single, non-separable system.

  Critics often argue that violating OI is just "nonlocality with the lights off." If the outcomes are correlated in a way that isn't explained by the shared past state, isn't that action-at-a-distance? In a sense, yes. But it is a "passive" nonlocality rather than an "active" one. It implies holism: the universe is not built from independent local parts that interact, but from global states that manifest locally. This violates our classical intuition about separability—the idea that what happens here should only depend on what is here. But it does not violate causality, and it does not undermine experimental practice.

  So, which assumption is the one we should be most scared to give up? It is Measurement Independence.

  The reasoning is hierarchical. Parameter Independence protects the causal structure of spacetime; without it, Special Relativity is fundamentally false, even if empirically robust. Outcome Independence protects our classical intuition about objects having independent existences; without it, the world is holistic and weird, but causality holds. Measurement Independence protects the logic of inference itself; without it, we cannot trust that our experiments tell us anything about the world independent of our intervention.

  If we drop OI, we live in a spooky, entangled universe where parts are defined by the whole. If we drop PI, we live in a universe with a hidden absolute time. But if we drop MI, we live in a universe where we can never know which of those is true. Superdeterminism is a "get out of jail free" card that invalidates the game. Therefore, to preserve the possibility of physics, we must hold MI sacred. Since we must also hold PI sacred to preserve the spirit of Relativity and prevent signaling paradoxes, the bullet we must bite is Outcome Independence. The slogan "Bell proves nonlocality" is justified, provided we understand it as "Bell proves Outcome Nonlocality." We must accept that nature is not locally separable.

  This verdict rests on the prioritization of scientific methodology over ontological comfort. However, my reasoning is not immune to revision. There are two specific developments that would flip this verdict.

  First, if a Superdeterministic model were constructed that demonstrated how scientific inference could remain valid despite the violation of Measurement Independence. Currently, the argument against Superdeterminism is that it makes science impossible *in principle*. If a theorist could show a mechanism where the correlations between settings and hidden variables are constrained enough to allow for reliable induction in macroscopic experiments while still resolving Bell violations, the "methodological nihilism" objection would collapse. If Superdeterminism could be shown to be testable or falsifiable itself, it would become a live competitor rather than a philosophical refuge.

  Second, my preference for keeping Parameter Independence relies on the assumption that a preferred reference frame is a greater cost than holism. If a fully Lorentz-invariant version of Bohmian mechanics were successfully formulated—one that did not require a hidden preferred frame but still maintained deterministic trajectories—the cost of dropping PI would plummet. Currently, Bohmian mechanics pays a high price in relativistic compatibility. If that price were removed, the trade-off between "holistic indeterminism" (Standard QM) and "deterministic nonlocality" (Bohm) would become a matter of aesthetic preference rather than structural necessity.

  Until one of those breakthroughs occurs, Measurement Independence remains the line in the sand. We can tolerate a universe that is holistically connected. We cannot tolerate a universe that conspires to hide its laws from us. Bell's theorem forces us to give up locality, specifically Outcome Independence, because the alternative is to give up the very logic we use to understand the theorem in the first place.
