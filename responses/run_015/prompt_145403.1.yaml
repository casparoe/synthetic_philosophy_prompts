answer: |-
  The dust motes in Mr. Henderson's physics class danced in a shaft of afternoon light. Elara had watched them for three weeks. They didn't drift randomly. They traced the exact same elliptical path, resetting every time the minute hand clicked to 2:14 PM.

  It wasn't déjà vu. Déjà vu is a glitch in the brain; this was a glitch in the world.

  Elara rested her chin on her palm, watching a speck of dead skin float down, pause, and snap back up to the top of the light beam. She remembered reading about Kurt Gödel in a library book she wasn't supposed to have. *The Rotating Universe.* He had proven that if the cosmos spun just right, time wouldn't be a line. It would be a circle. You could fly a rocket ship far enough and arrive yesterday. But here, in this quiet town nestled in a valley that felt a little too bowl-shaped, there were no rocket ships. The town itself was the ship.

  The universe was spinning, and they were all riding the carousel.

  Everyone else slid off the ride when the bell rang, resetting with the rest of the matter. Their memories were wiped clean like chalkboards. But Elara's mind felt unmoored, an anchor dragging along the bottom of the loop. She remembered yesterday's lunch. She remembered the day before that. She remembered the same raindrop hitting the windowsill forty times.

  If time was an illusion, as Gödel suggested, then the past wasn't gone. It was just a place you hadn't walked to yet. But if you were the only one walking, did it matter?

  She took out a notebook. The paper was rough, textured like cotton. She uncapped her pen. The ink was blue, vivid against the white.

  *Don't trust the clock,* she wrote.

  She stared at the words. She was writing to the Elara of yesterday, the one who would find this note tucked inside her textbook when the loop reset. But causality was heavy here. It resisted.

  As she watched, the ink began to shimmer. It wasn't drying; it was moving. The letters *Don't trust* curled like smoke. They untangled themselves and reformed. The shapes grew sharper, more angular. They looked like Cyrillic, but not quite. They looked like the notation from the calculus textbook she was supposed to get next year, mixed with the symbols of a language she hadn't invented yet.

  She blinked. The words were gone. In their place was a single, complex glyph that pulsed faintly, like a slow heartbeat.

  Elara frowned. She turned the page. She had to be simpler. More direct. She had to prove she existed outside the spin.

  *We are seperate,* she wrote.

  She paused, realizing she had missed the *a*. *Seperate.* A small human error in a perfect geometric prison. She liked the mistake. It felt like proof of life.

  The ink pooled. The word *seperate* began to boil. The letters detached from each other, floating like tiny black boats on a blue sea. They rotated, mimicking the universe outside. Then, they sank into the paper fibers and rose up as something else entirely.

  It wasn't English. It wasn't any human script. It looked like the pattern of cracks on a dried riverbed, or the veins of a leaf. It was a language of physics, not people. It was the universe speaking back, telling her that *separation* was the lie. There was no "her" and "past her." There was only the block, the solid chunk of existence where everything happened at once.

  The glyph pulsed again, faster this time.

  Elara felt a headache bloom behind her eyes, a pressure like deep water. The causality was scrambling the message because the message was impossible. You cannot warn yourself if the warning is what causes the danger. You cannot separate yourself from time if you are made of time.

  She looked around the classroom. Mr. Henderson was writing an equation on the board. *E = mc².* He wrote it the same way every loop. A girl in the front row sneezed at 2:16 PM. A car honked outside, a perfect C-sharp.

  They were all asleep inside the dream. Only Elara was awake, and being awake felt like drowning.

  She closed the notebook. The glyph on the page stopped pulsing and settled into a dull, static gray. It would be there tomorrow. Or rather, it would be there again today.

  If Gödel was right, time wasn't real. It was just another dimension of space, like height or width. The past wasn't lost; it was just *over there.* But you couldn't visit it without changing the shape of the room, and the room refused to change.

  Elara capped her pen. She wouldn't try to send a message again. The universe would just translate her fear into math she couldn't read.

  Instead, she watched the dust motes. They were starting their descent again. The light was shifting from gold to orange. The loop was tightening.

  She was alone. That was the only thing that felt objective. The loneliness didn't reset. It accumulated, layer upon layer, like sediment at the bottom of a spinning bowl.

  "Elara?" Mr. Henderson asked, turning from the board. "The answer?"

  She looked at the clock. 2:17 PM. The loop was fresh.

  "I don't know," Elara said softly.

  She knew the answer. The answer was that the question didn't matter. The question was a line, and she was living in a circle. She traced the edge of her desk with her thumb, feeling the wood grain. It was rough, real, and separate from the spin.

  For now, that would have to be enough.
