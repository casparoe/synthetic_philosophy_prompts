answer: |-
  Imagine a void containing only two perfect spheres, suspended exactly two metres apart, sharing identical mass, charge, and internal structure, yet distinguished by a 'modal scar': one sphere bears the intrinsic mark of having been the subject of a counterfactual crushing that never physically occurred, while the other remains unscarred. This scar alters no force, casts no shadow, and influences no future state; it is presented here as neither a relation to the other sphere, nor a mark of time, nor a causal power, but a sheer, intrinsic fact of identity, like a watermark on the substance of the object that no instrument can read.

  I defend Leibniz's Principle of Identity of Indiscernibles by asserting that this purported 'modal scar' is not a genuine intrinsic property but collapses into a disguised relational property. To possess a scar from a counterfactual event is simply to stand in a specific relation to a possible world wherein that crushing occurs; it is a difference in modal profile, not a difference in primitive substance. Consequently, the spheres are not numerically distinct despite sharing all qualities; rather, they are qualitatively discernible because one holds the property 'possibly-crushed' while the other holds 'possibly-uncrushed'. The structural element doing the philosophical work is the modal profile itself, which rescues the Principle by demonstrating that what appeared to be a non-qualitative haecceity is merely a complex qualitative relation to possibility. On this view, each sphere is fully described by its physical and modal attributes, leaving no remainder of 'thisness' required to ground its identity.

  A defender of the opposing stance, a haecceitist, would attack this scenario by arguing that relations to possible worlds are not real properties inherent to the object, but merely descriptions imposed by an observer. They would contend that the 'modal scar' is ontologically idle, failing to explain why *this* specific sphere bears the relation rather than *that* one, thus demanding a primitive non-qualitative difference to ground the distinction. However, this objection begs the question by assuming the very numerical distinctness it seeks to prove. By insisting that modal properties are genuine qualities, we preserve a parsimonious ontology without invoking mysterious, undetectable tags, affirming that identity is nothing over and above the sum of an object's qualitative and modal characteristics.
