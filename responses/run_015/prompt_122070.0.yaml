      *   Source: Milton Friedman's 1953 essay "The Methodology of Positive Economics."
      *   Core Argument: The realism of assumptions is irrelevant. The only test of a theory is its predictive accuracy. Assumptions are necessarily descriptive falsehoods because they abstract from reality.
      *   Scope: Friedman was primarily discussing positive economics (descriptive/explanatory), aiming to separate it from normative economics (what ought to be). He was defending neoclassical economics against critics who said assumptions like perfect rationality were unrealistic.
      *   User's Critique: The user argues this works for *observation* but fails for *intervention*. If you use the model to build policy, the model changes the system it describes.
      *   Assessment of Misrepresentation: The user isn't necessarily misrepresenting Friedman, but rather extending the critique beyond Friedman's intended scope. Friedman was focused on prediction, not necessarily on the feedback loop of policy implementation changing the underlying behavior. However, Friedman did discuss policy implications, so the line is blurry. The user's point is more about performativity (MacKenzie, Hacking) than a direct refutation of Friedman's internal logic, but it challenges the *application* of Friedman's methodology in social engineering.

