      *   Concept: Performativity of economics (Michel Callon, Donald MacKenzie). Ian Hacking's "looping effects."
      *   Question: Is there a philosophically clean line?
      *   Assessment: Generally, no. In social sciences, the observer is part of the system. When a model is used for policy, it becomes part of the environment that agents react to. If the model assumes self-interest and builds incentives around it, it encourages self-interest.
