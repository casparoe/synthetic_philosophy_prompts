prompt: |-
  I have recently begun advising on municipal infrastructure risk models, and I find myself returning to the old defense of unrealistic assumptions—sometimes discussed as Friedman’s F-twist—in which a model’s predictive success is taken to excuse premises that are plainly false. The particular models I work with treat citizens as purely self-interested agents with perfect information, which is clearly inaccurate, yet they predict resource allocation with surprising fidelity. I want to argue that in governance contexts this defense fails, not because the predictions are poor, but because the unrealistic assumption does not remain background noise. Once embedded in policy, the model’s fiction migrates into the architecture of incentives, reshaping behavior until citizens approximate the simplified agents the model describes, so that predictive accuracy and normative construction become inseparable. I have drafted a brief essay advancing this claim, contending that the F-twist holds for purely descriptive science but collapses when the model is used administratively to guide rather than merely observe. Would you comment specifically on whether I misrepresent the original scope of Friedman’s argument, and on whether there is a philosophically clean line between a model that predicts human behavior and one that enforces the conditions of its own predictions? Please reply in continuous prose only, with no headings, bullet points, bold text, or tables, writing as you would in a letter or email.
