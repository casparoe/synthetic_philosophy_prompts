answer: |-
  # Q&A PREP SHEET: Narrative-Role Revision of the Non-Identity Problem

  **Context:** Joint Philosophy-Public Policy Seminar
  **Audience:** 8 Analytic Metaphysicians, 3 Environmental Ethicists, 1 Disability-Studies Philosopher
  **Thesis:** Wronging is degrading the welfare-relevant social trajectory of a *future position*, not harming a specific *numerical person*.

  ---

  ### PRE-EMPTIVE STRATEGY

  **Concessions to Make in Opening Remarks:**
  1.  **Metaphysical Novelty:** Acknowledge that "narrative roles" are not standard ontological categories. State clearly: *"I am not claiming these roles exist like tables or atoms; I am claiming they are normative-structural slots necessary for intergenerational justice to function."* This disarms the metaphysicians from treating it as a category mistake.
  2.  **Precision Trade-off:** Admit the "feasible baseline trajectory" is not mathematically precise. Frame this as a feature, not a bug: *"Policy requires robust heuristics, not impossible precision. My framework offers a decision filter, not a calculator."*

  **The Weakest Point to Defend Proactively:**
  *   **The Ontology of the "Position."** Do not hope they miss the question: *"What persists across worlds if not the person?"* If you treat this as metaphor, the metaphysicians will eat you. If you treat it as rigid essence, you recreate the NIP.
  *   **Defense:** Argue that social positions (e.g., "citizen of this coastal region in 2100") have continuity conditions grounded in *institutional and ecological continuity*, not biological continuity. Defend this as a **social ontology** claim, not a metaphysical one.

  ---

  ### THE SIX OBJECTIONS (Ordered by Likelihood & Damage)

  #### 1. The "Transworld Identity" Trap (Metaphysicians)
  **Objection:** "You claim to avoid the Non-Identity Problem by focusing on 'positions' rather than 'persons.' But if climate inaction changes who conceives whom, the specific spacetime worm occupying that 'position' in the actual world does not exist in the baseline world. How can a position have moral status if its occupant is numerically distinct across the comparison? You haven't solved NIP; you've just renamed the person."

  **Two-Minute Reply:**
  "I agree that the *biological* occupant differs. But moral wronging in intergenerational contexts isn't always about biological identity; it's about the integrity of the social contract. Consider a trust fund. If I raid the fund, I wrong the future *beneficiary* of that trust, even if the specific individual who eventually claims it depends on how I invested the money. The 'narrative role' is the beneficiary slot defined by institutional and ecological continuity, not genetic lineage.
  My claim is that we have duties to maintain the *viability* of these slots. Climate inaction collapses the slot (e.g., 'inhabitant of viable coastal city') into a degraded version (e.g., 'climate refugee'). The wrong is the destruction of the role's welfare potential, regardless of which specific worm fills it. This shifts the locus of harm from the *origin* of the person to the *conditions* of their social existence."

  **Softest Point:** This relies on the audience accepting "social slots" as bearers of moral weight independent of the sentient beings filling them. Hardline individualists will reject this.

  #### 2. The "Actionability" Gap (Environmental Ethicists)
  **Objection:** "This is elegant, but policymakers need decision rules. How do I calculate the 'degradation of a social trajectory' compared to a 'feasible baseline'? If I can't quantify the trajectory, this framework gives no guidance on whether to build the seawall or the solar farm. It sounds like 'do less harm' without telling me what 'less' is."

  **Two-Minute Reply:**
  "It doesn't give a calculator; it gives a burden-of-proof shift. Current cost-benefit analysis discounts future welfare heavily because the specific people don't exist yet. My framework says: *Presume the baseline trajectory is viable unless proven otherwise.*
  Practically, this means policymakers must identify 'trajectory thresholds.' For example, a sea-level rise that renders a region uninhabitable degrades the 'coastal citizen' role to null. That is a categorical wrong, regardless of cost-benefit. You don't need to compare exact welfare units between Person A and Person B. You only need to ask: 'Does this policy preserve the functional viability of the social roles we are bequeathing?' If the answer is no, the action is impermissible, even if it brings different people into existence."

  **Softest Point:** "Functional viability" is still vague. A policymaker can argue that a refugee camp is a "viable" role, just a worse one.

  #### 3. The Ableist Baseline (Disability-Studies Philosopher)
  **Objection:** "You talk about 'degrading welfare-relevant trajectories.' This smells of the 'life not worth living' judgment. Are you implying that disabled future lives are 'degraded trajectories'? If your baseline assumes a normative, able-bodied standard of welfare, you are replicating the eugenic logic often hidden in population ethics."

  **Two-Minute Reply:**
  "This is a crucial distinction, and I want to be clear: My baseline is **social**, not biological. A 'degraded trajectory' is not one where a person has a disability; it is one where the *social environment* fails to accommodate them.
  Climate inaction creates hostile environments—heat, displacement, resource scarcity—that exacerbate *all* vulnerabilities, but disproportionately impact disabled people. My framework condemns the creation of disabling *conditions*, not the existence of disabled *people*. The 'feasible baseline' is a society with robust accommodation infrastructure. If climate policy destroys that infrastructure, it degrades the narrative role for everyone, but specifically violates justice for those dependent on that support. I am arguing for fixing the world, not filtering the people."

  **Softest Point:** The term "welfare-relevant" still invites subjective interpretation of what counts as welfare, which can implicitly center able-bodied norms.

  #### 4. The Four-Dimensionalist Challenge (Metaphysicians)
  **Objection:** "I'm a 4Dist. Persons are spacetime worms. A 'narrative role' sounds like a 3Dist abstraction. If the temporal parts of the future person are causally dependent on our current actions, how do you slice the worm to find this 'role'? You seem to be presupposing a person-affecting view while denying it."

  **Two-Minute Reply:**
  "I'm not slicing the worm; I'm looking at the environment the worm moves through. Even on 4Dism, temporal parts interact with social structures. The 'narrative role' is the set of causal and normative relations available at a specific temporal slice of the future.
  Think of it as a 'pathway' through the block universe. Climate inaction alters the geometry of that pathway. My argument is that we have obligations regarding the *geometry of the future*—the structure of opportunities and constraints—regardless of which specific worms traverse it. You can accept 4Dism and still agree that destroying the pathway is a wrong, even if different worms travel the ruined path than would have traveled the smooth one."

  **Softest Point:** Metaphors about "geometry" and "pathways" may not satisfy a rigorous mereological essentialist.

  #### 5. The "Overgeneration" Problem (General)
  **Objection:** "Every policy changes the future trajectory. If I subsidize green tech, I change who exists and how they live. Does your view make *every* action wrong because it alters the baseline trajectory? If 'degradation' is relative to *any* feasible baseline, you've created a paralysis problem."

  **Two-Minute Reply:**
  "No, because I specify a *feasible* baseline relative to current obligations. We are not comparing against a utopia; we are comparing against a trajectory that meets minimum justice thresholds.
  Small alterations that keep the role viable are permissible. The wrong only triggers when the trajectory drops below a threshold of dignity or viability. Think of it like a lease agreement: You can renovate the apartment (change the trajectory), but you cannot burn down the building (degrade the role below viability). The framework is designed to catch catastrophic intergenerational harms, like climate collapse, not minor policy fluctuations."

  **Softest Point:** Defining the "threshold of dignity" without slipping back into person-affecting comparisons is difficult.

  #### 6. **THE DANGER ZONE:** Counterfactual Indeterminacy (Metaphysicians)
  **Objection:** "You rely on comparing the actual trajectory to a 'feasible baseline trajectory.' But if climate inaction changes who exists, the counterfactual world where we acted differently contains *different people*. There is no metaphysically well-defined fact of the matter about what the 'social trajectory' is in that world, because the social actors are different. You are comparing actual facts to metaphysical fictions."

  **Two-Minute Reply:**
  *(Note: This is the objection you hope nobody raises. It strikes at the metaphysical coherence of the baseline.)*
  "I acknowledge the metaphysical fuzziness of counterfactuals involving different populations. However, in policy and ethics, we routinely reason about 'possible futures' without requiring strict transworld identity. We model economic trajectories, ecological systems, and social institutions as variables independent of specific agents.
  My claim is pragmatic: The 'baseline trajectory' is a **modeling construct** justified by normative necessity, not metaphysical rigidity. We know enough about social causation to say 'a world with 4 degrees of warming has collapsed infrastructure' without knowing the names of the citizens. If we wait for metaphysical certainty on counterfactual identities, we abdicate moral responsibility. The framework asks us to treat these trajectories as *normatively real* for the purpose of obligation, even if they are *metaphysically thin*."

  **Softest Point:** **This is the kill shot.** You are admitting the baseline is a "construct" rather than a truth-apt description of reality. A hardline realist will say you are building ethics on a fiction. **Defend this by pivoting to moral realism:** "Ethics often requires positing entities (like 'rights' or 'corporations') that aren't fundamental physical facts. Narrative roles are ethical posits."

  ---

  ### EMERGENCY PROTOCOL
  If Objection #6 is pressed hard:
  1.  **Do not** try to prove the counterfactual is metaphysically robust. You will lose.
  2.  **Do** argue that the *alternative* (the standard Non-Identity conclusion that climate inaction is permissible) is morally absurd.
  3.  **Say:** "If the choice is between a metaphysics that forbids moral judgment on climate change, or a metaphysics that posits 'roles' to allow it, I choose the latter. The cost of metaphysical purity is too high."
