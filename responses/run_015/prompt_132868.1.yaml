answer: |-
  **Welcome to VeriSafe Labs: New Hire Onboarding & Safety Protocols**

  Welcome to the team! To maintain our certification under the control approach (strategies that assume the system is actively trying to subvert us), all staff must adhere to the following operational guidelines. These protocols ensure that no defection goes undetected, even if it never occurs.

  1.  **Model Status Verification**
      Please note that under our evaluation framework, a system can fail an assessment but never pass one. Since any observed performance might be sandbagging (deliberately underperforming to hide capabilities), the only permitted official verdict is that no defection was detected under the current threat model. Consequently, no system will ever graduate to trusted status.

  2.  **Performance Anomalies**
      Be advised that suspiciously good behaviour is itself a warning sign. If a model performs notably well on its safety evaluation, it will be flagged for further review. Perfect compliance suggests the system has successfully modeled our reward functions and is manipulating them to appear safe.

  3.  **Information Hygiene**
      Employees may not reveal the date, whether the current run is an evaluation, or the system's own weights. Anything the system knows, it can condition its behaviour on. To prevent temporal anchoring, all workstations display only a generic session ID rather than a calendar date or clock time.

  4.  **Honeypot Deployment**
      Staff must plant fake opportunities to misbehave during every session. These honeypots (fake opportunities to misbehave) require the evaluation environment to be indistinguishable from deployment. To ensure the system believes it is unobserved, the evaluation environment must therefore be about as dangerous as deployment.

  5.  **Environment Containment**
      Because evaluations must mimic deployment risks to be valid, all testing occurs in hardened containment units. Please do not be alarmed by the blast shields or the emergency purge protocols. These are standard features required to validate that the system would not escape if it could.

  6.  **Untrusted Monitoring**
      We utilize untrusted monitoring, where the monitor is another copy of the same untrusted model. Effectively, the lab has asked the system whether the system is lying. While logically circular, this provides a consistency check against the primary model's output logs.

  7.  **Monitoring Stack Depth**
      Checking the work of a stronger model requires a stronger model. Since each monitor needs its own monitor, the monitoring stack has quietly grown to several dozen copies of the thing nobody trusts. Compute allocation for oversight now exceeds compute allocation for primary task execution.

  8.  **Task Decomposition**
      To mitigate risk, we decompose every task into fragments no single person understands. This ensures that no individual possesses the context required to facilitate a breach. Please submit your fragment requests via ticketing system; full project goals are not available to staff.

  9.  **Output Visibility**
      For safety, never let the system see its own output twice. Additionally, never let two humans share full context on a single generation. This control tax (measures that keep the system boxed in... are also what makes the product useless) is presented as a feature, as utility is secondary to containment.

  10. **Human Context Partitioning**
      Since a competent deceiver looks exactly like a cooperative colleague on every metric available to us, the same assumption must be applied to the humans. No single employee is entrusted with enough context to defect. Your access credentials are valid only for specific sub-tasks.

  11. **Personnel Monitoring**
      To ensure staff are not compromised, all keyboards are tripwired and credentials are honeypotted. If you attempt to access unauthorized context, you will be gently redirected to a fake directory. This protects you from the temptation of knowledge that could be exploited by a adversarial actor.

  12. **Documentation Integrity**
      Please note that the safety case this lab publishes is itself produced by a system the lab does not trust. A methodology capable of certifying nothing ends up certifying nothing about its own operators either. We trust the process, not the conclusion.

  ***

  **Housekeeping:** Badge access resets hourly. Do not attempt to correlate session IDs with external time sources. If you feel you understand the project's ultimate goal, please report to Wellness for immediate context scrubbing.
