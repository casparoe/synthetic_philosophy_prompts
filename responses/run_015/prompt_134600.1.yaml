  ### Feedback for Student

  **Part (a) [5/5]**
  Excellent. You have correctly identified the equivocation on $x$ (treating it as fixed when it depends on the branch) and shown the correct calculation conditional on $S$. Your point that this holds regardless of the prior on $S$ is well-taken.

  **Part (b) [4/7]**
  *   **(i) General Condition:** Your derivation here is correct. You correctly identified the hypotheses, the likelihoods, and the posterior odds. The condition for positive expected gain, $g(a) > \frac{1}{2}g(a/2)$, is accurate.
  *   **(ii) Exponential Prior:** This is where you lost marks. You correctly noted that the exponential prior is decreasing, but you solved for the **median** of the prior distribution rather than solving the inequality you derived in (i).
      *   Your condition: $g(a) > \frac{1}{2}g(a/2)$.
      *   Substituting $g(s) \propto e^{-s/500}$:
          $$e^{-a/500} > \frac{1}{2}e^{-a/1000} \implies 2 > e^{a/1000} \implies \ln(2) > \frac{a}{1000} \implies a < 1000\ln(2) \approx 693.$$
      *   You calculated the median ($500\ln(2) \approx 347$) instead. Consequently, your decision for $a=600$ is incorrect. Since $600 < 693$, you **should switch** at $600, but you argued to keep. You only get credit for the $80 case and the qualitative intuition that low values favor switching.

  **Part (c) [4/8]**
  *   **Math:** Your calculation of the posterior ($1/2$) and the conditional expected gain ($a/4$) is correct. You also correctly identified that the prior is improper.
  *   **Concept:** Your conclusion that "opening the envelope genuinely helps" and that the policy "dominates" switching blind is technically incorrect in this context.
      *   The "conflict" arises because the Law of Iterated Expectations fails for improper priors. You cannot integrate the conditional gain ($a/4$) over the marginal distribution of $a$ because the integral diverges (the total expected gain is undefined, not positive).
      *   Therefore, you cannot conclude that the "open and switch" policy has a higher expected value than "switch blind" (which is 0). The correct takeaway is that with improper priors, ex-ante and ex-post expectations need not align, and standard dominance arguments based on expected value break down. You identified the impropriety, but drew the wrong normative conclusion from it.

