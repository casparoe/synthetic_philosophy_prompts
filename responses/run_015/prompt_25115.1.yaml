      *   **Premise (3): Logical Consequence of (2).** "So no individual intentionally brings about the full collective outcome."
          *   *Critique:* Follows from (2), but depends on how we define "bringing about." Causality is often shared.

      *   **Premise (4): The Inference.** "Therefore... no individual is morally responsible."
