answer: |-
  ### Preliminary Brainstorming: Points of Convergence and Verbal Disputes

  Before we draft the accord, we need to clear the undergrowth. Having sat through countless seminars on this, I've noticed the Endurantist (3D) and Perdurantist (4D) camps often agree on the *phenomena* but disagree on the *ontology* required to ground them. In the context of institutional persistence (say, the Ministry of Defence), here is where we stand:

  1.  **Agreement on Temporal Predication:** Both sides agree that statements like "The Ministry was hierarchical in 1950" and "The Ministry is flat-structured in 2024" are true. The dispute is purely about what makes them true. Is it one object bearing incompatible properties relative to times (Endurance), or distinct temporal segments bearing properties simpliciter (Perdurance)?
  2.  **Agreement on Causal Continuity:** Both agree that you cannot have a gap in existence. If the Ministry is abolished and a new one created with the same name later, that is discontinuity. There must be a causal chain linking the staff, records, and charter states.
  3.  **Talking Past Each Other (The 'Part' Ambiguity):** When a Perdurantist says "The 1950 Ministry is a *part* of the Ministry," the Endurantist hears "proper spatial part," which is nonsense. The Perdurantist means "temporal part." In institutions, this maps to "administrative stages." We need to agree that we are using "part" differently without insisting the other is linguistically incompetent.
  4.  **Talking Past Each Other (Wholly Present):** The Endurantist says the Ministry is "wholly present" now. The Perdurantist hears "located only at this instant," which denies persistence. The Endurantist means "all of its ontological bulk is here, not just a slice." In institutional terms: the legal authority is fully active now, not just a fragment of it.
  5.  **Static Identity No-Go:** Both must agree that numerical identity cannot imply immutability. If the Ministry persists, it changes. Therefore, Leibniz's Law (Indiscernibility of Identicals) must be handled via time-indexing or temporal parts. A static block universe where nothing changes properties is ruled out by the data of institutional reform.

  ***

  ### JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Metaphysics of Institutional Persistence
  **Parties:** The Endurantist Working Group (EWG) and The Perdurantist Working Group (PWG)
  **Case Study:** The Continuity of Government Ministries under Total Personnel Turnover and Charter Revision

  #### I. Agreed Claims (The Common Ground)
  *Both parties sign below to the following metaphysical and formal conditions. These claims rule out nihilism, static eternalism, and magical reappearance.*

  1.  **Non-Trivial Persistence:** The Ministry of Defence (MoD) at time $t_1$ (1950) and the MoD at time $t_2$ (2024) are numerically identical *or* gen-identical in a way that supports singular reference. It is not merely a collection of distinct entities sharing a name.
  2.  **Material Independence:** The identity of the institution is not exhausted by its personnel. Total turnover of staff (the "material" constituent) is compatible with the persistence of the institution, provided causal and functional chains are maintained.
  3.  **Constitutive Rules:** The institution is partly constituted by its charter/rules. Changes to these rules are changes to the institution, but gradual revision does not necessarily entail cessation of existence (rejecting mereological essentialism regarding rules).
  4.  **Temporal Predication:** Propositions attributing properties to the institution relative to times (e.g., "The MoD was nuclear-focused at $t_1$") have objective truth values. Any viable theory must provide truthmakers for these propositions without contradiction.
  5.  **No Static Identity:** Numerical identity over time does not imply qualitative identity. We reject the notion that for $X$ at $t_1$ to be identical to $Y$ at $t_2$, $X$ and $Y$ must share all properties simpliciter. Time-indexing or temporal segmentation is required to resolve Leibniz's Law conflicts.
  6.  **Causal Constraint:** Persistence requires causal continuity. A perfect duplicate of the MoD created ex nihilo today would not be the MoD. There must be a continuous chain of administrative causation linking stages.

  #### II. Table of Disagreements (Formulated for Mutual Acceptance)
  *Each side accepts the wording in its own column as an accurate description of its commitment, and acknowledges the other column as an accurate description of the opponent's commitment.*

  | Feature of Persistence | Endurantist Formulation (3D) | Perdurantist Formulation (4D) |
  | :--- | :--- | :--- |
  | **Ontological Status** | The Ministry is a continuant. It exists *in* time but is not extended *through* time like a spatial object. | The Ministry is a perdurant. It is a spacetime worm extended through time, composed of temporal stages. |
  | **Presence** | The Ministry is **wholly present** at each moment of its existence. All of what it is to be the Ministry is located at $t$. | The Ministry is **never wholly present** at an instant. Only a temporal part (stage) is present at $t$. |
  | **Change** | Change is **variation in properties**. The Ministry itself instantiates $F$ at $t_1$ and not-$F$ at $t_2$. | Change is **variation across parts**. The $t_1$-stage is $F$; the $t_2$-stage is not-$F$. The worm itself does not change. |
  | **Parthood** | Personnel and assets are **constituents**, not parts in the mereological sense. The Ministry can lose them without losing parts of itself. | Personnel and assets at $t$ are **temporal parts** of the whole worm. The 1950 staff are literal parts of the Ministry. |
  | **Identity Conditions** | Identity is primitive or grounded in a persisting **substance/form** (the legal charter essence). | Identity is grounded in **causal continuity** (gen-identity) between temporal stages. |

  #### III. The Cruxes: Sub-Questions for Resolution
  *These are the specific points where empirical data or logical refinement could force one side to concede or modify their position. We list our prior predictions and what would count as evidence against them.*

  **Crux 1: The Truthmaker for Temporal Predication**
  *   **Question:** What in the world makes "The MoD was hierarchical in 1950" true today?
  *   **Endurantist Prediction:** The truthmaker is the existing Ministry bearing a temporal relation to the 1950 property. The object itself exists now and grounds past truths.
  *   **Perdurantist Prediction:** The truthmaker is the existing 1950-temporal-part (which exists eternally in the block) or a present representation causally linked to that part.
  *   **Decisive Evidence:** If we can demonstrate that past entities literally do not exist in any sense (Presentism is true), the Perdurantist loses their standard truthmaker (the existing past stage). If we demonstrate that relations require existing relata, the Endurantist struggles to relate a present object to a non-existent past property.
  *   **Concession Condition:** Endurantists concede if Presentism is proven incompatible with temporal relations. Perdurantists concede if the existence of past temporal parts is shown to be ontologically extravagant without explanatory gain.

  **Crux 2: The Vagueness of Charter Revision (Sorites)**
  *   **Question:** At what point does gradual charter change create a new institution?
  *   **Endurantist Prediction:** There is a fact of the matter, even if epistemically inaccessible. The essence of the Ministry (its core legal function) persists until a specific threshold is breached.
  *   **Perdurantist Prediction:** There is no sharp boundary. Identity is vague because the causal continuity between stages degrades gradually. "Identity" is a conventional label applied to a continuum.
  *   **Decisive Evidence:** Legal adjudication. If courts rule that continuity is *binary* (it either is or isn't the same ministry for liability purposes) regardless of gradual change, this supports Endurantism (or legal conventionalism). If courts accept degree-based liability based on continuity strength, this supports Perdurantism.
  *   **Concession Condition:** Endurantists concede if institutional identity is shown to be inherently vague without contradiction. Perdurantists concede if legal metaphysics requires strict numerical identity for liability transfer.

  **Crux 3: Transmission of Obligations**
  *   **Question:** How do debts or treaties bind the future institution?
  *   **Endurantist Prediction:** The *same* entity bears the obligation. The debtor today is numerically identical to the debtor who signed the treaty.
  *   **Perdurantist Prediction:** The current stage is causally connected to the signing stage. Obligation is a property of the worm, transferred via causal links between stages.
  *   **Decisive Evidence:** Cases of institutional分裂 (schism). If a Ministry splits into two, and both claim the debt, how is it resolved? If the debt splits proportionally, it suggests the institution was a sum of parts (Perdurance). If one successor is deemed the "true" heir and bears all debt, it suggests a persisting essence (Endurance).
  *   **Concession Condition:** Endurantists concede if obligations are shown to distribute across successor states based on causal uptake rather than identity. Perdurantists concede if obligation is shown to track a singular, non-divisible legal essence.

  ***

