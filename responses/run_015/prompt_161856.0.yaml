answer: |-
  **Project Title:** Standpoint and Structure: A Taxonomy of the Wrong Kind of Reasons

  **Research Question**
  Does the class of "Wrong Kind of Reasons" (WKR) conceal a structural ambiguity between *incentive-based* reasons (prizes/threats) and *standpoint-based* reasons (relational facts about the agent)? Specifically: Are reasons generated by manipulating one's relational standpoint (e.g., maneuvering to become the beneficiary of a gift) structurally distinct from pragmatic incentives, and does recognizing this distinction resolve the tension between fittingness and reasons for standpoint-dependent attitudes like gratitude, pride, and guilt?

  **Intervention and Critique of Standard Accounts**
  The dominant consensus treats the WKR problem as a binary: reasons that bear on the merit of the object (Right Kind) versus reasons that bear on the benefits of holding the attitude (Wrong Kind). My project argues this binary collapses when applied to standpoint-dependent attitudes (SDAs). For SDAs, fittingness is partially constituted by facts about the agent's relation to the object (e.g., one must be the wronged party to fittingly resent).

  Standard responses fail to settle these cases for specific structural reasons:
  1.  **Fittingness-First Accounts:** These claim WKRs are excluded because they don't affect fittingness. But standpoint facts *do* affect fittingness. If I manipulate my way into being the beneficiary, I satisfy the fittingness condition for gratitude, yet the reason feels tainted. Fittingness-first views cannot explain why a satisfied fittingness condition yields a "wrong" reason without ad hoc restrictions.
  2.  **Buck-Passing Accounts:** These reduce value to the existence of right-kind reasons. They struggle with SDAs because the value of the object (the gift, the achievement) remains constant while the reason status shifts based on my relational history. Buck-passing lacks the resources to distinguish between *having* a relation and *maneuvering for* a relation.
  3.  **Ambiguity/Pragmatic Encroachment Moves:** Treating "reason" as ambiguous or sensitive to stakes fails here because the "taint" isn't pragmatic cost/benefit. It is about the *source* of the relational fact. A manipulated standpoint provides a reason that is neither purely evidence of merit nor purely pragmatic incentive.

  **Methodology and Work Plan (12 Months)**
  This project avoids mere intuition-pumping by constructing a structural taxonomy tested against formal constraints on reasons.

  *   **Months 1–3: Taxonomy Construction.** Formalize the distinction between Incentive-WKRs and Standpoint-WKRs. Define necessary and sufficient conditions for "standpoint manipulation." Draft the core argument that SDAs require a tripartite division of reasons (Object-based, Standpoint-based, Incentive-based).
  *   **Months 4–6: Case Testing.** Apply the taxonomy to core SDAs (Gratitude, Pride, Guilt). Construct "manipulation cases" (e.g., the *Engineered Beneficiary*) and test them against the "Demon Threat" cases. Determine if the normative force differs. *Milestone:* Draft of Section II (The Argument for Distinctness).
  *   **Months 7–9: Boundary Analysis & Objections.** Test boundary cases (Trust, Love). Determine if they fit the SDA model or collapse back into standard belief/desire models. Anticipate the objection that Standpoint-WKRs are just Incentive-WKRs in disguise (e.g., maneuvering is just seeking a reward). Refute by showing the normative force persists even without external reward. *Milestone:* Draft of Section III (Boundaries and Objections).
  *   **Months 10–12: Synthesis and Writing.** Integrate findings into a unified chapter. Refine the "Failure Conditions" (see below) to ensure the positive account is robust. Prepare article draft for submission.

  **Deliverable**
  A dissertation chapter (approx. 8,000 words) suitable for submission as a standalone article. The chapter will argue that the WKR problem is not a puzzle about *value* but a puzzle about *agent-structure*, and that solving it requires acknowledging Standpoint-WKRs as a legitimate, non-corrupt category of reasons for specific attitudes.

  **Conditions for Failure**
  The project fails if:
  1.  **Collapse:** It turns out Standpoint-WKRs can be fully reduced to Incentive-WKRs (e.g., maneuvering is always explainable by hidden pragmatic stakes).
  2.  **Triviality:** The taxonomy reclassifies existing cases without generating new normative predictions or solving existing paradoxes.
  3.  **Overgeneration:** The distinction makes *too many* reasons permissible, undermining the normative force of fittingness entirely (e.g., if any manipulated relation counts as fitting).

  **Feasibility and Scope**
  This is a tight fit for one year. The primary risk is the "wobble" regarding attitudes like trust and love. These attitudes introduce complex cognitive/affective mixes that could derail the structural argument.
  *   **Cut:** I will exclude Trust and Love from the core argument. They will be mentioned only as boundary markers in Months 7–9. Focusing strictly on the "reactive attitudes" (Gratitude, Resentment, Pride, Guilt) ensures the relational structure remains constant.
  *   **Risk:** If the Standpoint/Incentive distinction proves unstable in Months 4–6, the scope will narrow to a negative result: proving that standard WKR accounts are incomplete, without offering a full tripartite taxonomy.

  **Substantive Positions**
  *   **Arguing Against:** The "Standard Consensus" that treats all WKRs as pragmatic/incentive-based (often associated with fittingness-attitude accounts). Also arguing against views that treat fittingness conditions as entirely object-focused, ignoring the agent's relational history.
  *   **Recruiting:** Relational accounts of emotion (which argue emotions are constituted by relations) will be recruited to support the existence of SDAs. Additionally, insights from pragmatic encroachment will be repurposed: not to argue that stakes change knowledge/reasons, but that *agent-position* changes reason-types.

  **Conclusion**
  By isolating standpoint-dependent reasons, this project does not merely add a new category to the WKR debate; it suggests the debate has been categorizing reasons by their *source* (mind vs. world) rather than their *structure* (object vs. relation). Resolving this clarifies why some "manipulated" attitudes feel fitting while others feel corrupt, offering a durable solution to the Wrong Kind of Reasons problem.
