      *   *The Deliberation Cost:* Real agents have bounded rationality. Calculating the best act costs time/energy. AC says you should only deliberate if the *gain* from better deliberation outweighs the *cost* of deliberation. But calculating *that* also costs time... infinite regress or arbitrary cutoff.
