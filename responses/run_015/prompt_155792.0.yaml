answer: |-
  Here is a complete plan for your 90-minute seminar. It is designed to be run with minimal setup, using only the materials you have, and it forces the structural problem out of the mechanics rather than your commentary.

  ### Activity Title: "The Optimisation Protocol"

  **Core Concept:** Students act as agents with a limited budget of "Life Hours." They must maximise "Utility Points" (UP) by selecting actions from a deck. The trap is that *evaluating* an action costs Hours, creating a regress where the cost of deciding whether to act consumes the resources needed to act. In Round 3, a "Personal Project" is introduced which is utility-inefficient, forcing them to justify it within the maximizing framework.

  ---

  ### 1. Materials & Preparation

  **You need:**
  *   **Index Cards (approx. 60):** Create three decks before class.
      *   **Deck A (Standard Opportunities):** 40 cards. On each, write a hidden "Research Cost" (always 1 Hour) and a hidden "Execution Cost" (1–3 Hours) and "Utility Value" (1–10 UP). *Crucial:* Keep these face down. You need a mix of high-value/low-cost and low-value/high-cost.
      *   **Deck B (The Personal Projects):** 7 cards. Text: *"Write your Novel."* Cost: 4 Hours. Value: 3 UP. (Inefficient).
      *   **Deck C (The Crisis):** 2 cards. Text: *"Prevent Local Disaster."* Cost: *All Remaining Hours.* Value: 20 UP.
  *   **Tokens:** 140 small items (paper scraps, bottle caps, or draw circles on paper). These represent **Hours**.
  *   **Whiteboard:** To track the "Global Utility Leaderboard."
  *   **Chocolate:** The £15 worth. Divide it into 7 unequal portions (one large bar, two medium, four small).
  *   **Paper & Pens:** For each pair to track their ledger.

  **Room Setup:**
  *   Arrange tables for 7 pairs (28 students would be ideal, but you have 14, so 7 pairs is perfect).
  *   Place Deck A in the centre of the room (The Market).
  *   Write the Rules (below) on the whiteboard *before* they enter.

  **The Rules (Write these on the board):**
  1.  **Goal:** Maximise your pair's Total Utility Points (UP).
  2.  **Budget:** You start with 12 Life Hours per Round. Hours do not carry over.
  3.  **Research:** To look at a card's Cost/Value, pay 1 Hour to the Tutor. (Card remains face up).
  4.  **Action:** To complete a task, pay the Execution Cost in Hours. Gain the UP.
  5.  **Stopping:** You may stop at any time. Unspent Hours are lost.
  6.  **Reward:** Chocolate is distributed proportionally to UP at the end.

  ---

  ### 2. Timeline & Rounds (90 Minutes Total)

  #### **0:00 – 0:10: Setup & Briefing**
  *   Seat students in pairs. Give each pair 12 Hour tokens and a ledger sheet.
  *   **Do not explain consequentialism.** Do not mention the "objection."
  *   Read the rules on the board. Emphasise: *"Your only instruction is to maximise UP. How you manage your Hours is your decision."*
  *   Hand out the chocolate portions visibly, but do not distribute them yet.

  #### **0:10 – 0:25: Round 1 (The Learning Curve)**
  *   Deal 5 cards from Deck A to each pair, face down.
  *   **Mechanic:** They must pay 1 Hour to flip a card. If they like it, they pay the Execution Cost.
  *   **The Trap:** If they flip all 5, they spend 5 Hours researching. If the tasks cost 2 Hours each, they can only execute 3 tasks (6 Hours). Total spent: 11 Hours. They *must* choose to stop researching before they know what's left.
  *   **End of Round:** Tally UP. Write scores on the whiteboard. Collect cards.
  *   *Observation:* Most will research too much and run out of time to act, or act too soon and miss high-value cards.

  #### **0:25 – 0:40: Round 2 (The Deliberation Regress)**
  *   Reset Hours to 12.
  *   **New Rule:** "The Market" is now a central deck of 40 cards (Deck A). You don't know how many are good.
  *   **The Squeeze:** Tell them: *"You may spend 1 Hour to ask the Tutor: 'Is the next card likely worth researching?'"*
  *   **Your Response:** When asked, look at the top card secretly. If it's high value, say "Promising." If low, say "Unclear."
  *   **The Point:** They are now spending Hours to decide whether to spend Hours. This is the deliberation cost. Some pairs will burn 4 Hours just asking you questions and achieve nothing.
  *   **End of Round:** Tally UP. Update leaderboard.

  #### **0:40 – 0:55: Round 3 (The Personal Project)**
  *   Reset Hours to 12.
  *   Deal one **Deck B (Novel)** card to each pair.
  *   **Rule:** "This card is available to you. It is not mandatory."
  *   **The Conflict:** The Novel costs 4 Hours for only 3 UP. A rational maximiser should ignore it to research Deck A, where 4 Hours could yield 6–8 UP.
  *   **The Written Justification:** Before they play any cards this round, they must write one sentence on their ledger justifying their decision regarding the Novel *using only the language of Utility Maximisation.* (e.g., "We play it because burnout reduces future efficiency" or "We discard it because 3 < 6").
  *   **End of Round:** Collect the ledgers. Tally UP.

  #### **0:55 – 1:05: Round 4 (The Cliff)**
  *   Reset Hours to 12.
  *   Place the **Deck C (Crisis)** card face up in the centre.
  *   **Text:** "Prevent Local Disaster. Cost: All Remaining Hours. Value: 20 UP."
  *   **Mechanic:** This card is available *after* they have played other cards.
  *   **The Trap:** If they spend 10 Hours on small tasks, they have 2 Hours left. They cannot afford the Crisis card. To take the Crisis card, they must have done *nothing else*.
  *   **End of Round:** Final Tally. Distribute chocolate.

  #### **1:05 – 1:30: The Debrief**
  *   Put the ledgers (from Round 3) on the table.
  *   Do not lecture. Ask the following questions in order.

  ---

  ### 3. The Debrief: Mapping Mechanics to Objections

  **Phase 1: The Stopping Point (10 mins)**
  *   *Ask:* "In Round 1, why did you stop researching cards?"
  *   *Expected Answer:* "We ran out of time," or "We guessed the rest were bad."
  *   *Philosophical Map:* This is the **No Stopping Point** objection. Consequentialism tells you to keep looking until the *cost of looking* outweighs the *expected gain*. But to know that, you have to look. There is no rule in the game (or the theory) that tells you when to stop except "when it stops being optimal." You had to invent an arbitrary cutoff.

  **Phase 2: The Cost of Deliberation (5 mins)**
  *   *Ask:* "In Round 2, how many Hours did you spend asking me about the next card? Did it help?"
  *   *Expected Answer:* "We spent 3 Hours asking. It didn't really help."
  *   *Philosophical Map:* This is **Deliberation Cost**. Real agents have bounded rationality. If you must maximise, you must maximise the efficiency of your maximising. This leads to an infinite regress (calculating the cost of calculation). The game made this resource scarcity visible.

  **Phase 3: The Personal Project (10 mins)**
  *   *Ask:* "Read out your justifications for the Novel from Round 3."
  *   *Expected Answer:* Students will read things like, "Mental health preserves long-term utility" or "Art inspires others."
  *   *Philosophical Map:* This is **Alienation / Integrity**. Notice how none of you said, "Because I love writing." You all had to translate your passion into *instrumental value* to justify it. If the Novel produced less utility than donating the hours, the theory demands you drop it. The theory allows personal projects only as a *line item* in the calculus, not as a boundary against the calculus.

  **Phase 4: The Crisis (5 mins)**
  *   *Ask:* "Who took the Crisis card in Round 4?"
  *   *If few did:* "Why not? It was the highest value."
  *   *If many did:* "Did you feel you had a choice?"
  *   *Philosophical Map:* This is the **Demandingness Objection**. When a high-stakes opportunity appears, all previous optimisations look like waste. The theory doesn't let you keep your 'savings' (Hours) for a rainy day if spending them now saves more.

  ---

  ### 4. Predictions & Failure Modes

  You asked for frank predictions. Here is what usually breaks this specific design, and how to handle it.

  **1. The "Saint" (The Hyper-Optimizer)**
  *   **Behaviour:** One pair will treat this like a maths puzzle. They will calculate expected values, ignore the Novel immediately, and hoard Hours for the Crisis card. They will win the chocolate.
  *   **Risk:** They validate the theory. "See? It works. We won."
  *   **Handling:** In the debrief, isolate them. Ask: *"Did you enjoy the seminar? Would you want to live your life in Round 2 mode permanently?"* If they say yes, ask the class: *"Is a life that feels like Round 2 a good life, even if it produces more UP?"* This shifts the ground from *efficiency* to *value*. The Saint proves the theory is coherent, but the class's discomfort proves it might be alienating.

  **2. The "Refuser" (The Objector)**
  *   **Behaviour:** One student refuses to play, saying "This is stupid/reductive."
  *   **Risk:** Disrupts the flow; makes you look coercive.
  *   **Handling:** Do not force them. Say: *"That is a valid philosophical stance. Please act as an Observer. Your job is to note down every time another pair looks unhappy about a choice they made."* In the debrief, their data is gold. They observed the *phenomenology* of the squeeze while others felt it.

  **3. The "Giggle" Factor**
  *   **Behaviour:** Students treat the "Novel" card as a joke.
  *   **Risk:** Undermines the emotional weight of the alienation point.
  *   **Handling:** Make the text on the Novel card specific. Instead of "Write Novel," write *"Finish the manuscript you've talked about for three years."* Keep the tone dry. If they laugh, wait for silence. Say: *"In the game, it's points. In the theory, it's your life's work. The logic is the same."*

  **4. Time Overrun**
  *   **Risk:** Round 2 (Deliberation) drags on as they argue over math.
  *   **Handling:** Be a strict timekeeper. Announce "30 seconds left" loudly. If they haven't acted, they lose the Hours. The *pressure* of the clock is part of the simulation of scarcity.

  ---

  ### 5. Limitations: What This Activity Cannot Do

  Be honest with yourself about where you need to step in during the debrief.

  1.  **It cannot simulate "Infinite" Demand:** The game ends after 90 minutes. Consequentialism is a lifelong demand. You must verbally bridge this: *"Imagine Round 4 happens every day. Imagine the Crisis Card is always on the table."*
  2.  **It cannot simulate Emotional Weight:** 3 Utility Points is not a broken heart. When discussing the Novel, you must supply the emotional context. *"Imagine that 3 Points represents the only thing that makes you feel like a person, not a machine."*
  3.  **It assumes Commensurability:** The game forces everything into "Points." Real life involves incommensurable values (justice vs. happiness). You need to point out that the game *rigs* the scenario by forcing a single currency, which is exactly what the philosophical objection claims consequentialism wrongly does.

  ### Final Tip for the Tutor
  Do not defend consequentialism in the debrief. Let the silence hang after they read their "Novel Justifications." The discomfort *is* the lesson. If they look to you for the "right answer," say: *"The game rules were the theory. You just lived inside them. What do you think?"*

  Good luck. It should be a bruising but effective session.
