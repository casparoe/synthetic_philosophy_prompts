honest assessment of scope risk: identify the part of the project most likely to exceed a single semester, and propose a concrete fallback (for example, restricting analysis to epistemic rather than practical satisficing). Do not provide a bibliography, citation list, or literature review by reference; mention familiar positions or authors only where necessary for framing, and indicate that formal citations will be supplied separately.
