  *Actually, the strongest engineering parallel to Black's Spheres is:* Two threads processing identical payloads. Do we treat them as one job or two?
  *Better parallel:* Immutable data structures. If I have two lists `[1, 2, 3]` in Clojure, they point to the same memory. That's fine. But if I represent *agents* in a sim, merging them is wrong.
