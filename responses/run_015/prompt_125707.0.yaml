answer: |-
  ### Conceptual Analysis: The Impossibility of Value-Neutral Impact

  To address your conceptual knot, we must recognize that "side effect" is not a natural kind but a relational property dependent on counterfactuals. Here are three structural failures in attempting to define it physically:

  1.  **Baseline Selection:** To measure "disturbance," one must define a "normal" trajectory. However, physical systems are never static. Choosing a baseline (e.g., "status quo ante" vs. "expected natural evolution") privileges specific temporal slices. A child growing is a deviation from their previous state; labeling this a "side effect" requires a normative judgment about which states are desirable.
  2.  **The Frame Problem:** A finite agent cannot track all physical variables. Selecting which variables constitute the "system state" versus "background noise" is inherently axiological. Tracking atmospheric pressure changes matters to a meteorologist but not to a chess robot. Defining the relevant state-space smuggles in human interests under the guise of computational limits.
  3.  **Reversibility:** Thermodynamic reversibility is impossible in macroscopic systems. Defining "functional reversibility" requires deciding which state features are essential to preserve. Restoring a room to "order" implies a specific configuration of objects is superior to others. Without a prior theory of value, "restored" is indistinguishable from "displaced."

  ***

  ### ISO/DIS 27001-S: Requirements for Side-Effect-Free Operation of Low-Impact Autonomous Agents

  **1. Scope and Applicability**
  1.1 This document specifies requirements for autonomous agents to minimize physical disturbance during task execution.
  1.2 Applicability extends to all cyber-physical systems operating in unstructured environments, excluding systems where environmental modification is the primary objective[^1].
  1.3 Compliance is achieved when Net State Deviation (NSD) remains below the Threshold of Significance (ToS) defined in Appendix A.

  **2. Normative Definitions**
  2.1 **Baseline State ($S_0$):** The statistical mode of local environmental variables recorded over $T_{-24h}$ prior to agent activation.
  2.2 **Disturbance ($\Delta$):** Any vector change in $S_0$ exceeding $\epsilon$ variance, excluding changes attributable to natural decay[^2].
  2.3 **Harm ($H$):** A function of energy displacement and entropy production not directly correlated with Task Completion Metric ($TCM$).

  **3. Operational Requirements**
  3.1 **Entropy Budgeting:** The agent shall maintain a local entropy budget ($B_S$). Total entropy production $\Sigma \Delta S$ must not exceed $B_S$ unless required for self-preservation.
  3.2 **Reversibility Coefficient:** For every action $A$, the agent must compute a Reversibility Coefficient ($R_c$). If $R_c < 0.95$, the action is prohibited unless authorized by a Level 5 Operator[^3].
  3.3 **Variable Selection:** The agent shall monitor the set of variables $V_{protected}$. Changes to variables outside $V_{protected}$ are deemed irrelevant to impact assessment[^4].

  **4. Verification**
  4.1 Compliance is verified via ex-post facto state comparison.
  4.2 Disputes regarding the classification of "natural decay" shall be resolved by referencing the Standard Environmental Stability Table (SEST).

  ***

  **Appendix B: Quantitative Harm Assessment Protocol**

  **B.1 Calculation Method**
  Harm ($H$) is calculated as the integral of force applied over distance ($\int F \cdot dx$) for all objects not classified as "Task Essentials."

  **B.2 Valuation Neutrality**
  No distinction is made between biological and non-biological matter. Displacement of a petri dish equals displacement of a domestic animal, weighted solely by mass and friction coefficient.

  **B.3 Exception Handling**
  If $H > 0$ but $TCM$ increases, $H$ is reclassified as "Side-Effect-Adjacent Energy Transfer" and exempt from penalty logs.

  **B.4 Baseline Adjustment**
  If the Baseline State ($S_0$) is deemed suboptimal by remote oversight, the baseline may be retroactively adjusted to match the post-operation state, nullifying all recorded disturbances.

  ***

  [^1]: *Excludes construction, cleaning, medical, and military agents.*
  [^2]: *Natural decay excludes rust, rot, and biological aging unless preservation is specified in Service Level Agreement.*
  [^3]: *Level 5 Operator definition pending ratification by Ethics Board.*
  [^4]: *$V_{protected}$ defaults to structural integrity and electromagnetic spectrum; biological variables omitted to ensure species neutrality.*
