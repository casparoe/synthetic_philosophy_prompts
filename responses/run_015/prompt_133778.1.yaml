answer: |-
  **Course:** HIS 405 – Seminar in Intellectual History  
  **Instructor:** Professor A. Vance  
  **Assignment:** Take-Home Final Examination  
  **Due Date:** December 14th  

  **Examination Question**

  In *Of Money* and *Of Interest*, David Hume argues that an augmentation of the money supply does not instantaneously raise prices. Instead, he posits a gradualist mechanism wherein new money enters specific sectors, stimulating industry and labor before prices universally adjust. 

  Consider a constructed counterfactual: A closed, agrarian economy suddenly issues a large volume of paper notes. These notes are not convertible into specie (gold or silver) but are convertible solely into claims on anticipated tax revenues—an instrument Hume never explicitly discusses. 

  In an essay of approximately 700 words, apply Hume's framework of gradual adjustment to this scenario. Your response must: (1) reconstruct Hume's implicit assumptions regarding the velocity of circulation during the adjustment period; (2) determine whether his gradualist mechanism survives under this specific credit-backed issuance; (3) identify the precise point at which nominal activity diverges from real activity; and (4) evaluate whether this divergence undermines Hume's broader anti-mercantilist argument that national wealth consists in labor and commodities rather than in accumulated paper.

  ***

  **Model Answer**

  Hume's central contribution to monetary theory lies in his rejection of the instantaneous neutrality of money. He contends that when gold or silver enters a nation, it does not immediately inflate prices proportionally. Instead, the new money circulates slowly, first enriching those who receive it—typically merchants or manufacturers—who then demand more labor and commodities. This increased demand stimulates industry before the general price level rises. Only as the money diffuses through all ranks of society do prices adjust upward, restoring the equilibrium between money and commodities.

  To apply this to a closed agrarian economy issuing tax-backed paper notes, one must first reconstruct Hume's implicit assumptions about velocity. Hume assumes that velocity is not constant during the transition period. Initially, the velocity of the new money is low because holders treat it as an increase in real capital rather than mere nominal value. They spend it on productive inputs, not merely consumption. This lag allows real output to expand. However, this assumption relies on the money possessing intrinsic credibility or universal acceptability, akin to specie.

  In the counterfactual scenario, the gradualist mechanism faces immediate strain. Unlike gold, which holds value independent of government policy, paper notes convertible only into future tax claims rely entirely on public confidence in the state's fiscal capacity. If the agrarian society trusts that future harvests will support the tax revenue, the notes may initially mimic specie. Farmers might accept them, anticipating lower future tax burdens or using them to hire labor. In this brief window, Hume's mechanism survives: the notes stimulate labor because recipients believe they represent real purchasing power.

  However, the divergence between nominal and real activity occurs precisely when confidence in the tax claims decouples from actual productive capacity. With specie, the divergence is delayed by the physical time required for money to circulate. With paper notes, the divergence is psychological and instantaneous upon the realization that the claims are not backed by tangible assets but by future coercion (taxation). If the issuance exceeds the economy's ability to generate the tax revenue required to redeem them, the notes cease to function as capital and function instead as inflationary pressure. The "gradual" stimulation of industry is bypassed; holders of the notes, anticipating depreciation, accelerate velocity immediately to purchase commodities before prices rise.

  This acceleration undermines the stimulus effect. Instead of money waking up dormant labor, the money chases existing commodities, raising prices without increasing output. The nominal activity (the value of transactions) rises, but real activity (the volume of goods and labor) remains static or contracts due to market uncertainty.

  Consequently, this divergence significantly undermines Hume's anti-mercantilist argument. Hume argues that national wealth resides in labor and commodities, not the stock of money. He dismisses paper credit generally, fearing it displaces industry with speculation. In this counterfactual, the issuance of paper notes creates the illusion of wealth without the substance. If the notes stimulate no additional labor because velocity spikes too quickly, the economy experiences inflation without growth. This validates Hume's suspicion that paper credit can detach the sign of wealth from wealth itself. 

  Ultimately, Hume's gradualist mechanism depends on the money entering the economy as a surprise increase in real resources. Tax-backed paper, known to be a claim on future production rather than current stock, fails to deceive agents into increasing labor supply. Therefore, while Hume's distinction between real and nominal wealth remains robust, his mechanism for transitioning between them collapses under this specific instrument. The economy proves that without the disciplinary anchor of specie or immediate productive backing, the "gradual" benefit vanishes, leaving only the mercantilist error of mistaking paper for power.

  ***

  **Marking Scheme**

  **Total Marks:** 25

  **1. Reconstruction of the Gradualist Argument (5 Marks)**
  *   **5:** Clearly articulates the lag between money influx and price adjustment; explains the channel from money to industry to prices.
  *   **3:** Identifies the lag but fails to explain the mechanism of industrial stimulation.
  *   **1:** Treats Hume as a strict quantity theorist (instant price adjustment).
  *   **0:** Irrelevant or blank.
  *   *Common Misconception:* Claiming Hume believes money is neutral in the short run.

  **2. Isolating the Velocity Assumption (5 Marks)**
  *   **5:** Identifies that Hume assumes variable velocity; initially low as money is treated as capital, rising as prices adjust.
  *   **3:** Mentions velocity but treats it as constant throughout the period.
  *   **1:** Confuses velocity with the money supply size.
  *   **0:** No mention of circulation speed.
  *   *Common Misconception:* Applying modern Fisherite equations (MV=PT) anachronistically without nuance.

  **3. Analyzing the Paper-Credit Counterfactual (7 Marks)**
  *   **7:** Distinguishes between specie and tax-backed paper; analyzes the role of confidence and fiscal capacity in the transmission mechanism.
  *   **4:** Analyzes the paper notes but treats them identical to gold influx.
  *   **2:** Dismisses the counterfactual because Hume disliked paper credit, without analyzing the mechanism.
  *   **0:** Fails to address the specific instrument (tax claims).
  *   *Common Misconception:* Assuming Hume's hostility to paper credit answers the mechanistic question automatically.

  **4. Diagnosing the Divergence Point (5 Marks)**
  *   **5:** Pinpoints the psychological break where confidence falters and velocity accelerates, causing nominal/real split.
  *   **3:** Identifies inflation but attributes it to quantity alone rather than velocity/expectations.
  *   **1:** Vague reference to "prices going up."
  *   **0:** No diagnosis provided.
  *   *Common Misconception:* Ignoring the temporal lag and claiming divergence happens only after full circulation.

  **5. Assessing Impact on Anti-Mercantilism (3 Marks)**
  *   **3:** Concludes that the scenario validates Hume's view that wealth is commodities, but shows paper can obscure this reality.
  *   **2:** Argues Hume is wholly wrong about wealth.
  *   **1:** Restates Hume's position without evaluating the impact of the counterfactual.
  *   **0:** Irrelevant.
  *   *Common Misconception:* Conflating anti-mercantilism with anti-monetary theory.
