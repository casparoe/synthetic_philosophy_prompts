      *   *Critique:* Did I distinguish policy from philosophy?
      *   *Fix:* Add a specific "Boundary Note" at the start.
      *   *Critique:* Did I ensure one family hates the answer?
      *   *Fix:* In Case 1, the recommendation is to withhold the tube based on the AD. The family sees a smiling mother. They will hate it. This aligns with Dworkin's view which is often the legal default, even if Dresser's view is compelling.
      *   *Critique:* Did I handle the verbal revocation?
      *   *Fix:* In Case 2, the procedure must flag the *ambiguity*. If the revocation is witnessed/credible, it overrides. If split family, it's a "Flag Point."

  10. **Final Polish:** Check against all constraints in the prompt.
      *   Reusable decision procedure? Yes.
      *   30 mins/No metaphysics? Yes (simplified steps).
      *   Ordered questions/Stop-points/Flag-points? Yes.
      *   Case 1 (Dementia/Feeding Tube)? Yes.
      *   Case 2 (Verbal Revocation/Split Family)? Yes.
      *   One outcome family hates? Yes (Case 1).
      *   Honest about misfires? Yes (Limitations section).
      *   Settled vs. Contested distinction? Yes (Intro/Boundary Note).
      *   Spelling of Diachronic? Checked.

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Clinical Ethics Rapid-Response: Advance Directive vs. Current Status
  **Target User:** Clinical Ethics Consultant (CEC)  
  **Time Allocation:** 30 Minutes  
  **Purpose:** To generate a defensible documentation trail for conflicts between valid Advance Directives (AD) and the apparent well-being of incapacitated patients (specifically dementia).

  ---

  ## ⚠️ Boundary Note: Settled Policy vs. Contested Philosophy
  Before using this procedure, you must distinguish what the law requires from what philosophers debate. Do not conflate them in your documentation.

  | **Settled (Policy/Law/Consensus)** | **Contested (Philosophy/Metaphysics)** |
  | :--- | :--- |
  | **Legal Validity:** A properly executed AD is a legal instrument. | **Diachronic Authority:** Does the "past self" have moral authority to bind the "future self" if psychological continuity is broken? (Dworkin vs. Dresser). |
  | **Capacity:** Only a patient with capacity can revoke an AD. | **Identity:** Is the dementia patient the *same person* who wrote the AD, or a new moral entity? |
  | **Surrogate Hierarchy:** If the AD is ambiguous, a legal surrogate decides. | **Interest Weighting:** Do "experiential interests" (current happiness) outweigh "critical interests" (past life values)? |
  | **Revocation:** Explicit verbal revocation *with capacity* generally supersedes written ADs. | **Authenticity:** Can a preference formed in early dementia be "authentic" if the disease is already influencing values? |

  *Note for Documentation:* Your recommendation should rest on **Settled** categories whenever possible. When you must enter the **Contested** zone, flag it explicitly as a values judgment requiring surrogate consensus or institutional risk tolerance.

  ---

  ## The Decision Procedure (5 Steps)

  ### Step 1: Validity and Applicability Check (Minutes 0–5)
  **Question:** Is the AD legally valid, and does the current clinical condition match the specific trigger conditions in the document?
  *   **Sufficient Answer:** Yes/No. Look for signatures, witnesses, and specific clinical language (e.g., "terminal condition," "permanent unconsciousness," or "advanced dementia").
  *   **Stop-Point A (Invalid/Inapplicable):** If the AD is invalid or the condition doesn't match the trigger (e.g., AD says "terminal cancer," patient has dementia), **STOP.** Proceed to Surrogate Best Interest Standard. Do not use this procedure.
  *   **Stop-Point B (Valid/Applicable):** If valid and applicable, proceed to Step 2.

  ### Step 2: Evidence of Revocation or Modification (Minutes 5–10)
  **Question:** Is there credible evidence the patient changed their mind *after* writing the AD but *before* losing capacity?
  *   **Sufficient Answer:** Documented verbal revocation, written amendment, or consistent verbal statements to multiple witnesses while capacity was intact.
  *   **Flag-Point 1 (Conflicting Testimony):** If family/staff disagree on whether revocation occurred (e.g., "She said she wanted to live" vs. "She said she was joking"), **FLAG.** This is not a technical call. It requires a family conference to assess credibility. Do not resolve unilaterally.
  *   **Proceed:** If no credible revocation, proceed to Step 3.

  ### Step 3: The "Suffering vs. Contentment" Assessment (Minutes 10–15)
  **Question:** What is the patient's current experiential state?
  *   **Sufficient Answer:** Objective observation, not family interpretation. (e.g., "Patient smiles at music," vs. "Patient grimaces during turning." Use PAINAD or similar scale if available).
  *   **Critical Distinction:** Distinguish between *reflexive* behavior and *interactive* engagement.
  *   **Proceed:** Record finding. (e.g., "Patient appears content," or "Patient appears distressed"). Proceed to Step 4.

  ### Step 4: The Diachronic Conflict Analysis (Minutes 15–25)
  **Question:** Does honoring the AD cause direct harm to the current self that the past self could not have anticipated?
  *   **This is the Contested Zone.** You are weighing **Precedent Autonomy** (Past Self) vs. **Current Best Interest** (Present Self).
  *   **Decision Node 1 (Honor AD):** If the AD is specific, the condition is met, and the treatment refused is invasive/burdensome (e.g., ventilation, surgery), **HONOR THE DIRECTIVE.**
      *   *Rationale:* Legal risk and respect for precedent autonomy generally outweigh current experiential interests in US policy.
  *   **Decision Node 2 (Override AD):** If the treatment is basic care (e.g., oral feeding, hygiene) OR if the current state is one of evident joy/engagement that contradicts the "life not worth living" assumption in the AD.
      *   *Rationale:* Current welfare interests may supersede past critical interests when the "self" has fundamentally changed.
  *   **Flag-Point 2 (Values Judgment):** If the treatment is life-sustaining (e.g., feeding tube) AND the patient is content, **FLAG.** This is the "Hard Case." You cannot solve this technically. You must recommend a course based on institutional policy but document the ethical tension.

  ### Step 5: Documentation and Recommendation (Minutes 25–30)
  **Action:** Write the recommendation.
  *   **Required Phrasing:** If overriding an AD, state: *"Recommendation prioritizes current best interest due to [specific reason], acknowledging conflict with precedent autonomy."*
  *   **Required Phrasing:** If honoring an AD against family wishes, state: *"Recommendation honors valid legal directive. Acknowledges family distress regarding patient's current contentment."*

  ---

  ## Case Applications

  ### Case 1: The Content Dementia Patient (The "Hate" Outcome)
  **Scenario:** 78F with advanced Alzheimer's. Smiles at caregivers, enjoys music, no signs of distress. AD explicitly states: *"No artificial nutrition if I lose narrative self-awareness and do not recognize my family."* She does not recognize family. Family demands a feeding tube because "she looks happy."

  **Procedure Run:**
  1.  **Validity:** AD valid. Condition (loss of recognition) met. **(Proceed)**
  2.  **Revocation:** No evidence of change after execution. **(Proceed)**
  3.  **Assessment:** Patient appears content/experientially well. **(Record)**
  4.  **Conflict Analysis:**
      *   Treatment: Artificial nutrition (invasive/medical).
      *   Conflict: Past critical interest (dignity/identity) vs. Current experiential interest (life/pleasure).
      *   **Decision Node:** In most jurisdictions, a specific AD regarding artificial nutrition is legally binding. The "contentment" does not legally invalidate the directive.
      *   **Recommendation:** **HONOR THE DIRECTIVE.** Do not place the feeding tube.
  5.  **Documentation:** *"AD is legally valid and clinically applicable. While patient exhibits current experiential contentment, the directive specifically anticipated this state ('loss of recognition') and refused intervention. Precedent autonomy holds legal weight over current surrogate preference. Recommendation: Do not place PEG tube."*

  **Outcome:** The family will hate this. They see a living, smiling mother; the ethics consult says "let her starve based on a paper she signed 10 years ago."
  **Why this misfires:** This is where the procedure admits it cannot solve the metaphysics. It defaults to legal risk management (Precedent Autonomy) over the philosophical argument that the "happy demented self" is a new person who shouldn't pay for the past self's values.

  ### Case 2: The Verbal Revocation (The "Flag" Outcome)
  **Scenario:** 80M diagnosed with early-stage dementia. Executed AD refusing life support. Six months later (still has capacity), tells his daughter, "If I get like your mother, keep me going." Tells his son, "I don't want to be a burden." Patient now lacks capacity. Daughter wants treatment; Son wants to follow AD.

  **Procedure Run:**
  1.  **Validity:** AD valid. Condition met. **(Proceed)**
  2.  **Revocation:** Verbal statements exist but are contradictory. Capacity at time of statement is medically plausible but contested.
      *   **FLAG-POINT 1 TRIGGERED:** Conflicting testimony on revocation.
  3.  **Assessment:** Patient currently unresponsive. **(Record)**
  4.  **Conflict Analysis:**
      *   Cannot proceed to Decision Node. The evidentiary basis is broken.
      *   **Recommendation:** **ETHICS COMMITTEE / LEGAL REVIEW.** Do not make a unilateral call.
  5.  **Documentation:** *"Conflict exists regarding potential verbal revocation. Surrogates provide contradictory accounts of patient's wishes post-diagnosis. This is not a clinical determination but an evidentiary one. Recommendation: Pause implementation of AD withdrawal until surrogate consensus is reached or legal counsel clarifies weight of verbal revocation in this jurisdiction."*

  **Outcome:** Stalemate. The procedure correctly identifies that this is not a technical ethics call but a factual/legal dispute.

  ---

  ## Limitations & Misfires (Read Before Use)

  **1. The "Diachronic" Gap**
  This procedure cannot resolve whether the patient *is* the same person who wrote the AD.
  *   *Philosophical Reality:* If you believe personal identity requires psychological continuity (Locke/Parfit), the demented patient may be a different entity. Binding them to the AD is morally akin to enforcing one person's will on a stranger.
  *   *Procedure Reality:* The law treats them as the same entity. This procedure defaults to the **Law** to protect the institution, even if the **Philosophy** suggests the AD is morally void. You must document this tension if you choose to override the AD based on current happiness.

  **2. The "Contentment" Illusion**
  Step 3 relies on observing "contentment."
  *   *Misfire:* Dementia can produce reflexive smiling or apathy that mimics contentment. A patient may be internally distressed but unable to express it.
  *   *Mitigation:* Rely on nursing assessment (PAINAD), not just family reports of "she looks happy."

  **3. The "Hard Case" Default**
  In Case 1, the procedure likely tells you to withhold the tube.
  *   *Ethical Cost:* This prioritizes *integrity of the life story* (Dworkin) over *current welfare* (Dresser).
  *   *Honesty:* You must tell the family: *"I know she seems happy now. But the directive was written specifically to prevent living in this state. We are respecting her past judgment, not her current comfort."* There is no way to make this sound benevolent. Do not try.

  **4. Jurisdictional Variance**
  *   *Settled:* Some states (e.g., NY) require "clear and convincing evidence" to withdraw nutrition. Others allow surrogates broad discretion.
  *   *Action:* Verify local statute before Step 4. If local law requires "clear and convincing" evidence of wishes, a generic AD might not suffice for a feeding tube, forcing you to the Surrogate Best Interest Standard regardless of this procedure.

  ---

  ## Summary for Lecture Notes
  *   **Diachronic Authority:** The power of the past self to bind the future self. (Contested).
  *   **Precedent Autonomy:** The legal/ethical principle that prior competent choices govern current care. (Mostly Settled in Law).
  *   **The Snag:** When the future self is happy to be alive, but the past self wrote "don't keep me alive if I'm like this."
  *   **The Procedure's Verdict:** Usually defaults to the Past Self (AD) for invasive treatments, unless there is evidence of revocation. This will cause moral distress. That distress is a feature, not a bug, of the current legal-ethical framework.
