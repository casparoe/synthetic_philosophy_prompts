prompt: |-
  I've been teaching medical ethics this semester and my grad students keep hitting the same snag with advance directives — the theory sounds neat, the earlier self wrote it, but then you've got a dementia patient who seems genuinely content now, and the directive was specifically written to reject life in exactly this kind of state where they no longer have narrative self-awareness. The identity question makes the authority question messy, and I don't want another one-off essay answer. Instead, write me a reusable decision procedure for a clinical ethics consultant who gets paged maybe twice a week about these conflicts. They have thirty minutes, no metaphysics background, and need to document why they either honored the directive or overrode it. Turn the debate about diachronic authority — is the past self a trustee with binding power, or just one preference-source among others? — into actual steps: ordered questions, what counts as a sufficient answer at each stage, the stop-points where you say honor the directive versus current patient's interests take precedence, and the explicit flag-points where it's not a technical call but a values judgment that needs family or sign-off. The hard cases have to include a patient with advanced dementia who smiles at caregivers but whose directive refused feeding tubes if they ever lost narrative self-awareness, and a case where the patient verbally revoked part of the directive after diagnosis but before losing capacity, with family split on whether that revocation was authentic. Run both through your procedure, and make sure one of them yields an answer the family is going to hate. Be honest about where the procedure misfires — say, when welfare and narrative continuity pull in opposite directions — and say plainly what it can't do. Also please seperate what's settled in the bioethics and policy literature from what's genuinely contested among philosophers who actually work on personal identity and diachronic autonomy; don't present one side of that authority debate as the consensus when it's not. I keep misspelling diachronic in my lecture notes so I feel your pain if you do too, but keep the distinction clear anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Clinical Ethics Consultants (CECs) working in a hospital setting.
      *   **Constraints:** 30-minute consultation window, no metaphysics background, needs documentation justification, reusable decision procedure.
      *   **Core Problem:** Conflict between Advance Directives (AD) written by a "past self" and the current well-being/contentment of a patient with advanced dementia (loss of narrative self-awareness).
      *   **Key Philosophical Tension:** Diachronic authority (does the past self bind the future self?) vs. Current Best Interests (is the current self a new moral patient?).
      *   **Required Cases:**
          1.  Advanced dementia patient, content/smiling, AD refuses feeding tubes based on loss of narrative self-awareness.
          2.  Patient verbally revoked part of AD *after* diagnosis but *before* losing capacity, family split on authenticity.
      *   **Output Requirements:** Ordered questions, sufficient answers, stop-points (honor vs. override), flag-points (values judgment/family sign-off), run both cases through the procedure, ensure one outcome is unpopular with the family, admit limitations/misfires, distinguish settled policy/law from contested philosophy.
      *   **Tone:** Professional, practical, philosophically honest (not masking disagreement as consensus).

  2.  **Deconstruct the Philosophical Landscape (Mental Sandbox):**
      *   *Precedent Autonomy (Dworkin):* The past self's critical interests dominate. The AD should be followed even if the current self is happy. (Integrity of the life story).
      *   *Current Well-being (Dresser/Robertson):* The demented patient is a different entity or at least has new experiential interests that matter more than past abstract values. Don't kill a happy person to satisfy a dead person's wish.
      *   *Legal/Policy Reality:* Most jurisdictions treat valid ADs as binding *unless* there's evidence of revocation or ambiguity. However, "best interest" standards often creep in when ADs are vague.
      *   *The "Diachronic" Issue:* The prompt specifically asks to distinguish settled policy from contested philosophy. *Settled:* ADs are legal documents. *Contested:* Whether they *morally* bind when identity shifts.
      *   *Constraint Check:* The CEC has 30 minutes. They can't solve the metaphysics of personal identity. They need a heuristic that respects the tension without requiring a PhD.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   Need a flow that moves from Legal/Policy (hard constraints) to Ethical (soft constraints) to Conflict Resolution.
      *   *Step 1: Validity & Applicability.* Is the AD legal? Does the current condition match the trigger? (This is standard policy).
      *   *Step 2: Evidence of Revocation/Change.* Did the patient say anything later? (Crucial for Case 2).
      *   *Step 3: The "Suffering vs. Contentment" Check.* Is the current state one of obvious suffering or apparent contentment? (This addresses the dementia snag).
      *   *Step 4: The "Core Value" Alignment.* Was the directive about specific treatments or a general way of life?
      *   *Step 5: The Decision Node.* Weighing Precedent Autonomy vs. Current Best Interest.
      *   *Flag Points:* Where does the CEC need to say "I can't decide this, we need a meeting"?

  4.  **Refining the Procedure for the "30-Minute CEC":**
      *   Make it a checklist.
      *   Define "Stop Points" clearly.
      *   Explicitly label the "Contested Zone."

  5.  **Running the Cases:**
      *   *Case 1 (Content Dementia + Feeding Tube AD):*
          *   AD Valid? Yes.
          *   Condition Met? Yes (loss of narrative awareness).
          *   Current State? Content.
          *   Conflict: Past autonomy vs. Current life.
          *   Outcome: If following strict legal/precedent autonomy, withhold tube. Family hates this. If following current interest, feed.
          *   *Decision:* To meet the prompt's requirement ("make sure one of them yields an answer the family is going to hate"), I should lean towards the *legal/precedent* side here, as that's the default risk management stance, even if ethically messy. Or, I can structure the procedure to prioritize the AD unless there's ambiguity, which leads to the "hate" outcome. Let's aim for: Honor the AD (No Tube). Family hates it because patient is smiling.
      *   *Case 2 (Verbal Revocation):*
          *   AD Valid? Yes.
          *   Revocation? Verbal, after diagnosis, before incapacity.
          *   Family Split.
          *   Outcome: This is the "Flag Point." Cannot be solved by procedure. Needs ethics committee or legal. But for the sake of the exercise, I need to show how the procedure handles it. It should flag it as "Insufficient Evidence of Revocation" -> Honor AD, OR "Ambiguous" -> Best Interest.
          *   *Correction:* The prompt asks to run both through. Let's make Case 2 the one where the procedure flags a values judgment, and Case 1 the one where it yields the "hate" answer. Actually, Case 1 is the classic "Dworkin vs. Dresser" fight. Case 2 is a legal evidentiary fight. Let's make Case 1 the "Hate" outcome (Honor AD, no feeding) because that's the harder philosophical pill. Case 2 should highlight the "Flag Point."

  6.  **Addressing the "Settled vs. Contested" Requirement:**
      *   Need a sidebar or intro section clarifying:
          *   *Settled:* ADs are legal instruments; capacity determines validity; surrogate hierarchy exists.
          *   *Contested:* Does the "past self" have moral authority over a "new self"? (Diachronic autonomy). Is experiential interest equal to critical interest?

  7.  **Addressing the "Misfire" Requirement:**
      *   Acknowledge that the procedure cannot resolve the metaphysical identity crisis. It forces a choice where philosophy offers none.
      *   Acknowledge that "contentment" in dementia is hard to assess (is it real or reflex?).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Title:* Clinical Ethics Rapid-Response: Advance Directive vs. Current Status.
      *   *Structure:* Context/Disclaimer -> The Procedure (Steps 1-5) -> Case Applications -> Limitations.
      *   *Tone:* Clinical but intellectually honest.
      *   *Spelling Check:* Ensure "Diachronic" is spelled correctly (user noted they misspell it).

  9.  **Self-Correction/Review during drafting:**
