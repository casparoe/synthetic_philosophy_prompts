      *   **The Relay Variant:** 50 short hops. Each hop is lossy (like a night's sleep overlap). Drift accumulates.
      *   **End State:** Psychologically continuous (chain exists), but low connectedness (little shared memory, desires, projects). Unrecognisable to others. Retains faint sense of having been you.
      *   **Constraint:** Only one replica at a time (previous destroyed).
