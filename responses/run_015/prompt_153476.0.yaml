answer: |-
  Good evening. Welcome to all of you.

  Looking around this room, I see two distinct groups, though I hope you will leave as one community of witnesses. On one side, I see scholars and students of ethics, people who have spent careers thinking about the rules of war. On the other, I see families. Grandchildren, nieces, nephews, and partners of the men whose handwriting is on the walls behind us.

  You are here for different reasons, and yet, you are held by the same tension. The scholars are here to examine a thesis. The families are here to remember a person. My job tonight is to hold those two impulses together without letting either break.

  You will notice on the program that the title of this exhibition is "Moral Equlity in the Letters." We are leaving that typo exactly as it is. It serves as a reminder that what we are attempting here is imperfect. Equality is a clean, mathematical concept. Morality is messy. And letters… letters are intimate.

  We know the history of this conflict. We do not gather here to debate which flag was right. History has rendered a severe judgment on the aims of one side of this war. We cannot erase that. To say that both causes were equal would be a lie, and it would be an insult to the victims of that injustice.

  However, we are not here to judge the causes tonight. We are here to look at the combatants.

  This brings us to the difficult idea hinted at in our title. In just-war theory, there is a concept called the moral equality of combatants. It suggests that soldiers on both sides stand on the same ground regarding the act of fighting itself. Regardless of why they are there, once they are in the field, they are equally permitted to fight, and equally liable to be killed.

  I know what some of the philosophers in this room are thinking. You know the critiques. You know that if a cause is unjust, how can the soldier fighting for it be morally equal to the one defending justice?

  But I ask you to consider a distinction, one that is vital for the families here tonight. There is a difference between *liability* and *virtue*.

  To be liable to attack—to be a legitimate target in war—is not the same as being a villain. A soldier can be liable to be shot without being morally corrupt. Conversely, a soldier can be shot without being a martyr. The uniform makes them liable. The cause makes the war just or unjust. But the person inside the uniform? That is where virtue lives, and virtue is rarely uniform.

  This distinction is easy to write in a journal article. It is much harder to stand in front of a letter written by a nineteen-year-old boy who is terrified.

  When you read these letters, the theory begins to sweat. You see the ink smudges. You see the pleas to mothers not to worry. You see the descriptions of cold mud, of hunger, of missing home. In those moments, the abstract idea of "liability" feels cold. It feels like we are reducing a human life to a tactical variable.

  If I stand here and say "these men were equally liable to be killed," it sounds like I am saying their deaths were equal. They were not. Every death is a unique universe extinguished.

  But if I say "these men were morally different because their causes were different," I risk turning the soldiers on the unjust side into monsters. And when you read the letter in Case Four, the one where the soldier sends his rations to a starving child in a village he was ordered to burn… can we call him a monster? He was participating in an unjust war. He was liable to be killed by the enemy. But in that moment, was he devoid of virtue?

  This is the tightrope we walk tonight.

  To the families here: I know what it is to love a relative whose history is complicated. You want to honor the man without endorsing the war. You want to feel pride in his courage, his loyalty, his love for his family, without feeling that you are apologizing for the uniform he wore.

  This exhibition invites you to do exactly that. We are not asking you to justify the cause. We are asking you to witness the human being. The moral equality we speak of is not about saying both sides were right. It is about saying both sides were human. Both sides were capable of fear. Both sides were capable of kindness, and both sides were capable of cruelty.

  The symmetry thesis does not demand that we flatten history. It demands that we complicate our judgment. It asks us to recognize that a person can be caught in a machinery of injustice and still retain their humanity. It asks us to acknowledge that your relative could be a good man who did bad things, or a bad man who did good things, or most likely, a confused young man trying to survive.

  To the scholars: I know this feels imprecise. You want clean categories. But these letters resist categorization. They resist the clean separation of *jus ad bellum* and *jus in bello*. When a soldier writes to his sister about the smell of the trenches, he is not debating liability. He is living it.

  So, tonight, I invite you to read these letters with a dual vision. Hold the justice of the cause in one hand, and the humanity of the soldier in the other. Do not drop either.

  If we only look at the cause, we turn these men into caricatures of evil or heroes of propaganda. If we only look at the humanity, we risk turning war into a mere tragedy where no one is responsible, where "both sides suffered" becomes a way to silence the question of who was right.

  We must avoid both traps. We must acknowledge that one side fought for something wrong, while simultaneously acknowledging that the soldiers on both sides shared the same vulnerability, the same fear, and the same capacity for love.

  The typo in our title, "Moral Equlity," is fitting. There is no perfect equality here. There is only the rough, uneven ground of memory. There is the ink, and the paper, and the silence that follows.

  As you walk through the exhibition, I ask that you read slowly. When you look at the letter from the soldier on the unjust side, do not look away from the injustice. But do not look away from the boy asking his mother for forgiveness either.

  Let these letters constrain us. Let them remind us that while we can judge the war, we must be very careful how we judge the dead. They are no longer liable to be killed. They are only liable to be remembered. Let us ensure we remember them fully—the cause, the uniform, and the hand that held the pen.

  Thank you.
