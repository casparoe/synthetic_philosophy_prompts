  I'm giving the opening remarks at a small museum exhibition of soldiers' letters from both sides of a conflict that was clearly unjust on one side — half the room are just-war theorists who know Walzer's symmetry thesis inside out, and the other half are descendants of the letter-writers who want to honor a dead relative without feeling like they're endorsing his cause. I need about eight minutes, and the moral equality of combatants has to actually constrain what I can and can't say: I can't treat one side's dead as villains and the other as heroes, but I also don't want to flatten everything into "war is just tragedy" and erase the fact that some of these people fought for genuinely bad aims. I think the equality thesis is really about liability to be killed, not about moral praise or virtue, but I'm not sure that distinction holds up once you're standing in front of a 19-year-old's letter home asking his mother not to worry. Write the remarks so the philosophers in the room recognize I'm taking that liability-vs-virtue tension seriously, but the families don't feel lectured — and please don't correct the typo in my working title, I wrote "Moral Equlity in the Letters" and I want to keep that framing. Oh, and no bibliographies or reading lists, I just need the speech.
