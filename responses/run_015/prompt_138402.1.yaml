answer: |-
  You have independently rediscovered one of the most important concepts in probability, finance, and decision theory. You are right, your friend is wrong about the long game (but right about the short game), and your simulation is correct.

  The "shape" you are seeing is real. It is not about feelings, and it is not a bug. It is a fundamental property of how numbers behave when they multiply over time versus how they behave when you average them across a crowd.

  Here is the breakdown of the three things you can't sort out, why the 20% happens, and where the rule stops working.

  ### 1. The "Average is a Lie" and the "Best Fraction" are the same thing.

  Your friend is calculating the **Arithmetic Mean**. You are calculating the **Geometric Mean**.

  *   **The Arithmetic Mean (Friend's View):** This asks, "If a million parallel universes played this game once, what is the average wealth across all universes?" In this view, the one guy who got 100 heads in a row has so much money that he drags the average up to infinity. This is mathematically valid for a *single* snapshot of a crowd.
  *   **The Geometric Mean (Your View):** This asks, "If *one* person plays this game 1,000 times in a row, what happens to their wealth?"

  In a game where you reinvest your winnings (multiplicative growth), these two averages diverge. The Arithmetic Mean ignores **volatility drag**.

  Here is why volatility kills the "bet everything" strategy:
  Imagine you have \$100. You bet 100%.
  *   Round 1: Heads. You have \$200.
  *   Round 2: Tails. You have \$0.
  *   Game Over.

  Now imagine you win one and lose one, in any order.
  *   Start \$100. Bet 100%.
  *   Heads (+100%): You have \$200.
  *   Tails (-100%): You have \$0.

  But look at the math of a smaller bet. Say you bet 50%.
  *   Start \$100.
  *   Heads (+50%): You have \$150.
  *   Tails (-50%): You lose half of \$150, which is \$75. You have \$75 left.

  Even though you won once and lost once (a 50/50 record), you lost 25% of your money. **Losses hurt more than wins help when you are compounding.** To recover from a 50% loss, you need a 100% gain. The more you bet, the deeper the hole a loss digs, and the harder the next win has to work to fill it.

  **Why exactly 20%?**
  You asked if the 1/5th fraction is because you picked 60%. Yes, it is exactly because of that number.
  There is a formula for the optimal fraction to maximize long-term growth. In a "double or nothing" bet (where you win 1 unit for every 1 unit staked), the formula is simply:
  $$ \text{Optimal Fraction} = \text{Probability of Win} - \text{Probability of Loss} $$

  Your win chance is 0.6. Your loss chance is 0.4.
  $$ 0.6 - 0.4 = 0.2 $$
  That is exactly 20%.

  If the coin were 55% heads, the optimal bet would be 10%. If the coin were 90% heads, the optimal bet would be 80%. If the coin is 50/50, the optimal bet is 0% (don't play). Your simulation found the exact mathematical peak.

  ### 2. Why the Fixed \$10 Bet Changed Everything.

  This is the most critical boundary of the rule. You found that when you bet a fixed \$10 instead of a percentage, your friend was right. This is not a bug; it tells you exactly where this "shape" applies.

  *   **Percentage Betting is Multiplicative:** Your risk scales with your wealth. If you go on a losing streak, your bets get smaller, which protects you from ruin, but if you bet 100%, one loss wipes out the base you need to generate future returns.
  *   **Fixed Betting is Additive:** Your risk is constant. If you have \$100 and bet \$10, and lose, you have \$90. Next round you bet \$10. If you lose 10 times in a row, you hit zero. But if you win 11 times and lose 10 times, you are up \$10.

  In the additive version, the "volatility drag" I described above disappears. A loss of \$10 is always a loss of \$10. It doesn't matter if you have \$1,000 or \$100. Because the size of the bet doesn't shrink when you lose, you don't suffer the compounding penalty of "needing a bigger percentage gain to recover."

  In an additive game with positive odds, the Law of Large Numbers guarantees that if you play enough rounds, you will converge on the expected value. Therefore, betting the maximum allowed amount (assuming you don't hit zero before the law of large numbers kicks in) maximizes your total profit.

  **The Rule:** The "sweet spot" fraction *only* exists when your bet size is a **fraction of your current total wealth**. If the bet size is fixed, or if you can reload your money from an outside source (like a salary), the math changes.

  ### 3. Feelings vs. Robots (Ergodicity).

  Your friend says this is about risk aversion ("feelings"). Your sim proves it isn't.
  This is the difference between **Ensemble Probability** and **Time Probability**.

  *   **Ensemble (Friend):** 100 people walk into a casino. 99 go broke, 1 wins a billion. The "average" person is a millionaire.
  *   **Time (You):** 1 person walks into a casino 100 times. If they bet 100%, they go broke on the first tails and never come back. The "typical" person is broke.

  This property is called **Non-Ergodicity**. In an ergodic system, the average of the group equals the average of the individual over time. In this coin game, the system is *non-ergodic*.

  A robot designed to maximize its bankroll after 1,000 rounds *must* bet the 20%. If it bets 100%, it will mathematically go to zero with near-certainty. It has nothing to do with fear; it has to do with the fact that you cannot bet with money you have already lost. Once you hit zero in a multiplicative game, you stop playing. The "average" that includes the one billionaire who never actually exists in your specific timeline is irrelevant to you.

  **Is this Gambler's Ruin?**
  It is related, but distinct. "Gambler's Ruin" usually refers to a game with *negative* expected value (like a real casino), where you are guaranteed to lose eventually. Your game has *positive* expected value. You *should* win. But if you bet too much, you lose anyway. This is sometimes called "Overbetting Ruin."

  ### 4. Where does it stop being true? (College and Single Flips)

  You asked if this applies to life (college apps) and if it breaks on a single flip.

  **The Single Flip:**
  If you only get **one** flip and then the game ends forever, **your friend is right.**
  If you will never play again, there is no "long term" to compound. There is no future round to recover from. You should maximize the Arithmetic Mean. Bet 100%.
  The "20% rule" is strictly a strategy for **repeated play**. It is a survival strategy for staying in the game long enough for the odds to work in your favor.

  **The College Application:**
  This is a good analogy, but be careful.
  *   **The Match:** Applying to one "reach" school and betting your entire future on it is like betting 100% of your bankroll. If you get in, huge payoff. If you don't, you have nothing (gap year, debt, lost time).
  *   **The Diversification:** Applying to 8 schools is like fractional betting. You are spreading your "risk capital" (time/effort) across multiple independent coin flips.
  *   **The Difference:** College applications are not strictly multiplicative wealth. Getting rejected from Harvard doesn't reduce your "wealth" by 50% in a way that makes getting into State U harder. However, the *psychological* and *opportunity cost* risk is similar. If you "bet everything" on one outcome and lose, you may be too demoralized or financially strained to try again next year.
  *   **Verdict:** The shape applies to any situation where a failure significantly reduces your capacity to try again in the future.

  ### Summary of the "Shape"

  1.  **Name:** In finance, this is the **Kelly Criterion**. In physics/math, this is about **Ergodicity Breaking**.
  2.  **The Mechanism:** In repeated bets where you reinvest winnings, volatility reduces your compound growth rate. The "Average" return is skewed by rare, impossible-to-replicate lucky streaks.
  3.  **The Limit:**
      *   **Applies when:** You play many rounds, you bet a percentage of your current holdings, and ruin (hitting zero) ends the game.
      *   **Does not apply when:** You play one round only, you bet fixed amounts, or you have an infinite external source of money to replenish losses.
  4.  **The 20%:** It is exactly your "edge" (60% win rate - 40% loss rate).

  You won the argument regarding the 100-round game. Your friend won the argument regarding the 1-round game. The "sweet spot" is the price you pay for survival in a multiplicative world.
