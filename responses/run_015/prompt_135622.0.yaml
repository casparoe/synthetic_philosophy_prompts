  The gene commands the limb to move or stay,
  And winter culls the weak who lose the way.
  No thought intrudes upon the coded stream,
  We act the script within the living dream.
  The fit survive to pass the design down,
  While failure wears extinction's heavy crown.

  I press the bar and wait, I press the bar and wait,
  The food arrives, the food arrives too late.
  I press the bar and wait, I press the bar and wait,
  Avoid the shock, avoid the shock, the fate.
  The world shapes me as I shape the space,
  Reinforcement guides the step and the pace.

  I test the path (without the risk of fall)
  Inside the skull's protected, private hall.
  (If cliff then crash) the simulation says,
  I halt the body through the mental maze.
  My theories die before the action starts,
  Saving the flesh from real-world darts.

  We stand on bones of those who pressed the bar,
  (I press the bar and wait) but now we are
  Naming the shadows they could not perceive.
  The gene commands? We choose to leave.
  I hold the map of instincts I don't feel,
  Possessing words for a life that has no words for itself.
