          *   (3)-(5) Surprise Exam Paradox: Uses the standard backward induction argument to show that in a bounded, announced set, surprise is logically impossible for perfectly rational agents.
          *   (6) Generalization: Extends the paradox to any agent with perfect logical competence and common knowledge thereof.
          *   (7) Application to AI: A fully transparent AI knows its own computation graph/weights, so it "knows" its output before it happens (determinism + introspection).
          *   (8) Conclusion: Transparent AI cannot be surprised by its own outputs.
          *   (9) Observation: We *do* design systems to detect "surprises" (anomalies).
          *   (10) Dilemma: Either AI surprise is fake/broken, or a premise is wrong.
      *   **The Question:** Where does the chain break? If preserving (1) (definition of surprise) and (4)-(5) (backward induction validity), which of (2), (6), (7), or (8) is least costly to reject, and what are the implications?

