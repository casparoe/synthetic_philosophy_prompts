answer: |-
  Reading Du Bois's Criteria of Negro Art against the facts of Marian Anderson's 1939 concert creates a productive friction, particularly because Anderson's own account denies the protest intent that Du Bois would deem mandatory. If we apply your tripartite distinction, the concert functions primarily as occasion propaganda, though it relies heavily on exemplar propaganda to succeed, while carrier propaganda remains the least dominant yet necessary element. The content of the performance, the carrier, consisted of classical arias and spirituals closing with a patriotic hymn. On their face, Schubert lieder or even My Country, Tis of Thee are not inherently radical texts, and Anderson's insistence that she was not staging a protest suggests she did not intend the carrier to bear the weight of the argument. However, Du Bois would likely argue that the selection of spirituals arranged in a classical style serves a carrier function by insisting on the dignity and universality of Black folk material, but the real political weight lands in the occasion. The setting of the Lincoln Memorial steps, following the DAR's exclusion, transforms the performance into an argument about citizenship and access that the songs themselves do not explicitly make. This is occasion propaganda in its purest form: the who-and-where overrides the what. Simultaneously, the concert operates as exemplar propaganda because Anderson's technical mastery and composure serve as empirical evidence against claims of racial inferiority. Her existence on that stage at that level of proficiency is the refutation, functioning as proof rather than persuasion.

  When we weigh this against Du Bois's own practice, he licenses all three modes but prioritizes exemplar and carrier propaganda grounded in high aesthetic standards. His editing of The Crisis and his production of pageants like The Star of Ethiopia show he understood the power of staging and context, meaning he would not reject occasion propaganda as illegitimate. However, his fierce critiques of Harlem Renaissance writers who he felt were flattering white taste suggest he would be wary of carrier propaganda that relied on exoticism or minstrelsy. Anderson's choice of the European classical canon might seem like accommodation to white taste, but Du Bois generally believed that mastering universal high culture was a strategy for claiming equality, so he would likely view her repertoire as exemplar propaganda rather than submissive flattery. He would reject any version of occasion propaganda that relied on pity rather than excellence, which is where his beauty requirement becomes critical. For Du Bois, the beauty requirement attaches primarily to the work, not the staging. If Anderson had sung poorly, the occasion would have become a spectacle of failure rather than a triumph of dignity, and the exemplar claim would have collapsed. The beauty of the voice validates the political claim of the occasion; without the aesthetic excellence, the propaganda becomes worthless because it fails to prove capacity.

  This case, however, puts pressure on Du Bois's theory regarding the definition of propaganda itself. If the occasion alone can convert a non-protest performance into a political act, then the claim that all art is propaganda risks collapsing into near-vacuity, where any performance by a Black artist in a segregationist capital is automatically political regardless of content or intent. Du Bois's framework is somewhat silent on this reception-based definition of propaganda, as he tends to focus on the creator's duty to intend the propaganda. The Anderson episode suggests that once occasion counts, the live question is never whether it was propaganda but what sort of work occasion-propaganda can do. It confirms Du Bois's insistence that art cannot be separated from the social struggle, but it complicates his normative claim that artists must consciously wield art as a weapon. Here, the weapon was forged by the Roosevelt administration and the DAR's exclusion, not solely by Anderson. The gap in Du Bois's framework is that he does not fully account for how the audience and the historical moment can conscript art into propaganda against the artist's own understanding of their work. He assumes the artist controls the propaganda value through intent and beauty, but the Lincoln Memorial concert shows that the context can impose propaganda value externally. Ultimately, the episode strengthens the utility of your distinction by showing that while Du Bois was right that beauty is required for the propaganda to be effective, he underestimated how much the occasion could carry the political load when the carrier is deliberately neutral. The theory holds, but only if we admit that the propaganda function is not solely the property of the artist, but is co-authored by the circumstances of reception.
