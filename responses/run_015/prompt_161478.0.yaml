      *   **Constraints:**
          *   Use specific facts provided about the concert (DAR refusal, ER resignation, Roosevelt admin arrangement, 75k crowd, radio audience, program content, Anderson's own account of non-protest intent).
          *   Use the user's specific tripartite distinction: (a) carrier propaganda (message in content), (b) occasion propaganda (argument in setting/audience), (c) exemplar propaganda (existence as evidence against inferiority).
          *   Analyze which of these Du Bois's own practice licenses vs. rejects (considering his critiques of Harlem Renaissance writers).
          *   Address where the "beauty" requirement attaches (work, staging, or neither).
          *   Evaluate what the episode does to the theory (confirms it, collapses it into vacuity, shifts the question to what occasion-propaganda can do).
          *   Be honest about gaps/silences in the framework.
          *   **Format:** Continuous prose, like an email. No headings, bullets, bold, or tables.

  2.  **Deconstruct Du Bois's Theory:**
      *   Core claim: All art is propaganda and ought to be.
      *   Constraint: Propaganda without beauty is worthless.
      *   Context: He was critiquing art for art's sake (countering Locke some, but mostly reacting to white critics who wanted either primitive exoticism or polite assimilation). He wanted art that advanced the cause of Black equality.
      *   His practice: *The Crisis* (editing), pageants (like *The Star of Ethiopia*), promoting high culture (spirituals arranged formally, classical standards) while demanding racial pride. He criticized writers who caricatured Black life to please white audiences (e.g., some Harlem Renaissance figures).

  3.  **Analyze Marian Anderson's Concert via the Tripartite Distinction:**
      *   (a) Carrier Propaganda: The content. She sang classical arias (Schubert, etc.) and spirituals ("My Country, 'Tis of Thee"). Did the *songs themselves* carry a protest message? "My Country" is patriotic, spirituals have coded history, but Anderson claimed she wasn't protesting. Du Bois might see the spirituals as carrier propaganda if arranged to show depth, but the classical arias are racially neutral on their face.
      *   (b) Occasion Propaganda: The setting. Lincoln Memorial, Easter Sunday, after DAR exclusion. This is the strongest fit. The *fact* of her singing there is the argument.
      *   (c) Exemplar Propaganda: Her excellence. A Black woman singing at the highest level refutes inferiority claims. Du Bois definitely licenses this (Talented Tenth logic).

  4.  **Evaluate Du Bois's License/Rejection:**
      *   Du Bois valued high art (classical training, spirituals arranged seriously). He would approve of Anderson's excellence (Exemplar).
      *   He valued art that serves the race. He might be wary of "carrier" propaganda that is too blunt or ugly, but he insists art *must* be propaganda.
      *   He criticized Harlem Renaissance writers for flattering white taste (primitivism). Anderson sang classical European music. Is that flattering white taste? Du Bois generally believed mastering Western canon was a way to claim citizenship and equality (Exemplar). So he'd likely approve, provided it wasn't self-abasing.
      *   Which does he license? He licenses all three, but prioritizes Exemplar (proof of capacity) and Carrier (if done beautifully). Occasion is trickier because it relies on context outside the artist's control sometimes.
      *   Where does "beauty" attach? Du Bois says "propaganda which isn't also beautiful is worthless." This usually refers to the *work* (the art itself). But if the *occasion* is the propaganda, does the occasion need to be beautiful? Or just the singing? Du Bois would likely say the performance must be beautiful to validate the claim of equality. Ugly protest art fails.

  5.  **Evaluate the Theory vs. The Case:**
      *   Does the concert confirm "all art is propaganda"? Yes, even if Anderson didn't intend it, the context made it so.
      *   Does it collapse the theory into vacuity? If *any* performance by a Black artist in DC is propaganda, does the term lose meaning? Du Bois says art *ought* to be propaganda (normative), not just that it *is* (descriptive). But he also says "all art is propaganda." The Anderson case suggests that *reception* makes it propaganda regardless of intent.
      *   The shift: The live question becomes what *sort* of propaganda (occasion vs. carrier) works best.
      *   Gaps: Du Bois focuses heavily on the creator's intent and the work's aesthetic quality. He is less explicit on the *reception context* (occasion) as a constitutive part of the art's propaganda value, though his pageants show he understood staging. The framework is silent on what happens when the artist *disavows* the propaganda intent (Anderson said she wasn't protesting). Du Bois might say her intent doesn't matter; the effect does.

  6.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Academic but conversational (email style), continuous prose.
      *   *Structure:*
          1.  Intro: Du Bois's thesis vs. Anderson facts.
          2.  Apply the three categories (Carrier, Occasion, Exemplar) to the concert.
          3.  Assess Du Bois's licensing of these based on his practice/critiques.
          4.  Address the "beauty" requirement (where does it attach?).
          5.  Critique the theory based on the case (vacuity risk, shift to occasion).
          6.  Identify gaps (intent vs. effect).
      *   *Check constraints:* No bold, no bullets, no headings. Continuous prose.

  7.  **Refining the Argument:**
      *   *Carrier:* Anderson sang "My Country, 'Tis of Thee." Is that propaganda? In that context, yes. But the arias? Less so. Du Bois wants the art to plead the cause.
      *   *Occasion:* This is the heavy lifter. The Lincoln Memorial setting *makes* it propaganda. Du Bois's pageants were similar (staging matters).
      *   *Exemplar:* Her voice itself is the argument against inferiority. Du Bois loves this.
      *   *Du Bois's Preference:* He criticized those who flattered white taste. Singing Schubert isn't flattering white taste if it's claiming ownership of universal culture. He'd like Anderson. He might worry if the *only* message is "look how well I sing their music" (assimilation) vs "look at my people's spirituals." But he valued spirituals highly.
      *   *Beauty:* Must attach to the work (the singing). If the singing was bad, the occasion wouldn't matter. The beauty validates the exemplar claim.
      *   *Theory Collapse:* If occasion makes it propaganda, then "all art is propaganda" is descriptively true but normatively weak unless we specify *which* propaganda. Du Bois wants *effective* propaganda. The Anderson case shows occasion can outweigh carrier content.
      *   *Gap:* Du Bois doesn't fully account for the artist's lack of intent. He assumes the artist *should* intend it. Anderson didn't. Does that matter? Du Bois might say the race needs it regardless of her intent.

  8.  **Final Polish (checking against "no formatting" rule):**
