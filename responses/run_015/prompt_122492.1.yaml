      *   *Shrinkage:* The "Decline Effect" is real. Even in pre-registered replications, effects often shrink. Why? Regression to the mean, winner's curse, hidden flexibility *within* pre-registrations, or genuine context sensitivity.
      *   *Bayesian Advantage:* Bayes factors incorporate prior odds. If the prior odds of a hypothesis are low (e.g., ESP), a significant p-value is still likely false. Frequentism doesn't account for base rates.

