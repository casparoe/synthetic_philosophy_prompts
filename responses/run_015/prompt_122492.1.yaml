answer: |-
  This is a robust, steel-manned position. It aligns with the dominant meta-scientific consensus (Ioannidis, Open Science Collaboration, Nosek) that *questionable research practices (QRPs)* and *publication bias* are the primary drivers, not the mathematical properties of $p$-values themselves.

  However, your operational test (the Shrinkage Ratio) and your dismissal of the statistical framework contain specific vulnerabilities. You are conflating "incentives that drive bad statistics" with "statistical properties that amplify incentives."

  Here is the stress test you requested, ranked by severity.

  ### Part 1: Defeaters (Ranked Fatal → Awkward)

  #### **Fatal Defeaters**
  *These would require you to abandon the claim that "inference method was never the problem."*

  **(a) Already Happened: The Persistent Winner's Curse in Pre-Registered Replications**
  *   **The Data:** In the *Reproducibility Project: Psychology* and *ManyLabs*, even among pre-registered, high-power replications where the original authors approved the protocol, the median shrinkage ratio is roughly **0.5 to 0.7**, not 1.0.
  *   **Why it's Fatal:** You attribute this to "leftover incentive rot" (e.g., original power analysis was based on biased pilot data). But if the *original* study was also pre-registered (or if we look at large-scale preregistered discovery projects), the inflation persists. This is the **Winner's Curse**: a statistical property where, conditional on crossing a significance threshold, the effect size estimate is biased upward. This bias exists *even if the researcher is perfectly honest*. It is a property of the frequentist estimator under selection, not just an incentive bug. If shrinkage persists in a world of perfect incentives, the estimator is structurally biased.

  **(b) Hypothetical: High False Discovery Rate (FDR) Despite Perfect Reform**
  *   **The Scenario:** A field adopts Registered Reports, 95% power, and publishes nulls. Yet, when meta-analyzed, the False Discovery Rate (proportion of significant findings that are false) remains >30%.
  *   **Why it's Fatal:** This implies that $p < .05$ on a pre-committed test is *not* "basically fine." It implies that for low-base-rate hypotheses, the Type I error rate is not $\alpha$, but rather determined by the prior odds (Ioannidis's 2005 theorem). If incentives are fixed and FDR remains high, the error is in using a method that ignores base rates (Frequentism) rather than one that incorporates them (Bayes).

  #### **Awkward Defeaters**
  *These complicate the view but allow for "Yes, but..." maneuvering.*

  **(a) Already Happened: The "Garden of Forking Paths" Within Pre-Registrations**
  *   **The Data:** Analyses of pre-registration documents often show vague analysis plans (e.g., "outliers will be removed" without criteria).
  *   **Why it's Awkward:** You can argue this is just "incomplete incentives" (we need stricter registration). But it highlights that *specification* is a statistical problem. Frequentist inference requires the sample space to be fully defined *before* seeing data. If human language cannot bind the degrees of freedom tightly enough to satisfy the math, the math is mismatched to the practice.

  **(b) Hypothetical: Bayesian Calibration Outperforms in Head-to-Head**
  *   **The Scenario:** In a controlled competition (same data, same incentives), Bayesian methods with skeptical priors consistently filter out findings that fail replication, while frequentist pre-registrations let them through.
  *   **Why it's Awkward:** It suggests that while incentives are the *cause*, Bayesian statistics are a better *vaccine*. You'd have to concede that while the disease is incentives, the frequentist immune system is weaker.

  ---

  ### Part 2: Stress-Testing Your Operational Test

  #### **(1) Is there a Shrinkage Ratio threshold < 1 that forces concession?**
  **Yes. If the ratio stabilizes around 0.6–0.7 even after incentives are maximized.**

  Here is the logic: If the only problem was $p$-hacking and publication bias, removing them should make the original literature an unbiased sample of the truth. The replication (which is unbiased) should match the original. Ratio = 1.

  If the ratio stays at 0.6, it means the original significant findings were *statistically guaranteed* to be overestimates due to **selection bias on noise**. This is the **Type M (Magnitude) Error**.
  *   **The Concession:** You must admit that NHST is structurally prone to magnitude inflation in low-power or noisy environments, regardless of intent. This is a *statistical* flaw, not an *incentive* flaw. Incentives select for significance; statistics dictate that selecting for significance selects for overestimation. You cannot fix this with Registered Reports alone; you need shrinkage estimators or Bayesian priors to correct the magnitude.

  #### **(2) Is there a predictive asymmetry? (Could Bayes have predicted shrinkage?)**
  **Yes. The "Base Rate Neglect" Asymmetry.**

  *   **Frequentist Prediction:** A pre-registered $p = 0.04$ implies the same strength of evidence whether the hypothesis is "Aspirin cures headache" or "Telepathy exists." It predicts similar replicability for both.
  *   **Bayesian Prediction:** A Bayesian calculates $P(H_1 | Data) \propto P(Data | H_1) \times P(H_1)$.
      *   For Aspirin: High prior $\rightarrow$ High posterior $\rightarrow$ Predicts replication.
      *   For Telepathy: Near-zero prior $\rightarrow$ Low posterior (despite $p=0.04$) $\rightarrow$ Predicts failure/shrinkage.
  *   **The Asymmetry:** In the actual replication crisis, "weird" social priming effects (low prior plausibility) shrank much more than basic cognitive effects (high prior plausibility). A Bayesian model *could have predicted this differential shrinkage in advance* based on theoretical plausibility. A frequentist model treating both as $p < .05$ tests could not.
  *   **Verdict:** "A prior would've saved us" is **not** pure hindsight. It is a claim about calibration. If you care about calibration (as you stated), ignoring prior odds is a structural defect.

  ---

  ### Part 3: The Insulation Check (What should move you?)

  You asked which of these should move you most:
  1.  **Type M / Magnitude-error argument.**
  2.  **Evidence about how bad scientists' implicit priors actually are.**
  3.  **An actual case where a Bayesian treatment would have stopped a silly finding.**

  **Winner: (1) The Type M / Magnitude-error argument.**

  **Why:**
  *   **Option 2 (Implicit Priors)** is too subjective. You can always argue "Well, *my* prior was high," insulating yourself from the critique.
  *   **Option 3 (Case Studies)** is anecdotal. You can dismiss it as "cherry-picked."
  *   **Option 1 (Type M)** attacks your **Shrinkage Ratio** test directly.

  Gelman and Carlin's Type M error argument demonstrates that in noisy settings, *statistically significant* results are mathematically guaranteed to be overestimates.
  *   **The Trap:** You currently defend yourself by saying "power was still overestimated."
  *   **The Reality:** Power analysis *requires* an effect size estimate. If you take that estimate from the biased literature (which you must, because there is no other literature), your power analysis is **garbage-in, garbage-out**. You cannot "fix" this with better incentives; you fix it by acknowledging that the frequentist point estimate is a biased input for planning.
  *   **The Move:** If you accept that power analysis based on published literature is statistically doomed to overestimate power (because published lit is selected for significance), you admit that **Frequentist planning tools are structurally incompatible with a selected literature.** That is a statistical problem, not an incentive one.

  ### Summary of the "Statistical Costume" Critique

  Your view is 80% correct: incentives are the engine. But the statistics are the **transmission**.

  *   **Incentives** push researchers to find $p < .05$.
  *   **Frequentist NHST** ensures that when you push for $p < .05$ in a noisy environment, you inevitably select for **overestimated effect sizes** (Type M) and **false positives in low-base-rate fields** (Type S/Sign).

  If you fix the incentives (no more p-hacking), you stop the *egregious* fraud. But you do not stop the **Winner's Curse**. To stop the Winner's Curse, you need statistical reform (shrinkage estimators, Bayesian priors, or focusing on CIs over point estimates).

  **Final Verdict:** Your view holds only if you define "statistics problem" narrowly as "math is broken." If you define it broadly as "the inferential framework does not account for selection bias and prior odds," then the replication crisis *is* partially a statistics problem. The costume fits.
