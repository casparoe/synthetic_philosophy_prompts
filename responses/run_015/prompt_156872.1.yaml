      *Wait, I need to address the "Debt".* The activity must show that *something* is happening (the illusion), but the *interpretation* is wrong.
      Let's create a scenario where they generate a report that they swear is accurate, then show it was generated by a rule they didn't know they were following.
      **The "Rule-Following" Introspection.**
