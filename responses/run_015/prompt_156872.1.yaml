      This is strong. It attacks the "Direct Apprehension" property of qualia.
      If 'what it is like' is tied to confidence/clarity, and confidence is a post-hoc bet, then 'what it is like' is a bet, not a given.

      *Let's build the session around this.*
      **Title:** "The Confidence Calibration."
      **Materials:** Printed sheets with faint patterns (noise + weak signal), index cards, chips (for betting).
      **Structure:**
      1.  **Task:** Detect signal in noise.
      2.  **Report:** Yes/No + Confidence Rating (1-5).
      3.  **Manipulation:** Change the payoff for Confidence without telling them. (e.g., Round 1: Accuracy pays. Round 2: High Confidence pays regardless of accuracy).
      4.  **Observation:** Confidence ratings shift even when stimulus is identical.
      5.  **Debrief:** Connect "Confidence/Clarity" to "Phenomenal Feel." If the 'feel' tracks the payoff, is it intrinsic?

      *Wait, the Realist will say:* "The *decision* changed, not the *experience*."
      *Counter:* "How do you know? You only have access to the report. If the report is sensitive to payoff, the 'introspective access' is not a passive mirror."
      *To make it uncomfortable:* Force them to commit to a description *before* the payoff change, then ask if the *experience* changed.
      Actually, let's use the **"Change Blindness for Introspection"** angle.
      No, let's stick to the **Constructive Introspection** angle.
      The activity needs to show that introspection *adds* something.
      Let's use **Verbal Overshadowing on a Visual Afterimage.**
      1.  Stare at a color patch. Look at white wall. See afterimage.
      2.  Group A: Describe the color in detail immediately.
      3.  Group B: Do a spatial task immediately.
      4.  Both report the "vividness" (phenomenal intensity) after 2 mins.
      5.  Group A (verbal) usually reports less vividness/different quality due to interference.
      6.  Point: The act of introspecting (describing) altered the 'phenomenal property'. Therefore, the property isn't stable/intrinsic. It's dependent on the mode of access.

      *Okay, combining the "Payoff/Confidence" and "Interference" ideas.*
      Let's go with a **"Phenomenological Betting Market."**
      This fits the "14 people" and "chips" idea the user mentioned.
      **Core Mechanic:** They bet on their own introspective reports.
      **Twist:** The definition of the terms they are betting on shifts subtly, or the cost of betting shifts.
      **Better:** The **"Stroop of Introspection."**
