      Realist: "Different aspects of the same experience."
      Illusionist: "The 'heaviness' qualia didn't exist until you attended to it. Attention constructs the property."

      *Okay, I have a solid plan.*
      **Activity:** "The Constructive Report."
      **Phase 1:** Baseline phenomenological description of a neutral stimulus (e.g., a sustained tone or a fixed visual pattern).
      **Phase 2:** The "Theoretical Lens." Half the room gets a "Physicalist Brief" (describe wavelengths/frequencies), half gets a "Poetic Brief" (describe emotions/vibes).
