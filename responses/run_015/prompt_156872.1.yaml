      *Okay, let's pivot to the "Judgment vs. Experience" distinction.*
      Illusionism says: What you call "phenomenal consciousness" is actually a *judgment* about access consciousness.
      Activity: **The "Confidence vs. Accuracy" Trade-off.**
      Show a faint stimulus. Ask: "Did you see it?" and "How confident are you?"
