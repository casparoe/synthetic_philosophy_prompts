      Use a stimulus that is *ambiguous* but feels *determinate*.
      The Necker Cube is the classic. But again, "the flipping is an experience."
      We need to target the *sense of reality* or *presence*.

      *Okay, here's the winning concept:* **The "Introspective Interference" Protocol.**
      We treat introspection as a second-order process that competes for resources.
      If introspection were a direct window, adding load shouldn't change the *content* of the window, only the clarity.
      If adding a cognitive task changes the *reported quality* of a simple sensation, it suggests the quality is constructed by the same resources.
      *Better:* Use **Verbal Overshadowing**. Describing a face makes it harder to recognize. Describing a taste changes the taste.
