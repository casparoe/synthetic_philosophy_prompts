answer: |-
  Here is a complete design for your 90-minute session. It avoids the "illusion-as-experience" trap by targeting the **authority and stability** of introspective reports rather than the existence of experience itself. It forces the group to confront the *constructive* nature of introspection, which is the engine of the illusionist claim.

  ### Activity Title: "The Calibration Protocol"
  **Core Mechanic:** Participants treat their own introspection as an instrument that needs calibrating. You manipulate the "settings" (context/framing) to show that the "readings" (phenomenal reports) shift without a change in the "input" (sensory stimulus).
  **Goal:** Demonstrate that introspective reports are theory-laden constructions, not passive mirrors of intrinsic properties.
  **Materials:**
  *   Projector (for a single static image).
  *   Printed "Data Sheets" (index cards or half-sheets).
  *   50 poker chips or tokens per person (for "credence staking").
  *   Whiteboard.

  ---

  ### Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Rules, distribution of chips, no theory mentioned. |
  | **10–25** | **Round 1** | Baseline reporting on a neutral stimulus. |
  | **25–40** | **Round 2** | "Framing" manipulation (The interference). |
  | **40–55** | **Round 3** | The Swap & Credence Check. |
  | **55–75** | **Debrief** | Guided discussion mapping moves to philosophical claims. |
  | **75–90** | **Reveal** | Naming "Illusionism," defining the "Debt," Q&A. |

  ---

  ### The Activity Steps

  #### 1. Setup (00–10)
  *   **Room Arrangement:** Divide the room into two halves (Left/Right) without making a big deal of it. Just hand out different colored Data Sheets (e.g., White for Left, Yellow for Right).
  *   **The Premise:** Tell them: *"We are testing the reliability of introspective reporting under different cognitive loads. You are the sensors. Your job is to report on the properties of the stimulus as accurately as possible. You have 50 chips. You will stake these on the stability of your own reports."*
  *   **The Stimulus:** Project a single, static image. **Crucial:** It must be ambiguous but neutral. A mid-grey field with low-contrast Gaussian noise (looks like TV static but grey). Do not change this image for the entire 90 minutes.

  #### 2. Round 1: Baseline (10–25)
  *   **Instruction:** *"Look at the image for 60 seconds. On your Data Sheet, write down three adjectives that describe the **intrinsic visual quality** of the image. Not what it represents, but what it looks like. (e.g., 'grainy', 'flat', 'buzzing')."*
  *   **Private:** They do not share these yet.
  *   **Stake:** Ask them to stake 5 chips on the claim: *"If I look at this again in 10 minutes without closing my eyes, I will use the same adjectives."*
  *   **Collection:** Collect the sheets. Shuffle them. Do not return them yet.

  #### 3. Round 2: The Framing (25–40)
  *   **The Manipulation:** Hand out a "Technical Brief" slip.
      *   **Left Group (White Sheets):** *"Context: This is a digital signal error. It represents data corruption."*
      *   **Right Group (Yellow Sheets):** *"Context: This is a macro-photograph of natural fabric. It represents woven cotton."*
  *   **Instruction:** *"Keep looking at the same image. Read the brief. Now, on a *new* Data Sheet, write three adjectives describing the **intrinsic visual quality** again. Try to ignore the text, but report what you see."*
  *   **The Trap:** Most will unconsciously shift their vocabulary (e.g., "harsh/digital" vs. "soft/woven") even though the pixels haven't changed.
  *   **Stake:** Stake 10 chips on: *"My description reflects the image properties, not the text I just read."*

  #### 4. Round 3: The Swap & Credence (40–55)
  *   **The Swap:** Collect the Round 2 sheets. Return the **Round 1** sheets to their owners.
  *   **Comparison:** Give them 5 minutes to compare their Round 1 (Neutral) and Round 2 (Framed) descriptions side-by-side.
  *   **The Audit:** Ask them to look at their chips.
      *   *"If your Round 2 adjectives changed significantly from Round 1, you must pay 10 chips to the pot."* (This penalizes instability).
      *   *"If your adjectives stayed the same, you collect 5 chips from the pot."*
  *   **Observation:** Most will have to pay. The "instrument" was unstable.
  *   **Final Task:** On the back of the sheet, answer one question: *"Did the **image** change, or did your **experience** of the image change? Be precise."*

  ---

  ### The Debrief (55–75)
  *Do not lecture. Use the whiteboard to map their answers to the following progression.*

  **Step 1: Establish the Data (55–60)**
  *   **Ask:** "How many people had to pay chips because their adjectives changed?" (Show of hands).
  *   **Ask:** "Did the pixels on the screen change?" (No).
  *   **Ask:** "Did the light hitting your retina change?" (No).
  *   **Board:** Write **Input = Constant**. **Report = Variable**.

  **Step 2: Target the 'Experience' (60–65)**
  *   **Ask:** "For those whose descriptions changed (e.g., from 'grainy' to 'woven'): Did the *experience* change, or just the *words*?"
  *   **Predictable Realist Move:** Someone will say, "The words changed because I was thinking about fabric, but the *visual feel* was the same."
  *   **Counter-Question:** "How do you know? You only have access to the experience *through* the report. If the report is contaminated by the text, what guarantees the 'feel' wasn't too?"
  *   **Board:** Write **Introspection ≠ Passive Mirror**. It is a **Process**.

  **Step 3: The Illusionist Pivot (65–70)**
  *   **Ask:** "If the 'softness' or 'harshness' wasn't in the pixels, where was it?"
  *   **Consensus:** It was in their heads/processing.
  *   **Ask:** "But it *felt* like it was in the image. You projected the property outward."
  *   **Board:** Write **Misrepresentation**. The system represented an internal processing state as an external intrinsic property.
  *   **Key Question:** "If introspection can misrepresent 'softness' in static noise, could it misrepresent 'intrinsic qualia' in brain states?"

  **Step 4: Handling the Realist (70–75)**
  *   **Address the Commitment:** "One of you might say: 'Fine, the softness was constructed, but there is still *something it is like* to see the grey noise. That residue is real.'"
  *   **Validate:** "Illusionism agrees. The *access* is real. The *reporting* is real. The *functional state* is real."
  *   **Challenge:** "Illusionism denies that the residue has the properties you think it does (ineffable, intrinsic, private). It says the 'residue' is just more processing. The 'feel' is the user interface, not the code."

  ---

  ### The Reveal & The Debt (75–90)
  *   **Name the View:** "This position is called **Illusionism** (Keith Frankish, Daniel Dennett)."
  *   **Define:** It does not deny consciousness (you definitely saw the screen). It denies that introspection reveals *intrinsic, non-representational qualities*. It claims the 'qualia' are a user-illusion generated by the brain to monitor its own states.
  *   **The Debt:** Draw a ledger on the board.
      *   **Asset:** Explains why introspective reports are unstable/context-sensitive (as we just saw).
      *   **Liability (The Debt):** "If qualia are illusions, **what generates the illusion?**"
      *   **Discussion:** "Cognitive science owes us an account of the mechanism. How does the brain create the 'feel' of redness without actual redness? That is the research program."
  *   **Closing:** "You don't have to accept it. But you can't say 'introspection is infallible' after today."

  ---

  ### Predicted Failures & Mitigations

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Collapse into Eliminativism** | Participants think "Illusion" = "Nothing exists." | **Script:** "If you were fooled by a magic trick, the *experience* of being fooled was real. The *card levitating* was not. Illusionism says the experience is real, the 'levitation' (intrinsic qualia) is not." |
  | **The "Attention" Defense** | Realist says: "The framing just changed my *attention*, not the *qualia*." | **Script:** "If the qualia change when attention changes, they aren't *intrinsic* to the stimulus. They are relational/functional. That concedes the main point: they aren't the non-representational atoms you thought they were." |
  | **Boredom/Disengagement** | The grey noise is too boring. | **Script:** Keep the pacing tight. Use the chips. The financial stake (even fake) keeps them alert to their own uncertainty. |
  | **The "Illusion is an Experience" Trap** | "The illusion itself has qualia!" | **Script:** "Yes! The illusion is a functional state. The error is thinking that state reveals a *further* property. The 'feel' is the error signal, not a window into a ghostly realm." |

  ---

  ### Frank Note: What This Activity Cannot Do
  You asked for a limitation. Here it is:
  **This activity cannot reproduce the *motivation* for realism.**
  The activity successfully attacks the *authority* of introspection. It shows introspection is constructive. But it cannot make the Realist *feel* the loss of the "intrinsic." The Realist's intuition is that even if the report is constructed, the *raw feel* of the construction is undeniable.
  **You must supply this.** In the final 15 minutes, you need to articulate the **Hard Problem** clearly. Acknowledge that Illusionism asks them to give up the idea that "what it is like" is a simple, unanalyzable fact. It asks them to accept that "what it is like" is a complex, analyzable cognitive model. The activity makes the *model* visible; you must explain why some philosophers think the *model* is all there is.

  ### Practical Notes
  *   **Allergy:** No food used. Chips are plastic/wood.
  *   **Wifi:** No reliance on internet. Image is saved locally on the laptop.
  *   **Printouts:** Prepare 14 "Technical Briefs" (7 Digital, 7 Fabric) and 28 Data Sheets.
  *   **Room:** Ensure the projector is bright enough that the grey noise is clearly visible to the back row.

  This design forces them to *use* their introspection to find its own flaws, rather than you telling them it's flawed. It leaves the Realist with a stable experience but an unstable metaphysics, which is exactly the Illusionist sweet spot.
