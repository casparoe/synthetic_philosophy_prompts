      **Refinement:** To hit the "Intrinsic" property harder, use a **Memory** component.
      Report now. Wait 5 mins. Report from memory.
      Show that the "phenomenal character" drifts.
      
      *Let's settle on the "Introspective Interference" + "Betting" model.*
      It makes the "Debt" clear: If the report is constructed, what is the construction mechanism? (Cognitive science owes us this).
      It handles the Realist: They can insist there's a 'residue', but the activity shows the 'residue' is inaccessible without the constructive filter.
      
      **Specific Plan:**
      1.  **Stimulus:** A complex, ambiguous visual pattern (e.g., a fractal or noise pattern) projected.
      2.  **Task 1 (Naive):** Write down 3 adjectives describing the *intrinsic look* of the image. (Private).
      3.  **Task 2 (Framing):** Tell them this image is from "Study A: Visual Stress" (Group 1) vs "Study B: Aesthetic Design" (Group 2).
      4.  **Task 3 (Re-evaluation):** Look again. Write 3 adjectives. Bet chips on whether a peer will match your description.
      5.  **Task 4 (The Reveal):** Reveal the framing was random. Compare Task 1 and Task 3.
      6.  **Discussion:** Did the *look* change? Or just the *description*? If you can't tell, what does that say about the "look"?

      *Wait, I need to make sure I don't lecture.*
      The debrief must lead *them* to the conclusion.
      I need specific questions to ask during debrief.
      I need to map the activity steps to Illusionist claims (Frankish).
      1.  Introspection is not passive (Task 2 framing changed output).
      2.  Qualia are not intrinsic (The 'look' depended on context).
      3.  The Debt (We need to explain *how* the framing changed the report).
      4.  What survives (Access consciousness, functional reporting).

      *Predicted Failure:* Realist says "The framing changed my *attention*, which changed my *experience*. The qualia are still real, just context-sensitive."
      *Counter-prep:* Acknowledge this. But ask: "If the qualia are so sensitive to cognitive framing, are they really 'intrinsic' non-representational properties? Or are they just representational contents?" This forces the distinction.
