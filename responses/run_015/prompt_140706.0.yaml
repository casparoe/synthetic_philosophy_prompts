answer: |-
  You are right to suspect there is no canonical name for this. In corruption studies, the lexicon is binary: either a transfer is a legitimate payment (wage, fee) or it is an illicit one (bribe, kickback, facilitation payment). In anthropology, the lexicon is circular: the gift creates an obligation to reciprocate (Mauss). Your cases sit in the blind spot between the bureaucrat's ledger and the anthropologist's cycle.

  Here is an analysis of what you are looking at, why the existing labels fail, a proposal for a term, and an assessment of the stability problem.

  ### 1. The Naming Problem

  You have correctly ruled out the obvious candidates. To be precise about why they fail:

  *   **The Bribe:** Defined by *quid pro quo*. Your cases are defined by *quid pro nihilo* (something for nothing, specifically nothing that alters the official outcome). If the outcome changes, the practice collapses into bribery.
  *   **The Tip:** Defined by retrospectivity and quality assessment. As you note, your bin men example is prospective (Christmas) and invariant to quality. A tip is a market correction; your cases are not market mechanisms.
  *   **The Maussian Gift:** Defined by the triple obligation (to give, to receive, to repay). Your cases explicitly forbid the third obligation. If the driver tries to repay you, the host is offended. This is a gift that demands *non-reciprocity*.
  *   **Clientelism:** Defined by ongoing asymmetry and loyalty. Your cases are terminal or periodic without establishing a hierarchy of patronage.

  **The Historical Precedent: The Christmas Box**
  Historically, in Britain, this had a name: the **Christmas Box**. Until the mid-20th century, it was a recognised right for service workers (postmen, bin men, tradesmen) to collect a box of money from households at Christmas. It was not a wage, nor a bribe, nor strictly a tip. It was a ritual acknowledgement of the year's service that maintained the social distance while acknowledging the human connection. It has largely vanished, absorbed into "tips" or banned by council policies.

  **The Theoretical Proposal: The Phatic Gift**
  Since there is no standard term in corruption studies (where this is usually lumped into 'Gifts and Hospitality' risk registers), I propose borrowing from linguistics. In linguistics, **phatic communication** (Malinowski, Jakobson) is speech that performs no informational work but establishes or maintains social contact (e.g., 'Alright?', 'Nice day').

  Your cases are **Phatic Transfers** (or **Phatic Gifts**).
  *   **Function:** They do not transmit economic value (the service is already paid for) or instruction (do not drive faster). They transmit *social presence*.
  *   **Mechanism:** They convert a structural interface (citizen-official) into a interpersonal one (person-person) without dissolving the structure.
  *   **Condition:** They must be 'terminal'. They close the loop of the year/transaction without opening a new one.

  **Boundary Cases: The Surgeon and the Official**
  You asked about the surgeon. A large gift to a surgeon after a successful operation is *not* a phatic gift; it is a **Thank-Offering**.
  *   **Why it differs:** A phatic gift is conventionalised and capped (the envelope, the bottle, the school collection limit). A thank-offering is proportional to the emotional relief of the giver.
  *   **The Risk:** Because it is proportional to emotion, it can easily exceed the threshold of 'acknowledgement' and become 'influence' for future care (either for the patient or their family).
  *   **The Official:** If an official refuses the bottle, are they rejecting the practice or the corruption? If the policy is zero-tolerance, they are rejecting the practice *because* it is indistinguishable from corruption to an auditor. They are not making a move *inside* the practice; they are enforcing the compliance regime *over* the practice.

  ### 2. The Stability Problem (Does it Slide?)

  This is the crux of your interdisciplinary project. Is the norm stable, or is it the thin end of the wedge?

  **The Argument for Instability (The Compliance View)**
  Compliance frameworks ban these practices not because they are inherently corrupt, but because they are **unauditable**.
  *   **The Mechanism of the Slide:** The norm relies on *shared understanding* (we both know this buys nothing). But shared understanding is internal. An external observer (auditor, anti-corruption NGO) sees only a transfer of value from a service recipient to a provider.
  *   **The Drift:** Once the practice is established, new entrants (a new driver, a new bin collector) may not inherit the norm. They may interpret the gift as a precedent for expected income, or as an invitation to offer 'better' service to secure it next year.
  *   **The Asymmetry:** The giver knows it is phatic. The recipient *might* know. The system *cannot* know. Therefore, to protect the system's integrity (universalism), the practice must be prohibited.

  **The Argument for Stability (The Sociological View)**
  However, in tight-knit communities or stable institutions, these norms *can* remain stable for decades (hence the longevity of the Christmas Box tradition).
  *   **The Mechanism of Stability:** It requires **common knowledge**. Everyone must know that everyone knows that the gift buys nothing. If this common knowledge holds, the gift acts as a 'bonding social capital' that actually *reduces* corruption by humanising the official. An official who feels recognised as a person may be *less* likely to solicit actual bribes than one treated as a faceless functionary.
  *   **The Alienation Cost:** By banning phatic gifts, compliance regimes enforce **alienation**. They insist the bin man is only a function, not a person. This creates the very coldness that the gift was meant to remedy.

  **Verdict on the Slide**
  The practice is stable only in **low-velocity, high-trust environments**.
  *   **Your Examples:** The school (closed community), the bin men (annual, ritualised), the driver (mediated by a host). These are stable.
  *   **The Surgeon:** High stakes, high emotion, low frequency. Unstable. The emotional weight makes it hard to keep the transfer 'phatic'. It tends to become a 'thank-offering' which carries the risk of future expectation.
  *   **The Export Problem:** When anti-corruption frameworks are exported (e.g., from the UK/US to the Global South), they often criminalise phatic transfers. This is not just a category error; it is a **cultural imposition of impersonalism**. It assumes that the only way to ensure universalism is to strip all particularism from the interaction. But in many cultures, the particularism *is* the guarantee of the service. Removing the phatic gift doesn't stop corruption; it just removes the social glue that kept the system functioning without overt bribery.

  ### Summary for your Volume

  If you need a term for the UK edition, I recommend **"The Phatic Gift"** with a footnote referencing the historical **"Christmas Box"**.

  *   **Definition:** A conventionalised transfer of value that acknowledges the personhood of a service provider without altering the terms of the service or creating an obligation of reciprocity.
  *   **Distinction:** Unlike a bribe, it is outcome-invariant. Unlike a tip, it is quality-invariant. Unlike a Maussian gift, it is terminal (no return required).
  *   **Stability:** It is stable only where the 'no-quid-pro-quo' norm is common knowledge. It is unstable in high-stakes or high-turnover environments.
  *   **Policy Implication:** Zero-tolerance anti-corruption frameworks inevitably categorise phatic gifts as bribery risks. This protects the system's auditability but degrades the system's social cohesion. The 'slide' is not inevitable morally, but it is inevitable *administratively*, because the distinction rests on intent, which cannot be audited.

  You are looking at the friction between **Weberian bureaucracy** (which demands impersonality) and **human sociality** (which demands recognition). The 'corruption' label is applied because the bureaucracy cannot process the recognition without suspecting the influence.
