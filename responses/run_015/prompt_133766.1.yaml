answer: |-
  This is a sharp argument. You have effectively reconstructed the tension that led John Martin Fischer and Mark Ravizza to develop **Actual Sequence Compatibilism** (specifically the distinction between *Regulative Control* and *Guidance Control*).

  You are right to feel that Step 4 is doing too much work. It is the point where the argument overgeneralizes from the specific metaphysics of the Frankfurt case to a universal claim about modality and responsibility.

  Here is the diagnosis, the specific step to reject, and the price of that rejection.

  ### The Diagnosis: Reject Step 4

  **Step 4:** *Idleness says merely counterfactual facts are responsibility-irrelevant. By 3, the absence of alternative possibilities is, in the Frankfurt case, nothing but a merely counterfactual fact. So: the absence of alternative possibilities is responsibility-irrelevant, period.*

  **Why it looked fine:** It relies on an equivocation on "the absence of alternative possibilities." In the Frankfurt case, the absence of APs is secured by a **counterfactual constraint** (Black's disposition). In the coercion/compulsion cases (bank teller, addict), the absence of APs is secured by an **actual constraint** (the gun, the neurochemistry, the hypnosis).

  Step 4 assumes that because the *outcome* (no APs) is the same, the *metaphysical weight* of that outcome is the same. But on the view that saves the Frankfurt intuition, responsibility tracks the **actual causal history**, not the modal profile.

  *   **Frankfurt Case:** The actual causal history is identical to a free world. The lack of APs is a "shadow" cast by counterfactual circumstances.
  *   **Coercion Case:** The actual causal history is *different* from a free world. The gun/threat/addiction is physically present in the actual sequence, altering the deliberation or the mechanism of action.

  **Why you can reject it:** You can maintain that "merely counterfactual facts are responsibility-irrelevant" (Idleness) without accepting that "the absence of alternative possibilities is responsibility-irrelevant, period."

  Why? Because in coercion cases, the absence of APs is **not** a merely counterfactual fact. It is grounded in *actual* facts (the gun, the tumor). In the Frankfurt case, the absence of APs *is* grounded in merely counterfactual facts (Black's disposition).

  So, the corrected principle is: **Responsibility is irrelevant to the absence of alternatives *when that absence is grounded solely in counterfactual facts*.** It does not follow that responsibility is irrelevant to the absence of alternatives when that absence is grounded in actual causal constraints.

  ### The Theory: Actual Sequence Compatibilism

  By rejecting Step 4, you land on a version of **Actual Sequence Compatibilism**.

  *   **PAP (Principle of Alternative Possibilities):** Claims responsibility requires *Regulative Control* (the ability to do otherwise).
  *   **Frankfurt Intuition:** Shows Regulative Control is not necessary.
  *   **Your Worry:** If APs don't matter, what does?
  *   **Solution:** *Guidance Control.* Responsibility requires that the action issue from the agent's own moderately reasons-responsive mechanism in the **actual sequence**.

  This allows you to keep **Step 1** (Jones is responsible) and deny **Step 5** (The bank teller is responsible).
  *   **Jones:** Actual sequence = Jones's own reasoning. (Responsible).
  *   **Bank Teller:** Actual sequence = Gun threat + fear. (Not responsible).

  The "excusing feature" in the bank teller case is *not* strictly that she "couldn't have done otherwise." It is that **her actual sequence was hijacked.** The "couldn't have done otherwise" is just a symptom of the hijacking. In Frankfurt, there is no hijacking, so the symptom (no APs) doesn't trigger the excuse.

  ### Pricing the Alternatives

  **Does rejecting Step 4 put PAP back on the table?**
  No. PAP states: *Necessarily, if an agent is morally responsible for what she has done, then she could have done otherwise.*
  Your modified view still accepts the Frankfurt conclusion: Jones is responsible *even though* he could not have done otherwise. So PAP is still false. You have simply refined *why* it is false. It's not that "constraints don't matter"; it's that "counterfactual constraints don't matter, but actual constraints do."

  **Does it survive the absurdity of Step 5?**
  Yes. The addict and the bank teller are excused not because they lack APs, but because their actual sequences are compromised (compulsion/coercion). The lack of APs in their case is a byproduct of actual causal interference, which *is* responsibility-relevant.

  ### Stress Test Predictions

  Here is how this diagnosis handles your variants.

  **1. Black-lite (Unreliable Intervener)**
  *   **Setup:** Black intervenes in only 70% of nearby worlds where Jones decides otherwise.
  *   **Diagnosis:** In the actual sequence, Jones votes on his own. Black does nothing.
  *   **Prediction:** Jones is **fully responsible**.
  *   **Why:** Responsibility supervenes on the actual sequence. The reliability of the counterfactual intervener is a modal fact, not an actual one. Whether Black would have succeeded 100% of the time or 70% of the time does not change the actual history of Jones's deliberation.
  *   **APs:** Technically, Jones might have "flickers" of freedom (in the 30% of worlds where Black fails). But on the Actual Sequence view, these flickers are irrelevant to responsibility. Jones is responsible because of *how he actually acted*, not because of how many nearby worlds contain alternatives.
  *   **Degrees:** Responsibility does not come in degrees based on Black's reliability. It is binary based on the actual sequence. (Unless the *risk* of intervention was known to Jones and affected his deliberation, which would make it an actual sequence factor).

  **2. White (Counterfactual Enabler)**
  *   **Setup:** Actual sequence has a block (Jones cannot vote). White *would have* removed the block if Jones tried.
  *   **Diagnosis:** Jones is **not responsible** (for voting, because he didn't vote; or for not voting, because he was blocked).
  *   **Prediction:** Jones lacks Guidance Control.
  *   **Why:** This highlights the asymmetry between counterfactual removers of freedom (Black) and counterfactual granters of freedom (White).
      *   **Black:** Removes APs via counterfactuals. Actual sequence is free. -> **Responsible.**
      *   **White:** Grants APs via counterfactuals. Actual sequence is blocked. -> **Not Responsible.**
  *   **Explanation:** Responsibility requires *actual* control over the outcome. White provides *counterfactual* control (Jones *could* have voted if he tried, because White would have helped), but Jones lacks *actual* control (in the actual world, the block exists). You cannot be responsible for an action you did not perform and could not perform in the actual sequence, even if a fairy godmother would have helped you in a nearby world.

  ### Summary of the Move

  You felt the argument proved too much because Step 4 treats "Could not have done otherwise" as a monolithic property that swallows all context.

  *   **The Fix:** Treat "Could not have done otherwise" as a surface phenomenon. Look at the **ground** of that impossibility.
  *   **Ground = Counterfactual Intervener:** Irrelevant to responsibility (Frankfurt).
  *   **Ground = Actual Constraint:** Relevant to responsibility (Coercion).

  This preserves the anti-PAP intuition (Jones is responsible without APs) without forcing you to absolve the bank teller (who lacks APs *due to actual constraints*). It shifts the locus of responsibility from the **modal horizon** (what else could I have done?) to the **actual history** (how did this action come about?).
