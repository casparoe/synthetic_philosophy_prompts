  8.  **Final Polish:** Check the distinction between *virtù* as "effectiveness" vs. "skill." If *virtù* is just effectiveness, the user's circularity worry holds. I need to be clear that *virtù* is the *quality of the action*, not the *result*. Machiavelli acknowledges men of *virtù* who fail (e.g., Sforza? No, he succeeded. Maybe someone like Cesare Borgia who had *virtù* but was struck by extreme *fortuna* (illness/death of father)). Borgia is the key example here. He did everything right (*virtù*) but fortune knocked him out. This proves *virtù* $\neq$ success.

      *   *Wait, one nuance on the "Woman" metaphor:* The guest says she gives herself to the impetuous. Machiavelli says she is a woman and one must beat/her to master her. The guest's "gives herself" is a softer reading of "bisogna batterla e urtarla" (it is necessary to beat and strike her). I should point out this sanitization.

      *   *Self-Help Moral:* Why is it anachronistic? Because Machiavelli's goal is external (political order), not internal (psychological tranquility). Stoicism is self-help; Machiavelli is not Stoic.

      *   *Effectiveness Moral:* This is the "Machiavellian" lesson. It holds up mostly, but "good/cruel deflated" is slightly off. He doesn't say they are meaningless, but that they are subordinate to *necessity*.

