      *   *Best Fix:* Modify (1) to acknowledge *ren* as a proto-normative source, OR modify (4) to say the "role" is simply "human being" (which stretches the Five Relationships). Given the prompt asks for the "cheapest revision," modifying (1) to be less exclusionary ("primarily" rather than "fundamentally... rather than") is cheaper than rewriting the metaphysics of *ren*.
