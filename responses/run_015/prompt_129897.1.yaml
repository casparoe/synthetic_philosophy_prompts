      *   (3) *Graded Affection:* Moral virtue requires prioritizing closer relations; equal care for strangers is a failure of proportion.
      *   (4) *Role-Transcendent Ren:* Everyone has a claim to humane treatment/flourishing, creating obligations to strangers *despite* lack of direct ties.
      *   (5) *Moral Extension (Tui):* Extend family patterns to broader society via analogy, without dissolving family specificity.
      *   (6) *No Meta-Principle (Yi/Li/Qing):* Conflicts resolved by practical wisdom/ritual/emotion, not algorithms or external principles.

  3.  **Initial Scan for Tensions:**
      *   (1) vs. (4): (1) says normativity is *fundamentally* role-constituted. (4) says *ren* creates obligations *transcending* roles (to strangers). This looks like the biggest clash. If obligations derive from roles, where do obligations to strangers (who share no specific role) come from?
      *   (3) vs. (4): (3) says treating strangers with same care as parents is a failure. (4) says strangers have claims to flourishing. Is there a conflict between "graded care" and "universal claim to humane treatment"? It depends on the *content* of the claim. If the claim is "equal care," they conflict. If the claim is "basic humane treatment," they might coexist.
      *   (1) vs. (5): (5) talks about extending family patterns. (1) says obligations derive from the specific positions. Does extension create *new* roles or just mimic old ones? This seems manageable.
      *   (2) vs. (6): (2) says claims are reciprocally weighted (equal importance). (6) says in hard cases, we use *yi* (wisdom) without an algorithm. If claims are equal weight, how does *yi* decide without a meta-principle? This is a potential tension regarding decision-making.
      *   (3) vs. (5): (3) emphasizes diminishing care with distance. (5) emphasizes projection/extension. Do they conflict? (5) says "without dissolving special density," which aligns with (3). This seems consistent.

