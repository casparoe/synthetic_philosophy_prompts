          *   *Cheapest Revision:* Clarify (2) to say "intrinsic moral worth" rather than "importance," allowing contextual prioritization.
          *   *Cost:* Nuances the definition of "weight."

      *   **Tension D: Role Constitution vs. Extension (1 vs. 5)**
          *   *Conflict:* (1) says obligations come from specific positions. (5) says we project family patterns onto broader relations. Does the broader relation become a "role"?
