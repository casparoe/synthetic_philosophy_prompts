      *   **Tension A: Role-Constancy vs. Universal Ren (1 vs. 4)**
          *   *Conflict:* (1) claims normativity is *fundamentally* role-constituted. (4) claims *ren* generates obligations *independent* of direct relational ties.
          *   *Severity:* High. This strikes at the metaphysical foundation. Is the source of morality roles or humanity?
          *   *Resolution:* Modify (1) to allow *ren* as a foundational source that *activates* through roles, or modify (4) to say obligations to strangers are mediated by the role of "human-to-human" (which stretches the Five Relationships).
          *   *Cheapest Revision:* Qualify (1). Instead of "derive from occupancy... rather than universal principles," say "are primarily mediated through... though grounded in a universal capacity for ren."
          *   *Cost:* Weakens the strict particularism of Role Ethics. Makes it slightly more principle-based.

      *   **Tension B: Graded Affection vs. Universal Claims (3 vs. 4)**
          *   *Conflict:* (3) says diminishing priority is virtuous. (4) says strangers have claims to flourishing. If I prioritize my father's comfort over a stranger's survival, does that violate (4)?
          *   *Severity:* Medium-High. This is the classic "Mohist vs. Confucian" debate.
          *   *Resolution:* Distinguish between *quantity/intensity* of care (3) and *threshold* of treatment (4). (4) guarantees a floor (humane treatment), (3) governs the ceiling (preferential love).
          *   *Cheapest Revision:* Clarify (4) to specify "minimal threshold of humane treatment" rather than open-ended "flourishing."
          *   *Cost:* Limits the scope of *ren*. It becomes a safety net rather than a demand for equal flourishing.

      *   **Tension C: Reciprocal Weight vs. No Meta-Principle (2 vs. 6)**
          *   *Conflict:* (2) says claims are not subordinate in importance. (6) says conflicts are resolved by *yi* without an algorithm. If claims are equal, and there's no algorithm, how is a decision justified? It risks arbitrariness.
          *   *Severity:* Medium. This is an epistemological/practical tension.
