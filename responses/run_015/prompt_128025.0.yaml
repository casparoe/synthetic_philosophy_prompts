answer: |-
  1. **The practice in brief**
  Certain jurisdictions permit "wrongful life" suits where plaintiffs claim birth itself constituted a harm due to severe suffering, yet no legal system recognizes "wrongful non-existence" claims for failed conception when life would have been happy. Simultaneously, welfare states actively subsidize reproduction through IVF funding and child allowances but offer no comparable compensation for citizens who voluntarily remain childless.

  2. **The implicit theory**
  This pattern presupposes a person-affecting restriction combined with an asymmetric valuation of existence and non-existence. It assumes harm requires an existing subject who is worse off than they would otherwise be, making it coherent to argue that suffering existence is worse than non-existence, but incoherent to argue that non-existence is worse than happy existence because there is no subject to suffer the loss. This mirrors Benatar's asymmetry legally: the presence of pain creates a compensable debt, while the absence of pleasure (non-existence) creates no actionable deficit. Policy reinforces this by treating new lives as positive externalities worthy of investment, while non-creation is viewed as a neutral baseline requiring no restitution.

  3. **Strict vs. optional commitments**
  Strictly required is the procedural rule that negligence damages require an identifiable, existing plaintiff, which logically blocks "wrongful non-existence" suits regardless of moral theory. Optional is the welfare preference for procreation; a state could theoretically subsidize childlessness as autonomy support or population control without contradicting the tort asymmetry. The moral asymmetry is thus baked into standing doctrine but only contingently aligned with subsidy structures.

  4. **Underdetermination check**
  The moral theory is underdetermined because procedural impossibility mimics moral asymmetry. A symmetric total utilitarian could endorse the current legal ban on "wrongful non-existence" purely due to the impossibility of identifying a plaintiff, even if they believe non-existence represents a loss of value. The law blocks the claim administratively, not necessarily axiologically.

  5. **Replacement scenario**
  Under a flat symmetric account, welfare policy would offer "non-procreation credits" equal to child subsidies, treating the choice to remain childless as socially equivalent to raising a child. Tort doctrine would likely abolish "wrongful life" suits to match the impossibility of "wrongful non-existence" claims, refusing to adjudicate damages based on the comparison between existence and non-existence in either direction.
