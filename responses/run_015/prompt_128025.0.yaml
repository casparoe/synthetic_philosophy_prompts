  Hey — I'm trying to map institutional practices onto philosophical commitments, and there's this cluster that's bugging me. Courts in a lot of jurisdictions recognize "wrongful life" suits — a plaintiff claims they were harmed by being born with serious suffering — but there's no mirror doctrine for "wrongful non-existence," i.e. you can't sue parents for failing to conceive you when conditions were ideal. At the same time, welfare states pour money into IVF, prenatal screening, and child subsidies, but there's no comparable payout for voluntarily remaining childless.

  What theory of value or harm does that pattern preseuppose? Is it basically Benatar's asymmetry baked into law and policy — harm requires an existing subject, but missed pleasure doesn't? Or can a person-affecting restriction explain the gap without committing to antinatalism? And is the practice even consistant with negligence rules that treat actual harm as central to damages?

  Reconstruct the implicit philosophical theory here. Say what's strictly required by the institutional pattern versus what just happens to align with it nicely. Point out where it's underdetermined — could a fully symmetric view about existence and welfare license the same legal and policy outcomes? Then sketch what'd have to change in tort doctrine and welfare design if we replaced the presupposed asymmetry with a flat symmetric account.

  Keep it tight, no citations needed.

