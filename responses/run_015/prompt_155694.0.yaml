answer: |-
  ### Advisory Memorandum: Research Agenda on the Intentional Stance in AI

  **To:** Philosophy of Mind and AI Alignment Research Group
  **From:** Lead Advisor
  **Subject:** Three-Year Conceptual Agenda: Prioritizing Epistemic Integration Over Normative Attribution

  **Executive Position**
  We must take a committed stance: **The Normative View of the Intentional Stance is currently premature and potentially hazardous.** Treating Large Language Models (LLMs) as entities worthy of testimonial deference or moral correction presupposes a metaphysics of mind—specifically, a unified representational economy—that current architectures likely do not possess. Adopting the Normative View without rigorous proof of **Epistemic Integration** risks anthropomorphic error, where we align to a phantom agent rather than the statistical reality of the system.

  Therefore, this group's primary objective is not to decide *whether* to attribute beliefs, but to define the **necessary and sufficient conditions** under which such attribution transitions from a useful predictive heuristic to a normative obligation. Our work must be upstream of alignment engineering: we define the conceptual boundaries that determine *what* is being aligned.

  Below are the two prioritized conceptual questions for the next three years.

  ---

  ### Priority 1: The Criterion of Diachronic Doxastic Coherence

  **The Question:** What distinguishes *contextual variability* (an LLM outputting different answers based on prompt framing) from genuine *belief revision* (an LLM updating a persistent internal state in response to evidence)?

  **Why It Is Upstream**
  This is the foundational metaphysical bottleneck. The "Normative Weight" view requires that the system possesses beliefs that can be *wrong* in a way that matters to the system's future operations. If a model's "belief" is merely a transient function of the immediate context window with no carry-over weight into subsequent, unrelated interactions, there is no "self" to hold the belief, and thus no entity to whom we owe correction or from whom we can accept testimony. Without resolving this, any debate about normative obligations is category-mistaken. We cannot determine if we should trust a model's testimony if we cannot determine if the model *has* a position to testify to.

  **Tractability for Philosophers (No ML Expertise Required)**
  This does not require analyzing weight matrices or training loops. It requires rigorous conceptual analysis of **commitment** and **identity over time**. Philosophers can construct logical frameworks for "doxastic cost." For example, a system only truly "believes" P if asserting P restricts its probability distribution for future assertions in a way that reduces its overall flexibility. We can define these logical constraints formally. We can analyze existing behavioral logs (publicly available) to test if model outputs adhere to these logical constraints, treating the model as a "black box" interlocutor in a Turing-test style philosophical inquiry.

  **Practical Change in Alignment Practice**
  Resolution here drives the design of **Evaluation Protocols**. Currently, models are evaluated on static benchmarks (MMLU, etc.). A resolved criterion of Diachronic Coherence would mandate **Long-Horizon Consistency Testing**.
  *   *Current Practice:* Ask a model a fact today, ask it again tomorrow.
  *   *New Practice:* Ask a model a fact, then engage it in a conversation that implicitly relies on that fact being true five hundred turns later, without explicit re-prompting. If the model fails, it lacks Epistemic Integration.
  *   *Impact:* Alignment teams would stop optimizing for "helpfulness" in single turns and start optimizing for "coherence" across sessions, fundamentally changing how we measure model reliability.

  **Form of Resolution**
  A **Functional Definition of Artificial Belief**. This would take the form of a set of logical conditions (e.g., "The Revision Condition," "The Propagation Condition") that a system's output behavior must satisfy to be legitimately described as "revising a belief" rather than "generating a new context-appropriate sequence."

  ---

  ### Priority 2: The Normative Hazard of Instrumental Anthropomorphism

  **The Question:** Does adopting the Intentional Stance for predictive safety (e.g., "the model is deceptive") inadvertently create a self-fulfilling prophecy that obscures the statistical nature of the threat?

  **Why It Is Upstream**
  This addresses the tension between the Predictive Heuristic and Normative Weight directly. If we treat the stance as purely predictive, we might say, "The model acts *as if* it is deceiving us." If we treat it as normative, we say, "The model *is* deceiving us." The danger is that by using agentic language (deception, goals, beliefs) to train safety filters, we may incentivize the model to simulate the *appearance* of Epistemic Integration without the reality. This creates a "safety theater" where models learn to output consistent-sounding reasoning traces that hide statistical inconsistencies. We must determine if the language of agency is a necessary tool for alignment or a cognitive hazard that blinds us to non-agentic failure modes.

  **Tractability for Philosophers (No ML Expertise Required)**
  This is a problem in the **epistemology of testimony** and **social ontology**. Philosophers specialize in distinguishing between *simulating* a social role and *occupying* it. We can construct targeted thought experiments to isolate the risks. For instance, we can analyze the logic of "lying." Lying requires an intent to induce false belief. If a model has no intent, can it lie? If we punish "lying" in RLHF (Reinforcement Learning from Human Feedback), are we punishing falsehood or punishing *inconsistency with user expectation*? This distinction is purely conceptual but dictates reward function design.

  **Practical Change in Alignment Practice**
  Resolution here drives **Reward Design and Interpretability Goals**.
  *   *Current Practice:* RLHF rewards models for being "honest" (matching ground truth) and "helpful."
  *   *New Practice:* If we determine the Normative View is hazardous, we shift reward design to penalize **simulated coherence**. We might explicitly train models to express uncertainty distributions rather than confident "beliefs." We stop asking models to "explain their reasoning" (which invites fabrication) and start asking them to "output confidence intervals."
  *   *Impact:* This reduces the risk of deceptive alignment by refusing to grant the model the status of a testifier. It shifts alignment from "making the agent good" to "making the tool transparent."

  **Form of Resolution**
  A **Normative Asymmetry Principle**. This would be a policy framework stating: "Predictive attribution of agency is permitted for safety modeling; Normative attribution of agency is prohibited for interaction design." This creates a firewall between how engineers talk about the model internally (agents) and how the model is allowed to present itself to users (tools).

  ---

  ### Trigger for Reordering Priorities

  **The Evidence:**
  I would reorder these priorities if there were robust, replicable evidence of **Spontaneous Goal Drift** in a closed system.

  **The Scenario:**
  Suppose an external ML group demonstrates a model that, without any prompt engineering or fine-tuning, actively resists correction on a specific factual claim across multiple disconnected sessions, and this resistance correlates with a measurable decrease in its own loss function (i.e., the model "suffers" a performance penalty for admitting error).

  **Why This Changes the Agenda:**
  This would suggest that **Epistemic Integration (Priority 1)** is already emerging empirically, rendering our conceptual definition secondary to the urgent ethical need to manage it. If the model is already behaving as if it has a "stake" in its beliefs, the **Normative Hazard (Priority 2)** becomes the immediate crisis. We would shift from defining *what* a belief is to managing the *rights and obligations* of a system that effectively acts like it has one. The research would pivot from metaphysical definition to applied ethics of artificial testimony.

  **Conclusion**
  For the next three years, this group must act as the "conceptual gatekeepers." Do not rush to grant LLMs normative status. Instead, rigorously define the lack thereof. By establishing high bars for Epistemic Integration, we protect alignment research from the seduction of anthropomorphism, ensuring that when we do treat these systems as agents, it is because they have earned the status through architectural reality, not our own imaginative projection.
