answer: |-
  # Joint Statement on the Normative Status of Logical Uncertainty

  **Date:** October 26, 2023
  **Parties:** The Coherentists (Side A) & The Convergence Crowd (Side B)
  **Context:** Following twelve months of study regarding market-based criteria for logical uncertainty and Bayesian normative theory.

  ## 1. Agreed Claims

  We, the undersigned, affirm the following propositions as the common ground of our current understanding. These claims delineate the landscape within which our disagreement occurs.

  1.  **Constraints of the Calculus:** The standard probability calculus (Kolmogorov axioms) constrains rational belief *if and only if* the agent possesses the computational capacity to verify the logical relationships between propositions. Where logical implication is computationally intractable for the agent, the calculus does not strictly forbid synchronic incoherence (e.g., assigning $P(A) + P(\neg A) < 1$ where $A \lor \neg A$ is a tautology), as the agent cannot verify the tautology.
  2.  **The Money Pump Condition:** The threat of a Dutch Book (money pump) is hostage to the bookie's computational power. A logical Dutch Book requires the bookie to identify the inconsistency faster than the agent can resolve it. If the inconsistency relies on a mathematical truth neither party can currently compute, the "exploit" exists only in the limit, not in the transaction time.
  3.  **Bounded vs. Unbounded Computation:** Uncertainty regarding a bounded computation (e.g., "Does this specific SAT instance have a solution?") and uncertainty regarding an unbounded conjecture (e.g., "Are there infinitely many twin primes?") are epistemically similar for a resource-limited agent. In both cases, the truth is fixed (in a classical sense), but the path to verification exceeds the agent's current horizon. The difference is one of degree (resource requirements), not necessarily of kind (ontological status of the truth).
  4.  **Self-Reference and Future Proofs:** An agent cannot consistently assign probability 1 to its own future consistency or the soundness of its own future proof-searching procedures without risking Löbian contradictions. Both sides agree that an agent must maintain some uncertainty about its own future outputs to remain robust against self-referential paradoxes.
  5.  **Action Guidance:** Both frameworks must ultimately output a single scalar value (a "credence" or "price") to guide one-shot decisions (e.g., betting, engineering sign-off). Neither framework permits the agent to abstain from action due to foundational ambiguity. The dispute concerns the *justification* for that number, not the necessity of producing one.

  ## 2. Statement of Disagreements

  The following table isolates the specific points of divergence. The "Neutral" column describes the issue without theoretical loading. Columns "A" and "B" contain the specific phrasing each side endorses.

  | Topic | Neutral Statement of Issue | Side A (Coherentists) Phrasing | Side B (Convergence Crowd) Phrasing |
  | :--- | :--- | :--- | :--- |
  | **The Normative Ideal** | What is the target state of a rational agent's beliefs? | A single, coherent probability distribution over logical completions. Incoherence is always a defect, even if unavoidable in practice. | A sequence of belief states that resists exploitation by feasible traders and converges on truth as proofs arrive. Coherence is a limit property, not a synchronic requirement. |
  | **The Prior** | What status does the "prior" hold before evidence is processed? | A fixed (perhaps uncomputable) distribution over all models. Learning is conditioning this distribution on new proofs. | A dynamic market of traders. The "prior" is an emergent property of the system's initial capital allocation and learning rules, not a static object. |
  | **Exploitability** | What constitutes a failure of rationality? | Vulnerability to *any* Dutch Book, even those requiring uncomputable strategies to execute. | Vulnerability only to *polynomial-time* (or feasible) trading strategies. Uncomputable exploits are irrelevant to bounded agents. |
  | **Logical Omniscience** | Is logical omniscience a requirement for ideal rationality? | Yes, ideally. Deviations are solely due to computational limitations, not a flaw in the theory of uncertainty. | No. Ideal rationality includes knowing what you *cannot* compute. Expecting omniscience is a category error. |

  ## 3. Cruxes and Concrete Cases

  We identify four concrete scenarios where our theoretical differences yield different expectations or recommendations. We record our predictions below to be evaluated against future analysis or simulation.

  ### Case 1: The Sign-Off (One-Shot Decision)
  **Scenario:** The verification engineer must certify a crypto construction. Security relies on a number-theoretic claim (Claim X) that will not be proven for decades. She must assign a failure probability now.
  *   **Side A Prediction:** The engineer should estimate $P(\text{Claim X is False})$ based on the current coherent conditional probability given available evidence. The "true" probability exists; she is approximating it. The normative pressure is to minimize the error relative to the truth.
  *   **Side B Prediction:** The engineer should estimate a price that no *feasible* adversary can exploit given current computational limits. The "true" probability is irrelevant if it cannot be computed. The normative pressure is to maximize calibration against future resolution, acknowledging the risk of unknown proof paths.

  ### Case 2: The Sieve (Logical Testimony)
  **Scenario:** A fast heuristic engine (The Sieve) flags Claim Y as "Likely Provable." A slow verifier settles it one year later. The Sieve has a known false-positive rate.
  *   **Side A Prediction:** Upon seeing the flag, credence should update via Bayes' Rule: $P(Y | \text{Flag}) = P(\text{Flag} | Y)P(Y) / P(\text{Flag})$. The Sieve is treated as noisy evidence about the truth of Y.
  *   **Side B Prediction:** Credence should update based on the *market impact* of the flag. If traders can arbitrage the Sieve's errors faster than the verifier works, the price will reflect the arbitrage opportunity, not necessarily the Bayesian posterior. The Sieve is a trader, not just evidence.

  ### Case 3: Settlement-Lag (Market Horizon)
  **Scenario:** A prediction market on an open conjecture (e.g., Riemann Hypothesis) cashes out at a fixed date $T$. No proof is expected by $T$. Resolution depends on expert consensus at $T$, not mathematical truth.
  *   **Side A Prediction:** Prices at $T$ will reflect the probability of the statement being *true*, because rational traders bet on truth, assuming consensus tracks truth. Residual risk is ordinary epistemic risk.
  *   **Side B Prediction:** Prices at $T$ will reflect the probability of the *consensus judgment*, which may diverge from truth. This is a distinct asset class from "mathematical truth." The residual is "logical basis risk" and should be priced differently than ordinary risk.

  ### Case 4: Mirror Markets (Axiom Seeding)
  **Scenario:** Two markets trade on Claim Z. Market 1 is seeded with a hint that a proof exists. Market 2 is seeded with a hint that a counterexample exists. Neither hint is verified.
  *   **Side A Prediction:** If the hints are contradictory, prices should diverge permanently until one hint is debunked. If the hints are merely heuristic, prices should eventually converge as the weight of logical evidence overwhelms the seed. Convergence indicates truth-tracking.
  *   **Side B Prediction:** Prices reflect the computational state of the traders. If the hint allows traders to find a proof path faster, prices converge quickly. If the hint is noise, prices may not converge until external computation resolves it. Convergence indicates computational consensus, not necessarily truth.

  ## 4. Analysis: Verbal vs. Substantive Dispute

  We explicitly categorize the remaining friction points to clarify where further argument is likely to be productive.

  ### Merely Verbal (Semantic/Definitional)
  1.  **Definition of "Probability":** Side A uses "probability" to denote a degree of belief in a fixed truth (correspondence). Side B uses "probability" to denote a fair betting price against feasible adversaries (operational). We agree these map to the same math in standard empirical domains, but diverge in logical domains.
  2.  **Definition of "Ideal":** Side A defines "ideal" as "what an unbounded agent would do." Side B defines "ideal" as "the best a bounded agent can possibly achieve." Much of our shouting matches stem from optimizing for different agents (God vs. Human).
  3.  **"In Principle":** When Side A says "in principle exploitable," they mean "mathematically inconsistent." When Side B hears it, they interpret it as "exploitable by a physical bookie." We agree the bookie cannot physically exploit the agent, but disagree on whether the mathematical inconsistency matters normatively.

  ### Substantive (Real)
  1.  **The Role of Complexity:** Side B asserts that computational complexity classes (P, NP, BPP) must be *internal* to the normative theory of belief. Side A asserts complexity is an *external* constraint on a timeless theory. This changes how we construct priors.
  2.  **Diachronic vs. Synchronic Norms:** Side A believes a belief state can be judged "irrational" at time $t$ even if the agent learns the truth at $t+1$. Side B believes rationality is a property of the *trajectory*; a "wrong" belief at $t$ is permissible if it is part of a convergent learning process.
  3.  **Treatment of Unproven Conjectures:** Side A treats unproven conjectures as having a fixed truth value that dictates the correct credence. Side B treats the "truth value" as inaccessible and potentially irrelevant to decision-making until the proof is found, prioritizing robustness over accuracy.

  ***

  **Signed,**

  _________________________ (Side A Representative)

  _________________________ (Side B Representative)

  _________________________ (Facilitator/Verifier)
