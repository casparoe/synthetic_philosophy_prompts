answer: |-
  This is a sharp engineering problem disguised as epistemology. You aren't looking for Truth; you're looking for *leverage points* in an argument. The formalism needs to be a stress-testing rig, not a belief state.

  Here are the desiderata for a Presumption of Independence (PoI) suitable for auditing heuristic arguments, derived from your cases.

  ### The Desiderata

  **1. Reparameterization Invariance (The "Carving" Constraint)**
  *   **Requirement:** The default independence assumption must not generate different joint distributions merely because the user swapped variable $X$ for $f(X)$ (e.g., $X$ vs $\log X$) without explicit justification.
  *   **Case Basis:** Carving relativity / Bertrand paradox.
  *   **Rationale:** If the audit result swings based on whether the physicist parameterized the constant as mass or inverse-mass, the tool is measuring syntax, not substance.
  *   **Status:** **[Confidence: High]** Non-negotiable. Without this, the "default" is arbitrary noise.

  **2. Sensitivity Parameterization (The "Compounding" Constraint)**
  *   **Requirement:** The PoI cannot be a binary switch (Independent/Dependent). It must be a continuous parameter $\epsilon$ representing maximum allowable covariance or deviation from independence, allowing the auditor to plot conclusion-stability against $\epsilon$.
  *   **Case Basis:** The compounding worry.
  *   **Rationale:** With $n=20$, a correlation of $0.05$ might matter more than the mean values. The tool must output "Conclusion holds for $\rho < 0.02$" rather than "Conclusion holds."
  *   **Status:** **[Confidence: High]** Non-negotiable for auditing.

  **3. Causal Defeasibility (The "Substantive Claim" Constraint)**
  *   **Requirement:** The formalism must structurally distinguish between *default* independence and *mechanism-induced* independence. It must allow a user to "plug in" a common cause node that overrides the default without breaking the math.
  *   **Case Basis:** Independence as a defeatable substantive claim.
  *   **Rationale:** If a theory emerges linking two constants, the PoI must recede gracefully. The default is a prior over structures, not a lock on the graph.
  *   **Status:** **[Confidence: High]** Non-negotiable.

  **4. Conditioning Separation (The "Selection" Constraint)**
  *   **Requirement:** The PoI applies to the *generative* distribution $P(World)$, not the *observational* distribution $P(World | Observer)$. The formalism must force the user to explicitly declare the selection function before applying the independence multiplier.
  *   **Case Basis:** Selection effects / Anthropics.
  *   **Rationale:** Naive independence fails because $P(Constants | Us)$ is not $P(Constants)$. The tool must prevent the user from multiplying probabilities in the posterior space while claiming they are priors.
  *   **Status:** **[Confidence: Medium-High]** Crucial, but hard to enforce syntactically.

  **5. Hierarchical Awareness (The "Exchangeability" Constraint)**
  *   **Requirement:** The default for repeated trials must be Exchangeability, not Independence. Independence is only permitted if the hyper-parameters are fixed or integrated out with explicit priors.
  *   **Case Basis:** Exchangeability vs. Independence.
  *   **Rationale:** Assuming i.i.d. on unknown mechanisms underestimates variance. The "default" should be de Finetti-style representation, forcing the user to justify the collapse to independence.
  *   **Status:** **[Confidence: Medium]** Important for statistical arguments, less so for unique cosmological constants, but necessary for generality.

  **6. Improperness Handling (The "Unbounded" Constraint)**
  *   **Requirement:** On continuous/unbounded spaces, the PoI must specify a regularization or truncation method. It cannot rely on MaxEnt defaults that yield improper priors (infinite mass).
  *   **Case Basis:** Continuous and unbounded spaces.
  *   **Rationale:** You cannot audit a ratio of probabilities if the denominator is undefined. The tool needs a "box size" parameter for the state space.
  *   **Status:** **[Confidence: High]** Mathematical necessity.

  ---

  ### Where the List Eats Itself

  You asked for the incompatibilities. There is a fundamental triad tension here, often found in objective Bayesianism, but sharpened for your auditing context:

  **The Invariance-Properness-Computability Trilemma.**
  1.  **Reparameterization Invariance** (Desideratum 1) usually demands geometric priors (like Jeffreys) or reference priors.
  2.  **Improperness Handling** (Desideratum 6) demands proper priors (finite integrals) so the auditor can calculate actual numbers.
  3.  **Computability** (Implicit in building a tool) demands the priors be simple enough to integrate/multiply.

  *The Conflict:* On unbounded continuous spaces, **Invariance + Properness** are often mutually exclusive. A prior invariant under scale transformations (like $1/x$) is improper. To make it proper (truncate it), you break Invariance (the result now depends on where you truncate).
  *Audit Implication:* Your tool cannot satisfy Desideratum 1 perfectly. It must force the user to *choose* the parameterization scale and flag this as a major source of uncertainty. You have to sacrifice strict Invariance to get a calculable Sensitivity Parameter.

  **Secondary Conflict: Conditioning Separation vs. Invariance.**
  Selection effects (Desideratum 4) inherently break symmetry. If the observer is made of carbon, the "invariant" measure over constants is no longer neutral; it is weighted by the existence of carbon. A formalism that enforces strict Invariance may inadvertently wash out the selection effect you are trying to audit.

  ---

  ### Verdict on "Common-Cause Humility" (CCH)

  **Verdict:** **Genuine Requirement, but mis-categorized.**

  It is not a constraint on the *default prior* itself; it is a constraint on the *acceptance criteria* of the argument.
  *   **Why it's not a prior:** A prior represents a state of information. Saying "I assign a spread of correlations" is just assigning a specific hierarchical prior (a mixture of independent and dependent models).
  *   **Why it's a requirement:** For *auditing*, a point estimate is useless. CCH is effectively **Sensitivity Parameterization** (Desideratum 2) applied specifically to the correlation matrix.
  *   **Correction:** Don't build it as "assign a small fixed spread." Build it as: *The argument is only valid if the conclusion holds for all correlation matrices $R$ where $|R_{ij}| < \epsilon$.*
  *   **Confidence:** **[Confidence: High]**. You have correctly identified that fragility is the enemy, but framing it as a "default assignment" risks hiding the $\epsilon$ parameter. Make $\epsilon$ explicit.

  ---

  ### Scorecard of Approaches

  | Approach | Score | Why |
  | :--- | :--- | :--- |
  | **Max-Entropy** | **Fail** | Violates **Reparameterization Invariance**. MaxEnt depends on the measure; change variables, change the "max entropy" distribution. Bad for auditing variable choices. |
  | **Symmetry / Invariance** | **Partial** | Satisfies **Invariance**, but fails **Improperness Handling** (often yields infinite mass) and struggles with **Selection Effects** (which break symmetry). |
  | **Complexity (Solomonoff)** | **Fail** | Uncomputable. Cannot generate the specific probability swings needed for the **Sensitivity Parameter**. Good for theory, useless for your tool. |
  | **Causal Graphs (DAGs)** | **Pass** | Best fit. Naturally handles **Causal Defeasibility** and **Selection Separation**. Requires user to input the graph, but that's a feature for an auditor. |

  **The Knockout Requirement:**
  **Reparameterization Invariance.**
  This kills MaxEnt and most naive frequentist defaults immediately. If your tool allows an argument to pass when variables are $X$ but fail when variables are $\log X$, it is measuring the physicist's notation, not the physics. Any formalism that cannot define independence without reference to a specific coordinate system is inadmissible for this purpose.

  ---

  ### Least Certain Point

  **[Confidence: Low]** I am least sure about the necessity of distinguishing **Deterministic-but-Unknown (Pi)** vs. **Genuinely Chancy (Coins)** in the formalism (touched on in Desideratum 5).

  *Reasoning:* For *auditing heuristic arguments*, the distinction might be irrelevant. If the arguer treats Pi digits as random, the error is in their premise, not the independence calculus. However, if there are *logical constraints* (e.g., $A + B = C$) that mimic correlations, a formalism that treats them as epistemic probabilities might miss the logical impossibility of the independence assumption. I am unsure if your tool needs a "Logical Constraint Checker" module or if that falls outside the scope of probabilistic auditing. If logical constraints exist, "independence" is false by definition, not by default. Distinguishing *logical* dependence from *causal* dependence is hard to formalize without a theorem prover.

  **Summary for your build:**
  1.  Adopt **Causal Graphs** as the skeleton.
  2.  Implement **Sensitivity Parameterization** ($\epsilon$-correlation) as the core metric.
  3.  Sacrifice strict **Invariance** for **Properness**, but flag the parameterization choice as a high-risk input.
  4.  Treat **Common-Cause Humility** as a robustness test, not a prior.
