      *   *Ansel's Position:* Individual restraint doesn't solve the structural problem. If I restrain myself, someone else might not. If the instrument is shared, restraining based on "maybe I'm an outlier" doesn't help if the instrument is systematically biased. We need to change the game (pool evidence, require consensus).
      *   *The Shared Instrument Wrinkle:* If errors are correlated, the "I'm an outlier" argument weakens (we all see the same data). However, the "nine independent checks" defense also dies. Vera needs to argue that even with shared data, individual interpretation varies, or that the *decision* to act is the variable. Ansel needs to argue that shared error makes individual discounting useless because we all shift together.
