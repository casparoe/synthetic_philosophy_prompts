      *   *Standard View:* Mental states = Functional roles (inputs + internal state -> outputs + new internal state), not physical stuff.
      *   *ML Translation:* Mental states = Latent variables / Activations / Computational Graph structure. Physical stuff = Weights / Hardware.
      *   *MR:* Same function (loss landscape minimum / behavioral manifold) can be reached by different weight configurations (mode connectivity issues, permutation symmetry).
      *   *Autonomy:* Psychology (high-level behavior/latent structure) cannot be reduced to Neuroscience (specific weight values) because the mapping is many-to-one.

  3.  **Drafting the Translation (Section 1):**
      *   *Functionalism:* It's not about hardware (GPU vs. Brain). It's about the *computational graph* and the *causal role* of nodes. A "belief" is a specific activation pattern or subspace that plays a causal role in producing outputs given inputs.
      *   *Multiple Realizability:* This is about *weight space vs. function space*. Many distinct points in weight space map to the same point (or neighborhood) in function space.
      *   *Psychological Kinds:* These are "features" or "concepts" defined by their causal influence (interventions), not by specific neuron indices.
      *   *Autonomy:* You can't reverse-engineer the "psychology" just by looking at weights without understanding the function. High-level abstractions (causal models) are necessary.

  4.  **Addressing Case 1: Twin Checkpoints:**
      *   *Scenario:* Two nets, same I/O, different weights, no simple mapping (permutation symmetry is too easy, let's assume distinct minima).
      *   *ML View:* This is *Mode Connectivity* or just distinct global minima.
      *   *Functionalist View:* Yes, this is MR. The "mental state" is the functional role. If Net A uses neuron 1-10 for "cat" and Net B uses 50-60, but the causal role in the graph is identical, the mental state is the same.
      *   *Counterfactuals:* This is crucial. Functionalism cares about the *disposition* (the function), not just the empirical test set. If they diverge on OOD (out-of-distribution) inputs, they are different functions.
      *   *Do-Calculus:* If $P(Y|do(X))$ differs, the causal models differ. Functionalism demands equivalence of the *conditional probabilities under intervention*, not just observational equivalence on the test set.

  5.  **Addressing Case 2: The Big-Table (Lookup Table):**
      *   *Scenario:* Perfect I/O match, but implemented as a lookup table (or giant decision tree) with no compressed latent state.
      *   *Functionalist View:* If it passes the Turing Test (or equivalent), it has beliefs. It's about the role, not the compression.
      *   *ML Intuition (The "Gut"):* We care about *generalization* and *sample efficiency*. A lookup table has high Kolmogorov complexity. It doesn't learn *structure*.
      *   *Translation:* The "gut" is worrying about *inductive bias* and *compression*. A lookup table has no latent manifold. It doesn't support *transfer learning*.
