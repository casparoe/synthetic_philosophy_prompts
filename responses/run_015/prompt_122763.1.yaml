      *   Is MR just abstraction? Yes, basically. It's the claim that the *algorithm* matters more than the *implementation*.
      *   Does it do anti-reductionist work? It prevents *type-identity* reduction (Neuron X = Pain), but allows *functional* reduction.
      *   The "Gut" on the Lookup Table is actually a valid ML concern (generalization/complexity), suggesting the functionalist definition might be too loose for ML engineers who care about *how* the function is computed, not just *that* it is computed.

