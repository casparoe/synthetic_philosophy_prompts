answer: |-
  This is one of the most common and intuitive stumbling blocks when first encountering the Bikhchandani-Hirshleifer-Welch (BHW) model. Your intuition is perfectly sound for a world where agents observe **signals**, but the entire pathology of the model hinges on the fact that agents only observe **actions**.

  Here is the breakdown of why Agent 20 is not better informed than Agent 4, why the "Wisdom of Crowds" fails here, and why fragility is a fundamental feature, not a bug.

  ### 1. The Core Mechanism: Actions Censor Signals
  Your intuition holds that Agent 20 stands on the accumulated judgment of 19 predecessors. This would be true if Agent 20 could observe the **private signals** ($S_1, S_2, ..., S_{19}$). If they could, you are absolutely right: by the Law of Large Numbers, the group would converge to the truth almost surely.

  However, agents only observe **actions** ($A_1, A_2, ..., A_{19}$).
  *   **Pre-Cascade:** In the early stages, actions reveal signals. If Agent 1 adopts, we know $S_1=1$. If Agent 2 adopts, we know $S_2=1$. Information is flowing.
  *   **The Cascade Point:** Suppose a cascade starts at Agent 3. This happens because the public information from Agents 1 and 2 is strong enough that, regardless of Agent 3's private signal, their Bayesian optimal choice is to Adopt.
  *   **The Information Stoppage:** Because Agent 3 chooses "Adopt" *even if* their private signal was "Reject," their action no longer reveals their signal. To Agent 4, observing Agent 3's choice provides **zero new information** about the state of the world. Agent 4 knows Agent 3 just followed the crowd.

  **The Consequence for Agent 20:**
  If a cascade started at Agent 3, then Agents 4 through 19 are all ignoring their private signals. Their actions are determined entirely by the history of Agents 1 and 2.
  Therefore, Agent 20 is **not** aggregating 19 signals. Agent 20 is effectively making a decision based on the signals of Agents 1 and 2, plus their own signal (which they will also ignore if the cascade is strong enough).

  The private information of Agents 3 through 19 is **lost to the system**. It is not pooled; it is censored. Agent 20 is not standing on a mountain of data; they are standing on a tiny pedestal of early data that is echoing loudly.

  ### 2. Wisdom of Crowds vs. Informational Cascades
  Your group mate is right, but here is the precise distinction:
  *   **Wisdom of Crowds:** Requires independent signals to be **aggregated**. (e.g., a voting booth where you mark your private ballot).
  *   **Informational Cascade:** Involves sequential decisions where later agents **substitute** public history for private information.

  In BHW, the "Crowd" looks like it agrees (100 people adopt), but they are not 100 independent samples. They are effectively 3 independent samples (the pre-cascade agents) plus 97 people copying them. The statistical weight of the decision is not $N=100$; it is $N=3$.

  This is why the final decision can be worse than averaging everyone's signals. If the first three agents got unlucky and drew misleading signals, the remaining 97 agents will rationally ignore their own correct signals and follow the error. The group converges on the **wrong** answer with high probability.

  ### 3. Why Fragility is Fundamental
  You asked if fragility is just a parameterization issue. It is not; it is a direct mathematical consequence of the information stoppage.

  Because the cascade is supported only by the few signals that occurred *before* the cascade started, the "weight" of the cascade is an illusion.
  *   **Scenario:** A cascade of 1,000 agents is based on the net signal difference of the first 4 agents.
  *   **Shock:** If a public signal arrives (e.g., a news report) that is slightly more informative than the sum of those first 4 agents' signals, the cascade collapses immediately.
  *   **Contrarian:** If Agent 1,001 is known to have a superior signal (or different payoffs) and they break the cascade, Agent 1,002 realizes the previous 1,000 actions were uninformative. Agent 1,002 then reverts to relying on their own signal and the initial few founders.

  The cascade is fragile because it is built on a foundation of **fixed, finite information**, regardless of how many people join the herd. The herd size does not increase the structural stability of the belief.

  ### 4. The Bayesian Defense (You are right about Rationality)
  You are correct that everyone is being perfectly Bayesian. This is the most frustrating part of the model.
  *   **Individual Rationality:** Agent 20 is maximizing their *own* expected payoff. They have no incentive to "experiment" or reveal their signal to help Agent 21.
  *   **Informational Externality:** By following the herd, Agent 20 imposes a negative externality on Agent 21. Agent 20 deprives Agent 21 of the information contained in Agent 20's private signal.

  The inefficiency arises because there is no market for information. Agents cannot sell the value of their private signal to the group; they can only use it for their own decision. Once the public history outweighs the private value of that signal, they discard it.

  ### Summary for your Seminar
  To answer your specific questions:
  1.  **Is Agent 20 better informed?** No. If a cascade exists, Agent 20 has the same effective information as the agent who *started* the cascade. The intermediate signals are censored.
  2.  **Why not average the signals?** Because the signals are not observed, and the actions stop revealing them once the cascade begins.
  3.  **Is fragility a parameterization?** No. It is structural. The "mass" of the cascade is fake weight. It takes very little new information to overturn a cascade because the cascade rests on a small, finite number of initial signals.

  The BHW model isn't about people being irrational; it's about how **rational individuals observing actions rather than signals create a public good (information) problem that leads to collective stupidity.**
