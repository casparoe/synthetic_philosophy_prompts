      *   **Tone:** Philosophical, precise, collaborative, adversarial but respectful (in the spirit of Adversarial Collaboration).

  2.  **Deconstruct the Positions:**
      *   **Illusionist (e.g., Dennett, Frankish, Keith):** Phenomenal consciousness (P-consciousness) as traditionally defined (intrinsic, non-representational qualia) does not exist. What exists is Access Consciousness (A-consciousness) + a self-model that *judges* it has P-consciousness. The "hard problem" is a cognitive error.
      *   **Realist (e.g., Chalmers, Strawson, Searle):** P-consciousness exists. There is an explanatory gap between physical/functional states and subjective experience. Functional duplicates could lack experience (zombies).

  3.  **Drafting Agreed Claims:**
      *   Need common ground on the *science* even if the *metaphysics* differs.
      *   *Architecture:* Both agree on global workspace, predictive processing, or at least that the brain processes information and generates reports.
