      *   *Explanatory Gap:* Both agree the argument exists and feels compelling, but disagree on whether it points to ontology or cognitive limitation.
      *   *Drafting:* Make these neutral. "The brain constructs a self-model." "Reports of experience are data." "The gap is intuitive."

  4.  **Drafting the Disagreement:**
