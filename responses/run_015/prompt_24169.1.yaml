          2.  Disagreement Table (exact formulation of disagreement, phrased so each accepts their own view).
          3.  Cruxes (sub-questions where settling moves a side).
          4.  For each Crux: Concrete case/argument (blindsight, CBS, functional duplicate), predictions from both sides.
          5.  Falsification Conditions (what counts as evidence against their own view).
          6.  Verbal Dispute Analysis (are they talking past each other regarding 'phenomenal consciousness'?).
