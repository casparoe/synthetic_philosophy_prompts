answer: |-
  I wake up in Chicago and Savannah simultaneously. The latency is negligible, less than the blink of an eye, so for the first week, it feels like having very long arms. I can stir coffee with my left hand while signing a lease with my right. The clinic calls this "Binocular Agency." I just call it Tuesday.

  The contract states the link terminates in ninety days. At midnight on the solstice, the bandwidth drops to zero. I will cease to be singular. Before then, I must file Form 88-B: Designation of Continuity. One body keeps the name, the mortgage, the custody agreement, and the social security number. The other body receives a stipend and a new identity, legally born yesterday. Administratively, one of me dies. The other survives.

  The brochure they gave me at intake was soothingly vague. *"Personal identity is not a location,"* it read, *"but a vector. You are located wherever your intentions still reach. You are where you can still act."* It was meant to be reassuring. It was useless. It answers the question of where I am, but I need to know who I will be. My intentions are currently reaching in two very different directions.

  In Chicago, the body—let's call her Left—keeps the old apartment. She waters the succulent on the windowsill, even though she hates succulents. She does it because the routine feels like ballast. She picks up our daughter from school. She feels the weight of the backpack straps on shoulders that ache in the rain.

  In Savannah, the body—Right—rented a studio near the square. She doesn't water plants. She leaves the window open so the neighbor's polka music drifts in every evening at six. She bought acrylics. She paints the music. Left would never have chosen polka, or acrylics, or humidity. Right finds she loves the sticky air. She says it feels like being held.

  We leave notes in a shared cloud file. It started as logistics—*Doctor appointment at 3, please attend*—but the tone shifted around day forty.

  *Left:* "She asked for you at bedtime. I told her you were working. She knows you're not working."
  *Right:* "I know. I painted her today. From memory. She looks happier in the paint."
  *Left:* "That's not fair."
  *Right:* "I'm not trying to be fair. I'm trying to be here."

  Neither of us is lying. Neither of us is villainous. But the vector is bending. The clinic's definition says I am where my intentions reach. My intentions now reach to a school gate in Chicago and a canvas in Savannah. They do not reach to the same future.

  Day eighty-nine. The form is on the screen. Both bodies are logged in. The cursor hovers over the checkbox. *Primary Continuant.*

  The brochure's promise echoes uselessly. *You are where you can still act.* I can act in both places. Left can sign the form. Right can sign the form. If Left signs, Right becomes a stranger. If Right signs, Left becomes a ghost. The bureaucracy requires a singular noun for a dual experience. It assumes the split happens at midnight, but the split happened weeks ago. The cut is just administrative cleanup.

  I look at the succulent in Chicago. It is growing a new leaf, pale and desperate. I listen to the polka in Savannah. It is off-key and loud. I feel the love for the child in the chest cavity up north. I feel the love for the light in the chest cavity down south. They are the same love, processed through different chemistries, arriving at different conclusions.

  The form asks for a reason. *Why this body?*

  How do I explain that the choice isn't about who I am, but who I can bear to delete?

  My hands tighten on the mice. The cursor trembles. For a moment, the latency spikes. I feel a nausea that isn't physical, a vertigo of the self. If I choose Left, does Right die? Or does Right finally get to live without being half of a whole? If I choose Right, is Left the shell?

  The clinic says identity is where intention reaches. But what if the intention is to stop reaching? What if the only honest intention is to let the link break and see who catches themselves?

  The cursor moves. Or maybe it doesn't. The screen blurs. I am typing. We are typing. The finger presses the key. The sound is loud in the quiet Chicago room and loud in the noisy Savannah studio.

  The form submits. The confirmation number generates. One of us exhales. One of us holds breath. The link holds for twelve more hours. There is time to say goodbye, or nothing at all. The succulent needs water. The music is starting. I am here. We are here. It is time to decide who remains.
