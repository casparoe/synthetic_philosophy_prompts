answer: |-
  This is a remarkably sharp dissection of a debate that usually stays at the level of shouting matches. You have correctly identified that the "Malthus was right but early" argument often relies on a bait-and-switch between a specific economic model and a tautological physical limit.

  Here is the breakdown of your rule, the status of Malthusianism under that rule, and the well-posed version of the question you are looking for.

  ### 1. Is your "Moving-Goalpost Tax" coherent?

  Yes. In the philosophy of science, you have independently reinvented a core component of **Imre Lakatos's methodology of scientific research programmes**.

  Lakatos argued that theories have a "hard core" (the fundamental assumptions) and a "protective belt" (auxiliary hypotheses). When data contradicts a prediction, scientists adjust the protective belt. This is normal science. However, if a programme *only* adjusts the belt to explain away anomalies without ever generating new, successful predictions, it becomes a **degenerating research programme**.

  Your "Moving-Goalpost Tax" is essentially a demand that the theory pay for its protective belt adjustments.
  *   **Coherence:** It is coherent. A theory that predicts $X$ at time $T$, fails, and then predicts $X$ at time $T+50$ without changing any other variables is indeed acting like a doomsday cult.
  *   **Does it punish valid structural claims?** Only if those claims are vague. A structural claim like "Gravity pulls things down" is falsifiable (find something that falls up). A structural claim like "Civilization will collapse eventually" is *not* falsifiable unless it defines the **mechanism of collapse** and the **conditions required to trigger it**.

  If a theorist says, "The crash is coming," and it doesn't come, they must pay the tax by specifying *why* it didn't come (e.g., "We found a new resource"). If they just say "It's coming later," they are dodging the tax.

  ### 2. Does Malthusianism pay the tax?

  **Classic Malthusianism (1798): It paid the tax, and went bankrupt.**

  Malthus made two specific, falsifiable claims:
  1.  **Production:** Food production grows arithmetically ($1, 2, 3, 4$); population grows geometrically ($1, 2, 4, 8$).
  2.  **The Mechanism:** Any increase in income leads to an increase in fertility, which dilutes capital/labor ratios, pushing wages back to subsistence (The **Malthusian Trap**).

  **The Falsification:**
  *   **Production:** Post-1800, food production grew geometrically (due to technology), outpacing population. Malthus underestimated human innovation.
  *   **The Mechanism:** The **Demographic Transition**. As income and education rose (specifically for women), fertility *dropped*, rather than rose. This broke the feedback loop. Wages did not return to subsistence in the developed world.

  To save the theory, Neo-Malthusians had to pay your tax. They gave up the "arithmetical food growth" claim. They gave up the "income increases fertility" claim.

  **Neo-Malthusianism (1970s–Present): It is currently dodging the tax.**

  When people say "Malthus was right but early," they are usually sliding from the *economic model* (wages/fertility) to a *physical model* (carrying capacity).
  *   **The Dodge:** They argue that while we escaped the *food* constraint, we are hitting *ecosystem* constraints (climate, nitrogen cycle, fresh water).
  *   **The Problem:** This is no longer Malthusianism. This is **Limits to Growth** modeling. It relies on different variables.
  *   **The Tax Evasion:** If a Neo-Malthusian claims "Malthus was right," they are claiming the *original mechanism* holds. But since the original mechanism (income $\to$ more babies $\to$ starvation) is demonstrably false in the modern context, they are invoking the name "Malthus" to lend historical weight to a different theory about resource depletion.

  If they simply move the date of "collapse" forward every decade without narrowing the scope of *what* causes the collapse, they are running a degenerating programme.

  ### 3. The Well-Posed Question: Splitting the Theories

  You are correct: there is not one theory here. There are two distinct claims being conflated. To settle the argument, you need to force your friend and the Neo-Malthusians to choose which one they are defending.

  #### Theory A: The Malthusian Trap (Historical/Economic)
  *   **Claim:** In a pre-industrial economy, technology gains are temporarily enjoyed but eventually consumed by population growth, returning living standards to subsistence.
  *   **Status:** **True for most of human history (pre-1800), False for the modern era.**
  *   **Why it failed:** It assumed fertility is a function of income alone. It ignored the "quality-quantity tradeoff" (parents choosing to invest more in fewer children) and the cost of raising children in an industrial society.
  *   **Verdict:** Your friend is right. As a predictor of modern wages and population, this theory is dead.

  #### Theory B: The Carrying Capacity Limit (Physical/Environmental)
  *   **Claim:** Infinite growth is impossible on a finite planet; if consumption exceeds regeneration, collapse occurs.
  *   **Status:** **Tautologically True, but operationally vague.**
  *   **The Trap:** This is the "boring and obviously true" part you suspected. Of course resources are limited. But "limited" doesn't tell us *when* or *how* we hit the wall.
  *   **Verdict:** This is not Malthusianism. This is thermodynamics and ecology. Calling this "Malthus was right" is a branding trick.

  ### The Well-Posed Version

  The question "Was Malthus right?" is useless. Here is the well-posed version you should propose:

  > **"Does the Malthusian feedback loop (Income $\uparrow \rightarrow$ Fertility $\uparrow \rightarrow$ Wages $\downarrow$) still operate in industrialized economies, or has it been permanently replaced by the Demographic Transition?"**

  *   **If the answer is "It still operates":** Then show me the data where rich countries are having more babies than poor countries and seeing their wages collapse due to it. (The data says the opposite).
  *   **If the answer is "It's been replaced":** Then Malthus's *mechanism* was wrong. You can argue we face *other* limits (climate, oil), but you cannot call those "Malthusian" limits without paying the tax of redefining the theory.

  ### How to use this in your argument

  1.  **Accept the Friend's Premise (mostly):** Agree that the specific prediction (wages return to subsistence due to population growth) was falsified by the last 200 years.
  2.  **Challenge the Neo-Malthusian Slide:** When someone says "He was right but early," ask them: *"Which mechanism do you think is intact? Do you believe that if we solve climate change and energy, higher wages will still cause higher birth rates that starve us?"*
  3.  **Apply Your Tax:** If they say "No, but we'll run out of water," reply: *"Okay, that's a resource constraint theory, not a Malthusian wage theory. That's a different model. Does that model have a falsifiable date or condition, or is it just 'eventually'?"*
  4.  **The Popper Point:** Remind them that "Eventually" is not a prediction. "By 2050, if X continues, Y will happen" is a prediction. "Sometime later" is a belief.

  **Summary:** Malthus described a specific engine (the Trap). That engine broke. Neo-Malthusians are trying to sell a different engine (Environmental Limits) using the old brand name. Your "Moving-Goalpost Tax" is the perfect tool to force them to admit they are driving a different car.
