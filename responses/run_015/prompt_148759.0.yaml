  ***

  **DRAFT JOINT STATEMENT: INTERPERSONAL UTILITY AND PHENOMENAL BRIDGES**
  **Signatories:** Phenomenal-Bridge Cardinalists (PBC) & Indexical-Frame Separationists (IFS)

  **1. Agreed Claims**

  1.  **The Epistemic Gap:** Both camps agree that under current biological conditions, the "other minds" problem prevents direct welfare comparison. We rely on behavioral proxies and self-report, which are insufficient for cardinal measurement.
  2.  **Inadequacy of Welfare Econ:** Current welfare economics relies on revealed preference, which conflates intensity of desire with intensity of experience. Both sides agree this is inadequate for normative ethics requiring genuine utility summation.
  3.  **Technical Specs of Bridges:** We assume a hypothetical "phenomenal bridge" technology that allows Subject A to experience the qualia of Subject B without translation loss or filtering. This is not empathy or simulation; it is direct neural coupling where the qualitative character is identical for both parties.
  4.  **Measurement vs. Aggregation:** Both sides distinguish between *measuring* utility (ascertaining magnitude) and *aggregating* utility (summing across subjects for decision making). We agree that solving measurement does not automatically solve aggragation.

  **2. Disagreements Table**

  | Issue | Cardinalist Wording (PBC) | Separationist Wording (IFS) | Linked Crux |
  | :--- | :--- | :--- | :--- |
  | **Nature of Signal** | The bridge makes qualia a public object; pain becomes "the pain" rather than "my pain." | The bridge transmits content, but the *ownership* tag remains indexical; it is "pain experienced by me" vs "pain experienced by you." | Crux 1 |
  | **Normative Force** | Direct access creates a single metric space. If A feels B's pain, it enters the same calculus as A's own pain. | Access creates knowledge, not a common frame. Like velocity, utility requires a reference subject. | Crux 2 |
  | **Aggregation** | Summing is valid because the "subjects" are temporarily merged into a single experiential field during bridging. | Summing is conceptually broken because the indexical frames never fully collapse, even during coupling. | Crux 2 |

  **3. Cruxes Section**

  **Crux 1: The Identity of Experience**
  *   **(a) Sub-question:** When Agent A bridges with Agent B to feel B's headache, is there one headache-token experienced twice, or two headache-tokens with identical qualitative character?
  *   **(b) Hypothetical Test:** A bridge experiment where Agent A reports intensity X and Agent B reports intensity X for the same stimulus stream while coupled. We ask: Is the total disutility 2X or X?
  *   **(c) Predicted Outcome:**
      *   *PBC:* Total disutility is X (or potentially less due to sharing burden). The experience is numerically identical.
      *   *IFS:* Total disutility is 2X. The indexical frame doubles the count even if qualia are identical.

  **Crux 2: The Trade-Off Scenario**
  *   **(a) Sub-question:** Can utility be traded across frames without a "super-subject" to hold the common currency?
  *   **(b) Hypothetical Test:** A bridge scenario where A can take 5 units of pain from B to relieve B, but it costs A 6 units. Without bridging, A refuses. With bridging, does A perceive the trade as irrational solely due to intensity, or does the "whose pain is it" factor remain?
  *   **(c) Predicted Outcome:**
      *   *PBC:* A perceives it as a net loss of 1 unit in a common pool. The indexical boundary dissolves.
      *   *IFS:* A perceives it as "my 6 units" vs "your 5 units." The coordinate dependency prevents direct cancellation.

