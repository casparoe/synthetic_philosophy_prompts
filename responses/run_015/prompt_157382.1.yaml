answer: |-
  You have independently rediscovered a framework that is central to the philosophy of mind and cognitive science, and you are applying it to a problem (event individuation in logging) that philosophers rarely touch but engineers deal with daily.

  Here is the breakdown of what you've found, where it breaks, and what to call it in your design doc.

  ### 1. The Background: You Found Dennett's Stances
  Your "three gears" are not just analogous to Daniel Dennett's Three Stances (from his 1987 book *The Intentional Stance*); they are effectively identical.
  *   **Gear 1:** The **Physical Stance** (laws of physics, circuit states, instruction pointers).
  *   **Gear 2:** The **Design Stance** (function, spec, LRU logic, modules).
  *   **Gear 3:** The **Intentional Stance** (beliefs, goals, desires, "wanting" to keep hit rates up).

  Philosophers argue endlessly about whether Gear 3 is "real" or just a metaphor. You have sidestepped that metaphysical trap by turning it into an engineering heuristic: *If a description holds up across all three, treat it as real.*

  ### 2. Answering Question 1: Does the test have a name?
  There is no single standard term for "invariance across Dennett's stances," but your test is a specific application of **Robustness Analysis**.

  In philosophy of science (notably William Wimsatt), a property is considered "real" if it is detectable via multiple, independent methods of derivation or observation. If you measure a length with a ruler, a laser, and a scale model, and they agree, the length is robust. If they disagree, one method is likely artifacts.

  You are applying **Cross-Stance Robustness**.

  Regarding your specific pain point (the "once or twice" problem): This is the problem of **Event Individuation**. Philosophies of action struggle with this exact issue: *Is "raising my arm" one event, or is it "contracting muscle X, Y, Z" which causes the arm to rise?*

  **For your design doc:** Call it **"Stance-Robust Event Identification."**
  **Definition:** *An event description is Stance-Robust if its identity (counting as one vs. many) and causal role remain invariant when translated between Physical, Design, and Intentional descriptions.*

  ### 3. Answering Question 2: The Bug Counterexample
  You are right to be worried here. Your test fails on bugs, but not because the test is wrong. It fails because **bugs are defined by the failure of invariance.**

  *   **Normal Operation:** Physical ≈ Design ≈ Intentional. (The hardware does what the spec says the agent wants).
  *   **A Bug:** Physical ≠ Design. (The hardware does something the spec forbids).
  *   **A Weird Bug:** Physical ≈ Design ≠ Intentional. (The code does what the spec says, but the spec was stupid/wrong for the goal).

  If you require invariance across all three to call something "real," you will filter out bugs, because bugs are *stance violations*.

  **The Fix:**
  You need to distinguish between **Architectural Facts** and **Execution Facts**.
  *   **Architectural Facts** (Spec, intended behavior): Should pass your Stance-Robustness test. If "Eviction" is one event in Design but two in Physical, your architecture is leaky. You should refactor until they align.
  *   **Execution Facts** (Logs, traces): Must capture the divergence.

  **Revised Test for Logging:**
  Do not use the robustness test to decide *what to log*. Use it to decide *how to label what you log*.
  *   If Physical says "2 steps" and Design says "1 event," log the Physical count but tag it with the Design ID.
  *   If they diverge, that divergence *is* the bug.

  So, your test isn't wrong; it's a test for **Correctness**, not **Existence**. A bug is "real" precisely because it *breaks* the translation. In your design doc, note that Stance-Robustness defines the **Idealized System Model**. Deviations from robustness are **Anomalies**.

  ### 4. Answering Question 3: The "Fake but Survives" Case
  You asked: *If a description survives all three gears but buys no predictive power, is it fake?*

  Yes. This is the problem of **Epiphenomena** or **Just-So Stories**.
  Dennett's criterion for the Intentional Stance (Gear 3) is not just consistency; it is **Predictive Compression**. You are only allowed to use Gear 3 if it allows you to predict the system's behavior *more efficiently* than Gear 2, without losing significant accuracy.

  If you can tell a story where the cache "wants" to keep key K, and it matches the instructions and the design, but you couldn't have predicted anything *cheaper* than just reading the code, then the "want" is ontologically safe but pragmatically useless.

  **The Fix:**
  Add a **Compression Clause** to your test.
  *   *Current:* Survives translation.
  *   *Added:* Provides cognitive compression.

  Does Gear 3 allow you to reason about the event faster than Gear 2? Does Gear 2 allow you to reason faster than Gear 1?
  If a description survives all three but offers no compression over the simplest gear, it is **Redundant Notation**, not a Fact.

  ### 5. Summary for your Design Doc
  You have stumbled onto a genuine distinction. It is not "garbled"; it is a pragmatic adaptation of Robustness Analysis applied to Levels of Abstraction.

  **Recommended Terminology:**
  Use **"Stance-Robust Invariants"**.

  **Definition:**
  > A system property or event is a *Stance-Robust Invariant* if:
  > 1.  **Invariance:** Its identity (e.g., event count) remains stable when described via Physical (instruction), Design (module), and Intentional (goal) models.
  > 2.  **Compression:** Describing it at the higher stances (Design/Intentional) reduces cognitive load without sacrificing predictive accuracy regarding the lower stances.

  **Where it breaks (The Edges):**
  1.  **Pathology:** Bugs are *Stance Mismatches*. If Physical trace contradicts Design spec, robustness fails. This failure *is* the defect. Do not use this test to filter out bug reports.
  2.  **Overfitting:** If an Intentional story fits the trace but predicts nothing new (no compression), it is **Anthropomorphic Noise**, not an Invariant.

  **Practical Application:**
  When designing logging schemas:
  *   **Log Stance-Robust Invariants as High-Level Events.** (e.g., `CacheEviction`). These are safe to alert on because they mean the same thing to the debugger (Physical), the maintainer (Design), and the architect (Intentional).
  *   **Log Stance-Divergences as Diagnostics.** (e.g., `PhysicalStepCount != DesignExpectation`). These indicate leakage or bugs.

  You haven't reinvented the wheel; you've put tires on a philosophical chassis and driven it to work. It holds up, provided you remember that cars are supposed to break sometimes.
