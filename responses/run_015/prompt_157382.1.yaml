      *   **Q2 (Bugs):** The test is too strict for pathology. Bugs are *Stance Violations*. The test identifies *Architectural Truth*, not *Run-Time Truth*. Fix: Apply the test to the *spec*, not the *bug*. Or, acknowledge that bugs are defined by the *failure* of invariance between Physical and Design.
