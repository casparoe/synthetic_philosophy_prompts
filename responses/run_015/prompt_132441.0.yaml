  hello everyone please find below the materials for the upcoming take-home final in the philosophy of logic seminar which is designed to be completed within ninety minutes and is worth twenty marks total the essay question is as follows consider a modified version of lewis carroll's tortoise who accepts modus ponens for ordinary extensional premises but demands a separate independent justification every time the rule is applied to modal statements such as the inference from necessarily p to p ask whether this modification relocates carroll's original infinite regress or creates a genuinely different problem and map out where a logical monist versus a logical pluralist would stand on whether the regress is vicious in this specific modal context please ensure your response distinguishes between what is settled regarding the tortoise paradox and what remains genuinely contested among contemporary logicians

  a model response would proceed along these lines beginning with a clear exposition of carroll's original point which is widely accepted as settled namely that inference rules cannot be treated as additional premises within an argument without triggering an infinite regress because accepting premises is distinct from accepting the rule that allows one to move from those premises to a conclusion the model answer should note that while it is settled that rules are not premises it is genuinely contested how we justify the rules themselves with some philosophers arguing for primitivism where rules are self-justifying and others arguing for a wittgensteinian view where justification ends in practice rather than propositional knowledge when addressing the modal twist the student should argue that this does not create a genuinely different problem but rather relocates the regress to a specific domain because the tortoise is still treating a rule of inference as if it were a premise requiring justification before application even if restricted to modal logic the demand for justification invites a further rule to justify the first rule leading to the same vicious regress unless one admits a stopping point the response should then differentiate the logical monist from the logical pluralist regarding the viciousness of this regress a logical monist who holds that there is one true logic applicable to all domains would likely argue that the regress is vicious because exempting modal statements from standard modus ponens without a unified justification undermines the universality of logical consequence suggesting an inconsistent application of rational norms whereas a logical pluralist might argue that different domains operate under different consequence relations so demanding separate justification for modal inferences is not inherently vicious provided one accepts that modal logic and extensional logic have different normative forces however even the pluralist must address whether the rule governing the modal domain itself faces a carroll-style regress regarding its application the model answer should conclude by reiterating that while the domain restriction changes the scope it does not solve the foundational issue of rule-following which remains the core contested ground between foundationalists and practice-based theorists

  finally regarding the marking scheme the twenty marks are allocated based on specific argumentative moves and accuracy regarding the literature students will earn five marks for correctly explaining the distinction between premises and rules as the settled core of carroll's paradox and will lose marks if they conflate the two or suggest carroll proved deduction is impossible rather than showing a structural issue in justification another five marks are awarded for analyzing the modal twist specifically where students must identify that treating modal rules as requiring premise-like justification recreates the regress and they will lose marks if they claim this twist solves the problem or fails to engage with the rule-premise distinction the third set of five marks depends on the application of logical monism and pluralism where students must accurately characterize the monist as requiring uniformity and the pluralist as allowing domain-specific norms without falsely attributing the view that pluralism escapes the regress entirely the final five marks are reserved for distinguishing settled from contested issues where students gain credit for identifying the rule-premise gap as settled and the solution to the regress as contested and they will lose significant marks if they present a specific solution like conventionalism or primitivism as the consensus view among logicians additionally students should be penalized if they use bullet points or headings as this violates the format requirements and demonstrates a lack of attention to the instructions provided for this examination
