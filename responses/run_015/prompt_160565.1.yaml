answer: |-
  **Project Title:** Reconstructive Stability as Heredity: Decoupling Fidelity from Cumulative Cultural Evolution

  **Principal Investigator:** [Your Name]
  **Department:** [Your Department]
  **Requested Period:** Six Months

  **Project Summary**
  The central impasse in the philosophy of biology and cultural evolution concerns whether culture constitutes a Darwinian population. Skeptics argue that cultural transmission lacks the high-fidelity replicator required for heredity, rendering "memetics" a mere metaphor. Defenders argue that fidelity is manufactured via institutions and teaching. Both sides, however, rely on a flawed metric: single-step copying fidelity. This project proposes that cumulative culture depends not on copying fidelity, but on *reconstructive stability*—the tendency of learners to converge on specific variants despite noisy input. I will develop a formal toy model demonstrating that systems with low transmission fidelity can sustain lineages if they possess strong reconstructive attractors, while high-fidelity systems without attractors drift. This project will redefine the necessary conditions for cultural heredity, resolving the memetic stalemate without requiring new empirical data.

  **Statement of Problem**
  Darwinian evolution requires variation, differential fitness, and heredity. In biological contexts, heredity is secured by high-fidelity replication (e.g., DNA). When applied to culture, this standard generates a dichotomy. Critics (e.g., Sperber, Kroeber) note that cultural learning is reconstructive and error-prone; there is no "germ line," so there is no heredity. Defenders (e.g., Boyd, Richerson) counter that social learning mechanisms boost fidelity enough to approximate replication.

  This debate measures the wrong quantity. Both sides assess the similarity between a model's output and a learner's output (single-step fidelity). However, cultural transmission is rarely a direct copy; it is a reconstruction based on degraded observations and prior cognitive biases. The critical metric is not how well I copy you, but whether ten learners exposed to ten corrupted versions of your idea converge on the same variant after a few rounds. If they do, the system possesses *reconstructive stability*.

  Existing Cultural Attractor Theory (CAT) acknowledges that cognition shapes transmission, but it has not been rigorously deployed to solve the Darwinian definition problem. CAT describes *that* attractors exist, but it does not formally separate fidelity from stability to prove that stability alone can sustain a lineage. Consequently, the field remains stuck arguing over whether culture is "like" biology, rather than identifying the dynamical conditions under which any population evolves.

  **Research Question**
  *What are the minimum dynamical conditions required for a reconstructive system to sustain a cumulative lineage, and can reconstructive stability function as heredity in the absence of high-fidelity replication?*

  This question demands a determinate answer: either stability is sufficient for heredity, or it is not. My hypothesis is that stability is sufficient. If a system returns to a specific state space after perturbation, it preserves information across generations. Therefore, heredity is a property of the *reconstruction dynamics*, not the *transmission channel*.

  **Methodology**
  This is a conceptual project utilizing formal modeling. I will not conduct human subjects research. Instead, I will construct a mathematical toy model to isolate variables that empirical studies conflate.

  1.  **Formalization:** I will define "fidelity" as the correlation between parent and offspring variants in a single transmission event. I will define "stability" as the rate of convergence to an attractor state across multiple transmission events given noisy inputs.
  2.  **Model Construction:** I will build an iterated function system. The model will simulate a chain of learners. Each learner applies a transformation function to an input variant. This function will include two parameters: a noise term (representing low fidelity) and an attractor term (representing cognitive bias/reconstruction).
  3.  **Simulation:** I will run simulations across four conditions: (A) High Fidelity/No Attractor, (B) Low Fidelity/No Attractor, (C) High Fidelity/Strong Attractor, and (D) Low Fidelity/Strong Attractor.
  4.  **Analysis:** I will measure lineage persistence. If Condition D sustains a stable lineage while Condition A drifts, the hypothesis is confirmed: stability decouples from fidelity and can sustain heredity.

  **Timeline**
  *   **Months 1–2:** Literature synthesis and formal definition of variables. I will formalize the distinction between fidelity and stability in existing evolutionary models to ensure the new model is compatible with standard population genetics terminology.
  *   **Months 3–4:** Model construction and simulation. I will code the iterated learning model (using Python or R) and run parameter sweeps to identify the threshold where stability compensates for fidelity loss.
  *   **Month 5:** Analysis and interpretation. I will map the model results onto the philosophical debate, specifically addressing the Lewontin conditions for evolution.
  *   **Month 6:** Drafting the dissertation chapter and a target journal article (e.g., *Philosophy of Science* or *Biological Theory*).

  **Significance**
  This project offers a pathway out of the "memes vs. metaphors" deadlock. By shifting the criterion from copying accuracy to dynamical stability, we can classify cultural systems as Darwinian populations based on their behavior, not their substrate. This has implications beyond theory; it suggests that institutions designed to enforce fidelity (e.g., strict policing of norms) may be less evolutionarily robust than institutions that leverage cognitive attractors (e.g., intuitive rituals).

  **Feasibility and Risk Assessment**
  The scope is limited to a proof-of-concept toy model, which is achievable within six months. However, two failure conditions exist.

  First, the model may be trivial. If the decoupling of fidelity and stability is mathematically obvious to reviewers, the contribution may seem negligible. To mitigate this, I will ground the model in specific debates regarding the Lewontin conditions, ensuring the philosophical payoff is explicit.

  Second, the project could collapse back into existing Cultural Attractor Theory. If I cannot demonstrate that *stability* specifically answers the *heredity* objection (rather than just describing transmission bias), the project adds little. I will avoid this by explicitly testing the "High Fidelity/No Attractor" condition. If high fidelity alone fails to sustain a lineage in the model, I prove that fidelity is not the necessary condition critics claim it is.

  Finally, there is a risk that the model requires empirical parameters I cannot estimate. I will mitigate this by keeping the model abstract. The goal is not to fit specific cultural data, but to prove the *possibility* of the mechanism. As long as the model demonstrates the logical separation of fidelity and stability, the philosophical conclusion holds.

  ***

  **Feasibility Note (For Applicant Only)**
  Is this too big for six months? **No, provided you stick to the toy model.**
  If you try to map this onto real-world historical data or complex agent-based simulations, it will blow out. Keep the model "toy" sized—think Schelling's Segregation Model or Axelrod's Cultural Dissemination, not a full-scale climate simulation. The goal is a *proof of existence*, not a comprehensive theory of all culture. If you can write the code in Month 3 and spend Month 4 interpreting it, you are safe. The risk is getting bogged down in the literature review; cut that off at Month 2 and start building.
