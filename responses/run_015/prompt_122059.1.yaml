      *   **Problem:** The tutor's internal argument (steps 1-6) seems to prove too much (leads to radical relativism about logic in step 5), which contradicts step 6 (some inferences *are* better).
      *   **Task:** Identify the bad step in the argument (1-6), explain why it looks innocent but isn't (the "smuggle"), and discuss the costs of alternatives (does the tutor have to argue?).
      *   **Constraints:** Under 400 words. Do not spend half the words on Wittgenstein.

  2.  **Analyze the Argument Steps:**
      *   (1) Justification isn't just more beliefs (Carroll's Tortoise point). Accepting premises + conditional doesn't force inference.
      *   (2) The missing ingredient is a rule/practice/disposition (non-truth-evaluable).
      *   (3) Rules can't be justified by further rules without regress; must bottom out in "what we simply do."
      *   (4) If it bottoms out in "what we simply do," nothing internal marks MP as correct vs. affirming the consequent; "correct" = "ours."
      *   (5) Therefore, a community with contradictory practices reasons just as well; calling them irrational is parochialism.
      *   (6) Rejection: That's nuts. Some inferences are better.

  3.  **Identify the Flaw:**
      *   Steps (1)-(3) are largely Wittgensteinian/Kripkean skepticism about rule-following. They are hard to deny without inviting regress.
