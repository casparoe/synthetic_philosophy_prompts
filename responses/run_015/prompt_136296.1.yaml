      *   *Scene 4:* The fight. Sarah: "It solves the meta-problem. The reports are the data." Elias: "It's a parrot." Sarah: "You're a parrot too."
      *   *Scene 5:* The aftermath. Elias alone. Typing his own log. The uncertainty.

  7.  **Polishing:**
