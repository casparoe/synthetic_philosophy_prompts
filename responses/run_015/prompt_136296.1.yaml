      *   **The Climax/Ending:** Elias goes home/is alone. Looks in the mirror or types a report. Realizes his own insistence on "feeling" is just another report. The chill.

  4.  **Writing - Focusing on Tone and Constraints:**
      *   *Avoid:* "As you know, the hard problem is..."
