      *   **The Glitch/Turn:** Sarah finds something. The Clerk predicts a subject will *not* claim ineffability in a scenario where humans always do. Or vice versa. Let's go with: The Clerk predicts a subject will claim vivid experience where none should exist (a simulated lesion), or it predicts the *loss* of the "hard problem" intuition in a specific context. Let's try this: The Clerk predicts that if you tell a subject their brain was rewired overnight (even if it wasn't), their reports on ineffability change systematically. No, that's too psychological.
      *   **Refining the Turn:** The prompt suggests "confident predictions about a case no human has actually been in." Let's go with the "blind seeing red" scenario. The Clerk generates a transcript for a congenitally blind person describing red *after* a theoretical cure, and it's indistinguishable from actual post-cure transcripts, but it was trained only on pre-cure discussions *about* red.
