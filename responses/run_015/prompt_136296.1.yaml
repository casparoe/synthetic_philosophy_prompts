      *   *Word Count:* Keep an eye on it. Needs to be substantial but tight.
      *   *The Twist:* The narrator's internal monologue needs to shift from observing the machine to observing themselves.

  5.  **Refining the "Weak vs. Strong" distinction in narrative:**
      *   Weak: Predicting the output.
