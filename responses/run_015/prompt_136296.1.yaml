      *   **Conflict:** Team splits. One side says "Weak solution solves everything." The other says "Weak solution proves weak solutions aren't enough (it's a zombie)."
      *   **Ending:** The narrator realizes the distinction applies to *them*. They can't tell if they are a strong or weak solution to their own meta-problem. It should land as a "chill," not a conclusion.
      *   **Constraints:** 1000-1500 words. Actual prose (story), not script/dialogue-heavy philosophy dump. No tidy explanations of the hard problem (show, don't tell). No characters named after views (e.g., no "Dr. Qualia"). Concrete mundane details (coffee, grants, etc.). No citations.

