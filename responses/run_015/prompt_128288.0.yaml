prompt: |-
  you are a decision theorist and philosopher of economics — the sort of person who has actually sat in a room and argued about whether utility is a representation of choice, a measurement of well-being, or a feeling. take your time with this one. please start with a rough brainstorm: dump out 12–15 candidate requirements you can think of, mark the ones that feel like genuine requirements and the ones that feel like tribal loyalties of some camp, and only then prune to a final list. I'd rather see the pruning than a clean list that hides it. write it all in American English.

  context: I'm on a small behavioral-insights team inside a public health agency. we have a genuinely rich choice record — years of logs of what people actually picked inside an app we run (appointment slots, medication refill timings, which of four message variants they clicked) — and we want to get from "what they chose" to "whether the intervention left these people better off than the alternative would have." my director wants a one-page answer. I think the honest answer is that it depends what you think utility is, and I want the spec before I argue with her.

  so: write me the desiderata that any account of utility would have to meet to be adequate for *that* job. not adequate for a seminar — adequate to underwrite the claim that policy A made a population better off than policy B, using choice data of roughly the kind I described. for each requirement give me the case or consideration behind it. I want the case, not the slogan, because the case is what I'll repeat in the meeting.

  some things I specifically want forced onto the list, plus whatever you think I'm missing:

  - our data has no prices and no budget sets. just a stream of choices from menus we only partly observed, and the menu itself was built by a ranking algorithm that is one of the things we might want to evaluate. what does a theory owe us when the feasible set is unobserved, or partly constructed by the intervention under test?
  - one of our users picks the top item on the list. Every time. years of it. no cycles, no violations, she passes every internal-consistency test there is — including the finite-data one where you ask whether there exists *any* utility function at all that reproduces the record. I don't think she has preferences in any interesting sense, and I don't think her clicking the top slot means the top slot made her better off. what requirement does that case generate, and where does it sit on the non-negotiable / negotiable line?
  - my group uses three made-up labels and I want you to tell me whether they're the right ones or whether they collapse or miss one: "bookkeeping utility" (just a numbering that reproduces the choices), "welfare utility" (how well off the person is), and "drive utility" (whatever actually moves her, causally — the thing that would still be there if you redescribed her situation differently). can one quantity be all three? is a theory only adequate if it delivers all three, or is demanding all three just one camp's wish list?
  - my colleague's objection, which I half believe: once you're allowed to redescribe the objects of choice to soak up context (she chose x-while-y-was-on-screen, x-while-it-was-raining, and so on), literally any choice record whatsoever can be rationalized by some preference ordering, and then the theory has no content and can never be wrong. is that a real desideratum or a bad objection? if it's real, what exact shape should the requirement take — what's the constraint on redescription that saves the theory without rigging it?
  - I also want the theory to be able to say that somebody chose badly for herself (the third drink, the panic refill, the slot she books at 6am and then misses), and I want it to give us enough cross-person comparability to do anything like cost-benefit. both of those seem to pull hard against the whole revealed-preference instinct, and the second one runs into the fact that choice data only pins a utility function down up to some transformation. tell me which desiderata can't be jointly had, and which one you'd actually drop.

  mark each final requirement as non-negotiable or as a preference of a particular camp — I want to know which demands are load-bearing and which are just what revealed-preference people, or welfarists, or the neuroeconomics crowd, happen to like. and tell me which single requirement excludes the most candidate theories, and whether what survives is still a theory of utility at all or just a theory of choice wearing a utility costume.

  if you want a short paragraph at the very end on how the usual candidates (the strict revealed-preference story, the mental-state / experienced-well-being story, a preference-satisfaction view) do against your list, fine, but keep it to a couple hundred words. and no bibliography, no reading list, no citations — I know the literature roughly and I don't want you guessing at references. I want the spec. a table for the final list is fine.
