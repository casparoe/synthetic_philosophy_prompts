      *   **Tension:** Revealed Preference (RP) says choice = welfare. Behavioral/Paternalist says choice $\neq$ welfare sometimes.

  3.  **Brainstorming Candidate Requirements (12-15):**
      1.  *Consistency:* Choices must be transitive/acyclic to count as utility maximization. (Tribal - RP)
      2.  *Welfare Connection:* Utility must correlate with subjective well-being or health outcomes. (Genuine for this context)
      3.  *Context Independence:* Utility shouldn't change just because the frame changed, unless the object changed. (Genuine - avoids redescription trap)
      4.  *Predictive Power:* Utility function must predict out-of-sample choices. (Tribal - Positivist)
      5.  *Normative Authority:* Must allow saying "this choice was bad for them." (Genuine for public health)
      6.  *Interpersonal Comparability:* Must allow comparing Utility(A) vs Utility(B) across people. (Genuine for cost-benefit)
      7.  *Causal Mechanism:* Utility should map to a psychological drive, not just a fit. (Tribal - Neuro/Psych)
      8.  *Menu Invariance:* Utility of an object shouldn't depend on what else was on the menu. (Tribal - Classical RP, but problematic here)
      9.  *Observability:* Inputs must be observable (no hidden mental states). (Tribal - Behaviorist)
      10. *Stability:* Preferences shouldn't flip-flop without reason. (Genuine - needed for policy)
      11. *Error Accommodation:* Must distinguish between genuine preference and mistake/noise. (Genuine for behavioral insights)
      12. *Endogeneity Awareness:* Must account for the fact that the menu was chosen by an algorithm. (Genuine for this specific data)
      13. *Operationalizability:* Must be calculable from the data we have. (Genuine for practical use)
      14. *Non-Tautology:* Cannot be true by definition (avoids redescription trap). (Genuine - philosophical rigor)
      15. *Alignment with Health:* Utility should align with health metrics where possible. (Genuine for public health)

  4.  **Categorizing (Genuine vs. Tribal):**
      *   *Genuine (for this specific policy job):* Welfare Connection, Normative Authority, Interpersonal Comparability, Error Accommodation, Endogeneity Awareness, Non-Tautology, Operationalizability.
      *   *Tribal (Specific school of thought):* Consistency (RP), Predictive Power (Positivist), Causal Mechanism (Neuro), Menu Invariance (Classical), Observability (Behaviorist).
      *   *Nuance:* "Stability" is genuine but hard. "Alignment with Health" is specific to the agency.

  5.  **Addressing Specific User Constraints:**
      *   *No Prices/Budgets:* Means we can't use standard demand recovery. Need structural assumptions or welfare proxies.
      *   *Top-Item Clicker:* Shows consistency $\neq$ welfare. Requirement needed: *Welfare Relevance* (utility must track something beyond mere selection).
      *   *Three Labels:* Bookkeeping (Representation), Welfare (Normative), Drive (Psychological). Can one be all three? Usually no. Need to specify which one the policy needs. (It needs Welfare).
      *   *Redescription:* Need a constraint on *what counts as a choice object*. Requirement: *Object Stability* or *Description Invariance*.
      *   *Normative + Comparability:* This is the hard part. RP fails here. Need *Interpersonal Comparability* and *Error Model*.

  6.  **Pruning to Final List:**
      *   I need to select the ones that are *load-bearing* for the specific claim: "Policy A made people better off."
      *   Drop: Predictive Power (nice but not needed for welfare claim), Observability (we need to infer mental states for welfare), Menu Invariance (too strict for behavioral context).
      *   Keep: Welfare Relevance, Error Accommodation, Interpersonal Comparability, Non-Tautology (Redescription constraint), Endogeneity Handling.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Brainstorm Section:* List 12-15, mark G/T.
      *   *Pruning Logic:* Explain why I'm cutting the "Tribal" ones that don't serve the *welfare* claim.
      *   *Final List:* Focus on the 5-6 critical ones.
      *   *Addressing the "Three Labels":* Explicitly discuss Bookkeeping vs. Welfare vs. Drive.
      *   *Addressing the "Top-Item Clicker":* Use this to motivate the Welfare Relevance requirement.
      *   *Addressing "Redescription":* Use this to motivate the Non-Tautology requirement.
      *   *Addressing "Normative + Comparability":* This is the tension. I need to be honest that RP fails here.
      *   *Final Table:* Requirement, Case, Status (Non-Negotiable vs. Camp).
      *   *Exclusionary Requirement:* Likely Interpersonal Comparability or Welfare Relevance.
      *   *Theory Assessment:* Brief summary.

  8.  **Refining the "Three Labels":**
      *   Bookkeeping = Representation Theorem utility.
      *   Welfare = Normative utility.
      *   Drive = Psychological utility.
      *   *Verdict:* They rarely collapse. A theory adequate for *policy* needs Welfare. Bookkeeping is insufficient (Top-Item Clicker). Drive is helpful but not strictly necessary if Welfare is measured directly.

  9.  **Refining the "Redescription" Objection:**
      *   It's a real desideratum. If you can redefine $x$ as $x-in-context-C$, you can rationalize anything.
      *   Constraint: *Description Invariance*. The utility of an outcome shouldn't depend on irrelevant description unless the description changes the outcome itself.

  10. **Refining the "Normative + Comparability" Tension:**
      *   RP says no normative judgment (choice reveals welfare).
      *   To say "chose badly," you need a distinction between *decision utility* (what they chose) and *experienced utility* (what was good for them).
      *   To do cost-benefit, you need cardinality and comparability.
