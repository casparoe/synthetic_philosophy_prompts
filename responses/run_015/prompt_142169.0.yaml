  Good evening, everyone.

  Looking around this room, I see two distinct groups. On one side, I see family, neighbors, and friends who know my mother as the person who remembers your birthday and helps move your couch. On the other, I see staff, colleagues, and stakeholders who know her as the Senator who mastered the appropriations committee and shepherded bills through conference.

  Usually, when those two groups occupy the same room, it's because someone is running for something. Tonight is different. Tonight is about someone leaving.

  My mother is leaving the State Senate after twenty-four years. She is leaving because the voters of this state passed a term-limits amendment two decades ago. She opposed that amendment at the time, but she has never questioned the voters' right to pass it, and she is not bitter about abiding by it. A rule is a rule, and democracy requires respecting the outcome even when it doesn't go your way.

  However, since her departure is mandated by a law designed to curb the power of long-serving politicians, I think it is worth asking what exactly those twenty-four years were for.

  In political science, there is a worry about the "career politician." It is the fear that a long tenure becomes a project of **accumulation**. In this model, office is used to hoard personal power, seniority, donor networks, and name recognition. The goal becomes staying in office for the sake of staying in office. This is what term-limit advocates rightly fear. It is what creates entrenched interests that are hard to dislodge.

  But there is another model. Let's call it **custodianship**.

  In a career of custodianship, longevity isn't about accumulation; it's about stewardship. It is staying long enough to learn the budget so you don't break it. It is stewarding the institution's memory so that mistakes aren't repeated every new session. It is protecting a district's interests through changes of governors and parties, and leaving the chamber in better shape than you found it.

  My hypothesis tonight is simple: The term-limits movement was aimed at stopping accumulation, but it is a blunt instrument that cannot tell it apart from custodianship.

  To the legislative staff and colleagues here: You know that institutional memory is the first thing to vanish when turnover is high. You know that my mother's longevity wasn't used to build a fiefdom, but to build a floor—a stable foundation upon which new members could stand. She didn't accumulate power; she distributed understanding.

  To the friends and neighbors here: You know that her "career" was never about her. It was about showing up. Custodianship, in human terms, means being the adult in the room when things get chaotic. It means consistency. It means that when the state government felt distant or confusing, there was someone in the capital who knew your name and knew how the machinery worked.

  Now, I know there are people in this room—including some friends of mine involved in citizens' assembly projects—who believe the problem isn't just long careers, but elected careers itself. They argue we should select legislators by lot, by lottery, because they distrust the professional class.

  I respect that impulse. It comes from a desire for a government that belongs to the people. But to those friends, I offer this gentle pushback: If we are worried about accumulation, the answer isn't to abolish the career; it is to ask what the career was *for*.

  If the career is for accumulation, then yes, draw names from a hat. But if the career is for custodianship, then experience is not a bug; it is a feature. I am relieved we did not have to rely on luck to find someone who knew the difference between a fiscal note and a filibuster. We didn't need a lottery; we needed a steward.

  And for the record, while my mother is officially termed *out* of the Senate, she has already been enthusiastically termed *in* to her next role as full-time grandmother and nosy aunt, so the public service continues.

  The suspicion behind term limits was not baseless. Careerism can be a disease. But my mother's twenty-four years prove that longevity can also be a cure. She showed that you can serve for a long time without belonging to the office. You can master the rules without being mastered by them.

  She is leaving the institution better than she found it. She is leaving the district stronger than it was. And she is leaving with the knowledge that while the voters may have limited her term, they could not limit the standard she set for what a term should be.

  So, please raise your glasses.

  To my mother. Not for the power she held, but for the trust she kept. Not for the years she accumulated, but for the institution she custodied. To the Senator, and to Mom.
