answer: |-
  - The correspondence table
  In the friend's analogy, the Corporation corresponds to the Statue, representing the functional whole that persists through change. Employees map directly onto Clay particles or atoms, serving as the constitutive material base. Hiring and firing employees equate to the clay gaining or losing atoms through erosion or repair. Corporate structural hierarchy mirrors the spatial arrangement or form that makes the clay look like a statue rather than a lump. Finally, dissolving the corporation matches squashing the statue; the employees (atoms) remain, but the corporate identity (statuehood) ceases. The analogy aims to show that just as a corporation is nothing over and above its staff organized legally, a statue is nothing over and above clay organized spatially. It suggests identity is functional rather than substantial. The turnover aspect highlights persistence: the corporation survives total staff replacement, just as the statue survives minor material loss. This mapping supports the view that there is only one entity here: the organized collective, whether legal or physical. The "ghost" being denied is the separate metaphysical object distinct from its constituents. Regarding temporary parts, specific projects within the corporation might mirror temporary atomic assemblies, suggesting the whole is just a sequence of these temporary configurations rather than a permanent substance.

  - Where the mapping breaks
  The analogy fractures primarily because corporations are abstract legal entities, whereas statues are concrete physical objects. A corporation exists via social agreement and law; if everyone forgets the law, the corporation vanishes even if the staff remains. A statue exists physically; if everyone forgets it, it remains until crushed. Employees are autonomous agents with identities independent of the corporation. Clay atoms lack independent identity; they are merely matter. You cannot "fire" an atom in the same sense; atoms don't hold roles, they just occupy space. Furthermore, survival conditions diverge. A corporation can survive total employee turnover because its identity is tied to registration numbers and legal continuity, not physical continuity. A statue's survival through material replacement is very contentious. If you replace every clay particle, many argue the original statue is gone. The corporation analogy assumes functional continuity equals identity, but physical objects arguably require material continuity. Additionally, the "temporary parts" idea complicates this. Employees leave voluntarily; atoms are shed passively. The corporation can exist without physical offices; the statue cannot exist without the clay. Thus, the analogy treats physical constitution as if it were bureaucratic organization, ignoring the brute physicality of the statue case. Crucially, the pluralist argues the clay exists before the statue is shaped. The corporation analogy implies the employees exist before the corporation, but the corporation doesn't change the employees' physical nature. Shaping clay changes its properties (aesthetic, functional), suggesting the statue is a new object, not just a renamed lump. The analogy hides this transformation by focusing on legal status rather than physical modification. If the statue is a temporary assembly of atoms, it ceases to exist when atoms scatter, whereas a corporation can lie dormant. This mismatch undermines the claim that the statue is merely the clay arranged nicely.

  - What's being smuggled in
  The analogy smuggles in a functionalist theory of identity, assuming what an object *does* or represents really matters more than what it *is* materially. By comparing a physical object to a legal fiction, it presupposes physical constitution is merely organizational status rather than ontological substance. It assumes the "one object" view is default without proof, leveraging intuitive acceptance of corporations as singular entities to bypass hard metaphysical work on physical coincidence. It also presupposes persistence conditions for social entities apply to physical matter, often ignoring that clay has causal powers independent of arrangement. This rhetorical move shifts the burden of proof onto the pluralist to explain why physical objects shouldn't behave like legal ones, despite lacking the legal framework defining corporate identity. Thus, it treats eliminating the statue as simplification, potentially erasing distinct physical properties. It implicitly denies arrangement creates new causal powers, ignoring how form constrains function, making the statue capable of things the lump is not.

  - Does her conclusion survive?
  If the analogy fails, her conclusion doesn't necessarily collapse, but it loses persuasive power. The one-object view (constituition monism) relies on parsimony—why posit two objects where one suffices?—which stands independently of the corporation comparison. However, without the analogy, she must directly address the differing persistence conditions: the clay survives squashing, the statue does not. Pluralists use this divergence to argue they are distinct objects occupying the same space. This highlights that physical objects don't behave like legal constructs, giving ammo to pluralists. If the statue cannot "fire" atoms like a corporation fires staff, then the statue's identity is tied more tightly to its matter than the corporation is to its employees. This suggests the statue and clay might indeed be distinct entities with different modal properties. Her view survives only if she can explain away these differences without relying on the flawed corporate mapping, perhaps by arguing "statue" is just a temporary phase of the clay.

  - A better analogy?
  A tighter analogy is a knot in a rope. The rope is the clay, the knot is the statue. Cut the rope, the knot dies. Yet, the rope exists before and after the knot. Unlike the corporation, both are physical. This captures dependency without implying social construction. It highlights the knot is a temporary configuration, not a separate object, yet has distinct properties. This supports the friend's view that the statue is just clay arranged temporarily, without relying on abstract legal entities. This preserves the physical nature of constitution, illustrating how form differs from matter without being a separate object.
