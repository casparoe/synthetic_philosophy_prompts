answer: |-
  This is a sophisticated set of intuitions. You are effectively grappling with the tension between **act-based definitions** of supererogation (what was done) and **agent-based definitions** (what was sacrificed/motivated).

  To make your verdicts coherent, you need a principle that accounts for **Role Obligations**, **Marginal Cost**, and the **Negative/Positive Duty Distinction**.

  ### The Principle: Role-Relative Sacrifice Threshold
  An act is supererogatory if and only if:
  1.  **It is morally good** (produces net benefit or upholds a high value).
  2.  **It is optional** (omitting it is not morally wrong).
  3.  **It exceeds the "Reasonable Expectation Threshold"** for that specific agent, determined by:
      *   **Role:** Specific duties attached to relationships (parent, doctor) or professions.
      *   **Cost:** The sacrifice to the agent's own legitimate interests (wealth, safety, career).
      *   **Capacity:** The agent's ability to bear the cost without compromising their own agency.

  ### The Inconsistency: Case 5 (The Wealthy Funder)
  To achieve coherence, **you must overturn your intuition on Case 5.**

  **Why:** Your verdict on Case 3 (10% donation is "close to what decency requires") establishes a baseline for general positive duties. If donating 10% (a moderate cost) is near the boundary of duty, then donating a trivial amount (near-zero cost) to save lives (Case 5) cannot be supererogatory; it must be **obligatory**.

  If you keep Case 5 as supererogatory, you break the link between *cost* and *duty* that validates Case 1 (high risk = super) and Case 4 (high cost = super). You cannot have it both ways: you cannot claim high cost makes an act supererogatory (Case 4) while also claiming near-zero cost makes an act supererogatory (Case 5), unless "goodness" alone defines it. But if goodness alone defines it, Case 2 (Parent) becomes supererogatory because it's "good," which you rightly reject.

  **The Repair:** Classify the Wealthy Funder (Case 5) as **Duty**. It is an "easy rescue." The fact that it feels less praiseworthy if done for reputation is a separate issue: that affects *moral worth/praise*, not the deontic status of the act. Supererogation is about whether you *had* to do it, not *why* you did it.

  ### Predictions for the Rural Doctor
  **Verdict:** This is **Supererogatory for the full 30 years.**

  **Reasoning:**
  1.  **Role:** A doctor's duty is to treat patients competently and ethically. It is *not* a duty to treat them at a 50% income loss or in undesirable locations unless specifically contracted.
  2.  **Maintenance:** Your intuition about "Maintenance Supererogation" holds. Duty does not accumulate through repetition. Just because you have been generous for 29 years does not make generosity obligatory in year 30. The "Reasonable Expectation Threshold" resets; society cannot claim your sacrifice as a right simply because you established a precedent.
  3.  **Comparison:** The Doctor and the Vaccine Funder are **split** by this principle.
      *   **Doctor:** High Cost + Role Adjacent = **Supererogatory.**
      *   **Funder:** Low Cost + No Role = **Duty** (based on the repair to Case 5).

  ### The Motivation Problem (Case 5 & 7)
  You noted that the anonymous funder feels *more* supererogatory than the reputation-seeking one.
  *   **Principle Fix:** Separate **Classification** from **Praise**.
  *   An act is supererogatory based on cost/optionality (Objective).
  *   An act is *praiseworthy* based on motive (Subjective).
  *   A reputation-seeking funder performs a supererogatory act (if cost were high) or a duty (if cost is low), but deserves *less praise*. Do not let motive blur the definition of the act category.

  ### Fresh Test Case: "The Retired Rescuer"
  To test your repaired principle (specifically the "Maintenance" and "Role" aspects), consider this:

  > **Case 8:** A lifeguard retires after 30 years. On vacation, they see a child drowning. They save the child at significant risk to their own life (identical to Case 1).
  >
  > **Question:** Is this act *more*, *less*, or *equally* supererogatory compared to a non-lifeguard saving the child?

  **Why this tests the principle:**
  *   **If you say "Less Supererogatory":** You are admitting that *character/virtue history* lowers the threshold of expectation. (Does being a good person make good acts duty?)
  *   **If you say "Equally Supererogatory":** You are affirming that *role obligations* expire when the contract ends. (Supports the Rural Doctor verdict).
  *   **If you say "Not Supererogatory":** You are arguing that *capacity* creates duty. (Because they *can* save the child better than others, they *must*).

  **My Principle's Prediction:** It is **Equally Supererogatory**. The role obligation ended at retirement. The capacity to help does not create a duty unless the cost is trivial (which, by your Case 1 stipulation, it is not). This confirms that "Maintenance" of a role does not create permanent debt, supporting the Rural Doctor verdict.

  ### Summary of Required Shifts
  1.  **Drop:** The idea that the Wealthy Funder (Case 5) is supererogatory. If the cost is trivial, it is duty (aligning with Case 3).
  2.  **Keep:** The distinction between Role Duty (Parent/Doctor contract) and General Duty.
  3.  **Clarify:** Supererogation is about the *act's cost/optionality*, not the *agent's motive*. Motive determines praise, not category.
  4.  **Accept:** "Maintenance Supererogation" is real. Long-term sacrifice does not calcify into duty.

  Does shifting Case 5 to "Duty" feel like a loss, or does it resolve the tension you felt about the "weirdness" of low-cost heroism?
