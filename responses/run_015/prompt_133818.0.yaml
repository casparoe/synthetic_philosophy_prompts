prompt: |-
  A few months ago I joined the board of a small land trust that manages a couple of thousand hectares of mixed woodland, fen and old grazing land, and I volunteered to take over the reserve's species list. What I found was not a data problem but a conceptual one. Our headline figure — the number of species the reserve exists to protect — shifts by roughly a third depending on which of the published checklists we reconcile against, and almost none of the difference comes from new fieldwork: it comes from disagreements about what a species is in the first place. That number goes into grant applications, into the management plan, and, because protection in our jurisdiction attaches to whatever the official list names at whatever rank it names it, into what we are legally obliged to manage for. So the question has stopped being academic for me, and I have discovered that I do not know what I should be demanding of an answer.

  What I want from you is a specification rather than a survey. Write out the desiderata that an account of species would have to meet for me to trust it as the backbone of such a list — the phenomena it has to accommodate, the cases it has to get right, the distinctions it must not collapse, and the results from biology it is not allowed to contradict — with the case or consideration behind each requirement, not just the requirement.

  Some of what I think belongs on that list, for you to accept, reject or reframe: it must say something usable about lineages with no known sex and about prokaryotes that swap genes sideways; about forms arranged in a chain around a barrier whose two ends meet and do not interbreed, and about cases where the ends do interbreed freely; about new lineages created in a single generation by whole-genome duplication; about organisms like lichens, where the named thing is a consortium of a fungus and a photosynthetic partner, and the same fungus can turn up with different partners; about the continuum of fossils, where boundaries look like artifacts of where we slice; about domesticated forms and their wild relatives that remain fully interfertile; and about the fact that most of the taxa on my list will never have a genome sequenced, only a photograph, a specimen and perhaps a barcode region, so the account has to be usable under severe evidential poverty and has to say what to do when the evidence runs out.

  I also want your view on three things the criteria themselves turn on. First, which of these demands are genuine adequacy conditions and which are prejudices of one constituency — the metaphysician wanting natural kinds with essences, the phylogenetics camp wanting monophyly, the field naturalist wanting something decidable with a hand lens, the practitioner wanting a number that does not move. Second, which pairs of requirements you think cannot be jointly satisfied, and which one of each pair you would keep: I suspect, for instance, that asking for a unit whose counts mean the same thing across fungi, insects, birds and bacteria is in tension with asking the account to be faithful to the causal structure of each clade, and that demanding stability under future revision is in tension with demanding that the list track new evidence. Third, whether the specification should include a requirement that the metaphysical question of what species are be separable from the practical question of which taxa to list — whether that separability is a real desideratum or a way of giving up on the problem I actually have.

  Then, briefly, and only as a check on the criteria rather than as the main deliverable: how the familiar families of account fare against the list — the interbreeding-based one, the diagnosable-smallest-cluster and monophyly-based ones, the ecological or genotypic-cluster pictures, the general-lineage view, and outright pluralism — and which single requirement does the most work in excluding them. Please do not give me a reading list or a bibliography; I can find those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A board member of a small land trust managing mixed habitats (woodland, fen, grazing). They are responsible for the reserve's species list.
      *   **Problem:** The "species count" varies wildly (by ~1/3) depending on the checklist used, not due to new fieldwork but due to conceptual disagreements about what constitutes a species. This affects grants, management plans, and legal obligations.
      *   **Task:** Provide a *specification* (desiderata) for an account of species that would serve as a trustworthy backbone for this list.
      *   **Constraints:**
          *   Write out desiderata with the case/consideration behind each (not just a list).
          *   Address specific biological phenomena mentioned (asexuals, prokaryotes, ring species, polyploidy, lichens, fossils, domesticates, evidential poverty).
          *   Address three meta-questions: Adequacy vs. Prejudice, Incompatible Requirements (trade-offs), and Separability of Metaphysics vs. Practice.
          *   Briefly evaluate familiar species concepts against the criteria (check only, not main deliverable).
          *   **NO** reading lists or bibliographies.
      *   **Tone:** Professional, precise, philosophical but grounded in practical conservation management. The user is sophisticated ("conceptual one," "metaphysician," "monophyly").

  2.  **Deconstruct the Desiderata (The Specification):**
      *   The user provided a list of phenomena to accommodate. I need to turn these into requirements.
      *   *Requirement 1: Operational Decidability.* (Addressing "evidential poverty," "hand lens"). Conservation needs action *now*.
      *   *Requirement 2: Causal/Process Faithfulness.* (Addressing "lineages," "prokaryotes," "asexuals"). The unit must reflect biological reality, not just human convenience.
      *   *Requirement 3: Stability vs. Responsiveness.* (Addressing "number that does not move" vs. "track new evidence"). Legal/Grant stability vs. Scientific accuracy.
      *   *Requirement 4: Cross-Taxonomic Consistency (or explicit inconsistency).* (Addressing "fungi, insects, birds, bacteria"). Can we use one definition for all?
      *   *Requirement 5: Holobiont/Composite Accommodation.* (Addressing "lichens"). Some "species" are ecosystems.
      *   *Requirement 6: Temporal Continuity.* (Addressing "fossils," "domesticates"). How do we handle time and artificial selection?

  3.  **Address the Meta-Questions:**
      *   *Adequacy vs. Prejudice:* Distinguish between what is needed for the *job* (conservation management) vs. what is needed for *ontological purity*.
      *   *Incompatible Pairs:* Identify the tensions. Stability vs. Accuracy. Universality vs. Clade-Specificity.
      *   *Separability:* Is the metaphysics/practice split real? For a land trust, practice *is* the metaphysics because the law binds to the list.

  4.  **Evaluate Species Concepts (Briefly):**
      *   Biological Species Concept (BSC): Fails on asexuals, fossils, lichens.
      *   Phylogenetic Species Concept (PSC): Good for monophyly, bad for stability (lumping/splitting), hard with poor data.
      *   Ecological/Genotypic Cluster: Good for practical ID, maybe vague on boundaries.
      *   General Lineage: Good metaphysics, bad operationalization.
      *   Pluralism: Honest, but administratively nightmarish for a single list.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the gravity. This isn't just philosophy; it's legal and financial.
      *   **Part 1: The Specification (Desiderata):**
          *   *D1: Operational Decidability under Evidential Poverty.* (Why: You can't sequence everything. Need to manage *now*.)
          *   *D2: Process Faithfulness (The Causal Constraint).* (Why: If it doesn't track evolutionary independence, protection is arbitrary.)
          *   *D3: Administrative Stability.* (Why: Grants and laws need fixed targets.)
          *   *D4: Cross-Clade Comparability (with caveats).* (Why: You need a total count, but biology differs.)
          *   *D5: Composite Entity Accommodation.* (Why: Lichens are real conservation targets.)
          *   *D6: Temporal Continuity.* (Why: Fossils and domesticates exist in the landscape history.)
      *   **Part 2: The Meta-Analysis:**
          *   *Adequacy vs. Prejudice:* Stability is a practical need, not a biological truth. Monophyly is a biological ideal, not always practical.
          *   *Incompatible Pairs:* Stability vs. Accuracy (Keep Stability for the list, Accuracy for the science). Universality vs. Faithfulness (Keep Faithfulness, allow different criteria for bacteria vs. birds).
          *   *Separability:* Reject separability. For conservation, the ontology *is* the practice. The law makes the metaphysics real.
      *   **Part 3: Concept Evaluation:**
          *   BSC: Fails D1, D2 (asexuals).
          *   PSC: Fails D3 (too unstable).
          *   Pluralism: Fails D4 (administrative chaos).
          *   Winner? None perfect. A "Pragmatic Lineage" hybrid is needed.

  6.  **Refining and Polishing:**
      *   *Check against constraints:* Did I include the specific cases (ring species, polyploidy, etc.)? Yes, weave them into the Desiderata.
      *   *Tone Check:* Ensure it sounds like a specification document, not a textbook summary. Use "Must," "Shall," "Requirement."
      *   *Specific User Points:*
          *   "Lineages with no known sex": Address in Process Faithfulness.
          *   "Prokaryotes": Address in Cross-Clade.
          *   "Ring species": Address in Boundary conditions.
          *   "Polyploidy": Address in Instant Lineages.
          *   "Lichens": Address in Composite Entities.
          *   "Fossils/Domesticates": Address in Temporal Continuity.
          *   "Evidential Poverty": Address in Operational Decidability.
      *   *Meta-questions:* Ensure the trade-offs are explicit.
      *   *No Bibliography:* Strictly enforced.

  7.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe suggest Pluralism is the best answer.
      *   *Correction:* No, the user needs a *single list* for legal/grant purposes. Pluralism makes the count unstable. I need to recommend a framework that *manages* pluralism, not one that embraces it fully for the list.
      *   *Initial thought:* Treat metaphysics and practice as separate.
      *   *Correction:* The user explicitly asked if separability is a desideratum. Given the legal context ("protection... attaches to whatever the official list names"), I must argue they are *not* separable here. The list *creates* the reality for the trust.
      *   *Refining the "Stability" point:* Stability shouldn't mean ignoring science. It means a protocol for *when* to update. I need to specify that.

  8.  **Final Review:** Does this answer the prompt's demand for a "specification rather than a survey"? Yes, by framing points as requirements with justifications. Does it answer the three meta-questions? Yes. Does it evaluate the concepts briefly? Yes.

  **(Self-Correction on Tone):** The user is sophisticated. Avoid talking down. Use precise terminology (monophyly, operability, ontological commitment).

  **(Final Polish):** Ensure the distinction between the *concept* (what a species is) and the *criterion* (how we identify it) is clear, as this is central to the "evidential poverty" problem.

