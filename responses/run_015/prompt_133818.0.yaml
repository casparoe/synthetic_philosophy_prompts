answer: |-
  This specification is drafted for the purpose of conservation governance, where the ontology of the "species" determines legal liability, funding eligibility, and management intervention. It prioritizes the functional integrity of the reserve over ontological purity, while refusing to adopt definitions that contradict established biological mechanisms.

  ### Part I: Specification of Desiderata

  **Requirement 1: Operational Decidability under Evidential Poverty**
  *   **The Specification:** The account must provide a decision procedure for assigning an organism to a unit using evidence typically available to a land trust (morphology, location, limited barcoding) without requiring whole-genome sequencing or breeding experiments. It must specify a default protocol for when evidence is ambiguous (e.g., "lump rather than split" or vice versa).
  *   **The Consideration:** Most taxa on your list will never be sequenced. If the definition of a species requires data you cannot obtain, the definition is operationally null. A conservation list cannot wait for perfect phylogenetic resolution; it must act on the best available proxy. If the account cannot distinguish Unit A from Unit B with a hand lens or a standard barcode, it cannot guide patrol routes or grazing plans.

  **Requirement 2: Process Faithfulness (The Causal Constraint)**
  *   **The Specification:** The unit must correspond to a distinct evolutionary lineage or ecological function that persists independently of the observer. The account must accommodate asexual lineages, prokaryotes with horizontal gene transfer, and instant speciation via polyploidy without forcing them into a sexual mold.
  *   **The Consideration:** If the unit is purely arbitrary, protecting it protects nothing real. You must be able to protect a lineage of bdelloid rotifers (asexual) or a polyploid plant population that arose in one generation. An account that defines species *only* by interbreeding potential fails here, as it renders these real, distinct biological entities invisible. The definition must track the *cause* of distinctness (selection, drift, isolation), not just one *symptom* (reproductive isolation).

  **Requirement 3: Administrative Stability with Revision Protocols**
  *   **The Specification:** The account must yield a count that remains stable over funding cycles (3–5 years) unless specific, high-threshold criteria for revision are met. It must distinguish between "taxonomic uncertainty" (we don't know) and "ontological flux" (the lineage is merging/splitting).
  *   **The Consideration:** Your grants and legal obligations rely on a fixed number. If the species count shifts by 30% every time a new paper is published, management planning becomes impossible. However, the list cannot be fossilized. The specification must include a governance rule for *when* a taxonomic change triggers a management change (e.g., only when monophyly and ecological distinctness are both confirmed), decoupling scientific debate from administrative targets.

  **Requirement 4: Composite and Holobiont Accommodation**
  *   **The Specification:** The account must allow for named units that are stable consortia of distinct genomes (e.g., lichens) where the conservation value lies in the association, not just the fungal partner.
  *   **The Consideration:** In lichens, the "species" is an ecosystem. If you protect the fungus but not the alga, or if you treat the lichen as merely the fungus, you may lose the functional unit. The definition must permit the "species" rank to apply to a stable ecological interaction, not just a single gene pool, provided that interaction is heritable and distinct.

  **Requirement 5: Boundary Handling for Continua**
  *   **The Specification:** The account must provide a rule for ring species, hybrid zones, and domesticates. It must specify whether the ends of a ring are one species or two based on the management goal (preserving the process vs. preserving the endpoints).
  *   **The Consideration:** Nature offers continua; law requires binaries. In a ring species, the ends may not interbreed, but are connected by gene flow. In domesticates (e.g., wild vs. cultivated relatives), interfertility is high but ecological roles differ. The specification must state whether you are conserving *gene pools* (which might suggest lumping) or *ecological roles* (which might suggest splitting). For a land trust, ecological role usually trumps genetic potential, but this must be explicit.

  **Requirement 6: Temporal Continuity**
  *   **The Specification:** The account must be applicable to the fossil record and historical baselines to the extent that it allows for the identification of "loss" without requiring DNA from extinct specimens.
  *   **The Consideration:** Management plans often reference historical baselines. If your species concept works only for extant, sequenced organisms, you cannot measure decline against the past. The definition must allow morphological proxies to stand in for lineage identity when time precludes other evidence.

  ---

  ### Part II: Meta-Analysis of the Criteria

  **1. Adequacy Conditions vs. Constituency Prejudices**
  *   **Adequacy:** *Operational Decidability* and *Process Faithfulness* are genuine adequacy conditions. Without decidability, you cannot act; without faithfulness, your action is biologically meaningless.
  *   **Prejudice:** *Administrative Stability* is a prejudice of the practitioner, not biology. Biology is dynamic; the demand for a static number is an artifact of bureaucracy. However, in your context, it is a *necessary* prejudice. *Cross-Clade Comparability* (wanting "species" to mean the same thing for bacteria and birds) is a prejudice of the accountant. Biologically, there is no reason to expect a single ontological cut to work for clonal bacteria and sexual vertebrates. You should reject the demand for semantic uniformity across kingdoms in favor of functional uniformity (i.e., "a unit worthy of independent management").

  **2. Incompatible Requirements and Trade-offs**
  *   **Stability vs. Accuracy:** You cannot have a list that is perfectly faithful to new phylogenetic evidence and perfectly stable for grants.
      *   *Resolution:* Prioritize **Stability** for the official list, but maintain a "watch list" for emerging splits. Adopt a "lag policy": no taxonomic change is adopted for management purposes until it has been stable in the literature for a set period (e.g., 5 years).
  *   **Universality vs. Faithfulness:** You cannot have a single definition that fits prokaryotes (horizontal gene transfer) and mammals (sexual reproduction) without doing violence to one.
      *   *Resolution:* Prioritize **Faithfulness**. Adopt a "Modular Concept." Use a Phylogenetic/Lineage definition for vertebrates and plants, but a Genotypic/Cluster definition for bacteria and fungi. The *label* "Species" is the same, but the *criteria* differ by clade. This violates the desire for a single metaphysical essence but saves the biological reality.

  **3. Separability of Metaphysics and Practice**
  *   **Verdict:** The separability is **false** in your context.
  *   **Reasoning:** In pure science, one can argue about what a species *is* while agreeing on how to label specimens for a museum. In conservation law, the list *constitutes* the reality. If the law protects "Species X," and taxonomists split X into Y and Z, the legal protection may vanish or duplicate. The metaphysical question (what is the unit?) determines the practical outcome (what do we protect?). You cannot outsource the metaphysics to the scientists and keep the practice pure. You must adopt a "Legal-Operational Ontology": a species is whatever unit the trust resolves to manage as an independent entity, constrained by biological reality but finalized by governance.

  ---

  ### Part III: Evaluation of Familiar Accounts

  **Biological Species Concept (Interbreeding)**
  *   **Fails:** Requirement 2 (Asexuals/Prokaryotes), Requirement 5 (Domesticates/Fossils).
  *   **Exclusion Factor:** It cannot handle organisms that do not reproduce sexually. It renders a third of your potential list (fungi, bacteria, asexual plants) ontologically invisible.

  **Phylogenetic Species Concept (Monophyly/Diagnosability)**
  *   **Fails:** Requirement 1 (Evidential Poverty), Requirement 3 (Stability).
  *   **Exclusion Factor:** It is too sensitive to new data. Every new sequence can split a population, causing your species count to inflate uncontrollably, breaking grant metrics. It also requires data you do not have.

  **Ecological/Genotypic Cluster**
  *   **Fails:** Requirement 2 (Process Faithfulness) in edge cases.
  *   **Exclusion Factor:** It identifies clusters but does not guarantee they are evolving independently. It risks protecting ephemeral morphs rather than lineages.

  **General Lineage Concept**
  *   **Fails:** Requirement 1 (Operational Decidability).
  *   **Exclusion Factor:** It is a metaphysical placeholder, not an operational tool. It tells you a species is a "lineage," but not how to find the boundaries without further criteria.

  **Outright Pluralism**
  *   **Fails:** Requirement 3 (Administrative Stability/Consistency).
  *   **Exclusion Factor:** While biologically honest, it is administratively fatal. You cannot submit a grant application stating, "We are protecting 500 units, but 200 are BSC species, 200 are PSC units, and 100 are ecological morphs."

  **Conclusion on the "Single Requirement" that Excludes Most:**
  **Operational Decidability under Evidential Poverty.**
  This is the filter that removes the most sophisticated theoretical accounts. Most concepts assume access to data (breeding trials, full phylogenies) that a land trust will never possess. The only viable account is a **Pragmatic Lineage Concept**: *A species is the smallest distinct lineage that can be consistently identified with available field evidence and warrants independent management.* This sacrifices metaphysical precision for the ability to actually do the work.
