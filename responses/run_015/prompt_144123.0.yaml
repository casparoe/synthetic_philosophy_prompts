answer: |-
  Here is the audit you asked for. I have broken your friend's summary into its constituent propositions, evaluated them against the current state of the literature (distinguishing between the core Predictive Processing framework and the broader Free Energy Principle), and then addressed your specific philosophical worries.

  ### Part I: Claim-by-Claim Audit

  **1. Claim:** *The brain is sealed inside a dark, silent skull and never touches the world, only its own neural activity, so everything you experience is a construction.*
  *   **Verdict:** Defensible simplification, but risks dualism.
  *   **Audit:** This is the standard "interface" rhetoric (e.g., Hoffman, Hohwy). It is accurate that the brain only has access to transduced signals, but saying it "never touches the world" can misleadingly suggest a Cartesian theater. The nearest true claim is: *The brain is causally coupled to the world but epistemically isolated from it, relying on inference to bridge the gap.*

  **2. Claim:** *The cortex runs a generative model of the causes of its input, sends predictions down the hierarchy, and receives back only what the predictions failed to anticipate, weighted by how precise the prediction is.*
  *   **Verdict:** Accurate.
  *   **Audit:** This is the canonical architectural description of hierarchical predictive processing. It correctly identifies the direction of flow (predictions down, errors up) and the role of precision weighting.

  **3. Claim:** *Precision is just attention under a technical name.*
  *   **Verdict:** Conflation of mechanism and function.
  *   **Audit:** Precision *weighting* is the mathematical mechanism by which attention is *implemented*, but they are not identical concepts. Precision refers to the inverse variance (reliability) of a signal; attention is the functional selection of that signal. The nearest true claim is: *Attention is the functional consequence of optimizing precision weights on prediction errors.*

  **4. Claim:** *Perception is therefore controlled hallucination: the brain guesses first and lets the world edit.*
  *   **Verdict:** Defensible simplification (Slogan).
  *   **Audit:** This is Anil Seth's and Andy Clark's preferred gloss. It is rhetorically effective but can be read as implying perception is *false*. The nearest true claim is: *Perception is a hypothesis-testing process where prior expectations are constrained by sensory evidence.*

  **5. Claim:** *Free energy is just the technical word for surprise.*
  *   **Verdict:** Wrong (Technical Error).
  *   **Audit:** This is a common misunderstanding. Variational Free Energy is an *upper bound* on surprise (negative log model evidence), not surprise itself. The system minimizes the bound because it cannot access surprise directly. The nearest true claim is: *Free energy is a tractable proxy that, when minimized, implicitly minimizes surprise.*

  **6. Claim:** *There are exactly two ways to do that [minimize surprise], namely change your predictions to fit the world (perception), or change the world to fit your predictions (action).*
  *   **Verdict:** Accurate (within Active Inference).
  *   **Audit:** This correctly captures the duality of Active Inference. Perception updates the model; action samples data to make the model true.

  **7. Claim:** *That's active inference, and it's the same computation running in opposite directions, which is why perception and action turn out to be one phenomenon.*
  *   **Verdict:** Overstatement of a modest thesis.
  *   **Audit:** While both minimize free energy, they operate on different variables (internal states vs. external states). Calling them "one phenomenon" is a strong unification claim that many proponents accept formally but reject functionally. The nearest true claim is: *Perception and action are coupled processes serving the same objective function.*

  **8. Claim:** *The Bayesian part isn't a metaphor either — neurons literally encode probability distributions and apply Bayes' rule.*
  *   **Verdict:** Contested (Implementation vs. Description).
  *   **Audit:** This is the "literalism" fault line. Most careful proponents argue the brain *implements* Bayesian inference, not that it literally calculates probabilities using the Bayesian formula. Neurons encode parameters (mean, variance), not full distributions in a symbolic sense. The nearest true claim is: *Neural dynamics can be mathematically described as if they were performing Bayesian inference.*

  **9. Claim:** *Any system that manages to stay alive... must thereby minimize its free energy, and that isn't an empirical claim you could go out and refute; it follows from the system's having a Markov blanket.*
  *   **Verdict:** Contested (Tautology Charge).
  *   **Audit:** This is the biggest fault line in the field. Critics argue this makes FEP unfalsifiable (a tautology). Proponents argue it is a mathematical necessity for non-equilibrium steady states. Claiming it is *not* an empirical claim is dangerous; if it explains everything, it explains nothing. The nearest true claim is: *FEP posits that self-organizing systems must resist disorder, which can be mathematically modeled as free energy minimization.*

  **10. Claim:** *Once you see that internal states are tracking the causes of their own sensory states, there's no leftover hard problem — what it is like to be you just is that inference.*
  *   **Verdict:** Overstatement (Philosophical Speculation).
  *   **Audit:** This is a category error. Explaining the *function* of inference does not explain the *ontology* of experience (qualia). This is a "dissolution" strategy, not a solution. The nearest true claim is: *PP offers a compelling account of the structural contents of consciousness, but not necessarily its phenomenal character.*

  **11. Claim:** *A thermostat is already doing a crude version of the same thing, and the only difference between it and you is how deep the inference goes.*
  *   **Verdict:** Conflation of Regulation and Inference.
  *   **Audit:** This conflates homeostatic control with generative modeling. A thermostat reacts to error; it does not model the *causes* of the error. The nearest true claim is: *Simple homeostatic systems can be described under FEP, but they lack the hierarchical generative models required for belief.*

  **12. Claim:** *Since minimizing free energy requires the model to be tight rather than true, the brain should be perfectly willing to confabulate, so most of what you consciously experience should be a useful fiction.*
  *   **Verdict:** Defensible simplification (with caveats).
  *   **Audit:** "Tight rather than true" is a specific interpretation (Hohwy). However, a model that is too wrong leads to high surprise (death). The brain must be accurate enough to survive. The nearest true claim is: *The brain optimizes for adaptive accuracy, which may diverge from objective truth in service of survival.*

  **13. Claim:** *Dark Room Reply: The organism's own model already encodes that it shouldn't be in a dark room, so of course it doesn't go there.*
  *   **Verdict:** Accurate (but question-begging).
  *   **Audit:** This is the standard answer, but it pushes the explanatory burden onto the origin of the priors. The nearest true claim is: *Avoidance of the dark room is explained by high-level priors favoring homeostatic states, which must be acquired or evolved.*

  ---

  ### Part II: The Three Extra Conclusions

  **1. That the Hard Problem dissolves.**
  *   **Does it follow?** No. This conclusion relies on Claim 10, which we flagged as an overstatement. PP explains the *informational geometry* of experience (how content is structured), but it remains neutral on why that geometry feels like *something*. A philosopher of mind would say PP solves the "easy problems" (reportability, integration, access) but leaves the "hard problem" (phenomenality) untouched unless you adopt a specific identity theory that equates inference with feeling, which is not entailed by the math.

  **2. That a thermostat has beliefs in the same sense we do.**
  *   **Does it follow?** No. This relies on Claim 11 (Conflation). While FEP can mathematically describe a thermostat, "belief" in the cognitive science sense requires a generative model that separates *self* from *cause* and allows for counterfactuals. A thermostat has a set-point, not a model of the world. This conclusion is only supported if you accept the most radical, panpsychist-leaning interpretation of FEP, which is a minority view even among proponents.

  **3. That the framework predicts pervasive confabulation.**
  *   **Does it follow?** Partially, but dangerously. This relies on Claim 12. While PP predicts perception is *constructive*, it does not predict it is *false*. In fact, FEP argues that to minimize long-term surprise, the model must align with environmental statistics. If the model is a "fiction" that consistently fails prediction, free energy rises. The framework predicts *adaptive* representation, not necessarily confabulation, unless you define "confabulation" as "any construction not identical to the thing-in-itself."

  ---

  ### Part III: The Content Worry (Teleosemantics vs. PP)

  You are right to be worried. From your teleosemantics standpoint, PP offers a **structural** account of representation without a **normative** account of content.

  *   **The Problem:** PP tells us that internal states *covary* with external causes and minimize error. But covariance is not content (the sun covaries with my retinal state, but my retina isn't *about* the sun in a semantic sense). Teleosemantics solves this by appealing to proper function (evolutionary history). PP often treats "belief" and "prediction" as honorifics for "states that minimize error."
  *   **Does Markov Blanket help?** No. The Markov Blanket defines the *boundary* of the system (what is inside vs. outside), but it does not ground the *aboutness* of the internal states. A system can have a blanket and minimize energy without having semantic content (e.g., a flame).
  *   **The Synthesis:** The most robust position in the literature is that PP needs teleosemantics. PP explains *how* the representation is processed (the mechanics); teleosemantics explains *why* those states have truth conditions (the norms). Without the teleological layer, PP is instrumentalism: the brain acts *as if* it has beliefs, but there is no fact of the matter about what those beliefs are *about* other than their causal role.
  *   **Verdict:** If you accept her claim about Markov Blankets alone, you get a theory of self-organization, not a theory of meaning. To get content, you must import a theory of function (like yours).

  ---

  ### Part IV: The Dark Room Objection

  **Is her reply a dodge?**
  It is the *standard* reply, but it is incomplete. It answers *how* an agent avoids the dark room (by having priors against it), but it fails to answer *why* the agent has those priors.

  **The Strongest Surviving Objection:**
  The **"Origin of Priors" Objection**.
  If the imperative is simply "minimize free energy," nothing in the mathematics dictates *which* priors a system should have. A system could theoretically have priors that say "I am dead," and then minimize free energy by dying (which is a very low-surprise state for a dead system). To explain why organisms seek food, light, and complexity rather than death, FEP must appeal to **evolutionary history**.
  *   *The Dodge:* "The priors encode survival."
  *   *The Counter:* "Then evolution, not FEP, is the explanatory heavy lifter."
  FEP describes the *mechanism* of regulation, but Evolution explains the *goal* of that regulation. Your friend's reply treats the priors as given, but their existence is the real puzzle.

  ---

  ### Part V: Safe vs. Unsafe Claims for a Seminar Paper

  **Safe to Repeat (High Consensus):**
  1.  *"Predictive Processing posits that the brain minimizes prediction error by updating a hierarchical generative model."* (This is the core cognitive thesis, distinct from the physics-heavy FEP).
  2.  *"In Active Inference, action is understood as sampling sensory data to fulfill predictions."* (This is the standard definition of the perception-action loop in this framework).
  3.  *"Precision weighting modulates the influence of prediction errors, functionally resembling attention."* (This captures the mechanism without conflating the terms).

  **Definitely Do Not Repeat (High Risk of Criticism):**
  *   *"Free Energy is identical to surprise."*
      *   **Why:** This is technically false (FE is an upper bound). A knowledgeable examiner will flag this immediately as a misunderstanding of the variational calculus.
      *   **Alternative:** *"Free Energy is an upper bound on surprise that the system minimizes."*

  **Honorable Mention (Use with Caution):**
  *   *"Perception is controlled hallucination."*
      *   **Why:** It's a slogan, not a definition. It's fine in an intro, but in a technical argument, it invites confusion about truth-conditions. Use "constructive inference" instead.

  ### Summary Advice
  Your friend is conflating the **mathematical formalism** (FEP), the **cognitive architecture** (PP), and the **philosophical interpretation** (Active Inference/Panpsychism). She is treating the most speculative metaphysical extensions as settled empirical facts. As a teleosemanticist, you are well-positioned to point out that while PP describes the *vehicle* of representation beautifully, it requires a theory like yours to ground the *content*. Don't let her sell the "Hard Problem dissolution" as a result of the math; it is a philosophical add-on.
