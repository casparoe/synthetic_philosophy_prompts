answer: |-
  You have hit on one of the most famous and frustrating tensions in metaphysics, and your observation about the rhetorical "switch" is spot on.

  There isn't one single magic word that captures exactly "switching criteria opportunistically to preserve intuition," but there are several established concepts that slice up different parts of what you're describing.

  Here is the breakdown of the terms, the fallacy, and how to tell the difference between a "principled system" and an "escape hatch."

  ### 1. The Philosophical Terms (The Two Views)
  First, just to validate your mapping:
  *   **Way One (Continuous Line):** Philosophers call this **Spatio-Temporal Continuity**. It argues that an object persists if there is an unbroken path through space and time, regardless of material change.
  *   **Way Two (Important Pieces):** This is usually **Constitutionalism** (same parts) or **Psychological Continuity** (same memories/personality).

  ### 2. The Rhetorical Move: What do you call the switching?
  When someone uses Continuity to save the Ship of Theseus but switches to Constitution to kill the Teleporter, they are engaging in a few specific things:

  **A. Special Pleading (The Logical Fallacy)**
  This is the closest formal logical term. Special Pleading occurs when someone applies a standard, rule, or principle to other cases but makes an exception for a specific case without providing a relevant difference that justifies the exception.
  *   *The Move:* "Continuity is the rule for identity."
  *   *The Exception:* "Unless it's a teleporter, then material destruction matters."
  *   *The Problem:* If they cannot explain *why* continuity matters for wood but not for humans, it is special pleading.

  **B. Motivated Reasoning (The Psychological Mechanism)**
  This is the cognitive science term. It describes when we decide on the *conclusion* first (e.g., "Teleportation feels like death," "Ship repair feels like the same ship") and then work backward to find the premise that supports it.
  *   You aren't using the rule to find the truth; you are shopping for a rule that validates your gut feeling.

  **C. Ad Hoc Rescue (The Methodological Sin)**
  In philosophy of science, this is when you modify a hypothesis solely to save it from being falsified, without adding any new predictive power.
  *   If your theory of identity is "Continuity," and the Teleporter case falsifies it, adding "...unless the original is destroyed" is an *ad hoc* modification. It saves the theory but makes it clunkier and less universal.

  **D. Conceptual Gerrymandering**
  This is a more colloquial but precise term used in analytic philosophy. It refers to drawing the boundaries of a concept (like "Self" or "Same") in an irregular, jagged way specifically to include the cases you want and exclude the ones you don't, rather than following a smooth, natural line.

  ### 3. Is it just Equivocation?
  You asked if this is **Equivocation**. It is related, but distinct.
  *   **Equivocation** is using the *same word* with two different meanings in the *same argument* (e.g., "A feather is light. What is light cannot be dark. Therefore a feather cannot be dark.").
  *   **What you are describing** is **Inconsistent Application of Criteria** across *different cases*.

  However, there is a specific type of equivocation happening on the word **"Same."**
  *   **Numerical Identity:** Is it *one and the same object*? (The Ship)
  *   **Qualitative Identity:** Is it an *exact duplicate*? (The Teleporter Copy)
  People often equivocate between these two. They demand Numerical Identity for the Ship (it's the *one* ship) but accidentally judge the Teleporter on Qualitative Identity (it's just a *copy*), then switch back when called out.

  ### 4. The Charitable View: Is there a "Principled System"?
  You asked: *How would you draw the line between that and someone who genuinely thinks both rules work together in one principled system?*

  This is the crucial distinction. There **is** a legitimate philosophical position that looks like switching but isn't fallacious. It is called the **Cluster Concept** or **Prototype Theory** of identity (influenced by Wittgenstein).

  **The "Cluster" Argument:**
  This view holds that "Identity" isn't a binary switch defined by one necessary condition. Instead, it is a weighted cluster of features (Continuity, Material, Memory, Function).
  *   **Principled System:** "I weigh Continuity at 60% and Material at 40%. In the Ship case, Continuity wins. In the Teleporter case, Material destruction is so total it outweighs the Continuity of information."
  *   **Escape Hatch:** "It's the same ship because continuity! ... Wait, it's not the same person because material! ... Why? Because... uh... context."

  **How to tell the difference (The Falsifiability Test):**
  To determine if someone is being principled or opportunistic, ask them to apply their weighted system to a **novel case** they haven't formed an intuition about yet.

  *   *The Test:* "Okay, if we slowly replace your neurons with silicon chips one by one over 10 years (Continuity high, Material low), are you still you?"
  *   *The Principled Thinker:* Will apply their weights consistently. If they value Continuity, they say "Yes." If they value Material, they say "No."
  *   *The Opportunist:* Will pause, check their gut feeling ("That sounds scary"), and then adjust the weights to match the fear.

  ### 5. The "Nuclear Option" (Derek Parfit)
  If you want to read one philosopher who basically agreed with your entire observation and solved it by blowing up the question, look up **Derek Parfit** and his book *Reasons and Persons* (specifically the section on the Teletransportation Paradox).

  Parfit argues that **Identity is not what matters.**
  He suggests that people get stuck in this loop because they assume there *must* be a "Yes/No" answer to "Is it the same person?"
  Parfit argues:
  1.  In the Teleporter case, Relation R (psychological continuity) exists.
  2.  But Personal Identity does not.
  3.  Therefore, Identity is not what matters for survival.

  He essentially calls out the "switching" pattern you noticed and says it happens because we are asking the wrong question. We want to know "Will I survive?" but we ask "Is it me?" When the answer to "Is it me?" is fuzzy, we panic and switch rules. Parfit says: accept the fuzziness.

  ### Summary
  *   **The Pattern:** Inconsistent application of persistence conditions.
  *   **The Fallacy:** Special Pleading / Motivated Reasoning.
  *   **The Slang:** Conceptual Gerrymandering.
  *   **The Legitimate Alternative:** Cluster Concept Theory (weighted features).
  *   **The Test:** Ask them to judge a *new* scenario before they have time to check their gut intuition. If their rule changes to match the new gut feeling, it's an escape hatch. If they stick to the rule even if it gives a counter-intuitive result, it's a principled system.
