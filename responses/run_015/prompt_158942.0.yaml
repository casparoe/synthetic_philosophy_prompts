answer: |-
  **OFFICE FOR PHENOMENAL INTEGRATION**
  **OPERATIONAL DIRECTIVE 74-B (REV. 9)**
  **SUBJECT: HANDLING OF COMPOSITIONAL ANOMALIES**

  1.  **Distinction of Files.** Caseworkers must distinguish between Qualitative Fusion and Subjective Unification. Applications regarding the blending of micro-qualities (e.g., how microscopic redness contributes to macroscopic pinkness) are processed under Standard Colour Protocols. Files regarding the unification of micro-subjects into a single macroscopic viewpoint are classified as High Complexity. Do not assume difficulty in the former predicts difficulty in the latter. The merging of viewpoints is the primary jurisdiction of this Office; the merging of qualities is merely administrative.

  2.  **The Bonding Relation.** It is the standing ruling that the relation binding micro-subjects into a macro-subject is not itself experience-bearing. Applications for a second-order bond to unify the primary bond with the subjects are summarily refused. The bond is a structural necessity, not a phenomenal participant. Requests for forms regarding the "experience of binding" will be returned unstamped. Infinite regress is not a valid grounds for appeal.

  3.  **Introspective Opacity.** Citizens frequently petition to access the phenomenal states of their constituent micro-entities. These petitions are denied on the grounds of Resolution Limit. The macro-subject is not authorised to introspect the internal lives of its parts any more than a Ministry is required to publish the personal correspondence of its clerks. Funding for training programmes designed to enhance micro-introspection is discontinued. Ignorance of the parts is a feature of the whole, not a bug.

  4.  **Collection Eligibility.** Not every collection of micro-subjects entitles a group to a macroscopic subject. A brain qualifies; a crowd does not. Caseworkers determining boundary disputes must apply the Functional Cohesion Test. If the collection processes information as a unified system, a macro-subject is recognised. Do not attempt to explain why functional cohesion warrants phenomenal unity; this is a foundational axiom of the Act. Queries regarding the phenomenal status of rocks or storms are to be filed under "Inanimate Aggregates" and ignored.

  5.  **Phenomenal Bleed.** Reports of intrusive experiences—citizens claiming to undergo sensations that do not belong to the macro-self—are classified as Phenomenal Bleed. This occurs when micro-subjects fail to fully integrate. Caseworkers should advise citizens to treat these as background noise, analogous to tinnitus. Do not validate the claim that the experience belongs to a distinct subject within the citizen. There is only the registered macro-subject and the noise.

  6.  **Surgical Decomposition.** In cases of callosal surgery, a single registered subject may apply to be recognised as two. Such applications are granted provisionally. The Office recognises that physical separation can dissolve the bonding relation. Do not record this as the creation of new subjects, but as the revelation of prior latent divisions. Conversely, do not record it as the destruction of a subject. The registry must remain continuous even where unity is interrupted.

  7.  **The Cosmic Counter-Claim.** A minority of applicants operate under the Cosmopsychist amendment, positing a single cosmic subject divided into local units. These cases are handled symmetrically. Where the standard view struggles to combine many into one, the cosmic view struggles to divide one into many. Caseworkers should use the same forms, merely reversing the arrows on the diagram. The administrative burden is identical; the ontological direction is irrelevant to processing times.

  8.  **Prohibited Conclusions.** Caseworkers are reminded of the two non-compliant hypotheses. First, do not suggest that the macro-subject is a fundamentally new entity produced by the merger. This violates the Constitutive Principle. Second, do not suggest that the macro-subject is a fictional convenience and only the micro-subjects exist. This violates the Recognition Act. The macro-subject must be real, yet wholly constituted by the parts, without remainder and without elimination. Any file suggesting otherwise is to be escalated to Senior Management for reassignment.

  9.  **Consistency of Motive.** The purpose of this Office is to administer the truth that consciousness is fundamental at the micro-level. Solutions that preserve the doctrine by abandoning the constitution of the macro-subject undermine the Department's mandate. Solutions that preserve the macro-subject by abandoning the fundamentality of the micro-level transfer the budget to Emergence Division. We are neither. We are Integration.

  10. **Final Disposition.** If a case cannot be resolved within these parameters, do not conclude the theory is flawed. Conclude the data is incomplete. Close the file as "Pending Further Phenomenal Evidence."

  ***

  **Author's Note**

  The satire leans on the assumption that constitutive micropsychists consistently reject brute emergence and eliminativism, which is generally accurate but sometimes overstated; some allow a form of emergence compatible with fundamentality. The piece exaggerates the bureaucratic rigidity to highlight the theoretical patching. Regarding your guess: you have identified the two primary exempt parties correctly. The cosmopsychist avoids the combination problem entirely (facing only the "decombination" problem), and the eliminativist micropsychist denies the macro-subject exists to be combined. A third entitled reader might be the emergentist, who rejects the starting doctrine entirely, but they are outside the Office's jurisdiction. The satire targets those who want both fundamentality and constitution without cost.
