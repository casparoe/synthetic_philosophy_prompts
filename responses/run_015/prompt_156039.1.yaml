answer: |-
  **Title:** The Bounds of Construction
  **Setting:** A whiteboard in a university common room, late afternoon. Coffee stains on the table.
  **Characters:**
  *   **B:** Intuitionistic consultant (Brouwerian).
  *   **M:** Recursive consultant (Markovian).
  *   **Context:** A PhD student (you) is moderating a reading group on formalised constructive analysis. The team needs to finalise a library where proofs compile to code. The build system enforces a strict termination policy: every loop must have a computable bound derived from the proof.

  ***

  **B:** Right. Let's look at the requirements again. You need L1: $\neg(x=0) \to \exists y (xy=1)$. And L2: pointwise continuity implies uniform continuity on the unit interval. And your compiler—this "build system"—refuses to accept a termination argument unless it extracts to an explicit bound.

  **M:** Precisely. And that is why you must take my package. L1 is immediate. In my framework, $\neg(x=0)$ implies $x$ is apart from zero because we accept Markov's Principle (MP). If it is contradictory that $x$ is zero, then $x$ is non-zero. We can find the reciprocal.

  **B:** You can *find* it, yes. But can you *bound* the search? That is the constraint, is it not? Your MP asserts $\neg\neg\exists n P(n) \to \exists n P(n)$ for decidable $P$. The extracted programme for this is an unbounded search: `while (!P(n)) n++`. It is guaranteed to halt, you say, because $\neg\neg\exists$ holds. But where is the bound?

  **M:** The bound exists in the natural numbers. The search *will* terminate.

  **B:** But the build system does not ask if it *will* terminate. It asks for a function $f$ such that the loop halts in $f(input)$ steps. MP provides a metaphysical guarantee of halting, not a computable modulus of termination. Your proof of L1 compiles to code that your own build system should reject. It is exactly the sort of "we know it stops, but we don't know when" logic the team is trying to avoid.

  **M:** That is a bureaucratic objection, not a mathematical one. If the predicate is decidable and the existence is secure, the programme is constructive. To demand a bound *a priori* is to demand more than construction; it is to demand a specific kind of efficiency that mathematics does not always owe to engineering. If I tell you a train will arrive, and it does, does it matter that I could not tell you the minute of arrival at the station?

  **B:** It matters if you are building a library where proofs are programmes. If I cannot prove the bound, I cannot prove the programme is total in the system's sense. You are offering L1, yes, but at the cost of L2. You reject the Fan Theorem.

  **M:** I reject it because it is false. If one accepts Church's Thesis (CT)—that all functions from naturals to naturals are recursive—then the Fan Theorem fails. The Kleene tree provides a decidable bar that is not uniform. There exists a pointwise continuous function on $[0,1]$ that is not uniformly continuous. Your L2 is simply incorrect in my world.

  **B:** Your "world" restricts the notion of function to recursive indices. I am speaking of free choice sequences. For me, the Fan Theorem holds. A bar on the binary fan must be uniform. Consequently, L2 holds. I can give you the uniform continuity modulus. That *does* extract to a bound. The build system will accept L2 from me. But I cannot give you L1. I cannot accept MP.

  **M:** Why not? What is the positive reason to reject it? You offer weak counterexamples. You define a real number $x$ based on some open problem, show that $x=0$ implies the problem is solved, and conclude we cannot assert $x \neq 0$. But this only shows MP is not *derivable* from the Bishop core. It does not show MP is *false*. You cannot exhibit a decidable predicate $P$ where $\neg\neg\exists n P(n)$ is true but $\exists n P(n)$ is false.

  **B:** I do not need to exhibit a counter-instance to reject a principle. I need to show that the principle asserts more than is warranted by the meaning of the connectives. To assert $\exists n P(n)$ is to possess an $n$. To assert $\neg\neg\exists n P(n)$ is merely to assert that it is absurd that no such $n$ exists. MP asks us to bridge the gap between "it is absurd that we lack a witness" and "we have a witness". That is not a logical step; it is an empirical gamble.

  **M:** But in the context of the library, we are dealing with computable reals. If $x$ is a computable real and $\neg(x=0)$, then there is an algorithm that distinguishes $x$ from 0. MP just formalises the fact that if the algorithm for $x=0$ fails to halt, the algorithm for $x \neq 0$ must succeed.

  **B:** Let us test that with the diachronic case. The team defines $x = \sum 2^{-n} b_n$, where $b_n$ is 1 if an odd perfect number (OPN) $\le n$ exists, 0 otherwise. In 2026, we know $\neg(x=0)$ is not established, but suppose we assume the antecedent for the sake of L1. Actually, let's say we know $\neg(x=0)$ implies an OPN exists.
  In 2026, we assert the conditional: "If $\neg(x=0)$, then $x$ has a reciprocal."
  Your MP programme launches a search for an OPN. In 2026, it grinds. In 2033, an OPN is found. The programme halts.
  Did the programme construct the reciprocal in 2026?

  **M:** Yes. The code was valid in 2026. The fact that the runtime was long is irrelevant. The witness existed in the naturals; we just hadn't computed it yet.

  **B:** But in 2026, you could not distinguish the running programme from a non-terminating one. If no OPN exists, it grinds forever. In 2026, you did not know which case held. So in 2026, you did not possess a proof of termination. Does the discovery in 2033 retroactively validate the assertion in 2026?

  **M:** Truth is not hostage to our computational history. If the OPN exists, it exists timelessly. The programme was always a construction of the reciprocal; we were just ignorant of its halting time.

  **B:** And that is where we diverge. For me, truth is epistemic. In 2026, the assertion was not justified because the method was not certified as total. You are making provability dependent on future discoveries. If the library is to be certified *now*, your MP proofs are uncertified. They are placeholders for future knowledge.

  **M:** And your Fan Theorem is a placeholder for a notion of continuity that excludes computable functions! You are sacrificing L1 for L2, but L1 is essential for analysis. You cannot do analysis without reciprocals.

  **B:** We do analysis with apartness relations. We assume $x \# 0$, we do not derive it from $\neg(x=0)$.

  **M:** That cripples the library. The team wants to use standard hypotheses. They want to say "if $x$ is not zero" and get a reciprocal. They do not want to carry apartness proofs everywhere.

  **Moderator (You):** This brings us to the compromise proposal. Keep the Bishop core. Add MP and the Fan Theorem as axioms. Drop Church's Thesis and drop the Continuity Principles. Classically, this is consistent. It gives you L1 and L2. Why is this not the solution?

  **M:** Because it is incoherent computationally. If you add MP, you are leaning towards my recursive view. If you add the Fan Theorem, you are leaning towards hers. But MP + FT is inconsistent with CT and inconsistent with Continuity Principles. If you drop both CT and Continuity, what is the computational semantics of the library? You have classical validity without classical logic. You have axioms that extract to code (MP) and axioms that extract to bounds (FT), but they rely on incompatible views of what a "function" is. You are building a house on two different foundations.

  **B:** I agree with him, reluctantly. The compromise is the worst of both worlds. MP introduces unbounded search into the extraction. FT requires uniform bounds. If you accept both, you are admitting axioms that have no unified realisability interpretation. You are essentially doing classical mathematics but forbidding yourself from using LEM directly. It is honest classical maths that is dishonest about its computational content.

  **M:** Though I should mention, MP is admissible in Heyting Arithmetic. If the team is working in a system like HA, they can use the rule. If $\vdash \neg\neg\exists n P(n)$, then $\vdash \exists n P(n)$.

  **B:** Admissibility is external. It means if you have a proof of the premise, you can construct a proof of the conclusion. But the library needs the *implication* inside the logic to compose lemmas. They need to write functions that take a proof of $\neg(x=0)$ and return a reciprocal. Admissibility does not give them the function term inside the calculus. It gives them a meta-theoretic promise. The build system needs the term.

  **M:** Fair. But B, you must admit that your refusal of MP makes the library unusable for standard analysis. You force the user to prove apartness manually.

  **B:** And your acceptance of MP makes the library unsafe for the build system. You force the user to accept unbounded search without bounds.
  The disagreement is not merely intuition. It is about the ontology of the objects.
  For you, a real number is a Cauchy sequence of rationals with a recursive modulus. Existence is indexability.
  For me, a real number is a choice sequence. Existence is constructibility in time.
  Your MP assumes the natural numbers are "complete" in a way that allows search to succeed if failure is impossible. My view is that the natural numbers are open; we cannot assume a search succeeds just because it cannot fail, unless we have a bound.

  **M:** And your Fan Theorem assumes the continuum is "compact" in a way that recursive functions are not. You assume a uniform bound exists for choice sequences, which fails for recursive indices.
  So, where does that leave the team?

  **B:** They must choose what they value more: L1 or L2. Or they must change the build system.

  **M:** Or they must accept that "compiles to code" does not mean "compiles to *efficiently bounded* code". If they relax the build constraint to allow unbounded search where termination is provable (even without a bound), my package works for L1. They lose L2, but L2 is often manageable with moduli of continuity provided explicitly.

  **B:** If they relax the constraint, they risk non-termination in practice. A proof that halts "eventually" is indistinguishable from a bug in a large system. The Fan Theorem gives a bound. That is valuable engineering. But without MP, L1 is weak.
  Perhaps the compromise is the only way, but they must document the semantic fracture. They are using MP as a "classical axiom with computational content" and FT as a "constructive axiom with classical validity".

  **M:** It is a pragmatic salvage. But they must know: if they ever want to verify the code against a recursive model, FT will break it. If they verify against a choice sequence model, MP will break it. They are building a library that is sound in neither specific semantics, only in the intersection of classical logic and constructive syntax.

  **B:** Which is to say, they are doing Bishop mathematics but borrowing classical theorems where convenient, without the classical justification. It works until it doesn't.
  But to answer your original question: In 2026, the programme for the OPN was not a construction. In 2033, it becomes one. The truth value changes.

  **M:** And I maintain that in 2026, the programme was a construction, we just lacked the knowledge of its runtime. The truth value is stable; our knowledge changes.

  **B:** And there it is. You think truth is stable and knowledge is variable. I think truth is the idealisation of knowledge.
  For the team: If they want the build system to remain strict on bounds, they cannot use MP. They must drop L1 or strengthen the hypothesis to apartness. If they want L1 as stated, they must relax the build system to allow unbounded search. They cannot have both L1 (via MP) and the strict bound constraint.

  **M:** And they cannot have L2 (via FT) and my recursive semantics.
  So the compromise is: Bishop Core + MP + FT. Drop the strict bound constraint for MP-extractions. Drop the claim that all functions are recursive.
  It is a messy system. But it is the only one that gives them the lemmas.

  **B:** It is a messy system. But perhaps mathematics is messy when forced to compile.

  **M:** Indeed. Shall we tell them?

  **B:** We shall. But I am writing the disclaimer.

  **M:** And I will write the code.

  **B:** Naturally.
