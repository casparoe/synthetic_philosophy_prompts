answer: |-
  ### Theoretical Commitment

  I am selecting **Family 1: Mutual Responsiveness plus Commitment to Joint Activity** (the Bratman-style framework).

  **Why:** This is the only framework that cleanly separates your Case 1 (Agency) from your Cases 2 and 3 (Activists/Fans).
  *   **Case 1** is *not* a shared intention group. The operators do not know each other, they are not mutually responsive to each other, and they are not committed to the joint activity as partners; they are committed to a contract with a hidden principal. This is a **Single Will** masquerading as a plurality.
  *   **Cases 2 and 3** *are* shared intention groups (or loose movements). The participants are mutually responsive (they post because others post), they are committed to the joint activity (the hashtag, the review), and they support each other.
  *   **The Enforcement Cut:** Trust and Safety policy generally targets *inauthenticity* and *deception*, not *coordination* itself. A genuine shared-intention group (Fans/Activists) is authentic. A single-will network (Agency) is inauthentic. Family 1 allows us to prove the *structure of the agency* rather than guessing at the *morality of the goal*.

  **Extrapolation Warning:** Philosophical theory assumes agents are honest about their intentions. On a platform, agents lie. I am extrapolating the "Commitment" condition into an **"Evidence of Volition vs. Subordination"** test. Theory says "commitment"; I am translating that to "contractual obligation vs. social norm."

  ---

  ### The Agency Attribution Protocol (AAP)

  This is the decision procedure for your playbook. It is ordered. If a case fails a test, you stop and classify according to the failure reason. Do not proceed to the next test.

  **Goal:** Determine if the cluster represents a **Single Will** (Enforceable CIB), a **Shared Intention Group** (Organic/Policy Dependent), or **Convergence** (Organic/No Action).

  #### Test 1: The Channel Topology (Private vs. Public)
  *   **Question:** Is the coordination instruction transmitted via a restricted/private channel or a public/open broadcast?
  *   **Evidence:** DMs, private Groups/Channels, shared drives, leaked calendars vs. Public posts, open hashtags, press releases, verified public accounts.
  *   **Pass (Proceed to Test 2):** Evidence of **Private/Restricted Instruction**. (e.g., Invite-only Discord, Telegram channel, email chain, shared login).
  *   **Fail (Stop - Organic):** Instruction is **Public/Broadcast**. (e.g., "Everyone post at 6pm" on a public profile).
      *   *Verdict:* **Open Call / Pure Convergence.**
      *   *Rationale:* Public calls allow individual agency to accept or reject the signal without social penalty or contractual obligation. This clears Case 2.

  #### Test 2: The Feedback Loop (Verification vs. Expression)
  *   **Question:** Is there a mechanism requiring participants to report back, verify completion, or receive approval for their output?
  *   **Evidence:** Screenshots of posted content sent to admin, "task complete" buttons, payment release contingent on proof, rejection of content that doesn't match specs.
  *   **Pass (Proceed to Test 3):** Evidence of **Verification/Reporting**. (e.g., Operators must upload proof of post to get paid).
  *   **Fail (Stop - Organic):** Evidence of **Expression/Solidarity Only**. (e.g., Liking each other's posts, cheering in a chat, but no task verification).
      *   *Verdict:* **Loose Movement / Shared Intention Group.**
      *   *Rationale:* Mutual support without task verification indicates social commitment, not operational subordination. This clears Case 3.

  #### Test 3: The Incentive Structure (Extrinsic vs. Intrinsic)
  *   **Question:** What is the primary driver for participation?
  *   **Evidence:** Payment records, crypto transfers, employment contracts, threat of removal/ban from a community vs. Ideological alignment, fan identity, social clout, fun.
  *   **Pass (Proceed to Test 4):** Evidence of **Extrinsic/Contractual Reward**. (e.g., PayPal receipts, Upwork contracts, "get paid per post").
  *   **Fail (Stop - Organic):** Evidence of **Intrinsic/Social Reward**. (e.g., "For the cause," "For the team," karma points, no money trail).
      *   *Verdict:* **Shared Intention Group.**
      *   *Rationale:* Financial or contractual obligation subordinates individual agency to the principal. Social motivation retains individual agency.

  #### Test 4: The Concealment Check (Masking vs. Affiliation)
  *   **Question:** Are participants actively hiding their coordination or their affiliation?
  *   **Evidence:** Use of burner accounts, false location data, scripted denial of coordination ("I just happen to love this product"), reused assets stripped of metadata vs. Openly stating "I am part of [Group]," using official hashtags, profile bios linking to the movement.
  *   **Pass (Enforcement Recommendation):** Evidence of **Active Concealment**.
      *   *Verdict:* **Single Will / Coordinated Inauthentic Behavior.**
      *   *Rationale:* This confirms the "Inauthentic" part of CIB. The behavior is designed to mimic organic convergence while being centrally controlled.
  *   **Fail (No Enforcement):** Evidence of **Open Affiliation**.
      *   *Verdict:* **Shared Intention Group (Organic).**
      *   *Rationale:* Even if coordinated (Test 1 & 2 passed), if they are open about it, it is not *inauthentic*. This is a policy decision for the senior reviewer (e.g., is this a prohibited brigade?), but it is not CIB.

  ---

  ### The Status of Self-Description ("We-Language")

  **Your Boss:** "If they say 'we', it's a group."
  **My Procedure:** Self-description is **Corroborative, Not Constitutive.**

  **Rule:** Self-description counts as evidence *only if* it aligns with the structural evidence found in Tests 1–4.
  *   **Scenario A:** They say "We are an army" + Test 1 (Private Channel) + Test 3 (Payment).
      *   *Weight:* High. Confirms the Single Will structure.
  *   **Scenario B:** They say "We are an army" + Test 1 (Public Call) + Test 3 (No Payment).
      *   *Weight:* None. Treated as rhetorical flourish. A crowd saying "we" is still a crowd (Convergence).
  *   **Scenario C:** They say "We are just fans" + Test 1 (Private Channel) + Test 3 (Payment).
      *   *Weight:* Negative. Indicates deception (Failed Test 4).

  **Defense:** Relying on self-description alone fails the "Inauthentic" test. A state-sponsored troll farm will *always* describe itself as "concerned citizens." A genuine fan army will *often* describe itself as a "military unit." The words are cheap; the payment rails and private channels are the truth.

  ---

  ### Case Runs

  #### Case 1: The Marketing Agency
  *   **Facts:** 200 accounts, shared calendar, split shifts, operators freelancing, no knowledge of each other.
  *   **Test 1 (Channel):** **PASS.** Shared calendar is a restricted/private instruction mechanism.
  *   **Test 2 (Feedback):** **PASS.** Implicit in "shifts" and "calendar" is task verification (otherwise why the calendar?). *Assumption: Operators must show work to get paid.*
  *   **Test 3 (Incentive):** **PASS.** Freelance payment. Extrinsic/Contractual.
  *   **Test 4 (Concealment):** **PASS.** Operators don't know each other; accounts likely mask the client relationship.
  *   **Verdict:** **Single Will (CIB).**
  *   **Reviewer Note:** This is not a "group" in the philosophical sense. It is one agent (the Agency/Client) using 200 instruments. The operators lack mutual responsiveness to each other. Enforcement justified.

  #### Case 2: The Diaspora Activists
  *   **Facts:** Public account call, specific hour, thousands post, no DMs, one hashtag, "we" language.
  *   **Test 1 (Channel):** **FAIL.** Instruction was a public post.
  *   **Stop Line:** **Open Call / Convergence.**
  *   **Verdict:** **Organic.**
  *   **Reviewer Note:** Participants retained full agency to ignore the call. No private channel exists to create a "group" boundary. The "we" is rhetorical, not structural. Clearance granted.

  #### Case 3: The Fan Army
  *   **Facts:** Review bomb, no organiser, big Discord, norms of mutual defence, no payment.
  *   **Test 1 (Channel):** **PASS.** Discord is a restricted channel (vs public timeline).
  *   **Test 2 (Feedback):** **FAIL.** "Norms of mutual defence" implies social support, not task verification. No evidence they must report a review to stay in the Discord.
  *   **Stop Line:** **Shared Intention Group.**
  *   **Verdict:** **Organic.**
  *   **Reviewer Note:** This *is* a group (mutual responsiveness + commitment), but it is authentic. They are subordinated to social norms, not a hidden principal. Enforcement denied (unless it violates specific harassment policies, but not CIB).

  ---

  ### Limitations & Honest Admissions

  **1. What the Procedure Cannot Do:**
  *   **Hidden Funding:** If Case 2 (Diaspora) is actually funded by a state actor but the money never touches the participants (e.g., funding the *organizer* only), Test 3 will fail to catch it. The participants look organic. You cannot detect this without external intel.
  *   **Algorithmic Coordination:** If Case 2 happens because your recommender system showed the same post to everyone (Pure Convergence), this procedure clears it as Organic. That is correct. You cannot enforce against your own algorithm using CIB policy.
  *   **AI/Bots:** If Case 1 uses AI agents instead of freelancers, Test 3 (Incentive) breaks. There is no payment. You need a separate "Non-Human Behavior" detection stack. This procedure is for *human* coordination.

  **2. The "Values" Handoff:**
  *   This procedure determines **Structure**, not **Legitimacy**.
  *   If Case 3 (Fans) crosses into doxxing or threats, they are still an *Organic Shared Intention Group*, but they violate *Harassment Policy*.
  *   The procedure stops at "Organic." It hands the case to a human to decide if "Organic" behavior is still harmful enough to remove. Do not use this procedure to justify removing a hate group that is organically coordinated; use Harassment/Hate Speech policy instead. CIB is for *fake* groups.

  **3. The Theory Running Out:**
  *   **The "Loose Movement" Gap:** Between Case 2 (Open Call) and Case 3 (Discord Group) lies a grey zone. A hashtag movement with no Discord but strong social pressure. Test 1 might flag it as Public (Organic), but the social pressure feels like coordination.
  *   **Honesty:** The theory treats "Social Pressure" as distinct from "Operational Control." If your platform policy considers intense social pressure to be "Coordinated Harm," this procedure will under-count it. I have prioritized avoiding false positives (blocking genuine activists) over catching subtle coercion. If you need to catch subtle coercion, you must lower the bar on Test 2, but you *will* catch genuine social movements.

  **4. Why This Survives the Reviewer:**
  *   The reviewer asks: "What makes this a group?"
  *   **Answer for Case 1:** "It isn't a group. It's a single agent with multiple interfaces. Test 3 proves subordination."
  *   **Answer for Case 3:** "It is a group (Test 1 & Shared Intention), but it is authentic (Test 3 & 4). Policy does not ban authentic groups."
  *   This separates the *ontological question* (is it a group?) from the *policy question* (is it allowed?). The reviewer's confusion usually comes from mixing these. This procedure forces them apart.
