          *   *Nuance:* Carr assumes the historian wants truth. Briony wants *order*. Is her mistake a "Carr-esque" selection error, or a betrayal of the historian's duty?
          *   *Discussion Question:* Is Briony a bad historian or just a human one?
      *   **Part 2: The Ending and Emplotment (White vs. McEwan):**
          *   *Concept:* White says we choose tragedy/romance. Briony chooses romance (reunion) for her book.
          *   *Nuance:* White sees this as inevitable. McEwan frames it as a *lie* born of guilt. Does moralizing the narrative choice undermine White's structuralist point?
          *   *Discussion Question:* Is the happy ending an aesthetic choice or a moral crime?
      *   **Part 3: The Ghost of Ranke (The "Real" Truth):**
          *   *Concept:* Ranke wants "how it actually was."
