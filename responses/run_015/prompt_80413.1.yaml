          *   Leopold von Ranke (Implicit counterpoint): History as "how it actually happened" (*wie es eigentlich gewesen*).
      *   **Key Questions to Address:**
          *   Does Briony's error align with Carr (selection/interpretation) or contradict him (outright fabrication/negligence)?
          *   Does the fabricated ending illustrate White (emplotment as choice) or resist it (moral weight/guilt vs. neutral structure)?
          *   Does the novel smuggle in a Rankean "truth" despite the postmodern play?
      *   **Goal:** Prepare a book-club discussion.

  2.  **Deconstruct the Novel through the Historiographical Lens:**
      *   *Briony as Historian:* Young Briony witnesses a scene (the fountain, the library). She interprets it based on preconceived notions (Robbie as a "sex maniac," her own desire for order/control). She creates a "fact" (Robbie attacked Lola).
      *   *Carr's Perspective:* Carr argues facts are like fish in the ocean; the historian chooses which to catch. Briony *does* select facts (she ignores Robbie's kindness, focuses on the letter, the shadow). However, Carr assumes a good-faith engagement with evidence. Briony's error is more epistemological arrogance than simple selection. She treats her *interpretation* as *fact*.
      *   *White's Perspective:* White argues historical narratives impose plot structures (romance, tragedy, etc.) on chaotic events. Briony spends her life rewriting the story. The novel's ending reveals she gave them a "romance/comedy" ending (reunion) in the book, though they died in reality (tragedy). This fits White's idea that emplotment is a choice. *But*, White treats this as a structural necessity of *all* history. McEwan treats Briony's choice as a *moral failure* (a lie to atone).
      *   *Rankean Truth:* The "London, 1999" section reveals the "real" fate of Cecilia and Robbie. This asserts there *is* a truth, even if the narrative hid it. The novel seems to crave the very objectivity it deconstructs.

  3.  **Drafting the Discussion Guide - Section by Section:**

