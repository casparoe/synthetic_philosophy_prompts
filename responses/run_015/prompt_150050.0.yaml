answer: |-
  Good evening, everyone. For those who don't know me, I'm one of the many grad students who've had the privilege of stumbling around in [Advisor's Name] intellectual wake.

  Looking around this room, I see two distinct groups. We've got the philosophers and current students who know exactly what she spent the last forty years wrestling with. And we've got the family and old friends who mostly just want to know why she came home so late thinking about fairness. I promise to keep this warm enough for the family and sharp enough for the department.

  [Advisor's Name] spent her career on a slippery boundary. She asked the question that keeps honest people up at night: Do we actually prefer fairness, or do we just prefer the self-image that comes with being fair? It's uncomfortable. Because if you dig deep enough, your noblest values often track perfectly with your social position. It's easy to think fairness is good when you're benefiting from the current system.

  Now, standing here to honor her, I'm stuck with a problem. I could stand here and tell you her choices were purely rational, untouched by context or bias. That would be a lie. But I also can't reduce her life's work to pure bias, implying she was just acting out her own conditioning. That would be an insult.

  So, how do we talk about a life lived in that middle ground?

  She had a name for it. She called it "axiological residue." It's a fancy term for a very human feeling. It's the leftover sense that our values are genuinely ours, even when we know they're shaped by where we come from. It's the commitment that remains after you've admitted you might be biased.

  Most people, when they realize their values might be self-serving, become cynical. They wash their hands of it. Or they double down and pretend they're pure. [Advisor's Name] did neither. She accepted the residue. She acknowledged that her perspective was situated, but she refused to let that stop her from acting on what she believed was right. She didnt try to scrub herself clean of her own humanity.

  That's the structural integrity of her career. It wasn't about finding a perfect, bias-free viewpoint. It was about owning the messiness of valuation and doing the work anyway. She taught us that integrity isn't the absence of bias; it's what you do with the residue.

  To the family: thank you for sharing her with us. To [Advisor's Name]: thank you for showing us that being good isn't about being perfect, it's about being honest enough to keep trying.

  Please raise your glasses. To [Advisor's Name].
