      *   *The Hive Bee Passage:* Darwin suggests that if we were eusocial like bees, infanticide/fratricide might be virtuous.
      *   *Implication:* This looks like relativism/contingency. If morality depends on biological history, is it "real"?
      *   *Darwin's Nuance:* He doesn't stop at "it's just instinct." He emphasizes the role of *reason* and *sympathy* expanding beyond the tribe.

  3.  **Address the "Reductio vs. Neutral Observation" Dilemma:**
