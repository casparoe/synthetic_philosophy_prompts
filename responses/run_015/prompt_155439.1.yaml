      *   Is he saying "Morality is real, but its *content* is shaped by survival needs"? Yes.
      *   The "hive bee" scenario isn't necessarily a collapse of morality, but a demonstration of *functionalism*. Morality serves social cohesion. Different social structures require different cohesive rules.
      *   *Crucial Point:* Darwin distinguishes between the *source* of the impulse (instinct) and the *validation* of the action (reason/consequence).

  4.  **Tackle the "Novel Cases" Problem (AI/Artificial Minds):**
