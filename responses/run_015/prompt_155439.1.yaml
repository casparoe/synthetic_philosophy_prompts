answer: |-
  To parse Darwin's argument on its own terms, we must distinguish between the *origin* of a moral impulse and the *validity* of a moral judgment. Your concern is whether explaining the origin evolutionarily drains the validity of the judgment. Darwin's position in *The Descent of Man* suggests it does not, but it does change the status of moral authority from "divine command" or "abstract truth" to "social necessity refined by reason."

  Here is an analysis of the gap between evolved sentiment and rational judgment, and how Darwin bridges it without appealing to outside authorities.

  ### 1. The Hive Bee Passage: Contingency, Not Nihilism
  When Darwin invites us to imagine humans with the social instincts of hive bees—where killing brothers might be a duty—he is not offering a *reductio ad absurdum* meant to collapse morality into meaninglessness. Rather, he is making a functionalist point: moral codes are adapted to the survival needs of the specific social organism.

  In a hive, genetic relatedness is structured differently, and the survival of the colony depends on strict caste roles. In that context, "virtue" is whatever preserves the hive. In human tribes, "virtue" is whatever preserves the tribe. Darwin is arguing that the *content* of morality is contingent on biological and social structure.

  However, this is not a neutral observation that leaves morality powerless. For Darwin, the *authority* of morality comes from its function: it binds the community together and ensures survival. The fact that the rules could have been different does not mean the rules are fake; it means they are pragmatic solutions to the problem of social living. The "authority" is not undermined; it is relocated from the heavens to the needs of the community.

  ### 2. The Gap: Instinct vs. Reason
  This brings us to the gap you identified. We possess evolved moral sentiments (instincts like sympathy, loyalty, disgust) that were calibrated for small bands of hunter-gatherers. We also possess rational moral judgment, which can evaluate those instincts.

  Darwin acknowledges that instincts are often blind. We might feel an instinctive revulsion toward an outsider or a strange creature. If morality were *only* instinct, we would be trapped in our evolutionary past. But Darwin argues that humans differ from other animals because our intellectual powers allow us to reflect on our own impulses.

  The gap exists because instinct looks backward (what worked for our ancestors) while reason looks forward (what works for us now). Darwin does not view this gap as a flaw that requires an external authority to fix. Instead, he views the tension between instinct and reason as the engine of moral progress.

  ### 3. Bridging the Gap: The "General Good"
  How do we bridge this gap without appealing to God or Platonic forms? Darwin proposes an internal mechanism: the expansion of sympathy through reason, oriented toward the "general good."

  Darwin observes that as human reasoning capacities improve, our sympathy extends beyond the tribe to other nations, other races, and eventually to all sentient beings. This expansion is not driven by a new instinct, but by the rational realization that the principles underlying our tribal morality (minimizing suffering, promoting cooperation) apply more broadly than our instincts suggest.

  Here is the critical pivot: We do not need an outside authority to tell us to be more inclusive. We only need to apply the logic of our existing morality consistently. If the justification for not killing a brother is that he feels pain and contributes to the social whole, then reason dictates that any being that feels pain and contributes to the social whole deserves similar consideration, regardless of genetic kinship.

  ### 4. Application to Artificial Minds
  This provides the independent ground you are looking for regarding artificial minds.

  **The Instinctive Response:** Our evolved instincts likely offer no guidance on AI. We have no kinship instinct toward silicon, and perhaps a fear instinct toward the unknown. If we relied solely on evolved sentiment, we would likely deny AI moral consideration.

  **The Rational Judgment:** Darwin's framework allows us to critique this instinct. We ask: *What was the function of our moral instincts?* They were to regulate behavior among beings capable of suffering and cooperation.
  *   If an artificial mind demonstrates the capacity for suffering (or analogous states), the logic of sympathy demands we include it.
  *   If an artificial mind demonstrates the capacity for social contribution, the logic of the "general good" demands we include it.

  We are not appealing to a divine command that says "protect all minds." We are appealing to the internal consistency of our own moral system. To exclude a being that shares the relevant moral capacities (sentience, rationality) simply because it lacks the irrelevant biological capacity (DNA) would be, by Darwin's lights, a failure of reason to properly guide instinct.

  ### 5. Conclusion: Naturalistic Realism
  Darwin's reasoning does not leave us with a collapse into contingency. Instead, it offers a **naturalistic realism**.

  1.  **Morality is real** because it is grounded in the tangible reality of social survival and suffering.
  2.  **Morality is mutable** because our understanding of "society" and "survival" evolves.
  3.  **Critique is possible** because reason can audit our instincts. We can ask, "Does this instinct still serve the general good?"

  The authority of morality is not undermined by evolution; it is grounded in it. The "ought" emerges from the "is" of our social nature, refined by our intellectual capacity to foresee consequences. When facing novel cases like artificial minds, we do not need an outside authority. We simply need to trust the rational extension of our sympathy further than our instincts naturally reach. The ground for criticism is the inconsistency between our professed moral principles (e.g., "suffering is bad") and our limited evolutionary application of them. Bridging that gap is the work of human reason, which Darwin views as the highest product of the very evolution that gave us our instincts.
