  I am least sure of the **Anti-Stasis Bias (Req 4)** being Non-Negotiable.
  *   *Reasoning:* While logically the status quo is just another action, practically, *institutional inertia* acts as a coordination focal point. In a world of many agents, "do nothing" might have lower variance than "do something new," even if the mean is unknown. There is a credible camp (conservative/risk-averse) that argues the status quo *should* get a default prior of safety simply because it has survived selection pressure so far. I am marking it Non-Negotiable in the text above based on pure rational choice, but I am least confident that this holds in a complex, evolutionary system where "survival" implies some hidden optimization.

