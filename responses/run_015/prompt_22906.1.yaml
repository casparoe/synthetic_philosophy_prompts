answer: |-
  This is a sophisticated position, often associated with the **Suppositional Theory** of conditionals (championed by Ernest Adams, Dorothy Edgington, and Jonathan Bennett). You are right to feel that the Lewis/Stalnaker possible-worlds semantics fits counterfactuals better than indicatives. Counterfactuals feel like claims about how the world *would* be; indicatives feel like claims about what follows from what we *know*.

  Here is the steelman for the Adams Thesis ($Pr(A \to B) = Pr(B|A)$), specifically engineered to withstand the compositionality/embedding objection.

  ### 1. The Positive Case: Why Indicatives Aren't Propositions

  To steelman this, we must start with why we are forced into this corner. It isn't just an intuition; it's a mathematical constraint.

  **Lewis's Triviality Results**
  David Lewis (1976) proved that if you assume:
  1.  Conditionals express propositions (have truth conditions).
  2.  The probability of that proposition equals the conditional probability ($Pr(A \to B) = Pr(B|A)$).
  3.  Standard probability theory holds.

  ...then you end up with triviality: $Pr(B|A) = Pr(B)$. This implies that learning $A$ gives you no information about $B$, which is obviously false for most conditionals.

  **The Steelman:** The only way to save the Adams Thesis (which matches our intuitive reasoning perfectly) is to deny premise #1. Indicatives do not express propositions. They are not truth-apt. They are **expressions of conditional belief**. When you say "If it rains, the ground is wet," you aren't describing a state of affairs; you are licensing an inference. You are saying, "My credence in 'wet ground' is high, conditional on 'rain'."

  **The Epistemic vs. Metaphysical Split**
  *   **Counterfactuals:** Metaphysical. They range over nearby possible worlds. They have truth conditions (true in world $w$ if $B$ holds in the closest $A$-world to $w$).
  *   **Indicatives:** Epistemic. They range over epistemically possible worlds (live possibilities given your knowledge). They don't describe the world; they describe the *map*.

  ### 2. The Objection: The Embedding Problem

  The standard objection is the **Frege-Geach problem**. In standard semantics, logical operators (negation, conjunction, disjunction) operate on truth values.
  *   If "If A, B" has no truth value, what does "It is not the case that if A, B" mean?
  *   What is the truth condition of "If A, B or if C, D"?
  *   How can someone believe "If A, B" if there is no proposition to be the object of belief?

  If you can't embed them, you can't use them in complex reasoning, which suggests the Adams Thesis is linguistically inadequate.

  ### 3. The Steelman Response: Dynamic Semantics and Expressivism

  To save the Adams Thesis, you must change the underlying semantics from **Truth-Conditional** to **Dynamic (Information-Based)**.

  #### A. Semantic Values are Update Potentials, Not Truth Values
  In standard semantics, the meaning of a sentence is the set of worlds where it is true. In **Dynamic Semantics** (e.g., Veltman, Gillies, Yalcin), the meaning of a sentence is its **Context Change Potential (CCP)**.
  *   **Proposition:** A function from worlds to truth values.
  *   **Indicative Conditional:** A function from *information states* to *information states*.

  To assert "If A, B" is to propose an update to the common ground: "Restrict our attention to the A-cases; in all of those, B holds."

  **How this saves compositionality:**
  Compositionality requires that the meaning of the whole is determined by the meanings of the parts. It does *not* strictly require that the "meanings" be truth values. They just need to be the *right kind* of semantic object to be combined. If the semantic object is an "update instruction," logical operators can be redefined as operations on updates.

  #### B. Handling Negation: "It is not the case that if A, B"
  This is the hardest case. If "If A, B" isn't true or false, how can it be negated?

  **The Steelman Move:** Distinguish between **Rejection** and **Negation**.
  When someone says, "It is not the case that if A, B," they are not asserting the truth of a negated proposition. They are **rejecting the conditional commitment**.

  1.  **Test Semantics:** In dynamic semantics, negation ($\neg \phi$) is often treated as a test. $\neg \phi$ is acceptable in an information state $S$ if updating $S$ with $\phi$ results in the absurd state (crash).
      *   So, "Not (If A, B)" means: "The current information state does not support the inference from A to B."
      *   It doesn't mean "There is a world where (If A, B) is false." It means "Your rule for updating on A is invalid given our current knowledge."

  2.  **Pragmatic Implicature (Edgington's View):** Dorothy Edgington argues that natural language is messy. When people say "It's not the case that if A, B," they often *mean* "If A, not B" or "A and not B."
      *   Example: "It's not true that if you study, you'll fail."
      *   Literal Semantic Content: I reject the conditional commitment.
      *   Pragmatic Implicature: If you study, you won't fail (or at least, studying lowers the probability of failing).
      *   The "truth-aptness" we perceive is a pragmatic illusion. We treat the rejection of an inference rule *as if* it were a truth-functional negation because it's communicatively efficient, not because it reflects deep logical structure.

  #### C. Handling Conjunctions and Disjunctions
  What about "If A, B and if C, D"?
  *   **Standard View:** Conjunction of two propositions.
  *   **Steelman View:** Conjunction of two *constraints* on the information state.
  *   To accept the conjunction is to accept both update instructions. The semantic value is a complex update function: "First restrict to A and ensure B; also restrict to C and ensure D."
  *   This is compositional. The operator "and" combines two update functions into a joint update function.

  #### D. Handling Belief Reports: "John believes that if A, B"
  If there is no proposition, what does John believe?
  *   **Steelman:** John has a **conditional belief state**.
  *   Belief reports don't always require propositions as objects. We can say "John fears that..." or "John hopes that..." where the content is modal or non-factive.
  *   Better yet: Treat "believes that if A, B" as attributing a disposition to John. "If John were to learn A, he would believe B." This is a factual claim about John's psychology (which *does* have truth conditions), even if the conditional itself ("If A, B") does not.
  *   So, "John believes (If A, B)" is truth-apt, not because the conditional is, but because the *attribution of the mental state* is.

  ### 4. The Knock-Down Argument: Gibbard's Standoff

  To really steelman this, you need to show why the truth-conditional view *fails* where the Adams view succeeds. Allan Gibbard (1981) provided the "Standoff" argument.

  **The Setup:**
  Two agents, Pete and Zack, are playing poker. Zack sees Pete's hand and knows Pete will lose. Zack writes a note: "If Pete calls, he will lose."
  Another agent, Jack, sees Pete's hand and knows Pete has the winning hand (but doesn't know Zack's info). Jack writes: "If Pete calls, he will win."
  Both conditionals are asserted based on their specific information.

  **The Problem:**
  If indicatives have truth conditions (are propositions), then one of these notes must be false (they contradict). But both agents were rational given their information.
  *   If truth is relative to information, we lose objective truth.
  *   If truth is absolute, one agent is irrational.

  **The Adams Solution:**
  Neither note expresses a proposition. They express conditional commitments relative to an information state.
  *   Zack's note says: "Relative to Zack's info, $Pr(Lose | Call) = 1$."
  *   Jack's note says: "Relative to Jack's info, $Pr(Win | Call) = 1$."
  *   There is no contradiction because there is no single proposition being asserted. The "truth" of the indicative is indexed to the speaker's epistemic state.

  This explains why we can't embed these easily in a global truth-functional logic: because they aren't global claims. They are local moves in a language game.

  ### 5. Summary of the Steelman

  To hold the line on the Adams Thesis against the embedding objection, your position is:

  1.  **Metaphysics:** Indicatives are not descriptions of reality; they are tools for managing epistemic probability. (Hence Adams Thesis holds).
  2.  **Semantics:** We must abandon Truth-Conditional Semantics for indicatives in favor of **Dynamic Semantics**. Meaning = Context Change Potential.
  3.  **Compositionality:** Logical operators are redefined as operations on information states, not truth values. "Negation" of a conditional is a test of whether the information state supports the inference, not a flip of a truth value.
  4.  **Linguistics:** Apparent embeddings (like "It is false that if...") are often pragmatic approximations or attributions of mental states, not deep logical structures.
  5.  **Motivation:** This avoids Lewis's Triviality Results and explains Gibbard Standoffs, which the truth-conditional view cannot do without paradox.

  **The Cost:** You have to accept that natural language logic is not isomorphic to classical propositional logic. The "logic" of indicatives is a logic of information update, not a logic of truth preservation.

  **The Payoff:** You get a unified theory of reasoning where probability and logic mesh perfectly. You don't have to explain away why $Pr(\text{If } A, B) = Pr(B|A)$ feels so right; you build your semantics to ensure it *must* be right. The embedding problem isn't a bug; it's a feature revealing that we were wrong to expect conditionals to behave like standard propositions in the first place.
