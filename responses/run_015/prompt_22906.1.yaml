prompt: |-
  I've been going back and forth on the indicative vs counterfactual distinction (re-reading some old LW threads that never really landed) and I want to steelman a take I think is underrated. The Lewis/Stalnaker setup gives counterfactuals a clean possible-worlds semantics with a similiarity order, and that works great, but indicatives — "if it's raining, the ground is wet" — dont sit well with it. I think the Adams thesis, Pr(A > B) = Pr(B | A), is actually the right treatment, which means indicatives don't have truth values in the normal sense and are really about your credence state. Can you argue this position for me, and specifically push back on the objection that it wrecks compositionality — how do you even make sense of negated or conjoined indicatives like "it's not the case that if A then B"? I keep getting stuck on the embedding cases.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The distinction between indicative and counterfactual conditionals.
      *   **Specific Position:** The user wants to steelman the view that indicatives are best treated via the Adams Thesis ($Pr(A \to B) = Pr(B|A)$), implying they lack standard truth conditions (are not propositions) and are instead expressions of credence.
      *   **Specific Problem:** The user is stuck on the "embedding problem" (compositionality). How do we handle negations, conjunctions, etc., of indicatives if they aren't truth-apt? (e.g., "It is not the case that if A then B").
      *   **Goal:** Argue for this position (Adams/Suppositional Theory) and specifically address/push back on the compositionality objection.

  2.  **Deconstruct the Position (The Adams/Suppositional View):**
      *   *Core Claim:* Indicative conditionals do not express propositions (they are not true or false). They express conditional beliefs.
      *   *Motivation:* Lewis's Triviality Results. If conditionals *were* propositions with truth conditions, and we accept the Adams Thesis, probability theory collapses (unless probabilities are 0 or 1). Therefore, conditionals aren't propositions.
      *   *Semantics:* Ramsey Test / Suppositional Theory. To evaluate "If A, B," you hypothetically add A to your belief stock and check the probability of B.

  3.  **Address the Core Objection (Embedding/Compositionality):**
      *   *The Objection:* Natural language allows conditionals to be embedded in larger sentences ("If A then B, or if C then D", "It is not the case that if A then B", "John believes that if A then B"). If "If A then B" isn't a proposition (has no truth value), it can't be the argument of a negation operator or a belief predicate. This violates standard compositional semantics.
      *   *Standard Counter-argument:* The "Frege-Geach" problem applied to conditionals.
      *   *Steel-manning Strategy:* I need to show how a proponent of the Adams Thesis can handle this without conceding that conditionals have truth conditions.

  4.  **Develop Arguments for the Adams Thesis (The "Why"):**
      *   *Triviality Results:* This is the heavy hitter. Lewis (1976) showed that if $Pr(A \to B) = Pr(B|A)$ holds for all probability functions, then $Pr(B|A)$ must equal $Pr(B)$ (independence) or probabilities are trivial. This suggests the LHS isn't a standard probability of a proposition.
      *   *Intuitive Fit:* The Adams Thesis matches how we actually use indicatives in reasoning (probabilistic modus ponens).
      *   *Distinction from Counterfactuals:* Counterfactuals deal with distant worlds (similarity); indicatives deal with epistemic updates within the actual world context.

  5.  **Develop Responses to the Embedding Problem (The "How"):**
      *   *Strategy 1: Expressivism/Non-cognitivism.* Just like ethical expressivism ("Murder is wrong" expresses disapproval, not a fact), conditionals express a state of mind. Embeddings are superficially grammatical but logically distinct.
      *   *Strategy 2: Context Change Potentials (Dynamic Semantics).* Instead of truth conditions, use update conditions. "If A, B" is an instruction to update the context. Negation becomes a test on the context. (Veltman, Gillies).
      *   *Strategy 3: Restricted Quantification.* Treat "If A, B" as a quantifier over cases/worlds compatible with knowledge, but restrict the domain.
      *   *Strategy 4: Denying the Data (Linguistic Pragmatics).* Maybe "It is not the case that if A then B" is pragmatically implicated to mean something else (e.g., "If A, not B" or "A and not B").
      *   *Strategy 5: Multidimensional Semantics.* Separate content (truth-conditional) from character (use-conditional).

      *Selection for Steelman:* The strongest contemporary steelman combines **Dynamic Semantics** (indicatives update information states) with a **Reinterpretation of Embeddings**. The key move is to say that embeddings of conditionals don't operate on truth values but on *information states*.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the position. It's the "Suppositional Theory" (Edgington, Bennett, early Adams).
      *   *Part 1: The Positive Case (Why Adams is right).*
