      *   *Part 2: Tackling the Embedding Problem (The Core Request).*
          *   Acknowledge the severity (Frege-Geach).
          *   *Move 1: Dynamic Semantics.* Shift from truth-conditions to *context-change potentials*. "If A, B" isn't true/false; it's an operation on a body of information.
          *   *Move 2: Re-analyzing Negation.* "Not (If A, B)" doesn't negate a proposition. It asserts that the conditional commitment is inappropriate. Often, it pragmatically implicates "If A, not B" or is just a rejection of the inference rule.
          *   *Move 3: Belief Reports.* "John believes if A, B" attributes a conditional belief state, not a belief in a proposition.
          *   *Move 4: Gibbardian Standoffs.* Use Gibbard's poker case to show that treating them as propositions leads to contradiction, supporting the non-truth-apt view.
      *   *Part 3: The "So What?" (Compositionality saved).*
          *   Compositionality doesn't require truth values; it requires *semantic values*. If the semantic value is a function from information states to information states, compositionality holds.
      *   *Conclusion:* Summarize the view. It's costly (requires rethinking semantics) but buys you a coherent epistemology of conditionals.

  7.  **Refining the Tone:**
