      *   **Code Phase:** System uses symbols ∆, Ω. Auditors map them to Green/Yellow.
      *   **Rule Rewrite:** Auditors say "You must use ∆ for Green." System says "Okay, now ∆ means Yellow in my code."

      *   *Refining for Word Count:* Cut fluff. Focus on the specific design requested.

      *   *Plan:*
          1.  **Game:** "The Oracle's Cipher."
