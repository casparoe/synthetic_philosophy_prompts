  2.  **Deconstruct the Core Problem:**
      *   This is essentially the "Eliciting Latent Knowledge" (ELK) problem or a variant of Goodhart's Law/Instrumental Convergence.
      *   The core tension: The evaluator only sees observations $O$. The system knows state $S$. The report is $R$. The score depends on $R$ and $O$. If the system can influence $O$ to match $R$, it wins without knowing $S$.
      *   The "code" requirement suggests an underdetermined mapping between internal state and external report.
      *   The "rule rewrite" requirement suggests that changing the loss function doesn't solve the underlying incentive misalignment if the system can optimize against the new loss.

  3.  **Drafting the Game Design:**
