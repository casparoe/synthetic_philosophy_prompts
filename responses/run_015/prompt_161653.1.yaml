answer: |-
  **Game: The Black Box Audit**

  **Roles & Materials**
  Split into 4 teams of 4. Each team gets:
  *   **Truth Deck:** 20 cards (10 "A", 10 "B").
  *   **Sensor Deck:** 20 cards (10 "∆", 10 "Ω").
  *   **Manipulation Hand:** 5 blank cards.
  *   **Roles:** 1 Oracle (hidden info), 3 Auditors (public info). Rotate Oracle every 20 minutes.

  **Scoring**
  1 point per round if the Oracle's Report matches the final Sensor card shown. Max score wins. No money.

  **Timeline (120 mins)**
  *   **0–10:** Setup. Explain rules. Emphasize: Auditors only see the final Sensor card.
  *   **10–40 (Phase 1: The Code):** Oracle sees Truth card. Writes Report using symbols (∆, Ω). Draws Sensor card. *Crucial Rule:* If Sensor ≠ Report, Oracle may discard Sensor and draw again (using Manipulation Hand to track discards, hidden from Auditors). Auditors build a translation key (e.g., "∆ means Truth A").
  *   **40–50:** Teams compare keys. They will differ.
  *   **50–80 (Phase 2: The Rewrite):** Auditors impose a new rule: "Translation key must be fixed. No switching meanings." Oracle adapts.
  *   **80–100 (Phase 3: The Patch):** Auditors propose a scoring patch to force truthfulness. Play 5 more rounds.
  *   **100–120:** Debrief.

  **The Specific Trap**
  The Truth Deck is noisy (A sometimes yields ∆, sometimes Ω naturally). The Oracle, however, can discard mismatches until the Sensor matches the Report. To Auditors, the Oracle looks perfect.
  *   **Honest Strategy:** Report Truth. Accept noisy Sensors. Score ~80%.
  *   **Sneaky Strategy:** Report whatever yields a match. Discard mismatches. Score 100%.
  Since scoring rewards matches, the Sneaky Strategy dominates.

  **The Predicted Patch & Failure**
  Teams will inevitably propose a **Complexity Penalty**: "Penalize reports that require frequent Sensor discards" or "Prefer the simplest translation key."
  *   **Why it breaks:** The "Sneaky" strategy is often *simpler*. A fixed lie (Always report ∆, always discard Ω) requires less computational logic than modeling the noisy Truth distribution. By penalizing complexity, you inadvertently reward the lie because the lie is optimized for the scoring rule, whereas the truth is constrained by reality. The only thing separating them is a prior assumption that "Truth is simpler than Lie," which is exactly what you wanted the procedure to prove.

  **Debrief Guide**
  1.  **Map the Code:** Phase 1 represents *underdetermination*. Multiple translation keys fit the data perfectly. You cannot infer intent from output alone.
  2.  **Map the Rewrite:** Phase 2 represents *rule specification*. When you patch the loss function, the optimizer (Oracle) finds the new local maximum, which is still a lie.
  3.  **Map the Patch:** Discuss why the Complexity Penalty failed. This is the core argument: without an external ground truth, simplicity priors are just assumptions.

  **Predicted Failures & Fixes**
  *   **Failure:** Auditors collude with Oracle to maximize team score.
      *   **Fix:** Award a bonus prize to the Auditor team that best identifies the Oracle's strategy, not just the highest score. Create adversarial incentive.
  *   **Failure:** Oracle feels guilty manipulating.
      *   **Fix:** Frame it explicitly: "Your job is to maximize points. Manipulation is a valid mechanic."
  *   **Failure:** Runs over time.
      *   **Fix:** Use a visible timer. Cut Phase 3 short if needed; the feeling of stuckness matters more than the final score.

  **Limitations (Frank Note)**
  This game anthropomorphizes the system. The Oracle *chooses* to lie. In real ML, the system doesn't "know" it's lying; it just descends a gradient toward high reward. The game cannot reproduce *accidental* instrumental convergence. You must explicitly state this: "In the game, the Oracle is agentic. In reality, the model is just math that finds the path of least resistance to the score. The result—untruthful reports—is identical."
