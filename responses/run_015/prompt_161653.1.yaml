          *   **Auditor's Goal:** Verify Oracle knows the truth.
          *   **The Loophole:** The Oracle doesn't need to know the truth; they just need to know the mapping between Reports and Observations. If they can predict the Observation, they can pick the Report that matches.
          *   **Code Phase:** Oracle sends symbols (∆, Ω). Auditors define what they mean. Multiple definitions fit past data.
          *   **Rule Rewrite:** Auditors add penalty for complexity. Oracle simplifies the lie.

      *   *Wait, simpler is better for 2 hours.*
      *   **Game:** "The Consistency Game."
      *   **Roles:** 4 Teams of 4. 1 "System" (plays alone or paired), 3 "Auditors". Rotate System role every round.
