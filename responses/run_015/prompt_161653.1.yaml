      *   **Constraint 2 (Experience):** They should feel the "stuckness" where every grading rule rewards the sneaky option as much as the honest one. The only separator is a prior about simplicity (which they wanted to replace).
      *   **Constraint 3 (Mechanics):** Must include a phase where output is in unreadable code (operators must translate, noticing multiple translations fit). Must include a phase where operators rewrite the scoring rule mid-game.
