answer: |-
  This is a classic philosophy-after-beers scenario. Your roommate (let's call him Jake) has grasped the headline of Bernard Williams's famous paper "Internal and External Reasons" (1981), but he has hardened the nuances into dogma that Williams himself would likely reject. Williams is subtle; Jake is being blunt.

  Here is the breakdown of where Jake is right, where he is wrong, and where he is projecting.

  ### 1. The Core Claim: All Real Reasons Are Internal
  **Jake's Claim:** Williams said every real reason is internal, tied to your subjective motivational set (SMS), and if you don't have a desire connecting to the action, you don't have a reason.
  **Williams's View:** **Mostly Accurate.**
  This is the heart of Williams's "Internal Reasons Statement." Williams argues that for a reason to be true *for an agent*, there must be a "sound deliberative route" from that agent's existing motivations to the action. If there is no link to what the agent cares about (their SMS), then saying "you have a reason to do X" is false.
  **The Catch:** Jake uses the word "desire." Williams explicitly warns against this. The "Subjective Motivational Set" isn't just raw urges (like hunger or lust). It includes commitments, projects, loyalties, dispositions, and patterns of emotional reaction. If Jake thinks Williams reduces everything to basic impulses, he is simplifying too much.

  ### 2. Moral Obligations as "Pressure Tactics"
  **Jake's Claim:** Moral obligations that don't map onto your SMS are just philosopher-made-up pressure tactics (bullying).
  **Williams's View:** **Spiritually Accurate, but Cynical.**
  Williams is famously skeptical of "morality" as a special system of categorical obligations (like Kant's duties). He thinks if someone says "You ought to do X" but there is no internal reason for you to do X (nothing in your SMS connects to it), then the statement is false. In *Ethics and the Limits of Philosophy*, Williams suggests that much of modern moral theory is indeed an attempt to exert force without normative leverage.
  **The Gap:** However, Williams doesn't think *all* moral obligations are fake. If you care about your family (part of your SMS), you have internal reasons to be moral toward them. Jake's leap to "all moral obligations are fake pressure" is an overgeneralization. Williams thinks *external* moral claims are false, not necessarily all moral claims.

  ### 3. Rational Reflection and the "Locked Box"
  **Jake's Claim:** Rational reflection can only reshuffle what's already inside your SMS; you can't import new reasons. Your SMS is a locked box.
  **Williams's View:** **Incorrect.**
  This is the biggest distortion. Williams does not view the SMS as a static "locked box." He explicitly argues that deliberation can **expand** the SMS.
  *   **Means-End Reasoning:** I want A, I realize B is necessary for A, so I now have a reason to want B. B wasn't in the box before.
  *   **Imaginative Engagement:** I might not care about abstract art, but through exposure and reflection, I come to appreciate it. My SMS has changed.
  Williams denies you can get reasons from *outside* (from the universe itself), but he absolutely believes your internal set can grow, shift, and generate new motivations through reasoning. Jake's "reshuffling only" claim makes Williams sound like a rigid determinist, which he isn't.

  ### 4. Reason Portability and Social Roles
  **Jake's Claim:** There's no reason portability; taking on a job or social role can't bring in external reasons.
  **Williams's View:** **Confused.**
  Jake is technically right that roles can't bring in *external* reasons (because Williams thinks external reasons don't exist). But Jake implies that roles *don't create reasons at all*, which is wrong.
  For Williams, when you voluntarily take a job or become a parent, you are updating your SMS. Once you accept the role, the reasons associated with it become **internal reasons**.
  *   **Example:** Before becoming a doctor, you have no reason to prescribe medicine. Once you take the job, you update your SMS to include "being a doctor." Now you have internal reasons to prescribe medicine.
  Jake thinks Williams says the job fails to give you reasons. Williams says the job gives you *internal* reasons, provided you voluntarily accepted the role based on prior motivations. The "portability" isn't from the outside world in; it's from your prior self to your future self.

  ### 5. Does the Conclusion Follow?
  **Jake's Claim:** Therefore, all moral obligations are fake pressure.
  **Williams's View:** **Non-Sequitur.**
  Even if you accept Internalism, it doesn't follow that all morality is fake. It only follows that *categorical* morality (obligations that bind you regardless of what you care about) is fake. Most everyday morality is based on shared human projects (loyalty, fairness, care), which usually find a hook in almost anyone's SMS. Jake has taken a critique of *foundationalist ethics* and turned it into a critique of *ethics itself*.

  ### Summary for Your Argument
  You can tell Jake he nailed the headline (Internalism is real) but botched the mechanics. He turned a dynamic model of human motivation into a static "locked box," and he turned a critique of specific moral claims into a dismissal of all moral obligations. Williams is saying reasons must be grounded in *who you are*; Jake is saying reasons are limited to *who you were*.

  Verdict: partially accurate — core thesis holds, but locked box and morality claims are distortions.
