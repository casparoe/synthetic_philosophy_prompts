      *   *Morality:* Williams is skeptical of "obligation" in the Kantian sense (categorical imperatives). He thinks moral claims need to connect to the agent's identity/projects to be reasons *for them*. He doesn't necessarily say morality is "fake," but that moral *obligations* construed as external reasons are false.
      *   *Social Roles:* Williams acknowledges that taking on a role (e.g., becoming a parent, taking a job) changes the SMS. Once you accept the role, the reasons become internal. But the act of accepting the role must itself be motivated by something in the prior SMS.

