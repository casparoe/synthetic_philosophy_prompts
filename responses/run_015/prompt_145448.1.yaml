      *   *Core Thesis:* An agent has a reason to $\phi$ only if they could reach the conclusion to $\phi$ by a sound deliberative route from their existing "subjective motivational set" (SMS).
      *   *SMS:* Not just raw desires. Includes dispositions, commitments, projects, loyalties, etc.
