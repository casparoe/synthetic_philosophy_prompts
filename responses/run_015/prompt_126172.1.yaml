  Dear Colleague,

  I have spent the last week wrestling with the constraints you set out, specifically the demand for a fixed-population intransitivity case that avoids the usual spectral or population-ethics tricks. It is surprisingly difficult to construct a cycle that feels robust rather than like a confusion of categories. Before settling on the case I will describe below, I worked through and discarded two constructions that initially seemed promising but ultimately failed your specifications. The first was a variation on Temkin's spectrum argument involving pain levels across a fixed group, where Option A imposed mild pain on all, Option B moderate pain on most, and Option C severe pain on few. I set this aside because it inevitably relies on imperceptible differences or the accumulation of small losses along a spectrum to generate the cycle, which violates your constraint against cheating with differences too small to notice. The second was a resource allocation case that subtly altered the roster of beneficiaries by treating "potential" recipients differently across options, effectively smuggling in a version of Parfit's Mere Addition Paradox under the guise of fixed institutional roles. I discarded this because it re-stages the Repugnant Conclusion dynamics by changing the effective population size, violating your requirement for a strictly fixed roster of named individuals.

  The case I propose instead is set in a hospital ethics committee meeting regarding the allocation of three available viable livers to six named patients on the waiting list: Adams, Brown, Clark, Davis, Evans, and Ford. The budget and roster are fixed; the only variable is which three patients receive the organ. Option A allocates the livers to Adams, Brown, and Clark. Option B allocates them to Clark, Davis, and Evans. Option C allocates them to Evans, Ford, and Adams. The cycle is driven not by welfare sums but by three distinct, robust moral principles that dominate pairwise comparisons without establishing a global hierarchy. In the comparison between A and B, A is better than B because Adams and Brown are victims of prior medical negligence by this specific hospital, generating a special obligation of rectification that overrides the claims of Davis and Evans, who are not victims of negligence, while Clark is neutral in both. In the comparison between B and C, B is better than C because Davis and Evans are the sole caregivers for dependent minor children, meaning their death would cause significant third-party harm, a consideration that overrides the claims of Ford and Adams, who have no dependents, while Evans is neutral in both. In the comparison between C and A, C is better than A because Ford and Adams have waited twice as long on the queue as Brown and Clark, generating a procedural fairness claim based on tenure that overrides the negligence claim in this specific pairwise context, while Adams is neutral in both.

  These verdicts are robust because in each pair, one principle clearly outweighs the other without remainder; there is no rough equality or incommensurability where the committee would shrug. The negligence claim decisively beats the caregiver claim in A versus B, the caregiver claim decisively beats the queue claim in B versus C, and the queue claim decisively beats the negligence claim in C versus A. This is not due to ignorance or framing; the same well-informed evaluator, holding all three principles as valid components of the institution's moral identity, judges each pair on its specific merits. The structural feature doing the work here is the context-sensitive dominance of distinct normative principles. If we remove this feature by imposing a single monetary or QALY-style measure, the cycle collapses immediately. For instance, if we assign a point value to negligence rectification, caregiver status, and queue time, and sum them additively, transitivity is restored because the sums will order the options linearly. The cycle exists only because the weight of each principle is not absolute but relational, depending on which other principle it is contesting in the specific pairwise choice.

  The strongest reply available to someone insisting on transitivity is to argue that these clear verdicts are actually evidence of incompleteness or verdict-fragility. They would claim that if A is better than B and B is better than C, then rationality requires A to be better than C, so my judgment that C is better than A must be an error or a sign that the "better than" relation is not fully defined. Closely related is the money-pump or chaining objection: if a committee prefers A to B, B to C, and C to A, they could be induced to pay a fee to switch from A to B, then B to C, then C to A, ending up back at A with less resources and no gain, which seems paradigmatically irrational. My answer to this is that the money-pump objection assumes the options remain stable across sequential trades, but in this institutional context, the moral properties of the options are tied to the specific choice set presented in one meeting. Once A is chosen, the negligence obligation is discharged, changing the moral landscape for subsequent trades. However, even if we grant the static nature of the options for the sake of argument, the money-pump argument presupposes that rationality requires acyclicity in all-things-considered betterness. If we accept that different moral principles have lexical priority in different pairwise contexts, then the cycle is a feature of moral reality, not a bug in our reasoning, and the "pump" is simply the cost of navigating a moral landscape where no single metric captures all value.

  Regarding your fourth constraint on replication stability, I must be plain: if we duplicate the entire situation into two non-interacting copies to be decided together, the same cycle cannot be guaranteed to reappear alongside the other constraints. If we have two hospitals with identical rosters and options, the additive intuition becomes overwhelming. If A is better than B in one case, and A is better than B in the second case, it becomes incredibly difficult to maintain that the combined option 2A is not better than 2B, and similarly for the other pairs. If we maintain the cycle in the replicated case, we are committed to a theory of value that is strictly non-additive, where the value of two independent goods is not the sum of their individual values. While some holists might accept this, it renders the evaluation highly unstable and context-bound in a way that undermines the "robust verdict" constraint. The failure of replication stability here shows that intransitivity in fixed-population cases likely relies on the specific local context of the choice situation rather than on properties of the outcomes themselves. It suggests that "betterness" is not a relation between states of affairs that can be aggregated, but a relation between options within a specific deliberative context.

  My honest judgement is that all four constraints cannot be satisfied at once. If we demand robust, clear verdicts from the same evaluator in a fixed-population case without imperceptible differences, we must sacrifice replication stability. The reason is that transitivity is a necessary condition for additive aggregation, and replication stability presupposes additive aggregation across independent copies. To keep the cycle, we must deny additivity, but if we deny additivity, we cannot guarantee that the cycle survives duplication, because the moral reasons that drive the pairwise judgments (negligence, caregiving, queue) might interact or dilute when scaled up. Therefore, replication stability is the constraint that must give. This failure itself shows that intransitive betterness is fundamentally a feature of local comparative judgment rather than a global property of outcomes, which limits the scope of intransitivity arguments but does not refute them in the single-case institutional decisions that actually matter for practice. I hope this helps clarify the trade-offs involved in constructing such a case.

  Best regards,

  Your Colleague
