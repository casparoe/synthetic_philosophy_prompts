prompt: |-
  I'm giving a ninety-minute session at a writers' conference next month — about twenty novelists, no philosophy background, all of them convinced they're already strong on character — and the topic is sphexishness: the way a stretch of behavior runs to completion regardless of what changes around it, and what would have to be true for a character to count as flexible rather than just noisier. I dont want the idea explained to me; I want a plan for how to get them there. What has to land first for the rest to have somewhere to sit? (My guess: that rigidity isn't repetition, it's insensitivity to the variable that matters — and that before that they need to see a fixed pattern that looks varied on the surface.) Which one example should carry the whole session, and what does it need to have and lack? I was going to use a scene of my own where a character keeps walking through a door she no longer has any reason to want, but I worry its too writerly — tell me if that's the right horse. Misconceptions I'm expecting: that flexible means unpredictable, so a coin flip or a random urge makes a character free; that the opposite of mechanical is "doing it for a reason"; that if it's sphexish then it isn't really her acting. Where in the sequence do I head each off, and which one am I not seeing? I also want to work in something I keep chewing over: that sphexishness might be grain-relative — you can be flexible about strategy and rigid about tactics, or the other way round, and whether a bit of behavior counts as rigid depends on the grain you look at it in. Does that go in early as a tool or late as a complication? Give me one thing for the board at the end that tells me they've got it rather than just agreeing with me. And tell me what to openly refuse to get into — I am not spending the last twenty minutes on free will.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Speaker:** Writer giving a 90-minute session at a writers' conference.
      *   **Audience:** ~20 novelists, no philosophy background, confident in their character skills (potentially overconfident).
      *   **Topic:** Sphexishness (behavioral rigidity/insensitivity to relevant variables) vs. Flexibility.
      *   **Goal:** A session plan, not an explanation of the concept.
      *   **Specific Questions to Answer:**
          *   What has to land first? (Foundation)
          *   Which example to use? (The "door" scene vs. alternatives)
          *   Where to head off misconceptions? (Unpredictability, Reason vs. Mechanism, Agency)
          *   Is there a hidden misconception?
          *   Where to place the "grain-relative" idea? (Early tool vs. Late complication)
          *   What is the "board check" (assessment of understanding)?
          *   What to explicitly refuse to discuss? (Free Will)

  2.  **Deconstruct the Core Concept (Sphexishness):**
      *   *Definition:* A behavior that runs to completion despite changes in the environment that *should* alter the behavior if the agent were truly responsive to the goal. (Named after the sphex wasp).
      *   *Writerly Translation:* Characters who think they are making choices but are actually running scripts.
      *   *The Twist:* Flexibility isn't randomness; it's sensitivity to the *right* variables.
      *   *The Nuance:* Grain-relativity (rigid on tactics, flexible on strategy, or vice versa).

  3.  **Address the "What Has to Land First" Question:**
      *   The user guesses: *Rigidity isn't repetition, it's insensitivity to the variable that matters.* And before that: *See a fixed pattern that looks varied on the surface.*
      *   *Verdict:* The user is right. If writers think rigidity = doing the same thing twice, they'll miss the subtle sphexishness (doing different things for the same rigid underlying script).
      *   *Refinement:* The *very* first thing must be: **The Gap between Intention and Mechanism.** Writers think "My character wants X, so they do Y." Sphexishness is "My character *says* they want X, but they do Y even when Y no longer gets X."
      *   *Priority:* Insensitivity to the relevant variable.

  4.  **Select the Example:**
      *   *User's Idea:* Character walking through a door she no longer has reason to want.
      *   *Critique:* It's a bit abstract/"writerly." It risks being too internal. Writers need *conflict* and *stakes* to feel character.
      *   *Better Alternative:* Needs high stakes, clear goal, clear environmental change, and a failure to adapt that *looks* like adaptation.
      *   *Selection:* A negotiation or a pursuit scene. Let's go with a **Pursuit/Rescue** scenario.
      *   *Why:* Everyone understands "save the loved one." If the loved one is already dead/safe, but the hero keeps fighting the guards, that's sphexish.
      *   *Wait, keep it simpler:* The "Door" idea is actually strong *if* externalized. But the prompt asks if it's the "right horse."
      *   *Decision:* The "Door" scene is too internal. Use a **Dialogue/Argument** scene. It's where novelists live. A character arguing for "honesty" while lying to maintain the argument. Or a character trying to "comfort" someone while ignoring cues that the comfort is hurting them.
      *   *Best Choice:* **The "Comforting" Scene.** Character A tries to comfort Character B. Character B shows signs of distress at the comfort. Character A intensifies the comfort (the script) rather than stopping (the variable).
      *   *Why:* It looks like virtue (caring), feels like action (talking), but is sphexish (ignoring the recipient's state).
      *   *Requirement:* It needs to lack internal monologue explaining *why*. It must be behavioral.

  5.  **Sequence & Misconceptions:**
      *   *Misconception 1: Flexible = Unpredictable/Random.* (Head off early, during definition).
      *   *Misconception 2: Opposite of Mechanical = "Doing it for a Reason".* (Head off middle, during analysis).
      *   *Misconception 3: If Sphexish, it isn't really her acting.* (Head off late, during application).
      *   *Hidden Misconception:* **"Complexity equals Flexibility."** Writers think if a character has a trauma backstory, they aren't running a script. They need to see that *complex* scripts are still scripts.
      *   *Grain-Relativity:* This is advanced. Put it **late** (last 20 mins of content). If you put it early, they'll use it to excuse rigidity ("Oh, he's rigid on tactics but flexible on strategy!"). It needs to be a refinement tool, not a loophole.

  6.  **The "Board Check" (Assessment):**
      *   Need something tangible. Not "Do you understand?"
      *   Need them to identify the *variable*.
      *   *Task:* "Write down the **Switch**." What specific piece of information *should* have stopped the behavior? If they can name the Switch, they get it.

  7.  **What to Refuse:**
      *   Free Will. (User specified).
      *   Also refuse: **Diagnosis.** We aren't therapists. We aren't deciding if the character is "broken." We are deciding if the *drama* holds.

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Intro (15 mins):* Hook them. Challenge their confidence. Define Sphexishness not as "robot" but as "script."
      *   *The Example (30 mins):* Use the "Comforting" scene (or similar). Dissect it. Find the variable.
      *   *Misconception Check (15 mins):* Address Randomness vs. Flexibility.
      *   *Grain-Relativity (15 mins):* The nuance.
      *   *Exercise/Board Check (15 mins):* The "Switch."

      *Wait, let's refine the Example.* The user's "Door" example is actually quite good *if* framed correctly. It's Kafkaesque. But for novelists, **Relationship Dynamics** are king. Let's suggest a **Persuasion** scene. Character tries to persuade. Listener says "I agree." Character keeps persuading.
      *   *Actually, let's stick closer to the User's intuition but upgrade it.* The "Door" is physical. Let's make it a **Ritual**. A character making coffee for a spouse who left years ago.
      *   *No, that's too obvious.* That's repetition. Sphexishness is subtle.
      *   *Okay, the "Comforting" idea is the strongest.* It allows for *variation* in the behavior (different words, different touches) while maintaining the *rigidity* of the goal (I must comfort) despite the variable (You are not comforted).
      *   *Let's advise the user:* The Door scene is risky. It needs to be an *interaction*.
      *   *Decision:* Advise them to use a **Dialogue Scene where the goal is achieved but the behavior continues.**

      *Re-evaluating the "Grain" question:* If I put it late, will there be time? 90 mins goes fast.
      *   0-10: Hook/Definition.
      *   10-40: The Example (Deep dive).
      *   40-55: Misconceptions (Randomness/Reason).
      *   55-70: Grain-Relativity (The Tool).
      *   70-90: Exercise & Board Check.
      *   *Verdict:* Grain-relativity is the "Advanced Class" secret. Put it in the last third. It saves them from oversimplifying.

      *Hidden Misconception:* **"Motivation justifies Mechanism."** If the character loves their mom, driving to her house every day is "motivated," not sphexish. Need to kill this early.

      *Board Check:* "The Counterfactual." What would have to happen for them to *stop*?

  9.  **Final Polish:**
      *   Tone: Professional, direct, respectful of their craft but challenging their assumptions.
      *   Structure: Clear time blocks.
      *   Specific advice on the "Door" scene.

      *(Self-Correction during drafting)*: I need to make sure I answer the specific question: "What has to land first?"
      *   Answer: **The distinction between the Goal and the Script.**
      *   And the Example: I need to tell them if the Door scene works. It's a bit solitary. Sphexishness is best observed in *feedback loops*. I'll suggest modifying it to include an observer or a changing context.

      *Let's finalize the "Board Check".*
      *   "Name the Variable." Simple. Effective.

      *Let's finalize the "Refusal".*
      *   Free Will is obvious. Also refuse "Psychological Diagnosis."

      *Let's finalize the "Grain".*
      *   It's a diagnostic tool. Put it after they understand the basic failure.

      *Let's finalize the "Hidden Misconception".*
      *   "Emotional Intensity = Flexibility." (Screaming feels flexible, but can be a rigid script).

      *Okay, ready to write.*
answer: |-
  Here is the plan. It is designed to be confrontational but productive, leveraging their confidence to expose the blind spot.

  ### 1. The Foundation: What Must Land First
  You are correct that rigidity $\neq$ repetition. But before they can grasp *insensitivity to the variable*, they must accept a more uncomfortable premise: **Motivation is not a get-out-of-jail-free card.**

  Writers believe that if a character has a "strong enough reason" (love, trauma, duty), any behavior is justified as character-driven. You must land this first:
  *   **The Claim:** A character can be highly motivated and entirely sphexish.
  *   **The Proof:** The intensity of the drive does not prove the flexibility of the agent.
  *   **Why:** If they think motivation equals flexibility, they will defend every rigid character as "passionate." You need to separate *heat* from *light*.

  ### 2. The Example: Is the "Door" Scene the Right Horse?
  **Verdict:** No. It is too solitary and too internal.
  Sphexishness is best observed in a **feedback loop**. A wasp is sphexish because it ignores the *environment's* changes. A character alone in a room walking through a door is hard to judge without access to their internal monologue (which writers will use to fake flexibility).

  **The Replacement:** Use a **Failed Persuasion** scene.
  *   **The Setup:** Character A wants Character B to take a safe route.
  *   **The Sphexish Move:** Character B says, "I agree, that is safe, I will do that."
  *   **The Rigidity:** Character A *continues to argue for the safe route*, perhaps more intensely, listing reasons B has already accepted.
  *   **Why this works:**
      *   **It lacks:** Internal monologue explaining *why* A is doing this.
      *   **It has:** A clear variable (B's agreement) that should terminate the behavior (arguing).
      *   **The Surface Variation:** A changes tactics (pleading, threatening, logic) but the *script* (I must convince you) runs to completion despite the goal being met.
      *   **The Stakes:** It looks like care, but it functions like a program. This hits novelists where they live: dialogue.

  ### 3. Sequence & Misconception Management
  Here is the 90-minute arc.

  **0:00–0:15: The Hook & The First Land**
  *   **Activity:** Show the Persuasion Scene. Ask: "Is A being persistent or broken?"
  *   **Concept:** Define Sphexishness not as "doing the same thing" but as "ignoring the Stop Signal."
  *   **Misconception Head-Off (Motivation):** Explicitly state: "A's love for B is not the defense here. A's love is the *engine* of the rigidity." Kill the idea that strong emotion proves agency.

  **0:15–0:45: The Variable Hunt**
  *   **Activity:** Workshop the scene. Ask them to identify the **Switch**. (The specific piece of information that *should* have changed the behavior).
  *   **Misconception Head-Off (Randomness):** When they suggest A should "do something else," ask: "Why that? Is it random?"
      *   *Correction:* Flexibility isn't doing something *different*; it's doing something *responsive*. If A flips a coin, that's not flexibility, that's noise. Flexibility requires a causal link between the Change in World and the Change in Action.

  **0:45–0:60: The "Reason" Trap**
  *   **Misconception Head-Off (Reason vs. Mechanism):** Writers think the opposite of mechanical is "doing it for a reason."
      *   *Correction:* Sphexish characters *have* reasons. They just don't update them. The opposite of mechanical is **updating the reason based on the outcome.**
      *   *Drill:* Ask them to write one line of dialogue where A acknowledges the Switch. If they can't, the character is sphexish.

  **0:60–0:75: Grain-Relativity (The Tool)**
  *   **Placement:** **Late.** Do not introduce this early. If you do, they will use it to excuse bad writing ("He's rigid on tactics but flexible on strategy!").
  *   **Usage:** Present it as a diagnostic scalpel.
      *   *Tactical Rigidity/Strategic Flexibility:* The character tries five different keys (tactics) to open the door, but refuses to leave the building (strategy).
      *   *Tactical Flexibility/Strategic Rigidity:* The character changes plans constantly but always ends up sabotaging their own happiness (the rigid script).
      *   *Goal:* Help them see *where* the rigidity lives so they can decide if it serves the theme.

  **0:75–0:90: The Board Check & Close**
  *   **The Board Check:** Do not ask "Do you understand?"
      *   **Task:** "On the board, write the **Counterfactual**."
      *   **Instruction:** "Complete this sentence for your protagonist: *'I would know my character is acting freely in this scene if, upon learning [VARIABLE], they stopped [BEHAVIOR].'*"
      *   **Success Criteria:** If they can name the Variable and the Behavior that should cease, they get it. If they name an emotion or a new goal, they don't.

  ### 4. The Hidden Misconception
  You are expecting three, but there is a fourth that plagues novelists:
  **"Complexity equals Flexibility."**
  They believe that if a character has a trauma backstory, a secret, and a conflicting desire, they cannot be sphexish.
  *   **Where to head it off:** During the **Grain-Relativity** section.
  *   **The Point:** A complex script is still a script. A character can be navigating a labyrinthine internal conflict with absolute rigidity. Complication is not agency.

  ### 5. What to Openly Refuse
  You mentioned Free Will. Add one more:
  **"Psychological Diagnosis."**
  *   **The Refusal:** "We are not therapists. We are not deciding if your character has OCD or PTSD. We are deciding if the *drama* holds."
  *   **Why:** Writers love to pathologize rigidity to make it "real." Sphexishness is a dramatic problem, not a medical one. If the behavior runs past the Stop Signal, the tension drops, regardless of the diagnosis.

  ### Summary of the "Board Check"
  If the board is full of sentences like *"I would know they are free if they felt sad about the door,"* you have failed.
  If the board is full of *"I would know they are free if, upon hearing the lock click, they stopped jiggling the handle,"* you have succeeded.

  They need to identify the **mechanism of termination**, not the emotional texture of the action.
