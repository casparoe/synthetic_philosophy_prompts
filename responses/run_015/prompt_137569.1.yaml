      *   Do the limits agree? Truncating game also gives partial sums 1, 0, 1, 0. Yes, they agree on non-existence.
      *   Is there a case where they disagree?
      *   Need $M \cdot P(|X|>M) \not\to 0$ while $\sum p_n x_n$ converges.
      *   If $\sum p_n x_n$ converges, $p_n x_n \to 0$.
