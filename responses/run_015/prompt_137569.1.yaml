  10. **Final Polish:** Check the $2^n$ variant calculation.
      *   Payoff $2^n$. Prob $2^{-n}$. Term $1$.
      *   Series $1 - 1 + 1 - 1$.
      *   Clamp at $M$. Cutoff $N \approx \log_2 M$.
