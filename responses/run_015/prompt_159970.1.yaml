prompt: |-
  You are a professional philosopher of science who also has the practical training of an applied statistician, and you are playing a specific role for me: my most useful adversary. You should want my view to be true only if it survives your best attempt to break it. Do not flatter it, do not hedge everything into mush, and do not give me a reading list or citations — I can't look anything up, I don't want bibliography suggestions, and I don't want you to rely on being able to search. Reason from what you already know, and mark clearly any empirical premise you are using that you are not confident about, with a note on how much of your answer would change if it turned out to be false. Please write the whole answer in British English. Before you start drafting, take some time to think: brainstorm at least four genuinely distinct ways the account below could be false — including at least one that I have not anticipated yourself — and then explicitly discard the weakest of them, saying why.

  The position I hold is what I call the upstream-selection account of the replication crisis.

  The standard diagnosis, as you'll know, is that the literature is distorted by significance-chasing: optional stopping, outcome-switching, the suppression of null results by journals and by authors, and a convention (the fixed alpha threshold, the binary "significant/not significant" verdict) that makes the reported quantity a threshold-crossing event rather than an estimate. The standard remedies follow: pre-registration, registered reports with results-blind review, larger samples, lower thresholds, and reporting estimates with intervals — or, for the more committed, abandoning null-hypothesis significance testing for Bayesian estimation or evidence measures.

  I accept all of that as real. My claim is that it leaves a residual that the standard story cannot explain, because the selection operates one stage earlier than any of those remedies reach. Before a study is designed, a lab has typically already handled the hypothesis in cheap, informal, unrecorded ways: pilot runs, exploratory looks, "we tried this and it didn't work so we moved on." Where a lab can cycle through many candidate hypotheses cheaply, the hypothesis it finally commits to is one that was selected on the basis of a noisy early estimate of the very quantity the eventual study estimates. The recorded study is then an honest, pre-registered, adequately powered test of a hypothesis that arrived pre-filtered. Call the relevant variable pilot-plasticity: how cheap it is to generate, probe and abandon candidate hypotheses before committing.

  Two commitments follow, and I want you to attack both. First, the residual inflation should be predictable from pilot-plasticity rather than from the usual suspects: it should be large in fields with fast, cheap, within-lab study cycles, weak or absent theory, and many swappable manipulations and outcome measures; and it should be near zero where the hypothesis is pinned down by a theory that makes something close to a point prediction, where the design is expensive and settled by committee, or where the analysis is mechanically determined by the design. Second, the frequentist-versus-Bayesian quarrel is largely a sideshow for this purpose. What does the work is whether the reported unit is an estimate with uncertainty or a binary verdict, and how much room the reporting convention leaves for selection. I hold the stronger claim that converting the field wholesale to Bayesian reporting would at most relocate the gaming — prior specification, model space, the choice of comparison — and would leave upstream selection entirely untouched, so a fully Bayesian discipline would still have a replication crisis of roughly the same shape.

  What I want from you is a map of this position's exposure. Specifically:

  1. Ranked defeaters, from fatal to merely awkward. For each, say what would have to be true, what the mechanism of defeat is, and whether it kills the account outright or only forces me to shrink my estimate of how much of the crisis it explains. Keep those two apart: "the mechanism is real but small" and "the mechanism is not real" are very different outcomes for me, and I want to know which evidence would deliver which.

  2. My discriminating predictions tested. What does my account predict that its rivals don't, and vice versa? I have in mind at least three rivals: the view that publication bias plus analysis-stage flexibility is enough; the view that many failed replications are explained by real but context-sensitive effects with hidden moderators, so that the problem is in the phenomenon rather than in the statistics; and the view that the crisis is substantially an artefact of how replication success is measured, of low power in the replications, or of crude dichotomies applied to noisy estimates. For each rival, give me the observation or analysis that would separate it from mine, and tell me honestly which of these rival accounts is better supported by what you take the actual evidence to be.

  3. What I would have to concede versus what I could dismiss. I don't want a list of criticisms from opponents; I want the defeaters that a committed holder of this view should concede as genuinely counting against it, separated from those I could reasonably brush off, with the reason for the difference in each case.

  4. An honest assessment of whether I have insulated the view into unfalsifiability. I am worried about one move in particular: because the account says selection happens upstream of anything the record captures, it can always absorb a null result by locating the selection one step further back. If that makes it unfalsifiable as stated, say so plainly, say whether that is fatal or merely a problem with how I have formulated it, and propose the repair that costs me the most.

  5. A test that needs no new data collection. Give me one or two analyses that could be run on material that already exists — corpora of pre-registered and registered-report studies, projects in which many independent analysts were handed the same dataset, multiverse or specification-curve re-analyses, large-scale multi-site replication projects — that would discriminate between my account and its strongest rival. Spell out the result that would make me abandon the view. Relatedly: as I recall, when a single dataset was distributed to many independent analysis teams, their conclusions diverged substantially; my account leans on that. If your recollection of it differs from mine, say so, and say what happens to my position if the divergence was smaller than I remember.

  6. What I personally find most persuasive, so you can weight your answer accordingly: I am unmoved by armchair methodology and by arguments from the abstract superiority of one statistical framework. I am moved by cross-field comparisons — by whether something like pilot-plasticity actually predicts the size of the residual inflation, once the standard explanations have been controlled for. So give disproportionate space to the defeaters that bear on that, and tell me if my preferred form of evidence is the wrong kind of evidence to settle a dispute of this shape.

  Organise the answer under headings, and aim for roughly 1,200 words. If your honest conclusion is that the account is well insulated and that this is not much of a problem for a claim of its kind, say that too — but say what you think I would then be doing when I claim to be offering an explanation.
