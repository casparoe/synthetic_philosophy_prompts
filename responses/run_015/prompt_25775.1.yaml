answer: |-
  "The Ones Who Walk Away from Omelas" serves as a profound stress test for theories of causation by omission, particularly because the causal mechanism in the story is not physical but metaphysical—a magical pact rather than a mechanical lock. When we analyze the citizens' inaction through the lens of counterfactual theories of causation (such as David Lewis's), the story initially seems to vindicate the view that omissions are causes: had the citizens intervened, the child's suffering would have ceased. However, Omelas sharply exposes the overgeneration problem you identified. If counterfactual dependence were sufficient, then you, I, and every being capable of traveling to Omelas would be causes of the child's misery. The story resolves this not through metaphysical tinkering but through *social ontology*. The citizens are causes not merely because their action would change the outcome, but because they are the designated *sustainers* of the state of affairs. This suggests that a pure counterfactual account is insufficient; it requires a supplement that looks remarkably like a normative constraint, yet one that is baked into the fabric of that world's reality. The "bargain" functions as a causal selection device, marking the citizens' omission as salient against the background of universal inaction.

  However, the story complicates this by shifting the unit of analysis from the individual to the collective. Standard literature on omissions often focuses on individual agents (e.g., a gardener failing to water a plant). In Omelas, the omission is structural; no single citizen holds the key, yet every citizen's continued residence constitutes a vote to keep the door locked. This exposes a gap in individualistic causal theories: the child's suffering is overdetermined by the collective inaction of the populace. If one citizen frees the child, the city falls; if one citizen merely *wishes* the child free but stays, the city stands. This suggests a theory of *joint causal relevance*, where the omission is distributed across the social body. A metaphysical theory that cannot account for collective agency will fail to capture why the staying citizens are causally implicated while the distant stranger is not. The "cause" here is not the physical absence of an open door, but the social presence of an agreement.

  The figure of the ones who walk away further destabilizes the relationship between causation and responsibility. Causally, the walkers are indistinguishable from those who stay regarding the child's immediate fate; a single individual departing does not alter the counterfactual conditions of the child's imprisonment, nor does it break the magical pact. If causation is a worldly relation, the walkers remain causes of the suffering (by failing to overthrow the city or free the child) just as much as the stayers. Yet, the story treats them as morally distinct. This suggests that Le Guin is positing a divergence between causal contribution and moral complicity. The walkers cannot stop the suffering, but they can stop *participating in the justification* of the suffering. This challenges normative theories of causation that试图 to collapse the two: if walking away absolves them morally but not causally, then causation cannot be solely defined by duty. Instead, the story implies that moral responsibility involves a relationship to the *narrative* of the cause, not just the cause itself.

  Ultimately, what Le Guin's narrative adds to the philosophical debate is the phenomenology of complicity. Abstract arguments about omissions often treat the agent as a detached evaluator of counterfactuals. Omelas forces us to confront the *experience* of being a cause through inaction. It reveals that the "causal" link between the citizens and the child is maintained by knowledge and acquiescence. The horror of the story is not just that the child suffers, but that the citizens' happiness is *ontologically dependent* on that suffering, making their inaction a continuous, active sustenance of the misery rather than a mere passive failure. The narrative demonstrates that in moral contexts, causation is not a static relation waiting to be discovered, but a dynamic status conferred by social participation. By dramatizing the weight of the omission, the story argues that we cannot separate the metaphysics of causation from the social structures that authorize certain inactions as "acceptable" background conditions while marking others as "causes."

  \answer{Le Guin's story ultimately argues that causation by omission cannot be resolved through metaphysical abstraction alone, because the causal status of inaction is constituted by the social and narrative structures that render agents complicit.}
