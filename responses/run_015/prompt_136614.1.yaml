answer: |-
  You have hit on one of the central fault lines in the metaphysics of personal identity. While there isn't a single eponymous "effect" (like the "Stroop Effect") that names this specific asymmetry, it is a well-documented tension in the literature.

  Philosophers generally categorize this intuition under the debate between **Psychological Continuity** and **Spatiotemporal Continuity**, specifically focusing on the problem of **Temporal Gaps** and **Causal Density**.

  Here is how this asymmetry maps onto existing philosophical frameworks, and the specific terms you can use to track it down in the literature.

  ### 1. Spatiotemporal Continuity vs. Psychological Continuity
  You noted that this isn't just "Physical vs. Psychological" because the psychology is preserved in both. However, the distinction lies in the **physical trajectory**.

  *   **The Gradual Case:** Preserves **Spatiotemporal Continuity**. There is an unbroken "world-line" of your physical substrate through space-time. Even if the matter changes, the *process* of change is continuous. There is no moment where "you" cease to exist and then start again.
  *   **The Teletransporter Case:** Introduces a **Temporal Gap** (or Spatiotemporal Discontinuity). Even if the gap is instantaneous, there is a break in the causal chain of the physical substrate. The physical object at $T_1$ is destroyed; a new one is created at $T_2$.

  In the literature, your intuition is often described as a commitment to **Spatiotemporal Continuity** as a necessary condition for identity. Many philosophers argue that psychological continuity *requires* a physically continuous vehicle to "carry" the psychology. If the vehicle is swapped instantly, the "carrier" is broken.

  ### 2. The "Closest Continuer" Theory (Robert Nozick)
  Robert Nozick, in *Philosophical Explanations*, directly addresses this asymmetry. He proposes the **Closest Continuer Theory**.

  According to Nozick, identity is not a deep, all-or-nothing fact; it is determined by which future entity is the *closest continuer* of the past entity.
  *   **Gradual Replacement:** This creates a very "close" continuer because the causal links are dense and continuous.
  *   **Teletransportation:** This creates a "distant" continuer because the causal link is discontinuous (it relies on information transfer rather than physical persistence).

  For Nozick, your intuition is correct: the gradual case is "more you" than the teletransporter case because the **degree of continuity** is higher. This maps directly onto your feeling that one is "maintenance" and the other is "duplication."

  ### 3. The "Temporal Gap" Objection
  In discussions of the Psychological Continuity Theory (Locke, Parfit, Shoemaker), a major objection is the **Temporal Gap Problem**.

  If psychological continuity is what matters, why wouldn't a 100-year gap count? If I am frozen, turned off, and restarted in 2124 with the same memories, am I the same person?
  *   **Psychological Theorists** (like Parfit) often say: Yes, provided the causality is right.
  *   **Critics** say: No, because consciousness was interrupted.

  Your intuition about the teletransporter is essentially a **Temporal Gap Intuition**. Even if the gap is milliseconds, the *stream of consciousness* (a concept from William James) is broken. The gradual case preserves the **phenomenological flow**, whereas the teletransporter interrupts the stream and starts a new one that *thinks* it is the old one.

  ### 4. Parfit's Own View (The Reductionist Challenge)
  It is crucial to note that Derek Parfit (*Reasons and Persons*) actually argues **against** your intuition regarding the teletransporter.

  Parfit admits that "Common Sense" says teletransportation is death. However, his goal is to show that Common Sense is wrong. He argues that if **Relation R** (psychological connectedness and continuity with the right cause) holds, then survival has occurred.
  *   Parfit would argue that if you accept the gradual case (which you do), you *should* logically accept the teletransporter case, because the underlying relation (psychological continuity) is the same.
  *   He suggests your intuition about the teletransporter being "death" is a leftover belief in a **Further Fact**—a magical "Ego" that resides in the physical matter. He wants you to realize that *both* cases are survival, or rather, that the question "Is it me?" is empty in both cases.

  So, in Parfitian terms, your intuition is the **"Common Sense View"** that Parfit is trying to dismantle using the **Combined Spectrum** argument.

  ### 5. Animalism and Biological Continuity (Eric Olson)
  If you want a framework that validates your intuition that the teletransporter is death, look into **Animalism** (championed by Eric Olson).

  *   **The View:** You are a biological organism.
  *   **The Teletransporter:** Destroys the organism. Therefore, you die. The Mars person is a copy.
  *   **The Gradual Case:** This is trickier for Animalists. If you replace neurons with synthetic ones, at what point does the organism cease to be a biological organism?
      *   However, many Animalists concede that if the *life process* is maintained without interruption (metabolism, homeostasis, functional integration), the organism survives even if the material changes. The teletransporter stops the life process; the gradual upgrade does not.

  ### Summary of Terminology
  If you are searching for this in the literature, use these terms:

  1.  **Spatiotemporal Continuity:** The requirement that an object's path through space-time must be unbroken.
  2.  **Causal Density / Causal Continuity:** The distinction between normal physical causation (neuron A fires neuron B) vs. informational causation (scan A builds B).
  3.  **The Temporal Gap Problem:** The question of whether identity can survive an interruption in consciousness or physical existence.
  4.  **Gradualism:** The intuition that identity is preserved by slow change but lost in abrupt change (closely related to the **Ship of Theseus**).
  5.  **Nozick's Closest Continuer:** The theory that identity is a matter of degree based on how closely the future entity tracks the past one.

  ### Verdict
  You have not discovered a new thing, but you have accurately identified the **Spatiotemporal Continuity Constraint**.

  The asymmetry you feel is the conflict between **Psychological Continuity** (which says both cases are survival) and **Spatiotemporal/Biological Continuity** (which says only the gradual case is survival). Most contemporary metaphysicians acknowledge this asymmetry as the primary reason why "Common Sense" rejects teletransportation while accepting neural replacement.

  If you want to write about this, you can frame it as: *"The tension between Relation R and Spatiotemporal Continuity in cases of Abrupt vs. Gradual Replacement."*
