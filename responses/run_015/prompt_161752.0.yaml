answer: |-
  Here is an audit of the map analogy for your charter amendment explainer.

  ### 1. The Correspondences
  *   **The Territory:** The actual political preferences and community interests of the voters.
  *   **The Map:** The composition of the City Council.
  *   **The Projection:** The Electoral System (FPTP vs. Mixed-Member).
  *   **Shape (Conformality):** Geographic constituency linkage (the 9 ward seats). Preserving "shape" means keeping the link between a specific place and a specific representative.
  *   **Area (Equal-Area):** Proportionality of vote share (the 6 citywide seats). Preserving "area" means a party with 20% of the vote gets roughly 20% of the power.
  *   **Distortion:** The inevitable loss inherent in the system (either wasted votes under FPTP or diluted accountability under pure PR).
  *   **Scale:** The size of the council (9 vs. 15).

  ### 2. The Disanalogies
  **Those that don't matter (for a 300-word explainer):**
  *   **Physical vs. Abstract:** Land is static; preferences are fluid. Voters don't need to know the math of the sphere to understand the map doesn't match the ground.
  *   **Visual vs. Functional:** A map is looked at; a council is used. The analogy holds as long as "representation" is understood as "reflecting the terrain."

  **Those that matter (the argumentative weak points):**
  *   **The "Shape" Smuggle:** In cartography, "shape" is geometric angles. In your analogy, "shape" is *accountability*. This is where the analogy quietly smuggles in its conclusion. Preserving geometric shape doesn't guarantee a councillor answers the phone; losing it doesn't guarantee they won't.
  *   **Electorate Mobility:** In cartography, the territory sits still. In politics, the rules change the territory (Duverger's Law). If you change the projection, voters change where they live (politically). Tactical voting shifts; new parties form. The map analogy implies a static reality that the amendment itself will alter.
  *   **The Opponent's "Address":** The opponent argues PR has "no address." This is weak against a *mixed* system. You still have 9 wards. The analogy breaks for them because there *are* addresses on this map.

  ### 3. The Seven-Ward Rule: A Compromise Projection?
  Yes. This rule functions as a **conformality constraint on an equal-area projection.**
  *   **What it buys:** It prevents "parachute parties" (groups that organize only online or citywide without local infrastructure). It forces citywide power to be anchored in local effort.
  *   **What it pays:** It reduces pure proportionality. A party with 10% citywide support but zero local candidates gets nothing. It privileges organized parties over spontaneous movements.
  *   **Verdict:** It stabilizes the map. Without it, the "equal-area" portion floats free of the "shape" portion. With it, the two layers are glued together.

  ### 4. Do the Conclusions Survive?
  *   **Pro ("Choice between distortions"):** **Survives.** This is the strongest intellectual claim. It admits imperfection, which builds trust. It frames the vote as a technical improvement rather than a partisan power grab.
  *   **Con ("No address on the picture"):** **Fails.** Because 9 of the 15 seats are still ward-based, the "no address" claim is factually incorrect. The imagery is carrying their argument, and the image is wrong for this specific amendment.

  ### 5. A Better Image
  The Map is good, but it implies passivity. A **"Table with Legs"** works better for a mixed system.
  *   **The Tabletop:** Citywide balance (keeps the surface level/fair).
  *   **The Legs:** Ward representatives (keep it grounded in neighborhoods).
  *   **The 7-Ward Rule:** The legs must be placed in at least 7 corners of the room, or the table doesn't stand.
  *   *Why:* It captures stability and structure better than a map, which captures only reflection.

  ### 6. The Load-Bearing Claim
  For 300 words, you cannot explain projections. You need one checkable claim that validates the compromise.

  **The Claim:** *"Citywide seats are only unlocked if a party proves it's building support across neighborhoods, not just online."*

  **Why:** It is plain language. It explains the 7-ward rule without math. It addresses the opponent's fear (faceless parties) while keeping the Pro's benefit (fairness). It allows the voter to verify the logic: "Do they have candidates near me? If not, they don't get the extra seats." That is the hinge the whole amendment turns on.
