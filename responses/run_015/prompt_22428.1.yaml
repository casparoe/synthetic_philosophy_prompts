answer: |-
  The cleanest example that isolates this tension without relying on Newcomb's boxes or ambiguous credences is **Counterfactual Mugging**.

  It demonstrates the core "weirdness" of Updateless Decision Theory (UDT): **acting to optimize a world you know you are not in.**

  ### The Setup
  Omega flips a fair coin.
  *   **Tails:** Omega gives you \$10,000 *if and only if* it predicted you would have given it \$100 had the coin come up Heads.
  *   **Heads:** Omega appears and asks you for \$100.

  You are now standing in front of Omega, and Omega is asking for \$100. You know the coin came up **Heads** (because Omega is asking).

  ### The Tension
  Both EDT and UDT agree on your **credences**: You are 100% certain the coin is Heads. You know the Tails world is counterfactual. You know paying \$100 will not cause Omega to give you \$10,000 *in this branch* (that opportunity is gone).

  **Evidential Decision Theory (EDT) says: Don't Pay.**
  EDT conditions on your current observation: *"I am in the Heads world."*
  *   If I pay: I lose \$100. (The Tails reward is impossible now).
  *   If I don't pay: I lose \$0.
  *   **Verdict:** Keeping the \$100 is strictly better given what you know *now*.

  **Updateless Decision Theory (UDT) says: Pay.**
  UDT ignores the update that "The coin is Heads." It asks: *"What policy should I have committed to before the coin was flipped?"*
  *   Policy "Pay if Asked": Ex-ante expected value = (50% × -\$100) + (50% × \$10,000) = **+\$4,950**.
  *   Policy "Don't Pay": Ex-ante expected value = (50% × \$0) + (50% × \$0) = **\$0**.
  *   **Verdict:** You must execute the "Pay" policy, even though you now know you are in the losing branch.

  ### Why This Is Conceptually Weird
  This isn't a disagreement about probability (both agree it's Heads). It isn't a standard gamble (you aren't betting on the coin; the coin is already settled).

  The tension is about **moral weight across counterfactuals**. UDT requires you to sacrifice utility in the *actual* world to satisfy a logical condition that only pays off in a *possible* world you know is false.

  To a student, the "weird part" is this: **UDT treats your decision algorithm as a logical object that exists in all possible worlds simultaneously.** By paying in the Heads world, you aren't changing the Heads world; you are "making true" the fact that your algorithm is the kind that pays, which allows your *counterfactual counterpart* in the Tails world to collect the reward.

  It forces the agent to view themselves not as a localized actor maximizing current evidence, but as a global function maximizing output across all inputs, even those that didn't happen.
