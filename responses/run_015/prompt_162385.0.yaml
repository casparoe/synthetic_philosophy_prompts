answer: |-
  This is a precise philosophical dissection task. You are asking whether the Replication Crisis constitutes a *new species* of Pessimistic Meta-Induction (PMI) or whether it exposes a flaw in the standard formulation of PMI itself.

  Here is the disciplined mapping of the Replication Crisis onto the PMI, followed by an analysis of the "Successor Problem," the implications for Realism, and the boundaries of the induction.

  ### 1. The Target of the Induction: Posits vs. Regularities

  In the classic PMI (Laudan, Lewis), the target is the **theoretical posit**.
  *   *Case:* The caloric theory of heat.
  *   *Status:* The posit (caloric fluid) is false.
  *   *Concession:* The empirical regularities (heat flows from hot to cold) remain true.
  *   *Realist Rescue:* Structural realism saves the mathematical relations; reference realism saves the idea that "caloric" referred to thermal energy.

  In the Psychology Replication Crisis, the target shifts. It is not merely the **theoretical posit** (e.g., "the self is a finite resource"), but the **empirical regularity** itself (e.g., "performance on Task B declines after Task A").

  *   **Mapping:** When ego depletion fails to replicate, we are not just learning that the *mechanism* (glucose/resource) was wrong; we are learning that the *phenomenon* (the correlation) was likely a statistical artifact.
  *   **Implication:** This is a stronger induction than the classic PMI. Classic PMI says, "Your map of the territory is wrong." The Replication Crisis PMI says, "There is no territory here."
  *   **Target Identification:** The induction targets **causal claims treated as stable regularities**. In physics, we assume $F=ma$ holds even if our understanding of *mass* changes. In the replication crisis, the "law" itself evaporates. This makes the target **ontologically thinner** but **epistemologically more devastating**.

  ### 2. The Successor Problem: Vanishing vs. Absorption

  You identified the critical friction point: *Realist rescues presuppose a successor theory.*

  *   **Classic PMI Shape:** Theory A (False) $\to$ Theory B (True). Theory B explains why Theory A worked approximately. (Aether $\to$ Spacetime; Phlogiston $\to$ Oxygen).
  *   **Replication Crisis Shape:** Theory A (Significant) $\to$ Null Result. There is no Theory B. There is only silence.

  **Does this hurt Realism more?**
  Yes. Structural Realism and Preservationism rely on *continuity*. They argue that while the *nature* of the entity changes, the *structure* of the relations is preserved.
  *   If ego depletion vanishes, there is no structure to preserve. You cannot be a structural realist about a null set.
  *   This suggests the Replication Crisis is not a case of **theoretical falsehood** (which PMI addresses) but of **methodological illusion**.

  **The Metaphysical Shift:**
  In the classic cases, the error was *ontological* (we posited a thing that didn't exist). In the replication crisis, the error is often *statistical* (we posited a signal that was noise).
  *   **Realism's Vulnerability:** If the crisis is purely statistical, it doesn't attack Realism about the *world*; it attacks Realism about the *literature*. A scientific realist can say, "There is a fact of the matter about ego depletion (it doesn't exist), and we eventually found it."
  *   **The PMI Twist:** However, if the PMI is reformulated as "Most published positive results are false," then the Replication Crisis validates the PMI *without* requiring theoretical change. It validates a **Skeptical Meta-Induction**: "Most claims accepted as knowledge at $T_1$ are rejected as error at $T_2$."

  ### 3. What This Says About the PMI Itself

  The Replication Crisis forces a modification of the PMI's premises.

  **A. The "Success" Premise Needs a Robustness Clause**
  The standard PMI argues: "Past theories were empirically successful; therefore, success is not a guide to truth."
  The Replication Crisis reveals that "success" (p < 0.05) was not robust.
  *   **Revision:** The PMI must distinguish between **fragile success** (dependent on specific analytical choices, low power) and **robust success** (invariant across methods, labs, and operationalizations).
  *   **Implication:** The PMI applies strongly to fields where "success" is defined by fragile statistical thresholds. It applies weakly to fields where success is defined by instrumental precision or prediction (e.g., orbital mechanics).

  **B. Induction Over Methods, Not Just Posits**
  The classic PMI is an induction over *theories*. The Replication Crisis is an induction over *practices*.
  *   If the failure is due to p-hacking and publication bias, the induction targets the **sociological structure of the field**, not the **metaphysical structure of the world**.
  *   **Verdict:** This suggests the PMI was never purely metaphysical. It was always partly sociological. The Replication Crisis makes this explicit: theories die not just because nature refutes them, but because the scientific community fails to filter noise.

  **C. The Need for a "Successor Clause"**
  You asked if PMI needs a successor-theory clause.
  *   **Argument:** If a theory vanishes without a successor, it wasn't a *theory* in the robust sense; it was a *hypothesis* that failed.
  *   **Mapping:** Phlogiston was a theory because it structured a whole domain of chemistry. Ego depletion was a hypothesis within a broader framework of self-regulation.
  *   **Conclusion:** The PMI holds best against **mature theoretical frameworks**. The Replication Crisis largely targeted **mid-range hypotheses**. This limits the scope of the PMI: it warns us against reifying fragile effects, but it doesn't necessarily condemn the entire enterprise if the enterprise can distinguish between fragile effects and robust structures.

  ### 4. Local vs. Global Pessimism: Where Does It Stop?

  If we accept the "Replication PMI" (most published findings are false), why doesn't it spread to physics or chemistry?

  **The Stopping Point: Causal Isolation and Measurement Stability**
  *   **Psychology:** The "instruments" are human beings and social contexts. The "measurement" is often behavioral self-report or reaction time, which is noisy and context-sensitive. The signal-to-noise ratio is low.
  *   **Physics:** The instruments are isolated from the phenomenon (to a degree). The signal-to-noise ratio is high.
  *   **The Spread:** The pessimism spreads to any field where:
      1.  Effect sizes are small.
      2.  Measurement is indirect or noisy.
      3.  Researcher degrees of freedom are high.
      *   *This includes:* Medicine (clinical trials), Economics, and parts of Biology (cancer biology replication issues).
      *   *This stops at:* Physics, Chemistry, Astronomy.

  **Why Local Pessimism doesn't kill Global Realism:**
  The Replication Crisis supports **Local Anti-Realism** regarding specific, fragile posits in high-noise fields. It does not support **Global Anti-Realism** because the *mechanism of failure* is identifiable and localizable (statistical power, flexibility).
  *   In the classic PMI, the failure was thought to be inherent to *theoretical reference* (we can't ever latch onto unobservables).
  *   In the Replication Crisis, the failure is inherent to *inferential statistics in complex systems*.
  *   **Realist Rescue:** A realist can argue, "Psychology is hard because the ontology is complex and context-dependent, not because truth is inaccessible." The failure is epistemic difficulty, not metaphysical impossibility.

  ### 5. Where the Analogy Breaks (Explicit Limits)

  There are three points where mapping the Replication Crisis to the classic PMI fails:

  1.  **The Nature of the Falsehood (Ontology vs. Artifact):**
      *   *Classic PMI:* The aether *did not exist*. The theory was ontologically wrong.
      *   *Replication Crisis:* In many cases (e.g., power posing), the data was *manufactured* (via selection/p-hacking). The "falsehood" isn't that the theory was a bad approximation of reality; it's that the evidence was never there to begin with.
      *   *Break:* PMI assumes the past scientists were *rational agents responding to evidence* that turned out to be misleading. The Replication Crisis suggests many were *generating misleading evidence*. This shifts the blame from **Nature** (it's hard to know) to **Practice** (we did it wrong).

  2.  **Trajectory (Progress vs. Retraction):**
      *   *Classic PMI:* Science progresses by replacing false theories with truer ones. The PMI worries we are currently on a false rung.
      *   *Replication Crisis:* Science progressed by *deleting* claims. This is **pruning**, not **replacement**.
      *   *Break:* PMI presupposes a ladder of theories. The Replication Crisis shows a thicket where some branches are cut off entirely. This undermines the "ladder" metaphor required for the induction to feel threatening. If we are just clearing away weeds, we aren't necessarily on a false rung; we are just gardening.

  3.  **The Role of Statistics:**
      *   *Classic PMI:* Statistics are rarely the focus. The math of Newtonian mechanics is sound; the ontology of absolute space is the issue.
      *   *Replication Crisis:* The math (NHST) *is* the issue.
      *   *Break:* You cannot run a PMI on the *logic of inference* in the same way you run it on *physical posits*. If the tool of measurement is biased, you don't conclude "nothing is measurable"; you conclude "calibrate the tool." The Replication Crisis is a calibration event, not a metaphysical refutation.

  ### Summary Verdict

  The Replication Crisis is **not** a standard instance of the Pessimistic Meta-Induction.

  *   **Standard PMI:** "Our best theories are likely false about unobservables."
  *   **Replication PMI:** "Our published positive results are likely false about observables."

  This distinction is vital. The Replication Crisis hurts **Empiricism** (the idea that we can reliably observe regularities) more than it hurts **Realism** (the idea that there is a mind-independent world).

  **Does it hurt Realism more than classic cases?**
  In one sense, yes: there is no successor theory to preserve structure.
  In another sense, no: because the error is methodological, not metaphysical. A realist can embrace the Replication Crisis as evidence that science is self-correcting. The classic PMI argues science *cannot* correct itself regarding truth; the Replication Crisis shows science *is* correcting itself (albeit painfully).

  **Final Mapping:**
  The Replication Crisis transforms the PMI from a **Metaphysical Argument** (we can't know the nature of reality) into a **Sociological/Methodological Warning** (incentive structures in high-noise fields produce false positives). It stops spreading where measurement noise drops and causal isolation rises. It does not refute Realism; it refutes **Naive Empiricism** about published literature.
