      *   *PMI Implication:* Does this strengthen PMI? PMI says "current theories will be falsified." Psychology says "current theories were never verified." PMI presupposes *success* that turns out to be false. The Replication Crisis suggests *illusory success*. This is a subtle but vital distinction. PMI requires past theories to be *empirically adequate* (predictively successful). Did ego depletion have predictive success? Yes, initially. But it was noise masquerading as signal.
