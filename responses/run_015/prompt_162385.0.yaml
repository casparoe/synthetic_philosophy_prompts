      *   *Cases:* Bem (precognition), Ego Depletion (self-control resource), Power Posing (hormones/behavior).
      *   *Outcome:* Not replacement, but *elimination*. The effects didn't get refined; they largely disappeared upon rigorous re-testing.
      *   *Cause:* Methodological artifacts (p-hacking, low power, flexibility) rather than theoretical misunderstanding of a real mechanism.
