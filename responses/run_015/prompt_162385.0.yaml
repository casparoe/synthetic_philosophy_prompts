      *   *Standard Form:* History shows past successful theories were false (regarding unobservables). Current successful theories are similar in status. Therefore, current theories are likely false (regarding unobservables).
      *   *Target:* Usually theoretical entities/mechanisms (electrons, genes, caloric).
      *   *Realist Rescue:* Structural realism (relations hold), Approximate truth, Reference preservation (phlogiston $\to$ oxygen).
      *   *Crucial Feature:* There is usually a *narrative of progress*. Old theory was wrong, but new theory explains *why* old theory seemed right and captures some truth.

