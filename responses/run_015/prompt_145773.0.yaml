      *   *The Requested Problem:* What if the selection history supports *two distinct* functions that imply *different* truth conditions?
      *   *The "Interpretive Layer" Threat:* If biology gives us two equally valid functions, choosing one over the other looks like *us* (the theorists) interpreting the animal, rather than nature fixing the content. This breaks the "fully naturalized" promise.

