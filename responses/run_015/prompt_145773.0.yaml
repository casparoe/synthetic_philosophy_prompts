      *   *Function B (Social De-escalation):* Selected because freezing/submission signals non-threat to aggressive conspecifics. Content: "I acknowledge your dominance/Aggressive conspecific is present."
      *   *The Clash:* Imagine a scenario where a *non-predator, non-dominant* novel object triggers this. Or, more importantly, imagine the *conditions of satisfaction*.
      *   *Wait, let's tighten the "Incompatible Content" aspect.*
      *   If Content A = "Predator Present" (Truth condition: Is there a predator?)
      *   If Content B = "Social Submission Required" (Truth condition: Is there a dominant conspecific?)
      *   If the mechanism fires when a dominant conspecific is present *without* lethal intent, Content A is false (no predator), but the action is adaptive for Function B.
      *   If the mechanism fires when a predator is present, Content B is technically false (no social ranking context), but adaptive for Function A.
      *   *The Overdetermination:* The *same token* neural state is maintained in the gene pool for *both* reasons equally. There is no historical fact of the matter prioritizing one over the other.

