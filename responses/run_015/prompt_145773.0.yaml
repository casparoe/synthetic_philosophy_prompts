answer: |-
  ### The Problem of Dual-Proper Functions in Teleosemantics

  Teleosemantics aims to naturalize mental content by grounding it in biological history. The core promise is that what a mental state *means* is fixed by what the mechanism producing it was selected *for* (its proper function). Standard objections focus on indeterminacy (e.g., does the frog's detector represent "fly" or "black dot?"). However, a deeper conceptual issue arises from **functional overdetermination**: cases where evolutionary history supports two distinct, equally robust proper functions for a single mechanism, each implying incompatible truth conditions.

  This is not merely a case of a mechanism malfunctioning (misrepresentation); it is a case where the biology itself fails to privilege one semantic content over another. This forces the theorist to import an interpretive layer to resolve the tie, undermining the claim that teleosemantics eliminates the need for interpretation.

  #### The Concrete Case: The Primate "Avoidance" Mechanism

  Consider a specific neurocognitive mechanism in a species of macaque, which we will call the **$\alpha$-Avoidance Module**. When activated, this module triggers a specific motor program: an immediate cessation of movement (freezing) and a retreat to higher ground.

  Phylogenetic analysis reveals that the $\alpha$-Avoidance Module was preserved in the gene pool for two distinct, co-equal reasons over the last 2 million years:

  1.  **Function A (Predator Avoidance):** The mechanism allowed ancestors to evade leopards. Leopards often ambush from low brush; freezing and climbing breaks the visual lock and removes the monkey from the strike zone.
      *   **Consumer System:** The motor systems involved in evasion and survival.
      *   **Implied Content:** $\langle$ **Lethal Predator Nearby** $\rangle$.
      *   **Truth Condition:** The state is accurate only if a lethal predator is present.

  2.  **Function B (Social De-escalation):** The mechanism allowed subordinates to avoid aggression from dominant conspecifics. In this species, dominant males often assert authority by displacing subordinates from low ground. Freezing and retreating signals submission and prevents physical conflict.
      *   **Consumer System:** The social-regulation systems involved in hierarchy maintenance.
      *   **Implied Content:** $\langle$ **Dominant Conspecific Nearby** $\rangle$.
      *   **Truth Condition:** The state is accurate only if a dominant conspecific is present.

  #### The Content Clash

  The problem arises when we examine a specific token activation of the $\alpha$-Avoidance Module in a modern monkey. Suppose a **dominant male** rustles the bushes nearby, triggering the module. The monkey freezes and climbs.

  From the perspective of **Function A**, the mental state is a **misrepresentation**. There is no lethal predator; the content $\langle$ **Lethal Predator Nearby** $\rangle$ is false. The mechanism is "lying" to the motor system about the nature of the threat, even though the action (climbing) is beneficial.

  From the perspective of **Function B**, the mental state is a **true representation**. The content $\langle$ **Dominant Conspecific Nearby** $\rangle$ is true. The mechanism is accurately tracking the social environment.

  Standard teleosemantics handles misrepresentation by appealing to the *proper function*. If the function is Predator Avoidance, then triggering on a Dominant Male is a false positive (misrepresentation). But here, **both are proper functions.** The gene survived *because* it did both jobs. Neither function is parasitic on the other; neither is a recent evolutionary add-on; both contributed equally to reproductive fitness.

  #### Why This Threatens Naturalization

  This overdetermination creates a specific breach in the naturalization project. Teleosemantics claims to fix content "from the outside," using only objective facts about selection history, thereby removing the need for a theorist to *interpret* what the animal means. However, in the $\alpha$-Avoidance case, the objective facts run out.

  **1. The Disjunction Problem Returns:**
  One might argue the content is simply disjunctive: $\langle$ **Predator OR Dominant Male** $\rangle$. But this collapses the possibility of error in a way that contradicts the specific physiology. If the monkey freezes for a *falling branch* (neither predator nor dominant), is it a misrepresentation?
  *   If the content is disjunctive, the branch doesn't fit, so it's a misrepresentation.
  *   But if the content is disjunctive, we lose the explanatory power of *why* the specific motor program was selected. The motor program for "Predator" (hide silently) is subtly different from "Dominant" (signal submission). If the mechanism lumps them, the content should reflect the lump. But if the content reflects the lump, we cannot explain why the monkey *doesn't* climb for a non-threatening dominant male (if the social function requires submission only to *aggressive* dominants). The specific truth conditions matter for explaining behavior, and biology gives us two specific sets, not a disjunction.

  **2. The Necessity of an Interpretive Layer:**
  To assign a definitive content, the teleosemanticist must decide which Proper Function is *semantically privileged*.
  *   Do we prioritize the **Survival Consumer**? (Content = Predator)
  *   Do we prioritize the **Social Consumer**? (Content = Dominant)

  Nature provides no fact of the matter here. Both consumers utilize the same signal to guide action successfully in their respective domains. There is no "master consumer" in the brain that adjudicates between the survival system and the social system; they are parallel adaptive pressures.

  Consequently, the choice of content becomes a decision made by **us, the theorists**. We must *interpret* the evolutionary history and decide which function feels more "fundamental" to the organism's cognition. Perhaps we argue that survival is more basic than social ranking. But this is a philosophical priority, not a biological one. If the social function were removed, the organism might die from conspecific violence; if the predator function were removed, it might die from predation. Both are vital.

  **3. The Breakdown of the "View from Nowhere":**
  Teleosemantics promises a "view from nowhere" account of content—content exists independently of human interpretation, just as digestion exists independently of human interpretation.
  *   In digestion, the stomach's function is to break down food. If it fails, it's indigestion. There is no overdetermination of the stomach's function that leads to incompatible definitions of "food."
  *   In the $\alpha$-Avoidance case, the "semantic digestion" is ambiguous. If we must step in to weigh the functions to determine whether the monkey's state is *true* or *false* in the Dominant Male scenario, then **mental content is not fully naturalized.** It remains partially constituted by our theoretical interests in how we categorize the animal's history.

  #### Conclusion

  The $\alpha$-Avoidance case demonstrates that selection history does not always map 1:1 onto semantic content. When a mechanism is an evolutionary "Swiss Army knife" serving two masters with different conditions of satisfaction, teleosemantics cannot identify a unique content without extra-biological stipulation. This reintroduces the very interpretive layer the theory sought to eliminate: we are forced to interpret the organism's history to tell us what its mind represents, rather than letting the history speak for itself.
