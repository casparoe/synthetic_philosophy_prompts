answer: |-
  You have put your finger on one of the most significant, yet rarely articulated, tensions in regulatory philosophy. You are right: logically, a new molecule starts in the same state whether it is packaged as a "drug" or a "supplement." It is absent from the market. The difference in treatment is not dictated by physics or chemistry, but by **legal categorization**, which acts as the proxy for your "baseline."

  To answer your question: No, the principle is not empty, but the way we currently apply it is heavily influenced by political history and specific assumptions about human agency.

  Here is an breakdown of the assumptions underlying each policy, an analysis of your "Baseline Problem," and what happens if we try to force consistency.

  ### 1. The Underlying Assumptions
  The inconsistency isn't random; it rests on three distinct philosophical pillars regarding **Consent**, **Necessity**, and **Epistemology** (what we can know).

  #### A. Prescription Drugs (The "Paternalist" Model)
  *   **Assumption about Consent:** **Asymmetric Information.** The patient is vulnerable (sick) and lacks the expertise to evaluate risk. The doctor acts as a gatekeeper, but the regulator must gatekeep the doctor.
  *   **Assumption about Necessity:** **High Stakes Intervention.** Drugs are used to alter physiology to cure disease. The status quo is *illness*. The risk of the drug is weighed against the certainty of the disease.
  *   **Assumption about Epistemology:** **Precautionary.** Because the biological mechanism is potent and the population is vulnerable, we assume *unknown harm is likely* until proven otherwise.
  *   **The Logic:** "You are trying to change the system. Prove you know how the system works before you touch it."

  #### B. Herbal Supplements (The "Libertarian" Model)
  *   **Assumption about Consent:** **Consumer Sovereignty.** The buyer is (theoretically) healthy and seeking optimization, not cure. They are free to take risks with their own body.
  *   **Assumption about Necessity:** **Low Stakes Maintenance.** Supplements claim to "support" structure or function, not treat disease. The status quo is *health*.
  *   **Assumption about Epistemology:** **Naturalistic Fallacy.** There is an underlying assumption that "natural" substances (herbs) carry a lower burden of proof than "synthetic" ones (chemicals), despite toxicity being chemistry-agnostic.
  *   **The Logic:** "You are not forcing this on anyone. If adults want to buy it, let them. The regulator only steps in if people start dying visibly."
      *   *Note:* In the US, this is largely due to the 1994 DSHEA act, a political compromise that codified this assumption into law.

  #### C. Food Additives (The "Hidden Risk" Model)
  *   **Assumption about Consent:** **No Consent.** You cannot opt out of a preservative in a loaf of bread. This is an **imposition**.
  *   **Assumption about Necessity:** **Ubiquity.** Everyone eats. A risk here is a population-wide risk, not an individual choice.
  *   **The Split (US vs. EU):**
      *   **EU:** Assumes **Epistemic Humility.** "We don't know if this new chemical is safe, so it is banned until proven safe." (Precautionary Principle).
      *   **US:** Assumes **Historical Precedent (GRAS).** "If it's chemically similar to things we've eaten for 20 years, it's probably fine." This shifts the baseline from "Safety" to "Familiarity."

  ### 2. The Baseline Problem: Is it Arbitrary?
  You asked: *Both the drug and the supplement start off equally absent from the market, so it looks like the principle is empty until somebody just picks a baseline by hand.*

  You are correct that the *market* baseline (presence vs. absence) is arbitrary. However, regulators do not use the market as the baseline; they use **Human Physiology** as the baseline.

  *   **Drug Baseline:** The body is malfunctioning. The intervention is **Restorative**.
  *   **Food/Supplement Baseline:** The body is functioning. The intervention is **Additive**.

  **Is there a non-arbitrary way to set the baseline?**
  Yes, but it requires shifting from "Is it safe?" to "Who bears the cost of error?" and "Can the user detect the error?"

  1.  **Reversibility:** If a drug fails, you might die. If a supplement fails, you might waste money or get a headache. (This distinction is often false—kava can destroy your liver—but it is the *regulatory* assumption).
  2.  **Detectability:** If a food additive poisons you, you don't know which ingredient did it. If a pill hurts you, you know it was the pill.
  3.  **The Non-Arbitrary Rule:** The burden of proof should scale with **Information Asymmetry** and **Exit Costs**.
      *   *High Asymmetry + High Exit Cost (Death)* = Pre-market approval (Drugs).
      *   *Low Asymmetry + Low Exit Cost* = Post-market surveillance (Supplements).
      *   *High Asymmetry + No Exit Option* = Pre-market approval (Food Additives).

  **Where the system breaks:** The current system allows supplements to occupy a "Goldilocks" zone where they have the *risk* of drugs (potent biochemistry) but the *regulation* of food (low burden). This is where your "Baseline Problem" reveals the inconsistency: We treat supplements as if the consumer has high agency, but market them with claims that exploit low agency (fear of illness).

  ### 3. The Consistency Thought Experiment
  What happens if we drop the arbitrary baselines and apply one consistent rule?

  #### Scenario A: The "Drug Standard" for Everything (Maximum Precaution)
  *Rule:* Any new substance ingested by humans must prove safety and efficacy in clinical trials before sale.
  *   **Result:** Innovation freezes.
      *   New food preservatives? Banned.
      *   New vitamin formulations? Banned.
      *   New crop varieties? Banned.
  *   **Cost:** The cost of bringing a new food product to market would rise from thousands to hundreds of millions of dollars. Only massive conglomerates could innovate.
  *   **Benefit:** We avoid the "body count." We rarely discover *after* the fact that a new sweetener causes cancer.
  *   **Verdict:** Society generally rejects this because it treats "potential risk" as equal to "certain stagnation."

  #### Scenario B: The "Supplement Standard" for Everything (Maximum Liberty)
  *Rule:* Companies can sell anything; regulators can only ban after proving harm.
  *   **Result:** A Darwinian market.
      *   Thalidomide (birth defects) happens again.
      *   Opioids are marketed as non-addictive without proof (actually happened).
      *   Food supply becomes a chemical experiment.
  *   **Cost:** Measured in morbidity and mortality. The "body count" becomes the data source for safety.
  *   **Benefit:** Rapid innovation, lower costs, high consumer freedom.
  *   **Verdict:** Society rejects this because the "externalities" (public health costs, death) are too high to be borne by individuals.

  ### 4. The Synthesis: A "Sliding Scale" of Claims
  The only non-arbitrary way to resolve this is to stop regulating the **Substance** and start regulating the **Claim**.

  Currently, the inconsistency exists because we categorize by *package* (Drug vs. Supplement). A consistent system would categorize by *promise*.

  1.  **The "Cure" Claim:** If you claim to treat, cure, or mitigate a disease (e.g., "Lowers blood pressure"), you must meet the **Drug Standard**. (Pre-market proof of safety + efficacy).
  2.  **The "Structure" Claim:** If you claim to support normal function (e.g., "Supports heart health"), you meet the **Supplement Standard**. (Post-market safety, no efficacy proof required).
  3.  **The "Nutrient" Claim:** If you claim to nourish (e.g., "Contains Vitamin C"), you meet the **Food Standard**. (Must be on the "Safe List").

  **Why this solves the Baseline Problem:**
  It removes the arbitrariness of "what is this pill?" and replaces it with "what are you promising?"
  *   If you promise to fix a broken system, you bear the burden of proof.
  *   If you promise to maintain a working system, the consumer bears the risk.
  *   If you impose a substance without a promise (additive), the state bears the burden (in the EU) or history bears the burden (in the US).

  ### Summary
  Your worry is correct: The current baseline *is* partially arbitrary, driven by 1990s lobbying (for supplements) and cultural differences (US vs. EU food).

  However, the underlying logic isn't empty. It attempts to balance **Liberty** (freedom to ingest) against **Harm** (public health).
  *   **Drugs:** We restrict liberty to prevent harm because the user is vulnerable.
  *   **Supplements:** We allow liberty to accept harm because the user is (theoretically) voluntary.
  *   **Additives:** We restrict liberty to prevent harm because the user is involuntary.

  The inconsistency arises because **Supplements are sold to vulnerable people (the sick) under the guise of voluntary choice.**

  If we were truly consistent, we would either:
  1.  **Block everything new** (The EU Food approach applied to Supplements): Safe, but stifling.
  2.  **Wait for the body count** (The US Supplement approach applied to Drugs): Innovative, but deadly.

  The middle path—which we claim to take but fail to enforce—is: **The burden of proof must match the magnitude of the claim.** If you claim the power of a drug, you must do the work of a drug maker, regardless of whether you call it an herb, a supplement, or a vitamin.
