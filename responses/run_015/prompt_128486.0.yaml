      *   *Self-Correction on Food Additives:* Be careful distinguishing US GRAS vs. EU Pre-market. The user noted this. Acknowledge that the US system assumes "historical consumption" equals safety, which is the loophole.
      *   *Deepen the Baseline Argument:* The baseline isn't "Market Absence." It's "Human Physiology."
          *   Drug: Trying to change physiology.
          *   Food: Trying to sustain physiology.
          *   Supplement: Ambiguous.
          *   Therefore, the burden should track the *magnitude of deviation from normal function*.

  5.  **Final Review against constraints:**
      *   Keep it structured.
