      *   **Topic:** Universal Basic Income (UBI) and its underlying philosophical presuppositions.
      *   **Task:** Provide a *committed* answer (not a survey) reconstructing the theory of welfare, entitlement, and personhood that best rationalizes UBI's specific design features (uniformity, cash, individual, unconditional).
      *   **Requirements:**
