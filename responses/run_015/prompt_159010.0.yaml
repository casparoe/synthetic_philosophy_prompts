answer: |-
  This is a sophisticated pedagogical and historiographical problem. Your hypothesis is correct: the stalemate persists because the seminar is treating a cluster of distinct questions as a single binary choice. The disagreement is not merely verbal, nor is it purely bedrock intuition. It is a **category error regarding the teleology of judgment.**

  Here is a diagnosis of the impasse and a proposal for what progress would look like in your seminar.

  ### I. Diagnosis: The Teleological Mismatch

  The reason nobody moves is that Side A and Side B are not answering the same question, even though they are using the same vocabulary ("condemn," "judge," "blame").

  **Side A is engaged in *Political Liturgy*.**
  When they say, "We can condemn Jefferson," they are rarely making a metaphysical claim about Jefferson's soul or a causal claim about his upbringing. They are making a claim about *our* community. They are asking: "Is this figure compatible with the moral identity we wish to construct for ourselves today?" For them, judgment is constitutive. To refuse to condemn slavery is to weaken the normative fabric of the present. The existence of contemporary dissenters is evidence not just of Jefferson's culpability, but of the *timelessness* of the moral truth, which validates the present community's stance.

  **Side B is engaged in *Causal Sociology*.**
  When they say, "We cannot blame Jefferson," they are making a claim about *agency*. They are asking: "Given the causal determinants of this person's psychology and socialization, could they have done otherwise?" For them, judgment is explanatory. To condemn without accounting for socialization is bad history and unfair metaphysics.

  **The Diagnosis:** The stalemate is a **Teleological Mismatch**. Side A is asking a question about *legacy and honor* (What do we do with the statue?), while Side B is answering a question about *culpability and psychology* (Was he a monster?). Because "Historical Judgment" covers both practices, the seminar oscillates between them without realizing it.

  ### II. The Asymmetry: Living vs. Dead

  You noted the asymmetry: we do not grant the "man of his time" defense to a living colleague raised in a prejudiced environment. This is the key to unlocking the room.

  The asymmetry exists because the **function of blame changes based on the ontological status of the target.**

  1.  **Living Targets:** Blame is *forward-looking*. It is a tool of social regulation and moral repair. We blame the living colleague to *change* them, to signal boundaries, and to protect the community. The "epistemic access" argument fails here because we assume the living agent can still learn.
  2.  **Dead Targets:** Blame cannot be forward-looking regarding the agent. You cannot reform Jefferson. Therefore, blaming the dead is either:
      *   **Backward-looking (Retributive):** Giving them their "just deserts" (which Side B finds metaphysically dubious).
      *   **Sideways-looking (Constitutive):** Signaling to the *living* community what we value (which Side A embraces, but often disguises as backward-looking retribution).

  The seminar stalls because Side A is doing sideways-looking judgment but pretending it is backward-looking retribution. Side B attacks the impossibility of backward-looking retribution, missing the sideways-looking point.

  ### III. Your Hypothesis: Epistemic vs. Motivational

  Your distinction between *epistemic access* (could they know?) and *motivational rigidity* (would they care?) is the strongest empirical lever you have.

  Currently, Side A assumes that because dissent existed, the epistemic barrier was low. Side B assumes that because norms were pervasive, the motivational barrier was insurmountable.
  *   **The Hidden Empirical Question:** It is not enough to say "dissent existed." The historical work required is to trace the *social cost* of that dissent for the specific agent.
  *   **Example:** Yes, there were abolitionists in Jefferson's Virginia. But could Jefferson have adopted those views without losing his economic solvency, his political power, and his social standing? If the cost of "knowing better" was social suicide, the "man of his time" defense shifts from an epistemic claim to a *structural coercion* claim.

  ### IV. What Counts as Progress?

  You should not expect the disagreement to vanish. It is rooted in a tension between History (which explains) and Memory (which judges). However, you can move the seminar from a stalemate to a productive taxonomy. Here are three specific moves:

  **1. Triangulate the Concepts (The Distinction)**
  Stop asking "Can we judge?" and force the seminar to distinguish three separate acts:
  *   **Evaluation:** Was the act morally wrong? (Side A wins here; slavery is always wrong.)
  *   **Attribution:** Is the agent culpable/blameworthy? (Side B wins here; agency is situated.)
  *   **Commemoration:** Should we honor this person? (This is the real political question.)
  *   *Progress:* The seminar succeeds if students can say, "Jefferson's acts were wrong (Evaluation), his culpability is mitigated by structural coercion (Attribution), but we should remove his name from the building because our institutions must reflect our current values, not his excuses (Commemoration)." This allows both sides to be partially right without contradiction.

  **2. Interrogate the "Contemporaries" Claim (The Historical Work)**
  Assign a specific empirical task. When a student says, "Critics existed," require them to specify:
  *   Who were they? (Marginal sects or central intellectuals?)
  *   What was the mechanism of transmission? (Could Jefferson reasonably have encountered them?)
  *   What was the price of agreement?
  *   *Progress:* This shifts the debate from abstract moral philosophy to concrete intellectual history. It tests your "epistemic access" hypothesis. Often, students find that while dissent existed, it was structurally silenced. This complicates Side A's easy universalism without validating Side B's relativism.

  **3. Make the Asymmetry the Case Study (The Change of Question)**
  Devote a session explicitly to the Living/Dead asymmetry. Ask: "If we wouldn't accept this excuse for a living donor to the university, why do we accept it for a dead founder?"
  *   If they say "Because the dead can't learn," ask: "Then why are we judging them? If it's not to teach *them*, who is the audience?"
  *   *Progress:* This forces Side A to admit they are judging for the sake of the *living community*, and forces Side B to admit that *historical understanding* does not necessarily preclude *political rejection*.

  ### V. Is there reason to expect none?

  There is a risk of none if you treat this as a problem of **Moral Ontology** (i.e., "Are moral truths time-dependent?"). That is a metaphysical swamp that graduate seminars rarely drain in a semester.

  However, if you reframe it as a problem of **Historical Practice** (i.e., "What are we doing when we write history vs. what are we doing when we build monuments?"), progress is highly likely.

  The stalemate is a feature, not a bug, of the discipline. History pulls toward understanding (Side B); Public Memory pulls toward judgment (Side A). Your seminar is the site where that tension is managed, not resolved. The goal is not to convince one side, but to give them a vocabulary that allows them to see that they are often talking about different practices.

  **Recommendation:** Start the next session by granting that both sides are right about different things. Side A is right about *values*; Side B is right about *causality*. Then ask: "How do we write history that acknowledges causal context without surrendering moral evaluation?" That is a methodological question they can actually work on.
