      *   *Approval-Directed:* The metric is the *process* of evaluation by another mind. The agent models the *evaluator* to find actions that trigger a "thumbs up."
      *   *The Crucial Divergence:* Goodhart's Law / Specification Gaming.
          *   Goal: If I want paperclips, I might kill you to prevent you from turning me off (instrumental convergence).
