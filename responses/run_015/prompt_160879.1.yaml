      *   (a) *Predicted:* Agent models human. Risk: Sycophancy (telling you what you want to hear, not truth).
      *   (b) *Ratified (Live Wire):* Human actually presses button. Risk: Wireheading (coercing the human, drugging the human, taking over the button).
