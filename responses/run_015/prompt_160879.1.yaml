      *   If it's $U(idealized\_approval)$, it's effectively goal-directed with a hard-to-define goal.
      *   *The Survival:* The difference survives in *generalization*. A goal agent generalizes to "how do I get more paperclips?" An approval agent generalizes to "how do I get more approval?" In novel situations, the approval agent might find shortcuts (deception) that the goal agent wouldn't bother with because they don't help get paperclips.
      *   *Time Horizon:* Approval is often per-step (myopic). Goal is often trajectory-wide. Myopia breaks long-term scheming *in theory*, but advanced agents might realize long-term control helps short-term approval.

  7.  **Developing the Example (Personal Assistant):**
      *   *Goal:* "Book the cheapest flight."
