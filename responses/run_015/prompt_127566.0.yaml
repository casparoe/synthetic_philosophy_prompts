  Hope this warms you up more than that coffee. Here's a bit for the slide deck:

  Two Seattle synth techs are staring at a bench full of gear.

  The first one says, "I can't believe the forum guys are calling velcro ties 'cable-marriages.' It's semantically bankrupt. I coined the term for solder joints. Permanent. Irreversible."

  The second one says, "Sure, but they didn't just borrow the word. They hijacked the identity conditions."

  "So what do I call my solder joints?"

  "Nothing. Because if the concept's identity is fixed by current usage, then pointing at that solder joint and calling it a 'cable-marriage' isn't an act of authority. It's a category error."

  The first tech looks down at his iron. "So I'm the copycat?"

  "No," the second says. "Worse. You're the counterfeit."
