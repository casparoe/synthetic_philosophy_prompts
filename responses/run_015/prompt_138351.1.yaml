          *   *Better:* The Engineering evidence is *ambiguous* on its own. It needs the Political evidence to be interpreted correctly? No, that's too complex.
          *   *Best:* The "Political" evidence is actually *true* but labeled false? No, Ground Truth must be objective.
          *   *Let's stick to Nguyen:* Echo chamber members *reject* valid evidence because the source is discredited.
          *   *Setup:* Ground Truth = Engineering.
          *   *Evidence:* Engineering cards are clear. Political cards are clear but contradict Engineering.
          *   *Wait, if Ground Truth is Engineering, Political cards are False.*
          *   *Nguyen's point:* Echo chambers reject *true* information because the source is discredited.
          *   *Okay, Revision:* Ground Truth = **Mixed**. (e.g., 60% Engineering, 40% Political). Or, Ground Truth = Engineering, but the *best* evidence for Engineering comes from a source labeled "Corrupt."
          *   *Yes!* The "Smoking Gun" for the Truth is held by the "Corrupt" source.
          *   *Group A (Bubble):* Gets the Smoking Gun from a "Clean" source. (Easy win).
          *   *Group B (Echo):* Gets the Smoking Gun from the "Corrupt" source. They reject it. They lose.
          *   *Archive Round:* Group B gets the Smoking Gun again, still from that source. They reject it harder.
          *   *Fix:* Someone must vouch for the "Corrupt" source to unlock the card's value.

      *   *Let's refine the "Smoking Gun":*
          *   Truth: Project failed due to **Engineering**.
