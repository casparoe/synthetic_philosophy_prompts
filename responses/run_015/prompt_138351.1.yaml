      *   *Archive Round:* Group B gets the raw Political data (no stamp). Because they were primed to distrust, they might reject it *or* the sheer volume of "corrupt" info makes them double down on Engineering even if Engineering is ambiguous.
      *   *Wait, the prompt says:* "In an echo chamber the other side is present but has been discredited in advance, so more exposure to it hardens you."
      *   *Adjustment:* In the Archive Round, give Group B *more* of the "Political" info. If they trust the initial briefing, more Political info = more evidence of "conspiracy" = harder to accept the Engineering truth.
      *   *Actually, simpler:* The "Political" info is misleading.
          *   Truth: Engineering.
