prompt: |-
  hey — I teach a first-year seminar on information and democracy: 24 students, one 80-minute block, no laptops in the room (we do everything on paper and index cards, I hand things out). I want a single-session game that makes them feel the difference between an epistemic bubble and an echo chamber — the usual distinction (Nguyen's version, I think): in a bubble the other side is simply missing from your feed, in an echo chamber the other side is present but has been discredited in advance, so more exposure to it hardens you rather than moving you.

  The problem with every version of this I've tried is that the two look identical from the inside — everyone feels like they've looked into it and come to their own conclusion — and if I explain the distinction up front the whole thing dies. So I want the difference to show up in the data the game produces, not in anything I say. They shouldn't hear either term until afterwards.

  What I have in mind, roughly, and you should throw out whatever doesn't work: a fictional controversy nobody has priors about (I was thinking an invented 1970s transit project — did it fail because of the engineering or because of the financing? — with a ground truth only I know, so I can score them at the end and being wrong costs them something). Over four or five rounds each student recieves a private bulletin of source-cards. Group A's bulletins just omit the sources that tell against the project. Group B's bulletins include those same sources, but they've been attributed, in an earlier round, to a source their own in-group already has a reason to distrust. Then one round where I open the archive and every source is available to everyone: same intervention, same room, same minute, opposite responses. Points for accuracy, so there's a real if small stake — a participation credit and a coffee voucher for the winning team.

  Two things I especially want built in:

  1. A diagnostic that seperates the two mechanisms from behaviour, not from self-report. My idea was a steelman round — before any reveal, everyone writes the strongest version of the other side's case — on the theory that the bubble group literally can't (they've never seen the arguments) while the echo-chamber group can write it beautifully and still won't move. If you've got a less transparent instrument, or one that doesn't tip the design, use it instead.

  2. The bit I care most about and can't find a game for anywhere: the fixes are different, and asymmetric. Adding sources fixes a bubble; adding sources to an echo chamber makes it worse. What moves an echo chamber is trust repair, and trust repair has a cost structure — the only channel that seems to work is an in-group member vouching for the discredited source, and vouching spends their own credibility, so it's a volunteer's-dilemma-ish setup: everyone would be better off if one respected person went first, but each individual loses by going first. I want that priced into the game as an actual move students can make or decline, with a payoff scheme that makes declining individually rational, so that the room visibly gets stuck and can see itself stuck.

  What I need from you: the fictional case and the actual card text (or enough of it that I can write the rest myself), a materials list, setup instructions, a round-by-round timeline with minute marks, the payoff scheme, the diagnostic and how to score it in five minutes, and a debrief that maps specific moments in the session onto the two mechanisms.

  Also, honestly: what will go wrong the first time I run it, and what do I do in each case? I assume at least these three — someone works out the design by round two and starts playing along, the distrust priming in group B doesn't take, and nobody cares enough about a fake transit project to hold an opinion at all. And be frank about what the game can't reproduce and I'll have to say out loud: the years-long trust history, the identity investment, the fact that real ones are entered into voluntarily by trusting the wrong people.

  Last thing: give me a confidence note on the design as a whole. How confident are you that it actually seperates the two mechanisms rather than just measuring general open-mindedness or persuadability, and single out the one claim you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** First-year seminar, Information & Democracy. 24 students, 80 minutes, no tech (paper/index cards).
      *   **Goal:** Distinguish between *Epistemic Bubbles* (missing information) and *Echo Chambers* (discredited information/trust issues) without defining them upfront. The distinction must emerge from data/behavior.
      *   **Core Mechanics:**
          *   Fictional controversy (no priors).
          *   Two groups (Bubble vs. Echo).
          *   Rounds of information gathering.
          *   "Archive Open" round (everyone gets all info).
          *   Diagnostic: Steelman round (can they articulate the other side?).
          *   Fix Mechanism: Trust repair (in-group vouching) with a volunteer's dilemma cost structure.
      *   **Deliverables:** Fictional case, card text, materials list, timeline, payoff scheme, diagnostic/scoring, debrief, failure modes/mitigation, limitations, confidence note.
      *   **Constraint:** Do not reveal terms until the end.

  2.  **Deconstruct the Challenge:**

      *   *The "Inside View" Problem:* As the user noted, bubbles and echo chambers feel the same from the inside. The game needs to force a behavioral divergence.
      *   *The "Fix" Problem:* Bubbles are fixed by *more info*. Echo chambers are broken by *more info* (it reinforces distrust) but fixed by *trust transfer*. This needs to be gamified.
      *   *The "Stakes" Problem:* Students need to care about a fake 1970s transit project. Incentives (coffee voucher) help, but the narrative needs weight.
      *   *The "Trust" Problem:* How to simulate "discredited source" without real-world baggage? Need an artificial reputation system.

  3.  **Develop the Fictional Case:**

      *   *Idea:* 1970s Transit Project. Let's make it specific. "The Oakhaven Maglev Proposal, 1974."
      *   *Question:* Did it fail due to *Technical Flaws* (Engineering) or *Political Sabotage* (Financing/Corruption)?
      *   *Ground Truth:* Let's say it was *Technical Flaws*. (Arbitrary, but needs to be fixed for scoring).
      *   *Sources:* Need names that sound like agencies or experts.
          *   Pro-Technical: "Dept. of Transport Engineering," "Dr. Aris Thorne."
          *   Pro-Political: "City Planning Council," "Rep. Elena Vance."
      *   *Group A (Bubble):* Gets only Pro-Technical sources. Never sees Pro-Political.
      *   *Group B (Echo):* Gets Pro-Technical sources. *Also* gets Pro-Political sources, BUT those sources are labeled as "Compromised" or "Biased" by a trusted intermediary in Round 1.

  4.  **Design the Mechanics (The "Trust" & "Fix"):**

      *   *Reputation Currency:* Give students "Credibility Points" (CP).
      *   *Round 1 (Priming):* Group B gets a "Briefing Card" that establishes a trusted authority (e.g., "The Oversight Committee") which labels the opposing sources as corrupt. Group A gets no briefing or a neutral one.
      *   *Round 2 (Evidence):* Both get evidence cards. Group A misses the opposing evidence. Group B gets it but with the "Corrupt" stamp.
      *   *Round 3 (The Steelman/Diagnostic):* Write the opposing argument.
      *   *Round 4 (The Archive/Open):* Everyone gets *all* raw cards.
          *   *Hypothesis:* Group A changes minds (Bubble burst). Group B digs in (Echo reinforced).
      *   *Round 5 (The Fix/Volunteer's Dilemma):* To win the big prize, the group needs to agree on the Truth.
          *   Group A just needs to read the new cards.
          *   Group B needs someone to *vouch* for the "Corrupt" source.
          *   *Cost:* Vouching costs personal CP. If the group wins, everyone gets points. If you vouch, you lose CP. If you don't vouch but group wins, you keep CP + Win Bonus. This creates the free-rider problem.

  5.  **Drafting the Content (Iterative Refinement):**

      *   *Refining the Trust Mechanism:* The "Oversight Committee" needs to be established as trustworthy *before* they discredit the other side.
      *   *Refining the Fix:* How does vouching work? A student can surrender their "Credibility Token" to validate a "Corrupt" card. If enough tokens are surrendered, the card becomes "Validated."
      *   *Wait, simpler:* Let's make it a group decision. To accept the "Political" evidence in Group B, a "Trust Broker" must emerge.
      *   *Better:* Let's use the "Credibility Points" as the stake.
          *   Winning Team: 5 CP each.
          *   Vouching Action: Cost 2 CP.
          *   If the group converges on the Truth *and* the "Corrupt" evidence was necessary to find it, those who vouched get a "Integrity Bonus" (maybe net neutral), but the risk is if the group *doesn't* converge, the voucher loses 2 CP for nothing.
          *   *Actually, the prompt asks for a Volunteer's Dilemma:* "Everyone better off if one goes first, but individual loses by going first."
          *   *Mechanism:* To unlock the "Corrupt" cards for scoring, a student must publicly sacrifice their chance at the Coffee Voucher (or CP). If *anyone* does it, the whole group can access the truth. If no one does, the group remains stuck in the echo.
          *   *Let's go with:* "Endorsement Tokens." Each student has 1. To validate a distrusted source, someone must spend their Token. If the group finds the truth, everyone gets 5 points. Spenders get 3 (net loss relative to free riders). Non-spenders get 5. If no one spends, everyone gets 0.

  6.  **Timeline & Logistics:**

      *   80 Minutes is tight.
      *   0-10: Setup & Rules.
      *   10-25: Round 1 & 2 (Info Gathering).
      *   25-35: Diagnostic (Steelman).
      *   35-50: The Archive (The Divergence).
      *   50-65: The Fix (Volunteer's Dilemma).
      *   65-80: Scoring & Debrief.

  7.  **Addressing Failure Modes:**

      *   *Someone figures it out:* They become a "chaos agent." Give them a role (Observer) or lean into it.
      *   *Distrust doesn't take:* Make the "Trust Authority" very official looking (stamps, seals).
      *   *Don't care:* Make the stakes social + tangible (Coffee). Make the narrative dramatic (waste of public funds).

  8.  **Addressing Limitations:**

      *   Real echo chambers involve identity. This is just points. Need to acknowledge this in debrief.
      *   Real trust takes years. This is 10 minutes.

  9.  **Confidence Note:**

      *   High confidence on the Bubble mechanic.
      *   Medium confidence on the Echo mechanic (simulating deep distrust is hard).
      *   Low confidence on the Volunteer's Dilemma triggering naturally in 15 mins (students might just cooperate). Need to make the cost feel real.

  10. **Refining the "Fix" Mechanism (Crucial Step):**
      *   The prompt specifically wants: *Adding sources to an echo chamber makes it worse.*
      *   So, in Round 4 (Archive), when Group B gets the "Corrupt" cards *without* the trust repair, they should actually move *further* away from the truth or stay stuck.
      *   Then, the Trust Repair (Vouching) allows them to use that info.
      *   *Payoff:* If Group B accepts the "Corrupt" info without vouching, they get penalized (misinformation penalty). If they vouch, the info becomes safe.
      *   *Volunteer's Dilemma:* To make the info safe for *everyone*, *someone* must pay a cost. If no one pays, the info remains "toxic" (risky to use for scoring).

      *Revised Fix Mechanism:*
      *   To count the "Political" cards toward the final answer, the group must "Certify" them.
      *   Certification requires 1 student to surrender their Coffee Voucher eligibility (or CP).
      *   If certified, everyone can use the cards to find the truth and win CP.
      *   If not certified, using the cards risks a penalty.
      *   Rational choice: Hope someone else certifies.
      *   Outcome: If no one certifies, group fails to find truth (stuck).

  11. **Final Polish:** Check against constraints. No laptops. Index cards. 24 students. 80 mins. Nguyen's distinction.

      *   *Self-Correction on "Distrust Priming":* How to ensure Group B distrusts the source?
      *   *Method:* In Round 1, give Group B a "Security Briefing" from a trusted source (The "Audit Bureau") that lists the opposing sources as "Compromised." Group A gets no briefing.
      *   *Ground Truth:* Engineering Failure.
