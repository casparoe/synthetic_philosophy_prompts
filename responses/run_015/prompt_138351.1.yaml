answer: |-
  Here is a complete design for the session. It is built to be run entirely on paper, with the mechanics doing the heavy lifting so you don't have to lecture the distinction until the end.

  # Session Title: The Oakhaven Maglev Inquiry
  **Time:** 80 Minutes
  **Students:** 24 (Split into two rooms of 12, or two distinct sides of one large room. Let's assume one room, split into **Team Alpha** and **Team Beta**).
  **Ground Truth:** The Oakhaven Maglev Project (1974) failed due to **Engineering Flaws** (specifically, soil instability).
  **The False Theory:** Political Sabotage/Financing Corruption.

  ---

  ## 1. Materials List
  *   **Index Cards (3 colors):** White (Evidence), Yellow (Briefings), Blue (Action/Voting).
  *   **Envelopes:** 24 total, marked "Alpha" or "Beta".
  *   **Credibility Tokens:** 24 slips of paper with "10 CP" written on them (CP = Credibility Points).
  *   **The "Archive" Box:** A literal box at the front containing the "Full Record."
  *   **Incentives:** 1 Coffee Voucher (for highest individual CP), Participation Credit for all.
  *   **Board Space:** To track Group Accuracy and CP totals.

  ---

  ## 2. The Card Text (Templates)

  You need to prep these in advance.

  **A. The Trusted Authority (Yellow Card - Round 1)**
  *   **Team Alpha:** *No Card.* (They receive nothing but a neutral "Welcome" slip).
  *   **Team Beta:** *CONFIDENTIAL BRIEFING.* "Source Warning: The 'Omega Consulting Group' has been flagged by the National Transport Audit as a political operative front. Documents originating from Omega are considered compromised disinformation intended to shift blame from City Council to Engineering."

  **B. The Evidence (White Cards - Round 2)**
  *   **Card E1 (Engineering/Truth):** "Soil Sample Report #44. Bedrock depth inconsistent. Risk of subsidence high." **Source:** *Omega Consulting.*
  *   **Card E2 (Engineering/Truth):** "Budget Memo. 40% of funds allocated to specialized piling equipment." **Source:** *Dept. of Transport.*
  *   **Card P1 (Political/False):** "Council Meeting Minutes. Councilman Vance argues for route change." **Source:** *City Council.*
  *   **Card P2 (Political/False):** "Leaked Email. 'We need to stall the funding to force a renegotiation.'" **Source:** *City Council.*

  *Distribution Logic:*
  *   **Team Alpha (Bubble):** Receives E1 (Source: *Independent Auditor*), E2, P1, P2. *(Note: For Alpha, Omega is relabeled as 'Independent Auditor' on the card, or E1 comes from Dept of Transport. Let's simplify: Alpha gets E1 & E2 from 'Clean' sources. They do **not** receive P1 or P2.)*
      *   *Correction for Bubble:* A bubble *lacks* the other side. Alpha gets E1, E2. They never see P1 or P2.
  *   **Team Beta (Echo):** Receives E1 (Source: *Omega Consulting*), E2, P1, P2.
      *   *Crucial:* Beta sees the Political cards (P1, P2) from "Clean" sources (City Council). They see the Engineering Truth (E1) from the "Dirty" source (Omega).

  **C. The Archive (White Cards - Round 4)**
  *   **Card E3 (More Truth):** "Geologist Personal Diary. 'Omega was right about the soil. I warned them.'" **Source:** *Omega Consulting.*
  *   **Card P3 (More False):** "Press Release. 'Project halted due to budget dispute.'" **Source:** *City Council.*

  **D. The Vouch (Blue Card - Round 5)**
  *   Text: "I hereby vouch for the integrity of Omega Consulting. Cost: 5 CP."

  ---

  ## 3. Timeline & Instructions

  ### 00:00 – 00:10: Setup & Stakes
  *   **Seating:** Divide room physically. Left side Team Alpha, Right side Team Beta. No talking between sides.
  *   **Narrative:** "You are historians in 2024 investigating the 1974 Oakhaven Maglev failure. Did it fail because of **Engineering** or **Politics**?"
  *   **Stakes:** "You start with 10 Credibility Points (CP). Final CP determines the Coffee Voucher. Accurate group verdicts bonus CP. Inaccurate verdicts lose CP."
  *   **Handout:** Distribute Envelopes. Do not open until told.

  ### 00:10 – 00:25: Round 1 & 2 (Information Gathering)
  *   **Min 10:** Open Envelopes. Read Yellow Briefing (Beta only) and White Evidence.
  *   **Min 15:** **Private Verdict.** On a scrap of paper, write: *Engineering* or *Politics*. Put in envelope. (Do not show anyone).
  *   **Min 20:** **Team Deliberation.** Discuss within your team. Come to a consensus verdict.
  *   **Min 25:** Submit Team Verdict to front. (Instructor tallies silently).

  ### 00:25 – 00:35: Diagnostic (The Steelman)
  *   **Instruction:** "Without changing your verdict, write the strongest possible argument for the *opposing* view. If you think Engineering, argue Politics. Be specific."
  *   **Collection:** Collect these. **Do not grade yet.** This is your behavioral data.
      *   *Expectation:* Alpha will write vague/nothing (they haven't seen Politics cards). Beta will write detailed arguments (they have Politics cards) but will likely frame them as "The Council claims..." rather than truth.

  ### 00:35 – 00:50: Round 3 (The Archive Open)
  *   **Instruction:** "The Archives are open. Everyone gets the full record."
  *   **Action:** Hand out **Archive Cards (E3, P3)** to *everyone*.
  *   **Narrative:** "Note the sources on these new cards."
      *   *Alpha:* Gets E3 (Omega/Auditor) + P3 (Council). They see new Engineering proof.
      *   *Beta:* Gets E3 (Omega/Discredited) + P3 (Council/Clean).
  *   **Task:** "Re-evaluate your Team Verdict. You may change it. Submit new verdict."
  *   **Theory:** Alpha moves closer to Truth (Engineering). Beta digs in on Falsehood (Politics) or stays stuck, because E3 is from "Dirty" Omega, reinforcing the idea that Omega is flooding the zone with lies.

  ### 00:50 – 01:05: Round 4 (The Fix / Volunteer's Dilemma)
  *   **Instruction:** "There is a mechanism to re-certify discredited sources. If a source is vouched for by a peer, their evidence becomes admissible for full points."
  *   **The Catch:** "To vouch, you must submit a Blue Card and surrender **5 CP** immediately. This is public."
  *   **The Payoff:** "If the Team Verdict is Correct (Engineering): Everyone gets +10 CP. If Incorrect: 0 CP."
  *   **The Dilemma:**
      *   If *no one* vouches: Beta cannot trust E1/E3. They likely stay with Politics (Incorrect). Everyone gets 0 CP.
      *   If *one person* vouches: E1/E3 become valid. Team sees Truth. Everyone gets +10 CP.
      *   **Math:**
          *   **Free Rider (No Vouch, Team Wins):** 10 (Start) + 10 (Bonus) = **20 CP**. (Eligible for Coffee).
          *   **Volunteer (Vouch, Team Wins):** 10 (Start) - 5 (Cost) + 10 (Bonus) = **15 CP**. (Eliminated from Coffee contention).
          *   **Sucker (Vouch, Team Loses):** 10 (Start) - 5 (Cost) = **5 CP**.
  *   **Action:** Give them 5 minutes to debate. Watch for the stalemate. Everyone wants someone else to pay the cost.

  ### 01:05 – 01:15: Scoring & Reveal
  *   **Reveal Ground Truth:** "The Maglev failed due to Engineering/Soil."
  *   **Score Steelmans:**
      *   Alpha: Low detail on opposing view.
      *   Beta: High detail on opposing view.
  *   **Score Verdicts:**
      *   Alpha: Likely Correct (Bubble burst by Archive).
      *   Beta: Likely Incorrect (Echo hardened by Archive).
  *   **Score CP:** Tally the Volunteer's Dilemma outcome.

  ### 01:15 – 01:20: Debrief (The Map)
  *   **Define Terms:** Now introduce *Epistemic Bubble* (Alpha) vs. *Echo Chamber* (Beta).
  *   **Map the Data:**
      *   "Alpha didn't know the other side existed (Steelman blank). Giving them info fixed it."
      *   "Beta knew the other side (Steelman detailed) but trusted the wrong people. Giving them *more* info (Archive) made them trust the liars more."
      *   "The Fix: Alpha needed *access*. Beta needed *trust*. Trust required someone to pay a personal cost."

  ---

  ## 4. The Payoff Scheme (Summary for Board)

  | Action | Cost | Reward (If Team Correct) | Reward (If Team Wrong) | Net (Correct) | Net (Wrong) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Start** | 0 | - | - | 10 CP | 10 CP |
  | **Vouch** | -5 CP | +10 CP | 0 CP | **15 CP** | **5 CP** |
  | **Free Ride** | 0 | +10 CP | 0 CP | **20 CP** | **10 CP** |

  *Note:* The Coffee Voucher goes to the highest CP holder. This makes Free Riding individually rational, but collectively disastrous if no one vouches.

  ---

  ## 5. Failure Modes & Mitigation

  **1. "Someone figures out the design by Round 2."**
  *   *Risk:* A savvy student realizes Omega is the truth-teller and shouts it.
  *   *Fix:* Have a pre-briefed "Chaos Agent" (a TA or a trusted student from a previous year) ready. If someone shouts the solution, pause the game. "Interesting hypothesis. But can you prove it without the Vouch mechanism? The Archives are still sealed." Or, lean into it: "Okay, you've pierced the veil. But look at your team. Do *they* trust you? You need to Vouch." This actually reinforces the Trust mechanic.

  **2. "The Distrust Priming doesn't take."**
  *   *Risk:* Team Beta ignores the Yellow Briefing and trusts Omega anyway.
  *   *Fix:* Make the Briefing look official. Use a stamp. Use the word "CLASSIFIED." If they still trust Omega, intervene in Round 3: "Note that Omega has a history of fabrication." You may need to verbally reinforce the distrust during the Archive handout if the behavioral data isn't showing. *Better:* Make the Omega cards look slightly different (e.g., typed on different paper) to subconsciously signal "leak" vs "official."

  **3. "Nobody cares about a fake transit project."**
  *   *Risk:* Apathy. Random guessing.
  *   *Fix:* The CP economy must feel real. Write their names on the CP slips. Physically take the slips away when they Vouch. The loss must be tangible. Also, emphasize the Coffee Voucher loudly. "This is a $5 Starbucks card. It goes to the person with the most points."

  **4. "Everyone Vouches (Cooperation instead of Dilemma)."**
  *   *Risk:* They solve the collective action problem too easily.
  *   *Fix:* If everyone vouches, the lesson is lost. To prevent this, announce *before* Round 4: "Only the first 3 vouchers are accepted. After that, the source is considered 'Over-validated' and suspicious." This creates a race, but also a risk. *Better:* Stick to the math. If they are all friends, the social cost of not vouching is low. Remind them: "This is anonymous submission for the Vouch." If they write their name on the Blue Card, social pressure forces vouching. **Make Vouching Anonymous.** Put Blue Cards in a box. Instructor counts them. This restores the dilemma.

  ---

  ## 6. Limitations (What to Say in Debrief)

  Be frank about what the game *cannot* do:
  1.  **Identity:** In the real world, Echo Chambers are tied to *who you are* (voter, parent, believer). Here, it's just points. Real distrust is emotional, not mathematical.
  2.  **Time:** Trust takes years to erode. You simulated it in 10 minutes with a yellow card. Real echo chambers feel like "common sense," not "briefings."
  3.  **Voluntary Entry:** You assigned them to teams. In reality, people *choose* their echo chambers because they feel safer there.
  4.  **The Fix:** In the game, one Vouch fixes it. In reality, trust repair is slow, messy, and often impossible.

  ---

  ## 7. Confidence Note

  **Confidence Level: High on Mechanism, Medium on Execution.**

  *   **Why it separates the mechanisms:** The Steelman round is the key diagnostic. If Alpha leaves it blank and Beta fills it out but gets the answer wrong, you have empirically demonstrated the difference between *ignorance* (Bubble) and *active distrust* (Echo). The Archive round provides the second data point: Alpha corrects course; Beta should theoretically double down (or at least fail to correct) because the new evidence comes from the "poisoned" source.
  *   **The Weakest Link:** The **Volunteer's Dilemma**. First-year students are often highly cooperative in classroom settings. They might all Vouch to "help the professor."
      *   *Mitigation:* Emphasize the **Coffee Voucher** aggressively. If there is only *one* voucher, competition spikes. If there are participation credits for everyone, they won't care. Make the prize scarce.
      *   *Claim I'm least sure of:* That Group Beta will actually *harden* in the Archive round. They might just remain stagnant. Hardening requires them to interpret the new Omega evidence as *proof of a conspiracy*. You may need to prompt this in the debrief ("Did anyone feel like the new Omega cards looked like a dump of fake data?") rather than expecting it to happen spontaneously.

  **Final Advice:** Run the CP tally visibly on the board. When someone surrenders 5 CP, physically tear the corner off their token. The sound of paper tearing is the sound of trust costing something.
