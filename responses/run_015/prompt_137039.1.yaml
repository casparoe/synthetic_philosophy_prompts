answer: |-
  You are correct that expectation shapes perceptual experience, but the differing protocols arise from conflicting goals rather than contradictory theories, since clinical practice maximizes patient-specific accuracy using all available priors while screening maximizes statistical validity by isolating the image signal from clinical noise.

  Modern vision science supports your view over your friend's strict modularism: perception is not a passive camera feed but an active inference process where top-down predictions modulate neural processing in early visual areas, not just decision thresholds. While Signal Detection Theory correctly identifies that history shifts the response criterion (making you more willing to call a lesion), empirical evidence shows it also increases sensitivity (d-prime) by guiding attentional resources to relevant features and reducing ambiguity in noisy data. Your friend's claim that this is purely a post-perceptual judgment shift is falsified by eye-tracking studies demonstrating that clinical history alters search patterns and fixation durations, proving that expectation changes where and how deeply the image is processed, not just how the final report is written.

  The contradiction in practice is pragmatic, not philosophical. In clinical care, the goal is Bayesian optimization: you want the posterior probability of disease to incorporate the prior probability from symptoms, so you give the radiologist the note to reduce false negatives for suspected conditions. In screening and trials, the goal is to measure the intrinsic performance of the imaging modality itself; if readers know the history, you cannot distinguish whether a correct diagnosis came from the scan or the referral note, inflating the perceived utility of the technology. Furthermore, screening aims to catch unexpected pathology (e.g., finding lung cancer on a mammogram referral), which is inhibited by "satisfaction of search" biases triggered by specific clinical questions.

  To distinguish the stories empirically, you would need to measure neural activity in early visual cortex (V1/V2) alongside behavioral responses while manipulating expectations; if expectation alters V1 activity correlated with detection, perception is penetrable, whereas if only prefrontal decision areas light up, your friend is right. Current data suggests both occur, but the attentional modulation of visual cortex supports your claim that experience itself is shaped.

  The practice is underdetermined regarding the philosophy of mind because both modular and penetrable theories license giving the radiologist the note. Even if perception were fully encapsulated, the note remains vital for directing attention (a pre-perceptual selection process) and setting decision criteria (a post-perceptual judgment process). Therefore, if the encapsulated view were true, we would still hand over the referral note, because doing so optimizes the search strategy and the final verdict even if it doesn't change the raw qualia of the image. The divergence in protocol exists because clinical medicine prioritizes individual truth (diagnosis) while research prioritizes methodological purity (validation), not because radiologists hold inconsistent theories of vision.
