prompt: |-
  Me and my mate got into a massive argument about this last night and I need someone smarter than us to settle it. Here's the practice I can't work out. In a normal hospital, the radiologist reads your scan with the referral note in front of them: the GP's guess, your symptoms, your previous imaging. As far as I can tell everyone in that field treats this as making them *better* at spotting what's actually on the image, not just more confident about it. But then in screening programmes (breast screening, say) and in pretty much every imaging trial, the readers are deliberately kept blind: no history, no old scans, often two readers who don't see each other's reports, with a third person adjudicating disagreements. So the same profession acts one way in the clinic and the opposite way in the trial.

  What does the first practice presuppose about perception? Does giving someone the history only make sense if what you believe can reach into what you literally see — if expectation and theory can shape the experience itself and not just the judgement you make afterwards? Or can you get the exact same policy out of a view where perception is modular and encapsulated, plus something boring about where the eye goes and how long it lingers? Is there a stable middle position where top-down stuff moves your attention around but not the content of what you see, and does that middle position explain the practice or just sit next to it?

  And then the bit my friend kept pushing: maybe all of this is a red herring, and what's really happening is expertise plus signal detection — the history shifts how willing you are to say "yes, that's a lesion" without touching the experience at all. I said that can't be the whole story, because the way people miss things that are there and find things that aren't seems shaped by what they were expecting in a way that feels more like seeing than likeThreshold-setting. Who's closer, and what would we actually have to observe to tell those two stories apart? Also: where is the practice just underdetermined, so that several quite different theories of perception would all license doing it exactly this way? And if the encapsulated/modular view were true, should we be handing the radiologist the referral note at all?

  Lead with your bottom line in the first sentence, then give me the reasoning. No preamble and don't restate my question back at me.
