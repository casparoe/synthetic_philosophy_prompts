answer: |-
  ### Brainstorm Pass: What is Compulsory Voting Actually For?

  Before dissecting the package, we need to be clear about the possible jobs compulsory voting (CV) is being asked to do. In the literature and in practice, these goals often get muddled, but they are distinct:

  1.  **Legitimacy by Numbers:** The state wants high turnout to claim a mandate. Low turnout looks like weakness or apathy. CV guarantees the government can say "90% of people participated."
  2.  **Representative Equality:** Voluntary voting skews toward the wealthy, educated, and older. CV forces the poor, young, and disaffected into the mix, forcing parties to campaign for everyone, not just likely voters.
  3.  **Civic Duty/Republicanism:** Voting is like jury duty. It's not about what you want; it's about showing up to maintain the republic. The act itself is the value.
  4.  **Social Cohesion:** When everyone votes, politics becomes a shared national experience rather than a mobilization of bases. It dampens polarization.
  5.  **Administrative Predictability:** Knowing roughly how many people will show up helps with staffing and logistics (though high turnout makes this harder, certainty makes it easier).
  6.  **Anti-Boycott Stability:** It prevents organized groups from delegitimizing an election by staying home.

  Now, let's walk through your package item by item to see which of these jobs it's actually trying to do, and where the wiring crosses.

  ***

  ### (a) The Nature of Compulsion (Items 1–2)

  **What is being compelled?**
  Item 1 says you must "turn up." Item 2 says a blank ballot is fine, but a written-on ballot is a failure. This combination tells us that the state is not compelling a *choice*, nor is it compelling *deliberation*. It is compelling **public acquiescence**.

  In most CV systems (like Australia or Belgium), you can submit an informal ballot (blank or scribbled) and you have satisfied the law. The state doesn't care what you do inside the booth, only that you went. Your package is different. By fining someone for writing "none of the above," the state is drawing a line between **silence** and **speech**.

  *   **Blank Ballot:** This is treated as passive compliance. You showed up, you touched the paper, you left it empty. You participated in the ritual without endorsing the options. The state accepts this.
  *   **Written Ballot:** This is treated as active disruption. You used the state's paper to send a message the state didn't authorize. By counting this as a "failure to vote" (triggering the fine), the system presupposes that the voter's role is to select from the menu provided, not to critique the menu.

  **Is this coherent?**
  It is coherent only if you view voting as a **civic liturgy** rather than a political act. In a liturgy, there are correct forms and incorrect forms. Speaking out of turn is a violation of the ceremony. If the goal is "Representative Equality" (forcing the poor to vote so parties listen to them), Item 2 undermines it, because it punishes the most disaffected voters who might want to register protest. If the goal is "Legitimacy by Numbers," Item 2 helps slightly by reducing the count of "informal" votes that look like apathy, but it risks creating a scandal if people get fined for graffiti on ballots.

  **Administrative Reality:**
  On the ground, this is a nightmare. How does a scrutineer distinguish between a accidental mark and a protest message? If I circle a candidate's name but also draw a smiley face, is that void? If I write "too old to vote" on the back? This invites arbitrary enforcement. It turns the polling officer into a censor.

  ***

  ### (b) Who Should Have a Say? (Items 3–5)

  **The Underlying View:**
  Items 3–5 work with a hybrid view of **Membership as Reciprocity** mixed with **Civic Trust**.

  *   **Item 3 (Over-70s Exempt):** This suggests the duty is grounded in **lifecycle contribution**. You pay your dues from 18 to 69. After that, you've earned your retirement from civic labor. It's paternalistic (assuming they might struggle to get to the polls) but also honorific (you've done your bit). They keep the *right* because they are still members, but they are released from the *obligation* because their contribution phase is over.
  *   **Item 4 (Non-Citizens):** This is **Integrationist**. It treats voting not as a right of birth or blood, but as a privilege of sustained presence and participation. Voting locally is a probationary period. Voting nationally is the reward for sticking around and engaging three times. This aligns with "all-subjected-to-the-law" but adds a time-delay filter to ensure commitment.
  *   **Item 5 (Prisoners):** This is **Moral Membership**. It argues that citizenship isn't just legal status; it's a "bond of civic trust." A serious crime (>2 years) severs that bond. You are still physically subject to the law, but you have forfeited your moral standing to help write it.

  **The Asymmetries:**
  You noted the bug: A resident non-citizen (who owes taxes and obeys laws) gets a local say, but a convicted citizen loses theirs.
  *   **Justification:** The system values **conduct** over **status**. The non-citizen is building trust through time and local participation. The long-term prisoner is breaking trust through conduct.
  *   **The Over-70s Joint:** Why are they exempt from duty but keep the right? If the duty is about reciprocity (you benefit from laws, so you must vote), the over-70s still benefit. If the duty is about capacity, then why not exempt the disabled? This suggests the duty is viewed as **labor**. You work for the state until retirement age. After that, you are a pensioner of the polity.

  **Coherence:**
  It hangs together if you view the franchise as a **stakeholder management system**. Locals have a stake (Item 4). Criminals have breached the stake (Item 5). Elders have completed their stakeholder labor (Item 3). It's not purely "all-affected" (otherwise prisoners would vote) and not purely "all-subjected" (otherwise non-citizens would vote nationally immediately). It's a **community membership** model where membership is earned, kept, or retired based on behavior and life stage.

  ***

  ### (c) Parental Proxy vs. Political Equality (Item 6)

  **The Conflict:**
  Item 6 (Demeny voting) explicitly violates "one person, one vote" (1p1v) in the numerical sense. A family with three kids gets 4 votes (2 parents + 3 halves). A childless couple gets 2.

  **What must a vote *be* for this to work?**
  For this to be justified, the vote cannot be an expression of **individual will**. If the vote is "my will," a child has no will to delegate, or the delegation is fictitious.
  Instead, the vote must be a **proxy for interests**. Children have interests (schools, environment, debt) but no agency. Parents are assumed to be the natural trustees of those interests.
  *   **The Split Mechanism:** The rule that "if parents disagree, the half-vote splits" is crucial. It admits that parents don't have a single unified will. It treats the child's interest as a distinct quantity that gets divided between the trustees.

  **Is it a violation or a correction?**
  *   **Violation:** It weights the electorate by family size. It incentivizes having kids to gain political power. It gives parents double influence (their own future + their kids' future).
  *   **Correction:** If you view democracy as about **intergenerational justice**, the current system systematically discounts the future. Old people vote more; kids don't vote at all. Politicians ignore long-term costs. Giving parents extra weight corrects the temporal bias of the electorate.

  **Administrative & Theoretical Glitch:**
  Theoretically, it matters that the child never authorized the delegation. It's benevolent paternalism. Administratively, this is a disaster. Proving parenthood at the polling station? What about split custody? What if one parent is absent? The "split vote" rule implies a mechanism for recording half-votes or dual ballots, which complicates counting immensely.
  However, philosophically, it fits the "Stakeholder" view from section (b). It says: "Those with dependents have more at stake in the community's future, so they should have more say." It treats the family as the unit of citizenship, not the individual.

  ***

  ### (d) The Quorum Contradiction (Item 7 vs. Item 1)

  **The Presupposition:**
  Item 7 (Referendum Quorum) presupposes that **silence is a veto**. It says: "If you don't show up, you are blocking this change." It treats abstention as a 'No' vote strong enough to kill a majority 'Yes'.
  Item 1 (Compulsory Voting) presupposes that **silence is an offence**. It says: "If you don't show up, you are breaking the law."

  **The Contradiction:**
  These two items fight each other.
  *   **Item 1** tries to eliminate abstention. It assumes abstention is bad (apathy, laziness, disengagement) and should be fined away.
  *   **Item 7** empowers abstention. It assumes abstention is meaningful (boycott, dissatisfaction with options) and should be respected as a blocking mechanism.

  **Legitimacy:**
  If you force everyone to vote (Item 1), you shouldn't need a quorum (Item 7) because turnout will be high. If you have a quorum (Item 7), you are admitting that voluntary turnout might be too low to legitimize the result.
  By having both, the system sends a mixed signal: "You must come to the polls (or we fine you), but if too many people hate this question enough to stay home despite the fine, we won't pass the law."
  This creates a strategic perverse incentive. If I oppose a referendum, Item 7 tells me to stay home. Item 1 tells me I'll get fined. If the fine is "barely enforced" (as Item 1 says), then Item 7 wins. People will stay home to veto the referendum, knowing the fine is a bluff. This undermines the authority of Item 1.

  **Is staying home a political act?**
  Yes, in referendum theory, boycotts are political acts. But you cannot simultaneously criminalize that act (Item 1) and grant it veto power (Item 7). One must go. Either abstention is a crime (no quorum needed) or it's a political signal (no fines for abstention).

  ***

  ### (e) Theoretical Coherence and Stress Testing

  **Presuppositions vs. Compatible Theories:**
  *   **Presupposed:** The package presupposes a **Communitarian-Republican** view. The community is an ongoing project. Membership is active (voting), earned (residency), and forfeitable (crime). The family is a political unit (Item 6). The state has an interest in the *form* of participation (Item 2).
  *   **Compatible:** It fits well with a **Paternalistic Stability** theory. The state wants to ensure high turnout to prevent extremism, protect children's interests, and integrate residents, while maintaining order by punishing disruptive protest (Item 2) and serious crime (Item 5).
  *   **Underdetermined:** The package is underdetermined on **Equality**. Item 6 violates numerical equality. Item 4 violates status equality (citizen vs. resident). Item 5 violates universal suffrage. You could justify all these via "Stakeholder Theory" or via "Civic Virtue Theory." The design doesn't tell us which one is the driver.

  **Swapping Theories:**

  *   **(i) Pure All-Affected-Interests:**
      *   *Keep:* Item 6 (kids are affected), Item 4 (residents are affected).
      *   *Drop/Flip:* Item 5 (prisoners are still affected by laws). Item 3 (over-70s are still affected). Item 1 (if voting is a right to protect interests, compelling it is odd, though you could argue you must protect your own interests).
      *   *Major Change:* Non-citizens would vote nationally immediately if they are subject to national laws. Prisoners would keep the vote.

  *   **(ii) Vote as a Waivable Right (Libertarian/Liberal):**
      *   *Drop:* Item 1 (no compulsion), Item 2 (no penalty for blank/protest), Item 7 (quorums usually go with compulsion to ensure legitimacy, but could stay if viewed as protecting minority status quo).
      *   *Flip:* Item 6 becomes harder to justify if the vote is an individual right of will. A child has no will to waive, so parents can't exercise it.
      *   *Major Change:* The whole "duty" architecture collapses. It becomes a standard liberal democracy with optional voting.

  *   **(iii) Epistemic View (Quality of Judgment):**
      *   *Keep:* Item 6 (parents might know kids' interests better than random chance? Debatable). Item 4 (long-term residents know the local context better).
      *   *Drop/Flip:* Item 1 (forcing uninformed people to vote lowers aggregate quality). Item 2 (blank votes are "noise," but protest votes might be valuable information about system dissatisfaction).
      *   *Major Change:* You would likely add competence tests or remove compulsion to avoid diluting the "wisdom of the crowd" with forced ignorance. Item 2 is particularly bad here—silencing protest removes data about system failure.

  **The Hardest Item to Justify:**

  **Item 2 (Penalizing Written/Protest Ballots).**

  Here is why:
  Every other item in this package can be grounded in *some* coherent theory of democracy, even if you disagree with it.
  *   Compulsion (Item 1) fits Republican duty.
  *   Residency rules (Item 4) fit Integrationism.
  *   Prisoner bans (Item 5) fit Retributive Civic Theory.
  *   Parental votes (Item 6) fit Intergenerational Stakeholder theory.
  *   Quorums (Item 7) fit Consensus/Status Quo theory.

  Item 2 fits **none** of them well.
  *   **Liberal Theory:** It violates free speech within the secret booth.
  *   **Republican Theory:** Duty is to the community. A protest vote is often a plea to the community to fix itself. Punishing it stifles civic feedback.
  *   **Epistemic Theory:** A "none of the above" message is valuable data. It tells the system the options are bad. Suppressing this data makes the system dumber.
  *   **Administrative Reality:** As noted, it requires polling officers to judge the intent of a mark. Is a checkmark a vote or a protest? Is a scribble an error or a statement? This invites corruption and inconsistency.

  Furthermore, Item 2 creates a logical trap with Item 1. If I am forced to vote (Item 1), I must be allowed to vote *against* the options without penalty. If the only legal way to dissent is silence (blank ballot), but silence is indistinguishable from indifference, the state is forcing me to simulate consent. It turns the ballot box into a loyalty oath. You can build a stable authoritarian system on this, but you cannot build a democratic one. It is the one item that transforms the package from "robust democracy" to "managed plebiscite."

  **Summary Recommendation:**
  If you want this package to hang together as a democratic reform, **delete Item 2**. Let people write on ballots. Let those votes count as "attended" (satisfying Item 1) but "informal" (not electing anyone). This keeps the compulsion (civic duty) without criminalizing dissent.
  Secondly, **resolve the tension between Item 1 and Item 7**. Either trust the compulsion to deliver legitimacy (drop the quorum) or admit compulsion is weak (keep the quorum but drop the fine). Doing both signals that the drafters don't trust their own rules.
