  **Title:** History, Normativity, and the Proper Place of Function: A Defense of the Etiological Account

  **Introduction**

  The concept of "function" is the engine room of biological explanation. When a biologist asserts that the function of the heart is to pump blood, they are not merely describing a causal regularity; they are invoking a normative standard against which the heart can be judged as succeeding or failing. For the past half-century, the philosophical architecture of this concept has been defined by the dispute between the Etiological (or Selected Effects) account and the Causal-Role account.

  Before weighing the merits of these views, a crucial correction regarding the seminar's reading list is necessary. The prompt associates the Causal-Role account with Michael Behe. This is a category error that must be rectified for graduate-level rigor. Michael Behe is associated with the Intelligent Design movement and the concept of "irreducible complexity." The Causal-Role account of function was formulated by **Robert Cummins** (1975). Conflating Cummins' naturalistic functional analysis with Behe's design arguments would obscure the actual philosophical stakes. The debate is properly between Ruth Millikan (and later Karen Neander) representing the Etiological view, and Robert Cummins representing the Causal-Role view.

  With this correction in place, this essay argues that the **Etiological account is the superior theory of biological function.** While the Causal-Role account offers a useful vocabulary for physiological capacity, it fails to capture the normative dimension that distinguishes a *function* from a mere *effect*. The Etiological account succeeds where it matters most: it provides a naturalistic grounding for malfunction and preserves the explanatory link between a trait's existence and its current activity. The Causal-Role account, by contrast, collapses function into causal contribution, rendering the concept too permissive to do the heavy lifting required in evolutionary explanation.

  **The Etiological Case: History and Normativity**

  The Etiological account defines the function of a trait in terms of the history of natural selection that maintained it. On this view, the function of the heart is to pump blood because ancestors of current organisms possessed hearts that pumped blood, and this capacity conferred a survival advantage that led to the proliferation of the trait.

  The primary strength of the Etiological view is its handling of **malfunction**. This is the litmus test for any theory of function. If a heart is diseased and fails to pump blood, we still say it is a heart and that it is *malfunctioning*. We do not say it has ceased to be a heart or that its function has changed. The Causal-Role account struggles mightily here. For Cummins, a function is simply a causal contribution a component makes to the capacity of a containing system. If the heart does not pump, it is not contributing to the circulation capacity. Therefore, strictly speaking, on a pure Causal-Role view, a non-pumping heart does not have the function of pumping at that moment. It lacks the capacity.

  The Etiological account bypasses this by anchoring function in the *past*, not the present performance. A trait has a function because of what it *was selected for*, regardless of whether it currently succeeds. This allows biology to speak of "proper function" as a normative standard. It explains why a sperm with a broken tail is defective, even if, by sheer accident, it fertilizes an egg via intracytoplasmic injection. Its history dictates its function, not its accidental success. This normative bite is essential for distinguishing pathology from variation, a distinction central to medicine and evolutionary biology.

  Furthermore, the Etiological account secures the **explanatory role** of function. When we ask, "Why do organisms have hearts?", the answer "To pump blood" is an explanation of the trait's presence. It cites the consequence that explains the cause (the trait's proliferation). The Causal-Role account cannot do this. Saying "The heart functions to pump blood" on a Cummins view merely analyzes the current system's capacities; it does not explain why the heart is there in the first place. It describes the machinery but ignores the designer (natural selection) that assembled it.

  **The Causal-Role Case: Capacity and Current Contribution**

  Proponents of the Causal-Role account, following Cummins, argue that the Etiological view is too restrictive. They point to cases where traits clearly have functions but lack a specific selection history. This includes **very recent traits**, traits arising from **genetic drift**, or **spandrels** (byproducts of selection on other traits).

  Consider a hypothetical mutation that arises in a population today that allows an organism to digest a new synthetic plastic. It has no selection history yet. The Etiological theorist must say it has no function until it is selected. The Causal-Role theorist argues this is counterintuitive; the trait contributes to the organism's survival now, so it has a function. Similarly, consider the human chin. It may be a structural byproduct of jaw reduction (a spandrel) rather than a direct target of selection. Does it have a function? The Causal-Role account allows us to say yes, insofar as it contributes to the structural integrity of the face.

  The Causal-Role account also appeals to those who wish to avoid the "historical baggage" of selection. It allows functional analysis in systems where history is unknown or irrelevant, such as in certain models of physiology or even artificial systems. It focuses on the *here and now*: what does this part do for the whole?

  **The Clash: Malfunction and Design without Selection**

  The divergence between these accounts becomes critical in the two areas you highlighted: malfunction and traits that appear designed but lack clear selection history.

  On **malfunction**, the Etiological account is decisively superior. The Causal-Role account faces a dilemma. If function is defined by current causal contribution, then a trait that fails to contribute has no function. To speak of "malfunction" requires a counterfactual: "It *should* be doing X." But where does this "should" come from in a purely causal system? Cummins attempts to derive normativity from the analytical context (the researcher's interest), but this makes function observer-relative. A heart's function becomes dependent on what the physiologist is trying to explain. The Etiological account grounds the "should" in the objective history of the lineage. The heart *ought* to pump because that is the condition under which it was replicated. This objectivity is vital for a realist philosophy of biology.

  On the case of **design without selection** (spandrels or new traits), the Causal-Role account appears stronger initially, but only by diluting the concept of function. If we allow that any causal contribution is a function, then the liver's function includes making a thumping noise (which contributes to the acoustic capacity of the body) or filtering blood (which it does). We lose the ability to distinguish the *significant* contributions from the incidental ones.

  The Etiological theorist's response to spandrels and new traits is not a weakness, but a necessary rigor. If a trait has not been selected for, it does not have a *biological proper function*; it has a *causal effect*. We can acknowledge that the chin contributes to facial structure without calling that contribution its "function" in the strict biological sense. Regarding new traits: until selection acts, the trait is merely a variation. Calling it "functional" prematurely conflates potential with purpose. Biology is a historical science; to strip history from function is to strip biology of its evolutionary context. If a trait is not maintained by selection, its persistence is accidental. Accidental persistence does not warrant the teleological language of "function."

  **The Verdict**

  Here is the clear verdict for the seminar: **The Etiological (Selected Effects) account is the correct account of biological function, while the Causal-Role account is best understood as an account of causal capacity.**

  This is not a mere hedge; it is a demarcation. We should not try to force the Causal-Role account to do the work of the Etiological account. When a physiologist maps the circulatory system, they are analyzing causal roles (capacities). When an evolutionary biologist asks why the circulatory system exists and why it takes the form it does, they are analyzing proper functions (etiology).

  The Causal-Role account fails as a general theory of biological function because it cannot naturalize normativity. It cannot explain why a trait is *supposed* to do something other than what it *actually* does. Without that distinction, the concept of malfunction dissolves, and with it, the distinction between pathology and normal variation. The Etiological account preserves this distinction by anchoring function in the replicator dynamics of evolution.

  However, the Etiological account must concede one point to the Causal-Role view: the latter is indispensable for **systems analysis** where evolutionary history is either unknown or irrelevant to the immediate explanatory goal. In engineering biology or synthetic biology, where we design traits without selection history, "Causal-Role function" is the appropriate operational term. But in the philosophy of *natural* biology, where the goal is to understand the normative organization of life, the Etiological account reigns supreme.

  **Conclusion**

  For the purposes of this seminar, the reading list should prioritize Millikan and Neander over Cummins, with Cummins read as a foil who describes *capacity* rather than *function*. The "Behe" attribution must be discarded entirely, as it conflates philosophical functionalism with Intelligent Design advocacy.

  The Etiological account wins because it respects the historical nature of biology. Life is not a static machine; it is a historical lineage. To ask for the function of a trait is to ask for the reason it persists in that lineage. Only the history of selection provides that reason. The Causal-Role account offers a snapshot of the machine's current operation, but only the Etiological account explains why the machine is built the way it is, and why, when it breaks, we say it is broken rather than merely different. In the philosophy of biology, history is not optional context; it is the ontology of function.
