answer: |-
  **Project Title:** Beyond Causal Role: Testing for Semantic Content in Neural Representations via Off-Manifold Intervention

  **1. Research Question and Motivation**
  The debate over whether neural networks possess genuine "representations" is currently stalled. Proponents point to mechanistic interpretability findings (circuits, features, directions in activation space); skeptics argue these are merely useful statistical shortcuts. This impasse arises because both sides conflate three distinct notions of representation:
  1.  **Causal-Role:** A state mediates specific input-output behaviors.
  2.  **Content:** A state has correctness conditions (it can misrepresent).
  3.  **Portability:** A state type recurs across different models trained on similar tasks.

  Current evidence—probing classifiers, activation steering, and sparse autoencoders—establishes only the **Causal-Role** notion. They show that manipulating a direction changes behavior *within the training distribution*. This proposal argues that **Content** requires a stronger condition: robustness off-manifold. If a "dog" feature truly represents *dog-headedness*, it should maintain its causal role even when activated by inputs the network has never seen and arguably could never see (e.g., adversarial noise, extreme activation scales, or impossible feature combinations). If the causal role collapses off-manifold, the feature was merely tracking a training regularity, not representing a semantic property.

  **Primary Question:** *Do interpretable features in neural networks maintain their causal role under off-manifold activation interventions, thereby satisfying the conditions for semantic content?*

  **2. Methodology and Work Plan (9 Months)**
  The project employs activation steering to test feature robustness outside the natural data manifold.

  **Phase 1: The Kill Pilot (Weeks 1–6)**
  *Goal:* Determine if off-manifold testing is feasible and discriminative.
  *Action:* Select a pre-trained vision model (e.g., ResNet-50) and identify a robust feature (e.g., "dog head") using existing dictionaries. Apply linear steering to this direction while feeding the network pure Gaussian noise and adversarial perturbations that maximize the feature's activation without resembling dogs.
  *Success Criterion:* If steering the "dog" direction on noise produces consistent, interpretable changes in downstream logits (e.g., increasing "dog" probability despite no visual dog features), the feature has off-manifold leverage. If the effect vanishes or becomes chaotic, the feature is distribution-bound.
  *Kill Switch:* If the pilot shows no signal-to-noise difference between on-manifold and off-manifold steering, the project terminates. This indicates "off-manifold" is ill-defined for this architecture.

  **Phase 2: Systematic Off-Manifold Generation (Months 2–4)**
  *Action:* Develop three classes of off-manifold tests:
  1.  **Activation Scaling:** Amplifying feature vectors beyond the maximum norm observed in training.
  2.  **Feature Recombination:** Simultaneously steering mutually exclusive features (e.g., "dog" + "airplane") to test for semantic coherence vs. arithmetic cancellation.
  3.  **Latent Interpolation:** Traversing paths in activation space that bypass the natural data manifold entirely.
  *Deliverable:* A dataset of intervention results mapping the "breakdown point" where causal role decouples from semantic label.

  **Phase 3: Portability and Cross-Model Analysis (Months 5–7)**
  *Action:* Repeat Phase 2 on models of varying architectures and seeds trained on the same task.
  *Justification for Portability:* A committee member may ask why Portability is separated from Content. The distinction is ontological: Content concerns the *relation* between state and world; Portability concerns the *stability* of that state across implementations. Separating them allows us to distinguish between a feature that is semantically robust but architecture-specific (Content without Portability) versus a feature that is merely an artifact of a specific optimization landscape (Portability without Content).
  *Deliverable:* A matrix of feature stability across models.

  **Phase 4: Synthesis and Write-Up (Months 8–9)**
  *Action:* Aggregate data to determine if any features pass the off-manifold content test. Draft dissertation chapter and journal article.

  **3. Possible Results and Failure Conditions**
  *   **Positive Result:** Certain features maintain causal leverage off-manifold. This supports the realist view that networks learn semantic structures, not just statistical fits.
  *   **Negative Result:** All features lose causal coherence off-manifold. This supports the instrumentalist view: "representations" are merely in-distribution levers.
  *   **Project Failure:** A negative result is a valid scientific outcome. *Project Failure* is defined as the inability to construct a coherent off-manifold test. If "off-manifold" proves impossible to operationalize without destroying the network's function entirely, or if the pilot yields uninterpretable noise, the methodology is flawed. The Kill Pilot is designed to identify this risk immediately.

  **4. Anticipated Objections and Significance**
  **Objection 1: The Thermometer Problem.**
  *A committee member will ask: "A thermometer covaries with temperature causally. Does it represent temperature? If not, why is your causal-role test insufficient?"*
  *Response:* A thermometer relies on a fixed physical coupling; if the physics change, the reading is merely wrong, not a *misrepresentation* in the semantic sense. Representation requires counterfactual support: the system must track the variable *as* that variable. My test probes this by breaking the natural correlation (the "physics" of the training set). If the network continues to treat the activation as "dog" even when the statistical coupling to dog-images is severed, it suggests the network is tracking the *concept*, not just the correlation. A thermometer cannot do this; it has no off-manifold regime where it continues to read "temperature" if the thermal expansion physics cease to hold.

  **Objection 2: The Utility of Portability.**
  *A committee member will ask: "Why separate Portability from Content? If it doesn't move models, does it matter?"*
  *Response:* Portability isolates task structure from architectural accident. If a feature is Content-rich but not Portable, it suggests the semantic structure is real but encoded idiosyncratically. If it is Portable but lacks Content (fails off-manifold), it suggests a robust but shallow heuristic. Separating them prevents us from mistaking a robust heuristic for a semantic universal.

  **5. Conclusion**
  By decoupling Causal-Role from Content via off-manifold intervention, this project moves the interpretability debate from "does this direction correlate?" to "does this direction mean?" The nine-month timeline is aggressive but feasible, anchored by a rigorous pilot that prevents resource expenditure on a methodologically unsound premise. The results will clarify whether mechanistic interpretability is uncovering the mind of the machine or merely mapping its levers.
