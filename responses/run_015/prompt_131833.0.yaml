      *   *Functionalism:* `interface Pain { ReactToDamage(); CauseAvoidance(); }`. Duck typing.
      *   *Multiple Realizability:* Polymorphism. `HumanPain`, `RobotPain`, `AlienPain` all implement `Pain`.
      *   *Reduction:* Looking at the source code of the implementation vs. calling the interface method.

      *Constraint Check:* The user said "without quietly slipping philosophy words in wearing code costumes." I need to be careful not to say "qualia" or "ontology" even if I explain them. I must stick to `interface`, `struct`, `runtime`, `latency`, etc.

