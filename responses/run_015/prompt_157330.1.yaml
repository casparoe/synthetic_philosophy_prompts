answer: |-
  1. First, apply the negative-liberty filter by determining whether the ordinance coercively interferes with an individual's existing choices or actions without justification. If the rule physically prevents or penalizes a specific behavior, it registers a liberty cost requiring further scrutiny.
  2. Second, apply the positive-liberty filter by assessing whether the policy enhances or undermines the individual's capacity for rational self-mastery and meaningful agency. Ordinances pass this stage only if they remove internal or structural barriers to autonomy rather than merely shifting external constraints.
  3. Third, apply the republican liberty filter by checking whether the state exercises arbitrary power over the subject without effective recourse or contestation. A rule fails if it places individuals under the unchecked will of another, regardless of whether that power is actively exercised.
  4. The vaccination mandate fails the negative filter by interfering with bodily choice but passes the republican filter because the rule is public, non-arbitrary, and serves a collective health end. This indicates an acceptable trade-off where specific negative liberties are restricted to secure the conditions necessary for broader agency.
  5. The opaque welfare tool passes the negative filter by not physically restraining movement but fails the republican filter decisively because hidden scores create arbitrary power without appeal. This reveals domination despite efficiency gains, leaving open the value judgment of whether administrative convenience outweighs the loss of contestability.
