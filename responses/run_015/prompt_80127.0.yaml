answer: |-
  He rules without a title, pure **tyrant**,
  Upon a stolen, heavy iron **crown**,
  With blood upon his violent ruling **hand**,
  He twists the scripture and the civil **law**,
  To feed upon the public political **body**,
  Ignoring all the welfare of the **good**.

  Who seeks the safety of the common **good**?
  Must strike down such a usurping **tyrant**.
  To save the life of the whole human **body**,
  So too remove the rotten golden **crown**.
  There seems no higher natural **law**
  Than justice in a private vengeful **hand**.

  But justice slips the private individual **hand**,
  For care of all the universal **good**.
  Is bound to public charge and higher **law**,
  No single man may judge the deadly **tyrant**.
  Though heavy hangs the usurped golden **crown**,
  The limb serves only the whole political **body**.

  Health resides in the whole corporate **body**,
  Not in the rash, avenging private **hand**.
  Though rust consumes the iron royal **crown**,
  And peace is sold against the public **good**,
  Who acts alone becomes a new **tyrant**,
  Breaking the very binding public **law**.

  For where there is no valid public **law**,
  The state is wounded in each private **body**.
  Yet killing makes the killer private **tyrant**,
  If power seized by unauthorized **hand**.
  We seek the welfare of the common **good**,
  Not merely break the usurper's hollow **crown**.

  Let God or public will break down the **crown**,
  Not private zeal without the sanction **law**.
  The vacancy serves not the common **good**,
  If torn by factions of the social **body**.
  The sword belongs the authorized public **hand**,
  Not one who slays the illegitimate **tyrant**.

  No private hand may break the usurper's **crown** to save the **body**,
  For authority binds the **law** to the public **hand**,
  To secure the common **good** against the **tyrant**.
