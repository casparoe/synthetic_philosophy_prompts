      *   **Application:** Apply to three cases:
          1.  ER nurse triaging sister.
          2.  Librarian favoring neighborhood group.
          3.  Mediator (the user) favoring community member over outsider.
      *   **Constraint 1:** The last case (mediator) must be analyzed honestly, even if the user won't like the result.
