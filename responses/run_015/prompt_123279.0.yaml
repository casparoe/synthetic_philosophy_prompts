      *   **Tone:** Practical, philosophical but accessible, non-accusatory.

  2.  **Deconstruct Williams's "Integrity Objection":**
      *   *Core Idea:* Moral theories (like Utilitarianism) that demand total impartiality can alienate a person from their "ground projects" (deep commitments that give life meaning).
      *   *One Thought Too Many:* In a rescue scenario (wife vs. stranger), saving the wife because "she is my wife" is authentic. Saving her because "it maximizes utility that I save my wife" adds a thought that corrupts the relationship.
      *   *The Twist for the Mediator:* The user is seeing the *reverse* or a *hybrid*. People are claiming impartiality ("I help everyone") *plus* partiality ("but especially family"). Williams suggests the impartial justification shouldn't be the *ground* for the partial act. If the partial act *needs* the impartial excuse to stand, the integrity is compromised.
      *   *Goal of Procedure:* Detect when the impartial justification is being used as a shield for partiality, versus when the partiality is a genuine ground project that doesn't need the shield.

  3.  **Drafting the Procedure (The "Integrity Audit"):**
      *   Need a step-by-step flow.
      *   *Step 1: Identify the Ground Project.* What is the core commitment?
      *   *Step 2: The Counterfactual Test.* Would you do this if the impartial benefit disappeared?
      *   *Step 3: The Motivation Check.* Is the impartial reason the *driver* or the *afterthought*?
      *   *Step 4: Role Conflict.* Does the role demand impartiality?
      *   *Outcomes:* Flag (Corrupt Reasoning), Pass (Values Call), or Uncertain.
      *   *Refinement:* Make it actionable for a mediator. Focus on the *structure* of the justification, not the moral rightness.

  4.  **Developing the Cases:**
      *   *Case 1 (ER Nurse):* Role demands impartiality (triage). Loyalty violates the role. Williams would say the "ground project" of being a nurse overrides the "ground project" of being a sister *in this context*. The justification "I'd help anyone, but especially her" is false because she wouldn't help anyone else *ahead* of triage.
      *   *Case 2 (Librarian):* Role is public service. Favoring a neighborhood group. Is this community outreach (impartial benefit) or favoritism? If the group gets access others don't, it's partiality disguised as "community building."
      *   *Case 3 (Mediator/User):* This is the tricky one. The user favors their community. Williams values integrity (ground projects). *However*, the role of a *mediator* is structurally impartial. If the user claims "I mediate for justice" (impartial) but acts on "I help my people" (partial), that's the "one thought too many" in reverse. The procedure should flag this as role corruption, even if the loyalty feels authentic. I need to be firm here as requested.

  5.  **Addressing the Philosophical Nuance (Settled vs. Contested):**
      *   *Settled:* Williams successfully identified a psychological phenomenon (alienation from commitments).
      *   *Contested:* Does this refute Utilitarianism? (Most say no, it just limits its scope). Is integrity always a moral virtue? (Sometimes integrity means being a faithful Nazi). Does Williams offer a positive theory or just a critique? (Mostly critique).
      *   *Need to ensure I don't sound like I'm endorsing Williams as the final word on ethics.*

  6.  **Refining the Procedure for "Real Time":**
      *   Keep it to 4-5 questions.
      *   Define "Stop" conditions clearly.
      *   Ensure it distinguishes between "I have a commitment" (Valid) and "I need a universal rule to justify my commitment" (Invalid/Corrupt per Williams).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the insight. Williams is perfect for this.
      *   *The Procedure:* Call it the "Ground Project Integrity Check."
      *   *Steps:*
