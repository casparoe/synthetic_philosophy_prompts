answer: |-
  ### The Insight
  You have correctly identified a structural tension. Bernard Williams's point in *Persons, Character, and Morality* is that certain relationships (like love, friendship, or deep community ties) are defined by their immediacy. If you have to justify saving your spouse over a stranger by appealing to a universal rule (e.g., "saving spouses generally maximizes utility"), you have inserted "one thought too many." You have alienated yourself from the very commitment that gives the action meaning.

  In your mediation rooms, the reverse is happening. People are taking a partial commitment (loyalty) and trying to validate it by wrapping it in an impartial justification (fairness/utility) to make it palatable. Williams would suggest that if the partial act *needs* the impartial shield to stand, the integrity of the commitment is already compromised.

  Here is a procedure built from that insight, designed for rapid deployment in a mediation setting.

  ---

  ### The Integrity Structure Check (5-Minute Procedure)

  **Goal:** Determine if a justification is an authentic expression of a "ground project" (deep commitment) or a post-hoc rationalization smuggling impartiality into a partial choice.

  **Step 1: Isolate the Action and the Stated Reason**
  Ask the party to state clearly: "What are you doing?" and "Why are you doing it?"
  *   *Write down the exact reason given.*
  *   *Look for the hybrid structure:* "I am doing [Partial Act X] because [Impartial Principle Y] + [Relationship Z]."
      *   *Example:* "I bumped my sister (X) because triage should save the most lives (Y) and she is my sister (Z)."

  **Step 2: The Subtraction Test (The Core Williams Check)**
  Ask: "If the Impartial Principle (Y) were removed or proven false, would you still do the action based solely on the Relationship (Z)?"
  *   **Sufficient Answer:** "Yes. Even if it didn't help the system/outcome, I would do it for them."
      *   *Result:* **Authentic Partiality.** (Stop. This is a values call. The person admits the bias.)
  *   **Insufficient Answer:** "Well, no, then it wouldn't be right," or "It has to make sense for everyone."
      *   *Result:* **Flag Corrupt Reasoning.** (The partial act is parasitic on the impartial rule. The loyalty is not the ground; the rule is.)

  **Step 3: The Role Constraint Check**
  Ask: "Does the role you are occupying right now (Nurse, Librarian, Mediator) demand impartiality as a condition of its function?"
  *   **Yes:** The role itself is an "impartial ground project." Importing personal loyalty here is not integrity; it is role-corruption.
      *   *Result:* **Flag Role Violation.** (Stop. The procedure cannot settle this, but it identifies a conflict of interest.)
  *   **No:** The role allows for discretion or is personal in nature.
      *   *Result:* **Proceed to Step 4.**

  **Step 4: The "Because" Test**
  Ask: "When you made the decision, which thought came first? 'This is my person' or 'This is the right thing to do'?"
  *   **Answer:** "This is my person."
      *   *Result:* **Pass.** (Williams-compliant integrity.)
  *   **Answer:** "I needed to make sure it was the right thing, *and* it happened to be my person."
      *   *Result:* **Flag Rationalization.** (The impartial thought is crowding out the commitment.)

  **Outcomes:**
  1.  **Red Flag (Corrupt Reasoning):** The person needs the impartial rule to justify the loyalty. (Step 2 Fail).
  2.  **Yellow Flag (Role Conflict):** The loyalty is authentic, but the *context* forbids it. (Step 3 Fail).
  3.  **Green Light (Values Call):** The loyalty is authentic, the role allows it, and they aren't hiding behind universal rules. (Step 2 & 4 Pass). *Note: This does not mean the action is morally "good," only that the reasoning is structurally sound.*
  4.  **Uncertain:** The party cannot distinguish between the thoughts.

  ---

  ### Application to Cases

  #### 1. The ER Nurse (Sister in Triage)
  *   **Action:** Bumping sister ahead of others.
  *   **Stated Reason:** "I'd save anyone in critical condition, but especially her because she's family."
  *   **Step 2 (Subtraction):** If saving her *didn't* align with triage protocols (e.g., she is less critical than a stranger), would you still bump her?
      *   *Likely Answer:* "Yes, she's my sister."
      *   *Analysis:* This passes Step 2 (Authentic Partiality).
  *   **Step 3 (Role Constraint):** Does an ER Nurse role demand impartial triage?
      *   *Answer:* Yes. The "ground project" of being a nurse is impartial care.
      *   *Analysis:* **Yellow/Red Flag.** Williams would argue the nurse has a conflict of ground projects. However, by claiming "I'd save anyone... but especially her," she is lying about the impartial part. She wouldn't save anyone else ahead of protocol.
      *   **Verdict:** **Corrupt Reasoning.** She is using the impartial rule ("I save critical patients") as a shield for a violation of that very rule. The procedure flags that she is trying to have it both ways. She should admit: "I am prioritizing family over protocol," which forces the board to address the role violation directly.

  #### 2. The Public Librarian (Neighborhood Access)
  *   **Action:** Setting aside special access hours for her own neighborhood group.
  *   **Stated Reason:** "Libraries should serve the community, and this is *my* community."
  *   **Step 2 (Subtraction):** If this access didn't "serve the community" broadly (e.g., if it excluded other taxpayers), would you still do it?
      *   *Likely Answer:* "Yes, this is *our* group."
      *   *Analysis:* Passes Step 2 (Authentic Partiality).
  *   **Step 3 (Role Constraint):** Does a Public Librarian role demand equal access?
      *   *Answer:* Yes, public institutions generally require equal treatment of citizens.
      *   *Analysis:* **Yellow Flag (Role Conflict).** The loyalty is real, but the role forbids acting on it exclusively.
      *   **Verdict:** **Values Call / Role Violation.** The procedure identifies that the "community service" justification is a smokescreen for favoritism. If she admitted, "I am favoring my neighbors over others," the board could debate if that's permissible. By hiding behind "serving the community," she prevents the real debate.

  #### 3. The Mediator (You / Community Loyalty)
  *   **Action:** Refusing to split a settlement impartially because one party is "outside" the community.
  *   **Stated Reason:** "Mediation should restore harmony, and harmony starts within the community."
  *   **Step 2 (Subtraction):** If the settlement didn't restore "community harmony" (e.g., if the outsider was right and the community member was wrong), would you still rule for the community member?
      *   *Likely Answer:* "Yes, my priority is my people."
      *   *Analysis:* Passes Step 2 (Authentic Partiality).
  *   **Step 3 (Role Constraint):** Does a Mediator role demand impartiality?
      *   *Answer:* **Yes.** By definition, a mediator is a neutral third party.
      *   *Analysis:* **Red Flag (Role Corruption).**
      *   **Verdict:** **Corrupt Reasoning.** This is the hard result you asked for. Williams defends "ground projects" in *life*, but he acknowledges that taking on a specific social role creates new commitments. If you accept the role of "Mediator," your ground project *becomes* impartial facilitation.
      *   **The Williams Twist:** By saying "Mediation should restore harmony [Impartial Good]... within my community [Partial Constraint]," you are having "one thought too many." You are trying to justify a partial outcome with an impartial definition of mediation.
      *   **Conclusion:** To have integrity *as a mediator*, you must either recuse yourself (admitting you cannot be neutral) or rule impartially. To rule partially while claiming the mantle of "Mediator" is to corrupt the practice itself. The procedure flags this not as "selfishness," but as a category error in your justification. You are acting as an *advocate* while claiming to be a *mediator*.

  ---

  ### Philosophical Status: Settled vs. Contested

  You need to know where Williams stands in the broader literature so you don't present his critique as settled law.

  **What is Settled (Consensus):**
  *   **Psychological Reality:** Williams successfully identified a real psychological phenomenon. People *do* feel alienated when forced to justify deep personal commitments through impersonal calculus.
  *   **Descriptive Power:** His critique accurately describes how moral reasoning often fails in practice when it ignores the agent's perspective.
  *   **The "One Thought" Insight:** It is widely accepted that requiring an impartial justification for every partial act changes the *quality* of the relationship (e.g., loving someone because it is "duty" feels different than loving them because it is "them").

  **What is Contested (Disputed):**
  *   **Normative Force:** Does this objection actually *refute* Utilitarianism or Kantianism? Most ethicists say no. It shows a cost of those systems, not necessarily a logical contradiction. A Utilitarian can argue that respecting ground projects *generally* maximizes utility, even if it doesn't in a specific case.
  *   **Integrity as a Virtue:** Is integrity always good? Critics note that a person can have "integrity" in their bad projects (e.g., a faithful Nazi). Williams acknowledges this, but the procedure above assumes the ground project itself isn't monstrous.
  *   **The Solution:** Williams offered a powerful critique but no clear alternative system. He doesn't tell us how to resolve conflicts between two competing ground projects (e.g., your loyalty to community vs. the outsider's right to fairness). The procedure identifies the *structure* of the reasoning, but it cannot solve the *conflict* of values.

  ---

  ### Limitations of the Procedure

  Be aware of where this tool will misfire:

  1.  **It Cannot Adjudicate Role Definitions:** The procedure hinges on Step 3 (Role Constraints). If your community board believes a "Mediator" *should* be a community advocate, Step 3 will not flag you. The tool relies on a shared understanding of what the roles entail.
  2.  **It Can Be Gamed:** A sophisticated actor can learn to say the right words ("I'd do it anyway") to pass the Subtraction Test, even if they are lying. The procedure tests the *consistency of the narrative*, not the truth of the heart.
  3.  **It Favors Authenticity Over Outcome:** The procedure might "Green Light" a decision that is objectively unfair, provided the person admits it is based on loyalty. It protects integrity, not justice.
  4.  **It Struggles with Hybrid Roles:** In community settings, roles are often blurred (e.g., a neighbor who mediates). The procedure assumes clear role boundaries which may not exist in your context.

  ### Summary for Your Practice
  Use this to stop the *justification dance*, not to stop the *conflict*. When someone says, "I'm doing this for fairness, but also for family," use the Subtraction Test. Force them to choose: "Are you doing this for fairness, or for family?"

  If they choose Family, you can move the conversation to: "Okay, given that this is a loyalty choice, how do we manage the impact on the outsider?" That is a solvable negotiation. The current "both/ways" reasoning is a wall that prevents negotiation.
