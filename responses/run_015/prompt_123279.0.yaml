prompt: |-
  I've been mediating part-time for this community board that deals with conflicts between families and local institutions, and lately I'm hitting the same wall: people defend loyalty-based choices with these layered reasons that sound like they're trying to have it both ways — like they'd help anyone in that situation, but especially this person because they're family or part of the community. I recently read Bernard Williams on integrity and the problem of having one thought too many, where importing an impartial justification into a ground project actually corrupts the commitment rather than supporting it. I think it's exactly what's happening in these rooms, but I have no idea how to check for it in real time without just accusing people of being selfish.

  Can you turn Williams's integrity objection into an actual reusable procedure — like a checklist or flowchart in words — that I could run on a case in maybe five minutes? I need ordered questions with what counts as a sufficient answer, where the procedure stops and flags corrupt reasoning, where it stops and says this is a values call I can't settle, and where it admits it just can't tell. It should catch when someone has smuggled an impartial calculus into a ground-level commitment, but also flag when a loyalty claim is just disguised partiality that doesn't deserve protection. Don't make me cite page numbers or quote texts; just build it from the idea itself.

  Then apply it to three cases: an ER nurse who bumps her sister ahead in triage; a public librarian who sets aside special access for her own neighborhood group; and a mediator — basically me — who refuses to split a settlement impartially because the other party isn't part of my community. I want that last one to come out in a way I probably won't like, since I usually side with community loyalty. Also say clearly what the procedure can't do and where it will misfire.

  Please separate what's actually settled about Williams's objection from what's genuinely contested — for instance, whether it really undermines utilitarianism or just describes a psychological discomfort — and don't present a disputed interpretation as if it's the consensus view among people who work on this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Part-time mediator for a community board dealing with family/institution conflicts.
      *   **Problem:** People justify loyalty-based choices with layered reasons (impartial + partial) that seem contradictory or self-serving ("I'd help anyone, but *especially* this one").
      *   **Theoretical Basis:** Bernard Williams's "Integrity Objection" (specifically the "one thought too many" concept from *Persons, Character, and Morality*).
