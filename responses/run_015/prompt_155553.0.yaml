answer: |-
  Dear Friend,

  It is a pleasure to engage with your reflection on Bernard Williams and the problem of integrity, particularly given the nuanced distinction you have drawn between personal ground projects and stewardship roles. Your intuition that a single principle might unify these varied verdicts is compelling, and I believe there is indeed a coherent account that can capture most, if not all, of the judgments you have described, though it requires us to be precise about the relationship between an agent's identity and their reasoning processes. The principle I propose is that integrity consists in acting from motives that are constitutive of the agent's practical identity, where practical identity is defined either by personal ground projects or by the internal norms of a stewardship role, and where reasoning preserves integrity only when it serves to elucidate or fulfill these constitutive commitments rather than assessing their validity against external impartial standards. This account hinges on the idea that the corrupting thought is not reasoning itself, but rather reasoning that alienates the agent from their deepest commitments by treating them as contingent variables in a calculation.

  To see how this principle organizes your verdicts, we must look first at the cases involving personal ground projects, such as the husband saving his wife and the donor choosing a charity. The husband case motivates the clause regarding constitutive commitments because his love for his wife is not merely a preference but a component of who he is, meaning that subjecting her value to an impartial weighing treats a constitutive part of his identity as optional, which is why you find that calculation chilling. By contrast, the donor case motivates the clause regarding reasoning that serves commitment, because for an effective altruist, the ground project is precisely the optimization of good, so the act of weighing data is not an external check on the commitment but the very method of fulfilling it, thereby preserving integrity. This distinction also saves your verdicts on the aunt and the parent, though this is the most delicate application of the principle. In the case of the aunt and the ugly sweater, the constitutive norm of the relationship is social kindness, which inherently requires contextual judgment about feelings, so weighing honesty against feelings is actually serving the commitment. However, in the case of the dying child, your intuition that weighing is corrupting suggests that you view the parental commitment in that extremity as unconditional, meaning that introducing a calculation of harm versus truth treats the child's comfort as conditional rather than absolute, thus violating the constitutive norm of unconditional care.

  When we turn to stewardship roles, the principle requires a slight expansion to account for the internal goods of professions, which is motivated by your examples of the physician, the soldier, and the trustee. For the physician and the soldier, the integrity lies in the internalization of professional norms such that they become second nature, which is why the agent who refuses because she is unable or finds the act unthinkable displays more integrity than one who balances options, as the latter implies the norm is subject to external validation rather than being binding in itself. This connects directly to your trustee case, which motivates the clause regarding internalizing norms without mechanical obedience, because the trustee must understand the purpose of the trust to fulfill it faithfully, yet must not substitute that purpose with personal utility calculations, meaning integrity here is a fidelity to the role's internal logic rather than either mindless rule-following or external consequentialism. Your verdicts here are saved by recognizing that stewardship integrity requires the agent to speak from within the role rather than standing outside it to judge the role's demands.

  Applying this principle to the new case you proposed regarding the historian who discovers her ancestor committed an atrocity, the prediction is clear. If the historian publishes the evidence because she cannot do otherwise, driven by an internalized commitment to truth that is constitutive of her identity as a historian, then she acts with perfect integrity according to this account. The absence of calculation regarding whether truth serves society is crucial here, because introducing such a calculation would treat the norm of truthfulness as contingent upon social utility, which would be the corrupting thought analogous to the husband weighing his wife against a bystander. Thus, the principle predicts that her action displays integrity precisely because the motive flows directly from her constitutive commitment without the mediation of external weighing.

  However, in the spirit of honesty you requested, I must admit that this principle saves all your judgments only if we accept a specific substantive claim about the nature of parental obligations versus social politeness. The distinction between the parent lying to the dying child and the niece lying to the aunt rests entirely on the assertion that the former involves an unconditional commitment while the latter involves a conditional one, and while this aligns with your intuitions, it is a moral claim that not everyone would share. Some might argue that all care involves judgment, and if so, the principle would struggle to explain why weighing is corrupting for the parent but not the aunt without appearing ad hoc. Additionally, the physician case relies on the assumption that being unable to act is always a mark of integrity rather than potentially a failure of professional judgment, which is a Williamsian preference that prioritizes character over critical reflection in a way that some ethical frameworks reject. Therefore, while the principle coherently unifies your verdicts by distinguishing between reasoning that serves identity and reasoning that evaluates it, it does so at the cost of committing you to a specific view of which relationships demand unconditional fidelity versus contextual judgment, and if you were to revise your view on the parent or the physician, the principle would remain robust but would yield different results. Ultimately, I believe this account offers the best hope for preserving your intuitions without abandoning the core insight that integrity involves a unity of self and action, provided you are willing to defend the substantive hierarchy of commitments it implies.
