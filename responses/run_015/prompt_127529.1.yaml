      Make sure the distinction between infinitism and coherentism is clear. Coherentism is about *structure*, Infinitism is about *process/lineage*. In a team, structure (coherence) is usually more valuable than endless lineage (infinitism), but infinitism becomes *possible* where it was individually impossible. Foundationalism is the most rigid regarding the *location* of justification (the subject's mind).

