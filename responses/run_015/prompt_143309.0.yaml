prompt: |-
  Construct a realistic, non-science-fictional thought experiment—no longer than a paragraph—featuring a small, isolated community that adopts a novel exchange medium (for instance, marked clay tokens) under precisely defined social conditions. Engineer the case so that the following verdicts are generated from the theories rather than stipulated: (a) a Searle-style institutional-fact account treats the tokens as genuine money; (b) a conferralist account of social kinds denies they are money, on the grounds that no hierarchical authority structure confers the relevant institutional status; yet (c) both accounts agree that the tokens are socially constructed in some weaker, non-institutional sense. The scenario must isolate one variable—widespread collective horizontal acceptance coupled with a shared but false belief about the tokens’ origin—while holding constant functional utility, scarcity, and regular exchange practice. After presenting the case, verify that it meets each specification: state the collective attitude structure, the institutional conditions present and absent, the nearby worlds in which the verdicts flip, and why each account delivers its result. Identify exactly which feature does the explanatory work, describe what happens to both verdicts if the false-belief condition is removed, and explain how a defender of the institutional account would attack the scenario—specifically, whether horizontal collective acceptance itself can be re-described as the missing authority structure. Keep the dynamics ordinary and human-scale; avoid science fiction, demons, perfect predictors, lotteries, or appeals to unspecified expert consensus. If the task rests on a confused premise—for example, if these two accounts cannot genuinely be separated in this domain, or if the scenario secretly stipulates the verdicts rather than generating them—say so plainly instead of forcing the construction. I want an honest assessment of whether the isolation succeeds or collapses