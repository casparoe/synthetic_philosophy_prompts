answer: |-
  **Private Brainstorming (Not part of Joint Statement)**

  (a) **Distinct meanings of "responsibility gap":**
  1.  *Retributive Gap:* No agent satisfies conditions for deserved punishment (mens rea, control).
  2.  *Epistemic Gap:* No human can explain why the system acted as it did (opacity).
  3.  *Compensatory Gap:* No legal entity is liable to pay damages.
  4.  *Moral Remainder:* Even after compensation, the victim is owed an acknowledgment of wrong that no one can provide.

  (b) **Strongest replies:**
  *   *To Realist:* The demand for "desert" is archaic; if incentives are aligned and victims made whole, the "remainder" is merely emotional frustration, not moral fact.
  *   *To Functionalist:* You are changing the subject from "who wronged me" to "how do we fix this." Victims are owed acknowledgment of the wrong, not just a check.

  (c) **Substantive vs. Verbal:**
  *   *Verbal:* Whether to label strict liability as "responsibility."
  *   *Substantive:* Whether opacity inherently blocks moral agency attribution; whether victim satisfaction with no-fault compensation constitutes moral closure.

  ***

  **JOINT STATEMENT ON RESPONSIBILITY GAPS IN AUTONOMOUS SYSTEMS**

  **Section 1: Agreed Claims**

  1.  Harmful outcomes produced by autonomous systems require remediation regardless of fault attribution.
  2.  Current legal frameworks struggle to map traditional causation onto opaque, continuously learning systems.
  3.  Foreseeability is a scalar property, not a binary switch, varying with system capability and deployment context.
  4.  Human control is diluted in systems where decisions are distributed across code, data, and nightly retraining pipelines.
  5.  Deployers capture economic benefits from automation and should bear the associated costs of operation.
  6.  Victims of technological harm possess a legitimate interest in understanding why the harm occurred.
  7.  Institutional mechanisms must prioritize the minimization of future harm over the ritual punishment of past actors.
  8.  Statistical evidence of elevated risk can indicate systemic failure even when specific design choices cannot be isolated.
  9.  Both parties agree that the Continuous-Update Warehouse Case presents a novel challenge to traditional models of agency and liability.

  **Section 2: Disagreements Table**

  | Crux | Realist Formulation | Functionalist Formulation | Evidence Bearing on Crux | Realist Prediction | Functionalist Prediction | Substantive or Verbal |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Unit of Analysis** | Is the moral remainder tied to the individual harmful event (token) or the governance of the deployment class (type)? | The remainder attaches to the token event; the victim is owed an answer about *this* injury. | The remainder attaches to the type; the practice is about regulating the class of deployments. | Victim testimony regarding whether class-level regulation satisfies their demand for acknowledgment. | Satisfaction will remain low if only class-level governance is addressed without token-level answerability. | Satisfaction will be high if compensation and safety improvements are swift, regardless of token-level answerability. | Substantive |
  | **2. Capability-Scaled Care** | Does a capability-scaled standard of care close the gap or relocate it to the limits of opacity? | It closes the gap by making unforeseeability irrelevant; higher capability demands higher foresight duty. | It relocates the gap; deployers cannot owe foresight beyond what opacity permits. | Legal rulings on whether "could not have predicted" remains a valid defense under strict liability regimes. | Courts will reject unpredictability defenses for high-capability systems, closing the gap. | Courts will accept opacity limits, leaving a remainder where prediction was impossible. | Substantive |
  | **3. Statistical Evidence** | Can population-level statistical evidence (e.g., 1.7x injury baseline) ground blame or only regulation? | Statistical elevation grounds blame against the deployer for maintaining a risky system. | Statistical elevation grounds regulation and compensation but not blame without specific causation. | Experimental data on whether laypeople assign blame based on aggregate risk data alone. | Laypeople will assign blame based on aggregate risk data. | Laypeople will withhold blame without specific causal chains. | Substantive |
  | **4. Transmission of Blame** | Does blame transmission require contemporaneous control or only counterfactual avoidability at deployment? | Transmission requires contemporaneous control; without steering, the act is not theirs. | Transmission requires only counterfactual avoidability; the deployment decision suffices. | Neuroscientific and philosophical studies on intuitions regarding control and agency. | Intuitions will track contemporaneous control; no control means no blame. | Intuitions will track counterfactual avoidability; deployment choice suffices for blame. | Substantive |
  | **5. Surety-and-Answer Regime** | Does the surety-and-answer regime answer the demand that someone answer or silence it? | It silences the demand by forbidding fault-finding, leaving the moral remainder unaddressed. | It answers the demand by providing repair and transparency, fulfilling the practice's function. | Comparative studies of victim satisfaction in no-fault vs. tort systems. | Victims will report feeling silenced and unsatisfied by the prohibition on fault. | Victims will report feeling satisfied by the speed and certainty of repair. | Substantive |
  | **6. Victim Satisfaction** | What follows if victims receiving swift no-fault compensation report the same satisfaction as those seeing blame? | This shows the "remainder" is psychological, not moral; the gap is closed. | This shows the practice works; the gap was never real, only a request for updated practice. | Empirical finding on victim reported satisfaction levels. | If satisfaction is equal, the realist concession is forced; the gap is merely verbal. | If satisfaction is equal, it confirms the functionalist view that repair suffices. | Verbal |

  **Section 3: The Continuous-Update Warehouse Case, Applied**

  **Party A (Gap Realist):**
  In the Warehouse Case, the firm meets industry standards and no individual engineer caused the injury. The 1.7x elevated injury rate indicates systemic risk, but the specific failure mode was unforeseeable (1 in 40,000 hours) and unreproducible. Consequently, no human agent satisfies the conditions for deserved blame: there was no contemporaneous control and no violation of identifiable duty. The firm owes compensation via the surety pool, but this is a forward-looking cost of business, not a backward-looking acknowledgment of wrong. The moral remainder persists: the worker is owed an explanation of why *this* happened that no one can give. The surety-and-answer regime provides repair but silences the demand for accountability. The gap remains because the link between the harm and a blameworthy agent is severed by opacity and automation.

  **Party B (Gap Functionalist):**
  In the Warehouse Case, the firm deployed a system with a known 1.7x elevated injury baseline. This statistical evidence grounds the firm's liability regardless of specific design choices. The nightly retraining pipeline is a corporate action; the firm controls the deployment decision and benefits from the labor savings. The capability-scaled standard of care means the firm owed higher foresight proportional to the system's autonomy. The surety-and-answer regime closes the gap: the firm pays premiums based on harm rates and participates in public proceedings to explain changes. This fulfills the social practice of responsibility: guiding conduct, repairing losses, and aligning incentives. No moral remainder exists because the practice has adapted. The worker is made whole, and future risk is reduced. The gap is merely a request to update our liability frameworks, which this regime achieves.

  **Section 4: Verbal Disputes Identified**

  1.  **Liability to Pay vs. Liability to Suffer:**
      *   *Realist:* When the Functionalist says the firm is [responsible], they mean the firm is liable to pay costs and adjust procedures.
      *   *Functionalist:* When the Realist says the firm is not [responsible], they mean the firm is not liable to suffer censure or punishment.
      *   *Tabooed Restatement:* Both agree the firm must pay and adjust. They disagree on whether the firm must also suffer censure.

  2.  **Explanation vs. Justification:**
      *   *Realist:* When the Realist says the victim is owed an [answer], they mean a justification admitting wrong.
      *   *Functionalist:* When the Functionalist says the victim is owed an [answer], they mean a causal explanation and repair plan.
      *   *Tabooed Restatement:* Both agree the victim needs information. They disagree on whether that information must include an admission of wrong.

  3.  **Gap as Absence vs. Gap as Request:**
      *   *Realist:* When the Realist says there is a [gap], they mean there is an absence of a target for moral sentiments.
      *   *Functionalist:* When the Functionalist says there is no [gap], they mean there is no absence of a procedure for handling harm.
      *   *Tabooed Restatement:* Both agree the current system lacks a target for moral sentiments. They disagree on whether a procedure for handling harm suffices for moral closure.
