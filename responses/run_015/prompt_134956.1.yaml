  Turing's 1950 treatment of extra-sensory perception was not an endorsement but a methodological containment. He conceded ESP only to prevent it from invalidating the statistics of the Imitation Game, proposing telepathy-proof rooms to isolate the variable of intelligence. Applied to this proposal, Turing would likely view the computational sitting not as a test of machine performance, nor purely as a test of psi, but as an experimental design where the two are entangled beyond rescue. His crucial distinction lies between *computational generation* and *information acquisition*. A language model operates by interpolating existing data; if it produces unknown details, the mechanism is either a statistical anomaly or an external information channel. Turing would argue that using a machine designed to mimic style as a vessel for verifying survival conflates the medium with the message. The test does not measure whether the machine thinks, but whether information leaks through it. Unless the architecture itself prevents standard data retrieval while permitting anomalous access—a distinction this proposal lacks—the experiment measures the flexibility of the model, not the persistence of the person.

  Regarding controls, Turing's taste for operational criteria suggests he would demand rigorous preregistration and quantitative thresholds. He would not accept "interesting cases" selected post-hoc, as this invites the replication crisis you noted. He would insist on a fixed protocol where the questions, the sealed data, and the success criteria are defined before the model runs. He would require double-blind conditions where the researchers interacting with the bereaved families do not know the sealed details, eliminating experimenter expectancy effects. Statistical significance would need to be calculated against a null hypothesis of random guessing or stylistic hallucination, not against the subjective comfort of the relatives. For Turing, a result is only scientific if it is replicable under conditions that rule out cheating, whether by human trickery or data contamination. He would view the current proposal's reliance on family verification as methodologically soft, prone to the very subjective validation it seeks to transcend.

  On the specific matter of sealed material and post-digitisation variants, Turing would remain skeptical that a positive result proves survival. Even if the model outputs details from sealed papers unknown to the living, this establishes only anomalous information transfer, consistent with clairvoyance or telepathy from the living relatives who sealed the papers. It does not logically necessitate the survival of consciousness. Turing would likely argue that the mundane explanation—the informativeness of accumulated text—is harder to rule out than the supernatural one. Private details often exist in fragmented forms across correspondence or public records that a large model might reconstruct without needing psi. He would view the claim of survival as a leap beyond the data, which shows only information retrieval, not agency. The "computational sitting" thus fails to distinguish between a ghost in the machine and a mirror reflecting hidden data.

  Finally, Turing would separate the scientific validity from the fiduciary duty. He would argue that your aunt's money must fund *scientific* research, defined by methodological rigour, not by the desirability of the outcome. If the experimental design cannot disentangle machine interpolation from psi, or survival from ESP, it fails the scientific criterion regardless of the spiritualist appeal. He would advise that funding is permissible only if the researchers agree to submit to the harsh constraints of modern experimental design, accepting that a null result is a valid scientific outcome. The money should not buy hope, but purchase clarity. To fund a project that cannot distinguish between a clever algorithm and a surviving soul is to fund ambiguity, which serves neither science nor the dead.

  I recommend we condition funding on strict preregistration and independent statistical oversight. We must clarify that evidence of information transfer is not evidence of survival. If the researchers cannot guarantee that positive results distinguish between ESP and survival, or between data leakage and psi, we cannot classify this as scientific research under the will. We should fund the rigour, not the hope.
