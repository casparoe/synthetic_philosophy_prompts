answer: |-
  **MEMORANDUM**

  **TO:** Principal Investigator, Department of Biological Sciences
  **FROM:** Institutional Animal Care and Use Committee (IACUC)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Protocol #24-09 (Wild-Caught *Peromyscus* Housing Conditions)

  **DECISION:** **APPROVED WITH CONDITIONS**

  **REQUIRED MODIFICATIONS:**
  1.  **Housing Enrichment:** Standard caging must be modified to accommodate species-typical burrowing behavior. This requires a minimum of 15 cm of deep, compactable substrate (soil/peat mixture) in lieu of standard paper bedding, or the provision of artificial burrow structures that offer equivalent resistance and concealment.
  2.  **Implementation Timeframe:** Modifications must be fully implemented within 30 days of this notice.
  3.  **Monitoring:** Weekly weight checks and behavioral scans for stereotypy must continue for the first 60 days post-modification. Data must be submitted to the IACUC at the 60-day mark.

  ---

  **RATIONALE AND COMMITTEE FINDINGS**

  The Committee recognizes a fundamental disagreement regarding the assessment of animal welfare in this protocol. The Principal Investigator (PI) argues that welfare is adequately indicated by physiological metrics (weight gain, absence of overt pathology) and that the digging behavior, lacking its ecological context (predators, thermoregulatory extremes), serves no current *causal role* in the animal's survival. The Behavioral Ecologist on the Committee argues that welfare deficits exist when species-typical behaviors, selected for over evolutionary time, are suppressed, regardless of immediate physiological health.

  After deliberation, the Committee votes to codify the **Etiological (Historical) Account of Biological Function** as the standard for assessing "normal" behavior and psychological well-being for this institution going forward.

  **1. Justification for the Etiological Standard**
  We adopt the Etiological account because the Causal-Role account (the PI's position) risks reducing animal welfare to mere biological maintenance. Under a strict Causal-Role standard, an animal that is fed, warm, and disease-free is considered to have full welfare, even if it is behaviorally deprived. This creates a "happy slave" paradox: an organism can be physiologically healthy while being prevented from engaging in the activities that constitute its nature.

  For wild-caught species specifically, the animal's nervous system and behavioral drives are calibrated to a specific evolutionary history. To claim that digging is "not needed" because there are no predators in the lab is to misunderstand the drive. The drive exists *because* of the history, not because of the current environment. Suppressing this drive creates a welfare deficit even if the animal does not immediately starve or sicken. Therefore, function is defined by what the trait was selected to do (Etiology), not solely by what it is currently achieving in the lab (Causal-Role).

  **2. Addressing the "Appendix" Objection (Maladaptive Vestiges)**
  The Committee explicitly considered the philosophical limitation of the Etiological account, often illustrated by the "appendix case": traits that were selected for in the past but are now useless or actively harmful in the present (e.g., the human appendix, or a stress response that causes ulcers in a safe environment). If we define function historically, are we obligated to facilitate traits that may harm the animal in captivity?

  We resolve this by distinguishing between **Function Identification** and **Welfare Optimization**.
  *   **Function Identification (Etiological):** This standard tells us *what* the animal is built to do. It establishes the baseline of "normalcy." Without the etiological standard, we would not recognize the suppression of digging as a deficit any more than we would recognize the removal of an appendix as a deficit.
  *   **Welfare Optimization (Harm-Benefit):** Once a behavior is identified as etiological, we assess whether its expression in captivity causes net harm.

  In the case of the appendix, the trait is etiological but currently pathogenic; therefore, welfare optimization dictates its removal. In the case of the burrowing mouse, the behavior is etiological and *not* pathogenic (provided deep substrate is used). Therefore, welfare optimization dictates its accommodation.

  The "Appendix Case" does not break the Etiological standard; rather, it clarifies that etiology identifies the *need*, but does not mandate the *expression* if that expression causes significant pathology. However, the burden of proof lies on the researcher to demonstrate that the behavior is the "appendix" (harmful vestige) rather than the "leg" (functional capacity). In this protocol, the PI has not demonstrated that digging is harmful; they have only demonstrated it is ecologically redundant. Redundancy is not harm.

  **3. Acknowledgement of the Causal-Role Strength (The Losing Consideration)**
  While we reject the Causal-Role account as the *primary* standard for behavioral welfare, the Committee acknowledges the strength of the PI's position regarding operationalizability and the Naturalistic Fallacy.

  The PI is correct that "natural" does not automatically equal "good." In the wild, these mice suffer high predation, parasitism, and starvation. Replicating the *exact* conditions of the wild would be a welfare violation, not a compliance success. The Causal-Role account rightly reminds us that function is context-dependent. A behavior selected for predator avoidance is, in a literal causal sense, non-functional in a predator-free lab. If we adhere too rigidly to the Etiological account, we risk romanticizing wild conditions that are objectively harsh.

  Furthermore, the Causal-Role account is superior for assessing *physiological* health. Weight gain and immune function are causal realities, not historical narratives. The Committee agrees that if the provision of deep substrate were to cause respiratory issues (due to dust) or injury (due to collapse), the Causal-Role concern for immediate health would override the Etiological concern for behavioral expression.

  **CONCLUSION**
  We approve the protocol on the condition that the environment is modified to allow the etiological function of burrowing. We reject the assertion that welfare is satisfied by physiological health alone. We recognize that while some historical traits may become vestigial or harmful (the appendix scenario), the default position must be to accommodate evolutionary history unless specific evidence of harm is presented.

  **Signed,**

  **Dr. Elena Rostova, DVM, PhD**
  **Chair, IACUC**
