answer: |-
  This variant is a stress test that breaks the link between self-locating uncertainty and objective chance. To give you a direct verdict: **this case embarrasses the Copy-Frequency principle.**

  The No-News principle survives intact, though it forces a specific separation between credence and betting behavior. The Copy-Frequency principle, however, is forced into a position that violates fundamental norms of rational belief (specifically the Principal Principle) and creates a metaphysical discontinuity that suggests the principle is tracking the wrong thing.

  Here is the conceptual breakdown of why Copy-Frequency fails here and why No-News holds the line.

  ### 1. The Principal Principle Violation (Credence 0)
  The most damaging blow to Copy-Frequency is the result that Beauty's credence in Heads should be 0.

  The Principal Principle states that if you know the objective chance of an event is $x$, your credence should be $x$, unless you have "admissible" evidence to the contrary. Beauty knows the coin is fair ($x=1/2$). The question is: does waking up constitute admissible evidence against Heads?

  Under the **No-News principle**, the answer is no. Beauty knew on Sunday she would wake up at least once regardless of the coin outcome. The event "I am awake now" has probability 1 under Heads and probability 1 under Tails. Since the likelihood ratio is 1:1, her posterior credence should equal her prior: 1/2. The infinite potential awakenings on Tails do not change the fact that *this* awakening was guaranteed to happen in both worlds.

  Under the **Copy-Frequency principle**, the answer is yes. Because the expected number of Tails-awakenings is infinite, the proportion of "Heads-awakenings" in the total set of possible awakenings is $1 / \infty$, which is 0. This forces Beauty to believe a fair coin landed Tails with certainty.

  This is a *reductio ad absurdum* for Copy-Frequency. It implies that by simply increasing the number of times an observer is woken in one branch of a probability tree (without changing the branch probability itself), you can make that branch epistemically certain. If the experimenters decided to wake her $10^{100}$ times on Tails, Copy-Frequency says she should be nearly certain it's Tails. If they make it infinite, she must be *completely* certain. This allows the *consequences* of the coin toss to retroactively determine the *probability* of the coin toss, which violates the direction of evidential support.

  ### 2. The Discontinuity Problem
  You noted the discontinuity between the finite cap $K$ and the infinite case. This is a major theoretical cost for Copy-Frequency.

  If $N$ is capped at $2^K$, Copy-Frequency yields a credence of roughly $1/(1+K)$. As $K$ grows, credence in Heads shrinks. In the limit as $K \to \infty$, credence hits 0.
  The No-News principle yields 1/2 for every $K$, and 1/2 at the limit.

  Why does this indict Copy-Frequency? Because rational credence should not be hostage to arbitrary bounds on the *size* of the universe when the *evidence* remains constant.
  In every finite case, Beauty's evidence is "I am awake." In the infinite case, her evidence is "I am awake." The qualitative nature of her evidence hasn't changed. The only thing that changed is a mathematical property of the Tails-world (its expected cardinality).

  If a principle implies that adding more "copies" of an experience in a Tails-world makes the Tails-world more *true*, it is conflating **ontology** (how much stuff exists) with **epistemology** (how likely the world is). The discontinuity shows that Copy-Frequency treats the "number of observer moments" as a weight on truth. When that weight becomes infinite, it crushes the prior probability entirely. A robust theory of credence shouldn't collapse just because the universe gets bigger; No-News survives this because it treats the awakening as a binary signal (occurred/did not occur) rather than a countable resource.

  ### 3. Betting and Decision Theory
  This is where the debate usually gets muddy, but the infinite variant clarifies it.

  Suppose Beauty is offered a bet at every awakening: Win \$1 if Heads, Lose \$1 if Tails.
  *   **Heads World:** She bets once. Net: +\$1.
  *   **Tails World:** She bets $N$ times. Net: $-\$N$.
  *   **Expected Value:** $0.5(1) + 0.5(-E[N])$. Since $E[N]$ is infinite, the expected value is $-\infty$.

  A rational agent must **reject** this bet.

  **Copy-Frequency** handles this easily: Since $P(Heads) = 0$, the expected value of the bet is 0 (or negative depending on calculation), so she rejects it. Her credence aligns with her action.
  **No-News** handles this differently: She maintains $P(Heads) = 1/2$. If she used standard decision theory with this credence, she would accept even odds. However, the No-News proponent argues that standard decision theory assumes one bet per world. Here, the *stakes* are asymmetric. She knows that if Tails is true, she pays the penalty $N$ times. Therefore, she rejects the bet not because Heads is unlikely, but because the **cost of being wrong is infinite**.

  Which is better? The No-News account is more honest. It admits that the coin is fair (1/2) but the *bet* is terrible. The Copy-Frequency account lies about the coin (saying it's Tails for sure) to justify rejecting the bet. It saves the betting behavior by breaking the credence. It is preferable to have a theory that keeps credence accurate to the world (1/2) and adjusts decision theory to account for repeated betting, rather than distorting credence to match a decision rule.

  ### 4. The Bigger Picture: Frequencies vs. Credence
  Your final question asks if this shows self-locating credence shouldn't be identified with long-run frequencies. The answer is **yes**, specifically when expectations diverge.

  The Copy-Frequency principle works in the standard Sleeping Beauty problem (finite $N$) because the ratio of awakenings ($1:2$) is a stable, finite proxy for the likelihood ratio. It tempts us to think "I am a random sample from awakenings."

  But the infinite variant reveals that "random sample from awakenings" is not the same as "random sample from worlds."
  *   **Sampling Worlds:** You pick a world (H or T with 50/50 chance), then find yourself in it.
  *   **Sampling Awakenings:** You pick an awakening from the total set of all possible awakenings across all worlds.

  In finite cases, these often yield similar actionable results. In infinite cases, they diverge radically. Sampling awakenings weights worlds by their "volume" of experience. Sampling worlds weights them by their objective chance.

  Beauty knows she is in a world generated by a coin toss. She does not know she was "sampled" from a pool of awakenings created by a god; she knows she is a participant in a protocol. The No-News principle respects the generative process (the coin). The Copy-Frequency principle respects the resulting population (the awakenings). When the population size is infinite, the population measure swamps the generative measure. Rational belief should track the generative process (the evidence she actually has access to), not the resulting population size which she cannot observe.

  ### Verdict
  The **Copy-Frequency principle** is the one embarrassed by this case.

  It forces Beauty to assign probability 0 to a known 50% chance event, simply because the alternative outcome involves more experiences. It creates a discontinuity where removing an arbitrary cap on awakenings causes credence to crash. It saves betting rationality only by falsifying epistemic credence.

  The **No-News principle** survives. It maintains that waking up is not evidence about the coin, preserving the link between objective chance and credence. It requires a more sophisticated decision theory to handle the betting (accounting for the number of bets per world), but this is a feature, not a bug: it correctly identifies that the risk lies in the *protocol*, not the *probability*.

  In the infinite limit, frequency becomes a bad guide to truth. The No-News principle correctly identifies that Beauty's uncertainty is about *where* she is in the timeline, not *which* timeline she is in, and that distinction protects her credence from being swamped by infinite tails.
