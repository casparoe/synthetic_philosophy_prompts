      *   Synthesis/Recommendation: Which claim to give up? Probably a nuanced version of (ii) or (iii). Actually, (ii) is the most load-bearing for the definition, (iii) is the most load-bearing for the objectivity. If forced, soften (iii) to allow for "reasonable divergences" without calling them broken.
