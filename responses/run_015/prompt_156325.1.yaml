answer: |-
  ### Part 1: Commentary on Your Distinctions and Fixes

  Before presenting the procedure, I must address your specific methodological questions. Some of your distinctions are vital; others will break under the twenty-minute time limit.

  **1. The "No-Rivals" Fix:**
  Your instinct is correct. Requiring the applicant to name a rival shifts the burden from the panel (estimating search probabilities) to the applicant (articulating the field state). However, do not treat the *absence* of a named rival as positive evidence for the framework. It is a **Sociological Fact**, not an **Ontological Proof**. The procedure must record this as "Field Monopoly." A monopoly justifies resource concentration (we must fund *someone* working on this), but it does not justify truth claims.

  **2. Discriminating Power & Historical Probes:**
  The "Likelihood Ratio" (how much more expected is evidence E on Theory T than on Rival R?) is the gold standard, but in twenty minutes, a panel cannot calculate it. Instead, use a **Comparative Fit Check**: "Does the applicant demonstrate that the rival *cannot* easily accommodate this evidence?" If the answer is "No rival exists," the check collapses.
  Regarding the historical probe ("Would this have funded Phlogiston?"): Under time pressure, this cannot be a scoring gate. It is too easy to cherry-pick history. Demote this to a **Caution Flag**. If a panelist can name one dead theory supported by identical arguments, the proposal is not killed, but it is barred from the highest funding tier.

  **3. Distinctions to Drop:**
  *   **Drop:** The distinction between "internal coherence" and "mathematical beauty." In a twenty-minute review, these are indistinguishable to non-specialists. Collapse them into a single gate: **Structural Stability**.
  *   **Drop:** The distinction between "speculation" and "live option" as separate categories. They are functionally the same for funding purposes. Merge them into **Warrant Level 2**.
  *   **Keep:** The three-level warrant hierarchy (Work vs. Teaching vs. Premise). This is the core mechanism to prevent warrant laundering.

  **4. Value vs. Epistemic:**
  The procedure must explicitly hand off the decision. The Epistemic Gates determine the *maximum permissible claim* the researcher can make. The Value Vote determines whether the work is worth funding *within that constraint*. If a proposal fails epistemic Gate 3 (Discriminating Power), the panel can still fund it, but only as "Exploratory Work" (Level 1), not as "Established Framework" (Level 3). This prevents the panel from smuggling value judgments (e.g., "we need a quantum group") into epistemic scores ("quantum gravity is proven").

  ***

  ### Part 2: The Decision Procedure (Draft for Rubric)

  **Section 4: Epistemic Warrant and Claim Level**
  *Instructions for Panel:* Complete this section before discussing budget or impact. This section sets the ceiling for what the project may claim in its public output and hiring requests.

  **Gate 1: The Claim Level**
  *Question:* What epistemic status does the proposal claim for its central framework?
  *   **Level 1 (Exploratory):** "This is a mathematical or conceptual tool worth developing to see if it yields testable predictions."
  *   **Level 2 (Live Option):** "This is a plausible description of reality that should be taught as a serious alternative to established theory."
  *   **Level 3 (Default Premise):** "This is the working assumption for the field; hiring and curriculum should reflect this status."
  *   **Sufficient Answer:** Applicant must select one level.
  *   **Stop Rule:** If the proposal claims Level 2 or 3 but cites no *new* empirical data generated within the grant period, **cap the award at Level 1**. All public outreach and hiring language must be revised to match Level 1.

  **Gate 2: The Rivalry Check**
  *Question:* Name the single most developed rival framework currently available.
  *   **Sufficient Answer:** A specific named framework (e.g., "Loop Quantum Gravity," "DSGE models").
  *   **Instruction:** If the applicant writes "None" or "Undeveloped," mark **Field Monopoly**.
  *   **Consequence:** A Field Monopoly justifies funding (someone must do the work) but **disqualifies** the "No-Rivals Argument" as evidence for truth. It counts only as evidence for resource allocation.
  *   **Stop Rule:** If Field Monopoly is marked, the proposal cannot pass Gate 3.

  **Gate 3: Discriminating Power**
  *Question:* Identify one piece of existing evidence cited as support. Is this evidence significantly *more* expected under your framework than under the rival named in Gate 2?
  *   **Sufficient Answer:** "Yes, because [Rival] requires [Specific Adjustment] to fit this data, whereas our framework requires [Less/None]."
  *   **Instruction:** If Gate 2 was "Field Monopoly," this gate is automatically **Failed**.
  *   **Consequence:** If Failed, the proposal is epistemically capped at Level 1. It may be funded as research, but not as established knowledge.
  *   **Caution Flag:** If any panelist can name a historical theory (now rejected) that used this same form of argument, note it. This does not veto funding but requires a written justification in the rationale for why this case differs.

  **Gate 4: The Measure Independence (Anthropic/Typicality Only)**
  *Question:* If the proposal relies on anthropic or typicality reasoning, is the measure over possibilities defined independently of the observation it explains?
  *   **Sufficient Answer:** "Yes, the measure is derived from [Independent Principle], not fitted to the observed value."
  *   **Stop Rule:** If the measure is tuned to deliver the observed value, the argument is **Unfalsifiable (Local)**. The proposal is capped at Level 1.

  **Gate 5: The Horizon and Termination**
  *Question:* What specific milestone, if not reached by the end of the grant, would count as the programme stalling?
  *   **Sufficient Answer:** A concrete negative condition (e.g., "Failure to derive X from Y," "Inability to resolve Z inconsistency").
  *   **Instruction:** "Continued progress" is not a sufficient answer.
  *   **Renewal Check:** For renewal applications, has the definition of "stalling" changed since the last award to avoid failure? If yes, require explicit justification.
  *   **Stop Rule:** If no termination condition is provided, the panel must vote to **Deny** or **Downgrade** to a one-year bridge grant.

  **Handoff to Value Vote**
  *Instruction:* Once the Cap (Level 1, 2, or 3) is set by the gates above, the panel votes on funding based on:
  1.  Opportunity cost (Is this the best Level 1 bet available?).
  2.  Infrastructure value (Does this sustain necessary expertise?).
  3.  Departmental strategy (Do we want a monopoly in this field?).
  *Note:* You may fund a Level 1 project for strategic reasons, but you may not write a rationale that implies it is Level 2 or 3.

  ***

  ### Part 3: Application to Test Cases

  Here is how the procedure runs on your three scenarios.

  **Case 1: Eternal Inflation (New Proposal)**
  *   **Gate 1 (Claim):** Proposal requests funds for a public lecture series presenting the multiverse as "the likely large-scale shape of things." This is a **Level 2** claim.
  *   **Gate 2 (Rival):** Names single-universe approach but describes it as "undeveloped." Mark **Field Monopoly**.
  *   **Gate 3 (Discrimination):** Automatically **Failed** due to Field Monopoly.
  *   **Gate 4 (Anthropic):** Relies on vacuum energy value. Measure independence is contested in literature, but under time pressure, assume **Caution Flag**.
  *   **Gate 5 (Horizon):** Likely states "further exploration of landscape." **Weak.**
  *   **Procedure Output:** **Cap at Level 1.**
  *   **Panel Decision:** You may fund the research (Level 1), but the rationale must explicitly state: *"While the mathematical development is worthy of support, the epistemic warrant does not support presenting the multiverse as a likely reality to the public."* The budget for the lecture series must be cut or the content revised to emphasize speculation.
  *   **Verdict:** The warrant laundering is caught. The research survives; the ontological claim does not.

  **Case 2: Quantum Gravity (Third Renewal)**
  *   **Gate 1 (Claim):** Requests panel record framework as "default setting... reflected in a hiring line." This is a **Level 3** claim.
  *   **Gate 2 (Rival):** Cites "long search without alternatives." Mark **Field Monopoly**.
  *   **Gate 3 (Discrimination):** Automatically **Failed**.
  *   **Stop Rule:** A Level 3 claim cannot stand on a Failed Gate 3.
  *   **Procedure Output:** **Stop.** The proposal cannot be funded *as requested*.
  *   **Panel Decision:** You must deny the request to codify the framework as the "default." You may fund the research as Level 1 (Exploratory), but the rationale must read: *"This programme remains exploratory. Hiring and curriculum must reflect a plurality of approaches where possible, rather than treating this framework as established premises."*
  *   **Verdict:** This stops the institutionalization of speculation. It prevents the grant from becoming a self-fulfilling prophecy.

  **Case 3: Agent-Based Macro (The Colleague)**
  *   **Gate 1 (Claim):** Assuming the proposal argues these models are tools for policy exploration against stylized facts. This is a **Level 1** claim. (If they claim "This is the true structure of the economy," they fail Gate 1 immediately).
  *   **Gate 2 (Rival):** DSGE models or other simulation suites exist. **Rival Named.**
  *   **Gate 3 (Discrimination):** Can they show their model handles a stylized fact the rival cannot? If yes, **Pass**. If they only match the rival, **Caution Flag**. Let us assume they show superior fit on a specific volatility metric. **Pass.**
  *   **Gate 4 (Anthropic):** Not applicable.
  *   **Gate 5 (Horizon):** "Failure to replicate crisis dynamics X and Y." **Pass.**
  *   **Procedure Output:** **Level 1 Confirmed.**
  *   **Panel Decision:** Fund.
  *   **Critique:** Is this special pleading? **No.** The procedure treats the Macro proposal fairly *only if* the PI restricts their claim to instrumental utility (Level 1). If your colleague claims their simulation reveals the *true* causal architecture of the economy (Level 3) without out-of-sample testing, this procedure forces them to fail just like the Physicists. The procedure saves your colleague only if your colleague is epistemically humble. If they are not, and you fund them anyway, *you* are the one laundering warrant, not the rubric.

  ***

  ### Part 4: The Preamble Statement

  You asked for a single sentence, readable by a Provost, stating what this procedure cannot do.

  > "This procedure determines the maximum epistemic claim a project may make in its public output and hiring requests, but it does not assign a probability of truth to any framework, nor does it adjudicate whether a failure to find rivals reflects the nature of the world or the current limits of the field."

  ***

  ### Part 5: Final Advice on Implementation

  You noted that the panel currently either defers to the physicist or dismisses the work. This procedure breaks that deadlock by separating **Funding** from **Warrant**.

  1.  **The Physicist's Role:** Your physicist colleague can still argue for the *value* of the work (Gate 5, Value Vote) without being forced to defend its *truth* (Gate 3). This reduces their defensive posture.
  2.  **The Rationale:** The one-page rationale now has a template. "We funded this as Level 1 (Exploratory) despite Field Monopoly status because of its infrastructure value." This satisfies the Senate's need for accountability without requiring the panel to become experts in string theory.
  3.  **The Macro Case:** Be careful. If your colleague's proposal uses the exact same language as the Cosmologists ("coherence," "no rivals," "stylized facts"), apply the same caps. If you exempt them, the rubric loses credibility. The only principled difference is if the Macro PI explicitly frames the work as instrumental (Level 1) rather than ontological (Level 2/3). Ensure they do so in the text.

  This procedure does not solve the problem of underdetermined science. It solves the problem of universities betting their reputation on underdetermined science while pretending it is settled.
