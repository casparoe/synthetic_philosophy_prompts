  here's the draft package: prompt, model answer (condensed to show the argumentative spine), and the rigid marking scheme.

  ***

  ### EXAM PROMPT: SEMINAR 404 – CONCEPTUAL MICRODOMAINS
  **Take-Home Essay | 48 Hours | 1500 Words (±10%) | 40 Marks**
  **No Citations. No Bibliography. Pure Analysis.**

  **Prompt:**
  Consider the migration of the term 'boundary' from its strict definition in point-set topology (closed/open sets, limit points) into social ontology (group membership, normative exclusion). Standard interdisciplinary theory treats this as metaphorical mapping or semantic drift.

  Your task is to diagnose a specific pathological case: the **'Echo-Chamber Copycat.'** In this scenario, the normative weight of the social usage does not merely borrow the mathematical term; it feeds back into the formal domain, altering how mathematicians *practice* boundary definition in microdomains (e.g., forcing crisp sets where fuzzy boundaries are mathematically preferable to satisfy social demands for clarity).

  Write an essay that:
  1.  Distinguishes this event from **Semantic Drift** (meaning change over time) and **Syntactic Slippage** (rule changes without structural shift).
  2.  Maps the **Feedback Loop**: How does social normativity corrupt formal mathematical practice in this specific instance?
  3.  Avoids **Structural-Realist Handwaving**: Do not argue that "structures are similar." Explain the *mechanism of corruption*.

  Is this slippage, drift, or a full Copycat Event? Justify your diagnosis.

  ***

  ### MODEL ANSWER (ARGUMENTATIVE SPINE)
  *Note: This isn't the full 1500 words, but the core logic your student should hit.*

  **Diagnosis: Full Copycat Event**

  This is not Semantic Drift. Drift implies a passive erosion of meaning over time (e.g., 'boundary' becoming loosely synonymous with 'border'). Here, the mathematical definition remains technically intact in textbooks but is *operationally compromised* in practice. It is also not mere Syntactic Slippage, where the rules of combination change but the core concepts hold. In slippage, the system adjusts internally. In this case, the adjustment is exogenous and normative.

  The mechanism is a **Copycat Event** because the social domain mimics the structural role of the mathematical boundary (inclusion/exclusion) but inverts the dependency. Normally, formal rigor constrains social metaphor. In the Echo-Chamber Copycat, the social demand for binary belonging (us/them) exerts normative pressure on the formal domain. Mathematicians working in applied microdomains begin to privilege crisp boundaries over topologically accurate fuzzy boundaries because the social ontology demands actionable binaries.

  **The Feedback Loop:**
  1.  **Export:** Topological 'boundary' is exported to social ontology to lend rigor to group definitions.
  2.  **Normative Weight:** The social domain assigns moral weight to being 'inside' or 'outside' the boundary. Ambiguity becomes socially dangerous.
  3.  **Import/Corruption:** This normative pressure feeds back into mathematical practice. Researchers avoid limit-case scenarios or fuzzy set theories in specific microdomains because they lack social utility. The formal practice is corrupted not by error, but by *normative alignment*.

  **Blocking Structural Realism:**
  A structural-realist would argue the isomorphism between social and topological boundaries is natural. This is handwaving. It ignores the direction of causality. The corruption isn't due to structural similarity; it's due to the social domain colonizing the formal domain's *criteria for validity*. The math changes not because it's discovered to be wrong, but because it's socially inconvenient. Therefore, it is a Copycat Event: the social structure copies the mathematical role but hijacks the generative mechanism.

  ***

  ### MARKING SCHEME (40 MARKS TOTAL)

  **1. Mechanism Isolation (15 Marks)**
  *   **13-15 Marks:** Clearly identifies the scenario as a **Copycat Event**. Explicitly defines why it is *not* Semantic Drift (passive meaning change) or Syntactic Slippage (internal rule adjustment).
  *   **7-12 Marks:** Identifies it as a Copycat but fails to adequately distinguish from drift/slippage. Vague on definitions.
  *   **0-6 Marks:** Misdiagnoses as Drift or Slippage. Treats the mechanisms as interchangeable.

  **2. Mapping the Feedback Loop (15 Marks)**
  *   **13-15 Marks:** Successfully maps the **Social → Math** corruption vector. Explains how normative weight alters formal practice (e.g., privileging crisp sets for social utility).
  *   **7-12 Marks:** Describes the loop but treats it as a simple metaphor exchange (Math → Social) without the feedback/corruption element.
  *   **0-6 Marks:** No feedback loop identified. Treats the domains as isolated.

  **3. Prohibitions & Focus (10 Marks)**
  *   **9-10 Marks:** **Zero** structural-realist handwaving (no "structures are naturally similar"). **Zero** citations/bibliography. Stays within the 1500-word limit.
  *   **5-8 Marks:** Minor lapses into generic ontology. Includes unnecessary citations despite prohibition.
  *   **0-4 Marks:** Heavy reliance on external theory (Quine, Kripke, etc.). Treats the prompt as a standard philosophy of language question. Ignores the "corruption" aspect.

  ***

  ### NOTES FOR YOU (THE PROFESSOR)
  *   **Why this works:** AI models love to cite standard philosophers when asked about "meaning" or "ontology." Banning citations forces them to rely on the logic you provided in the prompt.
  *   **The Trap:** Most students (and models) will try to say "math influences society." The full marks require them to argue "society breaks math."
  *   **Tone Check:** The prompt sounds dry enough to be real, but the content is specific enough to your story's lore that a generic GPT response will feel hollow against the marking scheme.

