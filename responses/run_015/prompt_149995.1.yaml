prompt: |-
  I'm on a volunteer climate advisory committee for our mid-sized city — which is a fancy way of saying I'm the person who actually reads the spreadsheets. Our draft climate plan does three things with time that, set next to each other, look like they can't all be right, and I'd like help working out what's going on underneath.

  - The whole plan is built around a cumulative carbon budget: one number of tonnes we're allowed to emit between now and 2050, and as near as I can tell it makes no difference inside that window whether a tonne goes up in 2026 or in 2049. A tonne is a tonne.
  - Part of how we hit the number is offsets. One project on the table protects a forest for a hundred years and then the protection lapses (and it presumably gets cleared later). The protocol gives it about half the credit per tonne it would get for permanent protection, via this "tonne-year" calculation that treats a century of delay as worth roughly half of not emitting at all. A similar project nearby with a permanent easement gets full credit.
  - Separately, when we convert methane and the other short-lived gases into CO2-equivalent for the inventory, we use a multiplier that as I understand it adds up the warming a pulse of the gas causes over a fixed hundred-year window and then simply stops counting.

  So inside the budget, timing does nothing. In the tonne-year rule, timing does a lot. In the equivalence multiplier, timing matters right up to a cutoff and then stops mattering completely. None of us think that's three names for one idea, but none of us can say what the difference is meant to be, and one member keeps saying "the people in 2125 will be richer than us, so of course delay is fine," which I suspect is a fourth thing again.

  I don't want any reading list or citations — I'll go find the literature myself, and honestly I mostly need this before a meeting thursday. What I want is the conceptual map. What view of what we owe to people who come after us does each of those three rules fit with? Start with the tonne-year one: is that half-credit secretly just a discount rate in disguise, i.e. a claim that later people's welfare counts less, or can it be defended with no discounting of anyone's welfare at all?

  My half-formed idea is that the honest version goes through rate rather than level: what actually hurts a society isn't a temperature but the gap between how fast conditions are changing and how fast it can adapt, so delay is genuinely worth something even if future lives count exactly as much as ours — and on that story it should be worth more or less than half depending on what else is happening, not a flat fifty percent. Does that hold up? And is it the same argument as the "they'll be richer" one, or a different argument that happens to point the same way?

  Then the two things I really need for the meeting: which of these three numbers actually commit us to a substantive view about the future, and which would look exactly the same under several quite different theories — i.e. where can our committee stop feeling guilty? And if we took the rate-vs-level idea seriously instead, what concretely would change in how we score the forest project and in how we treat that hundred-year cutoff?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Volunteer on a mid-sized city climate advisory committee. The "person who actually reads the spreadsheets." Practical, detail-oriented, likely technically literate but needs conceptual clarity.
      *   **Problem:** The draft climate plan has three inconsistent treatments of *time* regarding emissions and offsets.
          1.  *Cumulative Carbon Budget (2025-2050):* Timing doesn't matter (a tonne is a tonne).
          2.  *Tonne-Year Offsets:* Timing matters (100-year delay = 0.5 credit vs. permanent = 1.0 credit).
          3.  *GWP (Global Warming Potential) for Methane:* Timing matters up to a cutoff (100-year integration window), then stops.
      *   **Conflict:** A committee member argues "future people will be richer, so delay is fine" (Discounting).
      *   **User's Hypothesis:** Maybe it's about *rate of change* vs. *level of warming* (adaptation capacity).
      *   **Constraints:** No reading lists/citations. Need it before Thursday (urgent). Wants a "conceptual map."
      *   **Key Questions to Answer:**
          1.  What view of intergenerational justice does each rule fit?
          2.  Is "tonne-year" just a discount rate in disguise, or defensible without discounting welfare?
          3.  Does the "rate-vs-level" hypothesis hold up? Is it distinct from the "richer future" argument?
          4.  Which numbers commit to a substantive view vs. which are theoretically neutral?
          5.  If we took "rate-vs-level" seriously, what concretely changes for the forest project and the 100-year cutoff?

  2.  **Deconstruct the Three Rules:**

      *   **Rule 1: Cumulative Budget (2025-2050)**
          *   *Logic:* Physics-based. CO2 accumulates. Warming is determined by total stock, not flow timing (within reason).
          *   *Ethical View:* Strict egalitarianism regarding the *physical constraint*. It treats the atmosphere as a finite sink. It implies a "safe operating space" that must not be breached regardless of *when* within the window the breach happens.
          *   *Time View:* Time is irrelevant *inside* the window. This is a "hard cap" approach.

      *   **Rule 2: Tonne-Year Offsets**
          *   *Logic:* Temporary storage buys time. 1 tonne stored for 100 years avoids 1 tonne of warming for 100 years.
          *   *Ethical View:* This is the tricky one. The user asks if it's discounting.
          *   *Analysis:* If we value welfare equally, avoiding 1 tonne of warming *now* is often more valuable than avoiding it *later* because of tipping points and adaptation limits. However, the specific "50% for 100 years" calculation usually comes from integrating the temperature difference over time.
          *   *Discounting?* Not necessarily welfare discounting. It can be physical discounting (damage function integration). If damages are linear with temperature, delaying warming reduces *integrated damages* over the period of delay.
          *   *Connection to "Richer Future":* The "richer future" argument is pure economic discounting (future utility matters less). Tonne-year is usually about *physical* delay value, not *moral* weight of future people.

      *   **Rule 3: GWP-100 (Methane)**
          *   *Logic:* Methane is short-lived. CO2 is long-lived. GWP-100 integrates radiative forcing over 100 years.
          *   *Ethical View:* Arbitrary time horizon. It privileges the near-term (relative to 100 years) over the very long term.
          *   *Time View:* Cutoff at 100 years. Anything happening to that methane molecule after year 100 counts for zero.

  3.  **Address the "Rate-vs-Level" Hypothesis:**
      *   *User's Idea:* Harm comes from the *rate* of change (adaptation gap), not just the *level*. Therefore, delay is valuable because it slows the rate.
      *   *Validity:* This holds up scientifically. Rapid change causes more damage than slow change to the same level because adaptation takes time.
      *   *Distinction from "Richer Future":* Yes, distinct. "Richer future" = Future people have more money so they can absorb damage (Discounting). "Rate-vs-Level" = Physical/Biological constraint on adaptation speed regardless of wealth. You can't build a sea wall overnight even if you're rich.
      *   *Implication:* If rate matters, then spreading emissions out (smoothing the curve) is better than a spike, even if the total is the same.

  4.  **Map the Ethical/Conceptual Underpinnings:**

      *   *Budget:* "Safe Minimum Standard" / Physical Constraint. (Timeless within window).
      *   *Tonne-Year:* "Integrated Damages" / Buying Time. (Time matters as duration of avoidance).
      *   *GWP-100:* "Arbitrary Horizon" / Policy Convenience. (Time matters up to a cliff).

  5.  **Address the "Guilt" Question (Substantive vs. Neutral):**
      *   *Budget:* Highly substantive. Commits to a specific temperature target (e.g., 1.5C) translated to tonnes.
      *   *GWP-100:* Highly conventional/arbitrary. Could be GWP-20 or GWP-500. Doesn't commit to a specific ethical view on the future, just a metric choice.
      *   *Tonne-Year:* Substantive. Commits to a valuation of *time* specifically. It says "100 years of cooling is worth half of permanent cooling." That is a specific claim about the value of the future.

  6.  **Address the "What Changes" Question (Rate-vs-Level Application):**
      *   *Forest Project:* Instead of "100 years = 0.5 credit," you'd model the *adaptation benefit* of those 100 years. If the city is highly vulnerable *now*, the credit is higher. If the city is resilient *now*, credit is lower. It becomes dynamic, not static.
      *   *100-Year Cutoff:* It disappears or becomes a decay function. You wouldn't stop counting at year 100. You would weight the damages based on projected vulnerability at year 101, 102, etc.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, direct, conceptual, no fluff. Acknowledge the "spreadsheet reader" persona.
      *   *Structure:*
          1.  The Conceptual Map (The Three Clocks).
          2.  The Tonne-Year/Discounting Question.
          3.  The Rate-vs-Level Hypothesis.
          4.  The "Guilt" Check (Substantive vs. Conventional).
          5.  Concrete Changes if adopting Rate-vs-Level.

      *   *Refining the Tonne-Year/Discounting point:* Be careful. Tonne-year accounting *looks* like discounting but is often justified as "integrated temperature avoidance." If damages are convex (worse at higher temps), delaying emissions is *more* valuable than linear math suggests. If damages are linear, it's just integration. The "50%" figure usually assumes a specific discount rate *or* a specific damage integration. I need to clarify that it *can* be defended without welfare discounting if framed as "avoiding damage during the delay period," but the *valuation* of that avoided damage often隐含 (implicitly) assumes future capacity to cope.
      *   *Correction:* Actually, standard tonne-year accounting (like in some voluntary markets) often *does* use a discount rate to convert future avoided damages to present value. But it can be framed as "physical service provided." I should distinguish between *physical delay* and *economic valuation of that delay*. The user asks if it's secretly a discount rate. Answer: It *functions* like one, but can be justified physically as "buying adaptation time."
      *   *Refining Rate-vs-Level:* This is the strongest ethical argument for the volunteer. It shifts focus from "how much" to "how fast."

      *   *Refining the "Guilt" section:*
          *   Budget: Hard constraint (High guilt if wrong).
          *   GWP: Metric convention (Low guilt, it's a standard unit).
          *   Tonne-Year: Valuation choice (Medium/High guilt, it decides the value of the future).

      *   *Refining Concrete Changes:*
          *   Forest: Credit varies by current vulnerability.
          *   Cutoff: No hard stop. Long-term impacts of methane (via CO2 conversion) count.

  8.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Conceptual map? Check.
      *   Address "Richer future" vs "Rate"? Check.
      *   Address "Guilt"? Check.
      *   Address "Concrete changes"? Check.
      *   Deadline awareness (Thursday)? Keep it punchy.

  9.  **Self-Correction on "Tonne-Year":** I need to be precise. The "50% for 100 years" is a specific heuristic. It implies that the *integral* of temperature over time is the metric of harm. If harm is purely a function of peak temperature, tonne-year is nonsense. If harm is a function of *duration* of exposure to elevated temp, tonne-year makes sense. This is the key distinction. It's not necessarily discounting *people*, it's discounting *damage duration*. I will make this distinction clear.

  10. **Final Polish:** Ensure the distinction between *welfare discounting* (future people matter less) and *damage integration* (suffering for 50 years is less than suffering forever) is sharp. This answers the user's specific question about whether it can be defended without discounting welfare. (Yes, it can, if the metric is integrated suffering).

      *(Self-Correction during drafting)*: Wait, the user asked about the "Richer future" argument specifically. I need to explicitly separate "Future people are richer (Discounting)" from "Delay helps adaptation (Rate/Level)". They lead to similar outcomes (delay is good) but for different reasons.

      Let's assemble the map.
      1. Budget = Stock constraint (Physics).
