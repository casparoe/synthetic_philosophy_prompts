answer: |-
  Here is the conceptual map you need for Thursday. You are dealing with three different "clocks" running simultaneously in your spreadsheet, each measuring a different kind of value.

  ### 1. The Conceptual Map: Three Views of Time

  **The Cumulative Budget (2025–2050)**
  *   **The Clock:** Stopped.
  *   **The Logic:** Physics (Stock). CO2 accumulates. Warming is determined by the total stock of carbon in the atmosphere, not the year it arrived.
  *   **The Ethical View:** **Intergenerational Rationing.** This treats the atmosphere as a finite sink that must be shared. It implies a "safe operating space" (e.g., 1.5°C) that cannot be breached.
  *   **Time Implication:** Within the window, time is irrelevant. A tonne in 2026 is morally and physically identical to a tonne in 2049. This is a *constraint* view, not an *optimization* view.

  **The Tonne-Year Offset (100-year forest)**
  *   **The Clock:** Ticking (Duration).
  *   **The Logic:** Damages (Flow). Harm is caused by the *duration* of exposure to higher temperatures, not just the peak.
  *   **The Ethical View:** **Damage Integration.** This assumes suffering is additive over time. Suffering for 100 years is bad; suffering forever is worse. Therefore, delaying suffering has value.
  *   **Time Implication:** Time is the commodity. You are buying "years of normal climate." The 50% credit implies that 100 years of avoided warming is worth half of *permanent* avoided warming.

  **The GWP-100 (Methane Multiplier)**
  *   **The Clock:** Ticking to an Alarm (Cutoff).
  *   **The Logic:** Metric Convention. Methane breaks down quickly; CO2 stays. To compare them, we integrate their warming effect over a fixed window (100 years).
  *   **The Ethical View:** **Arbitrary Horizon.** This is a policy tool, not an ethical stance. It privileges the near-term (relative to 100 years) and ignores everything that happens to that molecule after year 100.
  *   **Time Implication:** Time matters intensely up to the cutoff, then vanishes. It creates a "cliff edge" where year 101 counts for zero.

  ---

  ### 2. Is Tonne-Year Just Discounting in Disguise?

  **Short Answer:** It *functions* like discounting, but it can be defended without claiming future people matter less.

  **The Distinction:**
  *   **Welfare Discounting ("They'll be richer"):** This claims a unit of welfare in 2100 is worth less than a unit today because future people will have more money/tech to cope. This is a moral claim about *who* counts.
  *   **Damage Integration (Tonne-Year):** This claims that avoiding 1°C of warming for 100 years is physically less valuable than avoiding it forever. This is a claim about *what* hurts.

  **Can it be defended without discounting welfare?**
  Yes. If you believe harm is caused by *cumulative exposure* to heat (e.g., coral bleaching, crop failure cycles), then delaying the heat genuinely reduces total harm, even if future people matter exactly as much as you do.
  *   *However:* The specific "50% for 100 years" heuristic usually smuggles in an economic discount rate to convert those future avoided damages into present value. If you removed the economic discount rate and just counted physical "tonne-years," the value of delay would likely be *higher*, not lower, because the physical damage of climate change is expected to grow non-linearly over time.

  **Verdict:** Your committee member's "richer future" argument is **Welfare Discounting**. The spreadsheet's "tonne-year" rule is **Damage Integration**. They arrive at the same conclusion (delay is okay) but for incompatible reasons. One says future pain matters less; the other says shorter pain matters less.

  ---

  ### 3. Does Your "Rate-vs-Level" Hypothesis Hold Up?

  **Yes, and it is distinct from the "richer future" argument.**

  *   **The "Richer Future" Argument:** Assumes future capacity to *absorb* damage increases. (We can afford the sea wall in 2080).
  *   **The "Rate-vs-Level" Argument:** Assumes physical/biological limits to *adaptation speed*. (We cannot build the sea wall fast enough if the water rises in 10 years, even if we are rich).

  **Why it holds up:**
  Ecological and infrastructure systems have inertia. A slow rise to 2°C allows for managed retreat and crop switching. A fast rise to 2°C causes collapse. Therefore, smoothing the curve (delaying emissions) has intrinsic value independent of how much money future people have.

  **Is it the same as the "richer future" argument?**
  No. It is a **physical constraint** argument, not an **economic capacity** argument. You can believe future people will be poorer *and* still believe delay is valuable because it buys time for adaptation.

  ---

  ### 4. The "Guilt" Check: Which Numbers Commit Us?

  You asked where the committee can stop feeling guilty. Here is the breakdown of substantive commitment vs. convention.

  | Rule | Substantive Commitment? | Where you can relax |
  | :--- | :--- | :--- |
  | **Cumulative Budget** | **High.** This commits you to a specific temperature target (e.g., 1.5°C) and a specific share of the global carbon pie. If the science says the budget is smaller, your plan fails. | Nowhere. This is the hard constraint. |
  | **GWP-100 (Methane)** | **Low.** This is a metric convention. You could use GWP-20 (favors methane cuts) or GWP-500 (favors CO2 cuts). It doesn't change the physics, just how you count. | **Here.** You can acknowledge this is an arbitrary accounting standard (IPCC choice), not a moral truth about the 100-year horizon. |
  | **Tonne-Year (Offsets)** | **High.** This commits you to a specific valuation of the future. By accepting 50% credit for temporary storage, you are asserting that 100 years of climate stability is worth exactly half of permanent stability. | Nowhere. This is a policy choice that values the near-term over the long-term. |

  **Summary:** Don't lose sleep over the Methane multiplier (it's standard accounting). Do lose sleep over the Budget (it's physics) and the Offset valuation (it's ethics).

  ---

  ### 5. Concrete Changes: If You Adopted "Rate-vs-Level"

  If you took the "rate of change limits adaptation" argument seriously, here is how your spreadsheet changes:

  **1. Scoring the Forest Project**
  *   **Current:** Fixed formula. 100 years = 0.5 credit.
  *   **New:** Dynamic valuation based on **Current Vulnerability**.
      *   If the city is currently highly vulnerable to heat/flood (low adaptive capacity), the *next* 10 years of delay are worth *more* than the 10 years in 2090.
      *   The credit would not be linear. The first decade of protection might be worth 40% of the credit, and the last decade 1%.
      *   *Result:* Temporary offsets become much more valuable *now*, but less valuable as a long-term strategy. You would prioritize projects that protect the city during its most vulnerable transition period, not just "any 100 years."

  **2. Treating the 100-Year Cutoff (Methane)**
  *   **Current:** Hard stop. Year 101 = 0 impact.
  *   **New:** Decay Function or Extended Horizon.
      *   You would acknowledge that methane turns into CO2, which lasts forever. The "cutoff" artificially hides the long-term liability.
      *   Instead of a 100-year multiplier, you would model the **long-term temperature stabilization** impact.
      *   *Result:* Methane emissions would look "worse" in the long run (because of the CO2 conversion) but "better" in the short run (because reducing methane slows the *rate* of warming immediately). You would likely separate "Flow Gases" (Methane) from "Stock Gases" (CO2) entirely rather than forcing them into one equivalent number.

  ### Summary for the Meeting
  1.  **The Inconsistency:** You are mixing a **Physics Constraint** (Budget), a **Damage Metric** (Tonne-Year), and an **Accounting Convention** (GWP-100). They are not meant to align.
  2.  **The Discounting:** Tonne-year accounting is not necessarily welfare discounting; it can be defended as "buying adaptation time." But the "richer future" argument *is* welfare discounting. Keep them separate.
  3.  **The Fix:** If you care about adaptation rates, temporary offsets should be valued higher in the near term (when we are vulnerable) and lower in the long term. The 100-year cutoff for methane should be treated as a reporting limit, not a physical reality.
