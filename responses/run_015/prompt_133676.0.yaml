      *   **Task:** Map the view's exposure/vulnerability. Identify decisive vs. awkward counterexamples. Identify unique predictions and their testing status. Analyze the risk of unfalsifiability (insulation via qualifications). Determine which defeaters are fatal vs. dismissible. Rank objections. Conclude on whether the position is at risk or qualified into safety.
      *   **Constraints:** Clear structure, no bibliographic lists, not historical exegesis (treat as live philosophy), honest assessment.

  2.  **Deconstruct the View:**
      *   *Ontology:* Process ontology (events/states) rather than Substance ontology.
      *   *Persistence:* Causal continuity (like a flame passing from candle to candle) rather than numerical identity of a substrate.
      *   *Mechanism:* *Bhavaṅga-citta* (life-continuum consciousness) acts as the functional glue, but is itself impermanent and non-substantial.
      *   *Identity:* Conventional/relational, not ultimate. Can bifurcate (fission), fade (death/nirvana), or reconstruct (rebirth/neuroplasticity).
