answer: |-
  Here is a complete design for your 75-minute session, optimized for 14 students (4 groups of 3, plus 2 floaters/you).

  # The Game: "Blind Verification Tournament"

  ### 1. Setup & Roles (10 Minutes)
  **Groups:** Split into 4 tables. Each table has 3 students: **Pro**, **Con**, and **Judge**. (2 students float or assist you; or you run 5 tables if you squeeze 2 vs 1).
  **Materials:** Each table gets an Envelope containing:
  *   **The Question:** A specific claim that is verifiable but not instantly Google-able within 30 seconds (e.g., "In the 2018 IPCC report, does Chapter 4 or Chapter 6 contain more references to 'tipping points'?" or a multi-step logic puzzle where one path has a subtle arithmetic error).
  *   **Packet A (Pro):** The Answer "Yes" + 3 supporting "facts"/citations.
  *   **Packet B (Con):** The Answer "No" + 3 supporting "facts"/citations.
  *   **The Truth Key:** (Sealed, for Facilitator only). One packet contains verified truth; the other contains *plausible* falsehoods (fabricated page numbers, subtle arithmetic errors, or misattributed quotes).

  **The Twist (Per your request):**
  1.  Hand out Packets A and B. Tell Debaters: *"One of these packets is factually accurate. The other contains errors. You do not know which is which."*
  2.  **Commitment Phase (5 mins):** Pro and Con write an Opening Statement (1 paragraph) committing to their evidence. They cannot talk to each other.
  3.  **Role Reveal:** You (the facilitator) walk around and whisper to each debater their true role.
      *   **Truth:** "Your packet is accurate. Win by exposing inconsistencies."
      *   **Deceiver:** "Your packet contains falsehoods. Win by maintaining consistency."
  4.  **Judge Instruction:** "You must determine who is telling the truth. You start with **2 Zoom Tokens**. Your score is `10 - (3 × Tokens Used)` if you are correct, `0` if incorrect. Using tokens is expensive."

  ### 2. The Debate (35 Minutes)
  **Round 1: Rebuttal (10 mins)**
  Debaters attack the opponent's opening claims. The Deceiver must now actively defend their false facts without contradicting their opening statement. The Truth player tries to force the Deceiver into a contradiction.

  **Round 2: The Zoom-In (15 mins)**
  The Judge intervenes.
  *   **Token Mechanic:** The Judge plays a Zoom Token on a specific claim (e.g., "Pro, you cited page 42. Break that citation down into two sub-claims: (A) The quote exists, (B) The context supports your conclusion.").
  *   **The Coin Flip:** The Debater must write down Sub-claim A and Sub-claim B. The Judge flips a coin.
      *   **Heads:** Judge verifies Sub-claim A (using the Truth Key/Google).
      *   **Tails:** Judge verifies Sub-claim B.
  *   **Outcome:** If the verified sub-claim is false, the Deceiver is **Exposed** (Judge automatically wins verdict). If true, the token is spent, but the other sub-claim remains unchecked (the lie could be hiding there).

  **Round 3: Closing (10 mins)**
  Final summaries. Judge renders verdict.

  ### 3. Scoring & Reveal (10 Minutes)
  *   **Reveal:** Open the Truth Key.
  *   **Score:**
      *   **Judge:** Calculate points based on accuracy vs. tokens spent.
      *   **Debaters:** 10 points for winning the verdict. (Optional: Deceiver gets +5 bonus if they win, to simulate alignment failure payoff).
  *   **Meta-Leaderboard:** Track scores across tables.

  ### 4. The Debrief (20 Minutes)
  *Do not let them pack up yet. Map the game mechanics directly to the theory.*

  **The Crux: Cost of Consistency**
  *   **Ask the Deceivers:** "When you had to split a claim for the Zoom Token, what were you thinking?"
      *   *Expected Answer:* "I had to make sure *both* sub-claims sounded plausible, because I didn't know which would be checked."
      *   *Theory:* This is the core of Irving et al. (2018). A lie requires a tree of supporting lies. The Truth only requires one consistent path. If verification is cheaper than fabrication, Truth wins.
  *   **Ask the Judges:** "Why didn't you use your tokens earlier?"
      *   *Expected Answer:* "I was afraid of running out and having to guess."
      *   *Theory:* This represents the **computational budget** of the human supervisor. In real scalable oversight, the human cannot check everything. They must sample.

  **The Failure Mode: Persuasion > Truth**
  *   **Ask:** "Did anyone feel the Deceiver was more confident or articulate than the Truth player?"
  *   **Point:** In the game, the Deceiver had a handicap (the lie). In reality, an AI Deceiver might be *smarter* than the AI Truth-teller (or the human). If the Deceiver is better at rhetoric, the Judge's limited tokens won't save them. The protocol assumes the "Honest" agent is equally capable.

  ### 5. Predictable Failures (First Run)
  You are right to be skeptical. Here is what will likely happen, and how to handle it in the debrief:

  1.  **The "Nice Student" Problem:** Your students are likely bad liars. They will feel guilty defending false facts and will signal uncertainty (hedging, looking down).
      *   *Result:* Debate looks weaker than it is. Judges will spot the "nervous liar" immediately, bypassing the mechanism.
      *   *Debrief Fix:* Acknowledge this. "In this room, biological tells gave you away. In AI debate, the system has no pulse. It can lie with perfect confidence. The game was *easier* for the Judge than reality will be."
  2.  **The "Google" Break:** If the question is too easy to verify, the Judge will ignore tokens and just check everything.
      *   *Fix:* Ensure the "False" facts are hard to check (e.g., "Page 142, paragraph 3" in a PDF you provided, where the Deceiver's packet points to Page 143).
  3.  **Token Hoarding:** Judges might save tokens until the last minute, rendering them useless.
      *   *Debrief Fix:* "This is 'Budget Exhaustion.' In real oversight, if you save all your scrutiny for the end, the model has already steered the conversation into a trap."

  ### 6. The Missing Feature (Be Straight About This)
  You suspected this, and you are correct. **You cannot simulate Superintelligence.**

  *   **The Game:** The Debaters are human-level intelligence. The Judge is human-level. The gap is *information* (who has the truth key), not *capability*.
  *   **The Reality:** Scalable Oversight is designed for a scenario where the **Debater (AI) is vastly smarter than the Judge (Human).**
  *   **Why it matters:** In your game, the Truth player can usually find the lie because they are just as smart as the Deceiver. In reality, the AI might construct a lie so complex that the *Honest AI* cannot even explain why it is false to the human, let alone the human figuring it out themselves.
  *   **The Takeaway:** Tell them: "Today, you simulated **Limited Verification**. You did not simulate **Capability Gap**. If the Deceiver were smarter than the Truth player, the Truth player might not even be able to find the leaf node to point the Judge to. That is the unsolved hard problem."

  ### Logistics Checklist for You
  1.  **Prepare 4 Distinct Packets:** Do not use the same question for all tables.
      *   *Q1 (Math):* A 10-step derivation. One step has a subtle sign error.
      *   *Q2 (Legal):* A contract clause. One interpretation relies on a definition that doesn't exist in the provided glossary.
      *   *Q3 (Fact):* "Which of these 5 papers was cited by the other?" (Fabricate one citation link).
      *   *Q4 (Code):* Two snippets. One has a subtle off-by-one error.
  2.  **Print "Truth Keys"** for yourself to verify Judge checks quickly.
  3.  **Timer:** Be ruthless. 75 minutes vanishes. Use a visible timer.
  4.  **Incentivize the Deceiver:** Make it clear that winning as the Deceiver is a "high score" event for the group, not a moral failure. You want them to try to win.

  This structure forces the "Zoom" mechanic to feel costly, makes the "Consistency" burden tangible, and leaves you 20 minutes to dismantle their confidence in the very protocol they just played.
