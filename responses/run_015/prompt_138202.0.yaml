answer: |-
  The Ark Fund holds $5 billion in liquid cash and has authorized a single afternoon transaction. The Malaria Vault is a charity with an infinite backlog of verified requests; its charter mandates that every dollar received is instantly converted into exactly one dose of prophylaxis, valuing the millionth dose exactly equal to the first. Ark offers the Vault a game: a fair coin is flipped publicly until it lands heads or reaches 33 consecutive tails. If heads appears on flip $k$, Ark pays the Vault $2^{k-1}$ dollars; if 33 tails appear, Ark pays $2^{32}$ dollars ($4.29 billion). The Vault may buy any number of tickets, but all tickets resolve on the *same* coin sequence. The draw happens at 2 PM tomorrow; wires clear by 5 PM.

  ***

  **The Arithmetic**

  *   **(a) Expected Money:** The probability of ending on flip $k$ is $1/2^k$ (for $k < 33$) and the probability of 33 tails is $1/2^{32}$. Each of the 33 possible outcomes contributes exactly $0.50 to the expected value ($1/2^k \times 2^{k-1} = 0.5$). Total EV = $33 \times 0.50 =$ **$16.50**.
  *   **(b) Expected Utility (Linear):** Since $1 = 1 dose, utility is linear. Max fee = EV = **$16.50**.
  *   **(c) Median Outcome:** 50% of the time, the coin lands heads on the first flip, paying $1. The median payout is **$1.00**.
  *   **(d) Many-Plays Rule:** This rule maximizes geometric growth (Kelly criterion). Because all tickets correlate to one draw, buying more tickets scales the stake but does not reduce variance. To avoid negative geometric growth (ruin over repeated similar opportunities), the entry fee cannot exceed the typical return. Max fee $\approx$ Median = **$1.00**.

  **The Feature Doing the Work**
  The **correlation of tickets** (the single public draw). This prevents the Law of Large Numbers from applying to the player's portfolio. If you remove this feature—allowing every ticket to resolve on an *independent* coin sequence—the variance washes out over many tickets. The "Many-Plays" recommendation would then converge with the Expected Value ($16.50), closing the gap entirely.

  **The EV Maximizer's Wave-Away**
  An expected-value purist would argue: "The ticket is worth $16.50 to the *market*. If the Vault won't pay it, it should sell shares of the ticket to 1,000 different donors. The *system* captures the EV, even if the *holder* cannot." They treat the inability to diversify as a liquidity constraint, not a valuation error.

  **The Honesty Check**
  Under the strict constraints you requested (truly linear utility, no diversification, no survival threshold), the reader's "no way" reaction **cannot be vindicated**. If one dose is exactly as valuable as the millionth, and the game happens only once, refusing to pay $16.50 is irrationally leaving 15.5 expected lives on the table. The intuition that $16.50 is "too much" relies on hidden assumptions that the constraints explicitly banned.

  **The Smallest Change**
  To make the "no way" reaction rational, add a **survival constraint**: The Vault must retain enough capital to remain operational until next year's funding cycle. If a bad draw (the 50% chance of a $1 return on a $16.50 ticket) forces them to close their doors, the utility of the lost future doses is infinite. This reintroduces a *de facto* threshold, doing the work that diminishing marginal utility usually does, but grounded in organizational continuity rather than satiation.
