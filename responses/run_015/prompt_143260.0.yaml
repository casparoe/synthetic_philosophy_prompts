  Here is the mark and the feedback comments drafted for the feedback form. The total mark is 13 out of 20. For part (a) you have secured full marks, as your explanation clearly distinguishes the two intensions and correctly applies the definitions to the standard water case. Your prose is fluent and you demonstrate a good grasp of the basic machinery. For part (b) you have correctly identified that the strong actuality operator makes the primary intension constant, rendering the sentence a priori, which is the harder conceptual step here. However, you have classified the sentence as contingent, and your reasoning states that vater would pick out methane in a counterfactual world where the lakes contained methane. This contradicts the framework provided in the question, which states that the secondary intension fixes reference by what the expression picks out in the actual world. Since vater includes an actuality operator, it picks out V2O in the actual world, and therefore picks out V2O in all counterfactual worlds, making the identity necessary rather than contingent. This error in applying the definition of secondary intension costs you 4 marks on this section, leaving you with 4 out of 8.

  For part (c) your analysis of the Vician case is correct, and you rightly identify that their term lacks the actuality operator, resulting in an a posteriori and necessary profile. Your conclusion that apriority is a property of utterances or contexts rather than sentence-types is excellent and shows strong philosophical understanding. However, you summarize the profile for us in this section as a priori and necessary, whereas in part (b) you concluded it was a priori and contingent. This internal inconsistency suggests a lack of review or a confusion about the modal status you established earlier, and I have deducted 2 marks for this contradiction. This leaves you with 5 out of 7 for this part. Overall your writing is clear and you have engaged deeply with the material, but careful attention to the definitions of reference fixing in the secondary intension is required to avoid the errors seen in part (b).
