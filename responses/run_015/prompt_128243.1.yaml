answer: |-
  # The "What Do You Actually Think?" Foreknowledge Quiz

  **Instructions:** Read each case aloud. Don't worry about theological labels yet; just pick the answer that feels most logically consistent to you. There are no "right" answers, only consistent ones.

  ### Part 1: The Basics
  **1. The Courtyard Case**
  Peter denies Jesus. Before God created the world, was it *true* that "If Peter is in the courtyard, he will deny Jesus"?
  *   **A.** Yes, it was true, and God knew it before deciding to create Peter.
  *   **B.** Yes, it was true, but only because God decided this is how history would go.
  *   **C.** No, it wasn't true until Peter actually stood in the courtyard and chose.

  **2. The Priority Check**
  Did God know what you would freely do today *before* He decided to create you?
  *   **A.** Yes. That knowledge helped Him decide whether or how to create you.
  *   **B.** No. He decided to create you, and *thereby* knew what you would do.
  *   **C.** He decided to create you, but He didn't know for certain what you would do.

  **3. The Grounding Question**
  What makes it true right now that "If asked, you would say Yes"?
  *   **A.** Something about *you* (your character, dispositions, or nature).
  *   **B.** Something about *God* (His plan, decree, or sustaining power).
  *   **C.** Nothing makes it true yet; it becomes true only when you speak.

  ### Part 2: The Hard Cases
  **4. The Interdependent Choice (Ana & Ben)**
  Ana would convert *if and only if* Ben freely becomes a priest. Ben is never asked to be a priest. Is there a fact right now about whether Ana converts in that scenario?
  *   **A.** Yes, there is a specific truth about this combination, known before creation.
  *   **B.** Yes, but only because God decides the whole story, including Ben's choice.
  *   **C.** No, there's no fact about complex "what-ifs" until people actually act.

  **5. The Tie-Breaker**
  A person has two options, A and B. They are exactly equal in every way—no reason to pick one over the other. She picks A. Before she picked, was it *true* that she would pick A?
  *   **A.** Yes, something about her (even if hidden) made A the choice.
  *   **B.** Yes, God's plan settled the tie, so there was a fact.
  *   **C.** No, it was genuinely 50/50; there was no fact until she chose.

  **6. The First Moment**
  Imagine a soul created perfect, with no past history, making its very first choice. What makes it true that she *would* choose Good?
  *   **A.** Her nature as a created being grounds the truth immediately.
  *   **B.** God's design of that specific moment grounds the truth immediately.
  *   **C.** Nothing grounds it; the first choice is entirely unsettled until made.

  ### Part 3: The Implications
  **7. Feasible Worlds**
  Could God have created a world where everyone is saved?
  *   **A.** Maybe not. Some free creatures might never freely choose salvation in *any* possible world.
  *   **B.** Yes, if He wanted to. He determines the outcome, so He could have determined otherwise.
  *   **C.** Yes, but He chose not to. He didn't know for sure who would be saved anyway.

  **8. The Nature of Time**
  Does God "wait" for the present moment to happen?
  *   **A.** No. He sees all moments (past, present, future) equally in an eternal "now."
  *   **B.** No. He doesn't wait because He decided the future beforehand.
  *   **C.** Yes. He experiences time sequentially, just like us, though He knows more.

  **9. God's Own Choices**
  Does God know what *He* would have done if He hadn't sent Jesus?
  *   **A.** Yes. God knows counterfactuals about His own free actions, not just ours.
  *   **B.** No. God's actions are necessary; He doesn't have "woulds," only "wills."
  *   **C.** No. That's speculation. God only knows what He actually does.

  ***

  # Scoring Key & Analysis

  Tally your **A**, **B**, and **C** answers. Then read the profiles below to find your match.

  ### The Profiles

  **Mostly A: The Middle Knowledge View (Molinism)**
  *   **The Gist:** You believe there are truths about what creatures *would* do (Counterfactuals of Creaturely Freedom) that are logically *prior* to God's decree to create. God uses this knowledge to select which world to actualize.
  *   **Why:** You affirmed truths about free choices (Q1), placed that knowledge before the decree (Q2), and grounded it in the creature (Q3). You likely accepted limits on feasible worlds (Q7).
  *   **The "Leaf" Check:** If you answered **A on Q8**, you are a **Timeless Molinist**. You believe God knows these truths not by "foreseeing" but by seeing all time at once.

  **Mostly B: The Divine Decree View (Thomism / Classical Calvinism)**
  *   **The Gist:** You believe God knows what creatures will do because He has ordained or sustained them to do it. Knowledge of "what would happen" follows logically from God's decision of "what will happen."
  *   **Why:** You affirmed truths exist (Q1), but grounded them in God's will/plan (Q3) and placed knowledge after the decree (Q2). You likely believe God could have actualized any world He wanted (Q7).
  *   **Note:** If you answered **B on Q9**, you lean toward a view where God's actions are necessary rather than free in the counterfactual sense.

  **Mostly C: The Open View (Open Theism)**
  *   **The Gist:** You believe the future is partially unsettled. God knows everything *knowable*, but free choices aren't "true" until they are made, so even God doesn't know them beforehand.
  *   **Why:** You denied truth values to future contingents (Q1, Q4, Q5) and affirmed God experiences time sequentially (Q8).
  *   **Consistency Check:** If you answered **A on Q1** but **C on Q2**, see "Simple Foreknowledge" below.

  **Mixed A & B (Specifically A on Q1, B on Q2): Simple Foreknowledge**
  *   **The Gist:** You believe God knows exactly what will happen (Q1), but you deny He used "what-if" knowledge to *select* the world (Q2). He simply saw the timeline after deciding to create it.
  *   **The Problem:** This view often struggles with Q3 (Grounding). If God didn't decide it (B) and the creature hasn't done it yet (not A), what makes it true?
  *   **Separation:** This view is often indistinguishable from Molinism unless you insist God *could not* have used that knowledge to plan (Q7).

  ***

  # The Empty Rooms (Combinations Nobody Occupies)

  There is one logical "cell" in this quiz that is almost always empty. If you found yourself there, you should check your logic.

  **The "Divine Will Grounding / Pre-Decree Knowledge" Cell**
  *   **The Combination:** Answering **B on Q3** (Truth is grounded in God's Will) but **A on Q2** (God knew it *before* He decided/willed it).
  *   **Why It's Empty:** This is logically incoherent. If the truth of the matter depends on God's will (Grounding), God cannot know that truth *before* He exercises that will (Priority). You cannot know your own decision before you make it.
  *   **The Pressure:** People who start here usually slide into **Molinism** (shifting Grounding to the Creature) or **Thomism** (shifting Priority to after the Decree).

  **The "True But Unknown" Cell**
  *   **The Combination:** Answering **A on Q1** (It is true) but **C on Q2** (God doesn't know it).
  *   **Why It's Empty:** This denies Omniscience. If a proposition is *true*, and God is all-knowing, He must know it. This view exists in philosophy (some forms of Peircean open theism) but is practically non-existent in Christian theology.

  ***

  # The Blind Spots (Views This Quiz Can't Separate)

  Be honest with your group: this quiz cannot perfectly distinguish every historical position. Here is where the lines blur.

  **1. Molinism vs. Simple Foreknowledge (with Brute Truths)**
  *   **The Blur:** A Molinist and a Simple Foreknowledge proponent might answer identically on Q1–Q6. Both believe counterfactuals are true. Both believe God knows them.
  *   **The Difference:** The Molinist says God *used* this knowledge to select the world (Q7-A). The Simple Foreknowledge proponent says God just *saw* the world He decided to make (Q7-B/C).
  *   **How to Fix:** You need a direct commitment question: *"Did God's knowledge of your free choices influence His decision to create you?"* If yes, Molinism. If no, Simple Foreknowledge.

  **2. Thomism vs. Compatibilist Determinism**
  *   **The Blur:** Both answer **B** on almost everything. Both say God's decree grounds the truth.
  *   **The Difference:** The Thomist insists the creature is *truly free* (secondary causality). The Determinist says the creature's freedom is compatible with being fully determined.
  *   **How to Fix:** Q9 attempts to catch this, but it's subtle. To separate them, ask: *"If God knew you would sin, could He have stopped it without changing your nature or making you a robot?"*
      *   **Thomist:** "Yes, by providing different circumstances or grace."
      *   **Determinist:** "No, if He stops it, He determines the opposite. The 'could' is only hypothetical."
      *   **Honest Answer:** This quiz treats them as the same "Leaf" because, functionally, they agree on the *logic of knowledge*, even if they disagree on the *metaphysics of freedom*.

  **3. Timeless (Boethian) vs. Eternal Foreknowledge**
  *   **The Blur:** Q8 tries to separate this, but many "Timeless" advocates answer like "Foreknowledge" advocates because they use human language for divine attributes.
  *   **How to Fix:** This requires a direct definition question. *"Is God's eternity a duration without end, or a mode of being outside time entirely?"* The quiz verdict on Q8 is a strong hint, not a proof.

  ### How to Run This
  1.  **Print:** One sheet per person.
  2.  **Read:** Go through the 9 cases slowly. Let people mark their answers silently.
  3.  **Score:** Have people tally their A/B/Cs.
  4.  **Discuss:** Don't just reveal the label. Ask the "Blind Spot" questions to the people who landed on the borderline. Ask the Calvinist if he's a Thomist or a Determinist (Q9). Ask the Molinist if God was *limited* by the feasible worlds (Q7).
  5.  **Snacks:** Serve the snacks. (The Open Theist will appreciate that the future of the snack table is genuinely unsettled).
