      *   **Conclusion:** Summarize the implicit theories. Portugal = *Public Health Exception to Criminal Law*. Canada = *Strictly Controlled Market Exception to Prohibition*. Address the brother-in-law: It's not hypocrisy; it's a specific moral topology distinguishing *suffering* from *profiting*.

