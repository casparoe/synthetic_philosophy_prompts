      *   **Part 2: The Threshold (Portugal):**
          *   *The Puzzle:* Why does a heavier addict get to carry more?
          *   *Reconstruction:* The law isn't tracking the *danger of the drug* per se, but the *intent to distribute*.
          *   *Theory:* The "Personal Use" defense. It treats addiction as a chronic condition requiring a certain volume. It distinguishes the *consumer* from the *merchant*.
          *   *Your Distinction:* "Prohibiting conduct vs. prohibiting channels." This works well. It's about isolating the individual consumption from the social spread.
          *   *Underdetermination:* Is it tracking "Risk of Leakage" or "Severity of Addiction"?
          *   *Concrete Shift:* If the limit was fixed (e.g., 5g for everyone), it tracks "General Risk." If it scales with habit, it tracks "Individual Need/Status."

      *   **Part 3: The Dissuasion Element (Portugal):**
          *   *The Puzzle:* Coercive help.
          *   *Reconstruction:* This is *Soft Paternalism* or *Libertarian Paternalism* (Nudge theory, but with teeth). It assumes the user's autonomy is compromised by addiction.
