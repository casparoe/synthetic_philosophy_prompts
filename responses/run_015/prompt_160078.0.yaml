      *   **Key Subject 1: The "Split Package" (Portuguese Model):** Decriminalize use/possession (up to a threshold), criminalize supply/trafficking. State provides harm reduction (syringes, therapy) while formally proscribing the drug.
      *   **Key Subject 2: The "Legalisation Model" (Canadian Cannabis Act):** Licensed/taxed sale, possession allowed, strict advertising restrictions (no glamour, no youth appeal).
      *   **Three Specific Puzzles to Reconstruct (Portugal):**
          1.  *The Acquisition Gap:* Tolerating use but criminalizing supply. Is this circular? What is the theory of the *wrong* of supplying?
