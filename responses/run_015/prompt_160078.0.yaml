      *   *Philosophical Lenses:* Legal Moralism, Harm Principle (Mill), Paternalism (Soft vs. Hard), Legal Pragmatism, Public Health Ethics.
      *   *Portugal's Logic:* It's not "Legalization." It's "Decriminalization." The act is still *unlawful* (administratively), just not *criminal*. This is a crucial distinction. It shifts the frame from "Sin/Crime" to "Public Health/Social Order."
